# Weekly pull requests when wrangler or a GitHub Action used by the workflows has a new (or patched) version.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    target-branch: claude/deploy-reader-app-d05yd9
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: claude/deploy-reader-app-d05yd9

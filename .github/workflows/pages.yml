name: Deploy reader to GitHub Pages

on:
  push:
    branches: [main, "claude/**"]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # a new address for the app files on every deploy, so no browser cache can keep an old copy
      - run: sed -i -E "s/(app\.js|style\.css)\"/\1?v=${GITHUB_SHA::10}\"/" site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5

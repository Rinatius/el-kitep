үү формасы, бийлик институттарынын анык-"},{"t":"v","l":["У. Черчиль.","талган түзүлүштөрү болуп эсептелет.","Мамлекеттик саясый режимдин (тартип) үч түрү белгилүү:","демократиялык, авторитардык жана тоталитардык.","Демократия – грек тилинен которгондо – элдик бийлик"]},{"t":"p","h":"дегенди билдирет. Байыркы демократия монархиялык башкаруудан айырмаланып жарандарды түздөн-түз башкарышкан (түз демократия)."},{"t":"p","h":"Анда жарандар аянтта чогулушуп өз ойлорун ачык айтышкан, маанилүү чечимдерди кабыл алышкан. Байыркы демократия көпкө жашаган эмес жана охлократияга (топураган элдин бийлиги) өтүп кеткен, натыйжада залимдик (тирания) жарал-"},{"t":"h3","h":"Саясый тартип"},{"t":"p","h":"Демократиялык Тоталитардык"},{"t":"h3","h":"Авторитардык"},{"t":"h3","h":"<span class=\"pg\" data-n=\"69\">69<\/span>Демократиянын формалары"},{"t":"p","h":"Түз демократия Өкүлчүлүк"},{"t":"h3","h":"(депутаттар, делегаттар)"},{"t":"p","h":"ган. Түз демократия байыркы Греция сыяктуу кичинекей шаар мамлекеттерде гана жашай алган. Ал эми эли көп, ири улуттук мамлекеттерде түз демократия ишке ашмак эмес. Ошондуктан демократиянын башка өкүлчүлүк формасы пайда болуп демократия түз жана өкүлчүлүк формаларга бөлүнгөн. Түз демократияда негизги чечимдер жарандар тарабынан түздөн-түз чогулуштарда, референдумда, шайлоолордо, митингдерде чечилет. Өкүлчүлүк демократияда болсо, негизги чечимдер элдин өздөрү шайлаган депутаттар, делегаттар тарабынан кабыл алынат. Демократиянын аныктамалары өтө эле көп. Алардын негизгилеринин бири болуп: Демократия – бул элдин эл аркылуу жана эл үчүн башкаруусу болуп эсептелет. Бул аныктаманы АКШнын президенти Аврахам Линкольн берген. Мында эл деп бардыгы – байлары, кедейлери, шаардыктары жана дыйкандары жөнүндө айтылган."},{"t":"p","h":"Азыркы мезгилдеги демократиянын шарттары Англиялык (1640) революциянын, АКШнын көз карандысыздык үчүн күрөшүнүн (1776), Франсуз революциясынын (1789) жүрүшүндө негизделген. Анда бардык адамдардын мыйзам алдында тендигине, эркиндигине негиз салынган."},{"t":"p","h":"Әгерде биз демократиянын принциптерине жана баалуулуктарына көңүл бурсак, анда демократиялык система кандай иштээрин, алар өзүнө кандай принциптерди жана баалуулуктарды камтырын билсек болот."},{"t":"v","l":["Демократиянын принциптери:","1. Әл бийлиги.",". Шайланган өкмөт.",". Азчылыктын укуктарынын корголушу."]},{"t":"p","h":"Адам укуктарынын жана эркиндиктеринин гарантиясы. Әркин жана акыйкат шайлоолор."},{"t":"v","l":["Мыйзам алдында бардыгынын тендиги.","Көз карандысыз сот."]},{"t":"p","h":"<span class=\"pg\" data-n=\"70\">70<\/span>Демократиялык"},{"t":"h3","h":"Мүнөздүү белгилери"},{"t":"v","l":["Мамлекеттик өкүлчүлүк жана жергиликтүү","өзүн-өзү башкаруу органдарын жашыруун добуш","берүү жолу менен шайлоо","","Парламентте жалпы мамлекеттик","мыйзам чыгаруу укугунун болушу","","Бийликтин үч бутакка: мыйзам чыгаруу,","аткаруу бийлиги, сот бийлигине","бөлүштүрүлүшү"]},{"t":"p","h":"<span class=\"pg\" data-n=\"71\">71<\/span>саясый режим"},{"t":"h3","h":"Иштөө кепилдиктери"},{"t":"p","h":"Мамлекеттик органдардын жана аппараттардын ишмер-"},{"t":"v","l":["дигине, жарандык коом тарабынан көзөмөл кылуу","системасын түзүү","","Бийликке ээ болуу менен байланыштуу болгон өзгөчө","артыкчылык системаларын жоюу","","Жарандарга өз учурунда саясый маалыматтарды","толук берүү мүмкүнчүлүгү","","Депутаттарды кайра чакырып алуу жана","чиновниктерди алмаштыруу","","Жарандардын тең укуктуулугунун кепилдиги,","бийликти жана анын өкүлдөрүн сыңдоо укугу","<span class=\"pg\" data-n=\"72\">72<\/span>8. Плюрализм.","9. Көз каранды эмес ММК.","10. Кызматташтык."]},{"t":"p","h":"11. Жарандардын саясый партияларды, коомдук уюмдарды түзүү мүмкүнчүлүктөрү."},{"t":"p","h":"Демократия өзүнө адамдардын бардык баалуулуктарын да камтыйт."},{"t":"v","l":["Демократиянын баалуулуктары:","1. Теңдик.","2. Адилеттүүлүк.","8. Башкарууга катышуу.","4. Укуктар менен эркиндиктердин бузулгустугу.","5. Адам өмүрү.","6. Әркиндик.","@. Жекече турмуш.","8. Жарандык.","9. Бийликтин эл алдында эсептешип турушу.","10. Өз алдынча башкаруу.","11. Адилеттүү сот.","12. Плюрализм."]},{"t":"p","h":"18. Бийликти кыянаттык менен пайдалануудан коргонуу. Демократиялык лидерлик:"},{"t":"p","h":"Бийлик, уюм, мекеме жарандык коомдор болгон жерлерде дайыма лидерлик келип чыгат. Коомго, мамлекетке, уюмга, дайыма таасир көрсөтүп туруучу инсан саясый лидер деп аталат."},{"t":"p","h":"Лидерлик эки түргө бөлүнөт: жөнөкөй жана улуу лидерлик. Жөнөкөй лидер өнүгүүнүн багытын өзгөртпөстөн башкарат да, тарыхта сакталып калбайт. Улуу лидерлер тарыхый өнүгүүнүн багытын өзгөртүшөт да саясый жана социалдык толкундоолорду пайда кылуу менен тарыхта калышат. Мындан сырткары лидерлик авторитардык жана демократиялык болуп эки типке бөлүнөт. Авторитардык лидерлик коркутууга жана күч колдонууга таянып, жеке бийлөөчүлүк менен иш алып барат. Демократиялык лидерлик уюмдун же топтун мүчөлөрүнүн кызыкчылыктарын жана ойлорун эске алуу менен башкарат, аларды башкарууга тартат."},{"t":"p","h":"Демократиялык коомдун өнүгүшүндө демократиялык лидерликтин да ролу чоң. Демократиялык лидер көпчүлүктүн оюн угуп мамиле түзө алат. Алардын жетекчилиги астында элдердин жигердүүлүгү менен өз алдынчалыгы артат. Демократиялык <span class=\"pg\" data-n=\"73\">73<\/span>лидер дегенге аныктама берүү өтө кыйын. Жалпысынан айтканда, бул көпчүлүк тарабынан шайланып, азчылыктын укуктарын сактаган, элдин кызыкчылыктары үчүн аракеттенген жетекчи."},{"t":"v","l":["Демократиячыл саясый лидердин сапаттары:","* Саясый плюрализм;"]},{"t":"p","h":"* Коомдо жарандык укуктар менен эркиндиктердин бар болушу;"},{"t":"p","h":"* Бийликтин бөлүштүрүлүшү, иш-аракеттин айкындыгы;"},{"t":"p","h":"* Укукчул мамлекетти куруу;"},{"t":"p","h":"– Саясый маданиятынын жогорулугу;"},{"t":"p","h":"Лидер – бул көндүрүү же үлгү көрсөтүү, туура чечим кабыл алуу жолу менен элди өз артында ээрчитип кете алган адам: бул жеке максатка же бардык топтун максаттарына жетишүү үчүн, топко таасир эте алган адам."},{"t":"p","h":"Ар бир адам лидер болуш үчүн төмөнкүдөй сапаттарга, мүнөзгө жана жөндөмдүүлүктөргө ээ болушу керек:"},{"t":"v","l":["* Адамдарга бирдей урматтоо менен мамиле кылуу;",". Акылмандык;","* Жигердуулук;","Тартипти сактоо;",". Кайраттуулук;","* Билимдүүлүк;",". Демократиялуулук;",". Уга билүү;",". Жөндөмдүүлүк;",". Талап кыла билүү;","* Демилгелуулукту көрсөтүү;","* Аракеттенип иштөө;",". Сабырдуулук;","Өз ишин жакшы билүү;"]},{"t":"p","h":"* Позитивдүү болуу (иште жана адамдар менен кызматташууда оң учурларды издөө);"},{"t":"p","h":"* Жоопкерчиликтуулук; Жогорку интеллектуалдуулук;"},{"t":"p","h":"* Маектешүүнүн жүрүшүндө өзүнө суйменчулукту пайда кыла билүү;"},{"t":"v","l":["* Команда менен иштей билүү;","* Чечкиндүүлүк;",". Мамиле түзө билүү;","Өз алдынчалуулук;","<span class=\"pg\" data-n=\"74\">74<\/span>. Өз көз карашына элди ынандыра билүү;","Әрктүүлүк;","Уюштургуч;","Команданы артынан ээрчите алуу.","","Кайталоо үчүн суроолор","% 1. Демократия түшүнүгү жана анын формалары."]},{"t":"p","h":"2. Демократиянын негизги принциптери жана баалуулуктарын окуп-"},{"t":"p","h":"талдап чыгып, ар биринен эң маанилүү деп эсептеген 5—бны тандап, 25 алардын маанисин тушундуруп бер."},{"t":"p","h":"3. Демократиялык лидер жана лидер женунде тушунук. Лидердик"},{"t":"p","h":"сапаттардын өзүңдө кайсынысы бар.экендигин аныкта."},{"t":"p","h":"4. Демократия бул элдик бийлик дегенге таянып, Кыргызстанда"},{"t":"p","h":"демократиянын бар экендигин далилдеген мисалдарды келтир."}],"sub":[{"title":"Саясый тартип","b":16},{"title":"Авторитардык","b":18},{"title":"Мүнөздүү белгилери","b":29},{"title":"Иштөө кепилдиктери","b":32}],"section":"ШГЛАВА","pages":[68,74]},{"title":"§§ 19–20. АНТИДЕМОКРАТИЯЛЫК ТАРТИПТЕР","blocks":[{"t":"h3","h":"§§ 19–20. АНТИДЕМОКРАТИЯЛЫК ТАРТИПТЕР"},{"t":"v","l":["Т үш үн үктөр:",". Тоталитардык.","Авторитардык.","","Тапшырма:",". Диссидент.","* Аскердик диктатура."]},{"t":"p","h":"‚ Кыргызстанда антидемократиялык тартиптер кайсы жылдары өкүм сүргөн, алардын бири-биринен кандай өзгөчөлүктөрү бар?"},{"t":"p","h":"+ Франциянын демократиялык лидери (Премьер-министр) Клемансо «бардыгы көп сүйлөгөн өлкөгө даңк, бардыгы унчукпаган өлкөгө маскарачылык» – деп айткан. Мында сөз эмне жөнүндө болуп жатат?"},{"t":"p","h":"Мамлекеттик саясый режимдердин тоталитардык жана авторитардык режимдери антидемократиялык режимдерге кирет."},{"t":"p","h":"Алар демократиянын принциптеринен баш тартат жана жеке адамды басынтууга негизделет."},{"t":"p","h":"Кайсы бир топтордун же партиялардын диктатурасын орнотот. Диктатура – бул адамдын же адамдар тобунун мажбурлоо жана зомбулук жолу менен бийликке келиши. Антидемократиялык тартипке төмөнкүлөр мүнөздүү болот:"},{"t":"p","h":"1. Мамлекеттин жарандардын жеке турмушуна кийлигишүүсү."},{"t":"p","h":"<span class=\"pg\" data-n=\"75\">75<\/span>2. Жарандардын мамлекеттин саясатына таасир этүү мүмкүнчүлүгүнүн чектелиши."},{"t":"p","h":"8. Чыныгы саясый укук жана эркиндиктердин жоктугу, же алардын чектелиши."},{"t":"p","h":"4. Бийликти бөлүштүрүү принцибинен баш тартуу."},{"t":"p","h":"5. Жарандардын негизги укук жана эркиндиктерин чектөө."},{"t":"p","h":"6. Парламенттин бийлик укуктарын чектөө."},{"t":"v","l":["7. Бир партиялуулуктун өкүм сүрүшү.","8. Басма сөз эркиндигин жоюу."]},{"t":"p","h":"Ал эми монократияда болсо мамлекеттик бийликке бир адам шайлоо жолу менен (алдап коюшу да мүмкүн) келет. Бирок ал адам өзү өлкөнү жалгыз башкарат да иш жүзүндө диктатор болуп калат. Мисалы, Индонезиянын мурунку президенти Сухарто, Конгонун мурунку президенти Мабуту, Африка өлкөлөрүндөгү көптөгөн башкаруучулар."},{"t":"p","h":"Тоталитардык саясый режим Тоталитардык режим латын сөзүнөн которгондо «бардык», бүткүл», «толук» дегенди билдирет. Тоталитаризм – бул саясый режим. Анда мамлекет коомчулуктун жана ар бир адамдын жашоо турмушуна толук жана чексиз көзөмөл жүргүзөт. Тоталитардык режимде бийликти уюштуруунун принциптери:"},{"t":"p","h":"1. Әлиталар же бир адам башкарган чакан адамдын тобунан бардык деңгээлде бийлик жабык түзүлөт. Тоталитардык режимде коомчулуктун үстүнөн толук көзөмөлдүк орнотулат. Адамдын жеке турмушуна кийлигишүүлөр болот. Тоталитардык мамлекетте бийлик толугу менен жетекчинин, элиталардын же партиялардын колуна топтоштурулат."},{"t":"p","h":"2. Тоталитардык мамлекетте мыйзам чыгаруучу, аткаруучу сот бийлиги бир адамдын же адамдар тобунун колунда болот. Ошону менен бийлик көзөмөлдөөсүз ишке ашырылат."},{"t":"p","h":"8. Өкмөт эч бир шайлоо органдарынын алдында жоопкерчиликтүү эмес."},{"t":"p","h":"4. Әкономикага мамлекет тарабынан катуу көзөмөл жүргүзүлүп, мамлекеттик эмес менчиктердин бардыгы жоюлат."},{"t":"p","h":"5. Тоталитардык тартипте, коомдук турмуштун бардык областтарында: маданият, илим, билим, мамлекеттин ички, тышкы саясаттары бир максатка гана баш ийдирилет. Ошону менен биринчи кезекте мамлекеттин кызыкчылыгы эске алынып жеке адамдын турмушу көңүлгө алынбай калат. Мисалы, Германияда фашизмдин максаты, улуттарды раса-"},{"t":"v","l":["<span class=\"pg\" data-n=\"76\">76<\/span>Тоталитардык режим","","Бул саясый режим. Ар бир адамдын","турмуштун үстүнөн абсолюттук көзөмөл"]},{"t":"raw","h":"<h4 class=\"mk\">Келип чыгуу себептери Революция Аскердик төңкөрүш Ички карама-каршылык Сырттан таңуулоо<\/h4>"},{"t":"p","h":"Кандай шартта"},{"t":"v","l":["калыптанган","","Эскирген социалдык","түзүлүштүн талкаланышы","","Саясый бийликтеги кризис","","| Жарандык коомдун кыйрашы","","Саясый аң сезимдин","өзгөрүшү","<span class=\"pg\" data-n=\"77\">77<\/span>жана бүтүндөй коомдук","орнотууга аракет кылат","","Орношуунун","негиздери","","Жаңы ММКнын пайда болушу","жана аларды керектөөчүлөрдүн","калыптанышы","","Коомдук-саясый жана социалдык","процесске таасир этүүчү","партиялардын түзүлүшү","","Коомду мамлекеттик башкарууда","тажрыйбанын топтолушу","","Репрессия жана күч колдонуучу","бийлик аппараттарын түзүү","мүмкүнчүлүгү"]},{"t":"p","h":"<span class=\"pg\" data-n=\"78\">78<\/span>илєиләң 191елтияед иАБНО ивиаелинето1 жчивинеши) ‘ивитеф лигпешен"},{"t":"img","src":"data:image/w шына чейин өкүм сүргөн. Сталиндин мезгилинде бүтүндөй бир элди репрессиялап, байыртан бери жашап келе жаткан жерлеринен айдап жиберишкен (чечендер, немецтер, түрктөр ж. б. элдер)."},{"t":"p","h":"Аларга эл душманы деген жалган күнөө коюлган. Кыргызстандагы «Чоң-Таш» кайгылуу окуясы дагы ошол мезгилге тиешелүү. 1988-жылы ноябрда 187 адам өлүм жазасына тартылып, Таш-Дөбө айлында кирпич заводунан калган мешке ташталган. Алар саясый күнөө коюлуп, репрессияга кабылган, кыргыз, орус, немец улутундагы адамдар болгон."},{"t":"p","h":"Алардын арасында Кыргызстандын мурдагы жогорку саясый жетекчилери дагы болгон. Мисалы, Ж. Абдрахманов, Б. Исакеев, Т. Айтматов, К. Тыныстанов ж. б."},{"t":"img","src":"data:image/webp;base64,UklGRi6ZAABXRUJQVlA4ICKZAACw6wGdASqOAUwCPrFIm0mnJCIhMpf76OAWCWlrJd+Lu0++N/72kRLskYeV880AeBPEs/Z7CLIB4/f+jx2ZNrMgivZHDGEI3osOJZl3tN+ALYFyKOCeaKzrvtuJZX/VftV//rrdrlsnn/6f+2v7qH6s38T6eL07bWU8960/1D85/7/7T23P9jDn814Df3j+3/+/Yn2O/wn+n6Bd3nsmey/+/oF4O/+vmd/Vf+z1L/8/ihP4fqG+Tp/0////z+or99/9X71+75/2/3r7f6p5N3LFVS0ygxR36ixuBbrszkwo5CKxpU6rzx/bdiYWGEGm2bwFRKZBvdTjUHAahJ/k+K1Mcm6x34wSJWnjZTlC8Voipq1nJvFKPLXWulUJ3nssK/lyAcW7JOAme5HNf75PXmUqu9mLIB7/wT8QGbkJI6ehgH55PZHVrIiDPfAiXYUel/zNCReFf2VdYQAR4p/5IQXeMGYo3zxpaO4E6+Hp+6AG9CRMo7B4maiqzmp/SvQIMNwP1+hQ22+/Se7bkFYyGwvCWNqYAsBIQXEHG1Q3543QuEV6arabZIUgebMGbw4kfbv5rrZM4wjP/PDdSfHQKzsmnBua0cWQlOqMr5jfIjN7jqANxrbmM1Sui4Ic3FyiZrJPqJlJSYchJV4PtHuFw0Ink+ptZvxjzBIP7oqLMT22mqDd9oiK0YV39V14aDsgBHxnxOJ69PyTWoZEryPzZr393nOlQO1g3O3F71axTLQDPkLJ2fRNKMeDD9ieapxhhHv7iZgWSMgqsYYB3Gm38SHKCZoWfhsJ+xvgFhYWoWgY77ASf24So7ZR74QYLqhEJGcIgxWTcVKc7NX59E4ngGoEglwQqtDfskatWIeNDrf7yYTn2g2NWV8QogSjgdLXZAIvQ63Kt4mznPORYds5RqhGLGG6TAnJYAlQWg846J2q4Hkfz+mneO1fUDCZ5V1jfc1lu2ZN567Od8lZ7ORDgJ8Op40/v2U7kq1LVJQKCKyoq64w252aDlU+EwAFJtV4A6w+tGgpnJQd/zORzd2DX97THdHA3I5DCqhme2gGvzz4QGeo5TEmSjEH0GWVb9H3NSTPkimi/XUqKbCdzgGL6ZenIN+8T1bPCckms3z7J/8yl+Wmq3wFSVsOWDvqukUF3SA88NLkpoagRNO7vbvoRJjnIszuEcZ7NWvP7hy71OGWwpCTPKEdnIBrkGcEKVRiyRzArjUv8qwklesiMhEArar0ZU7SY1CU0NV4Q  (шайлоо, парламенттик күрөш).","<span class=\"pg\" data-n=\"81\">81<\/span>режим","адам же көп эмес адамдар тобу","социалдык топ) башкарат.","","Тоталитаризмден айырмачылыгы","","Бирдиктүү так иштелип чыккан жетекчи","идеологиянын милдеттүү түрдө болбогону","","пз алдынчалыкты жана демилгелүүлүктү колдоо, жеке","адамдын турмушуна кийлигишпөө","","Саясый бийликтин башкы аргументи күчтүүлүк","эмес авторитет болуп эсептелет","","Саясый ой-пикир жана иш-аракеттерде чектелген,","кеземелге алынган плюрализм жана оппозицияга","жол берилет","","Ар кандай чөйрөдөгү жетекчилик анча деле тоталдуу","эмес. Жарандык коом, профсоюз, ММК ж. б. үстүнөн","катуу көзөмөл деле жок","","Бийлик үчүн болгон саясый атаандашууда,","маанилүү маселени чечүүдө элдин катышуусуна","катаал мамиле жасайт"]},{"t":"p","h":"<span class=\"pg\" data-n=\"82\">82<\/span>дык катмарларын өзүнө тарткан. 1988-жылы шайлоодо бийликке келип, тоталитардык режимди орноткон."},{"t":"h3","h":"Авторитардык саясый режим"},{"t":"p","h":"Авторитардык режим – бул жеке адамдын же анча көп эмес адамдар тобунун башкаруусу. Авторитаризм (лат. – бийлик, таасир) бул тоталитардык жана демократиялык режимдердин ортосундагы абалды ээлеп демократияга каршы бийлик жүргүзөт. Авторитардык режимде аткаруу бийлиги катуу өнүгөт. Өкүлчүлүк институттардын ролу чектелген болот."},{"t":"p","h":"Ошону менен мамлекеттик бийлик элдерден баш ийүүчүлүктү жана аларды угушун талап кылган. Авторитардык режимде бардык чечимдер коомчулуктун ой мүдөөсү эсепке алынбастан кабыл алынат. Бийликти ишке ашырууда авторитардык режим демократиядан айырмаланып турат. Демократиялык лидер көпчүлүктүн ой мүдөөсүн кабыл алып, өз ара келишүүчүлүккө көңүл бурат. Демократиялык лидердин жетекчилиги астында элдер өзүн эркин сезип, жигердүүлүгүн көрсөтүшөт. Авторитардык режимдин айырмасы жетекчилер буйрук берүүчү мүнөзгө ээ."},{"t":"p","h":"Бирок авторитардык жетекчилик коомдук турмушта тоталитардык режимге караганда анча катуу эмес. Авторитардык мамлекетте оппозицияга жол берилет. Бирок бийликке коркунуч келтирбеген деңгээлде болуш керек. Жарандарга маданий жана экономикалык турмушта өз алдынчалыкты көрсөтүүгө мүмкүндүк берилет. Бирок ошол эле убакта саясый турмуштан саясый укуктар ажыратылган болот. 1970-жылы мурдагы СССРде «диссидент» аттуу кыймыл пайда болгон. «Диссидент» бул латын сөзү «макул болбоо» дегенди билдирет. Бул кыймылдын өкүлдөрү саясый укуктун, маалымат эркиндигинин, адам укуктарынын бурмаланышына макул болушкан эмес. Алардын каршы чыгуулары күч колдонуучу мүнөздө болбосо да, баары бир аларды куугунтуктап, түрмөгө олтургузушкан."},{"t":"p","h":"Авторитардык тартиптин дагы бир түрү аскердик-диктатордук система. Мындай системада конституция жоюлуп, аскердик бийликтин актысы менен алмаштырылат. Бийликтин өкүлчүлүк органдары, саясый партиялар, коомдук уюмдар таркатылат. Жергиликтүү өзүн-өзү башкаруудагы шайлоолор жоюлат."},{"t":"p","h":"<span class=\"pg\" data-n=\"83\">83<\/span>Кайталоо үчүн суроолор % 1. Антидемократиялык режимдер жана алардын демократиялык"},{"t":"p","h":"режимдерден айрымачылыктары."},{"t":"p","h":"2. Тоталитардык режимдин бийликти уюштуруудагы принциптеринен 1 мисал келтиргиле. Азыркы учурда Кыргызстанда же башка өлкө-"},{"t":"p","h":"лөрдө алар кездешеби? Салыштырып, өз оюңду айтып бер. з. Авторитардык жана аскердик-диктатуралык режимдердин кандай"},{"t":"p","h":"өзгөчөлүктөрүн билдиң?"},{"t":"p","h":"4. Дептериңди 4кө бөлүп алып, демократиялык, тоталитардык, авто-"},{"t":"p","h":"ритардык, аскердик-диктатуралык саясый режимдердин айырмачылыктарын талдап, жаз."}],"sub":[{"title":"Авторитардык","b":35},{"title":"Авторитардык саясый режим","b":38}],"section":"ШГЛАВА","pages":[75,83]},{"title":"§§ 21–22. КООМ ЖАНА ЖАРАНДЫК КООМ","blocks":[{"t":"h3","h":"§§ 21–22. КООМ ЖАНА ЖАРАНДЫК КООМ"},{"t":"p","h":"Т үш үн үктөр:"},{"t":"raw","h":"<h4 class=\"mk\">* Жаран.. Жарандык коом.<\/h4>"},{"t":"p","h":"* Жарандык."},{"t":"p","h":"* Коом жана коомдук мамилелер. Жарандык коомдун * Жаран менен жарандыктын элементтери. айрымасы."},{"t":"p","h":"Тапшырма:"},{"t":"p","h":"Жарандык сапаттарды жана жарандык жигердүүлүктөрдү аныктап бер."},{"t":"p","h":"– Жарандык коомду кандай түшүнөсүң?"},{"t":"p","h":"* Сен окуган же жашаган аймактарда жарандык коом барбы? Алар кандай иштерди аткарууда?"},{"t":"p","h":"* Аль-Фарабини эмне үчүн «экинчи мугалим» деп аташкан жана ал жаран таануу илиминин максатын кандайча чагылдырган?"},{"t":"p","h":". Аль-Фарабинин бакыт жана бактысыздык жөнүндө айткандарына кошумчалап, өз көз караштарынды далилде (чыгармадан үзүндү окуп бер)."},{"t":"p","h":"Аль-Фараби (870—950-жж.) түрктөрдүн улуу философу Фараб шаарында (Түштүк Казакстан) атчан гвардиянын өкүлүнүн үй-бүлөсүндө төрөлгөн. Ал Фараб, Багдад, Каир, Дамаск ж.б. шаарларда билим алган жана иштеген."},{"t":"p","h":"Т0ке жакын тил билген, акылмандыгы үчүн «Әкинчи мугалим» деп аталган (биринчи мугалим деп грек окумуштуусу Аристотелди эсептешкен). Аль-Фарабинин коомду таанууга арналган эмгектери мусулман дүйнөсүндөгү көптөгөн окумуштуулардын <span class=\"pg\" data-n=\"84\">84<\/span>иликтөөлөрү үчүн негиз болгон. «Бейкут шаардын жашоочуларынын көз караштары тууралуу трактатында» идеалдуу коомдун үлгүсүн түзүүгө аракеттенген."},{"t":"p","h":"* Аль-Фарабинин чыгармасынан бул үзүндүнү окугула: Жаран таануу илими эрктуулукту талап кылган иш-аракеттердин жана жүрүм-турумдун түрлөрүн; ушул иш-аракеттердеги жүрүм-турумдун түрлөрүнө өбөлгө болуучу сапаттарды, адаттарды, тубаса пейил жана мүнөздөрдү; алардын көздөгөн максаттарын иликтейт. Адамдын ал сапаттары кандай болууга, кандайча өнүгүүгө жана кантип сакталууга тийиш экендигин иликтейт. Ал булардын кайсылары чыныгы бакытка жеткирээрин, кайсылары бактысыздыкка азгырып кетерин түшүндүрөт. Жаран таануу илими жүрүм-турумдардын түрлөрүн айырмалап көрсөтөт. Ал, мисалы, чыныгы бакыт – бул изгилик, мээримдүүлүк жана ар-намыс экендигин, жалган, азгырма бакыт – бул байлык, атакдаңк экендигин түшүндүрүп берет."},{"t":"p","h":"Коом жана коомдук мамилелер Коом деген түшүнүк илимий жана күндөлүк сөздөрдө көп эле колдонулуп жүрөт. Мисалы, китеп сүйүүчүлөр коому, дворяндык коом, педагогикалык коом. Бул учурда коом деп адамдардын белгилүү бир тобун түшүнөбүз, алар өз ара катнашуу, биргелешип иштөө, өз ара жардамдашуу үчүн биригишет. Ошондой эле өз ара байланыштуу түшүнүктөр да бар. Мисалы, алгачкы жамааттык коом, феодалдык коом десек, анда коом деген түшүнүк аркылуу адамзаттын тарыхый өнүгүшүнүн белгилүү этабын түшүнөбүз. Тагыраак айтканда, бүтүндөй адамзат өзүнүн тарыхый жана перспективалуу өнүгүшүндө коом деп аталат. Бул учурда коом – жердин бүткүл калкы, бардык элдердин жалпылыгы болот."},{"t":"p","h":"Әкономикалык, социалдык, саясый, маданий турмуштун жана ишмердиктин жүрүшүндөгү байланыштар коомдук мамилелер деп аталат."},{"t":"p","h":"Кээ бир коомдук мамилелер материалдык өндүрүш чөйрөсүндө түзүлөт, кээ бирлери коомдун рухий турмушуна таандык болот. Материалдык өндүрүш чөйрөсүндөгү коомдук мамилелер коом үчүн жашоонун жана өнүгүүнүн материалдык мүмкүндүктөрүн камсыз кылат. Ал эми руханий чөйрөдөгү коомдук мамилелер (идеологиялык, саясый, юридикалык, нравалык ж. б.) руханий-маданий байлыктарды түзүү, жана жайылтуу процессинде, адамдардын өз ара аракетинин натыйжасы жана шарты <span class=\"pg\" data-n=\"85\">85<\/span>болуп эсептелет. Ошону менен бирге материалдык жана руханий мамилелер өз ара байланышта болот да, коомдун өнүгүүсүн камсыз кылат."},{"t":"p","h":"Жарандык жана жарандык коом Жарандык деген эмне жана анын кандай мааниси бар экендигин аныктоо үчүн, адегенде жаран деген сөз эмнени билдирээрин билүүбүз керек."},{"t":"p","h":"Жаран – бул кайсы бир мамлекетке берилгендигин сактоого милдеттүү жана ал өлкөдө туулгандыгына байланыштуу ошол мамлекеттин коргоосунда болууга укугу бар адам. Жаранга тиешелүү укуктар берилет. Демек, жарандык – бул жарандын статусу (укуктук абалы). Ал статус ага укуктарды жана артыкчылыктарды берет жана бир далай милдеттерди жүктөйт. Саясый укуктар менен эркиндиктер жарандарга гана берилет. Жарандык – бул адамдын кандайдыр бир мамлекетке таандык экендигин билдирет."},{"t":"p","h":"Жарандыктын далили болуп паспорт же туулгандыгы тууралуу күбөлүктүн бар экендиги эсептелет. Адам төрөлгөн күндөн баштап эле жарандык укуккка ээ болот. Ошондуктан, өкмөт адамга жарандык укугун бере албайт. Кимдир бирөө өз жарандыгын өзгөртүүнү каалап арыз берген учурда гана өкмөт жарандык берет. КРнын Конституциясында кимдер жаран болуу укугуна ээ экендиги даана көрсөтүлгөн. Ошондой эле жарандын укуктары да Конституцияда каралган. Көпчүлүк өлкөлөрдө бирден гана жарандыкка ээ болуу укугу бар."},{"t":"p","h":"Жарандык коомдун пайда болушу баарыдан мурда белгилүү укук жана эркиндикке ээ болгон өз алдынча көз карандысыз жарандардын келип чыгышы менен байланыштуу."},{"t":"p","h":"Жарандык коом деп коомдук турмушта адамдар өздөрүнүн жекече максаттары менен керектөөлөрүнө жараша өз алдынча эркин байланышта болгон чөйрө аталат. Жарандык коом – мамлекеттин алкагынан сырткары жана мамлекеттин кийлигишүүсүз өнүгүп жаткан инсандар ортосундагы мамилелердин жыйындысы болуп эсептелет. Ошондой эле мамлекетке көз каранды эмес коомдук институттардын системасы."},{"t":"img","src":"data:image/webp;base64,UklGRhRNAABXRUJQVlA4IAhNAACQHwGdASo7AW8BPrFKnEmnJKKmshb8KOAWCWcA0X7uIc1/3++kxv9h58//T/mNe2o+3v/MeCP4185/n/7h/nf2T+ML6IyB+afxH7Peov8t/C39H+/fv/69/sb4m/mX7j/5P9D7Av5Z/WP2G9SX7TsV9r/13oC+8fv75nXyfmb+cf5T2A/6P/g/Ubvp6A3kr/5nml/Sv+Cj6lyTY/jHdzoYqG7MjK/gheyoJfPTtG9f2Fyhv4I6lddYfQyUNp3snwsnucsCHn/eL6jSZX/naVXHrgcCz4qCSWTjXooWXR7hrO5Q6QGMf712+7T8Ims16HJFDwBn1Jejs4GjK5TNXxeVQ8IGt5qMCr9NrPx7LHsyH2Rc1kRnVwLdIupK6ccgBAR/xfyi6uFCHlQTusyXqnp7rMZU+BxBPToMz7P/IOWWkbpnE779D0AGFToLTHyuiHzeMrKK/A0IAs7i+P9KgQOCovLD9s8QxTJ+aaTR5SMl3qkiBh8iTAN7fMVZcxNCRmQEu9fEDPyVHx8IaCw+MfyxkPuBnkE83bhhmONQRAj6wCWXfaRzsispqRImhQtB6pw/8fA34n6kN6ybBdso6fZNw+7o58EeGyTBSFNXbSTVxkf2aE3n3BKGmn6S/kQ4ElF1sFJwQ8BrdpZdCTD6+gfaG/hUcj60s3MA4OE3t8nC8dZegG/mD05HetlqIoJLEyCLFcNWrVtW6kI48Ks1WJGHgV+WVwDrF8MLPBtxqOwEqAXBgGESeySWbW0CC17ckHM/KkF02oY5QR/D догу адеп-ахлак маселелерине кайрылып, ХЇХ кылымдагы жарандык билим берүү жөнүндө ой жүгүрткөн, адам укуктарын коргоо зарылдыгын айтып, адамды кулга айландыруу- Тоголок Молдо. ну күнөөлөгөн."},{"t":"p","h":"Молдо Нияз Кадамжай районундагы Кызыл-Булак деген жерде туулган. Ал алгачкы жазгыч акындардын бири, Кокон хандыгында билимдүү жана акылдуу адам катары кадыр-баркка ээ болгон."},{"t":"p","h":"Толок Молдо дагы коомдогу болуп жаткан өз ара мамилелердеги адилетсиздикке, теңсиздикке, жалганчылыкка, зордук-зомбулукка, жалпысынан алганда моралсыз жүрүмтурумга жана алардын жакшылыктарга үстөмдүк кылып турганына нааразы болгон. Ал илгертен бери «адамдардын жашоо турмушун коштоп келе жаткан моралдык илдеттерден адам баласы качан арылат», деп санаа тарткан. Ал өзү жашаган коомдогу ошол кемчиликтерди жоюуга өз салымын кошууга аракет кылган."},{"t":"p","h":"Тоголок Молдо акын чыгармачыл инсан катары башкалардан өзгөчөлүгү, анын коомдогу моралдык илдеттерди, терс көрүнүштөрдү сындап ашкерелөөдө каймана маанидеги көркөм образдарды тамсилдерде, жомоктордо сүрөттөй билгендигинде болуп эсептелет. Кийин саясый системанын авторитардык мезгилинде жарандык коом бузула баштаган. Азыркы мезгилде 2000ден ашык өкмөттүк эмес коомдор бар. Чыныгы жарандык коомдор көп партиялуулукка таянат. Мамлекет менен жарандык коомдун өз ара карым-катнашы саясый партиялар, эл аралык уюмдар, кысым көрсөтүү топтору ж. б. аркылуу ишке ашат."},{"t":"p","h":"«Жарандык коом» – бул мамлекеттик бийликтин кийлигишүүсүнөн коргогон мыйзамдары бар, эркин жарандардын жана алардын топторунун бирикмелеринин жашоо чөйрөсү. «Жарандык коом» терминин Аристотель киргизген. Ал жарандык коом деп, белгилүү бир саясый түзүмдүн"},{"t":"h3","h":"<span class=\"pg\" data-n=\"87\">87<\/span>Жарандык коом"},{"t":"p","h":"Дептериңе кластер табышмакты аткар:"},{"t":"p","h":"«Жарандык коомдун элементтери»"}],"sub":[{"title":"Жарандык коом","b":28}],"section":"ШГЛАВА","pages":[84,87]},{"title":"Саясий партиялар","blocks":[{"t":"h3","h":"Саясий партиялар"},{"t":"h3","h":"Жарандык коом"},{"t":"p","h":"Саясый кыймылдар"},{"t":"p","h":"Чыгармачыл"},{"t":"v","l":["ассоциациялар","уюмдар","Билим берүү","чөйрөсү","Коомдук"]},{"t":"p","h":"түрү аркылуу байланышкан эркин тең укуктуу жарандардын биримдигин атаган. XVII-XVIII кылымдарда жарандык коом түшүнүгү абсолюттук-феодалдык мамлекетке каршы мааниде колдонулган. Азыркы мааниси боюнча, бул сөз демократиялык коомдун алкагында, мамлекеттен көз карандысыз өнүгүүчү экономикалык, маданий, саясый ж. б. чөйрөлөрдөгү мамилелердин жыйындысын билдирет."},{"t":"p","h":"Жарандык коомдун элементтерине ММК, өкмөттүк эмес уюмдар (НПО) диний бирикмелер, партиялар, кыймылдар, профсоюздар, ассоциациялар, билим берүү чөйрөлөрү коомдук клубдар, лоббирлөө топтору ж. б. кирет. Ошентип, жарандык коом – бул биздин турмушубузду аныктаган ар кандай мамлекеттик эмес түзүмдөр менен кошо өкүм сүргөн социалдык мейкиндик."},{"t":"h3","h":"Жарандык коомдун өнүгүшү"},{"t":"p","h":"Жарандык коомдун өнүгүшү аны менен мамлекеттин ортосундагы мамилелердин мыйзамдуу түрдө ирээттелип такталы-"},{"t":"h3","h":"<span class=\"pg\" data-n=\"88\">88<\/span>Жарандык коомдун чөйрөлөрү"},{"t":"p","h":"Кооперативдер"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Арендалык<\/td><td>Экономикалык | „| Акционердик<\/td><\/tr><tr><td>бирикмелер<\/td><td>чөйрө<\/td><td>коом<\/td><\/tr><tr><td>Чыгармачылык<\/td><td>Үй-бүлө<\/td><\/tr><tr><td>ухании<\/td><td>Жарандык коомдун<\/td><\/tr><tr><td>чейре<\/td><td>чейрелеру<\/td><td>саясый чейре<\/td><\/tr><tr><td>Илим<\/td><td>Искусство,<\/td><td>Коомдук<\/td><\/tr><tr><td>билимдин<\/td><td>коомдук<\/td><td>саясый<\/td><\/tr><tr><td>өнүгүшү<\/td><td>сезим<\/td><td>уюмдар<\/td><\/tr><tr><td>Мамлекеттик<\/td><\/tr><tr><td>эмес ММК<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"шына алып келген. Адамдардагы эркиндик укук жана экономикалык көз каранды эместик сыяктуу баалуулуктарга негизделген консенсустун болушуна ыңгайлуу шарттарды түзгөн. XX кылымдын аягында жарандык коомдун өнүгүшүнө жогорку деңгээлге жеткендиктен, жашоонун индивиддик жана коомдук чөйрөсүнө мамлекеттин кийлигишүүсү төмөндөгөн. Бул болсо өлкөдөгү саясый режимдин туруктуулугуна негиз түзгөн. Жарандык коом өзүн-өзү түзгөн жана өз алдынча өнүккөн система болуп эсептелет. Ар түрдүү топтордун жана катмарлардын өкүлдөрүнүн кызыкчылыктарын чагылдырган социалдык-түзүлүштүн болушу жарандык коомдун жашоосунун маанилүү шарты болуп эсептелет."},{"t":"p","h":"Инсандын социалдык интеллектуалдык психологиялык өнүгүүсүнүн жогорку деңгээлде болуусу, жарандык коомдун ишмердүүлүгүнүн зарыл өбөлгөсү боло алат. Ошондой эле ар <span class=\"pg\" data-n=\"89\">89<\/span>кандай коомдук институттардын ишине катышканда, инсандын ички эркиндигинин жана толук өз алдынчалыкка жөндөмдүүлүгүнүн болуусу дагы, жарандык коомдун ишмердүүлүгүнө өбөлгө түзөт. Коом бир нече элементтерден жана кошумча системалардан турат. «Система» грек сөзү, бөлүктөрдөн турган бир бүтүн нерсени түшүндүрөт. Ушул бөлүктөрдүн ортосундагы байланыштарды байкап көрсөк, биринчи кезекте коомдук турмуштун чөйрөлөрүн кошумча системага киргизүүгө болот."},{"t":"p","h":"Мындай чөйрөлөрдүн катарына төмөнкүлөр кирет: экономикалык чөйрө (материалдык өндүрүш процессиндеги мамилелер), социалдык чөйрө (таптардын, социалдык катмарлардын, топтордун өз ара аракеттенүүсү, саясый чөйрө, саясый партиялардын ишмердиги ж.б.), руханий чөйрө (коомдук сезимдин, илимдин, искусствонун, билим берүүнүн өнүгүшү)."},{"t":"p","h":"Коомдук түзүлүштүн ар бир чөйрөсү татаал түзүлүш болот да аны түзгөн элементтер коом жөнүндө жалпы түшүнүктөрдү берет. Жарандык коомдун экономикалык чөйрөдөгү түзүмдөрүнө кооперативдер, арендалык бирикмелер, акционердик коомдор ж. б. чарбачылык кылууда, жарандардын ©з демилгелери менен түзгөн ыктыярдуу бирикмелери кирет."},{"t":"p","h":"Жарандык коомдун социалдык саясый чөйрөдөгү түзүмдөрүнө үй-бүлө, коомдук, саясый кыймылдар жана уюмдар, жашаган же иштеген жери боюнча түзүлгөн коомдук өзүн-өзү башкаруу органдары, мамлекеттик эмес массалык маалымат каражаттары (ММК) кирет."},{"t":"p","h":"Жарандык коом руханий чөйрөдө, ой жана сөз эркиндигине, өз оюн ачык билдирүүнүн чыныгы мүмкүнчүлүктөрүнө шарт түзөт. Чыгармачылык, илимий ж. б. бирикмелер мамлекеттен жана саясый түзүмдөрдөн көз карандысыз болушат."},{"t":"p","h":"Кайталоо үчүн суроолор % 1. Коомдун кеңири мааниси жана аныктамасы."},{"t":"p","h":"2. Жарандык коом жана анын элементтери жөнүндө айтып бер."},{"t":"p","h":"3. Жарандык коомдун ишмердүүлүгүнүн өбөлгөлөрү кайсылар? 25 4. Жарандык коомдун экономикалык, социалдык, саясый чейредегу"},{"t":"p","h":"түзүмдөрү эмнелерден тураарын салыштырып, айтып бер."},{"t":"p","h":"5. Тема менен таанышкандан кийин, Кыргызстанда кандай жарандык"},{"t":"p","h":"коомдор иш алып барып жаткандыктарын айтып бер."},{"t":"h3","h":"<span class=\"pg\" data-n=\"90\">90<\/span>§ 28. САЯСЫЙ ПАРТИЯЛАР"},{"t":"p","h":"Т үш үнүктөр:"},{"t":"p","h":". Партиялык системалар * Партиянын функциялары"},{"t":"p","h":"Тапшырма:"},{"t":"p","h":"Саясый партиялар кандай максат менен түзүлөт?"},{"t":"p","h":"* Кыргызстанда 1917-жылы кандай саясый партиялар (уюм) түзүлгөн. Азыркы мезгилдеги партиялардан мисал келтирип, бул эки мезгилдеги партиялардын өзгөчөлүктөрүн белгилегиле (программасы, курамы ж.б.)."},{"t":"p","h":". Теманы окуп, саясый программа менен саясый платформанын өзгөчөлүктөрүн белгиле."},{"t":"p","h":"Саясый аренада ар түрдүү саясый күчтөр аракеттенишет. Саясый партия – бул өз принциптерин жайылтуу жана талапкерлерин мамлекеттик кызматтарга көрсөтүү, аларды колдоо үчүн расмий түрдө түзүлгөн саясый топ."},{"t":"p","h":"Алар белгилүү бир топтордун же жеке адамдардын таламдарын көтөрүп чыгышат жана жарандык коомдун башкы элементи болуп кызмат кылат. Ошентип саясый күчтөр жарандык коомдо пайда болуп, анын топторунун таламдарын билдирүү менен мамлекет менен жарандык коомду байланыштырып туруучу көпүрө болуп эсептелет. Бирок алардын статусу башка өкмөттүк эмес уюмдардан айрымаланып турат."},{"t":"p","h":"Саясый партия улуттук жана жергиликтүү деңгээлдерде жашап, бийликти алуу жана аны жүргүзүү максатына багытталып, элдин колдоосуна умтулган тынымсыз аракеттеги уюм."},{"t":"p","h":"Саясый партиялардын жыйындысы жана алардын ортосундагы өз ара байланыштар партиялык системалар деп аталат."},{"t":"p","h":"Бардык эле уюмдашылган топторду партия деп атоого болбойт. Башка саясый күчтөрдөн партиянын айырмалоочу белгилери бар."},{"t":"p","h":"Биринчи белгиси, партия – бул уюм анда адамдар узак убакытка биригип аракеттенишет."},{"t":"p","h":"Әкинчи белгиси – борбордук жетекчилик менен такай байланыштагы жергиликтүү туруктуу уюмдардын болушу."},{"t":"p","h":"Үчүнчү белгиси – партиянын максаты – бийликти ишке ашырууга умтулуусу, аны кысым көрсөтүү топторунан айырмалоого мүмкүндүк берет."},{"t":"p","h":"<span class=\"pg\" data-n=\"91\">91<\/span>Төртүнчү белгиси – добуш берүүдөн баштап элдик колдоого ээ болуу жана алардын партияга активдүү мүчөлүккө өтүүсүн камсыз кылуу. Бул белгиси боюнча партия шайлоолорго жана парламенттин ишине катышпаган саясый клубдардан айырмаланып турат. Дагы бир айрымасы, саясый партияларга партия жактырган саясатты жүргүзүү үчүн айрым мүчөлөрү өкмөт курамына кирип, аракеттенген адамдар биригет. Саясый партиялар жарандардын бийликке таасир этиши үчүн жаңы мүмкүнчүлүктү түзөт."},{"t":"p","h":"Мурда шайлоочулардын укуктары шайлоо аяктаары менен бүтүп калган. Шайланган талапкер өзүнүн шайлоочулары алдында жоопкерчиликте болгон эмес. Партиялар пайда болгондон тартып, депутаттар партиянын эркин билдирүү менен анын колдоосуна таянат. Анткени партиялар жакшы уюмдашкандыктан, коомдук пикирди жана социалдык топтордун саясый таламдарын ишке ашырууда кыйла натыйжалуу болуп чыгышат."},{"t":"h3","h":"Партиянын саясый программасы"},{"t":"p","h":"Жалпы элдин ишенимине кирүүдө саясый партиялардын түзгөн программалары чоң роль ойнойт."},{"t":"p","h":"Саясый программада саясый партиялардын ишмердүүлүгүнүн негизги жоболору жана максаттары кыскача баяндалат. Ал эми саясий программаларда партиялардын ишмердүүлүгүн тактоочу жалпы жоболор саясый платформа болуп эсептелет."},{"t":"p","h":"Партиянын саясый программалары стратегиялык жана тактикалык болуп бөлүнөт. Стратегиялык программалар саясый платформа аныктаган жалпы абстракттуу (ачык айкын эмес) баалуулуктар менен максаттардын, аларга жетүүнүн каражаттарынын жыйындысын көрсөтөт."},{"t":"p","h":"Тактикалык программалар партияны бийликке алып келе турган ураандардын жыйындысы катары түзүлөт. Саясый программа кээ бир саясый партиялардын мамлекеттин, коомдун, инсандын өнүгүүсү үчүн шарт түзүүгө болгон сунушу болуп эсептелет. Ошл эле учурда, саясый программа атаандаш партиянын ураандарынын ишке ашпастыгын же анын ишмердүүлүгүнүн начар жактарын чагылдыруунун каражаты болуп эсептелет."},{"t":"p","h":"<span class=\"pg\" data-n=\"92\">92<\/span>Партиянын функциялары Әкономикалык, социалдык жана маданий өнүгүү денгээли ар кандай, конкреттүү тарыхый жана улуттук салттары бар коомдордо, саясый партиялардын ролу жана мааниси бирдей эмес. Бирок партиялардын кээ бир жалпы функцияларын бөлүп караса болот. Мисалы, ар түрдүү топтор менен индивиддердин ар башка таламдарын, керектөөлөрүн макулдаштыруу жана жалпылаштыруу функциясы. Мындан тышкары партиялар бийлик органдарын көзөмөлдөө менен саясый институттардын өз ара аракеттенүү эрежелерин иштеп чыгууга жана ишке киргизүүгө катышуу менен өкмөттүн функцияларын да аткарышы мүмкүн. Социалдык топтордун таламдарын көрсөтүү жана билдирүү аларды бийлик органдарына жеткирүү менен партия коммуникациялык функцияларды ишке ашырат, б. а. бийлик менен коомдун өз ара байланышын камсыз кылат. Агитация жана пропаганданын каражаттары менен белгилүү баалуулуктарды жайылтуу ар-"},{"t":"h3","h":"Партиянын функциялары"},{"t":"p","h":"Топтор менен жеке адамдардын таламдарын, керектөөлөрүн"},{"t":"p","h":"макулдаштыруу жана жалпылаштыруу"},{"t":"p","h":"Партиялар бийлик органдарын көзөмөлдөө менен саясый"},{"t":"p","h":"институттардын өз ара аракеттенүү эрежелерин иштеп"},{"t":"v","l":["чыгууга катышуу аркылуу өкмөттүн функцияларын","да аткарышы мүмкүн"]},{"t":"p","h":"Социалдык топтордун таламдарын бийлик органдарына жеткирүү менен партия коммуникативдик функцияларды ишке ашырат"},{"t":"p","h":"Агитация жана пропаганда каражаттары менен белгилүү баалуулуктарды – саясый тажрыйбаны, салттарды, маданиятты"},{"t":"p","h":"кийинки муундарга жайылтуу функциясы"},{"t":"p","h":"Жетекчи кызмат орундарына жакшы талапкерлерди тандоо аркылуу партиялар элита курамынын сапатынын"},{"t":"p","h":"жакшырышына түрткү берет <span class=\"pg\" data-n=\"93\">93<\/span>кылуу саясый партиялар социалдаштыруу функциясын аткарышат. Тактап айтканда, саясый тажрыйбаны, салттарды, маданиятты кийинки муундарга өткөрүп берүү функциясын ишке ашырышат."},{"t":"p","h":"Акырында, жетекчи кызмат орундарына жакшы талапкерлерди тандоо менен партиялар элита курамынын сапатынын жакшырышына түрткү берет."},{"t":"p","h":"Бирок тоталитардык системаларда саясый партиялар бийлик жүргүзүү функциясын түздөн-түз аткарып калышы мүмкүн. Анткени алар бийлик функцияларын бүтүндөй өз колуна топтоп алышкан (мурдагы СССР) монополиялуу бийлөөчү партиялар болуп эсептелет."},{"t":"p","h":"Кыргызстанда 2004-жылдын башында 48 партия катталса, 2006-жылга карай 70тен ашык партия катталган. Ал эми 2010-жылдагы шайлоого 29 партия катышкан. Алардын бешөө көп добушка ээ болуп жеңип чыгышкан: «Ата- Журт», «Кыргызстан социал-демократиялык партиясы», «Республика», «Ар-намыс», «Ата-Мекен» партиялары."},{"t":"p","h":"Партиялардын сандык критерийлери боюнча ажыратылышы."},{"t":"p","h":"1. Бир партиялуу система: мында жалгыз партия монополиялуу түрдө бийлик жүргүзөт."},{"t":"p","h":"2. Кош партиялуу система: бир нече партиялардан туруп, бирок эң эле таасирдүүлөрү экөө гана болот."},{"t":"p","h":"3. Көп партиялуу система: эки же андан көп партиялардын саясый турмуштагы жигердүү ролун болжогон система (Италияда 14, Голландияда 20дан ашуун партиялар бар ж. б.)."},{"t":"p","h":"Партиялардын саясый таасири төмөнкүдөй үч критерий менен аныкталат."},{"t":"p","h":"1. Партиянын мүчөлөрүнүн саны менен."},{"t":"p","h":"2. Партия үчүн добуш берген шайлоочулардын саны боюнча."},{"t":"p","h":"8. Шайлоолордо партия жеңип алган депутаттык мандаттардын саны боюнча."},{"t":"p","h":"Кайталоо үчүн суроолор % 1. Саясый партиялар алардын белгилери жана саясый күчтөрдөн"},{"t":"p","h":"айырмачылыктары."},{"t":"p","h":"2. Саясый партиялардын функциялары."},{"t":"p","h":"253. Темада берилген саясый партиялардын санын дагы толукта."},{"t":"h3","h":"<span class=\"pg\" data-n=\"94\">94<\/span>ТҮГЛАВА"}],"sub":[{"title":"Жарандык коомдун өнүгүшү","b":7},{"title":"Жарандык коомдун чөйрөлөрү","b":9},{"title":"§ 28. САЯСЫЙ ПАРТИЯЛАР","b":24},{"title":"Партиянын саясый программасы","b":41},{"title":"Партиянын функциялары","b":47},{"title":"ТҮГЛАВА","b":73}],"section":"ШГЛАВА","pages":[88,94]},{"title":"АДАМ УКУКТАРЫ ЖАНА АЛАРДЫ КОРГОГОН ӘЛ АРАЛЫК УЮМДАР","blocks":[{"t":"h3","h":"АДАМ УКУКТАРЫ ЖАНА АЛАРДЫ КОРГОГОН ӘЛ АРАЛЫК УЮМДАР"},{"t":"h3","h":"§ 24. УКУК ЖӨНҮНДӨ ТҮШҮНҮК. АДАМ УКУКТАРЫ"},{"t":"p","h":"Т ушун уктер:"},{"t":"raw","h":"<h4 class=\"mk\">* Укук. * Негизги үч жобо. Тапшырма:<\/h4>"},{"t":"p","h":". Байыркы укук."},{"t":"p","h":"* Греция жана Рим укуктары."},{"t":"p","h":". Укук деп эмнени түшүнөсүң? Кандай укуктарыңды билесиң?"},{"t":"p","h":"* Укук адамдарга эмне үчүн керек? Тарыхта адамдардын укугу чектелген же такыр жок болгон мезгил болду беле?"},{"t":"p","h":"* Сен жашаган аймакта адам укуктары бузулган учурларды билсең мисал келтир. Өз турмушуңдан алсаң да болот. Аларды чечүүнүн жолдорун ойлон."},{"t":"p","h":". «Мораль» деген сөздү кандай түшүнөсүң?"},{"t":"p","h":"Укук жөнүндөгү илимий көз караштардын айрымачылыктарына карабастан, укук тууралуу төмөнкүдөй бир катар жалпы жоболор бар:"},{"t":"p","h":"Укук деп мыйзам деңгээлине көтөрүлгөн, мамлекет тарабынан белгиленген, жалпыга милдеттүү, жүрүш-туруш эрежелеринин, ченемдеринин системасы аталат."},{"t":"p","h":"Укуктун булактары болуп атайын юридикалык ченемдер бекитилүүчү расмий мамлекеттик документтер эсептелинет. Аларга мыйзам, Президенттин Жарлыгы, өкмөттүн токтому, кодекстер, жергиликтүү өз алдынча башкаруу органдарынын чечимдери кирет (китептин аягындагы тиркемени кара). Аталган актыларда мамлекеттик органдардын өздөрүнүн чыгарган жүрүм-турум эрежелери камтылат. Укук ченемдеринде белгиленген бул эрежелер жалпыга милдеттүү мааниге ээ."},{"t":"p","h":"Алгачкы общиналык жана уруучулук коомдо укук болгон эмес, бирок бийлик болгон. Адамдардын эң алгачкы жүрүш-туруш эрежелери болуп үрп-адаттар, каада-салттар, жөрөлгөлөр, б.а. адеп-ахлак ченемдери эсептелген. Жеке"},{"t":"h3","h":"<span class=\"pg\" data-n=\"95\">95<\/span>Конституция жана башка укук булактары"},{"t":"h3","h":"Кыргыз Республикасынын"},{"t":"p","h":"Конституциясы"},{"t":"h3","h":"Мамлекеттин негизги мыйзамы эң"},{"t":"p","h":"жогорку юридикалык күчкө ээ жана КРда түздөн-түз колдонулат."},{"t":"p","h":"Анын негизинде конституциялык мый-"},{"t":"v","l":["замдар жоболор кабыл алынат.","Мамлекеттин түзүлүү формасы, укук","жана эркиндиктердин негиздерин,","жергиликтүү өзүн-өзү башкаруу","органдарынын ишмердигин аныктайт."]},{"t":"h3","h":"Укук булактары"},{"t":"p","h":"Конституциялык укук ченемдери, мыйзамдар Президенттин жарлыгы, Жогорку Кеңештин токтомдору."},{"t":"p","h":"Эл аралык келишимдер. Өкмөттүн токтомдору жергиликтүү кеңештик актылар Конституциялык соттун токтомдору окумуштуу-юристтердин эмгектери"},{"t":"p","h":"менчик пайда болуп эзуучулер жана эзилуучулер табы келип чыкканда бийликтин куралы катары мамлекет пайда болгон. Аны менен бирге укук да келип чыккан. «Адам укугу» деген тушунук биз билген «укук» деген тушунуктерден айырмаланып турат. Адам укугу бирее тарабынан берилбейт. «Укук» бардык адамга тиешелүү, адам укугу бул бардык адамдарда бар негизги укуктар жана эркиндиктер болуп эсептелет. Адам укугу – бул адамдар менен мамлекеттин ортосундагы Өз ара мамилелердин принциптери жана ченемдери."},{"t":"p","h":"Мамлекет бизге укук бербейт, бирок ал анын гаранты болуп, алар менен камсыз кылууга милдеттүү. Дүйнө жүзүндөгү ар бир адам кайсы өлкөдө жашаганына карабастан бирдей укуктарга ээ болот. Адам укугунун конвенциясынын төмөнкүдөй негизги үч жобосу бар:"},{"t":"p","h":"1. Ар бир бийлик чектүү."},{"t":"p","h":"2. Ар бир адам өзүнүн автономиялуу, б. а. өзү башкаруучу тынчтыкка ээ. Ага эч бир бийлик кийлигише албайт."},{"t":"p","h":"3. Ар бир адам өз укугун коргоп жатып, мамлекетке доомат коё алат жана адамдар кайсы өлкөдө жашаганына карабастан бирдей укуктарга ээ болот."},{"t":"p","h":"Адамдардын жана жарандардын укуктары, эркиндиктери жана милдеттери инсандын укуктук статусун түзөт жана укуктун олуттуу бөлүгү болуп эсептелет. Укук деген сөз турмушта юридикалык мааниден сырткары дагы пайдаланылат. <span class=\"pg\" data-n=\"96\">96<\/span>Анда ал мыйзамдарда көрсөтүлбөгөн жекече мүмкүнчүлүктөрдү билдирет. Мисалы, улууну урматтоого укуктуулук, өз көз карашында турууга, улуу-кичүүнү сыйлоого укуктуулук."},{"t":"p","h":"Укук ченемдери Укук ченемдери мамлекет тарабынан орнотулуучу коомдук мамилелердин модели болуп эсептелет. Ал адамдардын жүрүм-турумунун мүмкүн болуучу жана талап кылуучу чегин, өз ара мамилелердин ички жана тышкы эркиндиктеринин чегин аныктап көрсөтөт."},{"t":"p","h":"Укук ченеми – бул жазык укуктук мамилелерди белгилеп жана коргогон, жалпыга бирдей милдеттүү тартипти чагылдырган мыйзамдын бөлүгү."},{"t":"p","h":"Укук ченеминин белгилери:"},{"t":"p","h":"1. Укук ченеми мамлекет тарабынан белгиленет. Бул расмий мамлекеттик актылар менен бекитилүүчү жүрүм-турумдун модели болуп эсептелет."},{"t":"p","h":"2. Укук ченеми мүмкүндүк берүүчү жана милдеттендирүүчү мүнөзгө ээ. Бир жагынан ал адамга мыйзамдуу укуктарын пайдалануу эркиндигин берет. Әкинчи жагынан укук ченеми кайсы бир иш-аракетти жасоо же жасабоо жагын милдеттендирет жана айрым адамдардын эркиндигине чек коёт."},{"t":"p","h":"Ошентип укук ченеми адамдардын өз ара мамилелерине жол берүү же чек коюу жагын айкалыштырып турат."},{"t":"p","h":"3. Укук ченемин ишке ашыруу зарыл болгон учурда мамлекеттик мажбурлоо чаралары менен камсыз кылынат."},{"t":"p","h":"4. Укук ченеми типтүү коомдук мамилелердин, (мисалы, сатып алуу, сатуу мамилелери) мамлекеттик жөнгө салгычы катары чыгат."},{"t":"h3","h":"Укук мамилелери"},{"t":"p","h":"Адамдар жана алардын уюмдары ортосундагы турмуштук мамилелердин ар кандай жактары жана формалары бар. Алар адеп-ахлактык, улуттук, саясый, диний укуктук формалар. Ар бир коомдук мамиле коомдук кызыкчылыктардын жана муктаждыктардын ар кандай элементтерин камтыйт."},{"t":"p","h":"Укук мамилелери – бул укуктук ченеми менен аныкталуучу чыныгы коомдук мамилелердин бир тарабы, анын өзгөчө формасы."},{"t":"p","h":"<span class=\"pg\" data-n=\"97\">97<\/span>Укук мамилеси – мамлекет аркылуу корголуучу, өз ара байланыштагы юридикалык укуктар жана милдеттер менен байланышкан эки тараптын коомдук мамилеси."},{"t":"p","h":"Укук мамилесинин белгилери:"},{"t":"p","h":"1. Укук мамилеси укуктук ченемдердин негизинде куралуучу иш жүзүндөгү коомдук мамилелердин формасын туюндурат."},{"t":"p","h":"2. Укук мамилеси катышуучулары өз ара юридикалык укуктарга жана милдеттерге ээ. Әгерде укук мамилесинин бир катышуучусуна укук берилсе, экинчисине юридикалык милдет тагылат."},{"t":"p","h":"8. Укук мамилелери аң-сезимдүү жана эрктүү мүнөзгө ээ."},{"t":"p","h":"4. Укук мамилелерине мамлекет тарабынан кепилдик берилип, зарыл учурда анын мажбурлоочу күчү менен корголот..."},{"t":"p","h":"Мораль жана укук Адамдар ортосундагы мамилелер жалаң эле укук ченемдери аркылуу жөнгө салынбастан, жүрүш-туруштун коомдо колдонулган башка эрежелери менен да жөнгө салынат. Алардын бири болуп моралдык ченемдер эсептелет. (Мораль – французчадан – ыймандуулук, лат. – ыймандуу, орус тилинин түшүндүрмө сөздүгүндө «Мораль – бул ыймандуулук эрежелери, ошондой эле ыймандуулуктун өзү» деп берилген.)"},{"t":"p","h":"Мораль – жакшы-жаманды айырмалоонун жалпы кабыл алынган түшүнүгү. Ал эми илимий аныктамада мораль – «адамдын жүрүм-турумун жөнгө салып туруучу коомдук институт». Мораль – бул кайсы бир коомдо калыптанып калган адамдар ортосундагы мамилени жөнгө салуучу жүрүм-турумдун жазылбаган чек-ченемдери. Адамдарга моралдык бааны дайыма башка адамдар (туугандар, кызматташтар, кошуналар же жөн эле адамдар) бере алат."},{"t":"p","h":"Инсандын руханий дүйнөсүн, аң-сезимин, маданиятын, жүрүм-турумун калыптандырууда мораль жана укук өзгөчө мааниге ээ."},{"t":"p","h":"Моралды жекече ынаным, салт, тарбия, коомдук пикирдин күчү, кайсы бир таптын же социалдык топтун көз караштары колдоп турат. Жакшылык, жамандык, кара ниеттик, чынчылдык, ак ниеттүүлүк, айкөлдүк, уят-сыйыт – мунун баары коомдогу жакшы-жаманды айырмалап аныктап туруучу критерий. Башкача айтканда, мораль – коомдук көз караштан алганда, инсан үчүн жакшы туура деп эсептелген нерселер болуп эсептелет."},{"t":"p","h":"<span class=\"pg\" data-n=\"98\">98<\/span>Укук жана мораль – адамзат маданиятынын дайыма өз ара карым-катыштагы эң маанилүү элементтеринен. Бул карым-катыш дайыма тарыхый шарттарга жана коомдук социалдык-таптык түзүлүшүнө жараша болот. Мораль жана укуктун ар бири үчүн өзгөчөлөнгөн коомдук мамилелердин чөйрөсү болбойт. Тескерисинче, алар социалдык байланыштардын бирдиктүү чөйрөсүндө иштейт. Ошондуктан, укук менен моралдын карым-катыштарында жалпылык, окшоштук көп кездешет. Укук моралсыз, мораль укуксуз жашап өнүгө албайт. Алардын жалпы милдети адамдардын жүрүмтурумуна таасир этүү. Укуктун иштөө чөйрөсү бүт бойдон мораль мейкиндигинде болууга тийиш. Укук менен моралдын мындай өз ара байланышы инсандын укуктук жана ыймандык жактан тарбияланышынын байланышын бекемдөө зарылдыгын аныктап турат. Ошондуктан көп учурда мораль менен ыймандуулук да, бирдей түшүнүк катары каралууда. Ошондой болсо да моралдан айырмаланып, ыймандуулук – бул коомдо адам үчүн зарыл болгон жүрүм-турум эрежелери жана алардын аткарылышы. Ыймандуулук ар бир адамдын ички руханий дүйнөсү тарабынан калыптанат. Ошондой эле ыймандуулук бул ар бир адамдын өздүк моралы, анын өзүнө берер баасы болуп эсептелет."},{"t":"p","h":"Көп кырдуу акын Тоголок Молдо (1860-1942) өз мезгилинде адамдардын адеп-ахлагы жөнүндө көп ойлонуп, көп жазган. Ал ойчул катары адамдын журуш-турушундагы, мунөзүндөгү кемчиликтердин себептери, алардын рухий-ыймандык жактан оңолушунун жолдору тууралуу көп ойлонгон. Тоголок Молдо адамдарда мындай жаман сапаттардын көп болушун, алардын сабатсыздыгы жана кичинесинен баштап жетиштүү тарбия албагандыгынан деп түшүнгөн."},{"t":"p","h":"Ал ошондуктан адамдын адеп-ахлагындагы кемчиликтерин оңдоо үчүн төмөнкү үч нерсе зарыл деп эсептеген:"},{"t":"p","h":"1. Баланы кичинесинен адепке, ар-намыстуулукка, эмгекке тарбиялоо."},{"t":"p","h":"2. Адамга илим-билим берип, агартуу аркылуу оң жолго салуу."},{"t":"p","h":"8. Адамдын өзүн-өзү тарбиялоосунун зарылдыгы. Демек, «адам өзүнүн жүрүм-турумунун, мүнөзүнүн оң-тескери жагын байкап, кемчиликтерин түшүнүп, андан жыйынтык чыгрса, анда адам адеп-ахлак жактан өйдөлөп өсөөр эле», – деген ойду билдирет."},{"t":"v","l":["<span class=\"pg\" data-n=\"99\">99<\/span>Кайталоо үчүн суроолор","% 1.Укук жана алардын пайда болушу.","2. Адам укуктары жөнүндө эмнелерди билдиң?"]},{"t":"p","h":"3. Адам укугунун конвенциясынын жоболору жана алардын мааниси."},{"t":"p","h":"4. Афины мамлекетиндеги адам укуктарынын өзгөчөлүктөрү."},{"t":"p","h":"5. Адам укуктары менен мыйзамдуу укуктун айырмасы."},{"t":"h3","h":"§ 25. БАЙЫРКЫ ДҮЙНӨДӨГҮ, ОРТО КЫЛЫМДАГЫ ЖАНА ЖАҢЫ ДООРДОГУ УКУКТАР"},{"t":"p","h":"Т үш үнүктөр:"},{"t":"p","h":"* Улуу Хартия – Орус акыйкаты."},{"t":"p","h":"Адамдын жана жарандын укуктарынын декларациясы. Негизги даталар:"},{"t":"p","h":"1215-ж., 15-июнь Эркиндиктин Улуу Хартиясы."},{"t":"p","h":"1789-ж. Францияда «Адамдын жана жарандын укуктарынын декларациясы» кабыл алынган."},{"t":"p","h":"1816-ж. Жыргалчылык союзу."},{"t":"p","h":"1821-1822-жж. П.И. Пестель менен Н. М. Муравьёв конституциялардын долбоорлорун тузген."},{"t":"p","h":"1825-ж., 14-декабрь Петербургда декабристтердин кетерулүшү."},{"t":"p","h":"Тапшырма:"},{"t":"p","h":"* Байыркы кыргыз элинин укуктарынын өнүгүү шарты жөнүндө эмнелерди билесиң? Алардын укуктары кантип корголгон?"},{"t":"p","h":"* Теманы окуп, үч доордо пайда болгон адам укуктарынын өзгөчөлүктөрүн салыштырып жаз."},{"t":"p","h":". Жаңы доордо жазылган П. И. Пестель менен Н. М. Муравьевдун конституциясын окуп, артыкчылыктарын белгиле."},{"t":"h3","h":"Байыркы дүйнөдөгү укук"},{"t":"p","h":"Биздин заманга чейинки 1792—1750-жылдары Вавилондо Хаммурапи падышалык кылган. XX кылымдын башында археологдор киши боюнан бийик кара таштан жасалган мамы таш табышкан. Анын бети толтура шына (клинопись) белгилери менен Хаммурапинин мыйзамдары оюлуп жазылган. Ал 282 беренеден туруп Вавилон коомунун көп сандаган укуктук <span class=\"pg\" data-n=\"100\">100<\/span>маселелерин камтыган. Бул мыйзамда киришүү бөлүмү сот ишин жүргүзүү, уурулукка каршы жаза жана балдар менен кулдарды уурдаганда, качкын кулду жашырганда колдонулуучу жазалар көрсөтүлгөн. Жоокерлердин укуктары жана милдеттери, сугат тармактары, үй, короо-жай күтүү, үй-бүлө укугу, курулуш жерлери жөнүндөгү мыйзамдарга орун берилген. Ошондой эле жаратылышты коргоо, карыз алуу, карыз берүү жана аны төлөө келишимдери, жыйынтыгында кулдар тууралуу айтылган."},{"t":"p","h":"Падыша Хаммурапинин мыйзамдары, байыркы чыгыш коомундагы укуктук ойдун эң көрүнүктүүсү, мыйзамдардын биринчи жыйнагы. Бул мыйзамдар жыйнагы, кул ээлөөчүлүк түзүлүштү, жеке менчикти, адамды адам эзүүнү, биринчи жолу мыйзам деңгээлинде чагылдырган укуктук акт болгон."},{"t":"p","h":"Байыркы Грециянын жана байыркы Римдин укугу классикалык же үлгүлүү деп аталган. Андан эркин адамдардын укуктары акырындык менен түзүлө баштаган. Байыркы Грек жана Афины демократиясынын (б.з.ч. V к.) саясый мурастары кийинки цивилизация тарабынан тажрыйба катары кабыл алынып кеңири изилденүүдө. Байыркы Грек укугунун негизинде Рим укугу өнүккөн. Афины мамлекетинде укукка ээ болуу үчүн ошол мамлекеттин жараны болуш керек эле. Жарандар кезек менен чүчүкулак кармап, мамлекеттик кызматтарды ээлешкен. Жаран 20 жашка толоору менен Афины мамлекетинин жогорку органы болгон элдик чогулуштун мыйзам чыгаруу иштерине катышуу укугун алган. 80 жашка чыккан жарандарга мамлекетти башкаруу же сот кызматтарын ээлөөгө мүмкүнчүлүк берилген. Алар ички-тышкы саясатка, соттун ишине катышууга жана сотто кезек-кезеги менен иштөө укугуна ээ болгон. Байыркы Афиныда кулдар жана душман тараптагылардын укуктары болгон эмес. Байыркы Гректин адам укуктарынын теоретиктеринен Аристотель менен Демосфенди айтсак болот. Ал эми байыркы Римде атуулдардын мыйзам кабыл алуу укуктары көбүрөөк чектелген. Себеби, мыйзам туруктуу сенат тарабынан сунуш кылынган."},{"t":"p","h":"Әлдик чогулуш ал мыйзамды кабыл алган же каршы болгон. Азыркы мезгилге чейин Рим укугун юристтер изилдеп үйрөнүп келе жатышат. Анын негизги бөлүктөрү буржуазиялык өлкөлөрдүн мыйзамдарына киргизилген."},{"t":"p","h":"<span class=\"pg\" data-n=\"101\">101<\/span>Орто кылымдагы укук Феодалдык коомдогу укукка дин жана үрп-адаттар түздөн-түз таасирин тийгизген. Орто кылымдагы укук өтө каардуу болгон. Адам өзүнүн күнөөсүздүгүн далилдей албай калса, аны кудай соту менен соттошуп, муштум же курал менен жазалашкан. XIII кылымдын башында еретиктерге (каршы чыгуу) каршы күрөш жүргүзүү үчүн Папа атайын чиркөө сотун «инквизацияны» (тергөө иштери) уюштурган. Англия орто кылымда инсандын статусун мыйзам түрүндө өзгөртүүдө көрүнүктүү натыйжага жетишкен. XII-XIII кылымда өлкөдө бир тарабынан Иоанн (жерсиз), экинчи тарабынан ири феодалдар, католик чиркөөсү, община жана шаарлардын ортосунда катуу келишпестиктер келип чыккан. Бир нече жыл катуу күрөштөн кийин 1215-жылы 15-июнда эркиндиктин Улуу Хартиясы (Мартин Карт) деп аталган укуктук документ кабыл алынган. Анын 89-,40-,42-,45-пункттарында бир да адам эркинен тышкары камакка алынып, жеке мүлктөрүнөн ажыратылбайт деп жазылган."},{"t":"p","h":"Жаңы доордогу укук Жаңы доордогу адам укуктарынын өнүгүшүнө ошол мезгилдеги антиколониялык жана абсолютизмге каршы көтөрүлүштөр өз таасирин тийгизген. Голландия экономикалык жактан тездик менен өнүккөн өлкө болгон. Ал 1566-1609-жж. Испан бийлигинен бошонууга жетишкен. 1640-1689-жж. Англияда революция болуп өткөн. Ал эми Англияга каршы Америкадагы колониялар көтөрүлүп 1776-ж. 4-июлда конгресс «Көз карандысыздык декларациясын» кабыл алган. Бул көтөрүлүштүн натыйжасында 1787-жылы конституциялык түрдө жаңы мамлекет АКШ түзүлгөн. 1789-жылы 14-июлда Улуу Француз буржуазиялык революциясы башталган жана ошол эле жылы «Адамдын жана жарандын укуктарынын декларациясын» кабыл алган. Декларацияда «адамдар бирдей тең укуктуу болуп төрөлөт жана ошол бойдон калат» деп жарыяланган. 1794-ж. революция жеңиш менен аяктаган."},{"t":"p","h":"XVIII к. (1773-ж.) Орусияда Емельян Пугачевдун жетекчилиги менен дыйкандар согушу болуп өткөн. Пугачевдун манифести эркиндик идеяларын «эрк» катары чагылдырган. Анда крепостнойлук укук жоюлуп «кул» эркин адам деген түшүнүк менен алмаштырылган."},{"t":"p","h":"<span class=\"pg\" data-n=\"102\">102<\/span>1818-жылы келечектеги декабристтердин. «Жыргалчылык союзу» түзүлгөн. Алардын уставында «Союз бийликке умтулуу жана адам укуктарына көңүл кош кароону жоюуга, ар бир адам жеке укуктарынан пайдалана ала тургандыгын түшүндүрүүгө аракет кылат» – деп айтылган."},{"t":"p","h":"Алар 1820-жылы Россияда республикалык башкарууну орнотуу жөнүндө чечим кабыл алышкан."},{"t":"p","h":"Ошондой эле 1821-1822-жж. «Жыргалчылык союзунун» ордуна түзүлгөн Украинадагы Түштүк коомунан П. И. Пестель, Петербургдагы Түндүк коомунан Н. М. Муравьев тарабынан конституциянын долбоору жазылган. Пестелдин Орус акыйкаты деп аталган конституциясы адам укуктары деп аталып, демократиялуулугу менен айырмаланган. Ал крепостнойлук укукту жоюу, иштетүүнү каалагандарга помещиктик жерлерди таркатып берүүнү каалаган. Пестель калктын эркин бөлүгү үчүн жалпы шайлоо укугун киргизүүнү сунуш кылган. Н. М. Муравьевдун конституциясында крепостнойлукту жоюу менен помещиктин жерлери ээлеринде калат. Муравьев болсо, көбүрөөк жер менчигине ээ болуу, аткаруу, мыйзам чыгаруу жана сот бийликтерине шайлануу укугун берген."},{"t":"p","h":"1825-жылы 14-декабрда Петербургда декабристтердин көтөрүлүшү болуп өткөн. Алар адам укугун таануунун негизинде Орусиянын коомдук жана саясый түзүлүшүн өзгөртүүгө аракеттенишкен."},{"t":"p","h":"Кайталоо үчүн суроолор % 1. Эркиндиктин Улуу Хартиясы качан, кантип кабыл алынган жана"},{"t":"p","h":"анда эмнелер жазылган?"},{"t":"p","h":"2. Жаңы доордогу адам укуктарынын өнүгүшүнө өз таасирин тийгиз-"},{"t":"p","h":"ген өлкөлөр жана окуялар."},{"t":"p","h":"3. П. И. Пестель жана Н. М. Муравьев тарабынан жазылган консти-"},{"t":"p","h":"туциялардын долбоорун салыштыр."},{"t":"p","h":"4. Мамы ташта качан, ким тарабынан эмнелер жөнүндө жазылган?"},{"t":"h3","h":"§ 26. СОВЕТТИК ДООРДОГУ УКУК"},{"t":"v","l":["Т үш үнүктөр:",". Советтик биринчи конституция.",". Советтик укуктун өзгөчөлүктөрү.","* Кайра куруудагы укук.","* Эркиндик теңдик урааны."]},{"t":"p","h":"<span class=\"pg\" data-n=\"103\">103<\/span>Негизги даталар:"},{"t":"p","h":"1918-жыл 10-январь В. И. Ленин. Әмгекчилердин жана эзилген элдин укуктарынын декларациясы."},{"t":"v","l":["1924-жыл СССРдин конституциясы.","1986-жыл СССРдин конституциясы.","1977-жыл СССРдин конституциясы.","Тапшырма:"]},{"t":"p","h":"* Советтик доордогу адам укуктарынын башка укуктардан кандай өзгөчөлүктөрү болгон? Теманы окуп, мисал келтир."},{"t":"p","h":"* Советтик доордогу адам укуктары өзгөчө бузулган мезгил кайсы жылдарга туура келет, анын себептери кайсылар (тарыхты эстеп көр)?"},{"t":"h3","h":"Кыргыздардын адат укуктары"},{"t":"p","h":"Адат (араб тилинен – салт, үрп адат) – коомдо же белгилүү бир социалдык топто узак мезгилге колдонуунун натыйжасында көндүм болуп калган жүрүм-турум эрежелери. Адат уруулук түзүлүш мезгилинде, коомдогу адамдардын жүрүм-турумун жөнгө салуунун негизги формасы болгон."},{"t":"p","h":"Әскирген адаттар тарыхый өнүгүү мезгилинде жаңылар менен алмашылып өнүгүп жаткан коомдук мамилелердин калыптанышына жардам берет."},{"t":"p","h":"Адат укугу – салт түрүндө коомдо кеңири колдонуп келген адат ченемдеринин жана жүрүм-турум эрежелеринин жыйындысы. Алар көбүнчө кул ээлөөчүлүк жана феодалдык коомго мүнөздүү болуп кагаз бетине жазылган эмес. Адат укугу алгачкы жамаат коому бузулуп, жеке менчик келип чыккан мезгилде пайда болуп, эл урууларга бөлүнүп жашаган коомго тиешелүү болгон. Анын ченемдери коомдун шарттарына жараша өзгөрүп турган. Адат укугунун булактары болуп каада-салт (үрп-адат), бийлер соту, бийлер курултайынын жобосу эсептелген. Каада-салт кайсы бир жамааттагы же социалдык топтогу жүрүм-турумдун стереотиптик (эски көз караштардын негизинде калыптанган түшүнүк) үлгүсү болуп эсептелет."},{"t":"p","h":"Каада-салт (каада – араб тилинен – эреже) мурда эч жерде катталган эмес, кыска бирок нуска сөз катары, макаллакап түрүндө ооздон-оозго, муундан-муунга өтүп келген. Бийлер сотунун чечимдери калк арасында акындар, аксакал адамдар тарабынан жайылтылган."},{"t":"p","h":"<span class=\"pg\" data-n=\"104\">104<\/span>ХГХ кылымда азыркы Кыргызстандын аймагында, кыргыздардын адат укугунун нормалары, мусулман укугу – шарият, орустардын укук системасы менен жарыша иштеп турган."},{"t":"p","h":"XIX к. экинчи жарымына чейин бийлер сотунун чечимдери эч жерде жазылган эмес. Бий соту чыгарган өкүмдөр кийин бир китепке кыскача жазыла баштаган, кээде жазма документ түрүндө катталган."},{"t":"p","h":"Мисалы сот иштеринде жазуу түрүндөгү жалпы эрежелерге өткөн. Алар документ түрүндө жазылып, ага бийлердин чукул чакырылган курултайына келген бардык бийлер кол койгон. Әрежеде сот иштери жарандык жана жазык укугу баяндалат. 1898-ж. Токмок курултайында иштелип чыккан эреже 118 параграфтан турат."},{"t":"p","h":"Әркиндик теңдик урааны, кыргыздардын да прогрессивдүү саясый-философиялык ойчулдарынын ой пикирлеринде чагылдырылат. Бай-кедей, жамандык-жакшылык туурасында заманачы акындар өз чыгармаларын жазышкан. Алардын катарына Калыгул Бай уулу (1789—1855), Арстанбек Буйлаш уулу (1824-1878), Молдо Кылыч Шамыркан уулу (1868—1917) киришет. Алар чыгармаларында феодалдык чыр-чатактарды, байлардын зомбулугун, карапайым элдин оор турмушун чагылдырышкан. Ушул маанидеги чыгармаларды демократ акындар Т. Сатылганов, Т. Молдо, Б. Алыкуловдор дагы жазышкан. Алар Совет бийлигинин орношун зор кубаттоо менен тосуп алышкан. Чыгармаларында эркиндик теңдикке жетишкен кыргыз элинин турмушун чагылдырышкан. Демек, кыргыз коомунда да адамдын укуктары, эркиндиктери тууралуу ой жүгүрткөн акылмандар болгон."},{"t":"p","h":"Советтик бийлик орногондон кийин 1918-жылы 10-январдагы Советтердин үчүнчү съездинде В. И. Ленин тарабынан иштелип чыккан эмгекчилердин жана эзилген элдин укуктарынын декларациясы кабыл алынган. Анда расасына жана улутуна карабастан жарандардын тең укуктуулугу жарыяланган. 1918-жылы 10-июлда Советтердин V съезди биринчи Советтик конституцияны кабыл алган. Бул Конституцияга ылайык, жарандар тең укуктуу болгон эмес. Соодагерлер, дин кызматчылары, полициянын мурдагы кызматкерлери, жалданма жумушта иштегендер жана мүчөлөрү шайлоо укугунан ажыратылган. Адамный жЖекеүукугуй"},{"t":"p","h":"ГЫ <span class=\"pg\" data-n=\"105\">105<\/span>коргоо боюнча эч кандай кепилдик жазылган эмес. 1924- жылы январда Бүткүл Союздук Советтердин П съезди СССРдин биринчи конституциясын кабыл алган. Конституцияда улуттардын мамлекеттүүлүккө болгон укугунун мыйзамдуу экендиги бекемделген. 1986-жылы Конституцияда СССРде эксплуататордук таптардын жоюлгандыгы жана социализмдин негиздеринин түзүлгөндүгү белгиленген. Конституцияда Совет адамдарынын укуктары бөлүмүн Николай Иванович Бухарин даярдаган. Бул конституциянын эң жакшы бөлүгү болгон. Анда Бухарин сталинчиликтин таасирисиз жана бурмалоосуз түзүлө турган Советтик коомду мүнөздөгөн. Шайлоо системасы жаңыртылып, жашыруун добуш берүүчү жалпы жана тике шайлоолор киргизилген. Жарандардын укуктары жана эркиндиктери кеңейтилип, сөз, басма сөз, чогулуш эркиндиктери жеке адамга кол тийбестик, сотсуз жазалабоо укуктары жарыяланган. Социалдык-экономикалык укуктар бекитилген. Бирок конституция турмушта көптөгөн карама-каршылыктарга учураган жана чыныгы турмушка тиешеси жок болгон. 1977-жылы \"7-октябрда СССРдин Конституциясы кабыл алынган. Жаңы Конституцияда Коммунисттик партиянын башкаруучулук ролу көрсөтүлгөн. Анын 6-беренесинде Компартия Совет коомунун жетекчи жана багыттоочу күчү катары берилген. Конституцияда формалдуу түрдө болсо да негизги демократиялык эркиндиктер, сөз, басма сөз, чогулуштар, митингдер жарыяланган. Советтик укуктун башкы өзгөчөлүгү болуп адамдын, жарандын кызыкчылыгынан коомдук мамлекеттик кызыкчылыкты жогору коюп, идеологиялык курал катары кызмат кылгандыгы эсептелет."},{"t":"p","h":"Кайра куруу мезгилиндеги укук 1985-ж. апрель Пленумунда өлкөнү ар тараптан кайра куруу каралган. Анын ичинде экономикалык жана саясый укуктар дагы бар. Мисалы, экономика тармагында жетекчилик кылуунун эскирген администрациялык-тескөөчүлүк ыкмалар (кысым көрсөтүү, буйрук, жазалоо) алмаштырыла баштаган. Алардын ордуна материалдык жактан кызыктыруу ыкмалары киргизилип, эмгекчилердин демилгеси колдоого алынган ж. б."},{"t":"p","h":"Саясый тармактарда да адамдар бир кыйла кенири укуктарга ээ болгон. Саясый реформалардын жүрүшүндө бийликтин <span class=\"pg\" data-n=\"106\">106<\/span>жогорку органдарын түзүү, шайлоо системасын жаңыртуу каралган."},{"t":"v","l":["Кайталоо үчүн суроолор","% 1. Советтик биринчи конституция жана анын өзгөчөлүктөрү."]},{"t":"p","h":"2. Конституциядагы карама-каршылыктар жана алардын натыйжа-"},{"t":"p","h":"лары."},{"t":"p","h":"25 з. Кыргыз коомчулугундагы адам укуктары жана эркиндиктери туу-"},{"t":"p","h":"ралуу ой жүгүрткөн ойчулдар жана алардын чыгармалары."},{"t":"v","l":["4. Кайра куруу мезгилиндеги адам укуктары?","5. Адат укугу жана анын мааниси?"]}],"sub":[{"title":"Конституция жана башка укук булактары","b":14},{"title":"Мамлекеттин негизги мыйзамы эң","b":17},{"title":"Укук булактары","b":21},{"title":"Укук мамилелери","b":38},{"title":"§ 25. БАЙЫРКЫ ДҮЙНӨДӨГҮ, ОРТО КЫЛЫМДАГЫ ЖАНА ЖАҢЫ ДООРДОГУ УКУКТАР","b":61},{"title":"Байыркы дүйнөдөгү укук","b":74},{"title":"§ 26. СОВЕТТИК ДООРДОГУ УКУК","b":93},{"title":"Кыргыздардын адат укуктары","b":100}],"section":"ШГЛАВА","pages":[95,106]},{"title":"§§ 27–28. БУУНУН ТҮЗҮЛҮШҮ ЖАНА АДАМ УКУКТАРЫНЫН ЖАЛПЫ ДЕКЛАРАЦИЯСЫ","blocks":[{"t":"h3","h":"§§ 27–28. БУУНУН ТҮЗҮЛҮШҮ ЖАНА АДАМ УКУКТАРЫНЫН ЖАЛПЫ ДЕКЛАРАЦИЯСЫ"},{"t":"v","l":["Т үш үнүктөр:","БУУнун түзүлүшү.","Декларация.","‚ Укуктардын типтелиши.","","Негизги даталар:",". Преамбула.",". Эл аралык Билл."]},{"t":"p","h":"1944-ж. Думбартон-Окстагы конференция БУУнун уставы. 1945-ж. 26-июнь Сан-Франциско Уставка кол коюу."},{"t":"v","l":["1945-ж. 24-октябрь БУУ кучуне кирген.","1992-ж. 2-март Кыргызстан БУУга муче болгон."]},{"t":"p","h":"1948-ж. 10-декабрь «Адам укуктарынын жалпы декларациясы»."},{"t":"p","h":"1966-ж. 16-декабрь жарандык жана саясый укуктар женундегу Эл аралык пакт."},{"t":"p","h":"1966-ж. БУУ экономикалык социалисттик жана маданий укуктар женунде Эл аралык пакт. Ал 1976-жылы кучуне кирген."},{"t":"p","h":"Тапшырма:"},{"t":"p","h":". БУУ жана алардын аткарган иштери тууралуу кандай маалыматтарды билесиңер."},{"t":"p","h":". Адам укуктарынын жалпы декларациясында кайсы укук эң маанилүү деп көрсөтүлгөн, эмне үчүн?"},{"t":"p","h":". Силер кайсы укугуңарды маанилүү деп эсептейсиңер? Алардын маанилүү экендигин далилдегиле."},{"t":"p","h":"<span class=\"pg\" data-n=\"107\">107<\/span>* БУУнун түзүлүшүнүн жана Адам укуктарынын жалпы декларациясынын кабыл алынышынын тарыхый маанисин анализдеп айтып бергиле."},{"t":"p","h":"БУУ – Бириккен Улуттар Уюму Әл аралык уюм. БУУнун негиздөөчүлөрү болуп 51 мамлекет эсептелинет. Әкинчи дүйнөлүк согуш мезгилинде (1939-1945) Гитлерге каршы коалицияга кирген башкы мамлекеттер, БУУнун негизги принциптерин иштеп чыгышкан. СССР, АКШ жана Улуу Британиянын тышкы иштер министрлеринин Москвада өткөн ке-, ңешмесинде (1948) эл аралык уюмду түзүү маселеси каралган. Ошол эле жылы бул өлкөлөрдүн мамлекет башчыларынын Тегерандагы жолугушуусунда дагы ушул маселеге токтолушкан. БУУнун уставы 1944-жылы Думбартон-Окстагы конференцияда иштелип чыккан. 1945-жылы 26-июнда Сан- Францискодогу уюштуруучу конференциянын катышуучулары тарабынан кол коюлган. 1945-жылдын 24-октябрынан тартып расмий түрдө кабыл алынган жана күчүнө кирген. Ошондон баштап, жыл сайын ушул күн дүйнөлүк коомчулук тарабынан БУУнун күнү катары белгиленип келүүдө. БУУнун уставы кириш бөлүмдөн жана 111 беренеден турат. Анда БУУнун эл аралык сотунун статусу көрсөтүлгөн. БУУнун негизги максаттары уставдын 1-беренесинде жарыяланган, алар тынчтыкты, коопсуздукту коргоп жана бекемдөө, мамлекеттер арасында кызматташтыкты өнүктүрүү, адам укуктарын коргоо, дүйнөдөгү жакырчылыкты жана сабатсыздыкты жоюу агрессиячыл ар кандай аракеттерди токтотуу жана жоюу. Бириккен Улуттар деген сөздү АКШнын президенти Рузвельт сунуш кылган. БУУнун уставы бардык элдердин идеясын жана максатын чагылдырат."},{"t":"img","src":"data:image/webp;base64,UklGRhgwAABXRUJQVlA4IAwwAACwzQCdASoeAoABPrVWpUynJKeiqBW54PAWiWNnu87Fv//yiviX//oBf/4r/u+dfI//Nv//S2Qs8/If9/DkFY4NL1DpE7EOSZwhrrfvjATqrrpNf49uk1lUc7Zr/uX/b55PUJ+/N9nzqD4d43ab4z/w7vkd+Dx9KXHsr/zvU/tFyIOY7UgCK3CfvpQiC9EhXIwpir2FScdiPA1OMMYrcJ++lCIJ8gkry3ci8rlTIWsRhjFaUu5MIhpOEqLyAJ8jWi9Y49odzAvFuSHzs7CxFcjnyFPDGY3JvkBwgURcjJeWnnQjNh55q1YSKokfFk0VSgn+6kKkgTH/ijW5RZ6CMHztYSm1Phba7JhqX2hDxKo8KTnKBtraY0Pam5XdASoUFItQtsVnD2YrqlJ98WPfFpZ/IVZGRjkppRdLUaOVCGyf//cPU//nWAg2zQPC+Af6GuU8sPQCI2e76c5sLNk9Gm83qoppDoQhZu/PXn0FjDVqp5iX0KkOrxK8VBK/D+FUeGQUmMM54APePhwMkpNa//fuaPCnLOrM7YqRoOF5IpybIseMIjfEh01cPUoLSSxvjf/1116t3Gtw8zi4y/Ad5bEh3XtNoRP9SMLta/RJ3f5js8FFjOXPb6q+GSzBJtHHqNtBU92ttLx+FO9U7/O/0hZjI/Yd+2YliG0hud4dtWfwlEiSdsd9S2j5EFzfcb6QG5dMgmyIkWGgK3VrbKVXylEjOjqVW1eOZqHH87RPsvNLTlPoagAlypeOmL+zkt90JdA0FdHp2cd/1Lo7BJ2ZT/Mlooh+wKBCi/pq3MA9v0sNTlAm3lPRQErqssuFAMIgw4FKhmnCd8/I2Zo43iyj3dI3zNEn0Bo2p0t0JeLf8rIoe/DZ569I1ksa+2ezTxbg7+ojJWtAQntbOHJKWyzjz+vzLw1Y0ngMddImX тыйт. Конвенция менен Декларация түшүнүгүнүн ортосунда чоң айырмачылык бар."},{"t":"p","h":"Конвенция – бул укуктарды аныктоочу мыйзам милдеттендирүүчү документ. Аны аткаруу менен ишке ашыруу механизмин чагылдырган документ."},{"t":"p","h":"Декларация латын сөзүнөн которгондо «жарыялоо» дегенди билдирет. Милдеттендирбейт. Расмий жарыялоо. Мамлекеттин ички же тышкы саясатынын негизги принциптери, саясий партиялардын программалык жоболору, эл аралык уюмдардын ишмердүүлүгүнүн негизги жоболору декларация түрүндө жарыяланат."},{"t":"img","src":"data:image/webp;base64,UklGRkhsAABXRUJQVlA4IDxsAADwcAGdASrVAckBPrFKnUmnJCmmrzYN+TAWCU3AqUqfe8f9jQC/JpL/ReY7mXmQu39A/f7/6+TH+g6P3JLlGd6L+K//EYJfqkMOs68pTlD82fT+A2dkwPu4PPB8w+aZ6E32D0+v+nyBg76oV19dPchJjyv5wxkcObn/Nvs3emH+wekP0n+dN3bP105V/+add/6L+i/6v9b7XF6f5fwR/sHcY7Nf47xDsk//n2pPd+ZBz8es7/r52fxH/t6S/BkPB//X79ewj91/+/78oaQooCFpAqxjJgcd7EWqYZyiUpbq5c5aiUvXDZ1bOgo6yO4ie9NulXke/uMsV7tU1AsJLgR/a7WqqVGdrTxpDYlUCKgNxTM13jUSiU4g4SE/v78bqgPftf1a2exphP4ZrSmJbHBS7RoM9SVIK17f0pHHEIyeliaUy8ye5+F4HQMdDqjnFZxoqVKB8kxXyomVDgSNAjN0pC8+4N9agXT/G6shqmiRwuU5HGBJDWuCtdRVl7s+taoEtZ6D6GH2Vg+t3FQZ8TfMwx80Jof+n5va/fLWB6hegKv3yEBJc9ffue1aBPhnLm8z/WJ8qcesjQNIBnqZgkFOyMHkitjbQHlp7xwxa14yBAwmgxPs5HyY5mrWKBT3QX2BUXe+UgnzRVhiLzIHU45/ywY8WnIpkXOqfYs/S3zrb+iL8xY3oFAIp8VvaXgLFgJcnVGmq8PHxE+SlKGNX0IQMz/bGw4bfemK5VLnoqlyIrBPn3GX3+Sd1TIUSEOAhDwF2CHSqZFRRF+EZnVKMaRJ48Jfu9R2GolwiGdboWijmNCJJcZrVDhcNDSgxr6ew83gYSIXUL9EUFTKiQhU91Xrw3b+Sq2IoXNHPFABquEttTG+BRt96BsapvflSSGfRSslBPNLcuKMtbKz3UJI2a/BIBYUDvo6PyBHL1yq8fKMEJ3ED2s54LGNku1WxOLWTJ+LuKJ+5ZCMfPasqCzvrGGY//vwQqtSFAGs91fNq3TfkDvzrgbOiU9gCKNNyX+poGZbjiu2kuR7R1y2179gRytALog6dQXLVeSK0g334HPXmyUHlD3zELqG68RfCH4D335EkXNvFcW1JK+vKxNPFcB91GL6+T3k7Pyag+ZPWh1SgP0GTuLan8oek2lxdH+399+9zfvzjuOfrzorXOr2RGH0h0mcLlJj2MM6dnCsa6GB1cY/S7WFk+/FSwnlnhu3kMBvnP595PaBvBMuqHLjT+LkcqIvoHI9tQJMppT/jzquzo7RnFlHhv/EJsKrhkpyzMgptAvEpCbN5cgJCgE/+VjamUX+ox1kz3NZ8LFdN5O/7JYN6VvxUK4vtDHVGEJEnn7Z0n0jtrkga/NrOuiYmsMmdsPTjJhsrJP1O11mjRrCoo/uNFZZ21tzG7jHP1S ":"38-берене. Мамлекет сенин укуктарындын сакталышына жооп бериш керек."},{"t":"p","h":"б-берене. Сен жашоого, ден-соолукта өнүгүүгө укуктуусуң. 24-берене. Сен мыкты медициналык кызмат алууга укуктуусуң."},{"t":"p","h":"28-берене. Сен билим алууга укуктуусуң."},{"t":"p","h":"81-берене. Сен эс алууга, ойногонго жана чыгармачылык менен иштөөгө укуктуусуң."},{"t":"p","h":"41-берене. Сен өз укуктарынды билүүгө укуктуусуң. Аны чоң кишилер дагы билип сыйлашы керек (7-тиркеме, 131-1338-66.)."},{"t":"h3","h":"Укук бузуунун себептери"},{"t":"p","h":"Укук бузуулардын себептери ар кандай жана ето эле көп. Өспүрүмдөрдүн укук бузууларынын башкы себептерине, жоопкерчиликтин жоктугу, ата-энелердин жана улуулардын балдарга болгон кайдыгер мамилеси, тарбиянын, жазаланып калам деген коркуу сезиминин жоктугун киргизсек болот. Мындай терс сапаттар ар кандай укук бузууларга түрткү берет. Тарбиясы жок балдар улууларды сыйлашпайт, жаман сөздөр менен сүйлөшөт, ата-энелерине жардам беришпейт, сабактарын начар окушат, алсыз жана кичине балдарды ызалашат."},{"t":"p","h":"<span class=\"pg\" data-n=\"115\">115<\/span>Уурулукка, талап тоноочулукка барышат. Акырында жасаган укук бузуулары үчүн жазага тартыла башташат. Убагында ойлонуп өзүн көзөмөлгө алган балдар турмушун туура жолго салып кете алат. Ал эми кээ бири кылмыштуулуктун жолуна түшүшөт."},{"t":"p","h":"Укук бузуулардын себептеринин дагы бири – руханий дүйнөнүн жардылыгы. Ошондуктан, ар бир өспүрүм келечекте жакшы адам болууну көздөсө өзүнүн рухий дүйнөсүн байытып көркөм адабияттарды көп окуп, маданият, искусствонун жетишкендиктери менен таанышып, ар кандай ий-' римдерге, спортко катышып туруулары керек. Ар бир адам өзүн адам катары бааласа, маданияттуу болууга тийиш. Андай адамдар эч убакта ар кандай жамандыктарга барбайт. Ар бир өспүрүм азыркы заман билимдүү, маданияттуу, жаңычыл, чыгармачыл, иштерман адамдардын заманы экендигин эстеринен чыгарбоолору керек."},{"t":"p","h":"Кыргыз Республикасынын эмгек кодексинен:"},{"t":"p","h":"* 16 жашар бала менен эмгек келишимин түзсө болот. 14 жаштагы бала ишке орношуудан мурда анын ата-энесинин (опекундарынын, багып алган адамдарынын) жазуу түрүндөгү макулдугу керек (817 берене)."},{"t":"p","h":"* 18 жашка чейинки балдарга ден-соолукка зыян келтире турган жана оор жумуштарда иштөөгө тыюу салынат. Мисалы, оор нерселерди көтөргөнгө, жер астындагы жана уулуу зат өндүргөн ишканаларда иштөөгө тыюу салынат."},{"t":"p","h":"Ишке кирип жатканда мыйзам боюнча өспүрүмдөрдүн жашы такталат. Өспүрүмдөр 16 жашка толгонго чейин жумуш убактысынын узактыгы жумасына 24 саат болот. Ал эми 16 жаштан 18 жашка чейин 86 саатты түзөт. 18 жаштан жогору бардык жарандар үчүн жумуш убактысы 41 саат."},{"t":"p","h":"Әмгекке болгон укуктардан сырткары милдеттер да бар. Ал эмгек тартибин сактоо. Мисалы, ишти себепсиз калтырбоо, иштеген ишиңден брак чыгарбоо ж. б. Әмгек тартибин бузган адамдарды администрация тартиптик жоопкерчиликке тартат. Мындай жоопкерчиликке сөгүш жарыялоо, эмгек акысы төмөн ишке которуу жана иштен бошотуу кирет."},{"t":"p","h":"Кайталоо үчүн суроолор % 1. Кайсы жылы жана ким тарабынан Балдар укугунун декларациясы 2 \\штелип чыккан? Качан, кайсы декларациялар кабыл алынган?"},{"t":"p","h":"<span class=\"pg\" data-n=\"116\">116<\/span>2. Балдар Укугунун Конвенциясы качан, ким тарабынан кабыл алын-"},{"t":"p","h":"ган жана аны Кыргызстан качан ратификациялаган? Ал канча беренеден турат?"},{"t":"p","h":"о. Конвенция менен Декларациянын айрымачылыктары.. Өзүңдүн негизги укуктарындан айтып бер."}],"sub":[{"title":"Укук бузуунун себептери","b":16}],"section":"ШГЛАВА","pages":[114,116]},{"title":"§ 30. УКУК ТАРМАКТАРЫ","blocks":[{"t":"h3","h":"§ 30. УКУК ТАРМАКТАРЫ"},{"t":"v","l":["Т үш үн уктер:",". Конституциялык укук.",". Администрациялык укук.","","Тапшырма:",". Үй бүлөө укугу.","* Жарандык укук.","",". Укук тармактарын ким кандай түшүнөт?"]},{"t":"p","h":". Адам укуктарын эмне үчүн укук тармактарына бөлөбүз?. Конституциялык жана жарандык укуктардын бири-биринен болгон өзгөчөлүгү?"},{"t":"p","h":"Укук коомдогу бардык мамилелерди б. а. жарандардын, мамлекеттик органдардын жана башкалардын өз ара мамилелерин жөнгө салып турат."},{"t":"p","h":"Ал мамилелер көп болгондуктан, алардын өзгөчөлүктөрү боюнча тартипке келтирилип укук тармактары түзүлөт."},{"t":"p","h":"Укук тармактары негизинен укук ченемдеринин өзгөчөлөнүп жыйналган тобу болуп эсептелет. Бул ченемдердин топтору, алар жөнгө салуучу коомдук мамилелердин жалпылыгына, окшоштугуна жараша түзүлөт."},{"t":"p","h":"Укуктун төмөнкүдөй тармактары бар:"},{"t":"p","h":"Конституциялык же мамлекеттик укук, жарандык укук, шайлоо укугу, администрациялык укук, эмгек укугу, турак-жай укугу, үй-бүлө укугу, салык укугу, финансы укугу жана башка. Әми ушул укук тармактарынын айрымдарына топтолуп көрөлү."},{"t":"h3","h":"Конституциялык укук"},{"t":"p","h":"Бул – тармак мамлекеттик жана коомдук мамилелерди аныктап, социалдык-экономикалык жана саясый түзүлүштөрүн, адам укугу менен эркиндиктерин, жарандардын укуктарын жана милдеттерин, мамлекеттик органдардын уюштурулушун аныктоочу негизги укук тармагы болуп эсептелет. Конституциялык укукту курап турган укуктук ченемдер – <span class=\"pg\" data-n=\"117\">117<\/span>Конституциялык укуктун ченемдери деп аталат. Анын милдети Конституциялык укуктун предметин курап турган коомдук мамилелерди жөнгө салууда турат. Конституциялык укуктук ченемдерди ишке ашыруунун натыйжасында Конституциялык укуктук мамилелер келип чыгат."},{"t":"p","h":"Ал мамилелер Конституциялык укуктун ченемдери менен жөнгө салынган коомдук мамилелер болуп эсептелет. Конституциялык (мамлекеттик) укуктун башкы булагы болуп Кыргыз Республикасынын конституциясы эсептелет. Конституция эң жогорку юридикалык күчкө ээ болгондуктан бардык мыйзамдар жана башка актылар, Конституциянын негизинде жана ага ылайык чыгарылат."},{"t":"p","h":"Ченемдик укуктук актылар Кыргыз Республикасында ар түрдүү органдары: Жогорку Кеңеш, Президент, өкмөт, жергиликтүү өзүн-өзү башкаруу органдары тарабынан чыгарылат."},{"t":"h3","h":"Жарандык укук"},{"t":"p","h":"Жарандык укук – бул жарандардын өз ара жана жарандар менен юридикалык жактардын ортосундагы мамилени жөнгө салган укук тармагы болуп эсептелет. Ошондой эле юридикалык жактардын өз ара мүлктүк жана мүлктүк эмес мамилелерин жөнгө салат."},{"t":"p","h":"Юридикалык жак деп менчигинде же башкаруусунда мүлкү бар жана өз милдеттенмелери үчүн ушул мүлкү менен жооп берген, башкалар менен келишим түзө алган уюмдарды айтабыз."},{"t":"p","h":"Жарандык укук жеке укуктардын ортосундагы мамилелерди аныктаган укуктар жана милдеттер жөнүндөгү илим. Жарандык укуктун булагы Рим укугунан башталат. «Жарандык укук» деген термин б.з.ч. V к. ортосунда (б.з.ч. 449-ж.) Байыркы Римде жаралган."},{"t":"p","h":"Жарандык укук бардык жарандык мамилелер үчүн маанилүү жоболорду, т.а. жарандык укук жана милдеттердин келип чыгышы аларды коргоо ар кандай чечимдердин түрлөрү, доо коюу мөөнөтү, өкүлчүлүк, ишеним кат, мөөнөт ж. б. жөнүндөгү жоболорду камтыйт."},{"t":"p","h":"Кыргыз Республикасынын жарандары Ата Мекенди коргоого, салык жана жыйым төлөөгө милдеттүү. Социалдык камсыздандырууга, эмгектенүүгө, эс алууга, билим алууга, денсоолугун сактоого, шайлоого ж. б. укуктуу."},{"t":"p","h":"Жарандык укуктун негизги булагы болуп, Кыргыз Республикасынын Конституциясы жана Кыргыз Республикасынын <span class=\"pg\" data-n=\"118\">118<\/span>жарандык Кодекси эсептелет. Бул Кодексте жарандык укуктарды ишке ашыруунун шарттары белгиленген."},{"t":"h3","h":"Шайлоо укугу"},{"t":"p","h":"Шайлоо укугу жарандардын шайлануучу органдарды шайлоого жана өздөрү шайланууга болгон укуктарын жөнгө салуучу укук тармагы болуп эсептелет. Бул укук тармагы өзүнчө укук булактарына ээ. Кыргыз Республикасынын Жогорку Кеңешинин мыйзам чыгаруу жыйыны тарабынан 1999- жылдын 29-апрелинде Кыргыз Республикасындагы Шайлоо жөнүндөгү кодекси кабыл алынган."},{"t":"p","h":"Администрациялыкк укук Мамлекеттик башкаруу органдарын уюштурууда жана аларды аткаруу иш аракетинин жүрүшүндө келип чыгуучу коомдук мамилелерди жөнгө салат. Анын негизги булактарына Кыргыз Республикасынын Конституциясы жана мыйзамдары, Жогорку Кеңештин указдары кирет."},{"t":"p","h":"Администрациялык укуктун ченемдери аткаруу – тескөө, иштерин жүргүзгөн органдарды түзүүнүн, өзгөртүүнүн, жоюунун эрежелерин аныктайт. Ошол органдардын, аларда иштегендердин, ошондой эле жарандардын укуктарын жана милдеттерин белгилейт. Ал органдарга финансылоо, курулуш, айыл чарба, транспорт, байланыш, билим берүү, илим, маданият, саламаттыкты сактоо, социалдык камсыздандыруу жана башка кирет. Айтылган органдардын иштөө тартиби ушул администрациялык укук менен жөнгө салынат."},{"t":"p","h":"Әмгек укугу Әмгек укугу – жумушчулар менен кызматчылардын ишкана, уюм, мекемелердеги ж. б. иш берүүчү жайлардагы эмгегин жөнгө салат. Әмгек укугу эмгектенүүгө байланыштуу жумушчулар менен кызматчылардын жана ишкана, мекеме, уюмдардын ж. б. иш берүүчүлөрдүн ортосунда болгон мамилелерди, эмгек талаптарын коргоо боюнча мамилелерди жөнгө салат. Әмгек укугунун булагы болуп Кыргыз Республикасынын Әмгек Кодекси эсептелет."},{"t":"p","h":"Үй-бүлө укугу Бул укуктун ченемдери нике жана үй-бүлөгө байланыштуу келип чыгуучу өздүк жана мүлктүк мамилелерди жөнгө <span class=\"pg\" data-n=\"119\">119<\/span>салат. Үй-бүлө укугунун негизги ченемдүү документи болуп Кыргыз Республикасынын нике жана үй-бүлөө Кодекси эсептелет. Бул кодексте никелешүүнүн тартиби жана шарттары, жубайлардын укуктары, милдеттери ата-эне жана балдардын укук милдеттери ж. б. аныкталган."},{"t":"p","h":"Салык укугу Укуктун бул тармагынын мааниси өтө жогору. Анткени ' мурда бардык ишканалар мамлекеттин менчигинде болуп, алардан түшкөн кирешелер мамлекеттин бюджетин түзүүчү. Азыр болсо, ишканалар менчиктештирилип, алардан түшкөн кирешелер менчик ээлеринин колунда калат."},{"t":"p","h":"Мамлекеттик бюджет болсо, алардын төлөгөн салыктарынын негизинде түзүлөт. Мындан сырткары, салыктар айлык акыдан, жерди, сууну пайдалануудан түшкөн төлөмдөрдөн топтолот."},{"t":"p","h

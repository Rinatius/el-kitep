":"Алардан мамлекеттик органдарды, окуу жайларын, мектептерди, ооруканаларды күтүү үчүн, мугалимдерге, врачтарга айлык төлөө үчүн, кары-картаңдарга пенсия төлөө үчүн, студенттерге стипендия берүү үчүн каражат жумшалат."},{"t":"p","h":"Кыргызстанда салык мамилесин жөнгө салуу үчүн «Салык Кодекси» иштелип чыккан. Салык төлөөдөн баш тартуу, кылмыш катары каралып, жоопко тартылат."},{"t":"p","h":"Жер укугу Жер, суу, токой жана жердин ички кендери жалпы элге тиешелүү элдик байлык болуп эсептелет. Ошондуктан жерге, сууга, токойго жана кен байлыктарга болгон мамилелерди жөнгө салуу үчүн ар бири өзүнчө укуктун тармагы болуп бөлүнгөн."},{"t":"p","h":"Жер укугу жерге карата келип чыккан мамилелерди жөнгө салат. Кыргыз Республикасында жерге жеке менчик укугу белгиленген, ошондой эле жерди ижарага алууга, сатып алууга мүмкүн. Калктуу пункттарда үй салуу, ишкердик жүргүзүү үчүн, айыл жерлеринде дыйкан чарбасын жүргүзүү үчүн жерлер бөлүнүп берилет."},{"t":"v","l":["Кыргыз Республикасындагы жерлер:","1. Айыл чарба жерлери.","2. Калктуу конуштардын жерлери."]},{"t":"p","h":"8. Өнөр жайга, транспортко, коргонуунун ж.б. тармактарына бөлүнүп берилген жерлер."},{"t":"p","h":"<span class=\"pg\" data-n=\"120\">120<\/span>4. Жаратылышты коргоого, тарыхый, маданий тармактарга тиешелүү жерлер."},{"t":"v","l":["5. Токой фондусунун жерлери.","6. Суу фондусунун жерлери.","Т. Сактоодогу жерлер."]},{"t":"p","h":"8. Бул жерлер өзгөчөлүктөрү боюнча мыйзамдар аркылуу жөнгө салынат. Жер жөнүндөгү мыйзамдардын эң негизгиси Жер кодекси болуп эсептелет."},{"t":"p","h":"Суу укугу Суу жөнүндөгү мыйзамдардын эң негизгиси болуп Кыргыз Республикасынын Суу кодекси саналат. Анда суу мамилелерин кандай органдар жөнгө салаары, сууну пайдалануу тартиби, сууну сактоо жана анын зыяндуу таасирин алдын алуу боюнча жоболор, суу тууралуу мыйзамдарды бузгандык үчүн жоопкерчиликтер каралган."},{"t":"h3","h":"Турак-жай укугу"},{"t":"p","h":"Укуктун бул тармагы жарандар менен мамлекеттин ведомстволордун турак-жай менен байланышкан мамилелерди Турак жай кодекси аркылуу жөнгө салынат. Турак-жайды мурдагыдай мамлекет тарабынан куруу сакталып калды. Ошондой эле үй куруу үчүн жер тилкелери берилет. Мурдагы турак-жайларды менчикке өткөрүп берүү жүргүзүлгөн. Азыр каалаган адам өз квартирасын башкага сатат же сатып алат. Мурда бир үйдү гана менчигинде ээлей алса, азыр андай чектөө жок."},{"t":"p","h":"Кайталоо үчүн суроолор % 1. Укук тармактары жана алардын түрлөрү тууралуу эмнелерди бил-"},{"t":"p","h":"диң?"},{"t":"p","h":"= 2. Конституциялык жана жарандык укук тармактарынын ез ара бай-"},{"t":"p","h":"ланыштары тууралуу айтып бер."},{"t":"p","h":"3. Эмгек укугунун мааниси жана максаты тууралуу ой белушкуле."},{"t":"p","h":"4. Салык укугунун мааниси жана ал эмне учун керек?"},{"t":"p","h":"5. Балдардын эмгек укуктары бузулган учурлардан мисал келтир."}],"sub":[{"title":"Конституциялык укук","b":8},{"title":"Жарандык укук","b":12},{"title":"Шайлоо укугу","b":19},{"title":"Турак-жай укугу","b":37}],"section":"ШГЛАВА","pages":[117,120]},{"title":"§ 31. МЫЙЗАМ ЖАНА УКУК КОРГОО ОРГАНДАРЫ","blocks":[{"t":"h3","h":"§ 31. МЫЙЗАМ ЖАНА УКУК КОРГОО ОРГАНДАРЫ"},{"t":"v","l":["Тушун уктер:","„Мыйзам.","* Конституциялык мыйзам.",". Жөнөкөй мыйзам.","*. Укук коргоо органдары."]},{"t":"p","h":"<span class=\"pg\" data-n=\"121\">121<\/span>Тапшырма:"},{"t":"p","h":"* Заң (мыйзам) алдында бардыгын бирдей баалайм,"},{"t":"p","h":"Жөнү жок каралабайм же актабайм. Ж. Баласагын.. КРда бардык адамдар мыйзам жана сот алдында бирдей (Конституция 16-берене)."},{"t":"p","h":"Әкөөнү салыштырып окуп, окшош жактарын белгиле. Жусуп Баласагын мурдатан эле (ХТЇ к.) бардык адамдардын мыйзам алдында бирдей экендигин айтып кеткендигин далилдеп бер."},{"t":"p","h":"«Мыйзам буйлаланган төө, каякка бурсаң кете берет». Әлдик макал."},{"t":"p","h":"Мыйзам тууралуу айтылган бул макалдын азыркы учурга канчалык дал келээрин салыштырып далилдеп бер."},{"t":"p","h":"Мыйзам – бул мамлекеттик жана коомдук турмуштагы эң маанилүү маселелерди жөнгө салуучу укуктук акт. Ошондой эле, мамлекет белгилеген жалпыга милдеттүү жүрүш-туруш ченемдери болуп эсептелет."},{"t":"p","h":"Мыйзам эки мааниде айтылат:"},{"t":"p","h":"1. Кеңири мааниде алганда, бардык ченемдик укуктук актылар жана мамлекет белгилеген жалпыга милдеттүү бардык эрежелер мыйзам болуп эсептелет."},{"t":"p","h":"2. Укуктук мааниде болсо, мамлекеттик бийликтин жогорку өкүлчүлүк органы Жогорку Кеңеш тарабынан же жалпы референдумда кабыл алынып, өтө маанилүү коомдук мамилелерди жөнгө салуучу ченемдик актылар, буйруктар, токтомдор айтылат."},{"t":"p","h":"Мыйзам мааниси боюнча конституциялык жана жөнөкөй болуп бөлүнөт."},{"t":"p","h":"Конституциялык мыйзам – бул конституциядан жана конституцияга өзгөртүү киргизүү үчүн кабыл алынган мыйзамдардан турат. Коомдук жана мамлекеттик түзүлүштүн негиздерин мыйзам түрүндө бекемдейт."},{"t":"p","h":"Жөнөкөй мыйзамдарга кодекстештирилген жана учурдагы мыйзамдар кирет, мыйзамды ар бир өлкөдө ар түрдүүчө чыгарышат. Бирок жалпыга бирдей тиешелүү кээ бир белгилери бар."},{"t":"p","h":"Мисалы, мыйзам чыгаруу демилгесин көтөрүү, мыйзам долбоорун парламенттик комитеттерде талкуулоо, мыйзамды кабыл алуу жана жарыялоо."},{"t":"h3","h":"<span class=\"pg\" data-n=\"122\">122<\/span>Укук коргоо органдары"},{"t":"p","h":"Белгиленген укук тартибин бузган адамдарга карата, мамлекеттик мажбурлоо чараларын колдонуу аркылуу, калктын таламдарын ар кандай кол салуулардан коргоочу органдар укук коргоо органдары деп аталат. Аларга: прокуратура, милиция, улуттук коопсуздук органдары, финансы полициясы кирет."},{"t":"h3","h":"Прокуратура"},{"t":"p","h":"Прокурор (лат. – кам көруу) КРнын прокуратура системасындагы прокурордун көзөмөлдөө жана кылмыш иштеринин айрымдарына тергөө жүргүзүүчү, сот өндүрүшүндө мамлекеттик айыптоону ишке ашыруучу кызмат адамы."},{"t":"p","h":"Прокуратура органдарында юридикалык жогорку билими бар, керектүү адистик жана моралдык сапаттарга ээ, ден соолугу жагынан ишке жарактуу жараны прокурор жана тергөөчү боло алышат."},{"t":"p","h":"Прокуратура төмөнкүдөй иштерди аткарат:"},{"t":"p","h":"1. Аткаруу бийлигинин органдары, жергиликтүү өз алдынча башкаруу органдары, алардын кызмат адамдары тарабынан мыйзамдардын так сакталышын көзөмөлдөө;"},{"t":"p","h":"2. Изин суутпай издөөнү, баштапкы тергөөнү жүзөгө ашыруучу органдар тарабынан мыйзамдардын сакталышын көзөмөлдөө;"},{"t":"p","h":"8. Жазык иштери боюнча соттун чечимдерин аткарууда, ошондой эле жарандардын жеке эркиндигин чектөөгө байланышкан мажбурлоо мүнөзүндөгү чараларды колдонууда мыйзамдардын сакталышын көзөмөлдөө;"},{"t":"p","h":"4. Мыйзамда белгиленген учурларда сотто жарандын же мамлекеттин кызыкчылыктарына өкүлчүлүк кылуу;"},{"t":"p","h":"5. Сотто мамлекеттик айыптоону ишке ашыруу;"},{"t":"p","h":"6. Мамлекеттик органдардын кызмат адамдарына карата жазык куугунтуктоо."},{"t":"p","h":"Башкы прокурорду Жогорку Кеңештин макулдугу менен Президент дайындайт. Башкы прокурордун сунушу боюнча Президент анын орун басарларын дайындайт жана аларды кызматтан бошотот."},{"t":"p","h":"Райондордун, шаарлардын прокурорлорун жана прокуратуранын жооптуу кызматкерлерин башкы прокурор дайындайт. Прокуратура органдары жергиликтүү бийликтерге көз каранды эмес."},{"t":"p","h":"<span class=\"pg\" data-n=\"123\">123<\/span>Прокуратура кызматкерлеринин төмөнкүлөргө укугу жок, алар: педагогикалык, илимий иштерде иштөөгө, жеке ишмердик жүргүзүүгө, иш таштоого, саясый партиялардын ишине катышууга ж.б."},{"t":"p","h":"Милиция органдары. Милиция Кыргыз Республикасынын Ички иштер министрлиги жетекчилик кылган ички иштер органдарынын курамына кирет. Милициянын атайың бөлүмдөрү бар. Мисалы, кылмыш издөө, экономикалык кылмыштарга каршы күрөшүү, тергөө, коомдук тартипти сактоо. Мамлекеттик автомобиль инспекциясы (МАИ) ж. б. Милициянын райондук бөлүмүндө жашы жетпеген өспүрүмдөрдүн иштери боюнча инспекциялар иштейт. Милиция кызматкерлеринин милдеттери көп. Мисалы, коомдук тартипти сактоо, мыйзамдын ар кандай бузулушууна жол бербөө, мыйзамдын талаптарын так аткаруу."},{"t":"p","h":"Улуттук коопсуздук комитет"},{"t":"p","h":"Бул органдар мамлекеттин коопсуздугун чет өлкөлөрдүн чалгындоочуларынан жана өлкөнүн ичиндеги мамлекеттин негизине зыянын тийгизе турган кылмыштардан сакташат."},{"t":"p","h":"Финансы полициясы – салык өндүрүү боюнча салык инспекциясына жардам көрсөтөт. Бул мамлекеттин бийлик органдарын, укук коргоо органдарын, куралдуу күчтөрдү, саламаттыкты сактоо, билим берүү социалдык камсыз кылуу мекемелерин мамлекеттик бюджеттин эсебинен каржылоону камсыз кылат. Мамлекетибиз социалисттик системада жашап турган кезинде, мамлекеттик жана коомдук ишканаларга жана чарбаларга гана ишмердикти жүргүзүүгө уруксат берилген. Алар жаап-жашырбастан салыкты мамлекетке төлөп турушкан."},{"t":"v","l":["Кайталоо үчүн суроолор","% 1. Мыйзамдын максаттары жана мааниси. 2. Мыйзамдын түрлөрү жана алардын мааниси."]},{"t":"p","h":"3. Кандай укук коргоо органдарын билесиң жана алар кандай иштер-"},{"t":"p","h":"ди аткарат?"},{"t":"p","h":"4. Милиция органдарынын бөлүмдөрү жана алардын милдеттери."},{"t":"p","h":"5. Финансы полициясынын элдин турмушунда жана экономиканын"},{"t":"p","h":"өнүгүшүндө ээлеген орду, кошкон салымы тууралуу айтып бер."}],"sub":[{"title":"Укук коргоо органдары","b":16},{"title":"Прокуратура","b":18}],"section":"ШГЛАВА","pages":[121,123]},{"title":"32. АКЫЙКАТЧЫ (ОМБУДСМЕН)","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"124\">124<\/span>32. АКЫЙКАТЧЫ (ОМБУДСМЕН)"},{"t":"v","l":["Т үш үнүктөр:","* Акыйкатчынын аталыштары.","Акыйкатчынын иштери жана укуктары.","Кыргызстандагы акыйкатчы.","Акыйкатчыга ким кайрылат?","","Негизги. даталар:"]},{"t":"p","h":"1809-ж. Швецияда администрациянын мыйзамдарды колдонуусун текшерген."},{"t":"p","h":"1992-ж. Венада акыйкатчылардын Дүйнөлүк конференциясы болуп өткөн."},{"t":"p","h":"Тапшырма:"},{"t":"p","h":"* Акыйкатчыны ким кандай түшүнөт жана ага кимдер эмне үчүн кайрылышат? (Турмуштан жана ММКлардан мисал келтир.)"},{"t":"p","h":"* Кыргызстандагы акыйкатчынын иш-аракеттерине баа бер."},{"t":"p","h":"1. Акыйкатчы – адам укугун коргоонун институту Дүйнөдө ар кандай деңгээлде адам укуктары бузулбаган бир дагы өлкө жок. Бирок ар бир мамлекет өзүнүн конституциялык түзүлүшүнө карабай өз жарандарынын укуктарын сактоонун камын көрүүдө. Ал эми мамлекеттик бийлик органдары өздөрү ошол укуктарды бузушса кандай кылыш керек? Мындай учурда расмий укуктары бар ортомчу керек. Ал акыйкатчы же акыйкатчы институту кирет."},{"t":"p","h":"Омбудсмен швед тилинен которгондо кызмат Адамы, укук коргоочу дегенди билдирет. Биринчи жолу ал 1809-жылы Швецияда, админстрациянын мыйзамдарды жана мыйзам актыларын колдонуусун текшерүү үчүн пайда болгон."},{"t":"p","h":"1992-жылы Венада 55 мамлекеттин өкүлдөрү катышкан Акыйкатчылардын дүйнөлүк конференциясы болуп өткөн. Акыйкатчы ар кандай өлкөдө ар башкача аталат. Маселен, Россияда Адам укугу боюнча өкүл (уполномочен), Полыпада атуулдардын укугун коргоо боюнча комиссар, Австрия жана Грузияда «элдик коргоочу» деп аталат. Ошондой болсо да, дүйнөлүк коомчулукта Адам укуктарынын жана эркиндиктеринин бузулушунан коргоочу адамды «Акыйкатчы»"},{"t":"p","h":"<span class=\"pg\" data-n=\"125\">125<\/span>(омбудсмен) деп аташат. Акыйкатчы институту бир нече принциптерден түзүлөт:"},{"t":"p","h":"* Карап жаткан арыздары боюнча акыйкатчы башка мамлекеттик органдарга көз каранды болбойт."},{"t":"p","h":". Атуулдар үчүн кайрылууга жеңил болуш керек."},{"t":"p","h":"* Мыйзам түрүндө бекитилген кеңири укуктарга ээ."}],"sub":[],"section":"ШГЛАВА","pages":[124,125]},{"title":"2. Кыргыз Республикасынын акыйкатчысы","blocks":[{"t":"h3","h":"2. Кыргыз Республикасынын акыйкатчысы"},{"t":"p","h":"Кыргызстанда акыйкатчынын укуктук абалы (статусу) акыйкатчы жөнүндө мыйзам менен аныкталган. Акыйкатчыга талапкерликке мурда сот жообуна тартылбаган же соттолгондугу алынып ташталган атуул көрсөтүлөт."},{"t":"p","h":"Акыйкатчыга Президенттин, депутаттык бирикмелердин, жети адамдан кем эмес топтордун, саясый партиялардын жана коомдук бирикмелердин көргөзгөн талапкерлеринин бири парламент тарабынан шайлана алат. Шайлоодо жеңип чыккан талапкер парламенттик жыйында ант бергенден кийин акыйкатчынын ордун ээлейт. Ал беш жылга шайланат жана дагы бир мөөнөткө шайланса болот."},{"t":"h3","h":"Акыйкатчынын аткарган иши"},{"t":"p","h":"Акыйкатчы мыйзамга ылайык төмөнкүдөй иштерди аткарат:"},{"t":"p","h":"* Акыйкатчы адам укуктарынын мамлекеттик кызмат адамдары тарабынан бузулушун изилдейт."},{"t":"p","h":". Атайын Адам укугун коргоого багытталган уюм.. Ал эч качан сот бийлигинин ордун алууга, сот системасына кийлигишүүгө аракеттенбейт. Мамлекеттик бийлик органдары, жергиликтүү өз алдынча башкаруу органдары жана кызмат адамдары тарабынан адам укуктарынын бузулушун көзөмөлдөйт."},{"t":"p","h":"+ Акыйкатчы Адам укуктарынын жана эркиндиктеринин бузулушу жөнүндө арыздарды карайт. Ошондой эле өз демилгеси менен укук бузуу фактыларынын бетин ачып, ар бир факты боюнча иликтөө иштерин жүргүзөт. Алардын жыйынтыктары боюнча мамлекеттик бийликтен кызмат адамдарынан кемчиликтердин жоюлушун талап кылат."},{"t":"p","h":"Акыйкатчы жылына бир жолу Адам укуктарынын жана эркиндиктеринин сакталышынын абалы жөнүндө парламенттин астына доклад менен чыгып сүйлөйт. Ошондой <span class=\"pg\" data-n=\"126\">126<\/span>эле, Адам укуктарын коргоо жөнүндө мыйзамдарды өнүктүрүү боюнча сунуш киргизе алат."},{"t":"p","h":". Акыйкатчы өз милдетин тез жана натыйжалуу аткарыш үчүн бардык документтерди эч кандай тоскоолсуз пайдаланат жана керек болгон учурда президентке, өкмөт мүчөлөрүнө, башкы прокурорго, соттордун төрагаларына кайрыла алат."},{"t":"p","h":"Акыйкатчынын укуктары:"},{"t":"p","h":"* Парламенттин, өкмөттүн, Конституциялык соттун, соттордун жыйындарына, бардык деңгээлдеги кеңештерге, прокуратуранын коллегияларына жана башкаларга катыша алат."},{"t":"p","h":"* Конституциянын жана мыйзамдардын жоболорунун түшүндүрмөлөрүн Парламенттен сурап, кайрыла алат."},{"t":"p","h":"* Жапа чеккен адам маанилүү себептер менен өз алдынча сотко кайрыла албаган учурда, анын ордуна адам укуктарын коргоо жөнүндө сотко арыз менен кайрылат."},{"t":"p","h":"* Жарандык жазалоо иштери жана администрациялык укук бузуу иштери менен тааныша алат."},{"t":"v","l":[". Акыйкатчы кол тийбестик укукка ээ.","Акыйкатчыга ким кайрыла алат?"]},{"t":"p","h":"Акыйкатчыга Кыргыз Республикасынын гана жарандары эмес, туруктуу жашаган орду болбосо дагы улутуна, жаш курагына, саясый диндик ишмердигине карабай бардык адамдар кайрыла алат. Кээ бир учурда, укугу бузулган адамдын атынан анын өкүлү дагы акыйкатчыга кайрылса болот. Акыйкатчыга жеке адамдар гана эмес ар кандай уюмдар дагы кайрыла алат. Жогорку Кеңеш менен мамлекеттик эмес уюмдар да укуктарынын жана эркиндиктеринин бузулушу жөнүндө Акыйкатчыга билдире алат."},{"t":"p","h":"Кайталоо үчүн суроолор % 1. Акыйкатчы түшүнүгү жана ал качан, кайсы жакта пайда болгон?"},{"t":"p","h":"2. Акыйкатчы кайсы өлкөлөрдө кандайча аталат?"},{"t":"p","h":"з. Акыйкатчы институту кайсы принциптерден түзүлгөн?"},{"t":"p","h":"25 4. Кыргызстанда омбудсменге кимдер жана кандай шартта шайлана"},{"t":"p","h":"алат?"},{"t":"p","h":"5. Акыйкатчынын негизги аткарган иштеринен мисал келтир."},{"t":"p","h":"6. Акыйкатчынын кандай укуктарын билесин?"},{"t":"p","h":"7. Акыйкатчыга кимдер, кайсы учурда кайрыла алат?"}],"sub":[{"title":"Акыйкатчынын аткарган иши","b":3}],"section":"ШГЛАВА","pages":[126,126]},{"title":"§ 88. КОНФЛИКТ ЖАНА ТОЛЕРАНТТУУЛУК","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"127\">127<\/span>§ 88. КОНФЛИКТ ЖАНА ТОЛЕРАНТТУУЛУК"},{"t":"v","l":["Т үш үнүктөр:","* Конфликттин түрлөрү.","* Конфликттин белгилери.",". Конфликттин мүнөзү.","","Тапшырма:",". Консенсус.","* Толеранттуулук.","","* Конфликт жана ал кандайча келип чыгат?"]},{"t":"p","h":"* Толеранттуулук дегенди кандай түшүнөсүң? Турмуштук тажрыйбадан мисал келтир."},{"t":"p","h":". Эмне үчүн толеранттуу болушубуз керек?"},{"t":"p","h":"* Толеранттуулуктун конфликти чечүүдөгү ролу тууралуу ой жүгүртүп, айтып бер (эл арасында жана эл аралык мамиледе)."},{"t":"p","h":"Конфликттин мүнөзү."},{"t":"p","h":"Конфликт – деп кайсы бир маселе боюнча айрым адамдардын, топтордун, өлкөлөрдүн ортосунда пикир келишпестиктен, чыр-чатак талаш тартыш, мушташ согуш пайда болгон кырдаалды түшүнөбүз. Конфликт – бул карама-каршылыктардын курчуп кетиши жана аларды чечүү процессине катышкан эки же андан көп катышуучулардын кагылышуусу (латын сөзүнөн)."},{"t":"v","l":["Конфликттердин түрлөрү жана келип чыгышы.","* Инсандын ички конфликти"]},{"t":"p","h":"Мында адамдын жекече керектөөлөрү жана баалуулуктары коомдук талаптарга туура келбей калганда пайда болушу мүмкүн."},{"t":"p","h":"* Инсандардын ортосундагы конфликттер Бул эки инсандын ортосундагы кагылышуу түрүндө болот."},{"t":"p","h":"* Инсан менен топтун ортосундагы конфликт Мында конфликт инсан топтун позициясына туура келбеген позицияны ээлегенде пайда болот."},{"t":"p","h":"* Топтордун ортосундагы конфликт Буга мисал катары профсоюз менен ишкана администрациясынын ортосундагы конфликтти айтса болот."},{"t":"p","h":"* Мамлекеттер аралык конфликттер Ар бир кичинекей конфликт, кээде глобалдуу масштабдагы мамлекеттер аралык конфликттерге айланышы мүмкүн."},{"t":"h3","h":"<span class=\"pg\" data-n=\"128\">128<\/span>Конфликттердин айрым белгилери"},{"t":"p","h":"* Конфликт – бардык коомдордо күн сайын боло турган табигый процесс. Бул процесс ага катышкандарга оң дагы, терс дагы натыйжаларды алып келиши мүмкүн."},{"t":"p","h":"* Конфликт көбүнчө бийликти, идеяларды жана ресурстарды (каражат, байлык ж. б.) бөлүштүрүүдөгү пикир келишпестиктен келип чыгат. Ал балдардын мушташынан согушка чейинки түрдүү формаларга ээ болот."},{"t":"p","h":". Конфликт дароо эле канааттандыраарлык түрдө чечилбей калышы да мүмкүн. Бирок бул конфликтти чечүүнүн жолу жок дегенди билдирбейт."},{"t":"p","h":"* Конфликт дайым эле түшүнбөгөндүктөн келип чыкпайт. Тил табышуу көндүмүнүн жоктугунан да келип чыгат."},{"t":"p","h":"* Конфликт дайыма эле ачык боло бербейт, ал башкаларга билинбей жүрө берет."},{"t":"p","h":"* Куралчан конфликтти башынан өткөргөн коом, конфликттен качуу жолун тандайт. Бирок конфликттен кача берүү жамандыкка алып келиши мүмкүн. Себеби конфликтти ачык айтып жөнгө салбаса, проблемалар күчөп кетет да, кээ бирөөлөр мындай кырдаалдардан күч колдонуу жолу менен гана чыгууга болот деп ойлошот."},{"t":"p","h":"Конфликтти жөнгө салуу Конфликттин бар экендигин жана ага катышкандардын кызыкчылыктарын моюнга алуу, аны тынч жол менен чечүүгө жасалган маанилүү аракет болуп эсептелет."},{"t":"p","h":"Чоң, кичине дебей ар кандай конфликт оңой эле жөнгө салына койбойт. Анткени бул үчүн кимдир бирөө ушуга чейин пайдаланып келген артыкчылык абалынан баш тартуусу керек."},{"t":"p","h":"Биз күн сайын катышып жүргөн экономикалык конкуренция (атаандаштык) же демократиялык коомдогу шайлоо сыяктуу мелдештер конфликтти жөнгө салуу ыкмаларынан болуп саналат. Анткени жеңүүчүлөр жарыяланганда конфликттин азайышына шарт түзүлөт."},{"t":"p","h":"Конфликтти консенсуска (макулдашууга) жетишүү аркылуу жөнгө салууга да болот. Мында адамдар ага катышкан тараптардын баары макул болгудай чечим табылганча маселени талкуулай беришет. Кээде бөлөк бир калыс адам кырдаалды талдап көрүп анан өз чечимин таңууласа конфликт жакшы чечилет."},{"t":"p","h":"<span class=\"pg\" data-n=\"129\">129<\/span>Ортомчу жана анын милдети."},{"t":"p","h":"Конфликтти жөнгө салуу үчүн кээде ортомчунун кийлигишүүсү талап кылынат. Бирок конфликтти кайра чыкпагыдай кылып тынч жол менен чечүү үчүн, эки тарап тең кандай гана чечим кабыл алынбасын, адамдардын укуктары менен беделин сактап калууга тийиш."},{"t":"p","h":"Ортомчу бул чатакташкан тараптардын бардыгы тең ишенген, алардын эч бирине жан тартпай калыстык кылуучу киши."},{"t":"p","h":"Арачы адегенде араздашкандардын дооматтарын аргументтерин (жүйөлөрүн, ойлорун) угуп, алар эмнени көздөп жатканын, кайсы маселелер боюнча макул же макул эместигин аныктоого тийиш. Ортомчунун милдети каршылаштардын кимиси күнөлүү, кимиси ак экендигин айтуу эмес. Ортомчу эки тараптын ар бирине өзүнчө жана чогуу жолугуп конфликтти чечүүгө аракеттенет."},{"t":"h3","h":"Толеранттуулук"},{"t":"p","h":"Толеранттуулук (сабырдуулук) бул өзүңдүкүнө окшобогон башка бирөөнүн оюн, мүнөзүн, жүрүш-турушун сыйлоо жана аны кабыл алуу дегенди билдирет. Толеранттуулук бир же эки тараптан бири-бирин сыйлоо аркылуу маселен чечүүнү талап кылат."},{"t":"p","h":"Толеранттуулук – бул кээ бир конфликтти өз учурунда аныктап, анын алдын алуу жана аны чыр-чатаксыз чечүү. Окуучуларга конфликтти аныктап жана анын себептерин билдирүү, аны тынчтык жолу менен чечүү, толеранттуулукка жана конфликттен чыгууга үйрөтүүнүн негизги кадамы болуп эсептелет. Бирок толеранттуу болуу бул башка бирөөнү сыйлоо же урматтоо жана элпектик менен мамиле кылуу деп түшүнбөө керек."},{"t":"p","h":"Толеранттуу болуу – бул башка адамдардын жүрүм-турумуна же идеяларына карата конструктивдүү позицияда туруу (көз карашта болуу, мамиле жасоо, аракеттенүү). Бул бир кыйла кыйынчылыктарды пайда кылышы мүмкүн. Анткени башка адамдар менен өзүбүздүн идеяларды туура же туура эмес деп табууда, ар кандай карама-каршылыктар пайда болот. Бул толеранттуу, конструктивдүү мамиле, өзүбүздүкүнөн айырмаланган укуктар менен көз караштарды, үрп-адаттар менен жүрүм-турум формаларын сыйлоого алып келет."},{"t":"p","h":"<span class=\"pg\" data-n=\"130\">130<\/span>Толеранттуулукка мисалдар:"},{"t":"p","h":"а) Жакшы отургучту ээлөө үчүн эки окуучу аракет кылат. Ал үчүн экөө урушканга чейин барышат. Акыры башка балдардын бири жакшы отургучка кезектешип отургула деп сунуш кылат. Әки окуучу тең буга макул болот. Демек, экөө тең ынтымакка келип, сабырдуулукка барышты."},{"t":"p","h":"б) Әгерде үйгө келген конок даярдалган тамакты жегенден баш тартса, үй ээси коноктун айтканына макул болсо, ага толеранттуулукту көрсөтөт."},{"t":"p","h":"в) Сен туулган күндөн таңкы саат бте келдиң. Ата-энең буга тынчсызданып түнү менен уктабай чыгышканын айтышты жана мындан кийин мындай ишке барбоону суранышты. Сен дагы аларды туура түшүнүп кечирим сурасаң, эки тарап тең толеранттуулукту көргөзгөн болосуңар."},{"t":"p","h":"Кайталоо үчүн суроолор"},{"t":"v","l":["% 1. Конфликт жана анын түрлөрү.","2. Конфликт эмне үчүн, кантип пайда болот?","3. Конфликтти кантип жөнгө салса болот?","25 4. Толерантуулук женунде эмне билдин?","5. Толеранттуулук адамга эмне учун керек?"]},{"t":"p","h":"6. Ар кандай денгээлдеги конфликттерге мисал келтир жана аларды"},{"t":"p","h":"кантип женге салса болоор эле?"},{"t":"p","h":"7. Толеранттуулукка мисалдарды дагы улантып кер."},{"t":"h3","h":"<span class=\"pg\" data-n=\"131\">131<\/span>ТИРКЕМЕЛЕР"}],"sub":[{"title":"Конфликттердин айрым белгилери","b":13},{"title":"Толеранттуулук","b":28},{"title":"ТИРКЕМЕЛЕР","b":41}],"section":"ШГЛАВА","pages":[127,131]},{"title":"1-тиркеме","blocks":[{"t":"h3","h":"1-тиркеме"},{"t":"h3","h":"АДАМ УКУКТАРЫ БОЮНЧА ӘЛ АРАЛЫК ДОКУМЕНТТЕР"},{"t":"p","h":"БУУ түзүлгөндөн бери ал адам укуктары тармагында 100дөн ашуун эл аралык документтерди кабыл алган. Алардын негизгилери төмөндөгү таблицада келтирилген."},{"t":"p","h":"Әл аралык документтер"},{"t":"p","h":"Кабыл алын-"},{"t":"v","l":["Документ","ган датасы","","Адам укуктарынын","10-декабрь | жалпы декларациясы","","Качкындар статусу","28-июль","жөнүндөгү конвенция","","Бала укуктарынын","Түшүндүрмө","","КР кол койгон","","КР 1996-ж. 6-июлда","ратификациялаган","","КР кол койгон","20-ноябрь декларациясы","","Расалык дискриминациянын","21-декабрь |бардык формаларын жоюу","жөнүндө конвенция","","Жарандык жана саясый","16-декабрь","жөнүндө эл аралык","пакт","","Жарандык жана саясый","16-декабрь | укуктар жөнүндө эл аралык","пактыга карата","факультативдүү протокол","","Качкындар статусуна","16-декабрь тиешелүү протокол","26-июлда"]},{"t":"p","h":"ратификациялаган"},{"t":"p","h":"12-январда ратификациялаган"},{"t":"p","h":"12-январда ратификациялаган"},{"t":"p","h":"КР 1996-ж. 6-июлда ратификациялаган"},{"t":"v","l":["Аялдарды дискриминациялоо- | КР 1997-ж.","18-декабрь нун бардык формаларын","жоюу жөнүндө конвенция","10-февралда","ратификациялаган"]},{"t":"p","h":"<span class=\"pg\" data-n=\"132\">132<\/span>уландысы"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Кабыл алын-|<\/td><td>Документ<\/td><td>Түшүндүрмө<\/td><\/tr><tr><td>ган датасы<\/td><\/tr><tr><td>Кыйноо жана башка<\/td><\/tr><tr><td>10-декабрь<\/td><td>адамгерчиликсиз же кадыр-| 26-июлда<\/td><\/tr><tr><td>баркты кемсинтүүчү мамилелер-| ратификациялаган<\/td><\/tr><tr><td>дин жана жазалардын түрлө-<\/td><\/tr><tr><td>рүнө каршы конвенция<\/td><\/tr><tr><td>Бала укуктары жөнүндө<\/td><\/tr><tr><td>20-ноябрь<\/td><td>конвенция<\/td><td>12-июлда<\/td><\/tr><tr><td>ратификациялаган<\/td><\/tr><tr><td>| Жарандык жана саясый укук-| КР кол койгон<\/td><\/tr><tr><td>16-декабрь<\/td><td>тар жөнүндө эл аралык пакты-<\/td><\/tr><tr><td>га кошумча, өлүм жазасына<\/td><\/tr><tr><td>тыюу салууга багытталган экин-<\/td><\/tr><tr><td>чи факультативдүү протокол<\/td><\/tr><tr><td>КМШнын адам укуктары жана | КР кол койгон<\/td><\/tr><tr><td>негизги эркиндиктери жөнүндө<\/td><\/tr><tr><td>конвенциясы<\/td><\/tr><tr><td>КМШнын башчыларынын адам | КР кол койгон<\/td><\/tr><tr><td>укуктары жана негизги эркин-<\/td><\/tr><tr><td>диктери жаатында. Әл аралык<\/td><\/tr><tr><td>милдеттенмелери тууралуу дек-<\/td><\/tr><tr><td>ларациясы<\/td><\/tr><\/table><\/div>"},{"t":"h3","h":"АДАМ УКУКТАРЫНЫН ЖАЛПЫ ДЕКЛАРАЦИЯСЫ"},{"t":"v","l":["1-берене: Теңдик укугу.","2-берене: Дискриминациядан эркин болуу.","38-берене: Ар бир адам жашоого, эркиндикке жана жеке","кол тийбестикке укуктуу.","4-берене: Кулчулуктан эркин болуу."]},{"t":"p","h":"58-берене: Кыйноодон жана ар-намысты басмырлоочу мамиледен эркин болуу."},{"t":"p","h":"6-берене: Укук субъектиси катары таанылуу укугу."},{"t":"p","h":"<span class=\"pg\" data-n=\"133\">133<\/span>7-берене: Мыйзам алдындагы тендик укугу."},{"t":"p","h":"8-берене: Компотенттүү соттор аркылуу укуктарын натыйжалуу түрдө калыбына келтирүү укугу."},{"t":"p","h":"9-берене: Әч ким ээнбаштык менен камакка алынууга, кармалууга же куугунтукталууга тийиш эмес."},{"t":"p","h":"10-берене: Ачык жана адилет сотто териштирүү укугу. 11-берене: Мыйзамдуу тартипте белгиленгенге чейин күнөөсүз деп эсептелүү укугу."},{"t":"p","h":"12-берене: Әч ким анын жеке жана үй-бүлөлүк турмушуна ээнбаштык менен кийлигишүүгө, анын турак-жайына, жана кат-кабарларынын купуялыгына же анын абийирине жана беделине ээнбаштык менен кол салууга кабылууга тийиш эмес."},{"t":"p","h":"18-берене: Ар бир адам ар кандай өлкөдөн, анын ичинде өз өлкөсүнөн чыгып кетүүгө жана өз өлкөсүнө кайтып кетүүгө укуктуу."},{"t":"p","h":"14-берене: Ар бир адам куугунтуктоодон башка өлкөлөрдөн башбаанектен пайдаланууга укуктуу."},{"t":"p","h":"15-берене: Жарандуулукка ээ болуу жана аны өзгөртүү укугу."},{"t":"v","l":["16-берене: Никеге туруу жана үй-бүлө күтүү укугу.","17-берене: Мүлккө ээлик кылуу укугу."]},{"t":"p","h":"18-берене: Ой-жүгүртүү, адеп-ахлак жана маалымат алуу укугу."},{"t":"p","h":"19-берене: Әркин ой-пикирде болуу жана маалымат алуу укугу."},{"t":"p","h":"20-берене: Тынч жыйындырга жана ассоциацияларга катышуу укугу."},{"t":"p","h":"21-берене: Өз өлкөсүн башкарууга жана эркин шайлоого катышуу укугу."},{"t":"p","h":"22-берене: Социалдык камсыздануу укугу."},{"t":"p","h":"28-берене: Әмгектенүү, ишти эркин тандап алуу, кесиптик биримдиктерге кирүү укугу."},{"t":"p","h":"24-берене: Бош убакытка жана эс алууга укуктуулук. 25-берене: Татыктуу турмуш деңгээлине укуктуулук."},{"t":"p","h":"26-берене: Билим алуу укугу."},{"t":"p","h":"27-берене: Коомдун маданий турмушуна катышуу укугу. 28-берене: Ар бир адам ушул декларацияда баяндалган укуктары менен эркиндиктери толук ишке ашырыла турган социалдык жана эл аралык тартипке укуктуу."},{"t":"p","h":"<span class=\"pg\" data-n=\"134\">134<\/span>29-берене: Адам инсаны коомдо гана эркин жана толук өсүп-өнүгүшү мүмкүн, андыктан ар бир адамдын коом алдына милдеттери бар."},{"t":"p","h":"30-берене: Жогоруда баяндалган укуктар менен эркиндиктерди жүзөгө ашырууда мамлекеттин же айрым адамдардын кийлигишүүсүнөн эркин болуу."},{"t":"h3","h":"БАЛДАРДЫН УКУКТАРЫ ЖӨНҮНДӨ КОНВЕНЦИЯ"},{"t":"p","h":"1-берене: Әгерде сен 18 жашка чыга элек болсоң, анда сен өспүрүм болуп эсептелесиң."},{"t":"p","h":"2-берене: Сен дискриминациядан сактанууга укугуң бар. Бардык балдар бирдей укукка ээ."},{"t":"p","h":"38-берене: Сен чоң кишилер тарабынан корголууга жана алардын камкордугун көрүүгө укуктуусуң."},{"t":"p","h":"4-берене: Сенин укуктарың сакталышы керек."},{"t":"p","h":"5-берене: Өзүңдүн зээндуулугунду өстүрүүгө укуктуусуң. 6-берене: Сен жашоого жана ден-соолукта өнүгүүгө укугуң бар."},{"t":"p","h":"7-берене: Сен ысым алууга жана граждандуулука укугуң бар."},{"t":"p","h":"8-берене: Сен өзүңдүн индивидуалдуулугуңду сактоого укугуң бар."},{"t":"p","h":"9-берене: Әгерде ата-энең ажырашып кеткен болсо, сен алардын кимиси менен жашагың келээри эске алынышы керек. Сен экөө менен тең катташууга укуктуусуң."},{"t":"p","h":"10-берене: Ата-энең кайсы гана өлкөдө болбосун, сен алар менен жашоого укуктуусуң."},{"t":"p","h":"11-берене: Сени алып качууга эч кимдин укугу жок."},{"t":"p","h":"12-берене: Сен ой-пикириңдин эркин болушуна укуктуусуң."},{"t":"p","h":"183-берене: Сен маалымат алууга жана аны берүүгө укуктуусуң."},{"t":"p","h":"14-берене: Сен ойлоруңдун жана диниңдин эркин болушуна укуктуусуң."},{"t":"p","h":"15-берене: Сен тынч чогулуштурдын эркиндигине укуктуусуң."},{"t":"p","h":"16-берене: Сен жекече өз алдынча жашоого укуктуусуң. 17-берене: Сен маалыматтарга кирүүгө укуктуусуң, чоң кишилер аны силер түшүнгөндөй кылып бериши керек."},{"t":"p","h":"<span class=\"pg\" data-n=\"135\">135<\/span>18-берене: Ата-энең сенин тарбия алышыңа жана өсүшүңө жооптуу."},{"t":"p","h":"19-берене: Сен зордуктоодон жана жаман мамиле кылуудан коргонууга укугуң бар."},{"t":"p","h":"20-берене: Әгерде сенин ата-энең жок болсо, анда сен мамлекет тарабынан өзгөчө корголууга укуктуусуң."},{"t":"p","h":"21-берене: Сен уул болуп асырап алынууга укуктуусуң. 22-берене: Качып келген (беженец) балдар үчүн укуктар."},{"t":"p","h":"23-берене: Инвалид балдар үчүн укуктар. Алар өзгөчө жардамга жана корголууга укуктуу."},{"t":"p","h":"24-берене: Сен эң жакшы медициналык кароого укуктуусуң."},{"t":"p","h":"25-берене: Сен багууну жана тарбиялоону карап чыгууга жана аны баалоого укуктуусуң."},{"t":"p","h":"26-берене: Сен социалдык жактан камсыз болууга укуктуусуң."},{"t":"p","h":"27-берене: Сен татыктуу жашоого укугуң бар."},{"t":"p","h":"28-берене: Сен билим алууга укуктуусуң. Башталгыч билимдериң бекер болушу керек."},{"t":"p","h":"29-берене: Билим алуу сенин зээндуулугундун өсүшүнө, талантыңдын өркүндөшүнө, укуктарды, ата-энеңди сыйлоого, бизди курчап турган жаратылышты коргоону үйрөтүүгө жардам бериши керек."},{"t":"p","h":"30-берене: Азчылык балдар үчүн укуктар. Кандай гана өлкө болбосун, сен өзүңдүн маданиятыңды, дининди тутуп, Өз эне тилиңди колдонууга укуктуусуң."},{"t":"p","h":"81-берене: Сен эс алууга, ойноого жана чыгармачыл иштер менен иштөөгө укуктуусуң."},{"t":"p","h":"382-берене: Сен эксплуатациядан коргонууга укуктуусуң. Өзүңдүн ден соолугуңа зыян келтирип, окууңа тоскоол болгон жумуштарды аткарбашың керек."},{"t":"p","h":"88-берене: Сен баңги заттардан коргонууга укуктуусуң. 84-берене: Сен сексуалдык кыйноолордон коргонууга укуктуусуң."},{"t":"p","h":"385-берене: Чоң кишилер балдарды уурдап кетүүлөрдөн жана алар менен соода ишин жүргүзүүдөн сакташы керек. 36-берене: Сен эксплуатациянын бардык түрлөрүнөн корголууга укуктуусуң."},{"t":"p","h":"<span class=\"pg\" data-n=\"136\">136<\/span>37-берене: Сен кыйноолордон жана мыйзамсыз түрдөн камалуудан коргонууга, ошондой эле өзүңдүн укуктарың жөнүндө маалымат алууга укугуң бар."},{"t":"p","h":"38-берене: Согуш чыкса же куралдуу конфликттер болсо, анда сен алардан корголууга укуктуусуң."},{"t":"p","h":"39-берене: Әгерде сен кыйноолордун, жаман мамиле жасоонун, согуштун, кемсинткендиктин зордук-зомбулугуна учурап калсаң, реабилитация жолу менен кайра кадимки жашоого кайтуу жардамын көрүүгө укуктуусуң."},{"t":"p","h":"40-берене: Балдар жана укук коргоо органдары. Әч ким сени адилетсиздик түрдө мыйзамды бузду деп жалаа жаппашы керек. Сенин күнөөң мыйзам тарабынан далилденмейинче, күнөөсүз болуп эсептелинесиң. Әмне себептен сени күнөөлөп жатканын билүүгө жана укуктук жардам алып коргонууга укуктуусуң. Әч ким сени күбө катары түшүндүрмө берүүгө мажбурлабашы керек. Әгер сен мыйзамды бузган болсоң, анда сени оңдоого жардам бериши керек."},{"t":"p","h":"41-берене: Сен эң жакшы коргонууга укуктуусуң."},{"t":"p","h":"42-берене: Сен өзүңдүн укуктарынды билүүгө укугуң бар. Чоң кишилер да аларды билиши керек."},{"t":"p","h":"43-54-беренелер: Мамлекет менен чоңдор сенин укугундун сакталуусун кантип камсыз кылышат? Мамлекет өзүнүн өлкөсүндө балдар укугу кандайча сакталып жаткандыгын ООНдун ичинде атайы түзүлгөн комитетке доклад беришет."},{"t":"p","h":"Өзүңдүн укугуңду сактоону үйрөн, бирок башкалардыкы да бар экендигин унутпа!"}],"sub":[{"title":"АДАМ УКУКТАРЫНЫН ЖАЛПЫ ДЕКЛАРАЦИЯСЫ","b":13},{"title":"БАЛДАРДЫН УКУКТАРЫ ЖӨНҮНДӨ КОНВЕНЦИЯ","b":37}],"section":"ШГЛАВА","pages":[132,136]},{"title":"2-тиркеме","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"137\">137<\/span>2-тиркеме"},{"t":"h3","h":"ДҮЙНӨДӨГҮ АЙРЫМ ӨЛКӨЛӨРДҮН КОНСТИТУЦИЯСЫ Америка Кошмо Штаттарынын Конституциясы"},{"t":"p","h":"(Кыскартып алынды) Биз, Кошмо Штаттардын эли, кыйла өркүндөтүлгөн Союз түзүү, сот адилеттүүлүгүн орнотуу, ички тынчтыкты камсыздоо, биргелешкен коргонууну уюштуруу, жалпы жыргалчылыкта көмөктөшүү жана бизге, биздин урпактарыбызга эркиндикти камсыздоо максатында Америка Кошмо Штаттары үчүн ушул Конституцияны негиздеп, кабыл алабыз."},{"t":"p","h":"1 берене 1-бөлүм. Мыйзам чыгаруу бийлигинин бул жерде бекитилген ыйгарымдары Кошмо Штаттардын Сенаттан жана өкүлдөр палатасынан турган Конгрессине таандык."},{"t":"p","h":"2-бөлүм. Өкүлдөр палатасы ар бир штаттан эл эки жылда бир жолу шайлап туруучу мүчөлөрдөн турат; мында ар бир штаттын шайлоочулары штаттын Мыйзам чыгаруу жыйынын эң көп сандуу палатасынын шайлоочулары учун бекитилген талаптарга жооп бериши керек."},{"t":"p","h":"Жыйырма беш жашка толо элек болсо же 7 жыл бою Кошмо Штаттардын жараны болбосо жана өзү көрсөтүлүп жаткан учурда ошол штаттын тургуну болбосо, адам өкүл болуп шайлана албайт."},{"t":"p","h":"8-бөлүм. Кошмо Штаттардын Сенатынын курамына ар бир штаттан экиден сенатор келет, алар тийиштүү штаттардын мыйзам чыгаруу жыйындары тарабынан 6 жылга шайланат. Ар бир сенатор бирден добушка ээ."},{"t":"p","h":"80 жашка толо элек, 9 жыл бою Кошмо Штаттардын жараны болбогон жана шайлоо учурунда өзү көрсөтүлүп жаткан штаттын тургуну болбогон адам сенатор боло албайт."},{"t":"p","h":"П берене 1-бөлүм. Аткаруу бийлиги Америка Кошмо Штаттарынын Президентине таандык. Ал өз кызматын төрт жылдык мөөнөткө ээлейт. Кошмо Штаттарда анык туулган жаран менен ушу Конституция кабыл алынган учурдагы жарандан башка бир дагы адам Президенттикке шайлана албайт; ошондой <span class=\"pg\" data-n=\"138\">138<\/span>эле бул кызматка 85 жашка чыга элек жана Кошмо Штаттарда он төрт жыл жашабаган адам да шайлана албайт."},{"t":"p","h":"2-бөлүм. Президент Кошмо Штаттардын армиясынын жана флотунун башкы командачысы болуп саналат."},{"t":"p","h":"8-бөлүм. Президент Конгресске маал-маалы менен Союздагы абал тууралуу маалымат берип, анын кароосуна өзү зарыл жана максатка ылайыктуу деп эсептеген чаралардын сунуштайт. Ал өзгөчө кырдаалдарда 2 палатаны тең же алардын ичинен өзү каалаганын чогулта алат."},{"t":"p","h":"Ш берене 1-бөлүм. Кошмо Штаттардын сот бийлиги жалгыз Жогорку Сотко жана Конгресс мезгил-мезгили менен түзүүчү төмөнкү сотторго таандык. Жогорку, ошондой эле төмөнкү соттордун судьялары өздөрүн таза алып жүргөндө гана кызматтарында турушат жана бекитилген мөөнөт ичинде көрсөткөн кызматы үчүн азайтылбай турган эмгек акы алышат."},{"t":"p","h":"1781-жыл, 17-сентябрь."},{"t":"h3","h":"Пакистан Ислам Республикасынын Конституциясы 2-март, 1956-жыл"},{"t":"p","h":"Преамбула Боорукер мээримдүү Алла таала үчүн, Ааламдын жогорку бийлиги бир гана эч тендеши жок Алла таалага таандык болгондуктан жана Пакистан эли жүргүзүүчү бийлик да Алланын ишенип берген ыйык салымы болгондуктан, Пакистандын негиздөөчү Каид-и-Азам Али Дисин-на Исламда көрсөтүлгөн принциптердин бири болгон социалдык акыйкат үстөмдүгү жолго салынып, Пакистан Республикасы демократиялык мамлекет болот деп жарыялагандыктан;"},{"t":"p","h":"Пакистан элинин өкүлдөрүнөн турган Уюштуруу жыйыны эгемендүү жана көз каранды эмес Пакистан мамлекетинин Конституциясын иштеп чыгууну чечкендиктен;"},{"t":"p","h":"Жогоруда айтылгандын негизинде мамлекет өз ыйгарымдарын жана бийлигин эл өкүлдөрү аркылуу аткарат."},{"t":"p","h":"Исламда жарыяланган эркиндик, теңдик, сабырдуулук, социалдык акыйкатчылык, демек, демократиянын принциптери толугу менен жүзөгө ашырылат."},{"t":"p","h":"<span class=\"pg\" data-n=\"139\">139<\/span>Суннада жана Ыйык Куранда көрсөтүлгөндөй, Пакистандын мусулмандары ар бири жеке жана чогуу өз турмушун ислам окуусунун жана талаптарынын негизинде кура алат."},{"t":"p","h":"Азчылыкты түзгөндөрдүн өз динине ишенүү менен бирдикте өзүнүн маданиятын өнүктүрүү укуктары гарантияланат."},{"t":"p","h":"Азыр Пакистанга кирген жана кошулуп жаткан, ошондой эле кийин кошулушу мүмкүн болгон территориялар Пакистан Федерациясын түзөт жана ал Провинциялар ыйгарымдары менен бийлиги көрсөтүлүшү ыктымал болгондой чектелген автономдуу абалда болот да, негизги укуктары гарантияланат."},{"t":"p","h":"Юридикалык статус жана мүмкүнчүлүктөрдүн теңдиги, мыйзам алдындагы теңдик, эркин ой жүгүртүү, дин тутуу, сыйынуу, бирикмелерге биригүү сыяктуу негизги укуктар, ошондой эле экономикалык, социалдык жана саясый адилеттүүлүк коомдук моралдын жана мыйзамдын чегинде гарантияланат."},{"t":"p","h":"Азчылыкты түзгөндөрдүн, артта калган жана эзилген таптардын мыйзамдуу кызыкчылыктары гарантияланат."},{"t":"p","h":"Сот органдарынын өз алдынчалыгы толугу менен гарантияланат."},{"t":"p","h":"Федерациянын территориясынын бүтүндүгү анын көз каранды эместиги, жерге, абага, деңизге карата эгемендиги менен бардык укуктары гарантияланат."},{"t":"p","h":"Пакистандын эли гүлдөп өнүгүп, дүйнөдөгү улуттардын арасында кадырлуу орунду ээлеп, эл аралык тынчтыкка дүйнөдөгү адамзаттын өнүгүшүнө жана бактылуу болушуна өз салымын толугу менен кошо алышы үчүн биз, Пакистан эли, Уюштуруу жыйыныбызды 1875-жылдагы Раджабдын 17- күнүнө туура келүүчү 1966-жылдын 29-февралындагы төмөндөгү Конституцияны түзөбүз жана кабыл алабыз."},{"t":"p","h":"1 бөлүк. Республика жана анын территориясы 1. Республика жана анын территориясы. Мындан ары Пакистан деп аталуучу Пакистан Ислам Республикасы деген ат менен федеративдүү республика катары түзүлөт."},{"t":"p","h":"П бөлүк. Негизги укуктар 2. Негизги укуктарга туура келбеген же аларды чектеген мыйзамдар жараксыз деп эсептелет."},{"t":"p","h":"<span class=\"pg\" data-n=\"140\">140<\/span>5. Мыйзам алдында тең укуктуулук 1. Бардык жарандар мыйзам алдында тен укуктуу жана мыйзам тарабынан бирдей корголуу укугуна ээ."},{"t":"p","h":"2. Бир дагы адам эркинен жана жашоосунан мыйзамсыз негизде ажыратылбоого тийиш."},{"t":"p","h":"8. Сөз эркиндиги. Ар бир жаран Пакистандын коопсуздугун, чет өлкөлүк мамлекеттер менен достук мамилесин сактоо, коомдук тартипти, адептүүлүктү же моралды кармануу, ошондой эле сотту сыйлоо, жалаа жабууга же кылмышка тукурууга жол койбоо үчүн зарыл болгон чектөөлөрдү сактоо менен эркин сүйлөөгө, өз оюн эркин билдирүүгө укуктуу."},{"t":"p","h":"9. Чогулуш эркиндиги. Бардык жарандар адеп-ахлакты жана коомдук тартипти бузбоо үчүн мыйзам тарабынан белгиленген акыл-эстүү чектөөлөрдү сактап, куралсыз чогулууга укуктуу."},{"t":"p","h":"10. Бирикмелердин эркиндиги. Ар бир жаран адеп-ахлакты жана коомдук тартипти бузбоо үчүн мыйзам тарабынан белгиленген акыл-эстүү чектөөлөрдү сактап бирикмелерди же союздарды түзүүгө укуктуу."},{"t":"p","h":"11. Бир жерден экинчи жерге которулуу эркиндиги жана мүлккө ээ болуу, аны каалагандай пайдалануу укугу. Белгилүү чектөөлөрдү сактоо, көпчүлүктүн кызыкчылыгын эске алуу менен ар бир жаран төмөнкү укуктарга ээ:"},{"t":"p","h":"а) Пакистандын территориясынын чегинде бир жерден экинчи жерге эркин которулуу жана анын территориясынын каалаган бөлүгүндө жашоо;"},{"t":"p","h":"б) Мүлк сатып алуу, аны ээлеп, өзү каалагандай пайдалануу."},{"t":"p","h":"14. Коомдук жайларга баргандарды дискриминациялоого тыюу салуу."},{"t":"p","h":"1. Көңүл ачуучу жана эс алуучу коомдук жайларга, эгерде алар жалаң гана диний максаттар үчүн арналган жай болбосо, барган адамдарды расасына, динине, жынысына, туулган жерине жараша дискриминациялоого жол берилбейт."},{"t":"p","h":"2. Ушул берене аялдарга тиешелүү болгон өзгөчө токтомдорду кабыл алууга тоскоолдук кылбайт."},{"t":"p","h":"18. Динге ишенүү эркиндиги жана диний мекемелерди башкаруу эркиндиги. Мыйзамдуу, коомдук тартипти жана моралдык принциптерин сактаган шартта:"},{"t":"p","h":"а) ар бир жаран каалаган динине ишенүүгө, диний ырымдарды аткарууга жана диний үгүттөрдү жүргүзүүгө укуктуу;"},{"t":"p","h":"<span class=\"pg\" data-n=\"141\">141<\/span>б)ар бир диний община жана анын ар бир сектасы өздөрүнүн диний мекемелерин түзө алат."},{"t":"p","h":"20. Кол тийбестикти алып таштоо."},{"t":"p","h":"«Кол тийбестик» жоюлат. Аны ар кандай формада практикалоого тыюу салынат жана мыйзам тарабынан укук бузуу деп эсептелет"},{"t":"v","l":["Ш бөлүк. Мамлекеттин саясатынын жетектөөчү","принциптери"]},{"t":"p","h":"24. Мусулман өлкөлөрүнүн биримдигине жана эл аралык тынчтыкка көмөктөшүү. Мамлекет мусулман өлкөлөрдү бириктирип турган алакаларды бекемдөөгө, эл аралык тынчтык менен коопсуздукка салым кошууга, адил эркти колдоого, бардык мамлекеттер ортосундагы достук мамилелерди чыңдоого жана эл аралык талаш-тартыштардын тынч жол менен чечилишине көмөктөшүүгө умтулат."},{"t":"p","h":"25. Ислам принциптерин колдоо."},{"t":"p","h":"1. Пакистандын мусулмандарынын ар бирине жана баарына өз турмуштарын Ыйык Куранга жана Суннага ылайык курушуна мүмкүндүк берүү үчүн бардык иш-чаралар көрүлүшү керек."},{"t":"p","h":"2. Пакистандын мусулмандарына карата мамлекет:"},{"t":"p","h":"а) алар өздөрүнүн жашоосунун маңызын Ыйык Куранга жана Суннага ылайык таанып билишине өбөлгө түзүүчү каражаттарды камсыздоого;"},{"t":"p","h":"б) Ыйык Куранды окуп-үйрөнүүнү милдеттүү кылууга;"},{"t":"p","h":"в) исламдын моралдык принциптеринин биримдигине жана сакталышына көмөктөшүүгө умтулушу керек."},{"t":"p","h":"80. Сот жана аткаруу бийликтеринин бөлүнүшү."},{"t":"p","h":"Мамлекет мүмкүн болушунча сот жана аткаруу бийликтерин бири-биринен бөлөт."},{"t":"v","l":["УГ бөлүк. Федерация","","32. Президент."]},{"t":"p","h":"Мусулман болбогон бир дагы адам президенттик кызматка шайлана албайт; кырк жашка жетпеген болсо дагы шайланбайт."},{"t":"p","h":"43. Пакистандын парламенти."},{"t":"p","h":"Президенттен жана Улуттук жыйын деп аталган бир палатадан туруучу Пакистандын парламенти негизделет."},{"t":"p","h":"<span class=\"pg\" data-n=\"142\">142<\/span>44. Улуттук жыйындын курамы."},{"t":"p","h":"1. ... он орун жалаң гана Жыйынга мүчө аялдар үчүн ажыратылат. Булардан бешөөнө Чыгыш Пакистандын шайлоо округдарынан, дагы бешөөнө Батыш Пакистандын шайлоо округдарынан шайланышат. Бул максатта аялдар үчүн атайын тийиштүү шайлоо округдары түзүлүшү керек."},{"t":"p","h":"ЇХ бөлүк. Жогорку сот 149. Жогорку соттун дайындалышы."},{"t":"p","h":"Пакистандын башкы судьясын президент дайындайт, калган судьяларды президент башкы судья менен макулдашып дайындайт."}],"sub":[{"title":"Пакистан Ислам Республикасынын Конституциясы 2-март, 1956-жыл","b":13}],"section":"ШГЛАВА","pages":[137,142]},{"title":"Француз Республикасынын Конституциясы","blocks":[{"t":"h3","h":"Француз Республикасынын Конституциясы"},{"t":"p","h":"Преамбула Француз эли 1789-ж. Декларацияда белгиленген жана 1946-ж. Конституциянын преамбуласында толукталган жана бекемделген улуттук суверенитеттин принциптерин жана адам укуктарын сактай тургандыгын салтанаттуу түрдө жарыялайт."},{"t":"p","h":"Ушул принциптерин жана өз тагдырын өзү аныктоо эркиндиги принциптеринин негизинде деңиздин ары жагындагы территорияларга эркиндиктин, теңдиктин жана бир туугандыктын идеалдарына негизделген жана алардын демократиялык өнүгүшүнө кызмат кылган жаңы институттарды сунуш кылат."},{"t":"p","h":"1-берене Республика жана ушул Конституцияны өз эрки менен кабыл алган деңиздин ары жагындагы территориялардын элдери коомчулукту уюштурат. Бул коомчулук анын курамына кирген элдердин теңдигине жана тилектештигине негизделген."},{"t":"v","l":["Т бөлүм. Көз карандысыздык жөнүндө","2-берене"]},{"t":"p","h":"Франция бөлүнгүс, дүйнөчүл, демократиялык жана социалдык мамлекет. Ал бардык жарандардын туткан динине, <span class=\"pg\" data-n=\"143\">143<\/span>расасына карабастан мыйзам алдындагы тең укуктуулугун гарантиялайт. Бардык диний ишенимдерди сыйлайт. Республиканын тили француз тили болуп эсептелинет. Улуттук эмблема – үч (көк, ак, кызыл) түстөгү желек. Улуттук гимн – «Марсельеза»."},{"t":"p","h":"Республиканын девизи – Әркиндик, Теңдик, Бир туугандык."},{"t":"p","h":"Анын принциби – элдик башкаруу, элдин эрки менен, эл үчүн."},{"t":"v","l":["П бөлүм. Республиканын Президенти","5-берене"]},{"t":"p","h":"Республиканын Президенти Конституциянын сакталышына кез салат. Ал езунун арбитражы менен элдик бийликтин нормалдуу иштеесун, ошондой эле мамлекеттеги уланмалуулукту камсыздайт."},{"t":"p","h":"Ал улуттук көз карандысыздыктын, территориялык бүтүндүктүн, эл аралык келишимдердин жана чечимдердин коомчулук тарабынан сакталышынын гаранты."},{"t":"p","h":"6-берене Жалпы элдик тике шайлоо аркылуу Президент 7 жылга шайланат."},{"t":"v","l":["ГУ бөлүм. Парламент","24-берене"]},{"t":"p","h":"Парламент Улуттук жыйындан жана Сенаттан турат. Улуттук жыйындын депутаттары түз добуш берүү жолу менен шайланат. Сенат кыйыр добуш берүү жолу менен шайланат. Ал Республиканын аймактык бирдиктеринин өкүлчүлүгүн камсыздайт. Сенатта Франциядан тышкары жашаган француздардын да өкүлдөрү болот."},{"t":"p","h":"26-берене Парламенттин дагы бир мүчөсү өзүнүн функциясын аткарып жаткан учурда айткан пикири же берген добушу үчүн куугунтуктоого, тинтүүгө, кармалууга, камакка алынууга же соттолууга кабылууга тийиш эмес."},{"t":"p","h":"У бөлүм. Парламент менен өкмөттүн мамилеси жөнүндө"},{"t":"p","h":"Мыйзамдарды парламент кабыл алат."},{"t":"p","h":"<span class=\"pg\" data-n=\"144\">144<\/span>Мыйзам чыгаруу демилгеси премьер-министрге жана парламент мүчөлөрүнө таандык."},{"t":"p","h":"64-берене Республиканын президенти сот бийлигинин көз карандысыздыгынын гаранты болуп саналат. Соттор алмаштырылбайт."},{"t":"h3","h":"Германия Федеративдүү Республикасынын негизги мыйзамы"},{"t":"p","h":"(Кыскартылган.) Преамбула Әлдин жана кудайдын алдындагы жоопкерчиликти сезип, дүйнө элине жана бирдиктүү Европа союзунун тең укуктуулугунун негизинде кызмат кылууга шыктанып, Германия эли негизги мыйзамды кабыл алат."},{"t":"p","h":"Ушул немистер Баден-Вюртенберг, Бавария, Берлин, Брандербург, Бреман, Гамбург, Гессен, Мекленбург-Алдынкы Помперан, Кичи Саксония, Түндүк Рейн-Вестфалия, Рейн- Пфальц, Саар, Саксония, Саксония-Ангальт, Шлезвиг-Гольштейн жана Тюринг жеринде Германиянын биримдигин жана эрикндигин аныктай алууга жетишти. Бул Негизги мыйзам бүт Германия элине жайылтылат."},{"t":"v","l":["1. Негизги укуктар.","1-берене"]},{"t":"p","h":"1. Адамдын кадыр-баркы кол тийгис. Аны ар бир мамлекет бийлигиндегилер сакташы жана сыйлашы керек."},{"t":"p","h":"2. Немис эли укугу жана кол тийбестик дүйнө жүзүндөгү ар кандай адамзат коомчулугу жана адилеттүүлүктүн негизи деп эсептейт."},{"t":"p","h":"8. Төмөндөгү негизги укуктар түздөн түз колдонулуучу укуктар катары мыйзам чыгаруу, аткаруу сот бийликтери үчүн милдеттүү болуп эсептелет."},{"t":"p","h":"2-берене 1. Ар бир адам эгер ал башкалардын укуктарын, конституциялык тартипти жана адеп-ахлах мыйзамын бузбаса, өз инсанын эркин өнүктүрүүгө укуктуу."},{"t":"p","h":"<span class=\"pg\" data-n=\"145\">145<\/span>2. Адам жашоого жана кол тийбестикке укуктуу. Инсан эркиндиги бузулгус. Бул укуктарга кийлигишүү мыйзам чегинде гана болушу керек."},{"t":"p","h":"1. Бардык адамдар мыйзам алдында тең укуктуу."},{"t":"p","h":"2. Әркек жана аял тең укуктуу."},{"t":"p","h":"4-берене 1. Дин тутуу, абийир эркиндиги жана диний ишеним, дүйнө караш эркиндиги бузулгус."},{"t":"p","h":"2. Әч ким өзү каалабаса аскердик кызматка курал алып катышууга мажбурланбашы керек."},{"t":"p","h":"7-берене 1. Бардык мектеп иштери мамлекеттин көзөмөлүндө турат."},{"t":"p","h":"2. Тарбия берүүгө ыйгарымы бар адамдар баланын диний тарбия алышы керек же керек эместигин чечүүгө укуктуу."},{"t":"p","h":"8. Конфессионалдуу эместеринен тышкары мамлекеттик мектептерде динди окутуу милдеттүү түрдө жүргүзүлөт. Бир дагы мугалим өзү каалабаса динди окутууга милдеттендирилбейт."},{"t":"p","h":"12-берене 1. 18ге толгон эркектер Куралдуу күчтөрдүн катарына, федералдык чегара коргонуусуна жана жарандык коргонуу бөлүктөрүнө кызматка чыгарылышы мүмкүн."},{"t":"p","h":"2. Диний ишенимине байланыштуу курал алып аскердик кызмат өтүүдөн баш тарткан адамдар анын ордуна башкача кызмат өтөөгө милдеттүү."},{"t":"p","h":"14-берене Менчик пайдалануу бир эле учурда коомдук жыргалчылык үчүн да кызмат кылууга тийиш."},{"t":"p","h":"16-берене 1. Әч ким Германиянын жарандыгынан ажыратылууга тийиш эмес. Жарандыкты жоюу жалаң гана мыйзамдык негизде, ал эми кызыкдар адам өзү каалабаса ал жарандыгы жок адам болуп калбаган учурда гана жүзөгө ашырылышы мүмкүн."},{"t":"p","h":"<span class=\"pg\" data-n=\"146\">146<\/span>2.Бир дагы немис чет өлкөлүк мамлекетке кармап берилбөөгө тийиш. Саясий ишенимдери үчүн куугунттукка алынгандар баш калка алуу укугунан пайдаланышат."},{"t":"p","h":"18-берене Ким өзүнүн эркин пикир айтуу укугун, мунун ичинде басма сөз эркиндигин (5-статьянын биринчи абзацы), сабак берүү эркиндигин (5-статьянын 8-абзацы), чогулуш эркиндигин (8-статья), биригүү эркиндиги (9-статья), кат жазышуу, почта, телеграф жана электр байланышын жашыруундугун (10-статья), менчик укугун (14-статья) же баш калка алуу укугун (16-статьянын 2-абзацы) эркин демократиялык түзүлүштүн негиздерине каршы күрөшүү үчүн пайдаланса, анын бул негизги укуктары жокко чыгарылат. Көрсөтүлгөн укуктардын жокко чыгарылыш фактысы Федералдык конституциялык соттун чечимине ылайык аныкталат."},{"t":"h3","h":"П. Федерация жана жерлер"},{"t":"p","h":"20-берене 1. Германия Федеративдүү Республикасы – демократиялык жана социалдык федеративдүү мамлекет."},{"t":"p","h":"2. Бардык мамлекеттик бийлик элден чыгат. Ал бийлик эл тарабынан шайлоо жана добуш берүү аркылуу жана мыйзам чыгаруу, аткаруу бийлиги жана сот адилеттүүлүгүнүн атайын органдары аркылуу ишке ашырылат."},{"t":"p","h":"22-берене 1. Федерациянын желеги кара-кызыл-алтын түстүү."},{"t":"h3","h":"Ш. Бундестаг"},{"t":"p","h":"88-берене 1. ГФРнын Бундестагынын депутаты бүткүл жалпы тике, тең укуктуу жана жашыруун добуш менен шайланат. Алар бүткүл элдин өкүлү болуп эсептелет, эч кандай наказдар жана көрсөтмөлөр менен байланышпайт, өзүнүн ар-намысына гана баш иет."},{"t":"p","h":"2. 18 жашка толгондордун бардыгы шайлоого укуктуу, ал эми шайланууга жарандык жетилген жашында гана укуктуу."},{"t":"v","l":["389-берене","Бундестаг 4 жылдык мөөнөткө шайланат."]},{"t":"p","h":"<span class=\"pg\" data-n=\"147\">147<\/span>\\. Федералдык Президент"},{"t":"p","h":"1. Федералдык Президент федералдык жыйында жарыш сөздөрдү өткөрбөй эле шайланат. Бундестагга шайлоого катышуу укугу бар жана жашы кыркка жеткен ар бир немис президент болуп шайлана алат."},{"t":"p","h":"2. Федералдык Президенттин ыйгарымдары 5 жылга созулат. Түздөн-түз кайра шайлоого бир гана ирет жол коюлат."},{"t":"v","l":["УГ. Федералдык өкмөт","62-берене"]},{"t":"p","h":"Федералдык өкмөт федералдык Канцлерден жана федералдык министрлерден турат."},{"t":"p","h":"686-берене Федералдык Канцлер саясаттын негизги багыттарын аныктап, бул үчүн жоопкерчиликти өзүнө алат. Ушул негизги багыттардын чегинде ар бир федералдык министр өзүнүн тармагындагы иштерди өзүнүн жекече жоопкерчилиги менен жүргүзөт. Федералдык министрлердин пикирлери карама-каршы болуп калган учурларда талашты Федералдык өкмөт чечет. Федералдык Канцлер өкмөттүн иштерине Федералдык өкмөт кабыл алган жана Федералдык Президент жактырган регламентке ылайык жүргүзөт."},{"t":"h3","h":"Кыргыз Республикасынын Конституциясы"},{"t":"p","h":"(Үзүндү)"},{"t":"h3","h":"П бөлүм"},{"t":"v","l":["Адамдын жана жарандын укуктары","менен эркиндиктери","Г глава. Негизги укуктар жана эркиндиктер"]},{"t":"p","h":"1. Адам укуктары жана эркиндиктери ажырагыс, ал ар бир адамга төрөлгөндөн эле таандык. Адам укуктары менен эркиндиктери эң жогорку баалуулук болуп эсептелет."},{"t":"p","h":"8. Кыргыз Республикасында мыйзам жана сот алдында бардыгы бирдей."},{"t":"p","h":"<span class=\"pg\" data-n=\"148\">148<\/span>4. Кыргыз Республикасында эркектер менен аялдар бирдей укуктарга жана эркиндиктерге, аларды ишке ашыруу үчүн бирдей мүмкүнчүлүктөргө ээ."},{"t":"p","h":"18-берене Ар бир адам ушул Конституцияда жана мыйзамдарда тыюу салынбаган башка дагы ар кандай иш-аракеттер менен иштерди жүзөгө ашырууга укуктуу."},{"t":"p","h":"20-берене 1. Кыргыз Республикасында адамдын жана жарандын укуктары менен эркиндиктерин жокко чыгаруучу же кемсинтүүчү мыйзамдар кабыл алынбашы керек."},{"t":"p","h":"4. тыюу салууларга Конституция кепилдик берет:"},{"t":"p","h":"1) өлүм жазасына, кыйноого, дагы башка адамкерчиликсиз, мыкаачылык мамилеге;"},{"t":"v","l":["3) кулчулукка, адамдарды соодалоого;","4) бала эмгегин эксплуатациялоого;"]},{"t":"p","h":"5) жарандык-укуктук милдеттенмени аткарбоонун негизинде эркиндигинен ажыратууга карата салынган;"},{"t":"p","h":"6) инсандын ар-намысына шек келтирген маалыматты жайылткандыгы үчүн кылмыштык куугунтуктоого;"},{"t":"p","h":"7) ой-пикирин, диний жана башка ынанымдарын билдирүүгө жана алардан баш тартууга мажбурлоого;"},{"t":"p","h":"8) тынч чогулууга катышууга мажбурлоого;"},{"t":"p","h":"9) өзүнүн кайсы этноско таандык экенин аныктап керсетүүгө мажбурлоого;"},{"t":"p","h":"10) турак жайынан өзүм билемдик менен ажыратууга. П глава. Адам укуктары жана эркиндиктери 21-берене Ар бир адам ажыратылгыс жашоо укугуна ээ. Әч кимдин өмүрү өзүм билемдик менен кыйылышы мүмкүн эмес. Өлүм жазасына тыюу салынат."},{"t":"p","h":"22-берене 1. Әч ким кыйноолорго, башка адамкерчиликсиз, мыкаачылык же кадыр-баркынын басмырлаган мамилеге же жазалоого туш болушу мүмкүн эмес."},{"t":"p","h":"2. Әркиндигинен ажыратылган ар бир адам өзүнө гумандуу мамиле жасалышына жана адамдык кадыр-баркын сакталышына укуктуу"},{"t":"p","h":"<span class=\"pg\" data-n=\"149\">149<\/span>1. Кыргыз Республикасында кулчулукка, адамдарды соодалоого жол берилбейт."},{"t":"v","l":["2. Бала эмгегин эксплуатациялоого тыюу салынат.","24-берене"]},{"t":"p","h":"1. Ар бир адам эркиндикке жана жеке кол тийбестикке укуктуу."},{"t":"p","h":"4. Әч ким соттун чечимисиз 48 сааттан ашык мөөнөткө кармалышы мүмкүн эмес."},{"t":"p","h":"26-берене 1. Кыргыз Республикасында ар бир адам ары-бери эркин жүрүүгө, барчу жана жашоочу жерин тандап алууга укуктуу."},{"t":"p","h":"2. Ар бир адам Кыргыз Республикасынын чегинен тышкары эркин чыгууга укуктуу."},{"t":"p","h":"26-берене Ар бир адам мыйзамда каралган тартипке күнөөлүү экени далилденмейинче жана соттун чечими мыйзамдуу күчүнө киргени аныкталмайынча кылмыш жасаганга күнөөлүү деп эсептелбейт."},{"t":"p","h":"29-берене 1. Ар бир адам жеке турмушунун кол тийбестигине, арнамысынын корголушуна укуктуу."},{"t":"p","h":"2. Ар бир адам кат-кабар алышууга, телефондук жана башка сүйлөшүүлөргө укуктуу."},{"t":"p","h":"81-берене 1. Ар ким эркин ой жүгүртүүгө жана өзүнчө пикирге ээ болууга укутуу."},{"t":"p","h":"2. Ар ким өз пикирин билдирүүгө, сөз жана басма сөз эркиндигине укутуу."},{"t":"p","h":"4. Улуттук, этностук, расалык, диний жек көрүүчүлүктү, гендердик жана башка социалдык үстөмдүктү үгүттөп, кодулоого, касташууга же күч колдонууга чакырган үндөөлөргө тыюу салынат."},{"t":"p","h":"82-берене Ар кимге абийир жана дин тутуу эркиндиги кепилденет."},{"t":"p","h":"<span class=\"pg\" data-n=\"150\">150<\/span>1. Ар ким маалыматты эркин издөө, алуу, сактоо, пайдалануу жана аны оозеки, жазуу жүзүндө же башка ыкма жайылтуу укугуна ээ."},{"t":"p","h":"2. Ар ким мамлекеттик бийлик органдарындагы, жергиликтүү өз алдынча башкаруу органдарындагы, мекемелериндеги же уюмдардагы өзү жөнүндөгү маалыматтар менен таанышууга укуктуу."},{"t":"p","h":"84-берене Ар ким тынч чогулуш өткөрүү эркиндигине укуктуу. Әч ким чогулушка катышууга мажбурланууга тийиш эмес."},{"t":"v","l":["38-берене","Ар ким биригүү эркиндигине укуктуу.","86-берене"]},{"t":"p","h":"1. Үй-бүлө – коомдун негизи. Үй-бүлө, ата болуу, эне болуу, балалык – бүткүл коомдун камкордугуна алынат жана мыйзам менен артыкчылыктуу корголот."},{"t":"p","h":"2. Ар бир бала анын дене-боюнун, акыл-эсинин, ички руханий, ыймандык жана социалдык өнүгүүсү үчүн зарыл болгон жашоо деңгээлине укуктуу."},{"t":"p","h":"387-берене 1. Кыргыз Республикасында адамдын укугу менен эркиндигин кемсинтпеген элдик үрп-адаттар, каада-салттар мамлекет тарабынан колдоого алынат."},{"t":"p","h":"2. Улууларды урматтоо, туугандарына жана жакындарына камкордук көрүү – ар бир адамдын милдети."},{"t":"p","h":"42-берене 8. Ар ким эркин эмгектенүүгө, эмгекке жөндөмдүүлүгүн пайдаланууга укуктуу."},{"t":"v","l":["48-берене","1. Ар ким иш таштоого укуктуу.","44-берене","1. Ар ким эс алууга укуктуу.","486-берене","1. Ар ким билим алууга укуктуу.","46-берене","1. Ар ким турак-жайлуу болууга укуктуу."]},{"t":"p","h":"<span class=\"pg\" data-n=\"151\">151<\/span>1. Ар ким ден соолугун коргоого укуктуу."},{"t":"p","h":"Ш глава."},{"t":"p","h":"Жарандык. Жарандын укугу жана милдеттери 50-берене 1. Жаран өзүнүн жарандыгына жараша укуктарга ээ жана милдеттерди аткарат."},{"t":"p","h":"2.Бир дагы жаран өзүнүн жарандыгынан жана өзүнүн жарандыгын өзгөртүү укугунан ажыратылышы мүмкүн эмес."},{"t":"p","h":"4. Жаран республиканын чегинен тышкары сыртка чыгарып салынбайт же башка мамлекетке берилбейт."},{"t":"p","h":"5. Кыргыз Республикасы өз чегинен тышкы жерлерде жарандарын коргоого жана калкалоого кепилдик берет."},{"t":"p","h":"81-берене Жарандар Кыргыз Республикасына тоскоолдуксуз кайтып келүүгө укуктуу."},{"t":"v","l":["52-берене","1. Жарандар төмөндөгүлөргө укуктуу:"]},{"t":"p","h":"1) республикалык жана жергиликтүү маанидеги мыйзамдарды, чечимдерди талкуулоого жана аларды кабыл алууга катышууга;"},{"t":"p","h":"2) ушул Конституцияда жана мыйзамдарда каралган тартипке мамлекеттик бийлик органдарын жана жергиликтүү өз алдынча башкаруу органдардын жана жергиликтүү өз алдынча башкаруу органдарын шайлоого жана аларга шайланууга;"},{"t":"p","h":"3) конституциялык мыйзамда каралган тартипке референдумга катышууга."},{"t":"p","h":"2. Жарандар мамлекеттик жана коомдук мааниси бар маселелер боюнча элдик курултайларды өткөрүүгө укуктуу."},{"t":"p","h":"8. Жарандар республикалык жана жергиликтүү бюджеттерди түзүүгө, ошондой эле бюджеттен иш жүзүндө чыгымдалган каражаттар жөнүндө маалымат алууга укуктуу."},{"t":"p","h":"53-берене 1. Жарандарга улгайганда, ооруп же эмгектенууге жараксыз болуп калганда, багып-көрөөрүнөн ажыраганда мыйзамда каралган тартипте жана жагдайларга социалдык жактан камсыз кылуу кепилдиги берилет."},{"t":"p","h":"<span class=\"pg\" data-n=\"152\">152<\/span>Жарандар мыйзамда каралган учурларда жана тартипте салыктарды, жыйымдарды төлөөгө милдеттүү."},{"t":"p","h":"56-берене 1. Ата-Мекенди коргоо – жарандардын ыйык парзы жана милдети."},{"t":"p","h":"3-тиркеме"},{"t":"h3","h":"ИЗГИ САПАТТАР ЖАНА ПЕНДЕЛИК КҮНӨӨЛӨР"},{"t":"p","h":"Жети изгилик:"},{"t":"p","h":"Кудай эзелтен жанга берген үч изгилик – ишеним, үмүт жана кайрымдуулук: дагы төртөөнө кийин жетишилет, булар – адилеттүүлүк, элдик, токтоолук, акыл-эстүүлүк. Августин Аврелий"},{"t":"h3","h":"Владимир Мономах. «Насыят» (XII к.)"},{"t":"p","h":"Үйүңөрдө жалкоолонбогула, баарына өзүңөр көз салгыла. Келген коноктор үйүңөргө да, сый тамагыңарга да күлбөгүдөй болсун."},{"t":"p","h":"Калп айтуудан, мас болуудан сактангыла – булар жаныңарга да, денеңерге да зыян. Конок кайдан гана келбесин, ал карапайым эле адамбы же аксөөкпү, элчиби, баары бир сыйлап, аш берип узаткыла..."},{"t":"p","h":"Кайда барсаңар да, жолдо каерде токтоп эс алсаңар да, сурагандардын баарына тамак, суусундук бергиле... Жакшылык иштен баш тартпагыла, жалкоолук кылбагыла."},{"t":"p","h":"Кез келген кишилерге салам айтпай өтпөгүлө, учурашкан адамдардан жакшы сөзүңөрдү аябагыла."},{"t":"p","h":"Билгенинерден жакшыларын унутпагыла, билбегенинерди үйрөнүп билип алгыла... Жалкоолук – бардык жаман нерселердин башталышы: жалкоо билгенин унутат, билбегенин үйрөнүүгө умтулбайт."},{"t":"p","h":"<span class=\"pg\" data-n=\"153\">153<\/span>4-тиркеме"},{"t":"h3","h":"ЭРКИНДИКТИН УЛУУ ХАРТИЯСЫНАН"},{"t":"p","h":"(Кыскартылды) Иоан, кудайдын ырайымы менен Англиянын королу, Ирландиянын сеньору Нормандиянын жана Аквитаниянын герцогу, Анжунун графы, архиепископторго, епископторго, аббаттарга, графтарга, барондорго... жана бардык кызмат адамдарына жана өзүнө берилгендерге салам жолдойт. Биз кудайдын амири менен жана өзүбүздүн да, бардык ата-бабаларыбыздын, урпактарыбыздын да жан-ыйманыбызды сактоо үчүн, кудайды даңазалап, ыйык чиркөөнүн зоболосун көтөрүү максатында төмөндөгүлөрдү ырастай турганыбызды билип койгула:"},{"t":"p","h":"1. Биринчиден, кудай алдында макулдугубузду билдирип, ушул хартия аркылуу өзүбүз үчүн жана мураскорубуз үчүн түбөлүк англис чиркөөсү эркин болушуна жана өзүнүн бүтүндүк укугуна, өзүнүн кол тийгис эрктүүлүгүнө ээ болушун жактарыбызды тастыктайбыз."},{"t":"p","h":"18. Лондон шаары да байыркы эрктүүлүктүн баарына жана кургактыкта да, деңизде да өзүнүн эркин үрп-адаттарына ээ болууга тийиш. Мындан тышкары биз бардык башка шаарлар менен бургдар, жерлер, порттор эрктүүлүккө жана өздөрүнүн үрп-адаттарына ээ болушун каалайбыз жана буга жол коёбуз."},{"t":"p","h":"16. Әч ким өзүнүн рыцарь катары ээлеген жерлери же башка эркиндиги үчүн тийиштүү болгондогудан ашыкча кызмат өтөөгө мажбурланбоого тийиш."},{"t":"p","h":"20. Әркин адам анча-мынча күнөөсү үчүн ошого жараша, чоң күнөөсү үчүн да ага ылайык айып (штраф) тартууга тийиш. Ошондо деле анын негизги мүлкү кол тийгис бойдон калышы керек; дал ушул сыяктуу эле соодагер (айып тартып) өзү жана товары кол тийгис болот. Вилла да ушундайча айып тартат да, эгер биз айып салбасак анын мүлкү кол тийгис болот. Аталган айыптардын эч кайсынысы чынчыл адамдар менен кошуналар ант берип күбө өтмөйүнчө салынбайт."},{"t":"p","h":"89. Бир дагы эркин адам кармалышы, түрмөгө отургузулушу, мыйзамдан сырткары деп жарыяланышы же куулуп чыгышы же мүлкүнөн ажыратылышы мүмкүн эмес, биз ага аны менен тең укуктуулар чыгарган мыйзамдуу өкүм болмоюнча <span class=\"pg\" data-n=\"154\">154<\/span>же өлкөнүн мыйзамында талап кылынбаса, барбайбыз да, эч кимди жибербейбиз."},{"t":"p","h":"40. Әч кимге укуктарды жана адилеттүүлүктү сатпайбыз, эч кимдин укуктарын жокко чыгарбайбыз, адилеттүүлүккө баары акылуу."},{"t":"p","h":"52. Әгер кимдир бирөөнү өзүнүн пэрилеринин мыйзамдуу өкүмсүз жеринен, сарайларынан, эркинен же укугунан биз ажыратсак, биз аларды дароо эле ага кайрып беребиз. Әгер бул тууралуу талаш пайда болсо, анда бул жыйырма беш барондун өкүмү боюнча чечилсин."},{"t":"p","h":"Англия, 1215-ж."},{"t":"p","h":"5-тиркеме"},{"t":"h3","h":"ЭЛ АРАЛЫК ГУМАНИТАРДЫК УКУК"},{"t":"v","l":["Тушунуктер:","– Женева укугу – Гаага укугу","","Негизги даталар:","Женева укугу:","1949-ж. терт Женева конвенциялары","1977-ж. эки кошумча протокол киргизилген","Гаага укугу:","1899-ж. түзүлгөн"]},{"t":"p","h":"1907-ж. Гаага конвенцияларынын негизинде кайра түзүлгөн."},{"t":"p","h":"Куралдуу жаңжалдардын курмандыктарын укуктук жактан коргоо жана алардын натыйжаларын жеңилдетүү боюнча иш аракеттерди жүргүзүү эл аралык гуманитардык укуктун милдети болуп эсептелет."},{"t":"p","h":"Әл аралык гуманитардык укук эки бөлүктөн турат. Биринчиси «Женева укугу» экинчиси «Гаага» укугу деп аталат."},{"t":"p","h":"«Женева укугу» – аскерде жараксыз болуп калган аскер адамдарынын жана согуштук аракеттерге катышпаган адамдардын кызыкчылыктарын коргойт. Анын курамына 1949-ж. кабыл алынган төрт Женева конвенциялары жана 1977-ж. эки кошумча протоколдор кирет. Бул документтерде куралдуу кагылышуулар учурунда адамды коргоого багытталган нормалар жана эрежелер чагылдырылган."},{"t":"p","h":"<span class=\"pg\" data-n=\"155\">155<\/span>Негизги документтерге 1949-жылдагы төрт Женевалык конвенциялар кирет."},{"t":"p","h":"1. Конвенция. Согушуп жаткан армиялардагы жарадар жана оорулуу аскерлердин абалын жакшыртуу тууралуу"},{"t":"p","h":"2. Конвенция. Деңиздеги куралдуу күчтөрдүн курамындагы жарадар оорулуу жана кеме кыйроосуна дуушар болгон адамдардын абалын жакшыртуу жөнүндө"},{"t":"p","h":"8. Конвенция. Согуш туткандарына жасалуучу мамиле жөнүндө"},{"t":"p","h":"4. Конвенция. Согуш убагында жарандык калкты коргоо жөнүндө Женева конвенцияларына 1977-ж. эки кошумча протоколу киргизилген."},{"t":"p","h":"1. Кошумча протоколу. Әл аралык куралдуу жаңжалдардан жабыр тарткан адамдарды коргоого тиешелүү."},{"t":"p","h":"2. Кошумча протоколу. Әл аралык эмес мүнөздөгү куралдуу жаңжалдардан жабыр тарткандарды коргоого тиешелүү."},{"t":"p","h":"Женева укугу Кызыл Кресттин негизги идеяларын чагылдырат."},{"t":"p","h":"«Гаага укугу» же «согуш укугу» согуш аракеттери болуп жаткан учурда, согушуп жаткан тараптардын укуктарын жана милдеттерин аныктайт. Анын максаты согуш аракеттерин көзөмөлдөө. Гаага укугу согуштук зарылчылыкка жана мамлекетти сактап калуу принциптерине негизделген. Бул укук 1899-жылы түзүлүп, кийин 1907-ж. кайра каралып, Гаага конвенцияларынын негизинде түзүлгөн. Гаага укугунун кээ бир бөлүгү андан алынып 1929-, 1949-жылдардагы Женева укугунун курамына киргизилген. Ага аскер туткундарынын, жарадарлардын, согуштук аракеттердин учурунда, деңизде жана басып алынган аймактагы жапа чеккен тынч жаткан калктын статусун караган бөлүмдөр кирет."},{"t":"p","h":"1954-ж. Гаага укугуна Гаагада кол коюлган маданий баалуулуктарды коргоо тууралуу Конвенция кирет. Ошондой эле 1980-ж. Женевада кадыресе куралдардын түрлөрүн колдонууну чектөө же тыюу салуу тууралу конвенцияда киргизилген. Әл аралык гуманитардык укуктун ченемдер 1864-ж. Женева конвенциясынан башталса, адам укугу боюнча мыйзам кабыл алуулар 1948-ж. Адам укугунун жалпы Декларациясынан башталып БУУ чоң ролду ойногон."},{"t":"p","h":"Гуманитардык укук аскердик кагылышуулар жана согуш учурунда күчүнө кирсе, адам укугу боюнча мыйзамдар тынчтык убагында ишке ашырылат. Дагы бир айырмачылыгы <span class=\"pg\" data-n=\"156\">156<\/span>адам укугу боюнча мыйзамдар мамлекет менен анын атуулунун ортосундагы мамилени көзөмөлдөсө, гуманитардык укук эки каршылаш мамлекеттин атуулунун ортосундагы мамилени өзүнө камтыйт."}],"sub":[{"title":"Германия Федеративдүү Республикасынын негизги мыйзамы","b":19},{"title":"П. Федерация жана жерлер","b":41},{"title":"Ш. Бундестаг","b":45},{"title":"Кыргыз Республикасынын Конституциясы","b":55},{"title":"П бөлүм","b":57},{"title":"ИЗГИ САПАТТАР ЖАНА ПЕНДЕЛИК КҮНӨӨЛӨР","b":115},{"title":"ЭРКИНДИКТИН УЛУУ ХАРТИЯСЫНАН","b":125},{"title":"ЭЛ АРАЛЫК ГУМАНИТАРДЫК УКУК","b":136}],"section":"ШГЛАВА","pages":[143,156]},{"title":"ВЕНН ДИАГРАММАСЫ","blocks":[{"t":"h3","h":"ВЕНН ДИАГРАММАСЫ"},{"t":"v","l":["Мамлекет менен жарандык коомдун","өз ара карым-катышы","","Тегеректердин кесилишинде мамлекет менен жарандык","коомдун карым-катышы кайсы түзүмдөр аркылуу өтөрү","көрсөткүлө."]},{"t":"h3","h":"Мамлекет"},{"t":"v","l":["Мазмуну: социалдык топтурдун, этностордун жалпы","маанидеги таламдарын жүзөгө ашыруу","чөйрөсү"]},{"t":"p","h":"Ишке ашыруу каражаты: конституция, бийлик, маж-"},{"t":"v","l":["бурлоо, укук","Мамлекеттин негизи: саясий институттар, мыйзам","чыгаруу, аткаруу жана сот бийликтеринин","органдары, лидерлер, элита","","Жарандык коом"]},{"t":"p","h":"Мазмуну: жеке адамдар менен топтордун таламдарын жүзөгө ашыруу чөйрөсү Ишке ашыруу каражаты: ынандыруу, укуктук жана моралдык нормалар, салт, үрп-адат, искусство ж.б.у.с."},{"t":"p","h":"Жарандык коомдун негизи: тартып алынгыс укуктары бар эркин адам жана бул укуктарды пайдаланууга жардам бере турган саясый эмес уюмдар"},{"t":"h3","h":"<span class=\"pg\" data-n=\"157\">157<\/span>СӨЗДҮК"},{"t":"p","h":"Адекваттуу – толугу менен бир нерсеге туура, дал келүүчү, окшош. Апатия – турмушка кайдыгер, көңүлсүз мамиле: мындай абалда ички умтулуу, кызыкчылыктар, эмоциялык реакция начарлап кеткен же толугу менен жогологон болот."},{"t":"p","h":"Адеп-ахлах (ыйман) – жүрүм-турумду, коомдо адамга зарыл болгон руханий жана жан дүйнө сапаттарын аныктаган эрежелер, ошондой эле бул эрежелердин аткарылышы."},{"t":"p","h":"Билль – айрым өлкөлөрдүн (Англиянын, Канаданын, АКШнын ж. б.) мыйзам чыгаруу органдарынын кароосунда киргизилүүчү мыйзам долбоору, ошондой эле кээ бир мыйзамдардын аткарылышы."},{"t":"p","h":"Декларация – кайсы бир принциптерди жар салган эл аралык укуктук документ. Декларациялар сөздүн түз маанисинде милдеттүү мүнөздө болбойт."},{"t":"p","h":"Депутат – мамлекеттик бийликтин жана жергиликтүү өз алдынча башкаруу органдарына шайлануучу калктын өкүлү."},{"t":"p","h":"Дискриминация – расасына, улутуна, динине же социалдык тегине, саясый көз караштарына, жынысына ж. б. карай жарандардын айрым топторунун укуктарын чектөө же жоюу."},{"t":"p","h":"Жарандык коом – коомдук турмушта адамдар өздөрүнүн жекече максаттары менен керектөөлөрүнө жараша өз алдынча карымкатнашта болгон чөйрөсү."},{"t":"p","h":"Жарандык – адамдын жана мамлекеттин саясый-укуктук байланышы. Мында эки тараптын тең өз ара укуктары жана милдеттери болот."},{"t":"p","h":"Жеке адамга сыйынуучулук – кимдир бирөөнү өтө эле көкөлөтүп, ыйык көтөрүүчүлүк."},{"t":"p","h":"Жөндөмдүүлүктөр – адамдын жекече туруктуу сапаттары. Ар кайсы ишмердик түрлөрүндөгү ийгиликтери адамдын тийиштүү жөндөмүнө жараша болот."},{"t":"p","h":"Индивид – коомдун, элдин, таптын, кайсы бир социалдык топтун, адамзаттын өзүнчө турган өкүлү."},{"t":"p","h":"<span class=\"pg\" data-n=\"158\">158<\/span>Индивидуалдуулук – жеке жандын кайталангыс өзгөчөлүктөрү, кайсы бир индивидуумду башкалардын баарынан айырмалап турган белгилердин жыйындысы."},{"t":"p","h":"Индивидуум – ар бир жеке жана өз алдынча жашаган организм, жандык (мисалы, жаңы төрөлгөн бала, ит, мышыктын мыйы"},{"t":"p","h":"Инсан – езунун социалдык ролдорун толук кандуу денгээлде аткарууга жендемдуу жана даяр адам."},{"t":"p","h":"Кодекс – коомдук мамилелердин кайсы бир тарамын дааналата же тузден-туз женге салуучу укуктук ченемдердин баарын же негизги белугун камтыган мыйзам."},{"t":"p","h":"Конвенция – кайсы бир атайын маселе боюнча милдеттуу турде аткарылууга тийиш болгон эл аралык келишим же макулдащуу. Пактылар менен конвециялар кабыл алынып, кол коюлгандан кийин эмес, көрсөтүлгөн сандагы мамлекеттер аларды ратификациялагандан (бекиткенден) кийин гана күчүнө кирет. Пактылар менен конвенцияларга катышуучу мамлекеттер бул эл аралык документтерде камтылган милдеттемелерди моюнга алышат, аларды катуу сактоого, аткарууга тийиш."},{"t":"p","h":"Конституция – өлкөдөгү белгилүү мамлекеттик түзүлүштү, бийлик органдарынын түзүмүн жана компетенцияларын бекиткен негизги мыйзам (мыйзамдар). Ал эң жогорку юридикалык күчкө ээ, практика жүзүндө иштеп турушу керек, өзгөчө процедуралар аркылуу өзгөртүлүшү мүмкүн."},{"t":"p","h":"Конформизм -— (лат. “окшош”, “жакын”) адамдын кайсы бир топ жасаган же жасады деп ойлогон кысымына көнүп берүүчүлүгү. Бул анын адегенде көпчүлүктүн позициясына туура келбеген өзүнүн жүрүм-турумунан жана көз карашынан баш тартуусунан көрүнөт. Коррупция – бул бийлик ыйгарымдары бар адамдардын өз кызмат абалын жекече кызыкчылыктары үчүн пайдаланып, мамлекет менен коомго зыян келтириши."},{"t":"p","h":"Кредо – ынаным, көз караш, дүйнөкараш негизи."},{"t":"p","h":"Керектөө – организмдин, инсандын, социалдык топтун, бүтүндөй коомдун жашоосу жана өнүгүүсү үчүн анык зарыл нерсеге болгон муктаждык; активдүү болууга түрткү берүүчү ички кызыкчылык."},{"t":"p","h":"<span class=\"pg\" data-n=\"159\">159<\/span>Коом – 1) жашоодо адамдар ортосунда калыптанып тарыхый өнүгүүчү мамилелердин жыйындысы; 2) адамдардын жалпылыгы."},{"t":"p","h":"Лидер – көндүрүү же жекече өрнөк көрсөтүү жолу менен башкаларды ээрчите алган адам; өзүнүн же бүтүндөй топтун максатын көздөп, топко таасир эте билген.адам."},{"t":"p","h":"Лоббирлөө тобу – кайсы бир саясый кызыкчылыкты коргоо үчүн мыйзам чыгаруучуларга таасир этүүчү аларды өз тарабына тартууга аракеттенүүчү топ."},{"t":"p","h":"Мораль – адамдардын жүрүм-турумун жөнгө салуучу коомдук ченем, эрежелер."},{"t":"p","h":"Мыйзам – мамлекеттик жана коомдук турмуштагы эң маанилүү маселелерди жөнгө салуучу ченемдик укуктук акт."},{"t":"p","h":"Мүнөз – адамдардын башка адамдарга карата иш-аракетин, мамилесин аныктаган сапаттардын жыйындысы."},{"t":"p","h":"Муниципалдык менчик – жергиликтүү өз алдынча башкаруу органынын карамагындагы мүлк."},{"t":"p","h":"Объективдүү – калыс, туура."},{"t":"p","h":"Омбудсмен (Акыйкатчы) – мамлекеттик бийлик, жергиликтүү өз алдынча башкаруу органдары, кызмат адамдары тарабынан адам укуктары менен эркиндиги кандай сакталып жаткандыгына көзөмөл жүргүзүүчү кызмат адамы. Омбудсмен институту Кыргызстанда 2002-жылдын баштап киргизилген."},{"t":"p","h":"Пакт – бул катышуучу мамлекеттер жоболорун тутунууга расмий түрдө макулдашкан эл аралык документ."},{"t":"p","h":"Плюрализм – пикирлердин, көз караштардын ар түрдүүлүгү."},{"t":"p","h":"Преамбула – мыйзамдын, документтин кириш, түшүндүрүүчү бөлүгү. Протокол – актыга же конвенцияга тиркеме боло турган эл аралык келишим."},{"t":"p","h":"Психология – 1) иш-аракеттин кайсы бир түрүн шарттап турган психикалык процесстер жыйындысы; 2) психикалык ишмердиктин жүрүшүн жана мыйзамченемдүүлүктөрүн изилдеген илим."},{"t":"p","h":"Ратификация – эл аралык документтин мамлекеттеги эң жогорку органы тарабынан бекитилиши."},{"t":"p","h":"<span class=\"pg\" data-n=\"160\">160<\/span>Референдум – эң маанилүү чечимдерди кабыл алуу максатында"},{"t":"p","h":"өткөрүлүүчү бүткүл элдик добуш берүү."},{"t":"p","h":"Социалдык мүдөө – адамдардын коомдогу жүрүм-турум, өз-ара"},{"t":"p","h":"мамилелерин шарттоочу ынанымдары."},{"t":"p","h":"Субъективдүү – адамдын жекече көз карашына, түшүнүгүнө, аң-"},{"t":"p","h":"сезимине байланышкан."},{"t":"p","h":"Суверенитет – мамлекет бийлигинин өлкө ичинде да, эл аралык"},{"t":"p","h":"деңгээлде да көз карандысыздыгы."},{"t":"p","h":"Эрктүүлүк сапаттары – бул адамдын көздөгөн максаттарына же-"},{"t":"p","h":"тишүүсүнө таасир этүүчү сапаттар."},{"t":"p","h":"Темперамент – адамдын башка адамдарга, социалдык кырдаалдар-"},{"t":"p","h":"га кандайча мамиле кыларын аныктаган сапаттарынын айкалышкан өзгөчөлүгү."},{"t":"p","h":"Толеранттуулук (сабырдуулук) – адамдардын башкача болуу уку-"},{"t":"p","h":"гун, алардын бөлөкчө экендигин таануу."},{"t":"p","h":"Трайбализм – (англ. їгїре – уруу) уруунун маданий-тиричилик, сы-"},{"t":"p","h":"йынуу, коомдук-саясый обочолонуусун жактагандык."},{"t":"p","h":"Укук – коомдогу мамилелерди жөнгө салып туруучу атайын чек-че-"},{"t":"p","h":"немдердин системасы."},{"t":"p","h":"Укуктук мамлекет – ыйгарымдары адам укуктары жана эркиндиги"},{"t":"p","h":"менен аныкталып чектелген мамлекет."},{"t":"p","h":"Харизма – (грек. сһагпїзте – кудай тартуулаган шык, жөндөм) – ли-"},{"t":"p","h":"дердин абдан сейрек жөндөмдөрү бар экендигин билдирген түшүнүк."},{"t":"p","h":"Хартия – орто кылымдарда жана жаңы мезгилде коомдук-укуктук"},{"t":"p","h":"жана саясый мүнөздөгү документ."},{"t":"p","h":"Эмоциялар жана мотивациялар – сезимдер жана иш-аракетке"},{"t":"p","h":"түрткү болгон ниет."},{"t":"p","h":"<span class=\"pg\" data-n=\"163\">163<\/span>Окуубасылмасы"},{"t":"h3","h":"Саалаев Өскөн Балталиевич МАМЛЕКЕТ ЖАНА УКУК"},{"t":"v","l":["Жалпы билим берүүчү орто мектептердин","9-классы үчүн окуу китеби","1-басылышы","","Редактору К. Байтокова","Дизайнери Д. Тимур","Компьютерге калыпка салган Б. Тимуров","Тех. редактору М. Курбанбаева","Корректору Н. Эсенаманова","","Басууга 30.05.2012. кол коюлду. Форматы 60х901/,.","Офсет кагазы. Көлөмү 10,0 физ. басма табак.","Нускасы 86 000 экз. Заказ № 5/09-8.","","«Билим-компьютер» басмаканасы","Бишкек ш., Восток-5 кичирайону, 14 2","","«Принт Әкспресс» басма-полиграфиялык комплексинде басылды.","Бишкек шаары, Куренкеев көчөсү, 89."]}],"sub":[{"title":"Мамлекет","b":2},{"title":"Саалаев Өскөн Балталиевич МАМЛЕКЕТ ЖАНА УКУК","b":70}],"section":"ШГЛАВА","pages":[157,163]}]};</script>

    ['russkaya-literatura', /русская литература|литературное чтение|орус адабият/, 'Орус адабияты', 'Русская литература'],

  function subjectOf(b) {

  // "My books": books the reader opened or added, stored on the phone. 1 = in the list,
  // 0 = removed by the reader. Books opened before this list existed count as added.
  function myState() { return lsGet('mybooks', null) || {}; }

  function setMy(id, on) { var s = myState(); s[id] = on ? 1 : 0; lsSet('mybooks', s); }

  var libHash = '#/'; // where the reader's back button returns to

  function libShell(title, link, sub) {
    document.title = title;
    var school = S.school || (S.ui === 'ky' ? 'ky' : 'ru');
    app.innerHTML = '<div class="lib"><div class="lib-head"><h1>' + esc(title) + '</h1>' + link + '</div>' +
      (sub ? '<p class="sub">' + esc(t('appSub')) + '</p>' : '') +
      '<div class="school">' + SCHOOLS.map(function (o) {
        return '<button data-s="' + o[0] + '"' + (o[0] === school ? ' class="on"' : '') + '>' + esc(o[1]) + '</button>';
      }).join('') + '</div>' +
      '<div id="books"><div class="loading">' + esc(t('loading')) + '</div></div></div>';
    Array.prototype.forEach.call(app.querySelectorAll('.school button'), function (btn) {
      btn.onclick = function () {
        S.school = S.ui = btn.getAttribute('data-s'); applySettings();
        if (location.hash === '#/my') showMyBooks(); else location.hash = '#/';
      };
    });

  }

  function loadList() {
    return fetchJSON('books/index.json').catch(function (e) {
      $('#books').innerHTML = '<div class="loading">' + esc(t('err')) + '</div>'; throw e;
    });
  }

  function showLibrary() {
    libHash = '#/';
    var school = libShell(t('appTitle'), '<a class="btn my-link" href="#/my">' + esc('★ ' + t('my')) + '</a>', true);
    loadList().then(function (list) {
      list = list.filter(function (b) { return !b.school || b.school === school; });
      var grades = [];
      list.forEach(function (b) { gradesOf(b).forEach(function (g) { if (grades.indexOf(g) < 0) grades.push(g); }); });
      grades.sort(function (a, b) { return a - b; });
      var open = lsGet('libOpen', {});
      var box = $('#books');
      box.innerHTML = grades.length ? '' : '<div class="loading">' + esc(t('noBooks')) + '</div>';
      grades.forEach(function (g) {
        var books = list.filter(function (b) { return gradesOf(b).indexOf(g) >= 0; });
        var sec = document.createElement('section'); sec.className = 'grade';
        sec.innerHTML = '<button class="grade-h"><span>' + esc(g + ' ' + t('grade')) + '</span><span class="n">' + books.length + '</span></button><div class="grade-b"></div>';
        var head = $('.grade-h', sec), body = $('.grade-b', sec);
        function setOpen(on) {
          sec.classList.toggle('open', on);
          body.innerHTML = '';
          if (on) bySubject(books, body, false);
        }
        head.onclick = function () {
          var on = !sec.classList.contains('open');
          Array.prototype.forEach.call(box.querySelectorAll('.grade.open'), function (s) { if (s !== sec) { s.classList.remove('open'); $('.grade-b', s).innerHTML = ''; } });
          setOpen(on);
          open[school] = on ? g : null; lsSet('libOpen', open);
          if (on && sec.scrollIntoView) sec.scrollIntoView({ block: 'start' });
        };

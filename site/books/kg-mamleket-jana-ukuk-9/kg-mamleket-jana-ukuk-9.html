 алынган. 2008-жылы 12-февралда референдум аркылуу өзгөртүлгөн. Ал Конституция 8 главадан 97 беренеден турган."},{"t":"p","h":"Кыргыз Республикасынын Конституциясынын жаңы редакциясы 2006-жылы ноябрь, декабрь айларында КРнын ЖК тарабынан кабыл алынган. КРные конституциясы 9 главадан 101 беренеден турган. 2007-жылы 21-октябрда кайрадан референдум аркылуу өзгөртүлүп, 9 глава 98 беренени камтыган."},{"t":"h3","h":"Кыргыз Республикасы"},{"t":"h3","h":"демократиялык"},{"t":"h3","h":"мамлекет"},{"t":"v","l":["эгемендүү","","унитардык","","башкарууга дин аралашпаган","укуктук","","социалдык","мамлекет"]},{"t":"p","h":"2010-жылы 27-июнда Кыргыз Республикасынын Конституциясы дагы бир жолу референдум аркылуу өзгөртүлгөн. Бул Конституция 9 бөлүмдөн, 114 беренеден турат."},{"t":"p","h":"Биринчи бөлүм: Конституциялык түзүлүштүн негиздери. Әкинчи бөлүм: Адамдын жана жарандын укуктары менен эркиндиктери."},{"t":"v","l":["Биринчи глава. Негизги укуктар жана эркиндиктер.","Экинчи глава. Адам укуктары жана эркиндиктери."]},{"t":"p","h":"Үчүнчү глава. Жарандык, жарандардын укуктары жана милдеттери."},{"t":"v","l":["Үчүнчү бөлүм: КРнын Президенти.","Төртүнчү бөлүм: КРнын мыйзам чыгаруу бийлиги.","Биринчи глава. Жогорку Кеңеш."]},{"t":"p","h":"Экинчи глава. Жогорку Кеңештин ыйгарым укуктары."},{"t":"p","h":"<span class=\"pg\" data-n=\"26\">26<\/span>Үчүнчү глава. Мыйзам чыгаруу иши."},{"t":"p","h":"Бешинчи бөлүм: Кыргыз Республикасынын аткаруу бийлиги."},{"t":"p","h":"Алтынчы бөлүм: Кыргыз Республикасынын сот бийлиги. Жетинчи бөлүм: Мамлекеттик башка органдар."},{"t":"p","h":"Сегизинчи бөлүм: Жергиликтүү өз алдынча башкаруу. Тогузунчу бөлүм: Конституцияга өзгөртүүлөрдү жана толуктоолорду киргизүү."},{"t":"p","h":"Биринчи бөлүмдөгү Конституциялык түзүлүштүн негиздеринен мисал келтирели:"},{"t":"h3","h":"1-берене"},{"t":"p","h":"1. Кыргыз Республикасы (Кыргызстан) – эгемендүү, демократиялык, укуктук, мамлекеттик башкарууга дин аралашпаган унитардык, социалдык мамлекет."},{"t":"h3","h":"2-берене"},{"t":"p","h":"8. Мыйзамдар жана мамлекеттик маанидеги башка олуттуу маселелер референдумга коюлат."},{"t":"p","h":"4. Шайлоо эркин болуп эсептелет."},{"t":"p","h":"Жогорку Кеңештин депутаттарын, Президентти, Жергиликтүү өз алдынча башкаруунун өкүлчүлүктүү органдарынын депутаттарын шайлоо жашыруун, жалпы добуш берүү менен тең жана тике шайлоо укугунун негизинде өткөрүлөт. КРнын 18 жашка толгон жарандары шайлоого укуктуу."},{"t":"h3","h":"4-берене"},{"t":"p","h":"1. КРда саясый көп түрдүүлүк жана көп партиялуулук таанылат."},{"t":"h3","h":"6-берене"},{"t":"p","h":"1. Конституция эң жогорку юридикалык күчкө ээ жана ал Кыргыз Республикасында түздөн-түз колдонулат."},{"t":"p","h":"2. Конституциянын негизинде мыйзамдар жана башка ченемдик укуктук актылар кабыл алынат."},{"t":"h3","h":"7-берене"},{"t":"p","h":"1. Кыргыз Республикасында эч бир дин мамлекеттик же милдеттуу дин катары кабыл алынышы мумкун эмес."},{"t":"p","h":"2. Дин жана бардык ырасымдар мамлекеттен ажыратылган. Диний бирикмелердин жана дин кызматчыларынын мамлекеттик органдардын ишине кийлигишүүсүнө тыюу салынат."},{"t":"p","h":"<span class=\"pg\" data-n=\"27\">27<\/span>Конституциядагы өзгөртүүлөр көптөгөн жакшы натыйжаларга:"},{"t":"p","h":"– парламенттин ишин жакшыртууга;"},{"t":"p","h":"– өкмөттүн ролун жана жоопкерчилигин жогорулатууга;"},{"t":"p","h":"– президент, парламент жана өкмөттүн ортосунда өз ара байланыштарды бекемдөөгө;"},{"t":"p","h":"– соттордун күчтүү жана адилеттүү болушуна;"},{"t":"p","h":"– омбудсмен институтунун адам укуктарын коргоону жакшыртуусуна багытталат."},{"t":"v","l":["Кайталоо үчүн суроолор","1. Конституция жана анын маани, максаты.","2. Конституциянын түрлөрү.","З. Кыргызстандын Конституциясынын өнүгүү жылдары."]},{"t":"p","h":"2 4. 1-беренеде белгиленген аныктамаларга ез тушунугунду айтып бер."},{"t":"h3","h":"§ 6. КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЫЙЫК БЕЛГИЛЕРИ"},{"t":"v","l":["Тушунуктер:","* Мамлекеттик герб.","* Мамлекеттик желек.","Мамлекеттик гимн.","Негизги даталар:"]},{"t":"p","h":"1908-жылы март Жети-Суу облусунун, Бишкек, Каракол шаарларынын гербдери."},{"t":"p","h":"1908-жыл октябрь, Фергана облусунун, Ош шаарынын гербдери."},{"t":"v","l":["1992-жыл 8-март, КРнын мамлекеттик желеги.","1992-жыл 18-декабрь, КРнын мамлекеттик гимни.","1994-жыл 14-январь КРнын мамлекеттик герби.","Тапшырма:"]},{"t":"p","h":"* КРнын ыйык белгилери жана алар эмне үчүн керек?"},{"t":"p","h":"* Мамлекеттин жана сенин турмушуңдагы алардын орду жана мааниси (эссе жаз)."},{"t":"p","h":"* КРнын ыйык белгилери менен Кыргыз ССРинин ыйык белгилеринин өзгөчөлүктөрүн салыштыргыла."},{"t":"p","h":"Кыргызстандын жана кыргыз элинин турмушунда мамлекеттин ыйык белгилеринин эң чоң мааниси бар."},{"t":"p","h":"<span class=\"pg\" data-n=\"28\">28<\/span>Кыргыз ССРинин Герби. Кыргыз Республикасынын Герби."},{"t":"p","h":"Мамлекеттин ыйык белгилери: Туу, Гимн, Гербде республиканын элинин тарыхы улуттук каада-салты, маданияты ж.б. баалуулуктары чагылдырылган."},{"t":"p","h":"Кыргыз Республикасынын мамлекеттик герби"},{"t":"p","h":"Кыргыз элинин байыртан эле асаба-туусу, уруунун энтамгасы, уруу башчыларынын мөөрү болгондугу баарыбызга белгилүү."},{"t":"p","h":"«Символ» – грек сөзүнөн алынып, белги, мүнөздүү белги, уруксат белгиси деген маанини билдирет. Ошондой эле, символ кандайдыр бир ойду, идеяны да билдирип турат."},{"t":"p","h":"Тамга – бул уруулук белги жана ар бир уруу өзүнүн символу катары жаныбарды, кушту же курал-жаракты эсептешкен. Кыргыздар дагы өзүнүн туу, эмблемаларына тотемдик сөлөкөт түшүрүшкөн. Жаныбарлардын терисине тотемдик сөлөкөттү күйгүзгөнү, ал тургай өз денесине да белгилерди түшүрүп алышканы тарыхый маалыматтардан белгилүү. Кыргыз эли байыртадан эле малдарына эн тамга салып, малы жоголсо, ошол тамгага карап таап алышкан."},{"t":"p","h":"1908-жылы мартта Жети-Суу облусунун жана шаарларынын гербдери менен кошо Пишпек жана Каракол шаарларынын; ошол эле жылы октябрь айында Фергана облусунун шаарларынын жана Ош шаарынын герби Петергоф шаарында кабыл алынган. Гербдин үстүнкү кызыл менен боёлгон бөлүгүндө, күмүш сымал түстөгү боёк .менен шаардын көрүнүктүү жери – Сулайман тоосу жана Ак-Буура дарыясы тартылган."},{"t":"p","h":"<span class=\"pg\" data-n=\"29\">29<\/span>Герб символу практикалык мааниге ээ болгон. Ал шаардын мөөрүнө, кызматкерлердин топчуларына, чиновниктердин мундирлеринин погондоруна, баш кийимдерине тагылуучу белгилерге, эстелик медалдарга, желекке, жетондорго ж. б. түшүрүлгөн."},{"t":"p","h":"1929-жылы 80-апрелде кабыл алынган Конституциянын негизинде Кыргыз мамлекетинин символдору – туусу жана герби аныкталган."},{"t":"p","h":"1986-жылдын август айында Республиканын мамлекеттик символдорунун долбооруна конкурс жарыяланган. Анда шарт боюнча Кыргыз ССРинин герби СССРдин гербинин элементтерин сактоого тийиш болгон. Гербде орок жана балка, беш бурчтуу жылдыз тартылып, «Бардык өлкөлөрдүн пролетарлары бириккиле!» деген ураан орус жана кыргыз тилдеринде жазылуусу керек болгон. Ошондой эле гербде Кыргызстандын географиялык-экономикалык негизги шарттарын чагылдыруу талабы коюлган."},{"t":"p","h":"Конкурска бардыгы 86 долбоор түшкөн. Конституциялык комиссия тарабынан 1986-жылы 8-сентябрда сүрөтчү О. Т. Павленконун долбооруна биринчи сыйлык ыйгарылган."},{"t":"p","h":"1987-жылы 28-мартта Кыргыз ССРинин съездинде кабыл алынган Конституцияда Мамлекеттик Герб бекитилген."},{"t":"p","h":"Кыргыз Республикасынын Герби – Кыргыз Республикасынын мамлекеттик эмблемасы болуп эсептелет. Ал 1994- жылы 14-январда Жогорку Кеңеш тарабынан кабыл алынган. Гербдин автору А. Абдыраев, С. Дубанаев."},{"t":"p","h":"Гербде ак мөңгүлүү Ала-Тоо, Кыргызстандын бермети болгон Ысык-Көлдүн сүрөтү түшүрүлгөн."},{"t":"p","h":"Ары жагынан жылуулуктун, энергиянын булагы болгон Күн нурун чачып чыгып келе жатат."},{"t":"p","h":"Гербде элибиздин дыйканчылыгын айгинелеген пахта сабагы, буудай машагы менен оронуп, ортосунда эркиндиктин, бийиктиктин, коопсуздуктун символу болгон Ак шумкар тартылган."},{"t":"p","h":"Гербдин негизги идеясы Кыргызстанда жашаган элдин биримдигин, эркиндигин чагылдырып турат."},{"t":"p","h":"Кыргыз Республикасынын Мамлекеттик Туусу Улуттук мамлекеттик атрибутикалардын калыптанышы тарыхый өнүгүүнүн узак жолун басып өткөн."},{"t":"p","h":"<span class=\"pg\" data-n=\"30\">30<\/span>ХЕХИ кылымдарда Әне-Сайдагы жана Борбордук Азиядагы Кыргыз мамлекетинин жашап турган мезгилинде өз туулары болгон. Алардын формасы, түсү жана колдонулушу жазма булактарда, сүрөттөрдө чагылдырылган."},{"t":"p","h":"Кытайдын «Синь-Таньшу» хроникасынын маалыматына караганда, кыргыздар согуш учурунда «жааларды, жебелерди жана тууларды» колдонушкан. Хакасиянын (Кыргызиянын) түндүгүндө кездешкен Сулек чиймелерине түшүрүлгөн оор куралданган кыргыз атчан жоокеринин колундагы найзанын сабында ар кандай формадагы туулар тартылган. Кыргыз тууларынын түсү да өзгөчө символго ээ болгон. Кытай жыл наамаларында кыргыздардын туулары жана байрактары кызыл түстө, ал эми Хивадагы мусулман тарыхчысы Абу Дулефтин эмгегинде жашыл түстө экендиги кабарланат. Туу кыргыздарда ар кандай шартта ар түрдүүчө колдонулган. Жоого аттанганда Туу алып жүргөнгө эр жүрөк, ишеничтүү жоокер дайындалган. Ал салгылашуу учурунда аскерге дем, кубат берүү максаты менен Тууну бийик дөңсөө жерге кармап турган. Туунун душман колуна түшкөнү жеңилгенге барабар болгон. Азыркы учурда дагы көп адамдын өмүрүн алган чоң кырсыктар болгондо, мамлекет башчысынын буйругу менен мамлекеттин желеги ылдый түшүрүлүп, аза күтүлөт. Ошондуктан, Туу ыйык катары сакталат."},{"t":"p","h":"Кыргыз мамлекети негизделгенден кийин, 1929-жылы 25-80-апрелде болуп өткөн Кыргыз АССРинин П съездинде мамлекеттик желек кабыл алынган."},{"t":"p","h":"1987-жылы 28-мартта Кыргыз ССРинин V съездинде мамлекеттик желек бекитилген."},{"t":"p","h":"Кыргыз Республикасынын мамлекеттик желеги 1992-жылы 8-мартта Жогорку Кеңештин 8-сессиясында кабыл алынган. Желектин авторлору: Ә. Айдарбеков, Б. Жайчыбеков, С. Матаев, М. Сыдыков жана С. Иптаровдор."},{"t":"p","h":"Кыргыз Республикасынын желеги кызыл түстүү кездемеден жасалып, анда 40 нурун чачыратып күндүн алкагы тартылган. Анын ортосунда кыргыздардын боз үйүнүн түндүгүнүн сүрөтү түшүрүлгөн."},{"t":"p","h":"Күндүн кырк нурунун саны ыйык сан деп эсептелет. Себеби, улуттук баатыр болгон Манастын кырк чоросунун эсебине туура келет жана башка баатырлар дагы 40тан жигит күтүп келишкен."},{"t":"p","h":"<span class=\"pg\" data-n=\"31\">31<\/span>Түндүк – көчмөн элдердин жана улуттук маданияттын символу. Түндүктүн төрт бөлүгү төгөрөктүн төрт бурчун, анын тегерек чамгарагы бүткүл ааламды, түбөлүктүүлүктү, чексиздикти билдирет. Кызыл желек өз эли жерин душмандардан кашык каны калганча коргоонун, эгемендүүлүктүн, келечекке умтулуунун идеясын берип турат."},{"t":"p","h":"«Манас» эпосунда Туу жөнүндө кандай маалыматтар айтылган? Туу – асаба, байрак, желек; булар мамлекеттин, аскер бөлүгүнүн жана башкалардын символу болуп эсептелет. Әпосто ар бир аскер бөлүгү, тактап айтканда, ондук, жүздүк, миңдиктердин өз-өзүнчө желеги болуп, бардыгы бир Тууга бириккен. Алар ар кандай кездемеден жасалып, ичке узун таякка бекитилет."},{"t":"p","h":"Туу бийик жерге илинип, аскерлерди чогултуу белгисин билдирген. Жоого аттанганда Туу алып жүргөнгө эр жүрөк, ишеничтүү жоокер дайындалган. Ал салгылашуу учурунда кошуунга дем, күч берүү үчүн Тууну көрүнө дөңсөө жерге кармап турган. Мисалы, эпосто: «Ушу турган Кутубий Туу түбүндө турарын» (С. К. 1. 106). «Туу түбүндө көп колдун» (С. К. 1. 186) деп жазылган. Туунун душмандын колуна түшкөнү, же жыгылганы жеңилгенге барабар. Ошондуктан, Туу ар дайым ыйык сакталган: Бул тууралуу «Туу түбүндө турушуп, Туубуз качпай турат деп, Кубат кылып урушуп» (С. О. 2. 144). «Туу жыгылды, кан өлдү. Тутушкандын баарысы туш-тушка качып жөнөштү» (С. О. 2. 89) деп айтылат. Тынчтык мезгилде да көп эл чогулган жыйын той-тамашаларда ар бир уруу, эл өз тууларынын айланасында топтолушкан. Әпосто ар бир элдин, этностун өз туусу болгону айтылат, ал муундан муунга өтүп келген. Мисалы,"},{"t":"v","l":["Бай Жакыптын кызыл туу,","Байкаганга сөзү бу.","Кыргыздын кыйла тобунан,","Алыс жерден калган туу.","Башкы атасы Бабыркан,","Андан калган ушул туу","","«Ногойдон калган кызыл туу оболотуп таштады»"]},{"t":"p","h":"<span class=\"pg\" data-n=\"32\">32<\/span>Әпосто Туу жөнүндө дагы төмөнкүдөй саптар кездешет."},{"t":"p","h":"Ак асаба, кызыл туу,"},{"t":"v","l":["Айгайлаган ызы-чуу.","Көк асаба, кызыл туу,","Көк жаңырган улуу чуу","","«Торала желек туу алып»","","Кызыл байрак туу менен","Кыйгылаган чуу менен","Кытайдын зору эр Конур"]},{"t":"p","h":"Эл намысына жарап, элдин камын ойлогон эр азаматтар да Тууга теңештирилген. Аны Манастын өзүнө карата айтылган төмөнкү саптардан баамдасак болот: «Бурутка бүткөн туу экен» (С. К. 1. 137). «Тукумдан бирөө чыгат деп, Сени туу кылып жүргөмүн» (С. К. 1. 114). Манас энциклопедиясы. П. 298-бет."}],"sub":[{"title":"Кыргыз Республикасы","b":25},{"title":"1-берене","b":40},{"title":"2-берене","b":42},{"title":"4-берене","b":46},{"title":"6-берене","b":48},{"title":"7-берене","b":51},{"title":"§ 6. КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЫЙЫК БЕЛГИЛЕРИ","b":62}],"section":"АДАМ, КООМ, МАМЛЕКЕТ ЖӨНҮНДӨ ТҮШҮНҮК ЖАНА КЫРГЫЗСТАН МАМЛЕКЕТТҮҮЛҮГҮНҮН ТАРЫХЫ","pages":[22,32]},{"title":"Кыргыз Республикасынын Мамлекеттик гимни","blocks":[{"t":"h3","h":"Кыргыз Республикасынын Мамлекеттик гимни"},{"t":"p","h":"Түрк элдери мурда душманга чабуул койгондо, алардын шаштысын кетирип, коркутуу үчүн «ур! ур!» деген катуу үн чыгарышкан. Мындай ураан чакыруу аскерлердин согуштук духун көтөрүүдө дагы чоң роль ойногон. Кийин бул салт орус жоокерлерине өтүп, алар «ураа!» деген үн чыгарышкан."},{"t":"p","h":"Ураан ат чабыштарда, эр сайыштарда, эр эништерде, улуттук оюндарда, уруулар аралык чабыштарда колдонулган."},{"t":"p","h":"Г. С. Загряжский мындай деген:"},{"t":"p","h":"«Ар бир уруу, уруктун өзүнүн уруулук аскер урааны болгон, ал көпчүлүк учурда уруунун аты менен аталган. Ушул жагынан кара кыргыздар башкалардан өзгөчө айырмаланып турат». Керек болсо, атасынын, чоң атасынын атын айтып да ураан чакырышкан."},{"t":"p","h":"Кыргыз ССРи түзүлүп, ал СССРдин курамындагы тең укуктуу союздук республика болот. 1946-жылы 1-апрелде Кыргыз ССРинин Жогорку советинин Президиумунун указы менен, Кыргыз ССРинин Мамлекеттик Гимнинин тексти жана музыкасы бекитилген. Сөзү: К. Маликов, Т. Сыдыкбеков, <span class=\"pg\" data-n=\"33\">33<\/span>М. Токобаев, А. Токомбаевдики. Музыкасы: В. Власов, А. Малдыбаев, В. Ференики."},{"t":"p","h":"Кыргыз Республикасынын Мамлекеттик гимни -— республиканын расмий символу болгон салтанаттуу ыры болуп эсептелет."},{"t":"p","h":"Мамлекеттин гимни 1992-жылы 18-декабрда Кыргыз Республикасынын Жогорку Кеңешинин токтому менен бекитилген."},{"t":"p","h":"Гимн Ж. Садыков, Ш. Кулуев тарабынан жазылган. Му-"},{"t":"v","l":["зыкасы Н. Давлесов менен К. Молдобасановдуку.","Гимнде кыргыз элинин, жеринин байлыгы, сулуулугу","жөнүндө маалымат берилип, анын мүнөздүү белгилерин,"]},{"t":"p","h":"езгечелуктерун ачуу менен Кыргыз жеринин тарыхы, атабабаларынан калган мурасы, бүгүнкү күнү жана келечеги даңазаланат."},{"t":"h3","h":"Кыргыз Республикасынын Мамлекеттик гимни"},{"t":"v","l":["Сөзү: Ж. Сыдыков, Ш. Кулуевдики.","Муз: Н. Давлесов, К. Молдобасановдуку.","Ак мөңгүлүү аска-зоолор, талаалар,","Әлибиздин жаны менен барабар.","Сансыз кылым Ала-Тоосун мекендеп,","Сактап келди биздин ата-бабалар.","Кайырма: Алгалай бер, кыргыз эл,","Азаттыктын жолунда.","Өркүндөй бер, өсө бер,","Өз тагдырың колуңда","Байыртадан бүткөн мүнөз элиме,","Досторуна даяр дилин берүүгө.","Бул ынтымак эл бирдигин ширетип,","Бейкуттукту берет кыргыз жерине.","Кайырма:","Аткарылып элдин үмүт-тилеги,","Желбиреди эркиндиктин желеги.","Бизге жеткен ата салтын, мурасын,","Ыйык сактап, урпактарга берели.","Кайырма:"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"34\">34<\/span>Кыргыз ССРнин Мамлекеттик гимни"},{"t":"v","l":["Сөзү: К. Маликов, С. Садыкбеков, М. Токтобаев, А. Токомбаевдики.","Музыкасы: В. Власов, А. Малдыбаев, В. Ференики.","","Азаттыкты кыргыз эңсеп турганда,","Ала-Тоого Октябрдын таңы аткан.","Улуу орус достук менен кол берип,","Ленин бизге бак-таалайга жол ачкан.","Кайырма:","Жаша, Кыргызстаным,","Ленин туусу колунда.","Алгалай бер, гүлдөй бер,","Коммунизм жолунда.","Әмгек, эрдик, күрөштөрдө такшалтып,","Таалай берген улуу совет калкына,","Жеңиштерден жеңиштерге алпарат,","Әлдин күчү – лениндик партия.","Кайырма:","Әл достугун болоттон бек ширетип,","Көп улуттан Союз курдук урагыс.","Жандай сүйүп даңктуу Ата-Мекенди,","Түбөлүккө коммунизм курабыз.","Кайырма:","","Кайталоо үчүн суроолор","% 1. Мамлекеттин ыйык белгилери, алар качан кабыл алынган, алардын","авторлору.","2. КРнын Мамлекеттик Туусунун пайда болуу тарыхынан эмнелерди","1 билдиң?","3. КРнын Мамлекеттик Гимнинде эмнелер тууралуу айтылган? Бир","куплетин айтып бер.","4. Кыргызстанда качан, кайсы облустардын, шаарлардын гербдери","биринчилерден болуп кабыл алынган?","5. КРнын Мамлекеттик Желеги жана Гербинин көрүнүшүн сүрөттөп,","айтып бер."]},{"t":"h3","h":"<span class=\"pg\" data-n=\"35\">35<\/span>П ГЛАВА"},{"t":"h3","h":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК БИЙЛИГИ ЖАНА САЯСЫЙ СИСТЕМАЛАРЫ"},{"t":"h3","h":"§ 78. МАМЛЕКЕТТИ БАШКАРУУНУН ФОРМАЛАРЫ"},{"t":"v","l":["Т үш үнүктөр:","‚ монархия","* парламенттик","* республика",". президенттик","абсолюттук, конституциялык","республикалар","* президенттик-парламенттик","* парламенттик монархиялар","Негизги даталар:"]},{"t":"p","h":"1776-жыл, 4-июнь – АКШнын көз карандысыздыгы. 1875-жылы Францияда Конституция кабыл алынып республика орногон."},{"t":"p","h":"1917-жыл, 1-сентябрь, 1917-ж. 25-октябрь Россияда республика жарыяланган."},{"t":"p","h":"1998-жылы Россияда Конституция кабыл алынганда үчүнчү жолу республика жарыяланган."},{"t":"p","h":"1970-жылы Иранда ислам революциясы болгон."},{"t":"p","h":"1268-жылы Англиядагы 1-чогулуш Парламент деп аталган. Тапшырма:"},{"t":"p","h":"* Мамлекет курулганга чейин кандай башкаруу органдары болгон деп ойлойсуң?"},{"t":"p","h":"* Мамлекет менен Республиканын ортосундагы айырмачылыктар (эрежелерине, белгилерине ж. б. токтолуу керек). Мамлекеттик башкаруу формалары – бул мамлекеттик жогорку укук органдарынын түзүлүшү."},{"t":"p","h":"Мамлекеттик башкаруунун формалары негизинен монархиялык жана республикалык болуп экиге бөлүнөт."},{"t":"h3","h":"Монархиялык башкаруу формасы"},{"t":"p","h":"Монархия грек тилинен которгондо «жеке бийлик» «жалгыз башкаруучу» дегенди билдирет. Бул башкаруунун эн ба-"},{"t":"h3","h":"<span class=\"pg\" data-n=\"36\">36<\/span>Башкаруу формалары"},{"t":"h3","h":"Башкаруу формалары"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Монархия<\/td><td>Республика<\/td><\/tr><tr><td>Абсолюттук<\/td><td>Конституция<\/td><td>Парламенттик<\/td><td>Президенттик<\/td><\/tr><tr><td>Президенттик<\/td><\/tr><tr><td>Дуалисттик<\/td><td>Парламенттик<\/td><td>парламенттик<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"йыркы формасы болуп эсептелет. Монарх башкарган мамлекетти Аристотель Монархия деп атаганы тарыхта белгилүү. Тарыхта монархиянын ар түрдүү формалары бар. Алар абсолюттук, конституциялык жана парламенттик монархиялар. Байыркы мезгилде өзгөчө чыгыш өлкөлөрүндө монархиянын формалары «деспотия» деп аталган. Анткени монархтын бийлиги чексиз болуп, кудайдын бийлиги менен теңештирилген. Орто кылымдардагы монархтарга толук бийлик тиешелүү болгон. Мамлекеттик бийликти монархтар король, падыша, император, хандар, султан, эмир ж. б. жүргүзүшкөн."},{"t":"p","h":"Африкада монархиялык мамлекеттен үчөө: Лесото, Марокко, Свазиленд жана Океанияда Тонга."},{"t":"p","h":"Монархтын бийлигин эч ким, эч нерсе чектей албаса, бул абсолюттук монархия болуп эсептелет. Алардын бийлиги мураска калтырылат. Мындай абсолюттук монархия сакталган өлкөлөргө Азиядан жети өлкө: Бахрейн, Бруней, Катар, Кувейт, ОАӘ, Оман жана Сауд Аравиясы кирет."},{"t":"p","h":"Конституциялык монархия алгачкы жолу Англияда пайда болгон. Бул жерде азыркы мезгилге чейин кагаз бетине түшүрүлгөн конституциясы жок. 1689-жылы парламент конституциялык монархиянын режимин бекемдеген укуктар жөнүндө Билль (мыйзам) кабыл алган. Анда мыйзамдарды токтотуу, алып таштоо жана салыктарды аныктоодо королдун бийлиги Конституцияда (эрежелер аркылуу) чектелген."},{"t":"p","h":"<span class=\"pg\" data-n=\"37\">37<\/span>Конституциялык монархияда бийликти бөлүштүрүү жүрөт жана мыйзам чыгаруу бийлиги аткаруучу бийликтен бөлүнөт."},{"t":"p","h":"Азыркы учурда Конституциялык монархияда, монарх эрктүүлүктүн жана элдердин биримдигинин символу болуп падышалык кылат. Бирок мамлекетти башкарбайт. Өлкөнү башкарууну, парламент тарабынан түзүлгөн өкмөт жана парламент ишке ашырат."},{"t":"p","h":"Европа еолкерунде Конституциялык монархия түзүлүшү он эки елкеде Англия, Бельгия, Андорра, Ватикан, Испания, Дания, Норвегия, Швеция, Лихтенштейн, Люксембург, Монако, Нидерландияда кездешет. Азияда болсо Бутан, Иордания, Камбоджа, Малайзия, Непал, Тайланд, Японияда орнотулган."},{"t":"p","h":"Конституциялык монархиялар эки түрдүү: дуалисттик жана парламенттик функцияларды аткарышат."},{"t":"p","h":"Дуалисттик (кош) монархия артта калган өлкөлөргө тиешелүү болуп феодализмдин калдыктары мурдагыдай эле зор роль ойнойт. Ал негизинен начарлап жаткан феодализм менен күч алып жаткан буржуазиянын ортосундагы компромисс болуп эсептелет. Мында, феодалдык монархия жана буржуазиялык парламент өз ара мамлекеттик бийликти бөлүштүрүшөт да монарх феодалдардын, парламент буржуазиянын жана калктын башка катмарларынын кызыкчылыгын кездөйт. Буржуазиялык мамилелердин орношу менен дуалисттик монархиядан парламенттик монархияга же республикага өсүп, жетет."},{"t":"p","h":"Парламенттик монархияда парламент эл тарабынан шайланып, мыйзам кабыл алуу укугуна ээ болот. Анда монархтын бийлиги чектелет. Мыйзам чыгаруучу бийлик парламентке, ал эми аткаруучу бийлик өкмөткө таандык болуп парламент алдында жоопкерчиликте болот. Англия XVIII кылымдан бери парламенттик Монархия болуп эсептелет. Королева мыйзам кабыл алууга кийлигишпейт."},{"t":"h3","h":"Республикалык башкаруу формасы"},{"t":"p","h":"Бул башкаруунун эски формаларынын бири. Республикалык башкаруу формасында бийликтин жогорку органдары шайлануу жолу менен бийликке келет же жалпы улуттук өкүлчүлүк уюмдары тарабынан түзүлөт. Монархиялык башкаруу формасынан Республикалык башкаруу формасы өкүлчүлүк органдарды түзүүдө демократиялуулугу менен айырмаланат."},{"t":"p","h":"<span class=\"pg\" data-n=\"38\">38<\/span>Республика (лат. сөзүнөн коомдук иш, мамлекет) – деп мамлекеттик жогорку органдарды белгилүү мөөнөткө шайланган адамдар башкарган мамлекетти айтабыз. Республикалык башкаруу мамлекеттерде, ар башка мезгилде ар кандай жолдор менен орногон. Байыркы Афины жана Рим, Улуу Новгород жана Венеция мамлекеттери дагы республикалык башкарууну башынан өткөргөн. Бирок чыныгы республикалык башкаруу формасы феодалдык коомдон буржуазиялык коомго өтүү мезгилинде пайда болгон."},{"t":"p","h":"Жаңы доордогу алгачкы Республика болуп АКШ эсептелет. Анда Америкалык колониялар Англия менен болгон боштондук үчүн күрөштө жеңип чыгып, 1776-жылы 4-июнда көз карандысыздыкка ээ болгондо республика орногон."},{"t":"p","h":"Кийин 1787-жылы 17-сентябрда кабыл алынган Конституцияда Республика сакталып калган. Көз карандысыздык декларациясынын автору Томас Джефферсон болгон."},{"t":"p","h":"Францияда биринчи Республика 1792-жылы жарыяланган. Бирок башкаруунун Республика формасы толугу менен 1804-жылы жана 1852-жылы 2-декабрда монархия эки жолу калыбына келтирилгенден кийин, 1875-жылы Конституциянын кабыл алынышы менен орногон. Россияда Республика 1917-жылы 1-сентябрда убактылуу өкмөттүн декрети менен жарыяланган. Бирок ал узак жашаган эмес. 1917-жылы 26-октябрда (7-ноябрь) Улуу Октябрь Революциясынын жеңишинен кийин Совет Республикасы орногон. 1998-жылы кабыл алынган Россиядагы жаңы конституция Россияда үчүнчү жолу Республиканы жарыялаган."},{"t":"v","l":["Республиканын түрлөрү.","Республиканын негизги үч түрү бар:","* Парламенттик башкаруудагы","* Президенттик башкаруудагы"]},{"t":"p","h":"* Президенттик-Парламенттик (аралаш) башкаруудагы республикалар."},{"t":"p","h":"Парламенттик республика. 1265-жылы Англияда биринчи жолу чогулуш чакырылган. Ал Парламент деп аталып Француздун «Парле» – сүйлөө деген сөзүнөн келип чыккан. ХУ кылымда парламент лорддор жана общиналар палатасына бөлүнгөн. Ошол сыяктуу жыйынга 1802-жылы Францияда дин кызматкерлеринин, дворяндардын, шаардыктардын өкүлдөрү чогулуп, Генералдык штаттар деп аталган (Филип Ту)."},{"t":"p","h":"<span class=\"pg\" data-n=\"39\">39<\/span>1549-жылы февралда Иван ТУ биринчи Земстволук собор чакырып, ага феодалдардын ар турдуу катмарларынан кирген."},{"t":"p","h":"Парламенттик республикада парламент устемдук кылат. Бийликтин Жогорку органы болуп эл тарабынан шайланган, бийликтин өкүлчүлүктүү органы парламент эсептелет."},{"t":"p","h":"Парламенттик республиканын эң башкы белгилеринен деп шайлоодо парламенттеги көпчүлүк орунду жеңип алган саясый партиядан өкмөт башчысынын (премьер-министр же канцлер) шайланышын жана жаңы өкмөттүн түзүлүшүн, ошондой эле өкмөттүн парламент алдында саясый жоопкерчиликте болушун айтсак болот. Алар бардык расмий адамдарды, саясый чечимдерди кабыл алып, мыйзам чыгарып аларды иш жүзүнө ашыруу үчүн шайланат. Конституциялык көзөмөл органдарын ж. б. мамлекеттик институттарды дайындайт. Парламенттик республикада дагы президенттик кызмат болуп калышы ыктымал. Анда президентти парламент шайлайт. Президент мамлекеттин башчысы болуп эсептелет. Бирок өкмөт башчысы боло албайт. Президент өкүлчүлүк жана кеңешчилик ишти аткарат. Парламенттин ишинин конституциялык нормада болушуна көз салат."},{"t":"p","h":"Парламенттик Республикага Германия, Греция, Италия, Венгрия, Чехия, Англия, Израил, Швеция, Жаңы Зеландия Австрия, Ирландия, Индия, Швейцария ж. б. кирет."},{"t":"p","h":"2010-жылы кабыл алынган Конституцияда Кыргыз Республикасы Парламенттик деп жарыяланган."},{"t":"p","h":"Президенттик Республикада эл эки жогорку органды: жогорку мыйзам чыгаруу жана көзөмөлдөөчү орган болгон парламентти жана мамлекет менен аткаруучу бийликтин башчысы болгон Президентти шайлашат. Президенттик республикада көбүнчө вице-президент да болот. Президент мамлекеттин жана аткаруучу бийликтин башчысынын кызматын тең аткаргандыктан, премьер-министрдин кызмат орду жок. Мыйзам чыгаруучу, аткаруучу жана соттук бийликтердин аткарган иштери жана түзүлүшү так бөлүштүрүлөт. Президент министрлерди ж. б. Өкмөт мүчөлөрүн дайындайт. Ар бир министр президентке баш ийип, парламенттин алдында эмес, Президенттин алдында жооптуу. Президенттик республикада мыйзам чыгаруучу бийлик «конгресс» деп аталып, парламенттик республикага караганда чоң укуктук статуска ээ. Аны таркатууга болбойт. Президенттик республи-"},{"t":"h3","h":"<span class=\"pg\" data-n=\"40\">40<\/span>Республика"},{"t":"raw","h":"<h4 class=\"mk\">Парламенттик Парламенттин үстөмдүгү орнойт<\/h4>"},{"t":"v","l":["Президенттик","Президент – мамлекеттин жана","аткаруу бийлигинин башчысы"]},{"t":"p","h":"каларга АКШ, Бразилия, Аргентина жана мурдагы советтик өлкөлөрдүн көпчүлүгү кирет."},{"t":"p","h":"Президенттик-парламенттик (аралаш) республикаларда президенттик жана парламенттик республикалардын белгилери айкалышып турат. Башкаруунун бул формасында президент бир катар конституциялык укуктарга ээ. Көпчүлүк өлкөлөрдө президент эл тарабынан шайланат. Президент өкмөт башчы боло албайт. Бирок өкмөт президенттин алдында дагы, парламенттин алдында дагы жоопкерчиликтүү. Президенттик-парламенттик республикага Франция, Финляндия, Португалия ж.б. мамлекеттер кирет."},{"t":"p","h":"Башкаруу формаларынын бири теократия болуп эсептелет. Мамлекеттик бийлик духовенствонун (дин кызматчылар) жана чиркөө башчыларынын колуна топтолгон башкаруунун формасы «теократия» деп аталат. «Теократия» грек тилинен которгондо кудай, бийлик дегенди билдирет."},{"t":"p","h":"Теократиялык башкаруу орто кылымдарда Омейяд менен Аббасийлер халифатында жана 1870-жылы Италия бириккенге чейин Пап дубанында болгон. Азыркы кезде Папа Римдик – католиктик чиркөөсүнүн жетекчиси болуу менен Ватикан мамлекетинин да башчысы болуп саналат."},{"t":"p","h":"Иранда 1970-жылы Ислам революциясы болуп Аятолла Паша Хомейни баш болгон дин кызматкерлери бийликке келген."},{"t":"p","h":"Теократиялык башкаруу – жарандардын жеке жана коомдук турмушунун бардык жактарын катуу тартипке салат."},{"t":"p","h":"Диний майрамдарга жана шаан шөкөттөргө мамлекеттик статус берилет. Бул Ислам мамлекеттери Иран, Пакистан, Ирак, Сирияга, ж.б. таандык."},{"t":"p","h":"Кайталоо үчүн суроолор %Ф 1. Мамлекеттин башкаруу формалары тууралуу эмнелерди билдиң?"},{"t":"p","h":"2. Абсолюттук монархия менен конституциялык монархиянын айырма- 25 сын салыштыр жана аларга кайсы мамлекеттер кирээрин айтып бер."},{"t":"p","h":"<span class=\"pg\" data-n=\"41\">41<\/span>3. Республикалык башкаруу формасы жана анын өнүгүү тарыхы туура-"},{"t":"p","h":"луу эмнени билдиң?"},{"t":"p","h":"4. Башкаруунун теократиялык формасынын кандай өзгөчөлүктөрү"},{"t":"p","h":"бар?"},{"t":"p","h":"5.Башкаруунун парламенттик, президенттик жана президенттик-парла-"},{"t":"p","h":"менттик формаларын салыштыр."}],"sub":[{"title":"Кыргыз Республикасынын Мамлекеттик гимни","b":11},{"title":"Кыргыз ССРнин Мамлекеттик гимни","b":13},{"title":"П ГЛАВА","b":15},{"title":"Монархиялык башкаруу формасы","b":27},{"title":"Башкаруу формалары","b":29},{"title":"Республикалык башкаруу формасы","b":42},{"title":"Республика","b":57}],"section":"АДАМ, КООМ, МАМЛЕКЕТ ЖӨНҮНДӨ ТҮШҮНҮК ЖАНА КЫРГЫЗСТАН МАМЛЕКЕТТҮҮЛҮГҮНҮН ТАРЫХЫ","pages":[33,41]},{"title":"§ 9. ШАЙЛОО СИСТЕМАЛАРЫ","blocks":[{"t":"h3","h":"§ 9. ШАЙЛОО СИСТЕМАЛАРЫ"},{"t":"v","l":["Т үш үн уктер:",". Шайлоо системасы.","Мажоритардык система.","","Тапшырма:","* Пропорциялык система.",". Аралаш система."]},{"t":"p","h":". Шайлоо деген эмне, ал кандай максатта пайдаланылат?. «Элдин кандай добуш бергендиги эмес, добуштардын кандай эсептелгени маанилүү». И. В. Сталиндин (РКП(б)нын генералдык катчысы 1922-1953-жж.) бул сөзүн Кыргызстандагы болуп өткөн шайлоолор менен байланыштырып өз пикириңди айтып бер."},{"t":"p","h":". чулуктун мажоритардык системасында ким абсолюттук кепчулук добушту (50% +1) алса, ал шайланды деп эсептелет. Бирок добуш алууда, абсолюттук көпчүлүк дайым эле мүмкүн болбогондуктан добуш берүү эки турда өткөрүлөт. Әкинчи турга эң көп добуш алган эки талапкер чыгат."},{"t":"p","h":"2. Салыштырмалуу көпчүлүктүн мажоритардык системасында, шайлоочулардын добушунун салыштырмалуу көпчүлүгүн алган тараптар жеңүүчү болуп таанылат."},{"t":"p","h":"3. Квалификацияланган көпчүлүктүн мажоритардык системасында жеңүүчү алдын ала белгиленген добуштардын көбүнө – 2/8, 3/4, 4/5 бөлүгүнө ээ болууга тийиш."},{"t":"p","h":"Пропорциялык системада (Бразилияда, Финляндияда, Швецияда, Нидерландияда ж. б. колдонулат) бүтүндөй өлкө бир шайлоо округу болот же көп мандаттуу чоң округдар түзүлөт. Шайлоочулар талапкерлерге эмес партиялар үчүн добуш беришет. Талапкерлер жалаң гана саясый партиялар тарабынан көрсөтүлөт. (Партиялардын ар бири талапкерлердин тизмесин көрсөтүшөт.) Ал эми шайлоочу өзү тандаган партиянын тизмеси үчүн добуш берет."},{"t":"p","h":"Кыргызстанда 2007-жылы 21-октябрдагы референдум аркылуу өзгөртүлгөн шайлоо кодексинде, шайлоолорду пропорциялык система боюнча өткөрүү каралган."},{"t":"p","h":"Аралаш системасында (Россия, Тайван, Грузия, ФРГ). Мажоритардык жана пропорциялык системалар айкалышып аралаш пайдаланылат. Шайлоочулар өз округунун өкүлү үчүн да, партиялар үчүн да добуш берет. Демек парламентте эки түрдөгү: өз округунан тике шайланган жана партиялык тизме боюнча шайланган өкүлдөрү болот."},{"t":"p","h":"<span class=\"pg\" data-n=\"43\">43<\/span>Кыргызстандагы шайлоо системасы Россия империясынын курамына кошулганга чейин, кыргыздарда каада-салт укугунун ченемдерине ылайык башкаруу жана сот иштерин, ар бир уруунун топ башчылары шайлаган бийлер аткарган. Мындай шайлоо уруу жыйынында ачык түрдө өткөрүлгөн."},{"t":"p","h":"Кыргызстан Россия империясына кошулгандан кийин, колониялык бийлик бир катар админстративдик реформаларды жүргүзгөн."},{"t":"p","h":"Калкы көчмөн райондордо уруу башчыларын, ал эми отурукташкан райондордо айыл-кыштак жана волость бийлигине жүз башы, миң башыларды, болуштарды шайлоо өткөрүлө баштаган. Уезддер менен облустардын жетекчилерин падышанын колониялык администрациясы дайындап турган. Уезддерди полковниктер, губернияларды генералдар башкарып, бүтүндөй Түркстан чөлкөмүндө император өзү дайындаган Генерал-губернатор бийлик жүргүзгөн. Падышалык режимдин жергиликтүү калкка карата империялык мыйзамдары бир кыйла катаалдашкан. Мисалы, 1907-ж. шайлоо мыйзамына ылайык Түркстандын калкы мамлекеттик думага (парламентке) өкүл шайлоо укугунан ажыратылган. Жергиликтүү эл волосттордун башкаруучулары (болуштар) менен элдик сотторду шайлоого гана катыша алган."},{"t":"p","h":"1917-жылы Октябрь революциясы жеңгенден кийин, СССРдин Конституциясында адам укугунан жогору турган эч нерсе жок деп жазылганы менен ал укуктар абдан кеңири бузулуп келген."},{"t":"p","h":"1929-жылы апрель айында Кыргыз АССРинин биринчи Конституциясы кабыл алынган. Бул Конституция башка советтик конституциялардай эле таптык негизде түзүлгөн. Анда Советтерге шайлоо системасы жана тартиби, жарандардын негизги укуктары жана милдеттери аныкталып, тең укуксуз шайлоо системасы киргизилген. Ага ылайык калктын айрым катмары бийлер, манаптар, кулактар, дин кызматчылары ж. б. шайлоо укугунан ажыратылган."},{"t":"p","h":"1987-жылы март айында Кыргыз ССРнин Конституциясы кабыл алынган. Мында мурунку Конституцияда киргизилген шайлоо системасындагы чектөөлөр жана теңсиздиктер жоюлуп бардык жарандар шайлоого жана шайланууга тең укук алышат."},{"t":"p","h":"<span class=\"pg\" data-n=\"44\">44<\/span>1991-жылы декабрда СССР кулагандан кийин Жогорку Кеңеш Кыргыз Республикасынын көз карандысыздыгы жөнүндө декларация кабыл алган. Ал эми 1998-жылы майда Конституция кабыл алынып, элге шайлоо укугу мыйзамдуу түрдө берилген. Шайлоо болсо бийликтин тынч жол менен бир колдон башка бир колго өткөрүлүп берилишине өбөлгө түзөт."},{"t":"p","h":"Кыргыз Республикасынын шайлоо кодексинде жана башка мыйзамдарда шайлоо өткөрүү тартиби менен эрежелери берилген."},{"t":"p","h":"Бул мыйзамдарда, Борбордук шайлоо комиссиясын түзүү үчүн укуктук негиз түптөлгөн. Ошондой эле:"},{"t":"p","h":"* Жарандардын шайлоо укуктары түшүндүрүлгөн."},{"t":"p","h":"Шайлоо комиссияларын түзүү тартиби жана милдеттери көрсөтүлгөн."},{"t":"p","h":"* Талапкерлерге коюлуучу талаптар, аларды көрсөтүү жана каттоо процесси аныкталган."},{"t":"p","h":"* Участкалык шайлоо комиссияларынын шайлоолорду уюштуруу жана өткөрүү боюнча милдеттери көрсөтүлгөн."},{"t":"p","h":"+ Шайлоочулардын тизмелерин түзүү жана тактоо тартиби берилген ж. б."},{"t":"v","l":["Кайталоо үчүн суроолор","% 1. Шайлоо системасы жана анын негизги типтери."]},{"t":"p","h":"2. Мажоритардык системанын бөлүнүштөрү жана өзгөчөлүктөрү. “ З. Кыргызстандын шайлоо системасынын Октябрь революциясына"},{"t":"p","h":"чейинки жана кийинки өнүгүүсү (салыштыр)."},{"t":"p","h":"4. 1929—1937-жылдары кабыл алынган конституцияларды салыш-"},{"t":"p","h":"тырып өзгөчөлүктөрүн белгиле."},{"t":"h3","h":"§ 10 ӘЛДИК ДОБУШ БЕРҮҮ"},{"t":"p","h":"* Шайлоо принциптери. * Референдум."},{"t":"p","h":"Тапшырма:"},{"t":"p","h":"*АКШнын президенти Джон Кеннеди (1960-1963). «Демократиялык коомдогу бир эле шайлоочунун маалымсыз калышы жалпы элдин коопсуздугуна доо кетирет» деп айткан. Кыргызстанда бардык шайлоочуларга маалымат жетеби? Өз пикиринди айтып бер."},{"t":"p","h":"<span class=\"pg\" data-n=\"45\">45<\/span>Шайлоого эмне үчүн элдер толук катышпайт?"},{"t":"p","h":". Шайлоочулардын шайлоого аң-сезимдүү түрдө толук катышуусу үчүн кандай иштерди аткаруу зарыл?"},{"t":"p","h":"Шайлоо системасы жана элдик добуш берүүнүн аныктамаларын окуп, өзгөчөлүктөрүн салыштыр."},{"t":"p","h":"Әлдик добуш берүү – бул парламентке өз өкүлдөрүн жана бийликтин аткаруу органдарына жетекчилерди тандоо үчүн элдин эркин билдирүү процесси."},{"t":"p","h":"Демократиялык өлкөдө эркин, жалпы, тике жана ачык шайлоолор жашыруун добуш берүү жолу менен жүргүзүлөт. Шайлоо адилеттүү болуш үчүн, шайлоонун өзгөчө формасы уюштурулуп, бир нече талапкер катышып, альтернативалык болуш керек."},{"t":"p","h":"1948-жылы 14 мамлекеттин ар түрдүү саясый системасынын жана региондорунун өкүлдөрү БУУ тарабынан жактырылган адам укугунун Жалпы Декларациясына кол коюш кан. Анда «Әлдин эрки өкмөттүк бийликтин негизи болуусу керек. Бул эрк бурмаланбаган жалпы жана тең укуктуу шайлоолордо, жашыруун же башка түрүн эркин добуш берүүчү шайлоонун формасында өзүн көрсөтүүсү керек» – деп жазылган. Республикадагы бийлик органдары – мамлекет башчысы (президент), парламент, өзүн-өзү башкаруучу органдар, шайлоо жолу аркылуу түзүлөт. Шайлоо аркылуу эл өз өкүлдөрүнө элдин атынан сүйлөөгө укук берет. Аткаруу бийлигинин органдарын мамлекет башчысы же конституцияга ылайык парламент эле дайындайт."},{"t":"p","h":"Улуттук шайлоолор бүткүл өлкө боюнча жана жергиликтүү шайлоо органдарын шайлоодо өткөрүлөт. Шайлоо активдүү (шайлоочулар) жана пассивдүү (шайлануучу) болуп бөлүнөт."},{"t":"h3","h":"Шайлоо принциптери"},{"t":"p","h":"Демократиялык дүйнөнүн шайлоо системасы жалпы шайлоо, эркин шайлоо, тең шайлоо, түз шайлоо, жашыруун шайлоо принциптерине таянат."},{"t":"p","h":"Жалпы шайлоо: Улутуна, диний ишенимине, жынысына, ден соолугуна карабастан, жашы жеткен бардык жарандар шайлоо укугуна ээ болушат."},{"t":"p","h":"Әркин шайлоо: Бул шайлоочу шайлоого катышабы же жокпу жана кайсы талапкерге добуш берерин өзү чечет де-"},{"t":"h3","h":"<span class=\"pg\" data-n=\"46\">46<\/span>Шайлоо принциптери"},{"t":"h3","h":"Тике шайлоо укугу"},{"t":"raw","h":"<h4 class=\"mk\">Эркин шайлоо Тен шайлоо<\/h4>"},{"t":"h3","h":"Жалпы"},{"t":"v","l":["шайлоо","Шайлоо","","Жашыруун","шайлоо"]},{"t":"p","h":"генди билдирет жана кайсы бир талапкерге зордоп добуш бердире албайт. Эч ким шайлоочуну зордук менен шайлоого алып барбайт. Бирок бир катар елкелерде шайлоочунун шайлоого катыша турган юридикалык милдеттери каралган. Италияда добуш беруу жарандык парз болуп саналат. Грецияда жана Турцияда эркинен ажыратууга чейин барышат, Белгияда добуш берүүгө келбесе айып салынат."},{"t":"p","h":"Тең шайлоо: тең добуш берүү принциби бул – бир адам бир добушка ээ дегенди түшүндүрөт. Кыргызстанда ар бир шайлоо округу боюнча шайлоочу бирден гана добушка ээ. Германияда парламенттик шайлоодо ар бир шайлоочу экиден добушка ээ. Баварияда жергиликтүү өзүн-өзү башкаруу органдарынын өкүлчүлүгүнө шайлоодо ар бир шайлоочу үчтөн добушка ээ болот."},{"t":"p","h":"Тике шайлоо укугу: Жарандардын өз жетекчилерине жана депутаттыкка талапкерлерге өкүлдөрү аркылуу эмес, өздөрү түз добуш берген процесс. Бул эл кайсы талапкерди колдосо ошого түз добуш берет дегенди билдирет. Бирок кээ бир учурда элдин өкүлдөрү болгон депутаттар эле шайлашат. Мисалы, шаардын мэрин шаардык кеңештин депутаттары шайлайт ж.б."},{"t":"p","h":"<span class=\"pg\" data-n=\"47\">47<\/span>Жашыруун шайлоо: Шайлоочулардын өздөрү кимди тандашын эч кимге билгизбей добуш берүүгө мүмкүнчүлүк алышы."},{"t":"p","h":"Мыйзам тарабынан добуш берүү укугуна ээ болгон адам «шайлоочу» деп аталат. Ар кандай өлкөлөрдүн конституцияларында көпчүлүк учурда шайлоочулардын жаш курагы аныкталган. Парламент аралык изилдөө жүргүзүлүп, 150 мамлекеттин 109да активдүү шайлоо укугуна 18 жаштан өйдө, кээ бир мамлекеттерде – Бразилия, Куба, Иран, Никарагуада – 16 жаштан баштап шайлоо укугуна ээ болоору аныкталган. Кыргыз Республикасынын Конституциясына ылайык шайлоого 18 жашка толгон жарандар катыша алат."},{"t":"p","h":"Пассивдүү шайлоо укугу үчүн жаш куракты чектөө бир кыйла жогору. Мисалы, Италияда президенттикке 50 жаштан өйдө шайлана алышат. Кыргызстанда 35 жаштан кем эмес. Жашты чектөөнүн себеби, мамлекетти башкарууда саясый жактан жетилген, турмуштук ж. б. маселелерди чечүүдө тажрыйбасы көп адамга ишеним көрсөтүү керек."},{"t":"p","h":"Жогорку жаш курак көпчүлүк өлкөлөрдө чектелбейт. Мисалы, Германия, АКШ, Индияны алсак болот. Бул өлкөлөрдө мамлекеттик жетекчиликти акыркы он жылдын ичинде 10-80 жашка чыккан адамдар ээлеп келишкен. Кыргызстанда Т0 жаштан өткөн адам Президент боло албайт."},{"t":"p","h":"Талапкерлерди көрсөтүү жана анын түрлөрү Бул дагы шайлоо процессинин маанилүү бөлүгү. Ушул учурда президент, депутат жана башка шайлануучу адамдардын тобу аныкталат. Талапкерлерди көрсөтүүнүн бир нече түрү бар:"},{"t":"p","h":"а) өзүн-өзү көрсөтүү;"},{"t":"p","h":"б) шайлоочулар тобунун көрсөтүүсү;"},{"t":"p","h":"в) саясый партиялардын же башка коомдук уюмдардын көрсөтүүсү."},{"t":"p","h":"Референдум. Жарандык коом менен мамлекеттин ортосундагы тике байланыш референдум аркылуу ишке ашырылат. Референдум. латын тилинде «кабардар кылуу» дегенди билдирет. Мамлекеттик же коомдук кандайдыр бир маанилүү маселени чечүү үчүн элдин добуш бериши, калктын кароосуна коюу дегенди түшүндүрөт. Жалпы улуттук референдум өткөрүүнү кабыл алуу жана дайындоо мамлекет башчысына же Парламентке <span class=\"pg\" data-n=\"48\">48<\/span>таандык. Кыргызстанда мамлекеттик иштерди чечүү боюнча референдумду Президент же Жогорку Кеңеш дайындайт."},{"t":"v","l":["Кайталоо үчүн суроолор","% 1. Элдик добуш берүүнүн мааниси эмнеде?","2. Демократиялык өлкөлөрдөгү шайлоо принциптери..","З. Шайлоонун түрлөрү жана аларда жаш куракты чектөө.","4. Референдум тууралуу эмнелерди билдиң?"]},{"t":"p","h":"5. Кыргызстанда өткөрүлгөн шайлоолордун оң жана терс жактары-"},{"t":"p","h":"нан мисал келтир."}],"sub":[{"title":"Шайлоо системасы","b":8},{"title":"§ 10 ӘЛДИК ДОБУШ БЕРҮҮ","b":37},{"title":"Шайлоо принциптери","b":48},{"title":"Шайлоо принциптери","b":52},{"title":"Жалпы","b":55}],"section":"АДАМ, КООМ, МАМЛЕКЕТ ЖӨНҮНДӨ ТҮШҮНҮК ЖАНА КЫРГЫЗСТАН МАМЛЕКЕТТҮҮЛҮГҮНҮН ТАРЫХЫ","pages":[42,48]},{"title":"§ 11. МАМЛЕКЕТТИК ОРГАНДАР. КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ПРЕЗИДЕНТИ","blocks":[{"t":"h3","h":"§ 11. МАМЛЕКЕТТИК ОРГАНДАР. КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ПРЕЗИДЕНТИ"},{"t":"v","l":["Т үш үнүктөр:","* Мамлекеттик органдар жана мекемелер.","* Президенттин укуктары.","* Президентти шайлоо.","","Тапшырма:","Адилеттүү болуп турса бек киши,","Ошончолук жыргал бо kxlysi9xidiWOdUZMigZCFFjc2XAGm2BEooWv6yXXb8XZwD0PC83n6ncDsWq667ZPZLaiScsv6oH2+OaUbMgAA=","w":640,"ht":196,"cap":"<span class=\"pg\" data-n=\"49\">49<\/span>Ак үй. каттоодон өтөт; же болбосо адам материалдык же моралдык"},{"t":"p","h":"жактан чыгаша болсо, сотко кайрылат ж. б. Мамлекет өлкөнү коомчулуктун өзүнүн органдары, мекемелер системалары аркылуу башкарат. Мамлекеттик орган – бул бийлик чечимдерин кабыл алууга укук берилген адам же адамдардын уюшулган тобу (мисалы, парламент, президент, өкмөт, сот, министр). Мамлекеттик мекеме – бул уюшулган адамдардын тобу, алар бийлик чечимдерин кабыл албайт, бирок калкка тейлөө кызматын көргөзөт (мамлекеттик мектептер, ооруканалар)."},{"t":"v","l":["Мамлекеттик органдардын түрлөрү:","* Президент.",". Мыйзам чыгаруучу бийлик органдары.",". Аткаруучу бийлик органдары.",". Сот бийлиги."]},{"t":"p","h":"«Президент» латын сөзүнөн алынган. Сөзмө сөз которгондо «алдыда отуруучу» деп которулат. Кыргыз Республикасынын Президенти мамлекеттин башчысы болуп саналат, элдин бийлигинин жана мамлекеттик бийликтин биримдигин көрсөтүп турат. Президент КРнын жарандары тарабынан 6 жылга шайланат. Бир адам катары менен 2 мөөнөткө президент болуп шайлана албайт. Президент болуп 85 жаштан 70 жашка чейинки мамлекеттик тилди билген жана республикада 15 жылдан кем эмес жашаган КРнын жараны шайлана алат. Президенттин кызмат ордуна талапкерлердин саны чектелбейт. 30 миңден кем эмес шайлоочунун кол тамгасын топтогон адам Президенттикке талапкер болуп каттала алат. Президент кызматына киришээрде Кыргызстандын <span class=\"pg\" data-n=\"50\">50<\/span>элине ант берет. Президент өз ыйгарым укуктарын жүзөгө ашырган мезгилде саясый партияга мүчөлүгүн жана ага байланыштуу иш аракеттерин токтото турат."},{"t":"h3","h":"Кыргыз Республикасынын Президентин шайлоо"},{"t":"p","h":"Кылмыш жасагандыгы үчүн соттолгон, анысы жоюлбаган же мыйзамга ылайык алып салынбаган жаран Президент болуп шайлана албайт. Кыргыз Республикасынын Президенти жарандар тарабынан жашыруун, түз жана тең добуш берүү менен шайланат. Шайлоого бардык шайлоочулар- Дын элүү проценттен ашыгы катышканда президентти шайлоо өткөрүлдү деп эсептелет. Ал эми шайлоочулардын жарымынан көбүнүн добушун алган талапкер Кыргыз Республикасынын Президенти болуп шайланат."},{"t":"p","h":"Кыргыз Республикасынын Президентинин ыйгарым укуктары"},{"t":"p","h":"Президент Жогорку Кеңешке жана жергиликтүү кеңештерге шайлоолорду дайындайт."},{"t":"p","h":"Мыйзамдарга кол коёт жана элге жарыялайт, мыйзамдарды каршы пикири менен Жогорку Кеңешке кайтарат."},{"t":"p","h":"Зарыл учурларда Жогорку Кеңештин кезексиз жыйналыштарын чакырууга жана каралуучу маселелерди аныктоого укуктуу."},{"t":"p","h":"ЖКнын жыйналыштарында чыгып сүйлөөгө укуктуу. Жогорку соттун судьяларынын кызматына шайлоо үчүн талапкерлерди Судьяларды тандоо боюнча кеңештин сунушу боюнча Жогорку Кеңешке сунуштайт. Аларды кызматынан бошотуу үчүн да Жогорку Кеңешке сунуштайт."},{"t":"p","h":"Президент Судьяларды тандоо боюнча кеңештин сунушу боюнча жергиликтүү соттордун судьяларын дайындайт жана кызматынан бошотот."},{"t":"p","h":"Жогорку Кеңештин макулдугу менен башкы прокурорду дайындайт жана мыйзам тартибинде кызматтан бошотот."},{"t":"p","h":"Башкы прокурордун сунушу менен анын орун басарларын дайындайт жана кызматтан бошотот."},{"t":"p","h":"Өкмөт мүчөлөрүн – коргоо жана улуттук коопсуздук маселелерин тескеген мамлекеттик органдардын жетекчилерин, алардын орун басарларын дайындайт жана кызматтан бошотот ж.б."},{"t":"p","h":"<span class=\"pg\" data-n=\"51\">51<\/span>Улуттук банктын төрагасынын кызматына шайлоо үчүн талапкерди Жогорку Кеңешке сунуштайт."},{"t":"p","h":"Улуттук банктын төрагасынын сунушу боюнча анын орун басарларын, башкарма мүчөлөрүн кызматка дайындайт жана бошотот."},{"t":"p","h":"Әсептөө палатасынын Жогорку Кеңеш тарабынан шайланган мүчөлөрүнүн ичинен анын төрагасын кызматка дайындайт жана бошотот."},{"t":"p","h":"Сүйлөшүүлөрдү жүргүзөт жана премьер-министр менен макулдашуу аркылуу эл аралык келишимдерге кол коёт."},{"t":"p","h":"Президент Кыргыз Республикасынын Куралдуу күчтөрүнүн башкы командачысы болуп саналат. Куралдуу күчтөрдүн жогорку командалык курамын аныктайт, кызматка дайындайт жана бошотот."},{"t":"p","h":"Президент ушул Конституцияда каралган дагы башка ыйгарым укуктарды жүзөгө ашырат."},{"t":"p","h":"Президент кызматынан четтетилгенден кийин жазык жоопкерчилигине тартылышы мүмкүн."},{"t":"p","h":"Өзүнүн аппаратынын түзүмүн аныктайт, жобосун бекитет жана жетекчисин дайындайт."},{"t":"h3","h":"Доскулу уулу Сарт акенин эл башчыларына"},{"t":"p","h":"арнаган адеп насаат сөздөрү – Әл башчысы кандай болуу керек? – Башчысы жок эл болбойт. Башчысы жок эл – карып. Башчысы жок эл – керүнгөнгө жем, башчысы бар эл – ынтымактуу, биримдиктүү эл. Ынтымактуу эл – кубаттуу эл."},{"t":"p","h":"Әл башчысы -— эл тагдырынын жоопкери, көсөмү. Ар нерсенин таянычы, тиреги болот: кереге таянычы – жер, уук таянычы – кереге, түндүк таянычы – уук. Ушул сыяктуу эл башчысынын таянган тиреги – калың эл. Әлге алымдуу, элге жагымдуу, сөзү жугумдуу, эли үчүн жанын сайган, кайгымуңун чогуу тарткан, жыргаса чогуу жыргаган, адилет, калыс башчыны эл-жери кадырлайт, ардак тутат."},{"t":"p","h":"Жок, башчы нарк-насилсиз болсо, өзүн өзгөчө сезген көр көкүрөк болсо, айткан сөзү жөнсүз болсо, жакшы менен жамандын дилин билбесе жана бар кудуретин, акыл-эсин, абийирин, дөөлөтүн напсисине тебелетип, көр дүйнөгө кул кылса, ал элден ажырайт, андайды калың журт колдобойт. Мындай башчы эл бузар, журт бузар, журт курутар митеге тете."},{"t":"p","h":"<span class=\"pg\" data-n=\"52\">52<\/span>Жакшылык менен жамандыктын салмагы, касиети бирдей эмес. Өмүрдө тапкан абийирди көз ачып-жумганча жоготуп коюуга болот. Колдон кеткен абийирдин орду толбойт, ал кайрылып келбейт. Муну эл башчысы эле эмес, ар бир адамдын биле жүрүшү абзел. Ошондон улам, көп жакшылыкты бир жамандык жеңерин эске тутуу абзел."},{"t":"p","h":"Жамандык менен жакшылык ар адамдын көзү өткөнчө тегерегинде эриш-аркак ээрчишип жүрөт. Ниетке жараша биринин ордун бири басып турат. Әмесе, айланайындар, Аллах таалам ниетиңерге береке берсин! Ниет оңолсо, Аллах таалам бак берет, береке берет. Ниет оңолгондо эси дартың да, сүйлөгөн сөзүң да оңолот. Жакшы айтылган сөздүн өмүрү узун, бүт ааламды баккан кара жер, калың эл гана казына эмес, тунук акылдан чыккан асыл сөз да кенч. Ата мурасынын бардыгы сөз аркылуу укумдан тукумга жетет."},{"t":"h3","h":"Байзак ажы Тооке уулу"},{"t":"p","h":"Байзак ажы Жумгалдык болуш болгон (1827—1914). Ал бардыгына тең калыс, адилет караган. Ошондуктан кийин болуш болуп эл башкарган уулдарына өзүнүн акыл, кеңештерин айтып турган. Ал азыркы мезгилде дагы эле өз маанисин жогото элек. «Әлди бийликтин күчү менен эмес, калыстыктын күчү менен башкар. Бийлигиң бүткөн күндө да эл менен кала бересин...», «Мен бийлик ээси болуп турганда, өзүм гана элдин сынында эмес, туугандарым да элдин сынында. Шарияттын, мыйзамдын жолун катуу сакташы – алардын туугандык парзы», «Мен тууганымдын болушу эмес, элдин болушумун, тууганга калыс боло албаган, элге калыс боло албайт», «Әл жакшысы карапайымдыгын жоготсо, мансап кууса, дүнүйө топтосо, анын паска түшкөнү ошол» (А. Молдалиев «Байзак баатыр» – Бишкек, 1998. 67—68-бб.). Байзак ажынын бул терең ойлору эл башкарган жетекчилер кандай сапаттарга ээ болушу керек экендигин эскертип турат."},{"t":"p","h":"Кайталоо үчүн суроолор % 1. Мамлекеттик органдар жана мекемелер, алардын айырмасы."},{"t":"p","h":"2. Мамлекетик органдардын түрлөрү. Президент жана анын иш-аракеттери."},{"t":"v","l":["З. КРнын Президентин шайлоонун шарттары.","4. КРнын Президентинин ыйгарым укуктарынан атап бер."]}],"sub":[{"title":"Кыргыз Республикасынын Президентин шайлоо","b":12},{"title":"Доскулу уулу Сарт акенин эл башчыларына","b":31},{"title":"Байзак ажы Тооке уулу","b":37}],"section":"АДАМ, КООМ, МАМЛЕКЕТ ЖӨНҮНДӨ ТҮШҮНҮК ЖАНА КЫРГЫЗСТАН МАМЛЕКЕТТҮҮЛҮГҮНҮН ТАРЫХЫ","pages":[49,52]},{"title":"§ 12. ДЕМОКРАТИЯЛЫК МАМЛЕКЕТТЕ МАМЛЕКЕТТИК БИЙЛИКТИН УЮШТУРУЛУШУ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"53\">53<\/span>§ 12. ДЕМОКРАТИЯЛЫК МАМЛЕКЕТТЕ МАМЛЕКЕТТИК БИЙЛИКТИН УЮШТУРУЛУШУ"},{"t":"v","l":["Т үш үнүктөр:",". Бийликтин үч бутагы.",". Жогорку Кенеш.","Тапшырма:","Пропорциялык система.","Мыйзам чыгаруу иши."]},{"t":"p","h":"„Мамлекеттик бийликти эмне үчүн бөлүштүрүү керек?"},{"t":"p","h":"*Жогорку Кеңеш жана алардын аткарган иштери тууралуу өз билгениңди айтып бер."},{"t":"p","h":". «Өлкө сен үчүн эмне кылгандыгы жөнүндө эмес, өзүң өлкөң үчүн эмне кыла аларың тууралуу сурагын.» Д.Ф. Кеннеди (1961—-1968-жылдары АКШнын президенти). Бул ойду колдогон же жокко чыгарган аргументтерди келтир."},{"t":"p","h":"Мамлекеттик бийликти уюштуруунун негиз салуучу принциби болуп, бийликтердин бөлүнүү принциби эсептелет. Бул принцип англичан Джон Локк тарабынан көтөрүлүп, француз агартуучусу Шарль Монтескье тарабынан өрчүтүлгөн. Мамлекеттик бардык бийлик алардын аткарган иштерине ылайык үч бутакка бөлүнүүсү керек. Мыйзам чыгаруучу, аткаруучу жана сот бийлиги."},{"t":"p","h":"Кыргыз Республикасынын мыйзам чыгаруу бийлиги – Жогорку Кеңеш."},{"t":"p","h":"Кыргыз Республикасынын Жогорку Кеңеши – Кыргыз Республикасынын парламенти – мыйзам чыгаруу бийлигин жана көзөмөлдүк кылуу милдеттерин жүзөгө ашыруучу өкүлчүлүктүү орган. Өлкөнүн укук системасынын курамдык бөлүгү болуп кала турган мыйзамдарды иштеп чыгуу жана аларды кабыл алуу укугу бар институт «Мыйзам чыгаруу органы» деп аталат."},{"t":"h3","h":"Бийликтин үч бутагы"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Мыйзам<\/td><td>Аткаруу<\/td><td>Сот<\/td><\/tr><tr><td>чыгаруу<\/td><td>бийлиги<\/td><td>бийлиги<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"54\">54<\/span>Жогорку Кеңеш пропорциялуу система боюнча 5 жылдык мөөнөткө шайлануучу 120 депутаттан турат (2010-жыл, июнь)."},{"t":"p","h":"Шайлоого 21 жашка толгон, шайлоого катышууга укугу бар, Кыргыз Республикасынын жараны Жогорку Кеңешке депутат болуп шайлана алат."},{"t":"p","h":"Жогорку Кеңештин биринчи жыйынын эң улуу депутат ачат. Жогорку Кеңештин депутаттары фракцияларга биригет."},{"t":"p","h":"Депутаттык мандаттардын көбүнө ээ болгон фракция же фракциялардын коалициясы парламенттеги көпчүлүк болуп эсептелет."},{"t":"p","h":"Парламенттик көпчүлүктүн курамына кирбеген жана өзүн оппозиция катары жарыялаган фракциялар парламенттик оппозиция болуп саналат."},{"t":"p","h":"Парламенттин тарыхына кайрылсак, Кыргыз ССРи кезинде Жогорку Совет деп аталса, эгемендикти алган жылдан баштап Жогорку Кеңеш деп аталып (1995-жылы февраль) эки палатадан, (Мыйзам чыгаруу жыйыны, Әл өкүлдөр жыйыны.) 105 депутаттан, кийин 75 депутаттан турган (2008- жылы). 2005-жылдан баштап Кыргыз Республикасынын Жогорку Кеңеши 90 депутаттан туруп, туруктуу иштеген бир палаталуу орган. Алар партиялык тизме (пропорциялык система) боюнча шайланган. Ошондой эле, жарандардын талапкерликке өзүн-өзү көрсөтүүгө да укугу бар болгон."},{"t":"p","h":"Мыйзам чыгаруу органы эл менен тыгыз байланышта болгондугу менен, аткаруу бийлигинен айырмаланып турат. Ошондой эле мыйзам чыгаруу органы эл менен өкмөттүн ортосун байланыштырып туруучу көпүрө катары иш-аракет жасайт."},{"t":"p","h":"Талапкерлердин тизмесин аныктоодо саясый партия төмөнкүлөрдү эске алышы керек:"},{"t":"p","h":"– талапкерлердин тизмесинде жалаң гана эркектер, же жалаң гана аялдар 70 пайыздан ашпоосу керек;"},{"t":"p","h":"– 85 жаштан ашпаган адамдар (жаштар) 15 пайыздан кем болбоосу керек;"},{"t":"p","h":"– ар кандай улуттардын өкүлдөрү 15 пайыздан кем болбоосу керек."},{"t":"p","h":"Кыргыз Республикасынын Жогорку кеңеши тең жана тике шайлоо укугунун негизинде жашыруун добуш берүү менен шайланат."},{"t":"p","h":"<span class=\"pg\" data-n=\"55\">55<\/span>Өзгөчө оор кылмыштарды кошпогондо депутатты жазык жоопкерчилигине тартууга, Жогорку Кеңештин депутаттарынын жалпы санынын көпчүлүгүнүн макулдугу менен жол берилет. Жогорку Кеңештин депутаты бир эле убакта башка мамлекеттик же муниципалдык кызматта боло албайт, ишкердик жасабайт, коммерциялык уюмдун жетекчи органынын, же байкоочулар кеңешинин курамына кирбейт. Илимий педагогикалык жана башка чыгармачыл иштерди аткара алат. -"},{"t":"p","h":"Жогорку Кеңештин депутатынын ыйгарым укуктары Жогорку Кеңештин ыйгарым укуктарынын токтолушу менен бир учурда токтотулат. Ошондой эле депутат жазуу жүзүндө арыз бергенде, сессия ичинде жыйналыштарга себепсиз 80дан ашык жумуш күнүн калтырганда, депутат шайланган партия ишин токтоткондо жана башка учурларда токтотулат."},{"t":"h3","h":"Жогорку Кеңештин ыйгарым укуктары"},{"t":"p","h":"– референдумду дайындоо жөнүндө мыйзам кабыл алат;"},{"t":"p","h":"– Президентти шайлоону дайындайт;"},{"t":"p","h":"– Кыргыз Республикасынын Конституциясына өзгөртүүлөрдү киргизет;"},{"t":"p","h":"– мыйзамдарды кабыл алат;"},{"t":"p","h":"– Кыргыз Республикасынын чек араларын өзгөртүү маселелерин чечет;"},{"t":"p","h":"-екмет тарабынан киргизилген республикалык бюджетти жана анын аткарылышы жөнүндө отчётту бекитет;"},{"t":"p","h":"– өкмөттүн ишинин программасын бекитет. Өкмөттүн түзүмүн жана курамын аныктайт;"},{"t":"p","h":"– Кыргыз Республикасынын өкмөтүнө ишенбестик билдире алат;"},{"t":"p","h":"– Президенттин сунушу менен Жогорку соттун судьяларын шайлайт, кызматынан бошотот;"},{"t":"p","h":"– Кыргыз Республикасынын башкы прокурорун дайындоого жана кызматтан бошотууга макулдук берет;"},{"t":"p","h":"– Президенттин сунушу боюнча Улуттук банктын төрагасын шайлайт жана кызматтан бошотот;"},{"t":"p","h":"– Кыргыз Республикасынын Акыйкатчысын (омбудсмен) шайлайт жана кызматтан бошотот; Акыйкатчынын ар жылдык баяндамаларынын, КРнын Премьер-министринин, Башкы прокурордун, Улуттук Банктын, Әсептөө палатасынын төрагаларынын ар жылдык отчётторун угат;"},{"t":"p","h":"<span class=\"pg\" data-n=\"56\">56<\/span>– Кыргыз Республикасынын Президентине каршы айып коёт, Президентти кызматынан четтетет;"},{"t":"p","h":"– Согуш жана тынчтык маселелерин чечет;"},{"t":"p","h":"– Өзгөчө абалды киргизет, бул маселе боюнча Президенттин Жарлыктарын бекитет же жокко чыгарат."},{"t":"p","h":"– Конституцияда каралган дагы башка ыйгарым укуктарды ишке ашыра алат."},{"t":"v","l":["Мыйзам чыгаруу иши","Мыйзам чыгаруу демилге укугу:","– 10 миң шайлоочуга (элдик демилге)","– Жогорку Кеңештин депутаттарына;"]},{"t":"p","h":"– Өкмөткө таандык. Мыйзамдар депутаттардын 50дөн кем эмесинин добушу менен кабыл алынат."},{"t":"v","l":["Кайталоо үчүн суроолор","% 1. Жогорку Кеңеш жана ага болгон шайлоонун түрлөрү."]},{"t":"p","h":"2. Жогорку Кеңешке болгон шайлоонун шарттары жана жаш өзгөг чөлүктөрү."},{"t":"p","h":"З. Жогорку Кеңештин ыйгарым укуктары."},{"t":"p","h":"4. Мыйзам чыгаруу иштери жана мыйзам чыгарууга кимдер укуктуу?"},{"t":"p","h":"5. Мыйзам кантип кабыл алынат?"}],"sub":[{"title":"Бийликтин үч бутагы","b":8},{"title":"Жогорку Кеңештин ыйгарым укуктары","b":24}],"section":"АДАМ, КООМ, МАМЛЕКЕТ ЖӨНҮНДӨ ТҮШҮНҮК ЖАНА КЫРГЫЗСТАН МАМЛЕКЕТТҮҮЛҮГҮНҮН ТАРЫХЫ","pages":[53,56]},{"title":"§§ 13–14. КЫРГЫЗ РЕСПУБЛИКАСЫНЫН АТКАРУУ БИЙЛИГИ","blocks":[{"t":"h3","h":"§§ 13–14. КЫРГЫЗ РЕСПУБЛИКАСЫНЫН АТКАРУУ БИЙЛИГИ"},{"t":"v","l":["Т үш үн үктөр:","* Жергиликтүү мамлекеттик","администрация.","Тапшырма:","* КРнын өкмөтү.",". Айыл өкмөтү."]},{"t":"p","h":". «Коом деген сени менен мен, сен таза болсоң, мен таза болсом, коом да таза болот». Исхак Раззаков."},{"t":"p","h":"1945-1950-жылы Кыргыз ССР Министрлер Советинин төрагасы, 1950-—1960-жж. Кыргызстан КП БКнын 1-катчысы."},{"t":"p","h":"* «Күчтүү жана чынчыл өкмөт бир гана материалдык тартипти эмес, элдин адеп-ахлагынын өзүн да сактайт», – деп эсептеген акын В.А. Жуковский (XIX к.)."},{"t":"p","h":"Әки башка мезгилде эки адам тарабынан айтылган бул ойлорду колдогон же жокко чыгарган аргументтерди келтир, окшош жактарын ойлон."},{"t":"img","src":"data:image/webp;base64,UklGRiYWAABXRUJQVlA4IBoWAABQhgCdASoPAWYBPrVQokunJKclKZN8KOAWiWlrSV9oO6A+Z4yOrftedy9l+7y08jX+l05mVzYGBeVGt+J9lX9U7VgyaztPQ1ny+VEVrr+/9hrV/tordAPUAldf1Dq+f/iM/nd/89FFvQS/baE3Vhy6WjMo6LH9yoxZeas5GnfGPBB+KDpwn1hfX8jxWFLNMFFaqi+pxKvKUsiP5Vbhl3 "p","h":"Премьер-министр Өкмөттүн иши жөнүндө жыл сайын Жогорку Кеңешке отчет берип турат. Премьер министр, Өкмөт же Өкмөттүн айрым мүчөсү кызматынан кетүү жөнүндө өтүнүчүн билдирүүгө акылуу. Ал Президент тарабынан кабыл алынат же четке кагылат. Премьер-министрдин кызматтан кетишин кабыл алуу Өкмөттүн кызматтан кетишине алып келет."},{"t":"p","h":"Өкмөт:"},{"t":"p","h":"– Конституциянын жана мыйзамдардын аткарылышын камсыз кылат."},{"t":"p","h":"– Мамлекеттин ички жана тышкы саясатын ишке ашырат."},{"t":"p","h":"<span class=\"pg\" data-n=\"59\">59<\/span>– Мыйзамдуулукту, жарандардын эркиндиктерин жана укуктарын камсыз кылуу, коомдук тартипти сактоо, кылмыштуулукка каршы күрөшүү боюнча чараларды жүзөгө ашырат."},{"t":"p","h":"– Мамлекеттин эгемендигин, аймактык бүтүндүгүн коргоо, конституциялык түзүлүштү сактоо боюнча, ошондой эле коргонуу жөндөмдүүлүгүн чыңдоо, улуттук коопсуздукту жана укук тартибин бекемдөө боюнча чараларды ишке ашырууну камсыз кылат."},{"t":"p","h":"– Финансы, баа, тариф, инвестиция жана салык саясатын жүргүзүүнү камсыз кылат."},{"t":"p","h":"– Республикалык бюджетти иштеп чыгат жана Жогорку Кеңешке сунуш кылат, анын аткарылышын камсыз кылат, республикалык бюджеттин аткарылышы жөнүндө Жогорку Кеңешке отчет берет."},{"t":"p","h":"– Социалдык-экономикалык жана маданий чөйрөдө бирдиктүү мамлекеттик саясатты жүргүзүүнү камсыз кылат."},{"t":"p","h":"– Жарандык коом менен эриш-аркак иштешүүнү камсыз кылат."},{"t":"p","h":"Премьер-министр:"},{"t":"p","h":"– Өкмөттү башкарат, анын иши үчүн Жогорку Кеңештин алдында жеке жоопкерчилик тартат;"},{"t":"p","h":"– Бардык аткаруу бийлигинин органдары тарабынан Конституциянын жана мыйзамдардын аткарылышын камсыз кылат."},{"t":"p","h":"– Сүйлөшүүлөрдү жүргүзөт, эл аралык келишимдерге кол коёт."},{"t":"p","h":"– Өкмөттүн жыйналышын өткөрөт;"},{"t":"p","h":"– Өкмөттүн токтомдоруна жана буйруктарына кол коёт, алардын аткарылышын камсыз кылат;"},{"t":"p","h":"– Административдик ведомстволордун жетекчилерин дайындайт жана бошотот;"},{"t":"p","h":"– Мыйзамда белгиленген тартипте жергиликтүү мамлекеттик администрациялардын башчыларын жергиликтүү кеңештердин сунушу боюнча дайындайт жана бошотот."},{"t":"p","h":"Конституциянын жана мыйзамдардын негизинде жана аларды аткаруу үчүн Өкмөт токтомдорду жана буйруктарды чыгарат, ошондой эле алардын аткарылышын камсыз кылат."},{"t":"p","h":"<span class=\"pg\" data-n=\"60\">60<\/span>Жергиликтүү өз алдынча башкаруу."},{"t":"p","h":"Жергиликтүү өз алдынча башкаруу – жергиликтүү жамааттардын жергиликтүү маанидеги маселелерди өз алдынча чечүү мүмкүнчүлүгү болуп эсептелет."},{"t":"p","h":"Ал жарандардын жергиликтүү жаматттары тарабынан же жергиликтүү өз алдынча башкаруу органдары аркылуу жүзөгө ашырылат."},{"t":"p","h":"Жергиликтүү өз алдынча башкаруу органдарынын системасын төмөнкүлөр түзөт:"},{"t":"p","h":"– жергиликтүү кеңештер жергиликтүү өз алдынча башкаруунун өкүлчүлүктүү органдары;"},{"t":"p","h":"– айыл өкмөтү, шаарлардын мәриялары жергиликтүү өз алдынча башкаруунун аткаруучу органдары;"},{"t":"p","h":"– жергиликтүү өз алдынча башкаруунун аткаруучу органдары жана алардын кызмат адамдары иштеринде жергиликтүү кеңешке отчет беришет;"},{"t":"p","h":"– жергиликтүү кеңештердин депутаттары тийиштүү административдик аймактык бирдиктин аймагында жашаган жарандар тарабынан шайланат;"},{"t":"p","h":"– жергиликтүү кеңештер мыйзамга ылайык, жергиликтүү бюджеттерди бекитет, алардын аткарылышын көзөмөлдөйт. Жергиликтүү салыктарды киргизет;"},{"t":"p","h":"– жашы 20га жеткен КРнын жараны жергиликтүү кеңештин депутаттыгына шайлана алат."},{"t":"p","h":"Талапкерликке көрсөтүү саясый партия тарабынан, ошон- ДОЙ эле өзүн-өзү көрсөтүү жолу менен да жүргүзүлөт. Конституцияда жана мыйзамдарда белгиленген ыйгарым укуктарынын чегинде, өз аймагында милдеттүү түрдө аткарыла турган актыларды кабыл алат."},{"t":"p","h":"Айыл өкмөттөрүнүн негизги милдеттери:"},{"t":"p","h":"* калкка социалдык жана маданий тейлөө кызматтарын көрсөтүү;"},{"t":"p","h":"* аймакты социалдык-экономикалык жактан коргоо;"},{"t":"p","h":"* бюджетти иштеп чыгуу жана аны бекиткенден кийин аткаруу;"},{"t":"p","h":"жерди сарамжалдуу пайдалануу боюнча иш-чараларды жүргүзүү."},{"t":"p","h":"Айыл өкмөтүнүн башчысы жергиликтүү кеңешке, жергиликтүү салыктарды киргизүү боюнча сунуш жасай алат. Айылдык кеңешке 9дан 21ге чейин депутат шайланат. Алар <span class=\"pg\" data-n=\"61\">61<\/span>жылына 4 жолудан кем эмес сессияга чогулушат. Айыл, кыштак кеңештеринин милдетине жергиликтүү бюджетти жана анын аткарылышы жөнүндөгү отчетту бекитүү, жергиликтүү салыктарды, салыктан тышкаркы төлөмдөрдү киргизүү, муниципалдык менчикти пайдалануу тартибин аныктоо, айылдын, кыштактын уставын бекитүү кирет. Жергиликтүү кеңештердин чечимдери депутаттардын көпчүлүк добушу менен кабыл алынып, токтом чыгарылат."},{"t":"v","l":["Кайталоо үчүн суроолор","% 1. КРнын өкмөтү.","2. КРнын өкмөтүнүн ыйгарым укуктары."]},{"t":"p","h":"З. Жергиликтүү мамлекеттик администрациянын иш-аракеттери. 25 4. Жергиликтүү өз алдынча башкаруу органдары жана жергиликтүү"},{"t":"p","h":"Кеңештердин түрлөрү, алардын милдеттери."}],"sub":[],"section":"АДАМ, КООМ, МАМЛЕКЕТ ЖӨНҮНДӨ ТҮШҮНҮК ЖАНА КЫРГЫЗСТАН МАМЛЕКЕТТҮҮЛҮГҮНҮН ТАРЫХЫ","pages":[57,61]},{"title":"§ 15. КЫРГЫЗ РЕСПУБЛИКАСЫНЫН СОТ БИЙЛИГИ","blocks":[{"t":"h3","h":"§ 15. КЫРГЫЗ РЕСПУБЛИКАСЫНЫН СОТ БИЙЛИГИ"},{"t":"v","l":["Т үш үнүктөр:","* Конституциялык сот.","* Жогорку сот.","* Жергиликтүү сот.","","Тапшырма:"]},{"t":"p","h":". Сот адилеттигин кандай түшүнөсүңөр, ал эмне учун керек?"},{"t":"p","h":"* Байыркы мезгилде кыргыздарда күнөөлүү адамдарды кимдер, кантип жазалашкан?"},{"t":"p","h":". Арстанбек акындын төмөнкү ырда хан менен акимге карай чыгарган өкүмүнө макул же каршы болгон аргументтерди келтирип бер."},{"t":"p","h":"Арстанбек акын өз заманында далай башчылардын адилетсиз кылык-жоруктарын көрүп, «ушул заман тар заман, азуулууга бар заман, бечарага зар заман» деп ырдаган. Ошондой эле калк башында турган байлыгы, бийлиги бар атка минерлердин адеп-ахлагына катуу талаптарды койгон."},{"t":"p","h":"Алсак, башкаруучулар элдин үмүт тилектери, кызыкчылыктары менен эсептешип, катардагы букара калкка мээримдүү, адилеттүү мамиле жасап, ак ниет эмгек кылуулары керек."},{"t":"p","h":"<span class=\"pg\" data-n=\"62\">62<\/span>Әгерде башкаруучулардын жүрүм-туруму мындай сапаттарга каршы болсо, андай жетекчилердин баркы болмок эмес."},{"t":"p","h":"Арстанбек акын андай төбөлдөргө төмөнкүдөй өкүм чы-"},{"t":"v","l":["гарган:","Зордугу өтсө жакырга,","Зомбулук кылса бакырга,","Зордун түбү – кара жер.","Катарлаш элге кан чыкса,","Канкорлорго жан тартса,","Кандын жайы – кара жер.","Кара өзгөй болсо калкына,","Калктын жетпей баркына.","Жакырдык жанды кыйнаса,","Акимдин жайы – кара жер.","Бийликтин үчүнчү бутагы болуп сот бийлиги эсептелет.","Кыргыз Республикасында сот адилеттигин сот гана ишке"]},{"t":"p","h":"ашырат. Сот бийлиги конституциялык, жарандык, жазык-"},{"t":"v","l":["тык, админстративдик жана башка сот өндүрүшү аркылуу","жүзөгө ашырылат.","Кыргыз Республикасынын сот системасы Конституция","жана мыйзамдар менен белгиленет, ал Жогорку соттон жана","жергиликтүү соттордон турат. Жогорку соттун курамында","Конституциялык палата иштейт."]},{"t":"h3","h":"Сот бийлиги"},{"t":"h3","h":"Сот бийлиги"},{"t":"v","l":["Жогорку","сот","","Конституциялык","палата","Жергиликтүү","сот"]},{"t":"p","h":"Судьялар көз карандысыз, Конституцияга жана мыйзамдарга гана баш ийет. Судьялар кол тийбестик укугуна ээ жана кылмыш үстүндө тутулгандан тышкаркы учурда кармалууга же камакка алынууга, тинтүүгө жеке текшерилүүгө тийиш эмес. Конкреттүү бир сот иши боюнча судьядан отчет <span class=\"pg\" data-n=\"63\">63<\/span>талап кылууга эч кимдин укугу жок. Сот адилеттигин жүзөгө ашыруу боюнча ар кандай кийлигишүүлөргө тыюу салынат."},{"t":"p","h":"Курагы 40 жаштан кем эмес жана 70 жаштан жогору эмес, укуктук жогорку билими бар, ошондой эле ал укуктук кесиби боюнча кеминде 10 жыл стажы бар Кыргыз Республикасынын жараны Жогорку соттун судьясы боло алат. Жогорку соттун судьялары өз курамынан Жогорку соттун төрагасын, төраганын орун басарларын 8 жылдык мөөнөткө шайлайт. Бир эле адам катары менен эки мөөнөткө Жогорку соттун төрагасы, төраганын орун басарлары болуп шайлана албайт."},{"t":"p","h":"Жогорку сот жарандык, жазык, кылмыш, административдик жана башка иштер боюнча жогорку сот органы болуп саналат жана мыйзамда белгиленген тартипте сот процессине катышуучулардын кайрылуулары боюнча жергиликтүү соттордун соттук актыларын кайра кароону жүзөгө ашырат."},{"t":"p","h":"Жарандык иштерге, мисалы, автордук укук, мурастык укук, ажырашуу, эмгек укугу боюнча талаш-тартыштар кирет."},{"t":"p","h":"Жазык иштерине Кыргыз Республикасынын жазык кодексинде каралган, кылмыш жасаган адамдардын күнөөсүн аныктап, жаза чектөө кирет."},{"t":"p","h":"Кылмыш иштерине Кыргыз Республикасынын кылмыш жана жаза кодексинде каралган, кылмыштарды жасаган адамдардын күнөөлөрүн аныктап, жаза чектөө кирет."},{"t":"p","h":"Кылмыштардын түрлөрү, мисалы, инсанга каршы кылмыштар, экономикалык чөйрөдөгү кылмыштар, коомдук коопсуздукка каршы кылмыштар, Мамлекеттик бийликке каршы күрөштөр."},{"t":"p","h":"Административдик сот иштерине Кыргызстандын Административдик укук бузуулар жөнүндө кодексинде көрсөтүлгөн укук бузуулар кирет."},{"t":"p","h":"Бул укук бузууларга, мисалы, коомдук тартипти, паспорт системасын, жолдо жүрүү эрежесин, санитардык, өрткө каршы эрежелерди, чек ара режиминин эрежесин бузуулар кирет."},{"t":"p","h":"Жогоку соттун Конституциялык палатасы конституциялык көзөмөлдөөнү жүзөгө ашыруучу орган болуп саналат. Курагы 40 жаштан кем эмес жана 7ТОжаштан ашпаган, юридикалык жогорку билими бар жана юридикалык кесиби боюнча кеминде 15 жыл стажы бар Кыргыз Республикасынын жараны Жогорку соттун Конституциялык палатасынын судьясы боло алат. Жогорку соттун Конституциялык палатасы <span class=\"pg\" data-n=\"64\">64<\/span>өз курамынан төраганы, төраганын орун басарын 8 жылдык мөөнөткө шайлайт. Бир эле адам эки мөөнөт катары менен Жогорку соттун Конституциялык палатасынын төрагасы, төраганын орун басары болуп шайлана албайт."},{"t":"p","h":"Жогорку соттун Конституциялык палатасынын судьялары судьялар кеңешинин сунушунун негизинде Президенттин сунуштоосу боюнча Жогорку Кеңеш тарабынан ээлеген кызматынан мөөнөтүнөн мурда бошотулушу мүмкүн."},{"t":"p","h":"Жогорку соттун Конституциялык палатасы:"},{"t":"p","h":"– мыйзамдар жана башка ченемдик укуктук актылар Конституцияга карама-каршы келген учурда аларды конституцияга ылайык эмес деп табат;"},{"t":"p","h":"– Кыргыз Республикасы катышуучу болуп саналган күчүнө кирбеген эл аралык келишимдердин конституциялуулугу тууралуу корутунду берет;"},{"t":"p","h":"– ушул Конституцияга өзгөртүүлөр тууралуу мыйзамдын долбооруна корутунду берет;"},{"t":"p","h":"– жогорку соттун Конституциялык палатасынын чечими акыркы болуп эсептелет жана даттанууга жатпайт."},{"t":"p","h":"Жергиликтүү сот Жаш курагы 80 жаштан кем эмес жана 65 жаштан жогору эмес, юридикалык жогорку билими бар 5 жылдан кем эмес иштеген КРнын жараны жергиликтүү соттун судьясы бола алат."},{"t":"p","h":"Алар судьяларды тандоо боюнча кеңештин сунушу менен Президент тарабынан биринчи ирет 5 жылдык мөөнөткө дайындалат жана кызматтан бошотулат."},{"t":"p","h":"Жергиликтүү соттун судьялары өз курамынан соттун төрагасын, анын орун басарын 3 жылдык мөөнөткө шайлайт."},{"t":"p","h":"Бир эле адам катары менен эки мөөнөткө Жергиликтүү соттун төрагасы, төраганын орун басарлары болуп шайлана албайт."},{"t":"p","h":"Жергиликтүү сотторго облустук, райондук жана шаардык соттор кирет."},{"t":"v","l":["Кайталоо үчүн суроолор","1. Конституциялык сот жана аны дайындоонун шарттары.","2. Конституциялык соттун иш-аракеттери.","3. Жогорку сот жана анын ыйгарым укуктары."]},{"t":"p","h":"1 4. Жогорку Кеңештин дайындалышы жана жаш өзгөчөлүктөрү."},{"t":"p","h":"5. Жергиликтүү сотторду дайындоо."}],"sub":[{"title":"Сот бийлиги","b":12}],"section":"АДАМ, КООМ, МАМЛЕКЕТ ЖӨНҮНДӨ ТҮШҮНҮК ЖАНА КЫРГЫЗСТАН МАМЛЕКЕТТҮҮЛҮГҮНҮН ТАРЫХЫ","pages":[62,64]},{"title":"МАМЛЕКЕТТИК САЯСЫЙ ТАРТИПТЕР ЖАНА ЖАРАНДЫК КООМ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"65\">65<\/span>ШГЛАВА"},{"t":"h3","h":"МАМЛЕКЕТТИК САЯСЫЙ ТАРТИПТЕР ЖАНА ЖАРАНДЫК КООМ"},{"t":"h3","h":"§ 16. МАМЛЕКЕТТИН САЯСЫЙ-АЙМАКТЫК ТҮЗҮЛҮШ ФОРМАСЫ"},{"t":"p","h":"Т үш үн үктөр:"},{"t":"raw","h":"<h4 class=\"mk\">* Унитардык. * Федерация. Тапшырма:<\/h4>"},{"t":"v","l":["* Федерациянын белгилери.","* Конфедерация.","","* Федеративдүү мамлекеттер кайсылар?"]},{"t":"p","h":"* Кыргызстан федеративдүү мамлекет болушу үчүн кандай шарттар керек?"},{"t":"p","h":"* Мамлекеттик саясый аймактардын өзгөчөлүктөрүн, айырмачылыктарын жана белгилерин салыштырып жаз."},{"t":"p","h":"Мамлекеттин саясый аймактык түзүлүш формасы – бул борбордук жана жергиликтүү бийлик органдарынын ортосундагы мамилелер жана мамлекеттик аймактык өз ара мамилелер болуп эсептелет. Бул түзүлүштүн негизги эки формасы бар: унитардык мамлекет жана федерация. Унитардык мамлекет – бул борборлоштурулган бирдиктүү мамлекеттик түзүлүш. Унитардык деген француз тилинен которгондо – «биримдик» дегенди билдирет. Анда борбордук өкмөт өлкөнүн бүткүл аймагын жергиликтүү акимчиликтер аркылуу башкарат. Мамлекет ошону менен административдик-аймактык бөлүктөргө бөлүнөт."},{"t":"h3","h":"Саясый-аймактык түзүлүшү"},{"t":"p","h":"Унитардык мамлекет Федерация"},{"t":"h3","h":"Конфедерация"},{"t":"p","h":"<span class=\"pg\" data-n=\"66\">66<\/span>Мисалы, Кыргызстан 7 облуска бөлүнгөн. Бирок бул административдик-аймактык бөлүктөр (облус, район) суверендүүлүккө ээ эмес."},{"t":"p","h":"Өз алдынча мыйзам чыгара албайт. Унитардык мамлекеттерге Франция, Италия, Венгрия, Кыргызстан ж. б. кирет."},{"t":"p","h":"Унитардык мамлекеттин белгилери:"},{"t":"p","h":"* мамлекеттин аймагы административдик-аймактык бөлүктөрдөн турат;"},{"t":"p","h":". бирдиктүү конституция жана мыйзам чыгаруу;"},{"t":"p","h":"* мамлекет үчүн бирдей өкүлчүлүктүү жана аткаруучу органдар;"},{"t":"v","l":[". бирдиктүү сот бийлиги;","* бирдиктүү жарандык."]},{"t":"p","h":"Федерация бул өзүнчө бөлүктөрү мамлекеттүүлүктүн белгилерине ээ болгон мамлекеттик түзүлүш формаларынын ар түрдүүлүгү болуп саналат."},{"t":"p","h":"Федерация латын сөзүнөн которгондо «союз», «бирикме» дегенди билдирет. Федеративдүү мамлекетте федерациялардын ар биринин өз аттары бар. Ошентип штаттар, республикалар, провинциялар бирдиктүү мамлекетке биригип федерацияны түзөт. Федерацияда бирдиктүү жарандык (гражданство) өкүм сүрөт. Федеративдүү мамлекеттердин бардык федерацияларында мамлекеттик бийликтер жана башкаруу органдары иш алып барат."},{"t":"p","h":"Федеративдүү мамлекетке кирген ар бир республика жана штаттардын өзүнүн конституциялары, мыйзамдары, парламенти, өкмөтү, сот органдары бар. Ошондой эле алардын мамлекеттик символикалары: герб, туу, гимндери бар."},{"t":"p","h":"Штаттардын же республикалардын конституциялары жана мыйзамдары федерациянын конституциялары жана мыйзамдары менен дал келиш керек. Федеративдүү мамлекеттер бирдиктүү куралдуу күчкө жана бирдиктүү салыктар системасына ээ болот. Федерация төмөнкүдөй эки жол менен пайда болот."},{"t":"p","h":"1. Келишим түзүү жолу менен. Анда мамлекеттер биригүү жөнүндө келишим түзүшүп, ошону менен федерацияны түзүшөт."},{"t":"p","h":"2. Федерация конституциянын негизинде, борбордук бийлик федеративдүү түзүлүштү жана аймактардын автономиясын тааныган учурда түзүлөт. Федерациянын жогорку бийлик органдарында бийликтин эки системасы бар."},{"t":"p","h":"* Мамлекеттин бөлүктөрүнүн (республиканын, штаттын) жогорку органдары (мыйзам чыгаруучу, аткаруучу, сот бийлиги);"},{"t":"p","h":"<span class=\"pg\" data-n=\"67\">67<\/span>* Жалпы федерациянын жогорку бийлик органдары. Федеративдүү мамлекеттерге Россия, АКШ, Канада, Германия, Индия ж. б. кирет."},{"t":"p","h":"Федерациянын белгилери:"},{"t":"p","h":"1. Федерациянын аймактары анын республикаларынын, штаттарынын аймактарынан турат."},{"t":"p","h":"2. Жогорку мыйзам чыгаруучу, аткаруучу жана сот бийлиги федералдык мамлекеттик органдарга таандык."},{"t":"p","h":"8. Ар бир республика же штат өзүнүн конституциясына мыйзам чыгаруучу, аткаруучу жана сот органдарына ээ."},{"t":"p","h":"Федерациянын жогорку мыйзам чыгаруучу органы болгон парламент эки палаталуу түзүлүшкө ээ. Алар жогорку жана төмөнкү палаталар. Жогорку палата республика же штаттардын кызыкчылыгын көздөйт. Төмөнкү палата өлкөнүн бардык калктарынын кызыкчылыгын көздөйт."},{"t":"p","h":"Мамлекеттик түзүлүш формаларына конфедерация дагы кирет."},{"t":"p","h":"Конфедерация федерацияга караганда анча тыгыз эмес бирикмеси. Алар конфедерацияга бириккени менен ички тышкы ишинде өздөрүнүн толук көз карандысыздыгын сактап калат. Бирдей тышкы саясатты жүргүзүп, жалпы армияга, жалпы финансылык жана мамлекеттик органдарга ээ болот. Конфедерациялык мамлекеттин катарына Швейцария кирет."},{"t":"p","h":"Кайталоо үчүн суроолор % 1. Мамлекеттин саясый-аймактык түзүлүш формалары жана алардын"},{"t":"p","h":"белгилери жөнүндө айтып бер."},{"t":"p","h":"2. Федерациянын пайда болуу жолдору."},{"t":"p","h":"1 3. Унитардык жана федеративдик мамлекеттердин катарына кирген"},{"t":"p","h":"мамлекеттерди атап бер."},{"t":"p","h":"4. Унитардык мамлекеттердин федерациядан өзгөчөлүктөрү."}],"sub":[{"title":"Саясый-аймактык түзүлүшү","b":9},{"title":"Конфедерация","b":11}],"section":"ШГЛАВА","pages":[65,67]},{"title":"§§ 17–18. МАМЛЕКЕТТИК САЯСЫЙ ТАРТИПТЕР","blocks":[{"t":"h3","h":"§§ 17–18. МАМЛЕКЕТТИК САЯСЫЙ ТАРТИПТЕР"},{"t":"p","h":"Т үш үнүктөр:"},{"t":"raw","h":"<h4 class=\"mk\">. Демократия.. Туз демократия.<\/h4>"},{"t":"v","l":["* Демократиянын принциптери.",". Демократиянын баалуулуктары.",". Өкүлчүлүктүү демократия.","Демократиялык лидерлик."]},{"t":"p","h":"<span class=\"pg\" data-n=\"68\">68<\/span>Тапшырма:"},{"t":"p","h":"Демократиянын кемчиликтери көп, бирок анын артыкчылыктары да бар: буга чейин эч ким андан жакшыраак нерсени ойлоп таба элек» деген У. Черчилль."},{"t":"p","h":". Автордун айтайын деген ою эмнеде? Демократиянын кандай кемчилик

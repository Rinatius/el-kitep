<style>/* Mobile textbook reader. No external fonts or libraries: everything works offline. */
:root {
  --bg: #ffffff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3;
  --panel: #f6f6f6; --accent: #1f6feb; --accent-fg: #ffffff;
  --fs: 19px; --lh: 1.55;
  --font: Georgia, "Noto Serif", "DejaVu Serif", "Times New Roman", serif;
  --bar-h: 48px; --foot-h: 28px;
}
[data-theme="sepia"] { --bg: #f5ecd9; --fg: #4a3b2a; --muted: #8a7458; --line: #e0d2b4; --panel: #ece0c6; --accent: #9a5b13; }
[data-theme="dark"]  { --bg: #111315; --fg: #d8d8d8; --muted: #8c8c8c; --line: #2a2d31; --panel: #1b1e21; --accent: #6ea8ff; --accent-fg: #0b0b0b; }
[data-theme="contrast"] { --bg: #000000; --fg: #ffffff; --muted: #c8c8c8; --line: #444; --panel: #151515; --accent: #ffd400; --accent-fg: #000; }
[data-font="sans"] { --font: Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 16px/1.4 Roboto, "Noto Sans", Arial, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- Library ---------- */
.lib { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lib h1 { font-size: 22px; margin: 8px 0 4px; }
.lib .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.lib-head { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
.lib-head h1 { flex: 1; margin: 0; }
.school { display: flex; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.school button { flex: 1; min-height: 44px; padding: 0 10px; font-size: 15px; background: var(--panel); }
.school button + button { border-left: 1px solid var(--line); }
.school button.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.my-link { flex: 0 0 auto; font-weight: 600; min-height: 40px; padding: 0 12px; font-size: 14px; }
.grade { margin-bottom: 10px; }
.grade-h { display: flex; width: 100%; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 18px; font-weight: 600; text-align: left; }
.grade-h::after { content: '›'; font-size: 24px; color: var(--muted); margin-left: 10px; transition: transform .15s; }
.grade.open .grade-h::after { transform: rotate(90deg); }
.grade-h .n { margin-left: auto; font-size: 14px; font-weight: 400; color: var(--muted); }
.grade-b { padding: 0 2px; }
.grade-t { font-size: 20px; margin: 18px 0 0; }
.subj { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.bk { border-bottom: 1px solid var(--line); padding: 4px 0 12px; }
.bk:last-child { border-bottom: 0; }
.bk-t { font-size: 17px; font-weight: 600; }
.bk-s { font-size: 14px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bk-m { color: var(--muted); font-size: 13px; margin: 3px 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: .5; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.bk-h { display: flex; align-items: flex-start; gap: 4px; }
.bk-h .bk-t { flex: 1; padding-top: 10px; }
.bk .row { gap: 4px; }
.bk .row .btn { min-height: 40px; padding: 0 18px; font-size: 14px; margin-right: 8px; }
.bk .icon { color: var(--muted); flex: 0 0 auto; }
.bk .icon[disabled] { opacity: .5; }
.bk .icon.on { color: var(--accent); }
.bk .star.on svg { fill: currentColor; }
.bk .star.on { color: #e3a008; }
.share-opts { display: flex; flex-direction: column; gap: 10px; }
.share-opts .note { margin-top: 0; }
.sheet h3 .icon { flex: 0 0 auto; }

/* ---------- Reader ---------- */
.reader { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; user-select: text; }
.viewport { position: absolute; left: 0; right: 0; top: 0; bottom: var(--foot-h); overflow: hidden; }
.flow {
  height: 100%; column-fill: auto; padding: 20px 0 12px;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  will-change: transform; transform: translate3d(0,0,0);
  hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
}
.flow.anim { transition: transform .25s ease-out; }
.flow p { margin: 0 0 .15em; text-indent: 1.4em; text-align: left; }
.flow p.ni { text-indent: 0; }
.flow h1, .flow h2, .flow h3 { font-family: Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.25; break-after: avoid; page-break-after: avoid; }
.flow h1 { font-size: 1.35em; margin: .2em 0 .8em; text-align: center; }
.flow h2 { font-size: 1.15em; margin: 1.1em 0 .5em; }
.flow h3 { font-size: 1.0em; margin: 1em 0 .4em; }
.flow .verse { margin: .6em 0 .8em 1em; break-inside: auto; }
.flow .verse div { text-indent: -1em; padding-left: 1em; text-align: left; }
.flow .verse .gap { height: .7em; }
.flow figure { margin: .8em 0; text-align: center; break-inside: avoid; page-break-inside: avoid; }
.flow figure img { max-width: 100%; height: auto; border-radius: 4px; background: var(--panel); }
.flow figcaption { font-size: .8em; color: var(--muted); margin-top: .3em; }
.flow .box { border-left: 3px solid var(--accent); padding: .1em 0 .1em .7em; margin: .7em 0; }
.flow .pg { font: 11px/1 Roboto, Arial, sans-serif; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 4px; margin: 0 3px; vertical-align: 2px; text-indent: 0; white-space: nowrap; user-select: none; }
.flow .end { height: 1px; }
.flow .endnote { text-align: center; color: var(--muted); font-size: .8em; margin-top: 2em; font-family: Roboto, Arial, sans-serif; }
[data-theme="dark"] .flow img, [data-theme="contrast"] .flow img { filter: brightness(.9); }

.foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot-h); display: flex; align-items: center;
  justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.foot .t { overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }

.bar { position: absolute; left: 0; right: 0; background: var(--panel); border-color: var(--line); z-index: 5;
  transition: transform .2s; display: flex; align-items: center; }
.bar.top { top: 0; height: var(--bar-h); border-bottom: 1px solid var(--line); transform: translateY(-100%); padding: 0 4px; }
.bar.bottom { bottom: 0; border-top: 1px solid var(--line); transform: translateY(100%); padding: 10px 16px 14px; flex-direction: column; align-items: stretch; gap: 6px; }
.reader.ui .bar { transform: none; }
.bar .title { flex: 1; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.bar .info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* ---------- Sheets (TOC, settings) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85%; overflow: auto; background: var(--bg);
  border-radius: 16px 16px 0 0; z-index: 11; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
.sheet h3 { margin: 10px 0 12px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.toc a { display: block; padding: 11px 4px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 15px; }
.toc a.sub { padding-left: 20px; font-size: 14px; color: var(--muted); }
.toc a.cur { color: var(--accent); font-weight: 600; }
.set { margin: 14px 0; }
.set label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; }
.seg button.on { border: 2px solid var(--accent); font-weight: 600; }
.swatch[data-v="light"] { background: #fff; color: #1b1b1b; }
.swatch[data-v="sepia"] { background: #f5ecd9; color: #4a3b2a; }
.swatch[data-v="dark"] { background: #111315; color: #d8d8d8; }
.swatch[data-v="contrast"] { background: #000; color: var(--accent-fg); }
.goto { display: flex; gap: 8px; }
.goto input { flex: 1; min-height: 44px; font-size: 16px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px;
  border-radius: 20px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Textbook elements produced by tools/convert_pdf.py ---------- */
.flow .tasks, .flow .gloss { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45;
  background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0; }
.flow .tasks p, .flow .gloss p { margin: 0 0 .35em; text-align: left; }
.flow .gloss { border-left: 3px solid var(--accent); }
.flow p.note { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; font-style: italic; text-indent: 0; margin: .6em 0; }
.flow p.attr { text-align: right; text-indent: 0; font-style: italic; color: var(--muted); margin: .1em 0 .8em; }
.flow p.sep { text-align: center; text-indent: 0; color: var(--muted); margin: .5em 0; letter-spacing: .3em; }
.flow h2 .pg, .flow h3 .pg { font-weight: normal; }
.toc .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 4px 2px; }
.toc a .p { float: right; color: var(--muted); font-size: 13px; margin-left: 8px; }

/* ---------- Elements produced by tools/convert_layout.py (typeset textbooks) ---------- */
.flow figure img { cursor: zoom-in; }
.flow h4.mk { font: 700 .78em/1.3 Roboto, "Noto Sans", Arial, sans-serif; letter-spacing: .05em; color: var(--accent);
  margin: 1em 0 .3em; break-after: avoid; page-break-after: avoid; }
.flow p.hl { color: var(--accent); text-indent: 0; }
.flow p.small { font-size: .82em; text-indent: 0; color: var(--muted); }
.flow sup, .flow sub { font-size: .7em; line-height: 0; }
.flow .kbox { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45; background: var(--panel);
  border-radius: 8px; padding: .45em .7em; margin: .5em 0; border-left: 3px solid var(--accent); }
.flow .kbox > b { display: block; }
.flow .frame { background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0;
  font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; line-height: 1.45; }
.flow .frame p { text-indent: 0; margin: 0 0 .35em; text-align: left; }
.flow .tbl { margin: .8em 0; font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .8em; line-height: 1.35; }
.flow .tbl .tt { font-weight: 600; text-indent: 0; text-align: center; margin-bottom: .3em; }
.flow .tbl table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.flow .tbl th, .flow .tbl td { border: 1px solid var(--line); padding: .3em .35em; vertical-align: top; text-align: left; overflow-wrap: anywhere; hyphens: auto; }
.flow .tbl th { background: var(--panel); }
.flow .tbl tr { break-inside: avoid; page-break-inside: avoid; }

.zoom { position: fixed; inset: 0; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; background: rgba(0,0,0,.92); z-index: 30; }
.zoom-in { position: absolute; inset: 0; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
.zoom-in img { margin: auto; flex: none; touch-action: pan-x pan-y; object-fit: contain; background: #fff; cursor: zoom-in; }
.zoom-x { position: absolute; top: 8px; right: 8px; color: #fff; background: rgba(0,0,0,.5); z-index: 31; }
.flow h4.sh { font: 700 .95em/1.3 Roboto, "Noto Sans", Arial, sans-serif; text-align: center; margin: .8em 0 .4em; break-after: avoid; page-break-after: avoid; }

/* maths books */
.flow h4.ex, .flow h4.try { font-family: Roboto, Arial, sans-serif; margin: 1.1em 0 .3em; font-size: 1em; }
.flow h4.ex { display: inline-block; background: #f7e400; color: #111; padding: .1em .6em; border-radius: 3px; }
.flow h4.try { color: var(--accent); }
.flow p.goal { font-size: .85em; text-indent: 0; background: var(--panel); border-radius: 8px; padding: .4em .7em; }
.flow b.bd { display: inline-block; text-indent: 0; padding: 0 .4em; border-radius: 1em; background: var(--fg); color: var(--bg);
  font: bold .8em/1.45 Roboto, Arial, sans-serif; margin-right: .2em; }
.flow b.nb { display: inline-block; text-indent: 0; min-width: 1.4em; border-radius: 4px; background: var(--accent); color: var(--accent-fg);
  text-align: center; font-size: .8em; margin-right: .3em; }
.flow .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.15; margin: 0 .1em; }
.flow .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .15em; }
.flow p.ml { text-indent: 0; padding-left: 1em; }
.flow p.side { font-size: .85em; }
.flow details.ans { margin: .3em 0 .8em; font-size: .9em; }
.flow details.ans summary { color: var(--accent); cursor: pointer; font-family: Roboto, Arial, sans-serif; }

/* wide tables become one card per row on phones */
@media (max-width: 560px) {
  .flow .tbl.cards table, .flow .tbl.cards tbody, .flow .tbl.cards tr, .flow .tbl.cards td { display: block; width: auto; }
  .flow .tbl.cards tr:first-child { display: none; }
  .flow .tbl.cards tr { border: 1px solid var(--line); border-radius: 8px; margin: .5em 0; padding: .3em .5em; }
  .flow .tbl.cards td { border: 0; padding: .15em 0; }
  .flow .tbl.cards td::before { content: attr(data-l); display: block; font: 600 .75em/1.3 Roboto, Arial, sans-serif; color: var(--muted); }
  .flow .tbl.cards td:first-child { font-weight: 600; }
}
.flow figure.vec svg { max-width: 100%; height: auto; display: inline-block; background: #fff; border-radius: 4px; cursor: zoom-in; }
[data-theme="dark"] .flow figure.vec svg, [data-theme="contrast"] .flow figure.vec svg { filter: brightness(.9); }
.flow .rt { border-top: 1px solid currentColor; padding-top: 1px; margin-left: 1px; }
.flow .it { display: inline-block; max-width: 100%; margin-right: .9em; text-indent: 0; }
</style>

 бүткөн мүнөз элиме,","Досторуна даяр дилин берүүгө.","Бул ынтымак эл бирдигин ширетип,","Бейкуттукту берет кыргыз жерине.","","Кайырма:","","Аткарылып элдин үмүт-тилеги,","Желбиреди эркиндиктин желеги.","Бизге жеткен ата салтын, мурасын,","Ыйык сактап, урпактарга берели.","","Кайырма:"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"1\">1<\/span>Ө. Б. СААЛАЕВ"},{"t":"h2","h":"МАМЛЕКЕТ ЖАНА УКУК"},{"t":"v","l":["Жалпы билим берүүчү орто мектептердин","9-классы үчүн окуу китеби","","Биринчи басылышы","","Кыргыз Республикасынын Билим берүү","жана илим министрлиги бекиткен.","","«Билим-компьютер","Бишкек – 2012","<span class=\"pg\" data-n=\"2\">2<\/span>Жооптуу редактору: Иманкулов М. К. – педагогика илимдеринин","кандидаты, доцент","Рецензенттер:","Бактыгулова Ч. А. КРнын Билим берүүсүнүн отличниги,","Бишкек шаардык мәриясынын Билим берүү"]},{"t":"p","h":"башкармалыгынын билимди өнүктүрүү бөлүмүнүн башкы адиси Абдыкадырова М. А. КРнын Билим берүүсүнүн отличниги,"},{"t":"p","h":"Т.Сатылганов атындагы №69 ОТК-гимназиясынын тарых мугалими"},{"t":"p","h":"Саалаев Ө. Б."},{"t":"p","h":"С – 47 Мамлекет жана укук. Жалпы билим берүүчү мектеп. 9-кл. үчүн окуу китеби.— 1-бас. /Б.: «Билим-компьютер», 2012. —"},{"t":"p","h":"Бул окуу китебинде мамлекеттик билим берүү стандартынын негизинде түзүлүп, мамлекеттин келип чыгышы, анын башкаруу формалары, мамлекеттик органдар, алардын ыйгарым укуктары ж. б. жөнүндө маалыматтар берилди."},{"t":"h3","h":"ББК 83.3 Ки я 721"},{"t":"p","h":"© Саалаев ©., 2012 © КР Билим берүү жана илим министрлиги, 2012 © «Билим-компьютер», 2012"},{"t":"h3","h":"<span class=\"pg\" data-n=\"3\">3<\/span>КИРИШ СӨЗ"},{"t":"h3","h":"ЖАРАНДЫК БИЛИМ БЕРҮҮНҮН МАКСАТТАРЫ ЖАНА МИЛДЕТТЕРИ"},{"t":"p","h":"Азыркы мезгилде биздин коомубузда жарандык билим берүү чоң мааниге ээ болуу менен ага болгон талап өсүүдө. Алар жаңыдан өнүгүп келе жаткан Кыргызстандын саясыйэкономикалык турмушунан ачык көрүнүп турат."},{"t":"p","h":"Кыргызстандагы жарандык билим берүү өзүнө саясый укуктук жана адеп-ахлактык билим берүүнүн элементтерин камтуу менен жарандардын саясый жана укуктук маданиятын жогорулатууга арналган. Жарандык билим берүү мектеп окуучуларынын коомдук турмушка аралашуу жана андагы маанилүү иштерди чечүүгө катышуусуна өбөлгө түзөт. Окуучулар мамлекет, коомдун түзүлүшү, уюштурулушу жана дөөлөттөрү, укук ж.б. тууралуу түшүнүгүн жогорулатуу менен коомдогу өз ордун таба билүү жөндөмдүүлүктөрүнө ээ болушат. Окуучулар мамлекеттик органдардын түзүлүшүн, иштөө тартибин, алардын ишин жөнгө салуучу мыйзамдар тууралуу маалымат алышат. Жарандык билим берүү өлкөнү демократиялаштыруунун зарыл бөлүгү гана болбостон, коомду өнүктүрүүгө жана тынчтыкты бекемдөөгө да салым кошот."},{"t":"p","h":"Ошентип, жарандык билим берүүнүн максаттары менен таанышалы:"},{"t":"p","h":"– окуучуларды жарандардын саясый жана жарандык укуктары менен милдеттерин тааныштыруу. Ошондой эле ал укуктарды ишке ашырууга жардам берүү;"},{"t":"p","h":"– КР мамлекеттик жана жергиликтүү деңгээлдеги башкаруунун түзүлүшү, башкаруунун жүрүшү менен тааныштыруу;"},{"t":"p","h":"– окуучулар республикалык, жергиликтүү жана эл аралык деңгээлдердеги өкмөттүк эмес уюмдардын түзүлүшүн билишет;"},{"t":"p","h":"– окуучулар бийлик органдары жана өз аймактарындагы жамааттар менен иштешүү үчүн сынчыл ойлоно билүүгө көнүгүшөт;"},{"t":"p","h":"– коомдун өзүнчө уюмдашуусунун түрдүү жолдоруна сын көз караш менен баа берүүгө үйрөнүшөт;"},{"t":"p","h":"<span class=\"pg\" data-n=\"4\">4<\/span>– улутуна карабастан, башкалардын пикирин угуу, жамааттын ынтымактуу болушуна салым кошуу мүмкүнчүлүгүнө ээ болушат;"},{"t":"p","h":"-өздөрү жашаган жамаатты башкарууга жигердүү катышууга демилге көтөрө алышат. Ошондой эле Европа кеңеши (Совет европы) иштеп чыккан жарандуулук түшүнүгүнүн принциптери да жарандык билим берүүнүн максаттарынан жана милдеттеринен болуп эсептелет."},{"t":"p","h":"Аларга:"},{"t":"p","h":"– бирөөнүн укугуна жана эркиндиктерине шек келтирбестен, өз укугун жана эркиндиктерин пайдалана билүү;"},{"t":"p","h":"– бийликтегилер менен башка жарандар жана алардын бирикмелери менен сүйлөшө билүү жөндөмдүүлүгү;"},{"t":"p","h":"– мамлекет жана коом алдындагы юридикалык жана моралдык милдеттенмелерине, өзүңдүн тандаган чечимиңе жана кылган иштерине жоопкерчиликте болуу;"},{"t":"p","h":"– социалдык чындыкка болгон сын мамиле, аны кайра түзүүгө болгон аракет кирет."}],"sub":[{"title":"Ө. Б. СААЛАЕВ","b":2},{"title":"ББК 83.3 Ки я 721","b":10},{"title":"КИРИШ СӨЗ","b":12}],"pages":[0,4]},{"title":"§ 1. АДАМ ЖАНА ИНСАН ЖӨНҮНДӨ ТҮШҮНҮК","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"5\">5<\/span>АДАМ, КООМ, МАМЛЕКЕТ ЖӨНҮНДӨ ТҮШҮНҮК ЖАНА КЫРГЫЗСТАН МАМЛЕКЕТТҮҮЛҮГҮНҮН ТАРЫХЫ"},{"t":"h3","h":"§ 1. АДАМ ЖАНА ИНСАН ЖӨНҮНДӨ ТҮШҮНҮК"},{"t":"v","l":["Т үш үнүктөр:",". Адам биологиялык социалдык жандык.","* Инсан.","* Индивидуум.","Тапшырма:","* Маалыматтар картасын түзүү."]},{"t":"p","h":". Адам тууралуу маалыматтарды схема түрүндө көрсөтүү.. Инсандын негизги сапаттары кайсылар?"},{"t":"p","h":"* Эмне үчүн жарандык жигердүүлүк инсандын негизги сапаты болуп эсептелет?"},{"t":"p","h":"* Инсан жана индивидуалдуулуктун өзгөчөлүктөрү."},{"t":"h3","h":"Адам биологиялык продукт катары"},{"t":"p","h":"Окумуштуулар биздин заманга чейин эле адамдын эн маанилүү белгиси болуп анын коомдук жандык болгондугу эсептелет деген жыйынтыкка келишкен. Адам эмгектенүүнүн натыйжасында айбанаттардан бөлүнүп чыккан. Ал эми эмгек коллективдүү, демек, коомдук гана болушу керек. Адам башынан эле коомдук болгон. Коомдо эл менен болгон мамиледе эмгек гана адамдык жаңы сапаттардын: тилдин, ойлонууга жөндөмдүүлүктүн жана башкалардын жаралышына алып келген. Ар бир жаңы төрөлгөн бала коомдо гана адам боло алат. Кээде кичинекей балдар айбанаттардын арасында калган учурлар да болгон. Алар чоңойгондо эки буттап басканды, ойлонгонду, сүйлөгөндү, бир нерселерди пайдаланганды үйрөнгөн эмес. Әл арасында алар өздөрүн колго түшкөн айбанаттардай алып жүрүшкөн."},{"t":"p","h":"Адам – бул жаратылыштын эң жогорку продуктысы. Ал көптөгөн биологиялык керектөөлөргө ээ. М.: дем алат, тамактанат, уктайт, белгилүү бир жагымдуу чөйрөгө муктаж."},{"t":"p","h":"<span class=\"pg\" data-n=\"6\">6<\/span>Биздин денебиз, каныбыз, мээбиз, жаратылышка таандык. Ошентип адам биологиялык жандык – бул адамдын анатомиясында жана физиологиясында адамдын организминдеги химиялык, мээ-нерв системасындагы ж. б. процесстерден көрүнүп турат. Адамдагы социалдык жана биологиялык кошулмалар бириктирилген."},{"t":"p","h":"Адамдын түз басышы, мээ түзүлүшү, өңү, колунун формасынын бардыгы, адамдын узак убакытка созулган коллективдүү эмгегинин натыйжасы болгон."},{"t":"p","h":"Ар бир баланын ойлонгонго мээси, үн чыгаруучу органдары бар, бирок ал коомчулукта гана ойлонгонго жана сүйлөгөнгө үйрөнө алат. Бардык жаныбарлар сыяктуу эле адамдар да өзүн сактап калуу инстинкти бар. Демек, адамдын биологиялык социалдык башаты, бири-бири менен органикалык жактан байланышкан жана ушундай биримдикте гана адам жан сактайт. Бул ажырагыс биримдик, адам – бул социалдык жандык деп атаганга мүмкүндүк берет."},{"t":"p","h":"Әми адамдар жаныбарлардан кандайча айырмаланат?"},{"t":"p","h":"1. Адам эмгек куралын жасаганга жана колдонгонго жөндөмдүү."},{"t":"p","h":"2.Әң татаал түзүлүштөгү мээге ээ болот. Ойлоно алат, сүйлөйт."},{"t":"p","h":"3. Чыгармачылык менен эмгектенүүгө жөндөмдүү. Адам жер жүзүндөгү тирүү организмдердин өнүгүшүндөгү звенону түзгөн биосоциалдык жандык."},{"t":"h3","h":"Инсан жөнүндө түшүнүк"},{"t":"p","h":"Жер жүзүндө бири-бирине коёндой окшош эки адамды таба албайбыз. Анткени ар бир адам кайталангыс, уникалдуу болуп, өзгөчөлөнүп турат. Бул инсандын өсүп-жетилүү өзгөчөлүктөрү менен байланышкан."},{"t":"p","h":"Әми инсандын бардык ички сапаттарына көңүл буралы. Алар баарыдан мурда инсандын акыл эсинен, жан дүйнөсүнөн, жүрүм-турумунан көрүнүп турат. Адам эмнени жакшы көрөт, баалайт, анын башка адамдарга болгон мамилеси кандай? Адамдар жакшылык кылууга, жардамдашууга жөндөмдүүбү? Мына ушунун баары инсандын негизги сапаттарын аныктайт."},{"t":"p","h":"Арстанбек Буйлаш уулу (1840-1882-жж. заманчы акын) инсандын әң маанилүү сапаттарын элге, Ата журтка кызмат кылуудан көргөн. Ошондуктан Арстанбек («Терме» деген <span class=\"pg\" data-n=\"7\">7<\/span>чыгармасында) «Ата журтту ардакташ – азаматтын белгиси» деп айтат."},{"t":"p","h":"Ошондой эле «сен жалпы элге кызмат кылганың менен кишисиң», деп белгилөө менен ар бир адамдын инсан катары ордун белгилеп кеткен:"},{"t":"v","l":["Кайратың тоону бузса да,","Кашыгың көлдү сузса да,","Оозуңдан чыккан сөзүңө,","Зоо кууланып учса да,","Әл менен сен адамсың,","Әлден чыксаң жамансың."]},{"t":"p","h":"Арстанбек инсандын негизги сапаттары катары чындыкка, акыйкатка, калыстыкка, адамгерчиликке, боорукерликке, күйүмдүүлүккө, өзүн жөнөкөй тутууга, жоомарттыкка көңүл бурган. Терс жоосундарга кылыч болуп чабылган, арамдыкты оттой куйкалаган түздүккө, «эл камын ойлогон азаматтыкка» негизделген жамаатчыл, атуулдук күжүрмөн, айкөл жүрүм-турумду баарынан жогору койгон. «Инсан» түшүнүгүнө бир нече аныктамалар берилип жүрөт. Көбүнчө, «инсан» дегенде, анын социалдык сапаттарына көңүл бурабыз."},{"t":"p","h":"Тактап айтканда, «инсан» түшүнүгүнө адамдын индивидуалдуулугун билдирүүчү анын туруктуу касиеттери камтылат. Анын коомдогу иш-аракеттери, ушул касиеттерине жараша болот. Адамдык касиет баарынан мурда акыл-эстен, жан-дүйнө талабынан, жүрүм-турумдун түрдүү формаларынан көрүнөт. «Инсан» түшүнүгүнө адамга таандык болгон эң башкы нерсе – коомдук жан катары анын бардык ички сапаттарынын жыйындысы кирет."},{"t":"p","h":"Деги, инсан деген ким?"},{"t":"p","h":"Инсан – бул өзүнүн социалдык ролдорун аткарууга толугу менен даяр индивид – адам. Инсан – бул биологиялык, индивидуалдык жана социалдык касиеттердин жыйындысы."},{"t":"p","h":"Ал эми саясаттагы инсан өзүнө тиешелүү интеллектуалдыктын-эмоциялуулуктун, эрктүүлүктүн, саясый ишмердүүлүктүн белгилерин жана сапаттарын камтыган адам."},{"t":"p","h":"Өзүнүн көз-карашын ачык айтуу, аны коргой алуу, берген убадасына бекем туруу үчүн адам өз алдынча ойлоно билүүгө, кайраттуу болууга тийиш. Адам өзү бир чечимге келе алабы, өзү жасаган кадамдары, иш-аракеттери үчүн жооп <span class=\"pg\" data-n=\"8\">8<\/span>бере алабы же бирөөнүн ыктыярына баш ийип жүрө береби – бул дагы чоң мааниге ээ."},{"t":"p","h":"Анткени инсан болуу – жекече жоопкерчиликте болгон, өз милдеттерин башка бирөөгө оодара салбаган, бирөөнүн артына жашынбай турган адам болуу дегенди билдирет."},{"t":"p","h":"Ар бир тирүү жан өзүнчө ажырагыс бүтүндүккө ээ. Муну биз индивидуум (латынча дейбиз."},{"t":"p","h":"Индивидуум – ар бири өз алдынча өмүр сүргөн, жекече жан (М.: жаңы төрөлгөн бала, иттин күчүгү ж. 6.). Ар бир жандын өзүнө таандык индивидуалдуу өзгөчөлүктөрү бар. Индивидуалдуулук – бул жекече жандын кайталангыс өзгөчөлүктөрү. Ар бир адамдын кайталангыс сапаттары болот да, бул сапаттар анын индивидуалдуулугун билдирип турат. Индивидуалдуулук адамдын тышкы көрүнүшүнөн, турмушка болгон көз карашынан, жашоо мүнөзүнөн байкалат."},{"t":"p","h":"Жаңы төрөлгөн бала инсан боло албайт. Себеби андагы индивидуалдык өзгөчөлүктөр бардык эле тирүү жандыктарда бар. Жаңы төрөлгөн бала алардан өсүп-өнүгүү жана социалдык сапаттарга ээ болуу процессинде инсан болуп жетиле тургандыгы менен айрымаланат."},{"t":"p","h":"Баланын коом менен болгон мамилеси, анын бул коомдо ээлеген ордуна жараша түзүлөт. Алгачкы жылдары баланын коом алдында милдеттери болбойт. Ага чоң кишилер кам көрөт. Ошондуктан баланын иш-аракеттеринин баары анын өзү үчүн гана мааниге ээ. Кийинчерәэк, мектепке бара баштаганда, баланын багыт алуусу өзгөрөт."},{"t":"p","h":"Окуучу болгондон кийин, анын ишмердиги өзү үчүн эле керек болбостугуна алгачкы жолу ишенет. Ал өз ишмердиги коомдун талаптарына ылайыкталаарын, коом анын эмгегин жыйынтыгына жараша баалай тургандыгын көрөт. Коомдо жалаң гана өзү үчүн жашоо мүмкүн эместигин түшүнөт."},{"t":"p","h":"Инсан – бул индивидуумдун коомдо өсүп-жетилүүсүнүн натыйжасы. Адам коомдон тышкары жашаса, башка адамдар менен мамиледе болбосо инсан боло албайт, ал индивидуум бойдон калат. Инсан бойдон эч ким төрөлбөйт. Инсан болуп калыптанат."},{"t":"p","h":"Бир жашында эле балдар тегерегиндеги адамдар менен баарлашууга аракеттене баштайт. Убакыт өткөн сайын бул мамилелер өзгөрүлүп, көп түрдүү боло берет."},{"t":"p","h":"Индивидуумдун инсан катары өсүп жетилиши үчүн саясый-экономикалык жана социалдык шарт, жагдайлар керек."},{"t":"v","l":["<span class=\"pg\" data-n=\"9\">9<\/span>Кайталоо үчүн суроолор","%Ф 1. Эки аныктаманын айырмачылыгы: а) адам – биологиялык жандык;","б) адамдын социалдык жандык экендигин далилде.","г 2. Инсандык сапаттардан мисал келтирип, өз оюңду айт.","3. Инсан тууралуу (аныктамаларынан) эмнени билдиң?","4. Индивидуум жана индивидуалдуулук түшүнүктөрү."]}],"sub":[{"title":"Адам биологиялык продукт катары","b":6},{"title":"Инсан жөнүндө түшүнүк","b":16}],"section":"АДАМ, КООМ, МАМЛЕКЕТ ЖӨНҮНДӨ ТҮШҮНҮК ЖАНА КЫРГЫЗСТАН МАМЛЕКЕТТҮҮЛҮГҮНҮН ТАРЫХЫ","pages":[5,9]},{"title":"§ 2. МАМЛЕКЕТ ТҮШҮНҮГҮ. УКУКТУК МАМЛЕКЕТТЕР","blocks":[{"t":"h3","h":"§ 2. МАМЛЕКЕТ ТҮШҮНҮГҮ. УКУКТУК МАМЛЕКЕТТЕР"},{"t":"v","l":["Т үш үнүктөр:","* Мамлекет.","* Мамлекеттин белгилери.","* Укуктук мамлекет.","* Укуктук мамлекеттин белгилери.","* Мамлекеттин функциялары.","Тапшырма:"]},{"t":"p","h":"+ Алгачкы мамлекет пайда болоордон мурда адамдар кандай шарттарда жашап келишкен?"},{"t":"p","h":"* Мамлекетти куруунун себептери. Бир нече мисал келтир. + Укуктук мамлекетти эмне үчүн куруу керек, анын езгечө белгилери кайсылар?"},{"t":"h3","h":"Мамлекет жөнүндө түшүнүк"},{"t":"p","h":"Байыркы мезгилде уруучулук коомдо адамдар туугандык белгилери менен биригишкен. Уруучулук коомдордун башкаруу органдары болуп аксакалдар кеңеши, башчы, жолбашчы, диний жетекчилер эсептелишкен. Акырындап башкаруучулар катмары мүлктүк абалы боюнча айрымаланып, бай-кедейлер пайда болгон. Мамлекетте болсо мамлекет отурукташкан калктын аймактык уюшулуусуна негизделип бийликти белгилүү бир аймакта жүргүзөт. Ошентип мамлекет үч элементтен: калкы, аймагы жана бийликтен турат. Египетте биздин заманга чейин ТҮ миң жылдыкта таптардын пайда болушу менен эң алгачкы мамлекет келип чыккан. Эксплуатациялануучу кулдар менен дыйкандардын үстүнөн кул ээлөөчүлөрдүн үстөмдүгүн кармап туруучу күч мамлекет деп аталган. Ал эми – орто кылымдын башында 500-жылы франктарда эзилүүчүлөрдү баш ийдирип турган күч, мамлекет <span class=\"pg\" data-n=\"10\">10<\/span>пайда болгон. Таптардын пайда болушу менен франктардын мамлекети түзүлгөн. Мамлекеттин келип чыгыш себеби, бул коомдо баш аламандыкка жол бербөө жана саясый бийликке белгилүү бир өлчөмдө курал болуп берүү эсептелет. Мамлекет өзүнүн өнүгүү тарыхында ар кандай стадияларды басып өткөн. Ошондой эле белгилүү бир өлчөмдө калктын жогорку катмарынын кызыкчылыгын коргоочу курал катары кызмат кылган."},{"t":"p","h":"Италиялык философ Никкало Макиавелли ХУЇ кылымда Батыш маданиятына азыркы мамлекет түшүнүгүн биринчи болуп киргизген. Макиавелли мамлекетти өз алдынча түзүлүш деп айткан жана аны элдин эркиндигин, укуктарын коргой билген жөндөмдүү, акылдуу жетекчилер башкарууга тийиш деп эсептеген."},{"t":"p","h":"Азыркы мезгилде элдин аң-сезиминин өсүшүнүн жана коомдун өнүгүшүнүн натыйжасында жер жүзүндө демократиялык принципти колдогон укуктук мамлекеттер басымдуулук кылат."},{"t":"h3","h":"Мамлекеттин белгилери"},{"t":"p","h":"Эгемендүүлүк"},{"t":"raw","h":"<h4 class=\"mk\">ҮЗ арасы Элдик бийлик<\/h4>"},{"t":"h3","h":"Мыйзам"},{"t":"v","l":["укугу","Мамлекеттин _","белгилери","Салык","саясаты"]},{"t":"p","h":"Мамлекет деп суверендүүлүккө ээ болгон, баардыгы үчүн бирдей милдеттүү мыйзам чыгарган, башкаруучу жана мажбурлоочу атайын аппараты бар, калктан салык жыйнай алган бийликтин бирдиктүү саясый уюмун айтабыз."},{"t":"v","l":["Мамлекеттин белгилери:",". калктын аймактык уюшулушу, чек арасы;"]},{"t":"p","h":"эгемендүүлүгү, «көз карандысыздык», «өз алдынчалык»;"},{"t":"p","h":". мыйзам чыгарууга укуктуулугу;"},{"t":"v","l":["салык жана жыйым саясаты;","элдик бийлик."]},{"t":"p","h":"<span class=\"pg\" data-n=\"11\">11<\/span>Укуктук мамлекет"},{"t":"p","h":"Мурдагы советтик коомдо укук «социалисттик укук» деп аталып, толук идеологиялаштырылган болчу. Совет доорунда мамлекетке коммунисттик партия жетекчилик кылган. Өлкөнүн калкы мамлекеттик органдар, партиянын чечимдерин аткарууга тийиш болгон. Ошондой эле укук дагы саясатташтырылып, компартиянын чечимдерин аткаруунун куралы болуп калган. Азыркы мезгилдеги укуктук реформалар, Кыргызстанда демократиянын негизинде укуктук мамлекетти курууга багытталган."},{"t":"p","h":"Укуктук мамлекет деп мамлекеттик бийликти так бөлүштүрүү принцибине негизделген, адам укуктарын жана эркиндиктерин гарантиялаган, мыйзам жана сот алдында бардык адамдын бирдейлигин, мыйзамдын артыкчылыгын, укуктук үстөмдүктү камсыз кылган демократиялык мамлекетти айтабыз."},{"t":"h3","h":"Укуктук мамлекет"},{"t":"raw","h":"<h4 class=\"mk\">Мыйзамдын артыкчылыгы Көз карандысыз сот Жарандын укуктарын жана эркиндиктерин коргоо<\/h4>"},{"t":"p","h":"Көз карандысыз ММК"},{"t":"h3","h":"Бийликти"},{"t":"v","l":["Белгилери","бөлүштүрүү","","Демократия","","Укуктук мамлекеттин белгилери:"]},{"t":"p","h":". мыйзамдын артыкчылыгы. Анда бийликтин бардык органдары мыйзамга гана баш ийет. Ал эми мыйзам жалпы калктын эркин билдирет;"},{"t":"p","h":". жарандардын укуктарын жана эркиндиктерин камсыз кылуу;"},{"t":"v","l":["* бийликтин бөлүштүрүлүшү;",". көз карандысыз сот;"]},{"t":"p","h":". мамлекеттин укук менен болгон байланышы. Анда мамлекет органдарынын актылары жалпы укуктардын принциптери менен карама-каршы болбош керек;"},{"t":"p","h":"<span class=\"pg\" data-n=\"12\">12<\/span>чыныгы демократия;"},{"t":"p","h":". көз карандысыз массалык маалымат каражаты (ММК)."},{"t":"h3","h":"Мамлекеттин функциялары"},{"t":"p","h":"Мамлекеттин функциялары – бул коомчулукту башкаруу боюнча мамлекеттик ишмердүүлүктүн ар кандай түрлөрү болуп эсептелет. Алар ички жана тышкы болуп бөлүнөт."},{"t":"p","h":"Ички функциялар. Әлдик бийликти камсыз кылуу, экономикалык, социалдык мамилелерди жөнгө салуу, калктын күнүмдүк турмушу үчүн шарт түзүү, салык жыйноо, айланачөйрөнү коргоо, жарандардын укуктарын жана эркиндиктерин коргоо. Мамлекеттик жана коомдук түзүлүштү, экономикалык жана социалдык системаларды коргоо, коомдук тартипти сактоо."},{"t":"p","h":"Тышкы функциялар. Мамлекеттик чек араны коргоо, башка мамлекеттер менен кызматташтык (экономикалык, аскердик, экологиялык) мамилелерин түзүү, эл аралык аренада мамлекеттин кызыкчылыгын коргоо, тынч жашоого шарт түзүү ж.б."},{"t":"p","h":"Кайталоо үчүн суроолор % 1. Мамлекеттин кантип пайда болгондугу жөнүндө эмнелерди билдиң? 2. Мамлекет түшүнүгү жана анын белгилери."},{"t":"p","h":"3. Мамлекет таптык белгилери боюнча кандай типтерге бөлүнөт? 25 4. Укуктук мамлекет түшүнүгү жана анын белгилери?"},{"t":"p","h":"5. Укуктук мамлекеттин белгилерин окуп-талдоо менен алардын Кыр-"},{"t":"p","h":"гызстанда канчалык деңгээлде ишке ашырылгандыгына жооп бер."},{"t":"p","h":"6. Мамлекеттин кандай функциялары бар жана алар кайсылар?"}],"sub":[{"title":"Мамлекет жөнүндө түшүнүк","b":4},{"title":"Мамлекеттин белгилери","b":8},{"title":"Мыйзам","b":11},{"title":"Укуктук мамлекет","b":21},{"title":"Бийликти","b":24},{"title":"Мамлекеттин функциялары","b":32}],"section":"АДАМ, КООМ, МАМЛЕКЕТ ЖӨНҮНДӨ ТҮШҮНҮК ЖАНА КЫРГЫЗСТАН МАМЛЕКЕТТҮҮЛҮГҮНҮН ТАРЫХЫ","pages":[10,12]},{"title":"§ 3. БАЙЫРКЫ КЫРГЫЗ МАМЛЕКЕТТЕРИНИН","blocks":[{"t":"h3","h":"§ 3. БАЙЫРКЫ КЫРГЫЗ МАМЛЕКЕТТЕРИНИН"},{"t":"p","h":"ТАРЫХЫ (б.з.ч. Ш-хХ КЫЛЫМДЫН БАШЫ)"},{"t":"p","h":"Т үш үн үктөр:"},{"t":"raw","h":"<h4 class=\"mk\">* Сыма Цян. * Маодун Шанүй.. Барсбек. Негизги. даталар:<\/h4>"},{"t":"v","l":["* Бийлик системасы.","Улуу Кыргыз Дөөлөтү.",". Эне-Сай кыргыз мамлекети."]},{"t":"p","h":"Б. з. ч. 201-жылы Маодун Шанүй кыргыздарды каратып алган."},{"t":"p","h":"<span class=\"pg\" data-n=\"13\">13<\/span>2008-жылы августта Кыргыз Мамлекеттүүлүгүнүн 2200 жылдыгы белгиленген."},{"t":"p","h":"648-жылы Әне-Сай кыргыз каганы Ишбара-Ажан Кытай императору Тан Тейсуга барган."},{"t":"p","h":"711-жылы кышында Эне-Сай кыргыз каганы Барсбек курман болгон."},{"t":"p","h":"840-жылы Кыргыз каганы Уйгур кагандыгын талкалаган. Улуу Кыргыз Дөөлөтү негизделген."},{"t":"p","h":"Тапшырма:"},{"t":"p","h":"* Кыргыз элинин байыркы эл экендигин далилдеген бир нече мисал келтир."},{"t":"p","h":"\"Байыркы кыргыз мамлекеттери жөнүндө кандай маалыматтарды билесиң?"},{"t":"p","h":"*Әмне үчүн биз байыркы кыргыз элинин тарыхын билүүбүз керек?"},{"t":"p","h":"Байыркы кыргыз мамлекеттери Кытай тарыхчысы Сыма Цян (б.з.ч. 145-81) өзүнүн Ши Цзи (Тарыхый жазуулар) деген эмгегинде азыркы Монголиянын аймагын ээлеген хундардын падышасы Маодун Шанүй б.з.ч. 201-жылы түндүккө жана түндүк-батышка жортуулга чыгып, бир катар эркин уруулар менен бирге кыргыздарды да багынтып алгандыгын жазган. Демек, б.з.ч. Ш кылымдарда эле Борбордук Азияда кыргыздардын ээликтери болгон жана мамлекеттик бирикмеси Хун дөөлөтүнө баш ийип, анын таасиринде өнүккөн. Мына ушул маалыматка таянуу менен 2008-жылы Кыргызстандын мамлекеттүүлүгүнүн 2200 жылдыгы белгиленген. Ушуга байланыштуу акын Жедигер Саалаевдин «Мен кыргызмын» аттуу ырынан үзүндү келтирип кетели."},{"t":"h3","h":"МЕН – КЫРГЫЗМЫН"},{"t":"v","l":["Байыркымын жана дагы жапжашмын,","Бабалардан калган тилек, максатмын.","Бата менен илгертеден көгөрүп,","Баатырларды канча жоого атказдым!","Кыргыз изин тапса болот капкайдан,","Кытайдан да, же тээ Саян, Алтайдан.","«Саймалуу таш» сайрап турат тили жок,","Кыргыз жолун, эл тарыхын кашкайган."]},{"t":"p","h":"<span class=\"pg\" data-n=\"14\">14<\/span>V кылымдын аягында байыркы кыргыз урууларынын бирикмесинин ордуна Әне-Сай Кыргыз мамлекети түзүлгөн. Мамлекеттин башчысы «ажо» деп аталып, анын турган жеринде жашыл туу сайылып турган."},{"t":"p","h":"VI кылымдын аягында кыргыздардын өтө күчтүү мамлекети түзүлгөн. Анын чек арасы чыгышта Байкал көлүнө, түштүктө Чыгыш Түркстанга чейин созулган. Аны ажо башкарып, ордосу Жашыл тоого жайгашкан."},{"t":"p","h":"Анын кол астында Бойла (вазир), Тутук (эл төрөсү), Ача төрө, Төрө-Сангул (аскер башы), Таркан (аймак бийлери) сыяктуу бийлик системасы болгон. Бул система 6 баскычка бөлүнгөн. Алар министр, жогорку башчылар, башкаруучулар, иш башкаруучулар, жол башчылар жана дагандар. Анын ичинен министрлер жетөө, жогорку башчылар үч, башкаруучулар он. Булардын баары аскер башчылары болушкан. Иш башкаруучулар он беш болгон. Ал эми жол башчылар менен дагандардын чендери (наамдары) болгон эмес. Ошентип мамлекеттик бийлик белгилүү бир системага келтирилип, эң катуу мыйзамдар кабыл алынган."},{"t":"p","h":"Әне-Сай Кыргыз мамлекети VII кылымдын аягында Әне-Сай Кыргыз мамлекети түзүлүп, анын башында Барсбек ажо турган. Ал өз мезгилинин көрүнүктүү саясый ишмери болгон. Кыргыздардын күчүн топтогон Барсбек, 688-жылдан кийин каган титулун Ынанчу Алп Билге такты ысымы менен кошо кабыл алып, өз элин башкарган."},{"t":"p","h":"Демек Әне-Сай Кыргыз мамлекети монархиялык мамлекет болгон. Монархтын титулу каган деп аталган. Ал тышкы саясатын түрктөргө каршы жүргүзгөн. Барсбек 707—'09-жылдары Кытайга, Чүй өрөөнүндөгү түргөштөргө Әзгене башчылык кылган элчилерин жиберген. Дипломаттык аракеттери ийгиликтүү болуп 709-жылы түрктөргө каршы коалиция тузүшкөн (Әне-Сай Кыргыз мамлекети, Тан империясы, Түргөш кагандыгы) 710-711-жылдардын кышында Түрк кагандыгынын аскерлери кыргыздарга түнкүсүн кол салган. Ошол согуштардын биринде Барсбек курман болгон. Кыргыздар түрктөргө үстүртөдөн гана баш ийдирилген. Ошондуктан өз алдынча мамлекет катары 713-753-жылдары Кытайга 4 ирээт элчилерин жиберип байланышын уланткан."},{"t":"p","h":"<span class=\"pg\" data-n=\"15\">15<\/span>1745-жылы Түрк каганаты Уйгур каганаты тарабынан талкаланган. 758-жылы кыргыздар уйгурлар менен согушта жеңилип, бирок өз алдынча башкаруусун сактап калган."},{"t":"p","h":"818-жылга жакын кыргыз ажосу өзүн каган жарыялаган. Бул уйгурларга согуш жарыялоо менен барабар болгон. Ошондуктан 820-жылы уйгурлар Әне-Сай кыргыздарына аскерлерин жиберип, узакка созулган согуш башталган."},{"t":"h3","h":"Улуу Кыргыз Дөөлөтү"},{"t":"p","h":"Көз карандысыздык үчүн болгон 20 жылдык согуштан кийин кыргыз каганы 840-жылы Уйгур кагандыгынын ордосу Ордо-Балыкка 100 миң аскери менен басып кирген. 6 күнгө созулган бул согушта Уйгур каганынын аскерлери туруштук бере алган эмес. Натыйжада, Уйгур кагандыгы кулаган. Кыргыз каганы өз ордосун Монголия тарапка Селенга дарыясына жакын Думань аймагына көчүргөн. Бул Кыргыз мамлекетинин ээлеген аймагы Чыгыштан Байкал боюна, Түштүктөн Монголиянын Гоби чөлүнө чейин, Түштүкбатыштан Жети-Сууга, Түндүктөн Әне-Сайдын ортоңку агымына чейин созулган."},{"t":"p","h":"Ал мамлекетти Академик В. В. Бартольд 1927-жылы жазган «Кыргыздар: Тарыхый очерк» деген китебинде Улуу Кыргыз Дөөлөтү деп атаган."},{"t":"p","h":"Улуу Кыргыз мамлекетинин башында Каган турган. Мамлекеттин жогорку бийлик органы болуп, курултай эсептелген. Ал мамлекеттин ички жана тышкы саясатын аныктаган. Мамлекетти башкарууда аскердик-административдик система колдонулган. Башкаруу ишине министрлер, аскер башчылары, иш башчылары жана башка кызматчылар катышкан. Жергиликтүү бийликти тутуктар, таркандар, бийлер, бектер башкарган. Тутуктар кагандын жер жерлердеги өкүлдөрү болуп саясый бийликти тейлеген. Кыргыз мамлекетинин мыйзамдары катуу болуп, аны бузгандар аёосуз жазаланган."},{"t":"p","h":"Бирок Улуу Кыргыз Дөөлөтүнүн жашоосу кыска болгон. Алыскы жортуулдардан чарчаган жана Борбордук Азиянын бөксө тоолоруна көнө албаган эл, ар кайсы аймакка тарап кеткен. Аларды иналдар башкарган. Бир бөлүгү Теңир-Тоого, экинчиси Тибетке ооп, көпчүлүгү Әне-Сайдын Саян тоолоруна кайтышкан. Ошентип X кылымдын биринчи чейрегинде <span class=\"pg\" data-n=\"16\">16<\/span>(924-ж) «Улуу Кыргыз дөөлөтү» мамлекетинин мезгили аяктаган. Кыргыз каганы отуз жыл бул мамлекетти башкарып, 870-жылы дүйнөдөн кайткан. Жыйынтыктап айтканда, Әне-Сай Кыргыз мамлекети бардыгы болуп 860 жыл (840-1207) өкүм сүргөн. Бул маалыматтар кытай жылнаамаларында, Тува тарыхында ж. б. берилген. Әне-Сай кыргыздарынын Улуу мамлекетинин курамына кирбеген түштүкчыгыш тараптагы кыргыздардын жерлерин VIII-XII кылымдарда чет жердик баскынчылар ээлеп, өздөрүнүн убактылуу үстөмдүгүн орнотушкан."},{"t":"p","h":"Кыргыздар XIII кылымдын башында монголдордун каратып алуусунан кийин, улуттук мамлекетинен ажырап, аны кайра калыбына келтирүү үчүн XX кылымдын башына чейин тынымсыз күрөш жүргүзгөн. Ушул кылымдардын аралыгында кыргыздар Амир Темирдин Моголстан мамлекетинин курамында (XIV-XV кк.) болуп турган."},{"t":"p","h":"XVII-XVIII кылымдарда алар Жуңгар баскынчыларына каршы күрөшкөн. Кыргыздар XVII кылымдын 60-жылдарынан баштап ХГХ кылымдын 60-70-жылдарында Орусия Кыргызстанды каратып алганга чейин, Кокон хандыгынын эзүүсүнө каршы күрөшүп келген. Чет элдик баскынчыларга көз каранды болсо да, кыргыздар уруу бирикмелеринин башкаруусунда болгон. Өздөрү шайлаган хандарына же уруу башчыларына баш ийген. Куралдуу күчтөрү, жигиттери болгон. Мамлекттик аппараты болбосо да, улуттук бийлик өкүм сүргөн. Сот бийлигин бийлер жана казылар аткарган."},{"t":"p","h":"Кайталоо үчүн суроолор % 1. Байыркы кыргыз мамлекети жана анын жайгашкан жерлери."},{"t":"p","h":"2. Байыркы кыргыздардын бийлик системасы жана алардын баскыч-"},{"t":"p","h":"тарга бөлүнүшү."},{"t":"v","l":["1 3. Эне-Сай кыргыз мамлекети. Барсбек.","4. Кыргыз кагандыгынын Уйгур кагандыгын кулатышы.","5. Улуу Кыргыз Дөөлөтү жана анын ээлеген аймагы.","6. Улуу Кыргыз Дөөлөтүнүн башкаруу системасы."]},{"t":"p","h":"7. Берилген теманы жана кошумча булактарды пайдаланып төмөндөгү"},{"t":"p","h":"кластер табышмакты аткар?"},{"t":"v","l":["<span class=\"pg\" data-n=\"17\">17<\/span>Улуу кыргыз дөөлөтү","","Дептериңерге кластер табышмакты аткаргыла.","","Улуу Кыргыз","мамлекетинин","башында","Каган турган","","Бул аталышты академик","В. В. Бартольд 1927-жылы","«Кыргыздар тарыхый","очерк» китебинде берген"]},{"t":"h3","h":"Улуу Кыргыз Дөөлөтү"},{"t":"v","l":["Сангун – аскер,","Укук маселесин","тейлеген","Бойладан кийин","Иарган – өкүмдү","аткаруучу турган."]}],"sub":[{"title":"МЕН – КЫРГЫЗМЫН","b":15},{"title":"Улуу Кыргыз Дөөлөтү","b":24},{"title":"Улуу Кыргыз Дөөлөтү","b":38}],"section":"АДАМ, КООМ, МАМЛЕКЕТ ЖӨНҮНДӨ ТҮШҮНҮК ЖАНА КЫРГЫЗСТАН МАМЛЕКЕТТҮҮЛҮГҮНҮН ТАРЫХЫ","pages":[13,17]},{"title":"§ 4. КЫРГЫЗСТАНДА УЛУТТУК МАМЛЕКЕТТИН ТҮЗҮЛҮШҮ","blocks":[{"t":"h3","h":"§ 4. КЫРГЫЗСТАНДА УЛУТТУК МАМЛЕКЕТТИН ТҮЗҮЛҮШҮ"},{"t":"v","l":["Т үш үнүктөр:",". Кыргыз АОнун түзүлүшү.","* Кыргыз АССРинин түзүлүшү.","* Кыргыз ССРинин түзүлүшү.","* Көз карандысыз Кыргызстан.","Негизги. даталар:","* 1922-жылы 80-декабрда СССР түзүлгөн."]},{"t":"p","h":"* 1924-жылы 14-октябрда Кара Кыргыз Автономиялуу облусу түзүлгөн."},{"t":"h3","h":"(БИБЛИОТЕКА!"},{"t":"p","h":"уы Сїй"},{"t":"p","h":"<span class=\"pg\" data-n=\"18\">18<\/span>* 1926-жылы 1-февралда Кыргыз Автономиялуу ССРи түзүлгөн."},{"t":"p","h":"* 1986-жылы 5-декабрда СССРдин 2-Конституциясында Кыргыз ССРи жарыяланган."},{"t":"p","h":"*1925-1927-жылдары сессияда Борбордук Аткаруу Комитетинин Президиумунун Төрагасы болуп А. Орозбеков дайындалган."},{"t":"p","h":"*1927-жылы мартта Әл Комиссарлар Совети түзүлүп, төрагалыкка Ж. Абдрахманов дайындалган."},{"t":"p","h":"* 1990-жылы 29-октябрда (Кыргыз ССР Жогорку Советинин сессиясында) А. Акаев Кыргызстандын тунгуч Президенти болуп дайындалган."},{"t":"p","h":"* 1990-жылы 15-декабрда Кыргыз Республикасынын эгемендүүлүгүнүн декларациясы кабыл алынган."},{"t":"p","h":"* 1991-жылы 81-августта «Мамлекеттик көз карандысыздык декларациясы» кабыл алынган."},{"t":"p","h":"Тапшырма:"},{"t":"p","h":"‚Ата Мекенди ким кандай түшүнөт? Дептерге беш-алты мисал келтирип жаз, аргументтеп айтып бер."},{"t":"p","h":"* Текстти окуп Манас баатыр жана анын акыл кошчуларынын өз эли-жерине болгон мамилесин ачып көрсөт."},{"t":"p","h":"Манас баатырдын портретин түз."},{"t":"p","h":"Манас баатыр менен анын Кошой, Бакай, Сыргак, Чубак, Алмамбет сыяктуу баатырларынын сыйынып, туу тутканы, эл жана Мекен, алардын биримдиги менен боштондугу, ошондой эле кыргыз элинин кызыкчылыгы, Ата Журттун ар намысы болуп эсептелет. Ошондуктан «Ала-Тоо артык жер үчүн, ак калпак кыргыз эл үчүн, жанымды курман чалайын!» – деп айтышканы бекеринен эмес. Же болбосо, көк жал Манас баатырдын: Калкым кыргыз сен үчүн, курман болуп кетейин» – деп айтканын эскерсек да ашык болбойт."},{"t":"p","h":"* Кыргызстанда улуттук мамлекеттин негизделишинин тарыхый маанисин айтып бер."},{"t":"p","h":"* Кыргыз элинин улуу акыны А. Осмонов бул ыр саптарында өз Ата Журту тууралуу эмне жөнүндө айткысы келген. Сен дагы ушул сыяктуу ой тилегинди айта алаар белең?"},{"t":"h3","h":"АТА ЖУРТ"},{"t":"p","h":"Жазда башка, жел тийбесин абайла, Көпкө турбас мобул турган сур булут."},{"t":"p","h":"<span class=\"pg\" data-n=\"19\">19<\/span>Бүт дартыңды өз мойнума алайын, Сен ооруба мен ооруюн, Ата Журт."},{"t":"p","h":"Октябрь Революциясынан кийин Орто Азияда контрреволюциячыл күчтөр жана басмачылык кыймылдар күч менен басылып, бул региондо жашаган элдерди улуттук мамлекеттерге бөлүү мүмкүнчүлүгү түзүлгөн. 1922-ж. 80-декабрда Советтердин Бүткүл Орусиялык 1Ї съезди РСФСР, Украина, Белорусия жана Закавказия Федерациясын бириктирип, Советтик Социалисттик Республикалар Союзу – СССР түзүлдү деп жарыяланган."},{"t":"p","h":"Түркстан АССР Советтеринин 1924-жылдын 31-январында өткөн П съездинде Кыргыз делегаттары Кыргызстанды өзүнчө автономия катары түзүүнү суранышкан. Көп өтпөй РСФСРдин Бүткүл Орусиялык Борбордук Аткаруу Комитетинин (БАК) Орто Азия элдерин улуттук мамлекеттерге бөлүү жөнүндө токтому чыккан. Ага ылайык 1924-жылы 14-октябрда Россиянын курамында Кара Кыргыз Автономиялуу облусу түзүлгөн. Борбордук Аткаруу Комитетинин 1925-жылдын 25-майындагы чечими менен ал кайрадан Кыргыз Автономиялуу облусу (КАО) деп өзгөртүлгөн. Облус түзүлгөндөн кийин Кыргызстанда партиялык жана советтик бийлик органдары түзүлгөн. РКП(б) Кыргыз обкомунун 1-катчылыгына М. Каменский, 2-катчылыгына Ж. Абдрахманов, ревкомдун төрагалыгына И. Айдарбеков дайындалган."},{"t":"p","h":"Ал эми 1926-жылы 1-февралдагы БАКтын чечимине ылайык КАОнун ордуна Кыргыз Автономиялуу Советтик Социалисттик Республикасы түзүлгөн (Кыргыз АССРи)."},{"t":"p","h":"1986-жылы 5-декабрда СССРдин экинчи Конституциясы кабыл алынган. Бул Конституция боюнча Кыргыз АССРи Кыргыз ССР деп аталып, СССРдин курамына тең укуктуу Союздук Республика катары кирген."},{"t":"p","h":"Бул окуя Кыргыз элинин мамлекеттүүлүгүнүн тарыхындагы чоң жетишкендик болгон."},{"t":"p","h":"Кыргызстанда улуттук мамлекетти түзүүдө А. Сыдыков, Ж. Абдрахманов, Б. Исакеев, А. Орозбеков, И. Айдарбеков ж. б. чоң эмгек сиңиршкен."},{"t":"h3","h":"Көз карандысыз Кыргызстан"},{"t":"p","h":"1990-жылы мартта СССР эл депутаттарынын Ш съезди, өлкөдө президенттик бийликти киргизүүнү белгилеген. Ошентип <span class=\"pg\" data-n=\"20\">20<\/span>1990-жылы 27-октябрда Кыргыз ССР Жогорку Советинин сессиясында А. Акаев Кыргызстандын туңгуч Президенти болуп шайланат."},{"t":"p","h":"1990-жылы 15-декабрда Кыргыз ССР Жогорку Советинде Кыргыз Республикасынын Мамлекеттик-эгемендүүлүгү жөнүндөгү Декларация кабыл алынып, Кыргызстан СССРдин курамындагы эгемендүү өлкө болуп калат."},{"t":"p","h":"1991-жылы 12-октябрда жалпы элдик шайлоодо А. Акаев КРнын Президенти болуп шайланган."},{"t":"p","h":"1991-жылы 8-декабрда Минск шаарына жакын Беловеж токоюнда Өкмөттүк резиденцияда Беларусь, Украина Республикаларынын жана Россия Федерациясынын жетекчилери жолугуп, көз карандысыз мамлекеттердин шериктештигин түзүү келишимине кол коюшкан. СССР таркай баштаган."},{"t":"p","h":"Ошол эле жылы 21-декабрда Алматыда көз карандысыз мамлекеттердин шериктештигинин (КМШ) түзүлүшү менен СССР кулаган."},{"t":"p","h":"Кыргыз Республикасынын Президенти А. Акаев 2002-жылы 20-сентябрда БУУнун 57-сессиясында Кыргыз мамлекетинин 2200 жылдыгын таануу жана Әл аралык статус берүүсүн суранып доклад жасаган. Ошого байланыштуу БУУ өзүнүн сессиясында «Кыргыз мамлекеттүүлүгүнүн 2200 жылдыгын жалпы белгилөө» жөнүндө резолюция кабыл алынган. Ошентип 2008-жылы августтун аягында Кыргыз мамлекеттүүлүгү белгиленип, Дүйнөлүк кыргыздардын курултайы өткөрүлгөн (81-август)."},{"t":"p","h":"Кыргыз Республикасынын Жогорку кеңеши, 1991-жылы 81-августта «Мамлекеттик көз карандысыздык декларациясын» кабыл алат."},{"t":"p","h":"Ошентип үч миңдеген жыл тарыхы бар кыргыз эли эгемендүүлүккө ээ болгон мезгилде, акылман Кошойдун Манас баатырга айткан кеңешин эске салалы:"},{"t":"p","h":"«Үзүлгөндү улайлы, чачылганды жыйнайлы, жоголгонду табалы, азган-тозгон аз элге, оо балам караан болуп туралы» – дейт. Бул айтылган акыл сөздөр Кыргызстан эгемендүүлүккө ээ болгондон кийин да өз маанисин, терең максатын жоготкон жок."},{"t":"p","h":"Тээ илгертен бери ата-бабаларыбыздын мына ушундай эл жерге берилген чексиз патриоттук сезими кыргызды, Ала- Тоону жоготпой, тарыхтын кыйын кезинде да сактап алып келген. Анткени, эркин жериң болсо, эркин элиң болсо, өз <span class=\"pg\" data-n=\"21\">21<\/span>тагдырыңа өзүң кожоюн болсоң гана, сен сыймыктуу, бактылуу адамсың. Биздин эркиндигибиз – эң башкы байлыгыбыз. Ошондуктан, Кыргызстандын эгемендүүлүгүн көздүн карегиндей сактоо бардыгыбыздын жарандык милдетибиз."},{"t":"p","h":"Кайталоо үчүн суроолор % 1. КРнын түзүлүшү жана анын биринчи Конституциясынын кабыл алы- нышы."},{"t":"p","h":"2. Кыргыз Улуттук мамлекетинин өнүгүү жылдары."},{"t":"p","h":"253. Кыргыз Улуттук мамлекетинин эң алгачкы жетекчилеринен болуп"},{"t":"p","h":"кимдер, качан дайындалган?"},{"t":"p","h":"4. КРнын мамлекеттик көз карандысыздыкка ээ болушу жана анын"},{"t":"p","h":"тарыхый мааниси. (Эссе 10 мин.)."}],"sub":[{"title":"(БИБЛИОТЕКА!","b":3},{"title":"АТА ЖУРТ","b":19},{"title":"Көз карандысыз Кыргызстан","b":28}],"section":"АДАМ, КООМ, МАМЛЕКЕТ ЖӨНҮНДӨ ТҮШҮНҮК ЖАНА КЫРГЫЗСТАН МАМЛЕКЕТТҮҮЛҮГҮНҮН ТАРЫХЫ","pages":[18,21]},{"title":"§ 5. КЫРГЫЗ РЕСПУБЛИКАСЫНЫН КОНСТИТУЦИЯСЫ","blocks":[{"t":"h3","h":"§ 5. КЫРГЫЗ РЕСПУБЛИКАСЫНЫН КОНСТИТУЦИЯСЫ"},{"t":"v","l":["Т үш үн үктөр:",". Конституция.","+ Конституциянын формалары.","Негизги. даталар:"]},{"t":"p","h":"1787-ж. 17-сентябрда АКШда Конституция кабыл алынган."},{"t":"p","h":"1929-ж. 80-апрель Кыргыз АССРинин биринчи Конституциясы."},{"t":"p","h":"1987-ж. 28-март Кыргыз ССРинин Конституциясы. 1978-ж. 20-апрель Кыргыз ССРинин Конституциясы. 1998-ж. 5-май Кыргыз Республикасынын Конституциясы. Тапшырма:"},{"t":"p","h":". Конституция деген эмне, ал бизге эмне үчүн керек?. Конституцияга чейин эл эмненин негизинде жашаган, аларды кимдер кабыл алган жана ишке ашырган?"},{"t":"p","h":"* Конституциянын негизги мыйзам экендигин далилдеген 5—6 мисал келтир."},{"t":"p","h":"Конституция – мамлекеттин негизги мыйзамы болуп эсептелет. Конституция мамлекеттин түзүлүш формасын, адамдын укугун жана эркиндигин, жарандын укук милдеттерин, мамлекеттик органдар системасын, сот адилеттигин, шайлоо системасын уюштурууну аныктайт (ушул параграфтагы схеманы кара)."},{"t":"p","h":"<span class=\"pg\" data-n=\"22\">22<\/span>«Конституция» – деген сөз латын сөзүнөн алынган. Которгондо – «орнотуу, түзүлүш» дегенди билдирет. Конституция мамлекеттик башка нормативдик актыларга караганда жогорку укуктук күчкө ээ. Укуктук акт катары биринчи конституция АКШда 1787-жылы 17-сентябрда кабыл алынган."},{"t":"p","h":"Буржуазиялык революциялар феодалдык коомдук мамилелерди жеңип чыккандан кийин түзүлгөн мамлекеттер өз конституциясын кабыл алышкан (2-тиркеме, 134-135-6.)."},{"t":"p","h":"Азыркы кездеги демократиялык өлкөлөрдүн конституцияларында жарандын демократиялык укуктары жана эркиндиктери (шайлоо укугу, иш таштоого, саясый партияларды түзүүгө укуктуулук) жарыяланган. Конституциялар формасы боюнча экиге бөлүнөт. Биринчиси, белгилүү бир схемага жараша түзүлгөн бирдиктүү документ түрүндө, экинчиси, ар түрдүү мыйзамдардын жыйындысы (Улуу Британия, Жаңы Зеландия, Израилдин конституциялары жок)."},{"t":"p","h":"Конституциянын өнүгүү тарыхы"},{"t":"v","l":["Кыргыз ССРнин Конституциясы","1987-жыл 28-март","","Кыргыз ССРинин Конституциясы","11 глава жана127 беренеден турган","","1-глава. Коомдук тузулуш.","","2-глава. Мамлекеттик түзүлүш.","","3-глава. Кыргыз ССРинин","Мамлекеттик жогорку органы.","","4-глава. Кыргыз ССРинин","Мамлекеттик башкаруу органы.","","5-глава. Мамлекеттик бийликтин |","жергиликтүү органы.","6-глава. Кыргыз ССРинин","бюджети.","","7-глава. Сот жана прокуратура.","","8-глава. Жарандардын негизги","укуктары жана милдеттери.","","9-глава. Шайлоо системасы.","","10-глава. Герб, желек, гимн.","","11-глава. Конституцияны","өзгөртүү тартиби."]},{"t":"p","h":"<span class=\"pg\" data-n=\"23\">23<\/span>түрүндө болот. Конституция конституциялык комиссия тарабынан иштелип чыгып, бүткүл элдик талкууга коюлат. Кыргыз Республикасынын Конституциясы Республиканын коомдук, саясый жана экономикалык түзүлүшүнүн негиздерин бекитет. Биринчи жолу 1929-жылы 80-апрелде Кыргыз АССРинин П съездинде Кыргыз АССРинин Конституциясы кабыл алынган. 1987-жылы 20-мартта республикалык Советтердин чукул чакырылган V съездинде Кыргыз ССРинин Конституциясы кабыл алынган. Ушул Конституциянын принциптерин, сактап, айрым толуктоолор жана өзгөртүүлөр менен 1978-жылы 20-апрелде Кыргыз ССРинин Конституциясы кабыл алынган."},{"t":"v","l":["Кыргыз ССРнин Конституциясы","1978-жыл 20-апрель","19 главадан, 10 бөлүмдөн, ч 172 беренеден турган.","","1-бөлүм. Кыргыз ССРинин","жүргүзгөн саясатынын жана","коомдук түзүлүшүнүн","негиздери.","","2-бөлүм. Мамлекет жана","инсан.","","и Кыргыз","улуттук-аймактык жана","административдик түзүлүшү.","","4-бөлүм. Эл депуттарынын","совети жана аларды шайлоо.","","5-бөлүм. Кыргыз ССРинин","Мамлекеттик бийлигинин","жогорку органы жана","башкармалыгы.","6-бөлүм. Кыргыз ССРинин","башкаруучу жана","жергиликтүү","органдарынын бийлиги.","","7-бөлүм. Кыргыз ССРинин","экономикалык жана","социалдык өнүгүүдөгү","мамлекеттик планы.","","8-бөлүм. Сот акыйкаттыгы,","арбитраждык жана","прокурордук көзөмөл.","","9-бөлүм. Кыргыз ССРинин","герби, желеги, гимни","жана борбор шаары.","","10-бөлүм. Кыргыз ССРинин","Конституциясынын иш","арак

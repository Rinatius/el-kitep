болду. Аярдай турган мезгил эмес, айланасын биртике байкап алды да, иттин үнү чыккан жакты боолгой бир коктуча менен сойголоп төмөн кирип кетти."},{"t":"v","l":["1 жалгыз аяк жол – тропинка","2 эрбеңдеп бир жөө (жөө киши) – приближается пеший человек","3 болжогон жерге – до нужного места","4 күүгүм кирип – вечерело (стемнело)","5 шыпылдай басып – мында: шагая быстро","6 салаңдаган тумшук – предгорье, спускающееся вниз"]},{"t":"p","h":"<span class=\"pg\" data-n=\"122\">122<\/span>Ойлогондой эле жаңы тумшуктун түшө калган жеринде жалгыз үй бар экен. Барды. Бирок мунун максатына түшүнө койгон соң бир орто жашаган аял кечикпей үйдөн чыга калды."},{"t":"p","h":"– Байбиче, бир түн улагаңарга жатып кеткенден өзгөгө залалым жок. Менден бир жаман санаа болуп, бирдеме тийет деп ойлобоңуз, – деди бала бир топ сөздөн кийин. Аял карарып алды:"},{"t":"p","h":"– Ошол айтарым. Эрте күндө таап ал, бара турган жериңди."},{"t":"p","h":"– Барар жерим болсо мында келип турар белем, жарыктык? Ушундай дегенинде:"},{"t":"p","h":"– Ботом, мени менен жаакташкандай сен кайдагы неме элең!- жеп жаңкыдан катуулап коё берди. Болсо, болбосо жана бир айтып калайын дегендей кылып бала:"},{"t":"p","h":"– Эң курбаса береги суудан кечирип койбойсуңарбы?- деди."},{"t":"p","h":"– Жанынан аша кечкен эле киши болбосо, ушул күкүктөп жаткан суудан ат эмес, төө да... Айтыш эми созулган жок. Үйдөн бала бир топ узап калган ченде:"},{"t":"p","h":"– Ушуну бекер кылдыңар ... Бир мусапыр көрүнөт ...- деген бирөөнүн кебин кулагы чалып калды. Асман ачык болгон менен жер караңгы. Теке маңдайда бир сары жылдыз бөтөнчө жаркырап турат. Бала кайда барарын билбей, саздак жер менен төмөн карай суу бойлоп келе жатып, бир оокумда күшүлдөп оттоп жүргөн жалгыз өгүзгө жолукту. Мурунтугу жок. Белиндеги кендирди чечип, мүйүздөн чалды да илгирбей ыргып минип алды."},{"t":"p","h":"Суу кирип жатканы чын экен. Түсү күпкүрөң коюу. Тобокел деди. Сайроо көрүнбөйт, эмнеси болсо да ушул жер кечүү чыгар деп бир жайыгыраак жерге келип катуу-катуу камчыланып алды."},{"t":"p","h":"Жээктен эки саржандай узаган кезде баланын жоон санына чейин муздай түшүп, эми өгүздүн мүйүзү гана кылкылдап көрүнүп бараткандай болду..."},{"t":"v","l":["1 карарып (көгөрүп) алды – разозлилась","2 эң курбаса (эң болбосо, жок дегенде) – хотя бы","3 жанынан аша кечкен киши мында: только отчаянный человек","4 күкүктөп жаткан суу – бурлящая река","5 мусапыр – несчастный, безобидный","6 теке маңдайда (бет маңдайда) – мында: напротив, навстречу","7 илгирбей (буйдалбай) ыргып минип алды – решительно вскочил и сел","8 эки саржандай – примерно две сажени"]},{"t":"p","h":"<span class=\"pg\" data-n=\"123\">123<\/span>Бул бала мындай. Бир жылы, күзүндө Зарлык Ырдыкта бир топ бай дунганга малай жүргөн жеринен чыгып келип, Акматжан аттуу Жети-Өгүздүк татарга туруп калды. Акматжан – дүйнө жагынан бир болуш элге татырлык, байлыгы дубанга маалым адам. Жалаң өгүзү сексен."},{"t":"p","h":"Зарлыктан чоңураак да бир малай экөө керел кечке тынбай отун ташыр эле. Ошондо суткасына тамагы – кайнаган ак суу менен алакандай кара нан. Булар ошентип эч болбосо күнүнө бир убак тамакка жарыбай, ачыгып, азып жүргөндө килкилдеген козунун этин тууратып туруп, жүнү жылтылдаган иттерине берилүүчү."},{"t":"p","h":"Не керек, ачарчылык менен чектен ашкан кыйноонун акыры Зарлыкты мындан да куйрук түйшүкө муктаж кылды. Кыштын орто чени. Үстүндө жалгыз эски көйнөгү бар эле, чечтирип калды."},{"t":"p","h":"Ар кай жерди чалып көрүп, бул чөйрөдө күн өтпөсүнө көзү жеткен соң, эми Түпкө барып көрөйүн деген ой менен бир күнү Бөрубаштын шилисинде чоң жолго салып ээнде келе жатты. Күн ылдыйлаган сайын суук күчөп коркунуч көбөйүп келет. Талаага түнөгөн адам тоңуп өлө турган."},{"t":"p","h":"Зарлык жүрүп келип, бир жонго чыга бергенинде, жарты чакырымдай жерден алды жагынан дыр коюп келе жаткан араба көрүнө түштү. Чеккени кош ат. Төрт-беш адамы бар."},{"t":"p","h":"Зарлыкты көрүп акырындап калгандай болду. Бирөө кол булгайт."},{"t":"p","h":"Булардын түрүн байкай койду да, жолдун тескери кеткен бир айрылышына түшүп ылдамдай берди."},{"t":"p","h":"Зарлыктын тушуна келе берген ченде, арабадан үч адам ыргып-ыргып түштү эле, ал жаңкы жолунан да чыга качты. Кар тизеден. Бутунда кийиз өтүктүн башмагы бар. Колунда жоон жыгачы бар, эңгирдей бирөө кесек арыштап, кыйрата сөгүп чуркап келе жатканы бөтөнчө көрүндү. Башмагына кар толуп бутунан ыргып кетип, буйдала түшүп Зарлык да жөнөп барат."},{"t":"p","h":"1 тамакка жарыбай, ачыгып – не располагая обилием пищи, проголодались"},{"t":"v","l":["2 килкилдеген козунун эти – мында: жирное мясо ягненка","3 көзү жеткен соң – убедившись","4 Борубаштын шилисинде (кырында) – мында: шею Борубаша (повернул)","5 тоңуп өлө турган – умирающий от холода","6 жарты чакырымдай – примерно полкилометра","7 чеккени кош ат – запрягал (в телегу) два коня","8 кесек арыштап, кыйрата сөгүп – широко шагая, матерясь"]},{"t":"p","h":"<span class=\"pg\" data-n=\"124\">124<\/span>Эми бир аз кууганда булар жетмек эле. Ары курсак ач, ары муун жок, ооздон кара суу келип, шайман кетип калган. Бул сырды тигилер билбесе керек, бир топ кууп келе түшүп, кайра тартышты. Ошол жерде Зарлыктын алы куруп жатып калды."},{"t":"p","h":"Аңгыча болбой, арт жактан келе жаткан жалгыз аттуу жана бир арабага кез болду. Аны көрүп, чочуюн дегенде бул адам атын токтотуп коюп тийбей турганын, кайта жаны ачып айтып чакырып алды."},{"t":"p","h":"– Алар өлтүрөм деп ойлогон...... Баары мас, шайтандар...... Ай, байкуш......"},{"t":"p","h":"Киши Сары-Көлдүк экен. Үйүнө күүгүм кире келишти. Бар тамагын аяган жок."},{"t":"p","h":"Зарлык кетер күнү бу киши малай ала турган барбы деп, өзү турган көчөнү бүтүн кыдырып чыгып, жедеп амалы курганда жайын айтты да, түшкө жакын арабасына салып бир топ узатып койду."},{"t":"p","h":" учу-кыйырына көз жетпеген бир мейкин эле – это было бесконечное пространство."},{"t":"p","h":"эртерээк – пораньше. Мен ...... чыктым. Зарлык ...... чыккан. Сен эртелеп чыктың."},{"t":"v","l":["айтыш – спор, словесное состязание.","асман ачык – небо ясное. Асман ....... Асман булутсуз."]},{"t":"p","h":"күшүлдөп оттоп жүргөн жалгыз өгүз – пыхтя, пасся одинокий вол. Өгүз ...... оттоду. Орозкул ...... чоң киши,"},{"t":"v","l":["чалып (байкап) көрүп – мында: осмотрев.","ыргып түштү эле – когда спрыгнул (с телеги).","кар тизеден – снег по колено.","булар жетмек эле – они догнали бы.","","1 ооздон кара суу келип – мында: от голода тошнило","2 алы куруп – обессилев","3 аңгыча болбой – вдруг","4 арабага кез болду – мында: встретился с телегой (навстречу вышла телега)","5 тийбей турганын айтты – сказал, что не тронет","6 баары мас, шайтандар – черти, ... все пьяные"]},{"t":"p","h":"7 жедеп амалы курганда (айласы кеткенде) – мында: когда не осталось другого выхода <span class=\"pg\" data-n=\"125\">125<\/span>чочуп качайын дегенде – когда испугавшись, хотел убежать. Зарлык арабаны көрүп ...... ...... деп ойлоду."},{"t":"p","h":"кайта жаны ачып – но опять пожалев. Китепти ...... оку. Нурбектин ...... күйдү. Камыр ...... чыкты."},{"t":"p","h":"аяган жок – не пожалел. Тамагын аябады. Тагдыр Зарлыкты аяган жок. түшкө жакын – ближе к обеду. Түш жакындаганда узат."},{"t":"p","h":"узатып койду – проводил. Түшкө жакындаганда узатты."},{"t":"h3","h":"II. «Жаңы тартип» окуусунда"},{"t":"p","h":"... Үч жыл ушундай чарбысынга түшүп, бул убактын ичинде он бир жерден которулду."},{"t":"p","h":"Акыркы жолу Жылуу-Булакта болчу. Бу кезде журт мурункусунан бир топ торолгонсуп калган экен."},{"t":"p","h":"Ушул жылы жер-жерге «Жаңы тартип» окуусу деген жайылган. «Жаңы тартип» окуусу өмүрүндө биринчи жолу угуп отурган кеп. Адагенде бул тууралуу журт ичинде не сөз болбоду: – Илгери аптиек, куран окуйт дечү эле. Эми кызык: «мугалим ... аяк, табак, казан ... биринчи, экинчи ...»"},{"t":"p","h":"Жылуу-Булактын оюна төрт, беш сапар барып жедеп айласы кеткенде, мугалимдерге беделдүүрөөк бир баланы арага салып жатып араң өткөндөй болду. Өмүрүндө от жагылбаган, терезелерине жыртык кагазды кураштырып, чаптап койгон бир тамда, жерге жасалган өңгүл-дөңгүл скамейкаларда колдорун үйлөп, көк муштум болуп отурган балдар..."},{"t":"p","h":"Зарлык «окууга» кирип кеткенден кийин, тууганы үйүнөн кууп салган. Эртерээк сүйлөшүп коюп, күндө бир баланы ээрчип барып конуп келмей. Бардык азап-тозогуна кайыл, окуудан калбаса болду! Жылуу-Булактагы «Жаңы тартип» көп узабай, жаз чыгарга жакын тарап кетип, Зарлык арманда калды."},{"t":"p","h":"1 чарбысынга түшүп – мында: ходить в лишениях 2 торолгонсуп (мында: онолгонсуп, тыныгансып) – казалось, жизнь улучшилась 3 Жылуу-Булактын оюндагы (төмөн жагындагы) – мында: находящийся внизу Джылуу-Булака."},{"t":"v","l":["4 арага салып – через чье-либо посредство","5 от жагылбаган – где не топилось","6 өңгүл-дөңгүл скамейкаларда – на неровных скамейках"]},{"t":"p","h":"<span class=\"pg\" data-n=\"126\">126<\/span>Эмки дарты – Каракол. «Казыналык окуу!»"},{"t":"p","h":"Алиги күүгүм талаш Тасманын белинде келе жаткан себеп ошол болучу."},{"t":"v","l":["өмүрүндө биринчи жолу – первый раз в жизни.","кеч калдың – опоздал. Бүгүн сабактан ...... ......"]},{"t":"p","h":"беделдүүрөөк – авторитетный. Класста ...... баланы староста шайлайбыз. көк муштум – посиневшие от холода. Сууктан ...... ...... болгон балдар. Эдил чоң ...... бала."},{"t":"p","h":"кууп салган – выгнал."},{"t":"p","h":"бардык азап-тозогуна кайыл – согласен (на все) муки. Зарлык аябай ...... тартат. Тиги дүйнөдө ...... бар дешет, Чынтемир ачка-токко ... жүрө берет. тарап кетти – разошлись."},{"t":"v","l":["күүгүм талаш – мында: когда наступили сумерки.","","1. Тасманын талаасындагы караан кайда баратты?","2. Тумшуктун учундагы үйдүн ээси менен кандай сүйлөшүү жүрдү."]},{"t":"p","h":"3. Суудан кантип өттү? Бул бала ким эле, кандай күндөрдү башынан өткөрдү."},{"t":"p","h":"4. «Жаңы тартип» окуусуна кантип өттү?"},{"t":"p","h":"Эсиңерге түйүп алгыла!"},{"t":"p","h":"Автордун төмөнкү санжыргалуу сөз берметтерин дептериңерге көчүрүп алып, оозеки кебинерге жана жазуу ишиңерге пайдалангыла: эрбеңдеп, учу-кыйырына көз жетпеген бир мейкин, лакылдап жүрүп отуруп, салаңдаган тумшук, боолгой, коктуча, улагаңарга, күкүктөп жаткан суу, тобокел деди, куйрук түйүү, муун жок, ооздон кара суу келет."},{"t":"p","h":"1. I–II–III бөлүмдөрдү көңүл коюп окуп чыгып, кыргыз элинин турмушундагы кайсыл мезгил сүрөттөлүп жатканын байкап-баамдагыла. Ал мезгил жөнүндө кандай тарыхый окуяларды билесинер эстегиле."},{"t":"p","h":"2. «Зарлыктын жана менин балалык чагым» деген темадагы дилбаян жазууга камдангыла."},{"t":"p","h":"3. Төмөнкү сүйлөмдөргө тиешелүү сөздөрдү таап койгула:"},{"t":"p","h":"Жалгыз Акматжан ...... ...... ...... . Тасманын талаасын ...... ...... . Зарлык мындай баса берди да ...... ...... ...... алдынан чыкты. Буга ...... башка ...... бала. Ал турганы ...... ...... акыл айтып берер эле. Зарлык ....... ...... кала берди."},{"t":"p","h":"1 эмки дарты (мында: эмки максаты – следующая мечта (цель) 2 тасманын белинде – на перевале (отроге) Тасмы"},{"t":"h3","h":"<span class=\"pg\" data-n=\"127\">127<\/span>III. «Казыналык окууга» өтүүнүн кыйынчылыгы"},{"t":"p","h":"Жаш кезде бардык үмүт, максат – келечек. Үч-Кошкон базарында журт сейилдеп калган кез. Бир кызыл дүкөндүн оң бурчунда Зарлык бир жолдошуна кез болду. Окуунун пайдасын «үгүттөп» муну бир кезде элден бездиртип чыккан Зарлык эле. Азыр да ошону иштеди. «Армансыз бололу, күдөр үзбөйлү», – деди. Тиги бала ойлонуп калды."},{"t":"p","h":"Экөө бул сапар Союз кошчудан башташты. Эшик алдына катар орноткон эки мамыга лык толуп, уйгу-туйгу байланып турган аттар. Жалтыраган ээр-токум, баркыт көрпөчөлөр турат. Сыртта камчысын колуна, колтугуна кыса экиден, үчтөн болуп бөлүнүп, өз ара сүйлөшүп отургандар да бар."},{"t":"p","h":"– Эмне кылчактайсың, жүр! – деди Зарлык, артына кылчайып. Тынбай кирип чыгып жүргөн эл. Очойгон сүрдүү кара мурут жигитти тегеректей төрт-беш адам турган экен."},{"t":"p","h":"Акырында баары кетип мекеме жабыла турган мезгил да жакындаган эле. Ошол убакта Зарлык айтып жаткан сөзгө да кулак салбай, тиги киши столдо жаткан бир кагазга үңүлдү. Ошенткенде Зарлык жолдошун мындай тур деп түртүп, алдыга чыгып жакындап келди да:"},{"t":"p","h":"– Биз баятан сизге келип турабыз,- деди, басыраак дабыш менен."},{"t":"p","h":"– И, эмне жумуш? – деди кара мурут кабагын чытып. Келгенден бери буларга биринчи жолу караганы ушул."},{"t":"v","l":["– Эмне болсун, окуу......","– «Окуу жок» деп, бая күнү эле айтпадым беле? Эмне?"]},{"t":"p","h":"1 журт сейилдеп калган (эл сээлдеп) калган кез – мында: время, когда людей стало меньше"},{"t":"v","l":["2 оң бурчунда (оң бурчунан) – в правом углу","3 үгүттөп – агитируя","4 лык (жык) толуп – мында: полно","5 камчысын колтугуна кыса – зажав плетку под мышкой","6 артына кылчайып – оборачиваясь (оглядываясь) назад","7 очойгон, сүрдүү – мында: большой, грозный","8 тегеректеп – окружив"]},{"t":"p","h":"9 мекеме жабыла турган мезгил – время, когда закрывается учреждение (контора) 10 бир кагазга үңүлдү (карады) – всмотрелся в одну бумагу"},{"t":"v","l":["11 алдыга чыга жакындап келди – опережая, приблизился","12 басыраак дабыш менен – тихим голосом"]},{"t":"p","h":"<span class=\"pg\" data-n=\"128\">128<\/span>– Сизден угарыбыз ушул болсо – биз акыл айтар кишини таап келген экенбиз!.. «Жумуш кылгыла!» Он жылдан бери тынбай куураганыбыз аз келгенсип, дагы эле байлардын тезегин куя бергиле демексизби? Бул кайда, жаңкы «жетим-жесир» дегениңер? – деп, өзүнө жараша Зарлык да жаны күйгөн бойдон бир топ зилдүү сөздөр айтып жиберди."},{"t":"p","h":"Тиги болсо кер какшык күлкүгө салып «мыңк»этип койду да, бир кезде: Силерге окшогон жетим-жесирдин баарын жыйнай берсек казына түтөбү деги? – деди да, кагаздарын жыйнап кетишке камына берип."},{"t":"p","h":"Бул күнү Зарлык базардын аягында, чоң дүкөндүн бурчунда, бир оңтойлуу жерге түнөп калышка туура келди."},{"t":"p","h":"үмүт, максат – надежда, цель. ...... ...... – карматпайт. ...... ...... алдатпайт. элден бездиртип чыккан – мында: выманивший из народа,"},{"t":"v","l":["катар орноткон эки мамыга – прибитые рядом два столба.","өз ара сүйлөшүп отургандар – разговаривавшие между собой.","кулак салбай – не слушая (не обращая внимания).","кабагын чытып (бүркөп) – нахмурив брови."]},{"t":"p","h":"акыл айтар кишини таап келген экенбиз – нашли советника, оказывается. байлардын тезегин куя бергин демексизби – хотите сказать, чтобы опять богатым сушили кизяк."},{"t":"p","h":"бир оңтойлуу жерге түнөөгө туура келди – пришлось заночевать в подвернувшемся месте."},{"t":"h3","h":"IV. Отднаробдо"},{"t":"p","h":"Базардын борбор көчөсү менен батышты карай кеткенде чоң суунун боюнда бир бийикче келген, төбөсү тунукелүү кызыл үй бар эле. Бул Отднароб. Башка мекемелерден алыс да, жалгыз да. Муну Зарлык биринчи көрүшү."},{"t":"p","h":"1 жаны күйгөн бойдон – от возмущения (сильного) 2 казына түтөбү деги – мында: мамлекет түтөбү деги.- хватит ли денег у государства (или в казне)"},{"t":"v","l":["3 отнаробдо (эл агартуу бөлүмү) – отдел народного образования","4 чоң суунун боюнда – возле большой реки","5 төбөсү тунукелүү – на крыше у него кровельное железо"]},{"t":"p","h":"<span class=\"pg\" data-n=\"129\">129<\/span>Үстүнкү кабатына чыга бере, жүргөн элден жөн сурай, бир үйгө кирип барса, төркү терезе түбүндө, салмактуу келген гана бир адам отурган экен. Тиктеп отурган бирдемесин коё коюп, «кулагым сенде» дегендей шашпай гана салмак менен бурулуп койду да, кийин жагынан адамдын сыртына өтүп кетчүдөй акылдуу, сабырлуу көк көзү Зарлыктын бутунан башына чейин, бүткөн боюн бир сыйра карап өттү."},{"t":"p","h":"Мунун кыясын байкап алган соң Зарлык да кидирген жок. Тиги кыргызча шар кетпегени менен тилди дурус түшүнөт. Бул арага келгени бир айдан ашык болгонун, ошондон бери жүрүп эч бир жерге орношо албаганын, көргөн күнүн, өзү жетим экенин терип-тепчип, бир топ арыз-арманын сүйлөп келип аягында: Ушинтип, эми сизден гана бир айла болор деп келдим. Тагдырым сизде гана калды, – деди Зарлык."},{"t":"p","h":"Бул кезде Караколдо «казыналык окуу»деген жана интернат гана Зарлыктын дарты ушул экөөнүн бири. Булардан башка да бирин-серин курстар боло турган. Аларга жарабайт."},{"t":"p","h":"Ал сөзүн түгөткөндөн кийин, эми бардык абалына көзү жетип, түшүнүп болборун ойлонуп туруп мындай деди:"},{"t":"p","h":"– Бир айдан кийин кел... Сени..."},{"t":"h3","h":"V. «Интернатка...»"},{"t":"p","h":"Ошондон бир айдан кийин күткөн киши жалган түш ченде зорго көрүндү. Башка бир жакта бошобой жаткан окшойт."},{"t":"p","h":"– Баягыда келген бала мен эмес белем? Ошондо сиз...... – деп эсине салып баратканында тиги, «билем» дегендей башын ийкеп койду."},{"t":"v","l":["– Жашың нечеде? – Он жетиде.","","1 үстүнкү кабатына – мында: на верхний этаж","2 салмактуу келген бир адам – плотный человек","3 сабырлуу көк көзү – мында: терпеливыми голубыми глазами","4 кыясын (түрүн) байкап алган соң – заметив его вид","5 орношо албаганын – что не может устроиться","6 тагдырым, сизде гана калды – судьба моя в ваших руках","7 сөзүн түгөткөндөн кийин – когда он закончил свою речь","8 зорго (араң) көрүндү (келди) – еле появился"]},{"t":"p","h":"<span class=\"pg\" data-n=\"130\">130<\/span>Бир аз күймөлүп, ойлоно түшкөндөн кийин, ошол замат буйдалбастан алакандай кагаз жыртып калемин кармады."},{"t":"p","h":"Өмүрүндө бул үчүн арнап бирөөнүн калам тартканы ушул. Киши жазып болгондон кийин бир кезде:"},{"t":"p","h":"– Ме, интернатка бар. Ал базардын жогору жагындагы... – деп келе жатканда, ойгонгон адамдай селт эте түшүп, анын сөзүн түгөтпөй:"},{"t":"p","h":"– Билем,- деп жиберди, сунуп келаткан кагазын ылдам ала коюп."},{"t":"p","h":"Башчысын мурда сыртынан таанып калган. Жашы кырктардан өткөн, сакалын кырдырган, илгерки генералдардыкындай чычайган папироско ышталган сүрдүү сары муруту бар, чекир көз, бою казыктай типтик, арыкчырай келген адам. Аты Шинелин. Зарлыктын алдында сыртка чыгып келе жатыптыр. Көрөр замат апалактап барып колундагы кагазды суна бергенде биртике гана буйдалып кагазга көз жүгүртүп өттү да да кайра берди."},{"t":"p","h":"– Орун жок!"},{"t":"p","h":"Отднаробго кайра келди. Ошол жерден кидиребестен, жанакы жиберген киши:"},{"t":"p","h":"– Чакырып кел ошону, – деди. Учуп отуруп интернатка дагы жетти."},{"t":"p","h":"Бул сапар келгенде Шинелин араба чектирип бир жакка жүргөнү жатыптыр. Тиги чакырып келгенин айтты эле:"},{"t":"p","h":"– Азыр ошондой барабыз. Сен кете бер,- деди. Зарлык кайра тартып, эртең менен келип мекендеген баскычта күтүп отура берди."},{"t":"p","h":"Бул кезде түшкө жакындап калган. Эки көзү Шинелин келе турган көчөнүн жолунда."},{"t":"p","h":"Бир убакта чоң көпүрөнүн ары жагынан таанымал ак боз ат көрүнө түштү."},{"t":"v","l":["буйдалбастан – не задерживаясь","жазып болгондон кийин – когда дописал","ылдам ала койду – быстро взял","сыртынан таанычу – внешне был знаком","сакалын кырдырган – с бритой бородой","көз жүгүртүп өттү – окинул бегло взглядом","таанымал ак боз ат – знакомая серая лошадь"]},{"t":"p","h":"<span class=\"pg\" data-n=\"131\">131<\/span>Отднаробдун тушуна келе берип, аттын оозун калжайта тарта токтото коюп, арабадан түшүп, өзү менен бирге келген балага тизгинди кармата сала бери басканда Зарлык ордунан тура калып артынан ээрчий кирди. Шинелин кирип барар замат экөө сүйлөшө кетти. Бул кезде Зарлык орусчаны түзүк билбейт. Арасында «работа», «сирота» дегендей анда-санда гана кээ бири тааныш сөздөр кезигип жатты."},{"t":"p","h":"Отднаробдогу кишинин жеңгенин тилеп чыдамсыздык менен кыпылдап турат."},{"t":"p","h":"Ошондон аңгеменин баш-аягы беш минута да созулган жок:"},{"t":"p","h":"– Ну, жүр! – деп Шинелин бир кезде бурулуп караганды гана бир билет."},{"t":"p","h":"Сыртка чыккандан кийин отур дегендей кылып, көзү менен ымдап арабаны көрсөттү. Челпекте чөп чаап жаткан жерге бара жатышыптыр. Балдардын баары ошондо экен. Бул кезде Зарлыктын кубанганы ошондой арабага аркы-терки салып таштаган айрытырмоонун үстүндө мамыкта бараткандай болду..."}],"sub":[{"title":"II. «Жаңы тартип» окуусунда","b":42},{"title":"III. «Казыналык окууга» өтүүнүн кыйынчылыгы","b":67},{"title":"IV. Отднаробдо","b":86}],"section":"КАСЫМАЛЫ БАЯЛИНОВ","pages":[122,131]},{"title":"ЧЫГАРМАНЫН ИДЕЯСЫ ЖАНА ТЕМАСЫ ЖӨНҮНДӨ ТҮШҮНҮК","blocks":[{"t":"h3","h":"ЧЫГАРМАНЫН ИДЕЯСЫ ЖАНА ТЕМАСЫ ЖӨНҮНДӨ ТҮШҮНҮК"},{"t":"p","h":"Жазуучу изилдөө үчүн тандап алган турмуштук маселелер чыгарманын темасын түзөт. Ал эми чыгармадагы жазуучунун айтайын деген негизги ою чыгарманын идеясы деп аталат. М. Элебаев «Узак жол» романында үркүн темасын тандап алган жана өзүнүн тагдырын көркөм баяндаган. Ал ошондой эле «Малай артели», «Бороондуу күн», «Кыйын кезең» аңгемелеринде 1917-1922- жылдардагы кыргыз элинин оор турмушун чагылдырат."},{"t":"v","l":["жалган түш чен – примерно, время за час-два перед полуднем.","башын ийкеп койду – кивнул головой.","бир аз күймөлүп – немного замешкавшись.","","1 артынан ээрчий кирди – зашел следом за ним","2 чыдамсыздык менен кыпылдап турат – стоит с нетерпением","3 аңгеменин баш-аягы – мында: весь рассказ","4 чөп чаап жаткан жер – место, где идет покос","5 кубанганы ошондой – радовался так"]},{"t":"p","h":"<span class=\"pg\" data-n=\"132\">132<\/span>кагаз жыртып (айрып), калемин кармады – мында: вырвал бумагу и взял ручку."},{"t":"p","h":"өмүрүндө бул үчүн арнап – первый раз в жизни для него."},{"t":"p","h":"ойгонгон адамдай селт эте түшүп – вздрогнул, словно проснувшийся человек. арыкчырай – худощавый. Шинелин ...... киши экен."},{"t":"p","h":"апалактап (алактап) барып – расторопным движением. Зарлык ...... барып кагазды сунду. Жамшид коркконунан алактады."},{"t":"v","l":["бир жакка жүргөнү жатыптыр – собирался куда-то уезжать.","баскычта күтүп отурду – сидел и ждал на лестнице.","аттын оозун калжайта тартып – сильно подтянул поводья коня.","сыртка чыккандан кийин – когда вышли во двор.","көзү менен ымдап – мында: подавая знак взглядом."]},{"t":"p","h":"мамыкта бараткандай болду – мында: казалось, что (они) едут на мягкой подушке."},{"t":"v","l":["1. «Казыналык окуу» деген эмне?","2. Ага өтүш үчүн Зарлык кандай аракеттерди жасады?","3. Союз кошчунун башчысы менен Зарлык кандай сүйлөштү?","4. Отднаробдо кандай окуя болду?","5. Интернатка кантип өттү?","6. Ал кездеги окуу үчүн болгон кыйынчылык менен учурдагы","кыйынчылыкты салыштырууга болобу?","7. Окуя Кыргызстандын кайсы областында болуп өтүптүр?","","1. Чыгарманы окуп чыккыла жана көркөм айтып бергиле.","2. Аңгемеде сүрөттөлгөн бул мезгил жөнүндө дагы кандай тарыхый","окуяларды билесиңер, аларды салыштыргыла."]},{"t":"p","h":"3. «Зарлык»аңгемесинин темасын жана идеясын тапкыла. Төмөнкү сөздөрдүн маанисин түшүндүрмө сөздүктүн, мугалимдин жардамы менен чечмелегиле: жаңы тартип окуусу, казыналык окуу, интернат, мекеме, союз кошчу, дүкөн, чиркөө, эл агартуу бөлүмү, буйрук, базар."},{"t":"p","h":"4. Төмөнкү сүйлөмдөрдөгү асты сызылган сөздөрдүн ордуна тиешелүү синонимин койгула."},{"t":"p","h":"Үлгүсү: Окуунун пайдасын, «үгүттөп» муну бир кезде элден бездиртип (качыртып) чыккан Зарлык эле. Көрөр замат апалактап барып колундагы кагазды суна бергенде, биртике гана буйдалып кагазга көз жүгүртүп өттү да кайра берди. Бул сапар келгенде Шинелин араба чектирип бир жакка жүргөнү жатыптыр."},{"t":"p","h":"<span class=\"pg\" data-n=\"133\">133<\/span>Саландаган тумшук – спускающийся вниз продолговатый выступ предгорья. Улага – место у порога (в юрте)."},{"t":"p","h":"Мурунтук – поводок (бычий), привязываемый к деревянному концу (чулуку), который продевается в носовую перегородку быка."},{"t":"p","h":"Сайроо (сайроон) – отмель, мелкое место в реке, удобное для переправы."},{"t":"img","src":"data:image/webp;base64,UklGRswKAABXRUJQVlA4IMAKAABQQwCdASqAAjsAPrVOnUonJKKksTbp8OAWiWcG+IUEGjKi3Dkzdz/LBD0sEtRHv3x077flGodNDP9m/ML8XQnk5shioj+4J2Upt3KEhsNxuFzGFBXu/5r+aAO5i1hBloXqcSPhTy98DKJCcVBK5n+zW9nfKvSes77Ed7bvnQcFcXftMybPLN81udhQPWq6D3nuaXNlqn5Cbv8cIdeXoZai/eJ9ORqfajqXMcRgD0wGzxoNwwVLIJ5lUXVj7aALpOt8Y5m7W2xy+8R/kNydXUvCcK11k/nBptbHVtx+eJSuRWHNd2nzYF4VJomcF3mH1xAsBDtpwsCHswHqaFVuyznYxJkeLzA4UT3Z8dHTgZGYVjMbE2IzcaQ7oYgHWKW5TFtMzj8jrqBowVYABvlMIMor/2wFQJRSQ7I1v9+g1S2vmvSbBjzw0mXq/0h/CshtXJ0jiHtNytsn4OiJPnwZssDYf7EJxxgK0Vro/jfrOkRahxael65c9ed4im+HHY3Hre27EzgM4hlTdZZF/6M/2E ле согушка карата жергиликтүү элден аскерге мандикерлерди алуу, элдин нааразылыгын күчөттү. Натыйжада 1916-жылы июль-август айларында Кыргызстандын аймагында жалпы стихиялуу көтөрүлүш <span class=\"pg\" data-n=\"134\">134<\/span>башталып, ал ак падыша аскерлери тарабынан аёосуз басылган. Көтөрүлүш жеңилгенден кийин жазалоодон кутулуу үчүн Түндүк Кыргызстандын көпчүлүк эли Кытайга кире качууга аргасыз болгон. Бул Үркүн деген тарыхый ат менен аталып калды. Түндүк кыргыздарынын 40%ы падышачылык ак гвардиячылардын жазалоосунан, Кытайга качканда жана кайтып келатканда жолдо ачкачылыктан кырылышкан. Алардын сөөктөрү ашууларда, чөл-талааларда көмүлбөй калып, ит-кушка жем болгон."},{"t":"p","h":"Ал эми Кош бийлик жана Совет бийлигинин алгачкы мезгилинде (1917-1922-жылдар) деле элдин абалы өтө оор бойдон турган."},{"t":"p","h":"Бул кезде элдин социалдык-экономикалык абалы менен бирге маданий агартуу маселесин жолго коюу өтө олуттуу эле. Билимсиз, жетим, ачкачылыкта сандалган жаш балдарды мектепке тартуу олуттуу иш болгон."},{"t":"p","h":"(«Кыргызстандын тарыхынан»)"}],"sub":[],"section":"КАСЫМАЛЫ БАЯЛИНОВ","pages":[134,134]},{"title":"Тексттерде кездешкен макал-лакаптардын сөздүгү","blocks":[{"t":"h3","h":"ТАБЫШМАКТАРДЫН ЖАНДЫРМАГЫ"},{"t":"p","h":"(24–25-беттер) 1. Эрин 2. Жылдыз 3. Ак куу 4. Суу 5. Тиш, тил 6. Наристе, өспүрүм курак 7. Төө 8. Ой 9. Жаңгак 10. Булак 11. Үзөнгү 12. Атаң"},{"t":"h3","h":"<span class=\"pg\" data-n=\"135\">135<\/span>Тексттерде кездешкен макал-лакаптардын сөздүгү"},{"t":"p","h":"А"},{"t":"p","h":"Айла – алтоо, акыл – жетөө – хитрость – шесть, а ум – семь (т.е. ум сильнее хитрости). Акыл деңизден терең, билим тоодон бийик – ум глубже моря, знание выше горы. Акыл – жаштан, асыл – таштан – ум в голове, а самоцветы – среди камней. Акылды жакшы баксаң, маңдайың ачык – будь умным, и ты добьешься всего. Акылың болсо аңдап бил, эсиң болсо эптеп бил – достигай цели умом и ловкостью. Ата – аскар тоо, эне – соолубаган булак, бала – күйүп турган шам чырак – отец – гора, мать – родник, ребенок – свеча."},{"t":"p","h":"Атаны сыйлаган абийир табат, энени сыйлаган элге жагат – уважающий отца найдет честь, почитающий мать – уважение людей."},{"t":"p","h":"Атан өлсө тайлак бар, кому жерде калган жок. – букв. Умер верблюд, так верблюжонок есть, седло не осталось в луне (Отец умер – есть сын, учитель умер – есть ученики)."},{"t":"p","h":"Атаңа наалат айттырба, апаңа каргыш келтирбе – не заставляй отца браниться и мать проклинать."},{"t":"p","h":"Ашыккан калар уятка, саргайган жетер муратка – поспешивший – осрамится, выдержанный достигнет своей цели."},{"t":"p","h":"Аял жакшы – эр жакшы – жена хороша, (так и) муж хорош."},{"t":"p","h":"Аял үйгө тартылган желек, бала – элге калтырган белек – женщина как знамя для дома, ребёнок как подарок для народа."},{"t":"p","h":"Б"},{"t":"p","h":"Бала жакшысы атанын даңкы, кыз жакшысы эненин баркы – хороший сын – слава отца, хорошая дочь – авторитет матери."},{"t":"p","h":"Баланы жашынан, катынды башынан – ребёнка (приучай) смалу, жену (приучай) – с (самого) начала (сразу после женитьбы). Билим алуу – ийне менен кудук казгандай – знание получить – все равно, что колодец иглой копать."},{"t":"p","h":"Булбул гүлзарын сүйөт, адам мекенин сүйөт – соловей любит свой цветник, человек любит свою страну. Бөдөнөнү сойсо да касапчы сойсун – и перепёлку пусть режет мясник (дело мастера боится)."},{"t":"p","h":"Бөлүнгөндү бөрү жейт – кто отделился (от коллектива), того волк съест."},{"t":"p","h":"<span class=\"pg\" data-n=\"136\">136<\/span>Д Досу көптү жоо албайт, акылы көптү доо албайт – у кого много друзей, того враг не победит, а кто умен, тот и не опозорится."},{"t":"p","h":"Ж"},{"t":"p","h":"Жакшы аял капкалуу шаар, жаман аял ичи толгон заар – хорошая жена – город с воротами, плохая жена – полна внутри ядом. Жакшы жалган айтпайт, жалгандан пайда таппайт – хороший человек никогда не врет, он там не ищет выгоду."},{"t":"p","h":"Жаш келсе – ишке, кары келсе – ашка – (если) пожилой явится накорми – молодой явится – дай работу."},{"t":"p","h":"Жер – казына, суу – алтын – земля – мать богатство, вода – золото. Жетимдин жары кыдыр, тагдыры эки ача – подруга сироты мир, судьба его противоречива."},{"t":"p","h":"Жоодон өлгөн салтанат, үйдөн өлгөн жаманат – смерть (от врага) на поле боя – честь, умереть дома – позор."},{"t":"p","h":"И"},{"t":"p","h":"Ит жалдаган суу кечпейт – тот, кто собаку нанял, через воду не переправится (скупые люди не достигают цели). Ичи жаманды ит кабат, пейли жаман ниетинен табат – злонамеренного собака кусает, а завистливому удача не сопутствует."},{"t":"p","h":"К Калп айтып – пайда таап, каларсың уятка, чын айтып – зыян таап, жетерсиң муратка – сказав неправду – получишь выгоду, но осрамишься, сказав правду – понесешь убытки, но достигнешь цели."},{"t":"p","h":"Калп ырыс кесет, кайгы өмүр кесет – ложь счастье отсекает, горе жизнь отсекает. Ложь к добру не ведет, горе укорачивает жизнь."},{"t":"p","h":"Калптын казаны кайнабайт – кривдой не проживёшь (букв: у лжи котел не кипит). Кеңешип кескен бармак оорубайт – на миру и смерть красна (букв: палец, отрезанный по общему совету, не болит)."},{"t":"p","h":"Кеп чынынан бузулбайт – слово от правды не портится: из песни слова не выкинешь. Кесирдүүдөн келте оорудай сөз чыгат – из гадкого рта исходят гнусные слова. Кой асырасаң – береке, кокуй алсаң – келеке – овец содержишь – благодать, не сможешь – опозоришься."},{"t":"p","h":"Кочкор болор козунун маңдай жагы дөң болор – у того ягненка, который станет вожаком, лоб высокий."},{"t":"p","h":"<span class=\"pg\" data-n=\"137\">137<\/span>Көп койдо аксак да болор, таскак да болор – среди овец встречаются и кривые, и ровные."},{"t":"p","h":"Көп жойлогон түлкү капканга түшөт – много рыскающая лиса попадёт в капкан. Билим байлык төгүлбөс да, урагыс. Каракчы, ууру, көз боочу да алалгыс (Ж. Баласагын) – знание – это нескончаемое, вечное богатство, не отнимет ни разбойник, ни вор, ни чародей."},{"t":"p","h":"Билим тоодон бийик – букв. знание выше гор."},{"t":"p","h":"Бир уйдун мүйүзү сынса, миң уйдун мүйүзү зыркырайт – у одной коровы рог сломался, у тысячи коров рога (все за одного переживают) дрожат."},{"t":"p","h":"Кур убада курсак тойгузбайт – пустыми обещаниями сыт не будешь."},{"t":"p","h":"Куш канаты менен учат, куйругу менен конот – птица летает крыльями, садится хвостом."},{"t":"p","h":"Күндүк өмүрүң болсо, түштүгүнө жорго мин – если у тебя есть день жизни, полдня езди на иноходце (т.е. удели время и удовольствию)."},{"t":"p","h":"Күч акылга баш ийет – сила подчиняется уму."},{"t":"p","h":"Кырсык каш менен кабактын ортосунда – беда всегда вот тут; на грех мастера нет."},{"t":"p","h":"Окуу – билим азыгы, Билим – ырыс азыгы – учение – источник (букв. пища) знания, знание – источник (букв. пища) счастья."},{"t":"p","h":"Ор казсаң тайыз каз, өзүң түшүп калбагын – не рой яму другому; Не плюй в свой колодец."},{"t":"p","h":"Он бириксе тон болот, ынтымак бириксе эл болот – десять объединятся – будет тулуп, дружба будет – будет народ."},{"t":"v","l":["Ө","","Өнөрлүү өлбөйт – умелец не пропадёт.","Өлүүнүн сөзүн тирүү сыйлабайт – живая мышь лучше мертвого тигра."]},{"t":"p","h":"Өлтүргөндүн өчү бар, төгүлгөн кандын куну бар – кто убивает, у того есть месть, а у пролитой крови есть своя цель."},{"t":"v","l":["Өнөр алды кызыл тил – высшее искусство – красноречие.","","П"]},{"t":"p","h":"Пейли кеткен кишинин казанынан аш кетет – у зловредного человека котел пустой."},{"t":"p","h":"С Сарт санаасы менен байыйт – сарт богатеет мыслями."},{"t":"p","h":"Сынчынын сыңар өтүгү майрык – букв: у самого критика один сапог кособокий."},{"t":"v","l":["<span class=\"pg\" data-n=\"138\">138<\/span>Т","","Тил таразасы – акыл – вес языка – ум.","Турмуштун туткасы аял – женщина – опора жизни.","Туугандын урушу, торконун жыртышы – разбор родных, разрыв шелка.","","У"]},{"t":"p","h":"Уурусу күч болсо, ээси айыпка жыгылат – если вор силён, то хозяин окажется виноватым."},{"t":"p","h":"Учууга канат керек, конууга куйрук керек – для полета нужны крылья, для посадки нужен хвост."},{"t":"p","h":"Уядан эмне көрсө, учканда ошону алат – что видел в гнезде, то (и) будет ловить, когда вылетит."},{"t":"v","l":["Ы","","Ырыс алды – ынтымак – залог счастья в единении."]},{"t":"p","h":"Ынтымак түбү – ийгилик, тирилик түбү – бирдик – залог дружбы – успех, залог жизни – единство."},{"t":"v","l":["Ынтымак болбосо, ырыс качат – если нет дружбы – не будет и счастья.","","Э"]},{"t":"p","h":"Эки киши күнөкөр болсо, бир киши данакер – два человека виновны (поссорились между собой), один человек (третий) примиритель."},{"t":"p","h":"Эл ичи алтын бешик – народ – золотая колыбель."},{"t":"p","h":"Эл дөөлөтү эмгек, эмгек баарын жеңмек – богатство – труд, труд все одолеет. Эмгексиз иш бүтпөйт, эринчектин колу тийбейт – без труда не выловишь рыбу из пруда."},{"t":"p","h":"Эти тургай табагы жок – до мяса ли, блюда своего нет (не до жиру, быть бы живу)."}],"sub":[{"title":"Тексттерде кездешкен макал-лакаптардын сөздүгү","b":4}],"section":"ТАБЫШМАКТАРДЫН ЖАНДЫРМАГЫ","pages":[135,138]},{"title":"Алфавиттик кыргызча-орусча сөздүк","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"139\">139<\/span>Алфавиттик кыргызча-орусча сөздүк"},{"t":"h3","h":"А"},{"t":"p","h":"аба (байке, аке) — 1. почтительное (обращение к старшему мужчине, дяде); 2. воздух, бүгүн аба ырайы жылуу- сегодня теплая погода"},{"t":"p","h":"абайлоо - остерегаться, көпүрөдөн абайлап өт - переходи через мост осторожно"},{"t":"p","h":"абийир - 1. совесть, честь; 2. скромность, абийирдүү бол — будь совестливым, ал абийирдүү кыз — она скромная девушка"},{"t":"p","h":"абийирсиз — бессовестный, бесстыжий"},{"t":"p","h":"абышка - старик, дед"},{"t":"p","h":"ага — 1. старший брат; 2. дядя"},{"t":"p","h":"агартуу - 1. побелка; 2. просвещение"},{"t":"p","h":"агым - 1. течение, поток, суунун агымы — течение (речки); 2. направление, саясий агым — политическое течение"},{"t":"p","h":"адам - человек, адам баласы — человечество"},{"t":"p","h":"адат — обычаи, традиции, привычки, анын адаты бар - есть у него привычка"},{"t":"p","h":"адаш - заблуждаться, ошибаться, тааныш эмес шаарда адаштык - в незнакомым городе заблудились"},{"t":"p","h":"адилет, адилеттик — справедливый, справедливость, адилет чечим - справедливое решение"},{"t":"p","h":"аёо — жалость, щадить, аёосуз - безжалостный, беспощадный"},{"t":"p","h":"ажал — смертный час, ажалы жетти - он скончался"},{"t":"p","h":"ажар - цвет, лицо, облик, ажары сулуу — у него красивое лицо"},{"t":"p","h":"ажыдаар - дракон"},{"t":"p","h":"ажыраш - порвать связи, расставаться; 2. разводиться"},{"t":"p","h":"аз — мало, немного, аз калды — мало осталось, бир аздан кийин — через некоторое время"},{"t":"p","h":"азамат — молодец, — Ал азамат жигит — он парень молодец"},{"t":"p","h":"азан — утро, таң азандан — с утра"},{"t":"p","h":"азап — мучение, мука, азап тартуу - мучиться"},{"t":"p","h":"азаттык — свобода, азаттык алуу — получить свободу"},{"t":"p","h":"аздык — малочисленность"},{"t":"p","h":"азуу — клык, коренной зуб"},{"t":"p","h":"азыр - сейчас, сен азыр келгин - ты прямо сейчас приходи"},{"t":"p","h":"айбан, айбанат — животное, скот, зверь, үй айбандары — домашние животные"},{"t":"p","h":"айда - гони, пригони, бала уйду айдап келди — мальчик пригнал корову"},{"t":"p","h":"айкында - выясни, уясни, уточняй"},{"t":"p","h":"айла — хитрость, уловка, анын айласы кетти — у него выхода не осталось"},{"t":"p","h":"айык - выздоровливай, поправляйся, тезирээк айык — быстрее поправляйся"},{"t":"p","h":"ак- 1. белый, ак көйнөк — белая рубашка; 2. чистый, честный, ак эмгек — честный труд"},{"t":"p","h":"аксакал - аксакал (уважаемое лицо, почтительное обращение к старшему по возрасту, положению)"},{"t":"p","h":"ал — сила, мощь, алы кетти — он в плохом состоянии"},{"t":"p","h":"алачык — маленькая юрта, лачуга, шалаш"},{"t":"p","h":"алды - перед, передняя часть, алды жак — передняя сторона"},{"t":"p","h":"али — все еще, пока еще, күн али бата элек — солнце все еще не взошло"},{"t":"p","h":"<span class=\"pg\" data-n=\"140\">140<\/span>алтын - золото, алтын шакек - золотое кольцо"},{"t":"p","h":"амал - хитрость, уловка, амал табуу - найти выход"},{"t":"p","h":"аман - здоровый, благополучный, аман алып калды — его спас"},{"t":"p","h":"анан — потом, затем, анан сүйлөймүн — потом выступлю"},{"t":"p","h":"анык — ясный, очевидный, несомненный, Сенин кетериң аныкпы? — Ты действительно уйдешь? Анык кабар - достоверное известие"},{"t":"p","h":"аң — яма, пробоина, обрыв"},{"t":"p","h":"аңгеме — 1. беседа, разговор, аңгеме салуу — беседовать; 2.рассказ, аңгемени окуп чык- прочитай рассказ"},{"t":"p","h":"аңчы — охотник"},{"t":"p","h":"ар - совесть, честь, арына келүү - стыдиться, ары жок — бессовестный"},{"t":"p","h":"аралаш — смешанный, аралаш класс — смешанный класс"},{"t":"p","h":"аралык - промежуток, расстояние, эки айылдын аралыгы"},{"t":"p","h":"арбын — обильный, много, арбын түшүм — обильный урожай"},{"t":"p","h":"арзан — 1. дешевый, недорогой, арзанга түштү — обошлось дешево; 2. легкий, арзан мисал - легкая задача."},{"t":"p","h":"арман - недостигнутая цель, заветная мечта, арманда калуу — иметь неисполненное желание"},{"t":"p","h":"артык - 1. лишний, излишний, свыше, жүздөн артык — свыше ста; 2. лучший, лучше, мунуң тигинден артык - этот лучше, чем тот"},{"t":"p","h":"арык - 1. худой, тощий, арык мал - истощенный скот; 2. арык - арык, арыктын суусу - арычная вода"},{"t":"p","h":"асты - 1. низ, нижная часть, сыналгынын астында - под телевизором; 2. начало, жаздын асты — начало весны"},{"t":"p","h":"ат — 1. имя, название, баланын аты — имя ребенка, кинонун аты - название кино; 2. лошадь, атка минди - сел на лошадь; 3. стреляй, мылтык атылды - выстрелило ружье"},{"t":"p","h":"атайы, атайлап — умышленно, нарочно, намеренно, специально"},{"t":"p","h":"атта — шагай, перешагивай, босогодон аттап өт — перешагни через порог"},{"t":"p","h":"ач — 1. голодный, ач карын — на голодный желудок; 2. открой, раскрой, эшик ач - открывай двери"},{"t":"p","h":"ачуу — 1. горький; 2. гнев, злоба, ачуу калемпир - горький перец, ачуусу келди — он обозлился"},{"t":"p","h":"аш — пища, аш бышырды - варил, готовил пищу"},{"t":"p","h":"ашык - 1. излишний; 2. влюбленный, возлюбленный"},{"t":"p","h":"ая — жалей, пожалей, алыстагы кызын аяды - пожалел дочку, которая живет вдалеке, жан аябай күрөш — борись, не щадя себя (сил)"},{"t":"h3","h":"Б"},{"t":"p","h":"баа — 1. цена, стоимость; 2. оценка, баш кийимдин баасы - стоимость головного убора, жакшы баа алды - получил хорошую оценку"},{"t":"p","h":"баары - все, всё, баары бүттү - всё кончилось; баарын - всех; баары бир - все равно, баарынан мурда - прежде всего, раньше всех"},{"t":"p","h":"багалек — низ штанины"},{"t":"p","h":"багуу — присмотр, уход, воспитание, мал багуу — выращивание скота; бала багуу — (присмотр), воспитание детей."},{"t":"p","h":"бадал - 1. заросли, мелколесье, бадалдагы бугулар - олени в зарослях; 2. кустарник"},{"t":"p","h":"бажа — свояк"},{"t":"p","h":"базар — базар, рынок, мал базар - скотный базар; базар баасы — цена рынка"},{"t":"p","h":"<span class=\"pg\" data-n=\"141\">141<\/span>байка - 1. следи, наблюдай, замечай; ал дароо байкады — он сразу заметил, мен аны байкап турам - я за ним слежу; 2. смотри, байка жыгыласың — смотри упадешь"},{"t":"p","h":"байлык - богатство, жаратылыш байлыктары — природные богатства"},{"t":"p","h":"байпак — чулки; жүн байпак — шерстяные чулки, носки"},{"t":"p","h":"байыркы - древний, прежний; байыркы элдер — древние народы, байыркы кезде-в давние времена"},{"t":"p","h":"бактылуу - счастливый, удачливый; бактылуу балалык - счастливое детство"},{"t":"p","h":"бал - мед, бал челек- улей, бал аары — пчела"},{"t":"p","h":"балапан — птенец, цыпленок: каздын балапаны - гусенок, бүркүттүн балапаны — орленок"},{"t":"p","h":"балдак — костыль, ал балдак менен жүрөт — он на костылях ходит"},{"t":"p","h":"балчык - глина, жидкая грязь; жолдун баары балчык болду - дорога вся в сплошной жидкой грязи"},{"t":"p","h":"барабар — равный, одинаковый; алардын күчтөрү барабар - у них силы одинаковые, эки экиге барабар - два равно двум"},{"t":"p","h":"бас - 1. дави, сдавливай, надавливай; чөп басып калбасын - смотри, чтобы сено не задавило; 2. ступай, шагай; илгери бас — иди вперед"},{"t":"p","h":"басым - давление, кандын басымы — кровяное давление"},{"t":"p","h":"батыш - 1. запад, көчөнүн батыш тарабы — западная сторона улицы; 2. закат"},{"t":"p","h":"башат - источник, родник; башаттын суусу - родниковая вода"},{"t":"p","h":"башка — 1. другой, иной, прочий, чужой; башка жол менен келдим - пришел другим путем, башка кишилер - чужие люди 2. кроме, отдельно, особо; сенден башка - кроме тебя"},{"t":"p","h":"баштапкы — начальный, первичный"},{"t":"p","h":"бая — давно; баягүнү - на днях, ал бая келип кетти — он недавно приходил"},{"t":"p","h":"баян, баяндама - рассказ, повествование; анын кыскача өмүр баяны - его краткая биография"},{"t":"p","h":"беде — люцерна"},{"t":"p","h":"бейтааныш - незнакомый, бейтааныш адам — незнакомый человек"},{"t":"p","h":"бек — крепко, бек карма — крепко держи, сөзүңө бек бол — ты крепко держи слово"},{"t":"p","h":"бел - 1. поясница, талия; 2. спина; 3. горный хребет, перевал, белди аштык - перешли через перевал"},{"t":"p","h":"белен - готовый, белен тамак - готовая пища"},{"t":"p","h":"бересе - долг, менин бересем жок — за мной нет долга, ал мага бересе — он мне должен"},{"t":"p","h":"бийик - 1. высокий, высоко, бийик дубал — высокая стена; 2. громко, бийик добуш — громкий голос"},{"t":"p","h":"бил - 1. знай, понимай, ким билет? - кто знает? 2. узнай, проведай, сабак болобу билчи? - узнай, будет ли урок?"},{"t":"p","h":"билим — знание, образование, орто билим — среднее образование"},{"t":"p","h":"бирге — вместе, совместно, биз баарыбыз бирге турабыз — мы все вместе живём"},{"t":"p","h":"биротоло - целиком, совсем, биротоло чечтим — окончательно решил, биротоло бердим - насовсем отдал"},{"t":"p","h":"бодо, бодо мал — крупный рогатый скот"},{"t":"p","h":"божомол - предположение"},{"t":"p","h":"борбор - центр, илимий борбор - научный центр"},{"t":"p","h":"боор-1. печень, көк боор — селезенка; 2. кровный родственник, брат"},{"t":"p","h":"бор — мел"},{"t":"p","h":"бороон - буран, вьюга, снежная буря"},{"t":"p","h":"<span class=\"pg\" data-n=\"142\">142<\/span>борошо — поземка, заметь"},{"t":"p","h":"бостек — самка фазана"},{"t":"p","h":"бото — верблюжонок"},{"t":"p","h":"бөбөк — 1. младенец (мальчик по отношению к старшему брату или старшей сестре); 2. грудной ребенок"},{"t":"p","h":"бөдөнө — перепёлка, перепел"},{"t":"p","h":"бөйрөк — почка (анатом.)"},{"t":"p","h":"бөкөн — сайгак, сайга"},{"t":"p","h":"бөрү — волк"},{"t":"p","h":"бу, бул — этот (это, эта); бу ким? - кто это?; бу (бул) эмне? — что это?; мунун эмне кереги бар? — к чему это?; мындан (будан) ары — в дальнейшем"},{"t":"p","h":"буз — нарушать, разрушать; жамгыр жолду бузуп кетти — дождь размыл дорогу; тартип бузбагыла — не нарушайте дисциплину"},{"t":"p","h":"буйрук — приказ, распоряжение, веление, повеление, буйрук берүү (кылуу) — приказать, сиздин буйругуңуз боюнча — по вашему велению (распоряжению)"},{"t":"p","h":"булак — родник, источник"},{"t":"p","h":"булбул — соловей, булбулдай сайрайт — поет как соловей"},{"t":"p","h":"булгаары - кожа (выделанная); булгаары өтүк — кожаные сапоги"},{"t":"p","h":"булуттуу — облачный, пасмурный"},{"t":"p","h":"булчуң — мышца, мускул"},{"t":"p","h":"бурганак — снежная вьюга, метель"},{"t":"p","h":"буроо - гайка"},{"t":"p","h":"бурч - угол, дубалдын бурчу-угол стены"},{"t":"p","h":"бут - нога, бут кийим — обувь, бутунун башы менен басуу — ходить на цыпочках, аты жоктун — буту жок - у кого нет коня, у того нет ног"},{"t":"p","h":"бутак - ветвь, ветка"},{"t":"p","h":"буу - завяжи, капты буу — завяжи мешок"},{"t":"p","h":"буугуч — завязка, каптын буугучу — верёвочка для завязывания мешка"},{"t":"p","h":"буурсун - соха"},{"t":"p","h":"буурчак - горох"},{"t":"p","h":"буудай - пшеница, кара буудай — рожь, буудай ун — пшеничная мука"},{"t":"p","h":"буурул - седой, буурул чач — седоволосый"},{"t":"p","h":"бүгүнкү — сегодняшний, бүгүнкү иштин жыйынтыгы - результаты сегодняшней работы"},{"t":"p","h":"бүдөмүк — не вполне ясно, смутно"},{"t":"p","h":"бүркүт — беркут (орёл), суу бүркүт — орлан, бүркүтчү — охотник с беркутом"},{"t":"p","h":"бүт — кончай, заканчивай, ишиңди качан бүтөсүң? - когда закончишь свою работу? уулум быйыл окуусун бүтөт — (мой) сын в этом году заканчивает учёбу"},{"t":"p","h":"быйылкы - этого года, быйылкы түшүм - урожай этого года, быйылкы жылы -в этом году"},{"t":"p","h":"былтыр - прошлый год, в прошлом году, былтыртан бери - с прошлого года"},{"t":"p","h":"бычак — нож"},{"t":"p","h":"быш - созревать, поспевать, вариться, жариться, эт быштыбы? — мясо сварилось? быйыл дарбыз эрте бышты - в этом году арбуз рано созрел"},{"t":"p","h":"быштак — творог"},{"t":"p","h":"бээ — кобыла, кобылиц, саан бээлер — дойные кобылицы"},{"t":"h3","h":"Г"},{"t":"p","h":"гана — только, бул маселени ал гана чече алат — только он может решить этот вопрос, өзүм гана — только я сам, один я"},{"t":"p","h":"гүл — цветок, гүлдү сугаруу — поливать цветок"},{"t":"p","h":"гүлдө - цвети, процветай, шабдалылар гүлдөй баштады - персики начали цвести"},{"t":"h3","h":"<span class=\"pg\" data-n=\"143\">143<\/span>Д"},{"t":"p","h":"даанышман — мудрый, мудрец"},{"t":"p","h":"даараткана — уборная, туалет"},{"t":"p","h":"дабыш - топот, кишинин добушу - человеческий голос"},{"t":"p","h":"дагара — таз (для стирки белья)"},{"t":"p","h":"дагы — ещё, дагы эле иш баштала элек — работа пока не началась"},{"t":"p","h":"дайым, дайыма — всегда, постоянно"},{"t":"p","h":"дайым даяр - всегда готова, мен ар дайым ушу маалда келемин - я каждый раз прихожу в это время"},{"t":"p","h":"далалат - усердие"},{"t":"p","h":"даңк — слава, известность, анын даңкы чыкты — он прославился (стал знаменитым), даңкка ээ болуу — приобрести славу, завоевать славу"},{"t":"p","h":"дарбаза — ворота, дарбазачы — вратарь"},{"t":"p","h":"дарыкана - аптека, дарыгер - лекарь, знахарь"},{"t":"p","h":"дарыла - 1. лечи; 2. опрыскивай, протравливай (при помощи химикатов)"},{"t":"p","h":"дарыя - река (большая), Нарын дарыясы - река Нарын, Енисей дарыясы — река Енисей"},{"t":"p","h":"даярда - готовь, подготовь, приготовь, китебиңди басмага даярда — подготовь свою книгу к печати"},{"t":"p","h":"демде - завари (чай), күрүчтү демдөөгө кой — дай упариться плову, чай демде — завари чай"},{"t":"p","h":"демек — значит, следовательно, одним словом, итак, демек, биз жөнөшүбүз керек экен да? - значит, нам пора ехать?"},{"t":"p","h":"демилге — инициатива, почин"},{"t":"p","h":"деңиз — море, деңиз айбандары - морские животные"},{"t":"p","h":"дептер — тетрадь, дептерче — записная книжка"},{"t":"p","h":"доңкулдак — дятел"},{"t":"p","h":"доңуз — дикая свинья"},{"t":"p","h":"доо — претензия"},{"t":"p","h":"дос — друг, приятель"},{"t":"p","h":"достош — подружись"},{"t":"p","h":"дөң - возвышение, холм, дөңсөө — возвышенное место"},{"t":"p","h":"дөңгөлөк — колесо, арабанын дөңгөлөгү — колесо телеги"},{"t":"p","h":"дөө — великан"},{"t":"p","h":"дурус — нормальный, сносный"},{"t":"p","h":"душман - враг, неприятель"},{"t":"p","h":"дүйнөлүк — мировой, дүйнөлүк согуш — мировая война"},{"t":"p","h":"дүнүйө — богатство, клад, сокровище"},{"t":"p","h":"дүнүйөкор — стяжатель"},{"t":"p","h":"дүкөн — лавка, магазин"},{"t":"p","h":"дүрбөлөң — паника, переполох, смута"},{"t":"p","h":"дүрбү - бинокль"},{"t":"p","h":"дүрмөт — заряд"},{"t":"p","h":"дыйкан — земледелец, крестьянин"},{"t":"h3","h":"Ж"},{"t":"p","h":"жаа - 1. лук (оружие), жаа тартуу - стрелять из лука; 2. радуга; 3. дуга"},{"t":"p","h":"жабдык - орудие, инструментарий"},{"t":"p","h":"жабуу — попона, покрывало"},{"t":"p","h":"жазы — широкий, просторный, ровный, плоский, жазы тактай — широкая доска, жазы маңдай — высокий лоб"},{"t":"p","h":"жазылуу - подписка, газетага жазылуу — подписка на газету"},{"t":"p","h":"жайбаракат — спокойно, не спеша, благодушно, жайбаракат отура бергиле — сидите спокойно (не суетясь)"},{"t":"p","h":"жайлоо - джайлау, летовка, летнее пастбище"},{"t":"p","h":"жак — сторона, край, он жак — правая сторона, сол жак — левая сторона, биз жакта — в нашем краю"},{"t":"p","h":"<span class=\"pg\" data-n=\"144\">144<\/span>жакшынакай — хорошенький, миловидный"},{"t":"p","h":"жалаа — клевета, ложное обвинение, жалаа жабуу - клеветать, возводить ложное обвинение"},{"t":"p","h":"жалаяк — пелёнка"},{"t":"p","h":"жалбыз — мята"},{"t":"p","h":"жалбырак - лист (растение); жазы жалбырак — широкий лист, бака жалбырак — подорожник"},{"t":"p","h":"жалтылдоо — блестеть, сверкать, сверкание"},{"t":"p","h":"жаман — плохой, дурной, скверный плохо, дурно, скверно, жаман жорук — скверный поступок, жаман адат — дурная привычка, жаман жыт — дурной запах, жаман көрүү — ненавидеть, не любить"},{"t":"p","h":"жамгыр — дождь; кара жамгыр — проливной дождь, ливень, жамгыр катуу жаап турат — идёт сильный дождь"},{"t":"p","h":"жана - 1. ещё, опять, снова, вновь, повторно; жана бир жолу — ещё один раз, жана кайтала — ещё повтори; 2. только что, недавно; ал жана эле барып келди — он только что сходил"},{"t":"p","h":"жаныбар - животное; жаныбарлар дүйнөсү — животный мир"},{"t":"p","h":"жаңгак — орех (грецкий), жаңгак токою — ореховый лес"},{"t":"p","h":"жаңжал — ссора, спор, скандал"},{"t":"p","h":"жаңылык - новость, новинка"},{"t":"p","h":"жаңырык - отзвук, эхо"},{"t":"p","h":"жапыз - низкий, низкорослый; жапыз үй — низкий дом, бою жапыз киши - низкорослый человек, жапыз така — низкий каблук"},{"t":"p","h":"жар - яр, обрыв, крутой берег"},{"t":"p","h":"жара - рана, болячка, язвы"},{"t":"p","h":"жарака — трещина; дубалдын жаракасы — трещина стены"},{"t":"p","h":"жаратылыш - природа, натура; жаратылыш байлыктары - природные богатства, жаратылышты коргоо — охрана природы"},{"t":"p","h":"жарганат — летучая мышь"},{"t":"p","h":"жаргылчак — ручная мельница (зернотёрка)"},{"t":"p","h":"жарды - бедный, неимущий, бедняк; жарды адам - бедный человек"},{"t":"p","h":"жаркыра - блестеть, сверкать, сиять"},{"t":"p","h":"жарты — половина; бир бүтүндүн жартысы - половина одного целого"},{"t":"p","h":"жарым — половина; жарым күн — полдня; эки жарым - два с половиной; жарым өмүр — полжизни"},{"t":"p","h":"жарыя — объявление"},{"t":"p","h":"жат - наизусть; жатка айт — говори наизусть"},{"t":"p","h":"жаттоо — запомнить наизусть, выучить наизусть"},{"t":"p","h":"жатуу — лежать, лежание"},{"t":"p","h":"жашоо — жить, здравствовать, житьё, существование, проживание"},{"t":"p","h":"жашыл - зелёный; жашыл жоолук - зелёный платок"},{"t":"p","h":"жашылча - овощи, жемиш, жашылча өстүрүүчү совхоз — плодоовощной совхоз"},{"t":"p","h":"жашыр - спрячь, укрывай, скрывай"},{"t":"p","h":"же — ешь, кушай"},{"t":"p","h":"жез — медь, латунь; жез чара — медная чаша"},{"t":"p","h":"жек, жек көрүү — ненавидеть, презирать, питать отвращение"},{"t":"p","h":"жел — ветер, ветерок"},{"t":"p","h":"желек — флаг"},{"t":"p","h":"желекче — флажок"},{"t":"p","h":"желим — клей"},{"t":"p","h":"желин — вымя"},{"t":"p","h":"желке — затылок"},{"t":"p","h":"<span class=\"pg\" data-n=\"145\">145<\/span>жең — рукава"},{"t":"p","h":"жеңилбес — непобедимый; жеңилбес армия — непобедимая армия"},{"t":"p","h":"жеңиш - победа, завоевание; жеңиш менен кайтуу — вернуться с победой; спорттук жеңиш — спортивная победа"},{"t":"p","h":"жесир — вдова, вдовец"},{"t":"p","h":"жетим — сирота"},{"t":"p","h":"жетүү - 1. хватать; 2. дойти, доехать; 3. догнать, достигнуть"},{"t":"p","h":"жибек — шёлк, жибекчилик — шелководство"},{"t":"p","h":"жигит — джигит, молодой человек, юноша, парень; жаш жигит — молодой парень"},{"t":"p","h":"жилик — трубчатая кость"},{"t":"p","h":"жогол — 1. теряться, потеряться, исчезать, пропадать; сен кайда жоголдуң? - куда ты пропал? кагаздар жоголуп кетти — бумаги пропали; 2. долой, көзүмө көрүнбөй жогол! — уйди с глаз долой!"},{"t":"p","h":"жогору - верх, вверх, высоко, выше; жогору көтөр — подними выше; жогору жакта — наверху"},{"t":"p","h":"жок - нет, не имеется, арга жок — нет выхода, что поделать; жок болуу — исчезнуть, пропадать; анын жаман адаттары жок - у него нет дурных привычек; барганым жок - я не ходил"},{"t":"p","h":"жолборс — тигр"},{"t":"p","h":"жолдош - 1. товарищ, друг; ал — менин жакын жолдошум — он мой близкий товарищ; 2. спутник; 3. товарищ (форма обращения); жолдош депутаттар - товарищи депутаты"},{"t":"p","h":"жолоочу — путник"},{"t":"p","h":"жолук — встречайся, повидайся; таанышыма жолуктум — повидался с знакомым"},{"t":"p","h":"жоо — враг, неприятель"},{"t":"p","h":"жоокер — воин"},{"t":"p","h":"жоолук — платок, косынка; жүн жоолук — шерстяной платок; ак жоолук — белый платок"},{"t":"p","h":"жоомарт — щедрый"},{"t":"p","h":"жорго — иноходец"},{"t":"p","h":"жору — гриф"},{"t":"p","h":"жорук — поступок, выходка"},{"t":"p","h":"жөнө — отправляйся; биз бүгүн саат жетиде жөнөйбүз — мы отправляемся сегодня в семь часов"},{"t":"p","h":"жөнөкөй - простой, обыкновенный, несложный, жөнөкөй маселе — простая задача; жөнөкөй сан — простое число; жөнөкөй сүйлөм — простое предложение"},{"t":"p","h":"жөрмөлө — ползай"},{"t":"p","h":"жөтөл — кашель; көк жөтөл — коклюш"},{"t":"p","h":"жука - тонкий; жука кагаз — тонкая бумага; жука кийим — легкая одежда; жука тактай — тонкая доска"},{"t":"p","h":"жума - 1. пятница; 2. неделя; газета жумасына бир жолу чыгат - газета выходит раз в неделю"},{"t":"p","h":"жумуртка - яйцо; тооктун жумурткасы — куриное яйцо"},{"t":"p","h":"жумушчу — рабочий"},{"t":"p","h":"жуп - чет, пара; жуп сан — четное число"},{"t":"p","h":"журт - 1. народ, общественность, публика; 2. место стоянки (после откочевания), оставленное стойбище"},{"t":"p","h":"жут — глотай, проглоти; балапан куртту жутуп жиберди — птенец проглотил червяка"},{"t":"p","h":"жуун - умойся, мойся, умывайся; сууга жуун — умывайся водой"},{"t":"p","h":"жуур — меси, замеси, замешивай; камыр жуур — замеси тесто"},{"t":"p","h":"жуурат — цельное кислое молоко"},{"t":"p","h":"жууркан — одеяло (на стёжке)"},{"t":"p","h":"жүгөн - узда, жүгөндө — надевай узду"},{"t":"p","h":"<span class=\"pg\" data-n=\"146\">146<\/span>жүгөрү - кукуруза"},{"t":"p","h":"жүзүм — виноград"},{"t":"p","h":"жүн — 1. шерсть; койдун жүнү — овечья шерсть; уяң жүн — тонкая шерсть; 2. перо (птицы)"},{"t":"p","h":"жүрөк — сердце; жүрөктүн кагышы - сердцебиение; чын жүрөктөн — от чистого сердца; таш жүрөк — жестокий, бессердечный"},{"t":"p","h":"жүрүү — ходить, ездить, двигаться"},{"t":"p","h":"жыгуу — свалить, побороть, победить"},{"t":"p","h":"жый, жыйна - 1. собирай, собери, убери; жүзүм жыйна — собирай виноград; 2. копи, накопи; ал көп акча жыйды — он накопил много денег"},{"t":"p","h":"жылаңаяк, жыңайлак - босой, босиком"},{"t":"p","h":"жылга — лощина"},{"t":"p","h":"жылгаяк — скользкий; жылгаяк жол — скользкая дорога; жылгаяк тебүү — скользить (на ногах)"},{"t":"p","h":"жылкы — лошадь (общее название); жылкы чарбасы - коневодство; жылкынын эти — конина; жылкычы - табунщик"},{"t":"p","h":"жылма - 1. ровный, гладкий; жылма таш — гладкий камень; 2. внешне приятный"},{"t":"p","h":"жылуу — двигаться; алга карай жылуу — двигаться вперёд"},{"t":"p","h":"жырткыч — хищник; жырткыч айбандар — хищные животные"},{"t":"p","h":"жытта — нюхай"},{"t":"p","h":"жыттуу — пахучий, душистый; жыттуу чөп — пахучая трава"},{"t":"p","h":"жээн — племянник (племянница) или внук (внучка) по женской линии"},{"t":"p","h":"жээрде — рыжий; жээрде тай — рыжий жеребёнок"},{"t":"h3","h":"З"},{"t":"p","h":"закым — мираж, марево"},{"t":"p","h":"залал - вред, ущерб, убыток; залал келтирүү — вредить, причинять вред"},{"t":"p","h":"замбил — носилки"},{"t":"p","h":"замбирек — пушка, орудие"},{"t":"p","h":"заң — кал"},{"t":"p","h":"зоо, зоока - скала"},{"t":"p","h":"зор — большой, громадный, огромный; зор окуя — огромное событие; зор таасир — огромное впечатление; зор ийгилик — громадный успех"},{"t":"p","h":"зым — проволока, провод"},{"t":"p","h":"зыян — вред, убыток, ущерб, вредно; зыян келтирүү — вредить, приносить ущерб, причинить убыток; зыян тартуу — потерпеть убыток, пострадать"},{"t":"p","h":"зээндүү — понятливый, способный, толковый, даровитый, смышлёный; зээндүү бала — даровитый мальчик"},{"t":"h3","h":"И"},{"t":"p","h":"идиш — посуда, сосуд, тара; идиш-аяк — кухонная посуда"},{"t":"p","h":"изде — ищи, разыскивай, отыскивай; аны көптөн бери издеп жүрүшөт - его с давних пор разыскивают; издеп табуу - разыскать, отыскать; сени издегендер көп — тебя разыскивают многие"},{"t":"p","h":"ийгилик — успех, достижение, лучший результат; ийгиликке жетүү — добиться успеха"},{"t":"p","h":"ийин — нора; түлкү ийинге кирип кетти — лиса залезла в нору"},{"t":"p","h":"ийне — игла, иголка; ийнелик — стрекоза"},{"t":"p","h":"ил — зацепи, подцепи, повесь; илгичке илип кой — повесь на вешалку; мыкка илип кой — повесь на гвоздь; ал менин сөзүмдү илип ала койду — он сразу подхватил мои слова"},{"t":"p","h":"илбирс — снежный барс, ирбис"},{"t":"p","h":"илегилек - аист; илегилектин уясы — гнездо аиста"},{"t":"p","h":"ини — младший брат; менин иним — мой младший брат"},{"t":"p","h":"<span class=\"pg\" data-n=\"147\">147<\/span>ирет - 1. ряд, порядок; ирети менен - в порядке, по порядку; 2. раз; төрт ирет — четыре раза; бир нече ирет — несколько раз"},{"t":"p","h":"ириң — гной"},{"t":"p","h":"ит — собака; ит мурун — шиповник"},{"t":"p","h":"ич — 1. пей; кымыз ичкиле - пейте кумыс; чай ич — пей чай; ичип жибер — выпей; 2. ешь, кушай; кесме ич — ешь лапшу; тамак ичип алгыла - покушайте"},{"t":"p","h":"ичеги — кишки"},{"t":"p","h":"ичке — 1. тонкий; ичке жип — тонкая нитка; ичке жол — тропинка; 2. тонкий; ичке үн — тонкий голос"},{"t":"p","h":"ички — внутренний; үйдүн ички шыбагы — внутренняя штукатурка дома; ички оорулар — внутренние болезни; ички соода — внутренняя торговля"},{"t":"p","h":"ишкана — предприятие"},{"t":"p","h":"иш - работа, иште — работай, трудись; мен заводдо иштейм — я работаю на заводе; иштеп чыгаруу — выработка; иштеп чыгуу — проработка, иштеп чыгаруу нормасы - норма выработки"},{"t":"p","h":"иштиктүү — дельный, деловой"},{"t":"p","h":"иштөө — работать, трудиться"},{"t":"h3","h":"К"},{"t":"p","h":"каада — обычай, правило, церемония; кыз узатуу каадасы — обычай (церемония) выдачи девушки замуж"},{"t":"p","h":"каалга — дверь"},{"t":"p","h":"каалоо — желать, желание, хотение"},{"t":"p","h":"каарман - герой, храбрый"},{"t":"p","h":"кабык - кора, скорлупа, кожура, шелуха; жыгачтын кабыгы - кора дерева; жумуртканын кабыгы — скорлупа яйца"},{"t":"p","h":"кабылдама - приёмная"},{"t":"p","h":"кабырга — ребро"},{"t":"p","h":"кагаз — бумага; ак кагаз — белая бумага; иш кагаздары — деловые бумаги; кагаз акча — бумажные деньги"},{"t":"p","h":"кадам - шаг; биринчи кадам — первый шаг; кадам шилтөө - шагать; кадам сайын — за каждым шагом"},{"t":"p","h":"каз — гусь; жапайы каздар — дикие гуси"},{"t":"p","h":"казан — котел; казан асуу — готовить пищу; ашказан — желудок"},{"t":"p","h":"казуу — копать"},{"t":"p","h":"казык — кол; казык кагуу — вбивать кол"},{"t":"p","h":"кайгы — печаль, горе, скорбь; кайгы тартуу — горевать, печалиться; оор кайгы — тяжёлая скорбь"},{"t":"p","h":"кайгыр — горюй, печалься"},{"t":"p","h":"кайда - где, куда; үйүң кайда? — где твой дом? кайда барасың? - куда ты идешь? менин балдарым кайда кетти? — куда ушли мои дети?"},{"t":"p","h":"кайдан - откуда; сен кайдан келдиң? — ты откуда пришёл? мен кайдан билем? — откуда я знаю?"},{"t":"p","h":"каймак — сливки, сметана"},{"t":"p","h":"кайнат - кипяти, суу кайнат — кипяти воду"},{"t":"p","h":"кайната — тесть"},{"t":"p","h":"кайраттуу — энергичный, смелый, храбрый, решительный"},{"t":"p","h":"кайсы — какой, который; кайсы жерде? — в каком месте? кайсы жылы? - в каком году? кайсы бирөөлөр - некоторые; уулдарыңдын кайсынысы үйлөндү? — который из твоих сыновей женился?"},{"t":"p","h":"кайтуу — вернуться, возвратиться, возвращение"},{"t":"p","h":"кайчы — ножницы"},{"t":"p","h":"кайырмак - 1. крючок (для удочки); 2. удочка"},{"t":"p","h":"калаа - город"},{"t":"p","h":"калай — олово"},{"t":"p","h":"калак - 1. совок; 2. весло"},{"t":"p","h":"<span class=\"pg\" data-n=\"148\">148<\/span>калбыр — решето"},{"t":"p","h":"калетсиз — несомненно, безошибочно, несомненный, безошибочный"},{"t":"p","h":"калемпир - красный перец"},{"t":"p","h":"калк - народ, население; шаардын калкы — население города; калктын талабы боюнча — по требованию народа"},{"t":"p","h":"калп — ложь, враньё; калп айтуу — врать, лгать; калпын кармап алуу — уличить во лжи"},{"t":"p","h":"камак - арест; камакка алуу — арестовать"},{"t":"p","h":"каман — кабан"},{"t":"p","h":"камбыл — запасливый, предусмотрительный"},{"t":"p","h":"камда — приготовь, заготовь, сделай запас"},{"t":"p","h":"камылга — забота, хлопоты, подготовительные меры, подготовка,"},{"t":"p","h":"камыр - тесто"},{"t":"p","h":"камыш — камыш"},{"t":"p","h":"кан — кровь; кан куюу — переливание крови; кан тамырлары - кровеносные сосуды"},{"t":"p","h":"кана - 1. где? балдар кана? - где дети? 2. ну, ну-ка, давай, давайте; кана, баштадык - ну начали! кана, алдык! - ну-ка, взяли!"},{"t":"p","h":"канат — крыло"},{"t":"p","h":"кандай - какой, каков, как; кандай турасыңар? - как вы поживаете? кандай себептен? — по какой причине? сен кандай деп ойлойсуң? - как ты думаешь? быйыл буудайдын түшүмү кандай — какой в этом году урожай пшеницы? кандай болбосун — так или иначе"},{"t":"p","h":"канжа — трубка (курительная)"},{"t":"p","h":"кант - сахар; чакмак кант — сахар кусковый"},{"t":"p","h":"кантала — клоп"},{"t":"p","h":"капас — клетка (для птицы)"},{"t":"p","h":"кар — снег; кар түштү — выпал снег"},{"t":"p","h":"капчыгай — ущелье"},{"t":"p","h":"капчык — кошелек (мешочек)"},{"t":"p","h":"карагай — ель; калың карагай — густой еловый лес; кызыл карагай — сосна"},{"t":"p","h":"каракчы — грабитель, разбойник"},{"t":"p","h":"карга — ворона (общее название); ала карга — серая ворона; чар карга - грач; көк карга — сизоворонка"},{"t":"p","h":"каргаша — помеха, препятствие"},{"t":"p","h":"каргыш — проклятие"},{"t":"p","h":"кардар — покупатель"},{"t":"p","h":"карек — зрачок"},{"t":"p","h":"каркыра — журавль"},{"t":"p","h":"карлыгач — стриж"},{"t":"p","h":"карма — держи, хватай; лови; атымды кармай турчу — подержи-ка мою лошадь; алар каракчыны кармашты — они поймали разбойника, балык карма — лови рыбу"},{"t":"p","h":"карыз — долг, задолженность, заем, ссуда, кредит; карыз алуу — брать в долг; карыз берүү — давать в долг (взаймы); карыздан кутулуу — расплатиться с долгами"},{"t":"p","h":"карылык - старость; анын карылыгы жетти — он уже глубокий старик"},{"t":"p","h":"карышкыр - волк"},{"t":"p","h":"карыя - 1. старик; 2. старейшина"},{"t":"p","h":"касап, касапчы — мясник"},{"t":"p","h":"касташуу - враждовать"},{"t":"p","h":"кат - 1. письмо; кат жаз — напиши письмо; мен жолдошумдан кат алдым - я от своего товарища получил письмо"},{"t":"p","h":"ката — ошибка, погрешность, опечатка, ошибочный, неправильный; ката кетирүү - допустить ошибку; ал ката жазат — он пишет с ошибками"},{"t":"p","h":"катаал — трудный, тяжёлый, суровый; быйыл кыш катаал — нынче суровая зима; катаал климат — суровый климат; катаал турмуш — тяжёлая жизнь"},{"t":"p","h":"<span class=\"pg\" data-n=\"149\">149<\/span>катар — ряд, шеренга, строй; үчүнчү катарда олтуруу — сидеть в третьем ряду; бир катар болуп тизилүү — построиться в одну шеренгу; алдыңкы катар — передний ряд; катары менен — подряд"},{"t":"p","h":"кач — убегай, избегай; коён клеткадан качып кетти — кролик убежал из клетки; туткундан качып чыгуу — бежать из плена"},{"t":"p","h":"качкын - 1. беглец, дезертир; 2. беженец"},{"t":"p","h":"каш - 1. бровь; 2. лука (седла)"},{"t":"p","h":"кашаа - 1. скобка; тегерек кашаа - круглая скобка; чарчы кашаа — квадратная скобка; 2. забор"},{"t":"p","h":"кашкулак — барсук"},{"t":"p","h":"кебез — вата"},{"t":"p","h":"кездеме — мануфактура, ткань"},{"t":"p","h":"кейи — горюй, огорчайся"},{"t":"p","h":"кек — месть, злоба; кекеч — заика, кекечтен — заикайся"},{"t":"p","h":"кекилик — куропатка"},{"t":"p","h":"кекиртек — 1. трахея, дыхательное горло; 2. глотка"},{"t":"p","h":"кекчил — злопамятный, мстительный"},{"t":"p","h":"кел — приходи"},{"t":"p","h":"келбет — фигура, осанка; келбеттүү - красивый, статный, келбети келишкен жигит — красивый (статный, осанистый) парень"},{"t":"p","h":"келгин куштар — перелётные птицы"},{"t":"p","h":"кебек — шелуха (просо, ячмень и т. п.); кебек; шиш кебек — шашлык"},{"t":"p","h":"кебете — вид, форма; сырткы кебете — внешний вид"},{"t":"p","h":"кедей — бедный, бедняк; кедейлик - бедность"},{"t":"p","h":"кежиге — затылок"},{"t":"p","h":"кежир — упрямый, капризный"},{"t":"p","h":"келбет — вид"},{"t":"p","h":"келемиш — крыса"},{"t":"p","h":"келерки — будущий; келерки жылда - в следующем году"},{"t":"p","h":"келин — сноха, невестка"},{"t":"p","h":"келишим — соглашение, договор"},{"t":"p","h":"келүү — прийти, приходить"},{"t":"p","h":"кемтик — недостаток, дефект, недочёт, пробел"},{"t":"p","h":"кемчилик — 1. недостаток; нужда; 2. погрешность, неполадки, недочёт"},{"t":"p","h":"кеңеш — советуйся, совещайся"},{"t":"p","h":"кеңит — расширяй, делай обширным (широким, просторным), жолду кеңитти — он расширил дорогу"},{"t":"p","h":"кепе — избушка, шалаш"},{"t":"p","h":"кербен — караван, обоз; кербен башы — старшина каравана; начальник обоза; кербен сарай — караван-сарай (постоялый двор для каравана)"},{"t":"p","h":"керек — нужный, необходимый, надо, нужно, необходимо; бул мага керек - это мне нужно"},{"t":"p","h":"кесе — большая чашка"},{"t":"p","h":"кесек — кусок, комок; кесек эт — мясо крупными кусками"},{"t":"p","h":"кескин — резкий, решительный, категорический; кескин жооп берүү - дать решительный ответ"},{"t":"p","h":"кескич — зубило, долото, стамеска"},{"t":"p","h":"кесме — лапша"},{"t":"p","h":"келечек — будущий, будущее, грядущий, грядущее; келечек турмуш — будущая жизнь; келечек муундар — грядущие поколения"},{"t":"p","h":"кеме — корабль, судно; аба кемеси - воздушный корабль; кеме куруучулар - кораблестроители"},{"t":"p","h":"кенен — широкий, свободный, просторный, обильный; кенен бөлмө — широкая комната; баарына кенен жетет — на всех вполне хватает; кенен отуруу — сесть свободно"},{"t":"p","h":"<span class=\"pg\" data-n=\"150\">150<\/span>кенже — младший; кенже уул — младший сын; кенже илимий кызматкер — младший научный сотрудник: кенже лейтенант — младший лейтенант"},{"t":"p","h":"кеңири — широкий, обильный, расширенный; кеңири мүмкүндүк — широкая возможность; кеңири керектелүүчү товарлар — товары широкого потребления"},{"t":"p","h":"кеп — слово, разговор; кеп сал — рассказывай; куру кеп -пустой разговор, пустые слова; кепке келүү — соглашаться; сизде бир-эки ооз кебим бар эле - я хотел сказать вам несколько слов"},{"t":"p","h":"керек буюм - нужная вещь; ишке баруу керек — надо пойти на работу"},{"t":"p","h":"керээз — завещание, предсмертное наставление"},{"t":"p","h":"кескелдирик — ящерица"},{"t":"p","h":"кетмен — кетмень; кетмен менен казуу — копать кетменём"},{"t":"p","h":"кетүү — уходить, отправиться, удаляться"},{"t":"p","h":"кеч 1. поздно; кеч келди — поздно пришёл (приехал); биз ишти кеч баштадык — мы работу поздно начали; 2. вечер; кеч кирди - наступил вечер; поезд кечинде келет — поезд приходит вечером; кечке чейин — до вечера"},{"t":"p","h":"кечир — прости, прощай; мени кечирип кой — прости меня"},{"t":"p","h":"кечке — до вечера; мен кечке иште болдум - я до вечера был на работе"},{"t":"p","h":"кечкурун — вечером; кечкурун келемин — приду вечером"},{"t":"p","h":"кечүү — брод; переправа"},{"t":"p","h":"кийиз — войлок, кошма"},{"t":"p","h":"кийим — одежда; сырт кийим - верхная одежда; ич кийим — нижняя одежда; бут кийим — обувь; баш кийим - головной убор; кийим илгич — вешалка"},{"t":"p","h":"ким — кто; ким келди? - кто пришёл? ким билет? - кто знает? бул ким? - кто это? мени сураган ким? — кто меня спрашивал? бул кимдин үйү? — чей этот дом?"},{"t":"p","h":"кир — 1. грязь; грязный; кир көйнөк — грязная рубашка; кир болуу — загрязняться; 2. бельё (грязное); кир жуу - стирать бельё"},{"t":"p","h":"кириш - 1. вход, заход; 2. доход; приход, киришүү - вступление; начало, начинание; ишке киришүү — начало работы"},{"t":"p","h":"кирпи, кирпи чечен — еж"},{"t":"p","h":"кирпик — ресница"},{"t":"p","h":"кичине - 1. маленький; кичине балдар — маленькие дети; 2. немножко"},{"t":"p","h":"кишен — путы, оковы, кандалы"},{"t":"p","h":"киши — человек; эркек киши — мужчина; аял киши — женщина; ар бир киши — каждый человек; киши башына - на каждого человека (лично)"},{"t":"p","h":"коён — 1. заяц; 2. кролик"},{"t":"p","h":"козго — двигай, шевели"},{"t":"p","h":"козгол — двигайся, шевелись; козголоң — мятеж, смута, бунт, распри; козголоң чыгаруу - бунтовать, козголоңчу — бунтовщик, мятежник"},{"t":"p","h":"козу — ягнёнок; козукарын — гриб"},{"t":"p","h":"кокту — овраг, горная ложбина, впадина"},{"t":"p","h":"кокус, кокустан — нечаянно, внезапно, случайно, вдруг"},{"t":"p","h":"кол — рука; колдон келишинче — по мере возможности; колу ачык — щедрый; кол чабуулар — аплодисменты; кол үзүү — порвать связь; 2. почерк; бул анын колу эмес — это не его почерк"},{"t":"p","h":"комуз — комуз (музыкальный инструмент); комуз чертүү — играть на комузе"},{"t":"p","h":"конок — гость, гостья; конок болуу — быть гостем, быть в гостях; конокко чакыруу — приглашать в гости, звать в гости; конок үй — гостиная"},{"t":"p","h":"коңгуроо — звонок, колокольчик, бубенчик, колокол; акыркы коңгуроо — последний звонок"},{"t":"p","h":"<span class=\"pg\" data-n=\"151\">151<\/span>коңуз — жук"},{"t":"p","h":"коңшу - сосед, соседний, соседский; коңшу өлкөлөр - соседние страны; коңшу үй — соседний дом"},{"t":"p","h":"кооз — красивый, изящный; художественный; кооз үй — красивый дом"},{"t":"p","h":"коргон — защищайся, обороняйся, охраняйся"},{"t":"p","h":"коргоочу — защитник"},{"t":"p","h":"коргошун — свинец"},{"t":"p","h":"корк — пугайся, бойся, опасайся, страшись, робей; сен эмнеден коркосуң? — чего ты боишься? коркпой эле кой - не бойся, не робей"},{"t":"p","h":"короз — петух; балапан короз — петушок (молодой петух)"},{"t":"p","h":"көбөй — умножайся, увеличивайся; беш эсе көбөйдү — увеличилось в пять раз"},{"t":"p","h":"көбүк — пена, накипь, пузырь; самындын көбүгү — мыльная пена (мыльный пузырь)"},{"t":"p","h":"көбүнчө - в большинстве случаев, большей частью, по большей части, в основном; мен көбүнчө үйдө болом - я в основном бываю дома"},{"t":"p","h":"көгүчкөн — голубь; тынчтыктын көгүчкөнү — голубь мира"},{"t":"p","h":"көзөнөк — отверстие, дыра"},{"t":"p","h":"көйнөк — 1. рубашка, сорочка; 2. платье"},{"t":"p","h":"көкбөрү — козлодрание, скачки с козлом"},{"t":"p","h":"көл - озеро; көл жакалап басуу - идти вдоль берега озера"},{"t":"p","h":"көлмө — пруд"},{"t":"p","h":"көлөкө - тень, сень; дарактын көлөкөсүндө отуруу — сидеть в тени деревьев (под сенью деревьев)"},{"t":"p","h":"көмөк — помощь, поддержка; көмөк көрсөтүү — оказывать помощь"},{"t":"p","h":"көмүр - уголь; таш көмүр — каменный уголь; жыгач көмүр - древесный уголь: көмүр базасы - угольная база, көмүрчү — угольщик"},{"t":"p","h":"көңдөй — пустой, полый"},{"t":"p","h":"көңүлдүү — радостный, весёлый, радостно, весело; эс алуу көңүлдүү болду — отдых был весёлым"},{"t":"p","h":"көө — сажа"},{"t":"p","h":"көөдөн - грудь, верхняя часть туловища"},{"t":"p","h":"көп — много, множество, обильно"},{"t":"p","h":"көпөлөк — бабочка, мотылёк"},{"t":"p","h":"көпүрө — мост; көпүрөдөн өтүү — пройти (проехать) через мост; биз көпүрө салдык — мы построили мост; таш көпүрө — каменный мост; асма көпүрө — висячий мост"},{"t":"p","h":"көрк — красота, краса, изящество; тоонун көркү - таш менен, адамдын көркү — баш менен — красна гора камнями, а человек красен головой (умом); кыштак көркүнө чыкты - кишлак благоустроился"},{"t":"p","h":"көрнөк — вывеска"},{"t":"p","h":"көрүн - покажись; мага көрүнбөйт — мне не видно; я не вижу; айыл алыстан көрүнүп турат - аил виден издалека; сиз эмне көрүнбөй калдыңыз? - почему вас не видно?"},{"t":"p","h":"көч — кочёвка, перекочёвка"},{"t":"p","h":"көчмөн — кочевник, кочевой; байыркы көчмөндөр — древние кочевники; көчмөн элдер - кочевые народы (кочевые племена)"},{"t":"p","h":"көчө - улица; чоң көчө — большая (главная) улица; көчөдө жүрүүнүн эрежелери - правила уличного движения"},{"t":"p","h":"көчүрмө — выписка; копия"},{"t":"p","h":"кубала - гони, беги за ним, преследуй"},{"t":"p","h":"кубаныч - радость; кубаныч менен кабыл алдык — мы с радостью восприняли"},{"t":"p","h":"<span class=\"pg\" data-n=\"152\">152<\/span>куда - сват; куда болуу — стать сватом, породниться (через брак своих детей и родственников), кудагый — сватья"},{"t":"p","h":"кудук — колодец"},{"t":"p","h":"кузгун — ворон"},{"t":"p","h":"куй — налей, полей, вливай; чакага суу куй — налей воду в ведро; сизге чай куяйынбы? — налить вам чаю?"},{"t":"p","h":"куйкала — опали (курицу, овцу и т. п.)"},{"t":"p","h":"куймак — оладьи"},{"t":"p","h":"кулаалы - коршун"},{"t":"p","h":"кулпу — замок; кулпу салуу — запирать (закрывать) на замок"},{"t":"p","h":"кулун — жеребёнок (по первому году)"},{"t":"p","h":"кум — песок; кум дөбө - бархан; кум кайрак — рассыпчатая крупчатка; кумшекер — сахарный песок"},{"t":"p","h":"кумар — азарт; азартная игра; кумар ойноо — играть в азартные игры"},{"t":"p","h":"кумурска — муравей; көчөлөрдө эл кумурскадай кыжылдайт - на улицах люди, как муравьи, кишмя кишат"},{"t":"p","h":"кунан — жеребёнок (трёхлетний)"},{"t":"p","h":"кундуз — выдра, выдровый мех"},{"t":"p","h":"кур — поясь, ремень"},{"t":"p","h":"курал — оружие, снаряжение, орудие, прибор"},{"t":"p","h":"кургак — сухой, высохший; кургак отун — сухие дрова; кургак кийим — сухая одежда; кургак жерге отур - садись на сухое место"},{"t":"p","h":"курма — финик"},{"t":"p","h":"курсак — утроба, чрево, живот, брюхо; курсак ачты - есть охота; курсагыбыз ток — мы сыты"},{"t":"p","h":"курт — червь, червяк, курт жеген алма — червивое яблоко; жибек курту — шелковичный червь: курт-кумурска — всякие насекомые (букашки, козявки); каракурт — каракурт (ядовитый паук)"},{"t":"p","h":"куруучу — строитель"},{"t":"p","h":"курча — окружи, обступи, охватывай; опоясывай; аны жумушчулар курчап калышты - его окружили рабочие"},{"t":"p","h":"куса — тоска, печаль; куса болуу — тосковать, горевать"},{"t":"p","h":"куттукта — поздравь, приветствуй"},{"t":"p","h":"куудул — комик, имитатор"},{"t":"p","h":"куунак - весёлый, радостный, жизнерадостный; анын көңүлү куунак — у него весёлое настроение"},{"t":"p","h":"куурдак — жаркое, кавардак ( куманье)"},{"t":"p","h":"куурчак - кукла; куурчак театры - кукольный театр"},{"t":"p","h":"кууш - тесный, узкий; кууш көчө — узкая улица; кууш капчыгай - узкое ущелье"},{"t":"p","h":"куш - 1. птица; үй куштары — домашние птицы; төө куш -страус; суу куштары — водоплавающие птицы; 2. хищная птица; ловчая птица; куш салуу — охотиться с ловчей птицей; 3. ястреб (самка)"},{"t":"p","h":"куюн - вихрь, смерч"},{"t":"p","h":"күбө I — моль"},{"t":"p","h":"күбө II — свидетель"},{"t":"p","h":"күзгү — зеркало"},{"t":"p","h":"күзөтчү — сторож"},{"t":"p","h":"күзүндө — осенью"},{"t":"p","h":"күй — жди, ожидай, подстерегай; сага күйбөй, кетип калышты - они уже ушли, не дожидаясь тебя"},{"t":"p","h":"күйгүз — жги, сожги, сжигай, зажигай; кагазды күйгүздү — он жёг бумагу"},{"t":"p","h":"күкүк — кукушка; күкүк өз атын өзү чакырат (погов.) — кукушка сама себя кличет по имени"},{"t":"p","h":"күл — смейся; ал каткырып күлдү - он громко смеялся (хохотал)"},{"t":"p","h":"күлкү — смех; оюн-күлкү — весёлые забавы"},{"t":"p","h":"күлүмсүрө — улыбайся"},{"t":"p","h":"<span class=\"pg\" data-n=\"153\">153<\/span>күмөн — сомнение, подозрение; күмөн саноо — подозревать"},{"t":"p","h":"күмүш — серебро; күмүш шакек — серебряное кольцо; күмүш кашык - серебряная ложка"},{"t":"p","h":"күндө — каждый день, ежедневно; күндө эртең менен — каждый день утром"},{"t":"p","h":"күндүз — днём; күндүз саат үчтө — в три часа дня"},{"t":"p","h":"күнөө — вина, грех, проступок, преступление; мен эмне күнөө кылдым? - в чём моя вина? в чём я провинился?"},{"t":"p","h":"күрөк — лопата; темир күрөк — железная лопата; жыгач күрөк — деревянная лопата"},{"t":"p","h":"күрп — индюк; индейка, күртку — сугроб, снежный занос"},{"t":"p","h":"күрүч — рис; күрүч шорпо — рисовый суп"},{"t":"p","h":"күтүү - ожидать, ожидание"},{"t":"p","h":"күү — мелодия, мотив, напев"},{"t":"p","h":"күүгүм — сумерки; күн батып, күүгүм кирди — солнце село, наступили сумерки; күүгүм талаш - в сумерках"},{"t":"p","h":"күч — сила, мощь; чоң күч — большая сила; күчүн жыюу - собраться с силами"},{"t":"p","h":"күчө — усиливайся; шамал күчөп кетти — ветер усиливается"},{"t":"p","h":"күчтүү — сильный; күчтүү тамак — усиленное питание, питательная пища"},{"t":"p","h":"кыз — девочка, девушка, девица, (дочь)"},{"t":"p","h":"кызамык - краснуха"},{"t":"p","h":"кызгалдак — дикий мак"},{"t":"p","h":"кызыл - 1. красный; кызыл туу — красное знамя; кызыл жоолук — красная косынка; кызыл алма — красное яблоко; 2. румяный (о лице человека); румянец; кызыл жүз — румяное лицо, краснощёкий."},{"t":"p","h":"кыйгыл — кисловатый; кыйгыл даам — кисловатый вкус"},{"t":"p","h":"кыйкыр - кричи, выкрикивай; кыйкырбай, акырын сүйлө - не кричи, говори спокойно; балдарга кыйкыра баштады — он раскричался на детей."},{"t":"p","h":"кыйратуу — разрушение, разгром"},{"t":"p","h":"кык — навоз"},{"t":"p","h":"кылмыш - преступление; кылмыш кылуу — совершить преступление"},{"t":"p","h":"кылым - век, столетие; жыйырманчы кылым - двадцатый век; өткөн кылымдын алтымышынчы жылдарында - в шестидесятых годах прошлого столетия"},{"t":"p","h":"кылыч - меч, сабля"},{"t":"p","h":"кымбат — дорогой, ценный; кымбат белек — ценный подарок; кымбат товар — дорогой товар"},{"t":"p","h":"кымгуут - суматоха, переполох"},{"t":"p","h":"кымкап — парча"},{"t":"p","h":"кымыз — кумыс"},{"t":"p","h":"кын — ножны; бычактын кыны - ножны ножа; кылычтын кыны — ножны сабли"},{"t":"p","h":"кыраакылык — бдительность, зоркость, дальновидность, прозорливость"},{"t":"p","h":"кыргоол — фазан"},{"t":"p","h":"кыргыек — ястребок"},{"t":"p","h":"кыргыз — кыргыз; кыргыз тили — кыргызский язык; кыргыз эли — кыргызский народ"},{"t":"p","h":"кыргызча — по-кыргызски; кыргызча сүйлө — говори по-кыргызски"},{"t":"p","h":"кыргый — ястреб-перепелятник"},{"t":"p","h":"кырман - ток"},{"t":"p","h":"кыроо — иней; түндө кыроо түшүптүр — ночью выпал иней"},{"t":"p","h":"кыска — короткий, краткий, сокращённый, сжатый, коротко, кратко; кыска мөөнөттө — в сжатые сроки; кыска мөөнөттүү курстар — краткосрочные курсы; кыска жол - короткая дорога, краткий путь; кыска бойлуу — низкорослый;"},{"t":"p","h":"<span class=\"pg\" data-n=\"154\">154<\/span>кытыгы — щекотка"},{"t":"p","h":"кыш — зима; кыш түштү - наступила зима; кышка маал - к зиме"},{"t":"p","h":"кыштак — кишлак; селение"},{"t":"p","h":"кыштоо — зимовка, зимнее пастбище"},{"t":"p","h":"кыя — склон, откос, спуск"},{"t":"p","h":"кыяк - 1. гармошка; ооз кыяк — губная гармошка; 2. кияк (двухструнный смычковый инструмент типа скрипки)"},{"t":"p","h":"кээ, кээ бир — некоторый, кое-кто; кээ бир адамдар - некоторые люди; кээде — иногда; кээ кээде — изредка"},{"t":"h3","h":"М"},{"t":"p","h":"маал - 1. время; момент; жумуш маалы — рабочее время; кечке маал - к вечеру; таңга маал - к рассвету; ушу маалга чейин — до сих пор; 2. раз; күнүгө эки маал - два раза в день"},{"t":"p","h":"маанай — настроение; анын бүгүн маанайы пас — он сегодня плохо настроен (у него сегодня плохое настроение)"},{"t":"p","h":"мага — мне; мага бер — дай мне"},{"t":"p","h":"маданияттуу - культурный; маданияттуу жаштар — культурная молодёжь."},{"t":"p","h":"маек — беседа"},{"t":"p","h":"мажбур — вынужденный; принужденный, обязанный; мажбур болуу — быть вынужденным"},{"t":"p","h":"май - 1. жир, сало; койдун майы - бараний жир; чочконун майы - свиное сало; 2. масло; сары май - топлёное масло"},{"t":"p","h":"маймыл - обезьяна"},{"t":"p","h":"майрам — праздник; майрам күндөрү — праздничные дни; май майрамы - майский праздник"},{"t":"p","h":"маки — перочинный нож"},{"t":"p","h":"макоо — непонятливый, бестолковый, тупица"},{"t":"p","h":"макта - хвали; ал мактай турган киши — он достойный восхваления (похвалы) человек; мактанчаак — хвастун"},{"t":"p","h":"макул — ладно, согласен; мен макулмун — я согласен; макул көрүү — одобрять, считать приемлемым; с

амдап, ханга алып барышты. Хан тобу али дасторкондон тура элек экен. Ал учурда хан кардай аппак кийизде жан-жөкөрлөрүнүн ортосунда бал кошкон кымыздан ууртап коюп, жаагын жанган ырчылардын мактоо ырларын угуп олтурган. Эл топурап келген себепти ' кыргызды кырган жоо – враг, истребивший кыргызов * сарымсак-согон – дикий лук 3 бал кошкон кымыз – кумыс, подслащенный медом (букв.), т. е. очень вкусный * жаагын жанган ырчылардын – мында: голосистых, задорных певцов <span class=\"pg\" data-n=\"82\">82<\/span>угуп, хандын жаалы чыкты көзүнөн: «Тынчымды алган ким экен? Кыргыз уруусун тукум курут кылганыбыз жалганбы? Силерге түбөлүккө Энесайды тартып бергеним жалганбы? Эми кимден жан таштап качып жүрөсүңөр? Коркконунар ушул чыпалактай эки балабы?»"},{"t":"p","h":"– «Эй! Майрык-Чаар-Жезкемпир! – деп кыйкырды хан. Анан бир кемпир топтон суурулуп, алдына келгенде ага буюрду:"},{"t":"p","h":"– Бул экөөнү Тайга токоюна алпарып таштагын да, кыргыздын аты чыккыс, үнү угулгус кыл. Экинчи кыргыз деген сөздү кулагым чалбасын. Кыргыз тукумуна жер үстүндө орун жок, түбөлүк аты өчсүн! Бар, Майрык-Чаар-Жезкемпир, буйрукту аткар!..» Ошону менен Майрык-Чаар-Жезкемпир эки баланы колунан жетелеп, тоо ашып, токой аралап жүрүп олтуруп, Энесайдын жээгине жетип токтоду. Анан балдарды жардан алыс түртмөкчү болуп камданды..."},{"t":"p","h":"кабыктан себет токумак – хотели сплести корзину из прутьев."},{"t":"p","h":"бир маалда – в одно мгновенье. ....., ...... адамча сүйлөгөн Бугу-Эне пайда болду. дүңгүрөгөн доош, күтүрөгөн калың дабырт – гул, грохот, топот копыт. Дүңгүрөгөн добуш чыкты. Күтүрөп мал өттү. Дабырттап жаан жаады."},{"t":"p","h":"этектеги көк жайыкта – внизу на широком зеленом лугу."},{"t":"p","h":"жеңишин майрамдап жаткан экен – праздновали победу. Кыргызды кырып кеткен жоо ...... ...... ...... ...... . дөбөдөн түшүп барышты – мында: спустились с холма."},{"t":"p","h":"хандын жаалы чыкты – хан пришел в страшную ярость. Хан жаалданды. Мугалимдин ...... катуу."},{"t":"p","h":"топтон суурулуп келгенде – когда она выступила из толпы. Карина топтон ...... качты, Кылыч кыкынан ......."},{"t":"p","h":"аты чыккыс, үнү угулгус кыл – чтобы имя забылось и не слышно было его голоса. Кыргыз ...... чыкпасын, ...... угулбасын! – деди хан. Ирендин ...... биринчи келди. Эркелейдин ...... ...... калды."},{"t":"p","h":"кыргыз деген сөздү кулагым чалбасын – чтобы мои уши больше не слышали слово кыргыз. ...... ...... ...... ...... ......, бул балдарды жогот, – деп кан буйрук берди."},{"t":"p","h":"жардан алыс түртмөкчү болуп – чтобы столкнуть с обрыва. Жар айттым. Басье алыс кетти. Абай ядрону түрттү."},{"t":"v","l":["' жан таштап качып жүрөсүңөр – трусливо ходите в бегах","* Эй! Майрык-Чаар-Жезкемпир! – Эй, Рябая Хромая Старуха!","* буйрукту аткар! – сделай так, как я велю!"]},{"t":"p","h":"<span class=\"pg\" data-n=\"83\">83<\/span>1. Бала менен кыз кандайча токойдо калышты эле? 2. Алар айылга келгенде эмнени көрүштү (что увидели) жана кайда жөнөштү?"},{"t":"p","h":"3. Жоонун ханы аларды кандай кабыл алды (как принял) жана эмнеге буюрду?"},{"t":"p","h":"4. Майрык-Чаар-Жезкемпир аларды кайда алып барды жана эмнеге камданды (чему готовилась)?"},{"t":"p","h":"1. Бул бөлүмдүн мазмунун көңүл коюп окуп чыккыла. Ханга жана кемпирге мүнөздөмө бергиле."},{"t":"p","h":"2. Өзүңөргө түшүнүксүз сөз тизмектерин (словосочетания) бөлүп жазып алгыла жана мугалимдин жардамы менен чечмелегиле."},{"t":"p","h":"3. Текстти айтууда жардамчы сөздөрдү пайдалангыла: тилазар балдар, ызы-чуу, өлүү журт, жоо, улутуна бышактап, жырткыч, желмогуз, көк жайыкта, жан-жөкөрлөр, жаалы чыкты, тоо ашып, токой аралап ......"},{"t":"p","h":"III"},{"t":"h3","h":"Бугу-Эненин жакшылыгы"},{"t":"p","h":"Аңгыча жан жактан бир үн чыкты:"},{"t":"p","h":"– Ашыкпа акылман эне, күнөөсүз балдарды жайлаба! Майрык-Чаар-Жезкемпир кылчая карап, айран-таң калды. Жанында Бугу-Эне турат эки көзү балбылдап. Балбылдаган көздөрү муңайым, өтүнүчтүү тиктейт. Маралдын умай энеси, асыл бугу маңкаят, омуроо-төшү наристенин маңдайындай, жону ууз ак, боору тайлак жүндөнүп көк буурул. Он сегиз айры мүйүзү аркайып, жонуп койгондой жымсал сулуу, көркөм. Желини таза, кан тамырлары көрүнүп ийип турат эки балага мээримин салып."},{"t":"p","h":"– Сен кимсиң? Адамча сүйлөп кубулган кандай жансын?- деди Майрык-Чаар-Жезкемпир."},{"t":"p","h":"– Мен Бугу-Эне болом. Адамча сүйлөбөсөм сен кандай түшүнмөксүң да, кандай собол укмаксың."},{"t":"v","l":["– Каалаганың эмне, Бугу-Эне?","","' аңгыча жан жактан – вдруг со всех сторон","* жайлаба (мында: өлтүрбө) – не губи, не убивай"]},{"t":"p","h":"3 көздөрү муңайым, өтүнүчтүү тиктейт – глаза смотрят с мольбой и грустью * омуроо төшү наристенин маңдайындай – мында: грудь белая, как лоб младенца 5 боору тайлак жүндөнүп – шерсть груди малого верблюжонка"},{"t":"v","l":["в айры мүйүзү аркайып – торчат развесистые рога","7 мээримин салып ийип турат – с любовью поит детей своим молоком","* собол – просьба"]},{"t":"p","h":"<span class=\"pg\" data-n=\"84\">84<\/span>– Балдарды кое бер, акылман эне. Сенден сураганым ушул эки чүрпөнү мага бер."},{"t":"p","h":"– Буларды эмне кыласың?"},{"t":"p","h":"– Адамдар эгиз музоомду атып олтурушту. Балдарымдын ордуна бала издеп жүрөм."},{"t":"v","l":["– Ушу балдарды эмизип багып алам дейсиңби?","– Ошентем, акылман чоң эне."]},{"t":"p","h":"– Жакшылап ойлондуңбу, Бугу-Эне? – деп күлдү Майрык-Чаар-Жезкемпир. – Булар деген адам баласы. Чоңоюп алып, өзүңдүн бугучаларына ок атат, ошону ойлондуңбу?"},{"t":"p","h":"– Чоңойгондо булар бугучаларыма кол көтөрбөйт, – деди маралдын умай энеси."},{"t":"p","h":"– Мен буларга эне болом, булар мага бала болуп калат. Анан кантип өз ага-карындаштарына жамандык санасын?"},{"t":"p","h":"– О, кең пейил Бугу-Эне, адам деген кандай экенин али билбейт турбайсыңбы! – деп башын чайкады Майрык-Чаар Жезкемпир. – Адамдар кайберен эмес, бирин-бири аябайт. Сөзүмдүн актыгын Өз көзүң менен көрөрсүң, өз мойнуң менен тартарсың, бул эки жетимди сага берип деле коер элем, бирок, башка адамдар көрөр замат бул эки кичинекей адамды өлтүрүп салат. Анда булардын да азабын тартып сага эмне күч келди?"},{"t":"p","h":"– Эч ким таппас алыс жактарга алып кетем бу балдарды. Аясаң, акылман чоң эне, кое берсең. Өз балдарымдан кем көрбөй асырайын, жетимдерге эне болоюн ...... Желиним сүткө толуп турат. Бала деп сыздап, бала деп ийип турат ак сүтүм..."},{"t":"p","h":"– Кантейин, болуптур, – деди ойлонуп туруп Майрык-Чаар-Жезкемпир. – Сурап калдын, бирок тез кет бул жерден. Жетимдерди аман жеткир алыс жерине. Жок, эгер аякка жетпей жолдо өлсө, же каракчылар жайласа же өздөрү чоңоюп алып, ак сүтүн унутуп, адамдын арамдыгына кетсе, өзүңөн көр."},{"t":"v","l":["' чүрпөнү (чүрпөлөрдү) – детишек, ребятишек","* жакшылап ойлондуңбу? – ты хорошенько подумала?","* кол көтөрбөйт – мында: не станут убивать","* бири-бирин аябайт – не жалеют друг друга","5 азабын тартып эмне күч келди? – зачем же тебе столько мучения","“асырайын (багайын) – буду ухаживать, присмотрю","7 кантейин, болуптур – мында: ну что ж, коли так","8 каракчылар жайласа – (если) убьют разбойники","* өзүңөн көр – пеняй на себя"]},{"t":"p","h":"<span class=\"pg\" data-n=\"85\">85<\/span>Бугу-Эне Майрык-Чаар-Жезкемпирди узатты да, анан уул бала менен кыз балага айтты:"},{"t":"p","h":"– Балдарым, мен эми силердин энеңермин. Мен силерди кардуу алкак Ала-Тоосу бар, күмүштөй Теңир-Тоосу бар, боордо токой чери бар, ортосунда Ысык-Көлү бар жерге алпарам. Кыргыз тукуму курут болуп кетээрде экөөң элдин атын өчүрбөй кайра тукум улансын, укум-тукумуна мекен болсун деп ал жерди теңирден сурап алдым."},{"t":"p","h":"Балдар так секирип кубанды, тепендешип мүйүздүү Бугу-Эненин соңунан чуркап алды. Жол алыс, учу-кыйры жок жердин бир четинен бир четине. Узак жолдо балдар арып-ачты, алдан тайды. Бугу-Эне балдарын ак сүтү менен багып жүрүп отурду."},{"t":"p","h":"эки көзү балбылдап – глаза горят. Бугу...... муңайым тиктеди. Үкүнүн көзү түнүчүндө ...... көрүнөт. жону ууз ак – спина белая, как молозиво. Эржан жонго чыкты. Лари биринчи жолу ууз ичти. Каринанын ниети ак."},{"t":"p","h":"жонуп койгондой – будто обстругали. Мүйүздөрү ............ жылмакай. эгиз музоомду – двойню мою, двух оленят."},{"t":"p","h":"бугучаларына – оленятам. Адамдар ...... ок атышат. Айкүмүш менен Айалтын ...... кыздар."},{"t":"p","h":"алыс жактарга – в дальние края."},{"t":"p","h":"желиним сүткө толуп турат – мое вымя наполнилось молоком. ...... ...... ......, бугучаларымды адамдар атып кетишкен, – деди Бугу-Эне."},{"t":"p","h":"жетимдерди аман жеткир – доведи сирот целыми и невредимыми."},{"t":"p","h":"укум-тукумуна мекен болсун деп —- чтобы потомкам родиной стал. Ала-Тоо – кыргыздын ...... ...... ...... болду."},{"t":"p","h":"IV"},{"t":"h3","h":"Ысык-Көлдө"},{"t":"p","h":"Ошентип жүрүп отуруп, акыры Бугу-Эне балдарын Ысык-Көлгө жеткирди. Туу чокудан карап туруп, көргөн көздөрүнө таң калышты. Тегерете курчаган ак карлуу алкак Ала-Тоо, боор жапкан чер токой, ортодо мөлтүрөгөн ирим көл. Буурул жал толкундары арылдаган шамалга бир четинен түрүлүп, бир четинен үркүп жатат."},{"t":"p","h":"1 буурул жал толкундары – мында: (обр. выр.) сивогривые волны * шамалга бир четинен түрүлүп, үркүп – мында: плещут от ветра <span class=\"pg\" data-n=\"86\">86<\/span>Көлдүн баш-аягына кез жетпейт. Этегинен күн чыкса, төрүндө али таң ата элек. Тегерете курчаган алкактаган Ала-Тоонун чокусуна мунарланган Теңир-Тоо катарына сан жеткис."},{"t":"p","h":"– Мына ушул жер силерге мекен болот, – деди Мүйүздүү Бугу-Эне. – Жер тилип, эгин эккиле, мал багып, балык уулагыла, ошентип бейпил кеңчилик, бейкут тынчтыкта миң-миң жыл өмүр сүргүлө. Учуңар узарып, урук-тукумуңар көбөйсүн, алдыңарды бала басып, аркаңарга мал толсун. Сүйлөсө тилге жатык, укса кулакка мукам, алыстан ала келген эне тилиңерди укум-тукумуңар унутпасын, эне тилинде эл-жерин даңазалап ырдап жүрсүн. Кишиден кем болбогула. Мен эми силерге, силердин бала-чакаңарга Умай Энемин, силер менен түбөлүккө бирге жүрөм..."},{"t":"p","h":"Ошентип, кырылган кыргыздан калган уул бала, кыз бала. Теңирдин батасы тийген Ысык-Көлдү мекендеп туруп калышат..."},{"t":"p","h":"туу чокудан карап туруп посмотрев с самой верхушки горы. ...... карап таңданышты. Туу желбиреди."},{"t":"p","h":"урук-тукумуңар көбөйсүн – чтобы размножалось ваше потомство."},{"t":"p","h":"укса кулакка мукам (жагымдуу) – мында: слушать приятно. Кыргыз тили – мукамдуу, жагымдуу тил. Эркелейдин күлкүсү ......, ......"},{"t":"p","h":"түбөлүккө бирге жүрөм – буду вечно с вами. Мен болсо силер менен ...... ...... ...... ."},{"t":"v","l":["1. Бугу-Эне менен Майрык-Чаар-Жезкемпир эмне деп сүйлөшүштү? 2. Бугу-Эне балдарды аман алып калып, кайда жеткирди?","3. Ала-Тоонун, Ысык-Көлдүн көрүнүшү кандай эле?","4. Бугу-Эне балдарга эмнелерди түшүндүрдү (объяснила)?"]},{"t":"p","h":"1. Бугу-Эне менен Майрык-Чаар-Жезкемпирдин диалогун ролдорго бөлүп аткаргыла."},{"t":"p","h":"2. Ала-Тоонун жана Ысык-Көлдүн көрүнүшүн сүрөттөп жазгыла."},{"t":"p","h":"3. Бугу-Эненин балдарга кайрылууларын (обращение) жаттагыла. Текстти айтууда пайдалануучу сөздөр: эки көзү балбылдап, умай энеси, он сегиз айры мүйүз, собол, бугучаларга, кайберен эмес, желиним сүткө толуп, элдин атын өчүрбөй, арып-ачты, алдан тайды, мекен, эне тилиңерди, укум-тукумуңар, ..."},{"t":"p","h":"4. Боштуктарга тиешелүү сөздөрдү койгула: Түн....... бейкут өттү. Көк жайыкта ...... той болуп жатат. Бугунун көздөрү балбылдап ...... ...... муңайым. Желиним ...... болуп, ...... толуп турат. Балдарым мен силерди ...... Ысык-Көлгө. ...... Ала-Тоого алпарам."},{"t":"p","h":"' мунарланган тоо катарына сан жеткис – не сосчитать ряд окутанных мглой гор. Теңирдин батасы тийген – благославленное Теңиром <span class=\"pg\" data-n=\"87\">87<\/span>V"},{"t":"h3","h":"Салттын бузулушу"},{"t":"p","h":"Мүйүздүү Бугу-Эне болсо сырттан калкалап, ушул жердин токоюнда жүрдү. Убакыт куштай учту. Уул бала эр жетти, кыз бала бой жетти. Экөө баш кошту."},{"t":"p","h":"Күндөрдүн бир күнүндө Ысык-Көл буркан-шаркан болуп толкуп чыкты. Ал анткени, жаш зайыптын толгоосу башталган. Эр адам чочулады. Зоокага чуркап чыгып, тегерекке үн салды."},{"t":"p","h":"– Мүйүздүү Бугу-Эне, кайдасың? Ысык-Көлдүн толкуганын карачы. Кызың толготуп жатат. Тезирээк жетип кел, Мүйүздүү Бугу-Эне, жардамыңды бер!.."},{"t":"p","h":"Ошондо алыстан-алыстан жылаажын үн угулду. Анан маңкаңдай Мүйүздүү Бугу-Эне жетип келди. Куру келбей, он сегиз айры мүйүзүнө бешик илип келди. Ак кайындан жасаган ак бешиктин туткасында күмүш жылаажын шыңгырайт. Ошол жылаажын ушу азыр да көлдүктөрдүн бешигинде илинүү, эне баласын бөлөп терметсе, мукам үнү шыңгырап турат. Азыр да жылаажын үн чыкканда Мүйүздүү Бугу-Эне мүйүзүнө кайың бешик илип алып, бала терметип үйгө шашып келаткандай болот..."},{"t":"p","h":"Ошентип, Мүйүздүү Бугу-Эне жетип келери менен зайып көз жарат."},{"t":"p","h":"– Бул бешик силердин тунуңарга, – дейт Мүйүздүү Бугу-Эне. – Жети уул, жети кыздуу болосуңар, баары ушу бешикке жатып чоңойсун."},{"t":"p","h":"Ата-эне кубанды. Мүйүздүү Бугу-Эненин урматына тун уулунун атын Бугубай деп коёт. Бугубай эр жетип, Кыпчак элден колукту алат, бала-чакалуу болот."},{"t":"p","h":"Ошентип Мүйүздүү Бугу-Эненин тукуму, Бугу уруусу улана берет, көбөйө берет. Эл толуп, Ысык-Көлдү кылаалай конот. Баары Мүйүздүү Бугу-Энени Умай энебиз деп, атын-салтын ыйык тутат. ' баш кошту (үйлөнүштү) – поженились"},{"t":"v","l":["? буркан-шаркан болуп – мында: (волны) бурно метались","8 толготуп жатат – схватки (родовые) начались","* жылаажын үн – переливчатый звон","5 илип келди – подцепил за дужку","° күмүш жылаажын шыңгырайт – звенит серебряный колокольчик","т зайып коз жарат – мында: женщина разродилась","* бул бешик силердин тунуңарга – эта колыбель вашему первенцу","* мүйүздүү урматына – в честь рогатой Матери -Оленихи"]},{"t":"p","h":"<span class=\"pg\" data-n=\"88\">88<\/span>Оюу ойгон, сайма сайган өнөрпоздор бугунун мүйүзүн салып көркөмдөшөт. Басып келген жоого каршы чыкканда, же эрегишип байге чапканда «Бугу!» деп ураан чакырат. Ысык-Көлдүн токоюна Бугу эненин балдары ак маралдар толот. Аларга эч ким тийбейт, эч ким үркүтпөйт. Маралды көргөндө жол жүрүп бараткан бугулук киши атынан түшүп, жол берет."},{"t":"p","h":"Ошентип, ата салты, эне адебин эл ыйык тутуп келе берет. Бир күнү жылкысы сан, кою түмөн бугулук бир бай каза болот. Балдары ат жетпеген жерден эл чакырып, жер дүңгүрөтө аш берет. Көл кылаалай миң бир жүз боз үй тигилет."},{"t":"p","h":"Ошентип жер дүңгүрөткөн аш нечен күн, нечен түн болот. Кулагы уккан, көзү көргөндүн баары даңк айтып, балдарынын зоболосун көкөлөтө кеп кылат. Бирок балдары ага да каниет кылбайт. Мүйүздүү Бугу-Эненин тукумунан болчу атабыз, эми ата тукумунун даңкын чыгарабыз деп, атанын күмбөзүнө бугунун мүйүзүн белги кылып коймой болот."},{"t":"p","h":"Алиги байдын балдары, атанын арбагына ушинтип кесирлүү урмат көрсөтмөй болот. Мергендерди шайлап, туш-тарапка чаптырат. Мергендер он сегиз мүйүз бугу таап, атып өлтүрөт да, мүйүзүн түбү менен омкоро чаап кетишет. Демек, он сегиз асый бугу экен. Усталарды алдырып, атасынын күмбөзүнүн мандайына орнотушат."},{"t":"p","h":"Балээнин бардыгы мына ошондон башталат."},{"t":"p","h":"Мүйүздүү Бугу-Эненин тукумуна каран түн түшөт. Буту менен басып, мурду менен тынгандын баары мылтык атып, жаа тартып, ак маралдын артынан сая кууйт."},{"t":"p","h":"Ошентип, Ысык-Көлдүн бугу-маралы кыргынга калат. Аяган жан болбойт. Жайылган жайытынан куулат, түнөгөн түнөгүнөн 1 эч ким үркүтпөйт – мында: никто не пугает (их)"},{"t":"v","l":["жылкысы сан, кою түмөн – несметное количество лошадей и овец","аш берет – устроили поминки","жер дүңгүрөткөн аш – мында: великие поминки","5 даңк айтып – прославляя","Ш атанын күмбөзүнө – гробнице отца"]},{"t":"p","h":"1 кесирлүү урмат көрсөтмөй болот – мында: захотели оказать честь, повлекшую за собой беду омкоро чаап кетишет – срубили (его рога) мүйүздүү Бугу-Эненин тукумуна каран түн түшөт – горе охватило потомство рогатой Матери-Оленихи '© буту менен басып, мурду менен тынгандын баары – (фр.) мында: чуть ли не каждый аяган жан болбойт – никто их не жалел <span class=\"pg\" data-n=\"89\">89<\/span>сүрүлөт, оболу ким тандап атат деп мелдешкендер, эми ким көп сулатты деп мелдешет. Мүйүздөрү аркайган бугу-марал балбылдаган шам чырактай көздөрүнөн аккан жашы кургабай боо түшөт. Акыры көл тегерегинен бугу-марал жоголот. Кадимки жайытынан маңкайып карап турчу карааны өчөт. Түн ортосу же таң ата бау-бау бакырган үн өчөт. Алты айры мүйүзүн жонуна чаап, жар башынан каргыган элеси өчөт. Тоо-токой ээн калат."},{"t":"p","h":"Ушул эле Умай-Эне болгон Мүйүздүү Бугу-Эне кантти дебейсиңби?"},{"t":"p","h":"Бугу адамдардын арамдыгына нааразы болот. Ит агытып, ок аткан адамдардын колунан тукуму бүт кырылып кетер болуп, саналуу гана маралы калганда Бугу-Эне аларды касиетине калкалай качат. Ала-Тоонун аскасынан Теңир-Тоонун чокусуна бир аттап чыгат да, кылчайып Ысык-Көл менен коштошот. Ошол бойдон кайдадыр кулак укпаган, көз көрбөгөн бир жерлерге кетип калган экен..."},{"t":"p","h":"маңкаңдай жетип келди – мында: пришла, шагая бодро. Бугу маңкаңдап басат."},{"t":"p","h":"бешик – колыбель."},{"t":"p","h":"бешиктин туткасында – на дужке колыбели. Эшиктин ...... ‚ Көнөчөктүн ......, бешикке бөлөп терметсе – если качать, уложив в колыбели."},{"t":"p","h":"бугунун мүйүзүн салып көркөмдөшөт – украшали, вышивая рога марала. басып келген жоого каршы чыкканда – когда отражали набеги врагов. атынан түшүп жол берет – уступали дорогу, слезая с коня."},{"t":"p","h":"ата салты, эне адебин ыйык тутуп – мында: свято хранили отцовские традиции и материнские нравы."},{"t":"p","h":"зоболосун көкөлөтө кеп кылат – повышая авторитет (его) говорят (о нем как возвышенный)."},{"t":"p","h":"кууйт – мында: настигнуть. Мергендер бугуларды куушту."},{"t":"p","h":"жайытынан куулат, түнөгүнөн сүрүлөт – из пастбищы прогонят, из ночлега оттеснят."},{"t":"v","l":["' карааны өчөт – мында: исчезли","* бау-бау – подражание окрику маралов","* жар башынан каргыган – (с обрыва выступал) виднелся с обрыва","* нааразы болот – мында: обиделась, была удручена"]},{"t":"p","h":"° кулак укпаган, көз көрбөгөн бир жерлерге – в неслыханные и невиданные края <span class=\"pg\" data-n=\"90\">90<\/span>ким көп сулатты деп мелдешет – затевают споры, кто больше убьет. Байдын көпкөн балдары ...... ...... ...... деп мелдешет."},{"t":"p","h":"балбылдаган шам чырактай көздөрү (сал.) – глаза, как пылающие свечи (сверкающие). Олесянын көздөрү ...... ......."},{"t":"p","h":"касиетине калкалай качат – увела; защищая собой. Ысык-Көл ...... кел. Эне баласын ......:"},{"t":"v","l":["1. Бугу уруусу кантип пайда болду?","2. Алгач алар бугуга кандай мамиле кылышчу?"]},{"t":"p","h":"3. Байдын балдары кандай жорук (поведение, поступки) жасашты?"},{"t":"p","h":"4. Бугулар кантип кырылды? Бугу-Эне адамдын арамдыгына көзү жеткенден кийин (когда убедилась) эмне кылды?"},{"t":"p","h":"о 1. «Жакшылык жана жамандык», «Адам жана жаратылыш» деген темаларда өзүнөрдүн окуган, көргөн-билгениңерди пайдаланып аңгеме-дүкөн кургула."},{"t":"p","h":"2. Элдеги каада-салт, ыйыктык (святость) жана азыркы учурдун таасири тууралуу талкуу же адабий викторина уюштургула."},{"t":"p","h":"З. Чыгармадагы образдарга мүнөздөмө берип, сүрөттөрүн тарткыла."},{"t":"p","h":"4. «Бугу-Эненин мээрими жана кесир инсан» деген темада дилбаян жазгыла."},{"t":"p","h":"5. Кыргыз тилиндеги төмөнкү санжыргалуу сөз берметтерин, фразеологизмдерди жаттап алып, кебиңерде колдонууга аракет кылгыла: күлүн көккө сапыруу, тукум курут кылуу, буту менен басып, мурду менен тынгандар, башына каран түн түштү, чымын жаны көккө учуу, өмгөктөгөн кары, эмгектеген бала, ойноо бала, секелек кыз, өлүү журт, баш кошушту, ата салты, эне адеби, жосунуңар жолдо калсын, кепке кемтик, сөзгө сөлтүк, кулак укпаган, көз көрбөгөн, ......"},{"t":"p","h":"6. Кыргыз элинин каада-салттарын атап, алардын колдонулушунан кабар бергиле."},{"t":"p","h":"Үлгүсү: ат коюу – бала төрөлгөндө, азан чакырып, эл коноктоп, ат коюлган. 7. Макалдардын маанисин чечмелегиле:"},{"t":"v","l":["«Өлтүргөндүн өчү бар, төгүлгөн кандын куну бар».","«Жетимдин жары кыдыр, тагдыры эки ача»,","«Жоодон өлгөн салтанат, үйдөн өлгөн аманат».","«Жер – казына, суу – алтын»."]},{"t":"p","h":"8. Переведите на кыргызский язык и объясните их значение: святой, от поколения к поколению, благодеяние, клевета, упрашивать, очаг, заносчивость, возгордившись, обозлившись. Ата салты, эне адеби, ыйыктык, эне тили тууралуу билген макал-лакап, учкул сөзүңөрдү кыргыз тилине которгула. Окуя өткөн жерлердин картасын чийгиле."}],"sub":[{"title":"Жоо чабуу","b":3},{"title":"Ойноок бала менен секелек кыз","b":41},{"title":"Бугу-Эненин жакшылыгы","b":74},{"title":"Ысык-Көлдө","b":104},{"title":"Салттын бузулушу","b":119}],"section":"КАСЫМАЛЫ БАЯЛИНОВ","pages":[77,90]},{"title":"НАКЫЛ СӨЗДӨР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"91\">91<\/span>НАКЫЛ СӨЗДӨР"},{"t":"p","h":"Адамга эки нерсе тирек деги:"},{"t":"p","h":"Бири – тил, бири – дилиң жүрөктөгү."},{"t":"h3","h":"Ж. Баласагын"},{"t":"h3","h":"БИЛИП АЛГЫЛА (Географиялык маалымат)"},{"t":"p","h":"Энесай (Енисей) – река Северной Азии. Почти на всем протяжении протекает по границе Западной и Восточной Сибири. Ныне находится в пределах Красноярского края России. Длина 4130 км. Енисей образуется слиянием рек Большой Енисей (Бий-Хем) и Малый Енисей (Ка-Хем)."},{"t":"p","h":"Ала-Тоо (тюрк. – пестрые горы) – название ряда горных хребтов в Центральной Азии: Күнгөй Ала-Тоо и Тескей Ала-Тоо, Таласский Ала-Тоо находится в нашей республике."},{"t":"p","h":"Ысык-Көл – Иссык-Куль, (кырг.- горячее озеро) – бессточное озеро в Киргизии. Одно из крупнейших горных озер мира. Площадь около 6200 км, средняя глубина 279 м, расположено в Тянь-Шане на высоте 1609 м в межгорной котловине, окруженной высокими горными хребтами Күнгөй Ала-Тоо и Тескей Ала-Тоо. Зимой температура воды на поверхности не опускается ниже +2,75°, вследствие чего озеро, за исключением его залива и узкой прибрежной зоны отдельных районов, никогда не замерзает."},{"t":"p","h":"(Географическая информация)"},{"t":"p","h":"табгач, он ок – название тюркских племен."},{"t":"v","l":["Таш-Баба – балбал (глыба)","тулга (ист.) – таган, треног."]},{"t":"p","h":"селкинчек тебүү – качаться на качелях. Обычно на один конец становится девушка или молодуха, на другой – парень."},{"t":"p","h":"Умай эне – мифическое святое женское существо, охраняющее младенцев и домашний очаг."},{"t":"p","h":"ууз (этн.) – молозиво в кипяченом виде; в кыргызском быту считается священным лакомством."},{"t":"p","h":"<span class=\"pg\" data-n=\"92\">92<\/span>Теңир – бог, (Употребляется вместо кудай или как парное к нему). алдыңарды бала басып, аркаңарды (артыңарды) мал бассын (этн.) – да будут пред вами дети, а позади вас (многочисленный) скот! (пожелание счастья и благополучия)."},{"t":"v","l":["эр жетүү, бой жетүү – возмужание парня, взросление."," бой (бойго) жетүү – совершеннолетие девушки (взросление)."]},{"t":"p","h":"арбак (миф) – духи святых или чтимых предков, которые должны помогать призывающим их или карать врагов."}],"sub":[{"title":"Ж. Баласагын","b":3}],"section":"КАСЫМАЛЫ БАЯЛИНОВ","pages":[91,92]},{"title":"АТАДАН КАЛГАН ТУЯК (Солдатёнок)","blocks":[{"t":"h3","h":"АТАДАН КАЛГАН ТУЯК (Солдатёнок)"},{"t":"h3","h":"I. Авалбек ким?"},{"t":"p","h":"Өз атасын ал биринчи жолу кинодон көрдү. Анда беш-алты жашар эселек чагы."},{"t":"p","h":"Бул окуя тээ кыштактын сыртындагы агарып турган чоң кашарда жүн кыркуудагы болгон иш. Совхоздун кыркымы жылыга ушул жерде өткөрүлүүчү. Чоң кашар азыр да ордунда, адырдан түшө электе жол боюнда турат."},{"t":"p","h":"Мында ал энесин ээрчип ойноп келер эле. Энеси Жээнгүл, совхоздогу почта бөлүмүнүн телефонисткасы, ар жылы жай башталары менен кыркымчы болуп иштей турган. Ага кошумча кош айдоо, туут маалында «Алло эле! Алло» – деп, алоолоп туш-туштан шашылыш кабарларды, буйруктарды кабыл алып иштеп жүрчү..."},{"t":"p","h":"Ал эми Авалбек үчүн бул мезгил чексиз эркиндиктин доору. Мындай жыргалды ким көрсүн! «Кой ай» деген киши жок, күн жылуу, адырдан короо-короо кой биринин артынан бири айдалып, «Ай, бала! Кайры! Тос!» – дешсе, шилтеген жакка тызылдата жүгүрөт. Араба, машина деген бири келип, бири кетип, ыгы келгенде араба артына жармаша да калып, айтор, бака-шака дүйнөнүн кызыгына батып, керели-кечке өзүнө окшоп ээрчий келген балдар менен карала-торала болуп ойногону ойногон."},{"t":"p","h":"<span class=\"pg\" data-n=\"93\">93<\/span>жүн кыркуудагы – мында: во время стрижки овец; ордунда – на местах; кыркымчы болуп иштейт – работала стригальцицей; кош айдоо, туут малы – время пахать и расплодия; чексиз эркиндиктин доору – век безграничной свободы"},{"t":"p","h":"Мына ушундай күндөрдүн биринде чоң кашарга көчмө кинонун машинасы келип калса болобу. Аны элден мурун эле Авалбек көрүп, өпкөсү жарылып кете жаздап:"},{"t":"p","h":"– Кино келди! Тигинекей кино келди!- деп, балдардан мурда озунуп, кыркынчыларга кабар салды."},{"t":"p","h":"Кино жумуштан кийин башталды. Ал согуш жөнүндө экен. Энеси экөө жун салынган кендир каптын үстүнө өйдөрөөк чыгып отурушкан эле. Элдин артында болсо да бул тараптан экран жакшы көрүнөт. Авалбектин өз оюна койгондо, ал сөзсүз так экрандын түбүнө, совхоздон жетип келген өз курдуу балдарга аралашып отурмак. Ошол алдыңкы катарга кетүүгө аракеттенип да көрдү, бирок Жээнгүл анысына көнбөдү:"},{"t":"p","h":"– Жетет, безерман, керээли-кечке дикилдейсиң, отур жаныма, – деп алдына алып кучактап отурду."},{"t":"p","h":"Киноаппарат лентаны бир калыбында имерип, согуш өз алдынча күчөй берди. Отурган эл көзүн албай дымууда. Так кулак түптө эненин тымызын үшкүрүк тартып, түтөгөнүн бала сезип жатты. Жанаша отурган абышка-кемпирлер бир көргөнүнө ишене бербей шыпшынып:"},{"t":"p","h":"– Кудай сакта, э, кудурет, бул эмнеси, кудай сактай кер! – деп күбүрөнүшөт."},{"t":"p","h":"Авалбек деген тигилердей жүрөксүз беле. Түк бир коркуп да койгон жок. Ал түгүл ичтен шаттанып да жатты: фашисттер жалпжалп этип тоголонгондо. Ал эми биздикилер куласа, алар бир аздан кийин туруп кетчүдөй ишенимде болду."},{"t":"p","h":"Деги согушуп жаткан кишилердин окко учканы өзүнчө бир тамаша. Куду согуш ойногон балдардын жыгылганындай кулашат. Андай кулаганды ал, өзү деле эч кимден кем келтирбейт. Чуркап бара жатып, бутка бирөө тепкендей, оңко-чоңко атып сулап калат. Ырас, жер катуу эле болот, тийген жериң аябай эле ачышат. Анткени менен кайра чабуулга кирсең, ооруган жеринди унутуп каласың. Айырмасы – тигилер дароо тура калбай, бук түшүп жата берет экен."},{"t":"p","h":"1 жүн салынган кендир кап – кенафный мешок, наполненный шерстью 2 безерман (азарман) – мында: озорник 3 эл көзүн албай дымууда – люди притихли, (затаили дыхание) не отрывая глаз 4 согуш ойногон балдар – дети, играющие в войну 5 кем келтирбейт (кем туурабайт) – подражает не хуже <span class=\"pg\" data-n=\"94\">94<\/span>"},{"t":"p","h":"жылыга ушул жерде өткөрүлүүчү – проводимое здесь ежегодно. Колхоздун кой кыркыны ...... ...... ...... ...... . жол боюнда – вдоль дороги."},{"t":"p","h":"энесин ээрчип – вместе с матерью. Авалбек ...... ...... келип, ...... ...... калып ойноор эле."},{"t":"p","h":"шашылыш кабарларды – срочные известия."},{"t":"p","h":"өпкөсү жарылып кете жаздап – мында: от волнения захлебываясь. Кубанычтан Азаматтын ...... көөп чыкты."},{"t":"p","h":"керели-кечке дикилдейсиң – бегаешь целыми днями. Дастан ............ дүкүлдөп ойнойт, так кулак түптө үшкүрүк тартып – прямо под ухом тяжелый вздох. Энесинин үшкүрүгү ...... ...... угулду."},{"t":"p","h":"түк бир коркуп койгон жок – нисколько не испугался. Кинодогу согуштун жүрүшүнөн ...... ...... ...... ...... . окко учканы – смерть, гибель."},{"t":"p","h":"оңко-чоңко атып сулап калат – ляжет, как подстреленный. Авалбек ...... ...... ...... сулайт. Мерген оңко тургуза албады."},{"t":"v","l":["дароо тура калбай – сразу не встает.",""]},{"t":"h3","h":"II. Замбирекчилер"},{"t":"p","h":"Экрандагы салгылашуу улана берди. Бул сапар көз алдына танкаларга ок атар замбирекчилер чыкты. Сыягы, алар бир кармашуудан экинчи кармашууга жер ооштуруп жүргөн болуу керек. Замбиректин оозунан түтүнү кете элек, өздөрүн көрсөң, сүрүнөн айбыгасың. Туш-туш тарабында жарылып жаткан снаряддарды аралап, от кечип, солдаттар замбиректи бетме-бет тургузуп танкаларды тике атыш үчүн сүйрөп бара жатышты. Азырынча болжолдуу ордуна жетише элек. Ансайын жан сабалашып, алдында кездешкен"},{"t":"p","h":"1 кайра чабуулга кирсе – мында: (оюн жөнүндө) – (если) обратно нападает"},{"t":"v","l":["2 замбирекчилер – артиллеристы","3 от кечип – мында: сквозь огонь","4 ансайын жан сабалашып – выбиваясь из последних сил"]},{"t":"p","h":"<span class=\"pg\" data-n=\"95\">95<\/span>белчеден келген сууга түз эле өтүкчөн, жапырт киришип, замбиректин тыгылганына карабай аны бардык күчүн салышып: «Давай, Давай! Вперед!» – деп күрөө тамырлары шишигенче бакырып жатып, акыры сүйрөп чыгарышты."},{"t":"p","h":"Замбирекчилер жети-сегиз адам экен. Арасында кебете-иреңи кыргызга окшогон бирөө, экранда улам көрсөтүлүп көзгө жылуу учурайт. Атам экен деп бала аны эч убакта ойлобос беле. Мындай ишти өзү капарына да албас беле... кандай десе болот... Энеси. Баарын энеси кылды."},{"t":"p","h":"– Тигине сенин атаң, – деп койду ал бир убакта, баланын кулагына шыбырап."},{"t":"p","h":"Ушундан баштап жанагы замбирекчи Авалбектин атасы болду да калды."},{"t":"p","h":"салгылашуу улана берди – битва продолжалась. Салгылаш уланды."},{"t":"p","h":"жер ооштуруп (ооштуруу) – меняя место. Олегдин үйбүлөсү ............ жатышат. өзүң айбыгасың – смутишься от грозного вида. Танкадан ...... ...... күрөө тамырлары шишигенче – мында: до взбухания вен. Бакырышса ...... ...... көбөт."},{"t":"p","h":"көзгө жылуу учурайт – показался знакомым, близким. Кинодогу каармандардын көпчүлүгү ...... ...... ...... . тигине сенин атаң! – вот твой отец."},{"t":"v","l":["ушундан баштап – с этого момента. ...... ...... Авалбек аталуу болду.","","1. Авалбек кыркынга эмне үчүн келчү эле?","2. Жээнгүл ал жерде кандай иш иштечү?","3. Көчмө кинону кантип сүйүнчүлөдү (сообщил радостную весть)?","4. Кино эмне жөнүндө экен?","5. Алгач согуш Авалбекке кандай таасир этти (повлиял)?","6. Замбирекчилер эмне кылышты?","7. Алардын арасында (среди них) ким бар эле?"]},{"t":"p","h":"1. I–II бөлүмдү көркөм окуп чыккыла. 2. Тексттеги түшүнүксүз сөздөрдү, айтылыштарды сөздүк дептеринерге жазып алгыла."},{"t":"p","h":"3. Кош айдоо, туут малы, кыркын, кан майдан деген сөздөрдүн берген маанилерин кенен түшүндүрмөлөп бергиле."},{"t":"v","l":["1 белчеден келген сууга – в воду до пояса","2 тыгылганына карабай – несмотря на то, что застревало в грязи"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"96\">96<\/span>III. Авалбектин атасы"},{"t":"p","h":"Ушундан баштап кино анын атасы жөнүндөгү киного айланды. Совхоздо эле жүргөн жигиттер курдуу атасы жапжаш неме экен. Тыгырчыгынан келген, тоголок жүздүү, курч тиктеген көздөрү көө, кир болгон бетинде жалт-жулт этип чагылат. Бала анын ачуулуу кабак-кашын, кашкайган тиштерин, башындагы темир каскасын, ыйыгындагы погондорун – баарын тең, байкап отурду. Атасы мышыктай чапчаң экенине да баа берди. Мына азыр эле замбиректин дөңгөлөгүн карысына сала тирей берип, өзү артына сал кайрылып, алда кимге катуу кыйкырды: «Снаряддарды токтотпогула! Тез! Тез!»"},{"t":"p","h":"– Апа, менин атам ушубу? – деди бала. Жээнгүл түшүнө бербей:"},{"t":"p","h":"– Тынч отур. Алаксытпа!- деп койду."},{"t":"v","l":["– Менин атам дебедиңби өзүң.","– Ии ошол. Жөн отурчу деги, кишилер урушат."]},{"t":"p","h":"Аттиң десе, эмне үчүн ушинтип айтты болду экен? А тиги эси жок энесинин айтканына ошол замат ишенди."},{"t":"p","h":"Ошол замат сүйүнүп, ошол замат жүрөгү дүкүлдөп, ошол замат атага деген мээрими делебесин козгоду. Жоокер атасы менен кайсы уул мактанбасын «Мына менин атам!» – деп көңүлүндө мактана берди. Мына, ата деген ушул! Атасы жок жалгыз деп кордогон балдар эми көрүп алсын! Эми алар тийип гана көрсүн!"},{"t":"p","h":"Ушуга эч шек койбой ишенип, бала атасына чын дили менен жан тартып эреркеп отурду. Мурда билип көрбөгөн аталуу балалыктын даамын сезди. Атасынын бардык жүргөн-турганын жактырып, ичи элжиреп, аны үйдөгү айнектин астында илинип турган, өз атасынын сүрөтүнө айнытпай окшоштуруп жатты. Мурду, кашы, көзү – бүт эле өзү..."},{"t":"p","h":"ачуулуу кабак-кашы – сердитое лицо тыгырчыгынан келген (тыгырчык) – коренастый и плотный, низкого роста (о человеке) карысына сала тирей берип – подпирая плечом"},{"t":"v","l":["алаксытпа – не отвлекай","көңүлүндө мактана берди – в душе хвастался","кордогон балдар – оскорблявшие его дети","ушуга эч шек койбой ишенип – без тени сомнения верил в это"]},{"t":"p","h":"аталуу балалыктын даамын сезди – здесь: в значении: почувствовал прелесть детства, проведенного рядом с отцом"},{"t":"p","h":"<span class=\"pg\" data-n=\"97\">97<\/span>Баласынын азыр карап отурганын билгендей анын атасы да кинодогу учкундай кыска өмүрүндө, өзүн эч убакта эстен кеткистей, кийин баласы сыймыктана тургандай жоокер кайратын кан майданда, эл алдында көрсөттү."},{"t":"p","h":"жапжаш неме экен – оказался совсем молодым. Солдаттардын баары атасы сыяктуу ...... ...... ...... . ыйыгындагы погондорун – здесь: погоны на плечах."},{"t":"p","h":"чапчаң экенине да баа берди – оценил и то, что он ловкий (проворный)."},{"t":"p","h":"Авалбек атасынын, анын курдаштарынын эрдигине баа берди."},{"t":"p","h":"ошол замат ишенди – поверил сразу. ...... ...... ишенди. Ошол жерде ишенди."},{"t":"p","h":"Авалбек ошондо эле ишенди."},{"t":"p","h":"атага деген мээрими делебесин козгоду – мында: любовь к отцу вызвала в нем волнение. Мээрим – чынчыл кыз. Табияттын кооздугунан ...... ...... чын дили менен жан тартып эреркеп отурду – мында: от всей души лелея нежность. Эрлан Римага ............! Оля ...... ыйлады. Ринат ...... ...... ...... ...... иштеди."},{"t":"p","h":"ичи элжиреп – умиленно. ...... ...... атасынын сүрөтүнө окшоштуруп жатты. Мугалим сүйүктүү окуучусунун жообуна ...... ......:"},{"t":"p","h":"учкундай кыска өмүрүндө – в короткой, как искра, жизни. ...... ...... ...... жоокердик кайратын көрсөттү."},{"t":"h3","h":"IV. Эрдик"},{"t":"p","h":"Киноаппарат чыртылдап, согуш жүрө берди. Нары жакта каптап келе жаткан кылка танкалар көрүндү. А биздин үркөрдөй болгон топ аскер жалгыз замбирегин сүйрөшүп, ал кезде сай кырына чыгышты."},{"t":"p","h":"Атышуу кызыды. Өз кыялында Авалбек атасы менен кошо өрт жалынды аралап, салгылашууда жүргөнсүп жатты. Немецтин танкалары кара түтүнгө чулганып, каз тамандары быркырап, ордунан жылбай калганда, энесинин алдына отурган бала кубанганынан тыбырчылап, туйлап жатты."},{"t":"v","l":["1 кан майданда (мында: кан төгүлгөн жерде) – в кровопролитном сражении","2 үркөрдөй болгон топ аскер – группа солдат","3 сай кырына чыгышты – добрались до русла берега","4 кара түтүнгө чулганып – окружены черным дымом","5 тыбырчылап, туйлап жатты – сидели беспокойно"]},{"t":"p","h":"<span class=\"pg\" data-n=\"98\">98<\/span>Ал эми биздин замбирекчилер жарылган снаряддардын сыныгы тийип жыгылганда, бала боюн жыйрып, томсоруп калып отурду. Замбирекчилер четинен кулап, азая берди. Эненин бети ысык жашка нымданып, күйүп чыкты."},{"t":"p","h":"Кармашуу күчөгөндөн күчөдү. Танкалар улам жакындап сүрүп келе берди. Замбиректин калканына далдаланып Авалбектин атасы телефондун трубкасын кош колдоп, алда немелерди заардуу кыйкырып, бакырып жатты. ... Аңгыча дагы бир солдат замбирек четинде жалп этти. Мүдүрүлүп кайра турууга умтулуп, жүзтөмөнүнөн жерге жыгылды."},{"t":"p","h":"Замбиректин жанында эки эле киши калды, Авалбектин атасы менен дагы бир солдат. Ал ар замбиректи токтолбой октоп, бир жолу, анан эки кайтара атууга үлгүрдү. Танкалар аларды кысмакка алды. Замбиректин тушуна жана бир снаряд келип жарылды эле, жерден эми бир гана замбирекчи өйдө турду. Ал Авалбектин атасы: замбирекке жулуна жетип, өзү дүрмөттөп, өзү мээлеп өзү атты. Бул анын акыркы атышы болду. Жана да келип тийген снаряд, замбиректи талкалап жайлады."},{"t":"p","h":"Кан жайылган бир жак ныптасын кармана, Авалбектин атасы теңселип жерден зорго турду. Үстүндөгү кийими түлөп, заарканган түрү бир шумдук. Жакындап келе жаткан танканы көздөй гранатаны колго алып, ал тайманбай бет алды. Алдан тайып, кансырап, жыгылып кете жаздап, Авалбектин атасы гранатаны шилтөөгө камданып, бир оокумга кулачын керип туруп калды. Экран анын бул көрүнүшүн көз алдыга жүгүртүп алып келип такады. Өлүмгө баш койгон жоокердин айбат чачкан ажарынан, жалтанбас кудуретинен «токто фашист!» деген таш жарган бакырыгынан кино көрүп отургандар дур дей түштү. Жээнгүл баланын колун бекем кармап жиберди. Бала атасына жетүүгө умтулуп, атасын көздөй жулунду. Атасы кыйган теректей сулады. Ал эки-үч аласала оодарылып,"},{"t":"p","h":"1 томсоруп – бледнел"},{"t":"v","l":["2 ысык жашка нымданып – мында: слегка увлажнился горячими слезами","3 заардуу кыйкырып – яростно крича","4 өзү дүрмөттөп, өзү мээлеп – сам заряжал, сам целился","5 теңселип жерден зорго – шатаясь, еле поднялся с земли","6 кийими түлөп (дал-далынан айрылып) – одежда (его) вся оборвана","7 шилтөөгө камданып, кулачын керип – развел руками, готовясь бросить","8 эки-үч аласала оодарылып – два-три раза переворачиваясь"]},{"t":"p","h":"<span class=\"pg\" data-n=\"99\">99<\/span>турууга жүткүнүп, анан чалкадан түшүп эки колун эки жагына таштап жатып калды..."},{"t":"v","l":["согуш жүрө берди – бой продолжался.","атышуу – перестрелка. ...... күчөгөндөн күчөп, согуш жүрө берди.","каз тамандары быркырап – мында: разлетались гусеницы танка.","боюн жыйрып – мында: напрягаться."]},{"t":"p","h":"мүдүрүлүп, жүзтөмөнүнөн жерге жыгылды – спотыкаясь, упал ничком вниз."},{"t":"p","h":"Солдат ...... жыгылды. Билим ............. кетти."},{"t":"v","l":["октоп – заряжая.","атууга үлгүрдү – успел выстрелить. Ал душмандан эртелеп ...... ......","жарылды – взорвался. Мурат ачуусуна жарылды. Отун .......","замбирекке жулуна жетип – стремительно дошел до артиллерии."]},{"t":"p","h":"кан жайылган бир жак ныптасын – мында: держась за окровавленный бок. айбат чачкан ажарынан – от яростного, разъяренного вида."},{"t":"p","h":"таш жарган бакырыгынан – от громкого крика. Солдаттын бакырыгы таш жарды. атасын көздөй жулунду – ринулся к отцу. Авалбек ...... карай жүгүрдү. Саматтын топчусу ....... Элнура Саматтын ...... бир тууганы."},{"t":"h3","h":"V. Ал менин атам болчу"},{"t":"p","h":"Киноаппарат токтоду, согуш да үзүлдү. Бул бир бөлүктүн аягы эле. Жаңы лентаны коюш үчүн киномеханик электрди күйгүзө салды. Эл эсин жыя электе кимдир бирөөнүн сүйүнүчтүү кыйкырыгы тынчтыкты жарды:"},{"t":"p","h":"– Балдар, менин атамдын өлгөнүн көрдүңөрбү? Ал менин атам болчу! Көрдүңөрбү, менин атам..."},{"t":"p","h":"Кишилер жапырт кайрылып, эмне болуп кеткенин анда бай айран-таң болушту. Отурган каптын үстүнөн тоголоно жүгүргөн Авалбек, экрандын жанында, алдыңкы катарда жайланган орток балдарына шаттанып чуркап бара жатты. Алардын пикири ал"},{"t":"p","h":"1 чалкадан түшүп – навзничь, на обе лопатки"},{"t":"v","l":["2 сүйүнүчтүү кыйкырыгы – радостный крик","3 айран-таң болушту – очень были удивлены","4 шаттанып чуркап бара жатты – торжественно (возбужденно) бежал"]},{"t":"p","h":"<span class=\"pg\" data-n=\"100\">100<\/span>үчүн баарынан да кымбат болчу. Бир азга чейин кашардагы көпчүлүктүн арасын оңтойсуз жымжырттык басты."},{"t":"p","h":"Өмүрү атасын көрбөгөн балага бул учурда атасынын өлүмү анын атасы бардыгын далилдеген майрам эле. Муну эч ким түшүнбөй, баары тең ийинин кагышып, кыжаалат. Киномеханиктин колунан лентанын тунуке кутусу жерге түшүп кетип, каңгыр этип экиге бөлүнүп тоголонду. Эч ким ага көңүл бурган жок, киномеханиктин өзү да тунукелерди ала койбоду. Алардын көзүн кадаганы – Авалбек."},{"t":"p","h":"Авалбек болсо майданда окко учкан баатырдын баласы, анын эрдигин, таламын жактап:"},{"t":"p","h":"– Силер көргөн жоксуңарбы, ошол менин атам болчу! Аны пулемет менен атпадыбы, ал өлбөдүбү! – деп, кишилер унчукпаган сайын күчөп, алардын ун катпаганына ызаланып, булар эмне үчүн менин атамды жактырышпайт, эмне үчүн аны макташпайт деген ой менен кайта-кайта: «Ал өлбөдүбү! Ал өлбөдүбү!» – деп жатты."},{"t":"p","h":"Кимдир бирөө жактырбагандай чырт этти: – Тек, антип айтпа, оозуңа таш!"},{"t":"p","h":"– Ал эмнеси экен!- деди анда ары жактан мойнун созгон чал."},{"t":"p","h":"– Эмнеси бар экен. Атасы согушта набыт болгону жалган беле? – анан унчукпай калып, ылдый карап кобурады."},{"t":"p","h":"– Атасы эмей, атасы да..."},{"t":"p","h":"Ошондо мектепте окуп калган балдардын бири чындыкты бетке айтты:"},{"t":"p","h":"– Ал сенин атаң, эмес. Эмне кыйкырасың? Түк да сенин атаң эмес."},{"t":"p","h":"– Ал артист. Ишенбесен, тигине киночунун өзүнөн сура. Иштин жайын сезе калган эстүү-баштуулар атасыз баланын жасап алган таттуу да, ачуу да алданмасын бүлдүргүсү келбей, жок, ал сенин атаң эмес, башка дегенге ооздору барбай балдардын талашына аралашпады. Киномеханик да өздөрү билсин дегенсип, аппаратын оңдомуш болуп жатты."},{"t":"v","l":["1 оңтойсуз жымжырттык басты – стояла неловкая тишина","2 тунуке кутусу – железный коробок"]},{"t":"p","h":"3 кишилер унчукпаган сайын ызаланып – мында: все больше обижаясь на молчание людей 4 мойнун созгон чал – выгнувший шею старик"},{"t":"v","l":["5 чындыкты бетке айтты – прямо сказал правду","6 талашына аралашпады – не участвовали в споре"]},{"t":"p","h":"<span class=\"pg\" data-n=\"101\">101<\/span>– Жок, ал менин атам болчу, менин атам! – дей берди ызага туталанган Авалбек."},{"t":"p","h":"– Кайсынысы эле сенин атаң? Айтчы, кайсынысы эле?- деп алиги окуучу бала да тилин тартпады."},{"t":"p","h":"– Сен көргөн жоксуңбу? Менин атам гранатты алып танкага минтип, анан минтип, жыгылбадыбы? – Авалбек боюн жерге таштап, атасынын кандайча окко учканын көрсөттү. Дал өзүндөй келтирип, эки-үч аласала оодарылып, анан чалкадан түшүп, экрандын алдында эки колун эки жакка таштап, өлгөн жоокердей жатып калды."},{"t":"p","h":"Отургандар айласыздан дуу жарылып күлүп жиберишти:"},{"t":"p","h":"– Ой бул артист турбайбы?"},{"t":"p","h":"– Ой жоругуң түшкүр! ..."},{"t":"p","h":"Бирок Авалбек күлгөн жок. Былк этпей баатыр атасынын кейпин кийгендей, ошол калыбында экрандын бери четинде сулап жатты. Күлкү тыйыла калып, кашардын ичин дагы да жүрөк өйүткөн дым басты."},{"t":"p","h":"– Э, Жээнгүл,— деди баягы тообалап кино көргөн аял. Анын үнү каргылданып, титиреди. – Эмне шал болуп отурасың? Карабайсыңбы тетиги баланы!"},{"t":"p","h":"Эми элдин баары Жээнгүл жакка бурулду. Анын көзүнө жаш алып, унчукпай, эрдин бек кымтып, түз басканын узата карашты. Жээнгүл баланын жанына келди да, аны өйдө тургузуп:"},{"t":"p","h":"– Жүр балам, жүрөгой. Ошол сенин атаң, – деп акырын айтып, аны колунан жетелеп тышка чыгарып кетти..."},{"t":"p","h":"... Алар үйлөрүнө бара жатышты. Бүгүнтөдөн баштап ата жолуна түшкөнүн атадан калган жалгыз туяк экенин билди."},{"t":"p","h":"1 атасы бардыгын (бар экенин) далилдеген майрам – праздник от того, что у него есть отец. ийиндерин кагышып кыжаалат – недоуменно пожимали плечами."},{"t":"v","l":["эч ким ага көңүл бурган жок – никто не обратил на него внимание.","набыт болгону жалган беле – разве неправда, что он погиб.","","1 боюн жерге таштап – упав на землю","2 дал өзүндөй келтирип – сделав точно так же","3 ата жолуна түшкөнүн – здесь: пошел по следам отца","4 атадан калган жалгыз туяк – здесь: пер. см. ... единственный потомок"]},{"t":"p","h":"<span class=\"pg\" data-n=\"102\">102<\/span>эстүү-баштуулар – взрослые. Виктор – ...... адам."},{"t":"p","h":"таттуу да, ачуу да алданмасын бүлдүргүсү келбей – не хотели омрачать сладкое и горькое воображение."},{"t":"p","h":"ызага туталанган – обиженный, злившийся от досады."},{"t":"p","h":"былк этпей – не шелохнувшись. Авалбек бир топко чейин ...... этпей жатты. ...... ...... баатыр атасынын кейпин кийгендей, ошол калыбында экрандын четинде сулап жатты."},{"t":"v","l":["күлкү тыйыла калып – прекратился смех.","ошол сенин атаң – это твой отец.","","Эсиңерге түйүп алгыла!"]},{"t":"p","h":"Бул санжыргалуу сөз берметтерин эсиңерге түйгүлө жана кебиңерде колдонууга аракеттенгиле: жалгыз бой, өпкөсү жарылып кете жаздап, жер ооштуруп, күрөө тамырлары шишигенче бакырып, мээрими делебесин козгоду, ичи элжиреп, үркөрдөй болгон топ аскер, айбат чачкан ажары, жалтанбас кудурети."},{"t":"v","l":["1. Ал кинодогу жоокерди эмне үчүн «атам» деп ойлоду?","2. Ал атасы экендигин кантип ырастады?","3. Жоокер кандай эрдик көрсөттү?","4. Кинотасма токтогондо Авалбек эмне кылды?","5. Анын ачылышын достору жана эл кандай кабыл алышты?"]},{"t":"p","h":"6. Силер мындай окуялардан билесиңерби жана Авалбектин абалын кандай баалайсыңар?"},{"t":"p","h":"1. Чыгарманы окуп чыгып, алды сызылган сүйлөмдөргө, өзгөчө көңүл бөлгүлө."},{"t":"p","h":"2. Буга окшогон окуялардан эстеп эскерүү жазгыла. (Чыгарманы окудуңар беле, кинотасманы көрдүңөр беле ж. б.) 3. Берилген макалдын маанисин түшүндүргүлө: «Ата баласы – тон жакасы», 4. Төмөнкү сөздөр катышкан сүйлөмдөрдү тексттен таап окугула, ал сөздөрдүн маанисин чечмелегиле: кош айдоо, туут маалы, көчмө кино, кендир кап, безерман, бооруна бекем кысып, жан сабалашып, аталуу балалыктын даамын оозанды, бир жак ныптасын, турууга жүткүнүп, орток балдарына, оозуңа таш, согушта курман болгон."},{"t":"h3","h":"<span class=\"pg\" data-n=\"103\">103<\/span>ДАРЕКТҮҮ МАТЕРИАЛДАРДАН"},{"t":"p","h":"Улуу Ата Мекендик согушта Кыргыз элинин эр азаматтары Дүйшөнкул Шопоков, Николай Ананьев, Григорий Конкин, Дайыр Асанов, Чолпонбай Түлөбердиев, Кубат Жуматаев, Ашырбай Коенкөзов ...... ж.б. чексиз эрдик көрсөтүшүп – Советтер Союзунун Баатыры болушкан. Кыргызстанда даярдалган 316-, 385-аткычтар дивизияларынын күжүрмөн эрдиктери тарыхта калды."},{"t":"p","h":"Кыргызстандын 70тен ашык жоокери Советтер Союзунун Баатыры деген жогорку наамга татыктуу болушту. 40 минден ашуун жоокерлер жана согушта оорукта көрсөткөн эрдиктери үчүн орден, медалдар менен сыйланышты..."},{"t":"p","h":"(Кыргызстандын тарыхынан...)"},{"t":"p","h":"Эсиңе түйүп ал!"},{"t":"p","h":"Ата – аскар тоо, Эне – соолубаган булак. Бала – күйүп турган шам чырак. Атаны сыйлаган абийир табат. Энени сыйлаган элге жагат. Бала жакшысы – атанын даңкы, Кыз жакшысы – эненин баркы."},{"t":"p","h":"Аял – үйгө тартылган желек, бала – элге калтырган белек. Атаң өлсө тайлак бар, кому жерде калган жок."}],"sub":[{"title":"III. Авалбектин атасы","b":42},{"title":" чабандын жалгыз уулу. Ал жайдыр-кыштыр асман мелжиген тоолордун арасындагы жайыттардан алыс чыга элек. Азиздин атасынын кайтарганы килтейген ириктер. А апасы болсо, боз үйүнөн чыкпай күндүзү тамак-аш даярдап, кийим-кечени жамап-жаскап үй-тиричилигине алек. Кечкисин койлордун астын акмалап тосуп, түнкү короонун күзөтүнө жардамдашат. Атасы жайытта жүргөндө, кечке дейре уулун аябай сагынып калат. Келер замат Азизин күржүйгөн алаканына куштай кондуруп, өйдө-төмөн тоголотуп, алкымынан удаа-удаа жыттагылайт, анан топтой көкөлөтө ыргытып ойноо өнөкөтү."},{"t":"h3","h":"Азиз кой кайтара баштады"},{"t":"p","h":"Баарысынан Азизге атасынын атка өңөрүп, кой кайтарганы жакты. Жерде кибиреп апасынын жанында жүргөндө эч нерсени көрчү эмес тура. Эмичи...... Эми атасынын ээгинин астынан, чапанын боорунан бөдөнөдөй башын кылтыйтып, залкайган аттын үстүндөгү көрпөчөлүү жумшак ээрде көкөлөп бийик. Ат аны бешиктей термеп, канаттуу чымчыктай абада калкытып жүрөт. Тоонун өзүн кыркалай бастырганда таптакыр коркунучтуу эмес тура. Боору толо сеңселген чоң-чоң жашыл өсүмдүктөрдү карай Азиз кубанычтуу колун серендетти."},{"t":"v","l":["– Бак, бак, – ээ!","","1 мүйүздүү козу – рогатый ягненок"," асман мелжиген тоолор – мында: высокие горы","килтейген (килейген) ириктер – мында: крупные валухи","4 жамап-жаскап – залатав","","акмалап тосуп – встретил, выслеживая","6 алкымынан удаа-удаа жыттайт – целует в шею снова и снова","","өнөкөт – привычка","8 кибиреп – быть маленьким (крохотным)","абада калкып жүрөт – перен. См. парить в небесах"]},{"t":"p","h":"<span class=\"pg\" data-n=\"105\">105<\/span>Андагы ар кыл өсүмдүктөрдүн атын али ажыратып биле элек уулуна атасы:"},{"t":"p","h":"– Карагай, кайың, арча, четин, табылгы, карагат, шилби,— деп өзү айтып анан Азизин кайталатты."},{"t":"p","h":"Күн сайын атасына өңөртүп жүрүп, Азиз айлана-чөйрөдөн көп нерсени көрүп, жаңы сөздөрдү үйрөнө, тилин, акыл-эсин байыта берди. Аны атасы кайдыгер нерсе катарында капарына албады."},{"t":"p","h":"салымы чоң – внес большой вклад. Жазуучунун балдар адабиятына кошкон ...... ...... ."},{"t":"p","h":"тапкыч, акылдуу – находчивый, умный. Балдар ...... болуп чоңоюулары керек."},{"t":"p","h":"чабандын жалгыз уулу – единственный сын чабана. Азиз чабандын ............. күржүйгөн алаканына куштай кондуруп (сал.) – как птицу, посадив на большую (жилистую) ладонь. Билге ...... бала. Эддинин ...... ысыды. Снежана ...... жеңил кыз. Конокту бир түнчө ......."},{"t":"p","h":"кой кайтарганы жакты – понравилось, как он пасет овец. Бакисинен Азизге атасынын атка өңөрүп, ...... ...... ...... . Азиз ...... ...... Ага бул ......"},{"t":"p","h":"бешиктей термеп – качая как колыбель. Ат аны ...... ......, канаттуу чымчыктай ...... калкытып жүрөт."},{"t":"p","h":"сеңселген чоң-чоң жашыл өсүмдүктөр – развевающиеся огромные зеленые растения. Инганын ...... чачы бар. Ал ............ арыштап басты, себеби ...... жарык күйдү. Бул ...... тоонуку."},{"t":"p","h":"ажыратып биле элек – еще не может различить. Эржан урушкандарды ......"},{"t":"h3","h":"Э, боз ирик багындыңбы!"},{"t":"p","h":"Азиз атасы менен кой кайтарышып жүргөндө, бир күнү ал бутун боз ирикке тепсетип алат. Жарааты айыккан соң атасы ага боз ирикти ат кылып үйрөтүп берди......"},{"t":"p","h":"Ошондон тартып, Азиз менчик аттуу болду. Ал торсоюп, эртең менен койлорду короодон жайытка айдаганда боз ириктин үстүнө минип, жонун бек мыкчып, бутун алдыңкы колтугуна кыпчып алат. Кечкисин жайыттан короого чейин минип барат. Боз ирик адагенде эсиргенинин сазайын тартып, анан кичинекей ээсине багынып, андан кийин баягыдай жыккан жок."},{"t":"p","h":"1 атасына өңөртүп жүрүп – садился в седло к отцу 2 капарына албады – не обратил внимания; не принял во внимание <span class=\"pg\" data-n=\"106\">106<\/span>"},{"t":"p","h":"Ошентип жай да өттү......"},{"t":"p","h":"Күзүндө ириктер даңкайып семиргенде атчан атасына кошулуп, боз иригин минип кылтылдата айдап барып, эт комбинатына өткөзүштү. Эң артында боз иригинен түшүрүп, кинге тарттырганда Азиз атасына далдаланып, көз жашын токтото албады. Досунан ажыроо оңойбу! Ал жердегилердин баарысы тең башкарма, ферма башчысы, кабыл алуучулар мыкты семирткендиги үчүн атасын мактап жатышты. Атасы тигилерге угуза бак-бак сүйлөдү: Ушу эмгектин теңи менин жардамчымдыкы! Кантет, кел уулум, мындай."},{"t":"p","h":"Тегерек калпакчан башкарма Азиздин боз иригин жакшы көрөрүн баамдаган окшойт. Жай басып келип, маңдайынан сылагылады:"},{"t":"p","h":"– Бакир аке, эртенден калбай короолордон козу бөлүп алыңыз! Азиз мотураңдаган козуларды жакшылап баксын, чоңойтсун. Сиздин бул уулуңуз малкор, анык чабан тура!"},{"t":"p","h":"жараатынан айыккан соң – когда окончательно выздоровел. Азиздин жарааты айыкты. Андан ...... кой кайтарды."},{"t":"v","l":["ошондон тартып – с тех пор.","бек мыкчып – крепко сжимая.","алдыңкы колтугуна – мында: между передними ногами."]},{"t":"p","h":"колтук – под мышкой. ...... кыпчып алат. ...... суу бүркөт. Энесинин ...... жабышат. багынып – подчинившись. Боз ирик багынды."},{"t":"v","l":["ошентип жай да өттү – так и лето прошло.","күзүндө – осенью. ...... эт комбинатына өткөрүштү.","атасына далдаланып – (жашынып) – спрятавшись за спиной отца.","мыкты семирткендиги үчүн – за то, что хорошо откормил.","теңи менин жардамчымдыкы – половина моего помощника."]},{"t":"p","h":"баамдаган (билген) окшойт – видимо понял. Абышка-кемпирлер баамчыл болушат. Олеся бул текстти окуган ......:"},{"t":"p","h":"мотураңдаган козуларды – мында: пухленьких ягнят. Класста ...... балдар олтурушат."},{"t":"v","l":["1 даңкайып семиргенде – когда зажиреют","2 кинге тарттырганда – когда взвешивали","3 көз жашын токтото албады – не мог остановить своих слез","4 маңдайынан сылагылады – погладил по голове"]},{"t":"p","h":"<span class=\"pg\" data-n=\"107\">107<\/span>1. Жазуучу Ш. Бейшеналиев жөнүндө айтып бер? 2. Азиз деген ким? Азиз кой кайтарганда эмнелерди көрдү? Ал боз ирикти кантип багынтты?"},{"t":"v","l":["3. Күзүндө койлорду эмнеге өткөзүштү?","1. Кой баласы жөнүндө билген маалыматыңарды баяндагыла.","2. Чыгарманын калганын окуп чыккыла.","","Эсиңерге түйүп алгыла!"]},{"t":"p","h":"козу, борук, токту, ирик, кочкор, субай кой, тубар кой, бир тишти, ..."},{"t":"h3","h":"Мүйүздүү козу"},{"t":"p","h":"Бир топ күндөрдөн кийин атасы колхоздон козу бөлдүрүп алып келди. Козулардын жалгыз бирөөнөн башкасы күн өткөн сайын торсоюшуп торолуп, семирүүдө. Ал эми дурусураак тоюна албай, ичи кабырылган, дүңкүйүп мүйүз чыгып келаткан боз козу. Бакиси тең токол. Ушу гана мүйүздүү. Неликтен ушунчалык чабыр (арык). Же мүйүзүнүн саатынанбы?...... Ага Азиздин боору ачый баштады."},{"t":"p","h":"– Неге баары тыңыса, сен жүдөп баратасың?– деп мүйүзүнөн кармаса, ал башын чулгуп кежирленди."},{"t":"p","h":"– Эх-ей,— деди Азиз бир нерсени эсине түшүрүп,- сенин өңүн, кыялың боз иригиме окшошот да. Кантип семиртсем ыя сени...... Мүйүздүү козу жалгыз сен болсо. ..."},{"t":"p","h":"Азиз мүйүздүү козусун кантип тыңытуу жөнүндө атасына айтты. Атасы улагадагы буума капты көргөздү:"},{"t":"p","h":"– Мында чабыр, ылаңдарга сактаган буудай акшагы бар. Ушундан бурдатчы."},{"t":"p","h":"Азиз акшактан калпагына үймөлөп, мүйүздүү козусунун тумшугуна каптаса, анысы ачууланып башын калжактата чайкады."},{"t":"p","h":"1 чабыр (арык) – невзрачный (худой), мелкота; невзрачный (и худой) скот"},{"t":"v","l":["2 жүдөп баратасың – худеешь; становишься неприглядным","3 башын чулгуп кежирленди – упрямился, встряхивая голову","4 буума кап – полный, завязанный мешок","5 ылаңдарга (ооругандарга) – заболевшим","6 бурдатчы – (сугунтчу; жедирчи) – дай ему поесть"]},{"t":"p","h":"<span class=\"pg\" data-n=\"108\">108<\/span>– Айрөк, айрөк, тамактын даамдуусун билбейт экенсин,— деп Азиз козусун мүйүзүнөн кармап оозуна бир чымчым акшакты зордоп куйду."},{"t":"p","h":"Акшак тилине барганда даамын билди окшойт, мүйүздүү козу быйтылдатып кепшеп кирбедиби."},{"t":"p","h":"Ошондон кийин мүйүздүү козусу тигилерден бөлүнүп, Азизди жалгыз ээлеп, анын калпагынан такай жем жеп жүрдү."},{"t":"p","h":"Мүйүздүү боз чөп ирмебес болду. Азизди такай ээрчип, анын сүйгүнчүгүнө айланды. Жемдин күчү оңойбу, бат эле күрсүйүп семирди. Мүйүзү да оркоюп өсүүдө. Бир короо козудан мүйүздүү бир ошо болсо, ал артынан ээрчип, калпагынан тамак жесе, Азиз кантип кубанбасын. Ал акшак эмес, колундагы нанын сунса да, мүйүздүү тамшанып жеп алчу болду. Азиз аны мүйүзүнөн кармап, өзүн тизеге нукутуп, дароо чалкасынан кетип ойногонду тапты. Өсүп келаткан жаш мүйүзү кычышабы же ээсинин көндүргөнүнөнбү, боз козу жыгач бадалды тарс челип калат."},{"t":"p","h":"торсоюшуп, торолуп, семирүүдө – округлились, окрепли, жиреют. Давид ...... кийинди. Козулар ...... жана ...."},{"t":"p","h":"бакиси (баарысы) тең токол – все они безрогие, комолые."},{"t":"p","h":"ушул гана мүйүздүү – рога имеет только этот. ...... эчки ...... сурайм деп ...... ажыраптыр (лакап)."},{"t":"p","h":"боору ачыды (ооруду) (фр.) – пожалел."},{"t":"p","h":"кантип тыңытуу жөнүндө – о том, как окрепнуть. Козуну тың... керек эле. ачууланып башын калжактата чайкады – сердито покачал головой."},{"t":"p","h":"быйтылдатып кепшеп кирбедиби – мында: начал резво жевать. Козу ...... ......"},{"t":"p","h":"Кой жегенин кулгуп кепшеп кирди."},{"t":"p","h":"калпагынан такай жем жеп жүрдү – постоянно ел из его шапки."},{"t":"p","h":"сүйгүнчүгүнө айланды – стал его любимцем. Бул окуучу мугалимдин ...... эле. Чолпон – чоң энесинин сүйгүнчүгү."},{"t":"p","h":"өзүн тизеге нукутуп (сүздүрүп) – тыкать в колени. Азиз тизесин ...... чалкасынан кетет. Ира Давидди нукуп кетти. Террористтер көп кабаттуу үйдү самолет менен сүздүрүштү."},{"t":"v","l":["1 айрөк, айрөк – подражание голосу","2 чөп ирмебес болду – (фр.) – мында: букв. – ни травинки не сорвет","3 оркоюп өсүүдө – растет торчком","4 тамшанып жеп калат – мында: бывает, ест с наслаждением"]},{"t":"p","h":"<span class=\"pg\" data-n=\"109\">109<\/span>жыгач бадалды тарс челип калат – начнет бодать сухие заросли. Козу ...... эликтин чаарчыгы ...... чыга качты. ...... этип мылтык атылды."},{"t":"h3","h":"Сүзөөнөк мүйүзүнөн айрылды"},{"t":"p","h":"Күндөрдүн биринде Азиз сүзөөнөгүн жамаатташ коктудагы койчунукуна ээрчитип барды. Өзүнөн улуу Султан деген балага жолугуп:"},{"t":"p","h":"– Мүйүздүү козуң барбы? Сүзүштүрөсүңбү? – деди, дөңдөшүн мүйүзүнөн кармап мактана."},{"t":"p","h":"– Кыйын экенсин, – деди Султан, сары тонунун жеңиндеги карын күбүй. – Эртең, сүзөөнөгүңдү апкел. Менде да мүйүздүү бирөө бар. Атам жайытка айдап кетти. Эртең короого алып калайын. Сүзүштүрүп көрөлү. Мунуң кудай ургандай күчтүү экен! – деди."},{"t":"p","h":"Эртеси атасы короодо жандыктарды айдаар замат Азиз сүзөөнөгүн ээрчитип, Султандын короосун беттеди. Султан аны жарым жолдон тосуп алды. Мейманын, балбаны экөөнү короосуна киргизип илгичин илди да, наркы бастырманын түбүнөн чыгырык мүйүз ак кочкорду айдап чыкты. Азиз аны көрүп, дароо мүйүзүнө илип кетчүдөй кетенчиктеди:"},{"t":"p","h":"– Алпар нары. Чоң кочкор тура. А меники кичине да, козу кочкор да."},{"t":"p","h":"Султан чуркап келип, Азизди колдон кысты:"},{"t":"p","h":"– Коркпо бу, карган эме! Чын эле ак кочкор алар менен иши жоктой каалгый басып кетти. Сүзүшүүнү каалабады."},{"t":"p","h":"Чын эле сүзөөнөгүмө баары тең багынып келатапайбы. Бу карган эмени деле качырар, – деп ойлоду Азиз. Мүйүздүү боз дөңдөшүн бошотуп адатынча ак кочкорду карай тап койду:"},{"t":"p","h":"– Сүз! Качыр! Багынт!"},{"t":"p","h":"Азиздин дөңдөшү кочкорду боорго, жонго курс-курс чолуду. Кочкор адагенде этибар албады. Анан эти ооруксунганда чыдабай кетти окшойт. Ачуулу көздөрүн кызартып, жонун дүгдүйтүп чыгырык мүйүзүн тосо бурулду."},{"t":"p","h":"1 сүзүштүрөсүңбү? – мында: столкнём друг с другом, пусть пободаются"},{"t":"v","l":["2 короого алып калайын – оставлю в загоне","3 жарым жолдон тосуп алды – встретил на полпути","4 бастырманын түбүнөн – под навесом","5 карган эме – уже старый","6 курс-курс чолуду – резво бодал"]},{"t":"img","src":"data:image/webp;base64,UklGRmY+AABXRUJQVlA4IFo+AACwmgGdASqAAlEBPrVQoksnJScsq9QrcZAWiWNsnq3DpY1ouRTvLiV5AeDPYFyKOIOaZ0Al7h+q+67GkdnMdZaC/u эртерээк мүйүзүнөн айрылганына сүйүн. Ал сенин өзүндү сүзүп, бир мандемге учуратабы деп чочуучу элем. Коё бер короого. Андан өлбөйт. Эми чырсыз тынч жүрө берет."},{"t":"p","h":"1 түпкүчтөй ийрилген карт мүйүз – дугообразные рога 2 бөлүнүшө албай тутакташа түшүштү – злились от того, что не могли разъединиться 3 илинип калыптыр – зацепился <span class=\"pg\" data-n=\"111\">111<\/span>"},{"t":"p","h":"Азиз булкулдап, жедеп көз жашы кургаганда араң:"},{"t":"p","h":"– Мен өзүм сүзгөнгө көндүрбөсөм, боз козум мүйүзүнөн ажырабайт эле. Чынбы атаке, – деди солуктап. Атасы уулунун ийнинен таптады:"},{"t":"p","h":"Чын кагылайын. Малды да эсирткен ээси болот. Эми колуң бошоду. Кошо кайтаруудан коркпостон жүрү. Жайыт жаңылайлы."},{"t":"p","h":"– Коркпойм! Мындан кийин козуну сүзөөнөк кылып үйрөтпөйм,- деди."},{"t":"p","h":"жамаатташ коктудагы – мында: из соседней ложбины."},{"t":"p","h":"чыгырык мүйүз ак кочкор – мында: сивый баран с округлыми рогами. кетенчиктеди – мында: пятился назад."},{"t":"v","l":["муну деле качырар – может на него тоже будет нападать.","адагенде этибар албады – сначала не принял во внимание."]},{"t":"p","h":"бутун жерге тийгизбей – высоко поднимая. Кочкор козуну ...... ...... ...... көтөрдү. Серек ...... ...... ...... жүгүрдү."},{"t":"p","h":"нарылай арыштабай чуркады – отбежал чуть дальше. Ак кочкор ............ кере жүгүрдү. Равил ...... арылап кетти. Лена, ...... жетчи."},{"t":"p","h":"алда кайда ыргып түштү – свалился где-то далеко."},{"t":"p","h":"омкорулуп түшүптүр – мында: выдернуты. Мүйүз түбүнөн ...... ...... Терек омкорулду."},{"t":"v","l":["чексиз эсиртпедиңби – избаловал бесконечно. Сен аны ...... ...... .","жайыт жаңылайлы – обновим пастбище.","сүзөөнөк – бодливый. ...... кылып үйрөтпөйм.","","1. Азиз мүйүздүү козуга кантип ээ болду?","2. Ал экөө кантип дос болушту?","3. Мүйүздүү козуну сүзүшкөнгө кантип үйрөттү?","4. Сүзөөнөк дөңдөш эмне себептен мүйүзүнөн айрылды?"]},{"t":"p","h":"5. Кармаш кандай болду жана Азиз эмне деген жыйынтыкка келди?"},{"t":"p","h":"6. Чыгармада берилген ой, көркөм мазмун жактыбы?"},{"t":"v","l":["1 көз жашы кургаганда – когда слезы высохли","2 солуктап – всхлипывая","3 эсирткен (көптүргөн) ээси – беснует, сам хозяин избаловал"]},{"t":"p","h":"<span class=\"pg\" data-n=\"112\">112<\/span>1. Чыгарманы көңүл коюп көркөм окуп чыккыла жана жазуучунун айткан оюн тапкыла."},{"t":"p","h":"2. Жазуучунун балдарга арналган чыгармаларынан окуганыңарды айтып бергиле. Төмөнкү сөз берметтерин өз кебинерге колдонуп текст түзгүлө: күржүйгөн алаканына куштай кондуруп, чапанынын боорунан бөдөнөдөй башын кылтыйтып, бешиктей термеп, эсиргенинин сазайын тартты, чөп ирмебейт, айбат бере албайт."},{"t":"p","h":"3. Сан атооч жөнүндө түшүнгөнүңөрдү бекемдегиле. Сан атооч, анын түзүлүшү, мааниси боюнча бөлүнүштөрүн айтып бергиле. Мисал келтиргиле. Эсиңерге түйүп алгыла!"},{"t":"p","h":"Жайдыр-кыштыр, килтейген ириктер, жамап-жаскап, тамак-аш, удаа-удаа, малсаак, ичи кабырылган, чыгырык мүйүз ак кочкор, башын булактата, мандем."},{"t":"h3","h":"Эскертүү"},{"t":"p","h":"Англиялык окуучу кыз Виктория Смит жазуучунун «Мүйүздүү козу» чыгармасын окуп алып аябай кайгырат жана анын уландысын жазууну автордон суранат. Ошентип «Мүйүзүнөн айрылган сүзөөнөк» бөлүмү да жазылат жана 1981-жылы жарык көрөт. Аны силер кийин окуйсуңар."},{"t":"h3","h":"Табышмактарды тап"},{"t":"v","l":["Аласа гана бою бар,","Аңтара кийген тону бар. (......)","","Эртең менен кетет илек-илек","Кечинде келет илек-илек. (......)","","Макалдарды эсиңе тутуп ал","аласа (кичине) – крохотная","аңтара кийген – одел наизнанку","","илек-илек (илегилек) – журавлик","","Акылды жакшы баксаң, маңдайың ачык болот.","Кой асырасаң береке, кокуй болсоң – келеке.","Көп койдо аксак да болор, таскак да болор."]},{"t":"p","h":"Белгилүү окумуштуу Хусеин Карасаевдин «Накыл сөздөр» (Фрунзе, 1987) – китебинен «Кой үстүнө торгой жумурткалоо», «Койчунун кызы – кой келгенде иш кылат», «Кокуй менен кой багат» деген темаларды өз алдыңарча окуп, өздөштүргүлө (146—147-б акшы чоң эне"},{"t":"p","h":"Бакыраң көз, сексек чач Чынара деген кыз бар. Ал Кыргызстандын борбору, бак-шактуу Фрунзе калаасында беш кабаттуу жаңы имаратта жашайт. Чынаралардыкы болгондо да бешинчи кабаттагы бешинчи үй. Ал тургай Чынаранын жашы дагы беште. Байкагылачы, бардык жагынан кандай сонун бап келген."},{"t":"p","h":"– Чоңойдум эми, бешке чыгып калдымбы? Балдар бакчасына эмне үчүн барбайм? – дейт Чынара. Аны эч ким сезбейт."},{"t":"p","h":"Кыязы апасы менен атасы билишет окшойт. Ал экөө тең үн алыша кызын минтип жооткотушат:"},{"t":"p","h":"– Күзгө чейин чыда. Аз эле калбадыбы? Ага дейре чачың дагы узун өсөт. Эки саамайыңды өрүп, кыпкызыл гүлдөн кыстарып, аппак көйнөк, аппак туфлий кийгизип, экөөбүз эки колуңдан жетелеп алып барабыз. Аңгыча жомокту көп-көп үйрөн. Көп-көп бийлеп, жакшы балерина бол. Антпесең бакчага албай коюшат."},{"t":"p","h":"Чынара ата-энесинин узун сабак акыл-насаатына ынанып, эңсегенин коё калат."},{"t":"p","h":"Күндөрдүн биринде атасы, апасы экөө бирдей, Москвага сапар чегишти. Үйгө, тээ алыстагы айылдан атайын келген чоң энеси экөө гана ээлик болуп калышты. Түшкө маал Чынара чоң энесинин колунан жетелеп, ээрчитип, үйүнүн маңдайындагы бакка барды."},{"t":"p","h":"1 беш кабаттуу жаңы имаратта жашайт – живет в новом пятиэтажном доме 2 кандай сонун бап (төп) келген – как прекрасно сочетается"},{"t":"v","l":["3 эңсегенин – свою мечту","4 атайын келген – специально приехала"]},{"t":"p","h":"<span class=\"pg\" data-n=\"114\">114<\/span>Ал жерде, кыргыз, орус балдары томполондошуп карды томолоктошуп ойноп жатышыптыр. Чынара да аларга аралашты. Чоң эне скамейкага олтуруп кичинекейлерден көзүн айрыбайт. Антпегенде кантет, картаң эне кар томолоктоп ойномок беле. Дүкөнгө ээрчишип кирип, чоң эне небереси менен бир стакандан жүзүм шербетин ичкенде аябай жарпы жазылды."},{"t":"p","h":"– Сен жакшы энесиң! – Чынара аны мактай кетти. – Атам, апам экөө тең жүзүм жаман көрүшөт. Дайым эле томат шербетин ичиришет. Ал таттуу эмес, кычкыл."},{"t":"p","h":"Кыргызстандын борбору – столица Кыргызстана."},{"t":"p","h":"балдар бакчасына – в детский сад. ...... ...... эмне үчүн барбайм? – дейт Чынара. кыязы (сыягы, болжолу) – видимо."},{"t":"v","l":["жооткотушат – успокаивают. Ал экөө тең кызын минтип ......","эки саамайыңды өрүп – заплетем две косички. ...... өрөбүз.","антпесең бакчага албай коюшат – иначе не примут в детский сад."]},{"t":"p","h":"сапар чегишти (кетишти) – уехали. Борборго ...... алышты. Алар жумуштап ...... . ээлик болуп калышты – мында: стали хозяйничать."},{"t":"p","h":"үйүнүн (үйдүн) маңдайындагы – напротив дома. Сейил багы ...... жанында. Секелек эненин ...... ойноду."},{"t":"p","h":"томполоңдошуп, карды тоголоктошуп – резвились, играли в снежки. Чынара ...... ...... ...... ойноду."},{"t":"p","h":"көзүн айрыбайт – не отрывает глаз. Чоң эне көз албай карап олтурду. Чынара Эркелейден ...... ...... карады."},{"t":"p","h":"аябай жарпы жазылды – поднялось настроение. Алинур ...... ...... күлдү. сен жакшы энесиң! – ты хорошая бабушка."},{"t":"h3","h":"II. Чоң эненин табышмактары"},{"t":"p","h":"Биринчи түндү өткөзүштү. Элеттик картайган чоң эненин шаардагы кичинекей небересин айыл балдарындай эмдеп-домдоп баш ийдирүү мүмкүн эместигине үйгө келгенде көзү даана жетти."},{"t":"p","h":"1 жүзүм шербетин – виноградный нектар"},{"t":"v","l":["2 ичиришет – заставляют пить","3 кычкыл – кислый","4 элеттик – сельская, деревенская","5 көзү даана жетти – окончательно убедилась"]},{"t":"p","h":"<span class=\"pg\" data-n=\"115\">115<\/span>Сөзгө башынан шыгы жок кемпир өз алдынча кейип-кепчип да алат. Айла канча? Баланы алаксытуу мойнуна парз. Кантип? Анын үстүнө эртели-кеч сейилдегенде Чынара: – Чоң эне, эртең эстейм дебедиң беле, эми жомок айтып бер. Бол, бачым, – деп чекилдеп жанын койбойт. Чоң эненин айта салайын десе ылайыктуу жомогу да жок. Кыйналып да бүттү. Бир маалда эсине беш, алты ооз табышмагы түшө калса болобу. Жолдон алтын тапкансып кызына күлө бакты карыган эне:"},{"t":"p","h":"– Мен сага табышмак айтам. Сен кыйын экенсиң жандырмагын тап. Макулбу, сексегей?"},{"t":"v","l":["Чынара үлбүрөк кабагын бүркөдү:","– Андайды кичине балдар билбейт.","Чоң эне азыноолак кырдана:"]},{"t":"p","h":"– Угуп турсаң, сексегей. Сен ойлоп табасың. Эгер такыр түшүнбөсөң, анда жомок айт деп кыйнаба мени, арам сексегей."},{"t":"p","h":"Чынара ылдый жер карап буйтуюп, үнсүз алдыртадан энесин тыңшап турду."},{"t":"p","h":"– Мына сексегей, илгери бала чакта коломтонун жээгинде момундай табышмактарды айтуучубуз."},{"t":"p","h":"– Коломто деген эмне? Андай неме бизде жок эмне?..— деп сурады Чынара."},{"t":"p","h":"Чоң эне небересине жылмайыңкы тигилип жай унчукту:"},{"t":"p","h":"– Силерге коломтонун кереги не. Ашканаңарда аш бышырчу машинелер (газ дегени) даяр. Ысык суу үй-үйгө түтүк менен чуркап келет экен. Айт, сексегейим, табышмакты тапкың келеби?"},{"t":"p","h":"Чынара башын ийкеди."},{"t":"p","h":"Элестүү болсун үчүн сөөмөйүн жогору көтөрүп, кайра ылдый тартып чоң эне сөзүн баштады:"},{"t":"p","h":"– «Кырдан кызыл көйнөк кыз чуркап келатат». Бул эмне, сексегей? Чынара ийнин куушуруп, ууртунан бырс этти:"},{"t":"v","l":["1 кейип-кепчип да алат – мында: иногда сетует на это","2 алаксытуу мойнуна парз – должна отвлекать; в знач. нянчить","3 эсине түшө калды – вспомнились","4 үлбүрөп кабагын бүркөдү – она трогательно (или осторожно) нахмурилась","5 азыноолак (бир аз, азыраак) кырдана – немного важничая","6 буйтуюп (буйтуйду) алдыртадан – мында: смотрела исподлобья","7 коломтонун жээгинде – мында: вокруг очага","8 ийнин куушуруп – пожав плечами"]},{"t":"p","h":"<span class=\"pg\" data-n=\"116\">116<\/span>Чоң эне бырыш баскан сөөмөйү менен өз мурдун черткилеп: Мобу мурун, кырдай болуп коңкойуп турабы?"},{"t":"p","h":"– Ооба......"},{"t":"p","h":"– Мындан аккан кан кыпкызыл көйнөк кыздай ылдый чуркайбы? «Кырдан кызыл көйнөкчөн кыз чуркады» деген мурундун каны экени төгүнбү? – Азыноолак уюп, элдир-селдир элестете баштаган небересине эне он кайталап жатып табышмакты жандырмагы менен түшүндүрдү."},{"t":"p","h":"Анан экинчи табышмагын айтты:"},{"t":"p","h":"– «Айланасы таш, ортосунда бышкан аш». Бул эмне, сексегей? Чынара эринин бөйтөйтүп, бакырайган көзүн алаңдатып, тепейген кичинекей сөөмөйү менен чекесин тырмалап далайга ойлонуп калды. Ары ойлоду, бери ойлоду такыр таппады. Акыры чоң энесине келип жалбарды."},{"t":"p","h":"– Чоң энекебей, ушуну эле айтып берсең. Кийинкисин өзүм табам. Алтын энекебайым!"},{"t":"p","h":"Чоң эне ашканага кирди да күйпөлөктөп жүрүп, уучуна бирдемени чеңгелдеп келди:"},{"t":"p","h":"– Сексегей, жандырмагын сенин көзүңө көргөзөйүн. Антпесем оңой менен боолголоочу кейпиң жок. Мына карап тур,- деди сол уучун жаза алаканында дөңкөйүп жалгыз жаңгак турду. – Ме, сексегей, кармап көрчү?"},{"t":"p","h":"– Ихи, кана ташы, кана ашы?"},{"t":"p","h":"– Мына сексегей, быягы да, тыягы да, бардык айланасы таштай катуу бекен? «Айланасы таш»деген ушул."},{"t":"p","h":"– Э...... эй кызык, чын эле, – деди Чынара эрдин чормойто. Чоң эне бычактын учу менен жаңгактын сөөгүн чакты да ичиндеги уюл-уюл данегин алып, а дегенде, быссмылда деп өз оозуна салып, анан небересине берип:"},{"t":"v","l":["1 өз мурдун черткилеп – щелкнула (пальцем) свой нос, стуча по своему носу","2 элдир-селдир элестетип – малу по малу представлять"]},{"t":"p","h":"3 эринин бөйтөйтүп, бакырайган көзүн алаңдатып – мында: надув губы, широко раскрывая большие глаза"},{"t":"v","l":["4 күйпөлөктөп жүрүп – посуетившись","5 алаканында дөңкөйүп – на ладони лежал","6 ичиндеги уюл-уюл данегин алып – вынув изнутри ядро ореха"]},{"t":"p","h":"<span class=\"pg\" data-n=\"117\">117<\/span>– Көрдүңбү, сексегей. «Ортосунда бышкан аш»деген ушул. Таштай болгон кабыктын ичинде өзүнөн-өзү бышып калган үчүн дароо эле чагып жеп жатпайбызбы. Билип кой сексегей, чоң энең анчалык эле чогоол эмес!"},{"t":"v","l":["1. Чынара кандай кыз эле?","2. Аны ата-энеси эмне деп жооткотушту?","3. Алар Москвага кеткенде Чынара ким менен калды?","4. Чоң эне ага кандай өнөр үйрөттү?","","1. Чоң эне айткан табышмактарды жаттагыла."]},{"t":"p","h":"2. Сан атооч катышкан сүйлөмдөрдү тапкыла жана ал кандай сан атооч экендигин көрсөткүлө."},{"t":"p","h":"Үлгүсү: Үйдө чоң энеси экөө гана ээлик болуп калышты – жамдама сан атооч."},{"t":"p","h":"Эсиңерге түйүп алгыла!"},{"t":"p","h":"Сексек чач, сексегей, саамай, жомок, акыл-насаат, мойнуна парз, коломто, чеңгелдеп, боолголоочу кейпиң жок, уюл-уюл данек, чогоол эмес."},{"t":"h3","h":"III. Чынара табышмакчы кыз болду"},{"t":"p","h":"Ошондон баштап Чынаранын бийге да, жомокко да табияты мурункудай тартпастан, ар нерсени кармалап, өз алдынча чоң энесине табышмак айтууга далалаттанды. Анын эң алгачкы табышмагы бул: үйдүн боорундагы чоң күзгүдөн өзүн көрүп, ары бери секирип ойноп жатты да:"},{"t":"p","h":"– Караса өзүн көрөт бул эмне? – деп айтарын айтып алып борсулдап күлгөн боюнча, энесинин тизесине арта салынды. Кытылдап күлкүсүн тыйбай кубанган небересин чоң эне бооруна кыса кучактап тура калды:"},{"t":"v","l":["1 дароо эле чагып жеп жатпайбызбы – сразу колем и едим","2 мурункудай (баштагыдай) – как прежде","3 үйдүн боорундагы күзгү – мында: висевшее на стене зеркало","4 борсулдап күлгөн боюнча – довольно смеясь"]},{"t":"p","h":"<span class=\"pg\" data-n=\"118\">118<\/span>– Акыл-эсинден айланайын сексек! Кана, кайра айтчы табышмагынды? – Чынара башын көтөрсө, энеси экөө алиги күзгүдөн даана көрүнүүдө. Апакай колун тепеңдетип, тигине дегенсип, күзгүгө карай шилтеди."},{"t":"p","h":"– «Караса өзүн көрөт» деген күзгү эмеспи. Чоң эне небересинин алкымынан, чачынан, колунан жыттагылап: Ооба, ооба, «караса өзүн көрөт» деген табышмактын жандырмагы – күзгү. Жыгылдым сага сексегим. Болду эми, элдин көзүнчө көп дөөдүрөбөй жүр, макулбу? – деп карыган неме жакасын кармап тобо кыла ичинен кобурады."},{"t":"p","h":"Чоң энеси кубаттап жыгылдым деген соң Чынара эдирендеп шерденип калды. Акырын басып, эки колун аркасына кайрып бычакты катып турду да:"},{"t":"p","h":"– «Нанды да, этти да кесет», ал эмне? – деп сурайт энесинен. Анын бар кыймылын байкаган чоң эне шар кетет:"},{"t":"p","h":"– Ал бычак эмеспи секелек? Дептерди койнуна катып:"},{"t":"p","h":"– «Сүрөт тарткан, кат жазган» – эмне?"},{"t":"p","h":"– Кагаз, – дейт энеси."},{"t":"p","h":"– Таптың. Жыгылдым чоң эне – деп, текилдеп барып аны ордуна коёт да, башка бир буюмду алып келет. Баары бир кайсы буюмду жашырып туруп табышмактатып айтпасын чоң энеси дароо эле таап коет. Ал эми анын бир табышмагын чоң энеси такыр эле таба албай койду:"},{"t":"p","h":"– Чоң эне, «ичи толгон идиш». Ал эмне? – деди мостоюнку. Небересинин колу-башын караса мурункудай катып алган эчтеме жок. Чынар чекилдеп энесине тыңсына:"},{"t":"p","h":"– Эх, таппасаң уят болосуң. «Ичи толгон идиш». Ал эмне? Кана айтчы?"},{"t":"p","h":"Чоң эне ары ойлонуп, бери ойлонуп тажаган соң, дагы эле Чынарага тигилди. Бала неме канчалык амалданайын деген менен көзү бажырайып, ирмебей кадалып «ичи толгон идиш»кире бериш бурчта буфет экенин билгизип турду."},{"t":"p","h":"1 алиги күзгүдөн даана – в зеркало было четко видно"},{"t":"v","l":["колун тепеңдетип – выставляя руки","жыттагылап – принюхиваясь","жыгылдым (мында: жеңилдим) – я тебе сдаюсь","элдин көзүнчө көп дөөдүрөбөй жүр – много не болтай при людях","кобурады – пробормотала","эки колун аркасына кайрып (алып) – убрала руки за спину","секелек (ласк.) – малолетняя девочка"]},{"t":"p","h":"<span class=\"pg\" data-n=\"119\">119<\/span>Бирок чоң эне дал ушул жерден карматты. Анткени, идиш салган буюмду көрүп турган менен анын аты эмне экенин билүүчү эмес."},{"t":"p","h":"Үкөк дейин десе, ага окшобойт. Сандык дейин десе буга окшобойт."},{"t":"p","h":"Анысын билип алгансып чекчелеңдеп кыйнап кирди:"},{"t":"p","h":"– Чоң энеси билбесе кызы уят болот да. Үйрөтөйүн сага. Кана, буфет деп айт."},{"t":"v","l":["Чоң эне үстүңкү тиши жок эрдинен жел чыгара:","– Пупе, вувед, – дей берди."]},{"t":"p","h":"– Ай, яй-яй...... – деди Чынара бөрсөйгөн кош эринин чормоңдото:"},{"t":"p","h":"– Бу-фе-т – дебейсиңби?"},{"t":"p","h":"Чоң эне кичинекей небересинин чекчейип өзүн деле салабаттуу кармаганына карабастан, тыбырчылатып жерден эңип көнүмүшүндөй өөп-жыттагылап, жүдөтүп жиберди:"},{"t":"p","h":"– Мээси бөксөргөн карыган эненди, өмүрүндө урунбаган буюмду сурап, тантытпай жүр, сексегей. Макулбу? Экинчи минтпейсиңби?"},{"t":"p","h":"– Макул эле, макул, – убадасын берип жатып арандан зорго кутулду Чынара, чоң энесинин уйпалаганынан."},{"t":"p","h":"Чынара, убадасынан бат эле танды. Ага эми чыны менен табышмактан сонун эч нерсе жоктой сезилди. Энеси экөө отурганда, жатканда эң кызык эрмеги табышмак. А дегенде чоң энесин кыйнайт. Ал баягы төрт табышмагын баштап келе жатканда эле, «мурундун каны», «жаңгак» ... деп нары бурчатпайт. Өзү болсо мурдагысындай кыйналбастан, ар бир көзүнө көрүнгөн нерсе жөнүндө бат эле табышмак айта салат. Кийинки күндөрдө электр шамы жөнүндө «Өзү эле илинип турат, үйдү жарык кылат», телефон жөнүндө «чыр-чыр этет, колума алсам Москвадан атам сүйлөшөт», телевизор жөнүндө «энем экөөбүз үйдөн театр көрөбүз» ал эмне?.."},{"t":"p","h":"1 билгизип турду – выдавали (глаза)"},{"t":"v","l":["2 билүүчү эмес – не знала","3 билип алгансып чекчелеңдеп – будто догадалась о чем-то","4 жел чыгара – раздувая воздух","5 салабаттуу кармаганына карабастан – несмотря на свою сдержанность","6 жүдөтүп жиберди – слегка изнурила (замучила)","7 нары бурчатпайт (айттырбайт) – не дает дальше сказать","8 электр шамы – электрическая лампочка"]},{"t":"p","h":"<span class=\"pg\" data-n=\"120\">120<\/span>Шаардык буюм-теримди көрсө да атын билбеген, же тили келбеген карыган эне небересинин оболуна көнүп, бир чети табалбай оозун ачып, ыңгайсыз абалда калып кичинекей кызына тамаша салса, экинчиден өзү да сексегейинин тез илип кеткен зээндүүлүгүнө ичинен ыраазы."},{"t":"p","h":"Айтор чоң энесинин бардык табышмагы төрттөн ашпай кайра-кайра башынан түшө берсе, Чынараныкы көбөйгөндүн үстүнө көбөйүүдө... Чоң эне менен небере эртели-кеч бош кездеринде табышмак айтышып олтурушуп, бир айдын кандай тез өткөнүн да сезбей калышты..."},{"t":"p","h":"өз алдынча айтууга далалаттанды – мында: пыталась самостоятельно придумать загадки."},{"t":"p","h":"тизесине арта салынды – мында: повисла на коленях. Атка жүгүн арта салды. Бутун үзөңгүгө артты. Колун ...... ......."},{"t":"p","h":"бооруна кыса кучактап – крепко прижимая к груди. Чоң эне бооруна кысты. Баатырлар төштөрүн тийгизип кучакташты."},{"t":"p","h":"эдирендеп шерденип калды – мында: воодушевилась."},{"t":"p","h":"тикилдеп барып ордуна коёт – проворно (шустро) ставит на место. Чынара ... кыз. Буюмду ...... ...... . ичи толгон идиш – внутри полно посуды."},{"t":"v","l":["амалданайын деген менен – несмотря на уловки.","дал ушул жерден карматты – мында: здесь она попалась."]},{"t":"p","h":"бөрсөйгөн кош эринин чормоңдото – выпячивая кругленькие губки. Чынар ...... ...... чормойтту. Нурбол ...... бала."},{"t":"v","l":["кана айтчы «буфет» деп? – скажи-ка, «буфет».","арандан зорго кутулду – еле-еле освободилась."]},{"t":"p","h":"эң кызык эрмеги – ее самое интересное (любимое) занятие. Кыздын ...... чоң энесине эркелөө."},{"t":"p","h":"кыйнайт – мучает. Чынара адагенде чоң энесин ......"},{"t":"p","h":"зээндүүлүгүнө ичинен ыраазы – внутри довольная ее сообразительностью. Вероника ...... окуучу. Михаил ...... футболка кийди. Апасы кызынын ...... ...... . 1 буюм-теримди көрсө – если увидит какие-либо вещи 2 ыңгайсыз абалда калып – чувствовала себя неудобно"}],"sub":[{"title":"II. Чоң эненин табышмактары","b":19},{"title":"III. Чынара табышмакчы кыз болду","b":56}],"section":"КАСЫМАЛЫ БАЯЛИНОВ","pages":[114,120]},{"title":"МУКАЙ ЭЛЕБАЕВ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"121\">121<\/span>МУКАЙ ЭЛЕБАЕВ"},{"t":"img","src":"data:image/webp;base64,UklGRqwOAABXRUJQVlA4IKAOAACwgwCdASoKAV8BPrVQnUonJSMkshQpEOAWiWlu3scOWA5twPxs7Nd16eCeyKVqFJLGT87Qp2cab1bWfHacmLX7l6iBk1onzA0eqFPfiMhl1f70pSrrOV8xf1Mqw8oyrUrxEnbyii1Cn6IdsphC/3zM3ysRUwn6IZgOyaPnoewZBDceJFKuOjsQlY1z7ohZ4AlM5t/D750TjajmjBesU4d+xOt7FvASQKJG1oDew6dQvtmTn7ftontGhGatVZ4fm6AhK4p4TVrPO9AqKJtgTVkauRiuWQjK5T11/

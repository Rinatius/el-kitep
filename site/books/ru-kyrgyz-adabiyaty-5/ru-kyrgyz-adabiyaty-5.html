<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Кыргыз адабияты 5</title>
<style>/* Mobile textbook reader. No external fonts or libraries: everything works offline. */
:root {
  --bg: #ffffff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3;
  --panel: #f6f6f6; --accent: #1f6feb; --accent-fg: #ffffff;
  --fs: 19px; --lh: 1.55;
  --font: Georgia, "Noto Serif", "DejaVu Serif", "Times New Roman", serif;
  --bar-h: 48px; --foot-h: 28px;
}
[data-theme="sepia"] { --bg: #f5ecd9; --fg: #4a3b2a; --muted: #8a7458; --line: #e0d2b4; --panel: #ece0c6; --accent: #9a5b13; }
[data-theme="dark"]  { --bg: #111315; --fg: #d8d8d8; --muted: #8c8c8c; --line: #2a2d31; --panel: #1b1e21; --accent: #6ea8ff; --accent-fg: #0b0b0b; }
[data-theme="contrast"] { --bg: #000000; --fg: #ffffff; --muted: #c8c8c8; --line: #444; --panel: #151515; --accent: #ffd400; --accent-fg: #000; }
[data-font="sans"] { --font: Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 16px/1.4 Roboto, "Noto Sans", Arial, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- Library ---------- */
.lib { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lib h1 { font-size: 22px; margin: 8px 0 4px; }
.lib .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.lib-head { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
.lib-head h1 { flex: 1; margin: 0; }
.school { display: flex; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.school button { flex: 1; min-height: 44px; padding: 0 10px; font-size: 15px; background: var(--panel); }
.school button + button { border-left: 1px solid var(--line); }
.school button.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.my-link { flex: 0 0 auto; font-weight: 600; min-height: 40px; padding: 0 12px; font-size: 14px; }
.grade { margin-bottom: 10px; }
.grade-h { display: flex; width: 100%; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 18px; font-weight: 600; text-align: left; }
.grade-h::after { content: '›'; font-size: 24px; color: var(--muted); margin-left: 10px; transition: transform .15s; }
.grade.open .grade-h::after { transform: rotate(90deg); }
.grade-h .n { margin-left: auto; font-size: 14px; font-weight: 400; color: var(--muted); }
.grade-b { padding: 0 2px; }
.grade-t { font-size: 20px; margin: 18px 0 0; }
.subj { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.bk { border-bottom: 1px solid var(--line); padding: 4px 0 12px; }
.bk:last-child { border-bottom: 0; }
.bk-t { font-size: 17px; font-weight: 600; }
.bk-s { font-size: 14px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bk-m { color: var(--muted); font-size: 13px; margin: 3px 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: .5; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.bk-h { display: flex; align-items: flex-start; gap: 4px; }
.bk-h .bk-t { flex: 1; padding-top: 10px; }
.bk .row { gap: 4px; }
.bk .row .btn { min-height: 40px; padding: 0 18px; font-size: 14px; margin-right: 8px; }
.bk .icon { color: var(--muted); flex: 0 0 auto; }
.bk .icon[disabled] { opacity: .5; }
.bk .icon.on { color: var(--accent); }
.bk .star.on svg { fill: currentColor; }
.bk .star.on { color: #e3a008; }
.share-opts { display: flex; flex-direction: column; gap: 10px; }
.share-opts .note { margin-top: 0; }
.sheet h3 .icon { flex: 0 0 auto; }

/* ---------- Reader ---------- */
.reader { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; user-select: text; }
.viewport { position: absolute; left: 0; right: 0; top: 0; bottom: var(--foot-h); overflow: hidden; }
.flow {
  height: 100%; column-fill: auto; padding: 20px 0 12px;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  will-change: transform; transform: translate3d(0,0,0);
  hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
}
.flow.anim { transition: transform .25s ease-out; }
.flow p { margin: 0 0 .15em; text-indent: 1.4em; text-align: left; }
.flow p.ni { text-indent: 0; }
.flow h1, .flow h2, .flow h3 { font-family: Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.25; break-after: avoid; page-break-after: avoid; }
.flow h1 { font-size: 1.35em; margin: .2em 0 .8em; text-align: center; }
.flow h2 { font-size: 1.15em; margin: 1.1em 0 .5em; }
.flow h3 { font-size: 1.0em; margin: 1em 0 .4em; }
.flow .verse { margin: .6em 0 .8em 1em; break-inside: auto; }
.flow .verse div { text-indent: -1em; padding-left: 1em; text-align: left; }
.flow .verse .gap { height: .7em; }
.flow figure { margin: .8em 0; text-align: center; break-inside: avoid; page-break-inside: avoid; }
.flow figure img { max-width: 100%; height: auto; border-radius: 4px; background: var(--panel); }
.flow figcaption { font-size: .8em; color: var(--muted); margin-top: .3em; }
.flow .box { border-left: 3px solid var(--accent); padding: .1em 0 .1em .7em; margin: .7em 0; }
.flow .pg { font: 11px/1 Roboto, Arial, sans-serif; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 4px; margin: 0 3px; vertical-align: 2px; text-indent: 0; white-space: nowrap; user-select: none; }
.flow .end { height: 1px; }
.flow .endnote { text-align: center; color: var(--muted); font-size: .8em; margin-top: 2em; font-family: Roboto, Arial, sans-serif; }
[data-theme="dark"] .flow img, [data-theme="contrast"] .flow img { filter: brightness(.9); }

.foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot-h); display: flex; align-items: center;
  justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.foot .t { overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }

.bar { position: absolute; left: 0; right: 0; background: var(--panel); border-color: var(--line); z-index: 5;
  transition: transform .2s; display: flex; align-items: center; }
.bar.top { top: 0; height: var(--bar-h); border-bottom: 1px solid var(--line); transform: translateY(-100%); padding: 0 4px; }
.bar.bottom { bottom: 0; border-top: 1px solid var(--line); transform: translateY(100%); padding: 10px 16px 14px; flex-direction: column; align-items: stretch; gap: 6px; }
.reader.ui .bar { transform: none; }
.bar .title { flex: 1; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.bar .info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* ---------- Sheets (TOC, settings) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85%; overflow: auto; background: var(--bg);
  border-radius: 16px 16px 0 0; z-index: 11; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
.sheet h3 { margin: 10px 0 12px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.toc a { display: block; padding: 11px 4px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 15px; }
.toc a.sub { padding-left: 20px; font-size: 14px; color: var(--muted); }
.toc a.cur { color: var(--accent); font-weight: 600; }
.set { margin: 14px 0; }
.set label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; }
.seg button.on { border: 2px solid var(--accent); font-weight: 600; }
.swatch[data-v="light"] { background: #fff; color: #1b1b1b; }
.swatch[data-v="sepia"] { background: #f5ecd9; color: #4a3b2a; }
.swatch[data-v="dark"] { background: #111315; color: #d8d8d8; }
.swatch[data-v="contrast"] { background: #000; color: var(--accent-fg); }
.goto { display: flex; gap: 8px; }
.goto input { flex: 1; min-height: 44px; font-size: 16px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px;
  border-radius: 20px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Textbook elements produced by tools/convert_pdf.py ---------- */
.flow .tasks, .flow .gloss { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45;
  background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0; }
.flow .tasks p, .flow .gloss p { margin: 0 0 .35em; text-align: left; }
.flow .gloss { border-left: 3px solid var(--accent); }
.flow p.note { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; font-style: italic; text-indent: 0; margin: .6em 0; }
.flow p.attr { text-align: right; text-indent: 0; font-style: italic; color: var(--muted); margin: .1em 0 .8em; }
.flow p.sep { text-align: center; text-indent: 0; color: var(--muted); margin: .5em 0; letter-spacing: .3em; }
.flow h2 .pg, .flow h3 .pg { font-weight: normal; }
.toc .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 4px 2px; }
.toc a .p { float: right; color: var(--muted); font-size: 13px; margin-left: 8px; }

/* ---------- Elements produced by tools/convert_layout.py (typeset textbooks) ---------- */
.flow figure img { cursor: zoom-in; }
.flow h4.mk { font: 700 .78em/1.3 Roboto, "Noto Sans", Arial, sans-serif; letter-spacing: .05em; color: var(--accent);
  margin: 1em 0 .3em; break-after: avoid; page-break-after: avoid; }
.flow p.hl { color: var(--accent); text-indent: 0; }
.flow p.small { font-size: .82em; text-indent: 0; color: var(--muted); }
.flow sup, .flow sub { font-size: .7em; line-height: 0; }
.flow .kbox { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45; background: var(--panel);
  border-radius: 8px; padding: .45em .7em; margin: .5em 0; border-left: 3px solid var(--accent); }
.flow .kbox > b { display: block; }
.flow .frame { background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0;
  font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; line-height: 1.45; }
.flow .frame p { text-indent: 0; margin: 0 0 .35em; text-align: left; }
.flow .tbl { margin: .8em 0; font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .8em; line-height: 1.35; }
.flow .tbl .tt { font-weight: 600; text-indent: 0; text-align: center; margin-bottom: .3em; }
.flow .tbl table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.flow .tbl th, .flow .tbl td { border: 1px solid var(--line); padding: .3em .35em; vertical-align: top; text-align: left; overflow-wrap: anywhere; hyphens: auto; }
.flow .tbl th { background: var(--panel); }
.flow .tbl tr { break-inside: avoid; page-break-inside: avoid; }

.zoom { position: fixed; inset: 0; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; background: rgba(0,0,0,.92); z-index: 30; }
.zoom-in { position: absolute; inset: 0; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
.zoom-in img { margin: auto; flex: none; touch-action: pan-x pan-y; object-fit: contain; background: #fff; cursor: zoom-in; }
.zoom-x { position: absolute; top: 8px; right: 8px; color: #fff; background: rgba(0,0,0,.5); z-index: 31; }
.flow h4.sh { font: 700 .95em/1.3 Roboto, "Noto Sans", Arial, sans-serif; text-align: center; margin: .8em 0 .4em; break-after: avoid; page-break-after: avoid; }

/* maths books */
.flow h4.ex, .flow h4.try { font-family: Roboto, Arial, sans-serif; margin: 1.1em 0 .3em; font-size: 1em; }
.flow h4.ex { display: inline-block; background: #f7e400; color: #111; padding: .1em .6em; border-radius: 3px; }
.flow h4.try { color: var(--accent); }
.flow p.goal { font-size: .85em; text-indent: 0; background: var(--panel); border-radius: 8px; padding: .4em .7em; }
.flow b.bd { display: inline-block; text-indent: 0; padding: 0 .4em; border-radius: 1em; background: var(--fg); color: var(--bg);
  font: bold .8em/1.45 Roboto, Arial, sans-serif; margin-right: .2em; }
.flow b.nb { display: inline-block; text-indent: 0; min-width: 1.4em; border-radius: 4px; background: var(--accent); color: var(--accent-fg);
  text-align: center; font-size: .8em; margin-right: .3em; }
.flow .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.15; margin: 0 .1em; }
.flow .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .15em; }
.flow p.ml { text-indent: 0; padding-left: 1em; }
.flow p.side { font-size: .85em; }
.flow details.ans { margin: .3em 0 .8em; font-size: .9em; }
.flow details.ans summary { color: var(--accent); cursor: pointer; font-family: Roboto, Arial, sans-serif; }

/* wide tables become one card per row on phones */
@media (max-width: 560px) {
  .flow .tbl.cards table, .flow .tbl.cards tbody, .flow .tbl.cards tr, .flow .tbl.cards td { display: block; width: auto; }
  .flow .tbl.cards tr:first-child { display: none; }
  .flow .tbl.cards tr { border: 1px solid var(--line); border-radius: 8px; margin: .5em 0; padding: .3em .5em; }
  .flow .tbl.cards td { border: 0; padding: .15em 0; }
  .flow .tbl.cards td::before { content: attr(data-l); display: block; font: 600 .75em/1.3 Roboto, Arial, sans-serif; color: var(--muted); }
  .flow .tbl.cards td:first-child { font-weight: 600; }
}
.flow figure.vec svg { max-width: 100%; height: auto; display: inline-block; background: #fff; border-radius: 4px; cursor: zoom-in; }
[data-theme="dark"] .flow figure.vec svg, [data-theme="contrast"] .flow figure.vec svg { filter: brightness(.9); }
.flow .rt { border-top: 1px solid currentColor; padding-top: 1px; margin-left: 1px; }
.flow .it { display: inline-block; max-width: 100%; margin-right: .9em; text-indent: 0; }

/* ---------- Text quality badge (library rows, first page of a book, reader top bar) ---------- */
.q { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 10px 2px 8px; margin: 0 8px 2px 0;
  border: 1px solid var(--line); border-radius: 13px; background: var(--panel); color: var(--fg);
  font: 12px/1.2 Roboto, "Noto Sans", Arial, sans-serif; vertical-align: middle; text-indent: 0; white-space: nowrap; }
.q i, .qdot i { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.q-exact i { background: #2da44e; }
.q-proofread i { background: #3b82f6; }
.q-ocr i { background: #e8900c; }
.qdot { display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 12px; }
.qdot i { width: 12px; height: 12px; }
.bk .row .q { margin: 0 0 0 auto; }
.flow .qline { margin: 0 0 1em; text-indent: 0; }
.flow .qline .q { font-size: 13px; cursor: pointer; }
.qsheet .q { font-size: 14px; min-height: 30px; margin: 0 0 4px; }
.qsheet p { font-size: 15px; line-height: 1.5; margin: 10px 0; }

/* ---------- Menu (☰), "What's new", missing books ---------- */
.lib-head .burger { flex: 0 0 auto; margin-left: -10px; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 85%); background: var(--bg); z-index: 11;
  padding: 8px 0 24px; overflow: auto; box-shadow: 2px 0 12px rgba(0,0,0,.2); }
.drawer-h { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 8px 16px; font-weight: 600; font-size: 17px; }
.drawer a { display: block; padding: 14px 16px; color: var(--fg); text-decoration: none; font-size: 16px; border-top: 1px solid var(--line); }
.drawer a.cur { color: var(--accent); font-weight: 600; }
.drawer .note { padding: 8px 16px 0; border-top: 1px solid var(--line); margin-top: 0; }
.news-d { font-size: 15px; color: var(--muted); font-weight: 600; margin: 20px 0 6px; }
.news { border-bottom: 1px solid var(--line); padding: 2px 0 10px; }
.news p { margin: 6px 0; font-size: 15px; line-height: 1.5; }
.news summary { color: var(--accent); cursor: pointer; font-size: 14px; min-height: 32px; line-height: 32px; }
.news-b { margin: 2px 0 4px; padding-left: 20px; font-size: 14px; line-height: 1.8; }
.bk.miss { padding: 8px 0 12px; }
.bk.miss .bk-m { margin-bottom: 6px; }
.ms { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.ms-kyonly, .ms-edition, .ms-sample { border-color: #e8900c; }
.bk.miss .note { margin-top: 6px; font-size: 14px; }
.offer { margin: 24px 0 0; padding: 14px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.offer h2 { font-size: 18px; margin: 0 0 6px; }
.offer p { margin: 6px 0; font-size: 15px; line-height: 1.5; }
.up label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
.up select, .up input[type=text], .up textarea { width: 100%; min-height: 44px; font-size: 16px; padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-family: inherit; }
.up input[type=file] { font-size: 15px; max-width: 100%; }
.up .btn { margin-top: 14px; width: 100%; }
.up .done { font-weight: 600; }

/* ---------- Report a text error (select text in a book) ---------- */
.rep { position: absolute; left: 50%; bottom: calc(var(--foot-h) + 14px); transform: translateX(-50%); z-index: 6;
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 22px;
  background: var(--accent); color: var(--accent-fg); font-size: 15px; font-weight: 600; box-shadow: 0 2px 10px rgba(0,0,0,.25);
  white-space: nowrap; -webkit-user-select: none; user-select: none; }
.rep[hidden] { display: none; }
.rep svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rq { margin: 0 0 6px; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--panel); border-radius: 6px;
  font-family: var(--font); font-size: 16px; line-height: 1.45; max-height: 30vh; overflow: auto; }
.sheet textarea { width: 100%; font-size: 16px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); font-family: inherit; }
.sheet .rsend { width: 100%; }
</style>
</head>

рлиги, 2012 © «Инсанат» басмасы, 2012"},{"t":"h3","h":"<span class=\"pg\" data-n=\"3\">3<\/span>КЫРГЫЗ АДАБИЯТЫНЫН БУЛАГЫ – КЫРГЫЗ ТУРМУШУ"},{"t":"p","h":"Кыргыздар – байыркы жана таланттуу эл. Алар «Манас», «Семетей», «Сейтек», «Курманбек», «Эр Төштүк» сыяктуу көлөмү жана көркөмдүгү боюнча дүйнөдө теңдешсиз чыгармаларды жаратышкан. Улуттук фольклордо, айрыкча эпостордо, кыргыздардын басып өткөн тарыхый жолу, турмуш ыңгайынын бөтөнчөлүгү, жашоого карата мамилеси, эстетикалык көз караштары чагылдырылган. «Манас» эпосун окумуштуулар «кыргыз элинин энциклопедиясы» деп мүнөздөп жүрүшөт. Токтогул Сатылганов, Тоголок Молдо, Түгөлбай Сыдыкбеков, Алыкул Осмонов жана башка акын-жазуучулардын чыгармалары башка элдерге да жакшы тааныш. Ал эми Чыңгыз Айтматовдун чыгармаларын бүткүл дүйнөдө сүйүп окушат."},{"t":"img","src":"data:image/webp;base64,UklGRtZUAABXRUJQVlA4IMpUAABQDAKdASqAArkBPq1MnkmmJK0msXW8WaAViWRuZbCUQArQKev5IQW0d6WuQ/bP9//Relnx73ofWvwPqz/6O7L4b/v+db7J3uf+n62/2D7Ef9J/zPUY/w/pQ8zzzSN/m6HT1uMaJmQeP/4fVIfyUVfM5/2eUf5dpJm3PGLqNslp07/48ChC/Wh1n/fDltJgTc5WSPs1hx8EJnlZDx4CpAayhlsbsqwWK8IUwq60B0X/sVBO3dxqAfWi0C/l8cFKLjlKqjuuMAmBzlrqO2tFeQyxL/1Kh7oiUE7VEWtmPorTGEknCmgITsfgOiFN7iqY1wT156R37mGaRx4vX7Wis0zDUTQeFEoykbVA66Uz4t7G6RUeiBkzHPwdEA6Di+CGuR7r7UNQvzsXbusKDF5L8mo75fXQ0fn47WajO+Lu0gwpFs11m2aHnCczArPiVSiNI/AmJUUNLTXByHiEJJQ5CuSNSbsr1QKHBa7f6ZsDdzt1luLvPRM1GzV9/ItCKVtwPyUHkkekk8a26RvaJI77KxRq5qnmSIuK55baqF6MFSttqUaEyYf5MvuYmkujpwWuzT47Td+Hw57vdDEvdGLuFjoX/DsVs5jBCELNste9bEMud/9U2/cpZ6nvc62X/7pYf6lYabUQvdLqWrJXz78O+xT0s4+3G3qgNBLgsTHm1r/A2COosdcvnhCRwTBWJdMq8DU2owmu9NHDZfM0GxXcX+u83e5U5Q4slTJ6fF0Yr6Npss8tMJrJIoe3uZbpjH2E9tq71UJXHGQtRAGHyXj52pBxD0LVZ12MBw4khOxKeDCw+O0dLcsAcDx2zi+boqGWpKNrolGXRyLcTtuQS9XWWKRVk+8mbJuIhIWxWDhEcPQl90Bq5FCZU+JHWPOfSrYte0Ea9RjzT5+i3o2Aym7Bxd3aFMVmRHi2mX7TV4SakGpvEVC2AmpG76GcDLyFDTxpmmT6B4Y4sziheduKXZjO4Cnq0EfSS/Jl1J/E/sfhBp9mcwS5F2HSFx7T2YEza89DwE1jkbq3pz2OTwOKpIhWD5u4OkAc1OVcqz/mBw3JJESusRfzx+RLmt1n8cOU+pSBzluZPcLDOIu8qFo/mN4tmKFeSHJqV+OoE+vCKo8y6w – выходец из народа. 1. Элдин арасынан чыккан – талант. 2. Шаардан ...... жүргүнчү. 3. Колдон ...... кан. муундан-муунга – от поколения к поколению. 1. Фольклор ...... ...... өтүп келген. 2. Уулу жоктун – ...... жок (макал). 3. Сөздөр ...... ажырайт."},{"t":"p","h":"бөтөнчөлүгүнө, талабына – в соответствии с особенностями, требованиями (времени)."},{"t":"p","h":"кошумчаланып, жаңыланып – дополняясь, обновляясь. Жаңы сюжеттер турмуштун талабына ылайык кошумчаланган. Коом улам ...... турат."},{"t":"v","l":["көз караштарын, мамилелерин – систему взглядов, отношений.","оозеки чыгармалар аркылуу – через устные творения."]},{"t":"p","h":"чыгармачылыкка абдан шыктуу – мында: очень способный к творчеству (талантливый). Азамат сүрөт тартууга ...... ......"},{"t":"v","l":["негизги окуяларын – основные события.","башкы каармандарын – главных героев."]},{"t":"p","h":"жанрдык жактан көп түрдүү – многообразный по жанровому составу. жаралыш шарты – условия создания."},{"t":"v","l":["өнүгүш мүнөзү – характер развития.","окшоштуктар – мында: много общего."]},{"t":"p","h":"1. Кыргыз эли, анын басып өткөн жолу жөнүндө эмнелерди билесиңер?"},{"t":"p","h":"2. Элдин кандай маданий мурастары (культурное наследие) бар жана аларда эмнелер чагылдырылган?"},{"t":"p","h":"3. Кыргыз маданиятынын, адабиятынын көрүнүктүү өкүлдөрү (представители) кимдер?"},{"t":"p","h":"4. Республикада элдердин достугун чындоо (укрепление дружбы), тилин үйрөнүп, дилин түшүнүү (понимание души) үчүн кандай иштер жүрүп жатат?"},{"t":"p","h":"5. Кыргыз элдик оозеки чыгармачылыгы дегенде эмнени түшүнөсүңөр? 6. Фольклордук чыгармалар кандай бөлүнүшөт (делятся) жана кандай деп аталышат?"}],"sub":[],"pages":[5,6]},{"title":"ЖОМОКТОР ЖАНА ЖӨӨ ЖОМОКТОР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"7\">7<\/span>ЖОМОКТОР ЖАНА ЖӨӨ ЖОМОКТОР"},{"t":"p","h":"Жомоктор жана жөө жомоктор кыргыз фольклорундагы эпикалык топко кирет."},{"t":"p","h":"Чоң-чоң окуяларды өз ичине камтыган, көлөмдүү чыгармалар жомоктор деп аталат."},{"t":"p","h":"Кара сөз же жорго сөз мүнөзүндөгү, көлөмү чакан, сүрөттөгөн окуялары өтө татаал эмес, элдин ой-кыялынан жаралган чыгармалар жөө жомоктор деп аталат. Алар элдин көз карашын, келечекке болгон умтулууларын чагылдырат жана бул чыгармалардын соңунда элдик идеалдарга ылайык дайыма чындык, адилеттүүлүк жеңишке ээ болот."},{"t":"p","h":"Жөө жомоктор сүрөттөгөн окуяларынын мүнөзүнө ылайык турмуштук, айбанаттар жөнүндөгү жана сыйкырлуу жөө жомоктор болуп бөлүнөт. Мындай бөлүштүрүүнү орус фольклорунан да кезиктирүүгө болот."},{"t":"p","h":"Дүйнөдөгү бардык балдар жомокторду жакшы көрүшөт. Аларда адамдар айбандарга, бак-дарактарга же канаттууларга кубула алышат, келечек тагдырларын кереметтүү күзгүдөн көрүшүп, учуучу килемдер менен каалаган жерине жетишип, айыктыруучу алма менен адамдарды өлүмдөн сактап калышат. Булар кереметтүү, сыйкырдуу жомоктор деп аталат."},{"t":"p","h":"Ал эми ар түрдүү айбанаттар, жан-жаныбарлар катышкан жомоктордо кээде түз же кыйыр (каймана) мааниде элдин социалдык турмуш абалы, үмүт-тилектери, таалим-тарбия берүүчү акыл-насааттары айтылат. Аларда айбанаттардын кыял-жоруктары, мүнөздөрү кеңири чагылдырылат."},{"t":"v","l":["окуяларды – события","кара сөз – прозаической форме","көлөмү чакан – небольшой по объему","дайыма – всегда; дүйнөдөгү – мында: во всем мире; өлүмдөн сактап – спасают от гибели; каймана мааниде – в иносказательном смысле; социалдык – социальное","","кыял-жоруктары – нравы, поступки, то есть вся совокупность поступков"]},{"t":"p","h":"<span class=\"pg\" data-n=\"8\">8<\/span>Кыргыз жомокторунун чоң тобун турмуштук жомоктор түзөт. Аларда биз жашаган турмушта болгон окуялар сүрөттөлөт жана анын каармандары, жетим же кедей балдар, акылдуу кыздар, каардуу хан-бектер жана башкалар. Жомоктордо дайым акылдуу, эр жүрөк, чынчыл каармандар жеңишке жетишет, каардуулар же акылсыздар жазаланат."},{"t":"p","h":"Окумуштуулар азыркы кезге чейин жомокторду эл арасынан жазып алышып, чогултушат. Кыргыз элинде көптөгөн эң сонун, кызыктуу жомоктор бар. Мисалы: «Үч бала», «Акылдуу кыз», «Карачач», «Ырыс алды – ынтымак», «Бала өзүнүн шаарын кантип сактап калды» ж.б."},{"t":"p","h":"эпикалык топко – к эпической группе."},{"t":"p","h":"камтыган – охватывающие. Көп окуяларды ...... эпостор жомоктор деп аталат. көлөмдүү чыгармалар – большие по объему."},{"t":"v","l":["татаал эмес – не сложные.","элдин ой-кыялынын жаралган – созданные сознанием народа."]},{"t":"p","h":"келечекке умтулууларын чагылдырат – отражает стремление в будущее. элдик идеалдарга ылайык – в соответствии с народными идеалами."},{"t":"p","h":"сүрөттөгөн окуяларынын мүнөзүнө – в соответствии с характером изображенных событий."},{"t":"v","l":["кезиктирүүгө (жолуктурууга) – можно встретить.","жакшы көрүшөт – любят.","кубула алышат – могут превращаться, перевоплощаться.","кереметтүү күзгүдөн – из волшебных зеркал (мында: о зеркале).","учуучу килемдер – ковры-самолеты.","айыктыруучу алма – волшебные (исцеляющие) яблоки.","түз маани – прямой смысл, прямое значение.","кыйыр маани – косвенный смысл, косвенное значение."]},{"t":"p","h":"акыл-насааттары – мында: (учить) уму-разуму, (давать) добрые советы. биз жашаган турмушта – в нашей жизни."},{"t":"v","l":["жетим же кедей балдар – сироты или дети бедных семей,","эл арасынан – среди народа, из народа.","чогултушат – собирают.","","чоң тобун – мында: большую группу","жазаланат – получают наказание, наказывается","көптөгөн, эң сонун – много, очень хороших (замечательных)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"9\">9<\/span>1. Жомоктор жана жөө жомоктор деген эмне?"},{"t":"p","h":"2. Алар кандай бөлүнүшөт (как делятся)?"},{"t":"p","h":"3. Эл ушул жомоктордо (в этих сказках) эмнелерди чагылдырышкан? 4. Силер кыргыз жана орус элдеринин кандай жомокторун билесинер (знаете)?"},{"t":"p","h":"1. Орус элинин бир жомогун өз алдынарча (самостоятельно) айтып берүүгө камдангыла."},{"t":"p","h":"2. Көп чекиттин ордуна ылайык келген (соответствующие) сөздөрдү койгула: Дүйнөдө көптөгөн ...... жайгашкан. Мен көп ...... саякаттагым келет. Кыргызстан тоолуу ...... ...... кыргыз, орус, дунган ж. б. калктар жашайт. Менин ...... . келечеги кең (өлкө, өлкөдө, өлкөлөр, өлкөмдүн, өлкөлөргө)."},{"t":"p","h":"3. Тексттеги төмөнкү сөздөрдү башка маанилеш сөздөр менен алмаштыргыла! Өтө татаал эмес, тууралуу, окумуштуулар, Үлгүсү: Ыр түрүндөгү, көптөгөн (чоң-чоң) окуяларды камтыган чыгармаларды жомоктор деп аташат."},{"t":"p","h":"4. Үйдөн жомоктордогу эпизоддор боюнча сүрөт тартып (нарисуйте), аларга ат койгула. Чыгармалардагы өзүңөргө түшүнүксүз болгон сөз айкаштарын (словосочетание), фразеологизмдерди белгилегиле (подчеркните, найдите)."},{"t":"p","h":"5. Татаал сөздөр канчага бөлүнөрүн (на сколько делятся) эстегиле."},{"t":"p","h":"6. Төмөнкү сөздөрдү бөлүштүргүлө жана орусча аттарды кыргызчага которуп кыскартып, жер аттарын тууралап жазгыла, таблицаны толтургула. Ыр-бий, Ысыккөл, денсоолук, Кыргызский национальный университет, жөө жомоктор, Алатоо, Кыргызская академия образований, көз караш, топ-топ, Чоңсарыой, Кыргызский театр опера и балета, үмүт-тилек, таалим-тарбия, Жетиөгүз, эр жүрөк, чынчыл каармандар, хан-бектер."}],"sub":[],"pages":[7,9]},{"title":"КЫРГЫЗСТАН","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"10\">10<\/span>КЫРГЫЗСТАН"},{"t":"p","h":"Кыргызстан – жашыл жери, жашыл бакча жергеси, Жайыт төрү, дан талаасы, сан байлыктын энеси."},{"t":"p","h":"Кен казнасы, көл сулуусу, тунук суунун атасы, Ак пейилдин, мартчылыктын, ырыскынын кемеси. Кыргызстан – соолук айлы, таланттардын эшиги,"},{"t":"v","l":["Тунук акыл, чебер колдун түгөнбөгөн кесиби,","Заманына, өз калкына ой-пикири санаалаш,","Кыргызстан ыр калаасы, ырахаттын бешиги."]},{"t":"p","h":"А. Осмонов"},{"t":"p","h":"жашыл жери – зеленью покрытая земля."},{"t":"v","l":["жайыт-төрү – пастбище, луга.","сан байлыктын энеси – мать (хозяйка) многих богатств.","кен казнасы – природные богатства.","тунук суунун атасы – мында: (обр. выр.) отец чистых вод.","ак пейил, мартчылык, ырыскы – душевность, щедрость, счастье.","соолук айлы – мында: (обр. выр.) родина здоровья.","таланттардын эшиги – мында: (обр. выр.) ворота в страну талантов.","ой-пикири санаалаш – мыслями, взглядами единый (вместе).","ырахаттын бешиги – колыбель счастья."]},{"t":"p","h":"1. Кыргызстан, кыргыз тили, кыргыз эли жөнүндө билгениңерди (то, что знаете) айтып бергиле."},{"t":"p","h":"2. Кыргызстандын жер-сууларын, шаар, айылдарын картадан көрсөткүлө. 3. Кыргыз жеринин жаратылышы жөнүндө сүрөт тартып, анын атын койгула."},{"t":"p","h":"4. Төмөнкү сөздөрдү катыштырып текст түзүүгө аракеттенгиле (постарайтесь). Жөнөкөй жана татаал сөздөргө ажыраткыла: кыргыз эли, улуттук тил, элдик оозеки чыгармачылык, муундан муунга, көркөм мурас, Алатоо, Ысыккөл, Бишкек."},{"t":"p","h":"5. Жогорку ырды адабият дептериңерге көчүрүп алып (перепишите), жаттагыла (выучите наизусть). Татаал сөздөрдү тапкыла."},{"t":"p","h":" Кара сөз (жорго сөз) – прозаическая плавная речь, рифмованная проза. Кыргыз эл жомоктору – кыргызские народные сказки по содержанию делятся на социально-бытовые сказки, сказки о животных и волшебные сказки.<span class=\"pg\" data-n=\"11\">11<\/span>"}],"sub":[],"pages":[10,11]},{"title":"ЖӨӨ ЖОМОКТОР","blocks":[{"t":"h3","h":"ЖӨӨ ЖОМОКТОР"},{"t":"h3","h":"АКЫЛДУУ КЫЗ"},{"t":"h3","h":"I. Кан эмнеге ыйлады"},{"t":"p","h":"Бир заманда Сарыбай деген адам кырк жыл кан болуптур. Күндөрдүн биринде элин чогултуп: «Кырк жыл кан болдум, көрөр күнүмдү көрдүм, ичээр суумду ичтим, өлөрүм калды, өсөрүм калган жок. Менде аласаңар болсо айткыла, көзүмдүн тирүүсүндө берип кутулайын. Көзүм өткөндөн кийин баарыңар чогулуп, ичиңерден бирөөнү кан көтөрүп алгыла»,- деди. Эли: «Жок, сиз өзүңүз коюп кетиңиз, сиз бизге кырк жыл кан болдунуз, сиздин сөзүңүздү угабыз», – дешти."},{"t":"p","h":"Сарыбай кан: «Жок, өлүүнүн сөзүн тирүү сыйлабайт дептир, мен өлгөндөн кийин сөзүм дагы өлөт», – деди. Эл көнгөн жок. – «Канды өзүңүз көтөрүп кетсеңиз экен» – деп, чуулдап туруп алышты. Ошондо Сарыбай кан: «Менин он бир жыл жолдош болгон ак шумкарым бар, мен өлгөндөн кийин үч күнгө чейин тамак жебей, канатын какпай жатат. Төртүнчү күнү элди жыйып, шумкарга тамак берип учурсаңар ал бирөөгө конот. Ошол адамды кандыкка көтөргүлө, себеби менин артымда бала калган жок»,- деди."},{"t":"p","h":"Арадан көп күн өтпөй Сарыбай кан өлдү, ак шумкар айткандай үч күнгө чейин жем жебей, канат какпай аза күтүп жатты. Эли чогулуп, төртүнчү күнү ак шумкарга жем берип учурушту. Ак шумкар элди айланып жүрүп акыры бир койчуга конду. Айрымдары: «Койчуну кандыкка көтөрбөйбүз», – деп чыр кылышты. Айылдын аксакалдары: «Сарыбайдын тирүүсүндө убадабызды берип, айтканыңызды орундатабыз деп ишендиргенбиз. Ак шумкар койчуга конду, койчуну кандыкка көтөрөбүз»,— дешти. Аксакалдардын сөзүн эл жактап, койчуну кандыкка көтөрүшүп, ак шумкарды канга беришти."},{"t":"p","h":"Койчу адилдик менен эл сураган түзүк кан болду. Колунда жок кембагал кишилерге мал бөлүп берип, казынадагы кийимдерден таратып берип турду. Бирок кан ар жума сайын казынага кирип, ыйлап чыкчу."},{"t":"p","h":"<span class=\"pg\" data-n=\"12\">12<\/span>Эл мунун себебин түшүнө албай, бир күнү: «Каным, казынага эмне үчүн кирип, ыйлап чыгасыз?» – деп сурап калышты. Ошондо кан: «Казынада көп дүнүйө бар, суйсалган түлкү ичиктер, жыйылган атлас, шайы бар, алтын, күмүш баары бар. Ошонун ичинде менин койчу убагымда кийген, колго алгыс жыртык жамаачылуу эски кийимим да бар. Мен ошону көрүп ыйлап жүрөмүн», – деди. Эли: «Баракелде кан, али ошонунузду унутпай жүргөнүңүзгө ырахмат!» – дешти."},{"t":"p","h":"Кан бир топ жылдарга чейин эл сурап турду. Бирок аял алган жок. Байлардын, чоң кандардын кыздарын көңүлүнө жактырган жок. Эли канга келип: «Сиздин бойдок жүргөнүңүз жакшы болбойт, артыңызда ордуңузду басар бала калсын. Бала калбаган Сарыбай канды көрбөдүкпү?» – дешти. Кан бул сөзгө көнгөн жок, эли кандын оюна койгон жок."},{"t":"p","h":"кан көтөрүп алгыла – мында: изберите царя. Сарыбай адилет ...... болчу. Мурундан ...... акты. Туу ...... сыяктуу кызыл түстө. Өлүүнүн сөзүн тирүү сыйлабайт дептир, мен өлгөндөн кийин сөзүм дагы өлөт – живые не уважают слова умерших, слова мои умрут вместе со мной. эл көнгөн жок (көнбөдү) – народ не согласился. Балдардын азгырыгына Асия ...... ...... . Дарья бул өлкөгө ......."},{"t":"p","h":"үч күнгө чейин тамак ичпей, канатын какпай жатты —три дня не ел, не летал."},{"t":"v","l":["элди жыйып – мында: собрал народ. Эл ...... Махмуд чеп ......","артымда бала калган жок – не оставил потомства, наследника,","эли чогулуп – собрался народ."]},{"t":"p","h":"койчуга конду – села (опустилась) на пастуха. Ринатка бакыт ...... . Асан эки түн коңшусунукуна конду."},{"t":"v","l":["эл жактап – народ поддержал. Койчунун хан болушун ...... колдоду.","адилдик менен эл сураган – (он) справедливо правил народом."]},{"t":"p","h":"себебин түшүнө албай – не могли понять причину. Эл ...... ...... ...... коюшту? ...... түшүндүрө ...... койдум. ...... түшүнгөн жокмун."},{"t":"p","h":"суйсалган түлкү ичиктер – мында: красивые (переливающиеся) лисьи шубы. Мектептен ...... сулуу кыз чыкты. ...... качты. Төргө ...... илинген."},{"t":"p","h":"жыйылган атлас, шайы – мында: полным-полно атласных, шелковых тканей. Чеп ...... учур ...... картасы тактага илинди. Алёшанын ...... жок."},{"t":"p","h":"<span class=\"pg\" data-n=\"13\">13<\/span>көңүлүнө жактырган жок – мында: не захотел, были ему не по душе. ордуңузду басар бала калсын – мында: пусть после Вас останется наследник (потомство, продолжатель вашего дела). Наристе жакында ...... ...... ...... болор."},{"t":"v","l":["1. Кан элине эмне деп кайрылды?","2. Эл анын сөзүн кандай кабыл алышты (как восприняли)?"]},{"t":"p","h":"3. Кандын ак шумкары кандай милдет аткармак (какую функцию должен был выполнить) жана ал аткардыбы?"},{"t":"v","l":["4. Койчу кандай кан болду?","5. Эл канга эмне деп айтышты?"]},{"t":"p","h":"1. Кандар (биринчи жана экинчи) менен элдин сүйлөшүүлөрүнөн диалог уюштургула."},{"t":"v","l":["2. Жомоктун экинчи бөлүгүн окуп чыккыла.","3. Төмөнкү сөздөрдү тилиңерди жатыктыруу үчүн кайталагыла."]},{"t":"p","h":"бирөөнү, кырк жыл, ичиңерден, баарыңар, өлүүнүн сөзү, үч күнгө, кандыкка, кембагал, атлас, шайы, жүргөнүңүз."},{"t":"p","h":"4. Бул сөздөрдүн маанисин чечмелегиле:"},{"t":"p","h":"Үлгүсү: кан – I. царь; кан – II. кровь, кембагал, ак шумкар, казына, эл суроо, бойдок, көңүлүм болбоду."},{"t":"h3","h":"II. Аялдын акылы"},{"t":"p","h":"Ошондо кан айылындагы кыздарды чогултуп, үч ооз табышмак айтты. «Күн батыш менен күн чыгыштын ортосу нече күндүк жол, асман менен жердин ортосу нече күндүк жол, калп менен чындын ортосу нече күндүк жол»? Жандырмагын жандырып келүүгө үч күн мөөнөт берди."},{"t":"p","h":"Кыздар табышмакты таба алышпай, күндө кандын үйүнөн чубап кайтып жатышты. Бир күнү талаадан отун алып жүргөн чор таман кедейдин чолок этек кызы: «Эжекелер, күндө эки маал чубайсыңар, кайда барып жүрөсүңөр?» – деп сурап калды. Анда бир кыз: «Бул байкуш дагы угуп калсын» – деп, кандын табышмагын айта кетти. «Үч күн мөөнөт берди эле, үчүнчү күнү бүттү. Таба албай бара жатабыз» деди."},{"t":"p","h":"Кедейдин кызы: «Эжекелер, мен дагы силерге кошулуп барайын»,— деди. Кыздар кошуп ээрчитип алышты."},{"t":"p","h":"Кан: «Табышмакты ким тапты?» – деп сурады."},{"t":"img","src":"data:image/webp;base64,UklGRqBpAABXRUJQVlA4IJRpAACwewKdASqAAsMBPrFMn0mnJKokLpSdgUAWCU2y1PwFXfexDQTlH9Tub3cmV9yvj+YHyT5w/wJR0Ejtvzjep7+rejf6WPV+4L+I35H2C9rr+f9iXDP6x4Ofjf/z6ReRP1vzO+m7/n46/Yf/Hwp+NT/p6o/o3/p9jvzy9MT+v0LH/r6YvzE//Z3gKDN1UpoHNVzGKgxy1BgRH5bskhD/7Jthy7i0PNFDx7b1qzfSF5UV7924qXngiA/+JCHsgNYkjVmOjpjozjlTejN5Uvf4LmVDJvkWUmU4hzdt+F8Hbh9vWUCX8qb7Q73Z0NTJ49Bx7vTqRmOVKSIb7Slt1JuakOnHikEuTQeFFCo0EYlzAvQph/NSsNcQqoXPorbTBe9OJ5N7vK8pDI7ds23UqfsqU9JTS+bsJ3/Y9VmV0gCHPqtnXE6JFZrX+uL+lPoRl42rpauTz/yecXONLU2JWhrqD2Vw8OJhZ/bOK+o5QplOHmZv7aIvCQen4ceqo9QhvAtMIn+pDawkgzCxZZfM4QbxKUjsOMCnwMU6GWz8XKyAYPPrJF8gOjL6lk8z+0yZUmzjN/qExyt8pnFKea4h/xbIKKIkd8135eSBo38omfGNa6fWYGKVEcN21Tn1SOkW3bmOBPUQXcUYm7EaHPeXr6u8SH/yaKYc1L8Yv4UtbX57RpM+6X9pqY5YvutJ1RXbmlly7CXQYk5kGRZ9ak5X6RBPmS4v4WacCY09y0e5+ а төрт эли ыраактык бар», – деди."},{"t":"p","h":"Кан табышмагын таптырып жиберип: «Эми бир ооз табышмак айтайын, ошо табышмакты тапкан кызды алам» – деп, табышмагын айтты: «Кордук деген эмне? Муңдук деген эмне? Зардык деген эмне»? Дагы үч күн мөөнөт берди. Кыздар үйлөрүнө барып, күндө эки маал келип, бири да табышмакты чече албай убара болуп кайтып жатышты. Үчүнчү күнү кан, таба албагандары үчүн кыздардын башын алмакчы болду. Ошондо мурунку табышмакты тапкан кедейдин кызы туруп: «Каным, сөзүңүзгө кулдук, табышмагыңызды <span class=\"pg\" data-n=\"15\">15<\/span>таба албай калган үчүн кыздарда эч айып жок. Баарыбыздын башыбызды алганы жатасыз. Ичибизден бирөө таап кетсе, бардык кыздар ажалдан калганы турат. Бирок ал кызды сиз чанганы турасыз»,— деди."},{"t":"p","h":"Кан: «Жок, сөзүм эки эмес, табышмакты туура тапкан кызды алам», – деди. Анда чолок этек кыз: «Эмесе мен таптым» деп чече баштады: «Кордук деген оору болот. Муңдук деген өлүм болот. Зардык деген жокчулук каным»,- деди."},{"t":"p","h":"Кан кыздын табышмакты тапканына ыраазы болуп, ал кызды жанына калтырып, калган кыздарды үйлөрүнө жиберди. Кыздар: «Ажалдан калдык», – деп сүйүнүшүп үйлөрүнө кайтышты. Кан кедейдин кызын жакшы кийиндирип, нике кыйдырып аялдыкка алып: «Эми ургаачы болсоң да, акылдуу экенсин, башка бирөөгө акыл үйрөтпө, акыл үйрөтүп койсоң, анда экөөбүз эрди-катын болбой калабыз», – деди."},{"t":"p","h":"айылдагы кыздарды чогултуп – собрал всех девушек аила."},{"t":"p","h":"нече күндүк жол – мында: какой протяженности путь, сколько дней понадобится. 1. Сумка ...... сом турат? 2. Дептер канча турат? ...... өмүрүң болсо түштүгүңө жорго мин (макал). ...... созулуп жатат."},{"t":"p","h":"жандырмагын жандырууга – отгадать загадку. Хан табышмактарын ...... ...... мөөнөт берди."},{"t":"p","h":"талаадан отун алып жүргөн – собирающая в поле хворост."},{"t":"p","h":"эки маал чубайсыңар – два раза в день проходите. Айылда мал ...... ...... эртең менен кечинде. ...... Мектепте ...... менен мелдеш өтүп турат."},{"t":"p","h":"байкуш дагы угуп калсын – пусть бедняжка тоже услышит. Бул ...... дагы ...... деп табышмакты айтышты. ...... кулак керек, учууга канат керек (макал). кошуп ээрчитип алышты – взяли с собой."},{"t":"p","h":"конуп-түнөп жүргөн күндү көрбөдүм – не видела остановившееся или заночевавшееся солнце. Жолго бир ...... келдик. Куш канаты менен учат, куйругу менен ...... ."},{"t":"p","h":"каш менен кабактын ортосундай – как между бровями и глазницами. Иранын ...... Калың, Фарухтун ...... бүркөө. Кырсык ...... ...... ...... ортосунда (макал). ыраактык бар – расстояние протяженностью."},{"t":"p","h":"кордук – оскорбление, муңдук – горесть, печаль, зардык – сильная нужда. ...... деген оору, ...... деген – өлүм, ...... деген – жокчулук."},{"t":"p","h":"убара болуп кайтып жатышты – возвращались ни с чем, без результата."},{"t":"p","h":"<span class=\"pg\" data-n=\"16\">16<\/span>башын алмакчы болду – хотел отрубить им головы. 1. Хан кыздардын ...... ...... ...... 2. ...... кийимин ...... учурашуу – салт."},{"t":"p","h":"кыздарда эч айып жок – девушки ни в чем не виноваты. Рамистин ...... ачылды. Ууру күч болсо ээси ...... жыгылат (макал)."},{"t":"p","h":"чанганы турасыз – хотите отвергнуть."},{"t":"p","h":"жанына калтырып, үйлөрүнө жиберди – (её) оставил у себя, (остальных) отпустил домой."},{"t":"p","h":"ургаачы болсоң да – хотя ты и женщина. ...... мыктысы, узун чачтын ыктуусу. («Манас» эпосунан.) бирөөгө акыл үйрөтпө – мында: никому не давай советов, не учи уму-разуму. эрди-катын болбой калабыз – не сможем стать мужем и женой, расстанемся."},{"t":"p","h":"Бир куну кандын бир жигити күнөөкөр болуп, айласы кетти. Айылдагылар: «Кандын аялына барып абалыңды түшүндүрсөң, акыл таап, ошол куткарат»,– дешти. Жигит кандын аялына муңканып келип: «Канга күнөөкөр болуп калдым», – деп акыл сурады."},{"t":"p","h":"Аялдын боору ооруп, жигитке акыл үйрөтүп: «Кимден үйрөндүң десе, мен экенимди айтпа», – деди. Жигит аялдын үйрөткөн акылы менен кутулуп кетет. Аны кан: «Ким үйрөттү, айткын, айтпасаң өлтүрөмүн», – дегенде коркконунан: «Сиздин аялыңыз айтты эле» – деп, чынын айтып берди. Кан аялына келип: «Убадабыз бар эле, мен ыраазы болоюн, сен мага ыраазы болгун. Аздыр-көптүр жолдош болуп бирге турдук, эми тактымды кой, таажымды кой, андан башка каалаганынды алып кет», – деди."},{"t":"p","h":"Аялы: «Жакшы болот, бул сөзүңүзгө ыракмат, мен бир тамак жасайын, бирге олтуруп ичели, андан соң кетейин», – деп, тамакты жедирип, канды мас кылып уктатып, тактысын, таажысын калтырып, эки аргымакты арабага коштуруп, канды арабага салып, даңгыр жол менен чан ызгытып, коңгуроону шарактатып алып жөнөйт. Бир маалда кан көзүн ачса, аялы жанында, өзү бир башка шаарда жүрөт. Кан чочуп кетип: «Ой мени эмне кыласың?» – десе, аялы: «Каным, сөзүңүз эки болбосун, тактымды кой, таажымды кой, башка каалаганынды ал дедиңиз, айткандарыңызды калтырдым, андан башка сүйгөнүм сиз экенсиз, сизди алып келдим», – деди."},{"t":"p","h":"Кан өзүнүн сөзүнө жыгылыштуу болуп, аялы менен бирге жашап калган экен."},{"t":"p","h":"<span class=\"pg\" data-n=\"17\">17<\/span>ошол куткарат – мында: она спасёт. Кандын аялы ...... . муңканып келип – мында: с жалостью просил. Женянын көзү муңайымдуу. Бала ...... ыйлады."},{"t":"p","h":"боору ооруп – пожалела. Аялдын (1) акыл үйрөтөт. Бакирдин (2) ооруканага жатты. чынын айтып берди – сказал правду. Кеп ...... бузулбайт (макал)."},{"t":"p","h":"аздыр-көптүр бирге турдук – мында: много ли, мало ли (но все же) вместе жили, были мужем и женой."},{"t":"v","l":["андан соң кетейин – после этого уйду.","даңгыр жол менен – по большой, (широкой и ровной) дороге.","коңгуроону шарактатып – мында: громко звеня колокольчиками.","сөзүңүз эки болбосун – мында: держите своё слово.","сүйгөнүм сиз экенсиз – мында: моя любовь – это Вы."]},{"t":"p","h":"сөзүнө жыгылыштуу болуп – признал свою ошибку, сдержал свое слово. Кан өз сөзүнө жыгылды. Бөбөк чалынып ......"},{"t":"p","h":"1. Кан үйлөнүү үчүн (чтобы жениться) кыздарга кандай шарт (какое условие) койду?"},{"t":"p","h":"2. Кедейдин кызы табышмактарды кантип жандырды (как отгадала)?"},{"t":"p","h":"3. Кандын аялы жигитке кантип жардам берди (как помогла)?"},{"t":"p","h":"4. Кан аялы менен эмне себептен (по какой причине) ажырашпай калды?"},{"t":"p","h":"1. Чыгарманы көркөм окуп чыккыла жана мазмунун айтып бергиле."},{"t":"p","h":"2. Жомоктордогу табышмактарды жана алардын жандырмактарын дептериңерге көчүрүп алып, жаттагыла."},{"t":"p","h":"3. Үйдөн жомоктун маанисине ылайык келген макалдарды (пословицы), накыл кептерди (мудрые слова) таап, аларды орус тилине которгула."},{"t":"p","h":"4. Төмөнкү сөздөрдүн антонимдерин (х) тапкыла:"},{"t":"p","h":"Үлгүсү: ыйла х күл, ...... өлүү, көтөрүү, арман, учат, адилдик, кембагал, ыйлоо."},{"t":"p","h":"5. Сөздөрдүн маанисин түшүндүргүлө:"},{"t":"p","h":"ордумду басар бала жок, көзүнүн тирүүсүндө, мөөнөт, төрт эли, эрди-катын, жыгылыштуу болуу, чаң ызгытып."},{"t":"img","src":"data:image/webp;base64,UklGRp4OAABXRUJQVlA4IJIOAABwYgCdASpIAaoAPrVSo0snJSOhq9M62OAWiWNu3V9ZLchKWPdm+CHg+kZQK9J2vnrn5C+YoSu0zaY4X6bnjgmKpeom4hfzvCMV0tljbLvUFikE6D0C8Hzr1zR7gwE1Ei/s+umR9/OsD2ua6N4AqKQACh6VDeCh9BWxZJ//qz1KMqw+u4MCM7Yfvb4Of4LMk6mKApVTOMD3XtFbiEec8AvFRbVNVsnb1TwfdphXuMM4BPQn9oBs2m47+0Y+DB7aUipCx5HbUoNaNyFhZl9fpdBMs+6N75te3OZFZY9iHIqgCziWfYgNYpAfx2XHy1vWvVqMg/5xcaSKcMsEXhHVTcwKZR3jphLvQZcBJE9FPYbE57RmZCcxp0ugFnKTytONNAnluOKQzHeEjombBnGlDtRzw7zCBB0kynQk4zwYUgVisV57iND68hdyuUUogan3pt2/FqByBCcXVEduLiwLg75BmC1jYU1f+gmZK70GBh1HF8PzAk+ROq9Pc4y7PciEffXPDewo9GTlecn1VKPIqk967Zg44Grb9jiPlsQsZfxTuftDv2187vPVMZSqFQdJOx3CpD9+HlSgMwu3UYgoCnSaCGwwY9hxDZagVvaVgiuA+f7eWdx7Dtkkk2ItWTFgLjZ4ClCIL/raxHKd0VX5nSrqg/JlL5ScLoYbWabQ1gsiI2Eo6sflYw6/D9Zt9564fnVBvWv8m4iHOWVn+fBOknjo2u9enP+i1XRu3QGAQd8kl2erMrOUNXrzg7LYfk8sc6Fcfu3NdaEOGA5XjQ2t2UXSr7EMpY7UhGe66TINintBkhTlpwdhcV+BZO8fk4NQE88fs9Bj81lIilH2lhFKyQflzAG7Dzs6Km2iOrTjwnRj1nYhDUBgrUo5dKlwITraX1NnA4scwl9rUkLGz6/UxWZ7ZxCdAZ5iuz4FHw2M/4Uby2GF8EnPFG1QkGHgoIXj+1MsX+QLIfqF8m8kF610xmhzn0wwMSmDYPf8mCwF/iANcTippFzwzvAs/C9s3x/9WghP  эстегиле, чыгармадан кошмок сөздөрдү тапкыла."},{"t":"p","h":"Маселен: ак шумкар, чор таман, ...... ."},{"t":"p","h":"<span class=\"pg\" data-n=\"18\">18<\/span>Эсиңерге түйүп алгыла!"},{"t":"p","h":"өлөрүм калды, өсөрүм калган жок, көз жумуу, артында бала калган жок, канат какпай аза күтүү, убада, үч ооз табышмак, мөөнөт, чор таман кедейдин чолок этек кызы, конуп-түнөп жүргөн күн, ажалдан калуу, күнөкөр."},{"t":"p","h":"Кан көтөрүү – (ист.) Провозгласить ханом, возвести на ханский трон."},{"t":"p","h":"По древнему обычаю народ сажал хана на белый войлок и трижды приподнимал."},{"t":"p","h":"Ак шумкар – кречет (кыргызские охотники различают шесть видов, байпактуу шумкар, күйкө шумкар – считается наиболее ценным, катуу бүркөр, кара шумкар, ак шумкар, ителги)."},{"t":"p","h":"Ак шумкар – белый кречет – особый, самый быстролетный вид среди этих птиц."},{"t":"p","h":"Аза күтүү – оплакивать умершего, быть в трауре."},{"t":"p","h":"Казына – сокровищница. Алтын, күмүш же ар кандай баалуу буюмдар, байлык, мүлк сакталуучу жай."},{"t":"p","h":"Төрт эли – (этн.) мера длины по ширине пальцев, длина в четыре пальца. Здесь между ухом и ртом длина четыре пальца."},{"t":"p","h":"Ургаачы – 1. живое существо женского пола. 2. разг. женщина в зависимости от возраста – девочка, девушка, молодая женщина, старуха."},{"t":"p","h":"Так – трон, престол, таажы – корона (царская)."},{"t":"p","h":"Аргымак – аргамак, породистая лошадь."},{"t":"p","h":"Араба – телега. Ат, өгүз ж.б. унаа күчтөрүн чегип жүк ташууга арналган эки же төрт дөңгөлөктүү унаа каражаты."},{"t":"p","h":"Коңгуроо – мында: колокольчик. Темирден конус сыяктуу формада жасалган, ички көңдөйүндө термелип кагып туруучу тили бар, шыңгыраган дабыш чыгаруучу буюм."},{"t":"h3","h":"МАКАЛДАР"},{"t":"p","h":"Аял жакшы – эр жакшы."},{"t":"p","h":"Өнөр алды – кызыл тил."},{"t":"p","h":"Тил таразасы – акыл. Турмуштун туткасы – аял. Жакшы аял – капкалуу шаар. Жаман аял – ичи толгон заар."}],"sub":[{"title":"II. Аялдын акылы","b":29},{"title":"Маселен: ак шумкар, чор таман, ...... .","b":78}],"pages":[12,18]},{"title":"БАЛА ӨЗҮНҮН ШААРЫН КАНТИП САКТАП КАЛДЫ","blocks":[{"t":"h2","h":"<span class=\"pg\" data-n=\"19\">19<\/span>БАЛА ӨЗҮНҮН ШААРЫН КАНТИП САКТАП КАЛДЫ"},{"t":"p","h":"Илгери-илгери аябай каардуу Алеке деген кан болгон экен. Бир күнү ал өзүнүн тынч турган коңшусуна кол салып, шаарын курчап алат да, эгер алар үч күндөн кийин багынышпаса, шаарды талкалай тургандыгын жарыялайт."},{"t":"p","h":"Ал шаар кичине болгондуктан андагы эл Алекенин сан жеткис колуна туруштук бере алгыдай эмес. Шаарда туруучулар курчоодон чыгып кете алышкан жок. Алар кечирим сурап, душманга багынып берүүдөн башка айлалары калбады."},{"t":"p","h":"Шаардагы аксакал, карыялардын бардыгы кеңешүүгө чогулушту. Шаардын багынгандыгын жана анда турган элге кечирим берүү жагын сурап келүү үчүн Алекеге элчи жиберүүнү чечишти. Салт боюнча элчиликке жашы улуу жана кадырлуу кишини жиберүү керек эле. Бирок отургандардын баары Алекенин каардуу жана канкор экендигин, жиберген элчини сөзсүз маскаралап, атүгүл өлтүрүп коёру белгилүү болгондуктан элчи болуп барууга эч ким батына алган жок. Мөөнөт күнү бүтүп калды, ал эми бара турган элчини дагы эле таба алышпады."},{"t":"p","h":"Күтпөгөн жерден аксакал карыялардын кеңешине бир жаш бала келип калып:"},{"t":"p","h":"– Алекеге мен барып сүйлөшөм. Мен андан коркпойм, – деди. Аксакал, карыялар баланы акылсыз дешип, жанынан кетүүсүн буйрушту. Бирок бала кетпестен, Алекеге жиберүүнү көшөрүп сурана берди."},{"t":"p","h":"Адегенде баары баланы шылдындап күлүштү. Анан аксакал карыялардын бирөө:"},{"t":"v","l":["бир күнү – однажды","кийин багынышпаса – если не подчинятся","туруучулар (жашоочулар) – жители, горожане","салт боюнча – по обычаю (по традиции)","атүгүл – более того","эч ким батына алган жок – никто не решился (не осмелился)","күтпөгөн жерден – неожиданно","жаш бала – мында: мальчик","көшөрүп сурана берди – настоятельно просил"]},{"t":"img","src":"data:image/webp;base64,UklGRixKAABXRUJQVlA4 .. ...... Мария кошунасына баш бакты. Чөнтөгүнө ...... ...... алып сүйлөшүү адепсиздик."},{"t":"p","h":"курчап алат – окружает. Шаарды ...... ...... . Боз үйдү курчоо менен ...... . талкалай тургандыгын жарыялайт – объявляет, что разгромит их. Ташты ... . Староста класска ...... айтты. Илинип ...... Ч.Айтматовдун сүрөтү."},{"t":"v","l":["чынында эле – мында: в самом деле","балким – бизге тийбес – может быть, нас не тронут","макул болушту – согласились"]},{"t":"p","h":"<span class=\"pg\" data-n=\"21\">21<\/span>шаар кичине болгондуктан – поскольку город был маленький. Мира Олядан ...... ...... катарда экинчи турат."},{"t":"p","h":"сан жеткис – неисчислимое, огромное количество. Алекенин аскерине ...... ...... Чогулгандарга санак жетпейт."},{"t":"p","h":"кечирим сурап – прося пощады."},{"t":"p","h":"айла (амал, акыл, арга) калбады – ничего не оставалось, не было другого выхода. ...... алтоо болсо, ...... жетөө (макал). Түлкүнүн ...... түгөндү. Сен ...... түгөттүң. кеңешүүгө – чтобы обсудить, чтобы посовещаться. Карыялар ...... чогулушту. ...... кескен бармак оорубайт (макал)."},{"t":"p","h":"элчи жиберүүнү чечишти – решили отправить посла (представителя). ...... өлүм жок (макал). Уурунун байланган колун ...... . жашы улуу жана кадырлуу киши – старейший и почитаемый человек. сөзсүз маскаралайт – обязательно унизит, оскорбит. Адамдарды ...... осол жорук. жанынан кетүүгө буйрушту – приказали, чтобы он убрался."},{"t":"v","l":["шылдыңдап күлүштү – высмеяли. Мен ...... . Сен ...... Сиз ...... . Ал ...... Биз ......","Силер ...... Сиздер ...... Алар ......","аксакал карыялардын бирөө – один из старейшин."]},{"t":"p","h":"талашып-тартышып – долго спорили. Минара улуулардан сөз ...... . Көкбөрүчүлөр улакты ...... алыска кетишти."},{"t":"v","l":["чоң төө жана карган теке – большой верблюд и старый козёл.","мындай суроосун укканда – услышав такую просьбу."]},{"t":"p","h":"Бирок бала:"},{"t":"p","h":"– Азыр элдин башына оор иш түшүп турган чакта күлгөндү токтоткула. Эмне кылып, эмне коёрумду өзүм билем. Менин сураганымды бергиле, – дейт."},{"t":"p","h":"Аксакал карыялар баланы чоң төөгө мингизишип, сакалдуу, карыган текени жетелетип, шаардан чыгарып жиберишет. Кандын алдына ушундай элчи келип турганына Алеке аң-таң калып:"},{"t":"p","h":"– Шаарыңарда эстүү баштуу карыялар же чоң киши калбай калганбы? – деп каарын төгөт."},{"t":"p","h":"Бала эч тайманбастан жайбаракат туруп:"},{"t":"p","h":"– Эгерде чоң десеңиз төө менен, сакалдуу десеңиз теке менен сүйлөшүңүз. Анткени, биздин шаарыбыздагы эң чоңу төө, эң сакалдуусу ушул теке. Ал эми кичине менен аңгемелешүүгө ыраазы болсоңуз, анда мени менен сүйлөшүңүз! – дейт."},{"t":"p","h":"күлгөндү токтоткула – прекратите смеяться"},{"t":"v","l":["сакалдуу – бородатый","аң-таң калып (таңгалып) – сильно удивился, изумился","каарын төгөт – разозлился"]},{"t":"p","h":"<span class=\"pg\" data-n=\"22\">22<\/span>Каардуу Алеке, бала буйдалбастан жооп бергенине күлүп:"},{"t":"p","h":"– Сен тайманбаган акылдуу бала экенсиң. Менден эмнени күтөсүң? Сенин сураганыңды берем, – дейт."},{"t":"p","h":"– Мен төөмдү соём, анын терисин ичке көктөй кылып тилип, улаштырам да, жерге айландырып коём, анын ичине канчалык жер сынса, ошону белек кылып берсеңиз болгону, – дейт бала. Алеке макул болот. Бала төөнү сойдуруп, терисин сыйрытып, эң ичке көктөй кылып тилдирет. Анан алардын учун улаштырып, шаарды айланта курчады. Тайманбаган акылдуу бала өз шаарын жоого чаптырбай, ушинтип аман сактап калган экен ..."},{"t":"v","l":["оор иш түшүп турганда – когда трудно.","мингизишип (мингизип) – посадили на (верблюда)."]},{"t":"p","h":"жетелетип (жетелөө) – вел на поводу. Баланы чоң төөгө ...... , карыган текени ...... шаардан чыгарып жиберишти."},{"t":"p","h":"эстүү-баштуу (акыл-эстүү) – рассудительный (-ая, -ое), разумный. Адилет ...... бала. Эл ичинде ...... карыялар көп."},{"t":"p","h":"эч тайманбастан жайбаракат туруп – смело и спокойно."},{"t":"p","h":"кичине менен аңгемелешүүгө ыраазы болсоңуз – (если) будете удовлетворены беседой с маленьким. Кан менен бала ...... ...... . Бирөөнү нааразы, бирөөнү ...... кылууга болбойт."},{"t":"p","h":"буйдалбастан жооп бергенине – мында: за рассудительный и быстрый ответ. ичке көктөй кылып тилем – разрежу на тонкие тесёмки."},{"t":"p","h":"анын ичине канчалык жер сынса – (если) сколько земли поместится в нее."},{"t":"p","h":"1. Алеке деген ким экен жана ага кандай сапаттар мүнөздүү? Ал коңшусунун шаарын (соседний город) эмне кылмакчы болду?"},{"t":"p","h":"2. Элди кыйын абалдан (из трудного положения) ким чыгарды? Элчиликке жөнөгөн бала өзү менен бирге (вместе с собой) эмнелерди ала кетти?"},{"t":"p","h":"3. Кичинекей балага таң калган (удивившегося) кандын суроосуна бала кандай жооп берди?"},{"t":"p","h":"4. Шаар кантип сакталып калды? Зордук (насилие) жана акылдуулук (разум) жөнүндө дагы кандай жомокторду билесиң?"},{"t":"v","l":["сураганыңды берем – дам все, что ты попросишь","улаштырам – соединю (друг с другом)","шаарды айланта курчады – опоясал весь город","өз шаарын жоого чаптырбай – не дал разрушить врагу свой город"]},{"t":"p","h":"<span class=\"pg\" data-n=\"23\">23<\/span>1. Чыгарманын көркөм мазмунун кыргыз тилинде өз сөзүңөр менен айтып бергиле."},{"t":"p","h":"2. Элдин, баланын жана кандын сөздөрүн ролдорго бөлүштүрүп окугула."},{"t":"p","h":"3. Жомокто көрсөтүлгөн зордук жана амалдуулук жөнүндөгү эпизоддорду тексттен таап, көркөм окуп бергиле."},{"t":"p","h":"4. Өз алдыңарча (самостоятельно) жомоктун планын түзгүлө жана план боюнча айтып берүүгө даярдангыла."},{"t":"v","l":["5. Кошмок сөздөрдү эстегиле, тексттен кошмок сөздөрдү тапкыла.","Өрнөк: талашып-тартышып, аң-таң, ......."]},{"t":"p","h":"6. Жомоктун текстинен төмөнкү сөздөр катышкан сүйлөмдөрдү (предложения со словами) тапкыла:"},{"t":"p","h":"жоокер, коңшусуна, курчоо, маскаралап, көтөрүп, тайманбаган, ичке, көк... Бул сөздөрдүн маанисин түшүндүрүп бергиле."},{"t":"p","h":"7. Орус тилине төмөнкү сөздөрдү которгула:"},{"t":"p","h":"жарыялайт, жашы улуу, адегенде, өзүм билем, тоо теке, оор иш, жайбаракат."}],"sub":[{"title":"1. Алеке деген ким экен жана ага кандай сапаттар мүнөздүү? Ал коңшусунун","b":42}],"pages":[19,23]},{"title":"МАКАЛДАР","blocks":[{"t":"h3","h":"МАКАЛДАР"},{"t":"v","l":["Акыл – жаштан, асыл – таштан.","Күч акылга баш иет.","Акыл деңизден терең, билим – тоодон бийик.","Булбул – гүлзарын сүйөт, адам – мекенин сүйөт."]},{"t":"p","h":" Канкор – 1. Кровожадный, жестокий хищник. 2. Молодец, храбрый герой – часто встречающийся эпитет богатыря Манаса."},{"t":"p","h":"Карыя – 1. Старик. 2. Старейшина. 3. Почтительное обращение к старому человеку."},{"t":"p","h":"Ичке көк – тонкие ремешки, тонкие кожаные тесёмки. Мисалы: керегени бириктирүү, чокойду ж. б. көктөө үчүн колдонула турган ичке тасма."}],"sub":[],"pages":[23,23]},{"title":"ТАБЫШМАКТАР","blocks":[{"t":"h3","h":"ТАБЫШМАКТАР"},{"t":"p","h":"Кыргыз элдик оозеки чыгармачылыгындагы кеңири тараган жанрлардын бири – табышмактар. Алар кара сөз же ыр түрүндө болот. Адамдын ийкем ой жүгүртүүсүн, тапкычтыгын билүүгө <span class=\"pg\" data-n=\"24\">24<\/span>мүмкүнчүлүк берет. Айрыкча балдарды өз алдынча ой жүгүртүүгө тарбиялоодо өтөгөн кызматы чоң. Кыргыз фольклорундагы эпостордо, жөө-жомоктордо каармандын акыл-эсин сыноо үчүн табышмактар пайдаланылган. Алардын мазмуну элдин турмушу менен тыгыз байланыштуу. Табышмактар учурда кроссворд, баш катырма, чайнворд, арифметикалык, сүрөттүү, шахматтык түрлөрү – ребус, анаграммалар пайда болду."},{"t":"p","h":"Табышмактарда эки же андан көп буюмдардын, жаратылыш көрүнүштөрүнүн жана башка нерселердин жалпылыктарын каймана түрдө элестетүү менен суроо берилет да, ал суроого жооп талап кылынат. Бул жагынан кыргыз жана орус табышмактарынын окшоштуктары бар. Бирок, табышмактардын мазмуну ар бир элдин турмуш шартынын бөтөнчөлүгүнө жараша болот."},{"t":"p","h":"Тий десем, тийбейт,"},{"t":"v","l":["Тийбе десем, тийет.","","Талаага таруу чачтым,","Талпылдап үйгө качтым.","","Койкоёт жел кайыктай,","Денесине суу жукпай,","Сууда сүзөт балыктай.","","тий десем – если скажу, коснись","тийбе десем – если скажу, не касайся","","таруу чачтым – рассыпал пшено","талпылдап – грузно, неуклюже","","койкоёт – стройно (изящно)","суу жукпай – не мокнет","сүзөт балыктай – плавает как рыба в воде","","кыдырата (кыдырекей) – вокруг"]},{"t":"p","h":"Кыдырата таш койдум, Кызыл өгүздү бош койдум. кызыл өгүздү бош койдум – свободно пустил красного вола"},{"t":"p","h":"Эртең менен төрт буттап басат,"},{"t":"v","l":["Түштө эки буттап басат,","Кечинде үч буттап басат.","","Жүгүрүп жетпес,","Жүгөн катпас.","","учурда – ныне","баш катырма – головоломка","жалпылыктарын – общность"]},{"t":"p","h":"төрт буттап басат – ходить на четырёх ногах, на четвереньках"},{"t":"v","l":["түштө – в полдень","","жүгүрүп жетпес – (если) бежать не добежать","жүгөн катпас – не обуздаемый","","суроого жооп талап кылынат – вопрос, требующий ответа","<span class=\"pg\" data-n=\"25\">25<\/span>Куш десең, куш эмес,","Бут десең, бут эмес","Куштай учат,","Буттуудай жүгүрөт,","Муну ким билет?","","Дүйнөдө эмне күлүк?","","Асты – таш, үстү – таш,","Ортосунда – бышкан аш.","","Суу атасы ким болот?","","Тептим терекке чыктым."]},{"t":"p","h":"Энеңдин синдисинин"},{"t":"v","l":["Жездеси сага ким болот?","куш эмес – не птица","бут десең – думаешь, что нога","","буттуудай жүгүрөт – бежит будто с ногами","","күлүк – скакун, быстрый","","асты – внизу, үстү – вверху","ортосунда – посередине","","суу атасы – мында: источник воды","","тептим – мында: опираясь (на что-либо)","","Энеңдин синдиси – младшая сестра матери","жезде – зять","","табышмактар – загадки. Сенин эмнени окуп жүргөнүң мага ...... ."]},{"t":"p","h":"билүүгө мүмкүнчүлүк берет – дает возможность узнать. Окуяны билүүгө ...... бериңиз."},{"t":"p","h":"өз алдынча ой жүгүртө билүүлөрүн – умение самостоятельно мыслить. Солтоной ...... ...... китеп окуп калды. Рашиддин ...... ...... жакшы. Шар, көркөм окуй ...... өзүнчө өнөр."},{"t":"v","l":["өтөгөн кызматы чоң – мында: выполняет большую функцию (роль).","акыл-эсин сыноо үчүн – для проверки ума, находчивости."]},{"t":"p","h":"пайдаланылган – использовался. Табышмактар ...... Көмүрдүн ордуна газ ...... . Ренат ...... адабияттар төмөнкүлөр."},{"t":"p","h":"тыгыз байланыштуу – тесно связано. Турмуш менен ...... ...... Чийбаркыт ...... кездеме. Чөптү ...... тапта."},{"t":"p","h":"буюмдардын, жаратылыш көрүнүштөрүнүн – мында: предметов, природных явлений."},{"t":"p","h":"каймана түрдө элестетүү менен – воспринимая иносказательно. Ира сөзүн ...... айтты. Цой эртең сынак болорун ...... ."},{"t":"p","h":"турмуш шартынын бөтөнчөлүгүнө жараша – в соответствии с особенностями жизненных условий."},{"t":"p","h":"жел кайыктай – как парусная лодка. Турмуш адамды ...... ...... айдайт. ...... жүрүп, ...... ылдамдады."},{"t":"p","h":"бышкан аш – готовая еда, пища. ...... ...... таштабайт (ырым)."},{"t":"p","h":"<span class=\"pg\" data-n=\"26\">26<\/span>1. Табышмак деген эмне экен? 2. Алар адамдагы кайсы жөндөмдөрдү өстүрөт (развивает способности)?"},{"t":"p","h":"3. Алар кандай ыкмада (способ) түзүлөт жана эмнени талап кылат?"},{"t":"p","h":"4. Азыркы кандай табышмактарды билесиңер?"},{"t":"p","h":"1. Берилген табышмактардын жандырмагын тапкыла. Алардагы суроолор менен жандырмактагы окшоштуктарды (аналогии) түшүндүрүп бергиле."},{"t":"p","h":"2. Өзүңөр билген (которые вы знаете) табышмактардан айтышып, «алуу-сатуу» оюнун ойногула."},{"t":"p","h":"3. Орус, англис жана башка тилдердеги табышмактардан кыргызчага которуп айткыла."},{"t":"v","l":["4. Кыргыз тилинде уйкаш сөздөрдү (имеющие рифмы) тапкыла.","Өрнөк: тий – тийбе, аш – таш, эже – жезде, ......."]}],"sub":[{"title":"Энеңдин синдисинин","b":10}],"pages":[24,26]},{"title":"ЖАҢЫЛМАЧТАР","blocks":[{"t":"h3","h":"ЖАҢЫЛМАЧТАР"},{"t":"p","h":"Кыргыз элинин жаңылмачтары илгертеден эле балдардын тилин жатыктырууда, сөз маданиятын көтөрүүдө, так жана шар сүйлөөгө көнүктүрүүдө, сөздөрдү ачык, кооз, уккулуктуу колдонууну калыптандырууда зор кызмат өтөп келген. Сөз байлыгы жарды, тили келегей балдарга анын жардам-таалими чоң. Жаңылмачтар дароо айтууга бир топ оордук келтирген сөз тизмектеринен турат. Мисал келтирели: Асманда эки айры куйрук. Бири ак, кыска куйруктуу айры куйрук, бири кара, кыска куйруктуу айры куйрук. Ак кыска куйруктуу айры куйрук, кара кыска куйруктуу айры куйруктун жолун тосот. Кара кыска куйруктуу айры куйрук, ак кыска куйруктуу айры куйруктун жолун тосот."},{"t":"v","l":["Ана арал, мына арал,","Мал аралды – марал араларбы.","Марал аралды мал араларбы?","","балдардын тилин жатыктырууда – в развитии речи детей","көнүктүрүү (жатыктыруу) – чтобы приучить (прививать навыки)","өтөп келген (өтөгөн) – служил (исполнял)","тили келегей – страдающий дефектом речи","таалими (таасири) – мында: воздействие, влияние","сөз тизмектеринен – из ряда слов","кыска куйруктуу – с коротким хвостом"]},{"t":"p","h":"<span class=\"pg\" data-n=\"27\">27<\/span>Беш кашка ирик, Бешөө беш башка ирик. башка – другой"},{"t":"p","h":"Жаңылмачтын өзүнүн көркөм айтуу ыкмасы бар жана оюн-күлкү чакыра турган жайдары жанр. Ал сөздөрдү бат, ылдам, буйдалбай, жаңылбай айтуу шартын коёт жана дүйнө таанымды кеңейтет. Анын орус элинин скороговоркалары менен өтөгөн кызматы окшош."},{"t":"p","h":"Кичине казан кырмычык, Кырып жедим тырмышып. Чоң казандан кырмычык,"},{"t":"v","l":["Тоё жедим тырмышып.","","Кара балапан,","Карап алакан.","Кайра акыят,","Карды кампайсын.","Кана, балапан,","Таруу, күрүчкө,","Толсун алакан.","Топ-топ чокулап,","Тойсун балапан.","","Жаныл айтты жаңылмач,","Жаңылмачы жаңылтпас.","Жамал айтты жаңылмач,","Жаңылмачын жан укпас.","кырып жедим тырмышып – ел усердно, выскабливая","тоё жедим – насытился (ась)","","балапан – птенец","алакан – ладонь","кайра акыят – смотрит жадно, не спуская глаз","карды (карыны, курсагы) кампайсын – пусть","брюхо наполнится (едой)","таруу, күрүчкө – пшеном, рисом","","чокулап – клевать","тойсун – насытится, наестся","","жаңылтпас – не дающий ошибиться"]},{"t":"p","h":"жаңылмачтар – скороговорки. ...... тилди жатыктырат. Жаңыл сөздөн жаңылбас."},{"t":"p","h":"илгертеден (байыртадан) – с давних пор (издавна). 1. Илгери болгон окуя. 2. Илгери жылып олтур."},{"t":"v","l":["сөз маданияты – культура речи.","","оюн-күлкү чакыра турган – вызывающий веселье, смех"]},{"t":"p","h":"<span class=\"pg\" data-n=\"28\">28<\/span>уккулуктуу колдонууну калыптандырууда – при формировании правильной красивой речи. Ырчы ...... ырдады."},{"t":"p","h":"сөз байлыгы жарды – мында: бедный (скудный) язык. Ксениянын ...... ...... ...... . Ал көп сүйлөбөйт."},{"t":"p","h":"оордук келтирген – затрудняющий, сложный, тяжелый. Жаңылмачтар айтууга ...... ...... сөздөрдөн турат. Бул ...... маселени Адилет гана чече алат. Жүк ташуу Сапарга ...... ...... ."},{"t":"v","l":["айры куйрук – мында: вид грифа ...... ...... айланып учат.","жолун тосот – преграждает путь.","көркөм айтуу ыкмасы – приёмы выразительной речи.","","1. Жаңылмачтар жөнүндө эмне билесиңер?","2. Бул жанр кебибизде кандай кызмат өтөйт?","3. Аларды айтуу менен адамдар кандай ыкмаларды өздөштүрүшөт?","4. Орус элиндеги кайсы жанр жаңылмачка окшош (похож)?"]},{"t":"p","h":"1. Жаңылмачтарды жаттагыла жана адашпай көркөм айтууга көнүккүлө."},{"t":"p","h":"2. Үйдөн тилге карата (жоон, ичке), эринге карата (эринчил, эринсиз), жаакка карата (кең, кууш) үндөшкөн жаңылмачтарды түзгүлө."},{"t":"p","h":"3. Тексттен үндөштүк мыйзамына (сингармонизм) жооп берген сөздөрдү таап жазгыла."}],"sub":[],"pages":[27,28]},{"title":"АПЫРТМАЛАР","blocks":[{"t":"h3","h":"АПЫРТМАЛАР"},{"t":"p","h":"Балдар үчүн эң кызыктуу жанрлардын бири апыртмалар. Мунун синоними – калптар. Анын максаты – адамдын сезимине көркөм элес калтыруу менен ой-жүгүртүүсүн, фантазиясын, кыял чабытын байытуу болуп эсептелет. Мында айтылгандардын бардыгы турмуштун чындыгына дал келбейт, бирок анын максаты калп айтууга үйрөтүү эмес. «Акылың болсо андап бил, эсиң болсо эптеп бил» деген накыл кептей калптан чындыкты айырмалоого, жалгандан туурасын ажыратып таанууга үйрөтөт."},{"t":"p","h":"Апыртманын өзүнө тиешелүү сүрөттөө ыкмасы жана каражаттары болот. Анын поэтикалык ажарын гипербола менен литота эң сонун ачып берет. Анда жанытма түрүндө берилген оң-терс <span class=\"pg\" data-n=\"29\">29<\/span>образдар дагы учурайт. Орус фольклорундагы небылица, побоскалар менен окшош келет. Үлгүлөрү:"},{"t":"p","h":"1. Өз атам туула электе, чоң атамдын жылкысын кайтардым. Тууй элек бээни саап, тиге элек сабага куюп, ичпей мас болдум."},{"t":"p","h":"2. Бир үч арык туруптур. Экөө кургак, бирөөнүн суусу жок. Үч арыкта үч балык бар экен. Экөө өлүк, бирөөнүн жаны жок. Кайырмаксыз кармап алып карасам, жүрөктөй үйдөн жүлүндөй түтүн чыгат. Барсам үч очок туруптур, бирөөнүн оту жок, экөө күйбөйт. Балыктарды табагы жок бышырып, жебей тоюп алдым."},{"t":"h3","h":"КООН"},{"t":"p","h":"Жайлоого чыгарда жалгыз атым бар эле. Жоор болду. Былтыркы коон айдаган жер бекен? Биле албадым. Балчыкты аттын жооруна сыйпадым. Атты жайлоого коё бердим. Эки жарым айдан кийин барсам, эки жагына эки коон бышып калыптыр. Көргөн сонунум ошол."},{"t":"p","h":"эң кызыктуу – очень интересный."},{"t":"p","h":"апыртмалар (калптар) – мында: небылицы. Мукарам ...... көркөм айтат. Шолпан, калп айтпа! Калптын казаны кайнабайт (макал)."},{"t":"p","h":"анын максаты – его цель. ...... ...... окуучулардын кыял чабытын байытуу. Максаттуу өмүр сүрүү адамдын парзы. Максат чынчыл жигит."},{"t":"p","h":"көркөм элес калтыруу менен – создавая художественное (образное) представление."},{"t":"p","h":"кыял чабытын байытат (кеңитет) – мында: обогащает художественное воображение, раздумье. Эркелейдин ...... алып учат. Китеп адамдын оюн ...... Сарт санаасы менен ...... (макал)."},{"t":"p","h":"дал келбейт – не совпадает. Иранын пикири Аликтикине дал келген жок. Эжесинин көйнөгү сиңдисине чак ...... ."},{"t":"v","l":["чындык – правда, калп (жалган) – ложь.","","учурайт – встречается","жаны жок – душа покинула тело (мертвый)","бирөөнүн оту жок – один из них не горит","жебей тоюп алдым (жебей тойдум) – не кушая, насытился","жоор – ссадина","балчык – грязь"]},{"t":"p","h":"<span class=\"pg\" data-n=\"30\">30<\/span>ажырата таанууга – (чтобы) различать. Жамандан жакшыны ...... ...... Урушкандарды...... Таанычы, ким келатат. «Манастаануу» сабагы өтүлдү. сүрөттөө ыкмасы – способы отражения (изображения), каражат – средство. Апыртманын сүрөттөө ыкмасы жана ...... бар."},{"t":"p","h":"поэтикалык ажарын – мында: его поэтическое изображение. Сөздүн ажары литота жана гипербола менен ачылат. Айыке ...... кыз. Ээн талаада кетип бараткан – Ажар."},{"t":"p","h":"эң сонун – замечательно, превосходно. Литота ...... ...... сүрөттөө каражаты. Сонун ата-эненин жалгыз кызы."},{"t":"p","h":"бээни саап – доить кобылу."},{"t":"p","h":"кургак – засохший, высохший. Эки арык ...... . ...... убада курсак тойгузбайт (макал)."},{"t":"p","h":"жүрөктөй үйдөн жүлүндөй түтүн чыгат – из крохотной юрты выходит тоненький дымок."},{"t":"p","h":"табагы (табасы) жок бышырдым – пожарил без посуды. Эти тургай ...... ...... (лакап). Самсаны табага ...... ."},{"t":"p","h":"жалгыз атым бар эле – была единственная лошадь. Үйдө Гани ...... турат. Менин ...... – Мансур. Сынару класста азыр эле ...... ......"},{"t":"p","h":"коон айдаган жер – место, где были посажены дыни. Эки ...... өсүптүр. Айдалган ...... түз экен. Айдаган машинасы бар. Жамаачы салынган ......"},{"t":"p","h":"бышып калыптыр – созрели. 1. Коон............ 2. Сабаны ... 3. Эт............ 4. Быш этип койбойт."},{"t":"v","l":["1. Апыртмаларга мүнөздөмө бергиле (охарактеризуйте).","2. Алардын максаты (цели) кандай?","3. Анын каражаттары кайсылар?","4. Алар кандай ыкмада түзүлөт?","","Берилген сөз тизмектерин толуктагыла:","Өз атам туула электе ......","жүрөктөй жерден"]},{"t":"p","h":"Үйдөн эл оозунда айтылган жана силер уккан апыртмалардан таап жазгыла. Өзүңөр апыртма түзүүгө аракеттенгиле."},{"t":"v","l":["Калптын казаны кайнабайт.","Калп ырыс кесет, кайгы өмүр кесет.","Калп айтып пайда таап – калаарсың уятка,","Чын айтып зыян таап – жетерсиң муратка."]},{"t":"p","h":"<span class=\"pg\" data-n=\"31\">31<\/span>Жүгөн – жылкынын башына катылуучу ооздук, сагалдырык, тизгин, чылбыр ж. б. бириккен кайыштан жасалган ат турманынын (шайманынын) бири."},{"t":"p","h":"Синди – младшая сестра, в отношении старшей сестры, но не брата. Жезде – зять, по отношению к всем родственникам и родичам жены, если они младшие."},{"t":"v","l":["Марал – важенка, самка оленя или марала.","Кашка ирик – трехлетний валух, с белой отметиной на лбу."]},{"t":"p","h":"Кырмычык – пригоревшие ко дну котла остатки пищи. Здесь имеются в виду остатки молока."},{"t":"p","h":"Саба – большой кожаный бурдюк, в котором готовят кумыс."},{"t":"p","h":"Очок (коломто) – место в юрте, где разводится огонь, очаг в юрте для приготовления пищи."},{"t":"p","h":"Адабият таануу."},{"t":"p","h":"Гипербола – (гр. апыртма сүрөттөө) – көркөм адабиятта, өзгөчө фольклордо чыгарманын каарманын, предметти адабияттан тышкары ашыра сүрөттөйт. Ал салыштыруунун апыртылган түрү."},{"t":"p","h":"Литота – (гр. жөнөкөйлүк) – сүрөттөлгөн нерсе көрүнүш, окуялардын кичирейтилип көрсөтүлүшү."},{"t":"h3","h":"ПЯТЬ УТОК"},{"t":"p","h":"– Расскажу я вам, как рыбу ловил: В речке быстрой бурлит волна, Шапкой воду я зацепил – Стала шапка рыбой полна!.."},{"t":"p","h":"А ребята смеются в ответ: – Ну-ка что-то ещё соври! Вон, смотри: «пять уток» летят,"},{"t":"img","src":"data:image/webp;base64,UklGRgI3AABXRUJQVlA4IPY2AAAQ2AGdASpYApYCPrVWpUwnJSutKNP6aaAWiWdu/qCuMqtWB11cFt11u3LTf6oEv4X/v/PJ8Z7L/yLUDf9LVH8w//Pqg6lngYYtHyA6fSjh0MXaUlNY6yY7wHLI22S2ui/2t1Uu0OOk5CW84DZ2+jtMse2fhoaWmd4ISFNpWCXcpxQG2HyX+fLjIvg6wkINDAo6yY7vw6jUcQGl4cUx/UtOsOqlBNUQ5mV7UocE726BCXip+IlK0eYRDRDI+CLu/0TKh6W4yoZi0hPbksbFKayEHleLMXYraHxkAyyjZLziY27yxsdQPRDeOZLa6Ick8t22h3pov+slDHeahhn+3gjK6DjmkuBbdX6YEZ5w9UQn/ts/txILPTF2GeQ8n0JIq2R7MjoLRVCxKXzywD/wVWwpWyBrfiZgwo6zczAJjKbfFL0gCX/DIleZI5oQPPugl1b/yMCJsN1opbZfVWEG8Acyd5z0zfMWUWg0gutJMnbnZ2rH1oCuHSW1weX6ubyUE8b0o+xge+9M/PU+Qg6mLL11KKNjNn9Nsw3kHjmJSsOATteRm5hPhk71PtLS8EmEDgmmh01Io96SfVOo9gNpnnVoYwE6ZM5oeRCCOeAzUw9wxjOBtsKlbHY

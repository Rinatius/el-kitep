зчу, чоорчу, айтыштын устаты деп да бөлүштүрүшкөн."},{"t":"p","h":"экинчи чоң бөлүм – вторая большая часть"},{"t":"v","l":["төкмө акын(дар) – акын(ы) импровизатор(ы)","ошондой эле (ошону менен бирге) – а также, вместе с тем, к тому же","тажрыйбалуу – опытные"]},{"t":"p","h":"өсүп келе жаткан талапкерлерге – мында: развивающему свой талант претенденту акын боло алышкан эмес – не могли стать акынами чыгармачылык дараметине – мында: творческому потенциалу <span class=\"pg\" data-n=\"33\">33<\/span>"},{"t":"p","h":"Акындардын чыгармачылыгы XX кылымдын башындагы Октябрь революциясынан кийин изилдене баштаган жана чыгармалары жыйналып, жарыкка чыгып, окуу мекемелеринде, бала бакча, жогорку окуу жайларында окутула баштаган. Азыр алардын чыгармачылыктары ар тараптан изилденүүдө."},{"t":"p","h":"Учурда алардын калтырган чыгармалары улуттук көркөм сөз өнөрүндө баа жеткис салмакка ээ. Анткени алардын ыр, дастан, айтыш, кошок, жомоктору жана насаат, үлгү, санат ырлары, балдарга арналган чыгармалары кыргыз адабиятын көркөмдүк, мазмундук жактардан байытты."},{"t":"p","h":"акындар чыгармачылыгы (поэзиясы) – акынская поэзия."},{"t":"p","h":"жоруктары менен боор эзе күлдүргөн (фраз.) – своим комическим поведением вызывали смех (хохот)."},{"t":"p","h":"муундан муунга – из поколения в поколение."},{"t":"p","h":"акындык өнөрдү улантып – продолжая акынское мастерство. Байыштын өнөрү – ...... ...... . Өнөрлүү өлбөйт (макал). Ишти ...... керек."},{"t":"p","h":"акындык салымы – творческий вклад. Адабиятты муундан муунга өткөрүп келүүдө ...... ...... өтө жогору."},{"t":"p","h":"устаттык жана шакирттик салт – традиция наставничества. Токтогул ...... ...... , Алымкул, Калыктар ага ...... ...... болушкан."},{"t":"p","h":"инсандык беделине – авторитету личности, личностным возможностям. бааланышкан – оценивались. Акындар ...... ...... карата ...... . Элде ...... жок киши ...... боло албайт."},{"t":"p","h":"ар тараптан изилденүүдө – исследуется со всех сторон."},{"t":"p","h":"улуттук көркөм сөз өнөрү – национальное, художественное, словесное, искусство. Улуттук ...... ...... . Көркөм ...... ...... . Сөз ...... ...... . Өнөр ...... ...... . баа жеткис салмакка – неоценимый вклад. Алардын чыгармачылыктары ...... ...... ...... ээ. Балдар, силерди өстүрүүдө ата-энеңердин эмгектери баа жеткис. Саламат салмактуу бала."},{"t":"v","l":["жамакчы – певец, поэт","жыйналып, жарыкка чыгып – собраны, изданы","окуу мекемелери – учебные заведения"]},{"t":"p","h":"<span class=\"pg\" data-n=\"34\">34<\/span>алардын калтырган – оставленный ими."},{"t":"p","h":"көркөмдүк, мазмундук жактан байытты – обогатил и в художественном, и в содержательном плане."},{"t":"p","h":"1. Акындар чыгармачылыгы профессионал поэзиядан айырмаланабы, түшүндүрүп бер?"},{"t":"p","h":"2. Ал кандай бөлүмдөрдөн турат жана өкүлдөрү (представители) кимдер?"},{"t":"p","h":"3. Устат жана шакирт деген кимдер? Силер да устат жана шакирт акындарды билесиңерби?"},{"t":"p","h":"4. Акындар талантына карата кандай бөлүнүшөт?"},{"t":"p","h":"5. Акындардын чыгармачылыгы көркөм адабиятта (в художественной литературе) кандай роль ойнойт?"},{"t":"p","h":"1. Көп чекиттин ордуна туура келген мүчөнү улап, сүйлөм түзгүлө."},{"t":"p","h":"Көптөгөн жылдар бою эл эс ...... кал ...... окуя, көрүнүштөрдү ыр ...... тил ...... салып поэзия жаратышкан. Аларда эл ...... тарыхы, көз караш ......, кайгы-муң......, тагдыры, күрөшү чагылдырылган. Ыр ...... жаратып, сак......., өнүк ...... келген адамдарды акын ...... деп аташкан."},{"t":"p","h":"2. Төмөнкү сөздөргө ылайык келген (соответствующий) суроолорду коюп, аларды катыштырып сүйлөм түзгүлө:"},{"t":"p","h":"акын, жаралган, көркөм сөз, төңкөрүштөн кийин, ыр айтуунун ыкмалары, себеби, маани-мазмунуна жараша, ...."},{"t":"p","h":"3. Үйдөн силер жашаган аймакта (в регионе) (шаарда, айылда) кайсы акындар жашап өтүшкөнүн (проживали) эске түшүргүлө жана аларды урматтап (в знак уважения) кандай иштер аткарылууда (эстелик тургузулдубу ж. б.) байкоо жүргүзгүлө."},{"t":"p","h":"4. Жаттап алгыла:"},{"t":"p","h":"Акындар элдин булбулу, Акындар элдин дулдулу, Ачыгын айтып үндөгөн, Азамат элдин бир уулу, Эл кадырын билбеген, Эл сынына толо албайт, Элдир-селдир сүйлөгөн, Элге ырчы боло албайт."},{"t":"p","h":"Эшмамбет"},{"t":"v","l":["элдин булбулу – соловей народа","дулдулу – мында: народный талант","ачыгын айтып – говоря правду"]},{"t":"p","h":"эл кадырын билбеген – не уважающий (недооценивающий) свой народ сынына толо албайт – не может быть воспринят народом элдир-селдир сүйлөгөн – говорящий невнятно, без логики и системы"},{"t":"p","h":"<span class=\"pg\" data-n=\"35\">35<\/span> Куудулдар – комики-имитаторы. Ар кандай сатиралык чыгармаларды көрсөтүп, элди күлдүрүүчү кеп-сөздөрү, жорук-жосуну, жүрүш-турушу күлкүлүү өнөрпоз адамдар."},{"t":"v","l":["Кара жаак ырчы – (фр.) выдающийся певец.","Комузчу – комузист: музыкант, играющий на комузе."]},{"t":"p","h":"Чоорчу – дударист: музыкант, играющий на свирели, которая делается из пустотелого стебля."},{"t":"p","h":"Айтыш (лит.) – поэтическое состязание акынов-импровизаторов или народных мудрецов."},{"t":"p","h":"Кошок (этн.) – заплачка, причёт. Оплакивание в поэтической форме умершего или плач-причитание невесты, когда её провожают в аул жениха. Их часто исполняли акыны, в творчестве которых они сохранились до наших дней."},{"t":"p","h":"Насаат, үлгү, санат ырлары (лит.) – стихи дидактического характера содержания. Например, насаат (насыят) -поучение, санат (мудрое изречение), үлгү – пример, образец – литературные песни, состоящие из рифмованных афоризмов, поговорок и т. д."}],"sub":[{"title":"Элге ырчы боло албайт.","b":37}],"pages":[32,35]},{"title":"ТОКТОГУЛ САТЫЛГАНОВ","blocks":[{"t":"h3","h":"ТОКТОГУЛ САТЫЛГАНОВ"},{"t":"p","h":"(1864–1933)"},{"t":"p","h":"Токтогул – кыргыздардын улуу демократ акыны. Ал XIX кылымдын акырынан XX кылымдын отузунчу жылдарына чейин жашаган. Таланттуу акын көп ыр-күү, обондорду жараткан. Акындын «Тогуз кайрык», «Миң кыял», «Кербез» ж. б. классикалык күүлөрү, «Кедейкан», «Курманбек» ж. б. дастандары бар. Ошондой эле Коргол, Калык, Алымкул өндүү көп жаш акындарга устат болгон. Шакирттерине акындык, комузчулук өнөрдүн сырын үйрөткөн."},{"t":"img","src":"data:image/webp;base64,UklGRvAPAABXRUJQVlA4IOQPAACwfACdASoTAYcBPrVSpEunKKunq9bKCXAWiWUFmWfeYarWx/HNNz7RhlwmxxFlaMuKJMxdn2vjuENMKxs1JRBrHEDQms6/FMTNLlUxc+0/T8HdLN/lAy48O7UG3/7Pff/z/AQv4kM/4jBwNEqIbDrg41V68QTLsl4ZBmJpRlfZqYH2/FwpH36iilvVmD+u2lZt1nlLT1mJXVrb6auRIWo/NbNLVHFqVsiZG+awMQSXIiJUkWNvBY+vUhf1rA8BzQsDR7M0AUEKBy44pD3BDl2BoV/eOzhCR9pOUVLugq5uEIA2gtj1i5D2kGnIrknj26sLNA0RwMPzCpcjh9ghQJ8QUxjU3tsFJHl8jD4l3BKBz/zsVUOGrz6c9o6+bOmbnbNElaJgI48+maXsGTD7jMog8CBDPRBhAQS9S3nBVRouUFBJO9wqhYvyU47grOGVJKzZvKJJ74sGiE2b/V+OLTtDJN2UCsXOzGjtFmv2feZRgJ9wHSdqD83f5Mpr+bT7Qf/xp7gVSt5ARsUyi61z7ERIoyWJxdK04aG9TCSGSQA0wzKVrBBF0n5vatweWPwwzEJU9cOO79ISkRTXSmQ9sWZULo4pmf1ltO79uT9nzkGG1zbGSUFkYVstSf6g8Lr1senllUV4EFQiw77a7huQmypIEnlwn6O12Khks0oAOvbiwsoJ7qcNc1BqyiKeMQLr7/B1EuE700UoY5j5aaCHUR9WgX1JiToZeS/TB3FzAIY7AmrlFRD736A/xuuZa+MgAzsA7OF+ohjYem5Lx9KEg90dl3MPrMj0q3U2UQLDQC0myEP1fHeshVxMnwfzRyXPe4FkUt3IZWuTjTOOWpHRjbLkdhlfLiTwOk/S2L5q4jaUYc2ktMhD50pvpc8vywpcw3K1iqSioDKYoAlB7K+18L+yW9qoySYTzdCntYsQLRG6q0WJ1aEqaz8EXcep9wI21C8RJeVQ8ZxOnTzMAnhm7Vq4f5J/9fw8DSjMV4LeLMSQoGJMCBGAKk5aIAUT3epCBCZ9gDcIgw8LQATOrSBreVVq4SHmnmPKY+Ctfy4P/3v2+Wy4ZF1eUrOeZUMqbSg0oi1zuZcRAG23sa+QYvZBqwxMG/+bX11FtSzSJl0iSx25R5M1D37g01Pe//i9xstWq77Fw3HF70n3NtnjKyBoiEDXyYcmt/S9cukA1mSjDU1wZc6yap67ZMb5oO/Zfbd9OCLVkADV/36R33sUg9h63Wp0TmA6ipLV4zHEKdM4XlCnPbw57w8VtFIEkoLxT4w3CzB9rYfL9oJaHS9pV5PH0vKnttgHpg5xFXOUG19hCoYsuWHAAkEugO9E3zTTIF0AAP76EGftVv8cbcT4XbHxaa1WS8oyyourYUzXnY5Wzi8ecT20eGRQSFba33HiCJR+tSo0mM+sJCJjdgQhgTR/+7mcZ/nEyH5R3bbqwP6ALqZcZyj8cGG1we0k0tK/aFIRpfMwEXxIlxd+6wTMjW2qQCLAAa/uSb2wLo2oGn7n9IhYixPFpFdEDJjH1v1xBHvgbCyIMN6KlAX0yOpSxgHjBhYpBRkuPK2z0kPXMJMzBWSBwXrAsJIsobH6SMw9Scyuh+41Gjf2q9txneB78Bd/Ro/aDPeZgHLhA7GeDC2WQTzyPEnxQPueMXvNv3BXHhW9T6Hk0qZ4a+h+deYUWpz69aHKroQMNG5hMQs0ModCUQOerNawOIfmZ3lKIvD9sp86iLQOVFqPU2O1dHF3wg0QudDXXNksJnZXRHUJt3OwZlo5R g\" data-n=\"36\">36<\/span>Бул жомогунда Торгойдун, Турумтайдын жана койчунун көрсөтүлгөн образдары аркылуу турмушта алдуусу алсызына зордук көрсөткөн калыссыздыкты сүрөттөйт. Чөлдүн торгою бөлөк торгойлорду жеңгени менен, зордукчул Турумтайга жем боло жаздайт. Аны адам куткарып калат."},{"t":"p","h":"отузунчу жылдарына чейин – до тридцатых годов."},{"t":"p","h":"ыр-күү, обондорду жараткан (чыгарган) – создавал песни, мелодии. Гүлчехра ...... айтты. Нияз ...... чертти. Ч. Айтматов «Жамийла» повестине алгач «......» деген ат койгон."},{"t":"p","h":"устат, шакирт, комузчу, өнөр – мастер, ученик, комузист, мастерство. байларды сындагандыгы үчүн – за то, что критиковал богатых. Балдар, сынчыл ой жүгүртүүгө үйрөнгүлө. Уулум, чоңоюп сынга тол."},{"t":"p","h":"адилеттүү турмушту үндөгөндүгү үчүн – за то, что воспевал справедливую жизнь."},{"t":"p","h":"Ал кезде ...... өкүм сүргөн. Элдер дайым ...... ...... умтулуп келишет. Айрым куштар үндөккө көнүшөт."},{"t":"p","h":"сүргүн – ссылка, гонение. Токтогулду Сибирге ...... айдашты. Ал мезгилде кара куугун, сары .......... көп болгон."},{"t":"p","h":"алдуусу алсызына – сильный на слабого. ...... ...... зордук көрсөткөн."},{"t":"p","h":"калыссыздыкты сүрөттөйт – изображает несправедливость. Сот ...... эмес чечим чыгарды. Омар менен Биллди элдештирүүдө Володя ...... кылды. жем боло жаздайт (фр.) – чуть было не стал пищей для хищника (букв.)."},{"t":"p","h":"1. Т. Сатылганов жөнүндө баяндаган (повествующий) искусство чыгармаларынан таап окуп, мазмунун айтып бергиле."},{"t":"p","h":"2. Акындын ырларынан жаттагыла (выучите наизусть) жана көркөм айткыла."},{"t":"p","h":"3. Төмөнкү сөздөрдүн синонимдерин (=) жана антонимдерин (х) тапкыла:"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Обон = <\/td><td>алдуу = <\/td><td>улуу х<\/td><td>көп х<\/td><\/tr><tr><td>Бөлөк = <\/td><td>зордук = <\/td><td>кеңири х<\/td><td>куткар х<\/td><\/tr><tr><td>Ыр = <\/td><td>өңдүү = <\/td><td>чейин х<\/td><td>жаш х<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"образдары аркылуу – через образы"},{"t":"v","l":["зордук (зомбулук) – насилие, принуждение","куткарат – освобождает","<span class=\"pg\" data-n=\"37\">37<\/span>4. Ырды көркөм окуп чыгып, маанисин чечмелегиле:","","Үйрөнүүгө өнөрүн,","Өмүрүмдү арнадым,","Бак-таалайым бар экен,","Аркасы менен Токомдун,","Мен бүгүн акын деген","сандамын.","Током манапка каршы","Улугу болчу акындын.","Көмгөн менен дат баспас,","Тунугу болчу акындын.","Коргол Досуев","","арнадым – посвятил","","аркасы менен – благодаря","акын деген сандамын – считаюсь акыном","или считаются со мной как с акыном"]},{"t":"p","h":"улугу болчу акындын – мында: был путеводителем акынов."},{"t":"v","l":["дат баспас – нержавеющий","тунугу болчу – был прозрачным"]},{"t":"p","h":"Эсиңерге түйүп алгыла!"},{"t":"p","h":"1. Токтогулдун өмүрү, чыгармачылыгы боюнча көптөгөн искусство чыгармалары жаралган. Маселен, Ж. Бөкөнбаев «Токтогул», Т. Абдумомунов «Сүйүү жана үмүт», Т. Касымбеков «Алымкан» драмаларын жазышкан. 1974-жылы Г. Айтиев, А. Исаевдер Токтогулдун эстелигин жаратышкан. Режиссёр В. Немоляев 1960-жылы «Токтогул» даректүү фильмин тарткан."},{"t":"p","h":"2. «Эл ичи – алтын бешик»."}],"sub":[],"pages":[36,37]},{"title":"ТУРУМТАЙ МЕНЕН ТОРГОЙ","blocks":[{"t":"h3","h":"ТУРУМТАЙ МЕНЕН ТОРГОЙ"},{"t":"p","h":"(Дербник и Жаворонок) Тоонун торгою, бөксөнүн торгою, чөлдүн торгою үчөө кимибиз кыйынбыз деп мелдеше кетишет. Тоо жеринин кары кетелек маалы. Бөксө жерлери да ала-шалбырт болуп, жака жерлеринин кары кетип, күн ысып, чөп чыгып гүлдөр ачылып калган кези эле. Ошондо тоонун торгою көкөлөп уча албай, жерге түшө албай жеңилди. ' бак (бакыт) – таалайым – счастье моё"},{"t":"v","l":["* кимибиз кыйынбыз – кто из нас лучше","3 гүлдөр ачылып калган кези – время, когда раскрылись цветы"]},{"t":"img","src":"data:image/webp;base64,UklGRrhbAABXRUJQVlA4IKxbAABQTgKdASqAAqQBPrVMoUonJCqmq9O9QVAWiWNt2bV2bqDwig0jA5xzwtr5bk0xuG87trrevUSy8+7sKn/JoObNBwi8SHx7sN7aX9D7R2Jv33sxP9/VJ3N/n/3+cuy1zvs/vrzNfe32N/Pnu3OhZ/+PS/+U/+ та бошот – отпусти обратно","карынынды (курсагынды) – твой желудок","бир кудай – мында: господь бог","","бетегенин түбүнө – мында: под ковылем,","овсяницей, типчаком (травой)","безбелдек – стрепет"]},{"t":"p","h":"Беш балам жетим калбасын, жетим калбасын – чтоб не осиротели Карагандын түбүнө,"},{"t":"v","l":["Кашкалдак уя салбасын,","Кагылайын Турумтай","Төрт балам жетим калбасын,","Бөпө Турумтай,","Күкү Турумтай."]},{"t":"p","h":"карагандын түбүнө – под желтой акацией, под кустарником кашкалдак – лысуха кагылайын (жалынуу) – миленький мой"},{"t":"p","h":"Байкуш Торгой Турумтайга ушинтип жалынып жатты. Турумтай Торгойдун төш этинен бир сугунуп, эки чеңгелдеп мыткып койду. Өлөр-өлбөс жаны менен, аз калган алы менен көзү антарылып, оозун ачып, дагы эле Турумтайга жалынып жатат. Жанында кой кайтарган койчу Турумтай Торгойду алганын көрүп калган экен. Ажыратып жиберейин деп жүгүрүп жетип, таяк менен урду эле Турумтай уча качты."},{"t":"p","h":"Ошондо дале көзүн акшындатып, Торгой жалынып жатат. Эс ала түшүп, койчуну көрө коюп, ал дагы уча качты. Үстүндө айланып турган Турумтай баягы Торгойду кууп жөнөдү. Чоң чокойу менен талпаңдап койчу да жөнөдү. Торгой койчуга пааналап, Турумтайдан аман калды. Анан койчуга минтип ырахмат айтты. 'бошот курутпай – освободи; не изводи меня"},{"t":"v","l":["* ушинтип – мында: так (таким образом)","5 өлөр-өлбөс жаны менен – с полуживой душой","‘ кой кайтарган койчу – пастух, пасущий овец","° көрүп калган экен (көрүп калыптыр) – оказывается, увидел зерна","© таяк менен урду эле – ударил палкой","’ эс ала түшүп – мында: придя в себя, отдохнув","* баягы – того (тот)"]},{"t":"p","h":"* чоң чокою менен талпаңдап – неуклюже двигаясь в своих больших валенках"},{"t":"v","l":["<span class=\"pg\" data-n=\"41\">41<\/span>Тумшугунан кан тамган,","Турумтайга тутулдум.","Тытып ийер кезинде,","Тырмагынан кутулдум.","Алым келбей алсырап,","Ач каракка тутулдум.","Апа-супа кыларда,","Алкымынан кутулдум.","Койчу келип куткарды,","Куу Турумтай жээрде.","Чоң ырахмат айтамын.","Койчу, малчы дегенге.","Айланайын, оо койчу,","Куу Турумтай ачка өлсүн,","Курсак чындап сен тойчу.","Кагылайын ээ койчу","Кас Турумтай ачка өлсүн,"]},{"t":"p","h":"тумшугунан кан тамган – мында: кровожадный хищник"},{"t":"v","l":["тутулдум (кармалдым) – я попал в плен,","поймался","","алсырап – мында: обессилел, ослаб","ач каракка (ач каракчыга) – мында:","голодному грабителю","апа-супа кыларда – мында: өлтүрөрдө","(жеп коёрдо) – когда он хотел съесть","","куткарды – спас","","ачка өлсүн – пусть умрет от голода","сен тойчу (тойгун) – насытись","","кас – враг"]},{"t":"p","h":"Кардынды чындап сен тойчу. кардынды (курсагынды) – твой желудок Бала-бакыраң көп болсун,"},{"t":"v","l":["Баарынын боосу бек болсун,","Узун өмүр көп жашап,","бала-бакыран – твои дети","","узун өмүр – долголетие","Корооңо сансыз мал толсун! корооңо – в твой загон"]},{"t":"p","h":"сансыз мал толсун – заполнится бесчисленным скотом"},{"t":"p","h":"Ушинтип байкуш Торгой койчуну алкап, Турумтайды каргап, ажалдан аман калган экен."},{"t":"p","h":"илип кетти – зацепил. Турумтай зып этип ...... ....... Жакшы жүрүп көзгө – илин. жалынып жатты (жалынды) – умолял. Торгой ............. Эне баласына ....... төш этинен бир сугунуп (сугунду) – вырвал мясо из груди. Мансурдун ............ ооруду. Андрей торттон чоң ...... . эки чеңгелдеп мыткып койду – схватил (сдавил) ногтями."},{"t":"p","h":"көзү антарылып, оозун ачып – выпячил глаза, раскрыл (разинул) рот. Кемалдын таңгалгандан ...... ......"},{"t":"p","h":"' тытып ийер (жиберер) – чуть не разорвал <span class=\"pg\" data-n=\"42\">42<\/span>ажыратып жиберейин деп – мында: захотел разлучить их. Торгойду ...... калды. Чатышкан түйүндү сен гана .........."},{"t":"p","h":"дале (дагы эле) көзүн акшындатып (акшырайтып) – все еще выпячивая глаза. Торгой корккондон ......... Кемпир жаман көрүп ....... .......... үстүндө айланып турган – кружился над головой. Турумтай ...... ...... ...... . Кирилл тамдын ...... турат. Азыр евро акчасы ...... жатат."},{"t":"p","h":"койчуга пааналап – мында: нашел убежище у пастуха. Койчуга ...... – Серик, үйгө пааналайсыңбы, деги!?"},{"t":"p","h":"алкап, каргап – благославлял, проклинал."}],"sub":[],"pages":[38,42]},{"title":"АДАБИЯТ ТЕОРИЯСЫНАН","blocks":[{"t":"h3","h":"АДАБИЯТ ТЕОРИЯСЫНАН"},{"t":"h3","h":"АДАБИЙ ЖОМОК ЖӨНҮНДӨ ТҮШҮНҮК"},{"t":"p","h":"Фольклордо жомоктор эл тарабынан чыгарылган болсо, адабий жомоктор конкреттүү авторлор тарабынан жазылат. Адабий жомокторду жазуучулар элдик жомоктордун негизинде, аларды кайрадан иштеп чыгуу менен жаратышат же өздөрү ойдон чыгарышат. Алар ыр же кара сөз түрүндө болот. Адабий жомоктор элдик жомоктордун өзөк идеясын, сапаттарын сактайт. Бул жанрдагы чыгармаларды дүйнөгө белгилүү Х. К. Андерсен, Ш. Перро, А. С. Пушкин жана башкалар чыгарышкан. Адабий жомокторду кыргыз элинин белгилүү акын, жазуучулары Т. Сатылганов, Тоголок Молдо, Т. Үмөталиев, Ч. Айтматовдор да жаратышкан."},{"t":"v","l":["эл тарабынан – из народа.","адабий жомоктор – литературные сказки."]},{"t":"p","h":"элдик жомоктордун негизинде – на основе народных сказок, Адабий ...... ...... жомоктордун ...... алынат."},{"t":"p","h":"кайрадан иштеп чыгуу менен – мында: с переработкой (обработкой). Мен ишти алып келдим. Сен аны ...... бердиң. Снежана аны окуп ......."},{"t":"p","h":"өзөк идея (негизги ой) – (главная) основная идея. Чыгармада ............ болот."},{"t":"p","h":"Русландын өзөгү карарды. Жаранын ...... табуу керек."},{"t":"v","l":["белгилүү – (известный) знаменитый.","","1. Кайсы чымчыктар (какие птицы) эмне деп мелдешишти?","2. Бул учур кайсы мезгил эле?"]},{"t":"p","h":"3. Чөлдүн торгою эмне үчүн женди жана эмне деп мактанды (похвастался)?"},{"t":"p","h":"<span class=\"pg\" data-n=\"43\">43<\/span>4. Турумтайдын колуна түшкөндө (когда попался) эмне деп жалынды?"},{"t":"p","h":"5. Аны өлүмдөн ким алып калды (кто его спас от смерти)?"},{"t":"p","h":"6. Чыгармада Торгой, Турумтай жана койчунун иш-аракеттери аркылуу (через действия) кандай ойлор айтылат?"},{"t":"p","h":"1. Төмөнкү зат атоочторду жөндөгүлө: торгой, бөксө, жаны, таяк, 2. Салыштырып маанилерин чечмелегиле: унчуккун-тынчыткын, эңдим-жеңдим, жыктым-чыктым, айланайын-кагылайын, алкап-каргап,... Өзүңөр да уйкаш сөздөрдү тапкыла."},{"t":"p","h":"3. Чыгарманы окуп чыгып, мазмунун айтып бергиле."},{"t":"p","h":"4. Торгойдун кайрылууларын (обращения) (Торгойлорго, Турумтайга, койчуга) жаттап, көркөм айтып бергиле."},{"t":"v","l":["5. Тексттен кошмок сөздөрдү тапкыла.","Үлгүсү: ала шалбырт, төш эти, ач карак, ......"]},{"t":"p","h":"6. Зат атооч (имя существительное) жөнүндө эмне билесинер? Аныктамасын эске түшүргүлө."},{"t":"p","h":"Эсиңерге түйүп алгыла!"},{"t":"p","h":"Кесирдүү ооздон кесепеттүү сөз чыгат. Мышыкка күлкү, чычканга өлүм. Досу көптү жоо албайт, акылы көптү доо албайт."},{"t":"h3","h":"ТАБЫШМАК"},{"t":"raw","h":"<h4 class=\"mk\">Такыр-тукур жоргосу, Башында бар дорбосу. Таңга маал азаны, Тамагында казаны.<\/h4>"},{"t":"v","l":["жоргосу (басыгы) – мында: его иноходца","дорбосу – мында: небольшой мешочек","таңга маал – под утро, азаны – мында: поёт","тамагында казаны – в горлышке ее"]},{"t":"p","h":"Чокой – калиги, поршни (валенки) грубая обувь, сделанная из войлока. Баарынын боосу бек болсун! (этн.) Благославление, доброе пожелание: Пусть будет прочной (крепкой) их жизнь."},{"t":"v","l":["Алкоо (этн.) – Благославление, доброе пожелание.","Каргоо (каргыш) – проклятие, проклинание."]},{"t":"p","h":"Дорбо (этн.) – торба. Небольшой мешок, надеваемый лошади на морду для кормления зерном."},{"t":"p","h":"<span class=\"pg\" data-n=\"44\">44<\/span>Энуу – эр эңиште аттан алып түшүү – свалить с коня, выбивать из седла."},{"t":"p","h":"Чабытта – полёт или рысканье в поисках добычи."},{"t":"p","h":"Айланайын (кагылайын ж. б.) (этн.) – ласковое обращение к кому-либо,"},{"t":"p","h":"Бөпө (пупу) (этн.) – так отзывают ловчую птицу, охотничий возглас."}],"sub":[{"title":"ТАБЫШМАК","b":20}],"pages":[43,44]},{"title":"ТОГОЛОК МОЛДО (Байымбет Абдрахманов)","blocks":[{"t":" "* тамсил – акыл-насаат мүнөзүндөгү чакан чыгарма, Каармандары – адатта адамдардан тышкары жаныбарлар, өсүмдүктөр. Каймана түрүндө адамдардын, коомдун кемчиликтери шылдынга алынат. Байыркы грециялык Эзоп, римдик Федр, россиялык И. А. Крылов, Д. Бедный жана башкалар тамсил жанрын өнүктүрүүдө чоң эмгек кылышкан. 5 негиздегендердин бири – один из основателей <span class=\"pg\" data-n=\"45\">45<\/span>мисал. «Эшек менен Булбул» тамсилин жазууда И. А. Крыловдун таасири ачык эле көрүнүп турат."},{"t":"p","h":"Эшектин образы аркылуу талант менен талантсыздыкты ажырата билбеген, ар нерсеге өзүнүн мамилесин тануулаган адамдар шылдыңга алынат. Баарынан өкүнүчтүүсү кээ бир учурларда таланттын тагдырын ушундай адамдар чечип калгандыгында. «Абышка, кемпирдин көмөчү» жомогунда жалкоолук, мактанчаактык, алдамчылык жөнүндө сөз болот."},{"t":"p","h":"Жыйынтыктап айтканда, Тоголок Молдо балдар адабиятынын тарыхынан ардактуу орун ээлеген залкар акын."},{"t":"p","h":"кедейлердин кызыкчылыгын көздөгөн – защищал интересы бедных. Учурда ар ким өз ...... ...... мезгил."},{"t":"p","h":"жакындашуусунан улам в результате сближения. Икбал менен Сабина ...... отурат. Лоренс менен Луиза ...... туугандар. Душман ...... артка чегинди. жакшы тааныш болгон – был хорошо знаком. Эркелей кыргыз салты менен ......"},{"t":"p","h":"кайрадан иштеп чыккан – мында: переработал. Эрик дилбаянды ...... жазып аа. Наталья ...... кайтып келди. Чыгарманы ...... ...... ......."},{"t":"p","h":"коомдук мамилени – общественные отношение. Акындар өз чыгармаларында ЖОРГА сынга алышкан. Анвардын ...... оңолду."},{"t":"p","h":"жаратат (жараткан) – сочинял (сочиняет), буга мисал – пример тому. «Каркыра менен Түлкү» ....... Серкулан, калемиңди ...... бер. Жанарбек, ...... иште."},{"t":"p","h":"ажырата билбеген – мында: неумение различить. Жаман менен жакшыны ...... албаган кишилер болот. Бизди эч ким ...... албайт."},{"t":"p","h":"өзүнүн мамилесин тануулаган – навязывающий свое отношение (мнение)."},{"t":"p","h":"Шавкат ..... пикирин ...... ‚ Ларринин ...... колун чечишти."},{"t":"p","h":"баарынан өкүнүчтүүсү – к великому сожалению (самое удручающее)."},{"t":"p","h":"чечип калгандыгында (чечкендигинде) – решают. ...... ...... таланттын тагдырын ушулар ...... ....... Кийимиңди чеч. Бул табышмакты чеч."},{"t":"p","h":"жалкоолук, алдамчылык, мактанчаактык – о лени, (плутовстве) надувательстве, хвастовстве. Отто ...... жаман көрөт. Серик ...... сүйбөйт. Нуржигит мактанбайт."},{"t":"p","h":"жыйынтыктап айтканда – мында: подводя итоги."},{"t":"p","h":"ардактуу орун ээлеген – занимал почетное место. Бул-...... конокко арналган а. Сынару биринчиликти ......."},{"t":"p","h":"<span class=\"pg\" data-n=\"46\">46<\/span>Эсиңерге түйүп алгыла!"},{"t":"p","h":"Тоголок Молдонун эмгеги жогору бааланып, Бишкектин көчөсүнө анын ысмы коюлган. 1930-жылы белгилүү скульптор О. Мануйлова «Манасчы Тоголок Молдо» деген бюстту жараткан. Туулган жерине (Ак-Талаанын Куртка айылында) анын күмбөзү тургузулган. Айылдарга, мектептерге ысмы ыйгарылган."},{"t":"v","l":["1. Тоголок Молдо качан, кайда төрөлгөн?","2. Ал кандай акын болгон?"]},{"t":"p","h":"3. Акындын фольклордон кайра иштеп чыккан чыгармаларын атап бергиле (назовите)."},{"t":"p","h":"4. Анын кандай поэма, ыр, жомок, кошок, тамсилдерин билесиң?"},{"t":"p","h":"5. Акын Октябрь революциясынан кийин кандай чыгармаларды жараткан? 1. Энчилүү жана жалпы зат атоочторду өтүлгөн тексттерден тапкыла. Тик сызыктын бир жагына жалпы, бир жагына энчилүү аттарды жазгыла."},{"t":"img","src":"data:image/webp;base64,UklGRnAGAABXRUJQVlA4IGQGAAAQKwCdASqAAjUAPrVUpUwnJKuipLQ8QXAWiWluUNo7s2bk2hmww/+0dG9yM1lAB1emrWr3nVyFWHJbcwWnlRFGNgpmkD1kXCBFSpVupQHe8pzqD9gg6Um1VyKQ/9BQCNhxKgVsxJOvYos0w0DuS+0qEAa970K+609/tImsfcMlkWN3gVSun/iVqnIR8bzvsZXVLPYRGpcl74hZJWRYzW2zzjJtb+n8RGq0BCp4/EtzHGgmiNSbTXcT9fLtFRnH4sz/Lv3eN4FbLA9W0tQroAFswUkl7qIBSgjI5uHwUJuo19ki7zxzgiGUyUUwtERKi2kDx2Yu+mMBpoToPaIdaHiFfnb+WVjZbfrH4sFVYiDqAzy9eEzztJPjF3Ri0xljrgIMrlZwc3IzvNRsYGAhYuSRRanRqHFkdGqKriD7zo6dyGvYfMoWAHgo0x үгүп келе жаткандыгына «Орхон-Енисей жазмалары» (V-VIII кылымдар), Махмуд Кашкаринин «Түрк сөздөрүнүн жыйнагы», Жусуп Баласагындын «Кутадгу билиг» жазма эстеликтери күбө. Ал эми сөздүн толук маанисиндеги кыргыз профессионал адабияты XX кылымдын башынан баштап күрдөөлдүү өнүгө баштады. Тарыхый кыска мезгилдин ичинде кыргыз адабияты мыкты чыгармалары менен дүйнөгө таанымал болду. Бул багытта Ч. Айтматов, А. Осмонов, Т. Сыдыкбеков, С. Эралиев, Т. Касымбеков өңдүү жазуучулардын чыгармаларын атоого болот."},{"t":"h3","h":"ТЕМИРКУЛ ҮМӨТАЛИЕВ"},{"t":"img","src":"data:image/webp;base64,UklGRugQAABXRUJQVlA4INwQAADQoACdASoFAXoBPrFMnkmnJKMhM5X5EOAWCWlu3sVOVByNvgmSt6gL/fX/nQU6O9v/xaKyfoE5/nMv/sr6c5y2hdciiURmItN6HuIlI7u0UJaE5fe973veH+/+yekp58/boBGziA0NTzTxoOiD5ZJ5dYhYEPyDUKPOHzzVfkWaBNNChwgFD6REyMZPPsSNRWrIfKLE8HX+fClfJR2SFtTYYuyvnES4kitiHnurK9RIMe+RxAPvRFrfCxDk9oVkxEyg2/GiXEisn2A+GVIRUJ5WWUfVoYenRM8l7gVznlywAM1OxZVjV1GXMV3JtrleHOFhsf4xcLFDR8vXAZgUPSLoiDniN118Dv4sftTRaGX7tvM2clYkNyFPyqvikdjkuW/wcDs/55CFIvKWuEZvotAeIJsLy6i1jbqKCHJn7cLjMLLEdnJZV/oKL4IJwSsEpFavE/7G1H33vFTm1LTjzY5VrscbIKFWzmN1i0RKKStInwI0unfZXWeonD7anAvmdZ310GiUdgmqOLUrRgi7Daw0MxTW7xxjPCnh7+3GgRdZIPMO/1pBkjaR/pc6K1X1DKnUx2KIkvRjbGVrvs+g+t7hpSFMl8lfQKWmUzMNQiD8No3Sr4BI7cCFZzqtus74056rQGzHRCq5Y7ZEZMdSwHusLawt773v1yDmzisMBSqqhb2QzG26lEISatEkFO6bR6qIvEspz0mzToPkTr7/s60OTWPU7xfKyUTd5YYOo2J78LDfWpGlRnNsSERtcc93n1qdQImbI0pSGOW6s1qK/UnUfHuy5xuPu9MX97n0jSltuBYInH8B+uVhzySLSjWOO3absID0kaeyaASUh7svtOCIUNxL9PlYwG9nTmsdZxYrLqUq9Qj4YyEMUF61jtIu2HyXSMv6XSuBhCAWqGE30YFGaInFgAMuMkfVHZVsiFVmmKQ/H/fNjvICBvdnw3oLIgU3oQj9+Y7xc7lhg0D0X57LG/3sRNziM1zn5SiGA0Bzyw5pkBZhd2wKBfYSxg3z37POJ4p5UaqaX098nUyC83AnK6Oq1ArEDD3U4npA1qe2IoJzYV++GOaKGbNZ46WZwWb7gOK0VUy65aYR+eulHSn/tKESK9korP6VdzAu940VMNqk7y+mYuLDRSySG9dB1zBweSVy5AErO1xkmJON7+Y7sBV7P0JfDzzsXK6KS+PiSuAFe9Rf6uur5aRRAVEQBDl+1kmN4nI7UIccV+xe0oEP5Ds9epXngeAqdzRvuNQkSANGTvlw8P9sPbgSWp0CmIoCHv9OCnD6kIpFjNmOEH/m+YOqbZRrzAS7ybE0CWNbDgf9dYAcgLkvHOwgCx3ynn5z049zYdAnkCFlouotphKgSYoQSvyrrw9hcnI+pqJnxCJ "өчү бардай. өчү бардай – будто бы мстили","<span class=\"pg\" data-n=\"65\">65<\/span>Жоо колу кан майданда","кырылгандай,","Заматта баары сынды элүү","ыргай.","Атасы сөз укпаган балдарына,","Бул ишти мисал кылды","карап турбай.","– Көрдүңөр, бирдик деген","оңой эмес,","Уксаңар бирдик үчүн берем кеңеш.","Боолонгон ыргай өндүү бир","турсаңар,","заматта – мгновенно","","мисал кылды – приводил в пример","","бирдик деген оңой эмес – мында: единство","дело не легкое"]},{"t":"p","h":"<span class=\"pg\" data-n=\"64\">64<\/span>Силерге каршы басып эч ким каршы басып эч ким келбес – против вас келбес. Эч бирөө сындыра албас белиңерди, Эч бир дөө багынта албас элинерди. Капыстан чыга келген кагылышта, Касташкан тепсей албас жериңерди. «Бөрү жейт бөлүнгөндү» деген ошол, Бөлүнбөй бирге жүрүп, бирге жаша. Угушту бир туугандар ата сөзүн, Жаңжалды таштап баары никто не выступит сындыра албас белиңерди – никто не сможет вас повергнуть"},{"t":"v","l":["","тепсей албайт жеринерди – не посмеет","топтать вашу землю","","ачты көзүн. ачты көзүн – мында: одумались","Ойлошту жаткан тура","күч бирдикте,","Бир басып кыдырышты кыдырышты – обошли","жердин жүзүн.","Бир дагы душман каршы","кезиккен жок,"]},{"t":"p","h":"<span class=\"pg\" data-n=\"66\">66<\/span>Бардыгы жерге житип"},{"t":"v","l":["кеткен окшоп.","Көрүнбөйт кайда кеткен","бай балдары,"]},{"t":"p","h":"Жоошуптур манап уулу колдору шок. Ынтымак үйгө кирди андан кийин, Акылман тоготкон жок болуш, бийин. Тогузу тогуз жолборс балдарынын,"},{"t":"v","l":["жоошуптур – утихомирились","","ынтымак үйгө кирди – в дом пришло согласие","","тоготкон жок – не принимал во внимание","","тогуз жолборс – девять тигров"]},{"t":"p","h":"Душмандар таппай калды таппай калды кирерге ийин- (обр. выр.) не кирерге ийин. нашли места, где спрятаться"},{"t":"p","h":"акылман – мудрец. Жашаптыр бир ...... тогуз уулдуу."},{"t":"p","h":"ак басып сакал-мурутун акылмандын – сединой покрылись усы и борода мудреца."},{"t":"p","h":"жүдөттү эл көзүнчө күчтүү намыс – ущемленная честь не давала покоя. дүлөй – глухой, дүлөйлөрчө – как глухие. Айтканды укпадыңар."},{"t":"p","h":"жаңжалды таштап – прекратив ссориться, враждовать между собой."},{"t":"p","h":"ыргай – ирга (кустарник с очень крепкой древесиной). Топ ...... тоодон бекем күч турбайбы."},{"t":"p","h":"бардыгы жерге житип кеткен окшойт – словно все провалились сквозь землю. күч бирдикте – сила в единстве. Атасынын айткан акылынан кийин бир туугандар ...... экенин түшүнүшүп, ...... ташташты."},{"t":"v","l":["душман (душмандар) – враг (враги).","","1. Акылмандын тогуз уулу кандай жашашчу эле?","2. Бири-бири менен эмне деп чатакташчу эле?","3. Атасы эмнеге кайгырды?"]},{"t":"p","h":"4. Ал кандай амал ойлоп тапты (придумал уловки) жана аны кантип ишке ашырды?"},{"t":"p","h":"5. Тогуз уулу ынтымак зарыл экендигин (что нужно дружбе) кантип түшүнүштү?"},{"t":"p","h":"6. Байдын балдары жана эл аларга кандай мамиле жасашты (как относились)?"},{"t":"p","h":"<span class=\"pg\" data-n=\"67\">67<\/span>1. Жомокту ырааттуу айтып бергиле. Акылмандын сөзүн жаттагыла. Балдардын диалогдорун аткаргыла."},{"t":"p","h":"2. Поэманы эки-үч бөлүккө, ролго бөлүп ар бирине тема койгула."},{"t":"p","h":"3. Көп чекиттин ордуна сүйлөмдүн маанисине ылайык келген сөздөрдү койгула: 1. Акылман .... ынтымаксыздыгына ... болду. 2. Тоодон ... алып келип балдарына ... көрсөтмөк болду."},{"t":"p","h":"4. ... ыргайларды сындыра алышпады, чечилген ... оңой эле сындырышты. Алар ... жашап калышканда ... ... тие алган жок."},{"t":"v","l":["5. Төмөнкү ырды жаттагыла:","а) Ырыс алды ынтымак,","Ынтымагың жок болсо,","Алдындан таяр алтын так.","Калыгул","","б) Аргымакты жаман деп,","Бууданды кайдан табасын?","Агайынды жаман деп,","Тууганды кайдан табасың.","Тууганына батпаган,","Душманына жалынат.","Жакынына жакпаган,","Жат кишини жамынат.","Токтогул","","Эсиңерге түйүп алгыла!","алтын так – золотой трон","","агайынды (ага-инини) – мында: братьев","","жалынат – умоляет","жакпаган – не понравившийся","жат кишини – мында ,{"t":"p","h":"К. Баялинов кыргыз элинин көрүнүктүү жазуучусу. Ал кыргыз адабиятында проза жанрын негиздегендердин бири. Роман, повесть, аңгемелеринде кыргыз элинин турмушун кеңири сүрөттөгөн. Кыргыз элинин фольклорун мыкты билген жана сүйгөн. Бала кезинен жомок айткандарды ээрчип, укканга кызыгат. Алгачкы чыгармаларынын бири – «Түлкү менен суур», «Чабалекей менен жылан». Бул чыгармаларды элдик жомоктордун негизинде жазган."},{"t":"h3","h":"ЧАБАЛЕКЕЙ МЕНЕН ЖЫЛАН"},{"t":"p","h":"Эски тамдын үстүнө келип, эки чабалекей уя жасоого балчык ташышты. Балчыгын катар-катар кылып тизмекчи болушту. Бирок, балчык токтогон жок, жылбышып туруп алды."},{"t":"p","h":"Ошондуктан, чабалекейлер балчыкты топон, жүн, кылга аралаштырып алып келишти. Аны балдардын жасаган жүк ташындай кылып, биринин үстүнө бирин эп кыйыштырып тизе баштады."},{"t":"p","h":"Балчык мурункусундай жылбышпай желимдей болуп жабыша берди."},{"t":"p","h":"Уя бир нече күндөн кийин чөйчөккө окшоп, даяр болду. Эки чабалекейдин бирөө күн-түн дебей уясында жатты. Экинчиси ага тамак ташып келет. Бир нече күн өткөндөн кийин уяда жатканы төрт балапан чыгарды."},{"t":"p","h":"<span class=\"pg\" data-n=\"69\">69<\/span>Балапандар энеси жем алып келгенде, бардыгы оозун ачып, бирине-бири сүйкөнүп, алга умтулуучу."},{"t":"p","h":"Күн чак түш эле. Чабалекей балдарына жем берип болуп, эс алууга уясында жаткан. Ал бир мезгилде устундун түбүндө жаткан жыланды көрдү да, коркуп:"},{"t":"p","h":"– Ой, сен ким болосуң? – деди."},{"t":"p","h":"– Менин ким экенимди кийин билерсиң. Мени көрдүңбү? Оболу ошону айтчы! – деди жылан."},{"t":"v","l":["– Бийик жерде туруп сени кантип көрбөйүн, көрдүм.","– Көрсөң да, мени тааныбапсын.","– Кантип сени тааныбайын, тааныдым.","– Таанысан, мен ким болом? Кана, айтчы!","– Ким болмок элен, жылансын!","– Жок, кескелдирик болом."]},{"t":"p","h":"– Мен көргөн кескелдириктердин буттары болчу эле. Сенин буттарың кана? – деди ал."},{"t":"p","h":"– Эмесе, сен кескелдириктердин көбүн көргөн эмес турбайсынбы. Көргөн болсоң бул сөздү айтпас элең. Кескелдириктин кайсы бирөөндө бут жок болот. Муну жакшы бил!- деп дагы жылан башын көтөрүп койду."},{"t":"p","h":"Жыландын анда-санда башын көтөрүп, балапандарын караганына, чабалекей шектенип:"},{"t":"p","h":"– Жок, ишенбейм, жылан элесиң – деди."},{"t":"p","h":"– Мага ишенбейт экенсин го. Эмесе, жаныңа барып ишендирейин, – деп жылан устунга оролуп, жогору сөйлөй баштады. Чабалекей, жылан балдарымды жейт экен деп коркту. Жаны калбай чырылдап, уясынан учуп, тышка чыкты. Кайтып уясына келип конду. Балдарынын оозун ачып жем сураганын көрдү."},{"t":"p","h":"– Шордуу балдарым ай! Оозуңарды ачып жем сурайсыңар. Өзүңөр бирөөгө жем болгону жатканыңарды билбейсиңер, байкуштарым ай! – деп, чабалекей жалооруп кетти."},{"t":"v","l":["анда-санда – иногда","шектенип – сомневаясь"]},{"t":"p","h":"чабалекей, жылан балдарымды жейт экен деп коркту – ласточка испугалась, что змея съест ее детей 4 шордуу балдарым ай! – дети мои, несчастные!"},{"t":"img","src":"data:image/webp;base64,UklGRipNAABXRUJQVlA4IB5NAABwJwKdASqAAsEBPrVQokunJK6nqLL8kdAWiWVsPr14b+q1aXARit3od9A+qtmDE9+Y+0WUf/9Lx6fX18UI/UeaTx+f43rWZ23TWDt/q5qfH/uSXCHxLepf/jxn/L/z3/t/u/aa/3tLfxXdq/yeaH/t7GmYf/8egnv//38NHjcf8+xn6D0demkdL/+fVXAgUox0bll5l4t4gIJuXlvKNsaORY5bM1VFZr+pVoUgXOIur7kVQ4IYe41IltHEs/iRagm9qdPlkAQZOMPEleXfcixnLEMfk/L/KVfN60o1QVmMtEpeUPsaKc5IgPI+ZUMPQ9SXxaEwLDOHW9opR6Gp5b4aytu2BkjfTAFLwuVnp7sX+g+dTMm33jOg4NGRwmnqS9KjZdFo4QMSLjtqbDJRLBxgcphen8PUXRuEPrYreQyaCDjCyskzZ9DcdzlQtvYOcymZzcpyZMHRcBMl5GuKMQg4CeuaaS8OJxPmhAPQRNviJbm/IaQiWrnxvn/fQ1K6W9RruFQmVRIQ0qU7y9Ik7LGm2Monwvw2q007EhLywS7HLwtgciouw8DJO5t8VaONYRjXKZJNndzrDI3DbsZ2zmwcW4VeIk0aYKxmIx5xn104tXVYxXBijpTFVNWgBDtjfhLAM3qP3OJ600MlAVxM55MAZxtRPUOzTJtTtmD3MJr70XMEkQXGTCCC5fzzVYfriT7pglSOvnX00+Lub7km1344vnnpA/VokKAUIY3S6MlzI1R9VWDKTbsR1t3bhm5M9VYmel5GU370ew+af3U5EzOAhTExGlr65I3/SAhGamo6WaUMHq3HxPt5ZT7jVDWACa5AbNO5SKzbkMPILcbGbnQn7vrx0C10eTwvCtoWv8jAkGDJbyC4llmFk5qGWdTWKlEtVd/4bSg5s32tpX+tJf1b/6tRkgTugg5DjpeRfyIVJzBZMRQXKABIKEcunZ9H ен бел талаштыра жыланды тартып жиберди. Жылан тоголоктошуп жерге түштү. Жерге түшкөндө жыландын эки көзү челейип, агып түшкөн экен."},{"t":"p","h":"уяга башын салып – засунул голову в гнездо бел талаштыра тартып жиберди – ударил изо всех сил жалгыз аяк жол – тропинка ичине кирди – зашел во внутрь"},{"t":"v","l":["жарыктыктарга эмне болду – мында: ласк. что случилось с милыми?","эки жагын -с двух сторон","","тоголоктошуп – скрутившись"]},{"t":"p","h":"<span class=\"pg\" data-n=\"71\">71<\/span>Бирөөгө зордук кылам деген жылан, өз азабын тартты. Чабалекейлер, балдарынын аман калганына кубанып, абышкага алкыш айтышты."},{"t":"v","l":["чабалекей – ласточка.","балчык – здесь: грязь.","топон – мякина, полова (с твердыми частями колосьев),"]},{"t":"p","h":"жүн – шерсть, кыл – грива, волосы гривы. Алар...... топонго аралаштырып алып келишти."},{"t":"p","h":"эп кыйыштыруу – ловко скрепив (чего-либо) жылбышпай желимдей болуп жабыша берди – клеился, не скользя, словно клей. Чабалекейлер уяны ......, ......, топонго кошуп жасаганда ...... ...... калды. уя – гнездо. ...... эмнени көрсө, учканда ошону алат (макал)."},{"t":"p","h":"чөйчөккө окшоп – подобно маленькой миске. ...... кылып уя салды. Бир ...... кымыз ичтик."},{"t":"p","h":"балапан чыгарды – выводил птенцов. Чабалекей ...... ....... Кэри китеп ...... Алия мештен кул ......."},{"t":"v","l":["кийин билерсиң – потом узнаешь.","кескелдирик болом – я ящерица.","буту жок болот – не бывает ног."]},{"t":"p","h":"устунга оролуп – обвиваясь вокруг столба. Жылан ...... ...... ‚ Инганын ...... узун чачы бар."},{"t":"v","l":["бирөөгө жем болгону жатасыңар – становитесь кому-то пищей.","камчыланып келе жаткан – нахлестывал (своего вола).","көзү челейип агып түштү – глаза вытекли. Жыландын эки ...... ...... ...... ......","Суу тоодон ...... .....","1. К. Баялиновдун чыгармачылыгы жөнүндө эмне билесинер? 2. Чабалекейлер уясын кандай чеберчилик менен салышты?","3. Эне-чабалекей балдарына кантип кам көрдү (как заботилась)?","4. Жылан ча латкан койчулар өздөрү айран-таң. Бул эмнеси бөрүнүн, өзү качып баратат да: «Кууп жеткиле!» – деп кыйкырып барат. Карышкыр болсо эптеп ит кылып салам – сделаю (тебя) собакой (или превращу в собаку)"},{"t":"v","l":["кол салганы баратам – иду нападать","айраңтаң (аң-таң) – растерянно удивляться"]},{"t":"p","h":"<span class=\"pg\" data-n=\"75\">75<\/span>качып кутулат, бирок кутулганда эмне, курсагы ач да. Ошентип кайда барса да, мал-жанга жакындаар замат ичинен Чыпалак кыйкырып, карышкырдын айласы түгөнөт. Арыктап өлө турган болот. Азууларын шакылдатып: «Эми эмне кылам, кайда барсам, балээни өзүм башыма үйүп алдым»,- деп солуктап жатат. Анда ичинен Чыпалак шыбырайт:"},{"t":"p","h":"«Ташматка бар, койлору семиз! Байматка бар, иттери дүлөй. Эрматка бар, койчулары уйкучу». Карышкыр улуп унулдайт: «Айтканыңа көнбөймүн, андан көрө адамга барам да, ит болуп жалданып алам» – деп, ошентип ит болуп калган экен."},{"t":"p","h":"эл аралык сыйлык – международная премия."},{"t":"p","h":"өз башынан өткөргөн окуялар – события, которые он пережил сам. Бул окуяны Абай ...... ...... ....... Гулчехраны суудан ...... Филипп болучу. Серик ...... кеп ...... билет"},{"t":"v","l":["өзүнчө китепчелер түрүндө – отдельными книжками.","жалбырак – листья."]},{"t":"p","h":"төө кепшегенин (чайнаганын) билет, жутканын билбейт – верблюд знает что жует, но не знает, что глотает (макал)."},{"t":"p","h":"курсагын жара тартып разорвал брюхо. Төөнүн Чыпалак баланы алып чыгышты."},{"t":"p","h":"желип-жортуп келатып – когда шёл рысью."},{"t":"p","h":"жутуп алат (жутуп алуу) – проглотил: Бөрү ...... ...... ‚ Жамил суу ...... А бөрүлүктүн күнүн көрбөй – мында: не жил волчьей жизнью."},{"t":"v","l":["капталын кабат – кусает себя.","эптеп качып кутулат – еле спасается бегством."]},{"t":"p","h":"азууларын шакылдатып – щелкает зубами. Бөрүнүн ...... курч болот. Эльза үшүгөндөн тишин ......"},{"t":"p","h":"ит болуп жалданып алам – собакой наймусь к человеку. Ит ...... суу кечпейт (макал)."},{"t":"v","l":["1. Ч. Айтматовдун өмүрү, чыгармачылыгы жөнүндө айтып бергиле?","2. Баланын аты эмне үчүн Чыпалак?","3. Аны адегенде ким жутуп алат? Ата-энеси кантип куткарат?","4. Сугалак карышкыр Чыпалакты кантип алдады?","5. Карышкыр кантип ит болуп калат?"]},{"t":"p","h":"6. Карышкырдын ачкөздүгү, сугалактыгы жөнүндө орус элинин кандай жомоктору бар? Мазмунун салыштыргыла."},{"t":"v","l":["' жакындаар замат – как приблизится","* унулдайт (улуйт, уцшуйт) – воют, скулят"]},{"t":"p","h":"<span class=\"pg\" data-n=\"76\">76<\/span>1. Ч. Айтматовдун чыгармаларын окуп ал жөнүндөгү башка материалдар менен таанышкыла."},{"t":"p","h":"2. «Чыпалак бала» жомогунун мазмунун окуп, каармандарына мүнөздөмө бергиле, сүрөтүн тарткыла."},{"t":"p","h":"3. Төмөнкү сөз тизмектеринин маанисин чечмелегиле:"},{"t":"p","h":"аймап коюптур, жеп коюптур, төө жутканын билбейт, кепшегенди билет, жерге ооналактайт, куйругун кыпчып качып берет, балээни өзүм башыма үйүп. Сөздүктөрдөн карап которуп, аларды катыштырып сүйлөм түзгүлө. Эсиңерге түйүп алгыла!"},{"t":"p","h":"Баш бармак, бадал иймек, ортон оймок, оюу чиймек, чыпчыпалак чычайган арам тамак."},{"t":"p","h":"(элдик айтым)"}],"sub":[],"section":"КАСЫМАЛЫ БАЯЛИНОВ","pages":[74,76]},{"title":"БУГУ-ЭНЕ","blocks":[{"t":"h3","h":"БУГУ-ЭНЕ"},{"t":"v","l":["Табгач каны жообуз эле","Он ок каны жообуз эле","Баарынан күчтүүсү","Кыргыз каны жообуз болду.","(Тонүкөк күмбөзүндөгү жазуу)",""]},{"t":"h3","h":"I"},{"t":"h3","h":"Жоо чабуу"},{"t":"p","h":"Бул жомок эзелки окуя."},{"t":"p","h":"Атам заманда, жер бетинде чөптөн токой көп, кургак жерден суу көп болуп турган кезде улуу уруу кыргыз журту Энесай деген өзөндүн боюн жайлап турат. Ал улуу дайра кең өзөн түндүктө Сибирь – деген жерден агат. Атчан адам ал жерге үч жыл, үч ай жол жүрүп араң-араң жетет. Ал дайраны азыркы адамдар Енисей деп атап жүрүшөт."},{"t":"p","h":"Илгери кыргыздар Энесай дешчү. Ошондон улам мобул ыр калган:"},{"t":"v","l":["' атам заманда – в давние-предавние времена","® өзөндүн боюн – побережье речки","% мобул (мына бул) ыр – вот эти стихи","<span class=\"pg\" data-n=\"77\">77<\/span>Энесай, сендей жайкын өзөн барбы?","Энесай, сендей жаркын мекен барбы?","Энесай, сендей кыйын азап барбы?","Энесай, сендей ыйык азат барбы?","Энесай, сендей жайкын өзөн болбос,","Энесай, сендей жаркын мекен болбос!","Энесай сендей кыйын азап болбос?","Энесай, сендей ыйык азат болбос!","Энесай өзөн ушундай өзөн экен."]},{"t":"p","h":"Энесайдын боюнда ар уруу эл жашап турат анда. Алар бирин-бири чаап, талап алган жоокерчилик заман. Кыргыз уруусун да айлана тегерете курчап, кас уруулар туруптур. Кыргыздар да кези келгенде аттанып казат жүрүп, касташкан уруунун үйүн өрттөп, күлүн көккө сапырып, элин кырып, жылкысына тийип, малай айдап кетчү экен. Эр өлтүрүү эрдик саналып, адамды адам тукум курут кылган заман экен. Эгин эгип, түшүм жыйнар, мал багып, мергенчиликтен олжо таап келер эр бүлө калбай, эл тукуму сооло берет. Буту менен басып, мурду менен тынгандын баары тынч эмгекти таштап салып, жоокерчилик, талоончулук менен күн көрүп калыптыр. Өлтүргөндүн өчү бар, төгүлгөн кандын куну бар деген, өчүгүшкөн тили буруу, кырк уруу бирин-бири мойсоп бүтмөйүнчө тынчый албай калган."},{"t":"p","h":"Ошондой кыйын кезең, күндөрдө Тайга чер токойго бир сыйкырдуу куш пайда болот. Ал жөн сайрабай адамча сүйлөп, бирде ыйлап, бирде ырдап, таң атканча, күн батканча: «Алаамат болор!», «Алаамат болор!» – деп сайрап чыкчу болот. Акыры ошол куштун айтканы келип, кыргыздардын башына каран күн түштү."},{"t":"p","h":"Ал күнү кыргыз уруусу аза күтүп, эл атасы, сан колдун башчысы Күлчө баатырдын сөөгүн жерге бергени жаткан. Кол баштап нечен казатта жүрүп соо калган, нечен айыгышкан чабыштан жеңиш менен чыккан карт баатыр көрөр күнү, ичер суусу түгөнүп,"},{"t":"p","h":"' талоончулук менен – грабежом"},{"t":"v","l":["2 тили буруу кырк уруу – мында: иноязычные сорок племен","3 сыйкырдуу куш – мында: волшебная птица","* «Алаамат болор!» – Быть великой беде!"]},{"t":"p","h":"5 нечен казатта жүрүп соо калган карт баатыр – старый воин, прошедший через многие военные походы <span class=\"pg\" data-n=\"78\">78<\/span>каза табат. Кыздар кызыл кийинип, катындар кара кийинип, кыргыз эли эки күн аза күтүп, үчүнчү күнү баатырдын сөөгүн ата салты боюнча жабыла көтөрүп, Энесайдын боюна бойлотуп, жарлуу жээктин мизи менен алып өтмөк. Анткени элдик баатырдын чымын жаны көккө учуп кетер алдында Эне болгон өзөн менен, Ата болгон Мекен менен коштошуп алсын, тирүүсүндө жоого аттанып баратып, жоону чаап келатып, ушул жээктен ырдап өтчү ырын чымын жаны ырдап кетсин деген салты болгон. Ошол ыр жогорку ыр."},{"t":"p","h":"Баатырдын сөөгү жатар жайы, коер көрү бийик дөбөнүн чокусунда. Коёр алдында эли баатырдын сөөгүн башынан өөдө көтөрүп, төгөрөктүн төрт тарабына көрсөтмөк: «Алдында калды жайкын. Үстүндө теңир ээлеген көгүң турат. Өзөктүү өз тукумун, калың журтун сөөгүндү көтөрүп, башын ийип астында турат азалуу. Жаткан жериң жайлуу болсун, топурагың торко болсун!» Ошентип, баатырдын сөөгүн жерге берип, көрүнүн башына өткөндөгү баатыр Ата, баатыр Бабалардын жолун жолдоп, чулу корум таштан Таш-Баба орнотмок."},{"t":"p","h":"Алаамат мына ушунда башталды. Энесайлык кырк уруу эл канча жоолашпасын, эл атасы каза таап, башына кыйын күн түшкөндө бири-бирине кол салчу эмес. Бирок бүгүн салт бузулду. Салтты бузган жоо түндөп курчап, тегеректеги токойдо бугуп жаткан. Эми эл мүңкүрөп турган чакты маалдап, капилеттен кол салды. Жарак алып каршы чыгууга, атка минип, айкырып чыгууга эч ким үлгүрбөдү. Түшкө киргиз кыргын жүрдү. Өмгөктөгөн карыдан эмгектеген балага чейин кылычтын мизине, найзанын учуна калып, качып кутулам дегени жебенин тилине кетип жатты. Жоо ушуну көксөгөн. Кыр көрсөтүп, тизгин бербеген кыргыздарды тукум курут кылып, күлүн көккө сапырып кетем деп келген."},{"t":"v","l":["' ата салты боюнча – по давнему обычаю","* жарлуу жээктин мизи менен – (нести) по крутым обрывам","з чымын жаны ырдап кетсин – чтобы душа его запела","канча жоолашпасын – как бы ни враждовали","5 бүгүн салт бузулду – сегодня была нарушена традиция","* түндөп курчап, бугуп жаткан – окружил ночью","т түшкө киргиз кыргын – невиданное побоище"]},{"t":"p","h":"* тизгин бербеген – мында: оспаривающий власть, не позволяющий властвовать"},{"t":"v","l":["<span class=\"pg\" data-n=\"79\">79<\/span>","аттанып казат жүрүп – мында: ходили в набег.","күлүн көккө сапырып (фр.) – мында: разгромить и уничтожить."]},{"t":"p","h":"тукум курут кылуу – истребить, уничтожить, перебить. Душман ...... ...... кылгысы келген. Манастын ...... Семетей. Девис ...... биринчи көрдү."},{"t":"p","h":"буту менен басып, мурду менен тынгандын баары – (обр. выр.) все, кто мог ходить и дышать."},{"t":"p","h":"мойсоп бүтмөйүнчө – пока не перебьют. Балдар боорсокту ...... салышты. кыйын кезең күндөрдө – мында: в такие трудные времена ...... ...... ...... сыйкырдуу куш пайда болот."},{"t":"p","h":"каран күн түштү – обрушилось несчастье, настал тот страшный день. Элге ...... ...... түштү. Лира: «...... .....!» деп кейиди."},{"t":"p","h":"сөөгүн жерге бергени жаткан – (обр. выр.) собирались похоронить, предать тело земле. Баатырдын .......................;"},{"t":"p","h":"кол баштап – руководил военным походом."},{"t":"p","h":"көрөр күнү, ичер суусу түгөнүп – мында: настал час его смертный, его дни были сочтены."},{"t":"p","h":"аза күтүп (аза күтүү) – траур, оплакивание."},{"t":"p","h":"сөөгү жатар жайы, коёр көрү – могила. Сөөктү жайына беришти. Мүрзө тургузушту. Көрдүн оозу аңыраят."},{"t":"p","h":"чулу корум таштан – крепкая груда из больших камней. Касым ...... жигит."},{"t":"p","h":"Сөөктү таш менен ......"},{"t":"p","h":"1. Кыргыз эли каерде жашап турушкан жана ал жер жөнүндө эмне айтылган? 2. Ал заманда элдер кандай жашашкан? Сыйкырдуу куш эмне дейт?"},{"t":"p","h":"3. Кыргыз уруусу кандай салт-каадасын аткарган?"},{"t":"p","h":"4. Каршылашкан жоо эмне кылды?"},{"t":"p","h":"1. Чыгармадагы адам өлгөндөгү салт менен учурдагы салттын айырмаларын айтып бергиле."},{"t":"p","h":"2. Ырды жаттап жана тексттин планын түзүп ырааттуу айтып бергиле."},{"t":"p","h":"3. Көп чекиттин ордуна ылайык келген сөздү койгула:"},{"t":"p","h":"а) Эр...... эрдик саналып, кишини киши ...... ‚ адамды адам ............ кылган заман экен."},{"t":"v","l":["б) Ошондой ... ...... ..... ...... биринде ...... бир куш ...... ...... .","в) Ал күнү кыргыз......... ‚ Күлчө баатырдын ...... бергени жаткан.","г) ...... жоо, ...... курчап жаткан.","д) ...... карылар, ...... жаш балдар ...... ...... кырылышты.","4. Тексттен сын атоочко жооп берген сөздөрдү тапкыла.","Үлгүсү: Чыпалак чыпалактай бала болуптур."]},{"t":"p","h":"<span class=\"pg\" data-n=\"80\">80<\/span>II"},{"t":"h3","h":"Ойноок бала менен секелек кыз"},{"t":"p","h":"Мына ошондо токойдон ойноо бала, секелек кыз чыкты. Тилазар балдар эртең менен эле токойго чуркап кеткен."},{"t":"p","h":"«Баласың да» деген ошо да, ал экөө токой аралап, кабыктан себет токумак да ага толтура карагат-бүлдүркөн термек. Каткыра күлүп, так секире ойноп жүрүп, күн убагын унутушкан. Бир маалда айыл тараптан ызы-чуу чыкканда элеңдеп артка чуркашты. Экөө чуркап отуруп, жетип келип, кыргын тийген өлүү журттан эч кимди таппады. Ата-энеден кабар жок, ага-эжеден дайын жок. Экөө улам бир үйдүн ордуна чуркады. Бырыксыган күл жатат, үч буту көктү карап тулга жатат. Эси чыккан эки бала заматта же эртең мененки калың эли жок, же эртенки күнү белгисиз, же кечээки ата теги жок, өлүү журтта жетим калды. Алыста токой үстүнөн чаң уюлгуп, мал айдаган жоо кетип баратты. Уул бала, кыз бала кол кармашып, «токтогула» деп суранып, «ала кеткиле» деп жалынып, жоо артынан чуркады. Жер дүңгүрөгөн доош ичинде, күтүрөгөн калың дабырт үстүндө ал экөөнүн алсыз үнүн ким укмак."},{"t":"p","h":"Эки бала көпкө чуркады, кууп жете албады. Эч ким кайрылбады. Мууну бошогон балдар жер кучактап жыгылды. Кылчаюдан коркушту, кыбыроодон чочушту. Эси чыккан эки бала кучакташып, калч-калч калтырап, улутуна бышактап жатып уктап калды."},{"t":"p","h":"«Жетимдин жары кыдыр, бирок тагдыры жети ача» деген ак сөз. Түн бейкут өттү. Сүрдүү токойдун жырткычы тийбеди, желмогузу келбеди. Экөө ойгонсо күн чыгып калыптыр. Токойдон түрлүү канаттуу сайрап, дүйнө эчтеме болбогондой. Экөө турду да, из кубалап дагы жөнөдү. Мөмө-чөмө менен өзөк жалгап жүрүп отурушту. Үч күн, үч түн дегенде бир бийик дөбөгө жетип токтошту. ' тилазар (ойноок) балдар – непослушные (озорные) дети"},{"t":"v","l":["* элеңдеп (элендөө)- пугливо озираться вокруг","өлүү журт – безжизненное племя, пустое пепелище","*кечээги ата теги – вчерашние предки","чаң уюлгуп – пыль поднималась столбом"]},{"t":"p","h":"© кылчаюудан коркушту, кыбыроодон чочушту – боялись оглянуться, боялись шевельнуться улутуна бышактап – тяжело вздыхая и всхлипывая"},{"t":"v","l":["түн бейкут өттү – ночь прошла спокойно","токойдун жырткычы тийбеди – не тронули звери грозного леса","жалгап – (обр. выр.) – кое-как утолив голод"]},{"t":"img","src":"data:image/webp;base64,UklGRi5TAABXRUJQVlA4ICJTAABQNgKdASqAAqsBPrVOoUonJCMrrfOcOXAWiWVpgvtW2ZMchFCViJCNEiEcB+rWun+ibIG0BUYf8Xxy/Y/qDxFcrO3a9umboe9rYVkpHnENRDllt6vL/zn/ZyNu7fN38sJpf+jyd/Pd7z5kN+PCr+/HnXf7+t35z/7fPm9e/TL/09CX/8elz8xOlaUtrOt864DmiJZm6DlKkyE2/U11+cn8Uam5RCwFIAMCt8GTdOAXgydc7BotWPnoPvKzYaKm406JsSu5TBNtG1pbsgJ/8o2cGd3ubrpLYi/IRcghLs0BOBidlfkrrpihJ6WTdEMeJhFdy78Z548sdCEpo5IQTyr7qbXZfiRJrSEPAaI8QQ6EwhkAD+W04u5NDVE6U4bN023U7UU45H3ZuS3F/hnqnBoOCPFz95ioPeUIuTSofpiOhf7oVkXNVd6hH+ycP6tEJK2+6hdOMivozVIpRsE8TZfnWlvQa2So6jUok5DEj2g0rMJoKqhD5N1iTaxiq0NOxD3xzaxIBjSlLzXpYtlt5Zc3wns/pwYMJilr8gTSEHseyFpbQZAKvoCc0xRvbo37ImO4WEWT5nn3PqjPOlbTXF6ILimZccbhi9Ja7eR+ut/uMUd0eYp6sY4805ot5EYPZ7viXnTDl6pa4t9pQ1cgDf5IZGBUOOfhi8e9XoAp+Z1Nr201G1PAoi9P1RgI3PX3tC7M2O3RcUPwqlOtuQl8yWzuilFqvGW+HgoFFw7yyjkW1GcSM7tczJRg7yJljD+FiTQCmE3whaP+APWFCCVM4W1VVTqCQhTxnqmZfh+KEEwuLmW8jzMtk0zhNCJ0IYnDnJ3OIegQ0xrGzCTOkZs55pu18FPeYzINMFSORMWNfKbxf/yYEy4SfkFG6SSDGvfE2FPpsVxyltBpIgqD/SMnlk+nv9RSBrdUW/1kBDpHYE1mnOwuJ6JNnlxXHQZsJzdC86qIPQhOm0Jkm2XW30pmSUIj4TGHVRjT/wFobBoGnd1jZ1hKiWxe7zYXRuK5W3g9BQU2AMuP4PSccFwQlYrR1HQB2CBjzyvKk4ZjJfAmrKkh9AD80IgRlaSOIrd8Ec2Ty4eYQGUb

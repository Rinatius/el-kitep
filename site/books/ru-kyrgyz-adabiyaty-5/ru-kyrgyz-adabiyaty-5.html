ен ушуга макулсуңбу? — ты на это согласен?"},{"t":"p","h":"малчы - 1. скотовод, скотник; 2. пастух"},{"t":"p","h":"малчылык — скотоводство"},{"t":"p","h":"мамалак — медвежонок"},{"t":"p","h":"мамлекет — государство; биздин мамлекетибиз — наше государство; чет мамлекеттер — иностранные государства"},{"t":"p","h":"мамы - столб"},{"t":"p","h":"мамык - пух (птичий); мамык жаздык — пуховая подушка; мамык төшөк - пуховая постель"},{"t":"p","h":"мандалак — тюльпан"},{"t":"p","h":"мандем - недостаток, изъян, дефект"},{"t":"p","h":"манжа, беш манжа - 1. пятерня; 2. палец; колдорунун манжалары — пальцы его рук"},{"t":"p","h":"мансап - карьера, положение"},{"t":"p","h":"мансапкор — карьерист"},{"t":"p","h":"мара — финиш"},{"t":"p","h":"март — щедрый; март киши — щедрый человек"},{"t":"p","h":"машык — упражняйся, приобретай навыки, научись; гимнастикалык машыгуу — гимнастическое упражнение"},{"t":"p","h":"ме - на, возьми; ме, ал - на, бери"},{"t":"p","h":"мейиз — изюм (сушеный виноград)"},{"t":"p","h":"мейкин — просторный, обширный; мейкин талаа — широкая степь; мейкин жайлоо — обширное летнее пастбище"},{"t":"p","h":"мейман - гость"},{"t":"p","h":"меймандос — гостеприимный, хлебосольный"},{"t":"p","h":"мейманкана — гостиница"},{"t":"p","h":"мекен, ата мекен - отечество, отчизна, родина"},{"t":"p","h":"мектеп — школа; орто мектеп — средняя школа; мектеп-интернат — школа-интер<span class=\"pg\" data-n=\"155\">155<\/span>нат; мектеп жашындагы балдар - дети школьного возраста"},{"t":"p","h":"мен - я; менде - у меня; менден - от меня; мен өзүм — я сам; мени менен — со мной; мен үчүн — для меня; мага анын кереги жок — мне он не нужен."},{"t":"p","h":"меш — печь, печка"},{"t":"p","h":"миз — острие, лезвие (ножа, меча)"},{"t":"p","h":"мин — садись верхом; атка мин — садись верхом на лошадь"},{"t":"p","h":"мисал — пример; мисалга келтирүү — приводить в качестве примера; мисалы — например"},{"t":"p","h":"мисте — фисташка"},{"t":"p","h":"момун — скромный, смирный, безвредный; момун бала - тихий (смирный) мальчик"},{"t":"p","h":"мончо — баня"},{"t":"p","h":"мончок — бусы, ожерелье"},{"t":"p","h":"мор - труба; дымоход; мештин мору — печная труба"},{"t":"p","h":"морт — хрупкий, ломкий; морт металл — хрупкий металл; морт жыгач — хрупкое дерево"},{"t":"p","h":"муз — лёд; муз тебүү — кататься на коньках (санках); муз доору — ледниковый период"},{"t":"p","h":"муздак — холодный, студеный; муздак шамал - холодный ветер; муздак суу — холодная вода"},{"t":"p","h":"муздаткыч — холодильник"},{"t":"p","h":"музоо — телёнок; музоо баш — фаланга"},{"t":"p","h":"муктаж — нуждающийся; муктаж болуу — испытывать потребность; нуждаться; мен муктаж эмесмин - я не нуждаюсь"},{"t":"p","h":"муң - 1. печаль, тоска, грусть, уныние; 2. жалоба, обида; ал муңун айткысы келди — он хотел рассказать свою жалобу"},{"t":"p","h":"мурунтук — поводок; өгүздүн мурунтугу — поводок быка"},{"t":"p","h":"мурут — усы"},{"t":"p","h":"мурч — чёрный перец"},{"t":"p","h":"муун - сустав"},{"t":"p","h":"мушташ — драка, схватка"},{"t":"p","h":"муштум — кулак"},{"t":"p","h":"мүйүз — рог, рога; бугунун мүйүзү — оленьи рога; тоо текенин мүйүзү — рога горного козла; кочкор мүйүз - 1) бараний рог; 2) улитка"},{"t":"p","h":"мүнөз - нрав, характер; мүнөзү жакшы жигит — парень доброго нрава (хорошего характера); мүнөзү жаман адам - человек с плохим (скверным) характером"},{"t":"p","h":"мүрзө — могила"},{"t":"p","h":"мүрөк, мүрөктүн суусу - живая вода (миф.)"},{"t":"p","h":"мык — гвоздь; мык кагуу — забить гвоздь"},{"t":"p","h":"мылтык — винтовка; ружьё"},{"t":"p","h":"мына - вот; это; мына бу эмне? — что это? что это такое? мына ушундай абал - вот такое положение; мына мында — вот здесь"},{"t":"p","h":"мышык — кошка"},{"t":"p","h":"мээ — мозг; баш мээ — головной мозг; кара куш мээ — мозжечок"},{"t":"p","h":"мээлей — перчатки, рукавицы, варежки"},{"t":"p","h":"мээлөө — прицелиться, взять на прицел"},{"t":"h3","h":"Н"},{"t":"p","h":"набат — леденцы (сахар в кристаллах)"},{"t":"p","h":"назик — нежный, тонкий, изящный, утончённый; назик үн — нежный голос; назик мамиле — нежное (ласковое) отношение"},{"t":"p","h":"най — флейта"},{"t":"p","h":"найза — пика, копьё"},{"t":"p","h":"намыс - 1. честь, совесть, достоинство; 2. стыд, позор; намыс кылуу — стыдиться; намыс көрүү — считать для себя позорным"},{"t":"p","h":"<span class=\"pg\" data-n=\"156\">156<\/span>нан - хлеб; буудай нан - пшеничный хлеб; ак нан — белый хлеб; кара нан — серый хлеб, ржаной хлеб"},{"t":"p","h":"нар — одногорбый верблюд"},{"t":"p","h":"наристе — младенец"},{"t":"p","h":"насаатчы - наставник"},{"t":"p","h":"натыйжа - результат, последствие, исход; жалкоолуктун натыйжасы - последствие лени"},{"t":"p","h":"начар — слабый, немощный, плохой, неважный; начар оюнчу — слабый игрок; начар иш — слабая работа"},{"t":"p","h":"негизги — основной; негизги мыйзам - основной закон; негизги маселе — основной вопрос"},{"t":"p","h":"негизде — обоснуй, аргументируй"},{"t":"p","h":"нике — брак, бракосочетание"},{"t":"p","h":"ноокас — больной; ноокас адам — больной человек"},{"t":"p","h":"нөшөр — ливень, проливной дождь"},{"t":"p","h":"нук — русло; арыктын эски нугу — старое русло арыка"},{"t":"h3","h":"О"},{"t":"p","h":"обон - напев; мотив; мелодия; ырдын обону — мелодия песни; элдик обондор - народные мелодии; обон салуу — петь"},{"t":"p","h":"ойгон — проснись; бала таңга жуук ойгонду — ребёнок проснулся к утру"},{"t":"p","h":"ойлон — задумайся, раздумывай; ойлонуп калуу — призадуматься; мен түнү бою ойлонуп чыктым - я всю ночь раздумывал"},{"t":"p","h":"оймок — напёрсток"},{"t":"p","h":"ойно - играй, забавляйся, развлекайся; балдар футбол ойноп жүрүшөт - ребята играют в футбол; ал роялда жакшы ойнойт — он хорошо играет на рояле"},{"t":"p","h":"ок — стрела, пуля; жаанын огу - стрела лука; ок жаадыруу — осыпать градом пуль"},{"t":"p","h":"окуучу — ученик, ученица, учащийся"},{"t":"p","h":"окуя — случай, событие, происшествие; тарыхый окуя — историческое событие; кызыктуу окуя — интересный случай"},{"t":"p","h":"олтур, отур — садись, сиди, посиди, присаживайся; орундукка отуруңуз - садитесь на стул; сиз бир аз олтура туруңуз — вы немного посидите"},{"t":"p","h":"оңой — лёгкий, легко выполнимый, несложный; оңой суроо — лёгкий вопрос; оңой жумуш — лёгкая работа"},{"t":"p","h":"оңолуу — исправиться, наладиться, оправиться"},{"t":"p","h":"ооздук - удила (часть узды)"},{"t":"p","h":"оокат - 1. пища, кушанье, еда, продовольствие, питание; оокат ичүү — кушать, есть; түшкү оокат — обед; кечки оокат — ужин; 2. хозяйство, имущество; үй оокат — домашнее хозяйство"},{"t":"p","h":"оор - 1. тяжёлый; тяжеловесный, грузный, тяжело, грузно; оор жүк — тяжёлый груз; тяжёлая ноша; оор салмактуу — тяжеловесный; оор индустрия - тяжёлая индустрия; 2. трудный, сложный; оор абал — трудное положение; оор иш — трудное дело"},{"t":"p","h":"оорукана — больница"},{"t":"p","h":"оорулуу - больной; оорулуу адам — больной человек"},{"t":"p","h":"оорчулук — трудность, тягость; турмуштун оорчулугу — трудность жизни"},{"t":"p","h":"орнот - установи, укрепи, закрепи; эстелик орнот -установи памятник; мамы орнот - установи столб"},{"t":"p","h":"ороо I - яма для хранения зерна"},{"t":"p","h":"ороо II - 1. повязка, обмотка: 2. пелёнка"},{"t":"p","h":"орто — середина, средний; жолдун ортосуна чейин — до середины дороги; орто билим - среднее образование; орто <span class=\"pg\" data-n=\"157\">157<\/span>мектеп — средняя школа; орто бойлуу — среднего роста; орто кылымдарда — в средних веках"},{"t":"p","h":"орундоо — выполнение, исполнение"},{"t":"p","h":"орундук — сиденье, стул, табуретка"},{"t":"p","h":"орундуу — имеющий место, местный"},{"t":"p","h":"оруу - жатва; оруу-жыюу — уборка"},{"t":"p","h":"осуят — завещание, завет"},{"t":"p","h":"отургуз — сажай, посади; биз дарак отургуздук — мы посадили деревья; баланы орундукка отургуз — посади ребёнка на стул"},{"t":"p","h":"отун — дрова, топливо; отун жаруу - колоть дрова"},{"t":"p","h":"ошентип — так и так, таким образом"},{"t":"p","h":"ошо, ошол - тот (та, то); ошо күнү кечинде - в тот день вечером; сен ошол жигитти тааныйсыңбы? - ты знаком с тем парнем?"},{"t":"p","h":"оюн - игра; забава; шутка; шалость; спорттук оюндар — спортивные игры; кызык оюн - интересная игра; топ оюну - игра в мяч"},{"t":"p","h":"оюнчук — игрушка; балдардын оюнчуктары - детские игрушки"},{"t":"h3","h":"Ө"},{"t":"p","h":"өгөй — неродной; сводный; өгөй бала - неродной ребёнок; өгөй эне — мачеха; өгөй ата - отчим; өгөй уул — пасынок; өгөй кыз - падчерица"},{"t":"p","h":"өгөө — напильник"},{"t":"p","h":"өгүз — вол (кастрированный бык)"},{"t":"p","h":"өгүнү — недавно; өгүнү барып келгенбиз — мы недавно съездили"},{"t":"p","h":"өзгөр — изменяйся, меняйся; аба ырайы тез өзгөрүп кетти — погода быстро изменилась; сен таптакыр өзгөрүп калыптырсың — ты совершенно изменился; ты стал совсем иным"},{"t":"p","h":"өкүл — представитель, посланец, уполномоченный, доверенное лицо"},{"t":"p","h":"өкүнүү — раскаяться, сожалеть о случившемся"},{"t":"p","h":"өл - умри; скончайся; өз ажалы менен өлдү — он умер (скончался) своей смертью"},{"t":"p","h":"өлкө — край, страна; чыгыш өлкөлөрү — восточные страны"},{"t":"p","h":"өлчө — померь, примерь, измеряй, взвешивай; өлчөп көрүү — примерить"},{"t":"p","h":"өмүр — жизнь; узак өмүр — долгая жизнь; өмүр сүрүү — проводить жизнь; существовать, жить; өмүр баян — автобиография"},{"t":"p","h":"өнөкөт — привычка; өнөкөт алуу - привыкать; өнөкөт оору — хроническая болезнь"},{"t":"p","h":"өнөр — ремесло; искусство; кол өнөрү — рукоделие"},{"t":"p","h":"өнүк — развивайся, расти"},{"t":"p","h":"өп — целуй, поцелуй"},{"t":"p","h":"өпкө — лёгкие; өпкө оорусу — заболевание легких; лёгочная болезнь"},{"t":"p","h":"өрдөк - утка"},{"t":"p","h":"өркөч - горб (верблюда)"},{"t":"p","h":"өрөөн - долина; Чүй өрөөнү — Чуйская долина"},{"t":"p","h":"өрт — пожар; өрт өчүрүү — тушить пожар"},{"t":"p","h":"өрүк — абрикос, урюк"},{"t":"p","h":"өстүр — вырасти; выращивай; бак өстүрдүк — мы вырастили сад; ал алты бала төрөп өстүрдү — она родила и вырастила шестерых детей"},{"t":"p","h":"өсүү - рост, развитие, вырастание"},{"t":"p","h":"өт — жёлчь"},{"t":"p","h":"өтө — очень, крайне, весьма; өтө кызык аңгеме — очень интересный рассказ; өтө бийик — очень высокий; өтө зарыл — крайне необходимо"},{"t":"p","h":"өтүк — сапог, сапоги"},{"t":"p","h":"<span class=\"pg\" data-n=\"158\">158<\/span>өтүү — проходить, прохождение, минование"},{"t":"p","h":"өч — злоба, месть; өч алуу — мстить, отомстить; экөөбүз өч болуп кеттик — мы с ним стали врагами (мы с ним враждуем между собой)"},{"t":"p","h":"өчүргүч: өрт өчүргүч - 1. огнетушитель; 2. пожарник"},{"t":"p","h":"өчүрүү — 1. гасить, тушить; 2. вычеркнуть, стереть"},{"t":"h3","h":"П"},{"t":"p","h":"пайда, пайда болуу — появляться, возникать"},{"t":"p","h":"палоо — плов; палоо басуу — приготовить плов"},{"t":"p","h":"пар, пар жаздык — подушка из птичьего пера"},{"t":"p","h":"паракор — взяточник"},{"t":"p","h":"парда - занавес, занавеска"},{"t":"p","h":"пас - низ, низкий, низко; бою пас — низкого роста"},{"t":"p","h":"пахта — хлопок, хлопчатник"},{"t":"p","h":"пил — слон"},{"t":"p","h":"пилла — кокон, шелковичное сырье"},{"t":"p","h":"пияз — лук"},{"t":"p","h":"пияла — пиала"},{"t":"h3","h":"С"},{"t":"p","h":"саа - подои; уй саа — подои корову"},{"t":"p","h":"саамай - волосы на висках, оставляемые при стрижке"},{"t":"p","h":"саамал — молодой (неперебродивший) кумыс"},{"t":"p","h":"саан — дойная; саан уй — дойная корова, саанчы — доярка"},{"t":"p","h":"сабиз — морковь"},{"t":"p","h":"сагызган — сорока"},{"t":"p","h":"сагын — скучай, тоскуй; бала энесин сагынды - ребёнок соскучился по матери."},{"t":"p","h":"сагынуу — скучать, тосковать, соскучиться"},{"t":"p","h":"сайгак — овод; уйлар сайгактан коркот — коровы боятся овода"},{"t":"p","h":"сайма — вышивка, саймала - расшивай узорами, вышивай"},{"t":"p","h":"сайын, күн сайын - с каждым днём; саат сайын - с каждым часом; жыл сайын — ежегодно, из года в год; ай сайын — ежемесячно; күн өткөн сайын - с каждым днём"},{"t":"p","h":"сакал - борода; сакал коюу - отпускать бороду; сакал алдыруу - бриться (у парикмахера)"},{"t":"p","h":"сактык - осторожность; сактыкка кордук жок (погов.) — от осторожности вреда нет; сактык кассасы — сберегательная касса"},{"t":"p","h":"салаа - 1. палец; баланын арык салаалары - худые пальцы ребёнка; 2. промежуток между пальцами"},{"t":"p","h":"саламдаш - поздоровайся; коноктор менен саламдаш — поздоровайся с гостями"},{"t":"p","h":"салгылашуу — битва, сражение"},{"t":"p","h":"салмак - вес, тяжесть; оор салмак - тяжеловес; тирүүлөй салмак — живой вес; таза салмак - чистый вес; жүктүн салмагы — тяжесть груза"},{"t":"p","h":"салмакта - определи (прикидывай) вес на руке"},{"t":"p","h":"салт - обычай, традиция, нрав; улуттук салт - национальный обычай; салт боюнча — по обычаю, по традиции"},{"t":"p","h":"салтанат — торжество; майрамдык салтанат — праздничное торжество"},{"t":"p","h":"саман - солома"},{"t":"p","h":"самоор — самовар"},{"t":"p","h":"самын — мыло"},{"t":"p","h":"<span class=\"pg\" data-n=\"159\">159<\/span>сан - I. бедро жоон сан — верхняя (толстая) часть бедра"},{"t":"p","h":"сан - II. число, количество"},{"t":"p","h":"сана — считай, подсчитывай; мен санап койдум — я подсчитал; акча сана - считай деньги; жыл санап - с каждым годом"},{"t":"p","h":"санаасыз — беззаботный"},{"t":"p","h":"сандык — сундук"},{"t":"p","h":"сап - рукоятка, черенок; бычак сап - рукоятка ножа; черенок ножа; балта сап — топорище; чалгынын сабы - черенок косы"},{"t":"p","h":"сапат — качество; сапат белгиси менен — со знаком качества; жогорку сапат — высокое качество; адамдык сапат - человеческое качество"},{"t":"p","h":"сараң - скупой, скряга"},{"t":"p","h":"сары - 1. жёлтый; сары гүл — жёлтый цветок; сары боёк - жёлтая краска; жумуртканын сарысы — желток"},{"t":"p","h":"сарык — желтуха"},{"t":"p","h":"сат — продай; сатып бер - купи (кому-л.); сатып ал - купи себе; сатып алуучу — покупатель"},{"t":"p","h":"саякат — путешествие, странствие, дальняя поездка; саякат кылуу — путешествовать"},{"t":"p","h":"секир — вскакивай, прыгай; арыктан секирип өт — перепрыгни через арык; дубалдан секирип түшүү — спрыгивать со стены"},{"t":"p","h":"сексен — восемьдесят; акындын сексен жаштыгы - восьмидесятилетие поэта"},{"t":"p","h":"сел — сель, селевой поток"},{"t":"p","h":"селкинчек - качели"},{"t":"p","h":"семиз — жирный, упитанный, тучный; семиз мал — жирный скот; семиз жылкы — жирная лошадь; семиз жер — жирная земля"},{"t":"p","h":"сергектик — бодрость"},{"t":"p","h":"серги — проветривайся, освежись, передохни; таза абада жүрүп сергип калдым - побывав на свежем воздухе, я передохнул"},{"t":"p","h":"сиңди — младшая сестра (в отношении старшей сестры)"},{"t":"p","h":"согончок — пятка"},{"t":"p","h":"сой — режь; кой сойду - он резал барана; чочко сой — заколи свинью"},{"t":"p","h":"сойло — ползи, двигайся ползком, биздин алдыбыздан жылан сойлоп өттү - перед нами проползла змея"},{"t":"p","h":"сокку — отпор, удар; биз катуу сокку урдук — мы дали крепкий отпор"},{"t":"p","h":"соко — плуг; соко айдоо - пахать плугом"},{"t":"p","h":"соку — ступа"},{"t":"p","h":"сокур — слепой"},{"t":"p","h":"соңку — последний, последующий; соңку күндөрдүн ичинде - в течение последних дней"},{"t":"p","h":"соо - здоровый; баланын дени-карды соо — ребёнок физически здоров; соо бол! — будь здоров! аман-соо — здоров и невредим"},{"t":"p","h":"соодагер — торговец"},{"t":"p","h":"соодалашуу — торговаться, торговля"},{"t":"p","h":"сөзсүз — безусловно, обязательно, безоговорочно"},{"t":"p","h":"сөйкө — серьги"},{"t":"p","h":"сөөл — бородавка"},{"t":"p","h":"сөөлжан — дождевой червь"},{"t":"p","h":"сөөмөй - указательный палец"},{"t":"p","h":"сугар - 1. напои; атты сугар — напои коня, 2. поливай, орошай; огородду сугар — полей огород, сугатчы — поливальщик"},{"t":"p","h":"суз — хмурый, замкнутый, мрачный; анын кабагы суз — у него хмурый вид"},{"t":"p","h":"сулу - овёс"},{"t":"p","h":"сулуу — красивый, сулуулук - красота"},{"t":"p","h":"<span class=\"pg\" data-n=\"160\">160<\/span>сурак — допрос, сурак кылуу — допрашивать"},{"t":"p","h":"суран — отпросись, ал беш күнгө суранды — он отпросился на пять дней; мен сизден көптөн-көп суранамын - я вас убедительно прошу"},{"t":"p","h":"суу — вода, сууга түшүү — купаться"},{"t":"p","h":"суук — мороз, холод, холодно"},{"t":"p","h":"суула - намочи водою, делай влажным (мокрым)"},{"t":"p","h":"суулук - 1. удила; 2. полотенце"},{"t":"p","h":"суут — остуди, охлаждай; тамакты суутуп ичүү — остудив, есть пищу"},{"t":"p","h":"суюк - 1. жидкий; суюк заттар - жидкие вещества; 2. редкий (негустой); суюк чач — редкие волосы"},{"t":"p","h":"сүзүү — плавать, плавание"},{"t":"p","h":"сүйлө — говори; акырын сүйлө - говори тихо; бат сүйлө — говори быстро"},{"t":"p","h":"сүйрө - тяни, тащи, волочи; сен муну кайда сүйрөп баратасың? - куда ты его тащишь?"},{"t":"p","h":"сүйүн — радуйся; обрадуйся; биз абдан сүйүндүк — мы очень обрадовались"},{"t":"p","h":"сүйүү — любовь; мекенди сүйүү — любовь к родине"},{"t":"p","h":"сүйүшүү — 1. любить друг друга; 2. целоваться"},{"t":"p","h":"сүлгү — полотенце"},{"t":"p","h":"сүлөөсүн — рысь"},{"t":"p","h":"сүргүн — ссылка; сүргүнгө айдоо - отправить в ссылку"},{"t":"p","h":"сүрт — вытри, сотри"},{"t":"p","h":"сүт — молоко; уйдун сүтү — коровье молоко; чийки сүт — сырое молоко"},{"t":"p","h":"сыз — черти, проводи черту (линию); астын сыз — подчеркни; сызып ташта вычеркни, зачеркни."},{"t":"p","h":"сызгыч — линейка"},{"t":"p","h":"сызыкча — чёрточка; тире"},{"t":"p","h":"сыйлоо - 1. уважать, угощать; 2. наградить, премировать"},{"t":"p","h":"сыйпа — намажь; нанга май сыйпа - намажь хлеб маслом"},{"t":"p","h":"сыр - тайна"},{"t":"p","h":"сырда - покрась; эшикти сырда - покрась дверь"},{"t":"p","h":"сыркоо - 1. болезнь; 2. больной; сыркоо киши — больной человек"},{"t":"p","h":"сыяктуу — подобный, аналогичный; ушул сыяктуу — подобно этому; сен сыяктуу — тебе подобный"},{"t":"h3","h":"Т"},{"t":"p","h":"таалай - счастье; судьба; таалайы бар адам — счастливый (удачливый) человек"},{"t":"p","h":"таан — галка"},{"t":"p","h":"таанымал - знакомый, известный; баарыбызга таанымал адам - всем нам известный человек"},{"t":"p","h":"табак — миска, чаша, блюдо"},{"t":"p","h":"табият — природа"},{"t":"p","h":"табуу - найти, находить; табуу керек — надо найти"},{"t":"p","h":"табыш - звук, шорох"},{"t":"p","h":"табышмак - загадка"},{"t":"p","h":"тагдыр — судьба; предопределение, рок; балдардын тагдыры жөнүндө ойлоо — думать о судьбе детей"},{"t":"p","h":"таза — чистый; чистоплотный, опрятный; таза аба — чистый воздух, свежий воздух; таза суу — чистая вода; таза киши — чистоплотный человек; таза кийим — чистая одежда"},{"t":"p","h":"тайган — борзая"},{"t":"p","h":"тайлак — верблюжонок"},{"t":"p","h":"така - 1. подкова; аттын такасы - конская подкова; 2. каблук; өтүктүн такасы — каблук сапога; бийик така өтүк — сапоги на высоких каблуках"},{"t":"p","h":"<span class=\"pg\" data-n=\"161\">161<\/span>такта, тактай — доска, тёс; полдук тактайлар — доски для пола (половые доски); ардак тактасы — доска почёта"},{"t":"p","h":"тактооч — наречие"},{"t":"p","h":"тал - ива, тальник; мажүрүм тал — плакучая ива"},{"t":"p","h":"талаа - степь, поле; талаа жумуштары — полевые работы; пахта талаасы - хлопковое поле; куу талаа - сухая степь, пустыня"},{"t":"p","h":"талаш — спор, дискуссия, дебаты; талаш маселе — спорный вопрос"},{"t":"p","h":"талоончу - грабитель"},{"t":"p","h":"там, үй — дом; там салуу — строить дом; жер там — землянка; жыгач там — деревянный дом"},{"t":"p","h":"тамсил — басня"},{"t":"p","h":"тамчы - капля; жамгырдын тамчылары - капли дождя"},{"t":"p","h":"таңдай - нёбо"},{"t":"p","h":"тап — найди, находи; ал өзүнө жакшы иш таап алды — он нашёл себе хорошую работу; жоголгон буюмуңду таптыңбы? — ты нашёл свою потерянную вещь?"},{"t":"p","h":"тапанча — револьвер, пистолет"},{"t":"p","h":"тапкыч — находчивый, ловкий в поисках; тапкычтык — находчивость"},{"t":"p","h":"тапшырма - поручение, задание; үй тапшырма — домашнее задание; тапшырма берүү — дать задание"},{"t":"p","h":"таразачы — весовщик"},{"t":"p","h":"тарак - гребень, расчёска, таран — причёсывайся"},{"t":"p","h":"тарамыш — сухожилие"},{"t":"p","h":"таранчы — воробей"},{"t":"p","h":"тарбия - воспитание; ата-эненин тарбиясында болуу — быть на воспитании родителей; тарбия көргөн бала - воспитанный мальчик"},{"t":"p","h":"тарт - взвесь; таразага тарт — взвешивай (что-л.) на весах"},{"t":"p","h":"таруу — просо"},{"t":"p","h":"тасторкон — 1. скатерть; тасторкон жаюу — расстилать скатерть; 2. дастархан (скатерть с угощением)"},{"t":"p","h":"татаал — сложный; трудный; татаал маселе — сложный вопрос; татаал жол - труднопроходимая дорога; татаал сөз — сложное слово"},{"t":"p","h":"таттуу — сладкий; таттуу коон — сладкая дыня; таттуу уйку — сладкий сон"},{"t":"p","h":"таш - 1. камень; таш үй — каменный дом; таш көпүрө -каменный мост; асыл таш — драгоценный камень; таш бака — черепаха; 2. гиря"},{"t":"p","h":"таштоо — бросать, кидать, забрасывать; иш таштоо — забастовка; алып таштоо — снятие"},{"t":"p","h":"ташы - тащи, перевози; отундарды сарайга ташып киргизүү — перенести дрова в сарай"},{"t":"p","h":"таяныч — опора"},{"t":"p","h":"тебетей — шапка"},{"t":"p","h":"тебүү — 1. лягать, бить ногой; 2. кататься: коньки тебүү - кататься на коньках; чана тебүү — кататься на санках; велосипед тебүү — кататься на велосипеде"},{"t":"p","h":"тегирменчи — мельник"},{"t":"p","h":"тез — быстро, быстрый, скоро, скорый; тез барып кел — быстро сходи; тез аранын ичинде - в скором времени; ал тез иштейт — он быстро работает"},{"t":"p","h":"теке — козёл; тоо теке — козерог, горный козёл"},{"t":"p","h":"темир — железо; темир кени — железная руда; темир күрөк — железная лопата; темир жол — железная дорога; темир уста — кузнец"},{"t":"p","h":"тентек — 1. озорной; шалун; озорник; тентек бала — озорной мальчишка; тентек болуу — шалить, озорничать; 2. дурень, дурак"},{"t":"p","h":"теңсиздик — неравенство"},{"t":"p","h":"<span class=\"pg\" data-n=\"162\">162<\/span>теңтуш — ровесник, сверстник"},{"t":"p","h":"тердик — потник"},{"t":"p","h":"теребел — окрестность, вокруг; ал теребелге көз чаптырды - он оглядел окрестности"},{"t":"p","h":"терезе — окно, эки ачмалуу терезе — двустворчатое окно; терезе парда - занавеска"},{"t":"p","h":"терек — тополь"},{"t":"p","h":"терең — глубокий; терең көл — глубокое озеро; терең дарыя - глубокая река"},{"t":"p","h":"тескерисинче - наоборот; бардыгын тескерисинче иштөө — делать всё наоборот"},{"t":"p","h":"тиги, тигил — тот (та, то); вон тот (та, то); тиги баланын аты ким? - как зовут того мальчика? тиги жакта - там, в той стороне"},{"t":"p","h":"тизме — список; тизме түзүү — составить список"},{"t":"p","h":"тийиш — необходимо, должно; биз барууга тийишпиз — мы должны идти; ушундай болууга тийиш - так должно быть"},{"t":"p","h":"тийүү — касаться, трогать, нападать"},{"t":"p","h":"тик — отвесный, крутой, 2. ставь (юрту); 3. шей, көйнөк тигүү — шить платье"},{"t":"p","h":"тил - язык; тилиңди сун — высунь язык; эне тил - родной язык; адабий тил — литературный язык; тил үйрөнүү — изучение языка"},{"t":"p","h":"тилмеч — переводчик, толмач"},{"t":"p","h":"титирөө — дрожать, дрожь, дрожание; жер титирөө — землетрясение"},{"t":"p","h":"тозок - 1. ад; 2. мука, мучение"},{"t":"p","h":"той I - той, пир, празднество; үйлөнүү тою — свадьба"},{"t":"p","h":"той II — наедайся; кардым тойду - я наелся; этке тойдуңбу? — ты насытился мясом?"},{"t":"p","h":"ток — сытый; кардым ток - я сыт; ачсыңбы же токсуңбу? — ты голоден или сыт?"},{"t":"p","h":"токмок — колотушка, токмокто — бей дубиной, поколоти"},{"t":"p","h":"токой — лес; жалгыз дарак токой болбойт (погов.) — одинокое дерево леса не составляет; токой чарбасы - лесное хозяйство, токойчу — лесник"},{"t":"p","h":"токоч — хлеб, лепёшка (домашнего приготовления в разных формах)"},{"t":"p","h":"толкун — волна; деңиз толкуну — морская волна; аба толкуну — воздушная волна"},{"t":"p","h":"толук — полный, полностью; планды толук аткаруу — полностью выполнить план; толук ишеним — полное доверие; толук эркиндик — полная свобода"},{"t":"p","h":"томолонуу - катиться, скатываться, томолотуу - катить, скатывать; ташты томолотуу - скатить камень"},{"t":"p","h":"тон — шуба, тулуп; чолок тон — полушубок"},{"t":"p","h":"тоо — гора, горы; бийик тоо (аскар тоо) — высокая гора; тоонун этеги — подножие горы"},{"t":"p","h":"тоок — курица; тооктун эти — курятина"},{"t":"p","h":"тооккана — курятник"},{"t":"p","h":"тоолук — горный житель, горец"},{"t":"p","h":"тоос — павлин"},{"t":"p","h":"топоз — як"},{"t":"p","h":"топтоо — собрать, сбор, собирание; үрөн топтоо — сбор семян (засыпка семян); күчүн топтоо — набираться сил"},{"t":"p","h":"топчу — пуговица; топчу тагуу — пришивать пуговицы; топчусун чечүү — расстёгивать пуговицы"},{"t":"p","h":"топчула - застёгивай на пуговицы"},{"t":"p","h":"топчулук - петля (для пуговицы)"},{"t":"p","h":"торгой — жаворонок; торгойлор сайрайт — поют жаворонки"},{"t":"p","h":"торпок - телёнок (в возрасте от шести-семи месяцев и до года), бычок"},{"t":"p","h":"тоту, тоту куш — попугай"},{"t":"p","h":"<span class=\"pg\" data-n=\"163\">163<\/span>төк — вылей, пролей, слей, разлей; высыпай, рассыпай; сууну төгүп ташта - вылей воду; кумду кайсы жерге төгөбүз? — куда будем сыпать песок?"},{"t":"p","h":"төл - приплод; малдын төлү — приплод скота"},{"t":"p","h":"төлө — плати, уплати, заплати; акчаны кассага төлө — плати деньги в кассу; ал айып төлөдү — он заплатил штраф; карыздарыңды төлөдүңбү? — ты расплатился с долгами?"},{"t":"p","h":"төмөн - низ, вниз; сууну төмөн карай агызып жибер — пусти воду вниз; ал жогортон төмөн түшүп келди — он спустился сверху вниз; анын баасы төмөн — он ниже по цене"},{"t":"p","h":"төө — верблюд; эки өркөчтүү төө — двугорбый верблюд; нар төө — одногорбый верблюд; төөнүн чуудасы — длинная верблюжья шерсть"},{"t":"p","h":"төөнөгүч — булавка"},{"t":"p","h":"төрөт — роды (у женщины); төрөт үйү — родильный дом"},{"t":"p","h":"төшөк, төшөнчү — постель, постельные принадлежности; конокторго төшөк салуу — стелить постель для гостей"},{"t":"p","h":"туз - соль; кайнатма туз — поваренная соль; таш туз — каменная соль; деңиз тузу — морская соль; шорпонун тузу ачуу экен — суп пересолен"},{"t":"p","h":"тузда — посоли; этти туздап кой — посоли мясо"},{"t":"p","h":"тулпар — тулпар (боевой конь, выдающийся скакун)"},{"t":"p","h":"тумак — малахай, ушанка, шапка"},{"t":"p","h":"туман — туман; коюу туман түштү — спустился густой туман"},{"t":"p","h":"тунук — прозрачный, чистый; тунук суу — чистая вода; тунук айнек — прозрачное стекло"},{"t":"p","h":"турмуш — жизнь; элдин турмушу — жизнь народа; коомдук турмуш — общественная жизнь; үй-бүлөлүк турмуш — семейная жизнь; турмуш куруу — жениться; турмушка чыгуу — выходить замуж"},{"t":"p","h":"турна — журавль"},{"t":"p","h":"туткун — 1. пленник, узник; 2. пленение, плен; туткунга түшүрүп алуу — взять в плен"},{"t":"p","h":"туу — знамя; жеңиштин туусу — знамя победы; кызыл туу — красное знамя"},{"t":"p","h":"тууган — родственник, родич, сородич; бир тууган — родной; бир тууган ага — родной (старший) брат"},{"t":"p","h":"туура чыгуу — оказаться верным (правильным), подтверждаться; бул көйнөк сага туура келбейт — эта рубашка тебе не подойдет"},{"t":"p","h":"туш - 1. сторона; ушу тушта - на этой стороне; мектептин оң жак тушунда - на правой стороне школы: туш-туш жакка — в разные стороны; туш-тушунан - со всех сторон; туш келүү — встретиться"},{"t":"p","h":"түбөлүк — постоянно, вечно, навсегда; түбөлүк даңк - вечная слава; түбөлүк эстеп жүрүү — вечно вспоминать"},{"t":"p","h":"түгөй — один из пары; өтүктүн бир түгөйү — один из пары сапог"},{"t":"p","h":"түз — 1. прямой, ровный; прямо, ровно; түз сызык — прямая линия; түз отур — сиди прямо; түз жол — ровная (прямая) дорога; түз жер — ровное место; 2. правдивый, честный, порядочный; түз жүргөн адам — честный человек"},{"t":"p","h":"түй - завязывай, связывай, вяжи; жиптин учун түй — завяжи конец верёвки"},{"t":"p","h":"түйүнчөк - узелок, связка"},{"t":"p","h":"түкүр — плюнь"},{"t":"p","h":"түлкү - лиса, лисица; кара түлкү — чёрно-бурая лиса; түлкүнүн териси - лисий мех; түлкү ичик — шуба из лисьей шкуры"},{"t":"p","h":"түн — ночь; караңгы түн — тёмная ночь; айсыз түн — безлунная ночь; түнү менен (түнү бою) — всю ночь; буурул түн — белая ночь."},{"t":"p","h":"<span class=\"pg\" data-n=\"164\">164<\/span>түр — наматывай, засучивай; ал жипти чыгырыкка түрдү — она намотала нитки на катушку; жеңди түр — засучи рукава"},{"t":"p","h":"түрдүү — разный, разнообразный; ар түрдүү гүлдөр — разные (разнообразные) цветы; ал түрдүү тилдерде сүйлөй алат — он умеет говорить на разных языках"},{"t":"p","h":"түрт — толкни, толкай, подталкивай; чыканагы менен түртүп коюу — подтолкнуть локтем; түртүп чыгаруу — выталкивать; отталкивать в сторону"},{"t":"p","h":"түтүк — 1. трубка, труба, 2. шланг"},{"t":"p","h":"түтүн — дым, дымок; тамекинин түтүнү — табачный дым; коюу түтүн — густой дым"},{"t":"p","h":"түшүү — слезать, спускаться, сниматься, падать, опускаться; төмөн түшүү — спускаться вниз; жерге түшүү — спуститься на землю; сууга түшүү — купаться, сүрөткө түшүү — фотографироваться (сниматься)"},{"t":"p","h":"тыгын — пробка, затычка; бочканын тыгыны — затычка от бочки; бөтөлкөнүн тыгыны - пробка от бутылки"},{"t":"p","h":"тыйын чычкан - белка"},{"t":"p","h":"тыйын - 1. копейка; 2. деньги; жолго тыйын алдыңбы? — деньги на дорогу взял?"},{"t":"p","h":"тымтырс - полное безмолвие, тишина; тымтырс болуу — замолкнуть, быть в полном безмолвии"},{"t":"p","h":"тың — бодрый, крепкий, здоровый, бойкий, ловкий, расторопный; тың жигит — хваткий, стойкий парень"},{"t":"p","h":"тыңчы - тайный агент, сыщик, шпион"},{"t":"p","h":"тырмоо - грабли"},{"t":"p","h":"тыт - тут; тыт жыгач - тутовое дерево"},{"t":"h3","h":"У"},{"t":"p","h":"убада — обещание, убада берүү — дать обещание, обещать; убаданы аткаруу — выполнить обещание; ал убадасына турат — он исполнит своё обещание; он сдержит слово"},{"t":"p","h":"убак, убакыт - время, пора, период; азыркы убакта — в настоящее время; сабак убагында — во время урока (уроков)"},{"t":"p","h":"удаа — подряд, один за другим; үч күн удаа - три дня подряд; ал үч чыны кымызды удаа ичип жиберди - он выпил одну за другой три пиалы кумыса"},{"t":"p","h":"узат — проводи; биз конокторду узатып чыктык — мы проводили гостей, узатуу — проводы"},{"t":"p","h":"узун — длинный, долгий, высокий; узун көйнөк — длинное платье; узун терек — высокий тополь; узун таяк — длинная палка; узун аңгеме — долгий рассказ; узун өмүр — долгая жизнь"},{"t":"p","h":"уй — корова; саан уй — дойная корова; уйдун сүтү — коровье молоко; уйдун эти — говядина; уйгак — репей, репейник"},{"t":"p","h":"уйку — сон; таттуу уйку — сладкий сон; катуу уйку — крепкий сон; анын уйкусу сак — у него чуткий сон (он чутко спит); баланын уйкусу канды — ребёнок выспался"},{"t":"p","h":"улак — козлёнок"},{"t":"p","h":"улар - улар (горная индейка)"},{"t":"p","h":"улуу - 1. великий; улуу держава - великая держава; улуу саякатчы — великий путешественник; улуу акын — великий поэт; 2. старший (по возрасту); ал менден улуу — он старше меня"},{"t":"p","h":"ун — мука; буудай ун — пшеничная мука; ун салдыруу — молоть муку"},{"t":"p","h":"унут — забудь; мен сени унутканым жок — я тебя не забыл; сен бизди унуттуңбу? — ты забыл нас?"},{"t":"p","h":"упа — пудра"},{"t":"p","h":"упчу — соска"},{"t":"p","h":"ур — бей, ударь, колоти; башымды эшикке уруп алдым - я головой ударился о дверь; уруп түшүр — сбей, сшибай"},{"t":"p","h":"<span class=\"pg\" data-n=\"165\">165<\/span>ураан — лозунг"},{"t":"p","h":"урмат — почёт, уважение, почести; урмат кылуу — оказывать почёт; майрамдын урматына - в честь праздника"},{"t":"p","h":"урматта - уважай, оказывай почести"},{"t":"p","h":"уруш I. — драка, ссора; 2. сражение, война"},{"t":"p","h":"уруш II. — поссорься, дерись, ругайся; алар урушуп калышты - они поссорились"},{"t":"p","h":"уста 1. — мастер; 2. кузнец, слесарь"},{"t":"p","h":"устакана 1. — мастерская; 2. кузница"},{"t":"p","h":"устара — бритва"},{"t":"p","h":"устун — столб, бревно"},{"t":"p","h":"уул - сын; менин уулум - мой сын; анын үч уулу бар — у него есть трое сыновей"},{"t":"p","h":"уурда - воруй, укради; уурдап алган буюмдар - краденые вещи"},{"t":"p","h":"ууч — горсть; бир ууч ун - горсть муки; кош ууч (кочуш) — пригоршня"},{"t":"p","h":"уч — лети; көгүчкөн чатырдын үстүндө учуп жүрөт — голубь летает над крышей; куштар учат — птицы летают; самолёт учуп бара жатат — самолёт летит"},{"t":"p","h":"учур - время, момент; случай, сезон; өз учурунда - своевременно; мындай учурларда - в таких случаях; в такие моменты; жай учуру — летнее время"},{"t":"p","h":"ушак — сплетня, клевета; пересуды; ушак кылуу — сплетничать"},{"t":"p","h":"ушакчы - клеветник, сплетник"},{"t":"p","h":"ушу, ушул - этот; ушу (ушул) жылы - в этом году; ушу, ушу жерде — здесь; на этом месте; ал ушул үйдө турат - он живёт в этом доме"},{"t":"p","h":"уя — гнездо; куштун уясы - гнездо птицы; уя басуу — высиживать птенцов; сидеть на яйцах; уяда жатуу (отуруу) — сидеть в гнезде; уядан кулап түшүү упасть из гнезда."},{"t":"p","h":"уял — стыдись, постыдись, стесняйся, смущайся; элден уялсаң боло! - хоть бы людей постыдился! ал сенден уялат — он тебя стыдится"},{"t":"h3","h":"Ү"},{"t":"p","h":"үбөлүк — скалка"},{"t":"p","h":"үймөк - 1. стог, скирда; чөптүн үймөгү (үймөк чөп) — скирда сена; үймөк-үймөк буудай — пшеница в скирдах; 2. груда, куча; бир үймөк таш - куча камней"},{"t":"p","h":"үймөлөктөшүү — собираться в кучу"},{"t":"p","h":"үйрөт - учи, научи, обучи (кого-л.); атасы уулуна машина айдаганды үйрөттү — отец научил сына водить машину; агам мага сүрөт тартканды үйрөттү — мой старший брат научил меня рисовать"},{"t":"p","h":"үлгү — 1. пример, образец; жакшы үлгү көрсөтүү — показать хороший пример; жаштарга үлгү болуу — стать примером (образцом) для молодёжи; 2. образец; выкройка; жазуунун үлгүсү — образец письма; жаканын үлгүсү — выкройка воротника"},{"t":"p","h":"үлгүрүү — успеть"},{"t":"p","h":"үлүл — улитка"},{"t":"p","h":"үн - голос; ичке үн — низкий голос; жоон үн — высокий голос"},{"t":"p","h":"үңкүр - пещера, грот"},{"t":"p","h":"үп - духота, душно; үйдүн ичи үп болуп турат - в комнате душно"},{"t":"p","h":"үпүп — удод"},{"t":"p","h":"үр - лаять; ит үрөт — собака лает"},{"t":"p","h":"үргүлө - дремли; чоң атам үргүлөп отурат — мой дед дремлет сидя"},{"t":"p","h":"үрөн - семена; үрөн топтоо — заготовка семян"},{"t":"p","h":"үшү — мёрзни, зябни; балдар үшүп кетишти — дети замёрзли; түнкү суукта помидорлор үшүп калды - во время ночных заморозков помидоры замёрзли"},{"t":"h3","h":"<span class=\"pg\" data-n=\"166\">166<\/span>Ч"},{"t":"p","h":"чаарчык — телёнок косули (до года)"},{"t":"p","h":"чабак - чебак, рыбёшка"},{"t":"p","h":"чабал — слабый, бессильный; чабал киши — слабый человек"},{"t":"p","h":"чабалекей — ласточка; чабалекейлер учуп келди — ласточки прилетели: чабалекейдин уясы — гнездо ласточки"},{"t":"p","h":"чабуу - бить, хлопать, косить; дүркүрөгөн кол чабуулар — бурные аплодисменты; чөп чабуу — сенокос"},{"t":"p","h":"чайкана — чайхана, чайная"},{"t":"p","h":"чайканачы — чайханщик"},{"t":"p","h":"чайна — жуй; сагыз чайна — жуй жевачку"},{"t":"p","h":"чайнек — чайник"},{"t":"p","h":"чака — ведро; бир чака малина - ведро малины; алманын бир чакасы (бир чака алма) канча турат? — сколько стоит ведро яблок?"},{"t":"p","h":"чакан — малый, маленький, малого размера; чакан бөлмө — маленькая комната; чакан стол — маленький стол; биз эки бөлмөлүү чакан квартирада турдук — мы жили в двухкомнатной маленькой квартире; чакан аңгеме - маленький рассказ"},{"t":"p","h":"чакыр — зови, пригласи; бизди конокко чакырды - нас пригласили в гости;"},{"t":"p","h":"чалгы - коса; чалгы кайроо - точить косу; чалгы чыңоо — отбивать косу"},{"t":"p","h":"чалкан — крапива"},{"t":"p","h":"чалчык — жижа, грязь"},{"t":"p","h":"чана — сани, санки; чана тебүү - кататься на санях"},{"t":"p","h":"чанач — чанач (бурдюк из обработанной козлиной шкуры, употребляется как сосуд для кумыса)"},{"t":"p","h":"чанда — редко; мындай баалуу буюмдар бизде чанда табылат - такие ценные вещи у нас редко попадаются (редко встречаются)"},{"t":"p","h":"чаң — 1. пыль; чаң баскан көчө пыльная улица (улица, покрытая пылью); столдун чаңын сүртүү — вытирать пыль со стола; көмүрдүн чаңы - угольная пыль; 2. пыльца (растения)"},{"t":"p","h":"чаңыр - ори, громко кричи; ал үнүнүн бардыгынча чаңырды - он орал во весь голос"},{"t":"p","h":"чаңырык - визг; катуу чаңырык чыкты — раздался пронзительный визг"},{"t":"p","h":"чап - 1. ударь, бей, руби; таяк менен чапты — он ударил (бил) палкой; балта чап — руби топором; 2. копай, рой; арык чап — копай арык"},{"t":"p","h":"чапан — чапан, халат"},{"t":"p","h":"чарча — устань, уставай, утомляйся; басып жүрүп чарчадым - я устал от ходьбы; ал силерди куте берип чарчады — он устал ждать вас"},{"t":"p","h":"чаян — скорпион"},{"t":"p","h":"чебер - 1. мастер, умелец; искусство чеберлери - мастера искусств; элдик чеберлер — народные мастера; народные умельцы; 2. искусный; умелый, ловкий; чебер уста — искусный мастер; чебер комузчу — искусный комузист"},{"t":"p","h":"чегедек — ветка ели; куу чегедек — сухая ветка ели"},{"t":"p","h":"чегин — отступай; душмандар чегинди — враги отступили"},{"t":"p","h":"чегинүү — отступать; отступление"},{"t":"p","h":"чегиртке — 1. кузнечик; 2. саранча"},{"t":"p","h":"чейин - до; үйгө чейин — до дома; бизге чейин — до нас; көпкө чейин — долгое время"},{"t":"p","h":"ченөө — измерить, замерить, измерение"},{"t":"p","h":"чеп — крепость, заграждение, укрепление"},{"t":"p","h":"чер - густой (дремучий) лес, чаща, непроходимые заросли; чер токой — лесная чаща"},{"t":"p","h":"черт — играй (на щипковом инструменте); комуз черт — играй на комузе; гитара черт - играй на гитаре"},{"t":"p","h":"<span class=\"pg\" data-n=\"167\">167<\/span>четин — рябина; четиндин ашы - плоды рябины"},{"t":"p","h":"четки — крайний; айылдын четки көчөсү - крайняя улица аила; четки үй — крайний дом"},{"t":"p","h":"чеч - 1. развяжи, отвяжи, распрягай; арканды чечип кой — отвяжи верёвку; 2. реши, разгадай; маселе чеч — решай вопрос; ал пальтосун чечип койду — он снял пальто; үй чеч — разбирай юрту"},{"t":"p","h":"чечек - оспа, чечекке каршы эмдөө — прививка против оспы"},{"t":"p","h":"чечен — красноречивый, искусный оратор"},{"t":"p","h":"чечүү — 1. развязывать, распутывать; 2. решать, решение; маселе чечүү - решение вопроса"},{"t":"p","h":"чечүүчү — решающий; чечүүчү учур — решающий момент; чечүүчү добуш - решающий голос"},{"t":"p","h":"чигит — чигит (семена хлопчатника)"},{"t":"p","h":"чие — вишня"},{"t":"p","h":"чийме — чертёж"},{"t":"p","h":"чиймечи — чертежник"},{"t":"p","h":"чилде - 1. сорок самых холодных дней зимы; 2. сорок самых жарких дней лета"},{"t":"p","h":"чирик — гнилой, прелый; чирик тактайлар — гнилые доски; чирик алмалар — гнилые яблоки; чирик саман — гнилая солома"},{"t":"p","h":"чиркей — комар; чиркей чакты — комар укусил"},{"t":"p","h":"чиркөө — церковь"},{"t":"p","h":"чогул — собирайся; эл жыйналышка чогулду — люди собрались на собрание; чогулган акча — собранные деньги"},{"t":"p","h":"чок — уголь (горящий уголь); чокко кактап бышыруу — жарить на углях"},{"t":"p","h":"чокой — валенки, пастушья обувь"},{"t":"p","h":"чоку - 1. макушка; 2. вершина; пик; тоонун чокусу — вершина горы"},{"t":"p","h":"чоң - 1. большой; громадный, огромный; чоң үй — большой дом; чоң бала - большой мальчик; бул пальто ага чоң келет - это пальто ему будет велико; 2. старший (по возрасту); чоң балдар — дети старшего возраста; ал сенден чоң — он старше тебя; 3. крупный, видный; авторитетный; влиятельный; чоң акын — крупный поэт; чоң салым - крупный вклад; чоң чыгарма — крупное произведение"},{"t":"p","h":"чочко — свинья; чочконун эти свиное мясо, свинина: чочко чарбасы - свиноводческое хозяйство (свиноводство)"},{"t":"p","h":"чоюн - чугун; чоюн казан — чугунный котёл; чоюн меш — чугунная лечь"},{"t":"p","h":"чөл — пустыня; суусуз чөл - безводная пустыня"},{"t":"p","h":"чөлкөм — окрестность; бул чөлкөмдү — в этих местах"},{"t":"p","h":"чөлмөк — челнок (для нитки)"},{"t":"p","h":"чөмөлө - копна"},{"t":"p","h":"чөө — красный волк, шакал"},{"t":"p","h":"чөөгүн — чайник (для кипячения воды)"},{"t":"p","h":"чөп - трава, сено; дары чөптөр — лекарственные травы; чөп чабык — сенокос; үймөк чөп, чөп-чар — мелкие травянные отбросы; сор, мусор"},{"t":"p","h":"чукулдук — кайло"},{"t":"p","h":"чулдук — кулик"},{"t":"p","h":"чумку, чуму — ныряй, окунайся; ал муздак сууга чумкуду — он окунулся в холодную воду; бала суунун түбүнө чейин чумуду — мальчик нырнул до дна речки"},{"t":"p","h":"чурка - беги; балдар жол менен чуркап бара жатышат - дети бегают по дороге"},{"t":"p","h":"чуркоо — бежать, бег"},{"t":"p","h":"чуулда — шуми, кричи, галди, загуди; эл чуулдай баштады — люди зашумели"},{"t":"p","h":"чүкө — альчик; чүкө ойноо — играть в альчики"},{"t":"p","h":"чүпүрөк — тряпка; тряпьё; чүпүрөк менен сүртүү — вытирать тряпкой; чүпүрөктү суулоо — намочить тряпку водой; <span class=\"pg\" data-n=\"168\">168<\/span>пол сүртө турган чүпүрөк — половая тряпка"},{"t":"p","h":"чүчкүр — чихай"},{"t":"p","h":"чүчкүрүк — чиханье"},{"t":"p","h":"чыбык - прут, прутик; көк чыбык - зелёный прут"},{"t":"p","h":"чыгуу — выход; восхождение; сахнага чыгуу — выход на сцену; тоого чыгуу — восхождение на гору; көчөгө чыгуу - выход на улицу"},{"t":"p","h":"чыгым - расход; издержки; жолдун чыгымы — дорожный расход"},{"t":"p","h":"чыда - терпи, выдерживай; катуу суукка чыдай албадык — мы не выдержали сильный мороз; бир аз чыдай тургула — немного потерпите"},{"t":"p","h":"чыдам - терпение, выдержка; выносливость; анын чыдамы жеткен жок - у него не хватило терпения"},{"t":"p","h":"чымчык - 1. всякого рода мелкая птица, пташка; 2. воробей; чымчыкты сойсо да касапчы сойсун (погов.) — даже воробья и то должен резать мясник"},{"t":"p","h":"чымын — муха"},{"t":"p","h":"чын - истина, правда, настоящий, действительный; чын айттыңбы? - ты правду говоришь? бул чынбы? - это правда? чын көңүлдөн — искренне, от всей души, от всего сердца; чыны менен — серьезно, не шутя, всерьез"},{"t":"p","h":"чың — крепкий; анын ден соолугу чың — у него крепкое здоровье; чың булчуң — крепкие мускулы"},{"t":"p","h":"чыңдоо — укрепить, укрепление дружбы — достукту чыңдоо"},{"t":"p","h":"чырак — светильник"},{"t":"p","h":"чырмоок — повилика, вьюн"},{"t":"p","h":"чырпык — мелкие ветви, прутья, хворост"},{"t":"p","h":"чыт - ситец; чыт көйнөк - ситцевое платье"},{"t":"p","h":"чычкан — мышь; арыс чычкан — горностай; сары чычкан — суслик; тыйын чычкан — белка; момолой чычкан — крот"},{"t":"p","h":"чычырканак — облепиха, джерганак"},{"t":"p","h":"чээн — берлога (для зимней спячки животных); чээнге кирүү — залечь в берлогу"},{"t":"h3","h":"Ш"},{"t":"p","h":"шаар — город; жаңы шаар — новый город; шаардын калкы - население города; шаарда туруу — жить в городе; алар шаардан келишти — они приехали из города"},{"t":"p","h":"шабдалы - персик (дерево и плод)"},{"t":"p","h":"шагыл — щебень"},{"t":"p","h":"шай, шайман — сила, мощь; шайым жок (шайманым жок) — у меня нет сил"},{"t":"p","h":"шайлоочу - избиратель; депутаттын шайлоочулар менен жолугушуусу - встреча депутата с избирателями"},{"t":"p","h":"шак — ветвь, ветка, сук; алмалардын шактары мөмөлөрүн көтөрө албай ийилип турат — ветви яблонь гнулись под тяжестью плодов"},{"t":"p","h":"шакек — кольцо, перстень; алтын шакек — золотое кольцо"},{"t":"p","h":"шалы, шалы жоолук — шаль; ак шалы (ак шалы жоолук) — белая шаль"},{"t":"p","h":"шам - 1. вечер; 2. вечерняя молитва у мусульман; 3. лампа; свеча; шам жагуу — зажечь лампу"},{"t":"p","h":"шамал - ветер; бет алдыдан соккон шамал - встречный ветер; катуу шамал — сильный ветер"},{"t":"p","h":"шаркыратма - водопад"},{"t":"p","h":"шарп — ящур (болезнь скота)"},{"t":"p","h":"шаттык - радость, веселье"},{"t":"p","h":"шаты — лестница (приставная большая)"},{"t":"p","h":"шаш — торопись, спеши; шашпай оку — читай не спеша; ал дайыма шашып жүрөт - он всегда спешит; сен кайда шашасың? - куда ты спешишь? шашпай тур — не торопись, не спеши"},{"t":"p","h":"шейшемби - вторник"},{"t":"p","h":"<span class=\"pg\" data-n=\"169\">169<\/span>шейшеп — простыня"},{"t":"p","h":"шек — сомнение, подозрение; шек кылуу (шек саноо) — подозревать, сомневаться"},{"t":"p","h":"шибеге — шило"},{"t":"p","h":"шилте — маши, махай; кол шилте — маши рукой; кадам шилте — шагай"},{"t":"p","h":"шире — сироп, сок; гүлдүн ширеси - нектар цветка; алманын ширеси - яблочный сок"},{"t":"p","h":"шоола - луч; сияние, таң шооласы - утренняя заря; айдын шооласы - лунное сияние; күндүн шооласы — луч солнца"},{"t":"p","h":"шоола түшүү — сиять"},{"t":"p","h":"шорпо — суп, шурпа; күрүч шорпо - рисовый суп"},{"t":"p","h":"шум — хитрый, плут; ловкач"},{"t":"p","h":"шүүдүрүм - роса; таңкы шүүдүрүм — утренняя роса"},{"t":"p","h":"шыбак I-полынь, II-штукатурка, шыбакчы — штукатурщик"},{"t":"p","h":"шыпыргы - веник, метла"},{"t":"p","h":"шырдак — ширдак (сшитый в два слоя орнаментированный войлок)"},{"t":"h3","h":"Ы"},{"t":"p","h":"ыза — досада, обида, злоба; ыза көрүү — терпеть обиды; анын ызасы келди - он обозлился"},{"t":"p","h":"ызакор — обидчивый; раздражительный"},{"t":"p","h":"ызгаар — пронизывающий холод, стужа; кыштын ызгаары — зимняя стужа: пронизывающий холод зимы"},{"t":"p","h":"ый - плач; бала ыйын басып, сооронуп калды - ребёнок перестал плакать и успокоился"},{"t":"p","h":"ыктуу — удобный, благоприятный; ыктуу учур — удобный случай; ыктуу жер — удобное место"},{"t":"p","h":"ыктыт - икай; бала ыктытып жатат - ребёнок икает"},{"t":"p","h":"ылай - 1. жидкая глина; ылай ийлөө — замесить глину; 2. грязь, муть; жамгыр жаап, көчө ылай болду — прошёл дождь, и на улице стало грязно; ылай суу - мутная вода"},{"t":"p","h":"ылакап — поговорка; афоризм, мудрое изречение; кыргыздын макал-лакаптары — кыргызские пословицы и поговорки"},{"t":"p","h":"ылдамдатуу - ускорить; ускорение, ылдамдык - быстрота; скорость; кыймылдын ылдамдыгы — быстрота движения; ылдамдыкты күчөтүү — развивать скорость"},{"t":"p","h":"ылдый - вниз; ал ылдый жакта турат — он стоит внизу; биздин ылдый жагыбызга жаңы үй салынды - ниже нас был построен новый дом; биз суу ылдый жүрүп отурдук — мы шли вниз по реке"},{"t":"p","h":"ынтымактуу — дружный, дружно, согласный; живущий в согласии; ынтымактуу үйбүлө — дружная семья; ынтымактуу жамаат — дружный жамаат; ынтымактуу жашоо - жить в дружбе; дружно жить"},{"t":"p","h":"ыр - песня: стихи, стихотворение; кыргыз акындарынын ырлары - стихи кыргызских поэтов, элдик ырлар - народные песни"},{"t":"p","h":"ыраазы - довольный, удовлетворенный; ыраазы болуу — быть довольным (кем-чем-л.)"},{"t":"p","h":"ыраак - далёкий; дальний; далеко; ыраак жол - далёкий путь; дальняя дорога; ыраакка көз чаптыруу — смотреть в даль; мен мынчалык ыраак жерге баргым келбейт — мне не хочется идти в такую даль"},{"t":"p","h":"ыраат — порядок; ырааты менен - по порядку"},{"t":"p","h":"ыргы - прыгай, вскакивай; ал катуу чочуп кетип, ордунан ыргып турду — он сильно испугался и вскочил с места; <span class=\"pg\" data-n=\"170\">170<\/span>бала атка ыргып минди - мальчик вскочил на коня"},{"t":"p","h":"ырда - пой; ал жакшы ырдайт - она хорошо поёт"},{"t":"p","h":"ырдоо - петь; сахнага чыгып ырдоо петь на сцене"},{"t":"p","h":"ырчы - 1. певец; 2. импровизатор"},{"t":"p","h":"ышкырык I — свист,"},{"t":"p","h":"ышкырык II — свисток"},{"t":"h3","h":"Э"},{"t":"p","h":"эбак, небак - давно; эбактан (небактан) бери — с давних пор; биз эбак эле (небак эле) келгенбиз — мы давно пришли"},{"t":"p","h":"эгиз — близнецы, двойня, двойняшки"},{"t":"p","h":"эгин — 1. посевы; дан эгиндер — зерновые посевы; 2. зерно; хлебные злаки; эгин даярдоо — хлебозаготовки"},{"t":"p","h":"эже — 1. старшая сестра (независимо от степени родства); 2. форма обращения к старшей женщине"},{"t":"p","h":"эзелки — древний; давнишний; старинный; эзелки үрп-адат - древние обычаи; эзелки бир заманда — в древние времена; эзелки окуя — старый, давно забытый случай"},{"t":"p","h":"эки — два (две); эки жыл - два года; бир-эки күнгө — на пару дней; эки-экиден — по два; саат экиде - в два часа; эки киши — два человека; эки тонна — две тонны"},{"t":"p","h":"экөө — оба, двое, вдвоём; две штуки; силер экөөңөр — вы вдвоём, вы двое, вы оба; мага экөө керек — мне нужны две штуки; биз экөөбүзгө — нам двоим"},{"t":"p","h":"эл - 1. народ; население; кыргыз эли — кыргызский народ; эл чарбасы — народное хозяйство; эл каттоо — перепись населения; 2. страна; государство; чет элдерде - за рубежом, за границей"},{"t":"p","h":"элек I — сито; кыл элек — волосяное сито; майда элек — мелкое сито; электен өткөрүү — пропустить через сито: просевать"},{"t":"p","h":"элек II — пока еще не, ещё не (глагольное отрицание), мен аны көрө элекмин - я его пока ещё не видел; жаз чыга элек — весна ещё не наступила; жыйналыш баштала элек — собрание ещё не началось; ал келе элек — он пока еще не пришёл"},{"t":"p","h":"элик — косуля"},{"t":"p","h":"элүү — пятьдесят; элүү жылдык - пятидесятилетие; ал элүү жашта — ему пятьдесят лет; элүү тыйын — пятьдесят копеек"},{"t":"p","h":"элчи — 1. посланник; посол; 2. посредник, ходатай"},{"t":"p","h":"эмгек — труд; илимий эмгек — научная работа, научный труд; эмгек кылуу — трудиться, работать;"},{"t":"p","h":"эми — теперь, сейчас, только что, ал эми эле ушул жерде болчу — он только что был здесь; эми мындай кылуу керек — теперь нужно делать так"},{"t":"p","h":"эмне - что; эмне себептен? — почему? по какой причине? эмне үчүн? — почему, зачем, для чего? эмне болду? — что случилось? бул жерде эмне кылып жүрөсүң? — зачем ты ходишь здесь?"},{"t":"p","h":"эң — очень, самый, слишком; эң бийик — очень высокий; слишком высокий; бул эң кызык китеп — это очень интересная книга; эң эле сулуу — самый красивый; эң жакын самый близкий; эң жакшы — самый хороший; эң болбогондо — на худой конец"},{"t":"p","h":"эңкей — нагнись, наклонись"},{"t":"p","h":"эрдик — мужество, геройство, храбрость подвиг"},{"t":"p","h":"эри - 1. таять; кар эрип жатат - снег тает; муз эрип кетти — лёд растаял; 2. плавиться; калай отко эрийт — олово плавится на огне"},{"t":"p","h":"<span class=\"pg\" data-n=\"171\">171<\/span>эрин - губа; астыңкы эрин — нижняя губа; үстүнкү эрин — верхняя губа"},{"t":"p","h":"эркек — 1. самец; 2. мужчина"},{"t":"p","h":"эркеле — ласкайся; бала энесине эркелеп жатат — ребёнок ласкается к матери"},{"t":"p","h":"эркелетүү — ласкать, нежить, баловать"},{"t":"p","h":"эркин — свободный; свободно; өзүн эркин сезүү — чувствовать себя свободно; эркин турмуш — свободная жизнь"},{"t":"p","h":"эрмекте — забавляйся, потешайся, подсмеивайся (над кем-л.)"},{"t":"p","h":"эрмен — полынь горькая"},{"t":"p","h":"эсепте — считай; вычисляй; учитывай; эсептеп чыгаруу — подсчитывать; акчаңды эсепте — считай свои деньги; бүгүнкү күндү эсептебегенде, майрамга дагы беш күн калды, — до праздника осталось ещё пять дней, не считая сегодняшнего"},{"t":"p","h":"эсептөө — считать; вычисление, исчисление, расчёт, учёт, счёт"},{"t":"p","h":"эскер — помни, вспомни; сизди көп эскерет — он часто вспоминает вас"},{"t":"p","h":"эскерт — напомни; предупреди; жумушчуларга жыйналыш болорун эскертип кой — напомни рабочим о собрании"},{"t":"p","h":"эски — старый, ветхий; устаревший; изношенный; эски үй — старый (ветхий) дом; эски кийим — старая одежда; эски көйнөк — изношенное платье (изношенная рубашка); эски достор — старые друзья; эски шаар — старый город; эски көз караш — старый взгляд"},{"t":"p","h":"эт — 1. мясо; койдун эти — баранина; уйдун эти — говядина; жылкынын эти — конина; чийки эт — сырое мясо; 2. мякоть (фрукта, плода); эти калың коон — мясистая дыня"},{"t":"p","h":"этек - 1. подол; пола; көйнөктүн этеги — подол платья; этеги узун чапан - длиннополый халат; 2. низ, подножие, подошва; тоонун этегиндеги айылдар — аилы у подножия гор"},{"t":"p","h":"этиш — глагол"},{"t":"p","h":"этият — осторожный; осторожно; этият бол — будь осторожен; этият адам - осторожный человек"},{"t":"p","h":"этияттык — осторожность, осмотрительность"},{"t":"p","h":"эчен, нечен — несколько; много; нечен ирет — много раз; несколько раз; нечен жыл - несколько лет; много лет; мен сага эчен ирет айткан элем - я тебе много раз говорил"},{"t":"p","h":"эчки - коза; тоо эчки — горная коза; эчкинин сүтү — козье молоко"},{"t":"p","h":"эшек — осёл"},{"t":"p","h":"эшик — дверь, дверное отверствие; сырткы эшик — парадная дверь (дверь на улицу)"},{"t":"p","h":"ээк — подбородок"},{"t":"p","h":"ээле — занимай, обладай; бул орунду мен ээлеп койдум — это место занял я; биздин команда экинчи орунду ээледи — наша команда заняла второе место"},{"t":"p","h":"ээн — пустынный, необитаемый, уединённый, безлюдный, глухой; үй ээн калды — дом остался без присмотра; ээн жер — пустынная (необитаемая) земля; ээн арал — пустынный остров; ээн көчө — безлюдная улица, закоулок"},{"t":"p","h":"ээнбаш — своевольный, самовольный, непослушный, необузданный, отбившийся от рук, недисциплинированный; ээнбаш болуп кетүү — отбиться от рук (стать непослушным, самовольным); ээнбаш бала — недисциплинированный мальчик"},{"t":"p","h":"ээр — седло; ээр токуу — наложить седло, оседлать"},{"t":"p","h":"ээрчи — следуй, иди за...; мени ээрчи — иди за мною; бала энесинин артынан ээрчип бара жатат — мальчик идёт вслед за матерью; ал бизди ээрчий албады — он не мог идти за нами"},{"t":"p","h":"ээрчүү - следовать, идти следом, идти за..."}],"pages":[139,172]},{"title":"ЖЫЛ БОЮНЧА ӨТҮЛГӨН МАТЕРИАЛДАРДЫ КАЙТАЛОО, БЫШЫКТОО, ЭСТЕРИНДЕ САКТОО ҮЧҮН ТЕСТТИК КӨНҮГҮҮЛӨРДҮН ҮЛГҮЛӨРҮ","blocks":[{"t":"h3","h":"ЖЫЛ БОЮНЧА ӨТҮЛГӨН МАТЕРИАЛДАРДЫ КАЙТАЛОО, БЫШЫКТОО, ЭСТЕРИНДЕ САКТОО ҮЧҮН ТЕСТТИК КӨНҮГҮҮЛӨРДҮН ҮЛГҮЛӨРҮ"},{"t":"p","h":"1. 5-класстын «Кыргыз адабияты» окуу китебин кайсы авторлор түзүшкөн? А) Ч. Айтматов, М. Элебаев"},{"t":"v","l":["Б) Ш. Бейшеналиев, К. Баялинов","В) Т. Сатылганов, Т. Молдо","Г) А. Мусаев, Т. Үсөналиев"]},{"t":"p","h":"2. Кыргыз Республикасынын Мамлекеттик Гимнинин сөзү жана обону кимдердики?"},{"t":"v","l":["А) Т. Сатылганов, Т. Молдо, Ш. Бейшеналиев, М. Элебаев","Б) Ж. Садыков, Ш. Кулиев, Н. Давлесов, К. Молдобасанов","3. Силер элдик оозеки чыгармалардын кайсы үлгүлөрүн окудуңар?","А) жөө жомок, табышмак, жаңылмач, апыртмаларды","Б) эпос, макал, лакап, балдар ырларын","4. Төмөнкү чыгармаларды кайсы жазуучулар жазышкан?"]},{"t":"p","h":"А) Т. Сатылганов «Кемчонтой», Т. Молдо «Турумтай менен Торгой» Б) Т. Үмөталиев «Чыпалак бала», Ш. Бейшеналиев «Күч бирдикте» В) К. Баялинов «Чабалекей менен жылан», Ч. Айтматов «Ак кеме» Г) М. Элебаев «Зарлык». Ш. Бейшеналиев «Мүйүздүү козу»"},{"t":"p","h":"5. «... Кан ар жума сайын казынага кирип, андан ыйлап чыкчу...» деген үзүндү кайсы жомоктон алынды?"},{"t":"v","l":["А) «Бала өзүнүн шаарын кантип сактап калды»","Б) «Акылдуу кыз»","В) «Турумтай менен торгой»","Г) «Күч бирдикте»"]},{"t":"p","h":"6.«Төөсүн союп, анын терисин ичке көктөй кылып тилип, аларды улаштырып, жерге айландырып коюп, анын ичине канча жер сынса, ошончо жерди кандан сурамакчы болгон» бала кайсы чыгармада сүрөттөлөт."},{"t":"v","l":["А) «Табышмакчы Чынара»","Б) «Чыпалак бала»","В) «Атадан калган туяк»","Г) «Бала өзүнүн шаарын кантип сактап калды»","7. Кайсы чыгармада көмөч кайсы айбандарды алдайт?","А) «Мүйүздүү козуда» ат, кочкор, козуну","Б) «Торгой менен турумтайда» койчу, торгой, турумтайды","В) «Абышка-кемпирдин көмөчүндө» бөрү, жылкычы","г) «Чыпалак балада» карышкыр, төөнү","<span class=\"pg\" data-n=\"173\">173<\/span>","","8. «Эңдим торгой кантесин,","Жендим торгой кантесин,","Жыктым торгой кантесин,","Экөөндөн тең жарышта"]},{"t":"p","h":"Чыктым торгой кантесиң» – деп кимдин кайсы чыгармасында айтылат? А) Т. Сатылгановдун «Торгой менен Турумтай»"},{"t":"v","l":["Б) Т. Молдо «Эшек менен булбул»","В) Т. Молдо «Каркыра менен Түлкү»","Г) К. Баялинов «Чабалекей менен жылан»"]},{"t":"p","h":"9. «....– Эй койчуман, уктаба, мен көк бөрү. Коюна кол салганы баратам.» – деген үзүндү кайсы чыгармадан алынды?"},{"t":"v","l":["А) Ш. Бейшеналиевдин «Мүйүздүү козу»","Б) М. Элебаевдин «Зарлык»","В) Ч. Айтматовдун «Чыпалак бала»","Г) Т. Молдонун «Абышка-кемпирдин көмөчү»"]},{"t":"p","h":"10. Улуу Ата мекендик согуш мезгили кайсыл жазуучунун чыгармасында сүрөттөлөт жана анда негизги каарман ким?"},{"t":"v","l":["А) Ш. Бейшеналиевдин «Мүйүздүү козусунда», Азис","Б) М. Элебаевдин «Зарлыгында», Зарлык","В) К. Баялиновдун «Ажар» повестинде, Ажар","Г) Ч. Айтматовдун «Атадан калган туяк» чыгармасында, Авалбек"]},{"t":"p","h":"11. Төмөнкү тексттердин кайсынысы кимдердин кайсы чыгармаларынан алынган? А) .... Алар үйгө бара жатышты. Бүгүнтөдөн баштап ата жолуна түшкөнүн, атадан калган жалгыз туяк экенин билди."},{"t":"p","h":"Б) Кыргыз тукуму курут болуп кетерде, экөөң элдин атын өчүрбөй, кайра тукум улансын, укум-тукумуңа мекен болсун деп, ал жерди теңирден сурап алдым. В) Күн сайын атасына өңөртүп жүргөн ал, жаңы сөздөрдү үйрөнө, тилин, акыл эсин байыта берди."},{"t":"p","h":"Г) Эмки дарты – Каракол. «Казыналык окуу!» Алиги күүгүм талаш тасманын белинде келе жаткан себеби ошол болчу."},{"t":"p","h":"1) Ч. Айтматов «Бугу-эне», М. Элебаев «Зарлык», Ш. Бейшеналиев «Мүйүздүү козу», Ч. Айтматов, «Чыпалак бала»."},{"t":"v","l":["2) Ш. Бейшеналиев «Мүйүздүү козу», Ч. Айтматов, «Чыпалак бала».","Ч. Айтматов «Бугу-эне», М. Элебаев «Зарлык»."]},{"t":"p","h":"3) Ч. Айтматов, «Чыпалак бала», М. Элебаев «Зарлык», Ш. Бейшеналиев «Мүйүздүү козу», Ч. Айтматов «Бугу-эне»."},{"t":"p","h":"4) Ч. Айтматов «Атадан калган туяк», Ч. Айтматов «Бугу эне», Ш.Бейшеналиев «Мүйүздүү козу», М. Элебаев «Зарлык»."},{"t":"p","h":"Эскертүү: Окутулган окуучулардын өзгөчөлүгүнө карата тесттерди оор же жеңил кылып өзгөртүп берүү мугалимдин методикалык чеберчилиги болуп саналат."},{"t":"h3","h":"<span class=\"pg\" data-n=\"175\">175<\/span>МУСАЕВ"},{"t":"img","src":"data:image/webp;base64,UklGRmQMAABXRUJQVlA4IFgMAACwcgCdASoaAXQBPrVSn0qnKLQnLlYKIoAWiWcHMAAJq92aUMqXyFReej20YizfMdfzsT+A6lym60noRwVDgd/TY42u5lQYHdgEa6xa3xnqeh0gjToaeABD0wctsOzqZ3hj6U4vCC5CGMHdxhv25G9Z83hOmOD7Kjc4sd1FTtbjmiBrnLIWgpsR/NRXLbnBlOdorTjZnYKCizCKlXVvLkAAnOohikwgJGR/9wZYPU7vE9eEhCetWEMkWur2ah/4j6/GCRybZKOC17zP8iFnt+gu3UWWQno8lV37dbyZ+d5AN9UhVOUKBA0PwkGK5gBPAPz0BVaNzcxSdw3VSBnMqGJptfXxRpQZ/eJ674vKtift1sUYHLz4/Xez8pnoMvTskAtUSMztPuTIFzceqKA8cH6neijvYgDZJk9FywMplw0iObo1GDtFfahTUMXvq/GkwLBZ6F3S14m4phBLeghXznaW3AJI+   // ---------------------------------------------------------------- storage helpers
  function lsGet(k, def) { try { var v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode: ignore */ } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

  var defLang = (navigator.language || '').toLowerCase().indexOf('ky') === 0 ? 'ky' : 'ru';
  var S = lsGet('settings', null) || {};
  S.fs = S.fs || 19; S.lh = S.lh || 1.55; S.theme = S.theme || 'light'; S.font = S.font || 'serif'; S.ui = S.ui || defLang;

  function t(k) { return (I18N[S.ui] || I18N.ru)[k] || I18N.ru[k] || k; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function $(sel, root) { return (root || document).querySelector(sel); }

  var THEME_BG = { light: '#ffffff', sepia: '#f5ecd9', dark: '#111315', contrast: '#000000' };
  function applySettings() {
    var r = document.documentElement;
    r.setAttribute('data-theme', S.theme);
    r.setAttribute('data-font', S.font);
    r.style.setProperty('--fs', S.fs + 'px');
    r.style.setProperty('--lh', String(S.lh));
    r.lang = S.ui;
    var m = $('meta[name=theme-color]'); if (m) m.setAttribute('content', THEME_BG[S.theme]);
    lsSet('settings', S);
  }

  var toastTimer;
  function toast(msg) {
    var el = $('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg; el.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.style.display = 'none'; }, 2600);
  }

  function fetchJSON(url) {
    // revalidate with the server, so a corrected book or a new book list shows up on the next visit
    return fetch(url, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  var app = document.getElementById('app');
  var cleanup = null; // reader teardown

  function route() {
    if (cleanup) { cleanup(); cleanup = null; }
    if (EMB) return openReader(EMB.id);
    var m = location.hash.match(/^#\/read\/([\w.-]+)/);
    if (m) openReader(m[1]);
    else if (location.hash === '#/my') showMyBooks();
    else if (location.hash === '#/news') showNews();
    else if (location.hash === '#/missing') showMissing();
    else showLibrary();
  }

  // ================================================================ LIBRARY
  function cacheName(b) { return 'book-' + b.id + '-' + b.v; }

  // The library is organised by school (language of instruction), then grade, then subject.
  // Choosing the school also sets the interface language.
  var SCHOOLS = [['ky', 'Кыргыз мектеби'], ['ru', 'Русская школа']];

  // Subjects in the order the ministry lists them. A book's subject comes from its "subject"
  // field when index.json has one, otherwise from its title; a title that matches nothing
  // becomes its own subject, so new books always show up.
  var SUBJECTS = [
    ['kyrgyz-tili', /кыргыз тили|кыргызский язык/, 'Кыргыз тили', 'Кыргызский язык'],
    ['kyrgyz-adabiyat', /кыргыз адабият|кыргызская литература/, 'Кыргыз адабияты', 'Кыргызская литература'],
    ['russkiy-yazyk', /русский язык|орус тили/, 'Орус тили', 'Русский язык'],
    ['russkaya-literatura', /русская литература|литературное чтение|орус адабият/, 'Орус адабияты', 'Русская литература'],
    ['adabiyat', /адабият|литератур/, 'Адабият', 'Литература'],
    ['matematika', /математик|алгебр|геометр/, 'Математика', 'Математика'],
    ['fizika', /физик/, 'Физика', 'Физика'],
    ['himiya', /хими/, 'Химия', 'Химия'],
    ['biologiya', /биолог/, 'Биология', 'Биология'],
    ['geografiya', /географ/, 'География', 'География'],
    ['istoriya-kg', /кыргызстан\S* тарых|история кыргызстана/, 'Кыргызстандын тарыхы', 'История Кыргызстана'],
    ['istoriya-mir', /дүйнө тарых|орто кылым|жаңы тарых|соңку тарых|байыркы|всемирная история|средних век|новая история|новейшая история|древн/, 'Дүйнө тарыхы', 'Всемирная история'],
    ['religii', /диндер|религи/, 'Диндердин тарыхы', 'История религий'],
    ['obshchestvo', /адам жана коом|человек и общество/, 'Адам жана коом', 'Человек и общество'],
    ['grazhdanstvennost', /гражданствен|жарандык/, 'Жарандык', 'Гражданственность'],
    ['english', /англ|english/, 'Англис тили', 'Английский язык']
  ];
  function subjectOf(b) {
    var s = String(b.subject || b.title || '').toLowerCase();
    for (var i = 0; i < SUBJECTS.length; i++) {
      if (b.subject === SUBJECTS[i][0] || SUBJECTS[i][1].test(s)) return { key: SUBJECTS[i][0], order: i, name: SUBJECTS[i][S.ui === 'ky' ? 2 : 3] };
    }
    return { key: 'x:' + s, order: SUBJECTS.length, name: b.subject || b.title };
  }

  // "My books": books the reader opened or added, stored on the phone. 1 = in the list,
  // 0 = removed by the reader. Books opened before this list existed count as added.
  function myState() { return lsGet('mybooks', null) || {}; }
  function inMy(id) { var s = myState()[id]; return s === 1 || (s !== 0 && !!lsGet('pos:' + id, null)); }
  function setMy(id, on) { var s = myState(); s[id] = on ? 1 : 0; lsSet('mybooks', s); }

  var libHash = '#/'; // where the reader's back button returns to

  function libShell(title, link, main) { // main: the library page (intro text and school switch)
    document.title = title;
    var school = S.school || (S.ui === 'ky' ? 'ky' : 'ru');
    app.innerHTML = '<div class="lib"><div class="lib-head"><button class="icon burger" aria-label="' + esc(t('menu')) + '">' + ICONS.menu + '</button><h1>' + esc(title) + '</h1>' + link + '</div>' +
      (main ? '<p class="sub">' + esc(t('appSub')) + '</p><div class="school">' + SCHOOLS.map(function (o) {
        return '<button data-s="' + o[0] + '"' + (o[0] === school ? ' class="on"' : '') + '>' + esc(o[1]) + '</button>';
      }).join('') + '</div>' : '') +
      '<div id="books"><div class="loading">' + esc(t('loading')) + '</div></div></div>';
    $('.burger', app).onclick = openMenu;
    Array.prototype.forEach.call(app.querySelectorAll('.school button'), function (btn) {
      btn.onclick = function () {
        S.school = S.ui = btn.getAttribute('data-s'); applySettings();
        route(); // redraw the page we are on (setting the same hash would not fire hashchange)
      };
    });
    return school;
  }

  var LIST = null; // the last book list loaded, for the reader's quality badge
  function loadList() {
    return fetchJSON('books/index.json').then(function (list) { LIST = list; return list; }).catch(function (e) {
      $('#books').innerHTML = '<div class="loading">' + esc(t('err')) + '</div>'; throw e;
    });
  }

  function showLibrary() {
    libHash = '#/';
    var school = libShell(t('appTitle'), '<a class="btn my-link" href="#/my">' + esc('★ ' + t('my')) + '</a>', true);
    loadList().then(function (list) {
      list = list.filter(function (b) { return !b.school || b.school === school; });
      var grades = [];
      list.forEach(function (b) { gradesOf(b).forEach(function (g) { if (grades.indexOf(g) < 0) grades.push(g); }); });
      grades.sort(function (a, b) { return a - b; });
      var open = lsGet('libOpen', {});
      var box = $('#books');
      box.innerHTML = grades.length ? '' : '<div class="loading">' + esc(t('noBooks')) + '</div>';
      grades.forEach(function (g) {
        var books = list.filter(function (b) { return gradesOf(b).indexOf(g) >= 0; });
        var sec = document.createElement('section'); sec.className = 'grade';
        sec.innerHTML = '<button class="grade-h"><span>' + esc(g + ' ' + t('grade')) + '</span><span class="n">' + books.length + '</span></button><div class="grade-b"></div>';
        var head = $('.grade-h', sec), body = $('.grade-b', sec);
        function setOpen(on) {
          sec.classList.toggle('open', on);
          body.innerHTML = '';
          if (on) bySubject(books, body, false);
        }
        head.onclick = function () {
          var on = !sec.classList.contains('open');
          Array.prototype.forEach.call(box.querySelectorAll('.grade.open'), function (s) { if (s !== sec) { s.classList.remove('open'); $('.grade-b', s).innerHTML = ''; } });
          setOpen(on);
          open[school] = on ? g : null; lsSet('libOpen', open);
          if (on && sec.scrollIntoView) sec.scrollIntoView({ block: 'start' });
        };
        box.appendChild(sec);
        if (open[school] === g) setOpen(true);
      });
    });
  }

  function showMyBooks() {
    libHash = '#/my';
    libShell(t('my'), '<a class="btn my-link" href="#/">' + esc('‹ ' + t('allBooks')) + '</a>', false);
    loadList().then(function (list) {
      var box = $('#books');
      var mine = list.filter(function (b) { return inMy(b.id); });
      box.innerHTML = '';
      if (!mine.length) { box.innerHTML = '<div class="loading">' + esc(t('myEmpty')) + '</div>'; return; }
      var grades = [];
      mine.forEach(function (b) { var g = gradesOf(b)[0]; if (grades.indexOf(g) < 0) grades.push(g); });
      grades.sort(function (a, b) { return (a == null ? 99 : a) - (b == null ? 99 : b); });
      grades.forEach(function (g) {
        var sec = document.createElement('section'); sec.className = 'grade open';
        sec.innerHTML = '<h2 class="grade-t">' + esc(g == null ? '' : g + ' ' + t('grade')) + '</h2><div class="grade-b"></div>';
        bySubject(mine.filter(function (b) { return gradesOf(b)[0] === g; }), $('.grade-b', sec), true);
        box.appendChild(sec);
      });
    });
  }

  // The menu (☰ in the library header): the site's pages, as a panel sliding in from the left.
  function openMenu() {
    var bg = document.createElement('div'); bg.className = 'sheet-bg';
    var nav = document.createElement('nav'); nav.className = 'drawer';
    var cur = location.hash || '#/';
    var items = [['#/', t('allBooks')], ['#/my', '★ ' + t('my')], ['#/missing', t('missing')], ['#/news', t('news')]];
    nav.innerHTML = '<div class="drawer-h"><span>' + esc(t('appTitle')) + '</span><button class="icon x" aria-label="' + esc(t('close')) + '">' + ICONS.close + '</button></div>' +
      items.map(function (it) { return '<a href="' + it[0] + '"' + (it[0] === cur ? ' class="cur"' : '') + '>' + esc(it[1]) + '</a>'; }).join('') +
      (API ? '<p class="note">' + esc(t('reportHint')) + '</p>' : '');
    document.body.appendChild(bg); document.body.appendChild(nav);
    function close() { bg.remove(); nav.remove(); }
    bg.onclick = close; $('.x', nav).onclick = close;
    nav.addEventListener('click', function (e) { if (e.target.closest('a')) close(); });
  }

  var MONTHS = {
    ru: ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'],
    ky: ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь']
  };
  function fmtDate(d) { // "2026-09-29" -> "29 сентября 2026" / "29-сентябрь, 2026"
    var m = String(d).match(/^(\d{4})-(\d\d)-(\d\d)/); if (!m) return d;
    return S.ui === 'ky' ? +m[3] + '-' + MONTHS.ky[+m[2] - 1] + ', ' + m[1] : +m[3] + ' ' + MONTHS.ru[+m[2] - 1] + ' ' + m[1];
  }
  function bookLink(b) {
    return '<a href="#/read/' + esc(b.id) + '">' + esc(b.title + (b.grade ? ', ' + b.grade + ' ' + t('grade') : '')) + '</a>';
  }

  // "What's new": site/changelog.json, newest first. Each entry: {"date": "YYYY-MM-DD", "ru": "...", "ky": "...",
  // "books": [book ids, optional]}. Book-publishing threads add an entry at the top with every publish.
  function showNews() {
    libHash = '#/news';
    libShell(t('news'), '', false);
    Promise.all([fetchJSON('changelog.json'), LIST ? LIST : loadList().catch(function () { return []; })]).then(function (r) {
      var byId = {}; r[1].forEach(function (b) { byId[b.id] = b; });
      var log = r[0].slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
      var html = '<p class="sub">' + esc(t('newsSub')) + '</p>', last = null;
      log.forEach(function (e) {
        if (e.date !== last) { html += '<h2 class="news-d">' + esc(fmtDate(e.date)) + '</h2>'; last = e.date; }
        var books = (e.books || []).map(function (id) { return byId[id]; }).filter(Boolean);
        html += '<div class="news"><p>' + esc(e[S.ui] || e.ru) + '</p>' + (books.length ?
          (books.length > 4 ? '<details><summary>' + esc(t('booksInEntry') + ' (' + books.length + ')') + '</summary>' : '<div>') +
          '<ul class="news-b">' + books.map(function (b) { return '<li>' + bookLink(b) + '</li>'; }).join('') + '</ul>' +
          (books.length > 4 ? '</details>' : '</div>') : '') + '</div>';
      });
      $('#books').innerHTML = html;
    }).catch(function () { $('#books').innerHTML = '<div class="loading">' + esc(navigator.onLine === false ? t('offline') : t('err')) + '</div>'; });
  }

  // Approved textbooks we could not find online: site/missing.json. Each entry: {"school": "ru"|"ky", "grade", "title",
  // "authors", "status": notfound|sample|closed|kyonly|edition, "note_ru", "note_ky", "live": id of a version in the library}.
  // A book that goes live is removed from that file.
  var MSTATUS = { notfound: 'mNotfound', sample: 'mSample', closed: 'mClosed', kyonly: 'mKyonly', edition: 'mEdition' };
  function showMissing() {
    libHash = '#/missing';
    libShell(t('missing'), '', false);
    Promise.all([fetchJSON('missing.json'), LIST ? LIST : loadList().catch(function () { return []; })]).then(function (r) {
      var byId = {}; r[1].forEach(function (b) { byId[b.id] = b; });
      var list = r[0], school = S.school || (S.ui === 'ky' ? 'ky' : 'ru');
      var html = '<p class="sub">' + esc(t('missingSub')) + '</p><p><button class="btn jump">' + esc(t('haveItJump') + ' ↓') + '</button></p>';
      SCHOOLS.filter(function (sc) { return sc[0] === school; }).concat(SCHOOLS.filter(function (sc) { return sc[0] !== school; })).forEach(function (sc) {
        var rows = list.filter(function (m) { return m.school === sc[0]; });
        if (!rows.length) return;
        html += '<h2 class="grade-t">' + esc(sc[1]) + '</h2>';
        var lastG = null;
        rows.forEach(function (m) {
          if (m.grade !== lastG) { html += '<h3 class="subj">' + esc(m.grade + ' ' + t('grade')) + '</h3>'; lastG = m.grade; }
          var live = m.live && byId[m.live];
          html += '<div class="bk miss"><div class="bk-t">' + esc(m.title) + '</div><div class="bk-m">' + esc(m.authors || '') + '</div>' +
            '<div><span class="ms ms-' + esc(m.status) + '">' + esc(t(MSTATUS[m.status] || 'mNotfound')) + '</span></div>' +
            ((m['note_' + S.ui] || m.note_ru) ? '<div class="note">' + esc(m['note_' + S.ui] || m.note_ru) + '</div>' : '') +
            (live ? '<div class="note">' + esc(t('mKyLink')) + ': ' + bookLink(live) + '</div>' : '') + '</div>';
        });
      });
      html += '<div class="offer" id="offer"><h2>' + esc(t('haveIt')) + '</h2><p>' + esc(t('haveItText')) + '</p>' +
        (API ? '' : '<p class="note">' + esc(t('uploadSoon')) + '</p>') + '</div>';
      $('#books').innerHTML = html;
      $('.jump', app).onclick = function () { $('#offer').scrollIntoView({ block: 'start', behavior: 'smooth' }); };
      if (API) uploadForm($('#offer'), list);
    }).catch(function () { $('#books').innerHTML = '<div class="loading">' + esc(navigator.onLine === false ? t('offline') : t('err')) + '</div>'; });
  }

  // ---- sending to the server (API): error reports and uploaded books
  function api(path, opts) {
    return fetch(API + path, opts).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function postJSON(path, data) {
    // text/plain keeps this a "simple" request (no CORS preflight), which is faster on slow phones
    return api(path, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(data) });
  }
  // Reports made offline wait on the phone and go out with the next one, or when the app opens online.
  function sendReports() {
    var q = lsGet('reports', []);
    if (!API || !q.length || navigator.onLine === false) return Promise.resolve(false);
    var r = q[0];

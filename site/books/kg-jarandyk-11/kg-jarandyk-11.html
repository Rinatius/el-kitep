ааттан берилбейт. Турак-жай аянттарынын 12 %ы электр","менен таптакыр жабдылган эмес.","Аны акыркы жолу 25 жыл мурда сырдашкан.","Колдо болгон төртөөнүн бирөө бузулган, ал эми экинчиси жакшы иштебейт.","Азыркы учурда аны пайдаланууга мүмкүн эмес.","","Өткөн жылы ит каап алган адам каза болгон.","Өткөн жайда жугуштуу оорулардын жайылып кеткен","учурлары болгон.","Ал футбол боюнча улуттук курама команданын капитаны","болгон."]},{"t":"raw","h":"<div class=\"gloss\"><p> <\/p><\/div>"},{"t":"h3","h":"<span class=\"pg\" data-n=\"22\">22<\/span>ТТТ 12-тапшырма. Жамаатымдын уставында эмнелер айтылган? 30мүн."},{"t":"p","h":"Эгер шаарда, кыштакта же айылда жашасанар, силердин жергиликтүү өз алдынча башкаруу органыңардын уставы бар. Ушул уставды чогуу талкуулоо үчүн жергиликтүү кеңештин депутатын мектепке чакыргыла, Силер талкуулануучу суроолордун тизмесин депутатка күн мурунтан беришиңер керек. (Ушул китептин аягында уставдын үлгүсү берилген)."},{"t":"v","l":["Төмөнкү суроолорду бергиле:","1. Сиз аткарып жаткан ишке устав кандай таасир этет?"]},{"t":"p","h":"Мэрия, шаар башкармалыгы же айыл өкмөтү уставга карама-каршы келген кандайдыр бир иш-аракетти сунуш кылган учур болду беле? Эгер болсо, ал учурда эмне жасалган?"},{"t":"p","h":"3. Уставга качан өзгөртүү киргизилгенин айта аласызбы? Бул эмне үчүн жана кандайча жасалган?"},{"t":"p","h":"4. Устав боюнча тургундардын кандай укуктары жана милдеттери бар экенин айтып бериңизчи?"},{"t":"p","h":"5. Эгерде биз устав менен таанышкыбыз келсе, анын нускасын кайдан алсак болот?"},{"t":"p","h":"6. Этер биз жарандар катары уставды өзгөрткүбүз келсе, ал үчүн эмне кылышыбыз керек?"},{"t":"p","h":"* # # * 13-тапшырма. Жамаатыцардым уставына оңдоолорду киргизүү жөнүндө сунуш даярдагыла. 30 мүн."},{"t":"p","h":"Жамаагынардын уставын окуп чыккыла. Үч-төрттөн болуп топторго бөлүнгүлө. Ар бир топ жаштарга тиешелүү маселелер боюнча уставга өзгөртүү киргизүү жөнүндө сунуш иштеп чыгышы керек. Андан кийин сунушунарды башка топтогулар менен талкуулагыла жана эки же үч мыкты сунуш үчүн добуш бергиле. Анан бул сунушту талкуулоо жана мүмкүн болсо кабыл алуу үчүн жергиликтүү кеңештин депутатына бергиле."},{"t":"p","h":"14-тапшырма. Ошентип, сиз эмне иш кыласыз? 45 мүн."},{"t":"p","h":"Жергиликтүү өз алдынча башкаруу органынын кызматкери менен (аким, же анын орун басары, же шаар башчысы, же айыл өкмөтүнүн башчысы болсо, баарынан жакшы) жолугушуу жөнүндө макулдашкыла же ал адамды класска чакыргыла. Бере турган суроолоруңардын тизмесин алдын ала жибергиле (кийин силер башка суроолорду да берсенер болот, бирок суроолордун негизги тизмеси ал адамдын даярдануусуна мүмкүндүк берет)."},{"t":"p","h":"Жолугушкан күнү төмөндөгү суроолордон бергиле. Бардык айтылгандарды эстеп калышыңар мүмкүн эмес болгондуктан, керектүү жерлерин жазып алгыла. Коногунар бир суроого жооп берип жатып башка суроону да айта кетиши мүмкүн. Көңүл коюп угуп, жооп бергендерин кайта сурабаш керек, анткени ал коногунардын сөзүн укпаганыңарды көрсөтөт."},{"t":"v","l":["Сиз кайсы кызматта иштейсиз?","Сиздин кызматтык милдеттериңиз кайсылар?","Милдеттериңизди өтө эле көп деп эсептебейсизби?","Сиз жөнөкөй жумуш күнүнүздү баяндап бере аласызбы?","Сиз өз милдеттериңизди аткарыш үчүн кандай ресурстарды пайдалана аласыз?","Сиз аларды жетиштүү деп ойлойсузбу?","Өз милдеттериңизди аткарыш үчүн Сиз кандай ыйгарымдарга ээсиз?","Өз милдеттериңизди аткарыш үчүн Сизде бийлик жетиштүү деп ойлойсузбу?","Сиздин ыйгарымдарыныз кандайча чектелген?","‚ Сиз өз ыйгарымдарыңызга кандайча ээ болосуз?"]},{"t":"p","h":"Кайсы документтерде Сиздин милдеттериңиз, бийлигиңиз жана ыйгарымдарыңыз баяндалган?"},{"t":"p","h":"‚ Ушул кызматка байланыштуу кандай артыкчылыктардан пайдаланасыз?"},{"t":"p","h":"‚ Сиз кимге баш иесиз?"},{"t":"p","h":"‚Сиз өз иштериңиздин жыйынтыктары жана пайдаланылган ресурстар боюнча кандайча отчёт бересиз?"},{"t":"p","h":"‚ Ишиңиздин канчалык жакшы аткарылгандыгына жетекчилик же өзүнүз кайсы көрсөткүчтөр боюнча баа бересиз?"},{"t":"p","h":"ЭО"},{"t":"p","h":"<span class=\"pg\" data-n=\"23\">23<\/span>16. Милдеттериңизди аткарууда Сиздин мүмкүнчүлүгүн йсы факторло Бийликтин жергиликтүү органдарына кайсы бир маселени чечуу өтүнүчү же талабы менен кайрылып кат жаза алам деп ойлойсузбу?"},{"t":"p","h":"17. Калктын кеңири катмары Сиз менен кандайча байланышат?"},{"t":"p","h":"18. Сиз коомчулук менен кандайча байланышасыз?"},{"t":"p","h":"19. Сиз иштеген уюмда чечим кандай кабыл алынат (добуш берүү, бардыгынын макулдугу, тануулоо менен)?"},{"t":"p","h":"‚ Сиз акыркы 20 жылда жергиликтүү бийлик органдарында жана алардын иш формаларында кандай өзгөрүүлөр болгонун айтып бере аласызбы?"},{"t":"h3","h":"{2003-ж. ЮСАИД жүргүзгөн сурамжылоонун жыйынтыды)"},{"t":"p","h":"шы р"},{"t":"p","h":"21. Сиздин кызматыңыз жөнүндө дагы башка нерселерди билсек болобу?"},{"t":"p","h":"Жолугушуудан кийин жоопторду толук жазгыла жана аларды класста талкуулоого, ошондой эле силер интервью алган жергиликтүү өз алдынча башкаруу органынын өкүлүнө жооптордун көчүрмөсүн берүүгө даяр болгула. Бул нускада силерге бөлгөн убактысы үчүн ага ыраазычылык билдирилиши керек."},{"t":"p","h":"* 15-тапшырма. Силердин оюңар кандай?"},{"t":"p","h":"Шеригинер менен жергиликтуу башкарууну демократиялаштыруу женундегу талкууну окуп чыккыла. Андан кийин төмөнкү ырастоого канчалык даражада макул же макул эмес экендигиңерди аныктагыла: “Аткаруу органдарынын бардык башчылары эл тарабынан тике шайланышы керек,”"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><\/tr><tr><td>1<\/td><\/tr><tr><td>толугу менен<\/td><td>билбейм<\/td><td>макул эмесмин<\/td><td>таптакыр макул<\/td><\/tr><tr><td>эмесмин<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"Мен бул аткарылбайт го деп ойлойм. Кыргызстандагы адамдар демократиянын мындай системасына али даяр эмес. Анда бүтүндөй мамлекеттин таламын ким жактайт? Эгер калкынын көбү тажик улуту болгон райондо кеңешке тажиктер гана шайланса жана андан кийин бул кеңеш районду Тажикстанга кошуу жөнүндө чечим кабыл алса, эмне болорун элестетип көргүлөчү."},{"t":"p","h":"Мен буга таптакыр макул эмесмин. Эгерде салыштырмалуу начар өнүккөн Африка өлкөлөрүндөгү адамдар жергиликтүү бийлик органдарынын жетекчилерин шайлап жатышса, биз эмне үчүн шайлай албайбыз? Мамлекет дайым эле туура иш жүргүзүп же элдин таламын коргобой тургандыгы бизге тарыхтан маалым, ошондуктан биз элдин укуктарын жана бийлигин кеңейтишибиз керек. Андан сырткары, мамлекеттин таламдары ансыз деле жакшы корголгон, анткени ал бөлүнгөн акча каражаттарын жергиликтүү органдардан туура сарптоону жана алар боюнча ар дайым отчёт берип турууну талап кыла алат."},{"t":"p","h":"Ооба, бирок этностук топтор жөнүндө маселе коюлганда Айнураныкы туура. Мындайда улуттук көпчүлүк басымдуулук кылган жерлердеги кеңештин иштеринин натыйжалары жана чечимдери менен улуттук азчылык макул болбошу мүмкүн. Бирок ал башка өлкөгө кошулуу жөнүндө райондук кеңеш чечим кабыл алат деп бекер эле чочулап жатат. Республиканын Конституциясы буга тыюу салат."},{"t":"p","h":"Мен адамдар практика жүзүндө гана демократияга көнүгөт жана добуш берүүнүн маанилүүлүгүн түшүнө алат деп ойлойм. Мен бардык деңгээлдеги жетекчилерди, бирок, адегенде бир облуста, андан кийин ар жолу бирден облусту кошуу менен шайлоону киргизүүнү сунуш кылат элем. Мен дагы адегенде жергиликтүү бийлик органдарынын а"},{"t":"raw","h":"<div class=\"gloss\"><p>1 макулмун Айнура<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"24\">24<\/span> \"Кыргызстандагы =жЖана аүйнөнүн вашка олколерунаову жервилихтуу вийлит органдары башчыларын тике шайлоодогу проблемаларды түшүндүрүү үчүн шайлоочулардын арасында кандайдыр бир иштерди уюштуруу керек деп ойлойм."},{"t":"p","h":"Менин оюмча, өз аймагын башкарууга адамдардын көбүрөөк катышуусу үчүн жетекчи органдарда шайланма кызматтар көбүрөөк болушу керек. Ошондо адамдар алып, башкаруу органдарында бюджет чектелүү экендигин түшүнөт. Бул башкарууга жөндөмсүз адамдарды эл кызматтан кетире алат дегенди да билдирет."},{"t":"p","h":"Биз эмне үчүн муну Президенттин ыктыярына койбойбуз? Эгер ал бардык жетекчилерди дайындаса, анда бир райондун же облустун ишинин натыйжасын башкалар менен салыштыра алмак. Мен талапкерлердин кимиси кандай экендигин добуш бергенге чейин эле билиш үчүн адамдар иш жүзүндө анча деле ар нишпейт деп ойлойм. Бул тек гана башаламандыкка алып келиши мүмкүн."},{"t":"p","h":"Ооба, бирок мунун бардыгы мамлекеттик бийлик системасында күчтөрдүн теңделишине жараша болот. Бийликте жакшы президент турганда бардыгы ойдогудай болушу мүмкүн. Бирок андай эмес болсо, мамлекеттик бийлик элдин бийлигине келип калат. Адамдар толук маалымат албай туруп эле, өз тандоосун жетишээрлик негиздебестен, болжолдоп туруп эле өз добуштарын берет дегенге макулмун. Мен биздин система кыйла ачык-айкын болушу керек деп ойлойм. Ошентип, адамдар бюджет кандай бөлүштүрүлүп жатканын билүүгө жана эч болбосо райондук деңгээлде бюджеттик акчаны биринчи кезекте тигил же бул муктаждыктарга жумшоо зарыл деп өз пикирин айтууга мүмкүнчүлүк алышы керек."},{"t":"p","h":"Эгер адамдар кампетентсиз (иш билбеген) жетекчини шайлап алса эмне болот? Ар бир_ ишти өз устасы аткарганы жакшы эмеспи. “Бөдөнөнү сойсо да, касапчы сойсун”. Ооба, бирок мэр же аким мындай адистерди жалдап алышы мүмкүн. Мэр сөзсүз эле, мисалы, канализация боюнча адис болушу керек эмес. Эгерде шайлоочулар колунан иш келбеген адамды шайлап алса, анын азабын өздөрү тартышарын тез эле баамдап калат. Буга адегенде анча маани бербесе деле, бирөө үчүн добуш берүү канчалык жооптуу кадам болоорун кийинчерээк түшүнүшөт."},{"t":"p","h":"Өз алдынча башкаруу органынын бюджети пландалып жатат."}],"sub":[],"pages":[7,24]},{"title":"XIV бап. Шайлоо системалары жана демократия","blocks":[{"t":"h2","h":"<span class=\"pg\" data-n=\"26\">26<\/span>XIV бап. Шайлоо системалары жана демократия"},{"t":"p","h":"<i>Эскертүү: китептин сүрөткө тартылган нускасында 25-бет жок, ошондуктан бул баптын башталышы түшүп калды.<\/i>"},{"t":"p","h":"шайлоодо жеңип чыккан талапкерге биз учурунда добуш бербеген болсок да, ал парламентте өз округундагы бардык шайлоочулардын таламын жактоого милдеттүү. Бирок бул өкүл биздин көз карашыбызга макул болушу керек деген сөз эмес)."},{"t":"p","h":"Окулубуз катары шайланууга далалаттанып (умтулуп) жаткандар бизге отчёт берип турушуң камсыз кылабыз. Шайлоо мезгилинин дал өзүндө жарандар катары силер өз жакшы аткарган саясатчыларды сыйлап (б.а. ал үчүн добуш берип), начар иштегендерин жазалай {б.а. андайларга каршы добуш бере) аласыңар."},{"t":"p","h":"Учурдагы мамлекеттик бийлик органдары жүргүзүп жаткан иш-аракеттин натыйжалуулугу. жана тууралыгы жөнүндө пикирибизди билдиребиз."},{"t":"p","h":"Белгилүү бир мезгилден кийин өз өкүлдөрүбүзгө кайрадан ушундай эле жол менен баа бере тургандыгыбызды тастыктайбыз, Демократиялык өлкөлөрдө эч ким эч качан “өмүр бою” шайланбайт – ар бир саясатчы маал-маалы менен өз шайлоочуларынын колдоосуна жетишип турууга тийиш."},{"t":"p","h":"Өз өкүлдөрүбүздү шайлап жатканда биз аларга өз убадаларын аткарышы үчүн ыйгарымдарды беребиз. Мындай мандатты шайлоо болгон сайын шайлоочулар өздөрү тастыктайт же кайра алып коёт,"},{"t":"p","h":"3.0 Демократиялык шайлоо"},{"t":"p","h":"Шайлоо жарыяланчу күндөн алда канча мурда эле борбордук (эгер ал туруктуу иштебесе) жана жергиликтүү (округдук, участкалык) шайлоо комиссиялары түзүлүшү керек. Шайлоочулардын тизмесин жанылап, тактап турууга демейде жергиликтүү шайлоо комиссиялары же жергиликтүү өз алдынча башкаруу органдары жооптуу болот. Демейде шайлоо комиссиясы бул өнөктүктү (кампанияны) маалымат. каражаттары аркылуу жүргүзүп, жашаган жерин которгондорду же шайлоо курагына жеткендерди катталууга үндөйт. Мындан соң шайлоо округунан сырткары жакка кеткендер жана каза болгондор тизмеден чийилет. (Сот аркылуу камакка алынган жарандардын добуш берүү укугу ар кайсы өлкөлөрдө: ар башкача камсыздалат. Көпчүлүк өлкөлөрдө иши тергелип жаткан жарандардын күнөөсү далилдене. электери гана добуш берүүгө укуктуу, ал эми соттолгондордун, б.а. сот аркылуу күнөөсү аныкталгандардын мындай укугу болбойт. Кыргызстанда да ушундай эреже колдонулат). Ушул маалыматтын негизинде кээде шайлоо участкаларынын чеги өзгөртүлөт. Шайлоо участкаларынын формасы жана чоңдугу өткөрүлч шайлоонун жыйынтыгы кандай болорун, өкмөттү кимдер курарын же парламентте кимдер үстөмд кыларын алдын ала аныктап коюшу мүмкүн. Ошондуктан көбүнчө участкалардын чегарасына жана аларды аныктоо процессине байланыштуу талаш-тартыш чыгат. Президенттик шайлоодо бүтүндөй өлкө бир округ болот. анткени бүткүл мамлекеттин атынан жалгыз киши шайланат."},{"t":"v","l":["Шайлоо качан болору кезектеги эки шайлоонун ортосундагы","максималдуу мезгил чегинде аныкталат. Зарылчылык түзүлгөн","кырдаалдарда, мисалы, мөөнөтүнөн мурда президент отставкага кетсе","же парламент таркатылса, шайлоо мөөнөтүнөн эрте жарыяланышы","мүмкүн. Мындай жагдайлар ден соолугуна, башка ишке өткөндүгүнө же","өлүмүнө байланыштуу кайсы бир депутаттын ыйгарымы күтүүсүздөн","токтотулганда да пайда болушу мүмкүн. Жооптуу орган (кээ бир","өлкөлөрдө борбордук шайлоо комиссиясы, башкаларында – президент)","шайлоонун датасын расмий түрдө жарыялашы керек. Бул – шайлоо","процессиндеги биринчи кадам.","Андан соң шайлоо комиссиясынын кароосуна талапкерлердин","катталуу арыздары берилет. Кээ бир өлкөлөрдө шайлоочулар саясий","партиялар үчүн гана добуш бергендиктен, партиялар каттоодон өткөрүүгө","өз талапкерлеринин тизмелерин даярдашы керек. Демейде эгер бул"]},{"t":"p","h":"адамдар тиешелүү мамлекеттин жараны деп эсептелсе, эч кандай оор Добуш берүүдө колдонулуучу тунук сандык кылмыш жасабаган, шайлоо курагына жеткен болсо, аларды комиссия каттоодон өткөрөт, Бирок көп өлкөлөрдө талапкерлер же партиялар өздөрүн жактагандардын бе сандагы колун топтошу жана каттоо акысын төлөшү керек. Бул талапкерлердин шайлоодо ат са чындап ниеттенгенин тастыктоо үчүн жасалат. Мындай болбосо өтө эле көп талапкерлер катталып, шайлоо процесси абдан создугуп кетиши жана шайлоочулар кимди тандоону билбей кыйналышы мүмкүн."},{"t":"p","h":"Көпчүлүк өлкөлөрдө парламенттик шайлоого жакын калганда парламент таркатылат. Бул мында! ары депутаттардын өкүлдүк укугу болбой тургандыгын, ал эми парламенттин мыйзамдуу бийлиги тол <span class=\"pg\" data-n=\"27\">27<\/span>йй менен токтотуларын билдирет. Эн жогорку даражадагы шайлоо комиссиясы бул мезгилде оры күндөгү га"},{"t":"h2","h":"шайлоо участкаларынын шттык курамын шайжо"},{"t":"p","h":"участкаларында бардык зарыл жабдуулардын жетиштүү болушун өзгөрдү: 680 миллион шай- |: текшерет. Мында шайлоо комиссиялары шайлоочулардын бардыгына жеткидей санда бюллетендерди басып чыгарышы да абдан зор бар лосчусу, 543 шайлоо округу тик мааниге ээ. Бирок бюллетендер өтө ашыкча чыгарылбашы керек, ®3йло© болуй өттү. “Индия болбосо алар добуш берүүнүн жыйынтыктарын бурмалоо учун УЛУТТУК конгресси\" партиясш пайдаланылып кетиши мүмкүн. Ар бир бюллетенае тиешелүү!” у БЕ м ЖҮРҮ жыз шайлоо округундагы талапкерлерин аты-жөнү жазылган тизме болот. Шайлоо комиссиясы адатта талапкерлердин тизмесине Жеңген партиянын башында өзгөртүү киргизүүнү шайлоо башталчу күнгө бир нече жума калганда теги италиялык аяп, 1991- токтотот; анткени ал жүздөгөн, миңдеген шайлоо участкаларына жылы атып өлтүрүлгөн зарыл сандагы бюллетендерди бастырып, таратканга үлгүрүшү керек “УРдаты премьер-министраин Мындан тышкары шайлоо комиссиясы шайлоо участкаларынын “©СИРИ ©сия Ганди турат. 1 кайда жайгашканы, добуш берилүүчү күн тууралуу элге кабар берет."},{"t":"p","h":"Бул мезгилде саясий партиялар менен көзкарандысыз талапкерлер шайлоо алдындагы үгүттү жүргүзүп, өз саясатын ачык үгүттөйт жана башка партиялардын саясатын сындап чыгат. Өкмөттүн иши да бул учурда өзгөчө анализге жана курч сынга алынат. Талапкерлер өз округунда мүмкүн болушунча көбүрөөк шайлоочулар менен жолугушуп, аларды добуш берүүгө үгүттөөгө аракеттенет. Алар ошондой эле ММКга да маалыматтарды жарыялайт. Көпчүлүк елколорле үгүт кампаниясын (өнөктүгүн) өткөрүү эрежелери аныкталып, ага ар бир талапкер же партия канча акча сарптай ала тургандыгы чектелет. Бул эрежелер талапкерлердин статусуна же байлыгына карабай, баары үчүн бирдей мелдеш шартын түзүү үчүн зарыл."},{"t":"v","l":["Добуш берүү процессине тоскоолдук болбошу","үчүн шайлоо күнү же анын алдында шайлоого","байланыштуу үгүт токтотулушу керек. Шайлоочулар ","шайлоо участкасына жөнөшөт, ал жерде шайлоо","комиссиясынын мүчөсү ошол округ боюнча тизмеде ","шайлоочунун фамилиясы бар-жогун, ошондой эле","шайлоочу мурда добуш берген-бербегенин текшерет.","Эгерде жаран добуш берүүгө укуктуу болсо, фамилиясы","тизмеде белгиленип, ага шайлоо бюллетени берилет.","Андан кийин шайлоочу добуш берүү кабинасына кирип,","кимге добуш берүүнү туура көрсө, бюллетенде ошону","белгилейт. Мында кабинага кошо кирүүгө, шайлоочу","кимге добуш берип жатканын карап турууга эч кимдин","Добуш берүү бардын","укугу жок. Добуштун купуялыгын (жашыруундугун)"]},{"t":"p","h":"камсыздоо учун бюллетенде шайлоочунун аты-жөнү көрсөтүлбөйт. Буга кошумча көпчүлүк өлкөлөрдө кайталап добуш берүүгө жол койбоо үчүн шайлоочуга бюллетень берүү учурунда анын бармагына ультрафиолет жарыгына салып караганда көрүнүүчү сыя сүртүлөт."},{"t":"p","h":"Андан кийин шайлоочу белги койгон бюллетенин бүктөп, добуш берүү сандыгына салат. Акыркы шайлоочу добуш берип, шайлоо участкасы жабылган соң участкалык шайлоо комиссиясынын мүчөлөрү добуш берүү сандыктарын ачып, арбирталапкерге берилген добуштардын санын эсептеп чыгат. Бул боюнча протокол толтурулуп, анын көчүрмөлөрү мөөр менен тастыкталат да, бардык каалаган байкоочуларга жана кызыккан расмий адамдарга берилет. Бардык байкоочулар – талапкерлер менен партиялардын өкүлдөрү да, көз карандысыз байкоочулар да бүтүндөй шайлоо процессин көрүп турушу зарыл. Мындан соң эсептин жыйынтыктары ошол округдун шайлоо комиссиясына берилет. Адатта бир нече күндөн кийин шайлоо комиссиясы бардык маалыматтарды топтоп бүтүп, шайлоонун жыйынтыктарын жарыялайт. (Эреже катары бул маалымат гезиттерге жарыяланат же телеберүүлөрдө уктурулат). Эгерде кайсы бир округдар боюнча жыйынтыктар дээрлик бирдей болуп калса, талапкерлер өз округдары боюнча берилген добуштарды кайра саноону талап кыла алышат."},{"t":"p","h":"Байкоочулар бүтүндөй процесске – каттоонун, үгүт иштеринин, добуш берүүнүн жана жыйынтыктарды чыгаруунун жүрүшүнө – көз салып турушу абдан маанилүү! Алар бардык жарандар менен талапкерлердин “көзү жана кулагы”!"},{"t":"p","h":"<span class=\"pg\" data-n=\"28\">28<\/span>3.1 Шайлоо жыйынтыктарынан эмнелер билинет?"},{"t":"p","h":"Добуш берүүнүн натыйжаларын бекиткенден к ийин шайлоо комиссиясы (кээ бир өлкөлөрдө – сот) муну коомчулукка ММК аркылуу маалымдайт. Элдин жаңы өкүлдөрү ант берген учурдан тартып кийинки н тартып шайлоого чейин өз милдеттерин аткарууга кирише алат. Парламенттик рен парламент гана эл тарабынан ть. Ал өз кезегинде (көбүнчө депутаттардын макулдугу боюнча) өкмөт курамын түзө турган але т истрди шайлайт. Мындай системада премьер-министр парламенттеги көпчүлүк орундарды лидери болот да. мамлекеттин аткаруу бийлигин башкарат. Президенттик системада парламент да, президент да шайланат. Демейде аткаруу бийлигин жетектеген президент өкмөттү түзөт."},{"t":"v","l":["Шайлоодо саясий партия же президенттикке талапкер болор-болбос, ЮЖ","маселен, 5 % добуш артыкчылык менен жеңсе, партия же президент чабал кт","түзүп калат деп болжошунар мүмкүн. Бул таптакыр туура эмес, анткени мындай","айырма күрөшкө эн күчтүү талапкерлер же партиялар чыкканын айгинелейт. Кээ","бир демократиячыл эски мамлекеттерде атаандашын 5 %дан ашуун добуш алып","уткан партия же талапкер чанда гана учурайт.","Көбүнчө шайлоого чейин эле улуттук баатыр катары таанылып","калган талапкерлер чон артыкчылык менен утуп чыгышат. Маселен, Түштүк","\\фриканын акыйкат демократиялуу жол менен шайланган туңгуч Ирезиденти","Нельсон Мандола. Ал өлкөдө калктын көпчүлүгүн түзгөн каралардын шайлоого","катышуу укугун жокко чыгаруучу системаны ойрон кылган. Нельсон Мандола","жеке эркиндигин курмандыкка чалып, демократиячыл ынанымдарынан"]},{"t":"p","h":"(ишенимдеринен) баш тартпай 27 жылдан ашуун убакыт түрмөдө жаткан. Мына Н. Мандола ушундан улам ал эл ичинде эбегейсиз кадыр-баркка ээ болгон."},{"t":"p","h":"4.0 Эркмн жана акыйкат шайлоонун минималдуу нормалары"},{"t":"p","h":"Шайлоо процессинин негизги талабы – жарандардын ишеними. Эгер элдин көпчүлүгү шайлоонун эркин жана акыйкат өткөндүгүнө ишенбесе, анда шайлоо өз максатына жетпей калат. Бул ишенимдин камсыздалышы көптөгөн факторлорго – тарыхый, саясий, маданий мүмкүнчүлүктөргө жараша болору анык. Бирок төмөндөгүдөй шарттар сакталса, каалагандай өлкөдө жарандардын басымдуу көпчүлүгү шайлоонун жыйынтыктарын текшере алат деп ишеничтүү айтууга болот."},{"t":"p","h":"2. ынын көз карандьЕ андысы ЫГЬ йлоо комиссиясынын мучелеру саясий партиялардын (же талапкерлердин) экулдеру болууга тийиш. Башка мамлекеттерде партия мучелеру жана талапкерлердин екулдеру шайлоо комиссияларына киргизилбейт. Шайлоо комиссияларынын курамы кандай турде түзүлгөнүнө карабай, андагы орундардын басымдуу белугун бир дагы партия, талапкер, коалиция (бир нече партиянын же талапкердин бириккен тобу) ээлеп калбашы керек Шайлоо комиссиясынын иши атайын Саясий партиялар деген эмне жана мыйзамдардын негизинде жүргүзүлөт, ушул алардын кандай кереги бар? мыйзамдарга ылайык ага шайлоо өткөрүш үчүн Саясий партияны анын бардык мүчөлөрүнө бюджеттик каражаттар бөлүнөт. Аткаруу жана жаккан принциптер менен саясий багытты мыйзам чыгаруу бийликтерин кийлигиштирбөө жайылтуу жана колдоп туруу максатын үчүн ага эркиндик камсыз кылынат. Шайлоо көздөгөн саясий топ түзөт. комиссиясынын иши калктын кеңири катмары учун ачык-айкын болушу керек,"},{"t":"p","h":"Партияга мүчө болбогон талапкерлер өз ал дынча иш жүргүзгөндүктөн, өлкөнү башка- ж – руу маселелерин ар тараптан камтыган саясий программа түзүү алар үчүн кыйынга турат."},{"t":"p","h":"Саясий партиялардын дагы бир артыкчылыгы Шайлоо кодексинин жол-жоболору так бар: алар талапкерлерди элге таанытып, иштелип чыккан болууга тийиш. Эгерде кодекске колдоо көрсөтүп турат. Биргелешип олуттуу өзгөртүү киргизиш керек болсо, анда ЗРакеттенуу менен, алар шайлоочуларды өз бул маселе жалпы Ж к тал у. ЛДИ коюл ушу жеңип чыгышына жол ачат. тарабына тартып, өздөрүнүн талапкеринин керек. Башка ар кандай мыйзамдар сыяктуу эле шайлоо кодекси да калктын калың катмары үчүн зордоп киргизүү аракети таптакыр мыйзамсыз Көпчүлүк өлкөлөрдө саясий партияга түшүнүктүү, жеткиликтүү болушу зарыл. Көпчүлүк жорук катары айыпталат."},{"t":"p","h":"<span class=\"pg\" data-n=\"29\">29<\/span>__Жарандын эана мамленстити вашнарууеа татышуу – ХХ1 ролунар демократиялык өлкөлөрдө 18ге чыккан ар бир жаран добуш берүү укугуна ээ болот, зядыктан шайлоо кодексин алар да окуп түшүнө алышы керек. ІПайлоо жөнүндөгү мыйзамдарды бузган адам ээлеген кызматына карабастан өз мезгилинде жазаланууга тийиш. Эгерде мыйзамды шайлоодо женип чыккан талапкер бузган болсо, анда адатта кайра шайлоо уюштурулат"},{"t":"p","h":"3. Талапкерлерди эркин тандоо Талаптарга ылайык келген ар кандай жаран талапкер катары көрсөтүлүү мүмкүнчүлүгүнө ээ болушу керек. Эгер өзгөчө талаптар (мисалы, кол чогултуу талабы) киргизилген болсо, буларды аткаруу үчүн ар бир талапкерге бирдей мүмкүндүк берилиши зарыл, Мамлекет бул процесске керек. Талапкер мамлекеттик органда шайлоочулардын өкүлү боло алабы-жокпу, муну шайлоочулар өздөрү чечет. (Кээ бир өлкөлөрдө талапкерлер үчүн билим цензи коюлат Эгер өткөндүн жана азыркынын кээ бир чыгаан саясий лидерлери, мисалы, АКШнын мурдагы президенти Абраам Линкольн, билим цензи коюлган азыркы кээ бир өлкөлөрдүн жарандары болушса, шайлоодо талапкер боло алмак эмес"},{"t":"p","h":"4. Саясий партияларга этө катуу көзөмөлдүн жоктугу Көпчүлүк өлкөлөрдө саясий партияларды каттоо талап кылынат. Бирок каттоонун жол-жобосу жөнөкөй жана бекер, же болбосо абдан арзан болушу керек. Бул жагдай іптайлоодо кайсы саясий партиялар таймаша ала турганын шайлоочулар гана чечиши үчүн зарыл. Эгер саясий партия өзү эле мыйзамды бузбаса, каттоодон өткөндөн кийин шайлоо комиссиясы ла, бийлик органдары да анын ишине кийлигишпеши керек, алардын буга акысы да жок. Талаштуу жагдайлар сот тартибинде жөнгө салынууга тийиш. Демек, оппозициячыл партиялардын өкмөттү сындашына тыюу салган мыйзамдар болбошу керек экендиги түшүнүктүү."},{"t":"p","h":"г зуш үчүн бирдей т түз Көп өлкөлөрдө шайлоо кампаниясын өткөрүү үчүн өкмөт саясий партияларга же талапкерлерге финансылык каражат бөлүп, ар бири өз саясатын шайлоочуларга тааныштырышы үчүн мамлекеттик телерадио каражаттарынан бекер пайдалануу мүмкүнчүлүгүн берет. Өнүккөн демократиялуу өлкөлөрдүн көбүндө шайлоо өнөктүгүн каржылоо эрежелери ачык-айкындыкты, айрыкча партия жактоочуларынын акчалай салымдарына келгенде өзгөчө так болууну, ушул акчалай каражаттар кандай чыгымдалганы тууралуу маалымат берип турууну талап кылат. Бул сыяктуу маалымат элдин саясий партияга финансылык жардамды ким берип жатканын билишине мүмкүнчүлүк түзөт. Кээ бир өлкөлэрдэ саясий партиялардын фондуна айрым кишилерден же топтордон келип түшчү финансылык салымдардын өлчөмүнө, ошондой эле үгүт кампаниясын жүргүзүүдө пайдаланылуучу каражаттарга да кайсы бир даражада чек коюлат. Бирок мындай чектөө адамдын өз каражатын өзү каалагандай пайдалануу эркиндигин бузабы-жокпу деген маселенин тегерегинде талаш-тартыш чыгып келе жатат."},{"t":"p","h":"Шайлоо Шайлоо комиссиясы добуш берүү укугуна ээ шайлоочулардын тактап, жаңыртып түзүшү керек. Бул тизмелер калктын калың катмары карап чыгып, тактай алышы үчүн җеткиликтүү болууга тийиш. Шайлоо комиссиясы өз ишинде ар бир шайлоочунун добушунун баалуу экенине кепилдик (гарантия) бериши керек. Бул шайлоо участкалары дээрлик бирдей сандагы шайлоочуларды камтыгыдай, участкалардын чегарасы бир эле саясий партиянын кызыкчылыгын көздөбөстөн, баарына тең болгудай калыс түзүлөт дегенди билдирет."},{"t":"p","h":"1. Жалпыга бирдей шайлоо укугу Жынысына, ден соолугуна, диний ишенимине же улутуна карабастан, тиешелүү куракка келгенде бардык жарандар шайлоо укугуна ээ болушу керек. Көп өлкөлөрдө добуш берүү укугу жашы 18ден өткөндөрдүн бардыгына берилет."},{"t":"p","h":"‚ Шайлоо участкас й и"},{"t":"p","h":"Шайлоо комиссиясы шайлоо участкасын бардык зарыл материалдар менен жабдып, бардык шайлоочулар үчүн бирдей жеткиликтүү болушун камсыз кылууга тийиш. Оорукчандар, улгайгандар же майыптар үйдөн чыкпай туруп добуш берүү мүмкүнчүлүгүнөн пайдаланып калышы үчүн шайлоо комиссиясынын мүчөлөрү аларга барышы керек. Көп өлкөлөрдүн башка мамлекетте жашап жаткан жарандары да добуш берүү мүмкүнчүлүгүнө ээ болушат – алар демейде почта аркылуу добуш берет."},{"t":"p","h":"БАРДЫК жарандар өз добуштарынын баркына жетсе, добуштары бирдей бааланууга тийиш. Эгерде төмөндөгүдөй тажрыйба жайылтыла турган болсо, кишилер өздөрүнүн шайлоодогу добушун барктабай калат:"},{"t":"v","l":["<span class=\"pg\" data-n=\"30\">30<\/span>Шайлоо","","а) шайлоочулар сатып алынса;","б) бюллетендер жасалма түрдө оңдолуп,","түзөтүлсө;","Шайлоодогу алдамчылыкка бөгөт коюу","(жол бербөө)","Кээ бир өлкөлөрдө добуш берүү учурундагы"]},{"t":"p","h":"в) шайлоо комиссияларынын мүчөлөрү алдамчылыкты болтурбоо үчүн бардык сатып алынса, ушундан улам кээ бир аракеттер жасалат. Мисалы, бул максатта шайлоочулардын бир нече жолу добуш темендегудей каражаттар жана ыкмалар беришине жол ачылып калса;"},{"t":"p","h":"кайсы бир талапкерге каршы добуш бе- &gt; Ар бир добуш берген адамдын манжасына белги коюу үчүн колдонулуучу сыя. Зарыл рип коюшу мүмкүн болгон шайлоочулар тизмеден чийилсе."},{"t":"p","h":"Мындай иштерге күнөөлүү адамдар дароо, болгондо ла сот аркылуу, жазаланышы керек. Ошондой эле берилген добуштардын эсеби да так ай"},{"t":"p","h":"4 бири добуш берүүнүн жыйынтыктарын текшерүү мүмкүнчүлүгүнө ээ болушу зарыл. Шайлоонун жергиликтүү жана жалпы улуттук жыйынтыктары шайлоо өткөрүлгөндөн кийин мүмкүн болушунча тез жарыяланышы керек. Белги коюлган шайлоо бюллетендеринин баары шайлоо өткөндөн кийин анын жыйынтыктары тууралуу талаш-тартыш чыга турган болсо кайра саноо үчүн сакталып коюлат."},{"t":"p","h":"10. Жашырын добуш берүү Демократиянын өзөгү – жашырын добуш берүү. Шайлоочулар өздөрү кимди тандаганын эч кимге билгизбей добуш берүүгө мүмкүнчүлүк алышы керек, Добуш берүү алдында, добуш берүү учурунда жана андан кийин да шайлоочуларды бирөө үчүн добуш берүүгө мажбурлап коркутупүркүтүүгө жол коюлбашы керек."},{"t":"p","h":"а 1 убакытка чейин өчпөй турган мындай сыя ультрафиолет жарыгына салып караганда гана көрүнөт."},{"t":"p","h":"Добуш берүү үчүн тунук сандык (ага шайлоочуларга салынган керунуп турат)."},{"t":"p","h":"Шайлоо процессиндеси бардык жагдайларды, шайлоочулардын тизмесинде мисалы, катталган адамдардын санынын белгиленген келишин дал"},{"t":"v","l":["санына","текшерүү."]},{"t":"p","h":"Шайлоо процессине көз салып турушу уюмдардын өкүлдөрүн катыштыруу. Өзгөчө кырдаалдарда, мисалы, чоң чыр-чатактан кийин, эларалык уюмдар атүгүл шайлоонун жүрүшүнө жетекчилик кылышы да мүмкүн. Добуштарды параллель түрдө эсептеп туруу"},{"t":"p","h":"БӨУлардын мүчөлөрү шайлоочулардын добуш берүү сандыгына бюллетендерди кантип салып жаткандыгына байкоо жүргүзүп, добуштарды өздөрүнчө эсептеп турса болот. Алар жүргүзгөн эсептин натыйжасы кийин добуштардын расмий жарыяланган эсеби манен салыштырыла."},{"t":"p","h":"Шайлоонун жыйы бардык тараптар макул болушу үчүн шайлоодо көз карандысыз байкоочулардын жана “ишенимдүү кишилер” деп аталган партия өкүлдөрүнүн эркин катышуусу камсыз кылынышы керек. Бул жагдай добуш берүүнүн жүрүшүн бүт бойдон көзөмөлдөө үчүн зарыл. Олуттуу талаш-тартыш чыккан же шайлоонун жыйынтыгы шектүү болуп калган учурларда шайлоонун жүрүшүн байкап туруу үчүн жергиликтүү байкоочулар менен ММК өкүлдөрүнө эле эмес, ТЕЕ$, БУУ (Бириккен Улуттар Уюму, орусча-ООН), ЕККУ сыяктуу эларалык уюмдарга жана эларалык маалымат каражаттарына да мүмкүнчүлүк берилиши керек. Эгерде бул уюмдар шайлоону эркин жана акыйкат өттү деп эсептебесе, анда келечекте инвесторлор жана донорлор бул өлкөдө иштөөгө тиешелүү деңгээлде көңүл бөлбөй коюшу мүмкүн. Натыйжада кийинки өткөрүлчү шайлоолор бир топ демократиялуу уюштурулушу үчүн ага көбүрөөк кысым жасалат, Бирок көп сандуу болгондуктан, акыр-аягында дал шайлоочулардын өздөрү жана жергиликтүү бейекмет уюмдар шайлоонун туура өткөрүлүшүнө көзөмөлдү бардыгынан мыкты камсыз кыла алат."},{"t":"p","h":"Байкоочуларбардык шайлоо комиссияларына, Борбордук шайлоо комиссиясына даэч тоскоолдуксуз кире алууга тийиш. Аларга шайлоо комиссиялары тарабынан уюштурулуучу бардык жолугушуулар жөнүндө алдын ала билдирилип, чогулуштарга катышуусуна уруксат берилиши керек. Байкоочулар\" добуш берүү күнү менен эле чектелип калбай, шайлоо жарыяланган күндөн тартып анын жыйынтыктары жарыяланганга чейинки бардык иш-чараларга көз салып турушу зарыл."},{"t":"p","h":"Шайлоо процессинде байкоочулар жана ММК абдан маанилүү роль ойнойт. Алар шайлоо комиссияларындай эле орчундуу милдет аткарат. Эгер байкоочулар менен ММКга мындай мүмкүнчүлүк толук берилбесе, шайлоону демократиялуу өттү дегенге болбойт."},{"t":"p","h":"Эсиңерде болсун: Демократиялуу шайлоодо шайлоочунун бюллетенге белги койгон учуру гана <span class=\"pg\" data-n=\"31\">31<\/span>ноозундаёы силердин ролунар жашыруун болот. Шайлоого чейин, шайлоо күнү жана андан кийин боло турган башка БАРДЫК иштер байкоочулар менен ММК үчүн ачык болушу керек!"},{"t":"p","h":"Көпчүлүк өлкөлөрдүн Конституциясы боюнча шайлоодо жеңип чыккандар белгилүү бир мезгил ичинде жаңы өкмөттү түзүшү керек. Шайлоодо утулуп калган өкмөт жаңы өкмөт ишке киришмейинче өз милдеттерин убактылуу аткарып турат. Бул мезгилде мурдагы өкмөт шайлоодо жеңип чыккан партиянын макулдугусуз эч бир жаңы укуктук актыларды кабыл албашы керек."},{"t":"p","h":"Жерримандер*. Шайлоонун жыйынтыктары кандайча бурмаланат? Берилген схемаларда шайлоо округдарынын формасы ава чоңдугу шаийлосбнун жыйынтыгына і олуттуу таасир этиши мүмкүн экендиги көр"},{"t":"v","l":["шайлоочулардын кимдерди жактай тургандыгы му","ду Анткени тигил же бул жердеги ","у шайлоодо бепгилуу болуп калат. Муну "]},{"t":"p","h":"эске алуу менен алдыдагы шайлоодо өздөрү каалаган натыйжага жетишүү учун кызыккан адамдар округдардын чегарасын тийиштүү түрдө өзгөртүшү мүмкүн."},{"t":"p","h":"Темендегу мисалды карап көргүлө:"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Округ Шайлоочулар Жеңгендер<\/td><td>Округдагы 1е шайлоочудан алтоо А партиясы үчүн,<\/td><\/tr><tr><td>Б<\/td><td>в<\/td><td>калган алто<\/td><td>парт<\/td><td>ы<\/td><td>добуш берген эле,<\/td><\/tr><tr><td>се<\/td><td>Шайлоочулар<\/td><td>т<\/td><td>шайлоо округуна бөлүнгөн акыйкат <\/td><\/tr><\/table><\/div>"},{"t":"p","h":"2 Б"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>шайлоо систе<\/td><td>темөндөтгү<\/td><\/tr><tr><td>к<\/td><td>схемада<\/td><td>А нар-<\/td><td>Шайлоочулар<\/td><\/tr><tr><td>4<\/td><td>тиясы эки шайлоо<\/td><td>округунда<\/td><\/tr><\/table><\/div>"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>жеңгидей, ал эми Б партиясы башка<\/td><td>А<\/td><td>5<\/td><\/tr><tr><td>1-сурет<\/td><td>эки шайлоо округунда жеңгидей<\/td><td>А<\/td><td>5<\/td><\/tr><tr><td>кылынып, округдардын чёгарасы<\/td><td>А<\/td><td>5<\/td><\/tr><tr><td>белгиленген ({1-сурет).<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"т Эгерде округдардын чегарасы башкача белгиленсе, Б партиясы бир"},{"t":"v","l":["гана округда А партиясы үч шайлоо округунда жеңип чыгат (2-сурет).","Биз да А партиясы бир гана округда, ал эми Б партиясы үч округда","жеңгидей кылып округдардын чегарасын өзгөртсөк болот.","5","","2-сүрөт"]},{"t":"p","h":"*Округдардын чегараларын бурмалоо дегенди билдирген бул термин АКШнын Миссачусетс штатынын губернатору Жерри Элбриждин ысымынан алынган. Ал 1812-жылы шайлоо округдарынын чегараларын өзпартиясынын пайдасында тууралап өзгөрткөн. Ошондо гезитке бир нече шайлоо округун саламандрага (көлөмү чоңоюп-кичирейип ттуруучу деңиз жаныбарына) окшотуп тарткан каррикатура чыгарылган, аны “жерримандер” деп коюшкан."},{"t":"p","h":"5.0 Шайлоосистемалары"},{"t":"p","h":"Ар кайсы өлкөлөрдө ар кандай саясий системалар жана шайлоо системалары бар. Көбүнчө бир өлкөнүн ичинде, маселен, президентти жана парламентти шайлоо үчүн ар кандай системалар пайдаланылат. Президенттик шайлоодо эки түрдөгү шайлоо болот:"},{"t":"p","h":"“Баарынан алдыда”. Талапкерлердин ичинен эң көп добуш алган талапкер (бардык катышкан шайлоочулардын 50 %ына жетпесе да) жеңүүчү деп эсептелет."},{"t":"p","h":"Эки тур системасы. Жеңип чыгуу үчүн талапкер добуштардын 50 %ын же андан ашуун бөлүгүн алууга тийиш. Эгер талапкерлердин бири да мынчалык добуш албай калса, шайлоонун экинчи туру өткөрүлөт да, ага эң көп добуш топтогон эки талапкер катышат."},{"t":"p","h":"Парламенттик шайлоо үчүн негизинен үч түрдүү системанын бири колдонулат:"},{"t":"p","h":"Салыштырма көпчүлүктүн мажоритардык системасы (АКШда, Индияда, Улуу Британияда колдонулат). Мындай система боюнча өлкө көптөгөн шайлоо округдарына бөлүнөт. Демейде бул округдар бир мандаттуу болот, б.а. бир нече талапкердин ичинен бирөө гана тандалат. Шайлоочулар партия үчүн эмес, өз округунан тандалуучу талапкер үчүн добуш берет. Айрым учурларда бирден ашуун өкүл шайланышы мүмкүн, ошондо деле бюллетенге шайлоочулар ар бир мандат боюнча бирден талапкер үчүн өзүнчө белги коёт."},{"t":"p","h":"Бул системанын артыкчылыгы – ар бир талапкердин өз округу менен дайыма байланышта болгондугунда. Ошентип, шайлоочулар парламенттеги өз өкүлүн тааный алат. Мындай системаны колдонгон көпчүлүк демократиялык өлкөлөрдө депутаттар шайлоочулар менен дайыма жолугушуп, парламенттеги ордун кийинки мөөнөттө да сактап калууга аракеттенет."},{"t":"p","h":"<span class=\"pg\" data-n=\"32\">32<\/span>Мунун начар жагы – шайлоочулардын 49 %ы эске алынбай, алардын пикири парламентте чагылдырылбай калышы ыктымал экендигинде. Добуштардын 51 гана %ын алган талапкер чыкканда ушундай болот. Анын үстүнө бир мандаттуу округдарда бирден партия шайланса, натыйжада жеңип чыккан партия ээ болгон мандаттардын саны бүткүл өлкө боюнча ага берилген добуштардың санына пропорциялуу болбой калышы мүмкүн. Башкача айтканда, шайлоочулардын азчылыгының добушун алган партия парламенттеги орундардын көпчүлүгүн ээлеп алышы ыктымал. Мисалы:"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td> А партиясы |20 мин<\/td><td>22 миң<\/td><td>88 миң шайлоочу<\/td><\/tr><tr><td>Б партиясы<\/td><td> 121 миң<\/td><td>105 миң<\/td><\/tr><tr><td> Мандатка ч<\/td><td>А<\/td><td>А<\/td><td>А партиясы 4 мандатка ээ болот<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"болот &gt; партиясы партиясы партиясы партиясы Б партиясы 1 мандатка ээ болот"},{"t":"p","h":"Мында А партиясы жалпысынан 88 миң эле шайлоочунун добушун алса да, 4 мандатка, ал эми Б партиясы 105 миң шайлоочунун добушу менен гана мандатка ээ болуп калат. Демек, азчылыктың колдоосуна жетишкен партия бийликке келет."},{"t":"p","h":"Пропорционалдуу өкүлчүлүк системасы (Бразилияда, Финляндияда, Швецияда, Нидерландияда колдонулат). Бул системада бүтүндөй өлкө бир “шайлоо округу” болот же көп мандаттуу чоң округдар гүзүлөт. Шайлоочулар айрым талапкерлерге эмес, өлкө же округ боюнча топтогон добуштарынын санына жараша кийин парламенттеги орундарды бөлүштүрүп ала турган партиялар үчүн добуш берет. Округ боюнча партиялык тизмеде көрсөтүлүүчү партия мүчөлөрү адатта шайлоо күнүнө чейин эле даярдалат да, кийин бул мандаттарга ээ болот. Мисалы, 10 мандаты бар округда добуштардын 20 %ын алган партия 2 мандатка ээ болот. Эгер бүтүндөй өлкө бир округ, ал эми парламентте 150 орун болсо, анда добуштардың 20 %ын алган партия 30 мандатка ээ болот. Мыйзам боюнча демейде партиянын бир мандатка жетишүүсү үчүн партия топтоого тийиш болгон добуштардын минималдуу саны (шайлоо босогосу) аныкталат, Көбүнчө бул 3-5 %ды түзөт,"},{"t":"p","h":"Бул системанын артыкчылыгы – анын Австралияда парламенттик шайлоодо рейтингчил"},{"t":"raw","h":"<h4 class=\"mk\">барлык добушун<\/h4>"},{"t":"p","h":"көпчүлүгүнүн добуш берүү системасы колдонулат: мында эсепке мүмкүндүк шайлоочулар шайлоо бюллетенине талапкерлерди жактыруу даражасына карай сандарды коюшу керек. алууга бергендигинде Мында ошондой эле Маселен, эгерде бир шайлоо участкасында беш парламентте ар түрдүү көп партиялар талапкер ат салышып жатса, жактыруу даражасына болушуна кепилдик берилет. Атүгүл өлкөнүн ылайык алардын аты-жөндөрүнүн тушуна 1ден ар кайсы бөлүктөрүндө минималдуу добуш 5ке чейинки сандар коюлушу керек. “1-орун” алган партия деле парламенттеги орундардын белгилеринин 50 %дан ашуун бөлүгүн алган көпчүлүгүн ээлеп калышы мүмкүн. Бул талапкер жеңүүчү катары дароо шайланат. Эгер бир дагы талапкер буга жетише албаса, анда шайлоочулардын көпчүлүгүнүн өкүлдөрү экинчи, үчүнчү жана башка орундар эсептелип, болушун жана саясий көз караштардын ар ошого жараша эң жогорку чекке чыккан талапкерлер түрдүүлүгүн камсыз кылат. аныкталат. Баарынан көп добуш алган талапкер"},{"t":"p","h":"Мунун кемчилиги – шайлоочулар көп жеңүүчү деп табылат."},{"t":"p","h":"учурларда өздөрүнүн парламенттеги өкүлү ким экендигин билбей калат. Анын үстүнө партиялар начар өнүккөн өлкөлөрдө үстөмдүк кылуучу партия оной эле добуштардын көпчүлүгүн алып жеңип чыгышы мүмкүн. Бирок бул система жарандарды күчтүү саясий партия түзүүгө кызыктыруу үчүн керек деген пикир да бар. Мунун дагы бир жаман жагы өкмөттүн туруксуз болушуна байланышкан, Анткени күчтүү партиялар көп болсо, алардын бири да жеке өзү өкмөттү түзө албай, коалицияларга биригүүгө аргасыз болот. Мындай жол менен куралган өкмөт туруктуу болбой калышы мүмкүн. Бирок көп адамдар коалициялык өкмөт түзүүнү жактап, мындайда ар түрдүү саясий көз караштар чагылдырылгандыктан, демократиялык башкарууга кенен жол ачылат дешет."},{"t":"p","h":"Аралаш система (Тайванда жана Грузияда колдонулат). Мында пропорционалдуу өкүлчүлүк жана салыштырма көпчүлүктүн мажоритардык системалары айкалышат. Шайлоочулар өз округунун өкүлү үчүн да, партиялар үчүн да добуш берет. Демек, парламентте эки түрдөгү: өз округунан тике шайланган жана партиялык тизме боюнча шайланган өкүлдөр болот."},{"t":"p","h":"Бул системанын негизги артыкчылыгы – эки башка системанын эң жакшы жактары айкалышканында. Ошентип, парламентте шайлоочулардын түз шайлаган өкүлдөрү болот, ошол эле учурда ар түрдүү саясий көз караштары бар анча чоң эмес партияларга да орун берилет."},{"t":"p","h":"Мунун кемчилиги шайлоочулардын түшүнүшү үчүн бир аз татаал экендигинде. Анткени алар эки ирет добуш берип, эки шайлоо бюллетендин ар бирине бирден белги коюшу керек болот. Анын"},{"t":"h3","h":"<span class=\"pg\" data-n=\"33\">33<\/span>үстүнө парламент эки түрдүү жол менен шайланган"},{"t":"p","h":"депутаттардан түзүлгөндүктөн, жаатташуучулук күч"},{"t":"h3","h":"алып кетиши мүмкүн."},{"t":"p","h":"5.1"},{"t":"h3","h":"Кайсы система жакшы?"},{"t":"v","l":["Бул суроого бир жактуу жооп берүү мүмкүн эмес ","Тарыхый, саясий жана маданий өнүгүү жолуна карай ар ","кайсы өлкөлөр бири-биринен абдан айырмаланып турат. ","Бир өлкө үчүн туруктуу өкмөткө караганда бирдей!","өкүлчүлүктүн камсыз болушу көбүрөөк пайдалуу","болсо, башка өлкөгө мунун тескериси ылайык келиши","мүмкүн. Бардык эле мыйзамдар сыяктуу, шайлоо","системалары да өлкөнүн өнүгүп өзгөрүшүнө жараша!","өзгөрүп турушу мүмкүн экендигин жана ушундай","болууга тийиш экендигин билип коюу керек.","Силердим катышууңар ар кандай"," деңгээлдердеги шайлоолордун жыйынтыгына","таасир этиши мүмкүнбү?","жургузавн"]},{"t":"h3","h":"Билбейм"},{"t":"p","h":"89%"},{"t":"h3","h":"Ооба 54.9% "},{"t":"p","h":"7 Бирок өлкөдөгү эн маанилүү мыйзамдар – бул бизди кимдер башкарууга тийиш экендигин түздөн-түз аныктай турган мыйзамдар, Ошондуктан мыйзамдар өзгөртүлгөн бардык учурларда бул маселе коомчулукта кеңири талкууланып, бардык жарандардын, бүтүндөй жарандык коомдун жана саясий партиялардын жалпы көз караштары эске алынууга тийиш. Кайсы гана система кабыл алынбасын, экмет, жарандык коом җана саясий партиялар мунун маанисин бардык жарандарга жөнөкөй жана даана тил менен түшүндүрүп берүүгө милдеттүү. Ар бир жаран өзү тандаган лидердин кандайча шайланарын билүүгө жана түшүнүүгө тийиш."},{"t":"p","h":"6.0 Кыргызстандагы шайлоо системаларынын тарыхы"},{"t":"p","h":"Россия империясынын курамына кошулганга чейин кыргыздардын саясий жана чарбалык биримдиги уруулук-уруктук түзүлүшкө негизделген. Ал мезгилдеги каада-салт укугунун нормаларына ылайык башкаруу жана сот иштерин ар бир уруунун же уруктун топ башылары тарабынан шайлануучу бийлер аткарчу. Мындай шайлоо демейде уруунун (же уруктун) жыйынында ачык түрдө өткөрүлчү."},{"t":"p","h":"Кыргызстандын аймагы Россия империясына кошулгандан кийин колониялык бийлик бир катар административдик реформаларды жүргүздү. Бүтүндөй Борбордук Азияда мурдагы уруулук-уруктук эрежелерге негизделген калкты административдик-аймактык жактан бөлүштүрүү жоюлду. Бул кыргыздардын тарыхында боло келген уруу-уруктук түзүлүш расмий түрдө жокко чыгарылды дегенди билдирген. Мындай кадамга, биринчиден, кыйла ири бирдик катары урууларды административдик башкаруу кыйын экендиги, экинчиден, көп адамдардан турган урууну жалгыз уруу башчысы жакшы башкара албай, чөлкөмдөгү тынчтык жана коопсуздукту камсыздоо кыйынга турары түрткү болгон."},{"t":"p","h":"Калкы көчмөн райондордо уруу башчыларын, ал эми отурукташкан райондордо мурдагы хан бийлигинин өкүлдөрүн бийликтен четтетүү үчүн айыл-кыштак жана волость бийлигине жүз башы, миң башыларды, болуштарды шайлоо өткөрүлө баштады. Уезддер менен облустардын жетекчилерин падышанын колониялык администрациясы дайындап турду. Уезддерди полковниктер, губернияларды генералдар башкарып, бүтүндөй Түркстан чөлкөмүндө император өзү дайындаган генерал-губернатор бийлик жүргүзгөн. Падышалык режимдин жаңы жергиликтүү жана борбордук административдик түзүмдөрү, мыйзамдары менен салыктары киргизилди. Бара-бара түпкүлүктүү калкка карата империялык мыйзамдар катаалдашты. Маселен, 1907-жылкы шайлоо мыйзамына ылайык Түркстандын калкы Мамлекеттик думага (парламентке) өкүл шайлоо укугунан кол жууган. Жергиликтүү эл волосттордун башкаруучулары (болуштар) менен элдик сотторду шайлоого гана катыша алган."},{"t":"p","h":"1917-жылкы Октябрь революциясы адегенде империялык колониализмден улуттук-демократиялык башкарууга цивилизациялуу жол менен өтүү мүмкүнчүлүгүн бергендей көрүнгөн эле. Тилекке каршы, мындай болгон жок. СССРдин Конституциясында адам укугунан өйдө турган эч нерсе жок деп жазылса да, бул укуктар абдан кеңири масштабда бузулуп келген. Адам укуктарын сактоону соттор да, бийликтин расмий өкүлдөрү да камсыз кылышкан эмес."},{"t":"p","h":"1991-жылы, Советтер Союзу кулагандан кийин, Кыргызстандын парламенти Кыргыз Республикасынын эгемендүүлүгү жөнүндө декларацияны кабыл алды. Ал эми 1993-жылы Конституция кабыл алынып, элге бийликти жана өз жетекчилерин шайлап алуу укугун мыйзамдуу түрдө кайрып берген демократиялык система иштей баштады."},{"t":"p","h":"<span class=\"pg\" data-n=\"34\">34<\/span>10 2004-жылкы Кыргызстандагы шайлоо системасы"},{"t":"p","h":"Шайлоо – демократиянын өзөгү. Ал элге өз Конституциядан карап көргүлө өкүлдөрүн тандоо у ч рун я кыл Ан меда лүү кыл; и. чечимде ына у 18 жашка чыккан адамдын шайлоодсе кабыл я рген усул, ыкма болуп кандай укуктары болот?"},{"t":"p","h":"саналат. Шайлоо бийликтин тынч жол менен өткөрүлүп 2 бирер #айайкөр бойо азасыңарды? берилишине өбөлгө түзөт. Ошентип, эгер улуттук жана и Силер үчүн ким добуш бере алат? социалдык (этностук, диний, гендердик же идеологиялык) азчылыктардын укуктарын коргой турган конституциялык белгилүү жоболор колдонулса, мындай система адам укуктарына кепил болууга тийиш. Бирок бийли шайлоо аркылуу бир колдон башка бир колго тынч жол менен өтүп турушу үчүн талапкерлер ань жыйынтыгына макул болушу керек. Бул процесс эркин жана адилеттүү түрдө, эларалык принциптер жана так аныкталган нормалар менен эрежелерге ылайык өттү деп таанылган учурда гана ушунда болушу мүмкүн."},{"t":"p","h":"Кыргыз Республикасынын Конституциясында, ошондой эле Кыргызстан ратификацияла (расмий түрдө кабыл алган) бир катар эларалык документтерде бүткүл элдин (бардык жарандардын) өлкөсүндөгү саясий турмушка катышуу укугу таанылат. Бул укук төмөндөгүлөрдү камтыйт:"},{"t":"p","h":"&gt; сөз эркиндиги"},{"t":"v","l":["&gt; биригүү укугу","&gt; дин тутуу, өз оюн ачык айтуу жана элге жайылтуу эркиндиги"]},{"t":"p","h":"&gt;» мамлекеттик бийлик органдарына шайлоо жана шайлануу укугу.: Кыргыз Республикасынын Конституциясында (1-статья, 3-пункт) “Кыргызстандын эли – эгеме! дүүлүктүн ээси жана Кыргыз Республикасындагы мамлекеттик бийликтин бирден-бир туткасы”, – д айтылган, Бул принцип мамлекеттик бийлик органдарынын түзүлүшүнө жарандардын түздөнжана тең катышуусун гарантиялай турган шайлоо системасынын өнүгүшү үчүн пайдубал болуп бер"},{"t":"p","h":"Шайлоо кодексинде жана бул жааттагы башка мыйзамдарда шайлоо өткөрүү тартиби мен‹ эрежелери берилген. Бул мыйзамдарда Борбордук шайлоо комиссиясын (БШК) түзүү үчүн уку негиз түптөлгөн, ошондой эле:"},{"t":"p","h":"жарандардын шайлоо укуктары түшүндүрүлгөн;"},{"t":"p","h":"шайлоо комиссияларын түзүү тартиби белгиленип, алардын милдеттери чечмеленген; талапкерлерге коюлуучу квалификациялык талаптар, ошондой эле аларды көрсөтүү жана каттоо процесси аныкталган;"},{"t":"p","h":"участкалык шайлоо комиссияларынын шайлоолорду уюштуруу жана өткөрүү боюн! милдеттери көрсөтүлгөн;"},{"t":"v","l":["шайлоочулардын тизмелерин тузуу жана тактоо","тартиби берилген;","шайлоо өнөктүгүн жүргүзүү эрежелери","Кыргыз Республикасынын шайлоо","системасындагы жаңы өзгөрүүлөр","2004-жылдын","октябрында","Кыргы:"]},{"t":"p","h":"жана шайлоо күнү добуш берүү тартиби Республикасынын Президенти маркало аныкталган; (белгилөө) жол-жобосу жөнүндөгү шайлоонун жыйынтыктарын чыгаруу тартиби Жогорку Кеңеш кабыл алган мыйзам кол койду. Ага ылайык шайлоочуну. жана эрежелери, ошондой эле бүтүндөй шайлоо сол бармагынын үстүнө ультрафиолет“"},{"t":"p","h":"өткөрүү эркиндигин гарантиялай жарыгында гана көрүнө турган атайы турган механизмдер аныкталган. сыя сүртүлөт. Бул мыйзам шайлоо күн Кодекс шайлоонун жалпы, тең, тике жана жашырын бир шайлоочунун бир нече ирет добу! добуш берүү негизинде өткөрүлүшүн камсыздайт. Коомдо беришине жол койбоо үчүн иштелий социалдык абалы кандай экендигине карабастан, ар бир М КЕЕ: ш жаран добуш берүү укугуна ээ. Мында би d>Альфа партиясынын жеңип чыккан<\/td><\/tr><tr><td>1<\/td><\/tr><tr><td>талапкери өкмөт түздү.<\/td><\/tr><tr><td>(в<\/td><\/tr><tr><td>2010<\/td><td>Альфа партиясынын жеңип чыккан<\/td><\/tr><tr><td>талапкери өкмөт түздү.<\/td><\/tr><tr><td>Бета жана Гамма партиялары коалиция<\/td><\/tr><tr><td>түзүп, Бета партиясынын жеңип чыккан<\/td><\/tr><tr><td>талапкери президент, а Гамма партиясынын<\/td><\/tr><tr><td>өкүлү вице-президент болду. Алар биригип,<\/td><\/tr><\/table><\/div>"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>АГ<\/td><td>коалициялык өкмөт\" түзүшү. өкмөт түздү.<\/td><\/tr><tr><td>2018<\/td><td>32%<\/td><td>54%<\/td><td>Бета партиясынын женип чыккан талапкери<\/td><\/tr><tr><td>2022<\/td><td>52 %<\/td><td>32%<\/td><td>16%<\/td><td>|Альфа партиясынын жеңип чыккан<\/td><\/tr><tr><td>1<\/td><td>өкмөт түздү. <\/td><\/tr><\/table><\/div>"},{"t":"p","h":"*Коалициялык өкмөт – бир нече партиянын колдоосуна таянган өкмөт."},{"t":"p","h":"Эскертүү: Кыргызстан менен Россияда президенттин кайсы бир партияга мүчө болушуна Конституция жол бербейт. Бирок президенттик системадагы өлкөлөрдүн көбүндө мындай эреже жок."},{"t":"p","h":"Республикачылардын жеңиши Нур өлкөсүндөгү оппозициялык Республикачыл партия өзүнүн кенже өнөгү болгон Социалдык адилеттүүлүк ‚ партиясы менен биргелешип мурунку шайлоодогуга караганда 20 %га көп добуш алганын быйылкы президенттик шайлоо көрсөттү. Мурунку шайлоодо Республикачылар партиясына берилген добуштар 9 %га азайганын эске алсак, бул абдан чоң өзгөрүү. Быйылкы жылы Бириккен партияга берилген добуштардын үлүшү 15 %га азайган, бул мурунку президенттин байланышы бар деп жүрүшкөн чатактан улам болсо керек. Башка партиялар да 2%дан жоготушту, бирок алар эч качан 6 %дан көп добуш алышкан эмес. Социалдык адилеттүүлүк партиясы, сыягы, Республикачыл партия менен биригүүнүн натыйжасында ийгиликке ээ болду, эми анын лидери вице- президенттин ордун алат деп күтүүгө болот. Республикачылардан шайланган жаңы президент кийинки айда өз администрациясын түзүүгө тийиш."},{"t":"p","h":"#% 09-тапшырма. Мен эмне үчүн ушундай добуш бердим? 30мүн."},{"t":"p","h":"Жогорку Кеңештин депутаттыгына көрсөтүлгөн өз талапкерлерине шайлоочулар кандай добуш бергени тууралуу билдирүүсүн окуп чыгып, төмөндөгү суроолорго жооп бергиле."},{"t":"p","h":"Бермет: Мен Айнура Молтоевага добуш бердим, анткени ал парламент депутаты катары алган өз айлыгынын эсебинен биздин мектепке жаңы класстык бөлмө куруп берем деп убада кылган."},{"t":"raw","h":"<h4 class=\"mk\">ААйбек: Саша:<\/h4>"},{"t":"p","h":"Мен Азаматка добуш бердим, анткени ал менин таякем, мага камкордук көрөт. Мен ага ишенем, себеби ал өз киши, мени мамлекеттик органдарга кызматка орноштурат. Мен Азизге добуш бердим, неге дегенде өлкөбүзгө туристтерди көбүрөөк тартуу, экономиканын абалын оңдоо тууралуу дурус идеялары бар. Анын үстүнө Азиздин юрист ы <span class=\"pg\" data-n=\"39\">39<\/span>жана"},{"t":"raw","h":"<div class=\"gloss\"><p>инь т ад<\/p><\/div>"},{"t":"p","h":"катары тажрыйбасы депутаттык милдеттерин жакшы аткарганга көмөк болот. “Мени жактаган ар бир шайлоочуга 100 сомдон таратам”, – дегенинен Светланага добуш бердим."},{"t":"p","h":"Азиз бай, сөзү да өтүмдүү болгондуктан, мен ошого добуш бердим. Ал Москва университетин бүтүргөн. Бизге жол көрсөтүп, камкордук кылганга ошондой кишилер керек."},{"t":"p","h":"Жакын досум жана айрым шайлоочулар айтканынан Кеңеш дегенге эле добуш бердим, аны шайлоо комиссиясындагылар да жакшы жигит деп кадырлашат экен. А чынында мен аны мурда көргөн да, уккан да эмесмин."},{"t":"p","h":"Гүлнура: Мен эч кимге добуш берген жокмун. Баары – коррупцияга белчесинен баткан немелер. Адегенде тоону томкоруп беребиз деп убада кылышат да, шайланып алган соң ар кими өз кызыкчылыгын көздөп кетишет."},{"t":"p","h":"Мен Азаматка добуш бердим. Чынымды айтсам, ал мыкты талапкерби же кандай – аны деле билбейт экенмин, кыскасы, өз убада-милдеттерин аткара албаган азыркы депутаттан кутулушубузга ырас шылтоо болуп берди."},{"t":"p","h":"Мен баарына каршы добуш бердим. Анткени бул жөн эле убарачылык."},{"t":"p","h":"Дмитрий: Эркинге добуш бердим, ал – ушул бандадагылардын түзүгүрөөгү. Чынын айтсам, булардын эч кимиси мага жакпайт."},{"t":"p","h":"Айдана: – Мен Эркинге добуш бердим, анткени ал – кыргыз. Шайлоо округундагылардын көпчүлүгү кыргыз, демек, биздин өкүл да кыргыз болгону туура эмеспи, Асанбек: Мен Кеңешке добуш бердим, себеби биздин шайлоо округунда кыргыздар аз. Эгерде биз башка улуттан бирөөнү шайласак, өкмөт биздин өкүлдү этибар албай коёт."},{"t":"p","h":"1. Силердин оюңарча, демократиялык система кандай иштеши керек экенин баарынан ким жакшы түшүнөт?"},{"t":"p","h":"Жогоруда көрсөтүлгөн шайлоочулардын ар бири сыяктуу эле калктын канча проценти добуш берет деп ойлойсуңар? (Алынган катышты көрсөтүш үчүн тегерек диаграмма чийип берсеңер да болот. Ошондой эле башка айрым түшүндүрмөлөрдү кошумчалоого да жол берилет, анткени адамдар өз иш-аракетин бир нече жүйө менен да түшүндүрүшү мүмкүн)."},{"t":"p","h":"Эгерде кеңири таралган көз карашты чагылдыра турган болсо, жооптордун кайсынысы Кыргызстандагы демократиялык процесстердин негизине доо кетириши ыктымал?"},{"t":"p","h":"Эмне үчүн бу көз караштар демократияга доо кетириши мүмкүн деп ойлойсуңар?"},{"t":"p","h":"Эгерде эл өлкөдө демократияга доо кетире тургандай кылып добуш берсе, силердин оюңарча, бул кандай натыйжаларга алып келиши мүмкүн?"},{"t":"v","l":["#т 10-тапшырма. Эмне учун мындай? 10мун.","","Шеригиңер менен төмөндөгү маселелерди талкуулагыла:"]},{"t":"p","h":"1. Силер кандай добуш берет элеңер: өзүңөргө баарынан көбүрөөк жаккан талапкергеби же анын программасынабы?"},{"t":"p","h":"2. Эгерде биз программасына эмес, жөн эле адамдын өзүнө карап добуш берсек, кандай проблемалар келип чыгышы мүмкүн?"},{"t":"p","h":"$$ -тапшырма. Мен учун добуш бергиле! – Өзүңөрдү Кыргызстандагы бир шайлоо округунун шайлоочулары деп элестеткиле. Жогорку Кеңештин депутаттыгына талапкерлер менен жолугушууга келгенсиңер, ал жерде талапкердин ар бири кыскача сөз менен чыгып сүйлөйт. Алардын сөздөрүн окуп чыгып, андан кийин төмөндөгү суроолорго жооп бергиле. (Бул жердеги ысымдардын, партия наамдарынын баары ойдон чыгарылган) Данияр: Кутмандуу кечиңер менен! Мен “Токтоосуз иш-аракет” партиясынын өкүлүмүн. Бул жерде катышып отургандардын бардыгын экономикабыздын оор абалы тынчсыздандырат. Эгерде силерди чын эле ушул маселе тынчсыздандырса, силердин таламыңарды эң жакшы коргой турган мына менмин. Иш өндүрүшүн жана экономиканы жакшы билгениме менин бизнестеги тажрыйбам далил болуп берет. Мен мамлекеттик чыгымдарды жана ишканаларга салынчу <span class=\"pg\" data-n=\"40\">40<\/span>салыктарды ал К ууга үндөйм. йм. М ындан тышкары, биздин өлкөгө өз ишин жакшы бил бе мага берсеңер дейм. Экон и дейм. Экономиканын өрүш рүш алышың, ишкерлер керек, ошон үчү ттуу берсе деп издеп жүр: кишиңер мен болбогондо ким болмок."},{"t":"raw","h":"<div class=\"gloss\"><p>Адыл: Суроолор;<\/p><\/div>"},{"t":"p","h":"чындап түрткү берсе ‹"},{"t":"p","h":"‚н «Кайра жаралуу» партия 'ынанмын. Биздин өлкө акырындап катас трофаны көздөр ‹ саясатынын к"},{"t":"p","h":"Мамлекеттин азыркы социалдык саясат кайтарымы жылып баратат деп эсеп караманча жок болуп жатат, ушундан калк кандан кыин алк кыйналып жатканын бардыгыбыз көрүң лдык муктажюд м турабыз. Билим оерүү, Б Беру саламаттык сактоо, дагы башка социа ‚ дегенде 90 %га көбөйтүш керек, Биз ошондой эле сх м жумшалчу чыгымдарды жок дегенде системасын к ис ы д СОК! ктор эч 3 не] се тө, өбө; төл эндои кылып лы кац] “ куруу кс р‹ [А де! е үү! \"ТУЫ р эсен а Биздин партиянын! ик ири боюнча жумушсуздар орто айлык акы өлчөмүндө жөлөкпүл муш, (пособие) алышы керек. Чын-чынына ке жумуштун жоктугу жумушс күнөөсү эмес, Адилеттүүлүк учун – «Кайра жаралуу» партияс ынын талапкери үчүн добуш бергиле!"},{"t":"p","h":"кирбейм. Айланаңарды карап көргүлөчү... Эмне үчүн чэ ‚ а тургай биздин тилибизди билбеген киши бизге өкүл болом дейт? Де А а абалды оңдоого кандай аракет жасап жүргөнүмдү өзүңөр жакшы ред ‹"},{"t":"v","l":["ы округда гы",": ш у үз баргаң"]},{"t":"p","h":"сайын жакшырууда, кийинки төрт жыл ичинде дагы 10 миң жумушчу орун у к \\руп берем, муну бөркүңөрдөй коре ›уле. Көбүңөр менин куч-аракетим менен жумушка ээ ?олбодуңарбы, балдарыңардан стипендия алып, университетте ЖА п жаткандары бар, стипендияларын болсо мен өз чөнтөгүмдөн берип жүрөм. Дагы эмне демекмин:"},{"t":"p","h":"Мен «Реалисттер» партиясынын өкүлүмүн, масел елерди опоңой чечебиз дегендер ге ишенбейм, Мен да азыркы жүргүзүлүп жаткан саясатты туура эмес деп эсептейм, ошол эле учурда кайсы бир даражада чыгым сарптабасак илгерилов болбошуна да көзүм жетип турат, Эл жок дегенде, бир аз убакытка дагы кыйынчылыкка чыдашы керек. Ошон үчүн биз кээ бир учурларда салыктарды жогорулатып, кедейби, байбы, ага карабастан бардыгы ошол салыкты төлөп турушун бир топ катуу талап кылууга аргасыз болобуз. Мен ошондой эле эң зарылдарын гана калтырып, социалдык муктаждыктарга бөлүнчү каражаттарды кыскартышыбыз керек деп ойлойм, Бул мамлекеттин ролун басаңдатып, жарандардын өздөрүнүн жоопкерчилигиң көтөрүү деген кеп. Ооба, көбүңөргө ого бетер кыйын болуп калары турган иш. Кайсы жолго түшөсүңөр, өзүңөр тандагыла."},{"t":"p","h":"Мен «Моралдык күч» партиясынанмын. Биздин өлкө моралдык туура асыл нарктар жогунан кыйрап жатат деп эсептейбиз. Жарандарды кылмыштуулуктун үстөмдүк кылып кетишинен коргоо керек, ошон үчүн элибизди чет өлкөлөрдүн азгырма таасиринен арылтышыбыз зарыл. Жарандарыбыз бардыгы динчил болгону туура. Кайсы динди тутабыз десе өздөрү билсин, бирок чектелүү сандагы гана диндердин бирин тандап алышсын. Бизге элди коргоп, муктаждыктарын канааттандыра алгыдай күчтүү өкмөт керек. Биздин партия баарынан татыктуу деп силерди ишендире алам."},{"t":"p","h":"Алынган маалыматка таянганда, силер кимге добуш берер эленер? (Кимге эмне учун добуш береринерди түшүндүргүдөй болгула)."},{"t":"p","h":"Бул жолугушууга катышып отурган шайлоочулар тууралуу ар бир талапкер эмне деп ойлойт? Ар бир талапкер сүйлөгөн өз сөзү менен шайлоочулардын кандай

акырып, бул шайлоочуну участканын аймагынан алып кетүүсүн өтүнүңүз."},{"t":"p","h":"Эсиңизде болсун! Тартип коргоо органдарынын өкүлдөрү участканын аймагына тартипти жөнгө салуу үчүн төраганын чакыруусу боюнча гана келиши мүмкүн, алар участкадагы өз милдеттерин аткаруу убактысында гана болушат, 2. Катчы Катчы УШКнын бардык жазууларын жана протоколдорун жүргүзүп, төрага тигил же бул себеп боюнча иштей албай калган учурда анын ордуна иштөөгө тийиш."},{"t":"v","l":["„ УШК мүчөлөрүнө чогулуштардын датасы жана убактысы жөнүндө маалымат берүүгө","‚ УШКнын чогулуштарынын протоколун жүргүзүүгө"]},{"t":"p","h":"Терага жок болгондо, же ал өз милдеттерин кайсы бир себептерден улам аткара албаганда, төраганын милдеттерин аткарууга"},{"t":"v","l":["*_ Зарыл болуп калган учурда комиссиянын мүчөлөрүнүн биринин ордуна иштөөгө.","3. Маркалоонун бар экендигин текшерүү үчүн жооптуу комиссия мүчөсү","Милдеттери:","Төрагадан ультрафиолет чырагын алып, анын иштешин текшерип көрүү"]},{"t":"p","h":"Ар бир шайлоочу участкага киргенде, анын эки колунун тең бармактарын ультрафиолет чырагынын жарыгына"},{"t":"v","l":["<span class=\"pg\" data-n=\"163\">163<\/span>2","","салый текшеруу","Добуш берүү бөлмөсүнүн босогосунда туруп ма знать өтэ элек калин тана еды зүү","","Колдорду өтө жарык жерде эмес, жарыктан бир аз далдаа жерде текшсриңиз.","Айрыкча тырмак менен аны курчаган теринин бириккен жерине көнүл бурунуз","Эгерде шек санап калсаңыз, анык бя: тҮ ү үчүн кайталап"]},{"t":"p","h":"Участкада шайлоочулардын топтолуп кетишине жол бербениз, тизме үчүн жооптуу комиссия мүчөсү бошогондо гана имаратка кезектеги чуну киргизиңиз."},{"t":"v","l":["сыянын жана аны текоюруучу чырактын сайатын уку уктуу","Эмне кылуу керек?","Шайлоочу участкага кирем дейт, бирок текшерүүдө анын бармагы маркировкалангандыгы белгилүү болду."]},{"t":"p","h":"Шайлоочуга анын бармагы маркировкалантанлыхыи, бул аның буга чейин эле добуш бергендигин билдирерин, ошондуктан ал участкага киргизилбей тургандыгын түшүндүрүнүз Бул тууралуу комиссия төрагасына билдириниз Башка олуттуу себептер боюнча участкага кирүүгө укугум бар цел эсептесе, шайлоочуга жогору турган комиссияга кайрылыңыз деп кеңеш бериңиз. Жогору турган комиссия бул маселе боюнча чечимди ошол эле күнү чыгарууга тийиш."},{"t":"v","l":["Шайлоочулардын тизмелери үчүн жооптуу комиссия мүчөлөрү","","УШКнын төрагасынан тизмени алышат","Мөөнөтүнөн мурда добуш берген шайлоочуларды белгилейт","Участка ачылган учурдан тартып төмөндөгү жол-жобо боюнча өз милдеттерин аткарат","","Шайлоочу менен саламдашыңыз,","Шайлоочунун атын жана фамилиясын сураңыз.","Анын атын жана фамилиясын байкоочуларга угузуп кайталаңыз."]},{"t":"p","h":"Шайлоочудан анын ким экендигин күбөлөндүргөн документин көрсөтүшүн өтүнүнүз. Бул паспорт же аскер офицеринин өздүк жоокердин же сержанттын аскер билети, ички иштероргвидары тарабынан берилген тийиштүү формадагы справка (форма № 9), Кыргыз Республикасынын жараны экендигин тастыктаган 2004-жылдын үлгүсүндөгү күбөлүк, пенсиялык күбөлүк жана айдоочунун күбөлүгү болушу мүмкүн. (Жогоруда саналган күбөлүктөр паспортун уурдатып же жоготуп койгон ички иштер органдары тарабынан берилет же жаңы паспорттун ордуна пайдаланылат. Мындай күбөлүктө шайлоочунун фотосүрөтү жана анын ким экендиги жөнүндө маалымат болушу керек. Ошондо УШК аны жарактуу документ катары кабыл алууга тийиш)."},{"t":"p","h":"Эсиңизде болсун! Мыйзам боюнча Сиздин БАРДЫК шайлоочулардын, атүгүл өзүңүз жакшы тааныгандардын да, документтерин текшеришиңиз талап кылынат. БАРДЫК шайлоочуларга талаптар бирдей коюлуп жаткандыгын байкоочулар жана башка шайлоочулар көрүп турушу абдан маанилүү."},{"t":"p","h":"5. Эгерде шайлоочу тизмеден чыгуу күбөлүгүн колдонсо, ал аны Сизге көрсөтүшү керек, Сиз бул документти алып калууга тийишсиз."},{"t":"v","l":["Эсиңизде болсун! Тизмеден чыгуу күбөлүгү Сизде калышы керек!","Шайлоочунун фамилиясын шайлоочулар тизмесинен табыңыз.","Шайлоочу менен биргеликте шайлоочулар тизмесиндеги маалымат туура экендигин текшериңиз.","Паспорттун же башка документтин сериясы менен номурун жазыңыз."]},{"t":"p","h":"Бюллетендерди берүүгө жооптуу шайлоочуну маркировкалайт, андан соң шайлоочудан тизмеге кол коюушун өтүнүңүз."},{"t":"p","h":"‚ Шайлоочу шайлоо бюллетендерин бере турган комиссия мүчөсүнө кайрылып, андан шайлоо бюллетенин алат. ‚ Участка жабылгандан кийин, участкага келген шайлоочулардын жалпы санын жазып, бул маалыматты УШКнын төрагасына берет."},{"t":"v","l":["‚ Шайлоочулардын тизмелерин төрагага кайтарып берет.","Эмне кылуу керек?","Шайлоочу участкага ал ким экендигин күбөлөндүргөн документсиз келди"]},{"t":"p","h":"* Эгерде шайлоочунун паспорту же ким экендигин күбөлөндүрүүчү документи жок болсо, анын участкада добуш берүү укугу болбойт."},{"t":"p","h":"Бул эрежеге шайлоочуларынын саны 500дөн ашпаган калктуу конуштар (шайлоо участкалары эмес!) баш ийбейт. Мындай участкаларда эгерде комиссиянын экиден кем эмес мүчөсү шайлоочунун ким экендигин жана ал ошол УШКнын аймагында жашай тургандыгын тастыктай алса, шайлоочу УШКнын төрагасынын уруксаты менен о добуш берүүгө укуктуу. Мындайда шайлоочулардын тизмесинде тийиштүү белги коюлуп, ал шайлоочунун ким экендигине күбө өткөн УШК мүчөлөрүнүн жана УШК төрагасынын кол коюусу менен тастыкталат."},{"t":"p","h":"<span class=\"pg\" data-n=\"164\">164<\/span>УШИ мүчөлөрү Жана вайпоочуаар учун мыскача колдонмо "},{"t":"p","h":"5. Бюллетендерди берүү жана шайлоочуларды маркалоо учун жооптуу комиссия мүчөсү Милдеттери:"},{"t":"p","h":"УШКиын төрагасынан маркалоочу сыяны, бюллетендерди алып, бул жөнүндө кол коюу."},{"t":"p","h":"*__ Сыяны кагазга сүртүп жана ультрафиолет чырагынын жарыгында карап көрүп, эгерде ал жараксыз болсо, анын колдонулушуна каршы пикир айтуу."},{"t":"h3","h":"Маркалоо"},{"t":"p","h":"|. Эгерде шайлоочунун бармагында кир же башка сыя жукпай турган нерсе бар экендигин байкасаныз, шайлоочудан адегенде тазалоосун өтүнүз."},{"t":"p","h":"Шайлоочунун СОЛ КОЛУНУН БАШ БАРМАГЫ маркировкаланат. Эгерде шайлоочунун бул бармагы жок болсо, он колунун баш бармагы маркаланат. Эгерде ал жок болсо, сол колунун кийинки манжалары, кезегине карай, андан сон сол колунун тийиштүү манжалары маркаланат."},{"t":"p","h":"Эгерде шайлоочунун бир дагы манжасы жок болсо, ал маркалоодон бошотулат. Сыяны бармактын тери менен кошулган жерине сүртүү керек."},{"t":"p","h":"Сыя курганга чейин 5 мүнөт күтө туруу керек."},{"t":"p","h":"; г Шайлоочуга бюллетенди сандыкка салаарда төрт бүктөө керектигин айтып коюнуз."},{"t":"p","h":"Эсиңизде болсун! Маркалоодон баш тарткан шайлоочунун бюллетень алууга укугу болбойт, ал эми Сиз мындай шайлоочуга бюллетень берүүгө акыңыз жок."},{"t":"p","h":"‚ Шайлоочулардын тизмесине шайлоочу кол койгондон мурун шайлоочунун сол колунун бармагын маркалоо зарыл."},{"t":"v","l":["Шайлоочу тизмеге кол койгондон кийин гана ал шайлоочуга бюллетень берилет.","Бардык шайлоо бюллетендеринин берилишин эсепке алыңыз."]},{"t":"p","h":"Шайлоочуну маркировкалагандан кийин шайлоочунун тизмеге кол коюусун суранып, андан кийин ага бюллетень берип, бош турган добуш берүү кабинасына жибериниз."},{"t":"p","h":"Участка жабылгандан кийин бардык пайдаланылган, бузулган жана пайдаланылбаган бюллетендерди эсептеп чыгуу зарыл, Барлык пайдаланылбаган бюллетендерди ар биринин оң жак бурчун кыркып алуу жолу менен жокко чыгаруу керек."},{"t":"v","l":["Эмне кылуу керек?","Шайлоочу бюллетенди толтурууда ката кетирди.","Сиз шайлоочуга бузулган бюллетендин ордуна жаңысын беришиңиз керек.","Тийиштүү белги коюшу үчүн шайлоочулардын тизмесине жооптуу комиссия мүчөсүнө айтыңыз."]},{"t":"p","h":"бюллетенди жокко чыгаруу керек (ылдыйкы оң жак бурчу кыркып алынат). Бул жөнүндө акт түзүлөт. Эмне кылуу керек?"},{"t":"p","h":"Шайлоочу маркалоодон баш тартты."},{"t":"p","h":"Шайлоочуга маркалоонун ден соолукка эч кандай зыяны жок экендигин, сыя ультрафиолет чырагынын жарыгына салый караганда гана көрүнөөрүн жана 72 сааттан кийин өчүп калаарын түшүндүрүү керек. Маркалоо мыйзам боюнча талап кылынаарын жана ал калктын шайлоого карата ишенимин жогорулатуу максатында колдонулуп жаткандыгын айтуу керек."},{"t":"p","h":"Акырында, шайлоочуга, эгерде маркалоодон баш тартса, ал добуш берүүгө киргизилбей тургандыгын айтыңыз. ЭГЕРДЕ МАРКАЛАНБАГАН БОЛСО, ШАЙЛООЧУГА БЮЛЛЕТЕНЬ БЕРБЕҢИЗ ЖАНА АНЫ ДОБУШ"},{"t":"h3","h":"БЕРҮҮГӨ КИРГИЗБЕҢИЗ!"},{"t":"p","h":"6. Жашыруун добуш берүү учун кабиналарга шайлоочунун өтүүсүн көзөмөлдөгөн комиссия мүчөсү"},{"t":"p","h":"Добуш берүү сандыгына жакын туруп, ар бир шайлоочу сандыкка бирден гана төрт бүктөлгөн бюллетенди салып жаткандыгына көз салуу."},{"t":"p","h":"Участканым ачылышында шайлоого керектүү жабдууларды текшерип орнотууга жардамдашуу."},{"t":"p","h":"* Шайлоочулар бюллетендерди добуш берүү сандыгына салып жаткандыгын көрүп туруу үчүн сандыкка жакын туруу."},{"t":"p","h":"Эсиңизде болсун! Добуш берүүнүн жашыруундугун бузбоо үчүн Сиз сандыктан бир аз алыс турушуңуз керек. Эгерде Сиз сандыкка өтө жакын туруп алсаңыз, анда добуш берүү сандыгы тунук болгондуктан, шайлоочу кимди колдоп добуш бергендигин көрүп алышыңыз мүмкүн."},{"t":"v","l":["Эмне кылуу керек?","Шайлоочу бюллетенди бузуп алды."]},{"t":"p","h":"Шайлоочуга бюллетень берүүчү комиссия мүчөсүнөн жаңы бюллетень алууга укуктуу экендигин түшүндүрүңүз."},{"t":"raw","h":"<div class=\"gloss\"><p> 18+<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"165\">165<\/span>Жарандын Жана маллепетти вашкарууёа патышуу – ХХЛ тызыядын Жарандыт тоозундаёы силердин ролунар Эмне кылуу керек?"},{"t":"p","h":"Жашы улгайган шайлоочу өзүнүн атынан бюллетень толтуруп берүүнү өтүндү, Ал Сизге өзү колдогон талапкердин атын айтты."},{"t":"p","h":". Сиз УШКнын мүчөсү катары шайлоочунун ордуна бюллетень толтурууга акыныз. жок экендигин, бул мыйзамга каршы келерин шайлоочуга түшүндүрүнүз."},{"t":"v","l":["„Ушул учурда участкада турган башка тиайлоочудан жардам сураңыз деп кеңеш бериниз.","т. Участкадан тышкары жерде добуш берүүнү жүргүзүү үчүн жооптуулар","Милдеттери;"]},{"t":"p","h":"Ооруп калгандыгына же майыптыгына байланыштуу шайлоо участкасына шайлоо күнү өздөрү келе албай турган шайлоочулардын үйдө добуш берүүсүн камсыздоо."},{"t":"p","h":"Участкадан тышкары жерде добуш берүү жол-жобосу"},{"t":"p","h":"Участкадан тышкары жерде добуш берүүнү УШКнын экиден кём эмес мүчөсү жана талапкерлердин эки өкүлү, кенеш берүү добушуна укуктуу комиссия мүчөсү менен биргелешип жүргүзөт."},{"t":"p","h":"Участкадан тышкары жерде добуш берүү үчүн жооптуу комиссия мүчөлөрү зарыл сандагы бюллетендерди, маркалоо үчүн сыяны, ультрафиолет чырагыя, мөөрменен бекитилген (3төн ашпаган) көтөрүп жүрмөсандыктарды алышат. Мөөр менен бекитүү участка ачылганга чейин талапкерлердин өкүлдөрүнүн, байкоочулардын жана УШК мүчөлөрүнүн көз алдында жүргүзүлөт."},{"t":"p","h":"„ Комиссия мүчөлөрү добуш берүү бюллетендерин алгандыгы тууралуу кол коюшат."},{"t":"p","h":"„ УШК мүчөлөрү участкадан тышкары жерде добуш берүү арыздарынын баарын ала чыгууга тийиш. Эсиңизде болсун! Байкоочулар участкадан тышкары жерде добуш берүүдө УШКнын мү чөлөрүн коштоп жүрүүгө жана бардык шайлоо процедураларына добуш берүүнүн жашыруундугун бузбай туруп байкоо жүргүзүүгө укуктуу „ Шайлоочуга бюллетень берүүдөн мурун анын документтерин текшерип, бармагы маркировхалана электигин тактап, шайлоочуга кол койдуруу зарыл. Андан соң шайлоочуну байкалбай турган сыя менен тийиштүү процедурага толук ылайык келгендей түрдө маркалоо керек."},{"t":"p","h":"Эгерде шайлоочу добуш берүү жөнүндө оозеки түрдө гана өтүнгөн болсо, анда ал арызды жазуу түрүндө толтурууга тийиш."},{"t":"p","h":"Эсиңизде болсун! Добуш берүүнүн жашыруундугу участкадан тышкары жерде добуш бергенде да сөзсүз түрдө сакталууга тийиш."},{"t":"p","h":"Пайдаланылбай калган бюллетендерди жана материалдарды участкага добуш берүү бүткөнгө чейин кайтарып часткада тышкары ж дед Комиссия мүчөлөрү участкага кайра келгенд паспортторунун, же алардын ким экендигин күбөлөндүргөн документтеринин серияларын шайлоочулардын тизмесине киргизет да, тизмеге «участкадан тышкары жерде добуш берди» деген белги коюлат."},{"t":"p","h":"Эсиңизде болсун! Эгерде участкадан тышкары жерде добуш берүү үчүн берилген бюллетендерге караганда, көтөрүп жүрмө сандыктагы бюллетендердин жалпы саны көп болуп чыкса, анда бардык бюллетендер жараксыз деп табылат да, комиссия мүчөлөрү бул үчүн жооп берет."},{"t":"p","h":"Төмөндөгүдөй кырдаалда эмне кылуу керек?"},{"t":"p","h":"Чүчү кулак кармоонун натыйжасында Сиз участкадан тышкары жерде добуш берүүнү өткөрүү үчүн жооптуу болуп дайындалгансыз. Бирок арызда көрсөтүлгөн дарек боюнча шайлоочуга барганыңызда, ал Сиздин өзүнүн жубайынын добуш бериши учун да бюллетень берүүнү суранды."},{"t":"p","h":"Анын жубайы үчүн Сизде бюллетень жок экендигин айтыңыз."},{"t":"p","h":"Шайлоочунун жубайына демейдеги добуш берүү жол-жобосу боюнча участкага барып добуш бериңиз деп кеңеш айтыңыз."},{"t":"p","h":"Участкадан тышкары жерде добуш берүү укугуна ээ болуу үчүн добуш берүүгө 6 саат калгандан кечиктирбей арыз берүү зарыл экендигин түшүндүрүңүз."},{"t":"p","h":"МИ. Участканын жабылышы"},{"t":"p","h":"Участканы жабуу жана добуштарды эсептөө жол-жобосун туура өткөрүү калктын шайлоого карата ишенимин бекемдөө үчүн абдан зор мааниге ээ."},{"t":"p","h":"Бардык шайлоо бюллетендерин эсептеп чыгуу шайлоо участкасы жабылгандан кийин жүргүзүлөт. Ар кандай даттанууларды жана добуш берүүнүн жүрүшүндө жол берилген тартип бузууларды талкуулоо үчүн УШК чогулуш өткөрөт."},{"t":"p","h":"Добуштарды эсептөө добуш берүү жүргүзүлгөн жайдын өзүндө өткөрүлөт. Эсептөөнүн натыйжалары чоңойтулган формадагы протоколго жана УШКнын расмий протоколуна киргизилет."},{"t":"p","h":"Добуш берүүнүн натыйжаларын толугу менен эсептеп чыгып, расмий протоколду толтургандан кийин шайлоонун жыйынтыгы жөнүндөгү протокол башка бардык жарактуу жана жараксыз (жокко чыгарылган) шайлоо бюллетендери <span class=\"pg\" data-n=\"166\">166<\/span>менен кошо райондук шаардык шайлоо комиссиясына жеткирилет."},{"t":"raw","h":"<div class=\"gloss\"><p><\/p><\/div>"},{"t":"p","h":"щения аска / Байкоочулар жана талапкелердин өкүлдөрү добу ар анын натый."},{"t":"p","h":"ар сияга рут ууга укуктуу."},{"t":"p","h":"Жабуу жол-жоболорунун текшерүү барагы ” Аткарылган жол-жобонун тушундагы чакмакка ушундай белги коюңуздар. Төмөндөгү кеңири саналган жол-. жоболордун 1-8 кадамдарын караңыздар."},{"t":"p","h":"Көңүл буруңуздар! олор к ште аткарылышы"},{"t":"p","h":"Добуш берүү бөлмөсүн туура 20:00дө жабыныздар. {Төмөндөгү биринчи жана экинчи хадамдарды караңыздар)."},{"t":"p","h":"Байкоочулар, талапкерлердин жана ММК өкүлдөрүнүн кокусунан камалып калбашы үчүн бир сыйра текшерип көрүнүздөр."},{"t":"p","h":"2 БАРДЫК пайдаланылбай калган бюллетендерди санап чыгып, жокко чыгарыңыздар. Аларды ороп, алып. кетиңиздер. (3-кадамды караңыздар)» Эсиңиздерде болсун: Добуштарды эсептөөдөн мурун, бөлмөдө добуш берүү сы тышкары бир дагы бюллетень калтырылбоо тийиш."},{"t":"v","l":["3. Шайлоочулардын тизмелери боюнча тиешелүү иштерди аткарыныздар. (4-кадамды караңыздар)","КАДАМДАРДЫ ЖАСАП БҮТҮШҮҢҮЗДӨР КЕРЕК! ТОКТО. Йй"]},{"t":"p","h":"4__ Терага участкадан тышкары жерде добуш берүү жөнүндө түшкөн арыздардын санын жарыялайт. Участкадан: тышкары жерде добуш берүү сандыктары ачылат. Бюллетендер кайра саналат. (5-кадамды караңыздар) Сиздер добуш берүүнүн жашыруундугун бузбастан, демек бүктөлгөн бюллетендерди ачпастан, кайра санал чыгышыңыздар керек. Көтөрүп жүрмө сандыктарда бюллетендер аз болгондуктан, эгерде алардын бүктөмүн жазсаныздар, добуш берүүнүн жашыруундугу бузулушу мүмкүн. Көтөрүп жүрмө сандыктардагы бюллетендер столдо калат да, алардын үстүнө туруктуу орнотулган сандыктагы бюллетендер төгүлөт."},{"t":"p","h":"Эгерде кайра санап чыгууда көтөрүп жүрмө сандыктардагы бюллетендер түшкөн арыздарга караганда көптүк кылса, ал сандыктагы бардык бюллетендер жараксыз деп эсептелет. Бул тууралуу акт түзүлүп, бюллетендер жокко чыгарылат жана оролуп, сейфке салынат. Эгерде бюллетендер арыздардан аз болсо, жарактуу деп эсептелет."},{"t":"p","h":"$. Туруктуу сандыктардагы бюллетендерди санап чыгыңыздар (6-кадамды караңыздар)."},{"t":"p","h":"6. Көзөмөлдүк салыштырууларды текшериниздер, жыйынтык чогулушту өткөрүңүздөр жана протоколго коло коюнуздар {7-8-кадамдарды караңыздар)."},{"t":"p","h":"УШКнын мүчөлөрү жыйынтык чогулушту протоколго кол коюуга чейин өткөрүүгө тийиш!"},{"t":"p","h":"„Протоколго же жыйынтык чогулуштун тыянактарына макул болбогон УШКнын мүчөсү жазуу түрүндө өзгөчө пикир түзсө болот, Өзгөчө пикир протоколго тиркелет."},{"t":"p","h":"7. Оролгон бюллетендерди, шайлоочулардын тизмелерин жана башка документтерди райондук/шаардык ШКга жеткирүү."},{"t":"p","h":"Байкоочу, талапкердин өкүлү же ММК кызматкерлери документтерди жеткирип берип жана өткөрүүдө, өз транспорту менен коштоп барууга укуктуу."},{"t":"v","l":["Участканы жабуудагы сегиз кадам","Бул сегиз кадамды жасоо менен Сиз төмөндөгү жол-жоболордун акыйкаттыгын жана","амсыздайсыз:","","Биринчи кадам. Участканы туура 20.00дө жабуу керек"]},{"t":"p","h":"Участкалык комиссиянын төрагасы добуш берүү жайына келген шайлоочулар гана шайлоо бюллетенин алуу жана обуш берүү сандыкка салуу укугуна ээ экендигин жарыялоого тийиш."},{"t":"v","l":["Экинчи кадам, Ачык-айкындыкты камсыздоо","Добуштарды эсентеену УШК мүчөлөрү гана, болгондо да эл көзүнчө, ачык түрдө жүргүзүүгө тийиш,"]},{"t":"p","h":"берүү жайында илинип коюлуучу чонойтулган формадагы протоколго жазылып турушу керек. Добуштарды эсептөөнүн натыйжасы жарыя айтылып, эсептөөдөгү ар бир кадам биринин артынан бири а Добуштарды эсептөө жана кошмок ведомостту түзүү учурунда талапкерлердин өкүлдөрү, байкоочулар жана ММК өкүлдөрү фотосүрөткө жана видеого тартууга акылуу."},{"t":"p","h":"Добуштарды эсептөө учурунда катышкан байкоочулардын баары УШК мүчөлөрүнүн бардык иш-аракеттерин. көрүп турууга тийиш."},{"t":"p","h":"Үчүнчү кадам. Бардык колдонулбай калган бюллетендерди эсептеп чыгып, жокко чыгаруу"},{"t":"p","h":"УШКнын мүчөлөрү пайдаланылбай калган расмий шайлоо бюллетендерин эсептеп чыгып, алардын төмөнкү оң жак бурчун кыркып алууга тийиш (мында оң жактагы талапкердин фамилиясынын тушундагы чакмак б калтырылат)."},{"t":"p","h":"УШК сейфинде пайдаланылбаган бойдон сакталган расмий шайлоо бюллетендеринин бүт баары жогорудагыдай о"},{"t":"p","h":"1"},{"t":"p","h":"<span class=\"pg\" data-n=\"167\">167<\/span>ү; тт А"},{"t":"p","h":"эле жокко чыгарылышы керек."},{"t":"p","h":"Бардык жокко чыгарылган шайлоо бюллетендери эсептелип ‚ орой танылуута тий лууга тийип. Таңгакка УШКнын мөөрү – эк басылып, УШКнын катышкан бардык мүчөлөрү кол кокушу керек Жокко чыгарылган шайлоо бюллетендеринин жалпы самы пайдаланылбай калтяя. шайзхиэөчулар туура эмес толтургандыгы үчүн кайтарылган (бузулган) бикллетендердин жалкы суммасы катары жарыя айтылып, расмий протоколго жана чонойтулган формалагы протокалге керек төртүнчү кадам. Шайлоочулардын тизмеси менен иштев Добуштарды эсептей баштоодон мурун знай зоочуларлы каттоо үз үн жоойтуу комиссий мүчөлөрү тизменин ар бир бетине төмөндөгүдөй жалпы маалыматтарды киргизет Добуш берүү аяктаган чакта тизмеде бар сайы (бу а тизмелен чыгуу күбөлүгүн алган, ошондой эле башка себептерден улам алыста жүргөн шайлохгуларлын салы Добуш берүү күнү добуш берүү жайында шайлоочуларга берилген бюллетендеринин саны (иегизги жана кошумча тизмелердеги шайлоочулардын койгон колдорунун саны боюнча аныкталат} Алдын ала добуш берген шайлоочулар алган шайлюю бюллеттидерияин «аны {шайлоочулардын тизмесинде тийиштүү белгилеринин саны боюнча эсептелип, алдын заа добуш бергендердий ти эісине сайыйгтырыр текшерилет)."},{"t":"p","h":"Шайлоо күнү участкадан тышкары жерле добуш берсн шайлоочулар алган бюллетендердин саны (шайлоочулардын тизмесиндеги тийиштүү саны божифия эсептелет»"},{"t":"p","h":"Участкада шайлоочуларга берилген тизмеден чыгуу күбөлүктөрүяүн сайы {шай пюочулрдын тизмесиндеги тийиштүү белгилердин саны боюнча эсептелет)."},{"t":"p","h":"Тизмеден чыгуучу күбөлүгү боюнча добуш бергендердин саны (кошумча тизмеде кокшгаи коллорунун саны боюнча аныкталып, шайлоочулардан алынган тизмелен чыгуу күбөлүктөрүнү и сайына салыштырып текшерилет)."},{"t":"p","h":"Шайлоочулардын тизмесинин ар бир бетине, кийин аларды чогултуп жыйынтыкта, төрагага өткөрүп бере турган комиссия мүчөсү кол коет."},{"t":"p","h":"Төрага жана катчы тизменин акыркы бетине анын бардык беттери боюнча чыгарылган тыянак катары аныкталуучу жалпы маалыматты киргизет да, аны өз колу жана УШКнын мөөрү менен тастыктайт УШК төрагасы катышуучуларга тизме менен таанышып көрүүнү сунуштайт, ага кийин добуш берүүнүн натыйжалары жөнүндөгү протоколго жана чоңойтулган формадагы протоколго киргизиле турган жаны маалыматтарды жарыя окуп берет. Андан соң бул тизме сейфке салынат."},{"t":"p","h":"Бешинчи кадам. Көтөрүп жүрмө добуш берүү сандыктарындагы бюллетендерди эсептөө ‚ Участкадан тышкары жерде добуш берүүнү жүргүзгөн участкалык шайлоо комиссиясынын мүчөлөрү пломбалар менен басылган мөөрлөрдүн бузулбай сакталгандыгын көрсөтүшөт."},{"t":"p","h":"Ар бир көтөрүп жүрмө добуш берүү сандыгын ачуудан мурун ошол сандыкты колдонуу менен добуш берген шайлоочулардын саны жарыяланат. Ар бир көтөрүп жүрмө добуш берүү сандыгындагы шайлоо бизллетендери өзүнчө эсептелинет."},{"t":"p","h":"Көтөрүп жүрмө добуш берүү сандыктарын кезеги менен ачып, участкалык шайлоо комиссиясынын мүчөлөрүнүн, эртең менен ошол сандыктарды мөөр басып жаткан учурунда катышкан башка адамдардын колдору коюлган көзөмөлдөө барактары менен кошо шайлоо бюллетендери алынат."},{"t":"p","h":"Алынган бюллетендердин саны угуза айтылып, аны төрага добуш берүүнүн жыйынтыгы жөнүндөгү протоколдун 8-сабына жана чоңойтулган формадагы протоколго жазат."},{"t":"p","h":"Эгерде көтөрүп жүрмө добуш берүү сандыгындагы шайлоо бюллетендеринин саны, бюллетендерди алгандыгы жөнүндө арыздарына белги коюлган шайлоочулардын санынан көп болсо, аңла бул сандыктагы бардык бюллетендер жараксыз деп табылат да, жокко чыгарылат."},{"t":"p","h":"Алтынчы кадам. Шайлоо участкасында орнотулган добуш берүү сандыктарындагы бюллетендерди эсептөө Орнотулган сандыктарды ачуу ‚ Участкалык шайлоо комиссиясынын төрагасы бардык катышуучуларга мөөрдүн (плобманын) бузулбаганын көрсөтөт. Өзгөчө номурлуу пломбалар бастырылган сандыктардын ачылбаганын билүү үчүн алардын номурлары текшерилет."},{"t":"p","h":"Андан кийин орнотулган добуш берүү сандыгын ачышат. УШКнын мүчөлөрү бюллетендерди жана көзөмөлдөө барагын алып чыгышат."},{"t":"p","h":"Төрага бардык катышуучуларга көзөмөлдөө барагын көрсөтөт."},{"t":"p","h":"Участкалык шайлоо комиссиясынын мүчөлөрү көтөрүп жүрмө жана орнотулган добуш берүү сандыктарынан алынган шайлоо бюллетендерин ар бир талапкерди колдогону, бардык талапкерлерге каршы добуш бергени боюнча сорттоп, формасы аныкталбаган шайлоо бюллетендерин жана жараксыз шайлоо бюллетендерин өз өзүнчө бөлөк коёт."},{"t":"p","h":"Шайлоо бюллетендерин сорттогондо, участкалык шайлоо комиссиясынын мүчөлөрү шайлоо бюллетендериндеги шайлоочулар койгоң белгилерди жарыя айтып, бардык катышуучуларга бул бюллетендердин эсептелишин көрсөтүп турат."},{"t":"raw","h":"<div class=\"gloss\"><p>;ў<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"168\">168<\/span>Аңдан сон ар бир талапкерди колдогон жана бардык талапкерлерге каршы добуш берген боюнча шайлоо бюллетендери өзүнчө бөлүнүп эсептеп чыгарылат."},{"t":"p","h":"Сорттолгон шайлоо бюллетендерин бир пачкадан экинчисине бир-бирден алып коюу учурунда катышып тургандардын бардыгы угуп жана бюллетендерге коюлган белгилерди көрүп турушу үчүн алардын эсеби жарыяланып турат."},{"t":"p","h":"Ар башка начкалардагы шайлоо бюллетендерин бир эле учурда эсептөөгө жол берилбейт."},{"t":"p","h":"Ар бир талапкердин жана бардык талапкерлерге каршы берилген добуштар боюнча шайлоо бюллетендерине коюлган белгилер тууралуу маалымат добуш берүүнүн натыйжасы жөнүндөгү протоколдун 13-14-саптарына, ошондой эле анын чоңойтулган формасына жазылат."},{"t":"p","h":"Канлай бюллетендер жарактуу деп эсептелет?"},{"t":"p","h":"Мыйзам боюнча, шайлоочулар өздөрүнүн шайлоо бюллетендеринетийиштүү белги коюшу талап кылынат. (У) белгиси шайлоочунун кимди эң так көрсөтүүдө колдонулат. Бирок Кыргыз Республикасынын Шайлоо жөнүндөгү мыйзамында УШК мүчөлөрү шайлоочунун башкача койгон белгисин да эске алышы мүмкүн экендиги каралган. Эсиңизде бөлсүн! Шайлоо бюллетенине белги коюунун көптөгөн жолдору бар. Эгерде шайлоочунун эркин билдируус} даана болсо, анда мындай шайлоо бюллетени эсепке алынууга тийиш."},{"t":"v","l":["Кандай шайлоо бюллетени «жараксыз» деп эсептелиши мүмкүн?","Жараксыз бюллетенлер өзүнчө эсептелип чыгарылышы керек,","Жараксыз леп төмөндөгүдөй бюллетендер саналат:","Шайлоочунун эркин билдирүүсүн так аныктоо мүмкүн болбогон бюллетендер."]},{"t":"p","h":"БШК коюп, УШК мөөрү менен бекиткен атайын коргоо белгилери жана башка тийиштүү белгилери жок бюллетендер."},{"t":"p","h":"Бирден ашык талапкер белгиленген бюллетендер."},{"t":"p","h":"Бюллетенди жараксыз деп табууда шектенүү пайда болсо, участкалык шайлоо комиссиясы муну добуш берүү менен аныктайт. Мында бюллетендин арт жагына ал эмне үчүн жараксыз деп санала тургандыгы жазып көрсөтүлөт. Мындай бюллетендерге төрага менен катчынын колу жана УШКнын мөөрү коюлууга тийиш."},{"t":"v","l":["Жараксыз бюллетендердин саны протоколдун 11-сабына жана анын чоңойтулган формасына жазылат.","Байкоочулардын жана талапкерлердин өк чүн:"]},{"t":"p","h":"Жабуу жана лобуштарды эсептөө жол жоболордун баары Сизге көрүнүп тургандай болсун. Ар бир бюллетень талапкерлерте туура сорттолуп коюлуп жаткандыгына көз салыңыз. Бюллетендердин туура эсептелгендигин текшериңиз."},{"t":"p","h":"Жетинчи кадам. Расмий протоколду толтуруу Добуш берүүнүн натыйжалары жөнүндөгү расмий протокол УШКнын эң маанилүү документтеринин бири болуп саналат."},{"t":"p","h":"Ал шайлоочуларга да, байкоочуларга да УШКнын ишмердигин жана шайлоочулардын укуктары урматталып, корголуп жаткандыгын так чалдыруучу түшүнүктүү документ болуп эсептелет. Бул жолу протокол бир барак болуп, астында өзү көчүрүүчү беш барактан турат."},{"t":"p","h":"Чонойтултан формадагы протокол биринчи кезекте толтурулат. Андагы маалыматтар кийин добуш берүүнүн жыйынтыгы жөнүндөгү расмий протоколго көчүрүлөт."},{"t":"p","h":"Протокол карандаш менен эмес, шариктүү калемсап менен толтурулат."},{"t":"p","h":"Протоколду ондоого жол берилбейт. Эгерде толтуруп жатканда ката кетирилсе, анда жаңы протокол толтуруу зарыл."},{"t":"p","h":"Толугу менен толтурулмайынча, протоколго кол коюу мүмкүн эмес."},{"t":"p","h":"Протоколго УШ Киын бардык катышкан мүчөлөрү кол коёт. Эгерде комиссия мүчөсү кандайдыр бир себептерден улам катышпай калса, анда мунун себеби ал кол коюучу сапта жазып көрсөтүлүүгө тийиш."},{"t":"v","l":["отокол, о","Мыйзам боюнча ар бир протоколдо төмөндөгүдөй маалымат камтылышы талап кылынат:","(1) нуска номуру","(2) комиссиянын деңгээли","(3) «Протокол» деген сөз","(4) комиссиянын аталышы жана участканын номуру","(5) протоколдун саптары"]},{"t":"p","h":"протоколго тиркелүүчү даттануулардын (арыздардын) ж.б. документтердин тизмеси, ошондой эле алар боюнча шайлоо комиссиясы чыгарган чечимдер;"},{"t":"p","h":"шайлоо комиссиясынын төрагасынын, катчысынын ж.б. мүчөлөрүнүн фамилиялары менен аты-жөндөрүнүн баш тамгалары, ошондой эле алардын койгон колдору;"},{"t":"v","l":["протоколго кол коюу датасы жана убактысы;","шайлоо комиссиясынын мөөрү."]},{"t":"p","h":"<span class=\"pg\" data-n=\"169\">169<\/span>с, сы ча эе жеө жй че ео АРЫЙ айды ЫСЫ е"},{"t":"p","h":"|) тизмеге киргизилген, ичинен кошумча түрдө киргизилген, пайхосчуларлым саны;"},{"t":"p","h":"2) шайлоо комиссиясына алынган шайлоо бюллетенлериния самы (өлкөнүн чегинен тышкарыда болгондугуна байланыштуу өлкөдөгү добуш берүүгө катыша албаган шайлоочулар учун}:"},{"t":"v","l":["3) мөөнөтүнөн мурда добуш берген шайлоочуларга берилген шайлоо бюллетендеринин саны;","4) шайлоо участкасында шайлоочуларга берилген шайлоо бюллетендериими","5) участкадан тышкары жерде добу! берген шайлоочуларга берилген шайлоо бизллетенаеринии саны;","6) добуш берүүгө катышкан шайлоочулардын саям;","7) жокко чыгарылган шайлоо бюллетендеринин саны;","з) көтөрүп жүрмө добуш берүү сандыктарына салынган угайлоюо бюляет сидеривин саны;","9} орнотулган добуш берүү сандыктарына салынган шайлоо бюзллетеилерикив саны;","10) жарактуу шайлоо бюллётендеринии сайы:","11) жарактуу эмес шайлоо бюллетендеринин сайы","12) добуш берүүгө катышкан шайлоочулардын жалпы сабы"]},{"t":"p","h":"13) талапкерлердин фамилиясы, аты жана атасынын аты (алфавит тартубинде жана алардын ар бири үчүн берилген добуштардын саны;"},{"t":"p","h":"14) «Бардыгына каршы» добуш берген шайлоочулардын саны;"},{"t":"p","h":"15) участкалык шайлоо комиссиясы тарабынан берилген берүү үчүө тизмелен чыгуу күбөлүктөрдүн саңы; 15а)шайлоо участкасында шайлоочуларга добуш берүү күнүнө чейин берилген тизмеден чыгуу күбөлүктөрүнүн саны; 15б) тизмеден чыгуу күбөлүктөрү боюнча участкада добуш берген шайлоочузардын саны:"},{"t":"p","h":"15в) шайлоо участкасында пайдаланылбаган (жокко чыгарылган} тизмеден чыгуу күбөлүктөрүнүн саны;"},{"t":"p","h":"16) жоготулган шайлоо бюллетендеринин саны:"},{"t":"p","h":"17) алынган шайлоо бюллетендеринин санынан ашып кеткен шайлоо бюллетендеринин саны Бул статьянын 1-8-пункттарында көрсөтүлгөн сандар добуш берүүнүн жыйынтыктары жөнүндөгү протоколго сай жана жазуу түрүндө киргизилет. Добуш берүүнүн жыйынтыктары жөнүндөгү протекая сый менен ганп толту рулат, Добуш берүүнүн жыйынтыктары жөнүндөгү протоколду добуштар эсептелип бүтмөйүнчө толтуруута жол берилбейі Сегизинчи кадам. Протоколдун көчүрмөлөрүн тастыктоо жана аны райондук/шаардык комиссияга өткөрүп берүү"},{"t":"p","h":"Добуштарды эсептеп чыккандан кийин участкалык комиссия сөзсүз түрдө жыйынтыктоочу чогулуш өткөрөт Анда добуш берүүдөгү жана шайлоочулардын добуштарын эсептөөдөгү тартип бузуулар тууралуу келип даттануулар (арыздар) каралат да, ар бир даттануу (арыз) боюнча чечим кабыл алынат."},{"t":"p","h":"Ошондон кийин УШКнын мүчөлөрү жана өздөрүнүн даттануулары (арыздары) боюнча кабыл алынган чечимдерге макул болгон даттануучулар УШКнын жыйынтыктоочу чогулушунун протоколуна кол коёт."},{"t":"p","h":"УШКнын жыйынтыктоочу чогулушунун протоколуна кол коюуда анын мазмунуна макул болбогон комиссия мүчөлөрү жана даттануучулар протоколго карата өзгөчө пикир түзүп тиркөөгө укуктуу. Бул жөнүндө тийиштүү түрдөгү жазуу киргизилет."},{"t":"p","h":"Добуш берүүнүн жыйынтыктары жөнүндө протокол түзүлгөндөн кийин шайлоо бюллетенлери атайын баштыктарга салып оролот."},{"t":"p","h":"Оролгон бюллетендер участкалык шайлоо комиссиясынын мөөрү менен печеттелии, ага участкалык шайлоо комиссиясынын мүчөлөрү, талапкерлердин катышкан ыйгарымдуу өкүлдөрү кол коёт. Анан бул оромдор өзүнчө капка же кутуга топтоп салынат."},{"t":"p","h":"Капта же кутуга участканын номуру, УШК мүчөлөрүнүн колдору коюлган бюллетендердин саны көрсөтүлөт. Бюллетендер комиссиянын кеңеш берүү добушуна укуктуу мүчөлөрүнүн, талапкерлердин өкүлдөрүнүн катышуусунда оролот да, бюллетень салынган баштыкка же кутуга алардын кол коюшуна мүмкүндүк берилет. Баштыкты, капты же кутуну райондук/шаардык комиссиянын же соттун чечими боюнча гана ачууга болот. Добуш берүүнүн жыйынтыктары жөнүндө протокол эки нускада толтурулат, ошондой эле ар бир талапкер үчүн бирден нуска даярдалып, аларга участкалык шайлоо комиссиясынын бардык катышкан мүчөлөрү кол коюп, кол коюунун датасы жана убактысы (сааты жана мүнөтү) көрсөтүлөт. Эгерде шайлоо комиссиясынын мүчөлөрүнүн көпчүлүгү кол койсо, протокол жарактуу деп эсептелет."},{"t":"p","h":"Протоколго кол коюуда анын мазмунуна макул болбогон комиссия мүчөлөрү протоколго карата өзгөчө пикир түзүп тиркөөгө укуктуу. Бул жөнүндө протоколго тийиштүү түрдөгү жазуу киргизилет."},{"t":"p","h":"Добуш берүүнүн натыйжалары жөнүндөгү протоколдун биринчи нускасын ага кол коюлгандан кийин башка шайлоо документтери, алардын ичинен шайлоочулардын тизмелери, даттануулар (арыздар), алар боюнча кабыл алынган чечимдер, участкалык шайлоо комиссиясы түзгөн актылар менен кошо участкалык шайлоо комиссиясынын төрагасы же комиссиянын мүчөлөрүнүн бири талапкерлердин добуштарды эсептөөгө катышкан өкүлдөрүнүн коштоосунда токтоосуз түрдө райондук/шаардык шайлоо комиссиясына жеткирет."},{"t":"p","h":"Протоколдун экинчи нускасы, ошондой эле участкалык шайлоо комиссиясынын мөөрү участкалык шайлоо комиссиясынын катчысынын колунда комиссиянын иши аяктаганга чейин сакталат."},{"t":"p","h":"Протоколдордун башка нускалары талапкерлердин өкүлдөрүнө жана байкоочуларга алардын өтүнүчү боюнча берилет."},{"t":"v","l":["Чоңойтулган формадагы протокол жалпыга көрүнүп турушу үчүн УШК белгилеген жерге илинет.","Материалдарды ороо жана жогору турган комиссияга жеткирүү"]},{"t":"p","h":"<span class=\"pg\" data-n=\"170\">170<\/span>кыскача к Олдонмо"},{"t":"p","h":"Бардык материалдар жана документтер, бюллетендер, тизмеден чыгуу күбөлүктөрү өзүнчө баштыктарга салып оролот:"},{"t":"v","l":["Ар бир талапкер үчүн добуш берилген бюллетендер","Жараксыз бюллетенлер","Кайдан чыкканы белгисиз бюллетендер","Бардык талапкерлерге каршы добуш берилген бюллетендер","Жокко чыгарылган бюллетендер","Жокко чыгарылган тизмеден чыгуу күбөлүктөрү","Участкада лобута берген шайлоочулардын тизмеден чыгуу күбөлүктөрү"]},{"t":"p","h":"Бардык оролгон материалларга мөөр басылып, УШКнын мүчөлөрүнүн колу коюлат. Каалаган байкоочулар талапкердин өкүлү же кеңеш добуш берүүгө укуктуу комиссия мүчөлөрү оролгон материалдарга кол кое алат."},{"t":"p","h":"Ушундайча оролгон материалдар милициянын, байкоочулардын жана комиссиянын кенеш добуш берүүгө укуктуу мүчөлөрүнүн коштоосунда жогору турган комиссияга райондук же шаардык ШКга жеткирилет."},{"t":"p","h":"Райомдук'шаардыккомиссиянынмүчөлөрүкөзөмөлсалыштыруулардытекшергенден кийинУШКнынпротоколундагы маалыматтар “Шайлоо” мамлекеттик автоматташтырылган системасына киргизилет."},{"t":"p","h":"Эсиңизде болсун! УШКнын мүчөлөрү райондук/шаардык ШКда протоколдогу ыер “Шайлоо” мамлекеттик автаматташтырылган системасына киргизилип бүткөнгө чейин кетпей турууга тийиш. Эгерде райондук добуштарды кайра эсептөөнү талап кылса, УШК муну аткарышы керек. Эмне кылуу керек?"},{"t":"p","h":"Көтөрүп жүрмө добуш берүү сандыгындагы бюллетендердин саны участкадан сырткары жерде добуш берүүнү өтүнгөн арыздардын санынан ашыкча болуп чыкты"},{"t":"p","h":"Андагы бардык бюллетендер жараксыз деп табылып, төмөнкү оң жак бурчун кыркып алуу жолу менен жокко чыгарылат Атайын акт түзүлүп, добуш берүүнүн жыйынтыктары жөнүндөгү протоколго тиркелет. Актыда участкадан тышкары жерде добуш берүүнү өткөргөн комиссия мүчөлөрүнүн аты-жөнү жана фамилиялары көрсөтүлөт. Жараксыз бюллетендер өзүнчө оролот да, баштыктын сыртына округдун аталышы, участканын номуру, жараксыз бюллетендердин саны, ошондой эле «көтөрүп жүрмө добуш берүү сандыктан алынган жараксыз бюллетендер» деген жазуу жазылып, УШКнын мөөрү коюлат."},{"t":"v","l":["Эмне кылуу керек?","Талапкердин өкүлү же байкоочу бюллетендерди кайра эсептеп чыгууну талап кылды"]},{"t":"p","h":"Бюллетендерди арыздануучунун кез алдында кайра саноо керек. Кайра саноо учурунда ар бир добуш ким үчүн берилгендиги угуза айтылып турат."},{"t":"v","l":["Эмне кылуу керек?","Протоколдогу маалыматтар менен добуш берүүнүн натыйжалары дал келбей калды."]},{"t":"p","h":"УШК бардык маалыматтарды же протоколдун айрым саптарындагы маалыматтарды талапкерлердин өкүлдөрүнүн жана байкоочулардын көз алдында кайра саноо жөнүндө чечим кабыл алышы мүмкүн."},{"t":"v","l":["Эмне кылуу керек?","Протоколдун 2-сабындагы сан 3, 4, 5, 7-саптардагы сандардын суммасынан көптүк кылат"]},{"t":"p","h":"* Протоколдун №2 сабындагы сан менен 3, 4, 5, 7-саптардагы сандардын суммасынын ортосундагы айырма №16- сапка киргизилип жана №17-сапка ноль деген цифра жазылууга тийиш"},{"t":"v","l":["УШК атайын акт түзүп, расмий протоколго тиркөөгө милдеттүү.","Эмне кылуу керек?","Расмий протоколдун № 3, 4, 5, 7 саптарындагы сандар №2 саптагы сандан көптүк кылат"]},{"t":"p","h":"&gt; Мындай учурда №3, 4, 5 саптардагы сандар менен №2 саптагы сандын ортосундагы айырма №17 сапка жазылып,"},{"t":"p","h":"№16 сапка «0» коюлушу керек."},{"t":"v","l":["УШК бул тууралуу документ түзүп, расмий протоколго тиркеп коюуга тийиш.","Жыйынтык маалыматтар дал келсе эмне кылуу керек?","Мындай учурда № 16 жана №17 саптарга «0» саны жазылышы керек.","Эмне кылуу керек?"]},{"t":"p","h":"Добуштарды кайталап эсептегенде расмий протоколго тийиштүү өзгөртүүлөрдү киргизүү зарыл болуп калды. + Мындай учурда жаңы, таза расмий протоколду толтуруу керек, ошондой эле добуш берүүнүн жыйынтыктары жөнүндөгү протоколдун чоңойтулган формасына тийиштүү өзгөртүүлөрдү киргизүү зарыл."},{"t":"v","l":["Расмий протоколдун мурдагы көчүрмөсүнө «туура эмес» деп жазуу керек.","Шайлоо күнүнөн кийин"]},{"t":"p","h":"Добуш берүүнүн жыйынтыктарын жана шайлоонун натыйжаларын таанышып көрүү үчүн берүү, ошондой эле каржылык отчетту жана шайлоочулардын жаңыртылган тизмелерин райондук/шаардык шайлоо комиссиясына берүү шайлоо күнүнөн кийинки маанилүү милдеттер болуп саналат."},{"t":"p","h":"а) Шайлоонун жыйынтыктары менен натыйжаларын тааныштыруу үчүн берүү."},{"t":"p","h":"Добуш берүүнүн натыйжалары шайлоочулардын, талапкерлердин, алардын өкүлдөрүнүн, байкоочулардын, эларалык байкоочулардын жана ММК өкүлдөрүнүн өтүнүчү боюнча аларга көрсөтүлүп турушу керек."},{"t":"p","h":"б) Каржылык отчёт. \\Пайлоо бүткөндөн 10 күн өтө электе УШК райондук/шаардык шайлоо комиссиясына шайлоону <span class=\"pg\" data-n=\"171\">171<\/span>Жаранды мамлететти вашпаруугёа патышуу ХХ] лылыздын жЖарандып уу ХХ нылымд даярдап өткөрүү үчүн алынган жана сарпталган акча каражаттарын көрсөтүү менен отчет берүүгө тийиш в) УШКнын ыйгарымдарынын токтолушу жана шайлоочулардын жаңыртылган тизмелерин жеткирүү УШК шайлоонун жыйынтыктары расмий түрдө жарыялангандан кийия 10 күн ичинде өз ыйгарымдарын токтотууга тийиш Эгерде шайлоонун натыйжалары боюнча талаш маселелер жок болсо, шайлоочуларлый тизмелери райоялук/ шаардык шайлоо комиссиясына өткөрүп берилет, ал жерде өзгөртүүлөр мёнен толуктоолор шайлоочуларды кагтоонун мами екеттик системасына киргизилет."},{"t":"p","h":"ла д лдеру:"},{"t":"p","h":"Колуңузда жыйынтыктар жазылган болушу керек. Протоколлун көчүрмөсүн УШК мүчөлөрүнөн сурап алууга Сиз укуктуусуз. Бул маалымат Сиздин уюмунуз менен таланкеринизге добуш берүүнүн жыйынтыктары жогору турган шайлоо комиссиясына туура тартипте өткөрүлгөндүгүн анык билүү мүмкүндүгүн берет"},{"t":"p","h":"1Х. Даттануулар жана арыздар Эгерде байкоочулар талапкерлердин өкүлдөрү же шайлоочулар добуш берүү жол жоболоруна байланышкан кандайдыр бир кемчиликтерди байкаса, алар тийиштүү даттанууну, актыны же арызды жазуу турунле түзүүгө укуктуу. Бирок участкадагы мындай кемчиликтерди эң тез жана натыйжалуу четтетүүнүн жолу бул кемчиликтерге комиссия төрагасынын катчысынын же башка мүчөлөрүнүн көнүлүн буруу болуп саналат Эсиңизде болсун! Байкоочулар, талапкерлердин өкүлдөрү жана УШК мүчөлөрү бир максатка – шайлоону мүмкүн болушунча ачык – айкын демократиялуу жана адилеттүү өткөрүүгө умтулушу зарыл! Сиздер бири-бириңиздерге душман эмессиздер, баарыңыздар кесиптештер катары чогуу иштешиңиздер керек!"},{"t":"p","h":"Эгерде УШК төрагасы сиз айткан тартип бузууларга көнүл бурбай койсо, ал кемчиликтер добуш берүү процессине терс таасир тийгизсе, сиз арыз жазууга укуктуусуз. Мүмкүн болгон бардык жерлерде расмий форманы колдонунуз УШКнын мүчөлөрү:"},{"t":"p","h":"Өзмилдеттериңиздерди так жана туура аткарыныздар, башкалар суроо бергенде көрсөтүү үчүн Шайлоо жана УШК мүчөлөрүнүн колдонмосун жакшы окуп чыгып, урунттуу жерлерин көчүрүп жазып алыныз, ‚ Участкада кандайдыр бир маселе пайда болсо же кимдир бирөө ошондой маселе чыкты дёп эсептесе, чечим кабыл алуудан мурун маселенин бардык жагын даана билүүгө аракеттениңиздер. Байкоочуларга жана талапкерлердин өкүлдөрүнө бул маселе боюнча эмне чара көргөнүнүздү жана эмне үчүн ошондой чечимге келгендигиңизди айтып бериңиз."},{"t":"p","h":"УШКнын жыйынтыктоочу чогулушунда добуш берүүнүн натыйжалуулугу жөнүндөгү протоколго кол коюлганга чейин бардык даттанууларды карап чыгуу керек. Даттанууларды кароодон мурун төмөндөгүлөрдү жасаңызлар:. Арбир даттануу, акт же арыз менен кунт коюп таанышып чыгыңыздар."},{"t":"v","l":["„+ Арыз берүүчүлөрдүн жана арыздардын баарына бирдей караңыз.","Бардык даттануулар жана арыздар боюнча УШК мүчөлөрү добуш берүүсү зарыл."]},{"t":"p","h":"Эгерде кайсы бир маселе боюнча эмне кылууну билбесеңиздер, анда жогору турган ШКга кайрылыныздар. Арыздарды, даттанууларды жана актыларды берүүдө:"},{"t":"p","h":"Бардык кагаздарды тиркеп, окуянын убактысын, ага катышкандардын аты жөнүн абдан так көрсөтүнүз. Мүмкүн болгондо шайлоо кодексине кайрылып, андагы бузулган статьяларды көрсөтүңүз."},{"t":"v","l":["Төмөндөгүлөрдү кошуңуз:","о Участканын номуру жана аталышы, УШК төрагасынын аты-жөнү","Маселенин майда-чүйдөсү (деталдары)","Күбөлөрдүн аты-жөнү","Маселеге тиешелүү каалагандай документтердин деталдары"]},{"t":"p","h":"Өзүнүздүн аты-жөнүңүз жана байланышуу үчүн маалыматыныз. (Эгерде мүмкүн болсо өзүнүз өкүл болгон уюм жөнүндө кеңири маалымат бериңиз)"},{"t":"v","l":["Колунузда бар бардык күбөлүктөрдү тиркеңиз.","нуулар төмөндө і в оерилиши мүмкүн:","Тартип лган участканын комиссиясына","Жогору турган комиссияга","Райондук же шаардык сотко"]},{"t":"p","h":"Мисалы, УШКда тартип бузулган болсо, даттануу УШКнын өзүнө райондук/шаардык ШКга же болбосо түз эле сотко жиберлиши мүмкүн. Сотто каралышы керек деп эсептесеңиз, арызыңызды адегенде шайлоо комиссияларына бербесеңиз деле болот."},{"t":"p","h":"Эгерде даттанууңузду бир ШКда четке кагышса, жогору турган комиссияга бере аласыз."},{"t":"p","h":"Эгерде сот жарандын арызын караштыруу үчүн кабыл алган болсо, соттун чечими чыкмайынча, ошол эле кайрылуу боюнча шайлоо комиссиясы териштирбей күтө турат."},{"t":"p","h":"Соттун чечими дароо күчүнө кирет да, милдеттүү түрдө аткарылышы керек. Бул чечим жогору турган соттун чечими боюнча гана өзгөртүлүшү мүмкүн."},{"t":"p","h":"Добуш берүү күнүнө чейин сотко берилген даттануулар үч күндүк мөөнөт ичинде каралууга тийиш. Добуш берүү күнү бардык даттануулар дароо каралат."},{"t":"p","h":"Эсиңизде болсун! Даттанууларды, актыларды жана арыздарды берүүгө байланышкан бардык маселелер боюнча Кыргыз Республикасынын Ша   }

  function fetchJSON(url) {

    ['kyrgyz-adabiyat', /кыргыз адабият|кыргызская литература/, 'Кыргыз адабияты', 'Кыргызская литература'],
    ['russkiy-yazyk', /русский язык|орус тили/, 'Орус тили', 'Русский язык'],
    ['russkaya-literatura', /русская литература|литературное чтение|орус адабият/, 'Орус адабияты', 'Русская литература'],
    ['adabiyat', /адабият|литератур/, 'Адабият', 'Литература'],
    ['matematika', /математик|алгебр|геометр/, 'Математика', 'Математика'],

    ['himiya', /хими/, 'Химия', 'Химия'],
    ['biologiya', /биолог/, 'Биология', 'Биология'],
    ['geografiya', /географ/, 'География', 'География'],

    ['istoriya-mir', /дүйнө тарых|орто кылым|жаңы тарых|соңку тарых|байыркы|всемирная история|средних век|новая история|новейшая история|древн/, 'Дүйнө тарыхы', 'Всемирная история'],
    ['religii', /диндер|религи/, 'Диндердин тарыхы', 'История религий'],
    ['obshchestvo', /адам жана коом|человек и общество/, 'Адам жана коом', 'Человек и общество'],

  function subjectOf(b) {

  // "My books": books the reader opened or added, stored on the phone. 1 = in the list,

      (main ? '<p class="sub">' + esc(t('appSub')) + '</p><div class="school">' + SCHOOLS.map(function (o) {
        return '<button data-s="' + o[0] + '"' + (o[0] === school ? ' class="on"' : '') + '>' + esc(o[1]) + '</button>';
      }).join('') + '</div>' : '') +
      '<div id="books"><div class="loading">' + esc(t('loading')) + '</div></div></div>';
    Array.prototype.forEach.call(app.querySelectorAll('.school button'), function (btn) {
      btn.onclick = function () {
        S.school = S.ui = btn.getAttribute('data-s'); applySettings();

  }

  var LIST = null; // the last book list loaded, for the reader's quality badge
  function loadList() {
    return fetchJSON('books/index.json').then(function (list) { LIST = list; return list; }).catch(function (e) {
      $('#books').innerHTML = '<div class="loading">' + esc(t('err')) + '</div>'; throw e;
    });
  }

  function showLibrary() {
    libHash = '#/';
    var school = libShell(t('appTitle'), '<a class="btn my-link" href="#/my">' + esc('★ ' + t('my')) + '</a>', true);
    loadList().then(function (list) {
      list = list.filter(function (b) { return !b.school || b.school === school; });
      var grades = [];
      list.forEach(function (b) { gradesOf(b).forEach(function (g) { if (grades.indexOf(g) < 0) grades.push(g); }); });
      grades.sort(function (a, b) { return a - b; });
      var open = lsGet('libOpen', {});
      var box = $('#books');
      box.innerHTML = grades.length ? '' : '<div class="loading">' + esc(t('noBooks')) + '</div>';
      grades.forEach(function (g) {
        var books = list.filter(function (b) { return gradesOf(b).indexOf(g) >= 0; });
        var sec = document.createElement('section'); sec.className = 'grade';
        sec.innerHTML = '<button class="grade-h"><span>' + esc(g + ' ' + t('grade')) + '</span><span class="n">' + books.length + '</span></button><div class="grade-b"></div>';
        var head = $('.grade-h', sec), body = $('.grade-b', sec);
        function setOpen(on) {
          sec.classList.toggle('open', on);
          body.innerHTML = '';
          if (on) bySubject(books, body, false);
        }
        head.onclick = function () {
          var on = !sec.classList.contains('open');
          Array.prototype.forEach.call(box.querySelectorAll('.grade.open'), function (s) { if (s !== sec) { s.classList.remove('open'); $('.grade-b', s).innerHTML = ''; } });
          setOpen(on);
          open[school] = on ? g : null; lsSet('libOpen', open);

  function showMyBooks() {
    libHash = '#/my';
    libShell(t('my'), '<a class="btn my-link" href="#/">' + esc('‹ ' + t('allBooks')) + '</a>', false);
    loadList().then(function (list) {
      var box = $('#books');
      var mine = list.filter(function (b) { return inMy(b.id); });
      box.innerHTML = '';
      if (!mine.length) { box.innerHTML = '<div class="loading">' + esc(t('myEmpty')) + '</div>'; return; }
      var grades = [];
      mine.forEach(function (b) { var g = gradesOf(b)[0]; if (grades.indexOf(g) < 0) grades.push(g); });
      grades.sort(function (a, b) { return (a == null ? 99 : a) - (b == null ? 99 : b); });
      grades.forEach(function (g) {
        var sec = document.createElement('section'); sec.className = 'grade open';
        sec.innerHTML = '<h2 class="grade-t">' + esc(g == null ? '' : g + ' ' + t('grade')) + '</h2><div class="grade-b"></div>';
        bySubject(mine.filter(function (b) { return gradesOf(b)[0] === g; }), $('.grade-b', sec), true);
        box.appendChild(sec);
      });
    });
  }

  // Books under subject headings; subjects without books are never shown.
  function bySubject(books, root, myView) {
    var groups = {}, keys = [];
    books.forEach(function (b) {
      var s = subjectOf(b);
      if (!groups[s.key]) { groups[s.key] = { s: s, books: [] }; keys.push(s.key); }
      groups[s.key].books.push(b);
    });
    keys.sort(function (a, b) { var x = groups[a].s, y = groups[b].s; return x.order - y.order || (x.name < y.name ? -1 : x.name > y.name ? 1 : 0); });
    keys.forEach(function (k) {
      var h = document.createElement('h3'); h.className = 'subj'; h.textContent = groups[k].s.name;
      root.appendChild(h);
      groups[k].books.forEach(function (b) { root.appendChild(bookRow(b, myView)); });
    });
  }

  // "7", 7, "7–9" or "10-11" -> [7], [7, 8, 9], [10, 11]
  function gradesOf(b) {

    if (!m) return [];

  }

    dl: '<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>',
    done: '<svg viewBox="0 0 24 24"><path d="M5 20h14M7.5 11.5l3 3 6-6.5"/></svg>',
    share: IS_IOS
      ? '<svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M8.5 10H6.5a1.5 1.5 0 0 0-1.5 1.5v8A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-8a1.5 1.5 0 0 0-1.5-1.5h-2"/></svg>'

  };

  function bookRow(b, myView) {
    var el = document.createElement('div'); el.className = 'bk';
    var hasPos = !!lsGet('pos:' + b.id, null);
    var mb = (b.size / 1048576).toFixed(1);
    var meta = [[b.author, b.year].filter(Boolean).join(', ')];
    if (gradesOf(b).length > 1) meta.push(b.grade + ' ' + t('grade'));
    if (myView && b.school) meta.push(b.school === 'ky' ? 'Кыргыз мектеби' : 'Русская школа');
    meta.push(mb + ' ' + t('mb'));
    el.innerHTML = '<div class="bk-h"><div class="bk-t">' + esc(b.title) + '</div>' +
      '<button class="icon star" aria-label="' + esc(t('my')) + '">' + LIB_ICONS.star + '</button></div>' +
      (b.subtitle ? '<div class="bk-s">' + esc(b.subtitle) + '</div>' : '') +
      '<div class="bk-m">' + esc(meta.filter(Boolean).join(' · ')) + '</div>' +
      '<div class="row"><a class="btn primary" href="#/read/' + esc(b.id) + '">' + esc(hasPos ? t('cont') : t('read')) + '</a>' +
      '<button class="icon dl"></button><button class="icon share" aria-label="' + esc(t('share')) + '">' + LIB_ICONS.share + '</button>' + qBadge(b) + '</div>' +
      '<div class="progress" hidden><i></i></div>';
    var btn = $('.dl', el), prog = $('.progress', el), bar = $('.progress i', el), star = $('.star', el);

    };

      btn.setAttribute('aria-label', done ? t('downloaded') : t('download'));
      btn.classList.toggle('on', done);
      btn.onclick = done ? function () { toast(t('downloaded')); if (window.confirm(t('removeAsk'))) remove(); } : download;
      prog.hidden = true;

      if (!window.caches) { toast(t('noStorage')); return; }
      btn.disabled = true; prog.hidden = false; bar.style.width = '0'; if (quiet !== true) toast(t('downloading'));
      downloadBook(b, function (f) { bar.style.width = Math.round(f * 100) + '%'; })
        .then(function () { setState(true); if (quiet !== true) toast(t('dlDone')); })
        .catch(function () { setState(false); if (quiet !== true) toast(navigator.onLine === false ? t('offline') : t('err')); });

  // Share a book: a link (opens the app at the book) or the single-file book, through the

  function shareSheet(b) {
    var name = b.title + (b.grade ? ', ' + b.grade + ' ' + t('grade') : '');

  // Text quality of a book, from the "quality" field in books/index.json:

  function downloadBook(b, onProgress) {
    var base = 'books/' + b.id + '/';
    var cache;
    return caches.open(cacheName(b)).then(function (c) {
      cache = c;
      return fetch(base + 'book.json');
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return cache.put(base + 'book.json', r.clone()).then(function () { return r.json(); });
    }).then(function (book) {
      // app files are kept up to date by the service worker (sw.js), not stored with each book
      var urls = book.images.map(function (i) { return base + i; });
      var done = 0;
      // a few requests in parallel: fast on 3G, gentle on slow phones
      var queue = urls.slice();
      function worker() {
        var u = queue.shift();
        if (!u) return Promise.resolve();
        // a picture already saved with an older version of this book is reused, not downloaded again
        return caches.match(u).then(function (hit) {
          if (hit) return cache.put(u, hit);
          return fetch(u).then(function (r) { if (!r.ok) throw new Error(u); return cache.put(u, r); });
        }).then(function () { done++; onProgress(done / urls.length); return worker(); });
      }
      if (!urls.length) onProgress(1);
      return Promise.all([worker(), worker(), worker(), worker()]);
    }).then(function () {
      lsSet('dl:' + b.id, b.v);
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      return caches.keys().then(function (keys) { // drop older versions of this book
        return Promise.all(keys.filter(function (k) { return k.indexOf('book-' + b.id + '-') === 0 && k !== cacheName(b); }).map(function (k) { return caches.delete(k); }));
      });
    });

  // ================================================================ READER
  var ICONS = {

    toc: '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
    set: '<svg viewBox="0 0 24 24"><path d="M4 20l5-14h2l5 14M6.5 14h7"/><path d="M17 11l2.5-6L22 11M17.8 9h3.4"/></svg>',
    close: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'

  function openReader(id) {

      });

  function startReader(book, base, entry) {

      '<div class="viewport"><div class="flow" lang="' + esc(book.lang) + '"></div></div>' +

      '<div class="title">' + esc(book.title) + '</div>' +
      (qBadge(entry) ? '<button class="icon b-q" aria-label="' + esc(t('quality')) + '"><span class="qdot q-' + entry.quality + '"><i></i></span></button>' : '') +
      '<button class="icon b-toc" aria-label="' + esc(t('contents')) + '">' + ICONS.toc + '</button>' +
      '<button class="icon b-set" aria-label="' + esc(t('settings')) + '">' + ICONS.set + '</button></div>' +

      '<input type="range" class="slider" min="0" max="1" step="1"></div>' +
      '</div>';

    var reader = $('.reader'), vp = $('.viewport'), flow = $('.flow'), footT = $('.foot .t'), footN = $('.foot .n');
    var slider = $('.slider'), i1 = $('.bar .i1'), i2 = $('.bar .i2');

    // original textbook page numbers -> chapter, for "go to page" and the slider
    var pgChapter = {}, pgList = [];
    chapters.forEach(function (c, ci) {
      c.blocks.forEach(function (b) {
        var html = b.h || (b.l ? b.l.join(' ') : '');
        var re = /data-n="(\d+)"/g, m;
        while ((m = re.exec(html))) { var n = +m[1]; if (!(n in pgChapter)) { pgChapter[n] = ci; pgList.push(n); } }
      });
    });
    pgList.sort(function (a, b) { return a - b; });
    if (pgList.length) { slider.min = 0; slider.max = pgList.length - 1; }

    var ch = -1, page = 0, pages = 1, step = 0, colW = 0, H = 0;
    var blockPage = [], pgMarks = []; // [{n, page}]

    function src(s) { return /^data:/.test(s) ? s : base + s; }

    function blockHTML(b, i) {
      var a = ' data-i="' + i + '"';
      switch (b.t) {
        case 'h1': case 'h2': case 'h3': return '<' + b.t + a + '>' + b.h + '</' + b.t + '>';
        case 'p': return '<p' + a + (b.ni ? ' class="ni"' : '') + '>' + b.h + '</p>';

        case 'v': return '<div class="verse"' + a + '>' + b.l.map(function (l) { return l === '' ? '<div class="gap"></div>' : '<div>' + l + '</div>'; }).join('') + '</div>';
        case 'img': return '<figure' + a + '><img data-w="' + b.w + '" data-h="' + b.ht + '"' + (b.dw ? ' style="width:' + b.dw + 'em"' : '') + ' src="' + esc(src(b.src)) + '" alt="' + esc(b.alt || '') + '">' +

      if (ci === 0 && qBadge(entry)) html = '<div class="qline">' + qBadge(entry) + '</div>' + html; // on the book's first page
      if (ci === chapters.length - 1) html += '<div class="endnote">— ' + esc(t('end')) + ' —<br>' + esc(t('source')) + ': ' + esc(book.source && book.source.site || '') + '</div>';

    function layout() {

      flow.style.marginLeft = pad + 'px';
      flow.style.columnWidth = colW + 'px';

        var w = +img.getAttribute('data-w'), h = +img.getAttribute('data-h');

      blockPage = [];
      Array.prototype.forEach.call(flow.querySelectorAll('[data-i]'), function (el) {

      });
      pgMarks = Array.prototype.map.call(flow.querySelectorAll('.pg'), function (el) {
        return { n: +el.getAttribute('data-n'), page: Math.floor((el.getBoundingClientRect().left - fr.left + 2) / step) };
      });
    }

    function curBlock() {
      var b = 0;
      for (var i = 0; i < blockPage.length; i++) { if (blockPage[i] != null && blockPage[i] <= page) b = i; else if (blockPage[i] > page) break; }
      return b;
    }
    function bookPage() { // textbook page shown at top of this screen
      var n = null;
      for (var i = 0; i < pgMarks.length; i++) { if (pgMarks[i].page <= page) n = pgMarks[i].n; else break; }
      if (n == null) { // before first marker of this chapter: previous chapter's last page
        for (var j = pgList.length - 1; j >= 0; j--) if (pgChapter[pgList[j]] < ch) { n = pgList[j]; break; }
      }
      return n == null ? (pgMarks[0] ? pgMarks[0].n : null) : n;
    }

    function show(p, anim) {
      page = Math.max(0, Math.min(pages - 1, p));
      flow.classList.toggle('anim', !!anim);
      flow.style.transform = 'translate3d(' + (-page * step) + 'px,0,0)';
      var bp = bookPage();
      footT.textContent = chapters[ch].title;
      footN.textContent = (bp != null ? t('page') + ' ' + bp + ' · ' : '') + (page + 1) + '/' + pages;
      i1.textContent = chapters[ch].title;
      i2.textContent = bp != null ? t('page') + ' ' + bp + ' / ' + pgList[pgList.length - 1] : '';

    function goBlock(ci, bi) {

    function goBookPage(n) {
      if (!(n in pgChapter)) { toast(t('notFound')); return false; }
      if (pgChapter[n] !== ch) renderChapter(pgChapter[n]);
      for (var i = 0; i < pgMarks.length; i++) if (pgMarks[i].n === n) { show(pgMarks[i].page, false); return true; }

    // ---- touch: swipe to turn pages

    // ---- taps: left third back, right third forward, middle shows menus

    // ---- picture viewer: tap a picture to see it full screen; tap again to enlarge, scroll to move
    function openZoom(img) {
      var z = document.createElement('div'); z.className = 'zoom';
      var big = false;
      z.innerHTML = '<div class="zoom-in"><img alt=""></div><button class="icon zoom-x" aria-label="' + esc(t('close')) + '">' + ICONS.close + '</button>';
      var zi = $('img', z); zi.src = img.src;

    $('.b-toc').onclick = function () {
      var html = '<h3>' + esc(t('contents')) + '</h3>' +
        '<div class="goto"><input type="number" inputmode="numeric" placeholder="' + esc(t('gotoPage')) + '"><button class="btn primary">' + esc(t('go')) + '</button></div><div class="toc">';
      var lastSec = null;
      chapters.forEach(function (c, ci) {

        lastSec = c.section || lastSec;
        html += '<a href="#" data-c="' + ci + '" data-b="0"' + (ci === ch ? ' class="cur"' : '') + '>' + esc(c.title) +

        if (c.sub) {
          c.sub.forEach(function (s) {
            if (s.b != null) html += '<a href="#" class="sub" data-c="' + ci + '" data-b="' + s.b + '">' + esc(s.title) + '</a>';
          });
        } else {
          c.blocks.forEach(function (b, bi) {
            if (b.t === 'h2' && bi > 0) html += '<a href="#" class="sub" data-c="' + ci + '" data-b="' + bi + '">' + b.h.replace(/<[^>]+>/g, '') + '</a>';

      var cur = $('.cur', sh); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'center' });

    var bq = $('.b-q'); if (bq) bq.onclick = function () { qualitySheet(entry); };

    $('.b-set').onclick = function () {
      function seg(key, opts) {
        return '<div class="seg" data-k="' + key + '">' + opts.map(function (o) {
          return '<button data-v="' + o[0] + '"' + (o[2] ? ' class="' + o[2] + (String(S[key]) === String(o[0]) ? ' on' : '') + '"' : (String(S[key]) === String(o[0]) ? ' class="on"' : '')) + '>' + o[1] + '</button>';
        }).join('') + '</div>';
      }
      var sh = openSheet(
        '<h3>' + esc(t('settings')) + '</h3>' +
        '<div class="set"><label>' + esc(t('fontSize')) + '</label><div class="seg"><button data-fs="-2" style="font-size:14px">A−</button><button class="fsv" disabled>' + S.fs + '</button><button data-fs="2" style="font-size:20px">A+</button></div></div>' +
        '<div class="set"><label>' + esc(t('theme')) + '</label>' + seg('theme', [['light', t('light'), 'swatch'], ['sepia', t('sepia'), 'swatch'], ['dark', t('dark'), 'swatch'], ['contrast', t('contrast'), 'swatch']]) + '</div>' +
        '<div class="set"><label>' + esc(t('font')) + '</label>' + seg('font', [['serif', '<span style="font-family:Georgia,serif">' + esc(t('serif')) + '</span>'], ['sans', '<span style="font-family:Roboto,Arial,sans-serif">' + esc(t('sans')) + '</span>']]) + '</div>' +
        '<div class="set"><label>' + esc(t('spacing')) + '</label>' + seg('lh', [[1.35, '1.35'], [1.55, '1.55'], [1.8, '1.8']]) + '</div>' +
        '<div class="set"><label>' + esc(t('lang')) + '</label>' + seg('ui', [['ru', 'Русский'], ['ky', 'Кыргызча']]) + '</div>');
      sh.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.hasAttribute('data-fs')) {
          S.fs = Math.max(13, Math.min(34, S.fs + +b.getAttribute('data-fs')));
          $('.fsv', sh).textContent = S.fs;
        } else {
          var k = b.parentNode.getAttribute('data-k'); if (!k) return;
          var v = b.getAttribute('data-v'); S[k] = k === 'lh' ? +v : v;
          Array.prototype.forEach.call(b.parentNode.children, function (x) { x.classList.toggle('on', x === b); });
          if (k === 'ui') { applySettings(); closeSheet(); route(); return; }
        }
        applySettings(); relayout();
      });
    };

    cleanup = function () {
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('resize', onResize);
      closeSheet();
    };

    var pos = lsGet(posKey, null);
    if (pos && chapters[pos.ch]) goBlock(pos.ch, pos.b || 0); else { renderChapter(0); show(0, false); }
    // fonts can change metrics after first paint
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  }

  // ---------------------------------------------------------------- boot
  applySettings();
  window.addEventListener('hashchange', route);
  route();
  if (!EMB && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () { /* offline support unavailable */ });
  }
})();
</script>
</body>
</html>

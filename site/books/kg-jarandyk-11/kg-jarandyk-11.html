 көзөмөлүндө макул болгон. Эквадордун экүлү 1992-1995-жылга чейин турбаган мамлекеттик түзүмдөр жекече керектөөлөрү үчүн 19 000 доллар өлчөмүндөгү чалдыгат, ушундай түзүмдөрдө каржылык жардам алган. Мындан тышкары ага Солт-Лейк- Ситиге каттаган жол чыгымдары да төлөнүп берилген. коррупция пайда болот. Мисалы,"},{"t":"p","h":"Ушуга байланыштуу башка өлкөлөрдүн шаарлары буга орто кылымдарда классикалык же чейин Олимпиада оюндарын өздөрүндө өткөрүү укугуна салттуу монархия түзүмүндөгү кандайча жетишип жүргөн эле деген суроо туулат. 1 мамлекеттик системаларда коррупция сөзсүз түрдө болбой коймок эмес, анткени бул мамлекеттик саясатты жүргүзүү формаларынын бири болгон. Көптөгөн кылымдар бою чыгыш азиялык залим бийлик системаларында (шах бийлеген Персияда, Борбордук Азиядагы хандыктар менен эмираттарда, Түштүк-Чыгыш Азиянын айрым өлкөлөрүндө жана Осмон империясында) улук өкүмдар адатта мамлекеттик жергиликтүү администрациялардын башчылык кызматын сатып турган. Бул кызматтар ким көп төлөсө, ошого берилген. Кызмат ордун сатып алган адам буга кеткен чыгымдарды кийин жергиликтүү бийликти жүргүзө баштаганда толугу менен кайтарып ала тургандыгын күн мурунтан эле билчү. Анткени анын пара алууга, жергиликтүү калкты талап-тоноого мүмкүнчүлүгү кенен болор эле. Башкача айтканда, коррупция жогорку бийлик, жергиликтүү акимдер жана карапайым адамдар ортосундагы мамилелерге тамыр жайган эле."},{"t":"p","h":"Кылымдар бою өкүм сүрүп келген мындай мамилелер калктын төмөнкү катмарлары жогоркуларына иерархия түрүндө көз каранды болгон системага негизделген. Мындай шартта теңдик жөнүндө сөз болушу <span class=\"pg\" data-n=\"100\">100<\/span>да мүмкүн эмес эле. Ал кезде бул “кадыресе” эл е мамиле болгон, анткени адамдар мындан башкача. болушу мүмкүн деп ойлошкон да эмес. Жергиликтүү чиновниктер, акимдер эл көтөрүлгүдөй ач көздүк кылып, мунун айынан хандын, падышанын бийлигине коркунуч туулганда гана алардын ишине улук өкүмдар кийлигишчү."},{"t":"raw","h":"<div class=\"gloss\"><p>Жарандын Жана _шарт-ыңгай кылууга мамлекеттин укугу дайындалуучу албайт. 4.0 Тарыхтагы коррупция Коррупциянын денгээли ЖЫШ ШЫ суыр сыы<\/p><\/div>"},{"t":"p","h":"Мамлекеттик системалардын демократиялашуу багытында улам илгерилеп өнүгүүсүнө ж монархиялык мамлекеттерде коррупцияны нормалдуу көрүнүш деп баалабай калышты. Буга соода меңең өнөр жайдын өнүгүшү, ошондой эле жеке менчиктин королдордун, жогорку жаңа. (Тат – коомдогу саясий-экономикалык абалы боюнча айырмаланган адамдар тобу. жергиликтүү бийликтегилердин көзүн карабаган адамдардын жаңы табы келип кы себеп болду, Мисалы, жумушчу табы, дыйкандар табы, байлар табы.)"},{"t":"v","l":["Бирок өнөр жай же соода","ы","тм","к","ч","Ким төлөйт?","","сине электр энергиясы учун те","лөөгө ","Кафенин ээси ф"]},{"t":"p","h":"болгон көзөмөлдөө-буйрук РЕ кут ы. абдан чоң суммадагы эсеп келди. Бул аял электр меңең РҮҮ системасында иштеген адамга кайрылганда, механизмдери дагы эле монархиялык ал эсептегичти мурдагыдан азыраак жаза турган бийликтин колунда кала берди. кылып берейин деп пара сурады. Кафенин ээси буга Ошондуктан ишин илгерилетүү үчүн макул болот, эми анын кирешеси көбөйөт, анткени. эркин, кез карандысыз менчик ээлери электр жарыгын туну ары пайдалана дере?. Бир нече саясий бийлик өкүлдөрү менен жакшы ра болура ее ри ты чыгашага учураган ай"},{"t":"p","h":"Мамлекеттик бийликтин жаңы, компания бул линияны оңдоо үчүн бир жума убара' парламентчил формасы орноп, мыйзам „ел."},{"t":"p","h":"үстөмдүгү деген жобо киргизилгенден – тартып ар түрдүү таптарга кирген адамдардын ортосундагы мамиле өзгөрүлдү да, эми ар бир жаран ке карандысыз жана башкалар менен тең укуктуу деп санала баштады. Эми адамдар белгилүү укуктарг; жетишти, бул укуктардын сакталышын алар суранып отурбай эле талап кыла турган болду. Мамлеке кызмат адамы мындан ары жарандарга өз укуктарын жүзөгө ашыруу мүмкүндүгүн берүүгө милд клерктин (кызматкердин) функцияларын аткарып калды. Адамдар өз укуктарын улам жетигирээк аңда билген сайын коррупцияга карата тескери мамиле күчөй берди да, акырында аны кылмыш деп эсе калышты."},{"t":"h2","h":"Р0Д0-ПЛЕМЕННАЯ"},{"t":"v","l":["4 д","Турдукожоева Д., Жуматаева Л., Гапырова Э., Мураталиева А., Каныбекова Г., п Ж. ыл» А.","Жалалабат обл. 3-орун, 2003-ж."]},{"t":"p","h":"<span class=\"pg\" data-n=\"101\">101<\/span>Жол коюлуучу жана айыпталуучу иш-аракеттер (%) Суроо: Силердин оюңарча бул иш-аракеттерге негизинен жол коюлуш керекпи же аларды айыптоо зарылбы? (ПРООН, 2002)"},{"t":"p","h":"менен жол жолкойсо айыптоо уятиш Иш-аракеттер болот"},{"t":"h3","h":"койсо болот"},{"t":"v","l":["+","Адаттагы жол-жобону сактабай, бир","тууганын, таанышын же тааныштарынын ","балдарын жумушка, институтка, жакшы"]},{"t":"p","h":"ооруканага же мектепке таанышбилишчилик аркылуу орноштуруу \"Кызматка көтөрүлүү үчүн таанышбилишчиликти пайдалануу \"Врачтын же мугалимдин дарылануучулардан же окуучулардын ата-"},{"t":"v","l":["энелеринен белек алышы","Пайдасы тийген “керектүү” адамга","ыраазылык билдирүү иретинде, мисалы,","гүл, бир кутуча момпосуй же бир бөтөлкө","коньяк тартуу кылуу","Проблемалаңарды чечкенге жардам бере","ала турган адам менен чогуу ресторанга","киргенде тамак акысын төлөө","Көйгөйлөрүңөрдүн оңунан чечилиши","же чечилишинин тездетилиши үчүн","чиновникке пара берүү","Жеке проблемаңарды эмес, өзүңөрдүн","фирмаңардын же уюмуңардын","кызыкчылыгын көздөп пара берүү","Кайсы бир ишти жаап-жашырып","коюу же кандайдыр бир жагымсыз"]},{"t":"p","h":"териштирүүлөрдү, бюрократиялык жол-"},{"t":"v","l":["жоболорду болтурбаш үчүн акча берүү","Иш жүргүзүүнүн мыйзамдуу тартибин","бузуу аркылуу башка бир тармакта ушундай","эле жол менен жардамдашкан бирөөнүн","ишине көмөктөшүү","Салыкты төлөбөй коюу","Паракордун бетин ачып, укук коргоо","органдарына “Шашылыш байланыш”","аркылуу айтып берүү","","5.0 М/Саясатка жана бийликке таасир этүүчү криминал түзүмдөр","берууден","кыйналып"]},{"t":"p","h":"Мамлекеттик башкаруунун эн эле коркунучтуу жана жийиркеничтүү формасы жогорку бийликти “криминал түзүмдөр” деп аталган, б.а. кылмышкер уюмдар жана топтор басып алгандагы түрү болсо керек. Мамлекеттик бийлик – өзүмчүл мүдөөлөргө (максаттарга) жетишүүнүн эң күчтүү каражаты. Мындай шартта кылмышкер топтордун пара алуу, опузалап пайда өндүрүү, мамлекеттик бюджетти манипуляциялоо, уюмдарды жана карапайым жарандарды ж.у.с. коркутуп-үркүтүү мүмкүнчүлүктөрү абдан чоң болот."},{"t":"p","h":"Мамлекет учун да, анын жарандары учун да башка дагы бир чоң коркунуч жогорку бийликти жекжааттык же уруучулдук негизинде бириккен топтор ээлеп алганда келип чыгат (лрайбализм). Мындай топтордун башкарганы да криминал түзүмдөрдүн ээнбаштыгына окшоп кетет. Анткени бул учурда инсандын көз карандысыздыгы эмес, мамлекет кызыкчылыктарына карама-каршы келген таламдар <span class=\"pg\" data-n=\"102\">102<\/span>үстөмдүк кылат. Мына ушул себептен италиялык мафиянын алгачкы бирикмелери өздөрүн үйбүлө де аташкан."},{"t":"p","h":"Бүтүндөй мамлекет системасы бир бүлөдөн чыккан, өз ара көз каранды туугандардан турса анда алардын тар кызыкчылыктары биринчи орунга чыгат да, мамлекеттик таламдар экинчи катард; калып кетет. Алар ээлеген абалын өздөрүнүн тар кызыкчылыктарын канаттандыруу каражаты катар пайдаланышат, Мындай системада адамдар жарандык принцип боюнча айырмаланбастан, “өз”, “жат болуп бөлүнөт. “Өз” деп таанылгандан кийин гана адам коррупцияга малынган чиновниктердин алдынд; бийлик иерхиясындагы ээлеген ордуна жараша, кандайдыр бир укуктарга жетишет. Мындай системад адам кызматка эч качан иш билгилигине жана жөндөмүнө карай коюлбайт."},{"t":"p","h":"Коррупциянын кесепеттери Өнүгүп бара жаткан өлкөлөр жөнүндөгү Жарандар жана юридикалык тараптардын айрым иликтөөлөрдө коррупция экономикалык жетекчилери жазык жолу менен жазалануучу иш- жактан оң натыйжаларга алып келет деп аракет жасабаган, опузалап пайда өндүрүүгө айтылат. Ал ишкерлердин бюрократиялык аракеттенбеген мамлекеттик кызматкерлерге мыйзамсыз түрдө материал-дык сый, белек бут тосууларды жеңип өтүшүнө мүмкүндүк м, ласа, алар үчүн мыйзамсыз түрдө түзүп, инвестицияларга, жаңы өзгөртүүлөргө, женилдик түзсө же тейлөө кызматын көрсөтсө, башкаруу ыгын өркүндөтүүгө жол ачат кыргыз Республикасынын мыйзамдарына ылайык имиш. Бул пикирлер чындыкка дал келбейт, административдик жоопкерчиликке тартылат. айрыкча коррупция жумуштагы жана жүрүш-"},{"t":"v","l":["туруштагы норма болуп калган учурлар муну","толугу менен төгүнгө чыгарат.","(КР “Коррупцияга каршы күрөш жөнүндөгү”","мыйзамынан, 2003-ж,)"]},{"t":"p","h":"Коррупция күч алганда анын кесепетинен экономика өтө начарлап, калк жакырланып кетиш мүмкүн. Анткени:"},{"t":"p","h":"&gt;» Коррупция өндүрүш чыгымдарын көбөйтүп жиберет, себеби ишкерлер парата чыгашаны өздөрү өндүргөн товардын же көрсөткөн тейлөө кызматынын наркына ко керек, болбосо эч кандай пайда ала алышпайт. Мунун айынан алардын товарлары корру анча малынбаган өлкөлөрдө чыгарылуучу товарлар менен теңтайлаша албай калат. Коррупциядан алынган киреше көбүнчө инвестицияга эмес, өздүк керектөөгө, сарпто жумшалат. (Башкача айтканда, мыйзамсыз жол менен табылган киреше жаңы имараттарды заводдорду курууга эмес, кайра алынышы кыйын болгон багытка, мисалы, өргүүгө (отпуска ашыкча кийим-кечеге сарпталат)."},{"t":"p","h":"Коррупция мыкты ишкерлерге эмес, бийликте күчтүү тааныштары бар адамдарга жол а Андыктан өндүрүштү өркүндөтө ала турган эң талантттуу ишкерлер адилетсиздик ө сүрбөгөн башка өлкөлөргө кетүүгө умтулушат. Кетпей калгандар өздөрүнүн билим де жогорулатууга аракеттенишпейт, себеби алар ак эмгек, шык-жөндөм аркылуу урмат-сыйгп жетише албасын билишет."},{"t":"p","h":"Коррупция тейлөө кызматтарынын баасын асмандатып, сапатын төмөндөтүп ийиши Мисалы, арыз берилгенден кийин документтерди даярдоого эки жума убакыт жетиштүү экени чиновник билип турса да, пара бербесең эки ай бою карабайм деп арыз ээсин убара кыла Башкача айтканда, параны мыкты тейлегени үчүн эмес, милдеттүү эле кызматын аткарган! үчүн берүүгө мажбурлашат."},{"t":"p","h":"Коррупция элдин мамлекетке болгон ишенимин жоготот, андыктан алар салык төлөөнү а каалашпайт. Демек, казынага каражат түшпөй калат же аз түшөт. Ошентип, салык штү өлчөмдө чогултулбайт да, мамлекет өз кызматкерлерине айлык акыны төлөй албай ка Мунун айынан кызматкерлер коррупциялык кире-шеге ого бетер көз каранды болуп калат. Коррупция саясатта да коркунучтуу 2004-жылдын май айында Кыргыз Республикасынын. кесепеттерге алып келет. Саясий коррупция прокуратурасы кызмат абалынан кыянаттык мене п демократиячыл эмес өлкөлөрдө көбүрөөк пайдалангандыгы жана пара алгандыгы учун 284 таралган болсо да, ал демократиячыл өлкөдө Кызмат адамын жазык жоопкерчилигине тартты, өзгөчө олурталдуу (коркунучтуу, кооптуу) Жоопко тартылгандардын катарында жергиликтүү болот. А кени ал демокр жарандар тендиги жана саяси чечимдерди че й ын өзөгүн у н өз алдынча башкаруу органдарынын 80ге жакын кызматкери да бар, кабыл алуу процессинин ачык-айкындыгы деген <span class=\"pg\" data-n=\"103\">103<\/span>эки негизги принципти бузат. Паракор- Кыраакылык комитетин түзүү – коррупцияга каршы чулук талап кылынган сумманы төлөй"},{"t":"raw","h":"<div class=\"gloss\"><p>ки 6.0 г<\/p><\/div>"},{"t":"v","l":["коркунучтуу мамиле","үзүн"]},{"t":"p","h":"(оррупция кеңири тамыр жайган көрүнүшкө айланганда, мамлекет байлыгын талап-тоноого зулук буга “акыйкатты калыбына келтирүү” топторун жол ачат. Б.а, мамлекеттик кызматтар түзүү менен жооп кылат. Жарандар топторго биригип, сатылат. Мындай абалда коррупцияга көчагө чыгат да, тегеректе болуп жаткан кылмыштуулукту аралашпаган жарандар “таанышы” еэдеру токтотууга аракеттенишет. Негизинен жакшы ниет"},{"t":"raw","h":"<h4 class=\"mk\">барлар гана баркталат экен деп ойлоп Коррупция тамыр жайганда жарандар өз укуктарын акча төлөп,<\/h4>"},{"t":"p","h":"енен жасалган мындай кадамдарды жактырса, түшүнсө эирок көбүнчө бул иш-аракеттер мыйзам чегинен кача Айтканда, алар мыйзам боюнча ок болгон иштерди жасашы мүмкүн. 004-жылы Перуда болгон окуя. зарыгып жатып жарым-жартылай ›шондо эте кеп сандагы кишилер т мэрдин үйүнө камсыздаганга аргасыз болот. Кор- кирип барга:"},{"t":"v","l":["рупция канчалык күчөсө, жарандар Өлтүргөн. Эч кан","жактан","саясий","колдоочуларга","Өлгөн эмес. уш тан","аяны коррупция. учун күнөөлөп, сабап","соттук териштирүүсүз өлүм жазасына","дин актанууга такыр мүмкүнчүлүгү"]},{"t":"p","h":"көбүрөөк болуп, Маселе эмнеде экендиги түшүнүктүү: инсандын колдогондун акысын ыктыярдуу өкүмчүлдүгү мыйзам үстөмдүгүн жокко чытарганда, түрдө эле төлөй турган болот. эте катаал жана адилетсиз ыкмапар менен каражаттар"},{"t":"p","h":"Коомдун катмарларына колдонулуп калат."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>тереңдеп кирген коррупция тамыры<\/td><td>Деги биз эмие кылсак болот? Азу<\/td><td>‚ биз жарандар<\/td><\/tr><tr><td>онууну талап кылышыбыз керек. эгер кмө муну эн оболу экметтен У кече ли. чара<\/td><\/tr><tr><td>анын моралдык, адеп-ахлактык тая-<\/td><\/tr><tr><td>бузушу мүмкүн, Буга<\/td><td>шайлоодо ага каршы доб уш бе и боло<\/td><\/tr><tr><td>коррупциячыл режимдин тушунда;<\/td><td>шайлоо процессине да коррупция аралаш<\/td><td>›гаңдыгы<\/td><\/tr><tr><td>а) кошоматчы;<\/td><td>белгилүү болсо, анда жарандар шайлоого өздөрү байкоо <\/td><\/tr><\/table><\/div>"},{"t":"v","l":["б) демилгеси үчүн көбүнчө жүргүзүшү зарыл.","жазага кабылып жүргөн;","в) башкаларга ишенбеген;"]},{"t":"p","h":"г) укуктары бар экенин ойлоп да койбогон адамдардын көбөйүп кетиши себепчи болот. Алар кезегинде өз коомдоштугундагы же үйбүлөсүндөгү башка адамдарга дал ушундай мамиле жасашат."},{"t":"p","h":"Мындай коомдо коррупция көбүнчө эпидемиядай эле болот: жугуштуу ооруга окшоп, ал калктын бардык катмарына жайылат. Көп учурларда коррупцияга эч кандай альтернатива болбой калат. Кайсы бир толугу менен мыйзамдуу ишти акылга сыярлык мөөнөттө бүтүрүүнү канчалык кааласаңар да, парасыз эч нерсе кыла албайсыңар. Мунун өзгөчө кооптуулугу – жогорку кызматтагылар коррупциялык иш-аракет жасап эч качан кармалбасын билишет. Анткени буга айыптоочу өзү дагы, азыраак болсо да, күнөөлүү эмеспи. Көп адамдар мындай коом акыры кыйрап, урап калат дешет, себеби коррупция атүтүл ага аралашпагандарга да таасир этиши мүмкүн. Жашоосу оңолбой, өз өлкөсү менен сыймыктангыдай нерселер азая берсе, эртеби-кечпи, булар да коррупциянын айлампасына тартылат."},{"t":"p","h":"7.0 Коррупцияны кантип азайтууга болот? ше"},{"t":"p","h":"Эң эле катаал мыйзамдар кабыл алынса деле коррупция жашай бериши ыктымал. Бирок демократия менен укук механизмдердин өнүгүшү гана мамлекеттик органдардын ишин коомдун көзөмөлүнө салып, коррупцияга чек коюуга мүмкүндүк берет."},{"t":"p","h":"Буга эркин массалык маалымат каражаттары жана коррупцияга малынган жарандарды алардын расмий даражасына карабай, өч алат деп коркпой жазалаганга кудуреттүү көз карандысыз сот системасы бар болгон шартта жетишүү мүмкүн. Ошондой эле коррупциялык иш-аракеттерди жасагандар аз пайда таап, көп чыгым тартып калгандай кылып койсо болот. Маселен, ар кайсы өлкөлөрдүн мыйзамдарында коррупцияга каршы бир топ катуу жазалар каралган, Ошону менен катар эле бюрократиялык жол-жоболорду жөнөкөйлөштүрүү, дээрлик бардык адамдарды убара кылып келген уруксат алуу зарылдыгын жоюу аркылуу (айрым гана иштер үчүн калтырып) бул өлкөлөрдө коррупциянын мүмкүнчүлүгүн азайта алышты."},{"t":"p","h":"Коррупция менен күрөшүүнүн дагы бир чарасы-мамлекеттик кызматкерлер менен жеке ишкерлердин жүрүш-туруш кодексин кабыл алуу аркылуу “моралдык чыгымдарды” көбөйтүү. (Бул силердин классыңарда кабыл алынган “алтын эрежелерге” окшоп кетет). Мисалы, мамлекеттик аппарат кызматкерлерин дайындоодо алардын иш билгилиги менен адеп-ахлагына, жүрүш-турушуна көңүл бурулуп, мамлекеттик кызматты"},{"t":"raw","h":"<h4 class=\"mk\"><span class=\"pg\" data-n=\"104\">104<\/span>аткаргандыгы үчүн сыймыктануу сезими өнүктүрүлөт. Көп өлкөлөрдө ишмердиктин ар кайсы түрлөрүндө (мисалы, банк же саламаттык сактоо системасында)омбудсмендер иштешет. Жеке адамдардын укуктарын ири уюмдар бузган учурларда омбудсмендер акыйкатка жетүүгө көмөктөшөт. Бул ыкмалар, иш-чаралар<\/h4>"},{"t":"v","l":["Коррупцияга каршы күрөштү эмнеден баштоого зарыл?","(калктын пикири)","(ПРООНдун сурамжылоосунан, 2000-ж.)","","ар ким өзү таза болууга тийиш:","параны бербе да, алба","","жогорку бийлик органдарындагы","коррупциячыларга сокку уруу керек","коррупцияны жоё албаса да,","анын демократия менен улуттук","экономикага коркунуч келтиргидей коом үчүн коркунучтуу кылмыш катары"]},{"t":"p","h":"даражада өнүгүп кетишине бөгөт коюу үчүн толук жетиштүү."},{"t":"p","h":"Коррупция аракеттери болуп жатса да, жаран катары биз бул көрүнүш тууралуу өз пикирибизди дайым ачык айта алабыз. Анын кесепеттерин билбегендик жана унчукпай жүрө берүүчүлүк – коррупциянын сакталышына өбөлгө түзгөн эки фактор ушулар."},{"t":"p","h":"коррупцияга катаал жаза колдонуу паракорчулукту катуу айыптаган атмосфераны түзүү керек жооп берүүдөн кыйналып турам"},{"t":"h3","h":"&gt; текстти окугандан кийинки көнүгүүлөр"},{"t":"p","h":"*% 03-тапшырма. Коррупцияга аныктама берүү 45 мүн."},{"t":"p","h":"Төмөндөгүдөй кырдаалдарды карап чыккыла. Эки-экиден болуп, булар эмне экендигин аныкта коррупциябы, же бир эле учурда коррупция жана ларалообу!, же жөн эле мыйзамсыз иш-аракетин, болбосо дегеле коррупция да, мыйзамга каршы же ката да иш эмеспи? Өз оюнарды түшүндүргөнгө д болгула."},{"t":"v","l":["(1. Жигиттин ата-энеси куда болгонго көндүрүү үчүн кыздын ата-энесине акча"," беришти. Муну кыз өзү билбейт."]},{"t":"p","h":"|2. Мамлекеттик органдын кызматкери кызмат абалынан пайдаланып, университетте окуган кызынын экзамендик бааларын жогорулатууга мугалимдерди мажбурлады."},{"t":"p","h":" 3. Компания жалдануучу катары конкурска катышты да, утуп чыккан соң аны тандап көрконкурстук комиссиянын төрагасынын курорттогу эс алуу акысын төлөп берди."},{"t":"p","h":"14. Белгилуу бир улуттун экулдерун салыктан бошоткон мыйзам кабыл алынды."},{"t":"v","l":["Мамлекеттик чиновник туугандарына кат жазганда акысыз жиберүү учун өзү","иштеген уюмдун штамптарын пайдаланат.","|6. Мамлекеттик чиновник агасынын кызын бухгалтер кылып жумушка алды. Бош","орун тууралуу кеңири жарыя жасалган эмес, бирок Рената (чиновниктин","– – мыкты бухгалтер."]},{"t":"p","h":" 7. Дарыланып бүтүп, ооруканадан чыгып бараткан адам докторго бир куту момпосуй [берди. "},{"t":"v","l":["|8. Окуу чуларды 1 болор-болбос акы үчүн айыл көчөлөрүн шыпырып тазалоого","мажбурлашты.","|9. Кызматчы өзү иштеген компаниядан товар уурдап чыгып, базарда сатты."]},{"t":"p","h":" 10. Министрликтеги бөлүм лицензия үчүн жаңы төлөм киргизүү тууралуу жарыялайт. Жарыя гезитке чыгат."},{"t":"p","h":"11. Кеңешке шайланууга талапкер шайлоочуга мен үчүн добуш берсең мамлекеттик мекемеге жумушка орноштурам деди."},{"t":"v","l":["Паралоо, бир","коррупция"]},{"t":"p","h":"'Паралоо – пара берүүнүн синоними, бирок айырмасы да бар. Бул кызмат адамдарында эле эмес, мисалы, шайлооч күбөлөргө мыйзамсыз максатка жетуц үчүн акы ке ии а <span class=\"pg\" data-n=\"105\">105<\/span>111, 04-тапшырма, Силер кантет элеңер? Ошондо ким болмоксуңар? 30мүн. Төмөндө бир нече кырдаал берилген. Булардын көбү коррупциялык иш эмес, бирок баарында силер чечим кабыл алуу үчүн өзүңөрдүн моралдык принциптериңер тууралуу ойлоп көрүшүңөр керек болот. Беш-алтыдан болуп, кырдаалдарды бөлүштүрүп алгыла. Ар бир окуучу кырдаалды окуп чыгып, өзү турмушта ушундайга туш келип калса эмне кыларын чечсин. Анан окуучулардын бирөө калгандардын (“судьялардын”) бет маңдайына отурат, эч кимге көрсөтпөй, бир барак кагазга “чын” же “калп” деп жазат. Бул баракты “судьялар” тегеректеп отурган столдун ортосуна, эч ким окуй албагыдай кылып (мисалы, китептин астына) коёт. Андан соң бул кырдаалда эмне кыларын чындай же ойдон чыгарып (кагазда жазган чечимине ылайык) айтат. Топтун калган мүчөлөрү анын чын же калп айткандыгын аныктоого тийиш (ар бир “судья” өз пикирин айтат). Ошондон кийин кагазды алышат да, окуучу иш жүзүндө эмне кыларын көрүшөт. Анан ал “судьяларга” кошулат да, анын ордуна топтон дагы бирөө барат. Ушинтип кезек менен кырдаалдардын баарын талдап чыгуу керек."},{"t":"p","h":"Кырдаалдар:"},{"t":"p","h":"1. Сен көчөдө баратып, ичинде 50 доллары бар айдоочунун күбөлүгүн таап алдың. Бул адамды тааныбайсың, бирок күбөлүктө айдоочу коңшу шаарда жашай тургандыгы көрсөтүлгөн. Сен эмне кыласың?"},{"t":"p","h":"Сен плейер сатып алдың. Анын гарантиялык мөөнөтү – бир ай. Үч күндөн кийин колундан түшүрүп ийдиң. Корпусу эч нерсе болбоду. Бирок иштебей калды. Плейерди сатып алган дүкөнгө алып бардың. Өзүң түшүрүп ийгениңди мойнуна аласынбы?"},{"t":"p","h":"Катуу сууташкыны жүргөндүктөн сен турганаймактагы бир катар айылдарда адамдарбүт мүлкүнөн кол жууп калышты. Мамлекеттик органдардын өкүлдөрү жабыр тарткан айылдардын бардык тургундарын адырлардагы, тоолордогу айылдарга көчүрдү. Эларалык уюм силердин айылдын тургундарынын баарына азык-түлүк, акча жана айрым курулуш материалдарын таратып берди. Бир гана сенин үйүң дөңсөө жерде болгондуктан, ташкын суу ага жетпей калган. Гуманитардык уюмдун кызматкери элге берилген жардамды сенин үйбүлөнө да сунуш кылса, эмне кылар элең? Окуу жылы аяктап, мектепте бүтүрүү экзамендери жүрүүдө. Экзамендерден ийгиликтүү өтсөң, башка өлкөгө окууга бара аласың. Экзаменге эки күн калганда окуучулардын бири сага экзамен суроолору менен жоопторунун мыйзамсыз жол менен жасалган көчүрмөсүн сунуш кылып калды. Сен эмне кыласың?"},{"t":"p","h":"Мурат байкең мамлекеттик мекемелердин биринде бөлүм башчы болуп иштейт. Бир жолу ал силердин үйгө келди да, айлыгы көбөйгөндүгүн, эми ишемби күнү сени менен кошо дагы бир байкендин уул-кыздарын алып Москвага жөнөрүн айтты. Ошол эле күнү кечинде сенин досуң Адыл өзүнүн Бакыт деген тууганы баңгизатты ашыкча колдонгондуктан катуу ооруп жатканын айтат. Баңгизатты ал кайдан алыптыр деп сурасаң, баланча деген мамлекеттик мекемеде иштеген Мурат аттуу кишиден сатып алыптыр деди. Ал сенин байкең эмеспи, эмне кыласың?"},{"t":"p","h":"Мектепти бүтүп, жумуш издеп жүрөсүң. Кайсы бир мекемеге орношуу үчүн аңгемелешүүгө бардың. Бир жума өткөндөн кийин жумушка алындың дешти. Иштей баштагандын эртеси баягы сени менен сүйлөшкөн киши кезигип калып: “Бул кызматка сени мен орноштурганымды билесиң да?” – деди. Сен: “Ооба, албетте”, – деп жооп бердиң. Ошондо ал: “Бул жердеги эреже боюнча сен биринчи айлык акыңды мага беришиң керек”, – деди. Эмне кыласың?"},{"t":"p","h":"Машинаң бар, бирок радиосу жок. Дүкөнгө барсаң, ал өтө кымбат экен, андыктан алган жоксуң. Бир нече күндөн кийин кимдир бирөө жапжаңы ошондой радиону он эсе арзан баада сунуш кылып калды. Уурдап сатып жатканын билип эле турасың. Эмне кыласың?"},{"t":"p","h":"(1, 05-тапшырма. Берген жаманбы же алганбы? 15 мүн."},{"t":"p","h":" Эки-экиден болуп, төмөндөгү кырдаалдарды окуп чыккыла. Анан өзүңөрдү жаңы мыйзам кабыл алып жаткан депутаттар деп элестеткиле. Силер бул маселени карашыңар керек: “Биз кимди катуураак жазалоого тийишпиз – паракордубу же пара берүүчүнүбү?”"},{"t":"p","h":"1. Бир аялдын бүт документтери үйү менен кошо өрттөнүп кеткен. Ал жаңыдан документ алуу үчүн паспорт столуна барды, Паспорт берүүчү жаңы паспорт даярдоо үчүн үч айдан кем эмес убакыт"},{"t":"raw","h":"<div class=\"gloss\"><p><\/p><\/div>"},{"t":"h3","h":"<span class=\"pg\" data-n=\"106\">106<\/span>ОРРУПЦИЯ"},{"t":"p","h":"кетет дейт. Абдан тан калган аял неге мынча кечиктирилет деп сурайт. Тигил болсо кызматкерлер аз, жумуш аябай көп, үлгүрбөйбүз деп коёт. Анан, эгер паспорт столунун начальнигине айтпай, менин өзүмө бир аз акча төлөсөңүз, паспортуңузду бир жумадан кийин кезексиз эле жазып берем деп кошумчалайт. Аял тигинин сураган акчасын берет."},{"t":"p","h":"Бир аял эзунче чакан бизнес жургузгусу келет. Муну баштоо учун бир нече лицензия алуу керек. Аял лицензия берүү башкармалыгына телефон чалып, начальниги менен сүйлөшөт. Жолугушуп, сүйлөшүп жатканда начальник уулу ооруп жүргөнүн айтат. Аял болсо эгер бардык зарыл лицензияларды жазып берсеңиз, уулуңузду дарылаганга кете турган чыгымдарды толугу менен т төлөп берет элем дейт. 6,"},{"t":"v","l":["06-тапшырма. Коррупциянын кесепеттери 45 мүн.","","Коррупциялык иш-аракеттин бардык кесепеттерин көрсөткөн кандайдыр бир схема чийгиле."]},{"t":"p","h":"жигит райадминистрацияга келип, андагы тийиштүү бөлүмгө кайрылып, көчөдө соода жүргүзгөнгө лицензия алуу үчүн эмне кылышым керек деп сурайт. Катчы аял ага 200 сом мамлекеттик пошлина төлөө керектигин, бирок лицензия алуу үчүн сегиз ай күтүүгө туура келерин айтат. Сүйлөшө келгенде алар жек-жаат болуп чыгышат. Ошондо ‚ катчы мампошлинага кошуп дагы 100 сом берип, лицензияны бир жуманын ичинде эле алса болот, бирок тууганым экенсиң, кошумча төлөбөй эле кой дейт."},{"t":"p","h":"ыы Анда ошондой эле мунун үйбүлөңөр, өзүңөр, турган жериңердеги башка адамдар, Кыргызстандын бардык жарандары үчүн кандай зыяны болорун да көрсөткүлө."},{"t":"p","h":"$$ 07-тапшырма. Бул кайсы жерлерде болот? Абалды кантип оңдош керек? 25 мун, Коррупция, эгер ага каршы ыкчам күрөш жүргүзбөсө, аркандай кесипте, ар кандай өлкөдө болушу ыктымал. К Эки-экиден болуп, келтирилген кызматтардын тизмесин карап чыккыла да, аларга тийиштүү милдеттерди сүрөттөгүлө, Анан ар бир кызматта кандай кыянаттыктар жасалышы мүмкүндүгүн түшүндүргүлө, Коррупцияны болтурбоо үчүн кандай мыйзамдарды кабыл алуу зарыл экендигин тактагыла. (Жооптордун айрымдары таблицага үлгү катары киргизилген). (Мамлекеттик кызматта тургандыгы үчүн эле бирөөнү коррупцияга чалдыккан деп күнөөлөй берүүгө болбой тургандыгын унутпагыла)."},{"t":"p","h":"кты! чурлар алдын ал л Мыйзам бузулган-"},{"t":"v","l":["бузулбаганын аныктоо","Медициналык кызмат","","Сугат сууну кезексиз","алуу үчүн пара берүү"]},{"t":"h3","h":"В 5. Наабайкананын ээси"},{"t":"v","l":["6. Кеңештин депутаты","ь ЭУ уюштуруучусу","`Университе ттин кеңсе","+ 9. Милиция кызматкери","","#% 08-тапшырма. Кимдиайыптоо керек? 15 мүн.","","_Шеригинер менен бул маселени талкуулагыла:","“Коррупциянын жайылышына мамлекеттик аппарат күнөөлүүбү же","буга бүтүндөй коом жоопкерби?”","<span class=\"pg\" data-n=\"107\">107<\/span>Жана за рууга к – ХХ] пы","","Эми болсо жоопкерчиликти өзүңөр туура көргөндөй бөлүштүргүлө.","Адамдар же уюмдар","","1. Биздин өкмөттүн жетекчилери","2. Бай адамдар","Г3, Саясатчылар","4. Бизнесмендер","5. Коррупциядан жабыр тарткандар","6. Ата-энелерибиз","7. Менин досторум","","09-тапшырма. Бул биздин каныбызга сингенби?"]},{"t":"raw","h":"<div class=\"gloss\"><p> 2 чм 4. `угалим |катчысы <\/p><\/div>"},{"t":"p","h":"Төрттөн болуп бөлүнүп, төмөндө айтылган ар түрдүү пикирлерди талкуулагыла да, алардын кайсылары өзүңөрдүн көз карашыңарга жакын экендигин тактагыла."},{"t":"p","h":"Коррупция – биздин турмушубуздун бир бөлүгү. Аны эч нерсе кыла албай тургандыгыбызды моюнга алышыбыз керек. Байлар дайыма коррупциячыл болушат, кедейлер алардан үлгү алууга умтулушат. Эмнеси болсо да паралоо жана пара берүү – керектүү иштерди ылдам бүтүрүүнүн жолу, бизнесмендер өз иштерин ушундайча илгерилетишет."},{"t":"p","h":"Коррупция – биздин борборазиялык менталитетибиздеги көрүнүш. Айрым бир жүргүзгөн адамдар бар, бирок коррупцияны жоготобуз деп бекер эле убара болуп жүрүшөт. Реалист болуп ой жүгүртөлүчү: биз коррупциялык процесстерге катышпай жашай албайбыз. Балким, колунда бар адамдар бизге да бир аз жардамдаша алгыдай даражада байып кетишер. Мен дагы адамдардан анча-мынча акча алып турууга болот деп эсептейм, анткени элдин баары эле ушинтип жатпайбы."},{"t":"p","h":"Муну мен өзүн өзү ишендирип алуу деп гана эсептейм. Буга бизди дал ошол коррупцияг белчесинен баткан чиновниктер, айрыкча жогорку кызматтагылар ынандыргысы келет, Эгер биз дагы бул болбой койбой турган нерсе деп эсептесек, анда баарыбыз коррупц батып калабыз. Мен коррупция ар кандай коомдо болот, бирок кээ бир жерлерде буг кайдигер карабастан, эреже катары, ага каршы чара көрүшөт деп ойлойм."},{"t":"p","h":"Бул жерде кеп биздин менталитетибизде эмес. Кайсы өлкөдө канчалык таралгандыгын! кандай деңгээлге жеткендигине карабай, коррупция баары бир жаман илде Коррупциячылардын бардыгын тегиз жазалоо керек. Коррупцияга малынган чиновникте менен жеке компания кызматкерлери бирдей күнөөлүү. Алар улуттук экономика булдурушет, андыктан террористтер сыяктуу эле зыяндуу. Карапайым адамдар булард азгырыгына туруштук бере билүүгө, башкалардын туура эмес иш-аракеттерине дайы, шек саноо менен кароого тийиш. Менимче, өз улуту менен сыймыктанган бир дагы жар буга мындан башкача мамиле жасабашы керек."},{"t":"v","l":["ф # $ 10-тапшырма. Эмне өзгөрөт? 25 мүн.","","Төрттөн болуп бөлүнүп, бул маалыматты окуп чыккыла:"]},{"t":"p","h":"2002-жылы АКСЕЛС уюму Кыргызстанда “Билим берүүдөгү баалоо жана окутуу усулдары борбору” (ББОУБ) аттуу көз карандысыз тест кызматын уюштурду. Бул уюм өлкөнүн Билим берүү министрлигинин тапшыруусу боюнча республиканын ЖОЖдоруна кирүүчүлөрдү жалпы республикалык тестөөдөн өткөрөт. Мындай тестөөнүн максаты – окуусун анда ары улантууга эң жөндөмдүү абитуриенттерди тандап, алардын жогорку окуу жайларында акы төлөбөй окушуна мүмкүндүк берүү."},{"t":"raw","h":"<div class=\"gloss\"><p>Жар ПОО Е ӨК УРЕ 8. Мен ы ф Игорь: йя: $ <\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"108\">108<\/span>ББОУБдун иши кандай натыйжаларга жеткирээрин жана бул уюмдун ишмердиги акыйкат, калыс жүргүзүлүшү үчүн эмнелерди эске алуу керек экендигин талкуулагыла."},{"t":"p","h":"Коррупцияны кабылдоо индекси (ККИ), 2005, Трансперенси Интернешнл Эларалык Тгапзрагепсу уюму коррупциялануу деңгээли боюнча 2005-жылы дүйнөнүн 158 өлкөсүн камтыган ар жылдык рейтингди жарыялады. Рейтинг “коррупцияны кабылдоо индекси” (ККИ) деп аталуучу көрсөткүчтүн негизинде түзүлөт. ККИ ишкерлер жана аналитиктер арасында жүргүзүлгөн сурамжылоонун натыйжасына ылайык он упайлуу шкала менен аныкталат. ККИнин эң жогорку көрсөткүчү өлкөнүн коррупшияга эң аз чалдыккандыгын билдирет."},{"t":"raw","h":"<h4 class=\"mk\"> Ис ландия Финляндия Жаңы Зеландия Дания<\/h4>"},{"t":"v","l":["Кувейт",";","Түштүк Африка","Чехия","Греция","Намибия","",";",""," Норвегия","ё","д [Австралия кё",":","","__|Нидерландия","__}Узуу Британия","із Люксембург.","[14_ _|Канада ","4","15 |Гонконг"," 6 ' Германия","18 28 Франция","[19 Бельгия"," Ирландия","я","","‚ Япония"," Испания","","ү /td><td>Нигерия<\/td><\/tr><tr><td>Гватемала<\/td><td>2.5<\/td><td>155 _|Гаити<\/td><td>1.5 1<\/td><\/tr><tr><td>Гайана<\/td><td>2.5<\/td><td>Мьянма<\/td><\/tr><tr><td>Ливия<\/td><td>25<\/td><td>Түркмөнстан<\/td><\/tr><tr><td>Непал<\/td><td>2.5<\/td><td>158 Бангладеш<\/td><\/tr><tr><td>Филиппин<\/td><td>25<\/td><td>Чад<\/td><\/tr><tr><td>Интерпол<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"Эларалык жазык полиция уюму (Интерпол) 1923-жылы ар түрдүү елкелерлун полицияларынын бири-бирине жардам бере алышы үчүн түзүлгөн эле, Интерполдун штаб-квартирасы Франциянын Леон шаарында жайгашкан."},{"t":"v","l":["Интерпол төмөндөгүдөй негизги милдеттерди аткарат:","у кылмышкерлерди издеп табуу","у дарексиз жоголгон адамдарды издеп табуу","у уурдалган баалуу мүлктү издеп табуу"]},{"t":"p","h":"+ кылмышка (баңги бизнесине, опузалап пайда өндүрүүгө, контрабандага, рэкетке, жас акча чыгарууга, мыйзамсыз иштерге) байланышкан кирешелерди мыйзамдаштырууга бөгөт коюу. 1997-жылы Интерполдун Кыргызстандагы Улуттук борбордук бюросу (УББ) түзүлгөн. Чет өлкөлөрдүн укук коргоо уюмдары менен Интерполдун кызматташуусу УББ аркылуу гай жүргүзүлөт. Кыргыз Республикасынын Башкы прокуратурасынын, Ички иштер министрлигинин Улуттук коопсуздук кызматынын ар түрдүү кылмыштарды ачуу жана тергөө боюнча суроо талаптары менен тапшырмалары ушундайча аткарылат."},{"t":"p","h":"(Бул маалымат глобалдашуу жөнүндөгү кийинки банка да тиешелүү)."},{"t":"raw","h":"<div class=\"gloss\"><p>97 107 117<\/p><\/div>"}],"sub":[],"pages":[96,109]},{"title":"XX бап. Глобалдуу маселелер жана бүткүл дүйнө жараны","blocks":[{"t":"h2","h":"<span class=\"pg\" data-n=\"110\">110<\/span>XX бап. Глобалдуу маселелер жана бүткүл дүйнө жараны"},{"t":"h3","h":"Текстти окуганга чейинки көнүгүүлөр"},{"t":"v","l":["01-тапшырма. Терминдер жана аныктамалар 15 мүн.","","Эки-экиден болуп, терминдерге аныктамаларды тапкыла,","","х"]},{"t":"raw","h":"<h4 class=\"mk\">И; (дүйнөлөшүү)<\/h4>"},{"t":"p","h":"ГУ а) Саясий максатта коркутуп-үркүтүү, абдан ырайымсыздык менен зордук көрсөтүү. Мунун кесепетинен тынч жашаган калк жабыр тартат."},{"t":"p","h":"2. Фундаментализм Ё б) Өтө катуу чараларды колдонууну жана чектен чыккан көз караштарды жактоочулук."},{"t":"raw","h":"<h4 class=\"mk\">«йа. 4 Экстремизм 5 |5. Катаклизм 1 Киришүү<\/h4>"},{"t":"v","l":["в) Кайсы бир окуулардын эзелки идеяларын, принциптерин, дөөлөттөрүн","жактаган коомдук, идеологиялык, диний кыймылдар.","г) Бузуп-жаруучу төңкөрүш, кыйроо (табияттагы, коомдогу)","д) Жеке адамдардын, ишканалардын, уюмдардын жана базарлардын","ортосундагы бүтүндөй планетаны кучагына алган татаал карым-катыш."]},{"t":"h2","h":"учун текст"},{"t":"p","h":"Бул сөздү уккан болсоңор керек Фундаментализм. Бул сөз диндин фундаменттик"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Бул бапта бүткүл дүйнөдө өтө көп (пайдубалдык),<\/td><td>б.а.<\/td><td>эзелки эрежелерин катуу<\/td><\/tr><tr><td>талаштарды туудуруп жаткан, айрыкча карманууну<\/td><td>жактоочулук<\/td><td>дегенди<\/td><td>билдирет.<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"жаштар үчүн кызыктуу болгон маселелер “Фундаментализм” – бул Америка Кошмо Штаттарында талкууланат. Окуу куралынын авторлору 1920-жылы либерализмге жана атеизмге каршы өз ишин дайыма калыстык менен УЁЛТУРУЛГЭн кыймылга мүнөздөмө берген англис сөзү."},{"t":"p","h":"үргүзө; бул тема боюнча да бейтарап болот. Анткени мунун жактоочулары көбүнчө бүтүндөй н Фундаментализмдин саясий да, диний да максаттары позицияны карманат. Ошондуктан мында коомдун жашоо негиздерин өзгөртүүгө умтулат. силер каралат деп күткөн маселелердин Христианчылыктын кайсы бир булактары гана эң туура, баары эле талкууга алына бербейт. ошондуктан аларды турмуштагы бардык маселелерге Атүгүл өзүңөрдү кызыктырган көп колдонууга болот деп эсептеген адамдарды суроолорго канааттандырарлык жооп “фундаменталисттер” деп аташат. Бүгүнкү күндө албай калышыңар да ыктымал, себеби христианчылыктын эле эмес, башка бардык диндердин же учурларда так кейн жоопту берүү да эзелки ченемдерин жактаган адамдарды ушул сөз менен атап жүрүшөт. Фундаменталисттерди кээде мүмкүн болбойт. аша чапкан катуу чараларды жактайт дешет. Бирок"},{"t":"p","h":"Өзүңөрдү “бүткүл дүйнө жараны” фундаменталисттер өз максаттарына жетишүү үчүн өтө деп эсептее дегеле оюңарга келбеген сейрек учурларда гана террор жасашат."},{"t":"p","h":"чыгаар, анткени азыр өз өлкөңөрдүн жараны болууну окуп үйрөнүп жатасыңар. Бул баптын максаты – бүткүл адамзат баш катырып жаткан татаал маселелерди билип алышынарга көмөктөшүү. Мындагы биринчи кадам түшүнүүдөн башталат. Глобалдуу жарандыктүшүнүгүнөтак аныктама берүү кыйын. Жөнөкөйлөтүп айтканда, бул, ким экендигине карабай, ар бир адамдын иш-аракети өзүнүн мекендештерине эле эмес, башка бардык мамлекеттердин да калкына таасир тийгизет деген ойду билдирет. Ошентип, кайсы улутка, динге же башка топко киргендигине карабай, дүйнөдөгү бардык адамдар өз жериндеги, өлкөсүндөгү жана жер шарындагы маселелерге кандай тиешеси бар экендигин ойлой жүрүшү зарыл. Эмесе глобалдашуу (дүйнөлөшүү) деген эмне экендигин жана ал башка түшүнүктөр менен кандайча байланышкандыгын карап көрөлү."},{"t":"p","h":"<span class=\"pg\" data-n=\"111\">111<\/span>анг чазлелетити авштарууко катышуу – ХХ] пызыядын Жаранды"},{"t":"h2","h":"Глобалдашуу Бул сөздүн аныктамаларынын бири мындай: “Бир нерсенин глобалдуу, б.а. дүйнөлүк масштабда"},{"t":"p","h":"жасалышы же керектелиши”. Глобалдашуу товарлардын, адамдардын жана идеялардын бир маланияттан, өлкөдөн бөлөк маданиятка, өлкөгө арзан жана тез эт үп турушуна өбөлгө түзүүчү жаңы техноло! иялардын өнүгүүсүнүн натыйжасы болуп саналат. {Эки жүз жыл илгери Борбордук Азиядан жиберилген кат, мисалы, Канадага бир нече ай өткөндө аран жетиши мүмкүн эле. Азыр ‚лектрондук катты дүйнөнүн каалагандай алыс жерине көз ачып жумганча, дээрлик бекер жеткирүүгө болот). І лобалдашуу маселелери жалпысынан азыркы экономикада жана мадавиятта жаткан структуралык өзгөрүүлөргө байланыштуу Товарлардын, идеялардын ж.б. оңой таратылып жатышы көп жагынан пайдалуу болгону менен, бул көрүнүштүн терс таасири да бар. Мисалы, бай өлкөлөрдөгү баңгизаттарды мыйзамсыз колдонууга болгон муктаждыктан улам Борбордук Азия өлкөлөрү баңги соодасына тартыла баштады. Буга байланыштуу бул өлкөлөрдө кылмыштуулук, баңгилик күч алып, коркунучтуу борулар, мисалы, СПИД жана КИВ (кишинин иммундефицит вирусу, орусча – ВИЧ) маселелери курчун баратат"},{"t":"p","h":"Глобалдуу экономика – бул дүйнөдөгү бардык өлкөлөрдүн эл чарбасынын өз ара тыгыз байланыштуулугу жана алардын ортосунда жүрүп жаткан соода чөйрөсү. Бул тунгунукке негизги идея товарларды импорт салыгынан бошоткон “эркин соода” туюнтат. “Эркин сооданы” жактагандар арзан продукция өндүргөн же өзгөчө байлыктары бар олкелерлен башкаларга караганда арзан баада товар өндүрүп сатышына жол ачуу керек дешет, Башкача айтканда, арзан иштеп, аз чыгым менен жашоо мүмкүнчүлүгү бар кедей өлкөлөр үчүн “эркин соода” пайдалуу болот деп эсептешет. Андыктан мындай өлкөлөр арзан товар өндүрө алгандыктан, байыраак өлкөлөргө экспорт жасоого (товар алып чыгып сатууга) умтулушу керек. Бул бир жагынан туура, анткени азыркы учурда көп өлкөлөр бажы (таможня) салыгын жогорулатуу аркылуу импортко (сырттан товар алып келүүгө) бөгөт коки жатат. Анын үстүнө эркин соода коррупцияны азайтууга жана бизнес жүргүзүү чыгымдарын жеңилдетүүгө өбөлгө түзөт деген жүйө да көп айтылып жүрөт."},{"t":"p","h":"Бирок бул пикирге каршы чыккандар дагы көп. Алар эркин соода жүргүзүлгөндө бай өлкөлөр көбүрөөк утушка ээ болот дешет. Анткени:"},{"t":"p","h":"1) бай өлкөлөр сапаты төмөн деген шылтоо менен сырттан товар алып келүүгө тыюу салышы мүмкүн;"},{"t":"p","h":"2) бай өлкөлөр кедейирээк өлкөлөргө товарларын көп сатып, чоң киреше табышы мүмкүн"},{"t":"p","h":"(анткени импорт салыгы жок болгондо бул товарлар оной сатылат);"},{"t":"p","h":"3) көбүнчө жеке адамдарга же бай өлкөлөргө таандык болгон эң ири компаниялардын продукциялары “масштаб эффектине!” ылайык аз чыгым менен өндүрүлөт. Бул болсо ошондой эле продукцияны бир аз кымбат баада өндүргөн жергиликтүү чакан компаниялардын банкрот болушуна алып келет. Ошентип, эң ири компаниялардын конкуренттери азаят да, алар өз товарларын мурдагыдан кымбатыраак сатууга мүмкүнчүлүк алышат."},{"t":"p","h":"Буга кошумча, кедейирээк өлкөлөрдүн негизги кирешеси импорт салыгынан түшүп жаткандыктан, эркин соодага өткөндөн кийин алар бул кирешеден кол жууп калат деген пикир да айтылып жүрөт. Мындай көз карашты жактагандар жергиликтүү өнөр жайды импортко салык салуу аркылуу коргоо керек деп эсептешет."},{"t":"p","h":"Азыркы мезгилде Дүйнөлүк соода уюму (ДСУ, орусча – ВТО, буга биздин өлкө да мүчө болуп кирген) эркин соодага колдоо көрсөтүп, ошол эле учурда ар кайсы өлкөлөрдүн өз өнөр жайларын коргоосуна жол коюу менен мунун терс таасирин азайтууга аракеттенүүдө. Бул максатта көрүлүп жаткан чаралардын жетиштүү же жетишсиз экендиги жөнүндөгү маселе азырынча так чечиле элек. Жумуш табылышына жана товарлардын наркына келгенде мындай маселелер биздин жашообузга түздөн-түз таасир тийгизээри түшүнүктүү."},{"t":"p","h":"Мында товарлар менен идеялардын эркин алмашылып жатышы кайсы бир топ өлкөлөрдүн же жеке өлкөнүн маданиятынын жергиликтүү маданиятка терс таасир тийгизишине себеп болбойбу деген суроо да келип чыгат. Көп адамдар муну жактырбайт, анткени үстөмдүк кылуучу маданият жергиликтүү маданиятты бүлгүнгө учуратат деп эсептешет. Ар түрдүү уюмдар тактаган маалыматтарга ылайык, дүйнөдөгү тилдердин көбү азыр англис, орус жана башка зор тилдердин үстөмдүгүнөн улам жоюлуп кетүү коркунучуна кабылууда. Мунун негизги себептеринин бири – англис тили басымдуулук кылган массалык маалымат каражаттарынын, айрыкча телекөрсөтүүнүн, ошондой эле Интернет менен музыканын глобалдашуусу. Глобалдашуунун бардык жагынан тийгизген таасиринен улам ушундай болуп жатабы же \"Масштаб эффекти – товар өндүрүүнүн көлөмү өскөндө ошол продукциянын ар бир даанасынын өздүк наркы дегенди билдирет."},{"t":"p","h":"ь <span class=\"pg\" data-n=\"112\">112<\/span>ыы"},{"t":"p","h":"башкачабы – бул азырынча талаш маселе бойдон калууда,"},{"t":"p","h":"Мындан да катуу талашты туудурган дагы бир маселе бар: биз маданий көрүнүштөрдүн кайсыларынын жоюлуп кетишине жол койсок болот? Жергиликтүү маданияттагы баалуу нерселерди сактап калуу үчүн кандай чараларды көрүү зарыл? Демократия жолунда өнүгүп, жакшы башкарылуучу экономиканы куруп жаткан өлкөлөр өз маданиятынын өзгөчүлүгүн сактап, өнүктүрүп кете ала тургандыгы түшүнүктүү. Ошол эле учурда мындай мамлекет башка өлкөлөр менен карым-катыш түзө алат. Бирок өзүнчө турган маданияттын алкагында деле чукул өзгөрүүлөр жүрүшү мүмкүн, айрым адамдар буга деле каршылык кыла берет. Мындай өзгөрүүлөр көбүнчө муундар алмашканда болот. Мисалы, Советтер Союзу кулагандан кийинки муундун өкүлдөрү эсептелген силер туш келип жаткан укмуштай өзгөрүүлөрдү көп өлкөлөрдүн калкы эч качан баштан өткөргөн эмес."},{"t":"p","h":"Сырткы жана ички таасирлердин күчү менен ушундай зор жаңылануу жүрүп жаткан мезгилде коомдун тандоо эркиндигин сактоо, ошол эле учурда ар бир инсандын ыктыярын сыйлоо абдан кыйың, атүгүл кэзде мүмкүн да эмес."},{"t":"p","h":"2.0 Динжанаглобалдашуу"},{"t":"p","h":"Бул маселелердин чиелене байланышкандыгы дин жана диний каадалардагы өзгөрүүлөрдөн да байкалат. Анткени бул көбүнчө бир маданият менен дагы башка бир маданияттын кагылышуусу аркылуу болот. Көп адамдар маданият менен динди ажырагыс биримдикте кабылдашат, ошондуктан диндин эле эмес, диний үрп-адаттардын өзгөрүлүшүн да алар маданияттан четтөө деп түшүнүшөт. Бирок башкалар дин тутунуу жана тандоо эркиндиги – ар кимдин өз иши деп эсептейт. Бул маселе ар түрдүү коомдордо дагы узак мезгилге чейин талаш бойдон кала берери анык."},{"t":"p","h":"3.0 Глобалдашуу жана миграция"},{"t":"p","h":"Глобалдашуунун натыйжасында транспорт кара-"},{"t":"v","l":["жаттары өркүндөтүлүп, адамдар бир өлкөдөн башка","Бүгүнкү кулчулук","Москванын","ички","иштер"]},{"t":"p","h":"башкарөлкөгө улам барган сайын оңой көчүүгө мүмкүнчүлүк малыгынын кызматкерлери жакында кыргызстандык төрт келинди мыйзамсыз алат. Адамдардын орун которуп жүрүшүнүн көптөгөн камактан куткарды. Аларды азык-түлүк себептери бар. Алар көбүнчө чоңураак эмгек акы алуу дүкөндөрүнүн биринин кампасынан жана’же жакшыраак жашоо үчүн башка жактарга табышкан. Аялдарды абдан булганыч барат. Мунун натыйжасында Улуу Британия сыяктуу жумуштарды аткарууга – товарларды өлкөлөрдүн калкынын кыйла зор бөлүгүн бөтөн түшүрүүгө жана имаратты жууп {тазалоого жерликтер түзүп калат. Келгиндердин маданий таасири мажбурлап жүрүшкөн. Соңку мезгилде ушунчалык күчтүү болгондуктан, бүгүнкү британ аларга акча да төлөбөй, дүкөндөн чыгарбай калышкан экен. Алардын маданиятын аларсыз элестетүү мүмкүн эмес. Мисалы, жаткан-турган жери да кампа болгон, адегенде Индияда пайда болгон чай ичүү каадасы же Кыргызстандык бул аялдарды маал-маалы тамакка “кари” кошуу салты азыр британиялыктарга менен уруп-сабап турушкан. Иш жүзүндө мүнөздүү болуп калды. кунге айланып калган аялдар эки жылдан"},{"t":"p","h":"Борбордук Азияда да ушуга окшош жагдай ашуун убакыт бою камакта болгон. түзүлдү. Мисалы, көптөгөн адамдар Кыргызстандан (Бишкек, 15-июль. “Кабар” агенттиги) Россияга жана Казакстанга кетип жатат."},{"t":"p","h":"Миграциялык агым көбүнчө “күтүп алуучу”"},{"t":"p","h":"олколерге пайдалуу болот, анткени келгиндер өлкө маданиятынын көп түрдүүлүгүн арттырат, жумушчу күчтүн жетишсиздигин толуктайт, ошондой эле кээде ал өлкөлөрдүн капиталын байытат. Бирок жаңы мигранттар кайсы бир деңгээлде кыйынчылыктарды да жаратат. Мисалы, алардын туткан дини, сүйлөгөн тили жергиликтүү калктын маданиятынан, тилинен абдан айырмаланып, атүгүл карама-каршы келип калышы ыктымал. Алар бөтөн мамлекеттеги башкаруу, тартип ж.б. системаларын билбегендиктен көп убарачылыктарга туш болушат. Келгиндер менен жергиликтүү адамдар бири-бири жөнүндө жаңылыш, пикирде жүргөндүгү да жагдайды оорлотот. Айрыкча жумуш орундарын тартып алып жатат деп мигранттарды жек көргөндөр болот. (Бирок бүтүндөй экономикалык масштабда алар жумуш орундарын ээлегенге караганда көбүрөөк жаратаары анык)."},{"t":"p","h":"Адамдардын оңой көчүп жүрүшүнүн бир жаман жагы киши сатууга байланышкан. Мисалы, бүгүнкү күндө Борбордук Азиядан жакшы жумушка орноштурам деп алдап же уурдап барып, эркектерди кулчулукка, кыздарды сойкулукка сатып жибергендер көбөйдү."},{"t":"p","h":"<span class=\"pg\" data-n=\"113\">113<\/span>вамаспапипи вашпарууше патышуу – ХХ1 тылыздын Жарандын тоозунцааы роз; д 4 – Цуйнелук масштабда айлана чөйрөнү коргоо п ем"},{"t":"v","l":[")","Бизди курчап турган дүйнө табигый","отун жагуудан (мисалы,","жана бевзинци ашыкча иштетүүдлйөн!,"]},{"t":"p","h":"чөйрөдөн жана адам баласы жараткан нерселерлен хетишинен улам дүйнөдө климат жылууланый"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>ат. Эч ким булганыч, балит жерде жашоону бара<\/td><td>дыгын<\/td><td>жүрүшөт. Мунун Ё<\/td><\/tr><tr><td>каалабайт, сасык түтүнгө толгон аба менен дем ү Ж<\/td><td>мөнгүлөр эрип, деңиздердин деңгээли<\/td><\/tr><tr><td>алгысы, ууланган сууну ичкиси келбейт. Бирок<\/td><td>Жа<\/td><td>12<\/td><\/tr><tr><td>миллиондогон адамдар аргасыздан ушундай уе ы<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"абалда күп өткөрүп кешл. р мезги Өш "},{"t":"p","h":"Адамзаттын иш-аракеттери жана табигый Гималай, Альп, Аня жана Тяншань кубулуштар Чернобыль авариясындай же Тынч кыркаларынын да кэк мелжиген чокулары аппак океандын түндүгүндө болгон цунамидей эбегейсиз хоидорунан айрылып калат деп эскертиптир. зор зыян алып келиши мүмкүн. Кэзде булардын!"},{"t":"p","h":"терс таасири көчөдө шыпырылбай калып чириген таштанды сыяктуу анча чоң эмес болушу да берсе к: з; ыы; ки оз н"},{"t":"v","l":["кесепетинен","мёңгүлэрү жаңыдан агы ду эсин","чоң","ыктымал. Бирок ушундай майда-барат маселелерда ","топтолуп, акыры айлана чөйрөгө, алам жашоосуна ","ум)","Мын","ж","чыгаргандар"]},{"t":"p","h":"олуттуу коркунуч туудурушу мүмкүн. да кеп. Бирок улам татаалдашып бараткан Соңку отуз жылдын ичинде гана дүйнөнүн "},{"t":"v","l":["айлана чейре","ух бурбай","жашагандардын жаккэн сту коюу жарабайт. Алс Борбо ч. окезндын к Азияда","олуттуу көңүл бура баштады. Адам баласынын ей"]},{"t":"p","h":"туураэмес иш-аракеттеринин натыйжасында пайда калышына. были"},{"t":"v","l":["* йер","? ЫК","33. Мындай"]},{"t":"p","h":"болгон булганууларды жана бузуп-жарууларды кырсыкка Женевада машинасын айдап бараткан табият дайым эле кечире бербей тургандыгын эми түшүнгөндөр көбөйүүдө. Биз айлана чөйрөнү байлык катары эмес, сакталышы учун өзүбүз аёосуз бузуп пайдалана берсе боло турган бекер кам көрүп, жашап жүргөн үйүбүздөй билишибиз аплионер да таасир тийгизиши мүмкүн."},{"t":"p","h":"Борбордук Азиядагы айлана Чөйрөнү"},{"t":"p","h":"Жаратылыш байлыктарын ете ач чейреге зыян көздүк менен пайдалануу, баары жокту булгап тийгизе тургандыгы белгилүү. Республика уулантуучу же желим баштыктар сыяктуу бат кез карандысыздыкка жетишкенге чейин чириндиге айланбай турган нерселерди таштай мында уран кени иштетилип, 2 ылн. тоннага берип адамдар өздөрү жашаган айлана чөйрөнү жакын зыяндуу калдыктар бул шаардын 2 З „ теп эл бузат. Мисалы, токойлор бүт бойдон кыйылып, чегинде 23 аңга жана 13 чуңкурга эптеп эле көмүп коюлган экен, Адистер берген баага ордуна жаңыдан дарактар, бадалдар өстүрүлбөй ылайык, көп кайталануучу жер көчкүлөр, жер жаткандыктан, кыртыш жаан-чачынга жуулуп титиреелер Майлысуудагы уран калдыктарын кетип, акыр аягында жер көчкүлөр көбөйүүдө. Ал дайрага сүрүп түшүрүп, бүтүндөй Борбордук эми Индиянын Бхопала шаарындагы аккумулятор Азияны радиоактивдүү заттар каптап кетиши жасоочу заводдо уу газ чыгып кеткенде, миңдеген мүмкүн, Бул абдан татаал маселе, анткени адамдар жана айбанаттар кырылып калган эле."},{"t":"v","l":["Айлана чөйрө","сыз өзгөрүлүп тура","уу калдыктарды зыянсыздандырууга өкмөттүн","табигый чейрэсун жакырланткан мындан да күчү жетпей жатат.Борбордук Азиянын"]},{"t":"p","h":"Буга биздин жакшы-жаман бардык иштерибиз да зор алаамат – бул Арал деңизинин соолуп кыйла зор таасир тийгизет. Жаратылыш дайыма баратышы. Совет доорунда пахтаны улам коргоого муктаж. Андыктан биз ар бирибиз жана көбүрөөк өндүрөбүз деп, кылымдар бою ээн бүтүндөй коомубуз, өлкөбүз менен айлана чөйрөгө жаткан челдерге Амударья менен Сырдарыяны кандай таасир тийгизип жаткандыгыбызды бурганда, деңизге илгеркидей суу жетпей калды. Ырас, сууну ошол аймактын бат ойлошубуз керек. Табиятка орду толгус зыян көбөйгөн калкы пайдаланды. Бирок деңиздин келтирүүнү токтотпосок, өзүбүз азабын тартып, тартылып кетиши орду толгус жоготууларга келечек муундардын да убалына калаарыбыз анык. себепчи болду. Табигый теңдештикти Ач көздүктөн, ээнбаштыктан жаралуучу алаамат калыбына келтирүү чөлдөрдү сугат аянттарына кырсыктардан мамлекеттик чегаралар же ээлеген айлантуудан да кыйын. Адамдарга суу керек, жерибизди курчайсалынган бийиккоргондорменен пахта өндүрүүнү дыйкандар өздөрү азайтат сактана албайбыз. Экологиялык маселелердин 7°\" ҮМҮТтөнүүгө да болбойт..."},{"t":"raw","h":"<div class=\"gloss\"><p> К рр» туе уз ы и с \"УУЗ!<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"114\">114<\/span>Тловплйуу васелелер Бана дүйнө Жараны "},{"t":"p","h":"мындайезгечелугу (чега- Адамдар бириге алат – Семипалатинск жана Невада чечилишин кыйындатат, расыздыгы) алардын мүмкүн эмес деп ойлошуңар да ыктымал. Чындыгында бул адамзаттын Табиятты коргоо үчүн жалпы улуттук денгээлде эч нерсе кылуу анткени тийиштүү колунан келе турган иш. 1989-жылы казак акыны Олжас Сулейменов чараларды көрүү үчүн Семипалатинскидеги ядролук сыноолорду токтотууну көздөгөн улуттук бир нече мамлекет КЫймылга жол баштады. Анткени бүгүнкү ку Йй у нкү күнгө чейин ушул сыноол у ушу. элордун натыйжасында радиоактивдик заттар адамдардын ден соолугуна зыян мш тийгизип келет. О. Сулейменов баштаган кыймылды миллиондогон жүргүзүшү керек болот. кишилер колдоп, өкмөттү ядролук сыноолорду токтотууга жана бул Демек ар ким Өзүнүн аймактагы айлана чөйрөнү тазартууга көндүрдү. Бул кыймылга жеке жоопкерчилигин АКШнын Невада штатынын тургундары да катышты, анткени космодром сезе билүүгө тийиш, ал аймакта дагы ушундай оор маселе бар эле."},{"t":"p","h":"5.0 Зордук менен жүргүзүлгөн өзгөртүүлөр"},{"t":"p","h":"Бул бөлүмдө биз саясий реформаларды жүргүзүү үчүн мыйзамсыз ыкмаларды (демократиялык ченемдерди жокко чыгаруучу) колдонууга байланышкан маселелерди караштырабыз. Мунун эң көл кезигүүчү түрү – экстремизм, б.а. “саясий максаттарга жетүү үчүн коомдун социалдык жана саясий ченемдерине каршы келген каалагандай ыкмаларды колдонуу”. Экстремизмге көптөгөн усулдар кирет, алардын айрымдары мыйзамдуу жана агрессиясыз жасалышы мүмкүн, бирок элди террорго үндөгөн ыкмалары да көп."},{"t":"p","h":"5.1 Терроризм. Бул эмне?"},{"t":"p","h":"“Террор” сөзүн англисчеден которгондо “катуу коркуу, үрөйү учуу” дегенди билдирет. Чындыгында эле мындай иш-аракет адамды абдан басынткан коркунуч менен коштолот. Сөздүктөрдүн биринде терроризмге мындай аныктама берилген: “Коомчулукту же өкмөттү көбүнчө өздөрүнүн саясий, идеологиялык максаттарына туура келген талаптарын аткарууга мажбурлоо үчүн жеке адамдын же уюшулган топтун мыйзамсыз күч колдонушу, опузалап коркутуусу”."},{"t":"p","h":"Тилекке каршы, көптөгөн “расмий” аныктамалар берилип жүргөнүнө карабай (алардын ичинде жогорудагы да бар), бул түшүнүктү кыскача так чечмелеп берүү мүмкүн эмес. Анткени терроризмдин бир дагы аныктамага туура келбеген түрлөрү болот. (Бириккен Улуттар Уюму да бул сөзгө аныктама берген эмес). Ошондуктан кимди террорист, кандай иш-аракетти терроризм деп атоого келгенде ар кимдин пикири көбүнчө ар башкача болуп чыгат. Төмөндөгүдөй түшүнүктөрдү колдонгондо бул ого бетер татаалдашат:"},{"t":"p","h":"1 Кибертерроризм (башка адамдардын же уюмдардын компьютерлерин бузуу же маалыматтарын жок кылуу жолу менен экономикага зыян келтирүү максатында компьютерди колдонуу)."},{"t":"p","h":"2. Наркотерроризм(бангизаттарды, мисалы, героинди өндүрүүдөн же сатуудан түшкөн кирешенин террористтик иштерге жумшалышы)."},{"t":"h3","h":"СИЛЕРДИН СУРООЛОР"},{"t":"p","h":"Терроризм жаңы көрүнүшпү?"},{"t":"p","h":"Жок. Б.з 1-кылымында Палестинада сикарийлер деп аталган уюм болгон. Анын мүчөлөрү Римдин үстөмдүгүнө каршы күрөш жүргүзүп, римдиктерди жана аларга көмөктөштү деп күнөөлөнгөн лалестиндерди өлтүрүп жок кылып турган. Жетинчи кылымда Индияда “Муунтуучулар” сектасына киргендер адамдарды муунтуп өлтүрүү менен курмандыкка чалып жүрүшкөн. Он биринчи кылымда Жакынкы Чыгыштагы мусулмандардын исмаилиттер агымынан бөлүнүп чыккан шийит сектасы террордук аракеттерди жасагандыгы үчүн “Ассасиндер” деп аталып калган."},{"t":"p","h":"“Терроризм” сөзү алгач ирет 1793-1794-жылдары Францияда террор өкүм сүрүп турган мезгилде колдонулган. Адегенде “чыккынчыларды” текши жок кылууга умтулган террористтердин лидерлери өздөрүнүн мындай жоругун эркиндикти коргоонун эң мыкты жолу деп макташкан. Бирок революция жеңилип калгандан кийин террористтер өздөрү өлүм жазасына тартылып, бул сез бат эле мамлекеттик зордук-зомбулукту атоо үчүн колдонула баштады."},{"t":"p","h":"Он тогузунчу кылымда биздин мезгилдеги терроризмдин формаларын Россияда падышага каршы чыккан “Народная воля” (“Эл эрки”) сыяктуу уюмдар колдонушкан. Австриянын эрцгерцогу Франс Фердинанддын өлтүрүлүшү атүгүл Биринчи дүйнөлүк согуштун башталышына түрткү болгон. Терроризмдин бизге кыйла тааныш, көбүнчө видеокамерага тартылып алынуучу түрү биринчи жолу Палестинаны боштондукка чыгарууну көздөгөн Элдик фронт 1968-жылы жүргүнчүлөр түшкөн самолётту барымтага алганда пайда болду."},{"t":"raw","h":"<div class=\"gloss\"><p>Е<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"115\">115<\/span>—“Жаранйып Жана жазлепетти вашпарууга потышуу"},{"t":"p","h":"Экотерроризм (табиятка жана айлана чайрэге карата өкмөттүн же кайсы бир уюмдун саясатын өзгөртүү үчүн адамдардын террор жасашы), Мамлекет каржылаган терроризм (башка өлкөлөрдүн жарандарына же уюмдарына каршы террористтик иштерди жасатуу үчүн өкмөттүн айрым адамдарга же топторго финансы бөлүшү)."},{"t":"v","l":["Терроризмдин булардан башка да түрлөрү бар","","Терроризмге байланышкан негизги түшүнүктөр"]},{"t":"p","h":"&gt; Бардык жарандар катышкан демократиялык шайлоолор – бул бийликке кайсы топ же айрым адамдар келиши керек деген маселе боюнча конфликтти күч колдонбой чечүү жолу. Ал эми терроризм ошол эле талашты зордук менен чечүүнү көздөйт да, адамдар буга мажбурлоо жолу менен катыштырылат. Терроризм женсе, залим бийлик орношу көбүрөөк ыктымал."},{"t":"p","h":"Сырттан каржыланып, оңой таралгандыктан, терроризм глобалдуу маселе болуп саналат. Терроризм адатта карапайым адамдарга коркунуч алып келип, кобуиче аларды жашоо укугунан ажыратат."},{"t":"p","h":"Террористтер өздөрүнө тоскоол болгон адеп-ахлак ченемдерине каршы чыгышып, муну ар түрдүү шылтоолор, “бийик максаттар” же “ыйман” деген сөздөр менен актоого аракеттенишет. Террористтер көбүнчө элдин көңүлүн буруу үчүн террордук кадамдарды жасашат, андыктан өз иш-аракеттерин алдын ала пландап коюшат."},{"t":"p","h":"Саясий максаттарды көздөгөн террористтер өздөрү каалаган өзгөртүүлөрдү азыр же келечекте жасоого иштеп жаткан саясий түзүмдөр мүмкүндүк бербейт деп эсептешет."},{"t":"p","h":"Өлкөнүн мыйзамдарына жана эларалык укук ченемдерине, конвенцияларга туура келбегендиктен, террористтик иш-аракеттер дайыма мыйзамсыз деп эсептелет, Террористтер элдин колдоосуна ээ болбосо деле көбүнчө эл бизди колдойт же макул болгон деп жарыялашат."},{"t":"p","h":"Террористтер орнотууну сунуш кылган саясий система көпчүлүк учурларда бийликти монополдоштуруп алууга жана көпчүлүктү башкаруудан четтетүүгө умтулган экстремисттик саясат болот."},{"t":"p","h":"Эгер террористтер саясий бийликти басып алса, анда алардын каршылаштары да ушундай эле жол менен бийликти тартып алууга болот экен деп ойлоп калат... Ошентип, зордукчул иш-аракеттер улана берет."},{"t":"p","h":"Террористтер өздөрүн өтө сейрек учурларда гана террорист деп атайт, тескерисинче “эркиндик учун курешуучулербуз”, “кудайга кызмат кылуучуларбыз” ж.б. деп эсептешет. (1993-жылы АКШнын Техас шаарында Дэвид Кореш өзү кошулган сектанын бардык мүчөлөрү отурган имаратты өрттөп жибергенде, Кудайдын буйругун аткардым деп ойлогон)."},{"t":"p","h":"Мыйзамга каршы келсе да, күч колдонбогон иш-аракеттер терроризм болбойт. Мисалы, эгер бир топ жарандар күч колдонбой, тынч жүрүшкө чыкса, атүгүл өкмэт муну мыйзамсыз деп жарыяласа деле, бул терроризмге кирбейт. Анткени каршы пикирлерин туюнтуу менен, демонстранттар адамдын негизги укуктарына коркунуч келтирбейт. Тескерисинче, саясий максатта жасалуучу зордуктун бардык эле түрлөрү терроризм деп эсептелбейт. Терроризмдин аныктамасы саясатка ушунчалык аралашып кеткендиктен, бул тууралуу дайым талаш-тартыштар болот."},{"t":"p","h":"Саясий жаңжалдардын алдын алууга сүйлөшүүлөр жана арачылык да жардам берет. Көптөгөн топторду зордук-зомбулук жолунан баш тартууга жана сүйлөшүүлөр аркылуу процесске катышууга көндүрүү мүмкүн. Мисалы, Түндүк Ирландиядагы “Шин Фейн” партиясы опурталдуу кадамдан ушундайча баш тарткан эле."},{"t":"p","h":"Глобалдуу маселелер жана мен Глобалдуу маселелер абдан көп. Бизге өз айылыбыздын же өлкөбүздүн эле маселелери тиешелүү болот десек катуу жаңылышабыз. Глобалдуу маселелерден чегараларды тосуу же тышкы дүйнө менен катышпай коюу аркылуу кутула албайбыз. Биз көп нерселерди билип, аң сезимдүү жарандар катары мындай маселелерди чечүү жолдорун табууда жана алгылыктуу ыкмаларды иштеп чыгууда өкмөткө көмөк көрсөтүшүбүз керек."},{"t":"raw","h":"<div class=\"gloss\"><p>6.0<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"116\">116<\/span>алд)"},{"t":"h3","h":"СИЛЕРДИН СУРООЛОР"},{"t":"p","h":"Кээ бир диндердин гана өкүлдөрү террорист болобу? 4 ок. Христианчылыкка, буддизмге, исламга жана индуизмге ишенген террористтер бар, изилдей келгенде дегеле бардык диндердин өкүлдөрү кайсы бир мезгилде террорду сөзсүз колдонгон болуп чыгат. Бирок айрым террористтер эч кандай динди тутунбай, таптакыр башка мүдөөлөрдү көздөй тургандыгын билип коюу керек. Мисалы, АКШда “Унабомбер” деген жасалма атка ээ болгон адам жаңы технологияларды жек көргөндүктөн террористтик иш-аракеттерди жасаган. Ал эми Түндүк Кореянын террорист агенттери Түштүк Кореянын президентин өлтүрмөкчү болгондо саясий гана максатты көздөгөн."},{"t":"v","l":["Эгер террористтер мен ишенген динди тутунушса,","менин диним террорго жол койгон болобу?"]},{"t":"p","h":"Бүткүл дүйнөдөгү диний лидерлер терроризмди айыптады. Атүгүл коомдук түзүлүш маселеси боюнча айрым көз караштары террористтердики менен дал келишкен дин өкүлдөрү да муну такыр алгылыксыз кадам деп эсептейт. Бардык эле диндердин ыйык китептеринде зордук-зомбулук эң жаман кунее катары айыпталат."},{"t":"p","h":"Тилекке каршы, каалагандай диндеги адамдар кээде коркунучтуу кылмыштарды жасашат. Бирок биз бир бузуку уурулук кылса, киши өлтүрсө же террор жасаса эле ал үчүн бүтүндөй динди күнөөлөбөшүбүз керек. Терроризмдин негизин динге ишенүүчүлүк түзбөйт."},{"t":"p","h":"Эгер элдин көпчүлүгү террористтин койгон талаптары туура деп эсептесе, терроризм легитимдүү болуп калабы?"},{"t":"p","h":"ч качан терроризм мыйзамдуу деп таанылбашы керек. Анткени;"},{"t":"p","h":"Террористтердин коом түзүлүшү жөнүндөгү пикирлерине көпчүлүк макул болоорун кантип биле алабыз? Террористтер өздөрүнүн көз караштарын эл канчалык колдоорун билүү үчүн референдум өткөрчү беле?"},{"t":"p","h":"2. Коомдогу жашоонун сапаты коомдун кандайча түзүлгөндүгүнө жараша болот. Б.д. “адилеттүү коомду” террор аркылуу куруу мүмкүн эмес."},{"t":"p","h":"Адам укуктарын коргобогон зулум өкмөткө каршы террорду колдонууга болобу? Жок. Себеби, террор колдонгондор:"},{"t":"v","l":["1) мыйзамдуулукка жетишүү мүмкүнчүлүгүн өздөрү жокко чыгарып алышат;","2) өздөрү күнөөлөгөн өкмөт сыяктуу эле адам укуктарын бузушат;","3) башка адамдарды террордук иш-аракеттерге азгырып коёт."]},{"t":"p","h":"Эгер өлкөнүн армиясында кызмат өтөп жаткан адамдар командирдин буйругу боюнча күч колдонсо, аларды террорист деп атоого болобу?"},{"t":"p","h":"Жок, Себеби өлкөнүн куралдуу күчтөрү демейде башка армияга каршы согушат да, өз өкмөтүнүн буйругун аткаргандыгы үчүн алардын иш-аракети кайсы бир деңгээлде мыйзамдуу эсептелет."},{"t":"p","h":"Терроризмди жалаң гана чет өлкөлүктөр башка мамлекеттердин жарандарына каршы колдонобу?"},{"t":"p","h":"Жок. Мисалы, Американын жараны Тимоти Маквей 1995-жылы Оклахома-Ситиде Федералдык администрациянын имаратын жардырып, 168 кишинин өлүмүнө себепчи болгон. Түндүк Ирландияда деле ез өлкөсүнүн жарандарын кырган террористтик кылмыштарды жасашат."},{"t":"p","h":"Терроризмди болтурбай коюу үчүн эмне кылуу керек?"},{"t":"p","h":"Өкмөттөр жана эларалык агенттиктер маалымат алмашып, көбүнчө кармалган террористтерди сот жообуна тартуу үчүн өз өлкөлөрүнө өткөрүп беришет. Алар террористтерди кармоо же каржылоо булактарын жоюу максатында бири-бирине каражат, жабдуу жагынан жардам берип, терин биргелешкен операцияларга катыштырса болот. Көбүнчө террористтер кылмыш жолу менен, мисалы, баңгизат сатуу аркылуу алынган акчаларды пайдаланат. Бирок кээде террордук иш-аракеттерди екмет же менчик фонддор да каржылаган учурлар болот.Жарандар катары ар бирибиз терроризмди өзгөртүүлөрдү жүргүзүү үчүн колдонууга болбой турган жол катары билишибиз, башкаларга да мунун кесепеттери жөнүндө айта жүрүшүбүз керек. Ошондой эле жарандар биздин коомдо юридикалык жана демократиялык ченемдердин сакталышы жана кайсы улуттан болгондугуна, кайсы динге ишенгенине, аял же эркек экендигине карабай, бардык адамдардын укуктарынын корголушу үчүн бекем талап коё жүрсө болот."},{"t":"p","h":"Террористтер өз укуктарын коргоону көздөгөн кедейлер эмеспи?"},{"t":"p","h":"Алар негизинен кедей жашагандарга кирбейт. Мисалы, эң ири террорист катары таанылган Усама Бен Ладен абдан бай үйбүлөдө туулуп өскөн. Бирок кээде террористтер өз максаттарына үчүн жакыр адамдардын колдоосуна ээ болууга умтулушат."},{"t":"h3","h":"2003-җылдый 8-майында Ошто акча алмашуу жайларынын биринде бомба жарылды. Анын"},{"t":"p","h":"натыйҗасында ошол жерде иштеген кызматкер курман болду. Жардырууну эларалык бүлгүнчү уюмдун мүчөлөрү даярдап ишке ашырган эле. Коопсуздук күчтөрүнүн билдиргенине караганда, булар дагы бир жардырууну 9-майда – Жеңиш күнү Бишкекте өткөрмөкчү болгон. Террористтердин ою ордунан чыкканда, Айни көчөсүндөгү 68 квартиралуу чоң үй кыйрап калмак экен."},{"t":"raw","h":"<div class=\"gloss\"><p><\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"117\">117<\/span>Жарандын Жана зазлепетти вашпарууза патышуу ХХ] пылытдын жоранцым оозундагы сизердин ролумар"},{"t":"h3","h":"&lt;&gt; Текстти окугандан кийинки көнүгүүлөр"},{"t":"p","h":"02-тапшырма. Менин олкомдогу глобалдашуу – 20 мун."},{"t":"p","h":"Эки-экиден иштеп,өлкөңөрдөсонку силердин оюңарча: 1) уйбуленердун же коомунардын жашюосунуи жакшырышына өбөлгө түзгөн беш түшүнүктү же продукциянын түрүн;"},{"t":"p","h":"2) жашооңордун начарлашына себеп болгон (балким, жергиликтүү маданиятка терс таасир тийгизгендиктен ушундай деп ойлоорсуңар) беш түшүнүктү тизмелегиле. Силер айрым түшүнүктөр же продукция түрлөрү жашоону кайсы бир жагынан жакшыртып, ошол эле учурда башка жагынан начарлатып жаткандыгын байкашыңар да мүмкүн. (Төмөндө мисалдар келтирилди)."},{"t":"v","l":["По 1 жт жө түшүнүк.","46","Жайкысын минип","Кондиционери бар","“Тойота” машинасы жүргөнгө сонун","2","‚ Запасные бөлүктөрү табылбайт, кы.","‚ бензинди кой керектейт","","-","","т"]},{"t":"p","h":"03-тапшырма. Эң мыктыларын алып, калгандарынан баш тартуу керек – 20 мун."},{"t":"p","h":"Эки-экиден менен Батыш Европадагы өлкөлөрдүн бирине көчүп бардык деп элестеткиле. (Мисалы, Голландияга. Бул чакан, бирок калкынын саны арбын, арасында мусулмандары да көп өлкө Калктын негизги бөлүгү христиандар болгону менен, диний салттарды аткарбагандары, атүгүл динге ишенбегендери деле көп)."},{"t":"p","h":"1. Жаштардын өкүлдөрү катары силер өз маданиятынардын кайсы өзгөчөлүктөрүн сактап калууга аракеттенет элеңер? (Мисалы, эне тилиңерди унутпоого)."},{"t":"p","h":"2. Силердин оюңарча, Голландиянын “батыш” маданиятынын кайсы жактарын жаңы эле көчүп барган жаштар өздөштүрүп алса болот? (Мисалы, чөнтөк телефон колдонууну}."},{"t":"p","h":"3. Чет катары силер өз маданиятынарды сактап калуу үчүн эмне кыла алат элеңер?"},{"t":"h3","h":"ФФ 04-тапшырма. Стереотиптер 15мүн."},{"t":"p","h":"Баарыбызда стереотиптерибиз (үстүрт калыптанып калган көз караштарыбыз) бар. Өтө катуу ишенип албасак эле, мунун эч кандай зыяны болбойт,"},{"t":"p","h":"1. Шеригиңер менен иштеп, америкалыктарга байланышкан стереотиптүү ойлордун тизмесин түзгүлө. Мисалы: “Менимче, бардык америкалыктардын менчик машинасы болсо керек”."},{"t":"p","h":"2. Бул стереотипти эске алганда, силер америкалык бирөө менен кезигип калсаңар, аларга кандай мамиле жасашыңар мүмкүн экендигин ойлонгула."},{"t":"p","h":"3. Эгер ал адам чындыгында силер ойлогондой эмес болуп чыкса, кандай жагдай түзүлөөрүн ойлонуп көргүлө."},{"t":"p","h":"Анан силердин өлкөнүн тургундары жөнүндө америкалыктардын кандай стереотиптери болушу мүмкүн экендигин ойлонгула. Жолуга алсаңар, америкалык адамдан муну сурагыла! Стереотиптериңер жаңылыш болуп чыкса, кандай маселелер пайда болушу ыктымалдыгын ойлонуп көргүлө, Оюңарды таблица түрүнө келтирсеңер да болот:"},{"t":"p","h":"<span class=\"pg\" data-n=\"118\">118<\/span>05-тапшырма. Дуйвелук базар жана мен 15 мун."},{"t":"p","h":"Шеригинер менен глобалдашуунун силердин өлкөдөгү чакан бизнес ишканага тийгизген он жана тер таасирлерин санап көрсөткүлө."},{"t":"p","h":"$$ 06-тапшырма. Сатылуучу эмгек 20 мүн."},{"t":"p","h":"Төмөндө айрым окуучулардын бир суроонун тегерегинде ой жүгүртүүлөрү келтирилди, Буларды эки. экиден болуп талкуулап, өзүңөр эң туура деп эсептеген көз карашты тандагыла. Эгер эч кайсынысы д келбесе, анда өз пикириңерди жазгыла. Оюңарды түшүндүрүп берүүгө даяр болгула."},{"t":"p","h":"“Жумуш издеп же башка себептерден улам чет өлкөгө кетип жаткан адамдар Атажуртун сүйөбү?! Акмат: Менимче, өкмөт адамдардын башка өлкөгө кетишине уруксат бербөөгө тийиш. Өзүбүзд мамлекеттин эсебинен билим берилсе, анан алардын пайдасын бөлөктөр көрө береби? Мекенин таштап кеткендерди патриот дегенге болобу? Алар бала-чакасын багуудан качка арсыздарга окшош."},{"t":"p","h":"Рената: Мен макул эмесмин – биз өкмөттүн балдары эмеспиз да. Эгер адамдар кетип жатышса буга өз жарандары үчүн кам көрүүгө милдеттүү болгон өкмөт жооптуу. Анын үстүнө, чет өлкөгө барып жашагандар үйлөрүнө акча жиберип турушат, мекенине кайтканда жаң кесиптерге ээ болуп келишет."},{"t":"p","h":"Ооба, эгер кайтып келишсе, а келбей коюшсачы? Кетип жаткандарга эгер беш жылда кайтып келбесеңер, жарандыктан кол жууйсуңар деп эскертүү керек. Ошондой эле мен чеп өлкөдө иштеп жаткандарды өз өлкөсүнө киреше салыгын төлөп турууга милдеттендир керек деп эсептейм."},{"t":"p","h":"Минткенде кошмок салык төлөп калышпайбы? Алар зыян тартышат, анткени мыйзам боюнча иштеп тапканынан көбүрөөк салык төлөөгө туура келет. Мен буга каршымын, Биз чет өлкөлөргө барганда башка маданиятты өздөштүрүп, билимибизди өркүндөтүүгө мүмкүнчүлүк алаарыбызды да ойлоого тийишпиз. Менимче, өлкөбүздү чет жактан мыкт адистер келип жашоого кызыккандай кылып өнүктүрүшүбүз керек."},{"t":"p","h":"ы + 01-тапшырма. Мен жашаган жердеги айлана чөйрөнү коргоо 20 мүн. Үч-төрттөн болуп, силердин жердеги айлана чөйрөгө байланышкан маселелердин тизмесин түзгүлө, Аларды чечүү үчүн эмне кылууга болоорун жазгыла. Таштандыларды тазалап коюу менен эле маселен! чечүү мүмкүн эмес экендигин эсиңерге алгыла. Маселе чечүү – бул кайра кайталанбашы үчүн анын пайд; у себебин да адилеттүү жана туура жол менен жоюу."},{"t":"p","h":"айлана чейре. Өте катуу кетип жаткан жокпузбу? Силердин оюңар кандай? Ирландияда екмет желим баштыктарын колдонгондугу үчүн атайын салык киргизди. Эми бул өлкөдөгү адамдар мындай баштыктарды колдонбойт, демек айлана чөйрөнү булгабайт. Сингапурда сагыз чайноого тыюу салынган. Ирландияда болсо сагыз чайнагайдардай салык чогултулуп, түшкөн каражат сагызды жок кылуучулардын айлыгына кошулат! 4 Жаңы Зеландияда коомдук жайларда, алардын ичинен ресторандарда жана коомдук парктарда тамеки чегүү мыйзамсыз иш-аракет деп эсептелет."},{"t":"v","l":["08-ташшырма. Суу- өмүрдүн булагы 20мун.","Шеригинер менен төмөндөгү суроолорго жооп издегиле:","‚ Биздин коомдо суу кандайча пайдаланылат? (Тизме түзгүлө).","Биздин үйбүлөдө бир күндө канча литр суу керектелет?","Бизге суу кайдан келет?","Дарыянын баш жагында кайсы жерлер булганууда?","Жерди кандайча азыктандырганда суу булганат?"]},{"t":"raw","h":"<div class=\"gloss\"><p>РДА, <\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"119\">119<\/span>Жар т Жана малленетти 7 – ХХ] тылыздын Жарандын поозунуа&amp;ы сшлердин родунар"},{"t":"p","h":"6. Сууну булгануудан сактоо учун эмнелерди колдонобуз?"},{"t":"v","l":["7. Сууну булгануудан жана ысырапталуудан коргоо үчүн эмне кылууга болот?","#@ 09-тапшырма, Таканыктамасы жок түшүнүк 15 мүн."]},{"t":"p","h":"Шеригиңер менен терроризмге так аныктама берилбегенине байланышкан кыйынчылыктарды талкуулагыла. Ишиңерди туура багыттоо үчүн бул тууралуу берилген маалыматты дагы бир ирет окуп чыксаңар болот."},{"t":"p","h":"10-тапшырма, Бүл түшүнүккө эмнелер кирбейт? 2 мүн."},{"t":"p","h":"Эмне үчүн күч колдонбой каршылык билдирүү “терроризм” деп эсептелбей тургандыгын шеригиңер менен түшүндүрүп берүүгө даярдангыла. Бул эки башка көрүнүштү чаташтыруунун эмнеси коркунучтуу?"},{"t":"p","h":"* # -тапшырма. Күчкө салып реформа жүргүзүү 10 мун."},{"t":"p","h":"Франциядагы революция учурунда саясий ыкма катары террор көп колдонулган эле. Реформа жүргүзүү учун террор колдонулса, кандай маселелер келип чыгаарын талкуулап, тизме түзгүлө."},{"t":"p","h":"12-тапшырма. Эмне учун биз? 10 мун."},{"t":"p","h":"Кээде коомду күч менен өзгөртүүнү көздөгөн уюмдар зордукчул иштерге жаштарды жалдашат. Силердин оюңарча, эмне үчүн ушундай?"},{"t":"p","h":"111, 13-тапшырма. Глобалдуу жана жергиликтүү маселелерди талдоо 30мүн. Кепучурлардаглобалдуу маселелергетуш келгенде,өзүбүздү алсыз сезип калабыз. Ошентсе даэгеркөпчүлүк бириксе, абдан зор иштерди бүтүрө алат. Ар кандай эле ишти баштоодон мурун кырдаалды талдоого алуу керек. Маселени туура түшүнүү үчүн абдан маанилүү бир нече жалпы суроого жооп берүү зарыл. Топторго бөлүнүп, маселенин чыгышына жараша кайсы суроолорго жооп издешибиз керек экендигин тизмелеп көргүлө. Мисалы:"},{"t":"v","l":["Окуяга кимдер катышкан?","Окуя качан болгон?","","+1 14-тапшырма. Биздин кошуналар 10мун.","Башка өлкөдөн бир уйбуле көчүп келип, силерге контуна болуп калды деп элестеткиле.","1. Силер эн оболу эмнелерге көңүл бурат элеңер?","Ал адамдарга карата силердин кандай стереотиптериңер болушу мүмкүн?","Силердин алар менен мамилеңер кандай шарттарга байланыштуу болмок?","Силердин оюңарча, алар менен байланыш түзүү коомдоштук үчүн зарылбы?"]},{"t":"h3","h":"15-тапшырма. ММКнынглобалдашуусу 10мүн."},{"t":"p","h":"Шеригиңер менен ММКнын глобалдашуусунун жакшы жана жаман жактарын көрсөтүүгө аракеттенгиле."},{"t":"p","h":"1. Чын-төгүнүн текшерүү мүмкүн болбого табууларды билип жүрөсүң."},{"t":"v","l":["2.","3.","","$$ 16-тапшырма. Бул канчалык туура?","карандай калп ушактар таратылышы мүмкүн","(мисалы, Интернет аркылуу).","","3."]},{"t":"p","h":"Бул бапта террор жолу менен курулган коомдо жарандардын жашоосу коркунучка кабылат деп айтылга: Эмне үчүн? Силер буга макулсуңарбы? Өз пикириңерди далилдеп, чакан (300 сөздөн ашпаган) дилба: жазгыла, ыр"},{"t":"raw","h":"<div class=\"gloss\"><p><\/p><\/div>"}],"sub":[],"pages":[110,119]},{"title":"XXI бап. Активдүү жаран болуу","blocks":[{"t":"h2","h":"<span class=\"pg\" data-n=\"120\">120<\/span>XXI бап. Активдүү жаран болуу"},{"t":"h3","h":"Текстти окуганга чейинки көнүгүүлөр"},{"t":"p","h":"01-тапшырма. Ким чечиши керек?"},{"t":"p","h":"Шеригинер менен төмөндө берилген суроолордун тизмесин карап көргүлө. Силердин оюңарча кайсы адам же адамдардын тобу бул маселелердин ар бири боюнча эң жакшы чечим кабыл алышы мүмкүн экениң тандагыла. Силер бир эле конкреттүү адамды же адамдардын тобун канча жолу кааласаңар ошончо ирет тандай аласыңар."},{"t":"v","l":[" 1, Мен түшкү тамакка эмне тандашым керек?","2. Биздин жаны үйдүн чоңдугу кандай болушу","керек?"," 3. Биздин бакка эмне отургузуу керек?"," 4. Мен мектепти качан бүтүп, иштей башташым","","1%. Нандын баасы канча болушу керек?","6. Түшүмдү качан жыйноо керек?"," 7. Саат канчада туруу керек?","‚ 8. Биз кандай китептерди окушубуз керек?"," 9. Дүкөндө эмне сатылышы керек?"," 10. Биздин айылды (шаарды) кандайча көрктөндүрүү"," керек?"," 11. Жаңы жол кайдан өтөрүн ким чечиши керек?","а) Мен","б) Менин досторум жана мен","в) Менин досторум, мен жана менин ата-энем","Р","г) Манин дөбторум, мен, менин үйбүлөм жанд","айылдын (шаардын) башка тургундары","д) Менин ата-энем, бирок мен эмес","е) Менин бүт үйбүлөм","ж) Айыл өкмөтүнүн башчысы","з) Бүткүл айыл кеңеши","Айылдагы (шаардагы) эркектер гана","к) Кеңештин депутаттары","л) Айрым ишкерлер"," 12. Жыйналыштар менен майрамдарды өткөрүү үчүн м) Акимият"," жаңы клубду ким курушу керек?"]},{"t":"h2","h":"Окууүчүн текст"},{"t":"v","l":["Биз бул бапта жарандык иш-аракеттин үч жагын карайбыз:","1. Эмне үчүн жарандык иш-аракеттерге катышуу керек?","2. Жарандык активдүүлүктү кандайча көрсөтө алабыз?","3. Катышуунун түрлөрү.","","1.0 Эмнеүчүнкатышуу керек?"]},{"t":"p","h":"Иш-аракет жашоонун маңызын түзөт. Иш-аракеттин Жеке өзүндүн башыңа түшкөн кайгыны жасалышына бир нерсеге жетүү же бизде жок болгон ЖеНИп өтүү керек болгондо САБЫРДУУЛУК нерсеге луу зар КЫЛЫП, УНЧУКПОО – адамдык улуу сапат, анткени сен үчүн башкалар да азап үчүн адам пассивдүү эмес, активдүү болушу керек. тартпоого тийиш. Бирок жакын адамың"},{"t":"p","h":"Пассивдүүлүк кимдир бирөөгө (же бир нерсеге) шорго батып, эл кыйналып жатканда баш ийүүнү жана жетеленүүнү билдирет. Бул жагынан унчукпай карап туруу – коркоктук алганда, албетте, пассивдүүлүктөн активдүүлүк жакшы. Менен чыккынчылыктын дал өзү. Кырдаалга көз каранды болгондон көрө аны өзүң жөнгө (Кадыр Өмүркулов. “Кылымдын кутман таңы”) салып жүргөнүң оң эмеспи."},{"t":"v","l":["<span class=\"pg\" data-n=\"121\">121<\/span>Активдүү радио. Демилгени коерго алуу","максат” аттуу Бириккен жаштар","Мамажанов менен","1 жата быз"]},{"t":"raw","h":"<h4 class=\"mk\">– Алиши у жай өздөрүнүн жана<\/h4>"},{"t":"p","h":"ектений жатасыздар"},{"t":"p","h":"з байшиз түрдөгү жогорму! {нё кирген студенттер римин укуктары менен пим. бе"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>милдеттерин аныктега<\/td><td>ко коюшу херек.. Виз <\/td><\/tr><tr><td>кызмат к өтүү<\/td><td>кча *<\/td><td>Үй<\/td><td>иштеп<\/td><\/tr><tr><td> Атайын пла<\/td><td>ух кампанияларды <\/td><\/tr><tr><td>{өнөктүктөрдү} е<\/td><td>үк.<\/td><td>ринчисинде студенттерди: <\/td><\/tr><tr><td>ушундай пла!<\/td><td>:<\/td><td>ырдык, ат<\/td><td>эми '<\/td><\/tr><tr><td>кийинкилерин.<\/td><td>8<\/td><td>үлз<\/td><td>21<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"маалымат тараттык. Виз түзгэн үлгүнү Кыргыз касынын Билим берүү мимистрлиги кабы"},{"t":"v","l":["окуу жайлары аны колдонууга тийиш.","Сиздер эмне үчүн бул акцияны өткөрүү зарыл деп чечт","Биздин уюмдун максаты – студенттердин ар түрдүү, ми","укуктарын коргоого, өзгөчө киши соодалоого байланышкан маселелери","Ошондуктан биз Фергана айрыкча Ош, Анжиян, Ферт"]},{"t":"p","h":"студенттердин укуктары боюнча иликтөөлөрдү жүргүздүк. Оку келишимдин шарттарын аткарууда студенттердин укуктары од©"},{"t":"v","l":["акысым","түт үрдэ бузу","аныктадык. Жогорку окуу жайларынын студенттери укуктар меңен","көрсөтүлбөгөн контрактка кол койсо, алардын укуктарын бузуу оной болот „ Умадаи"]},{"t":"p","h":"кээ бир студенттер окууга 17 жашында өтэт, демек, 18 жашка толгондор гана контрактка кол коюу укугуна ээ болгондуктан, 17 жаштагылар кол койгон контрактар жарабай калат Ушундан пайдаланып, студенттин макулдугун сурабай эле мындай контрактарлын пайызынң өзгөртүп коюуга болот. Окутуу акысы жылдан жылга өсүүдө, бирок бул жагдай контрактта эске алынбай жүрөт. Анын үстүнө студенттерден контрактта белгиленгенден башка ва акча чогултуп, алардын айрымдарын окуудан мыйзамсыз түрдө чыгарып салган учурлар кездешет."},{"t":"p","h":"Сиздердин акцияга кимдер катышты?"},{"t":"p","h":"Союздун мүчөлөрү иликтөө жана мониторинг жүргүзүп, коомдук кампанияпарды эткаруп, плакаттарды жасалгалашты. Башка студенттер да, Союздун волонтёрлору да катышты."},{"t":"p","h":"– Башка адамдар буга кандай карады?"},{"t":"p","h":"Адегенде жогорку окуу жайлардын администрациялары бул акцияга катуу каршы тургандыктан, студенттер окуудан чыгып калуудан коркуп жүрүштү. Биринчи жолу өткөрүлгөн иш-чарага 700 гана студент катышты, бирок кийин алардын катары 2500 кишиге жетти. Акырында администрациялардын мамилеси өзгөрүлүп, тез эле окуу жайлардын 80-90 %ы биздин демилгени колдоого алды."},{"t":"p","h":"Сиздердин ишиңиздерде кандай ресурстар керек болду?"},{"t":"p","h":"Бизге Евразия Фонду колдоо көрсөттү (биздин Союз долбоордун планын иштеп чыгып, ушул фондго жиберген эле). Адам ресурстары – студенттер менен волонтёрлор да катыштырылды."},{"t":"p","h":"Келечекте кандай пландарыңыздар бар?"},{"t":"p","h":"Келечекте биз төмөндөгүдөй иштерди аткарууну пландап жатабыз. Биринчиден, айылдык жаштардын өкүлдөрүн уюштуруп, коомдук иштерге активдүү катыштырмакчыбыз. Биз бул айыл жериндеги олуттуу маселе деп ойлойбуз, анткени элет жаштары маанилүү маселелерди чечүүгө жакшы катышпай жүрөт. Былтыр Душанбеде өткен Жаштар конгрессине барып катышып келгенден бери мен ушул идеяны ойлонуп жүрөм. Эми айылдык жаштарды кыймылын уюштургум келет. Биз жаш шайлоочулардын укуктарын коргоо жаатында да иш! жүргүзүп, Кыргыз Республикасындагы шайлоонун жол-жоболору жөнүндө маалымат таратууну көздөп жатабыз. Жаштарды окутуп-уйреткенде биз абдан көп жаштар киши соодасынь курмандыгы болуп жаткандыгын айтып беребиз жана ушундай кырдаалга туш келбөө үчүн эмне кылуу керек экендигин түшүндүрөбүз."},{"t":"p","h":"<span class=\"pg\" data-n=\"122\">122<\/span>Активдүү радио: демилгени колго алуу – 2 Биз Ош облусунун Өзгөн районунун Куршаб айылындагы Танатар атындагы №14 орто мектептин 11-класс окуучусу Жамийла Нуркулованы аңгемелешүүгө чакырдык. Ал окуучулардын “Либерти” (“Эркиндик”)} аттуу ишчил комитетинин (ОИК) президенти болуп саналат."},{"t":"p","h":"– Жамийла, сиз кандай иштерди өткөрдүңүз?"},{"t":"p","h":"– Мен эки долбоордун түзүлүшүнө демилгечи болдум, Алардын биринин максаты – аз камсыздалган үйбүлөлөрдүн балдарына жардам берүү. Бирок мен кошуна айылга көчүп келгендердин окуучу балдарына жардам катары уюштурган экинчи ишибиз менен айрыкча сыймыктанам. Былтыр алар жер көчкүдөн жабыр тарткан эле. Биздин “Либерти” ОИКибиз бул иш-чараны бизге жакын турган үч мектептин администрациясынын, айыл өкмөтүнүн жана биздин мектептин ата-энелер комитетинин колдоосу менен уюштурду. Ошентип, акча каражаттарын чогулттук да, ал окуучулар үчүн кийим-кече, азык-түлүк жана жаңы жылдык белектерди сатып алдык."},{"t":"p","h":"– Эмне үчүн бул иш-чараны уюштуруу зарыл деп таптыңыздар?"},{"t":"p","h":"– Бир жолу мен иним экөөбүз жер көчкүдөн кийин келип отурукташып калган жаңы айылды ын көрдүм, Бир топ балдар атасынан же энесинен ажыраптыр, алардын арасында: ол жетим калгандары да бар экен. Кийинчерээк ошол балдар окуган мектепке барып, алардын айткандарын укканда, абдан боорум ооруду. Көпчүлүгүнүн мектепке кийип баргыдай шыраак кийими да жок эле. Кыш чилдеси күчөп турса да, кээ бир балдар абдан жука ‚ кийиниптир. Ошондо мен балдарга кийим сатып алууну жана бул айылдын жашоочулары учун концерт союп, ушул иш-чараны уюштурууну чечтим."},{"t":"p","h":"– Сиздердин бул иш-чарага кимдер катышты?"},{"t":"p","h":"– Куршаб айыл өкмөтү, үч мектеп, жергиликтүү милиция, биздин мектеп парламенти ‚ жана, албетте, биздин ОИК катышты."},{"t":"p","h":"– Башка адамдар буга кандай карашты?"},{"t":"p","h":"– Адегенде айыл өкмөтүнүн кызматкерлери бизди айыл өкмөтүнүн башчысынын алдына киргизбей койду. Алар айыл өкмөтү жер көчкүдөн жабыр тартып келгендер үчүн бардык зарыл иштерди жасап жатат, бул жагынан башка эч кимдин, болгондо да окуучулардын, жардамына муктаж эмес дешти. Биз айыл өкмөтүнө үч-төрт жолу барып, акыры айыл өкмөтүнүн башчысына жолугуп, сүйлөшө алдык. Ал биздин идеябызды абдан жактырып, өзү жардам көрсөтүүгө убада берди. Мындай ишти эткэрүүнү айыл өкмөтү да ойлонуштуруп жүргө

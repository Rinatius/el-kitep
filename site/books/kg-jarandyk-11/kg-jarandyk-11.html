андай болгон эле? (Ар бир талапкер канчадан добуш $$ 16-тапшырма. Шайлоо бюллетендери 20 мүн."},{"t":"p","h":"Шайлоо бюллетендери шайлоочуларга шайлоо учурунда берилет. Шайлоонун ар түрү үчүн ар ба бюллетендер болот. Төмөндө үлгүсү келтирилген шайлоо бюллетенин карап көргүлө. Бул суроол жооп бергиле:"},{"t":"p","h":"1. №3 шайлоо округундагы жарандардын таламдарын кимдер жактап өкүл болгусу келет? Бул округда кимдер добуш берүүгө укуктуу? Муну кантип текшере алабыз?"},{"t":"p","h":"Эмне үчүн бюллетенде шайлоочунун аты-жөнүн же силер сунуш кылгыңар келген б талапкердин фамилиясын жазуу учун орун жок?"},{"t":"p","h":"Кимге добуш бергендигин көрсөтүү үчүн шайлоочу эмне кылышы керек?"},{"t":"p","h":"Эжеңер же байкеңер колу бошобой, шайлоо участогуна келе албай калса, эмне кылуу керек? Силерге бир нече талапкер жакса, эмне кылышыңар керек?"},{"t":"p","h":"Силерге бир дагы талапкер же бир дагы партия жакпасачы?"},{"t":"h3","h":"ШАЙЛОО БЮЛЛЕТЕНИ"},{"t":"v","l":["2004-жылдын 10-октябрында Кыргыз Республикасынын","кенешинин депутаттарын","(кеңештин аталышы)","шайлоо боюнча","(округдун аталышы)","мандаттуу № 3 шайлоо округу","(мандаттардын саны)"]},{"t":"h3","h":"БЮЛЛЕТЕНДИ ТОЛТУРУУ ТАРТИБИ"},{"t":"p","h":"Кайсы талапкерге добуш берсеңиз, оң жактагы ошонун тушундагы бош чакмакка же “Бардык талапкерлерге каршы” деген жердеги чакмакка тийиштүү У белгисин коюңуз."},{"t":"p","h":"Сиз добуш беришиңиз мүмкүн болгон талапкерлердин саны шайлоо бюллетенинде көрсөтүлгөн мандаттардын санынан аз же ага барабар болушу мүмкүн, бирок ашык болбоого тийиш."},{"t":"p","h":"Б: Депутаттыкка талапкердин Туулган Негизги иштеген Ким тарабынан көрсөтүлгөн фамилиясы, аты, атасынын аты жылы же кызмат өтөгөн"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td> (алфавит тартибинде)<\/td><td>жери (кесиби)<\/td><\/tr><tr><td> Алферов Александр Иванович<\/td><td>1961<\/td><td>Редактор<\/td><td>“Алга, Кыргызстан!” партиясы<\/td><\/tr><tr><td> Абасов Болотбек Кутуевич<\/td><td>1958<\/td><td>фермер<\/td><td>Кыргызстан коммунисттер партиясы<\/td><td>С<\/td><\/tr><tr><td> Акунова Роза Рысбековна<\/td><td>11969<\/td><td>мугалим<\/td><td>“Менин өлкөм” партиясы<\/td><td>0.<\/td><\/tr><tr><td> Алиева Венера Амановна<\/td><td>1980<\/td><td>журналист<\/td><td>Кыргызстан жаштар партиясы<\/td><td>О.<\/td><\/tr><tr><td> Ганиев Фархад Фатыхович<\/td><td>1966<\/td><td>врач<\/td><td>Кыргызстан социал-демократиялык<\/td><\/tr><tr><td>партиясы<\/td><\/tr><\/table><\/div>"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td> Суванбердиев Бакыт Сандрович |1955<\/td><td>ишкананын<\/td><td>“Ата Мекен” партиясы<\/td><td>ГЛ<\/td><\/tr><tr><td>директору<\/td><\/tr><tr><td> Чувакин Максим Андреевич<\/td><td>1970<\/td><td>юрист<\/td><td>Элдик партия<\/td><td>О<\/td><\/tr><tr><td>талапкерлерге каршы<\/td><td>О<\/td><\/tr><\/table><\/div>"},{"t":"h3","h":"Бюллетенди шайлоо участкасынан сыртка алып чыгууга тыюу салынат"},{"t":"raw","h":"<div class=\"gloss\"><p>2. 1. 2. 3. 4. 5, ыы м» р<\/p><\/div>"},{"t":"v","l":["<span class=\"pg\" data-n=\"43\">43<\/span>Жарандык Жана мамаепетти вашпарууаа патышуу – ХХЛ","","1 17-тапшырма. Шайлоо участкасында","Жзрандып тоозундзгы силердин розунар","","40 мүн."]},{"t":"p","h":"Шайлоо участкасында эмне болгонун окуп чыккыла. Анан 2005-жылы участкалык шайлоо комиссияларынын мүчөлөрү жана байкоочулар үчүн чыккан колдонмо (223-253-беттер) менен таанышып, бул окуялар шайлоо кодексин бузуу болуп эсептелер-эсепителбесии чечкиле, эгер бузуу болуп эсептелсе, эмне үчүн мындай экенин түшүндүргүлө."},{"t":"p","h":"1. Участкалык шайлоо комиссиясынын мүчөсү добуш берүүчү кабинага шайлоочулар өз бюллетендерине белги коюшсун деп карандаштарды койлу."},{"t":"p","h":"2. Расмий байкоочу да, шайлоо комиссиясынын мүчөсү да болбогон акимияттын кызматкерлеринин бири шайлоонун жүрүшүн байкоого уруксат сурады. Участкалык шайлоо комиссиясынын катчысы буга макул болду."},{"t":"p","h":"Участкалык шайлоо комиссиясынын катчысы оорулуу аялым үчүн добуш берейин деп суранган кишиге уруксат бербеди."},{"t":"p","h":"Добуш берүү башталганча байкоочулардын шайлоо участкасына киришине уруксат берилбейт. Шайлоо участкасы расмий түрдө жабылардын алдында келген кишинин добуш берүүсүнө уруксат берилди."},{"t":"p","h":"Шайлоочу шайлоо комиссиясынын катчысынан бюллетенди туура толтурганын карап коюштун сурады. Катчы аны текшерди да, добуш берүү сандыгына салып коюнуз деп шайлоочуга кайра берди. Шайлоо комиссиясынын катчысы шайлоочулардын тизмесине кирбеген бирөөгө добуш берүүгө уруксат берди."},{"t":"p","h":"Добуш берүү үчүн эч ким келбегендиктен, шайлоо участкасы күндүзгү саат үчтө жабылды. Шайлоо комиссиясынын катчысы шайлоочулар жок кезде добуш берүү кабинасын текшерди.. Бюллетендерди санап жатканда комиссиянын катчысы санала электер менен аралашып кетпеши үчүн ар бир бюллетенге белги коюп жатты."},{"t":"p","h":". Бир аял карыган атасы добуш бериши үчүн бир бюллетенди үйгө берүүнү сурады. Ага беришкен жок."},{"t":"p","h":"12. Шайлоо бюллетенин туура эмес толтуруп алган бир шайлоочу жаңысын сурады. Бузулган бюллетень таштандыга ыргытылды."},{"t":"p","h":"13. Шайлоо комиссиясынын катчысы шайлоо участогу жабылардын алдында жана жабылгандан кийин канча таза бюллетень калганын текшерүүнү каалаган байкоочуларга уруксат берген жок."},{"t":"p","h":"14. Ким экенин күбөлөндүргөн эч кандай документи жок бир кишиге добуш берүүгө уруксат беришти, анткени шайлоо комиссиясынын мүчөлөрүнүн бири аны менен бир мектепте окуган экен. (1 18-тапшырма. Үйбүлөлүк добуш берүү 20 мүн."},{"t":"p","h":"Көп өлкөлөр жана эларалык уюмдар үйбүлөлүк добуш берүү көнүмүшүнө тынчсыздануу менен карашат. Мындайда бир-эки адам бүтүндөй үйбүлөнүн атынан добуш берет. Шеригинер менен төмөндөгү маселелерди талкуулагыла, Жоопторунарды башка окуучулар менен талкуулаганга даярдангыла."},{"t":"p","h":"1. Силердин оюңарча, үйбүлөлүк добуш берүүнүн эмнеси жаман?"},{"t":"p","h":"2. Бирөө силердин ордуңарга добуш беришин эмне үчүн каалабас элеңер?"},{"t":"p","h":"3. Муну жактырбашыңарга себеп болгудай кайсы олуттуу проблемалар бар деп эсептейсиңер? 111] 19-тапшырма. Саясий партия түзүү 45 мүн."},{"t":"p","h":"Алтыдан-сегизден болуп топторго бөлүнүп, саясий партия түзүүгө даярдангыла. Чыныгы саясий партияны түзүп жаткандагыдай эле силерди бириктирип турган ишенимдер же идеялар кайсылар болорун ойлонуп көрүшүңөр керек."},{"t":"p","h":"Силер өзүңөрдү мындай бир өлкөдө жашап жаткандай элестеткиле. Бул өлкөдө президенттикке кайсы бир саясий партиядан көрсөтүлүп жаткан талапкер кезектеги шайлоодо жеңип чыкса, төмөндөгүдөй иш-чараларды жүргүзүүнү көздөйт:"},{"t":"p","h":"&gt; Адамдарды 18 жаштан тартып жыл сайын 15 доллар өлчөмүндө “жарандык салык” төлөп турууга милдеттендирген мыйзам киргизүү керек. Төлөбөгөндөрдөн салык инспекторлору баасы ушул суммага барабар материалдык мүлктөрдү тартып алса болот. Жылына 50 000 доллар иштеп тапкан жарандардан алынуучу киреше салыгы мурда 65 %ды түзсө, эми 45 %га чейин төмөндөтүлөт. Калктын 1 %ы гана ушундай жылдык кирешеге ээ."},{"t":"p","h":"&gt; Наркы 500 доллардан кымбат жерге же компанияга/фирмага ээ экендигин тастыктаган документтери <span class=\"pg\" data-n=\"44\">44<\/span>бар аламдар гана добуш берүү У кугун ала турган мыйзамды кабыл алуу. денгээли биздикиндей эле. Бирок бизнес жургуз үүгө улам көбөйүп бараткан чект Бул өлкөнүн экономикалык өнүгүү “н салыктардын айынан өлкөнүн абалы жылдан ж бөйүп б өөлөр мен ен 30 % башталгыч"},{"t":"p","h":"і р ш баштап жаткандар жылдык орточо салык каде кирешесинен салык ченине ылайык у о Аш Ылган к р оашталг кабару ины уе фе» сунуш кылынып жатат. Ошол эле зе а. мыйзам кабыл алуу к бш бар ишканалар башталгыч салыктан жана а Рдан алгачкы уч жыл бою бошотулат, Бул өлкөдө бийликте турган жана баш ка партияларды сындаганга укуктуусуңар, бирок негизсиз күнөөлөсөңөр, ири өлчөмдөгү жазапул (штраф) төлөп калышыңар ыктымал."},{"t":"p","h":"Өз тобунарда (жоопторуңарды жазып туруучу катчыны шайлагандан кийин) булар, буларды аткаргыла: р"},{"t":"p","h":"1. Кайсы негизги идеяларга ишенериңерди"},{"t":"v","l":["Бул кырдаалда силерге эмнелер жакпай турганын к рс өткүлө","Альтернативдүү саясатты сунуш кылгыла.","Партияңарга ат койгула. (Кагаз бар болсо, плакат даярдасаңар да болот)."]},{"t":"p","h":"Партияңарды каттоодон өткөрүү үчүн керек боло турган юридикалык расмий документтердин тизмесин түзгүлө."},{"t":"v","l":["Лидериңерди кантип шайлоону чечип алгыла.","Лидериңерди шайлагыла.","Идеяларыңарды элге жайылтып түшүндүрүү ы к, Башка адамдарды өз партияңарга тартуу планын –."]},{"t":"p","h":"; ‚эим партиялар ортосундагы ж: калды дейли. Өкмөттүн мүчөсү төмөндө келтирилген сөзүн азыр эле сүйлөдү. Силер экулунун көз карашына эмне учун макул эмес экендигиңерди түшүндүрүп жооп жазышынар зарыл. Силер сындап эле тим болбой, турмушка аша турган өз альтернативаңарды сунуш кылышынар керек. Чыгып сүйлөгөн сөзүңөр 500 сөздөн ашпоого тийиш."},{"t":"p","h":"Өкмөт өкүлүнүн сөзү:"},{"t":"p","h":"Ажайып өлкөбүздүн экономикалык абалын бир кыйла жакшыртат деген ой менен биз төмөнкү үч 5 сунушту айтабыз."},{"t":"p","h":"Биринчиден, “жарандык салык” мамлекеттик каржы ишин бир топ чыңаарына ишенип коюңуздар, анткени бул салык базасын кеңейтип, казынага түшүүчү кирешени көбөйтүүнүн эң эле адилеттүү жолу. Бул өлкөбүздүн бай жарандары жаңы ишканаларды ачканга көбүрөөк акчасы болот дегенди да билдирет. Ошентип жумуш орундарынын саны да көбөйөт. Биз мындай салыкты адилеттүү деп эсептейбиз, анткени жарандардын баары мамлекеттик ресурстардан бирдей пайдалануу мүмкүндүгүнө ээ болушат да, ал үчүн бирдей акы төлөп турушат, Же силер буга макул эмессиңерби?"},{"t":"p","h":"Экинчиден, өткөн шайлоо аябай чабал өкмөттүн түзүлүшүнө алып келди. Андыктан бизге добуш берүү укугун бай, байлыкты көбөйтүп жаткан адамдарга таандык кылган кыйла туруктуу демократия керек деп ойлойбуз. Биз ошондой эле демократиянын да, монархиянын да артыкчылыктарын пайдалана алабыз деп эсептейбиз. Көпчүлүк адамдар шайлоодон да, төрт жылда бир алмашылып турган саясатчылардан ‚ да тажап бүткөнүн жакшы билебиз. Өлкөгө туруктуулук керек экендиги баарыбызга белгилүү."},{"t":"p","h":"Үчүнчүдөн, жеке ишкердик жаатындагы эч кандай пайдасы жок эксперименттерди токтотуу керек деп эсептейбиз. Бизге базардагы майда-барат соода керек эмес. Бизге ири бизнес зарыл. Ошондуктан биз сунуштаган жаңы салыкты киргизсек, адамдар жаңы ачылып жаткан ири компанияларда иштей баштайт. да көрдүңүздөр, ДОСко добуш бериңиздер – ошондо келечекке ишенимдүү карайсыздар! Биздин ДОС партиябыз өзүнүн бардык көз караштарын жакшы ойлонуштургандыгын мына өзүңүздөр"},{"t":"p","h":"Көңүл бурганыңыздарга ырахмат, урматтуу айымдар жана мырзалар."},{"t":"p","h":"Ар бир топ өз атынан сөз даярдашы керек."},{"t":"p","h":"12. Топтордун баары өз пландары менен ш талапкер болбогон айрым окуучулардын жардамы менен шайлоо өткөрөт. айдоого талапкерлерин көрсөткөндөн кийин мугалим"},{"t":"p","h":"20-тапшырма. Ой жүгүртүү учун суроолор 45 мун."},{"t":"p","h":"Эки-экиден болуп, төмөндө гү суроолорго жооп тапкыла:"},{"t":"p","h":"Силердин оюңарча, эмне үчүн айрым өлкөлөрдө шайланма Органдарга көрсөтүлүүчү талапкер- <span class=\"pg\" data-n=\"45\">45<\/span>– Хх нпылыздыя Жарандын"},{"t":"p","h":"лердин билим деңгээлине квалификациялык талап коюлат ла. байтка өлкөлөрдө мындай талап жок? Эмне үчүн шайлоо алдындагы үгүттү шайлоо күйү жүргүзүүгө тыюу салынат?"},{"t":"p","h":"Силердин оюңарча, эмне үчүн жарандар добуш берүү учурунан башка шайлоо процессинин бардык этаптарын көрүп туруу мүмкүнчүлүгүнө ээ болушу керек?"},{"t":"p","h":"Шайлоо алдындагы өнөктүктүктү каржылоого эч кандай чектөөлөр коюлбай к алса, мунун эмнеси коркунучтуу?"},{"t":"h2","h":"Добуш берүү жайын уюштуруу схемасы"},{"t":"h2","h":"Добуш берүү"},{"t":"p","h":"сандыгы."},{"t":"h2","h":"Шш о Маалымат тактасы"},{"t":"v","l":["УШК мүчөлөрүнүн добуш берүү күнүндөгү ролдору:","А – Маркалоону (белгилөөнү) текшерүү үчүн жооптуу","аларды маркалоо үчүн жооптуу Б – Шайлоочулардын тизмеси учун жооптуулар В – Шайлоочуларга бюллетень берүү жана","Д – УШК төрагасы жана катчысы Г – Участкадагы тартип учун жооптуу","Ж – Байкоочулар жана талапкерлердин өкүлдөрү","Добуш берүү процессиндеги алты кадам:","1 – Маркалоодон эткен-етпегендугун текшертүү","4 – Кабинкада добуш берүү 3 – Бюллетень алуу жана маркалоодон өтүү 2 – Документтерин текшертүү жана тизмеге кол коюу","6 – Шайлоочунун участкадан кетиши 5 – Бюллетенди сандыкка салуу"]}],"sub":[],"pages":[26,45]},{"title":"XV бап. Аялдар жана демократия","blocks":[{"t":"h2","h":"<span class=\"pg\" data-n=\"46\">46<\/span>XV бап. Аялдар жана демократия"},{"t":"h3","h":"Текстти окуганга чейинки көнүгүүлөр"},{"t":"v","l":["#$ 01-талашырма. Терминдер жана аныктамалар 10 мүн.","Эки-экиден болуп, бул терминдерге аныктамаларды тандагыла:"," а) Бир нерсеге карата өзгөчө артыкчылыктуу укук."]},{"t":"p","h":" б) Кайсы бир маселени чечүүгө сөзсүз эле кимдир бирөөнүн уруксатын күтүр отурбай активдүү киришүү; жаңы идея же сунуш."},{"t":"p","h":"в) Мыйзам гарантиялаган орун же үлүш."},{"t":"p","h":" г) Жынысына, улутуна, тилине же тутунган динине карай кайсы бир топтогу жарандардын укуктарын чектөө."},{"t":"p","h":" д) Эскирген көз караштардын негизинде калыптанган түшүнүк."},{"t":"p","h":" е) Адамдын күндөлүк турмушта аткарган иш-милдеттери (функциялары). ж) Укуктардын жана мүмкүнчүлүктөрдүн теңдиги, 8. Социалдык ролдор? з) Аял менен эркектин абалындагы, айрыкча коомдогу ордуна жана улуттук '9_ Гея дерлик маселелер маданиятка байланышкан айырмачылыктарына тиешелүү маселелер, и) Аялдар менен эркектердин тең укуктуулугу үчүн күрөшкөн кыймыл."},{"t":"p","h":"маалымат берилген. Булардан кандай тенденцияларды байкоого болот (тенденция – өнүгүү, өзгөр багыты)? Кайсылары өтө өзгөчөлөнүп турат? Бул маселе боюнча бай өлкөлөрдүн ортосунда канда!"},{"t":"p","h":"Шеригиңер менен ар бир диаграммага карата чакан дилбаян (100 сөз) жазгыла."},{"t":"raw","h":"<div class=\"gloss\"><p>Ка: &gt; КА Е ||. Квота № 2. Привилегия сы 7 АНЕКРрИМИНаЦиЯ % 4. Стереотип 5. Демилге &amp; 6. Тик юл и 7. Феминизм жалпылык бар?<\/p><\/div>"},{"t":"v","l":["<span class=\"pg\" data-n=\"47\">47<\/span>1-график. Орточо киреше/ Аялдардын парламентке катышуусу","менен) (АКШ доплары Орточо киреше ө? 2","[2.0% Египет + Г Тажикстан 2.8% Малайзия + [Г 4% 7] Е Индонезия + БЕК? Британия + м Па, Испания","","Парламентке мүчө болгон аялдардын проценти"]},{"t":"p","h":"2-график. 2003-жылдын 1-октябрына карата Кыргызстандын башкаруу органдарындагы мамлекеттик кызматтарды ээлеген эркектер менен аялдардын саны (%)"},{"t":"p","h":"(КРнын Улуттук статистикалык комитети, 2004-ж.)"},{"t":"p","h":"70 -"},{"t":"h2","h":"Окууүчүн текст"},{"t":"p","h":"Аялдар жарандык коомдо жана саясатта"},{"t":"p","h":"Дүйнөдөгү эркиндиктин абалы аялдардын коомдук жана мамлекеттик турмушка канчалык жа катышканына түздөн-түз байланыштуу болот деген пикирди көп адамдар айтып жүрүшөт. Көп элдердин байыркы тарыхында мамлекетти башкарган, кол баштаган же өз меке <span class=\"pg\" data-n=\"48\">48<\/span>Лялдар Жана демомрапу"},{"t":"raw","h":"<div class=\"gloss\"><p>1.0<\/p><\/div>"},{"t":"p","h":"эркиндиги үчүн күрөшкөн баатыр аялдар Жр кылымдагы Француз революциясынан тарта, атүгүл Кыз-келиндердин демократиялык укуктары Х дегенди салтт № Улуттук маданиятты ардын баарын эч өзгөртүүсүз калтыр билдирбейт. Коомдогу барды сактоо каада андан да мурдараак кенейтиле баштаганын көрөбүз. дөөлөттөр Өнүгүп турууга тийиш. Айтматовдун “Новые ы чар гезити"},{"t":"p","h":"Бул мезгилге чейин аялдар юридикалык берген интервьюсунан, 2003,23.10.) жактан аталарына же күйөөлөрүнө көз каранды болуп келген, б. а. алар менчикке ээлик кылууга б же добуш берүүгө укуктуу болгон эмес. 1893-жылы Жаңы Зеландиянын аялдар ы шайлоого катышуу укугуна дүйнөдө биринчи болур й союзу түзүлдү. Бул уюм чү дегенд жетишти. 1903-жылы Улуу Британияда Аялдардын эле менчик объектилерди кыйратып, ушул сыяктуу жарандык ийбөө актыларын жасаганды аялдар массалык түрдө камакка алынган. Түрмөгө түшкөндөн кийин алар ачкачылык жарыялашкан Акыры 1918-жылы 30 жашка чыккан, ал эми дагы он жылдан йин, 1928-жылы эркектер менен бирде зле 21 жашка толгон аялдар шайлоого катышуу укугуна ээ болушкан. добуш берүү укугу аялдар 1920-. ниияда 1944-, ал эми Швейцарияда 1971-жылдан – баштап берилген."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>эркектер менен тен укуктуу деп жарыяланып, 1918-жылдан тарта шайлоого Октябрь революциясынан кийин Советтик Россиянын ан\" ы<\/td><td>л<\/td><td>Б<\/td><\/tr><tr><td>1926-жылы шайлоодо добуш берүү укугуна<\/td><\/tr><tr><td>Таиланддагы, 1937-жылы Филиппиндеги, ал эми<\/td><td>-жылы<\/td><td>ч“<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"өлкөлөрүнүн көпчүлүгүндө аялдар шайлоо укугун экинчи дүйнөлүк согуштан кийинки жана колониялаг боштондукка чыккан жылдары алышты."},{"t":"p","h":"Аялдар көпчүлүк өлкөлөрдүн маданий турмушунда, айрыкча искусство жана башка тармактард; кылымдар бою активдүү катышып келсе да, саясий процесстерге катышкандан тартып гана аларды дүйнө таанымы кеңейип, кыйла таасирдүү күчкө айланышты."},{"t":"p","h":"Азыр көп өлкөлөрдө экономикада да, мамлекеттик органдарда да жогорку жетекчи кызматтарды ээлеген аялдарды кездештирүүгө болот. Бирок аялдар эмгек базарында дагы эле эркектерге салыштырмалуу көбүрөөк кыйынчылыктарга туш келишет: аларга аз эмгек акы төлөнөт, кадыр-барктуу жумуш берилбейт. Салттуу түрдө арзан, төмөн бааланып келген айрым кесиптер көбүнчө аялдардын энчисинде калууда. Азыркы учурда көпчүлүк өлкөлөрдө"},{"t":"p","h":"АУН САН СУ ЧЖИ – Мьянманын (мурунку Бирманын) саясий ишмери, Энеси элчи болуп иштеп жүргөндө Индияда билим алып, кийин Улуу К Британиядагы Оксфорд университет бүтүргөн. Бирмага кайтып келгенде Не Вин орноткон режимге кабылат да, бул өлкөдөгү адам укуктарынын бузулушун чечкиндүү түрдө айыптап чыгат."},{"t":"p","h":"аялдар эркектер менен жок эле дегенде мамлекеттик"},{"t":"v","l":["сентябрында","төңкөрүш","жолу"]},{"t":"p","h":"мыйзам жүзүндө бирдей укуктарга менен жаңы хунта (куралдуу күчкө таянган, залим ээ. Алар добуш бергенге, иштегенге, топ) бийликти басып алгандан кийин оппозициялык менчикке ээлик кылганга жана саясий Демократия үчүн улуттук лиганын (ДУЛ) лидери болду. лидер болгонго акылуу. Тилекке каршы, 1990-жылдагы шайлоодо ДУЛ парламенттеги орундардын мыйзамдарда жазылган нерселер дайым 80 %ынан ашуун бөлүгүн жеңгенде, хунта эле күндөлүк турмушта ишке аша жыйынтыктарын эсепке албай койду. 1991-жылы Аун Сан бербейт. Кабыл алынган мыйзамдарга тынчтык боюнча Нобель сыйлыгынын ээси болот, бирок бийлик башында тургандар анын бул сыйлыкты алуу үчүн карабастан, бүткүл дүйнөдөгү, айрыкча чет өлкөгө барышына мүмкүндүк бербеди. Аун Сан бир демократиячыл эмес же демократия нече жолу кармалып, камакка алынганда, аны эларалык бекемделе элек өлкөлөрдөгү аялдар коомчулуктун талабы боюнча боштондукка чыгарышкан. иш жүзүндө зордук-зомбулуктан эркин болуу, менчикке ээлик кылуу, сот адилеттигинин Ушул жана башка тоскоолдуктар болуп жатса да, аялдар жаңычылдык (новатордук) менен ишкерди калыс колдоосуна жана билим алуу укуктарына ээ эмес өнүктүрүүдө алдыңкы катарга чыга алышты,"},{"t":"h3","h":"2.0 Аялдарды саясатка тартуунун мааниси"},{"t":"p","h":"Бардык өлкөлөрдө аялдар шайлоодо добуш берүү укугун алса да, алардын саясий жетекчилерден болушуна мүмкүндүк түзүү абдан зарыл. Канада менен Нидерландия с ыяктуу айрым өлкөлөрдүн аялдаре добуш берүү укугуна эчак эле жетишкендигине карабастан, алар шайланма кызматтарга талапкер <span class=\"pg\" data-n=\"49\">49<\/span>Жарандын Жана мозлепетти вашнарууга н"},{"t":"p","h":"катары кийин гана көрсөтүлө баштады. Бул саясий укукка ээ болгондон кийин деле кээ бир өлкөлөрдө аялдар шайланма кызматтарга талапкер катары көрсөтүлө баштаганга чейин канча мезгил өтсө, аларды шайлоочулар шайлаганга чейин дагы ошончо убакыт керек болду"},{"t":"p","h":"Төмөндөгү интервьюда кайсы бир (Кыргызстандан башка) өлкөнүн парламентине мүчө болгон аял саясатка аралашуу эмне үчүн зарыл экендигин чечмелеп, саясатчы аялдар туш келип жүргөн айрым проблемалар тууралуу сөз кылат, жр. ү 1 Журналист: Сиз өлкөбүздө аялдардын саясат менен эл р лектениши зарыл экендигин эн сонун айтып бердиңиз. Аялзаты үйбүлөнүн куттуу оч огун н сакташы керек эмеспи, эми биздин ушул улуттук салтыбызга туура келбесе деле (дел у з кеңири жол зчуу керек деген оюңузду даанараак түшүндүрсөңүз?"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Парламент мүчөсү: Мен адегенде илгертен келаткан<\/td><td>р адатта абдан динамикалуу,<\/td><\/tr><tr><td>башкача айтканда, дүйнө жүзүндөгү жаныланууз<\/td><td>ш у<\/td><td>ыңгайлашып<\/td><\/tr><tr><td>турат дегим келет. Ырас, элкебуз чоң, бай.<\/td><td>ок<\/td><td>оў<\/td><td>і<\/td><td>р изди курчап турган<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"дүйнөдөгү өзгөрүүлөрдү токтотуп коё алба йыз тартабыз дегенди билдирбейт. Кеп экономикадагы жана жат у эле турмуштагы өзгөрүүлөргө баш жараша биздин каада-салттар да жаңыланып турганында. Ил и ушундай болгон дей и эле адамдардын укуктарын чектей берсек, алар ошол с ‹ сыйлабай калат."},{"t":"p","h":"Сиздин “куттуу очок” дегениңиз жакшы сөз. Үйбүлөнүн мукта а жакшыраак туюпсезерин эске алсак, аялзаты турак-жай, саламаттыкты С оо ама © и тармактардагы проблемаларды мамлекеттик деңгээлде чечкенге"},{"t":"v","l":["көрөбүз.","сыяктуу","зарыл экендигин "]},{"t":"p","h":"Журналист: Демек, Сиз аялдар дал ушундай министрликтерди башкарууга тийиш леп эептейт турбайсызбы?"},{"t":"p","h":"Парламент мүчөсү: Жок, такыр андай эмес. Аялдар эркектердей эле ар кандай министрликти жетектеп кете алат."},{"t":"p","h":"Журналист: Бирок, мисалы, улуттук коргонуу сыяктуу маселелерде аял киши эмнени билмек эле?"},{"t":"p","h":"Парламент мүчөсү: Россияда коргоо министринин ©рун басары аял болгон. Кайсы бир жактарынан алганда аял киши коргоо министринин кызматына эркекке караганда ылайыктуу келет, анткени ал адатта согуштун үйбүлөгө тийгизчү кесепетин жакшыраак билет да, согушту болтурбоо үчүн бардык аракеттерин жасайт. Аскердик тажрыйбасы жетишпейт десеңиз, биздин айыл-чарба министрибиз агроноы же зоотехник болгон эмес. Менимче, сиз жогорку деңгээлдеги саясатчылардын ролу тууралуу жаңылыш пикирде көрүнесүз. Алар башкарып, жетекчилик кылышат. адистердин кеңеши зарыл болуп калса, жетекчи өз аппаратындагы кызматкерлер менен акылдашат."},{"t":"p","h":"Тилекке каршы, аял саясатчылардын айрымдары экономика сыяктуу тармактарда иштегенге жөндөмдүү болсо да, көп учурларда аларды “социалдык” тармактарга “түртүп салууга” аракеттенишет. Мен адамдарды кызматка жынысына эмес, шык-жөндөмүнө жана даярдыгына карап алуу керек деп эсептейм. Биз, аялзаты, өз өлкөбүздү бир чоң үйбүлөдөй элестетебиз, андыктан президенттик кызматка аял гана эң ылайыктуу десек болчудай. Бирок бул, албетте, тамаша."},{"t":"p","h":"Мен өзүм парламентке шайлансам да, мамлекеттик органдарда, экономикада дайындалуучу кызматтарга талапкерлерди тандоодо деле аялдарга эркектер менен бирдей мүмкүнчүлүк берилишин өтө каалар элем."},{"t":"p","h":"Журналист: Биздин өлкөнү качандыр бир кезде аял президент башкарып калышы мүмкүн деп ойлойсузбу?"},{"t":"p","h":"Парламент мүчөсү: Эмнеге болбосун? Беназир Бхутто Пакистандай мусулман өлкөсүн башкарды. Жаңы Зеландиянын премьер-министри – аял, көптөгөн министрликтерди да аялдар жетектейт. Биздеги салттар аялдарга мындай мүмкүнчүлүк бербейт деген сөздү көп угуп жүрөбүз. Бирок мен буга макул эмесмин."},{"t":"p","h":"Адамдар көз карашы дал келип калганды эмес, эң жөндөмдүү, бүтүндөй элдин таламдарын коргой ала турган кишини шайлоо керектигин түшүнүүгө тийиш"},{"t":"p","h":"Журналист: Аялдар саясий турмушка катышканда кандайдыр бир кыйынчылыктарга туш келет деп эсептейсизби?"},{"t":"p","h":"Парламент мүчөсү: Ооба. Мен көбүнчө олуттуу маселелерге эмес, жыныстык айырмачылыкка байланышкан кыйынчылыктар чыгат деп эсептеймин. Анткени көп өлкөлөрдүн маданий салтында ' аял үйдө отурууга тийиш деп, ал өз пикирин айтканда жактырышпайт. Бирок кептин баары ушунда гана деп ойлобойм, анткени сын таккандар өздөрү компьютерди колдонуп, кока-кола ичип, мурунку салтта болбогон көп эле нерселерди жасап жүрүшпөйбү"},{"t":"p","h":"<span class=\"pg\" data-n=\"50\">50<\/span>Мында аялдарды жогорку кызматка койбосо керек леген эски түшүнүк БҮ тосков от. Башкача айтканда, жогорку даражадагы кызматтарда иштөө үчүн бирдей мүмкүнчүл ен күндө дагы, аялдар бул кызматтарга тура албайт. Себеби бул маселени чечкең д келгенде аялды эмес эркекти жумушка алат. Тилекке каршы, алар буга дайы шылтоолорду табышат."},{"t":"p","h":"журналист: Кандай дейсиз, Сиз эркектердин да өкүлү боло аласызбы:"},{"t":"p","h":"Парламент мүчөсү: Албетте. Мени өзүмдүн округумдагы шайлсочулар шайлагандь"},{"t":"p","h":"Ё албай жатасыз деп ойлойм. Жок эле дегенде алардын тең жарымы эркектер жа турмушта эмнелерге жетише алганымды кергендуктен мени колдоп добуш беришке ›нцуктан мен эркектердин да, аялдардын да таламдарын коргоого милдеттүүмүн. Бир ича парламентте аялдар азчылыкты түзөт, андыктан бардык депутаттар, айрык‹ ардын ичинен аялдар коомчулукта үнү жакшы угулбай жаткандардын позициялары туюнтулуп аракеттенүүгө тийиш."},{"t":"p","h":"Кыргызстандын экономмкалык жана саясий турмушундагы аялдардын орду Кыргызстанда ушул мезгилге чейин болуп өткөн саясий терең өзгөрүүлөрдөн улам коом көзөмөл жүргүзүүнүн мурдагы формалары жана каада-салттардын маани-маңызы талаштуу бол; алардын таасири аябай начарлап кетти. Айрым учурларда эски салт-санаалар жанданып, жаңылары пайда болду. Бул өзгөрүүлөр көбүнчө үйбүлөнүн экономикалык абалын начарлатып, аялдардын туйш оорлотту."},{"t":"p","h":"Экономикалык өзгөрүүлөр көптөгөн аялдарга өздөрүнүн ишкердик жөндөмүн көрсө мүмкүнчүлүк берди. Ушунун натыйжасында көп чакан ишканалардын ээлери жана жетекчил аялдар болуп калды. Экономикалык маалыматтарга караганда, мындай иш-аракет өлкөгө ички д продукциянын 1/3 ине чейинкисин алып"},{"t":"v","l":["Кыргызстандагы аялдар","келет. Айрым изилдөөчүлөр экономикалык"]},{"t":"p","h":"Албетте, айрым аялдардын жагдайы тапта кризис учурундагы шарттарга аялдар башкача болушу да ыктымал, бирок ар баш тезирээк ыңгайлашарын белгилеп жүрүшөт. булактардан алынган акыркы статистика Алардын жетекчилик жана менеджерлик маалыматтар өлкөдөгү аялдардын абалын, негизинен, билгичтиктери коомдогу иш-аракеттердин туура эле чагылдырат."},{"t":"p","h":"кыйла кеңири тармактарын жетектөөдө Биринчи жолу ңикеге тургандардын орто пайдасы тийиши мүмкүн. Аялдар өлкөнүн курагы (катталбаган никелерди эсепке албаганда) эркектердики – 25 жаш; аялдардыкы – 21 жаш. жогорку жетекчилигинде жана экономикалык Орто мектепте окуган же окуп жаткан аялдард уюмдарда өтө эле сейрек кездешет, бирок проценти: 1992-жылы – 79 %; 2000-жылы – 51 %. алар аз акы төлөнүүчү кызматтагылардын копчулугун түзөт."},{"t":"p","h":"Коомдогу көп адамдар аялдардын саясатка катышуусун жактырбайт. Дал ошол"},{"t":"p","h":"Жогорку Кеңеште аялдар ээлеген орундарды проценти: 1992 жылы – 8 %; 2000-жылы – 6,7 %"},{"t":"p","h":"Эгерде эркектер менен аялдардын кадырес (адаттагы) турмуш-тиричилигин салыштырсак, анд себептен саясий партиялардын көпчүлүгү изилдөөлөр аялдар, негизинен, үй тиричилигин! гендердик маселелерди саясий утуш алып байланып калганын көрсөтөт. Бул кыз-келиндерди келе турган маселе катары карабайт. Ушул жумушка орношуу, маалыматка, тең укуктуулукк себептен алар муну саясий программаларына жетүү мүмкүнчүлүктөрүн чектейт. Ошол эле учурд киргизишпейт жана шайлоодо талапкер эркектердин иш-аракеттери үйдөн сыртта бола жана алар жогорудагылардын бардыгына жетүү же партиянын активдүү мүчөсү болууну көбүрөөк мүмкүнчүлүктөрү бар."},{"t":"p","h":"каалаган аялдарды колдошпойт. Андан Айылдагы жана шаар жериндеги аялдардын абалдар сырткары, көп учурда аялдардын саясий жана экономикалык шарттары олуттуу айырмалана турмушка аралашуусуна күйөөлөрү же Бул аялдар үчүн айылга салыштырмалуу шаа туугандары тарабынан, ошондой эле жеринде экономикалык мүмкүнчүлүктөр кыйла кеңир экендиги менен байланышкан. Коомдогу салттуу к массалык маалымат каражаттары жана караштар да бул абалга бир топ таасир этет. коом тарабынан колдоонун жоктугу кедерги (тоскоол) болот. Шайлоодо талапкерлерди көрсөтүү үчүн квалификациялык талаптар Адам укуктарынын жалпы декларациясынын 21 дагы айрым аялдардын саясий күрөшкө статьясынын 1-бөлүмүндө “ар бир адам өзү жашага мамлекетти башкарууга түздөн-түз же эркин түрд катышуусуна жолтоо болушу мүмкүн. Эгер шайлануучу өкүлдөр аркылуу катышканга укуктуу декларацияга киргизүү жана талапкерлик деп жарыяланган."},{"t":"v","l":["<span class=\"pg\" data-n=\"51\">51<\/span>ува каниышуу —;","","күрөө (залог) коюу үчүн өздөрүнүн кирешеси","жок болсо, же ата-энелери кыздар үчүн зарыл","эмес деп эсептегендиктен жогорку билим","алышпаса, ушундай болушу мүмкүн. 2001-","жылкы айыл өкмөтүнө шайлоодо талапкер","катары көрсөтүлгөн 148 аялдын ичинен 35и","жогоруда айтылган себептердин бири боюнча","каттоодон өтө алышкан эмес.","Атүгүл аялдар шайлоого талапкер катары","катталган учурларда да үйбүлөнүн атынан добуш","берүү сыяктуу мыйзамсыз адаттын айынан","алардын шайлануу мүмкүнчүлүгү чектелип","жүрөт. Бул добуш берүү үчүн аялдардын","бюллетенин үйбүлөдөгү эркектер шайлоо","сандыгына салып коюшарын билдирет, Ошого","карабастан аялдар шайлоодо атаандаш эркектерди жеңип чыккан учурлар кезигет."]},{"t":"p","h":"Балким бул маселени аял талапкерлер үчүн белгилүү квотаны (экулдуктун үлүшүн) киргизүү менен чечүүгө болор? Мисалы, Түштүк Африканын парламентиндеги орундардын 30 %ы, ал эми Пакистандын парламентиндеги орундардын 17 %ы аял талапкерлер үчүн бөлүнгөн. Аялдардын бийлик органдарында көбүрөөк орун ээлеп, шайланма кызматтарга талапкер катары көрсөтүлүп жатышынын өзү эле дурус көрүнүш. Бирок аялдар ар кандай шайлануучу кызматка эркектер менен бирдей эле атаандашууга жөндөмдүү болушу керек. Ошондо шайлоочулар аялдарга, алардын иштерине аял катары эмес, теңтайлаш жаран катары баа бермек."},{"t":"v","l":["Аялдар жана Борбордук Азиядагы үрп-адаттар","Аялдар Кыргызстандын көпчүлүк бөлүгүндө, өзгөчө айыл жеринде, көп уЗзурда"]},{"t":"p","h":"укуктарын эркектерге салыштырмалуу абдан тар алкакка чектөөчү коомдук үрп-ал баш ийүүгө аргасыз болушат. Жалпысынан бул чектөөлөрдү төмөнкүчө көрсөтүүгө ©"},{"t":"p","h":"Жубай тандоо. (Никени туугандардын макулдугу боюнча кээде кыздын пикирин менен, ал эми кээде укпастан эле кыйышат; ага жубай тандоого укук берилиши мүмкүн, бирок ошондо деле кызга бир топ кысым жасалат, Жалпы кысым менен кызды куйвеге эрте чыгууга мажбурлашат, бул учурда ал окубай калышы мүмкүн)."},{"t":"p","h":"Коомдо үйбүлөлүү эркектердин башка аялдар менен катышуусуна жол коюлушу. Мындайда экинчи аял өзүнчө бөлөк же эркектин үйүндө жашап, ага бала терен бериши мүмкүн. (Эркектердин бирден ашык аял алышы Борбордук Азиядагы өлкөлөрдө юридикалык жактан мыйзамсыз деп эсептелет)."},{"t":"p","h":"Үйбүлөнүн сандык курамы жөнүндө чечим кабыл алууга укукту чектее. {Көп учурда күйөөгө чыккан аял канча бала төрөө жөнүндөгү маселеде чечүүчү добушка ээ боло албайт. Атүгүл эненин жана үйбүлөдөгү башка балдардын ден соолугуна коркунуч келген учурда да, уул балдар көп болушу үчүн энеге төрөгөндү улантуу талабы менен кысым көрсөтүлөт)."},{"t":"p","h":"Үйбүлөдөгү акча иштерине толук кийлигише албоо. (Көп учурда, атүгүл үйбүлөдөгү табышкер болсо да, акчаны сарптоого келгенде аялдардын укугу чектелип калат. Аялдардын финансы жагынан көз карандысыз болушу да кыйын, анткени үрп-адат боюнча менчик уулдарга гана мураска берилиши керек. Натыйжада мыйзам аялдарды жактаса да, алардын менчикке болгон укугун коргоо кыйынга турат)."},{"t":"p","h":"Жеке турмушка кол тийгистиктин чектелиши же мындай укуктун жок болушу. (Аялдардын жүрүм-турумуна бардыгы көз салып турушат. Аялдардын эркин болушу айыпталат)."},{"t":"p","h":"Аялдар үй тиричилиги менен алектениши керек деген түшүнүк да үстөмдүк кылууда. Үйбүлөсүнүн кысымы менен аялдар көп учурда сырттагы ар кандай мүмкүнчүлүктөрдөн баш тартууга аргасыз болот. Көнүмүш ролунан чыгып, мүмкүнчүлүктөн пайдаланган учурда да, алардын ийгилиги же жеңилиши адатта эркек менен байланыштырылат. Анын үстүнө мындай учурда көбүнчө алардын жоопкерчилиги эркектердин милдеттерине караганда чоң болуп, салттуу милдеттери да жеңилдебей кала берет."},{"t":"p","h":"4.0 тендик, экономика жана маданият"},{"t":"p","h":"Көпчүлүк экономисттер калктын кайсы бир бөлүгү басынтылса, өлкө абдан зор зыянга учурайт деп эсептейт. Анткени эгерде өлкө өзүнүн адам ресурстарын толук өлчөмдө пайдаланбаса, анын экономикасы."},{"t":"p","h":"<span class=\"pg\" data-n=\"52\">52<\/span>конкуренцияга жөндөмсүз болушу көбүрөөк Кыргызстандагы орточо айлык акы ыктымал. Бүткүл дүйнөдөгү аялдар жетишкен"},{"t":"v","l":["Аялдар – 1150 сом","ийгиликтер алар бардык иштерде болбосо Эркектер – 1770 сом"]},{"t":"p","h":"да, көпчүлүгүндө эркектер менен бирдей эле (Ишканалар менен мекемелер боюнча 2002-ж, иштей ала тургандыгын айгинелеп турат. бирдей убакта жүргүзүлгөн иликтөөдөн алынды) Демек, өлкөдөгү бардык жумушчу күчтүн жарымынын дараметтүү (потенциалдуу) “Бийликтин тең эмес бөлүштүрүлүшү аялда, билгичтиктерин пайдаланбоо абдан эле менен эркектердин ортосунда ресурстарды ._"},{"t":"p","h":"убакытты, кирешени, менчикти – бирдей Эмес ысырапкордук болмок. Андан сырткары бөлүштүрүүгө алып келет. БУУнун көп ирет Эске эгерде калктын бир бөлүгүнүн укуктарына алынып жүргөн бул статистикасы учурдагы абалды тиешелүү көңүл бурулбаса, бул адамдар өз туура эле чагылдырат: \"Аялдар бүткүл дуйнедегу кадыр-баркын билбей, алардын экономикалык жумуштардын учтен эки белугун аткарат, бүткүл пайда келтирүү мүмкүнчүлүгү чектелип калат. дүйнөдөгү кирешенин ондон бир бөлүгүн иштеп. Мындан төмөнкүдөй суроо келип чыгат: табат, дүйнөнүн бардык сабатсыз калкының “Эски салт-санааларды сактоодо канчалык үчтөн эки бөлүгүн түзөт жана дүйнөдөгү бардык менчиктин ондон бирине жетпеген бөлүгүнө Ээлик чыгымдарга жол коюуга болот?”"},{"t":"v","l":["Көп адамдар кээ бир салттар","экономикалык себептерден улам эмес, адам","кылат”.","{Мусиси К. ж.б., ПРООНдун 2000-ж отчетунан) "]},{"t":"p","h":"укуктарын сактоодогу тендик талабына каршы келгендиги үчүн жараксыз деп табышы мүмкүн. Аялда эркектер менен бирдей укуктан пайдаланууга тийиш. Демек алар качан бала төрөө керек, биринчи кезекте эмнеге акчаны сарптоо керек, качан жана кимге күйөөгө чыгуу керек деген сыяктуу маселелерди чечүүдө да тен укуктуу болушу зарыл. Айрым аялдардын абалын бул бир аз эле өзгөртөт, бирок эгерде пул. шарттар толук ишке ашырылса, үйбүлөдөгү жана коомдогу бийликти бөлүштүрүүдө олуттуу өзгөрүүлөр."},{"t":"p","h":"Ошондуктан ар башкача пикирдеги адамдардын жаңжалдашып калышы мүмкүн. Эгерде силер эркекти кудай артык жараткан, ал аялды башкара жүрүшү керек, бул биздин салт-санаалардан көрүнүп турат десенер, анда мындай пикир жалпы тең укуктуулук идеясына түздөн-түз карама-каршы келет, Биз бардыгыбыз инсан катары көз караштардын кайсынысын тандоону өзүбүз чечишибиз керек. Адам укуктарынын концепциясын (негизги идеясын), анын ичинен аялдардын укуктарын диний жоболор менең негиздөөгө болот. Бирок буларды кандайдыр бир конкреттүү диний салт-санааларга өтө эле аралаштыра бербегенибиз оң. Бул концепция бардык жарандардын саясий теңдиги концепциясына негизделген азыркы. учурдагы либералдуу! демократиялык ойлом үчүн пайдубал болуп саналат."},{"t":"p","h":"Айрым адамдар эгерде аялдар эркектер менен бирдей мүмкүнчүлүктөрдү алса, үйбүлөлүк турмуш. бузулушу же таптакыр ыдырашы мүмкүн деп тынчсызданышат. Кээбирелкелерде жубайлар Ширин Эбади"},{"t":"p","h":"Ирандагы 1979-жылкы Ислам революциясына аялдын карьерасы (кызматтан кызматка чейин Ширин Эбади бул өлкөдө судья болуп иштеген көтөрүлүшү) үчүн балалуу болбоону чечишет, биринчи аял эле. 1975-1979-жылдары Эбади ал эми башка учурларда бул аялдардын Тегеран шаардык сотунун президенти болгон. күйөөлөрү үйдөгү иштердин көпчүлүгүн Ислам революциясынан кийин ал кызматынан өздөрү жасашат да, үйбүлө сакталып калат. кетүүгө аргасыз болот да, ошондон бери Тегеран Толук тең укуктуулук шартында эркектер университетинде сабак берет."},{"t":"p","h":" үйбүлөлүк чечимдерди кабыл алуу процессин Ширин Эбади – көптөгөн укук коргоо уюмдарынын активдүү мүчөсү. Ал айрыкча качкындардын, кечеңдетүүгө көнүгүшү үчүн кыйла убакыт балдардын жана аялдардын укуктарын коргоого талап кылынары талашсыз. Анткени бул зор салым кошкон. Ирандагы Баланын укуктарын чечим эми бир тараптуу кабыл алынбайт, коргоо ассоциациясынын негиздөөчүсү. Өз бирок мунун да өз артыкчылыктары бар. ынанымдарынан баш тартпагандыгы үчүн бир нече Аялдын укуктары корголгон учурда, анын ирет темир торго камалган."},{"t":"p","h":"эркек менен болгон мамилесинде чыныгы 2003-жылы Ширин Эбади “Иранда демократияны сүйүү мурдагыдан күчтүүрөөк болот, бул өнүктүрүүгө кошкон салымы жана адам укуктарын, үйбүлөнүн калган мүчөлөрүнө да таасирин күрөшкөндүгү үчүн” Нобель сыйлыгын алды. айрыкча балдар менен аялдардын укуктарын коргоп тийгизет. Бардык жагдайда бирин-бири урмат- Нобель комитетинин мүчөлөрү Эбади өзүнүн укук тоо үйбүлөнүн мүнөзүн өзгөртүүгө тийиш. коргоочулук ишмердигинде шарияттын жоболорун Үйбүлөлүк ынтымак ушундайча чыңдалат. колдонууга аракеттенерин, ислам менен негизги Кээ бир адамдар Кыргызстандагы адам укуктарынын жалпылыктарын көрэ билерин нлдардын абалы улуттук салт-санаага жана, баса белгилешти."},{"t":"p","h":"ибералдуу – саясий, экономикалык эркиндикти жактоочу."},{"t":"raw","h":"<div class=\"gloss\"><p>болору шексиз.<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"53\">53<\/span>балким, диний көз караштарга туура келет деп талашат. Алар аялзаты өзгөрүлсө, эзелки каадаларга доо кетет дейт. Башка бирөөлөр, айрыкча аялдар, тенсиздиктен биз жабыр тартып жатканыбыз үчүн мындай үрп-адаттарды сактоо же сактабоону өзүбүз чечүүгө тийишпиз деп чыгышы мүмкүн. Бери болгондо калктын жарымы бул маданиятты эски, адилетсиз жана адамдын кадыр-баркын кемсинтет деп ойлосо, элдин жалпы маданияты үчүн мындан өткөн бүлүнтүүчү эч нерсе жок дешет. Эмнеси болсо да, биз бул маселе боюнча акыркы чындыкты эч ким айта албайт, андыктан муну кеңири коомчулук талкуулашы керек деп эсептейбиз."},{"t":"p","h":"Жүктүн оорун тең бөлүштүрүү Окуучу эки баланын энеси, медсестра болуп иштеген 29 жаштагы Айнурадан интервью алып жатат."},{"t":"v","l":["Окуучу: Сиз медициналык тейлөө чөйрөсүндө качантан бери иштейсиз?","Айнура: 10 жылдай болуп калды."]},{"t":"p","h":"Окуучу: Сиздин эки балаңыз бар экен. Жумушуңузда баарынан эмнеге кебуреэк кызыгасыз: кызматка көтөрүлүүгөбү, айлык акыңыздын чоңойтулушунабы же чет элкэге баруугабы? Же болбосо сиз учун эң башкысы үйбүлөңүзбү?"},{"t":"p","h":"Айнура: Жок, менин жумушумда мындай мүмкүнчүлүктөр болбойт, болгон күңдэ деле мен, албетте, үйбүлөнү биринчи орунга коёр элем."},{"t":"p","h":"Окуучу: Балаңызды багып кароо үчүн узак мөөнөттүү өргүүдө (отпускада} болуп, жумушуңузга кайтып келгенде кайрадан кенугуше албай кыйналгандырсыз?"},{"t":"p","h":"Айнура: Ооба, алгач жумушта да, үйдө да бир топ кыйналып жүрдүм. Адегенде күйөөм менин кайрадан жумушка чыгышыма каршы болгон эле."},{"t":"p","h":"Окуучу: Эмне үчүн каршы болду эле?"},{"t":"p","h":"Айнура: Ал менин иштей алышыма көзү жеткен эмес. Же баланы жакшы бага албай, же медсестранын жумушун түзүктөп аткара албай, ортодо кыйналып каласың деген. Бирок кийинчерээк мен өзүмдүн бул кадамым туура экендигин далилдей алдым. Алган айлыгыы жолума жана электр акысына араң жетсе да, мен өзүм жакшы көргөн жумушумда иштегендигим үчүн абдан зор канагат алам. Өзүмө ишенгенимден жана кэнулум ачык жүргөнүмдөн улам балама да мээримдүү эне боло алаарыма көзүм жетет."},{"t":"p","h":"Окуучу: Сиздин иштеп жүргөнүңүз кыргыздардын салтындагы аял уйде отурушу керек деген түшүнүккө каршы келбейби?"},{"t":"p","h":"Айнура: Балдарыма ойдогудай кам көрүп, үй тиричилигине жетишип жатсам, күйөөмө да жакшы көңүл бөлө алсам, иштегенимдин эмнеси жаман? Салтка келсек, Алай канышасы деп таанылган атактуу Курманжан датканы же Уркуя Салиеваны эстейличи. Мен буларды бекеринен айткан жокмун: экөө тең республикабыздын салтты эң эле бекем кармаган аймагы болгон түштүк тараптан! Ошентип, мен чындыгында улуулардын өрнөгүн улап жаткан чыгаармын?"},{"t":"p","h":"5.0 Өзгөртүүлөрдү кантип киргизүү керек?"},{"t":"p","h":"Эгер биз аялдардын тең укуктуулукка жетишүүсү экономикалык жана этикалык максаттарга ылайык келет деген идеяга макул бөлсөк, анда бул максатка жетүү үчүн эмне кылуу керектигин карап көрүүгө тийишпиз."},{"t":"p","h":"Биринчи баштай турган нерсе – бул мыйзамдар. Чындыгында азыр Кыргызстандын мыйзамдары аялдардын укуктарын коргоону бир топ деңгээлде камсыз кыла баштады."},{"t":"p","h":"Кыргыз Республикасынын Конституциясы эркектерге жана аялдарга бирдей укук берет"},{"t":"p","h":"1996-жылы Кыргызстан аялдардын укуктары жөнүндөгү эларалык конвенцияларды ратификациялаган. Бул конвенциялар аялдарды басмырлоого жана аларга күч колдонууга тыюу салат, алардын саясий укуктарын коргойт жана никеге турууга макулдук алуу, нике курагы, никени каттөө жана энеге зарыл болгон атайын коргоо чараларынын стандарттарын аныктайт."},{"t":"p","h":"Көлдөнулуп жаткан мыйзамдар аялдарды коргойт жана аларга көптөгөн жагдайларда тең укук берет, мисалы, мурас укугун жана менчик укугун коргойт, көп аял алуучулукка, аялга карата күч колдонууга жана бүтүндөй үйбүлөнүн атынан добуш берүүгө тыюу салат."},{"t":"p","h":"Ошондуктан мыйзамдарга кандайдыр бир өзгөртүү киргизүүдөн мурда, колдонулуп жаткан мыйзамдардын реалдуу аткарылышын камсыз кылуу абдан зарыл. Мыйзамдар кубаттуу курал болгону менен, эгерде коомдогу көз караштар жана ишенимдер шайкеш келбесе, алар абдан күчсүз болуп калышы <span class=\"pg\" data-n=\"54\">54<\/span>Яялхдар эана мүмкүн. Эреже катары, адамдын укуктарын бузуу аларды билбегендиктен келип чыгат. Демек, би, берүү аркылуу адамдардын мамилелерине жана кылык-жоруктарына таасир тийгизүүгө болот. Бирок; коом бир эле түндө өзүнөн өзү жаңыланып калбай тургандыгын унутпагыла. Бул силердин ар бириң, ер жеке өзүңөрчө күрөшүүнөр керек дегенди билдирбейт: аялдардын тең укуктуулукка умтулуусун КОЛДОГОН жана түрдүү органдарда аялдардын өкүлдөрү болушун жактаган коомдук уюмдар бар. Кыргызстандын Өкмөтү улуттук гендер саясатын жүзөгө ашыруу үчүн “Аялзат” программасынын алкагында атайын каражат бөлгөн."},{"t":"p","h":"Бирок акыр аягында коомдогу көрүнүштөргө карата өз мамилесин жарандар өздөрү кайрадан ойлонуштуруп, өзгөртсө гана көңүлдөгүдөй жанылыктар ишке ашуусу мүмкүн."},{"t":"h3","h":"Сакин Бегматова"},{"t":"p","h":"Ал 1921-жылы Аламүдүн районундагы Койташ айылында туулган. 1938-жылы 17 жаштагы бул дент кыз республикалык радиодо иштеген алгачкы аял диктор болгон. Республиканың кездеги эн жогорку сыйлыгы – Кыргыз ССРинин Жогорку Советинин Ардак грамотасы иланган. 40-жылдардын башында ал Одессадан Фрунзеге эвакуацияланып келген ан, ж.б. жасоочу фабриканын директору болуп дайындалган."},{"t":"p","h":"10952-җылпан 1961-жылга чейин Сакин Бегматова республиканын финансы министринин рун басары болуп иштейт. Андан соң Кыргыз ССРинин Министрлер советинин төрагасынын 'н басары болуп бекитилет. Бул кызматта Бегматова 19 жыл иштеп, республиканын тышкы ер министринин милдетин да айкалыштырып аткарат. 1969-жылы БУУнун ХХТУ Генералдык амблеясына советтик делегацияны баштап барган."},{"t":"p","h":"‚кин Бегматова чет өлкөлөр менен маданий байланыштарды бекемдөөгө чоң салым кошкон, ккаларлыктай тагдыр күткөн бул аял өзүнүн бүт өмүрүн жана ишмердигин Кыргызстандын микасы менен маданиятын өнүктүрүүгө арнады."},{"t":"h3","h":"Текстти окугандан кийинки көнүгүүлөр"},{"t":"p","h":"2411, 03-тапшырма. Силер кимдерди билесиңер? 15 мүн."},{"t":"p","h":"Үч-төрттөн болуп, Кыргызстандагы белгилүү аялдар жөнүндө таблицада көрсөтүлбөй калган маалыматтарды толуктап жазгыла. Силер өз коомдоштугунардагы эл сыймыктанган (же кеңири белгилүү) аялдардын аттарын кошсонор да болот."},{"t":"p","h":" 2. Бубусара Бейшеналиева"},{"t":"v","l":["[3. Светлана Токомбаева","","|5. Ольга Мануйлова"]},{"t":"p","h":" 1960-жылдар акын 1960-жылдар скульптор"},{"t":"p","h":"$$ 04-тапшырма. Силердин оюңар кандай? 30 мүн. Таттыбүбү Турсунбаева өмөндө эмне үчүн аялдардын саясий процесске катышуусу зарыл деген суроого ар түрдүү жооптор рилди. Шеригинер менен бул пикирлерди туура же туура эмес деп баалагыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"55\">55<\/span>Жарандын эана вазаестётти вашптарууав патышуу – ХХ1 пылыаздын Жа гы жөнүндө ойлонгула. Айрым пункттар боюнча эч нерсе колдон келбеси түшүнүктүү."},{"t":"p","h":"АКШнын чегинен сыртта төрөлгөн."},{"t":"p","h":"Англисче сүйлөй албайт."},{"t":"h3","h":"1з-тапшырма. Аялдар лидерлиги"},{"t":"p","h":"Англис тилин үйрөтүү керек."},{"t":"h3","h":"20 мүн."},{"t":"p","h":"Дептериңерге таблица чийгиле (төмөндө берилгендин дал өзүндөй). Андан кийин, 4-5тен болуп, силердин жердеги жетекчилик орунду аялдар ээлеген бардык мекемелерди жазгыла. Биринчи мисал үлгү катары берилген."},{"t":"p","h":"“ур 1. Рая Кадырова «Эларалык толеранттуулук үчүн» коомдук фонду Президент"},{"t":"p","h":"111], 14-тапшырма. Үчмаселе 15 мүн."},{"t":"p","h":"Үч-төрттөн болуп, төмөндөгү суроолорду талкуулагыла да, жоопторуңарды жактаганга даярдангыла."},{"t":"p","h":"1. Эркек адам эски үрп-адаттардан, өзүнүн жаңылыш пикирлеринен баш тартып, аялынын ийгиликтүү иштешине жол коё алабы? Өзүнө караганда чоңураак ийгиликтерге жетишсе, куру намыска жеңдирип басынбай, аялы жана кыздары менен сыймыктана алабы?"},{"t":"p","h":"Улгайган аялдар салтка туура келбейт деп эсептелиши мүмкүн болгон, бирок ыңгайын тапса өздөрү деле жасоодон баш тартпай турган иштерге кыздарынын жана сиңдилеринин барышына жол коё алабы?"},{"t":"p","h":"Ата-энелер уулдарынын үй тиричилигиндеги түйшүктөрдү көбүрөөк аткарышын колдошу мүмкүнбү? Алар кыздарынын чечим кабыл алуудагы талкууга катышканын туура деп табабы?"},{"t":"raw","h":"<div class=\"gloss\"><p> <\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"58\">58<\/span>Пялдар Жан"},{"t":"p","h":"111, 15-тапшырма. Келин болу жакшыбы? 10мүн."},{"t":"h3","h":"Үч-төрттөн болуп, Жамийла аттуу кыз туш келген кырдаалдын оң-терс жактарын талкуулагы"},{"t":"p","h":"Жеобунарды далилдееге даярдангыла."},{"t":"p","h":"“Шаарда туулуп өскөн Жамийла алыскы айылдан келген, үйбүлөсүндөгү эң кичүү, алтынчы уул болгон Эркинге турмушка чыгууну каалайт”,"},{"t":"p","h":"Жамал Ташибекова"},{"t":"p","h":"40 жылдыгы” тигүүчүлүк фабрикасында цехтин бригадири болуп иштее менең сийинчерээк “Киргизия” фирмасынын башкы инженери, директору болот. 1980-жылы, ССРинин Министрлер Советинин төрагасынын орун басары, тышкы иштер министри дайындалат жана республикадагы Аялдар советинин төрайымы, Советтик аялдар комитетинин мучесу болуп шайланат. Бул жылдар аралыгында ал саламаттыкты сактоо менен билим берүүнү, илимди, маданиятты жана спортту өнүктүрүү үчүн көп иштерди жасаган. Эн. менен баланы коргоо ишине, көп балалуу жана жалгыз аялдардын, баатыр энелердин жана пенсионерлердин абалын жакшыртууга абдан зор салым кошкон."},{"t":"p","h":"1986-жылдан бери Жамал Ташибекова Чет өлкөлөр менен достук жана кызматташтык коомдорунун Кыргызстандагы союзунун президенти болуп иштеп келе жатат. Элдер достугун жана өлкөлөр ортосундагы кызматташтыкты бекемдөөгө кошкон салымы үчүн Кыргыз Республикасынын атайын жана ыйгарымдуу элчиси даражасына ээ болгон, 1998-жылы Бишкекте Кыргызстандын Аялдар уюмдарынын федерациясы түзүлгөндө, анын төрайымы болуп Ташибекова"},{"t":"p","h":"Курманжан датка Курманжан Датка, Курманжан Маматбай кызы (1811 – 1907-жж) – алайлык кыргыздардын башкаруучусу. «Алай ханышасы» деген ат менен белгилүү. Оштун аймагын жердеген мунгуш уруусунун баргы уругунан чыккан. Кудалап барган биринчи күйөөсүн чанып, атасынын төрүндө үч жыл Отурган. 1832-жылы Алайды башкарган Алымбек датканы жактырып, ага турмушка чыккан. Аны менен 29 жыл бирге жашап, анын акылдашы, көмөкчүсү болгон, 5 бала төрөгөн. 1862-жылы күйөөсүн Кокон ханынын сарайындагы козголоңчулар өлтүргөндөн кийин Алайды башкарууну Курманжан өз колуна алат. 1864-жылы Бухара эмири ага Датка деген мансап наамын ыйгарган. Даанышман аял кыргыз урууларынын ички чыр-чатактарын басып турууга өз үлүшүн кошкон. Алардын биримдиги аркылуу Кокон хандыгына көз каранды болбоого умтулган. Мындай аракет орус аскерлери Фергана аймагына кирип келгенде да байкалган. Курманжан датканын балдары Россиянын букаралыгына өтүүдөн баш тартып, Кашкар тарапка көчүп кеткен. Бирок саясий кырдаалды түшүнгөндүктөн, 1876-жылы алайлык кыргыздардын Россияга кошулгандыгын билдирген. Падышачылык бийлик Курманжанга полковник чинин берген. 1881-жылы Россия императору Курманжанга жылына бир берилүүчү 300 рубль пенсия чектеген. 1902-жылы Ак падыша даткага бриллиант менен кооздолгон алтын чынжырлуу алтын саатты белекке"},{"t":"p","h":"(Кыргызстан тарыхы (Эң байыркы доордон азыркы мезгилге чейин), Бишкек 2003-ж., Ө.Ж,Осмонов, А.А.Асанканов)"}],"sub":[],"pages":[46,58]},{"title":"XVI бап. Жарандык коом","blocks":[{"t":"h2","h":"<span class=\"pg\" data-n=\"59\">59<\/span>XVI бап. Жарандык коом"},{"t":"h3","h":"Текстти окуганга чейинки көнүгүүлөр"},{"t":"v","l":["ф * 01-тапшырма. Терминдер жана аныктамалар 58 мун.","","Эки-экиден болуп, терминдерге аныктамаларды тандагыла.","","а) Жарандардын жана уюмдардын салык төлөбөй эле айрым бир"]},{"t":"p","h":"муктаждыктарга акча иштетүүсүнө мүмкүнчүлүк берген юридикалык нормалар."},{"t":"p","h":"б) Башка адамдар үчүн өз кызыкчылыктарынан баш тартуу."},{"t":"p","h":"в) Бир дагы дин өзгөчө статуска ээ болбогон, бардык диндер бирдей каралуучу, динден белек турган мамлекет."},{"t":"p","h":"г) Айрым адамдарга эле эмес, бүтүндөй коомго пайдасы бар максаттар тууралуу идея."},{"t":"p","h":"д) Жалпы максатты көздөп, коомдук саясатка таасир этүүгө аракеттенген"},{"t":"h3","h":"адамдардын уюмдашкан тобу."},{"t":"v","l":["(| Окууүчүн текст","“Жалпы жыргалчылык” деген эмне?","","Биздин иш-аракеттерибиз баарыбызга,","каңдайдыр ир мМаседалерди"]},{"t":"p","h":"болбосо элдин көпчүлүгүнө пайда келтирсе, зарыл болуп калганда, өкмөттүн жыргалчылыкка” кызмат кылып жатабыз десек болот. жардамын күтүп отура бербестен мисалы, көчөдө ар бир адам акыр-чикирди туш келди өздөрү чогуу аракеттенүүгө тийиш ыргытпай, урнага салып жүрсө, мунун пайдасын баарыбыз түшүнүшөт. көрмөкпүз, анткени айлана-чөйрөдө тазалык, тыкандык Демилгени колго алуу менен алар болгону элдин бардыгына жагат эмеспи."},{"t":"p","h":"“Жалпы жыргалчылык” үчүн эмгектенүү – бул өзүңдү эле эмес, башка адамдардын дагы кызыкчылыктарын ойлой активдүү катышат. Демократиянын жүрүү. Биздин таламдарыбыз сөзсүз эле башкалардын ургаалдууенугуиу жанаиштепкетиши кызыкчылыктарына карама-каршы келе бербейт. үчүн эң элезарыл факторлордун бири – Тескерисинче, демейде жакын арадагы адамдар бактылуу, бул жарандык коомдун активдүүлүгү. бай жашаса, биз үчүн дагы жакшы, анткени мындайда Бул бапта биз төмөндөгүлөрдү бүткүл өлкө гүлдөп өнүгөт."},{"t":"p","h":"Кээде элдин камын көрүп жатам деген адамдар чындыгында өздөрү коом үчүн абдан жакшы болот"},{"t":"raw","h":"<h4 class=\"mk\">а) жарандык коомдун б) жарандык коом жана коомдук бирикмелер; в) жарандык коомдун<\/h4>"},{"t":"p","h":"деп ойлогон нерсени башкаларга таңуулап, алардын атынан чечим чыгарууга умтулушат. Алар коомго пайда келтиребиз деп чын ыкластан ойлосо да, иш жүзүндө жаңылышы ыктымал. Чындап келгенде ар бир адам өзүнө жакканын тандайт, өзү каалаган чечимге келет."},{"t":"p","h":"«Жарандык коомдун аныктамасы"},{"t":"p","h":"Туулгандан тартып эле силер жарандык коомдун мүчөсү болосуңар. Демек, кичинекей бөбөктөн президентке чейин бардык адамдар жарандар деп таанылат."},{"t":"p","h":"Азыркы учурда жарандык коом дегенде көбүнчө үйбүлө менен мамлекеттин ортосунда турган <span class=\"pg\" data-n=\"60\">60<\/span>бардык коомдук топтордун жана уюмдардын, түрдүү түмөн институттардын жыйындысын түшүнүшөү"},{"t":"raw","h":"<div class=\"gloss\"><p>Жарандык ч Г орн СЕ ТҮС ЖУ е 1. Жалпы жыргалчылык Га ОЙЛЕ буу ЫК ды 2. Салыктан бошотуу 3. Таламдаш топ ла аА 4. Альтруизм Аш, бз ус! 5. Дүнүйөчүл мамлекет г Е лла, жакшы экендигин ря карап чыгабыз: аныктамасы; Ни ЕЕ. элементтери. 1.0 алаа а<\/p><\/div>"},{"t":"p","h":"Активдүү жарандык коомдо адамдар, мисалы, төмөндөгүлөрдү жасай алат:"},{"t":"v","l":["&gt; ез жанын жана жакындарын багуу учун иштейт;","&gt; искусство чыгармаларын жаратат;","&gt; спорттун командалык түрлөрү менен алектенет жана ар түрдүүчө активдүү эс алат;","башкаларга, мисалы, жардыларга жардам берүүгө аракеттенет;"]},{"t":"p","h":"өкмөттүн ишмердигин белгилүү бир нукка багыттоо үчүн коллективдүү аракеттерди жасайт, Чогуу иштегенде адамдар “жалпы жыргалчылыкты” камсыздоого умтулушат, бирок алардың бул ул иш-аракети өкмөттүн ишмердик чөйрөсүнөн бөлөк турат. Албетте, өкмөт дагы бардык адамдардың жыргалчылыгы үчүн дайыма кам көрүүгө тийиш. (Жарандык коом түшүнүгүнө аныктама бергенде кээде өкмэткэ карата оппозицияда турган уюмдарды гана ойлошот. Бул туура эмес, анткени Өкмөткө карата бейтарап позицияда турган уюмдар да, өкмөттү колдогондору да жарандык коомдун бөлүгү болуп саналат. Мисалы, демилгеси боюнча окуучулар түзүп жаткан окуучулардын ишчил комитеттер жарандык коомго кирет. Алар көбүнчө айрым бир маселелерди чечүү, мисалы, колунда жокторго жардам берүү үчүн жергиликтүү өз алдынча башкаруу органдары менен тыгыз кызматташат)."},{"t":"p","h":"Жарандык коомго туура аныктама берүү үчүн биз адамдын ким экендигине эмес, ал кайсы бир ишмердикти жүргүзгөндө кимдин өкүлү болоруна көңүл бурушубуз керек."},{"t":"p","h":"эгер өкмөттүк мекемеде иштеген адам өзүнүн жумушуна тиешеси жок ишке катышса (мисалы, кылмыштуулукту азайтуу үчүн чечкиндүү чараларды көрүүгө өкмөттү үндөгөн коомго кошулса), аңда бул адамдын ушул уюмдун мүчөсү катары аткарган иш-аракеттери жарандык коомдун ишмердигинин бөлүгү болуп саналат да, ал эми өкмөттөгү иши буга кирбейт."},{"t":"p","h":"Бул өкмөттүк мекемелерде иштеген айрым адамдар да жарандык коомдун бөлүгүн түзөөрүн билдирет. Мисалы, эгер президент кыргыз адабиятына көбүрөөк кызыкса, адабиятчылардын клубуна мүчө боло алат. Бирок бул топто иштеген убактысында президент башка бардык мүчөлөр сыяктуу эле катардагы жаран болот. Саясий партиялардагы мамилелерди түшүнүү үчүн бул концепциянын мааниси абдан зор. Атүгүл өкмөттү колдогон саясий партиянын ишине катышып жаткан болсо да, мамлекеттик кызматкер жарандык коомдун өкүлү болот. Мындай ишке адам өзүнүн ынанымы (ишеними) боюнча барышы, карамагындагы мамлекеттик ресурстарды бул үчүн пайдаланбашы керек экендиги түшүнүктүү, {Бул акылга сыйбас жорук болмок, анткени каалаган мамлекеттик кызматкер жарандык топтун мүчөсү катары мыйзам чыгаруу процессине таасир этүүгө аракеттене берсе, кызыкчылыктардын каршы келишинен! улам чатак чыгары анык)."},{"t":"p","h":"Кыргыз Республикасынын “Жарандардын 2.0 Жарандык коом жана биригүү укугу сунуштарын, даттанууларын жана арыздарын караштыруу тартиби жөнүндө” Адамдын негизги укуктарынын бири мыйзамы – бирикме, ассоциация түзүү, алардын ишине Кыргыз Республикасынын Конституциясына катышуу укугу. Бул чогулушуп, өз ыктыярлары жана мыйзамдарына ылайык, бардык мамлекеттик менен бир топко биригүү укугун билдирет. органдар жарандардын өкмөттүк, коомдук"},{"t":"p","h":"Эркиндиктин башка түрлөрүндөй эле, жана башка мекемелерге алардын ишмердигин бул дагы эң түпкү, негизги эркиндик менен – жакшыртуу жөнүндө жазуу же оозеки түрдө сунуш ар бир адамдын жашоо жана иш-аракет кылуу КИРГИЗУУ, арыз берүү жана кызмат адамдарынын укугу менен чектелип турат. Мисалы, биз башка иш-аракетине карата даттанып кайрылуу"},{"t":"p","h":"Вх укугун камсыздоого тийиш, Жетекчилер болсо адамдарга зыяны тие турган бирикме түзбөшүбүз жарандардын сунуштарын, арыздарын жана керек. даттанууларын кабыл алып карап чыгуу үчүн"},{"t":"p","h":"Бирок биз, мисалы, төмөндөгүдөй максат- жекече жооп берет. Мыйзам боюнча, эгер тарды көздөп, ээн-эркин эле бириге берсек болот: жаран кабыл алынган чечимге макул болбосо, &gt; концерт уюштуруу;"},{"t":"p","h":"жапайы жаныбарлар менен канаттууларды коргоо;"},{"t":"p","h":"коом турмушун жакшыртуу үчүн изилдөө топторун түзүү;"},{"t":"p","h":"ошол чечимди кабыл алган орган (же мекеме) же болбосо сотко кайрылып даттанууга укуктуу."},{"t":"p","h":"(Улуттук Демократиялык Институттун жарыясынан, 2004-жыл)"},{"t":"p","h":"саясий топторду түзүү. (Саясий партиялардын эркиндиги – бул абдан маанилүү укук, анткени саясий партиялар элдин жалпы кызыкчылыктары боюнча биригүү укугун чагылдырат). Кызыкчылыктардын каршы келиши ар башкача милдеттенмелердин кагылышып калышынан келип чыгат. Мисалы, судья эч качан өзүнүн достору же туугандары катышкан иштерди карабашы керек, анткени мындай учурда адамдар соттук териштирүүнүн калыс жүргүзүлөрүнө ишенбейт, <span class=\"pg\" data-n=\"61\">61<\/span>Сани тамленетти зашкарууза патышу) поовунцавы силарцин"},{"t":"p","h":"Бирикме же ассоциация тузуу учун Анын пикирде мүчөлөрү кандайдыр бир жалпы максатты же идеяны көздөп иш жүргүзүнү керек. Мындай максат, мисалы, карыяларга жардам берүү же сперттум кайсы бир түрү менен алектенүү болушу мүмкүн. Максат сөзсүз эле саясий мүнөздө болушу зарыл эмес Уюмдун бардык мүчөлөрү катышын турушу зарыл. Тепло канчалык кей болсо ал оідончолук күчтүү келет. Чогуу иітешип жатканда ынтымактуу оирикмедеги адамдар бири-бирине дем берип, жалпы кызыгууну күчөтүшөт. Мындай бирикменин ар бир мүчөсү жалпы ишке чындап берилет Чогулуш өткөрүү укугу мыйзам тарабынан коро уі® гийм мамлекет дугуна коркунуч келген учурдагы өзгөчө кырдаалдарда гана бирикь&amp;"},{"t":"v","l":["Өз жетекчилери менен өкүлдөрүн шайлап в","укугу","","Жарандын коомдун элементтери","","Жарандык коомдун курамына төмөндөгү элементтер кирет","мындай укугу болбйт)","арыл","","а) таламдарына, мунун ичинде ишкер кызыкчылыктарына ка ай бири» ки тоштор","б) саясий партиялар;","в) диний топтор жана адеп-ахлак дөөлөттөрүн сактоону үгүттөгөн башка уюмдар","г) ММК (буга телекөрсөтүү, радио, гезиттер ж.у.с. кирет, алар кийинки байтарза каралат)","","Жарандык коом жана мамлекеттик бийлик"]},{"t":"h3","h":"коом"},{"t":"v","l":["– БӨУ","ммк","Коомдук клубдар","Лоббилөө топтору","Диний топтор"]},{"t":"p","h":"Диаграмма боюнча түшүндүрмө: мында бардык өлкөлөрдөгү абал чагылдырылган эмес, анткени бул ар бир коомдогу мыйзамдарга жараша болот."},{"t":"p","h":"Таламдаш топтор жана ишкер топтор Таламдаш топтор – кайсы бир жалпы максаттарды көздөгөн адамдардын уюмдашкан топтор Бирок бул аныктамага кылмышкер топтор кирбейт, себеби алардын негизги максатынын мамлев жана коомду башкарууну жакшыртууга эч кандай тиешеси жок. Таламдаш топтордун саясий топтордон айырмасы – алар демейде саясий кызматтарга талапкер көрсөтүшпөйт да, эреже катары мамлекетти! органдардын ишине түздөн-түз катышпайт, Таламдаш топтордун үч түрү бар, бирок алардын айрым функциялары дал келиши мүмкүн:"},{"t":"p","h":"комм циялык эм, юмдар; негизинен, өз мүчөлөрүнүн каржылык эме таламдарын талашууну көздөгөн топтор. Буларды өбүнчө кыскартып “БОУ” (орусча- НПО) дешет. Бира <span class=\"pg\" data-n=\"62\">62<\/span>кабыл алына турган мыйзамдардын мазмунуна тРЕЗ дүйнө жүзүндөгү жарандык коомдун атайын таасир этүү үчүн түзүлүүчү лоббилөө"},{"t":"raw","h":"<div class=\"gloss\"><p>кач 3.1<\/p><\/div>"},{"t":"v","l":["топторунан айырмаланып, БӨУ өздөрү чечмекчи","бөлүгү катары","ТЁЕб","демократиялык","процесстерди"]},{"t":"p","h":"болгон проблемаларды коомчулукка тааныштырат енухтуруу жаатында ар кайсы мамлекеттердин жана бул багытта коомдук акцияларды! өткөрүп өкмөттөрү менен иштешип жатса да, муну мамлекеттик же мамлекетке көз каранды турат, Буга спорт клубдарын, согуш ардагерлеринин ишмердик дегенге болбойт. Эң оболу мында же пенсионерлердин же жесирлердин ассоциациясы ез өлкөңөрдүн жарандык коомунун мүчөсү мисал болот. Кээ бир БӨУлар өздөрүнүн мүчөлөрүнө болгон силердей адамдарга көңүл бурулду, гана жардамдашат, бирок башкаларга көмөк ТРЕБ – бул эларалык коммерциялык эмес көрсөтө тургандары да бар, мисалы, жетимдерге бейөкмөт уюм. Ал ар кайсы мамлекеттерден кайрылышкандар. БӨУ мүчөлөрү дайыма болбосо жана – башка булактардан каржылык (финансылык) жардам алып, көп Өлкөлөрдө да көп учурларда ыктыярдуу иштерди жүргүзүшөт. ү жүргүзөт... Тушкен каражат Уюмдун мүчөлөрү менен анын акы алып иштеген акысыз таратылуучу жабдуулар йена кызматкерлерин чаташтырбоо керек. Уюмдардын материалдарды сатып алууга жумшалат, көп мүчөлөрү болот, бирок чындыгында алар ошол Ошондой эле иштегендердин эмгек акысын уюмдардын кызматкерлери деп эсептелбейт. Бирок төлөөгө да акча ажыратылат, анткени ТЕЕ$5$тиң уюмга мүчө адам акы төлөнүүчү жумушту да алистери толук жумуш күн менен иштейт, Бул ишке ыктыярдуулар (волонтё рлор) да аткарышы мүмкүн."},{"t":"p","h":"тартылган, Эларалык ТЕЕ5$ уюмунун кожоюну ез кызыкчылыктарын көздөгөн топтор. Мындай уюмоар же компанияла г. жок, бул уюм киреше да албайт. шг уюмдардын башкы максаты – мүмкүн болушунча көбүрөөк пайда табуу. Ырас, атаандаштарын айтпаганда, бул сөзсүз эле алар бөлөк адамдардын таламдарына каршы иш кылат дегенди билдирбейт. Чындыгында жеке компаниялар өндүрүштү жүргүзөт, товар жеткирет, ошентип адамдарды жумуш менен да камсыздайт, Башка бирикмелер сыяктуу эле булар дагы өз кызыкчылыктарын демейдеги ыкма менен, мисалы, саясий партиялар жана массалык маалымат каражаттары аркылуу туюнта алышат."},{"t":"p","h":"Жеке фирмалар менен компаниялар жарандык коомдун бир бөлүгү болуп саналат. Андыктан товар жеткиргенде же тейлөө кызматын көрсөткөндө алар өздөрүнө эле эмес, башка адамдарга да пайда келтирет, Адамдар бул процесстерге түздөн-түз катышып, ал эми компаниялар зарыл нерселерди сырттан башка бирөөлөрдү кийлигиштирбей эле жеткирип турат. Көбүнчө мамлекеттик органдар кийлигишпеген же аралашпаган ишкер бүтүмдөр кыйла натыйжалуу болот. (Эгер товардын же тейлөөнүн сапаты начар болсо, мамлекет демейде керектөөчүлөрдүн таламын коргойт)."},{"t":"p","h":"Дал ушул себептен улам жарандарынын экономикалык турмушуна мамлекет аз кийлигишкен өлкөлөр адатта гүлдөп өнүгүшөт."},{"t":"p","h":"Мамлекет да бизнес ишканаларга ээлик кылат, бул дагы жалпы жыргалчылык үчүн жакшы. Бирок муну биз жарандык коомдун ишинен айырмалай билүүгө тийишпиз."},{"t":"p","h":"3) Лоббилөө топтору: өлкөдөгү мыйзамдардын кабыл алынышына өз мүчөлөрүнүн атынан таасир этүү максатында атайын түзүлө турган таламдаш топтор. Лоббилөө топторунун башка таламдаш топтордон олуттуу айырмасы – булар көбүнчө жеке компаниялардын же кесиптик уюмдардын атынан чыгышат да, өз мүчөлөрүнүн таламдарына туура келгендей кылып өлкөнүн мыйзамдарын өзгөртүүгө далалат кылышат. Мындай топтор, айрыкча акчага байланышкан кызыкчылыктарды коргогондо, саясий процесстерге абдан зор таасир тийгизиши мүмкүн. Лоббилөө топтору саясий партиялардын жана алардын шайлоодо көрсөткөн талапкерлеринин фонддоруна акчалай салым кошо алышат. Мисалы, өкмөттүн пенсияны жогорулатуусуна жетишүү үчүн бириккен кары адамдардын лоббилөө тобу болушу мүмкүн."},{"t":"p","h":"Көпчүлүк өлкөлөрдүн мыйзамдарында саясий өнөктүктөргө кошула турган бардык акчалай салымдар тууралуу жарыя айтылышы талап кылынат. Бул кайсы бир мыйзамчы кандайдыр бир кызыкчылыктары бар адамдардын тобунан ири суммада акча алганда келип чыга турган проблеманы коомчулукка билдирүү үчүн зарыл чара. Эгер мыйзам чегинде жасалса, саясий партиялардын чоң акча алышы айыпталбайт. Мындай иш-аракеттерди массалык маалымат каражаттары менен эл көрүп-билип турса, экономикалык зор күч-кубаты бар адамдардын тескери таасирине бөгөт коюу үчүн өбөлгө түзүлөт."},{"t":"p","h":"Таламдаш топтордун функциялары Нормалдуу коомдо таламдаш топтор, алардын ичинен лоббилөө топтору бар болушу керек. Айрыкча өкмөт өз дарегине сын айтылышына жол койбогон мезгилде бул өтө зарыл. Демократиячыл коомдун рзек элементи – бул таламдаш топтордун демилгеси менен эл алдына чыгып жүргүзүлө турган ачык сүйлөшүү. Себеби алар:"},{"t":"p","h":"'Акция – 1) капиталга кошкон үлүшү бар экендигин күбөлөндүргөн баалуу кагаз; 2) коомдук иш-чара."},{"t":"p","h":"<span class=\"pg\" data-n=\"63\">63<\/span>ааштарууаа татышуу – Жаранфыпл поомуидавы силердин ролунар"},{"t":"p","h":"&gt; Элдин өкүлдөрү катары мамлекеттик органдарга чыгат, аларга элдин мүдөөсүн (каалоосун), жашоо абалын билдирет, колдонуудагы мыйзамдарга өзгөртүүлөрдү киргизүүнү сунуштайт. Коомчулукту тарбиялайт. Таламдаш топтор коомчулуктун колдоосуна муктаж болгондуктан, өздөрү козгогон маселелерди шайлоочулар да, мамлекеттик кызматкерлер да, шайланма органдардын депутаттары да жакшы түшүнсүн үчүн көп аракет жасайт Адамдарды саясий ишмердикке катыштырып үйрөтөт. Кээде адамдар саясий партияларга мүчө болгусу, кайсы бир органга шайлангысы келбейт. Алар таламдаш топтордун ишине катышса, саясий турмушка өз салымдарын кошуп, бул жагынан тажрыйба толтой алат."},{"t":"p","h":"Коомду өнүктүрүү максатында мамлекеттик аппарат жана саясий ишмерлер менен биргелешип иштешет."},{"t":"p","h":"Көбүнчө саясий партиялардын карашы зарыл болгон маселелердин тематикасын сунуш кылат. Саясий ишмерлер жарандардын ой-пикирлерин уга билүүгө тийиш, андыктан таламдаш топтор жарандар менен алардын өкмөттүк органдарга шайлап жаткан сүйлөштүрө алат. Мамлекеттик органдардын ишине көз салат. Демократиялык процесстин маанилүү өзгөчөлүгү – мында мамлекеттик органдар коомчулуктун көзөмөлүндө болот. Таламдаш топтор, мисалы, өкмөт мыйзамдарды турмушка ашыруу үчүн эмне кылып, салык төлөөчүлөрдүн акчасын кандай сарптап жатканын көзөмөлдөй алат."},{"t":"p","h":"ТРЕЗТИНн кызматкерлери “Реасе Виі1аіпд Сгоир” (Тынчтык орнотуу тобу) коомдук фондунун аткаруу директору Индира Саткыналиевна Раимбердиевадан интервью алган."},{"t":"v","l":["– Эмне учун Сиз чыр-чатактарды жөнгө балуу масёлесине кызыгып калдыңыз?","– Кыргыз-Россия (Славян) университетинин эларалык мамилелер факулп","таануу” багыты боюнча бүтүргөнмүн. Экинчи курстан тартып эле ар түрдүү кон"]},{"t":"p","h":"айрыкча улуттар аралык жана диндер аралык чыр-чатактардын себептерине кызыга баш Таанымал психологдордун бири Ж. Бугенталь мындай деген экен! “Конфликт – бул биздин жашоодогу табигый көрүнүш. Муну биз күндөлүк турмушубузда дайыма байкап жүрөбүз. Конфликтке кандай мамиле кылганыбызга жараша биз өзүбүздүн кандай жашап жаткандыгыбызды туюнтабыз”. Дипломдук ишим Тажикстандагы конфликтке арналган эле. Ошбийп бери менин кесиптик ишмердигим биздин көп улуттуу өлкөбүз кабылып жүргөн конфликттерди женге салуу менен байланышып келет."},{"t":"p","h":"– Бейекмет уюмдар тармагында иштешинизге эмне туртку болду?"},{"t":"p","h":"– Кыргызстандагы ар түрдүү улуттар жана диндер ортосунда ынтымакты сактоо – бул мамлекет менен бейөкмөт уюмдардын биргелешип аткара турган милдети. Бейекмэт уюмдар тармагында иштегениме беш жылдан ашуун убакыт болду. Эки жылга жакын “Эларалык толеранттуулук үчүн” коомдук фондунун программалык директору катары тажик-кыргыз чегарасына жакын жашаган коомдоштуктар менен иш жүргүздүм. Ал эми “Тынчтык орнотуу тобу” дээрлик үч жыл бою кыргыз-өзбек чегарасында иштеп жатат. Анын негизги милдети – жергиликтүү коомдоштуктарды саясий жактан өнүктүрүү, ошондой эле конфликттердин алдын алуу жана тынч жол менен женге салуу. Мындан тышкары жакынкы мезгилде биздин уюм жаштардын маселелерин да колго алмакчы."},{"t":"p","h":"– Үйбүлөлүү экенсиз. Коомдук ишмердик менен үй тиричилигин айкалыштыруу сиз үчүн оорлук кылбайбы?"},{"t":"p","h":"– Ишкер аялдар үчүн кесиптик жана үйбүлөлүк милдеттерди бирдей аткаруу абдан кыйын. Бирок мен өзүмдүн энелик парзымды биринчи орунга коём. Аялдын коомдогу эң маанилүү милдети – балдарына жана жакын адамдарына кам көрүү деп эсептейм. Анткени үйбүлө коомдун негизин түзөт эмеспи. Үйдөн көңүлүң тынч болгондо гана ар түрдүү кесиптик жана чыгармачыл иштерди шыктануу менен жүргүзүүгө болот."},{"t":"p","h":"у долуп кири анин Өз мүчөлөрүнүн иштөө шарттарын жакшыртуу (мисалы, эмгек коопсуздугун камсыздоо) учун түзүлө турган профсоюздар (кесиптик кошуундар)."},{"t":"p","h":"Ишкерлер уюмдары. Булардын мүчөлөрү өз иштерине таасир этүүчү проблемаларды (мисалы, пайданы көбөйтүү же салыктар менен бюрократиялык тоскоолдуктарды азайтуу маселесин) талкуулаш үчүн чогулуп турат."},{"t":"p","h":"Кесиптик топтор (мисалы, врачтардыкы же мугалимдердики). Буларга мүчө болгондор ошол кесиптегилердин көпчүлүгүн кызыктырган маселелерди, жаңы усул, ыкмаларды жайылтуу, аларды өркүндөтүү жолдорун талкуулаш үчүн чогулуп турат. Мисалы, оорулууларды жакшы карап-багуу же сабакты кантип мыкты окутуу ыкмалары сөз болушу мүмкүн."},{"t":"raw","h":"<div class=\"gloss\"><p>63<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"64\">64<\/span>Жарандын тоо"},{"t":"p","h":"Бош убакытты чогуу өткөрүү, баарлашуу, ырдоо, тамак-аш рецепттерин (даярдоо эрежелери) алмашуу же башка нерселерди үйрөнүү үчүн чогула турган социалдык топтор, ийримдер, Кайрымдуулук уюмдары муктаж адамдарга, оорулууларга, карыяларга, жаштарга, ошондой зле бангилик же ичкиликке берилип кеткендерге материалдык жардам көрсөтүп, аларды, жашоосунун оңолушуна түздөн-түз таасир этет, Демейдеги чиркөө же мечит каадаларынын чегинен сырткары турган иштерге өз мүчөлөрү, аралаштыруучу диний топтор. Маселен, жаштардын дин жагынан жакындашуусу жана кайс бир динге киргендердин көбөйүшү мына ушундайча жүрөт."},{"t":"p","h":"Жарандык топтор – булар жалпы маселелерди чечүүгө, мисалы, экологиялык кырдаалды жөнгө салып, айлана-чөйрөнү ыңгайлуу, коопсуз кылууга кызыгат."},{"t":"p","h":"Кээ бир өлкөлөрдө коомдук турмуштун диний (мисалы, сыйынуу, орозо кармоо) жана диний ›мес (дүнүйөчүл) жактары так айырмаланат. Дүнүйөчүл мамлекет – бул бир дагы дин өзгөчө статуска эу болбогон, бардык диндер бирдей каралуучу мамлекет. Мындай өлкөлөрдө ар түрдүү диндерге © Ишенгендер ынтымактуу жашай алат. Дүнүйөчүл мамлекетте бир дагы диний көз караштын кемсин` гилбеши, ар кыл топтордогу адамдардын ыйык, куттуу нерселерди ар башкача түшүнүшү, аларга ар түрдүүчө сыйынышы үчүн өбөлгө түзүлөт, Өз ишенимдерин бөлөктөргө таңуулабаган шартта ар кайсы диндердин өкүлдөрү өздөрү туура деп эсептеген каадаларды толугу менен аткара алат."},{"t":"p","h":"Бул топтордун айрымдары чындыгында эле саясий максаттарды көздөп ушуга ылайык иш жүргүзөт, ал эми башкалары саясатка такыр кызыкпайт."},{"t":"p","h":"БӨУлардын ишмердиги жана салык салуу Пайда алууну көздөгөн иштерден коммерциялык эмес иштерди так айырмалоо дайым эле оңой боло бербейт. Кепчулук өлкөлөрдө бул эки башкача ишмердикти жүргүзгөн бирикмелер мыйзамда бөлөк-бөлөк каралып, булардан салык дагы эки башкача алынат (же коммерциялык эмес уюмдардан алынбайт),"},{"t":"p","h":"Бул башка адамдарга жардам берип жаткан топторду салыктан бошотуу үчүн зарыл. Мунун өзү коммерциялык эмес БӨУлар коомго пайдалуу деп эсептегендикти билдирет. Анткени булар мамлекеттик органдар жана жеке ишканалар менен кызматташып, мүмкүнчүлүктөрү жок адамдарды тейлешет, аларга жардам беришет."},{"t":"p","h":"Маселен, жеке компания төлөргө акчасы жок кишилерге азык-түлүк таратпайт, минтсе зыяң тартып калат. Ал эми кайрымдуулук уюмдары эң арзан баада бере алышат. Анткени алар азык-түлүк сатып алганга жумшаган сумманын эсебинен салык же кызматчыларга, көбүнчө волонтёр (ыктыярдуу, өз каалоосу менен жардам берүүчү) болуп бекер иштегендиктен, эмгек акы төлөшпөйт. Бирок мындай Уюмдар салыктан бардык эле өлкөлөрдө бошотулган эмес, бул болсо алардын абалын бир топ кыйындатат,"},{"t":"p","h":"3.2 Саясий партиялар"},{"t":"v","l":["Саясий партиялар жарандык","коомдун бөлүгү болуп саналат, бирок","іемейде алардын статусу башка бейөкмөт","уюмдардан айырмаланат."]},{"t":"p","h":"Саясий партияларга айрым мүчө-"},{"t":"v","l":["лөрүнүн өкмөт курамына кирип, партия","%","жактырган саясатты жүргүзүшү үчүн","аракеттеген адамдар биригет Мына","ушунун өзү саясий партияларды башка","уюмдардан айырмалап турат. Бирок,","коздеген максатына жетишкен кунде деле,","алар жарандык коомдун белугу бойдон","калат. Анткени партиянын мүчөлөрүнүн","көпчүлүгү демейде өкмөттүк кызматта","иштебейт, ал эми партиянын көп мүчөлөрү","каалаган нерселерди өкмөт иш жүзүнө","ашырбай коюшу да мүмкүн."]},{"t":"p","h":"Саясий партиялар жарандык коом менен өкмөттү байланыштырган көпүрөнүн милдетин аткарат десе болот."},{"t":"p","h":"<span class=\"pg\" data-n=\"65\">65<\/span>вашпаруува капиышуу ХХ) пылыжцын коожундавы сидерцин розунар"},{"t":"p","h":"Төмөндө айрым саясий партиялар жана алардын саясий багыттары жөнүндө кыскача маалымат берилди, 2004-жылдын башында Кыргызстанда 43 катгалган партия бар элс."},{"t":"p","h":"а) Кыргызстан социал-демократиялык партиясы (КСДП) Партиянын лидери Атамбаев Алмазбек Шаршенович. Партиянын стратегиялык максаты республикада социалисттик жана капиталисттик системал ірдын мыкты жак тарын айка тыштыруу менен чыныгы демократиялык укукчул коомду куруу. КСДИ теменлагулерду жактайт бардык жарандардын укуктары менен эркинди"},{"t":"v","l":["эгемендигин иш жүзүндө коргоо","Кыргызстандын экономикалык жана руханий (мада","дап, Кыргыз Республикасынын","","еллектуалдык, чы! армачылык)"]},{"t":"p","h":"прогресске жетишүүсү, дүйнө коомчулугу менен ачык-айрым мамиле түзүп, тен укукта интеграциялашуу экономикалык өзгөрүүлөрдүн жүзөгө ашырылышына эн жогорку деңгээлде өбөлгө гүзө турган саясий туруктуулукту камсыздоо"},{"t":"v","l":["менчик формаларынын ар түрдүүлүгү","мамлекеттин экономикага жана коомдогу иштерге азыраак кийлигишүүсү","жарандардын укуктарынын сакталышын ишенимдүү түрдө камсыздоо"]},{"t":"p","h":"Кыргыз Республикасынын КМШдагы башка өлкөлөр менен болгон экономикалык жана саясий байланыштарын бекемдөө тышкы экономикалык ишмердикти, Кыргызстандын экономикасынын дүйнөлүк базарга инте грацияланышын либералдаштыруу."},{"t":"v","l":["Партиянын жетекчи органдары: саясий кенеш, курултай","б) Кыргызстан коммунисттер партиясы"]},{"t":"p","h":"Партиянын Борбордук аткаруу комитетинин төрагасы – Бактыбек Бекбоев. Партия өз ишмерлигинде марксисттик-лениндик философияны жетекчиликке ала тургандыгын жарыялайт Партиянын программалык максаттары жана милдеттери:"},{"t":"p","h":"кеңештер түрүндөгү чыныгы элдик бийликти орнотуп, ага коомдун бардык катмарларынын өкүлдөрүн катыштыруу мыйзам үстөмдүгүн бекемдөө жана бийликтин бардык бутактарынын иш жүзүндөгү көзкарандысыздыгын камсыздоо президенттин аткаруу жана сот бийлигин калыптандыруудагы ыйгарымдарын чектөө КМШ өлкөлөрү менен экономикалык, саясий жана аскердик байланышты тереңдетүү экономикадагы реформаларды башаламандыктан арылтып, социалдык багыты бар пландуубазар мамилелеринин нугуна түшүрүү айыл жеринде башкы ролду жамаатчыл чарба жүргүзүү формаларына таандык кылуу экономиканын орчундуу тармактарында мамлекеттик менчикти орнотуу бийликтин үч бутагынын тең шайланмалуулугу."},{"t":"p","h":"Мамлекетти башкаруу жаатында партия Кыргызстан үчүн парламенттик башкаруу формасы алгылыктуу деп эсептейт. Партиянын жетекчи органдары: аткаруу комитети, курултай,"},{"t":"v","l":["в) “Ар-намыс” партиясы","Партиянын төрагасы – Кулов Феликс Шаршенбаевич.","Партиянын программалык башкы максаттары жана милдеттери:"]},{"t":"p","h":"чыныгы укуктук, демократиялуу мамлекетти куруу жана коомдун экономикалык, саясий жана руханий жактан эркин өнүгүшү учун өлкөнүн тарыхый-маданий өзгөчөлүктөрүн эске алуу менен реалдуу шарттарды түзүү аркылуу Кыргызстанда татыктуу жашоо-турмушту камсыз кылуу Кыргызстанды кризистен алып чыгуунун жана аны Борбордук Азиядагы финансы-банк борборуна айландырууга кызмат кылчу шарттардын бири катары ишенимдүү финансы-банк системасын түзүү эмгекчилердин бакубат жашаган жана татыктуу турмуш-тиричилик өткөргөн ортоңку катмарын кыйла көбөйтүү аркылуу коомдун бай-кедей болуп кескин түрдө бөлүнүп кетүүсүнө бөгөт коюу <span class=\"pg\" data-n=\"66\">66<\/span>Жарандым"},{"t":"raw","h":"<div class=\"gloss\"><p>&gt; &gt; &gt; &gt;<\/p><\/div>"},{"t":"p","h":"эң об ту салык саясатын жүргүз үү менен өнөр жайды жандандыруу негизги айыл чарба продукцияларына м амлекеттик заказ коюу аркылуу айылдык эмгекчи лер мамлекет тарабынан колдоо көрсөтүү мамлекеттик түзүлүш жаатында – өлкө президентинин жана өкмөт төрагасынын кызматтарың бириктирүү, же болбосо президенттин Жогорку Кеңеш тарабынан шайланышы жана аткаруучу-тескөөчү ыйгарымдарынын чектелиши сот бийлигин жарандардын укуктары менен таламд арын мыкты коргой ала тургандай кылып түп тамырынан реформалоо."},{"t":"v","l":["Партиянын жетекчи органы – саяси й кеңеш, партиянын курултайы.","г) “Менин өлкөм” либералдуу оңчул центристтик партиясы"]},{"t":"p","h":"Партиянын лидери – Ото рбаев Жоомарт Кайыпович, Ош, Жалалабат, Нарын, Ысыккөл жана Тала облустарында аймактык бөлүмдөрү бар."},{"t":"p","h":"Партиянын негизги максаттары жана милдеттери:"},{"t":"p","h":"Кыргызстандын бардык жарандарын бириктирген, улуттун жашоо максаттарын айкындага улуттук идеяны кабыл алып, жүзөгө ашыруу Адам кызыкчылыктарын, адамдын жана жарандын укуктары менен

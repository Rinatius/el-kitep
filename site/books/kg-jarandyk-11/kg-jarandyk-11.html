ндүгүн, бирок муну жүзэге ашыруу үчүн адам жетишпей жаткандыгын айтты. Ошол сүйлөшүүдөн кийин биз башка кызматкерлер менен чогуу иштеше баштадык. Мектепте болсо мугалимдердин бири балдарды ёлаксыткандан кэре сабагыңарды окугула да, экзаменге даярдангыла деп урушту. Ал ОИК мектептин чегиндеги гана иштерди камтыган долбоорлор менен иштөөгө тийиш деп эсептейт экен. Бирок биздин мектептин директору абдан жакшы киши. Идеябызды айтып бергенде ал бизге зор колдоо кэрсөттү. Ошондон кийин мугалимдер бизди жемелебей калды. Башка мектептердин алминистрациялары бизге жардам берүүнү каалаган жок. Алар силерсиз деле өзүбүздүн баш оорубуз жетишет деди. Бирок орус мектебинин директору өзүнүн мектебинен кийим чогултуп, бизге чоң жардам берди. Ал эми муктаж болгон балдар окуган мектептин администрациясы бизге материалдык-техникалык жактан көмөктөштү. Иш-чара ийгиликтүү аяктагандан кийин элдин баары буга ыраазы болгондугун айтты – чындыгында эле биздин бул акциябыз балдарга чоң пайда тийгизди. Райондук билим берүү бөлүмүнүн башчысын концертке чакырдык эле, келбеди. Ошентсе да ал кийинчерээк бул иш-чарага катыша албагандыгы үчүн кечирим сурап бизге кат жиберди."},{"t":"p","h":"– Ишиниздерде кандай ресурстар керек болду?"},{"t":"p","h":"– Биз баарынан да жергиликтүү чиновниктер менен мектеп администрациясынын колдоосуна абдан муктаж болдук. Биз мындай колдоого жетиштик. Кийин алар балдарга белек алуу үчүн акча да ажыратып беришти. Биз, ОИКтин мүчөлөрү, кеңсе буюмдарын сатып алуу, бешинчи класстын окуучулары концерт өткөргөн залды жасалгалоо үчүн акча чогулттук. Менимче, концерттин программасын түзүүдө аларга класс жетекчилери жардам берген болсо керек."},{"t":"v","l":["<span class=\"pg\" data-n=\"123\">123<\/span>– Келечекте дагы кандай пландарыны э бар?","– Мен 11-классты бүтүрүп жатам. Вы","президенттигине бизден кийинки клас","уюштуруп, анда иштеп калгандыгым учу","боюнча кеңеш бербей жүрүү мен","ары да андан кол үзбөй, жардам (","ЖОЖдордун бирине өтсөм сонун бол","менин мүмкүнчүлүктөрүм кебуроек болот,","– Кайсы адистик боюнча билим э","– Мен Кыргыз-Славян универси тинин","Келечекте социалдык укуктарды корто","Жакында ОЙКти»","ткөрдүк Бирок","лай йрым масел","лөрү","Бишкектеги же","жылык жардам уюштуру"]},{"t":"h3","h":"тапшырайын"},{"t":"p","h":"элем."},{"t":"p","h":"Адам ар дайым активдүүлүк (өзүнүн. тандоосу н жана каалоосу боюунча иш- жракез жасоо} менен пассивдүүлүктүн (аракетсиздиктин) бирин тандай алат. ІТассивдүү адамдар өз тагдырына ээлик кыла алышпайт, аларды кимдир бирөөлөр башкарат."},{"t":"p","h":"Албетте, кээде биз учун башка бирөөлөр чечим кабыл алышыи туура көрөбүз. Ден соолугубузду чыңдоо үчүн кайсы адаттардан кутулуу керектиги жөнүндө доктордун кеңеш бергенине биз дегеле каршы болбойбуз. Бирок көбүнчө биз чечим кабыл алууга өзүбүз катышууну каалайбыз. Ырас, биз байка адистердин пикирин сурайбыз жана маалыматтын кошумча булактарын издейбиз. Бирок ишке тиешеси бар адам өзү катышса, көбүнчө алда канча жакшы чечим кабыл алынат"},{"t":"p","h":"Бул демократиялуу саясий системада өзгөчө мааниге эз, анткени акыр аягында эмие кылууну жаран өзү чечиши керек. Демократия мамлекеттин жарандары абдан активдүү болгон шартта гана күчүнө кирет, а бул активдүүлүк добуш берүү менен эле чектелбееге тийиш. Коомдун өнүгүшүнө ар бир адам салым кошо алат. Акча көп болсо, бардык маселелер опоңой чечилет деп ойлошуңар мүмкүн, бирок чындыгында бул үчүн силер өз убактыңарды аябай, шык-жөндөмүнөрдү өнүктүрүшүнөр жана туура колдоно билишиңер да талап кылынат."},{"t":"p","h":"Демейде адамдар коомдук иштерге жакшы катышпай жүргөндүгүн ар кандайча түшүндүрүшөт"},{"t":"p","h":"“Менин өзгөчө талантым жок”."},{"t":"p","h":"Көп айтылып жүргөн бул сөз чындыкка кээде гана туура келет. Башкалар менен чогуу убакыт өткөрүү же балдарга жардам берүү үчүн адамдарды жакшы көрүү жана боорукердик гана керек. Коомдук иштерге бат эле көнүгүшүп алууга болот."},{"t":"p","h":"“Менин убактым жок”."},{"t":"p","h":"Башка бардык адамдар сыяктуу эле, биздин карамагыбызда суткадагы 24 саат бар. Силер, эмне, ушул убакыттын баарын өзүңөргө жана өз коомдоштугуңарга пайда келтиргенден да маанилүү иштерге жумшап жүрөсүңөрбү?"},{"t":"p","h":"“Мен тартынчаакмын, элге оңой аралашып кете албайм”."},{"t":"p","h":"Чындыгында баарыбыз эле уялчаакпыз. Уялчаактык – бул адамдын табигый мүнөзү. Ал эми активисттер менен алардан жардам алып жүргөндөрдүн чөйрөсүндө ачык-айрымдык, ынактык жана түшүнүшүү бар. Мындагы өз ара жардамдашуу силердин тартынчаактыгыңарды жеңип өтүшүңөргө өбөлгө түзөт."},{"t":"p","h":"“Менин каражатым жетишпейт”."},{"t":"p","h":"Ырас, көпчүлүк адамдар сыяктуу эле силердин да ашыкча акчаңар жок, бирок руханий байлыгыңар, жаштык жигериңер (кайратыңар, энергияңар) жана бийик максатыңар бар."},{"t":"p","h":"“Өзүбүздүн муктаждыктарыбыз деле жетиштүү”."},{"t":"p","h":"`Б, а. көбүрөөк акча таап турбасак, ата-энебизге, бир туугандарыбызга жардам бере албайбыз Албетте, биз биринчи иретте өз үйүбүздү кароого милдеттүүбүз. Чындыгында эле өзүбүздүн эң жакшы көргөн адамдарыбызга дайыма көңүл бөлүп, аларды материалдык жактан колдоп турушубуз керек. Биро! үйбүлөбүздүн жашоо деңгээли көбүнчө биздин коомдоштуктун абалына жараша болот. Эгер коомдоп бирдиктүү болуп, жакшы иштесе, ал адатта бир адамдын же үйбүлөнүн колунан келбеген иштерд бүтүрүп, адамдардын турмуш деңгээлин жакшырта алат. Буга силер аймактык өз алдынча башкару комитетинин иштерине көбүрөөк катышуу же жалпы улуттук саясий уюмдун активдүү мүчөсү болу менен жетише аласыңар."},{"t":"p","h":"<span class=\"pg\" data-n=\"124\">124<\/span>“Мен эмнеден баштарымды билбейм \", Силердин жанюо-турмушунар үчүн эмне маанилүү экендигин жана аны кандайча жакшырта аларыңарды талдап көргүлө. Адам ар түрдүү коомдук иштерге дилгирленип катышуудан зор канагат, кубаныч табат, ошондо анын иштери да жакшы жүрөт. Өз коллективиңерге жана коомдоштугуңарга кайдигер карабашыңар керек. Коомдоштугуңардын коомдук турмушуна активдүү катышкан адамдар менен сүйлөшүп көргүлө да, кийинки бөлүмдү окугула."},{"t":"p","h":"20 Бизкоомдо кантип активдүү боло алабыз?"},{"t":"p","h":"Акчалай кайыр-садага берүү ш К, Ишти ушундан башта: айлана чөйрөбүз кайрымдуулуктун пассивдүү формасы Ал"},{"t":"v","l":["боорукер адамдан эч кандай күч-аракетти деле","кандай абалда?","Биз чече турган эң маанилүү"]},{"t":"p","h":"талап кылбаса да, кайыр-садага жогору бааланат, маселелердин бири – айлана чөйрөнү анткени башкалар үчүн жакшы иш жасоого коргоо. Биз коруктарды эле эмес, өзүбүз мүмкүндүк берет. Донор бергенинин ордуна жашаган жерлерди да коргошубуз зарыл. Бул үчүн демейде төмөндөгү эң эле жөнөкөй башка бирдеме алышы мүмкүн. Мисалы, эгерде эрежелерди кимдир бирөө китепкана курууга жардам берсе, анда фамилиясы китепкананын алдында жазылып турганын көрүү ага жагымдуу болушу мүмкүн."},{"t":"p","h":"Кайрымдуулуктун активдүү түрү да бар, бул иш-аракетке түздөн-түз катышуу дегенди билдирет. Мисалы, жаштар коомдук активисттер катары келей адамдарга көмөк көрсөтүшөт, өздөрүнүн бир нерселерин беришет. Алардын бере турган акчалары жок болушу да мүмкүн, бирок убакты-лары жана жаштык жигерлери бар. Ошондой болсо да коомдук активдүүлүктүн мындай түрүн адам өз ыктыяры менен тандашы керек, Башкал: р алардын кыстоосу менен жасалган н с ж ишти ыктыярдуу түрдө аткарылды дегенге болбойт. Чындыгында коомдогу ыктыярдуу демилге жардам алган адамга да, активисттин сактоо керек;"},{"t":"p","h":"1. Акыр-"},{"t":"v","l":["чикирди туш","келген жерге","таштабоо;","2. Ташталган","акыр-чикирди","тазалоо;","3. Башкаларга","үлгү көрсөтүү;","4. Желим","бөтөлкөлөрдү","жана башка","акыр-чикирди","","Биздин кереметтүү Соңкөлүбүз ушулбу?"]},{"t":"p","h":"өзүнө да пайда келтирет, анткени ушундайча Ажайып кооздуктан таасир алып, анан өзүң таанышканда түзүлгөн жеке мамилелер демейде кандай из калтырып жатасың?"},{"t":"p","h":"зор мааниге ээ болот."},{"t":"p","h":"Көп учурларда адамдардын коомдо активдүү болушуна алардын кандайдыр бир максатка умтулуусу, өздөрүнүн башкаларга керектүү экендигин сезиши түрткү берет. Адатта кандайдыр бир коомдук иштерге катышып жүргөн пенсионерлердин денсоолугу чың болот да, жеке өзүнүн түйшүгүнөн башын өйдө көтөрө албагандарга караганда узак жашайт."},{"t":"p","h":"Өз бизнесин жүргүзүү аркылуу да коом-доштукка пайда келтирүүгө болот. Бизнестин шарапаты менен жаңы Жаңы товарлардын өндүрүлүшү баалардын арзандашына жана жаңы жумуш орундарынын түзүлүшүнө алып келиши ыктымал."},{"t":"p","h":"Кээ бирөөлөр элдин көпчүлүгү көбүрөөк акча табууну гана ойлойт, ал эми кайрымдуулук иштерин жасагандар өтө аз деп эсептешет, бирок бул чындыкка туура келбейт."},{"t":"p","h":"3.0"},{"t":"p","h":"3.1 Саясийкатышуу Мен каалайм, бул менин колумдан Демократиялык мамлекеттеги эң маанилүү жарандык милдет – Активдүү болуу – бул бул саясий иш-чараларга, жок дегенде добуш берүүгө катышуу. өзүң жасагың келген нерсени Көптөгөн өлкөлөрдө добуш берүү укугу үчүн узак жылдар бою айтып, аны аткарууга күрөшүүгө туура келген. Бүгүнкү күндө көпчүлүк мамлекеттерде киришүү. Активдүү болуу улутуна жана диний ишенимдерине карабастан бардык жарандар башкалар жасай турган иш (адатта 18 жаштан тартып) добуш берүүгө укуктуу. жөнүндө айтуу эмес."},{"t":"p","h":"<span class=\"pg\" data-n=\"125\">125<\/span>ө. т."},{"t":"p","h":"силердин розуңар"},{"t":"p","h":"Добуш берүү менен саясий иш-аракеттердин башка түрлөрүнүн ортосунда дайым эле түздөн-түз байланыш боло бербейт. Саясий иш-аракеттерге катыпгуунун добуш берүүдөн башка төмөнкүдөй көптөгөн башка ыкмалары бар:"},{"t":"v","l":["саясий өнөктүктөргө (кампанияларга) катышуу;","өз коомдоштугунун иштерине катышуу;","&gt;» белгилүү бир топтун же уюмдун, ошондой эле саясий партиянын иштерине катышуу.","","Сөз колдонбой эмнелерди айтабыз?"]},{"t":"p","h":"Эгер лидер болом десеңер, муну эсинерте т йүп алгыла: базычыл адамцар; биз өзүбүз айтып бербесек деле журум-турумубуздан көп нерселе р; Зили"},{"t":"v","l":["айрымдары, мисалы, жылмаюу, оңой эле байкалат.","кишинин өзү көңүл бурбай, андабай жургөн кы","оозеки эмес формасын “дене-бой тили“ деп ат","менен жолукканда көбүнчө бир аз ийилип, колдор"]},{"t":"p","h":"1"},{"t":"p","h":"мүмкүн. Ву д ишаараттардын ыкпаган, атүгүл уунун мындай мйзр бири-бири – көкүрөгүнө} басат. көбүнчө бул ишаарат урматтоо жана саламдашуу маанисинде түшүнүлөт."},{"t":"v","l":["Биз башка адамдардын беделине (статусуна)","карай ар турдуу кыймыл-аракеттерди жасайбыз.","Фотосуретту карап көргүлө, Эки чон киши","балага өздөрүнүн кыйла жогору абалда тураарын","кандайча туюнтуп жатат?","1. Чоңдор өйдөрөөктө отурат.","2. Алардын ортосун стол бөлүп турат. (Бул","алардын байлык абалы ар кандай экендигин","билдириши мүмкүн).","3. Алар кол алышып же жанаша турбайт.","4. Чоңдор расмий кийимчен.","5. Чоңдор баланын алдына эмес, бала","чоңдордун алдына келип отурат.","Статусту туюнтуунун башкача да жолдору","бар:","Ж Бийлиги бар адамдын көзүнө тике карабоо."]},{"t":"p","h":"2. Экинчи тарап төмөндөн өйдө караганга аргасыз болгондой кылып отургучтарды жайгаштыруу."},{"t":"p","h":"3. Куч-кудуретти билдириши мүмкүн болгон башка нерселер (мисалы, телефон) И экендиги."},{"t":"p","h":"4. Үн кучеткучту (мегафонду) колдонуу."},{"t":"p","h":"Канчалык күчтүү, кубаттуу экендигиңди туюнтуунун көп ыкмалары бар. Борбордук Азияда тамакты ар башкача берүү (мисалы, устукан тартуу), кол алышып көрүшүү, бири-биринин тилинде сүйлөө, жумуш бөлүштүрүү аркылуу да кишинин беделин айырмалашат."},{"t":"p","h":"Ошентип, эгер кишилердин урмат-сыйына, ишенимине арзыгыңар келсе, анда “дене-бой тилин” билишиңер керек. Мунун эң туура жолу – эч өйдөсүнбөй, башкаларды сыйлаганыңарды, сергек ойлоно билериңерди туюнтуу."},{"t":"p","h":"Бул саясий талапкерге же саясий партияга жардам берүү үчүн ыктыярдуу түрдө бекер иштөө дегенди билдирет. Саясий партияга анын мүчөсү болбой туруп деле көмөк көрсөтүүгө болот. Алсак, мисалы, төмөнкүлөрдү жасоого болот:"},{"t":"p","h":"&gt; өзүнүн кошуналарына баракчаларды жана башка маалымат материалдарын таратуу; жыйналыш өткөрүү үчүн өзүнүн квартирасын же үйүн берүү;"},{"t":"v","l":["ар кандай жерлердеги жыйналыштарга жана массалык митингдерге катышуу;","кайрылууга кол коюу;","саясий партияга өтүү;","шайланма саясий кызматка талапкер болуу."]},{"t":"p","h":"Шайлоолордо кандайдыр бир саясий партиядан, өзгөчө ал авторитардык режимге оппози! болгон учурда, талапкер болууга даяр туруу үчүн адам эрки күчтүү жана мүнөзү чечкиндүү бо. керек. Мындай сапат анын кампаниясын колдогондор үчүн, азыраак өлчөмдө болсо да, зарыл. Бирок а жактаган адамдар сөзгө бек болууга жана өз талапкеринин идеяларын түшүнүүгө тийиш."},{"t":"raw","h":"<div class=\"gloss\"><p>3.2<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"126\">126<\/span>Активдүү радио: демилгени колго алуу – 3 Силердин кенулунерлу Ысыккөл облусунун Түп районундагы Ойтал айылында түзүлгөн “Толкун” жамааттык уюмунунун төрагасы Мукамбетов Каныбек менен болгон маекке бурабыз."},{"t":"p","h":"– Жаныбек, сиздер кандай иш менен алектенип жатасыздар?"},{"t":"p","h":"&gt; Биз айылыбыздын коомдук турмушуна катышуу зарыл экендигин түшүнүп, эң оболу баарыбыздын көңүлүбүздү өйүп жүргөн маселелерди чечүү максатында жамааттык уюм түздүк. Айыл өкмөтүнүн башчысы жана ПРООНдун волонтёрлору менен бирдикте клубду кайра ондоп, маалымат борборун түзүү үчүн долбоор жаздык. Маданий-маалымат борбору гандан бери биз айылыбыздын жаштары үчүн маданий-массалык иш-чараларды уюштуруп жатабыз. Дискотекалардан тышкары, көп учурларда жалпыга бирдей тиешелүү да, сече да маселелерибизди талкуулап, аңгемелешүү кечелерин өткөрөбүз. Мындан тышкары жергиликтүү фонддон экономикалык долбоор утуп алдык, ага ылайык азыр жылкыларды зландуу түрдө багып семиртип жатабыз. Бир нече жылкы сатып, алынган кирешени кеңири зүүгө жумшадык. Жыл аягында карызыбызды төлөп, жамаат мүчөлөрүнүн турмуш- тиричилигин жакшыртуу максатында баштаган ишибизди улантышыбыз зарыл. Ишибиздин натыйжалуу болгонун көргөн кошуна айылдын жаштары кеңеш сурап бизге кайрыла баштады. Алар ла жамааттык уюм түзмөкчү. Келечекте жаштар жамааттарынын бирдиктүү ассоциациясын руп, айылдарыбызды өнүктүрүү боюнча чогуу иштесек болот."},{"t":"p","h":"Эмне үчүн бул иш-чараны уюштуруу зарыл деп таптыңыздар?"},{"t":"p","h":"– Биз жакта кыйынчылыктар көп: баңгичилик жоюлбай, аракечтикке өспүрүмдөр да згырылып жатат, адеп-ахлактын эң эле жөнөкөй талаптарын сактай албайбыз, эстетикалык абитибиз өнүкпөгөн, керкөм адабиятты аз окуганыбызга байланыштуу жан дүйнөбүз кедей, тилибиз чоркок. Айыл жаштары бул жагдайды өзгөртүп, бакыбат коомдо жашоо керек деп добуш Эгер биз өзүбүздү өзгөртсөк, кийинки муун бул ишти улантып, биз баштагандан да чоң иштерди жасашы мүмкүн."},{"t":"p","h":"Сиздердин бул иш-чарага кимдер катышты?"},{"t":"p","h":"“Биз дүйнөнү өзгөртөбүз, дүйнө бизди өзгөртөт” деп аталган долбоорубузду жузеге ашырууга көп адамдар: карылар, орто курактагылар, жаштар, ошондой эле башка жамааттык уюмдар, айыл өкмөтү жана жергиликтүү кеңеш – кыскасы, бул ишке кызыккандардын баары катышууда. Албетте, бул оңой жумуш эмес, себеби адам өзүн, көнгөн адатын өзгөртүүгө дайым эле чечкиндүү кирише албайт. Алдыга илгерилөө үчүн биз адамдарды кандайдыр бир пайдалуу нерсеге кызыктырышыбыз керек."},{"t":"p","h":"– Башка адамдар буга кандай карашты?"},{"t":"p","h":"Виз козгогон сөздү чоңдор көбүнчө балдарынан угуп жүрүштү. Алар адегенде чогулуп алып ичет, чегет деп биздин массалык иш-чараларды өткөрүшүбүзгө каршы болушкан эле, бирок кийин минтип чоочулабай калышты. Айылыбызда иштеген кээ бир педагогдор бизди кызыктырган темалар боюнча лекция, аңгемелешүү өткөрүүнү сунуш кылышты."},{"t":"p","h":"– Ишиниздерде кандай ресурстар керек болду?"},{"t":"p","h":"Клубубузду кайра оңдоого грантты биз ПРООНдун жергиликтүү өз алдынча башкарууну өнүктүрүү программасынан алдык. Мындан тышкары бизге айыл өкмөтү жана райондук мамлекеттик администрация да колдоо көрсөттү. Жамаатыбыздын мүчөлөрү болсо кышкы суукка карабай иштеди, ар кимисинин тажрыйбасы, шык-жөндөмү колдонулду. Жетишпей калган материалдарды үйүнөн алып келгендер да болду. Жакын ортодогу үйлөрдөн чоң энелер тамак бышырып келип, бизге алкыш айтып жүрүштү. Чындыгында ресурстарыбыз толук жетиштүү эмес, Тематикалык дискуссия өткөрүү үчүн акча керек. Дискотека үчүн аппараттарды, жаңы керкөм адабияттарды сатып алуу зарыл. Бүтүндөй өлкөнүн, дүйнө жүзүнүн жаштары менен байланыш түзсөк сонун болмок."},{"t":"p","h":"– Келечекте дагы кандай пландарыңыздар бар?"},{"t":"p","h":"Келечекте айылыбыздын ар бир тургуну Интернет-клубдун жардамы менен каалагандай маалыматты ала алышы учун маданий-маалымат борборубузду өркүндөтүүнү, семинар өткөрүү үчүн атайын тренинг (англ. тилинен – “окутуу, машыктыруу”) классты жабдууну пландап жатабыз. Тынчтык корпусуна кайрылып, бизге англис тилин үйрөтүшү үчүн волонтёр жиберүүнү өтүндүк, Жергиликтүү өз алдынча башкаруу системасындагы кызматташтыкты үлгүлүү деңгээлде жүргүзүү үчүн биз айыл өкмөтү менен дагы да жакындан иштешүүбүз керек деп ойлойбуз."},{"t":"p","h":"Көпчүлүк адамдар үчүн бүткүл өлкөнүн масштабындагы саясий ишмердик менен күндөлүк жашооирнчилигинин ортосунда таптакыр байланыш жоктой сезилиши мүмкүн. Алар өздөрүнүн күндөлүк <span class=\"pg\" data-n=\"127\">127<\/span>—Жарандын Жана авзленетти вашпарууёа патышуу – ХХ1 жЖарандып тоозунаагы силердин родунар"},{"t":"raw","h":"<div class=\"gloss\"><p>7 берди – у) – <\/p><\/div>"},{"t":"p","h":"турмушунда оңдолбогон жолдорду, өз убагында ташып кетпегендиктен чачылып жаткан таштандыларды жана актап-сырдалбаган үйлөрдү көрүшөт. Кыйынчылыктардын көпчүлүгү жергиликтүү шартка байланышкан, аларды көбүнчө жергиликтүү деңгээлде эле чечүүгө болот. Ошондуктан көп өлкөлөрдө жарандар өз районунун же жергиликтүү коомдоштуктун чегиндеги иштерди чогуу бүтүрүүгө абдан активдүү катышат."},{"t":"p","h":"Жергиликтүү өз алдынча башкаруунун ар кандай формалары жарандардын катышуусу үчүн ар түрдүү мүмкүнчүлүктөрдү берет. Кээде шайлануучу же дайындалуучу жергиликтүү кызмат адамы эл менен мамиле түзүүгө өзгөчө кызыгат. Эл да жергиликтүү бийлик өкүлдөрүн сөзгө тартуу үчүн көптөгөн ыкмаларды колдонсо болот. Мисалы:"},{"t":"p","h":"» кызмат адамдарына кат жазуу;"},{"t":"p","h":"&gt; жергиликтүү проблемаларды чечүүнүн мүмкүн болгон жолдорун талкуулоо үчүн демилгечил топ түзүү;"},{"t":"p","h":"&gt; ушул топ менен кызмат адамдарына жана жергиликтүү бийликтин шайланма органынын өкүлдөрүнө жолугушууга баруу;"},{"t":"p","h":"жергиликтүү маселени парламенттин депутаттары менен жолугушуп талкуулоо үчүн борборго баруу;"},{"t":"p","h":"арыз берүү же өзүнүн позициясын массалык маалымат каражаттарында баяндоо жолу менен тийиштүү проблемага расмий адамдардын көңүлүн буруу ж.у.с."},{"t":"p","h":"3.4 Белгилүү бир топтун же уюмдун курамындагы иш-аракеттер"},{"t":"p","h":"Кээде проблема жергиликтүү коомдоштукка эмес, жеке адамга тиешелүү болот. Бул андан башка эч кимде мындай кыйынчылыктар жок дегенди билдирбейт. Силер башка айылдан же шаардан ушундай эле маселеге туш болгон адамды табышыңар мүмкүн. Биргелешип иштесенер, силер көптөгөн адамдарга тиешелүү мындай проблемаларга мамлекеттик органдардын же менчик компаниялардын өкүлдөрүн көңүл бургузуп, аларды чечүү үчүн чара көрүш керек экендигин түшүндүрө аласынар."},{"t":"p","h":"Албетте, бул сөзсүз эле даттануу же саясатка тиешелүү маселе болушу зарыл эмес. Силер өз районуңардагы экологияны жакшыртуу боюнча демилге көтөрсөңөр же ар кандай иштерге адамдарды уюштурсаңар да болот. Жаштар көбүнчө төмөнкүдөй иш-чараларды уюштурат:"},{"t":"v","l":["жаштардын тоого, токойго же башка жерлерге барышы;","коопсуздук эрежелерин жана алгачкы жардам көрсөтүү ыкмаларын үйрөнүү;","үрп-адаттарды жана маданий салттарды үйрөнүү;","экологиялык топторду түзүү;","спорттук иш-чаралар;","жалпы короону көрктөндүрүү;","коомдоштук мүчөлөрүнүн ден соолугуна кам көрүү ж.у.с."]},{"t":"p","h":"Ушундай иштердин баары көп нерсеге үйрөтөт да, конкреттүү маселелерди чечүү үчүн бириккен адамдарга зор канааттануу алып келет."},{"t":"p","h":"4.0 Канткенде активдүү жаран болобуз?"},{"t":"p","h":"Эгер жарандык ишмердигиңердин чоң пайда алып келишин кааласаңар, анда төмөнкү эрежелерди көңүлдө туткула:"},{"t":"p","h":"1. Көздөгөн максат-милдеттериңерди ирети менен так аныктап алгыла. Өз ара байланышпаган эки ишти чогуу бүтүрөбүз деп бөөдө убара тартып калбагыла."},{"t":"p","h":"2. Арызыңарды жазуу түрүндө бергиле да, ага жоопту жазуу түрүндө талап кылгыла; жолугушуулар менен жыйналыштарга токтом түзүп жүргүлө."},{"t":"p","h":"Өзүңөр сунуш кылган бардык иштер боюнча башка адамдардын сунуштарын кабыл алууга даяр болгула."},{"t":"p","h":"Сүйлөшүүдөн жана талкуу жүргүзүүдөн эч качан баш тартпагыла."},{"t":"p","h":"Мүмкүн болушунча ар дайым өз ара макулдашып чечим кабыл алууга аракеттенгиле, ошондо бардык катышуучулардын кадыр-баркы сакталат."},{"t":"p","h":"Силердин пикириңерге макул болбогондорго ар дайым сый мамиле жасагыла, бирок алардан да ушундай мамилени талап кылгыла: инсанды эмес, маселени талкуулагыла."},{"t":"p","h":"Эгерде бардык иштер али макулдашыла элек болсо, силердин топту же уюмду башкалардын тааныштырышына жол бербегиле."},{"t":"h3","h":"АЙ ПЛ ашты"},{"t":"v","l":["<span class=\"pg\" data-n=\"128\">128<\/span>Өз ишиңерди баяндоо же көз карашыңарды жарыялоо үчүн массалык маалымат","пайдалангыла.","9. Эч качан күч колдонууга чакырбагыла."]},{"t":"p","h":"10. Жетишилген макулдашууларды кармангыла жана аткарылышы мүмкүн болбогон иштери убада кылбагыла."},{"t":"p","h":"11. Өзүңөр бүтүрүүгө даяр болбогон иштердин аткарылышын башкалардан талап кылбагыла, 12. Силердин проблемага тиешелүү мыйзамдарды билгиле."},{"t":"p","h":"13. Демократиялык коомдун жараны катары силер бардык иш-аракетинерди мыйзамдуу жүргүз аракеттенгиле."},{"t":"p","h":"14. Финансылык ресурстарды пайдаланышыңар керек болсо, алардын эсебин тыкан жургузгуле."},{"t":"p","h":"15. Тек гана кайрымдуулук жардам сурабастан, зарыл болгон каражаттарды кандайдыр бир кызмат. көрсөтүү жолу менен (мисалы, машина жууп же башка иш жасап) иштеп табышыңар керек. Ошентип, силер өзүңөрдүн жергиликтүү коомдоштугуңар үчүн эмне жасоону каалайсыңар?"},{"t":"h2","h":"=&gt; Текстти окугандан кийинки көнүгүүлөр"},{"t":"p","h":"02-тапшырма. Эмне учун? 25 мун."},{"t":"p","h":"Шеригинер менен эмне учун коомдо активдүү болуу керектигин түшүндүрүп, көлөмү жүз сөздөн ашпаган чакан дилбаян жазгыла, же ушул идеяны туюнткан плакатты (же телекөрсөтүү жарыясын) даярдагыла, 111, 03-тапшырма. Активдуубу же жокпу? 30мүн."},{"t":"p","h":"Жарандык коомдун иштерине жарандар анча активдүү катышпайт деп эсептегендер көп. Уч-төрттөн бөлүнүп, төмөнкүлөрдү талкуулагыла да, жообуңарды даярдагыла:"},{"t":"v","l":["Силердин өлкөңөрдүн жарандары жетиштүү деңгээлде активдуубу?","‚ Силер өзүнөр жетиштүү деңгээлде активдүүсүңөрбү?","Силердин аракетинер оңунан чыгып жатабы (натыйжа береби)?","Силердин аракетиңерди кантип натыйжалуураак кылууга болот?"]},{"t":"p","h":"Силердин коомдоштугунардын мүчөлөрү жарандык коомдун иштерине кыйла активдүү катышуусу. үчүн эмне кылуу керек?"},{"t":"v","l":["Бизди жарандык активдүүлүккө мажбурлоо керекпи?","Мунун кандай кемчиликтери болушу мүмкүн?"]},{"t":"p","h":"Жарандык коомдун иштерине адамдар кыйла кеңири катышса, мунун кандай оң жана терс жактары болот?"},{"t":"v","l":["Өз жообунарды класстагылар менен талкуулоого даяр болгула.","$$ 04-тапшырма. Биздин коомдоштукта 20мун."]},{"t":"p","h":"Шеригинер менен иштеп, коомдоштугунардын турмушуна мамлекеттик органдардын кызматкерлери катары эмес, жаран катары активдүү катышкан адамдарды атагыла. Аларды жолугушууга чакырып же. макулдашкандан кийин өзүңөр барып, төмөнкүлөрдү сурап билгиле:"},{"t":"v","l":["Алар кимдер? (Аты-жөнү ж. у.с.)","Алар коомдоштуктун кызыкчылыгы үчүн эмне иш жасашат?"]},{"t":"p","h":"Алар калган учурда эмне кылышат? (Алардын, мисалы, эне/врач катары туруктуу милдеттери барбы?)."},{"t":"v","l":["Алар эмне учун коомдук иш-аракеттерге катышуу керек деп эсептешет?","Алардын пикири боюнча, бул иштер коомдоштукка кандай пайда алып келет?","Коомдук иш-аракеттерди жүргүзүү аларга жагабы? Эмне үчүн?","Алар бул иштерди жүргүзүү менен дагы эмнелерди үйрөнүп алышкан?"]},{"t":"p","h":"Коомдук иш-аракеттердин натыйжасында алар кандай чыгымдарды тартышат? (бош убактысын сарптоо ж.у.с.) Алар мындан ары да бул сыяктуу иштер менен алектенгиси келеби?"},{"t":"raw","h":"<div class=\"gloss\"><p>6. 7. 8.<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"129\">129<\/span>05-тапшырма. Өзүм жөнүндө эмие айта алам? 10мүн."},{"t":"p","h":"Шеригиңер менен бардык билген нерселеринерди жана ресурстарынарлы санагыла. Эгер силер өзүнөрдө эчтеке жок деп ойлосоңор, идея алыш үчүн темеиде келтирилген тизмени карагыла."},{"t":"v","l":["2","Г"]},{"t":"raw","h":"<h4 class=\"mk\"> Мал бага алам Машинка баса алам Почтаны жеткире алам Ырдай алам.<\/h4>"},{"t":"v","l":["Ишемби күндөрү кечкисин бош убактым болот","жакшы билем","Менин эшегим бар Га машакөншмүн","","1, 06-тапшырма. Мен эмне кылышым керек? 30 мүн,"]},{"t":"p","h":"Коомдоштугунар туш келиши мүмкүн болгон проблемалардын тизмесин карагыла, Алардын ичинен чечилишине силер катышып калышынар мүмкүн болгондорду белгилегиле да, бул учурда силер өзүнөр эмне жасай аларыңарды көрсөткүлө."},{"t":"v","l":["г,","","1. Кечелер булганыч."]},{"t":"h3","h":"2. Менин мектебимде окуган айрым кичинекей"},{"t":"v","l":["балдардын бут кийимдери жок.","3. Биздин айрым класстардан тамчы тамат.","'4. Кээ бир үйбүлөлөрдө тамак-аш жетишпейт.","5. Айрым жаштар зеригип жатканын айтып,","проблема чыгарышат.","6. Айылдагы айрым адамдардын үйлөрү суу","ташкында бузулган.","7. Айрым окуучулар драмага жана комедияга","кызыгышат. Бирок электр тез-тез өчүрүлүп","тургандыктан, биз телевизордон кенул ачуучу","беруулерду кере албайбыз.","8. Биздин мугалим ишке орношуу учун шаарга","кетууге камынып жатат, анткени ал жакта","айлык жакшы. Бирок мугалимдин кеткиси","келбейт, ал бизге да жагат.","9. Жолдор жаман абалда, бирок ушул жылы","жолду ремонттоо учун жумушчулардын эмгек","акысын төлөөгө акимиятта жетиштүү акча жок."]},{"t":"p","h":"10. Жабыр тарткандарга алгачкы жардам көрсө-"},{"t":"v","l":["түү жөнүндө адамдардын жетиштүү билими","жок.","у","Жолдоштору м менен жумасына","|\\бир ирет чогулуп, көчөнү тартинхе"," келтире алам. Көчө булгаган адамдарды ","|уяткаруу үчүн гезитке кат жазсам","","-"]},{"t":"h3","h":"$$ 07-тапшырма. Башка адамдарды тартуу"},{"t":"p","h":"Шаарды аралап агып еткен сууга ар ким таштанды таштап, булгап жатат деп элестеткиле. Бул жорукту токтотуу учун силер маселеге элдин көңүлүн бургунар келет. Шеригинер менен ушул проблеманы чечууте адамдарды кызыктыруунун жолдорун санагыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"130\">130<\/span>211, 08-тапшырма. Эмне кылуу керек? 30 мүн."},{"t":"p","h":"Үч-төрттөн болуп, төмөндө берилген проблемалардын тизмесин карап чыккыла. Андан кийин тизмеден ар бир проблеманы чечүү үчүн аткарылышы зарыл деп өзүңөр ойлогон иш-аракеттерди тандагыла, Аларды кандайча аткаруу керек десеңер, ошол тартипте жайгаштыргыла. Эгерде силер дагы бир нерсе жасаш керек деп эсептесенер, аны өзүңөрдүн тизмеге кошкула."},{"t":"v","l":["Проблемалар:","Биздин мектепте китеп жетишпейт.","Биздин шаарда эс ала турган жай жок.","Машиналар биздин айыл аркылуу абдан чоң ылдамдык менен өтүшөт.","Биздин айылдагы көп үйлөргө суу түтүктөрү киргизилген эмес.","‚ СИЛЕРДИН ПРОБЛЕМА: кандайдыр бир реалдуу проблеманы эстегиле.","Иш-аракеттердин тизмеси;"]},{"t":"p","h":"Проблеманы баяндоо менен акимиятка же башка жергиликтүү бийлик органына кат жазуу. Ушул проблеманы чечүү үчүн чара көргүлөрү келген досторуңар менен кеңешүү,"},{"t":"v","l":["Башкалар баштамайынча эч нерсе кылбай күтүп туруу.","Бул кандай проблема же маселе экендигин аныктоо,","Бул проблемаларды чечүү үчүн жарандардын комитетин түзүү.","Маселени чечүүнү акимияттан, кеңештен же мааледен өтүнүү.","Шайланма кызматтарга талапкер болуу.","Маселени чечүүдө силерге эмне жолтоо болушу мүмкүн экендигин аныктоо.","Ушул проблема жөнүндө жергиликтүү гезитке кат жазуу.","Аны чечүү үчүн кандай каражаттар керектигин аныктоо,","11. Маселе башка адамдарды да ойлонторун суроо.","12. Аны чечүү үчүн өзүңөрдө кандай каражаттар бар экенин аныктоо.","13. Аны чечүү планын түзүү."]},{"t":"p","h":"14. Ушул проблема боюнча эң жакшы чечим кабыл алуу үчүн кимдерди катыштыруу керектигин чечүү, 15. Акимияттан ж.б. бирөөнү силердин комитетке чакыруу."},{"t":"p","h":"16. Маселени чечуу учун алардын ою боюнча эмне жасаш керектигин башка адамдардан суроо."},{"t":"p","h":"17. Аны чечүү учун жергиликтүү бийлик органдарында кандай каражаттар бар экендигин аныктоо."},{"t":"p","h":"18. Проблеманы жана силер сунуш кылган чечимди баяндоо учун акимияттын жетекчиси ж.б. менен жолугушуу."},{"t":"p","h":"19. Проблема боюнча чечим кабыл алуу процессине катышуу үчүн кеңештен ж.б. уруксат суроо."},{"t":"p","h":"20. Чечимдин альтернативалуу варианттарын ойлоп табууга аракеттенүү."},{"t":"p","h":"21, Проблеманы чечүү учун акча же материалдык каражат кошуу өтүнүчү менен кат жазуу жана аны айылдын бардык тургундарына таратуу,"},{"t":"v","l":["22. Эч нерсе жасабоо жана бул проблема чечилбей кала берерин моюнга алуу.","* 09-тапшырма. Силер кандай деп ойлойсуңар? 35 мүн."]},{"t":"p","h":"Кээбир өлкөлөрдө салт боюнча айрым чечимдерди кабыл алуу үчүн белгилүү адамдардын гана катышуусу талап кылынат. Мисалы, энелер түшкү тамакка эмне бышырууну өздөрү билет, бирок кандай машина сатып алууга келгенде сөз кошо албайт. Шеригиңер менен бирге төмөнкү билдирүүнү жактап же төгүнгө чыгарый, 300 сөзгө чейинки көлөмдө дилбаян жазгыла."},{"t":"v","l":["“Биздин чечим кабыл алууда катышуубузга салттуу","көз караштар тоскоол болушуна жол бербейбиз”."]},{"t":"p","h":"$$9$ 10-тапшырма, Катталбаган БӨУ түзүү 45 мүнөт же мындан көбүрөөк Бул көнүгүүдө силер катталбаган БӨУ түзүүнү пландайсыңар жана анын иш-аракеттеринин түрлөрүн белгилейсиңер,"},{"t":"v","l":["[КАШ Катталбаган БӨУнун максаттары:","1. Ден соолукту сактоо боюнча облуста коомдук кампанияларды өткөрүү."]},{"t":"p","h":"2. Башка жергиликтүү уюмдардын бул маселедеги өз ролун аңдап билишине көмөктөшүү. 3, Бул маселеге өкмөттүн көңүлүн көбүрөөк буруу."},{"t":"raw","h":"<div class=\"gloss\"><p> <\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"131\">131<\/span>Жана мавленетти вашмарууёз патышуу – ХХ] тылыздын Жарандыт птоовундагы силердин ролунар Кыргызстан бай эмес өлкө болгонуна карабастан, бактыга жараша, анын өкмөтү баңгилик проблемасына олуттуу мамиле жасайт."},{"t":"p","h":"Башкача жагдайды элестетип көргүлө. Бул көнүгүүнү аткаруу үчүн силер өкмөтү бул проблеманы маанилүү деп эсептебеген Нур өлкөсүндө жашайбыз деп элестеткиле, С илердин уюм ушул проблеманын олуттуулугуна өкмөттү ишендириши жана аны чечүүгө жардам бериши керек."},{"t":"p","h":"Нурдагы баңгиликтин тарыхы Бир ай мурда досторуңардын бири баңгизат колдонуудан каза болду. Силер баңгизат колдонгон дагы бир нече адамды билесиңер. Врачтардын биринин айтымына караганда, өткөн жылы Нурда баңгизаттарынан 500 адам каза болгон. Миңдеген адамдар (так санын эч ким билбейт) баңгиликке берилип кетип, иштей да, окуй да албай калган Өкмөт болсо мындан да маанилүү маселелер бар, бул маалыматтарды адамдар тек гана апыртып айтышууда деп билдирет. Чынында эле азыркы учурда өкмөт реалдуу экономикалык кыйынчылыктарды башынан кечирип жатат. Телекөрсөтүүгө берген интервьюсунда саламаттык сактоо министри Зинт айым бул проблеманын бар экендигин танган жок. Бирок жарандар активдүү киришмейинче өкмөттүн бул проблеманы чечүү аракетинен эч кандай натыйжа чыкпайт деп эсептээрин белгиледи."},{"t":"p","h":"Силердин жердеги көпчүлүк адамдар бул проблеманын олуттуулугун түшүнүшөт, бирок сүйлөшө келгенде, алар мунун бизге тиешеси жок дейт."},{"t":"v","l":["Баңгиликтин жана аракечтиктин туткундары","71","","7501","14623","т 209"," Талас облусу м","Ысыккөл облусу","1667","\"Нарын облусу"," Ош облусу"," Ош шаары"," Баткен облусу","[Жалалабат облусу","Биринчи баскыч: БӨУ түзүү"]},{"t":"h2","h":"берилгемдик Баңгизатка"},{"t":"v","l":["126443.","","т \"йм ет","УКУ 110 18 к","","в","16","1","","110","1302."]},{"t":"p","h":"1. Силер БӨУ түзүү үчүн чогулуш чакырдыңар. Бул чогулушта силер төмөнкүлөрдү карагыңар келет:"},{"t":"p","h":"БӨУнун аталышы"},{"t":"v","l":["Уюмдун түзүмү","Уюмдун максаты","Топто чечимдин кабыл алынышы","БӨУнун чоңдугу"]},{"t":"p","h":"БӨУ жөнүндөгү мыйзамдар (жарандык коом жана мыйзамдар каралган Кыргызстандагы мыйзам үстөмдүгү жөнүндөгү сапты карагыла) &gt;» Уюмуңар жана силер жасоого ниеттенген иштер жөнүндө адамдарга маалыматты кандайча бересиңер?"},{"t":"p","h":"2. Силер топ түзүп, ага ат берип жана жогоруда саналган маселелердин баарын чечкенден кийин чоң барак кагазга ушул маалыматтардын бардыгын жазгыла. Силер болочоктогу бардык чогулуштардын токтомун жазуу үчүн БӨУнун катчысы катары бирөөнү дайындасаңар болот."},{"t":"p","h":"Экинчи баскыч: иш-аракеттерди өөрчүтүү 1. Силер ушул проблема менен 6 ай бою иштейбиз деп элестеткиле. Ушул мезгилде жергиликтүү кеңештерге жана Жогорку Кеңешке шайлоолор болуп өтөт."},{"t":"p","h":"2. Мамлекеттик жана жергиликтүү деңгээлдерде ушул проблема боюнча саясий талаш-тартыштар башталышы үчүн демилге акцияларын өткөрүүнү пландагыла. Иш-аракеттердин планын түзүп, төмөнкүлөрдү эске алуу менен силерге канча акча керек экенин чечкиле:"},{"t":"raw","h":"<div class=\"gloss\"><p>1 <\/p><\/div>"},{"t":"v","l":["<span class=\"pg\" data-n=\"132\">132<\/span>Ух плакаттарды даярдап, басып чыгаруу; бюллетень чыгаруу;","Үү башка бирикмелер жана мектеп окуучулары менен сүйлөшүү; көчмө театр труппасын түзүү;","саясатчылар менен жолугушуу;","коз караштарын аныктоо учун жергиликтүү бизнесмендер менен жолугушуу;","баңгизат таратышы мүмкүн болгон адамдар менен жолугушуу;"]},{"t":"p","h":"саламаттык сактоонун жергиликтүү жана эларалык уюмдары менен байланыш түзүү; иш-аракеттер үчүн кандайча акы төлөйсүнөр?"},{"t":"p","h":"&gt; жергиликтүү ММКларды таратуу жолдору."},{"t":"p","h":"3. Өздөрү кандай иштерди жүргүзөөрүн айтып бериши үчүн класска саламаттыкты сактоо кызматкери! же кампаниянын каалаган активист-уюштуруучусун чакырсаңар болот."},{"t":"p","h":"4. Класска жергиликтүү журналистти чакырып, силердин уюмду коомчулукка кандайча жакшыла тааныштыруу керектиги жөнүндө сүйлөшсөңөр болот."},{"t":"p","h":"Баңгизаттарды колдонуунун зыяны жөнүндө Теменде баңгизаттардын Орто Азияда эн кеңири колдонулуучу түрлөрү жөнүндө маалымат берилет. Алкоголь ичимдиктери менен тамекини кошпогондо, булардын баары Кыргызстанда мыйзамсыз деп эсептелет."},{"t":"p","h":"1. Тамекинин курамындагы никотин артериялык басымды жогорулатып, кан басымы) тездетет. Көп адамдар тамеки чеккенде көңүлүң тынчыйт дейт, чындыгында бул – никотинга көнүп алгандын өзүн-өзү алдоосу гана. Тамеки чегүү көп өлкөлөрдөгү өпкөнүн айыкпас рак оорусуна алып келүүчү наркологиялык илдеттин негизги себеби деп эсептелет, 2"},{"t":"p","h":"2. Алкоголь пиво, вино жана арак сыяктуу ичимдиктердин курамында болот. Бул ссант (“басынтуучу”, “көңүл чектуруучу”) борбордук нерв системасынын, анын ичине ниң ишин начарлатуучу “тынчтандыргыч” каражат болуп саналат. Алкоголь көңүлдү б р жерге топтоого, кыймыл-аракетти туура багыттоого тоскоол болот да, кишинин күтүүсүз кырдаалга жооп кайтаруу жөндөмүн начарлатып коёт. Ырас, аз өлчөмдө пайдаланганда көңүлдү көтөрүп, капалыкты убактылуу унуттурушу мүмкүн. Бирок алкоголду колдонуу кө елкелерде капилет өлүмгө алып келүүчү негизги себептердин ичинен экинчи орунда турат, Кыргызстанда болсо бейажал өлүмгө аракечтер баарынан көп кабылат."},{"t":"p","h":"3. Марихуана кара куурайдан алынат. Россияда “анаша” деп аталуучу бул депрессант алкоголго окшошот, бирок адамдын аң сезимине эле эмес, психикасына да таасир этет, Марихуананы узак убакыт бою же көп өлчөмдө колдонгон киши кээде жин оорусуна жаңа! өпкөнүн оор дартына чалдыгат."},{"t":"p","h":"4, Амфетаминди көбүнчө “стимулятор” деп аташат. Ал борбордук нерв системасынын ишрешине түрткү берет. Амфетаминдер маалыматтын мээден денеге жана денеден мээге жиберилип турушун тездетет. Бул заттардын көпчүлүгү менчик лабораторияларда даярдалып, мыйзамсыз түрдө сатылат. Жасалма стимулятор болгондуктан, муну узак убакыт бою колдонуу жүрөк ооруга чалдыктырат же жүрөк оорусун күчөтүп жиберет. Мындан тышкары 15 ул психикалык ооруларга, көбүнчө “амфетаминдик психоз” деген ат менен белгилүү болгон. илдетке себепчи болушу ыктымал."},{"t":"p","h":"5. ЛСД – галлюцинацияны пайда кылуучу зат. “Психика жаратуучу баңгизаттар” дей аталып жүргөн галлюциногендер адамдын дүйнөнү кабылдоосун бурмалайт. ЛСДден тышкары башка галлюциногендер да козукарындардын жана фенсиклидиндин курамында болот (РСР) Муну колдонуу психиканын олуттуу түрдө бузулушуна алып келиши мүмкүн."},{"t":"p","h":"6. Героин – бул “опиат”. Опиаттар апийим кызгалдагынан даярдалат. Героинди колдонуунун опурталдуулугу ага кишинин бат азгырылып кетишине, улам чоңураак елчемд колдонууга аргасыз болушуна байланышкан. Героинге адам өтө көз каранды болуп калат андыктан бул өтө коркунучтуу баңгизат болуп саналат. Ага көнүп алган адамдар “жыргалдь туу чокусуна” жетүүгө азгырылып, барган сайын көп колдонууга муктаж болот. Мунун акыр азаптуу өлүы менен аякташы ыктымал."},{"t":"p","h":"11-тапшырма. Залкар ойлор 15 мун."},{"t":"p","h":"Шеригинер менен төмөндөгү айтылган ойлорду талкуулагыла. Өзүңөргө баарынан көбүрөөк жакка тандап алгыла. Мындагы идеяларды чыгармачыл түрдө чагылдырган ураан жазгыла. Анан клг түзүлгөн эң мыкты ураанды добуш берүү жолу менен тандагыла."},{"t":"v","l":["<span class=\"pg\" data-n=\"133\">133<\/span>зы","","Бекер жүргөнчө, бекер иште. (Къыңугыз макалы","Саргара жортсоң, кызара бөртөсүң (Кыргыз макалы)"]},{"t":"p","h":"“Адам өзү өз жолун тандап алса, азан чекте Мт ал лк жүрсө канча\" (Жусуп Баласагын) (Токтогул) Жаман адам белгиси – өз камы үчүн жүгүрөт. белгиси – өз камы үчүн жүз"},{"t":"v","l":["“Өз милдеттерын билмексеиге салуу жаша сезге","Г","кылуу – бул жеткен айбанчылык”. (Ф.М,","“Жалпы жыргалчылыкка кызмат кылууну","сынын шарты болууга тийиш”. (№. П. Чехов)","“Илгерки убакта жаратылыш","к","– эл камы үчүн күйүнөт","","эле мезгилде бардык укуктерысн талан"]},{"t":"p","h":"жан дүйнөнүн талабы, өз бактты-"},{"t":"p","h":"Мол өлкө бай де эх ейтелчү, айыр каердин адамдары абдан ишмер болсо, ошол өзхөнү бай бейбиз” (т Божль “Кыскасы, адам өзү менен өзү болушу, Омяимсиздикме карыы өз алдынча дээр күтүшү. бала кезинде ар бир адамда боло турган дүйнөнү активдүү кабылдоо жөндөмүн өнүктүрүшү абзел”. (Ч. Айтматов)"},{"t":"raw","h":"<div class=\"gloss\"><p>ы чыгармачылык менем<\/p><\/div>"}],"sub":[],"pages":[120,133]},{"title":"Тиркеме. Кыргыз Республикасынын жамааттар жана алардын бирикмелери жөнүндөгү мыйзамы","blocks":[{"t":"h2","h":"<span class=\"pg\" data-n=\"134\">134<\/span>Тиркеме. Кыргыз Республикасынын жамааттар жана алардын бирикмелери жөнүндөгү мыйзамы"},{"t":"p","h":"Бишкек шаары, Өкмөт Үйү, 2005-жылдын 21-февралы М 36"},{"t":"h3","h":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МЫЙЗАМЫ"},{"t":"h2","h":"Жамааттар жана алардын бирикмелери жөнүндө"},{"t":"v","l":[" бөлүм. Жалпы жоболор"," бөлүм. Жамаатты түзүү, мүчөлүк жана анын иштеши"," бөлүм. Жамааттардын бирикмелери","У бөлүм. Корутунду жоболор"]},{"t":"p","h":"жана иштешинин тартибин, принциптерин аныктайт, ошондой эле алардын мамлекеттик бийлик жана жергиликтүү Ушул Мыйзам айылдарда, кыштакарда, шаарларда түзүлүүчү жамааттарды жана алардын бирикмелерин түзүү алдынча башкаруу органдары, юридикалык жана жеке жактар менен болгон мамилелерин жөнгө салат жана Кыргыз Республикасындагы социалдык мобилизациялоону ишке ашыруу үчүн укуктук жана уюштуруучулук негизд түзүүгө, жамааттарга жана алардын бирикмелерине өз алдынча башкарууга мамлекеттик кепилдиктерди багытталган."},{"t":"v","l":[" бөлүм. Жалпы жоболор","","1-статья. Негизги түшүнүктөр жана терминдер","Ушул Мыйзамда төмөндөгүдөй түшүнүктөр жана терминдер пайдаланылат:"]},{"t":"p","h":"жамаат – жергиликтүү маанидеги иштерди биргелешип жана жоопкерчилигин өз мойнуна алып чечүү үчүн бир көчөнүн, кварталдын же башка аймактык түзүлүштөгү айылдын же шаардын аймагында жашап жаткан жергиликтүү жамааттардын мүчөлөрүнүн ыктыярдуу бирикмесин билдирген жергиликтүү өз алдынча башкарууну Уюштуруунун 1 формасы;"},{"t":"p","h":"жамааттардын бирикмелери – өз ишин координациялоо, жалпы таламдарды коргоо жана билдирүү, биргелешкең долбоорлорду жүзөгө ашыруу жана жалпы милдеттерди жана көйгөйлөрдү чечүү максатында ассоциациялар {бирликтер) формасында жамааттар тарабынан түзүлүүчү ыктыярдуу түзүлүш;"},{"t":"p","h":"жамааттын төрагасы – жамааттын уставына ылайык анын мүчөлөрү тарабынан шайланган адам;"},{"t":"p","h":"уставы – жамааттык уюмдардын мүчөлөрү тарабынан иштелип чыккан жана кабыл алынган жана айылдык, кыштактык, шаардык кеңеште каттоодон өткөн, жамааттык уюмдардын иштерин жөнгө салуучу жамааттын. негизги укуктук документи;"},{"t":"p","h":"жамааттын мүчөлөрүнүн жалпы чогулушу – жамаатты башкаруунун жогорку органы;"},{"t":"p","h":"жамааттын менчиги- жамаатка тиешелүү болгон, жамааттын пайдалануусундагы жана тескөөсүндөгү, жамааттын. жана жергиликтүү коомдоштуктун мүчөлөрүнүн киреше алуусунун жана социалдык-экономикалык жана руханий муктаждыктарын канааттандыруусунун булагы болуп кызмат кылган жамааттын менчиги (акчалай жана натуралай жагынан алгандагы);"},{"t":"p","h":"социалдык мобилизациялоо – өздөрүнүн социалдык-экономикалык жана руханий таламдарын канааттандыруу, бири-бирине өз ара жардамдашуу, жакырчылыктан чыгуу, өзүндө болгон жана дагы башка ресурстарды пайдалануу. менен өзүнүн өнүгүшүн илгерилетүү жана алардын жашоо турмушуна түздөн-түз таасирин тийгизүүчү чечимдерди кабыл алуу процессине калкты активдүү катыштыруу максатында өзүнүн ар түрдүү менчик уюмдарына жер ИК тургундардын биригүү процесси;"},{"t":"p","h":"үй чарбачылыгы – турак жай бирдигинде чогуу жашап турган, өздөрүнүн каражаттарын толугу менен же жары! жартылай бириктирип, чарбаны чогуу жүргүзүү аркылуу өздөрүн жашоо тиричиликке зарыл болгон нерселер менен камсыз кылышкан эки же андан ашык адамдан турган топ,"},{"t":"p","h":"Эскергүү: бул адамдар туугандык мамилелери же никеден келип чыгуучу мамилелер менен байланышы бо Ш\\ мүмкүн, же туугандык жагынан байланышы болбошу да мүмкүн. 1"},{"t":"p","h":"Үй чарбачылыгы турак жай бирдигинде жашаган, өзүн жашоо тиричиликке зарыл болгон бардык нерселер мене камсыз кылган бир адамдан да турушу мүмкүн;"},{"t":"p","h":"өнүгүүнүн жергиликтүү фонду – жамааттар тарабынан түзүлгөн жана жамааттар менен алардын бирикмелеринин салымдарынын, уюмдардын жана эларалык донорлордун, ыктыярдуу башталыштагы демөөрчүлөрдүн төгүмдөрүнү эсебинен түзүлгөн коомдук фонд."},{"t":"v","l":["2-статья. Жамааттын иштеринин негизги максаттары","Жамааттын иштеринин негизги максаттары болуп төмөнкүлөр саналат:"]},{"t":"p","h":"– жергиликтүү маанидеги иштерди биргелешип жана жоопкерчиликти өз мойнуна алып чечүү учун жамаатть <span class=\"pg\" data-n=\"135\">135<\/span>—Жарандым Жана чанленетти вглипарууга патышуу м ЖХ2 пылызйын Жарандын поонунцаеы силердин ролуңар"},{"t":"raw","h":"<div class=\"gloss\"><p>13+<\/p><\/div>"},{"t":"p","h":"мүчөлөрүндө бир коомдоштукка таандык болуу сезимин анүктүрүү;"},{"t":"p","h":"жамааттын жана жергиликтүү коомдоштуктун мүчөлөрүнүн ббциалдык-экономикалык жана руханий муктаждыктарын канайттандыруу;"},{"t":"v","l":["жамааттын мүчөлөрүнө өз ара жардам көрсөтүү;","социалдык мобилизациялоо боюнча калктын иктиалү үнүгүн жогорулатуу","3-статья. Жамаатты түзүүнүн жана иштешинин принциптери","Жамааттын иши төмөндөгү принциптерде жүзөгө ашырылат","мыйзамдуулук жана социалдык адилеттүүлүк;","ыктыярдуу мүчөлүк;","демократия, айкындуулук, ачыктык жана коомдук пикирди эсепке элуу:"]},{"t":"p","h":"социалдык-коомдук, экологиялык, турак-жай жана жамааттын мүчөлөрүнүн таламдарын козгой турган дагы башка маселелерди чечүүдөгү коллегиалдуулук, эркин талкуулоо, экономикалык жана чарбалык өз алдынчалыктын иегизиндеги өзүн өзү аныктоо, өзүй өзү жөнгө салуу жана өзүн өзү каржылоо;"},{"t":"v","l":["үй чарбачылыгындагы бирдей өкүлчүлүктү камсыз кылуу:","жамааттын мүчөлөрүнүн таламдарынын жалпылыгы;","жашаган жери боюнча аймакташтык,","4-статья. Жамааттын көз карандысыздыгы"]},{"t":"p","h":"1. Жамаат өз ишин ушул Мыйзам, Кыргыз Республикасынын мыйзамдары, дагы башка ченемдих укуктук актылар жана жамааттын уставы менен белгиленген компетенциясынын чектеринде өз алдынча уюштурат жана жүзөгө ашырат."},{"t":"p","h":"2. Жамаат Кыргыз Республикасынын мамлекеттик башкаруу органдарынын, ошондой зле жергиликтүү өз алдынча башкаруу органдарынын милдеттери боюнча жооп бербейт, ага тете эле алар ла, тарайтар өздөрүнө ушундай милдеттенмелерди ыктыярдуу түрдө кабыл алган учурларды кошпогондо, жамааттардын жанз алардын бирикмелеринин милдеттенмелери боюнча жооп бербейт."},{"t":"p","h":"5-статья, Жамааттын укуктук статусу 1. Жамааттын иштерин укуктук жөнгө салуу Кыргыз Республикасынын Конституциясынын, “Жергиликгүү өз алдынча башкаруу жана жергиликтүү мамлекеттик администрациялар жөнүндө” Кыргыз Республикасынын Мыйзамынын, ушул Мыйзамдын, Кыргыз Республикасынын дагы башка ченемдик укуктук актыларынын, ошондой эле жергиликтүү коомдоштуктун жана жамааттын уставдарынын негизинде жүзөгө ашырылат."},{"t":"p","h":"2. Жамаат – коммерциялык эмес уюм."},{"t":"p","h":"3. Жамаат өз мүчөлөрүнүн арыздарынын, жалпы чогулушунун протоколунун жана уставынын негизинде аны айылдык, кыштактык, шаардык кеңеште каттаган учурдан тартып юридикалык жактын статусун алат, 4. Жамаат ушул Мыйзамга жана Кыргыз Республикасынын мыйзамдарына карама-каршы келбеген, жамааттын уставына ылайык ага таандык болгон финансы каражаттарына, кыймылдуу жана кыймылсыз мүлктөрүнө ээлик кылат, пайдаланат жана тескейт."},{"t":"p","h":"5. Жамаат мүлктү сатып алууга, жамааттын менчигинде болгон мүлктү ижарага берүүгө, пайдаланууга, кайра берүүгө, күрөөгө коюуга, сатып өткөрүүгө, консультациялык жана маалыматтык кызматтарды көрсөтүүтө, жамааттын иштери менен байланышкан окуу семинарларын жана практикалык сабактарды уюштурууга жана өткөрүүтө, ошондой эле өзүнүн максаттарын жана милдеттерин натыйжалуу жүзөгө ашыруу үчүн зарыл болгон дагы башка ыйгарымдарды жүзөгө ашырууга укуктуу."},{"t":"v","l":[" бөлүм. Жамаатты түзүү, мүчөлүк жана анын иштеши","","6-статья. Жамааттын уюмдаштыруучулары"]},{"t":"p","h":"1. 10дон кем эмес үй чарбачылыгынын өкүлдөрү жамааттын уюмдаштыруучулары болуп саналышат, алар ыктыярдуу негизде биригишет."},{"t":"v","l":["2. Жамааттын уюмдаштыруучулары жалпы чогулушта:","– жамааттын иштерин жөнгө салуучу уставды кабыл алат;","– жамааттын төрагасын шайлайт,","7-статья. Жамааттын уставы","1. Устав жамааттын негизги укуктук документи болуп саналат.","2. Жамааттын уставы төмөндөгүлөрдү камтууга тийиш:","жамааттын толук жана кыскартылган аталышын;","жамааттын мүчөлөрүнүн укуктары менен милдеттери жөнүндөгү жобону;","жамааттын мүчөлүгүнө кабыл алуу жана андан чыгуу (чыгаруу) шарттарын жана тартибин;"]},{"t":"p","h":"жамаатка кирүүнүн жана мүчөлүк акынын белгиленген эң аз өлчөмүн жана аларды төгүүнүн тартибин жана"},{"t":"raw","h":"<div class=\"gloss\"><p>{ТИРКЕМЕ<\/p><\/div>"},{"t":"v","l":["<span class=\"pg\" data-n=\"136\">136<\/span>– жамааттын төрагасынын ыйгарымдары жана иш-миддеттери жөнүндө жобону:","– жамааттын базкаруу органдары тарабынан чечимдерди кабыл алуунун тартибин;","– жамааттын иштеринин регламентин;","жамааттын герагасын шайлоонун жана бошотуунун тартибин;","жамааттын каражаттарын түзүү жана аларды пайдалануу тартибин:","жамааттын уставына өзгөртүүлөрдү жана толуктоолорду киргизүү тартибин:","жзмзаттым ишинин эсебинин, аудитинин тартибин;","жаматтын токтотуунун (кайра уюштуруунун жана жоюунун) шарттарын:"]},{"t":"p","h":"Кыргыз Республикасынын мыйзамдарына карама-каршы келбеген жамааттын иштеринин өзгөчөлүктөрү менен байланышхан башка жоболорду."},{"t":"p","h":"3 Жамааттын жетекчилиги жамааттын ар бир мүчөсүнө жамааттын уставына киргизилүүчү бардык өзгөртүүлөр жаза толуктоолор жөнүнө элар кабыл алынганга чейин бир ай мурла билдирүүгө милдеттүү."},{"t":"p","h":"4 Жамазтгын уставы жалпы чогулушта жыйналышка катымикан уюмдаштыруучулардын көпчүлүк добушу менен кабыл алызият."},{"t":"p","h":"8-статья. Жамзаттын аталышы"},{"t":"p","h":"Кыргыз Республиксынын мыйзамдарына ылайык жамаат өзүнүн уставында жана башка уюмдаштыруу локумеиттеринле көрсөтүлгөн аталышты гана пайдалана алат."},{"t":"p","h":"2 Тнешегүү аймактагы мурда түзүлгөн жамааттын аталышы менен алардын жайгаштырылышы жагынан бирдей"},{"t":"raw","h":"<h4 class=\"mk\">же 1.<\/h4>"},{"t":"p","h":"катары пайдаланууга жол берилбейт."},{"t":"v","l":["белгилердин","3-статья. Жамааттын мүчөлөрү жана алардын укуктары"]},{"t":"p","h":"устазына ылайык, жергиликтүү коомдоштуктун тиешелүү аймагында туруктуу жашаган, мүчөлүк экыларды телесен. жамаат менен өз ара таламдары боюнча байланышкан, бир үй чарбачылыгынын таламын"},{"t":"p","h":"1. Жамзаттыв уставына ылайык, жамаатка муче болуу жана андан чыгуу ыктыярдуу болуп саналат."},{"t":"p","h":"3 Жамааттын мүчөлөрү жамзаттык менчикти бирдей пайдалана алышат."},{"t":"p","h":"4. Жамзаттын мүчөсү устаздын жоболорун жана ченемдерин сактабагандыгы жана/же талаптагыдай эмес аткаргавлыгы үчүн чыгарылышы мүмкүн."},{"t":"p","h":"5$ Жамзаттын мүчөсүн андан чыгаруу ага алдынала 30 кун мурда кабарлангандан жана жамааттын жалпы яогулушунда чыгып сүйлөө укугу берилгенден кийин гана жузеге ашырылышы мүмкүн."},{"t":"p","h":"Жамааттын мүчөсү аны чыгаруу жөнүндөгү жалпы чогулуштун чечимине макул болбогондо, чечим Кыргыз Республикасынын мыйзамдарында белгиленген тартипте даттанылышы мүмкүн."},{"t":"p","h":"10-статья. Жамааттын мамлекеттик органдар жана жергиликтүү өз алдынча башкаруу органдары ‚ тарабынан колдоого алынышы"},{"t":"v","l":["1. Мамлекеттик бийлик жана жергиликтүү өз алдынча башкаруу органдары:","– жамалтты түзүүте жана өнүктүрүүгө зарыл болгон укуктук, уюштуруу шарттарын түзүүгө;"]},{"t":"p","h":"– жамаатты түзүү жана өнүктүрүү, анын өз алдынча башкаруу укуктарын жүзөгө ашыруу үчүн инзестицияларды, тракттарды жана мияровредиттерди тартууга көмөк керсетутиет."},{"t":"p","h":"1. Жамааттын таламдарын козгоочу маселелер боюнча чечимдерди даярдоодо жана кзбыл алууда мамлекеттик йлих жана жергиликтүү өз алдынча башкаруу органдары жамааттык уюмдар менен консультацияларды өткөрөт."},{"t":"p","h":"3. Жамзаттын алардынз таламдарын козгоочу маселелер боюнча мамлекеттик бийлик жана жергиликтүү өз алдынча оргаңдарына жиберилуучу расмий кайрылуулары Кыргыз Республикасынын мыйзамдарына ылайык түрдө каралууга тийиш."},{"t":"v","l":[" Ч1-&lt;татья. Жамааттардын иш-милдеттери","Жамзаттар:"]},{"t":"p","h":"мамлекеттик бийлик жана өз алдынча башкаруу органдарында өз мүчөлөрүнүн таламдарын билдиришет;"},{"t":"p","h":"– жамазтт#рдын иштерине тиешелүү маселелер талкуулантанда жергиликтүү кеңештердин иштерине кеңеш берүү укугу менен катълшат;"},{"t":"p","h":"жергиликтүү кеңештердин, алардын аткаруучу-тескөөчү органдарынын жана жергиликтүү мамлекеттик алминистрациянын жамааттардын иштеринин маселелери боюнча чечимдерин аткарууга көмөктөшөт; айыл өкмөтүнүн жена жергиликтүү кеңештердин аймактарды пландаштыруу. абат кылуу, социалдык-маданий, тиричилик жана чарбалык объектилерди куруу маселелери боюнча ишине катышат."},{"t":"p","h":"жамааттардын уставынын машсаттарына жана миддеттерине ылайык дагы башка иш-милдеттерди жүзөгө ашырат. 12-статья. Жамааттын укуктары жана жоопкерчилиги 1. Жемзат төмөндөгүдөй укуктарга ээ:"},{"t":"p","h":"тиешелүү жергиликтүү кеңештер, алардын аткаруучу-тескеечу органдары. жергиликтүү мамлекеттик"},{"t":"p","h":"А"},{"t":"raw","h":"<div class=\"gloss\"><p>р ешкаруу <\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"137\">137<\/span>урузга пайдалануу межен тэшшырыячы ктары чыгууг®:."},{"t":"p","h":"тургзи имараттарды. журүлмаларды. турах жайлый тмес жайларды ижарага берүүгө. т жамааттын максаттары менен мил ипхе ышыруу уч"},{"t":"v","l":["жара","2. Жамаат өзү кабыл алган чечимдердин мыйтаг. дүүлүтү тартат.","13-статья. Жамааттын жалпы чогулушу"]},{"t":"p","h":"1. Жамааттын жогорку органы анын жалпы жюгугушу болуп саналат Жалаы чогулушту өткөрүүнү тартибе жана мезгилдүүлүгү жаматтын уставыила аныктала:"},{"t":"v","l":["2. Жаныдан уюитулган жамааттын бирикчи жалпы чогулушун","бири ачат.","3. Жамааттын биринчи чогулушунун күй","түтүү","зёмилгелүү","","устазыш иштен чыгуу","кабыл алуу жана жамааттын ишин жение салуучу лагы бишиз мосезеглер киргизилет."]},{"t":"p","h":"4. Жалпы чогулушта чечим чогулушка жамааттын. муүчелэрүнүн. веминде үчтөн экин катышканда женекей көпчүлүк добуш менен кабыл алынат."},{"t":"v","l":["14-статья. Жамааттын жалпы чогулушунун зомпеленииялары","жамааттын уставына өзгөртүүлөр жана толуктоелор киргизүү;","жамааттын иштеринин артыкчылыктуу багыттарын, анын мүлкүн пайдалануу","жамааттын мүчөлөрүн кабыл алуу жана чыгаруу {эсерде устаала бшшюза белгиленбесе:","жамааттын төрагасын шайлоо жана аны элеген кызматыншн четтеттүү;","жамааттын иши жөнүндө жылдык отчетту жана жылдык балансты бекитүү.","жамааттын башка юридикалык жактзрдын иштерине катышгуу маселелери:","зайым жана кредит алуу;","жамааттын уставында каралган дагы башка маселелер.","15-статья. Жамааттын терагасы","1. Жамааттын терагасы анын биринчи жалпы чогулушунда жамааттын"]},{"t":"p","h":"катышуучу мүчөлөрдүн көпчүлүгүнүн чечими боюнча ачык же жабык лобули берүү арасынан жалшы чогулушка шайланат."},{"t":"p","h":"2. Жамааттын төрагасы жамааттын документтерин түзөт жана хларлы айылдык, кыштактык, шаардык кенеште каттатат."},{"t":"v","l":["3. Жамааттын төрагасынын ыйгарымдарынын мөөнөтү жамааттын уставында аныкталат.","16-статья. Жамааттын менчиги","1. Жамааттын менчигине кирет:","– кыймылдуу жана кыймылсыз мүл:","– өзкаражаттары."]},{"t":"p","h":"2. Жамааттын менчигин түзүү. пайдалануу, ээлик кылуу жана тескөө тартиби жаматтын уставында аныкталат. 17-статья. Жамааттын финансы-экономикалык негизи жана менчиги 1. Жамааттын финансылык негизин кирүү жана мүчөлүк акылар, жамааттын менчигин пайдалануудан түшкөн каражаттар, демеерчулук төгүмдөр, Кыргыз Республикасынын, ошондой эпе чет өлкөлүк юрыпижалык жана жеве щшайтарынын ыктыярдуу салымдары, гранттар, ошондой эле зайым. кредит жана дагы финансы ресурстары аныкталат."},{"t":"p","h":"2. Жамааттын экономикалык негизи жана менчиги ал тарабынан курулган же сатып алынган объеяттер, ошондой эле юридикалык жана жеке жактар тарабынан ага өткөрүп берилген объекттер бетүп саналат."},{"t":"p","h":"Жаматтын каражаттары ошол аймакта жашап жаткан калктын содизллык-жономихалых абалын шзашыртуу жана абат кылуу максаттары үчүн жаматтын мүчөлөрү тарабынан пайдаланылат."},{"t":"p","h":"3. Кыргыз Республикасынын мыйзамдарында каралган учурларды вовтлоюгонлю, жергиликтүү бийлик."},{"t":"p","h":" <span class=\"pg\" data-n=\"138\">138<\/span>ашыруу жана дагы башка милдеттер менен көйгөйлөрдү чечүү максатында ыктыярдуу түрдө ассоциацияларга {бирликтерге) бириге алышат."},{"t":"raw","h":"<div class=\"gloss\"><p><\/p><\/div>"},{"t":"p","h":"Жамааттардын ассоциациясы (бирдик) коммерциялык эмес уюм болуп саналат."},{"t":"p","h":"2. Ассоциация (бирдик) жергиликтүү кенештерле катталган учурдан тартып юридикалык жактын статусун алат, Ассоциациянын (бирликтин) мүчөлөрү өз алдынчалуулугун жана юридикалык жактын укуктарын сактап калышат."},{"t":"p","h":"3. Ассоциация (бирдик) өз мүчөлөрүнүн милдеттенмелери боюнча жооп бербейт. Ассоциациянын (бирликтин) мүчөлөрү анын милдеттенмелери боюнча ассоциациянын уюмдаштыруу документтеринде каралган өлчөмдө жана тартипте субсидиялык жоопкерчилик тартышат."},{"t":"p","h":"4 Жамааттардын ассоциациясын (бирдигин) түзүүнүн жана иштешинин, ага мүчөлүктүн жана андан чыгуунун тартиби ушул Мыйзамга ылайык кабыл алынган анын уставы менен жөнгө салынат."},{"t":"p","h":"5. Жамааттардын ассоциациясы (бирдиги) эларалык донордук уюмдардын, банктардын жана финансы-кредит мекемелеринин каражаттарын, бюджеттик каражаттарды, ошондой эле юридикалык жана жеке жактардын ыктыярдуу төгүмдөрү менен кайрымдуулуктарын пайдалана алат."},{"t":"p","h":"6. Жамааттардын ассоциациясына (бирлигине) жамааттын мүчөлөрүнүн жөнөкөй көпчүлүгүнүн макулдугу менең жамааттардын уставдарына ылайык алардын компетенциясына кирүүчү маселелер боюнча алардын ыйгарымдары еткаруп берилиши мүмкүн."},{"t":"v","l":["7. Ассоциациянын (бирликтин) уставында төмөндөгүлөр камтылууга тийиш:","-_ ассоциациянын (бирликтин) толук жана кыскартылган аталышы;","-_ ассоциациянын (бирликтин) мүчөлөрүнүн укуктары жана милдеттери жөнүндөгү жоболор;"]},{"t":"p","h":"ассоциацияга (бирликке) мүчөлөрдү кабыл алуунун жана андан чыгаруунун тартиби жана шарттары; ассоциацияга (бирликке) кирүүнүн жана мүчөлүк акынын эң аз өлчөмүн белгилөө, аларды төгүүнүн тартиби жана шарттары;"},{"t":"v","l":["ассоциациянын (бирликтин) төрагасынын ыйгарымдары жана иш-милдеттери жөнүндө жобо;","ассоциациянын (бирликтин) башкаруу органдары тарабынан чечим кабыл алуунун тартиби;","ассоциациянын (бирликтин) иштешинин регламенти;","ассоцнациянын (бирликтин) төрагасын шайлоонун жана бошотуунун тартиби;","ассоциациянын (бирликтин) каражатын топтоо жана аларды пайдалануунун тартиби;","ассоциациянын {бирликтин) уставына өзгөртүүлөр жана толуктоолор киргизүүнүн тартиби;","ассоциациянын (бирликтин) ишинин аудитин, эсебин алуунун тартиби;","ассоциациянын (бирликтин) ишин токтотуунун (кайра уюштуруунун жана жоюунун) шарттары;"]},{"t":"p","h":"Кыргыз Республикасынын мыйзамдарына карама-каршы келбеген ассоциациянын (бирликтин) өзгөчөлүктөрүнө байланышкан башка жоболор."},{"t":"p","h":"19-статья. Жергиликтүү өнүгүү фондун түзүү жана анын иштеши 1. Социалдык-экономикалык милдеттерди чечүү, жергиликтүү коомдоштук мүчөлөрүнүн жыргалчылыгын жогорулатуу үчүн бириккен жамааттар ыктыярдуу негизде коммерциялык эмес уюмду – юридикалык жак болуп саналган жергиликтүү өнүгүү фондун уюштурат."},{"t":"p","h":"2. Жергиликтуу өнүгүү фондун түзүүнүн жана жоюунун тартиби, анын каражаттарын түзүү жана аларды берүү шарттары жергиликтүү өнүгүү фондунун уставы менен жөнгө салынат, ал юстиция органдарында катталат."},{"t":"p","h":"3. Уюмдаштыруучулардын жалпы чогулушунда жергиликтүү өнүгүү фондунун уставына ылайык Фонддун башкармалыгы шайланат."},{"t":"p","h":"4 Жергиликтүү өвүгүү фондуна салымдар катарында жамааттардын ыктыярдуу төгүмдөрү, жеке жана юридикалык жактардын, эларалык донорлордун, өкмөттүк эмес жана башка уюмдардын демөөрчүлүк каражаттары пайдаланылышы мүмкүн 5. Жергиликтүү өнүгүү фондунан каражаттарды берүү белгиленген кезектүүлүк тартибинде, ачыктыктын жана айкындуулуктун шарттарында жергиликтүү өнүгүү фондунун башкармалыгы тарабынан жүргүзүлөт."},{"t":"p","h":"6. Уставдабелгиленген жана Кыргыз Республикасынын мыйзамдарында каралган учурлардан тышкары жергиликтүү өнүгүү фондунун иштерине анын юридикалык статусун, ишинин максатын жана мүнөзүн өзгөртүүтө алып келүүчү кандай гана болбосун тышкы кийлигишүүгө жол берилбейт."},{"t":"v","l":["У бөлүм. Корутунду жоболор","20-статья. Ушул Мыйзамдын күчүнө кирүү тартиби","1. Ушул Мыйзам расмий жарыяланган күндөн тартып күчүнө кирет."]},{"t":"p","h":"2. Кыргыз Республикасынын Өкмөтү, жергиликтүү мамлекеттик администрациялар, жергиликтүү өз алдынча башкаруу органдары өздөрүнүн чечимдерин ушул Мыйзамга ылайык келтиришсин."},{"t":"p","h":"Кыргыз Республикасынын Президенти А.Акаев 2004-жылдын 27-декабрында Кыргыз Республикасынын Жогорку Кеңешинин Мыйзам чыгаруу жыйыны тарабынан кабыл алынган"},{"t":"p","h":"<span class=\"pg\" data-n=\"139\">139<\/span>– – ХХ] тызыарын Жарандык коолунраеы силердин розунар"}],"sub":[],"pages":[134,139]},{"title":"Кыргыз Республикасындагы муниципалитеттин болжолдуу уставы","blocks":[{"t":"h2","h":"Кыргыз Республикасындагы муниципалитеттин болжолдуу уставы"},{"t":"p","h":"Ар бир муниципалитеттин” өзүнүн уставы болунту керек. Аны жергиликтүү коомдоштук өз алдынча иштеп чыгат, элдик курултай кабыл алат жана жергиликтүү бекитет."},{"t":"p","h":"Муниципалитеттин уставы – бул жергилиятүү коомдоштуктун эн жогорку укуктук актысы, Ал жергиликтүү коомдоштуктун башка укуктук актыларынан жоору турган юридикалык мааниге 39"},{"t":"p","h":"Муниципалитеттин уставы мыйзамлайля каралган тартипте милдеттүү гүрдө юстишия органдарында катталууга тийиш. Муниципалитеттин уставын каттабай воюута аның Кыргыз Республикасынын Конституциясына жана мыйзамддарына каршы келгендиги негиз болушу мүмкүн. Уставды мамлекеттик каттоодон өткөрбөй койгондугуна байланыштуу жарандар жана жергиликтүү өз алдынча башкаруу органдары сотко кайрылса болот."},{"t":"p","h":"Муниципалитеттин уставынын бул үлгүсүн Кыргыз Республикасындагы башка муниципалитеттердин уставдарын иштеп чыгуу үчүн колдонууга болот. Уставда жергиликтүү өз алдынча башкаруу органдарынын түзүмүнүн жержерлердеги шарт-жагдайларга жараша өзгөртүлгөн ар түрдүү варианттары чагылдырылышы мүмкүн"},{"t":"h3","h":"Кулунду жергиликтүү коомчулугунун өкүлдөрүнүн курултайында"},{"t":"v","l":["ж.","кабыл алынган.","","Кулунду айылдык кеңешинин Ме___ токтому менен 200__ж. БЕКИТИЛДИ"]},{"t":"h2","h":"КУЛУНДУ МУНИЦИПАЛДЫК АЙМАГЫНЫН АЙЫЛ МЫЙЗАМЫ (УСТАВЫ)"},{"t":"p","h":"Биз, Кулунду муниципалдык аймагынын жергиликтүү коомчулугунун мүчөлөрү, арабызда бузулгус биримдикти, ынтымакты, коомдук тартипти жана бейпилдикти орнотуу, айыл жергесинде турмуш-тиричилик шартын жакшыртуу, ар бир үй-бүлөнүн жана тургундун бакубат жашоосун камсыздоону көздөп ушул өз алдынча башкаруу коомдоштугун (айыл жамаатын) түзүү менен коомдук жашоосунун ыйык эрежелерин аныктаган ушул Уставды айыл турмушунун негизги мыйзамы катары кабыл алабыз."},{"t":"p","h":"Алдыга койгон ыйык милдеттерди турмушка ашыруу максатында, биз эң оболу жалпы адамзатки тиешелүү ыймандуулуктун талаптарын, аймагыбызда жашаган бардык улуттардын өкүлдөрүнүн каада-салттарынын асыл нарктарын өзүнө камтыган айкөл Манас бабабыздын төмөндөгү жети осуятын ыйык тутуп, аларды бакубат жашоо турмушубузду курууда негизи курал жана каражатыбыз катары колдонобуз:"},{"t":"v","l":["1. Эл журттун ажырагыс бүтүндүгү жана бир жакадан баш, бир жеңден кол чыгарган биримдиги;","2. Улуттар аралык ынтымак, достук жана кызматташтык;","3. Улуттук ар-намыс жана атуулдук ариет;","4. Арыбас мээнет, алдыңкы өнөр, билим аркылуу бакубат дөөлөт;","5. Гуманизм, айкөлдүк, кечиримдүүлүк;","б. Табият менен таттуу мамиледе болуу;","7. Кыргыз мамлекеттигин чыңдоо жана аны көздүн карегиндей сактоо.","","'Муниципалитет – жергиликтүү өз алдынча башкаруу органы."]},{"t":"p","h":"<span class=\"pg\" data-n=\"140\">140<\/span>айлаңпиын уставы"},{"t":"h3","h":"|. ЖАЛПЫ ЖОБОЛОР"},{"t":"p","h":"1. Кулунду муниципалдык аймагынын Уставы – бул жергиликтүү коомдоштуктун анын башка укуктук актыларына караганда жогорку юридикалык күчкө ээ болгон жана Кыргыз Республикасынын Конституциясынын жана мыйзамдарынын негизинде кабыл алынган ченемдик укуктук акт."},{"t":"p","h":"2. Кулунду муниципалдык аймагында бийликтин булагы болуп ушул муниципалдык аймактын тургундары саналат, Алар өзүнүн бийлигин түздөн-түз жана жергиликтүү өз алдынча башкаруу органдары аркылуу ишке ашырат, 3. Ушул Устав жергиликтүү өз алдынча башкаруу органдарынын, алардын кызмат адамдарынын иш-аракеттериң жөнгө салат, ошондой эле Кулунду муниципалдык аймагындагы жергиликтүү өз алдынча башкаруунун укуктук. уюштуруучулук, экономикалык, мүлктүк, финансылык негиздерин орнотот."},{"t":"p","h":"4 Уставдын жоболору Кулунду муниципалдык аймагында жайгашкан же иш жүргүзгөн бардык юридикалык жактар жана ошондой эле жеке адамдар жана алардын бирикмелери тарабынан аткарылууга тийиш."},{"t":"p","h":"5. Кулунду жергиликтүү өз алдынча башкаруу органдарынын ченемдик укуктук актылары ушул Уставдын жоболоруна карама-каршы келбеши керек."},{"t":"p","h":"6. Ушул уставдын күчү чек арасы Кыргыз Республикасынын мыйзамдары менен аныкталган Кулунду муниципалдык аймагынын карамагына гана таралат."},{"t":"h3","h":"|. НЕГИЗГИ ТҮШҮНҮКТӨР ЖАНА ТЕРМИНДЕР"},{"t":"p","h":"Ушул Уставда төмөндөгүдөй түшүнүктөр жана терминдер колдонулат:"},{"t":"p","h":"жергиликтүү коомдоштук – Кулунду муниципалдык аймагында туруктуу жашаган жана жергиликтүү маанидеги маселелерди өздөрүнүн өкүлчүлүктүү, аткаруучу-тескөөчү жана башка органдары аркылуу өз жоопкерчилиги астында чечүү үчүн жалпы таламдары боюнча бириккен калк;"},{"t":"p","h":"жергиликтүү коомдоштуктун мүчөсү – Кулунду муниципалдык аймагында туруктуу жашаган жана өз ара милдеттенмелери боюнча жергиликтүү коомдоштук менен байланышкан адам;"},{"t":"p","h":"муниципалдык аймак – жергиликтүү өз алдынча башкаруу жүзөгө аша турган административдик-аймактык бирдик;"},{"t":"p","h":"жергиликтүү маанидеги иштер – жергиликтүү өз алдынча башкаруу органдары тарабынан Кулунду муниципалдык аймагынын калкынын жашоо-турмушун камсыз кыла турган, ушул Уставда Кыргыз Республикасынын Конститтуциясына жана мыйзамдарына ылайык аныкталган маселелер;"},{"t":"p","h":"жергиликтүү өз алдынча башкаруу органдары – жергиликтүү маанидеги иштерди өздөрүнүн жоопкерчилиги астында чечүү үчүн эл тарабынан түзүлгөн өкүлчүлүктүү, аткаруучу-тескөөчү жана башка органдары;"},{"t":"p","h":"жергиликтүү өз алдынча башкаруунун өкүлчүлүктүү органы – тиешелүү административдик-аймактык бирдиктин калкы тарабынан түздөн-түз шайлануучу депутаттардан турган жана жергиликтүү маанидеги иштерди чечүүгө ыйгарым берилген жергиликтүү өз алдынча башкаруунун коллегиалдуу органы – Кулунду айылдык кеңеши; жергиликтүү өз алдынча башкаруунун аткаруучу-тескөөчү органы – Кулунду айылдык кеңешинин чечимдерин, ошондой эле мамлекет тарабынан берилген ыйгарымдарды даярдоону жана аткарууну камсыз кылуу үчүн түзүлгөн Кулунду муниципалдык аймагында аткаруу бийлигин жүзөгө ашыруучу орган – Кулунду айыл өкмөтү;"},{"t":"p","h":"жергиликтүү өз алдынча башкаруунун башчысы – Кулунду муниципалдык аймагындагы жергиликтүү өз алдынча башкаруу органдарынын тутумундагы, калк тарабынан жалпы, тең жана тике добуш берүү аркылуу шайланган шайлануучу кызмат адамы;"},{"t":"p","h":"курултай – жалпы таламдарды билдирген маселелерди талкуулоо максатында жергиликтүү коомдоштуктун өкүлдөрүнүн чогулушу;"},{"t":"p","h":"мамлекет тарабынан берилген ыйгарымдар – жергиликтүү өз алдынча башкаруу органдары тарабынан Кулунду муниципалдык аймагында жүзөгө ашырылуучу мамлекет тарабынан берилген айрым ыйгарымдар;"},{"t":"p","h":"демилге тобу – ушул Уставга ылайык курултайды же жарандардын жыйынын өткөрүүнүн демилгесин көтөрө турган жергиликтүү коомдоштуктун мүчөлөрүнүн тобу;"},{"t":"p","h":"жарандардын жыйыны – жергиликтүү маанидеги иштерди башкарууга жергиликтүү коомдоштуктун мүчөлөрүнүн түздөн-түз катышуу формасы;"},{"t":"p","h":"муниципалдык Кулунду жергиликтүү өз органдарынын карамагында, пайдалануусунда, тескөөсүндө турган, жергиликтүү өз алдынча башкаруунун кирешелерин алуучу булак катары кызмат кылуучу жана Кыргыз Республикасынын мыйзамдарына ылайык жергиликтүү өз алдынча башкаруунун иш-милдеттерин жүзөгө ашырууга зарыл жергиликтүү коомдоштук менчиги;"},{"t":"p","h":"муниципалдык кызмат – адистик жана акы төлөнүүчү негизде жергиликтүү өз алдынча башкаруунун өкүлчүлүк жана аткаруучу-тескөөчү жана башка органдарындагы жарандарынын иш-аракети;"},{"t":"p","h":"жергиликтүү бюджет – Кулунду муниципалдык аймагынын жергиликтүү коомдоштугунун бюджети, алардын түзүлүшүн, бекитилишин жана аткарылышын жергиликтүү өз алдынча башкаруу органдары жүзөгө ашырат; жамааттык уюм – жергиликтүү коомдоштуктун мүчөлөрүнүн рухий, социалдык жана башка муктаждыктарын канааттандыруу максатында таламдарынын жалпылыгынын негизинде жеке адамдар тарабынан түзүлгөн, жергиликтүү өз алдынча башкаруу системасына кире турган ыктыярдуу өз алдынча башкаруу уюму;"},{"t":"p","h":"жергиликтүү өнүктүрүү фонду – жамааттык уюмдар тарабынан түзүлгөн жана жамааттык уюмдардын жана алардын бирикмелеринин салымдарынын, айыл өкмөтүнүн, демөөрчүлөрдүн, уюмдардын жана эларалык донорлордун ыктыярдуу негиздеги взносторунун эсебинен түзүлүүчү коомдук фонд."},{"t":"p","h":"<span class=\"pg\" data-n=\"141\">141<\/span>сизердин розунар"},{"t":"h3","h":"ш. КУЛУНДУ МУНИЦИПАЛДЫК АЙМАГЫНЫН ТЕРРИТОРИЯСЫ ЖАНА ЧЕК АРАЛАРЫ"},{"t":"p","h":"1. Кулунду муниципалдык аймагынын территориясы өзүнө муниципалдык жерлерди жана башка мыйзам чегинде өткөрүлүп бериле турган жергиликтүү өз алдынча башкаруу участкаларын камтыйт."},{"t":"p","h":"2. Кулунду аймагынын территориясынын чектери ушул аймакта жашаган калктын ой-пикирин эсепке албастан мыйзам менен аныкталган тартипте өзгөрбөөгө тийиш ЖЕРГИЛИКТҮҮ КООМДОШТУКТУН МҮЧӨЛӨГҮНӨ КИРҮҮ ЖАНА ЧЫГУУ ТАРТИБИ 1. Кулунду муниципалдык аймагында туруктуу жашаган жана жергиликтүү коомдоштук менен өз ара милдеттенмелер менен байланышкан, ушул Уставды таламларый аткарууга милдеттенген Кыргыз Республикасынын жараны жергиликтүү коомдоштуктун мүчөсү болуп саналат."},{"t":"p","h":"2. Жергиликтүү коомдоштуктун аймагында жашабаган, бирок ушул аймакта кыймылсыз мүлккө менчик укугуна ээ болгон, жергиликтүү бюджетке салык төлөгөн жана өзүнүн жергиликтүү коомдоштуктун иштерине катышууга каалоосу бар экенин билдирген Кыргыз Республикасынын жараны да жергиликтүү мүчөсү боло алат, 3. Туруктуу жашоо үчүн башка жактан көчүп келген Кыргыз Республикасынын жарандары жана чет өлкөдөн көчүп келген Кыргыз Республикасынын жарандыгын алган адамдар жеке арызыныпв негизинде жергиликтүү коомдоштуктун мүчөлүгүнө кабыл алынат."},{"t":"p","h":"‚ Кыргыз Республикасынын жараны төмөндөгүдөй учурларда жергиликтүү коомдоштуктун мүчөлүгүнөн чыгат: Кыргыз Республикасынын жарандыгын жоготкондо;"},{"t":"p","h":"анын өлгөндүгү же дайынсыз жоголгондугу жөнүндө соттун чечими мыйзамдык күчкө киргенде; каза болгондо;"},{"t":"v","l":["өзүнүн жеке арызынын негизинде (ушул аймакта туруктуу жашабаган жарандар үчүн}","\\. ЖЕРГИЛИКТҮҮ КООМДОШТУКТУН МҮЧӨЛӨРҮНҮН УКУКТАРЫ ЖАНА МИЛДЕТТЕРИ","1. Жергиликтүү коомдоштуктун мүчөсү төмөнкү укуктарга ээ:","","жергиликтүү өз алдынча башкаруу органдарына шайлоого жана шайланууга;"]},{"t":"p","h":"жергиликтүү коомдоштуктун жашоо-турмуш маселелери боюнча түздөн-түз же өзү жергиликтүү өз алдынча башкаруу органдарына шайлаган өкүлдөрү аркылуу сунуштарды киргизүүгө;"},{"t":"p","h":"жергиликтүү өз алдынча башкаруу органдары аныктаган жеңилдиктерди, ошондой эле жергиликтүү коомдоштуктун мүчөлөрүнүн биргелешкен күчтөрү менен жаралган бардык муниципалдык менчиктеги уюмдардын, ишканалардын жана мекемелердин кызматтарын пайдаланууга; жергиликтүү өз алдынча башкаруу органдарына алардын компетенциясына тиешелүү болгон бардык маселелер боюнча кайрылууга жана алардан коюлган маселе боюнча жооп талап кылууга, жергиликтүү коомдоштуктун мүчөлөрүнүн курултайларына, жыйындарына жана чогулуштарына, айылдык кеңештин ачык сессияларына катышууга, ошолордо талкууга салынган маселелер боюнча өзүнүн ой-пикирин эркин айтууга жана сунуштарын киргизүүгө;"},{"t":"p","h":"ушул Устав менен аныкталаган укуктарды бузууда аксакалдар сотуна, жергиликтүү өз алдынча башкаруунун башка органдарына, мамлекеттик укук коргоо жана сот органдарына кайрылууга;"},{"t":"p","h":"жергиликтүү коомдоштуктун мүчөлүгүнөн эркин чыгууга;"},{"t":"p","h":"Кыргыз Республикасынын Конституциясында жана мыйзамдарында, ошондой эле ушул Уставда каралган башка укуктарды пайдаланууга."},{"t":"p","h":"2. Жергиликтүү коомдоштуктун мүчөлөрү төмөнкүлөргө милдеттүү:"},{"t":"p","h":"– Кыргыз Республикасынын Конституциясын жана мыйзамдарын, ушул Уставды аткарууга жана бекем сактоого;"},{"t":"p","h":"жергиликтүү өз алдынча башкаруу органдарынын, аксакалдар сотунун мыйзамга жана ушул Уставга карама-каршы келбеген чечимдерин аткарууга;"},{"t":"p","h":"коомдоштуктун өз алдынча башкаруу органдары тарабынан мыйзам чегинде белгиленген салыктардын жана жыйымдардын бардык түрлөрүн кечиктирбей өз убагында төлөөгө;"},{"t":"p","h":"жергиликтүү коомдоштуктун турмуш-тиричилик шартын жакшыртууга багытталган бардык коомдук пайдалуу жумуштарга катышууга, аларды ишке ашыруу боюнча бекитилген шарттарды жана ченемдерди (нормаларды) милдеттүү түрдө аткарууга;"},{"t":"p","h":"жергиликтүү өз алдынча башкаруу органдарынын мыйзам чегинде жана ушул Уставдын негизинде кабыл алынган чечимдерин аткарууга;"},{"t":"p","h":"муниципалдык менчикти түзүүгө жана өнүктүрүүгө өз салымын кошууга, аларды сарамжалдуу пайдаланууга жана сактоого;"},{"t":"p","h":"мыйзамдуулукту бузуунун бардык көрүнүштөрүнө, коомдоштуктун материалдык байлыктарына жана адептүүлүккө көңүл коштук менен мамиле кылгандарга келишпөөчүлүк менен мамиле жасоого;"},{"t":"p","h":"курчап турган табиятка (айлана-чөйрөгө) камкордук жана сарамжалдуулук менен мамиле кылууга, токой, дарак, башка өсүмдүктөргө, жан-жаныбарларга кыянаттык кылгандар менен күрөшүүгө, тарыхый, маданий жана табигый эстеликтерди сактоого;"},{"t":"p","h":"турак-жай имараттарын куруу эрежелерин так сактоого, турак үйлөрдү, ага жакын аймактарды пайдаланууда <span class=\"pg\" data-n=\"142\">142<\/span>өрт коопсуздугун, санитардык жана ветеринардык эрежелердин туура сакталышына көмөктөшүүгө; жергиликтүү коомдоштуктун мүчөлөрүнүн биргелешкен пайдалануусундагы жерди, сууну жана б Т жаратылыш байлыктарын, муниципалдык менчиктеги мүлктөрүн сарамжалдуу пайдаланууга. Өзгөчө милдеттер жана парздар:"},{"t":"p","h":"– балага кам көрүү, аны туура тарбиялоо, анын үйбүлө куруусуна шарт түзүп берүү – ар бир ата-энен милдети;"},{"t":"p","h":"үйбүлөнү курууда мыйзамга жана ушул Уставга карама-каршы келген кыз ала качмай өңдүү үрп-адаттард баш тартуу;"},{"t":"p","h":"ата-энелерине камкордук көрүү. эмгекке жарамдуу жашы жетилген ар бир баланын милдети; жергиликтүү коомдоштуктун ар бир мүчөсүнө гумандуулук жана боорукердик менен мамиле жас жетимдерди жана ата-энесинин багуусунан ажыраган, ошондой эле багар-көрөрү жок кары-картандард майыптарды, эмгекке жараксыздарды камкордукка алуу жана багуу – жалпы коомдоштуктун ыйык парзы; арбир улуттун намысын жана каада-салттарын урматтоо, улуттар аралык ынтымакты, тынчтыкты, биримди чыңдоо Кулунду муниципалдык аймагында жашаган ар бир улуттун өкүлүнүн милдети,"},{"t":"h3","h":"М. КУЛУНДУ МУНИЦИПАЛДЫК АЙМАГЫНДАГЫ ӨЗ АЛДЫНЧА БАШКАРУУНУН НЕГИ"},{"t":"p","h":"ЖОБОЛОРУ, ПРИНЦИПТЕРИ ЖАНА СИСТЕМАСЫ"},{"t":"p","h":"1. Кулунду муниципалдык аймагынын өз алдынча башкаруусу – бул жергиликтүү коомдоштуктун мыйзамди жана ушул Уставдын чегинде жана өз жоопкерчилиги астында жана элдин бакубат жашоосу үчүн муниципалд аймактын жашоо-турмушунун бардык иштерин башкарууга болгон укугу. Бул укук айылдык кеңеш жана жергиликт өз алдынча башкаруунун башчысы аркылуу, ошондой эле түздөн-түз курултайларды, жашоочулардын жыйындары конференцияларын өткөрүү менен жана мыйзам чегинде аныкталган башка формалар аркылуу ишке ашырылат."},{"t":"p","h":"2. Кулунду муниципалдык аймагынын жергиликтүү өз алдынча башкаруу системасын"},{"t":"v","l":["өкүлчүлүктүү орган – айылдык кеңеш,","аткаруучу-тескөөчү орган – айыл өкмөтү;","коомдук өз алдынча башкаруу кеңештери;","аксакалдар соттору, коомдук тартипти коргоо кошуундары;","жергиликтүү материалдык-финансылык байлыктарды пайдалануу боюнча көзөмөл тобу;"]},{"t":"p","h":"аш-тойлорду өткөрүү, муниципалдык аймакта күтүлгөн каада-салттарды жөнгө салуу комиссиясы; жамааттык уюмдар жана башка эл тарабынан түзүлгөн органдар ошондой эле жарандардын жыйындары жана чогулуштары түзүшөт."},{"t":"p","h":"3. Кулунду муниципалдык аймагында жергиликтүү өз алдынча башкаруу төмөндөгү принциптердин негизин ишке ашырылат:"},{"t":"p","h":"Кыргыз Респүбликасынын Коституциясынын жана мыйзамдарынын, ушул Уставдын эрежелеринин Кулу муниципалдык аймагында бекем сакталышы жана так аткарылышы;"},{"t":"p","h":"жергиликтүү маселелерди чечүүдө коомдоштуктун өзүн өзү камсыз кылуусу, өзүн өзү каржылоосу, өзүн жөнгө салуусу;"},{"t":"p","h":"жергиликтүү коомдоштуктун мүчөлүгүнө эркин жана өз ыктыяры менен кирүүнү жана чыгууну камсыз кыл жергиликтүү өз алдынча башкаруу органдарынын ишмердигинин коомдоштуктун мүчөлөрү тарабын! көзөмөлгө алынышы жана алардын эл алдындагы жоопкерчилиги;"},{"t":"p","h":"айылдык кенештин депутаттарынын жана жергиликтүү өз алдынча башкаруунун башчысынын жабык гике шайлануусу;"},{"t":"p","h":"жергиликтүү өз алдынча башкаруунун өкүлчүлүктүү жана аткаруучу-тескөөчү органдарынын ыйгарымда менен милдеттеринин так чектелиши;"},{"t":"p","h":"жергиликтүү коомдоштуктун мүчөлөрүнүн мыйзамдуу укуктары менен кызыкчылыктарынын корголушу; социалдык акыйкаттуулуктун сакталышы;"},{"t":"p","h":"жергиликтүү өз алдынча башкаруу органдарынын ишиндеги маалымдуулук, ачыктык, муниципалд! аймактагы коомдук уюмдар жана бирикмелер менен тыгыз байланышта болушу;"},{"t":"p","h":"жергиликтүү коомдоштуктун мүчөлөрүнүн жергиликтүү маанидеги бардык маселелерди талкууда сунуштарын киргизүү менен пикир айтуу эркиндиги;"},{"t":"p","h":"жергиликтүү өз алдынча башкаруу органдарынын жергиликтүү маанидеги иштерди өздөрүнө ыйгарыл укуктарынын чегинде, өз алдынча чече алуусу, кабыл алынган чечимдеринин негиздүүлүгү жа мыйзамдуулугу боюнча коомдоштуктун жана мамлекеттин алдындагы жоопкерчилиги,"},{"t":"h3","h":"КУЛУНДУ МУНИЦИПАЛДЫК АЙМАГЫНЫН ЖЕРГИЛИКТҮҮ ӨЗ АЛДЫНЧА КАРУУ ОРГАНДАРЫНЫН МИЛДЕТТЕРИ"},{"t":"p","h":"Жергиликтүү өз алдынча башкаруу органдары аткарууга тиешелүү болгон негизги маселелер:"},{"t":"p","h":"Кулунду муниципалдык аймагынын Уставын (айыл мыйзамын) кабыл алуу жана ага өзгөртүү киргизүү, а аткарылышын көзөмөлгө алуу;"},{"t":"p","h":"муниципалдык инфраструктураны кармоо жана өнүктүрүү;"},{"t":"p","h":"айылдын жашоо-турмушун камсыз кылуу тутумунун иштөөсүн жана өнүгүүсүн, калкка социалдык <span class=\"pg\" data-n=\"143\">143<\/span>Жарандын Жана вашпарууза атышуу – ХХТ тпшлыядын Жаранфдып поощунцавы сидерцин ролунар маданий кызматтарды көрсөтүүнү уюштуруу;"},{"t":"p","h":"муниципалдык аймактын социалдык-экономикалык өнүгүү жана калкты социялдык жактан коргоо ирограммаларын иштеп чыгуу жана аларды аткаруу;"},{"t":"v","l":["муниципалдык менчикке ээлик кылуу, пайдалануу жана тескөө;","жергиликтүү бюджетти түзүү жапа аткаруу маселелери;"]},{"t":"p","h":"саламаттыкты сактоо, маданият, мектепке чейинки, мектептеги жана кесиптик билим берүү системаларыя өпүктүрүүгө тиешелүү түзүү;"},{"t":"p","h":"жеке ишкердүүлүктү колдоо жана өнүктүрүү, кичи жана орто бизнести өнүктүрүүгө көмөк берген түзүү; г"},{"t":"v","l":["турак-жай жана муниципалдык чарбаны өнүтүрүү","муниципалдык аймакты көрктөндүрүү;","муниципалдык жерлерди жана менчикти сарамжалдуу пайдалануу;","турмуш-тирчилик жана соода жагынан тейлөө"]},{"t":"p","h":"жергиликтүү коомдоштуктун калкынын тзрыхый жана маданий каала-салттарын сактоо жана өнүктүрүү, ошондой эле аларды өткөрүү тартибин жөнгө салуу,"},{"t":"v","l":["дене-тарбиясын, епортту жана туризмди өнүктүрүү;","коомдук тартипти сактоо;"]},{"t":"p","h":"мыйзамдарга ылайык жергиликтүү өз алдынча башкаруу органдарына өткөрүлүп берилген башка маселелер."},{"t":"h3","h":"КУЛУНДУ АЙЫЛДЫК КЕҢЕШИ"},{"t":"p","h":"1. Кулунду айылдык кеңеши Кулунду муниципалдык аймагынын жергиликтүү ёз алдынча башкаруусунун өкүлчүлүктүү органы болуп саналат жана аймакта жашаган жарандар тарабынан жалпыга бирдей, тен жана тике шайлоо укугунун негизинде жашыруун добуш менен төрт жылдык мөөнөткө шайланат."},{"t":"p","h":"2. Кулунду айылдык кеңеши депутаттардан турат."},{"t":"p","h":"2.1. Айылдык кеңештин депутаты болуп Кулунду муниципалдык аймагында акыркы эки жылдан бери жашап келе жаткан 20 жашка толгон Кыргыз Республикасынын жараны жалиыга бирдей, тен жана тике шайлоо укугунун негизинде жашыруун добуш менен төрт жылдык мөөнөткө шайланат."},{"t":"p","h":"2.2. Айылдык кеңештин депутатын шайлоо тартиби Кыргыз Ребпубликаесынын мыйзамдары менен аныкталат."},{"t":"p","h":"2.3. Айылдык кеңештин депутаттарынын ыйгарымдары кеңештин биринчи сессиясынын ачылыш күнүнөн башталат да, кийинки чакырылган айылдык кеңештин биринчи сессиясынын ачылыш күнүнлө аяктайт."},{"t":"p","h":"3. Айылдык кеңештин ишинин негизги уюштуруучу-укуктук формасы – бул айылдык кеңештин сессиясы. Айылдык кеңештин сессиясы депутаттардын жалпысынан 2/3 катышканда гана өткөрүлүүгө тийиш. Айылдык кеңештин аныкталган мөөнөттөрдө боло турган сессияларынан башка кезексиз боло турган сессиялар өткөрүлүшү мүмкүн. Сессияны чакыруу жана өткөрүү тартиби айылдык кеңештин Регламенти менен аныкталат."},{"t":"p","h":"4. Айылдык кеңеш чече турган маселелерди алдын ала кароо жана даярдоо үчүн, ошондой айылдык кеңештин чечимдерин ишке ашырууга, аны көзөмөлгө алууга катышуу үчүн айылдык кенеш туруктуу жана убактылуу комиссияларды түзөт."},{"t":"p","h":"5. Кулунду айылдык кеңеши:"},{"t":"p","h":"– аймакты социалдык-экономикалык өнүктүрүүнүн жана калкты социалдык жактан коргоонун ирограммаларын бекитет жана алардын аткарылышына көзөмөл жүргүзөт;"},{"t":"p","h":"жергиликтүү бюджетти жана анын аткарылышы жөнүндө отчётту бекитет, ошондой эле бюджеттин аткарылышынын жанабюджеттен тышкаркы фонддордун пайдаланышыны

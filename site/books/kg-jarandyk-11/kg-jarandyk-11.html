<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Жарандуулук жана башкарууга катышуу 11</title>
<style>/* Mobile textbook reader. No external fonts or libraries: everything works offline. */
:root {
  --bg: #ffffff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3;
  --panel: #f6f6f6; --accent: #1f6feb; --accent-fg: #ffffff;
  --fs: 19px; --lh: 1.55;
  --font: Georgia, "Noto Serif", "DejaVu Serif", "Times New Roman", serif;
  --bar-h: 48px; --foot-h: 28px;
}
[data-theme="sepia"] { --bg: #f5ecd9; --fg: #4a3b2a; --muted: #8a7458; --line: #e0d2b4; --panel: #ece0c6; --accent: #9a5b13; }
[data-theme="dark"]  { --bg: #111315; --fg: #d8d8d8; --muted: #8c8c8c; --line: #2a2d31; --panel: #1b1e21; --accent: #6ea8ff; --accent-fg: #0b0b0b; }
[data-theme="contrast"] { --bg: #000000; --fg: #ffffff; --muted: #c8c8c8; --line: #444; --panel: #151515; --accent: #ffd400; --accent-fg: #000; }
[data-font="sans"] { --font: Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 16px/1.4 Roboto, "Noto Sans", Arial, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- Library ---------- */
.lib { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lib h1 { font-size: 22px; margin: 8px 0 4px; }
.lib .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.lib-head { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
.lib-head h1 { flex: 1; margin: 0; }
.school { display: flex; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.school button { flex: 1; min-height: 44px; padding: 0 10px; font-size: 15px; background: var(--panel); }
.school button + button { border-left: 1px solid var(--line); }
.school button.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.my-link { flex: 0 0 auto; font-weight: 600; min-height: 40px; padding: 0 12px; font-size: 14px; }
.grade { margin-bottom: 10px; }
.grade-h { display: flex; width: 100%; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 18px; font-weight: 600; text-align: left; }
.grade-h::after { content: '›'; font-size: 24px; color: var(--muted); margin-left: 10px; transition: transform .15s; }
.grade.open .grade-h::after { transform: rotate(90deg); }
.grade-h .n { margin-left: auto; font-size: 14px; font-weight: 400; color: var(--muted); }
.grade-b { padding: 0 2px; }
.grade-t { font-size: 20px; margin: 18px 0 0; }
.subj { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.bk { border-bottom: 1px solid var(--line); padding: 4px 0 12px; }
.bk:last-child { border-bottom: 0; }
.bk-t { font-size: 17px; font-weight: 600; }
.bk-s { font-size: 14px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bk-m { color: var(--muted); font-size: 13px; margin: 3px 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: .5; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.bk-h { display: flex; align-items: flex-start; gap: 4px; }
.bk-h .bk-t { flex: 1; padding-top: 10px; }
.bk .row { gap: 4px; }
.bk .row .btn { min-height: 40px; padding: 0 18px; font-size: 14px; margin-right: 8px; }
.bk .icon { color: var(--muted); flex: 0 0 auto; }
.bk .icon[disabled] { opacity: .5; }
.bk .icon.on { color: var(--accent); }
.bk .star.on svg { fill: currentColor; }
.bk .star.on { color: #e3a008; }
.share-opts { display: flex; flex-direction: column; gap: 10px; }
.share-opts .note { margin-top: 0; }
.sheet h3 .icon { flex: 0 0 auto; }

/* ---------- Reader ---------- */
.reader { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; user-select: text; }
.viewport { position: absolute; left: 0; right: 0; top: 0; bottom: var(--foot-h); overflow: hidden; }
.flow {
  height: 100%; column-fill: auto; padding: 20px 0 12px;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  will-change: transform; transform: translate3d(0,0,0);
  hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
}
.flow.anim { transition: transform .25s ease-out; }
.flow p { margin: 0 0 .15em; text-indent: 1.4em; text-align: left; }
.flow p.ni { text-indent: 0; }
.flow h1, .flow h2, .flow h3 { font-family: Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.25; break-after: avoid; page-break-after: avoid; }
.flow h1 { font-size: 1.35em; margin: .2em 0 .8em; text-align: center; }
.flow h2 { font-size: 1.15em; margin: 1.1em 0 .5em; }
.flow h3 { font-size: 1.0em; margin: 1em 0 .4em; }
.flow .verse { margin: .6em 0 .8em 1em; break-inside: auto; }
.flow .verse div { text-indent: -1em; padding-left: 1em; text-align: left; }
.flow .verse .gap { height: .7em; }
.flow figure { margin: .8em 0; text-align: center; break-inside: avoid; page-break-inside: avoid; }
.flow figure img { max-width: 100%; height: auto; border-radius: 4px; background: var(--panel); }
.flow figcaption { font-size: .8em; color: var(--muted); margin-top: .3em; }
.flow .box { border-left: 3px solid var(--accent); padding: .1em 0 .1em .7em; margin: .7em 0; }
.flow .pg { font: 11px/1 Roboto, Arial, sans-serif; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 4px; margin: 0 3px; vertical-align: 2px; text-indent: 0; white-space: nowrap; user-select: none; }
.flow .end { height: 1px; }
.flow .endnote { text-align: center; color: var(--muted); font-size: .8em; margin-top: 2em; font-family: Roboto, Arial, sans-serif; }
[data-theme="dark"] .flow img, [data-theme="contrast"] .flow img { filter: brightness(.9); }

.foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot-h); display: flex; align-items: center;
  justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.foot .t { overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }

.bar { position: absolute; left: 0; right: 0; background: var(--panel); border-color: var(--line); z-index: 5;
  transition: transform .2s; display: flex; align-items: center; }
.bar.top { top: 0; height: var(--bar-h); border-bottom: 1px solid var(--line); transform: translateY(-100%); padding: 0 4px; }
.bar.bottom { bottom: 0; border-top: 1px solid var(--line); transform: translateY(100%); padding: 10px 16px 14px; flex-direction: column; align-items: stretch; gap: 6px; }
.reader.ui .bar { transform: none; }
.bar .title { flex: 1; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.bar .info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* ---------- Sheets (TOC, settings) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85%; overflow: auto; background: var(--bg);
  border-radius: 16px 16px 0 0; z-index: 11; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
.sheet h3 { margin: 10px 0 12px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.toc a { display: block; padding: 11px 4px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 15px; }
.toc a.sub { padding-left: 20px; font-size: 14px; color: var(--muted); }
.toc a.cur { color: var(--accent); font-weight: 600; }
.set { margin: 14px 0; }
.set label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; }
.seg button.on { border: 2px solid var(--accent); font-weight: 600; }
.swatch[data-v="light"] { background: #fff; color: #1b1b1b; }
.swatch[data-v="sepia"] { background: #f5ecd9; color: #4a3b2a; }
.swatch[data-v="dark"] { background: #111315; color: #d8d8d8; }
.swatch[data-v="contrast"] { background: #000; color: var(--accent-fg); }
.goto { display: flex; gap: 8px; }
.goto input { flex: 1; min-height: 44px; font-size: 16px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px;
  border-radius: 20px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Textbook elements produced by tools/convert_pdf.py ---------- */
.flow .tasks, .flow .gloss { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45;
  background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0; }
.flow .tasks p, .flow .gloss p { margin: 0 0 .35em; text-align: left; }
.flow .gloss { border-left: 3px solid var(--accent); }
.flow p.note { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; font-style: italic; text-indent: 0; margin: .6em 0; }
.flow p.attr { text-align: right; text-indent: 0; font-style: italic; color: var(--muted); margin: .1em 0 .8em; }
.flow p.sep { text-align: center; text-indent: 0; color: var(--muted); margin: .5em 0; letter-spacing: .3em; }
.flow h2 .pg, .flow h3 .pg { font-weight: normal; }
.toc .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 4px 2px; }
.toc a .p { float: right; color: var(--muted); font-size: 13px; margin-left: 8px; }

/* ---------- Elements produced by tools/convert_layout.py (typeset textbooks) ---------- */
.flow figure img { cursor: zoom-in; }
.flow h4.mk { font: 700 .78em/1.3 Roboto, "Noto Sans", Arial, sans-serif; letter-spacing: .05em; color: var(--accent);
  margin: 1em 0 .3em; break-after: avoid; page-break-after: avoid; }
.flow p.hl { color: var(--accent); text-indent: 0; }
.flow p.small { font-size: .82em; text-indent: 0; color: var(--muted); }
.flow sup, .flow sub { font-size: .7em; line-height: 0; }
.flow .kbox { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45; background: var(--panel);
  border-radius: 8px; padding: .45em .7em; margin: .5em 0; border-left: 3px solid var(--accent); }
.flow .kbox > b { display: block; }
.flow .frame { background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0;
  font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; line-height: 1.45; }
.flow .frame p { text-indent: 0; margin: 0 0 .35em; text-align: left; }
.flow .tbl { margin: .8em 0; font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .8em; line-height: 1.35; }
.flow .tbl .tt { font-weight: 600; text-indent: 0; text-align: center; margin-bottom: .3em; }
.flow .tbl table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.flow .tbl th, .flow .tbl td { border: 1px solid var(--line); padding: .3em .35em; vertical-align: top; text-align: left; overflow-wrap: anywhere; hyphens: auto; }
.flow .tbl th { background: var(--panel); }
.flow .tbl tr { break-inside: avoid; page-break-inside: avoid; }

.zoom { position: fixed; inset: 0; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; background: rgba(0,0,0,.92); z-index: 30; }
.zoom-in { position: absolute; inset: 0; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
.zoom-in img { margin: auto; flex: none; touch-action: pan-x pan-y; object-fit: contain; background: #fff; cursor: zoom-in; }
.zoom-x { position: absolute; top: 8px; right: 8px; color: #fff; background: rgba(0,0,0,.5); z-index: 31; }
.flow h4.sh { font: 700 .95em/1.3 Roboto, "Noto Sans", Arial, sans-serif; text-align: center; margin: .8em 0 .4em; break-after: avoid; page-break-after: avoid; }

/* maths books */
.flow h4.ex, .flow h4.try { font-family: Roboto, Arial, sans-serif; margin: 1.1em 0 .3em; font-size: 1em; }
.flow h4.ex { display: inline-block; background: #f7e400; color: #111; padding: .1em .6em; border-radius: 3px; }
.flow h4.try { color: var(--accent); }
.flow p.goal { font-size: .85em; text-indent: 0; background: var(--panel); border-radius: 8px; padding: .4em .7em; }
.flow b.bd { display: inline-block; text-indent: 0; padding: 0 .4em; border-radius: 1em; background: var(--fg); color: var(--bg);
  font: bold .8em/1.45 Roboto, Arial, sans-serif; margin-right: .2em; }
.flow b.nb { display: inline-block; text-indent: 0; min-width: 1.4em; border-radius: 4px; background: var(--accent); color: var(--accent-fg);
  text-align: center; font-size: .8em; margin-right: .3em; }
.flow .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.15; margin: 0 .1em; }
.flow .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .15em; }
.flow p.ml { text-indent: 0; padding-left: 1em; }
.flow p.side { font-size: .85em; }
.flow details.ans { margin: .3em 0 .8em; font-size: .9em; }
.flow details.ans summary { color: var(--accent); cursor: pointer; font-family: Roboto, Arial, sans-serif; }

/* wide tables become one card per row on phones */
@media (max-width: 560px) {
  .flow .tbl.cards table, .flow .tbl.cards tbody, .flow .tbl.cards tr, .flow .tbl.cards td { display: block; width: auto; }
  .flow .tbl.cards tr:first-child { display: none; }
  .flow .tbl.cards tr { border: 1px solid var(--line); border-radius: 8px; margin: .5em 0; padding: .3em .5em; }
  .flow .tbl.cards td { border: 0; padding: .15em 0; }
  .flow .tbl.cards td::before { content: attr(data-l); display: block; font: 600 .75em/1.3 Roboto, Arial, sans-serif; color: var(--muted); }
  .flow .tbl.cards td:first-child { font-weight: 600; }
}
.flow figure.vec svg { max-width: 100%; height: auto; display: inline-block; background: #fff; border-radius: 4px; cursor: zoom-in; }
[data-theme="dark"] .flow figure.vec svg, [data-theme="contrast"] .flow figure.vec svg { filter: brightness(.9); }
.flow .rt { border-top: 1px solid currentColor; padding-top: 1px; margin-left: 1px; }
.flow .it { display: inline-block; max-width: 100%; margin-right: .9em; text-indent: 0; }

/* ---------- Text quality badge (library rows, first page of a book, reader top bar) ---------- */
.q { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 10px 2px 8px; margin: 0 8px 2px 0;
  border: 1px solid var(--line); border-radius: 13px; background: var(--panel); color: var(--fg);
  font: 12px/1.2 Roboto, "Noto Sans", Arial, sans-serif; vertical-align: middle; text-indent: 0; white-space: nowrap; }
.q i, .qdot i { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.q-exact i { background: #2da44e; }
.q-proofread i { background: #3b82f6; }
.q-ocr i { background: #e8900c; }
.qdot { display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 12px; }
.qdot i { width: 12px; height: 12px; }
.bk .row .q { margin: 0 0 0 auto; }
.flow .qline { margin: 0 0 1em; text-indent: 0; }
.flow .qline .q { font-size: 13px; cursor: pointer; }
.qsheet .q { font-size: 14px; min-height: 30px; margin: 0 0 4px; }
.qsheet p { font-size: 15px; line-height: 1.5; margin: 10px 0; }
</style>
</head>

шүндүрүлдү. Конституциялык кенсшменин иши аяктап, Шайлоо кодекси жаныртылгандан кийин 1РЕ$ бул бап боюнча атайын китепчени чыгармакчы."},{"t":"p","h":"Окуу куралын Кыргыз Республикасынын Билим берүү жана маданият министрлиги жактырган"},{"t":"p","h":"23-майлагы №426/1 буйрук), ал эми Кыргыз билим берүү академиясы колдонууга сунуш кылган (2054-жыл, 29-сентябрь, КБАнын окумуштуулар кенешинин № 5 чечими)."},{"t":"p","h":"Бул китеп сатылбайт, бекер таратылат,"},{"t":"v","l":["Китептин ангписчесин Саймон Женкинс,","кыр'ызчаын Твапай Абдиев жана","Жолдош Турдубаев редакциялашты","Корректорлор Аида Эгембердиева жана","Бактыгүл Чыныбаева","Котормочулар","Жолдош Турдубаев","Бурүл Шамбаева","Дилбар Асамидинова","","Авторлору.","Жупиана Пипом","Лестер Саламон","Тони Боузр","Чедомир Флего","Ламар Крейвенс","Крис Щупп","Владислав Потоцкий","Юрий Подкуйко","Болот Малабаев","Алтынай Карасаева","Ирина Ячник","Анатолий Макаров","Акжол Бердиев","Канат Сыдыков","Светлана Осауленко","Элеонора Прояева","Наталья Кузнецова"]},{"t":"p","h":"Дайыма колдоо көрсөтүп келгендиги учун РЕ$ Кыргыз Республикасынын Билим берүү, илим жана жаштар саясаты министрлигине. Кыргыз билим берүү академиясына терен ыраазычылыгын билдирет."},{"t":"p","h":"ҤЕЗ ошондой эле Америкалык Юристтер Ассоциациясына – Борбордук Европа жана Евразия өпкөлөрү үчүн укуктук демилге программасына, АРД/Чекки – Коммерциялык укукту өнүктүрүү долбооруна. Улуттук демократиялык институтка, Кыргыз Республикасынын Юстиция министрли-гине, Урбан институтуна Кыргыз Республикасынын Айылдардагы жана кыштактардагы жергилик-түү куралын сызактан өткөрүүгө катышкан бардык мугалимдерге, окуучуларга жана практиканттарга да алкыш айтат"},{"t":"p","h":"УДК"},{"t":"h3","h":"С «1ЕЕ$ – Кыргызстан», 2005"},{"t":"raw","h":"<div class=\"gloss\"><p>4 <\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"4\">4<\/span>Кымбаттуу мугалимдер жана окуучулар!"},{"t":"p","h":"Сиздер ГРЕХ эларалык фонду даярдаган билим берүү боюнча окуу куралын алдыңызд курстун материалдары менен сиздер 10-к тааныша баштагансыздар. Азыркы жашта] бул курс канчалык маанилүү экенин айтып от зарылчылыгы жок болсо керек. Өлкөбүздүн эков лык, саясий жана социалдык турмушунда абай өзгөрүүлөр болууда. Бирок бул жаңылануунун ойд жүрүшү үчүн, өлкөбүздүн гүлдөп өнүгүшү үчүн быз узак убакыт бою, талыкпастан иштөөгө тий Болуп жаткан өзгөрүүлөрдү терең ишти туура жүргүзүү мүмкүн эмес. Сиздер, б] окуучулар, келечекте толук укуктуу жарандар өлкөбүздү башкарасыздар. Өлкө үчүн, анын келечеги үчүн сиздердин жоопкерчилигиңизд болот, андыктан азыртан эле коомдогу өз ролун мыкты билген жаран болууга даярданышы керек. Бул жагынан ушул курстун, окуу куралынын сиздер үчүн пайдасы чоң болору анык. Ку 11-класстагы бөлүгүндө сиздер жергиликтүү өз алдынча башкаруу системасы менен тааны бүтүндөй өлкөнүн өркүндөп өнүгүшү ар бир жергиликтүү коомдоштуктагы жашоо тартш жөнгө салынышына жараша болорун көрөсүздөр. Мында сиздер шайлоо системалары, жана акыйкат шайлоонун негизги принциптери менен таанышасыздар. Ошондой эле сиздер күчтүү жарандык коомдун калыптанышынын башкы эрежелерин, азыркы ме глобалдуу маселелерди жана көптөгөн башка маанилүү темаларды окуп үйрөнөсүздөр. Бул курсту окуп үйрөнүүдө жаңы билимдерди өздөштүрүү эле эмес, зарыл көндүмдөрдү өн"},{"t":"p","h":" коомундагы силердин ролуңар” курсу өз коомдоштугундагы да, бүтүндөй өлкөдөгү да маселе, чече билген жарандарды тарбиялоо максатында түзүлгөн. Демократиялык, эркин жана өнүккөн коомду курууга зор салым кошо алышыңыздар үчүн бул курсту окуп үйрөнүүдө чоң ийгиликтерди каалайм."},{"t":"p","h":"Сиздерге ак жол тилеп,"},{"t":"h3","h":"Досбол Нур уулу"},{"t":"p","h":"Кыргыз Республикасынын билим берүү, илим жана жаштар саясаты министри <span class=\"pg\" data-n=\"5\">5<\/span>Кымбаттуу достор!"},{"t":"p","h":"Биздин биргелешип баштаган долбоорубуз жүзөгө ашып, ал аркылуу Кыргыз Республикасында демократиянын өнүгүү процессине салым кошо алганыбыз үчүн кубанычтабыз."},{"t":"p","h":" Демократия – бул ар бир жарандын өз өлкөсүнүн башкарылышына жооптуу болушу жана мамлекет- тин туруктуулугунун негизи."},{"t":"p","h":"в – Кыргызстан эгемендикке жетишкен күндөн бери Япония бул республиканын демократия жолуна түшүп, базар реформаларын жүргүзүү үчүн жасаган аракеттерин дайыма колдоп келет жана мындан ары да колдой берет."},{"t":"p","h":"Бул долбоордун дагы бир өзгөчөлүгү – ал бир нече донорлордун күч аракетин бириктирди. Биз ТЕЕ5 жана башка донор өлкөлөр, ошондой эле эларалык уюмдар менен кызматташ болгондугубузга коомундагы силердин ролунар” деп аталышы эле айтып тургандай, бул китеп коом жана демократия жөнүндөгү негизги билимдерди калыптандырат, окуучуларды өз алдынча ойлонууга: үйрөтөт жана өлкөдө болуп жаткан окуяларга карата жекече пикир айтууга көнүктүрөт. Ошентип, бул китеп коомдун толук кандуу жаранын тарбиялайт. Ал окуучулардын эле эмес, алардан улуу курактагы адамдардын да дайыма колдонушуна ылайыклтуу түзүлгөн. Менимче бул окуу куралы кыргызстандыктардын чыныгы демократияны курууда колдоно турга! абдан пайдалуу каражаты болот. Бул китеп жарык көргөндөн кийин кыргызстандык жаш жарандык коомдогу жашоо жөнүндө билим алууга эң сонун мүмкүнчүлүк алышты деп ойло Сиздерди урматтап,"},{"t":"v","l":["Япониянын Кыргыз Республикасындагы","убактылуу ишенимдүү өкүлү","КАСАЙ Тацухико"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"6\">6<\/span>Кымбаттуу достор!"},{"t":"p","h":"Жарандар өздөрүнүн укуктарын коргоочу жана күндөлүк турмуштагы маселелерин чече турган институттарды түзүүгө катышууга тийиш экендигин канчалык туура түшүнсө, демократия ошончолук жакшы өнүгөт."},{"t":"p","h":"Ушиул жагынан алганда, бул окуу китебинин жарык көрүшүн биз Кыргызстандын демократиялык өнүгүүсүндө жаштар активдүү роль ойношу учун аларга таалим берүүгө кошулган зор салым деп баалайбыз."},{"t":"p","h":"Европанын коопсуздук жана кызматташуу уюму (ЕККу, орусча – ОБСЕ) жарантаануу сабагынын Кыргызстандагы орто мектептердин программасына киргизилишин колдоп, эки жылдан бери ушул окуу китебин бастырып чыгарууга көмөктөшүп келет, Биз бул сабак-тын кандай окутулуп жатканына да көз салып жүрөбүз. Андыктан бул сабак киргизилгенден бери ага мугалимдер, окуучулар жана ата-энелер өтө кызыгып калганын, окуучулар аны абдан жакшы көрө турганын билебиз."},{"t":"p","h":"Канчалык өркүндөтүлгөн болсо да, эгер өлкөнү демократиялык башкарууга коомдун келечеги үчүн өздөрү жооптуу экендигин сезген, өз укуктарын билген жана коргой алган, коомдун башка мүчөлөрүнүн укуктарын сыйлаган адамдар катышпаса, мындай система ийгиликтүү иштей албайт. Бул скулу китеби демократиялык башкаруунун дал ушул принциптерин өздөштүрүүгө жардам берет. Окуучулар менен мугалимдердин пикирлерин билгенден кийин бул окуу китеби максатка толук шайкеш келээрине көзүм жетти."},{"t":"p","h":"Бул сабакты мыкты окутууга умтулуп, анын өзгөчөлүктөрүн жакшы билип алууга аракеттенген мугалимдерге чын ыкластан ыраазылык билдиргим келет. Жаңы курстун ийгиликтүү окутулушу эң оболу өз окуучуларынын келечеги үчүн жооптуу экендигин билген, элге пайдалуу ишти жан дили менен аткарган мугалимдерге байланыштуу. Өз мамлекетиңиздердин келечегине кошуп жаткан салымыңыздар жемиштүү болсун. Арыбаңыздар! Бул китепти түзүүгө катышкандардын баарына жана мугалимдерге методикалык жактан жардам берип жаткандарга да чыгармачыл ийгиликтерди каалайм."},{"t":"p","h":"Кыргыз Республикасынын Билим берүү, илим жана жаштар саясаты министрлиги жана Шайлдо системаларынын эларалык фонду менен биздин жүргүзгөн кызматташуубуз мындан ары да жемиштүү болот, бүтүндөй кыргыз коомуна пайда келтирет жана демократиялык жолдо гулдөп өнүккөн Кыргызстанды курууга биргелешип салым кошо алабыз деп үмүттөнөм."},{"t":"h3","h":"Баарыңыздарга ийгилик каалайм!"},{"t":"p","h":"’ Элчи Маркус МЮЛЛЕР, ЕККУнун Бишкектеги Борборунун башчысы"}],"sub":[],"pages":[1,6]},{"title":"XIII бап. Кыргызстандагы жана дүйнөнүн башка өлкөлөрүндөгү жергиликтүү бийлик органдары","blocks":[{"t":"h2","h":"<span class=\"pg\" data-n=\"7\">7<\/span>XIII бап. Кыргызстандагы жана дүйнөнүн башка өлкөлөрүндөгү жергиликтүү бийлик органдары"},{"t":"h3","h":"Текстти окуганга чейинки көнүгүүлөр"},{"t":"v","l":[" * т 01-тапшырма. Терминдер жана аныктамалар 15 мун,","","еригинер менен терминдерге туура келген аныктамаларды бергиле.","","өкүл дөрүнүн алпы жашоочуларды","кызыктырган маселелерди талкуулоо үчүн өткөрүлүүчү жыйыны.","б) Жергиликтүү өз алдынча башкаруунун аткаруучу-тескөөчү органы.","в) Кичи райондордун кеңештери жана комитеттери, үй, көчө, квартал,","‚| кыштак, айыл комитеттери.","г) Шаардык аткаруучу-тескөөчү органдын шайланма башчысы.","д) Жергиликтүү кеңештин чечими."]},{"t":"p","h":"е) Өкүлдүн бийлик органдарына түздөн-түз эл тарабынан шайланышы."},{"t":"p","h":"ж) Жергиликтүү өз алдынча башкаруунун өкүлдүк органы."},{"t":"p","h":"з) Райондук мамлекеттик администрациянын дайындалуучу башчысы. В Кромдонитук – жашаган аймагынын же кызыкчылыктарынын жалпылыгы боюнча байланышкан а) т коомдоштукка таандык жана жергиликтүү өз алдынча башкаруу органынын карамагында турган нерселер (мисалы, шаардын, айылдын жерлери, туракжай-коммуналдык чарбанын мүлкү)."},{"t":"p","h":"б) Шайлануучунун билимине, тажрыйбасына коюлган талаптар."},{"t":"p","h":"в) Чечимдерди кабыл алуу боюнча алардын таасири тие турган адамдар менен чогуу өткөрүлүүчү кеңешме."},{"t":"p","h":"г) Мамлекеттик бюджеттен ишканаларга, уюмдарга берилүүчү, кайтарылып алынбай турган акча каражаттары."},{"t":"p","h":"д) Айылдагы, кыштактагы жана шаардагы жергиликтүү коомдоштуктун бюджети."},{"t":"p","h":"02-тапшырма. Айланаңды кара 15 мун."},{"t":"p","h":"Эки-экиден болуп теменкуге окшош тизме тузгуле, анда силер мектепке келе жатканда жолдон кергенунердун бардыгы жазылышы керек. Силер атүгүл айылдын схемасын чийип, ар кандай жергиликтүү бийлик органдары тарабынан көрсөтүлүүчү тейлөөнүн бардык түрлөрүн жазсаңар да болот. (Айылдын же райондун аймагын топтор бөлүштүрүп алса да болот)."},{"t":"raw","h":"<h4 class=\"mk\">Почта Менин үйүм<\/h4>"},{"t":"p","h":"Автобус аялдамасы Машиналар _`Силер көргөн тейлөө кызматтарынын кайсыларын мамлекеттик бийлик органдары аткарат жана алардын менчиги болуп саналат? Кайсылары жергиликтүү өз алдынча башкаруу органдарынын же айрым түү өз алдынча башкаруу органына тиешелүү."},{"t":"raw","h":"<div class=\"gloss\"><p>А таблицасы 5. тер мин. Же ура: № 1. Шаардык 2. Мэр 5 |3. Аким 4. Жергиликтүү кеңеш |5. Тике шайлоо @ 6. Аймактык коомдук өз алдынча башкаруу ё органдары 7. Курултай х 8. Токтом 4 С бирикмеси. Б таблицасы талаптар Жергиликтүү 9 бюджет 1 3. Дотациялар 4. Муниципалдык! менчик 5. Жыйналыш, $ чогулуш Жол Дүкөндөр<\/p><p>\"Муниципалдык – же<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"8\">8<\/span>уюмдардын. жеке аламдардын карамагына кирет жана менчиги болуп эсептелет: Аларды теменкуде “гү белгилегиле Ж – жергиликтүү өз алдынча башкаруу органдары; М – мамлекеттик бийлик органдары; Б (башка) аламдар жана уюмдар (бул кызматты ким көрсөтөрүн анык белгилөөгө аракет кылгыла)."},{"t":"p","h":"Силер турган жердеги мамлекеттик бийлик же жергиликтүү өз алдынча башкаруу органдарынын ба объектилерин тизменерге кошкула"},{"t":"p","h":"Окуу үчүн текст"},{"t":"h3","h":"Киришүү"},{"t":"p","h":"Бул бапта Кыргыз Республикасындагы жана дүйнөнүн башка өлкөлөрүндөгү жергили башкаруунун формалары, анын милдеттери менен иштөө өзгөчөлүктөрү каралат."},{"t":"p","h":"Жергиликтүү” дегенде облустарга, чоң же чакан шаарлар менен айылдарга тиешелүүлөр түшүнөбүз. Бирок штаттар же, мисалы, Россиядагыдай федерация субъектилери бир топ чоң болгондукта адатта “жергиликтүү” өз алдынча башкаруу органдарына кирбейт."},{"t":"p","h":"Кээ бир өлкөлэрде жергиликтүү башкаруу органдары жалпы мамлекеттик башкар системасындагы муун же бөлүк гана болгондуктан, алардын ортосундагы айырманы байкоо кыйын. Бир башка өлкөлөрдө жергиликтүү башкаруу органдары көп жагынан кыйла өз алдынчалыкка ээ. Дегинкие алардын өз алдынчалыгы канчалык экенин төмөндөгүдөй критерийлер менен аныктоого болот: аткаруу органынын жетекчилери шайланабы же жокпу, шайланса – ким тарабынан? жалпы мамлекеттик саясаттын турмушка ашырылышы үчүн алар канчалык жооптуу? жергиликтүү башкаруу органдары өлкөнүн борбордук бийлигине канчалык көз каранды? өздэрүнүн жөнгө салуучу нормаларын чыгарууга, өз алдынча каржылык (финансылык) киреш алууга жана өздөрү туура көргөндөй сарптоого алар канчалык укуктуу? 3 Шаар башкармалыктары жана жергиликтуу кенештер сыяктуу башкаруу органдары мамлеке мыйзамдардын негизинде түзүлөт. Алар айыл тургундарынын жыйыны сыяктуу башкаруунун рас; (официалдуу) эмес формаларынан кыйла даана айырмаланат (“расмий эмес” мыйзамсыз дегенди билдирбей Бирок булардын баары эле абдан маанилүү функцияларды аткарат. Бийликтин борбордук органы мында органдарга өз аныктамасын бергенде бул айырмачылык андан бетер татаалдашат. Анткени борбордук бийи бул органдарга таандык расмий ыйгарымдар менен милдеттердин көлөмүн так аныктоого тийиш. Айрым өлкөлөрдө райондор менен шаарларды шайланма кеңештер башкарат. жамаат, 3,5 мин өз ара жардамдашуу топтор с Бүгүнкү күндө өлкөбүздө 6 миңге жакы Мындай кенештин башында демейде тургундар жана 4,4 миң коомдук бирикме түзүлүп, иште тарабынан тике шаилануучу же кеңеш мүчөлөрү жатат. Катары улам кеңейип бара жаткан бул шайлаган төрага {же мэр) турат. Ошол аймактын топтор социалдык жактан өнүгүүгө абдан жашы тийиштүү куракка жеткен ар бир тургуну зор таасир тийгизүүдө. Айыл өкмөттөрүнүй шайлоодо добуш бергенге, кеңеш мүчөлүгүнө ТҮЗҮМҮнө кирген жамаат формалары жергиликтү же мэрликке (кеңеш төрагалыгына) талапкер ШР сй ба болуп көрсөтүлгөнгө укуктуу. Кээ бир өлкөлөрдө оңдоо сыяктуу чакан долбоорлор боюнч. мэрди мамлекет Оашчысы кеңеш сунуштаган натыйжалуу иштей алаарын далилдеп жатат. Да талапкерлердин ичинен тандап дайындашы ушул жамааттар ар түрдүү жергиликтүү өнүгү мүмкүн. Төмөн турган органдарга демейде фонддорун, кредиттик союздарды, өз ар туруктуу иштеген кызматкерлер кирет. көмөктөшүү фонддорун түзүүгө көмөктөштү. Эм _женундегу Европа харти Жергиликтүү өз алдынча башкаруу биздин алдыбызда ушундай ы р М у ясында жер иктүү жана бюрократиялык тоскоолдуктарсыз э. жергил арттырып, алар учун ар кандай у арачылыктарсы: саны] өз алдынча башкаруу органдары мамлекеттик кредит, грант жана башка ресурстарды ал иштердин кыйла көп бөлүгүн ЖӨНГӨ Салуу мүмкүндүгүн жаратып берүү маселеси турат. жана башкаруу мүмкүндүгүнө ээ болушу керек деп баса белгиленген. Мындай укукту эркин, ыруун, бирдей, түз жана бүт жалпы добуш берүү жолу менен шайланган кеңештер жана ыйындар жүзөгө ашырат."},{"t":"p","h":"(А. Акаевдин “Миң жылдык өнүгү! максаттары: жакырчылыкты кыскартуу жан деген Шэм 2004-жылы 13-майда өткөн Улуттук форумд ы чыгып сүйлөгөн сезунен] артия – кайсы бир маанилүү жоболор же керектүү маалыматтар камтылган расмий документтин аталышы."},{"t":"raw","h":"<div class=\"gloss\"><p>1.0 1\\ 1 4) Я ү д тү Ал<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"9\">9<\/span>Жарандыт жанв жаялететти ваштаруува катышуу – ХХЛ кылызйын Жарандын воожунуавы розуйар"},{"t":"p","h":"Жергиликтүү бийликти уюштуруунун кыйла демократиялуу үлгүсүн тандаганда адатта төмөндөгүдөй жүйөлөрдү келтиришет:"},{"t":"p","h":"1. Бул ошол аймакта жашап, жергиликтүү шарттарды бардыгынан жакшы билген жана башкаруу чечимдеринин таасири бардыгынан көбүрөөк гие турган адамдарга эң туура чечим кабыл алуу мүмкүнчүлүгүн берет Бул тургундарга өздөрү жакшы билгени талапкерлердин ичинен татыктуусун тандоо мүмкүндүгүн берет."},{"t":"p","h":"Бул гургундарга өздөрү жашагин коомдоштукту башкаруу ыкмаларына түздөн-түз таасир этүү мүмкүнчүлүгүн берет. Адамдардын добуштары өз коомдоштугун башкаруу маселелеринде эске алынса, алар буга чындап кызыгып, башкарууну өркүндөтүүгө катышат Бирок кээ бир демократиялуу өлкөлөрдө жергиликтүү жетекчилер шайланбай, дайындалат да, ошол жерлердеги дээрлик дайыма болуучу шайланма өкүлчүлүктүү органдарга отчёт берип турат. Бул жетекчилерди көбүнчө жергиликтүү кеңештердин көрсөтүүсү же макулдугу менен же өлкөнүн президенти, же парламент, же бийликтин ушул эки бутагы макулдашып"},{"t":"p","h":"Жергиликтүү жетекчинин дайындалганы көбүнчө кыйла алгылыктуу дев эсептелет, анткени а) аткаруу органынын башчысы жергиликтүү башкаруу ишинде тажрыйбалуу болушу керек, ал эми катардагы жарандар адатта талапкерлердин кесиптик даярдыгына туура баа бергенге мүмкүнчүлүгү болбойт;"},{"t":"p","h":"б) бул өлкөнү өнүктүрүү саясатын ырааттуу жүргүзгөнгө мүмкүндүк берет да, ар кайсы региондордун атаандашуусуна жол койбойт;"},{"t":"p","h":"в) кантсе да, бул деле демократиялуу жол деп эсептелет, анткени, эгер аламдар тике шайлоодо өлкө президенти менен парламент мүчөлөрүн жаныдан шайласа, бийликтин җергиликтүү аткаруу органдарынын башчылары алмашуусу ыктымал;"},{"t":"v","l":["г) бул арзан болот, анткени шайлоо уюштурууга каражат талап кылынбаит.","","Кыргызстандагы жергиликтүү өз алдынча башкаруу органдары жана","жергиликтүү мамлекеттик администрациялар"]},{"t":"p","h":"Кыргызстанда жергиликтүү (облустардын, райондордун мамлекеттик администрация жана жергиликтүү өз алдынча башкаруу органдарын (айылдардын, кыштактардын, шаарлардын деңгээлиндегилерди) айырмалай билүү керек. Жергиликтүү өз алдынча башкаруу системасына жергиликтүү кеңештер, алардын аткаруучу-тескөөчү органдары (мэриялар, шаар башкармалыктары жана айыл өкмөттөрү), аймактык коомдук өз алдынча башкаруу органдары (АКӨ – ТОС), калк тарабынан түзүлүүчү башка органдар, ошондой эле жарандардын жыйналыштары (же чогулуштары) кирет. Жергиликтүү мамлекеттик администрациялар облустун жана райондун аймагындагы мамлекеттик аткаруу бийлигинин органдары болуп саналат. Алар жергиликтүү өз алдынча башкаруу органдарына кирбейт."},{"t":"v","l":["Кыргыз Республикасында төмөндөгүдөй","жергиликтүү кеңештер иш жүргүзөт:","&gt; айыл кеңештери","&gt; кыштак кеңештери","&gt;» шаардык кеңештер","Жергиликтүү ез алдынча башкаруу","органдарынын ассоциациясынын жергиликтүү","кеңештерге шайлоо боюнча анализинин","жыйынтыктары","Бул анализге ылайык шайлоодо депутаттыкка"]},{"t":"p","h":"Жогорку Кеңеш тарабынан кабыл алынып 6 миң талапкер көрсөтүлгөн, алардын 60%ы 30- 2005-жылы февралда Президент кол койгон 40 жаштардагы куракта экендиги аныкталган. мыйзамга ылайык буга чейинки облустук жана"},{"t":"v","l":["райондук кеңештер жоюлган.","Ассоциациянын төрагасы К. Дыйканбаев","айткандай,","добуш","берүүгө","шайлоочулар"]},{"t":"p","h":"Кеңештин чечимдери токтомдор түрүндө Бишкектегиге караганда аймактарда көбүрөөк чыгарылат. Жергиликтүү кеңештердин курамында катышкан, Ал муну айыл жериндеги жашоо деңгээлинин төмөндүгү жана айылдыктардын түзүлүүчү депутаттык комиссиялар сессияларда мындай абалды өзгөртүүнү каалагандыгы каралуучу маселелерди тактап, кеңештин чечим- менен түшүндүрөт. “Бишкек шаардык деринин аткарылышына көзөмөл жүргүзөт. кеңешинин депутаттыгына талапкерлердин Туруктуу депутаттык комиссиялар негизинен пайыздык катышын караганда, алардын 75%ы тийиштүү аймактагы экономикалык, социалдык, өз бизнесин коргогусу келген ишкерлер улуттук-маданий өнүгүүгө байланышкан экендиги аныкталды. Ал эми айыл жериндеги маселелерди тактоого катышат. Жергиликтүү өз талапкерлердин максаты – элеттеги түзүлгөн жагдайды жакшыртуу”, – деди К. Дыйканбаев. алдынча башкаруу жөнүндөгү жаңы мыйзамга (АКИргезз, 2004-жыл, 25-октябрь) <span class=\"pg\" data-n=\"10\">10<\/span>ылайык облустардын губернаторлору жергиликтүү өз алдынча башкаруунун өкүлдүк органдарынын чечимдеринин аткарылышын токтотуп коюуга акысы жок. Бирок эгер Кыргыз Республикасынын мыйзамдарына каршы келсе, токтотууга тийиш."},{"t":"p","h":"Жергиликтүү мамлекеттик администрация органдары менен жергиликтүү өз алдынча башкаруу органдарынын ортосунда мындай олуттуу айырмачылык бар: иш жүзүндө жергиликтүү мамлекеттик администрация “жогору жактан” дайындалат да, борбордук бийликтин саясатын жүзөгө ашырат. Жергиликтүү өз алдынча башкаруу органдары шайланат жана тийиштүү аймактын калкынын таламдарын коргойт. 2001-жылдагы жергиликтүү өз алдынча башкаруу жөнүндөгү мыйзам боюнча жергиликтүү өз алдынча башкаруунун негизги милдети калктын үстүнөн бийлик жүргүзүү эмес, ага кызмат көрсөтүү болуп саналат. Алар элдин жашоосундагы олуттуу маселелерди айкындап, элдин зарыл тейлөөлөргө болгон талаптарын өз милдеттеринин чегинде аткарууга тийиш."},{"t":"p","h":"Мурдагы, советтик системада бийликтин жергиликтүү органдарындагы жетекчи кызматкерлер демократиялык жол менен дайындалчу эмес. Анткени көбүнчө ар бир кызматка бирден гана талапкер көрсөтүлүп, анын талапкерлигин да адегенде коммунисттик партия карап бекитчү. Азыр акырындык менен бул системадан жаңы системага өтүү жүрүп жатат. Ага ылайык мыйзам боюнча эл мамлекеттик бийликтин борбордук органдары дайындаган чиновниктердин бийлигин теңдештирүүчү жергиликтүү өкүллүк органдарын шайлайт. 1991-жылдан кийин айрым өзгөрүүлөр болуп өтсө да, мындагы негизги бурулуш 2001-жылы Кыргыз Республикасынын “Жергиликтүү өз алдынча башкаруу жөнүндө” жаңы мыйзамынын кабыл алынышы менен гана ишке ашты. Жаңы мыйзамга таянып, эл айрым шаарлардагы жана барлык айылдардагы дайындалуучу жетекчилерди шайлануучулар менен алмаштырган эле."},{"t":"p","h":"Жергиликтүү өз алдынча башкаруу системасы алгач ирет реформаланып жаткандыктан, укуктар менен бөлүштүрүүдө карама-каршылыктар жана биринин ишин бири кайталоочулук жоюла элек."},{"t":"p","h":"Кыргызстандагы мамлекеттик бийликтин жана"},{"t":"v","l":["жергиликтүү өз алдынча башкаруу органдарынын административдик түзүмү","","Президент","","Мамлекеттик бийлик","Мамлекеттик бийлик"]},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Аткаруу бийлиги<\/td><td>Өкүлдүк бийлик<\/td><\/tr><tr><td>{Өкмөт)<\/td><td>(Жогорку Кеңеш)<\/td><\/tr><tr><td>Жерг. мами! администрациялэр<\/td><td>д ‘жоо”<\/td><td>жоо<\/td><\/tr><tr><td>Облустук мами.<\/td><td>Бишкек жана Ош*<\/td><td>Бишкек жана<\/td><\/tr><tr><td>администрация<\/td><td>ш. мэриялары<\/td><td>Ош ш. кенештери<\/td><\/tr><tr><td>Жерг. мами. администрациялар<\/td><td> жоо»<\/td><td>жоо<\/td><\/tr><tr><td>Рай. мам.<\/td><td>Облустук<\/td><td>Облустук<\/td><\/tr><tr><td>администрация<\/td><td>маанидеги<\/td><td>маанидеги<\/td><\/tr><tr><td>(акимият)<\/td><td>шаардын мэриясы<\/td><td>шаардын кенеши<\/td><\/tr><tr><td>жөо<\/td><td>жөо<\/td><td>жоо<\/td><td>жоо<\/td><\/tr><\/table><\/div>"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Айыл<\/td><td>Айыл, кыштак<\/td><td>Райондук<\/td><td>Райондук<\/td><\/tr><tr><td>өкмөтү<\/td><td>кеңеши<\/td><td>маанидеги<\/td><td>маанидеги<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"шаардын башчысы шаардын кенеши"},{"t":"raw","h":"<h4 class=\"mk\">Буп схема 2001-жылдын декабрында кабыл алынган жергиликтүү өз алдынча башкаруу жөнүндө мыйзамга ылайык башжаруунун жергиликтүү органдарынын түзүлүшүн чагылдырат.<\/h4>"},{"t":"v","l":["Аймактык коомдук өз алдынча башкарууга төмөнкүлөр кирет:","– кичи райондордун комитеттери жана кеңештери","– көчө комитеттери","– кварталдык комитеттер","– башка органдар"]},{"t":"p","h":"(Түштүктөгү айрым шаарларда жана айылдарда, өзбөк жамааттарында маале сыяктуу өз алдынча уюштуруунун салттуу формалары бар, алар да аймактык коомдук өз алдынча башкаруу системасынын бөлүгү болуп эсептелет)."},{"t":"p","h":"<span class=\"pg\" data-n=\"11\">11<\/span>Эскертүү: ЖӨО, Кыргыз республикасынын мыйзамдарында каралгандай, жергиликтүү өз алдынча башкаруу органын билдирет, ал эми тырмакчага алынган “ЖӨО\" ушундай статус алынса да, административдик жактан Президентке көз карандылыгы сакталгандыгын туюнтат."},{"t":"p","h":"*Ош республикалык маанидеги шаар статусуна, ал эми Токмок жана Каракол облустук борбор статусуна 2003- жылы ээ болду, бирок бул алардын финансылык статусуна кандай таасир этээри али аныктала элек."},{"t":"p","h":"3.0 Облустук мамлекеттин администрациялар"},{"t":"p","h":"Жети облустун ар биринин башында республиканын Президенти тарабынан төрт жылдык мөөнөткө дайындалган губернатор турат. Губернатор өзүнүн мамлекеттик администрациясын түзөт. Ал түздөн-түз Президентке жана премьер-министрге баш иет да, аларга отчёт берет."},{"t":"p","h":"Облустук мамлекеттик администрациядагы бардык кызматкерлерге толук өлчөмдөгү айлык акы республикалык бюджеттен төлөнөт. Облустук мамлекеттик администрациялар өз аймагында мамлекеттик саясатты турмушка ашырууга жооп берет. Буга саламаттык сактоо,билим берүү, байланыш жана социалдык чөйрөнүн башка кызматтары, мамлекеттик менчикти башкаруу жана облустун аймагында тартипти камсыз кылуу кирет. Облуста тартипти сактоодогу алардын „ жоопкерчилиги чектелүү, анткени бул учун жалпысынан укук коргоо органдарынын иштерин көзөмөлдөөчү Ички иштер министрлиги жооп берет."},{"t":"v","l":["Көп","өлкөлөрдөгү","жергиликтүү","кеңештердин","администрация башчысы жана кызматкерлери түздөн-түз"]},{"t":"p","h":"шайланат. Кеңеш мүчөлөрүнүн көпчүлүгү администрация башчысынын сунушун жактап добуш бергенде гана ал чечим"},{"t":"p","h":"Силер билесиңерби?"},{"t":"p","h":"элкелерда мэрлер айлык акы алышат. ин башка шайланма эрүнө адатта кеңеш жыйындары і{ мезгилдеод е гана жөлөкпул берилет. т Ошентсе да сы кеңештерде бул маселе кабыл ала алат. Бул өлкөлөрдөгү жергиликтүү кеңештердин ар түрдүүчө чечилет, мында алар ролу абдан маанилүү. Алардын карамагына жол куруу, башкарган аймактагы калктын саны, табигый ресурстарды пайдалануу жана башка көптөгөн жалпы аянт, байлык эске алынат. маселелер кирет."},{"t":"p","h":"3.1 Райондук администрациялар (Бишкектин шаардык райондорунан тышкары)"},{"t":"p","h":"Кырк райондун ар биринин (шаардык райондор буга кошулбайт) мамлекеттик администрациясын Президент тарабынан дайындалган аким башкарат."},{"t":"p","h":"Райондук мамлекеттик администрация, (облустук администрациядай элеу мамлекеттик саясатты турмушка ашырууга жооп берет. Андыктан облустуку сыяктуу эле структуралык бөлүмчөлөрү болот. Райондун акими түздөн-түз Президентке, премьер-министрге, ошондой эле облустун губернаторуна баш иет. Жергиликтүү администрациянын башчысы буйруктарды жана ченемдик-укуктук (нормативдикукуктук) актыларды чыгара алат. Райондук администрациянын кызматкерлеринин ишмердиги республикалык бюджеттен каржыланат."},{"t":"p","h":"Көптөгөн өлкөлөрдө райондук жана шаардык жергиликтүү бийлик органдары бар, аларда шайланма кеңештер региондорду башкаруу органдарындагыдай эле бийликке ээ болушат. Бул кеңештер жогору турган органдар кабыл алган ченемдик жоболор боюнча иштөөгө тийиш, бирок алар региондук кеңештердин түздөн-түз башкаруусунда болбойт. Иш жүзүндө райондук жана шаардык кеңештер региондук кеңештерге караганда бир топ кеңири укуктарга жана көп сандагы кызматкерлердин штатына ээ болот. Адатта аларда проблемалуу маселелерди аныктоо үчүн же долбоорлордун жүзөгө ашырылышын көзөмөлдөө үчүн түзүлгөн комитеттер иштейт."},{"t":"v","l":["3.2 Кыргызстандагы жергиликтүү мамлекеттик администрациялардын","негизги милдеттери"]},{"t":"p","h":"Жергиликтүү мамлекеттик администрациялардын негизги милдеттерине төмөнкүлөр кирет:"},{"t":"p","h":"а) аймакты социалдык-экономикалык жактан өнүктүрүү жана калкты социалдык коргоо программаларынын долбоорун түзүү, жергиликтүү кеңеш бекиткенден кийин алардын аткарылышын камсыздоо;"},{"t":"p","h":"б) жергиликтүү бюджетти аткаруу;"},{"t":"p","h":"в) өзгөчө кырдаалдардын, табигый кырсыктардын алдын алуу жана алардын кесепеттерин жоюу боюнча иш-чараларды координациялап (жалпы багыттап), жүзөгө ашыруу;"},{"t":"p","h":"<span class=\"pg\" data-n=\"12\">12<\/span>г) жарандардын, алардын ичинен жашы жете электердин укуктарын сактоого көзөмөл жүргүзүү, Райондук мамлекеттик администрациялар бул саналгандардан тышкары төмөндөгүдөй милдеттерди аткарат."},{"t":"p","h":"&gt; калкты укуктук, социалдык-маданий, чарба жана тиричилик жактан тейлөөнү уюштурат; &gt; жергиликтүү байланыш түйүндөрүнүн бардык түрлөрүн, көчөлөрдү, жолдорду жана башка объекттерди тийиштүү абалда кармап туруу боюнча иш-чаралар менен программаларды иштеп чыгып, жүзөгө ашырат."},{"t":"p","h":"Көпчүлүк өлкөлөрдө айрым жергиликтүү органдар жалпы мамлекеттик программаларды толуктоочу кошумча кызматтарды түзүшү мүмкүн болсо да, негизинен бул органдарга саламаттык сактоо, билим берүү жана социалдык төлөмдөр үчүн жоопкерчилик жүктөлбөйт. Бул кызматтарды демейде борбордук министрликтердин бөлүмдөрү башкарат. Мындан тышкары, көпчүлүк өлкөлөрдөгү кеңештер жерди пайдалануунун (башкача айтканда, турак жай курууга же өндүрүштүк максатка иштетүүнүн) жалпы эрежелерин иштеп чыга алат."},{"t":"p","h":"4.0 Республмкалык, облустук жана райондук маанидеги шаарлар"},{"t":"p","h":"Бишкек жана Ош республикалык маанидеги шаар деген статуска ээ. Облустук маанидеги 10 шаар жана райондук маанидеги 13 шаар бар. (Шаардын статусу башынан эле анын чоңдугуна же калкынын санына карай эмес, андагы маанилүү өнөр жай ишканаларынын болушуна жараша аныкталып келген)."},{"t":"p","h":"Бишкекте, Ошто жана облустук маанидеги шаарларда аткаруучу-тескөөчү органдын башчысы мэр леп аталат. Аны Президент сунуштаган талапкерлердин ичинен шаардык кеңештин депутаттары шайлайт. (Бул депутаттарды өз кезегинде шаардын тургундары тике шайлайт). Мэр бир эле учурда кеңештин депутаты боло албайт."},{"t":"p","h":"Мэрлер Президенттин жана Өкмөттүн, шаар кенешинин алдында жооп берет. Эгерде шаардык кеңештин жалпы депутаттарынын 2/эси ага ишеним көрсөтпөсө, Президент мэрди иштен алышы жана шанрдык кенеш жаңы мэрди шайлаганга чейин мэрдин милдетин аткаруучуну дайындашы мүмкүн."},{"t":"p","h":"Мэр шаардык кеңеште шаардык бюджетти тааныштырышы, өз ишинин башка пландарын жүзөгө ашырууга анын макулдугун алышы, ал эми финансылык жылдын акырында кеңешке отчёт бериши керек. Бишкек шаардык кеңеши кыйла жогорку деңгээлдеги өз алдынчалыкты көрсөтө алган: мисалы, 2002- жылы ал мэр сунуш кылган бюджетти бекитүүдөн баш тарткан."},{"t":"p","h":"Бишкек шаары төрт районго бөлүнөт. Бул райондук администрациялардын башчылары Бишкек шаардык кеңешинин макулдугу боюнча дайындалат да, Бишкектин мэрине баш иет. Шаардын райондорунда өздөрүнүн кеңештери жок, калктын таламдарын шаардык кеңеш коргойт."},{"t":"p","h":"Райондук маанидеги шаарларда, мисалы, Өзгөндө, мэр түздөн-түз шаардын калкы тарабынан шайланат жана ошол эле учурда шаардык кеңештин төрагасы да болот. Шаардык кеңештин курамына Иден 21ге чейинки сандагы депутат кирет. Шаардык өз алдынча башкаруу органдарынын айрымдары жергиликтүү ченемдик-укуктук актыларды чыгаруу жагынан кыйла өз алдынча иш жүргүзөт. Шаарларда жана кыштактарда азыркы кезде бюджет боюнча коомдук угуулар уюштурула баштады. Анда аткаруучу-тескөөчү органдын башчысы алдыда кандай иштер жасала тургандыгын түшүндүрүп берет."},{"t":"v","l":["4.1 Айылдар жана кыштактар","","Айылдарда жана кыштактарда","бийликтин аткаруучу-тескеечу органы айыл","өкмөтү болуп саналат. 2004-жылы алардын [№","саны 472 болгон. Айылдагы, кыштактагы","жергиликтүү өз алдынча башкаруу органынын","башчысы мурункудай дайындалбастан, ар төрт","жылда айылдын тургундары тарабынан тике","шайлоолордо шайланат. (Айыл өкмөтүнүн","башчылыгына талапкердин жашы 25тен","кичүү же 65тен улуу болбошу керек. 2001-","жылдагы шайлоолордо мурда дайындалган","айыл өкмөт башчыларынын","шайлоочулар шайлабай койгондуктан"]},{"t":"p","h":"кызматтарынан кетишти. Жергиликтүү өз Айыл өкмөтүнүн башчысы элге бюджет боюнча отчет берүүдө"},{"t":"p","h":"<span class=\"pg\" data-n=\"13\">13<\/span>Жарандын жана маллепетти вашнарууёда потышуу – ХХ пыдывдын Жарандын поочунцавы силердин ролунар алдынча башкаруу органынын башчысы жергиликтүү бюджеттен толук ставкада айлык алып иштеген штаттык й обл Балыкчы, маанидеги ы алалабат, рлар: аракол, 1 р ызматке Р болуп канты сан: Каракол, Кызылкыя, Майлысуу,"},{"t":"p","h":"Айыл өкмөтүнүн негизги милдеттерине төмөндөгүлөр сулукту, Талас, Ташкөмүр, Токмок. үр, То кирет:"},{"t":"p","h":"Райондук маанидеги шаарлар:"},{"t":"p","h":"1. Калкка социалдык жана маданий тейлөө Баткен, Исфана, Кант, Карабалта,"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>кызматтарын көрсөтүү<\/td><td> Карасуу,<\/td><td>Кекжаңгак,<\/td><td>Кербен,<\/td><\/tr><tr><td>Аймакты<\/td><td>социалдык-экономикалык<\/td><td>жактан |! Кочкората, Нарын, Ноокат,<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"өнүктүрүү жана калкты социалдык жактан коргоо #Оллоната, Шопоков"},{"t":"v","l":["Бюджетти иштеп чыгуу жана аны тийиштүү кеңеш","бекиткенден кийин аткаруу"]},{"t":"p","h":"4. Жерди сарамжалдуу пайдалануу боюнча иш-чараларды даярдап, жүзөгө ашыруу. Айыл өкмөтүнүн башчысы жергиликтүү кеңешке жергиликтүү салыктарды жана жыйымдарды киргизүү боюнча сунуш жасай алат. Айылдык кенеш 9дан 21ге чейинки сандагы депутаттан турат. Ал жылына төрттөн кем эмес ирет сессияга чогулат. Айыл, кыштак кенештеринин милдетине жергиликтүү бюджетти жана анын аткарылышы жөнүндөгү отчётту бекитүү, жергиликтүү салыктарды, салыктан тышкаркы төлөмдөрдү киргизүү, муниципалдык менчикти пайдалануу тартибин аныктоо, айылдын, кыштактын уставын бекитүү кирет. Жергиликтүү кенештин чечимдери шайланган бардык депутаттардын көпчүлүк добушу менен кабыл алынат да, токтом түрүндө чыгарылат. Айылдын, кыштактын бюджетине төмөнкүдөй багыттар камтылышы мүмкүн:"},{"t":"v","l":["1) муниципалдык менчик объектилерин сатуу же ижарага (арендага) берүү;","2) айылдарды көрктөндүрүү;"]},{"t":"p","h":"3) өтө жакыр үйбүлөлөргө колдоо көрсөтүү; Айылдардын, кыштактаромын негизги проблемалары 4) мектеп же спорттук курулмаларды куруу ж.у.с."},{"t":"p","h":"Айыл өкмөтү мамлекеттик бийлик органдары Айыл тургундарынын пикири боюнча; берген функцияларды да аткарат. Бул функциялар уу эшырүү- луну менен бирге аларды аткаруу учун зарыл акча Электр кубаттуулугу менен камсыздоо – 20,4% каражаттар да өткөрүлүп берилет. Мындай каржылоо Социалдык маселелер (пенсия, жумушсуздук, жана жергиликтүү салыктан түшкөн башка каражаттар жардыларга жардам) – 20% алардын калкказарыл болгон кызматтарды көрсөтүшүнө Жер маселеси (салык, айыл чарба техникасы жана айыл өкмөтүнүн штаттагы кызматкерлерине ж.у.с.)- 16,3%"},{"t":"v","l":["айлык төлөөгө мүмкүндүк берет. Айыл өкмөтүнүн Абаттанлыруу – 13,8%","башчысы мыйзамдуу статусу бар, айлык алып иштөөчү Жакырчылыкты жоюу – 13,8%","айыл башчысын дайындайт. Алар айылдын ар кайсы Башка маселелер – 11,7%"]},{"t":"p","h":"бөлүктөрүндө, ошондой эле мындай орган болбогон башчыларынын {йыл өкмөт пикири боюнча: жана бир айыл өкмөтү бир нече айылды башкарган ФИнансы каражаттарынын у нырак? ж» жерлерде айыл өкмөтүнүн атынан чыгат. Адатта айыл е кэр"},{"t":"v","l":["башчысы жергиликтүү тургундардын сунушу боюнча","дайындалат. Ал айыл өкмөтүнүн өткөрүлүп берилген","милдеттерди аткарат (б.а. социалдык, турак-жай ж.б. маселелерди чечүүгө элди катыштырат).","(Урбан ы, жүргүзгөн сурамжылоонун ","натыйжалары боюнча. – Бишкек, 2003), "]},{"t":"p","h":"Кыргыз Республикасынын 2003-жылы кабыл алынган “Жергиликтуу ез алдынча башкаруунун финансылык-экономикалык негиздери жөнүндө” мыйзамы боюнча жергиликтүү бюджеттин жергиликтүү салыктардан, жыйымдардан жана салык эмес төлөмдөрдөн алынган кирешелери республикалык бюджетке алынбайт."},{"t":"p","h":"Мыйзам боюнча айыл өкмөтүнүн жетекчиси айыл, кыштак кеңешине, ал эми мамлекет берген ыйгарымдары боюнча райондук администрациянын жетекчисинин жана шаардын мэрине отчёт берет."},{"t":"p","h":"Айыл өкмөтүнүн башчысы айыл кеңешинин төрагасы да болуп эсептелет. Айыл өкмөтүнүн башчысы айыл кеңешинин сессиясына төрагалык кылган учурда, ал кабыл алынган эрежелерди жана талкуу жүргүзүү жол-жоболорун сактоого көз салуучу координатор катары иштейт. Ар бир айыл, кыштак кеңеши өзүнүн иштөө эрежесин (регламентин) белгилей алат."},{"t":"p","h":"Эгерде айыл кеңешинин бардык депутаттарынын үчтөн экиси каршы добуш берип, ишеним көрсөтүүдөн баш тартса, айыл өкмөтүнүн башчысы кызматынан алынышы мүмкүн. Мисалы, 2000-жылы Талас районунун Долоно айылында айыл кеңеши ишеним көргөзбөгөндүгүн билдирүү менен айыл өкмөтүнүн башчысын кызматтан алган. Мындайда кызмат орду бошогондон кийин бир айдын ичинде <span class=\"pg\" data-n=\"14\">14<\/span>өткөрүлүүгө тийиш болгон кийинки шайлоого чейин айыл өкмөтүнүн башчысынын милдетин анын орун басары убактылуу аткарат."},{"t":"p","h":"Айылдагы, кыштактагы өз алдынча башкаруу органдарынын түзүмү А Бга баш ие: Жергиликтүү өз алдынча Айыл, кыштак"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>башкаруу органынын<\/td><td>кеңеши<\/td><\/tr><tr><td>башчысы<\/td><\/tr><tr><td>А органы – Б органы<\/td><\/tr><tr><td>Б Анын чечимдерин бекитет:<\/td><\/tr><tr><td>А органы 4+-—— Б органы эы<\/td><td>Айыл өкмөтүнүн<\/td><td>Айыл<\/td><td>Кеңештин<\/td><\/tr><tr><td>аппараты!<\/td><td>башчылары<\/td><td>комиссиялары<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"Кээ бир өлкөлэрдэ айыл тургундарынын райондук кеңеште жана шаар башкармалыгында АКЕ шайлаган өкүлдөрү (депутаттар, мэр) бар болгону үчүн айылдык башкаруу органдары түзүлбөйт. 3"},{"t":"p","h":"Жергиликтүү ез алдынча башкаруу органдарынын (ЖӨО) башчылары кимдер эле жана эми кимдер болот?"},{"t":"p","h":"ү Өз алдынча башкаруу органдарынын башчылыгына жакында жүргүзүлгөн шайлоонун бардык шайланма кызматтардын дээрлик төрттөн бир бөлүгүн педагогикалык жарымынан саал азыраагын техникалык интеллигенциянын өкүлдөрү, м экономика жана финансы чөйрөсүндө иштегендер, 2%га жакынын врачтар р ээлеген. Биро жана кыштактардагы ЖӨО ассоциациясы азыр орто мектептик билими барда ды да талапкер кылып көрсөтүүнү жактайт. “Жер-жерлерде, – дейт ассоциация"},{"t":"p","h":"– нбэев, – жогорку окуу жайын же атайын орто окуу жайын бүтүргөнү жок болсо да, иш билги, тажрыйбалуу жана акылдуу адамдар көп. Алардын билим алышкан, жердештеринин алдында сабаттуу адамдар катары кадырадамдарга шайлоодо талапкер болуу мүмкүндүгүн берүү керек”."},{"t":"p","h":"Данияр Каримов, “Вечерний Бишкек”, 3-октябрь, 2003-ж."},{"t":"p","h":"Жергиликтүү өз алдынча башкаруу кантип иштейт?"},{"t":"p","h":"1996-жылдан бери айылдардын, кыштактарлын жана шаарлардын конституцияга окшогон уставлары бар, алар жергиликтүү коомдоштуктун ишмердигинин негизги эрежелерин аныктайт. (Ушул китептин аягынан силер мындай уставдын үлгүсүн таба аласыңар). Устав коомдоштуктагы өзгөрүүлөргө жараша өркүндөтүлүп туруучу документ болууга тийиш, Уставга өзгөртүүлөр жана толуктоолор тийиш-"},{"t":"v","l":["түү аймактагы жарандар менен ачык талкуу","өткөрүп, мындай чечимди жергиликтүү кеңеш","бекиткенден кийин гана киргизилиши мүмкүн.","Мэр, жергиликтүү өз алдынча башкаруу"]},{"t":"p","h":"органынын башчысы көбүнчө атайын түзүлүүчү комитеттерде чечилүүчү маселелер боюнча иштердин жүрүшүн кароо үчүн өз Айыл өкмөтүнүн бюджети талкууга алынып жатат. кызматкерлери менен жумасына бир жолудан кем эмес кеңешме өткөрөт. Келечектеги иш-чаралардын пландары тиешелүү кеңештин сессиясынын бекитүүсүнө сунуш кылынат. Сессияда мэр, жергиликтүү өз алдынча башкаруу органынын башчысы сунуш кылынуучу иш-чаралардын планын көрсөтүп, аны талкуулоону уюштурат. Адатта кеңеш бул планды дароо эле добушка салбастан, бир пикирге келмейинче талкуулай берет. Талкуу бүткөндөн кийин кабыл алынган чечимди мыйзамдаштыруу үчүн добуш берүү жүргүзүлөт. Бирок жергиликтүү өз алдынча башкаруу органынын башчысы тургундардын ишенимине таянууга тийиш болгондуктан, ал тургундардын өкүлдөрүнүн пикирлери менен эсептешүүгө көбүрөөк ыктайт. Кеңештин депутаттары зор бийликти пайдаланып жатканын түшүнүшөт, ошондуктан алар кабыл алуучу чечимдер үчүн жоопкерчиликтин да чоң экенин сезишет."},{"t":"p","h":"аспап прибор; 2) башкаруу мекемеси; 3) кызматкерлер курамы."},{"t":"p","h":"<span class=\"pg\" data-n=\"15\">15<\/span>Чечи м кабы ынган Айыл өкмөтүндө негизинен теменку адистер иштейт: башкармалык планды жүзөгө ашыра |."},{"t":"p","h":"берсе болот. Пландалган иш-чаралар к, катчы Жергиликтүү өз алдынча башкаруу органынын башчысы б аткарылгандан кийин жергиликтүү өз социалдык коргоо боюнча жетектөөчү адис 1 алдынча башкаруу органынын башчысы Жер жана турак жай маселелери боюнча биринчи катебүтүрүлгөн иштер жана сарпталган адис каражат (салык төлөөчү жарандардын „ Каржы-экономика бөлүмүмүн жетекчиси – юнча ади‹ салык боюнча улук инспектор бухгалтер к у бул иштерге жумшалган акчасы)! Сарптоолор боюнча жетектевчя адис – эсеп бухгалтери [тууралуу кеңештин алдында отчёт Салык инспе:?"},{"t":"v","l":[" берүүгө тийиш. Жергиликтүү кеңештин ®к©номист-е©","чечимдерин бул аймактагы бардык ы: 2 Мал чарбачылыгы Аскердик катто"," жарандар жана уюмдар аткарууга и’ кагаздарын"," милдеттүү. -"]},{"t":"p","h":"Турмушта айрым башкармалыктар ушул тартипти кыйла бекем карманып, башкаларга караганда кыйла майнаптуу иштейт."},{"t":"p","h":"5.0 Жергиликтүү коомдоштуктардын ыктыярдуу бирикмелери"},{"t":"p","h":"Жергиликтүү коомдоштуктардын мүчөлөрү өздөрүнүн жалпы маселелерин натыйжалуу чечүү үчүн ыктыярдуу түрдө ар кандай уюмдарга биригиши мүмкүн. Мындай бирикмелер ар ким жеке өзү жасай албай турган иштерди бүтүрө алат. Дал ошол себептен адамдар жамааттарга же аймактык өз алдынча башкаруу органдарына кошулушат."},{"t":"p","h":"Жамаат (община) – жергиликтүү өз алдынча башкарууну уюштуруунун бир формасы. Ага жергиликтүү маанидеги иштерди өз демилгеси менен бүтүрүү үчүн ыктыярдуу бириккен айылдын же шаардын бир көчөсүндө, кварталында же башкача бөлүгүндө жашаган жергиликтүү коомдошдуктардын мүчөлөрү кирет. Жамаатты 10 түтүндөн кем эмес чарбалардын өкүлдөрү түзө алат. Жалпы чогулушта алар өз ишмердигин жөнгө салуучу уставды кабыл алып, жамааттын төрагасын шайлоого тийиш. Жамаат мүчөлөрү тарабынан иштелип чыгып кабыл алынган устав айылдык, кыштактык, шаардык кеңеште каттоодон өткөрүлөт."},{"t":"p","h":"2005-жылы кабыл алынган “Жамааттар жөнүндө” мыйзамга ылайык, жамаат:"},{"t":"p","h":"– өз мүчөлөрүнүн кызыкчылыктарын мамлекеттик бийлик жана жергиликтүү өз алдынча башкаруу органдарында коргойт;"},{"t":"p","h":"жамааттардын ишмердигине тиешелүү иштерди талкуулоодо жергиликтүү кеңештердин ишине кеңеш берүүчү добуш укугу менен катышат;"},{"t":"p","h":"жергиликтүү кеңештердин, алардын аткаруучу-тескөөчү органдарынын жана жергиликтүү мамлекеттик администрациялардын жамааттар ишмердиги боюнча кабыл алган чечимдеринин аткарылышына көмөктөшөт;"},{"t":"p","h":"айыл өкмөтүнүн жана жергиликтүү кеңештердин пландоо, территорияны абаттандыруу (көрктөндүрүү, жакшыртуу), социалдык-маданий, тиричилик жана чарбалык жайларын куруу жаатындагы ишмердигине катышат;"},{"t":"p","h":"жамааттын уставында көрсөтүлгөн максаттарга жана милдеттерге ылайык башка функцияларды да аткарат."},{"t":"p","h":"Аймактык коомдук өз алдынча башкаруу органдары (АКӨ; орусча – ТОС: территориальное общественное самоуправление) – бул ошол аймакта жашаган жарандардын жергиликтүү маанидеги маселелерди чечүү үчүн түзүлгөн ыктыярдуу бирикмелери. Алардын айрымдары 1991-жылга чейин эле уюшулуп, абдан демократиялуу иштеген. Көптөгөн белгилери боюнча булар коомдук бирикмелерге окшош. Аймактык коомдук өз алдынча башкаруу органы деген статус аны жергиликтүү кеңеште каттоого алгандан кийин берилет. Бул – негизинен шаарларда түзүлүүчү кичи райондордун комитеттери, кеңештери, үй, көчө жана квартал комитеттери. Алардын жардамы менен кичи райондордун тургундары жашаган жерлерин жакшыртууга өз каражаттарын жумшай алат."},{"t":"p","h":"Аймактык коомдук өз алдынча башкаруу органдары мыйзамда белгиленген тартипте юридикалык тарап катары катталышы мүмкүн."},{"t":"p","h":"Мындай органдар адатта шаар башкармалыгынан, мэриядан же айыл өкмөтүнөн чакан айлык акы алып иштөөчү төраганы жыл сайын шайлап турушат. Эгер төрага өз милдеттерин жакшы аткара албаса, бирикменин мүчөлөрүнүн көпчүлүгүнүн каалоосу боюнча кызматынан түшүрүлүшү мүмкүн."},{"t":"raw","h":"<div class=\"gloss\"><p>Е<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"16\">16<\/span>АКӨ органдары социалдык чөйрөнүн объекттерин абаттандыруу, оңдоо, аймакты санитардык тазалоо иштерин кабыл алууга катышат. Алар жергиликтүү кеңештердин, аткаруучу-тескөөчү органдардын жана жергиликтүү мамлекеттик администрациянын чечимдеринин аткарылышына көмөктөшөт. Жергиликтүү кенештер, алардын аткаруучу-тескөөчү органдар жана жергиликтүү мамлекеттик администрация келишим негизинде АКӨ органдарына өз функцияларын өткөрүп, алардын менчигине чарба объекттерин, турак жай жана турак жай эмес фонддорун, финансылык каражаттарды бериши мүмкүн."},{"t":"p","h":"5.1 Курултай"},{"t":"p","h":"Куузилтай – бул коомдук маселелерди талкуулоонун кыргыздардагы салттуу формасы. Бир дагы чоң коомлоштук, өзгөчө райондук жана андан жогорку деңгээлде ачык талкуу жүргүзүү үчүн өзүнүн бардык мүчөлөрүн бир жерге бир мезгилде чогулта албагандыктан, ар төрт жылда ачык тикелей добуш берүү менен курултайга өкүлдөр шайланат. Алар коомдук негизде, б. а. бекер иштейт. Мында шайлоочулардын тизмеси түзүлбөйт жана делегаттыкка талапкерлерге эч кандай квалификациялык талаптар коюлбайт, Курултайдын делегаттары ошол эле учурда кеңештердин да депутаттары болушу мүмкүн."},{"t":"p","h":"Курултай жалпы мамлекеттик маселелерди талкуулоо үчүн чакырылганда, ал кысым көрсөтүү тобу {лоббилөө тобу') сыяктуу иш жүргүзүшү мүмкүн. Делегаттар калктын көпчүлүк бөлүгү бул маселеге бирдей кез карашта экендигин көрсөтүү менен мамлекеттин саясатынын өзгөрүшүнө таасир этүүгө умтулушат. Ошондуктан курултайды жергиликтүү өз алдынча башкаруунун формасы катары гана кароого болбойт"},{"t":"p","h":"Элдик курултай журналынан алынды) Курултайлар убактылуу органдар болуп эсептелет, алар жыйналыш бүткөнгө чейин гана өкүм сүрөт. Курултайлар зарылдыгына жараша шайланган делегаттардын жыйналышы катары өткөрүлөт. Эгер курултайда жалпы макулдашууга жетишилбесе, анда чечим көпчүлүк добуш менен кабыл алынат. Жергиликтүү кеңештер жана алардын аткаруучу-тескөөчү органдары үчүн бул чечим сунуш кылуу мүнөзүндө гана болот."},{"t":"p","h":"Курултайлар жамааттын уставы кабыл алынар алдында аны талкуулоодо, ошондой эле көптөгөн башка маселелер боюнча сунуштарды иштеп чыгууда чоң роль ойнойт, Мисалы, ар эки жылда жок дегенде бир жолу өткөрүлүүчү жыйналыштарда алар жергиликтүү өз алдынча башкаруунун башчысынын же мэрдин сунуштарын жана иш багыттарын расмий эмес түрдө жактырат же жактырбай коёт."},{"t":"h3","h":"Жергиликтүү өз алдынча башкарууну уюштуруунун бөлөк формалары"},{"t":"p","h":"Жогоруда баяндалган жергиликтүү уюмдардын ар кандай түрлөрү менен катар эле Кыргыз о. Республикасынын “Жергиликтүү өз алдынча башкаруу жөнүндө” мыйзамында аталбаган, бирок жерги- 'Лоббилөө тобу – кайсы бир саясий кызыкчылыкты коргоо үчүн мыйзам чыгаруучуларга таасир этуу, аларды өз тарабына тартууга аракеттенуучу топ."},{"t":"raw","h":"<div class=\"gloss\"><p> 5.2<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"17\">17<\/span>ликтүү коомдоштуктардын иштерине активдүү катышкан башка органдар да бар. Өлкөнүн түштүгүндөгү айылдарда жана кыштактарда көчөлөрдү бириктирген “маале” деп аталуучу комитеттер уюштурулган."},{"t":"p","h":"2001-жылы “Кыргыз Республикасынын 2010-жылга чейинки өнүгүүсүнүн комплекстүү негиздери” деп аталган реформалардын жалпы улуттук стратегиясы (узак мөөнөттүк план) кабыл алынган. Бул документтин алкагында Мамлекеттик бийликти борбордон оолактатуу (децентралдоо) жана жергиликтүү өз алдынча башкарууну өнүктүрүү боюнча улуттук стратегиянын долбоору иштелип чыга баштаган элс. Республикалык курултайда талкуулангандан кийин бул документке Кыргыз Республикасынын Президенти 2002-жылдын декабрында кол койду."},{"t":"v","l":["Стратегиянын төмөндөгүдөй бөлүмдөрү бар:","&gt; Эффективдүү (натыйжалуу) укуктук негизди түзүү"]},{"t":"p","h":"&gt; Саясий, административдик реформаларды жүргүзүү жана жергиликтүү өз алдынча башкаруу органдарына мамлекеттик колдоо көрсөтүү Экономикалык жана финансылык жактан децентралдоону (б. а. борбордук өкмөттүн ыйгарымдарын жергиликтүү өз алдынча башкаруу органдарына берүүнү) жүргүзүү Муниципалдык кызматты калыптандыруу жана кадрлар менен иштөөнү өркүндөтүү Социалдык мобилизациялоо жана адам көрөңгөсүн (потенциалын, мүмкүнчүлүтүн) өркүндөтүү Жарандык коомдун биримдигин камсыздоо."},{"t":"p","h":"Азыркы учурда жергиликтүү өз алдынча башкаруу органдарынын жана мамлекеттик бийлик (ички иштер башкармалыгы, прокуратура жана башка) органдарынын функцияларын так бөлүштүрүү боюнча иш жүргүзүлүүдө, Мунун натыйжасында жергиликтүү өз алдынча башкаруу органдары жергиликтүү бюджетти түзүүдө, орундатууда, өздөрүнө караштуу тейлөө кызматтарын көрсөтүү үчүн зарыл болгон чечимдерди кабыл алууда көбүрөөк өз алдынчалыкка ээ болууга тийиш."},{"t":"h3","h":"&lt;&gt; текстти окугандан кийинки көнүгүүлөр"},{"t":"p","h":"#9 03-тапшырма. Жергиликтүү милдетин же республикалык милдетин? 15 мун. Шеригинер менен темендегу көрсөтүлүүчү кызматтардын тизмесин карап чыккыла. Аларды кимдер: жергиликтүү өз алдынча башкаруу органдары, мамлекеттик бийлик органдары же менчик компаниялар – көрсөтөрүн чечкиле. ырыда учурларда аларды МР» нече уюм аткарышы да мүмкүн."},{"t":"v","l":["кв өлкөлөрдөгү АДЛ аркылуу","өкүлчүлүк ишин жүргүзөт.","Силердин айылда (шаарда) көчөнү","жарыктандырууга көз салат.","Милицияны түзөт жана ага айлык берет.","Таштандыны алып кетет.","Ооруканалардын жана бейтапканалардын","ишин каржылайт.","Салык чогултат."]},{"t":"p","h":"Силердин үйдү суу менен камсыз кылат. ШЕИЗЖ) Телерадио берүүнү камсыз кылат."},{"t":"v","l":[". Мугалимдерге эмгек акы төлөйт.","0. Жолдорду курат жана ондоп турат.","1. Нан бышырат.","","04-тапшырма. Айырмасы эмнеде?"]},{"t":"p","h":"Шеригинер менен теменку таблицага кез жүгүрткүлө. Мында ойдон чыгарылган Нур өлкөсүнүн райондорунун бириндеги жергиликтүү өз алдынча башкаруу органдарынын иштеринин тизмеси берилген."},{"t":"p","h":"<span class=\"pg\" data-n=\"18\">18<\/span>Эгер силердин коомдоштугунардагы жергиликтүү өз алдынча башкаруу органдары ушул сыяктуу иштесе, жөн гана “ОШОНДОЙ ЭЛЕ” деп жазгыла. Эгерде башкача болсо, анда айырмасын жазгыла"},{"t":"p","h":"Ша айдоо төрт л жылда да би бир жолу у өткөрүлүп турат."},{"t":"v","l":["ликтүү кенешке шайлоодо колунда барлар гана добуш","|берүү укугуна ээ. ээ."," Өз курамынан аким шайлоого жана аны кызматтан алууга","|укуктуу шайланма кенеши бар.","Кан (магистрал) жолдорду кошпогондо, бардык жолдордун","[салынышы жана оңдолуп турушу үчүн жооп берет.","5. Бардык үйлөрдү, мектептерди жана ооруканаларды бекер суу","үне нен камсыз кылат. Ишканалар сууга акы төлөшөт.","к өкмөттөн дотация алат."," Канализация кызматын көрсөтүүгө жооп берет.","Му. талимдерге жана врачтарга эмгек акы төлөбөйт.","Үй жаныбарларынын, мисалы, иттердин санын көзөмөлдөйт.","Ресторандарга жана тамак-аш азыктарын сатуучу дүкөндөргө"," медициналык-сан

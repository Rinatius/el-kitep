үйбүлөлөр үчүн акча<\/td><\/tr><tr><td>3. Бир топ фермерлер чарба<\/td><td>Ооба, анткени<\/td><td>Алар байып,<\/td><\/tr><tr><td> жүргүзүүнүн жаңы усулдары<\/td><td>алардын ферма-<\/td><td>жаңы техник<\/td><\/tr><tr><td> тууралуу көбүрөөк маалымат<\/td><td>лары элге керек-<\/td><td>сатып алышы<\/td><\/tr><tr><td>‚ алып туруу учун ассоциация<\/td><td>түү азыктарды<\/td><td>мүмкүн.<\/td><\/tr><tr><td> түзүштү.<\/td><td>көбүрөөк<\/td><\/tr><tr><td>өндүрүшү<\/td><\/tr><tr><td>мүмкүн.<\/td><\/tr><tr><td>4. Куркеде (киоскада) гезит-<\/td><\/tr><tr><td>журнал сатылып жатат.<\/td><\/tr><tr><td>5. Айылдын бир топ<\/td><\/tr><tr><td>тургундары мектепти актап,<\/td><\/tr><tr><td>сырдап жатышат.<\/td><\/tr><tr><td>6. Бир топ кишилер жаштарга<\/td><\/tr><tr><td>комуз үйрөтүп жүрөт.<\/td><\/tr><tr><td>7. Бир топ кишилер саясий<\/td><\/tr><tr><td>партия түзүп жатышат.<\/td><\/tr><tr><td>8. Атасы кызына китеп окуп<\/td><\/tr><tr><td>9. Милиция мыйзамдардын<\/td><\/tr><tr><td>сакталышына көз салат.<\/td><\/tr><tr><td>10. Окуучулар мектеп<\/td><\/tr><tr><td>парламентин түзүп жатышат.<\/td><\/tr><tr><td>11. Жаш келин көйнөк сатып<\/td><\/tr><tr><td>алды.<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"** 03-тапшырма. Жарандык коомдун иштөөсү 25мун."},{"t":"p","h":"Эки-экиден болуп, адамдардын төмөндө келтирилген сөздөрүн окуп чыккыла. Алар: “Жарандык коомд өнүгүшүнө кандай салым кошуп жатасыңар?” – деген суроого жооп беришкен. Бул иш-аракеттерд кайсыларын чындап эле Кыргызстандагы жарандык коомдун өнүгүшүнө олуттуу салым кошот эсептесеңер, бөлүп көрсөткүлө. Эмне үчүн ошолорду тандаганыңарды түшүндүрүүгө даяр болгула. Нургазы: Мен машинамды жууп жүрөм, анткени бул менин эң кымбат буюмум. Мен машина жумушка минип барганга, ошондой эле үйбүлөм менен дем алыш күндөрү шаардын сырты чыгып келүүгө пайдаланам."},{"t":"p","h":"Мен дээрлик күн сайын базарда кийим-кече сатам. Мурда сүрөтчү болчумун, бирок азыр <span class=\"pg\" data-n=\"69\">69<\/span>поолундагы сизердин ролунар жумушум көбүрөөк жагат. Биз баарыбыз үйбүлөбүз үчүн акча иштеп табышыбыз керек. Мен досторум менен айылда иштеп жүрөм. Биз мектептин чатырын оңдодук. Бул биздин жумушубуз эмес, бирок муну өзүбүз деле бүтүрө алат экенбиз. Өкмөт муну качан оңдойт деп күтүп отургандан эмне пайда?"},{"t":"p","h":"Мен өкмөттүк мекемеде иштеген жакшы деп ойлойм. Бухгалтермин, дайыма салыктын төлөнүп турушуна көз салам. Салыктан түшкөн акчага мектептер курулат, дагы башка көп иштер жасалат."},{"t":"p","h":"Биз, кыштактын бир топ тургундары, жалгыз-жарым үйбүлөлөргө кантип жардам берсек болот деп сүйлөшүү үчүн жыйын өткөрдүк. Аларга кийим-кече жана тамак-аш чогултуп, эл көп баскан жолдун боюна күркө орнотууну чечтик. Бул күркөдө өзүбүз алып келген азыктүлүктү сатабыз да, түшкөн акчаны ошол үйбүлөлөргө таратып беребиз."},{"t":"p","h":"Балдарыма дайыма жакшы окугула, кийин кыйналбай жумуш табасыңар деп жүрөм. Мен аларга дагы өкмөт биз үчүн ата-энедей, ошондуктан анын айткандарын аткарышыбыз керек дейм."},{"t":"p","h":"(1, 04-тапшырма. Өкмөтжанажаран 25 мүн."},{"t":"p","h":"Төмөндө адамдардын өкмөт менен жаран ортосундагы мамилелер кандай болууга тийиш деген ойлору келтирилген. Эки-экиден болуп, булардын кайсылары жарандык коомдун өнүгүшүнө өбөлгө түзөрүн талкуулагыла."},{"t":"p","h":"Чолпон: Биздин өлкөдөгү бардык адамдар өкмөт аларга жардам бере тургандыгын, бирок сабырдуу болуу керек экендигин түшүнүшү зарыл. Өкмөт мамлекетибизди бай өлкөгө айланткан кезде бизде баары жакшы болот."},{"t":"p","h":"Өкмөттү биз шайлайбыз, ошондуктан ал биздин сураганыбызды аткарышы керек. Бирок биз өзүбүз дагы жоопкерчиликти сезишибиз абзел. Атүгүл үйбүлөдө деле биз кээде өзүбүздү өзүбүз тейлешибиз керек эмеспи."},{"t":"p","h":"Өкмөт – жарандардын күчтүү коргоочусу. Качан эмне кылууну ал өзү жакшы билет. Андыктан бизди ар кандай баскынчылардан, душмандардан коргоого жөндөмдүү өкмөттү шайлашыбыз керек."},{"t":"p","h":"Өкмөт бизге кызмат кылууга тийиш. Биз андан өзүбүзгө эмне зарыл болсо, ошонун баарын алууга тийишпиз, анткени биз бул үчүн салык төлөйбүз. Биз коомго кызмат кылбашыбыз керек. Бул – өкмөттүн милдети. Бирок муну менен бирге өкмөттүн аракетин көзөмөлдөп, аны элге эсеп-чет берүүгө мажбурлоо үчүн биз саясий жактан активдүү болушубуз керек."},{"t":"p","h":"05-тапшырма. Эмне учун мен? 15 мун."},{"t":"p","h":"Эки-экиден болуп, коомго мамлекет эмес, силер досторунар менен жардам берген кырдаалдын артыкчылыктары жана кемчиликтери тууралуу ойлонуп көргүлө."},{"t":"v","l":["Өкмөт","","Мен жана менин досторум Мен жана менин досторум","","яр 06-тапшырма. Мен жашаган жерде 15 мун."]},{"t":"p","h":"Эки-экиден болуп, коомдун пайдасына екметсуз эле жасалган бардык иштерди санап чыккыла. Төмөндө эки мисал келтирилди."},{"t":"raw","h":"<div class=\"gloss\"><p>Замира: Кубат: Динара: Эрнис: т Өкмөт<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"70\">70<\/span>Биздин айылда Ата-энелерибиз ашар уюштуруп, мектептин рчасын оно. у."},{"t":"p","h":"лд,) алган түшүмдүн бир бөлүгүн сатып, түшкөн а 9)"},{"t":"v","l":["тегир","3.","4","","$779 07-тапиырма. Мен муну жасай алам! – 35 мун."]},{"t":"p","h":"Төмөндө силердин жеринерле сөзгө алынып жүргөн проблемалардын тизмеси берилди. Уч-тер болуп, кайсы проблеманы чечүүгө ким жооптуу экендигин тактагыла да, анан:"},{"t":"p","h":"Маселени чечүүгө, негизинен, силер жашаган жердин тургундары жооптуу болсо, анда өзүңөр эмне кыларыңарды түшүндүрүп бергиле."},{"t":"p","h":"Буларга тургундар да, өкмөт да жооптуу болсо, анда милдеттерди кандайча бе чечкиле."},{"t":"p","h":" 1. Мугалимдердин айлык акысы аз. Коомдоштук Өкмөт мурдагыдай эле суммадаеь жана өкмөт акчаны бөлө берет, окуучулар, мисалы жашылча өстүрүп, базарда сатып, түшкөн акчаны мугалимдерге бөлүштүрүп берсе болот."},{"t":"v","l":[" кылып жүрүшөт. 12, Кылмышкерлер үйлөргө кирип, уурулук Өкмөт"," 3. Кээ бир окуучулар арак ичип, мас"," болушат.","14. Айылдагы суу насос бузулуп калды."," 5. Үй жандыктары ылаңга көп чалдыгып","жатат."," 6. Суу ташкыны биздин айылга зыян"," келтирди."," 7. Биздин китепка дүрүүгө аракет."},{"t":"p","h":"биз. М ликке мугалимдердин кандай проблемалары бар экендиги аларды чечүүнүн өзүбүз сунуштаган жолдору тууралуу кат җазып түршбыз. Мен “Волга” маркасындагы эски машинасы барлардын тобундамын. Үч айда бир ирет чогулуп, машиналарыбыздын проблемаларын талкуулайбыз, бири-бирибизден керектүү тетиктерди алабыз. Бул ишибиз үчүн эч ким биз акы"},{"t":"v","l":["Мен биздин бөлүмдүн статистикалык маалыматтарын отчётко","турганга жооптуумун. Отчётту анан министрликке жиберебиз. Бул"]},{"t":"p","h":"маалыматтарды өкмөт оз чечимдерин кабыл алууда пайдаланат. Иштегеним үчүн мен айлык алам."},{"t":"p","h":"Биз телевизор ж.б. техникаларды сатабыз. Максатыбыз – пайда табуу. Түшкөн пайданы дүкөндү кеңейтүүгө жана өзүбүздүн жашообузга жумшайбыз. Ишибиз үчүн айлык акы алабыз."},{"t":"p","h":"Жакында биз шаарыбызды суу менен камсыздоону жакшыртууга кызыккан топ уюштурдук. Өкүнүчтүүсү – жабдуулар эскирип кеткен, кыйласы бузулуп калган Жаңы насосторду сатып алуу үчүн акча чогултуучу к түзүүнү чечтик. Биз жума сайын жолугушуп, жашоо-тиричилигибиз тууралуу сүйлөшөбүз. й Курандын сүрөлөрүн окуп, талкуулайбыз. Демейде саясат жөнүндө сөз кылбайбыз, бирок кээде биз тараптагы тургундарга кантип жардам берүүгө болот деп ойлонобуз."},{"t":"p","h":"7% 10-тапшырма. Менчик сектор менен БӨЎлардын кандай айырмасы бар? 15 мун."},{"t":"p","h":"Таблицада келтирилген ойлорду окуп чыккыла да, уюмдун кайсы секторго таандык экендигин аныктагыла: менчикпи, бейөкмөтпү же экөө теңби?"},{"t":"v","l":["1. Башкармалыгы жетекчисин шайлайт.","максаты – ба адамдардын жашоосун жа","тапкан пайдасын ага ээлик лар 6. алышат.","4. Уюм айрым бир товарларды сатат.","5. Уюмдун менеджери (иш башкаруучусу) бар з","6. Уюмда жалданма жумушчулар иштешет.","7. Уюм бир же бир нече кожоюнга таандык","8. Уюм товар өндүрөт.","9. Түшкөн пайданын баары бул уюмга мүчө болбогон адамдарга","кызмат көрсөтүү үчүн жумшалат,"]},{"t":"raw","h":"<div class=\"gloss\"><p> 4 ОА! Жү. Искендер Марат Рано Айсулуу Азат Алма лердин уюмунарда кандай эрежелер кабыл алынган?"," 17. Башка кайсы уюмдар менен кызматташасыңар?","[18, Бул уюмдар менен кандайча кызматташасынар?","|19. Силердин уюмунардагы жаштар эмне кыла алышат?"]},{"t":"raw","h":"<div class=\"gloss\"><p><\/p><\/div>"}],"sub":[],"pages":[59,72]},{"title":"XVII бап. Кыргыз Республикасындагы бейөкмөт уюмдар (БӨУ)","blocks":[{"t":"h2","h":"<span class=\"pg\" data-n=\"73\">73<\/span>XVII бап. Кыргыз Республикасындагы бейөкмөт уюмдар (БӨУ)"},{"t":"h3","h":"Текстти окуганга чейинки көнүгүүлөр"},{"t":"p","h":"01-тапшырма. Терминдер жана аныктамалар"},{"t":"p","h":"Эки-экиден болуп, терминдерге аныктамаларды тандагыла."},{"t":"raw","h":"<h4 class=\"mk\">1. Коммерциялык .. эмес иш 2. Донор м 3. Кайрымдуулук ® 4. Көп этностуу * 5. Көп диндүү „ (поликонфессиялуу) 6. Мониторинг 7. Фандрейзинг <\/h4>"},{"t":"v","l":["а) Бир эле коомдо адамдарды","турган абал.","б) Долбоорду жүзөгө ашыруу үчүн акча каражатын издөө.","в) Кайсы бир процесске дайыма көз салып туруу жана, демейде, анын","канчалык жакшы жүрүп жаткандыгына баа берүү"]},{"t":"p","h":"г) Кайсы бир иш-чарага каржылык (финансылык) жардам берип турган адам же уюм."},{"t":"v","l":["д) Киреше алуу максатын көздөбөгөн иш.","|е) Муктаж болгондорго (майыптарга, балдарга, улгайгандарга ж.б.) бекер","жардам берүү иши."]},{"t":"p","h":"ж) Бардык этностук топторго бирдей урмат-сый менен мамиле жасалган көп улуттуу коом."},{"t":"p","h":"(1 02-тапшырма БӨУ 10 мүн."},{"t":"p","h":"Эки-экиден болуп, максатын кошо көрсөтүү менен өзүңөр билген бардык БӨУлардын тизмесин түзгүлө."},{"t":"h2","h":"Окууүчүн текст"},{"t":"p","h":"1.0 Киришүү"},{"t":"p","h":"Бул бапта БОУга (бейөкмөт уюмдарга) аныктама берилип, алардын ишин жөнгө салуучу мыйзамдар тууралуу сөз болот. Анан катталган үч КЭУнун (коммерциялык эмес уюмдун) жана жамааттык типтеги эки уюмдун иши кеңири баяндалат. Акырында эмне иш аткарары кыскача сыпатталып, адрестери менен кошо көрсөтүлгөн айрым БӨУлардын тизмеси берилет. Кыргызстанда миңдеген бейөкмөт уюм бар, ошон учун биз алардын бир белугун гана керсете алдык. Мында алардын ишинин мунезу, ошондой эле формалары тууралуу тушунук берилет."},{"t":"p","h":"2.0 – БОУ деген эмне?"},{"t":"p","h":"Кайсылары бейөкмөт уюм, а кайсылары андай уюм эмес экенин так аныктоо кыйын. Айрыкче бул уюмдардын ишине мыйзамдар аз таасир берип жаткан өлкөлөрдө ушундай болот. Аты эле айты! тургандай, БӨУга өкмөттүк түзүм болбогон, коммерциялык да болбогон ар кандай уюмдар ки Мындай аныктама ар кандай комитетке, фермерлер коомдоштугу сыяктуу органдарга, республикань <span class=\"pg\" data-n=\"74\">74<\/span>уюябар (Бу) түштүгүндөгү маалелелерге, дагы башка ар кандай расмий эмес коомдоштуктарга тиешелүү б мүмкүн. Бул уюмдар үзгүлтүксүз иштеши керек десеңер, анда БӨУларга ал тургай үйбүлөнү, спорт клубдарын да киргизсе болот. БӨУ (бейөкмөт уюм) жана КЭУ (коммерциялык эмес уюм) түшүнүктөрү коомдо дээрлик бирдей эле мааниде колдонулуп жүрөт. КЭУ – бул коммерциялык эмес уюмдар, алардың укуктары Кыргыз Республикасынын мыйзамдары менен аныкталган. Дал ушул термин Кыргызстандын коомдук уюмдар жөнүндөгү мыйзамында колдонулган. Ал эми БӨУ – турмушта көбүрөөк кези жөнөкөйүрөөк, укуктук формалары жагынан да анча так аныкталбаган кыйла кеңири түшүнүк. Бирок бул уюмдардын эки туру тең коомдук кызыкчылыктарды көздөйт, Ошондуктан коммерциялык эмес уюмдарды да көбүнчө БӨУ деп атап коюшат. Бул бапта биз дагы “БӨУ” дегенде бейөкмөт жана коммерциялык эмес, уюмдарды көңүлдө тутабыз,"},{"t":"p","h":"БӨУ демейде стихиялуу түрдө жана ыктыярдуу Жамааттар БӨУга киреби? м. негизде келип чыгат. Аларды өз коомдоштугунун кайсы бир муктаждыктарын канааттандыргысы келген өз алдынча башкарууну уюштуруунун Жаны мыйзамга ылайык, жергиликтуу адамдар түзөт. БӨУга адамдар өз демилгеси менен формасы катары жамаат (община) гана мүчө болушат. Бирок штат курамындагыларга коммерциялык эмес уюм болуп саналат. Ал иши үчүн аздыр-көптүр акчалай акы берилет. өз мүчөлөрүнүн арызынын, жалпы чогулуш Ушундай эле ыктыярдуу түрдө түзүлүп, тиешелүү бир протоколунун жана уставынын негизинде юстиция министрлигинде эмес, айыл, муктаждыктарды канааттандыруу үчүн кызмат кылчу коммерциялык компаниялардан айырмаланып, БӨУ кыштак, шаар кеңешинде каттоодон өтүү менен юридикалык тарап статусуна ээ киреше алууга умтулбайт. Ошентсе да, БӨУ өзүнө болот. (Жамааттар жөнүндөгү мыйзамга тагылган милдеттерди аткарыш үчүн финансылык Кыргыз Республикасынын президенти жардам ала алат. Маселен, ТЕЕ$ ушул китепти даярдаш 2005-жылы 21-февралда кол койгон). үчүн акчалай грант' алды. Бирок бул БӨУ мамлекеттик органдардын көзөмөлүндөтурат дегенди билдирбейт. Эгерде финансылык жардамдын кайсы бир шарттары БӨУнун өз алдынчалыгын чектей турган болсо, анын мүчөлөрү буга көнбөй, мындай жардамдан баш тартып, каражатты башка жактан издесе болот."},{"t":"p","h":"жана потенциалдуу донорлор койгон талаптардан улам БӨУлардын көбү өз уюмдарын расмий түрдө каттоодон өткөрүп, ушул аркылуу таанылып, коомдон кадыр-барк табууга умтулат."},{"t":"p","h":"Кыргызстандагы укук талаптары БӨУнун негизги мүнөздүү белгилери кайсылар экенин көрсөтүп турат. Бирок мыйзамда БӨУ юридикалык статуска ээ болбой туруп деле иштей берсе болоору көрсөтүлгөн. Андыктан мектеп парламенттери, курултайлар, аймактык коомдук өз алдынча башкаруу органдары (үй, көчө комитеттери) сыяктуу уюмдарды, ошондой эле чанда бир чогулуучу, эч бир финансылык жардам албаган, бирок коомдоштуктун жашоо шарттарын жакшыртуу багытында пайдалуу иш аткарган жарандардын ар кандай чакан бирикмелерин да БӨУ деп атоого болот."},{"t":"p","h":"Бул абдан маанилүү жагдай. Себеби мыйзам боюнча мындай уюмдарда силердин аткарган ишиңер же ата-эненердин иши бейөкмөт уюмдардын иши катары таанылбашы мүмкүн, бирок БӨУ сыяктуу бирикмелердин бардыгы жарандык коомду өнүктүрүүдө абдан маанилүү роль ойнойт. Чын-чынына келгенде өлкөдө мындай уюмдардын саны канча экенин эч ким так айта албайт. БӨУга байланыштуу башка өлкөлөрдүн көбүндө да ушундай эле кырдаал өкүм сүрүп турат. Ошентсе да, өлкөдө катталган БӨУлардын таасири чонураак. кадыр-баркы да өйдө, алар бир кыйла стабилдүү иш жүргүзөт десек апырткандык болбойт. Анткени юридикалык тарап болуп каттоодон өткөндөн кийин мүмкүнчүлүктөр кыйла кеңейет."},{"t":"p","h":"2.1 Эмнелер БӨЎларга кирбейт?"},{"t":"p","h":"БӨУга берилген эларалык аныктама анча так эмес болгон себептүү көпчүлүктүн пикири боюнча кайсы уюмдар БӨУ деп эсептелбей турганын карап көрүү зарыл. Булардын тизмесине үй-бүлөлөр, өз мүчөлөрүнө гана пайда келтирүүчү ишканалар, спорт же дагы башка ар кандай клубдар (мисалы, ит багуучулар клубу) кирет."},{"t":"p","h":"БӨУларды саясий жактан таасир этип, демейде ири корпорациялардын финансылык таламдарын коргогон (мисалы, салыкты аз төлөөгө же мамлекет тарабынан түздөн-түз финансылык жардам алууга умтулган) кысым көрсөтүү топторунан (лоббилөө топторунан) да айырмалоо зарыл, БӨУларды ошондой эле мамлекетте бийлик үчүн күрөшкөн саясий партиялардан да айырмалоо керек. Бирок кээ бир өлкөлөрдө БӨУ саясий кызмат орундарына талапкерди көрсөтө алат."},{"t":"p","h":"*Грант – кайра твлетулбей турган акчалай жардам."},{"t":"p","h":"<span class=\"pg\" data-n=\"75\">75<\/span>Калыбына келтирилген жол Ташбулак жана Ынтымак айылдарын бириктирип турган 5 километрлик жалгыз жол бар. Жалалабат облусунун Сузак районундагы бул эки айылда жалпысынан 7000дей киши жашайт. Тилекке каршы, бул жападан жалгыз жол 15 жылдан бери оңдоп-түзөлбөй, өтө бузулуп кеткендиктен, аны толугу менен оңдоп чыгуу керек эле. Мунун айынан кошуна эки айылдын эли абдан кыйналды."},{"t":"p","h":"“Жаштар лидерлиги” коммерциялык эмес уюму (КЗУ) жолду оңдоо боюнча демилге кетеруп, Жалалабат ЖККБсына (жарандык коомду колдоо борборуна) кайрылды. Бул жерде КЭУ мүчөлөрүнө жолду ремонттоо долбоорун иштеп чыгуу жагынан жардам беришти."},{"t":"p","h":"Бул долбоорду Азия Өнүктүрүү Банкы колдоп, 2500 доллар суммасында каражат бэлүп берди. Мындагы “Жаштардын лидерлиги” КЗУсунун салымы 14000 сом акчаны жана наркы 75000дей сомдук курулуш материалдары болду. Жолду ондоо ишине жергиликтүү коомдоштук пос да, КЭУ мүчөлөрү да активдүү катышты. ера ликтүү калктын материалдык жана эмгек салымы 3000 долларды түздү."},{"t":"p","h":"Долбоорду жүзөгө ашыруунун натыйжасында Ынтымак жана Ташбулак айылдарынын ортосундагы жол толугу менен оңдолду. Эми кечелер таза болуп, айылдыктардын жашоосу кыйла жеңилдеп калды."},{"t":"p","h":"2.2 Алардын эмне кереги бар?"},{"t":"p","h":"г-"},{"t":"v","l":["Кээ бир кишилер бардык коомдук кызматтар ","Зоицерде болсун","Эгер уюм каттоодон өтсө, эреже катары"]},{"t":"p","h":"көрсөтүлүшү керек, БӨУнун болушу анын аталышында юридикалык жактын уюштуруумамлекеттик органдардын начар иштеп жатканынан чулук-укуктук формасы көрсөтүлөт. Мисалы, гана кабар берет деп эсептешет, Бул бай өлкөлөрдөн коомдук бирикме, коомдук фонд, саясий – АКШдан, Япониядан жана Европадан учуроочу партия. Окуу куралынын тиркемесинде берилген фактылар менен оңой эле төгүндөлүп калат: дал ушул мыйзам текстинде булар бири-биринен кандайча! айырмаланаары түшүндүрүлгөн."},{"t":"v","l":["бай өлкөлөрдө БӨУ абдан активдүү иштейт. Себеби","бул өлкөлөрдүн өкмөттөрү ар кайсы жерлердеги"]},{"t":"p","h":"калктын турмушун жакшыртуунун жолдорун ошол региондо жашагандар өздөрү жакшы биле турганын моюнга алышат. Бул өлкөлөрдөгү жарандар да өкмөттүн өз милдеттерин абийирдүү жана жоопкерчилик менен аткарышына жетишүү үчүн күчтүү жана ишкер БӨУлар көп болушу зарыл экендигин билишет."},{"t":"v","l":["2.3 БӨЎУишин кайсы мыйзамдар жөнгө салат? Алар эмне учун жана","кандайча каттоодон өткөрүлөт?"]},{"t":"p","h":"Кыргызстандагы коммерциялык эмес уюмдар тууралуу 1999-жылы чыгарылган мыйзам (тексти тиркемеде бар) мындай талап коёт: БӨУ үчүн банкта алыш-бериш эсебин ачкыңар же анын эсебинен акча жыйнагынар келсе, аны каттоодон өткөрүү зарыл. Каттоодон өтүү өз уюмунардын укуктук статус алышына жана мамлекет тарабынан тийиштүү түрдө таанылышына жол ачат. БӨУну каттатуу татаал, узакка созулган, кээде кымбат иш болушу мүмкүн. Эгерде алдыңарга койгон максатка азыркы айтылган жол-жоболорсуз (процедурасыз) деле жете ала турган болсоңор, уюмуңарды каттатпай койсоңор да болот."},{"t":"p","h":"БӨУну Кыргызстанда мыйзам боюнча каттатыш үчүн анын түзүүчүлөрү (кеминде үч киши) ошол БӨУнун максаты, мүчөлүккө өтүү жана чечим кабыл алуу тартиби көрсөтүлүп, ишинин түрлөрү саналган уставын камдашы кажет. Мындан тышкары башка документтер да тиркелет. Алардын тизмеги уюмуңардын формасына жараша болот. Эгерде коомдук бирикме түзгүңөр келсе, демилгечилердин даректери, паспорттук маалыматтары, кызматтары (төрага же президент, бухгалтер, комитет мүчөсү ж.б.) көрсөтүлгөн башкаруу органдарынын тизмесин тиркешиңер зарыл. Ушундан соң бул кишилер БӨУнун жетектөөчү органына мүчө болот, бирок милдеттүү түрдө эмес. Бирок ошол тизмедегилер БӨУнун көзөмөлдүк органына мүчө болушу мүмкүн. БӨУ мүчөлөрүнө жарандыгына, курагына же билимине байланыштуу өзгөчө деле талаптар коюлбайт (жаш курагына байланышкан талаптар КЭУ негиздөөчүлөрүнө коюлат). Бирок мунун баары конкреттүү жагдайга жараша болот."},{"t":"p","h":"Иштелип чыккан устав мамлекеттик каттоо үчүн Юстиция министрлигине жана Улуттук статистикалык комитетке берилет. Эгерде уставдагынын бардыгы коюлган талаптарга жооп берсе, уюмуңар юридикалык жак катары катталганы тууралуу күбөлүк алат. Ушундан кийин уюмдун финансылык отчёттору тийиштүү финансы органдары тарабынан мезгил-мезгили менен текшерилип турушу мүмкүн. БӨУңар коммерциялык эмес уюм катары катталганы үчүн ушундай болуп жатат, бул статус ага бир топ жеңилдиктерди берет."},{"t":"p","h":"<span class=\"pg\" data-n=\"76\">76<\/span>уюмдар (Буу"},{"t":"p","h":"Элдин ден соолугу үчүн чогуу иштейбиз т байланыш жана башка Социалдык тармактар начар өнүккөндүктөн жана параыи алдын алуу боюнча маалымат таратуу мүмкүнчүлүгү чектелгендиктен, Түң дагы жалпысынан 5894 киши жашаган Карачуңкур, Кеңсуу, Сарытологой, Санташ жана ра айылдарынын тургундары ооруга көп чалдыгып жатат."},{"t":"p","h":"Этнотур Санташ” БӨУсСу Караколдун ЖККБсына кайрылып, аны менен биргеликте калктың муктаждыктарын иликтеп чыкты. Ошентип, бул жердеги негизги маселе – жергиликтүү анын начар иштегендиги җана анын имаратынын оор абалга келгендиги аныкталды, лерузе оорукананы реконструкциялоо боюнча долбоорду түзүүдө жардам берилди."},{"t":"p","h":"“Сорос-Кыргызстан” фонду колдоп, 2003-жылдын июнунда “Жамаат саламаттыгы” ун алкагында 3242,5 доллар өлчөмүндө каржы бөлдү."},{"t":"p","h":"рдүн ийгиликтүү жүзөгө ашырылышынын жана элдин активдүү катышуусунун натыйжасында оорукананын имараты толугу менен реконструкцияланды: суу жана жылытуу түктөрү, канализация бут бойдон оңдолуп, чатыры, полдору, терезелери жана башкалары птылды. Эми айылдыктар үчүн медициналык тейлөө жеткиликтүү болуп калды. ый"},{"t":"p","h":"БӨУ көп финансы булактарын таба"},{"t":"v","l":["алат. Бул мүчөлүк акылар, БӨУ уюштурган","иш-чараларга кирүүдө төлөнгөн акы,"]},{"t":"p","h":"айрым жарандардын же уюмдардын кайыр-"},{"t":"v","l":["садагалары болушу мүмкүн. Кээде өзүнчө","бир долбоорду аткарыш үчүн алар эларалык","уюмдардан финансылык жардам ала алышат.","Көп эле өлкөдө кайсы бир саясий курсту же","БӨУ долбоорлорун жүзөгө ашырыш үчүн","өкмөт каржы бөлүп турат, бул келечекте","кенири жайыла турган көнүмүш болушу","мүмкүн. Өкмөт мындай тактиканы көп","пайдаланат, анткени БӨУ ишти аз чыгым","жумшап, өзүнө квалификациялуу көп","адистерди тартуу менен кыска эле мөөнөттө","аткарып бере алат."]},{"t":"p","h":"Оширахунова Динара, “Демократия жана жарандык коом үчүн коалициясынын”"},{"t":"h3","h":"регионалдык өкүлдөрүнүн координатору"},{"t":"p","h":"Динара 1969-жылы Нарында туулган. Кийин ата-энеси менен Балыкчыга көчүп келген. Орус тили жана адабияты педагогикалык институтун аяктап, 4 жыл мектепте иштеген. Анан “Не1уетаз” эларалык уюмунун Балыкчыда ачылган филиальна барган.1999-жылы Динара “Демократия жана жарандык коом үчүн коалициясы” БӨУсунун регионалдык өкүлү болуп тандалып алынды. Ал семинарларды, тегерек столдорду уюштуруп, көп адамдар менен жолугушуп, жергиликтүү байкоочуларды окутуп-үйрөтүп жүрдү. Динара эң башкысы – адамдарды жалпы ишке мүмкүн болушунча көбүрөөк тартуу керек деп эсептейт, андыктан коом турмушуна активдүү зарыл экендигине элди үгүттөп, кызыктырууга аракеттенет."},{"t":"p","h":"2.5 БӨУлардын көпчүлүгү кандай иштейт?"},{"t":"h3","h":"БӨУнун көбүндө жетекчилери жана башка кызмат адамдары шайланат. БӨУнун бардык мүчөлөрү"},{"t":"p","h":"бирдей добуш укугуна ээ. Жалпы жыйналыштар жылына бирден кем эмес жолу өткөрүлөт. БӨУнун бардык шайланма кызмат адамдары уставдагы көрсөтүлгөн тартип боюнча мына ушул жыйналышта көпчүлүк добуш менен кайра шайланып турушу мүмкүн. (Башкаруу органдары демейде белгилүү мөөнөткө шайланат да, убагы келгенде же кандайдыр бир күтүүсүз кырдаал түзүлгөндө жаңыдан шайланышы мүмкүн. Кайра шайлоо сөзсүз эле жыл сайын жүргүзүлө бербейт). Күнүмдүк чечимдер башкы жетекчи – төрага же президент тарабынан кабыл алынат. Ошентсе да, бүтүндөй жетектөөчү комитет (же кеңеш) кабыл алынган чечимдерди жана аткарылган иштерди жактыруу, бюджеттин кайсынысын болсо да <span class=\"pg\" data-n=\"77\">77<\/span>бекитүү же пландарга өзгөртүү киргизүү үчүн маалынан кечиктирбей чогулуп турушу керек. Өзүнөр көрүп тургандай, БӨУ парламент модели боюнча иштейт."},{"t":"p","h":"Керектөөчүлөрдүн укуктарын коргойт Өткөөл экономика мезгилинде көпчүлүк товарлар ыенен тейлее кызматтарынын сапаты начар болгондугу ден соолукка з"},{"t":"v","l":["сырттан ташылып келинген продукщ","Республикасынын 1997-жылы кабыл","Анткени республикада өндүрүлгөн же","етиштүү д=мгээлде көзөмөлгө алынбай жатат. Кыргыз ","иган","у","ын коргосо женүндө” "]},{"t":"p","h":"мыйзамы практика жүзүндө иштебейт. Керектөөчүлөрдүн күн сайын 6; туп жаткан укуктарына көңүл бурулбай, тийиштүү чаралар керулбей жачот, Б атё райбмунда түзүлгэн “Кант Айкын” коомдук бирикмеси керектөөчүлөрдүн укуктарын коргоо максатында Канттагы ЖККБга кайрылды. 2003-жылы бул борбордун консультамиялык жана техникалык көмөгү менен! “Керектөөчүлөрдүн укуктарын коргоо” долбоору иште фонду колдоп, 1750 доллар өлчөмүндө акча бөлүп"},{"t":"v","l":["чыкты. Аны “Сорос-Кыргызстан” ","1. Натыйжада элекз{ эңергиясын, "]},{"t":"p","h":"сугат жана таза сууну, телефон байлаңышын керектегендердин укуктары корголуп, Кант шаарындагы коммуналдык кызматтардын ишиндеги р иликтенип, к тизациялык түтүктөр оңдолду. Уюм иштей баштагандан бери 450т"},{"t":"v","l":["да, товарды алмаштырып же акчасын кайтарып алуу","көрсөтүлгөн.","","3.0 Кээбир катталган жана катталбаган БӨЎлардын мүнөздөмөсү"]},{"t":"p","h":"Бул БӨУлар эң мыкты болгондугу жана көптөн бери иштеп келгендиги үчүн эмес, жалпы эле БӨЎУларга мисал боло алгандыгы үчүн тандалып алынды. Биринчи үчөө мыйзамдын талабына ылайык юстиция органдарында катталышы керек. Кийинки эки уюмду жергиликтүү өз алдынча башкаруу органдарында эле каттоодон өткөрүп коюуга болот."},{"t":"p","h":"“Интербилим” эларалык борбору «Интербилим» 1993-жылы катталган. Борбордун алдына коюлган милдет – “үчүнчү секторду” (жарандык коомду) өркүндөтүп, калктын турмушу оор жана коргоого муктаж катмарына көмөк көрсөтүп жаткан БӨУлардын мүмкүнчүлүктөрүн кеңейтүү. Борбордун тренерлери тарабынан ар кайсы тармактар боюнча окуу программалары иштелип чыгып, жүзөгө ашырылып жатат: &gt; БӨУ концепциясы"},{"t":"v","l":["фандрейзинг (финансы булактарын издөө)","коомчулук менен байланыш","лидерлик","финансы менеджменти жана мониторинг","У стратегиялык пландоо","&gt; БӨУ менеджменти","&gt;» адам укуктарын коргоо жана лоббилөө","&gt; гендер жана өнүктүрүү","&gt; конфликттерди чечүү"]},{"t":"p","h":"Борбор БӨУ өкүлдөрүнө укук маселелери, долбоор түзүү, өнөк (партнёр) издөө, ММК менен байланышты жолго коюу, баа берүү жана мониторинг, коомдук кампанияларды (өнөктүктөрдү) жүргүзүү жана башка темалар боюнча бекер кеңеш берет. Мындан тышкары Борбор БӨУ өкүлдөрүнө компьютер, көчүрмөлөө жана видеокөрсөтүү, электрондук почта, Интернет жагынан кызмат көрсөтөт."},{"t":"p","h":"Борбор ар түрдүү иштерди жүргүзүп, көптөгөн коомдук акцияларга активдүү катышат. Мисалы, 1998-жылы ММКларды, БОУларды, адистерди, жарандык коомдун өкүлдөрүн экологиялык бузууларга каршы уюштуруп, “Кыргызстандагы БӨУлар” деген документалдуу фильм тарткан. 2001-жылы кароосуз калган балдар тууралуу «Уясыз балапандар» аттуу видеофильм тарткан. Ошол эле жылы «Интербилим» Барскоондогу экологиялык кырсыкты баяндаган «Алтын кырсыгы» фильми үчүн Словакияда «Епуіго ЕШт» эларалык кинофестивалынын баш байгесин алган."},{"t":"p","h":"Жалалабаттагы “Адилеттүүлүк” облустук укук коргоо уюму Уюмдун милдети – коомдогу толеранттуулукту (сабырдуулукту) камсыздоо, мыйзам үстөмдүгүнүн бекемделишине көмөктөшүү."},{"t":"p","h":"Ишинин башкы багыттары:"},{"t":"p","h":"&gt; адамдардын негизги укуктарын, эркиндиктерин жана мыйзамдуу кызыкчылыктарын коргоо; &gt; жарандарды укуктук аң-сезимге тарбиялоо;"},{"t":"p","h":"&gt; аймакта мыйзамдуулукту сактоо багытында мониторингди үзгүлтүксүз ишке ашыруу; <span class=\"pg\" data-n=\"78\">78<\/span>Кыргыз Респувлиласындааы вейопнот уюлдар (Ъ2У)"},{"t":"p","h":"&gt; жарандарды укуктарынын жана эркиндиктеринин бузулуш маселелери боюнча ар дайым кабыл алып туруу;"},{"t":"p","h":"коомдук коргоочулар катары соттун тергөө иштерине катышуу;"},{"t":"p","h":"массалык маалымат каражаттары аркылуу адам укуктарын жана мыйзам үстөмдүгүн сактоо маселелеринде коомдук пикирди түзүү;"},{"t":"p","h":"&gt; улут аралык мамилелер жана конфликттердин алдын алуу багытындагы иш чөйрөсүндө этноконфессиялык мониторинг жүргүзүү."},{"t":"p","h":"Уюмга 21 юрист жана башка адистер, ар түрдүү кесиптин өкүлдөрү кирген. 1997-жылдан баштап “Адилеттүүлүк” уюму укук коргоочу корреспондент тармагын түзүп, юридикалык бекер кызмат көрсөтүүчү коомдук кабылдамаларды ачты. Бул БӨУ негизинен калктын социалдык жактан корголбогон катмарларына: пенсионерлерге, майыптарга, согуш жана эмгек ардагерлерине, жумушсуздарга, бюджет чөйрөсүнүн кызматчыларына, дыйкандарга, “афгандыктарга”, ”чернобылдыктарга” жардам көрсөтөт. Маселен, мыйзамдуу укуктарын камсыздоо үчүн майып шахтёрлорго жардам берилди. Уюмдун юристтери жасаган иш-аракеттин натыйжасында шахтёрлор тиешелүү кампенсациясын! алышты. Бул уюм инсандын укуктары менен эркиндиктери бузулган учурларда адилеттүүлүктү калыбына келтирүү багытында иш жүргүзөт, ошондой эле конфликттин алдын алуу жана аны эртелеп жөнгө салуу максатында конкреттүү иштерди жүзөгө ашырат. Ушул иштердин баары мамлекеттик түзүмдөр (структуралар) жана жерг! иликтүү өз алдынча башкаруу органдары менен бирдикте аткарылат."},{"t":"v","l":["Калкты укуктук аң-сезимге тарбиялоо – уюмдун ишиндеги негизги багыт.","","“Баястан” бейөкмөт уюму"]},{"t":"p","h":"Бул БӨУ коомдук бирикме катары Нарын облусунда 1997-жылы түзүлгөн. Милдети – балдарга, майып балдарга, ошондой эле майып балалуу аялдарга колдоо көрсөтүү. БӨУнун ишиндеги негизги багыттар булар:"},{"t":"v","l":["&gt; Майып балдарды жалпы билим берүүчү мектепке тартуу.","&gt; “Балдар балдарга жардам берет” программасын ишке ашыруу."]},{"t":"p","h":"БӨУнун аракетинин натыйжасында 1997-жылдан бери Чкалов атындагы орто мектепте “Майып балдарды жалпы орто билим берүүчү мектепке тартуу” программасы ишке ашырылып келе жатат. 1999- жылы долбоорго дагы 5 мектеп, 3 бала бакча кошулган."},{"t":"p","h":"2001-жылдын январынан тартып “Баястан” тарабынан баланын укуктары боюнча долбоор турмушка ашырыла баштады, анын алкагында төмөндөгүлөр жүргүзүлүүдө:"},{"t":"v","l":["&gt;» баланын укуктары жана психология боюнча 5, 6, 10-класстардагы сабактар;","» психолог менен юристтин кеңеш берүүлөрү;","мугалимдер, балдар, ата-энелер арасында баланын укуктары боюнча анкета жүргүзүү."]},{"t":"p","h":"Мындан тышкары “Өспүрүм юрист” ийрими түзүлгөн. Келечекте “Баястан” “Майып балдарды жалпы билим берүүчү мектепке тартуу” сынак долбоору боюнча тажрыйба жайылтууну, майып балдар үчүн реабилитациялык борбор ачууну, ошондой эле программаны каржылоо үчүн көмөкчү чарба уюштурууну пландоодо."},{"t":"p","h":"“Жаңы Турмуш” жамаат тибиндеги уюму Талас облусунун Жаңы Турмуш кыштагында жамаат тибиндеги уюм (ЖТУ) түзүлгөн; максаты – ргундардын катышуусу менен жергиликтүү проблемаларды чечүү. ЖТУнун мүчөлөрү жамаат сыйынында тургундардын жалпы добуш берүүсү менен шайланат. Уюмга кыштактын өнүгүшү үчүн көп пайдалуу жумуштарды жасаган адамдар шайланган. Аларды тургундардын көпчүлүгү билет, сыйлайт. Жамаат жыйынында проблемалар талкуулангандан кийин кыштакты өнүктүрүү планы түзүлгөн. Балдар 12 чакырымдай алыстагы кошуна кыштакка барып-келип окугандыктан мектеп куруу маселеси биринчи кезектеги иш катары белгиленген. Балдарга айрыкча кышкысын кыйын болгон. Бул проблеманы амаат өз күчү менен чечүүгө тийиш эле. 2002-жылы кыштак тургундары мектеп курулушун баштады. ектеп курулушуна акчанын бир бөлүгүн Каунтерпарт Консорциум эл аралык уюму төлөп жардам көрсөттү, бирок «Жаңы турмуш» ЖТУсу да, анын мүчөлөрү да эларалык донордон өздөрүнө акча албай тешкен. «Жаңы турмуш» ЖТУ мүчөлөрү эми жолдорду, суу каналдарын оңдоону пландап жатышат. Элдин кирешесин арттырып, бул алыскы кыштактын турмуш шартынын жакшырышына кызмат кылгыдай бизнести өөрчүтүү үчүн шарт түзүү пландалууда."},{"t":"v","l":["\"Компенсация – келтирилген зыяндын ордун толтуруучу акы.","","ё;"]},{"t":"p","h":"<span class=\"pg\" data-n=\"79\">79<\/span>Улам алга уытулуп Жумуш орундарынын жоктугу, жашоо деңгээлинин темэндүгү, өлкөдөгү социалдык-экономикалык оор абал аймактардагы элдин турмуш-тиричилигине терс таасир тийгизүүдө. Мисалы, Ноокат районундагы 6000 кишилик калкы бар Деңкышлак айылында акча каражаттарынын жоктугунан улам кондитердик цех иштебей жаткан. 2003-жылдын майында түзүлгөн “Калдиргоч” өз ара жардамдашуу тобунун (ӨЖТ) мучелеру Ноокаттагы ЖККВга жарпам сурап кайрылып, чакан бизнестин негиздери, бизнес пландоо, ЭЖТ концепциясы, социаидык өнөктөштүк, салык салуу ж.у.с. маселелер боюнча окутуу тренийгинен өтүштү, Эле консультациялык жардам алышты. ӨЖТ мүчөлөрүнүн мында алган билимдери менен көндүмдөрү долбоор, бизнес план иштеп чыгууга мүмкүндүк берди. Январда алар киреше алып келүүчү ишмердикти (нан азыктарын жана кондитердик азыктарын даярдоо ишин} а! түрүүгө 5 жылдык мөөнөт менен 230 доллар өлчөмүндөгү кредит алышты. Кредитти “Жамааттар кирешеси” МКАсы жылына 24 % менен берди. Карыз акча 2004-жылдын майында толугу мёнен кайтарылды. Ал эми ӨЖТнын жалпы кирешеси 230 долларды түздү.Бул ийгиликке ан ӨЖТ өз ишмердигин андан ары улантты. 2004-жылдын майында аймактагы мап чарбачылыгын өнүктүрүү боюнча бизнес планын иштеп чыгып, МКАдан 6 айлык мөөнөт менен 800 ар кредит алды."},{"t":"p","h":"«Кайрат» жамаат тибиндеги уюму Жамаат 2001-жылдын 6-апрелинде А. Огомбаев кыштагынын тургундарынын жалпы чогулушунда буга чейин чоң иштерди аткарган жаштардын «Кайрат» демилгечил тобунун негизинде түзүлгөн. Дүкөндүн эски имаратын ижарага алган жамаат аны реконструкциялап спорт клубун уюштурган (машыгуу жана күрөш залдарын жасаган). Бул имаратта ошондой эле маданий-массалык иш-чаралар, жаштар үчүн конкурс, дискотека, лекция өткөрүлө баштады."},{"t":"p","h":"Жамаатты түзүүнүн максаты – өз кызыкчылыктарын жана жарандык укуктарын коргош үчүн айыл калкын активдештирүү, алардын жергиликтүү жана улуттук деңгээлде руханий, социалдык жана экономикалык чөйрөгө таасир этүүчү чечимдерди кабыл алуу процессине катышуусун камсыз кылуу. Биринчи чогулушта уюмдун ишмердигин эң маанилүү проблемадан – коомдук мончону капиталдык ремонттоодон баштоо керек деп чечилди. Каунтерпарт Консорциумдун жана Европа биримдигинин колдоосу астында кыштак тургундары ашар жолу менен мончону ремонттоп, кайра курушту, анда чачтарач да ачылган."},{"t":"p","h":"“Кайрат” көптөгөн ар кандай иш-чараларды өткөрөт. Маселен, жамааттын демилгеси боюнча 2002-жылдын 7-мартында А.Огомбаев кыштагында Талас облусунун Талас районуна караштуу Калба айыл өкмөтүнүн жаштарынын 1 курултайы өткөрүлдү. Азыркы мезгилде айыл тургундарынын турмушун жакшыртыш үчүн бул уюм Талас облусунда жакшы өсө турган картөшкөнүн үрөнүн сатып алып, А.Огомбаев айыл өкмөтүнүн башчысы бөлүп берген жерге айдашты. Күзүндө “Кайрат” ЖТУсу калктын кем-карч катмарына картөшкөдөн жардам бермекчи."},{"t":"p","h":"“Кайрат” жамааты кыштакты өнүктүрүүгө байланыштуу өз алдына төмөндөгүдөй милдеттерди койду:"},{"t":"v","l":["1) кыштактын орто мектеби үчүн спорт зал куруу;","2) клубду реконструкциялоо жана оңдоо;","3) стадион куруу;"]},{"t":"p","h":"4) жергиликтүү айыл чарба чийки затын кайра иштете турган чакан ишкана ачуу үчүн инвестицияларды тартуу менен жергиликтүү айыл чарба продукциясын оңой сатып өткөргүдөй шарт түзүү."},{"t":"p","h":"4.0 Кыргызстандагы айрым катталган БӨЎлардын тизмеси"},{"t":"p","h":"2004-жылдын 1-мартындагы маалымат боюнча Кыргызстанда 6598 катталган БӨУ бар. Көз карандысыздыкка жеткенге чейин Кыргызстанда бир да катталган БӨУ болгон эмес. Төмөндө келтирилген схема БӨУнун негизги топторун жана ар кайсы тармактарда иш жүргүзгөн БӨУлардын проценттик карымкатышын көрсөтөт."},{"t":"v","l":["<span class=\"pg\" data-n=\"80\">80<\/span>БӨУ ишинин тармактары","","Башка тармактар","20%","","Экология","5%","","Майылтар","5%","","1, “Днамонд” ассоциациясы","БӨУ төмөндөгүдөй проблемалар менен иштейт:","&gt;» Гендердик теңчилик, аялдарды саясатка тартуу;","жаштар 20%","","Илим жана","билим берүү","9%","","үйбүлөлөр жана","Кайрымдуулук пенсионерлер 7%","уюмдары жана","фонддор 6%","","&gt; Аялдарга зордук-зомбулук көрсөтүлүш себептерин иликтөө;","&gt; Аялдардын тукум улоого жарамдуулугун коргоо;","&gt; Адам укуктары жана аялдардын укуктары боюнча билим берүү;","&gt; Жаштар арасында экологиялык билим берүүнү өөрчүтүү.","Дареги: Бишкек ш., Панфилов кеч,, 200, 39-кв., факс: 996-312-660235","іір;/Луулу.сапро.пе!тотерадез/Кр/йіатопа","","2. “Демократия жана жарандык коом үчүн” БӨУ коалициясы","БӨУнун негизги милдеттери:","&gt; жарандык коомду куруу;","&gt;» мыйзам үстөмдүгүн чыңдоо;","» адам укуктарын коргоо.","Дареги: Бишкек ш., Ибраимов кеч., 37, 29-кв., тел.: 68-13-34, 68-09-72, 29-63-92","Е-тай: соаійтоп\\бО@шіо!е].Кр","","3. Керектөөчүлөрдүн укуктарын коргоочу “Айкын” ассоциациясы"]},{"t":"p","h":"БӨУнун негизги милдети- Кыргыз Республикасында жарандардын күч-аракеттерин бириктирүү, багыттоо млекеттик органдарга каршы турат.","5. БӨУлар жарандардын өздөрүнүн белсене иштегенинин натыйжасында, алардын","көтөргөн демилгесинин, бири-бирине берген жардамынын негизинде түзүлөт.","6. БӨУ экономикалык кыйынчылыктарды башынан кечирип жаткан өлкөлөрдө гана","болот."]},{"t":"p","h":"<span class=\"pg\" data-n=\"83\">83<\/span>Жарандык Жана жазлепетти вашпаруува татышуу – ХХ1 нызыадын Э©арандып тоозундавы силердин розунар"},{"t":"p","h":"05-тапшырма. Эскиби же жаңыбы? 10 мүн."},{"t":"p","h":"Шеригинер менен талкуулап, бул суроого жооп бергиле: БӨУлар бүгүнкү күндө эле түзүлүп жатабы же алар коомдо мурдатан эле бар беле?"},{"t":"p","h":"1 06-тапшырма. Артыкчылыктар жана мемчиликтер 15 мун."},{"t":"p","h":"Шеригинер менен коомдук проблемалардын мамлекеттик түзүмдөр жапа БӨУ тарабынан чечилишинде кандай артыкчылыктар жана кемчиликтер болорун санал бергиле"},{"t":"h2","h":" БӨУ"},{"t":"p","h":"1] 07-тапшырма. БӨЎнуниш чөйрөсү 15мүн."},{"t":"p","h":"Шеригинер менен Кыргыз Республикасындагы БӨУлардын ишмердигин талдап, тийиштүү жыйынтык чыгаргыла да, текстте (4.0-пунктунда) берилген диаграмма боюнча чакан корутунду жазгыла."},{"t":"p","h":"ф 08-тапшырма. Аларды каттоонун зарылчылыгы барбы? 30 мүн."},{"t":"p","h":"Шеригинер менен төмөндөгү сыпатталган топтор үчүн БӨУ катары катталуу зарыл же зарыл эмес экендигин аныктагыла."},{"t":"p","h":"1. Саламатсызбы! Менин атым – Бакыт, музыкалык клубдун катчысымын. Биз ар айдын биринчи шаршембисинде жолугуп турабыз. Биздин башкы иш-милдетибиз – Фергана өрөөнүнүн музыкалык салтын сактап калуу. Кээде биз концерт коюп чыгабыз, анан албетте, бул иш үчүн грант талап кылынат. Акчаны биз клубга жаңы киргендерге музыкалык аспап сатып берүү үчүн чыгымдайбыз. Акча ошондой эле эски ырларды жазып алыш үчүн да керек."},{"t":"p","h":"2. Атым – Гүлмира, өз кыштагыбыздагы эле жумасына эки ирет чогулуп, тандыр нан жапкан кызкелиндерденмин. Нанды биз базарга сатып, жаңы насос сатып алыш үчүн акча жыйнап жатабыз. Тиешелүү акчаны дээрлик жыйнап бүтүп калдык. Мындан кийин өз кыштагыбыз үчүн тегирмен сатып алгыдай акча топтосок деген ниетибиз бар."},{"t":"p","h":"3. Менин атым – Султан. Сегиз баланын атасымын. Аялым Баткенден, өзүбүз Ошто турабыз. Ай сайын аялымдын ага-инилери менен жолугуп, шаан-шөкөт курабыз: саясат тууралуу, дагы башка ар кандай нерселерди сүйлөшөбүз. Мындай шаан-шөкөттүн ыгым-чыгымына деп атайын акча чогултабыз."},{"t":"p","h":"4. Менин атым – Лена, 17 жаштамын. Шаардагы жаштар комитетинин төрайымымын. Биз жума сайын чогулуп, концерт коюу, спорт күндөрүн, лидерлик боюнча семинарларды өткөрүү сыяктуу алдыдагы пландарды талкуулайбыз. Бир аз акчаны бизге акимчилик бөлүп берди, а бир азын эларалык уюмдардан алдык. А ЮНЕСКО болсо бизге концерт коюшубуз үчүн акча бөлүп берди. Клуб мүчөлөрүнө комитет тарабынан акча төлөнбөйт."},{"t":"p","h":"5. Менин атым – Каныкей. Шаарыбыздагы жалгыз бой энелер ассоциациясына мүчөмүн. Ай сайын жолугушуу уюштуруп, меймандарды чакырабыз, ден соолук, өзүбүздүн юридикалык укуктарыбыз тууралуу сүйлөшөбүз. Акча каражатыбыз да, банкта алыш-бериш эсебибиз да жок. Чай-панга кеткен чыгымыбызды жабыш учун ассоциациябыздын мүчөлөрүнөн жардам (акча ж.б.) алып турабыз. Кээде биз мыйзамдарды талкуулап, ассоциациябыздын атынан парламентке кат жазып, кабыл алынган же парламентке киргизиле элек мыйзамдарга өзгөртүү киргизүү тууралуу сунуштарыбызды айтабыз жана тийиштүү түшүндүрмөлөрдү беребиз."},{"t":"p","h":"6. Менин атым – Таалай, фермерлер жамаатына мүчөмүн. Биз ай сайын чогулуп, фермерчиликтин түйүндүү маселелерин жана аларды чечүүнүн жолдорун талкуулайбыз. Жамаатыбыздын кээ бир мүчөлөрү кооперативде, кээ бири менчик чарбаларда иштешет. Эларалык уюмга долбоорубузду сунуш <span class=\"pg\" data-n=\"84\">84<\/span>Кь кылып, гезитке эойрыңхаш үчүн акча алдык. Бизде бир гана акы А, үүчү кызл Р иштейт,"},{"t":"raw","h":"<h4 class=\"mk\">гезитке ма е]. менен бирге кесин негизде<\/h4>"},{"t":"v","l":["жана бухгалтердик ишти жүргүзөт. Калгандарыбыз терагаб,","Эрежелерибиздин 4","акы төлөнүүч","кызматкерлери камитетке мүчө боло албайт."]},{"t":"p","h":"Саламатсыңарбы! Атым – Эрлан, өз мектебибиздин мектеп кеңешине мүчөмүн. Бизде эч канд лалкуулаш үчүн эки жумада бир чогулабыз. Уч менчик каражат жок. Кеңешке мүчөлөр ы аа, жана жергебизге тиешелүү Маселелер агы долбоорубуздун максаты – мектептин артыңда футбол аянтын курууга акимден уруксат алуу. е максатты эки түрлүү жол менен ишке ашырсак де турабыя. Адегенде аянт кайсы максат үчүн керектигин түшүндүрүп кат жазышыбыз керек. Анда кийин биз отун камдап, кышында сатсак дейбиз. Бул акчаны өзүбүздүн футбол командабыз Үчүн спор инвентарын сатып алууга жумшасак деп ойлойбуз."},{"t":"v","l":["$$ 09-тапшырма. Бул кандайча болот? 15 мун.","","Шеригинер менен ачык каттоодон өткөн БОУну түзүү процессинин схемасын чийгиле","8? 10-тапшырма, А башка жагдайдачы? 10 мун.","Шеригинер менен катталбаган БОУну түзүү процессинин схемасын чийгиле"]}],"sub":[],"pages":[73,84]},{"title":"XVIII бап. Коомдук пикир жана массалык маалымат каражаттары мамлекеттеги «төртүнчү бийлик» катары","blocks":[{"t":"h2","h":"<span class=\"pg\" data-n=\"85\">85<\/span>XVIII бап. Коомдук пикир жана массалык маалымат каражаттары мамлекеттеги «төртүнчү бийлик» катары"},{"t":"h3","h":"Текстти окуганга чейинки көнүгүүлөр"},{"t":"v","l":["КЫ ф 01-тапшырма. Түшүнүктөргө туура келген аныктамаларды бергиле. 5муүн.","Эки-экиден болуп, терминдерге аныктамаларды тандагыла."]},{"t":"raw","h":"<h4 class=\"mk\">1. Коомдук пикир 2. Массалык маалымат каражаттары (ММК) 3. Уктуруу<\/h4>"},{"t":"p","h":"фа) Маалыматты жана пикирлерди таратуунун ар түрдүү те хникалык жолдору (мисалы, телекөрсөтүү}."},{"t":"p","h":"б) Бир тарапка караганда экинчисине көбүрөөк артыкчылык берүүчүлүк. в) Бирөөнү каралаган айың сөздү элге таратуу; бул учун сот"},{"t":"v","l":["4, Маалымат каражаты“ жоопкерчилигине тартылып, жазапул (штраф) салынышы мүмкүн","5. Интернет г) Кишилердин ар кандай топторунун коомдук чындыкка мамилеси","д) Билдирүүлөрдү кеңири аудиторияга таратуу.","6. Тенденциялуулук","е) Маалымат таратуунун бир түрү.","7. Жалаа","`1 ж) Бүткүл дүйнөлүк компьютер тармагы.","1, 02-тапшырма. Маалыматалуу 5 мүн."]},{"t":"p","h":"Эки-экиден болуп, коомдоштугуңар пайдаланып жүргөн ар кандай массалык маалымат каражаттарынын тизмесин түзгүлө. Анан төмөндөгү суроолорго жооп бергиле:"},{"t":"v","l":["а) Бул массалык маалымат каражаттары мамлекеттикиби же жеке менчикпи?","б) Алар кимге таандык: кыргызстандык менчик ээлеринеби же чет өлкөлүктөргөбү?"]},{"t":"p","h":"в) Эгерде алар Кыргызстандын массалык маалымат каражаттары болсо, анда жергиликтүүбү же республикалыкпы? (Б.а. алар маалыматты канчалык кеңири таратат: районго элеби же кандай?)"},{"t":"h2","h":"текст"},{"t":"v","l":["Бул бапта төмөндөгүлөр каралат:","1. Коомдук пикирдин калыптанышы жана анын бийлик органдарына таасири","2. Массалык маалымат каражаттары деген эмне?","3. Массалык маалымат каражаттарынын жоопкерчилиги","4. Демократия, коомдук пикир жана массалык маалымат каражаттары"]},{"t":"p","h":"Коомдук пикирдин калыптанышы жана анын бийлик органдарына таасири Бардык учурда коомдук турмуштун көп кырдуу аспектилерине (жактарына) жарандардын өз кө караштары болот жана алар бири-биринен сөзсүз айырмаланат. Алар өздөрүнүн калыптанган пикирине ылайык, колдо бар маалыматтын негизинде, тиешелүү чечимдерди кабыл алат. Ошондуктан кабыл алынган чечимдердин сапаты маалыматтардын жеткиликтүүлүгүнө, ишенимдүүлүгүнө жана толукту жараша болот."},{"t":"p","h":"Маалыматты ар ким ар кандай чечмелесе да, азыркы коомдо адамдардын көпчүлүгүнүн ке караштары окшош калыптанат же, жок эле дегенде, кээ бир маселелер боюнча алар тил табыша алат. Бу <span class=\"pg\" data-n=\"86\">86<\/span>парэзБатитары аалаелеттеги маланий айырмачылыктарга карабастан, көпчүлүгүбүз негизинен жалпы адамзат дөөлөттөрүн (чы жана жалган, жакшылык жана жамандык, сулуулук жана түрү сууктук ж.у.с.) бирдей барктаганыбызга байланышкан. Мисалы, калкынын көпчүлүгү салыктардын көбөйүшүн тилеген коомду табыш кыйың ошентсе да, экинчи жагынан, калкынын көпчүлүгү мамлекет эч кандай салыксыз деле жашаса болот деп эсептеген өлкөлөр абдан аз. Бирок кээ бир маселелерге келгенде, адамдардын айрым бир коомдо кез карашы башка коомдоштуктардыкынан өзгөчөлөнүп турат. Алсак, шаар тургундары саябан бак (парк) өстүрүүгө акчаны көп жумшалышын жакташы, ал эми айыл тургундары мындан такыр башкача пикирде болушу мүмкүн."},{"t":"raw","h":"<div class=\"gloss\"><p>б:<\/p><\/div>"},{"t":"p","h":"Коомдук бардыкмүчөлөрүнүн езарааракетинин соңку жыйынтыгы катары калыптанат, Бирок эч убакта эч бир маселе боюнча элдин баарынын пикири толугу менен дал келишпейт, тескерисинче ар кандай өлкөдө карама-каршы көз караштар менен пикирлер боло берет. Пикирлер менен көз караштар колдо бар маалыматтардын негизинде калыптангандыктан, мында маалымат алуу мүмкүнчүлүгүн жана билим берүү системасын көзөмөлдөө чечүүчү ролду ойнойт. Демократиялык коомдо мындай көзөмөлдөө өзгөчө мааниге ээ, анткени адамдар маалыматтын негизинде гана кимге добуш берерин чече алышат, ал эми шайлоо коомдук пикирди аныктоонун ыкмасы жана анын чагылышы болуп эсептелет."},{"t":"p","h":"Эгерде коомдук пикирди кайсы бир саясий топ өз абалын чыңдоо жана байлык жыйноо максатында гана көзөмөлдөсө, анда таптакыр алгылыксыз иш-аракеттер орундуудай көрсөтүлүп калышы ыктымал, Маселен, Советтер Союзунда жаңылыктардын таралышын көзөмөлдөөчүлөр массалык репрессиял тууралуу маалыматты сталиндик режим белгилүү бир мезгилге чейин, атүгүл Сталин өлгөндөн кийиң да жашырып же төгүндөп турган. Мына ушундай мамиледен улам элдин көпчүлүгү Сталинди өзүнүн ошол кездеги атак-даңкына мыйзамдуу жол менен келген улуу адам деп эсептеген. Ушунун натыйжасында диктатура аларга мамлекетти башкаруунун мыкты формасындай көрүнчү."},{"t":"p","h":"Мындай абалды то-"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>талитардык (коомдук тур-<\/td><td>Коомдук<\/td><td> Жумушсуздук<\/td><\/tr><tr><td>муштун бардык жактарын катуу көзөмөлгө алган)<\/td><td>р ик, турмуштун теменку денгээли пикирдин рр суунун жоктугу<\/td><td>22%<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"мамлекеттерде коомдук 1ЕЕ$ елке боюнча Электр жана газ менен камсыздоо проблемалары пикирди тескеп тургандар социологиялык су- Айыл чарбасынын проблемалары Ошондуктан диктаторлук жакшы түшүнүшөт. Рамжылоо уюштур- Айыл-кыштактын жалпы булганышы аш жана турмуш-тиричилик проблемалары 7% – режимге макул болуучу рилген жоопторду Жолдордун жаман абалы"},{"t":"v","l":["коомдук пикирди “түзүү” чагылдырган таб- Коммуналдык кызматтын начардыгы","максатында идеологиялык Лица келтирилет: Жалпы экономикалык проблемалар м","кысымдын кубаттуу меха- ӨЗҮНР билген- дей, ар кайсы шаар- ‚ Кылмыштуулук, сойкулук","низмин колдонушат. Мына лар менен кыштак- Сугат суунун жоктугу","ушундай жагдай, маселен, тардын проблема- Жаштардын проблемалары","Экинчи дүйнөлүк согушка лары ар түрдүү.","чейин жана ушул согуш- Кайсы проблема- парды силер өз Медициналык тейлөөнүн начардыгы Билим берүү системасы","тун учурунда нацисттик жамаатыңарда аб- Дагы башкалар"]},{"t":"p","h":"Германияда өкүм сүргөн, азыр деле дүйнөнүн баш- эсептейсиңер?” дан маанилүү деп Билбейм 9% ка бир катар өлкөлөрүндө да экум суруп турат. Тоталитардык мамлекеттерде “мээни жууп-тазалоо” (элдин баарына бирдей калыптагы пикирди таңуулоо) процесси үйбүлөдөгү балалык кезде жана мектепте эле башталат. Мамлекет маалыматтын бардык булактарын көзөмөлдөйт. Ушунун натыйжасында “жалпы мамлекеттик коомдук пикир” калыптанат да, өкмөттүн саясатын элдин баары жактырат деген жалган түшүнүк пайда болот."},{"t":"p","h":"Бирок мындай системалар акырындап ичинен ирип бузулат, анткени АКШнын мурдагы президенти Абраам Линкольн (1809-1865) айткандай: «Айрым кишилерди дайыма, бардык кишилерди бир аз убакытка алдаса болот, бирок элдин баарын дайыма алдай берүү мүмкүн эмес». (Бул сөз Жон Бартлеттин “Линкольндун цитаталары” деген китебинде берилген)."},{"t":"p","h":"20 Массалык маалымат каражаттары деген эмне?"},{"t":"p","h":"Адамдар ачык маалымат алып жүргөн булактарды көбүнчө массалык маалымат каражаттары (ММК) деп аташат. Массалык маалымат каражаттарына гезиттер, журналдар, телекөрсөтүү, радио жана бча 1 Се. ж ыш <span class=\"pg\" data-n=\"87\">87<\/span>Интернет кирет. Булардын ар биринин өзүнчө өзгөчөлүгү бар"},{"t":"p","h":"Телекөрсөтүү төмөндөгүлөй өзгөчөлүктөрүнөн улам эн кубаттуу каражат болуп эсептелет:"},{"t":"p","h":"1) ал кыйла арзан турат, аудиторияны кенен камтыйт (бир жолу даярдап андан кийин аны сандагы көрүүчүлөргө көрсөтүү үчүн кошумча чыгымдар талап кылынбайт);"},{"t":"p","h":"2) сунуш кылынуучу көрсөтүү формалары ар түрдүү келет (жанылыктар, музыка, спектаклдер, комедиялар, документалдуу программалар жана башкалар);"},{"t":"p","h":"3) көргөн көзгө жагымдуу (кээ бир адамдар телевизор кореей жүрө албай тургандыгын айтышат};"},{"t":"p","h":"4) керуучуден атайын билим-тажрыйбаны талап кылбайт (угуп-көрүп отура бересин). Радио да телекөрсөтүү сыяктуу эле каражат, бирок угуучуларды өзүнө анча тарта албайт. Анткени менен радионун деле өзүнө таандык артыкчылыгы бар: аламдар аңгеме дүкөн курган берүүлөрдү угууга дайыма ынтызар болуп (кызыгып) турушат, ал эми телекөрсөтүүдөн бирөөлөрдүн узакка созулган сөзүн баштан аяк карап отурууга элдин баарынын эле чыламы жете бербейт. Анын үстүнө радиону үй жумуштарын жасап же жол жүрүп бара жатып деле уга берүүгө болот"},{"t":"p","h":"Жеке менчик телерадио каражаттары аркылуу жалпыга зарыл маалыматты берип туруу чечими ар кандай программалардын канчалык таанымал экендигин сурамжылоо аркылуу кабыл алынат Андыктан эгер социологиялык сурамжылоо кызыксыз программалар көн берилип жүргөндүгүнө байланыштуу телекөрүүчүлөр башка каналды тандап жаткандыгын көрсөтсө, компанияга тиешелуу киреше түшпөй калат. (Кийинчерээк бул жагдай эмнеден болорун талдап чыгабыз). Бул айрыкча телекөрсөтүү үчүн өтө олуттуу проблема, анткени жаңылыктарды берүү көптөгөн телекөрүүчүлөрдү кызыктырып турушу үчүн көрүнүштөр менен коштолуп, абдан кыска формада берилиши керек. Бирок көптөгөн маанилүү (маселен, жаңы мыйзамдын кабыл алынышы сыяктуу) кабарларды айтып жаткан аламдан башка эч ким же эч кандай көрүнүш көрсөтүлбөйт. Көп учурда окуялар 30 секунд ичинде түшүндүрүп берүүгө мүмкүн болбой тургандай татаал болот. Мына ушул жагдай телестанцияларды кызыктуу көрсөтүүлөр коштогон сенсациялуу (уу-дуулуу, таң калтырган) сюжеттерди берүүгө аргасыз кылат да, мындай сюжеттер демейде кишилердин реалдуу турмушуна эч кандай таасир көрсөтө албайт. Ал эми эч кандай сүрөттүү коштомосуз берилүүчү, бирок бардык кишилердин жашоосуна таасир этиши мүмкүн болгон башка окуяларга көнүл бөлүнбөй калат. Ошентип, телекөрсөтүү көп учурда сүрөтсүз, бирок татаал, түшүндүрүү учун бир топ убакыт сарптала турган идеяларды берүүдө ылайыксыз массалык маалымат каражаты болуп чыгат. Мунун өзү өкүнүчтүү нерсе, анткени саясий проблемалар көбүнчө ушундай болот."},{"t":"p","h":"Гезит-журналдарды окуу үчүн зарыл билим талап кылынат, анын үстүнө бул басма сөз туундулары телекөрсөтүүгө караганда көз менен кабыл алуу жагынан бир топ кызыксызыраак келет. Бирок ушуга карабастан булардын да өзүнчө артыкчылыгы бар. Адамдар айтылган сөзгө караганда, жазылган сөзгө, анын кадыр-баркына, чындыгына көбүрөөк ишенет. Мындан тышкары жазылган текстти кыйла убакыттан кийин кайрадан оңой эле карап чыкса болот, демек, мурда кабыл алынган чечимди, көз карашты дагы да ойлонуштуруп, кайра карап чыкканга мүмкүнчүлүк болот. Ал эми тасмага жазылып эле калбаса, телекөрсөтүү же радио аркылуу берилген маалыматтарды мындай кылуу мүмкүн эмес."},{"t":"p","h":"Радио берүүлөрдү даярдоо жана трансляциялоо арзан эле (трансляциялоо – уктуруу, көрсөтүү). Бирок телеберүүнүн трансляциясы салыштырмалуу арзан болгондугуна карабастан, аны даярдоонун өзү бир топ кымбатка түшөт. Ошентсе да, ММКнын бул эки түрү тең өз алдынча артыкчылыкка ээ: керектөөчү кыйыр түрдө жана сейрек учурларда гана чыгым тартат. (Рекламаланып жүргөн товарларды тез-тез сатып алып туруу менен силер телеберүүгө да кыйыр түрдө каражат төлөгөн болосуңар). Гезит-журналдарды даярдап чыгаруу иши аны басып чыгаруучулар үчүн бир топ эле кымбатка турат, бул керектөөчүдөн күн сайын финансылык чыгым сарптоону талап кылат."},{"t":"p","h":"Силер компьютерде иштегенде пайдаланып жүргөн Интернеттин мүмкүнчүлүктөрү көп. Маалымат булагы катары караганда Интернет гезит сыяктуу эле каражат, ошол эле учурда анда телекөрсөтүүнүн да касиеттери бар. Интернет үн менен коштолуучу кыймылдап турма сүрөттөрдү көрсөтө алат, бирок анын сюжеттери көбүнчө текст аркылуу түшүндүрүлөт. Аларды да гезит сыяктуу эле кайталап караса, өтө узак мезгилге чейин сактап койсо болот. Маалыматтын бул булагында да кемчиликтер бар: мындай маалыматтарды даярдоо жана таратуу арзан тургандыктан жана редакторлор менен авторлорду сот жообуна тартуу көбүнчө мүмкүн эмес болгондуктан, басма сөз кызматкерлери жана редакторлор жаңылыктарды калыстык менен берүүгө анча кызыгышпайт. Ошентсе да Интернеттин беттеринен айрым абдан так жана жакшы берилген маалыматтарды тез таап алууга болот, бул айрыкча демократиялык принциптери анча өөрчүй элек өлкөлөрдүн жарандары үчүн өзгөчө ыңгайлуу. (Жаңылык булактарынын бири да толук объективдүү болбойт, бирок биз көз караштардын тегиз билдирилип турушуна жетише алабыз. Демек, бир эле көз караш таңууланбай, башка карама-каршы пикирлерге да жол берилет)."},{"t":"raw","h":"<div class=\"gloss\"><p>О ИК И И<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"88\">88<\/span>Кооядут питир ана взссазыл жаазылат таражаттары Саясат жана екмет женүндө маалыматты Сиз кайсы булактардан аласы? 77"},{"t":"p","h":"20% 40% 60% 80% 100% 95,2% Телекөрсөтүү"},{"t":"v","l":["Жергиликтүү гезиттер","","Адамдар, достор,","кошуналар, кесиптештер","","Россия гезиттери [7,7%","","Интернет 3,3%"]},{"t":"p","h":"сурамжылоонун жыдынт, (2003-ж. ЮСАИД мн Жаңылык албайм 1,4%"},{"t":"p","h":"30 – Массалык маалымат каражаттарынын жоопкерчилиги"},{"t":"p","h":"Улам-улам коюлуп жүргөн маселелердин бири төмөнкүдөй: ар түрдүү массалык маалымар каражаттары өз кабарлары үчүн кандайдыр бир жоопкерчилик тартабы? Ал тургай абдан демократиялуу деген өлкөлөрдүн саясатчылары да мезгил-мезгили менен ММКнын маалыматтарынын мазмунун көзөмөлдөп турууга чакырат. Эгерде алар өз аброюна кайсы бир билдирүү шек келтирди деп эсептесе, адатта сот аркылуу акчалай компенсация өндүрүп алууга аракет кылышат."},{"t":"p","h":"ММКнын жоопкерчилиги дегенде кебунче алар тараткан кабарлар менен билдирүүлөрдүн ууралыгын жана чынчылдыгын түшүнөбүз. Бирок ММК чынында эле жоопкерчилик менен иштеп жатабы-жокпу деген маселени аныкташ үчүн көп проблемаларды карап чыгуу талап кылынат.;"},{"t":"p","h":"Жаңылыктарды таратууда маалыматтын тактыгы эле маанилүү эмес экенин билүү зарыл. Бул. ММКнын дайымакомиромисстик (макулдашкан, мунасалуу) чечимдерди кабыл алууга мажбур болору менен байланыштуу. Маселен, абдан маанилүү деп эсептелген маалыматтарды тандап алууда маалыматтардын башка бир бөлүгүн алып салышат. Маалымат каражаттарынын бири да бардык жаңылыктарды толук бере албайт, себеби жаңылыктар абдан көп. Мындан тышкары керектөөчүлөргө, атап айтканда, силердин өзүңөргө алар кызыксыз да болуп калышы мүмкүн. Маселен, Кыргызстандын калкына Тайванда эмес, өз өлкөсүндө тышкы иштер министри ким болгондугун билүү кызык. Бирок Тайванда да, Кыргызстанда да рактын дарысынын табылганы тууралуу маалымат берилсе, кишилер ошого абдан кызыгышар эле. Ошону үчүн ММК дайыма “чындыкты” билдирип турушу толук мүмкүн, бирок ошону айрым учурларды айтпай коюу менен чындыкты бурмалап берет, Маселен, сталиндик репрессиялар тууралуу эч сөз айтылбай, маалымат билдирилбей келсе, мурдагы СССРдин жарандары өз системасы тууралуу ишенимдүү маалыматты кайдан алышмак эле?"},{"t":"p","h":"ММК кайсы жаңылыктарды окуялартууралуу унчукпай элекоюш керек деген маселени кобунче биздин ордубузга өздөрү чечет. Андыктан биз ММКга эбегейсиз жоопкерчилик жүктөйбүз. Бирок керектөөчүлөрдүн сурамын толук канааттандырыш үчүн өлкөлөрдүн көбүндө ар түрдүү маалымат каражаттары бар, анын үстүнө бул – негизинен менчик каражаттар, айрымдары гана мамлекетке таандык. Демек, кыйла маанилүү саясий көз караштардын ар бирин чагылдырыш үчүн, маселен, өз гезиттери болот, алар дайыма бир гана саясий позицияны ээлешет. Бирок идеалдуу жагдайда, эгерде көрүп жаткан гезиттердин баарын карап көрсөк, бири-биринен айырмаланган көз караштардын бардыгы чагылдырылганы байкалат. Маселен, АКШда телекөрсөтүүнүн айрым каналдары Республикачылгі караганда, Демократиячыл партияны көп колдой турганын, же болбосо мунун тескерисинче болорун көрө алабыз. Мында массалык маалымат каражаттарынын бардыгы тең эле өз-өзүнчө саясий көз караштарды: колдоорун, саясий жактан калыс өңүт ээлеген бир да маалымат каражаты болбой турганын түшүнүп коюу. абдан маанилүү. Гезит ээси кайсы бир саясий партиянын жактоочусу болсо, ММКнын жаатчыл болушу көбүрөөк ыктымал. Атактуу “Экономист” журналы өзүн “көз караштардын журналымын” деп <span class=\"pg\" data-n=\"89\">89<\/span>вашпарууга т у – ХХ] тылызй жүрөт, чындыгында ал башка басылмаларга салыштырганда маалыматты калыс чагылдырат."},{"t":"p","h":"Айрымдар жоопкерчилик жана саясий калыссыздык маселесин ММКны мамлекеттештирүү аркылуу чечсе болот дешет. Бүткүл калкка жеткиликтүү эбегейсиз сандагы маалымат каражаттары иштеп турган шартта маалыматтын мамлекеттик айрым органдарына да орун табылышы мүмкүн, бирок мамлекеттик ММКнын үстөмдүк кылын коркунучтуу. Бул проблеманы чечүүнүн дагы бир ыктымалдуу жолу – ММКга саясий көз караштардын картинасын, жок дегенде, мамлекеттик органдарга шайланчу талапкерлер тууралуу көз караштарды теңдештирий көрсөтүү талабын коюу. Албетте, буга жетишүү кыйын, жетишкенде деле маселе толук калбайт, Ошентсе да бул багытта аракеттер жасалып жүрөт. Тилекке каршы, көптөгөн кедей өлкөлөрдө калкка маалыматты жайылтуу наркынын кымбаттыгынан улам айыл жерлеринде маалымат мамлекеттик ММК аркылуу гана таратылат. Бул жагдай өзүнчө олуттуу маселени жаратышы мүмкүн. Анткени алам табияты ушундай – өкмөт өзүн жакшы жагынан көрсөткөн билдирүүлөрдү гана берип, жагымсызларын көмүскөгө калтырып коёт. Өкмөттүн чыныгы кемчиликтерин тартынбай сынга алып жүргөн ММК үлгүсү катары Улуу Британиянын мамлекеттик каналы болуп саналган Би-Би-Сини айтууга болот"},{"t":"p","h":"Жергиликтүү булактардан (телекерсетууден, радиодон, гезиттерден} алынган маалыматтарга"},{"t":"raw","h":"<h4 class=\"mk\">0% Топугу менен ишенем Ишенем [7 Айрымдарына ишенем, кээ бирлерине ишенбейм Ишенбейм Такыр ишенбейм Жооп берүүдөн а кыйналып турам<\/h4>"},{"t":"v","l":["40%","50%","10%","30%","20%","","(2003-ж. ЮСАИД жүргүзгөн","сурамжылоснун","","трансляцияланышы коммерциялык эч кандай пайда женил. иван Ошол эле учурда мамлекет жарыяланышы,"]},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>келтирбей турган, бирок коомчулук учун мааниси<\/td><td>чүлүгүнө эз болушу керек деп ровен<\/td><\/tr><tr><td>зор маалыматтарды жайылтууда чон роль ойнойт.<\/td><td>(2003-ж. ЮСАИД ҮР<\/td><td>у<\/td><td>аы) у<\/td><\/tr><tr><td>Мисалы, мыйзамдарга сунуш кылынган өзгөртүүлөр,<\/td><\/tr><tr><td>шайлоонун өткөрүлүшү ж.у.с. Коммерциялык пайда<\/td><td>Айрымдары<\/td><td>Билбейм<\/td><\/tr><tr><td>дегенде, биз компаниялардын ММК ээлеринин<\/td><td>гана 10,8%<\/td><\/tr><tr><td>ушундай маалыматты алып берууден жана<\/td><\/tr><tr><td>жарыялоодон киреше алуу мүмкүнчүлүгүн түшүнөбүз.<\/td><\/tr><tr><td>Жеке менчик массалык маалымат каражаттары өз<\/td><\/tr><tr><td>кирешесинин көбүн башка компаниялардын жарыя<\/td><\/tr><tr><td>жана кулактандырууларын жайгаштырганы үчүн<\/td><\/tr><tr><td>түшкөн төлөмдөрдөн алат. Бул компаниялар өз жарыя<\/td><\/tr><tr><td>жана кулактандырууларын демейде көпчүлүк элди<\/td><\/tr><tr><td>кызыктырган популярдуу берүүлөрдүн учурунда же<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"алардын алдында, болбосо соңунда берилишин артык көрүшөт. Мамлекет коомго жеткиргиси келге! айрым маалымат өтө деле кызык эмес (анткени менен маанилүү) болгондуктан, реклама берүүчүлөр ө жарыясын мындай маалымат берилип жаткан убакта жайгаштыргысы келбеши мүмкүн, себеби алар ан! кишилер аз көрөт деген ойдо болот. Маселен, эгер өкмөт шайлоо системасын реформалоо маселелер! боюнча телекөрсөтүүдөн талкуу өткөргүсү келсе, бул тема телекөрүүчүнү кайсы бир сериалдай өз тарта албайт. Мындай учурда мамлекеттин өзүнүн телестанциясы болушу керек, же ага өз материалы берүү үчүн менчик телекомпанияга акча төгүүгө туура келет."},{"t":"p","h":"<span class=\"pg\" data-n=\"90\">90<\/span>Өкмөт ММКны мыйзамдар аркылуу көзөмөлгө алуу зарылчылыгы туурасында көп айтып жүрөт. Кээде ММКга кысым көрсөтүлөт, мисалы, жазык {орсуча – “уголовный”) ишин козгоо жолу менен"},{"t":"v","l":["Эгер жалаа жазык кылмышы деп","эсептелсе, анда журналисттик","иликтөөлөр жүргүзүлбөй калат","Мыйзам","Кеңештин","Жогорку","чыгару,"]},{"t":"p","h":"гезиттерди жаап салышат, кайрадан чыгарыла жыйынынын коомдук уюмдар жана маалыма» башташына уруксат беришпейт. Бирок демейде бул саясаты боюнча комитетинин җы чүн жа: е мыйзам жетишээрлик Кабан Карабеков Жазык кодексинен жала а болот. Жалаа жөнүндө мыйзам мындай мүмкүнчү- мыйзам долбооруна түшүндүрмө борду. жөнүндөгү статьяны алып салууну кездегон лук берет: эгер кимдир-бирөө кайсы журналист к кэ ме республикадагы ММКнын өнүгүшү жалган маалымат бергендигин билсе, андан ЗЫЯНГа абдан зор мааниси бар бул учурагандыгын далилдеп бере алса, бул журналистке долбоорун депутаттар жактырбай кошш, каршы соттук доо козгосо болот. Эгер доогер сотто көбүрөөк мүмкүн дейт. Азыр абийирди коргоо өзүнүн айткан сөзүн далилдеп бере алса, журналист боюнча көп жүргүзүлүп жаткан Сотторду (демейде маалымат органы де ганынын ээси) ага компенсация КӨРҮ ээси) п туруп, журналисттер коррупция жаң а чиновниктердин башка ыплас жоруктары телей бериши керек. Кыргызстанда МЫНДЕЁ жөнүндө чыныгы фактыларды териштирип мыйзамды гезиттен компенсация алуу үчүн кептеген „..ууга батынбайт. Мунун айынан жөнөкөй мамлекеттик ишмерлер, алардын катарында мурунку жарандар объективдүү маалымат ала албай Президент Аскар Акаев да пайдаланган. КӨПТӨГӨН калат."},{"t":"p","h":"ичинде соттук куугунтуктан коркпостон ээн-эркин Антон Лымарь, “Комсомольская прав ны. 2004-ж., печ. Е сүйлөөгө укугу бар."},{"t":"p","h":"Эмне болгондугу, кандайча, эмне себептен улам болгону тууралуу маалыматтын теңдештирилген жана калыс түрдө берилип жаткандыгын анык билгибиз келсе, ар кыл маалымат каражаттарын карап көрсөк болот, Ошентип, кыйла объективдүү картинаны көрө алабыз: жаңылыктын бир булагынын саясий бир жактуулугу (мисалы, жаап-жашыруучулугу) башка булактын саясий бир жактуулугу (мисалы, апыртуучулугу) менен компенсацияланат. Чындап келсе, турмушта деле биз ушундай кылабыз. Ким менен баш кошсом же эмне сатып алсам деген чечим кабыл алганда, көпчүлүк учурда биз башкалардын пикирин сурайбыз."},{"t":"p","h":"Шайлоодо добуш берүүдө эң алгылыктуу чечим кабыл алуу үчүн элге түрдүү саясий көз караштардын баары жеткиликтүү болушу керек. Мындай учурда эл бийлик органдарына мыкты өкүлдөрдү тез тандай алат жана алардын ыйгарымдуу мөөнөтү аяктаганга чейин өз милдеттерин айкын жана так (отчёттуу) аткарышын билип туруу мүмкүнчүлүгүнө ээ болот."},{"t":"p","h":"4.0 Демократия, коомдук пикир жана массалык маалымат каражаттары"},{"t":"p","h":"Демократиялык өлкөлөрдө саясатчылар коомдук пикир менен эсептешпей коё албайт, себеби ал саясий чечимдердин иштелип чыгуу жана кабыл алуу процессине катуу таасир тийгизет. Коомдук пикир коомдук аракеттерге алпарат: адамдар саясий партияларга мүчө болуп кирет, өкмөткө каршы добуш берет, коомдук уюмдарга мүчө болуп кирет же ал уюмдарды өздөрү түзөт, демонстрацияга чыгат же иш таштайт. Эгер өкмөт өз жарандарынын пикирине кулак салса жана алардын укуктарын басмырлабаса, коом «чегинен» чыкпайт. Калк алдындагы өзүнүн кадыр-баркы жөнүндө такай кам көрүү зарылчылыгынан улам кээ бир саясатчылар өз атын чыгаруу “өнөрүн” өздөштүрүүгө жана популизмди деле айта беришет, пайдаланууга умтулушат, б. а. өз шайлоочуларына жагуу үчүн учурда жүзөгө ашпай турган нерселерди "},{"t":"p","h":"Коомдук пикирдин саясий ишмерлерге жана саясий структураларга болгон таасири ушунчалык катуу болгондуктан, демократиялык өлкөлөрдө атүгүл өкмөттүн саясий курсун өзгөртүп салат. Мына ушундан улам демократиялык өлкөлөрдө массалык маалымат каражаттары кээ бир учурларда «төртүнчү бийлик» деп аталат."},{"t":"p","h":"Демократиялык өлкөлөрдүн эң башкы белгилеринин бири мамлекеттин коомдук пикирге расмий түрдө таасир этүү мүмкүнчүлүгүнүн чектелүү экендигинде, Демократиялык өлкөлөр өсүп жаткан муунга тарбиянын кандай түрү берилип жактандыгын көзөмөлгө албайт (адамдарды мыйзамсыз түртүүгө, албетте, тыюу салынышы керек). Ошондой эле алар менчик массалык маалымат каражаттарында. эмне басылып жана эмне айтылып жатканын көзөмөлдөбөйт. Туура эмес маалымат таратылгандыгы далилденген учурларда гана кийлигишүүгө болот, мындайда сотко кайрылуу зарыл. Демократиялык өлкөлөрдө мамлекеттик басмаларды, телерадио берүүчү же таратма станцияларды көзөмөлгө алуу ді"},{"t":"p","h":"ий <span class=\"pg\" data-n=\"91\">91<\/span>акыр туура эмес деп эсептелет. Демейде мамлекет телералиоберууте лицензияларды! сатышы мүмкүн, ирок ал аны атаандаштык негизде эң ири сумма төлөгөнгө сатат. Ал эми лицензия сатылгандан кийин ны кайра алуу жана эмне көрсөтүлүп, эмие басылып жатканына көзөмөлдүк кылуу оңой эмес. Эгерде бийлик органдары бул ишке кийлигишүү аракетин жасаса, кийинки шайлоодо алар утулуп калышы мкүн, себеби шайлоочулар муну олуттуу провокация (чыр чыгаруучулук) жана укуктардын бузулушу атары карашы мүмкүн."},{"t":"p","h":"Бирок демократиялык система коомдук пикирди багыттоону болтурбоого сөзсүз эле кепилдик бербейт. Анткени массалык маалымат каражаттарынын ири тармактарынын ээлери өздөрүнүн саясий кызыкчылыктарын көздөйт. Бирок коомчулук берилей маалыматтын ар тараптуулугуна ишенбей калса, ал башка булакка которулуп кетиши мүмкүн, натыйжада тийиштүү маалымат каражатынын кирешелери азая түшөт. Ырас, бул система кынтыксыз эмес, бирок кардарларды өзүнө тартуу зарылдыгы бийлик органдарынын көңүлүнө карабастан, так жана чынчыл маалыматты таратууга зор түрткү берет"},{"t":"p","h":""},{"t":"h2","h":"2 Текстти окугандан кийинки көнүгүүлөр"},{"t":"v","l":["1 03-тапшырма. Мен жашаган аймактагы коомдук пикир 30 мүн.","","1. Шеригинер менен иштеп, жердештеринер (айылдаштарынар) жалпысынан бирдей пикирде болгон маселелердин тизмесин Каукаый ЧЕЛОВЕК имет СВОЮ ТОЧИЗ ЗРЕНИЯ.","түзгүлө (маселен, салыктарды азайтуу керек","дешет).","Шеригиңер менен иштеп, жердештериңер","ар башка пикирде болгон маселелердин","тизмесин түзгүлө."]},{"t":"p","h":"Шеригиңер менен иштеп, жаштардын пикирлери жалпысынан бирдей, бирок жашы улуу адамдардын көз караштарынан айырма-"},{"t":"v","l":["луу болгон маселелердин тизмесин түзгүлө.","Тизмеңерди башкалар түзгөн тизмелер менен","салыштыргыла,","111, 04-тапшырма. «Маалымат жетишсиздиги» 10мүн."]},{"t":"p","h":"Кандайдыр бир жаратылыш кырсыгынын кесепетинен улам силердин чакан кыштагыңардын тышкы дүйнө менен болгон байланышы такыр үзүлүп калды деп элестеткиле. Дүйнөнүн башка булуң-бурчунда эмне болуп жатканынан эч кабарыңар жок. 3-4 кишиден болуп иштеп, мындай абалдын артыкчылыктары менен кемчиликтерин сүрөттөп жазгыла. Таблицанын биринчи чакмагы үлгү катары толтурулду."},{"t":"p","h":"Канчалык аз кабардар болсоңор, ошончолук аз"},{"t":"v","l":["кыжаалат болосуңар. Ушуга байланыштуу","англиялыктарда мындай макал бар:","«Жаңылыктын жоктугу – көңүлүңдүн токтугу».","","#4 05-тапшырма. Маанилүүбү же маанисизби?"]},{"t":"p","h":"Эки-экиден болуп, кийинки бетте берилген темаларга көз жүгүрткүлө, Окуялардын кайсы окурмандардын көбүнүн турмушуна чоң таасир тийгизе алат да, кайсылары айрым окурмандарга таасирдүү болот?"},{"t":"p","h":"Лицензия – кандайдыр бир ишти жүргүзүүгө уруксат берүүчү документ."},{"t":"p","h":"<span class=\"pg\" data-n=\"92\">92<\/span>д жет 2 көбүнө таасир айры -"},{"t":"v","l":["Адам 1 жолборсту жеди.","|Өкмөт с: алыктардын дагы көбөйгөнүн жарыялады.","„Автобус кырсыгынан 20 киши өлдү.","П Пайлоо дагы үч жылга жылдырылды.","_!Авиакырсык: бир аял аман калды.","Шайлоо комиссиясы жакынкы эки жыл ичинде жаңы","саясий партиялардын бирин да каттабай турган болду."," Кийин өр алдындагы силердин милдеттенмеңер.","$$ 13-тапшырма. ММК менен оз ара мамилелер 25 мун."]},{"t":"p","h":"Өзүнөрдү судья ден элестеткиле. Силерден премьер-министр менен телестанция ортосунда жүргөн жала тууралуу ишке сын пикир берүүнү сурашкан. Шеригиңер менен өз пикириңерге ылайык мына булард иштеп чыккыла:"},{"t":"v","l":["1) жаңылык маалыматтарын өкмөт көзөмөлдөй алгыдай шарттар;","2) өкмөттүн ММКга жана элге маалымат берүү милдеттери.","$$ 14-тапшырма. Мамлекеттик ММК 15мун."]},{"t":"p","h":"Шеригинер менен бийликтеги саясий партияга башкаларга салыштырмалуу женилдик шарттар тузулбешу учун мамлекеттик ММКнын укуктарын кантип чектөө керек деген маселе боюнча идеяларды тизмесин окуп чыккыла. Бул идеялар орундуубу же орунсуздугунан улам иштебей калабы – муну өзүңө үчүн тактап алгыла,"},{"t":"v","l":[" 1. Мамлекеттик бардык ММК кеңеш аркылуу көзөмөлдөнөт, алардын мүчөлөрүн"," саясий партиялар шайлайт.","2. Мамлекеттик гезиттердин редакторлору менен мамлекеттик телеканалдардын","директорлору кеңеш аркылуу шайланат. Мындай дайындоо иштерин мамлекеттик"," органдар четке кага албайт."," 3. Өкмөт тарабынан жарыяланчу ар кандай билдирүүгө оппозиция түшүндүрмө берип турушу керек.","4. Жанылыктарды жарыялоо судьянын чечими менен гана токтото турулушу","мүмкүн, а эгер жарыялоого тыюу салынса, анын жүйөсү болушу керек.","5. Маалыматты жарыялоого тыюу салуу так чеги бар мезгил аралыгында (5 жыл)","гана иштетилет, андан кийин ал жарыялана бериши мүмкүн.","6. Мамлекеттик ММК редакторлору менен директорлору макулдашпастан туруп","эле, кайсы бир маалыматты жарыялатпай койгону аныкталса, алар жазапул","тартышы же түрмөгө камалышы мүмкүн.","7. Мамлекет жаңылыктар булагына ээлик кыла алат, бирок басма үйүнө,","полиграфиялык комбинатка же телерадиоберүү станцияларына ээлик кыла албайт.","8. Мамлекеттик ММК реклама жайгаштыра албайт."]},{"t":"p","h":"<span class=\"pg\" data-n=\"95\">95<\/span>## 15-ташиырма. Булактар жана калыстьхк 45 мун."},{"t":"p","h":"Шеригинер менен төмөндөгү таблицаны карап чыккыла, андан кийин ушул маалыматтарды талдап, 200 сөздөн турган кыскача отчёт жазгыла."},{"t":"p","h":"Маалыматтар ІЕЕ$ тарабынан 2001-жылы жыйналган. Элге төмөндөгүдөй эки суроо менен кайрылышкан:"},{"t":"p","h":"1. «Мен силерге бул жерде – Кыргызстандагы жаңылык булактарынын тизмесин окуп берейин. Ар бир аталган булак боюнча айтып берүүңөрдү сурайм: силер аларды дайыма пайдаланасыңарбы же чандабы, же такыр пайдаланбайсынарбы?»"},{"t":"p","h":"«Силер ар бир аталган булак жаңылыктарды объективдүү чагылдырат деп эсептейсиңерби, же объективдүү эмес деп ойлойсуңарбы?»"},{"t":"v","l":["н","","\"Кыргызстан ТКсу кыргыз тилинде","Кыргызстан ТКсү орус тилинде","Россия Федерациясынын ТКсү","Өзбекстан ТКсү","Башка чет өлкө ТКсү","Кыргызстан радиосу кыргыз тилинде","\"Кыргызстан радиосу орус тилинде","Россия Федерациясынын радиосу","Өзбекстан радиосу","Башка чет өлкө радиостанциялары","Кыргызстандын кыргызча гезиттери","","Россия Федерациясынын гезиттери","Өзбекстан гезиттери","Кыргызстандын орус тилиндеги гезиттери Башка чет өлкө гезиттери Кыргызстандын орусча журналдары Кыргызстандын кыргызча журналдары Россия Федерациясынын журналдары Өзбекстан журналдары Башка чет өлкө журналдары","ос","со о 4 О у"]},{"t":"h3","h":"Кыргызстандагы ар бир жаран өз пикирин ММК"},{"t":"p","h":"аркылуу билдирүүгө укуктуу."}],"sub":[],"pages":[85,95]},{"title":"XIX бап. Коррупция","blocks":[{"t":"h2","h":"<span class=\"pg\" data-n=\"96\">96<\/span>XIX бап. Коррупция"},{"t":"h3","h":"Текстти окуганга чейинки көнүгүүлөр"},{"t":"v","l":["01-тапшырма. Терминдер жана аныктамалар 10 мүн.","","Эки-экиден болуп, бул терминдерге тийиштүү аныктамаларды тандагыла.","","оү"]},{"t":"p","h":" а) Коомдук же мамлекеттик кызмат абалынан пайдаланып, туугандарын колдоо. |6) Жекече пайданы көздөп тийиштүү эрежелерди жана жоболорду бузуу менен кызмат ыйгарымын мыйзамсыз түрдө пайдалануу."},{"t":"p","h":" в) Маданий өзгөчөлүктөр менен аныкталуучу ой жүгүртүү ыгы."},{"t":"p","h":" г) Урууларга бөлүнүүч кын туугандарынын коомдо боло турган нерсе. Бирок айрым да кирешелерин жарыялоого тийиш."},{"t":"p","h":"ө»"},{"t":"raw","h":"<div class=\"gloss\"><p>Терми |}. Коррупция ир 3. Уурулук 5. Трайбализм 6. Бюрократизм 7 7, Менталитет 8. Акыйкатчы (Омбудсмен) АЕ: Проблема: у жолдору бөгөт 10<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"97\">97<\/span>өлкөлөрдө бул илдет көбү-"},{"t":"p","h":"Кыргызстандын жарандарынын пикири боюнча, коррупция деген эмне?"},{"t":"raw","h":"<h4 class=\"mk\">рөөк кездешет. Коррупция – өтө татаал кубулуш, бул жөн гана мамлекеттик аппараттын түзүлүшүндөгү “кемчилик” эмес. Адатта коррупция дегенде коомдук байлыкты же өзүнүн кызмат абалын жеке кызык-<\/h4>"},{"t":"p","h":"2000-ж. ПРООН жүргүзгөн сурамжылоонун жыйынтыгы (300 киши)"},{"t":"v","l":["0%","5%","20%","10%","15%","+","+","+","пара","","мафия","чылыктары үчүн кыянат- кыянаттык менен абалынан а -"]},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>тык (кара ниеттик) менен<\/td><td>пайдалануу<\/td><\/tr><tr><td>пайдаланууну түшүнүшөт.<\/td><\/tr><tr><td>Коррупция көбүнчө кайсы<\/td><td>уурулук<\/td><td>110%<\/td><\/tr><tr><td>бир кызматтар аз эле адам-<\/td><\/tr><tr><td>дардын колунда болуп, баш-<\/td><td>паралоо<\/td><td>10%<\/td><\/tr><tr><td>калар буларга көз каранды<\/td><\/tr><tr><td>г<\/td><\/tr><tr><td>абалда калган учурларда<\/td><td>лерди өткөрүү ® 10% Г о,<\/td><\/tr><tr><td>кездешет. Коррупция мый-<\/td><\/tr><tr><td>замсыз болгондуктан, ал<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"дээрлик дайым тымызын соодалашуу, пара берүү менен коштолот. Атүгүл монополист болбогондор деле коррупцияга жол коюшу мүмкүн – алар мындай кызматтагылардын баары ушинтишет деп “эл катары” пара талап кыла бериши ыктымал."},{"t":"p","h":"Коррупция дайыма мыйзамга каршы келет, бирок бардык эле мыйзамсыз иш-аракеттерди коррупция деп атаганга болбойт. Мисалы, үйүңөргө бирөө кирип, буюмдарыңарды уурдаса, бул мыйзамга каршы келет, бирок бул коррупция эмес. Себеби, мындай кылмышты жасоо үчүн ууру коомдо өзү ээлеген кандайдыр бир жооптуу кызматтан пайдаланган жок."},{"t":"v","l":["Коррупция көбүнчө парата байланыштуу","болот, бирок дайым эле эмес. МИисалы,","мамлекеттик же менчик уюмдун кызматкери","Коррупциянын эң жаман көрүнүштөрү","Бул көбүнчө жогорку даражадагы кызмат "]},{"t":"p","h":"өзү иштеген мекемеден бир нерсе уурдап сатса, адамдары жана саясий лидерлер белгилүү мында пара алуу деген жок. Эгерде кызматкер иштерди аткарууга мамлекеттик заказдарды өзүнүн кызматына таянып, кандайдыр бир жардам тендер жарыялабай, калыс конкурс да өткөрбөстөн, өз туугандарына же досторуна көрсөткөндүгү үчүн акча талап кылса, анда муну бергенде болот. Же алар кылмыш жасаган “өз бир эле учурда паракордук десе да, коррупция кишилерин” сот жоопкерчилигинен калкалап десе да болот. (Чын ыкластан, кандайдыр бир калышы мүмкүн. Мындай иш-аракеттер абдан пайданы көздөбөй белек берүү – пара берүү эмес зор зыян келтирет, анткени башка адамдар экендигин билип койгула, анткени пара берүүнүн да муну кадыресе көнүмүштөй көрүп калышы, максаты – мыйзамсыз жол менен пайда өндүрүү. мыйзамга жана сот системасына карата элдин ишеними начарлашы же өчүшү мүмкүн. Мунун Көпчүлүк өлкөлөрдө буга жол койбоо үчүн кызмат адамдарына белек берүүнүн катуу тартиби бергенде гана чыгарылат экен деген таптакыр айынан соттун оң чечими судьяларга дард киргизилген. Бул эрежелерге ылайык, кызмат адилетсиз түшүнүк калыптанышы ыктымал. адамдары же белек алуудан баш тартышат, же элдин көзүнчө гана алышат)."},{"t":"p","h":"Айрым бир жорук-жосундар адилетсиз деп бааланса да, аларды мыйзамсыз дагы, коррупциялык дагы дегенге болбойт. Маселен, кайсы бир фирма жалгыз өзү жеткирип турган товардын же жеке өзү гана көрсөтүп турган тейлөөнүн баасын эки эсе жогорулатып салды дейли. Бирок ошол эле учурда ал мындай товарды же тейлөө кызматын сунуштаганга мүмкүнчүлүгү бар башка фирмаларга тоскоолдук кылуука эч кандай аракет жасабаса, анда бул мыйзамга да каршы келбейт, коррупция дагы болуп эсептелбейт."},{"t":"p","h":"Кайсы бир лоббилөө тобу (айталы, өндүрүштүк компаниялардын жетекчилери, пенсионерлер же айыл чарба жумушчулары) белгилүү бир мыйзамдын кабыл алынышына өзгөчө кызыкдар болсо жана бул үчүн добуш бергенге парламент депутаттарын ынандырууга аракеттенишсе, мындай иш-аракет коррупциядай көрүнүшү мүмкүн. Бирок мындай иш-аракет мыйзам чегинде, ачык-айкын түрдө (коомчулуктан жашырбай) жасалса, анда бул коррупция эмес. Эгер ушундай мыйзам долбоорун колдоп добуш берсин үчүн депутаттарга пара сунуш кылышса, анда лоббилөө коррупцияга айланат."},{"t":"p","h":"Коррупция бирөө пара алган же опузалап (коркутуп) талап кылган, экинчи бирөө пара сунуштаган же <span class=\"pg\" data-n=\"98\">98<\/span>Коррупция"},{"t":"raw","h":"<h4 class=\"mk\">опузага көнүп берген учурларда болушу ыктымал. Бирок айрыкча өтө начар экономикалык<\/h4>"},{"t":"p","h":"Төмөндөгү көп айтылып жүргөн пикирлерге Сиз канчалык"},{"t":"v","l":["макулсуз же макул эмессиз? (% менен)","(ПРООНдун сурамжылоосунан, 2000-ж.)","абалда жашаган адамдар","турмуштун кыстоосунан улам","пара алууга же берүүгө аргасыз","азыр бир дагы ишти парасыз бүтүрүү","болушу мүмкүн экендигин да","эстен чыгарбоо керек.","Мисалы, мамлекеттин","мүмкүн эмес, “майлабаса араба да","жүрбөйт”","","иш-кагаздарын жүргүзгөн"]},{"t":"p","h":"кызматкердин баласы ооруп салды дейли. Айлыгы өтэ аз болгондуктан дарылоо акысын төлөө үчүн ал башкаларга"},{"t":"v","l":["биздин өлкөдө мыйзам бузбай","жашай албайсың","","күндөлүк турмуштагы маселелердин","зарыл маалымкаттарды","көпчүлүгүн кызмат адамдарына пара","(справкаларды) тезирээк жазып бербей эле чечүүгө болот","берип, анча-мынча пара алышы","же талап кылышы мүмкүн."]},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Мындайда<\/td><td>ким<\/td><td>күнөөлүү<\/td><\/tr><tr><td>экендигин<\/td><td>жана жасалган<\/td><td>бийлик адамдарды бузат<\/td><\/tr><\/table><\/div>"},{"t":"v","l":["кылмыш канчалык олуттуу","айтуу кыйын.","Көпчүлүк адамдар ушуга барып"]},{"t":"p","h":"жаткан учурда, өзгөчө мындай Г [7] такыр макул эмесмин толугу менен макулмун [Г] жооп берүүдөн кыйналам жорукту кыйла бай же жогорку кызматтагылар көз көрүнөө зле жасап жүрүшсө, коррупциянын мындай түрүнө дегеле көңүл бурулбашы мүмкүн. Кыйынчылыктан чыгуунун башка жолун таба албагандардын (көбүнчө ушундай болот) күнөөсүн коомдогу мындай абал кыйла актап тургансыйт."},{"t":"v","l":["2.0 Коррупция айлампасына кимдер тартылат?","","Коррупциялык иш-аракетке мамлекеттик органдардын"]},{"t":"p","h":"кызматкерлери эле эмес, медицина, билим берүү мекемелеринде, Б “Суралгандардын үчтөн экиси ошондой эле мёнчик компанияларда иштегендер да демилгечи пара берерде көпчүлүк адамдар болушу ыктымал."},{"t":"p","h":"Атүгүл чиркөө же мечиттердеги дин кызматкерлери да коррупцияга “чалдыгышы” мүмкүн. Орто кылымдардагы европа"},{"t":"v","l":["А",":","адабиятында күнөөдөн арылгысы келгендерге кээ бир поптор","мындай деп жооп бергендиги тууралуу аңгемелер бар: “Менин"," дили кирдеп, $ абдан нааразы"]},{"t":"h3","h":"(ПРООНДУН"},{"t":"p","h":"өткөргөн сурамжылоосунан)."},{"t":"p","h":"насыятымды угуп эмне кыласын, андан көрө акысын төлө, мен сага Кудайдын атынан бир айга алдын ала күнөөлөрүңдү кечирип коёюн, Анан отуз күн бою абийириңди тынч жайына коюп, каалашыңча күнөөгө бата бересин”. Бул мисалдан коррупциянын анчалык оор деп эсептелбеген, андыктан көп кездешүүчү түрүн көрөбүз. Мындайда параны уруксат алуу үчүн эмес, кошумча ыңгайлуу шарт үчүн беришет. Көп өлкөлөрдө анча-мынча акы телесен, бюрократиялык жол-жоболорду тездетем деген айрым чиновниктерди кезиктирүүгө болот."},{"t":"p","h":"3.0 Коррупция эмнеден келип чыгат?"},{"t":"p","h":"Коррупциялык ишке аралашсамбы-жокпу дегенде ал адам кармалып, жазага тартылбаймбы, бул жаза канчалык катаал болушу ыктымал, башка жолдорго салыштырмалуу мында кандай пайдага жетише алам деп ойлонот."},{"t":"p","h":"Көлчүлүк эл кайсы өлкөдө мамлекет күндөлүк турмуштагы түркүн-түмөн иш-аракеттерди катуу көзөмөлгө алса, ошол өлкөдө коррупция дагы абдан кеңири кулач жаят деп эсептейт. Мамлекеттик

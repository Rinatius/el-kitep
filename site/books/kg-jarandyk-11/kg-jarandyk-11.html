н жүрүшү жөнүндө маалыматтарды угат;"},{"t":"p","h":"Кыргыз Республикасынын мыйзамдарында каралган жергиликтүү салыктарды, жыйымдарды жана төлөмдөрдү киргизет;"},{"t":"p","h":"жергиликтүү коомдоштуктун муниципалдык менчигин тескөөнүн тартибин белгилейт, анын пайдаланышына көзөмөл жүргүзөт;"},{"t":"p","h":"кеңештин регламентин кабыл алат;"},{"t":"p","h":"мыйзамдарда белгиленген учурларда депутаттардын ыйгарымдарын мөөнөтүнөн мурда токтотот; жергиликтүү коомдоштуктун мүчөлөрүнүн Курултайынын сунушу менен Кулунду муниципалдык аймагынын Уставын бекитет;"},{"t":"p","h":"жергиликтүү өз алдынча башкаруунун башчысынын иш-аракетине көзөмөл жүргүзөт;"},{"t":"p","h":"жергиликтүү өз алдынча башкаруунун башчысынын орун басарын дайындаганга макулдугун берет; депутаттардын жалпы санынан кеминде 2/3 көпчүлүк добушу менен Кулунду жергиликтүү өз алдынча башкаруусунун башчысына ишеним көрсөтпөгөндүгүн билдирет;"},{"t":"p","h":"Кулунду муниципалдык аймагындагы жергиликтүү өз алдынча башкаруу системасына кирген коомдук уюмдардын жана коомдук кенештердин жоболорун бекитет;"},{"t":"p","h":"айылдык кеңештин туруктуу жана убактылуу комиссияларын түзөт, алардын жоболорун жана иш пландарын бекитет;"},{"t":"p","h":"муниципалдык менчиктеги жерлерди ижарага берүү тартибин Кыргыз Республикасынын мыйзамдарына <span class=\"pg\" data-n=\"144\">144<\/span>ылайык бекитет;"},{"t":"p","h":"муниципалдык аймакта той-аштарды өткөрүү, маркумдарды узатуу жана башка элдик каада-салттар меңен байланыштуу болгон иш-чараларды өткөрүүнүн тартибин жөнгө салат; Е – мыйзамдарга ылайык башка маселелерди сессияда чечет."},{"t":"p","h":"6. Айылдык кеңештин өзүнүн карамагына таандык кылынган маселелер боюнча чечимдери шайла депутаттардын жалпы санынын көпчүлүк добушу менен кабыл алынат. Кеңештин чечимдери токтом формасында. чыгарылат жана ага кеңештин төрагасы кол коёт."},{"t":"p","h":"7. Айылдык кеңеш тарабынан өзүнүн ыйгарымдарынын чектеринде кабыл алынган чечимдери муниципалдык аймагында жашаган бардык жарандар, мамлекеттик бийликтин жана башкаруунун аймактык. органдары, ошондой эле менчигинин формасына карабастан ишканалар, уюмдар, мекемелер тарабынан мыйзамдарда белгиленген ыйгарымдардын чектеринде милдеттүү түрдө аткарылат."},{"t":"p","h":"8. Кулунду айылдык кенешинин төрагасы ошол эле учурда жергиликтүү өз алдынча башкаруунун тийиштүү аткаруучу-тескөөчү органынын жетекчиси болуп эсептелет."},{"t":"p","h":"ІХ. КУЛУНДУ АЙЫЛ ӨКМӨТҮ Кулунду муниципалдык аймагындагы жергиликтүү өз алдынча башкаруунун аткаруу бийлигин жергиликтүү өз. алдынча башкаруунун башчысы жана айыл өкмөтү жүзөгө ашырат."},{"t":"p","h":"1. Кулунду муниципалдык аймагындагы жергиликтүү өз алдынча башкаруунун башчысы калк тарабынан жалпы, тен жана тике добуш берүү аркылуу шайланган шайлануучу кызмат адамы, ошондой эле Кулунду айыл өкмөтүнүн башчысы болуп эсептелет."},{"t":"p","h":"2. Кулунду айыл өкмөтү – жергиликтүү өз алдынча башкаруунун аткаруучу-тескөөчү органы – Кулунду айылдык кенешинин чечимдерин, ошондой эле мамлекет тарабынан берилген ыйгарымдарды даярдоону жана аткарууну. камсыз кылуу үчүн түзүлгөн Кулунду муниципалдык аймагында аткаруу бийлигин жүзөгө ашыруучу орган."},{"t":"p","h":"3. Жергиликтүү өз алдынча башкаруунун башчысы болуп Кыргыз Республикасынын 25 жашка толгон жараны жалпыга бирдей. тең жана тике шайлоо укугунун негизинде жашыруун добуш менен төрт жылдык мөөнөткө шайланат, Жергиликтүү өз алдынча башкаруунун башчысынын ыйгарымдарынын мөөнөтү шайлоолордун жыйынтыктарын бекиткен учурдан башталат да, жаны шайланган жергиликтүү өз алдынча башкаруунун башчысы кызматка учурда токтойт."},{"t":"p","h":"4. Жергиликтүү өз алдынча башкаруунун башчысы ошол эле убакта кеңеш берүү добушу укугу менен Кулунду айылдык кенешинин төрагасынын милдетин аткарат."},{"t":"v","l":["5. Жергиликтүү өз алдынча башкаруунун башчысы:","айыл өкмөтүнүн ишин жетектейт жана анын натыйжасы үчүн жоопкерчилик тартат;"]},{"t":"p","h":"жергиликтүү бюджеттин долбоорун сунуш кылат, муниципалдык аймактагы иштин жалпы абалы, жергиликтүү бюджеттин аткарылышы жана муниципалдык менчикти пайдалануу, аймактын социалдык-экономикалык_ өнүгүүсүнүн программасынын аткарылышы жана калкты социалдык жактан коргоо жөнүндө айылды кенешке жарым жылда бир жолудан кем эмес отчёт берет;"},{"t":"p","h":"өзүнүн ишинин натыйжасы жөнүндө жергиликтүү коомдоштуктун курултайында калкка жылына бир жолудан кем эмес отчёт берет;"},{"t":"p","h":"өткөрүлүп берилген мамлекеттик ыйгарымдардын талаптагыдай аткарылышын уюштуруу үчүн жекече жоопкерчилик тартат;"},{"t":"p","h":"Кыргыз Республикасынын мыйзамдарына ылайык жергиликтүү салыктарды жана жыйымдарды киргизүү боюнча айылдык кенешке сунуштарды киргизет;"},{"t":"p","h":"Кыргыз Республикасынын мыйзамдарынын чегинде башка маселелерди чечет."},{"t":"p","h":"›. Жергиликтүү өз алдынча башкаруунун башчысы өзүнүн ыйгарымдарынын чектеринде буйруктарды токтомдорду чыгарат. Анын чечимдери Кулунду муниципалдык аймагында жашаган бардык жарандар, мамлекеттик. жана башкаруунун аймактык органдары, ошондой эле менчигинин формасына карабастан ишканалар, уюмдар. мекемелер тарабынан мыйзамдарда белгиленген ыйгарымдардын чектеринде милдеттүү түрдө аткарылат."},{"t":"p","h":"7. Кулунду айыл өкмөгүнүн ыйгарымдары жана милдеттери:"},{"t":"v","l":["Тышкы экономикалык байланыштарды калыптандыруу боюнча өз ара келишимдерди түзүү;","жарды үйбүлөлөрдү аныктоо, аларга даректүү жардамдарды уюштуруу;"]},{"t":"p","h":"элдик каада-салттарды жөнгө салуу. Алар боюнча жоболорду иштеп жана анын аткарылышын кезмелдее; коомдук уюмдар менен иштөө (он башы, жүз башы, миң башы, аксакалдар соту, карыялар кеңеши, ая кеңеши, жаштар уюмдары), айыл комитети жана көчө комитети менен иштөө;"},{"t":"p","h":"жамааттык уюмдарды, коомдоштуктарды, өз ара жардамдашуу топторун түзүү жана алардын ө фонддоруна жардамдашуу;"},{"t":"v","l":["жеке ишкердикти өнүктүрүү, кичи жана орто бизнести өнүктүрүүгө колдоо көрсөтүү;","чет элдик жана мамлекеттик эмес уюмдар менен байланышты күчөтүү;","даталуу күндөрдү өткөрүүнү уюштуруу;","техникалык, ветеринардык жана агросервистик кызматтарды уюштуруу, өнүктүрүү;"]},{"t":"p","h":"дыйкан чарбалар, кооперативдер, жеке менчик чарбалары менен акционердик коомдор, суу ассоциациясы менен иштөө;"},{"t":"p","h":"<span class=\"pg\" data-n=\"145\">145<\/span>эл керектөөчү өнөр-жай товарларын өнүктүрүүнү айыл- чарба продукцияларын өндүрүүнү, кайра иштетүүнү жана сатууну уюштуруу;"},{"t":"p","h":"жакыр үйбүлөлөрдү колдоо фондлоруи уюуштуруу, аларга атайын жеңилдетилген шартта жер участкаларын арендага берүү;"},{"t":"p","h":"жаш үйбүлөлөргө колдоо көрсөтүү;"},{"t":"p","h":"жардам фонддорун, марафон өткөрүү ашар жолу менен таб ылган каражаттар аркылуу толуктап туруу; коомдоштукта ата-энелерди балдар тарбиясы менен и штөө жоопкерчилягин жогорулатуу;"},{"t":"p","h":"жалгыз бой карыяларды, тоголок жетим. жарым жетим, майып балзарды социалдык җактан камсыз кылуу. чыгармачыл балдарды колдоо;"},{"t":"v","l":["өзгөчө табигый кырдаалдардын алдын алуу, элда коргонуу иштерин жөнгө салуу;","калктын арыз даттануулары менен иштае.","жамаат аралык, үй-бүлөлүк чыр-чатактарды чечүү,","аз сандуу улуттарды колдоо, алардын арын чечип берүү"]},{"t":"h3","h":"Х. МУНИЦИПАЛДЫК КЫЗМАТ"},{"t":"p","h":"1. Муниципалдык кызмат орду – жергиликтүү маанидеги маселелерди чечүү боюнча белгиленген ыйгарымдуу жана жергиликтүү өз алдынча башкаруунун ушул оргайынын укуктарын ишке ашырууга жооптуу кызмат орду"},{"t":"p","h":"2. Муниципалдык кызмат орундарына төмөнкүлөр кирет:"},{"t":"p","h":"– шайлануучу кызмат орундары – жергиликтүү өз алдынча башкаруу органдарынын башчылары жана жергиликтүү бюджетте штаттык бирдиктери каралган башка ‹найлаяу учу муниципалдык кызмат орундары;"},{"t":"p","h":"– административдик кызмат орундары – жүргүзүлгөн конкурстун жыйынтыгы боюнча эмгек келишимин"},{"t":"p","h":"(контракт) түзүү жолу менен дайындалган муниципалдык кызмаў орундары."},{"t":"p","h":"3. Муниципалдык аймактын жарандары жынысына, расасына, улутуна, тилине, ата-тегине, мүлктүк жана кызмат абалына, жашаган жерине, диний ынанымдарына, коомдук бирикмелерге киргендигине карабастан муниципалдык кызматтан бирдей пайдалануу укугуна ээ,"},{"t":"h3","h":"Х!. КУЛУНДУ МУНИЦИПАЛДЫК АЙМАГЫНЫН ЖАМААТТЫК УЮМДАРЫ ЖАНА АЛАРДЫН БИРИКМЕЛЕРИ"},{"t":"p","h":"Кулунду муниципалдык аймагындагы жергиликтүү коомдоштуктун мүчөлөрү өздөрүнүн рухий, социалдык жана башка муктаждыктарын канаатандыруу максатында талам жалпылыгынын негизинде жеке аламдар тарабынан түзүлгөн, жергиликтүү өз алдынча башкаруу системасына кире турган ыктыярдуу өз алдынча башкаруу уюмдарын түзө алышат."},{"t":"p","h":"1. Жамааттык уюм коммерциялык эмес уюм болуп эсептелет жана өзүнүн кабыл алган Уставын негизинде иш алып барат."},{"t":"p","h":"2. Жамааттык уюмдар Кыргыз Республикасынын мыйзамдарына карама каршы келбеген, өздөрүнүн уставдарына ылайык жамааттык уюмдарга таандык финансы каражаттарына, кыймылдуу жана кыймылсыз мүлктөрүнө ээлик кылышат, пайдаланышат жана тескешет."},{"t":"p","h":"3. Жамааттык уюмдар иш-аракеттерин координациялоо, таламдарын көрсөтүү жана коргоо, биргелешкен долбоорлорду ишке ашыруу жана башка максаттар менен проблемаларды чечүү үчүн ыктыярдуу түрдө бул уюмдардын ассоциацияларына бириге алышат."},{"t":"p","h":"4. Жамааттык уюмдардын ассоциациялары коммерциялык эмес уюмдар жана юридикалык жактар болуп саналат."},{"t":"p","h":"5. Жамааттык уюмдардын ассоциацияларынын иш аракетинин жана аларды түзүүнүн тартиби, мүчөлүгүнүн жана андан чыгуунун тартиби Кыргыз Республикасынын мыйзамдарына ылайык алардын кабыл алынган уставдары менен жөнгө салынат."},{"t":"p","h":"6.Социалдык-экономикалык милдеттерди чечүү, Кулунду муниципалдык аймагынын коомчулугунун мүчөлөрүнүн жашоо деңгээлин жогорулатуу үчүн биригүүчү жамааттык уюмдар ыктыярдуу негизде коммерциялык эмес уюмду – юридикалык жак болуп саналуучу Кулунду жергиликтүү өнүктүрүү фондун уюштурушат."},{"t":"p","h":"7. Жергиликтүү өнүктүрүү фондунун иш-аракетинин тартиби, анын каражаттарын түзүү жана аларды берүү шарттары жергиликтүү өнүктүрүү фондунун уставы менен жөнгө салынат."},{"t":"p","h":"ХИ. ЖЕРГИЛИКТҮҮ КООМДОШТУКТУН КУРУЛТАЙЫ 1. Жергиликтүү маанидеги коомдоштуктун мүчөлөрү менен талкуулоону талап кылган орчундуу маселелер боюнча чечим кабыл алуу үчүн жергиликтүү коомдоштуктун өкүлдөрү катышкан курултай өткөрүлөт. Курултайга Кыргыз Республикасынын мыйзамдарына жана ушул Уставга ылайык жалпы элдик жыйындарда, чогулуштарда жергиликтүү коомдоштуктун мүчөлөрүнүн ичинен делегаттар шайланат."},{"t":"p","h":"2. Жергиликтүү коомдоштуктун курултайы жылына бир жолудан кем эмес өткөрүлөт. Курултайды өткөрүү демилгесин Кулунду айылдык кеңеши, жергиликтүү өз алдынча башкаруунун башчысы жана демилгечи топ (жергиликтүү коомдоштуктун мүчөлөрүнүн 15 проценттен кем эмесн) которо алышат."},{"t":"v","l":["3. Курултай жергиликтүү коомдоштуктун бардык орчундуу маселелерин кароого укуктуу:","– муниципалдык аймактын уставын кабыл алуу, ага өзгөртүү жана толуктоо киргизүү;"]},{"t":"raw","h":"<div class=\"gloss\"><p> ТИРКЕМЕ<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"146\">146<\/span>жергиликтүү бюджетти түзүү, аткаруу жана ошондой эле жергиликтүү коомдоштуктун бюджеттик эмес каражаттарын пайдалануу;"},{"t":"p","h":"мунициизлдык аймактын социалдык-экономикалык өнүктүрүү жана калкты социалдык жактан коргоо программаларынын долбоору;"},{"t":"p","h":"жергиликтүү өз алдынча башкаруунун башчысынын элдик курултайдын чечимдерин жүзөгө ашыруу боюнча отчётун угуу;"},{"t":"p","h":"Кыргыз Республикасынын мыйзамдарына жана ушул уставга карама-каршы келбеген жергиликтүү коомдоштуктун жашоо-турмушуна тиешелүү болгон башка маселелерди кароо."},{"t":"p","h":"4. Курултайдын чечимдери сунуш беруучулук мүнөзгө ээ жана милдеттүү түрдө Кулунду айылдык кенешинин сессиясына киргизилет жана айылдык кенештин депутаттарынын 2/3 добушу менен бекитилет."},{"t":"p","h":"5. Кыргыз Республикасынын мыйзамдарына жана ушул Уставга карама-каршы келбеген курултайдын чечимдери Кулунду мунициналлых аймагында милдеттүү түрдө аткарылууга тийиш."},{"t":"h3","h":"ХИ. ЖЕРГИЛИКТҮҮ БЮДЖЕТТИ, ПРОГРАММАЛЫК МАСЕЛЕЛЕРДИ КАБЫЛ АЛУУДА КООМДОШТУКТУН МҮЧӨЛӨРҮНҮН КАТЫШУУСУ"},{"t":"p","h":" Жергиликтүү бюджетти, аймактын социалдык-экономикалык өнүктүрүү программаларын түзүү, кароо, кабыл алуу жана аткаруу боюнча коомдоштуктун ой-пикирин, сунуштарын аныктоо максатында коомдук угуулар өткөрүлөт."},{"t":"p","h":"1. Коомдук угууларды өткөрүү тартибин айылдык кеңеш бекитет."},{"t":"p","h":"3. Жергиликтүү бюджетти кароо жана бекитүү айылдык кеңештин ачык сессияларында жана коомдук угууларда айкындык жана элдин катышуусу менен жүргүзүлөт."},{"t":"h3","h":"ХІМ. КУЛУНДУ МУНИЦИПАЛДЫК АЙМАГЫНЫН ЖЕРГИЛИКТҮҮ ӨЗ АЛДЫНЧА БАШКАРУУСУНУН ФИНАНСЫ ЖАНА ЭКОНОМИКАЛЫК НЕГИЗДЕРИ"},{"t":"p","h":"1 Жергиликтүү өз алдынча башкаруунун экономикалык негизин Кулунду муниципалдык аймагынын чегинде турган эмгектик жана табигый ресурстар (жер, кең байлыктары, суу, токой, өсүмдүктөр жана жаныбарлар дүйнөсү), муниципалдык менчик, жергиликтүү коомдоштуктун, менчигинин түрүнө карабастан берилген аймакта жайгашкан ишканалардын, уюмдардын жана мекемелердин башка кыймылдуу жана кыймылсыз мүлкү түзөт."},{"t":"p","h":"2. Кулунду муниципалдык аймагындагы муниципалдык менчикти жер, кыймылдуу жана кыймылсыз мүлк, жергиликтүү коомдоштуктун казынасы, муниципалдык баалуу кагаздар түзөт."},{"t":"p","h":"3. Кулунду муниципалдык аймагынын жергиликтүү өз алдынча башкаруусунун финансылык негизин Кыргыз Республикасынын мыйзамдары менен жергиликтүү коомдоштукка бекитилип берилген салыктык жана салыктык эмес кирешелер булактары, муниципалдык менчикти пайдалануудан түшкөн кирешелер, ошондой эле кредиттик жана финансылык ресурстар түзөт, Жергиликтүү өз алдынча башкаруу органдарынын финасылык ресурстары: жергиликтүү бюджеттин каражаттарынын;"},{"t":"p","h":"республикалык бюджеттин категориалдык, теңдештирилүүчү жана стимулдаштыруу гранттарынын; бюджеттен тышкаркы фонддордун;"},{"t":"v","l":["кредиттик ресурстардын, трансферттердин жана гранттардын;","ыктыярдуу салымдардын жана соопчулук жардамдардын;"]},{"t":"p","h":"муниципалдык баалуу кагаздардан жана жергиликтүү зайымдардан, муниципалдык менчикти пайдалануудан түшкөн кирешелердин;"},{"t":"p","h":"жалпы мамлекеттик салыктардан жана башка кирешелерден чегеримдердин;"},{"t":"p","h":"административдик жазапулдарды төлөөнүн натыйжасында келип түшкөн сумманын толук көлөмүнөн; жергиликтүү өз алдынча башкаруу органдары уюштурган иш-чаралардан түшкөн, ошондой эле жергиликтүү коомдоштуктун муктаждыктары үчүн түзүлгөн ишканалардын жана уюмдардын ишинен алынган башка кошумча кирешелердин эсебинен түзүлөт."},{"t":"h3","h":"ХУ. КУЛУНДУ МУНИЦИПАЛДЫК АЙМАГЫНЫН ЖЕРГИЛИКТҮҮ ӨЗ АЛДЫНЧА БАШКАРУУ ОРГАНДАРЫНЫН МАМЛЕКЕТТИК БИЙЛИК ОРГАНДАРЫ МЕНЕН БОЛГОН МАМИЛЕСИ"},{"t":"p","h":"1. Жергиликтүү өз алдынча башкаруу органдарынын мамлекеттик бийлик органдары менен болгон мамилеси Кыргыз Республикасынын мыйзамдарынын чегинде, мамлекеттик башкаруу менен жергиликтүү өз алдынча башкаруунун функиняларын так чектөө конституциялык принцибинде тургузулат."},{"t":"p","h":"2. Кыргыз Республикасынын мыйзамдарына ылайык Кулунду жергиликтүү өз алдынча башкаруу органдарына айрым малекеттик ыйгарымдар, аларды аткарууга керек болгон материалдык, финансылык жана башка каражаттар менен камсыз кылуу менен өткөрүлүп берилиши мүмкүн. Өткөрүлүп берилген ыйгарымдар боюнча жергиликтүү өз алдынча башкаруу органдары тиешелүү мамлекеттик органдарга отчёт берет."},{"t":"p","h":"3. Мамлекеттик органдары тарабынан муниципалдык жерлерди жана муниципалдык менчикти пайдалануу жана тескеринче жергиликтүү өз алдынча башкаруу органдары тарабынан мамлекеттик менчикти пайдалануу менен байланышкан мүлктүк мамилелер келишимдин негизинде чечилет."},{"t":"p","h":"4. Кулунду муниципалдык аймагынын жергиликтүү өз алдынча башкаруусу менен мамлекеттик органдардын ортосундагы талаш-тартыштар макулдашуу процедуралары менен же болбосо сот органдарында чечилүүгө тийиш."},{"t":"p","h":"дает. г <span class=\"pg\" data-n=\"147\">147<\/span>Жарандын поонундаеы силердин роаунар"},{"t":"h3","h":"КУЛУНДУ МУНИЦИПАЛДЫК АЙМАГЫНДАГЫ ГЕНДЕРЛИК САЯСАТ"},{"t":"p","h":"1. Кулунду муниципалдык аймагында аялдардын тең укуктуулугун которуу максатында ар кандай жыйындарга, курултайларга өкүл көрсөтүүдө 50 % кем эмес аялдарды катыш+ырууга жана алардын өз ой-пикирин, сунуштарын курултайларда же болбосо чогулуштарда ачык айкын түрдө киргизүүгө, сунуштардын аткарылышын көзөмөлдөөгө, тийиштүү башкаруу, аткаруучу-тескеечу оргаиларынан суроого, тийиштүү бөлүмдөргө кайрылууга толук укук берилет."},{"t":"p","h":"2. Жылына кеминде эки жолу “Аял- үйдүн куту”, “Аялдарды сыйлоо”, “Аял заты – керемет”, дагы башка темаларда конкурстар, диспуттар өткөрүлүп, ага катышуучулар консти тарабынан сыйлануу менен аялдардын коомдоштукта кадыр-баркын которуу, аялдарды ызаттоо боюнча имтер жүргүзүлөт,"},{"t":"h3","h":"ХУН. УЛУТТАР АРАЛЫК БАЙЛАНЫШ ЖАНА ИЧКИ МИГРАЦИЯ МАСЕЛЕЛЕРИ"},{"t":"p","h":"1. Кулунду муниципалдык аймагында жашаган жумушка жарамдуу жарандар турмуш-тиричилигин оңдоо максатында башка шаарларга, аймактарга, чет влкелорго. койгуна республикаларга өз ара байланышуу жолу менен убактылуу же болбосо узак мөөнөткө (өз мүмкүнчүлүгүнө карап) иштеп келүүгө укуктуу."},{"t":"p","h":"2. Башка аймактарга, чет өлкөлөргө иштегени бара турган жарандар бир ай мурда айыл өкмөтүнө өзүнүн бара турган аймагы, өлкөсү, шаары, ишкана жана кесиби боюнча билдирүүсү зарыл. Эгерде ал жарандар мындай маалыматты айыл өкмөтүнө берип кетүүгө мүмкүнчүлүгү болбой калса, ал адам өзүнүн жакын туугандарына, коңшу жашаган айылдашына өзү жөнүндө маалыматты калтырый кетүүгө милдеттүү."},{"t":"p","h":"3. Айыл өкмөтүндө ошол кетип жаткан жаран боюнча толук маалымат сакталышы керек жана зарыл учурда аны менен байланышуу жагдайлары аныкталышы керек."},{"t":"h3","h":"Х\\/!!. ЭЛАРАЛЫК БАЙЛАНЫШТАР"},{"t":"p","h":"1. Кулунду муниципалдык аймагынын жергиликтүү коомчулугу Кыргыз Республикасынын мыйзамдарынын чегинде эларалык жана сырткы экономикалык байланыштарды түзүүгө укуктуу. Бул укук жалпы коомдоштукка пайда келтире турган эларалык келишимдерди, контракттарды жана башка иш-чараларды аткаруу менен ишке ашат."},{"t":"p","h":"2. Кулунду муниципалдык аймагынын атынан чет өлкөлөр менен байланышууга жергиликтүү эз алдынча башкаруунун башчысы укуктуу."},{"t":"h3","h":"Х!Х. ЖЕРГИЛИКТҮҮ КООМДОШТУКТУН СЫЙЛЫКТАРЫ ЖАНА НААМДАРЫ"},{"t":"p","h":"1. Кулунду айылдык кеңеши жергиликтүү өз алдынча башкаруунун башчысынын макулдугу менен жергиликтүү коомдоштуктун атайы сыйлыктарын жана наамдарын аныкташы мүмкүн."},{"t":"p","h":"2. Жергиликтүү коомдоштуктун эң жогорку сыйлыгы болуп “Кулунду муниципалдык аймагынын ардактуу жараны” эсептелет."},{"t":"p","h":"3. Жергиликтүү коомдоштуктун сыйлыктарын жана наамдарын берүү тартибин Кулунду айылдык кеңеши аныктайт."},{"t":"p","h":"4. Айылдык кеңеш жергиликтүү коомдоштуктун сыйлыктарына жана наамдарына эз болгон адамдарга тийиштүү жеңилдиктерди берүү укугуна ээ. Бул жеңилдиктер жергиликтүү бюджеттин каражаттарынын эсебинен камсыз болушу керек."},{"t":"h3","h":"Хх. АЙЫЛ МЫЙЗАМЫН БУЗГАНДЫГЫ ҮЧҮН ЖООПКЕРЧИЛИК"},{"t":"p","h":"1. Жеке адамдарга жана юридикалык жактарга ушул Уставдын талаптарын бузгандыгы үчүн моралдык, материалдык жана административдик чара көрүү колдонулат."},{"t":"p","h":"2. Жоопкерчилик чаралары айылдык кеңеш, жергиликтүү өз алдынча башкаруунун башчысы, айыл өкмөтү, аксакалдар соту тарабынан өздөрүнүн ыйгарымдарынын чегинде колдонулат."},{"t":"p","h":"3. Кызды мажбурлап ала качуу адатына каршы катуу күрөш жүргүзүп, мындай кылмыш жасагандарды мыйзам чегинде жоопкерчиликке тартуу."},{"t":"p","h":"4. Элдик жыйындарга салып уяткарып, коомдоштуктун мүчөсүнөн чыгаруу, укук коргоо органдарына өткөрүп берүү."},{"t":"p","h":"5. Элдик каада-салттарды ашыкча чыгым жумшап айыл мыйзамын бузгандар аксакалдар сотунда каралып, жазапул төлөйт."},{"t":"p","h":"6. Тарбиясы начар балдардын ата-энесинен жоопкерчилиги суралып элдин алдында уяткарылат, аксакалдар сотунда каралып айып тартат."},{"t":"h3","h":"ХХ!. УСТАВДЫ КАБЫЛ АЛУУ ЖАНА АГА ӨЗГӨРТҮҮ, ТОЛУКТООЛОРДУ КИРГИЗҮҮ ТАРТИБИ"},{"t":"p","h":"1. Кулунду муниципалдык аймагынын Уставы элдик курултайда талкууланат жана айтылган ой-пикирлерди жана сунуштарды эсепке алуу менен кабыл алынат жана айылдык кеңеш тарабынан бекитилет, юстиция органдарында каттоодон өтөт жана массалык маалымат каражаттарында жарыяланууга тийиш."},{"t":"p","h":"2. Кабыл алынган Уставка өзгөртүүлөрдү жана толуктоолорду киргизүү элдик курултайдын сунушу менен айылдык кеңеште каралат да, юстиция органдары өз бүтүмүн бергенден кийин кеңеш тарабынан кабыл алынат."},{"t":"p","h":"3. Уставдын аткарылышын айылдык кеңеш жана жергиликтүү өз алдынча башкаруунун башчысы көзөмөлгө"},{"t":"raw","h":"<div class=\"gloss\"><p>И туск <\/p><\/div>"}],"sub":[],"pages":[140,147]},{"title":"2005-жылда Кыргыз Республикасынын Президентин шайлоо боюнча участкалык шайлоо комиссияларынын мүчөлөрү жана байкоочулар үчүн кыскача колдонмо","blocks":[{"t":"h2","h":"<span class=\"pg\" data-n=\"148\">148<\/span>2005-жылда Кыргыз Республикасынын Президентин шайлоо боюнча участкалык шайлоо комиссияларынын мүчөлөрү жана байкоочулар үчүн кыскача колдонмо"},{"t":"h3","h":"МАЗМУНУ"},{"t":"v","l":["Шайлоо институттары","Шайлооо институттарынын структурасы","Кандай айырмачылыктар бар?","УШКнын Президенттик шайлоодогу иши эмнеси менен айырмаланат?","Шайлоонун адилеттүү жана ачык-айкын өтүшү","Шайлоонун ачык-айкын өтүшү деген эмне?"]},{"t":"p","h":"Эмне үчүн шайлоону даярдап өткөрүүнүн ачык-айкын болушу ушунчалык маанилүү? Мыйзамды сыйлоо"},{"t":"v","l":["Байкоочулардын, талапкерлердин өкүлдөрүнүн жана ММКнын ролу","Участкада болууга ким укуктуу?","Добуш берүү күнүнө чейинки байкоо","Добуш берүү күнүндөгү байкоо","Байкоочулардын жана талапкерлердин өкүлдөрүнүн укуктары","ммк","УШКнын түзүлүшү","Участкалык шайлоо комиссиясы кандайча түзүлөт?","Участкалык шайлоо комиссиясына кимдер мүчө БОЛО АЛБАЙТ?","УШК мүчөлөрүнүн укуктары жана милдеттери","УШКнын биринчи жыйыны","УШКнын добуш берүү күнүнө чейинки милдеттери","Шайлоочулардын тизмелери"]},{"t":"p","h":"Шайлоочулардын фамилияларын кошумча түрдө киргизүү же тизмеге өзгөртүүлөрдү киргизүү Шайлоо тизмесинен ысымды чыгарып салуу"},{"t":"v","l":["«Тизмеден чыгуу күбөлүгүнүн негизинде добуш берүү»","Шайлоо участкасынан тышкары жерде добуш берүү тууралуу арыздарды каттоо","Участканын имаратында көрнөктүн жана маалымат тактасынын коюлушу"]},{"t":"p","h":"Шайлоо бюллетендерин алуу, кайра санап чыгуу жана УШКнын мөөрү менен штамп коюу Мөөнөтүнөн мурда добуш берүү"},{"t":"v","l":["Добуш берүү күнү","Добуш берүү жайын уюштуруу","«Эртең мененки текшерүү барагы»","Добуш берүү күнү добуш берүү бөлмөсүндө болууга кимдер укуктуу?","УШКнын мүчөлөрүнүн добуш берүү күнүндөгү милдеттери","УШК төрагасы","Шайлоочулардын тизмелери үчүн жооптуу комиссия мүчөлөрү"]},{"t":"p","h":"Бюллетендерди берүү жана шайлоочуларды маркировкалоо үчүн жооптуу комиссия мүчөсү Жашыруун добуш берүү үчүн кабиналарга шайлоочунун өтүүсүн көзөмөлдөгөн комиссия мүчөсү Участкадан тышкары жерде добуш"},{"t":"v","l":["Участканын жабылышы","Участканы жабуудагы сегиз кадам","Материалдарды ороо жана жогору турган комиссияга жеткирүү","Шайлоо күнүнөн кийин"]},{"t":"h3","h":"Даттануулар жана арыздар"},{"t":"raw","h":"<div class=\"gloss\"><p><\/p><\/div>"},{"t":"v","l":["<span class=\"pg\" data-n=\"149\">149<\/span>—Жарандын Жана малзлекетти вашптарууга лапышуу &gt; дз лымыаядын Жарамуык","","Шайлоо институттары","4. Шайлоо институттарынын структурасы"]},{"t":"p","h":"Кыргыз Республикасынын мыйзамдарына ылайык шайлоо коммиссийларыныя (ШК} төрт түрү бар. Биряичи эки түрү туруктуу иштеп, өлкөдөгү бардык шайлоолорду өткөрүүтө түр тез:"},{"t":"v","l":["Борбордук шайлоо комяссиясы {БШК}","Облустук ШК (7), Бишкек жана Ош шаардык ШК"]},{"t":"p","h":"з. Райондук/шаардык, райондук жана іпаардык комиссиялар – шайлоо датасы жарыялангандан оп күн өткөндөн кийин түзүлөт"},{"t":"v","l":["4. Участкалык шайлоо комиссиялары (УШК)- шайлоого отуз күн калганда түзүлөз","Үчүнчү жана төртүнчү ШКнын түрлөрү убактылуу иштейт ла, шайлоб башталзар алдында тү улөт"]},{"t":"p","h":"Парламенттик шайлоодо үчүнчү түрдөгү комиссиялар бир мандаттуу аймактардын санына жараша 75 аймактык комиссия болуп түзүлгөн эле. 10-июлда өткөрүлүүчү президенттик шайлоодо 96 жана райондук комиссиялар түзүлдү- Төртүнчү түрдөгү комиссиялардын саны жаңы шайлоодо өзгөрүлбөгөн бойдон кала берет, б. а 2150 УН1К лдан турат."},{"t":"p","h":"2. Кандай айырмачылыктар бар?"},{"t":"p","h":"Акыркы ирет өлкөдө Парламенттин 75 мүчөсү бир мандаттуу деп аталган аймактардан шайланган эле. Бул ар бир аймактан бирден депутат шайланат дегенди билдирет. Президенттик шайлоодо бүт өлкө бир шайлоо округу болуп эсептелип, аймактык комиссиялар түзүлбөйт."},{"t":"p","h":"3. УШКнын Президенттик шайлоодогу иши эмнеси менен айырмаланат?"},{"t":"p","h":"Кыскартып айтканда, УШКнын ролу шайлоонун түрүнө карата өзгөрбөйт. Бирок ошентсе ла төрт айырмачылык бар:"},{"t":"p","h":"„ Бул ирет УШКларга карата райондук/шаардык ШК жогору турган комиссиялар болуп саналат. Андыктан зобуш берүүдөн кийин протоколдор жана башка материалдар аймактык эмес, райондук/шаардык комиссияларга жеткирилет."},{"t":"p","h":"Тизмеден чыгуу күбөлүгүн алган шайлоочулар бүтүндөй өлкө аймагында КААЛАГАН участкада добуш бере алат. Парламенттик шайлоодо алар “өздөрүнүн” округунун чегинде добуш берген эле."},{"t":"p","h":"УШКнын добуш берүүнүн жыйынтыктары жөнүндөгү протоколу бир бетке баткандай кылып даярдалат. Астыңкы беш барак УШК мүчөлөрү кол койгондон кийин каалагандай өзгөртүүлөрдү киргизүүгө жол бербөө жана көчүрмө катары байкоочуларга жана башка адамдарга берүү үчүн өзү көчүрүлүүчү беттер болуп калат."},{"t":"p","h":"Бул ирет БШК шайлоочулардын тизмелерин жалпы элге тааныштыруу үчүн атайын даярдалган такталарга жайгаштыруу керек деп чечти. Ошондуктан УШК мүчөлөрү тизмелерди алдар замат 2005-жылдын 21-июнунан баштап жайгаштырууга тийиш, Эсиңизде болсун! Сиз өзүңүздүн участкаңыздагы шайлоочуларга, жакын кошуналарыңызга, туугандарыңызга тизмелер алып келингендигин айтып коюшуңуз керек. Ошондо алар барып, тизмеге катталгандыгын, эгер катталган болсо, өздөрү жөнүндө жазылган маалымат туура экендигин текшере алышат."},{"t":"v","l":["|. Шайлоонун адилеттүү жана ачык-айкын өтүшү","1. ачык-айкын өтүшү деген эмне?"]},{"t":"p","h":"Шайлоонун ачык-айкын өтүшү БАРДЫК деңгээлдеги комиссиялардын БҮТҮНДӨЙ ишмердигинин добуш берүү күнүнө чейин, добуш берүү учурунда жана андан кийин жарандар менен байкоочулар үчүн толугу менен ачык жана түшүнүктүү болууга тийиш дегенди билдирет, Эсиңизде болсун! Эркин жана адилеттүү шайлоодо шайлоо бюллетенин шайлоочу толтуруп жаткан учур ГАНА жашыруун болот. КАЛГАН БАРДЫК учурлар участкадагы адамдар үчүн ачык болууга тийиш! Шайлоо процессинин ачык-айкын жүрүшүнүн айрым мисалдары:"},{"t":"v","l":["ШК жыйындарынын ачык жүргүзүлүшү","– ШК жыйындарынын качан жана кайда өткөрүлөрү тууралуу күн мурунтан кабарлоо","„ ММК өкүлдөрүн ШК жыйындарына катышууга чакыруу"]},{"t":"p","h":"„ Шайлоону даярдоо жана өткөрүү боюнча негизги иш-чаралардын графигин, анын алкагында УШКга шайлоочулардын тизмесинин алып келиниши, тизмеден чыгуу күбөлүктөрүн бере баштоо ж.у.с. бардык негизги иш-чаралардын графигин жергиликтүү ММКларга жарыялоо УШКнын иштөө принциптерин досторго жана туугандарга түшүндүрүп берүү Байкоочуларды чакырып маркалоо (белгилөө) сыясы менен чырагынын сапатын добуш берүү күнү жана ага чейин да текшерип көрүшүнө мүмкүндүк берүү *_ УШКдагы милдеттерди бөлүштүрүү боюнча чүчү кулак кармоо процессин байкоочулар менен ММК өкүлдөрүнүн көз алдында өткөрүү."},{"t":"p","h":"Бул ушундай мисалдардын бир нечеси гана, чындыгында алар кыйла көп, Биз бардык деңгээлдердеги шайлоо комиссияларынын иш-аракетинде жаап-жашыра турган эч нерсе болбостугун, андыктан алар жөнүндө жарандарга <span class=\"pg\" data-n=\"150\">150<\/span>маалымат берүү зарыл экендигин эсиңизге салабыз. УШК өзүнүн иш-аракети бардык адамдар үчүн ачык жана түшү болорун анык билиши зарыл. Тактап айтканда, байкоочулар жана талапкерлердин өкүлдөрү УШКда болуп жаткан бардык нерселерди көрүп турууга жана билүүгө мүмкүндүк алышы керек."},{"t":"p","h":"Эгерде участкали кандайдыр бир маселе пайда болсо, байкоочулар жана талапкерлердин өкүлдөрү аларды талкуулоого катышып, тигил же бул чечимди УШК мүчөлөрү эмне үчүн кабыл алгандыгын түшүнүүгө эле эмес, комиссияга өз кенештерин берүүгө да мүмкүнчүлүк алышы керек."},{"t":"p","h":"2. Эмне үчүн шайлоону даярдап өткөрүүнүн ачык-айкын болушу ушунчалык маанилүү? Өлкө жарандары добуш берүү эркин жана адилеттүү өткөрүлө тургандыгына шек санабаганда гана шайлоонун жыйынтыктары ишеничтүү болот. Мындай болушу үчүн бүтүндөй шайлоо процесси ачык-айкын жүргүзүлүүгө тийиш. УШК мүчөлөрү өз иштерин так жана калыс өткөрсө да, эгер муну эч ким көрбөсө, ишенбөөчүлүк пайда боло берет! Ачык-айкындык – эркин жана адилеттүү шайлоо процессинин эң зарыл шарты. Бардык деңгээлдердеги шайлоо комиссиялары өз милдеттерин толугу менен ачык-айкын аткарууга тийиш."},{"t":"h3","h":"Этикалык кодекс"},{"t":"p","h":"«Мен Кыргыз Республикасынын участкалык шайлоо комиссиясынын мүчөсү болгондугума сыймыктанам. Мейни шайлоону даярдоо жана өткөрүү боюнча аткарган жумушумду менин участкамдагы жана бүтүндөй өлкөбүздөгү шайлоочулар жогору баалай тургандыгын билем. Мен бул жерде Кыргыз Республикасынын Конститучиясый жана Шайлоо кодексин бекем сактай тургандыгымды тастыктайм."},{"t":"v","l":["Мен:","Калыс жана нейтралдуу (бейтарап) мамилени сактаймын.","*_ Оз милдеттеримди ачык-айкын аткарамын.","«Бир шайлоочу – бир добуш!» принцибин жүзөгө ашырам."]},{"t":"p","h":"Менин участкамдагы добуш берүүгө укуктуу шайлоочулардын бардыгынын шайлоого эркин жана тең катышуусуна мүмкүндүк түзөм."},{"t":"p","h":"шайлоо процессинин бардык жагдайларына жана жоболоруна байкоо жүргүзүүсү учун шарт түзөм."},{"t":"p","h":"Чонойтулгая формадагы протоколду жана добуш берүүнүн натыйжалары жөнүндөгү протоколдун өзүн, ошондой эле кайлагандай башка формаларды тыкан жана так толтурам."},{"t":"p","h":"Шайлоочуларга жардам бергенде сабырдуу, сылык жана кең пейил болом."},{"t":"p","h":"Ар кандай кыйынчылыктар жөнүндө УШКнын мүчөлөрүнө айтып турам жана, эгер зарыл болсо, чечилбей калган маселелер жөнүндө райондук/шаардык шайлоо комиссиясына билдирип турам – деп убада берем»"},{"t":"p","h":"Байкоочулар жана таланкерлерлин өкүлдөрү, массалык маалымат каражаттары шайлоо комиссиялары эмне кылып жаткандыгын көрүп, ар кандай тартип бузууларды белгилөө жана зарыл учурларда расмий билдирүүлөрдү жасоо жагынан коомчулук алдында жоопкерчиликтүү иш аткарышат."},{"t":"p","h":"Эсиңизде болсун! Ачык-айкындык талабы шайлоо күнү эле коюлбайт. Бардык деңгээлдердеги комиссиялардын добуш берүү күнүнө чейинки, добуш берүү күнүндөгү жана андан кийинки бардык иш-аракеттери ачык жасалууга"},{"t":"p","h":"3. Мыйзамды сыйлоо Эгер ШК мүчөсү мыйзам бузса, мисалы, талапкерлердин биринин пайдасы үчүн аракет жасаса, ал жазык жоопкерчилигине тартылышы мүмкүн. Жөнөкөйлөтүп айтканда, буюм уурдагандар менен шайлоо жыйынтыктарын “уурдагандардын” эч кандай айырмасы жок."},{"t":"p","h":"Шайлоо кодексинин 57-статьясында жарандардын укугун бузуу деп эсептелген тартип бузуулардын түрлөрү аныкталган. Мыйзамда мындай иш-аракеттерди жасагандарды сот системасы аркылуу жоопко тартуу жол-жоболору"},{"t":"p","h":"Чыныгы калыстыкты камсыздоо – бул УШК мүчөлөрү да, байкоочулар жана талапкерлердин өкүлдөрү да өз алдынча кабыл ала турган чечимдин натыйжасы."},{"t":"p","h":"Эгерде Сиз жол-жоболор кайсы бир талапкер же шайлоочу үчүн бузулуп жатат деп шектенсеңиз, анда өзүңүз байкаган иш-аракетти айыптоо үчүн УШКнын чогулушун өткөрүшүңүз керек. Бул Сиздин укугуңуз эле эмес, милдетиңиз да болуп саналат. Эгерде Сиз байкоочу болсонуз, бул тууралуу УШК төрагасына же катчысына билдирип, зарыл болгондо, жазуу түрүндө арыз да беришиңиз керек."},{"t":"p","h":"Кыргыз Республикасынын мыйзамдарына ылайык бир дагы расмий же жеке адам, алардын ичинен мамлекеттик ишмер же жергиликтүү өз алдынча башкаруу органынын кызматкери ШК ишине кийлигишүүгө акысы жок."},{"t":"p","h":"Эсиңизде болсун! Сиз мыйзам бузгандыгыңыз үчүн жазык жоопкерчилигине тартылышыңыз мүмкүн. Кылмышкер болуп калбаңыз!"},{"t":"raw","h":"<div class=\"gloss\"><p> тийиш? каралган.<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"151\">151<\/span>Эсана замлепетти ваштарууёа патышуу – ХХ? пылыядын ноовундагы сизердин ролунар"},{"t":"p","h":"УШК мүчөсү: төмөндөгүдөй кырдаалдарда эмне кылуу керек?"},{"t":"p","h":"№ 1 кырдаал Эгерде УШКнын мүчөсү Сиздердин участкада жайгашкан университеттин деканы болсо, ал шайлоочулардын тизмесинде жок студенттердин добуш беришине Сизден уруксат сураса, Сиз эмне кылат элеңиз?"},{"t":"p","h":"Иш-аракеттер."},{"t":"p","h":"Эгерде студенттер Сиздин участкаңызда жашаган жери боюнча (паспорт столунда) катталган болсо, алар кошумча тизмеге киргизилип, добуш берүүгө катыша алат."},{"t":"p","h":"Эгерде студенттер Сиздин участканыздын аймагында катталбаган болсо, алар Сиздин участкаңызда добуш берүүгө киргизилбеши керек."},{"t":"p","h":"Эгерде УШК төрагасы студенттерге уруксат берүү менен жаңылыштык кетиргендигин көрсөңүз, айда кырдаалды талкуулоо жана чечим кабыл алуу үчүн токтоосуз түрдө УМКный чогулушун өткөрүүнү талап кылыңыз, Эгерде комиссия мүчөлөрүнүн көпчүлүгү төраганын туура Эмес чечимин колдосо, «өзгөчө пикир» жөнүндө жазуу түрүндө арыз даярдашыныз керек. УШК арызды карап чыгып, ал боюнча чечим кабыл алууга тийиш. Төрага болсо бул тууралуу райондук/шаардык шайлоо комиссиясына билдирүүгө милдеттүү, Райондуклиаардык комиссиянын чечими кечиктирилбей, добуш берүү күнү эле чыгарыльины керек."},{"t":"p","h":"Сиз ошондой эле «өзгөчө пикир» жөнүндө арыз жазгандыгыңыз тууралуу байкоочуларга айтсаңыз болот. № 2 кырдаал Шайлоо участкасынан тышкары жерде добуш берүү өтүнүчүн жиберген шайлоочу ага баруу учун комиссия мүчөлөрү жана байкоочулар жөнөп кеткенден кийин участкага өзү келип калса эмне кыласыз?"},{"t":"p","h":"Иш-аракеттер:"},{"t":"p","h":"Участкадан тышкары жерде добуш берүүнү өткөрүү үчүн жөнөп кеткен комиссия мүчөлөрү кайтып келмейинче шайлоочуга бюллетень берүү мүмкүн эмес. Анткени алар келгенде гана ошол шайлоочу добуш бере элек экендиги белгилүү болушу ыктымал."},{"t":"v","l":["Эгерде шайлоочу добуш бере элек болсо, аны участкада добуш берүүгө киргизүүгө болот.","№ 3 кырдаал"]},{"t":"p","h":"Эгерде шайлоочу УШКнын мүчөлөрүнүн биринин жашы улуу тууганы болсо, ал маркалоолон баш тартса, анда Сиз эмне кыласыз?"},{"t":"p","h":"Иш-аракеттер:"},{"t":"p","h":"„ Бул жаңы процедура бардык шайлоочулар үчүн милдеттүү экендигин сылык-сыпаа түшүндүрүнүз. Маркалоо ультрафиолет чырагынын жарыгына салганда гана көрүнөрүн кошумчалап айтыңыз."},{"t":"p","h":"Бул процедура шайлоо процессине карата ишенимди бекемдөө үчүн колдонуларын, анткени маркалоо бир эле адамдын бирнече жолу добуш беришине бөгөт болорун түшүндүрүңүз, Ошентип жарандар БАРДЫК шайлоочулар тегиз маркалоо процедурасынан өтө тургандыгын билүүгө тийиш."},{"t":"p","h":"Акырында шайлоочуга маркалоо процедурасы шайлоодогу башка бардык жол-жоболор сыяктуу эле аткарылышы керек экендигин, УШК мүчөсү катары Сиз Эгерде ага маркалоосуз добуш берүүгө уруксат кылсаңыз, мыйзам бузгандыгыңыз учун жазаланышыңыз мүмкүн экендигин түшүндүрүңүз. Ошондо дагы шайлоочу маркалоодон баш тартса, анда Сиз аны добуш берүүгө киргизбешиңиз керек."},{"t":"p","h":"Мэ 4 кырдаал Добуш берүү кабинасына келген шайлоочу чөнтөгүнөн бюллетень алып чыгып, участкадан алган бюллетенди чөнтөгүнө жашыргандыгын көрүп калдыңыз. Андан соң ал өзү ала келген бюллетенди добуш берүү сандыгына салмакчы болду."},{"t":"v","l":["Иш-аракеттер:","Шайлоочуну дароо токтотуп, сандыкка бюллетень салдырбай коюңуз."]},{"t":"p","h":"Шайлоочуга ал өзү участкадан алган бюллетенди гана сандыкка салууга укуктуу экендигин түшүндүрүңүз. Шайлоочу ала келген бюллетенди тартып алыңыз да, ал участкада берилген бюллетенди толтуруп, сандыкка салууга тийиш экендигин айтыңыз."},{"t":"p","h":"УШК төрагасына айтып, бул окуя жөнүндө акт, жазуу түрүндө түзүлгөндүгүн анык билиңиз. Тартып алынган жараксыз бюллетенди жокко чыгарыныз."},{"t":"p","h":"Сиз ез милдеттеринизди мыйзамга ылайык аткаргандыгынызды байкоочулар керуп тургандыгына кезунуз жетсин."},{"t":"p","h":"№5 кырдаал Сиздин жакын досуңуз участкага келип, документтерин үйдө унутуп калгандыгын айтса, эмне кыласыз? Сиз аны абдан жакшы тааныйсыз, ал Сиздин участкада добуш берүүгө укуктуу экендигин анык билесиз."},{"t":"p","h":"Иш-аракеттер:"},{"t":"p","h":"Эгерде Сиздин участкада 500гө жетпеген шайлоочу катталган болсо жана УШКнын дагы бир мүчөсү Сиздин досуңуздун ошол участканын аймагында жашагандыгын тастыктай алса жана шайлоочулардын тизмесинде анын аты-жөнү болсо, анда УШК төрагасынын уруксаты менен ал документсиз эле добуш берсе болот. Эгерде Сиздин участка жайгашкан аймакта шайлоочулардын саны 500дөн ашса, анда Сиздин досуңуз документсиз <span class=\"pg\" data-n=\"152\">152<\/span>добуш берүүгө укугу жок. Сиз ага мыйзамдын иш жүзүндө аткарылышы учун да, добуш берүү процессинин өзү адилеттүү жана калыс өтүп жаткандыгын катышуучулар көрүп турушу үчүн да жооптуу экендигинизди түшүндүрүңүз. Досуңуздун добуш берүүгө укуктуу экендигин өзүңүз анык билсеңиз деле, башка Шайлоочудар жана байкоочулар анын документсиз добуш берип жаткандыгын көргөндө бүтүндөй добуш берүү процессинин акыйкат жана таза өткөндүгүнөн шек санап калышы толук ыктымал."},{"t":"p","h":"Н!. Байкоочулардын, талапкерлердин өкүлдөрүнүн жана ММКнын ролу Байкоочулар, талапкерлердин өкүлдөрү жана ММК шайлоо процессинин ажырагыс бөлүгү болуп саналат, Алар шайлоодогу эн маанилүү функциялардын бирин – жарандардын ишенимин бекемдөө жана шайлоонун адилеттүү, калыс өтүшүнө ынандыруу милдетин аткарышат. Ушундай болгондо, шайлоонун жыйынтыктары жарандардын ыктыярынын туюйлурулушу катары таанылат. Алар чындыгында эле шайлоону даярдоо жана өткөрүү мезгилинде, өлкөнүн “кулагы жана көзү” болот."},{"t":"p","h":"Кимиси ким?"},{"t":"p","h":"Байкоочулар (жергиликтүү, көз каранды эмес байкоочулар, коомчулуктун, БӨУлардын өкүлдөрү) кайсы бир кандидат үчүн иш жүргүзбөйт!"},{"t":"p","h":"Кез каранды эмес эларалык байкоочулар – ар түрдүү эларалык уюмдардын өкүлдөрү."},{"t":"p","h":"Талапкерлердин өкүлдөрү – талапкерлердин ыйгарым өкүлдөрү, ишенимдүү адамдары, конкреттүү талапкердин кызыкчылыгын коргогон байкоочулардын баарында анын статусун күбөлөндүргөн тийиштүү каттар болуш керек,"},{"t":"v","l":["ММК өкүлдөрү. Алардын башкы милдети – шайлоо учурунда ачыктыкты камсыз кылуу.","","1. Участкада болууга ким укуктуу?"]},{"t":"p","h":"Байкоочулар менен ШКнын мүчөлөрү кесиптеш болушат, шайлоонун сапаты алардын кызматташуусунун деңгээлине жараша болот!"},{"t":"p","h":"Ошондуктан алардын өз ара мамилеси коллегиялдуулукта жана өз ара сый-урматка негизделиши керек. ШКнын мүчөлөрүнүн да, байкоочулардын да максаты бир: алар шайлоону Кыргыз Республикасынын мыйзамдарына толугу менен шайкеш келгендей мыкты өткөрүүнү көздөшөт."},{"t":"v","l":["Кимдер байкоочу боло албайт?","Кыргыз Республикасынын Жогорку Кеңешинин депутаттары","Жергиликтүү кеңештердин депутаттары"]},{"t":"p","h":"Мамлекеттик чиновниктер жана жергиликтүү өз алдынча башкаруу органдарынын кызматкерлери Судьялар"},{"t":"v","l":["Шайлоо комиссияларынын мүчөлөрү","* Жашы он сегизге жете электер","","2. Добуш берүү күнүнө чейинки байкоо"]},{"t":"p","h":"Шайлоо процессине байкоо жүргүзүү добуш берүү күнүнөн алда канча мурун эле башталат. Шайлоо кодексинин 17-статьясынын 2-пунктунда бардык деңгээлдердеги комиссиялардын, БШКнын, ОШКнын, РШКнын, УШКнын бардык жыйындарында бардык БӨУлар менен талапкерлердин өкүлдөрүнүн эркин катышуу укугуна кепилдик берилген."},{"t":"p","h":"ШКнын бардык иш-аракеттери жана жыйындары байкоочулар үчүн ачык-айкын өткөрүлүшү керек. Муну камсыздоо – Сиздин мыйзам алдындагы милдетиңиз."},{"t":"p","h":"Эсиңиздерде болсун! Байкоочулар, активдүү болуңуздар. Сиздердин аймакта комиссиялардын жыйындары кайда жана качан болорун так билип алыңыздар. Мүмкүнчүлүк болсо, жыйындардын өткөрүлүшүнүн орду жана убактысы жөнүндө, күн мурунтан кабар берүү үчүн түзүлгөн тизмеге өзүңүздөрдү киргизүүнү талап кылыңыздар."},{"t":"p","h":"Атап айтканда. жергиликтүү көз каранды эмес байкоочулар талапкерлердин шайлоочулар менен жолугушуусуна катышып, мыйзамдуу үгүт жүргүзүү чегинин сакталышына көз салышы керек. Шайлоо кодексинде шайлоо алдында үгүт жүргүзүү эрежелери бекитилген. Сиз мыйзамдын бул бөлүгү бузулбашы үчүн, аны окуп билип алышыңыз керек."},{"t":"p","h":"З. Добуш берүү күнүндөгү байкоо УШКнын мүчөлөрү, байкоочулар жана талапкерлердин өкүлдөрү шайлоонун эң мыкты өткөрүлүшүн камсыздоо үчүн биргелешип иштеши керек. Алар бири бирине душман эмес – тескерисинче, кесиптештер!"},{"t":"p","h":"Эгерде байкоочулар же талапкерлердин өкүлдөрү тартип бузууларды байкап калса, алар адегенде муну УШКнын төрагасына билдирүүгө тийиш. Төрага эч кандай чара көрбөсө же анын көргөн чарасы талапка жооп бербесе гана, Сиз расмий арыз жазышыңыз керек."},{"t":"p","h":"Жергиликтүү байкоочулар жана талапкерлердин өкүлдөрү мыйзам боюнча шайлоо процессинде пайдаланылган бардык имараттарга, алардын ичинен аскер бөлүктөрүндө, госпиталдарда жана санаторийлерде, профилакторийлерде, убактылуу кармоо изоляторлорунда, тергөө изоляторлорунда ж.у.с. жайгашкан бөлмөлөргө да кирип көрүүгө толук <span class=\"pg\" data-n=\"153\">153<\/span>Жергиликтүү байкоочулар жана талапкерлерлин өкүлдөрү аларды байкоо үчүн жиберген уюмдун же талапкердин атынан расмий катты ала жүрүүгө тийиш"},{"t":"v","l":["Ал кат төмөндөгүнү камтыш керек:","атасынын аты (толугу мёиен)","Жашаган жеринин дареги","„ Байкоочу же талапкердин өкүлү жиберилген участканых номуру"]},{"t":"p","h":"УШКнын төрагасы байкоочунун документтерин паспорту менен кошо текзнерүүгө укухгуу. Байкоочу өзүнүн УШКга бара жаткандыгы жөнүндө күн мурунтан КАБАР БЕРБӨӨГӨ ТИЙИШ. ордуна бир күн ичинде башка байкоочу коюлушу мүмкүн."},{"t":"p","h":"Эларалык байкоочулар БШКда аккредитациядан өтүүгө тийиш Талапкердин ишенимдүү адамы же ыйгарымдуу өкүлү тийиштүү ШКдан берилген зтайый катты көрсөтүшү керек. Өз милдеттерин жакшы аткаруу үчүн байкоочулар жана талайкерлердин өкүллөрү төмөндөгү талаптарга жооп берүүгө тийиш:"},{"t":"v","l":["Добуш берүүнүн жол-жоболорун билүү","Добуш берүү күнү бул колдонмону ала жүрүү","Жазуу үчүн калемсап жана кагаз ала жүрүү"]},{"t":"p","h":"Бүтүндөй добуш берүү процессин көрүп туруу үчүн ыңгайлуу жерде отуруу, эгерде баарыв көрүү мүмкүнчүлүгү болбосо, толук байкоо үчүн орун которуп туруу Бир нерсеге шектенип калганда, Шайлоо кодексин кароо. Участкада жалпы колдонуу үчүн жок дегенде бир нускадагы Шайлоо кодекси болушу зарыл."},{"t":"p","h":"Отчеттун формасын өзүңүздүн уюмунуз же талапкериңиз менен макулдашып түзүңүз."},{"t":"p","h":"Өзүңүз бекитилгенден башка участкага барып байкоо жүргүзмөкчү болсонуз, тизмеден чыгуу күбелүгүнүздү алыңыз."},{"t":"p","h":"Добуш берүү күнү абдан узак созулушу мүмкүн. Андыктан ичкенге суу жана тамак ала жүрүңүз."},{"t":"p","h":"Эсиңиздерде болсун! Байкоочулар добуш берүүнүн жашыруундулугун бузбаган шартта добуш берүү имаратынын каалагандай жеринде жайгашууга укуктуу."},{"t":"v","l":["УШКнын жыйындарына катышууга","Шайлоо күнү добуш берүү жүргүзүлө турган жайда болууга","Шайлоочулардын добуш берүүчү жайдан тышкары жерде добуш беришине катышууга"]},{"t":"p","h":"Добуш берүүнү уюштурууга жана анын тартибине, ошондой эле шайлоо берилишине, шайлоочулардын тизмесине киргизилген жарандардын санын, шайлоочуларга берилген шайлоо бюллетендеринин санын эсептөөгө байкоо жүргүзүүгө Маркалоо жана ультрафиолет чырагы менен текшерүү процессине көз салууга Сыяны калемсаптын же карандаштын учуна сүртүп жана ультрафиолет чырагынын жарыгына салып карап текшерүүгө Шайлоочулардын добуштарын эсептөөгө, шайлоо бюллетендеринин мазмунун көрүп турууну камсыз кылгандай аралыкта жана шартта байкоо жүргүзүүгө Добуштарды эсептөө процессин видеого жана фотосүрөткө тартып алууга ‚ Шайлоочулардын добуштарын эсептөөдө толтурулган же толтурулбаган ар кандай шайлоо бюллетени менен таанышууга. Добуш берүүнүн жыйынтыгы жөнүндө протокол жана башка документтердин жазылышына байкоо жүргүзүүгө. Участкалык шайлоо комиссиясынын төрагасына апелляция (даттануу) жасоого, ал жок учурда – анын ордуна иштеген адамга добуш берүүнү уюштуруу маселеси боюнча сунуш жана пикир менен кайрылууга. Добуш берүүнүн жыйынтыгы жөнүндө участкалык шайлоо комиссиясынын протоколу, ошондой эле добуш берүүнүн жыйынтыгы жөнүндө башка шайлоо комиссияларынын протоколу менен таанышууга, алардын көчүрмөлөрүн алууга (же көчүрмөлөп алууга)."},{"t":"p","h":". Участкалык шайлоо комиссиясынын, башка шайлоо комиссияларынын туура эмес иш-аракети же аракетсиздиги тууралуу райондук/шаардык шайлоо комиссиясына, Борбордук шайлоо комиссиясына же сотко мыйзамдуу түрдө арызданууга. Шайлоочулардын добуштарын кайталап эсептөөдө тийиштүү комиссияларга катышууга. Бюллетендерди жана протоколдорду райондук же шаардык комиссияга жеткирүүдө кошо баруу, протоколдордогу маалыматтардын “Шайлоо” мамлекеттик автоматташтырылган системасына кандай киргизилгендигин"},{"t":"raw","h":"<div class=\"gloss\"><p>ктуу. 3 <\/p><\/div>"},{"t":"v","l":["<span class=\"pg\" data-n=\"154\">154<\/span>1. Шайлоочуларга шайлоо бюллетендерин берүүгө","3, Шайлоо бюллетенин алууда шайлоочунун өтүнүчү боюнча ал учун кол коюуга","3. Шайлоочунун шайлоо бюллетенин толтурууга","4. Добуш берүүнүн жашыруундугун бузуучу башка аракеттердин жасоого","5. УШК мүчөлөрүнүн шайлоо бюллетендерин эсептөөсүнө катышууга","6. Шайлоо комиссиясынын ишине тоскоолдук кылуучу иш-аракеттерди жасоого","Шайлоочулардын арасында үгүт ишин жүргүзүүгө","8. Тийиштүү шайлоо комиссиясынын чечим кабыл алышына","Таланкерлерлин үгүттөөчү формасын же үгүттөөнү билдирген башка кийимди кийүүгө,","5. ммк"]},{"t":"p","h":"Массалык маалымат каражаттары шайлоонун канчалык акыйкат жана калыс өткөрүлгөндүгү жөнүндө жарандардын пикирин калыптандыруу жагынан маанилүү роль ойнойт."},{"t":"p","h":"Массалык майлымат каражаттарынын өкүлдөрү ШКнын мүчөлөрү талап кылганда өздөрү иштеген ММК тарабынан берилген кызмат күбөлүктөрүн көрсөтүүгө тийиш. ММК өкүлдөрү шайлоо участкасында добуш берүү күнү эртеден кечке чейинки каалагандай убакытта, бирок УШКнын төрагасы көрсөткөн жерден туруп, видеого жана фотосүрөткө тартууга укуктуу. Алар шайлоочунун бюллетенге белги коюп жаткан учурунан башка, добуш берүүнүн бардык жол-жоболорун ошол жерден туруп тартууга мүмкүнчүлүк алышы керек."},{"t":"p","h":"Журналисттер менен сүйлөшкөндө УШК мүчөлөрү байкоочулар жана талапкерлердин өкүлдөрү талапкерлер жөнүндө түшүндүрмө берүүгө УКУГУ ЖОК."},{"t":"p","h":"ММК өкүлдөрүнүн суроо-талабы боюнча ШК добуш берүү жыйынтыктары жөнүндө протоколдун тастыкталган көчүрмөсүн берүүтө тийиш."},{"t":"p","h":"УШК мүчөсү: төмөндөгүдөй кырдаалдарда эмне кылуу керек?"},{"t":"p","h":"[!айлоочу участкада байкоочунун катышуусуна каршы чыгып, участкадан дароо кетирүүнү талап кылды. Аны кетирбесеңер добуш берүүдөн баш тартам дейт."},{"t":"p","h":"Шайлоочуга мыйзам боюнча байкоочулар участкада болуу укугуна ээ экендигин жана байкоочу мыйзамды бузбаса, Сиз аны участкадан чыгарып жиберүүгө акыңыз жок экендигин түшүндүрүңүз."},{"t":"p","h":"Шайлоочуга ал мыйзам тарабынан камсыздалган жашыруун добуш берүү укугуна ээ экендигин, анын кандайча добуш бергендигин эч ким билбей тургандыгына кепил болоруңузду айтыңыз."},{"t":"v","l":["1\\. УШКнын түзүлүшү","","1. Участкалык шайлоо комиссиясы кандайча түзүлөт?"]},{"t":"p","h":"Участкалык шайлоо комиссиясы добуш берүү күнүнө 30 күн калгандан кечиктирилбей райондук/шаардык комиссия тарабынан бекитилет."},{"t":"p","h":"* Арбир УШК 7ден кем эмес мүчөдөн турат."},{"t":"p","h":"Ар бир саясий партия, коомдук бирикме жана шайлоочулардын чогулушу жергиликтүү кеңешке УШКга өздөрү көрсөткөн мүчөлөрдү дайындоону сунуш кылууга укуктуу. Шайлоо кодексинде кимдер «шайлоочулар чогулушунун» курамына кириши мүмкүн экендиги көрсөтүлгөн эмес, УШКны түзүү боюнча чектөөнүн эки гана түрү болот: УШКнын мүчөлөрүнүн 1/3ден ашпаган бөлүгү саясий партиялардын өкүлдөрүнөн, 1/3ден ашпаган бөлүгү муниципалдык кызматкерлерден турушу мүмкүн. Жарандык коомдун – БӨУлардын, шайлоочулар чогулуштарынын катышуусуна эч кандай чек коюлбайт. Бул эреже, Шайлоо кодексинде белгилентендей, алыскы жана чакан айылдарда колдонулбайт."},{"t":"p","h":"УШКга ар бир саясий партиядан, коомдук бирикмеден жана шайлоочулардын чогулушунан бирден ашпаган өкүл шайланышы мүмкүн."},{"t":"p","h":"УШКга мүчөлүккө талапкерлердин тизмелери, тийиштүү жергиликтүү кеңештин атайын ачык сессиясында жактырылат Саясий партиялардын өкүлдөрү үчүн сессиянын атайын жактыруусу талап кылынбайт. Эгерде саясий партиялардын өкүлдөрүнүн саны үчтөн бирден ашып кетсе, партиялардын өкүлдөрү чүчү кулак кармоо жолжобосуна өтүүгө тийиш. Чүчү кулактын натыйжасында өтпөй калган талапкерлер резервге киргизилет. Участкалык шайлоо комиссиясына кимдер мүчө БОЛО АЛБАЙТ?"},{"t":"p","h":"Кыргыз Республикасынын Жогорку Кеңешинин депутаттары, жергиликтүү кеңештердин депутаттары, мамлекеттик бийликтин жана жергиликтүү өз алдынча башкаруу органдарынын кызмат адамдары, судьялар, талапкерлер, башка шайлоо комиссияларынын ыйгарымдуу өкүлдөрү жана мүчөлөрү, талапкердин жубайы жана жакын туугандары, талапкерге түздөн-түз баш ийген адамдар Жакын туугандар бир шайлоо комиссиясына мүчө болбоого тийиш."},{"t":"h3","h":"УШК мүчөлөрүнүн укуктары жана милдеттери"},{"t":"v","l":["<span class=\"pg\" data-n=\"155\">155<\/span> р","Жарандын_Эсана мамленетти вашпарууаа п УУ – ХХ1пт Жарандын","","УШКнын чогулуштары болоордо күн мурунтан кабарландырылат"]},{"t":"p","h":"Чогулуштарда чыгып сүйлөөгө, УШКнын компетенциясына кирген суроолор боюнча сунуш айтууга, ошол суроолор боюнча добуш берүүнү өткөрүүнү талап кылууга укуктуу УШКнын чогулушунун катышуучуларына күй тартибине ылайык суроолорду берүүгө жана аларга негизи боюунча жооп алууга укуктуу УШКнын каалагандай документтери жана материалдары менен таанкицууга, ал документтердин жана материалдардын (шайлоочулардын тизмеси менен бюллетендердеи тышкары) көчүрмөлөрүн алууга, бул көчүрмөлөрдү тастыктоону талап кылууга укуктуу УШКнын туура эмес иш-аракеттери жана аракетсиздиги боюнча райондук/шаардык ‹иайлоо комиссиясына же сотко кайрылууга укуктуу."},{"t":"p","h":"КЕҢЕШ БЕРҮҮЧҮ ДОБУШКА УКУКТУУ УШКнын МҮЧӨЛӨРҮНҮН ЫЙГАРЫМДАРЫ Ар бир катталган талапкер аны каттоодон өткөргөн райондук/шаардык шайлоо ошондой эле УШКга кеңеш берүүчү добушка укуктуу бирден мүчө дайындоого укугу бар."},{"t":"p","h":"Шайлоо комиссиясынын кеңеш берүүчү добушка укуктуу мүчөлөрү шайлоону даярдоо жана өткөрүү маселелери боюнча добуш берүүгө толук укуктуу башка мүчөлөр менен тең укукка ээ. Алар ТӨМӨНДӨГҮДӨЙ укуктардан ажыратылат:"},{"t":"v","l":["УШКнын төрагасы жана катчысы болуп шайлануу","Шайлоо бюллетендерин жана тизмеден чыгуу күбөлүктөрүн берүү жана кол коюу","Шайлоо бюллетендерин сорттоого, жокко чыгарууга жана добуштарды эсептөөгө катыпуу"]},{"t":"p","h":"Добуш берүүнүн натыйжалары жана шайлоонун иатыйжалзры жөнүндө протоколду түзүү жана кол коюу УШКнын чогулуштарында добуш берүүгө катышуу жана шайлоо комиссиясынын чечимдерине кол коюу,"},{"t":"h3","h":"УШКнын БАРДЫК МҮЧӨЛӨРҮНҮН МИЛДЕТТЕРИ"},{"t":"p","h":"Шайлоо жөнүндөгү кодексте жана БШКнын башка регламенттөөчү документтеринде көрсөтүлгөн бардык жол-жоболорду, ошондой эле Кыргыз Республикасынын башка мыйзамдарын сактоо"},{"t":"v","l":["Өз милдеттерин адептүүлүк менен аткаруу","УШКнын мүчөлөрүн окутуу боюнча тренингдерге жана башка иш-чараларга катышуу","Шайлоочуларга жакшы мамиле жасап, жагымдуу чөйрөнү түзүү","Эч качан талапкерлердин кайсы бирин жактап сүйлөбөө","Бардык шайлоочуларга бирдей жакшы мамиле жасап, урмат-сый көрсөтүү","Саясий маселелерди шайлоо участкасына ТАЛКУУЛАБОО"]},{"t":"p","h":"Талапкерлерди айырмалоочу белгилерди тагынбоо, үгүт чакырыгын билдирген униформаны кийбөө, үгүт материалдарын, башка форма алып жүрбөө"},{"t":"v","l":["Этикалык кодексти сыйлоо (ушул колдонмонун экинчи бөлүгүн караңыз).","УШКнын милдеттери"]},{"t":"p","h":"УШКнын мүчөлөрүнөн шайлоого чейинки иш-чаралардын басымдуу бөлүгүн жана шайлоо күнүндөгү милдеттерди так аткаруу талап кылынат."},{"t":"p","h":"Шайлоо күнү УШК мүчөлөрү шайлоо участкасында узак иштешет (таңкы 7ден баштап добуш берүү күнүндөгү бардык зарыл иш-чаралар аткарылып бүткөнгө чейин)"},{"t":"v","l":["Бул күнгө алдын ала даярданыңыз!","Керек болушу ыктымал болгон дарыларыңызды ала жүрүңүз","Тамак-ашыңызды алыңыз, бирок жумуш ордунузда тамактанбаңыз."]},{"t":"p","h":"Эсиңизде болсун! Шайлоо күнү комиссия төрагасынан уруксат алып Сиз өзүңүздүн жумуш ордуңуздан кыска убакытка кетсеңиз болот. Бул учурда Сиздин ордуңузда комиссиянын башка мүчөсү иштөөгө тийиш."},{"t":"p","h":"4. УШКнын биринчи жыйыны"},{"t":"v","l":["УШКнын биринчи жыйыны ал бекитилгенден үч күндөн кечиктирилбей өткөрүлөт.","УШКнын белгиленген курамынын үчтөн эки бөлүгү түзүлсө, ал ишин баштай берсе болот.","УШКнын чогулушун белгиленген курамынын санынын көпчүлүгү чогулганда өткөрүүгө болот"]},{"t":"p","h":"УШКнын биринчи чогулушун өткөрүү датасы, убактысы жана орду райондук/шаардык комиссия тарабынан белгиленет. Төрага жана катчы шайланганга чейин чогулушту комиссиянын жашы эң улуу мүчөсү ачат жана алып барат."},{"t":"p","h":"Төрага жана катчы биринчи чогулушта шайланат. Бул шайлоо УШКнын чечими боюнча жашыруун же ачык өткөрүлүшү мүмкүн."},{"t":"p","h":"Комиссия мүчөлөрүнүн күбөлүктөрүн райондук/шаардык шайлоо комиссиясы кол коюп, ташшырат, УШК мүчөлөрү шайлоого даярдануу боюнча иш-чараларды аткаруу графигин иштеп чыгып, милдеттерди бөлүштүрүп алышат."},{"t":"raw","h":"<div class=\"gloss\"><p>ы <\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"156\">156<\/span>М. УШКнын добуш берүү күнүнө чейинки милдеттери 1. Шайлоочулардын тизмелери Шайлоочулардын тизмелери добуш берүүгө 19 күн калгандан кечиктирбей, 2005-жылдын 21-июнуна чейин УШКга жеткирилет."},{"t":"p","h":"Бул эреженин ооруканаларга, госпиталдарга, санаторийлерге, жетүү кыйын жана алыскы райондордогу жарандардын убактылуу боло турган башка жерлерине, тергөө изоляторлоруна, убактылуу кармоо жайларына, аскер бөлүктөрүнө, Кыргыз Республикасынын чет мамлекеттердеги өкүлчүлүктөрүнө тиешеси жок. Бул жерлердеги жарандардын тизмелери добуш берүүтө 5 күн калганга чейин жеткирилет."},{"t":"p","h":"УШКнын мүчөлөрүнүн милдети – УШКнын аймагында жашаган жарандарга шайлоочулардын тизмелер менең таанышууга укуктуу экендиги, зарыл болгон учурларда тизмеге тийиштүү өзгөртүүлөрдү жана толуктоолорду киргизүү женүндө, паспортундагы катталышынын негизинде шайлоочуларды тизмеге кошууну сунуш кылуу укугуна ээ экендиги жөнүндө маалымат таратуу."},{"t":"p","h":"Эсиңизде болсун! Бул ирет шайлоочулардын тизмелери участкаларда жалпыга тааныштыруу үчүн даярдалган такталарга илинет. Такталар бардык шайлоочулар окуп көрүшү үчүн ыңгайлуу жайгаштырылышы керек."},{"t":"p","h":"2. Шайлоочулардын фамилияларын толуктоо же тизмеге өзгөртүүлөрдү киргизүү"},{"t":"p","h":"Шайлоочу өзүнүн аты тизмеге киргизилбей же туура эмес жазылып калгандыгы жөнүндө УШКга, зарыл болсо жогору турган шайлоо комиссиясына билдирүү укугуна ээ."},{"t":"p","h":"24 сааттын ичинде (ал эми шайлоо күнү арыз бергенден кийин 2 сааттын ичинде) участкалык же райондук/ шаардык шайлоо комиссиясы арызды жана ага тиркелген документтерди караштырууга тийиш."},{"t":"p","h":"Эгерде шайлоочу ошол аймакта катталгандыгын паспорту менен далилдесе, УШКнын мүчөлөрү аны кошумча тизмеге киргизүүгө тийиш."},{"t":"p","h":"Шайлоо комиссиясы же катаны оңдоого, же эмне үчүн арыз берүүчүнүн арызы четке кагылгандыгын жазуу түрүндө түшүндүргөн жоопту берүүгө тийиш."},{"t":"p","h":"Эгерде каталар оңдолсо, бардык өзгөртүүлөр жана кошумчалар шайлоо тизмесинин тийиштүү мамычасына тыкан түрдө жазылып, ага УШКнын төрагасы менен катчысынын колу коюлуп, УШКнын мөөрү менен бекитилиши керек."},{"t":"p","h":"Участкалык, райондук/таардык шайлоо комиссияларынын чечимдери боюнча жогору турган шайлоо комиссиясына же сотко (участкалык, райондук/шаардык шайлоо комиссияларынын жайгашкан жерлери боюнча) кайрылып даттанууга болот. Мындай даттануулар 3 күндүн ичинде каралууга тийиш, ал эми шайлоо күнү даттануу (апелляция) дароо каралышы керек."},{"t":"p","h":"3. Шайлоо тизмесинен ысымды чыгарып салуу Жарандын аты жана фамилиясы, шайлоочулардын мамлекеттик каттоодон өткөрүүгө жооптуу мамлекеттик уюмдан алынган маалыматтын (мисалы, каза болгондугу жөнүндө күбөлүктүн) негизинде ГАНА шайлоочулардын тизмесинен. чыгарылышы мүмкүн."},{"t":"p","h":"Эгерде жарандын аты жана фамилиясы шайлоочулардын тизмесинен чыгарылса, анда мунун датасын жана себебин көрсөтүү керек."},{"t":"p","h":"Тизмеден «чыгарып салууга» УШКнын төрагасы же райондукЛшаардык шайлоо комиссиясынын төрагасы кол коюшу керек."},{"t":"p","h":"Райондук/шаардык, борбордук шайлоо комиссияларына же сотко апелляция берсе болот. Апелляция 3 күн ичинде, ал эми шайлоо күнү дароо каралышы керек."},{"t":"p","h":"4. «Тизмеден чыгуу күбөлүгүнүн негизинде добуш берүү»"},{"t":"p","h":"күнү өзүнүн шайлоо участкасына келе албаган шайлоочу башка участкада добуш берүүгө укуктуу. Бул ал тизмеден чыгуу күбөлүгүн алууга тийиш."},{"t":"p","h":"Шайлоочулар тизмеден чыгуу күбөлүгүн жергиликтүү шайлоо участкасынан шайлоо күнүнө 11 күндөн 1 калганга чейин 2005-жылдын 25-июнунан 9-июлуна чейин алса болот. Алар өздөрү бекитилген УШКга округдун аймагындагы кайсы жерде добуш бермекчи экендигин кабарлоого тийиш. Мындайда шайлоочу өз тизмеден чыгарылат."},{"t":"p","h":"Көңүл буруңуз! Эгерде шайлоочу тизмеден чыгуу күбөлүгүн жоготуп койгон болсо, ага башка күбөлүк берилбейт."},{"t":"p","h":"Эсиңизде болсун! Президенттик шайлоодо бүткүл өлкө бир округ болот. Ошондуктан шайлоочулар тизмеден чыгуу күбөлүгү менен каалагандай участкада добуш берүүгө укуктуу."},{"t":"p","h":"5. Шайлоо участкасынан тышкары жерде добуш берүү тууралуу арыздарды каттоо Шайлоо күнү ооруп калганына же майыптыгына байланыштуу шайлоо участкасына келе албай турган шайлоочулар мыйзам боюнча үйүндө эле добуш берүүгө укуктуу, Мындай шайлоочулар УШК түзүлгөн мезгилден тартып шайло күнүнө чейин, бирок шайлоо күнү добуш берүү аяктаганына 6 саат калгандан кечиктирбей арыз жазууга же оозеки <span class=\"pg\" data-n=\"157\">157<\/span>—Жарандын Жана мамлекепити вашкорууаз катышуу КХ1 тызыядын Жарандык – силердин роаунар кайрылууга ти йиш. (Шайлоо участкасынан тышкары жерде 5 жерде добуш берүүгө тиешелүү УШКнын милдеттери жөнүндө м ер ›лугураак маалымат алуу үчүн Шайлоо жөнүндөгү кодекстин 42-стат ъясын караныз) „ Шайлоо участкасынан тышкары жерде добуш берүү өтүнү зү шайлоочунун аты мүмкүн, бирок ал участкага эмне үчүн келе албай тургаядыгывын себебин көрсөтүүгө тийиш Бул жөнүндө УШК түзүлгөндөн кийинки каалаган маалда, бирок, шайлоо жүнү добуш берүү күнү аяктагзига 6 саат калгандан кечиктирбей оозеки арыз менен кайрылууга болот. Шайлоозуга бюллетень берүү алдында оозеки түрдө кайрылган болсо, ал добуш берүүгө катышуу арызын имараттын сыртында жазууга тийиш Оозеки өтүнүч менен участкага кайрылгандан кийиң өтүнүчтү уккан комиссия мүчөсү өтүнүч түшкөн убакытты атайын реестрге жазып, өз колун коюуга тийиш 6. Участканын имаратында көрнөктүн жана маалымат тактасынын коюлушу Шайлоо участкасы жайгашкан имараттын сыртына участканын номуру жазылган көрнөк орнотулууга тийиш. участкага барчу жол жебелер менен көрсөтүлүшү керек {Шайлоо волекси, 37-статья)"},{"t":"v","l":["Добуш берүү имаратынын ичинде төмөндөгүлөрдү камтыган маалымат тактасы орнотулушу керек:","Шайлоону даярдоо жана өткөрүү боюнча негизги иш-чаралардый календары","УШК мүчөлөрүнүн телефондору жана даректери көрсөтүлгөн тизме","Жогору турган шайлоо комиссиясынын дареги жана телефондору"]},{"t":"p","h":"Шайлоо документтеринин, айрыкча туура толтуру. лган. оирок талапкерлердин аттары көрсөтүлбөгөн бюллетендин үлгүлөрү Маалымат тактасында үгүт материалдары болбоого тийиш."},{"t":"p","h":"Мындан тышкары УШК офисинде «Маалымат бурчу» илинип, айда шайлоону ждите салуучу ар түрдүү документтер, ошондой эле жогору турган шайлоо комиссиясынан алынган маалымат, жарандардын даттануулары жана арыздары боюнча кабыл алынган чечимдер ж.у.с. болушу керек."},{"t":"p","h":"“Маалымат тактасында” жайгашкан билдирүүлөр үгүт мүнөзүндө жана талапкерлерге жан тарткан мааниде болбоого тийиш."},{"t":"p","h":"Байкоочулар жана талапкерлердин өкүлдөрү эркин колдонушу үчүн Кодекстин бир нускасы участкада болушу"},{"t":"p","h":"Шайлоо бюллетендерин алуу, кайра санап чыгуу жана УШКнын мөөрүн коюу Бюллетендер УШКнын төрагасына жана катчысына, жогору турган шайлоо комиссиясынын имаратында добуш берүүгө бир-эки күн калганда берилет да, жогору турган шайлоо комиссиясынын мүчөлөрүнүн жарымынан кем эмес бөлүгүнүн катышуусунда кайра эсептелет. Мында талапкерлердин өкүлдөрү жана жогору турган ШКнын мүчөлөрү катышууга укуктуу."},{"t":"p","h":"Бюллетендерди жогору турган ШКдан алгандан кийин УШКнын төрагасы жана катчысы милиционердин коштоосунда УШКнын имаратына алып келет. Ал жерде бюллетендер кайра эсептелип, УШКнын мөөрү басылат."},{"t":"p","h":"Төрага УШКнын мүчөлөрүнүн жана кеңеш берүүчү добушка укуктуу мүчөлөрүнүн жарымынан кем эмес бөлүгүнүн катышуусунда бюллетендин тийиштүү жерине мөөр коёт."},{"t":"p","h":"Ар бир УШКга берилген шайлоо бюллетендеринин саны шайлоо тизмесиндеги шайлоочулардын санынан 0,5 %дан ашпоого тийиш."},{"t":"p","h":"Шайлоо бюллетендери жана УШКнын мөөрү салынган сейфи жайгашкан имарат печеттелип, ички иштер органдарынын сактоосуна өткөрүп берилет."},{"t":"p","h":"8. Мөөнөтүнөн мурда добуш берүү Шайлоо күнү Кыргыз Республикасынын чегинен тышкары жерлерде боло турган шайлоочулар добуш берүү күнүнө чейин эле райондук/шаардык шайлоо комиссиясында добуш берүүгө укуктуу. Бул шайлоочулар тийиштүү документтерди (командировка жөнүндөгү документти, авиабилетти жана паспорттогу визаны) тийиштүү шайлоо комиссиясына добуш берүү күнүнө 9 күндөн 1 күн калганга чейин көрсөтүүгө тийиш. Конверттерге салынган мөөнөтүнөн мурда добуш бергендердин бюллетендери шайлоо күнүнө 1-2 күн калганга чейин УШКга өткөрүлүп берилет. (Мөөнөтүнөн мурда добуш берүүчүлөргө карата УШКнын милдеттери жөнүндө толугураак маалымат алуу үчүн Шайлоо жөнүндө кодексинин 41-статьясын караңыз)."},{"t":"p","h":"Эсиңизде болсун! УШКнын имаратында мөөнөтүнөн мурда добуш берүү жүргүзүлбөйт."},{"t":"p","h":"<span class=\"pg\" data-n=\"158\">158<\/span>УШЕ"},{"t":"p","h":"бы"},{"t":"h3","h":"ИШ-ЧАРАЛАР ГРАФИГИНИН ҮЛГҮСҮ"},{"t":"p","h":" 14-июндан баштан"},{"t":"p","h":"Талапкерзердин үгүт кампаниясы байтталат (ал добуш берүүнүн башталышына 24 саат калганда токтотулат)"},{"t":"p","h":"ІШайлоочулапдын тизмесин алуу 11-аюялан баштап ай лоочуларлын тизмелери шайлоо участкаларында илинет. Шайлоочулар жөнүндөгү маалымат такталат, кошумча гизмелер түзүлөт. (Добуш берүү күнү саат 18:00гө чейин улантылат)"},{"t":"v","l":["чейин","Жогору турган ИЙКдая тизмеден чыгуу күбөлүктөрү алынат","®-нюлга чейин","Тизмеден чыгуу күбөлүктөрүн берүү"," 2-июлга чейин","н ыы добуш берүүнүн орду жана убактысы жөнүндө маалыматты таратуу","","Шайлоо бюллетендерин алуу, кайра саноо жана штамп коюу."," 9-аюлав","Үгүт кампаниясын токтотуу","То-нзюль + Дойуш берүү күнү","Саат ОХ Обден 20.00гө чейин","‚ Добуш берүү күнүнөп кийинки 10 күн"," Такталган тизмени жогору турган комиссияга өткөрүп берүү.","","УШКнын мүчөлөрү: Эмне кылуу керек?"]},{"t":"p","h":"ІНайлоочу добуш берүү күнүнө чейин, ошол УШКнын аймагында жашаганына карабастан, тизмеде жок экендигин билдирди» УШК мүчөсү шайлоочунун паспортун жана анын жашаган жери боюнча катталган штампты текшерет."},{"t":"p","h":"* Эгерде шайлоочу УШКнын аймагында катталган болсо, анын аты кошумча добуш берүү тизмесине киргизилиши керек."},{"t":"p","h":"УШКнын төрагасы тизмеге киргизилген маалыматты, кол коюу жана УШКнын мөөрүн басуу менен тастыктоого тийиш. Киргизилген маалыматты комиссиянын катчысы жана кеңеш берүү добушу бар экиден кем эмес мүчөсү тастыкташы керек. Эгерде андай мүчөлөр жок болсо, байкоочулар жана талапкерлердин өкүлдөрү да тастыктаса болот."},{"t":"p","h":"Эгерде шайлоочунун тизмеге кирүү жөнүндөгү өтүнүчү канааттандырылбаса, ал райондук/шаардык комнссияга кайрылууга укуктуу. Бул боюнча чечим 3 күндүн ичинде, ал эми добуш берүү күнү дароо эле кабыл алынышы керек."},{"t":"p","h":"* Өтүнүчтү четке кагуу жазуу жүзүндө түзүлөт, бул боюнча шайлоочу жогору турган комиссияга даттанса болот,"},{"t":"p","h":"М. Добуш берүү күнү 1. Добуш берүү жайын уюштуруу Добуш берүү жайы шайлоочунун тоскоолдуксуз кирип-чыгышына ыңгайлуу болгондой уюштурулушу керек. Эгерде бөлмөнүн эки эшиги бар болсо, бири кирүү үчүн, экинчиси чыгуу үчүн колдонулушу керек."},{"t":"p","h":"Шайлоочулардын маркалоодон өткөндүгүн текшерүүнү сөзсүз түрдө добуш берүү жайына кире бериш жерде жүргүзүү керек, Байкоочулар жана талапкерлердин өкүлдөрү маркалоо процессин көрүп тургандай аралыкта орун алууга тийиш. Добуш берүү сандыгы бөлмөнүн ортосуна орнотулуп, жалпыга көрүнүп турууга тийиш, Уч тарабы тосулган добуш берүү кабинасынын арт жагы мүмкүнчүлүккө жараша дубал жакка келиш керек, Ошондо байкоочулар же комиссия мүчөлөрү шайлоочунун бюллетень толтуруп жатканын көрүп турушат, Бирок алар шайлоочунун ким үчүн добуш бергенин көрө албайт, Комиссиянын тизмелер үчүн жооптуу мүчөсү кире беришке мүмкүн болушунча жакын жайгашып, ал эми бюллетень берүүгө жана маркалоого жооптуу мүчөсү анын жанында отурушу керек. УШКнын төрагасы байкоочулардын көз алдында болууга тийиш. Бирок эсиңизде болсун: байкоочулар добуш берүүнүн жашыруундугун бузбагыдай аралыкта, участканын каалагандай жеринде жайгашса болот!"},{"t":"p","h":"Добуш берүү процедурасы кандай жүрүп жаткандыгын, шайлоочу кандай документтерди көрсөткөндүгүн көрүү учун жакындан байкоо салуу – байкоочулардын негизги милдети, Эгерде үгүт материалдары (мисалы, плакаттар) добуш берүү бөлмөсүндө илинген болсо, аларды добуш берүү башталганга чейин алып коюу керек,"},{"t":"p","h":"<span class=\"pg\" data-n=\"159\">159<\/span>Добуш берүү күү"},{"t":"raw","h":"<h4 class=\"mk\">у Өзүнүз аткарган «Эртең мененки текшерүү<\/h4>"},{"t":"v","l":["тунсуйла ы чтёзкакуп бези бололу. Тымавлету","“йөр козлери","С Досум берүү бөлмөсүндөгү жана үгүз &lt;алуз","С Милялеттерди бөлүштүрүү бонча чүзүкүлнк жүргүзүү","{0 Сейфти ачып, мөөр мейеёнң бирауту","0 Досум берүү еайдыктары бой экеңдикян кз","О УШКнын мүчөлөрү жана бардык","сандыктарга салуу","(3 Негизги жана кошумча тизмеге","[® Бардык каалоочуларга","ш Комисенянын шайлоочулар тизмесине жонуу","м. Аларга мөөр басуу","‹ лый","керин за чойлуруу үязмелерди берүү","ЫЫ Жогору турган комиссиядан алынган бюзллетещдердин аларым","муун","колдонулган бюллетендердин да санын","(3 Алынган бюллетендерди кайра саноо","О Алынган бюллетендердин санына түнөн мурун добуш берүүле","КОШУП, протоколдун жана аңын чоңойтулган","(С Бюллетендерди берүү жана үчүн жосятуу мүчөлөрү, келг тъ","$0дан бюллетень","@ Бюллетендерди берүү җана маркалоо үчүн жоситуузар:","@ Бюллетендерди берүү жана маркалоо үчүн жоонтуулар бардыё&amp;","текшерет.","үзүн бири и","Я","алын","үө сыйным"]},{"t":"p","h":"@ Төрага жогору турган ШКдан алынган чыгуу күбөлүктөрүнүн санын калга эчак санап чыгат. Калоочулардын баары шайлоочулардын тизмесинде тізмёзөн чыз уу күбөлүк өрү жөнүндө эскертүү жазылгандыгын текшерийн көрэ ала Жогору турган комиссиядан алынып, шайлоочуларга берилген тизмелей чыгуу кубе ктөрүнүн саны протоколго (15-15а – саптарына) жана анын чоңойтулган формасына жазы зат"},{"t":"v","l":["@ УШКнын төрагасы мөөнөтүнөн мурун добуш бергенлердин сайын жарыалай,","конверттин бүтүн экендигин жана добуш берген аламдый аты-жөнүн көрсөтөт"]},{"t":"p","h":"(С Шайлоочулардын саны протоколго жана анын чонойтузтан формосыма. жазылат @Ш УШК төрагасы конверттерди ачып, добуш берүүнүн жашыруундугун бузбаган, бүтөлгөн бизллезтен добуш берүү сандыгына салат."},{"t":"h3","h":"ДОБУШ БЕРҮҮ ЖАЙЫ ШАЙЛООЧУЛАР ҮЧҮН СААТ ТУУРА 8:00де АЧЫЛАТ"},{"t":"p","h":"Эсинизде болсун! Протоколдогу жана анын чоңойтулган формасындагы 2, 3, 15, 15а – саптар участка ачылганга чейин толтурулушу керек!"},{"t":"v","l":["Байкоочулар жана талапкерлердин өкүлдөрү үчүн:","","Негизги жана кошумча тизмелерге киргизилген шайлоочулардын саны:","Алынган бюллетендердин саны:","Мөөнөтүнөн мурун добуш бергендердин саны:","Участканы ачуу убактысы:","","Сиздин эскертуунуз","","– м","","-","-"]},{"t":"raw","h":"<div class=\"gloss\"><p> -3 <\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"160\">160<\/span>2. «Эртең мененки текшерүү барагы»"},{"t":"p","h":"Бул «Текшерүү барагын» шайлоо күнү эртең менен участка ачылганга чейинки жол-жоболордун тууралыгына көз салуунун эң жөнөкөй ыкмасы катары колдонуңуз."},{"t":"p","h":"Байкоочулар добуш берүүнүн бардык жол-жоболорун көрүп турууга тийиштүү болгондуктан, алар УШК мучеле рү сыяктуу эле участкага саат 07:00 ден кечикпей КЕЛИШИ КЕРЕК."},{"t":"p","h":"Эсинизде болсун! Байкоочулар жана талапкерлердин өкүлдөрү участканын ачылыш жол-жоболорунун баарыңа катышууга тийиш."},{"t":"v","l":["А. Милдеттердин бөлүштүрүлүшү","Комиссия мүчөлөрү төмөндөгү милдеттерди аткаруу боюнча чүчү кулак кармайт:","* Маркалоону текшерүү үчүн жооптуулар","ИП |айлоочуларлын тизмеси учун жооптуулар (шайлоочулар тизмесине жарандарды каттоо жүргүзөт)"]},{"t":"p","h":"Шайлоо бюллетендерин берүү жана маркалоо үчүн жооптуулар (бюллетендерди шайлоочуларга берүү жана шайлоочуларды маркалоо) Жашыруу н үчүн жана шайлоо бюллетендерди добуш берүү сандыктарына салууга көзөмөл салуучулар Имараттан тышкары жерде добуш берүү учун жооптуулар. (Имараттан тышкары Е Уш серууну УШКнын 2ден кем эмес мүчөлөрүнүн катышуусу менен реестрде катталган шайлоочулардын добуш берүүсүн Уюштуруу), Төрага жана катчы чүчү кулак кармоого катышпайт."},{"t":"p","h":"Б. Дөбуш берүү сандыгын даярдоо УШК төрагасы добуш берүү үчүн бош сандыктарды карап чыгууда ар бир катышуучуга көрсөтүшү керек, Көзөмөлдөө барагы ар бир добуш берүү сандыгына салынышы керек. Көзөмөлдөө барагында шайлоо округунуң аталышы, шайлоо участкасынын номуру, көзөмөлдөө барагы сандыкка салынган убакыт, бардык Катышкандардын {УШК мүчөлөрүнүн, талапкерлердин, алардын өкүлдөрүнүн жана байкоочулардын) фамилиялары болууга тийиш"},{"t":"v","l":["Көзөмөлдөө барагына жогоруда аталган адамдардын бардыгы кол коюшу керек.","Көзөмөлдөө барагына мөөр басылгандан кийин добуш берүү сандыгына салынышы керек.","В. Шайлоочулардын тизмесин даярдоо"]},{"t":"p","h":"Герата бардык катышуучуларды мөөр менен бекитилген сейф жана участкадагы шайлоочулардын тизмелери, расмий шайлоо бюллетендери, ошондой эле УШКнын мөөрү салынган таңгак кандай ачылып жаткандыгың көрүп турууга чакырат."},{"t":"v","l":["Терага шайлоочулардын тизмелерине киргизилген шайлоочулардын санын жарыялоого тийиш.","Төрага шайлоочулардын тизмелерин көрүүгө бардык катышуучуларга уруксат бериши керек.","Төрага шайлоочулардын тизмелерин алар үчүн жооптуу кызматкер(лер)ге өткөрүп берет."]},{"t":"p","h":"Чоң шайлоо участкаларында шайлоочулардын тизмелери үчүн бир нече кызматкер жооптуу болушу мүмкүн, Терага тизмелерди алфавиттик тартипте бирдей бөлүштүрөт. Шайлоочулардын тизмелерине жооптуу ар бир кызматкер өздөрү колдонуп иштей турган тамгаларды даярдап, аларды көрүнөө жерге жайгаштырууга тийиш. Г. Кадимки шайлоо бюллетендерин эсепке алуу Терага райондук/шаардык шайлоо комиссиясынан алынган расмий шайлоо бюллетендеринин санын жарыялайт, Комиссиянын мүчөлөрү шайлоо бюллетендерин санап чыгып, алардын санын жарыялайт жана ага мөөнөтүнөн мурда добуш бергендердин санын кошуп, шайлоонун натыйжалары жөнүндөгү протоколдун жана анын чонойтулган формасынын экинчи сабына жазып коет."},{"t":"p","h":"Төрага шайлоо бюллетендери үчүн жооптуу ар бир кызматкерге 50дөн-100дөн шайлоо бюллетенин бөлүп берет."},{"t":"p","h":"Шайлоо бюллетендери үчүн жооптуу кызматкерлер аларды алгандыгын жана өздөрү алган сандагы шайлоо бюллетендери үчүн жекече жооптуу экендигин тастыктап кол коюшат."},{"t":"p","h":"Шайлоо бюллетендери үчүн жооптуу ар бир кызматкер бирден бөтөлкө сыя алат."},{"t":"p","h":"Сыя алган комиссия мүчөлөрү ультрафиолет чырагынын жарыгында көрүнөөрүн текшерүү үчүн сыяны калемсапка же карандашка сүртүп көрөт."},{"t":"p","h":"Д. Мөөнөтүнөн мурда добуш берүү бюллетендерин эсепке алуу Участкалык шайлоо комиссиясынын төрагасы мөөнөтүнөн мурда добуш берген шайлоочулардын санын жарыялайт."},{"t":"p","h":"Участкалык комиссиянын төрагасы шайлоо бюллетендери салынып чапталган конверттерди, ошондой эле мөөнөтүнөн мурда добуш берген шайлоочулардын тизмесин катышып тургандардын баарына көрсөтөт. Участкалык шайлоо комиссиясынын төрагасы шайлоочунун тандоосунун жашыруундугун сактоо менен конверттерди биринен кийин экинчисин ачып, шайлоо бюллетендерин добуш берүү сандыгына сала берет, Мөөнөтүнөн мурла добуш берген шайлоочулардын саны протоколдо жана анын чоңойтулган формасында белгиленет."},{"t":"h3","h":"Е. Участка саат туура 08.00дө ачылышы керек!"},{"t":"p","h":"<span class=\"pg\" data-n=\"161\">161<\/span>иларууёа патышуу – ХК1 тылыядын жаранцым поожунаагы розунар эсиңизде болсун! УШКнын тизмедеги курамынын кеминде үчтөн эки бөлүгү участкада катышууга тийиш. добуш берүү саат туура 08.00дө башталышы керек! УШКнын мү чөлөрү өздөрүнүн участкасыйла добуш беришет де алар башка участкада катталган болсо, ал ж ерден тизмеден чыгуу күбөлүгүн алууга тийиш. УШКяыи төрагасы Жа мүчөлөрүнө шайлоочулар добуш берүүгө тос коол болбогон мезгилде добуш берүүнү сунуш кылат, добуш берүү күнү шайлоочуну кошумча тизмеге киргизүүгө болобу? Ооба, шайлоочу төмөнкүдөй шартта кошумча ге киргизе зилиши мүмкүн,"},{"t":"v","l":["Шайлоочу паспортундагы ошол аймакта катталгандыгы жөнүндөгү белгини көрсөтөт ЖЕ","Шайлоочу тизмеден чыгуу күбөлүгүн көрсөтөт"]},{"t":"p","h":". Шайлоочу жөнүндөгү маалымат кошумча тизмеге киргизилеү да төраганын жана катчынын колу, УШЖКиын мөөрү менен тастыкталат."},{"t":"v","l":["„ тизмеден чыгуу күбөлүгү шайлоочудан ал ынып, У{Кда калтырылат","кет Добуш берүүдөгү 6 жөнөкөй кадам:"]},{"t":"p","h":"|1. Добуш берүү бөлмөсүнө кире бериште маркалоону текшерүүгө жооптуу комиссия мүчөсү пшайлоочунун бармагында көрүнбөс сыянын бар же жок экендигин текшерет Эгерде шайлоочулардын тизмеси үчүн жооптуу мүчөлөр бош бөлсө, маркалоо үчүн жооптуу комиссия мүчөсү шайлоочуну добуш бөлмөсүнө киргизет, Шайлоочу тизме үчүн жооптуу комиссия мүчөсүнө өздүк күбөлүгүн көрсөтөт, ал шайлоочунун аты-жөнүн тизмеден табат. Шайлоочу маркалоодон өтөт {анын бармагына керунбас сыяны бюллетень берүү үчүн жооптуу комиссия мүчөсү сүртөт), анан тизмеге кол коет Шайлоочу бюллетень берүүгө жооптуу комиссия мүчөсүнөн бюллетень алат. Бюллетень берүүгө жооптуу комиссия мүчөсү бюллетенге УШКнын мөөрү коюлгандыгын дагы бир ирет текшерет"},{"t":"v","l":["5. Шайлоочу добуш берүү кабинасына барып, бюллетенди толтуруп, төрт бүктөйт","Шайлоочу бюллетенди добуш берүү сандыгына салат да, участкадан чыгып кетет","","3. Шайлоо күнү добуш берүү бөлмөсүндө кимдер болууга укуктуу?"]},{"t":"p","h":"участкадагы ишти бир калыпта калыс уюштуруу жана ар кандай кийлигишүүлөргө жол бербөө үчүн участкада жарандардын белгилүү категориясы гана болушу зарыл."},{"t":"v","l":["төмөндөгү адамдар участкада добуш берүү күнү башталгандан бүткөнгө чейин боло алат:","Шайлоочулар","Участкалык шайлоо комиссиясынын мүчөлөрү","Жогору турган комиссиянын мүчөлөрү","Талапкерлер"]},{"t":"p","h":"Талапкерлердин өкүлдөрү. (Бир участкада ар бир талапкердин бирден ашпаган өкүлү болушу керек). Жергиликтүү жана эларалык байкоочулар. Участкада бир уюмдун атынан бирдей убакытта бир жергиликтүү байкоочу жана эки эларалык байкоочу (жана котормочу) болушу мүмкүн."},{"t":"p","h":"‚ ММК екулдеру Эсиңизде болсун! Тартип сактоо органдарынын өкүлдөрү (милиционерлер) добуш берүү бөлмөсүндө болбошу керек. Алар УШКнын төрагасынын коомдук тартипти жөнгө салуу үчүн чакыруусу боюнча гана участкага кириши мүмкүн. Бирок тартип жөнгө салынгандан кийин алар добуш берүү бөлмөсүнөн дароо чыгып кетиши керек. Шайлоо күнү участкада көрсөтүү үчүн уруксат берилген өздүк документтер 1. Паспорт Эгерде паспортунун колдонуу мөөнөтү бүткөн шайлоочу жаңы паспорт ала элек болсо, ал жарандыгын тастыктаган күбөлүк менен добуш берсе болот (бул тизменин 4-пунктун караңыз) Эгерде шайлоочу шайлоочулардын негизги тизмесине киргизилген болсо, ал төмөндө көрсөтүлгөн документтер менен добуш бере алат."},{"t":"v","l":["2. Аскер офицеринин өздүк күбөлүгү","3. Катардагы жоокерлердин жана сержанттардын аскер билети"]},{"t":"p","h":"4. Ички иштер органдары тарабынан берилген тийиштүү формадагы справка (форма №9), Кыргыз Республикасынын жараны экендигин тастыктаган 2004-жылдын үлгүсүндөгү күбөлүк."},{"t":"v","l":["5. Пенсиялык күбөлүк","6. Айдоочулук укук жөнүндө күбөлүк"]},{"t":"p","h":"Эсиңизде болсун! Жогоруда саналган документтер гана участкага кабыл алынат. Башка эч кандай расмий жана расмий эмес документтер добуш берүү күнү участкада кабыл алынбайт."},{"t":"h3","h":"М!!. УШКнын мүчөлөрүнүн добуш берүү күнүндөгү милдеттери"},{"t":"p","h":"1. УШК төрагасы Жоопкерчилиги: Акыр аягында шайлоого чейин, шайлоо күнү жана шайлоодон кийин УШК аткаруучу бардык <span class=\"pg\" data-n=\"162\">162<\/span>аы: ыы"},{"t":"raw","h":"<div class=\"gloss\"><p>р аны тизм. рт <\/p><\/div>"},{"t":"p","h":"милдеттер менен иштер үчүн жооп берет."},{"t":"v","l":["Башка милдеттер менен кошо анын төмөндөгүдөй милдеттери бар:","Шайлоо күнү шайлоо участкасынын ишин уюштуруу жана башкаруу."]},{"t":"p","h":"Шайлоо алдында жана шайлоо мезгилинде, ошондой эле добуштарды эсептөө учурунда эң мыкты адеп-ахлак ченемдерин сактоо."},{"t":"p","h":"Алынган шайлоо бюллетендери жөнүндө отчёт берүү (Бюллетендерди алуу жол-жобосу 39-статьянын 9-пунктунда кеңири баяндалга)."},{"t":"p","h":"Шайлоо участкасын добуш берүүнү өткөрүү орду боюнча үлгү схемасына ылайык уюштуруу. Добуш берүүнүн жашыруундугуна кепилдик кылуу үчүн добуш берүү кабиналарын тийиштүү түрдө жайгаштыруу. сураган же танаписке чыккысы келген комиссия мүчөлөрүнө жардам берүү."},{"t":"p","h":"Зарыл буюмдардын, алардын ичинен жетиштүү санда бастырылган шайлоо бюллетендеринин ж.у.с. бар болушун камсыздоо."},{"t":"p","h":"Комиссия мүчөлөрүн алардын аттары жана УШКга таандык экендиги жазылган таанытмалар менен камсыздоо, Төрага байкоочуларды, эларалык байкоочуларды жана ММК өкүлдөрүн эсепке алат."},{"t":"p","h":"Ар кандай олуттуу же өзгөчө маселе пайда болгондо, бул тууралуу райондук/шаардык комиссияга дароо кабар берүү."},{"t":"p","h":"Комиссия мүчөлөрүнүн белгиленген жол-жоболорду сакташына көз салуу."},{"t":"p","h":"Шайлоо участкасында болгон ар кандай тартипсиздикти, шайлоочулар добуш берүүдөн баш тарткан, байкоочулардын катышуусуна каршы болгон учурларды жана башка кырдаалдарды эсепке алуу."},{"t":"p","h":"Участканы саат 20.00дө жаап, добуш берүүнү аяктоо жана добуштарды эсептөө процессине жетекчилик кылуу, Толтурулган протоколду райондук/шаардык шайлоо комиссиясына жиберүү. Протоколдун көчүрмөлөрүн бардык квалаган байкоочуларга берүү, эгерде андай мүмкүнчүлүгү жок болсо, кызыккандардын көчүрмө жасап алышына мүмкүндүк берүү жана ал көчүрмөлөрдү тастыктоо."},{"t":"p","h":"Бардык жабдууларды жана буюмдарды, алардын ичинен пайдаланылбай калган сыяларды жана ультрафиолет чырактарын райондук/шаардык комиссияга кайтарып берүү."},{"t":"p","h":"Эсиңизде болсун! Комиссия төрагасы катары Сиз комиссиянын бардык мүчөлөрү өз милдеттерин мыйзамга ылайык аткарышына көз салууга милдеттүүсүз."},{"t":"p","h":"УШК терагасы: Төмөндөгүдөй кырдаалда эмне кылуу керек?"},{"t":"p","h":"Кээ бир талапкерлер шайлоо бюллетендери бастырылып чыгарылгандан кийин шайлануучулардын тизмесинен чыгып кетишти же өздөрү талапкерлигин алып салышты."},{"t":"p","h":"УШК райондук/шаардык комиссиясынын көрсөтмөсү боюнча мындай талапкерлердин фамилиясын ар бир шайлоо бюллетенинен сызып салат."},{"t":"p","h":"Талапкерге тиешелүү ар бир сапты шариктүү калемсап менен гана түз сызып чийүү керек."},{"t":"p","h":"Андан тышкары түз сызык ошол талапкердин атынын тушундагы таза чакмакты да басып өтүүгө тийиш. УШК терагасы: Төмөндөгүдөй кырдаалда эмне кылуу керек?"},{"t":"p","h":"Шайлоочу маркалоодон баш тартып, шайлоо бюллетенин бергиле деп талап кылды Маркалоо эч кандай зыянсыз экендигин, бул мыйзам боюнча талап кылынаарын шайлоочуга түшүндүрүп көрүңүз."},{"t":"p","h":"Эгерде шайлоочу дагы эле көнбөй, мурдагыдан бетер агрессивдүү мамиле жасаса, анда шайлоо участкасынан чыгып кетишин сылык түрдө өтүнүңүз."},{"t":"p","h":"Эгерде ал кетпейм десе, төрага участкадагы коопсуздук үчүн жооп бере турган тартип коргоо органдарынын өкүлдөрүн ч

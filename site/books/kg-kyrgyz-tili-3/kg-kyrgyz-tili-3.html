<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Кыргыз тили 3</title>
<style>/* Mobile textbook reader. No external fonts or libraries: everything works offline. */
:root {
  --bg: #ffffff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3;
  --panel: #f6f6f6; --accent: #1f6feb; --accent-fg: #ffffff;
  --fs: 19px; --lh: 1.55;
  --font: Georgia, "Noto Serif", "DejaVu Serif", "Times New Roman", serif;
  --bar-h: 48px; --foot-h: 28px;
}
[data-theme="sepia"] { --bg: #f5ecd9; --fg: #4a3b2a; --muted: #8a7458; --line: #e0d2b4; --panel: #ece0c6; --accent: #9a5b13; }
[data-theme="dark"]  { --bg: #111315; --fg: #d8d8d8; --muted: #8c8c8c; --line: #2a2d31; --panel: #1b1e21; --accent: #6ea8ff; --accent-fg: #0b0b0b; }
[data-theme="contrast"] { --bg: #000000; --fg: #ffffff; --muted: #c8c8c8; --line: #444; --panel: #151515; --accent: #ffd400; --accent-fg: #000; }
[data-font="sans"] { --font: Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 16px/1.4 Roboto, "Noto Sans", Arial, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- Library ---------- */
.lib { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lib h1 { font-size: 22px; margin: 8px 0 4px; }
.lib .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.lib-head { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
.lib-head h1 { flex: 1; margin: 0; }
.school { display: flex; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.school button { flex: 1; min-height: 44px; padding: 0 10px; font-size: 15px; background: var(--panel); }
.school button + button { border-left: 1px solid var(--line); }
.school button.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.my-link { flex: 0 0 auto; font-weight: 600; min-height: 40px; padding: 0 12px; font-size: 14px; }
.grade { margin-bottom: 10px; }
.grade-h { display: flex; width: 100%; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 18px; font-weight: 600; text-align: left; }
.grade-h::after { content: '›'; font-size: 24px; color: var(--muted); margin-left: 10px; transition: transform .15s; }
.grade.open .grade-h::after { transform: rotate(90deg); }
.grade-h .n { margin-left: auto; font-size: 14px; font-weight: 400; color: var(--muted); }
.grade-b { padding: 0 2px; }
.grade-t { font-size: 20px; margin: 18px 0 0; }
.subj { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.bk { border-bottom: 1px solid var(--line); padding: 4px 0 12px; }
.bk:last-child { border-bottom: 0; }
.bk-t { font-size: 17px; font-weight: 600; }
.bk-s { font-size: 14px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bk-m { color: var(--muted); font-size: 13px; margin: 3px 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: .5; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.bk-h { display: flex; align-items: flex-start; gap: 4px; }
.bk-h .bk-t { flex: 1; padding-top: 10px; }
.bk .row { gap: 4px; }
.bk .row .btn { min-height: 40px; padding: 0 18px; font-size: 14px; margin-right: 8px; }
.bk .icon { color: var(--muted); flex: 0 0 auto; }
.bk .icon[disabled] { opacity: .5; }
.bk .icon.on { color: var(--accent); }
.bk .star.on svg { fill: currentColor; }
.bk .star.on { color: #e3a008; }
.share-opts { display: flex; flex-direction: column; gap: 10px; }
.share-opts .note { margin-top: 0; }
.sheet h3 .icon { flex: 0 0 auto; }

/* ---------- Reader ---------- */
.reader { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; user-select: text; }
.viewport { position: absolute; left: 0; right: 0; top: 0; bottom: var(--foot-h); overflow: hidden; }
.flow {
  height: 100%; column-fill: auto; padding: 20px 0 12px;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  will-change: transform; transform: translate3d(0,0,0);
  hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
}
.flow.anim { transition: transform .25s ease-out; }
.flow p { margin: 0 0 .15em; text-indent: 1.4em; text-align: left; }
.flow p.ni { text-indent: 0; }
.flow h1, .flow h2, .flow h3 { font-family: Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.25; break-after: avoid; page-break-after: avoid; }
.flow h1 { font-size: 1.35em; margin: .2em 0 .8em; text-align: center; }
.flow h2 { font-size: 1.15em; margin: 1.1em 0 .5em; }
.flow h3 { font-size: 1.0em; margin: 1em 0 .4em; }
.flow .verse { margin: .6em 0 .8em 1em; break-inside: auto; }
.flow .verse div { text-indent: -1em; padding-left: 1em; text-align: left; }
.flow .verse .gap { height: .7em; }
.flow figure { margin: .8em 0; text-align: center; break-inside: avoid; page-break-inside: avoid; }
.flow figure img { max-width: 100%; height: auto; border-radius: 4px; background: var(--panel); }
.flow figcaption { font-size: .8em; color: var(--muted); margin-top: .3em; }
.flow .box { border-left: 3px solid var(--accent); padding: .1em 0 .1em .7em; margin: .7em 0; }
.flow .pg { font: 11px/1 Roboto, Arial, sans-serif; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 4px; margin: 0 3px; vertical-align: 2px; text-indent: 0; white-space: nowrap; user-select: none; }
.flow .end { height: 1px; }
.flow .endnote { text-align: center; color: var(--muted); font-size: .8em; margin-top: 2em; font-family: Roboto, Arial, sans-serif; }
[data-theme="dark"] .flow img, [data-theme="contrast"] .flow img { filter: brightness(.9); }

.foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot-h); display: flex; align-items: center;
  justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.foot .t { overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }

.bar { position: absolute; left: 0; right: 0; background: var(--panel); border-color: var(--line); z-index: 5;
  transition: transform .2s; display: flex; align-items: center; }
.bar.top { top: 0; height: var(--bar-h); border-bottom: 1px solid var(--line); transform: translateY(-100%); padding: 0 4px; }
.bar.bottom { bottom: 0; border-top: 1px solid var(--line); transform: translateY(100%); padding: 10px 16px 14px; flex-direction: column; align-items: stretch; gap: 6px; }
.reader.ui .bar { transform: none; }
.bar .title { flex: 1; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.bar .info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* ---------- Sheets (TOC, settings) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85%; overflow: auto; background: var(--bg);
  border-radius: 16px 16px 0 0; z-index: 11; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
.sheet h3 { margin: 10px 0 12px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.toc a { display: block; padding: 11px 4px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 15px; }
.toc a.sub { padding-left: 20px; font-size: 14px; color: var(--muted); }
.toc a.cur { color: var(--accent); font-weight: 600; }
.set { margin: 14px 0; }
.set label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; }
.seg button.on { border: 2px solid var(--accent); font-weight: 600; }
.swatch[data-v="light"] { background: #fff; color: #1b1b1b; }
.swatch[data-v="sepia"] { background: #f5ecd9; color: #4a3b2a; }
.swatch[data-v="dark"] { background: #111315; color: #d8d8d8; }
.swatch[data-v="contrast"] { background: #000; color: var(--accent-fg); }
.goto { display: flex; gap: 8px; }
.goto input { flex: 1; min-height: 44px; font-size: 16px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px;
  border-radius: 20px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Textbook elements produced by tools/convert_pdf.py ---------- */
.flow .tasks, .flow .gloss { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45;
  background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0; }
.flow .tasks p, .flow .gloss p { margin: 0 0 .35em; text-align: left; }
.flow .gloss { border-left: 3px solid var(--accent); }
.flow p.note { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; font-style: italic; text-indent: 0; margin: .6em 0; }
.flow p.attr { text-align: right; text-indent: 0; font-style: italic; color: var(--muted); margin: .1em 0 .8em; }
.flow p.sep { text-align: center; text-indent: 0; color: var(--muted); margin: .5em 0; letter-spacing: .3em; }
.flow h2 .pg, .flow h3 .pg { font-weight: normal; }
.toc .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 4px 2px; }
.toc a .p { float: right; color: var(--muted); font-size: 13px; margin-left: 8px; }

/* ---------- Elements produced by tools/convert_layout.py (typeset textbooks) ---------- */
.flow figure img { cursor: zoom-in; }
.flow h4.mk { font: 700 .78em/1.3 Roboto, "Noto Sans", Arial, sans-serif; letter-spacing: .05em; color: var(--accent);
  margin: 1em 0 .3em; break-after: avoid; page-break-after: avoid; }
.flow p.hl { color: var(--accent); text-indent: 0; }
.flow p.small { font-size: .82em; text-indent: 0; color: var(--muted); }
.flow sup, .flow sub { font-size: .7em; line-height: 0; }
.flow .kbox { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45; background: var(--panel);
  border-radius: 8px; padding: .45em .7em; margin: .5em 0; border-left: 3px solid var(--accent); }
.flow .kbox > b { display: block; }
.flow .frame { background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0;
  font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; line-height: 1.45; }
.flow .frame p { text-indent: 0; margin: 0 0 .35em; text-align: left; }
.flow .tbl { margin: .8em 0; font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .8em; line-height: 1.35; }
.flow .tbl .tt { font-weight: 600; text-indent: 0; text-align: center; margin-bottom: .3em; }
.flow .tbl table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.flow .tbl th, .flow .tbl td { border: 1px solid var(--line); padding: .3em .35em; vertical-align: top; text-align: left; overflow-wrap: anywhere; hyphens: auto; }
.flow .tbl th { background: var(--panel); }
.flow .tbl tr { break-inside: avoid; page-break-inside: avoid; }

.zoom { position: fixed; inset: 0; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; background: rgba(0,0,0,.92); z-index: 30; }
.zoom-in { position: absolute; inset: 0; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
.zoom-in img { margin: auto; flex: none; touch-action: pan-x pan-y; object-fit: contain; background: #fff; cursor: zoom-in; }
.zoom-x { position: absolute; top: 8px; right: 8px; color: #fff; background: rgba(0,0,0,.5); z-index: 31; }
.flow h4.sh { font: 700 .95em/1.3 Roboto, "Noto Sans", Arial, sans-serif; text-align: center; margin: .8em 0 .4em; break-after: avoid; page-break-after: avoid; }

/* maths books */
.flow h4.ex, .flow h4.try { font-family: Roboto, Arial, sans-serif; margin: 1.1em 0 .3em; font-size: 1em; }
.flow h4.ex { display: inline-block; background: #f7e400; color: #111; padding: .1em .6em; border-radius: 3px; }
.flow h4.try { color: var(--accent); }
.flow p.goal { font-size: .85em; text-indent: 0; background: var(--panel); border-radius: 8px; padding: .4em .7em; }
.flow b.bd { display: inline-block; text-indent: 0; padding: 0 .4em; border-radius: 1em; background: var(--fg); color: var(--bg);
  font: bold .8em/1.45 Roboto, Arial, sans-serif; margin-right: .2em; }
.flow b.nb { display: inline-block; text-indent: 0; min-width: 1.4em; border-radius: 4px; background: var(--accent); color: var(--accent-fg);
  text-align: center; font-size: .8em; margin-right: .3em; }
.flow .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.15; margin: 0 .1em; }
.flow .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .15em; }
.flow p.ml { text-indent: 0; padding-left: 1em; }
.flow p.side { font-size: .85em; }
.flow details.ans { margin: .3em 0 .8em; font-size: .9em; }
.flow details.ans summary { color: var(--accent); cursor: pointer; font-family: Roboto, Arial, sans-serif; }

/* wide tables become one card per row on phones */
@media (max-width: 560px) {
  .flow .tbl.cards table, .flow .tbl.cards tbody, .flow .tbl.cards tr, .flow .tbl.cards td { display: block; width: auto; }
  .flow .tbl.cards tr:first-child { display: none; }
  .flow .tbl.cards tr { border: 1px solid var(--line); border-radius: 8px; margin: .5em 0; padding: .3em .5em; }
  .flow .tbl.cards td { border: 0; padding: .15em 0; }
  .flow .tbl.cards td::before { content: attr(data-l); display: block; font: 600 .75em/1.3 Roboto, Arial, sans-serif; color: var(--muted); }
  .flow .tbl.cards td:first-child { font-weight: 600; }
}
.flow figure.vec svg { max-width: 100%; height: auto; display: inline-block; background: #fff; border-radius: 4px; cursor: zoom-in; }
[data-theme="dark"] .flow figure.vec svg, [data-theme="contrast"] .flow figure.vec svg { filter: brightness(.9); }
.flow .rt { border-top: 1px solid currentColor; padding-top: 1px; margin-left: 1px; }
.flow .it { display: inline-block; max-width: 100%; margin-right: .9em; text-indent: 0; }

/* ---------- Text quality badge (library rows, first page of a book, reader top bar) ---------- */
.q { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 10px 2px 8px; margin: 0 8px 2px 0;
  border: 1px solid var(--line); border-radius: 13px; background: var(--panel); color: var(--fg);
  font: 12px/1.2 Roboto, "Noto Sans", Arial, sans-serif; vertical-align: middle; text-indent: 0; white-space: nowrap; }
.q i, .qdot i { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.q-exact i { background: #2da44e; }
.q-proofread i { background: #3b82f6; }
.q-ocr i { background: #e8900c; }
.qdot { display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 12px; }
.qdot i { width: 12px; height: 12px; }
.bk .row .q { margin: 0 0 0 auto; }
.flow .qline { margin: 0 0 1em; text-indent: 0; }
.flow .qline .q { font-size: 13px; cursor: pointer; }
.qsheet .q { font-size: 14px; min-height: 30px; margin: 0 0 4px; }
.qsheet p { font-size: 15px; line-height: 1.5; margin: 10px 0; }

/* ---------- Menu (☰), "What's new", missing books ---------- */
.lib-head .burger { flex: 0 0 auto; margin-left: -10px; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 85%); background: var(--bg); z-index: 11;
  padding: 8px 0 24px; overflow: auto; box-shadow: 2px 0 12px rgba(0,0,0,.2); }
.drawer-h { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 8px 16px; font-weight: 600; font-size: 17px; }
.drawer a { display: block; padding: 14px 16px; color: var(--fg); text-decoration: none; font-size: 16px; border-top: 1px solid var(--line); }
.drawer a.cur { color: var(--accent); font-weight: 600; }
.drawer .note { padding: 8px 16px 0; border-top: 1px solid var(--line); margin-top: 0; }
.news-d { font-size: 15px; color: var(--muted); font-weight: 600; margin: 20px 0 6px; }
.news { border-bottom: 1px solid var(--line); padding: 2px 0 10px; }
.news p { margin: 6px 0; font-size: 15px; line-height: 1.5; }
.news summary { color: var(--accent); cursor: pointer; font-size: 14px; min-height: 32px; line-height: 32px; }
.news-b { margin: 2px 0 4px; padding-left: 20px; font-size: 14px; line-height: 1.8; }
.bk.miss { padding: 8px 0 12px; }
.bk.miss .bk-m { margin-bottom: 6px; }
.ms { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.ms-kyonly, .ms-edition, .ms-sample { border-color: #e8900c; }
.bk.miss .note { margin-top: 6px; font-size: 14px; }
.offer { margin: 24px 0 0; padding: 14px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.offer h2 { font-size: 18px; margin: 0 0 6px; }
.offer p { margin: 6px 0; font-size: 15px; line-height: 1.5; }
.up label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
.up select, .up input[type=text], .up textarea { width: 100%; min-height: 44px; font-size: 16px; padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-family: inherit; }
.up input[type=file] { font-size: 15px; max-width: 100%; }
.up .btn { margin-top: 14px; width: 100%; }
.up .done { font-weight: 600; }

/* ---------- Report a text error (select text in a book) ---------- */
.rep { position: absolute; left: 50%; bottom: calc(var(--foot-h) + 14px); transform: translateX(-50%); z-index: 6;
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 22px;
  background: var(--accent); color: var(--accent-fg); font-size: 15px; font-weight: 600; box-shadow: 0 2px 10px rgba(0,0,0,.25);
  white-space: nowrap; -webkit-user-select: none; user-select: none; }
.rep[hidden] { display: none; }
.rep svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rq { margin: 0 0 6px; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--panel); border-radius: 6px;
  font-family: var(--font); font-size: 16px; line-height: 1.45; max-height: 30vh; overflow: auto; }
.sheet textarea { width: 100%; font-size: 16px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); font-family: inherit; }
.sheet .rsend { width: 100%; }
</style>
</head>

 тапкыла.","4. Заттын санын туюнткан мисалдарды тапкыла.","5. Сүрөт боюнча кыскача аңгеме түзүп, оозеки сүйлөп","бергиле.","6. Силер жайында кайда эс алдыңар? Аңгемелешкиле."]},{"t":"p","h":"5-көнүгүү. Ырды көрктүү окуп, эмне жөнүндө экенин айтып бергиле."},{"t":"h3","h":"КЫРГЫЗ ТУУСУ"},{"t":"v","l":["Кызыл түсүң көңүлдөрдү толкутуп,","Алтын күнгө чөгөрүлүп түндүгүң.","Жаралышың жалпы кыргыз эли күтүп,","Улуу тарых – кайра туулган бул күнүң!","","Биз баралы асмандата көтөрүп,","Жыйырма бирден башталган бул кылымда.","Биримдикте ой-максатка жетели,","Кызыл өңүң кыярып эч кубулба.","","Сен кыргызга, кыргыз сага жарашып,","Түбөлүккө желбирей бер сыймыктуу.","Дүйнө эли суктанышкан карашып,","Ала-Тоолук түркүн калкка сыймык бу.","А. Чойбекова","6-көнүгүү. Республикаң, элиң, жериң, айылың жөнүндө эмне билесиң? Алар сага эмнеси менен кымбат? Ой жүгүртүп, чакан дилбаян жазгыла.","","Кайталоо","","7-көнүгүү. Текстти окуп, тапшырмаларды аткаргыла."]},{"t":"h3","h":"<span class=\"pg\" data-n=\"7\">7<\/span>КӨЧӨДӨ, КООМДУК ЖАЙЛАРДА КАНТИП ЖҮРҮҮ КЕРЕК?"},{"t":"p","h":"Балдар, «эл – сынчы» дегенди түшүнөсүңөрбү? Ал мындай. Адам өзүн өзү көпчүлүк убакта байкабайт, эл сырттан байкайт. Ошол үчүн көчөгө чыгарда, адегенде, үстү-башыңа көз чаптыр. Кийинген кийимиң таза, үтүктөлгөндөй болсун. Топчулары, бүчүлөрү да ордунда болсун. Аба ырайына жараша да кийинүүнү үйрөн. Тырмакты да өз убагында алып, чачты тарап алуу керек. Өзгөчө, кыздар таза, тыкан жүрүп, жарашыктуу кийинүүлөрү зарыл. Жүргөн-турганы, басканы жана сүйлөгөнү, күлгөнү адептүү болсун."},{"t":"p","h":"Ата-энебиз көрбөйт, билбейт деп ээнбаш болуп, ээн ооз сүйлөгөндөрдү эл байкабай калабы? «Баланчанын баласы же кызы тигиндей», – деп айтуу силерден мурда ата-энеңерге уят. Ошондуктан, кичинекей достор, адептүү жүрүүнү жашыңардан үйрөнгүлө!"},{"t":"p","h":"? 1. Текстти окуп, жүрүм-турум адеби кандай экенин айтып бергиле. 2. Текстте канча сүйлөм бар экенин байкагыла. 3. Сүйлөмдүн түрлөрүнө жараша мисалдарды таап айткыла."},{"t":"p","h":"8-көнүгүү. Айтылган ойго жана ыргагына жараша, сүйлөмдөрдүн чегин ажыраткыла. Канча жана кандай сүйлөмдөр бар экенин түшүндүргүлө. Тыныш белгилердин коюлушун, баш тамгалардын жазылышын туура байкагыла."},{"t":"p","h":"Жаңы окуу жылы башталды сен керектүү окуу куралдарыңды алдыңбы. Бүгүн күн кечээкиден салкын сен жайында тоого бардыңбы Мен Ысык-Көлгө лагерге барып эс алдым."},{"t":"p","h":"<span class=\"pg\" data-n=\"8\">8<\/span>Сабакка кечикпей өз убагында кел эртең менен сен саат канчада турасың мен бүгүн 6 жарымда ойгондум. Бөбөгүңдү ыйлатпа Сенин бөбөгүң бакчага барабы."},{"t":"p","h":"9-көнүгүү. Төмөнкү ыр-табышмактарды окугула. Сүрөткө карап, сөздөрдүн маанисин эмне өзгөрткөнүн түшүндүргүлө."},{"t":"img","src":"data:image/webp;base64,UklGRjIHAABXRUJQVlA4ICYHAAAQNACdASqzALwAPrVSoEunKLEqK9b58iAWiUWwCkjJQNM8vrmDMd/xhPbJEDHfeLgMioRTfolgwZINkY9gRUFbok+qXeCDQ6kOtNHZMWhFGv/q6vb3IOBkt7npvzhg26ugPYACIUr11DOKlJ5FzSDEhIDykLOMBhGlY5GcRAWFJ/HFmKifW6wLwdF3j4jIhiuqVNybcoT/KyICAc4Oxr9YjVPuB9wD8SFe9YjQjqyi0yhkYuyxoN3d3OoRzCiEEQKLLcG/pY5CHHF4i/2u9YaiOKsUyJ53QKHh4RNtgKTVgH7xyO7cFjheLznD3fLBPVkM28sdkZp5aPaFOKct6oAwljPbEh+GrgKBtAoMe/lRh7e6z44vOAMTIxRPal+ESi2KAV9B0JOsU+qC2MECZ2qkCWpvzhTWWdQK6B3p0qlP7rCxl+9a84VDBdaVbOHXcdLJivFLzbif2THAJIniQnpiRrPLz7COzowlyZ5GHZuSHqNm9LxqNSBc7pgIZrxJ4eKRbfUkxK9sN1mrGAuNlzcI/UwuD+xOo65csOEr8sKfgvOoq9zJu+pwtAD++WNcGLFxtkyrLH+DQIPGEaca1ppVGRQB2Kbk/xD8x8FGer3Ko0jyA8B1weIlSYIxP11B/1Ulskdqi/Y2c7pSX4P3HTC/IdzhFuZ4hALfkKAJ+NWdbP7QNQ8dIBydUPEsE4W4lzncmgsYKOPZLmQdEdNX/y7pXIYf6HHHfuEso1OCPVs+2bIG1DFliffN5j5vM6ZEWkcJxQjoWeIqTGdEAca2qKjiMeFibbQ6Nar/DeWdTOrsIYKqJYx1afOw9ArQtOqlK2GbDOM5jYJaDgACaf3o6iyBttDCjq+jpZvm5qlKQngDvZmxrcJGtUUzIOaEpAh/Q3HlL/TsxbpBwhJkgzuytZhpfpLUGTfQP5AsBjYXyJLVyfjyFf3WNm8VPY04cjt+maptCXz8uBpKk6CZ6Nv24Kl8UbkGhbinQYEuT1dIncGhxvFxUsCWDZgaMsaZ+sYcE8eo3LtSxPHGlrReqVYJ4D//++Q68PfXG+g18BPVghGjkLOh4/Z7w2BlPaXGoDIzeTqgGLczF1hPCcFYl9llwd8EDcUquJyFUEAGlLAqHSJgt1XVrTV3FWjsU99DNNG6eM1WHcWZ6HkgZZ2xtiiHTqycxDz7hAYlpJsQmmKq7psNYgmEzZVSZ6MuA2lJviTNMbD 214,"ht":156},{"t":"p","h":"«А»ны мага уласаң, Жанмын жазда чардаган."}],"sub":[{"title":"-1КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК ГЕРБИ","b":0},{"title":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК ТУУСУ","b":2},{"title":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК ГИМНИ","b":4},{"title":"С. РЫСБАЕВ, Ч. ИСАКОВА","b":6},{"title":"I ЧЕЙРЕК","b":11},{"title":"ЖАҢЫ ОКУУ ЖЫЛЫҢАР МЕНЕН, ЖАШ ДОСТОР!","b":21},{"title":"II КЛАССТА ӨТҮЛГӨНДӨРДҮ ЭСКЕ ТҮШҮРҮҮ","b":24},{"title":"МАНАС БАБАБЫЗДЫН ЖЕТИ ОСУЯТЫ:","b":28},{"title":"КЫРГЫЗ ТУУСУ","b":40},{"title":"КӨЧӨДӨ, КООМДУК ЖАЙЛАРДА КАНТИП ЖҮРҮҮ КЕРЕК?","b":42}],"pages":[0,8]},{"title":"§ 1. СОЗУЛМА ҮНДҮҮЛӨРДҮН ЖАЗЫЛЫШЫ","blocks":[{"t":"h3","h":"§ 1. СОЗУЛМА ҮНДҮҮЛӨРДҮН ЖАЗЫЛЫШЫ"},{"t":"v","l":["10-көнүгүү. Сөздөрдү окуп, салыштыргыла.","","? Созулма үндүүлөр канча тамга менен белгиленет?","эр – ээр","эк – ээк","ара – араа","ары – аары","улу – улуу","ток – тоок","кон – коон","өн – өөн","тала – талаа","күлүү – күүлүү"]},{"t":"p","h":"11-көнүгүү. Кыргыз тилинде канча созулма үндүү бар? Ар бириңер өз алдыңарча 5тен мисал келтирип жазгыла."},{"t":"p","h":"12-көнүгүү. Аңгемени окуп, тапшырмаларды аткаргыла."},{"t":"h3","h":"<span class=\"pg\" data-n=\"9\">9<\/span>КҮҮ"},{"t":"p","h":"Чакырган жерге бир себептен улам Сабыр кечигип келди. Ал келгенде үйдө комуз чертилип жаткан. Комуздун мукам үнүн угуп, Сабыр тыңшап туруп калды."},{"t":"p","h":"Үйдөгү эл дагы комуздун мукам үнүнө берилип калышкан. Сабыр адеп сактап, чертилип жаткан комуздун мукам үнүн бузбайын деп, үйгө кирбей, босогодо кулак төшөп турду."},{"t":"p","h":"Качан күү бүткөндөн кийин гана, Сабыр үйгө салам айтып кирди. Отургандар тура калып, төргө өтүүсүн өтүнүштү."},{"t":"p","h":"– Ка-ап, Асыл черткен күүнү укпай калдың ээ, – деди отургандардын бири."},{"t":"p","h":"Сабыр төргө өтүп, кечигип келгени үчүн отургандардан кечирим сурады. Ал бая эле келип, босогодон Асылдын күүсүн тыңшап, бирок жолтоо болбоюн деп адеп сактап, кирбей турганын эч ким билген жок."},{"t":"p","h":"1. Тексттин мазмунун сүйлөп бергиле. 2. Сабыр эмнеликтен босогодо туруптур? 3. Тексттен созулма үндүүлөр катышкан сүйлөмдөрдү таап, көчүрүп жазгыла. 4. Аларды жоон, ичке үндүүлөргө ажыраткыла."}],"sub":[{"title":"КҮҮ","b":4}],"pages":[9,9]},{"title":"§ 2. СӨЗ ИЧИНДЕ КАТАР КЕЛГЕН ҮНСҮЗДӨР","blocks":[{"t":"h3","h":"§ 2. СӨЗ ИЧИНДЕ КАТАР КЕЛГЕН ҮНСҮЗДӨР"},{"t":"p","h":"(нн, сс, лл, зз, мм, кк, тт) 13-көнүгүү. Сөздөрдү окуп, андан катар келген үнсүздөрдү байкагыла. Төрт сүйлөм түзүп, катар келген үнсүздөрдүн алдын сызып көрсөткүлө."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Алиппе<\/td><td>Хоккей<\/td><td>металл<\/td><\/tr><tr><td>грипп<\/td><td>Аккордеон<\/td><td>миллион<\/td><\/tr><tr><td>тонна<\/td><td>касса<\/td><td>трасса<\/td><\/tr><tr><td>ванна<\/td><td>класс<\/td><td>таттуу<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"10\">10<\/span>Үлгү: Менин бөбөгүмдүн «Алиппе» китеби бар."},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Бир сөз ичинде үндүүлөр сыяктуу эле үнсүздөр да бир катар келип айтылат. Андай сөздөр, көбүнчө, орус тили аркылуу кирген сөздөрдө кездешет."},{"t":"p","h":"Мисалы: Биздин класс экинчи кабатта."},{"t":"p","h":"Грипп – жугуштуу оору."},{"t":"p","h":"14-көнүгүү. Текстти окугула. Андан сөз ичинде катар үнсүздөр катышкан сөздөрдү таап айткыла."},{"t":"h3","h":"АРСЛАНБАП ТОКОЮ"},{"t":"p","h":"Арсланбаптын аймагы көлдөргө да бай. Андагы табигый мөмө-жемиштер токою 37000 гектарды ээлейт. Ал өрөөнгө көрк гана бербестен, көргөн адамга ыракат тартуулайт. Арсланбапта дарылык касиетке бай өсүмдүктөр арбын. Ал – дүйнөдөгү эң чоң табигый жаңгак токою. Жылына миңдеген тонна жер-жемиштерин жыйнап алууга болот. Бир эле түп жаңгак ондогон килограмм жемиш бере алат."},{"t":"p","h":"Баарынан кызыгы, жаңгак дарагынын бийиктиги 20-25 метрге жеткени бар. Бутактары 4—6 айрылып өсүп, түбү чатырдай болуп, күн нуру өтпөйт. Жаңгактан жакшы самын, лак, тушь ж.б. боёктор чыгарылат. Жыгачынан эң мыкты үй эмеректери жасалат."},{"t":"p","h":"15-көнүгүү. Өз алдыңарча нн, мм, сс, кк, пп тыбыштары катар келген сөздөргө экиден мисал жазып көрсөткүлө."},{"t":"p","h":"16-көнүгүү. Үйдөн өз алдыңарча төмөнкү сөздөрдү катыштырып, сүйлөм түзүп келгиле."},{"t":"p","h":"Жатта, жыттуу, заматта, аппак, группа, ванна, Анна, аллея, баллон, класс, металл."}],"sub":[{"title":"АРСЛАНБАП ТОКОЮ","b":9}],"pages":[10,10]},{"title":"§ 3. ЙОТТОШКОН ТАМГАЛАРДЫН ЖАЗЫЛЫШЫ ЖАНА АЙТЫЛЫШЫ (я, ю, е, ё)","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"11\">11<\/span>§ 3. ЙОТТОШКОН ТАМГАЛАРДЫН ЖАЗЫЛЫШЫ ЖАНА АЙТЫЛЫШЫ (я, ю, е, ё)"},{"t":"p","h":"17-көнүгүү. Йоттошкон тамгалардын айтылышына жана окулушуна көңүл коюп, эсиңерге салгыла. Ар бирине бирден мисал келтирип жазып, окуп бергиле."},{"t":"p","h":"й + а = я: таяк, аяк, кыя, сыя"},{"t":"p","h":"й + у = ю: оюу, коюу, куюн, чоюн"},{"t":"p","h":"й + э = е: чие, чиет, тиет, киет"},{"t":"p","h":"й + о + ё: боёк, коён, тоёт, оёт"},{"t":"p","h":"? Йоттошкон тамгалар канча тыбыштан турат?"},{"t":"p","h":"18-көнүгүү. Текстти окуп, орус тилинен кирген жана йоттошкон тамгалар катышкан сөздөрдү тапкыла."},{"t":"h3","h":"«АК ШООЛА» ХОРУ"},{"t":"p","h":"Балдардын республикалык «Ак шоола» хорун ким гана билбейт. Ал хордун аткарган ырларын укпаган кыргыз балдары жоктур."},{"t":"p","h":"Хордун уюшулганына быйыл 20 жыл болду."},{"t":"p","h":"Ошол убакыттын ичинде ал жалпы элибизге таанылды. Республикага гана эмес, чет элге да белгилүү болду. Алар кыргыз ыр-бийин ырдап, бийлешип, Япония, Түркия, Россия, Венгрия өлкөлөрүнө чейин барып келишти. Көптөгөн фестивалдарда жеңүүчүлөрдөн болушту."},{"t":"p","h":"Хордун жетекчиси белгилүү балдар обончусу, маданиятка эмгек сиңирген ишмер Эсенгулова Гүлмира. Ал жаш болсо да, абдан таланттуу музыкант."},{"t":"p","h":"<span class=\"pg\" data-n=\"12\">12<\/span>Баарынан кызыгы, балдар хорго 4 жаштан баштап катышат. 4—5 жашар балдардын ырдаган ырларын уга эле бергиң келет."},{"t":"p","h":"19-көнүгүү. Йоттошкон тамгалар катышкан сөздөрдөн таап, мисал келтирип жазгыла."},{"t":"p","h":"Үлгү: Алмаздын бакма коёндору бар."},{"t":"p","h":"20-көнүгүү. Накыл кептерди окуп, маанисин түшүнгүлө. Тапшырманы аткаргыла."},{"t":"v","l":["Кулагыңа кумуш сырга!","«Колу ойногондун оозу ойнойт»."]},{"t":"p","h":"Элибизде кыска, бирок нуска айтылган сөздөр көп. Кичинекей эле сөздөрдө чоң маани жатат."},{"t":"p","h":"Жогорудагы сөздү алалы: колу ойногону эмнеси? А оозу ойногонучу?"},{"t":"p","h":"Мээнет кылып, иш кылганы – колу ойногону да. Мээнет кылган адамдын оозу ашка толот да. Демек, адам эмгегинен ырахат алат. Таасын айтылган сөз бекен? Т. Самудинов"}],"sub":[{"title":"«АК ШООЛА» ХОРУ","b":8}],"pages":[11,12]},{"title":"§ 4. АЙТЫЛЫШЫ ЖАНА ЖАЗЫЛЫШЫ БИРДЕЙ БОЛБОГОН СӨЗДӨР","blocks":[{"t":"h3","h":"§ 4. АЙТЫЛЫШЫ ЖАНА ЖАЗЫЛЫШЫ БИРДЕЙ БОЛБОГОН СӨЗДӨР"},{"t":"p","h":"21-көнүгүү. Төмөндөгү сөздөрдү салыштырып окугула да, кайсынысы туура жазылганын айтып бергиле."},{"t":"p","h":"Тыбыштар дайыма эле бирдей айтылып, бирдей жазылабы?"},{"t":"img","src":"data:image/webp;base64,UklGRvYkAABXRUJQVlA4IOokAAAQugCdASqAAu4APrVUo0ynJK8lpRNsgeAWiWluKQBOu5k+eI78vp3E0j+eD2cPpgl70cf1ofhei4fst3Cf4rwx/FvpP8r/ff3W/vXtZaL+sHUv+Rfcj9V/b/Sv9e/IH4Ff5n949gj8o/on/F38vX/936Avtn9r/7vmB/Ifs36tflX+N9gH+j8OxQE8lr/E84H1/7DhRNZ1cx0ICOw1aIGiZt5Qrj7+Y4YS8dh4hpVt0nSseJZcAOssMSNnZr2JXBhQEHFKPrmJ1PBaOtuyudsT0iZfqw9PDQBvirWMVQolPR+7417Hwe5+yeNY0jDw5uBzoKRY2WQplRT2ieOiQD1rycTKNgON/NlKUif0Uxzydc+Ox/KqpJVXIrEG5ljQ3/wLZTTVYMOJFOOCl0JoodDIwCqLH/amuDB2mY6KvDZHf184kOMBb60CCRKjeFg7e/ErjRDMn+KsRFiI6Nar+TNKYGsM0bXCuDQgOJ9H1jN11MjSfEr9e5PpO+9W8eTf7C7aFw50caNirDny3i19tJze/pkDCZZHcjWGZ3f3F0KKWWYfaC+ejvlwPJUimPY5XkAe1p+81VoiepDUvfMmqIFSiHYxdL3U2aASSzEibkWA9YtEqMNfgWAWdCvZ4RLmszSYrMuDsgq4X1Ft5Jswev9+xrlkvImEAtjurkQ3Ogeuu7fZ0r/jjQa6mWRus3TaFkq1119rUIeaG3oIomHQpiqfzfnMmg/RBMc0xBHKh8LeJ7ZUYnykxhds/iYcRaiF7m52C0nsGpJ1mMiIC1A1reVJBGB0lO3CvLOe9YnCLPGeKg6O5t4/1uM393r7MoUI9rtcmOxZW0V1ZMZEruWEkLkRUejZxBzywUVL05SVHJ/xUPecENZPwW3Oa5O/BxwpOx5H5vo0Xdkr8e8VwXbV9Z3H57sGlE1QS56djUryAx+BalPimAwwPkBD0s5aCDWGbzKJNQ51uMmgt1J+DZmMHyX3Jd7 т. Бирок ч менен жазылат. Мисалы: кеч – кешчи – кеччи чеч – чешчи – чеччи"},{"t":"p","h":"22-көнүгүү. Сөздөргө -чы, -га, -бы, -мын мүчөлөрдү улантканда, айтылышы жана жазылышы ар башка болгон учурларын жазып көрсөткүлө."},{"t":"p","h":"Мен, жаан, чээн, жээн, бүгүн, түн, Асан, ач, кеч, чач, уч, кубанычтуу."},{"t":"p","h":"Үлгү: – Бул ким?"},{"t":"p","h":"– Бул – меммин. Асаммын, эшикти ашчы."},{"t":"p","h":"23-көнүгүү. Окугула, айтылышы жана жазылышы бирдей болбогон сөздөрдү тапкыла."},{"t":"h3","h":"<span class=\"pg\" data-n=\"14\">14<\/span>СҮЙҮНЧҮ АЙТУУ"},{"t":"p","h":"Кыргыз элинин муундан-муунга, атадан-балага өтүп келаткан салттарынын бири – сүйүнчү айтуу. Баланын төрөлүшүн, жакын адамдын алыскы сапардан келишин, кандайдыр бир кубанычтуу окуя, жакшы кабарды жакын адамдарга, туугандарга билдирүү сүйүнчүлөө деп аталат. Сүйүнчүнү чоң кишилер өздөрү да айтат, же киши чаптырат. Жакын жерде болсо, бала чуркатышат."},{"t":"p","h":"Сүйүнчүлөө бүгүнкү күндө салт болуп калды. Жакшы кабарды биринчи айткан кишиге сүйүнчү катары ыроолоп белек беришет."},{"t":"p","h":"Сүйүнчү алган киши эч качан аз же көп деп айтпашы шарт. Бергенине ыраазы болуп кете берет. Бул – ата-бабадан келаткан жосун."},{"t":"p","h":"24-көнүгүү. Үйдөн өз алдыңарча эки түрдүү айтылып жана жазылган тыбыштар катышкан он сөз жазып келгиле."},{"t":"p","h":"Машыгуу сабагы"},{"t":"p","h":"25-көнүгүү. Сүрөттү карап, заттардын айтылышын байкагыла. Сүйлөм түзүп, тууралап жазып көрсөткүлө."},{"t":"img","src":"data:image/webp;base64,UklGRjwYAABXRUJQVlA4IDAYAAAw2wCdASoyAlUBPrVWokwnLaqtK1P5SbAWiWVu8YEJ6pFUDmVsLLxV3lAXED+X/4t/meK/45+y5Ab43MV/++fv4n/0a6AAFous0NDfJS31ot9iC/bZeibncpvna+vfOwXG7BpVUWJwzFeWJ83rHQBVSSV2/h171k5OdeQLJwgBamJoyaoxS/3JFvT5GtD3DbK4oQSqKNw8V4ldxA1kjZ2EZRnFYGBfa1CeNYt5NIxj7Y7/GcGLmZ3U/0SUgHDQKNavRLjZoNIfin88SGpRtUfX2PQ7KNzsp25k6liQnEaaj9zrBo4n08dZNMP2f5isDbjNgULnfX+v/G5IRNiHBob0OJo17l02cqMO2uEm7PPNQ1T6uvHEjNrkt6DNqo6wTar16SSd8K+e9XmjWqUZaI87TIgezlxCmvJbL8wqyZUElcweO+iFVPhZVYbHvL8ITR3vmVcrpPrrCY7XTI ала коюбуз эгиз тууду. Бээ саан болду."},{"t":"p","h":"Жазылышы: Биздин кара ала коюбуз эгиз тууду. Бээ саан болду."},{"t":"p","h":"27-көнүгүү. Жомокту окуп, тапшырманы аткаргыла."},{"t":"h3","h":"АК УЛАК МЕНЕН КАРА УЛАК"},{"t":"p","h":"Ак улак менен кара улак так секирип ойноп жүрүп, тоодо энелеринен адашып калышат."},{"t":"p","h":"Бир кезде эки улак ары-бери карап, чоң ташка чыга калса, карышкыр турат."},{"t":"p","h":"– Кардым ачып турду эле, мындай жакшы иш болобу? Мен силерди жеймин, – дейт карышкыр."},{"t":"p","h":"Анда ак улак:"},{"t":"p","h":"– Кашаба аке, тетиги дөбөнүн түбүндө бизди айбандардын падышасы Арстан күтүп жатат. Биз ошол арстанга жем болгону баратабыз. Сиздин бул кылыгыңызды билсе, ачууланары белгилүү. Мейлиңиз, жесеңиз жеңиз..."},{"t":"p","h":"Аңгыча, коркуп кеткен кара улак: «Арстан, арстан, бизди карышкыр жегени жатат. Мынакей», – деп кыйкырып жиберди. Карышкыр ага ишенип, куйругун кыпчып качып жөнөдү."},{"t":"p","h":"1. Жомокто эмне жөнүндө сөз болду? 2. Айтылышы, жазылышы түрдүү болгон сөздөр бар бекен? Алар кайсылар? Таап, түшүндүргүлө."},{"t":"p","h":"<span class=\"pg\" data-n=\"16\">16<\/span>28-көнүгүү. Ырды окугула, андан жогорудагыдай көрүнүштөргө мисал тапкыла."},{"t":"h3","h":"ЖОГОЛГОН УЛАКТАР"},{"t":"v","l":["Болот абдан так эле,","Болот абдан сак эле.","Өзү багып чоңойткон,","Үч улагы бар эле."]},{"t":"p","h":"Бирок Болот бир жолу, Улактарын карабай Уктап, уктап калыптыр, Уят болду аябай!"},{"t":"v","l":["Үч улактан башкасын,","Бүт жоготуп алыптыр...","Кана, балдар, Болоттун","Канча улагы калыптыр?"]},{"t":"p","h":"А. Рыскулов"},{"t":"p","h":"29-көнүгүү. Айтылышы жана жазылышы эки башка болгон сөздөрдөн бешти жазып келгиле."},{"t":"p","h":"Билип алалы!"},{"t":"p","h":"Улуу адамдар силердей кезинде кандай болгон?"},{"t":"h3","h":"СЕРГЕЙ ЕСЕНИН"},{"t":"p","h":"Орустун белгилүү акыны көгүчкөндөрдү жанындай көрчү дешет. Айылда чоңойгондуктан, кичинекей Сережа таң эртеден жатарга чейин көгүчкөндөр менен алек болучу. Көгүчкөндөр да Есенинди айылдын бардык бурчунан таап алышчу. Кээде кечирээк ойгонуп калса, көгүчкөндөр анын терезесине келип, гүүлдөп, өздөрүнүн досунун ойгонор маалын күтүп турушчу экен."}],"sub":[{"title":"СҮЙҮНЧҮ АЙТУУ","b":13},{"title":"АК УЛАК МЕНЕН КАРА УЛАК","b":28},{"title":"ЖОГОЛГОН УЛАКТАР","b":37},{"title":"СЕРГЕЙ ЕСЕНИН","b":45}],"pages":[13,16]},{"title":"§ 5. СӨЗДӨРДҮН МУУНГА БӨЛҮНҮШҮ. МУУНГА БӨЛҮҮ ЭРЕЖЕЛЕРИ","blocks":[{"t":"h3","h":"§ 5. СӨЗДӨРДҮН МУУНГА БӨЛҮНҮШҮ. МУУНГА БӨЛҮҮ ЭРЕЖЕЛЕРИ"},{"t":"p","h":"30-көнүгүү. Төмөндөгү сөздөрдү үлгү боюнча муундап окугула. Кандай муундар экен, эсиңерге салгыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"17\">17<\/span>Үлгү: ак-ча, ты-йын, ян-варь."},{"t":"p","h":"Сөздөрдү ыргагына жараша айтууга үйрөнөлү."},{"t":"p","h":"Балалык, саан, сентябрь, октябрь, май, жаңылык, фломастер, жаңы жыл, кубаныч, сүйүнчү, булбул, Арсланбап, «Ак шоола», коңгуроо, көңүлдүү, жаан."},{"t":"p","h":"31-көнүгүү. Сүрөттөгүлөрдүн атын үн ыргагына жараша туура айткыла. Аларды катыштырып, сүйлөмдөрдү түзгүлө. Сөздөрдү муундарга ажыратып, жазып көрсөткүлө."},{"t":"img","src":"data:image/webp;base64,UklGRtoLAABXRUJQVlA4IM4LAABwZACdASoZAdoAPrVOnkmnKCamsLVK+QAWiWVudzbNBNGHFnle/4f9wO8ZlEuH74AsxP/v6I/jv/Zri86df6sy6oADNMjNHso2yDalQb7TWMohbiGys/5h75P7AJov+4Bjv1j7onRNInNBf0LNiRvOy6/yFJ8kswqq3rnajPSAeKzqojkmHooACdZWuwfeYknRUT6IvTjHI9oLzTSFetosXPiQeTkivxfj4X3TzCjTtB1KQFBWdl7xwPAVHB9oytI2jDDjk9TU33ViJBIncGiE0GU3BrHPyTGo0fNNEn8Mt9IjrW7X9IcEOECSp5jKa8kMeSHKem4AsbJM5WsokGoq6OkewkRBQmGnXoV/r3IBjauhqDcGT59/vCjTLCoW+rkNpT2DQ++cR5aN4szifIlO3Hz3wMq+VdWT5noanaJzOjrOmcl5VxV/D2dAf9tvCrFeqSR+eyA5JBFjwtOo1Rty0Z+oOigdHiRs/eKbMB23e3L9Mi31QS1XX+SNt+tQ1xNtCsUoX2H73pJIlfnlYCadrqADJ2w/0U5aYCErbhIC+iZH53/MQSMb8T79Z6sI5xBLiCW3mHbwumdBDsMYvMZlTnceUTSuQdYh7iBdlfPkw9qwHYXsKNxpA0ar4hXQxYy4/0VWfmqAtaSL690MSG6lJKw9gC22Vfe8ubKTt7l+OtDhgSA4xnEEZAuJ8tQEX+H5YiDMKOkZt7+Q6CdqGiPdo639nf1/mUm0TosTk7ULU0JXRQqOGRp1ymQXnDW7gqqGUdQqlW8h2IFV8lvL/IaxQgTyuvHw+CJYBhEYDvdxzUtFhroA9W2cnUvpGzrGFUfRINz5fELl5pdq1Nz3h АНА ТҮРЛӨРҮ"},{"t":"p","h":"34-көнүгүү. Төмөнкү сөздөрдү муунга ажыратып, кандай муун экенин эсиңерге салгыла."},{"t":"p","h":"Муундун кандай түрлөрү бар эле, эсиңердеби?"},{"t":"p","h":"<span class=\"pg\" data-n=\"19\">19<\/span>Аба, Кубат, асман, тактай, тарс, Асанаалы, Ырыс, коркпо, көркөмдүү, жүз аарчы, туш туурдук, боз үй, класс, жыйын, калыстык."},{"t":"v","l":["Эсиңерге туткула!","Муун бир же бир нече тыбыштардан түзүлөт."]},{"t":"p","h":"1. Бир гана үндүү тыбыштардан түзүлгөн муундар ачык муундар болот."},{"t":"p","h":"Мисалы: Аа-лы, э-лек, У-лан."},{"t":"p","h":"2. Үндүү менен башталып, үнсүз менен бүткөн муундар жабык муундар деп аталат."},{"t":"p","h":"Мисалы: Ат, ак, эл, уул, уй."},{"t":"p","h":"3. Үнсүз менен башталып, үнсүз менен аяктаган муундар туюк муундар деп аталат. Мындай муундар эне тилибиздеги сөздөрдөн да, орус тилинен кирген сөздөрдөн да учурайт."},{"t":"p","h":"Мисалы: жалт, квас, тарт, галстук, транс-порт."},{"t":"p","h":"35-көнүгүү. Төмөнкү сүйлөмдөрдү муундарга туура бөлүп, Муундун түзүлүшү жана түрлөрү боюнча схемага карап иштегиле. Муундарга мүнөздөмө бергиле."},{"t":"p","h":"Муундун түзүлүшү (1, 2, 3, 4–5 тыбыштан) жана түрлөрү:"},{"t":"p","h":"ачык: 1 тыбыштан – а-ба; 2 тыбыштан – ба-ла, ма-га."},{"t":"p","h":"жабык: 2 тыбыштан – ут, Ош, ат; 3 тыбыштан – ант, эрк."},{"t":"p","h":"туюк: 3 тыбыштан – Биш-кек, кат, бак; 4–5 тыбыштан – кант, транс-порт."},{"t":"p","h":"<span class=\"pg\" data-n=\"20\">20<\/span>1. «Байчечекей» – бөбөктөрдүн сүйүктүү журналы."},{"t":"p","h":"2. Асманды ала булут каптап турат."},{"t":"p","h":"3. Мылтык атылып, «тарс» деген үн чыкты."},{"t":"p","h":"4. Түндө ай жарыкта жылдыз курт жылт-жылт этип көрүнөт."},{"t":"p","h":"5. Циркте жаш бала талкаланган айнекти жылаңайлак тебелеп, өнөр көрсөттү."},{"t":"p","h":"36-көнүгүү. Өзүңөрчө бир, эки, үч, төрт муундан турган сөздөрдү катыштырып сүйлөм түзүп, талдап бергиле."},{"t":"p","h":"37-көнүгүү. Төмөнкү аталардын сөзүн окуп, сөз маанисин түшүнгүлө. Кара тамга менен берилген сөздөргө муундук талдоо жүргүзгүлө."},{"t":"v","l":["Кулагыңа кумуш сырга!","«Бул китепке тишиң өтөбү?»"]},{"t":"p","h":"Тишиң өтөбү? – деген кепти укканда, кээ бир бала: «Мен эмне, аны тиштеп көрмөк белем?» – деп таң калышы мүмкүн. А чынында, ал «бул китепти окуп, маанисин түшүнгөнгө акылың жетеби?» деген эле кеп. Сөз канчалык таамай айтылса, ал ошончолук жугумдуу да, унутулгус да болот."},{"t":"p","h":"Т. Самудинов"}],"pages":[19,20]},{"title":"§ 7. СӨЗДӨРДҮ ТАШЫМАЛДОО ЖАНА АНЫН ЭРЕЖЕЛЕРИ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"21\">21<\/span>§ 7. СӨЗДӨРДҮ ТАШЫМАЛДОО ЖАНА АНЫН ЭРЕЖЕЛЕРИ"},{"t":"img","src":"data:image/webp;base64,UklGRkIJAABXRUJQVlA4IDYJAABQNgCdASqAAkIAPrVUpEunJSOipBhc+OAWiWltxPU9rhZ//0+GRrnyNf8P4jw/edMPtr0uRsHsfKOsP/EeHvjN9lZylbhgj+d/Qnvt+HSiC4O7496fqQKxdArySf7jzdtXkazGi2J994KWPjEGGk1lG1WK+mPVjqZnSfa3KzHUzPj0M9WOrUwS4Ok6t2wyoV2t/YIL1cR5JTC5si4w6D4l0Ch8FO29MVG26vF4BqmNFP2hRLIpwUQv6su6aZv356q0le8BNKgMpnuris0tnRzA9KZLj+WjFPsCNjcBj56nufxzBj7oBNiI1zGHF70jIPj/mOap8ldsYHEImjIXWVNwWCxJshCAMhy5sv7ZuqdOAGnrj3WJBpLBRjMb3qQGtG7FKbQfScYHwL7SxVyNPxPACBmxrqvvwKrKFiXVZsdwfkb+zP0/Xos9LGL+pMRhlaqQMXnR/rNAxkAEpJ6yZ9KyCmIAwGXx+x1ec5znAr7kL47imdMBK/GjIBMUg5tcfvhKBkLd85sw3KQk2E2jpj1Y6mR4IcvvOLGgsIfY7F92JRJ23zQOsK7Nb77tQe3S0IScahCG5h90kd+vMAD+/PDX/7D5EMpuK4CiAbzDErum43tsEQHWZINkp7y9GlH03U5It8hSJ9j1E7go107SU67pZHVIqD9sD9shknGGl9lQvnOntfcl+8iyYMjrC2V6jMz176mO7q18m5AeSa7m3K20u7iRLvuFBCd2S4xpGlcc4fTUU2cjLDVtlyNkioCaFYbr6R6sZOEgy2NtSxyWA9hgjYRDxAJa03h8ycZDvFQ290eGUmoRzOUR8ylPSurpJZ9DZTDHT58m6Laq/wnl4ntpC6lxGf6SxPdyO5KzviFE2vgTRSUMxOEgB/wI9Rij5YNxJF5M51uR2LfYB4svy74NQfxpP/Au9RL+lKiKm8QvU2wCQ5DdLLghQ9U+FdECfyZupbJ+Tbl/Q5j33QMG6AOlqgytSHUcH6+QfMLPLEDzsnblGWg8brZFM+4oVR7n2XF3Me3241NzK/3vzT/RXxFidiRu9Zc64budNed9B+2zXO5ZgwRNvW80ua2GpkGCKqqX61FmueHiMz0wEK315ehCtWlavlHMKZp84/vPoE9GVrKjM5aB1iPl0gdIBCYtfySleRTYY5zWkyMZsl27vuDQNk48tzvi9ny704DzrKewOPmPeuXJYPv/P4YpyCjNRarx1br24yexzEX3/Al8MW7Up7MN8pVQOH28zubgRMBuOUR4LpPdWIl/JCagi8V65Q38JH7lwzf531fbATCebc2q6ZzMFVqaJ ":"p","h":"Мисалы: өрт, эч, бал, жыл, спорт."},{"t":"p","h":"2. Бир тамгадан турган муундарды жолдун аягы же башына бөлүп жазууга болбойт."},{"t":"p","h":"Мисалы: Ө-мүрбек, у-бада, насы-я."},{"t":"p","h":"38-көнүгүү. Сүйлөмдөрдү жазгыла, кара тамга менен берилген сөздөрдү эрежеге ылайык туура ташымалдоого үйрөнгүлө."},{"t":"p","h":"1. Мен акын Б. Сарногоевдин «Эне тил» деген ырын окудум. 2. Күзгү түшүм майрамы өткөрүлдү. Ал майрамды кыргыздар «чечкор» деп аташкан. 3. Жаз – жарыш, күз – күрөш. 4. Жайында бели ийилбегендин, кышында чекеси жылыбайт."},{"t":"v","l":["Эсиңерге туткула!","3. Созулма үндүүлөр бөлүнүп ташымалданбайт."]},{"t":"p","h":"Мисалы: то-олор эмес, тоо-лор, тала-алар-га эмес, талаа-ларга."},{"t":"p","h":"4. Сөз ичинде ь, ъ белгилери өзүнөн мурдагы муундан бөлүнүп ташылбайт."},{"t":"p","h":"Мисалы: пал-ьто эмес, паль-то, ал-ьбом эмес, аль-бом."},{"t":"p","h":"<span class=\"pg\" data-n=\"22\">22<\/span>39-көнүгүү. Төмөнкү текстти окугула. Кара тамга менен басылган сөздөрдү дептериңерге көчүрүп, туура ташымалдоого үйрөнгүлө."},{"t":"h3","h":"ЭНЕНИН СҮТҮ"},{"t":"p","h":"Эненин сүтү ымыркайлар үчүн аш болумдуу, сапаттуу тамак болуп эсептелинет. Сүттө баланын организмине эң керектүү жана пайдалуу болгон витаминдер көп. Алар баланын туура өсүшү үчүн эң зарыл."},{"t":"p","h":"Эне сүтүн эмген баланын организминде бардыгы жетиштүү болуп, туура өсүп чоңоёт. Итий оорусу менен оорубай, дени сак өсөт. Эне сүтү баланын денесин сырттан таасир этүүчү бардык жугуштуу оорулардан да сактайт."},{"t":"p","h":"Ошол үчүн эне сүтү – адамдын өмүрүндөгү эң баа жеткис нерсе. Ал баланын эң биринчи оозанган эң ыйык өмүр азыгы. Эненин сүтүн татыктуу бала гана актайт."},{"t":"p","h":"41-көнүгүү. Сөздөрдү катыштырып сүйлөм түзгүлө да, тууралап ташымалдап көрсөткүлө."},{"t":"p","h":"Радио, поезд, циркуль, люстра, подъезд, мээрим, пайдалуу."},{"t":"p","h":"42-көнүгүү. Ырды окуп, алды сызылган сөздөрдү оозеки ташымалдап айтып бергиле. Обонун жаттап, ырдап бергиле."},{"t":"h3","h":"МУГАЛИМ"},{"t":"v","l":["Аруу тилек балага,","Агай, эжей дедирген,","Билбегенин билгизип,","Билим балын жедирген","Мактоо сага – мугалим.","<span class=\"pg\" data-n=\"23\">23<\/span>Эне-атадай кам көрүп,","Эресеге жеткирген.","Күлмүң көздүү бөбөктү,","Гүлдөй сылап өстүргөн","Алкыш сага – мугалим.","","Акыл жолун таанытып,","Адеп менен сүйлөткөн.","Ата Журтка жарашкан,","Адам бол – деп үйрөткөн","Таазим сага – мугалим.","С. Рысбаев"]}],"sub":[{"title":"ЭНЕНИН СҮТҮ","b":13},{"title":"МУГАЛИМ","b":20}],"pages":[21,23]},{"title":"§ 8. СӨЗ МҮЧӨЛӨРҮ ЖАНА АЛАРДЫН ТҮРЛӨРҮ","blocks":[{"t":"h3","h":"§ 8. СӨЗ МҮЧӨЛӨРҮ ЖАНА АЛАРДЫН ТҮРЛӨРҮ"},{"t":"p","h":"? Эсиңердеби? Сөз кандай бөлүктөрдөн түзүлөт?"},{"t":"p","h":"Уңгу жана мүчө деп эмнени айтабыз?"},{"t":"p","h":"43-көнүгүү. Төмөндөгү сөздөрдү окугула. Уңгу түрүндөгүлөрдү, мүчө улангандарды өз-өзүнчө бөлүп жазгыла."},{"t":"p","h":"Китеп, китептен, бала, балдар, кеме, кемеде, тоо, тоого, камчы, камчыла, ил, илгич, кымыз, кымыздай, бал, балчы, машина, машинада, күч, күчтүү, бакыт, бактылуу."},{"t":"p","h":"Үлгү: уңгу сөздөр – китеп, жазуу; мүчө уланган сөздөр – китептен, жазуучу."},{"t":"img","src":"data:image/webp;base64,UklGRoQIAABXRUJQVlA4IHgIAACwNgCdASo1AYwAPrVUpUsnJSenp7rLQPAWiWlubAbdidEKm/CpxAku7XJD7WUJu7vGzvn+TSlFseMuHr1RWWl7mto27EKzOh9/HEupP4pK2d+ePXYaEEr13aW5vuc+cPTvFzjraMaCO0wvcjCdbUXwjHkyrU56HrTa1mR1EM6g9htAO3kkQGaUIUSPZsqD1BdgugYOhKE43/wCPLD3WHv3YLZOyc4964+oGCy8ynO50CCXXXfSBvWGHfw8u+mCWLkk0Qb4b4xUt+UgkSvvgZ5FnQUMAFhF/Yf8KeUUP9aKknBpRDIwgZqxW6dW5F7XVzKDKt89WOg8N7x31qxoatvyc5XeLmsMPRhUIQha5X6GEI/0Oukq9HXWLOwTBcye2zz8R2VYV8oPV7XXfEaMmL8DjkP8iDlKQvhgs1jQwPrE/FldqKZxGqQ1qaz75xZp3HxD8wRAGc1TXsRjmo0PTME2sw/ltix2uF+S6daSSL4PUSKi95l8JKibzuIC1OEqFg2/L4nWT/ozsSyHtQ+/fIfceKoVRondL4Uy6UHc9Ivq7kG2Ezficqb51V7xYUA7UiQbu/LjlGbLl3DPJg/TAAD+/RxE0466f+Jen8ZNFgOZL7nshtNllu8oGWYq+0tRqShzjE6UW2oXUC9MFku5kxfpqbNZjqW+E23BMsYpD920fNkcm/PAUkKFWpT+u7z9sqRDt8fSHFGeIAeY0yPnuS5WfiP1+ko8b5rKwYTiCaWjgArBiZQjSfGDDP7G9C+gneVUCY9V1Q0aIVSA4AMGRAIrFzXKrIQ bwX7GWmgNKkiakKWpGf12O+2AqC17O+5z8u4CTvVq3g1Yyo8PNpusTGJnXp93rSrAp3VyUNFlvz3/bq9q3yIeZyCkdgAAAA==","w":309,"ht":140},{"t":"p","h":"45-көнүгүү. Таблицаны карагыла. Андагы уңгу жана мүчө уланган сөздөрдү байкагыла. Мүчө уланып, экиге бөлүнгөн сөздөрдү бири-биринен айырмалап салыштыргыла да, сүйлөм түзүп түшүндүргүлө."},{"t":"p","h":"<span class=\"pg\" data-n=\"24\">24<\/span>Уңгу сөздөр – мүчө уланган сөздөр (уланды, куранды):"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>суу<\/td><td>сууга<\/td><td>суучул<\/td><\/tr><tr><td>көз айнек<\/td><td>көз айнекти<\/td><td>көз айнекчен<\/td><\/tr><tr><td>алтын<\/td><td>алтындан<\/td><td>алтындай<\/td><\/tr><tr><td>дос<\/td><td>досум<\/td><td>достош<\/td><\/tr><tr><td>кап<\/td><td>капты<\/td><td>кабанаак<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"кыргыз – кыргыздар – Кыргызстан; казак – казактар – Казакстан"},{"t":"p","h":"Үлгү: Өзөндө тунук суу агып жатат. Гүлнар эки чака алып, сууга жөнөдү. Суучулдар көл жээгинде дайыма жардамга даяр турушат."},{"t":"p","h":"Салыштыргыла: 1-бөлүктөгү мүчөлөр сөздүн формасын өзгөрттү. 2-бөлүктөгү мүчөлөр сөздөрдүн маанисин өзгөрттү, жаңы сөз жасалды."},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Сөз мүчөлөрү уланды жана куранды мүчөлөр болуп, экиге бөлүнөт."},{"t":"p","h":"Уланды мүчөлөр сөзгө уланып, анын формасын гана өзгөртөт."},{"t":"p","h":"Мисалы: оку, окуду, окуба ж.б."},{"t":"p","h":"Куранды мүчөлөр сөзгө жалганып, анын маанисин өзгөртөт, жаңы сөз жасайт."},{"t":"p","h":"Мисалы: шаар – шаардык (шаардык адам), токой – токойлуу (токойлуу жер)."},{"t":"p","h":"46-көнүгүү. Өз алдыңарча -луу, -лык, -дай, -чы, -стан мүчөлөрүн катыштырып, бир нече мисал түзгүлө."},{"t":"p","h":"<span class=\"pg\" data-n=\"25\">25<\/span>Машыгуу сабагы"},{"t":"p","h":"Эне тилибиз бизге эмне үчүн керек?"},{"t":"p","h":"47-көнүгүү. Текстти көрктүү окугула да, тапшырмаларды аткаргыла."},{"t":"h3","h":"ЭНЕ ТИЛИҢЕРДИ БИЛГИЛЕ, БАЛДАР!"},{"t":"p","h":"Мен бир жолу аялдамада отургам. Жанымдагы кыргыз балдар-кыздары орусча сүйлөшүп жатышты."},{"t":"p","h":"– Силер өз эне тилиңерди билбейсиңерби? – дедим аларга карап."},{"t":"p","h":"– Билебиз, бирок орусча жакшыраак сүйлөйбүз – дешти алар, – бакчада, мектепте орусча окудук. Үйдө да ата-энебиз орусча сүйлөшөт."},{"t":"p","h":"Мына, көрдүңөрбү, бул алардын өз эне тилин сыйлабаганы, маданиятсыздыгы!"},{"t":"p","h":"Кишинин маданияты – анын сүйлөгөн сөзүнөн байкалат. Ойкуштантып сүйлөп, мода кууп кийинүү – жарабаган нерсе."},{"t":"p","h":"Бирок жалгыз эне тил менен гана калууга болбойт. Колуңардан келишинче орусча, япончо, англисче окуп үйрөнгүлө. Канча тил билсеңер – ошончо маданияттуу болосуңар."},{"t":"p","h":"1. Эне тилди сыйлабагандык эмненин белгиси деп макалада айтылып жатат? 2. Көп тил билүүнүн мааниси эмнеде экен?"},{"t":"p","h":"3. Кара тамга менен жазылган сөздөрдү уңгу-мүчөгө ажыратып, мүчөлөрдүн түрлөрүнө жараша бөлүп жазгыла."},{"t":"p","h":"Уланды мүчөлөр уланган сөздөр: мектепте"},{"t":"p","h":"Куранды мүчөлөр уланган сөздөр: орусча"},{"t":"p","h":"<span class=\"pg\" data-n=\"26\">26<\/span>Сөз мүчөлөрүнүн кандай түрлөрү бар экен?"},{"t":"p","h":"48-көнүгүү. Табышмактарды окуп, жандырмагын тапкыла. Алардан куранды, уланды мүчөлөр уланган сөздөрдү таап, түшүндүргүлө."},{"t":"h3","h":"КЕЛГИЛЕ, МЕЛДЕШЕЛИ"},{"t":"v","l":["Үйдү кайтарат,","Ошентип жан багат.","Чөп жебес жандыкты","Ойлонуп ким табат? (..)","","Ачпасаң тынч жатат,","Ачканда сыр чачат.","Дүйнөнү таанытып,","Жыргатып чер жазат.","Суюктук, даамы жок,","Билинбейт түсү.","Жашоо жок ансыз,","Ошондо анын күчү. (...)","","Из калтырып ак карга,","Оң колумда жорголойт.","Жандырмагын тапканча,","Ким кандайча ойлонот."]},{"t":"p","h":"49-көнүгүү. Төмөнкү сөздөргө жалганган мүчөлөргө көңүл бөлөлү, бир эле сөз кандай болуп өзгөргөнүн байкап, айтып бергиле."},{"t":"p","h":"1) Алмага, алманын, алмадан, алманы; окуучуну, окуучубуз; окуунун, окууну, окуудан; бутакта, бутактар, бутакка, бутакты, бутактан."},{"t":"p","h":"2) Суулуу, суучул, суудай; койлуу, койдой, койчу; көзгө, көздөй, көздүү; машинадай, машиналуу, машинасыз; үндүү, үнсүз, үндөө."},{"t":"p","h":"50-көнүгүү. Жогорудагыдай мүчөлөр жалганган бир нече сөздү катыштырып, сүйлөм түзгүлө."}],"sub":[{"title":"ЭНЕ ТИЛИҢЕРДИ БИЛГИЛЕ, БАЛДАР!","b":23},{"title":"КЕЛГИЛЕ, МЕЛДЕШЕЛИ","b":36}],"pages":[24,26]},{"title":"§ 9. УҢГУЛАШ СӨЗДӨР. УҢГУЛАШ ЗАТ АТООЧТОР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"27\">27<\/span>§ 9. УҢГУЛАШ СӨЗДӨР. УҢГУЛАШ ЗАТ АТООЧТОР"},{"t":"p","h":"2-класста таанышкан уңгулаш сөздөрдү эсиңерге түшүргүлө. Оозеки мисал келтирип, алар кантип түзүлөрүн түшүндүргүлө."},{"t":"p","h":"51-көнүгүү. Төмөндөгү сүйлөмдөрдү окугула. Байкагыла, алардын маанилерин жакындаткан кандай белгилер бар экенин айтып бергиле."},{"t":"p","h":"1. Күзгү буудай башын ийип бышып турат. Темирландын агасы институтта бөлүм башчы болуп иштейт. Акылман адам гана элди жакшы турмушка баштап барат. Кумардын кашка эркечи аябай баштаак."},{"t":"p","h":"? Бир уңгудан бир нече жаңы сөз түзүүгө болот бекен?"},{"t":"p","h":"2. Бакыт-Сабыр аксакалдын баласы. Бул Аскербек деген бала. Эх, балалык, кандай гана бактылуу кез. Бала чакта үйрөнгөндөр – бардык билимдин негизи болот."},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Мааниси жакын, уңгусу бир болгон бир нече зат атооч сөздөрдү уңгулаш зат атоочтор деп атайбыз."},{"t":"p","h":"Мисалы: бала, балачак, балалуу, балалык; жылдыз, жылдыздуу, жылдыздай."},{"t":"p","h":"52-көнүгүү. Сөздөргө мүчөлөрдү схема боюнча улап окуп, уңгулаш зат атооч сөздөрүн катыштырып, оозеки сүйлөм түзгүлө."},{"t":"p","h":"суу – лук, чул, дай, луу; кар – дуу, дай, да, дуу; <span class=\"pg\" data-n=\"28\">28<\/span>көз – дүү, дө, дөй; китеп – тей, көй, түү."},{"t":"p","h":"53-көнүгүү. Берилген -лык, -чы, -кер, -луу-, дай, -кеч деген мүчөлөрдү сөздөргө жалгап, уңгулаш зат атооч сөздөрдү түзгүлө."},{"t":"p","h":"Базар, кой, араба, кызмат, бадал, тоо, булут, жылкы, кыял, таалай, жибек, кубат, шаар."},{"t":"p","h":"Үлгү: араба + кеч = арабакеч"},{"t":"p","h":"54-көнүгүү. Текстти окугула да, андан уңгулаш зат атоочторду таап, мүнөздүү белгилерин түшүндүрүп бергиле."},{"t":"h3","h":"МУРАС"},{"t":"p","h":"(жомок) Илгери бир абышка-кемпир болуптур. Бир күнү дүйнөдөн өтүшөт. Үч баласы алардан калган мурас байлыкты бөлүшө турган болушат."},{"t":"p","h":"– Мен – улуусумун, мен – негизги мураскормун. Үйдү мен алайын, – дейт улуу баласы."},{"t":"p","h":"– Жок, сен башка байлыктарды ал, үй меники болсун, – дейт ортончусу."},{"t":"p","h":"– Мага өлүү оокаттын кереги жок. Атабыз абдан мээнеткеч эле, энебиз абдан мээримдүү болчу. Мага атабыздын мээнеткечтигин, энебиздин мээримин бергиле, – деди эң кенжеси."},{"t":"p","h":"? 1. Агалары оокатка көздөрү өткөн кандай адамдар экен?"},{"t":"p","h":"2. Сага кичүү уулунун айтканы жактыбы?"},{"t":"p","h":"55-көнүгүү. Уңгулаш зат атоочторду катыштырып, беш сүйлөм түзүп келгиле."}],"sub":[{"title":"МУРАС","b":15}],"pages":[27,28]},{"title":"§ 10. УҢГУЛАШ СЫН АТООЧТОР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"29\">29<\/span>§ 10. УҢГУЛАШ СЫН АТООЧТОР"},{"t":"p","h":"56-көнүгүү. Төмөндөгү сөздөр кандай белгилери менен маанилеш экендигин түшүндүрүп бергиле."},{"t":"v","l":["кызыл – кызылыраак – кыпкызыл","жашыл – жашылыраак – жапжашыл","көк – көгүрөөк – көгүш – көпкөк","кара – каралжын – капкара","чоң – чоңураак – эң чоң","","Уңгулаш сын атооч сөздөр кантип түзүлөт?"]},{"t":"p","h":"57-көнүгүү. Сүйлөмдөрдү окугула. Андагы уңгулаш сөздөрдү таап, үлгүдөгүдөй иштегиле."},{"t":"p","h":"1. Бутактагы кызыл-кызыл алмаларга Айгүлдүн көзү түштү. 2. Биздин бакчабыздын алмалары кызарып бышты. 3. Мен табактагы алмалардын кызылыраагын тандап алдым. 4. Биз мектепке дайыма ак көйнөк кийип келебиз. 5. Таң агарып атты. 6. Бекжандын бою Кубанычтын боюнан кыска. 7. Күз келип, күн кыскарды."},{"t":"p","h":"Үлгү: Биз терезелерди бекемдеп, классыбызды жылууладык. Классыбыз бүгүн жылуу."},{"t":"p","h":"58-көнүгүү. Жогорудагыларга карап, бир нече сөздөрдү катыштырып, сүйлөмдөрдү түзгүлө. Алар уңгулаш сөздөр болгудай иштегиле."},{"t":"p","h":"59-көнүгүү. Текстти окуп, тапшырмаларды аткаргыла."},{"t":"h3","h":"БАРСБЕК – КЫРГЫЗ КАГАНЫ"},{"t":"p","h":"Кыргыз эли – дүйнөдөгү байыркы элдердин бири. Биздин ата-бабаларыбыз мындан жыйырма эки кылым мурда эле өз алдынча мамлекет болгону тарыхта белгилүү."},{"t":"p","h":"<span class=\"pg\" data-n=\"30\">30<\/span>Барсбек хандыкка көтөрүлүп, эли-жерин каармандык менен коргогон. Ошондуктан ага эл Ынанчы Алп Билге деген улуу наам берген. Анын мааниси – баатыр жана акылман дегенди түшүндүрөт."},{"t":"p","h":"Душмандар кыргыздардын өзүнчө мамлекетине ээ болгонун көрө алышкан эмес. Капарсыз тынч жатканда түн ичинде басып киришип, айыгышкан согуш болот."},{"t":"p","h":"Ошондо күчтүү жоо кыргыздарды жеңип, Барсбек баатырдык менен курман болгон."},{"t":"p","h":"Бул окуя – кыргыз тарыхындагы бир гана учур. Каарман ата-бабаларыбыз мамлекеттүүлүгүн сактап кала алышып, бүгүнкү күнгө жетти."},{"t":"p","h":"1. Текстте кайсы эл жөнүндө, кайсы баатыр тууралу сөз болду? 2. Алды сызылган сөздөргө муундук талдоо жүргүзүп, түшүндүрүп бергиле. Алар кандай сөздөрдөн кантип жаралганын мүчөлөрүнө карай түшүндүргүлө."},{"t":"p","h":"60-көнүгүү. Бул сөздөрдү да жогорудагыдай өзгөртүп, оозеки айтып бергиле."},{"t":"p","h":"Сары, таттуу, ачуу, жаңы, кычкыл, кубанычтуу, кызыктуу, кооз, сулуу."},{"t":"p","h":"61-көнүгүү. Ырды окугула. Андан уңгулаш сын атооч сөздөрдү таап, маанисин түшүндүргүлө."},{"t":"h3","h":"СУР"},{"t":"v","l":["Таза күлдүн өңүндөй,","Аралашкан ак-кара.","Түстү берет сур деген,","Окшобогон башкага."]},{"t":"p","h":"Ат да болот өңү сур, Көктө каалгыйт сур булут. Суру качуу деген сөз – Коркуу үрөй учуруп."},{"t":"p","h":"Түшүнөбүз катаалды,"},{"t":"v","l":["Сурун салуу дегенде.","Ар маанилүү сөздөр көп,","Сөз сүйлөөрдө чеберде."]},{"t":"p","h":"Ы. Кадыров"}],"sub":[{"title":"БАРСБЕК – КЫРГЫЗ КАГАНЫ","b":8},{"title":"СУР","b":18}],"pages":[29,30]},{"title":"§ 11. УҢГУЛАШ САН АТООЧТОР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"31\">31 "(Жомок) Илгери бир көпкөлөң жигит жолдоштору менен алыска жол жүрөт. Жакшы багылбай, табынан кеткен күлүгү жүрбөй калат. Жигит жинденип, атын сабайт. Байкуш ат басмак турсун, мөгдөп жерге жыгылат. Ошондо алиги көпкөлөң жигит атты таштап, коштоп жүргөн атын минип жолун улайт."},{"t":"p","h":"<span class=\"pg\" data-n=\"33\">33<\/span>Ошол кезде кой айдап жөө келаткан бир кедей жигит атты көрөт да, жетелеп барып оттотуп, булактан сугарат. Эс алдырып, жакшылап багат. Ат бат эле тыңып, көркүнө чыгат. Күлүк ат болот."},{"t":"p","h":"Бир күнү чоң той болуп, кедей жигит атын байгеге кошот. Ат алдыга озуп келип, ээсин байгелүү кылат. Кедей жигиттин кубанычы койнуна батпай турса, мурдагы ээси келип, «Атыңды мага сат» дейт. Жигит «сатпайм» дейт. Ошондо бай жигиттин жолдошу атты таанып: «Бул баягы, сенин таштап кеткен атың, го,» – дейт. Жакшылап караса, ал чын эле өзүнүн аты экен. Жигит ошондо өз кылганына өкүнүп, бармагын тиштептир."},{"t":"p","h":"1. Жомокто эмне жөнүндө сөз болду? Көпкөлөң жигит ат кадырын кантип билди? Ал эми өз атын ала алабы? Ойлонуп көрчү. 2. Кара тамга менен берилген сөздөрдү окугула да, уңгулаш сөздөрдү аныктагыла. 3. Текст боюнча чакан изложение жазгыла да, көркөм окуп бергиле."},{"t":"p","h":"68-көнүгүү. Өз алдыңарча уңгулаш этиштерден мисал түзгүлө."}],"sub":[{"title":"АТ СЫЙЛАГАН ЖӨӨ КАЛБАЙТ","b":5}],"pages":[33,33]},{"title":"§ 13. СӨЗ ТҮРКҮМДӨРҮ Зат атооч","blocks":[{"t":"h3","h":"§ 13. СӨЗ ТҮРКҮМДӨРҮ Зат атооч"},{"t":"p","h":"69-көнүгүү. Текстти ой жүгүртүп көрктүү окугула да, тапшырмаларды аткаргыла."},{"t":"p","h":"? Зат деген эмне? Анын атын кандай сөздөр билдирет?"},{"t":"h3","h":"АТА-ЭНЕҢ – СЕНИН БАК-ТААЛАЙЫҢ"},{"t":"p","h":"Аба болбосо, адам беш мүнөткө да чыдай албайт. Суу жок болсо, адам беш күнгө зорго чыдайт. Ата-эне да ошондой эле керек."},{"t":"p","h":"<span class=\"pg\" data-n=\"34\">34<\/span>Балдары үчүн ата-эненин эмгегине акча да, алтын да тең келбейт. Ата-эне өмүр бою: «Баламдын курсагы ачып калдыбы, үшүп калбады бекен» – деп санааркап жашайт."},{"t":"p","h":"Өзү кийбесе да, баласына кийгизет. «Мен оорусам мейли, балам оорубасын дейт. Менден да балам өмүрлүү болсун», – деп тилейт."},{"t":"p","h":"А жаман балдар ошол ата-энелерин сыйлабайт. Акарат сөз айтып, карыганда азапка салат. Ошентип жүрүп, ата-энесинен айрылганда гана кадырын ойлойт."},{"t":"p","h":"1. Ата-эне баласы үчүн кандай түйшүккө түшөт? Мээримсиз балдар алардын эмгегин билбей, эмне кылышат? Силерди ата-энеңер кантип чоңойтту? Силер ата-энеңерге кандай мамиле жасайсыңар? 2. Тексттен заттардын аталыштарын тапкыла. Алардын кайсылары жандуу, кайсылары жансыз заттар экенин айтып бергиле."},{"t":"p","h":"70-көнүгүү. Төмөндөгү зат атоочторду катыштырып сүйлөм түзгүлө да, заттарга мүнөздөмө бергиле."},{"t":"p","h":"Нан, алма, машина, булут, окуучулар, достор, кошуна, күчүк."},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Көзүбүзгө көрүнгөн бардык нерсе зат болуп саналат. Заттардын аттарын билдирген сөз түркүмүн зат атооч деп атайбыз. Заттар жандуу жана жансыз деп бөлүнөт."},{"t":"v","l":["Заттык маанини билдирген сөздөр да бар.","Мисалы: бакыт, өмүр, таалай, кыял."]},{"t":"p","h":"71-көнүгүү. Төмөндөгү сүрөттөрдү карап, алар жандуубу, жансыз зат атоочпу, айтып бергиле. Аларга жараша сүйлөм түзгүлө."},{"t":"img","src":"data:image/webp;base64,UklGRqwnAABXRUJQVlA4IKAnAADQOwGdASqXAeEBPrVSo0qnJS8nLhSZseAWiWVu4MIDgctNnlIN2VN59NPRM7ZwfP/+UBvfm0FeUz4//T+C9pyFH9B//nqf71fyHe/eirf/y8f/HjA/++0P4p//9y5Ogf/nrAjVVozpmpWCJo68fg7ubpo/d5zxH7vHBz/astY3SNGm1W8ONLaWFs6dGCK+OM6wNetX073n5UA7o8U3PO51lchJgOizkmAzts2nWq7HjZvwM73AtV/niHTcjUgJdyiV6XJJHmwn8pN3XA8nOL0JkS9W6D5di/tI3b5DXhD2TwCgs+N/mj1SWT9lNSp1tqu1hDFH9slAC9IV4Ym5HrkUMZe2oRTLu2b4wKuD7zA3JJVvKd0l/GK763qYFxVuv/Ifiy2jkj0cHZqba9cFe5ltuHwLo3TNz51mSoDq/2QB2zXDra5sn2WaOyja6Gta/c8pr2/459c3Q8IUYolewYZyFbBvaENUatz9GBA3nC39L1FiXFKWW4nD8E/5klr7XnAYX7MeaNO98XRIv2kYAQszWsSUkfqZ1oh/yrYRR8Ad+UPwqFQGrWxlCIydGUYA2gSRoVmK2u8NXmhGDdKUhsElRJplsz9XEjMWfiGS6r6iB/ffQMGtvgiyYqPSsYYK3tFDlnH/duI+kLRnv+mOkdCqtB7ejL30966Ww л сөздөрдү окугула. Андагы зат атооч сөздөрдүн кайсылары жандуу, кайсылары жансыз заттар экендигине карап, бөлүп жазгыла."},{"t":"p","h":"Жалбырак, чымчык, чымын, самолёт, туман, тебетей, жоолук, Кубаныч, кирпик, самын, таята, булак, саман, уста, ырчы, кат, дос, газета, окурман."},{"t":"p","h":"78-көнүгүү. Жомокту окугула. Тапшырманы аткаргыла."},{"t":"h3","h":"КУЛПУ"},{"t":"p","h":"(Кыял-жомок) Кайсы бир заманда дүйнө элдери үйүн темирден жасалган кулпу деп аталган буюм менен бекитишчү экен. Окууга, жумушка, айылга кеткенде, ал кулпуну ачкыч деген темир менен бекитип, аны чөнтөктөрүнө сала кетишчү. Антпесе үй ичиндеги буюмдарды уурулар уурдап кетишчү экен."},{"t":"p","h":"Жылдар өтүп, адамдар адептүү, нысаптуу болуп, уурулар, колу туткактар жоголуптур. Эч ким бирөөнүн оокатына көз артпай, үйлөргө ууру кирбей калган экен. Ошондон баштап, эч ким үйүнө кулпу салбай, эл бул сөздү унутушкан."},{"t":"p","h":"Ага биринчи ирет кыргыздар үлгү болуптур. Мисалы, кыргыздын боз үйүнө эч качан кулпу салынбайт..."},{"t":"p","h":"1. Тексттен жансыз зат атооч сөздөрдү тапкыла. Аларды уңгу, мүчөлөргө ажыраткыла. 2. Жомоктун маанисин түшүндүргүлө. Адам канткенде уурулукту, адепсиздикти коёт? Өз оюңарды айтып бергиле. Өзүңөрчө жаңы жомок ойлоп таап, жазгыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"38\">38<\/span>Эсиңерге туткула!"},{"t":"p","h":"Жансыз заттардын атын билдирген сөздөр жансыз зат атоочтор деп аталат."},{"t":"p","h":"Аларга буюмдардын, жемиштердин, жашылчалардын, кийим-кече, идиш-аяктардын жана башка көзгө көрүнгөн бардык жансыз заттардын аты кирет."},{"t":"v","l":["Мисалы: көйнөк, алмурут, кызылча."]},{"t":"p","h":"79-көнүгүү. Идиш-аяк, тамак-аштардын аттарынан катыштырып, бир нече сүйлөм түзүп келгиле."}],"sub":[{"title":"КУЛПУ","b":4}],"pages":[37,38]},{"title":"§ 16. ЭНЧИЛҮҮ ЗАТ АТООЧТОР","blocks":[{"t":"h3","h":"§ 16. ЭНЧИЛҮҮ ЗАТ АТООЧТОР"},{"t":"p","h":"80-көнүгүү. Ырды көркөм окугула да, тапшырмаларды аткаргыла."},{"t":"h3","h":"СУУСАМЫР"},{"t":"v","l":["Айланаң тоого курчалып,","Аймагың жаркын нур чалып.","Тартуулап бизге берген жер,","Табигат кооздоп түр салып.","Жер жок го сага барабар,","Жел өткөн мейкин талаалар.","Туз-насип буюруп коюптур,","Турактап келди бабалар.","Суйкайып сулуу элесиң,","Суусамыр бизге энесиң.","Кучактап кысып бооруңа,","Кубат, дем берип келесиң.","Ш. Кулиев"]},{"t":"p","h":"1. Ырда кыргыздын кайсы жайлоосу жөнүндө айтылды? Жер болсо да адам сыяктуу энчиленип ат коюлуп, эл аны унутпай айтып калганын эмне үчүн деп ойлойсуңар? Суусамыр кандай <span class=\"pg\" data-n=\"39\">39<\/span>жайлоо экен? Сүрөттөп айтып бергиле. 2. Ырдан зат атооч сөздөрдү таап, муундарга, уңгу-мүчөлөргө ажыратып, жазып көрсөткүлө."},{"t":"p","h":"? Адам сыяктуу, жердин да, жаныбарлардын да энчиленген аты болот бекен?"},{"t":"p","h":"81-көнүгүү. Текстти окуп, көчүрүп жазып алгыла. Андагы адам аттарын байкагыла. Алар кимдер? Эсиңерге салгыла."},{"t":"h3","h":"МАНАС, АНЫН АТАЛАРЫ ЖАНА БАЛА-ЧАКАСЫ"},{"t":"p","h":"Манас баатырдын атасы – Жакып, чоң атасы – Орозду. Уулу Семетей, небереси – Сейтек, чөбүрөсү – Алымсарык, кибиреси – Кулансарык, эбереси – Оңолкан, эгенеси – Солохан, тегенеси – Акуул, убарасы – Аалы, атанасы – Шаамырза, абарасы – Алаңшаа, чаганасы – Адил хан (Аттила), бегенеси – Амал хан."},{"t":"p","h":"«Кырчын журналы»"},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Адамдардай эле айбанаттардын да, жердин, көлдүн, суулардын да энчиленген аттары болот. Алар ар дайым баш тамга менен башталып жазылат."},{"t":"p","h":"Мисалы: Ысык-Көл, Кумайык, Талас, Нарын, Сулайман тоо, Көкөмерен."},{"t":"p","h":"82-көнүгүү. Өз алдыңарча адамдын, жердин, көлдүн, суулардын, тоолордун энчиленген аттарын катыштырып бир нече сүйлөм түзгүлө."},{"t":"p","h":"83-көнүгүү. Өз айылыңардагы жер аттары, көчөлөрдүн аттары жана коюлуу себептери жөнүндө чакан дилбаян жазгыла."}],"sub":[{"title":"СУУСАМЫР","b":2},{"title":"МАНАС, АНЫН АТАЛАРЫ ЖАНА БАЛА-ЧАКАСЫ","b":7}],"pages":[39,39]},{"title":"§17. ЗАТТАРДЫН ЖАЛПЫ ЖАНА ЖЕКЕ АТТАРЫ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"40\">40<\/span>§17. ЗАТТАРДЫН ЖАЛПЫ ЖАНА ЖЕКЕ АТТАРЫ"},{"t":"p","h":"84-көнүгүү. Таблицаны көңүл коюп окугула, андагы заттардын энчилүү жана жалпы аталыштарын салыштырып, айырмасын белгилегиле. Сөздөрдөн тандап алып, төрт сүйлөм түзүп жазгыла."},{"t":"raw","h":"<h4 class=\"mk\">Заттардын жалпы аталыштары тоо дарыя көчө мектеп көпүрө өрөөн жылкы<\/h4>"},{"t":"v","l":["Заттарга энчиленип","коюлган аттар","Сулайман тоосу","Көкөмерен дарыясы","И. Раззаков көчөсү","Т.Айтматов атындагы мектеп","Үмөтаалынын көпүрөсү","Чүй өрөөнү","Аккула","","? Жалпы ат менен жеке аттын айырмасы кандай?"]},{"t":"p","h":"85-көнүгүү. Төмөнкү жалпы аттарды окугула да, аларды катыштырып, сүйлөм түзгүлө. Андан соң энчилүү ат коюп, салыштырып жазгыла."},{"t":"p","h":"Китеп, ат, бала, газета, журнал, күчүк, суу, көл."},{"t":"p","h":"Үлгү: Мен кызыктуу китеп сатып алдым. Мен «Атадан калган туяк» деген китепти окудум."},{"t":"p","h":"86-көнүгүү. Текстти көрктүү окугула да, тапшырмаларды аткаргыла."},{"t":"h3","h":"ҮМӨТААЛЫНЫН КӨПҮРӨСҮ"},{"t":"p","h":"Көкөмерен дарыясы менен Нарын дарыясынын кесилишкен жеринде бир ажайып көпүрө бар. Аны жергиликтүү калк: «Үмөтаалынын көпүрөсү» – деп аташат."},{"t":"p","h":"<span class=\"pg\" data-n=\"41\">41<\/span>Ал ажайып дегендей эле көпүрө. Көпүрө 1910-жылдарда салынган экен. Аны салган керемет уста Үмөтаалы деген адам болуптур. Үмөтаалы бул көпүрөнү салганда бир да мык, цемент, азыркыдай бекем тросторду пайдаланбаптыр. Ал узундугу 60 метр келген көпүрөнү салганда карагай, арчаларды жана ташты гана пайдаланган. Эч кандай куруучулук билими болбогон бул керемет устага таң калбай коюуга болбойт."},{"t":"p","h":"Көпүрө 1957-жылы эл тарабынан оңдолуп, бекемделип трос менен керилген."},{"t":"p","h":"Кылымды карыткан бул көпүрө бүгүн да күнү бүгүнкүдөй элге кызмат кылууда."},{"t":"p","h":"? 1. Көпүрө эмне үчүн «Үмөтаалынын көпүрөсү» деп аталып калыптыр? Силердин айылда ушундай адамдардын атынан аталган жерлер барбы? Эгер бар болсо, чакан текст түзгүлө. 2. Тексттен жалпы жана энчилүү аттарды жазып, салыштыргыла."},{"t":"p","h":"87-көнүгүү. Энчилүү, жалпы аттардан катыштырып, бир нече сүйлөм түзгүлө."}],"sub":[{"title":"ҮМӨТААЛЫНЫН КӨПҮРӨСҮ","b":8}],"pages":[40,41]},{"title":"§ 18. ЗАТ АТООЧТОРДУН ЖӨНДӨЛҮШҮ","blocks":[{"t":"h3","h":"§ 18. ЗАТ АТООЧТОРДУН ЖӨНДӨЛҮШҮ"},{"t":"p","h":"88-көнүгүү. Төмөндөгү сүйлөмдөрдү окугула. Андагы кара тамга менен басылган зат атооч сөздөргө уланган мүчөлөрдүн өзгөрүүсүнө көңүл бургула."},{"t":"h3","h":"БЕКМУРЗА АГАЙ"},{"t":"p","h":"Бизди Бекмурза агай окуткан."},{"t":"p","h":"Бекмурза агайдын айткан сөздөрү эсибизден кетпейт. Бекмурза агайды Токтогулдагы Кызыл-Жазы айылынын эли өзгөчө сыйлашат."},{"t":"p","h":"Бекмурза агайда акыл менен билимдин кени жаткансыйт. Бекмурза агайдан таалим алган окуучулар миңдеп саналат."},{"t":"p","h":"<span class=\"pg\" data-n=\"42\">42<\/span>89-көнүгүү. Жогорудагы көнүгүүдөгү зат атоочторго уланган мүчөлөрдү байкагыла. Эми ага салыштырып, өз алдыңарча иштегиле."},{"t":"raw","h":"<h4 class=\"mk\">Үлгү: -нын -га -ны -да -дан<\/h4>"},{"t":"v","l":["Жамийланын (кимдин?)","Жамийлага (кимге?)","Жамийланы (кимди?)","Жамийлада (кимде?)","Жамийладан (кимден?)","","Эсиңерге туткула!"]},{"t":"p","h":"Сүйлөм ичинде сөздөрдүн байланышын көрсөтүп турган -нын, -га, -ны, -да, -дан мүчөлөрү жөндөмө мүчөлөрү деп аталат. Мына ошол мүчөлөргө ылайык өзгөрүп турушу сөздөрдүн жөндөлүшү болот."},{"t":"p","h":"90-көнүгүү. Таблицаны карагыла, андагы жөндөмөлөрдүн катар тартибин, суроолорун жаттап алгыла."},{"t":"p","h":"Кыргыз тилиндеги жөндөмөлөр жана алардын суроолору төмөндөгүлөр:"},{"t":"p","h":"Атооч – ким? эмне? кимдер? эмнелер?"},{"t":"p","h":"Илик – кимдин? эмненин? кимдердин? эмнелердин?"},{"t":"p","h":"Барыш – кимге? эмнеге? кимдерге? эмнелерге?"},{"t":"p","h":"Табыш – кимди? эмнени? кимдерди? эмнелерди?"},{"t":"p","h":"Жатыш – кимде? эмнеде? кимдерде? эмнелерде?"},{"t":"p","h":"Чыгыш – кимден? эмнеден? кимдерден? эмнелерден?"},{"t":"p","h":"? Кыргыз тилинде канча жөндөмө бар?"},{"t":"p","h":"91-көнүгүү. Текстти окугула. Андан кара тамга менен басылган сөздөрдүн кайсы жөндөмөдө турганын айтып бергиле. Андан соң, үлгүдөгүдөй иштегиле."},{"t":"h3","h":"<span class=\"pg\" data-n=\"43\">43<\/span>УРКУЯ САЛИЕВАНЫН 18 ЖАШ КУРАГЫ"},{"t":"p","h":"Уркуя Салиева Ноокат районунда дыйкандын үй-бүлөсүндө туулган. Ал бар болгону 23 жыл гана жашаган. Уркуя жашынан эле Кыргызстанда жаңы турмушту курууга активдүү катышкан. Зээндүүлүгү, активдүүлүгү үчүн, элинин бактысын сүйгөн бул кызды 18 жашында айыл кеңешине төрагалыкка шайлашкан. Жаштык курчтугуна салып, Уркуя жылдардын катаалдыгына карабай, эркектерче иштеген. Жаңы замандын душмандары Уркуяны үй-бүлөсү менен мууздап өлтүрүп, үйүн өрттөп жиберишкен."},{"t":"p","h":"Мындай элдик баатыр кызыбыздын образын таланттуу актриса Таттыбүбү Турсунбаева эжеңер «Уркуя» деген фильмде эң сонун кайра жараткан."},{"t":"p","h":"92-көнүгүү. Төмөнкү сөздөрдү жөндөмөлөргө жараша өзгөртүп жазгыла."},{"t":"p","h":"Окуучу, китеп, Бишкек, Жалал-Абат, көйнөк, жалбырак, шамал, күз, каникул, дептер, балта, Осмон."}],"sub":[{"title":"БЕКМУРЗА АГАЙ","b":2},{"title":"УРКУЯ САЛИЕВАНЫН 18 ЖАШ КУРАГЫ","b":20}],"pages":[42,43]},{"title":"§ 19. АТООЧ ЖӨНДӨМӨСҮ","blocks":[{"t":"h3","h":"§ 19. АТООЧ ЖӨНДӨМӨСҮ"},{"t":"p","h":"93-көнүгүү. Жөндөмөлөрдүн таблицасын карагыла. Өзүнө тиешелүү мүчөсү жок жөндөмө кайсы экенин байкадыңарбы? Ага берилүүчү суроолор кандай экен? Айтып бергиле да, бир нече мисал жазгыла."},{"t":"p","h":"94-көнүгүү. Ыр-табышмактарды окугула да, жандырмагын тапкыла. Кайсы жөндөмөдө туруп, кандай суроолорго жооп берерин айткыла."},{"t":"v","l":["Аппак сүтүн эмизген,","Пакиза тамак жегизген,","<span class=\"pg\" data-n=\"44\">44<\/span>Айым, Күнүм дегизген","Бул – ким?","","Дээринде жакшы санаалаш,","Ою бар жакын чамалаш,","Сөзү, иши таламдаш,","Бул – ким?","А. Малаев","Узун моюн, үч кулак,","Сырты кызыл, боору ак.","Жиптей ичке тили бар,","Сүйкүмдүү коңур үнү бар","Эмне – ал?","М. Желденов","","Эсиңерге туткула!","Заттын, кубулуштун атын билдирип, ким? эмне?","кимдер? эмнелер? деген суроолорго жооп берген","жөндөмө атооч жөндөмөсү деп аталат.","Мисалы: Ч. Айтматов (ким?), жылдыз (эмне?),","окуучулар (кимдер?), карагайлар (эмнелер?)","","95-көнүгүү. Накыл кептерди окуп, маанисин түшүндүргүлө."]},{"t":"p","h":"Атооч жөндөмөдө турган сөздөрдү таап, бир нечесин дептериңерге көчүрүп алгыла."},{"t":"h3","h":"ЖУСУП БАЛАСАГЫН БАБАБЫЗДЫН НАСААТТАРЫНАН"},{"t":"v","l":["Акыл көркү – тил,","Тилдин көркү – сөз.","Адамдын көркү – жүз,","Жүздүн көркү – көз.","","Жоомарт кол – күчтүү колдон күчтүү.","Акыл, кеңеш бергенге кызмат кыл.","<span class=\"pg\" data-n=\"45\">45<\/span>Алтын-күмүш жыйган бай эмес,","Сөз жыйган адам – бай.","? Атооч жөндөмөсүндөгү сөзгө мүчө уланат бекен?"]},{"t":"p","h":"96-көнүгүү. Текстти окугула да, тапшырмаларды аткаргыла."},{"t":"h3","h":"«ЭЛ АЛДЫНДА БИЙЛЕСЕМ» ДЕЙМ"},{"t":"p","h":"Мен мурда мугалим болсом деп жүрчүмүн. Азыр бийчи болгум келип калды. Атактуу бийчилерди көрүп, өзүмчө кыялданам. Ошол үчүн бийчи болуп, эл алдында бийлесем деп алдыма максат коюп келе жатам."},{"t":"p","h":"Бүбүсара Бейшеналиева эжемдей атактуу бийчи болсом, элиме ак кызмат өтөгөн болор элем."},{"t":"p","h":"«Кырчын»"},{"t":"p","h":"? 1. Кыз келечекте ким болгусу келет экен? Алдына кандай максат коюптур? 2. Сен келечекте ким болгуң келет? Кыялыңдагыны айтып бер да, чакан аңгеме жазып кел. 3. Атооч жөндөмөдө турган сөздөрдү таап, мүнөздөмө бер."},{"t":"v","l":["Чейрек боюнча кайталоо сабактары","","I. Кайталоо үчүн суроолор:","– Сөздү муунга кантип бөлөбүз?","– Муундун кандай түрлөрү бар?","– Сөздүн уңгусу жана мүчөсү деген эмне?","II. Практикалык тапшырмалар:"]},{"t":"p","h":"– Сөздөрдү муунга бөлүп, анын ар бир түрүнө мисал келтирип, жазып көрсөт."},{"t":"p","h":"– Сөздөрдү уңгу, мүчөгө бөл."},{"t":"p","h":"– Мүчөлөрдү түрлөрүнө ажыратып жазып, түшүндүрүп бер."},{"t":"p","h":"<span class=\"pg\" data-n=\"46\">46<\/span>III. Байланыштуу кепти өстүрүү жана талдоо үчүн тапшырмалар:"},{"t":"h3","h":"АКЫЛМАН ЭЗОПТУН ТАМСИЛДЕРИНЕН"},{"t":"h3","h":"Арстан менен түлкү"},{"t":"p","h":"Карыган арстан каруу-күчтөн тайып, азыгын таап жей албай калды. Анан ал анткорлонуп, оорумуш болуп үңкүрүнө бекинет. Көңүлүн сурап, көргөнү келгендерди билгизбей жеп жата берет. Айтор, токойдогу айбанаттардын көбү анткор арстанга жем болот. Ошондо куу түлкү аярлана басып, үңкүргө кирбей, алыстан ал-жайын сурайт."},{"t":"p","h":"– Жаманмын, – дейт каргылданган арстан, – неге кирбей, алыстан үн саласың?"},{"t":"p","h":"– Өзүңө кирген из көп, чыккан из билинбейт. Ошондон улам жүрөгүм зырылдайт... – деген экен куу түлкү."},{"t":"img","src":"data:image/webp;base64,UklGRrAhAABXRUJQVlA4IKQhAACw5QCdASqAAmgBPrVap04nJbCsJRS5ohAWiWVuTNHRjRUP3tOuUNfYoyD+g8EU8dgb+87OW07ttYTHFtWfbXbAX/x/l5kJrw9+H//HvM/7HjX7zyzmOtWvky1vc6YMUA0pQL5bKNwih4Xks71lofqpwXQTs96r3OVuqsdmmH3YwafJBYco+Qpwhqi10a2L+BBV8azGv25yvrE0ThBA6k41vZLyU1XTTJtDYZPYvEyoFYylio9wcF8ROSyVVUTzSmXm7YB9a8ywX4a/FwGIYq+ZVJng/8exAaNo1g8iOMYRjE9nrk9U90jFuojpCbNOSlGEU8egxAL2lIRTt2H73SfmbuqBe54FKkwGPn4Wja5h/iO3lob9F/lmPWiKaLpn0K/MnxgStdzdRyk6zVkzGC9j7MQBVWDAv/dgtfNWd2Li0uU6+6fmJm1WYJzhuM8vBrEysQqDbSyKnXEhcjpAMjUBzUKIssSHw25Yo6w9QEPkIBhm6C5mmmHJRzIDfi41Ok8Fo1rmOCwXMb1YrdFCjjqaum07vYkS5l9gww8kNYt61iGV25zJiCjmTyvmT6iiCMZxzmQujNUL7DTvPz7T3I+V9hsXfh4oetkTXcPlx5CDkIpyCu7pJOrzphywLDRWDj4Dtr7xSQGqxL87lTaE/rLn3n5vVqYO5wqfAIYBUDQnCbEH8sLkh//5kbgP2E7tZFLEmQFv+hQDQs7wbxs87iLxPkE40ayux8wmaJDm+YcyPvQzLnyTdVs6JopEcHvOKBOyp/xwy1Q7aqckUAQgYANE1oT7N8y1ugg+zbum/dw1LWUaGk26NpgRPffO9Mb2YBGwINvdjFOvthbn3yhpGzJdfSsPF/OtoY6qyDDrHkhpsGCIPsQRkoGMK7iDi05x1aTrK0X+bWkA4WL2um1gqRVUj3JCM439nQgoCfMTn5wkK4nmKULxXE2cDe9nPGg9eusDCccM7lOZTGY7QLEMor7v6DmLGAO427w5yypgz3wFyRaSM5OcYVv+hrUKg8B7ERDKDAIqVc0qXyxwFduvooa1rZ/32pMEh5wAKfTTpJil9JNMAe1NGRR18NAgqlQB4YejyCAFNeuusIG3vAnxP5ZkBUCAk2osnPyyfsf+DvrMR8VkOrQMWG1tD+VfVI4Wun6W8/vubXKyU6wgQ3TdHnPDnhT4b2Bi6vZ4vRlRt6qnc0YEaHehTTJCPdGPME4MS8nlJhbIk6AgXd3wfNkGfVlJ16VCd13jFe1O30bLbctB1TgNnhY75Sso5/1YEJhmi01

DM8rB1P4dpr5R2KMtWdKggOl+MidPtw2xoS8mzjVlCN/aqLyzTZKsu8rBo576tLnAoIJzUqCNjE5SWvHLHNMXudyaxMetHYFI10S/H6z9Lb/BniF/9UYRSBEKuK0rDfXzsccpDvx4ZDYHYAGHHLgRh90/A+yrmErMFU6k5wqWEy2SxJGTBasjaTYmvMty42jAxwkEFJCCzyVlCuPrH8UH+qngjqmUrn3ndyAAA==","w":505,"ht":364},{"t":"p","h":"Бүркүтчү бүркүтүн колуна алып, аң уулап чыкты. Ошол мезгилде капталдан карышкыр көрүндү. Бүркүтчү бүркүтүнүн томогосун алып, карышкырды карай шилтейт. Бүркүт асманга атып чыгат да, эки метрдей кош канатын жайып, карышкырды байкабаган сыяктуу айланып уча баштайт. Бир кезде акырындап төмөндөп, анан капысынан эле аткан октой шукшурулуп карышкырга кол салат. Анан бир буту менен жонунан мыкчып, экинчи буту менен кайрыла берген карышкырды тумшугунан чеңгелдеп басып калат."},{"t":"p","h":"Бүркүтчү атын чаптырып келип, карышкырдан бүркүттү бошотуп, аны сылап-сыйпап ыраазылыгын билдирет."},{"t":"p","h":"? Этиштин келер чагы эмнени билдирет?"},{"t":"p","h":"263-көнүгүү. Накыл кептерди окугула, маанисин түшүнгүлө да, эсиңерге сактагыла."},{"t":"p","h":"Кулагыңа күмүш сырга!"},{"t":"p","h":"1. Булар баарыбызга керек: ден соолук, мыкты кулк-мүнөз, чынчылдык, ак эмгек."},{"t":"p","h":"2. Акылдуу адамдардын сапаты булар болот: өткөн нерсеге өкүнбөйт, ак эмгектен коркпойт, жалкоо болбойт, колунан келбегенге курулай кийлигишпейт, каалаган нерсеси колуна тийбегенге кайгырбайт."},{"t":"p","h":"3. Булар жакшы жашоого жардам берет: эмгекчилдик, чыныгы достук, жакшы тарбия, жылуу-жумшак сөз, жакшы акыл-кеңештер."},{"t":"p","h":"? Этиштин келер чагын билдирген сөздөрдү таап, түшүндүргүлө."}],"sub":[{"title":"БҮРКҮТ САЛУУ","b":10}],"pages":[117,118]},{"title":"§ 44. ЭТИШТИН ӨТКӨН ЧАГЫ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"119\">119<\/span>§ 44. ЭТИШТИН ӨТКӨН ЧАГЫ"},{"t":"p","h":"264-көнүгүү. Төмөндөгүлөрдү окуп, кыймыл-аракеттин качан болгонун түшүндүргүлө."},{"t":"p","h":"? Кыймыл-аракеттин болуп өткөндүгүн кантип билдиребиз?"},{"t":"p","h":"Машина: жүрдү, кетти, келди, токтоду. Алмаз: уктады, турду, келди, тамактанды."},{"t":"p","h":"265-көнүгүү. Төмөндөгү сөздөрдүн кайсылары этиштин өткөн чагын, кайсылары учур чагын, кайсылары келер чагын билдирет? Таблицага жараша бөлүп-бөлүп жазгыла."},{"t":"p","h":"Концерт аяктады, саякатка барабыз, газета окуп жатат, комуз күүсүн уктук, сабак башталат, суу агып жатат, атка миндим, автобуска отурушкан, таң атты, шамал жүрүп жатат, кар жаайт, келгиндер келет, түн кирген, тамак бышты, шаарга барышкан, биздикине келишчү."},{"t":"p","h":"Үлгү:"},{"t":"p","h":"Учур чак – Жаан жаап жатат, ... Келер чак – Саякатка барабыз, ... Өткөн чак – Концерт аяктады, ..."},{"t":"v","l":["Эсиңерге туткула!"]},{"t":"p","h":"Кыймыл аракеттин, окуянын болуп өткөндүгүн билдирген сөздөр этиштин өткөн чагы деп аталат. Алар эмне болду? Эмне кылды? деген суроолорго жооп берет."},{"t":"p","h":"Мисалы: Таң атты. Күн чыкты."},{"t":"p","h":"<span class=\"pg\" data-n=\"120\">120<\/span>266-көнүгүү. Текстти окугула. Тапшырмаларды аткаргыла."},{"t":"h3","h":"БОЗ ҮЙДҮН ИЧИ"},{"t":"p","h":"Боз үйдүн так ортосу – коломто, ага казан асылат. Төр – үйдүн эшикке карам-каршы тушу."},{"t":"p","h":"Анда жүк жыйылып, конок күтүлүп, адамдар жашашат. Ал жерге ала кийиз, өрө кийиз, шырдак, көлдөлөң, төшөк сыяктуу баалуу буюмдар салынат. Жүктүн эки жагына секичек илинчү."},{"t":"p","h":"Эпчи жак – үйдүн ичиндеги сол тарабы. Анда ала бакан орнотулуп, чыгдан каланып, тамак-аш, идиш-аяк сакталган. Аяк кап, чыны кап илинген."},{"t":"p","h":"Эр жагы үйдүн оң тарабы. Анда эркектердин кийими, куралы, ат жабдык ж.б. буюмдар коюлган. Улага – үйдүн кире бериши. Ага, адатта, отун жыйып, ээр-токум коюлган."},{"t":"p","h":"? 1. Боз үйдүн ички бөлүнүшү кандай экен? 2. Силер турмушуңарда аларды көрдүңөр беле? 3. Текстте этиштин кайсы чактарын билдирген сөздөр бар экен? Таап түшүндүргүлө."},{"t":"p","h":"267-көнүгүү. Төмөндөгү уңгу сөздөрдү этиштин үч жагына өзгөртүп, бир нече сүйлөм түзгүлө. Суроо берип, жооп тапкыла."},{"t":"p","h":"Бар, кел, чурка, токто, жаз, сура, бийле, кыйкыр, ач, өс, жаа, ил."}],"sub":[{"title":"БОЗ ҮЙДҮН ИЧИ","b":12}],"pages":[119,120]},{"title":"§ 45. ЭТИШ СӨЗДӨРДҮН ЖЕКЕЛИК ЖАНА КӨПТҮК БОЛУШУ","blocks":[{"t":"h3","h":"§ 45. ЭТИШ СӨЗДӨРДҮН ЖЕКЕЛИК ЖАНА КӨПТҮК БОЛУШУ"},{"t":"p","h":"Бир адамдын кыймыл-аракети же башка заттын ал-абалы кандай айтылат?"},{"t":"p","h":"268-көнүгүү. Төмөндөгү сүйлөмдөрдү окуп, суроо бергиле. Алар канча заттын кыймыл-аракетин билдирди? Түшүндүргүлө."},{"t":"p","h":"<span class=\"pg\" data-n=\"121\">121<\/span>1. Чымчык учту. 2. Аары чакты. 3. Аюу чээнге кирди. 4. Ат кишенеп жатат. 5. Мышык мыёолоду. 6. Саат жүрүп жатат. 7. Сабак азыр башталат."},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Бир гана заттын кыймыл-аракетин же ал-абалын билдирген сөздөр этиштин жекелик түрү деп аталат. Алар эмне кылды? эмне кылып жатат? эмне кылат? деген суроолорго жооп берет."},{"t":"p","h":"269-көнүгүү. Төмөндөгү уңгу сөздөрдү пайдаланып, этиштин жекелик түрүнө оозеки мисалдарды келтиргиле."},{"t":"p","h":"Ук, сүйлө, изде, иште, тазала, секир, жыйна, кап, үр, кубала, жардамдаш."},{"t":"p","h":"Көп адамдын кыймыл-аракетин же заттын ал-абалын кантип түшүндүрөбүз."},{"t":"p","h":"270-көнүгүү. Төмөндөгү сүйлөмдөрдү окуп, суроо беребиз. Алар канча заттын кыймыл-аракетин же ал-абалын билдирди? Түшүндүргүлө."},{"t":"p","h":"1. Теректер шуулдады. 2. Жылдыздар чыкты."},{"t":"p","h":"3. Күндөр, айлар өтүп жатат. 4. Аялдамада көп адамдар турушкан. 5. Жай келсе, биз каникулга чыгабыз."},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Бир нече заттын кыймыл-аракетин же ал-абалын билдирген сөздөр этиштин көптүк түрү деп аталат. Алар эмне кылышты? эмне кылышат? эмне кылып жатышат? деген суроолорго жооп берет."},{"t":"p","h":"271-көнүгүү. Бул уңгу сөздөрдү пайдаланып, этиштин көптүк түрүнө бир нече мисал келтиргиле. Алар кантип жасаларын түшүндүргүлө."},{"t":"p","h":"Аткар, сайра, кубан, ук, кара, жуу."},{"t":"p","h":"<span class=\"pg\" data-n=\"122\">122<\/span>272-көнүгүү. Накыл кептерди окуп, эсиңерге түйүп алгыла. Этиштин жекелик жана көптүк түрүнө мисалдарды тапкыла. Үйдөн өзүңөр ушундай сөздөрдөн дагы таап, дептериңерге жазып келгиле."},{"t":"v","l":["Аталардын сөзү:","","1. Эмгекти сүйгөн адам алп адамды жеңет.","2. Бакыт күрөшүп тапкан адамга энчиленген.","3. Жакшылык кылган адам милдет кылбайт.","4. Сый эң арзан жасалып, эң кымбат бааланат."]},{"t":"p","h":"5. Чыдамкай, токтоо, эмгекчил адамдар гана баарын жеңе алышат."}],"pages":[121,122]},{"title":"§ 46. ЭТИШТИН БУЙРУК ТҮРҮ","blocks":[{"t":"h3","h":"§ 46. ЭТИШТИН БУЙРУК ТҮРҮ"},{"t":"p","h":"Бир нерсени иштөө же аткаруу үчүн буйрук кантип берилет?"},{"t":"p","h":"273-көнүгүү. Текстти окуп, кандай мааниде, эмне максат менен айтылганын түшүндүргүлө."},{"t":"p","h":"Аталардын сөзү Адегенде саламдаш. Бар буюмду жок дебе. Баш кийимди бирөөгө бербе. Тасмалды тепсебе, нанды теппе. Таңкы наарды таштаба, кечки тамакты күтпө."},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Этиштин буйрук түрү кыймыл-аракетти сөзсүз аткаруу зарылдыгына жараша айтылат."},{"t":"p","h":"<span class=\"pg\" data-n=\"123\">123<\/span>274-көнүгүү. Текстти окугула. Тапшырманы аткаргыла."},{"t":"h3","h":"СЕН МЕЙМАНГА БАРГАНДА..."},{"t":"p","h":"I"},{"t":"p","h":"Сен, жеткинчек, эми чоңоюп калбадынбы. Жолдошуңдун же таанышыңдын үйүнө барып калышың мүмкүн. Ата-энең менен чогуу мейманчылоо да болбой койбойт. Ошондо өзүңдү кандай алып жүрүшүң керек:"},{"t":"p","h":"1. Эч себепсиз жолдошуңдукуна бара бербе."},{"t":"p","h":"2. Чакырса же себеп менен барууга туура келсе, алгач үстү-боюңду иретте: кийимиң тазабы, бут кийимиң ылай, чаң эмеспи, чачың таралганбы, байка."},{"t":"p","h":"3. Эгер саатка болжоп чакырылсаң, маалында барууга аракет кыл. Көп кечигип барганың – курбуңду жана өзүңдүн убадаңды сыйлабаганың."},{"t":"p","h":"4. Бир маанилүү себеп менен кечиктиң дейли. Ал үчүн кечирим сура."},{"t":"p","h":"II"},{"t":"p","h":"5. Үйгө киргенде салам айтуу биринчи милдетиң. Дасторконго ашыгып кол сунба. Учуру келгенде алгач нандан ооз тий, анан өзүңө жакыныраак коюлган даамдардан аздап жеп отур."},{"t":"p","h":"6. Оозуңда тамак болсо сүйлөбө. Отургандарга тиешеси жок кепти баштаба. Эч качан дасторконго колуңду жуубай отурбагын."},{"t":"p","h":"7. Тамак ичип жатып, тишиңди элдин көзүнчө чукуба. Майлык (салфетка) болбосо колуңду башка бирдемелерге аарчыбагын."},{"t":"p","h":"8. Тамактанып бүткөндө, дасторкондон шашып турба. Колуңду жууган соң, курбуң жана ата-энеси менен <span class=\"pg\" data-n=\"124\">124<\/span>коштошууну унутпа. Сыйы үчүн ыракматыңды сыпайы айт. Чыгардан мурда, эч нерсеңди унуткан жоксуңбу ошону байка."},{"t":"p","h":" 1. Мейманга баруу, мейманчылоо адеби кандай экен? Сага эмнеси жакты? 2. Буйрук этиштер кайсылар? Алар кандай мааниде айтылды? Туура айтылдыбы? 3. Айтылгандарды турмушуңарда колдонгула."},{"t":"p","h":"275-көнүгүү. Ырды окугула. Андан буюруу маанисинде айтылган сөздөрдүн маанисин түшүндүргүлө."},{"t":"v","l":["Аталардын сөзү:","Акты төкпө,","Айыпсызды сөкпө.","","Эшикти тээп ачпа,","Босогону баспа.","","Чырдан алыс бол.","Улууга каяша айтпа, / Убададан кайтпа.","Шыпыргы менен чаппа,","Шылдыңдаба, какпа.","","Чакыргандан качпа,","Чынчыл, калыс бол.","","Баш кийимди теппе,","","Тамеки чекпе."]},{"t":"p","h":"«Кырчын» 276-көнүгүү. Ушул сыяктуу накыл кептерден ата-энелериңерден сурап, жазып келгиле."}],"sub":[{"title":"СЕН МЕЙМАНГА БАРГАНДА...","b":7}],"pages":[123,124]},{"title":"§ 47. СӨЗ АЙКАШТАРЫ","blocks":[{"t":"h3","h":"§ 47. СӨЗ АЙКАШТАРЫ"},{"t":"p","h":"? Сөз айкаштары деген эмне?"},{"t":"p","h":"Эсиңерге туткула!"},{"t":"img","src":"data:image/webp;base64,UklGRlIHAABXRUJQVlA4IEYHAABwKgCdASqAAiwAPrVIoUonJC4hqjV+IcAWiWltW+88+f/qL5e8YKjCCmrxMLS+5nIlPZH+980++X4UagXr7zFoVTgj2kvxNZtWBOqf6fnfnHbp19qQqblUWNBFTVlVLNhb0EklP5PxKf7E+lEGuA710bZj4gt9v6toU0StMgEsGgh06SsQTHhQdOql8j0lSeuWMLd6t3oPuYRZa+shCMhT853znfOd853zo8mHWrbwP1hO1GuawIXFYkpoRifrZnywc5WZABi6VFiNajpLfoQc96go8Y7FfQRkfjTDznjRHIrpBMvbwjlRIJYiVffg7LITaNgz2qvV5YaRp1BC/J9ml7c3W1dBqUU/3kgfCBNUTVWqb7E0rsLYscB5/ZEJ8NF7HMAPFFC3attVqcUQ46H1d8qLeM7MHevSlgzfA52GerGz3DF 8e0bokhAENoN3HznDI2S7QyVEZXDJltDhlqev/Yf2Wrib5hI9HmpksC/SJayJxPHgBN/igAAAAAAA","w":494,"ht":123},{"t":"p","h":"Сын атооч + зат атооч"},{"t":"p","h":"1. Эсептик сан 2. Иреттик сан 3. Бөлчөк сан"},{"t":"p","h":"281-көнүгүү. Өз алдыңарча алты сөз айкашын түзүп, жазып келгиле."},{"t":"p","h":"Бышыктоо сабагы. ? Зат атооч жана этиштерден сөз тизмектери кантип түзүлөт? 282-көнүгүү. Сөздөрдү маанисине жараша айкаштырып, сөз тизмектерин түзгүлө."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>булбул<\/td><td>сойлоду<\/td><td>ат<\/td><td>маарады<\/td><\/tr><tr><td>жылан<\/td><td>сайрады<\/td><td>кой<\/td><td>кишенеди<\/td><\/tr><tr><td>машина<\/td><td>сүздү<\/td><td>кымыз<\/td><td>уюду<\/td><\/tr><tr><td>кайык<\/td><td>жүрдү<\/td><td>айран<\/td><td>ачыды<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"283-көнүгүү. Этиштин чактарына ылайык сөз айкаштарын түзгүлө."},{"t":"p","h":"Үлгү: Күн чыгып келатат. Күн чыкты. Күн батат. 284-көнүгүү. Текстти окугула, маанисин айтып бергиле. Андагы кара тамга менен басылган сөздөрдөн сөз айкаштарын түзгүлө. Кайсы сөз түркүмүнө, этиштин кайсы чактарына тиешелүү экенин түшүндүргүлө."},{"t":"h3","h":"АКЫН БУЛБУЛ"},{"t":"p","h":"Булбул – сайроочу майда канаттуулардын падышасы."},{"t":"p","h":"Ал – ыйык. Бага албасаңар үйүңөргө алып келбегиле. Булбулду өлтүрүү – чоң убал."},{"t":"p","h":"<span class=\"pg\" data-n=\"127\">127<\/span>Булбулдун кайрыктары эң эле көп. Сөз же тыбыш менен аларды айтып берүү өтө кыйын. Тоого, токойго, суу жээктерине жайкы каникул күндөрүндө барып калсаңар, булбулдун сайраганын, сөзсүз, угасыңар. Кээ бирөөлөрү 12 кайрыкка чейин безеленишет. Кулак төшөп тыңшасаңар, кайрыктарын ажырата аласыңар. Тыбыш менен айтканда, ал кайрыктар: «Фит-чурр, фит-чурр, бад, - бад, -бад; тю-лит, тю-лит; ци-фи, ци-фи; пи-пи, пи- пи; чыр-чыр-р; клуи-кули» деген добуштарга окшоп кетишет."},{"t":"p","h":"Дүйнө жүзүндө үнү боюнча алып караганда, бири-бирине окшош эки булбулду таба албайсыңар. Он булбул болсо, ону он башкача сайрайт."},{"t":"p","h":"Ат атооч менен этиштер да сөз айкаштарын түзүшөрү эсиңердеби?"},{"t":"p","h":"285-көнүгүү. Схема боюнча сөз айкаштарын түзүп жазгыла."},{"t":"p","h":"Ал"},{"t":"v","l":["ат атооч + этиш Бул","Тигил","келди, ырдады, жууду,","барат, сүйлөйт, бийлейт,","келатат, турат, айтат."]},{"t":"p","h":"286-көнүгүү. Өз алдыңарча ыр-аңгемелерден түрдүү сөз айкаштарын таап келгиле."},{"t":"p","h":"Бышыктоо сабагы"},{"t":"p","h":"287-көнүгүү. Жаңылмачтарды окуп, тилиңерди жатыктыргыла. Андан кара тамга менен берилген сөздөргө сөз тизмегине жараша талдоо жүргүзгүлө."},{"t":"h3","h":"<span class=\"pg\" data-n=\"128\">128<\/span>БАТ АЙТМА"},{"t":"v","l":["Агам баккан уйлардын,","Көпчүлүгү сары ала,","Азчылыгы кара ала.","Атам баккан уйлардын,","Көпчүлүгү кара ала,","Азчылыгы сары ала.","Ишенбесең экөөнүн,","Бүт уйларын арала.","Баары бирдей кара ала.","Баары бирдей сары ала.","Сары алага кара ала,","Кара алага сары ала,","Аралашса, ээлери","Кантээр эле таба албай?","","288-көнүгүү. Текстти окугула. Андан сөз тизмектерин таап","жазгыла. Кандай сөз айкаштары экен? Талдап айткыла."]},{"t":"h3","h":"КЫРГЫЗДЫН АТ ЖАБДЫКТАРЫ"},{"t":"p","h":"Жүгөн. Жүгөндүн үч түрү бар: кайыма жүгөн, өрмө жүгөн, жалаң жүгөн."},{"t":"p","h":"Кайыма жүгөн эки кайыштын ортосуна бөлөк салынып тигилет. Өрмө жүгөн кайыштан өрүлүп жасалат. Жүгөнгө темирден жасалган ооздук катылат. Аны кээ бир жерлерде «суулук» деп да атай беришет."},{"t":"p","h":"Камчы. Камчылар өрмө, тикме, эшме ж.б. болот. Камчынын билекке илип коюучу кайышын «бүлдүргө» деп да аташат. Байыркы кыргыздар өрмө камчыны «булдурсун» деп аташкан."},{"t":"p","h":"А. Акматалиев"},{"t":"v","l":["","<span class=\"pg\" data-n=\"129\">129<\/span>289-көнүгүү. Табышмактарды окуп, жандырмагын мелдешип тапкыла. Сүйлөмдөрдүн сөз тизмектерин ажыраткыла.","","Асынып алса, боосу бар,","Жанаша эки оозу бар.","Бүктөп белин сындырат,","Үнү кулак тундурат. (....)","","Узун моюн, үч кулак,","Сырты кызыл, боору ак.","Жиптей ичке тили бар,","Сүйкүмдүү коңур үнү бар. (....)","М. Желдеңов"]},{"t":"p","h":"290-көнүгүү. Үй буюмдарды, идиш-аяктарды, кийим-кечелерди катыштырып, беш сөз айкашын жазып көрсөткүлө."},{"t":"p","h":"Үлгү: Кооз чыны, жыгач кесе."},{"t":"p","h":"291-көнүгүү. Жер-жемиштерди, жашылчаларды катыштырып беш сөз айкашын жазып келгиле."},{"t":"v","l":["","Чейректик кайталоо сабагы.","","I. Кайталоо үчүн суроолор:"]},{"t":"p","h":"Бизге сан атооч сөз түркүмүнүн кандай мааниси бар экен? Аны биз кебибизде эмне максат менен колдонобуз?"},{"t":"p","h":"Ат атоочтун кандай милдети бар экен? Анын башка сөз түркүмдөрүнөн айырмасын, өзгөчөлүктөрүн мисалдарыңар менен далилдеп бергиле."},{"t":"h3","h":"II. Практикалык тапшырмалар"},{"t":"p","h":"1. Эсептик жана иреттик сан атоочторго бир нечеден мисал келтиргиле."},{"t":"p","h":"<span class=\"pg\" data-n=\"130\">130<\/span>2. Эсептик сан атоочторду иреттик сан атоочторго айландырып, жазылышын түшүндүргүлө."},{"t":"p","h":"3. Ат атоочтун жөндөлүш өзгөчөлүктөрүн түшүндүргүлө."},{"t":"p","h":"4. Зат, сын, сан атоочторду ат атоочтор менен алмаштырып, мисал келтиргиле."},{"t":"p","h":"III. Сөз өстүрүү жана талдоо үчүн тапшырмалар:"},{"t":"p","h":"1) Убакытттын кыргызча аталыштарын билебизби? Биз бир сутканы 24 саатка бөлүп эсептерибиз белгилүү. А кыргыздар байыртадан аны 19га бөлүп эсептешчү. Айрымдарын айталы:"},{"t":"p","h":"Ак шам – жер бетине толук жарык түшүп, бирок күндүн шооласы көрүнө элек кез;"},{"t":"p","h":"Шашке – күн аркан бою көтөрүлгөн, саат 10.30 болгон маал;"},{"t":"v","l":["Улуу шашке – саат 11.30 болгон учур;","Жалган түш – саат 12—12.30 болгон кез;"]},{"t":"p","h":"Чак түш – күн төбөгө келген, саат 13.30 болгон учур; Түш оогон чак – саат 14.30;"},{"t":"v","l":["Бешим – саат 16.30;","Дигер – күн толук баткан учур;","Куптан – көз байланган кез;","Түн – жандуунун баары уйкуга кирген маал;","Түн толгон кез – түнкү саат 1.30-2.30.","","Кыргызча убакыт ченемин билип алгыла.","","2) Өз мекенибиз жөнүндө билесизби?"]},{"t":"h3","h":"ЭҢ БАЙЫРКЫ ЭСТЕЛИКТЕР"},{"t":"p","h":"Лейлек районунун аймагында Кожобакырган-Сай деген суу бар. Анын узундугу 11 кмге созулуп жатат. Дарыянын куймалары: «Козубагалан» жана «Лейлек» <span class=\"pg\" data-n=\"131\">131<\/span>суусунун жээктери байыркы кыргыздар жашаган жерлер экендиги белгилүү болду. Мунун далили катары окумуштуулар табышкан эзелки буюмдар болуп саналат."},{"t":"p","h":"Аталган жерлердеги табылган алгачкы адамдардын таштан жасаган эмгек куралдары алардын мындан 800— 500 миң жыл мурда жашап өткөндүгүн туюнтат экен. Андай болсо да ал далилдер Кыргызстандын аймагында табылган эң байыркы эстелик экендиги өзгөчө баалуу."},{"t":"p","h":"Г. Мадаминовдуку боюнча"},{"t":"p","h":"? Жогорудагы элибиздин эзелтен колдонуп келген убакыт эсеби жана байыркы эстеликтер тууралуу өз сөзүңөр менен айтып бергиле."},{"t":"p","h":"Кайталоо сабагы."},{"t":"h3","h":"Кайталоо үчүн суроолор:"},{"t":"p","h":"1. Биздин кебибизде кандай мааниси бар? Биз этиш сөздөрдү кандай максатта колдонобуз?"},{"t":"p","h":"2. Кыймыл-аракеттердин болуу учурларын этиштин кандай чактары менен билдирет экенбиз?"},{"t":"p","h":"II. Практикалык тапшырмалар:"},{"t":"p","h":"1. Жөнөкөй жана татаал этиш сөздөрүнө мисал келтиргиле;"},{"t":"p","h":"2. Этиштин ар бир чактарын мисал менен далилдегиле;"},{"t":"p","h":"3. Сөз айкаштарынын биз үйрөнгөн түрлөрүн мисал келтирип айткыла. Сөздөрдөн сөз айкаштарын, сүйлөмдөрдү түзүп, алардан текст курагыла. Андан кийин тетирисинче иштегиле."},{"t":"p","h":"III. Сөз өстүрүү жана талдоо үчүн тапшырмалар:"},{"t":"h3","h":"<span class=\"pg\" data-n=\"132\">132<\/span>1-АПРЕЛЬ – КҮЛКҮ КҮНҮ"},{"t":"p","h":"Күлкү – ден соолуктун мүлкү. Бул сөздө ашыкча апыртуу жок. Окумуштуулар далилдегендей, адамдын организми тамакты кандай талап кылса, күлкүнү да андан кем эмес талап кылат экен. 20 секунддук күлкү 3 минуталык гимнастикага тете келип, ал жүрөктүн иштешин, кан айланууну жакшыртаарын аныкташкан. Ал эми айрым врачтар күлкүнү нервден жапа чеккендерди дарылоодо да колдонушкан."},{"t":"p","h":"Келгиле, окуйлу, күлөлү!"},{"t":"p","h":"– Ата, мени кытыгылаңызчы... – дейт кичинекей Арсен."},{"t":"v","l":["– Эмне үчүн?","– Күлгүм келип атат?"]},{"t":"p","h":"Силер ата-энеңерди, бир туугандарыңарды, дос-карындаштарыңарды жагымдуу тамаша менен көңүлүн ачууга аракет кылгыла."},{"t":"h3","h":"<span class=\"pg\" data-n=\"133\">133<\/span>IV ЧЕЙРЕК"},{"t":"p","h":"* Мына, жыйынтыктоочу чейрекке да келип жеттик. Буга чейинки үйрөнгөнүбүздү ырааттуу эске салалы. Билим жолун андан ары уланталы!"},{"t":"v","l":["Бул чейректе:","","* Сүйлөм, анын маанисин жана түрлөрүн","тереңдеп үйрөнөбүз;","* Жалаң жана жайылма сүйлөмдөрдүн","түзүлүшүн жаңыдан талдап билебиз;","* Сүйлөмдүн баш жана айкындооч мүчөлөрү","тууралуу жаңы маалыматтарды алабыз;"]},{"t":"p","h":"* Тексттин темасы, идеясы жөнүндө билебиз;"},{"t":"p","h":"* Чакыруу кагазы, кат, кулактандыруу, өмүр баян, мүнөздөмө жазганга машыгабыз."},{"t":"img","src":"data:image/webp;base64,UklGRlwPAABXRUJQVlA4IFAPAABQewCdASo/AdYAPrVMn0onJKoiMdb5SUAWiWNu3VpGtcHd4sQHn9mzFyHb3RGr2E9bP2of//rApP+WFIXgcZluCibacb/brsaKKMKALQykdGzLUEBzL7PFUmZVanejrv1mQ/A1Q359FkWP1+h/ffVvqDk2byuQZzdyVb0ao/hpUHhF1LBVcfVpjnamgJ8dljrj43x2XNnXXanURChA/NWHb4dDtLajyKY25iieGTXyER329LyoNESOWxaPy8ufH3O2Vp0y+Bf28CNXb63yghu7TP7E7I4twkx/qAo1hStZ9m5+7yVAV4Ne7zEVSJyGjRSxsU1LlygmuuchYt2li9rH7CVeUA/4EQyZ6CyWFcAZokd6SqRAluhyMz5/gQYffSZyqwYrXul0u2aGhCpHQooVoC4sWNykMsmJ44m4c7funmvK3gtOY0E4eXq+wWEiXVoEls2+aR+DZBWqP14yOr5HxTNQd9OvOkfTMv6KTswnZMsRPOpGkVd7PUIdf/a92OjWUrjBE+OekdavSgoYc4si0AhfHNW//9cdtlLK2bzgjR1fVzb3KGEHfFB7yqL4ikEUmOSrJpvRFSzlp6qxJ3q+LPIp4Fy2lxeBcLSx4g4GvVtsDh3O2Uo/f/kPG1fjPC2qnF5aLZnKKrSErdqZisGL5/L5Oze4UwY3jYOjDE6nyekI452hnECSQVamre7v3azfdALueTBqhhoH8y9ER6HtUVH1CmUDMd94iRmfYf8h9bAFLOQv18o6tQtR++j+xIZ5CoDJNUWUNUw/stISS2KfSRtuRY6Ow59bQ82BHek48gYF0UCIzyIN1+uQ9ELu7GuGxhs42htDqWb+JZVGXoRZAwzYHNhO7wmdzqN61wJIQTqzusE8PZNppiCtbrvMzZkFh+pGsIwrh9ao9IJY9ApEQ7MgkduA2X5lb50Qecrm+JkisS/aA9U/v5pRG78+gxqo3xJf2KdQcaUjUrL4dQn4WAWePUG970KRfBk/CG9oqg7/994Hd8T623HlaCTW0Fe2BKky8U4Rw9XkO9cTQgg1xru ","—Айтарга тилим болбоду го, тилим...","– Сагызган, уяңды неге талкалашты","– Түбүнө тилим жетпедиби, тилим..."]},{"t":"p","h":"Р. Гамзатов 304-көнүгүү. Окугула. Алп кара куштун суроосун дептериңерге жазгыла да, ага жооп бергиле. Балапандар кандайча аман калышкан?"},{"t":"p","h":"Алп кара куш балдарын көрүп, алардын аман калгандыгына сүйүнүп: «Ээ, балдарым, кандайча ажыдаардан аман калдыңар?» – деп сурады."},{"t":"p","h":"Балапандар: «Эне, жакшылыкты мурун көрсөтөлүбү, же жамандыктыбы?» – дешти."},{"t":"p","h":"Алп кара куш: «Жакшылыкты...», – деди."},{"t":"p","h":"305-көнүгүү. Текстти алым-сабак түрүндө окугула. Тиешелүү тыныш белгилерин коюп, көчүргүлө."},{"t":"p","h":"– Суу атасы ким"},{"t":"v","l":["– Жол атасы ким","– Сөз атасы ким","Суу атасы – булак","Жол атасы – туяк","Сөз атасы – кулак"]},{"t":"p","h":"306-көнүгүү. Окугула. Сүйлөмдөрдү айтылышы боюнча ажыраткыла."},{"t":"h3","h":"<span class=\"pg\" data-n=\"139\">139<\/span>ДЕҢИЗДИ КИМ ТУЗДАГАН?"},{"t":"p","h":"«Чычкан аке, суу берчи?» – деп жалынат бала. Өздөрү кылкылдаган суу бетинде, деңизде жүрүп, ичер сууга зар болушат. Деңиздин суусун эмне үчүн ичүүгө болбойт? Деңизге көптөгөн агын суулар кошулат. Алар менен кошо топурактагы, тоо тектериндеги эриген туздар агып келип куюлат. Ошон үчүн деңиздеги суу туздуу."},{"t":"p","h":"307-көнүгүү. Берилген суроолорго жараша сүйлөм түзгүлө. Эмне? Эмне үчүн? Ким? Кайда? Эмне кылды?"},{"t":"p","h":"Дагы кандай суроолуу сөздөрдү (сурама ат атоочторду) билесиңер?"},{"t":"p","h":"308-көнүгүү. Алым-сабак кеп түз. Сабак бүткөндөн кийин, үйдөн апа менен, же бир тууганыңар менен эмне жөнүндө сүйлөшөсүңөр? Кандай сүйлөмдөр катышат? Жазып келгиле."}],"sub":[{"title":"ДЕҢИЗДИ КИМ ТУЗДАГАН?","b":14}],"pages":[138,139]},{"title":"§ 51. БУЙРУК СҮЙЛӨМ","blocks":[{"t":"h3","h":"§ 51. БУЙРУК СҮЙЛӨМ"},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Буйрук сүйлөм бир нерсени аткарууга буюруу иретинде айтылат. Аягына чекит (.) коюлат."},{"t":"p","h":"Мисалы: Улууну урматта, кичүүнү ызатта. Дүлөй болбос үчүн кулагыңды сакта. Балам, Ыбрай атаңын күүлөрүнөн черт."},{"t":"p","h":"309-көнүгүү. Төмөндөгү буйрук сүйлөмдөрдү көчүргүлө."},{"t":"p","h":"1. Таза болсоң суудай бол,"},{"t":"v","l":["Баарын жууп кетирген.","Балбан болсоң жердей бол,","Баарын чыдап көтөргөн.","2. Жүргүлө, гүл тере кетебиз."]},{"t":"p","h":"<span class=\"pg\" data-n=\"140\">140<\/span>3. Кечиккениңер үчүн өзүңөр жооп бересиңер."},{"t":"p","h":"4. Терезени ачып кой, таза аба кирсин."},{"t":"p","h":"310-көнүгүү. Окугула. Көп чекиттин ордуна тиешелүү сөздөрдү койгула. Кандай сүйлөмдөр түзүлдү? Түшүндүргүлө."},{"t":"p","h":"1. Ак терек, көк терек,"},{"t":"v","l":["Бизден сизге ким керек?","—Кетирекей Керимбек,","... бизге тезирээк.","2. Кеңешти акылдуулардан....","3. Бекерчиден безе....","4. От менен ...","5. Кекчил болбо, эпчил..."]},{"t":"p","h":"311-көнүгүү. Буйрук сүйлөмдөргө төрт мисал түзүп жазгыла."},{"t":"p","h":"312-көнүгүү. Окугула. Буйрук сүйлөмдөрдү көчүрүп жазгыла."},{"t":"p","h":"Баланын бул ишине карышкыр ыраазы болду: «Өзүң жаш болсоң да, акылың бар экен. Атыңдын тең этин өзүң бышырып ал да, менин жонума мингин. Кайда барсаң да, сени самаган жериңе жеткизейин», – деди."},{"t":"p","h":"– Сапарым алыс, самаганым – Алтын куш, – деди бала."},{"t":"p","h":"– Андай болсо жонума мин да, көзүңдү жумгун. Карышкыр артуу-артуу белди ашып, аябаган көп жол басып жүрүп отурду. Бир мезгилде: «Ач көзүңдү, бала»,— деди."},{"t":"p","h":"Бала көзүн ачса, бир чоң шаардын ичине келип калган экен. Карышкыр балага бир үйдү көрсөтүп:"},{"t":"p","h":"– Алтын куш ушул үйдүн ичинде, алтын туурда конуп олтурат. Акырын кирип бар да, кушту боосунан кармабай, канатынан кармап көтөрүп чык, – деди."},{"t":"v","l":["<span class=\"pg\" data-n=\"141\">141<\/span>– Бул кайсы жомоктон? Окудуңар беле?","","Сөздүк: артуу-артуу бел – ашуусу бийик бел","деген маанини берет."]}],"pages":[140,141]},{"title":"§ 52. ИЛЕПТҮҮ СҮЙЛӨМ","blocks":[{"t":"h3","h":"§ 52. ИЛЕПТҮҮ СҮЙЛӨМ"},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Илептүү сүйлөм күчтүү сезим менен айтылат. Сүйлөмдүн аягына илеп (!) белгиси коюлат."},{"t":"p","h":"Мисалы: Жашасын тынчтык! Жоголсун согуш! Оо, Ала-Тоо, ата-бабам өскөн жер!"},{"t":"p","h":"313-көнүгүү. Ырды көркөм окугула. Илептүү сүйлөмдөрдүн окулушуна көңүл бургула."},{"t":"v","l":["Ах, чиркин, биздин күндөр кандай таттуу.","Бүгүндөн эртеңкиси ыракаттуу!","Табият жана анын музыкасы,","Күн санап, кандай сулуу, кандай шаттуу!"]},{"t":"p","h":"А. Осмонов 314-көнүгүү. Текстти окугула. Тапшырмаларды аткаргыла. Илептүү сүйлөмдөрдү бөлүп көчүргүлө."},{"t":"p","h":"Өзүнүн тосмосунда эле балык болуп заматта кубулуп кетсе. Бир караса эле балык! Анан «балык балаң» тосмо таштардан булт секирип, агымга түшмөк да, зыпылдап жөнөмөк... «Кайыр кош, Төө ташым», «Кайыр кош, Бөрү ташым», «Кайыр кош, Танке ташым» – деп, корумдары менен коштошуп өтмөк."},{"t":"p","h":"Короо-жайдын тушуна келгенде, суудан ыргып чыгып, куйругун чапкылап кыйкырмак: «Кош, таята! Жакында кайра келем! Мен Ысык-Көлгө сүзүп кеттим! Ак кемеге барам. Анда матрос атам бар!» – деп кыйкырмак. Ч. Айтматов"},{"t":"p","h":"<span class=\"pg\" data-n=\"142\">142<\/span>1. Текстти окугула. Бул Ч.Айтматовдун кайсы чыгармасынан? Балким, билерсиң? Же чыгарма боюнча тартылган көркөм фильмди көргөндүрсүң?"},{"t":"v","l":["315-көнүгүү. Үй айбандарын, малды айдаганда кандай сөздөр колдонулат? Айтып көргүлө."]},{"t":"img","src":"data:image/webp;base64,UklGRoIOAABXRUJQVlA4IHYOAABwiQCdASpHAUUBPrVWoksnJSqsrHVJiZAWiWduzot5BWJOZtXO7/0yUzf+p1S/97T81v1FEwn/x6K/j2oazPHCcpntIHNrUCNgrvZyUyjioZ2CE6OnhkV4g8XZLaL4dSpJzfIhfuWk7hNs2nrJSwEKyQFkJoHs84AFDOkPiYHcUMk78w9dpOVYrQWsM4Zr0+HaSmsccbiXsQ0fL/da6ther8U2iOXfm1TxqSRWcZPIkvvzXHiHvf+k8RPSPtHd+nwN9PqVebjVbi/+j8kA4ozzJ3Hb8yP6lI69kWSoNq6JViUuMQUkKUEfagQKMqQN3AfhJP4Ew+F4Hg2U7PXX75ewb+Wupoj6WQmFtymwiC+N/oiSRoseo6UJ/37kvITDTKQlv+X3TGbZg9r9ziWhijSjL20GlLhKkQku/HyQrcnQsnfE/NmLNRY25KKV5NYM+mOXNR6RMs8EF38OrZPlRi82OTNnM1Ked7XYol3qrW/spEOI/tk+jZ5WByzlnXOSTnEzjwUoYCcGtmJXFFF5vLI1XEdxmvHBK ут желге кайрылат:","– Булкпачы, тонум айрылат!","Мен белем сенин өгөйүң?","Жаалданбай тура тур,","Жамгырым жерге төгөйүн."]},{"t":"p","h":"С. Эралиев 1. Булуттун сөзүнөн эмнени түшүндүңөр? 2. Жамгыр жааган учурду өз сөзүң менен сүрөттөп жаза аласыңбы? Жамгырдын дабышын, жамгырга жуунган жалбырактарды, чөөткө толгон сууларды элестетсең. 3. А балким, текстине илептүү сүйлөм, суроолуу сүйлөмдөр да катышып калар."},{"t":"p","h":"319-көнүгүү. Тыныш белгилерин тууралап коюп, көчүрүп жазгыла."},{"t":"p","h":"1. Ишиң илгери болсун. 2. Биздин Ала-Тоонун кыздары ай 3. Ысык-Көлдүн жээги кандай кооз 4. «Ак кеме» фильмин көрдүң беле 5. Гүлдөсүн атасын абдан жакшы көрөт 6. Чыңгыз Айтматовдун «Аккемесин» окудуң беле."},{"t":"p","h":"320-көнүгүү. Элдик баталарды окугула. Буларды уктуңар беле? Айтылыш максатына жана маанисине жараша сүйлөмдөрдү мүнөздөгүлө."},{"t":"h3","h":"<span class=\"pg\" data-n=\"144\">144<\/span>ЭЛДИК БАТАЛАРДАН"},{"t":"v","l":["Ак жолуң ачылсын!","Ак жүр, аман жүр!","Мээнетиң кайтсын!","Өмүрүң узун болсун!","Кийгениң март болсун!","Максатыңа жет!","Айтканың элге эп болсун!","Абийириң чеп болсун!"]},{"t":"p","h":"Элдик баталар илептүү сүйлөмдөрдүн эң сонун үлгүсү боло алат."},{"t":"p","h":"321-көнүгүү. Текстти окугула, мазмунуна карап, ат койгула. Төрт сүйлөм жазып, мүнөздөп бергиле."},{"t":"p","h":"Баобаб дарагы 4—5 миң жыл жашайт. Бийиктиги 18—25 метрден ашпайт. Бирок сөңгөгүнүн жоондугу 25 метрге жетет. Баобабды кучактоо үчүн бир класстын окуучулары бүт кол кармашып курчоосу керек болор эле."},{"t":"p","h":"«Тоодой баобабдан томуктай отун чыкпайт» дешет африкалыктар. Бул кандай? Мындай зор жыгачтан көп отун даярдоого болот го!"},{"t":"p","h":"Бирок отундан пайда жок, анткени баобаб жыгачы күйбөйт."}],"sub":[{"title":"ТИЛИН БИЛ","b":14},{"title":"БУЛУТ","b":19},{"title":"ЭЛДИК БАТАЛАРДАН","b":25}],"pages":[142,144]},{"title":"§ 53. СҮЙЛӨМДҮН БАШ МҮЧӨЛӨРҮ ЖӨНҮНДӨ ТҮШҮНҮК","blocks":[{"t":"h3","h":"§ 53. СҮЙЛӨМДҮН БАШ МҮЧӨЛӨРҮ ЖӨНҮНДӨ ТҮШҮНҮК"},{"t":"h3","h":"Сүйлөмдүн ээси"},{"t":"p","h":"Ээ сүйлөмдө ойдун негизин ээлеп турат. Сүйлөм ичинде ким? эмне? кимиси? эмнеси? деген суроолорго жооп берет. Мисалы: Күн жылыды. (Эмне жылыды?)"},{"t":"v","l":["Алмалар гүл ачты. (Эмнелер гүл ачты?)","Өнөрлүү өлбөйт. (Ким өлбөйт?)"]},{"t":"p","h":"Атам жайлоого кетти. (Ким жайлоого кетти?) Ээ түз сызык (—) менен белгиленет."},{"t":"p","h":"<span class=\"pg\" data-n=\"145\">145<\/span>322-көнүгүү. Жазгыла, алдын сызгыла. Суроо бергиле."},{"t":"p","h":"1. Нуркыз радиодон сүйлөдү. Анын уккулуктуу үнү бар. 2. Алыкул Ысык-Көлдү абдан жакшы көргөн. Анын көл жөнүндө ырлары көп. 3. Катуу шамал болду. 4. Биз Кең-Колго барабыз. 5. Алар кечээ экскурсиядан келишкен."},{"t":"p","h":"323-көнүгүү. Буларды сүйлөмдүн ээси кылып, бир нече сүйлөм түзгүлө."},{"t":"v","l":["Окуучулар, коңгуроо, саат, автобус, биз.","","324-көнүгүү. Ырды окугула. Ээни таап, суроо бергиле."]},{"t":"h3","h":"ЖИБЕК КИЙГЕН ЭРКЕ КЫЗ"},{"t":"v","l":["Жамгыр жаады, жамгыр жаады шатырап,","Күн күркүрөп, чарт-чурт этип чачырап...","Жибек кийген сулууча кыз энтелейт,","Жамгыр кантсин, жаба куюп эркелейт.","«Ай булганды, ай бузулду көйнөгүм,"]},{"t":"p","h":"Жайдын жааны жаабай койсо?» – эмне дейт. А. Осмонов. ? Сүйлөмдүн ээси түрдүү сөз түркүмдөрүнөн түзүлөт."},{"t":"p","h":"325-көнүгүү. Ээни тапкыла. Кайсы сөз түркүмүнөн жасалгандыгын аныктагыла."},{"t":"p","h":"Бала дем албай таштын артынан чыкты да, эки колун сунуп, жээкке келди. Маралдар чочуп койбоду, жалооруй тиктеп тура берди."},{"t":"p","h":"Бир маалда маралдар моюн толгоп, бурулуп жөнөй берди. Кажырлуу мүйүз чоң бугу жол баштады. Мүйүздүү Бугу эне артынан басты. Ал дагы бир кылчайып баланы <span class=\"pg\" data-n=\"146\">146<\/span>карап алды. Анан бадалга кирип кетишти. Кызыл бутактар чайпалып, кызыл жалбырактар маралдардын жумуру сооруларына күбүлүп жатты."},{"t":"p","h":"Ч. Айтматов"}],"sub":[{"title":"Сүйлөмдүн ээси","b":1},{"title":"ЖИБЕК КИЙГЕН ЭРКЕ КЫЗ","b":9}],"pages":[145,146]},{"title":"§ 54. СҮЙЛӨМДҮН БАЯНДООЧУ","blocks":[{"t":"h3","h":"§ 54. СҮЙЛӨМДҮН БАЯНДООЧУ"},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Баяндооч ээнин кыймыл-аракетин жана заттын ал-абалын, эмнелигин, кимдигин, кандайлыгын баяндап көрсөтөт. Аларга"},{"t":"p","h":"Суроолору: Эмне кылды? Эмне кылат? Эмне кылып жатат? Кандай? деген сроолор билдирет."},{"t":"p","h":"Мисалы: Ысык-Көл кышында тоңбойт."},{"t":"p","h":"Суусамырдын кымызы – күчтүү. Кыргыз мамлекетинин борбору – Бишкек. Жакшы эл камын ойлойт."},{"t":"p","h":"Баяндооч кош сызык (=) менен белгиленет."},{"t":"p","h":"326-көнүгүү. Сүйлөмдөрдү окуп, ээ менен баяндоочторду ажыраткыла. Баяндоочтун кайсы сөз түркүмүнө таандык экендигин аныктагыла."},{"t":"h3","h":"УЛУУ МАНАСЧЫЛАР"},{"t":"p","h":"1924-жыл манасчы Саякбайдын өмүрүндө эстен кеткис жыл болду. Ушул жылы ал белгилүү Манасчы Чоюкеге жолугат. Ал узак жылдар бою бирге болуп, «Манас» айтуунун түркүн ыкмаларын үйрөнөт, таалим-тарбиясын алат. «Чоюке-чынар, мен-чырпык» – деп кийин өзүнүн устатына чоң баа бериптир. Ысымын оозунан түшүрчү эмес экен."},{"t":"p","h":"Б. Максутовдон"},{"t":"p","h":"327-көнүгүү. Жазгыла. Баш мүчөлөрдүн алдын сызгыла."},{"t":"h3","h":"КОРОЗ МЕНЕН КӨГҮЧКӨН"},{"t":"p","h":"Тооктор короодо чукулдашып жем жеп жатышкан. Аңгыча көгүчкөн келип конду."},{"t":"p","h":"<span class=\"pg\" data-n=\"147\">147<\/span>—Эй, көгүчкөн, – деди короз. – Сен мында эмне кылып жүрөсүң?"},{"t":"p","h":"—Конокко келдим, – деди көгүчкөн. Анын карды ач эле. Күн да суук болчу. Короз анын сөзүн укпады, бир тоголок да нан жедирбеди. Аны үй ээси көрдү да, үйдөн бир кочуш буудай алып чыгып, көгүчкөндүн алдына чачты."},{"t":"p","h":"С. Рысбаев 328-көнүгүү. Баш мүчөлөрдү талдагыла."},{"t":"h3","h":"УЛАР"},{"t":"p","h":"Улар бийик тоолордо жашайт. «Улуу тоонун улары» деген сөз бекеринен чыккан эмес. Алар уясын бадалдын, таштын арасына салышат. Балапандары тез чоңоёт. Уларлар кышкысын тоо эчкилер оттогон жерлерде болушат. Эчкилер карды тээп оттоп, уларга да жем табууга жардамдашат."},{"t":"p","h":"329-көнүгүү. Төмөндөгү сөздөрдү катыштырып, төрт сүйлөм түзгүлө."},{"t":"p","h":"Балалык, кооз, мугалим, калем."},{"t":"p","h":"Түзүлгөн сүйлөмдөрдүн ээ, баяндоочун тапкыла. Кайсы сөз түркүмүнөн экендигин көрсөткүлө."},{"t":"p","h":"Билип алалы!"},{"t":"p","h":"Улуу адамдар силердей кезинде кандай болгон?"},{"t":"p","h":"М. Горький Орус элинин улуу жазуучусу бала чагында балык уулаганды жана сайроочу куштарды кармаганды жакшы көрчү. Ал тургай, замандаштары Максим кандай сууда, канча жана эмне деген балыктар болорун жазбай айтып бергендигин таң калуу менен эскеришет."}],"sub":[{"title":"УЛУУ МАНАСЧЫЛАР","b":8},{"title":"КОРОЗ МЕНЕН КӨГҮЧКӨН","b":12},{"title":"УЛАР","b":17}],"pages":[147,147]},{"title":"§ 55. СҮЙЛӨМДҮН АЙКЫНДООЧ МҮЧӨЛӨРҮ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"148\">148<\/span>§ 55. СҮЙЛӨМДҮН АЙКЫНДООЧ МҮЧӨЛӨРҮ"},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Сүйлөмдүн баш мүчөлөрүнүн бирин жандап, аныктап, толуктап, бышыктап турган сүйлөм мүчөлөрү айкындооч деп аталат."},{"t":"img","src":"data:image/webp;base64,UklGRjQFAABXRUJQVlA4ICgFAACQKwCdASrLANQAPrVap02nJaOiJzPpUOAWiWlu3WBOqV1Yf7DxB8s/u79V5A/3PgV9sMgbJl4maCf8s8pSMVyyjf5NhJulqWMe6K5jSRfpWYyH0yAlM+/Ev2pICfVx6Om7MFxAAxftmKY6Bka4jU8t056Y7s/owicuLv6yBTdf5Uew/Zno+7kanNzF/KZFlnP8j/nD09E7JNtQwF/AzpYALSw+olWnnZF/A///rn2oZJX5X5woD09ABI/aByKC1D5oLJC/cwyIPNcKgSy2aMytK6Df9s4tsY3MPywXASRy3lSo0O/tDLSw/pqPOuvUzL1ZUTqkdHQvhtyppUWx7sm1fvT+1yJ/V0qqmD+yZSBfDVBubmxtrzlf69CmxUZwEtkqV46MtzSfg7pCbRS2GJCv2x1nr+aqQLHppk8dX7aljI6YV17DKTBcfdFKPZddRTqWMe7HBCgKZrTPK6ZdftqWMe/UsgAA/vccWJ0G8bYuQ1QwRdPgIPYTBD2RIf0wHe/NXEN04LEngMt7wLrTwZTNc0yIRt8G+LVxcU3fZjeczOBLGtoDGaFyH9eGf17qoxElLcwJWynvZs9DoIXuMHUAZFS6ld7nqJlSYxopdP+Nh5Fy0d5e+weaP4ChR6lh3crTDFVAR4hFGcgkDBGCi+XT0gKJBHM2LPm1kcEwVqSuWsBhGiDsSQJRUhlA6ap82JfNOlwlMpZKmKxac29pxTkQjiyoax+OSfHBRzo9sE92lq5c4GoXwBkGJ9L7XeWyF2p0tvi+cXHbWTrB0JCtojQWYV2/vLr13lfNbSYDbENxd2okZZTqYhB7mCPawKht9Di7aTph6pg9VHFdgxLxdSpOQmrGOLfW4MDw6exn799CyVanJ9V8RebKBUk+n+eofyBGc0RoeE2VD02OU7Db70Ppcgvfz },{"t":"p","h":"Куш – кыраандардын жалпы аталышы. Мунун мыктысы – Туйгун. Ал аппак болот. Тунжур да ушул куштан чыгат. Мунусу табына келгенде олжо-буйлалуу келет. Тынар да ушул куштан чыгат. Ал чанда жолугат. Көбү темир канат кезинде тынчы жогунан уядан учуп кетет."},{"t":"p","h":"А. Акматалиев 338-көнүгүү. Окугула. Ой жүгүртүп сүйлөп бергиле."},{"t":"p","h":"Кулагыңа күмүш сырга!"},{"t":"p","h":"Күрөштөн жыгылган турат, сөздөн жыгылган турбайт. Бул – адептүүлүккө, ички маданияттуулукка үндөгөн кеп. Сөз кадырын коротпо, ойноп сүйлөсөң да, ойлоп сүйлө дегендик."},{"t":"p","h":"Жусуп Баласагын бабабыздын сөзүн эске ала жүрсөңөр: Тил адамды бакытка бөлөп салат,"},{"t":"v","l":["Тил адамды шорлотот, башын алат.","Тил – арстан, босогоңдо комдонгон,","Бошоп кетсе, өзүңдү да жеп койгон."]}],"pages":[148,150]},{"title":"§ 56. ЖАЛАҢ СҮЙЛӨМ","blocks":[{"t":"h3","h":"§ 56. ЖАЛАҢ СҮЙЛӨМ"},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Жалаң сүйлөм баш мүчөлөрдөн гана (ээ менен баяндоочтон) түзүлөт."},{"t":"p","h":"Бак-дарактар гүлдөдү. Гүлнур – ырчы."},{"t":"p","h":"<span class=\"pg\" data-n=\"151\">151<\/span>339-көнүгүү. Сүйлөмдөрдү дептериңерге жазгыла. Эрежеге карап талдагыла."},{"t":"p","h":"Коңгуроо кагылды. Мугалим келди. Сабак башталды. Гүлназ да жооп берди."},{"t":"p","h":"340-көнүгүү. Окугула. Сүйлөмдөрдү жалаң сүйлөмгө оозеки айландыргыла."},{"t":"p","h":"Данияр 3-класста окуйт. Ал атасындай зээндүү. Анын инилери кичинекей. Данияр Бактыярды мектепке ээрчите кетет. Кээде Дастанды ойнотот. Ал абдан тил алчаак. Мугалим аны дайым мактайт."},{"t":"p","h":"Үлгү: Данияр окуйт."},{"t":"p","h":"341-көнүгүү. Текстти окугула. Жалаң сүйлөмдөрдүн катасын тапкыла. Оңдоп жазгыла."},{"t":"p","h":"Бака сайрады. Буудай тигилди. Алма айдалды. Комуз ойноду. Сагызган сайрады. Чымчык чыйпылдады. Жөжө сайрады."},{"t":"p","h":"342-көнүгүү. Төмөндөгүлөр жалаң сүйлөм боло алабы? Талдагыла."},{"t":"p","h":"Ширин ырдады, бийледи. Санжар менен Султан ойноду. Муса Медер менен ырдады. Суу тунук жана муздак. 343-көнүгүү. Табышмактарды жандыргыла. Андагы сүйлөмдөр кандай экен? Сүйлөмдөрдөн зат атооч, сын атооч, сан атооч жана этиш сөздөрдү тапкыла."},{"t":"v","l":["Тиштей келип ылайдан,","Татынакай үй курат.","Ача куйрук, аппак төш,","Өңү кара жалтырап.","<span class=\"pg\" data-n=\"152\">152<\/span>Вул кайсы жаныбар,","Тапкылачы балдар? (......)","Жердиги ак, кыюусу кара,","Ача куйрук төрт талаа. (......)","М. Желдеңов","344-көнүгүү. Жалаң сүйлөмдөрдү схема боюнча толуктагыла.","Айгерим – уктады.","","Алма – чийки."]},{"t":"v","l":["Билип алалы:","Улуу адамдар силердей кезинде кандай болгон?","","Элибиздин алгачкы сүрөтчүсү Гапар Айтиев бала чагында чоорчу болууну самачу экен. Чоордун үнүн тынбай уккан болочок сүрөтчү өзү да чоподон жасап алчу. Кийин бул кызыгуусу сүрөткө ооп кеткенин өзү да айтып калчу экен."]}],"pages":[151,152]},{"title":"§ 57. ЖАЙЫЛМА СҮЙЛӨМ","blocks":[{"t":"h3","h":"§ 57. ЖАЙЫЛМА СҮЙЛӨМ"},{"t":"v","l":["Эсиңерге туткула!","Жайылма сүйлөм баш жана айкындооч мүчөлөрдөн түзүлгөн."]},{"t":"p","h":"Мисалы: Күч акылга жардамчы. Жылдыз «Эсимдени» мыкты ырдайт. Айбек эсептен «5» алды."},{"t":"p","h":"345-көнүгүү. Жазгыла. Баш жана айкындооч мүчөлөргө ажыраткыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"153\">153<\/span>Графика – бул кагазга тартылган сүрөт. Сүрөт көбүнчө боёлбой тартылат. Айрым гана учурда түстүү болот. Силердин сабактан тарткан сүрөттөрүңөр графикага кирет. Силер аларды карандаш, сыя, акварель боёгу менен кагазга тарткансыңар."},{"t":"p","h":"Жайылма сүйлөм сөздүн кенен, ар тараптуу болушуна шарт түзөт."},{"t":"p","h":"346-көнүгүү. Ырды окугула."},{"t":"h3","h":"КӨЛЧҮКТӨГҮ АЙ"},{"t":"v","l":["Эшикке чыксам укмуш, апа,","Ары-бери калтырап,","Чоң көлчүктүн ортосунда,","Ай жатыптыр жалтырап.","","Басып барып акырын,","Колум сунуп батыраак,","Жаңы кармап аларымда","Сынып калды чачырап."]},{"t":"p","h":"Т. Кожомбердиев. ? 1. Көлчүктөгү айды элестетип көрчү. 2. Ырдын мазмуну боюнча үч сүйлөм түзгүлө. Аны баш жана айкындооч мүчөлө озуң карышкыр! Оозуң карышып, ача албасаң экен» – деп, аны каргашкан. К. Сейдакматов Билип алалы!"},{"t":"p","h":"Улуу адамдар силердей кезинде кандай болгон?"},{"t":"p","h":"К. Жантөшев"},{"t":"p","h":"Кара сөздүн устаты Касымалы атабыз бала чагында чүкө атуу жагынан эч кимге уттурбоочу. Эр жетип, Алай жергесинде агартуучулук кызматта жүргөндө деле ордо оюнуна кайдыгер карабаган. Айрым учурда ордонун лидери болгонун көргөндөр айтышат."},{"t":"p","h":"Машыгуу сабагы"},{"t":"p","h":"350-көнүгүү. Сүрөттөрдү карап, бир нече сүйлөм түзгүлө. Алардын ээ, баяндоочун таап, талдап бергиле."},{"t":"p","h":"<span class=\"pg\" data-n=\"155\">155<\/span>351-көнүгүү. Төмөнкү сөздөрдү ээ катары колдонуп, мелдешип сүйлөм түзгүлө. Ээнин алдын сызгыла."},{"t":"p","h":"Жаз, биз, келгин куштар, мал, канаттуулар, окуучулар, тоолор, гүлдөр, күн, жылдыздар, жамгыр."},{"t":"p","h":"352-көнүгүү. Юморду окугула. Андагы баланын сөзү туурабы? Сүйлөмдөрдөгү кара менен берилген сөздөрдү талдагыла."},{"t":"h3","h":"КЕЛГИН КУШТАР КЕЛГЕНДЕ"},{"t":"v","l":["– Эмне мынча шамал болуп атат? – деп сурады бала атасынан, терезени карап туруп.","– Келгин куштар келаткан го...","– А эмне, келгин куштарды шамал айдап келеби?","С. Рысбаев","","Эмне үчүн келгин куштар дейбиз? Билесиңерби? Келгин куштар келатканда шамал болобу?"]},{"t":"p","h":"353-көнүгүү. Тамсилди көркөм окугула. Суроо-тапшырмаларды аткаргыла."},{"t":"h3","h":"ЧЕГИРТКЕ"},{"t":"v","l":["(Тамсил)","Келатып жолдо чегиртке,","Жолугат бир топ челекке.","Тымызын барат акырын,","Алардын сырын билмекке.","","Караса толгон балы бар,","Кетиптир учуп аарылар.","Ооз тийсе аз гана,","Таңдайга тийген даамы бар.","<span class=\"pg\" data-n=\"156\">156<\/span>Чердейип бекер тамакка,","Чегиртке тоюп алыптыр.","Бөлөнмөк болуп ыракатка,","Ортолоп басып барыптыр.","Тарталбай бутун ал кайта,","Балга батып калыптыр."]},{"t":"p","h":"«Кырчын»"},{"t":"p","h":"1. Чегирткенин мисалы менен тамсилде кандай адам тууралуу кыйытып айтылганын байкадыңарбы? Ушунча ач көз болуу керек бекен? 3. Тамсилден ээ, баяндооч сөздөрдү тапкыла да, алар кандай сөз түркүмү экендигин түшүндүргүлө."},{"t":"p","h":"Машыгуу сабагы"},{"t":"p","h":"354-көнүгүү. Төмөнкү сүйлөмдөрдү окугула. Жалаң жана жайылма сүйлөмдөрдү өз-өзүнчө бөлүп жазгыла. Сүйлөмдөргө мүнөздөмө бергиле."},{"t":"p","h":"Жаз келди. Күн жылыды. Гүлдөр чыкты. Көпөлөктөр уча баштады. Жакында окуу жылы аяктайт. Биз каникулга тарайбыз. Мен каникулду жакшы көрөм. Анткени каникулда, жайлоого барам. Чоң ата, чоң энеме жардам берем. Жайлоо – абдан кооз. Гүлдөр көп. Аба таза. Эртең менен эрте туруп, козу-улактарды карайм. Кымыз ичем, каймак жейм. Жайлоодо кандай жыргал! Эх, эртерээк эле каникул башталса экен! А силер каникулда кайда эс аласыңар?"},{"t":"img","src":"data:image/webp;base64,UklGRtoIAABXRUJQVlA4IM4IAADQLwCdASqAAjsAPrVQoUynJKqiIxEegVAWiWltfvbZj/DEN/55pcAHYm5Bzw2fYbtjafQNWykGi/aMva6J06+5hfVkw6436dvs+F/4t6gXsDfG9b3pfVZVgTTfNe9kG/Eio6S/jcfk54PkSXTpWRJdAFC20K+yk9IPivRk1f5fgv4JLuAW6MRanOKxbu+PqL0h0wdZCF5IIn7p38ILFwMF7vcQD+So1y/WxtMYbiOfsY7E123zTfTP+yJJLG6zZTEVu1Hd4TBiMUigFrwT+bXh+qYR/+kbKE+wku5KiCSPju388qYxDrCo4mhSjCGiQjBF19U7ic/xMiHv1iFvTUVpRQma5DYtaPiAYlBLOX+K7YbXQlwnURIsJ7QqKQvPe94tCn+I8J8K/k3GXxJ+A5qkMuVRRBp7jq0IQZ4S36hoC4Cq3cMhA+Na97wrZ8znmtZuvFKUH3X5XzKyAZFSk+5ji0q0VYEcU429EbAHQe7iiRisRa/ZK89R7SBqacpCFh0NUoygvsgAAP7+XCX9dYjDkToirxTVMcX+GSJjHJu7O32O7nErD34/8fvgg0evSXzYHRbC9Q6+3kVCWAQyv8S8RMJ4vUgN7XbJVhuU65a1xRK4V7QhMIQdzWRbehiDh+1mBZcY7OUP5RMwK0Coz8WCZTTNYZG4qsi3ESw0nA2lFbMJGZ8MOn9Hk1m2NcDkO3nk9THdDw4UYQDySD1zyzxZeyJyRwhAXGS5PhwWavZt4gQ7Ju/1CgMe7/zcyIcTYfd+RLC9eK9hFkmFse43WlHxE4cWdEHS8aOSXudsuWOuOe2+g1+AxV/0iJuhF4XWS2kO2ckkh+n1uYGPPpu5rgM0kT70yKkmb/rqftFLW2/HTUh+GTOfQoEzE18w1UFebEPHp5BcMW4OYS2+/7wKXmpvSZr7hkB+T3fvobxLpVQAeXXqHMkQTZhfnMpGkBsUudniVZ4VG2B6WHPQwzqrI3csOrGA32fkJgKlfl+eErooVVeKAKOAAZ+q1ssrZHOREBeWN06f0XkCYx/l9spwvANZd75dyp577fvqb2Icr952CLA9FIFjVsAVnaR9vqWehhOQKTJuuuWRDl7oJR8tanXykKt/PX80gkbu/ecJsApVDWJ2Yp/Gz1Pli+Vu5aAvoqjD7nR6OjtLBjFHklm53BLBIFeCe02mZvblVESi4PCegork5VaYw2l р көйкөлөт.","Жаан жаады.","Чагылган чартылдайт.","Чегирткелер чырылдайт.","Бөдөнө бытпылыктайт","жарк-журк этип","чөптүн арасында","кечке","шылдырап","көк","шатырата"]},{"t":"p","h":"? Ээ + баяндооч + айкындооч мүчө-жайылма сүйлөм."},{"t":"p","h":"356-көнүгүү. Текстти окуп, сүйлөмдөргө талдоо жүргүзгүлө. Андагы тыныш белгилерине көз жүгүрткүлө."},{"t":"h3","h":"ЧЫМЫН"},{"t":"p","h":"Жайында эле. Күн ысык. Таң бая эле аткан. Үй ичине күн тийип, бат эле ысып кетти. Чымындар да ойгонуп, дыңылдап уча баштады."},{"t":"p","h":"Темирландын мурдуна, көзүнө чымын улам-улам коно берип уктатпады. Уйкусу качты."},{"t":"p","h":"– Эх, бул чымындар уктатпайт го..! – деди ал атасына. Атасы эчак эле туруп, эшикте жүрүп келген эле."},{"t":"p","h":"Алар сени: – Саат жетиге чейин эмне жатасың? Ойгон! Тур!... – деп жатпайбы. «Эрте туруп, агаңа жардам бер»,— деп жатпайбы. Сенин ошого акылың жетпейби? – деди атасы."},{"t":"p","h":"Темирлан түшүндү. Көзүн ушалап, уялганынан туруп, кийине баштады."},{"t":"p","h":"С. Рысбаев 357-көнүгүү. Өз алдыңарча «Дем алыш күнү» деген темада чакан дилбаян жазгыла. Сүйлөмдөргө талдоо жүргүзгүлө."}],"sub":[{"title":"КӨЛЧҮКТӨГҮ АЙ","b":7},{"title":"КЕЛГИН КУШТАР КЕЛГЕНДЕ","b":25},{"title":"ЧЕГИРТКЕ","b":28},{"title":"ЧЫМЫН","b":39}],"pages":[153,157]},{"title":"§ 58. БАЙЛАНЫШТУУ КЕП САБАКТАРЫ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"158\">158<\/span>§ 58. БАЙЛАНЫШТУУ КЕП САБАКТАРЫ"},{"t":"p","h":"358-көнүгүү. Текстти окугула. Ал эмне жөнүндө экен? Өз сөзүңөр менен айтып бергиле. Мазмунуна жараша ойлонуп ат койгула."},{"t":"p","h":"Асыл апа чай ичип жатканда тасмалга алма жана апельсин койду. Анан кыздары менен балдарына апельсинди аарчып, бөлүктөрүнө жараша бирдей бөлүп берди. Кичинекей кызы Элина эки бөлүк апельсинге ыраазы болбой калды го. Аны бүтүн эле өзү жегиси келген го... Апасына минтти:"},{"t":"p","h":"—Апа, апельсинди ким минтип ичинен эле бөлүп койгон?"},{"t":"p","h":"—Аны балдар бөлүп жесин, ашык жебесин деп, бөлүштүрүп койгон ичинен... – деди, тентек кызын көзүнүн кыйыгы менен карап."},{"t":"p","h":"Кызы бул сөздү угуп, дагы мындай деди апасына: —А анда алманы бүтүн жеш керекпи?.."},{"t":"p","h":"—Жок, – деди апасы дагы да токтоо, – алманы өзүлөрү бөлүп жесин деп бөлбөй жасаган..."},{"t":"p","h":"Элина түшүнгөн кишидей, көзүн чекчейтип башын ийкегиледи."},{"t":"p","h":"С. Рысбаев 1. Кана, кимдин койгон аты кандай? Талкуулагыла. 2. Жай жана суроолуу сүйлөмдөрдү таап, дептериңерге бөлүп жазгыла. Талдап түшүндүргүлө. 3. Асыл апага жана тентек Элинага мүнөздөмө бергиле. Алардын мүнөздөрүн кандай сын атооч сөздөр менен сыпаттоого болот. 4. Асыл апанын айткан сөздөрүнө ынандыңарбы? Силердин өз пикириңер кандай? Талкуулагыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"159\">159<\/span>? Чыгарманын аты анын мазмунуна жараша коюлат. Баланын аты бактылуу болсун, – деп коюлат."},{"t":"v","l":["","359-көнүгүү. Төмөнкү ырды окугула. Мазмунун өз сөзүңөр менен айтып бергиле. Анан суроолорго жооп бергиле."]},{"t":"h3","h":"ЭНЕКЕМ"},{"t":"v","l":["Жарык дүйнө, жашоо берген энекем,","Баскан жолуң – бийик ашуу, бел экен.","Жан кейиткен азаптарга чыдаган,","Кайрат, күчүң аска-тоодой бек экен.","Балаң үчүн төккөн ысык мээримиң,","Айтып бүткүс асылдыкка тең экен.","Сен мен үчүн ырыс чачкан шооламсың,","Өмүрдөгү түгөнбөгөн берекем.","Кыйын күндө кыйбас дагы алмашпас,","Кең ааламда жалгыз гана эне экен.","Турмуш оорун кебелбестен көтөргөн","Жер үстүндө адам аттуу «жер» экен.","А. Чойбекова"]},{"t":"p","h":"1. Ырдын аты мазмунуна туура келет бекен? 2. Эненин эмгеги эмне деген сөздөр менен даана айтылып жатат? Ырдагы негизги ой эмне? 3. Кандай сын атооч сөздөр катышты? Ал сөздөр туура, орундуу колдонулдубу? 4. Акыркы эки сабын кандай түшүндүңөр?"},{"t":"v","l":["Машыгуу сабагы.","","360-көнүгүү. Ырды окугула. Айтылган ойлорду өз сөзүңөр менен баяндап бергиле. Андан соң тапшырмаларды аткаргыла."]},{"t":"h3","h":"КИТЕБИМЕ"},{"t":"p","h":"Окуганда сырдашкандай досума, Окуяңа өзүм кетем кошула."},{"t":"p","h":"<span class=\"pg\" data-n=\"160\">160<\/span>Кызыктырып ыракатка бөлөгөн, Сырларыңа жетким келет толтура."},{"t":"p","h":"Китептерим, менин жакын досторум, Көптү үйрөтүп, көңүлүмдү коштодуң... Сени менен асманында билимдин, Канаты бар учкан кушка окшодум."},{"t":"p","h":"Мукамбетова Ажар УКГнын 39-классынын окуучусу. ? 1. Ырдагы кара тамга менен берилген этиш сөздөр кайсы чакты билдирип турат? Алар кандай суроолорго жооп берет? Жазып талдагыла. 3. Өзүңөр да ушундай ыр жазгыла. Жазган ырларыңар эмне тууралуу? Чогуу окуп, талдагыла."},{"t":"h3","h":"ТӨРТ КАНАТТУУ КУШ"},{"t":"p","h":"Балдар, силер төрт канаттуу куш жөнүндө укканыңар барбы? Укпасаңар, мындай."},{"t":"p","h":"Канаттуулардын ичинде өтө ажайып бир кичинекей куш бар. Ал Африкада жашайт. Көгүчкөндөрдүн тукумуна кирет. Анын өзгөчөлүгү – канатынын өзүнчө бир бөлүгү бар экен. Ал учкан кезде, канатынын ошол узун бөлүгү артына өзүнчө бөлүнүп, желек сыяктуу желбиреп, өтө кооз көргөзөт экен. Ошондуктан аны «төрт канаттуу» деп атап коюшат."},{"t":"p","h":"Ажайып бул көгүчкөндүн өзүнүн узундугу 30-31 см болсо, кооз канатынын узундугу 17смге жетет экен."},{"t":"p","h":"361-көнүгүү. Төмөндөгү насаат сөздөрдү дептериңерге жазып алгыла. Маанисин түшүндүргүлө."},{"t":"h3","h":"АТАЛАРДЫН НАСААТТАРЫНАН"},{"t":"p","h":"– Досуңду өтө берилип сүйбөгүн. Себеби бирде болбосо бирде, ал өзүңө душман болуп калышы мүмкүн;"},{"t":"p","h":"– Душманыңа өтө кастык кылбагын, анткени бирде болбосо бирде, ал дос болуп калышы ыктымал."},{"t":"p","h":"<span class=\"pg\" data-n=\"161\">161<\/span>– Бирөөнүн аманатын өз убагында ээсине тапшыр. Кыянат кылганга сен кыянат кылба."},{"t":"p","h":"? Сүйлөмдөрдөн буйрук мааниде айтылган сөздөрдүн мүчөлөрүнүн алдын сызып белгилегиле."},{"t":"p","h":"Билип алгыла!"},{"t":"p","h":"Улуу адамдар силердей кезинде кандай болушкан? А. Токомбаев Улуу акын Аалы атабыз бала чагында укмуштуудай куйма кулактыгы менен айырмаланчу. Кичинекейинде энесинен уккан жомокторду, манасчылардан уккан эпостун саптарын эртеси өзү теңдүү балдарга төкпөй-чачпай жатка айтып берчү экен."},{"t":"p","h":"Машыгуу сабагы"},{"t":"p","h":"? Сөздү орду менен туура колдонуу эне тилди так билүүнү билдирет."},{"t":"p","h":"362-көнүгүү. Сүйлөмдөрдү окугула. Андагы кара тамга менен берилген сөздөр өз орду менен туура колдонулдубу? Байкагыла. Оңдоп, тууралап жазгыла."},{"t":"p","h":"1. Биздин тоок он беш балапан чыгарды. 2. Балдар чымчыктын уясынан беш жөжө таап алышты. 3. Атай кыргыздын мыкты чертмекчиси болгон. 4. Сабыр ойноп жүрүп уйдун торпогун эмизип, апасынан тил укту."},{"t":"p","h":"5. Кубан атка отура албай, коркуп ыйлады. 6. Биз зоопарктан түлкүнүн бачикисин көрдүк."},{"t":"p","h":"363-көнүгүү. Сүйлөмдөрдү окугула. Туура айтылдыбы? Кантип айтканда кыргызча таза болот. Оңдоп жазгыла."},{"t":"p","h":"1. Понедельникте кыргыз тил болот. 2. Шаардан байкем звонить этти. 3. Бүгүн Салтанаттын настроениеси жок. 4. Майды, этти холодильникке салдым. 5. Менин <span class=\"pg\" data-n=\"162\">162<\/span>ручкамдын запасы түгөнүп калды. 6. Мен Акман селосунда жашайм. Биз дубалга сүрөттөрдү клейледик."},{"t":"p","h":"? Ким өз эне тилинде таза сүйлөбөсө, ал өз элин, жерин сүйбөгөнгө тете."},{"t":"p","h":"364-көнүгүү. Ырды окугула да, жаттап алгыла. Ырдын мазмунуна жараша ат койгула."},{"t":"v","l":["Эне тилин билбеген,","Эси жогун аныктайт.","Эне тилин сүйбөгөн,","Элин сүйүп жарытпайт."]},{"t":"p","h":"Б. Сарногоев 365-көнүгүү. Юморду окугула. Ага ат койгула."},{"t":"v","l":["Төрт жашар Аида апасына:","—Апа, чай ичиңиз, – деп чай сунду."]},{"t":"p","h":"—Ыракмат, айланайын кызым, азыр эле дары ичип алдым. Ананыраак ичейин, – деди ага апасы."},{"t":"p","h":"—А... апа, ошо дарыга да курсак тоёт бекен? – деди анда Аида, таң калып."},{"t":"p","h":"С. Рысбаев 366-көнүгүү. Эми өзүңөрчө «Менин досум», «Биздин үйбүлө», «Биздин айыл» деген темалардан каалаганыңарды тандагыла да, чакан дилбаян жазгыла."},{"t":"img","src":"data:image/webp;base64,UklGRh4FAABXRUJQVlA4IBIFAADwJQCdASqAAjQAPrVUok2nJKMmKpIocOAWiWVulv+9b4nLhtlYNCojHzf8 ор – оор-ор."},{"t":"v","l":["<span class=\"pg\" data-n=\"163\">163<\/span>Шамал – амал – мал – ал.","Атай – тай – ай.","Окуу – куу – уу.","Дубал – убал – бал – ал."]},{"t":"p","h":"368-көнүгүү. Үлгүгө карап, маанилеш сөздөрдүн «чынжырын» түзгүлө. Алардын ар бирин сүйлөм ичинде алмаштырып, пайдаланып көрсөткүлө."},{"t":"p","h":"Абышка, сулуу, айтты, Кубан, чурка, чоң, үй, каалга, жамгыр, дос."},{"t":"p","h":"Үлгү: айтты – деди – сүйлөдү – унчукту."},{"t":"p","h":"Кубан мага мындай деди. Кубан мага мындай сөз айтты. Кубан мага мындай деп сүйлөдү."},{"t":"p","h":"369-көнүгүү. Бири-бирине карама-каршы маанилеш сөздөрдү таап, мисал келтиргиле."},{"t":"p","h":"Ак, кичине, өйдө, тап, ал, жакшы, таза, тааныш, белгилүү, узун, сулуу, бар, чыбык, алыс."},{"t":"p","h":"370-көнүгүү. Текстти окуп, төмөнкү тапшырмаларды аткаргыла."},{"t":"h3","h":"САРТ АКЕНИН НАСААТЫНАН"},{"t":"p","h":"– Эр жигит атка коном десең, кайраттуу да, сабырдуу да, көтөрүмдүү бол."},{"t":"v","l":["– Ата-баба салтын, акыл сөздөрүн жолдо, ула.","Андан башка жамандык көрбөйсүң."]},{"t":"p","h":"– Жакшыдан кол үзбөй, жаманга күнүң түшпөгүдөй болуп жаша."},{"t":"v","l":["– Чагым сөзгө кулак төшөбө.","? 1. Алды сызылган сөздөргө мүнөздөмө бергиле.","2. Сын атооч, этиш сөздөрүн таап, түшүндүргүлө."]},{"t":"p","h":"3. Ата-энелериңерден уккан ушундай элдик насаат сөздөрдү жазып көрсөткүлө."},{"t":"p","h":"<span class=\"pg\" data-n=\"164\">164<\/span>371-көнүгүү. Элдик накыл кептерди окугула. Алардын маанисин чечмелегиле. Ар бирин катыштырып, сүйлөм түзгүлө."},{"t":"p","h":"Аталардын сөзүнөн:"},{"t":"p","h":"Асыл таштан, акыл жаштан. Жаш келсе – ишке, кары келсе – ашка. «Жакшы» деген бир ат бар, кууса кеткис. «Жаман» деген бир бар, жууса кеткис."},{"t":"p","h":"372-көнүгүү. Төмөнкү сөз айкаштарын пайдаланып, сүйлөм түзүп келгиле."},{"t":"p","h":"Көзгө атар мерген – мыкты мергенчи."},{"t":"p","h":"Ачып көздү жумганча, айтып оозду жыйганча – бат, тез."},{"t":"v","l":["Балтыр эти ката элек – жаш (бала).","Беш колдой билген – жат билген.","Жетине албай калуу – сүйүнүү.","Ийненин көзүндөй – кичинекей.","Тырмактын агындай – аз.","Кеп жебес – сөз укпас.","Өз көмөчүнө күл тартуу – өзүмчүл.","Уйдун бөйрөгүндөй – бирикпес."]}],"sub":[{"title":"ЭНЕКЕМ","b":11},{"title":"КИТЕБИМЕ","b":15},{"title":"ТӨРТ КАНАТТУУ КУШ","b":20},{"title":"АТАЛАРДЫН НАСААТТАРЫНАН","b":25},{"title":"Бир тамгадан кемитип, жаңы сөз жасагыла","b":49},{"title":"САРТ АКЕНИН НАСААТЫНАН","b":60}],"pages":[158,164]},{"title":"§ 59. ИШ КАГАЗДАРЫН ЖАЗУУГА ҮЙРӨНӨЛҮ","blocks":[{"t":"h3","h":"§ 59. ИШ КАГАЗДАРЫН ЖАЗУУГА ҮЙРӨНӨЛҮ"},{"t":"p","h":"Келерки жумада биздин класстын ата-энелеринин чогулушу болот. Ал үчүн эмне кылуубуз керек?"},{"t":"p","h":"Биринчиден, ата-энелерге чакыруу кат жазуубуз зарыл. Туурабы? Анда аны кантип жазабыз?"},{"t":"p","h":"Адегенде, ата-энелерибизге сылык кайрылып, аты-жөнүн жазышыбыз, андан соң аларды чакыруубуздун себебин, чогулуш каерде, качан, саат канчада башталарын жазуубуз керек."},{"t":"p","h":"<span class=\"pg\" data-n=\"165\">165<\/span>Эмесе баштадык. Ири алдыда, силер өз алдыңарча жазгыла. Аңдан соң, мен берген үлгүгө салыштырасыңар..."},{"t":"p","h":"Үлгү: Чакыруу кат"},{"t":"p","h":"Урматтуу Жаңыл апа жана Бекзат ата! Сиздерди Ак-Өргө айылындагы №86-орто мектептин 8 «а» классынын ата-энелеринин чогулушуна чакырабыз. Чогулуш 2001-жылдын 25-майында мектептин жыйындар бөлмөсүндө өтөт."},{"t":"p","h":"20-май, 2001-жыл."},{"t":"p","h":"Иш кагаздарын эне тилиңерде жаза билүүгө көнүккүлө. Бул-сабаттуулуктун бир белгиси."},{"t":"p","h":"Чакыруу катты жазарын го жаздык. Эми жалпы окуучулардын жана мугалимдердин эсине салуу үчүн кулактандыруу да жазуубуз керек."},{"t":"p","h":"Аны да өзүңөрчө жазгыла. Андан соң, мен берген үлгүгө салыштыргыла да, көрүнөө жерге илгиле."},{"t":"p","h":"Үлгү:"},{"t":"h3","h":"КУЛАКТАНДЫРУУ"},{"t":"p","h":"Урматтуу, 3 «а» класстын окуучулары, ата-энелер жана агай, эжелер!"},{"t":"p","h":"2001-жылдын 25-майында 8 «а» класстын окуучуларынын ата-энелеринин чогулушу болот."},{"t":"p","h":"Каралуучу маселелер: Окуучулардын жыл боюнча жетишүү, катышуу деңгээлин, тартип жана тазалыгын талкуулоо жана классты жаңы окуу жылына даярдоо. Каалоочуларга эшик ачык."},{"t":"p","h":"<span class=\"pg\" data-n=\"166\">166<\/span>Чогулуш мектептин жыйындар бөлмөсүндө саат күндүзгү 15.00дө башталат."},{"t":"p","h":"Класс комитети"},{"t":"p","h":"Үйдөн жаратылышка саякатка качан барарыңар жөнүндө кулактандыруунун үлгүсүн жазып келгиле."},{"t":"p","h":"Машыгуу сабагы."},{"t":"p","h":"? Балдар, биз өзүбүздүн өмүр баяныбызды жаза алабызбы?"},{"t":"p","h":"Келгиле, ошону үйрөнөлү. Адегенде, өзүңөр билгениңерче: аты-жөнүңөр, ата-энеңер, туулган жер, туулган айылыңар, күнүңөр, каерде чоңоюп, каерде окууга киргениңер тууралуу жазгыла. Андан соң, үлгү менен салыштыргыла."},{"t":"p","h":"Үлгү:"},{"t":"h3","h":"ӨМҮР БАЯН"},{"t":"p","h":"Мен, Рыспаева Тумар Айдарбек кызы 1991-жылы Токтогул районундагы Сары-Камыш айылында жумушчунун үй-бүлөсүндө туулгам. Үч бир тууганмын. Атам – тракторист, апам Элмира-мугалим. Мен ушул эле айылда чоңойдум. Эгембердиев атындагы орто мектептин 1-классына 1999-жылы киргем. Учурда 3 «б» класста окуп жатам. Кыргыз тилин сүйүп окуйм, ыр ийримине үзбөй катышам."},{"t":"p","h":"? Балдар, биз өзүбүздү гана эмес, классташыбыз жөнүндө да билишибиз керек."},{"t":"p","h":"Келгиле, өз классташтарыбызга ар бирибиз мүнөздөмө жазууга үйрөнөлү да, окуу жылынын аягында белекке берели. Анда биз классташтарыбыздын жакшы да, начар да жактарын ачык жазып, жакшы жактарыбызды көтөрөлү, начар жактарыбызды жоюуга жардамдашалы..."},{"t":"p","h":"Эмесе, анын үлгүсү мындай."},{"t":"p","h":"<span class=\"pg\" data-n=\"167\">167<\/span>Үлгү:"},{"t":"h3","h":"МҮНӨЗДӨМӨ"},{"t":"p","h":"Бул мүнөздөмө Кочкор районундагы Б. Исакеев атындагы орто мектептин 3 «а» классынын окуучусу Шаршеналы кызы Бегайга."},{"t":"p","h":"Бегай бул мектепте 1-класстан бери окуп келатат. Ал – класстагы алдыңкы окуучу. Бардык сабактардан «4» жана «5» деген бааларга окуйт. Сабакты калтырбайт. Класстын коомдук иштерине үзбөй катышат. Кийимдерин кирдетпей, таза, тыкан жүрөт."},{"t":"p","h":"Бирок Бегай өзүмчүл, мүнөзү чукул. Классташтары сабактан жардам берүүсүн өтүнсө жактырбайт. Тамашаны көтөрө албай, уруша кетет."},{"t":"p","h":"Эгер ушундай мүнөзүн таштаса, эң жакшы адам болуп өсөрүнө жолдоштору ишенет."},{"t":"p","h":"Мүнөздөмө жазган Сагындык уулу Урмат"},{"t":"p","h":"Үйрөнүп ал: Сылыктыктай эң жөнөкөй жасалган, бирок андан кымбат бааланган эч нерсе жок."},{"t":"v","l":["<span class=\"pg\" data-n=\"169\">169<\/span>","","Окуу басылмасы","","Рысбаев Сулайман Казыбай уулу","Исакова Чолпон Бектур кызы"]},{"t":"h3","h":"КЫРГЫЗ ТИЛИ"},{"t":"v","l":["Кыргыз орто мектептеринин","3-класстары үчүн окуу китеби","","Оңдолуп, үчүнчү басылышы","","Редакторлору С. Кунусбаев, Ч. Тайтёлиев","Сүрөтчүсү З. Мидинова","Корректору Исакова Чолпон Бектур кызы","Компьютердик калыпка салган М. Кадыров","Тех. редактору К. Төрөкулов","","Терүүгө 05.06.2009-ж. берилди. Басууга 10.08.2009-ж. кол","коюлду. Кагаздын форматы 60х84 1/16 Офсет кагазы. «Мектеп»","ариби. 10,5 физ. басма табак. Нускасы 5000. Заказ 35.","","«Полиграфбумресурсы» ЖЧК басмаканасында басынды.","Бишкек шаары. 720011, Сүйүнбаев көчөсү 144/23"]}],"sub":[{"title":"КУЛАКТАНДЫРУУ","b":12},{"title":"ӨМҮР БАЯН","b":23},{"title":"МҮНӨЗДӨМӨ","b":29},{"title":"КЫРГЫЗ ТИЛИ","b":37}],"pages":[165,169]}],"fixed":true,"quality":"proofread"};</script>

  // ---------------------------------------------------------------- storage helpers
  function lsGet(k, def) { try { var v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode: ignore */ } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

  var defLang = (navigator.language || '').toLowerCase().indexOf('ky') === 0 ? 'ky' : 'ru';
  var S = lsGet('settings', null) || {};
  S.fs = S.fs || 19; S.lh = S.lh || 1.55; S.theme = S.theme || 'light'; S.font = S.font || 'serif'; S.ui = S.ui || defLang;

  function t(k) { return (I18N[S.ui] || I18N.ru)[k] || I18N.ru[k] || k; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function $(sel, root) { return (root || document).querySelector(sel); }

  var THEME_BG = { light: '#ffffff', sepia: '#f5ecd9', dark: '#111315', contrast: '#000000' };
  function applySettings() {
    var r = document.documentElement;
    r.setAttribute('data-theme', S.theme);
    r.setAttribute('data-font', S.font);
    r.style.setProperty('--fs', S.fs + 'px');
    r.style.setProperty('--lh', String(S.lh));
    r.lang = S.ui;
    var m = $('meta[name=theme-color]'); if (m) m.setAttribute('content', THEME_BG[S.theme]);
    lsSet('settings', S);
  }

  var toastTimer;
  function toast(msg) {
    var el = $('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg; el.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.style.display = 'none'; }, 2600);
  }

  function fetchJSON(url) {
    // revalidate with the server, so a corrected book or a new book list shows up on the next visit
    return fetch(url, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  var app = document.getElementById('app');
  var cleanup = null; // reader teardown

  function route() {
    if (cleanup) { cleanup(); cleanup = null; }
    if (EMB) return openReader(EMB.id);
    var m = location.hash.match(/^#\/read\/([\w.-]+)/);
    if (m) openReader(m[1]);
    else if (location.hash === '#/my') showMyBooks();
    else if (location.hash === '#/news') showNews();
    else if (location.hash === '#/missing') showMissing();
    else showLibrary();
  }

  // ================================================================ LIBRARY
  function cacheName(b) { return 'book-' + b.id + '-' + b.v; }

  // The library is organised by school (language of instruction), then grade, then subject.
  // Choosing the school also sets the interface language.
  var SCHOOLS = [['ky', 'Кыргыз мектеби'], ['ru', 'Русская школа']];

  // Subjects in the order the ministry lists them. A book's subject comes from its "subject"
  // field when index.json has one, otherwise from its title; a title that matches nothing
  // becomes its own subject, so new books always show up.
  var SUBJECTS = [
    ['kyrgyz-tili', /кыргыз тили|кыргызский язык/, 'Кыргыз тили', 'Кыргызский язык'],
    ['kyrgyz-adabiyat', /кыргыз адабият|кыргызская литература/, 'Кыргыз адабияты', 'Кыргызская литература'],
    ['russkiy-yazyk', /русский язык|орус тили/, 'Орус тили', 'Русский язык'],
    ['russkaya-literatura', /русская литература|литературное чтение|орус адабият/, 'Орус адабияты', 'Русская литература'],
    ['adabiyat', /адабият|литератур/, 'Адабият', 'Литература'],
    ['matematika', /математик|алгебр|геометр/, 'Математика', 'Математика'],
    ['fizika', /физик/, 'Физика', 'Физика'],
    ['himiya', /хими/, 'Химия', 'Химия'],
    ['biologiya', /биолог/, 'Биология', 'Биология'],
    ['geografiya', /географ/, 'География', 'География'],
    ['istoriya-kg', /кыргызстан\S* тарых|история кыргызстана/, 'Кыргызстандын тарыхы', 'История Кыргызстана'],
    ['istoriya-mir', /дүйнө тарых|орто кылым|жаңы тарых|соңку тарых|байыркы|всемирная история|средних век|новая история|новейшая история|древн/, 'Дүйнө тарыхы', 'Всемирная история'],
    ['religii', /диндер|религи/, 'Диндердин тарыхы', 'История религий'],
    ['obshchestvo', /адам жана коом|человек и общество/, 'Адам жана коом', 'Человек и общество'],
    ['grazhdanstvennost', /гражданствен|жарандык/, 'Жарандык', 'Гражданственность'],
    ['english', /англ|english/, 'Англис тили', 'Английский язык']
  ];
  function subjectOf(b) {
    var s = String(b.subject || b.title || '').toLowerCase();
    for (var i = 0; i < SUBJECTS.length; i++) {
      if (b.subject === SUBJECTS[i][0] || SUBJECTS[i][1].test(s)) return { key: SUBJECTS[i][0], order: i, name: SUBJECTS[i][S.ui === 'ky' ? 2 : 3] };
    }
    return { key: 'x:' + s, order: SUBJECTS.length, name: b.subject || b.title };
  }

  // "My books": books the reader opened or added, stored on the phone. 1 = in the list,
  // 0 = removed by the reader. Books opened before this list existed count as added.
  function myState() { return lsGet('mybooks', null) || {}; }
  function inMy(id) { var s = myState()[id]; return s === 1 || (s !== 0 && !!lsGet('pos:' + id, null)); }
  function setMy(id, on) { var s = myState(); s[id] = on ? 1 : 0; lsSet('mybooks', s); }

  var libHash = '#/'; // where the reader's back button returns to

  function libShell(title, link, main) { // main: the library page (intro text and school switch)
    document.title = title;
    var school = S.school || (S.ui === 'ky' ? 'ky' : 'ru');
    app.innerHTML = '<div class="lib"><div class="lib-head"><button class="icon burger" aria-label="' + esc(t('menu')) + '">' + ICONS.menu + '</button><h1>' + esc(title) + '</h1>' + link + '</div>' +
      (main ? '<p class="sub">' + esc(t('appSub')) + '</p><div class="school">' + SCHOOLS.map(function (o) {
        return '<button data-s="' + o[0] + '"' + (o[0] === school ? ' class="on"' : '') + '>' + esc(o[1]) + '</button>';
      }).join('') + '</div>' : '') +
      '<div id="books"><div class="loading">' + esc(t('loading')) + '</div></div></div>';
    $('.burger', app).onclick = openMenu;
    Array.prototype.forEach.call(app.querySelectorAll('.school button'), function (btn) {
      btn.onclick = function () {
        S.school = S.ui = btn.getAttribute('data-s'); applySettings();
        route(); // redraw the page we are on (setting the same hash would not fire hashchange)
      };
    });
    return school;
  }

  var LIST = null; // the last book list loaded, for the reader's quality badge
  function loadList() {
    return fetchJSON('books/index.json').then(function (list) { LIST = list; return list; }).catch(function (e) {
      $('#books').innerHTML = '<div class="loading">' + esc(t('err')) + '</div>'; throw e;
    });
  }

  function showLibrary() {
    libHash = '#/';
    var school = libShell(t('appTitle'), '<a class="btn my-link" href="#/my">' + esc('★ ' + t('my')) + '</a>', true);
    loadList().then(function (list) {
      list = list.filter(function (b) { return !b.school || b.school === school; });
      var grades = [];
      list.forEach(function (b) { gradesOf(b).forEach(function (g) { if (grades.indexOf(g) < 0) grades.push(g); }); });
      grades.sort(function (a, b) { return a - b; });
      var open = lsGet('libOpen', {});
      var box = $('#books');
      box.innerHTML = grades.length ? '' : '<div class="loading">' + esc(t('noBooks')) + '</div>';
      grades.forEach(function (g) {
        var books = list.filter(function (b) { return gradesOf(b).indexOf(g) >= 0; });
        var sec = document.createElement('section'); sec.className = 'grade';
        sec.innerHTML = '<button class="grade-h"><span>' + esc(g + ' ' + t('grade')) + '</span><span class="n">' + books.length + '</span></button><div class="grade-b"></div>';
        var head = $('.grade-h', sec), body = $('.grade-b', sec);
        function setOpen(on) {
          sec.classList.toggle('open', on);
          body.innerHTML = '';
          if (on) bySubject(books, body, false);
        }
        head.onclick = function () {
          var on = !sec.classList.contains('open');
          Array.prototype.forEach.call(box.querySelectorAll('.grade.open'), function (s) { if (s !== sec) { s.classList.remove('open'); $('.grade-b', s).innerHTML = ''; } });
          setOpen(on);
          open[school] = on ? g : null; lsSet('libOpen', open);
          if (on && sec.scrollIntoView) sec.scrollIntoView({ block: 'start' });
        };
        box.appendChild(sec);
        if (open[school] === g) setOpen(true);
      });
    });
  }

  function showMyBooks() {
    libHash = '#/my';
    libShell(t('my'), '<a class="btn my-link" href="#/">' + esc('‹ ' + t('allBooks')) + '</a>', false);
    loadList().then(function (list) {
      var box = $('#books');
      var mine = list.filter(function (b) { return inMy(b.id); });
      box.innerHTML = '';
      if (!mine.length) { box.innerHTML = '<div class="loading">' + esc(t('myEmpty')) + '</div>'; return; }
      var grades = [];
      mine.forEach(function (b) { var g = gradesOf(b)[0]; if (grades.indexOf(g) < 0) grades.push(g); });
      grades.sort(function (a, b) { return (a == null ? 99 : a) - (b == null ? 99 : b); });
      grades.forEach(function (g) {
        var sec = document.createElement('section'); sec.className = 'grade open';
        sec.innerHTML = '<h2 class="grade-t">' + esc(g == null ? '' : g + ' ' + t('grade')) + '</h2><div class="grade-b"></div>';
        bySubject(mine.filter(function (b) { return gradesOf(b)[0] === g; }), $('.grade-b', sec), true);
        box.appendChild(sec);
      });
    });
  }

  // The menu (☰ in the library header): the site's pages, as a panel sliding in from the left.
  function openMenu() {
    var bg = document.createElement('div'); bg.className = 'sheet-bg';
    var nav = document.createElement('nav'); nav.className = 'drawer';
    var cur = location.hash || '#/';
    var items = [['#/', t('allBooks')], ['#/my', '★ ' + t('my')], ['#/missing', t('missing')], ['#/news', t('news')]];
    nav.innerHTML = '<div class="drawer-h"><span>' + esc(t('appTitle')) + '</span><button class="icon x" aria-label="' + esc(t('close')) + '">' + ICONS.close + '</button></div>' +
      items.map(function (it) { return '<a href="' + it[0] + '"' + (it[0] === cur ? ' class="cur"' : '') + '>' + esc(it[1]) + '</a>'; }).join('') +
      (API ? '<p class="note">' + esc(t('reportHint')) + '</p>' : '');
    document.body.appendChild(bg); document.body.appendChild(nav);
    function close() { bg.remove(); nav.remove(); }
    bg.onclick = close; $('.x', nav).onclick = close;
    nav.addEventListener('click', function (e) { if (e.target.closest('a')) close(); });
  }

  var MONTHS = {
    ru: ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'],
    ky: ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь']
  };
  function fmtDate(d) { // "2026-09-29" -> "29 сентября 2026" / "29-сентябрь, 2026"
    var m = String(d).match(/^(\d{4})-(\d\d)-(\d\d)/); if (!m) return d;
    return S.ui === 'ky' ? +m[3] + '-' + MONTHS.ky[+m[2] - 1] + ', ' + m[1] : +m[3] + ' ' + MONTHS.ru[+m[2] - 1] + ' ' + m[1];
  }
  function bookLink(b) {
    return '<a href="#/read/' + esc(b.id) + '">' + esc(b.title + (b.grade ? ', ' + b.grade + ' ' + t('grade') : '')) + '</a>';
  }

  // "What's new": site/changelog.json, newest first. Each entry: {"date": "YYYY-MM-DD", "ru": "...", "ky": "...",
  // "books": [book ids, optional]}. Book-publishing threads add an entry at the top with every publish.
  function showNews() {
    libHash = '#/news';
    libShell(t('news'), '', false);

  var CHUNK = 8 * 1048576, MAX_FILE = 500 * 1048576;
  function uploadForm(box, list) {
    var f = document.createElement('form'); f.className = 'up';
    f.innerHTML = '<label>' + esc(t('upBook')) + '</label><select name="book">' + list.map(function (m, i) {
      return '<option value="' + i + '">' + esc(m.title + ', ' + m.grade + ' ' + t('grade') + ' (' + m.authors + ')') + '</option>';
    }).join('') + '<option value="-1">' + esc(t('upOther')) + '</option></select>' +
      '<label>' + esc(t('upFiles')) + '</label><input type="file" name="files" multiple accept="application/pdf,image/*">' +
      '<label>' + esc(t('upContact')) + '</label><input type="text" name="contact" maxlength="200" autocomplete="off">' +
      '<label>' + esc(t('upComment')) + '</label><textarea name="comment" rows="2" maxlength="2000"></textarea>' +
      '<button class="btn primary" type="submit">' + esc(t('upSend')) + '</button><div class="progress" hidden><i></i></div>';
    box.appendChild(f);
    var btn = $('button', f), prog = $('.progress', f), bar = $('.progress i', f);
    f.onsubmit = function (e) {
      e.preventDefault();
      var files = Array.prototype.slice.call(f.files.files);
      if (!files.length) { toast(t('upNoFiles')); return; }
      for (var i = 0; i < files.length; i++) if (files[i].size > MAX_FILE) { toast(t('upTooBig') + files[i].name); return; }
      var m = list[+f.book.value], total = files.reduce(function (a, x) { return a + x.size; }, 0) || 1, sent = 0;
      btn.disabled = true; btn.textContent = t('upSending'); prog.hidden = false; bar.style.width = '0';
      postJSON('/uploads', { book: m ? m.title + ', ' + m.grade + ' (' + m.school + '): ' + m.authors : 'other', contact: f.contact.value, comment: f.comment.value, lang: S.ui })
        .then(function (up) {
          // each file goes in pieces, so a big scan survives a slow mobile connection
          return files.reduce(function (p, file) {
            return p.then(function () {
              return postJSON('/uploads/' + up.id + '/files', { name: file.name, size: file.size, type: file.type }).then(function (fr) {
                var parts = [], n = 0;
                function next() {
                  var start = n * CHUNK; if (start >= file.size && n > 0) return Promise.resolve();
                  var piece = file.slice(start, start + CHUNK), num = ++n;
                  return api('/uploads/' + up.id + '/files/' + fr.file + '/' + num, { method: 'PUT', body: piece }).then(function (pr) {
                    parts.push({ n: num, etag: pr.etag }); sent += piece.size; bar.style.width = Math.round(sent / total * 100) + '%';
                    return next();
                  });
                }
                return next().then(function () { return postJSON('/uploads/' + up.id + '/files/' + fr.file + '/done', { parts: parts }); });
              });
            });
          }, Promise.resolve());
        })
        .then(function () { f.innerHTML = '<p class="done">' + esc(t('upDone')) + '</p>'; })
        .catch(function () { btn.disabled = false; btn.textContent = t('upSend'); prog.hidden = true; toast(navigator.onLine === false ? t('offline') : t('err')); });
    };
  }

      groups[s.key].books.push(b);

    keys.sort(function (a, b) { var x = groups[a].s, y = groups[b].s; return x.order - y.order || (x.name < y.name ? -1 : x.name > y.name ? 1 : 0); });
    keys.forEach(function (k) {

    function download(quiet) {

  // Share a book: a link (opens the app at the book) or the single-file book, through the

  function shareSheet(b) {
    var name = b.title + (b.grade ? ', ' + b.grade + ' ' + t('grade') : '');
    var url = location.href.split('#')[0] + '#/read/' + b.id;
    var old = $('.sheet'); if (old) old.remove(); old = $('.sheet-bg'); if (old) old.remove();
    var bg = document.createElement('div'); bg.className = 'sheet-bg';
    var sh = document.createElement('div'); sh.className = 'sheet';
    sh.innerHTML = '<h3><span>' + esc(t('share')) + ': ' + esc(name) + '</span><button class="icon x" aria-label="' + esc(t('close')) + '">' + ICONS.close + '</button></h3>' +
      '<div class="share-opts"><button class="btn primary s-link">' + esc(t('shareLink')) + '</button>' +
      (b.standalone ? '<button class="btn s-file">' + esc(t('shareFile')) + '</button><div class="note">' + esc(t('shareFileNote')) + '</div>' : '') + '</div>';
    document.body.appendChild(bg); document.body.appendChild(sh);
    function close() { bg.remove(); sh.remove(); }
    bg.onclick = close; $('.x', sh).onclick = close;

    $('.s-link', sh).onclick = function () {
      if (navigator.share) {
        navigator.share({ title: name, text: name, url: url }).then(close, function () { /* cancelled */ });
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { toast(t('linkCopied')); close(); }, function () { window.prompt(t('shareLink'), url); });
      } else {
        window.prompt(t('shareLink'), url);
      }
    };
    var fbtn = $('.s-file', sh);
    if (!fbtn) return;
    var file = null;
    function save() {
      var a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove(); toast(t('fileSaved')); close();
    }
    function send() {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {

  function downloadBook(b, onProgress) {
    var base = 'books/' + b.id + '/';
    var cache;
    return caches.open(cacheName(b)).then(function (c) {
      cache = c;
      return fetch(base + 'book.json');
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return cache.put(base + 'book.json', r.clone()).then(function () { return r.json(); });
    }).then(function (book) {
      // app files are kept up to date by the service worker (sw.js), not stored with each book
      var urls = book.images.map(function (i) { return base + i; });
      var done = 0;
      // a few requests in parallel: fast on 3G, gentle on slow phones
      var queue = urls.slice();
      function worker() {
        var u = queue.shift();
        if (!u) return Promise.resolve();
        // a picture already saved with an older version of this book is reused, not downloaded again
        return caches.match(u).then(function (hit) {
          if (hit) return cache.put(u, hit);
          return fetch(u).then(function (r) { if (!r.ok) throw new Error(u); return cache.put(u, r); });
        }).then(function () { done++; onProgress(done / urls.length); return worker(); });
      }
      if (!urls.length) onProgress(1);
      return Promise.all([worker(), worker(), worker(), worker()]);
    }).then(function () {
      lsSet('dl:' + b.id, b.v);
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      return caches.keys().then(function (keys) { // drop older versions of this book
        return Promise.all(keys.filter(function (k) { return k.indexOf('book-' + b.id + '-') === 0 && k !== cacheName(b); }).map(function (k) { return caches.delete(k); }));
      });
    });
  }

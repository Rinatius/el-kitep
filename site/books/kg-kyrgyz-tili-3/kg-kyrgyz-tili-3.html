I+lTTYZaFqFINjrx7uVXouo+tJjd1Uk7ybrH+ahNXdGmaQW9jS5bMKHI2TuvYsMEVJCSjR+ISgR2me0vSsDi7PhOgkEvfDnDDMYJgI2feSiOuwD913thHc2+Zqbi2nuUnBbdUGS5+3cej7CtgTDb4ZqAx1tOIhqOIQImNpVkpi28AEtzh84F3ECdK8DEcVHSeX5W5I8AAAA==","w":640,"ht":360},{"t":"p","h":"<span class=\"pg\" data-n=\"47\">47<\/span>1. Анткор арстан кантип тамак таап жеди? 2. Куу түлкү кантип аман калды? 3. Адамдардан ушундай анткорлук жана куулукту көрдүңбү? Сен билген ушундай адамдар барбы? Билсең аңгемелеп айтып берчи."},{"t":"v","l":["Кайталоо сабагы","","I. Кайталоо үчүн суроолор:"]},{"t":"p","h":"– Айтылышы жана жазылышы бирдей болбогон сөздөр кандай сөздөр экен?"},{"t":"p","h":"– Уңгулаш зат, сын, сан, этиш сөздөрү жөнүндө эмнелер эсиңерде калды?"},{"t":"p","h":"– Зат атоочтордун жалпы жана энчилүү аттарынын кандай айырмасы бар?"},{"t":"p","h":"II. Практикалык тапшырмалар:"},{"t":"p","h":"Бул сөздөрдөн туура айтылышы менен жазылышын түшүндүргүлө: каччы, ала карга, тонбу, нанбы, кечээ күнү."},{"t":"p","h":"– тоо, кызыл, беш, окуу сөздөрүн катыштырып, уңгулаш сөздөрдү түзүп көрсөткүлө."},{"t":"p","h":"– окуучу, Темирлан, жылкы, Аккула, күчүк – Короочу сыяктуу мисалдардан бештен келтирип, алардын жалпы жана энчилүү аттары кайсылар экенин түшүндүргүлө."},{"t":"p","h":"III. Байланыштуу кепти өстүрүү жана талдоо үчүн тапшырмалар:"},{"t":"h3","h":"ЛИЛИПУТТАРДЫН ЦИРКИ"},{"t":"p","h":"Лилипуттар – бою кыска адамдар. Аларды биз эргежээлдер деп атап коёбуз. Лилипуттардын бою кадимки <span class=\"pg\" data-n=\"48\">48<\/span>адамдардан эки-үч эсе кыска келет. Болгону 55-70 см, же салмактары 10-20 кг болушат. Ошол үчүн чоң кишилерге баладай эле көрүнөрү ыктымал. Бирок алар Өзүлөрүн «кичинекей кишилер», «эргежээлдер» дешсе, анчалык жактырышпайт."},{"t":"p","h":"Алар ар нерсеге шыктуу, өнөрлүү келишет. Өзгөчө, «Лилипуттардын» цирки дүйнө элдерин таң калтырып келет. Кайсы элде болбосун, бала дебей, чоң дебей кызыгып көрүшөт. Алар татаал цирк оюндарын эң эле чебердик менен аткарышат."},{"t":"p","h":"1. Лилипуттар деген кимдер? 2. Лилипуттардын циркин көрдүңөр беле? Алар кандай экендиктери эсиңерде барбы? Көрсөңөр, өз алдыңарча лилипуттар жөнүндө чакан аңгеме жазгыла."},{"t":"h3","h":"<span class=\"pg\" data-n=\"49\">49<\/span>II ЧЕЙРЕК"},{"t":"p","h":"Бул ирет мурунку чейректе үйрөнгөнүбүздү улантабыз:"},{"t":"p","h":"* Зат атоочтордун жөндөлүшүн толугу менен үйрөнөбүз, машыгабыз;"},{"t":"p","h":"* Сын атооч сөз түркүмүнүн табиятын Заттын өңүн, формасын, даамын кандай сын атоочтор билдирерин жана да сын атоочтун даражалары жөнүндө алгач ирет тушунук алабыз;"},{"t":"p","h":"* Үйрөнгөндөрүбүздү жөн гана жаттабай, өзүбүздүн сөзүбүздө сын атооч сөз түркүмүнүн кантип жолугарын талдап билели."}],"sub":[{"title":"ЖУСУП БАЛАСАГЫН БАБАБЫЗДЫН НАСААТТАРЫНАН","b":5},{"title":"«ЭЛ АЛДЫНДА БИЙЛЕСЕМ» ДЕЙМ","b":8},{"title":"АКЫЛМАН ЭЗОПТУН ТАМСИЛДЕРИНЕН","b":18},{"title":"Арстан менен түлкү","b":19},{"title":"ЛИЛИПУТТАРДЫН ЦИРКИ","b":34},{"title":"II ЧЕЙРЕК","b":38}],"pages":[44,49]},{"title":"§ 20. ИЛИК ЖӨНДӨМӨСҮ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"50\">50<\/span>§ 20. ИЛИК ЖӨНДӨМӨСҮ"},{"t":"p","h":"Илик жөндөмөсүндөгү заттар бир нерсенин кимге, эмнеге таандык экендигин билдирет да, -нын мүчөсүнүн жардамы аркылуу жасалат."},{"t":"p","h":"Кимдин? эмненин? деген суроолорго жооп берет. Мисалы: Атанын баласы, эненин сүтү, баланын тилеги, кыштын суугу, күндүн чыгышы."},{"t":"p","h":"97-көнүгүү. Берилген сөздөргө илик жөндөмөсүнүн мүчөсүн улап айткыла."},{"t":"p","h":"Кылым, таене, капчыгай, мугалим, булак, достук, боз үй, көөкөр, ышкын, карагат."},{"t":"p","h":"98-көнүгүү. Үлгүгө ылайык иштегиле."},{"t":"h3","h":"БАЛДАРЫН ТААП БЕРГИЛЕ"},{"t":"raw","h":"<h4 class=\"mk\">Коён Аюу Карышкыр Чычкан Түлкү Эчки Ит Тоок Элик<\/h4>"},{"t":"p","h":"чие"},{"t":"v","l":["жөжө","күчүк","-нын баласы","мамалак","улак","чаарчык","бачики","бөлтүрүк","коёнек, бөжөк","","Үлгү: Чычкандын баласы – чие."]},{"t":"p","h":"Билип ал: жаңы туулган баланы кээде чиеге салыштырышат."},{"t":"p","h":"Мисалы: Анын чиедей эки баласы бар."},{"t":"p","h":"99-көнүгүү. Окугула. Илик жөндөмөсүндөгү сөздөрдүн астын сызгыла."},{"t":"v","l":["<span class=\"pg\" data-n=\"51\">51<\/span>Кайран энең Каныкей,","Он эки кыздын кенжеси.","Ошончо кыздын эркеси,","Кең көйнөктүн тазасы.","Зайыпзаттын паашасы,","Кара сурдун сулуусу,","Аялзаттын нурлуусу.","Узун чачтын ыктуусу.","Ак жоолуктун мыктысы,","Акылга дыйкан эң билгич,","Касиеттүү жан эле.","С. Каралаев"]},{"t":"p","h":"100-көнүгүү. Юморду окуп, илик жөндөмөдө турган сөздөргө суроо бергиле."},{"t":"h3","h":"МЕНДЕЙ МЕНЕН СЕНДЕЙДИН ЖОРУКТАРЫНАН"},{"t":"v","l":["«Иттин баласы»","– Ата, – деди Сендей бир күнү, – бир киши менин сенин балаң экенимди билбейт экен.","– И... Ким экен ал? Ал эмне деди?"]},{"t":"p","h":"– Билбейм... Ал мени: «Иттин баласы турбайсыңбы?» – дебедиби."},{"t":"v","l":["С. Рысбаев","","Эсиңерге туткула!"]},{"t":"p","h":"-нын мүчөсү айрым учурда көмүскөдө калып айтылат."},{"t":"v","l":["Мисалы: Азиз хан уулу Алмамбет.","– Кимдин уулу Алмамбет?","– Азиз хандын уулу.","Же болбосо: Айкөл Манас Сыргагы.","– Кимдин Сыргагы?","– Айкөл Манастын Сыргагы."]},{"t":"p","h":"<span class=\"pg\" data-n=\"52\">52<\/span>101-көнүгүү. -нын мүчөсүнүн көмүскөдө калган учуруна төрт сүйлөм түз."},{"t":"p","h":"Үлгү: Күн желеси: Күн желеси түркүн түрлүү түскө ээ."},{"t":"p","h":"102-көнүгүү. Төмөндөгү сөздөргө илик жөндөмөсүнүн мүчөсүн улап жазгыла, «Т», «д» тыбыштарынын катар келген учурларына көңүл бургула."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Болот<\/td><td>Порт<\/td><td>Телевизор Компьютер<\/td><\/tr><tr><td>Кит<\/td><td>Кант<\/td><td>Завод<\/td><td>Мамбет<\/td><\/tr><tr><td><\/td><\/tr><\/table><\/div>"}],"sub":[{"title":"БАЛДАРЫН ТААП БЕРГИЛЕ","b":6},{"title":"МЕНДЕЙ МЕНЕН СЕНДЕЙДИН ЖОРУКТАРЫНАН","b":15}],"pages":[50,52]},{"title":"§ 21. БАРЫШ ЖӨНДӨМӨСҮ","blocks":[{"t":"h3","h":"§ 21. БАРЫШ ЖӨНДӨМӨСҮ"},{"t":"p","h":"103-көнүгүү. Окугула. Кара тамга менен басылган сөздөргө суроо бергиле. Уңгу, мүчөгө ажыраткыла."},{"t":"v","l":["Кулагыңа кумуш сырга!","1. Улууга – урмат, кичүүгө – ызат.","2. Жакшыга бир сөз, жаманга миң сөз.","3. Малга жарды болсоң да, сөзгө жарды","болбогун."]},{"t":"p","h":"Барыш жөндөмөсүндөгү заттар кыймыл-аракеттин кимге, эмнеге багытталгандыгын билдирет да, кимге? эмнеге? деген суроолорго жооп берет."},{"t":"v","l":["Негизги мүчөсү -га (-ка, -ке, -кө, -ге, -го, -гө).","Мисалы: Изатка, келечекке, текчеге."]},{"t":"p","h":"104-көнүгүү. Төмөндөгү сөздөрдү барыш жөндөмөсүнө жөндөгүлө. Аягы к тыбышы менен бүткөн сөздөргө көңүл бөлгүлө."},{"t":"p","h":"Жоолук, гүлкайыр, жоогазын, бетеге, пейзаж, Айгерим, сүлгү, түлөө, лицей, чамгарак, терек, күздүк."},{"t":"p","h":"<span class=\"pg\" data-n=\"53\">53<\/span>105-көнүгүү. Берилген сөздөргө барыш жөндөмөсүнүн мүчөсүн жалгагыла. Дептериңерге жазгыла."},{"t":"raw","h":"<h4 class=\"mk\">Бала, Эне, Көл, Тоо, Шаар + -га бардым<\/h4>"},{"t":"p","h":"Чүй, Жумуш, Дүкөн, Мектеп, Конок + га бардык"},{"t":"p","h":"106-көнүгүү. Окугула. Барыш жөндөмөсүндөгү зат атоочтор катышкан сүйлөмдөргө көңүл бургула."},{"t":"h3","h":"ЧОМОТОЙ САЯТЧЫ"},{"t":"p","h":"Чомотой саятчы бардык куштун тилин билген. Бир күнү саятчыга кузгун келди. Экөө көпкө аңгемелешти. Бир маалда кузгун ыйлап жиберди. Муну көрүп, Чомотой чоочуп кетти: «Эмне болду, Куке! Байбичең көрүнбөйт, сыркообу?»"},{"t":"p","h":"«Ар жылы алтыдан балапандуу болобуз. Чоңоюп темир канат болгондо эле, уянын кырына чыгабыз деп, учуп өлүп калышат. Бүгүн кемпирим кайтарып калды» – дейт."},{"t":"p","h":"Чомотой кузгунга бир түрүм шоона берет. Кузгун саятчынын акылына ыраазы болот. Ошондон кийин балдарын уяга бутунан байлап бекитип калган экен."},{"t":"p","h":"Сөздүк:"},{"t":"p","h":"1. Саятчы – куштун тилин билген адам."},{"t":"p","h":"2. Шоона – эчкинин кылынан жүнгө аралаштырып эшилген жип."},{"t":"p","h":"107-көнүгүү. Окугула да, тапшырмаларды аткаргыла."},{"t":"p","h":"Кулагыңа кумуш сырга!"},{"t":"p","h":"«Эринчээкке эшик – арт». Бул нусканы залкар жазуучубуз Түгөлбай Сыдыкбеков мындай деп чечмелейт:"},{"t":"p","h":"<span class=\"pg\" data-n=\"54\">54<\/span>«Эринчээкке эшик – арт, эринчээк болбо, балам, – дечү энем."},{"t":"p","h":"– Эшик артың эмне, эне? – десем."},{"t":"p","h":"Арт – бул ашуу. Эринчээк кишиге эшик ачып чыгуу ашуу ашкандай көрүнөт, – дээр эле энем."},{"t":"p","h":"Ушул сөздү кийин мен Махмуд Кашкарынын китебинен окудум."},{"t":"p","h":"? 1. Эринчээк дегенди кандай түшүнөсүң? 2. Макалды жазып ал, эсиңе тут, сөзүңө кошуп сүйлө. 3. Барыш жөндөмөсүнүн мүчөсү уланган сөздөрдү таап, түшүндүр."}],"sub":[{"title":"ЧОМОТОЙ САЯТЧЫ","b":11}],"pages":[53,54]},{"title":"§ 22. ТАБЫШ ЖӨНДӨМӨСҮ","blocks":[{"t":"h3","h":"§ 22. ТАБЫШ ЖӨНДӨМӨСҮ"},{"t":"p","h":"Табыш жөндөмөсү кыймыл-аракет багытталган затты билдирип турат. Кимди? эмнени? деген суроолорго жооп берет."},{"t":"p","h":"Негизги мүчөсү: -ны (-ни, -ну, -нү, -ды, -ди, -ду, -дү) Мисалы: Гимнди, инини, кушту, Темирди, Берметти."},{"t":"p","h":"108-көнүгүү. Сүрөттөгү заттардын атын жазып, аны табыш жөндөмөсүнө жөндөгүлө."},{"t":"img","src":"data:image/webp;base64,UklGRuIoAABXRUJQVlA4INYoAABQCQGdASqAAi0BPrVSpEsnJSOlJ1NcgOAWiWVuSRYslX6Ug2R9yZuGj+aqOlulfukS6a+GlloIAXvw2ze5T/x3sNtDAqDvsrxw1NMz2pdpiWEc2KMQmgXxN9g98bl8ZkeyE32D4Sytd94535tX5ib7B8JZWwKX1Noc2r8xN9g98b7zqMcAxvGYnR7+4dximLpVZOG/QXeN4f/g4v4vVSxKj+iwhZjnTkuQFV0xTxfmRlbn2nacRUBOt/kTGLhG5CyzWgc+pNKyShhUJLZLevaArvhRfjUTY2piu8nyFPY+11Ia0bq71vajY5FkFMoZ7xuGw5lZIndiUGU8AXUQOD2QO+p9FZ+YhhlCGppMZimeKrwgKMRHrf28dr/rrSUJArTF2Z1nCYfPW0A1YRpYHo3Z+hp+JNhqkJF7KpupH+8tX0FL+iEl567zwrsvn6QGqVVG0+4vrM94cPATBHOH9hmnp1yCRsJoZ9PR3xDKv2U+fMuNkW7/DrerE9wLbOoVfvZPDKTHDsaOwrLu3OhpxZ+QJZYJRlNpyhbrIZE6vC7Y0yl4H9oC9LMrn88dGKhhCSQb8zdksBhIAE18bLJJ9mVMLelmjQFtUSLmPSxiNbk2u/bxiT8sq38QC8NQwHryVJBizGFXyUnKf2zP/ickJhJj/LHK6iiMBEBOgoBk+0LpVvILwfcRYqp06YCH5wgR+VRdaZFO1d5XPT52G/JD43SmIXqI6Zdg1+cbElsuaWdt2wRghl7DZPXJwzrAkR5rkS4ynCbIKyj/nhUL/MFpjsscchatdjTthmWwTIn156t2hO7NMkuJhWCIiZX3LvZlJ9UVbYrn7+nbSrb36IuewH/9MTxmjctQv8geI/wSNqfA8lWRQ6ZeZ1faaf53TKN/sJ+BZYD+x1NDNfwCyCb0FOFZ4WXwQqq сыз чыгып калганына капа болот."]},{"t":"p","h":"<span class=\"pg\" data-n=\"56\">56<\/span>Баласын сынап көргүсү келет. «Балам, узун жолду кыскарт», – дейт. Төлөмырза аттан түшө калып, жолду кетмендеп кирет. Жээренче чечен: «Кетмен менен кыскарта албайсың, балам». «Узун жолду кыскарт» деген өткөн-кеткенден кеп сал деген сөз. Кеп эрмек болот, адамга жолдун кандай өткөнү билинбей калат, узун жолду жүрүштүү ат менен кызык сөз кыскартат дейт."},{"t":"p","h":"2. Дагы бир топ узагандан кийин: «Балам, ат жалына казан ас» – дейт. Төлөмырза түшө калып, ат жалына казан аса коюп, өрттөп жиберет."},{"t":"v","l":[" ? Эгер Төлөмырзанын ордунда болсоңор эмне кылмаксыңар?","111-көнүгүү. Көчүрүп жазгыла. Көмүскөдөгү -ны мүчөсүнө көңүл бургула."]},{"t":"h3","h":"БУУДАЙЫК"},{"t":"v","l":["Көсөө куйрук, көк даңгыт,","Карышкыр алды, Буудайык.","Чагарак куйрук, чара жон,","Жолборс алды, Буудайык.","Арсаң-арсаң жүгүргөн,","Аюу алды, Буудайык.","Молдо Кылыч"]}],"sub":[{"title":"БУУДАЙЫК","b":6},{"title":"БУУДАЙЫК","b":13}],"pages":[55,56]},{"title":"§ 23. ЖАТЫШ ЖӨНДӨМӨСҮ","blocks":[{"t":"h3","h":"§ 23. ЖАТЫШ ЖӨНДӨМӨСҮ"},{"t":"v","l":["112-көнүгүү. Көп чекиттин ордуна тиешелүү мүчөлөрдү коюп","көчүргүлө.","Аяздын көркү муз... бар.","Алгырдын көркү куш... бар.","Тамактын көркү туз... бар.","Саамайдын көркү кыз... бар.","<span class=\"pg\" data-n=\"57\">57<\/span>Жамгырдын көркү туман...,","Бүркүттүн көркү кыраан...","Байкабай жүрсөң кокустан","Кор болосуң жаманга."]},{"t":"p","h":"Токтогул"},{"t":"p","h":"Жатыш жөндөмөсүндөгү зат атоочтор кыймыл-аракеттин каерде болгонун, кимде, эмнеде экендигин, ордун билдирет. Кимде? эмнеде? кайда? деген суроолорго жооп берет."},{"t":"p","h":"Мүчөлөрү: -да (-де, -до, -дө, -та, -те, -то, -тө)."},{"t":"p","h":"Мисалы: Нурсултан айылда эс алды. Алма – табакта. Ачкыч – Берметте."},{"t":"p","h":"113-көнүгүү. Суроо-жоопторду окуп көргүлө. Көп чекит коюлган жердеги мүчөлөрдү өзүңөр улагыла. Жаттап алгыла."},{"t":"h3","h":"АТАЛАРДЫН СӨЗҮНӨН"},{"t":"v","l":["Эмнеде көпүрө жок?","– Көл... көпүрө жок.","Эмнеде тирөөч жок?","– Асман... тирөөч жок.","Эмнеде каймак жок?","– Кара суу... каймак жок.","Эмнеде тамыр жок?","– Таш... тамыр жок.","Эмнеде жан жок?","– Дөнгөч... жан жок.","Эмнеде тил жок?","– Балык... тил жок.","Эмнеде сүт жок?","– Куш... сүт жок."]},{"t":"p","h":"114-көнүгүү. Окугула, жатыш жөндөмөсүндөгү сөздөрдү таап жазып, уңгу-мүчөгө ажыраткыла."},{"t":"h3","h":"ЖАЙЛООДО"},{"t":"p","h":"Таштан жайында жайлоодо болду. Атасы Абдылда Кара-Коюнда мал багат. Жайлоодо аба таза. Түрдүү чөптөрдүн жыты буруксуйт. Сайда көк каша суу."},{"t":"p","h":"<span class=\"pg\" data-n=\"58\">58<\/span>Сууда балык көп. Желеде байланган бээлер, сабада бал кымыз толуп турат."},{"t":"p","h":"Таштан бир жолу эртең менен бээ айдап келгени барды. Көргөн көзүнө ишенген жок. Үйүрдөн алыс эмес тектирде кийиктер оттоп жүрүптүр."},{"t":"p","h":"1. Силер жайлоодо болдуңар беле? Жайлоодон кандай жаныбарларды көрдүңөр эле? 2. Текст боюнча 2—3 суроо түзгүлө."},{"t":"img","src":"data:image/webp;base64,UklGRmYGAABXRUJQVlA4IFoGAABwLwCdASpqAXIAPrVYqE2nJSQjJPUqCOAWiWlu6fWEzXOw7jeu2zO/lvWn+uPjr8T1PBwW+f1/509ZsRWufmI7BTdg22mnnfWxqYCJAT2NSSTbsaRa3JbzGzxaNDGkrqlxvGI2BbFi2ODQ/OyraG1hlxxyZrlCpt5OtJ5SNdUCFXBFPWNcbiHU7UnOl6QIesys0IRAilCnacoAplwxcbEus3bwBGlYDFNnjlYPXkooAisSGjPi+udgxdsCJ34xW2HiWnDEj7ObN7lO8VxWz/A4Dl4R7OCUp4wJtXvIoBCudU5JSW6r4zABkq/0Rp3u5qtZkgFPthlCeM4c5oCbu/UXGEsSIL2t1AsR9VJuKspiQ5fZnaXFoh/kTeBDM/r4CwEhtbBh/VKaPNG/Sacr8tmH4hG+pMgnbtU5KceKpqaCvfdqwqgdmJ/n7rz6NtD2QdCLvrBG4foaCxszC7pDhyqU495UTQKN0E3d/BuHjvxd49fK6Y7MRICfbk2NWM3OpvO+tiMAAP79LDtKO3TQKEEFAvm8cC329jJqCEwoDGEuIwZgrI8TlSa9xW0XRh30n1E9y+KbJFIAfsCiAviy2JFc8d6a9dfuFqiZ81S0pLsojjHgD2LkCyMops7NFNwZp/IVICGg8eMLtyxQQTbXIIzL63riR6SaOQSl5Njee0skeP8Xi+yTKdHHSdwMORScKBQzKZutidxduwLDUO3x1ifotrx2Ev0J8KdaGzhpFWvRauk4dxtLrR8rptdFh8x1JWI7yimXuiC8P+qRteMrUak0O+BcS3Hy5E0dObDWgp3cdwF4Qga6zSRYp9PP6E/R8PnyIWWZKBhh3F+Fx+AZp67jLD/c81sRSoLXOWit3Z3KZec/yjJKGz2Ny4yaYuA/VaxqcbzmErwXxV5XXA6gOCYmGvlzlzzd9SLm+NF6G2kV2JDwTu ан ордун, нерсенин эмнеден жасалганын, кимден алгандыгын билдирет."},{"t":"p","h":"Суроолору: Кимден? Эмнеден? Каяктан?"},{"t":"p","h":"Негизги мүчөсү: -дан (-дон,-дөн,-тан,-тон,-тен, -төн)"},{"t":"v","l":["<span class=\"pg\" data-n=\"59\">59<\/span>117-көнүгүү. Төмөндөгү сөздөргө чыгыш жөндөмөсүнүн","мүчөсүн улап, сүйлөм түзгүлө.","","Акыл Карачач, боз чымчык, апам, бүркүт, торт,","дүкөн.","","118-көнүгүү. Ырларды көркөм окугула. Салыштыргыла.","Чыгыш жөндөмөсүндөгү зат атоочторду көрсөткүлө."]},{"t":"h3","h":"АККАН СУУ"},{"t":"v","l":["Жер бетине бүткөн кум,","Кумдан ойноп чыккан суу.","Жаркырап жердин койнунан","Жайнап чыккан аккан суу.","Булак болуп тоолордон","Кайнап чыккан аккан суу."]},{"t":"h3","h":"АККАН СУУ"},{"t":"v","l":["Ак кыянын боорунан","Агып чыккан аккан суу.","Зоодон сынбай бир жери","Кулап түшкөн аккан суу.","Аяк-башын үзүлтпөй","Улап түшкөн аккан суу.","Жеңижок","","119-көнүгүү. Окугула, сөздүн маанисин түшүнгүлө.","","Кулагыңа күмүш сырга!"]},{"t":"p","h":"Суу – өмүр, ал адамдын гана эмес жан-жаныбарлардын, өсүмдүктөрдүн каны. «Аккан сууну булгаба»,- деп айтышкан ата-бабаларыбыз. Булактардын көзүн ачып, суу жээгине ыплас нерселерди жолотпой, таза урунушкан. <span class=\"pg\" data-n=\"60\">60<\/span>Токтогул, Барпы, Жеңижок сыяктуу акындар суу жөнүндө көп ырдашкан."},{"t":"v","l":["Адамзат пендеси,","Аккан сууну булгаба!","Суу сыйлаган зор болоор,","Суу кордогон кор болоор.","Акыл менен ойлоп ал,","Айткан жокмун тим гана.","","Акын Жеңижоктун ырын жаттап ал."]},{"t":"p","h":"120-көнүгүү. Көп чекиттердин ордуна тиешелүү зат атоочторду коюп көчүргүлө. Суроо бергиле."},{"t":"p","h":"1.... ун алынат. ... нан, токоч, камыр жасалат."},{"t":"p","h":"2. Сүт ... саалат. .... айран, быштак, сүзмө даярдалат. Аларды даяр түрүндө ... сатып алабыз. 3. Жүн... кыркылат. 4. ... бут кийим жасалат. 5. Кымыз... жасалат."},{"t":"p","h":"Машыгуу сабагы."},{"t":"p","h":"121-көнүгүү. Текстти окугула. Кара менен басылган сөздөрдү уңгу-мүчөгө ажыраткыла."},{"t":"h3","h":"САРТ АКЕНИН НАСААТЫНАН"},{"t":"p","h":"– Көзүң жерип турса да, оюңа келгендей иш кылба. Билгендер менен кеңеш. Ар ишти ойлонуп башта, оңунан аякта."},{"t":"p","h":"Адамдын шагын сындырып, өзүңө душман кылба. Душман деген оор илдеттен да жаман. Душманды тилге келтирсең да, дилин тазартуу кыйын."},{"t":"p","h":"Б. Максутовдон"},{"t":"p","h":"122-көнүгүү. Окугула. Зат атоочторду тапкыла. Алардын кайсы жөндөмөдө экендигин ажыраткыла."},{"t":"h3","h":"<span class=\"pg\" data-n=\"61\">61<\/span>ТАБЫШМАК"},{"t":"p","h":"Табышмак – адамдагы тапкычтыкты, сезгичтикти, акылдын курчтугун сынаган элдик өнөр."},{"t":"p","h":"Элибизде табышмак айтышкан таймаштар болгон. Анда эки топко бөлүнүп алып, кезек менен табышмак катышкан. Утулуп калган тарапты уткандар «сатышкан»."},{"t":"p","h":"«Колуңду Коконго сатып, конок алдырам. Бутуңду Букарга сатып, буудай алдырам» – деп жеңилгендерди уяткарышкан. Кыздар, балдар намыс алдырбаш үчүн табышмакты көп билүүгө аракет кылышкан."},{"t":"p","h":" Өзүңөр да табышмак айтышып, мелдешкиле."},{"t":"p","h":"123-көнүгүү. Билген табышмактарыңардан эки-үчтү жазгыла. Андан зат атоочторду тапкыла. Астын сызып, жөндөмө мүчөсүн аныктагыла."},{"t":"p","h":"124-көнүгүү. Көчүрүп жазып, зат атоочторго суроо бергиле."},{"t":"p","h":"Окуу – түндө алдыңдагы шам чырак,"},{"t":"v","l":["Билим алсаң маңдай ачык жаркырап.","","Окуу, билим көп нерсеге жеткирет,","Бул экөөнөн урмат-сыйды көп көрөт.","","Сокур дешет билимсизди, жөн дебе,","Окуу гана жарык чачат дүйнөгө."]},{"t":"p","h":"Ж. Баласагын"},{"t":"p","h":"125-көнүгүү. Окугула, кара тамга менен басылгандарын көчүрүп жазгыла. Зат атоочтордун кайсы жөндөмөдө экендигин көрсөткүлө."},{"t":"h3","h":"<span class=\"pg\" data-n=\"62\">62<\/span>ТАШТАН ТАРАМЫШ, КУМДАН ӨТҮК ТИГҮҮГӨ БОЛОБУ?"},{"t":"p","h":"Жээренче чеченге Жаныбек хан жигитин жиберип: «Отуз күндүн ичинде таштан тарамыш кылып, кумдан өтүк тигип берсин», – деп буйрук кылды..."},{"t":"p","h":"? Жээренче чечен таштан тарамыш кылып, кумдан өтүктү кантип тикти? Жомокту «Кыргыз эл жомокторунан» таап, окуп келгиле."},{"t":"p","h":"Кайталоо сабагы."},{"t":"p","h":"126-көнүгүү. Текстти окугула. Зат атооч сөздөрдү жазгыла. Жөндөмөлөр боюнча талдагыла."},{"t":"h3","h":"КУРКУЛДАЙДЫН УЯСЫ"},{"t":"p","h":"Шар суунун боюнда, талдын бутагына илинген кичинекей «баштыкчаны» көрдүң беле? «Баштыкча» сууга тиер-тиймексен болуп салаңдап турат. Ага жетишиң да кыйын. Бул – куркулдайдын уясы."},{"t":"p","h":"Куркулдай уясын кыл-кыбырды тыбыт, жүнгө аралаштырып, тумшугу менен токуйт. Капталынан ооз чыгарып коёт."},{"t":"p","h":"Уя жасоо жагынан куркулдайга бир да канаттуу тең келе албайт."},{"t":"p","h":"Сөздүк:"},{"t":"p","h":"Куркулдайдын уясындай – жылуу, жумшак, ыңгайлуу деген мааниде."},{"t":"p","h":"127-көнүгүү. Чекиттердин ордуна тиешелүү зат атоочторду койгула."},{"t":"p","h":"<span class=\"pg\" data-n=\"63\">63<\/span>Карганын Суурдун"},{"t":"p","h":"128-көнүгүү. Көп чекиттин ордуна жөндөмө мүчөлөрүн коюп, окугула."},{"t":"h3","h":"САРЫ ТАЗ"},{"t":"p","h":"Илгери Кыйрап деген ууру болуптур. Ал жашынан малдуу... мал койбой уурдап жүрүп, Кыраан ууру аталып кетиптир."},{"t":"p","h":"Баласы Сары таз да чуулуу чыгат. Бир күнү Кыраан: «Карып баратам. Балам, өнөрүм... алып калчудайбы» – деп Сары таз... сынайт. «Мен терек... башына чыгып, басып жаткан сагызган... жумуртка... уурдап келем. Сен карап тур», – дейт."},{"t":"p","h":"Атасы терек... чыгып, сагызган... жумурткасын уурдап келет. «Көрдүңбү балам, өнөр... күчүн», – дейт мактанып. Анда Сары таз: «Кокуй, ата шымың кана!» – деп чочуйт. Баласына ыраазы болгон ууру: «Анык өзүмдү тартыпсың» – деп бата... берет."},{"t":"p","h":"Кыргыз эл жомокторунан"},{"t":"p","h":"? 1. Ууру: «Көрдүңбү, балам, өнөрдүн күчүн», – дейт. Эмне, уурулук өнөрбү? 2. «Жигитке жетимиш өнөр аздык кылат»- дейт макалда. Анда жетимиш өнөрдүн бири уурулукпу?"},{"t":"p","h":"129-көнүгүү. Көчүрүп жазгыла. Атооч жөндөмөдөгү заттардын астын сызгыла. Макалдардын маанисин чечмелеп бергиле."},{"t":"p","h":"Аталардын сөзү"},{"t":"p","h":"1. Мээнетиң катуу болсо, тапканың таттуу болот."},{"t":"p","h":"2. Уурунун жолу кууш."},{"t":"v","l":["3. Адал эмгек абийир таптырат,","Арам эмгек азабын тарттырат."]}],"sub":[{"title":"АККАН СУУ","b":10},{"title":"АККАН СУУ","b":12},{"title":"САРТ АКЕНИН НАСААТЫНАН","b":21},{"title":"ТАБЫШМАК","b":26},{"title":"ТАШТАН ТАРАМЫШ, КУМДАН ӨТҮК ТИГҮҮГӨ БОЛОБУ?","b":37},{"title":"КУРКУЛДАЙДЫН УЯСЫ","b":42},{"title":"САРЫ ТАЗ","b":51}],"pages":[59,63]},{"title":"§ 25. СЫН АТООЧ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"64\">64<\/span>§ 25. СЫН АТООЧ"},{"t":"p","h":"130-көнүгүү. Табышмактарды окугула. Жандырмагын кайсы сөздөрдүн жардамы менен табууга болот? Ал сөздөрдү көчүрүп жазып, суроо бергиле."},{"t":"v","l":["1. Сырты бирөө-тоголок,","Ичинде миң сан томолок.","2. Капкара курсагы бар,","Керең кулагы бар.","3. Суюк, бирок суу эмес,","Ак, бирок кар эмес.","4. Жыл мезгилин ылгабайт,","Жайы-кышы жапжашыл.","5. Өзү кардай аппак,","Жесең таттуу тамак."]},{"t":"p","h":"? Жандырмагын таптыңарбы? Таппасаңар кийинки көнүгүүдөн издегиле."},{"t":"v","l":["","131-көнүгүү. Төмөндөгү заттарды сүрөттөп жазгыла.","Анар, казан, сүт, арча, кумшекер.","Үлгү: Анар – тоголок, кызыл, ширелүү. Ширеси таттуу.","","Эсиңерге туткула!"]},{"t":"p","h":"Сын атооч заттын сын-сыпатын, өңү-түсүн, даамын, көлөмүн көрсөтөт, кандай? кайсы? деген суроолорго жооп берет"},{"t":"v","l":["Мисалы: кызыл, ак, кыйгыл, супсак, ийри, майда,","кууш, картаң."]},{"t":"p","h":"132-көнүгүү. Көп чекиттин ордуна көрсөтүлгөн сын атоочтордун мааниси туура келгенин таап койгула, <span class=\"pg\" data-n=\"65\">65<\/span>1. ... кар түштү. 2.Таятамдын... китептери бар."},{"t":"p","h":"3. Чоң атам... киши. 4. Апам... шырдактарды жасады. 5. Бөбөгүмдүн тили...."},{"t":"p","h":"(Таттуу, сонун, аппак, ак көңүл, кызыктуу) 133-көнүгүү. Көчүрүп жазгыла, сын атоочтордун астын сызгыла."},{"t":"p","h":"Пил – абдан зор жаныбар. Узун тумшуктары менен жоон устундарды көтөрүп ташыйт."},{"t":"p","h":"Пил өзү чоң болгону менен чычкандан коркот. Эмне үчүн? Кипкичинекей чычканды ошончо күчтүү деп ойлойсуңбу?"},{"t":"p","h":"134-көнүгүү. Заттардын даамын, көлөмүн, өңү-түсүн сыпаттап, үлгү боюнча жазгыла."},{"t":"v","l":["Карагат, кымыз, боорсок, бөбөгүм, алма.","Үлгү:"]},{"t":"raw","h":"<h4 class=\"mk\">Ким? Эмне? Кандай?<\/h4>"},{"t":"v","l":["тоголок","таттуу","кычкыл","ак","","Билип алалы!"]},{"t":"h3","h":"УЛУУ АДАМДАР СИЛЕРДЕЙ КЕЗИНДЕ КАНДАЙ БОЛГОН?"},{"t":"p","h":"В. Гёте"},{"t":"p","h":"Улуу акын кичинесинде дарактардын жалбырактарын чогултканды жакшы көрчү экен. Ошондуктан Гётенин бөлмөсү, айрыкча күз айларында, жалбырактарга толуп кетүүчү. Жалбырактар керебеттен тартып жаздыгынын астында, андан кийим салган сандыгынын ичине чейин бапырап жатчу."},{"t":"p","h":"<span class=\"pg\" data-n=\"66\">66<\/span>Таң калычтуусу, бирөө жалбырактарды талаага чачып жиберген жеринен да жазбай таанып, кайра чогултуп алчу экен."}],"sub":[{"title":"УЛУУ АДАМДАР СИЛЕРДЕЙ КЕЗИНДЕ КАНДАЙ БОЛГОН?","b":16}],"pages":[64,66]},{"title":"§ 26. ЗАТТЫН ӨҢҮН-ТҮСҮН БИЛДИРГЕН СЫН АТООЧТОР","blocks":[{"t":"h3","h":"§ 26. ЗАТТЫН ӨҢҮН-ТҮСҮН БИЛДИРГЕН СЫН АТООЧТОР"},{"t":"p","h":"135-көнүгүү. Сүрөттөрдөгү заттардын өңүн-түсүн атап жазгыла. Табышмактарды жандыргыла."},{"t":"img","src":"data:image/webp;base64,UklGRgIPAABXRUJQVlA4IPYOAAAQcgCdASrLAEgBPrVMn0onJCorsJVaqXAWiWNuMUAZhfAvWkeIwkS16pCQJZFD1ZLNa/XM9iUKiToYgwt+jAs/Q2R5HORhj/Wk8ylYHqT6N11v//byQBize0t7+PvNJx40XkEiWmYQCedZYeCJZ+rKbWJLi4ylCW3Nfi5bVx4TkzXtghhMrG9nCZa8U9CAJkmPBqz77BynfEBNpHYmENw7ZVXrjIQceuC9U8kHNanCFaTQXOuSud9hRdhofDZ6kkRYF9911IgtEUY6XVE3taIu/EEhTnKUZlNsDjR1QONNCV/reG87xWSIfOG1DLUQShm7uYBeWeb+fIPhTgQDyi+imfp3/MWn1I06wnTSYVVuSF4iDpDaBpoKTjHVacNRiDWSAtIl+NlGVdOQKad4PKZxY+QZtRTY/1Y9xtGfQ1XQ/pZr0ei1ASGer0MUVsBcOH8ky8BIbdg+63BkGev/g7hjnKhxdeXgmZ5ublFHPbhWoVBdgOtq4anjRorYC92OoHoD00lT/t/lXezj6DSINM9dyH7L4UgtzqkKEfMMl3nHqBh9pCgw/xTXjNOG3K/IlLzGry65bpijGicAgtwBK77Xq/5lW0LiY7ZlLu2X8YmaPW+Gv0F5PN7oQe16QPsyMRYuzBuROXq8XErfqsvHzMcUWzSyUJ7QkJ71FiVgAQn76aKVti ":"p","h":"Жайында ысыкты дегдейт,"},{"t":"v","l":["Кышында суукту сезбейт.","Кийгени ... жибек,","Жылы бою чечпейт.","... сакал киши бар,","Санап бүткүс тиши бар."]},{"t":"p","h":"<span class=\"pg\" data-n=\"67\">67<\/span>136-көнүгүү. Маекти ролдоштуруп окугула. Түстөргө мүнөздөмө бергиле."},{"t":"h3","h":"ТҮСТӨРДҮН МАЕГИ"},{"t":"p","h":"Ак: Мен акмын. Дүйнөдө эң биринчи мен жаралгам. Ак жол, ак мөңгү, ак булут, ак кебез... Ушулардын баары менин атымды алып жүрөт."},{"t":"p","h":"Актыгыма ыраазы болгон адамзат кээде аппак, апакай деп да айтат."},{"t":"p","h":"Бардык жакшылыкты мени менен аташат. Ак тилек, ак ниет, ак дасторкон, ак нан, ак көңүл..."},{"t":"p","h":"Кара: Мени көбүнчө ак менен карама-каршы мааниде салыштырышат. Кара кой, кара торпок, кара эчкинин эмнеси жаман?"},{"t":"p","h":"Акты деле кара менен кыюулап жатпайбы. Кара көз, кара каш, кара чач кыздардын ак жүзүнө жарашык берип турат. Алды калың кара жер деп менин күчтүүлүгүмдү даңазалашат."},{"t":"p","h":"Адамдардагы пейил оңолсо, кара ниет деген сөз жоголот эле."},{"t":"p","h":"Жашыл: Мен жаратылыштын өңүмүн. Чөп, арча, жалбырак... баары мага окшош."},{"t":"p","h":"Көк: Чөптүн өңү сага окшош болсо деле, менин атым менен аташат. Жашыл чөп деп айтканды уктуң беле? Көк чөп, көк шибер дешет да!"},{"t":"p","h":"Көлдүн көйнөгү да меникиндей. Көк көл, көк асман, көк муз... – баары менмин."},{"t":"p","h":"Сары: Менин түсүм күндө бар. Алтын да мага окшош. "},{"t":"p","h":"Ч. Исакова"},{"t":"p","h":"? Кызыл түстүн сөзүн өзүңөр түзүүгө аракеттенгиле."},{"t":"p","h":"137-көнүгүү. Өң-түстү билдирген сөздөрдөн 10 мисал жазгыла, <span class=\"pg\" data-n=\"68\">68<\/span>138-көнүгүү. Заттардын түсүн кошуп, сөз айкаштарын жазгыла."},{"t":"p","h":"... жалбырак, ... көйнөк, ... пальто, ... калпак, ... жоолук, ... өтүк, ... шибер,... кийиз, ... жип, ... көз, ... тебетей, ... дасторкон, ... жууркан, ... туш кийиз, ... сандык, ... куржун, ... музоо, ... улак, ... козу, ... ат. 139-көнүгүү. 1. Ырды көчүрүп жазып, жаттагыла."},{"t":"v","l":["Баладай ыйлап жатты булут улуп,","Басылды улутунуп, улутунуп.","Соңунан кызыл, жашыл желе түштү.","Бир калган буюм сындуу унутулуп."]},{"t":"p","h":"С. Эралиев"},{"t":"p","h":"2. Булут, асман, батып бараткан күндү элестетип сүрөт тарткыла. Сын атоочторду атап, сүйлөм түзгүлө."}],"sub":[{"title":"ТҮСТӨРДҮН МАЕГИ","b":12}],"pages":[67,68]},{"title":"§ 27. ЗАТТЫН ФОРМАСЫН, КӨЛӨМҮН, ДААМЫН БИЛДИРГЕН СЫН АТООЧТОР","blocks":[{"t":"h3","h":"§ 27. ЗАТТЫН ФОРМАСЫН, КӨЛӨМҮН, ДААМЫН БИЛДИРГЕН СЫН АТООЧТОР"},{"t":"p","h":"140-көнүгүү. Форма жана көлөмдү билдирген сын атоочторду өзүнчө, даамды билдиргендерди өзүнчө бөлүп жазгыла."},{"t":"p","h":"Жумуру, ачуу, кычкыл, терең, кеңири, узун, ширин, таттуу, тегерек, туздуу, ачкыл."},{"t":"p","h":"141-көнүгүү. Сүрөттөгүлөрдү сыпаттап, формасын, даамын атап айткыла."},{"t":"img","src":"data:image/webp;base64,UklGRpQPAABXRUJQVlA4IIgPAACQiwCdASpXAUwBPrVUoUsnJScqLpQ4+UAWiWluzoAsQfwcaTA7/6r/XirtUUHlTrgW9iGXcsVNAB1mNmJqlUfRr7N+tq8XMKIk+RR6qAV97CVjuqlyQSZD5je4Rl+W8Tb1cdY5VFs5mxmOdun5TB2ITLJ8pVBjIOKaMBLWOhi0Hqlh4m6EsbtpyvMSJ2wTpAVSYPB6nMfgE6TV9POIxybQc0JlCbJWCxXxMxGQbsomclSzxZSGTxwXvlgubNrjNU6hrsTDhJy7tQ2ftjHX6drkC4N/IEJU1ydqpsEnAGDy/eJA8zfBZXapRXBDCowi8415dKC3wXVb9p51RHcEU0CIq4dr3CMnonUJ+2EDWf4ZPJA6UyHvuBzPCg31Fg6CawExRKdJYHEQ9cHa3pQHS3tS8elEQARxkyCXy7pbA0I776slIOjdOmu6eP0GKyDlBwtoGQAJo161VfjWbeoAPLcOe2gC0H9l+iVtn0UTHBgI3Q5uFqOmDIu8YP10wlBGcf5Bv4zhYMR+nLl5u4jOoVxomuR22oWafprixw6lOMiwm56qH4Rye83MkC/vhx9ZpzWFg7NSNmDfyfHSwfwE8SWwMYWWbh/jETaTaY14EItwM31g+m+XaXTWuzYLmmes49l3qXAJe68jyYwq41aTpCpQLRvns3DF5b8AN6NttRyUGr58wqrY/cbgpFqbuvW7kOq2F+5zNDGJQpPnCALhQFIuo4k8sQ9Zt+VIEz6pvyuKKCbu7Uzte29wmv6X/Ugtr1zKjh4twXuvfYaoG9mry+jrl0eagwFW8NKsO1GIJyAHKGlVGxgAd0vb2gnbW1QfSuiwxtBWusrsMHC3XuGyODI/OQCpeAmXBwPWIB3HkfBKmoMaZWMFFjSujllnJbQb2JM+MCYpQM5p2TB0hWHTDdIxPsto3ahVj6iHgVIAVzGI2lNDPy59mYdGK4wIGs9VpHZN/2ALsEbXbxOYcCXPNiNGEDBWeKthOE48tX8s9REPCc/cX8dxWASd2AXTH/PqrGHMXeTeSvGvMP6dgroZlx9lWTzv+9FfQwecGdaM5DVDryF3o4f7nfNrEvg9RdPODyg1eyCqP0F10S3i3 fSF1ZeaHclTBPtB1dIDAAA","w":243,"ht":278},{"t":"p","h":"153-көнүгүү. Жомоктун үзүндүлөрүн окугула. Сын атооч катышкан сүйлөмдөрдү бөлүп көчүргүлө."},{"t":"p","h":"1. Чыпалак деген бала чыпалактай эле болгон экен. Балдыркандын жалбырагына көлөкөлөп уктап калса, ошол жерде оттоп жүргөн төө жалбырак менен кошо аймап коюптур. «Төө жутканын билбейт, кепшегенин билет» деген ошондон улам айтылып калган го."},{"t":"p","h":"2. Анда ичинен Чыпалак шыбырайт: Ташматка бар, койлору семиз! Байматка бар, иттери дүлөй. Эрматка бар, койчулары уйкучу."},{"t":"p","h":"Ч. Айтматов"},{"t":"p","h":"154-көнүгүү. Сын атоочтордун карама-каршы маанилерин таап жазгыла."},{"t":"v","l":["Семиз —...","Уйкучу","Чоркок -...","Шалаакы – ....","Мээнеткеч -....","Мерез —...","Элпек —...","Кара ниет","Берешен – ...","Кууш -...","Үлгү: Шайыр – тунт. Момун – долу."]},{"t":"p","h":"<span class=\"pg\" data-n=\"73\">73<\/span>155-көнүгүү. Төмөндөгү сөздөрдү катыштырып, сүйлөмдөрдү түзгүлө."},{"t":"v","l":["Сулуу, кооз, нысаптуу, коркунучтуу.","","Машыгуу сабагы,","","Эсиңерге туткула!"]},{"t":"p","h":"Сын атоочтор зат атоочтор менен айкалышып айтылып, сөз тизмектерин түзүшөт."},{"t":"p","h":"Мисалы: аппак кар (кандай кар?), жылуу тон (кандай тон?)"},{"t":"p","h":"156-көнүгүү. Сын атоочторду зат атооч сөздөрү менен чогуу көчүргүлө. Суроо бергиле."},{"t":"p","h":"1. Узун жолду кыскарт. 2. Кызык кеп кулактын черин жазат. 3. Чытырман токойдо эмнелер гана жок."},{"t":"p","h":"4. Чынар аппак кайыңдын көлөкөсүндө ойноп отурду."},{"t":"p","h":"5. Темир сандыкка тепкедей ачкыч керек. 6. Томуктай ишти тоодой сөз кылуу жарабайт."},{"t":"p","h":"Үлгү: Тепкедей ачкыч (кандай ачкыч?)"},{"t":"p","h":"157-көнүгүү. Зат атоочторго сын атооч сөздөрдү маанисине ылайык айкаштырып, сөз айкаштарын түзгүлө."},{"t":"p","h":"...мөңгү, ... муз, ... тоок, ... ит, ... көл, ... кыз, ... окуучу, ... бай, ... суу, ... жигит, ... жалбырак, ... алма, ... коон, ... сагызган, ... түлкү, ... фильм, ... окуя."},{"t":"p","h":"Үлгү: Ак мөңгү."}, ун мыктысы, кырааны."},{"t":"p","h":"187-көнүгүү. Көрсөтүлгөн сөздөрдү жөндөмөлөр боюнча жөнөдөгүлө."},{"t":"p","h":"Бермет, ак чардак, аркар."},{"t":"v","l":["<span class=\"pg\" data-n=\"84\">84<\/span>Кайталоо сабагы","","188-көнүгүү. Суроолорго жооп бергиле.","1. Сын атооч деп кандай сөз түркүмүн айтабыз?"]},{"t":"p","h":"2. Сын атооч сөздөр кандай суроолорго жооп берет?"},{"t":"p","h":"3. Сын атоочко көптүк сандын -лар мүчөсү уланабы?"},{"t":"p","h":"4. Жөндөмө мүчөлөр жалганабы?"},{"t":"p","h":"5. Сын атооч кайсы сөз түркүмү менен байланышып сөз айкашын түзөт?"},{"t":"p","h":"189-көнүгүү. Сын атоочторду тууралап көчүргүлө."},{"t":"p","h":"Азим тартип... бала. Кар көп жааса, түшүм береке... болот. Ынтымак... үйдө тынч жашоо болбойт. Бала... үй базар. Таажы... турналар Африкада гана жашайт. Байкемдин куйрук... койлору көп."},{"t":"p","h":"190-көнүгүү. Сын атооч сөздөрдү түрдүү даражалары бо-юнча өзгөртүп жазгыла."},{"t":"v","l":["Коюу – ... – ..., Коркок – ... – ...","Суюк – ... – ..., Ачык – ... – ...","Боз – ... – ..., Тентек – ... – ..."]},{"t":"p","h":"191-көнүгүү. Окугула. Текст боюнча суроо түзгүлө, Сын атоочторду тапкыла."},{"t":"h3","h":"АФРИКА"},{"t":"p","h":"Калың тропик токою дүпүйөт. Ал аркылуу балта менен жол салып өтүүгө гана болот. Дарак, бадал, лианалар аралаш өсүп, чытырманга айланган. Өсүмдүктөрдүн <span class=\"pg\" data-n=\"85\">85<\/span>жалбырагы калың жана ширелүү. Жыпар-жыттуу гүлдөр көп. Гүлгө окшош кооз канаттуулар, чоңдугу чымчыктай көпөлөктөр бапырайт. Мында айлана күңүрт тартып, аба нымдуу. Саратандардын сайраганы бийик чыккан хордой болуп, айлананы жаңыртат. Жырткыч айбандардын күрүлдөгөнү, айкырганы, маймылдардын чырылдаганы угулуп турат. Айлана жыл бою көпкөк."},{"t":"p","h":"192-көнүгүү. Окугула. Суроолорго оозеки, жазуу жүзүндө жооп бергиле. Текстке ат койгула."},{"t":"p","h":"Хамелеон жыгачтардын арасында жашоого ыңгайлашкан. Мойну кыска, куйругу, буттары узун. Ал жабышкак, узун тили менен курт-кумурскаларды кармап жейт."},{"t": нчы? канчоо?","бир биринчи бирөө","","Эсиңерге туткула!"]},{"t":"p","h":"Заттын санын, катар-иретин билдирген сөз түркүмү сан атооч деп аталат. Сан атоочторго канча? нече? канчанчы? неченчи? деген суроолор берилет."},{"t":"p","h":"Мисалы: беш, он, жүз, миң (канча? нече?), бешинчи, онунчу, жүзүнчү, миңинчи (канчанчы? неченчи?), бешөө, алтоо (канчоо?) 194-көнүгүү. Сан атоочторду катыштырып, «Биздин үй» деген темада чакан дилбаян жазып келгиле."}],"pages":[88,88]},{"title":"§ 32. ЭСЕПТИК САН АТООЧТОР","blocks":[{"t":"h3","h":"§ 32. ЭСЕПТИК САН АТООЧТОР"},{"t":"p","h":"195-көнүгүү. Текстти окуп, суроолорго жооп бергиле."},{"t":"h3","h":"КОЖОМКУЛ БАЛБАН"},{"t":"p","h":"Кыргыздын белгилүү балбаны Каба уулу Кожомкул 1888-жылы 1-мартта туулган. Ал толуп турган 47 жашында бою 2 м 36 см, салмагы 165 кг болгон экен. Бутуна 52-размерлүү өтүктү атайын тиктирип кийчү. Мине турган атын да жылкылардан тандап минчү экен. Ал балбандыгы өзгөчө адам болгон. Төө менен атты кадимкидей эле көтөрүп кетчү."},{"t":"p","h":"Ал эми Арамза деген жайлоодо Кожомкулдун көтөргөн ташы бүгүнкү күнгө чейин белгилүү. Ташты кийин өлчөшкөндө, оордугу 635 кг, түп жагынын жоондугу 1 м 89 см, ортосунун узундугу 1 м 70 см, бийиктиги 1 м 60 см болуптур."},{"t":"p","h":"Ш. Эсенкуловдон"},{"t":"p","h":"<span class=\"pg\" data-n=\"89\">89<\/span>1. Кожомкул балбан кандай адам болгон экен? Анын балбандыгын эмне менен түшүндүрөсүңөр?"},{"t":"p","h":"2. Тексттен сан атооч сөздөрдү тапкыла. Алар заттын санын көрсөттүбү же иретин билдирдиби? Түшүндүрүп, сөз менен жазып көрсөткүлө."},{"t":"p","h":"196-көнүгүү. Сан атооч сөздөрүн катыштырып, өз алдыңарча оозеки бир нече сүйлөмдү мелдешип түзгүлө."},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Сан атооч сөздөр түзүлүшүнө карай экиге бөлүнөт."},{"t":"p","h":"1. Бир сөздөн түзүлгөн жөнөкөй сандар: бир, беш, он, жүз, миллион."},{"t":"p","h":"2. Эки же андан ашык сөздөрдөн түзүлгөн татаал сандар: он бир, жүз жыйырма беш, бир миң тогуз жүз токсон беш, эки миң биринчи."},{"t":"p","h":"197-көнүгүү. Сүйлөмдөрдү окугула. Андагы сан атоочтордун жөнөкөй, татаал экендиктерине карап, бөлүп түшүндүргүлө."},{"t":"p","h":"1. Биздин класста жыйырма сегиз окуучу окуйт."},{"t":"p","h":"2. Жазгы каникул жыйырма төртүнчү марттан биринчи апрелге чейин созулат. 3. Менин апам быйыл кырк жашка, а чоң апам алтымыш төрт жашка толду. 4. Биздин айылда эки жүз алтымыш түтүн эл жашайт."},{"t":"p","h":"198-көнүгүү. Төмөнкүлөрдү окуп, түшүнгүлө. Анан тапшырмаларды аткаргыла."},{"t":"p","h":"3 санына байланыштуу: үч жолу сыноо, үч үйлөп ичүү, үч кадам таштоо, үч жолу эскертүү берүү."},{"t":"p","h":"7 санына байланыштуу: жети күн, жети ата, жети түс. 40 санына байланыштуу: кырк кыз, кырк жигит, кырк чоро, сакалы кырк кулач абышка."},{"t":"p","h":"Тапшырма: Ушул сан атооч сөздөрдү кайталап, бир нече сүйлөм көрсөткүлө."},{"t":"p","h":"199-көнүгүү. Сан атоочторду жалпы кайталап келгиле."},{"t":"p","h":"<span class=\"pg\" data-n=\"90\">90<\/span>Бышыктоо сабагы"},{"t":"p","h":"200-көнүгүү. Табышмак-ырларды окуп, жандырмагын мелдешип тапкыла. Андагы сан атоочторго мүнөздөмө бергиле."},{"t":"v","l":["1. Тоголок келген бою бар,","Тогуз катар тону бар. Ал эмне?","2. Бир короодо он эки бала бар,","Алардын экөө иштейт.","Калгандары карап турат. Ал эмне?","3. Бир чоң терек бар.","Анын он эки бутагы бар,","Ар бир бутагында отуздан жалбырагы бар.","Ал эмне?","","? Ушундай сан атоочтор катышкан табышмактардан өзүңөр","да таап айткыла."]},{"t":"p","h":"201-көнүгүү. Суроолорго жооп таап, көп чекиттердин ордуна тиешелүү сан атоочторду коюп көчүргүлө. Суроо берип, кандай сан атооч экендигин түшүндүргүлө. Ким туура жоопторду тапса, аны «Тапкычбек» деп атагыла."},{"t":"h3","h":"ТАПКЫЧБЕККЕ СУРООЛОР"},{"t":"v","l":["Бир кылымда ... жыл бар.","Бир жылда ... жума,... күн бар.","Бир жумада ... күн бар.","Бир суткада ... саат бар.","Бир күндө саат... бар","Бир минутаны... секунд түзөт.","Бир км де... метр, метрде... сантиметр бар.","Бир кг да ... грамм бар."]},{"t":"p","h":"<span class=\"pg\" data-n=\"91\">91<\/span>202-көнүгүү. Сан атоочтор катышкан макал-лакаптарды ойлонуп толуктап окугула, мазмунун түшүндүрүп бергиле да, үйрөнүп алгыла."},{"t":"h3","h":"АТАЛАРДЫН СӨЗҮНӨН"},{"t":"v","l":["Билеги күчтүү ... жыгат,","Билими күчтүү ... жыгат.","",". кол тең эмес....","өлчөп,... кес.","","Кыздын...чачы улуу.","Жигитке... өнөр аздык кылат.","","...сомун болгончо,... досуң болгону жакшы.","","Жаман деген... ат бар, жууса кеткис,","Жакшы деген... ат бар, кууса кеткис.","","Жакшы атка ... камчы,","Жаман атка ... камчы."]},{"t":"p","h":"203-көнүгүү. Дүйнөдөгү кызыктарды окугула да, үйрөнүп алгыла. Анан андагы сан атооч сөздөрдү зат атоочтору менен бирдикте сөз менен көчүрүп жазгыла."},{"t":"h3","h":"ДҮЙНӨДӨГҮ КЫЗЫКТАРДАН"},{"t":"p","h":"Силер китти билесиңер го, сууда жашайт эмеспи. Ал дагы сүт эмүүчүлөргө кирет. Кит – эң чоң жаныбар. Анын салмагы 190 тонна, ургаачысынын узундугу 33 метр. Жаңы туулган баласы 7-8 метр, салмагы 3 тоннага жетет."},{"t":"p","h":"Ал эми жерде жашаган сүт эмүүчүлөрдүн эң алпы – пил. Салмагы 5-6 тонна. Айрым эң зору 12 тоннага жетет."}],"sub":[{"title":"КОЖОМКУЛ БАЛБАН","b":2},{"title":"ТАПКЫЧБЕККЕ СУРООЛОР","b":25},{"title":"АТАЛАРДЫН СӨЗҮНӨН","b":28},{"title":"ДҮЙНӨДӨГҮ КЫЗЫКТАРДАН","b":31}],"pages":[89,91]},{"title":"§ 33. ИРЕТТИК САН АТООЧТОР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"92\">92<\/span>§ 33. ИРЕТТИК САН АТООЧТОР"},{"t":"p","h":"204-көнүгүү. Таблицаны карап, сан атооч сөздөрдүн маанисин салыштырып айткыла. Сөзүңөрдү мисал менен далилдегиле."},{"t":"v","l":["Заттын эсебин","билдирген сөздөр ","Заттын иретин","билдирген сөздөр"]},{"t":"raw","h":"<h4 class=\"mk\"> бир катар он беш күн 2001 жыл 72 үй<\/h4>"},{"t":"v","l":["1-катар (биринчи катар)","15-күн (он бешинчи күн)","2001-жыл (эки миң биринчи жыл)","72-үй (жетимиш экинчи үй)","","Эсиңерге туткула!"]},{"t":"p","h":"Катар-иретти билдирген сөздөр иреттик сан атооч деп аталат. Иреттик сан атоочторго канчанчы? неченчи? деген суроолор берилет."},{"t":"p","h":"Мисалы: 1. Заттын катар-иретин билдирген сөздөр: 20-үй; 5-кабат; 10-киши."},{"t":"p","h":"2. Жылдын, күндүн, кылымдын катарын билдирген сөздөр: 2009-жыл, 1-сентябрь."},{"t":"p","h":"Жазууда сан атоочтон кийин (-)-коюлат."},{"t":"p","h":"205-көнүгүү. Текстти окугула. Иреттик сан жана эсептик сан атооч сөздөр кандай жазыларын байкагыла. Текстте эмне жөнүндө айтылды, билип алгыла."},{"t":"h3","h":"ЖАҢЫ ОКУУ ЖЫЛЫ КАЕРДЕ, КАЧАН БАШТАЛАТ?"},{"t":"p","h":"Биздин өлкөдө жаңы окуу жылы 1-сентябрда башталарын билесиңер. Башка өлкөлөрдөчү? Эмесе, ошол жөнүндө билип алалы."},{"t":"p","h":"Голландия, Норвегия жана Швеция деген өлкөдө жаңы окуу жылы 1-августта, Индияда 1-апрелде башталат. <span class=\"pg\" data-n=\"93\">93<\/span>Австралияда 1-январда, Никарагуада 1-октябрда каникулга чыгышат."},{"t":"p","h":"Дүйнөдө 172 өлкө 1-сентябрда, 16 өлкө март айында, 10 өлкө августта окууга киришет. Японияда чоң каникул 1 айга гана созулат. Алжир, Египет деген өлкөлөрдө балдар 4 ай эс алышат."},{"t":"p","h":"Гибралтар деген өлкөдө балдар 4 жашынан мектепке келишет. Айрым өлкөлөрдө балдар 5 жашынан окууга киришет."},{"t":"p","h":"Кызык бекен?"},{"t":"p","h":"206-көнүгүү. Ырды окугула да, жаттап алгыла. Андагы сан атоочторго мүнөздөмө бергиле."},{"t":"h3","h":"22 ПАРТА"},{"t":"v","l":["Келсең биздин класска,","Жыйырма эки парта бар.","Канча бала окуйт? – деп,","Кызыкпады канчалар.","Мен айтамын болжолун,","Өзүң жакшы көңүл бөл.","Канча бала окуурун,","Калем ал да санап көр.","","Ар партада экиден,","Жайгашканбыз капкачан.","Так эсебин бул жерден,","Уят болот таппасаң.","Отурганда бардыгы,","Бош калат үч партабыз.","Шашпай ойлоп эми сен,","Эсептечи, канчабыз?","А. Кыдыров"]},{"t":"p","h":"Бышыктоо сабагы"},{"t":"p","h":"207-көнүгүү. Текстти көрктүү окугула. Сан атооч сөздөрдү тапкыла. Аларды сан атоочтордун кандай түрүнө кошосуңар?"},{"t":"h3","h":"ЖӨРГӨМҮШ ЖАНА АНЫН БАЛДАРЫ"},{"t":"p","h":"Жөргөмүштүн тарантула деген түрү бар. Ал тууганда жүздөн ашык майда балдарын бир эле тууйт экен. Анан балдары чоңойгондо жонуна үймөлөктөтүп көтөрүп <span class=\"pg\" data-n=\"94\">94<\/span>жүрө берет. Чоңойгончо аларды көтөргөн боюнча чарчаганына карабай алыс жолго чыгат."},{"t":"p","h":"Жолдо суу кезиксе суусун кандырат. Ылайыктуу жер тапкан соң, арткы буттары менен жонундагы балдарын чачып ыргытып жүгүрө берет. Ошентип 100—150 метрдей аралыкка балдарын таратат. Жүгүнөн арылганда, силкинип боюн тазалайт. Балдарын өз алдынча жашоо жолуна салганына эне катары санаасы тынат. Анан гана салкын жер таап, шашылбастан эс алуу үчүн узак уйкуга кирет."},{"t":"p","h":"208-көнүгүү. Таблицаны карагыла. Сан атоочтордун бөлүнүштөрүн байкап, эсиңерге сактап алгыла. Ар бир түрүнө бирден сүйлөм түзүп, дептериңерге жазып көрсөткүлө."},{"t":"img","src":"data:image/webp;base64,UklGRuAIAABXRUJQVlA4INQIAAAQNgCdASp5ACQBPrVWpUwnJSOlKbMqWOAWiWkRVP8ADR8NOSSWc/4zwx8s/zCXe39akfbH569LPBP5KZVN7fAFu4aghZjKfIpQM1JG0QppFAN2CjjQBDQK1PkWkBMGiTlRzm36hsHZ3EzDzcQZczn2VbNqewYyyMqWDY6vpEspiDoIW2YEskmy4Ld5ANxd0r6AnX9aml2A5A7HvyJoLHbOBSKb8EAz09hc6dV4CKpCZFIMDhzzO5unNgsBlHljtoGJObR52QJYJGq4VNCns/Moy8ps5YGSqBK3cH6zhfkYVWsuvTnip8V161oIu8+9caRfTXpLzjNuDNC0F7R2MO5Nlswk9jGfRiyCbr8/nan6ljjpCBZ6EfDANXL39potMoCMk263sdm8tsGoAYgRuCTEklgETla747XCvHyhy+fhwor3DJ7gwfKfGkFfuHmaVn8vVeThQeCGAD6hg3N5hiDttp9buTC+vQg7NDzYoiJllTLiAQymrF8nVw73eaPP7bRYDARQbwnq3XmtgpCzOSUPAnsArsJg6Q6w2Hefn6b5YDhMn75HR7hk6qTsKPIQNbAr0vDLrcNUmBAA/v2Uo/+KBu5Ag4jKOvMofk9uK3F5/IJ5/qB/AVdaxfNahIsIDNYJlZ6yPCGvVAaZEAvuWORLW9UbiSOD3/gdkN3e3Fyeqjgtm+gQxmpj56OjqebPHYEp6YbGZq2K+KClXZzJ+5TtOuttbLW3ZFJw5P+kVlb78iJ6LQsNXi/kFELE47YWlkcCQ/sp8w0eATboanmwOfvD2uWEtZvVnGyS0J1w5jzvQfvHtCiHArepxKKw2eFLK/BjJxqQIw0OYTbug0MAfeMG2quTlf1gma1BiKbO87Wabv/s67dueX7+lhhD9DG7YgdmSXBsVYYbGmKkOyMotBs9P0jEwa9ttmuZhhyiRTzmaiJw1f0vpzR5x9j3Q7AO/qik9lHAbpdFDEvpGFSJLWb6wE9NUeiIXPZyt4nEDUx6IYlTvuVw4pXWSEoN2YtMRc43dhabwZGnTebTvRcgrZdoJty7V2KtRkctS+rXPNq2vVWH4Xe0PPDogc/QedwivUMWQiHDyhIAfxqr6RGkLhd/pp6lWymkoAc2X6w6pY6Uy3Pkep1HOJzeLZSey+CCjpBZVs/r+Xa/JePwWtS9Nqh1hdzx1foQrIjT9XO4ba5H ынчы."},{"t":"p","h":"Татаал сан атоочтор: эсептик сан – он бир, он бештей, экиден бир, беш жүз бир, эки миң, алты жүз; иреттик сан – он экинчи, жыйырма бешинчи, кырк бешинчи, жыйырма биринчи, жүз токсонунчу."},{"t":"v","l":["Эсиңерге туткула!","Сан атоочтордун түрлөрү:","1. Эсептик сан: бир, эки, он, жүз.","2. Иреттик сан: биринчи, бешинчи.","3. Топ ясан: беш-бештен, он-ондон. 4. Бөлчөк сан: 1,2; 5,2.","5. Чамалама сан: ондой, жүздөй.","6. Жамдама сан: бирөө, бешөө, алтоо."]},{"t":"p","h":"<span class=\"pg\" data-n=\"95\">95<\/span>209-көнүгүү. Сүйлөм ичиндеги сан атоочторду тууралап жазгыла."},{"t":"p","h":"1. Менин эжем он экинчи жашка чыгат. 2. Биз быйыл үч класста окуйбуз. 3. Балдар алты-алтоодон бөлүнүшүп, футбол ойноп жатышты. 4. Биздин класстан II чейректе сегизөө окуучу окуунун эң мыктысы болуп аталышты."}],"sub":[{"title":"ЖАҢЫ ОКУУ ЖЫЛЫ КАЕРДЕ, КАЧАН БАШТАЛАТ?","b":10},{"title":"22 ПАРТА","b":17},{"title":"ЖӨРГӨМҮШ ЖАНА АНЫН БАЛДАРЫ","b":21}],"pages":[92,95]},{"title":"§ 34. САН ЖАНА ЗАТ АТООЧТОРДОН ТҮЗҮЛГӨН СӨЗ АЙКАШТАРЫ","blocks":[{"t":"h3","h":"§ 34. САН ЖАНА ЗАТ АТООЧТОРДОН ТҮЗҮЛГӨН СӨЗ АЙКАШТАРЫ"},{"t":"p","h":"210-көнүгүү. Таблицаны карагыла. Сан жана зат атооч сөздөрүнө коюлган суроолорго ылайык байкоо жүргүзгүлө. Анан үлгү боюнча жазуу жүзүндө иштегиле."},{"t":"p","h":"Сан атооч сөздөр"},{"t":"v","l":["он беш","отуз","жүздөй","жүз элүү","беш жүз","отуз биринчи","канча?","Зат атооч сөздөр","машина","күн","киши","окуучу","сом","март","ким? эмне?","","Үлгү: Менин отуз сомум бар."]},{"t":"p","h":"211-көнүгүү. Өз алдыңарча схема боюнча сан атоочтун түрлөрүнө жараша экиден сүйлөм түзгүлө, дептериңерге жазгыла. эсептик сан"},{"t":"v","l":["иреттик сан","бөлчөк сан зат атооч","топ сан","чамалама сан","жамдама сан"]},{"t":"p","h":"<span class=\"pg\" data-n=\"96\">96<\/span>212-көнүгүү. Текстти окуп, тапшырманы аткаргыла."},{"t":"h3","h":"АКЫЛМАН МЕНЕН МУРАСЧЫЛАР"},{"t":"p","h":"(Араб элинин уламышы)"},{"t":"p","h":"Эзелки бир заманда бир карыя жашаптыр. Анын үч уулу бар экен. Бир күнү балдарын чогултуп, керээзин айтат."},{"t":"p","h":"– Мен силерге он жети төө калтырдым. Улууңар – теңин, ортончуңар – үчтөн бирин, кичүүңөр – тогуздан бирин алгыла, – дейт да, көз жумат."},{"t":"p","h":"Балдары атасынын мурасын бөлүшө албай кыйналышты. Он жети төө тең экиге да, үчтөн бирге да, тогуздан бирге да бөлүнбөйт экен. Ал татаал маселе чечилбей жатканда төө минген бир адам жолоочулап бараткан болот. Бир туугандар ал карыядан кеңеш сурашат."},{"t":"p","h":"– Менин төөмдү да кошуп алгыла, – дейт акылман карыя."},{"t":"p","h":"Ошентип, алар он сегиз төөнү бөлө башташат. Теңи – тогуз, үчтөн бири – алты, тогуздан бир бөлүгү – эки болду."},{"t":"p","h":"– Эми кайра кошуп көргүлөчү, – дейт төөнүн ээси. Жигиттер кошуп киришти. 9+6+2=17. Бөлгөндө он сегизди бөлүштү эле, кайра кошкондо он жети болуп калды. Мына кызык тамаша!"},{"t":"p","h":"– Өзүңөр көргөндөй, менин төөм да өзүмдө калды, силер да атаңар айткандай бөлдүңөр, – деди акылман карыя төөсүнө минип жатып."},{"t":"p","h":"? 1. Уламышта эмне жөнүндө сөз болду? Ата мурасы кандай экен? Аны бөлүштүрүүгө ким кандай жардам берди? Анын сырын чечкилечи? 2. Сан жана зат атооч сөздөрүнөн түзүлгөн сөз тизмектери бар бекен? Таап, мүнөздөп бергиле."},{"t":"p","h":"<span class=\"pg\" data-n=\"97\">97<\/span>213-көнүгүү. Өз алдыңарча сан атоочтун түрлөрүнө жараша ар бирине бирден сүйлөм түзүп келгиле."},{"t":"p","h":"Бышыктоо сабагы"},{"t":"p","h":"214-көнүгүү. Текстти окугула. Андан сан жана зат атооч сөздөрдөн түзүлгөн сөз тизмектерин таап, дептериңерге жазгыла. Алар кандай сан атоочтор экен? Мүнөздөп айтып бергиле."},{"t":"h3","h":"БИШКЕКТИН КӨЧӨЛӨРҮНДӨ"},{"t":"p","h":"Кыргызстандын борбор шаары Бишкекке эң биринчи машина 1912-жылы келген. Алгачкы автобус 1934-жылы жүрө баштаган. А биринчи троллейбус болсо, 1951-жылы көчөгө чыккан. Ошол жылы Бишкекте болгону 4 гана троллейбус болгон экен. Троллейбустун жолу 8 км эле болуптур."},{"t":"p","h":"215-көнүгүү. Көнүгүүнү окугула. Зат, сын, сан атооч сөздөрдү таап, бөлүп-бөлүп жазгыла."},{"t":"h3","h":"КӨЗҮБҮЗДҮН КУБАТЫ КАНЧАЛЫК?"},{"t":"p","h":"Адамдын көзү канча түстү ажырата ала тургандыгын билесиңерби? Биз ак, кара, кызыл, көк, сары, чаар, боз сыяктуу бир канча түстөрдү билебиз. Буюмдардын, чөптөрдүн, гүлдөрдүн, кийимдердин ар кандай түстөрүн ажыратып айта алабыз. Табияттын кооздугунун өзү эле канча түстөрдүн бар экенин айтып турат."},{"t":"p","h":"Ал эми илимпоздордун айтымында биздин көзүбүз эки миллион түстү ажырата алат экен."},{"t":"p","h":"А биз, кээде светофордун үч түсүн ажырата албаганыбызга эмне дешибиз керек?"},{"t":"p","h":"216-көнүгүү. Схема боюнча адегенде сөз айкаштарын түзүп, андан соң бир нече сүйлөмдөрдү оозеки түзүп жазгыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"98\">98<\/span>Күн, ай, жыл,"},{"t":"raw","h":"<h4 class=\"mk\">Кандай? Канча?<\/h4>"},{"t":"v","l":["буюмдар, идиш-аяктар,","кийимдер, окуучулар,","жер-жемиш, жашылчалар"]},{"t":"p","h":"217-көнүгүү. Төмөндөгү көнүгүүнү окуп, сан, зат атоочтон турган сөз айкаштарын таап жазгыла."},{"t":"h3","h":"АДАМ КАНЧА СҮЙЛӨЙТ?"},{"t":"p","h":"Адам бир сутканын ичинде бир саатка жакын тынбай сүйлөйт экен. Адам алтымыш жашка чыкканда сүйлөгөн сөзүн эсептегенде, эки жарым жыл бою тынбай сүйлөгөн болот экен. Анын баарын жыйнап, китеп кылып чыгара турган болсок, ал 5000 беттен турган миң том болмок."}],"sub":[{"title":"АКЫЛМАН МЕНЕН МУРАСЧЫЛАР","b":7},{"title":"БИШКЕКТИН КӨЧӨЛӨРҮНДӨ","b":20},{"title":"КӨЗҮБҮЗДҮН КУБАТЫ КАНЧАЛЫК?","b":23},{"title":"АДАМ КАНЧА СҮЙЛӨЙТ?","b":32}],"pages":[96,98]},{"title":"§ 35. САН АТООЧТОРДУН ӨЗ АЛДЫНЧА ЖӨНДӨЛБӨСТҮГҮ","blocks":[{"t":"h3","h":"§ 35. САН АТООЧТОРДУН ӨЗ АЛДЫНЧА ЖӨНДӨЛБӨСТҮГҮ"},{"t":"p","h":"218-көнүгүү. Төмөнкү сөздөрдүн жөндөлүшүн карагыла. Сан атоочу кайсы, зат атоочу кайсы байкагыла, Сан атооч сөздөр жөндөлөт бекен? Жөндөлбөсө, сөздүн мааниси бузулган жокпу?"},{"t":"p","h":"А. (канча? + эмне) беш китеп"},{"t":"v","l":["И. (канча? + эмненин?) беш китептин","Б. (канча? + эмненге?) беш китепке","Т. (канча? + эмнени?) беш китепти","Ж. (канча? + эмнеде?) беш китепте","Ч. (канча?+ эмнеден?) беш китептен"]},{"t":"p","h":"219-көнүгүү. Жогорудагыдай үлгүгө салып, бул сөздөрдүн тизмегин дептериңерге жөндөп жазгыла,"},{"t":"p","h":"Он күн, жыйырма дептер, отуз окуучу, он беш арча, элүү сом, бешинчи сабак, он парта, ондой киши."},{"t":"p","h":"<span class=\"pg\" data-n=\"99\">99<\/span>Сан атооч сөздөр зат атооч сөздөр менен айкашып келгенде, сан атооч сөзгө жөндөмө мүчө уланбайт."},{"t":"p","h":"220-көнүгүү. Таблицаны карагыла. Андагы сан атоочторду катыштырып, үлгүгө жараша бир нече сүйлөмдөрдү түзгүлө."},{"t":"p","h":"Силер билесиңерби?"},{"t":"p","h":"Кыргызстандагы ири дарыялары кайсылар?"},{"t":"v","l":["Нарын дарыясы – 535 км","Чүй дарыясы – 221 км","Чаткал дарыясы – 205 км","Талас дарыясы – 102 км","Түп дарыясы – 120 км","Ак-Сай дарыясы – 124 км"]},{"t":"p","h":"Үлгү: Жыргалаң дарыясынын узундугу токсон эки кмге жетет."},{"t":"p","h":"221-көнүгүү. Суроолорго жоопту жазуу жүзүндө бергиле. Андагы сан жана зат атооч сөздөрдөн түзүлгөн сөз тизмектерин мүнөздөп бергиле."},{"t":"p","h":"Силердин айылда канча адам жашайт? Кыштагыңарда же силер жашаган шаарда канча көчө бар? Силердин көчөңөрдө канча үй курулган? Мектебиңерде канча окуучу окуйт?"},{"t":"p","h":"<span class=\"pg\" data-n=\"100\">100<\/span>Бышыктоо сабагы"},{"t":"p","h":"222-көнүгүү. Текстти окугула. Сан жана зат атооч сөздөрүнөн түзүлгөн тизмектерди тапкыла. Алар кайсы жөндөмөдө турганын айткыла."},{"t":"h3","h":"«ЖҮЗ ЖИГИТ БАЯНЫ"},{"t":"p","h":"I"},{"t":"p","h":"Илгери-илгери биздин элибизге кол салган калмактардын мизин кайтарып, жерин коргогон Алим баатыр деген болуптур. Акыры ошол баатыр дүйнөдөн өтөт. Ошондо калмактын кол башчысы кыргыздарга катуу кыргын салып, төрт жашка чейинки жүз баланы туткун кылып кетишет."},{"t":"p","h":"Жылдар өтүп, олжого кеткен балдар чоңоюп жигит боло баштайт. Калмактын төрөсү жүз жигитти жоокерчилик өнөргө үйрөтөт. Жигиттер туулган жер, эне-ата дегенди билбестен, кылыч шилтеп, найза сайганды гана билип, ырайымсыз өсүшөт."},{"t":"p","h":"II"},{"t":"p","h":"Арадан жыйырма жыл өтөт. Жашыруун кеңеш курган калмактар баягы жүз жигитти эми кыргыздын өзүнө каршы күрөшкө алып чыгат."},{"t":"p","h":"Муну билген кыргыздар өз элин үч жерден үч катар кылып катуу тосушат. Биринчи иретте куралданган жоокерлер, экинчи катарда баягы жүз жигиттин энелери, үчүнчү катарга жалаң комузчу, чоорчуларды коюшат."},{"t":"p","h":"Куралдуу жүз жигит эки катарды кырып өтүшөт. Үчүнчү тосотко келишет. Муңдуу мукам обондор жер жарып, тоо-таштарды титиретет."},{"t":"p","h":"<span class=\"pg\" data-n=\"101\">101<\/span>Күүгө арбалган жүз жигиттин колдорунан кылычтары түшүп, токтоп калышат."},{"t":"p","h":"Акылына келген жүз жигит ошондо гана өзүлөрүнүн кыргыз экенин билип, калмактардын душман экендигин түшүнүп, кайрадан калмактарды кырып, өз элин коргоп калыптыр."},{"t":"p","h":"223-көнүгүү. Өз алдыңарча сан + зат атооч формасындагы сөз тизмектеринен катыштырып, бир нече сүйлөмдү адегенде цифра менен, андан соң жазуу түрүндө жазгыла, Үлгү: 15 сом. – Мен алманы беш сомдон сатып алдым."},{"t":"p","h":"224-көнүгүү. Элдик санак-табышмакты окуп, дептериңерге жазып алгыла, Андагы сан атоочтор менен уйкашып келген сөздөрдүн маанисин түшүндүргүлө."},{"t":"h3","h":"САНАК-ТАБЫШМАГЫ"},{"t":"v","l":["1 дегениң – бир кудай,","2 дегениң – эки адам жол жүрсө эрикпейт,","3 дегениң – үлгүлүү топ бузулбайт,","4 дегениң – төрөлүү журт бузулбайт,","5 дегениң – белгиленген буюм жоголбойт,","6 дегениң – аркандалган ат алыс кетпейт,","7 дегениң – жетесиз жаман оңолбойт,","8 дегениң – серкесиз кой суу кечпейт,"]},{"t":"p","h":"9 дегениң – тойбогон бай томаяктан үмүт кылат."}],"sub":[{"title":"«ЖҮЗ ЖИГИТ БАЯНЫ","b":16},{"title":"САНАК-ТАБЫШМАГЫ","b":28}],"pages":[99,101]},{"title":"§ 36. АТ АТООЧ СӨЗ ТҮРКҮМҮ ЖӨНҮНДӨ ТҮШҮНҮК","blocks":[{"t":"h3","h":"§ 36. АТ АТООЧ СӨЗ ТҮРКҮМҮ ЖӨНҮНДӨ ТҮШҮНҮК"},{"t":"p","h":"225-көнүгүү. Кара тамга менен басылган сөздөрдүн кандай сөздөр менен алмашылганын байкагыла. Кара тамга менен басылган сөздөр кайсы сөз түркүмүнө кирет? Суроо берип, түшүндүргүлө."},{"t":"v","l":["<span class=\"pg\" data-n=\"102\">102<\/span>Керим бүгүн сабакка","кечигип келди.","Ал бүгүн сабакка кечигип","келди."]},{"t":"p","h":"Үйдүн курулушу башталды. Анын курулушу башталды. Кызыл алманы Асел жеди. Ал алманы Асел жеди. Кубаныч 3 «А» класста окуйт. Кубаныч бул класста окуйт. 226-көнүгүү. Жогорудагыдай үлгүдөй кылып, бул сөздөрдү катыштырып, бир нече сүйлөм түзүп жазгыла."},{"t":"p","h":"Мугалим, окуучу, автобус, самолёт, келгин куштар, жылдыз, ай, күн, дос."},{"t":"p","h":"Үлгү: Досум мага жардам берди. – Ал мага жардам берди."},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Сүйлөм ичиндеги зат, сан, сын атоочтордун ордуна колдонулуп, аларды алмаштырып айтылган сөздөр ат атоочтор деп аталат."},{"t":"p","h":"Мисалы: Кубат окуду – (Ал окуду ким окуду?) Окуучулар келишти – (Алар келишти кимдер келишти?)."},{"t":"p","h":"Ат атоочтор жекелик жана көптүк түргө бөлүнөт. 227-көнүгүү. Текстти окуп, ат атооч сөздөрдү тапкыла. Алар кандай зат атооч сөздөрдү алмаштырды? Түшүндүргүлө."},{"t":"p","h":"Кулагыңа күмүш сырга!"},{"t":"p","h":"Сыргактын чоң энеси бар. Ага чоң энеси бир күнү мындай деди:"},{"t":"p","h":"– Дүкөндүн артындагы ат кимдики?"},{"t":"p","h":"– Самсаалыныкы. Ал дүкөнгө келген, – деди Сыргак катуу айтып, чоң энесине угуза. Ага чоң энеси нааразы болду."},{"t":"p","h":"– Ой, чунак, мунун айтканын кара, бешигин терметкенсип... Улуу адамды сыйлоо керек. Анын атынан айтканың уят, – деди."},{"t":"p","h":"Т. Самудинов"},{"t":"p","h":"<span class=\"pg\" data-n=\"103\">103<\/span>1. «Бешигин терметкенсип» дегени эмнеси? Бала эгерде «Ат Самсаалы агамдыкы...» десе, чоң энеси баланы уяткарат беле?"},{"t":"p","h":"228-көнүгүү. «Улууга-урмат, кичүүгө-ызат» деген темада чакан дилбаян жазып келгиле."}],"pages":[102,103]},{"title":"§ 37. АТ АТООЧТУН ЖЕКЕЛИК ТҮРҮ","blocks":[{"t":"h3","h":"§ 37. АТ АТООЧТУН ЖЕКЕЛИК ТҮРҮ"},{"t":"v","l":["Ат атоочтун жекелик түрү булар:","Мен, сен, сиз, ал.","Мисалы: I жак: Мен жомок окудум.","II жак: Сен жомок окудуң.","(Сиз жомок окудуңуз)","III жак: Ал жомок окуду."]},{"t":"p","h":"229-көнүгүү. Ат атооч сөздөрдү этиш сөздөргө айкаштырып, бир нече сүйлөм түзгүлө, Ким? Эмне? Эмне кылды?"},{"t":"raw","h":"<h4 class=\"mk\">Мен Сен Сиз Ал<\/h4>"},{"t":"v","l":["кел, иште, оку, жуун,","өстүр, укта, чурка, ырда,","бийле, кийин, кубан, тур.","","Үлгү: Асыл – менин эжем. Ал чачын өрдү."]},{"t":"p","h":"230-көнүгүү. Текстти окугула маанисин түшүндүргүлө. Тапшырманы аткаргыла."},{"t":"h3","h":"АКЫЛ КАРАЧАЧ КИМ БОЛГОН?"},{"t":"p","h":"Өткөн заманда Жээренче чечен деген акылман адам болгон. Баласы Төлөмырза чоңойгондо, ага эл ичинен акылдуу кыз издеп жөнөйт."},{"t":"p","h":"Бир айылга келсе топ кыз терген куурайларын көтөрүп, музоолорун айдап келатыптыр. Аңгыча катуу <span class=\"pg\" data-n=\"104\">104<\/span>жаан жаайт. Кыздар отундарын таштап качышат. Музоолору уйларын эмип коёт."},{"t":"p","h":"Бир гана кыз музоосун эмизбей кармап, куурайын чапаны менен жаап, өзү куурайды алдына алып отуруп алат. Аны көрүп Жээренче: «Ээ, балам, тиги кыздар үйлөрүнө кетишти, а сен эмне кылып отурасың? – дейт."},{"t":"p","h":"Анда ал кыз:"},{"t":"p","h":"– Ата, ал кыздардын 4 зыяны бар. А мен бир зыян тарттым, үч пайдам бар, – дейт."},{"t":"p","h":"Ал эмне? – дейт таң калган Жээренче."},{"t":"p","h":"– Музоом эмген жок. Куурайым кургак калды. Өзүм суу болгонум жок, энем үйгө барганда урбайт. Бул – үч пайдам. Болгону, чапаным гана суу болду... – дейт кыз."},{"t":"p","h":"Жээренче: «Сен Карачач эмей эле Акыл Карачач турбайсыңбы» – деп, ошол кызга куда түшүптүр."},{"t":"p","h":"1. Акыл Карачачтын акылдуулугун эмнеден көрдүңөр?"},{"t":"p","h":"2. Текстте ат атоочтор бар бекен? Бар болсо аларды таап, бирге айтылган зат атооч сөздөрү менен кошуп жазып көрсөткүлө."},{"t":"p","h":"231-көнүгүү. Сүйлөмдөрдү окугула. Алар ат атоочтун жекелик түрүнүн кайсы жагында турганын айтып бергиле."},{"t":"p","h":"1. Мен апама жардам берейин. 2. Сен дүкөнгө барып келе калчы? 3. Сиз жаңы газетаны окудуңузбу? 4. Ал кийимдерин тазалап бүттүбү?"},{"t":"p","h":"Машыгуу сабагы."},{"t":"p","h":"232-көнүгүү. Көнүгүүлөрдү көчүрүп жазгыла да, ат атооч сөздөрдү зат атооч сөздөр менен кантип алмаштырганын айткыла."},{"t":"p","h":"1. Менин досумдун күчүгүнүн аты – Короочу. Ал абдан сак күчүк. 2. Китепти айрыбай, булгабай күтүү <span class=\"pg\" data-n=\"105\">105<\/span>керек. Ал – билим менен таалимдин булагы. 3. Кушубек Казыбаев күрөш боюнча республикалык мелдешке катышты. Ал – биздин класстын сыймыгы."},{"t":"p","h":"233-көнүгүү. Сүйлөмдөрдү карагыла. Андагы көп чекиттердин ордуна тиешелүү ат атооч сөздөрдү коюп, көчүрүп жазгыла. Алар кайсы жакты көрсөтүп турганын үстүнө жазып белгилегиле."},{"t":"p","h":"1. ...абдан тартиптүү, адептүү кыз. 2. ...үйдөн чыккан кезде кар жаай баштаган. 3.... мектепке жарым саатта келди. 4. Айгүл, Бермет, Касым болуп, бүгүн ырхор ийримине катыштык. 5. Бекзат, ... чай ичесиңби, же сүт ичесиңби? 6. Апа, ... чарчадыңыз го, эс алыңыз."},{"t":"v","l":["Эсиңерге туткула!"]},{"t":"p","h":"Жекелик сандагы ат атоочтор сүйлөм ичинде мындайча өзгөрүп айтылат жана жазылат:"},{"t":"v","l":["Ал – анын, ага, аны, анда, андан;","Бул – мунун, буга, муну, мында, мындан."]},{"t":"p","h":"234-көнүгүү. Текстти окугула. Андан ат атоочторду тапкыла. Ат атоочтор кайсы сөздүн ордуна колдонулганын мисал менен түшүндүргүлө."},{"t":"h3","h":"КУЙРУЧУК АТАНЫН КҮЛКҮЛӨРҮНӨН"},{"t":"p","h":"Куйручук ата кыргыздан чыккан куудул, акылман адам болгон. Ал жаш кезинде жетим калып, байлардан көп запкы көргөн. Түн ичинде күндө бир байдын үйүнө билгизбей барып, үйдүн сыртынан түтүк менен чарадагы сүттөрүн ичип алып жүрөт. Куйручуктун бул жоругун эч ким билбейт. Окуя улана берет. Молдолор, бакшылар, көзү ачыктар түрдүү ушактарды таратып, түлөө өткөрүшөт."},{"t":"p","h":"<span class=\"pg\" data-n=\"106\">106<\/span>Акыры ал адатынча, түн ичинде түтүк менен сүт ичип жатканда, түндүк тартам деп үй алдына бара жаткан келин Куйручукка чалынып жыгылат."},{"t":"p","h":"Чочуп кеткен келин кыйкырып ийип, эл ойгонот. Куйручук түтүгүн таштай качып кутулат."},{"t":"p","h":"Анын жоругу күлкүгө айланып, байлар, молдолор шылдың болушат."},{"t":"p","h":"235-көнүгүү. Окуган ыр-аңгемеңерди өз алдыңарча талдап, ат атоочтордон бешти таап келгиле."}],"sub":[{"title":"АКЫЛ КАРАЧАЧ КИМ БОЛГОН?","b":6},{"title":"КУЙРУЧУК АТАНЫН КҮЛКҮЛӨРҮНӨН","b":28}],"pages":[104,106]},{"title":"§ 38. АТ АТООЧТУН КӨПТҮК ТҮРҮ","blocks":[{"t":"h3","h":"§ 38. АТ АТООЧТУН КӨПТҮК ТҮРҮ"},{"t":"p","h":"236-көнүгүү. Таблицаны карап, ат атоочтордун жекелик түрүнөн көптүк түрү эмнеси менен айырмалана турганын байкагыла."},{"t":"v","l":["Ат атоочтун","жекелик","I жак: Мен окуйм.","II жак: Сен окуйсуң,","Сиз окуйсуз.","III жак: Ал окуйт.","Ат атоочтун","","Биз окуйбуз.","Силер окуйсуңар.","Сиздер окуйсуздар.","Алар окушат."]},{"t":"p","h":"237-көнүгүү. Жогорудагы таблицага карап, бул сүйлөмдөрдү өзгөртүп жазып көрсөткүлө. Суроо берип, ат атоочторду аныктагыла. Алар жекелик сандабы, көптүк сандабы, ажыратып айткыла."},{"t":"p","h":"1. Ал мектептен келди. 2. Мен автобуска түштүм."},{"t":"p","h":"3. Сен бөбөгүңө чай бердиңби? 4. Сиз эс алып алыңыз."},{"t":"p","h":"5. Мен сага ишенем. 6. Апа, мен сизди таарынттымбы? 7. Ал атка мингенди билбейт. 8. Мен бул китепти окугам, а сенчи?"},{"t":"p","h":"Үлгү: Ал мектепке келди? (Ким?) – Алар мектепке келишти. (Кимдер?)"},{"t":"p","h":"<span class=\"pg\" data-n=\"107\">107<\/span>238-көнүгүү. Текстти окуп, андан зат атоочторду таап, суроо бергиле. Түрүн ажыраткыла."},{"t":"h3","h":"АКЫЛМАН КЫДЫР АКЕНИН ӨНӨРҮ"},{"t":"p","h":"Ал эл башкарат, жооптуу милдетти көтөрүү менен, бош убактысында тайган агытып, куш салганды, сейилдеп аңчылык кылганды, күлүк таптап, ат чапканды бала кезинен эле жакшы көрчү экен."},{"t":"p","h":"Ал куштардын кыраанын, начарын ажырата билип, мүнүшкөрлүк да кылчу экен. Каз-өрдөккө ылаачын, кышкысын түлкүгө бүркүт салчу дешет."},{"t":"p","h":"Анын «Тайгашка» деген күлүгү нечен ирет ат чабыштарда байге алып, Кыдыр акенин зоболосун бир топ көтөрүптүр."},{"t":"p","h":"Б. Максутовдон"},{"t":"p","h":"239-көнүгүү. Схема боюнча өз алдыңарча бир нече сүйлөмдөрдү түзгүлө. Суроо бергиле, ат атоочтун жеке жана көптүк түрлөрүн ажыратып түшүндүргүлө."},{"t":"p","h":"мен, биз Ким? – Кимдер? сен – силер Эмне кылды? Эмне? – Эмнелер? сиз – сиздер Эмне кылышты? ал, алар"}],"sub":[{"title":"АКЫЛМАН КЫДЫР АКЕНИН ӨНӨРҮ","b":9}],"pages":[107,107]},{"title":"§ 39. АТ АТООЧТУН ЖӨНДӨЛҮШ ӨЗГӨЧӨЛҮКТӨРҮ","blocks":[{"t":"h3","h":"§ 39. АТ АТООЧТУН ЖӨНДӨЛҮШ ӨЗГӨЧӨЛҮКТӨРҮ"},{"t":"p","h":"240-көнүгүү. Көнүгүүлөрдү окугула, андагы ат атоочтор зат атоочтор менен бирге айтылганда өзгөрдүбү, өзгөргөн жокпу? Айтып бергиле."},{"t":"p","h":"1. «Шашпа, коён» деген мультфильм карышкыр менен коён жөнүндө. Ал мультфильмди мен көргөм. 2. Бул бала-менин инимдин досу. 3. Бакыт, бул китепти Жыпарга <span class=\"pg\" data-n=\"108\">108<\/span>берип койчу. 4. Бул күн мен үчүн абдан кубанычтуу күн болду."},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Ал, бул деген ат атооч зат атооч сөздөр менен айкалышып келген учурда, ат атооч сөздөр жөндөмөлөр боюнча өзгөрбөйт."},{"t":"v","l":["Мисалы:","Атооч: ким? Ал окуучу.","Илик: кимдин? Ал окуучунун","Барыш: кимге? Ал окуучуга","Табыш: кимди? Ал окуучуну","Жатыш: кимде? Ал окуучуда","Чыгыш: кимден? Ал окуучудан"]},{"t":"p","h":"241-көнүгүү. Схеманы карагыла. Андагы ат атооч сөздөр кандай өзгөргөнүн байкагыла. Андан соң үлгү боюнча жазып көрсөткүлө."},{"t":"v","l":["китептин...","мектепке...","Ал","топту...","көчөдө...","айылдан","анын...","ага...","аны...","анда...","андан ..."]},{"t":"p","h":"Үлгү: Ал китептин барагы айрык. – Анын барагы айрык."},{"t":"v","l":["342-көнүгүү. Муну да жогорудагыдай иштегиле.","","машинанын","гүлгө","Бул","дептерди","терезеде","үйдөн","мунун...","буга","муну...","мында...","мындан..."]},{"t":"p","h":"<span class=\"pg\" data-n=\"109\">109<\/span>243-көнүгүү. Төмөндөгүлөрдү окуп, кара менен берилген сөздөргө суроо бергиле. Сөздөрдүн маанисин түшүндүргүлө."},{"t":"p","h":"Кулагыңа күмүш сырга!"},{"t":"v","l":["Байыркы кыргыздарда салмак өлчөмү – кадак.","Данды элегенден калган калдыгы – кебек.","Жүк жүктөлүүчү унаанын аты – көлүк.","Өңү серт адам – куник.","Айран, сүттүн жалпы аты – катык."]},{"t":"p","h":"Чөптүн мал жегенден кийинки калдыгы – кашек. Сөөктүн жумшак бөлүгү – кемик."},{"t":"v","l":["Адамга жардам, кол кабыш кылуу – көмөк.","","Машыгуу сабагы."]},{"t":"p","h":"244-көнүгүү. Ат атоочтордун жөндөлүшүн таблицадан карагыла. Алардын өзгөчөлүктөрүн билип алгыла."},{"t":"v","l":["Атооч: ким? эмне? Ал, бул.","Илик: кимдин? эмненин? Анын, мунун.","Барыш: кимге? эмнеге? Ага, буга.","Табыш: кимди? эмнени? Аны, муну.","Жатыш: кимде? эмнеде? Анда, мында.","Чыгыш: кимден? эмнеден? Андан, мындан."]},{"t":"p","h":"245-көнүгүү. Таблицага карап, бул сүйлөмдөрдөгү көп чекиттин ордуна тиешелүү ат атоочторду коюп жазгыла. Кайсы жөндөмөдө турарын үстүнө жазып көрсөткүлө."},{"t":"p","h":"1. Кубан ооруп калгандыктан, ... ордуна мелдешке Асанкул катышты. 2. Оор жүгүн көтөрүүгө Бекжан жардам бергендиктен, ... Кутман карыя алкыш айтты."},{"t":"p","h":"3. Чоң энем Аселди тизесине отургузуп алды да, ... көпкө чейин эркелетип отурду. 4. Сабыр Канатты издеп спорт залга кирген эле, ... Канат жок болчу. 5. Акмат, <span class=\"pg\" data-n=\"110\">110<\/span>сен жалган айтканды качан коёсуң,... эч нерсе таппастыгыңды билесиңби?!"},{"t":"p","h":"246-көнүгүү. Бул ат атооч сөздөрдү катыштырып, жогоркудагыдай сүйлөмдөрдү түзүп жазгыла."},{"t":"p","h":"Бул, мунун, буга, муну, мында, мындан."},{"t":"p","h":"247-көнүгүү. Тексттен ат атоочторду таап, кайсы жөндөмөдө турарын байкагыла."},{"t":"h3","h":"БАЙЛАНЫШЧЫ"},{"t":"p","h":"Улуу согуш күндөрү эле. Тайыр жолдоштору менен чалгынга жөнөгөн. Аңгыча бөлүк менен байланыш үзүлдү. Эми бөлүктүн, жүздөгөн жолдошторунун тагдыры чалгынчылардын командири Тайырдын колунда эле. Ал зымдын үзүлүп калган жерин табыш үчүн, алга карай сойлоду. Ошол кезде автомат тытырап, ок атылып ийнине тийди. Мунун айынан, үзүлгөн зымды лента менен ороп байлоо мүмкүн болбой калды. Автоматтын үнү басылбады. Анын алы да кете баштады."},{"t":"p","h":"Тайыр зымдын үзүлгөн учтарын оозуна салды да, тиштеген бойдон жыгылды. Байланыш жөнгө салынды."},{"t":"p","h":"Зымды тиштеген бойдон өлгөн бул жоокердин сөөгүн жолдоштору эртеси табышты."},{"t":"p","h":"248-көнүгүү. Схема боюнча ат атооч сөздөрдү катыштырып, бир нече сүйлөм түзгүлө."},{"t":"raw","h":"<h4 class=\"mk\">Ким? Эмне?<\/h4>"},{"t":"v","l":["качан?","эмне кылды?","кайда?","кайдан?","Үлгү: Айгүл мектептен азыр эле келди."]}],"sub":[{"title":"БАЙЛАНЫШЧЫ","b":23}],"pages":[108,110]},{"title":"§ 40. ЭТИШ СӨЗ ТҮРКҮМҮ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"111\">111<\/span>§ 40. ЭТИШ СӨЗ ТҮРКҮМҮ"},{"t":"p","h":"249-көнүгүү. Сүрөттөгүлөрдүн кыймыл-аракетин байкагыла. Ким эмне кылып жатат? Аңгемелеп айтып бергиле да, төрт сүйлөм түзүп жазгыла."},{"t":"img","src":"data:image/webp;base64,UklGRuAwAABXRUJQVlA4INQwAACQWAGdASr5AZQBPrVSpEonJTcpKxTbyuAWiWUtzxqHavvr1nXaXHVd0PKy67023X/R8toN8rHxzsV9Ko8drO258Gf+rxmv9/XT9F9XTl5/pnQ0/+/psmq5wIO0xZ5zRCj19dCrur7Exf7ZTkLM6J6KcF7u/U1KtkJJoXhRF88M5xIm2wy4JY8WbKsHG/H8PD5UbiWnDmWih1bRv6CfE2P6iElcpBUdzzLmNETtSVtRsKSm9Tt3n/JwNtuuyvl5xzk5eSIF/Uck6JguEHeEmO3q01rs4Y83+VtUFfpNsDbXXzP8DgB9XjBfOlS29JRnq1/ohjOHOxw2Su5urwQnDLeXRqCWjgo4cqYlvx97sdbBywJuShMqA2c1DeG2e2ir0wliAZFeefwtDlbzGtK5/71nZqRmN5HyAvSS9yq6+n5wR2QV9joDahydtUfzrw2Av1Wugr16OEnrJ89bu+SXlHhLUv5g69NKpqU4z8d3iIwzeJxu6xUQf3XcUMEcMVKGnvf+H8uVv4H46vUkvnTIKMk3pH2ojKnXBrM44ZZp6Uc2pxMPfu3V0+t0IS2APLVqnCt3x9lChvvOtWl7tGGx3H/vtsFy5oAxB6uJwceBzW8V7cp9W2ne/9Kdlu9Q0VgQZmNca5jVOKLarBg7czZYq3Ykw8GJ2NLx/LDUO8k3U56I6Ma2tSEBzT4M65mJMyg3Tk98gR6m+8fwzDKt7TZ8MLjOdlykVWKhxdUIv2ZeiGxcMrGEhipiKwL3J53rKtXOT5Nhdd9hIVbrTTdtLbQWFnPJ+OYv6iY5rm2U8iaSc4+TLtFONOuAS4WvvMYmOeGwhrG8WiUcBjTbzTUyhLLx6ZpG4CLizVTVJXg0+U7s7MHrsugLtTGyY4f5opJFnavDLrhew+4spiJ9Us53iDac8XV2ikhUu5V1KKvA/rvQflbJDsFkvSgX6LP3TTDThvRXvgM8u4irYiF0+ItlIlVnTPx тат, көрдү."]},{"t":"p","h":"251-көнүгүү. Текстти окуп, кыймыл-аракетти билдирген сөздөрдү тапкыла."},{"t":"h3","h":"КУМУРСКАНЫН «КИНДИК ЭНЕЛЕРИ»"},{"t":"p","h":"Кумурскалардын энелери таштаган уруктар буудайдын данынан бир аз кичирээк болот. Эне кумурска таштаган ар бир урук ошол эле замат анын балдарына, башкача айтканда, киндик энелерге өтөт. Ар бири бирден урук тиштеп кетишет. Алар ал уруктан чимейилге окшогон кичинекей кумурскалар чыкканга чейин ооздорунан түшүрүшпөйт. Тооктор өз жумурткасын балапан <span class=\"pg\" data-n=\"112\">112<\/span>чыкканга чейин басып чыгарышса, булар кумурска чыкканга чейин ооздоруна тиштеп жүрүшөт. Сыягы алар уруктарга белгилүү даражада жылуулук берип турушат окшойт. Мындай кумурскаларды «киндик эне» деп атабаганда эмне деп атамак элек..."},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Заттын кыймыл-аракетин билдирип, эмне кылат? эмне кылып жатат? эмне кылды? деген суроолорго жооп берген сөз түркүмү этиш деп аталат."},{"t":"p","h":"Эмне кылат? – барат, келет, сүрөт тартат."},{"t":"p","h":"Эмне кылып жатат? – баратат, келатат, сүрөт тартып жатат."},{"t":"p","h":"Эмне кылды? – барды, келди, сүрөт тартты. Эмне кылган? – барган, келген, сүрөт тарткан."},{"t":"p","h":"252-көнүгүү. Накыл кептерди окугула. Маанисин айтып бергиле. Этиш сөздөрдү таап, кандай суроолорго жооп берерин түшүндүргүлө."},{"t":"v","l":["Аталардын сөзү:","1. Эстүү жаңылса, өзүн жемелейт,","Эси жок жаңылса, өзгөнү жемелейт.","","2. Келгенче конок уялат,","Келген соң үй ээси уялат.","","3. Акылдууга эскертсең билет,","Акылсызга айтсаң күлөт.","","4. Мээнеткеч убакыт издейт.","Жалкоо шылтоо издейт."]}],"sub":[{"title":"КУМУРСКАНЫН «КИНДИК ЭНЕЛЕРИ»","b":8}],"pages":[111,112]},{"title":"§ 41. КЫЙМЫЛ-АРАКЕТТИ БИЛДИРГЕН СӨЗДӨРДҮН КЕПТЕГИ МААНИСИ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"113\">113<\/span>§ 41. КЫЙМЫЛ-АРАКЕТТИ БИЛДИРГЕН СӨЗДӨРДҮН КЕПТЕГИ МААНИСИ"},{"t":"p","h":"253-көнүгүү. Ырды окугула. Андагы көп чекиттин ордуна кандай сөздөрдү коюуга болорун жана алар кандай суроого жооп берерин айтып түшүндүргүлө. Таяныч сөздөрдү колдонгула."},{"t":"h3","h":"АПАМ ... БАЗАРГА"},{"t":"v","l":["Апам ... базарга","Бөбөгүмү ... издеп.","Мен келгенче базардан,","Курсагын да ... деп.","Бөбөгүмдү ... Курсагын да ...","Чачын да ... Бир күнү кечке ...","","Шок бөбөгүм жөн...","Жолдон өтсө түз...","Эки жакка...","Козу-улактай..."]},{"t":"p","h":"«Кырчын»"},{"t":"p","h":"Таяныч сөздөр: ойноттум, карадым, кетти, тойгуз, ойнот, тойгуздум, тарадым, сереңдейт, элеңдейт, баспайт, жүрбөйт."},{"t":"p","h":"1. Этиш сөздөр болбосо, оюбузду так билдире алат бекенбиз? 2. Ырды толуктап жазып алгыла да, жаттап келгиле."},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Биз этиш сөздөр болбосо оюбузду жеткиликтүү айта албайбыз. Этиш сөздөр бардык кыймыл-аракетти билгизет да, оюбузду жыйынтыктайт."},{"t":"p","h":"254-көнүгүү. Чакан текстти окугула. Көп чекиттин ордуна өзүңөр сөз таап койгула да, тексттин мазмунун түшүндүргүлө."},{"t":"h3","h":"<span class=\"pg\" data-n=\"114\">114<\/span>СЕЗИМТАЛ АЙБАНАТТАР"},{"t":"p","h":"Жылкы көп айбанаттардын акылдуусу. Алар көзгө сайса көрүнгүс караңгыда да жолду таап ... Алыска уурдап кетсе да, өз жерин адашпай таап .... ...."},{"t":"p","h":"Мышыктын көзүн таңып каякка алып келсе да, өзүнүн үйүн адашпай...."},{"t":"p","h":"Канаттуулардын сак кулагы үкү экен. Ал кандай үндүн каерден чыгып жатканын караңгыда эле так...."},{"t":"p","h":"255-көнүгүү. Сүрөттөгүлөрдү карагыла, андагы кыймыл-аракеттерди өз сөзүңөр менен баяндап, чакан дилбаян жазгыла."},{"t":"img","src":"data:image/webp;base64,UklGRoYlAABXRUJQVlA4IHolAAAwOAGdASoKAlEBPrVMnkmnLC0kMjWqcaAWiWVuzoAtjTtxT00vDLiVq2nXm1t98wXkA3vrg54w5OGUd//v/l7Gv/PtUf8fkv8P/q0X/8uL//4jFcz0Cc6zoH//7I7PDD7CVHbQ+4RhLXbNtxHNqn8YDVDxJVgfSkhOwM4dCOeLZoaOmwGTtKgSPFQy/fFiAhcOBP25a3dmAUUKeXO8rTTO2EuT/4+nkkHWT7zmwSgJvh+ba6NhRcjdqhz6aIGJDTGrp9CzdD0VrncSawq7sf5PxbiQYyWKgVvXLFmuKi44L4yx2wN7d1gE7y15YxFuvZq5DuHuKO+ftg+xdIneuT0gPoy22VLDvkmm2+ODdBce1NPjc90vUa0cU42ROYhia4dAKd0OxcAIOasr0 зүлөрүн байкагыла да, үлгү боюнча сүйлөм түзүп жазгыла."},{"t":"v","l":["? Этиштин учур чагы кантип түзүлөт?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"116\">116<\/span>көрүп, ойлонуп – отурат, отурам, отурасың; сүрөт тартып, угуп – жатат, жатам, жатасың; тамак ичип, кино көрүп – отурат, отурам, отурасың; бийлеп, сүйлөп – жатат, жатам, жатасың"},{"t":"p","h":"Үлгү: Айжан ашканадан тамак ичип отурат. Мен ойлонуп отурам. Сен китеп окуп жатасыңбы?"},{"t":"p","h":"259-көнүгүү. Текстти окуп, андан заттын кыймыл-аракетин билдирген сөздөрдү таап, анын болуп өткөн убактысы тууралуу оюңарды тексттин мисалында түшүндүргүлө."},{"t":"h3","h":"19 ЖАШЫНДА БААТЫР БОЛГОН"},{"t":"p","h":"Улуу Ата Мекендик согуштун айыгышкан күндөрүнүн бири болчу. Душмандардын танкалары жер жайнап кирип келди. Душмандын октору Дайырдын бардык жолдошторун жерге сулатып, акырында жалгыз өзү калды."},{"t":"p","h":"Жанын аяп, жансоогалоого болбойт эле. Ал жалгыз өзү автомат менен душмандын солдаттарын аткылай берди. Теңсиз уруш кечке созулду. Бирок Дайыр жеңилип берген жок. Кечке чейин ал душмандын 40 солдатын, 8 танкасын жана 6 бронемашинасын жок кылды."},{"t":"p","h":"Мындай каармандык эрдиги үчүн, Дайыр Асанов 1943-жылдын 26-октябрында Советтер Союзунун Баатыры деген наам алды. Ошондо ал 19 гана жашта эле."},{"t":"p","h":"Эсиңерге туткула!"},{"t":"p","h":"Этиштин учур чагы жекелик жана көптүк түр болуп экиге бөлүнөт."},{"t":"p","h":"Бир заттын учурдагы кыймыл-аракети учур чактын жекелик түрүн түшүндүрөт."},{"t":"p","h":"Мисалы: Учуп бара жатат. Сүйлөшүп турат. (Эмне кылып жатат?)"},{"t":"p","h":"Бир нече заттын учурдагы кыймыл-аракети учур чактын көптүк түрүн түшүндүрөт."},{"t":"p","h":"Мисалы: Учуп бара жатышат. Сүйлөшүп турушат. (Эмне кылып жатышат?)"}],"sub":[{"title":"19 ЖАШЫНДА БААТЫР БОЛГОН","b":13}],"pages":[115,116]},{"title":"§ 43. ЭТИШТИН КЕЛЕР ЧАГЫ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"117\">117<\/span>§ 43. ЭТИШТИН КЕЛЕР ЧАГЫ"},{"t":"p","h":"260-көнүгүү. Сүрөттү карап, ан

<title>Кыргыз адабияты 7</title>
<style>/* Mobile textbook reader. No external fonts or libraries: everything works offline. */
:root {
  --bg: #ffffff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3;
  --panel: #f6f6f6; --accent: #1f6feb; --accent-fg: #ffffff;
  --fs: 19px; --lh: 1.55;
  --font: Georgia, "Noto Serif", "DejaVu Serif", "Times New Roman", serif;
  --bar-h: 48px; --foot-h: 28px;
}
[data-theme="sepia"] { --bg: #f5ecd9; --fg: #4a3b2a; --muted: #8a7458; --line: #e0d2b4; --panel: #ece0c6; --accent: #9a5b13; }
[data-theme="dark"]  { --bg: #111315; --fg: #d8d8d8; --muted: #8c8c8c; --line: #2a2d31; --panel: #1b1e21; --accent: #6ea8ff; --accent-fg: #0b0b0b; }
[data-theme="contrast"] { --bg: #000000; --fg: #ffffff; --muted: #c8c8c8; --line: #444; --panel: #151515; --accent: #ffd400; --accent-fg: #000; }
[data-font="sans"] { --font: Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 16px/1.4 Roboto, "Noto Sans", Arial, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- Library ---------- */
.lib { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lib h1 { font-size: 22px; margin: 8px 0 4px; }
.lib .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.lib-head { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
.lib-head h1 { flex: 1; margin: 0; }
.school { display: flex; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.school button { flex: 1; min-height: 44px; padding: 0 10px; font-size: 15px; background: var(--panel); }
.school button + button { border-left: 1px solid var(--line); }
.school button.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.my-link { flex: 0 0 auto; font-weight: 600; min-height: 40px; padding: 0 12px; font-size: 14px; }
.grade { margin-bottom: 10px; }
.grade-h { display: flex; width: 100%; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 18px; font-weight: 600; text-align: left; }
.grade-h::after { content: '›'; font-size: 24px; color: var(--muted); margin-left: 10px; transition: transform .15s; }
.grade.open .grade-h::after { transform: rotate(90deg); }
.grade-h .n { margin-left: auto; font-size: 14px; font-weight: 400; color: var(--muted); }
.grade-b { padding: 0 2px; }
.grade-t { font-size: 20px; margin: 18px 0 0; }
.subj { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.bk { border-bottom: 1px solid var(--line); padding: 4px 0 12px; }
.bk:last-child { border-bottom: 0; }
.bk-t { font-size: 17px; font-weight: 600; }
.bk-s { font-size: 14px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bk-m { color: var(--muted); font-size: 13px; margin: 3px 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: .5; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.bk-h { display: flex; align-items: flex-start; gap: 4px; }
.bk-h .bk-t { flex: 1; padding-top: 10px; }
.bk .row { gap: 4px; }
.bk .row .btn { min-height: 40px; padding: 0 18px; font-size: 14px; margin-right: 8px; }
.bk .icon { color: var(--muted); flex: 0 0 auto; }
.bk .icon[disabled] { opacity: .5; }
.bk .icon.on { color: var(--accent); }
.bk .star.on svg { fill: currentColor; }
.bk .star.on { color: #e3a008; }
.share-opts { display: flex; flex-direction: column; gap: 10px; }
.share-opts .note { margin-top: 0; }
.sheet h3 .icon { flex: 0 0 auto; }

/* ---------- Reader ---------- */
.reader { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; user-select: text; }
.viewport { position: absolute; left: 0; right: 0; top: 0; bottom: var(--foot-h); overflow: hidden; }
.flow {
  height: 100%; column-fill: auto; padding: 20px 0 12px;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  will-change: transform; transform: translate3d(0,0,0);
  hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
}
.flow.anim { transition: transform .25s ease-out; }
.flow p { margin: 0 0 .15em; text-indent: 1.4em; text-align: left; }
.flow p.ni { text-indent: 0; }
.flow h1, .flow h2, .flow h3 { font-family: Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.25; break-after: avoid; page-break-after: avoid; }
.flow h1 { font-size: 1.35em; margin: .2em 0 .8em; text-align: center; }
.flow h2 { font-size: 1.15em; margin: 1.1em 0 .5em; }
.flow h3 { font-size: 1.0em; margin: 1em 0 .4em; }
.flow .verse { margin: .6em 0 .8em 1em; break-inside: auto; }
.flow .verse div { text-indent: -1em; padding-left: 1em; text-align: left; }
.flow .verse .gap { height: .7em; }
.flow figure { margin: .8em 0; text-align: center; break-inside: avoid; page-break-inside: avoid; }
.flow figure img { max-width: 100%; height: auto; border-radius: 4px; background: var(--panel); }
.flow figcaption { font-size: .8em; color: var(--muted); margin-top: .3em; }
.flow .box { border-left: 3px solid var(--accent); padding: .1em 0 .1em .7em; margin: .7em 0; }
.flow .pg { font: 11px/1 Roboto, Arial, sans-serif; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 4px; margin: 0 3px; vertical-align: 2px; text-indent: 0; white-space: nowrap; user-select: none; }
.flow .end { height: 1px; }
.flow .endnote { text-align: center; color: var(--muted); font-size: .8em; margin-top: 2em; font-family: Roboto, Arial, sans-serif; }
[data-theme="dark"] .flow img, [data-theme="contrast"] .flow img { filter: brightness(.9); }

.foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot-h); display: flex; align-items: center;
  justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.foot .t { overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }

.bar { position: absolute; left: 0; right: 0; background: var(--panel); border-color: var(--line); z-index: 5;
  transition: transform .2s; display: flex; align-items: center; }
.bar.top { top: 0; height: var(--bar-h); border-bottom: 1px solid var(--line); transform: translateY(-100%); padding: 0 4px; }
.bar.bottom { bottom: 0; border-top: 1px solid var(--line); transform: translateY(100%); padding: 10px 16px 14px; flex-direction: column; align-items: stretch; gap: 6px; }
.reader.ui .bar { transform: none; }
.bar .title { flex: 1; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.bar .info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* ---------- Sheets (TOC, settings) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85%; overflow: auto; background: var(--bg);
  border-radius: 16px 16px 0 0; z-index: 11; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
.sheet h3 { margin: 10px 0 12px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.toc a { display: block; padding: 11px 4px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 15px; }
.toc a.sub { padding-left: 20px; font-size: 14px; color: var(--muted); }
.toc a.cur { color: var(--accent); font-weight: 600; }
.set { margin: 14px 0; }
.set label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; }
.seg button.on { border: 2px solid var(--accent); font-weight: 600; }
.swatch[data-v="light"] { background: #fff; color: #1b1b1b; }
.swatch[data-v="sepia"] { background: #f5ecd9; color: #4a3b2a; }
.swatch[data-v="dark"] { background: #111315; color: #d8d8d8; }
.swatch[data-v="contrast"] { background: #000; color: var(--accent-fg); }
.goto { display: flex; gap: 8px; }
.goto input { flex: 1; min-height: 44px; font-size: 16px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px;
  border-radius: 20px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Textbook elements produced by tools/convert_pdf.py ---------- */
.flow .tasks, .flow .gloss { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45;
  background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0; }
.flow .tasks p, .flow .gloss p { margin: 0 0 .35em; text-align: left; }
.flow .gloss { border-left: 3px solid var(--accent); }
.flow p.note { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; font-style: italic; text-indent: 0; margin: .6em 0; }
.flow p.attr { text-align: right; text-indent: 0; font-style: italic; color: var(--muted); margin: .1em 0 .8em; }
.flow p.sep { text-align: center; text-indent: 0; color: var(--muted); margin: .5em 0; letter-spacing: .3em; }
.flow h2 .pg, .flow h3 .pg { font-weight: normal; }
.toc .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 4px 2px; }
.toc a .p { float: right; color: var(--muted); font-size: 13px; margin-left: 8px; }

/* ---------- Elements produced by tools/convert_layout.py (typeset textbooks) ---------- */
.flow figure img { cursor: zoom-in; }
.flow h4.mk { font: 700 .78em/1.3 Roboto, "Noto Sans", Arial, sans-serif; letter-spacing: .05em; color: var(--accent);
  margin: 1em 0 .3em; break-after: avoid; page-break-after: avoid; }
.flow p.hl { color: var(--accent); text-indent: 0; }
.flow p.small { font-size: .82em; text-indent: 0; color: var(--muted); }
.flow sup, .flow sub { font-size: .7em; line-height: 0; }
.flow .kbox { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45; background: var(--panel);
  border-radius: 8px; padding: .45em .7em; margin: .5em 0; border-left: 3px solid var(--accent); }
.flow .kbox > b { display: block; }
.flow .frame { background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0;
  font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; line-height: 1.45; }
.flow .frame p { text-indent: 0; margin: 0 0 .35em; text-align: left; }
.flow .tbl { margin: .8em 0; font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .8em; line-height: 1.35; }
.flow .tbl .tt { font-weight: 600; text-indent: 0; text-align: center; margin-bottom: .3em; }
.flow .tbl table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.flow .tbl th, .flow .tbl td { border: 1px solid var(--line); padding: .3em .35em; vertical-align: top; text-align: left; overflow-wrap: anywhere; hyphens: auto; }
.flow .tbl th { background: var(--panel); }
.flow .tbl tr { break-inside: avoid; page-break-inside: avoid; }

.zoom { position: fixed; inset: 0; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; background: rgba(0,0,0,.92); z-index: 30; }
.zoom-in { position: absolute; inset: 0; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
.zoom-in img { margin: auto; flex: none; touch-action: pan-x pan-y; object-fit: contain; background: #fff; cursor: zoom-in; }
.zoom-x { position: absolute; top: 8px; right: 8px; color: #fff; background: rgba(0,0,0,.5); z-index: 31; }
.flow h4.sh { font: 700 .95em/1.3 Roboto, "Noto Sans", Arial, sans-serif; text-align: center; margin: .8em 0 .4em; break-after: avoid; page-break-after: avoid; }

/* maths books */
.flow h4.ex, .flow h4.try { font-family: Roboto, Arial, sans-serif; margin: 1.1em 0 .3em; font-size: 1em; }
.flow h4.ex { display: inline-block; background: #f7e400; color: #111; padding: .1em .6em; border-radius: 3px; }
.flow h4.try { color: var(--accent); }
.flow p.goal { font-size: .85em; text-indent: 0; background: var(--panel); border-radius: 8px; padding: .4em .7em; }
.flow b.bd { display: inline-block; text-indent: 0; padding: 0 .4em; border-radius: 1em; background: var(--fg); color: var(--bg);
  font: bold .8em/1.45 Roboto, Arial, sans-serif; margin-right: .2em; }
.flow b.nb { display: inline-block; text-indent: 0; min-width: 1.4em; border-radius: 4px; background: var(--accent); color: var(--accent-fg);
  text-align: center; font-size: .8em; margin-right: .3em; }
.flow .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.15; margin: 0 .1em; }
.flow .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .15em; }
.flow p.ml { text-indent: 0; padding-left: 1em; }
.flow p.side { font-size: .85em; }
.flow details.ans { margin: .3em 0 .8em; font-size: .9em; }
.flow details.ans summary { color: var(--accent); cursor: pointer; font-family: Roboto, Arial, sans-serif; }

/* wide tables become one card per row on phones */
@media (max-width: 560px) {
  .flow .tbl.cards table, .flow .tbl.cards tbody, .flow .tbl.cards tr, .flow .tbl.cards td { display: block; width: auto; }
  .flow .tbl.cards tr:first-child { display: none; }
  .flow .tbl.cards tr { border: 1px solid var(--line); border-radius: 8px; margin: .5em 0; padding: .3em .5em; }
  .flow .tbl.cards td { border: 0; padding: .15em 0; }
  .flow .tbl.cards td::before { content: attr(data-l); display: block; font: 600 .75em/1.3 Roboto, Arial, sans-serif; color: var(--muted); }
  .flow .tbl.cards td:first-child { font-weight: 600; }
}
.flow figure.vec svg { max-width: 100%; height: auto; display: inline-block; background: #fff; border-radius: 4px; cursor: zoom-in; }
[data-theme="dark"] .flow figure.vec svg, [data-theme="contrast"] .flow figure.vec svg { filter: brightness(.9); }
.flow .rt { border-top: 1px solid currentColor; padding-top: 1px; margin-left: 1px; }
.flow .it { display: inline-block; max-width: 100%; margin-right: .9em; text-indent: 0; }
</style>

","амач – буурсун; соха и рукоятка сохи","","сулу – овёс: нокот – горох, таруу – пшено","конок – просо; зыгыр – лён","жүгөрү – кукуруза","","сарымсак – чеснок"]},{"t":"p","h":"кыялдары – мечты (5-класс 6-бетте; Кыргыз элдик оозеки чыгармачылыгынан: Эл өздөрүнүн айлана-чөйрөгө, жаратылышка, коомго болгон көз караштарын, мамилелерин, ойлорун. кыилларын мына ушул оозеки чыгармалар аркылуу билдирген.)"},{"t":"p","h":"табышмактар – загадки (5-класс 19-бетте; «Табышмакгар:» Кыргыз элдик оозеки чыгармачылыгындагы кенири тараган жанрлардын бирин – табышмактар. Алар кара сөз же ыр түрүндө болот.)"},{"t":"p","h":"жаңылмачтар – скороговорки (5-класс 21-бетте. Жаңылмачтар двроо айтууга бир топ оордук келтирген сөз тизмектеринен турат.)"},{"t":"p","h":"санжыргалуу сөз берметтери – жемчужины слов, мудрые. красивые изречения (6-класс 6-бетте, Көркөм адабият жонүндө түшүнүк: Ар бир тилде жаткан санжыргалуу сөз берметтери. образдуу сөз гүлдөрү. накыл кептер, учкул сөздөр ж. б. көркөм адабияттын үлгүлөрү аркылуу «кыймылга келет».)"},{"t":"p","h":"АСЦ (Г Жарама зан айтуу салты женунде г "},{"t":"p","h":"Орто Азия элдеринин ичинде кыргыздарда гана жамактатып ырдоо өнөрү (умение, ремесло, искусство) – жарамазан айтуу кездешет."},{"t":"p","h":"Жарамазан айтуу рамазан айында, башкача айтканда орозо айында тана болот. Ислам дининдеги өлкөлөрдө орозо кармаган айды Рамазан айы деп коюшат. Ошол Рамазан айынын аталышынан (от названия) улам жарамазан деген сөз келип чыккан. Бирок, ислам дининдеги элдерден бир гана кыргыздарда, анан Кыргызстанга чектеш (рядом, через границу) жашаган казак урууларында гана жарамазан айтуу салты бар. Жарамазан айтуу – кыргыз элинин нукура (настоящий) улуттук салт ыры, анын <span class=\"pg\" data-n=\"5\">5<\/span>ичинен үрп-адат ыры десек болот. Орозодо элибиздин КайрымдуудуГУ (благотворительность), боорукердиги (доброта) камтылган (содержится) ата салты айт майрамы болот. Айттап келген ар бир адамды жылуу тосуп алып. ыраазычылыгын (благодарность) алуу адатка айланган. Жарамазан айткандар эки-үчтөн жүрүшкөн. Алар үймө-үй, айылмапйыл кыдырышкан. Максаты – тамак-аш, буюм, мал ж. б. өндүрүү (собирать) үчүн үй ээсинин ата-тек, кадыр-баркьшщ (уважение, почёт). уулкыздарын, дүйнө-чарбасын мактоо. Ошондой эле ага жана үй-бүлөсүнө амандык, байлык, өмүр, бакыт каалоо менен орозонун кабыл болушуна карата жакшы ой-тилектерин (пожелания, чаяния) билдиришкен. Жарамазан ырлары хомуздун коштоосу менен да, комузу жок да аткарылып, өзүнчө обонго ээ."},{"t":"v","l":["Жаңы сөзлер:","жамактатып ырдоо – импровизировать","ата салты – традиция отцов, предков","үймө-үй, айылма-айыл кылырышкаи – ходили по домам, айылам","ита-тек – предки","комуздун кошзоосу менен – под сопровождением Р"]}],"sub":[],"pages":[5,5]},{"title":"© Жарамазан","blocks":[{"t":"h3","h":"© Жарамазан"},{"t":"v","l":["Ассаломалейкум жарамазан,","Он эки айда бир келген орозо жан.","Уктап жаткан балдарга умай салам,","Кулак каккан жандарга дубай салам!","Орозого союлган кара борук,","Аталардан калыптыр ушул жорук.","Жарамазан айтып келдик эшигинс.","Ак кочкордой уул берсин бешигиңе.","Баатыр чыкса кантесиң насибиңс,","Байланыштуу бардыгы таазимиңес.","Айлыңды каптасын ак маараке.","Ар күн сайын той болсун жешине.","Адыр-адыр тоолордон,","Аргымак минип биз келдик,","Аргымак башын тарталбай,","Ушул үйгө туш келдик.","Ак пейилден чыкканбыз,","Адырларга букканбыз.","Адыр мүнөз аксмди","Ачык кол дсп укканбыз.","Бычак учу жылтырайт,","Май томуруп жатабы.","умай – сказочная птица, якобы","гнездится в воздухе"]},{"t":"p","h":"дубай – молитаословис с пожс-"},{"t":"v","l":["даниями благополучия","борук – двухлетний валух","жорук – поведение, поступок","","насип – то, что предопределено","судьбой","таазим – поклон","маараке – пиршество со","состязаниями","адыр-адыр – холмы","","ак пейилден – ог души","","ачык кол – открытый, щедрый"]},{"t":"p","h":"<span class=\"pg\" data-n=\"6\">6<\/span>Казан-аяк калдырайт, калдырайт – гремит, грохочет Курут эзип жатабы, Пейлин менен алып чык."},{"t":"p","h":"ак бата – благословение Берели ак батаны."},{"t":"p","h":"Жарамазанда ыр түрүндөгү жакшы каалоолор айтылат. Жаш балдар кечкисин ээрчишип, айыл кыдырышып, жамактатып ырдап, өзлөрү кошкон тамашалуу (сатирический) жарамазанды айтышат."},{"t":"v","l":["Жоолук берсең албаймын,","Келин болуп калбаймын","Калпак берсең албаймын,","Күйөө болуп калбаймын.","Акча берсең аламын,","Ак чөнтөккө саламын.","Тыйын берсең аламын,","Төш чөнтөккө саламын...","Ушул үйдүн түндүгү кайың бекен?","Бизге берер жоолугу дайын бекен?","Ушул уйдун тундугу арча бекен?","Бизге берер жоолугу барча бекен?","Жарамазан айткандын жайы бардыр?","Жайып алган куруггун маны бардыр?","Бул пейлиңдин барында,","Бир жакшылык көрөсүң.","Келерки ушул маалда,","Келиниң эркек төрөсүн!","Кызын мончоктуу болсун,","Уулуң син чакты болсун.","Жылкыларың күтүрөп,","Жылганы бербей бойлосун.","Демиңиз бийик тоо болсун,","Дениңиз дайым соо болсун!","Оомийин!!!","","Тааныш созлер:","дайын – готовый","","барча – парча","","мончоктуу – с бусами","он чакты – около десяти","","жылга – ложе ручья, впадина","бойлосуи басположится"]},{"t":"p","h":"салт – традиция (5-класс 27-бетте; «Акындар ноэзнясынан:» Акындврлын чыгармачылыгынын өнүгүшүндө устаттык жана шакнрттик салт көрүнүктүү роль ойногон.) бешик – колыбель (5-класс 71-бетте: Айтматовдун «Бугу эне» алабий жомогунан: Анан манкайган Мүйүздүү Бугу-Эне жетип келди. Куру келбей, он сегиз айры мүйүзүнө бешик илип келди."},{"t":"p","h":"5-класс 86-бетте; Шүкүрбек Бейшеналисалин «Мүйүзлүү козу» аңгемесинен: Ат аны (Азизди) бешнктей термеп, канаттуу чымчыктай абада калкытып жүрөт.) аргымак – тулпар, скакун (6-класс 69-бетте; Жеңижоктун «Айгамын санат тобуңа»"},{"t":"v","l":["<span class=\"pg\" data-n=\"7\">7<\/span>Аргымак лттай не пайда,","Айыгышкан топко кирбесс.","Акында б‹ касиет.","Айтышкандадн сүрдөсө.)","","Тапшырмалар.","1. Элдик оозеки чыгармаларда эмнелер жөнүндө баяндалат?","2. Жамактатып ырдоо өнөрү кайсы элге тисшелуу көрүнүш?","3. Жарамазан ыры эмнс үчүн он эки айда бир айтылган?"]},{"t":"p","h":"4. Жарамазанды мурда кандай максат менсн айтышкан? Азыркы мезгилде жарамалан"},{"t":"p","h":"ыры аткарылып жүрөбү”"},{"t":"p","h":"Узунлу жаттап. корком аткарып бергиле."},{"t":"p","h":"Тү О{ЩЭлдик эпостор жөнүндө"},{"t":"p","h":"а «Эпос» деген сөз грек тилинде «сүйлөө, аңгеме, баян» дегенди билдирет. Элдик эпостор деп байыркы заманда элдин же бир уруунун турмушу үчүн маанилүү болгон окуя жөнүндөгү турмуштук аңгеме түрүндө жаралган эпикалык поэзияны айтабыз. Элдик эпостун негизин баатырлыкты көркөмдөп ырга салуу (художественно слагать в песни) түзөт. Эпостогу каарман – элдин өкүлү (представитель). Ошондуктан ал каарман – чыныгы баатыр, элдин иегизги тарыхый умтулуусунун (стремление) күзгүсү. Эпостун башкы каарманы сөзсүз түрдө үлгү болорлук мыкты сапаттарга ээ. Деги эле элдик эпостордо кармаштарда сыналган (испытанный в сражениях) эр жүрөк, шамдагай жоокер бардык жагынан идеалдуу. Анткени, бул эпосторду жараткан учурдун жана турмуштун талабы ушундай."},{"t":"p","h":"Элдик эпостор көп кылымдар бою эл оозунда оозеки сакталып келген. Эпосторду айткан дастанчылардын, акындардын таланты, фантазиясы өтө жогору болуп, угуучуларды өзүнө тартып турган. Сүрөттөлгөн окуялар менен образдар туруктуу мүнөздө (устойчивый характер) болгон. Эпостор төкмө акындар же атайын айтуучулар тарабынан элге жетип турган. Ар бир акын, манасчы айтып жаткан эпоско өз мүмкүнчүлүгүнө жараша кошумчаларын кошуп, өз вариантын жарата алган. Ошентип, бир эле эпос бир нече вариантта айтылган."},{"t":"p","h":"Эпостор көлөмү жагынан ири, кенже болуп экиге бөлүнөт. Идеясына, окуялардын мүнөзүнө жараша баатырдык жана турмуштук эпос болуп бөлүнөт."},{"t":"p","h":"Ири эпосторго «Манас», «Семетей», «Сейтек» эпостору кирет. Ал эми кенже эпосторго «Эр Төштүк», «Кожожаш», «Жаңыл Мырза», «Курманбек» ж. б. ушул сыяктуу эпостор кирет."},{"t":"p","h":"Баатырдык эпостордун мазмунун башкы каармандардын сырттан келген баскынчыларга жана ички душмандарга каршы (против внутренних врагов) күрөшү түзөт да, элдик баатырдын айланасына элдик идеалдагы бүтүндөй оң сапаттардын баары топтолот. Буларга мисал кел- <span class=\"pg\" data-n=\"8\">8<\/span>* ш ме: жактары – эркин сүйүүгө Умтулуусу, эски салтка каршы турмуштук кубулуштар негизги орунду ээлейт. Эл турму-"},{"t":"p","h":"Уж. ©. ар түрдүү кырдаалдардагы жашоо-тиричиликке байланышкан куялары суреттолет. Аларга «Саринжи-Бөкөй», «Кедейкан», «Кожожаш»,"},{"t":"p","h":"Жаңы созлер:"},{"t":"p","h":"негиз – основа"},{"t":"raw","h":"<h4 class=\"mk\">Мегизги – основной талап – требование көлөм – объём Тапшырмалар.<\/h4>"},{"t":"v","l":["ири – крупный","баскынчы – захватчик","кенже – малый","кубулуш -","баатырдык – героический ээлейт – занимает","турмуштук – бытовой","","1. Эпос деген сөз эмнени билдирет?","2. Каңдай чыгарма элдик эпос деп аталат?","3. Эпостор Көлөмү жагымаи кандай бөлүнөт?","","үчүн, ду шмандарга 93 кезегинде (своевреме, ременно) сокку 5) ‚ Жом ж","Тырдык, эли-жерин сүйүү ето кадырланат."]},{"t":"p","h":"Жомокто адамгерчилик (гуманность), адилеттик көрүнүктүү орунранды <span class=\"pg\" data-n=\"9\">9<\/span>болбостугу үчүн Манас. Чубак өңдүү тайбас баатырлар, жеңишке ишенимдүү, достукка чын берилгендик, Бакай. Кошойдой кыраакы, акылман, адилет болуу керектигин далилдейт,"},{"t":"raw","h":"<div class=\"gloss\"><p>Я<\/p><\/div>"},{"t":"v","l":["Жаңы саздар:","чабылып-чачылган – будучи","разгромленным, рассенться","уруу – племя","сокку уруу – дать отпор","согушка катышы жок – не","участвующие на войне","кыраакы – дальновидный, прозорливый","адилет – справедливый","иш билги – деятельный","коз каранды болбостугу – быть","независимым","тайбас – дерткий, беззастенчивый"]}],"sub":[],"pages":[6,9]},{"title":"«Манас» эпосунун кыскача мазмуну","blocks":[{"t":"h3","h":"«Манас» эпосунун кыскача мазмуну"},{"t":"p","h":"«Манас» эпосу байыркы кыргыз элинин кылымдардан бери келаткан турмушун, өз эркиндиги учун жүргүзгөн күрөшүн көркөм жалпылаган бирдиктүү сюжеттерден куралган. Айрым окуялардын өөрчүшү, кээ бир образдардын чечилиши «Манас» эпосунан кийин «Семетей» жана «Сейтек» эпосторунда бири-бирин тереңдетип, толуктап турушат. Ак ниет адамдардын ортосундагы мамилелер, сезимдер, баскынчыларга каршы күрөштөгү патриотизм «Кыргыздардын Алтайдан көчүп келиши» окуясынан баштап эле улам өсүп отурат. «Манас» эпосу баатырдык духка, патриоттук демилгеге бүт толгон."},{"t":"p","h":"«Манас» эпосу салт боюнча (по традиции) баатырдын жети атасын санап корсетуудеи башталат. Манастын чоң атасы Карахан өлгөндөн кийин Молто, Алооке баш болгон душмандар кыргыздарды басып алып (захватив силой), катуу эзип. көп кордуктарды көрсөтүп, туш-тушка таратат."},{"t":"p","h":"Карахаидын сегиз уулунун эң кенжеси Жакып да кырк үйлүү кишилери менсн кошо Алтайга айдалат. Жакып аябай байыйт, бирок көпкө чейин балалуу болбойт. Зарыгып жүрүп акыры уулдуу болуп, чоң той берет. Баланын аты Манас коюлат. Жаш Манас калмактардын көптөгөн балбандарын жеңет. Акбалтадан алыстагы кыргыз элин угуп, Кошойго Ат-Башыдан жолугат. Кошойдун сунушу боюнча Манас элин алып, Ала-Тоого көчүп келмей болот, Манас Алайга келип, катуу урушка туш болуп, Нескара, Толтойлор менен согушат. Көп колу менен келген Кошой Манасты куткарат. Манас айылы мснен Таласка көчөт. Өзүнө ылайык жолдош ат издеп жүргөн Манаска нойгуттардын ханы Карача Аккула атын тартуу (подношение, подарок) кылат. Бара-бара Манастын атагы артып, ар жактан келип кошулган баатырлардан кырк чоро (сорок чоро; так трафаретно именуется в эпосе совокупность ближайших соратников главного эпического богатыря: поимённое упоминание их больше двенадцати не насчитывает) курулат. Элге кордук көргөзгөн Алооксге каршы аттанып. Манас аны жеңет. Кошойдун сунушу боюнча Манасты хан көтөрүшөт. Андан ары Чубактын окуясы, Манастын Каныкейге үйлөнүшү, душманды жеңүүгө байланышкан көптөгөн"},{"t":"img","src":"data:image/webp;base64,UklGRpqvAABXRUJQVlA4II6vAACQtQSdASqAAuYDPrFMoEmnJKoortTsSUAWCWlttpj0x8fQo0RnMkB1NyiM/drPwBjx2Cn736g3G3zVPR6pD/9fl++1sehwT//psv2YG7/n9/jf4X5PfkHYD2wPf//hc/+Jx5  эки чоросу окко учат: Сыргак, Серек, Алмамбет, Чубак, Музбурчак, Көкчө, Акжолтой, Акаяр, Балчоро, Байчоро, Бокмурун, Каратөлөк. Аккулага ок тийип. Манас жөө калат. Коңурбай (Манастын өлүмүнө себепкер) аңдып келип Манасты экинчи жолу жарадар кылат. Кабылдап кеткен жараттан Манас өлүп, Каныксй күмбөз салдырат."},{"t":"p","h":"«Манас» эпосунун экинчи бөлүгү «Семетей» өтө кайгылуу башталат. Манастын сөөгүн койгондон кийин кырк күн өтпөй Манастын аталаш иниси Көбөш Каныкейге үйлөнмөк болот. Ага Каныкей макул болбойт. Семетейди өлтүрмөк болушканда уулун көтөрүп, Чыйырдыны ээрчитип атасынын шаарын көздөй, Бухарга качат. Ал жерге барганда, атасы Темиркан Каныксйге үй-жай, мал бөлүп берет. Семетейди таякеси Ысмайыл багып алып. жетиге чыкканда окутат."},{"t":"p","h":"Темиркан той берип, Семетейди кан көтөрөт, Тойдогу күрөштө Семетей Төө балбандын колун сууруп өлтүрөт. Каныкей: «Семетей келечекте эр болуп, Манастын ордун басар бекен?» деген үмүт менен алтымыш асый Тайторуну төлгө кыдьщ (загадав на счастье) чабат. Семетей ошо кезге чейин Каныкей өз энеси экенин биле элек болучу. Ал жесир эжесине боору ооруп, Тайторуну сүрөшүп (тянуть; скаковую лошадь, помогая ей дойти до финиша, если она выбивается из сил; это не лишало лошадь приза) чыгарып алат. Семетей он экиге келгенде токойдогу көмүрчү Сарытаздан атасы ким экендигин билип, элин издеп, Таласка келип, Бакай менен көрүшөт. Таятасынан ыпаазычылык алый (получив благословение), Таласка көчүп келип, атасынын ордун басып, элине ээ болот. Кастык (враждебность; злой умысел; заговор) кылган душмандарды өлтүрөт. «Сейтек» – «Манасты» бардык жагынан жыйынтыктаган жана корутундулаган (заключительный) бөлүгү."},{"t":"p","h":"Семстей өлгөндөн кийин, жапалар болгон (раненного) Күлчорону Кыяз менен Канчоро колго тушуоуп (взяли в плен), далысын кесип, «отун алдырып, суу ташыт» деп, жылкычы башы Карагулга берег. Семетейдин ордосу (ханская ставка. ханский дворец. ханская юрта) таланат, улуу зайыбы Чачыкейди Канчоро алып, Таласка кан болот, Бакайды тирүүлөй улак кылып тарттырып, аябай көп кордук көрсөтөт. Каныкей музоо кайтарат, Күлчоронун аялы Акбала отун алып, күл чыгарат. Айчүрөктү Кыяз олжолоп алат (взял как добычу)."},{"t":"p","h":"Он эки ай дегенде, Айчүрөк Сейтекти төрөйт. Сейтек төрөлгөндө, Кыяз канчалык кааласа да. Айчүрөктөн коркконунан баланы өлтүрө албайт. Баланын бешик тоюнла (пир, устраивиемый по случаю рождения ребёнка на пятый, шестой день после рождения) бир дубана келип, «бул баланын аты Семетейдин уулу Сейтек болсун!» – деп, ат коюп, көздөн кайым болот."},{"t":"p","h":"Сейтекти Айчүрөк эч кимдин колун да, тилин да тийгизбей, темир үйдө багып чоңойтот. Анын баатырдыгы, балбандыгы кадим Семетейдин өзүндөй болот. Сейтек он эки жашка келгенчс эч кимден атасы Семстей жөнүндө көп укпайт. Бир күнү күш садыш (охотиться с ловчей птицей."},{"t":"p","h":"<span class=\"pg\" data-n=\"12\">12<\/span>но не с беркутом) чыкса, талаадан Кара лоо (Семетейдин досу) кезигип, Сейтсккс атасынын жайын айтат."},{"t":"p","h":"Кыяз Күлчоронун колунан өлүм табат, анын ордуна жедигер элине Кара дөөнү кан көтөрүп. Күлчоро, Айчүрөк, Сейтек Таласка көчүшөт. Таласка көчүп баргандан кийин Айчүрөк Канчорону, Каныкей Чачыкейди өлтүрүп, өчтөрүн алышат. Чон той бернп, Сейтек Таласка кан болот."},{"t":"p","h":"Бир күнү Кара дөө ан уулап жүрүп, Семетейди көрүп калат. Күлчоро аны аңдып жүрүп (выследил), кармап алат. Каныкейдин эмчегин эмгенден кийин Семетейдин көзү көрүп, кулагы угат. Элине келип Бакай, Айчүрөк жалгыз баласы Сейтек менен көрүшүп, жыргап жатып калат. Душмандарын бүт жеңип, элин Сейтекке тапшырып, Бакай, Каныксй, Семетей, Айчүрөк, Күлчоро бешөө «эми адамга кошулбайбыз, биздин күнүбүз бүттү» – деп, кайын болуп кетишет."},{"t":"v","l":["Жаңы сөздөр:","зарыгып жүрүп – долго ждал","элге кордук көргөзгөн – унижал народ","окко учат – погибает","себепксер – явился причиной, виновник","кабылдап кеткен жарадан – от осложнившегося ранения;","күмбөз – купол, над могильное сооружение. надгробие, мавзолей","жесир —","жылкычы ,"Алооксни чабам деп,","Арстан Манас баатыры.","Айбатын салып акыры,","Астыңкы ээрди албайып,","Үстүңкү ээрди далбайып,","Ал муруту сеңирдей,","албарс темирдей,","Муруну тоонун кырдачтай,","Муруту чөлдүн камыштай,","Көзү көлдүн буткулдай,","Каарданып караса,","_Көрүнгөндү жуткандай.","Ал мүнөзүн караса,","Ажыдаар болсо туткандай.","Алтын менен күмүштүн,","Ширөөсүнөн бүткөндөй,","Асман менен жеринднн,","Тирөөсүнөн бүткөндөй.","Айың менен күнүңдүн,","Бир өзүнөн бүткөндөй.","Алды калын кара жер,","Жердигинен түткөндөй!","Ай алдында дайранын,","Толкунунан бүткөндөй.","Абадагы булуттун,","Салкынынан бүткөндөй,","Асмандагы ай-күндүн,","Жаркынынан бүткөндөй.","","«з Үзүндүнү жаттагыла.","алла твала – всевышний, бог","","айбат – суровость. грозный вид","","сенир – покрытый травой высокий гребень горы","","көзү көлдүн буткулдай – глазные орбиты (веки)","его подобны глубоким впадинам","каардан – приходить в ярость","","алтын мсиси күмүштүн","шировсүнөн бүткөндөй – он создан как бы из","золотой и серебряной пыли","тирөө – подпоркя. опора","","жердик – мощь, непоколебимая сила","","асмандагы ай-күндүн,","жаркынынан бүткөндөй – он создан как бы","из кияния луны и солнца. что на небес"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"14\">14<\/span>АДАБИЯТ ТЕОРИЯСЫНАН"},{"t":"p","h":"Эпитет (гр. – түшүндүрүү) – окуянын, кубулуштун мүнөздүү бөтөнчөлүктөрүн көрсөтүп берүүчү түрү. Мындай сөздөр (эпитеттер) буюмдун же окуя-кубулуштун сапатын, башкалардан айырмалуу касиетин индивидуалдаштырат, речти көркөмдөөгө жардам берет. Эпитеттер сөзсүз түрдө кайсы бир сөздү же сөз айкашын жандап келет. Алар зат атооч. сын атооч, сан атооч жана башка сөз түркүмдөрүнөн түзүлөт."},{"t":"p","h":"Мисалы: Арстан Манас. «Арстан» деген эпитет «Манас» деген сөздүн негизги белгисин көрсөтүп, өтмө мааниде колдонулган."},{"t":"p","h":"Салыштыруу – троптун речте (ар кандай түрүндө) колдөнула берүүчү жөнөкөй түрү. Кандайдыр бир нерсени, көрүнүштү толук жана конкреттүү көрсөтүп берүү үчүн биз аны башка нерсе, көрүнүш менен окшоштурабыз, алардын жалпы белгилерин, окшош жактарын көрө билип, салыштырабыз."},{"t":"p","h":"Мисалы:"},{"t":"v","l":["Айбаты албарс темирдей.","Муруну тоонун кырдачтай,","Муруту чөлдүн камыштай ж. у. с."]}],"sub":[],"pages":[14,14]},{"title":"«Кожожаш» эпосунун мазмуну","blocks":[{"t":"h3","h":"«Кожожаш» эпосунун мазмуну"},{"t":"p","h":"(Алымкул Үсөнбаевдин айтуусу боюнча) «Кожожаш» – кыргыз эл эпосу. Аны айрым нзилдөөчүлөр баатырдык эпоско кошсо, кээ бири турмуштук эпос деп эсептешет,"},{"t":"p","h":"Кыргыздын кытай уруусунда, Таластын Күркүрөө деген жеринде Карып деген кишинин Кожожаш деген жалгыз уулу болуптур. Кожожаш кичинесинен эле чырпыктан жаа жасап, чийден ок жасап, мылтык менен алышып чоңойгон экен. 15-16 жашынан атканын жаза кегирбеген (стреляет без промаха, не прамахивиющийся) мыкты мерген болуп чыгат. Алайлындагы жыйырма тутун элин (племя из двадцати семей) мергенчилик менен бакчу экен."},{"t":"v","l":["Мергендиги ашынган,","Карыптын жалгыз баласы.","Айлына турбайт күнүгө,","Жүргөнү тоонун арасы,","Күнүгө кийик этин жеп,","Элинин тынган санаасы."]},{"t":"p","h":"Аска таштарда түнөп, кийиктин терисин кийип, жүздөгөн кийнктнн бирин койбой терип, бир элди баккан азамат жигит жөнүндө, анын адис болгон мерген экендигин баяндаган «Бет ачар» (Кириш сөз) менен эпос башталат."},{"t":"img","src":"data:image/webp;base64,UklGRmAqAABXRUJQVlA4IFQqAACQOQGdASqAAksBPrVUpUsnJSevKVQbQeAWiWlujwMMyMHfIzFGNrv/pPB9Ow4bHrLT578iix7cn3j3YXaBhNfL//5xfzjbcnkQ/7et/57/+vY+/fP149Rg6Z/8+BH/6TCExt1AjY5vbvbVpFU46DlSkbvoqnKlOVJu70LV7SStQh3AWKUWKrE1p7ICsm/fUOSmZCKpIpjgSYZEAcUxL/SNFDTfDMSIuWXrnjXXzZQpPD5HDbn8V6+x382v9t7rr5eruMWBe7fwOlxmNJTV+2rMS7VoTuk8ZPMuS0txE/2407DuRCwABsSZmJgLdmE7lfwkZmw7q76ADsNM86hBPyacdqJoI1UYuYyTQg2317g0mrDaNbXs6x5nKpz7wuitBkLVRG/EUAVtbajd7qSMqoyqrt9xevpi4Zhm0jZoJeUZ86znjDKh4cueZIyD1TMG7ap+FFBW9AHG8+17Qu60RtlX43bgrUEo+50pBD+d24yLgnD6h1ElPL5L9RpvPPyM6I64NjwL+BWF4Aa22D0W476i/KWc06W9cmy/IMkMiqAaKkaSmhZU+4UI+riWvVwjcuWf6Oh8No9BbicE8oZadubc0fNnN1Rhl9FZ1ggpvL элге кабар салып, эл чогултуп төй бернп, эр сынамак болот. Каракожонун кызы Зулайка жигиттен жигит тандап, өзүнө тең болор жар (супруг) издейт. Уккан элдин баары Каракожонун шаарына жөнөшөт. Ал учурда Кожожаш адатынча мергенчиликке кеткен экен. Тойго келген элдин баарын чубатып сынактан өткөрүп, мунаранын башынан карап турган Зулайка бир да жигитти жактырбайт. «Келбеген ким калды?» деген Зулайканын сурөосуна Кожожаштын эли өз мергенн жөнүндө айтышат."},{"t":"p","h":"Алты сайлуу ак бараң, ак баран – пистонное ружьё Айлында бир күн жатпаган,"},{"t":"v","l":["Ак бараңдай мылтыкты,","Кара жонун ойдуруп,","Кызыл алтын чаптаган, -"]},{"t":"p","h":"Кожожаш деген жигит бар экенин уккан Зулайка «Кожожаш мергенчиликтен кайтканда мага келсин» – деп айттырат. Кытай уруусу оз жерине кайтып келип, Кожожаш мергенчиликтен келгенде. Каракожонун кызы Зулайкага барып келүүгө жөнөтүшөт. Кожожаш мергенчиликтен келген кийимин, бутундагы чарыгын (поршни – обувь из сыромятной кожи с толстой подошвой) чечпси, Каракожонун шаарына барат, Зулайканын аны күтүп атайын тиктирген өргөөсүнө (свадебная юрта) кирип отурат, Зулайка өргөөгө кирип Кожожашты көргөндө эле жактырып калат."},{"t":"p","h":"«Кожожаштын Зулайкага үйлөнүүсү» деген бөлүмдө Каракожо жети күн, жети түн той берип, Кожожаш ата-энесин. элин чакыртып, Зулайкага үйлөнөт (женится). Той убагында жамбы атуу (стрелять из лука, а позднее из ружья, состязались в сбивинии слитка серебра, подвязанного на высоте на тонкой нитке) оюну ойнолот. Мелдештин шаргы боюнча жамбыны бутага (мишень. цель) байлаган ичке боосун (веревка. завязка, шнурок) <span class=\"pg\" data-n=\"16\">16<\/span>үзө коюп атуу керек. Жигиттерден эч ким тийгизе албай убара болот. Мелдешип жаткандардан алыс, Каракожо менен Зулайканын жанында отурган жерден Кожожаш мерген мылтыгын октоп, жамбынын кылдай ичке жибнн (тонкую как волосок нитку) как жара атып (выстрелил разорвав попалам), жамбыны жерге тушурет. Кожожаштын мергендиги тойго келгендерге, анан бут элге тарап, атагы (слава) алыска кетет. Карыпбай уулкелннин алып, көч ээрчитип, Таласка жерине кайтышат. Келип, өз элине той берет."},{"t":"p","h":"Үйлөнүүнүн алгачкы күндөрүнөн тартып эле Кожожаштын мурдагыдай мергенчилик кылып, табияттын жан-жаныбарларын атууга аялы Зулайка каршы чыгат. Бирок Кожожаштын түнү түшүнөн, күнү оюнан мергендиктин ышкысы, аңчылыктын кумары кетпейт."},{"t":"p","h":"«Кожожаштын түшү» бөлүмүндө күндөрдүн биринде Кожожаш аян берчү түш көрөт. Бул түштү удаа (подряд) үч көрөт. Үчүнчү жолу көргөндө, эртең менен туруп, аялы Зулайкага айтат:"},{"t":"v","l":["Түндө жатып түш көрдүм,","Түшүмдө мүшкүл иш көрдүм..."]},{"t":"p","h":"Түшүндө мурдагыдай жолу шыр болбой, кийик таппай убараланып жүрүп, акырында отуз улак, кырк чебич оттоп жүргөнүн көрүп, бардыгын кырып салат. Ошондо да дагы калды бекен деп өйдө басып отуруп,"},{"t":"p","h":"Адам уулу бара албас,"},{"t":"v","l":["Асман жакын кабарлаш.","Ак жалама боорунда,","Ылдый тартып түшө албай,","Өйдө тартып чыга албай","Өзүм жалгыз турупмун.","Кук эткен кузгун, карга жок,","Жалама зоо асканын","Ортосунда турупмун.","кабар – весть; кабарлап —","сообщается, извещяаст","жалама гладкий, ровный","","кук эткен кузгун – ворон","стервятник","",","]},{"t":"p","h":"Зулайка көпкө үн чыгарбай туруп: «Түшүң – жаман түш. Мени уксаң. экинчи Акбараңды колуңа албай. мергенчиликти ташта. Антпесең. бнр балээге жолугасың!» – деп, Кожожаштын түшүн жамандыкка жоруйт."},{"t":"p","h":"Жаны ‘вздор:"},{"t":"v","l":["сынамак болот – намеревается проверить","сынак – проверка","ышкысы – охотничий азарт","аңчылыктын кумары страсть охоты","аин – предостережение, внушение «свыше»"]},{"t":"p","h":"кийик – раздельнокопытные дикие жаачные животные, которые обитают в горах жоруйт – истолкует мелдеш – состязание <span class=\"pg\" data-n=\"17\">17<\/span>Тааныш сөздөр:"},{"t":"raw","h":"<div class=\"gloss\"><p>„<\/p><\/div>"},{"t":"p","h":"адис болгон мерген – ловкий стрелок 91-бет1с; Аалы Токомбаевдин «Акай мерген» аңгемесинен: Алис болгон мерген алда кайдагы кызыл асканы айланып, сонодой учуп, бугулардын алдынан чыкты.)"},{"t":"p","h":"эрегиш-мелдеш – соревнование, состязание (5-класс 33-бетте, Токтогул Сатылгановдун «Турумтай менен торгой» алабий жомогу: Тоонун торгою, бөксөнүн торгою, чоллун торгою үчөө кимибиз кыйынбыз деп мелдешс кетишет.)"},{"t":"p","h":"туш көрөт – приснится сон (б-класс 76-бетте, Молдо Кылычтын «Буудайык» чыгармасынан:"},{"t":"v","l":["Саятчы Толок тилмерин.","Бир күнү жатып түш көргөн,","Түшүнлө жакшы иш көргөн.)"]},{"t":"p","h":"«Кожожаштын Суречкиге ант бергени» бөлүмүндө Кожожаш кайберен жөнүндө түш көргөндө Кара-Үңкүрдө жаткан Суречки да түш көрөт. Түшүндө Кожожаш мерген анын тукумун (потомство) бүт кырат. Суречки ойлонуп, текеси Алабашка бул жерден кетели деп сунуш кылат. Алабаш: «Кара-Ункурдей жер кайда? Ээлеген конушумду таштабайм."},{"t":"p","h":"Мен Алабаш болгону,"},{"t":"v","l":["Кара-Үңкүр болгои эмеспи,","Кайберендин коргону?","Бул жерге мерген келчү эмес,","Келген мерген көрчү эмсс,","Улагым бирин атчу эмес,","Улагым аткан мергендер,","Убайым тартпай кайтчу эмес», —"]},{"t":"p","h":"деп Суречкисин карс сүзүп, тил албай, макул болбой коёт. Суречки антсе да болбой, текесин жаңы конуш (место расположения) издеп келүүгө көндүрөт. Акырында Алабаш Суречкинии ою менен болуп, жакшы жер издейт, бирок таппай (не найдя) кайра кайтып келет. Ушул эле учурда аялы Зулайканын барба дегенинс карабай Кожожаш аттанып мергенчиликке жөнөйт. Аска ташты аралап, эч бир кийик таба албай Кожожаш көпкө убара болот. Акыры Соң-Көлдүн белине (на склон) чыгып, Актоскоктун алдынан, Кектоскоктуи үстүнөн отуз улак, кырк чебич (коза по второму году) оттоп жүргөнүн көрөт. Адегенде эки улакты, андан кийин калгандарын кыйратып атып салат. Алабашты да атып, жарадар Мергендиги мыкты эми, Өзүнө өзү мактанып, Аска таштын башына Кожожаш мерген чыкты эми."},{"t":"img","src":"data:image/webp;base64,UklGRiwiAABXRUJQVlA4ICAiAADQ3QCdASprAaUBPrVUpU0nJKerpvCKyXAWiWVu/EboawvlKs75OjLxu5q+t3az/vkdt45+9x/xwasPvFP5P/feIf5H9ty0/uiIL са да берип кет.","Алабаш теке шеригим», —"]},{"t":"p","h":"деп суранат. Кожожаш ага макул болбой, Алабаштын башын кесип алат. Ошондо Суречки мергендин айылына жазында келип, өч алмакчы болуп, ант берет. Кожожаш да Суречкини мылтык менен атпастан. жөө кууп кармап алууга ант берет."},{"t":"p","h":"Мергенчиликтен оз уруусуна кайтып келип, Кожожаш Суречкинин айткандарын эсине түйүп жүрөт. Жаз келгенде Суречки Кожожаштын айылына келет. Кожожаш Зулайкага сырын айтып, коштошот. Алган жары Зулайка жүрөгү күйүп (сердце болит) чок (горящие угли) болуп, мергенди токтотууга аракеттенет. Кожожаш болбой Суречкинин артынан жөнөйт,"},{"t":"p","h":"Көргөн түшү аткарылып, Кожожаш Суречкинин тукумун кырып, сураганына көнбөйт. Суречки Кожожашты каргап (проклиная). анын жалама (скользкий, голый) аскада эч ким жардам бере албай, сөөгү ошол жерде калышын каалайт. Каргыш тийген Кожожашты эли куткара албай, анын сөөгү көмүлбөй (не похороненный) аскада калат."},{"t":"p","h":"Кыргыз эли эпостун негизги сюжетин жараткан мезгилде элдин аң-сезиминдс диний ишенимдер күчөп, мифологиялык ой жүгүртүүлөр үстөмдүк кылып турган. Ошондой эле адам баласы менен табияттын ортосундагы аң-сезимдүү байланыш да өнүгүп, адамдар мурунтан эле айкын байкалат. жаратылышка жасаган мамилесин өөрчүтүп келгени «Кожожаш» эпосунда Жалы сөзлөр:"},{"t":"p","h":"кайберен – общее название диких жвачных животных (кийик, тоо теке. эчки, аркар, Г элик) Суречки – мифическая серая коза, прородитсльница, покровительница диких жвачных животных убайым – страх. боязнь. беспокойство, печаль кийик – раздельнокопытные ликие жвачные которые обитают в горах шерик – спутник, пара, друг жизни"},{"t":"v","l":["ант – клятва, обещание","УРУУ – род (кытай, сарыбагыш ж. б. уруулары)","каргыш – проклятие","Тааныш сөздөр:","коргой – крепость. твердына, защита (6-класс, 37-бетте; «Кошой-Коргон;»)"]},{"t":"p","h":"өч алмакчы – отомстить (7-класс |0-бетте: «Мамас» эпосумуи кыскача мазмуну:» Кыяз Күлчоронун колунан өлүм табат. анын ордуна жедигер эли гин айдап, чөбүң чап, эмгегиңден пайда тап. Азамат болсоң ак иштеп, аздыр-көптүр малың бак» деп, элди эмгекке үндөйт (призывает). Т. Сатылганов айтыш жанрынын устаты болгон. Андан отуздай айтыш ыры мурас калган. Акын устат (учитель) катары Эшмамбет, Калык, Алымкул, Барпы, Коргол сыяктуу кыргыз элине таанымал акындарды тарбиялаган. Ал «Манас» эпосун, «Жаныш-Байыш», «Курманбек», «Шырдакбек», «Кедейкан», «Саринжи-Бөкөй», «Олжобай менен Кишимжан», «Ак Мөөр» ж. б. дастандарды да эн чебер аткарган (искусно исполнял)."},{"t":"raw","h":"<div class=\"gloss\"><p>бир түрү, Мисалы:<\/p><\/div>"},{"t":"p","h":"Т. Сатылганов – алтымыштан ашуун күүнүн автору. Анын күүлөрү: «Тогуз кайрык», «Миң кыял», «Чоң кербез» ж. б. 1928-жылы анын он сегиз күүсүн музыка изилдөөчү А. Затаевич нотага түшүргөн. Ал күүлөр 1934-жылы Москвадагы музыкалык басма тарабынан «Кыргыздын аспаптык 250 күүсү жана обондору» деген жыйнакта басылып чыккан. Токтогул кедейлердин таламын талашып, байларды ашкерелеп ырдаган (разоблачал). Байлар улуу акындан кутулуу максатында «Анжиянга басып киргени жатышат» деген жалган жалаа менен аны Сибирге сүргүнгө айдатышат. Туткунга алынган акын элге «Кош, апаке!», «Кош, элим!» деген ырлар менен кайрылып, өзү ак жеринен кармалганын, адилеттик жоктугун тартынбай айткан, бай-манаптарды жек көргөнүн билдирген. Сүргүндө жүргөндө акын «Айланган тоонун бүркүтү», «Ушундайбы сурагың», «Азапка түштү өмүрүм», «Туткунда жүргөндө» ж. б. ырларын жараткан. Сүргүндөн кайтып келгенде «Эңсеген элим аманбы?», «Апакем, аман барсыңбы?» сыяктуу ырлар менен кайрылат."},{"t":"p","h":"Токтогул 1917-жылы Улуу Октябрь революциясынын жеңишин өтө кубанычтуу тосуп алып, «Жашасын Кеңеш өкмөтү!», «Кандай аял тууду экен Лениндей уулду» ж. б. ырларын жаратат. Ксңеш өкмөтү орногондон кийин «Куткарды Ленин акылман», «Бийик көтөр тууңду», «Элди карачы», «Колхоз жөнүндө» ж. б. ырларын жаратат."},{"t":"p","h":"30-жылдардын орто ченинде Токтогулдун ырлары эл арасынан жыйнала баштап, 1938-жылы биринчи китеби жарык көргөн. Ушундан кийин замандаштарынан, окуучуларынан кошумча материалдарды жазып алуу уланып, эки томдугу басылып чыккан. Акындын чыгармалары көп улуттун тилдерине которулган."},{"t":"p","h":"Түшүндүрмө сөздүк:"},{"t":"p","h":"мактоо – форма народной песни, частично сохранившаяся и теперь, восхваляющая отдельного человека, племя. род <span class=\"pg\" data-n=\"24\">24<\/span>кирдое – особый вид песни в фольклоре. содержанием которой является осмеяние противника или его покровителя"},{"t":"v","l":["туткунга алынган – взятый под стражу","ак жеринен – невинный","адилеттик жок – нет справедливости","Тавныш сездер:"]},{"t":"p","h":"жамактатыин ырдоо – импровизировать (7-класс 2-бетте; «Жарамазан айтуу:» Орто Азий элдеринин ичинде кыргыздарда гана жамактатып ырдоо өнөрү – жарамазан айтуу кездешет.) мурас – наследие (5-класс 6-беггс; «Кыргыз элдик оозеки чыг армачылыгынан:» Кыргыз зли – бай жана кызыктуу фольклордук мурастым ээси.) таанымал – известный (5-класс 5-бетте; «Кирншүү:» Ал эми Чынгыз Айгмитовдун"},{"t":"p","h":"бүткүл дүйнөгө таянымал.) жалган жалаа – донос, оговор, клевета (6-класс 50-бетте; «Токтогул Сатылганов:» Ошол үчүн аны жалган жалап менен Сибирге сүргүнгө айдатышкан.)"},{"t":"h3","h":"Токтогул Сатылгановдун «Санат-насыят», «Үлгү ырлары»"},{"t":"p","h":"Башка акындардай эле, Токтогул да бир катар үлгү, санат-насыят ырларын жаратты (создал). Акын бул чыгармаларында жаштарды эмгекке. ынтымакка, адептүүлүккө (воспитанность), бири-бирин сыйлоого (уважать) үндөгөн, ар кандай начар жүрүш-туруштан (поступки), адидетсиздиктен (несправедливость), жаман адаттан (привычка), жалкоолуктан алыс болууга чакырган."},{"t":"v","l":["Дайранын көркү кемеде,","Баланын көркү энеде,","Акыл айтсаң, тыңшабай,","Акмактын көркү жемеде.","Эл тирилик кылганда.","Эсирип уктап кур жатпа.","Иш тапшырба жалкоого,","Акыл айтпа чалпоого!","Жаман адам белгиси —","Өз камы үчүн жүгүрөт.","Жакшы адамдын белгиси -","Эл камы үчүн күйүнөт.","Эчкинин көркү – төл менен,","Эгиндин көркү – жер мене ан аттарды мактап ырдаган ырчылардын ырын кунт коюп угуп, аларды кайталап жүрүп, ырчылыкка үйрөнүп алат. Төрөгелди Калыкты кордоп (унижая). шылдыңдап, өзүнчө эрмектеп (забавляясь) күлкү кылмакка (для того, чтобы поднять его на смех) гана ыр үйрөнүшүн талап кылат (требует). Уккан ырчыларды туурап ырдап бер деп уруп-кагып тилдейт, болбогон жерден бетке чаап, урушат. Ошол Төрөгелдинин үйүнө көп коноктор келчү экен. Калык коноктордун аттарын багып, кыштын күндөрүндө мал байлап, малдын чөбүн салып, алдын тазалап жана башка жумуштарды жасап жүрүп, үйрөнгөн ырларын оюнан кошуп узартып, бирдемелерди жамактап ырдап жүрөт."},{"t":"p","h":"Манаптардын зомбулугунан (насилие, бесчинство) жер оодарып <span class=\"pg\" data-n=\"29\">29<\/span>(переезжает). Кетмен-Төбөгө кетет. 1897-жылы биринчи жолу Токтогулга жолугат. Кыш айынын биринде улуу акын Токтогул Жаналы деген тегирменчинин (мельник) үйүнө келгенин угуп, Калык да көпчүлүк элге кошулуп барат. Бул жолугушуу жөнүндө Калык Акиев кийин мындайча эскерет: «Токтогул чарчы бойлуу, өңү дандырдай кызыл (краснощекий), ЭТКЭЭЛ (плотного телосложения) киши экен. Кара күрмөсү бар, ак топучан, оң жеңди чыканактан өткөрө түрүп алып, комузуна укмуштай кол ойнотуп чертип, кууланып, күлдүрүп олтурган экен. Күлбөгөн киши жок. Босого менен бойлошкон элдин аркасында олтурат элем... Жаналы мени көрө койду». Ошентип, жаш акын Калык Токтогул менен таанышат."},{"t":"p","h":"1910-жылдан кийин улуу акын менен бирге кепке эл аралап жүрүп, ырчы катары эл-журтка кеңири таанылат. Аны ээрчип жүрүп таалим алат, акындык чеберчилиги өсөт."},{"t":"p","h":"Ал Токтогул, Эшмамбет, Жеңижок деген атактуу ырчыларды кунт коюп угат. Анан өз алдынча эл алдына чыгып ырдайт. Анын алгачкы ырлары элдин оор турмушу жөнүндө баяндайт."},{"t":"p","h":"1926-жылы адегенде драма театрына, кийин 1936-жылы филармонияга артист болуп орношот. Ошол жылдан тартып анын китептери жарык көрө баштайт, эл кыдырып, көп айылдарда болуп, мукам ыр-күү чыгарып, элге кызмат кылат."},{"t":"p","h":"Калык ырларында элдердин бузулгус достугу жөнүндө ырдаган. Эмгеги үчүн Калык Акиев ордендер, мсдалдар менен сыйланган, Кыргыз ССРинин «Эл артисти» деген ардактуу наам алган."},{"t":"p","h":"Калык Акиев 1953-жылы ноябрь айында 70 жаш курагында каза болгон."},{"t":"p","h":"Тааныш сөзлөр:"},{"t":"p","h":"таанымал – изасстен. изасстный (5-класс 5-бетте, «Киришүү:» Ал эмн Чынгыз Айтматовдун чыгармалиры бүткүл дүйнөгө газнымал,"},{"t":"p","h":"6-класс 108-бетте, «Чыңгыз Айтматов:» Ал – дуйного таанымал жазуучу. 7-класс 24-бетте; Токтогул Сатылганов жөнүндө тексттен: Акын устат катары Эшмамбет. Калык, Алымкул, Барпы. Коргол сыяктуу кыргыз элине тайнымал акындарды тарбиялаган.)"},{"t":"p","h":"кордон – уннжах; кордук- унижение (7-класс 8-бетте: «Манас» эпосунун кыскача мазмуну:» Элге кордук коргозгон Алоокеге каршы аттамын, Манас аны жеңст.)"}],"sub":[{"title":"Токтогул Сатылгановдун «Санат-насыят», «Үлгү ырлары»","b":13},{"title":"Калык Акиев","b":47}],"section":"АКЫНДАР ПОЭЗИЯСЫНАН","pages":[23,29]},{"title":"«Жокчулук» ыры жөнүндө","blocks":[{"t":"h3","h":"«Жокчулук» ыры жөнүндө"},{"t":"p","h":"Калыктын «Жокчулук» деген ыры анын балалык жана өспүрүм кези жөнүндө эскерүү катарында жазылган. Акындын балалык кезиндеги турмушу кайгылуу (печальным) жана оор болгон. Он төрт жашында байга малай (наемный рабочий, исполнявший домашние работы) болуп, мал менен бирге сарайда жатат, кийим-кечесиз, ач-жылаңач болот."},{"t":"p","h":"<span class=\"pg\" data-n=\"30\">30<\/span>«Таманымды жоорутуп, жооругуп – натереть до ссадин Жара кылдың, жокчулук, Тартканымды жашымдан, Санаа кылдың, жокчулук», – дейт акын. – самад— забота, печаль Ал езунун байлардан керген кордугун, чеккен азабын катуу ызаланып (с досадой) эске тушурет."},{"t":"v","l":["«Балдан таттуу сөзүмдү,","Эм кылбадың. жокчулук.","Байдын жаман уулуна,","Тең кылбадың, жокчулук».","Жаңы сөздөр:","өспүрүм кези – отрочество","эскерүү – воспоминание","балалык кезиндеги – в детстве","кийим-кечесмз – без одежды","ач-жылаңач – голодны 1of29y0Lx1HWMvgAA","w":414,"ht":541},{"t":"p","h":"Тоголок Молдо – кыргыз жазгыч акыны. Дыйкандын үй-бүлөсүндө туулган. Атасы Абдыракман эл ырларын жакшы билген, жыйындарда ырдай коюп жүргөн киши болгон. 14 жашка чейин атасынын тарбиясында өсүп, айткан жомокторун, ырларын үйрөнгөн. Атасы дүйнөдөн кайткандан кийин чоң атасынын бир тууганы атактуу Музооке ырчынын тарбнясында жүрүп эр жеткен. Молдодон кат тааныган (научился грамоте). Ырды 14 жашында жаза баштаган. Жигит курагында көбүнчө сүйүү темасына кайрылып, «Каракөз», «Толгонай», «Жигиттин кызга ырдаганы», «Кыздын жигитке ырдаганы» деген ырларын, «Үрпүкан» аттуу поэма жараткан."},{"t":"p","h":"Бул чыгармаларында кыргыз кыздарын уяң (стеснительный) болбой, өз укугуна жетүүгө үндөйт (призывает), сүйгөнүнө карата (по отношению к любимой) жүрөктөгү чын сырын (сокровенную тайну) айтат, 18 жашында Тыныбек жомокчуга жолугуп, бир нече ай кошо жүрүп, «Манас» эпосун үйрөнгөн. Акын кыргыздын оозеки чыгармаларын, мифтик түшүнүктөрүн. ишенимдерин, ага карата чыгарган ырларын көп билген. Кыргыздын «Шырдакбек», «Жаңыл Мырза», «Мендирман» сыяктуу дастандарын жакшы айтып, аны жазып тапшырган (сдал рукопись). «Манасты», «Семетейди» да айткан, кыргыз элинин тарыхын үйрөнүүгө көп көңүл бөлүп, көп жерди кыдырып санжыра жазып жүргөн."},{"t":"p","h":"Анын Октябрь революциясына чейинки ырларына сүйүү темасындагы ырлары, кошоктор, армандар, фольклордук сюжет боюнча жазган чыгармалары, тамсилдери, ашкерелөөчү ырлары жана башкалар кирет. Эгер Тоголок Молдо сүйүү ырларында жаштык ой-кыялын, ашыктык сезимин билдирсе, «Дыйкандын аялынын кошогу», «Устанын аялынын кошогу» чыгармаларында эмгектин маанисин өзгөчө даңазалан (здесь: прославлял значимость труда) көрсөтөт."},{"t":"p","h":"«Чалга берген кыздын арманы», «Жаш балага берген кыздын арманы», «Насыяга кеткен кыздын арманы» жана башка арман ырларында кыргыз кыз-келиндеринии адамдык укуктан ажырап, мал катары сатылганына, насыяга кеткенине жаны ачып (был огорчён тем. что были отданы за долги), эски урп-адатка нзаразы болот. Фольклордук сюжеттен алынган «Кемпир-чал», «Бабыркан», «Телибай тентек» чыгармаларында өткөндөгү түркөйлүктү ашкерелейт. Ал эми сатиралык ырларында («Терек-тагай эли"},{"t":"p","h":"3-81 <span class=\"pg\" data-n=\"34\">34<\/span>тууралуу», «Чачынын кошогу», «Селде оронгон молдо кой», «Кожонун аңгемеси» ырлары, «Кемчонтой» поэмасы) байлардын, кожолордун, казылардын терс кыял-жоругун мыскылдайт (высмеивает отрицательные черты характера). Тоголок Молдо тамсил жанрында көп чыгармаларды жазган: «Бөрү менсен түлкү», «Бөдөнөнүн түлкүнү алдаганы», «Каркыра менен түлкү», «Эшск менен булбул», «Иттин доолдай тиктирем дегени» жана башкалар. Өзүнүн тамснлдсрнндс адам мүнөзүндөгү терс көрүнүштөрдү сындайт."},{"t":"p","h":"Ал Октябрь революциясынын жеңишин тосуп алып, «Өзгөрүш» (1918), «Насыят» (1925), «Эркиндик» (1919-1923) деген ырларды, «Аткантаң менен Суйгенбай», «Кедейлерге насыят» деген поэмаларды жараткан, 1939-жылы Кыргыз искусствосунун Москвада өткөн декадасына катышкан. Улуу Ата Мекендик согуш мезгилиндеги чыгармаларында бул согуш бүт элге кайгы алып келгендигин айтып, элди ынтымакка, душманга катуу сокку урууга чакырып (призывает дать отпор врагу). душман акыры жеңилет деген ишенимди билдирет."},{"t":"p","h":"Сиңирген эмгеги үчүн «Ардак белгиси» ордени менен сыйланган."},{"t":"p","h":"Түшүндүрмө сөздүк:"},{"t":"v","l":["ашыктык сезимин – чувство любви","дастан – ісероичсскос сказание, эпопея","түркөйлүк – безграмотность, тёмнота"]},{"t":"p","h":"кожо – ходжа, потомок первых халифов (в дореяолюционное аремя у кыргмылоп, как и других мусульманских народов. плуты. пользуясь этим именем как знаком природной «святости», одурманивали сознание тёмных людей, обманывали их, наживались за их счёт)"},{"t":"v","l":["казы – кадий (судья. судивший по законам шарията)","","Тааныш сөздөр:"]},{"t":"p","h":"жазгыч акыны – грамотные акыны, которые записывали свои произведения (5-класс 26-бетте; «Акындар неэзиясынан:» XX кылымда жашап огушкен Молдо Нияз, Молдо Кылыч, Ысак Шанбсков, Казыбек өңдүү ырчылар жазгыч акындар леп аталышат. Себеби. алар чыгармаларын өздөрү кагаз бетине түшүрүшкөн.)"},{"t":"p","h":"санжыра – родословная, родословие, генеология (7-класс 1-бетте; «Кирншүү. Элдик оозеки чыгармачылык:» Оозеки чыгармачылыкка томонкулор кирет: эпостор, жомоктор, ырлар, санжыралар, айгыштар, арман, кошоктор, макал-лакаптар, табышмактар, жанылмачтар.)"},{"t":"p","h":"ой-кыял – мечта (5-класс 6-бетте; «Кыргыз элдик оозеки чыгармачылыгынан:» Эл өздөрүнүн вйлана-чийрьге, жаратылышка, коомго болгон көз караштарын, мамилелерин, ойлорун. кыялдарын мына ушул оозеки чыгармалар аркылуу билдирген.)"},{"t":"v","l":["кайкы – горе (6-класс 52-бетте; Токтогулдун «Балалык» ырынан:","Бешке жашы чыкканда,","Кайгы, капа ойлонбой,","Жайнап турган балалык.)"]},{"t":"p","h":"душман – враг (5-класс 53-бетте; Темиркул Үмөталиевдин «Күч бирдикте» адабий жомогунан:"},{"t":"v","l":["Бир дагы душман каршы келиккен жок,","Бардыгы жерге житип ксткси окшоп.)"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"35\">35<\/span>«Кемчонтой»"},{"t":"p","h":"Чыгарманын негизги идеясы – Кемчонтойдун образынын негизинде адамга тиешелүү терс жүрүш-туруштарды ашкерелеп, жакшы адам болууга тарбиялоо (адамдын ички дүйнөсүн, жүрүш-туруштарын ачык көрсөтүү)."},{"t":"p","h":"Тоголок Молдонун бул чыгармасы элдик жомоктун негизинде (на основе) жазылган сатиралык чыгарма. Поэмадагы баш каармандар – Кемчонтой менен Багдагүл."},{"t":"p","h":"Казынын уулу Кемчонтой – терелгеиден эле акыл-эси жок, макоо киши. Ал бекерпоз, зөөкүр, эч бир пайдалуу иш иштегиси келбейт. Абдан орой (грубый). кекирейген адам, Эртеден кечке чейин элге шылдың болуп, жек көрүнүп, эшекчен базар кыдырып жүрөт."},{"t":"p","h":"Бала кезден келесоо келесоо – придурковатый Өз акылы такыр жок."},{"t":"v","l":["Ар кайсыны бир айтып,","Өзү орой, өозу шок.","Жалгыз эшек малы бар,","Эшегин айтат атым деп.","Базардан башка кеби жок","Адамга сыяр эби жок."]},{"t":"p","h":"Акылы жок баласына акылдуу аял алып берсем, оңолуп кетеби деп энеси көп калың берип, айылдын акылдуу кызы Багдагүлдү алып берет."},{"t":"p","h":"Энеси эптүү болбосо,"},{"t":"v","l":["Зөөкүргө аял келеби.","Дүнүйө калың бербесе,","Кызын бекер береби.","Атасы калың көп алды,","Алып малды жеп алды.","Кыздын башы байланды,","Азап тартып зарланды.","Акылы артык Багдагүл,","Бул жорукка алданды."]},{"t":"p","h":"Багдагүл акылы кем, макоо киши менен жашагысы келбей (не хочет жить), өзүнүн үйүнө качып кетет. Бирок аны атасы урушуп, күйөөсүнө айра кетирнп жи т (отправляет обратно к мужу). "},{"t":"v","l":["Кызы чыккан ончубу.","Мындай жорук болчубу?","Жаман кыз чыгат күйөөдөн,","Жакшы деп атка кончубу?","Канткенде балам чыгасың.","Калыңга берген кою бар,","Баталашып башында,","Элге берген тою бар,","Алакан жайган бата бар.","<span class=\"pg\" data-n=\"36\">36<\/span>Жаңы сөздөр:","макоо – непонятливый, бестолковый","бексрпоз – бездельник","ммекур – хулиган","кекирейген – высокомерный","калый – выкуп за невесту","","Түшүндүрмө еөздүк:","Дүмүйө калың бербесе,"]},{"t":"p","h":"Кызын бекер береби – если пс выплатить хороший калым, неужели могут отдать свою дочь (замуж)."},{"t":"v","l":["Акылы артык Багдагүл,","Бул жорукка алданды – бедная Багдагүл была вынуждена согласиться.","Жаман кыз чыгат күйөөдөн,"]},{"t":"p","h":"Жакшы деп атка кончубу? – только глупая девушив может уйти от мужа, назовут ли её после этого хорошей. Калыңга берген кою бар, Баталашып башында, Элге берген тою бар – они выплатили калым, сыграли свадьбу и дали благославенис"},{"t":"p","h":"Тапшырмалар."},{"t":"v","l":["1. Кемчонтойду мунездегуле.","2. Эмне учун Багдагүлдүн атасы кызын кайра күйөөсүнө жөнөттү?","","ЕЭ Кемчонтой менен Баглагуллу салыштырып, мүнөздөгүлө."]},{"t":"p","h":"Акыры Багдагүл Кемчонтойдон кутулуунун амалын ойлойт. Тамак жасаганда бир күнү тузун ачуу, бир күнү аз салып, бир күнү суюк жасаса, экинчи күнү коюу жасап, Кемчонтойдун айласын кетирет. Жини келген Кемчонтой аялы менен урушат."},{"t":"p","h":"Багдагүл анда кеп айтат, Баяным уккун деп айтат;"},{"t":"p","h":"– Ашыктырдым өзүмдү, Укпадың айткан сөзүмдү. Энтелеп өзүң барганда, Эсимди кудай алыптыр. Колумдун чени ошондо, Энемде унут калыптыр. Эрте барып тезирээк Колумдун ченин алыл кел, – деп күйөөсүн өз апасына жөнөтөт."},{"t":"v","l":["Г","ашыктырдынң – поторопил","","энтелеп өзүн барганда, Эсимди кудай","алыптыр – когда ты ходил за мной. бог","лишил меня памяти, чен – мера","энемде унут калыптыр – забыла у мамы"]},{"t":"p","h":"Кемчонтойго кайненеси: «Сууну казанга аз куйса, тузду дагы аз салсын. Казанга сууну көп куйса, тузду дагы көп салсын» – деп жөнөтөт. Жолдо келатып Кемчонтой кайненеси айткан сөздөрдү унутуп, эсинде «аз туз» деген эле сөз калат. «Аз туз» деп кайталап баратып, «Аз түш» деп адашып калат. Ал түшүм жыйналып бүткөнүнө кубанып, мал союп, той тойлоп жаткан <span class=\"pg\" data-n=\"37\">37<\/span>дыйкандарга жолугат да, «Аз түш» деп айтат. Жиндери келген дыйкандар Кемчонтойду уруп-сабап «Береке чечке» деп айт деп жеиетушет. Таяк жегенден коркуп калган Кемчонтой ал сезду унутпай жаттап алат. Келатып алдынан өлүк көөмп жаткан (хоронивших покойника) адамдарга жолугуп, «Береке чечке» деп айтат. Кайгырып турган эл Кемчонтойду уруп. «Тукумуң өссүн» деп айт деп жолго салышат (отправляют). Андан ары жылдар көп бою балалуу боло албай атып бала көргөн кишинин (человека, долгие годы ждущего своего первенца) берип жаткан тоюнун үстүнөн чыгат да, айта турган сөзүн унутуп, «Тукумуң үзүл» деп айтат."},{"t":"p","h":"Кемчонтойду сабап жөнөтүшөт (избивают). Акылынын үйүнө жетет да, эшигин се угунан (из-за своей глупости) көп ко"},{"t":"v","l":["– Эриң келди базардан,","Эшикти ачкын, – деп айтат.","Анда Багдагүл:","– Эрим болсоң, атың ким?","Атыңды айткын билейин.","Кокус эрим болбосоң,"]},{"t":"p","h":"Кайдан туруп жөнөйүн, – деп акыркы айла-амалын колдонот. Өз атын унуткан Кемчонтой үйүнө кире албай (не мог зайти к себе в дом), акылдуу Багдагул макоо (бестолковый) күйөөсүнөн амал менен кутулган экен."},{"t":"v","l":["Жаңы сөздөр:","айласын кетирет – здесь: мучает","кайнене – теща","аз туш – здесь: бедного вам урожая","береке чечке – богатого урожая","тукумун всеун – чтобы твое потомство возросло","тукумун үзүл – чтобы твой род прекратился","кутулган экен – избавилась","","Тавныш сөздөр:"]},{"t":"p","h":"кордук – унижение (6-класс 129-бетте; Мукай Элебаевлии «Улуу марш» ырынан:"},{"t":"p","h":"Тартып алсам деген кара ниеттин,"},{"t":"v","l":["Кордугуна кантип тирүү көнөсүң?","7-класс 9-бетте; «Манас» эпосунун кыскача мазм уну: Бакайды ти й","тарттырып, аябай көп кордук көрсөтөт.}"]},{"t":"p","h":"Е ы эр, күйөө – муж (6-класс 147-бетте: Жалил Салыковдун «Эненин жүрөгү» – о"},{"t":"p","h":"Дагы эле эрдин жүгү аялдарда, Дагы эле колдон гүшпөйт бардык бала...) айла-амал – уловки (6-класс 147 -бетте; Жалил Салыковлуи «Эненин жүрөгү» р ме"},{"t":"v","l":["Минткенде ала албаймын чептеги ллди,","А корок. бир амалын табайын», – деп,","Жарчыга мына мындай буйрук берди...)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"38\">38<\/span>Тапшырмалар."},{"t":"p","h":"1. Эмис үчүн Кемчонтой элден гаик жеди? (Айткан сөздөрүн эстен, мисал кылгыла.) 2. Багдагүл күйөөсүнөн кантип кутулду? Кандай амал ойлоп тапты?"},{"t":"p","h":"3. Үзүндүнү окуп, кайсы орус акынынын чыгармасына окшош экендигин байкагыла."},{"t":"p","h":"4. Позманы окуп, өз оюнарды түшүндүргүлө."},{"t":"h3","h":"«Кемчонтой» поэмасынан үзүндү"},{"t":"v","l":["Кемчонтой бүгүн өтөт деп,","Жолун тосуп жатышат.","Балдар баары чогулуп,","Тамашага батышат.","Келип жолдо турушат,","Кезек менен урушат.","Келесоону токмоктоп,","Келеке-шылдың кылышат.","Кемчонтойдо эс барбы,","Унутуп калат урганын,","Жүрө берет сенделип,","Ойлобойт жандын жыргалын.","Нандын атын унутул,","Кемчонтой айтат жалпак – деп,","Калпагын айтат байпак – деп,","Байпагын айтат талпак деп.","Кептин жөнүн биле албайт,","Кежир сүйлөп тил албайт.","Элирип кетет ар жерде,","Эл ичинде жүрө албайт.","Балам үйдө турар деп,","Бастырып оокат кылар деп,","Оокатка балам кирген соң,","Анан жаным тынар деп,  акын өзү мындайча эскерет:"},{"t":"p","h":"«Кыргызча айына 2-3 жолу уктура турган «Бирикме чарба» деген радиогазетабыз бар. Ошонун алдында адабий ийримибиз иштейт. Ийримди жетектеген кишилер: Гезит окугула, кабар жазгыла, антпесеңер өспөйсүңөр», – дейт. Жазганыбызды талкуулап, жактырып, айрымдарын ийримдин мүчөлөрү бүт жаттап, анан хор менен ырдачубуз. Андан тышкары өзүбүздүн радиогезиткс кабар жазабыз. Мына ушунун баары, жаңы турмуш, жаңы учурдун деми менде журналисттик, адабий шыктарды ойготкон»."},{"t":"p","h":"А. Токтомушев 1952-жылы Фрунзе шаарындагы псдучилищени сырттан окуп бүтүрөт (заканчивает заочно). 1932-жылдан баштап Улуу Ата Мекендик согушка чейин «Кызыл Кыргызстан», «Ленинчил жаш», «Колхоз турмушу» гезиттеринде адабий кызматкер, жооптуу (ответственный) секретарь болуп эмгектенет. 1953-1957-жылдары «Ала-Тоо», «Чалкан» журналдарында бөлүм башчысы (завотдел) болуп иштеген."},{"t":"p","h":"Акындын чыгармачылык жолу 1930-жылы башталат. 1936-жылы <span class=\"pg\" data-n=\"42\">42<\/span>«Балбандар» аттуу биринчи ырлар жыйнагы жарык көрөт. Бул ырлар жыйнагын редакторлогондо акын Кубанычбек Маликов окурмандарга: «Абдрасул Токтомушев – жаш акындардын ичиндеги сөзгө эркин, айтамын дегенин кысталбай (ме затрудняясь) айта турган. калеминде толук ишеними бар жолдошторубуздун бири», – деп кайрылган экен."},{"t":"p","h":"«Какшаалдан кат» поэмасы 1937-жылы кыргыз тилинде, ал эми 1958- жылы орус тилдеринде жарык көрөт."},{"t":"p","h":"Улуу Ата Мекендик согуш мезгилинде советтик адамдардын эрдигин даңктаган бир топ чыгармаларды жаратат. Бул чыгармалары согуштан кийин жарык көргөн «Күн», «Менин өлкөм» аттуу ырлар жыйнагына кирет."},{"t":"p","h":"Ыр түрүндө жазылган «Алтын тоо» романынын биринчи бөлүгү (часть) 1965-жылы, 1968-жылы экинчи бөлүгү жарык көрөт. «Алтын тоо» романы үчүн 1974-жылы Кыргыз Республикасынын Токтогул атындагы мамлекеттик сыйлыгына ээ болот."},{"t":"p","h":"Анын «Балбандар», «Эмгек жана бакыт», «Ырлар жыйнагы», «Жаштын тилеги», «Тартуу», «Тынчтык үнү» ырлар жыйнагы, «Менин өлкөм» ырлар жана поэмалар жыйнагы, «Какшаалдан кат» поэмасы өзүнчө китеп болуп чыккан."},{"t":"p","h":"Абдрасул Токтомушев – лирикалык ырлар менен поэмалардын, балдар поэзиясынын автору."},{"t":"p","h":"Тааныш сөздөр:"},{"t":"p","h":"эскерет – аспоминает (7-класс 27-бетте: Калык Акиса: Калыктын «Жокчулук» деген ыры анын балалык жана өспүрүм кези жөнүндө эскерүү катарында жазылган. Ал өзүнүн байлардан көргөн кордугун. чеккен азабын катуу ызаланып эске түшүрөт.)"},{"t":"p","h":"жыйнак – сборник (7- класс 20-бетте; Токтогул Сатылганов: Ал күүлөр 1934-жылы Мескзалагы музыкалык басма тарабынан «Кыргыздын аспаптык 250 күүсү жанв обондору» деген жыйнакта басылып чыккан.)"},{"t":"p","h":"ишеним – уверенность (7-класс 32- беттс; Тоголок Молдо: Улуу Ата Мекендик со- Гуш мезгилиндеги чыгармаларында бул согуш) бүт элге кайгы алып келгендигин айтып, элди"},{"t":"h3","h":"«Какшаалдан кат» поэмасы"},{"t":"p","h":"Кыргыз ССРиңин Эл акыны А.Токтомушев «Какшаалдан кат» поэмасын 1916-жылдагы Улуттук-боштондук Көтөрүлүшкө (народно-освободительное восстание. Здесь имеется ввиду события 1916 года) арнаган. «Какшаалдан кат» – лирикалык поэма. Поэма кат формасында (в форме письма) жазылып, биринчи каты – 1936—37-жылдары. экинчиси – 1947- Жылы, үчүнчүсү – 1949-жылы жарык көргөн (была опубликована). Кыргыз Элинин 1916-жылкы Улуттук-боштондук көтөрүлүшү жеңнлгенден кийин <span class=\"pg\" data-n=\"43\">43<\/span>ылган. Бирок өзүнүн туудүп-өскөн жерине (в родные края) кайта албай,"},{"t":"p","h":"жет кыргыздар кала берген. Ошондон кыздардын бири – Сайра. живания) Мекен, эл-жерге болгон кусалык (печаль), Акын поэмасында Сайранын ички толгонуулары аркылуу (через н 4 баяндайт. Ата-энесинин өлүмү, өзүнүн бир табак арпа унга са `айранын жана ал сыяктуу көптөгөн кыздардын трагедиялуу тагдырын көрсөтүп к. Сабыр агтуу кишинин жардамы менен кат тааныйт. Алыста жүрсө да, ат. Албетте, ал өзүнүн оор тагдырына мөнкүрөп чөгү п кетпейт чөгүп йт (не падает Сайра өзүнүн туулуп-өскөн жери менен сыймыктанып (гордится), ал жакта болуп жаткан өзгөрүүлөргө кубанат."},{"t":"h3","h":"«Какшаалдан кат» поэмасынан үзүндү"},{"t":"v","l":["Мен төрөлүп, мен көгөрүп,","кен элиме,","эндик казып,","Ойноп ескен жериме.","Суусу тунук, абасы атыр,","Каснеттүү Кеминге.","Барсам экен, көрсөм экен,","Элим кантип кетти экен?!","Айлуу түндө кыз-келиндер.","Эчен оюн кургандыр!","Кээ бир кезде алын эске,","Ойлоп мени жүргөндүр!","Караанынды элестетип,","Ойго батам, сагынам!","Бут муңумду кудмел жутуп,","","Чыкпас элем жаныңдан.","Барсам экен. көрсөм экен,","Жерим кантип кетти экен?!","Ушу менин тагдырыма","Кандай жазуу жазылган?","Тууган элден ажырап мен.","Алыс калдым жашыман.","","-2-","","«Унутту кызым» дебегин:","Колунда ата-эненин —","Жүргөнүм эске түшүрөм."]},{"t":"p","h":"ышкын – ревень; эндик – арсения"},{"t":"p","h":"касисгтүү – благодатный, священный"},{"t":"p","h":"р – учесть, принять во внимание р (вспоминая) караан – опора, защита, покровительство"},{"t":"p","h":"муңду күрмөп жутуу – глотать Шан, куса болуп зарыгам – изнываю от тоски"},{"t":"p","h":"кандай жазуу жазылган – что мне предначертано судьбой"},{"t":"img","src":"data:image/webp;base64,UklGRrBFAABXRUJQVlA4IKRFAADwXgKdASqAAgcCPq1MnEmmNCkqs7Z62oAViWdtMNpsewNab5sP998TuOk+gi+/67+Rv5l/iueP7gjun9h9gTjN2lykH34v+0x7k1l+tJ6creHxuf3AX+H/+bzdfHv8z/7dbb/k/sf+b6+1nDkp//f/h7Ev/HzX/KP+Lh/+qlf/0tvPviE//+0n4B//Nz/On///qcdJCyRfJl+xZz/QL00S+GtAhgUN0WKTPLO4GhcrNVtvivDH5WSh0bnnU0o5B0PCopmbqHo4WH06U9ZQr5H3IRO42uug5Nkx37gUvCcH2TXn5O2p3hhgmqCSHbHxw0hPbk5VMv3JqfQNiAEyzkfWoF0BZS+GNCAvwoUjQxXZVBUNjmte4ZcHwyvybVPkiZqLUBgHkM4purLhEN2RZe5gYOgQEg/O2/OLg7Xad8mVzk9PXclgHgsr9m8dP3KKq7IgJLl++OnevpGuRJb8utUIfCPXdGgm4GYAkUL9GiLFZUKqIj9ET40/3Z+sKDs9XEmIXp0AWlJr38ow1cgVRAa9AHvMsUabEE9dO/RReXsko14PsCj/QgUq5Q2HT0gTuoSY1B8xjH2xIBf0ViGoWzL2Vpx9xi05gOEWxpv19H6QVZA95qY2VgYR4stw+lbBqL624hPTDE2wUD6MlGlxjBF+w8dWLBozPARo19pAXoETqhWXkIg/+2Sx3mypkMJcNjQA0PvLS/ACFFCdf334XUQCLALcAKukxFG+eRgDN/Du0edyCiKgk+i0OEQDChbJ2Xapn26QZKOrg1okByVPsxKuUPxvrdp+uMi я ввиду Октябрьская революция) кийин тууган жерди сагынган эл Ата Журтка кайта баштайт. Алар менен бирге Токомбайдын үй-бүлөсү да өз жергесин көздөй жөнөшөт (олправляются в родные места). Бирок Туу-Казык журтуна жетпей Орто-Токойдо Токомбай каза болот. Коп узабай айыккыс лаптка (неизлечимая болезнь) чалдыккан апасы Уулбала да көз жумат (умирает). Ошентип, бир үйгө батпаган буледон он үч жашар жалгыз Аалы калып, жетимчиликтин (сиротство) азабын тартат. 1919-жылы Ысык-Көлдүн күнгөйүндө аталаш туугандарыныкында туруп, ошол жерде бир аз окуйт. Бирок коп узабай, эжсси Батма аны издетнп таап (находит). Кочкорго алып кетет. Ал жакта али мектеп ачыла элек болгондуктан (так, как не было школ). Аалы окуусун уланта албады (не смог продолжить обучение). Жездесинен (муж сестры) өтүк ултарганлы. сөөктөн топчу жасаганды (изготавливать из костей животных пуговицы) үйрөнөт. 1922-жылы окуудан жайкы нем алышка (на летние каникулы) кайткан балдардын угуттеесунен (агитации) улам окууга болгон кызыкчылыгы артып, жакын агаларынан жол кире алып, Ташкенге жөнөйт. Ал жакта адегенде интернатка орношот, кийин советтик-партиялык мектепке которудаг (переводится). 1923-жылы Орто Азия Коммунисттик университетинин даярдоо курсуна өтүп (поступает на подготовительный курс), бул окуу жайын 1927-жылы аяктайт. Ошол жылдарда туңгуч (первый) газетабыз «Эркин-Тоо» жарык көрүп, анын оиринчи санына (1924-жылы 7-ноябрда) «Өктөбрдүн келген кези» деген ыры жарыяланат (было опубликовано). Анын жүздөгөн лирикалык чыгармалары. «Таң алдында» деген ыр менен жазылган романы. «Күүнүн сыры», «Даат», «Жол жомогу» сыяктуу ондогон аңгемелери, «Жараланган жүрөк», «Мезгил учат», «Солдат элек» повссттери, «Ант», «Күндүн чыгышы», «Өлбөстүн үрөнү» драмалары, «Туткун Марат», «Жетим менен сыйкырчы», «Өз көзүм менсн» ж. 6. ондогон поэмалары, классикалык орус чет элдер жана боордош адабияттардан котормолору бар."},{"t":"p","h":"Акын, прозаик, драматург, котормочу Аалы Токомбаев 1988-жылы дүйнөдөн кайтты."},{"t":"h3","h":"<span class=\"pg\" data-n=\"49\">49<\/span>«Күүнүн сыры» аңгемеси"},{"t":"p","h":"А. Токомбаевдин бул аңгемеси эл оозунда айтылып келген эски лсгенданын негизинде (на основе) жазылган. «Күүнүн сыры» аңгемесинин сюжеттик негизин башкы үч каармандын ортосундагы мамилелер (отношения) түзөт. Чыгармадагы башкы каармандар (главные герои) – он жашында_уурдалган (похищенный) Зарлык, аны уурдап кеткен (похитивший) Баатыр жана ага кайындалган (сосватанная) Кыз. Каармандардын энчилүү аттары. алар катышкан окуянын кайсы убакта, кайсы жерде, кайсы элде болгону ачык айтылган эмес. Негизги окуя (события) көчмөндөр чөйрөсүндө (среди кочевого населения), жоокерчилик заманыңда (военное время) өтөт. Баатыр менен Кыздын урушуу жол-жоболорун жакшы билиши, айтканынан-кайтпагандыгы (улрямстео) далил болуп турат. Ошондой эле аңгемеде кыз менен жигиттин ортосундагы сүйүүсү, бирок ал сезимдин кейиштүү бүтүшү (печальный конец), унутулбас кайгысы (незабываемая печаль) баяндалат. Кыргыздар өзүнүн кубанычын да, кайгысын да күүгө салын, укумдан-тукумга (из поколения в поколение) калтырган. Ошондуктан жазуучу аңгемени «Күүнүн сыры» деп атаган."},{"t":"h3","h":"$ «Куунун сыры» ангемесинен узунду"},{"t":"v","l":["– Эрксм! Эми калын болсо бүттү. Атаң","дагы чатак кылып жятат. Качпайсыңбы? —","деди жигит.","– Жок, мырзам. Атамдын жалгыз кызы"]},{"t":"p","h":"бөлсом, той тойлотпой туруп, босогодон аттабаймын (не уйду из дома). Атам эмне чатак кылып жатат? – деди кыз."},{"t":"p","h":"– Кызыл буурулду (имеется ввиду оружие), же Ак чагырды (кличка коня) бербесе, кызымды бербеймнн, – дептир,"},{"t":"p","h":"Экөөнүн бирөөнү берип. атамды ыралзы кыл (удовлетвори просьбу отца). Атам айтканын кылбай койбойт."},{"t":"v","l":["тойлотной туруп-не","а—— м4","","– Жок. мен атым менен куралымлин – курал- ружье","айрылып, кыз албаймын, – деп жигит чорт","гана айтты (резко прервал).","Экөөнүн бирин атам алмайынча, мен","сага барбаймын (я за тебя замуж не пойду),"]},{"t":"p","h":"– деп кыз жигиттин сөзүн кесе сүйлөдү. кессе сүйлөдү – сказала, отрелая"},{"t":"p","h":"Жигит кыз менен көп сүйлөшүп олтурган жок:"},{"t":"p","h":"4-81"},{"t":"p","h":"<span class=\"pg\" data-n=\"50\">50<\/span>– Экөөнүн бирин берсем, сени албай эле энсмди алып калайын, – деди."},{"t":"p","h":"Кыздын кербездиги ого бетер күчөдү."},{"t":"p","h":"– Экөөнүн бирин бермейинче сага тийсем, мен атама тийип калайын, – деди."},{"t":"p","h":"Өзүңөр билссиңер, кыргызда мындан чоң каргыш, мындан чоң ант жок. Кыз менен күйөө катуу эрегишип кетишти (начали ещё больше препираться)."},{"t":"p","h":"– Сени атандын төрүндө капытам (элставлю состариться): өзүм да албаймын, эрге да бергизбеймин (не дам выдать тебя замуж за другого). Биреего бере турган болсо, айылыңарды кызыл кереге кылып чабам (уничтожу). Өзүңдү жайдак атка мингизип барып күң кылам, – деди."},{"t":"p","h":"Кыз тайманган жок (не испугалась):"},{"t":"p","h":"– Уч айдын ичинде экөөнүн бирин берип албасаң, мен өзүм билип кул болсо да күйөөгө чыгам. Эр болсоң кегиңди менден ал. Мен үчүн айыл айыптуу эмес, – деди кыз ордунан козголбой."},{"t":"p","h":" Үч айдын ичинде ыктыярың менен барбасаң, түбөлүк күңдүккө кармаймын, эсиң акылыңа барда кел (опомнись, пока не поздно), – деди жигит каарданып."},{"t":"p","h":"Күң кыла албасаң. төшү түктүү жер урсун!"},{"t":"p","h":"(Пусть тебя земля покарает!) Эрге тие албасаң, төбөсү ачык көк Урсун! (Пусть тебя небо покарает!)"},{"t":"p","h":"Булар экинчи сүйлөшкөн жок."},{"t":"p","h":"Күйөө кеткенден кийин кыз бир топ күнгө тилсиз немедей (как немая) болуп жүрдү. Менин кубанычым койнума батпай (я был счастлив), кыз ошого тийбесе экен деп жүрдүм."},{"t":"p","h":"Бир күнү кыз жатууга даярданып, жибек жууркандарын толкундатып силкип жатып:"},{"t":"p","h":"– Бөбөгүм! – деди мага жылмайып, – сен төргө мага жакын жат. Мына бул жуурканды салын, – дсп кара кашка ыпча жуурканды төргө таштады да: – Жаздыктын бирин алып жазданып ал. – деди,"},{"t":"raw","h":"<div class=\"gloss\"><p>кербезлиги ого бетер күчөдү – еще больше звупрямилась<\/p><p>жайд

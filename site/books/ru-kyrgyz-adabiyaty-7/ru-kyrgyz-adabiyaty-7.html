й консультанты, 1987-жылдан баштап «Ала-Тоо» журналынын башкы редактору."},{"t":"p","h":"Чыгармачылык жолун (творческая биография) 1958-жылы «Түш» деген аңгеме жазуу менен баштаган. Алгачкы китеби «Жашоо кумары» деп аталат. Жазуучунун айрым чыгармалары орус, казак, украин, араб (Ливанда) тилдеринде басылып чыккан."},{"t":"p","h":"Кенеш Жусупов кыргыздын улуу акыны Алыкул Осмоновдун өмүрү жана чыгармачылыгы жөнүндө «Ыр сабындагы өмүр» («Жизнь в стихотворных строках») документалдык баяны үчүн 1975-жылы республикалык Ленин комсомолу атындагы сыйлыкка (премия) ээ болгон."},{"t":"p","h":"Ашым Жакыпбеков менен бирдикте «Манас» эпосун кара сөз түрүндө жазган. Ошондой эле Кеңеш Жусупов балдар үчүн да «Манас» эпосун кара сөз менен жазып, аны 1995-жылы эпостун миң жылдыгына карата басмадан чыгарган. Жазуучу 1991 – 2002-жылдардын ичинде «Кыргыздар» аттуу беш томдук түзгөн."},{"t":"p","h":"Кеңеш Жусупов – Кыргыз Республикасынын искусствосуна эмгек сиңирген ишмер (1991-жылы), Кыргыз Эл жазуучусу (1999-жылы). Жазуучуга 2004-жылы Токтогул атындагы Мамлекеттик сыйлык ыйгарылган. Прозанын бардык түрлөрүндө эмгектенген жазуучунун «Кыргыздардын байыркы маданияты» аттуу публицистикалык илимийпопулярдуу ой толгоосу да жарык көргөн. «Каралдым, тоолор», «Микеланджело мекенинде», «Жүрөгүм менин тоолордо», «Күлгүн курак», «Кан жолдогу ойлор», «Тоолуктар баяны», «Тулпар» деген чыгармалары жана «Жан шерик» китеби жарык көргөн."}],"sub":[{"title":"Б. Жакиевдин «Атанын тагдыры»","b":12},{"title":"6 «Атанын тагдыры»","b":30},{"title":"Биринчи көшөгө","b":34},{"title":"Төртүнчү көшөгө","b":86},{"title":"Туура жактары","b":155}],"section":"АКЫНДАР ПОЭЗИЯСЫНАН","pages":[75,87]},{"title":"«Ыр сабындагы өмүр»","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"88\">88<\/span>«Ыр сабындагы өмүр»"},{"t":"p","h":"«Ыр сабындагы өмүр» 1973-жылы «Ала-Тоо» журналынын № 12 саныида жарык көргөң (опубликован), А. Осмоновдун акындык да, адамдык да касиеттерин (свойство, черта), чыгармачылык татаал жолун ар тараптан көрсөткөн чыгарма. Мазниси жагынан (по смыслу) ал эссеге жакын."},{"t":"p","h":"Эссенин идеялык-композициялык мазмунун: «Алгачкы махабат баяны», «Асыл жар жана перзент», «Көл кылаасы», «Акындын тамы», «Уч устат», «Акын казынасы» деген алты бөлүм түзөт. Чыгарманын негизги мазмуну «Алгачкы махабат баяны» деген бөлүмдөн башталып, мында акындын педагогикалык техникумда окуган жылдары, дүйнө адабияты менен таанышуу. акындык биринчи кадам, эң башкысы Алыкулдун алгачкы махабаты баяндалат."},{"t":"p","h":"Мындан кийинки «Асыл жар жана перзент», «Көл кылаасы», «Акындын тамы» бөлүмдөрүндө А. Осмоновдун өмүр жолуна (биография) байланышкан окуялар айтылса, кийинки эки бөлүмүндө («Үч устат», «Акын казынасы») акындын жан дүйнөсү, адамдык сапаттары сүрөттөлөт. Ошентип, так факты-материалдардын негизинде жазылып, бирин-экинчиси улап, бирин-бири толуктап турат."},{"t":"v","l":["Жаңы сөздөр:","мазмуну – содержание","кэл кылаасы – берег озера","Тааныш сөздөр:","жан дүйнөсү – душа","жар – супруга, жена"]},{"t":"p","h":"устат – мастер (6-класс 51-бетте; Токтогул Сатылганов жөнүндө тексттен: Акын ошондой эле Калык, Алымкул, Коргол. Барпы ж. б. жаш акындарга устат болуп, акындыктын сырын үйрөткөн.)"},{"t":"p","h":"казына – сокровищница {6-класс 29-бетте; «Эр Төштүк» эпосуман: Жети там толгон казынаны ачып, жеткен элдин баарына зарып кылып чачып, жыргап-куунап жатып калышты дейт.)"},{"t":"v","l":["«Асыл жар жана перзент»","А. Осмоновдун көп жылдан берки","жазбай жүргөн ырынын төлү – «Бөбөккө».","Ырды адегенде «Бешик ыры» деп атамакчы","(хотел назвать) болуп, кийин «Бөбөккө» деп","оңдогон (исправил).","«Бөбөккө» деген ыр Алыкулдун","өмүрүндөгү жана чыгармачылыгындагы","өткөн бир чагылган сыяктуу. Ушул ырдан —чвгылгаи_ молния"]},{"t":"p","h":"тартып десек болот, Алыкулдун акындык жолу шыдыр кетип-эдесь жолу шыдыр кетип, жашыл чөбү бүрдөп, начннастса творчество жан дүйнөсүнүн дарбазасы ачылат, булактын Жашыл чөбү бурлеп – расцветает көзүн бууган ташты алып салгандай ыр оргуштап агат."},{"t":"p","h":"<span class=\"pg\" data-n=\"89\">89<\/span>Алыкулдун өмүрүн кайрадан жандыралы: ымыркайынан каран калгыр жетимчилик баштан өттү. Ал бой тартканда жалгызчылык иттей тажаткан (надоело). Акыры Алыкул өмүрлүк асыл жар күтүп, башына баш кошулду. эми гана наристенин күлкүсүн көрүп, «балбан турмуш түбү калың болсо да, керек жерин жара таап кирерде» жарыкчылыкка он беш күн гана келип-кеткен кызы Жыпары 1942-жылдын 9-февралында бир жылт этип, өчкөн чырактай жалп этти. Алыкулдун башынан далай азган, жүдөгөн оөр күндөр өтсө да, «эч мынчалык ууланбаган» жүрөгү ансыз да ынтымагы ыдыраган асыл жар менен Алыкулдун көңүлү бирбирине хайт болуп, бара-бара ажырашып кетишти (развелись)... Ушундайда Чыгыш элдеринин бир акылман акынынын накыл сөзү эске түшөт; «Бакыт деген эч качан өзү басып келбейт. а кайгы чиркиниң күттүрбөй эле бейкапар чуркап эле кирип келет»."},{"t":"p","h":"Кызы чарчагандан бир жыл өткөндөн кийин өмүрүндөгү оор касиретин, адам эмеспи, Алыкул дептерине минтип жазып жиберген экен: «Мен адамзатты жаман көрөм, себеби, ал бөбөктү өлүм үчүн тууйт. Адамды өлүм үчүн жаратат (создает)». Акындын өксүгөнүн туура түшүнөлү. Акын адамзатты жок көрүп айткан жери жөк, кайра адамзаттын өмүрү, асылдыгы үчүн (за ценность) асан-кайгы тартып! жатпайбы!"},{"t":"p","h":"1942-жылдан бери, эки жылдан ашуун мезгил өттү. Алыкулдун ыйы. ууланган жүрөгү, кайгысы баштагыдан басаңдайын деп, оор жарааты айыгайын деди: акын кайрат кылып, эсине кирип, тагдырына көнө баштады. Бая-гы бээ-жаа кайгы эми эскерүүгө айланып баратты. Алыкул өткөн күйүтүн (огорчение, горе, печаль) кагазга өчүрбөй, көзү өткөнчө ала жүргүсү келет. Аны үчүн жакшы ыр жазыш керек."},{"t":"p","h":"Каңырыгы түтөп муңканган, жүрөгү ууланган акындын ырын окуганда кыргыз"},{"t":"raw","h":"<div class=\"gloss\"><p>карзы калгыр – выражение о бедном положении эчкен чырактай жалп этти – погасла как свеча<\/p><p>азган – голодный и холодный. ислудавший<\/p><p>жудегом – замученный. похудевший. осунупший<\/p><p>көңүлү кайт болуп – остыли чувства. разлюбили друг-друга<\/p><p>кайгы чиркиниң – презренная тоска<\/p><p>бейкапар – беспечный, беспечно<\/p><p>касире! – печаль, скорбь<\/p><p>эксугону – потеря. нехватка состояние человека, утратившего своего близкого канырыгы түтөп мункинган – очень растросн, опечален, тоскует<\/p><p>жүрөгү ууланган – сердце отравлено<\/p><\/div>"},{"t":"v","l":["<span class=\"pg\" data-n=\"90\">90<\/span>элинин байыртан бери айтылып келаткан","күйүттүү кошокторун (песнь по умершему)","уккаисып кетесин.","«Алтын да бар, асыл да бар элдерде","Не бир түркүн сонундар бар дүйнөдө.","Ошончолук кымбаггардын ичинен"]},{"t":"p","h":"Атасы учун бөбөккө тен жок эле...» эртеңкиге тобокел кылып – Ыр сонунда Алыкул эртенкиге тобокел рискнув и решившись на будущее кылып, белди бууп, майышпай, кайра кайрат белди бууп – собравшись. кылып чыйралат да, артына жакшылык ти- подтянув пояса леп, бала жоготуу, өзөктү өрттөгөн кайгыны, мяйышпай – не согнувшись, бейпай күндү башкаларга ыраа көрбөйт. чыйралат – делается сильным, не горюя Эмне үчүн адам кайгысын башкаларга ыр закаляется менен айтышы керек? Алыкул жүрөгүн кайгы мыкчыса да, акын дитинде сулуулук, поэзия жөнүндө дайыма ойлогон, Ал өз күйүтүн бейпай күндү ыраа көрбөйт – не желает никому пережить оор үшкүрүк кылып, муң менен айткан жок."},{"t":"p","h":"такие горькие дни Акын акыры бир түндө уктабай чымырка- кайгы жүрөгүн мыкчыса – мып, күйүтүн ыр менен айтты. Акын улуу сели даже горе затронуло его милдетин (великий долг, объязанность) унут- сердце пады. Ичиндеги өрт сыртка жарык болуп чык- дитинле – в помыслах и желаниях ты. Алыкул оор жүгүнөн жеңилденди, кайгычымырканын – напрягаясь, сынан кутулду (избавился, спасся)."},{"t":"p","h":"набравшись силы и энергии Ал бирөөлөр мага боор оорусун дебеген, же элге көрүнөйүн, же лаңк алайын лалалаг кылбаган – не стремился деп далалат кылбаган. Чыдап тура ал- к жалости, к славе бай, өзүнүн сезимин, дүйнө, тиричиликтен коруп-гуйганы – чувство көрүп-туйганын кагазга түшүрдү."},{"t":"v","l":["Тааныш сөздөр:","асан-кайгы тартып – горюст, переживает","догадливости, интуиция","","Ш"]},{"t":"p","h":"асан-кайгы (5-класс 26-бетте; «Акындар поэзиясынан:» Булар легендарлык – Асан кайгы, Жайсан ырчы. Токтогул сыяктуу жана башка акындардан башталган Жеңижок. Токтогул Сатылганов, Барпы Алыкулов. Калык Акиев өңдүү төкмө акындардын ноэзнясы."},{"t":"p","h":"|) Асан кайгы Асан-горемыка (персонаж казахских и киргизских сказок, искатель праады);"},{"t":"p","h":"2) печаль беспросветная, горе безысходное. горе горьхое; Кыргызча-орусча сөздүктөн. түзгөн К. К. Юдахин «Советская энциклопедия» басмасы. Москва – 1965. 318-бет."},{"t":"p","h":"накыл сөз – мудрое слово (7-класс 1-бетте: Элдик оозеки чыгармаларда санжыргалуу сөз берметтери, учкул сөздөр, накыл кептер көп кездешет"},{"t":"p","h":"накыл кетер – поучительное предание: мудрые поучения) бэ›-жаав кайгы – грудное горе (6-класс 52-бетте; Токто: улдум «Балалык» ырынан:"},{"t":"p","h":"Бешке жашы чыкканда,"},{"t":"v","l":["Кайгы. капа ойлонбой,","Жайнап турат балалык."]},{"t":"p","h":"7-класс 34-бетте: Тоголок Молдо жөнүндө тексттен: Улуу Ата Мекендик согуш <span class=\"pg\" data-n=\"91\">91<\/span>мезгилиндеги чыгармаларында бул согуш бүт элге кайгы алып келгендигин айтып, элди ынтымакка, душманга катуу сокку урууга чакырып, душман акыры женилет деген ишенимди билдирет."},{"t":"v","l":["7-класс 47-бетте; Л. Токтомушевдин «Какшаалдан ка!» поэмасынан:","Боору таш кандай жараткан,","Туш кылды мени каяктан?","Он төрткө толбой курагым,","Кайгыны башка курадым.)"]},{"t":"p","h":"эскерүү – воспоминание (7-класс 29-бетте; Калык Акневани «Жокчулук» ыры жөнүндө: Калыктын «Жокчулук» деген ыры анын балалык жана өспүрүм кези жөнүндө эскерүү катарында жазылган.)"},{"t":"p","h":"муң менен – с печалью. с тоской (7-класс 45-беттс; А. Токтомушевдин «Какшаалдан кат» позмасынаи:"},{"t":"v","l":["Карааныңды элестетип,","Ойго батам, сагынам!","Бүт муңумду күрмөп жутуп.","Куса болуп зарыгам.","","Таншырмалар.","муңду күрмөп жутуу- глотать","печаль, тоску.)","","1. «Ыр сабындагы өмүр» биринчи жолу качан жарык көргөн?","2, Ал канча бөлүмдөн турё!? Бөлүмдөрүн атагыла.","3. Мавииси жагынан бул кандай чыгарма?","4. А. Осмоновдун «Бөбөккө» деген ыры кимге арналган?"]},{"t":"p","h":"$, Эмне учун К. Жусупов, А. Осмоновдун бул ырын күйүттүү кошокко свлыптырат? ХЭ «Ыр сабындагы өмүр» эссесинии мазмунун айтып бер. «Бөбөккө» деген ырдан"},{"t":"h3","h":"кийин акындын ички луйнесунле, чыгярмачылыгыпда кандай бурулуш болду?"},{"t":"p","h":"Кеңеш Жусуповдун улуу акын Алыкул Осмонов жөнүндө өз ой-пикирин жөнөкөй баяндоолор (рассказы) аркылуу, архивдеги материалдар менен далилдүү, ынандыраарлык (убедительно) кылып билдирет. А.Осмоновдун өмүрүн, чыгармачылыгын сүрөттөөдө (описание, зарисовка) эркин түрдө"},{"t":"p","h":"Бул үзүндү А. Осмоновдун көл жээгиндеги турмушу жөнүндө баяндайт. Акын өпкөсүнөн оорулуу болгондуктан, врачтын шаардан сыртта көлдүн жээгинде жаша деген кеңеши менен көлгө барган. Анда эл-жер менен таанышып, ырларды жазган, котормо көтөргөн, эс алып ден соолугуна көңүл бурган. Бирок, акын бул оорусунан айыга алган эмес. Ал узак оорудан 1950-жылы 35 жашында каза болгон."},{"t":"h3","h":"Көл кылаасы"},{"t":"p","h":"кол кылаасы – побережье озера Алыкул Осмонов куштарча (словно птицы) көл жээги менен конуш тандап жүрүп, 1944-жылдын жайында Түп районундагы Ичке-Сууга келген... Тоо этегинде Ичке-Суу кыштагы бар. Ал кезде Ата Журт башынан оор майдан кыжалаты (переживание) бүтө элек. Кырк төртүнчү жылдын жайында Алыкул Осмонов Чоң-Жайлоо, Арпа-Тектир сыяктуу, «атыр жел, <span class=\"pg\" data-n=\"92\">92<\/span>күмүш булак салкын жайлоолоруна», Каркырага чейин ат менен жүрүн, берешен (гостеприимный) колхозчулардын кымызын ичип, этин жеп, үлпөт-сыйын (почёт, уважение, угощение) көргөн. Айылдардан Шотанын дастанын жатка билген кишилер менен жолукту. Тинатин деген кыздарды эркелетти (ласкал). Акын жөнүндө ошондо жылкы ферма болгон Ишенбай Абакиров, башкарма болгон Жумадил Черикбаевдер азыр эскерет. Түп тараптан Алыкул «Каркыра», «Сырт жайлоо», «Түп суусу», «Букен» ж. б. ырларды таап кайткан. Бул эс алууда Алыкул оңоло түштү (поправился, набрал силу), көңүлү көтөрүлдү. Эл-жердин берекесине ыраазы болуп, өзүнө дем-кубат (энергия) алды."},{"t":"p","h":"Ичке-Суудан кеткенден кийин Алыкул Осмонов көлдүн жээгине байыр алууну чечти. Ал өзгөчө көлдөгү Кой-Сары деген эс алуучу жерди жактырган."},{"t":"p","h":"Алыкул Осмонов Кой-Сарыга биринчи саам күз айлары келди. Кой-Сарыдагы «Чар уя» деген куроргтун ээнсиреген узун тамында жалгыз жашады. Алыкул «Чар уянын» ээн талаасында кечке жуук, эртең менен басып жүрөт. Ал кээде кара жерден кочуш топурак алып, аны жыттап, жер үстүнө салаасынан чууртуп келет. Айдарым талаага түшүп, чөп баштарынын ыргагын, ар бир курткумурсканын кыймылын карайт. Торгойлоруна кулак түрүп, асмандагы ак булутту узатат, чөптөрдү да жыттайт. Акынды мыжыккан «Мен киммин?» деген ой... Ар адам суроонун жандырмагын Алыкулча акылмандык менен чече алабы?!"},{"t":"p","h":"Мен киммин? Бир жай адам Алыкулмун. Эгерде жаза албасам алсыз кулмун. Томсоруп кол куушуруп өтүп кетсем, Заманга анда менин кайсы кунум?!"},{"t":"p","h":"Тааныш сездер:"},{"t":"p","h":"майдан – поле битвы, фронт (6-класс 129-бетте: Мукай Элебаевдин «Улуу марш» ырынан:"},{"t":"v","l":["Улуу марш, улуу сынга,","Сал барын, эч аянба!","Эр жигит эми келди,","Сыналчу зор майданга!)"]},{"t":"raw","h":"<div class=\"gloss\"><p>жатка билген киши – человек, знающий наизусть его поэмы<\/p><p>байыр алуу – обосновался салаасынан чууртуп – пропуская между пальцами<\/p><p>айдарым талаа – открытое поле, где дует легкий<\/p><p>чөп баштарыный ыргагы – ках шелестит трава<\/p><p>мыжыккан ой – мучающая мысль<\/p><p>суроонун жандырмагы – отгадка, ответ на вопрос акылманлык менсн чече алуу – решить с мудростью<\/p><p>кун – здесь: цена, стоимость<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"93\">93<\/span>эскерет – испоминаст (7-класс 29-бетте; Калык «Жокчулук» ыры жөнүндө: Калыктын «Жокчулук» дешен ыры анын балалык жана ,"ht":542},{"t":"p","h":"Кыргыз элинин белгилүү жазуучуларынын бири Аман Саспаев Түп райо-нунун Кең-Суу айылында 1929- жылы 15-октябрда туулган. Атасы Саспа 1930- жылы каза болгондон кийин апасы майда балдары менен төркүндөрүндө (у родственников) жашайт. 1933-жылы колхоздештуруу убагында апасын «байдын тукуму» деп коллективдешкен чарбага кошпой коёт. Себеби, апасынын чоң таятасы миң жылкылуу Сарыбай деген бай болгон экен."},{"t":"p","h":"Аман Саспаевдин үй-бүлөсү Кытайга жөө качып жөнөгөндө (когда бежали пешком) болочок жазуучу 4-5 жаштарда экен. Алар Кытайдын Кулжа деген шаарына бир ай дегенде жөө жетишет. Апасы Имаш деген кишиге күйөөгө чыгат. Ата-энеси ал жердеги бай уйгурларга малай болуп иштешет. Тогуз-Торо деген уезддин Моюн-Кузер деген жерине көчүп барышат (переезжает). Ошол жерде мектепте окуп, арабча кат <span class=\"pg\" data-n=\"94\">94<\/span>тааныйт. Эптеп жашоо үчүн алар Жаңы-Шаар деген шаарга көчүп барышат. А. Саспаев ал жерде 4-класска уйгур мектепке кирет. Ал жакшы окугандыктан, ата-энеси Кулжа шаарына «Казак-кыргыз уюшмасынын» мектебнне беришет. Аман Саспаев эң жакшы окуган үчүн, өкмөттүк гимназняда жатакана (общежитие), тамагы бекер (кормили бесплатно) окутчу экен. 1944-жылы Кулжа шаарында дүрбөлөң (переворот) башталып, өкмөт алмашат (меняяется власть). Аман Саспаев окуусун токтотуп, Жаңы-Шаарга ата-энеси турган шаарга келет, анда ал уйгурча, казакча гезиттерге атайын кабарчы (специальный корреспондент) болуп иштейт. Дүйнөлүк (мировая) адабияттын акын-жазуучуларынын чыгармаларын кызыгып окуйт. 1952-жылы кытай тилин үйрөнүп баштайт, Пскиндеги Борбордук Улуттар институтунуна тил факультетинде кытай студенттерине казак тилин окутат."},{"t":"p","h":"А.Саспаевдин чыгармачылык жолу 1945-1946-жылдарда башталат. 1946-жылы А.П.Чеховдун «Хамелеон», И.А.Крыловдун «Бай менен малай» деген чыгармаларын казак тилинен уйгур тилине которот. 1956- жылы А. Саспаев уйгур тилинде Казакстан менен Орто Азия элдеринин жыргалдуу турмушун (счастливую жизнь) сүрөттөгөн чоң очерк жазат. Анын эки бөлүгү Кыргызстанга арналат. Бирок, ал өз Мекенине – Кыргызстанга келүүнү дайым самап жүрөт (мечтает). Акыры көп кыйынчылык мснен 1962-жылы өз Мекенине кайтып келет. Кыргызстанга келер мснен Кең-Суу айылында бир аз убакыт талаачылык жумушта тракторист болуп иштейт да, чыгармачылык ишин улантат. 1967-жылы Ысык-Көл өрөөнү боюнча Кыргызстан Жазуучулар Союзунун консультанты бөлүп иштейт. Кийин Москвадагы Горький атындагы СССР жазуучулар Союзунун институтунда окуйт. 1963-жылдан тартып А.Саспаевдин чыгармалары Кыргызстандын газета, журналдарына үзгүлтүксүз (непрерывно) чыгып турду. Анын биринчи китеби «Гүлкайыр» деген ат менен 1966-жылы жарык көргөн."},{"t":"p","h":"Жазуучунун айрым аңгемелери орус, француз, кытай, латыш. татар, башкыр, казак, уйгур, каракалпак тилдерине которулган. Ал өзүнүн чыгармаларын уйгур, казак тилдеринде эркин жазат."},{"t":"p","h":"Аман Саспаев узак жылдар бою талыкпай кытай тилин изилдеп отуруп, «Кытайча-кыргызча сөздүк» түзгөн, ал сөздүгү 55000 сөздү камтыйт, 2003-жылы жарыкка чыккан."},{"t":"p","h":"Аман Саспаев – Кыргыз Республикасынын маданиятына эмгек сиңирген ишмер, Караколдогу Касым Тыныстанов атындагы Ысык-Көл Мамлекеттик университетинин профессору."},{"t":"p","h":"А. Саспаев – көптөгөн роман, повесттер жана аңгемелер жыйнактарынын автору. Жазуучунун «Майда толкундар», «Хадизат», «Мурат», «Ыйык сезим» аңгемелер жыйнактары, «Тоо чабалекейи» романы (1989- жылы), «Чыгышка назар» илимий макалалар жыйнагы (2002-жылы) бар. Аман Саспаев өзүнүн чыгармаларында Кытайда жашаган кыргыз эмигранттарынын жашоосун жана социалдык абалын чагылдырган (отражал)."},{"t":"h3","h":"<span class=\"pg\" data-n=\"95\">95<\/span>«Татым туз» ангемеси"},{"t":"p","h":"Өз аңгемеси жөнүндө Аман Саспаев өз өмүр баянында (в своей автобиографии): «Балдар, силер окуй турган «Татым туздун» «үрөнү» мен Кытайда жүргөнүмдө эле себилген. Мекенинен айрылып алыста жүргөн адамдардын тагдыры мен үчүн барып турган трагедия болучу», – деп айткан."},{"t":"p","h":"А. Саспаев «Татым туз» аңгемесинде бир жагынан эл-жеринен ажыраган адамдын трагедиясын (трагедию человека лишивщегося Родины), экинчи жагынан ошол эч кимге белгисиз карапайым кыргыз карыясынын Мекен, эл жөнүндө кандай бийик жана таза сезимдерди алдейлеп, кандай улуу сагыныч, сөз жеткис кусалык менен жашап өткөнүн (прожил) баяндайт, Алыскы Кытай жергесиндеги уйгурлар жашаган бир маалага отуздун орто белиндеги Келгинбай деген жалгыз үйлүү кыргыз келип, бир нече жыл жашап калды. Ёрккөн эл тууган жерге (в родные края) кетебиз деп камынганда ал катуу өоруп, өрто жолдо жаткан."},{"t":"p","h":"Мекенге кетер алдында Келгинбайдын атасы сакалынан ылдый жашын куюлтуп, келини Оймокчонго: «Жарык дүйнөдө жалгыз балам эле, ал сага аманат! Маа топурак өз эл, өз жерден буюрсун... Неберемди энеңдин этегине салып бер, балам, жыттап жүрөйүн» – деди."},{"t":"p","h":"Каршылык кылмак беле, Оймокчон элге көргөзбөй көз жашын көлдөтүп, баласын кайненесине карматты. «Мобу түйүнчөктү катып кой. Кокус ары бурудуп кетсе (если он умрёт), сууга эзип оозуна тамыз. Айыгып мал болсо (если он выживет), колуна бер», – деди кайната жөнөп жагып. Суусу түгөнбөптүр, Келгинбай келтеден айыкты. Бирок чек ара жабылып. элине кетүүгө кеч болуп калган, арга канча, ал ошол жерде жашоосун улантты. Арадан отуз жылча убакыт өтүп абышка болгондо, анын башына кайрадан оор кайгы түштү (судьба ему послала ещё одно испытание). Кытайды гомииьдандыктар бийлеп турган мезгилде бут элди келте каптап, бул алаамат Келгинбайдын кемпири Оймокчонду да алып тынды (забрала), кырк жыл бирге жашаган жан шерик жары менен түбөлүккө коштошту (попрощался навеки)."},{"t":"p","h":"Өмүр өзүнүн канчалык кайгы-касиретин берип койсо да, үмүт менен убакыт алдында алар ар качан дармансыз. Ошондой үмүт менен жашаган Келгинбай тирилигине киришти: үй ичин жыйнады, чачылган бирдемелерин иреттеди (привёл в порядок). Анан жаман талпагына жайланып отуруп, чөнтөгүндөгү түйүнчөктөн бармактай (малкженький) туз алып чыкты. Бул бая-гы атасы Мекенге кетип бара жатканда келини Оймокчонго аманат калтырган түйүнчөк, анда катылган бармактай туз бар. Карыя тузду жалап, шербет даамданган шилекейин кумарлануу менсн (с наслаждением) жутуп жатты. Нечен кыйынчылыкта ал тузду жалап, Келгинбай кам көнүлүн көтөрүп {поднимал своё настроение), өзүн-өзү жооткоткон (сам себя успокаивал). Анткени «өз жеринин бир татым тузу Келгинбай чалдын өмүрлүк колдоочусу <span class=\"pg\" data-n=\"96\">96<\/span>(пожизненный покровитель), үмүт менсн ишеним берүүчүсү, сагыныч менен кусалыгын таркатуучусу (рассеивал тоску по Родине) болуп калган эле."},{"t":"p","h":"Аңгеменин экинчи бөлүмүндө Оймокчон эки уул, бир кыз төрөп, алардын экөө чарчап, Эшбол аттуу баласы касиреггүү чалга эрмек болуп (стал утехой) аман калганы, анын окууну бүтүп мугалим болуп иштегени, анан гоминьданчылар аны кармап кетип, ошол бойдон лайыны чыкпай кеткени (пропал без вести) жөнүндө сөз болот."},{"t":"p","h":"Аңгеме өтө кайгылуу, армандуу (печально) аяктайт. Баласы Эшбол окко учуп өлөт, муну уккан абышка алҗый баштады (начал выживать из ума). Анын адам болбосун байкаган уйгур кошунасы үйүнө киргизип алды. Акылдан адашкан абышка: «Кечээ Эшеним келип, бүгүн муунум кирип калыптыр. Элге кетет окшойбуз. Менин чоң арманым эле Эшенимди эл-жургуна кошуу...» – деп жөөлүйт (бредит)..."},{"t":"p","h":"Акылдан адашкан абышка өзүнүн монологунда Мекенинин татым тузун медер түтүп (возлагает надежду), андан кайрат алып (получает вдохновение). сагынычыи да ушул туздан жалап таркатканын. ал үчүн татым туз эң кымбат нерсе экендигин айтып, эл-жерден ажырап. куса болуудан өткөн азап жок экендигин айтат (говорит о тим, что нет большего мучения, чем потеря родных мест и тоска по ней). Жокчулуктун кордугун, бирөөнүн зордугун көргөндө да, өлүп калуудан коркпогон, бирок өз конушун ата көрбөй өлүп каламбы деп корккон (боялся умереть, не увидев родные места), керген кордугуна ызаланбаган, эл-жерден адашып калганына ызаланган адамдын елум алдындагы керээзи, арманы. Мекендин татым тузунун сыры да абышканын дал ушул монологунда ачылат."},{"t":"v","l":["Жаңы сөздөр:","татым гуз – щепотка соли","карапайым – простой","алдейлеп – делся","үрккөн эл – переполошившийся народ","камынганда – готовились","сакалынан ылдый жашын куюлтуп – проливая слёзы","аманат – что-либо (оставленное на хранение)"]},{"t":"p","h":"эмеңдин этегине салып бер – заверни в подол своей матери (эдесь: свекрови) каршылык кылмак беле – не сопротивлялась"},{"t":"v","l":["көз жашын келлетуп – проливая слёзы","гуйунчек – узелок","келте – тиф","– печаль. скорбь","лармансыз – бессильный","талиак – выделанная шкура зверя, животного, служащая для подстилки","шербет даамданган – имеющий привкус сладкого напитка","касиретгу\\ – скорбный","Тааныш сөздөр:"]},{"t":"p","h":"жалгыз үйлүү (жалгыз түгүм) – сдинстаенная семья (5-класс 101-бетте; Мукай Элебаевдин «Зарлык» внтемесинеи: Ойлогондой эле жаңкы тумшуктун түшө калтан жеринде жалгыз үй бар экен.)"}],"sub":[{"title":"«Татым туз» ангемеси","b":10}],"section":"АКЫНДАР ПОЭЗИЯСЫНАН","pages":[94,96]},{"title":"«Татым туз»","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"97\">97<\/span>«Татым туз»"},{"t":"p","h":"Суу айрыгына жакып, саздакка чыккан кыяк чөптү ыктап жалгыз түтүн кыргыз жашады... Ал жерде ушул күнгө чейин төрт түтүн уйгурдун эски тамы сакталып турат. Элдин айтымына караганда. нигерки бир жылдары көп кыргыздар ушул жакка ооп келип. кайткан имиш. Ошолордон Келгинбай аттуу бир түтүн кыргыз ушул жерди мекендеп калыптыр. Ал кезде Келгинбай отуздун орто белине келип калган жигит экен да, оор келте (тиф) оорусуна кириптер болуптур (заболел). Сапарга шаны кслбегендиктен (т. к. не мог выдержать дальней дороги) анын зайыбы (жена) Оймокчон элден бөлүнүп, күйөөсүн айыктырып алууга бел байлайт (намеревается). Ошентип, алар чет жерди мекендөөгө аргасыз болушат (были вынуждены). Келгинбайдын туугандары ыгым-чыгым (расходы), кепин-акыретин (саван) даярдап берип:"},{"t":"p","h":"Оо, Оймокчон! Эр деп этегинен кармап калдың. Кор болбоссуң. Ата-бабалардын арбагы колдоп эрди элине кош! – деп чуркурап бата беришет. Келгинбайдын тагдыры Оймокчонго тапшырылгандан кийин кайнатасы сакалынан жашын куюлтуп туруп, көптүн алдында мындай деди:"},{"t":"p","h":"Жар дүйнөдө жалгыз балам эле, ал сага аманат! Маа топурак өз эл, өз жерден буюрсун."},{"t":"p","h":"Карып калган кезимде кудай элден ажыратпасын (айрыбасын; не лишит). Неберемди энеңдин этегине салып бер. балам, жыттап жүрөйүн... – Оймокчон эмчектсги баласын (грудной ребёнок) кайненесине карматып, көз жашын элден жашырып сыкты."},{"t":"p","h":"Мобу түйүнчөктү катып кой. – деп тапшырды кайнатасы акыркы жолу. – кокус ары бурулуп кетсе, сууга эзип оозуна тамыз. Айыгып мал болсо, колуна бер."},{"t":"p","h":"Сурлуккен кыргыздар (волочившие еле <span class=\"pg\" data-n=\"98\">98<\/span>ноги кыргызы) жөө-жалан мекенине сапар че- ГИШТИ (отправились). Өнү көгүлтүр тартып (лосинен), эрди кеберсип онтогон Келгинбай жан күйөөрү жалгыз Оймокчондун колунда калды. Оймокчон жанын сабап, күйөөсүн тегеренди... Койгулт көзүнөн жашы Мөлтүрөп, күйөөсүнүн башын кучактап, далай түндөр уктабады. Алектүү күндөр өтө берди... Чачы жылма (всё до одного, начисто) түшүп, жаак эти шылына баштаганда Келгинбай эсин жыйды. Күнүнө бир чайд90с (чайник) кайнаган суу ичип, тамыры тышымни тепкен ичке манжаларын кармап коюп төшөктө узак жатты. Оорудан айыкканда, элине кетүүгө кеч болуп калган эле. Келгинбай мыйзамга баш ийди да, ошол жерде узак жылдар жашап калды. Ортодо отуз жыл убакыт өтүп, Келгинбай абышка атанган кезде кайрадан башына арылгыс оор кайгы түштү. Гөминьдандык желдеттер (солдаты) бийлеп турган оор жылдары калың журтка келте оорусу тарады. Өлүм-житим көп болду. Далай үйдөн түбөлүккө түтүн чыкпай калды. Уезддик шаардын тегерегиндеги дөбөлөр калын мүрзөгө (могила) айланды. Өлүм күчөгөн сайын (ло мере того, как увеличилось количество смертей) замбилге салган өлүктү эки киши көтөрүп чыгып, туш келди жер казып көмө башташты. Кепиндик ак табылбай, жууркандын шейшебин пайлаланышты, элде шейшеп аттуу жоголгон соң, кээ бирөөлөр өлүктү камыштан токулган бойрого (циновка из камыша) же жаш бслеге (молодой клевер) ороп кеме турган болушту... Дал ушул оор алаамат Келгинбай чалдын кемпири Оймокчонду да жалмап (хватая) жолго тушту. Шордуу (горемычный) чал кемпирин шейшебине ороп көмдү. Көр казып жан баккан киши менен чалдын кошунасы жана өзү болуп Оймокчондун сөөгүн үч эле киши жерледи."},{"t":"raw","h":"<div class=\"gloss\"><p>суу айрыгы – рукав реки<\/p><p>саздак – болото, болотистое место,<\/p><p>кыяк чон – трапа с режущими листьями<\/p><p>оой келип – переехал<\/p><p>кайткан имиш – вернулись сакалыпаи жашын куюлтуп – пуская слезу по щеке жар дуйнеде (жарык дуйнодо}- на белом свете<\/p><p>тоиурак буюрсун – быть похороненным на родной земле<\/p><p>эиеилин этегине салып бер – злверни подол матери (отдай матери)<\/p><p>тамыз – капни<\/p><p>айып ып мал болсо – если пыжиаст<\/p><p>эрди кеберсип – потрескавшиеся губы<\/p><\/div>"},{"t":"p","h":"Кемпирин кеемн. толурагын чочойтушуп болгондон кийин чал мүрзө башында күңгүрөнүп (издавая глухие звуки) узакка <span class=\"pg\" data-n=\"99\">99<\/span>отурду. Кырк жылга жуук (жакын) жашаган жары менен коштошуу онойбу? Жан шеригинин буткул жоруктары чалдын кез алдынан биринен сала бири өтүп жатты. Чындыгында ал жалгыз кемпири менен гана эмес, турмуштун жылуу койну менсн да коштошуп жаткан эле. Кайраттуу чал мүрзө башынан турган соң этек-жеңин кагып, чолок жашын (набежавшая слеза) алаканы менен аарчыды да, үйүн көздөй басты."},{"t":"raw","h":"<div class=\"gloss\"><p>жанын сабан – что есть мочн. букв.: нахлёстывая свою душу көзүнөн жашы мөлтүрөп – слегка дрожа. поблёскивах слёзы на глазах<\/p><p>алектүү күндөр – хлопатливые дни жаак пм шылына баштаганда – исхудал; бука. на челколах скулы отошли тамыры тышына топкен ичке<\/p><p>манжалар – тонкие пальцы с выпуклыми сосудами<\/p><p>абышка атаган кезде – когда стал старцем арылгыс оор кайгы – нспраходимая тяжслал печаль<\/p><p>уйдем түтүм чыкпайт – дома остались без жизненными<\/p><p>кепиндик ак табылбай – не найти ткань для савана (на покойника)<\/p><p>алаамат – страшное народное бедствие кер казын жан баккан киши – могильщик<\/p><p>жерледи – похоронили<\/p><p>топурагын чочойгушуп – собрав небольшую горку земли<\/p><\/div>"},{"t":"p","h":"– Оо, кудурет (всемогущий), тарт аманатынлы! (прикрати бедствия). Эми кор кыла көрбө! (не унижай больше). – Чал көзүнүн жашын сакалынан ылдый куюлтуп, ээн үйдө узак ыйлады. Ботосу (верблюжонок) өлгөн каймал (верблюдица) гана ушундай боздомок (плакать, кричать, реветь). Келгинбай чал өзөгүн өрттөгөн дартты көз жашы мемнен жууп кетиргенсиди. Аздан бою сергип, эс токтотуп, өзүн-өзү жубатты. Өзүнө-өзү көңүл айтып, кайрат берди. Ар кандай бактысыз кишилер да өз тагдыры тууралуу ойлонбой койбойт эмеспи. Келгинбай чал да болумсуз оокатына көз кырын салды. Үй ичин жыйнаган соң жаман талпагына (подстилка) жайланып отурду да, чөнтөгүнөн кичинекей түйүнчөк алып чыгып, чеберлеп (аккуратно) чече баштады. Анда бармактай туз бар эле. Келгинбай тузду алаканына салып, бир нече ирет тилин тийгизип, өтө бир шербет даам таткандай тузлуу шилекейин кумарлана (наслаждаясь) жутту. Эчен кыйын-кыстоо көргөн учурларда ушул тузду жалап медер таап, кам көнүлүн жооткото алган эле. Өз жеринин татым тузу Келгинбай чалдын өмүрлүк колдоочусу, үмүт менен ишеним берүүчүсү, сагынуу менен кусалыгын таркатуучусу болуп калган..."},{"t":"p","h":"Кийинки окуянын мазмуну мындай баяндалат:"},{"t":"p","h":"Ата конушуна кайтпай калган Келгинбай бир кыз, эки уулдуу болду. Экөө чарчап, Эшбол деген баласы эр жетип, уезддик <span class=\"pg\" data-n=\"100\">100<\/span>мектепте окуп, мугалимдик кесип алды. Үч жыл окутуучу болуп иштегенден кийин гоминьданчылар аны камап таштады. Бирок ал туткундан качып чыгып, революциячыл армиянын катарына өтөт, аерден майорлук наам алып, комиссарлыкка чейин которулду."},{"t":"raw","h":"<div class=\"gloss\"><p>турмуштун жылуу койку мененс теплом жизни<\/p><p>этек-жеңин кагып – встряхивая свой подол<\/p><p>өзөгүп ергтегеан дарт – горе. убивающее его<\/p><p>көз жашы менен жууп – смывая своими слезами<\/p><\/div>"},{"t":"p","h":"Айлар өтүп жатты. Кадын букара (бедняк) колдоруна курал алып, майданды көздөй агылды. Боштондук үчүн эр азамат майданда канын төктү."},{"t":"p","h":"Гомнньданчылар бекем орногон Жынхы деген жерде эсепсиз кан төгүлдү. Улуттук армия калктын боштондугу үчүн бир кадам чегинбестен (не отступая) илгериледи. Акыры Үрүмчүнүн чон дарбазасы ачылып, Жынхы тазаланды. Мына ушул чоң кыргында Эшбол да курман болду..."},{"t":"p","h":"..Чал баласы жөнүндөгү шум кабарды (плохую весть) укканда эстен танып. кулап түштү. Кошунасы суу бүркүп (брызгать) эсине келтиргенде алам көргүс (неузнаваемый) түргө кирип, алдастап ордунан тура калды."},{"t":"p","h":"– Жалгызым, кулунум! – Чыңырып жиберип, кайра кулады чал. Жанында тургандар коз жашын булап (показывая), шору арылбаган пенденин касиретине (печаль. скорбь) орток болду. Узак жылдар кайгы-капалан кажыган (уставший от горя) абышка бир кун ичинде эле алжым чыга келди. Чачы агарып, жаак эти соолуп, мурдакыдан бетер төшөктө томолонуп калды. Багар-көрөрүнөн айрылып. кайгы баскан кары кишинин көргөн күнү курусун! (не дай бог)."},{"t":"p","h":"„.Эртеси уйгур кошунасы мусапыр (бесприютный. чужестранец) чалды өз үйүнө киргизип алды. Көрөрү бүтүп, комору калган абышканын тиричилигине боору оорубаган киши калган жок. Келгинбай бирде соо, бирде алжып сүйлөдү. Бирок татым туз түйүлгөн түйүнчөгүн колунан түшүргөн жок..."},{"t":"p","h":"– Кечээ Эшеним келип, бүгүн муунум кирип (прибавились силы) калыптыр. Элге кетет окшойбуз. «Ата, жүр эми элге кетели, кайгы менсн капалан кутулалы. Тузунлу"},{"t":"raw","h":"<div class=\"gloss\"><p>каи төгүлдү – лилась коль<\/p><p>кыргын – резих, бойня шору арылбаган пение – горемычный человек<\/p><p>орток баллу – стали свидетелями<\/p><p>алжып – выжить из ума (страдать слабоумием)<\/p><p>ждак эти соолуп – осунувщись көрөрү бүтүп, көмөрү калган – доживающий свои дин<\/p><\/div>"},{"t":"v","l":["<span class=\"pg\" data-n=\"101\">101<\/span>эми бөлүп жеп коёлу»,-деп Эшеним жаныма","келип айтпадыбы, садага кетейиним,- деп","сүйлөдү чал.","– Менин чоң арманым эле Эшенимди","эл-журтуна кошуу...","Мына бул Ысык-Көлдүн – мен туулган"]},{"t":"p","h":"жердин тузу. Оо, кагылайын уйгур туугандар, Эшеним экөөбүздү узатып койгула. Бизди өз жерибиздин тузу тартып баратат. Эчен жолу ач калганымда ушуну жалап тоюнгам (насыщался). эчен жолку оор күндөрдө жаныма алып жүрүп көңүлүмө төтөп (утеха, услада, радость), боюма кайрат тапкам. Ушул туз жанымда жүргөндө эли-журтумдун, бир туугандарымдын жанында жүргөндөй болом. Мен жеримди сагынып куса болгонумда ушул туздан жалап алып сагынычымды тар-"},{"t":"v","l":["катам.","Маа дүйнөдө мындан кымбат нерсе","болгон эмес."]},{"t":"p","h":"Элден-жерден ажырап, ага куса болуудан артык азап (мука) жок экен! Кирпик как- кирпик какнады – не спал пады. даам татпады. Арадан үч күн өтпөй даам титпады —"},{"t":"v","l":["эле чалда күрү гана сөөк (одни кости) калды.","Бир күнү эртең менен Келгинбай төшөгүндө"]},{"t":"p","h":"жансыз жатканы бнлинди. Узак жылдар кайгы-касирет, сагынуу менен түбөлүк кош айтышты. Кармаган соопкердин айтымына ка- соопкер – тот, кто является раганда, чалдын оозунда өз жеринин татым тузу бар экен."},{"t":"p","h":"Таншырмалар."},{"t":"p","h":"1. «Татым тузду» ангеме-трагедия дешке болобу?"},{"t":"p","h":"причиной доброго, душеспасительного дела"},{"t":"p","h":"2. Ашсменин башкы каарманы ким? Келгинбай чал эл менен бирге эмне үчүн"},{"t":"p","h":"кайра Мекенине кетпей калыптыр”"},{"t":"p","h":"3. Каза болгон чалдын оозунда оз жеринин татым тузу бар экен. Ангеменин мындай"},{"t":"p","h":"аякташы боюнча оюнар кандай? Аман Саспасв «Татым туз» деген аңгемесинде кайсы мезгилдеги окуяны баяндайт?"},{"t":"p","h":"Гл Кслгинбайдын аялы Оймокчон кдндай аял экен? Ад эмнеге эмчектеги баласын Ангеме эмне учун «Татым туз» дсп агалыптыр, кандай деп ойлойсунар?"},{"t":"p","h":"кайненссинс берип, өзү күйөөсү мснен башка жерде, башка элде калып калды? Ал туура кылдыбы же жокпу. кандай деп ойлойсунар?"},{"t":"p","h":"6. Келгинбайдын бир гитым тузду сактап жүргөнүнүп кандай мааниси бар? Эмнс"},{"t":"p","h":"үчүн туздуи даамы ага шербет даамданат?"},{"t":"p","h":"7. «Өз жеринин бир татым тузу Келгинбай чалдын өмүрлүк колдоочусу. үмүт"},{"t":"p","h":"менен ишеним берүүчүсү, сагыныч менен кусалыгын таркатуучу болуп калган эле.» деген сүйлөмдүн маанисин чечмелеп бергиле."},{"t":"p","h":"<span class=\"pg\" data-n=\"102\">102<\/span>а 1. Аман Саспаевдин омуру жөнүндө сүйлөп бергиле"},{"t":"p","h":"2. «Туултвм жердин зонурагы -алтын» деген макаддын мадиисин чечмелеп бергиле."},{"t":"p","h":"3. Аман Саспасвдин «Татым туз» ангсмесинен алынган үзүндүнү сүйлөп берүүгө"},{"t":"p","h":"даярданып келгиле."},{"t":"p","h":"4. «Мекендин татым тузу» деген темада ой толгоо жазып келгиле."},{"t":"h3","h":"КОШУМЧА ОКУУ ҮЧҮН СУНУШТАЛГАН ТЕМАЛАР"}],"sub":[{"title":"КОШУМЧА ОКУУ ҮЧҮН СУНУШТАЛГАН ТЕМАЛАР","b":45}],"section":"АКЫНДАР ПОЭЗИЯСЫНАН","pages":[97,102]},{"title":"«Эр Табылды» эпосу","blocks":[{"t":"h3","h":"«Эр Табылды» эпосу"},{"t":"p","h":"(Актан Тыныбековдун айтуусу боюнча)"},{"t":"p","h":"Баатырдык эпос – согуштар, улуу жүрүштөр, баатырдык, эрдик жөнүндө айтылган эпос."},{"t":"p","h":"«Эр Табылды» эпосу – XVII кылымдын ортосундагы болгон согуш жөнүндөгү баатырдык эпос. Ысык-Көлдүн жээгиндеги кыргыздардын көпчүлүгү согушта жеңилгенден кийин Фергана өрөөнүнө. Памнрге, Кашкарга жана башка жактарга көчүп кетип турушкан. Ошол кездеги тарыхый окуя элдик оозеки чыгармачылыкта эпос катары сакталып калган."},{"t":"p","h":"Кыргыз эли көп кылымдар бою (в течение веков) ар түрдүү душмандарга каршы согушкан. Кол салган душмандар (нападавшие враги) – калмак хандары болгон. Ал кезде калмакгарды жунгарлар леп аташчу. Өз жеринен суурулган (вышедшие) кыргыздар жунгарларга каршы баатырдык күрөш жүргүзүп турган."},{"t":"p","h":"«Эр Табылды» эпосунун башкы каарманы – Табылды баатыр. Мурунку өткөн заманда алты миң үйлүү катаган деден эли бар, Ат-Башы, Нарынды жердеген Эрманкан деген кан болуптур. Анын бир уул. бир кызы болуптур. Уулунун атын Табылды, кызынын атын Кардыгач коюшат. Табылды өн үчкө чыкканда атасы Эрманкан өлөт. Он төрт жашка чыкканда Табылды атасынын казынасын ачып, жоо жарагын алат. Кырк жигитине жоо кийимин кийгизип, күлүк аттарды мингизип, эл кайтарып, жол чалып. атасы Эрманкандан мыкты чыгат, Табылды – ак ниет (справедливый). кең пейил (добрый, добродушный) баатыр, кыргыз элинин сыймыгы (гордость). Ал бала кезинен тартып элине кызмат кылган (служит). Анын кырк жигити бар."},{"t":"p","h":"Күндөрдүн биринде көл башындагы Чалкалмак деген баатыр он миң колу менен Табылдынын айылына жакындап келет. Алып келген колун бир өрүшкө таштап, беш жүз баатыр менен келип. Табылдынын айылынан бүт жылкысын айдап жолго түшөт. Кырк жигиттин аттарын. Табылдынын <span class=\"pg\" data-n=\"103\">103<\/span>Арчатору атын да кошо алып кетет. Айылдын үстү жагынан: «Малыңды чаап алып кеттим, Эр Табылды, сен баатыр болсоң, мени кууп келерсиң», – деп. кабар салып басып кетет. Табылды кырк жигитин ээрчитип жөө жөнөйт. Карындашы Кардыгач да өзүнчө Арчаторуну издеп жөнөйт. Арчатору айбандан эстүү жаныбар, ала келген жанымда кырк эки буудан малы бар, эки жагын каранып, Кардыгач жаткан дөбөгө келип турган экен. Кардыгач Арчаторуга жайдак минип, кырк бууданды артынан ээрчитип, чү коюп жөнөйт, Табылдыга алып келип берет. Табылды Кардыгачты көк чолокко мингизип, элине кат жазып берип жөнөтөт, өзү жигиттери менен душмандын артынан кууп кетет. Алар согуш өнөрүн жакшы үйрөнүшкөн экен, ошондуктан калмак ханын кыргыз жеринен кууп жиберишет. Табылды баатыр эле эмес, акылдуу жетекчи. Ал адилеттүүлүк үчүн күрөшөт. Элге кызмат кылуу – Эр Табылдынын ыйык милдети. Табылдынын достору Элдияр, Эрмек да – эр жүрөк (храбрый) баатырлар. Табылды достору, жигиттери менен калмактарды жеңишет."},{"t":"p","h":"Түшүнлүрмө сөздүк:"},{"t":"p","h":"атасынын козынасын ачып, жоо жарагын алат – откроет казну, сокровишнипу"},{"t":"p","h":"отца, берёт оружие, доспехи"},{"t":"v","l":["жоо кийимин кийгизип – оденет военную одежду","жол чайып – осматривая дорогу, разведывая","көл башындагы – живущий у озера","он миң кол – десятитысячное войско","өрүш – горное пастбище близ аила","буудан – скакун","жайдак минип – верхом без седла","чу коюп – понукая, пришпоривая","көк чолок – лошадь, не пригодная к походу","","Талныш сөздөр:"]},{"t":"p","h":"катаган – название племени (6-класс 36-бетте: «Кошой-Коргон» уламышынан: Илгери Манас баатырдын тушунда кадимки катаган уруусунун ханы Кошой балбан салдырган экен.)"},{"t":"p","h":"айбзидан эстүү – умнее всякого животного (6-класс 11-бетте; «Эр Төштүк» эпосунан: Жолдо келе жатканда аламдан эстүү жаныбар Чалкуйрукка тил бүтүп, Төштүккө желмогуз кемпирди кантип алдоонун жолун үйрөгөт.)"},{"t":"h3","h":"«Эр Табылды» эпосунан үзүндү"},{"t":"p","h":"Табылдынын калмактын каардуу баатыры"},{"t":"h3","h":"Чалкалмак менен согушу"},{"t":"v","l":["Эки жакты каранып,","Эрдин тиштеп жаланып,","Ач жолборстой айкырып,","Кабыландай бакырып,","Калың жоону аралап.","Качырып кирди Табылды.","ач жолборстой – как голодный тигр","кабыландай – как леопард (эпитет богатыря)","калың жоо – множество врагов","<span class=\"pg\" data-n=\"104\">104<\/span>Эр Табылды чунагын,","Элге салат кулагын.","Эл ичинен көп карайт,","Элдияр, Эрмек ынагын.","Баштап келип караса,","Кечүүнү байкап караса,","Кечкен эл каптап жайнаса,","Суудан түтүн бурулдайт.","Өйүз-бүйүз чурулдайт.","Мылтыктын үнү быдырап,","Кулакка жакшы угулбайт.","Суу үстүндө калдайып,","Агып жүргөн жан көрдү.","Сууруп кылыч чабышып,","Салып жүргөн жан көрдү.","Калың элдин ичинен,","Кызыл ала кан көрдү,","Арчатору күлүктү,","Аябай катуу жүгүрттү.","Мында калган баатырлар,","Көргөн го дсп бүлүктү.","Атка камчы урду эми,","Аяр кылбай жүрдү эми.","Алмамбет, Манас баатырдын","Арбагын айтып бакырып,","Абдан катуу кирди эми.","«Манас! Манас! Манас! – деп,","Баатыр эл мага жанаш деп,","Алмамбет баатыр келчи деп,","Жалгызга жардам берчи деп.","Алымды бугун керчу деп.","Чалкалмак канын мен йнагы Москвадан орус тилинде басылып чыгат."},{"t":"p","h":"Алыкул Осмонов эң мыкты котормочу (переводчик) да болгон. Ал А. С. Пушкин, У. Шекспир, Низами. А. Навои, Ш, Руставели, Гёте, М. Ю. Лермонтов сыяктуу дүйнөлүк адабияттын акындарынын чыгармаларын кыргыз тилине которгон,"},{"t":"p","h":"Ал учук оорусу (туберкулёз) менен ооруп, 35 жашында эле каза болгон. А. Осмонов деле башка акындар эмнени ырдаса, ошол нерселер жөнүндө ырлады, бирок башкача ырдады. Себеби, акын адамдардын жүрөгүндөгү айтылбаган сезимдерин (невысказанные чувства) туюп (прочувствовав). билип тургансып, жүрөгүбүздөгү ойду таап, козгоп (затрагивая) жазган. Ошондуктан анын ырлары да, өзү да жүрөгүбүздө жашай берст."},{"t":"h3","h":"«Музыка»"},{"t":"v","l":["Мен суу ичпейм, таңдай катып турганда,","Мен нан жебейм, алдан тайып курганда","Музыкадай мага таттуу суусун жок,","Берчи мага, Берчи мага,","Жарым кашык музыка!","Мен ыйлабайм. кала тартып турганда,","Мен кубанбайм бак-довлетко тунганда.","Дарым ушул, кайгы менен шаттыкка:","Берчи мага. Берчи мага,","Жарым ууртам музыка!"]},{"t":"p","h":"<span class=\"pg\" data-n=\"109\">109<\/span>Эмнелер жок бул дүйнөдө – жарыкта, Не бир сонун ... не бир кымбат асыл баа... Мен кетээрде ошончонун ичинен: Сагынарым. Эң аярым, Эң кымбатым – музыка! Музыка Я не пью, когда в горле пересохло, Я не ем, когда, обессилев, высыхаю. Нет напитка слаще музыки для меня Дай мне, дай мне, чуть-чуть музыки. Я не плачу, когда мне грустно, Я не радуюсь. когда получаю в изобилии счастье. Лекарство мое в радости и горе: Дай мне, дай мне, полглоточка музыки! Чего только нет на этом свете, Прекрасное ... лучшие ценности .., Среди всего этого я уходя:"},{"t":"v","l":["то, о чем скучать буду,","то, что буду оберегать,"]},{"t":"p","h":"то, что мне дорого – это музыка! Түшүндүрмө сөздүк:"},{"t":"v","l":["ал – синоним слова «күч» – сила, мощь","таңдай катыл – в горле пересохло","алдан тайып – обессиленный, изнурившись. обессилев","курганда – (высохнуть), когда высохла внутренность","су  – профессия","энсөөчү (мечтал). Ошол себептенби (может","по этой причине). кичине кезинде туулган"]},{"t":"p","h":"күнүнө тартуу кылынган бир электрондук радио аппарат – барксыз (нестоящий) оюнчуктардын эсебине кирип кемуркейде жатчу..."},{"t":"p","h":"көмүркөй – небольшой сундучок Кызык..."},{"t":"p","h":"Атасы ошол аппарагты берип жатып, уулунун мурдунан чымчып эркелетип, тамашалаган:"},{"t":"p","h":"<span class=\"pg\" data-n=\"113\">113<\/span>– Оо, энеси, көрдүңбү, уулуна атасы эмне белек берди?! Он үчүнчү толкунда иштөөчү радио аппарат. Кокус мен космостон кырсыкка ап (если попаду в беду), ушул толкунда сигнал берем. Анткени, бул толкун космостук антимагнит талаасындагы гамма нурларын түздөн-түз көсөп өтө алат, Ошондо уулум, сигнал шооласын кармап, космикалык кемеси (космический корабль) менен келип мени алып кетет, ушундайбы Марлес? Ал кезде мыкты космонавт болуп каласың эз?"},{"t":"p","h":"– Аный (нет), – деп баш чайкаган (покачал головой), анда Марлес. – Мен жылдыздарга учкандан көрө (чем летать к звёздам), тоого барып жолборс кармайм..."},{"t":"p","h":"– Кой, антпе! – деген атасы күлүп, – сен астронавт болосуң..."},{"t":"p","h":"Марлес атасынын мүдөөсүн жактырчу эмес."},{"t":"p","h":"Анткени алардын кошунасы Эриди анын чоң энесинин уулу мейкинге чалгындап кетип кайтпай калган (не вернулся). А энеси чачы агарып (поседела) токсондон ашканча уулум келет деп күтүп жүрөт..."},{"t":"p","h":"Бул жагдай Марлеске җагымсыз таасир калтырып (оставил неприятный осадок). космосту кеп суйе берчу эмес (не любил)..."},{"t":"p","h":"Турмушта окшоштук (совпадения) кеп болот тура..."},{"t":"p","h":"Марлес атасын дайыма ойлоочу..."},{"t":"p","h":"Кантип эле анын атасы Ырчы уулча космостон кайтпай калсын?"},{"t":"p","h":"Ал мектептен келатканда да, баратканда да Вега жылдызынын гиперболасына чыгып кетип, кайтпай калган «Колумб» звездолетунун экипажына кварцтан тургузулган эстеликтеги атасынын фамилиясын карап көпкө тура берүүчү. Атасынын элеси аны менен дайыма бирге жашап, ага атасы кандайдыр бир алыс жакта конокто жүргөндөй, же бир маанилүү иштерге илешип калып (был занят важными делами), колу бошоп келе албай жаткандай сезилчү."},{"t":"raw","h":"<div class=\"gloss\"><p>көсөп өтүү – пробивать<\/p><p>посла, мур – луч<\/p><p>мүдөө – желание, цель, интерес мейкин, мейкиндик – космическое пространство<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"114\">114<\/span>Марлес атасынын тирүү экендигине сокур сезими менен ишенүүчү. Мүмкүн алардын космнкалык кемеси аракеттенүүнүн максималдуу чегине жетип (дошёл до грани), галактнканын кыймылдуу орбитасынын огуна түшө албай мейкиндиктин бир чекитинде түртүлүп жүргөндүр..."},{"t":"p","h":"—...Күндөрдүн биринде классташы Рамазан бирдеме көтөрүп ага жетип келди:"},{"t":"p","h":"– Марлес, оюңду бир чекитке багыттап, кайра сурабай (не переспрашивай) кепти жакшылап ук. Мен бир жаңы аппарат конструкциял (сконструировал), аны сыноолен өткөрүшүм керек (должен испытать). Жарламчылыкка сен ылайыктуусуң (ты самая подходящая кандидатура в помощники). Себеби, сенин Суусамыр тоолоруна аңчылыкка чыгууга көптөн бери куштарланып жүргөнүндү (мечтаешь) билет эмесминби. Сен эртең таң заарынан жөнөйсүң да, мобу, – ал картадан бир чекитти көрсөттү, – координаттарга жайланышып алып, он үчүнчү толкунда мага сигнал бере баштайсың."},{"t":"p","h":"Пароль: «Мен – Гүлстан! Жооп бер, Чыгыш?» Эгерде, мен жооп бербей тажай баштасаң тиги автомат-роботтун кнопкасын басып кой да, өз ишиңди иштей бер. Бирок, ар бир саатта келип-кетип байкап түр (время от времени следи). А азыр кош. Менин ишим чачтан көп, кечке чейин көп нерселерди камдашым керек (должен подготовить)."},{"t":"p","h":"Ал кетип баратып кайра кайрылды:"},{"t":"p","h":"– Баса, менин жетип токтоочу чегим бир топ алые болгондуктан сенин түшкө чейин аң УУЛООГО (охотиться) сонун мүмкүнчүлүгүң бар. Демек, сигналды саат экиден кийин баштайсың..."},{"t":"p","h":"Марлес жалгыз калган соң «Эмне үчүн он үчүнчү толкун?» – деп ойлоду. – Неге он бир, же он төрт эмес, он үч?! Анын эсине, кичинесиндеги атасы тартуулаган баягы аппарат түштү."},{"t":"raw","h":"<div class=\"gloss\"><p>сокур сезим – инстинкт<\/p><p>мейкиндик – космическое пространство<\/p><p>толкун – волна ишим чачтаи коп; очень много работы<\/p><\/div>"},{"t":"img","src":"data:image/webp;base64,UklGRrQxAABXRUJQVlA4IKgxAAAQEwKdASqAAtkCPrVWoUuuNrGvKjdautAWiWktgg3/hun67eBzYiYrY0sph7+B4TJ2rIM91tGukNZcoF//9V+YdXfi5XW5l/B//l58PiH/L//P+56C/i39j///63p/7b/ov/3x6/+rMB//+ov4L/7a/s6n/FiotnZhXW3/SyPuEbznMZPakepai2+Ol/kl+Radf4kKzbV6N/Xv3mMNvzidVNHREX2VcXyRSc1akgBpD5HQbOzvUPQHZAL6HBDZfBc9wmRl5HC5hTfWmhQbOX8WcIcEqBBK7o0WAPppuWf1w0hiDCqXa8bO8mrne7MGQGhO9uX0YbQCmY2LamROh2LWodKVQheLW9yQVWxH0iSk6Crf91jTx9weMWXrwxtysLCRobDndH5ZpGDdJ/5dsmgipE9DpyS4RE2/1wdCiSn+QZc+JWWJFma0dQRwkGpD3ZlhaPX+9flmQd8Cex9bN6hi2nZA14LmMWyKIRRfVR5kKOSfu2l7iv99zcwhEnlLe5Q5pU1NII/BA4t2NCecE/NeJJRYnPgY1D2nhklL20F+BgifmZhJBmRhrUfQTjxNeyaBUKk1dUVlpJ3LB/PWhosAhOkVgTo0ySwfeTL4Fj2ccHMHB8qir2hzz1pC/CYuZgPtzC+YrnzOZV+gQe96bBPoLMar7bU6nJhvU4cFSzKS2Bpwd0ykGCndFDsMzId6UnOi5xWb5KGtdV2ft8VSsuAdgMBREt3C7ltVeLwv1MgCzagy5V7RrE18Z2uJ0DXLexDaKLhd/dwOoDz0msKqtN+1GZRUbX0QK6nYq39WVPcfI6NrF0NPi5SXOXnyzJDNXBbyIV/N4UD3XVhM1I4bsXPg9VqmW+GyoT75P3nPa71i2izxfIzCtR7ox1p3XcyBJ5cMt59XD+MqYNINfs094xPKWU6tY4EfJa0q9EBo411eGQEzoKS3B2Z/dAW60Vx6BhkuE+NQ+L6P8hGXzGcOHbzt21lS0Y2xnqLnG2wJsk8cT68qM82YDL5QyEP4bezeh7SLhMT2WnIwxfTaDuH0nQdR1hOUvP8ohEOncu8uGSW6uI7ucoyJ7kCiM3S+xljrUKRbKw1jRJ4WNX5415/U5i1GfbVbiGMGl3MgeVxhc+xycJuVq3UuA+wFeeo6iC+wNTQUrhA2hFReuZPzCDd3v/fZtEwAm08UyoVIWOCpjWvYbmvbwUZrkMDPD83bUJ2Kkza2YmBhOPT0KoO7nB7iepkEWvvLuSRWcz/Qz5g40icfUejdWpqhbkhXps15dTHmGEoSiOe95RDr9+VBmhDf3D6AvqD//X1rAwdWspMA+CnQ8PUA+jmg94P5jcaT1mRk6uqMPDLlNCWsEBQreFS9jh3oCARxQaP9I4+dfMLMuLP8FCZflc3n3Nrnyev3Noy4QCePHgX8YfOfTSsC2pZPyAoJloGGYVK0Gw91MAe5sVKOafjVl8GDAFoa+paT11H40rRDZ1kM1QFG7FHLgEfQwzelwMvzSeLc7zPk2xhorNGsKOZpX5LkqT5Oz+VwkFLfV7Pyru7ZGVQBzN9Nk38wjQTvKru9O8akxdFDRohG3qqUtaDRR7WU2zReko+F1pbXpafeZcTDFh8WV6yzQ0x/0cQCbf/LOrHnLrZmctElbC7A9nJGIreVosjxEnbBsGn7mJWgq1CQWrOPBNb8BUK60dGzcm0 "t":"raw","h":"<div class=\"gloss\"><p>шектенди – начал сомневаться<\/p><p>дат баса баштаптыр – начал ржансть<\/p><p>оор улутунду – тижело вдохнул<\/p><p>кам урду – начал готовиться<\/p><p>теребел – окрестность<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"116\">116<\/span>Тескейдин бадалчасынан чаарчык чыйылдап энесин чакырды."},{"t":"p","h":"Жогоруда жалама зоодо (на высокой гладкой скале) бүркүт шаңшып уясына түшүп келатат, Тээ төмөндө туристтер жүрүшөт..."},{"t":"p","h":"Ал саат экиден өткөндө аппаратты Кереге-Ташка орнотуп, он үчүнчү толкунда сигнал бере баштады:"},{"t":"p","h":"«Мен – Гүлстан! Жооп бер, Чыгыш!» Наушниктен зыңкыддаган жагымсыз уңдөң белок (кроме неприятного пронзительного звука) эчтеме угулган жок."},{"t":"p","h":"Жарым... Бир саат... Бир жарым... Акыры ал соксоюп куру ступа бапух Шен (сидеть без дела) тажап, автомат-поботту ШЩКе КИРГИЗИП (включил робот-автомат). тамактанмак болду. Рюкзактын тубунде кечээ күнү чукулап отурган атасы тартуу кылган аппарат жүрүпгүр."},{"t":"p","h":"«Кызык, апендилигимди кара, муну эмнеге салып койдум экен?» – деп ойлоду Марлес."},{"t":"p","h":"«Мен – Гүлстан! Жооп бер. Чыгыш?» Рамазандан дале кабан жок (нет вестей). Марлес ишсиздиктен Эритип (заскучал), атасынын аппаратын токко туташтырып он Үчүнчү толкунду кармап, эрмек кыла баштады. Ал космостук зуулдаган баш-аламан (беспорядочный) үндөрдөн башы ооруп чыкканда гана аны таштап, көк майсанга (здесь: трава) чалкасынан түшүп, көктү тиктеп ойго батты... Эсине атасы түштү."},{"t":"p","h":"Ал дайыма атасын ойлоочу."},{"t":"p","h":"Оо, ал атасын кандай гана сагынды дейсиң!"},{"t":"p","h":"Марлес атасын коргусу_келчү (хотел увидеть)..."},{"t":"p","h":"«Ата... чын эле сен ааламлан кайрылбайсыңбы?..»,"},{"t":"p","h":"Ал тоо желине магдырап уктап кеткен ЭКЕН (задремал), ойгонуп кетсе күн кечтеп кетиптир. Оо шумдук (чудо). Ал копген козуна. УККАН КУЛДГЫНД ИШеНе албалы (он не мог поверить <span class=\"pg\" data-n=\"117\">117<\/span>своим глазам и ущам). Эки аппарат ез ара (между собой) сүйлөшүп жатат."},{"t":"raw","h":"<div class=\"gloss\"><p>чаарчык – телёнок косули (до года)<\/p><p>аалам – вселенная<\/p><\/div>"},{"t":"p","h":"– Толук түшүндүм, Чыгыш, – деди атасынын аппаратынын динамигииен кытыраган үн. – Ошентип менин берүүм Гүлстан координатынан кармалып, анан Чыгыш координатына берилип жаткан турбайбы. А эмне үчүн ошол объектидеги адам биз мснен тузден-туз байланыщщалы (не связался прямо?)"},{"t":"p","h":"– Мен да түшүнбөйм.., – Уккун, Чыгыш. Сен биздин сүйлөшүүнү магнит лентага бут тарттырып алдынбы (записал?) Космографиялык жылдыздар коорлинагтары чаташкан жокпу (не перепутались?) Сен эми тез, Жылдыздар Арадык Коомго (межзвёздное общество) жетип, биз тууралуу кабарда (сообщи). Баса. эскертем, Астрономдор көчөсүндөгү № 2 үйдө менин балам Марлес, аялым Наркүл жашайт. Эгер жоголбогон болсо (если не потеряли) уулумда он үчүнчү толкунда иштөөчү өзүм түзгөн аппарат бар."},{"t":"p","h":"Аны Жылдыз Аралык коомго алып барышсын, анда биз окумуштуулар менен түздөн-түз байланыша алабыз. Макулбу?"},{"t":"p","h":"Мезгил коз ирмемге (на мгновение) муздай тоңо түшкөнсүдү. Чыгыш координатынан толкундаган үн атылып чыкты:"},{"t":"p","h":"– Жолдош капитан... Гүлстан координатындагы сиздин уулуңуз, Марлес..."},{"t":"p","h":"– Ия?.. Эмне дейсин?.. Марлес!"},{"t":"p","h":"Нес болуп отуруп калган Марлес аппаратты кучактай жыгылды:"},{"t":"v","l":["– Аат-а!.. Атакээ..,","","Тапшырмалар."]},{"t":"p","h":"1, Марлестин атасы ким эле жана ал кандай тилек мснен уулуна белек берди?"},{"t":"p","h":"2. Эмне үчүн Марлестин космонавт болбой зоолог болгусу келген?"},{"t":"p","h":"3. Рамазан кандай жаңы аппаратты конструкцнялал сыноодон өткөрмөкчү болду?"},{"t":"p","h":"Эстеликтеги атасынын агын окуганда Марлести кандай ойлор ойлонтту?"},{"t":"raw","h":"<div class=\"gloss\"><p>эскертем – предупреждаю<\/p><p>өзүм гүзгөн – сконструированный мной муздай тоно түшкөнсүдү – здесь’ как будто остановилось<\/p><\/div>"}],"sub":[{"title":"«Он үчүнчү толкун»","b":5}],"section":"АКЫНДАР ПОЭЗИЯСЫНАН","pages":[113,117]},{"title":"Роботтун туулган күнү","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"118\">118<\/span>Роботтун туулган күнү"},{"t":"p","h":"Табылды п экра н көзүн алсай отурду (волнуясь, не отрывал взгляда от экрана}... Ал конструктордук бюродо иштөөчү. Алардын институту өзүн ансезимдүү башкаруу мүмкүнчүлүгүнө ээ болгон. алыскы жапайы плансталарга чалгынлоо жүргүзүүчү (разведовательный) роботторду даярдашчу. Бул жагынан институт арымдуу баскычтарга кадам шилтеген. Бирок, роботтор канчалык акыл-эстин жемиштери менен сүгарылса да (хотя обладали способностью мыслить), алыскы жапайы. же өнүккөн (развитый) метагалактикаларда – программаланган (запрограммированный) инструкциялардын запасынан башка, белгисиз, көрсөтүлбөгөн кыйынчылыктарда эмне иштээрин билишпей ойлоно беришип, акыл-эстен ажырап (теряли рассудок), келесоо болуп, катардан чы- ГЫП калчу (выходили из строя)."},{"t":"p","h":"Ошентип, алыскы сырдуу дүйнөлөр менен катнаш жасоо Мүмкүнчүлүгү (возможность установить контакт) ар дайым чектелип Турган (ограничивалась)."},{"t":"p","h":"Себеби, алыскы галактикаларга учууда адамдардын өмүрү биологиялык жактан чектелберген эмес. Ал эми субжарыкты ондогон эсе басып өткөн «Аннигилятордук улуу кыймыл» деп аталган аспектидеги чексиз коэффициенттүү ЫЛДАМДЫК менен учууда (летать со скоростью) адамдар мүрт өлүп турушкан."},{"t":"p","h":"Ушул ссбептүү аң-сезими жагынан адамдай функцияга ээ болгон (обладающий проблемасы Жерде дүркүрөп өнүгүп ү человеческими функциями) роботторду кан (бурно развивалась). Ар кандай типтеги, структурадагы роботтор жердеги сыноолорде, өздөрүнүн мыкты сапаттарын (качества) көрсөткөнү менен, ааламдагы белгисиз аңсезимдер менен кездсшүүдө жана аларды таанып-билүүдө түшүнүктөрү тарып (имели <span class=\"pg\" data-n=\"119\">119<\/span>узкие понятия), аларга ажайып сезилген сырдуу дүйнөлөрдө акылдан ажырап турган... Роботтор өлүп баратканда Борбордук Байланыш түйүнүнүн коррекциялык лампочкалары чычаладай кызарып туруп өчүп калчу... Бул жолку сеанс башкача болду. Анткени – конструктор Табылдынын үлгүсү боюнча түзүлгөн (созданная по его образцу) «Тибальд-РООО 7115» тибиндеги – ааламдын 707°23/ координатындагы А-17 жылдызынын М-00001 планетасына жиберилген роботтун – белгисиз акыл-эс менен кездешүүсү (встреча) алиге өчө элек болучу. Робот Тибальддын Жерден чыккандан тартып ылдамдыктын ФА- 6Э1 касиети менен аалам мейкиндигин көзөп жүрүп олтуруп (проходя), жогоруда аталган координатка жеткенге чейинкиси, андан кийин А-17 күнүнүн М-00001 планетасына орношуп, жергиликтүү турмуш-шартты кабыл ала башташы (как он начал внедряться (жить среди инопланетян) үзгүлтүксүз (непрерывно) Жерге берилип турду. Анткени – роботтун бүткүл турпаты телемстрикалык эфир экспресс-иллюзия закону боюнча түзүлгөндүктөн, анын ар бир кыймылы Жерге түздөн-түз чагылуу женлемуне ээ эле (имело свойство)."},{"t":"raw","h":"<div class=\"gloss\"><p>ин-сезимлүү башкаруу мүмкүнчүлүгүнө 22 болгон – обладающий способностью осознанно управлять<\/p><p>кыйынчылыктар – трудности<\/p><p>сырдлуу дүйнө – таинственный мир<\/p><p>мур: өлүп турушкан – мпювенно умирали<\/p><p>сыноо – испытание<\/p><\/div>"},{"t":"p","h":"Жаңы жерде Тибальл-роботтун биринчи тан калганы (удивило) эле – биерде жашоочулар кислород эмес, гелий менен дем алганы болду. Алар кислородду агайын ишканаларда иштешип, кооздук үчүн (для красоты) пайдалануучу каражат катары карашат экен."},{"t":"p","h":"...Тибальд организминин бир механизмине «Х-41» деталын бир саат бою камдап жатып, гелий менен дем алуу жөндөмдүүлүгүнө ээ болду. Анан. анын экинчи таң калганы – жергиликтүүлөр тамак ордуна музыка угуп, бий бийлешет экен. Ошентип, Робот-Тибальд запас азык-түлүгү түгөнгөндөн кийин ачка боло баштады."},{"t":"p","h":"Эмне кылуу керек? Ал ар кандай ойго чөмүлдү..."},{"t":"p","h":"Бул убакта Табылды жана анын институтундагылар: «Мына эми, робот акыл-эстен"},{"t":"raw","h":"<div class=\"gloss\"><p>чычалалай кызарып туруп<\/p><p>өчүп калчу – загорались крас зону – Робот-Тибальд ааламдын 707°23/ координатындагылардай өмүр сүрө баштады."},{"t":"raw","h":"<div class=\"gloss\"><p>көзү гумандады – в глазах потемнело<\/p><p>өмүр сүрө башталы – начал жнтъ<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"121\">121<\/span>Ал жергиликтүү эл менен каны-жанын сиңирип кетти..."},{"t":"p","h":"‚..Ушинтип күн өтүп ай алмашып, жыл жылышып, убакыт өтө берди... Жердегилер «Тибальд-РООО7115» тибиндеги роботту унута башташкан кезде (когда начали забывать), ал үчүнчү таң калуунун формуласын ачты..."},{"t":"p","h":"Робот-Тибальддын жашы улгайган сайын (чем старше становился), кайсы бир учурларда күндөлүк турмуш ага супсак сезиле баштаганын туйду. Бул кубулуш коңшулаш К-71! деген бийкечти көргөндө жок боло түшчү (уходило)."},{"t":"p","h":"Демек, ал аны сүйүп калган экен."},{"t":"p","h":"Бирок, мындай болууга мүмкүн эмес эле..."},{"t":"p","h":"Себеби, жергиликтүү элдин салты боюнча. эркек сүйгөн бийкечине жүрөгүн сууруп берет (вынимает своё сердце)."},{"t":"p","h":"Бийкеч ал жүрөктү өзүнүн жүрөгүнүн он жагына коёт да (помещает на правой стороне от своего сердца) (алар эч качан ажырашпайт) бир жашашып, түбөлүк бактылуу өмүр сүрүшөт."},{"t":"p","h":"– Робот анте алабы?!?"},{"t":"p","h":"– Антүү анын инструкциясында көрсөтүлгөн эмес! (не указана)."},{"t":"p","h":"...Ощентип Тибальд өз сүйүүсүн өзү жашырып, көзгө көп чалдыкпоого тырышты (старался не попадаться на глаза). Себеби, бийкеч К-711 кайсы бир ыйык күнү өз сүйүүсүн билдирип, жүрөгүн көөдөнүнөн сууруп алып (биерде бул көрүнүш кыздар үчүн уят деле эмес, анткени кыз эркекти сүйүп калса, өз жүрөгүн тартуулоого акысы бар) Робот-Тибальдга сунса кантет? Жердеги институттагылар аны түзгөндө келечектеги аялынын Кошумча жасаш-"},{"t":"p","h":"для сердца будущей супруги). Ал эми сунулган жүрөктү албай коюу – ушунчалык маскаралоо болуп эсептелет болучу да, жергиликтүүлөрдүн салты боюнча, демек, аңда кыз сунган жүрөгүн албаган (не принявшего в знак любви сердце) эркекти өлтүрөт (убивает)..."},{"t":"raw","h":"<div class=\"gloss\"><p>каны-жанын синирип кетти – смог ужиться күндөлүк турмуш ага супсак сезиле баштаганын туйду – почувствовал, что повседневная жизнь становится скучной, однообразной<\/p><p>бийкеч – девушка жергиликтүү элдин салты<\/p><p>боюнча – по обычаям коренного<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"122\">122<\/span>Робот канчалык өз сезимин жашырса деле, бийкеч К-711 көргүсү келип аны эңсей берчү болду. Бара-бара (постепенно) ал аны"},{"t":"p","h":"Ө ашай албай га алга келип Жетти (дошёл до состояния, когда он не представлял жизни без неё)."},{"t":"p","h":"Кайсы бир аж өрдүн биринде (в один из прекрасных, удивительных дней) ыйык чечимге келген Тибальд бийкеч К-711ге салтанаттуу басып барды да, кыйналып турганына карабай (несмотря на то. что ему было плохо), езу ар дайым кастарлап. ыйык сактап журген журегун сууруп алып, ушунчалык урматтоо менен (с огромным уважением) таңкы шүүдүрүм чайыгандай мөлтүрөгөн колуктуга сунду."},{"t":"p","h":"Бийкеч К-711 даңктуу сүйүүнү татыктуу түрдө_кабыл алып (приняла), Робот-Тибальддын жүрөгүн өз жүрөгүнүн жанына койду. Эки жүрөк бир денеде согуп турду."},{"t":"p","h":"Бирок, экинчи дене муздап бараткан эле... Бийкеч күйөөсүнө карап алып чочуп кетти."},{"t":"p","h":"Робот өзүн тиктеп, кыймылсыз туруп- Тур (стоял неподвижно). Кыз аны кучактай имерди да. анын – булардын эмес. белгисиз Адамдар дүйнөсүнөн келгенин. аң-сезимдин башка категориясындагы макулук (существо) экенин сезе койду."},{"t":"p","h":"Кандай кайгы!"},{"t":"p","h":"Биерликтер бир гана жолу үйлөнүшөт. Ал мунун күйөөсү жүрөгүн берип, өзү өлүп калыптыр. Үй-бүлө даамын татпай (ме вкусив прелести семейной жизни), тубелук кара кийип алуу кандай өкүнүч!.."},{"t":"p","h":"Эсин жыйган бийкеч К-711 өмүрлү коргоочуларга (спасателям) кабар кылды. Ошол эле замат «тез жардам» жетип келди. Кашка баш профессор К-711ге олуттуу көнүл айтты:"},{"t":"p","h":"– Кайгырып денеңизге көп күч келтирбеңиз. Азыр сизде эки жүрөк бар экендигин эсинизден чыгарбаңыз. Биз сиздин күйөөңүздү ашып кетсе 119 сааттан кийин жандандырып беребиз!"},{"t":"raw","h":"<div class=\"gloss\"><p>кастарла – хранить. оберегать<\/p><p>ыйык – святой таңкы шүүдүрүм чайыгандай<\/p><p>мөлтүрөгөн – прекрасная как утренняя роса<\/p><p>чочуп кетти – испугалась<\/p><p>өкүнүч – горе<\/p><p>жандандырып беребиз – оживим<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"123\">123<\/span>...Профессордун калган сөздөрү угулбай экран тилкеленген сызыктарга толо тилкелентен сызыктар – полосатые линии башталы (начал заполняться)."},{"t":"p","h":"Жердеги Табылдынын институтундагылар элес-буластын арасынан үч буттуу, алты колдуу көк жашыл бир топ адамдар «Тибальд-РООО 7115» тибиндеги роботту машннага салып жатканын көрүп калышты..."},{"t":"p","h":"Лампочкалар кызарып. экран өчтү..."},{"t":"p","h":"Конструктордук бюродогулар оор улутунушту. Табылды көз жашын аарчып (вытерев слёзы):"},{"t":"p","h":"– Бүгүн роботтун туулган күнү! – деди сыймыктуу... сыймыктуу – гордо Бул сөздү айтууга ал гана акылуу болучу! (Только он имел право.) Тапшырмалар."},{"t":"p","h":"|. Табылды конструктордук бюродо кандай роботту түзүүнүн үстүндө иштеген? 2, Белек плансгада жашоочулардын дем алуу, тамактануусунда кандай өзгөчөлүктөрү"},{"t":"p","h":"бар экен?"},{"t":"v","l":["3. Үйлөнүү багытындагы алардын салты кандай болгон?","4, Табылды эмнеге ыйлады?"]},{"t":"p","h":"Ка Азыркы учурдагы роботтор кандай озгочолукторго ээ, келечекте робогторлун бызлин жашообузда алган орлу каидай болот леп ойлойсуңар?"}],"sub":[],"section":"АКЫНДАР ПОЭЗИЯСЫНАН","pages":[118,123]},{"title":"ПАЙДАЛАНЫЛГАН АДАБИЯТТАР","blocks":[{"t":"h3","h":"ПАЙДАЛАНЫЛГАН АДАБИЯТТАР"},{"t":"p","h":"«Манас» 1- китеп. С. Орозбаковдун варианты боюнча. – Бишкек: Кыргызстан, 1995. Алымов Б., Муратов А. Кыргыз адабияты 7-кл. – Бишкек: Педагогика, 2000. Байжиев Т., Бектенов 3. Кыргыз адабияты 9-кл. Бишкек” 1993."},{"t":"p","h":"Капгелдмев Н. Биздин адабият. – Фрунзе: Мектеп, 1987."},{"t":"p","h":"Рыспаев Б., Жакшылыков А., Жигитов С., Жетимишев С., Пустынников Н. Писатели советского Кыргызстана. – Фрунзе: Адабият, 1989."},{"t":"p","h":"Саспаев А. Тагым гуз. – Фрунзе, 1986 Сманбасв А.. Ишексев Н. Кыргыз адабияты. 6-кл. – Бишкек: Педагогика, 1999. Шериса Ж., Муратов А. Кыргыз адабияты: Терминдердин түшүндүрмө сөздүгү: Мектеп окуучулары үчүн. – Бишкек: Кыргыз энциклопедиясынын башкы редакциасы, 1994. Юдахин К.К. Кыргызча-орусча сөздүк, – Бишкек: Шам, 1999 Дыйканова Ч., Сулайманова Л., Төлокова Э. Кыргыз тилин үйрөнөбүз, – Бишкек: 1997."},{"t":"raw","h":"<div class=\"gloss\"><p>БУА<\/p><\/div>"}],"sub":[],"section":"АКЫНДАР ПОЭЗИЯСЫНАН","pages":[123,123]}],"fixed":true};</script>

  // ---------------------------------------------------------------- storage helpers

    ['kyrgyz-adabiyat', /кыргыз адабият|кыргызская литература/, 'Кыргыз адабияты', 'Кыргызская литература'],
    ['russkiy-yazyk', /русский язык|орус тили/, 'Орус тили', 'Русский язык'],
    ['russkaya-literatura', /русская литература|литературное чтение|орус адабият/, 'Орус адабияты', 'Русская литература'],
    ['adabiyat', /адабият|литератур/, 'Адабият', 'Литература'],
    ['matematika', /математик|алгебр|геометр/, 'Математика', 'Математика'],
    ['fizika', /физик/, 'Физика', 'Физика'],
    ['himiya', /хими/, 'Химия', 'Химия'],
    ['biologiya', /биолог/, 'Биология', 'Биология'],
    ['geografiya', /географ/, 'География', 'География'],
    ['istoriya-kg', /кыргызстан\S* тарых|история кыргызстана/, 'Кыргызстандын тарыхы', 'История Кыргызстана'],
    ['istoriya-mir', /дүйнө тарых|орто кылым|жаңы тарых|соңку тарых|байыркы|всемирная история|средних век|новая история|новейшая история|древн/, 'Дүйнө тарыхы', 'Всемирная история'],
    ['religii', /диндер|религи/, 'Диндердин тарыхы', 'История религий'],
    ['obshchestvo', /адам жана коом|человек и общество/, 'Адам жана коом', 'Человек и общество'],
    ['grazhdanstvennost', /гражданствен|жарандык/, 'Жарандык', 'Гражданственность'],
    ['english', /англ|english/, 'Англис тили', 'Английский язык']

  function subjectOf(b) {
    var s = String(b.subject || b.title || '').toLowerCase();
    for (var i = 0; i < SUBJECTS.length; i++) {
      if (b.subject === SUBJECTS[i][0] || SUBJECTS[i][1].test(s)) return { key: SUBJECTS[i][0], order: i, name: SUBJECTS[i][S.ui === 'ky' ? 2 : 3] };
    }
    return { key: 'x:' + s, order: SUBJECTS.length, name: b.subject || b.title };

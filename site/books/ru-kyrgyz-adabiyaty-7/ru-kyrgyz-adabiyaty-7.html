ымданбы, төшөгүмдө жатып сүрдөдүм."},{"t":"p","h":"Бирок тез жооп бердим:"},{"t":"p","h":"– Эмне үчүн куткарбаймын. Мен да жигитмнн, менин да элим бар! Мен эми бөрүдөй болуп өстүм."},{"t":"p","h":"Элге кур кетүүнү ылайык көрбөй жүрдүм эле, – дедим кишисинип."},{"t":"p","h":"Кыз дагы ачыгыраак күлдү. Ал менин кур кайратыма жана кетүүгө дилгир экендигиме ачык түшүнгөн болуу керек (маверное поняла)."},{"t":"p","h":"– Сен жашсың, бирок жүрөгүң эрдикиндей. Сен көркөм, сүйкүмдүү жигит болосуң. Сенде акыл да бар. Ошондой болсо да сен ойлонбоюраак шашып жатасың, чынбы? – деди кыз."},{"t":"p","h":"– Жөк, мен ойлонуп эле чын айтып жатам, Бир кызды куткармакка эмне! – дедим. Тапшырмалар."},{"t":"p","h":"1. Эмнс үчүн Баатыр өз ягынан. куралынан айрылгысы келген жок?"},{"t":"p","h":"2. Кыз Баатыр менсн качууга эмие үчүн макул болгон жок?"},{"t":"p","h":"3. Алар чатакташканда бири-бирине кандай ант беришти?"},{"t":"p","h":"4. Кыз эмне үчүн «кегиңди менден ал» дейт?"},{"t":"p","h":"Кыздын атасынын төөлөрүнүн арасында жез буйлалуу боз инген бар. Ал жөн төөлөрдөн эмес, төөнүн желмаяны (миф. верблюд-скакун, верблюд. отмечающийся быстрым ходом, неутомимостью) болот. Ошол себептен аны агасы ууплап кетпесин (чтобы не украли) деп дайыма боз үйлүн тушуна байлатат (привязывают около юрты). Үч күн бою Зарлык кыздын үйрөткөн акылы менен аны атасынан жашырып суутаг (ставит потного верблюда на выстойку)."},{"t":"p","h":"Кыздын атасы төөнү Ойсул ата колдоп жүрсө керек деп ойлоп, кийин көп анлыбай калат (перестал следить). Төртүнчү куну тан ата электе (пока ещё не рассвело) Кыз менен Зарлык төөнү уурдап чыгып, айылдан качышат."},{"t":"raw","h":"<div class=\"gloss\"><p>сүрдөдүм – засмущался<\/p><p>ойлонбоюраак – необдуманно<\/p><p>жез буйлалуу боз инген – серая верблюдица с медным костыль-<\/p><p>ком (буйла – дереяянный костылек продевавшийся в носовой хрящ быки ити верблюда и служивший для прикрепления поводка)<\/p><p>Ойсул ата – покровитель (прародитель) верблюдой<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"53\">53<\/span>Тан аппак атты. Айланада айыл тугул мал да көрүнгөн жок. Кайсы жерде баратканыбызды да тааныга! ым жок. Күн бута атым көтөрүлгөн кезде, кыз төөнүн буйласын тарта баштады. Бирок төө токтоно албай үрккөн эмедей ээлигип, көбүгүн чача башталы (начал испускать изо рта клубы пены). Күн так төбөгө келгенче жай жүрдүк. Андан кийин канаттуудай учуп дагы жөнөдүк. Эл орунга олтурган кезде (вечером), өзөн суусунун боюна келип, төөнү тиздеп коюп (треножив верблюда, перекинув верёвку через шею), тамактана баштадык."},{"t":"p","h":"– Баатыр жетсе бизге эртең жетет. Андан башка киши бизди кубалабайт. Качсак кутулабыз (спасёмся). Бирок аиттын аягына чыгуу керек. Качып кетүүгө бөлбөйт. Туурабы? – деди кыз."},{"t":"p","h":"Мен тилим менен жооп кайтара алганым жок, башымды ийкедим (кивнул головой). Кыз жылмайып күлдү да:"},{"t":"p","h":"– Ал деле адам. андагы өнөр бизде да бар. Ссн коркпо, өлсөк экөөбүз бирге өлөбүз (если суждено нам умереть, умрём вместе), – деди."},{"t":"p","h":"Менин оюма келбеген ишти кыз өзү баштап, сүйүүнүн отун өзү тутантса да, менин сүйгөнүм аныкынан күчтүү сыяктуу эле. Мен аны менен өлүүдөн тартынганым жок (не побоялся смерти). Кыса-кыса кучактап өпкүлөп жибердим (крепко обняв поцеловал её)."},{"t":"p","h":"Эртесинде, көлөкө бойдон узунураак болгон кезде, арт жактан созулган куюндун чаны көрүндү."},{"t":"p","h":"– Тетиги чан – баатырдын чаңы. Эми коркпо, – деп кыз төөнү токтотту да, текенин мүйүзүнөн жасалган саадагын алып, даярдана баштады. Баатыр көз ачыт жумганча жетип келди да, кыйкырып:"},{"t":"p","h":"– Абийирсиз! Эми туткун болдуңбу! – деди."},{"t":"p","h":"Кыз төөсүн туура тартып тура калды да:"},{"t":"p","h":"– Мен убадама жеттим. Атыңдын башын тарт (поверни коня назад), өлөсүң! – деп <span class=\"pg\" data-n=\"54\">54<\/span>төөнүн мойногун тээп саадагын кезеди (сидя верхом она нацелилась из лука, упёршись ногой в шею верблюда)."},{"t":"raw","h":"<div class=\"gloss\"><p>көлөкө бойдон узунураак<\/p><p>балгон кезде – заполдень<\/p><p>саадак – лук көз ачып жумганча – быстро, молиненосио<\/p><\/div>"},{"t":"p","h":"Бута зтымлай жерге (расстояние полёта стрелы) келгенде Ак чагырды колуна алып, атайы, токтоп:"},{"t":"p","h":"– Өлө элегиңде менин жаныма кел! Келсең дагы күн кылам! Качсаң да күң кылам! Ушуну ук, – деди жигит."},{"t":"p","h":"– Тил алсаң кайт, сага менин колум барбайт (я не могу на тебя поднять руку). Сен менин колумдан өлбө. Мен намысымды алдым (отстояла свою честь), – деди кыз экинчи эскертип."},{"t":"p","h":"Жигит келүүгө намыс кылды да, катуу буйрук берди:"},{"t":"p","h":"– Кел жаныма! Кел, жүгүн! Жаныңды калтырам (оставлю в живых), түбөлүк күң кылам!"},{"t":"p","h":"Кыз эрегишке туулган эмедей:"},{"t":"p","h":" Күң кыла албасаң, энеңди экинчи ал! – деп төөнү бура тартып, бастырууга киришти."},{"t":"p","h":"Жигит ок тийген арстандай бакырып:"},{"t":"p","h":"– Өлдүң! Өз убалын өзүңө! Өлдүң! – деди. Анын мылтыгынын оозу бизди тиктеп үңүрөйүп калган эле. Ал ок чыгарганча кыз төөнү бура тартып, мурунку калыбына келе калды да:"},{"t":"p","h":"– Чатаксыз кайт, менин колум сага барбайт, – деп үчүнчү эскертти (предупредила)."},{"t":"p","h":"– Кел дегенде кел! Сен менин түбөлүк күңүмсүң! Багынасынбы, жокпу? Айт, канчык! – деп мылтыгын шыкаалап (прицелившись из ружья) кыздан жооп күттү."},{"t":"p","h":"Жигиттин кайтпасына кыздын көзү жетти (убедилась). Сөз менен жооп берүүнүн ордуна, саадагын тартып жиберди. Машаада (на прицеле) турган жигиттин колу ийнинен чабыла түштү."},{"t":"p","h":"– Кош, тил албадың. Түбөлүк эсиңде болсун, – деп кыз жолго түштү. Төө каадасынча учуп жөнөдү. Жигит оң колунун сынганына көп буйдалган жок. Сол колуна кылычын ала коюп, оозун ачып карышкырдай качырды."},{"t":"raw","h":"<div class=\"gloss\"><p>эрегишке туулган эмедей – какбудто была рождена для споров 1 <\/p><p>багынасынбы? – сдаешься”<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"55\">55<\/span>Кызыл буурулдун таманы жерге тийсе тиет, тийбесе жок. Жигит кылычтын сыр- кылычтын сырты менен – тыльной стороной сабли ты менен камчыланып уруп келе жатты."},{"t":"v","l":["Чабалекей куйруктанган саадактын огун кыз","дагы учурду. Учуп келе жаткан буурулдун"]},{"t":"p","h":"алдыңкы шыйрагы сыртына чабыла түштү. шыйрак – голень. большая Күүлөнгөн буурул токтогон жок, бизге жете берцовая кость бергенде гана сүрдүктү."},{"t":"v","l":["Ат омуроосу менен (грудью) жерге","тийгенде, жигит жыгылбастан чуркап кетти.","Анын оң колу, буту сынып качкан кийнктин"]},{"t":"p","h":"шыйрагындай салпактап, оң жагын чапкылап жиберди."},{"t":"p","h":"Кыз саадагын кармап тура калды да:"},{"t":"p","h":"Мен антымды орундадым. Сага кой- антымды орундадым – гон антымды сенин эрдигиң үчүн кечтим. выполнила клятву Намыс эркек менен ургаачыга бирдей экен- кечтим – прощаю дигин көргө киргенче унутпа! ургаачы – женщина"},{"t":"p","h":"Тааныш сездер:"},{"t":"p","h":"абийирсиз – бесстыдный, беспутный; абийир – совесть, честь; доброе имя; репутация (6-класс 69-бетте: Женижоктун «Айтамын санат тобуна» ырынан:"},{"t":"v","l":["Атадан кетет касиет.","Ардактап баккан баласын,","Абийирин төгүп тилдесс.","Ошалз эле жерде 71-бетте,","Абийирн бар жигиттин,","Айыбын чукуп кызартпа.","6-класс 20-бетте; «Эр Төштүк» эпосунан:","«Элемандын сырттаны,","Келер бекен?» – деп жүрдүк.","Төштүк келип кашыма,","Абийирим минтип жабылды.)"]},{"t":"p","h":"өз убалын өзүңө – сама ниновна, пострадаешь {6-класс 13-бетте; «Эр эпосунан:"},{"t":"v","l":["Айткан тилге кирбесең,","Акылымлы билбесең,","Өз убалын өзүнө, Төштүк.)","","Тапшырмалар.","1. Кыз өзү берген антын аткара алдыбы?"]},{"t":"p","h":"2. «Намыс эркек менен ургиячыга бирдей» деген сөздү чечмелеп берүүгө аракет-"},{"t":"p","h":"тенгилс."},{"t":"p","h":"ез Кызды, Баатырды жана Зарлыкты Веннлин лиаграммасы аркылуу мүнөзлөп,"},{"t":"p","h":"салыштыргыла."}],"sub":[{"title":"«Күүнүн сыры» аңгемеси","b":4},{"title":"$ «Куунун сыры» ангемесинен узунду","b":6}],"section":"АКЫНДАР ПОЭЗИЯСЫНАН","pages":[48,55]},{"title":"Чыңгыз Айтматов","blocks":[{"t":" m6XMiSBAE+nPeWwfgmQ8LEjhsM8RYS4wlls6VgJBKH37qLpIUe3zHKgoobADqedErsTAvwEewbUvs2dCqjMh4BQcg2OPK3gHC6+LIZ0MWtaQKJMgJKWz2v7UwSbHeImtwg/bOsOcAtYx0ChrUKM1H4kCU3cglp1c3pveobjOjoQ9DywXAuhRwjjWGpeL/8jxJ7Gx88feLZbMe0xAJ2Ag7e2MB1IAA","w":417,"ht":543},{"t":"p","h":"Атасы Төрөкул Айтматов (1903- 1937-ж.) партиялык, советтик белгилүү кызматкер болгон. 1937-жылкы репрессияда камалып, атылып кеткен (был расстрелян). Апасы Нагима Айтматова билимдүү, маданияттуу аял болгон. Чыңгыз Айтматов кичинекей кезиңде атасы кызматына байланыштуу Москва шаарында иштегендиктен ал жакта окуган, кийин атасы камалып кеткенде апасы төрт баласын ээрчитип, Таласка кайтып келет (возвращается). Айылда анын чон энеси Айымкыз элдик жомокторду, уламыштарды көп айтып берчү экен. Болочок жазуучунун балалыгы, өспүрүм кези оор мезгилдерге, согуш жылдарына туура келген. Ал 13 жашынан колхоздо араба айдап, чөп чаап, сугат сугарып, ар кандай иштерде иштеген. Кийинчерээк почточу, айылдык ксңештин катчысы болуп иштеген. Өзү сыяктуу башка өспүрүм балдар да согуштагы жоокерлерге нан даярдап, эгин өстүрүшкөн. Бардык жумуш келин-кесектер менен өспүрүм балдардын мойнуна түшкөн. Кышында колхоздун малын багып, жазында талаада жер айдашкан, эгиндин үрөнүн ссбишкен балдар жөнүндө Ч. Айтматов «Эрте келген турналар» деген повестинде баяндаган. Бул повесттин эпиграфында жазуучу повестти уулу Аскарга арнагаиын айтат,"},{"t":"p","h":"Кичинекей окурмандардын чоң дүйнөсүнө арналган «Атадан калган туяк» аңгемеси, «Ак кеме», «Эрте келген турналар» повесттери жазуучунун согуш мезгилинде катаал күндөрдү башынан өткөргөнүн билдирет."},{"t":"p","h":"Чынгыз Айтматов 1953-жылы Фрунзедеги Айыл-чарба институтун (сельскохозяйственный институт – ныне Аграрная академия) бутурген. Жазуучулук ишин 1952-жылдан тартып, аңгемелерди жазуу менен баштаган."},{"t":"p","h":"Жазуучу «Тоолор жана талаалар баяны» жыйнагы үчүн 1963-жылы Лениндик сыйлыкка ээ болгон. Андан кийин «Гүлсарат» повести үчүн СССРдин Мамлекеттик сыйлыгын. «Эрте келген турналар» повести үчүн Токтогул атындагы сыйлыкты, «Ак кеме» повести жана киносценарийи үчүн СССРдин Мамлекеттик сыйлыгын алган. «Кылым карытар бир күн» повести үчүн кайрадан СССРдин Мамлекеттик сыйлыгына ээ болгон."},{"t":"p","h":"Жазуучунун көптөгөн повесттери, романдары дүйнө элдеринин тилдерине которулган. Анын «Жамийла», «Биринчи мугалим», «Саманчынын <span class=\"pg\" data-n=\"57\">57<\/span>жолу». «Бстме-бет», «Гүлсарат», «Делбирим», «Деңиз бойлой жорткон Ала дебет» повесттери, «Кылым карытар бир кун». «Кыямат», «Кассандранын эн тамгасы» романдары бар. 2004-жылы жазуучунун акыркы романы «Тоолор кулаганда» (Түбөлүк колукту) деген ат менен жарык көрдү."},{"t":"p","h":"Чыңгыз Айтматов – Социалисттик Эмгектин Баатыры. Кыргыз Эл Баатыры."},{"t":"p","h":"Гаиныш сөздөр:"},{"t":"p","h":"өспүрүм кези – подростковый период (6-класс 67-беттс; «Жецижок Көкө уулу:» Ошондуктан Женижоктун балалыгы, өспүрүм кези таякелериникинлс өтөт.)"},{"t":"p","h":"7-класс 29-бетте; Калык Акиев жөнүндө: Акындын өсиүрүм кезинлеги турмушу кайгылуу жана оор болгон."},{"t":"p","h":"банндаган – описал, рассказывал (7-класс 26-беттс; Калык Акиев жөнүндө тексттен: Калык Акиевдин алгачкы ырлары элдин оор турмушу жөнүндө бамнлайт.)"},{"t":"h3","h":"Чыңгыз Айтматовдун «Эрте келген турналар» повести"},{"t":"p","h":"«Эрте келген турналар» 1970-жылы жарыкка чыккан. Жазуучу повестти «Уулум Аскарга» деп баштаган. Повесттеги окуялар Уулу Ата Мекендик согуш убагындагы 13-15 жаштагы өспүрүм балдардын ооруктагы жашоосу, эмгеги жөнүндө айтылат."},{"t":"p","h":"Повесттеги башкы каарман – Султанмурат. Анын атасы согушка чейин айылда араба айдап, эмгектенген (работал). Атасынын Чабдар атын Султанмурат өзгөчө карап багат, атасы келгенде уулу үчүн сыймыктанып. ыраазы болушун каалайт (хочет, чтобы им гордился). Суук класста Султанмурат кыялланып (мечтает), атасы согушка кете электеги турмушундагы болуп өткөн жакшы окуяларды эстеп отурат (вспоминает прекрасные моменты своей жизни)."},{"t":"p","h":"Эгер Талас дагы Инкамал-апай айтып жаткан Цейлон менен Индиядагыдай өмүр бою кышы жок болсо, анда класстагы балдар үшүп, калчылдабаса керек (наверное. не дрожали бы). Өзү болсо адыр-адырда оттол жүргөн пилдердин бирин минип алып, айылды аралап бастырмак (ходил бы верхом по селу). Көргөн эл таң калып (удивились): «Карасаңар-эй, Султанмурат го, тиги Бекбайдын уулучу, пил менен келатат ой!» – дешип ээрчип жүрмөк (ходили бы следом). Анан сог аштала н {в тот год, перед началом войны) атасы менен Жамбылга барып келишин эстейт (вспоминает). Шаарга баратканда да, кайра келатканда да араба үстүндө атасына жөлөнүп уктаганда Султанмурат өзүн абдан бактылуу сезген (ощущал себя самым счастливым человеком). Атасы барда үй-жай, огород, бак-шак, мал-мүлк өз жайында болуп, алардын үй турмушу көркүнө чыгып турчу. Ишке тыкан, оокат-тиричнликксе камбыл эле атасы Бекбай."},{"t":"p","h":"<span class=\"pg\" data-n=\"58\">58<\/span>Ал Жамбылдан жергиликтүү МТСке май ташычу. Арабасы да май ташыганга ылайыкталып жасалган (было приспособлено). ага чегилген эки аты да мыкты. Алардын бири – Чабдар. Аттарга жараша ат жабдыктары да келишимдүү. Таңга маал дөңгөлөктүн дүбүртүн алыстан уккан адам, Бекбай шаарды карай жол тартты деп. жазгырбай таанычу (не ошибаясь узнавали). Султанмурат мына ушулардын баарын ойлонуп, көз алдынан өткөрүп жатты."},{"t":"p","h":"Мына ушул сабакта Тыналиев башкарма сылтый басып класска кирди. Ал жаз алды кош айдоонун (пахота) камылгасыи көрүү, унаа (тягла, тягловая сила), соко (плуг), анын жабдыгы (снаряжения), күздүктө айдалбай калган 200 гектар жерди кошо айдоо жөнүндө сүйлөдү. Ал 14—15 жаштагы балдардан «Ак-Сай десантын» түздү."},{"t":"p","h":"Ар бир балага аттар бөлүнүп берилип, Султанмурат командалык кылган балдар кышы бою жакшылап багып, соко шаймандарын, ат жабдыктарын даярдашты. Мына ушундан кийин гана алыскы Ак-Сайга жөнөштү. Жаан-чачын, жаратылыштын татаал сыноосуна чыдап (терпели природные катаклизмы), балдар Ак-Сайдын жерин айдап баштайт. Ошол учурда белгисиз (неизвестные) каракчылар кошко чегилген аттарды уурдап кетишет (украли)."},{"t":"p","h":"Артынан кууп бараткан Султанмураттын атына ок тиет (попадает пуля). Эми карышкырлар чыгып аттын өлүгүн (труп) жегени турат. Султанмурат да ач карышкырга кол салууга даяр. Дал ушул жерден окуя аяктайт."},{"t":"p","h":"Чыгармада тынч турмушту бузуп, согуш чыгарган адамдарга, үмүт менен жер айдаган, үмүт менен үрөн сепкен адамдар карама-каршы коюлган (противопоставил). «Манас» эпосундагы баатырларды эске садат (напоминает). Ошондуктан жазуучу Тыналиевди Манастын өзүнө, ал эми балдарды анын баатыр чоролоруна салыштырат (сравнивает)."},{"t":"v","l":["Жаңы сөздөр:","оорук – тыл","оттоп жүргөн – пасущиеся","ишке тыкан – аккуратный","камбыл – запасливый","жергиликтүү – местный","Тааныш сөздөр:","ат жаблыктары – конные снаряжения","сылтый басып – хромая","каракчы – разбойник","үмүт – надежда"]},{"t":"p","h":"башкы каарман – главный герой (7-класс 35-бетте, Тоголок Молленун «Кемчонтой» назмасы жонүндо: Тоголок Молдонун бул чыгармасы элдик жомоктун негизинде жазылган сатиралык чыгарма. Поэмадагы баш каармандар – Кемчонтой менсн Багдагүл.)"},{"t":"p","h":"алыр – пзгорье, холмистая местность (7-класс 2-беттс; «Жарамазан айтуу:»"},{"t":"p","h":"Адыр-адыр гоолордон,"},{"t":"v","l":["Аргымак минип биз келдик,","Аргымак башын тарталбай,","Ушул үйө туш келдик."]},{"t":"p","h":"кол салууга – нападать (5-класс 16-бетте: «Бали өзүнүн шаарын кантип сактап калды» жомогунии: аябай кзардуу Алскс лсисн кан болгон экен. Бир күнү ал өзүнүн тынч турган коншусуна кол салып, шаарын курчап алат...) <span class=\"pg\" data-n=\"59\">59<\/span>Тапшырмалар."},{"t":"p","h":"1. Ч, Айтматовдун бул чыгармасы эмне жөнүндө”?"},{"t":"p","h":"2. Башкы каарман Султанмурат эмнелерди эстеп, эмне жөнүндө кыялданат?"},{"t":"p","h":"3. Бекбай кандай адам?"},{"t":"p","h":"4. Жаш балдар оорукта улуу жеңишкс кандай салымдарын кошушту? $, Улуу Ата Мекендик согуш учурундагы ооруктагы (тылдагы) турмуш жөнүндө"},{"t":"p","h":"эмнени билесинер?"},{"t":"h3","h":"Улуу Ата Мекендик согушта ооруктагы турмуш"},{"t":"p","h":"Айылдагы эр-азаматтар согушка кеткенден кийин оорукта жалаң гана кыз-келиндер, улгайган адамдар (пожилые люди), ЩИ жаш балдар калган. Кош айдоо, түшүм жыйноо ооруктагылардын мойнунда калган. 14— 15 жаштагы мектеп окуучулары да колхозго жардам берүү үчүн убактылуу окуудан бошотулган (были временно освобождены от занятий). Ооруктагылар улуу жеңишти жакындатуу учун оз салымдарын эмгеги менен кошкон (внесли вклад своим трудом)."},{"t":"p","h":"– Келген жөнүм мындай, – деп башта- – жөнүм – здесь: повод ды Тыналиев кадала тиктеген балдарды кыдырата карап."},{"t":"p","h":"– Мектебинер суук экен, бирок самандан башка берер менде отун жок... Абал оор (положение тяжелое), согушта да абал оор Былтыр 200 гектар жерге күздүк кем (мало) – кузлук – озимые айдалып калды. Бу да болсо согуштун кесепети. Мына менин келгеним да ушул туйшук менен. Кээ бириңер азырынча мектепти коё тургула деп айткым бар... Айдоо алыс, Ак- Сайда, Аялдар бара албайт, Башка жарамдуу эл жок. Эмне кылмакпыз? Ойлоп, ойлоп оту-"},{"t":"v","l":["руп, акыры окуучу балдар, силерден жардам","сурайлы дедик...","Мына ушинтип сүйлөдү Тыналиев"]},{"t":"p","h":"башкарма. Аскерден кие келген боз шинели үстүнөн түшпөгөн, көк тумагы башында, асынма сумкасы (полевая сумка) капталында, өзү жаш болсо да караганы катаал, кабагы караганы катаал – взгляд түнт, кабыргасы кем капталына кыйрандай „е„,, түнт – угрюмый баскан. бет отунун сөөгү чыгып. арыктап кыйрандай баскан – хромающий калган башкарма ушинтип сүйлөдү..."},{"t":"raw","h":"<div class=\"gloss\"><p>суровый<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"60\">60<\/span>– Мен жыргап кеткеннмен (не от хорошей жизни) силерди окуунарлан ажыратып жаткан жокмун (отрываю вас от занятий). – деп сүйлөдү Тыналиев. – Башка зрга жок (нет другого выхода). Кичине эмессиңер, туура түшүнгүлө (поймите правильно). Согуш бүтөр замат, же андан деле мурун мектебиңерге өзүм кайра апкелип, окууңарды уланткыла дейм. Ага чейин силердин мойнуңарга тагылган милдет (обязательство) ушул."},{"t":"p","h":"Башкарма балдарды колхоздун ат сарайына (конюшня) алпарды. Аттар абдан арык эле. Балдар оозун ачып туруп калышты."},{"t":"p","h":"– Эмне алаясынар! (что смотрите) – деп чаңкылдады (крикнул) Чекиш чал. – Силерге буерде Манастын тулпарларын таптап туру дедиңер беле? Четинен кармап ала бергиле, тандаганыңар ошо болот."},{"t":"p","h":"Жыйырма күн эле жакшы баксаңар, ушул көтөрүм аттардын ар бири оюн салып чыга келет. Айтты-айтпады дээрсинер!"},{"t":"p","h":"– Кармагыла, балдар! Керектүү жемчөбүн бүт беребиз. Кана, ар кимиңер төрттөн алгыла! Жактыргылачы (выбирайте), кана, көрөйүн. – деди башкарма."},{"t":"p","h":"...Беш кошко деген жыйырма ат күнөстө ТИЗИЛИП (стояли на освящённом солнцем месте), күртүлдөтө акырдан баш көтөрбөйт. Беш бала, жыйырма ат – Ак- Сайдын десанты деп, Тыналиев ушуну айткан. Башкарма таң эрте (рано утром} келип бир кыдырып көрөт (обходит). ал учурда балдар да аттарынын жанында какыйып турат (стоят смирно). Башкарманын алиги сөзүнөн кийин бригадир, арабакеч, атчылары бардыгы «десант, десантчылар, Ак-Сайдын аттары, Ак-Сайдын чөп-жеми, Ак-Сайдын сокосу» дей турган болушту. Ат сарайдын жанынан өтүп бараткан адамдар да десанттын ал-жайы кандай экен деп, бир баш багып кетет (заходят). Башкарма десанттын командирлигине Султанмуратты дайындады."},{"t":"raw","h":"<div class=\"gloss\"><p>көтөрүм – здесь: очень худой<\/p><p>куртуллото – пригтушению хрустя<\/p><p>лайынлалы – назначил<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"61\">61<\/span>– Баарына сен жооп бересин. – деди ал Султанмуратка. – Кишилерге да. унаага да, сокого да, шайманга да сен жооп бересиң. Ак-Сайдагы айдоого сен жооп бересиң. Жооп бериш деген тапшырманы аткарыш деген сөз. Тапшырма аткарылмайынча эч кимиңердин сөзүңөрдү укпаймын да, кабылдабайм. Үркөрдөй Ак-Сай десантынын алдында Тыналиев ал күнү ушинтип сүйлөдү."},{"t":"p","h":"Кошчу балдар башкарманын жүзүнө тик карап, сыймыктана кулак төшөп, ар бир буйругун (приказ) аткарууга даяр турушту. Балдарга азыр алдында башкарма эмес, зоот"},{"t":"p","h":"(одетый в боевое одеяние), каарынан жер жарылган көк жал Манас өзү тургандай көрүндү. Өздөрү болсо Манастын чоролору сыяктанды. Бир колго калкан (щит). бир колго кылыч (сабля) кармап тургандай сезишти. Манас өзү жардыгын айткан бу баатыр – чоролор ким эле?"},{"t":"p","h":"Баш чоро – Султанмурат. Бекбайдын уулу, он бештеги Султанмурат кошчуларга кол башчы (здесь: командир) болуп дайындалды. Атасы Бскбай алыскы чоң казатта (на войне) жүрөт. Жоого минсе жарайт деген Чабдарын уулуна таштап кеткен."},{"t":"p","h":"Экинчи чоро – Анатай баатыр болду. Жаңы он алтыга караган, бул бешөөнүн улуусу. Ителгидей мыжыгыр (хваткий как балабан – вид сокола), теңтушуна алдырбаган баатыр. Жоого минер Октору деген аты да келишти. Анатайдын атасы да согушта, чоң казатта."},{"t":"p","h":"Үчүнчү баатыр атка жеңил, тайга чак- Эркинбек баатыр болду. Үйүндөгү балдардын улуусу. Досун жолго таштабас. бирөөгө кара санабас. ак жүрөк баатыр. Атасы чоң казатта Москваны коргоп окко учкан. Жоого минер аты аркарды койдой айдаган Акбайпак деген күлүк."},{"t":"p","h":"Төртүнчү чоро – Эргеш баатыр. Бу дагы жанга шерик жакшы дос. Он бештеги курагы. Өз оюн тартынбай айтып, жакпаганын бербеген көйгашка (отличающийся от других своими хорошими качествами; выделяющийся среди многих). <span class=\"pg\" data-n=\"62\">62<\/span>Ишеннн тапшырган иштен кам санаба (не переживай). Эргештин атасы да алыста, чоң казатта. Баатырдын өзүнө куп келип, Алтынтуяк аты да жарашты."},{"t":"raw","h":"<div class=\"gloss\"><p>кабыллабайм – не приму<\/p><p>кулак төшөп – слушая<\/p><p>көк жал – храбрый. бесстрашный биреого кара санабас. ак жүрөк – не желающий зла<\/p><\/div>"},{"t":"p","h":"Бешинчи чоро – Кубаткул баатыр. Бул да он беште, үйүндөгү балдардын улуусу. Кубаткулдун атасы тиги чоң казатта Белорустун токоюнда окко учкан. Кубаткул өзү эмгектен чарчабаган мээнеткеч (трудолюбивый). Жибекжал тулпарын сылап-сыйпап таптап жаткан кези (тренирует)."},{"t":"p","h":"Тыналиевдин алдында мына ушундай баатырлар турду. Кар кетери менен жер тилишке тетиги Ак-Сайга барат бу балдар."},{"t":"p","h":"Тааныш сөздөр:"},{"t":"p","h":"башкарма – председатель 15-класс #7-бетте, Шүкүрбек Бейшемалисадин «Мүйүздүү козу» аңгемесннен: Тегерек калпакчан башкарма Азиздии боз иригнн жакшы көрөрүн баамдаган окшойт. "},{"t":"v","l":["тулпар – иноходец (6-класс 13-бетте; «Эр Төштүк» эпосунан:","Колуна өгөө тийген соң,","Кубаларын билген соң,","Элемандын Эр Төшгүк,","Тулпарына камчы уруп,","Мына ошондо Чалкуйрук,","Бугудай мойнун бурады,","Бурулбай аттап чурады.)"]},{"t":"p","h":"чоро —витязь (7-класс 8-бетте: «Манас» эпосумун кыскача мазмуну: Көпкө созулган кагуу согуштан кийин Манастын он эки чоросу окко учат: Сыргак, Серек, Алмамбет, Чубак, Музбурчак, Көкчө, Акжолтой, Акаяр, Балчоро. Байчоро, Бокмурун, Карателек.)"},{"t":"v","l":["Таншырмалар.","1. Тыналиев башкарма мектепке кандай иш менен келди?"]},{"t":"p","h":"2. Алыскы кош айдоого эмнс үчүн мектеп окуучулары бара турган болушту?"},{"t":"p","h":"3. Ак-Сайга баруудан мурда кандай даярдыктар көрүлдү?"},{"t":"p","h":"4. Эмнс учун Ч. Айтматов Тыналиев башкарманы Манаска, ал эми кошчу балдарды"},{"t":"p","h":"анын баатыр чоралоруна салыштырат”"},{"t":"p","h":"ЖЕ Кошчу беш баланы мүнөздөп бергиле."},{"t":"h3","h":"Султанмурат менен Мырзагүлдүн"},{"t":"p","h":"аруу сезимдери аруу сезимодери – трепетные чувства Султанмурат өзүнүн классташы Мырзагүлдү ичинен жактырат (влюблён). Кыш келгенде Инкамал-апай Мырзагүлдү Султанмураттын ордуна которуп отургузат. Анткени терезеден суук уруп турат. Мурда Мырзагүл ушул орунда отурчу эле. Мугалим Султанмуратты Мырзагүлдүн ордуна отургузганда ал ичинен сызып калган (затаил обиду). «Эгер Мырзагүлдү ордуна калтырса, терезе жакка мен отурмакмын» – деп ойлойт Султанмурат. Эми танаписте жанына жолосо манаттай кызарат (краснеет как манат (манат – ист.) Ворсистая ткань кустарного производства типа фланели, бумазеи, но дорогая, чаще красного цвета; привозилась из Бухары). Классташ <span class=\"pg\" data-n=\"63\">63<\/span>кыздары да алардын аруу сезимдерин байкап, сабакта «Султанмурат+Мырзагүл=эки ашык» деп кагазга жазып. партадан партага таратат (передают по всему классу)."},{"t":"p","h":"Султанмурат кызга кат жазып, жооп күтүп кыйналат (томится в ожидании ответа). Ак-Сайга женер алдында (перед отъездом) дагы бир кат жазып, анда төрт күндөн кийин кетери жөнүндө билдирип, болжошкон жерле (на условленном месте) күтүп турат. Ошол жолугушууда Мырзагүл «$.р.М» деп сайма сайылган жүз аарчыны тапшырат. Ал жүз аарчыны Султанмурат жүрөгүнүн тушунда (около сердца) эң кымбат белек катары сактап жүрөт."},{"t":"p","h":"Жээк бойлой бастырып жүрүп, Султанмурат улам жолду карай берди. Мына ошондо жалгыз келаткан Мырзагүлдү көрдү. Кыз сууга жакындап калган эле. Дал аттамчыктан алдынан чыгайын деп, Султанмурат Чабдарды теминди. Жүрөгү опколжуп. ушунчалык коркуп, ушунчалык кубанып кеткен экен, башы айланып, эриндеринен: «Кымбатым!» – деген ысык деми чыкты."},{"t":"p","h":"Мырзагүлдү аттамчыктан тосуп алды. Аттан түшүп (спешился), тизгинди узун кармап, кыз бүйүзгө чыгарын күтүп турду. Мырзагүл ага түз келатты, жадырап жылмайып келатты."},{"t":"p","h":"Абайла, жыгыласың! – деп үн салды Султанмурат."},{"t":"p","h":"Гүлдөн-гүлгө учун конгон котелок мисал тиги кыздын этек-жеңи желбиреп, аттамчык аттап келатканы бир сонун көрүндү. Же сүйгөн жигитке (влюблённому джигиту) ошондой сонун көрүнөбү? «Жигит» деген оюна Султанмурат өзү корстон болуп каллы. Ал колун сунуп турду, кыз ага түз келатты, жалжылдап тиктеп келатты (смотрела с умилением), жадырап жылмайып келатты."},{"t":"p","h":"– Абайла, жыгыласың, – деди дагы бир жолу. Кыз эчтеме деген жок, күлүп гана койду. Мына ушунусу менен көптөн зарыктырып, санааркай күттүргөн (заставила долго <span class=\"pg\" data-n=\"64\">64<\/span>ждать) жообу айтылгандай болду. Кат жазып, жооп күтүп, азап чегип жүргөн өзү апенди (чудак) экен да!.."},{"t":"raw","h":"<div class=\"gloss\"><p>агтамчык – место для перехода<\/p><p>теминди – пришпорил<\/p><p>жүрөгү опколжуп – сердце сжималось<\/p><p>тизгин – поводья<\/p><p>бүйүз – берет учуп көмгөн көпөлөк мисал – как порхающая бабочка<\/p><p>корстон балуп – гордясь жзлыран жылмайып келиггыблаженно улыбалась<\/p><\/div>"},{"t":"p","h":"Кыз колун берди, эки алакан жабышып, Султанмурат кызды сүйөй тартып алды. Ушунча жыл бир класста бирге окуп жүрүп, кыздын колу мынчалык сешмтал. мынчалык сырдуу экенин билбептир. «Мына мен, каалаганың\\ – деди кол."},{"t":"p","h":"Мен кубанычтамын (я рада)! Кубанычымды сезбей турасынбы, сөз!» Султанмурат кыздын жүзүнө тик бага карады (посмотрел прямо). Карап алып, өзүн тааныгандай таң калды. Өзүндөй болуп кыз дагы көрүшпөгөндөн бери мурдагыдан алла канча өзгөрүптүр (сильно изменилась), бой салып мүчөсү сыналыптыр, кеселден жаны айыккан жацдай (как будто только оправилась от болезни) кездеру бир башкача. жалжылдайт. Кыз дагы аны сүйүп, түнкүсүн уйкусу качып, күндүзү санаа тартып жүргөндө Султанмураттай болуп өзгөрүп. өсүп калыптыр. Ошонусу менен ал азыр баштагыдан сулуураак, баштагыдан жакыныраак көрүнлү (казалась ближе)._Турган таалайлын турпаты, убаласындай бодун (вид её, как обещание счастья). ал убада көздөн көзгө өтүп, Султанмураттын жүрөгүнө коюлду, боюна тарады."},{"t":"p","h":"– Мен сени ооруп калдыбы десем... Султанмураттын үнү титирей түштү."},{"t":"p","h":"Мырзагүл ага жооп берген жок, бир гана:"},{"t":"p","h":"– Мына, – деди да. төрт бүктөлгөн жүз аарчы берди. – Сага!"},{"t":"p","h":"Башка сөз айтпастан жөнөй берди. Кийин Султанмурат ушул жүз аарчы менен сүйлөшө турган. Бир күндө нечен ирст чөнтөгүнөн алып чыгып, жибек жип менен саймаланган жүз аарчыны карайт. Кайра чөнтөгүнө салып, аздан соң сагынып кеткендсй кайра карайт. Дептердин барагындай (как лист тетради) жүз аарчынын бурч-бурчуна (по углам), четтерине гүл жалбырак түшүрүп, <span class=\"pg\" data-n=\"65\">65<\/span>сайма сайыптыр. Бир бурчундагы гүл арасына кызыл жип менен үч тамга жазылыптыр: «5.р.М». Мунусу «Султанмурат жана Мырзагүл» дегени го! А кезде кыргыздар ийкемдүү латын тамгасын окучу, латынча жазылган бул үч тамга Султанмураттын узун сабак катына берген жообу эле."},{"t":"raw","h":"<div class=\"gloss\"><p>суйай тартып алды – помог перепрыгнуть<\/p><p>сезимтал – чувственный<\/p><p>сырдуу – таинственный<\/p><p>каалаганын – твоя желанная<\/p><p>жузу – лицо<\/p><p>мүчөсү сыналыптыр – стала стройнее Ш<\/p><p>титирее – дрожать<\/p><p>жүз аарчы – платочек<\/p><p>саймаланган – вышитый<\/p><\/div>"},{"t":"p","h":"Тапшырмалар."},{"t":"p","h":"1. Султанмурат менен Мырзагүлдүн ортосундагы сезим экөөнө гана белгилүү беле?"},{"t":"p","h":"2. Алардын сезимдери кандайча өнүгө баштады?"},{"t":"p","h":"3. Султанмурат Мырзагүлгө кандай мамиле жасайт?"},{"t":"h3","h":"Султанмурат менен Мырзагуллун ортосундагы наристе сүйүүнү жактан"},{"t":"p","h":"коллойсунбу?"},{"t":"h3","h":"Кош айдоодогу окуялар"},{"t":"p","h":"Жаз келип, Ак-Сайга Султанмурат, Анатай, Эркннбек биринчилерден болуп жөнөштү. Башкарма балдарга тамак жасап берүү үчүн бир кемпирди кошуп жөнөттү. Алгачкы барган күнү эле аба-ырайы бузулат. Аттар кышы бою сарайда иши жок турганы үчүн (т.к. стояли без дела) жумушка көнбөй, тнзелери калтырап (колени дрожали) токтоп калып жатышты. Кечинде кемпир мергенчилер таштаган шыралгылан (подарок охотника из добычи) деп тоо текенин этин бышырып берет. Ашпозчу кемпир аттарга сугу түшүп, алардын жакшы багылганын, согум а ндыгын (20дны на убоину) айтат. Бул Султанмуратка жакпайт (не понравилось). Эртеси күнү күн ачылып, аттар да көнүп, балдар бир топ жерди айдап бүтүшөт. Ошол күнү алар турналарды көрүп, алардын эрте келншин жакшылыкка жорушат (истолковали как добрый знак). Балдар атчан, мылтык асынган кнщини (человека с ружьём) көрүп, мергенчи дсп ойлоп, ага ыраазычылыгын билдирип коюш үчүн кыйкырып (чтобы выразить свою благодарность), аны чакырышат. Бирок мергенчи аларга жооп да бербей бастырып кетет (уходит)."},{"t":"p","h":"Эртеси кун чайыттай ачылды. Кечээги кечээги алай-пулей – вчерашалай-лулейдун изи-жыты жок. Болгондо аба ным, саал чыйрыктырып сыдырым салкын, кыламык кар – первая пороша, жердин бетин кыламык кар, бирок тоо башкача, эски кийим ордуна жаңы кийим кийи- сүткө чайынгандай таптазанип. сүткө чайынгандай таптаза. Чыгыш-"},{"t":"v","l":["тын көк асманын түркүн түс нурга бөлөп,","чистая, будто умылась иа молоке","(гора)"]},{"t":"p","h":"дүйнөгө озун жар айтып жадырап, тоо ^Үйнөгө жар айтып жадырап наслаждаясь опопсцая миру о себе артынан кун чыкты."},{"t":"p","h":"Ак-Сайдын адырмагы, чыбыры. андан алырмагы, чыбыры. жайык төмөн агылган жайык талаасы алаканда-"},{"t":"v","l":["гыдай учу-кыйырына чейин көз алдыда.","","5-81","– взгорье, холмы,","иросторные полы"]},{"t":"p","h":"<span class=\"pg\" data-n=\"66\">66<\/span>Айрыкча Манас-Атанын керме тоосу түн ичинде жакын жылып келгенсийт. ишене албайсың, бирок көзүң көрүп турат, боорунда туулуп-өсүп, эми боорунда тирилигин кылып жүргөн перзенттерине кайрат бергенсип, тоолор жакын келиптир, ошол үчүн баштагыдан бийик, баштагыдан улуу көрүнөт, көкүрөк керип бараандатат. Сыртка жаңы чыккан балдар тоолордун залкарлыгына, сулуулугуна, улуулугуна таң калып, сыймыктанып карап турушту. Күн нуруна чайынган тоолор шул саатта алыс да, жакын да, сүйкүм да, сүрдүү да көрүндү..."},{"t":"p","h":"Ырас, ал күнү Ак-Сайга жаңы таң атты. Жер кичине тоборсусун дсп, балдар айдоого шашпай чыгышты. Ага чейин аттарын кашып-тарап, сергитип, жабдыктарын тууралап, нымдашкан сүлүнү күнгө жайып, майда-чүйдө иштерин бүтүрдү. Күн бат эле ысыды. Балдар аттарын коштоп, соколорго жөнөдү. Соколор жерге батып калган экен. Үчөөлөп ар бирин бирден оодарып, тиштерин тазалап, дөңгөлөктөрүн майлашты. Анан аттарды кошту. Бүгүн бул айдоону бүткүдөй болушса, эртең жаңы айдоого түшмөк. Иш эпкнндүү башталды, кызуу жүрдү. Түнүндө эс алып эрте менен кашынып, тазаланып, бой жазып алган аттар соколорду тың тартышты. Кам эти чыйралып, ишке кадимкидей көнүп калыптыр. Оор ишке мал деле болсо көнүшү кыйын. көнгөн соң иштин оордугу анча сезилбейт. Кечээ күнү жан үрөп жакшы элс айдашкан экен. азыр сыдырымга жер бат тоорсуду да, конторулган дын катпады, желдеген соң күндүн ысыгына майдаланып жатып калды. Айдоонун сапаты ушунда,"},{"t":"p","h":"Бүгүн күн деги оңунан берди. Ишин шыр жүргөн, жаш чилнг н манызы (суть каждодневной жизни, быта) дааналанган, турмушуң жөнөкөй, сонун көрүнгөн күндөр болот эмеспи. Кыштын кыраан <span class=\"pg\" data-n=\"67\">67<\/span>чилдесиндеги кыйналган мээнет бекер кетпегени ушул, соко жерди чытырата тилип, дүйнө кенен, көңүл чак. Бүгүн Эргеш менен Кубаткул келип калар. Беш соко, беш кош деген оңой күч эмес. Десант деп ошондо айтса болот. Анан үрөн сээп, маласын тартып сал да, Баба дыйкандан түшүмүн тилеп жата бер! Жаздык буудайдын да ууздай болгон өзүнчө касиети бар эмеспи. Чекиш биргат айткандай, жаздык буудай түшүмдүүлүгү жагынан гана күздүктөн калбаса, нанынын даамдуулугу күздүктөн артыкча."},{"t":"raw","h":"<div class=\"gloss\"><p>керме тоо – цепь гор көкүрөк керип баравндатат – неясно видиостся, проступает, раскинув грудь<\/p><p>жер кичине тоборсусун – пусть немного подсохнет земля<\/p><p>кам эти чыйралып – слабое тело закаляясь. напрягаясь<\/p><p>жан үрөн – не жался себя<\/p><\/div>"},{"t":"p","h":"Баба дыйкан жамгырын кенен берсе. Ушунча мээнет зарп болуп, маңдай тер төгүлүп жаткан соң жамгыр деле аянбас, а көрө тияктагы согушуп жаткандар бекем туруп, кетенчиктебей илгерилесе, кийин бул жаздыктын нанын жегенде тамакка түйүлбөгүдөй болуп. абийир менен душманды сүрүп турушса болгону..."},{"t":"p","h":"Ошентип балдар тилкени эки тилимден кеңейте беришти. Алдыда Султанмурат, андан эки жүз кадамча артта Анатай, жарым чакырымдай кийин жакта Эркинбек... Жон нымшытып, күн ысып келатты. Түндөн калган кыламык бат эле жок болуп. адыр-дөңгө жашыл ыраң жылбырскалана түштү. Жомоктогудай болуп, айдоонун бир учуна баратсаң оң жагыңда жашыл килем, кайра кайтып аягына баратсаң сол жагыңда жашыл килем. Күн табына жылынган сайын жер жылуу ным жыттанып (пахнет теплой влагой), көөп келет. Үч кош болсо Ак-Сайдын боорун тилип, жалданган бороз (борозда) таштап баратат..."},{"t":"p","h":"Жакын жерден торгой учту. Көкөлөп барып, канаттарын дирилдетип токтой калды да, сайрап кирди. Нараактан дагы бир торгой сайрап жатты. Дагы бир тараптан торгой үнү угулгансыйт. Үйү жок, жайы жок, отун-суу менен иши жок, үстүнө жапкан жалбырагы, конуп отурар бутагы жок, шыбактуу талаада жашап. сайрап күн көргөн <span class=\"pg\" data-n=\"68\">68<\/span>торгойлорго Султанмурат күлүмсүрөп баратты. Ушул жашоосуна ыраазы бул макулуктар. Жазга ыраазы. күнгө ыраазы, башка эчтеменин кереги жок. Кечээги алай-дүлөйдө булар касрге жашынышты экен? Эптеп түнөп чыккандыр, мына эми анын баарын унутуп, сайрап жатышат. Адамдын моокумун кандырат, сезимин козгойт... Жаз келет деген ушул да, эми кыш кайрыла албас. Жаз жарыш, иш чачтан көп, бул айдоо башталмасы гана. Заарканып эмне! Бүгүн Эргсш менен Кубаткул келип калса, десант толук болуп, иш дагы ыкчам илгерилээр (продвигаться вперед...). Маал-маалы аттарын «Чү!» деп коюп, Султанмурат тетигинде четтеп бараткан атчанды көзү чапды (заметил). Ал айдоонун тигил учун кайрып, тоого бет алып барат, улам-улам кошчуларды карап коёт. Асынган мылтыгы бар. Башында сансан ту- Мак (шапка из меха уже несколько подросшего ягненка). Мингени сөөктүү жээрле ат (костлявый рыжий конь). Арттагы балдар да көрүп, кыйкырып калышты:"},{"t":"raw","h":"<div class=\"gloss\"><p>кыраан чилде – самос холодное время энмы<\/p><p>күздүк – озимые<\/p><p>кегеичикгебей – не отступая<\/p><p>жаздык – яроная пшеница жылбырскалини гушлу – стало изменчивым<\/p><\/div>"},{"t":"p","h":"– Эй, мергенчи, бери кайрыла кет!"},{"t":"p","h":"Бирок мергенчи жооп кылып үн салбады. Токтобостон, жакындабастан, улам карап коюп кете берди. Султанмурат кишинин караанын көргөнүнө кубанды, аттарын токтотуп, үзөңгүгө тура калды (привстал на стремя):"},{"t":"p","h":"– Эй, мергенчи, шыралгага ыракмат! Ыракмат дейм! Жолуң болсун!"},{"t":"p","h":"Бирок тиги атчан унчукпастан өтүп кете берди. Укпайт дегидей ыраак эмес болчу, бирок жооп кайтарбады. Кыязы шашып бара жаткан неме го. Аздан соң дөңдү ашып, көрүнбөй кетти."},{"t":"p","h":"Жарым сааттай убакыттан кийин дагы бир мергенчи көрүндү. Ал дагы мылтыкчан экен, ал дагы тоону бет алып кетти. Ал айдоонун бияк четинен айланып өтүп, ал да балдарды улам карап өттү, бирок кайрылбады, унчукпады, кошчулар менен саламдашпады, кошчу көргөн жолоочу (путник) кыя өтпөйт <span class=\"pg\" data-n=\"69\">69<\/span>(не пройдет мимо), кайрылып саламдашып, иш илгери болсун, кырман толсун, кепсенге келербиз деп кетт эмеспи. Чекиш чал айткандай, азыркы адамдар башкача болуп калганбы. Салтты унутуш деген эмне, айтсаайтпаса Чекиш чалдыкы туура белем."},{"t":"raw","h":"<div class=\"gloss\"><p>шыбактуу талаада жашап – жини ня поле стюлыныо моокумун кандырат – удоалетворяет<\/p><p>кошчу – стремянный (на обязанности которого лежит уход за лошадьми) <\/p><p>шыралга – подарок охотника из добычи<\/p><\/div>"},{"t":"p","h":"Мергенчилер кеткенден кийин бир сонун окуя болду."},{"t":"p","h":"А деп Анатай көрүптүр. Көрүп эле тамагы айрылганча кыйкырып калды: Турналар! Ээй, карагылачы, турналар учуп барат!"},{"t":"p","h":"Султанмурат башын шак көтөрүп, асманды карады. Төбөсү ачык, түбү жок, тунук көктө коңгуроодой үн салып, кээде бирбирине орун алмашып коюп, эки ача тизилген турналар учуп баратыптыр. Бийик учуп баратышат. Бирок асман абдан бийик, учу-кыйры, түбү жок ээн көктө каалгыган турналар шамалга учкан кыз жоолугундай болуп, көздүн жөөсун алат."},{"t":"p","h":"Султанмурат чалкалап карап туруп кыйкырды:"},{"t":"p","h":"Жаша-аа! Турналар!"},{"t":"p","h":"Түшкө кирбес укмуш көргөнсүп, үчөө тең кыйкырды:"},{"t":"p","h":"Турналар! Турналар! Турналар!"},{"t":"p","h":"Турналардын эрте келгени жаз менен жайга жакшы жышаан деген карыялардын сөзүн эстеди Султанмурат."},{"t":"p","h":"Эрте келген турналар жакшы жышаан! – деп ээр үстүндө артына толгоно берип кыйкырды ал Анатайга. – Түшүм болот! Түшүм мол болот."},{"t":"p","h":"Эмне, эмне? – деп Анатай жакшы укпай жатты."},{"t":"p","h":"Түшү-үм! Түшүм мол болот!"},{"t":"p","h":"– Анатай артына толгонуп, Эркинбекке кыйкырды:"},{"t":"v","l":["Түшүм мол болот! Түшүм!","Эркинбек жооп кайтарды:"]},{"t":"p","h":"Уктум, укту-ум! Түшүм мол болот! Турналар көк мухитке киринип, кээде жабыла, кэзде жалгыздан үн салып, канаттарынын <span class=\"pg\" data-n=\"70\">70<\/span>учтарын гана арине каккылап, каалгып сүзүп баратты. Бүгүнкү тунук, таза абада сурнай сымал кооз созулган моюндары. учтуу ничке тумшуктары, бири боору-"},{"t":"raw","h":"<div class=\"gloss\"><p>кепсен – подарок зерном с тока эки ачазизилгси турналар – летящие в два рада галочкой учу-кыйры, түбү жок ээн<\/p><p>көктө – на бесконечном. бездонном свободном небе шамалга учкан кыз жоолугун-<\/p><p>дай – словно летящий на ветру девичий платок<\/p><p>көздүн жоосун алат – радует глаз, ласкает изор<\/p><p>чалкалап – навзничь, откинувшись назад, вытягивая грудь түшкө кирбес укмуш көргөн-<\/p><p>суп – будто увидели диво, которое не могло и присниться жаз менен жайга жакшы жы-<\/p><p>шаан – хорошая примета, знак, предзнаменование к весне и лету<\/p><p>көк мухитке киринип – купаясь а синем орезе используемое в эпосе)<\/p><\/div>"},{"t":"v","l":["на бекем кыскан, бири бошураак каткан кара","шыйрак буттары даана көрүнөт. Каалгый","каккан канаттарынын учтарындагы ак","чалгындары чаарланат (пестрится)."]},{"t":"p","h":"Балдар ошентип акыйкат карап турганда турналар акырындап төмөндөй баштады. Тиги этектеги адырмактуу боорго (на склон с бугорками) агызып бараткансып, турналар жапыстагандан жапыстады. Султанмуканаттарынын ак чалгынлары -"},{"t":"p","h":"белые перья на крыльах"},{"t":"p","h":"рат бала болуп башына жүн чыкканы тур- жаныстагандан жапыстады – наларды жакын жерден керген эмес. Качан ы болсо бир көргөн түштөй бийик асманда учуп өтүп кетер эле."},{"t":"p","h":"– Карагылачы, карагылачы, коңгону баратат! – деп кыйкырды Султанмурат."},{"t":"p","h":"Үчөө тең аттарынан ыргып түшүп, кошту орду-ордуна таштаган бойдон турналар конуп бараткан адырды көздөй чуркашты."},{"t":"p","h":"Тааныш сөздөр:"},{"t":"p","h":"Кун нурума чайынган тоолор алыс да, жакын да – н далёкие, и близкие горы, вымытые солнечными лучами (6-класс 108-бетте;: Чыңгыз Айтматов жөнүндө тексттен: Ч. Айтматов кун жаркырап тийген терезеден алыскы тоолорго ойлуу тиктейт.)"},{"t":"p","h":"Баба дыйкан – миф: Баба дыйкан (покровитель земледелия) (7-класс 1-бетте; «Киришүү. Элдик оозеки чыгармачылык:» Элдик ырдан «Баба лыйкандый сезу:».) торгой – жаворонок (5-класс 30-беттс; Т. Сатылгановдун «Турумтай! менен торгой» адабий жомогунан: Ошондо тоонун торгою көкөлөп уча албай. жерге гуше албай жеңилди. Бөксөнүн торгою канатын күнгө кактай албай, сайраган менен, тилин тактай албай, жүдөп турган кези.)"},{"t":"p","h":"Таншырмалар."},{"t":"p","h":"1. Балдар иштеген талаа, Манас-Атанын керме тоосу кандай сүрөттөлөт? Үзүндүдөн"},{"t":"p","h":"сүйлөмдөрдү таап, жооп бергиле."},{"t":"p","h":"2. Балдардын жасаган иштери жөнүндө эмнс айта аласыңар? Үч кош менсн Ак-"},{"t":"p","h":"Сайдын боорум тилип, нштье балдарга оңойбу! Же оорбу? Балдардын ишараксперин баалагыла."},{"t":"p","h":"3. Айдоонун чегинде мылтык асышан киши эмнс учун кошчулар менен"},{"t":"p","h":"саламдашпады? Ал ким деп ойлойсунар”"},{"t":"v","l":["4. Турналарлы көргөндө балдар эмне үчүн кубанышты?","5. Бул үзүндүдөн эмнени түшүндүң? Окуган үзүндүнүн эмнеси жакты?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"71\">71<\/span>6. Султанмурагтын жашоосу кандай экен? Согуш мезгилиндеги балдардын жашоосу"},{"t":"p","h":"оорбу?"},{"t":"p","h":"7. Азыркы кезде С панмураттай балдар кандай жашашат? Алар иштегенди билсбн?"},{"t":"p","h":"Сен керек болсо ошентип иштээр белең?"},{"t":"p","h":"@® Үйлөп «Эрте келген турналар» повестинен үзүндүнү (10-бэдүм) кыргызча да,"},{"t":"p","h":"орус тилинде да окуп келгиле."},{"t":"h3","h":"Коштун аттарына тийбегиле!"},{"t":"p","h":"Түштө колхоздон араба келип, балдарга ун, картөшкө, эт, отун, аттарга чөп таштайт. Арабакеч (извозчик) Чекиш бригат (здесь: бригадир) Эргеш менен Кубаткулду кош-мошу менен алып, эртең келери жөнүндө айтат."},{"t":"p","h":"Күүгүм кирип калганда (когда уже стемнело) балдар айдоодон кайтып келип, кемпирдин жок экенин көрүшөт. Түнү балдарды каракчылар (грабители) байлап салып, кош айдаган аттарды уурдап кетишет. Султанмурат бошонуп, каракчылардын артынан кууп, Чабдарга ок тийип, атынан ажырайт (ли-"},{"t":"v","l":["шился своего коня). Кандын жытын сезген","(учуявший запах крови) ач карышкыр аттын","өлүгүн жеш үчүн келет. Султанмурат атынын"]},{"t":"p","h":"жүгөнүн шыпырып алып (сняв узду), аны карышкыр менен алышуу үчүн курал катары (в качестве оружия) камдады. Чыгарма ушундай аяктайт."},{"t":"p","h":"Чабдар ордунда калыптыр. Султанмурат үйдөн жүгүрүп чыгып, Чабдарга ыргып минди да, жулкунган жаныбарды бир теге- – жулкунган рвущийся, рете токтой калып, балдарга кыйкырды:"},{"t":"p","h":"– Анатай, айылга чап! Кармалбай тез жет! Элди чакыр! Мен ууруларды кууп жетип, алаксыта кармап турам (задержу). Тези-"},{"t":"v","l":["рээк жете көр! Эркинбек, сен ушуерде бол, эч","жакка кетпе! Уктуңбу? Анатай, айылга чап!","Мен кеттим!.,","Жана дүбүрт кеткен тарапка Чабдардын","оозун коё берди."]},{"t":"p","h":"– Куугун! – деп бакырып ийди уурулар- куугун – погоня дын бири жакындап келаткан ат дүбүртүн угуп. – ат дүбүртү – топот лошадей"},{"t":"raw","h":"<div class=\"gloss\"><p>вырывающийся<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"72\">72<\/span>Султанмурат ат коштой чапкан (ведуще- 20 лошадь на поводу так, чтобы она шла голова в голову с той, на которой сидят) ууруларды бат эле баса жетти да, окчунураактан жандай чапгы."},{"t":"p","h":"– Таштагыла аттарды! Таштагыла! Коштун аттарына тийбегиле! – деп кыйкырды."},{"t":"p","h":"Уурулардын бири коштогон эки атты алдынкысына тапщырды да (отдал впереди скачущему). Султанмуратка атырылды, аттан оодара өтчүдөй тээп жүгүндү (рвался, желая свалить его с лошади). Бирок Чабдар буйтап жолотподу. Жайлачудай кууган уурудан буйтап (увильнул от вора), топ атты коштогон уурунун алдын торой (преградил путь), Султанмурат аттарды кайрый чапты (повернул назад)."},{"t":"p","h":"– Кайры артка! – деп кыйкырды."},{"t":"p","h":"– Жолобо, жайлап салам! (уничтожу, убью) – деп күркүрөйт ууру."},{"t":"p","h":"Бирок Султанмурат көгөрдү, алдын тороп, кайрый берди."},{"t":"p","h":"Ошондо караңгы түндү жаңыртып мылтык тарс деди. Чабдар башын жерге ургулап, коркурап (захрипел), чаап бараткансып торт аягы тыбырап жатты..."},{"t":"p","h":"Жаны кашайган Султанмурат ойлоп-карап турбастан уурулардын артынан чуркады:"},{"t":"p","h":"– Токто-о! Кутулбайсынар! Кууп жетем! Чабдарды эмне өлтүрөсүңөр?"},{"t":"p","h":"Эсин жыйбай. аргасыз ачууга алдырып, атчандарды кууп жетчүдөй, кайрып келчүдөй болуп, Султанмурат жиниге чуркап баратты."},{"t":"p","h":"Акыры күйүгүп эт-бетинен эки-үч аласалып кетти (перевернулся). Жүрөгү мыкчылды (сердце сдавило). Бул тунжураган дулей карангыны жектеп, кезунен от чагы- ЛЫШ (из его глаз полетели искры). жанына баткан оорудан онтоп (застонал), ооналактап жиберди..,"},{"t":"p","h":"Уурулардын алыс кеткен дүбүртү акырындап өчүп баратканын солуктаган <span class=\"pg\" data-n=\"73\">73<\/span>Султанмурат жерге кулагын төшөп угуп жатты. Дүбүрт уламдан-улам жердин туюк тереңинен араң угулуп, анан биротоло өчтү да, кара жер тынчып жатып калды..."},{"t":"raw","h":"<div class=\"gloss\"><p>окчунураактан жанлай чанты – преследовал поодаль төрт аягы гыбыран жатты – трясясь всем телом<\/p><p>эсин жыйбай – приходя в себя<\/p><p>солуктаган – рыдающий<\/p><\/div>"},{"t":"p","h":"Мына ошондо Султанмурат кыңкыстап ордунан турду, үн сала муңкана ыйлап, кайра артына темселей басты._Сооронор алы да, айласы да жок (не было сил успокоиться), же бул каран түшкөн Ак-Сайда аны сооротор жан жок (нет человека, который мог бы успокоить его). Согуштан кайткан атасын тосуп чыгарда учкаштырып ала барам деп Ажымуратка берген убадасын эстеп алып. ого бетер өксөп ыйлады (громко зарыдал). Эми Ажымурат экөө Чабдарга минип алып, станчага (станция) келген атасынын алдынан чаап алышпайт чыга (не могут встретить верхом на лошади). Эми Ак-Сайга себебиз деген эгиндин баарын себе алышпайт. Тиштери жаркылдаган соколорун сүйрөтүп салтанаттуу (торжественно) кайтар күн эми болбойт. Үмүт-кыялдын баары талкаланды (все мечты разрушены)... Ошол үчүн ыйлап баратты..."},{"t":"p","h":"Жаңы кандын жытын сезген бөрү. жытты карай чуркап келе жатты. Башка иткуш ээлеп албагай эле деп шашып келатты (торопился). Жылкынын эти менен теринин буруксуган жыты бөрүнү мас кылып жиберди (опьянил). Ушу жутунган боюнча барып өлүк жылкынын этине тиш салгысы келди (хотел впиться зубами), бирок куу бөрү көнүмүш сактыгына салып, шилекейин жалана боюн зордоп токтотуп, өлүктү бир айланып чыкты (обошёл). Жылкынын өлүгүнүн жанында адам турганын көрө сала бөрү селейе токтоду (встал как вкопанный). Адам чоочуп тура калды."},{"t":"p","h":"– Эй! – деп Султанмурат тап берип, жерди тепти."},{"t":"p","h":"Бөрүнүн көздөрүнөн учкундар чачырап, жалы түксүйүп (шерсть встала дыбом), акырын жакындай берди. Султанмурат катуу кыйкырып бөрүнү токтотту да, Чабдардын"},{"t":"raw","h":"<div class=\"gloss\"><p>кыңкыстоо – стонать<\/p><p>муңкана ыйлап – горько заплакал жаны кандын жытын семен<\/p><p>беру – волк, запах свежей крови эти менен теринин буруксуган<\/p><p>жыт – сильный запах мяса и шкуры лошади<\/p><p>көнүмүш сактыгы – привычная осторожность<\/p><\/div>"},{"t":"v","l":["<span class=\"pg\" data-n=\"74\">74<\/span>жүгөнүн шыпырып ала койду (снял). Эми","анын куралы ушу жүгөн болуп калды.","Карышкыр дагы жакындап келди да,"]},{"t":"p","h":"кылкан жалы лүгдлүйүп (шерсть взъерошилась), тулку бою тырышып, секирмекчи бо-"},{"t":"v","l":["луп, жерге жабышып жата калды. Көздөрү","Султанмураттын көзүнө кадалды. Бөрүнүн","көзү курчураак, заардуураак (злее) сезилди."]},{"t":"p","h":"Бирок Султанмурат жалтанбады. Бол- – жалтанбалы – не вздрогнул, не гондо өмүрүндө биринчи жолу жүрөгү муштумдай эт экенин, ал дүкүлдөп көкүрөгүн ургулап жатканын даана сезди..."},{"t":"p","h":"Султанму дун өмүрүнө арналган (посвященные биографии) «Алтын аяк», «Өкүм» аттуу пьесалары театрларда коюлду. Андан башка «Мин кыял», «Эртең жаңы жыл», «Жолугушуу», «Күттүргөн жаз да келээр», «Саадак какты», «Үмүт», «Жаза», «Жүрөлүчү жүрөк оорутпай» деген пьесалары да өлкөбүздүн көптөгөн тсатрларынын сахналарында коюлуп келатат."},{"t":"p","h":"Драматург С. Алёшиндин «Палата», Б. Брехттин «Энеке Кураж жана анын балдары» ж. б. пьесаларын кыргыз тилине которгон. Бексултан Жакиевдин киносценарийлери боюнча «Мурас», «Искусство жөнүндө баян», «Куугун» аттуу толук метраждуу (полнометражный) фильмдер тартылды."},{"t":"p","h":"Б. Жакиев 1974-жылы «Кыргыз ССРинин искусствосуна эмгек сиңирген ишмер» наамын, 1993-жылы «Кыргыз Республикасынын Эл жазуучусу» ардак наамын алган. Ал – Жусуп Баласагын атындагы Кыргыз Улуттук университетинин профессору жана Кыргыз Эл Баатыры,"},{"t":"p","h":"Драматургдун пьесалары, аңгемелери орус, украин. озбек, казак, түркмөн, татар, тажик, якут ж. б. тилдерге которулган."},{"t":"h3","h":"<span class=\"pg\" data-n=\"76\">76<\/span>Б. Жакиевдин «Атанын тагдыры»"},{"t":"p","h":"драмасы карыянын бир үйдө жалгыз каламбы, И ээсиз су ЙК «Атанын тагдыры» драмасында согушта жалт нен ү нааркоолору баяндалат. Драма 1958-жылы жа уун ат (псевдоним) ме-"},{"t":"p","h":"жазылып, 1960-жылдын сентябрь айынан баштап сахнага баны ке 2.228 Кыргыз Академиялык драма театрынын сахнасында"},{"t":"p","h":"Бексултан Жакиевдин бул драмасы Улуу Ата Мекендик согуш- Тан кийинки жылдардагы окуяларды баяндайт. Согуш элге кайгы кыйынчылыктарды алып келди. Бирөөлөр атасынан, бирөөлөр баласынан айрылышты. Согушта курман болгон Болотбектен айрылып үйүндө атасы Акылбек, аялы Зуура, уулу Жеңишбек калышат. Драмада ушул үй-бүлөнүн тагдыры жөнүндө айтылат."},{"t":"img","src":"data:image/webp;base64,UklGRtQQAABXRUJQVlA4IMgQAACQVACdASqbAVUAPrVOoUynJCqoJpKNiVAWiWkG+OmE5NBnwQHcL/rPE/8f+v/0Xlv2EOqD8w/Dn8rzL/6XhX8qdRT2Nvau3eYd7u4B+q57nagXBseq+wL5Nf+95T5vnM1+OLHUZPZLzrHMDiBbusEtKtRZU1Zg8mOwhKfUIn3Wm8wnGl өрсөтсө Да (хотя её унижают). чыдап жашай берет. Өз тагдырын өзү каалагандай кылып чечүүгө анын эрки (воли) жок. Ал үчүн туугандары кандай чечсе ошого макул болуп жашай берет. Ошондуктан өзү да ын энесине өз алдынча каршылык шы көрүп Чыгармада кичинекей Жеңишбек деген бала – чоң атасынын жак- рүп эркелеткенинен пайдаланып ен Ц (пользуясь тем. что его балуют), тентек, өзүмчүл болуп өсөт, бирок ал-ак көңүл бала."},{"t":"v","l":["Жаңы сөздөр:","өзүмчүл – эгоист"]},{"t":"p","h":"ак көн кайын эне эу кри, үл – добрый, доб санааркоо – переживании"},{"t":"v","l":["айрылышты – лишились","кайын ата – свбкр","жүрөгү пиибайт – не осмеливается","турмушка чыгат – выходит замуж таш тырмак – знал","тагдыр – судьба","үмүтү үзүлбөй – не терять надежду"]},{"t":"p","h":"<span class=\"pg\" data-n=\"77\">77<\/span>Тааныш сөздөр:"},{"t":"p","h":"жалгыз уулу – сдинственныйсын (5-класс 85-бетте, Ш.Бейшеналисадин «Мүйүздүү козу» интемесниен: Азиз чабандын жалгыз уулу.) башкы казарман – главный герой (5-класс 85-бетте; Шүкүрбек Бейшеналиев жонүндө тексттен: Жазуучунун чыгармаларынын башкы каармандары эмгекти сүйгөн, чындык, адилеттүүлүк үчүн күрөшкөн аламдар. тапкыч, акылдуу, туура тарбияланып жатышкан балдар, кыздар."},{"t":"p","h":"7-класс 61-бетте, Ч. Айтматовдун «Эрте келген турналар» певестни жонунле: Повссттеги башкы каарман – Султанмурат.) үмүтү үзүлбай – надежда не умирает (6-класс 146-бетте; Жалил Садыковдун «Эненин жүрөгү» поэмасынан:"},{"t":"v","l":["Бул кезде сактап алган суулар бүтүп,","Акыркы тамчыларлы тек бөлүшүп,","Жатышты чептегилер айла таппай,","Жашоодон биротоло үмүт үзүп.)"]},{"t":"p","h":"куйое – муж (7-класс 35-бетте: Тоголок Молдонун «Кемчонтой» поэмасынан:"},{"t":"p","h":"Колумдун чени ошондо,"},{"t":"v","l":["Энемде унут калыптыр.","Эрте барып тезирээк,","Колумдун ченин алып кел,","деп күйөөсүн өз апасына жонетет.)"]},{"t":"p","h":"кайын ата, кайната – тесть, свёкор (6-класс 22-бетте; «Эр Төштүк» эпосунан: Көк дөөнүн кызы Күлайым Төштүк келет деп күтүп жүргөн экен. Күлайымга үйлөнүп, кайнатасынын жети мөрөйүн аткарат.) кайын эме, кайнсне – теша, свекровь (7-класс 37-бетте: Тоголок Молдонун «Кемчонтой» поэмасынан: Кемчонтойго кайненеси: «Сууну казанга аз куйса, тузду дагы аз салсын. Казанга сууну коп куйса, тузду дагы коп салсын» – деп жөнөтөт. Кайын энеси – тёца.)"},{"t":"h3","h":"6 «Атанын тагдыры»"},{"t":"v","l":["(Драмасынан узунду)","","Катышуучулар:","Акылбек – 65-72 жаштарда.","Уулжан – анын кемпири.","Зуура – алардын келини, 25-32 жаштарда."]},{"t":"p","h":"Жеңишбек – абышка-кемпирдин небереси, Зууранын уулу, 6-13 жаштарда."},{"t":"p","h":"Майраш – абышка-кемпирдин кызы, 18—25 жаштарда."},{"t":"h3","h":"Биринчи көшөгө"},{"t":"v","l":["Зуура (жалгыз). Эмне кылам?.. Кстууден","башка арга жокпу? Калсамчы?.. Же ырас эле","кетишим керекпи? Жок, жок! Кете албайм!","Антүүгө кудуретим да жетпейт,","Бурулдун үнү (сүрдүү угулат). Кыз!.. —"]},{"t":"p","h":"Кыз! Акылыңдан адашпа! Азыр эле биздиадашпа – не сходи с ума <span class=\"pg\" data-n=\"78\">78<\/span>кинен кетериңде байкең экөөбүзгө берген убадаң (клятва) кана? Айныба (не лереду-"},{"t":"p","h":"Бирөөгө уул болуп бербейсиң. Эсиңе кел!"},{"t":"p","h":"Зуура. Ооба, ооба... Кетүүдөн башка арга жок эмеспи! Кетишим керек! (/Ш/ашыпбушуп чемоданын камдай баштайт.)"},{"t":"p","h":"Акылбектин үнү. А бизди кантесиң, Зуураш? Таштайсыңбы? Өзүңдү уул ордуна тутуп жүрбөдүк беле... Зуураш!"},{"t":"p","h":"Зуура. (Эчкирип ыйлап, бышып кетет). Оф! Эми канттнм?! Кандай айла табам? Түбү түшкүрдүн күнү да неге мынча басмырттанат? Думугуп баратам!"},{"t":"p","h":"Майраш. Ай-ий, келип калдыңбы, жеңе? Эмне болду?"},{"t":"p","h":"Бери мага карачы. Башыңды көтөрчү... Ыйлагансын го?"},{"t":"p","h":"Зуура. Жо-жок!.."},{"t":"p","h":"Майраш. Калп айтпа! Көзүн айтып эле турбайбы... Эмне болду сага? Айтсаң. Сырыңды (тайна) жашырчу эмес (не скрывала) элең го менден... же бир жериң ооруп турабы?"},{"t":"p","h":"Зуура. Жок, соо элемин."},{"t":"p","h":"Майраш. Анда эмнеге сабырың суз? Ачсаң кабагыңды. Калыбынча (как обычно) жарк этип күлүп койчу!"},{"t":"p","h":"Зуура. Энем кайда кеткен?"},{"t":"p","h":"Майраш. Пристанга... Атам. Жеңишбек үчөө тең..."},{"t":"p","h":"Зуура. Пристанга?! (Өзүнчө). Болотбек, ата-энен күнүгө сенин жолуңду тосуп жүрөт, ал эми мен... (ойлонуп калат. Чырпык минип, Жеңишбек кирет)."},{"t":"p","h":"Женншбек. Токоч бергилечи. кардым ачты. Атамдар көптө келишет."},{"t":"p","h":"Зуура. Эмне үчүн көптө келишет? Көлдүн жээгинде калыштыбы?"},{"t":"p","h":"Жеңишбек. Энем экөө ыраак калып калышты. Мен жеткирбей чуркап кеттим."},{"t":"p","h":"Зуура, Күтпөгөнүң эмнең? Ата-энеңди ушинтип талаага таштап, өзүң кете бересинби?"},{"t":"raw","h":"<div class=\"gloss\"><p>тузуп жүрдүк – ›десь: считали<\/p><p>думугуп баратам – задыхаюсь<\/p><p>талаага тампан – оставить где-то<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"79\">79<\/span>Женишбек. Кибирешип элс баспай жүрө беришет экен."},{"t":"p","h":"Майраш. Сүйлөчү, пристанда эмнелер бар экен?"},{"t":"p","h":"Жеңишбек. Атам болуп брнстанга (пристань) бардык. Эл көп экен. Анан бир маалда момундай чоң бир барокот (пароход) келди. Анан эл барокотко чуркап барса. Барокоттон аскерлер түшүп атат, түшүп атат..."},{"t":"p","h":"Майраш. Дагы?"},{"t":"p","h":"Жеңишбек. Дагыбы? Дагы кучакташып өбүшүп атышты. Ыйлашты... и, анан каткырып күлүштү. Анан аттарына минип алышып, арабаларына түшүп алышып. Үйлөрүнө кетишти."},{"t":"p","h":"Майраш. А атаң экөөң эмнс кылдыңар?"},{"t":"p","h":"Жеңишбек. Атам экөөбүз дөңдө турганбыз. Элдин баары тарап, барокот кайта кеткенде атам бир ордунда тура берди. Анан мен: «Болотбек атам келет, ээ, чоң ата» – деп жеңинен тартсам, атам мойнумдан жыттагылады (токтой калат, жер карап акырын). Анан атам ыйлады..."},{"t":"p","h":"Майраш. Ыйладыбы?"},{"t":"p","h":"Жеңишбек (башын ийкеп). И-и. Күндө эле пристанда эл жок калганда агам ыйлайт. Кетели десем деле унчукпай тура берет."},{"t":"p","h":"(Сырттан Уулжан, Акылбек киришет. Андан кийин чай ичмек болуп даярдана башташканда. Бурулдун үнү угулат.)"},{"t":"p","h":"Бурул. Жакшы турасынарбы, Майраш? Атан менен энең уйдобу?"},{"t":"v","l":["Майраш. Үйдө, үйдө. Кириниз.","Бурул. Амансыңарбы?"]},{"t":"p","h":"Акылбек. О. кудагый, кел төргө. Аман-эсен турасыңарбы?"},{"t":"p","h":"Уулжан. Бала-бакыраң аманбы?.. Бурул. Ойлогон ойду кыстаган турмуш жеңет деген эмеспи, кудаларым. Болотбек силердин уулунар болсо, биздин да уулубуз болуп калды эле. Кызыбыз Болотбсктей теңин тапканга жетине албай <span class=\"pg\" data-n=\"80\">80<\/span>(радуясь) сүйүнгөнбүз. Бирок кудаанын буйругу экен, урушка кеткен тейинче ал кайра тууруна келип конбой калды. Жаман аттысын уктук ..."},{"t":"raw","h":"<div class=\"gloss\"><p>теңин тапкан – нашла себе пару<\/p><\/div>"},{"t":"p","h":"Акылбек. Кой, кудагый, муну коёлу. Башка кептен сүйлөшүп отуралы. Эз, Майраш, чайың даяр болсо алып келчи."},{"t":"p","h":"Бурул. Кыз жакшы болсо барган жерин жарытат. жаман болсо кайын журтун арытат. Кудайга шүгүр, кызыбыз да жаман чыкпады, оюнардагыдай (как и хотели) келин болуп берди. Силер да ага тил тийгизип (обидеть словом}, жаман сөз айтпадыңар. Ушу бүгүнкү күнгө чейин ата-баладай болуп ынтымактуу жүрдүңөр..."},{"t":"p","h":"Акылбек. Айланайын кудагый, жамакгатпай ачык айтчы, деги эмне дегиң бар?.. Пауза."},{"t":"p","h":"Бурул. Болотбек жаңы эле уруш чыккан жылы окко учту эле. Андан бери беш жылдан ашуун убакыт өттү. Ошондон ушу күнгө чейин кыз аны жакшы эле күттү. Эми келиниңердин жаманчылыгы болгон болсо, ак батаңарды берип, кечирип койгула, кудаларым."},{"t":"p","h":"Уулжан. Сен ушуну айтмак белең, катыгүн кудагый?"},{"t":"p","h":"Акылбек. Менин уулум да Зуура, келиним да Зуура! Менин Болотбегим да Зуура. Зуурам да Зуура! Аарманар-карманганым да Зуура! Аны колдон чыгарбайм!"},{"t":"p","h":"Бурул. Ээси келсе, бээсин бер деген. Антпеңиз, куда!"},{"t":"p","h":"Акылбек. Болотбегим тирүү, ал келет! Уктунбу, кудагый, Болотбегим келет! Береги жаман күчүктүн колунан жетелеп, барокоттун жолун тосуп, көлдүн кылаасына кунуго барарымды укпай-көрбөй жүрөсүңбү? Мени аякка үмүт айдап барат. Ал эми үмүттүүгө кудай берерин унутпа, кудагый!"},{"t":"p","h":"Бурул. Атаганат, андай аттуу күн болсо, менин деле төбөм көккө жеткени турат го, бирок..."},{"t":"p","h":"Акылбек. Бирок эмес! Уулум келет!"},{"t":"raw","h":"<div class=\"gloss\"><p>кудавным буйругу – по божьей воле<\/p><p>кеткен тейниче – как ушёл<\/p><p>туурума көнбөй – не вернулся<\/p><p>жаман аттысыи уктук – услышали плохую весть<\/p><p>барган жери – семья. где стала своей<\/p><p>жарытат – облагалстельствует<\/p><p>кягыгун кулагый – что ты, сватья<\/p><p>карманар-карманганым – единственная моя надежда гобем кокке жегкени – радоваться<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"81\">81<\/span>Бурул. Куйеесуз калган кызды колго алуу теркундун милдети экен. Антпссск."},{"t":"p","h":"элдин бетин карай албай калдык. Кызыбыз-"},{"t":"v","l":["ды бергиле.","Акылбек. Бу кандай таш боор жан","элен?! Э. Зуураш кагылайын, бери чыкчы...","(Зуура ички үйдүн эшигинен көрүнөт). Бу","жеңеңе бирдеме деп, жөнөтчү ары!"]},{"t":"p","h":"Зуура, (Акылбектин бутуна жыгылат). Ата!.. Мен шордууну кечир, ата! ноюрдуу-горемычная Ыраазылыгыңды бер' Байкемди эл алдын- ыравзылыгынды бер – да сындыра албадым. Кечир, ата!.. благослови"},{"t":"p","h":"Акылбек. Ушинтмек экенсиң да? Кантейин!.."},{"t":"h3","h":"Төртүнчү көшөгө"},{"t":"p","h":"Акылбектин террасалуу жаңы үйүнүн бир бөлмөсү. Дубалдын боорунда комуз, комуздун үстүндө аскер кийим кийген келбеттүү жаш жигиттин портрети илинип турат. Ирегеде жөлөнүү велосипед. Күн чайыттай ачык, мээрим нурун себелейт. Үйдө да, террасада да эч ким жок. Ээн. Акылбек шылкыя басып кирет. Велосипедге урунуп алды да, аны бир топко тиктеп турду. Бир маалда көз карашы портретке кадалды. Аны көздөй акырын жакындады, андан кез_айырбады (не отрывил глаз)."},{"t":"p","h":"Акылбек. Болотбек... Кулунум... Мени эле карайсың, тук көз айырбай карайсың... Эмне... Мени сагындыңбы?.. Мен да сени сагындым, аябай сагындым... Куса болдум (скучаю), кулунум... Болотбек, качан келип комузуңду колуңа аласың? Ушинтип эле илинип тура береби? Келсеңчи, келип ырдап берсеңчи... Ырыңды сагындым, күүңдү сагындым. Кыялжоругунду (поведение) сагындым. Чыгарчы үнүңдү угайын... Пауза. Унчукпайт, үн катпайт..."},{"t":"p","h":"Өтө эле алыстан чыккансып, кандайдыр комуз күүсү араңдан зорго угула баштайт. Акырындык менен бери жылып келаткансыйт, улам катуулай берет. Анан ага уландын обону кошулат. Күү да, обон да көнүлдүү жана салмактуу. Акыры ыр Акылбектин кулагынын дал жанына жетип токтогонсуп, даана жана ачык угулат."},{"t":"v","l":["Болотбектин үнү.","Кабак чытып мүңгүрөй,","Капалыкка берилбе.","Кайраттуу бол ар дайым,","Сар-санаага жеңилбе.","Азамат болсоң, эр болсоң,","Кыйналдым кыйын дебей жүр.","","6-81","кабак чызын мунгурей – хмуря брови","быть в тяжёлом положении","","г","сар-санаага женнлбе – не поддавайся","заботам и печалям","<span class=\"pg\" data-n=\"82\">82<\/span>Жетим менен жесирге,","Каралашкын, салбай сүр.","Эл мойнуна жүк түшсө,","Жүгүн алып жеңилдет.","Найза сунуп жоо келсе,","Көз ирмебей, жеңип өт."]},{"t":"p","h":"Бул ырды ушундай болуп жүргүн деп мен кичине бала кезде өзүң үйрөтпөдүң беле. Кадимки кайратың кана, ата?! Же андан тангансыңбы?"},{"t":"v","l":["Акылбек.","Эл мойнуна жүк түшсө,","Жүгүн алып жеңилдет.","Найза сунуп жоо келсе,","Көз ирмебей жеңип ет."]},{"t":"p","h":"Болотбектин үнү. (Кайраттуу). Урушка кеткен жеке эле мен белем, ата? Мага окшогондордун далайы кетпеди беле. Кана, ошолордун канчасы кайра кайрылып келди? Сен өңдөнүп (как ты) уулунун жүзүн корбөй калган аталар аз эмес го..."},{"t":"p","h":"Акылбек. Бирок... бирок ичим ачышып жатпайбы. Уруштун азап-тозогун тартып, колу-бутуңду өкко жулдуруп ийсең деле эку жулдуруп ийсең деле – мейли эле. Жеңишбегиңди жетим калтырбай, өзүң тирүү маңдайыма келип берсең, мандайыма кел-придикомне арман жок эмес беле. Андан бөлөктүн мага кереги жок эле го, кулунум."},{"t":"p","h":"Болотбектин үнү. Жеке Жеңишбек эмес, далай эле балдар атасыз жетим калышпадыбы? Ата. Жеңишбек кетип калды деп көп эле ‚муңкана бербей. ошо балаңды өз мункана бербе – не горюй бооруңа тарт. Ошент, ата."},{"t":"p","h":"Акылбек. Кантип?.. Кантип?.. (Портрет акырындык менен жанданып, Болотбектин тирүү элеси көрүнөт)."},{"t":"p","h":"Болотбектин үнү. Санаа тартпи. саиаатартпа-не мучайся ата. Мен сенин кайратыңа ишенем. Сөзсүз мен айткандай кыласың... Аны билем, ата, билем... (Болотбектин элеси кайрадан портрет болуп калат)."},{"t":"p","h":"Акылбек. Болотбек, Болотбек!.. Баары бир сен келесиң! Ыраспы, келесиң! Келүүгө <span class=\"pg\" data-n=\"83\">83<\/span>тийишсин! Сенин өлгөнүңө ишенген эмесмин, азыр да ишснбейм. Тук ишенбейм! Күтөм сени! Сен келгенче өлбөй тирүү жүрө берем, чыдайм ошого, чыдайм!.,"},{"t":"raw","h":"<div class=\"gloss\"><p>сүр салба – не важничай<\/p><p>көз ирмебей – не моргвнув глаюм кайратыңдан тангансыңбы – отказался от своей решимости если даже пулей оторвало Ш<\/p><p>өз бооруңа тарт – притяни к<\/p><\/div>"},{"t":"v","l":["Тааныш сөздөр:","сар-санаага женилбе – не поддавайся заботам и печалям;"]},{"t":"p","h":"санав тартпа – не думай, не санаа – мысль, дума, намерение (6-класс 139-бетте; Кусейин Эсснкожоевлии «Үчүнчү шар» – ангемесинен: Аңгыча калың караңгылыктын арасынан кулагыма бир дабыш угулду. Бул дабыш санааны эчен түргө бөлдү.)"},{"t":"p","h":"Тапшырмалар."},{"t":"p","h":"1. Б. Жакиев «Атанын тагдыры» драмасында кайсы мезгил жөпүндө баяндайт?"},{"t":"p","h":"2. Драманын негизги каармандары кимдер?"},{"t":"v","l":["3. Акылбек согуштан келбей калган уулун кантип күтүп жүрөт экен?","$. Келини Зуура эмне үчүн кайнатасынын үйүнөн кетип калды?"]},{"t":"p","h":"5. Зуура карыган кайын ата, кайып энесини таштап кеткени туурабы? Кандай леп"},{"t":"p","h":"ойлойсуңар?"},{"t":"p","h":"6, Эмне учун автор Болотбекти атасы менен сүйлөштүрдү? Ал атасына эмне деп"},{"t":"p","h":"кайрылды?"},{"t":"v","l":["=з Акылбек карыяга жана Зуурага мунозлеме бергиле.","","%","Акылбек: Ап, балам, ай-ээ... Жүр тиги"]},{"t":"p","h":"сарайдагы отунду араалашынп кой. араала, таары – пилить"},{"t":"p","h":"Жеңишбек: Ошонун баарынбы?!"},{"t":"v","l":["Акылбек: Эми эле бүтөбүз.","Жеңишбек: Ооба сага! Кечке дейре (до","вечера) бүтпөйбүз го аны.","Акылбек: Бүтөбүз. Арааны албарстай","КЫЛЫП Курчутуп койгом (доточил)."]},{"t":"p","h":"Жеңишбек: Ата!.. Эртең таарыйлы-"},{"t":"v","l":["чы, ата. И-ии... жанагылар тээп ийншкен","окшойт (наверное пнули), мобу жерим ооруп","турат... Ошентсең, атаке. Эртең таарыйлы","деп койсоң. Атаке, ошентсең... Ошентип","койсоң эми...","Акылбек: О, атакөйү десе. Болуптур эми.","Ойногуң келип турса керек? Барагой. Бар...","Жеңишбек: Ура-а!.. (Жеңишбек көчөнү","көздөй чуркайт. Бирок Шаршекени көрө коюп","тамды имериле качат. Шаршеке кирет.)","Шаршеке: Салоом алсйкум, аксакал."]},{"t":"p","h":"Акылбек: Алекима салам. И, жол болсун, молдоке?"},{"t":"p","h":"<span class=\"pg\" data-n=\"84\">84<\/span>Шаршеке: (Тамашалап) Сизди айыпка жыгайын деп келдим, аксакал."},{"t":"p","h":"Акылбек: Айыпка? Мойнума коё алсаң жыгылайын, эгер коё албасаңчы?.."},{"t":"p","h":"Шаршеке: Азыр, каникул учурунда, окуучулардын бардыгы колхозго жардамдашып, Корумдуда чөп чөмөлөп жатышат (окучивают в стог сено)..."},{"t":"p","h":"Акылбек: Женишбек эмне барбайт депен турасын го?"},{"t":"p","h":"Шаршеке: Ооба."},{"t":"p","h":"Акылбек: Аны езум эле жибергеним жок. Шаршеке: (Билмексен болуп) Коюңузчу, аксакал?"},{"t":"p","h":"Акылбек: Ырас. Жаш неме кабыргасын кайыштырып (зачем его мучать), күнчүлүк алыстан иштесе... Жайдын узун саратан ысыгында ач болот, ток болот... ичегисине кан уюп калса... Кыйналабы дедим балам."},{"t":"p","h":"Шаршеке: А-а, Женишбегимдин оюнан чыга албадым денизчи. Неберениз сиздин болушарынызды билип алып, кылбаганды кылып журет. Элдин алма-еругун узуп, бак-шагын сындырат экен. Муну өзүнүз деле билерсиз. Же мейли дейсизби?"},{"t":"p","h":"Акылбек: Жо-жок. Бул алмалар өзүбүздүн эле алмадан түшүп калганын терип койдум эле."},{"t":"p","h":"Шаршеке: Жеңишбекти ушунтип ыксыз жерден коргой берип (защищаете его), аны сабагынан да начарлатып ийдиңиз. Мына, быйыл классынан көчөр-көчпөсү да арсар, бир сабагынан күзгү сыноого (осенние экзамены (пересдача) калды..."},{"t":"p","h":"Акылбек: Эмнс дейт?!"},{"t":"p","h":"Шаршеке: Жеке сабагы эмес, кара мүртөз, өзүмчүл да болуп баратат. Минте берсеңиз... Билбейм, эмне дешти?! (Оор пауза)."},{"t":"p","h":"Акылбек: Чыны, балам... айткандарыңдын жөндүү кеп экенин... чыны, билип деле турам... Элдин балдарындай боло албаганына экупем. Бирок... Женишбегимдин ою менен болбоско чарам жок... Менин таянган тоом. ырыс-кешнгим ошо бала. Же анда эне-ата болбосо, <span class=\"pg\" data-n=\"85\">85<\/span>өзүң билесиң чоң энесин да ээсине тапшырганбыз (похорон пи)..."},{"t":"raw","h":"<div class=\"gloss\"><p>кара мүргөз – жестокий<\/p><p>өкүн – раскливиться, сожалеть о случившемся<\/p><p>таянган тоом – моя опора. поддержка<\/p><\/div>"},{"t":"p","h":"Кыйналбай-кысталбай өссө, дээринде болсо (если у него есть сознание), кийин оңолуп алар дейт экенсиң."},{"t":"p","h":"Ал бир ишти иштеп атса, бери жакта туруп, менин кабыргам кайышат: «ай, ушу оорчулук кылып атып жүрбөсүн» деп аяйм. Жеңишбегим үйдө жок болсо, «алда кандай кырсыкка учурап. тентек эме машине-шашиненин алдына кирип кетпегей эле... бирөө чоңсунуп ыйлатып койдубу» деп, санаам чыдабайт. Анын үстүнө, аны кыл, муну кыл, айт-уйт дээрден чочулап турам..."},{"t":"p","h":"Шаршеке: Эмне үчүн? Бөлөк бирөөнүн баласы болбогон соң катуураак эле кармап, кезеги келсе какыс-кукус кылып койсоңуз да ашыктык кылмак эмес (не помешало бы)."},{"t":"p","h":"Акылбек: Бу баланын Кунгейле күйөөдө энеси бар... (Токтоп калат)."},{"t":"p","h":"Шаршеке: Айта бериниз..."},{"t":"p","h":"Акылбек: Кокус. жинине тийип алсам (если я его разозлю), кетип калса... Анын үстүнө, энеси менен кат алышып, беришип жүрөбү, өзү аны мага айтпайт... Эне балакетиң эстен чыкпайт окшойбойбу. Сагынып жүргөнсүйт (скучает наверное). «Барып келсемби?» деп баягыда эки сапар кынырылганынан (намекнул)... Эмне дейм?"},{"t":"p","h":"Унчукпай тим болгом (промолчал). Шаршеке: Анда сагынчысы таркаганча өзүңүз эле алпарып келбейсизби."},{"t":"p","h":"Акылбек: Ага лаабайм (не осмеливаюсь), Энеси алып калабы деп корком (боюсь, что мать оставит его)."},{"t":"p","h":"(Акылбек терең ойдо калат. Шаршеке кетет.) Тааныш саздоер:"},{"t":"p","h":"айыпка жыгайын – провинить, обвинить; подвергнуть штрафу (5-класс 13-бетте; «Акылдуу кыз» жомогуиан: «Каным, сөзүңүзгө кулдук, табышмагынызлы таба албай калган үчүн кыздарда айып жок», айып – вина, провинность,)"},{"t":"p","h":"6-класс 62-бетте; Барпы Алыкулевлун «Өзү каар. тили заар кыз» ырынан: Нан ордуна аш кылап,"},{"t":"v","l":["Ичкениңди таш кылат.","Айыбын айтсаң, алкынып,","Сенден мурда кол сунат."]},{"t":"raw","h":"<div class=\"gloss\"><p>кырсыкка учурап – попал в беду<\/p><p>чочулап турам – побвиваюсь<\/p><p>катуураак карман – держите в ежовых рукавицах кат алышып, беришүү – переписываться<\/p><p>сагыичысы тяркаганча – пока не развеется, не раз гонит тоску<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"86\">86<\/span>7-класс 53-бетте, Аалы Токембаевлин «Күүнүн сыры» аңгемесинен: Кун доолаганды кайта айыпка жыгын. үч тогуз, бир кыз гартуу алышкан, – деп жалган айтып жибердим. айыпка жыгуу – оштрафовать.) санаам чыдабайт – переживаю: санаа – забота: мысль, дума, намерение (6-класс 139-бетте; Кусейнн Эсенкожоевдин «Үчүнчү шар» ангемесииен: Аңгыча калып караңгылыктын арасынан кулагыма бир дабыш угулду. Бул дабыш санааны эчен түргө бөлдү. 7-класс 84-бетте, Б. Жакиевдин «Атанын тагдыры» лрамасынын тергуичу көшөгөсү:"},{"t":"p","h":"Кабак чытып мүнгүрөй,"},{"t":"v","l":["Капалыкка берилбе.","Кайраттуу бол ар дайым,","Сар-санаага жеңилбе","Ошол эле жерде 85-бетте; Санаа тартпа, пта.)","күнгөй – юг, южная сторона (6-класс 44-бетте; «Бекбекей» ырынан:","Арпа менен буудайдай,","Баш алышкан бекбекей.","Күнгөй менен тескейдей,","Бет алышкан бекбскей."]},{"t":"p","h":"7-класс 50-бетте; Азавлы Токомбаев жөнүндө тексттен: 1919-жылы Ысык-Көлдүн күнгөйүндө аталаш туугандарыныкы

проблем, проблем, которые казались неразрешимыми. И адресовал свои труды правительствам, народам, всем, кому должно быть небезразлично будущее. Из газеты “Комсомольская правда\""},{"t":"h3","h":"Словарь"},{"t":"p","h":"небезразлично – баары бир эмес Ответьте на вопросы, используя сложноподчинённые предложения."},{"t":"v","l":["у О каком человеке говорится в тексте?","у Над какими вопросами думал Сахаров?"]},{"t":"p","h":"у Для решения каких проблем находил пути Андрей Дми-"},{"t":"p","h":"триевич?"},{"t":"p","h":"у Кому он адресовал свои труды?"},{"t":"p","h":"Задание 4. Вставьте вместо точек указательные слова. э Объясните роль придаточных предложений."},{"t":"p","h":"1. Сахаровым не приходило никаких вестей даже ... ‚ откуда ранее присылали сообщения со специальным курьером."},{"t":"p","h":"2. Этот человек удивительной отваги появлялся ... ‚ где грозила опасность. 3. Когда позвонили и сообщили ... ‚ что <span class=\"pg\" data-n=\"116\">116<\/span>у кого-то идет очередной незаконный обыск, А. Д. Сахаров, не найдя машины, приехал на попутном автокране."},{"t":"p","h":"4. Герой – это... человек, который в решительный момент делает ... что нужно в интересах человеческого общества. Словарь курьер – курьер (атайын тапшырмалар боюнча бир жерден"},{"t":"p","h":"экинчи жерге барып журуучу кызматчы адам)"},{"t":"p","h":"Задание 5. Прочитайте фрагменты автобиографии А. Д. Сахарова. Определите стиль речи."},{"t":"p","h":"Я родился 21 мая 1921 года в Москве. Мой отец – преподаватель физики, известный автор учебников, задачника и научно-популярных книг."},{"t":"p","h":"Я с отличием окончил школу в 1938 году и тогда же поступил на физический факультет МГУ, который окончил тоже с отличием уже во время войны, в 1942 году, в эвакуации, в Ашхабаде."},{"t":"p","h":"В 1942—1945 годах работал инженером-изобретателем на военном заводе, автор нескольких изобретений в области контроля продукции."},{"t":"p","h":"В 1945—1947 годах я выполнял научную работу под руководством известного ученого физика-теоретика И. Е. Тамма. В 1948 году включен в группу по созданию термоядерного оружия. Последующие 20 лет – непрерывная работа в условиях сверхсекретности и сверхнапряжения..."},{"t":"p","h":"С конца 50-х годов стал активно выступать за прекращение или ограничение испытаний ядерного оружия. Я был одним из инициаторов заключения Московского договора 1963 года о запрещении испытаний в трех средах (т. е. в воде, атмосфере и в космосе)."},{"t":"p","h":"В 1967 году я участвовал в Комитете по защите Байкала. С 1970 года на первый план для меня выходит защита прав человека, защита людей, которые стали жертвами политической расправы. В эти годы я часто выступал по проблемам мира и разоружения, ядерной энергетики и против смертной казни..."},{"t":"p","h":"<span class=\"pg\" data-n=\"117\">117<\/span>Словарь термоядерный – относящийся кядерным реакциям при сверхвысоких температурах сверхсекретный – очень секретный сверхнапряжение – приложение очень больших усилий, вни-"},{"t":"v","l":["мания при осуществлении чего-нибудь","испытание – проверка чего-либо на опыте","разоружение – уничтожение или сокращение вооружения","","Задание 6. Что вы узнали об А. Д. Сахарове? Расскажите"]},{"t":"raw","h":"<h4 class=\"mk\">, 3 ® д<\/h4>"},{"t":"p","h":"о нём друзьям. Какой тип речи соответствует этой задаче?"},{"t":"v","l":["Какие виды предложений помогут вам в этом?","","Чтобы построить рассказ-биографию, нужно указать: когда родился герой повествования;","когда и где начал учиться, какое получил образование;","где работал, какие должности занимал;","каковы главные события в его жизни;"]},{"t":"p","h":"&gt; что следует считать главным делом жизни героя повест-"},{"t":"v","l":["вования.","Задание7. Прочитайте ещё раз фрагменты автобиографии","КМ А. Д. Сахарова. Найдите в ней примеры к таблице 16 и","впишите их. Ответьте на вопросы.","Таблица 16","Особенности официально-делового стиля"]},{"t":"h3","h":"Примеры"},{"t":"p","h":"Точность, краткость, конкретность,"},{"t":"raw","h":"<h4 class=\"mk\">Смысловые лексические Языковые синтаксические<\/h4>"},{"t":"p","h":"доступность"},{"t":"p","h":"Устойчивые словосочетания, профессиональная терминология"},{"t":"p","h":"Отглагольные – существительные, имена существительные в Р. п., глаголы повелительного наклонения"},{"t":"p","h":"Пассивные конструкции, конструкции с обособлением, сложноподчинённые предложения <span class=\"pg\" data-n=\"118\">118<\/span>у В каких сферах встречается официально-деловой стиль?"},{"t":"p","h":"у Какие особенности официально-делового стиля вы можете назвать?"},{"t":"p","h":"у Какие жанры официально-делового стиля вы знаете?"},{"t":"h3","h":"Твой соБЕСЕДНИК"},{"t":"v","l":["С Задание 8. Выразите своё мнение по поводу того, что вы узнали об А. Д. Сахарове, используя тексты заданий 3 и 5.","Попросите собеседника высказать своё отношение к этому","учёному и его деятельности."]}],"sub":[{"title":"Примеры","b":65}],"section":"КАКИМ БЫТ!","pages":[113,118]},{"title":"Урок 2. ЧЕЛОВЕК ДЕЙСТВИЯ","blocks":[{"t":"h3","h":"Урок 2. ЧЕЛОВЕК ДЕЙСТВИЯ"},{"t":"v","l":["(продолжение)","","Задание 1. Прочитайте текст. О ком мы продолжим говорить","КТ на этом уроке? Выпишите из текста сложноподчинённое","предложение, определите его вид.","Отойти от края пропасти всемирной катастрофы, чтобы"]},{"t":"p","h":"сохранить цивилизацию и саму жизнь на планете, – настоя-"},{"t":"v","l":["тельная необходимость современного этапа мировой истории.","Это, как я убеждён, возможно лишь в результате глубоких","социально-экономических и идеологических изменений и","открытости общества...","А. Д. Сахаров","Словарь","","настоятельный – очень нужный","","у За что боролся А. Д. Сахаров?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"119\">119<\/span>Задание 2. Прочитайте текст. Озаглавьте его. Аргументируйте свой выбор заголовка. Замените, где это возможно, придаточные определительные причастиями или причастными оборотами. Запишите полученный текст в тетрадь."},{"t":"p","h":"22 января 1980 года А. Д. Сахаров был задержан, затем без суда и следствия отправлен вместе с женой в город Горький (ныне Нижний Новгород), который был закрыт для иностранцев. Без специального разрешения к Сахаровым никого не допускали. Телефона в квартире не было. Всюду Сахаровых сопровождала милицейская охрана, которая следила, чтобы они ни с кем не встречались."},{"t":"p","h":"Горьковский поэт Федор Сухов рассказывает, как одна приезжая знакомая студентка попросила показать дом, где живут Сахаровы. Они пришли во двор, в котором находился дом Сахаровых, и присели на скамеечке. Вскоре появились незнакомые мужчины, спросили, чего это они здесь сидят, потом потребовали показать документы, затем попросили удалиться. Когда девушка вернулась в свой город, её исключили из института."},{"t":"v","l":["у Что вы узнали о жизни Сахарова?","а) Когда он был арестован?","6) В какой город был отправлен А. Д. Сахаров?"]},{"t":"p","h":"в) Как вы думаете, почему исключили девушку из"},{"t":"p","h":"института?"},{"t":"p","h":"г) Какой вывод можно сделать о положении Сахарова в"},{"t":"p","h":"обществе в то время?"},{"t":"p","h":"у Перескажите текст, используя следующие слова и сло-"},{"t":"p","h":"восочетания: суд; следствие; город, закрытый для иностранцев; специальное разрешение; милицейская охрана; приезжая студентка; незнакомые мужчины; исключить из института."},{"t":"p","h":"и В каком стиле речи вы будете строить пересказ?"},{"t":"p","h":"<span class=\"pg\" data-n=\"120\">120<\/span>Задание 3. Выпишите сложноподчинённые предложения с придаточными изъяснительными. Расставьте знаки препинания. Поставьте вопрос от лица корреспондента к данному ответу А. Д. Сахарова."},{"t":"p","h":"15 декабря нам неожиданно установили телефон. Ночью. Мы даже немножко испугались. А 16-гов 3 часа позвонил М. С. Горбачев и сказал что принято решение о моём освобождении что я могу вернуться в Москву... Я ему сказал что благодарен за это решение."},{"t":"p","h":"с. о Задание 4. Перепишите текст, расставьте знаки препинания. На первом съезде народных депутатов я наблюдал как А. Д. Сахаров терпеливо и упорно ждал свою очередь к микрофону. Его не пугали враждебные выкрики в его адрес. Сахарову не давали говорить. Так были настроены многие в зале. Они забыли а большей частью не знали что Сахаров был первым в нашей стране кто осмелился подать свой голос против войны в Афганистане."},{"t":"p","h":"По воспоминаниям Д.А. Гранина Задание 5. Внимательно еще раз прочитайте тексты урока. Встречается ли в них общественно-политическая лексика, точные даты, документальные сведения? К какому стилю речи мы отнесем эти тексты?"},{"t":"p","h":"В радио-, телепередачах, в газетах, журналах используется публицистический стиль. Материалы публицистического стиля отличаются докумен-"},{"t":"v","l":["тальностью, стремлением оперативно сообщить о том","или ином факте, событии, явлении нашей жизни. К","жанрам этого стиля относятся репортаж, интервью,","статья, заметка.","","Задание 6. Выскажите своё мнение по поводу прочитанного","на уроке. Чтобы убедительно изложить свою точку зрения,","используйте следующие обороты:","Я прочитал(а) (о чём?), (о ком?","Хотелось бы высказать своё мнение (о чём?), (о ком?) ..."]},{"t":"p","h":"<span class=\"pg\" data-n=\"121\">121<\/span>Хотелось бы обратить внимание (на что?"},{"t":"p","h":"Представляет интерес мысль (кого?) ... о том, что ..."},{"t":"p","h":"Я считаю, что с ним (с ней) вполне можно согласиться в том, что..."},{"t":"p","h":"у Какие сложноподчинённые предложения помогли вам подготовить своё высказывание?"},{"t":"p","h":"Задание 7. Напишите сочинение-очерк “Жизнь, прожитая печально, но твёрдо”. В каком стиле речи мы встречаем жанр очерка? В чем его отличительные особенности?"},{"t":"p","h":"Чтобы построить текст в публицистическом стиле, строго следуйте фактам, надежным источникам, приводите точные даты, имена, конкретные данные."},{"t":"p","h":"Используйте при этом общественно-политическую лексику, оценочные слова, обращения, вводные конструкции, сложноподчинённые предложения."}],"sub":[],"section":"КАКИМ БЫТ!","pages":[119,121]},{"title":"Урок 3. ВИДЕТЬ, ЧУВСТВОВАТЬ, ЖИТЬ","blocks":[{"t":"h3","h":"Урок 3. ВИДЕТЬ, ЧУВСТВОВАТЬ, ЖИТЬ"},{"t":"v","l":["если не любил —","Значит, и не жил, и не дышал!","В. С. Высоцкий","","в Задание 1. Прочитайте предложения. Составьте их схемы","и назовите средства связи. Определите вид придаточных","предложений.","","1. Где трудно дышится, где горе слышится, там первый","будь. (Н.А. Некрасов) 2. Но страшен миг, когда стремленья","нет. (И.А. Бунин) 3. Для того, чтобы творить великие дела,","нужно жить так, как будто и умирать не придется. (Вовенарг","4. Я жить хочу, чтоб мыслить и страдать. (А. С. Пушкин)","5. Не будьте равнодушны, ибо равнодушие смертельно для","души человека. (А. М. Горький) 6. Не ищи правды, когда","её в тебе нет. (Пословица) Т. Чудес, хоть я живу давно, не","видел я покуда. (С. Я. Маршак)"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"122\">122<\/span>Словарь"},{"t":"p","h":"миг – момент, секунда"},{"t":"p","h":"у Какие значения передают обстоятельственные сложнопод-"},{"t":"p","h":"чинённые предложения?"},{"t":"p","h":"у На какие вопросы отвечают обстоятельственные предложения"},{"t":"p","h":"места, времени, образа и степени действия, цели, причины, условные, уступительные?"},{"t":"p","h":"у С помощью каких союзов и союзных слов присоединяются"},{"t":"p","h":"придаточные обстоятельственные предложения к главному? у Зависит ли выбор средства связи предложений от стиля"},{"t":"p","h":"текста?"},{"t":"p","h":"у Найдите в таблице 17 союзы и союзные слова, которые употребляются только:"},{"t":"v","l":["а) в разговорном,","6) научном,","в) художественном стиле."]},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"h3","h":"Опорные слова"},{"t":"v","l":["духовная","творческая","счастливая","стремительная","","вспыхнувшая","любовь","обогатившая","страстная","","большой","порок","тяжёлый неизлечимый","неисправимый","меткие","верные","безошибочные","запоминающиеся","","красивая","связь","долгая","","жить","быстро", ва – ..."},{"t":"v","l":["2. Подберите к данным словам антонимы.","Счастливая – ...","крепкая – ...","красивая (любовь) – ...","верная – ...","страстная – ..."]},{"t":"p","h":"3. Сделайте словообразовательный анализ слов безошибочный,"},{"t":"p","h":"обогативший."},{"t":"p","h":"4. Подберите прилагательные к словам порок, душа."},{"t":"p","h":"5. От каких прилагательных образованы следующие существи-"},{"t":"p","h":"тельные?"},{"t":"v","l":["Стремительность – ... верность – ...","страстность – ..."]}],"sub":[],"section":"КАКИМ БЫТ!","pages":[122,124]},{"title":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ","blocks":[{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 2. Прочитайте текст."},{"t":"p","h":"Творчество Владимира Высоцкого стало важной частью духовной жизни многих людей разных профессий, разного возраста, различного жизненного опыта."},{"t":"p","h":"<span class=\"pg\" data-n=\"125\">125<\/span>Хотя каждый в его песнях узнавал себя, но видел в них себя другим. Слова песен были так метки и единственно верны, что безошибочно передавали суть и били прямо в цель. Душа просыпалась и обретала такую зоркость, которая позволяла различать недоступные прежде черты, цвета, оттенки. Обо всём он говорил по-своему и так, что это запоминалось на всю жизнь."},{"t":"p","h":"у Какие сложноподчинённые предложения встречаются в этом тексте? Выпишите их. Составьте схемы предложений."},{"t":"p","h":"У Определите значение каждого придаточного предложения."},{"t":"p","h":"Задание 3. Озаглавьте текст и перепишите его. Определите стиль речи. В сложноподчинённых предложениях замените, где это целесообразно, союзное слово который другими подходящими по смыслу союзными словами, расставьте знаки препинания."},{"t":"p","h":"И в этой жизни с такой нагрузкой которую не мог бы выдержать нормальный человек с ним была Марина. Они встретились в 1967 году. Эта встреча должна была произойти и она произошла. Любовь которая началась внезапно и крепла день ото дня обогатила обоих. Когда Марины нет в Москве телефонный роман с Парижем. Спустя несколько лет они поженились. Это была красивая которая длилась много лет духовная связь двух бесконечно талантливых"},{"t":"v","l":["людей.","","у Как вы думаете, почему автор изменил место придаточного","определительного в выделенном предложении?"]},{"t":"p","h":"$ А Чтобы подчеркнуть выразительность текста пуб-"},{"t":"v","l":["лицистического характера, в сложноподчинённых","предложениях используются указательные слова, а","также инверсия (перестановка традиционного места","подчинительного предложения)."]},{"t":"p","h":"Задание 4. Прочитайте следующее высказывание Высоцкого. Ответьте на вопросы."},{"t":"p","h":"<span class=\"pg\" data-n=\"126\">126<\/span>Недостатков, которых в людях не прощаю, много. Не хочу перечислять."},{"t":"p","h":"В мужчине ценю сочетание доброты, силы и ума. Когда я надписываю фотографии пацанам, подросткам и даже детям, хотя это к делу не относится, обязательно пишу: “Вырасти сильным, умным и добрым”. А женщине написал бы: “Будь умной, красивой и доброй”."},{"t":"p","h":"у Какие черты характера человека ценил В. Высоцкий?"},{"t":"p","h":"у Был ли он сам таким? Какие факты его биографии говорят об этом?"},{"t":"h3","h":"Твой СОБЕСЕДНИК"},{"t":"p","h":"Задание 5. Как бы вы восстановили пропущенные реплики диалога?"},{"t":"p","h":"– Как ты думаешь, почему любят песни Высоцкого?"},{"t":"p","h":"– А он только сочинял песни?"},{"t":"p","h":"– Ая не знал, что он был ещё и актером. В каких фильмах он снимался?"},{"t":"p","h":"– Да, да, я вспоминаю этот фильм. Ну конечно же, в нём играет Высоцкий. Ещё он там исполняет свои песни."},{"t":"p","h":"<span class=\"pg\" data-n=\"127\">127<\/span>Урок 4. НЕ ИСПЫТАВ ТРУДНОСТЕЙ,"}],"sub":[],"section":"КАКИМ БЫТ!","pages":[125,127]},{"title":"ЦЕЛИ НЕ ДОСТИГНЕШЬ","blocks":[{"t":"h3","h":"ЦЕЛИ НЕ ДОСТИГНЕШЬ"},{"t":"p","h":"Жизнь, прожитую достойно, следует измерять деяниями, а не годами. Р. Б. Шеридан"},{"t":"p","h":"Задание 1. Прочитайте текст. О ком пойдет речь на уроке? Скажите, какие виды обстоятельственных придаточных предложений встречаются в этом тексте."},{"t":"p","h":"Суйменкул Чокморов – художник уникальный, потому что в его творческой судьбе нашли счастливое сплетение дар Чокморова-живописца и Чокморова-актёра. Хотя истории известно немало имен людей, щедро одарённых в разных областях искусства, редкая необычайность Суйменкула Чокморова, на мой взгляд, заключается в неразрывной связи этого художника с его родной землей."},{"t":"p","h":"Художник, мне кажется, начинается с неповторимого, глубокого понимания окружающего мира, языка, песен, образов и характеров своего народа, так как все это становится золотым запасом его памяти до конца дней."},{"t":"p","h":"По Ч. Т. Айтматову"},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"h3","h":"Опорные слова"},{"t":"raw","h":"<h4 class=\"mk\">умножать накапливать собирать уникальный талантливый известный неожиданная тяжёлая безнадежная<\/h4>"},{"t":"v","l":["в воспоминаниях","наблюдения","оживать | в памяти","в работах","","горный","лесной","художник","воздух","степной"]},{"t":"h3","h":"тренироваться"},{"t":"v","l":["болезнь","бегать","с мячом","прыгать"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"128\">128<\/span>Новые слова"},{"t":"p","h":"безнадёжный – без надежды на изменения к лучшему оживать (в работах) – становиться похожими на реальность в"},{"t":"p","h":"картинах художника"},{"t":"v","l":["уникальный – необычный, единственный","","1. Подберите синонимы к слову уникальный (художник)."]},{"t":"p","h":"2. Образуйте от данных существительных прилагательные. По"},{"t":"p","h":"какой модели вы это сделаете?"},{"t":"v","l":["Лес – ...","горы – ...","степь – ..."]},{"t":"p","h":"3. Образуйте наречия от данных прилагательных, составьте с ними"},{"t":"p","h":"словосочетания."},{"t":"p","h":"Неожиданная, тяжёлый, безнадёжный, талантливый, известный."},{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 2. Прочитайте текст. С помощью каких средств К? присоединяются обстоятельственные предложения к"},{"t":"p","h":"главным? Запишите текст, расставляя знаки препинания. Село Чонташ родина Суйменкула Чокморова. Сейчас здесь большое село неподалеку хорошо известная горная лыжная база. В Чонташе особенный воздух предгорья. Суйменкулу было радостно и грустно вдыхать его (почему?) он настоян на памяти..."},{"t":"p","h":"Здесь ступала нога отца Чокмора колхозного кузнеца умельца мастера на все руки отличного всадника. Здесь провела свою жизнь мать которая родила одиннадцать детей и каждому отдала частицу своего сердца. Отсюда ушёл на войну старший брат Чолпонбай ушёл и не вернулся... Здесь был председатель колхоза строгий и добрый как отец здесь был первый учитель. Образы каждого из них оживут <span class=\"pg\" data-n=\"129\">129<\/span>потом в работах Суйменкула в актёрском исполнении или живописном воплощении."},{"t":"p","h":"(Когда?) в Чонташе собиралась большая семья Чокморовых для Суйменкула это был не просто семейный праздник это был праздник вечного торжества жизни."},{"t":"p","h":"Суйменкул знал каждого кто жил и работал в Чонташе. Он приезжал сюда (зачем?) помочь односельчанам как сын села как художник."},{"t":"p","h":"И в трудные минуты жизни он тоже приезжал в Чонташ (почему?) село давало ему силу веру в правду вдохновение..."},{"t":"p","h":"По В. И, Фуртичеву"},{"t":"p","h":"Задание 3. Постройте сложноподчинённые предложения."},{"t":"p","h":"1. Суйменкул должен был хо- | так как в доме было много"},{"t":"p","h":"дить пешком каждый день | книг и журналов километров десять..."},{"t":"p","h":"2. Было решено отправить | что он мог оказаться в пол-"},{"t":"p","h":"его к старшему брату На- | ной неподвижности рынбеку..."},{"t":"p","h":"3. У брата мальчик стал жадно | так как брата-офицера часто"},{"t":"p","h":"читать... переводили на новое место службы 4. Накопилось много впечатле- | чтобы продолжать учебу"},{"t":"p","h":"ний..."},{"t":"p","h":"5. Неожиданно пришла бо-| который жил недалеко от"},{"t":"p","h":"лезнь... Фрунзе 6. Суставы рук и ног Суймен- | которая приковала Суймен-"},{"t":"p","h":"кула были больные до такой | кула на долгие месяцы к степени... постели"},{"t":"h3","h":"Словарь"},{"t":"p","h":"приковать – жатып калуу (ооруп), жылгыс кылуу"},{"t":"p","h":"у Укажите сложноподчинённое предложение с придаточным"},{"t":"p","h":"степени. Перестройте его, исключив указательное слово. Изменилась ли при этом выразительность предложения?"},{"t":"p","h":"<span class=\"pg\" data-n=\"130\">130<\/span>В стилистическом отношении сложноподчинённые предложения с придаточными меры и степени отличаются большей яркостью, выразительностью. Они широко используются в разговорном, художественном и публицистическом стилях, где важна качественная характеристика действия."},{"t":"p","h":"3 Задание 4. Прочитайте материалы к тексту. Восстановите"},{"t":"p","h":"их последовательность. Как можно озаглавить полученный текст? Запишите его, вставляя необходимые средства связи придаточных предложений с главными."},{"t":"p","h":"В дни болезни Суйменкула в дом братьев Чокморовых пришла детский врач. Она поверила, ... сумеет вылечить мальчика. Для начала она предложила Суйменкулу каждый день проделывать сложный комплекс упражнений. Врач предупредила, ... ему будет больно, надо терпеть, ... только так он встанет на ноги."},{"t":"p","h":"Суйменкул уходил на окраину города, ... делать там зарядку, бегать, прыгать, тренироваться с мячом. В результате болезнь отступила настолько, ... Суйменкул сразу записался в две спортивные секции – прыжки в высоту и волейбол."},{"t":"p","h":"Действительно, ему было так больно, ... хотелось бросить эти упражнения, лечь и навсегда примириться с болезнью. Но усилием воли Суйменкул заставлял себя ещё и ещё раз повторять то или иное движение. Через несколько недель мальчик уже мог самостоятельно ходить под комнате, доктор сказала: “Теперь надо заняться спортом. Всерьёз...”"},{"t":"p","h":"“ Что нового вы узнали о детстве Суйменкула Чокморова? у Благодаря чему к нему снова вернулас ":"p","h":"<span class=\"pg\" data-n=\"132\">132<\/span>отказался от себя, от своего отношения к миру, к людям, к искусству? Старая кыргызская мудрость гласит: “Если у тебя есть скакун – ты богат, если два скакуна – вдвое богаче”. Два “скакуна” Чокморова – кино и живопись – мчали его к единой цели. И втом и в другом искусстве Чокморов шел от себя, от своего опыта жизни, памяти детства."},{"t":"p","h":"По А. Липкову"},{"t":"p","h":"Задание 6. Вы познакомились с некоторыми эпизодами из жизни известного кыргызского актера и художника С. Чокморова. Какие из них вызвали у вас интерес? С какими фактами биографии художника связаны сюжеты его картин “Чрезвычайный комиссар”, “Натюрморт с автопортретом”? Как художник показывает мир своей профессии, мир своих интересов? Обменяйтесь мнениями друг с другом."}],"sub":[],"section":"КАКИМ БЫТ!","pages":[128,132]},{"title":"Урок 5. ДЕЛАТЬ СЧАСТЛИВЫМИ ДРУГИХ","blocks":[{"t":"h3","h":"Урок 5. ДЕЛАТЬ СЧАСТЛИВЫМИ ДРУГИХ"},{"t":"p","h":"Делать счастливыми других – вот самый верный способ стать счастливым в этом мире. П.А. Гольбах"},{"t":"p","h":"*» Объясните смысл пословицы, приведенной в тексте. Выпи- Задание 1. Прочитайте текст. Определите стиль речи."},{"t":"p","h":"шите сложноподчинённые предложения. Расставьте в них знаки препинания и назовите значения придаточных предложений."},{"t":"p","h":"Кавказская мудрость гласит “Костер зажжённый на вершине горы не согреет тех кто у ее подножия”. И счастье наше что живут среди нас те кто разводит свой огонь так чтобы люди могли у него согреться..."},{"t":"p","h":"Имя Валентина Ивановича Дикуля знакомо каждому потому что о его полной драматизма судьбе и мужестве рассказывалось не раз. Напомним только о том что после тяжелейшей травмы позвоночника воздушный гимнаст был <span class=\"pg\" data-n=\"133\">133<\/span>полностью парализован. И ценой невероятных духовных и физических усилий смог снова встать на ноги. И не просто встать. Сегодня Валентин Дикуль – один из самых сильных людей Земли всемирно известный артист цирка. Его силовой номер “Пирамида” в котором он поднимает три тонны уникален."},{"t":"p","h":"Л. Кодзаева"},{"t":"h3","h":"Словарь"},{"t":"p","h":"парализованный – не способный двигаться у О ком пойдет речь на уроке?"},{"t":"p","h":"у Почему имя Валентина Дикуля известно во всём мире?"},{"t":"p","h":"Задание 2. Составьте схему предложения, выделенного в 14 тексте задания 1. Определите способы связи придаточных"},{"t":"p","h":"предложений с главным: соподчинение или последовательное подчинение,"},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"p","h":"Опорные слова"},{"t":"p","h":"чертежи высылать методик ы принимает письма"},{"t":"raw","h":"<h4 class=\"mk\">кавказская народная драматическая трагическая счастливая тяжёлая опасная<\/h4>"},{"t":"v","l":["мудрость","физические","","известный","артист","сильный","судьба","великий","","силов","травма","уникальный","номер"]},{"t":"h3","h":"великолепный"},{"t":"v","l":["людская","душевная боль","физическая"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"134\">134<\/span>Новые слова"},{"t":"p","h":"драматический – полный трудных событий невероятные усилия – очень большие усилия травма – повреждение организма внешним воздействием"},{"t":"p","h":"1. От данных прилагательных образуйте наречия. Тяжёлый – ..."},{"t":"v","l":["счастливый – ...","уникальный – ...","великолепный – ...","сильный – ..."]},{"t":"p","h":"2. Составьте словосочетания с полученными наречиями и подходя-"},{"t":"p","h":"щими по смыслу глаголами."},{"t":"v","l":["3. Подберите антонимы к следующим словам.","Трагический – ...","тяжёлый – ...","опасный – ...","известный – ...","сильный – ..."]},{"t":"p","h":"4. От каких прилагательных образованы существительные драма-"},{"t":"p","h":"тизм, трагизм?"}],"sub":[],"section":"КАКИМ БЫТ!","pages":[133,134]},{"title":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ","blocks":[{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 3. Прочитайте текст. Разделите его на смысловые части. Озаглавьте их. Выпишите сложноподчинённые предложения с несколькими придаточными; определите тип подчинительной связи."},{"t":"p","h":"Человек этот принимает на свои плечи, на свое сердце тяжесть несравнимо большую, чем на арене цирка. Это людская боль, страдания, отчаяние и надежда. Надежда, которую он дал больным, которую он поддерживает в них. Он создатель центра по реабилитации больных со спинномозговой травмой и последствиями детского церебрального паралича. Сотни и сотни писем получал и получает Валентин Иванович. И ни одно не остается без ответа. Он высылает подробную методику занятий и чертежи станка-тренажёра, которые разработаны им, так как без станка больному <span class=\"pg\" data-n=\"135\">135<\/span>человеку не выздороветь. Хотя тренажёры Дикуля просты и экономичны, но именно с их применением связаны самые большие трудности. Валентин Иванович настаивает, что цена их не должна быть сильно высокой. Главный принцип Дикуля: с инвалидов нельзя брать ни копейки за лечение. Л. Кодзаева"},{"t":"h3","h":"Словарь"},{"t":"p","h":"отчаяние – состояние души, когда нет надежды реабилитация – восстановление церебральный паралич – тяжелое заболевание нервной"},{"t":"p","h":"системы, ведущее к двигательным нарушениям и неподвижности у О какой черте характера Валентина Дикуля вы узнали из"},{"t":"p","h":"этого отрывка?"},{"t":"p","h":"у Согласны ли вы с главным принципом В. Дикуля: с инвалидов"},{"t":"p","h":"нельзя брать ни копейки?"},{"t":"p","h":"Задание 4. Спишите дополнительную информацию о Го В. Дикуле. Расставьте знаки препинания, подчеркните"},{"t":"p","h":"союзы и союзные слова. Определите вид придаточных предложений, объясните характер связи между ними и главными предложениями."},{"t":"p","h":"1. Когда В. И. Дикуль был парализован ему становилось грустно от того что теперь многое в его жизни изменится что он теперь не сможет выступать на арене цирка что теперь о нем забудут. 2. В центр В. И. Дикуля куда стремились попасть многие больные и где были кабинеты со станкамитренажёрами люди записывались за несколько месяцев вперед."},{"t":"p","h":"3. Когда Валентин Иванович начал беседу с восьмилетним мальчиком тот так смутился что долго не мог ничего сказать. Теперь когда закончилось лечение маленького Саши на душе В. Дикуля стало спокойно и он был поражен смелостью малыша который отчаянно борется со своей болезнью."},{"t":"p","h":"Задание 5. Как вы понимаете смысл высказывания: 6"},{"t":"p","h":"“Человек сам себя воспитать должен”? Можно ли так сказать о В.И. Дикуле? Докажите свое мнение, используя материалы урока. В каком типе речи вы будете строить своё высказывание?"},{"t":"h3","h":"<span class=\"pg\" data-n=\"136\">136<\/span>Твой СОБЕСЕДНИК"},{"t":"p","h":"2 диалог? Задание 6. Как бы вы восстановили приведённый ниже"},{"t":"p","h":"– Сначала он был известным артистом цирка, но потом он создал реабилитационный центр."},{"t":"p","h":"– Он был тяжёло болен, парализован, но победил свою болезнь. Он решил после этого помогать бороться с болезнью другим. Он придумал специальные тренажёры и учил людей пользоваться ими, чтобы победить неподвижность."},{"t":"p","h":"– Я не думаю, что это просто. Для этого нужен очень сильный характер и большое человеколюбие."}],"sub":[],"section":"КАКИМ БЫТ!","pages":[135,136]},{"title":"Урок 6. К ЦЕЛИ ЧЕРЕЗ УПОРСТВО И ТРУД","blocks":[{"t":"h3","h":"Урок 6. К ЦЕЛИ ЧЕРЕЗ УПОРСТВО И ТРУД"},{"t":"p","h":"Чтобы удивиться, достаточно одной минуты; чтобы сделать удивительную вещь, нужны долгие годы."},{"t":"p","h":"К. А. Гельвеций"},{"t":"p","h":"Задание 1. Прочитайте эпиграф к уроку! О чем мы продол- 4 жим разговор?"},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"h3","h":"Опорные слова лепкой"},{"t":"v","l":["заниматься 7% зьбой","акварелью","скульптурой","карандашом","","рисовать"]},{"t":"h3","h":"красками"},{"t":"raw","h":"<h4 class=\"mk\"><span class=\"pg\" data-n=\"137\">137<\/span>известная народная великая<\/h4>"},{"t":"v","l":["форм","разнообразие","мастерица","силуэтов","красок","убеждённо","сказать решительно","твёрдо"]},{"t":"h3","h":"Новые слова"},{"t":"p","h":"акварель – краска, которую разводят водой, или картина,"},{"t":"p","h":"написанная этой краской силуэт – внешний контур предмета скульптура – искусство создания объемных произведений"},{"t":"p","h":"путем лепки, высекания или резьбы"},{"t":"v","l":["убеждённо – ишенимдуу, езу абдан ишенип","","1. Подберите синонимы к данным словам.","Известный – ...","убеждённый – ...","талантливый – ...","увлечённый – ..."]},{"t":"p","h":"2. От каких прилагательных образованы следующие наречия?"},{"t":"p","h":"Убеждённо – ... твердо – ..."},{"t":"p","h":"решительно – ..."},{"t":"p","h":"3. Разберите слова по составу. Обозначьте приставку, корень, суф-"},{"t":"p","h":"фикс, окончание."},{"t":"v","l":["Смотрительница, полуподвальный.","","4. Составьте словосочетания.","Лепить ...","рисовать ...","ночевать ...","посещать ...","работать ..."]},{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 2. Прочитайте воспоминания Т. Садыкова о своем детстве."},{"t":"p","h":"Горы моей родины – Южного Кыргызстана, которые возвышаются всюду, куда ни поглядишь, которые удивляют <span class=\"pg\" data-n=\"138\">138<\/span>разнообразием форм и силуэтов, наверное, еще в раннем детстве помогли мне почувствовать скульптурность мира. А любовь к искусству я впитал с молоком матери. Она была известной на всю округу мастерицей и тонко чувствовала красоту. Мою маму звали Ырыс, что значит “Счастье”. Она кроила и шила чапаны, которые носил весь аил Говсувар. Отец, его звали Садыком, тоже был народным мастером. Он шил чокои – сапоги с загнутыми носами. Сам делал колодки для них."},{"t":"p","h":"Вообще-то мои родители – дехкане. У отца с матерью было пшеничное поле, где они работали не покладая рук, жили бедно, но были счастливы."},{"t":"p","h":"у Как вы понимаете выражение ‘питал с молоком матери’? у В чем похоже детство Т. Садыкова и С. Чокморова?"},{"t":"p","h":"Е Задание 3. Спишите. Расставьте знаки препинания, под-"},{"t":"p","h":"черкните союзы. Определите вид придаточных предложений, объясните характер связи их с главным. Составьте схемы."},{"t":"p","h":"1. Когда в 1947 году мальчик попал в школу-интернат в г. Оше старший брат Турдубай несмотря на семейные нужды во всем помогал способному брату. 2. Во время школьных каникул заботливый Турдубай забирал брата к себе где Тургунбай мог часами рисовать где мог заниматься лепкой резьбой по дереву и акварелью. 3. Когда в 1954 году Тургунбай закончил десятилетку он отправился во Фрунзе поступать в художественное училище чтобы учиться на скульптора. 4. С первой половины 50-х годов Садыков начал активно работать так как он был полон любви к профессиональному искусству желания познать тайны создания скульптуры ибо из всех видов искусства именно скульптура привлекла его."},{"t":"p","h":"По Б. Д. Будайчиевой и Л. А. Прытковой Задание 4. Прочитайте отрывок из воспоминаний Т. Садыкова. Выпишите сложноподчинённые предложения с несколькими придаточными. Объясните знаки препинания."},{"t":"p","h":"<span class=\"pg\" data-n=\"139\">139<\/span>Когда я приехал в город, я узнал, что в художественном училище скульптурного отделения нет. Это очень огорчило меня, так как я хотел стать скульптором и больше никем. Все осложнялось тем, что у меня во Фрунзе не было ни родственников, ни знакомых – негде жить, не с кем посоветоваться. Что делать? Как быть?"},{"t":"p","h":"Однажды я пришел в Союз художников, там проходила выставка скульптора Ольги Максимильяновны Мануйловой, Небольшой зал, и в нем на красивых подставках – скульптуры, много скульптур. Забыв о том, что я пришёл в Союз художников, чтобы посоветоваться, стал жадно разглядывать бюсты, статуи, композиции,"},{"t":"p","h":"На выставку стал приходить каждый день. Ночевал на вокзале."},{"t":"p","h":"Смотрительница выставочного зала, пожилая русская женщина, заметила меня, сказала:"},{"t":"p","h":"– Ходишь, ходишь, а толку нет. Давай я тебя с настоящим скульптором познакомлю."},{"t":"h3","h":"Словарь"},{"t":"p","h":"смотрительница – женщина, которая смотрит за по-"},{"t":"p","h":"рядком в выставочном зале"},{"t":"p","h":"Сложноподчинённые предложения с последовательным и однородным (неоднородным) подчинением широко употребляются в публицистической и научной речи. Они придают высказыванию логическую стройность."},{"t":"p","h":"Задание 5. Прочитайте текст, выпишите из него предло-"},{"t":"p","h":"– жения с одним и несколькими подчинениями."},{"t":"p","h":"Определили меня в истопники, нашли угол."},{"t":"p","h":"Однако житейские трудности казались пустяками, потому что в мастерской Пузыревского меня ждала самостоятельная творческая работа. Я лепил “Голову мальчика”."},{"t":"p","h":"В 1957 году эта работа была показана на художественной выставке Республиканского фестиваля молодёжи Киргизии."},{"t":"p","h":"<span class=\"pg\" data-n=\"140\">140<\/span>Как меня обрадовал и вдохновил этот успех! Я понял, что начала сбываться мечта, что я начал выходить на самостоятельный путь."},{"t":"p","h":"И тут мне отказали руки..."},{"t":"p","h":"Обратился к врачам, и они настоятельно советовали бросить эту работу. Но я не мог отказаться от своей мечты."},{"t":"p","h":"Тогда врачи предложили лечиться пчелиным ядом, потому что поняли, что я не смогу переменить профессию. В городе это было невозможно, поэтому по совету старшего брата я отправился в ущелье Майлуу-Суу, в районе Арсланбоба, где меня приняли в семью охотника и пчеловода Курдуша. Когда после месяца лечения боль в суставах прошла, я принялся за портрет жены Курдуша. Лепил из воска, потому что мне категорически запретили иметь дело с мокрой глиной. По Т. Садыкову Словарь истопник – от жагуучу (меш жагуучу кызматчы) сустав – муун воск – мом Задание 6. Согласны ли вы с мнением: “Воля, направленная к великой цели, помогла Садыкову преодолеть жизненные трудности”? Рассмотрите фотографии скульптур Т. Садыкова. Что бы вы рассказали о скульпторе и его работах своему другу? В каком стиле речи вы построите своё сообщение?"},{"t":"h3","h":"ПРОВЕРЬ СЕБЯ."},{"t":"p","h":"1. Подготовьте сообщение о сложноподчинённых, предложениях."},{"t":"p","h":"1. Какие виды сложноподчинённых предложений вы знаете?"},{"t":"p","h":"2. Какие средства используются для связи простых предложений в сложные?"},{"t":"p","h":"3. Зависит ли употребление союзов и союзных слов от стиля речи? Приведите примеры."},{"t":"p","h":"2. Тесты."},{"t":"p","h":"1. Определите вид придаточного в сложноподчинённом предложении"},{"t":"p","h":"Иди, куда зовет тебя свободный ум."},{"t":"p","h":"а) придаточное цели"},{"t":"v","l":["6) придаточное места","в) придаточное следствия","г) придаточное изъяснительное"]},{"t":"img","src":"data:image/webp;base64,UklGRpIjAABXRUJQVlA4IIYjAAAQQQGdASqwAXwCPrVUn0snOqosrpL5c1AWiWlucuFePaS1Tedl56hmAWBnnwPnR+6o3Z3cX665WnTP1/hJee67eV55zbUBSB8CA5ugX//YEr/YPY9xQ7/095j/O7Un6vw89g/e9jzx60brfXii1ZvS9wA+ddCsNwsuCrhbPMY/NF7WgWFgLD96d5YkR/6gRKPBXiT45GyVwQ93eHXkxU49Ilq+Wp6PQf4Aq9iktFUCohXKOjmrdjvB3P5XQbK62Q6fPdsBU2bZSSoSF7Zrmg+SJO8Rm9cI/QU7jAy4IZjWqeDxPtWfxUmOUvZuqcm0EsND68aGj/K6oVGVaJHJTlpTS74O+6QmJD1za3Jzk1XbYBACcqmyrFaEwV4OQWeMYwtp73TPLspIbWNG6XYSpTMj+W5EV//u50t5WgQU6STkJPAvUjF3Cl704bLvT0WdUUvd1a1NJo76gu/6Umr5pzaTiAMxfW7VBcHTdrnt7WKp2vRmDxDwOra8VyEjX1hkWW7OIEQfa2ZHS0Vf3v9LJSVPhCc1wiuj/BwPjBOCCE/9omql2FFnjqf20uqqnzRK+gyE7HA56mMOCW4CA+OSVBtOwsQttkzdwLcwqlBE633PEw16dRYPFnUMLTXUGTabCUwhsHFAYQ96X5zE9Ofg/ebyHRuOqBKx240BoaBSyjeKTe4IZ/8U2otRfogMkLIamtns7HANWM7O98HI3FNvwmOOLWe5XkHugg6Bk+I5uI/XqWZ9MDziCZ5V6fDpG0zioZhPHHOImLKexen4+xgsyiuuLRMHPp4XOeSjGwkpLR1PnhywHK+MtgYha+XFfQmwxVKFFdypF3NoAaVdgTBUY1heztprY2OV05k+k4MmNIf/MzW9tgKhBI7gkoR6kDWCZmfJvZ/M1kKcSoQuFi9Pzjw/xkrWGcDO5hEZOJX4YGUBdtLrxtzmkTggHVYRuhOcdgp7SEYG4rxvrunOcYYHGzDu1qmb+F3CCu1eBUdkFNT6ZM5u/Ubgi3HG0jqDXYz/g3EESZyYtQsQv0c8fxwaufYAp2w1bUcQnBO8xHSMXZiYYrUiN5hq+ilsPRCv0ohH0/BkwQP2g7AcrbFILBJQpwdXnzXRUGKl8ujtTTDG7ZFI39Y6KzfH1lgP9jAKZ66lnkq56RNlLEGwoHJPM+werLf40S5jUUOqNkFIrK12XUfw+ocDZmhM5ncfDc4xR74OgR6HTHAQy5IwepsXVcwz2GSXSFhaPrBGBWsq6BYdWmb8VtJ4ws5kWl8S8cfVFAYqGEefC4tVDeSf2GFoWNvW2usechDOcRq "},{"t":"v","l":["1. Когда Дейнека начал рисовать?","2. Что он старался передать в своих картинах?","3. Как он относился к учению?","4. Чему научили его педагоги?","5. Что говорил Дейнека о работе художника?","6. Чему он научился сам?","Т. Что привлекало художника в человеке, в природе?"]}],"sub":[{"title":"План","b":6}],"section":"КАКИМ БЫТ!","pages":[142,142]},{"title":"ТЕМА 7 БЕССОЮЗНОЕ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"143\">143<\/span>ТЕМА 7"},{"t":"h3","h":"БЕССОЮЗНОЕ"},{"t":"img","src":"data:image/webp;base64,UklGRogoAABXRUJQVlA4IHwoAABQ8QCdASrHAT4BPrVQokonJScrqlP8+XAWiWlt4ww6q4GYBbATxuslkS6qBT1Y118pjOGm18QgwSOHX+twx7cpDbjZL+F5tmmu1H7mJE+dHzu1F32/Mr0JoSVfo+/+h1xIB1SpwZFi9MsGe+hwUH7xWdPLg6Gr6sSFq8z/j8yjCkcISGiyQkvQbkAIrMORzl670gKg3NXJ75ivoCfJiRQEj1JaKoFi5KYoU/bRbCiilz5scWUvWfj9PLMjYwYN7t2zTJfROhvJQMehl06EKHFg2lIhW2I/CyBdVcY/mJzkCIrU/24FS2h5Fty7CXiCYn8aZeYui7FPvq9Yubpx3v/QjucZ37J1dDTdqDLQNY8QP705O0j6oZPyg9ni9RYk4Il9XzXe7M3wbUmSqF+nhqp0HL8aMPbv/MHegJqn65QU0EEJ+s2TcdhF7m6MYHq7vTrJXJDJMxPvzJ+kK/fof2kUS+1OBjDUWn+K7hfsKgLJt6AkjOT+fzWAS4S1x/TS42Nvvx2iAW4tiYGDF02HjkbovhtktQRJn7Cl8qlRHB+x3Vn4ijRDRD1XVtky12J037xa/0wyov3jxCwfm/E2BEMz9xty9xKKhuk0MifOzxGFfjtTX8MFpX6pfs0eznZ7thErukNkR1o7sXvAUA5rylxCyNXiCDcnWuBgbM6/1iW7HZqhvUp3SkvQQuPvY+Ay2f+igWomc/xefHFQVkuWk89kWahhiHcuTSqbAeAxqxXuGG+yrAVXLKOLsYG3gTdLgy1C1c3p8cFWzh03wmXtTG1fw3kDSKkIF4o5OB3ledcTXdrZ2Xth1FkjnTpbKSHfooktBEAtcHLHLZyQLCL/OV9yG/+v0dxLy4AKWFzE5FzeFHvygWBm1knm/hMBB4eDRJuZIi3QO0T29HgOxv6Y/KnmNubf1emXAL8f75+QdwUA3f5dNkwjSBFlpE2Pz36gh7crbpdfy2iPFjjVGRSFt2GIMze6B8P13x4/OJXOhfHDJm2Ft24TQgPc/52SKHy/yMmesy+zjFd724Eo4UC06PKqo/u+rIjDYes4CH6Qh2jB6aHfI/KNRWfYymr4C7zTapff/X4wNvemxVZS7rXeEWDz1i8hwM8nQKDa9BnyoHfQl3jTcaBq7ZjZVbdoyyoQNoAXVZvyZdqe7Hg7rhVeAJwiIvrtfa6/ikxzmRIUg+W9vuLYi2juLtue42KueJofT2NdeQUFgC64i01nZPRwR9hbq9TmbeCRVRUXpCgjvDex3jnLJZV01siutzm2Dx2lYV+lC/6fQzty5+tQODavA3gut28KJ6+McLH2p2bKqTsOXIyOSo+wKaDcnpXPnwEcobYWFoEaSF62yGp5apwOSP/RgULgK6oKKXgfQxYQjF20ipwr+9LjGY4ylQA/wEoexOqLOXUV0OSDspTwLG92gsrtlR "h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 2. Прочитайте высказывание. Найдите в нем ТЫ сложные предложения. Объясните, почему"},{"t":"p","h":"между частями сложного предложения стоят именно такие знаки препинания."},{"t":"p","h":"Человек творит самого себя. И вслед за французами весь мир повторяет: нет людей некрасивых – есть люди ленивые. Обидно, что часто мы понимаем это поздно: безжалостное <span class=\"pg\" data-n=\"147\">147<\/span>время уже заберет у нас немало красоты и молодости. Хотя есть люди, которые этим грустным закономерностям не подчиняются. Они убедительно подтверждают тезис: все хотят быть красивыми, все должны быть красивыми, все могут быть красивыми."},{"t":"p","h":"По В. Н. Ягодинской"},{"t":"p","h":"Словарь"},{"t":"v","l":["закономерность – закон ченемдуу","убедительно – доказательно"]},{"t":"p","h":"у Согласны ли вы с высказанными мыслями о красоте?"},{"t":"p","h":"Почему?"},{"t":"p","h":"“К какому стилю можно отнести приведённое высказывание?"},{"t":"p","h":"Задание 3. Разверните приведенные ниже микротексты- 4"},{"t":"p","h":"аргументы, используя для этого дополнительные материалы. Текст какого типа у вас получился? Запишите его. Искусство красиво одеваться – вещь довольно сложная."},{"t":"p","h":"Одни думают, что все зависит от природного вкуса, и если его нет, то нечего стараться: все равно ничего не выйдет. ..."},{"t":"p","h":"Другая категория людей уверена, что они одеваются всегда красиво и со вкусом: они всю свою жизнь пользуются одеждой и даже научились хорошо подбирать её, были бы только деньги. ..."},{"t":"p","h":"Значит, для того, чтобы быть одетым красиво, далеко не достаточно иметь только деньги. Искусство красивой одежды связано с общей культурой человека и, главным образом, с его художественной культурой."},{"t":"p","h":"Дополнительные материалы"},{"t":"raw","h":"<h4 class=\"mk\">у Я<\/h4>"},{"t":"p","h":"Между тем, это – самая большая ошибка. Затрачивать много средств – ещё не означает одеваться изящно и модно. На улицах, в учреждениях, театрах, парках можно сплошь и рядом встретить людей, одетых дорого, но при этом весьма дурно."},{"t":"p","h":"<span class=\"pg\" data-n=\"148\">148<\/span>Нельзя забывать о том, что в каждом в той или иной степени заложено врождённое чувство красоты. Только его надо обязательно подкрепить соответствующими знаниями – человек начинает сознательно отличать красивое от некрасивого, у него постепенно развивается эстетический вкус."},{"t":"p","h":"Найдите в тексте бессоюзные сложные предложения. Какие смысловые связи существуют между их частями? Как вы думаете, почему в рассуждении встречаются именно эти виды предложений? Что они помогают выразить?"},{"t":"p","h":"Вспомните, что нужно сделать, чтобы построить 2"},{"t":"p","h":"рассуждение-доказательство."},{"t":"img","src":"data:image/webp;base64,UklGRtINAABXRUJQVlA4IMYNAAAQUgCdASqAAm8APrVWpkwnJSgqpvc7GVAWiWVujydUkNIdruAYgMHPeWuKCPy8+p8e/6zv2+nLcF867p28co8U/Mj8YUI+7PGbwz+MOoW9rtF7QwyTmWv9slItqWoYERoK+1AtH6Enzq88dRMSRXVQd7DWAPRgg58+Eo8kV7ImYr4Y39s9203EZae+XuI/2FHDiRWIf0wkm/5ws++dMQewGO7qV2Gl48Auts7VF4Pc8ZaUUJJH4toxZsMciLgADSIcFD3wrMqdYAMQHr9Z6gWJ9W3KBNlhflYpoHisMKQX7F1v40as9tL674MK72dtdGnOa3J53MFRM0kzvJqtRYh364X/OvyqdnrYKi9TapqaOFhUqoMipFemhVP58bR3FbfGTsVRIbOg9i7GGz2eI64yr3wCuEuLJZaqXpfPAtvjuQurXqqDo5oFSn8/qccJfH3mAR0VCmyCkrFq0NqJgM7SzCldbhSV2lcOF+imd5Z5IeTCPEAzQwH1XXMpKLSuHjoq5I/lZti6IHuchB0aOzNEA4NCaRMi/5o0q0pqFfY6Jcy08tUu2YeBtyjFmpsLXOpfvzht8bPpS+3M9RQXXiZ60mroJ+ztGA7Uty70kq2aPfUuNCCdsqj2LZliSngSjWvxKoFlWOvXojuirR32+LFpvPeLbBwFpgl9sDJr3SiuqzIA0wV8HWm8Ol3Ukbhr5/6KmFh8RSIzdOM5pUtsW7FglwWovivzqrB/hFseXPLkDtBCdQ0kaawlHFTNGhss26/lWNKJrM2/GmveBMOaGzYR3//6T6Z0+wEfdMkHGClU6oG4W5h1PyE0JtBYP5UeagwGjjvNZqCg0zRhxImUl7B7Kt4fFga97vB9tgV/BzzvW+2baHAOv7DigAD+9yRnzvxfJffym7mwvBbH1Q0uO9C0Oo85UaZyZMgXLEJYlBZpqbEeVQzUkyQiZpm6QfKgNb5BTQSOlkyZZx/R3oMiVp1ymgZMbizEBT8T+moYJH1AGoAGEIL5TBOJcxZxV9sRvR7UEDInXRo7g/0mSlOW9iEnw7z4VAMM51xY+dOW/dNcccyhEzVditv1u5VXShnq8VsmjOhzNvJyk08epqcjCGdf+nz73zulW01R2lKMjl3Vom7Xb  последнего курса консерватории. Начались танцы, и я не могла оторвать глаз от неё: она двигалась грациозно, пластично. А когда она получила премию за лучшее исполнение румбы, я поздравила её с победой. Вдруг у неё на глазах выступили слёзы. Она сказала, что это очень счастливые минуты в её жизни. Я не могла понять, что так взволновало её. Девушка объяснила мне: она хромая. У неё от рождения одна нога короче другой, с детства носила она утолщенную подошву на одной туфле. Сколько усилий приложило это юное существо к тому, чтобы сделать свою хромоту малозаметной! Сколько труда было потрачено ею на освоение танцевальных движений, <span class=\"pg\" data-n=\"149\">149<\/span>каких замечательных результатов она добилась! Даже я, профессиональная балерина, не заметила в танце девушки её физического недостатка. Для неё это, конечно, был подлинный праздник победы своего упорства и воли – вот почему она была так взволнована”."},{"t":"p","h":"В. Н. Ягодинская Словарь румба – современный бальный танец у О чём говорится в тексте? Как его можно озаглавить?"},{"t":"p","h":"Составьте план к тексту, подготовьтесь к его пересказу от третьего лица."},{"t":"p","h":"Бессоюзные сложные предложения широко используются в разговорной речи, так как при устном общении интонация является ярким средством выражения смысловых отношений."},{"t":"p","h":"Эти конструкции используются и в публицистическом стиле, когда нужно усилить эмоциональность текста."},{"t":"p","h":"Задание 5. Как бы вы доказали тезис “Человек творит самого себя”? Приведите аргументы в его защиту. Какой пример можно привести для подкрепления аргумента? Сделайте вывод из своего рассуждения."},{"t":"p","h":"Урок 2. МОЛОДЕЖЬ И МОДА"},{"t":"p","h":"В человеке должно быть всё прекрасно: и лицо, и одежда, и душа, и мысли. А. П. Чехов"}],"sub":[],"section":"КАКИМ БЫТ!","pages":[145,149]},{"title":"ОТ СЛОВА К СЛОВУ","blocks":[{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"p","h":"Опорные слова"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>выделяющийся<\/td><td>джинсовый<\/td><\/tr><tr><td>эффектный<\/td><td>спортивный<\/td><td>стиль<\/td><\/tr><tr><td>праздничный<\/td><td>наряд<\/td><td>деловой<\/td><\/tr><tr><td>официальный<\/td><td>консервативный<\/td><\/tr><tr><td>торжественный<\/td><\/tr><tr><td>экстравагантный<\/td><\/tr><\/table><\/div>"},{"t":"raw","h":"<h4 class=\"mk\"><span class=\"pg\" data-n=\"150\">150<\/span>современная капризная изменчивая устаревшая<\/h4>"},{"t":"v","l":["приятное","впечатление","отталкивающее","мода","первое"]},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>элегантно<\/td><td>эффектно<\/td><\/tr><tr><td>одеваться<\/td><td>небрежно<\/td><td>по-деловому<\/td><\/tr><tr><td>неряшливо<\/td><td>выглядеть<\/td><td>официально<\/td><\/tr><tr><td>обдуманно<\/td><td>современно<\/td><\/tr><tr><td>невзрачно<\/td><\/tr><\/table><\/div>"},{"t":"h3","h":"Новые слова"},{"t":"v","l":["капризный – кежир","консервативный – выступающий против всего","нового","наряд – одежда","невзрачно – туру жаман, керксуз","стиль – характерные черты в одежде","экстравагантный – слишком необычный","элегантно – изящно, со вкусом","эффектно – впечатляюще","","1. Подберите существительные к данным прилагательным.","Эффектная ... эффектное ... эффектный ...","","2. От прилагательных образуйте наречия.","Небрежный – ...","неряшливый – ...","модный – ...","современный – ...","официальный – ...","праздничный – ...","","3. Подберите антонимы к данным словам.","Аккуратный – ...","чистый – ...","устаревший – ...","консервативный – ...","","4. Подберите прилагательные к данным существительным.","","... мода ... ВКУС ... Наряд","впечатление ..., ... стиль ... культура"]}],"sub":[],"section":"КАКИМ БЫТ!","pages":[150,150]},{"title":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"151\">151<\/span>ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 1. Прочитайте предложения, соблюдая интона- К цию бессоюзных сложных предложений. Объясните поста-"},{"t":"p","h":"новку знаков препинания. Какая тема объединяет все предложения? О чём будем говорить на уроке?"},{"t":"p","h":"1. Мода удивляла, вызывала сомнение; она поражала воображение и озадачивала с первого дня своего появления на свет. 2. Мода является частью культуры, человек, общество не безразличны к ней. 3. Мода – явление непостоянное, она определяется темпами общественного развития. 4. Молодёжь всегда реагирует на изменения в моде, она быстро схватывает всё новое, по-своему приспосабливает его."},{"t":"p","h":"Задание 2. Прочитайте текст. Выделенные ожения Г] запишите в тетрадь, поставьте знаки препинания. Пере-"},{"t":"p","h":"стройте бессоюзные сложные предложения в союзные, сравните их. Где более четко выражены смысловые отношения между частями сложного предложения?"},{"t":"h3","h":"РОЖДЕНИЕ МОЛОДЁЖНОЙ МОДЫ"},{"t":"p","h":"Не одно столетие мода меняла, придумывала, изобретала одежду для женщин и мужчин. Думала ли она о том, как одеваться детям и подросткам? Нет, они не заботили её."},{"t":"p","h":"Все переменилось каких-нибудь 35—40 лет назад именно тогда возникла молодёжная мода. Она появилась из движения хиппи, возникшего в 60-е годы. Это был бунт молодёжи против общества, где они не могли найти себе место."},{"t":"p","h":"Долой всё, что считается престижным в этом, ненавистном им обществе! Никаких традиционных привычных костюмов носить можно всё что оказалось под руками и что можно купить по дешёвке в лавке старьёвщика отыскать в старом забытом сундуке. Казалось, хиппи не принимают моду. Разрушают всё, что она с таким трудом создавала. Хиппи носили потёртые джинсы сандалии на босу ногу кожаные куртки с бахромой они сами расписывали майки плели верёвочные украшения."},{"t":"p","h":"<span class=\"pg\" data-n=\"152\">152<\/span>Но уже через несколько лет стали появляться обычные люди одетые как хиппи мода бунтарей была освоена коммерцией и превратилась в молодёжную моду. Элементы одежды хиппи стали основой в молодёжной моде."},{"t":"h3","h":"Словарь"},{"t":"p","h":"престижный – пользующийся общим вниманием, уважением старьёвщик – человек, который собирает старые вещи и про-"},{"t":"p","h":"дает их у Как вы думаете, почему коммерция взяла на вооружение"},{"t":"p","h":"элементы одежды хиппи?"},{"t":"p","h":"у Какая сейчас молодежная мода?"},{"t":"p","h":"Задание 3. Из следующих пар простых предложений составьте бессоюзные сложные предложения. Обратите внимание на смысловые связи между простыми предложениями."},{"t":"p","h":"1. У человека развит эстетический вкус, есть умение просто и элегантно одеваться. Он сможет сделать одежду удобной и практичной, оценить моду, выразить в ней собственное “я”."},{"t":"p","h":"2. Современная мода предназначена для всех. Характерной чертой моды является массовость."},{"t":"p","h":"3. Наиболее активно воспринимает новую моду молодёжь. Она является как бы “носителем моды”."},{"t":"p","h":"4. Не обязательно всем без исключения использовать экстравагантные предложения моды. Сверхмодная одежда идет не каждому."},{"t":"p","h":"7 у Прочитайте еще раз полученные суждения. Согласны ли вы"},{"t":"p","h":"с ними?"},{"t":"p","h":"у Разверните их двумя-тремя предложениями, подтверждая"},{"t":"p","h":"правильность высказываний."},{"t":"p","h":"Е “Мы судим по костюму только в самый первый момент”. Задание 4. Приведите аргументы, доказывающие тезис"},{"t":"p","h":"Употребите при этом бессоюзные сложные предложения. Используйте следующие опоры:"},{"t":"p","h":"Но даже с первого взгляда можно понять..."},{"t":"p","h":"Потом мы получаем дополнительную информацию... Скоро мы убеждаемся..."},{"t":"v","l":["<span class=\"pg\" data-n=\"153\">153<\/span>у Ккакому выводу можно прийти в результате рассуждений?","Выберите варианты:","По одёжке встречают, по уму провожают.","Как обманчива внешность!","","Задание 5. До недавнего времени у школьников была","школьная форма. Сейчас форменную одежду отменили."]},{"t":"p","h":"Хорошо это или плохо? Согласитесь или возразите следую-"},{"t":"v","l":["щему утверждению. Запишите своё мнение.","Форменная одежда делает человека одинаковым и равным","со всеми, кто связан с ним определенной общей работой. В","этом в какой-то степени преимущество школьной формы."]},{"t":"p","h":"Ты не имеешь возможности выделиться с помощью какого-"},{"t":"v","l":["то особенного, возможно, недоступного другим костюма.","Только твои личные качества – ум, работоспособность,","воля, трудолюбие, талант – позволяют тебе занять среди","сверстников то место, которое ты желаешь.","Л. П. Орлова"]}],"sub":[{"title":"РОЖДЕНИЕ МОЛОДЁЖНОЙ МОДЫ","b":6}],"section":"КАКИМ БЫТ!","pages":[151,153]},{"title":"Урок 3. МОДА И НАРОДНЫЙ КОСТЮМ","blocks":[{"t":"h3","h":"Урок 3. МОДА И НАРОДНЫЙ КОСТЮМ"},{"t":"v","l":["– Что происходит на свете?..","– Будет апрель.","– Будет апрель, вы уверены?","– Да, я уверен.","Я уже слышал, и слух этот мною проверен,","Будто бы в роще сегодня звенела капель.","– Что же из этого следует?","– Следует жить,","шить сарафаны и легкие платья из ситца.","– Вы полагаете, всё это будет носиться?","– Я полагаю, что всё это следует шить...","Ю. Д. Левитанский"]},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"h3","h":"Опорные слова"},{"t":"raw","h":"<h4 class=\"mk\">народный классический элегантный<\/h4>"},{"t":"h3","h":"праздничная"},{"t":"v","l":["повседневная","костюм","одежда","добротная"]},{"t":"raw","h":"<h4 class=\"mk\"><span class=\"pg\" data-n=\"154\">154<\/span>молодёжное вечернее народное<\/h4>"},{"t":"h3","h":"русская"},{"t":"v","l":["гулянье","нарядная","рубаха","рабочая","праздничный","яркий русский сарафан раф вечерний привлекательный | ансамбль"]},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>молодёжная<\/td><td>талантливый<\/td><\/tr><tr><td>интересная<\/td><td>модель одежды<\/td><td>известный<\/td><\/tr><tr><td>элегантная<\/td><td>французский<\/td><td>модельер<\/td><\/tr><tr><td>Новые слова<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"ансамбль (одежды) – комплект одежды вульгарный – вульгардык, уятсыз, адепсиз"},{"t":"p","h":"отдых группы людей под открытым небом модель – образец какой-то одежды модельер – специалист, который разрабатывает модели"},{"t":"p","h":"одежды рубаха – часть русского национального костюма, вид рубашки сарафан – женская одежда, платье без рукавов, надеваемое"},{"t":"p","h":"поверх рубашки, блузки"},{"t":"p","h":"1. Составьте словосочетания со словом русский и следующими именами существительными."},{"t":"p","h":"Рубаха, сарафан, костюм, одежда, гулянье."},{"t":"p","h":"2. К следующим именам существительным подберите имена прилагательные."},{"t":"v","l":["... ансамбль (одежды) ... модельер","... модель (одежды)"]},{"t":"p","h":"3. От данных прилагательных образуйте имена существительные. По какой модели вы сделаете это? Привлекательный – ..."},{"t":"v","l":["элегантный – ...","талантливый – ...","небрежный – ...","жизнерадостный","очаровательный —","неряшливый – ...","вульгарный – ..."]},{"t":"p","h":"у Какие из полученных слов нужны при положительной характеристике человека?"},{"t":"v","l":["<span class=\"pg\" data-n=\"155\">155<\/span>4. Образуйте прилагательные по модели. сущ. + -н-.","Наряд – ...","вечер – ...","праздник – ...","каприз – ..."]}],"sub":[],"section":"КАКИМ БЫТ!","pages":[154,155]},{"title":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ","blocks":[{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 1. Прочитайте текст. Выделенные в нем предло- К жения запишите в тетрадь, расставив знаки препинания."},{"t":"p","h":"Объясните их постановку. Как вы думаете, о чем пойдет речь на уроке?"},{"t":"p","h":"Русский народный костюм – часть национальной культуры."},{"t":"p","h":"В одежде прочно и наглядно слились два начала духовное и материальное."},{"t":"p","h":"Народ всегда волновало, во что одеться, как защитить себя от холода и дождя, не выделяясь при этом как богатством, пышностью, так и бедностью, и то и другое было плохо. В этом суть народного отношения к одежде, она проявилась в простоте народного костюма, в чувстве меры, в экономической доступности, в красочности и многообразии."},{"t":"p","h":"Народному отношению к одежде была характерна прежде всего удивительная бережливость был сильнейший контраст между рабочей повседневной и праздничной одеждой."},{"t":"p","h":"Красота понималась как здоровье и благополучие – костюмы показывали это."},{"t":"p","h":"Одежда и для девушки и для парня много значила из-за неё не спали ночами зарабатывали деньги. Многие стеснялись ходить на гулянья до тех пор, пока у них не появится нужный наряд."},{"t":"p","h":"Задание 2. Прочитайте описание русской народной одежды. Найдите в нём бессоюзные сложные предложения. Как вы думаете, почему эта синтаксическая структура используется при описании?"},{"t":"p","h":"Основу женского наряда составляли рубаха и сарафан. Рубаха шилась с закрытым воротом и широкими рукавами. Ворот и рукав рубахи делались с мелкими складками, ворот вышивался, по подолу шли строчки и кружева."},{"t":"p","h":"<span class=\"pg\" data-n=\"156\">156<\/span>Поверх рубахи женщина надевала шерстяной сарафан, его верхний край был выше груди, по талии сарафан обхватывался поясом, носили его и без пояса, особенно в тёплое время. Юбка отличалась от сарафана: она держалась на поясе, для неё ткали особую узорную, часто шерстяную ткань."},{"t":"p","h":"Ансамбль русской одежды всегда отличался яркостью красок. В вышивках крестьянских рубах отражены традиционные образы народного творчества: коня, птицы, дерева жизни. По народным понятиям, птица несла радость, свет, добро; дерево символизировало вечно живую природу; конь выражал силу небесного светила."},{"t":"h3","h":"Словарь"},{"t":"v","l":["ворот – то же, что и воротник","подол – нижняя часть юбки, сарафана","ткать – токуу, согуу (кездеме, тор)"]},{"t":"p","h":"у Что составляет ансамбль русского костюма? Чем он отли-"},{"t":"p","h":"чается? Ответы на эти вопросы запишите в тетрадь."},{"t":"p","h":"Задание 3. Прочитайте текст."},{"t":"p","h":"Вячеслав Зайцев – один из наиболее известных модельеров. Главная его забота – создать необходимый ассортимент красивых изделий, отвечающих современным эстетическим требованиям. И Зайцев действительно сумел реализовать свои идеи художника-модельера в элегантных моделях. Вот что говорит Зайцев о русской моде:"},{"t":"p","h":"– Русская мода – часть интернациональной моды. Для неё характерны демократичность, народные традиции. Нам всегда будут нравиться сарафаны, рубахи, дубленки."},{"t":"p","h":"Русская народная одежда всегда привлекала моду мира мудростью и удивительной простотой. Кроме того, она постоянно на неё влияла. Каждое десятилетие интерес к русской моде усиливается. За ним стоит неослабевающий интерес к познанию русского характера."},{"t":"h3","h":"Словарь"},{"t":"p","h":"ассортимент – перечень, набор чего-либо <span class=\"pg\" data-n=\"157\">157<\/span>и Что вы узнали о Вячеславе Зайцеве? Какие мысли высказал"},{"t":"p","h":"он о современной русской моде?"},{"t":"p","h":"Задание 4. Соедините простые предложения в бессоюзные. Сравните свои записи с приведенным выше текстом. В каком случае более четко выражены смысловые отношения между предложениями?"},{"t":"p","h":"1. Для русской моды характерны демократичность, народный дух, традиции. Нам всегда будут нравиться сарафаны, рубахи, дубленки."},{"t":"p","h":"2. Русская народная одежда всегда привлекала моду мудростью и удивительной простотой. Она постоянно на нее влияла."},{"t":"p","h":"3. Каждое десятилетие интерес к русской моде усиливается. За ним стоит неослабевающий интерес к познанию русского характера."},{"t":"p","h":"Задание 5. Прочитайте следующий текст. К какому типу текстов его можно отнести? Найдите в тексте описание внешности девушки. Выпишите его в тетрадь. Какие предложения автор использует при описании?"},{"t":"p","h":"Иной человек располагает к себе с первого взгляда. Так, когда я ехала из Москвы в Сочи, всех нас очаровала девушка из соседнего купе – жизнерадостная, приветливая, скромная. Стоило ей улыбнуться – и голубые глаза ее сияли. А улыбаться ее заставляло всё: и солнце, и шум перрона, и веселый перестук колес – ведь она едет к морю."},{"t":"p","h":"Ощущение свежести создавала её одежда. На ней был голубой сарафан в горошину из чудесного, хотя и самого простого, дешёвого ситца. Его юбка была по-модному пышной. Он весь сверкал чистотой: накрахмален и отутюжен идеально. Белые недорогие, но изящные босоножки на загорелых ногах выглядели нарядными. Шёлковая косынка туго охватывала голову, она переливалась сиреневым, розовым, голубым,"},{"t":"p","h":"Едва поезд отошел от московского вокзала, весь вагон уже знал, что зовут девушку Мариша. Она сразу всем очень понравилась."},{"t":"p","h":"<span class=\"pg\" data-n=\"158\">158<\/span>‚..На другое утро в нашем купе все поднялись поздно. Соскочив с верхней полки, сосед приоткрыл дверь."},{"t":"p","h":"В коридоре вагона сидела пассажирка, на ней была яркая пёстрая блузка. Блузка эта, казалось, была сшита из кусков ткани – она вполне подошла бы клоуну. Из-под серых брюк торчали туфли с длинными носами, словно птичьи лапы с острыми когтями. Лица пассажирки не было видно: она читала, и голову скрывала газета."},{"t":"p","h":"– Мадам Тюрлюлю, – звонким голосом проговорил мальчик, – наверно, ночью с Луны свалилась!"},{"t":"v","l":["– Чучело, – согласился другой сосед.","Тут пассажирка отложила газету."]},{"t":"p","h":"– Да это же Мариша! Мариша? – Мы все смотрели и не узнавали её."},{"t":"p","h":"Перед нами была грубоватая и довольно вульгарная девица. Юность, свежесть – всё, что составляло Маришино очарование, исчезло. Яркие цвета кофты “убили” её румянец, лицо стало серым, даже глаза словно потускнели. Костюм девушки, несомненно, стоил дорого, но он не украшал её, а, наоборот, делал безобразной."},{"t":"p","h":"Неужели эта “мадам Тюрлюлю” та самая Мариша, с которой мы, казалось, уже стали друзьями?!"},{"t":"p","h":"– Безобразно? Да? Я так и знала! – она вскочила, лицо её покраснело. – Ладно, хоть дома никто не видел!"},{"t":"p","h":"Нет, мы не ошиблись в своей новой знакомой, – это всё же “наша Мариша”."},{"t":"p","h":"у танут, и ты всем чужой. Лес горит – пускай. Мостик через канаву сломался – нам какое дело? Мальчишка на улице ревет – пройдем мимо ..."},{"t":"h3","h":"<span class=\"pg\" data-n=\"161\">161<\/span>Ключи"},{"t":"v","l":["ТЕМА 1.","","Урок 1.","Задание 3."]},{"t":"p","h":"Когда люди говорят друг с другом, они создают текст. Он строится по определенным законам, и отдельные предложения-высказывания в нем связаны грамматически и по смыслу. И тексты, и их элементы-высказывания очень разнообразными. Это зависит от различных причин: письменной или устной формы речи, видим мы своего собеседника (адресата) или нет. Кроме того, тексты строятся с учетом конкретного адресата, вида общения – официального или неофициального, тематики и многого другого."},{"t":"p","h":"Указательные слова, местоимения, повторяющиеся слова (лексический повтор), видовременная соотнесенность слов позволяют соединить отдельные предложения в текст."},{"t":"p","h":"Задание 4."},{"t":"p","h":"Для успешного общения необходима культура речи. В наше время как никогда важно владеть ею. Культура речи – это умение грамотно, ясно и красиво выражать свои мысли. Если человек не владеет этим умением, то он общается плохо, неумело. Культуре речи надо учиться."},{"t":"v","l":["Урок 2.","","Задание 3."]},{"t":"p","h":"а) – ответ-описание; 6) – ответ-рассуждение; в) – ответповествование."},{"t":"v","l":["Урок 3.","Задание 3."]},{"t":"p","h":"Текст повествовательного типа. Описания нет. Можно включить после первого предложения художественное описание из задания 2."},{"t":"v","l":["<span class=\"pg\" data-n=\"162\">162<\/span>ТЕМА 2.","","Урок 2.","Задание 1.","Текст-рассуждение.","","Предложения с прямым порядком слов"]},{"t":"p","h":"Не любой человек может стать им. Профессиональному мастерству будущий журналист учится не только в стенах вуза, но и на практике. Журналист должен уметь выступать на различные темы и в разных жанрах. Каждый работник редакции должен уметь написать и репортаж с полей, и фельетон о недостатках городского транспорта, а иногда и рецензию на премьеру в местном театре."},{"t":"p","h":"Предложения с обратным порядком слов Для этого требуется не только определенный набор знаний, который можно получить на факультете журналистики, но и крепкий характер. Настоящим журналистом может стать только человек с активной жизненной позицией, борющийся за добро и справедливость. Такими журналистами были Джон Рид, Юлиус Фучик, Илья Эренбург, Константин Симонов, Александр Каверзнев и другие, не столь известные и вовсе безвестные газетчики."},{"t":"p","h":"Задание 2."},{"t":"p","h":"Что является главной особенностью труда журналиста? Что лежит в основе любой публикации? Что быстро устаревает? Каков поток редакционных заданий? Какова психологическая нагрузка? Каково чувство ответственности перед читателем?"},{"t":"p","h":"Задание 3."},{"t":"p","h":"Имейте определенный набор знаний и твердый характер, обладайте активной жизненной позицией, будьте активным участником событий, будьте борцом за добро и справедливость, заслужите право называться настоящим журналистом, умейте писать на разные темы и в разных жанрах."},{"t":"p","h":"<span class=\"pg\" data-n=\"163\">163<\/span>Задание 4."},{"t":"p","h":"Текст публицистического стиля, рассуждение."},{"t":"p","h":"Иной человек – клад интереснейших мыслей и чувств, жизненных наблюдений, но вот рассказать об этом не может. Необщительный, не владеющий искусством устной беседы газетчик никогда не станет хорошим журналистом."},{"t":"p","h":"Задание 5."},{"t":"p","h":"Легко ли быть журналистом? Что же является условием успеха журналистского творчества?"},{"t":"v","l":["Задание 6.","Высказывание публицистического стиля.","","Урок 3.","Задание 1.","Публицистический.","","Задание 2."]},{"t":"p","h":"Не правда ли, наш участковый добрый и отзывчивый. По-моему, на посту ГАИ стоял Асанов, опытный инспектор. Мне кажется, Павлов как адвокат работает в суде уже много лет. Помните! Юрист – это прежде всего воспитатель."},{"t":"p","h":"Задание 3."},{"t":"p","h":"На предупреждение правонарушений и преступлений главным образом направлены в своей работе постовой полицейский, участковый инспектор, юрисконсульт. Окончательно решает дело и как бы подводит итог работы многих служб правоохранительных органов судья в составе суда."},{"t":"p","h":"Задание 4."},{"t":"p","h":"1. Закон был его оружием. (Повеств.) 2. Ведь Шерлока Холмса называют великим сыщиком? (Вопросит.) 3. Такого в истории ещё не было! (Восклицат.) 4. Суровые годы репрессий... (Повеств.) 5. Где тут живет ваш участковый?"},{"t":"p","h":"<span class=\"pg\" data-n=\"164\">164<\/span>(Вопросит.) 6. Ни шагу назад! (Побудит.) Т. Это был его первый экзамен. (Повеств.)"},{"t":"p","h":"Задание 5."},{"t":"p","h":"Глубоко заблуждается тот, кто думает, что главное – преступника поймать и осудить. А уже там, в колонии, будут его воспитывать."},{"t":"p","h":"Нет, процесс воспитания начинается с самой первой встречи преступника с представителем закона. Что скажет ему следователь, как скажет, каким тоном, как будет вести себя с подозреваемым, насколько справедливыми будут его действия – всё это будет работать на воспитание."},{"t":"p","h":"Нам важно, чтобы человек, который был осужден, вернулся в общество в таком состоянии, чтобы с ним можно было жить, работать, общаться и не бояться повторения прошлого. И значит, юрист – это прежде всего воспитатель."},{"t":"v","l":["Урок 4.","Задание 3."]},{"t":"p","h":"1. Водитель почувствовал что-то непонятное. 2. Из-за ели вышли двое с карабинами 3. Романов бросил машину вперед. 4. Раздались выстрелы. 5. По следу шли работники милиции. 6. Геннадий прыгнул в сторону и спрятался за кустом. 7. Медведев посчитал, что преступники появляются в окнах через каждые 6-7 минут. 8. Он продолжал лежать без движения. 9. Геннадий слышал призывы товарищей прекратить огонь."},{"t":"p","h":"Задание 5."},{"t":"p","h":"1. Смелость удивляла меня. 2. Можно было признать в нем хорошего специалиста. 3. Человека труда можно любить."},{"t":"p","h":"4. Хочется верить в успех нашего товарища. 5. Судья обязан признать виновность преступника. 6. Руководство отметило мужество капитана. 7. В нём можно было заметить хорошо подготовленного работника милиции, <span class=\"pg\" data-n=\"165\">165<\/span>Урок 5."},{"t":"p","h":"Задание 2."},{"t":"p","h":"Не будет ли преувеличением сказать: выбирая профессию, каждый выбирает еще и будущую свою жизнь? Надо ли говорить о том, как важно не ошибиться? Заинтересован в этом не только каждый подросток, оканчивающий школу, заинтересовано все наше общество. И не просто потому, что у человека, делающего свою работу с любовью, “отдача больше”. У человека, не любящего свою работу, наступает недовольство собой, своей жизнью."},{"t":"p","h":"Задание 3."},{"t":"p","h":"Человек – хозяин своего призвания. Я без особенного энтузиазма отношусь к твоим восторгам: “Ах, такое счастье стать радиофизиком! Ах, так я люблю радиофизику!” Любить можно то, чему уже отдал частицу своей души. Это очень хорошо, что ты относишься с интересом к радиофизике, но помни, что это ещё только интерес. Призванием же становится интерес, помноженный на труд."},{"t":"v","l":["Проверь себя.","1. Тесты."]},{"t":"img","src":"data:image/webp;base64,UklGRloeAABXRUJQVlA4IE4eAADQtgCdASqAAnMBPrVWp00nKSglpHG7MSAWiWVuLchc76XFs/e6rJP/FDj88Z5ZY47nf+Rb/88v+/ESSYXTL7l952P9q/7blm93RgUAv+v4EnY/+n1GbmHaoteOmfKevHJl16/Zj7nPD5tfk+SxA16gv9D0m/Vfz127hetd/UOnC9OPJNJ+Wm/Sz+3z9rIzuK8o/+u4T3WPMO9vL+LUy8L6+MZXxth5v3vVHxnNoArHdRzmdBF+AXRI5S7KsSjjKazHvTI48ZDAvuSBB/9skSky+TXFPAu+WXI//n+4U9p0tAd1CiJRIhREcgfUwjwqX2M5xTpGAo0ewv1u1NDm09YMNh+XfeoWYN8jwlI8lXRkL138qkvcgzc7Qov5yZh2g8KXoS/jQNs1c4All4VmbWfB9x/0Orp4modHxZgvLhGkK3u7y9zK2/QTdWwGS3izMJXc5HoBBYAqQ7mZVe2pTTuljT2uBk2c7ACjZsy7Y4WTe5lu7tJWoGMm0SWITuv77sILwFUEfjYzYvEjPy1usgZcyX3BWk2fMifB4bQo+WX9wDj15eHOsF1aDuZgBuXT0YjvxjUr1/NkmNedDc4f2vQKSR6TWCQanT32sfnKZzaF+WeUFI500zupa3MK473sJSeuG0Sa5by+WlFlPcHnATxZefY5IWyZvLJBNKW4TxHX/jDWt/F2E4/uK8MTJ0XORQnA93yyY8BegL2Y4HO7+J2ahk2NraUyk9iGKRLbvE13ovz1WV9ryWfjr/0e+GLp5rIF я, вы можете почувствовать глубокое недовольство собой."},{"t":"v","l":["ТЕМА 3.","","Урок 1.","","Задание 2."]},{"t":"p","h":"хорошо или плохо расходуем (примыкание); точно подсчитать (примыкание); свободное время (согласование); время на сон (управление); подготовку задания (управление); количество часов (управление); выходные дни (согласование); целое богатство (согласование),"},{"t":"v","l":["Задание 4.","А.","","хороший мой друг","какой черт","со второго этажа","одним словом","быстрейшего выздоровления","интересный случай","какой-то тип","какую-нибудь песню","туристские песни","","Б.","пора выбирать","напиши обязательно","","В.","был в доме","в доме работников искусства","страничка про меня","очень интересна","писать серьезно и длинно","","номер журнала","выставка из тем","викторина по","Маяковскому,","Блоку, Есенину","<span class=\"pg\" data-n=\"167\">167<\/span>воспоминания о Варшаве","была в школе","был на месте","поручили вечер","","Задание 8.","Разговорно-бытовой.","","Урок 2.","Задание 1.","поручили классу","читала А. Блока","не было танцев"]},{"t":"p","h":"Немногие (мест.) знают (личн. гл. наст. вр.), что писал (личн. гл. прош. вр.) свою басню Иван Андреевич (имя собств.) с полным знанием дела."},{"t":"p","h":"И. А. Крылов (имя собств.) с лучшими виртуозами разыгрывал (личн. гл. прош. вр.) самые трудные квартеты."},{"t":"p","h":"Задание 2."},{"t":"p","h":"Менделеев был большим любителем шахмат. Об интересе учёного к шахматам свидетельствуют экспонаты, хранящиеся в мемориальном музее в Санкт-Петербурге. Он играл очень хорошо, но проигрывать не любил и очень редко получал мат. Он играл обдуманно и весь уходил в игру."},{"t":"p","h":"В одном из первых дневников Д. И. Менделеева есть такая фраза: “Не могу я ничего делать, не привязавигись к делу”. Это высказывание очень точно характеризует не только его отношение к серьёзному делу, но и к увлечениям."},{"t":"v","l":["Задание 3.","","Согласуется в роде и числе.","","Задание 4."]},{"t":"p","h":"1. Ряд известных экспонатов музея был представлен на выставке. 2. Большинство художников выступили на конференции. 3. Трое музыкантов остались за кулисами."},{"t":"p","h":"4. Значительная часть коллекции хранится в Эрмитаже."},{"t":"p","h":"5. Большая часть экспонатов Кунсткамеры свидетельствует об увлечениях Петра Т. 6. Часть посетителей музея заинтересовалась зоологической коллекцией."},{"t":"p","h":"<span class=\"pg\" data-n=\"168\">168<\/span>Урок 3."},{"t":"p","h":"Задание 1,"},{"t":"p","h":"1. Почти каждый человек имеет (сказ.) свое увлечение."},{"t":"p","h":"2. Увлечения делают (сказ.) жизнь более богатой и интересной."},{"t":"p","h":"3. Многие ребята увлекаются (сказ.) коллекционированием марок. 4. Ряд увлечений по-своему влияет (сказ.) на человека, на его характер, чувства, волю. 5. Большинство увлечений способствует (сказ.) развитию ценных качеств человека."},{"t":"p","h":"6. Двенадцать учеников увлекаются (сказ.) автоделом и посещают (сказ.) автошколу."},{"t":"v","l":["Задание 3.","Петровский кабинет редкостей"]},{"t":"p","h":"У входа в Кунсткамеру стоят чучела и скелеты. С потолка свисают высушенные рыбы и змеи. В шкафах за стеклянными дверцами в цилиндрических сосудах помещены различные препараты. В сосудах находятся странные звери, диковинные рыбы, ящерицы, змеи."},{"t":"p","h":"Наряду с зоологическими коллекциями Кунсткамера располагает хорошим гербарием, собранием минералов, а также большим числом восточных, китайских и сибирских редкостей."},{"t":"p","h":"Сказуемые согласуются с подлежащими в лице и числе."},{"t":"p","h":"Задание 4."},{"t":"p","h":"1. Пешие прогулки, книги, посещение Музеев являются прекрасными видами отдыха. 2. Туризм и спорт способствуют физическому и духовному развитию человека. 3. Строгий режим дня, обязательность и аккуратность облегчают нашу жизнь. 4. В выходные дни в бассейне раздаются крики и смех отдыхающих. 5. Иногда родители и дети имеют общие увлечения."},{"t":"v","l":["Урок р 4.","Задание 1."]},{"t":"p","h":"Человека, собирающего коллекцию, называют коллекционером."},{"t":"p","h":"<span class=\"pg\" data-n=\"169\">169<\/span>Но человек, собирающий коллекцию, приобретает много новых знаний. Прежде всего он прочтет название страны, выпустившей марку. Потом коллекционер, захотевший узнать, что (или кто) изображено на ней, заглянет в справочник, словарь, а то и в энциклопедию."},{"t":"p","h":"В тексте встречаются распространенные обособленные определения."},{"t":"p","h":"Задание 2."},{"t":"p","h":"Немногие произведения Леонардо да Винчи дошли до нашего времени. Но сохранившиеся картины создали художнику всемирную славу. Леонардо да Винчи, отдававший много времени живописи, увлекался также математикой и архитектурой. Известно, что Леонардо да Винчи, написавший большой и серьезный труд о вращении Земли, опередил на 40 лет Николая Коперника. Он высказал предположение, утверждающее, что “белый цвет есть причина всех цветов”."},{"t":"p","h":"Задание 3."},{"t":"p","h":"1. Эрмитаж – это великолепный музей художественной коллекции, занимающий большую площадь. 2. В местном музее Саратова обнаружена коллекция картин неизвестного художника, состоящая из пяти полотен. 3.Как же обнаружили удивительную коллекцию, пролежавшую много лет?"},{"t":"p","h":"4. Ученые доказали, что картины, сохранившиеся со времен Петра, представляют большую ценность. 5. Тайна картин, разгаданная совсем недавно, удивительна."},{"t":"p","h":"Задание 4."},{"t":"p","h":"1. На выставке, открывшейся недавно в Москве, представлены работы кыргызских художников. 2. Показано немало картин, свидетельствующих о творческом росте молодых художников. 3. Картины, присланные на конкурс, выполнены прекрасно. 4. Моя подруга, занимающаяся в художественном училище, повезла на выставку свои работы. 5. Работы, представленные на выставке, вызвали большой интерес у посетителей."},{"t":"p","h":"Обособленные определения выражены причастными оборотами."},{"t":"p","h":"<span class=\"pg\" data-n=\"170\">170<\/span>Урок 5."},{"t":"p","h":"Задание 3."},{"t":"p","h":"1. Знаете ли вы, что основные идеи построения универсальной вычислительной машины были разработаны английским учёным Чарльзом Бэббеджем еще в ХШМХ веке?"},{"t":"p","h":"2. Его проект механической вычислительной машины имел все основные блоки, которые есть в современных ЭВМ. 3. Но осуществили идею учёного только во второй половине XX века с развитием электроники. 4. В развитии техники вычислений можно выделить два этапа. 5. В 1947 году в Киеве небольшая группа учёных под руководством академика С. А. Лебедева начала работать над созданием первой в Европе электронно-вычислительной машины. 6. Постепенно люди создали инструменты, помогающие вести вычисления. 7. Люди научили машину самостоятельному осуществлению сложных расчётов по заданной ей программе. 8. Чтобы научить ЭВМ считать, математики должны были глубоко проанализировать все используемые методы и приемы вычислений, пересмотреть их и создать новые. 9. Современные устройства электроники являются небольшими и имеют высокую надёжность и быстроту действия."},{"t":"p","h":"В тексте управляемые слова употребляются в форме родительного падежа и выполняют в предложениях функцию определения или дополнения. Текст относится к научному стилю."},{"t":"v","l":["Урок 6.","Задание 1."]},{"t":"p","h":"Проводить – проведение, выполнить – выполнение, управлять – управление, переходить – переход, обработать – обработка."},{"t":"p","h":"Отглагольные имена существительные характерны для научного стиля."},{"t":"v","l":["Задание 2.","Как устроен компьютер"]},{"t":"p","h":"Любой компьютер состоит из трёх основных блоков: процессора, памяти, устройств ввода-вывода. Процессор – <span class=\"pg\" data-n=\"171\">171<\/span>это центральное устройство компьютера, в котором идёт обработка информации. Он может выполнять различные операции – арифметические, логические и другие. Выполнение операций осуществляется с помощью машинных команд, которые хранятся в памяти. Последовательность таких команд представляет собой машинную программу. Скорость выполнения команд очень велика и зависит от конструкции компьютера."},{"t":"p","h":"Задание 3."},{"t":"p","h":"1. В формировании научных знаний учащихся большую роль играют современные компьютеры. 2. Для повышения компьютерной грамотности во многих школах введено программирование. 3. Наука должна в ближайшие годы шагнуть вперед в создании новейших конструкций ЭВМ."},{"t":"p","h":"4. В ближайшие 20 лет сложные задачи предстоит решить и в области экономики. 5. Из-за болезни учителя уроки по информатике пришлось отменить."},{"t":"p","h":"Задание 5."},{"t":"p","h":"Думать насчет машинной программы, разговоры относительно экзаменов, вследствие введения информации, сквер вблизи школы, отпуск ввиду болезни."},{"t":"v","l":["Проверь себя.","1. Тесты."]},{"t":"img","src":"data:image/webp;base64,UklGRjYjAABXRUJQVlA4ICojAADwvACdASqAAkABPrVUpU0nJKOoovFsYRAWiWVuCtRbz+HCz/86Q/0v7Iwkf87ts8b/63qq/jf+q9cbP+uv/6vS1/1eXvdV2PLLo99i3K22+Mv3T+J4PpzH+6/Y7xi+wf7LqZstLpz7VXjcfsB6+mWyiS8FytasegfvyWfmX+5Zndo709f6TpGep/+0dGZp4vRgem7kjE6zrNYS/f+vvXxWof7/+zcm/xY1C/W/CH6j5gXuRgeawfgz0X8YYZy1e9AqF+YMHAFKsOur8E27InFB9y/do2K83IGsOvzZkYESiZgMCA94uF1D2P0NgCdTehQjcOtzbflblOeoJassmBPVLfNRRWVsm/tGc7sO4Pm+X8rz9Ro1AwehPjg8oLJKGYHcV26X6yhy+x3eccN0/F60s0WxUWt7Uaeosh/2spsoelBHc3WGNjsSiJ0a4Hjw/ZwfyRXsuv2YOQQWgXDnyxvEnsEJUxAACQCUkPVFX2dLweExGOoM4F4oGnKh6LeTfC1EK35VAROJf4EfOVyLmcewkckQX7VFW1zmxpjORTbPjcrWR90Yvf2MN4A7zOY94AcD0ZCse8cvSSojUQBWEWnH0Gd6oczjB8v3yJWpnN0c3sS5baZGV0zye2DXIU5t7NuzS81V1bLmjXyZ9p+dszqJuIt/B2RX2hjDsL0UMMVNd4E2RekajRmD9TB4QZkZJXBPS96acjPxn4megI3da63BVxOobtVAvOBo0b1YBGP2sQdChxcz5WoQSAMnYaRX70RM/Idiz2uw2IITPyx5/zRjQpiGhUMaRT4sTB7hbUG8G3CqzoJec35gMJHbjC5v4vEAgZ0vIz2RAKR1n+ynuMfaVvqa31aS+IRNKDSAtNCH4qWr7+4i8VS0pRd61WrC64Sp07jAq2Gy+7cvE9Y97nQCZsdAhPX+H416wXdKkSG6VKOmCGzujnxvTGRqu8d12stu1nVNQ3fDexfH7G3bF7MTpNt1z3AFGqjpLyj3QuGKHgVPaTnETotjZCTGZVuU6o2DtroT6pnvB9PHnArssa9GI3IUebntia/pP8pWSHh7g0M0kJO000yjvbQD33X8SC9cSNBfJycFZyNIhKhFFuqPuhmhMuLXDb0zEPAI89OcY6rMQlabA0j7Uigw6dakIb/TiZs5IDYYXaDQq4+0wd/ScdUc

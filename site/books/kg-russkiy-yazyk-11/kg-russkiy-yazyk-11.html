кулаками не машут. 3. Береги платье снову, а честь смолоду. 4. Не спеши языком – торопись делом. 5. Пашню пашут, так руками не мащут."},{"t":"v","l":["Это обобщённо-личные предложения.","","Задание 5."]},{"t":"p","h":"Этому не следует удивляться. (Безличное.) Поражаешься их смысловой близости. (Обобщённо-личное.) <span class=\"pg\" data-n=\"173\">173<\/span>Урок 2."},{"t":"p","h":"Задание 1."},{"t":"p","h":"Главный член предложений выражен гл. мн. ч. прошедшего времени. Неопределённо-личные предложения. Текст относится к научному стилю."},{"t":"p","h":"Задание 2."},{"t":"p","h":"Как известно, англичане – одни из самых больших любителей чая. По национальной английской традиции чай пьют в определённое время."},{"t":"p","h":"В заранее облитый внутри кипятком чайник засыпают чай. Чай настаивают приблизительно 5 минут. В то же время в прогретые чайные чашки наливают свежее молоко по желанию. Затем наливают чай в чашки. Никогда не поступают наоборот – не наливают молоко в чай. Многолетний опыт показал, что когда наливают молоко в чай, никогда не получается желанный аромат и вкус. Эта традиция очень строго соблюдается. Чай с молоком пьют утром во время завтрака, в обед и в пять часов после обеда. Кроме Англии, этот обычай чаепития широко распространен в США, Канаде и в других странах."},{"t":"p","h":"В тексте используются в основном неопределённо-личные предложения."},{"t":"p","h":"Задание 3."},{"t":"p","h":"Днем было душно (безлично-предикативное слово), а к вечеру становится (безлично-предикативное слово) прохладнее. С гор повеяло (личный гл. в безличном значении } свежестью, запахом трав. Во дворе ставится самовар (возвратная форма личного гл.). Заваривается (возвратная форма личного гл.) ароматный чай. Запахло (личный гл. в безличном значении) свежими лепешками. Дышится (безличный гл.) легко и свободно после трудового дня."},{"t":"p","h":"Задание 4."},{"t":"p","h":"1. В Китае очень ценят чай. Для приготовления чая употребляют наиболее ароматные и благородные сорта."},{"t":"p","h":"<span class=\"pg\" data-n=\"174\">174<\/span>2. В Японии обычно приготавливают чай, как ив Китае, в чашках с крышкой. Готовый напиток подают в маленьких чашках, напоминающих кофейные, без сахара или других добавок. Пьют чай по несколько чашек перед едой или во время еды."},{"t":"p","h":"3. В России заваривают чай в фарфоровых чайниках. Сначала чайник согревают, ополаскивая горячей водой, потом насыпают чай и заливают кипятком. Чайник накрывают салфеткой и оставляют на 5—10 минут для настаивания."},{"t":"p","h":"Урок 3."},{"t":"p","h":"Задание 1."},{"t":"p","h":"Всюду снег, совсем как зимой. Только солнышко светит уже не по-зимнему. Идешь по тропинке в лесу, перед тобой всё бело. Под деревьями лежат синие-синие тени. Таких густых теней зимой не увидишь. И небо голубеет уже повесеннему. Смотришь в него, не можешь глаз оторвать. Такое оно голубое, радостное, как будто согретое."},{"t":"p","h":"Описание. В тексте показаны признаки наступающей весны. В тексте употребляются обобщённо-личные предложения, которые помогают передать неоднократно повторяющиеся в жизни автора действия. Его личный опыт приобретает обобщённый характер."},{"t":"v","l":["Задание 2.","а) Тишина в пустыне. 6) Утро необыкновенное."]},{"t":"p","h":"Тексты относятся к художественному стилю, к описанию."},{"t":"p","h":"Задание 3."},{"t":"p","h":"В конце февраля – начале марта в русских городах и деревнях отмечают веселый праздник – Проводы зимы, `Масленицу. Это самый древний праздник русского народа."},{"t":"p","h":"Прихода весны на Руси всегда ждут с большим нетерпением, радуются солнцу, теплу после холодной русской зимы."},{"t":"p","h":"Празднуют Масленицу неделю. Понедельник называют “встреча”, потому что в этот день встречают праздник. В <span class=\"pg\" data-n=\"175\">175<\/span>каждом доме пекут блины, которые являются символом весны. Вторник называют “заигрыш”, потому что в этот день начинаются масленичные игры. Среда носит имя “лакомки”. А четверг —“разгуляя”. В эти дни в городах и деревнях строят снежные крепости, устраивают веселые сражения. Катаются с ледяных горок на санях, играют в снежки – прощаются с зимними забавами."},{"t":"p","h":"В пятницу и субботу по обычаю ходят в гости, навещают родных. И на столе в каждом доме обязательно бывают традиционные блины."},{"t":"p","h":"Задание 4."},{"t":"p","h":"Первое марта. – Назывное предложение. Оно включено в начало (зачин) повествования, помогает обозначить тему рассказа."},{"t":"p","h":"Их носят целый месяц до 1 апреля. А 1 апреля до восхода солнца вешают на ветку фруктового дерева – на счастье.— Неопределённо-личные предложения. Они включены в конец рассказа и помогают показать, что эта традиция соблюдается всеми жителями Молдовы."},{"t":"v","l":["Урок 4.","Задание 1."]},{"t":"p","h":"Хлеб. (Назывное.) Его именем клялись, краюху материнского хлеба брали с собой в дорогу как благословение. (Неопределённо-личное.) Хлебом и солью на Руси до сих пор встречают и провожают дорогого человека, которому желают оказать почтение. (Неопределённо-личное.)"},{"t":"p","h":"Задание 2."},{"t":"p","h":"Ломоть хлеба – символ жизни каждого человека, хлеб – мощь государства. Поэтому и относиться к нему надо бережно: как к самому дорогому, ничем не заменимому в жизни человека. (Безличное."},{"t":"p","h":"Задание 3."},{"t":"p","h":"В Египте пекли пресный хлеб. В жарком климате тесто быстро закисало. Долгое время его выбрасывали. Но нашлись <span class=\"pg\" data-n=\"176\">176<\/span>люди, видимо, бедные, которые стали печь хлеб и из кислого теста. Так родился новый вид хлеба – кислый."},{"t":"p","h":"Вначале в Европе выпекали пшеничный и ячменный хлеб, ас VII века стали употреблять ржаной хлеб."},{"t":"p","h":"Задание 5,"},{"t":"p","h":"У нас в Армении редко когда произносят “завтракать”, “обедать”, “ужинать”, хотя эти слова, конечно, в лексиконе есть. У нас говорят “кушать хлеб”. И когда нас приглашают к столу, так и говорят: “Кушать хлеб”. Так говорят, даже если на столе только молоко. – Неопределённо-личные предложения, они помогают подчеркнуть, что сказанное относится ко всему народу Армении."},{"t":"v","l":["Проверь себя.","2. Тесты.","1. – безличные.","2. Летнее утро. (+)","3. – описание.","","ТЕМА 5.","Урок 1.","Задание 2."]},{"t":"p","h":"1. Пригрело весеннее солнце, и вот яблонька ожила, начала расти, повеселела и окрепла. (Соединительные; последовательность действий.) 2. Предрассветный легкий ветерок тронул листья в верхушке берёзы, и они затрепетали с тревожным шумом. (Соединительные; последовательность действий.) 3. То падал как будто туман, то вдруг припускал косой крупный дождь. (Разделительные; чередование действий.) 4. Солнце село, но в лесу ещё светло. (Противительные; противопоставление.) 5. Здесь уже не пахло акацией и сиренью, не слышно было музыки, но зато пахло полем... (Противительные; возмещение. } 6. Вот откуда-то доносится отрывистый, тревожный крик неуснувшей птицы, или раздается неопределённый звук. (Разделительные; перечисление.) Т. Светило солнце, и <span class=\"pg\" data-n=\"177\">177<\/span>степь дымилась и блестела. (Соединительные; одновременность.)"},{"t":"p","h":"Приведённые предложения относятся к художественному стилю, соответствуют описательному типу текста."},{"t":"p","h":"Задание 4."},{"t":"p","h":"Внутренний мир человека связан с природой, и потребность в общении с красотой родной планеты была и остается одной из самых главных у человека. (Соединительные отношения.)"},{"t":"p","h":"Под влиянием природы, окружающей человека с детства, у него формируются эстетические модели красоты, но у каждого народа они неповторимы в силу особенностей той природы, в которой он живет. (Противительные отношения.) Жители Японии, например, восхищаются карликовыми деревьями, а русские предпочитают березу. (Противительные отношения.)"},{"t":"p","h":"У каждого народа свои любимые растения, птицы, животные. Аист – любимец белорусов, а грузины лучшей птицей считают фазана. (Противительные отношения.) Жители северных лесов восхищаются глухарем, а степные жители предпочитают жаворонка. (Противительные отношения.) Дагестанцам дороже всех орел."},{"t":"p","h":"Сама природа вручает нам ключи от красоты. Сохранить бы их!"},{"t":"v","l":["Урок 2.","Задание 2.","Осторожно: природа!"]},{"t":"p","h":"Мы выросли и живем на Земле. Человеческий организм связан со всеми компонентами биосферы: растениями, насекомыми, микроорганизмами. Он входит в великий круговорот природы и следует ее законам. Организм животных реагирует на изменения температуры, интенсивность солнечного излучения, и так же реагирует на суточные и сезонные изменения человеческий организм."},{"t":"p","h":"Солнце оказывает влияние на многие биологические процессы на Земле, а значит, и на человека. Повышается <span class=\"pg\" data-n=\"178\">178<\/span>солнечная активность, и на Земле усиливается биологическая активность."},{"t":"p","h":"Конечно, человек отличается от всех животных, являясь частью общества. Человек не только приспосабливается к природе, но он ещё стремится и изменить её своим трудом."},{"t":"p","h":"Проблема заключается в разумном преобразовании природы, рациональном использовании её богатств в интересах ныне живущих людей и будущих поколений."},{"t":"p","h":"Задание 4."},{"t":"p","h":"Предложения с однородными членами Человеку нужны чистый воздух и вода, зеленый шум лесов и пение птиц."},{"t":"p","h":"Достаточно сказать об Аральском море и загрязнении воздуха в городах, о разрушении почв и гибели животных."},{"t":"p","h":"И общение с природой, и наблюдение за животными и птицами, и наслаждение красотой пейзажей – всё это несет здоровье и радость людям."},{"t":"p","h":"Сложносочинённые предложения Для решения этих проблем не только создаются государственные комитеты по охране природы, но и работают общественные организации, следящие за состоянием природы."},{"t":"p","h":"Эти неповторимые места выполняют задачу охраны природы, а также они играют большую роль в экологическом воспитании населения."},{"t":"v","l":["Урок 3.","Задание 1,","","Играющий волшебник"]},{"t":"p","h":"Обычно Иссык-Куль тих и безмятежен. Играет сам с собой, нашептывает себе что-то и нет-нет да выплеснет из себя радугу. Постоит она, а потом вдруг сразу рассыплется, и затанцуют по волнам диковинные краски, то расходясь широким веером, то складываясь в узкую лучевую полоску <span class=\"pg\" data-n=\"179\">179<\/span>через всё озеро. Смахнет волной этот лучик-полоску, упадет он на дно и, словно растворившись там, заиграет всеми красками: синей, и розовой, и голубой, и зелёной..."},{"t":"p","h":"Текст относится к описательному типу речи и художественному стилю."},{"t":"p","h":"Задание 2."},{"t":"p","h":"Текст относится к научному стилю. В нём встречаются точные данные и факты, термины."},{"t":"p","h":"Задание 4."},{"t":"p","h":"Когда-то давно, так давно, что люди и забыли, когда это было, существовал древний город. Над ним, на вершине высокой крутой горы, возвышалась крепость могущественного хана, со всех сторон окружённая страшными ущельями, глубокими пропастями. Хан славился богатством, но ещё больше он был известен жестокостью в обращении со своими подданными."},{"t":"p","h":"Однажды он узнал, что в одной бедной семье кочевников есть девушка сказочной красоты, и решил жениться на ней."},{"t":"p","h":"У девушки был возлюбленный, и она отказалась от предложения хана стать его женой. Тогда хан решил насильно увезти её. Когда девушка гуляла в горах, ожидая своего возлюбленного, ханские всадники схватили её и увезли в крепость."},{"t":"p","h":"Хан осыпал её подарками, но никакие дары не могли поколебать решения девушки. “Я люблю другого”, – был её ответ. Ярость охватила хана. Как зверь, бросился он к девушке, но она выпрыгнула из окна в зияющую бездну."},{"t":"p","h":"Дрогнули неприступные стены крепости, разрушились гранитные своды, и отовсюду пошла вода."},{"t":"p","h":"На месте зловещего ханского дворца, среди голых и темных утесов, засверкало голубое, как небо, чистое, как хрусталь, горячее, как девичье сердце, горное озеро, которое люди назвали Иссык-Кулем (горячим озером)."},{"t":"p","h":"<span class=\"pg\" data-n=\"180\">180<\/span>Проверь себя."},{"t":"p","h":"Самое лучшее в мире – смотреть, как рождается день. В небе появился первый луч солнца, Ночная тень тихонько прячется в ущельях гор, в густой листве деревьев, в кружевах травы, а вершины гор улыбаются ласковой улыбкой."},{"t":"p","h":"Шаловливо покачиваются цветы. Они гордо улыбаются, тянутся к солнцу, а лучи его горят в каплях росы, осыпают цветы и листья блеском бриллиантов."},{"t":"p","h":"2."},{"t":"img","src":"data:image/webp;base64,UklGRiYfAABXRUJQVlA4IBofAABw0QCdASqAAskBPrVYqE0nLayro/Kq4bAWiWVuLZy4q7ASM4ijAc9HyQ70st8D55Oml+d+/h+FqdtyDPfOkPznnGkx5zj/Sq4dUJ0OD9gF+pD/XbyLned2e3tP06sjS94+lz4v9tunQ9uUcDFH3y8p8jvxk1CPanA3gD/K+8J1X/BeudHX/87vuQcVi3bMIoCa4dEEa6a5uG7k4n/MiBiELd2rGBqMO9tw3DdycT/mRBGumubhu5OJ/zH8s9UOYDqAkDSoIZqVchXy93+JdEIVtKPgHxjVT0NIx0HW1ZUEqbwhhZLpdp3tjMxF6j/gWqY8sHD8hx+KH5Aomo66GBgG1GFbHjH0dHj7j5rj+XxGX1+E+W31uJuk6wK93/zQ7n6hKP5yC2CK+yekY+kO1F4CYZqWqxW59StLWGjzcgGyPb7OUqFeNrBTPadqQUkKRycNPi4je5ubGEY8tFa6kdrHjtLmwg+HJ9//p30tJF7/Zi1KESPcttsMi9W3vbN0AKAk/44RAmoeNS8d719/ayjsJHmhhg7MIwEx874DroOKnzDDlE62f+6Gci+sy+Ppld1XlIu/vXat2i8kacfcM94ujA4Gjs4TzvUgWN3Lx1yj10lWCWgD/l+UKV9O4w6i+fLwA5LXWftvl2ojjkr0UCZfhj63jeCkyYHCIxLCWqmGwC1//Y1hpCO//O5T685aCD6KKco76Yp1pO8AiH+9znPNw1/tPuvWG4LAJqRKJDElgjasHsetA4r/FoMtu11z496fPekFM5HSiGreL/pSwS2arykXaf20TqECBXcUcmQKVtG/gvrpJ9RBkyFFz2fIDVCBew+GQ898g0avqraU+PKN1mew9gA03b+OGTiOaNKxqPInPIUmOIaCZ69aXyrsqI8HTBvBYHK/Mqh8dcUXjn0fT9IZSu9sBe6WZUlwQxKyRc8YVTvfeLNxuFFWYkdSHZNpN3LG52kk/R7voK4Xb3uB8gaiMNZmwHChWwIxdGOTIFn7epA8pF3FHGx16f+rvSOWAUbi0q6KlVLRyXRupEvUgeUuDie6MLmRDsR6Jy+CcnonJjCA8Bxm6iKvUpJqafePF94b/hIk9wWnoWIIpf4mbQrBuuLMrWy1bQPu7xek/5wix9JCCvgV30TKl+ufSyIPPpBUIwytSjMq13siF/fBYkTno9Z+0HCevfjP7m8eMHldOfZ5pEaUGpsBji6OZCN3PkBCY9JlmG4n0J3bQWW7L1sn9hoMPdvksKIOsusR1SdyPXDD+globA2jDiasHqmszEoDRHRsQpFB7itv6/FCE6TDI6UkmQY2atOQK3nAI96x2P3VnY/V8vRzJdE8spC9++/QaGw4sR7eBO+YXL20tFWfB0zJ06fkQY+KPJrQ3SqWpCYvCLAy7DAU5sES ься."},{"t":"p","h":"5. Бывает такая внутренняя уверенность в себе, когда человек может сделать всё. 6. Чтобы сделать что-нибудь великое, нужно все силы души устремить в одну точку."},{"t":"p","h":"Данные предложения называются сложноподчинёнными."},{"t":"p","h":"Задание 3."},{"t":"p","h":"Сахаров думал именно над такими вопросами, которые казались самыми тяжёлыми и мучительными для людей, для всего человечества. (Придаточное определительное.)"},{"t":"p","h":"Сахаров знал, что надо делать. (Придаточное изъяснительное. }"},{"t":"p","h":"Он находил пути для разрешения самых трагических проблем, проблем, которые казались неразрешимыми. (Придаточное определительное.) И адресовал свои труды правительствам, народам, всем, кому должно быть небезразлично будущее. (Придаточное определительное."},{"t":"p","h":"Задание 4,"},{"t":"p","h":"1. Сахаровым не приходило никаких вестей даже оттуда, откуда ранее присылали сообщения со специальным курьером. 2. Этот человек удивительной отваги появлялся там, где грозила опасность. 3. Когда позвонили и сообщили о том, что у кого-то идет очередной незаконный обыск, А. Д. Сахаров, не найдя машины, приехал на попутном автокране."},{"t":"p","h":"4. Герой – это такой человек, который в решительный момент делает то, что нужно в интересах человеческого общества."},{"t":"p","h":"Придаточные предложения присоединяются к указательным словам и конкретизируют их значение."},{"t":"v","l":["<span class=\"pg\" data-n=\"182\">182<\/span>Задание 5.","Текст относится к официально-деловому стилю.","","Задание 6."]},{"t":"p","h":"Рассказ об А. Д. Сахарове – повествование. В повествовании могут быть использованы сложноподчинённые предложения с разными видами придаточных."},{"t":"v","l":["Урок 2.","Задание 1."]},{"t":"p","h":"Отойти от края пропасти всемирной катастрофы, чтобы сохранить цивилизацию и саму жизнь на планете – настоятельная необходимость современного этапа мировой истории. (Придаточное цели.)"},{"t":"p","h":"Задание 2."},{"t":"p","h":"22 января 1980 года А. Д. Сахаров был задержан, затем без суда и следствия отправлен вместе с женой в город Горький (ныне Нижний Новгород), закрытый для иностранцев. Без специального разрешения к Сахаровым никого не допускали, Телефона в квартире не было. Всюду Сахаровых сопровождала милицейская охрана, следившая, чтобы они ни с кем не встречались."},{"t":"p","h":"Горьковский поэт Федор Сухов рассказывает, как одна приезжая знакомая студентка попросила показать дом, где живут Сахаровы. Они пришли во двор, в котором находился дом Сахаровых, и присели на скамеечке. Вскоре появились незнакомые мужчины, спросили, чего это здесь сидят, потом потребовали показать документы, затем попросили удалиться. Когда девушка вернулась в свой город, её исключили из института."},{"t":"p","h":"Задакие 3."},{"t":"p","h":"А 16-го в 3 часа позвонил М. С. Горбачев и сказал, что принято решение о моём освобождении, что я могу вернуться в Москву... Я ему сказал, что благодарен за это решение."},{"t":"p","h":"Вопрос корреспондента:"},{"t":"p","h":"– Андрей Дмитриевич, расскажите, как вы узнали о возможности вернуться в Москву."},{"t":"p","h":"<span class=\"pg\" data-n=\"183\">183<\/span>Задание 4."},{"t":"p","h":"На первом съезде народных депутатов я наблюдал, как А. Д. Сахаров терпеливо и упорно ждал свою очередь к микрофону. Его не пугали враждебные выкрики в его адрес. Сахарову не давали говорить. Так были настроены многие в зале. Они забыли, а большей частью не знали, что Сахаров был первым в нашей стране, кто осмелился подать свой голос против войны в Афганистане."},{"t":"v","l":["Урок 3.","Задание 1."]},{"t":"p","h":"[чтоб...] ], (когда...)"},{"t":"v","l":["3. [для того... так...]","","(чтобы...) (как будто)","","Задание 2."]},{"t":"p","h":"Хотя каждый в его песнях узнавал себя, но видел в них себя другим. (Придаточное уступительное, (хотя"},{"t":"p","h":"Слова песен были так метки и единственно верны, что безошибочно передавали суть и били прямо в цель. (Придаточное степени; [...так...], (что).) Душа просыпалась и обретала такую зоркость, которая позволяла различать недоступные прежде черты, цвета, оттенки. (Придаточное определительное с дополнительным значением степени; [такую...], (которая).) Обо всем он говорил по-своему и так, что это запоминалось на всю жизнь. (Придаточное образа действия; [так...], (что).)"},{"t":"p","h":"Задание 3."},{"t":"p","h":"И в этой жизни с такой нагрузкой, какую не мог бы выдержать нормальный человек, с ним была Марина. Они встретились в Эта встреча должна была произойти,"},{"t":"p","h":"<span class=\"pg\" data-n=\"184\">184<\/span>и она произошла. Любовь, что началась внезапно и крепла день ото дня, обогатила обоих. Когда Марины нет в Москве – телефонный роман с Парижем. Спустя несколько лет они поженились. Это была красивая, которая длилась много лет, духовная связь двух бесконечно талантливых людей."},{"t":"p","h":"Текст публицистического стиля."},{"t":"v","l":["Урок 4.","Задание 2."]},{"t":"p","h":"Село Чонташ – родина Суйменкула Чокморова. Сейчас здесь большое село, неподалеку – хорошо известная горная лыжная база. В Чонташе особенный воздух предгорья. Суйменкулу было радостно и грустно вдыхать его, потому что он настоян на памяти..."},{"t":"p","h":"Здесь ступала нога отца Чокмора, колхозного кузнеца, умельца, мастера на все руки, отличного всадника. Здесь провела свою жизнь мать, которая родила одиннадцать детей и каждому отдала частицу своего сердца. Отсюда ушел на войну старший брат Чолпонбай, ушёл и не вернулся... Здесь был председатель колхоза, строгий и добрый, как отец, здесь был первый учитель. Образы каждого из них оживут потом в работах Суйменкула – в актёрском исполнении или живописном воплощении."},{"t":"p","h":"Когда в Чонташе собиралась большая семья Чокморовых, для Суйменкула это был не просто семейный праздник, это был праздник вечного торжества жизни."},{"t":"p","h":"Суйменкул знал каждого, кто жил и работал в Чонташе. Он приезжал сюда, чтобы помочь односельчанам как сын села, как художник."},{"t":"p","h":"И втрудные минуты жизни он тоже приезжал в Чонташ, потому что село давало ему силу, веру в правду, вдохновение..."},{"t":"p","h":"Задание 3."},{"t":"p","h":"1. Суйменкул должен был ходить пешком каждый день километров десять, чтобы продолжать учебу. 2. Было решено отправить его к старшему брату Нарынбеку, который жил <span class=\"pg\" data-n=\"185\">185<\/span>недалеко от Фрунзе. 3. У брата мальчик стал жадно читать, так как в доме было много книг и журналов. 4. Накопилось много впечатлений, так как брата-офицера часто переводили на новое место службы. 5.Неожиданно пришла болезнь, которая приковала Суйменкула на долгие месяцы к постели."},{"t":"p","h":"6. Суставы рук и ног Суйменкула были больные до такой степени, что он мог оказаться в полной неподвижности."},{"t":"p","h":"Задание 4."},{"t":"p","h":"В дни болезни Суйменкула в дом братьев Чокморовых пришла детский врач. Она поверила, что сумеет вылечить мальчика. Для начала она предложила Суйменкулу каждый день проделывать сложный комплекс упражнений. Врач предупредила, что ему будет больно, надо терпеть, что только так он встанет на ноги."},{"t":"p","h":"Действительно, ему было так больно, что хотелось бросить эти упражнения, лечь и навсегда примириться с болезнью. Но усилием воли Суйменкул заставлял себя ещё и ещё раз повторять то или иное движение. Через несколько недель мальчик уже мог самостоятельно ходить по комнате, доктор сказала: “Теперь надо заняться спортом. Всерьез...”"},{"t":"p","h":"Суйменкул уходил на окраину города, чтобы делать там зарядку, бегать, прыгать, тренироваться с мячом. В результате болезнь отступила настолько, что Суйменкул сразу записался в две спортивные секции – прыжки в высоту и волейбол."},{"t":"v","l":["Задание 5.","1.[... ], (что ...). (Прид. образа действия.)","2. [... ], (что ...)? (Прид. изъяснительное.)"]},{"t":"p","h":"[... ],(если ...) —[... ]. (Трид. условия.)"},{"t":"p","h":"Урок 5."},{"t":"p","h":"Задание 1."},{"t":"p","h":"“Костер, зажжённый на вершине горы, не согреет тех, кто у её подножия”. (Придаточное изъяснительное.) И счастье наше, что живут среди нас те, кто разводит свой огонь <span class=\"pg\" data-n=\"186\">186<\/span>так, чтобы люди могли у него согреться... (Придаточные изъяснительное, определительное и образа действия.)"},{"t":"p","h":"Имя Валентина Ивановича Дикуля знакомо каждому, потому что о его полной драматизма судьбе и мужестве рассказывалось не раз. (Придаточное причины.) Напомним только о том, что после тяжелейшей травмы позвоночника воздушный гимнаст был полностью парализован. (Придаточное изъяснительное.) Его силовой номер “Пирамида”, в котором он поднимает три тонны, уникален. (Придаточное определительное.)"},{"t":"v","l":["Стиль речи – публицистический.","","Задание 2."]},{"t":"p","h":"[... ], (что...), (кто...), (чтобы...) ... Последовательное подчинение."},{"t":"p","h":"Задание 3."},{"t":"p","h":"Надежда, которую он дал больным, которую он поддерживает в них. (Однородное соподчинение.) Он высылает подробную методику занятий и чертежи станка-тренажера, которые разработаны им, так как без станка больному человеку не выздороветь. (Неоднородное соподчинение.)"},{"t":"p","h":"Задание 4."},{"t":"p","h":"1. Когда В. И. Дикуль был парализован (придаточное времени), ему становилось грустно от того, что теперь многое в его жизни изменится (иззяснительное), Что он теперь не сможет выступать на арене цирка (изъзяснительное), что теперь о нём забудут (изъзяснительное). 2.В центр В. И. Дикуля, куда стремились попасть многие больные (придаточное определительное) и где были кабинеты со станками-тренажерами (придаточное определительное), люди записывались за несколько месяцев вперед. 3. Когда Валентин Иванович начал беседу с восьмилетним мальчиком (придаточное времени), тот так смутился, что долго не мог ничего сказать (придаточное меры и степени). Теперь, когда закончилось лечение маленького Саши (придаточное времени), на душе В. Дикуля стало спокойно и он был <span class=\"pg\" data-n=\"187\">187<\/span>поражён смелостью малыша, который отчаянно борется со своей болезнью (придаточное определительное)."},{"t":"v","l":["Урок 6.","Задание 3."]},{"t":"p","h":"1. Когда в 1947 году мальчик попал в школу-интернат в г. Оше (придаточное времени), старший брат Турдубай, несмотря на семейные нужды, во всём помогал способному брату. 2. Во время школьных каникул заботливый Турдубай забирал брата к себе, где Тургунбай мог часами рисовать, где мог заниматься лепкой, резьбой по дереву и акварелью (придаточные места). 3. Когда в 1954 году Тургунбай закончил десятилетку (придаточное времени), он отправился во Фрунзе поступать в художественное училище, чтобы учиться на скульптора (придаточное цели). 4. С первой половины 50-х годов Садыков начал активно работать, так как он был полон любви к профессиональному искусству, желания познать тайны создания скульптуры (придаточное причины), ибо из всех видов искусства именно скульптура привлекла его (придаточное причины)."},{"t":"p","h":"Задание 4."},{"t":"p","h":"Когда я приехал в город, я узнал, что в художественном училище скульптурного отделения нет."},{"t":"p","h":"Забыв о том, что я пришел в Союз художников, чтобы посоветоваться, стал жадно разглядывать бюсты, статуи, композиции."},{"t":"p","h":"Задание 5."},{"t":"p","h":"Однако житейские трудности казались пустяками, потому что в мастерской Пузыревского меня ждала самостоятельная творческая работа."},{"t":"p","h":"<span class=\"pg\" data-n=\"188\">188<\/span>Я понял, что начала сбываться мечта, что я начал выходить на самостоятельный путь. Тогда врачи предложили лечиться пчелиным ядом, потому что поняли, что я не смогу переменить профессию. В городе это было невозможно, поэтому по совету старшего брата я отправился в ущелье Майлуу-Суу, в районе Арсланбоба, где меня приняли в семью охотника и пчеловода Курдуша. Когда после месяца лечения боль в суставах прошла, я принялся за портрет жены Курдуша."},{"t":"p","h":"Лепил из воска, потому что мне категорически запретили иметь дело с мокрой глиной."},{"t":"v","l":["Проверь себя.","","2. 1.6) – придаточное места.","2. в) – рассуждение.","3. План","1. Когда Дейнека начал рисовать?"]},{"t":"p","h":"2. Что он старался передать в своих картинах?"},{"t":"p","h":"3. Как он относился к учению?"},{"t":"p","h":"4. Что говорил Дейнека о работе художника?"},{"t":"p","h":"5. Что привлекало художника в человеке, в природе?"},{"t":"p","h":"ТЕМА 7."},{"t":"v","l":["Урок 1.","Задание 2."]},{"t":"p","h":"И вслед за французами весь мир повторяет: нет людей некрасивых – есть люди ленивые, Обидно, что часто мы понимаем это поздно: безжалостное время уже заберет у нас немало красоты и молодости. Они убедительно подтверждают тезис: все хотят быть красивыми, все должны быть красивыми, все могут быть красивыми."},{"t":"p","h":"Текст относится к публицистическому стилю."},{"t":"p","h":"<span class=\"pg\" data-n=\"189\">189<\/span>Задание 3."},{"t":"p","h":"Искусство красиво одеваться – вещь довольно сложная. Одни думают, что все зависит от природного вкуса, и если его нет, то нечего стараться: всё равно ничего не выйдет. Нельзя забывать о том, что в каждом в той или иной степени заложено врожденное чувство красоты. Только его надо обязательно подкрепить соответствующими знаниями – человек начинает сознательно отличать красивое от некрасивого, у него постепенно развивается эстетический вкус."},{"t":"p","h":"Другая категория людей уверена, что они одеваются всегда красиво и со вкусом: они всю свою жизнь пользуются одеждой и даже научились хорошо подбирать ее, были бы только деньги. Между тем, это – самая большая ошибка. Затрачивать много средств – еще не означает одеваться изящно и модно. На улицах, в учреждениях, театрах, парках можно сплошь и рядом встретить людей, одетых дорого, но при этом весьма дурно."},{"t":"p","h":"Значит, для того, чтобы быть одетым красиво, далеко не достаточно иметь только деньги. Искусство красивой одежды связано с общей культурой человека и, главным образом, с его художественной культурой."},{"t":"p","h":"Задание 4,"},{"t":"p","h":"Начались танцы, и я не могла оторвать глаз от нее: она двигалась грациозно, пластично. (Второе предложение указывает причину того, о чём говорится в первом предложении, можно поставить союз потому что.) Девушка объяснила мне: она хромая. (Второе предложение раскрывает, дополняет первое предложение, можно поставить слова а именно.) У неё от рождения одна нога короче другой, с детства носила она утолщенную подошву на одной туфле. (В предложении передаются одновременные действия, предложение соотносительно со сложносочиненным предложением.) Сколько труда было потрачено ею на освоение танцевальных движений, каких замечательных результатов она добилась! (В предложении передаются одновременные <span class=\"pg\" data-n=\"190\">190<\/span>действия, предложение соотносительно со сложносочинённым предложением.) Для неё это, конечно, был подлинный праздник победы своего упорства и воли – вот почему она была так взволнована. (Второе предложение заключает в себе результат, следствие того, о чем говорится в первом предложении.)"},{"t":"v","l":["Урок 2.","Задание 2."]},{"t":"h3","h":"Рождение молодёжной моды"},{"t":"p","h":"Все переменилось каких-нибудь 35—40 лет назад: именно тогда возникла молодёжная мода. – Всё переменилось каких-нибудь 35—40 лет назад, так как именно тогда возникла молодёжная мода."},{"t":"p","h":"Никаких традиционных, привычных костюмов: носить можно всё, что оказалось под руками и что можно купить по дешевке в лавке старьевщика, отыскать в старом забытом сундуке. – Никаких традиционных привычных костюмов, так что носить можно всё, что оказалось под руками и что можно купить по дешёвке в лавке старьевщика, отыскать в старом забытом сундуке."},{"t":"p","h":"Хиппи носили потёртые джинсы, сандалии на босу ногу, кожаные куртки с бахромой, они сами расписывали майки, плели веревочные украшения. – Хиппи носийи потёртые линялые джинсы, сандалии на босу ногу, кожаные куртки с бахромой, и они сами расписывали майки, плели веревочные украшения."},{"t":"p","h":"Но уже через несколько лет стали появляться обычные люди, одетые как хиппи: мода бунтарей была освоена коммерцией и превратилась в молодёжную моду. – Но уже через несколько лет стали появляться обычные люди, одетые как хиппи, потому что мода бунтарей была освоена коммерцией и превратилась в молодёжную моду."},{"t":"p","h":"<span class=\"pg\" data-n=\"191\">191<\/span>Задание 3."},{"t":"p","h":"1. У человека развит эстетический вкус, есть умение просто и элегантно одеваться – он сможет сделать одежду удобной и практичной, оценить моду, выразить в ней собственное “я”."},{"t":"p","h":"2. Современная мода предназначена для всех – характерной её чертой является массовость."},{"t":"p","h":"3. Наиболее активно воспринимает новую моду молодёжь – она является как бы “носителем моды”."},{"t":"p","h":"4. Не обязательно всем без исключения использовать экстравагантные предложения моды: сверхмодная одежда идет не каждому."},{"t":"v","l":["Урок 3.","Задание 1."]},{"t":"p","h":"В одежде прочно и наглядно слились два начала: духовное и материальное. (Двоеточие стоит перед однородными членами предложения, имеющими обобщающий член предложения “два начала”.)"},{"t":"p","h":"Народному отношению к одежде была характерна, прежде всего, удивительная бережливость – был сильнейший контраст между рабочей, повседневной и праздничной одеждой. (Второе предложение содержит вывод о том, о чём говорится в первом предложении.)"},{"t":"p","h":"Одежда и для девушки, и для парня много значила – из-за нее не спали ночами, зарабатывали деньги. (Второе предложение содержит вывод о том, о чём говорится в первом предложении.)"},{"t":"p","h":"Задание 2."},{"t":"p","h":"Ворот и рукав рубахи делались с мелкими складками, ворот вышивался, по подолу шли строчки и кружева."},{"t":"p","h":"Поверх рубахи женщина надевала шерстяной сарафан, его верхний край был выше груди, по талии сарафан обхватывался поясом, носили его и без пояса, особенно в тёплое время. Юбка отличалась от сарафана: она держалась на <span class=\"pg\" data-n=\"192\">192<\/span>поясе, для неё ткали особую узорную, часто шерстяную ткань."},{"t":"p","h":"По народным понятиям, птица несла радость, свет, добро; дерево символизировало вечно живую природу; конь выражал силу небесного светила."},{"t":"p","h":"В тексте употребляются бессоюзные сложные предложения, в них описываются черты (признаки) русского национального костюма, они помогают сделать высказывание-описание лаконичным, точным."},{"t":"p","h":"Задание 4."},{"t":"p","h":"1. Для русской моды характерны демократичность, народный дух, традиции – нам всегда будут нравиться сарафаны, рубахи, дубленки."},{"t":"p","h":"2. Русская народная одежда всегда привлекала моду мудростью и удивительной простотой, она постоянно на неё влияла."},{"t":"p","h":"3. Каждое десятилетие интерес к русской моде усиливается: за ним стоит неослабевающий интерес к познанию русского характера."},{"t":"p","h":"Задание 5."},{"t":"p","h":"Ощущение свежести создавала её одежда. На ней был голубой сарафан в горошину из чудесного, хотя и самого простого, дешёвого ситца. Его юбка была по-модному пышной. Он весь сверкал чистотой: накрахмален и отутюжен идеально. Белые недорогие, но изящные босоножки на загорелых ногах выглядели нарядными. Шёлковая косынка туго охватывала голову, она переливалась сиреневым, розовым, голубым."},{"t":"p","h":"Проверь себя."},{"t":"p","h":"<span class=\"pg\" data-n=\"193\">193<\/span>2. Тесты."},{"t":"img","src":"data:image/webp;base64,UklGRlgYAABXRUJQVlA4IEwYAABQkgCdASqAAg8BPrVWpUynJKurIhR8OXAWiWVtxKQ7Be96giXE8DkzXPfIZAj3/V65uqc0doI9uqKtZsr/464jpYb8QxRszrfI+mb/VYknp1nRi+m7kb+Sn2f+L5vfWHif+7v8Hjl+MOoX7N4G+xvoBd9+/01R/af7ZrXh1j+/87imgIPcG6aPqfMZG12ff2/iBtTvy7JOf2/iBxU2gTK+PXz8gcq2+mS7ynKedf4gcVNg4vYjON/XBzMzPyudZUqA4q2BNz2zbQs7ZwNn2f/ZDAhbYvlU570CgbJCyoGxRpqDKnG1bTgXY3eGu7R2jbWc1F8fXrIR+LHepsBs+SpngRH7IL7WU+flDYM9AjYFf/2g2hXWV0XzzzhJdTYo6TirTaCPh5QjhZG/+j4jqeFwE+P+iOXNCwujUB+ehy8we+jM69QkKu/vztZbIZvl1wI26IiQs15AYnYshXCcQpGpKGBljQgouDwBRewkADXMM исит от того, как относиться к жизни в свои пятнадцать-семнадцать лет: чувствовать себя ничего не знающим, посторонним во многих делах? Или с размаху, как в недавней игре, кидаться туда, где что-то не получается, где нужна твоя уверенная помощь, надёжное плечо, крепкие руки?"},{"t":"p","h":"Если никогда ни во что не вмешиваться, в сто раз легче будет жить. Но только неинтересно. Сразу тебе все чужими станут, и ты всем чужой. Лес горит – пускай. Мостик через канаву сломался – нам какое дело? Мальчишка на улице ревет – пройдем мимо..."},{"t":"p","h":"Тип текста – рассуждение."}],"sub":[{"title":"Ключи","b":67},{"title":"Рождение молодёжной моды","b":339}],"section":"КАКИМ БЫТ!","pages":[156,193]},{"title":"СПРАВОЧНЫЕ МАТЕРИАЛЫ * СИНТАКСИС","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"194\">194<\/span>СПРАВОЧНЫЕ МАТЕРИАЛЫ * СИНТАКСИС"},{"t":"p","h":"Синтаксис – раздел науки о языке, который изучает словосочетание, предложение, сложное синтаксическое целое."},{"t":"p","h":"Предложение – наименьшая единица общения. При помощи предложения мы выражаем свои мысли и чувства, обращаемся друг к другу с вопросами, советами, просьбами, приказаниями."},{"t":"p","h":"Все слова в предложении связаны между собой. Главные члены (подлежащее и сказуемое) составляют грамматическую основу предложения. Остальные члены предложения являются второстепенными."},{"t":"p","h":"Предложения бывают простые и сложные. Сложное предложение состоит из двух или нескольких простых предложений. Сложное предложение, как и простое, представляет собой единое целое. Предложения, которые входят в его состав, связаны друг с другом по смыслу и интонацией."},{"t":"p","h":"Сложное синтаксическое целое – это группа предложений, связанных по смыслу и синтаксически."},{"t":"h3","h":"СЛОВОСОЧЕТАНИЕ"},{"t":"p","h":"Словосочетание – это два или несколько самостоятельных слов, Что такое"},{"t":"p","h":"связанных друг с другфм по смыслу словосочетание?"},{"t":"p","h":"и грамматически. Например: родная страна, мирный труд, думать о жизни, очень интересный."},{"t":"p","h":"В словосочетании одно слово – главное, а другое – зависимое."},{"t":"p","h":"* Справочные материалы составлены по: Баранов М.Т. и др. Русский язык: справочник для учащихся/Под ред. Н. М. Шанского. – М.: Просвещение, 1984; Войлова К. А. и др. Справочник школьника: Русский язык. 5-11 классы / Под ред. П. А. Леканта. – М.: Дрофа, 1998; Касаткин Л. Л. и др. Краткий справочник по современному русскому языку/Под ред. П. А. Леканта. – М.: Высшая школа, 1995,"},{"t":"p","h":"<span class=\"pg\" data-n=\"195\">195<\/span>В зависимости от того, к какой части речи принадлежит главное слово, выделяют следующие типы словосочетаний:"},{"t":"p","h":"1. Именные:"},{"t":"p","h":"а) с именем существительным (план сочинения, вход в школу);"},{"t":"p","h":"6) с именем прилагательным (упорный в учебе);"},{"t":"p","h":"в) с именем числительным (второй от конца)."},{"t":"p","h":"2. Глагольные (составить план, стоять у доски, предложить выучить, читать вслух)."},{"t":"p","h":"3. Местоименные (кто-то из учеников, каждый из нас)."},{"t":"p","h":"4. Наречные (крайне важно, вдали от дороги). Словосочетания строятся на основе подчинительной связи между Как связываются"},{"t":"v","l":["словами.","слова в"]},{"t":"p","h":"В русском языке сущестсловосочетании?"},{"t":"p","h":"вует три типа подчинительной связи: согласование, управление, примыкание."},{"t":"p","h":"Согласование – такой способ связи, при котором зависимое слово ставится в тех же формах, что и главное, например, новая книга (согласование в ед. ч., ж. р. и И. п.)."},{"t":"p","h":"При согласовании с изменением форм главного слова соответственно изменяются и формы зависимого слова, например: новой книги (согласование в ед. ч., ж. р. иР.п.), новыми книгами (согласование во мн. ч. и Т. п.)."},{"t":"p","h":"Управление – такой способ связи, при котором зависимое слово (существительное или другие части речи, употребляемые в значении существительного) ставится при главном слове в определенном падеже, например: читать (что?) книгу (В. п.), заботиться (о ком?) о людях (П. п.), любовь (к чему?) к труду (Д. п.)"},{"t":"p","h":"Примыкание – подчинительная связь, при которой зависимое слово (наречие, инфинитив, деепричастие) связывается с главным только по смыслу, например: ехать (как?) быстро (наречие); желание (какое?) работать (инфинитив); беседовать (каким образом?) сидя (деепричастие)."},{"t":"p","h":"<span class=\"pg\" data-n=\"196\">196<\/span>Словосочетания по структуре бывают простыми и сложными."},{"t":"p","h":"Простые словосочетания словосочетания, состоящие из 2-х и более знаменательных слов (новый учебник, писать сочинение). Это слово, распространенное другим словом."},{"t":"p","h":"Сложные словосочетания – это словосочетания, в которых слово распространяется целым словосочетанием: (писать (что?) сочинение по литературе; холмистые берега (какие?) с изумрудными полями пшеницы)."},{"t":"p","h":"В зависимости от синтакси- Что обозначают ческих отношений между словами словосочетания?"},{"t":"p","h":"в словосочетаниях выделяют следующие типы значений:"},{"t":"p","h":"1. Определительные. В определительных словосочетаниях главные слова обозначают предметы, а зависимые – признаки этих предметов:"},{"t":"p","h":"поле (какое?) зеленое школа (чья?) наша"},{"t":"p","h":"2. Объектные. В объектных словосочетаниях главные слова обозначают действие и состояние, а зависимые – предметы (объекты):"},{"t":"v","l":["смотреть (что?) кинофильм","","мечтать (о чем? о счастье"]},{"t":"p","h":"3. Обстоятельственные. В обстоятельственных словосочетаниях зависимые слова обозначают время, место, цель, причину, качество, образ, способ, степень и меру действия и др.:"},{"t":"p","h":"писать (как?) грамотно"},{"t":"p","h":"<span class=\"pg\" data-n=\"197\">197<\/span>приехать (когда?) вечером"},{"t":"p","h":"вернуться (откуда?) из школы"}],"sub":[{"title":"СЛОВОСОЧЕТАНИЕ","b":6}],"section":"КАКИМ БЫТ!","pages":[194,197]},{"title":"ПРОСТОЕ ПРЕДЛОЖЕНИЕ","blocks":[{"t":"h3","h":"ПРОСТОЕ ПРЕДЛОЖЕНИЕ"},{"t":"p","h":"Предложение – синтак-"},{"t":"raw","h":"<h4 class=\"mk\">Какие выделяют виды предложений по цели высказывания?<\/h4>"},{"t":"p","h":"сическая единица, обладающая смысловой и интонационной завер-"},{"t":"v","l":["шенностью.","Предложение может выражать:","а) сообщение,","6) вопрос,","в) побуждение."]},{"t":"p","h":"В зависимости от этого предложения бывают: повествовательные, вопросительные, побудительные."},{"t":"p","h":"В повествовательных предложениях сообщается о каком-либо событии, факте: Другой берег реки, низкий и ровный, тянулся куда-то вдаль к зеленым стенам леса. (М. Горький)"},{"t":"p","h":"В устной речи в повествовательном предложении голос повышается в начале или середине предложения на одном из его членов (см. с. 198 – “Как выделить важную для понимания информацию?”) и понижается к концу предложения. Это повествовательная интонация."},{"t":"p","h":"Вопросительные предложения выражают вопрос: Что же ты, моя старушка, приумолкла у окна? (А. Пушкин) Вопрос часто бывает заключен в вопросительных местоимениях, наречиях, частицах: Кто (местоимение) при звездах и при луне так поздно едет на коне? (А. Пушкин) Отчего (наречие) ты печально, вечернее небо? (И. Бунин) Знаете ли (частица) вы украинскую ночь? (Н. Гоголь)"},{"t":"p","h":"<span class=\"pg\" data-n=\"198\">198<\/span>Среди вопросительных предложений выделяются риторические вопросы. Они не требуют ответа. Например: О Волга! Колыбель моя! Любил ли кто тебя, как я? (Н.Некрасов)"},{"t":"p","h":"Вопросительные предложения произносятся с вопросительной интонацией – усилением голоса на вопросительном слове и понижением к концу предложения."},{"t":"p","h":"В побудительных предложениях выражаются различные побуждения к действию: приказ, просьба, призыв, совет и др.: Не перебивайте говорящего, дослушайте фразу до конца. – Приказ. Скользя по утреннему снегу, друг милый, предадимся бегу нетерпеливого коня. (А. Пушкин) – Приглашение, просьба. Бойся больше всего равнодушия. (С.Смирнов) – Совет."},{"t":"p","h":"Побудительные предложения, выражающие приказ, произносятся с усилением голоса."},{"t":"p","h":"Побудительные предложения, выражающие совет, просьбу, предложение, призыв, произносятся с понижением голоса. В конце побудительных предложений ставится точка."},{"t":"p","h":"Сообщать о чем-либо, спрашивать, побуждать к действию можно, одновременно выражая чувства: радость, печаль, удивление, восторг, страх. В этом случае повествовательные, вопросительные и побудительные предложения становятся по интонации восклицательными: Мы были в лесу! Кто взял книгу?! Прочитай текст!"},{"t":"p","h":"Восклицательные предложения произносятся повышенным тоном."},{"t":"p","h":"В конце повествовательно-восклицательных и побудительно-восклицательных предложений ставится восклицательный знак, а в конце вопросительно-восклицательных предложений – вопросительный и восклицательный знаки. Слова, особенно важные для Как выделить понимания смысла предложения, важную для пони- | выделяются голосом, особым ударемания информацию? | нием. Такое ударение называется логическим."},{"t":"p","h":"<span class=\"pg\" data-n=\"199\">199<\/span>Ты учишься в школе. (В школе, а не в лицее.) Ты учишься в школе. (Ты, а не он, не я.) Ты учишься в школе. (Учишься, а не преподаешь.) Если логическое ударение падает на слово, стоящее в начале предложения или в середине него, то интонация напряженная, а само логическое ударение сильное. Если логическое ударение падает на слово, стоящее в конце предложения, то интонация всего предложения спокойная, а само логическое ударение слабое. Слова, на которые падает логическое ударение, составляют смысловой центр предложения."}],"sub":[],"section":"КАКИМ БЫТ!","pages":[198,199]},{"title":"ДВУСОСТАВНОЕ ПРЕДЛОЖЕНИЕ","blocks":[{"t":"h3","h":"ДВУСОСТАВНОЕ ПРЕДЛОЖЕНИЕ"},{"t":"p","h":"Двусоставное предложение – это предложение с двумя главными членами – подлежащим и сказуемым: Из малого складывается большое. Дремлет Красная площадь. Солнце Родины светит над нами."},{"t":"p","h":"Двусоставное предложение, состоящее только из подлежащего и сказуемого, называется нераспространенным: Солнце взошло."},{"t":"p","h":"Двусоставное предложение, в котором наряду с главными членами (подлежащим и сказуемым) имеются второстепенные члены, называется распространенным. Например: Огромное красное солнце медленно взошло из-за леса (второстепенные члены: определения – огромное, красное относятся к подлежащему солнце; обстоятельства – медленно, из-за леса – относятся к сказуемому взошло)."},{"t":"p","h":"Подлежащее – это глав-"},{"t":"raw","h":"<h4 class=\"mk\">Чем может быть выражено подлежащее в русском языке?<\/h4>"},{"t":"p","h":"ный член предложения, который связан со сказуемым и отвечает на вопросы именительного падежа кто? или что?. Например: Установилась (что?) хорошая погода. (М. Горький) <span class=\"pg\" data-n=\"200\">200<\/span>Способы выражения подлежащего"},{"t":"p","h":"1. Имя существительное Метель (сущ.) надвинулась сразу. (Н. Островв именительном падеже ский) Собравшиеся (прич.) обсуждали по- (или другая часть"},{"t":"v","l":["речи, употребленная","в значении имени","существительного)","","2. Местоимение в","именительном падеже","","3. Неопределённая","форма глагола","","5. Составное цельное","наименование","6. Синтаксически","вестку дня. Девять (числ.) делится на три.","Трое (числ.) незаметно проскользнули во","двор. Громкое “ура” (междом.) прокатилось","над площадью.","","Я ехал вечером один на беговых дрожках.","(И. Тургенев) Каждый отправился в комнату,","ему назначенную. (А. Пушкин) Никто из","родных не спал в эту ночь. (А. Фадеев)","Охранять природу – значит охранять","Родину. (К. Паустовский)"]},{"t":"p","h":"Широкой полосой, от края до края, протя-"},{"t":"v","l":["нулся Млечный Путь. (В. Арсеньев)","Мы с бабушкой уходили тихонько к себе на","цельное словосочетание | чердак. (М. Горький)"]},{"t":"raw","h":"<h4 class=\"mk\">Чем может быть выражено сказуемое в русском языке?<\/h4>"},{"t":"p","h":"Сказуемое – это главный член предложения, который обычно связан с подлежащим и отвечает на вопросы что делает он? что он такое? кто он такой? и др."},{"t":"v","l":["Например: Вот и солнце (что делает?) встает, из-за пашен","(что делает?) блестит. (И. Никитин) Ночь ам какова?)","была свежа. (М. Горький)","Сказуемое, выраженное одним глаголом в форме","какого-либо наклонения, называется простым глагольным","сказуемым."]},{"t":"p","h":"В простом глагольном сказуемом лексическое и грамматическое значения выражаются одним словом: За окном вагона плыла кочковатая равнина, бежали кустарники..."},{"t":"p","h":"(А. Толстой) Сказуемое выражает характер движения (лексическое значение): плыла (медленно передвигалась, как на воде), бежали (стремительно исчезали); в то же время глаголы <span class=\"pg\" data-n=\"201\">201<\/span>указывают на реальное действие, которое было в прошлом (грамматическое значение)."},{"t":"p","h":"Сказуемое, в котором лексическое и грамматическое значения выражаются в разных словах, называется составным. Например: Роса была холодная. (К. Паустовский) Составное сказуемое была холодная состоит из двух слов, одно из которых (холодная) выражает лексическое значение сказуемого, а другое (была) – его грамматическое значение."},{"t":"p","h":"Составное сказуемое бывает глагольным и именным."},{"t":"p","h":"Составным глагольным называется сказуемое, которое состоит из вспомогательного глагола, выражающего грамматическое значение сказуемого, и неопределенной формы глагола, выражающей его основное лексическое значение. Например: На темном небе начинали мигать звезды. (М. Лермонтов) – Составное глагольное сказуемое состоит из вспомогательного глагола начинали и неопределённой формы глагола мигать."},{"t":"p","h":"Кроме грамматических значений наклонения, времени, вспомогательные глаголы выражают значения начала, конца, продолжительности действия, его желательности или возможности:"},{"t":"p","h":"Вспомогательные"},{"t":"h3","h":"глаголы"},{"t":"v","l":["1. Начало,","продолжение | „ и конец принимать, приняться,","действия","перестать,","кончать – кончить","","мочь – смочь,","уметь – суметь,","хотеть – захотеть,","решать – решить,","собираться – собраться,","стараться – постараться","Примеры"]},{"t":"p","h":"Тут силой всей народ ту-"},{"t":"v","l":["шить пожар принялся.","(И. Крылов) Мы продолжали молча","идти друг подле друга. (М. Лермонтов)"]},{"t":"h3","h":"Хотел объехать белый"},{"t":"v","l":["свет и не объехал сотой","доли. (А. Грибоедов)","Он старался казаться","молодым. (М. Лермонтов)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"202\">202<\/span>1. Если подлежащее выражено Как согласуется личным местоимением, глагольное глагольное сказуемое сказуемое в настоящем и будущем с подлежащим?"},{"t":"p","h":"времени согласуется с ним в лице и числе, а в прошедшем времени в роде и числе: Десять дней подряд он лечит (3 л., ед. ч.) несчастных зверят. (К. Чуковский) Он упал (ед. ч., м. р.) из гнезда.. и сидел (ед. ч., м. р.) неподвижно... (И. Тургенев)"},{"t":"p","h":"2. Если подлежащее выражено существительным, то глагольное сказуемое в настоящем и будущем времени выражается формами 3 лица единственного числа или 3 лица множественного числа, в прошедшем времени согласуется с подлежащим в роде: Детство и память о дружбе затмевались (3 л., ед. ч.) мелочами новой жизни. (Л. Леонов) И твердо верит (3 л., ед. ч.) вся земля в наш светлый путь. (Л. Ошанин)"},{"t":"p","h":"3. Если подлежащее выражается вопросительным местоимением кто, сказуемое выступает в форме мужского рода, независимо от лица женского или мужского рода: Кто из девочек вчера дежурил (м. р.) в классе?"},{"t":"p","h":"4. Если подлежащее выражается количественно-именным сочетанием или сочетанием существительного с количественным значением и существительным в родительном падеже, то сказуемое может выступать в формах единственного или множественного числа."},{"t":"p","h":"Форма единственного числа используется, если:"},{"t":"p","h":"1) зависимое существительное в количественно-именном сочетании обозначает неодушевлённый предмет: Несколько пуль провизжало (ед. ч.) над моей головой. (М. Лермонтов);"},{"t":"p","h":"2) в состав подлежащего входят слова много, толпа, мало, лавина, уйма и т.д.: В буфете было (ед. ч.) много знакомых из соседних областей. (П. Проскурин) Толпа мужиков и дворовых шла (ед. ч.) по лугу... (Л. Толстой);"},{"t":"p","h":"3) количественно-именное сочетание обозначает отрезок времени: Прошло (ед. ч.) несколько тревожных <span class=\"pg\" data-n=\"203\">203<\/span>дней. (В. Короленно) Так прошло (ед. ч.) часа два с половиной. (Д. Фурманов);"},{"t":"p","h":"4) количественно-именное сочетание обозначает приблизительное количество: На собрании присутствовало (ед. ч.) человек сорок. До Тучачева оставалось верст с десяток. (Д. Фурманов);"},{"t":"p","h":"5) сказуемое выражается глаголом со значением “бытия, существования, наличия чего-либо”: В комнате было два окна с широкими подоконниками. (В. Каверин)"},{"t":"p","h":"Форма множественного числа сказуемого используется в том случае, если подлежащее выражается сочетанием существительного в именительном падеже с существительным в творительном падеже с предлогом с: Прохор с Григорием запрягали лошадей. (М. Шолохов)"},{"t":"p","h":"Если подлежащее выражается сложносокращенным словом, форма сказуемого соответствует форме главного слова в этом сложносокращённом слове: ГАИ провела (ед. ч., ж. р.) месячник по безопасности движения (главное слово – инспекция)."},{"t":"p","h":"Исключение составляют сложносокращенные слова, которые изменяются по падежам: МИД Кыргызстана провел (ед. ч., м. р.) переговоры с представителями деловых кругов Китая (хотя главное слово – министерство – с.р.)."},{"t":"p","h":"Составное именное сказуемое состоит из глагола-связки и именной части. Глагол-связка указывает на лицо, число, время, наклонение. Именная часть выражает лексическое значение: Час был не слишком поздний, но город, казалось, спал. (А. Толстой) Составное именное сказуемое был поздний состоит из глагола-связки был и имени прилагательного поздний."},{"t":"p","h":"1) Если сказуемое выражается Как согласуется именем прилагательным, порядковым именное сказуемое числительным, местоименным прис подлежащим?"},{"t":"p","h":"лагательным, причастием, то оно приобретает форму рода и числа <span class=\"pg\" data-n=\"204\">204<\/span>подлежащего: Великий человек лишь громок на делах. (И. Крылов) 2) Связка в именном сказуемом соответствует форме подлежащего: Лизавета Ивановна была пренесчастное создание. (А. Пушкин) Между подлежащим и сказуе- В каких случаях мым при отсутствии глагола-связставится тире при"},{"t":"p","h":"ки ставится тире в следующих составном именном"},{"t":"v","l":["случаях:","сказуемом?"]},{"t":"p","h":"1. Если оба главных члена выражены существительными, инфинитивами, количественными числительными:"},{"t":"p","h":"Книга – источник человеческих знаний, а следовательно, и источник силы человека! (М. Исаковский)"},{"t":"v","l":["Учиться – ум точить. (Пословица)","Трижды три – девять."]},{"t":"p","h":"2. Если один главный член выражен инфинитивом, а другой именем существительным в именительном падеже: Наша задача – хорошо учиться."},{"t":"p","h":"Да, бродить по лесу с ружьём в это время – редкое и единственное удовольствие. (Д. Мамин-Сибиряк) 3. Если перед сказуемым стоят слова это, вот, значит, это значит:"},{"t":"p","h":"Книга -это духовное завещание одного поколения другому. (А. Герцен) Мелкий осенний дождь -вот сущее бедствие для рыболова."},{"t":"p","h":"Найти верный глагол для фразы – это значит дать движение фразе. (А. Толстой)"},{"t":"h3","h":"<span class=\"pg\" data-n=\"205\">205<\/span>Алгоритм постановки тире"},{"t":"p","h":"между подлежащим и сказуемым ы"},{"t":"p","h":"1. Выражено ли сказуемое существительным в именительном падеже (без связки) или неопределённой формой глагола (при подлежащем – существительном в именительном падеже)?"},{"t":"img","src":"data:image/webp;base64,UklGRvYFAABXRUJQVlA4IOoFAACQKgCdASr0AUUAPrVUp02nJKgpJXE6OSAWiWduUP9 {"t":"v","l":["Ставится тире","(тире не ставится,","если сказуемое","присоединяется союзом","как или при нем","имеется частица не)","2. Выражено ли сказуемое","существительным в","именительном падеже или","неопределённой формой","глагола (при подлежащем —","неопределённой форме глагола)?","Да","Ставится","тире","Нет","","Тире","не ставится"]},{"t":"p","h":"Сложное сказуемое – это сказуемое, состоящее из 3-х и более слов. В нем сочетаются признаки глагольного и составного именного сказуемого: Волга должна была быть похожа на Неву, но только гораздо больше. (К. Федин) Человек должен быть гражданином прежде всего. (М.Горький) Давыдов не склонен был веселиться. (М. Шолохов)"},{"t":"p","h":"Второстепенные члены предложения. Кроме главных членов в предложении могут быть члены, которые зависят от главных. Это второстепенные члены. Они отвечают на вопросы косвенных падежей существительного, на вопросы прилагательного, наречия (определение, дополнение, обстоятельство)."},{"t":"p","h":"Алгоритмы в справочных материалах приводятся по кн.: Брусенская Л.А., Гаврилова Г.Ф. Сборник диктантов по орфографии и пунктуации, Ростов-на-Дону: Феникс, 1996."},{"t":"p","h":"<span class=\"pg\" data-n=\"206\">206<\/span>Определение – это второ-"},{"t":"raw","h":"<h4 class=\"mk\">Чем может быть выражено определение?<\/h4>"},{"t":"p","h":"степенный член предложения, который обозначает признак предмета и отвечает на вопросы какой? который? чей?: Первый день я провел очень скучно. (М. Лермонтов)"},{"t":"v","l":["Определения бывают согласованные и несогласованные.","Согласованные определения выражаются такими частями","речи, которые уподобляются определяемому слову в","формах числа и падежа, а в единственном числе – и в","роде. Несогласованные определения присоединяются к","определяемому слову по способу управления или примыкания:"]},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Определения | Способ выражения<\/td><td>Примеры<\/td><\/tr><tr><td>1. Согласо-<\/td><td>1. Имя<\/td><td>| Здесь вижу двух озер лезурные |<\/td><\/tr><tr><td>ванные<\/td><td>прилагательное<\/td><td>равнины. (А. Пушкин)<\/td><\/tr><\/table><\/div>"},{"t":"v","l":["2. Местоимение, ко- Вижу твой жребий на светлом","торое изменяется как | челе. (А. Пушкин)","прилагательное","3. Порядковое числи- | Второй урок по словесности"]},{"t":"raw","h":"<h4 class=\"mk\">тельное 4. Причастие<\/h4>"},{"t":"v","l":["был в пятом классе. (А. Чехов)","Побледневшее небо опять","стало синеть. (И. Тургенев)"]},{"t":"raw","h":"<h4 class=\"mk\">2. Несогласованные: а) по способу управления 6) по способу примыкания<\/h4>"},{"t":"v","l":["1. Имя существитель- | А волны моря с печальным","ное или местоимение | ревом о камень бились.","(М. Горький)"]},{"t":"p","h":"Утренние её занятия уже кон-"},{"t":"v","l":["чились. (А. Пушки","1. Сравнительная","Ткачихи помоложе протирали","степень прилагатель- | мелом стеклянные крыши."]},{"t":"raw","h":"<h4 class=\"mk\">ного 2. Наречие 3. Инфинитив 4. Неразложимое сочетание<\/h4>"},{"t":"v","l":["(Б. Полевой)","Вместе с чаем подали нам","яйца всмятку .... (И. Тургенев)","Алексей выработал привычку","спать после обеда. (Б. Полевой)","Молодая женщина с девочкой","лет семи сошла с парохода","поздней ночью. (К. Паустовский)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"207\">207<\/span>Приложение – это опре- Чем может"},{"t":"p","h":"деление, выраженное именем субыть выражено"},{"t":"p","h":"приложение? ществительным, которое согласуется"},{"t":"p","h":"с определяемым словом в падеже. Приложение дает определяемому предмету другое название: На берегу – береза-свечка в лунных перьях серебра."},{"t":"p","h":"В сочетании 2-х нарицательных существительных приложением является:"},{"t":"p","h":"1) слово, характеризующее лицо по профессии, национальности, возрасту, степени родства и т. д. Например: Скворецотец, скворчиха-мать и молодые скворушки сидели как-то вечерком и оправляли перышки. (В. Инбер); Два старикаконюха без дела бродили по опустевшему двору. (М. Бубенков);"},{"t":"p","h":"2) слово, обозначающее видовое название: Люди разместились в десяти грузовиках-фургонах. (В. Ажаев);"},{"t":"p","h":"3) слово с качественным, оценочным значением: Ширину реки-царицы не представишь ты вовек! (А. Безыменский)."},{"t":"p","h":"В сочетании имени собственного с нарицательным приложением является имя нарицательное: Художник Комаров рисовал этого лося. (В. Песков)"},{"t":"p","h":"Приложением является название литературного произведения, органа печати, предприятия и т. д.: На основе романа Л. Леонова “Русский лес” театр поставил спектакль “Приглашение к жизни”."},{"t":"p","h":"Приложением являются географические названия: Город Санкт-Петербург – второй промышленный центр России."},{"t":"p","h":"Приложение и определяемое слово пишутся через дефис, если:"},{"t":"p","h":"1) выражены нарицательными существительными: городгерой, женщина-космонавт, утес-великан;"},{"t":"p","h":"2) приложение выражено собственным именем и стоит перед определяемым словом: Москва-река, Волга-матушка."},{"t":"p","h":"<span class=\"pg\" data-n=\"208\">208<\/span>Дополнение – это второсте- Чем может"},{"t":"p","h":"пенный член предложения, обозна-"},{"t":"raw","h":"<h4 class=\"mk\">быть выражено дополнение? Способ выра- 1. Имя существи-<\/h4>"},{"t":"p","h":"чающий предмет, на который пере-"},{"t":"v","l":["ходит действие или по отношению к","которому совершается действие либо","проявляется признак:","","Герасим снова взялся за","(3а ЧТО?) За | ложку и продолжал хлебать","щи. (И. Тургенев)","","Десять делится на пять..","ное на пять"]}],"sub":[{"title":"Хотел объехать белый","b":25},{"title":"Алгоритм постановки тире","b":53}],"section":"КАКИМ БЫТ!","pages":[200,208]},{"title":"ар Завтра не будет похоже на сегодня.","blocks":[{"t":"h2","h":"ар Завтра не будет похоже на сегодня."},{"t":"v","l":["существительного) | сегодня","5. Неопределенная | прошу (о чем?)","форма глагола","говорить"]},{"t":"p","h":"6. Имя прилага- Я прошу вас говорить по существу дела."},{"t":"raw","h":"<h4 class=\"mk\">тельное (в значении имени суествительного<\/h4>"},{"t":"v","l":["вспоминали (о","Все вспоминали о прошлом.","чем?) о прошлом"]},{"t":"p","h":"Дополнения бывают прямыми и косвенными. Если дополнение выражено формой винительного падежа без предлога и относится к глаголу, то это дополнение прямое: Буря сломала осину."},{"t":"p","h":"Если сказуемое имеет при себе существительное в винительном падеже и отрицательную частицу не, то прямое дополнение выражается формой родительного падежа без предлога: Не пой, красавица, при мне ты песен Грузии печальной. (А. Пушкин)"},{"t":"p","h":"Прямое дополнение выражается формой родительного падежа без предлога, если действие глагола переходит на часть предмета: Налить стакан чая. Я тебе домой из лесу свежих орехов принес... (А. Гайдар)"},{"t":"p","h":"Косвенное дополнение – это дополнение, выраженное формами косвенных падежей с предлогами и без них и формой винительного падежа с предлогом: Наташа <span class=\"pg\" data-n=\"209\">209<\/span>подошла к матери. (Л. Толстой) Герасим снова взялся за ложку... (И. Тургенев) Обстоятельство – это второ-"},{"t":"v","l":["Чем может","степенный член предложения, который","быть выражено","обозначает признак действия и поясняет","обстоятельство?","сказуемое. В русском языке можно"]},{"t":"p","h":"выделить обстоятельства места, времени, образа действия, меры и степени, причины, цели, условия, уступки:"},{"t":"p","h":"наречие, сущест-"},{"t":"p","h":"?) спокойно, споро, вительное в косвенных падежах, деепричастие и деепричастный"},{"t":"p","h":"наречие, сущест- 2. Места | вительное в косвенных падежах"},{"t":"p","h":"наречие, сущест- 3. Вре- вительное в косвенных падежах, мени деепричастный оборот наречие, существительное в косвенных падежах,"},{"t":"p","h":"наречие, существительное в косвенных падежах, форма глагола неопределённая существительное в косвенных падежах, деепричастный оборот молчаливо. (А.Фадеев) (Как?) И цепляясь за порог, заходил в любую хату (А.Твардовский) Давыдов (как?) с любопытством оглядывал дом. (М.Шолохов)"},{"t":"p","h":"(Где?) Впереди виднелся лес. Мы остановились (где?) перед воротами. (И.Тургенев)"},{"t":"p","h":"Три девицы под окном пряли (когда?) поздно вечерком. (А. Пушкин) (Когда?) К вечеру луг опять позеленел. (М. Пришвин) Лягушка на лугу, (когда?) увидевши вола, задумала в дородстве с ним сравняться. (И. Крылов)"},{"t":"p","h":"Он сделал ошибку (почему?) сгоряча. (Отчего?) От радости девочка запрыгала на месте. (Почему?) Утомившись в дороге, я крепко заснул."},{"t":"p","h":"Здесь будет город заложён (зачем?) назло надменному соседу. (А. Пушкин) В Тайсанауре остановился я (для чего?) для перемены лошадей. (А. Пушкин) Душно стало в сакле, и я вышел на воздух (зачем?) освежиться. (М. Лермонтов) (При каком условии?) При сильной засухе урожай может погибнуть. (При каком условии?) Имея плащ, я мог бы ловить рыбу под дождем."},{"t":"p","h":"(Вопреки чему?) Вопреки предсказанию моего спутника, погода прояснилась и обещала нам тихое утро. (М. Лермонтов) <span class=\"pg\" data-n=\"210\">210<\/span>Порядок слов в предложе-"},{"t":"raw","h":"<h4 class=\"mk\">Каков порядок слов в русском предложении?<\/h4>"},{"t":"p","h":"нии —это взаимное расположение членов предложения, которое определяется грамматическими и смысловыми задачами. Есть обычное расположение (норма) и необычное (инверсия). Грамматически нормальным является расположение:"},{"t":"p","h":"а) подлежащего перед сказуемым; 6) согласованного определения перед определяемым, а несогласованного – после;"},{"t":"p","h":"в) дополнения после сказуемого. Место обстоятельств не закреплено, однако этот член состава сказуемого обычно располагается рядом с ним. Например: Редкие холмы с колеями дороги пропадали в тумане. (А. Толстой) – предложение с грамматически нормальным расположением слов."},{"t":"p","h":"Инверсия – это отклонение от обычного порядка слов. Она вызывается двумя причинами: а) смысловым членением, когда на первое место ставятся слова с известным смыслом, а на второе – с новым: На соломенной крыше избы зашуршал дождь. (А. Чехов); 6) стилистическими задачами (поэтическая инверсия): Люблю я пышное природы увяданье. (А. Пушкин) Сознательное, специальное изменение нормального порядка слов (вместе с интонацией) используется для выделения наиболее значимых частей предложения: В жару сердечных вдохновений лишь юности и красоты поклонником быть может гений. (А. Пушкин) Члены предложения, связанные Какие знаки"},{"t":"p","h":"сочинительными отношениями, назыпрепинания"},{"t":"raw","h":"<h4 class=\"mk\">ставятся между однородными членами предложения?<\/h4>"},{"t":"p","h":"ваются однородными."},{"t":"p","h":"Они выполняют одну и ту же синтаксическую функцию, одинаково относятся к общему для них члену предложения и объединены между собой сочинительной связью."},{"t":"p","h":"Однородными могут быть как главные, так и второстепенные члены предложения."},{"t":"p","h":"1. Между однородными членами предложения при отсутствии союзов ставится запятая: Ночь медленно течёт без звёзд, без звуков, без движения. (А. Серафимович)"},{"t":"p","h":"<span class=\"pg\" data-n=\"211\">211<\/span>2. Между однородными членами предложения при наличии союзов ставится запятая, если они соединяются:"},{"t":"p","h":"а) противительными союзами: Весна долго ждала, зато надвинулась сразу. (Г. Марков)"},{"t":"p","h":"6) повторяющимися союзами: Ни смех, ни говор твой весёлый не прогоняли темных дум. (Н. Некрасов)"},{"t":"p","h":"При наличии двойных союзов не только, но и; как, так и запятая между однородными членами ставится перед второй частью союза: Человек должен быть человечным не только в своей радости, но и в страдании. (К. Паустовский)"},{"t":"p","h":"Алгоритм постановки знаков препинания"},{"t":"h3","h":"при однородных определениях"},{"t":"p","h":"1. Можно ли между определениями вставить союз “И”?"},{"t":"p","h":"Да"},{"t":"p","h":"Определения однородны, между ними следует поставить запятую"},{"t":"v","l":["Нет","","2. Поясняет, уточняет ли"]},{"t":"p","h":"второе (неоднородное) опреде-"},{"t":"v","l":["ление содержание первого","Нет","Да","","Запятая","между","Запятая","между"]},{"t":"p","h":"определениями определениями ставится не ставится Обобщающее слово Какую роль играют"},{"t":"v","l":["обобщающие слова","при однородных","членах предложения?"]},{"t":"p","h":"дает общее наименование однородным членам, при которых оно употребляется."},{"t":"p","h":"Обобщающее слово в предложении является тем же членом предложения, что и однородные члены."},{"t":"p","h":"Обобщающие слова выражаются разными частями речи, но чаще всего местоимениями, местоименными наречиями, существительными: От зноя всё стало жёлтым: и небо, <span class=\"pg\" data-n=\"212\">212<\/span>и поле, и воздух. (К. Паустовский) В степи, за рекой, по дорогам – везде было пусто. (Л. Толстой) В Павле несколько минут боролись два чувства: обида и выдержка. (Н. Островский)"},{"t":"p","h":"Между обобщающим словом и однородными членами устанавливаются смысловые отношения родового понятия (грамматическая форма их выражения – обобщающее слово) и видовых понятий (грамматической формой их выражения являются однородные члены): На залитых лугах островками стали обозначаться самые высокие места: холмики, бугорки, древние татарские могилы. (В. Закруткин)"},{"t":"p","h":"Между обобщающим словом и однородными членами могут быть отношения целого и части: А по сторонам вымершая от зноя степь: устало полегшие травы, тусклые безжизненно блистающие солончаки, голубое и трепетное марево над дальними курганами. (М. Шолохов)"},{"t":"p","h":"Однородные члены конкретизируют содержание понятия, выраженного обобщающим словом. Между обобщающим словом и однородными членами существует пояснительная связь. Это подтверждается возможностью вставки слов а именно, как-то, то есть и др.: Хорь понимал действительность, то есть: обстроился, накопил деньжонку, ладил с барином и прочими властями... (И. Тургенев) 1. Если обобщающее слово Какие знаки препинаходится перед однородными нания ставятся при"},{"t":"raw","h":"<h4 class=\"mk\">однородных членах с обобщающими словами?<\/h4>"},{"t":"p","h":"членами, то после него ставится двоеточие: Дубровский воображал грустный образ жизни в деревне: глушь, безлюдье, бедность и хлопоты по делам. (А. Пушкин) 2. Если обобщающее слово стоит после однородных членов, то перед ним ставится тире: Ни дерево, ни вода – ничто не шелохнётся. (И. Тургенев) И города, и фабрики, и пашни – всё это наш родной и милый дом. (В. Лебедев-Кумач)"},{"t":"p","h":"3. Если однородные члены стоят после обобщающего слова в середине предложения, то перед однородными членами ставится двоеточие, а после них – тире: Вся природа: и лес, и <span class=\"pg\" data-n=\"213\">213<\/span>вода, и стены хижин, и песчаные холмы – всё горит точно багровым заревом. (И. Гончаров)"},{"t":"p","h":"Алгоритм постановки знаков препинания"},{"t":"h3","h":"при однородных членах © обобщающими словами"},{"t":"p","h":"1. Стоят ли однородные члены после обобщающих слов (с зависимыми от них словами) в конце предложения?"},{"t":"p","h":"Да"},{"t":"v","l":["Перед однородными","Нет","","2. Стоят ли однородные члены"]},{"t":"p","h":"членами ставится двое- – перед обобщающими словами? точие"},{"t":"p","h":"После однород-"},{"t":"v","l":["Нет","Да","Ш"]},{"t":"p","h":"Перед однородными членых членов ставится Нами ставится двоеточие,"},{"t":"raw","h":"<h4 class=\"mk\">тире Как согласовать<\/h4>"},{"t":"p","h":"а после них – тире (однородные члены стоят в середине предложения, после обобщающих слов)"},{"t":"p","h":"При однородных подлежасказуемое с однород- | щих сказуемое может стоять и ными подлежащими? | во множественном, и в единственном числе."},{"t":"p","h":"1. После однородных подлежащих сказуемое употребляется в форме множественного числа: Тишина и теплота ночи были невыразимо приятны. (И. Гончаров)"},{"t":"p","h":"2. Перед однородными подлежащими сказуемое употребляется в форме множественного числа, если ближайшее подлежащее или все подлежащие имеют форму множественного числа: На набережной теснились пароходы, шхуны, баржи. (А. Серафимович)"},{"t":"p","h":"3. Перед однородными подлежащими сказуемое ставится в единственном числе, если подлежащие обозначают вещи или понятия, и во множественном числе, если подлежащие называют лица: Близится вечер и белая ночь у Белого моря. (М. Пришвин) Уля, ее подруги и товарищи по школе росли вместе со своим городом. (А. Фадеев)"},{"t":"p","h":"4. Если сказуемое предшествует однородным подлежащим, соединенным противительными союзами со значением <span class=\"pg\" data-n=\"214\">214<\/span>отрицания, то оно согласуется с ближайшим подлежащим: Меня угнетала не боль, а тяжелое, тупое недоумение. (М. Горький) В предложении могут быть слова,"},{"t":"raw","h":"<h4 class=\"mk\">Как привлечь внимание к сообщению,<\/h4>"},{"t":"p","h":"которые не связаны с его членами какой-либо связью. Эти слова и сочетания выразить оценку? | СЛОВ относятся по смыслу ко всему"},{"t":"p","h":"предложению или к какой-либо его части и служат для привлечения внимания собеседника к сообщению либо выражают оценку."},{"t":"p","h":"Это обращения, вводные слова, вводные предложения, вставные конструкции."},{"t":"p","h":"Вводными называются слова или сочетания слов, при помощи которых говорящий выражает своё отношение к тому, что он сообщает."},{"t":"p","h":"Вводные слова имеют различные значения:"},{"t":"p","h":"Эти значения могут быть выражены не только вводными"},{"t":"p","h":"1. Различная степень уверенности:"},{"t":"p","h":"а) большая степень уверенности Горный воздух, без всякого сомнения, (конечно, разумеется, бесспорно, | действует благотворно на здоровье несомненно, без сомнения, без- человека. (И. Тургенев) условно, действительно и др.)"},{"t":"p","h":"6) меньшая степень уверенности, Кажется, ваша история там наделала предположение (кажется, вероятно, много шуму. (М. Лермонтов) очевидно, возможно, пожалуй и др.)"},{"t":"p","h":"2. Различные чувства (к счастью, К счастью, по причине неудачной к общей радости, к несчастью, к охоты на

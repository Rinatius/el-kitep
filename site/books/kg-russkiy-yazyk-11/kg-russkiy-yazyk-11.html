тельным | вечно занятый человек.","с пояснитель- (Ю. Казаков)","ными словами"]},{"t":"p","h":"<span class=\"pg\" data-n=\"218\">218<\/span>Обособленные приложения выделяются на письме запятыми или тире: Со мной в одну смену работают Николай, Павел – мой брат, мастер Семен Петрович и двое стажеров-учеников. (Тире отличает приложение от однородных членов.)"},{"t":"p","h":"Не обособляются приложения:"},{"t":"p","h":"а) с союзом как со значением “в качестве”: Он был на съезде как делегат, а я как гость. – Он был на съезде делегатом, а я гостем;"},{"t":"p","h":"6) в сочетаниях рыба акула, растение папоротник, дерево секвойя, почва чернозем, гражданин судья, товарищ председатель, господин судья, коллега доцент, т.е. когда в одном объекте соединяются родовые и видовые названия."},{"t":"p","h":"Когда Обстоятельства, выраженные дееприобособляются и частиями с пояснительными словами не обособляются и одиночными деепричастиями, обообстоятельства? собляются: Мать не спала, ожидая"},{"t":"p","h":"возвращения сына с завода. Он шёл, напевая."},{"t":"p","h":"Не обособляются обстоятельства, выраженные деепричастиями, если:"},{"t":"p","h":"а) деепричастие теряет основное качество – обозначать дополнительное действие. Его можно заменить другой частью речи: Он вышел не обернувшись. (А. Грин) Ср.: Он вышел и не обернулся. В этом предложении основное действие передается вторым глаголом, первый глагол по смыслу менее важен. А в предложении Рыбак лежал на траве не двигаясь (А. Новиков-Прибой) деепричастие не двигаясь несложно заменить наречием неподвижно;"},{"t":"p","h":"6) деепричастия теряют глагольность и являются наречиями; Он всё делает молча (без слов). Он решил эту задачу шутя (легко)."},{"t":"p","h":"Не обособляются одиночные деепричастия в конце предложений, если они теряют значение второстепенного, дополнительного действия."},{"t":"p","h":"<span class=\"pg\" data-n=\"219\">219<\/span>Алгоритм постановки запятой при обстоятельствах, выраженных деепричастием или деепричастным оборотом"},{"t":"p","h":"1. Выражено ли обстоятельство деепричастным оборотом, который не является фразеологизмом и не образует с глаголом-сказуемым единое смысловое целое?"},{"t":"p","h":"– Не 2. Стоит ли обстоятельство —"},{"t":"raw","h":"<h4 class=\"mk\">Всегда обособляется<\/h4>"},{"t":"v","l":["одиночное деепричастие после","глагола-сказуемого и отвечает","ли на вопрос как?","Да","","Не","обособляется","Нет"]},{"t":"h3","h":"Обособляется"},{"t":"p","h":"1. Обособляются приложения с Какие еще"},{"t":"p","h":"союзом как, имеющие причинное значечлены предложения | ние: Мой брат, как опытный инженер,"},{"t":"p","h":"сразу обнаружил неисправность в приборе."},{"t":"p","h":"2. Обособляются дополнения с предлогами кроме, помимо, исключая, за исключением, включая: Все прочитали новый роман, кроме Петра."},{"t":"p","h":"3. Обособляются обстоятельства с предлогом несмотря на: Несмотря на мощный ветер, дубовый лес стоял непоколебимо."},{"t":"p","h":"4. Обособляются уточняющие члены с союзами то есть, или (в значении то есть): Кварц, или окись кремния, – один из самых распространенных минералов. (А. Ферсман)"},{"t":"p","h":"5. Обособляются уточняющие члены предложения со словами даже, в особенности, например, в частности, в том числе, вообще, особенно, по преимуществу, главным образом, прежде всего, в первую очередь: В лесу всё время, даже ночью, воздух был душным и влажным."}],"sub":[{"title":"Место по","b":97},{"title":"Способ выражения","b":122},{"title":"Обособляется","b":145}],"section":"КАКИМ БЫТ!","pages":[209,219]},{"title":"ОДНОСОСТАВНОЕ ПРЕДЛОЖЕНИЕ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"220\">220<\/span>ОДНОСОСТАВНОЕ ПРЕДЛОЖЕНИЕ"},{"t":"raw","h":"<h4 class=\"mk\">Какие предложения относятся к односоставным?<\/h4>"},{"t":"p","h":"Односоставным называется предложение с одним члевом главным (подлежащим или сказуемым): Во глубине сибирских руд храните гордое терпенье. (А. Пушкин) Темнеет. У меня нет света. (В. Инбер) Карта. Старая карта в отметинах, в ссадинах боя. (П. Антокольский)"},{"t":"p","h":"Среди односоставных предложений выделяют: определённо-личные, неопределённо-личные, обобщённо-личные, безличные, инфинитивные, номинативные."},{"t":"p","h":"Определённо-личное предложение – это предложение с одним главным членом сказуемым в форме 1 или 2 лица изъявительного либо повелительного наклонения глагола: Люблю дымок спаленной жнивы. (М. Лермонтов) Победим. И вернемся. И радость вернем. (А. Сурков) Во глубине сибирских руд храните гордое терпенье. (А.. Пушкин)"},{"t":"p","h":"Неопределённо-личное предложение – это предложение с одним главным членом сказуемым в форме 3 лица мн. ч. настоящего или будущего времени либо в форме мн. ч. прошедшего времени. Сказуемое обозначает действие, которое совершается неопределёнными лицами: В дверь стучат. В дверь постучали."},{"t":"p","h":"Обобщённо-личное предложение – предложение с одним главным членом сказуемым, обычно в форме глагола 2 лица ед. ч. настоящего или будущего времени. Сказуемое обозначает действие, которое может быть отнесено к любому обобщённому лицу: Без труда не вынешь рыбку из пруда. (Пословица) Слезами горю не поможешь. (Пословица)"},{"t":"p","h":"Безличное предложение – это предложение с одним главным членом сказуемым, форма которого не выражает лица. Сказуемое в этих предложениях обозначает действие, которое нельзя отнести ни к какому лицу: Уже смеркалось. (А. Пушкин) Над лугом в одном месте посветлело. (А. Серафимович) Легкого счастья нет. (А. Яшин)"},{"t":"p","h":"<span class=\"pg\" data-n=\"221\">221<\/span>Инфинитивное предложение – предложение с одним главным членом сказуемым, выраженным инфинитивом: Солнце не затмить черной тучей. (М. Лисянский) Нас под ветром не согнуть и с дороги не свернуть. (С. Васильев)"},{"t":"p","h":"Инфинитивные предложения выражают значения:"},{"t":"p","h":"а) возможности – невозможности действия: У России героев не счесть. (Ю. Друнина);"},{"t":"p","h":"6) желательности – нежелательности действия: Не отстать бы на ходу. (А. Твардовский);"},{"t":"p","h":"в) вопросительности: Доколе матери тужить? Доколе коршуну кружить? (А. Блок)."},{"t":"p","h":"Назывное предложение – это предложение с главным членом подлежащим, выраженным именем существительным в именительном падеже. В этих предложениях сообщается о каком-либо предмете, явлении, о которых утверждается, что они есть: Тайга. Реки. Откосы гор. (А. Твардовский) Синее небо. Синие тени. (В. Песков) Нечленимые предложения (или слова-предложения) утверждают или отрицают, выранечленимыми?"},{"t":"p","h":"жают согласие – несогласие, оценку, побуждают к действию. Это особый тип предложения, они не относятся ни к двусоставным, ни к односоставным предложениям."},{"t":"v","l":["Типы нечленимых предложений:","1) утвердительные (Да.);","2) отрицательные (Нет.);","3) вопросительные (Нет? Да?);","4) междометные (Ого-го! Н у! Ни-ни-ни!);","5) предложения-обращения (Ну,"]},{"t":"p","h":"Неполное – это предложение,"},{"t":"raw","h":"<h4 class=\"mk\">Что такое предложение: 2<\/h4>"},{"t":"p","h":"в котором те или иные члены отсутствуют, но ясны из контекста или ситуации:"},{"t":"p","h":"– Вы видели звёзды в полете?"},{"t":"p","h":"<span class=\"pg\" data-n=\"222\">222<\/span>– Видел. (В. Песков) Человеку свойственно ошибаться, глупцу – настаивать на своих ошибках. (Пословица)"},{"t":"p","h":"Неполные предложения могут быть двусоставными и односоставными, распространёнными и нераспространёнными, простыми и сложными. Неполные предложения часто встречаются в устной речи."}],"sub":[],"section":"КАКИМ БЫТ!","pages":[220,222]},{"title":"СЛОЖНОЕ ПРЕДЛОЖЕНИЕ","blocks":[{"t":"h3","h":"СЛОЖНОЕ ПРЕДЛОЖЕНИЕ"},{"t":"p","h":"Сложносочинённое Какие смысловые предложение (ССП) – это отношения передают предложение, в котором простые"},{"t":"raw","h":"<h4 class=\"mk\">сложносочиненные предложения?<\/h4>"},{"t":"p","h":"предложения связаны между собой сочинительными союзами: (1) Зима стояла грозно, (2) и снег скрипел, (3) и синий небосклон сиял морозно. (А. Пушкин) Между частями сложносочинённого предложения могут быть следующие смысловые отношения:"},{"t":"p","h":"1. Соединительные – со значением одновременности, последовательности Отношения соединительности передаются с помощью союзов и, да, тоже, также: Едва слышно шумит тростинка, да изредка раздается плеск воды. (И. Тургенев) Секунду он молчал, смотрела на него тоже молча. (А. Горький) Море глубоко роптало, и волны бились о берег бешено и гневно. (А. Горький)"},{"t":"p","h":"2. Разделительные – со значением чередования, взаимоисключения, несовместимости. Отношения разделительности передаются с помощью союзов или, либо, то – то, не то – не то: Будет очень жарко, или разразится гроза. (А. Гайдар) То солнце тускло блестит, то туча черная висит. (Н. Некрасов)"},{"t":"p","h":"3. Противительные – со значением противопоставления, несоответствия. Противительные отношения <span class=\"pg\" data-n=\"223\">223<\/span>передаются с помощью союзов а, но, да, однако, зато, же: Труд кормит, а лень портит. (Пословица) Ветра не было, но в саду все падали листья. Все посмотрели ему вслед, но никто не улыбнулся. (И. Тургенев)"},{"t":"p","h":"4. Сопоставительные – со значением сопоставления. Эти отношения сопоставления между частями сложносочиненного предложения передаются с помощью союзов а, но, зато: В комнатах было душно, а на улице вихрем носилась пыль. (А. Чехов)"},{"t":"p","h":"5. Присоединительные – вторая часть сложносочинённого предложения представляет собой дополнительное сообщение или добавочное замечание. Отношения присоединительности в сложносочинённых предложениях передаются с помощью союзов да и, но и, а, да, и: У вас уже будут привычки, а привычки всегда побеждают мнения и убеждения. (А. Горький) Мы сидели в тени, но и в тени было душно. (И. Тургенев) Наташа говорила шёпотом, да и дед и лесничий тоже говорили вполголоса. (К. Паустовский)"},{"t":"p","h":"6. Пояснительные – вторая часть сложносочиненного предложения раскрывает, уточняет содержание первой части. Отношения пояснительности в сложносочинённых предложениях передаются с помощью союзов то есть, а именно: Райский лет десять живет в Петербурге, то есть у него там есть приют... (И. Гончаров) Товарищ помог мне подготовиться к уроку русского языка, а именно он объяснил мне материалы о правописании слов с безударными гласными."},{"t":"raw","h":"<h4 class=\"mk\">Какие знаки препинания в сложносочинённых предложениях?<\/h4>"},{"t":"p","h":"1. Между простыми предло- = жениями в сложносочинённых предложениях ставится запятая, если они соединяются сочинительными союзами: Изредка поднимался ветерок, и лёгкий шорох пробегал по всему саду. (А. Пушкин) То солнце светило, то шёл дождь. (В. Арсеньев)"},{"t":"p","h":"<span class=\"pg\" data-n=\"224\">224<\/span>2. Между простыми предложениями, которые соединяются в сложносочинённом предложении союзом и, запятая не ставится, если они имеют общий второстепенный член предложения: В окна с улицы лился глухой шум и летела пыль. (М. Горький) Вскоре после восхода набежала туча и брызнул короткий дождь. (М. Пришвин)"},{"t":"p","h":"3. Между простыми предложениями ставится точка с запятой, если внутри них есть запятые или одно из них менее связано с предыдущим по смыслу: Жизнь ей улыбнулась; но бывают улыбки хуже слез. (И. Тургенев) Приятель его советовал ему жаловаться; но смотритель подумал, махнул рукой и решил отступиться. (А. Пушкин)"},{"t":"p","h":"4. Между простыми предложениями ставится тире, если второе предложение выражает быструю смену событий, неожиданный результат: Тут раздался лёгкий свист – и Дубровский умолк. (А. Пушкин) Грянет залп – и опять тишина. (А. Сурков)"},{"t":"p","h":"Алгоритм постановки знаков препинания в сложносочинённом предложении с союзом и"},{"t":"h3","h":"(неповторяющимся)"},{"t":"p","h":"1. Входит ли сложносочинённое предложение в состав сложноподчинённого предложения и относятся ли его части в качестве придаточных к одному слову главного предложения?"},{"t":"p","h":"да"},{"t":"raw","h":"<h4 class=\"mk\">Запятая перед и не ставится<\/h4>"},{"t":"v","l":["2. Имеют ли части сложносочинённого","предложения общий второстепенный","член или общее придаточное?","Да Нет"]},{"t":"p","h":"Запятая перед Запятая перед союзом и не ставится всегда ставится <span class=\"pg\" data-n=\"225\">225<\/span>Сложноподчинённое"},{"t":"raw","h":"<h4 class=\"mk\">Как строится сложноподчинённое предложение?<\/h4>"},{"t":"p","h":"предложение – тип сложного предложения, образованного на основе подчинительной связи. Сложноподчинённое предложение включает главную (независимую) часть и придаточную (зависимую). В качестве средств связи в сложноподчинённых предложениях используются союзы и союзные слова."},{"t":"p","h":"Придаточное предложение поясняет все главное предложение или слово (словосочетание) в главном предложении: Чудесны люди, с которыми живёшь, идёшь рядом. (Б. Горбатов) Придаточная часть поясняет слово люди в главной части (люди какие? – с которыми живёшь, идёшь рядом). Мы рождены, чтоб сказку сделать былью. (В. Лебедев- Кумач) Придаточное предложение чтоб сказку сделать былью поясняет всё главное предложение (мы рождены с какой целью? зачем?)."},{"t":"p","h":"Средетва связи в сложноподчинённом предложении Союзные слова"},{"t":"p","h":"1. Не отвечают на вопросы"},{"t":"v","l":["2. Не являются членами","предложения (что, чтобы, как,","словно, ибо, так как, если, хотя","ит. п.)","1. Отвечают на вопросы","2. Являются членами","предложения (который, какой,","чей, где, куда, откуда, почему","ит. п.)"]},{"t":"p","h":"Есть святые чувства, которых не должна касаться чужая рука. (Д. Мамин-Сибиряк) В этом предложении которых – союзное слово, оно является дополнением в придаточном предложении,"},{"t":"p","h":"В главной части сложноподчинённого предложения могут быть указательные слова тот, такой, там, туда, оттуда, так, тогда, настолько. В этом случае связь между главным и придаточным предложением (придаточными предложениями) более тесная: Случается нередко нам и труд, и мудрость <span class=\"pg\" data-n=\"226\">226<\/span>видеть там, где стоит только догадаться за дело просто взяться. (И. Крылов)"},{"t":"p","h":"Функцию указательных слов могут выполнять слова потому, от того, для того. Они входят в главное предложение. Придаточное опреде- Какие значения лительное – это предложение, передают которое характеризует, показывает придаточные предложения? признак предмета, обозначенного определяемым словом в главном предложении: Дом, в котором поселился таинственный незнакомец, стоял особняком. (Д. Мамин-Сибиряк) Определительное значение выражается союзными словами. Союзные слова который, какой, чей согласуются с определяемым существительным в числе и роде (Дом, в котором...). Союзные слова где, куда, откуда, когда примыкают к существительному, и их связь может быть установлена путем замены союзным словом который; ср.: Маленький дом, где я живу в Мещере, заслуживает описания. (К.Паустовский) – Дом, в котором..."},{"t":"p","h":"Придаточное определительное, как правило, следует сразу за определяемым существительным, поэтому иногда оказывается в середине главного предложения: Так прожил Касатский в первом монастыре, куда поступил, семь лет. (Л. Толстой)"},{"t":"p","h":"Придаточное изъяснительное – вид придаточного предложения, которое присоединяется к “изъяснительным” словам главного предложения, т. е. обозначающим речь, мышление, отношение, восприятие, чувство. Это глаголы сказал, ответил, подумал, решил, считал, увидел, услышал, удивился; отглагольные существительные слух, известие, мысль, мнение; наречия известно, слышно, видно, понятно, плохо и др. Придаточное присоединяется к этим словам с помощью союзов что, как, чтобы и союзных слов что, кто, где, когда и др.: Мы давно уже знали, что (союз) все рыболовы делятся на глубоких неудачников и на счастливцев. (К. Паустовский) Всего, что (союзное слово) знал еще Евгений, пересказать мне недосуг. (А. Пушкин)"},{"t":"p","h":"<span class=\"pg\" data-n=\"227\">227<\/span>Придаточное временное обозначает событие, положение, одновременно или в разное время с которым происходит то, что названо в главном предложении: Когда не было дождя, лягушка сидела в лужице под рукомойником. (К. Паустовский) – Значение одновременности; Перед тем как поступать в военное училище, Аркаша тяжело заболел. (А. Куприн) – Значение разновременности,"},{"t":"p","h":"Этот тип предложений присоединяется к главному предложению с помощью союзов."},{"t":"p","h":"В русском языке группа временных союзов очень большая, в нее входят те, которые указывают на одновременность – разновременность (когда), выражают одновременность (в то время когда, в то время как и др.), предшествование (прежде чем, перед тем как, едва, чуть только и др.) и последование (после того как): Пока в руках у нас частица времени, пускай оно работает на нас. (С. Маршак) Только что Балашов начал говорить, как удивление выразилось на лице государя. (Л.Толстой)"},{"t":"p","h":"Придаточное места содержит в себе указание на место, направление, пространство, где совершается то, о чем говорится в главном предложении. Такие предложения присоединяются к главному предложению с помощью союзов где, куда, откуда: Он засмеялся и пошел, куда захотелось ему. (М. Горький)"},{"t":"p","h":"Придаточное причинное – это вид придаточного предложения со значением основания, причины по отношению к главному предложению. Присоединяется к главному с помощью причинных союзов так как, потому что, ибо, тем более что, оттого что: Яков никогда не бывал в хорошем расположении духа, так как ему постоянно приходилось терпеть страшные убытки. (А. Чехов) Оттого что облака почти касались верхушек берез, на земле было тихо и тепло. (К. Паустовский)"},{"t":"p","h":"Придаточное сравнительное – это вид придаточного предложения со значением сходства события, положения с тем, которое обозначено в главном предложении."},{"t":"p","h":"<span class=\"pg\" data-n=\"228\">228<\/span>Сравнение выражается союзами как, будто, точно, словно. Шел Самгин осторожно, как весною ходят по хрупкому льду реки. (М. Горький) Наступило прохладное лето, словно новая жизнь началась. (А. Ахматова)"},{"t":"p","h":"Придаточное условное – это предложение, выражающее условие, при котором может (могло бы) осуществиться событие, обозначенное в главном предложении. Условие оформляется союзами если, коли, раз: Если ей хорошо, то я счастлив. (А. Куприн) Если бы музыкой ты была, я тебя бы слушал неотрывно. (А. Ахматова)"},{"t":"p","h":"Придаточное уступительное – это предложение со значением “противоположного следствия”: событие, названное в главном предложении, совершается вопреки тому, что обозначено в придаточном. Присоединяется к главному с помощью союзов хотя, несмотря на то что, а также сочетаний как ни, сколько ни и др.: Тихон Петрович сидел на палубе, хотя на воде было холодно. (К.. Паустовский)"},{"t":"p","h":"Придаточное целевое показывает, что событие, названное в главном предложении, совершается ради того, что выражено в придаточном. Это значение оформляется союзом чтобы и составными союзами, в которые он входит (для того чтобы, с той целью чтобы и др.): Андрий должен был часто останавливаться, чтобы дать отдохнуть своей спутнице. (Н. Гоголь)"},{"t":"p","h":"р Какие знаки препи- Придаточное предложение нания ставятся в | отделяется от главного запятой: Кто не любит родную природу, ном предложении? тот не знает народной души. (Н. Рыленков)"},{"t":"p","h":"Придаточные предложения, находящиеся внутри главного предложения, выделяются запятыми с обеих сторон: Люди, которые отрекаются от своей Родины, отрекаются тем самым и от своей совести. (Я. Галан)"},{"t":"p","h":"<span class=\"pg\" data-n=\"229\">229<\/span>Как соединяются не- Сложноподчинённые предлосколько придаточных жения с двумя или несколькими предложений в одном придаточными представляют собой сложноподчинённом"},{"t":"p","h":"предложении? сложную синтаксическую конструкцию. Такие предложения делятся на 2 группы."},{"t":"p","h":"1. Сложноподчинённые предложения с придаточными, относящимися к главной части. Среди них выделяют сложноподчиненные предложения с однородным соподчинением (однородными придаточными) и сложноподчинённые предложения с неоднородным соподчинением (неоднородными придаточными)."},{"t":"p","h":"При однородном соподчинении придаточные предложения одинаковы по значению, относятся к одному слову в главной части или ко всей главной части: Мересьев вдруг ощутил, (1) что машина ему послушна, (2) что он чувствует ее во всем. (Б. Полевой) В этом предложении два однородных придаточных относятся к одному слову главного предложения. Схематически это можно представить следующим образом:"},{"t":"h3","h":"главное"},{"t":"v","l":["что","| придаточное 1 |","что","придаточное 2"]},{"t":"p","h":"Однородные придаточные могут соединяться при помощи сочинительных союзов: Я отвечал, что природа хороша и что особенно хороши в наших местах закаты. (В. Солоухин) В этом сложноподчинённом предложении придаточные изъяснительные соединены союзом и."},{"t":"p","h":"При неоднородном соподчинении придаточные предложения относятся к разным словам главного предложения. Такие придаточные – разные по значению и отвечают на разные вопросы: (1) Когда все экипажи проехали, толпа хлынула и вынесла его на площадь, (2) которая вся была занята народом. В этой сложной синтаксической конструкции два придаточных предложения – придаточное времени и <span class=\"pg\" data-n=\"230\">230<\/span>определительное – соединяются с главным неоднородным соподчинением. Схематично это можно представить следующим образом:"},{"t":"h3","h":"[ придаточное 1_ 1"},{"t":"p","h":"2. Всложноподчинённых предложениях с последовательным подчинением первое придаточное относится к главному, второе придаточное – к первому придаточному, третье придаточное – ко второму придаточному и т. д.: Нехлюдов увидел у подъезда несколько экипажей и вспомнил, (1) что нынче у Масленникова был тот приёмный день, (2) в который он просил его приехать. (Л. Толстой)"},{"t":"p","h":"Это сложноподчинённое предложение состоит из 3-х простых предложений: главного и следующих за ним придаточных, первое из которых, изъяснительное, присоединяется к главному, а второе, определительное, – к первому придаточному:"},{"t":"p","h":"| главное"},{"t":"raw","h":"<h4 class=\"mk\">что в который Какие знаки препинания ставятся в сложноподчинённом<\/h4>"},{"t":"p","h":"придаточное 1 (изъяснительное) | придаточное 2 (определительное)"},{"t":"p","h":"1. Между однородными придаточными, не соединёнными союзами, ставится запятая: Мой предложении с двумя дом везде, где есть небесный свод, или несколькими при- где только слышны звуки песен. даточными частями? (М. Лермонтов) 2. Между однородными придаточными запятая не ставится, если они соединены одиночным сочинительным союзом: Мягко улыбаясь, Чехов говорил друзьям, что небо будет в алмазах и что скоро всё переменится. (И. Эренбург)"},{"t":"raw","h":"<h4 class=\"mk\"><span class=\"pg\" data-n=\"231\">231<\/span>Какие смысловые отношения пере-<\/h4>"},{"t":"p","h":"Бессоюзное сложное предложение (БСП) характеризуется дают бессоюзные | отсутствием союзных средств. Связь"},{"t":"raw","h":"<h4 class=\"mk\">сложные предложения?<\/h4>"},{"t":"p","h":"между его составными частями выражается с помощью интонации, соотносительными формами сказуемого, лексическими средствами: Сильный ветер внезапно загудел в вышине, деревья забушевали, крупные капли дождя зашлёпали по листьям, сверкнула молния, ударил гром, гроза разразилась. (И. Тургенев)"},{"t":"p","h":"Типы отношений между частями"},{"t":"p","h":"бессоюзных сложных предложений 1. Одновременность или последовательность действий, явлений, событий: Наступал вечер; шёл дождь, с севера порывисто дул ветер. (М. Горький) В этом предложении простые предложения, входящие в состав сложного, передают одновременность явлений. Удилище согнулось в дугу, леска со свистом врезалась в воду. (К. Паустовский) В этом предложении простые предложения в составе бессоюзного сложного передают последовательность действий."},{"t":"p","h":"2. Сопоставление или противопоставление: Чин следовал ему – он службу вдруг оставил. (А. Грибоедов)"},{"t":"p","h":"3. Временные или условные отношения: Биться в одиночку – жизни не перевернуть. (Н. Островский)"},{"t":"p","h":"4. Причинные отношения: Не удалось Артёму устроить брата учеником в депо: моложе пятнадцати лет не брали. (Н. Островский)"},{"t":"p","h":"5. Отношения следствия: Не было никакой возможности уйти незаметно – он вышел открыто (А. Фадеев)"},{"t":"p","h":"6. Пояснительные отношения: Я не мог заснуть: передо мной во мраке вертелся мальчик с белыми глазами. (М. Лермонтов)"},{"t":"p","h":"7. Отношения дополнения: Федор понял: речь шла о связи. (Д. Фурманов) <span class=\"pg\" data-n=\"232\">232<\/span>Какие знаки препи- 1. Запятая ставится, если части нания ставятся в бессоюзного сложного предложения бессоюзном слож- кратки, связаны между собой по ном предложении? смыслу: Один из людей громко сказал"},{"t":"p","h":"что-то, мать вздрогнула, все встали, она тоже поднялась. (М. Горький) 2. Точка с запятой ставится, если части сложного предложения менее связаны по смыслу, значительны по объёму: Ночевала тучка золотая на груди утеса-великана; утром в путь она умчалась рано, по лазури весело играя. (М. Лермонтов)"},{"t":"p","h":"3. Двоеточие ставится, если:"},{"t":"p","h":"а) вторая часть указывает причину того, о чём говорится в первой: Осень и зиму Корчагин не любил: они приносили ему много физических страданий. (Н. Островский);"},{"t":"p","h":"6) вторая часть поясняет всю первую или один из членов предложения, раскрывает их содержание: В доме малопомалу нарушалась тишина: в одном углу где-то скрипнула дверь; послышались по двору чьи-то шаги; на сеновале кто-то чихнул. (А, Гончаров);"},{"t":"p","h":"в) вторая часть (или части) дополняет первую или какой-либо её член (чаще – сказуемое): Мы знаем: в разведку нельзя без риска. (В. Песков)"},{"t":"p","h":"4. Тире ставится, если:"},{"t":"p","h":"а) передается быстрая смена событий или неожиданный результат действия: Вагоны толкнулись поезд стал. (А. Серафимович);"},{"t":"p","h":"6) содержание одной части предложения противопоставляется содержанию другой: Труд человека кормит – лень портит. (Пословица);"},{"t":"p","h":"в) первое предложение указывает на время действия того, о чём говорится во втором: Ехали сюда – рожь только начинала желтеть. (М. Пришвин);"},{"t":"p","h":"г) первое предложение указывает условие того, о чём говорится во втором: Любишь кататься – люби и саночки возить. (Пословица);"},{"t":"p","h":"<span class=\"pg\" data-n=\"233\">233<\/span>д) второе предложение заключает в себе результат, следствие того, о чём говорится в первом предложении: Мелкий дождь сеет с утра – выйти невозможно. (И.Тургенев);"},{"t":"p","h":"е) содержание первого предложения сравнивается с содержанием второго: Посмотрит – рублем одарит. (Н. Некрасов)"},{"t":"v","l":["Алгоритм постановки знаков препинания","в бессоюзном сложном предложении"]},{"t":"p","h":"1. Имеются ли между частями сложного предложения перечислительные отношения?"},{"t":"raw","h":"<h4 class=\"mk\">Да Ставится запятая<\/h4>"},{"t":"h3","h":"Нет"},{"t":"p","h":"2. Передает ли вторая часть или, если в предложении причину того, о чём говорится в"},{"t":"p","h":"запятые, точка первой части (можно вставить союз"},{"t":"raw","h":"<h4 class=\"mk\">с запятой Да Ставится двоеточие Да Ставится двоеточие (в современных печатных текстах двоеточие иногда заменяется тире)<\/h4>"},{"t":"p","h":"потому что)?"},{"t":"h3","h":"Нет"},{"t":"p","h":"3. Раскрывает ли, уточняет ли вторая часть содержание первой?"},{"t":"h3","h":"Нет"},{"t":"v","l":["Ставится тире","(при противопоставлении,","отношениях следствия,","результата)"]}],"sub":[],"section":"КАКИМ БЫТ!","pages":[223,233]},{"title":"СЛОЖНОЕ СИНТАКСИЧЕСКОЕ ЦЕЛОЕ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"234\">234<\/span>СЛОЖНОЕ СИНТАКСИЧЕСКОЕ ЦЕЛОЕ"},{"t":"raw","h":"<h4 class=\"mk\">Как связываются предложения в текст?<\/h4>"},{"t":"p","h":"Сочетание связанных по смыслу и грамматически предложений, |: которых раскрывается определенная микротема, называется слож – ным синтаксическим целым (ССЦ): Тем, что посвятил свою жизнь музыке, я обязан Моцарту. Он дал первый толчок моим музыкальным силам. Он заставил меня полюбить музыку больше всего на свете. (П.Чайковский)"},{"t":"p","h":"В данном отрывке три предложения: начальное предложение – опорное, следующие два развивают мысль, высказанную в первом предложении. Предложения объединяются не только по смыслу, но и межфразовыми связями. Второе и третье предложения связаны с первым предложением с помощью местоимения он. Сказуемые в предложениях выражены глаголами, которые имеют одинаковые видовременные формы."},{"t":"p","h":"Повествовательные предложения в составе ССЦ произносятся с понижением тона к концу, одинаковыми паузами между предложениями. В конце ССЦ тон понижается значительно, а пауза между ССЦ длительная. Начало следующего ССЦ характеризуется повышением тона."},{"t":"p","h":"В составе ССЦ предложения бывают разной структуры (простые и сложные)."},{"t":"p","h":"По способу связи предложений между собой можно выделить два типа ССЦ:"},{"t":"v","l":["1) ССЦ с цепной связью;","2) ССЦ се параллельной связью."]},{"t":"p","h":"В ССЦ с цепной связью предложения соединяются между собой наподобие цепочки. Развитие мысли вызывается выделением какого-либо члена предложения в предшествующем предложении, который повторяется в последующем. Цепная связь осуществляется с помощью местоимений, синтаксических повторов, синонимических <span class=\"pg\" data-n=\"235\">235<\/span>замен, наречий: По осени у подножия елей вырастают светло-шоколадные грибы. На грибах явственно видны бороздчатые следы острых беличьих зубов. Прыгая с дерева на дерево, собирает белка и орехи с полными, твердыми ядрами. (В. Солоухин) В этом ССЦ связь между предложениями представлена лексическими повторами: грибы – на грибах, беличьих – белка."},{"t":"p","h":"В ССЦ с параллельной связью описываются одновременно происходящие или сменяющие друг друга явления, которые перечисляются или сопоставляются: Раньше новые знания получали «вручную». Галилей сам смастерил первый телескоп и открыл с его помощью четыре спутника Юпитера. Левенгук собственноручно шлифовал линзы для своих микроскопов и узрел невидимый до тех пор мир микробов. Даже Резерфорд в начале нашего века изготовлял необходимую для научных экспериментов аппаратуру. (В. Тендряков) В этом ССЦ первое предложение – опорное. Второе и третье предложения параллельны между собой и одинаково относятся к первому предложению."},{"t":"p","h":"В пределах одного ССЦ могут совмещаться параллельная и цепная связь: Берег быстро темнел, становился голубым, синим, лиловым. На суше уже наступил вечер. В море было ещё светло. Глянцевая зыбь отражала чистое небо. Но всё же вечер чувствовался и тут. (В. Катаев) Данное ССЦ состоит из пяти предложений, связь между 1, 2, 3, 4 предложениями – параллельная, а 5 предложение присоединяется по способу цепной связи. Показатели этой связи – союз но, наречие тут."},{"t":"h3","h":"<span class=\"pg\" data-n=\"236\">236<\/span>СЛОВАРЬ"},{"t":"p","h":"адресат – адресат (почта же"},{"t":"p","h":"телеграф аркылуу жиберилген нерсени ала турган киши же мекеме) акварель – акварель ов] рель (суу га эзме актуальный – актуалдуу алгоритм – алгоритм ансамбль (одежды) – ансамбль"},{"t":"p","h":"(келишимдуу-келбеттуу бирдик) ассортимент – ассортимент (то-"},{"t":"p","h":"варлардын ар кыл турлерунун тандалмасы, жыйындысы) безнадежный – умутсуз библиофил – библиофил (ки-"},{"t":"p","h":"тепти жакшы керуучу, жыйноочу адам) биосфера – биосфера (суу,"},{"t":"p","h":"атмосфера жана жер кыртышынын жандуу организм тиричилик кыла ала турган же тиричилик кылып турган белугу) благословение – бата, бата"},{"t":"p","h":"беруу бодрящий – сергек, сергитуучу божественно – сонун, кооз, су-"},{"t":"p","h":"луу, эн жакшы бродить – тентирее, тентип"},{"t":"p","h":"журуу бутон – бутон (ачыла элек гул) веер – желпингич виртуоз – виртуоз (ез искус-"},{"t":"p","h":"ствосунун техникасына мыкты машыккан музыкант)   // ================================================================ LIBRARY

  // The library is organised by school (language of instruction), then grade, then subject.

  var SCHOOLS = [['ky', 'Кыргыз мектеби'], ['ru', 'Русская школа']];

  var SUBJECTS = [

    var s = String(b.subject || b.title || '').toLowerCase();

    return { key: 'x:' + s, order: SUBJECTS.length, name: b.subject || b.title };

  // Share a book: a link (opens the app at the book) or the single-file book, through the

  function shareSheet(b) {
    var name = b.title + (b.grade ? ', ' + b.grade + ' ' + t('grade') : '');
    var url = location.href.split('#')[0] + '#/read/' + b.id;
    var old = $('.sheet'); if (old) old.remove(); old = $('.sheet-bg'); if (old) old.remove();

    var sh = document.createElement('div'); sh.className = 'sheet';

      '<div class="share-opts"><button class="btn primary s-link">' + esc(t('shareLink')) + '</button>' +
      (b.standalone ? '<button class="btn s-file">' + esc(t('shareFile')) + '</button><div class="note">' + esc(t('shareFileNote')) + '</div>' : '') + '</div>';
    document.body.appendChild(bg); document.body.appendChild(sh);
    function close() { bg.remove(); sh.remove(); }
    bg.onclick = close; $('.x', sh).onclick = close;

    $('.s-link', sh).onclick = function () {
      if (navigator.share) {

        navigator.clipboard.writeText(url).then(function () { toast(t('linkCopied')); close(); }, function () { window.prompt(t('shareLink'), url); });
      } else {
        window.prompt(t('shareLink'), url);

    var file = null;

  function downloadBook(b, onProgress) {
    var base = 'books/' + b.id + '/';
    var cache;
    return caches.open(cacheName(b)).then(function (c) {
      cache = c;
      return fetch(base + 'book.json');
    }).then(function (r) {

    }).then(function (book) {

      var done = 0;

  // ================================================================ READER

      var zi = $('img', z); zi.src = img.src;
      var fit = function () {
        var W = window.innerWidth, H = window.innerHeight, w = +img.getAttribute('data-w'), h = +img.getAttribute('data-h');
        var s = Math.min(W / w, H / h) * (big ? 2.5 : 1);
        zi.style.width = Math.round(w * s) + 'px'; zi.style.height = 'auto'; zi.style.maxWidth = 'none'; zi.style.maxHeight = 'none';
      };
      zi.onclick = function (e) {
        var inr = $('.zoom-in', z), r = zi.getBoundingClientRect();
        var fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
        big = !big; fit();
        if (big) { inr.scrollLeft = fx * zi.offsetWidth - window.innerWidth / 2; inr.scrollTop = fy * zi.offsetHeight - window.innerHeight / 2; }
      };
      $('.zoom-x', z).onclick = function () { z.remove(); document.removeEventListener('keydown', zkey); };
      var zkey = function (e) { if (e.key === 'Escape') { z.remove(); document.removeEventListener('keydown', zkey); } };
      document.addEventListener('keydown', zkey);
      document.body.appendChild(z); fit();
    }

    function onKey(e) {
      if ($('.zoom')) return;
      if ($('.sheet')) { if (e.key === 'Escape') closeSheet(); return; }
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    }
    document.addEventListener('keydown', onKey);
    var rt; function onResize() { clearTimeout(rt); rt = setTimeout(relayout, 150); }
    window.addEventListener('resize', onResize);
    // wheel on desktop
    var wheelLock = 0;
    vp.addEventListener('wheel', function (e) {
      var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(d) < 20 || Date.now() < wheelLock) return;
      wheelLock = Date.now() + 350; if (d > 0) next(); else prev();
    }, { passive: true });

    slider.addEventListener('input', function () { i2.textContent = t('page') + ' ' + pgList[+slider.value] + ' / ' + pgList[pgList.length - 1]; });
    slider.addEventListener('change', function () { goBookPage(pgList[+slider.value]); });

    // ---- sheets
    function closeSheet() { var a = $('.sheet'), b = $('.sheet-bg'); if (a) a.remove(); if (b) b.remove(); }
    function openSheet(html) {
      closeSheet();
      var bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.onclick = closeSheet;
      var sh = document.createElement('div'); sh.className = 'sheet'; sh.innerHTML = html;
      document.body.appendChild(bg); document.body.appendChild(sh);
      return sh;
    }

    $('.b-toc').onclick = function () {
      var html = '<h3>' + esc(t('contents')) + '</h3>' +
        '<div class="goto"><input type="number" inputmode="numeric" placeholder="' + esc(t('gotoPage')) + '"><button class="btn primary">' + esc(t('go')) + '</button></div><div class="toc">';
      var lastSec = null;
      chapters.forEach(function (c, ci) {
        if (c.section && c.section !== lastSec) html += '<div class="sec">' + esc(c.section) + '</div>';
        lastSec = c.section || lastSec;
        html += '<a href="#" data-c="' + ci + '" data-b="0"' + (ci === ch ? ' class="cur"' : '') + '>' + esc(c.title) +
          (c.pages ? '<span class="p">' + c.pages[0] + '</span>' : '') + '</a>';
        if (c.sub) {
          c.sub.forEach(function (s) {
            if (s.b != null) html += '<a href="#" class="sub" data-c="' + ci + '" data-b="' + s.b + '">' + esc(s.title) + '</a>';
          });
        } else {
          c.blocks.forEach(function (b, bi) {
            if (b.t === 'h2' && bi > 0) html += '<a href="#" class="sub" data-c="' + ci + '" data-b="' + bi + '">' + b.h.replace(/<[^>]+>/g, '') + '</a>';
          });
        }
      });
      var sh = openSheet(html + '</div>');
      var cur = $('.cur', sh); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'center' });
      sh.addEventListener('click', function (e) {
        var a = e.target.closest('a[data-c]'); if (!a) return;
        e.preventDefault(); closeSheet(); reader.classList.remove('ui');
        goBlock(+a.getAttribute('data-c'), +a.getAttribute('data-b'));
      });
      var inp = $('input', sh);
      function go() { if (goBookPage(parseInt(inp.value, 10))) { closeSheet(); reader.classList.remove('ui'); } }
      $('.goto button', sh).onclick = go;
      inp.onkeydown = function (e) { if (e.key === 'Enter') go(); };
    };

    $('.b-set').onclick = function () {
      function seg(key, opts) {
        return '<div class="seg" data-k="' + key + '">' + opts.map(function (o) {
          return '<button data-v="' + o[0] + '"' + (o[2] ? ' class="' + o[2] + (String(S[key]) === String(o[0]) ? ' on' : '') + '"' : (String(S[key]) === String(o[0]) ? ' class="on"' : '')) + '>' + o[1] + '</button>';
        }).join('') + '</div>';
      }
      var sh = openSheet(
        '<h3>' + esc(t('settings')) + '</h3>' +
        '<div class="set"><label>' + esc(t('fontSize')) + '</label><div class="seg"><button data-fs="-2" style="font-size:14px">A−</button><button class="fsv" disabled>' + S.fs + '</button><button data-fs="2" style="font-size:20px">A+</button></div></div>' +
        '<div class="set"><label>' + esc(t('theme')) + '</label>' + seg('theme', [['light', t('light'), 'swatch'], ['sepia', t('sepia'), 'swatch'], ['dark', t('dark'), 'swatch'], ['contrast', t('contrast'), 'swatch']]) + '</div>' +
        '<div class="set"><label>' + esc(t('font')) + '</label>' + seg('font', [['serif', '<span style="font-family:Georgia,serif">' + esc(t('serif')) + '</span>'], ['sans', '<span style="font-family:Roboto,Arial,sans-serif">' + esc(t('sans')) + '</span>']]) + '</div>' +
        '<div class="set"><label>' + esc(t('spacing')) + '</label>' + seg('lh', [[1.35, '1.35'], [1.55, '1.55'], [1.8, '1.8']]) + '</div>' +
        '<div class="set"><label>' + esc(t('lang')) + '</label>' + seg('ui', [['ru', 'Русский'], ['ky', 'Кыргызча']]) + '</div>');
      sh.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.hasAttribute('data-fs')) {
          S.fs = Math.max(13, Math.min(34, S.fs + +b.getAttribute('data-fs')));
          $('.fsv', sh).textContent = S.fs;
        } else {
          var k = b.parentNode.getAttribute('data-k'); if (!k) return;
          var v = b.getAttribute('data-v'); S[k] = k === 'lh' ? +v : v;
          Array.prototype.forEach.call(b.parentNode.children, function (x) { x.classList.toggle('on', x === b); });
          if (k === 'ui') { applySettings(); closeSheet(); route(); return; }
        }
        applySettings(); relayout();
      });
    };

    cleanup = function () {
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('resize', onResize);
      closeSheet();
    };

    var pos = lsGet(posKey, null);
    if (pos && chapters[pos.ch]) goBlock(pos.ch, pos.b || 0); else { renderChapter(0); show(0, false); }
    // fonts can change metrics after first paint
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  }

  // ---------------------------------------------------------------- boot
  applySettings();
  window.addEventListener('hashchange', route);
  route();
  if (!EMB && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline support unavailable */ });
  }
})();
</script>
</body>
</html>

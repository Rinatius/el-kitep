<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Русский язык 11</title>
<style>/* Mobile textbook reader. No external fonts or libraries: everything works offline. */
:root {
  --bg: #ffffff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3;
  --panel: #f6f6f6; --accent: #1f6feb; --accent-fg: #ffffff;
  --fs: 19px; --lh: 1.55;
  --font: Georgia, "Noto Serif", "DejaVu Serif", "Times New Roman", serif;
  --bar-h: 48px; --foot-h: 28px;
}
[data-theme="sepia"] { --bg: #f5ecd9; --fg: #4a3b2a; --muted: #8a7458; --line: #e0d2b4; --panel: #ece0c6; --accent: #9a5b13; }
[data-theme="dark"]  { --bg: #111315; --fg: #d8d8d8; --muted: #8c8c8c; --line: #2a2d31; --panel: #1b1e21; --accent: #6ea8ff; --accent-fg: #0b0b0b; }
[data-theme="contrast"] { --bg: #000000; --fg: #ffffff; --muted: #c8c8c8; --line: #444; --panel: #151515; --accent: #ffd400; --accent-fg: #000; }
[data-font="sans"] { --font: Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 16px/1.4 Roboto, "Noto Sans", Arial, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- Library ---------- */
.lib { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lib h1 { font-size: 22px; margin: 8px 0 4px; }
.lib .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.lib-head { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
.lib-head h1 { flex: 1; margin: 0; }
.school { display: flex; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.school button { flex: 1; min-height: 44px; padding: 0 10px; font-size: 15px; background: var(--panel); }
.school button + button { border-left: 1px solid var(--line); }
.school button.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.my-link { flex: 0 0 auto; font-weight: 600; min-height: 40px; padding: 0 12px; font-size: 14px; }
.grade { margin-bottom: 10px; }
.grade-h { display: flex; width: 100%; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 18px; font-weight: 600; text-align: left; }
.grade-h::after { content: '›'; font-size: 24px; color: var(--muted); margin-left: 10px; transition: transform .15s; }
.grade.open .grade-h::after { transform: rotate(90deg); }
.grade-h .n { margin-left: auto; font-size: 14px; font-weight: 400; color: var(--muted); }
.grade-b { padding: 0 2px; }
.grade-t { font-size: 20px; margin: 18px 0 0; }
.subj { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.bk { border-bottom: 1px solid var(--line); padding: 4px 0 12px; }
.bk:last-child { border-bottom: 0; }
.bk-t { font-size: 17px; font-weight: 600; }
.bk-s { font-size: 14px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bk-m { color: var(--muted); font-size: 13px; margin: 3px 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: .5; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.bk-h { display: flex; align-items: flex-start; gap: 4px; }
.bk-h .bk-t { flex: 1; padding-top: 10px; }
.bk .row { gap: 4px; }
.bk .row .btn { min-height: 40px; padding: 0 18px; font-size: 14px; margin-right: 8px; }
.bk .icon { color: var(--muted); flex: 0 0 auto; }
.bk .icon[disabled] { opacity: .5; }
.bk .icon.on { color: var(--accent); }
.bk .star.on svg { fill: currentColor; }
.bk .star.on { color: #e3a008; }
.share-opts { display: flex; flex-direction: column; gap: 10px; }
.share-opts .note { margin-top: 0; }
.sheet h3 .icon { flex: 0 0 auto; }

/* ---------- Reader ---------- */
.reader { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; user-select: text; }
.viewport { position: absolute; left: 0; right: 0; top: 0; bottom: var(--foot-h); overflow: hidden; }
.flow {
  height: 100%; column-fill: auto; padding: 20px 0 12px;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  will-change: transform; transform: translate3d(0,0,0);
  hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
}
.flow.anim { transition: transform .25s ease-out; }
.flow p { margin: 0 0 .15em; text-indent: 1.4em; text-align: left; }
.flow p.ni { text-indent: 0; }
.flow h1, .flow h2, .flow h3 { font-family: Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.25; break-after: avoid; page-break-after: avoid; }
.flow h1 { font-size: 1.35em; margin: .2em 0 .8em; text-align: center; }
.flow h2 { font-size: 1.15em; margin: 1.1em 0 .5em; }
.flow h3 { font-size: 1.0em; margin: 1em 0 .4em; }
.flow .verse { margin: .6em 0 .8em 1em; break-inside: auto; }
.flow .verse div { text-indent: -1em; padding-left: 1em; text-align: left; }
.flow .verse .gap { height: .7em; }
.flow figure { margin: .8em 0; text-align: center; break-inside: avoid; page-break-inside: avoid; }
.flow figure img { max-width: 100%; height: auto; border-radius: 4px; background: var(--panel); }
.flow figcaption { font-size: .8em; color: var(--muted); margin-top: .3em; }
.flow .box { border-left: 3px solid var(--accent); padding: .1em 0 .1em .7em; margin: .7em 0; }
.flow .pg { font: 11px/1 Roboto, Arial, sans-serif; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 4px; margin: 0 3px; vertical-align: 2px; text-indent: 0; white-space: nowrap; user-select: none; }
.flow .end { height: 1px; }
.flow .endnote { text-align: center; color: var(--muted); font-size: .8em; margin-top: 2em; font-family: Roboto, Arial, sans-serif; }
[data-theme="dark"] .flow img, [data-theme="contrast"] .flow img { filter: brightness(.9); }

.foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot-h); display: flex; align-items: center;
  justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.foot .t { overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }

.bar { position: absolute; left: 0; right: 0; background: var(--panel); border-color: var(--line); z-index: 5;
  transition: transform .2s; display: flex; align-items: center; }
.bar.top { top: 0; height: var(--bar-h); border-bottom: 1px solid var(--line); transform: translateY(-100%); padding: 0 4px; }
.bar.bottom { bottom: 0; border-top: 1px solid var(--line); transform: translateY(100%); padding: 10px 16px 14px; flex-direction: column; align-items: stretch; gap: 6px; }
.reader.ui .bar { transform: none; }
.bar .title { flex: 1; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.bar .info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* ---------- Sheets (TOC, settings) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85%; overflow: auto; background: var(--bg);
  border-radius: 16px 16px 0 0; z-index: 11; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
.sheet h3 { margin: 10px 0 12px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.toc a { display: block; padding: 11px 4px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 15px; }
.toc a.sub { padding-left: 20px; font-size: 14px; color: var(--muted); }
.toc a.cur { color: var(--accent); font-weight: 600; }
.set { margin: 14px 0; }
.set label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; }
.seg button.on { border: 2px solid var(--accent); font-weight: 600; }
.swatch[data-v="light"] { background: #fff; color: #1b1b1b; }
.swatch[data-v="sepia"] { background: #f5ecd9; color: #4a3b2a; }
.swatch[data-v="dark"] { background: #111315; color: #d8d8d8; }
.swatch[data-v="contrast"] { background: #000; color: var(--accent-fg); }
.goto { display: flex; gap: 8px; }
.goto input { flex: 1; min-height: 44px; font-size: 16px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px;
  border-radius: 20px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Textbook elements produced by tools/convert_pdf.py ---------- */
.flow .tasks, .flow .gloss { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45;
  background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0; }
.flow .tasks p, .flow .gloss p { margin: 0 0 .35em; text-align: left; }
.flow .gloss { border-left: 3px solid var(--accent); }
.flow p.note { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; font-style: italic; text-indent: 0; margin: .6em 0; }
.flow p.attr { text-align: right; text-indent: 0; font-style: italic; color: var(--muted); margin: .1em 0 .8em; }
.flow p.sep { text-align: center; text-indent: 0; color: var(--muted); margin: .5em 0; letter-spacing: .3em; }
.flow h2 .pg, .flow h3 .pg { font-weight: normal; }
.toc .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 4px 2px; }
.toc a .p { float: right; color: var(--muted); font-size: 13px; margin-left: 8px; }

/* ---------- Elements produced by tools/convert_layout.py (typeset textbooks) ---------- */
.flow figure img { cursor: zoom-in; }
.flow h4.mk { font: 700 .78em/1.3 Roboto, "Noto Sans", Arial, sans-serif; letter-spacing: .05em; color: var(--accent);
  margin: 1em 0 .3em; break-after: avoid; page-break-after: avoid; }
.flow p.hl { color: var(--accent); text-indent: 0; }
.flow p.small { font-size: .82em; text-indent: 0; color: var(--muted); }
.flow sup, .flow sub { font-size: .7em; line-height: 0; }
.flow .kbox { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45; background: var(--panel);
  border-radius: 8px; padding: .45em .7em; margin: .5em 0; border-left: 3px solid var(--accent); }
.flow .kbox > b { display: block; }
.flow .frame { background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0;
  font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; line-height: 1.45; }
.flow .frame p { text-indent: 0; margin: 0 0 .35em; text-align: left; }
.flow .tbl { margin: .8em 0; font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .8em; line-height: 1.35; }
.flow .tbl .tt { font-weight: 600; text-indent: 0; text-align: center; margin-bottom: .3em; }
.flow .tbl table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.flow .tbl th, .flow .tbl td { border: 1px solid var(--line); padding: .3em .35em; vertical-align: top; text-align: left; overflow-wrap: anywhere; hyphens: auto; }
.flow .tbl th { background: var(--panel); }
.flow .tbl tr { break-inside: avoid; page-break-inside: avoid; }

.zoom { position: fixed; inset: 0; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; background: rgba(0,0,0,.92); z-index: 30; }
.zoom-in { position: absolute; inset: 0; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
.zoom-in img { margin: auto; flex: none; touch-action: pan-x pan-y; object-fit: contain; background: #fff; cursor: zoom-in; }
.zoom-x { position: absolute; top: 8px; right: 8px; color: #fff; background: rgba(0,0,0,.5); z-index: 31; }
.flow h4.sh { font: 700 .95em/1.3 Roboto, "Noto Sans", Arial, sans-serif; text-align: center; margin: .8em 0 .4em; break-after: avoid; page-break-after: avoid; }

/* maths books */
.flow h4.ex, .flow h4.try { font-family: Roboto, Arial, sans-serif; margin: 1.1em 0 .3em; font-size: 1em; }
.flow h4.ex { display: inline-block; background: #f7e400; color: #111; padding: .1em .6em; border-radius: 3px; }
.flow h4.try { color: var(--accent); }
.flow p.goal { font-size: .85em; text-indent: 0; background: var(--panel); border-radius: 8px; padding: .4em .7em; }
.flow b.bd { display: inline-block; text-indent: 0; padding: 0 .4em; border-radius: 1em; background: var(--fg); color: var(--bg);
  font: bold .8em/1.45 Roboto, Arial, sans-serif; margin-right: .2em; }
.flow b.nb { display: inline-block; text-indent: 0; min-width: 1.4em; border-radius: 4px; background: var(--accent); color: var(--accent-fg);
  text-align: center; font-size: .8em; margin-right: .3em; }
.flow .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.15; margin: 0 .1em; }
.flow .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .15em; }
.flow p.ml { text-indent: 0; padding-left: 1em; }
.flow p.side { font-size: .85em; }
.flow details.ans { margin: .3em 0 .8em; font-size: .9em; }
.flow details.ans summary { color: var(--accent); cursor: pointer; font-family: Roboto, Arial, sans-serif; }

/* wide tables become one card per row on phones */
@media (max-width: 560px) {
  .flow .tbl.cards table, .flow .tbl.cards tbody, .flow .tbl.cards tr, .flow .tbl.cards td { display: block; width: auto; }
  .flow .tbl.cards tr:first-child { display: none; }
  .flow .tbl.cards tr { border: 1px solid var(--line); border-radius: 8px; margin: .5em 0; padding: .3em .5em; }
  .flow .tbl.cards td { border: 0; padding: .15em 0; }
  .flow .tbl.cards td::before { content: attr(data-l); display: block; font: 600 .75em/1.3 Roboto, Arial, sans-serif; color: var(--muted); }
  .flow .tbl.cards td:first-child { font-weight: 600; }
}
.flow figure.vec svg { max-width: 100%; height: auto; display: inline-block; background: #fff; border-radius: 4px; cursor: zoom-in; }
[data-theme="dark"] .flow figure.vec svg, [data-theme="contrast"] .flow figure.vec svg { filter: brightness(.9); }
.flow .rt { border-top: 1px solid currentColor; padding-top: 1px; margin-left: 1px; }
.flow .it { display: inline-block; max-width: 100%; margin-right: .9em; text-indent: 0; }
</style>
</head>

","h":"3-15 Русский язык. Синтаксис русского языка: Учебник для 11 кл, кырг. шк. – 3-е изд., перераб. и доп. – Б.: Инсанат,"},{"t":"p","h":"Учебник представляет собой реализацию новых образовательных технологий в преподавании синтаксиса русского языка в кыргыз- ской школе."},{"t":"p","h":"Материалы учебника направлены на формирование мировоззрения учащихся и их коммуникативной компетенции. Обучающий потенциал учебника реализуется на основе разностилевых и разножанровых текстов, глубоко продуманной системы упражнений и языковых таблиц."},{"t":"p","h":"В помощь учащимся в учебник включены русско-кыргызский словарь, справочные материалы и ключи к заданиям."},{"t":"v","l":["Одобрен комиссией","Республиканского Национального конкурса","и выпущен на средства Министерства образования и науки","Кыргызской Республики."]},{"t":"h3","h":"ББК 81.2Р я 721"},{"t":"v","l":["Т5ВМ 978-9967-452-40-4 о Задорожная Н. П., Идрисова Дж. Н., 2012","© Министерство образования и науки КР, 2012","© Издательство «Инсанат, 2012"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"3\">3<\/span>Дорогой друг!"},{"t":"p","h":"У тебя начинается последний учебный год. Впереди самостоятельная жизнь. В ней человек никогда не бывает один, и как важно при этом уметь общаться: запрашивать информацию, обмениваться мнениями, отстаивать свою точку зрения – не только на родном языке, но и на русском. Тебе предстоит осваивать выбранную профессию, а ведь нет профессии, которая не требовала бы умения говорить. Мы надеемся, что наш учебник поможет тебе вспомнить и обобщить всё, что ты изучал в предшествующие годы на уроках русского языка, связать свои знания о языке с речевой практикой. Вместе с нами – от слова к слову, от слова к предложению, от предложения к тексту, шаг за шагом к свободной речи:"},{"t":"p","h":"Авторы учебника"},{"t":"h3","h":"Условные обозначения:"},{"t":"p","h":"– тренировочные, языковые (устные,"},{"t":"p","h":"письменные) упражнения"},{"t":"p","h":"Е – предкоммуникативные, коммуникативные упражнения"},{"t":"p","h":"– правила-информации, правила-"},{"t":"p","h":"инструкции"},{"t":"v","l":["Ф $ – для справок","","– лексические упражнения"]}],"sub":[{"title":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК ГИМНИ","b":1},{"title":"ББК 81.2Р я 721","b":3},{"title":"Рецензент","b":5},{"title":"ББК 81.2Р я 721","b":12},{"title":"Дорогой друг!","b":14},{"title":"Условные обозначения:","b":17}],"pages":[0,3]},{"title":"ТЕМА 1 ТЕКСТ. СЛОЖНОЕ СИНТАКСИЧЕСКОЕ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"5\">5<\/span>ТЕМА 1"},{"t":"h2","h":"ТЕКСТ. СЛОЖНОЕ СИНТАКСИЧЕСКОЕ"},{"t":"img","src":"data:image/webp;base64,UklGRuwvAABXRUJQVlA4IOAvAACwAgGdASrkAUIBPrVSokwnJKqqptX8KVAWiWkHITs9P/lWgHboPPrI9eH8Omvzk/RdFrNf61/d+Y33HTof4ngT+teIpkL2bHZeYp9Nfx+MzxK+Nj/Feol/T/RT/4S9GmVjlN4N2tSAIENWkWFcqBhJa5Ik0URNJFqFQMjBihBJh3sXqcfR+5dzBPMJ/0A4EhXSLQdl2hSjZjQlR2HDc6CJVpzz1rgUDmvNsgJ7HcrHEoqXCoKgNWeQStil6Jg10RiNKTVjiCAofPWCgUbljGsgvWHvUSLTxikQBWn7XJThnwxZsXky0gQ9s+dkGowFDq9xjPpOYBQ3Iwy8tGaies7xh1qlsneYUJ0QUFjFVxY4iexe4+d+ZimFmKIWcbbcFsvrh4Yw2rFiTLrtDvrwbmYlbR3cfesCWwlrlJN6NK5TobEFnH3YnwTgQmRjf3/BI/UCP7b+ZxAoQJtBbLoDlkyRMzC5CFkhlcsmMv+XTgfVt5W2Q8Tq8cB3dp3QKbs8cAbuySUQ9mUeTNDSd0yzejSuQxowlbxnwMbnvWgWqFTS4vHtY4j9d0ctLB+Nz152julGE308+OYeRMlkK8cPSsmZadOB6R0L1WFibknExNFLlQ20kttbqQMUYColYOVEtr66bD1112MwIamM+imZHdVe10NgFxhtNeudTdlTarDwsg36gp8KZZfQBw3ErE0gMBrFLV66T2ikkrntxuBP/Da2Mz8AlGMBtkPOdaFoscBiZOG0zNsPXPOAs2YJyEP5TuOygWxMx95FQuQv6O1xtuOQfwJLpyzkWUbiCI+6KS1G8wn90WS9VQPIYwnetlEL8gh45OcbO2YFdTsa7FU/ntja77DU6TX0njp5gbb8XjyVGI+xBTPAE1zW6rvB8l+ORhsGfn5e97FitkXo84b8wdkGynFIessUyKxGkwS7cYoW1R5P/bGlHwPNPVc8FLco28dG/Q3D/T8H7HSbR9oGsiCCx/Ts6m/csT0XxPQy14zZpflmOkAX7srLqlcHQVfP0ROqhk1utkB+sJPcT+ZyHPiZxzD1ud4pRE4NeprvvdHD2sEMuZpBNxx8hCNDkdG4r7AhAnO9q4tpeMPg7atytrv88JcyfqpptP5NMqDN2iT0on2n84+enFcSLsm9Ozaovf+i3LSn6cFfdX4VE82b9aEMpqCEOCbdVvRzxjYzCN+TrAcSEPIbjSpXsd2/eEzAhKJtYaSw4MeE5a8pUzIxxyIfRIF56rG8thSL3LhnkB2MdIfbWKEEvn1a1q8fOD+o+rg3ngQZVrIVSHLeUJgGL92reaiMrZfXS24WcoaCHpHLuos0oDGaiXraGl8/jaYiIraXzakWRnEMH8s9X4jT9 "t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 2. Прочитайте текст. Сколько частей можно выде- Г.Ф] лить в нем? Озаглавьте выделенные части."},{"t":"h3","h":"НУЖНО УМЕТЬ ОБЩАТЬСЯ"},{"t":"p","h":"Люди с радостью общаются с теми, кто много видел, испытал, читал, размышлял. Чтобы стать интересным собеседником, нельзя замыкаться в себе самом. Лучше обратить внимание на окружающих людей, на природу и жизнь своей родины. Ведь мы часами можем с удовольствием слушать друзей, приехавших даже из недальнего путешествия и показывающих фотографии. Нас захватывает беседа с другом об интересной книге. Нам нравится общаться с людьми, увлечёнными марками, фотографированием, видеосъёмками, компьютерами или еще чем-либо. Вопросы возникают сами собой, и разговор заинтересовывает всех. Наоборот, вызывают т"},{"t":"p","h":"<span class=\"pg\" data-n=\"8\">8<\/span>разочарование люди, которые то и дело рассказывают лишь о том, что им удалось купить, продать. Быстро становится скучно. Общение не приносит удовлетворения."},{"t":"h3","h":"Словарь"},{"t":"p","h":"замыкаться в себе – ни с кем не общаться"},{"t":"p","h":"у Акак вы думаете, что нужно для того, чтобы быть интерес- ным собеседником?"},{"t":"p","h":"Почему эту группу предложений мы называем текстом? Что помогает объединить предложения в текст?"},{"t":"p","h":"по смыслу. 2. Когда люди говорят друг с другом, они создают текст. 3. И тексты, и их элементы-высказывания бывают очень разнообразными. 4. Кроме того, тексты строятся с учётом конкретного адресата, вида общения – официального или неофициального, тематики и многого другого. 5. Это зависит от различных причин: письменной или устной формы речи,"},{"t":"p","h":"<span class=\"pg\" data-n=\"9\">9<\/span>Чтобы общаться (устно или письменно), нужно уметь правильно строить текст-высказывание:"},{"t":"p","h":"1) выделить тему высказывания и её микротемы;"},{"t":"p","h":"2) последовательно разворачивать их через предложения, грамотно используя при этом средства языка."},{"t":"p","h":"Задание 4. Прочитайте текст. Найдите в нём лексические п повторы. Замените их, где это возможно, местоимениями. Запишите исправленный текст в тетрадь."},{"t":"p","h":"Для успешного общения необходима культура речи. В наше время как никогда важно владеть культурой речи. Культура речи – это умение грамотно, ясно и красиво выражать свои мысли. Если человек не владеет культурой речи, то он общается плохо, неумело. Культуре речи надо учиться."},{"t":"p","h":"В речи, в тексте предложения связаны друг с другом по смыслу. Такая группа предложений образует синтаксическую единицу – сложное синтаксическое целое (ССЦ). Смысловая связь предложений в ССЦ осуществляется с помощью различных языковых средств: повторения слов, употребления личных и указательных местоимений, наречий, союзов, вводных слов, порядка слов."},{"t":"v","l":["Задание 5. Прочитайте тексты. Перескажите один из них.","","а) Стою в очереди за овощами. Продавщица кричит: “Не","такой лук, не такой лук! Ну и не берите!” Покупательнице","можно было бы “взорваться”, но она вдруг сказала: “Раз вы","так рассердились, значит, я в чём-то виновата. Извините","меня”. И вдруг что-то случилось вокруг. С продавщицей. С"]},{"t":"p","h":"очередью. Со всеми вместе и с каждым в отдельности. И про-"},{"t":"v","l":["давщица больше не кричала, и покупатели как бы впервые","заметили друг друга.","У Что отличает эту покупательницу и продавщицу?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"10\">10<\/span>6) Посмотрите, всё в человеке нужно самому себе: глаза – смотреть, ноги – ходить, рот – поглощать пищу. Только улыбка самому себе не нужна. Если бы не зеркало, вы её никогда бы даже и не увидели. Улыбка – для других людей, чтобы им с вами было хорошо, радостно и легко. Это ужасно, если за десять дней тебе никто не улыбнулся и ты никому не улыбнулся. Душа озябнет и окаменеет."},{"t":"p","h":"По В. А. Солоухину у Что ещё нужно для успешного общения?"},{"t":"p","h":"Задание 6. Дайте своему другу совет, который поможет ему успешно общаться с людьми. Запишите этот совет в тетрадь в виде связного текста."}],"sub":[{"title":"СПОСОБЫ СВЯЗИ В СЛОЖНОМ СИНТАКСИЧЕСКОМ ЦЕЛОМ","b":2},{"title":"НУЖНО УМЕТЬ ОБЩАТЬСЯ","b":27}],"section":"ШАГ НАВСТРЕЧУ","pages":[6,10]},{"title":"Урок 2. МОНОЛОГ (ОПИСАНИЕ,","blocks":[{"t":"h3","h":"Урок 2. МОНОЛОГ (ОПИСАНИЕ,"},{"t":"h3","h":"ПОВЕСТВОВАНИЕ, РАССУЖДЕНИЕ) ОБЩАЕМСЯ ЧЕРЕЗ ПИСЬМО ОТ СЛОВА К СЛОВУ"},{"t":"h3","h":"Опорные слова"},{"t":"v","l":["извини(-те)","прости(-те) за молчание","прошу извинения | за то, что не смог ответить сразу"]},{"t":"raw","h":"<h4 class=\"mk\">(прощения) разрешите весна<\/h4>"},{"t":"v","l":["что долго не отвечал(-ла) на Ваше письмо","","принести (Вам глубокие) извинения","","прекрасная","хорошая","лето |в самом разгаре","зима","","температура","погода (стоит) (у нас) | плохая","жаркая","дождливая","","плюс 10 градусов"]},{"t":"raw","h":"<h4 class=\"mk\"><span class=\"pg\" data-n=\"11\">11<\/span>обещаю думаю я считаю надеюсь думаю До свидания! Всего хорошего! Всего доброго! Обнимаю и целую<\/h4>"},{"t":"v","l":["уверен.","мне","думается","я","убеждён","кажется","согласен","","передай(-те) | привет","","Целую...","Крепко жму руку","С уважением..."]},{"t":"p","h":"1. В приведенных ниже отрывках из писем выделите формулы"},{"t":"p","h":"извинения. Определите тип письма (официальное, неофициальное)."},{"t":"p","h":"1. Извини меня, дорогая Катенька, что не сразу выполнила твою просьбу. 2. Вы, вероятно, долго ждали моего письма."},{"t":"p","h":"3. Простите, Мария Ивановна, за молчание. Не обижайтесь на меня за это."},{"t":"v","l":["2. Дайте краткое описание летней погоды.","Лето .... Погода .... Температура ....","","3. Приведите выражения, антонимичные данным."]},{"t":"p","h":"1. Я тоже так считаю. 2. Разумеется, я не согласен с вами."},{"t":"p","h":"3. Я не думаю, что книга интересна. 4. Я не убеждён, что он хороший товарищ. 5. Этого нельзя отрицать."},{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 1. Прочитайте письмо. Как вы думаете, оно официальное или неофициальное? Почему? Как начинается письмо? Как завершается? Какие смысловые части можно выделить в нём?"},{"t":"p","h":"20.10.2000 Здравствуй, Медет!"},{"t":"p","h":"Был очень рад получить от тебя письмо. Не смог сразу ответить. Начался новый учебный год, у меня было много всяких дел."},{"t":"p","h":"<span class=\"pg\" data-n=\"12\">12<\/span>Начинать учиться в новой школе всегда непросто. Не знаешь никого из класса, не знаешь учителей."},{"t":"p","h":"Но ребята в классе, в общем, оказались неплохие, и моя учёба идет вовсю. Я стараюсь заниматься много, не хочу быть в последних рядах."},{"t":"p","h":"Вспоминаю наш отдых на Иссык-Куле. Все-таки было хорошо. Особенно, помнишь, когда мы отправились в горы. Неожиданно полил дождь. Мы спрятались под скалой, а вечером развели костёр и пекли картошку."},{"t":"p","h":"Вспоминаю солнце! У нас его уже три дня не видать. Зарядил дождь, мелкий, косой. Это надолго. На неделю точно. Хорошее время, чтобы писать письма."},{"t":"p","h":"Надеюсь, что мы ещё с тобой встретимся и так же хорошо отдохнём."},{"t":"p","h":"Как твои дела в школе? Учёба? Видел ли ты Венеру? Передавай ей привет от меня. Буду рад получить от тебя письмо."},{"t":"p","h":"До свидания. Виктор"},{"t":"p","h":"Все тексты делятся на тексты-повествования (рассказ о чём-либо), тексты-описания и тексты-рассуждения (в них доказывается что-либо)."},{"t":"p","h":"Каждый тип текста имеет свои языковые особенности. Однако следует иметь в виду, что в речевой практике повествование, описание, рассуждение чаще всего встречаются вместе."},{"t":"p","h":"Задание 2. Прочитайте письмо ещё раз. Найдите в нем эле- КТ менты описания, повествования, рассуждения."},{"t":"p","h":"Задание 3. Ответьте на вопросы, которые поставлены в приведенных ниже текстах. Какие типы текстов при этом вы будете строить?"},{"t":"p","h":"а) Кажется, совсем недавно было лето, и мы вместе отдыхали. Помнишь? А сейчас у нас уже осень. Вчера дул сильный ветер. Уже почти все деревья потеряли листья. Сегодня идёт дождь. Стало холодно."},{"t":"p","h":"А какая погода у вас? Тепло ли? Идут ли дожди?"},{"t":"p","h":"<span class=\"pg\" data-n=\"13\">13<\/span>6) Скоро приближается лето, каникулы. Не знаю, как лучше отдохнуть. Может, мне поехать на Иссык-Куль? Давно не был там. Как ты думаешь, смогу ли я отдохнуть там хорошо и не очень дорого?"},{"t":"p","h":"в) Вчера я сдал последний экзамен. Утром очень волновался. Когда пришёл в школу, наши уже все собрались. Никто не хотел идти первым, но я решился. Подумал, что так будет лучше. Билет попался не очень трудный, и я хорошо ответил."},{"t":"p","h":"Потом подождал, когда Олег и Рустам сдадут, и мы все вместе отправились в рощу отдыхать."},{"t":"p","h":"Я знаю, ты волновался за экзамен по математике. Как ты ее сдал? Все нормально?"},{"t":"p","h":"случаях у вас был ответ-описание, ответ-повествование, ответ-рассуждение? Почему вы так думаете?"},{"t":"p","h":"Задание 4. Прочитайте одно из мнений о том, как лучше отдыхать. А какой вид отдыха нравится вам?"},{"t":"p","h":"За весь учебный год так устаешь от шумных одноклассников, от бесконечных уроков, домашних заданий. Так хочется побыть одному, посидеть спокойно у телевизора, послушать музыку. Никуда не хочется ехать..."},{"t":"p","h":"2; Задание 5. Расскажите о запомнившемся вам дне летнего отдыха. Какой тип текста вы выберете для своего рассказа? Е Задание 6. Напишите письмо друту, с которым вы позна- комились минувшим летом. Расскажите ему, как начался"},{"t":"p","h":"ваш учебный год. Как прошла встреча с одноклассниками после летних каникул. С каким настроением вы приступили к занятиям. Не забудьте правильно начать и завершить своё письмо."},{"t":"h3","h":"<span class=\"pg\" data-n=\"14\">14<\/span>Урок 3. СТИЛИ РУССКОГО ЯЗЫКА. МОНОЛОГ И ДИАЛОГ ГДЕ И КАК ГОВОРИТЬ"},{"t":"v","l":["Задание 1. Рассмотрите внимательно приведённую ниже","таблицу 1. Ответьте на вопросы к ней.","у Какие стили языка и речи вы знаете?","у Какие формы речи вы знаете?","у Какие жанры выделяются в научном, публицистическом,","художественном, разговорном, официально-деловом стилях?","","Таблица 1","Стили языка и речи"]},{"t":"h3","h":"Формы"},{"t":"v","l":["речи","Стили —_ Письменная","языка,","речи","Научный труд, реферат, Выступление, доклад,"]},{"t":"p","h":"сообщение, справочник сообщение на конфе-"},{"t":"p","h":"ренции, на уроке Передовая статья газеты, | Выступление на собраочерк, фельетон, интер- | нии, по радио, телевивью, репортаж, рецензия | дению Поэтическое,"},{"t":"raw","h":"<h4 class=\"mk\">ой литератур Разговорный й Официально-деловой<\/h4>"},{"t":"p","h":"Фольклор (сказка, ское произведение (робылина) ман, рассказ, басня) ское послание Письмо, записка, друже- Бытовой диалог д"},{"t":"p","h":"Постановление, обраще- нии, по радио, по теле- Выступление на собра-"},{"t":"v","l":["ние, заявление, протокол, видению с обращением,","автобиография","заявлением ит. п.","В зависимости от сферы деятельности человека в","языке сложились публицистический стиль, научный","стиль, стиль художественной литературы."]},{"t":"p","h":"<span class=\"pg\" data-n=\"15\">15<\/span>Общение людей может быть официальным или неофициальным. Отсюда различаются официально-деловой и разговорно-бытовой стили языка и речи."},{"t":"p","h":"Речь может быть устной и письменной."},{"t":"p","h":"Стиль – языковые признаки текста, отличающие разговорную и разновидности книжной речи одну от другой."},{"t":"p","h":"Задание 2. Прочитайте приведенные ниже два описания, определите стиль каждого из них. Какие особенности научного и художественного стиля вы можете назвать, сравнивая эти два текста? Ответить на этот вопрос вам поможет материал таблицы 2."},{"t":"h3","h":"А. РЯБИНА ОБЫКНОВЕННАЯ"},{"t":"p","h":"Небольшое дерево с непарноперистыми пильчатыми листьями. Цветки мелкие, белые, душистые, с многими тычинками и пестиками. Плоды – ярко-оранжевые костянки, неправильно называемые “ягодами”, – собраны в щитовидные кисти."},{"t":"p","h":"Встречается в лесных и лесостепных областях Европы. Часто культивируется как декоративное растение. Растет в подлеске хвойных и смешанных лесов, по вырубкам, прогалинам, лесным опушкам."},{"t":"p","h":"А. А. Алтымышев"},{"t":"p","h":"Б."},{"t":"p","h":"Она выросла случайно, незаконно, пристроилась на обочине, у высокого забора. Все тянулась к свету, и вот поднялась. Долговязая, как подросток, качает на ветру кудрявой головой."},{"t":"p","h":"Наступил август. Тонкие ветки рябинки согнулись под тяжестью ярко и празднично окрашенных гроздьев. Деревце запылало, как костер. Хороша была рябинка и в погожий день, когда гроздья смеялись навстречу солнцу, и после дождя, когда каждая ягода дрожала в капле воды и ветки <span class=\"pg\" data-n=\"16\">16<\/span>застенчиво протягивали свои длинные листья, как будто для рукопожатия."},{"t":"p","h":"По С. Соколовой Словарь"},{"t":"v","l":["обочина (дороги) – край дороги","долговязая – высокая, тонкая","гроздь – кисть ягод","погожий (день) – хороший, солнечный","рукопожатие – кол кармашуу, кол алышуу"]},{"t":"p","h":"Таблица 2"},{"t":"h3","h":"Художественный"},{"t":"p","h":"Смысловы Обобщенность, Конкретность, эмоциологичность"},{"t":"p","h":"Ед. число существительных для обознаморфолочения обобщенного гические"},{"t":"h3","h":"понятия"},{"t":"p","h":"Ф 5 Термины, однознач-"},{"t":"v","l":["8 5","к","","Неопределённо-лич","ные предложения"]},{"t":"p","h":"нальность, образность"},{"t":"p","h":"Ед. число для обозначения конкретного количества и мн. число для обозначения совокупности"},{"t":"p","h":"Мета ы, эпитеты"},{"t":"p","h":"Все типы предложений, содержание которых отличается образностью"},{"t":"p","h":"Задание 3. Прочитайте текст. К какому типу его можно отнести? Есть ли в нём описание? Какое из приведённых выше описаний вы бы добавили в данный текст и в какой его части?"},{"t":"h3","h":"РЯБИНКА"},{"t":"p","h":"Выросла рябинка при дороге..."},{"t":"p","h":"Шла мимо девочка. Увидела рябинку, поахала. Сказала:"},{"t":"p","h":"– Возьму-ка я одну веточку. Одна веточка – это ведь так мало. Ничего с деревцем не случится."},{"t":"v","l":["<span class=\"pg\" data-n=\"17\">17<\/span>И она по-своему была права.","Ехал на машине усатый дядька.","– Ух ты... Прямо картинка..."]},{"t":"p","h":"Он остановил машину, вылез из-за руля. Ветки рябины так и затрещали под его сильной рукой."},{"t":"p","h":"– Вот какая стоит богатая, небось, не обеднеет, если я захвачу для жены две-три ветки."},{"t":"v","l":["Что ж, он был по-своему прав.","Под вечер шли туристы."]},{"t":"p","h":"– Хорошая рябинка, правда, ломана немного. Ну, Зинка, чур, всем по одной ветке. Зря не брать, Витька, только по одной! Мы народ организованный, должны подавать пример..."},{"t":"p","h":"в сумерках влюбленный."},{"t":"p","h":"– Эх, какое дерево поломали, смотреть больно. Бездушные люди, не умеют беречь красоту! – На рябинке горела однаединственная яркая кисть, которую никто, видимо, не смог достать. Влюблённый был высокого роста, он встал на цыпочки и сумел-таки дотянуться. – Всё равно последняя кисть. Она уже дереву не поможет... А Люсенька обрадуется. На другой день приехал завхоз."},{"t":"p","h":"– Что ещё за уродец? – строго спросил он, наткнувшись на рябинку. – Убрать. Срубить. А то весь вид портит."},{"t":"p","h":"И он по-своему был прав."},{"t":"p","h":"В этой истории все правы. Виноватых нет. Но и рябинки тоже нет."},{"t":"p","h":"По С. Соколовой"},{"t":"p","h":"Словарь"},{"t":"v","l":["уродец – очень некрасивый","","у А как вы думаете, есть ли в этой истории виноватые?"]},{"t":"p","h":"у Составьте план рассказа “Рябинка”, подготовьтесь к его пересказу. Включите в пересказ своё мнение о виновниках гибели рябинки."},{"t":"p","h":"<span class=\"pg\" data-n=\"18\">18<\/span>Речь – конкретное говорение в целях общения. По характеру речь делят на диалог, полилог, монолог."},{"t":"p","h":"Диалог – смена высказываний двух (или несколь-"},{"t":"v","l":["ких – полилог) говорящих. Высказывания говорящих","в диалоге так связаны между собой, что в каждой","последующей реплике не говорится то, что известно","из предыдущей реплики или ситуации. Поэтому","в диалоге используются малораспространённые","предложения разных типов.","Монолог – ряд высказываний от первого лица,","адресованных определённому лицу или лицам."]},{"t":"p","h":"Задание 4. Прочитайте ещё один рассказ. В чём по своему содержанию он отличается от приведённого выше?"},{"t":"p","h":"Выделите в этом рассказе диалогическую речь."},{"t":"h3","h":"БЕРЁЗКА"},{"t":"v","l":["От дома лесника, где живет Димка с мамой и папой, до","деревни надо идти четыре километра. Димка туда в школу","ходит. Можно ехать на автобусе, но он любит ходить, если,","конечно, хорошая погода,","Дом Димки стоит около леса. От него до деревни дорога","по полю идёт. Деревьев там нет. Только в одном месте около","дороги стоит белая берёзка. Осенью летят с берёзки Димке","под ноги золотые листья.","Идёт он из школы. Песню о космонавтах Атоёт. Сегодня","Димка рад: пять по географии получил. Смотрит – на","дороге около берёзки остановилась машина. Шофёр вышел","из машины, стоит и думает, что делать. Не может машина","ехать, потому что на дороге яма.","Взял шофёр топор и пошёл к берёзке. Димка всё понял","и крикнул:","– Дядя! Подожди, не руби берёзку.","Но шофёр не слышит. Поднял топор. Димка побежал к","нему:","– Дядя! Дядя! – кричит,","<span class=\"pg\" data-n=\"19\">19<\/span>Шофёр смотрит на Димку.","– Что тебе, мальчик? – спрашивает.","– Дядя, не руби берёзку. Она маленькая."]},{"t":"p","h":"– Сам вижу, что маленькая, – говорит шофёр. – А что делать? Видишь – яма. Надо что-нибудь под колеса положить."},{"t":"p","h":"– Я в деревню за трактором побегу, – говорит Димка."},{"t":"p","h":"– Ну нет! У меня времени мало. Я опаздываю..."},{"t":"p","h":"– Тогда... Тогда я камней принесу. Они здесь недалеко. Их весной привезли. Дорогу будут строить. Я сейчас, быстро. Побежал Димка за камнями. Принёс. Глаза весёлые."},{"t":"p","h":"– Куда бросать? – спрашивает."},{"t":"p","h":"Шофеёр не ответил и тоже пошёл за камнями. Вместе они носили камни, бросали их под колеса. И вот можно ехать. Сел шофёр в машину."},{"t":"v","l":["– Тебе куда? – спрашивает он Димку.","– Мне к лесу.","– Ну, садись. Поедем."]},{"t":"p","h":"Быстро бежит машина. Вот и лес. Шофёр остановился."},{"t":"p","h":"– Ну, до свидания, – сказал шофёр и улыбнулся. – Спасибо тебе, мальчик."},{"t":"p","h":"у За что поблагодарил шофёр мальчика?"},{"t":"p","h":"у Какой вы себе представляете берёзку? Опишите её. В каком стиле вы построите своё описание? А к какому стилю относится диалог между мальчиком и шофёром? Почему?"}],"sub":[{"title":"Урок 3. СТИЛИ РУССКОГО ЯЗЫКА. МОНОЛОГ И ДИАЛОГ ГДЕ И КАК ГОВОРИТЬ","b":41},{"title":"Формы","b":43},{"title":"А. РЯБИНА ОБЫКНОВЕННАЯ","b":55},{"title":"Художественный","b":65},{"title":"РЯБИНКА","b":76},{"title":"БЕРЁЗКА","b":99}],"section":"ШАГ НАВСТРЕЧУ","pages":[11,19]},{"title":"ТЕМА 2","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"20\">20<\/span>ТЕМА 2"},{"t":"img","src":"data:image/webp;base64,UklGRqQtAABXRUJQVlA4IJgtAADwAAGdASrBAUMBPrVQokqnJSqkqLKNOVAWiWluiGldUFQ0lZMV/Eat8MOrr521k+aNdaar5ufxPDv8e+w/33+A/zXqtaF+1fU4+dfmTIzzW+fuo7kX2+oWH8DsFSm2lP9w9C70au00Mnot+DKT9q/eCCIDNr3W+DcaBvMpK195+iqAJNVFHhiVJQGdPCRb9CKl4mGAxW9o81zhb6kiptIV6iLSG7kf8/5ENLL9yd6cDGf/l7EkBEcDRmylSLz5AdVkoLjTlQH8mSLQp+YRGkEOQwo9mPorJoa0MZqR/ZbzFAFKk+EXvRIaCnfKd74j8tOck18xriGKVxNH2Pg/fMWJrYjh4Cu1uE9spvA3A/ni50oTRMjckQE1ePZ/RF5WRSUw5wYuMrQ5eQi8zcKeuP38b4adqH2ekw1kYrTjN0HmaBjIe5t4GHtVnzLk0P+kHHarYADXb2eV65bB14+HmOWGMgtx7qTHDQT5FWrQhWYjq2b3/tYTCAzVyuN9ESlcn3IAkJiUzv5gaq/cNYbfqDRQzmA0Jtn3VDNeKJpTHQJP2b2hwDkdTMMuv9BjsWlp0yDjYSxQd1pUXchPjATo7YJIFzz/auqE7/ELmVPzpyaP2n1L9Wl+SkuaBWgZhKAgWNuvUgY7jTR13pFNxJfwjkJQ4IOtyaridEaFWmv/wrrrMdaXO1f8xf65NJ0B6iszQlQG6fzUbHBjOy9wXkb55iASdQdU75E25SefhebsdwYueKFoECk7xS8Ax7f5WvGQP5QVgi5fDLpHuaGxwWfOsd+iDegcgiF24QxfHafUVPNN+wV8QrwNFGXBrH3lWgUgJelPitrDXZs1slyXalm+3jd3aHjLYtatJzv8FIkYP1mMawUTiMMY+i/HpMyMFrby+L6P1+tWNxf6Jsee1XWapA5STF+MAJtjDnGAHZ4wBOzajetcrdrKZ ЗЫВАНИЯ ДОРОГИ, КОТОРЫЕ МЫ ВЫБИРАЕМ Урок 1. КЕМ БЫТЬ?","b":2}],"section":"ШАГ НАВСТРЕЧУ","pages":[20,22]},{"title":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ","blocks":[{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"я Задание 3. Прочитайте данные ниже предложения с соответствующей интонацией. В этом вам поможет следующая информация,"},{"t":"p","h":"В повествовательном предложении голос повы-"},{"t":"v","l":["шается на логически выделенном слове и понижается","в конце предложения.","В вопросительном предложении голос повышается","на слове, с которым связан вопрос,"]},{"t":"p","h":"В восклицательных предложениях голос повышается на логически выделяемом слове и не понижается до конца предложения."},{"t":"p","h":"<span class=\"pg\" data-n=\"23\">23<\/span>1. После первого семестра студенты поехали на каникулы домой. 2. Как мы радовались встрече с космонавтами! 3. Как нам жить без радости? 4. Ты завтра уезжаешь в Бишкек?"},{"t":"p","h":"5. Проявите больше настойчивости в достижении цели!"},{"t":"p","h":"6. Расскажите нам что-нибудь из вашей жизни."},{"t":"p","h":"Задание 4. Запишите текст. Объясните знаки препинания в конце предложений."},{"t":"p","h":"О человеке судят прежде всего по работе, по его отношению к труду. Труд – главное предназначение человека на земле, и по-настоящему испытывать радость может лишь тот, кто любит свой труд, свое дело, свою профессию."},{"t":"p","h":"Однажды, обращаясь к школьникам, Ю. А. Гагарин сказал: “Дорогие ребята! Время распахнуло двери в жизнь. Вы на пороге выбора профессии. Но каждый из вас должен выбрать только одну."},{"t":"p","h":"Нет и не может быть самых лучших профессий в жизни. Есть только желание, настойчивость и труд. Только тогда вы по-настоящему узнаете радость труда. Смело шагайте в жизнь! Счастливой дороги, друзья!”"},{"t":"h3","h":"Словарь"},{"t":"p","h":"предназначение – роль, выпавшая на чью-либо долю, судьба"},{"t":"p","h":"у Какая мысль высказывается в этом тексте?"},{"t":"v","l":["и Чьи слова приводятся для ершите свое высказывание побудительным предложением."},{"t":"p","h":"1. Не будем огорчаться трудностями, ибо без трудностей нет и достижений. (Н. К. Рерих) 2. Когда человек не трудится совершенно серьёзно, то есть когда он не зарабатывает себе собственным трудом куска хлеба, которым он питается, – тогда он не может быть счастлив. (Д. И. Писарев) 3. Чтобы хорошо жить, по-человечески, – надо же работать! Работать с любовью, с верой. (А. П. Чехов)"},{"t":"p","h":"Чтобы доказать правильность какого-либо утвер-"},{"t":"raw","h":"<h4 class=\"mk\">3 От<\/h4>"},{"t":"p","h":"ждения, приведите в качестве аргументов высказывания известных людей об этом, примеры из жизни, известные факты."}],"sub":[],"section":"ШАГ НАВСТРЕЧУ","pages":[23,25]},{"title":"Урок 2. РАДИ НЕСКОЛЬКИХ СТРОЧЕК В ГАЗЕТЕ","blocks":[{"t":"h3","h":"Урок 2. РАДИ НЕСКОЛЬКИХ СТРОЧЕК В ГАЗЕТЕ"},{"t":"p","h":"Без впечатлений, восторгов, вдохновения, без жизненного опыта – нет творчества. Д. Д. Шостакович"},{"t":"h3","h":"К СЛОВУ Опорные слова"},{"t":"v","l":["факты","фиксировать","внимание","события"]},{"t":"h3","h":"данные"},{"t":"v","l":["жизненная","активная","позиция","решительная","целеустремлённая","выписывать","читать","газеты","получать","","напористый","энергичный","журналист","талантливый","настоящий","смелый"]},{"t":"p","h":"<span class=\"pg\" data-n=\"26\">26<\/span>публикация личное интересная корреспонденция Человеческое обаяние"},{"t":"raw","h":"<h4 class=\"mk\">статья необщительный нерешительный осторожный вялый напористый<\/h4>"},{"t":"v","l":["профессиональное","","быстро","оперативно","ответственно","работать","газетчик","честно","добросовестно"]},{"t":"h3","h":"Новые слова"},{"t":"p","h":"напористый – настойчивый, активно добивающийся своей цели обаяние – очарование, притягательная сила"},{"t":"v","l":["оперативно – быстро, вовремя выполнить что-либо","позиция – точка зрения, мнение в каком-нибудь вопросе","публикация – сообщение в печатном органе"]},{"t":"p","h":"фиксировать – отмечать на бумаге или в сознании (записывать,"},{"t":"p","h":"зарисовывать, запоминать) целеустремлённый – имеющий ясную и определённую цель,"},{"t":"p","h":"стремящийся кее достижению"},{"t":"v","l":["1. Составьте словосочетания.","","Делать (что?) ...","требуется (что?) ...","учиться (где?) ...","","2. Подберите синонимы.","иметь (что?) ...","быть (кем?) ...","писать","","Публикация – ...","газетчик – ...","обаяние – ...","позиция","","3. Подберите антонимы.","Известный – ...","...нерешительный – ...","ответственный – ...","замкнутый —","вялый – ...","осторожный – ..."]},{"t":"p","h":"<span class=\"pg\" data-n=\"27\">27<\/span>4. Назовите профессии людей, опираясь на данное толкование слов."},{"t":"p","h":"1. Автор художественных произведений – ..."},{"t":"p","h":"2. Тот, кто занимается обсуждением, разбором какого-либо дела, чтобы дать ему юридическую оценку – ..."},{"t":"p","h":"3. Человек, освещающий в печати те или иные фак-"},{"t":"p","h":"4. Ведущий какую-либо передачу на телевидении – ..."},{"t":"p","h":"5. Ведущий передачи по радио – ..."},{"t":"p","h":"ф Писатель, корреспондент, телеведущий, адвокат, У радиоведущий."},{"t":"p","h":"5. Образуйте от данных прилагательных имена существительные"},{"t":"p","h":"по модели прил. + -ость."},{"t":"v","l":["Оперативный – ...","важный – ...","ответственный – ...","зрелый – ...","энергичный – ..."]}],"sub":[{"title":"К СЛОВУ Опорные слова","b":2}],"section":"ШАГ НАВСТРЕЧУ","pages":[26,27]},{"title":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ","blocks":[{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 1. Прочитайте текст, соблюдая правильную интона-"},{"t":"p","h":"– цию. Как вы думаете, это повествование или рассуждение?"},{"t":"p","h":"Докажите. Выпишите предложения с прямым и обратным порядком слов. Какие жанры публицистического стиля упоминаются в этом тексте?"},{"t":"p","h":"Легко ли быть журналистом? Не любой человек может стать им. Для этого требуется не только определённый набор знаний, который можно получить на факультете журналистики, но и крепкий характер. Настоящим журналистом может стать только человек с активной жизненной позицией, борющийся за добро и справедливость. Такими журналистами были Джон Рид, Юлиус Фучик, Илья Эренбург, Константин Симонов, Александр Каверзнев и другие, не столь известные и вовсе безвестные газетчики."},{"t":"p","h":"<span class=\"pg\" data-n=\"28\">28<\/span>Профессиональному мастерству будущий журналист учится не только в стенах вуза, но и на практике. Журналист должен уметь выступать на различные темы и в разных жанрах. Каждый работник редакции должен уметь написать и репортаж из горячих точек, и фельетон о недостатках городского транспорта, а иногда и рецензию на премьеру в местном театре."},{"t":"v","l":["у Какой проблемный вопрос стоит в начале текста?","у Какой ответ (тезис) на этот вопрос дается в тексте?"]},{"t":"p","h":"у Какие факты приводятся для доказательства тезиса?"},{"t":"p","h":"Задание 2. Прочитайте текст. Какие вопросы вы зададите Я – для подтверждения выделенной информации?"},{"t":"p","h":"Главная особенность труда журналиста – оперативность. В основе любой публикации чаще всего лежит конкретный жизненный факт. А факты, как известно, быстро устаревают. Бесконечен поток редакционных заданий. Тяжела психологическая нагрузка. Велико чувство ответственности перед читателем."},{"t":"v","l":["Словарь","процесс – ход, развитие какого-либо действия"]},{"t":"p","h":"психологическая нагрузка – душевные трудности,"},{"t":"p","h":"которые переносит человек"},{"t":"p","h":"у Что нового вы узнали о профессии журналиста?"},{"t":"p","h":"у Почему оперативность – “главная особенность труда жур-"},{"t":"p","h":"налиста”?"},{"t":"p","h":"В вопросительных предложениях запрашивается информация. Они строятся с помощью вопросительных слов, частиц, вопросительной интонации, изменения порядка слов (при этом слово, с которым связан вопрос, стоит на первом месте)."},{"t":"p","h":"<span class=\"pg\" data-n=\"29\">29<\/span>Задание 3. Оформите следующее высказывание в виде Уют? побудительного предложения, поставив глаголы в форме"},{"t":"p","h":"повелительного наклонения. Кто и в какой ситуации мог это сказать?"},{"t":"p","h":"Необходимо иметь определенный набор знаний и твердый характер, обладать активной жизненной позицией, быть активным участником событий, быть борцом за добро и справедливость, заслужить право называться настоящим журналистом, уметь писать на разные темы и в разных жанрах."},{"t":"p","h":"Задание 4. Прочитайте текст. Определите его тип и стиль речи. Найдите в тексте предложения с отрицанием и запишите их в тетрадь."},{"t":"p","h":"Что же является условием успеха журналистского творчества? Общение."},{"t":"p","h":"Мало уметь сесть и описать тот или иной факт, вначале его надо понять, разобраться в нём, а всё это невозможно без общения с людьми. Иной человек – клад интереснейших мыслей и чувств, жизненных наблюдений, но вот рассказать об этом не может. И здесь многое зависит от умения журналиста спросить, “разговорить” собеседника, понять его внутренний мир. Необщительный, не владеющий искусством устной беседы газетчик никогда не станет хорошим журналистом. Энергичный, целеустремлённый, напористый журналист нередко добьётся большего, чем нерешительный, осторожный, вялый его коллега, пусть и более талантливый, чем он. Личное человеческое обаяние, выразительность жестов, красноречие – эти, на первый взгляд, “мелочи” помогают журналисту расположить к себе собеседника."},{"t":"h3","h":"Словарь"},{"t":"p","h":"красноречие – дар хорошо и красиво говорить,"},{"t":"h3","h":"ораторский талант"},{"t":"v","l":["у Какой проблемный вопрос ставится в этом тексте?","у Какой ответ (тезис) приводится в начале текста?","у Как доказывается его правильность?","у Ккакому выводу приходит автор?","<span class=\"pg\" data-n=\"30\">30<\/span>Задание 5. Выпишите вопросительные предложения из","ЫТТ текстов заданий 1 и 4. С помощью каких языковых средств","построены эти предложения?","","Задание 6. Прочитайте еще раз тексты урока и подготовьте","свое высказывание-рассуждение на тему “Писать для","печати – дело нелёгкое и ответственное”. В каком стиле","вы построите своё высказывание?","","Чтобы построить рассуждение-доказательство,","нужно поставить в начале проблемный вопрос, дать"]},{"t":"p","h":"ответ (привести тезис), доказать его (привести вы-"},{"t":"v","l":["сказывания известных людей по этому вопросу,","примеры из жизни, конкретные факты), сделать","вывод.","","Задание 7. Кому из одноклассников вы бы порекомендовали","А?) стать журналистом? Почему?","","Задание 8. Разыграйте ролевую игру.","","Представьте себе, что вы журналисты, работающие в","разных редакциях газет. В республике объявлен конкурс","на лучшее интервью на тему «Самая важная профессия».","Вы, как опытные газетчики, должны добыть информацию"]},{"t":"p","h":"(на улице, на заводе, в банке, на вокзале и т. д.). Вы долж-"},{"t":"v","l":["ны записать интервью на диктофон, сделать записи в своём","блокноте, сфотографировать людей описываемой профессии.","Можете задать следующие вопросы:"]},{"t":"p","h":"1) Какая, по вашему мнению, сегодня самая важная профессия?"},{"t":"p","h":"2) Почему вы так думаете? И т. д."}],"sub":[],"section":"ШАГ НАВСТРЕЧУ","pages":[28,30]},{"title":"Урок 3. ЮРИСТ – ЭТО ПРЕЖДЕ ВСЕГО ВОСПИТАТЕЛЬ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"31\">31<\/span>Урок 3. ЮРИСТ – ЭТО ПРЕЖДЕ ВСЕГО ВОСПИТАТЕЛЬ"},{"t":"p","h":"Воспитание – великое дело: им решается участь человека. В. Г. Белинский"},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"h3","h":"Опорные слова"},{"t":"v","l":["закону","служить","делу","Родине","","древнейшая","опасная","профессия","интересная","рискованная","репрессии","подвергать","наказанию","риску","","смелый","принципиальный","юрист","честный"]},{"t":"h3","h":"Новые слова"},{"t":"p","h":"принципиальный – имеющий твёрдые принципы (убеждения) репрессия – жазалоо, кысымдоо, жазачарасы, жаза беруу"},{"t":"p","h":"1. Подберите к данным словам антонимы. Честный – ..."},{"t":"v","l":["порядочный – ...","смелый —","опасный – ...","интересный – ..."]},{"t":"p","h":"2. Составьте словосочетания, в состав которых входят слова, указы-"},{"t":"p","h":"вающие на образ или обстоятельства действия. Работать ..."},{"t":"v","l":["овладевать ...","узнавать ...","расследовать ...","","3. Образуйте наречия от данных прилагательных,","Опасный – ...","рискованный – ...","смелый – ...","принципиальный – ...","честный – ..."]},{"t":"p","h":"<span class=\"pg\" data-n=\"32\">32<\/span>4. Выделите корень в следующих группах слов, объясните их"},{"t":"p","h":"значение."},{"t":"v","l":["а) Право, правонарушение, правоохранительный.","6) Закон, законный, законность."]},{"t":"h3","h":"От СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 1. Прочитайте текст. Определите стиль речи. Юрист – одна из древнейших профессий. Где бы он ни работал, его обязанность – свято служить закону."},{"t":"p","h":"Юрист всегда должен помнить, что закон, пока он действует, есть закон, и нет таких обстоятельств, при которых его неисполнение считалось бы возможным. Это дело принципа. Ведь стоит только начать, стоит только открыть маленькую щель – и от желающих “подправить” закон не будет отбоя."},{"t":"p","h":"Отступление от закона даже в малом, особенно, если это касается правосудия, может повлечь за собой самые серьёзные последствия."},{"t":"p","h":"Задание 2. Спишите предложения, вставляя в них следующие слова и выражения: по-моему, не правда ли, мне кажется, помните. Расставьте соответствующие знаки препинания. Какие это предложения по цели высказывания? Р 1. Наш участковый добрый и отзывчивый. 2. На посту ГАИ стоял Асанов, опытный инспектор. 8. Павлов как адвокат работает в суде уже много лет. 4. Юрист – это прежде всего воспитатель."},{"t":"p","h":"Задание 3. Прочитайте текст. Перестройте выделенные в нем предложения в предложения с обратным порядком слов. Как при этом изменилось его содержание? Скажите, какую роль играет порядок слов в тексте."},{"t":"p","h":"Система правоохранительных органов построена так, что каждая юридическая специальность имеет свою определённую <span class=\"pg\" data-n=\"33\">33<\/span>функцию. Постовой полицейский, участковый инспектор, юрисконсульт направлены в своей работе, главным образом, на предупреждение правонарушений и преступлений. Работники уголовного розыска, следователь – на раскрытие преступлений и обвинение лиц, их совершивших. Прокурор, адвокат – на контроль за тем, чтобы борьба с преступлениями велась строго в рамках закона. Судья в составе суда окончательно решает дело и как бы подводит итог работы многих служб правоохранительных органов."},{"t":"h3","h":"Словарь"},{"t":"p","h":"юрисконсульт – постоянный консультант при учреждении"},{"t":"p","h":"по практическим вопросам права уголовный розыск – служба милиции (полиции), которая"},{"t":"p","h":"раскрывает преступления, разыскивает преступников"},{"t":"p","h":"у Составьте схему функций юридических специальностей."},{"t":"p","h":"Опираясь на эту схему, передайте содержание текста. Расскажите, что вы узнали о профессии юриста."},{"t":"p","h":"В русском языке сложился прямой порядок слов, при котором каждое слово в предложении занимает определённое место (Алёша с детства мечтал стать космонавтом)."},{"t":"p","h":"Порядок слов имеет синтаксическое, смысловое и стилистическое значение."},{"t":"p","h":"Чтобы подчеркнуть цель и основную мысль высказывания, усилить выразительность речи, нужно изменить порядок слов в предложении."},{"t":"p","h":"Задание 4. Определите тип каждого предложения по цели"},{"t":"p","h":"– высказывания и интонации. Объясните знаки препинания."},{"t":"p","h":"Прочитайте предложения с нужной интонацией."},{"t":"p","h":"1. Закон был его оружием. 2. Ведь Шерлока Холмса называют великим сыщиком? 3. Такого в истории ещё не было! 4. Суровые годы репрессий... 5. Где тут живёт ваш участковый? 6. Ни шагу назад! 7. Это был его первый экзамен."},{"t":"p","h":"<span class=\"pg\" data-n=\"34\">34<\/span>Задание 5. Прочитайте предложения сначала как повествовательные, а затем, где это возможно, как восклицательные."},{"t":"p","h":"1. Нет, процесс воспитания начинается с самой первой встречи преступника с представителем закона. Что скажет ему следователь, как скажет, каким тоном, как будет вести себя с подозреваемым, насколько справедливыми будут его действия – всё это будет работать на воспитание."},{"t":"p","h":"2. Глубоко заблуждается тот, кто думает, что главное – преступника поймать и осудить. А уже там, в колонии, будут его воспитывать."},{"t":"p","h":"3. Нам важно, чтобы человек, который был осуждён, вернулся в общество в таком состоянии, чтобы с ним можно было жить, работать, общаться и не бояться повторения прошлого. И значит, юрист – это прежде всего воспитатель. У Три приведённых фрагмента – части одного текста-рас-"},{"t":"p","h":"суждения. Восстановите его логическую последовательность (тезис, доказательство, вывод)."},{"t":"p","h":"у Почему юриста называют воспитателем?"},{"t":"p","h":"Задание 6. Представьте себе, что вы собираетесь поступить на юридический факультет. Расскажите другу (одноклассникам) о профессии юриста. Чем она вас привлекает?"},{"t":"p","h":"р"}],"sub":[],"section":"ШАГ НАВСТРЕЧУ","pages":[31,34]},{"title":"Урок 4. НА СТРАЖЕ МИРА И ПОРЯДКА","blocks":[{"t":"h3","h":"Урок 4. НА СТРАЖЕ МИРА И ПОРЯДКА"},{"t":"p","h":"Смелого пуля боится."},{"t":"p","h":"Народная пословица"},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"h3","h":"Опорные слова"},{"t":"p","h":"по тайге почувствовать опасность бродить по дороге"},{"t":"p","h":"врага по лесу"},{"t":"v","l":["<span class=\"pg\" data-n=\"35\">35<\/span>из карабина","стрелять","из ружья"]},{"t":"h3","h":"из пистолета"},{"t":"v","l":["вооруженный","опасный","рецидивист","скрывающийся","пустынная","заснеженная","дорога","скользкая","","метко","ловко","стрелять","наугад"]},{"t":"h3","h":"Новые слова"},{"t":"p","h":"бродить – ходить без цели карабин – винтовка, укороченная для уменьшения веса и"},{"t":"p","h":"удобства обращения рецидивист – человек, многократно совершавший преступ-"},{"t":"p","h":"ления"},{"t":"v","l":["1. Подберите синонимы к данным словам.","","Опасный – ...","рецидивист – ...","загреметь – ...","метаться – ...","","2. Подберите антонимы к следующим словам.","","Вооружённый – ...","опасный – ...","незнакомый – ..."]},{"t":"p","h":"3. От каких прилагательных образованы следующие наречия? Метко – ..."},{"t":"v","l":["ловко – ...","быстро – ...","глубоко – ...","скользко – ..."]},{"t":"h3","h":"От СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 1. Прочитайте текст с остановками, отвечая на вопросы после каждой части. Обсудите в классе разные варианты ответов. Кто же прав?"}],"sub":[],"section":"ШАГ НАВСТРЕЧУ","pages":[35,35]},{"title":"СЛУЧАЙ В ТАЙГЕ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"36\">36<\/span>СЛУЧАЙ В ТАЙГЕ"},{"t":"p","h":"Стоял тридцатиградусный мороз. На дороге, ведущей к Уссурийску, Приморского края, было пустынно. Ни машин, ни людей. Водитель Романов не спепла вел “ЗИЛ” по заснеженной лесной дороге. Впереди, метрах в пятидесяти, из-за огромной ели вышли двое с карабинами. Дали знак остановиться. Романов, поравнявшись с незнакомцами, замедлил ход и подумал: “В чём дело? Происходит что-то непонятное”. Он бросил машину вперёд. Вслед раздались выстрелы, просвистели над кабиной пули... (1-я остановка)."},{"t":"p","h":"у Как вы представляете дорогу?"},{"t":"v","l":["у Как вы думаете, кто эти люди?","Почему водитель «бросил вперед» машину?"]},{"t":"p","h":"...Их, вооружённых рецидивистов, давно искали. Они бродили по тайге, но голод выгнал их на дорогу. Преступники задумали захватить машину – не вышло, И тогда они снова ушли в тайгу, спрятались в доме лесника."},{"t":"p","h":"По следу шли работники милиции. День клонился к вечеру, был дорог каждый час... (2-я остановка)."},{"t":"v","l":["у Как повели себя рецидивисты?","у Почему они спрятались в тайге?","у Что будут делать милиционеры?"]},{"t":"p","h":"Решили так: одна часть людей будет отвлекать засевших в доме, другая часть попытается пробраться к нему с противоположной стороны."},{"t":"p","h":"Сотрудники милиции подползли к краю поляны. Первым вскочил Медведев, но его заметили преступники. Загремели выстрелы. Геннадий успел прыгнуть в сторону и спрятаться за кустом. Рядом пролетали пули. Чуть-чуть приподнял голову – в окнах никого. Но вот показался один, потом другой преступник. Оба перебегали от окна к окну, стреляя. “Нужно проскочить”, – подумал Медведев. Он посчитал: появляются через каждые 6-7 секунд. Но успеть невозможно, да и снег глубокий."},{"t":"p","h":"<span class=\"pg\" data-n=\"37\">37<\/span>Геннадий продолжал лежать без движения, заболели мышцы. Беспокоила мысль, что из-за него осложнилась обстановка. Он слышал призывы товарищей прекратить огонь. Но в ответ засевшие в доме посылали пули..."},{"t":"p","h":"и Как бы вы закончили это повествование?"},{"t":"p","h":"Задание 2. Определите стиль речи и тип прочитанного вами текста. Выпишите из него 2-3 предложения с прямым и обратным порядком слов. Почему в рассказе встречается обратный порядок слов в предложении? Что хотел подчеркнуть автор обратным порядком слов? Задание 3. Закончите предложения. Запишите их. ® р"},{"t":"p","h":"1. Водитель почувствовал 2. Из-за ели вышли (кто?)... 3. Романов бросил машину (куда?)... 4. Раздались (что?)... 5. По следу шли (кто? 6. Геннадий прыгнул (куда?)... 7. Медведев посчитал (чтог)... 8. Он продолжал лежать (как?)... 9. Геннадий слышал призывы (кого?)..."},{"t":"p","h":"Задание 4. Прочитайте конец текста “Случай в тайге” (см. стр. 42). Совпал ли конец этого события с вашим вариантом? Подготовьтесь к пересказу текста: выделите в нем зачин, основную часть, кульминацию, заключение, составьте план."},{"t":"p","h":"Задание 5. Предложения с двумя отрицательными части-"},{"t":"p","h":"не замените синонимичными предложениями без отрицания."},{"t":"p","h":"Образец: Он не мог не вступить в борьбу с прес-"},{"t":"p","h":"тупниками, – Он вступил в борьбу с преступниками."},{"t":"p","h":"1. Смелость не могла не удивлять меня. 2. Невозможно не признать в нём хорошего специалиста. 3. Человека труда нельзя не любить. 4. Не хочется не верить в успех нашего товарища. 5. Судья не может не признать виновности преступника. 6. Руководство не могло не отметить мужества капитана. 7. В нём нельзя было не заметить хорошо подготовленного работника милиции."},{"t":"v","l":["<span class=\"pg\" data-n=\"38\">38<\/span>В отрицательных предложениях отрицается то,","что высказывается о подлежащем. Отрицание может","выражаться отрицательными частицами не и ни и","отрицательными словами нет, нельзя.","Отрицание в предложениях может быть полным,","если отрицательная частица не стоит перед сказуемым","(Следствие не закончено), а также неполным, если"]},{"t":"p","h":"отрицательная частица не стоит перед каким-ни-"},{"t":"v","l":["будь другим членом предложения (Он не всегда","добросовестно относится к своей работе).","","5 Задание 6. Что вы знаете о подвиге людей юридической профессии? Расскажите об одном из них товарищам по","классу."]}],"sub":[],"section":"ШАГ НАВСТРЕЧУ","pages":[36,38]},{"title":"Урок 5. ЧЕЛОВЕК И ЕГО ПРИЗВАНИЕ","blocks":[{"t":"h3","h":"Урок 5. ЧЕЛОВЕК И ЕГО ПРИЗВАНИЕ"},{"t":"v","l":["Найти своё призвание, утвердиться","в нём – это источник счастья.","В. А. Сухомлинский"]},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"v","l":["Опорные слова","","жизнь","утвердиться | в призвании","в жизни","","с интересом","работать","с энтузиазмом","с наслаждением","познавать | природу","профессию","","творческий","любимый","труд","увлекательный","","Новые слова","","наслаждение – большое удовольствие","призвание – способность к тому или иному делу, профессии"]},{"t":"p","h":"<span class=\"pg\" data-n=\"39\">39<\/span>утвердиться (в жизни) – найти своё место в жизни, добиться"},{"t":"p","h":"успеха"},{"t":"v","l":["энтузиазм – сильное увлечение, душевный подъём","","Подберите синонимы к данным словам.","","Познавать – ...","утвердиться – ...","работать – ...","","2. Образуйте наречия от следующих прилагательных.","","Творческий – ...","красивый – ...","увлекательный – ...","интересный – ...","","3. Составьте словосочетания с данными словами,","","Трудиться (как?) ...","любить (что?) ...","утверждаться (в чем?) ..."]},{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 1. Ознакомьтесь с мыслями замечательного педагога БВ. А. Сухомлинского о том, как найти своё призвание. Определите виды предложений по цели высказывания. Установите, какими средствами выражаются вопрос и восклицание в предложениях,"},{"t":"h3","h":"ПИСЬМО К СЫНУ"},{"t":"p","h":"Меня радует, что ты утверждаещшься в своём призвании. Найти своё призвание, утвердиться в нём – это источник счастья."},{"t":"p","h":"В чем высшее наслаждение жизни? По-моему, в творческом труде, чем-то приближающемся к искусству. Это приближение в мастерстве. Если человек влюблён в свой <span class=\"pg\" data-n=\"40\">40<\/span>труд, он стремится, чтобы и в самом процессе труда, и в его результатах было что-то красивое. Станиславский так говорил: “...в чём счастье на земле? В познании. Познаешь природу, жизнь мира, смысл жизни, познаешь душу – талант! Выше этого счастья нет”."},{"t":"v","l":["у Какую мысль доказывает В. А. Сухомлинский?","у Какой аргумент он приводит?"]},{"t":"p","h":"Задание 2. Вставьте вместо точек отрицательную частицу. Ы Какие типы предложений встречаются в этом тексте? (...) будет ли преувеличением сказать: выбирая профессию, каждый выбирает еще и будущую свою жизнь? Надо ли говорить о том, как важно (...) ошибиться? Заинтересован в этом (...) только каждый подросток, оканчивающий школу, заинтересовано всё наше общество. И (...) просто потому, что у человека, делающего свою работу с любовью, “отдача больше”. У человека, (...) любящего свою работу, наступает недовольство собой, своей жизнью."},{"t":"p","h":"Задание 3. Перепишите текст. В восклицательных предло- ЬМ жениях слова какой, как замените словами такой, так."},{"t":"p","h":"Как изменилось при этом содержание предложений? Человек – хозяин своего призвания. Я без особенного энтузиазма отношусь к твоим восторгам: “Ах, какое счастье стать радиофизиком! Ах, как я люблю радиофизику!”\" Любить можно то, чему уже отдал частицу своей души. Это очень хорошо, что ты относишься с интересом к радиофизике, но помни, что это ещё только интерес."},{"t":"p","h":"Призванием же становится интерес, помноженный на труд."},{"t":"p","h":"В. А. Сухомлинский"},{"t":"p","h":"у Как вы поняли выделенное предложение? Запишите эту"},{"t":"p","h":"идею своими словами."},{"t":"p","h":"<span class=\"pg\" data-n=\"41\">41<\/span>Задание 4. Прочитайте предложения. Объясните, как 1 Ый порядок слов влияет на смысловые оттенки предло-"},{"t":"p","h":"жений."},{"t":"p","h":"1. Много на земле различных профессий. 2. На земле много различных профессий. 3. Самых различных профессий много на земле. 4. Много самых различных профессий на земле. 5. На земле самых различных профессий много."},{"t":"p","h":"6. Самых различных профессий на земле много."},{"t":"p","h":"Е Задание 5. Прочитайте отрывок из письма."},{"t":"p","h":"Мы много спорили с подругой – какую профессию выбрать. И то вроде не подходит, и это... И вдруг она сказала: “А по мне, лишь бы зарабатывать много”. Я потом долго думала. В общем-то, это нехорошо. А, с другой стороны, может быть, так и надо. Я не знаю..."},{"t":"p","h":"“ Профессия – это дело, которому надо отдать жизнь без"},{"t":"p","h":"остатка? Профессия – это средство для существования? Приведите потри аргумента, доказывающих и тот, и другой тезис, и впишите их в таблицу 6."},{"t":"p","h":"“ Оформите аргументы в виде простых повествовательных"},{"t":"p","h":"предложений."},{"t":"p","h":"Таблица 6 Профессия – это дело, которому Профессия – это средство для"},{"t":"p","h":"надо отдать жизнь без остатка существования"},{"t":"p","h":"У Какой ответ вы бы дали девушке?"},{"t":"p","h":"<span class=\"pg\" data-n=\"42\">42<\/span>Твой СОБЕСЕДНИК"},{"t":"p","h":"Задание 6. Как бы вы восстановили этот диалог?"},{"t":"p","h":"– Я думаю, ничего сложного нет в профессии журналиста. Ездит туда-сюда, пишет."},{"t":"p","h":"– Может быть, ты и прав. Но я хочу быть следователем."},{"t":"p","h":"– Ты думаешь, что эту профессию действительно трудно получить? Ну, что ж, придется постараться."},{"t":"p","h":"Приложение к уроку 3 Прошло три часа, операция явно затягивалась. Время показалось Медведеву мучительно долгим."},{"t":"p","h":"Медведев медленно оторвал голову от снега. Преступники уже не бегали – устали, хотя время от времени появлялись в окне. Геннадий думал: “Пауза больше минуты. Успею!”"},{"t":"p","h":"С противоположного конца участились пистолетные выстрелы: там было решено повторить первоначальный вариант атаки и высвободить из “плена” Медведева – замёрзнет. Прячась за деревьями, его товарищи поджидали удобного момента для рывка."},{"t":"p","h":"Геннадий не сводил глаз с преступников: Вот они задержались, он вскочил и, пробежав десяток метров, нырнул в дом. Перевел дыхание, огляделся в полумраке, достал пистолет и шагнул по лестнице. Остановился. Прислушался. За стеной слышались шаги, раздавались редкие одиночные выстрелы. Подкрался к двери – открыта. И вдруг из неё выскочил человек – прямо на Медведева. Геннадий выбил карабин и уложил преступника на пол. На шум выбежал второй преступник, пришлось и его “приземлить”. А тут подоспели и товарищи."},{"t":"p","h":"За проявленное мужество капитан Медведев был награждён медалью «За отвагу»."},{"t":"h3","h":"<span class=\"pg\" data-n=\"43\">43<\/span>ПРОВЕРЬ СЕБЯ"},{"t":"p","h":"1. Тесты. Выберите из приведенных ниже предложений соответствующие названному типу. Свой выбор пометьте в таблице знаком «У»,"},{"t":"v","l":["1. Повествовательные предложения.","","а) Много прекрасных профессий на свете.","6) Я землю эту люблю!","в) Не опаздывать!","г) Я не могла не приехать.","д) Кто совершил первый космический полет?","","2. Вопросительные предложения.","а) Какой чудесный воздух!","6) За рекой поднимается серый т смонавтами, путешественниками. Поэтому каждому нужно быть скромным и самокритичным. Но они не отдают себе отчета в том, что место каждого человека в обществе определено более существенными причинами, чем личные желания или запросы. Переоценивая себя, вы можете почувствовать глубокое недовольство собой."},{"t":"p","h":"4. Подготовьте сообщение о публицистическом стиле. Используйте"},{"t":"p","h":"для этого материалы уроков темы 2."},{"t":"p","h":"1) В каких сферах жизни встречается публицистический стиль речи?"},{"t":"p","h":"2) Какие смысловые и языковые особенности имеет публицистический стиль речи?"},{"t":"p","h":"3) Какие жанры публицистического стиля речи вы знаете?"}],"sub":[{"title":"ПИСЬМО К СЫНУ","b":9}],"section":"ШАГ НАВСТРЕЧУ","pages":[39,44]},{"title":"ТЕМА 3 ТИПЫ СВЯЗИ СЛОВ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"45\">45<\/span>ТЕМА 3 ТИПЫ СВЯЗИ СЛОВ"},{"t":"img","src":"data:image/webp;base64,UklGRtYrAABXRUJQVlA4IMorAADQFgGdASr5AUMBPrVOo0onJKskq/PsIWAWiWluiIyUx+CRD1kDYmWE6PKuCf/8yF5LQ7Htyhts/Hvtf+H/eeXR2l5lfzf9EZE+b/y71IPy3eHwHfHRPK/adngUDq95A2eue1TKInIG8NXBbJShu9x3L/Fr/KSheMGnwQ9vT5wUhwLfcsJ0Hh5FeeAwK8e27SfvHXY4JSgZwPlsaVP5c9PyUmQLzA4Qk1S2e9pjma7GCgBTIY2uFP4LGEdI8vHgHWAih18yfut1Y4jG91TDruoggnrvMZam6tbcJ+/Z3ZwPwGOW3MIOmdhA59dnn/v+JsvC+vCagagnaTgjHB/XldK7AG0+gEHIP0iICNwJe8HcLg0Glr+3yd+4ZvfFQGcVDC+mr0FXOuU+D96pFrfM0dHngHMMNKF3n3r06AWgo3vhxUJY08NlCpuiKhTrh7rm6GJv0RZoO3+2mxevb+2OK9H/gXu+KN7bgz7/v0PVWjOoiomHPjeQPQjZXViIeW3PbiVjmLF0BQrIm4TnL+x0fHlg6jZstLUZFPu/DxBg4NMRWqYzMadXC/7Gm+rCg7S5FkyeDsEugDiJAOSkVX+ZStkf4v9iCX85CwcSKOtIoOpuFxpN74mg6t7XL+mJSgAwlNe5s3VjJW01sqiugXDHIy9RScOnDCO4FadOxWXTP5GmFFNSSzUiECzgM9WkXFp0R3RwdqMAM8AKb5wk75yJ15fLxtfZ19+V4utSrkV4e2foc0dbV2s9Ra3xAi3eXysFkjrJkK1b6UJwM6B4/90+KEirB/62vWgKcFr3sqTvdkFdzEQo1nHHw8gfzIAFfWi3jGA9AFuXDxgPMSFOrWacdM8Su62BPRQqSYYmOBL8t/8pw2gTsB2JDNoxmuInMSvsnq+5iF/hlji40DjFWEEPLQv1baG5ctkaV8ffUZoOi2UDcvS3kWFZv8md2SspW7N8C8aT6+qlXAdkHF3+k026kxn7Yx5rEO751FQb1BwMKJ1uM5/kaNmdc+ymQcQ/Lk22Snbufb+nYT2ayXhCQd/ ВЛЕЧЕНИЙ"}],"sub":[{"title":"В СЛОВОСОЧЕТАНИИ И ПРЕДЛОЖЕНИИ","b":2}],"section":"ШАГ НАВСТРЕЧУ","pages":[45,45]},{"title":"Урок 1. БЕЗ УВЛЕЧЕНИЙ ЖИЗНЬ СКУЧНА","blocks":[{"t":"h3","h":"Урок 1. БЕЗ УВЛЕЧЕНИЙ ЖИЗНЬ СКУЧНА"},{"t":"p","h":"В мире нет ничего разрушительнее, невыносимее, чем безделье."},{"t":"p","h":"А. И. Герцен 2. Задание 1. Прочитайте эпиграф к уроку. Согласны ли вы"},{"t":"p","h":"с этим высказыванием? О чём мы будем говорить на уроке?"},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"p","h":"1. Подберите синонимы к выделенным словам."},{"t":"p","h":"Прекрасные рисунки, быть открытой, красивое лицо, быть человечным."},{"t":"p","h":"2. От каких прилагательных образованы следующие наречия? Живо – ..."},{"t":"v","l":["свободно – ...","прекрасно – ...","открыто – ..."]},{"t":"p","h":"Согласуйте эти прилагательные с существительными рисунок, тема, полотно, лицо."},{"t":"h3","h":"От СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 2. Прочитайте текст. Озаглавьте его. Определите, опираясь на таблицу 7, тип связи в выделенных словосочетаниях."},{"t":"p","h":"<span class=\"pg\" data-n=\"46\">46<\/span>Давайте подумаем, хорошо или плохо мы расходуем своё время, особенно свободное. А как точно подсчитать своё свободное время? Из двадцати четырех часов вычтем время на сон, езду, занятия в школе, подготовку домашнего задания, работу по дому. И каждый из нас получит разное количество часов. И плюс ещё выходные дни и каникулы. А это уже немало. Целое богатство."},{"t":"p","h":"Таблица 7"},{"t":"h3","h":"Типы связи слов в словосочетаниях"},{"t":"v","l":["2","Формы зависимого слова","= формы главного слова"]},{"t":"p","h":"новая книга"},{"t":"p","h":"падеж кчему?"},{"t":"raw","h":"<h4 class=\"mk\">Главное слово смысл<\/h4>"},{"t":"p","h":"зависимое"},{"t":"h3","h":"стремиться к знаниям"},{"t":"v","l":["как?","","увлеченно учиться","Главное слово ——» зависимое","слово"]},{"t":"p","h":"желание учиться"},{"t":"p","h":"Задание 3. Прочитайте текст."},{"t":"p","h":"Жила-была в Москве маленькая девочка. Как и все дети, она любила играть. Только играла она по-своему – она рисовала. Мама рассказывала ей сказки – она рисовала сказочных героев, читала ей об исторических войнах – рисовала войну. И так без конца."},{"t":"p","h":"Скоро стало ясно, что это не просто игра, это талант. Увидев ее рисунки один раз, невозможно было забыть их: живые, свободные, прекрасные."},{"t":"p","h":"<span class=\"pg\" data-n=\"47\">47<\/span>Ничто не мешало Наде развиваться. Как художник и человек она росла не по дням, а по часам. И в семнадцать лет она была мастером."},{"t":"v","l":["У неё было много увлечений...","","у Как проявился талант Нади Рушевой?"]},{"t":"p","h":"Задание 4. Разделитесь на три группы. Выполните грамматические задания к текстам А, Б, В по группам. Расскажите о результатах всему классу."},{"t":"v","l":["А. Прочитайте письмо Нади Рушевой.","","Хороший ты мой друг, Алик!"]},{"t":"p","h":"Господи, какой чёрт угораздил тебя падать со второго этажа? Представляю... Одним словом, желаю быстрейшего выздоровления и пр.., и пр. По дороге в Ленинград интересный случай был. В поезде “Юность” мы пели часа четыре. Света не было, ну и чудесно! Какой-то тип подсвистывал нам из темноты. Очень здорово! Он посвистит какую-нибудь песню, а мы подхватим, споём... Сначала туристские песни, потом танцевальные, народные. До опер и романсов дошли... А он все свистит и свистит. Мы так и не узнали, кто это был."},{"t":"p","h":"А вЛенинграде, в Эрмитаже, ходим и ахаем. Божественно, красиво. На Мойке, 12 экскурсовод была чудесная! Так рассказывала, прямо от души... а у самой слёзы на глазах. Да..."},{"t":"p","h":"Напиши обо всем. Пиши скорее!"},{"t":"p","h":"Надя Рушева 2 февраля 1968 года"},{"t":"h3","h":"Словарь"},{"t":"p","h":"угораздить – совершить необдуманное действие романс – небольшое музыкальное лирическое произведение божественно – очень хорошо, прекрасно"},{"t":"p","h":"у Выпишите словосочетания, в которых слова соединены"},{"t":"p","h":"способом согласования."},{"t":"p","h":"<span class=\"pg\" data-n=\"48\">48<\/span>у Составьте схемы по образцу:"},{"t":"h3","h":"какой?"},{"t":"p","h":"хороший друг и Какими частями речи выражены согласуемые слова, какую роль они выполняют в предложении?"},{"t":"p","h":"Подготовьте от группы сообщение о согласовании как способе связи (решите, кто будет выступать, какую наглядность следует подготовить для выступления)."},{"t":"v","l":["Б. Прочитайте письмо Нади Рушевой.","Алик!"]},{"t":"p","h":"Слушай, можешь написать стихи к какому-нибудь моему рисунку? Я пришлю. Кем ты будешь? Ведь уже пора выбирать... Напиши обязательно. Я или во ВГИК (Всесоюзный государственный институт кинематографии) (на мульти), или в полиграфический (книжная графика)."},{"t":"p","h":"По литературе проходим Достоевского, “Преступление и наказание”. Теория Достоевского очень интересна... Как ты думаешь? Готовимся к КВНу на тему “Школьник XXI века”. Что-то не получается писать серьёзно и длинно. Пока!"},{"t":"p","h":"Надя Рушева 14 декабря 1968 года"},{"t":"p","h":"у Выпишите словосочетания, в которых слова связаны по способу примыкания, и“ Составьте схемы этих словосочетаний по образцу:"},{"t":"h3","h":"как?"},{"t":"p","h":"хорошо написать у Какую роль выполняют в предложении примыкающие слова?"},{"t":"p","h":"Подготовьте от группы сообщение о примыкании как способе подчинительной связи (решите, кто будет выступать, какую наглядность следует подготовить для его выступления)."},{"t":"p","h":"В. Прочитайте письмо Нади Рушевой."},{"t":"p","h":"Привет, старина!"},{"t":"p","h":"Не писала, потому что была занята страшно. И в школе, и с выставкой. В Центральном доме работников искусства 3 декабря был 98 номер устного журнала “Жизнь и твор-"},{"t":"img","src":"data:image/webp;base64,UklGRhpbAABXRUJQVlA4IA5bAADQzQKdASpOAs0EPrVYqEynJaitqLaZEbAWiWlu/AHQBEOJKa78gK6Z2xP6p/77w9DquNV8d6hVOK8TQ9SgX//bUrharY9y9L4R/4O85/R/93xR/J/uHz+cA/kZfO/ntxs8Cz8s/eHsM/++Lp4H/78sT/t4mP/fsZ+G//f2Q/4jz5x0b/28AsiFqC+Vxx/0y2/Q8/x32iLsejv69uLZUpnlm0xYHU

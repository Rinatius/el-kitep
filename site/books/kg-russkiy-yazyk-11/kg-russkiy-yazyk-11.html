тания с прилагательным сольный и существительными исполнение, концерт, выступление, игра, пение."},{"t":"p","h":"2. К следующим существительным подберите имена прилагательные."},{"t":"v","l":["... концерт","... пьеса","... квартет","... скрипач","... редкости","... звери"]},{"t":"p","h":"<span class=\"pg\" data-n=\"52\">52<\/span>3. От каких существительных образованы следующие прилага-"},{"t":"p","h":"тельные? По какой модели они образованы?"},{"t":"v","l":["Музыкальный – ...","трудный – ...","драматический – ...","известный – ..."]},{"t":"p","h":"4, Замените словосочетания, построенные по способу управления,"},{"t":"p","h":"на синонимичные словосочетания с согласованием."},{"t":"v","l":["Концерт для скрипки – ...","квартет вокала – ...","пьеса для театра – ...","редкости из Китая – ...","игра на фортепьяно – ..."]},{"t":"p","h":"5. Как вы думаете, от каких прилагательных образовались слова"},{"t":"p","h":"диковинка, редкость? Как вы понимаете значение этих слов?"},{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 1. Прочитайте текст. Выпишите выделенные пред- 3 ложения, укажите, чем выражены в них главные члены"},{"t":"p","h":"предложения. Вспомните, в чём согласуется с подлежащим простое глагольное сказуемое в настоящем (будущем) и прошедшем времени."},{"t":"p","h":"Кто не знает басню И. А. Крылова, герои которой – проказница Мартышка, Осел, Козел и косолапый Мишка – “задумали сыграть квартет”. Немногие знают, что писал свою басню Иван Андреевич с полным знанием дела."},{"t":"p","h":"Немало интересных фактов приводится в воспоминаниях его современников. Так, например, земляк и друг Ивана Андреевича, П. А. Плетнев, писал: “...И. А. Крылов с лучшими виртуозами разыгрывал самые трудные квартеты\"."},{"t":"p","h":"В составе ансамбля как вторая скрипка он выступал довольно часто. Но Иван Андреевич давал и сольные концерты, исполняя сложнейшие скрипичные произведения. у О каком увлечении великого баснописца вы узнали из этого"},{"t":"p","h":"текста?"},{"t":"p","h":"<span class=\"pg\" data-n=\"53\">53<\/span>Задание 2. Раскройте скобки. Поставьте глаголы в нужной форме."},{"t":"p","h":"Менделеев (быть) большим любителем шахмат. Об интересе учёного к шахматам (свидетельствовать) экспонаты, хранящиеся в мемориальном музее в Санкт-Петербурге. Он (играть) очень хорошо, но проигрывать не (любить) и очень редко (получать) мат. Он (играть) обдуманно и весь (уходить) в игру."},{"t":"p","h":"В одном из первых дневников Д. И. Менделеева есть такая фраза: “Не (мочь) я ничего делать, не привязавшись к делу”. Это высказывание очень точно (характеризовать) не только его отношение к серьёзному делу, но и к увлечениям. Словарь"},{"t":"v","l":["экспонат – вещь, предмет, который хранится в музее","у Чем увлекался Д. И. Менделеев?","у Что свидетельствует о его интересе к шахматам?","у Как играл великий учёный в шахматы?"]},{"t":"p","h":"у Какая фраза характеризует его отношение к серьёзному делу"},{"t":"p","h":"и к увлечениям?"},{"t":"p","h":"Задание 3. Прочитайте. Скажите, о каких увлечениях 5? Петра 1 говорится в тексте. Определите, в чем согласуется гла-"},{"t":"p","h":"гол-связка в составном именном сказуемом с подлежащим. Пётр Великий был не только царём-преобразователем, выдающимся полководцем, но и коллекционером – да каким!"},{"t":"p","h":"Пётр 1 был настоящим библиофилом. Он всю жизнь собирал книги. Его библиотека стала основой книжного собрания Академии наук."},{"t":"p","h":"Множество диковинок и редкостей было собрано в специальном “Кабинете редкостей”. Так появилась Кунсткамера – первый российский музей, который основал Пётр [. Она стала удивительным музеем, который существует и сейчас."},{"t":"h3","h":"Словарь"},{"t":"p","h":"библиофил – человек, любящий и собирающий книги <span class=\"pg\" data-n=\"54\">54<\/span>Таблица 8 Согласование сказуемого с подлежащим"},{"t":"p","h":"Собирательные"},{"t":"p","h":"Молодёжь вы-"},{"t":"v","l":["сущ., не имеющие","количественного","значения","Сочетание слов"]},{"t":"p","h":" :"об увлечениях Петра 1. 6. Часть посетителей музея (заинте-"},{"t":"v","l":["ресоваться) зоологической коллекцией.","","Задание 5. Прочитайте ещё раз тексты урока, в которых","рассказывается об увлечениях великих людей, Как вы","думаете, помогали ли им их увлечения в работе? Приведите","примеры."]}],"sub":[],"section":"ШАГ НАВСТРЕЧУ","pages":[51,55]},{"title":"Урок 3. НЕ ТРАТЯ ВРЕМЯ ЗРЯ","blocks":[{"t":"h3","h":"Урок 3. НЕ ТРАТЯ ВРЕМЯ ЗРЯ"},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"h3","h":"Опорные слова"},{"t":"v","l":["в печати","создавать импровизации выступать в театре","музыку","","научные","спортивные","музыкальные","поэтические","на сцене","","научное","музыкальное | наследие","литературное"]},{"t":"raw","h":"<h4 class=\"mk\"><span class=\"pg\" data-n=\"56\">56<\/span>огромный великий значительный<\/h4>"},{"t":"h3","h":"хорошо"},{"t":"v","l":["вклад","обдуманно","играть","профессионально"]},{"t":"h3","h":"Новые слова"},{"t":"p","h":"вклад – салым импровизация – музыка, стихи, которые создаются"},{"t":"p","h":"в момент исполнения х 1. Составьте словосочетания с прилагательным научный и сущест-"},{"t":"p","h":"вительными интерес, наследие, вклад, работа, открытие."},{"t":"p","h":"2. Кследующим существительным подберите имена прилагательные,"},{"t":"p","h":"составьте словосочетания. ... проблема ... коллекция ... увлечение ... вклад"},{"t":"v","l":["... талант","... ПОЭТ","... миниатюра","... импровизация"]},{"t":"p","h":"3. От данных прилагательных образуйте имена существительные."},{"t":"p","h":"По какой модели вы их образуете? Научный – ..."},{"t":"p","h":"музыкальный – ... поэтический – ... значительный – ..."},{"t":"v","l":["профессиональный – ...","актуальный – ...","информационный – ..."]},{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 1. Перепишите предложения, раскрыв скобки. Какими членами предложения являются согласованные слова?"},{"t":"p","h":"1. Почти каждый человек (иметь) своё увлечение. 2. Увлечения (делать) жизнь более богатой и интересной. 3. Многие ребята (увлекаться) коллекционированием марок. 4. Ряд увлечений по-своему (влиять) на человека, на его характер, <span class=\"pg\" data-n=\"57\">57<\/span>чувства, волю. 5. Большинство увлечений (способствовать) развитию ценных качеств человека. 6. Двенадцать учеников (увлекаться) автоделом и (посещать) автошколу."},{"t":"p","h":"у Прочитайте предложения ещё раз. Какая тема их объединяет?"},{"t":"p","h":"О чем продолжим разговор на уроке?"},{"t":"p","h":"ложении и от союзов, связывающих подлежащие."},{"t":"p","h":"Таблица 9 Согласование сказуемого с однородными"},{"t":"h3","h":"подлежащими Место"},{"t":"raw","h":"<h4 class=\"mk\">сказуемого в предложении<\/h4>"},{"t":"h3","h":"Способы"},{"t":"p","h":"Примеры оединения Д. И. Менделеева интересовали и физика, и химия, и метрология, и экономика, и Соединитель-"},{"t":"v","l":["ные союзы","Перед геофизика.","однородными","подлежащими Увлечениями артиста","Ф. И. Шаляпина было"]},{"t":"p","h":"стихосложение и весёлые устные импровизации."},{"t":"raw","h":"<h4 class=\"mk\">После однородных подлежащих<\/h4>"},{"t":"p","h":"Володя, Женя, Сергей и Саша увлекаются парашютным спортом."},{"t":"p","h":"Почти каждого человека увлекает или спорт, или музыка, или любое другое занятие. То музыка её увлекает, то коллекционирование марок."},{"t":"p","h":"Разделительные союзы"},{"t":"p","h":"Задание 2. Прочитайте текст. Определите, чем выражены подлежащие в выделенных предложениях и как согласуются с ними сказуемые. При выполнении задания используйте таблицу 9."},{"t":"p","h":"<span class=\"pg\" data-n=\"58\">58<\/span>Артист Ф. И. Шаляпин был неравнодушен к поэзии. Врожденная музыкальность, чувство ритма помогли ему освоить и стихосложение. Шаляпин, конечно, не был профессиональным поэтом, но иногда он выступал в печати с актуальными стихотворениями. Не сторонился и лирики. Особенно удавались ему весёлые устные импровизации, потому что жизнелюбие, чувство юмора были неотделимыми свойствами его натуры."},{"t":"p","h":"у Прочитайте текст ещё раз. Скажите, есть ли связь между"},{"t":"p","h":"увлечением и профессией."},{"t":"p","h":"Задание 3. Спишите текст, раскрыв скобки. Укажите, в СЫ – чём согласуются сказуемые с однородными подлежащими,"},{"t":"h3","h":"ПЕТРОВСКИЙ КАБИНЕТ РЕДКОСТЕЙ"},{"t":"p","h":"У входа в Кунсткамеру (стоять) чучела и скелеты. С потолка (свисать) высушенные рыбы и змеи. В шкафах за стеклянными дверцами в цилиндрических сосудах помещены различные препараты. В сосудах (находиться) странные звери, диковинные рыбы, ящерицы, змеи."},{"t":"p","h":"Наряду с зоологическими коллекциями Кунсткамера располагает хорошим гербарием, собранием минералов, а также большим числом восточных, китайских и сибирских редкостей."},{"t":"v","l":["у Вспомните, кем и как был основан этот музей.","у Подготовьте устное сообщение о Кунсткамере."]},{"t":"p","h":"Чтобы построить устное сообщение на какую-либо тему, решите:"},{"t":"p","h":"1) с какого утверждения, вопроса, факта лучше начать своё выступление;"},{"t":"p","h":"2) какую информацию, примеры включить в основную часть сообщения;"},{"t":"p","h":"3) какое завершение сообщения будет наиболее интересным."},{"t":"p","h":"<span class=\"pg\" data-n=\"59\">59<\/span>Задание 4. Закончите предложения."},{"t":"p","h":"1. Пешие прогулки, книги,"},{"t":"p","h":"посещение музеев..."},{"t":"p","h":"2. Туризм и спорт..."},{"t":"p","h":"3. Строгий режим дня,"},{"t":"p","h":"обязательность и аккуратность..."},{"t":"p","h":"4. В выходные дни в бас-"},{"t":"p","h":"сейне..."},{"t":"p","h":"5. Иногда родители и дети..."},{"t":"h3","h":"Твой соБЕСЕДНИК"},{"t":"v","l":["раздаются крики и смех","отдыхающих","имеют общие увлечения","являются прекрасными","видами отдыха","способствуют физическому","и духовному развитию","человека","облегчают нашу жизнь","","Задание 5. Прочитайте диалог."]},{"t":"p","h":"– Асан, где ты собираешься проводить летние каникулы?"},{"t":"p","h":"– Наверное, опять в горах, в лагере. Я увлекаюсь альпинизмом."},{"t":"p","h":"– А не хочешь ли поехать со мной на Байкал? Ты когда-нибудь был там? По-моему, более красивых мест нет, – Спасибо, Сергей. Но мне не хотелось бы ехать далеко. Ведь это дорого стоит."},{"t":"p","h":"– Ты не пожалеешь. Там очень красиво. Вода в озере синяя, холодная. А какие леса! Я увлекаюсь туризмом и могу показать много интересного."},{"t":"p","h":"– А где мы там будем жить?"},{"t":"p","h":"– У меня там живёт дедушка. Он будет рад нашему приезду. Он тоже знает много интересного и может показать красивые места. Поедешь?"},{"t":"p","h":"– Это действительно заманчиво. Я согласен! Спасибо"},{"t":"p","h":"У А куда вы можете пригласить своего товарища из другой республики? Разыграйте ваш диалог."},{"t":"p","h":"<span class=\"pg\" data-n=\"60\">60<\/span>У рок 4. 4. КОЛЛЕКЦИОНИРУЕМ"},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"v","l":["Опорные слова","","увлечённый","нумизмата","ценная","филателиста"]},{"t":"raw","h":"<h4 class=\"mk\">интересная богатая тематическая<\/h4>"},{"t":"v","l":["ия","Коллекция | библиофила филокартиста","фалериста","филофониста"]},{"t":"h3","h":"Новые слова"},{"t":"v","l":["нумизмат – коллекционер стари нных и современных монет","фалерист – коллекционер значков","филокартист – коллекционер открыток","филофонист – коллекционер грампластинок","","1. Подберите антонимы к следующим прилагательным.","Ценный – ...","редкий – ...","интересный – ...","богатый – ...","сложный —"]},{"t":"p","h":"2. От каких прилагательных образовались следующ ледующие существительные?"},{"t":"v","l":["Редкость – ...","старость – ...","современность – ...","интерес – ...","увлечение – ...","<span class=\"pg\" data-n=\"61\">61<\/span>3. Подберите существительные к следующим прилагательным.","Выдающийся ...","прекрасный ...","редкий ...","известный ...","знаменитый ...","русский ...","великий ...","","4. Как мы назовем человека, который","а) собирает редкие книги – ...","6) собирает старинные монеты – ...","в) коллекционирует грампластинки – ...","г) коллекционирует открытки – ...","д) коллекционирует значки – ..."]},{"t":"p","h":"Смысловое и интонационное выделение второстепенных членов предложения называется обособ-"},{"t":"v","l":["лением. На письме такие второстепенные члены","выделяются запятыми, иногда – тире.","","Согласованные определения, выраженные","причастием или прилагательным, могут быть","","распространёнными","(имеют зависимые слова)","","обособляются, если стоят","после определяемого слова","нераспространёнными","","обособляются, если стоят","после определяемого слова,","перед которым есть другое","определение","","Распространённые и нераспространённые опре- ы","деления, относящиеся к личным местоимениям,"]},{"t":"p","h":"обособляются независимо от их места по отноше-"},{"t":"v","l":["нию к определяемому слову (Она, задумчивая,","удивлённая, стояла перед картиной великого","художника. Большая, красивая, она висела почти","на всю стену)."]},{"t":"p","h":"<span class=\"pg\" data-n=\"62\">62<\/span>Нераспространённые согласованные определения, стоящие после определяемого слова, перед которым нет другого определения, иногда обособляются (На картине изображен вечер, синий, теплый, тихий)."},{"t":"p","h":"Определение, выраженное причастием с зависимыми словами, называется причастным оборотом."},{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 1. Прочитайте текст. Какие обособленные опре- М деления встречаются в нем (распространённые или"},{"t":"p","h":"нераспространённые)? Выпишите из текста предложения с согласованными обособленными определениями. Слово “коллекция” – латинского происхождения, означает “собрание”. Человека, собирающего коллекцию, называют коллекционером."},{"t":"p","h":"Что только не коллекционируют люди! Редкие книги составляют коллекции библиофилов. Старинные и современные монеты собирают нумизматы. Почтовые марки и другие знаки почтовой оплаты интересуют филателистов, а грампластинки – филофонистов. Филокартисты коллекционируют открытки, а фалеристы – всевозможные значки."},{"t":"p","h":"Коллекционирование – это не профессия, а увлечение. Но человек, собирающий коллекцию, приобретает много новых знаний. Допустим, у филателиста появилась новая марка. Прежде всего он прочтет название страны, выпустившей марку. Потом коллекционер, захотевший узнать, что (или кто) изображено на ней, заглянет в справочник, словарь, а то и в энциклопедию. Очень часто именно коллекционеры помогают учёным найти решение серьёзных научных проблем."},{"t":"p","h":"у Скажите, чем полезно коллекционирование."},{"t":"p","h":"у К какому стилю речи относится приведенный текст? До-"},{"t":"p","h":"кажите."},{"t":"p","h":"<span class=\"pg\" data-n=\"63\">63<\/span>Для научного стиля речи характерно употребление распространённых и нераспространённых обособленных определений, что помогает более точно передать информацию."},{"t":"p","h":"и Хоу: обособленными распространёнными и нераспространёнными Задание 2. Поставьте знаки препинания в предложениях с"},{"t":"p","h":"определениями."},{"t":"p","h":"Немногие произведения Леонардо да Винчи дошли до нашего времени. Но сохранившиеся картины создали художнику всемирную славу. Леонардо да Винчи отдававший много времени живописи увлекался также математикой и архитектурой. Известно что Леонардо да Винчи написавший большой и серьёзный труд о вращении Земли опередил на 40 лет Николая Коперника. Он высказал предположение утверждающее что “белый цвет есть причина всех цветов”."},{"t":"h3","h":"Словарь"},{"t":"p","h":"вращение – движение по окружности"},{"t":"p","h":"Задание 3. Перестройте предложения так, чтобы необо- 1 собленные распространённые определения стали обособлен-"},{"t":"p","h":"ными."},{"t":"p","h":"1. Эрмитаж – это занимающий большую площадь великолепный музей художественной коллекции. 2, В местном музее Саратова обнаружена состоящая из пяти полотен коллекция картин неизвестного художника. 3. Как же обнаружили пролежавшую много лет удивительную коллекцию? 4. Ученые доказали, что сохранившиеся со времен Петра картины представляют большую ценность. 5. Разгаданная совсем недавно тайна картин удивительна."},{"t":"p","h":"Задание 4. Замените данные предложения на предложения с 7 обособленными определениями. Укажите, чем они выражены."},{"t":"p","h":"Сделайте синтаксический разбор 1-го и 3-го предложения."},{"t":"p","h":"1. На выставке, которая недавно открылась в Москве, представлены работы кыргызских художников. 2. Показано <span class=\"pg\" data-n=\"64\">64<\/span>немало картин, которые свидетельствуют о творческом росте молодых художников. 3. Картины, которые были присланы на конкурс, выполнены прекрасно. 4. Моя подруга, которая зан имается в художественном училище, повезла на выставку свои работы. о. 5. Работы, которые прадот ены на выставке, вызвали большой интерес телеи. ей"},{"t":"h3","h":"УРОК 5. В МИРЕ КОМПЬЮТЕРОВ"},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"v","l":["Опорные слова","","инструменты","использовать | возможности","машину","компьютер","","над созданием","работать | над задачей","над идеей","","умственные","интеллектуальные","физические","финансовые","накапливать","информацию","хранить","передавать","обрабатывать","","торговли","с развитием | науки","техники","промышленности"]},{"t":"h3","h":"Новые слова"},{"t":"p","h":"интеллектуальные (возможности) – духовные, умствен-"},{"t":"p","h":"ные возможности обрабатывать – анализировать и приводить в систему"},{"t":"v","l":["<span class=\"pg\" data-n=\"65\">65<\/span>Е","","1. Подберите синонимы к выделенным словам.","Накапливать информацию, увеличивать"]},{"t":"p","h":"туальные возможности, вычислять за короткий срок, использовать для увеличения своих возможностей."},{"t":"v","l":["2. Составьте словосочетания.","Использовать (что?) ...","использовать (для чего?) ...","с развитием (чего?) ... разв)","счеты появились (где?) ..."]},{"t":"p","h":"3. От данных прилагательных образуйте существительные. По какой"},{"t":"p","h":"словообразовательной модели вы это сделаете?"},{"t":"v","l":["Возможный – ...","письменный – ...","интеллектуальный – ...","информационный – ..."]},{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 1. Прочитайте текст."},{"t":"h3","h":"ОТ АБАКА ДО ЭВМ"},{"t":"p","h":"Очень давно, когда человечество было ещё совсем молодым, люди использовали для увеличения своих физических возможностей различные инструменты."},{"t":"p","h":"Когда человечество стало немного старше, у него появились другие проблемы. Стало необходимым накапливать, хранить, передавать и обрабатывать информацию. Это привело к возникновению счета и письменности. Древнейшим инструментом, помогавшим человеку считать, была его рука. Две руки стали основой десятичной системы счисления."},{"t":"p","h":"С развитием торговли человеку стали нужны инструменты, увеличивающие интеллектуальные возможности. Такими <span class=\"pg\" data-n=\"66\">66<\/span>инструментами были простейшие счёты: “суан-пан” в Китае, “сурабан” в Японии, “абак” в Древней Греции. В России появился счётный инструмент, которому дали название “русские счёты”."},{"t":"p","h":"С развитием науки и техники появилась необходимость выполнять большое количество вычислений за короткий срок. Двадцатый век подарил человечеству машину, которая могла считать автоматически и с высокой скоростью – миллионы операций в секунду. Эту машину назвали ЭВМ, или компьютер."},{"t":"h3","h":"Словарь"},{"t":"p","h":"десятичная система счисления – десять пальцев рук – аппа-"},{"t":"p","h":"рат для счёта; именно счёт по пальцам рук положил начало той системе, которой мы пользуемся в настоящее время операция – отдельное действие"},{"t":"v","l":["у Какие счётные инструменты были первыми?","у Какими стали счётные инструменты в XX веке?"]},{"t":"p","h":"Задание 2. Заполните таблицу 10 примерами из К “От абака до ЭВМ”. Подготовьте сообщение об управлении."},{"t":"p","h":"у Скажите, что называется управлением."},{"t":"p","h":"у Приведите примеры приглагольного управления."},{"t":"p","h":"и“ Приведите примеры приименного управления (чтобы управ-"},{"t":"p","h":"ляющим словом было имя существительное, прилагательное, числительное)."},{"t":"p","h":"у Приведите примеры предложного и беспредложного управ-"},{"t":"p","h":"ления."},{"t":"img","src":"data:image/webp;base64,UklGRtgcAABXRUJQVlA4IMwcAADwmgCdASqAAq8APrVOo0unJCeqJxONIUAWiWVsZsVdH6W+Ntjo1V32aVd54sPtIKaZfiudA/wO8N6d0px5vmkuD3j7R+6P84Nb+Mnh83/t98d6Vf9n0hPVh/R+iwvML07K4r4k/jv2P+q/t37n+wrX0amXzX7u/s/8D6Wf6/xz+F2oX6//XH1PorPRagH8/7oLV09p/u/sC8JLQR8lT/J83v57/wi4azZvnMBBkyo5LfaEkTJe5l08u/2sZGgJr0MXdKul65fs9pQ3Y3FSxp6qMcozT027+uKuspVBWb2OLcyskl+i/0rIS6kFnLv+CiMfeSwWgu/APNQVxSvesGCpN3BJ7qwubyC/VJutR37+lOumpqNIFBRcZMujKnBEMQHZJusrvir22lmpSQUaHn1QlCDh67qJJsNWGFsW8smjpACaQ0noyMalJIArfP40nxOKBlWfIW5vH5pFOt8LH8bi4UM4WW9fvFUITd0uimZcp9HwtpvrS9c+DooIgum+gl6vgjv+KCiaYtFnalZzqGpGNnkktARodMYNl2NhZwuCVwRg7WqpK9QOau0cNzhrVETwCyxQwyzMwhL4Tc/PYaVh1SkdA2tNf43+jSFnTRmn086BZQ9cKHIU0CBjgWUfu2PHT30ZsQKg6zByFonr66iauYiCx3kG4zhZxIFrRDWEMIfpVuEufUIiNRJpi+V74sSkSn3OQt1Th7UiDcSkkKWM2YqQeiLgP3To67Byh9u0xbLY+aMsD1JDIh55VPzaFcQe5A6t8MRuKE7N1T3SWqByoaJ0Eznu50XfSqB4sjakNDcN6c4thNgr1UZhjWncdQ0QKdrOk76qFuFd01JooX3Exu64Hlv3jsIT2oNPLuKm+xQ3sVQrNRTEXUC0cz0Cq1CUt0FY/FyiHpeBkNRDxnte+NzJ7MAXwJ/IA4GvZkZSVsG75bAs7Z3wQckqL83k8HNOEjspHChqVOP99Ed/n9Ve6LCHhINwFSZ1wdY4xBF4hiUl04lhGk2zzrNewIcCi42C/6D/FDICy47rC8Af/ukwKrf8kyM2C+uiHkgWBbeZcFofF+sbAu0uTCF7VzMajgLoIo0TYGAvalr/zRJ+NAgXA5V7rxAkvkAd+eMVZrabNJW3nzPRcfQLqQ8at7EaUVizexfup5wNP77LeUtedJ/x586E2g00UpsOGVil6yuoCwinPQl+Moz8YuioMAoPn6ZBS9jHpi8ca25XgHueFKMjukCo8osM5bCmj5j6EpAAd8HyDrAdIzlYGcQczBn6YlHDs1IDK1ABhSuBECJv1HJ0/6vRjUtX2DqL9ZE+ttTUZT4mmHXuZcGLv9+aJKHabFYRSDmnBz/UNaaN4bhrYMftjPnA6X9QBJl9WwIjlniWdnVxb/ZW6He54ukMDMlUPkLxakKEazbOG79+4M4nkvbpCztzonoZY3M5+9loaZugs6Qq6E3K/yT2vbGyUArjty8w/VcBJu60Q+iuj6PbLjXSU2UdPAvjiQUhbNrvxh3qkJ8u22wsV1X9peoTGUQ0yOdhBmn3IkeEm9n5tDwELLUmMtj13hN4p0BUZs7UG7tBFV8gecTMLzWIe1QVEqQUaCwMBuMuacNNdoWKBPy3DWqVxSVwhaHxfxkvEuAc1I3E5GtKgQMBvrw9Xo1etdUgDCAA/vsoLq31P8V2imc7VNknSpU1uAAcyQk48V7FBocghXqepLGmzw6Iz6CNWyShkQuegsOEVCRbs5gM04qRH24Ht70hpl9s8M6k+EhzCo HFObvBbMRrvk3Futq+LXA47aVgXurmFLp5nQGOE1GwRF1JekBbj+XPXA0xwAAA","w":640,"ht":175},{"t":"p","h":"Таблица 10"},{"t":"p","h":"<span class=\"pg\" data-n=\"67\">67<\/span>Задание 3. Спишите предложения, раскрыв скобки."},{"t":"p","h":"1. Знаете ли вы, что основные идеи (построение) универсальной вычислительной машины были разработаны английским ученым Чарльзом Бэббеджем ещё в XX веке?"},{"t":"p","h":"2. Его проект механической вычислительной (машина) имел все основные блоки, которые есть в современных ЭВМ."},{"t":"p","h":"3. Но осуществили идею (учёный) только во второй половине XX века с развитием (электроника)."},{"t":"p","h":"4. В развитии (техника) вычислений можно выделить два этапа."},{"t":"p","h":"5. В 1947 году в Киеве небольшая группа учёных под руководством академика С. А. Лебедева начала работать над (создание) первой в Европе электронно-вычислительной машины."},{"t":"p","h":"6. Постепенно люди создали инструменты, помогающие вести (вычисление)."},{"t":"p","h":"Т. Люди научили машину самостоятельному осуществлению сложных (расчеты) по заданной ей программе."},{"t":"p","h":"8. Чтобы научить ЭВМ считать, математики должны были глубоко проанализировать все используемые методы и приемы (вычисления), пересмотреть их и создать новые."},{"t":"p","h":"9. Современные устройства (электроника) являются небольшими и имеют высокую надежность и быстроту (действие)."},{"t":"h3","h":"Словарь"},{"t":"v","l":["универсальный – используемый для достижения","разнообразных целей","осуществить – сделать действительным, реальным","надёжность – прочность и безошибочность в работе"]},{"t":"p","h":"у Какими членами предложения являются управляемые"},{"t":"p","h":"слова?"},{"t":"p","h":"у Какой формой они выражены?"},{"t":"p","h":"у К какому стилю речи можно отнести приведённые пред-"},{"t":"p","h":"ложения?"},{"t":"p","h":"<span class=\"pg\" data-n=\"68\">68<\/span>В научном стиле речи часто встречаются отгла- Г.Я Ш гольные имена существительные; словосочетания с"},{"t":"p","h":"управляемым словом в форме родительного падежа, выполняющим роль определения или дополнения."},{"t":"p","h":"Задание 4. Расскажите, что вы узнали об истории развития счётных инструментов. Включите в свой рассказ данные ниже словосочетания."},{"t":"p","h":"Использовать различные инструменты; использовать для увеличения физических возможностей человека; стало необходимым хранить, передавать, обрабатывать информацию; привести к возникновению счёта и письменности; увеличивать возможности человека; дать название счётному инструменту; выполнять большое количество вычислений; считать автоматически, считать с высокой скоростью; назвать ЭВМ, или компьютер."}],"sub":[{"title":"Способы","b":27},{"title":"ПЕТРОВСКИЙ КАБИНЕТ РЕДКОСТЕЙ","b":40},{"title":"УРОК 5. В МИРЕ КОМПЬЮТЕРОВ","b":102},{"title":"ОТ АБАКА ДО ЭВМ","b":116}],"section":"ШАГ НАВСТРЕЧУ","pages":[56,68]},{"title":"УРОК 6. В МИРЕ КОМПЬЮТЕРОВ (продолжение)","blocks":[{"t":"h3","h":"УРОК 6. В МИРЕ КОМПЬЮТЕРОВ (продолжение)"},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"v","l":["Опорные слова","","задачи","действий","алгоритм","решения","","в оперативной памяти","хранить | в машинной программе","в ЭВМ","","конструкция","функцию","вопросы","задавать","программу"]},{"t":"h3","h":"задачи"},{"t":"p","h":"решение | программы вопроса"},{"t":"h3","h":"ЭВМ"},{"t":"p","h":"ракеты моста"},{"t":"h3","h":"<span class=\"pg\" data-n=\"69\">69<\/span>Новые слова"},{"t":"p","h":"алгоритм – некоторая последовательность действий при"},{"t":"p","h":"решении задачи конструкция – расположение частей какого-нибудь устройства машинная программа – алгоритм, который запоминается в"},{"t":"p","h":"оперативной памяти оперативная память – устройство вычислительной машины,"},{"t":"p","h":"которое запоминает команды и данные функция – операция, которую выполняют с данными"},{"t":"p","h":"1. Составьте словосочетания с прилагательным оперативный и существительными память, помощь, решение, договор, действие."},{"t":"p","h":"2. К следующим глаголам подберите имена существительные."},{"t":"p","h":"Использовать ..."},{"t":"v","l":["выполнять ...","вводить ...","","3. Составьте словосочетания.","","Переходить (к чему?) ...","получить (что?) ...","состоять (из чего?) ...","задавать ...","хранить ...","обрабатывать ...","","хранить (в чём?) ...","выводить (из чего?) ..."]},{"t":"h3","h":"От СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 1. Образуйте от данных глаголов существительные. УС Для какого стиля речи характерны отглагольные имена"},{"t":"p","h":"существительные?"},{"t":"v","l":["Проводить – ...","выполнить – ...","управлять – ...","переходить – ...","обработать – ..."]},{"t":"p","h":"<span class=\"pg\" data-n=\"70\">70<\/span>Задание 2. Спишите текст, вставляя вместо точек подходящие по смыслу слова из задания 1."},{"t":"h3","h":"КАК УСТРОЕН КОМПЬЮТЕР"},{"t":"p","h":"Любой компьютер состоит из трёх основных блоков: процессора, памяти, устройств ввода-вывода. Процессор – это центральное устройство компьютера в котором идёт ... информации. Он может выполнять различные операции – арифметические, логические и другие. ... операций осуществляется с помощью машинных команд, которые хранятся в памяти. Последовательность таких команд представляет собой машинную программу. Скорость ... команд очень велика и зависит от конструкции компьютера."},{"t":"h3","h":"Словарь"},{"t":"p","h":"процессор – устройство компьютера, на которое из"},{"t":"p","h":"оперативной памяти машины выводится информация"},{"t":"v","l":["у Из каких блоков состоит любой компьютер?","у Какие операции может выполнять процессор?"]},{"t":"p","h":"Производные предлоги стилистически окрашены. Они характерны для научного и официально-делового стиля."},{"t":"p","h":"Задание 3. В следующих предложениях Найдите словосоче- 124 тания с отыменными предлогами. Замените отыменные"},{"t":"p","h":"предлоги непроизводными, запишите полученные предложения. (В случае затруднения воспользуйтесь таблицей 11.) Скажите, изменяется ли при этом падежная форма управляемого существительного."},{"t":"p","h":"1. В деле формирования научных знаний учащихся большую роль играют современные компьютеры. 2. В целях повышения компьютерной грамотности во многих школах введено программирование. 3. Наука должна в ближайшие годы шагнуть вперед в деле создания новейших конструкций ЭВМ. 4. В течение ближайших 20 лет сложные задачи предстоит <span class=\"pg\" data-n=\"71\">71<\/span>решить и в области экономики. 5. В связи с болезнью учителя уроки по информатике пришлось отменить."},{"t":"img","src":"data:image/webp;base64,UklGRvhsAABXRUJQVlA4IOxsAAAwCwKdASqAApkCPrVUpEynJKewpTOMEhAWiWdtnPv9/x06H/9vL583ijnD//va8HwB/9X0GvS5/s+pzNz/7LuVwwHun3SDWfJ/8HwYT4OIF7r/xfYD8JfnDtSv7LrU3nO5oh4X/90w/b0Kud/0KRPo1eZwL/Uv/2N4b/VeiE3YD1yf4306nr2//LI0ux3gf/qv9B/hfx19V/xn6z/N/3X/H/9n2J6+j/L/w/qh/Mfvf+//un7/e0v/b/z3lH8Q/9f/Df5X3BfzT+kf8j+9/v/8D/0X7Vd+bsX/M/Y/2Bfbz8H4/Pwv/i/z/rF+d/2j/1/434Av51/bf/B7Dd/N637Av9a/3Xqtf4f7g+qX9E/3P7b/BATUfoUkhhNxel5DxzIJx7MHvbtt+JBQExRrNHgETX2YJImIHcbPGkNoRyXD9jTUjJOg7i2bnzM0+LVZu6H22BZGjH2X2uztDdj9zOUkUiZsmGvntN2oOpeBccNpHpKfsdMft36PiRLulLrHbfwBRMNZBkHycoTWjAj1q/yi7Z4dqFfLbf4h01EQA3BG4+1BIIRt6sy5j3/KiyUtui1r/wFWl5+bh2Gq5XqOWHnTzYMBfVY4w4nNRiCrASWMVuWD2Zqpk8UibUGSHKCpBA7ukJdycT5tzoWctz4hCvU6fUrwSQacW1AJfjTmaGvZ6Ug/DNracG+iHnkg4d66QOc07q/JNSs6jDb/T/tLP1N1d+qQK8Qbt3WgyCQpjYgDED55FPcmo8u2RHC27btgD99pWAwUGLNIDIyRRSn/yP8UV2+9CmGJ8FE+Aapk9mwuXpaI6MFum/jqTb1LRNehZ8unEqS5mHy5jkbI5FDZANJ1XWVl2ORBngLzLcXK5sNvRR9OWc1cbAZjG613vq+nzxHFdJ0jBjXhJFlG8XaY6KwF8cxpCq8wX6/pLbPXNd9b/XaRBk+/p/xJvuoSdkZs4fmKPe8gMxtO1t4Io1Dk0mtIj+jLgD55Brj4iOveWOAEqDYVae6ZLtmhtx4YQS6QqzV2qDTHtDVdtra+dokQOahhiyy+x62Lazq2LJ1YtOg0KYfiPOptLeeumSP0rGNpzMEJGkHTbKO6oDmPZVpkW3139N9Sq08OTRNY46UpSjgA08wE1/1KbamQ9LvnkznMqHkzKC8K+BdnM8dmqAwXupkB3tWw5e+0FDFc9mINHUZsAgXM/DsTlPVueplPlt/JmGSeUyMUfGRx9WiCSI1gIEqOAhxfnDw1Ptlj6eerYVQoFEbvJ6lS/brFBD2WedueIV7FW8+eDvOhNU+A/rby1JD9wCCjDSclprjztEz9+7NyK9zi5XcZaJ3B9wZeuNgz2MzxWQYod/SCFicDCcNrfZo+OgQ7isVyv2UqgzOd42hTwtOMVxndgnBWmecrH56uyVSp3NioVltPEqaplj1sRrJU9O1Bw3 трументы и т. п. Следовательно, средствами труда называются все те вещи, с помощью которых люди воздействуют на предметы труда."},{"t":"p","h":"а) разговорный; 6) публицистический; в) официально-деловой; г) научный"},{"t":"p","h":"<span class=\"pg\" data-n=\"74\">74<\/span>3. Восстановите последовательность пунктов плана в соответствии"},{"t":"p","h":"с логикой текста."},{"t":"h3","h":"МУЗЫКА В НАШЕЙ ЖИЗНИ"},{"t":"p","h":"Задумывались ли вы когда-нибудь над тем, какой скучной, серой и неинтересной стала бы наша жизнь, если бы из нее вдруг исчезла музыка?..,"},{"t":"p","h":"Музыка – это одно из самых удивительных чудес, созданных человеком."},{"t":"p","h":"Самое главное чудо, я думаю, заключается в том, что без музыки – искусства очень древнего – не мог бы жить ни один народ на земле, что входит музыка в жизнь человека с самого раннего детства и не расстается он с ней до последних дней своих. Правда, наши ранние музыкальные впечатления чаще всего ограничены самыми простыми видами музыки – песней, маршем и танцем. Но сколько прекрасной музыки заключено в этих простых, порой совсем небольших сочинениях!"},{"t":"p","h":"Мы любим музыку за красоту, которую она вносит в нашу жизнь, за то, что слышим в ней чувства человека и его мысли, мечты и поступки, слышим всё, чем живут не только отдельные люди, но и целые народы, всё человечество. Мы ощущаем в музыке не только мир, в котором жили люди до нас, но, словно в чудесном зеркале, узнаем самих себя, свою жизнь."},{"t":"p","h":"Де Б. Кабалевский"},{"t":"h3","h":"План"},{"t":"p","h":"1. Мы ощущаем в музыке не только мир, в котором жили люди до нас, но и узнаем самих себя, свою жизнь."},{"t":"p","h":"2. Музыка входит в жизнь человека с самого раннего детства."},{"t":"p","h":"3. Музыка – одно из самых удивительных чудес."}],"sub":[{"title":"ЭВМ","b":5},{"title":"КАК УСТРОЕН КОМПЬЮТЕР","b":21},{"title":"МУЗЫКА В НАШЕЙ ЖИЗНИ","b":50},{"title":"План","b":56}],"section":"ШАГ НАВСТРЕЧУ","pages":[69,74]},{"title":"ТЕМА 4 ОДНОСОСТАВНЫЕ ествительные используйте в ответе на вопрос"},{"t":"p","h":"“Что прославляют пословицы?”."},{"t":"p","h":"3. Вставьте подходящие по смыслу слова в следующие предло-"},{"t":"p","h":"жения."},{"t":"p","h":"1. В пословицах прославляется ..., ... мысли. 2. В пословицах высмеивается .... 3. Пословицы разных народов сближает ... смысла."},{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 2. Прочитайте пословицы. Определите вид пред- С п ложений."},{"t":"p","h":"1. Цыплят по осени считают. 2. Хорошо смазал – хорошо и поехал. 3. Не годится худым (плохим) хвалиться, 4. Терпенье и труд всё перетрут. 5. Работать не заставят и есть не посадят. 5. Много захочешь – пораньше с постели встанешь."},{"t":"v","l":["у О чём эти пословицы?","у Вкаком стиле речи часто встречаются пословицы?","у Какие пословицы о труде есть у вашего народа?"]},{"t":"p","h":"Задание 3. Прочитайте следующий замените, где К? это возможно, двусоставные предложения определённо-"},{"t":"p","h":"личными, Как изменился при этом смысл текста? К какому стилю речи относится полученный текст?"},{"t":"p","h":"Я люблю осеннее ненастье. Я люблю, несмотря на дождь и мокрый снег, шагать по проселочным дорогам, по сырой листве."},{"t":"p","h":"Целый день, не зная устали, я брожу и брожу по узеньким тропкам. Я едва передвигаю усталые ноги. А пробежит деньдругой – без следа исчезнет усталость. И снова я отправляюсь туда, в нехоженые дали, открывать красоту родного края."},{"t":"p","h":"<span class=\"pg\" data-n=\"79\">79<\/span>Определённо-личные предложения придают изложению разговорную простоту и выразительность."},{"t":"p","h":"Задание 4. Подберите к следующим высказываниям К? синонимичные пословицы. В каком случае точнее и"},{"t":"p","h":"ярче выражена мысль? Какой формой глагола выражено сказуемое в пословицах? Какие это предложения?"},{"t":"p","h":"1. Когда человек хочет получить хороший результат в деле, он должен потрудиться. 2. Если какой-то конфликт закончился, то нет необходимости искать другой путь его решения. 3. В жизни человек должен всегда думать о сохранении чувства собственного достоинства так же, как мы думаем о сохранении какой-либо дорогой для нас вещи."},{"t":"p","h":"4. Человек должен сначала сделать обещанное, а не обещать, ничего не делая. 5. Если кто-либо занимается серьёзным делом, то он должен и вести себя серьёзно."},{"t":"v","l":["$ Любишь кататься – люби и саночки возить.","„У Береги платье снову, а честь смолоду.","Хорошо смазал, хорошо поехал.","После драки кулаками не машут.","Не спеши языком – торопись делом."]},{"t":"p","h":"Обобщённо-личные предложения широко употребляются в пословицах для выражения общих суждений, не относящихся к определённому лицу."},{"t":"p","h":"Задание 5. Прочитайте следующее высказывание. Согласны 1 ли вы с ним? Найдите односоставные предложения, опре-"},{"t":"p","h":"делите их вид."},{"t":"p","h":"Нет на земле ни одного народа, который бы не имел своих пословиц. Этому не следует удивляться. Поражаешься их смысловой близости. “Каждая вещь имеет дурную и хорошую сторону”, – говорят немцы. “На каждую дыру в мешке найдется заплата”, – говорят словаки. А по-русски: “Нет худа без добра”. А по-кыргызски?"},{"t":"p","h":"<span class=\"pg\" data-n=\"80\">80<\/span>Задание 6. Подготовьте краткое сообщение на уроке о у пословицах. Материалы урока помогут вам в этом. В каком"},{"t":"p","h":"стиле вы построите своё высказывание?"}],"sub":[{"title":"Форма выражения","b":15}],"section":"ШАГ НАВСТРЕЧУ","pages":[76,80]},{"title":"Урок 2. ПРИГЛАШАЕМ НА ЧАЙ","blocks":[{"t":"h3","h":"Урок 2. ПРИГЛАШАЕМ НА ЧАЙ"},{"t":"p","h":"Чай не пьёшь – откида силу берёшь? Пословица"},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"p","h":"Опорные слова китайский заварить чай индийский чай"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>траву<\/td><td>цейлонский<\/td><\/tr><tr><td>бодрящий<\/td><td>желанный<\/td><\/tr><tr><td>лечебный<\/td><td>напиток<\/td><td>прекрасный<\/td><td>аромат<\/td><\/tr><tr><td>ароматный<\/td><td>приятный<\/td><\/tr><tr><td>заварочный металлический<\/td><td>чайник<\/td><td>настой<\/td><td>листьев корней<\/td><\/tr><tr><td>фарфоровый<\/td><td>отвар<\/td><td>трав<\/td><\/tr><\/table><\/div>"},{"t":"h3","h":"Новые слова"},{"t":"p","h":"бодрящий – делающий человека бодрым желанный – тот, которого очень желают заварить – положить чай (траву) в чайник и залить кипятком настой – водный раствор, в котором долго держали (настаивали)"},{"t":"p","h":"какое-либо вещество, растение отвар – водный раствор, в котором долго отваривали какое-либо"},{"t":"p","h":"вещество, растение фарфоровый – сделанный из фарфора, белого плотного ма-"},{"t":"p","h":"териала, который получают из глины и специальных добавок"},{"t":"v","l":["<span class=\"pg\" data-n=\"81\">81<\/span>1. Подберите однокоренные слова к слову чай,","","2. Подберите определения к данным существительным,","... аромат","... напиток","... ОПЫТ","... отвар","... настой"]},{"t":"p","h":"3. Образуйте от данных глаголов существительные по модели"},{"t":"p","h":"гл. + -ание (-ение)."},{"t":"v","l":["Изучать – ...","появлять(ся) – ...","распространять – ...","настаивать – ...","заваривать —"]},{"t":"p","h":"у В каком стиле речи чаще встречаются эти существи-"},{"t":"p","h":"тельные?"},{"t":"v","l":["4. Образуйте от данных прилагательных наречия.","Приблизительный —"]},{"t":"p","h":"предварительный – ..., сравнительный – ...."},{"t":"p","h":"5. Употребите полученные наречия в следующих предложениях. ... 300 лет тому назад чай появился в России. За ... короткий срок чай распространился по всей стране. В ... нагретый чайник насыпают чай."},{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 1. Прочитайте текст. Какой формой глагола Я выражен главный член в выделенных предложениях?"},{"t":"p","h":"Определите тип односоставных предложений."},{"t":"h3","h":"ИЗ ИСТОРИИ ЧАЯ"},{"t":"p","h":"История чайного растения начинается с Китая (до н.э.). Пастухи Древнего Китая из отвара высушенных листьев чайного кустарника готовили бодрящий “божественный <span class=\"pg\" data-n=\"82\">82<\/span>напиток”. Народная медицина в Древнем Китае находилась на высоком уровне развития, и лекари, естественно, активно взялись за изучение лекарственных свойств чайного листа. Чай стали применять в лечебных целях."},{"t":"p","h":"До появления чая в России пили настой из мяты, душицы, иван-чая, барбариса, смородинового листа, плодов шиповника и т. д."},{"t":"p","h":"Китайский чай проник сюда из Монголии через Сибирь в XVII веке. Чаепития начались со дворца царя, а затем уже распространились в народе."},{"t":"p","h":"За сравнительно короткий срок в России стали широко употреблять чай."},{"t":"p","h":"По А. А. Алтымышеву и У. А. Алтымышеву"},{"t":"h3","h":"Словарь"},{"t":"p","h":"лекарь – человек, который лечит народными средствами"},{"t":"p","h":"у К какому стилю речи относится этот текст?"},{"t":"p","h":"у Подготовьте краткую историческую справку о появлении"},{"t":"p","h":"чая, используя материал текста."},{"t":"p","h":"3 ® А жения используются в научном стиле речи. Они Неопределённо-личные односоставные предло-"},{"t":"p","h":"отличаются четкостью, краткостью, действующее лицо в них не называется."},{"t":"p","h":"Задание 2. В приведённом ниже тексте поставьте глаголы Г в нужной форме. Какой вид односоставных предложений"},{"t":"p","h":"используется в этом тексте? Как вы думаете, почему? Как известно, англичане – одни из самых больших любителей чая. По национальной английской традиции чай (пить) в определённое время."},{"t":"p","h":"В заранее облитый внутри кипятком чайник (засыпать) чай. Чай (настаивать) приблизительно 5 минут. В то же время в прогретые чайные чашки (наливать) свежее молоко по желанию. Затем (наливать) чай в чашки. Никогда <span class=\"pg\" data-n=\"83\">83<\/span>(не поступать) наоборот – (не наливать) молоко в чай. Многолетний опыт показал, что когда (наливать) молоко в чай, никогда не получается желанный аромат и вкус. Эта традиция очень строго соблюдается. Чай с молоком (пить) утром, во время завтрака, в обед и в пять часов, после обеда. Кроме Англии, этот обычай чаепития широко распространён в США, Канаде и в других странах."},{"t":"p","h":"у В какой последовательности нужно заваривать чай по-"},{"t":"p","h":"английски? Дайте советы, используя наречия сначала, потом, во-первых, во-вторых, наконец."},{"t":"p","h":"и Как вы думаете: какой совет даст англичанин по заварива-"},{"t":"p","h":"нию чая? Какой вид односоставных предложений поможет высказаться об этом?"},{"t":"p","h":"у Что расскажет англичанин о традициях чаепития в его"},{"t":"p","h":"стране? Какие виды предложений следует употребить в этом рассказе?"},{"t":"p","h":"Задание 3. Перепишите безличные предложения, встав- К] ляя в них подходящие по смыслу сказуемые. Какими"},{"t":"p","h":"глагольными формами будут выражены эти сказуемые? Днём ..., ак вечеру ... прохладнее. С гор ... свежестью, запахом трав. Во дворе ... самовар. ... ароматный чай. ... свежими лепешками. ... легко и свободно после трудового дня."},{"t":"p","h":"ф Становится, было душно, дышится, заваривается, „У повеяло, запахло, ставится."},{"t":"p","h":"4 Задание 4. Преобразуйте двусоставные предложения в не-"},{"t":"p","h":"1. Очень ценят чай китайцы. Для приготовления чая они употребляют наиболее ароматные и благородные сорта."},{"t":"p","h":"2. Японцы обычно приготавливают чай, как и китайцы, в чашках с крышкой. Готовый напиток они подают в маленьких чашках, напоминающих кофейные, без сахара или других <span class=\"pg\" data-n=\"84\">84<\/span>добавок. Японцы пьют по несколько чашек перед едой или во время еды."},{"t":"p","h":"3. Русские заваривают чай в фарфоровых чайниках. Сначала они чайник согревают, ополаскивая горячей водой, потом насыпают чай и заливают кипятком. Хозяйки чайник накрывают салфеткой и оставляют на 5—10 минут для настаивания,"},{"t":"p","h":"у Как изменился стиль текста? Какой вывод можно сде-"},{"t":"p","h":"лать о сфере употребления неопределённо-личных предложений?"},{"t":"p","h":"Задание 5. Как заваривают и подают чай у кыргызов? Подготовьте информационную справку об этом, запишите её."}],"sub":[{"title":"ИЗ ИСТОРИИ ЧАЯ","b":22}],"section":"ШАГ НАВСТРЕЧУ","pages":[81,84]},{"title":"Урок 3. ПРАЗДНУЕМ ВМЕСТЕ","blocks":[{"t":"h3","h":"Урок 3. ПРАЗДНУЕМ ВМЕСТЕ"},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"h3","h":"Опорные слова"},{"t":"v","l":["праздновать","наступление тепла","","радостный","традиционный","","русский","кыргызский","народный","","угощать","обычай","устраивать","печь","устраивать мл","состязания","","праздник","","символ","любви"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"85\">85<\/span>Новые слова"},{"t":"p","h":"обычай – порядок поведения, переходящий от одного поко-"},{"t":"v","l":["ления к другому","символ – то, что служит особым знаком чего-либо","состязаться – соревноваться","традиционный – сохранившийся с давних времен","традиция – взгляды, идеи, поведение, вкусы, переходящие","от одного поколения к другому"]},{"t":"p","h":"1. Образуйте от глаголов существительные по модели гл. + -ание (-ение)."},{"t":"v","l":["Состязаться – ...","украшать – ...","праздновать – ...","приглашать – ...","","2. Вставьте вместо точек подходящее по смыслу слово."]},{"t":"p","h":"В праздники народ устраивает традиционные .... У многих народов приход весны отмечается .... На празднике одежда женщин отличается яркими ...."},{"t":"v","l":["3. Подберите синонимы к следующим прилагательным.","","Древний – ...","веселый – ...","национальный – ....","обычный —"]},{"t":"p","h":"4. Какие определения можно употребить со следующими словами?"},{"t":"v","l":["55 —&gt; обычай символ","","и Какие части речи выступают в роли определения?"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"86\">86<\/span>ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 1. Озаглавьте текст, запишите его. Выделенные К предложения постройте как обобщённо-личные."},{"t":"p","h":"Всюду снег, совсем как зимой. Только солнышко светит уже не по-зимнему. (Идти) по тропинке в лесу, перед тобой все бело. Под деревьями лежат синие-синие тени. Таких густых теней зимой (не увидеть). И небо голубеет уже повесеннему. (Смотреть) в него, (не мочь) глаз оторвать. Такое оно голубое, радостное, как будто согретое."},{"t":"p","h":"По Г. Скребицкому"},{"t":"p","h":"у К какому типу текста можно отнести приведенный выше"},{"t":"p","h":"фрагмент? Почему?"},{"t":"p","h":"у Какие виды односоставных предложений помогли автору"},{"t":"p","h":"передать личное отношение к природе?"},{"t":"p","h":"5 Задание 2. Прочитайте следующие зарисовки. С каких бы предложений вы начали их (смотрите материал для"},{"t":"p","h":"справок)?"},{"t":"p","h":"а) Ни звука не слышно вокруг..."},{"t":"p","h":"Здесь нет ни мух, ни комаров, не квакают лягушки и не лают собаки... И вдруг тишину прорезает громкий хохот, похожий на плач, или плач, похожий на хохот... Нельзя не вздрогнуть, услышав его впервые. “Чакалка кричит”, – говорят рабочие. Чакалкой они называют шакала – небольшого зверька, похожего и на собаку, и на лисицу... По Г. Ганейзер"},{"t":"p","h":"6) Алые облака, округлые, как бы туго надутые, плыли по небу с торжественной медлительностью лебедей: алые облака плыли и по реке, окрашивая цветом своим не только воду, не только легкий парок над водой, но и широкие листья кувшинок; белые свежие цветы водяных лилий были как <span class=\"pg\" data-n=\"87\">87<\/span>розы в свете горящего утра; красные капли росы падали с наклонившейся ивы в воду, распространяя красные с черной тенью круги."},{"t":"p","h":"По В. А. Солоухину"},{"t":"p","h":"Снежная пороша. Музыка апрельского дня. Утро «У 3 необыкновенное. Тишина в пустыне."},{"t":"p","h":"у К какому стилю и типу речи относятся приведенные фраг-"},{"t":"p","h":"менты?"},{"t":"p","h":"у Какой вывод можно сделать об особенностях употребления"},{"t":"p","h":"назывных предложений?"},{"t":"p","h":"Назывные предложения распространены в художественной литературе и служат средством описания и эмоциональной оценки изображаемого."},{"t":"p","h":"5 п празднике. Глаголы, данные в скобках, поставьте в нужной Задание 3. Запишите информацию о русском народном"},{"t":"p","h":"форме."},{"t":"p","h":"В конце февраля – начале марта в русских городах и деревнях (отмечать) веселый праздник – Проводы зимы, Масленицу. Это самый древний праздник русского народа."},{"t":"p","h":"Прихода весны на Руси всегда (ждать) с большим нетерпением, (радоваться) солнцу, теплу после холодной русской зимы."},{"t":"p","h":"(Праздновать) Масленицу неделю. Понедельник (называть) “встреча”, потому что в этот день (встречать) праздник. В каждом доме (печь) блины, которые (быть) символом весны. Вторник (называть) “заигрыш”, потому что в этот день (начинаться) масленичные игры. Среда (носить) имя “лакомки”. А четверг – “разгуляя”. В эти дни в городах и деревнях (строить) снежные крепости, (устраивать) веселые сражения. (Кататься) с ледяных горок на санях, (играть) в снежки – (прощаться) с зимними забавами."},{"t":"p","h":"В пятницу и субботу по обычаю (ходить) в гости, (навещать) родных. И на столе в каждом доме обязательно (бывать) традиционные блины."},{"t":"h3","h":"<span class=\"pg\" data-n=\"88\">88<\/span>Словарь"},{"t":"p","h":"забава – развлечение, игра навещать – приходить в гости у Как вы думаете, почему именно односоставные предложения"},{"t":"p","h":"используются в этом тексте?"},{"t":"p","h":"Задание 4. Прочитайте информацию, которая сообщалась по радио, – об одном обычае, существующем в Молдове. Найдите в тексте односоставные предложения. Определите их вид. Почему именно в этих частях рассказа используются данные виды предложений?"},{"t":"p","h":"Первое марта. На костюмах жителей Молдовы появляются украшения, напоминающие не то плоды, не то бутоны. Это марцишоры. В них сочетается два цвета – красный и белый, символ жизни, весны. Марцишор – значит “мартовский”."},{"t":"p","h":"В народе много веков живет такая легенда. Ранней весной, когда ярко засветило солнце, а земля нагрелась и потекли звонкие ручьи, в лесу вырос беленький цветочек – подснежник. Но зима очень рассердилась, увидя это живое существо. Подула зима холодным ветром, заморозила землю, засыпала холодным снегом цветок. Но на помощь ему пришла весна. Стала она разгребать колючий снег, чтобы освободить из-под снега цветок, и поранила себе палец. Из ранки капнула на снег горячая кровь весны, и растаял снег, и ожил цветок. Так соединились два цвета: белый цвет зимы и красный цвет весны. Они стали символами жизни, весны, любви, красоты."},{"t":"p","h":"С давних пор существует в Молдове обычай дарить друг другу первого марта красно-белые марцишоры. Их носят целый месяц до 1 апреля. А 1 апреля до восхода солнца вешают на ветку фруктового дерева – на счастье."},{"t":"h3","h":"Словарь"},{"t":"v","l":["бутон – цветок, который еще не раскрылся","","у К какому стилю речи относится этот текст?","О каком событии дается информация?"]},{"t":"img","src":"data:image/webp;base64,UklGRn5CAABXRUJQVlA4IHJCAAAwWgKdASqAAr0DPrVYok0nLbIrqRL52kAWiWlt5xXj1BfjCaprvXAl+Hl+yEV/0u+VxZ1zymcyfCZoAeWJ/t92cgJxybTFSK/8fLeQgoF//2Ra9WTmPcrI+Ff/D0I/E/+X/8/8Lz7/J/5P/1/suhR3/4OcxH/56K/jP/lrkYXOxAqnM4Z0//+DzHxdKCRjl0tO+cB/f3aWnC/o5/JoQYURvH1GMsX2Eh4Wt9tIqxr+4kZ6vFJa02NCyzy+PibDdbBVVpiCxbNPeLQACWM5gNJEj9IfxpN6qN0rWpZao1HWhxKEvKmKBEpCEbXNYSCX0UMAyTnIltaDj9gQkvN3KUIwjRQaS3w3kFWHw3U9so34f1IGL0Az+XU6Hd98Y6e7xOndzLVn0BoZdPkvQTrN/3i+ZnKLDNKT8pfh8JWq+1OD6xxvXFK+S3VulnyWS7VxWVZ1bJdySFXVpDQc7RkmXy3sWHS8+mbWptxuvFkkk7UY9if8OdsBfPeu5ofUQxRD6XYzlMm4m/wV/vdSYzmm8HCQXzY/xhOvO26ipBVbzpeE33lZBLGXaZUjQ4Y6gPAcLBbe8yNc5vMC213N6ye9r0o0sPvgsktY9Z3XUk0+LN11xpHs0/EEuNjp4sd90r0ED92TmVhb9N60XTGsbmwUhswTJFpdGJJ3Er6NCnaVdHezkHE9/qutLsjgNnZwuHT4pXHcur2oswWPOWvrKNFLRC+YaE3OUmOa3Dy/VmFYF0f+StT7WInBMu6drKB4dCdq0qamz4IFGuM7PwwWoIOKLAASESAMLjtHslv2DjLFKTwHaRcNdHtbk/Lavpq5u27ejVFtxYVXUbJpxrpF8nstVMaacIl450n1iOOxJ4l4LSCm2t4DzBOy25mjHMAwdP65CvMzYtO3V59SUe3JC2QGIPAhaoJc8IR2zBIIQUvPDbPPDt0MXieFfFwdGg4kxAzv+oTZukTHU/fqeGlpL0O3zQfqKCpaqXMvGtWbrRKS7wVIJFf4mrvkxqfcck9bRdTGRE4rvjEktdjpTG1HfavroxDdNjD5GFV00nky//W5ErBhcjP5w2XJTNcfIruTP2fe легенда легла в основу этого обычая? Расскажите ее.","В каком стиле вы построите свое высказывание?"]},{"t":"p","h":"Задание 6. Рассмотрите фотографию на с. 89. Какой кыргызский народный праздник сопровождается приготовлением национального блюда? Как оно называется? Подго-"},{"t":"v","l":["товьте комментарий к фотографии.","","Твой соЕСЕДНИК","","Задание 7. Как бы вы восстановили приведенный ниже","диалог?","","– Ты любишь весну? Я, знаешь, люблю. У нас всегда","весну радостно встречают. Даже праздник такой есть.","Масленица называется.","","– Это потому, что к этому празднику блины пекут.","","– Блины – символ весны, солнца.","Г","","– Наши праздники похожи. Это хорошо."]},{"t":"h3","h":"<span class=\"pg\" data-n=\"91\">91<\/span>Урок 4. ЦЕНА ХЛЕБА"},{"t":"p","h":"Палата бела, а без хлеба в ней беда."},{"t":"p","h":"Пословица Задание 1. Прочитайте текст. Найдите в нем односоставные предложения, определите их вид."},{"t":"p","h":"Хлеб. Это не только продукт питания – это символ родной земли, символ труда, доброты, дружбы. Его именем клялись, краюху материнского хлеба брали с собой в дорогу как благословение. Хлебом и солью на Руси до сих пор встречают и провожают дорогого человека, которому желают оказать почтение."},{"t":"v","l":["Словарь","клясться – давать клятву, обещание","краюха хлеба – большой кусок хлеба"]},{"t":"p","h":"благословение – согласие на что-либо, пожелание удачи"},{"t":"p","h":"и О чём говорится в тексте?"},{"t":"p","h":"У О чём, по вашему мнению, будем говорить на уроке?"},{"t":"h3","h":"От СЛОВА К СЛОВУ"},{"t":"v","l":["Опорные слова","ржаной","икать хлеб пшеничный","хлебобулочные изделия","","свежие","дрожжи","сухие","символ","сырые","","хлеба","ломоть","сыра","пресный","квашеный","","жизни","государства","труда"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"92\">92<\/span>Новые слова"},{"t":"v","l":["дрожжи – вещество, с помощью которого приготавливают","тесто для хлеба и хлебобулочных изделий","изделие – то, что делают из чего-либо, вещь","квашеный – который квасили (делали кислым)","ломоть – отрезанный кусок чего-либо","пресный – без дрожжей","ржаной – чёрный хлеб; хлеб, выпеченный из ржи","","1. Подберите антонимы к следующим словам.","Сухой – ...","квашеный – ...","свежий – ...","","2. Составьте словосочетания со следующими глаголами.","Выпекать ...","конкурировать ...","резать ...","испытывать ...","пользоваться ...","навещать ...","","3. Подберите однокоренные слова к слову хлеб."]},{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 2. Прочитайте текст. Каким рассуждением за-"},{"t":"v","l":["КС п вершает свой рассказ автор? Запишите его в тетрадь.","Определите вид односоставных предложений, которые","встречаются в этом рассуждении.","Хлеб до того стар, что установить точное время его","рождения невозможно. Уже древние египтяне знали пшеницу","и ячмень, умели приготовлять хлеб, лепёшки и пряники.","Правда, изделия эти были пресными и жёсткими, так как","дрожжи стали применяться в Египте позже, во втором","тысячелетии до нашей эры.","Древние греки и римляне не пользовались дрожжами","до начала нашей эры, пока не узнали о них от живущих"]},{"t":"p","h":"<span class=\"pg\" data-n=\"93\">93<\/span>на севере народов. Долгое время хлеб, испечённый на дрожжах, считали большой роскошью. А вот в Древней Руси о “квасном” хлебе знали раньше. Россияне умели печь его из ржи и пшеницы, как пресный, так и квашеный."},{"t":"p","h":"Кто умел печь хлеб, пользовался большим уважением. Качество выпечки находилось под особым контролем государства. Булочник, “сэкономивший” больше, чем следовало, сахара или масла, жестоко наказывался."},{"t":"p","h":"Пшеничный хлеб выпекали самых разных форм и размеров. А ржаной – в виде буханок. Ржаному тесту нельзя придать желаемую форму."},{"t":"p","h":"Ломоть хлеба – символ жизни каждого человека, хлеб – мощь государства. Поэтому и относиться к нему надо бережно: как к самому дорогому, ничем не заменимому в жизни человека."},{"t":"p","h":"Задание 3. Запишите информацию, поставив глаголы,"},{"t":"p","h":"п данные в скобках, в нужной форме."},{"t":"p","h":"В Египте (печь) пресный хлеб. В жарком климате тесто быстро закисало. Долгое время его (выбрасывать). Но нашлись люди, видимо, бедные, которые стали печь хлеб и из кислого теста. Так родился новый вид хлеба – кислый. Вначале в Европе (выпекать) пшеничный и ячменный хлеб, ас VII века (стать) употреблять ржаной хлеб."},{"t":"p","h":"Задание 4. Что вы узнали из текстов заданий 2 и 3 об истории хлеба:"},{"t":"v","l":["а) в Древнем Египте,","6) в Древней Греции,","в) в Древней Руси?"]},{"t":"p","h":"у Дайте устные исторические справки. Какие предложения"},{"t":"p","h":"вы будете при этом использовать?"},{"t":"p","h":"Задание 5. Прочитайте отрывок из статьи 3. Балаяна “Зерна нравственности”. Какие предложения использует автор в рассказе об отношении армянского народа к хлебу? Почему? Запишите эту часть текста в тетрадь."},{"t":"p","h":"<span class=\"pg\" data-n=\"94\">94<\/span>На могиле моего деда установлена гранитная плита, на которой я высек: “Мой дед хлеб резал стоя”. Он резал хлеб стоя даже в глубокой старости, когда ему шёл уже десятый десяток и когда мучительно трудно было всякий раз вставать на ноги. Это был обряд уважения. Символ. Высшая мудрость."},{"t":"p","h":"У нас в Армении редко когда произносят “завтракать”, “обедать”, “ужинать”, хотя эти слова, конечно, в лексиконе есть. У нас говорят “кушать хлеб”. И когда нас приглашают к столу, так и говорят: “Кушать хлеб”. Так говорят, даже если на столе только молоко."},{"t":"h3","h":"Словарь"},{"t":"v","l":["высекать – вырезать на камне","лексикон – запас слов в словаре, словарь языка","","у Оком рассказывает автор?","у Почему дед “хлеб резал стоя”?"]},{"t":"p","h":"у Как в Армении относятся к хлебу? Какой обычай доказывает"},{"t":"p","h":"это?"},{"t":"p","h":"у Как относится к хлебу ваш народ? Какие традиции связаны"},{"t":"p","h":"с этим?"},{"t":"h3","h":"ПРОВЕРЬ СЕБЯ"},{"t":"p","h":"1. Заполните таблицу примерами, испол сть или","последовательность","действий"]},{"t":"p","h":"Сое, – присоединение да, тоже, | Употребляются в я"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>тельные<\/td><td>также<\/td><td>разговорной речи<\/td><\/tr><tr><td>отрицательное<\/td><\/tr><tr><td>перечисление и<\/td><\/tr><tr><td>взаимоисключение<\/td><\/tr><tr><td>противопоставление,<\/td><td>а, но,<\/td><td>Употребляются в<\/td><\/tr><tr><td>Противи- сопоставление<\/td><td>однако, да | разговорной речи<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"тельные возмещение"},{"t":"v","l":["возможные последствия","взаимоисключение","Раздели- пе исление р","тельные","чередование действий"]},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"v","l":["а не то","","ли... ли","или... или","","Опорные слова"]},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>обогащает<\/td><td>вглядываться Е<\/td><\/tr><tr><td>природа<\/td><td>доставляет<\/td><td>вслушиваться<\/td><\/tr><tr><td>дает<\/td><\/tr><tr><td>о гармоничном<\/td><td>красоты<\/td><\/tr><tr><td>представление | об изящном<\/td><td>мир<\/td><td>природы<\/td><\/tr><tr><td>о совершенном<\/td><\/tr><tr><td>о целесообразном<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"эстетическая модель"},{"t":"h3","h":"<span class=\"pg\" data-n=\"98\">98<\/span>Новые слова"},{"t":"p","h":"гармоничный – отличающийся гармонией, соответствием всех"},{"t":"p","h":"составных частей друг другу"},{"t":"v","l":["обогащать – делать богатым духовно","совершенный – соответствующий образцу, эталону"]},{"t":"p","h":"целесообразный – соответствующий цели, наиболее разумный эстетическая модель – идеальное понимание красоты в при-"},{"t":"p","h":"роде, в одежде, в искусстве"},{"t":"p","h":"1. Выделите общий корень в данных словах, определите их значение."},{"t":"p","h":"Природа, природный, природоохранный."},{"t":"v","l":["2. Составьте словосочетания,","обогащает (кого?) ...","Природа доставляет (что?) ...","дает (что?) ...","","3. Вставьте вместо точек подходящие по смыслу слова."]},{"t":"p","h":"Красоту природы увидит только тот, кто умеет ... в мир. Природа ... нас духовно. Под влиянием природы формируется ... 06 изящном и совершенном."},{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 2. Каковы смысловые отношения между простыми предложениями в следующих сложносочинённых предложениях? С помощью каких союзов они передаются? Запишите предложения, расставьте знаки препинания."},{"t":"p","h":"1. Пригрело весеннее солнце и вот яблонька ожила начала расти повеселела и окрепла. (А. П. Гайдар) 2. Предрассветный лёгкий ветерок тронул листья в верхушке березы и они затрепетали с тревожным шумом. 3. То падал <span class=\"pg\" data-n=\"99\">99<\/span>как будто туман то вдруг припускал косой крупный дождь. (Л. Н. Толстой) 4. Солнце село но в лесу ещё светло. (И. С. Тургенев) 5. Здесь уже не пахло акацией и сиренью не слышно было музыки но зато пахло полем... (А. П. Чехов) 6. Вот откуда-то доносится отрывистый тревожный крик неуснувшей птицы или раздается неопределённый звук. (А. П. Чехов) Т. Светило солнце и степь дымилась и блестела. (К. Г. Паустовский)."},{"t":"p","h":"у К какому стилю речи относятся приведённые выше пред-"},{"t":"p","h":"ложения?"},{"t":"p","h":"у Какому типу текста (описательному или повествовательному)"},{"t":"p","h":"соответствуют эти предложения?"},{"t":"p","h":"Сложносочинённые предложения наиболее широко 5% используются в художественной, публицистической и"},{"t":"p","h":"разговорной речи. Они являются средством создания образной картины, передачи впечатлений, а также средством выражения чувств и оценок. Они могут передавать явления, которые происходят одновременно или следуют одно за другим, явления чередующиеся, сопоставляемые и противопоставляемые."},{"t":"p","h":"Задание 3. Закончите приведённые ниже предложения,"},{"t":"p","h":"1. Деревца не шевелились, и не чувствовалось даже слабого ветерка, а ....2. Над полями звенят жаворонки, а"},{"t":"p","h":"3. Еще в лесу лежит почерневший снег, а... .4. Дождь перестал, но .... царила жизнь и радость, и ...."},{"t":"p","h":"Задание 4. Спишите текст, вставляя подходящие по смыслу союзы. Какие отношения между предложениями они помогают передать?"},{"t":"p","h":"Внутренний мир человека связан с природой, (...) потребность в общении с красотой родной планеты была и остается одной из самых главных у человека."},{"t":"p","h":"Под влиянием природы, окружающей человека с детства, У него формируются эстетические модели красоты, (...) у <span class=\"pg\" data-n=\"100\">100<\/span>каждого народа они неповторимы в силу особенностей той природы, в которой он живет."},{"t":"p","h":"Жители Японии, например, восхищаются карликовыми деревьями, (...) русские предпочитают березу."},{"t":"p","h":"У каждого народа свои любимые растения, птицы, животные. Аист – любимец белорусов, (...) грузины лучшей птицей считают фазана. Жители северных лесов восхищаются глухарем, (...) степные жители предпочитают жаворонка. Дагестанцам дороже всех орел."},{"t":"p","h":"Сама природа вручает нам ключи от красоты. Сохранить бы их!"},{"t":"h3","h":"Словарь"},{"t":"p","h":"карликовый – небольшой высоты от рождения"},{"t":"p","h":"у Какие явления передают предложения в данном тексте?"},{"t":"p","h":"Прочитайте ещё раз третий и четвертый абзацы. Помогают ли противопоставления доказать главную мысль текста?"},{"t":"p","h":"Задание 5. Какое любимое дерево у кыргызского народа? Попытайтесь образно описать его."},{"t":"p","h":"Чтобы построить текст-описание, нужно:"},{"t":"p","h":"1) выразить общее впечатление об описываемом объекте, 2) показать его признаки, 3) сделать обобщение, дать оценку тому, что описывается."},{"t":"p","h":"Используйте для этого единые видовременные формы глагола во всем тексте, обсфоятельственные слова, оценочные эмоционально окрашенные слова, сложносочинённые предложения."},{"t":"p","h":"<span class=\"pg\" data-n=\"101\">101<\/span>Урок 2. КТО, ЕСЛИ НЕ МЫ..."},{"t":"p","h":"Задание 1. Прочитайте текст. О чём будем говорить на уроке?"},{"t":"p","h":"Мы живем на Земле, она наша кормилица, начало начал. Сегодня Земля в беде, и это понимают многие люди на планете. Экологи, политики, журналисты пишут и говорят об экологических проблемах, но слова не спасут природу. Её спасут реальные дела, а для этого нужно формировать экологическое мировоззрение."},{"t":"h3","h":"От СЛОВА К СЛОВУ"},{"t":"p","h":"Опорные слова интенсивный"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>биологический<\/td><td>биологическая<\/td><\/tr><tr><td>экономический<\/td><td>роц<\/td><td>солнечная<\/td><td>активность<\/td><\/tr><tr><td>экологический<\/td><\/tr><tr><td>наступательный<\/td><\/tr><tr><td>ограничительный Й<\/td><td>прогноз<\/td><td>традицио<\/td><td>я<\/td><\/tr><tr><td>позитивный<\/td><td>новая<\/td><\/tr><tr><td>негативный<\/td><\/tr><tr><td>экология<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"биосфера рес лики д района"},{"t":"h3","h":"Новые слова"},{"t":"p","h":"биосфера – атмосфера, почва и вода как среда обитания всего"},{"t":"p","h":"живого интенсивный – очень сильный, напряженный мировоззрение – система взглядов на природу и общество негативный – отрицательный ограничительный – отделяющий границей, не позволяющий"},{"t":"p","h":"что-либо увеличивать или расширять"},{"t":"p","h":"<span class=\"pg\" data-n=\"102\">102<\/span>позитивный – положительный прогноз – сформулированное на основе исследований мнение"},{"t":"p","h":"о том, что будет в развитии или исходе чего-либо экология – наука о взаимосвязи растений, животных и"},{"t":"p","h":"окружающей среды, об отношениях человека и общества с природой (окружающей средой)"},{"t":"p","h":"1. Образуйте прилагательные от существительных по модели"},{"t":"p","h":"сущ. + -ческ-."},{"t":"v","l":["Биология – ...","экология – ...","экономика – ...","физика – ..."]},{"t":"p","h":"2. Образуйте от прилагательных существительные по модели"},{"t":"p","h":"прил. + -ость."},{"t":"v","l":["Активный – ...","интенсивный – ...","грамотный – ...","совершенный – ..."]},{"t":"p","h":"3. Образуйте существительные от глаголов по модели гл. + -ание"},{"t":"p","h":"(-ение)."},{"t":"v","l":["Формировать – ...","удовлетворить – ...","искупить – ...","ограничить – ...","преобразовать – ...","использовать – ..."]},{"t":"p","h":"у Что общего в значениях данных существительных? В каком"},{"t":"p","h":"стиле речи часто встречаются такие существительные?"},{"t":"p","h":"4. Полученные в задании 3 существительные включите в следующие"},{"t":"p","h":"предложения."},{"t":"p","h":"Не каждое ... может привести к ожидаемым результатам. Проблема заключается в... природных ресурсов."},{"t":"p","h":"5.С какими существительными могут употребляться следующие"},{"t":"p","h":"глаголы?"},{"t":"v","l":["Сохранять ...","опаздывать ...","преобразовать ...","использовать ..."]},{"t":"h3","h":"<span class=\"pg\" data-n=\"103\">103<\/span>ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 2. Спишите текст, расставляя знаки препинания."},{"t":"h3","h":"ОСТОРОЖНО: ПРИРОДА!"},{"t":"p","h":"Мы выросли и живем на Земле. Человеческий организм связан со всеми компонентами биосферы растениями насекомыми микроорганизмами. Он входит в великий круговорот природы и следует ее законам. Организм животных реагирует на изменения температуры интенсивность солнечного излучения и так же реагирует на суточные и сезонные изменения человеческий организм."},{"t":"p","h":"Солнце оказывает влияние на многие биологические процессы на Земле а значит и на человека. Повышается солнечная активность и на Земле усиливается биологическая активность."},{"t":"p","h":"Конечно человек отличается от всех животных являясь частью общества. Человек не только приспосабливается к природе но он еще стремится и изменить её своим трудом."},{"t":"p","h":"Проблема заключается в разумном преобразовании природы рациональном использовании её богатств в интересах ныне живущих людей и будущих поколений."},{"t":"p","h":"Словарь микроорганизмы – мелкие организмы, которые нельзя увидеть"},{"t":"p","h":"без микроскопа"},{"t":"v","l":["насекомое – чымын-чиркей","рациональный – разумный, целесообразный"]},{"t":"p","h":"реагировать – отзываться каким-либо образом на действия"},{"t":"p","h":"извне солнечное излучение – лучи, идущие от солнца"},{"t":"p","h":"у Какие предложения помогли подчеркнуть единство человека"},{"t":"p","h":"с природой? А какое предложение выражает его отличие от животных?"},{"t":"p","h":"<span class=\"pg\" data-n=\"104\">104<\/span>Е Задание 3. Прочитайте отрывок из статьи С. П. Залыгина."},{"t":"h3","h":"ЭКОЛОГИЯ И ОБЩЕСТВО"},{"t":"p","h":"Начнем с того, что экология – нетрадиционная наука. Все другие науки в той или иной мере служили одной цели – удовлетворению нужд человека за счёт природы, а экология становится учением о способах ограничения потребления. До сих пор наука выдвигала прогнозы наступательные, но вот настало время прогнозов ограничительных."},{"t":"p","h":"Экология, кроме всего прочего, – это еще и искупление вины наукой, так как организованный ею процесс привел человечество на край гибели, которую наука уже не может предотвратить сама по себе, а только при самом деятельном участии общества..."},{"t":"p","h":"В жизни каждого из нас и всего человечества, по всей видимости, наступает новая эпоха – эпоха борьбы за дальнейшее наше существование, “экологическая эпоха”. И к этому новому времени, к вступлению в него мы должны подойти с открытыми глазами и с ясным сознанием."},{"t":"h3","h":"Словарь"},{"t":"v","l":["искупление вины – получение прощения","предотвратить – не дать совершиться чему-либо","эпоха – век, большой отрезок времени"]},{"t":"p","h":"у Какие предложения помогают раскрыть особенности эколо-"},{"t":"p","h":"гии как науки? Как автору удается показать это?"},{"t":"p","h":"у Ккакому стилю относится данный текст?"},{"t":"p","h":"у Почему говорят о наступлении “экологической эпохи”?"},{"t":"p","h":"В публицистике сложносочинённые предложеа ния используются для сопоставления и противо-"},{"t":"p","h":"поставления явлений действительности, раскрытия ее противоречий."},{"t":"p","h":"<span class=\"pg\" data-n=\"105\">105<\/span>Задание 4. Запишите текст. Расставьте знаки препинания. В каких случаях сочинительные союзы соединяют здесь сложные предложения, а в каких однородные члены предложения?"},{"t":"p","h":"Человеку нужны чистый воздух и вода зеленый шум лесов и пение птиц. Беречь природу охранять её богатства обязанность граждан записанная в Конституции."},{"t":"p","h":"Однако в последнее время экологическая обстановка в мире ухудшилась. Достаточно сказать об Аральском море и загрязнении воздуха в городах о разрушении почв и гибели животных."},{"t":"p","h":"Для решения этих проблем не только создаются государственные комитеты по охране природы но и работают общественные организации, следящие за состоянием природы."},{"t":"p","h":"Кроме того в Кыргызстане например создано несколько заповедников. Эти неповторимые места выполняют задачу охраны природы а также они играют большую роль в экологическом воспитании населения. И общение с природой и наблюдение за животными и птицами и наслаждение красотой пейзажей всё это несет здоровье и радость людям."},{"t":"h3","h":"Словарь"},{"t":"v","l":["заповедник – место, в котором охраняются редкие","животные, растения","","у Как можно озаглавить текст?"]},{"t":"p","h":"К. Задание 5. Проведите на уроке мини-конференцию на тему"},{"t":"p","h":"“Человек и природа”, используя материалы текстов заданий 2, 3, 4. Постарайтесь донести до слушателей основное содержание каждого текста; где возможно, дополните эту информацию."},{"t":"p","h":"Распределите роли в классе: кто докладывает, кто задает вопросы другим выступающим, кто готовит информацию в газету о конференции."},{"t":"v","l":["<span class=\"pg\" data-n=\"106\">106<\/span>Твой соЕСЕДНИК","","Задание 6. Восстановите диалог. Разыграйте его.","","– Ты знаешь, что это за наука – экология?"]},{"t":"p","h":"– А что, в Кыргызстане есть проблемы с экологией?"},{"t":"p","h":"– Но что же теперь делать?"},{"t":"p","h":"– А как государство участвует в охране природы?"},{"t":"h3","h":"Урок 3. ЖЕМЧУЖИНА КЫРГЫЗСТАНА"},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"p","h":"Опорные слова"},{"t":"raw","h":"<h4 class=\"mk\">площадь глубина поверхность<\/h4>"},{"t":"v","l":["нашептывает","озеро","озера","играет","выплескивает"]},{"t":"h3","h":"Новые слова"},{"t":"v","l":["выплескивать – выбрасывать вместе с водой","","1. От данных прилагательных образуйте краткую форму.","","Безмятежный – ...","тихий – ...","могущественный – ...","зловещий – ..."]},{"t":"p","h":"<span class=\"pg\" data-n=\"107\">107<\/span>2. Выберите слова, которые чаще употребляются в научном"},{"t":"p","h":"стиле."},{"t":"p","h":"Расположен, танцует, площадь, глубина, полоска-лучик, диковинный, поверхность."},{"t":"p","h":"3. Какие слова вы используете для художественного описания"},{"t":"p","h":"водной поверхности озера?"},{"t":"p","h":"Шумит, содержит, нашептывает, выплескивает, занимает, располагается, играет."},{"t":"h3","h":"ОТ СЛОВА К ПРЕДЛОЖЕНИЮ, К ТЕКСТУ"},{"t":"p","h":"Задание 1. Перепишите текст, расставьте знаки препинания, объясните их постановку."},{"t":"h3","h":"ИГРАЮЩИЙ ВОЛШЕБНИК"},{"t":"p","h":"Обычно Иссык-Куль тих и безмятежен. Играет сам с собой нашептывает себе что-то и нет-нет да выплеснет из себя радугу. Постоит она а потом вдруг сразу рассыплется и затанцуют по волнам диковинные краски то расходясь широким веером то складываясь в узкую лучевую полоску через всё озеро. Смахнет волной этот лучик-полоску упадет он на дно и словно растворившись там заиграет всеми красками синей и розовой и голубой и зелёной..."},{"t":"h3","h":"Словарь"},{"t":"p","h":"веер – желпингич раствориться – эруу, эрип кетуу"},{"t":"p","h":"у К какому типу относится приведенный текст? К какому"},{"t":"p","h":"стилю речи?"},{"t":"v","l":["у Почему текст называется “Играющий волшебник”?","у Какие слова помогают представить краски озера?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"108\">108<\/span>Задание 2. Прочитайте еще одно описание. В каком стиле Хоу? речи оно построено? Докажите."},{"t":"p","h":"Озеро Иссык-Куль расположено на высоте 1609 метров и занимает площадь 6332 квадратных километра. По своей глубине (70 метров) Иссык-Куль уступает лишь Байкалу и Каспию, воды в нём в два раза больше, чем в Аральском море, хотя водная поверхность в 10 раз меньше, Вода озера содержит соли натрия, калия, кальция, магния, кремния и радона. Вода озера лечебная."},{"t":"p","h":"Задание 3. Заполните таблицу 14 примерами, используя материалы заданий 1 и 2. Сравните научный и художественный стили речи."},{"t":"img","src":"data:image/webp;base64,UklGRvogAABXRUJQVlA4IO4gAAAwsgCdASqAAvMAPrVUpUwnJSuoJVY74XAWiWVuCp45C5XxWtCN5Et7r9dyHZT92y8RMXNUd+b/V1G+JMpkc95t8SZvMf04MlJ7E9x/+v8N/xb6J/If2r91P8DvnOo78k+8H77+3+iP/V8MfjJ/teoF+XfzXzXH83MagH858O/5D/wej/5z/Yv+7/h/gF/XHi0aBPkr/5fmo/Rf9sFnsM9loyxBMDYKyexRaAhWsrb8iKh5MsQTA17XV3r14jXAgmBsFZPYotATvUKnI9VmbvpqEa/Qvh6NSD974ARpv4YwW6I+uQPwK2Q4twX2uxIembvwdpVLf/0Y0C58PQaDt+5zGmvWrByToZsQsAUL9//bQt6b853G23Ok4P+Nkl7hhWAQa+uQ71UmTOzyuKDWbhUij2M66Ni+iZDWNZ1A+3Nm35Ahv8bF+jfrNnboAHmCffsc2X+7xQ+i1/6DkPfmuNiaoXDwMw7hfhRCdvxzIaxJSTz4xtAczXC3dnBSjCjcDtQkBggznkMP3ii+NTOyNw3iLy0d55U8OEh6KDMiDS9YKI5VZDxQaDmdTVXJvXIJA0JnVYWKQ8gk39J9cj6UhFiOxm90Eo6G4D4LNd9kPlAJWJvIh1I1Dpt6vAL2SHBRQyBQX9jV7LZ+C14R8Yggb+kSfuzrQFYil4Y7Vc7y0OIXxXaG58Me3yKgDFbDlhzsrX24h/x8L2+UBv5aCd5BfnBDxvCvZ92wXm5i4BSbkC9oIkqn/0D3E4rgeboVUO2oUDhdV6Py/uNFibXhbHFLP0U6QEyrigRxDKVctuWHvzYkaDyIrNUMpyzpwwd0ruhCiUwKzqQiKhVD67sn5ZFOlX/ISUENr0JOkzfqrvd355S286swIXMs3JSx5EPkUy489C6WxZYzLvbTjlrhjXkh/2K1Sop+d34GvDr6nt0tptZA9p0qS7CWKq3eGwC+JPfLYNu/C6qtIUeEpmZRaRZ9KMBlgxMYJe3FbQRjH5jiWAxc+Uc6jPc+GIOAltHgQ3+1UFAW4lAIj9Ukc3ixg0qBmQG0g0Gwz7qxbrRG1L+trOhlvN435dbmDQg5u7HEu0CUDTc60yMT4gJhmSe8pJxovoeTK2J9lb6+ayIldF4D8nSVMXroTIZPwTHaHkqY/7HCSexQZGNdUYttDCJtgYWVu7eUa/OKsPtsIice/skjv+2Epyvozc8BWef2YXQXH9zy7J9ONWpZ+nlyV9p2XoW/C3Qw0aQ3A48Losxjvf7iN/3drLHYNXwiXtFQ3Jb6zOTBOnyayfy3bX6OUR1r9M5Bz/wDxCBS16J75kWZqMtOXC+DxI1dcql/EDAB9uLRlHuSIN1eLnYnn+oBEopWeuxMaAU97pWsuaQ73fE6k6TLC/fB202Icb4wSrv5uNhTvV3WYtFA "p","h":"те употребление союзов."},{"t":"p","h":"Когда-то давно, так давно, что люди и забыли, когда это было, существовал древний город. Над ним, на вершине высокой крутой горы, возвышалась крепость могущественного хана, со всех сторон окруженная страшными ущельями, глубокими пропастями. Хан славился богатством ...."},{"t":"p","h":"Однажды он узнал, что в одной бедной семье кочевников есть девушка сказочной красоты, и решил жениться на ней."},{"t":"p","h":"У девушки был возлюбленный .... Тогда хан решил насильно увезти её. Когда девушка гуляла в горах, ожидая своего возлюбленного, ханские всадники схватили её и увезли в крепость."},{"t":"p","h":"<span class=\"pg\" data-n=\"109\">109<\/span>Хан осыпал её подарками .... “Я люблю другого”, – был её ответ. Ярость охватила хана. Как зверь, бросился он к девушке .... Дрогнули неприступные стены крепости, разрушились гранитные своды ...."},{"t":"p","h":"На месте зловещего ханского дворца, среди голых и темных утёсов, засверкало голубое, как небо, чистое, как хрусталь, горячее, как девичье сердце, горное озеро, которое люди назвали Иссык-Кулем (горячим озером)."},{"t":"h3","h":"Дополнительные материалы"},{"t":"p","h":"„. отовсюду пошла вода."},{"t":"p","h":"еще больше он был известен жестокостью в обращении со своими подданными."},{"t":"p","h":".. она выпрыгнула из окна в зияющую бездну. „. никакие дары не могли поколебать решения девушки."},{"t":"p","h":"„. она отказалась от предложения хана стать его женой."},{"t":"h3","h":"Словарь"},{"t":"p","h":"ущелье – узкое место между горами неприступный – такой, к которому трудно приблизиться, по-"},{"t":"p","h":"дойти утёс – высокая каменная гора без растительности зияющая бездна – хорошо видимая, открытая глубокая про-"},{"t":"p","h":"пасть у Прочитайте ещё раз легенду. Перескажите её."},{"t":"p","h":"Задание 5. Выступите в роли экскурсовода, рассказывающего об Иссык-Куле. Используйте для того материал урока."},{"t":"h3","h":"ПРОВЕРЬ СЕБЯ"},{"t":"p","h":"1. Расставьте знаки препинания."},{"t":"p","h":"Самое лучшее в мире смотреть как рождается день. В небе появился первый луч солнца. Ночная тень тихонько прячется в ущельях гор в густой листве деревьев в кружевах травы а вершины гор улыбаются ласковой улыбкой."},{"t":"p","h":"<span class=\"pg\" data-n=\"110\">110<\/span>Шаловливо покачиваются цветы. Они гордо улыбаются тянутся к солнцу а лучи его горят в каплях росы осыпают цветы и листья блеском бриллиантов."},{"t":"p","h":"По А. М. Горькому"},{"t":"p","h":"2. Тесты. Какие из предложений соответствуют указанной характеристике? Заштрихуйте в таблице нужную клетку."},{"t":"p","h":"1. Соединительные отношения между частями сложносочинённого предложения."},{"t":"p","h":"а) Дочь училась дома и росла хорошо, мальчик тоже учился недурно. (Л. Н. Толстой) 6) И слышно в тишине степной лишь лай собак да коней ржанье. (И. А. Бунин) в) Ещё в полях белеет снег, а воды уж весной шумят. (Ф. И. Тютчев) г) Или я не понимаю, или же ты не хочешь меня понять. (А. П. Чехов) д) Гул затих, и только вдали слышались тревожные выкрики. (В. Г. Ян) 2. Разделительные отношения между частями сложносочинённого предложения."},{"t":"p","h":"а) Восход поднимался и падал опять, и лошадь устала степями скакать (М. А. Светлов) 6) Был день, но в комнате горел свет. (А; Б. Чаковский) в) День ещё не начался, однако у завода было оживленно. (П.А. Павленко) г) Мастерство передавалось либо от отца к сыну, от деда к внуку, либо иногда определенное дело из века в век процветало в отдельной деревне. (В. И. Белов) д) Человек живет век, а память о нем – века."},{"t":"p","h":"3. Противительные отношения между частями сложносочинённого предложения."},{"t":"p","h":"а) Скоро весь сад, согретый солнцем, ожил, и капли росы, как алмазы, засверкали на листьях. (А. П. Чехов)"},{"t":"p","h":"<span class=\"pg\" data-n=\"111\">111<\/span>6) Дождя не было, но всё же было очень ветрено и холодно. (А. А. Фадеев)"},{"t":"p","h":"в) Лишь я, таинственный певец, на берег выброшен грозою. (А. С. Пушкин)"},{  он живёт! (К. Г. Паустовский) 4. Действуй так чтобы потом не раскаиваться. 5. Бывает такая внутренняя уверенность в себе когда человек может сделать всё. (К. Г. Паустовский) 6. Чтобы сделать что-нибудь великое нужно все силы души устремить в одну точку. (Л. Н. Толстой)"},{"t":"p","h":"Задание 2. Проанализируйте таблицу 15, ответьте на вопросы."},{"t":"p","h":"у Какие виды сложноподчинённых предложений вы знаете? у С помощью каких союзов и союзных слов придаточные"},{"t":"p","h":"предложения присоединяются к главному? Какие смысловые <span class=\"pg\" data-n=\"113\">113<\/span>отношения между придаточными и главными предложениями они передают?"},{"t":"p","h":"Таблица 15 Виды сложноподчинённых предложений К Значе-"},{"t":"p","h":"ние Определи- Изъясни- Обстоятель-"},{"t":"raw","h":"<h4 class=\"mk\">тельные Признак Средт<\/h4>"},{"t":"p","h":"тельные ственные"},{"t":"p","h":"Различные обстоятельства, при которых я признак ействие или | совершается дейст- вие, ен проявле-"},{"t":"v","l":["ния действия или","признака","т"]},{"t":"p","h":"что, чтобы, когда, пока, что, Союзы будто бы, как, | чтобы, потому что,"},{"t":"p","h":"словно,"},{"t":"v","l":["| как будто","если, кабы, хотя,","пускай, пусть"]},{"t":"raw","h":"<h4 class=\"mk\">который, какой, откуда, куда, чей, когда, что,<\/h4>"},{"t":"v","l":["кто, что,","который,","чей, отчего,","где, куда, откуда, как","почему, когда,","кто, где Ч сколько, где"]},{"t":"p","h":"там, туда, тогда,"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>' Указатель-<\/td><td>то. тот.<\/td><td>до тех пор, так,<\/td><\/tr><tr><td>ные<\/td><td>тот, такой<\/td><td>дый,<\/td><td>такой, для того,<\/td><\/tr><tr><td>слова<\/td><td>потому,<\/td><\/tr><tr><td>оттого, в случае<\/td><\/tr><\/table><\/div>"},{"t":"h3","h":"ОТ СЛОВА К СЛОВУ"},{"t":"v","l":["Опорные слова","","за справедливость","бороться | за мир","против войны","против ядерных испытаний","","выступать","запрещать | встречаться","' выезжать","ядерная","военная","опасность","трагиче

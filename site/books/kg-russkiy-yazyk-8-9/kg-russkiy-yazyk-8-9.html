<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Русский язык 8–9</title>
<style>/* Mobile textbook reader. No external fonts or libraries: everything works offline. */
:root {
  --bg: #ffffff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3;
  --panel: #f6f6f6; --accent: #1f6feb; --accent-fg: #ffffff;
  --fs: 19px; --lh: 1.55;
  --font: Georgia, "Noto Serif", "DejaVu Serif", "Times New Roman", serif;
  --bar-h: 48px; --foot-h: 28px;
}
[data-theme="sepia"] { --bg: #f5ecd9; --fg: #4a3b2a; --muted: #8a7458; --line: #e0d2b4; --panel: #ece0c6; --accent: #9a5b13; }
[data-theme="dark"]  { --bg: #111315; --fg: #d8d8d8; --muted: #8c8c8c; --line: #2a2d31; --panel: #1b1e21; --accent: #6ea8ff; --accent-fg: #0b0b0b; }
[data-theme="contrast"] { --bg: #000000; --fg: #ffffff; --muted: #c8c8c8; --line: #444; --panel: #151515; --accent: #ffd400; --accent-fg: #000; }
[data-font="sans"] { --font: Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 16px/1.4 Roboto, "Noto Sans", Arial, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- Library ---------- */
.lib { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lib h1 { font-size: 22px; margin: 8px 0 4px; }
.lib .sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; background: var(--panel); }
.card h2 { font-size: 18px; margin: 0 0 4px; }
.card .meta { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
.card .subt { font-size: 14px; margin: 0 0 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.chips button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); color: inherit; }
.chips button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: .5; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.lib-foot { color: var(--muted); font-size: 13px; margin-top: 24px; }
.lib-foot select { font: inherit; }

/* ---------- Reader ---------- */
.reader { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; user-select: text; }
.viewport { position: absolute; left: 0; right: 0; top: 0; bottom: var(--foot-h); overflow: hidden; }
.flow {
  height: 100%; column-fill: auto; padding: 20px 0 12px;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  will-change: transform; transform: translate3d(0,0,0);
  hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
}
.flow.anim { transition: transform .25s ease-out; }
.flow p { margin: 0 0 .15em; text-indent: 1.4em; text-align: left; }
.flow p.ni { text-indent: 0; }
.flow h1, .flow h2, .flow h3 { font-family: Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.25; break-after: avoid; page-break-after: avoid; }
.flow h1 { font-size: 1.35em; margin: .2em 0 .8em; text-align: center; }
.flow h2 { font-size: 1.15em; margin: 1.1em 0 .5em; }
.flow h3 { font-size: 1.0em; margin: 1em 0 .4em; }
.flow .verse { margin: .6em 0 .8em 1em; break-inside: auto; }
.flow .verse div { text-indent: -1em; padding-left: 1em; text-align: left; }
.flow .verse .gap { height: .7em; }
.flow figure { margin: .8em 0; text-align: center; break-inside: avoid; page-break-inside: avoid; }
.flow figure img { max-width: 100%; height: auto; border-radius: 4px; background: var(--panel); }
.flow figcaption { font-size: .8em; color: var(--muted); margin-top: .3em; }
.flow .box { border-left: 3px solid var(--accent); padding: .1em 0 .1em .7em; margin: .7em 0; }
.flow .pg { font: 11px/1 Roboto, Arial, sans-serif; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 4px; margin: 0 3px; vertical-align: 2px; text-indent: 0; white-space: nowrap; user-select: none; }
.flow .end { height: 1px; }
.flow .endnote { text-align: center; color: var(--muted); font-size: .8em; margin-top: 2em; font-family: Roboto, Arial, sans-serif; }
[data-theme="dark"] .flow img, [data-theme="contrast"] .flow img { filter: brightness(.9); }

.foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot-h); display: flex; align-items: center;
  justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.foot .t { overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }

.bar { position: absolute; left: 0; right: 0; background: var(--panel); border-color: var(--line); z-index: 5;
  transition: transform .2s; display: flex; align-items: center; }
.bar.top { top: 0; height: var(--bar-h); border-bottom: 1px solid var(--line); transform: translateY(-100%); padding: 0 4px; }
.bar.bottom { bottom: 0; border-top: 1px solid var(--line); transform: translateY(100%); padding: 10px 16px 14px; flex-direction: column; align-items: stretch; gap: 6px; }
.reader.ui .bar { transform: none; }
.bar .title { flex: 1; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.bar .info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* ---------- Sheets (TOC, settings) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85%; overflow: auto; background: var(--bg);
  border-radius: 16px 16px 0 0; z-index: 11; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
.sheet h3 { margin: 10px 0 12px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.toc a { display: block; padding: 11px 4px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 15px; }
.toc a.sub { padding-left: 20px; font-size: 14px; color: var(--muted); }
.toc a.cur { color: var(--accent); font-weight: 600; }
.set { margin: 14px 0; }
.set label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; }
.seg button.on { border: 2px solid var(--accent); font-weight: 600; }
.swatch[data-v="light"] { background: #fff; color: #1b1b1b; }
.swatch[data-v="sepia"] { background: #f5ecd9; color: #4a3b2a; }
.swatch[data-v="dark"] { background: #111315; color: #d8d8d8; }
.swatch[data-v="contrast"] { background: #000; color: var(--accent-fg); }
.goto { display: flex; gap: 8px; }
.goto input { flex: 1; min-height: 44px; font-size: 16px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px;
  border-radius: 20px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Textbook elements produced by tools/convert_pdf.py ---------- */
.flow .tasks, .flow .gloss { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45;
  background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0; }
.flow .tasks p, .flow .gloss p { margin: 0 0 .35em; text-align: left; }
.flow .gloss { border-left: 3px solid var(--accent); }
.flow p.note { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; font-style: italic; text-indent: 0; margin: .6em 0; }
.flow p.attr { text-align: right; text-indent: 0; font-style: italic; color: var(--muted); margin: .1em 0 .8em; }
.flow p.sep { text-align: center; text-indent: 0; color: var(--muted); margin: .5em 0; letter-spacing: .3em; }
.flow h2 .pg, .flow h3 .pg { font-weight: normal; }
.toc .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 4px 2px; }
.toc a .p { float: right; color: var(--muted); font-size: 13px; margin-left: 8px; }

/* ---------- Elements produced by tools/convert_layout.py (typeset textbooks) ---------- */
.flow figure img { cursor: zoom-in; }
.flow h4.mk { font: 700 .78em/1.3 Roboto, "Noto Sans", Arial, sans-serif; letter-spacing: .05em; color: var(--accent);
  margin: 1em 0 .3em; break-after: avoid; page-break-after: avoid; }
.flow p.hl { color: var(--accent); text-indent: 0; }
.flow p.small { font-size: .82em; text-indent: 0; color: var(--muted); }
.flow sup, .flow sub { font-size: .7em; line-height: 0; }
.flow .kbox { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45; background: var(--panel);
  border-radius: 8px; padding: .45em .7em; margin: .5em 0; border-left: 3px solid var(--accent); }
.flow .kbox > b { display: block; }
.flow .frame { background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0;
  font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; line-height: 1.45; }
.flow .frame p { text-indent: 0; margin: 0 0 .35em; text-align: left; }
.flow .tbl { margin: .8em 0; font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .8em; line-height: 1.35; }
.flow .tbl .tt { font-weight: 600; text-indent: 0; text-align: center; margin-bottom: .3em; }
.flow .tbl table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.flow .tbl th, .flow .tbl td { border: 1px solid var(--line); padding: .3em .35em; vertical-align: top; text-align: left; overflow-wrap: anywhere; hyphens: auto; }
.flow .tbl th { background: var(--panel); }
.flow .tbl tr { break-inside: avoid; page-break-inside: avoid; }

.zoom { position: fixed; inset: 0; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; background: rgba(0,0,0,.92); z-index: 30; }
.zoom-in { position: absolute; inset: 0; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
.zoom-in img { margin: auto; flex: none; touch-action: pan-x pan-y; object-fit: contain; background: #fff; cursor: zoom-in; }
.zoom-x { position: absolute; top: 8px; right: 8px; color: #fff; background: rgba(0,0,0,.5); z-index: 31; }
.flow h4.sh { font: 700 .95em/1.3 Roboto, "Noto Sans", Arial, sans-serif; text-align: center; margin: .8em 0 .4em; break-after: avoid; page-break-after: avoid; }

/* maths books */
.flow h4.ex, .flow h4.try { font-family: Roboto, Arial, sans-serif; margin: 1.1em 0 .3em; font-size: 1em; }
.flow h4.ex { display: inline-block; background: #f7e400; color: #111; padding: .1em .6em; border-radius: 3px; }
.flow h4.try { color: var(--accent); }
.flow p.goal { font-size: .85em; text-indent: 0; background: var(--panel); border-radius: 8px; padding: .4em .7em; }
.flow b.bd { display: inline-block; text-indent: 0; padding: 0 .4em; border-radius: 1em; background: var(--fg); color: var(--bg);
  font: bold .8em/1.45 Roboto, Arial, sans-serif; margin-right: .2em; }
.flow b.nb { display: inline-block; text-indent: 0; min-width: 1.4em; border-radius: 4px; background: var(--accent); color: var(--accent-fg);
  text-align: center; font-size: .8em; margin-right: .3em; }
.flow .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.15; margin: 0 .1em; }
.flow .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .15em; }
.flow p.ml { text-indent: 0; padding-left: 1em; }
.flow p.side { font-size: .85em; }
.flow details.ans { margin: .3em 0 .8em; font-size: .9em; }
.flow details.ans summary { color: var(--accent); cursor: pointer; font-family: Roboto, Arial, sans-serif; }

/* wide tables become one card per row on phones */
@media (max-width: 560px) {
  .flow .tbl.cards table, .flow .tbl.cards tbody, .flow .tbl.cards tr, .flow .tbl.cards td { display: block; width: auto; }
  .flow .tbl.cards tr:first-child { display: none; }
  .flow .tbl.cards tr { border: 1px solid var(--line); border-radius: 8px; margin: .5em 0; padding: .3em .5em; }
  .flow .tbl.cards td { border: 0; padding: .15em 0; }
  .flow .tbl.cards td::before { content: attr(data-l); display: block; font: 600 .75em/1.3 Roboto, Arial, sans-serif; color: var(--muted); }
  .flow .tbl.cards td:first-child { font-weight: 600; }
}
.flow figure.vec svg { max-width: 100%; height: auto; display: inline-block; background: #fff; border-radius: 4px; cursor: zoom-in; }
[data-theme="dark"] .flow figure.vec svg, [data-theme="contrast"] .flow figure.vec svg { filter: brightness(.9); }
.flow .rt { border-top: 1px solid currentColor; padding-top: 1px; margin-left: 1px; }
.flow .it { display: inline-block; max-width: 100%; margin-right: .9em; text-indent: 0; }
</style>
</head>

зге жеткен ата салтын, мурасын,","Ыйык сактап, урпактарга берели.","","Кайырма:"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"1\">1<\/span>А. Е. СУПРУН, В. Д. СКИРДОВ, Т.К. АКМАТОВ"},{"t":"h2","h":"РУССКИЙ ЯЗЫК"},{"t":"h3","h":"ГРАММАТИКА РУССКОГО ЯЗЫКА УЧЕБНИК ДЛЯ 8 – 9 КЛАССОВ КЫРГЫЗСКОЙ ШКОЛЫ"},{"t":"v","l":["Утверждено Министерством образования","и науки Кыргызской Республики","","Издание шестое,","исправленное и дополненное"]},{"t":"h3","h":"ОЩ МАМЛЕКЕТТИК УНИВЕРСИТЕТИ КИТЕПКАНА"},{"t":"p","h":"Бишкек «Инсанат» – 2012"},{"t":"v","l":["<span class=\"pg\" data-n=\"2\">2<\/span>ББК 81.2Р я 721","","Супрун А. Е. и др.","Русский язык. Грамматика русского языка:","Учебник для 8-9 кл. кырг. шк./А.Е. Супрун, В.Д. Скирдов,","Т.К. Акматов – Б.: Инсанат, 2012.—280с."]},{"t":"p","h":"Данный учебник представляет собой исправленный, дополненный вариант шестого издания. Материалы учебника направлены на формирование практических навыков в овладении русским языком учащимися 8-9 классов кыргызской школы."},{"t":"p","h":"Материал по каждому правилу сопровождается сопутствующим русско-кыргызским словариком."},{"t":"h3","h":"ББК 81.2Р я 721"},{"t":"p","h":"ям 5"},{"t":"p","h":"‚ ©Супрун А.Е., Скирдов В. Д., Акматов Т.К., 2012"},{"t":"v","l":["© Министерство образования","и науки КР, 2012"]},{"t":"p","h":"© Издательско-полиграфический центр «Инсанат», 2012"}],"sub":[{"title":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК ГИМНИ","b":1},{"title":"А. Е. СУПРУН, В. Д. СКИРДОВ, Т.К. АКМАТОВ","b":3},{"title":"ОЩ МАМЛЕКЕТТИК УНИВЕРСИТЕТИ КИТЕПКАНА","b":7},{"title":"ББК 81.2Р я 721","b":12}],"pages":[0,2]},{"title":"ОБЩИЕ СВЕДЕНИЯ О ПРЕДЛОЖЕНИИ. (Суйлем женунде жалпы маалымат.)","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"3\">3<\/span>ВОСЬМОЙ КЛАСС"},{"t":"h3","h":"ОБЩИЕ СВЕДЕНИЯ О ПРЕДЛОЖЕНИИ. (Суйлем женунде жалпы маалымат.)"},{"t":"h3","h":"§ 1. ПРЕДЛОЖЕНИЕ."},{"t":"p","h":"(Суйлем.)"},{"t":"h3","h":"ПОВЕСТВОВАТЕЛЬНОЕ ПРЕДЛОЖЕНИЕ. (Жаий суйлем.)"},{"t":"p","h":"Наша речь (и по-русски, и по-кыргызски) состоит из предложений."},{"t":"p","h":"Как и в кыргызском языке, в русском языке предложением называется слово или сочетание слов, выражающее законченную мысль."},{"t":"p","h":"Например: Морозит. Мороз все крепчает."},{"t":"p","h":"Предложение может состоять из одного, двух или более слов. Законченность предложения выражается перерывом в речи, а на письме обозначается знаками препинания. Каждое отдельное предложение на письме начинается с большой буквы."},{"t":"p","h":"В русском языке предложения бывают повествовательными, вопросительными, побудительными и восклицательными."},{"t":"p","h":"Повествовательным называется предложение, в котором повествуется (сообщается) о чём-либо."},{"t":"p","h":"Например: Мы пришли в школу. Началась учёба. При чтении повествовательного предложения голос вначале повышается (Л), затем делается небольшая пауза (|), а в конце повествовательного предложения голос понижается (\\,)."},{"t":"p","h":"я Например: Над вершинами гор / поднимается яркое солнце."},{"t":"p","h":"На письме в конце повествовательного предложения ставится точка."},{"t":"v","l":["<span class=\"pg\" data-n=\"4\">4<\/span>Вопросы для повторения:","= ‚ Из чего состоит наша речь?","‚ Что называется предложением?","Из скольких слов может состоять предложение?",". Какое предложение называется повествовательным?",". Как произносится повествовательное предложение?"]},{"t":"p","h":"Какие знаки препинёния ставятся в повествовательного предложения?"},{"t":"p","h":"Упражнение 1. Перепишите предложения. Скажите, из скольких слов состойт каждое предложение."},{"t":"p","h":"1. Осень. Наступило время учёбы. Школьники с волнением вошли в свой классы. Начался урок естествознания. Учитель излагает новую тему и показывает интересные опыты."},{"t":"p","h":"2. Вечер. Нежаркое солнце скрылось за горизонтом. Тишина. Грустно шелестят листья тополей. Высоко над равниной слышны журавлиные крики."},{"t":"v","l":["Словарь:","школьник – окуучу","волнение – толкундоо","естествознание табият таануу","излагать – баяндоо","опыт – тажрыйба","грустно – кенулсуз","равнина туздук"]},{"t":"p","h":"Упражнение 2. Перепишите. Разделите текст на предложения. Ставьте в конце предложения точку."},{"t":"h3","h":"ПОЕЗДКА В ГОРОД."},{"t":"p","h":"Рано утром отец разбудил Султанмурата через секунду Султанмурат был уже на ногах во дворе пофыркивали запряжённые в бричку лошади солнце ещё пряталось за вершинами гор дул свежий ветер на окраине аила спросонья лаяли собаки сытые лошади везли бричку ровно и легко отец передал вожжи сыну Султанмурат энергично дёрнул вожжами лошади поскакали хорошо и радостно было на душе у мальчика Ч. Айтматов. Словарь:"},{"t":"p","h":"фыркать – бышкыруу спросонья – уйкусурап"},{"t":"p","h":"<span class=\"pg\" data-n=\"5\">5<\/span>Упражнение 3. Научитесь правильно и выразительно читать повествовательные предложения. Помните, что при чтении такого предложения голос вначале повышается, затём делается небольшая пауза, а в конце предложения голос понижается."},{"t":"h3","h":"МОЯ РЕСПУБЛИКА."},{"t":"p","h":"Высоко в небо / поднялись трубы горно-металлургического комбината. Шумят под тёплым ветром орехоплодные леса Арсланбоба. Тихо плещут волны / голубого Иссык-Куля. Стада / проснулись на пастбищах Сусамыра. В Чуйской долине / механизаторы обрабатывают плантации сахарной свёклы. Все эти края / – моя родная республика. На этой земле / родился я. На этой земле / родились мой деды и прадеды. Рядом со мной на этой земле / живёт много разных народов. Все они / живут дружной, единой, интернациональной семьёй. Они честно трудятся / в городах и сёлах."},{"t":"p","h":"Каждый из нас / должен беречь и любить нашу Кыргызскую Республику."},{"t":"p","h":"К. Джунушев. Словарь:"},{"t":"p","h":"прадед – чон атасынын атасы (баба)"}],"sub":[{"title":"ПОЕЗДКА В ГОРОД.","b":21},{"title":"МОЯ РЕСПУБЛИКА.","b":25}],"section":"ВОСЬМОЙ КЛАСС","pages":[3,5]},{"title":"§ 2. ВОПРОСИТЕЛЬНОЕ ПРЕДЛОЖЕНИЕ.","blocks":[{"t":"h3","h":"§ 2. ВОПРОСИТЕЛЬНОЕ ПРЕДЛОЖЕНИЕ."},{"t":"p","h":"(Суроолуу суйлем.) Вопросительным называется предложение, в котором заключается вопрос. Например: Кто сегодня пришёл в класс? Почему нет Асана?"},{"t":"p","h":"В вопросительных предложениях употребляются специальные вопросительные слова – местоимения и наречия кто? что? куда? зачем? почему? когда? и другие. В отличие от кыргызского языка они ставятся обычно в начале предложения. Например: Куда ты идёшь? Что лежит на столе? (Столдун устунде эмне жатат?"},{"t":"p","h":"Иногда после слова, в котором содержится вопрос, ставится вопросительная частица ли. Она напоминает кыргызский аффикс бы в предложении Сен шаарга бардынбы? <span class=\"pg\" data-n=\"6\">6<\/span>Например: Будешь ли ты в городе? Не пойдёшь ли ты в кино?"},{"t":"p","h":"Иногда вопрос выражается изменением привычного порядка слов: сказуемое ставится в начале предложения. Сравните:"},{"t":"v","l":["Повествовательное","предложение.","Вы будете выпускать","стенгазету.","Вопросительное","предложение.","Будете ли вы выпускать","стенгазету?"]},{"t":"p","h":"В вопросительном предложении повышается голос на том слове, в котбром содержится вопрос."},{"t":"p","h":"На письмб в концб вопросительного предложения ставится вопросительный знак (суроо белгиси). Наприм ёр: Сколько в классе отличников? Кто они?"},{"t":"v","l":["Вопросы для повторения:","1. Какое предложение называется вопросительным?","2. Назовите несколько вопросительных слов."]},{"t":"p","h":"3. Где ставятся в русском языке вопросительные слова?"},{"t":"p","h":"4. Где ставится вопросительная частица ли?"},{"t":"p","h":"5. Какой член предложения иногда ставится в начале вопросительного предложения?"},{"t":"p","h":"6. Какой знак препинания ставится в конце вопросительного предложения?"},{"t":"p","h":"Упражнение 4. В следующих предложениях поставьте вместо точек нужные вопросительные слова (сколько? что? куда? зачем? почему? когда? какое?)"},{"t":"p","h":"1. ... лет твоему другу (твоей подруге)?. 2. ... ты побывал на озере Сары-Челек? 3. ... написано на доске? 4. ...твой отец вернётся из командировки? 5. ... впадает река Джергалан? 6. ... сестра, уходя на работу, взяла зонтик? Т. ... Акылб6к собирает марки? 8. ... школьное имущество перевезли со склада?"},{"t":"v","l":["Словарь:","имущество – мулк"]},{"t":"p","h":"Упражнение 5. Поставьте, где нужно, вместо точек вопросительную частицу ли."},{"t":"p","h":"<span class=\"pg\" data-n=\"7\">7<\/span>Образец: Хочешь ли ты научиться играть в шахматы?"},{"t":"p","h":"1. Хочешь ... ты .. научиться играть в шахматы?"},{"t":"p","h":"2. Состоялся ... культпоход .. в кинотеатр «Россия»?"},{"t":"p","h":"3. Занимается ... Гапар ... в школьном кружке живописи?"},{"t":"p","h":"4. Присвоили .. ремонтной бригаде ... звание передовой бригады? 5. Покорят каракольские альпинисты ... пик Побвды? 6. Любите ... вы .„. смотреть по телевизору соревнования по бегу на коньках?"},{"t":"v","l":["Словарь:","состояться – болуу","кружок живописи – живопись","ийрими","присвоить – наам беруу","покорить – багындыруу"]},{"t":"p","h":"Упражнение 6. Переставьте в предложениях слова так, чтобы получились вопросительные предложения. Там, где надо, вставьте частицу ли."},{"t":"p","h":"Образец: Записались ли Семетей и Дима в радиокружок?"},{"t":"p","h":"1. Семетей и Дима записались в радиокружок. 2. Кулипа задумалась над своим неуверенным ответом по физике."},{"t":"p","h":"3. Редактор сократил заметку в стенгазету. 4. Старый друг Чоро убедил Танабая работать табунщиком. 5. По радио рассказали о трудовых буднях Аламединского района."},{"t":"p","h":"6. Состоялась районная спартакиада школьников."},{"t":"p","h":"Словарь:"},{"t":"p","h":"задуматься – ойлонуу убедить – макулдатуу, ишендиру\\ неуверенный – ишенбегендик сообщить – кабарлоо, билдиру\\ менен сократить кыскартуу"},{"t":"p","h":"Упражнение 7. Переведите на русский язык вопросительные местоимения ким? эмне? канча? кандай? и вопросительные наречия качан? кайда? кайдан? и при помощи их составьте 4 вопросительных предложения."},{"t":"p","h":"Образец: Кайда – где? Где находится библиотека?"}],"sub":[],"section":"ВОСЬМОЙ КЛАСС","pages":[6,7]},{"title":"§ 3. ПОБУДИТЕЛЬНОЕ ПРЕДЛОЖЕНИЕ.","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"8\">8<\/span>§ 3. ПОБУДИТЕЛЬНОЕ ПРЕДЛОЖЕНИЕ."},{"t":"p","h":"Вепомните:"},{"t":"p","h":"1. Какое предложение называется повествовательным?"},{"t":"p","h":"2. Какое предложение называется вопросительным?"},{"t":"p","h":"3. Как различаются повествовательные предложения по интонации?"},{"t":"p","h":"Если повествовательные предложения служат для сообщения о чём-то, вопросительные – для вопроса о чём-то, то побудительные предложения побуждают собеседника совершить какое-нибудь действие. Это побуждение может иметь различный характер. Оно может содержать в себе приказание, просьбу, дружеский совет, запрещение, предупреждение и т.п. В зависимости от этого побудительные предложения произносятся с разной интонацией – от резкого повышения тона в категорических приказах до понижения тона в совётах и просьбах. Поэтому в конце побудительных предложений, произносимых спокойным тоном, ставится точка. Если же эти предложения будут произноситься с особой, побудительной интонацией, то вместо точки ставится восклицательный знак. Наприме р: Занимайся спортом, укрепляй своё здоровье, готовься стать достойным защитником своей Родины. Возьми ведро и полей цветы. Не переходи улицу при красном свете светофора!"},{"t":"p","h":"Побудительные предложения часто имеют в своём составе глагол-сказуемое в форме повелительного наклонения. С глаголом в форме инфинитива они выражают категорический приказ (Не шуметь! Не курить! Встать), а с частицами пусть, пускай, да – пожелёние. Например: Да сбудутся Ваши мечты и желания! Пусть будет Ваш жизненный путь светлым и прекрасным!"},{"t":"v","l":["Вопросы для повторвния:","1. Какие предложения называются побудительными?"]},{"t":"p","h":"ложения? 2. С какой интонацией произносятся побудительные пред-"},{"t":"p","h":"3. Чем выражается сказуемое в побудительных предложениях?"},{"t":"p","h":"4. Что выражают побудительные предложения с частицами пусть, пускай, да?"},{"t":"p","h":"<span class=\"pg\" data-n=\"9\">9<\/span>5. Какие знаки препинания ставятся в конце побудительных предложений?"},{"t":"p","h":"Упражнение 8. Составьте побудительные предложения по образцам, используя данные ниже слова."},{"t":"p","h":"Заниматься, физкультура и спорт. – Занимайтесь физкультурой и спортом!"},{"t":"p","h":"Т. 1. Заниматься, физкультура и спорт. 2. Подготовиться, контрольная работа. 3. Познакомиться, новая книга."},{"t":"p","h":"4. Собраться, вестибюль школы."},{"t":"p","h":"Образец: Встать, пораньше. – Пускай они встанут пораньше."},{"t":"p","h":"П. 1. Встать, пораньше. 2. Выйти, окраина села."},{"t":"p","h":"3. Взять, лопаты и грабли. 4. Посадить, фруктовые деревья."},{"t":"p","h":"5. Спеть, веселые звонкие песни."},{"t":"p","h":"Упражнение 9. С данными ниже формами глаголов составьте повествовательные и побудительные предложения."},{"t":"p","h":"Образец: Рассказал – расскажи. Ветеран Отечественной войны рассказал о разгроме немцев под Сталинградом. Расскажи о самом радостном событии в твоей жизни."},{"t":"p","h":"Рассказал – расскажи, объяснила – объясни, отремонтировали – отремонтируй, не опоздал – не опоздай, поливала – поливай, привыкла _ привыкай, трудиться – трудись, уважают – уважай, подготовились – подготовьтесь."},{"t":"v","l":["Словарь:","привыкнуть – кену\\ событие окуя"]},{"t":"p","h":"Упражнение 10. Переведите на русский язык. Определите, какие Это предложения. Поставьте знаки препинания."},{"t":"p","h":"1. Бугун мен жыйналышта суйледум. 2. Биздин класста 27 окуучу бар. 3. Класста жаныбарлар бурчу бар. 4. Балдар окуунун отличниги болгула. 5. Эртен экскурсияга барабыз. 6. Менин атам агроном. 7. Кечээ кун жаады."}],"sub":[],"section":"ВОСЬМОЙ КЛАСС","pages":[8,9]},{"title":"§ 4. ВОСКЛИЦАТЕЛЬНОЕ ПРЕДЛОЖЕНИЕ.","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"10\">10<\/span>§ 4. ВОСКЛИЦАТЕЛЬНОЕ ПРЕДЛОЖЕНИЕ."},{"t":"p","h":"(Илептуу суйлем.)"},{"t":"p","h":"Вепомните:"},{"t":"p","h":"1. Какие предложения называются повествовательными?"},{"t":"p","h":"2. Какие предложения называются вопросительными?"},{"t":"p","h":"3. Какие предложения называются побудительными?"},{"t":"p","h":"4. Какие знаки препинания ставятся в конце повествовательных, вопросительных и побудительных предложений?"},{"t":"p","h":"Восклицательными называются такие предложения, которые произносятся с сильным чувством, с восклицанием. Например: И вот пришёл долгожданный день – день нашей великой Победы! (К. Симонов). Слава ветеранам войны и труда!"},{"t":"p","h":"Чтобы подчеркнуть одобрение чего-то или восхищение чем-то, в восклицательных предложениях иногда употребляются слова какой, что, за, как, такой и некоторые другие. Это видно в речи Лисицы из басни И.А. Крылова «Ворона и Лисица», когда хитрая Лисица выражает своё «восхищение» красотой Вороны:"},{"t":"v","l":["Голубушка, как хороша!","Ну что за шейка, что за глазки!","Рассказывать, так, право, сказки!","Какие пбрышки, какой носок!"]},{"t":"p","h":"Многие восклицательные предложения произносятся с повышением голоса к концу предложения. На письме в конце восклицательного предложения ставится восклицательный знак. Ах, как я рад вас видеть! С каждым годом хорошеет наш чудесный город!"},{"t":"v","l":["Вопросы для повторения:","1. Какие вы знаете типы предложений?"]},{"t":"p","h":"2. Какие предложения называются восклицательными?"},{"t":"p","h":"3. Какие слова употребляются в составе восклицательных предложений?"},{"t":"p","h":"4. Как произносятся восклицательные предложения?"},{"t":"p","h":"5. Какой знак ставится в конце восклицательного предложения?"},{"t":"p","h":"<span class=\"pg\" data-n=\"11\">11<\/span>Упражнение 11. Прочитайте предложения как повествовательные, потом как вопросительные."},{"t":"p","h":"Мы совершим экскурсию в Бишкек. Нас встретят ученики школы-гимназии № 5. Они покажут нам интересные места. Сначала мы пойдем к памятнику Аалы Токомбаева. Затем по бульвару придём к вокзалу. Остановимся у статуи М.В.Фрунзе. Потом отправимся в Исторический музей. Вечером осмотрим здания драматического театра и высотной гостиницы."},{"t":"p","h":"Словарь:"},{"t":"p","h":"памятник – эстелик бульвар – бак-дарак тигилген кен кече, гулбак Упражнение 12. Прочитайте выразительно восклицательные предложения, усиливая голос к концу каждого предложения."},{"t":"p","h":"Чудесен в эту весеннюю пору яблоневый сад! (В. Солоухин). Как легко дышится в сосновом лесу! (М. Пришвин). Какой прекрасный вид! Какой простор могучий! (И. Бунин). Слава честному и самоотверженному труду! Никогда не погаснет в наших сердцах любовь к родной земле!"},{"t":"p","h":"Упражнение 13. Перепишите текст, определите типы предложений, поставьте в конце предложений нужные знаки препинания."},{"t":"h3","h":"НА ВЫСТАВКЕ ЦВЕТОВ."},{"t":"p","h":"На центральной площади стояли корзины с цветами Какой чудесный вид имела площадь Огромные розы алели на солнце Кто украсил площадь такими прекрасными цветами Это юннаты принесли сюда самые лучшие цветы Как гордо стоят в высоких вазах георгины Люди любуются также голубыми гладиолусами, розовыми тюльпанами, синими фиалками А вы видели на выставке золотые хризантемы Вот они поднимают вверх свои мохнатые головки Такой великолепный праздник цветов мы долго не могли забыть, По М. Федотовой."},{"t":"p","h":"великолепный – эн сонун"},{"t":"p","h":"<span class=\"pg\" data-n=\"12\">12<\/span>Упражнение 14. Спишите предложения. Поставьте в конце каждого предложения нужный знак препинания."},{"t":"p","h":"1. Что за чудвеный вид открывается с вершины 2. Какая страна пбрвой запустила искусственный спутник Земли 3. Пусть солнце сияет над мирной землёю Пусть дождик прольётся на наши поля 4. Ливень прекратился, но холодный туман поплыл над равниной 5. Несмотря на ненастье, бригада выполнила все обязательства по заготовке сена 6. Как хорошо дышится на берегу Иссык-Куля Словарь: ливень (сильный дождь) – нешер-"},{"t":"v","l":["леген жаан","прекратиться – басылуу","несмотря -— карабастан","ненастье – жаан-чачындуу","кун"]},{"t":"p","h":"Упражнение 15. Спишите. Распространите простые нераспространённые предложения за счет слов, данных в скобках. Поставьте слова в нужных грамматических формах."},{"t":"p","h":"Депутаты решили (Жогорку Кенеш, на, очередной, сессия, важный, вопросы, развитие, народное хозяйство) – Депутаты Жогорку Кенеша решили на очередной сессии важные вопросы развития народного хозяйства."},{"t":"p","h":"1. Депутаты решили (Жогорку Кенеш, на, очередной, сессия, важный, вопросы, развитие, народное хозяйство)."},{"t":"p","h":"2. Дзюдоисты начали тренироваться (Юный, в, новый, спортивный, зал, под, руководство, заслуженный мастер спорта). 3. Поэт прочитал (знаменитый, перед, собравшиеся, земляки, несколько, новые, стихотворения, о, природа, Кыргызстан). 4. Я встретил (недавно, на, улица, мой, старый, друг, детство). 5. Тюльпаны расцвели (первый, на, пригретые, жаркое солнце, горные склоны)."}],"sub":[{"title":"НА ВЫСТАВКЕ ЦВЕТОВ.","b":22}],"section":"ВОСЬМОЙ КЛАСС","pages":[10,12]},{"title":"§ 5. ЧЛЕНЫ ПРЕДЛОЖЕНИЯ. ПРОСТОЕ НЕРАСПРОСТРАНЁННОЕ И ПРОСТОЕ РАСПРОСТРАНЁННОЕ ПРЕДЛОЖЕНИЯ.","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"13\">13<\/span>§ 5. ЧЛЕНЫ ПРЕДЛОЖЕНИЯ. ПРОСТОЕ НЕРАСПРОСТРАНЁННОЕ И ПРОСТОЕ РАСПРОСТРАНЁННОЕ ПРЕДЛОЖЕНИЯ."},{"t":"p","h":"(Суйлемдун мучелеру. Женекей жалан суилем жана"},{"t":"p","h":"женекеой жайылма суилем.)"},{"t":"v","l":["Вспомните:","1. Что называется предложением?"]},{"t":"p","h":"2. Назовите главные и второстепенные члены предложения в кыргызском языке."},{"t":"p","h":"Слово, которое обозначает то, о чём говорится в предложении, называется подлежащим. Оно отвечает на вопросы кто? или что? Подлежащее в русском языке, как и в кыргызском, может обозначать человека, животное, предмет и т.п. Например: Ученик читает. Собака бегает. Я рисую. Стол стоит."},{"t":"p","h":"Сказуемым называется член предложения, в котором что-то сообщается о подлежащем. Сказуемое отвечает на вопросы что делает предмет? что с ним делается? кто он? и др. Например: Девочка танцует. Снег тает. Солнце греет. Пушкин – поэт."},{"t":"p","h":"Подлежащее и сказуемое являются главными членами предложения."},{"t":"p","h":"Предложение, которое состоит только из главных членов – подлежащего и сказуемого, называется простым нераспространённым."},{"t":"p","h":"В русском языке, в отличие от кыргызского, допускаются два способа постановки подлежащего и сказуемого:"},{"t":"p","h":"1. Подлежащее обычно стоит перед сказуемым. Например: Мальчик пишет письмо. Поезд двигается."},{"t":"p","h":"2. Сказуемое можно поставить перед подлежащим. Это делается, чтобы особенно выделить значение сказуемого. Так, например, в предложении Пишет мальчик письмо особенно подчёркивается действие – пишет."},{"t":"p","h":"Кроме главных членов предложения, подлежащего и сказуемого, в предложение могут входить и другие слова. Это второстепенные члены предложения."},{"t":"p","h":"Предложение, которое наряду с главными, включает и <span class=\"pg\" data-n=\"14\">14<\/span>второстепенные члены предложения, называется простым распространённым."},{"t":"p","h":"Например: Я пишу письмо."},{"t":"p","h":"Второстепенные члены предложения поясняют подлежащее, сказуемое, а также другие члены предложения."},{"t":"p","h":"В русском языке выделяют три типа второстепенных членов предложения: определение, дополнение и обстоятельство."},{"t":"p","h":"Определение обозначает признак предмета, оно поясняет имена существительные."},{"t":"p","h":"Например: Светит яркое солнце. В нашем саду поют птицы. Книга ученика лежит на столе."},{"t":"p","h":"Определение отвечает на вопросы какой? чей? который?"},{"t":"p","h":"Дополнение обозначает предмет, на который направлено действие, или предмет, при помощи которого оно происходит, который является результатом действия. Дополнение часто уточняет глагол."},{"t":"p","h":"Например: Бактыбек пишет диктант шариковой авторучкой. Айнагуль встретила подругу."},{"t":"p","h":"Дополнение отвечает на вопросы косвенных падежей (т.е. всех падежей, кроме именительного): кого? чего? кому? чему? кого? что? кем? чем? о ком? о чём?"},{"t":"p","h":"Обстоятельство указывает место, время, способ, причину, цель действия. Обычно оно относится к глаголу."},{"t":"p","h":"Например: Вчера я приехал в Бишкек. Поезд шёл быстро."},{"t":"p","h":"Обстоятельство отвечает на вопросы как? когда? где? почему? зачем? и др."},{"t":"v","l":["Вопросы для повторения:","1. Какие члены предложения являются главными?"]},{"t":"p","h":"2. Для чего ставят в русском языке сказуемое перед подлежащим?"},{"t":"p","h":"3. Какие слова называются второстепенными членами предложения?"},{"t":"p","h":"4. Чем отличается простое распространённое предложение от нераспространённого?"},{"t":"p","h":"Упражнение 16. Прочитайте предложения. Найдите в них слова, обозначающие такие предметы, о которых говорится в предложениях. <span class=\"pg\" data-n=\"15\">15<\/span>Как называются такие слова? Перепишите. Подлежащее подчеркните."},{"t":"p","h":"1. Гульсары смирно стоял у столба. 2. Его мучила жажда. 3. Невдалеке шумела река. 4. За рекой паслись табуны. 5. Около юрт горели костры. 6. Женщины готовили ужин. 7. Шаловливые мальчишки дразнили собак."},{"t":"p","h":"По Ч. Айтматову. Словарь:"},{"t":"p","h":"жажда – суусоо, чанкоо дразнить – ачууландыруу; тийишуу Упражнение 17. Спишите, подчеркните подлежащее одной чертой, сказуемое – двумя. Поставьте вопросы к подлежащим."},{"t":"p","h":"1. Улетели птицы. 2. Опустели поля. 3. Выпал снег."},{"t":"p","h":"4. Наступила зима. 5. Приближается весна. 6. Звенят ручьи."},{"t":"p","h":"7. Грохочет гром. 8. Зеленвет изгородь. 9. Шмель жужжит. Словарь:"},{"t":"p","h":"опустели поля – талаалар ээн калды – изгородь – тосмо, кашаа приближаться – жакындоо шмель – жапайы аары грохотать – куркурее"},{"t":"p","h":"Упражнение 18. Прочитайте. Найдите второстепенные члены предложения. Переписывая предложения, подчеркните определения волнистой чертой, дополнения – прямой чертой, а обстоятельства -— прерывистой чертой."},{"t":"h3","h":"АСКАР ПОМОГАЕТ ОТЦУ."},{"t":"p","h":"Отец Аскара взял в аренду большой участок земли. Он решил выращивать зерно, картофель и кукурузу. Но чтобы получить высокий урожай, нужно много трудиться. Поэтому отец встаёт на рассвете, берёт канистру с бензином и идёт к трактору. Вместе с отцом спешит в поле и Аскар. Он уже научился управлять трактором, ловко орудует слесарным инструментом. Пока Аскар пахал большое заброшенное поле, отец привёз на бричке несколько мешков семенного картофеля. Он обрадовался отличной работе своего сына. Вдвоём они быстро посадили картофель и стали готовить плантацию под раннюю капусту."},{"t":"p","h":"Из газет. = <span class=\"pg\" data-n=\"16\">16<\/span>канистра – небольшой бак для бензина, керосина"},{"t":"p","h":"Упражнение 19. Внимательно посмотрите на картинку, предложенную учителем. Пользуясь распространёнными предложениями, опишите, что изображено на ней. Подчеркните второстепённые члёны предложения в написанном тексте."},{"t":"p","h":"Упражнение 20. Вставьте вместо точек второстепенные члены предложения."},{"t":"p","h":"Позади дома, в ..., послышался шорох. Мелькнул ... зверёк. Это хорёк. Он любит ловить. Хорёк ... подкрадывается к своей жертве. Ноу ... лежит овчарка. Берегись, ... хищник!"},{"t":"p","h":"Слова для справок: жёлтый, куры, кустарник, конура, маленький, осторожно."},{"t":"p","h":"Словарь:"},{"t":"raw","h":"<h4 class=\"mk\">шорох – шыбыш хорёк – кузен хищник – жырткыч кустарник – бадал<\/h4>"},{"t":"v","l":["овчарка – кароолчу чон иттин","бир тукуму","конура – ит жатуучу жай","осторожно – тактык менен, абайлап"]},{"t":"p","h":"Упражнение 21. Простые нераспространённые предложения распространите приведёнными в конце упражнения второстепенными членами."},{"t":"p","h":"1: Артист исполнил. 2. Лермонтов написал. 3. Стрекоза пролетела. 4. Морозы наступили. 5. Отец работает. 6. Рабы восстали."},{"t":"p","h":"Слова для справок: много, поэмы и стихотворения; новая пёсня; беззаботно, весь, лето; под руководством, Спартак; мой, на, ферма, кузнец; лютый, в, январь."},{"t":"p","h":"Словарь:"},{"t":"raw","h":"<h4 class=\"mk\">раб – кул восстать – кеотерулуу<\/h4>"},{"t":"v","l":["беззаботно – камсыз, санаасыз","лютый мороз – катуу аяз","","Упражнение 22. Переведите на русский язык."]},{"t":"p","h":"<span class=\"pg\" data-n=\"17\">17<\/span>1. Менин атам эмгек акыны жакшы алат. 2. Койлор сууну кечип етушту. 3. Мектептин участкасын окуучулар жыгач коргон менен тосушту. 4. Токойдун ичин калын келеке басты."},{"t":"v","l":["Словарь:","эмгек акы – заработок кечип етуу – перебрели"]},{"t":"p","h":"Упражнение 23. Прочитайте вслух. Правильно читайте выделенные слова. Объясните значение выделенных слов. Какими членами предложения являются эти слова?"},{"t":"p","h":"1. Я сошёл с пятого этажа и зашёл в гости к товарищу."},{"t":"p","h":"2. Не смей ходить по оврагу: там много змей. 3. На моторной лодке, которая нас везла, не было весла. 4. Наступила зима, и Сима надела шубу. 5. Посади цветы позади дома."},{"t":"p","h":"Словарь:"},{"t":"p","h":"сойти – бир нерседен тушуу не сметь – баш тартуу, сактануу"}],"sub":[{"title":"АСКАР ПОМОГАЕТ ОТЦУ.","b":39}],"section":"ВОСЬМОЙ КЛАСС","pages":[13,17]},{"title":"§ 6. ЛОГИЧЕСКОЕ УДАРЕНИЕ.","blocks":[{"t":"h3","h":"§ 6. ЛОГИЧЕСКОЕ УДАРЕНИЕ."},{"t":"p","h":"(Логикалык басым.) Вспомните:"},{"t":"p","h":"1. На каком слове повышается голос в вопросительном предложении?"},{"t":"p","h":"2. Какие члены предложения вы знаете?"},{"t":"p","h":"Обычно в предложении одни из его членов произносятся более сильно, на них повышается голос, а другие произносятся спокойнее, пониженным голосом. Выделение одного из членов предложения повышением, усилением голоса, называется логическим ударением."},{"t":"p","h":"Логическое ударение используют для того, чтобы отметить важность одного или нескольких членов предложения. На письме, если это особо необходимо, слова, на которые падает логическое ударение, подчёркивают, а в печати выделяют такие слова жирным (тёмным) шрифтом или курсивом (то есть наклонным шрифтом)."},{"t":"p","h":"Вот как меняется смысл предложения при изменении логического ударения в нём. 1. Ты сегодня пойдёшь в школу. Это значит, что ты сегодня пойдё именнов ОШ МАМЛЕКЕТТИК УНИВЕРСИТЕТИ"},{"t":"h3","h":"КИТЕПКАМА"},{"t":"p","h":"<span class=\"pg\" data-n=\"18\">18<\/span>кино и не в зоопарк. В этом предложении логически выделено обстоятельство места. 2. Ты сегодня пойдёшь в школу. Это означает, что ты не останешься дома, а отправишься в школу, что именно пойдёшь, а не поедешь. В этом предложении логически выделено сказуемое. 3. Ты сегодня пойдёшь в школу. Это означает, что именно сегодня, а не завтра ты пойдёшь в школу. Логическое ударение падает на обстоятельство времени. 4. Ты сегодня пойдёшь в школу. Это означает, что именно ты, а не кто-то другой (например, твоя сестра), пойдёшь в школу. Логическое ударение в этом предложении падает на подлежащее."},{"t":"v","l":["Вопросы для повторения:","1. Что называется логическим ударением?","2. Для чего используют логическое ударение?"]},{"t":"p","h":"3. Как обозначается логическое ударение на письме и в печати? Упражнение 24. В следующих предложениях найдите члены предложения, на которые падает логическое ударение. Перепишите эти предложения и подчеркните слова, несущие на себе логическое ударение."},{"t":"p","h":"1. Мать купила сыну магнитофон, а не велосипед."},{"t":"p","h":"2. Портфбль был изготовлен из кожи, а не из дерматина."},{"t":"p","h":"3. Пушкин особенно любил осень, а не весну и лето. 4. На опушке лбса росли ягоды, а не грибы. 5. У телеги сломано переднее, а не заднее колесо."},{"t":"p","h":"Упражнение 25. Найдите такие члены предложения, на которые падает логическое ударение. Перепишите. Слова с логическим ударением подчеркните. Для определения слова, на которое падает логическое ударение, обращайте внимание на предыдущее и последующее предложения."},{"t":"p","h":"1. Школьники решили в зоопарк. Пришли на остановку, а троллейбус только что отошёл. Они стали ждать автобус. 2. Делегация ошских хлопкоробов ожидала. самолёт. Из-за ненастья самолёт не прилетел. Делегаты выехали в столицу поездом. 3. Уже поздно ходить в туристические походы. Наступила осень. Часто Е 4. Я вспомнил слова новой песни. Может, вспомню и мелодию."}],"sub":[{"title":"КИТЕПКАМА","b":7}],"section":"ВОСЬМОЙ КЛАСС","pages":[18,18]},{"title":"§ 7. ПАРОНИМЫ.","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"19\">19<\/span>§ 7. ПАРОНИМЫ."},{"t":"p","h":"Вспомните:"},{"t":"p","h":"1. Какие слова называются омонимами? Приведите примеры омонимов."},{"t":"p","h":"2. Назовите губные согласные русского языка. Приведите примеры слов с губными согласными."},{"t":"p","h":"3. Приведите пары слов с твёрдыми и мягкими согласными. В речи нередко встречаются похожие, хотя и не совсем одинаковые по звучанию слова, которые имеют различное значение. Такие слова при неправильном употреблении могут привести к недоразумениям: предложение, в котором будет употреблено такое слово, можно неправильно понять. Поэтому надо внимательно относиться к употреблению таких слов."},{"t":"p","h":"Слова, близкие по звучанию, но различающиеся по значению, называются паронимами. Шарик был во дворе."},{"t":"v","l":["Новый чемпион стоял на","Шарик выл во дворе.","Петя поранил ступню."]},{"t":"p","h":"верхней ступени пьедестала почёта."},{"t":"p","h":"Паронимы возникают в результате случайного сходства разных корней. Так возникли паронимы картон – толстая твёрдая бумага и кордон – граница; буран – снежная буря, метель и бурун – пенящаяся волна над мелью; бетон – строительный материал и бидон сосуд."},{"t":"p","h":"Другая часть паронимов возникает в результате разного грамматического оформления или использования разных суффиксов, приставок с теми же корнями. Так возникли русские паронимы невежа – человек, который ведёт себя невежливо и невежда – человек, который мало знает (старинное слово ведает означало знает); осуждать – признавать виновным кого-либо, выражать кому-либо неодобрение и обсуждать – разговаривать, толковать о чём-либо; жар – повышенная температура тела при болезни, горячие угли пламени и жара – высокая температура в помещении или на воздухе."},{"t":"p","h":"<span class=\"pg\" data-n=\"20\">20<\/span>Упражнение 26. Прочитайте пары предложений. Объясните различие в значении выделенных паронимов, используя словарик. Выпишите паронимы разных типов."},{"t":"p","h":"Образец: пыл – пыль, тол – толь и т.д."},{"t":"p","h":"1. Воинственный пыл фашистов замбтно угас после поражения под Москвой (И. Эренбург). 2. Густая пыль покрыла лица и солдат, вернувшихся из похода (Ю. Бондарев). 3. Партизаны положили под рельсы тол, чтобы взорвать вражеский эшелон (П. Вершигора). 4. Толь не пропускает воду. 5. Осада Брестской крепости продолжалась несколько месяцев (В. Смирнов). 6. Между Смоленском и Вязьмой танки противника ожидала засада (К. Симонов). Т. Далеко в степи маячили одинокие всадники (Н. Гоголь). 8. Справа послышались одиночные выстрелы."},{"t":"p","h":"Словарь: пыл – здесь: азарт, горячность"},{"t":"v","l":["тол – взрывчатое вещество","осада крепости – чепти курчоо","засада – буктурма"]},{"t":"p","h":"Упражнение 27. Спишите текст, выпишите паронимы. Объясните, как они возникли. Найдите в словаре их значение."},{"t":"p","h":"1. В кабинете управляющего банком стояла массивная"},{"t":"p","h":"(Л. Кассиль). 2. В августе в горах Киргизии начиндется массовая альпиниада. 3. Героический поступок Александра Матросова воодушевил советских бойцов (Ф. Самохин). 4. Легкомысленный проступок молодого чего осудила вся бригада. 5. Дерзать – это смело идти вперёд, не боясь никаких трудностей (Н. Островский). 6. Не смей дерзить старшим! 7. На прибрежном песке виднелся отчётливый след росомахи (А. Чаковский). 8. За отчётный период в школах района значительно улучшилась спортивномассовая работа."},{"t":"v","l":["Словарь:","","массивный – оор, чон","проступок – поступок,","дерзать – катуу умтулуу","воодушевить – шыктандыруу"]},{"t":"p","h":"нарушающий правила поведения дерзить – орой айтуу"},{"t":"p","h":"<span class=\"pg\" data-n=\"21\">21<\/span>Упражнёние 28. Спишите предложения. Раскрывая скобки, выбирайте подходящий по смыслу пароним."},{"t":"p","h":"Образе ц: Спортсмён победил в беге на длинную (инстанция – дистанция). – победил в беге на длинную дистанцию."},{"t":"p","h":"1. Спортсмен победил в беге на длинную (инстанция – дистанция). 2. Скоро состоится (дебют – дебет) молодого артиста. 3. Движение поездов проходило по строго установленному (графа – график). 4. Состоялась встреча с (почётный – почтбнный) членом общества охраны природы."},{"t":"p","h":"5. У хищных зверей, как правило, сильно развито (обоняние – обаяние). 6. По (доверенность – доверчивость) завхоз получил для школы лингафонное оборудование."},{"t":"v","l":["Словарь:","дебют – первое выступление","обаяние – жагым","обоняние – жыт алуу","доверчивость – ишенгичтик"]}],"sub":[],"section":"ВОСЬМОЙ КЛАСС","pages":[19,21]},{"title":"§ 8. САМОСТОЯТЕЛЬНЫЕ И СЛУЖЕБНЫЕ СЛОВА В ПРЕДЛОЖЕНИИ. СОЮЗЫ И ПРЕДЛОГИ.","blocks":[{"t":"h3","h":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)"},{"t":"h3","h":"§ 8. САМОСТОЯТЕЛЬНЫЕ И СЛУЖЕБНЫЕ СЛОВА В ПРЕДЛОЖЕНИИ. СОЮЗЫ И ПРЕДЛОГИ."},{"t":"p","h":"(Суйлемдегу негизги жана кызматчы сездер.)"},{"t":"p","h":"(Байламта жана предлог.)"},{"t":"v","l":["Вспомните:","1. Что называется предложением?","2. Какие члены предложения вы знаете?","3. Какие части речи вы знаете?"]},{"t":"p","h":"Возьмём предложение Выпускники Кыргызского университета добросовестно трудятся в школах и на предприятиях. В этом предложении смысл одних слов (выпускники, Кыргызского, университета, добросовестно, трудятся, школах, предприятиях) можно понять и <span class=\"pg\" data-n=\"22\">22<\/span>отдельно, без предложения. Слова выпускники университбета обозначают специалистов, которые окончили это высшее учебное заведение; слово Кыргызского определяет, какой республике принадлежит университет и т.д. Такие слова имеют самостоятельный смысл. Они называются самостоятельными словами."},{"t":"p","h":"Другие слова в нашем предложении (и, в) сами по себе не имеют значения. Они служат только для связи самостоятельных слов. Такие слова называются служебными."},{"t":"p","h":"Самостоятельными словами являются имена существительные, имена прилагательные, имена числительные, местоимения, глаголы, наречия. Все эти слова отвечают на вопросы кто? что? какой? что делает? сколько? как? и т.д. Они являются членами предложения."},{"t":"p","h":"Служебные слова – это союзы, предлоги и частицы. К ним нельзя задать вопрос. Служебные слова не являются членами предложения. Они служат только для связи членов предложения."},{"t":"p","h":"Союзом называется служебная часть речи, которая употребляется для соединения слов или предложений."},{"t":"p","h":"Например: Шакен и Чолпон получили пятёрки по естествознанию. Разговаривай на перемене, а не на уроке!"},{"t":"p","h":"Предлогом называется служебная часть речи, которая показывает отношение существительного (а также местоимения и числительного) к другим словам. Так, в предложении Книга лежит на столе предлог на показывает, где лежит книга, каково отношение существительного книга к существительному стол."},{"t":"p","h":"Сравните другие предложения с тёми же самостоятельными словами, но разными предлогами: Книга лежит в столе. Книга лежит на столе. Книга лежит около стола"},{"t":"p","h":"В этих предложениях при помощи предлогов в, на и около говорится о том, где именно лежит книга."},{"t":"v","l":["Вопросы для повторения:","1. Какие слова называются самостоятельными?"]},{"t":"p","h":"2. Какие части речи бывают самостоятельными словами?"},{"t":"p","h":"3. Для чего служат служебные слова?"},{"t":"p","h":"<span class=\"pg\" data-n=\"23\">23<\/span>4. Какая часть речи называется союзом?"},{"t":"p","h":"5. Какая часть речи называется предлогом?"},{"t":"p","h":"Упражнение 29. Перепишите. Союзы подчеркните одной чертой, предлоги – двумя."},{"t":"p","h":"После работы механизаторы и животноводы собрались в клубе. Из Бишкека приехали артисты оперного театра и филармонии. Они часто выступают перед своими земляками. Сегодня они дают концерт на центральной усадьбе, а завтра уедут в отдалённые бригады."},{"t":"p","h":"Уже нет в зале свободных мест, а люди всё идут и идут. Вот на сцену вышел Асек Джумабаев. Он остановился около микрофона. Зазвучали струны комуза. Концерт для тружеников села начался."},{"t":"v","l":["Словарь:","передовики труда – эмгектин","алдынкылары","усадьба – короо-жай","земляк – жердеш"]},{"t":"p","h":"Упражнение 30. Перепишите. Подчеркните члены предложения одной чертой, а служебные слова – двумя. Укажите, какими частями речи выражены члены предложения."},{"t":"h3","h":"БРАТЬЯ."},{"t":"p","h":"Андрей Кольцов и Маманов родились и выросли в одном селе. Они учились в одном классе, вместе служили в нашей Армии. После демобилизации они стали работать в родном селе механизаторами. Однажды друзья косили пшеницу. Было очень жарко. От искры, вылетевшей из выхлопной трубы, загорелась пшеница. Друзья остановили комбайн и начали тушить пожар. Два часа они боролись с огнём. Поле было спасено. Но Ниязбек получил тяжёлые ожоги. Нужно было срочно сделать ему переливание крови. Многие земляки хотели отдать Ниязбеку свою кровь. Но первым это сделал Андрей. Ниязбек выздоровел. Теперь люди называют Андрея и Ниязбека братьями."},{"t":"p","h":"По В. Коханову. Словарь:"},{"t":"p","h":"ожог – куйук переливание крови – кан куюу <span class=\"pg\" data-n=\"24\">24<\/span>Упражнение 31. Переведите на русский язык. Проделайте такую же работу, как в предыдущем упражнении."},{"t":"p","h":"1. Сабактан кийин мен стадионго барамын. 2. Нарын суусунда Токтогул ГЭСи курулду. 3. Биздин класстын окуучулары кергезмеде болушту. 4. Биз экинчи класстын окуучуларын шефке алдык. 5. Мектептин айланасына бак-дарак отургуздук. 6. Биздин устубузден самолет учуп етту. Т. Талаада да, огороддо да иш кызуу журуп жатат."}],"sub":[{"title":"БРАТЬЯ.","b":24}],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[22,24]},{"title":"§ 9. СОЧЕТАНИЕ СЛОВ. СОЧИНИТЕЛЬНАЯ И ПОДЧИНИТЕЛЬНАЯ СВЯЗЬ.","blocks":[{"t":"h3","h":"§ 9. СОЧЕТАНИЕ СЛОВ. СОЧИНИТЕЛЬНАЯ И ПОДЧИНИТЕЛЬНАЯ СВЯЗЬ."},{"t":"v","l":["(Сездердун тутумдашышы. Тен жана багынынкы","баиланыш.)","","Вепомните:","1. Что называется предложением?","2. Какие слова бывают членами предложения?","3. Для чего служат служебные слова?","4. Какая часть речи называется союзом?","Сравните следующие две группы слов:","1. Учатся, и, девочки, в, вместе, мальчики, школе.","2. Мальчики и девочки учатся в школе вместе."]},{"t":"p","h":"В первой группе слова не связаны друг с другом. Они не составляют никакого целого, как куча кирпичей."},{"t":"p","h":"Во второй группе слова составляют предложение. Они связаны друг с другом, расположены по определённым правилам, как кирпичи в построенной стене."},{"t":"img","src":"data:image/webp;base64,UklGRjo9AABXRUJQVlA4IC49AACwPAGdASqAAjMBPrVUo0wnJKOoKJK7UQAWiWdu4QMIh0cafR3PGncA8W43u6Km/fVX+P9LHxf9p/zf928g/xj6T/L/3b/Kf9v/H+7Nof7VNSb5Z+HP5/+Q9kn81/5P9P4z/k37v/3v8R7Av4t/MP87/c/yc+Kf7rtzd4/5foHe5H3nwbNeaXny6v8PqLf6///+qr/v+gv8l/43qb/2YxhXeJWPGMbrk5muyJuTMmuGRrvJvJ49sxLxTjfQZY5+FA5267Xuz9QlusBfYmVoC6HHkFBRHWm/APPtYapy1WC+mMhbEtIi6YagdkntaU82/o1M7jHdVQnBflKDQi2I1AvHc+6UKlv/uJmp/lBpPF4itDyrFwAENxlC55K10W0IneOsmZ88XoWn/b44uz6ZVtIHY3kxm7wiCFKw+xRu3K1/elQOo4xTbmQ3qxZQe/oL/jrPdvSRCuokO6rPGjOOw0ZdhLbcvh8PkKfQEohfjvm1C5UXukExgWhnqkAP3sVufncmTlPEkVAEGvI7/v2vv/wckTlI8e6G5YgNlw760yuUIbHpvAxFJCLJSElb+pqlYuTW2SRcQoIlJdGvGFXxk2Y/ynVoFRUcQjgUS5Zywk4UfW82N+eyMCE9nyZO7RsLUpezC0vEynTE2URL4aQbzphnZbcmGond27ZIXBmHGdoRysBNj4sWyDWELfeg0/phmo4rfTwrL41Z04dSukPHD2jD/uCmLQ0FK4P6Xppl8hpzFwsVMr2XKv0FVGIO7AfASJowm5JDLnvV8ksTaIe1yXNpoD194xVzCCVPvrngZJ7dcaFfjdGaq35k8ruN+lQdx4Lw5JCRk/Z083+k3k7xUSr5GtByHniystlFFECTB21ZfQX1JlGi6Bt+43q1QinbQasmiQ+E+AUI7XNwDpxIwSkgrX7XAFcZ9TTFV/GtGJGr5dCtQ38ZlREoYK1MF9ZPo4+c5i2Fp5vX5pgUKkhj24vfUk5Al04z2y9XNKAL6SfbUCFFq529XlT3ELkrQRN+81DyMOup/G5HlBii5OU1LBpFI/G2DZFzxoPA2ANj

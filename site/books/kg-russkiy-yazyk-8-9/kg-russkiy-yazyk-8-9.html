ал треск упавшего дерева (А. Пушкин). 5. Сначала Герасиму не понравилось новое житьеб. С детства он привык к сельской жизни (И. Тургенев). 6. Чайки стонут перед бурей. В песне и сильных духом всегда ты будешь живым примером, призывом гордым (М. Горький). 7. Утром Метёлицу вызвали на допрос (А. Фадеев)."},{"t":"p","h":"Словарь:"},{"t":"raw","h":"<h4 class=\"mk\">ликовать – радоваться стонать – онтоо<\/h4>"},{"t":"p","h":"сильный духом – кайраттуу, эрки кучтуу допрос – сурак"},{"t":"p","h":"Упражнение 176. Перепишите. Вместо точек вставьте пропущенные обстоятельства врёмени., выраженные наречиями и деепричастиями. Слова для справок даны внизу."},{"t":"p","h":"1. Высокие горы Ала-Тоо ... покрыты льдом и снегом."},{"t":"p","h":"2. ... семь раз отмерь, а потом один раз отрежь. 3. ... вся семья принялась за обед. 4. Во время сева отец ... уходит на работу, а возвращается ... 5. ... Оля никогда не отказывается от помощи друзей. 6. Многие хищники выходят на охоту ..."},{"t":"p","h":"7. .. домой, я вынул из почтового ящика ваше сердечное письмо."},{"t":"p","h":"Слова для справок: сначала, всегда, рано, поздно, поработав, теперь, ночью, возвратившись."},{"t":"p","h":"Словарь:"},{"t":"p","h":"приняться – киришуу, баштоо сердечный – журектен чыккан отказаться – баш тартуу"},{"t":"p","h":"Упражнение 177. Перепишите. Существительные, взятые в скобки, поставьте в нужном падеже."},{"t":"p","h":"1. После (буран) погода успокоилась (Ч. Айтматов)."},{"t":"p","h":"2. Храбрый Манас бился с врагами до (вечер). 3. Шахматист в (игра) не допустил ни одной ошибки. 4. По (ночи) на реке грохотали льды (В. Короленко). 5. С (детство) Пржевальский любил путешествовать. 6. В (суббота и воскресенье) рабочие и служащие отдыхают. 7. Перед (рассвет) к отаре подкрался <span class=\"pg\" data-n=\"115\">115<\/span>волк (Д. Чотуров). 8. В (полдень) Бектемир снова пошёл осматривать дорогу (Ч. Айтматов)."},{"t":"p","h":"Словарь:"},{"t":"p","h":"биться – согушуу подкрасться енуп келуу не допустить – кетирбее"},{"t":"p","h":"Упражнение 178. Допишите окончания существительных."},{"t":"p","h":"1. На севере в март... ещё лежит снег, а на юге идёт сев."},{"t":"p","h":"2. После тяжёлой болезн... соседка лишилась сна. 3. Фрукты и овощи были убраны до заморозк.... 4. Через недел... Асанбек признался в своей вине. 5. Спортивные соревнования продолжались с утр... до вечер.... 6. После отчёт... начались прения. 7. Перед праздник. мы украсили школу флагами и портретами. 8. В пятницу... наш класс будет проводить литературный вечер."},{"t":"v","l":["Словарь:","лишиться – ажыроо вина – айып, кунее","признаться – моюнга алуу"]},{"t":"p","h":"Упражнение 179. Какими членами предложения являются выделенные сочетания слов? Замените эти сочетания одним словом."},{"t":"p","h":"Образец: Каждый день мы получаем новый номер газеты. – Ежедневно мы получаем новый номер газеты."},{"t":"p","h":"1. Каждый день школьники проводят свой досуг во Дворце молодёжи. 2. Каждый год наша школа устраивает побздки на Иссык-Куль. 3. Каждый месяц наш класс проводит санитарный день. 4. Каждую минуту железнодорожники следят за движением поездов. 5. Каждую неделю в воскресенье У памятника Маяковскому молодые поэты читают стихи."},{"t":"p","h":"Словарь:"},{"t":"p","h":"досуг – бош убакыт железнодорожник – темир жолчу"}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[113,115]},{"title":"§ 32. ОБСТОЯТЕЛЬСТВА ОБРАЗА ДЕЙСТВИЯ.","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"116\">116<\/span>§ 32. ОБСТОЯТЕЛЬСТВА ОБРАЗА ДЕЙСТВИЯ."},{"t":"v","l":["(Сын-сыпат бышыктооч.)","Вспомните:","1. Какие виды обстоятельств вы знаете?","2. Какими частями речи выражаются обстоятельства?"]},{"t":"p","h":"Обстоятельствами образа действия называются слова, которые показывают как, каким образом происходит действие. Обстоятельства образа действия выражаются чаще всего нарёечиями образа действия, такими, как: хорошо, весело, тихо, быстро, мастерски, героически, аккуратно, по- дружески, по- весеннему и др. Например: Бекиш аккуратно застелил свою постель."},{"t":"p","h":"Обстоятельства образа действия могут выражаться также деепричастиями. Например: Джумаш говорил не торопясь."},{"t":"p","h":"Обстоятельства образа действия могут выражаться также именами существительными с предлогами:"},{"t":"p","h":"а) в творительном падеже с предлогом с. Например: Подруги с интересом прочитали рассказ Айтматова. Тоня выслушала Павку с улыбкой;"},{"t":"p","h":"б)в родительном падеже с предлогом без. Например: Дождь лил без остановки два дня. Собрание продолжалось без перерыва."},{"t":"v","l":["Вопросы для повторения:","1. На что указывают обстоятельства образа действия?"]},{"t":"p","h":"2. Какими частями речи обычно выражены обстоятельства образа действия?"},{"t":"p","h":"3. Какие наречия часто используются как обстоятельства образа действия? (Приведите примеры.) 4. В каких падежах и с какими предлогами употребляются существительные в качестве обстоятельств образа действия?"},{"t":"p","h":"Упражнение 180. Перепишите. Подчеркните обстоятельства образа действия. Укажите, чем они выражены."},{"t":"p","h":"1. Дикие голуби беспокойно летали над ущельем. 2. Луна бледно освещала окрестности. 3. Богачи живут роскошно, а бедняки – в нищете. 4. Читай внимательно, рассказывай подробно. 5. Молодой матрос попытался проворно подняться на мачту. 6. После утомительного перехода через <span class=\"pg\" data-n=\"117\">117<\/span>пустыню верблюды жадно пили воду. Т. Старый Тарас пристально поглядел на сына."},{"t":"v","l":["Словарь:","бледно – кунурт","роскошно – абдан бай","попытаться – аракет кылуу","утомительный – чарчатуучу","пристально – унуле, кадала"]},{"t":"p","h":"Упражнение 181. Прочитайте по учебнику литературного чтения клятву Олега Кошевого (из романа А. А. Фадеева «Молодая гвардия»). Найдите в этом отрывке обстоятельства образа действия. Выпишите их, указывая, какими частями речи они выражены."},{"t":"p","h":"Упражнение 182. Перепишите, вставляя вместо точек подходящие по смыслу пропущенные обстоятельства образа действия, выраженные наречиями и деепричастиями."},{"t":"h3","h":"ПЛАТОЧЕК ОТ МЫРЗАГУЛЬ."},{"t":"p","h":"Из школы ... вышла группа девушек, однако Мырзагуль среди них не оказалось. Султанмурат ее огорчился и ... поехал на конный двор. Его охватила тревога: а вдруг она"},{"t":"p","h":"или с ней что- нибудь случилось."},{"t":"p","h":"Он оглянулся и ... увидел Мырзагуль, которая одна возвращалась из школы. Султанмурат слез с коня и, ждал её возле мостика через речку. Девушка подошла и, ..., протянула ему руку. Султанмурат сжал её маленькую узкую ладонь, и сердце его ... заколотилось от счастья."},{"t":"p","h":"– А я думал, что ты заболела, – сказал он взволнованным голосом."},{"t":"p","h":"Мырзагуль не ответила на эти слова, а вложила в его руку маленький платочек и ... сказала:"},{"t":"p","h":"– Вот, возьми. Это тебе. – ..., она быстро пошла дальше. Счастливый Султанмурат ... смотрел ей вслед и, едва сдерживая радость, вернулся на конный двор."},{"t":"p","h":"По Ч. Айтматову. Слова для справок: неожиданно, сильно, медленно, быстро, волнуясь, бешено, улыбнувшись, тихо, не задерживаясь."},{"t":"v","l":["Словарь:","бешено – здесь: сильно"]},{"t":"p","h":"<span class=\"pg\" data-n=\"118\">118<\/span>Упражнение 183. Перепишите. Обстоятельства образа действия, заключённые в скобки, поставьте в нужном падеже."},{"t":"p","h":"1. Успеха не будет, если делать работу без (желание)."},{"t":"p","h":"2. С (интерес) слушали школьники рассказ о подвиге героевпанфиловцев. 3. Наши отцы и братья шли в смертельный бой без (страх). 4. Дети с (радостный крик) бежали навстречу парашютисту. 5. К изменникам относятся без (жалость). 6. Докладчик говорил искренне, с (убеждение)."},{"t":"p","h":"7. Поезд спешил без (остановка) на юг. 8. Сестра посмотрела с (улыбка) на брата."},{"t":"v","l":["Словарь:","смертельный – еолум коркунучу"]}],"sub":[{"title":"ПЛАТОЧЕК ОТ МЫРЗАГУЛЬ.","b":15}],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[116,118]},{"title":"§ 33. ОБСТОЯТЕЛЬСТВА ПРИЧИНЫ.","blocks":[{"t":"h3","h":"§ 33. ОБСТОЯТЕЛЬСТВА ПРИЧИНЫ."},{"t":"v","l":["(Себеп бышыктооч.)","","Вспомните:","1. Что характеризуют обстоятельства?","2. Перечислите типы обстоятельств."]},{"t":"p","h":"Обстоятельства, которые указывают на причину действия, называются обстоятельствами причины. Например: Это он сказал сгоряча. Обстоятельства причины отвечают на вопросы отчего? почему?"},{"t":"p","h":"Обстоятельства причины могут быть выражены наречиями (поэтому, сгоряча и др.), деепричастиями (испугавшись, разгорячившись и др.). Например: Обидевшись, Мамбет ушёл. Поэтому его нет на вечере."},{"t":"p","h":"Обстоятельства причины выражаются также именами существительными с предлогами:"},{"t":"p","h":"а) родительным падежом с предлогами из, из-за, от. Например: Из осторожности партизаны пробирались тихо. На дворе было очень холодно из-за ветра. Айша засмеялась от радости;"},{"t":"p","h":"6) дательным падежом с предлогом по. Например: По болезни Мырзабек пропустил несколько уроков."},{"t":"p","h":"<span class=\"pg\" data-n=\"119\">119<\/span>Вопросы для повторения:"},{"t":"p","h":"1. Каковд значение обстоятельства причины?"},{"t":"p","h":"2. Какими частями речи выражаются обстоятельства причины?"},{"t":"p","h":"3. Какими падежами имён существительных (и с какими предлогами) выражаются обстоятельства причины?"},{"t":"p","h":"Упражнение 184. Перепишите. Подчеркните обстоятельства причины и укажите, чем они выражены."},{"t":"p","h":"1. От работы пила раскалилась добела (В. Маяковский)."},{"t":"p","h":"2. Не стоит ссориться из-за пустяков. 3. Задумавшись, Шукурбек нерешительно остановился у калитки. 4. У Никиты губы задрожали от злости. 5. Из интереса к природе у Райкана родилась большая любовь к науке. 6. По состоянию здоровья врачи запретили Светлане играть |: баскетбол. Т. По распоряжению директора школы все ученики прошли медицинский осмотр. 8. По неопытности этот добродушный человек не знал, что двлать. 9. Испугавшись выстрела, зверь метнулся в сторону."},{"t":"v","l":["Словарь:","пустяк – арзыбаган нерсе","нерешительно – чечкинсиз, бошон","распоряжение – буйрук","добродушный – ак кенул"]},{"t":"p","h":"Упражнение 185. Перепишите, вставляя вместо точек из слов для справок обстоятельства причины, выраженные наречиями и деепричастиями."},{"t":"p","h":"1. Испуганная сова ... налетела на дерево. Хон чуть не оскорбил своего друга. 3. .. дети долго не могли отогреться. 4. Ася оставила дома нужный учебник мы с трудом передвигали ноги. 6. ... самолёт вылетел на три часа позже."},{"t":"p","h":"Слова для справок: сослепу, сгоряча, замёрзнув, по рассвянности, от усталости, из-за ненастья."},{"t":"v","l":["Словарь:","","чуть – аз жерден","оскорбить – ыза кылуу, намысына","тийу\\у, кордоо","замёрзнуть – ушуп кетуу","рассеянность – кенебестик,","чачкындуулук"]},{"t":"p","h":"<span class=\"pg\" data-n=\"120\">120<\/span>Упражнение 186. Перепишите. Существительные, взятые в скобки, поставьте в нужном падеже."},{"t":"p","h":"1. Немец от (испуг) едва удержался на ногах (А. Фадеев)."},{"t":"p","h":"2. Участники молодёжного (ансамбль) дали концёрт в отдалённом аиле. 3. Из (гордость) Валерий отказался от помощи."},{"t":"p","h":"4. Федя поехал на комсомольскую стройку не по (распоряжение), а по (убеждение). 5. Из (жалость) к раненому бойцу Павел чуть не заплакал. 6. Из-за (боязнь) нарушить покой больного все ходили очень тихо."},{"t":"p","h":"Словарь:"},{"t":"p","h":"убеждение – ынангандык боязнь – коркунуч жалость – боору ооругандык"},{"t":"p","h":"Упражнение 187. Переведите с кыргызского языка на русский. Обстоятельства причины подчеркните."},{"t":"p","h":"1. Жакшы иштегендиги учун сыйлык алды. 2. Коркуп, кыштактан чыккан жокпуз. 3. Бакирдин эр журектуулугунен душман батына албады. 4. Абанын салкындыгынан чарчаганыбызды билген жокпуз. 5. Жолдун алыстыгынан кечигип келди. 6. Жаан жаагандыктан, топ ойнободук."}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[119,120]},{"title":"§ 34. ОБСТОЯТЕЛЬСТВА ЦЕЛИ.","blocks":[{"t":"h3","h":"§ 34. ОБСТОЯТЕЛЬСТВА ЦЕЛИ."},{"t":"v","l":["(Максат бышыктооч.)","","Повторить неопределённую форму глагола.","","Вспомните:","1. Какие есть второстепенные члены предложения?"]},{"t":"p","h":"2. Какие значения выражаются при помощи обстоятельств?"},{"t":"p","h":"3. Перечислите виды обстоятельств."},{"t":"p","h":"Обстоятельства цели указывают на цель действия. Обстоятельства цели отвечают на вопросы для чего? зачем? Они выражаются часто глаголом неопределённой формы. Например: Туристы встали рано и ушли купаться. Неопределённая форма глагола в роли обстоятельства цели <span class=\"pg\" data-n=\"121\">121<\/span>часто вводится (киргизилет) при помощи союза чтобы. Нап рим ёр: Мы пошли на речку, чтобы искупаться. На письме перед союзом чтобы ставится запятая. Кроме того, обстоятельства цели выражаются именами существительными с предлогами:"},{"t":"p","h":"а) родительным падежом с предлогом для. Напри – мер: Директор вызвал передовиков труда для вручения наград;"},{"t":"p","h":"6) винительным падежом с предлогом на. Наприм ёр: Отряд остановился на отдых."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"|. Какие обстоятельства называются обстоятельствами цели?"},{"t":"p","h":"2. На какие вопросы отвечают обстоятельства цели?"},{"t":"p","h":"3. Какими частями речи выражаются обстоятельства цели?"},{"t":"p","h":"4. Какими падежами существительных (ис какими предлогами) выражаются обстоятельства цели?"},{"t":"p","h":"5. При помощи какого союза вводится обстоятельство цели, выраженное неопределённой формой глагола? Какой знак при этом ставится на письме?"},{"t":"p","h":"Упражнение 188. Перепишите. Обстоятельства цели подчеркните. Укажите, чем они выражены."},{"t":"p","h":"1. Дети побежали к озеру купаться. 2. Строители привезли стальные трубы для газопровода. 3. После окончания полевых работ технику направляют |: мастерские на ремонт."},{"t":"p","h":"4. Андрей и Бекташ поступили в училище, чтобы стать механизаторами. 5. Агитатор пришёл познакомиться с нашей семьей. 6. Пожилая женщина пришла в учреждение за справкой. 7. Мою маму направили на курорт лечиться."},{"t":"p","h":"8. Акеш пришел к Айдару уговорить его записаться в кружок русского языка."},{"t":"p","h":"Упражнение 189. Перепишите, вставляя вместо точек подходящие по смыслу глаголы неопределённой формы с союзом чтобы или без него."},{"t":"p","h":"и Экспедиция отправилась в горы, .. лекарственные травы и растения. 2. Читай внимательно, ... содержание прочитанного. 3. Командир направил танки вправо, ... врага."},{"t":"p","h":"4. Семиклассники пошли на стадион, ... в футбол. 5. Бакытбек <span class=\"pg\" data-n=\"122\">122<\/span>отошёл от клетки, ... барса. 6. Доярки рано пришли на ферму, ... коров. 7. Придумай название, ... рассказ."},{"t":"p","h":"Слова для справок: собирать, рассказать, окружить, поиграть, не раздражать, доить, озаглавить."},{"t":"p","h":"Словарь:"},{"t":"raw","h":"<h4 class=\"mk\">направить – жиберуу окружить – курчоо<\/h4>"},{"t":"p","h":"раздражать (злить) – ачуулантуу озаглавить – ат коюу"},{"t":"p","h":"Упражнение 190. Какими членами предложения являются выделенные глаголы? Какие это формы глаголов? Чем отличается их произношение? Прочитайте предложения вслух, следя за произношением."},{"t":"p","h":"1. Шофёр хорошо правит автомашиной. Чтобы так править, надо много учиться. 2. Чолпон подошла к учителю поблагодарить его. Она поблагодарит учителя от имени всего класса. 3. Такие отметки не огорчат родителей. Чтобы не огорчать друга, Сейдакмат согласился пойти с ним на стадион. 4. Чтобы представить себе, как выглядит метро, у Чаргына не хватило воображения. Айша хорошо представляет себе, как скучно будет без друзей. 5. Такой поступок оскорбит Машу. Чтобы не оскорбить Машу, надо поступить иначе."},{"t":"p","h":"Словарь:"},{"t":"p","h":"править – мында: башкаруу, представить – мында: элестетуу"},{"t":"p","h":"айдоо огорчать – капа кылуу"},{"t":"p","h":"Упражнение 191. Перепишите, подчеркните второстепенные члены предложения. Определите, чем они выражены."},{"t":"h3","h":"МУЖЕСТВЕННЫЕ КОСМОНАВТЫ."},{"t":"p","h":"Большой космический корабль летел над Африкой. Через несколько минут с ним состыковался (соединился) транспортный корабль с топливом и почтой. Однако между деталями двух кораблей остался небольшой зазор. С Байконура по радио дали команду, чтобы космонавты вышли из корабля и устранили неисправность."},{"t":"p","h":"<span class=\"pg\" data-n=\"123\">123<\/span>Космонавты Романенко и Лазарев надели скафандры, открыли люк и вышли из корабля. Сжимая в руках гаечные ключи, они медленно поплыли к стыковочному узлу. Далеко внизу виднелась родная земля. Слева, как голубая лента, извивалась Волга, справа блестели ледяные пики Кавказа. А впереди, за Каспийским морем, уже ярко желтели туркменские пески."},{"t":"p","h":"Осторожно работая гаечными ключами, космонавты подтянули гайки, устранили неисправность. Теперь два космических аппарата были крепко соединены. Через некоторое время космонавты вернулись в свой корабль и, усталые, сняли скафандры."},{"t":"p","h":"Из газет."},{"t":"p","h":"Словарь;"},{"t":"p","h":"зазор – кендей неисправность – бузуктук"}],"sub":[{"title":"МУЖЕСТВЕННЫЕ КОСМОНАВТЫ.","b":30}],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[121,123]},{"title":"§ 35. БЕЗЛИЧНЫЕ ПРЕДЛОЖЕНИЯ.","blocks":[{"t":"h3","h":"§ 35. БЕЗЛИЧНЫЕ ПРЕДЛОЖЕНИЯ."},{"t":"v","l":["(Жаксыз суйлем.)","","Повторить $ 20.","","Вспомните:","1. Какие предложения называются односоставными?","2. Какой член предложения называется сказуемым?"]},{"t":"p","h":"Односоставное предложение, в котором имеется лишь сказуемое и нет и не может быть подлежащего, называется безличным. Например: Рассветает. На дворе холодно. Нельзя поставить вопрос: Кто или что рассветает? Нельзя спросить: Кто или что холодно? Подлежащих в этих предложениях нет и не может быть."},{"t":"p","h":"Сказуемое в безличном предложении выражается глаголом или наречием. Глагол употребляется в форме 3-го лица единственного числа. В качестве сказуемых безличных предложений часто употребляются глаголы, обозначающие состояние природы: темнеет, рассветает, морозит, вечереет, холодеет, светлеет, дует, пахнет, смеркается и др."},{"t":"p","h":"<span class=\"pg\" data-n=\"124\">124<\/span>Другая группа глаголов-сказуемых безличных предложений это слова, обозначающие состояние человека: не спится, знобит, хочется, нездоровится, чудится, снится, кажется. Встречаются и некоторые другие глаголы: хватает, следует (в значении нужно), недостаёт."},{"t":"p","h":"Значения наречий, служащих сказуемыми в безличных предложениях, похожи на указанные значения глаголов: холодно, жарко, стыдно, скучно, нельзя, можно, нужно, надо, необходимо, пора и др. Часто при таких наречиях употребляется неопределённая форма глагола: можно рисовать, необходимо знать, нельзя курить, стыдно сказать."},{"t":"p","h":"При сказуемом безличного предложения нередко употребляются обстоятельства места или времени. Например: На улице холодно. Вчера похолодало. В некоторых безличных предложениях употребляется дополнение в дательном падеже, которое указывает, на кого оказывает влияние действие. Мне холодно. Шарипе необходимо знать 0б этом."},{"t":"p","h":"Особый вид безличных предложений составляют безличные предложения с творительным падежом носителя действия. Так, личное предложение Молния убила жеребёнка можно преобразовать в безличное: Молнией убило жеребёнка. Подлежащее в этом предложении превратилось в дополнение в творительном падеже. Если первое предложение сообщает, что именно (молния) убило жеребёнка, то во втором, безличном, в центре нашего внимания находится сам факт, само событие, а не то, что было его причиной. Вопросы для повторения:"},{"t":"p","h":"1. Какие предложения называются безличными?"},{"t":"p","h":"2. Какие части речи бывают сказуемыми безличных предложений?"},{"t":"p","h":"3. Каково значение глаголов, выступающих как сказуемые безличных предложений?"},{"t":"p","h":"4. Перечислите несколько глаголов, которые бывают сказуемыми в безличных предложениях."},{"t":"p","h":"5. Перечислите несколько наречий, которые выступают как сказуемые в безличных предложениях."},{"t":"p","h":"6. Приведите пример безличного предложения с творительным падежом носителя действия."},{"t":"p","h":"<span class=\"pg\" data-n=\"125\">125<\/span>Упражнение 192. Найдите безличные предложения и подчеркните в них сказуемые."},{"t":"p","h":"1. К вечеру погода изменилась. Снегом занесло дорогу. А утром снова стало тепло (М. Пришвин). 2. Старый Тарас погрузился в глубокую думу (Н. Гоголь). 3. Бурей сломало в саду старую яблоню (А. Чехов). 4. В глазах у меня потемнело (М. Лермонтов). 5. Танабай обернулся назад и увидел бегущий к реке табун (Ч. Айтматов). 6. Сладко дремлется в кроватке (А. Блок). Т. Вечереет. В окно смотрит голубая луна (М. Пришвин). 8. От выстиранных гимнастеёрок пахло болотной тиной (Л. Соболев). 9. Нельзя далеко уплывать от берега при сильном ветре."},{"t":"v","l":["Словарь:","погрузиться в думу (глубоко задуматься) – ойго чемулуу","дума – ой, пикир","обернуться (здесь: оглянуться) —","артын кездей бурулуу","дремать – ургулее","тина – баткак, ылай"]},{"t":"p","h":"Упражнение 193. Перепишите. Найдите безличные предложения и подчеркните в них сказуемые."},{"t":"p","h":"1. Асан считал тракториста самым счастливым человеком на земле. Асану самому стать таким парнем, хотелось управлять трактором (К. Баялинов). 2. На улице было морозно и тихо (К. Симонов). 3. Зазнайство никогда не принесет пользы (И. Павлов). 4. Меня влекло на Волгу, к музыке трудовой жизни (М. Горький). 5. Вам нужно перевязать рану (К. Симонов). 6. Ниязбеку стало стыдно. Т. Старший брат любовно присматривал за младшими братишками и сестрёнками (М. Джангазиев). 8. После зарядки необходимо обтереться влажным полотенцем. 9. В коробке недоставало нескольких карандашей."},{"t":"p","h":"Упражнение 194. Составьте из данных групп слов безличные предложения."},{"t":"p","h":"1. Светлеть, на, восток. 2. Нельзя, нарушать, трудовой, дисциплина. 3. Нужно, систематически, готовиться, к, урок."},{"t":"p","h":"4. В, чулан, пахнуть, сырость. 5. Нездоровится, товарищ."},{"t":"p","h":"6. В. комната, стать, жарко. 7. Хотеть, сходить, в, кино."},{"t":"p","h":"<span class=\"pg\" data-n=\"126\">126<\/span>8. Он, знобит, от, холод. 9. Мы, пора, собираться, в, дорога."},{"t":"v","l":["Словарь:","сырость – ным"]},{"t":"p","h":"Упражнение 195. Впишите вместо точек из слов для справок подходящие по смыслу сказуемые безличных предложений."},{"t":"p","h":"1. Во время перемены в коридоре было ... 2. ... бросать друга в беде. 3. После сильного снегопада на улице стало ..."},{"t":"p","h":"4. ... высаживать рассаду в тёплую почву. 5. Каждое утро ... проветривать комнату. 6. После уроков ... погулять в саду. Т. „. оставаться в стороне от общественных дел."},{"t":"p","h":"Слова для справок: нельзя, стыдно, шумно, можно, пора, холодно, нужно."},{"t":"p","h":"Упражнение 196. Подберите по смыслу в следующие безличные предложения обстоятельства места и времени и вставьте их вместо точек."},{"t":"p","h":"Образец: Хорошо работается после утренней зарядки."},{"t":"p","h":"1. Хорошо работается ... 2. Особенно трудно чабанам и овцам бывает ... 3. ... темнеет быстрее, чем на равнине."},{"t":"p","h":"4. Мальчику ... почудилось море и крик чаек над волнами."},{"t":"p","h":"5. ... пахнет свежим сеном, спелой рожью и полынью. 6. ... было холодно, а ... с крыши капала вода. Т. ... было чисто и уютно."},{"t":"p","h":"Слова для справок: после утренней зарядки, зимой, в ущелье, однажды, в степи, ночью, днём, в комнате."},{"t":"p","h":"Слова рь;:"},{"t":"p","h":"почудиться – енденуп керунуу"},{"t":"p","h":"Упражнение 197. Дополните данные безличные предложения дополнениями в дательном падеже."},{"t":"p","h":"Образец: Сестре в лёгком пальтд стало холодно."},{"t":"p","h":"1. ... в лёгком пальто стало холодно. 2. ... уже несколько дней нездоровится. 3. ... наскучило сидеть дома. 4. ... следует <span class=\"pg\" data-n=\"127\">127<\/span>пересесть за другую парту. 5. ... было трудно говорить. необходимо принести справку о состоянии здоровья. Е не хотелось рисковать второй раз. 8. ... нельзя дважды ошибиться."},{"t":"p","h":"Словарь:"},{"t":"h3","h":"рисковать тобокел кылуу"},{"t":"p","h":"Упражнение 198. Преобразуйте следующие личные предложения в безличные и запишите их, подчёркивая сказуемые."},{"t":"p","h":"Образец: Ветром распахнуло окно."},{"t":"p","h":"1. Ветер распахнул окно. 2. Пуля ранила солдата."},{"t":"p","h":"3. Густой туман окутал город. 4. Судорога свела мою ногу."},{"t":"p","h":"5. Дождь размыл дорогу. 6. Жаркое солнце растопило последний снег. 7. Шум водопада заглушал голоса людей."},{"t":"p","h":"8. Я не хотёл расставаться с родным селом."}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[124,127]},{"title":"§ 36. НАЗЫВНЫЕ ПРЕДЛОЖЕНИЯ. НЕПОЛНЫЕ ПРЕДЛОЖЕНИЯ.","blocks":[{"t":"h3","h":"§ 36. НАЗЫВНЫЕ ПРЕДЛОЖЕНИЯ. НЕПОЛНЫЕ ПРЕДЛОЖЕНИЯ."},{"t":"v","l":["(Атама суйлемдер. Кемтик суйлемдер.)","","Вспомните:","1. Какие предложения называются односоставными?","2. Какой член предложения называется подлежащим?"]},{"t":"p","h":"Назывное предложение – это такое односоставное предложение, в котором есть только один главный член – подлежащее. Например: Тишина. Двенадцать часов. Мороз. Зима!"},{"t":"p","h":"Подлежащее назывного предложения часто бывает выражено именем существительным, реже – местоимением или именем числительным. Подлежащее может называть время, место, состояние природы. Иногда назывное предложение называет людей или предметы. Подлежащее назывного предложения может быть распространено определением. Например: Хорошая погода. Тёплый ветер. Солнечный день. Нередко подлежащее назывного <span class=\"pg\" data-n=\"128\">128<\/span>предложения, особенно обозначающего людей и предметы, стоит после указательной частицы вот. Например: Вот фабрика. Вот моя мама. Вот он."},{"t":"p","h":"Назывные предложения произносятся с особой интонацией. После назывных предложений делается более длинная пауза (остановка), чем после предложений других видов."},{"t":"p","h":"В русском языке часто встречаются неполные предложения, употребляемые в диалоге (в разговоре)."},{"t":"p","h":"В неполных предложениях могут быть пропущены какие-нибудь члены предложения, ясные из предыдущего разговора."},{"t":"v","l":["Например:","1. – Ты давно учишься в нашей школе? – Давно.","2. – Где ты учишься? В школе.","","Вопросы для повторения:","1. Какой член предложения называется подлежащим?","2. Какие предложения называются назывными?"]},{"t":"p","h":"3. Какими частями речи может быть выражено подлежащее назывных предложений?"},{"t":"p","h":"4. Когда употребляются неполные предложения?"},{"t":"p","h":"Упражнение 199. Прочитайте выразительно. Спишите, подчеркните назывные предложения."},{"t":"p","h":"1. Воскресенье. Вечер. Джамиля и Айша пришли в городской парк (К. Баялинов). 2. Поздняя осень. Грачи улетели (Н. Некрасов). 3. 1916 год. Октябрь. Ночь. Ветер и дождь (М. Шолохов). 4. Волки! Не один-два, а целая стая (Ч. Айтматов). 5. Зима. Метель. Беспощадный ветер. Дальняя дорога. Мы продолжаем путь. 6. Утро. Солнце. Шебет птиц. 7. Вот и Бишкек. Центр города. Памятник народным героям. Цветы. Тишина."},{"t":"v","l":["Словарь:","беспощадный – катаал, ырайымсыз"]},{"t":"p","h":"<span class=\"pg\" data-n=\"129\">129<\/span>Упражнение 200. Распространите назывные предложения определениями."},{"t":"p","h":"Образец: Густой лес. Глубокая тишина. Редкое щебетание птиц. Лёгкий ветерок. Утренняя прохлада."},{"t":"p","h":"1. Лес. Тишина. Шебетание птиц. Ветерок. Прохлада."},{"t":"p","h":"2. Река. Камыш. Кваканье лягушек."},{"t":"v","l":["3. Дорога. Пыль. Дом. Столбы.","4. Вокзал. Поезд. Пассажиры. Носильщики."]},{"t":"p","h":"Слова для справок: высбкий, широкая, густой, громкий, дальняя, телеграфные, одинокий, глубокая, торопливые ‚ пассажирский, городской, лёгкий, утренняя, сердитые, редкое, густая."},{"t":"v","l":["зарь:","торопливый – шашкалан"]},{"t":"p","h":"Упражнение 201. Составьте небольшие рассказы с назывными предложениями и предложениями обычного типа на темы: Лето. Осень. Зима. Весна."},{"t":"p","h":"Образец: Лето. Июнь. Жаркие дни. Хлеба поспевают. На полях идёт напряжённая работа. Неожиданная гроза."},{"t":"p","h":"напряжённый – мында; кыйын неожиданный – кутулбеген Упражнение 202. Вставьте в диалоге вместо точек неполные предложения."},{"t":"v","l":["– Как тебя зовут?","","– Сколько тебе лет?","","– В каком классе ты учишься?","","– Есть ли у тебя близкие друзья (подруги)?"]},{"t":"p","h":"Упражнение 203. Спишите. Найдите неполные предложения. Укажите, какие члены предложения в них есть."},{"t":"v","l":["<span class=\"pg\" data-n=\"130\">130<\/span>– Когда ты вернёшься домой?","– Завтра.","– Пойдёшь ли ты со мной в кино?","– Пойду.","– Что будем делать после кино?","– Сходим на каток.","– А коньки у тебя есть?","– Есть.","Словарь:","каток – коньки тебуу учун жасалган муз аянты"]}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[128,130]},{"title":"§ 37. ЛЕКСИКО-СЕМАНТИЧЕСКИЕ И ТЕМАТИЧЕСКИЕ ГРУППЫ СЛОВ.","blocks":[{"t":"h3","h":"§ 37. ЛЕКСИКО-СЕМАНТИЧЕСКИЕ И ТЕМАТИЧЕСКИЕ ГРУППЫ СЛОВ."},{"t":"p","h":"1. Какие слова называются синонимами? Приведите примеры синонимов."},{"t":"p","h":"2. Какие слова называются антонимами? Приведите примеры антонимов."},{"t":"p","h":"3. Какие слова называются паронимами? Приведите примеры паронимов."},{"t":"p","h":"Слова в словаре каждого языка объединяются в близкие, но не одинаковые по значению лексико-семантические группы. Таковы, например, названия дней недели, названия родственников, названия домашних животных, названия чисел, названия цветов (окрасок) и т.п."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>понедельник отец<\/td><td>корова<\/td><td>белый<\/td><\/tr><tr><td>вторник<\/td><td>мать<\/td><td>лошадь два<\/td><td>чёрный<\/td><\/tr><tr><td>среда<\/td><td>сын<\/td><td>овца<\/td><td>три<\/td><td>красный<\/td><\/tr><tr><td>четверг<\/td><td>дочь<\/td><td>свинья<\/td><td>четыре жёлтый<\/td><\/tr><tr><td>пятница<\/td><td>брат<\/td><td>козёл<\/td><td>ПЯТЬ<\/td><td>синий<\/td><\/tr><tr><td>суббота<\/td><td>сестра<\/td><td>верблюд шесть<\/td><td>зелёный<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"воскресенье дедушка собака семь фиолетовый"},{"t":"p","h":"Упражнение 204. Замените в следующих предложениях выделенные слова другими словами тех же лексико-семантических групп."},{"t":"p","h":"<span class=\"pg\" data-n=\"131\">131<\/span>Во вторник погода резко изменилась. Небо покрыли тяжёлые тучи. Начался сильный дождь. Отец поспешил на дальние пастбища. Там паслись овцы. Надо было укрыть их от непогоды. Вместе с отцом на помощь животным поспешили другие животноводы. Два дня продолжалось ненастье. В пятницу утром горячие лучи солнца снова залили долину."},{"t":"p","h":"Упражнение 205. Вместо точек дополните предложения словами, принадлежащими к тем же лексико-семантическим группам, что и предыдущие слова."},{"t":"p","h":"1. Брат и ... вместе записались в вокально- танцевальный ансамбль. 2. Пушкинские места лучше посетить весной ИЛИ 3. Кооператив «Победа» заблаговременно отремонтировал к посевной тракторы и.... 4. Очередная выставка картин художника состоится в Ташкенте или .... 5. Отец любил играть на скрипке, а дочь – на... 6. На школьной клумбе расцвели жёлтые и ... цветы."},{"t":"v","l":["Словарь:","заблаговременно – кунмурун"]},{"t":"p","h":"Лвексико-семантические группы могут быть замкнутыми, закрытыми, как, например, названия дней недели или времён года (зима, весна, лето, осень), или открытыми, как, например, названия профессий (токарь, слесарь, столяр, плотник, каменщик Синонимы и антонимы могут составлять лексико-семантические группы (например: горячий, тёплый, кислый, сладкий, горький, солёный, холодный, прохладный). Синонимические ряды и пары антонимов Это разновидности лексико-семантических групп (например: большой, огромный, громадный, колоссальный, высокий, низкий)."},{"t":"p","h":"Упражнение 206. Подберите подходящие по смыслу слова из состава лексико-семантической группы и запишите предложения."},{"t":"p","h":"1. бульон обжигал губы. 2. Приятно купаться в ... воде. 3. Вечер после жаркого дня был удивительно ...."},{"t":"p","h":"4.От .. солнца путников не спасали даже войлочные шляпы."},{"t":"p","h":"<span class=\"pg\" data-n=\"132\">132<\/span>Слова для справок: раскалённый, горячий, тёплый, прохладный."},{"t":"v","l":["Словарь:","войлочная шляпа – кийиз калпак"]},{"t":"p","h":"Упражнение 207. Замените выделенные слова синонимами, приведёнными в скобках. Как при этом изменился смысл предложения?"},{"t":"p","h":"1. Все люди нашего села связаны нерушимой (прочный, крепкий, братский) дружбой. 2. Нет ничего дороже на свете, чем милые (родной, ласковый, заботливый, добрый) руки матери. 3. В отношениях между людьми Горький прежде всего ценил честность (справедливость, доброжелательность, взаимоуважение). 4. Всю ночь над Чуйской долиной гремела (грохотать, громыхать, бушевать, рокотать) гроза."},{"t":"v","l":["Словар","","доброжелательность – жакшылык","каалоочулук","бушевать – алай-дулей тушуу","грохотать – куркурее","","рокотать – дуулдее"]},{"t":"p","h":"Слова, которые мы используем для того, чтобы построить рассказ на какую-то т6му, связанные с этой темой, образуют тематические группы слов. Например: тематическую группу слов составляют слова, необходимые для описания урока: учительница, ученик, парта, доска, класс, писать, мел, ручка, учебник, тетрадь, спрашивать, отвечать, правильно, отлично, пятёрка и другие. Другая тематическая группа слов – это слова, относящиеся к сельской жизни. Например: село, животновод, свиноферма, отара, чабан, косовица, пахота, доярка и т.д. Подобные группы слов можно выделить в рассказах о городском транспорте, о спортивных соревнованиях, о почте и об очень многом другом. Тематические группы слов переплетаются друг с другом, а иногда одно и то же слово может относиться к разным группам."},{"t":"p","h":"<span class=\"pg\" data-n=\"133\">133<\/span>Упражнение 208. Прочитайте, выпишите слова, принадлежащие к одной тематической группе."},{"t":"p","h":"Дирижер занял своё место, и люстры в зрительном зале погасли. Смолкли голоса зрителей в партере, амфитеатре, на балконах. Симфонический оркестр начал исполнять увертюру. Зазвучали скрипки, флейты, валторны. Поднялся занавес и открылась сцена. Сегодня в театре премьера балета «Лебединое озеро». В главной роли выступает солистка балета Айсулу Токомбаева. Вместе с партнёром она танцует адажио. Зрители аплодируют любимым артистам."},{"t":"v","l":["Словарь:","","увертюра – музыкальное","вступление к спектаклю","премьера – первое представление","солистка – ведущая артистка","адажио – музыкальное","произведение"]},{"t":"p","h":"Упражнение 209. К какой теме относятся указанные слова? Постройте рассказ на тему, которую подсказывают эти слова, используйте их в рассказе."},{"t":"p","h":"Слова для справок: стадион, украшать, флаги, спортивный, праздник, легкоатлеты, боксёры, гимнасты, мастер спорта, установить, мировой, рекорд, футболисты, победить, команда, соседний, район."}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[131,133]},{"title":"§ 38. ОДНОРОДНЫЕ ЧЛЕНЫ ПРЕДЛОЖЕНИЯ","blocks":[{"t":"h3","h":"§ 38. ОДНОРОДНЫЕ ЧЛЕНЫ ПРЕДЛОЖЕНИЯ"},{"t":"p","h":"(Бир енчей мучелуу суилемдер.)"},{"t":"p","h":"1. Какие члены предложения являются главными?"},{"t":"p","h":"2. Какие члены предложения являются второстепенными?"},{"t":"p","h":"3. Приведите пример сочинительной связи слов."},{"t":"p","h":"4. Что такое лексико-семантическая группа слов?"},{"t":"p","h":"В предложении при одном сказуемом может быть несколько подлежащих. Например: Асан, Кенеш и Табылды шли домой из школы. При одном подлежащем <span class=\"pg\" data-n=\"134\">134<\/span>может быть несколько сказуемых. Например: Дети играли, плясали и пели на утреннике. К одному и тому же имени существительному может быть несколько определений. Например: На лугу росли красные, синие и жёлтые цветы. В предложении может быть несколько дополнений к одному и тому же глаголу. Например: В зоопарке мы видели слона, тигра, льва и оленей. В предложении может быть и несколько обстоятельств одного типа к одному и тому же члену предложения. Например: Говорил Жухрай ярко, чётко, понятно, простым языком (Н. Островский)."},{"t":"p","h":"Одинаковые члены предложения, которые относятся к одному и тому же члену предложения, называются однородными. Как ив кыргызском языке, однородными |: русском языке бывают главные и второстепенные члены предложения. Однородные члены предложения отвечают на одинаковые вопросы."},{"t":"p","h":"Однородными членами предложения часто бывают слова, принадлежащие к одной лексико-семантической группе слов."},{"t":"p","h":"Однорбдные члены предложения связаны между собой сочинительной связью. Между ними иногда употребляется сочинительный союз и (он ставится часто перед последним членом)."},{"t":"p","h":"На письме однородные члены предложения, как и в кыргызском языкб, разделяются запятыми. Два однородных определения, соединённых союзом и, запятой на письме не разделяются. Когда союз повторяется, запятая обычно ставится. Например: Весёлый, жизнерадостный и смелый Асан рассказал друзьям о своих приключениях. Во время праздника над зданием горсовета зажглись и синие, и зелёные, и красные, и жёлтые лампочки."},{"t":"p","h":"В качестве союза между однородными членами употребляются и другие слова: но, или, то... то. Например: Луна светит, но не Принесите краски или карандаши. Ветер засевал поле то мелким дождём, то снежной крупой."},{"t":"v","l":["Словарь:","снежная крупа – шыбыргактап жааган кар"]},{"t":"p","h":"<span class=\"pg\" data-n=\"135\">135<\/span>Схёмы предложений с однородными членами предложения:"},{"t":"v","l":["1. Овцы, лошади и корбвы паслись в долине.","","лошади паслись","","и"]},{"t":"img","src":"data:image/webp;base64,UklGRrINAABXRUJQVlA4IKYNAABQaQCdASp6AsQAPrVUoUynLSc пространение."},{"t":"p","h":"4. Мяч падает, подпрыгивает и катится. 5. Свёкла, лук и помидоры росли на огороде. 6. Комбайн косит, молотит и веет. 7. Леса, рощи и парки окружали город (К. Федин)."},{"t":"p","h":"8. Птицы звенели, свистели, перекликались (М. Пришвин)."},{"t":"p","h":"9. Мухи, шмели и оводы жужжали в воздухе. 10. Я встал, умылся и позавтракал."},{"t":"p","h":"стонать – онтоо окружать – курчоо"},{"t":"p","h":"Упражнение 211. По данной схеме составьте четыре однотипных предложения с однородными сказуемыми. Поставьте знаки препинания."},{"t":"img","src":"data:image/webp;base64,UklGRnAXAABXRUJQVlA4IGQXAACQhACdASqAAsIAPrVYo02nJSemIzR8iPAWiWluUOY9IfkqB52VsxNNx2oz5cM44jgPooE6qE5mkwXjSXPuV/yfiH+M/Rf4nzIf6fcW/lf2w/X/3Hjd+LeoL+O/zb/UcGztPmF+4v2Lv6NTv2n/J+wH/OOG8oGeS7/k+c/85/3BWs951NsYtUATldZFVo4ke/sRcuehO3r9ioRN64ScYCRNejnAdY0vvhl5sYtYLVw4+uE8tNlIohqnODj+bFO+YPf1AKfSiQ8pnj9gae1dgnqpVy3hvXFQ48siPNatnXBm2s64p5BT6LXEjB9FbwB/Tj3sCeoNdEDen9DHqmXWuWips9jVts1REtiHSgso1kha9Q4Trig479K/uT2XoM/cjdweaioudw4Hm/ezIoty++thBWzEf1D3qTTYGhJX+BvFIm1w0qBrKyuFKhDuY9i8ppZbr1xnHUIRNkAlJw8Trd+hqQlU7e8IYPAbVjo5v+5aL6r6zng5en7XyqVfBFksJIo60GyK8TR2h00tCLZ3dEqctBe138Uzntgii9jA66uSpFG2WbymUErMXEL+v9LpY7wfM9ozVKwT5jx0ghrzvMcjX6SEw9mTychBlWzLaEJHKkaiHLguAimbmaAUdT9KUll2Dt73p2QZFnxyiscwLiipSYmB2I3WsvToPj0biTUlgyICBG07fTp15yTK8wJZy2Rg6qHjmXmm3PQpWfABxdXnPg94CmRbeyPQ+F1NfoAMdeDim59v7jXJnPtAdgNa0djYirjRzxbyXge7GkFDdsVJdR+OCrApJeetaFMpUdf4j8B4L+E3qUGx/lh66ZicwaENM/yYOY9mAJZOynsF1ZpZbLbsgqnanoUtzYAGGJ/oK1mbIbnAAeQxzDD77eVf/WZ550PXHckEPv1tjktfY0OnDbdVJm7aF6h028lojeHHzpWnwTsPOY5ZPifFxZQKW8i22buQKW8D4qMcFTJ+y2/rnWuoiaJH7zlxCYgrVqrm1/602xIjTXqyD+5txwyt/RI0qUa2wOgdp8gkZL8aB+3K4eYNRchbBbAncZT3zvm9od1/6NkdGxm3ZBWvKtLAagEggJRpzUCFkR5tOXsw8lIsJjUt4+Lg6Xg7gDf1m/gPjFcerytSY4PsDwCgxaEgyPYWoIAO4/WrSNkOVmmsKdIqYy4FFWG0sPg4i6P+MfIRRTYBgEGvO3IF2ywS/TKKDrWhA6KnqO/dN8dZNn3C7nMFnApR2q7e3Dn47MdTlFeTStTFpcLVlv9H84ON3USyoJhvf1pC/H9YmDojdIP8mTUb3kZyBUSkAT1VQL0b0DUo4FLdzUBC/+sWo3ZIbBJ37w7r8VXoyYDJJ/S8F/54bbeKoPXK3L4UOjoy т из сахарной свёклы ....Т. Дом нельзя построить без кирпича"},{"t":"p","h":"Слова для справок: нефть, автобус, товарищество, еда, кустарник, сахарный тростник, цемент."},{"t":"p","h":"различать – ажырата билу\\ нуждаться – муктаж болуу"},{"t":"p","h":"Упражнение 214. Перепишите. Подчеркните однородные обстоятельства одной чертой, а слова, к которым относятся обстоятельства, – двумя чертами. Напишите вид обстоятельства, Составьте схему первого предложения."},{"t":"p","h":"обст.вр. обст.вр."},{"t":"p","h":"Образец: Днём и ночью идут по стране поезда."},{"t":"p","h":"1. По долинам и по взгорьям шла дивизия вперёд."},{"t":"p","h":"2. Медленно и гордо несёт Волга свои воды ненасытному Каспию (М. Михайлов). 3. Справа и слева стонали раненые (К. Смирнов). 4. Из-за тумана и гололеда автобусы задерживались, в пути. 5. Мы наспех соорудили шалаш для отдыха и ночлега (К. Паустовский). 6. Родители уговорили <span class=\"pg\" data-n=\"138\">138<\/span>меня поступить в техникум или училище. 7. Дети побежали купаться и загорать. 8. Литературный вечер в школе прошёл весело и интересно."},{"t":"v","l":["Словарь:","взгорье – дебе","ненасытный (здесь: жадный) – тойбогон","гололёд – тайгак","наспех – шашып"]},{"t":"p","h":"Упражнение 215. Перепишите, вставляя подходящие союзы (и, то...то, или, но и др.)."},{"t":"p","h":"1. Внутри леса ... вокруг него располагались ракетные батареи (К. Симонов). 2. К больному по очереди ходили ... родители, ... друзья, ... одноклассники (Н. Носов). 3. Олег Кошевой был небольшого роста, ... сильным и крепким юношей (А. Фадеев). 4. Соревнования по теннису будут проводиться в пятницу ... в субботу. 5. За свою жизнь Лукашов переменил много профессий. Он работал ... плотником, ... каменщиком, .. пчеловодом (Г. Марков)."},{"t":"p","h":"6. День был пасмурный, .. тёплый. 7. Льстить другу ... товарищу – нехорошее дело (Л. Кассиль). 8. Любил Антон петь песни ... с радости, ..с печали (Д. Мамин- Сибиряк)."},{"t":"p","h":"9. Дождь сильный ветер не смогли остановить спортсменов."},{"t":"v","l":["Словарь:","внутри – ичинде","располагаться – жайлашуу","льстить – жасакерденуу,","кошомат кылуу"]},{"t":"p","h":"Упражнение 216. Перепишите, расставляя знаки препинания между однородными членами предложения."},{"t":"p","h":"1. Марья Ивановна смотрела то на меня то на берег реки то на дорогу (А. Пушкин). 2. Ияиты и весь народ не желает войны (Ш. Бейшеналиев). 3. Некоторые хозяева посадили перед калитками или вишню или сирень или георгины (А. Фадеев). 4. Костёр то разгорался то погасал (А. Гайдар). 5. Янко не боится ни моря ни ветра ни тумана (М. Лермонтов). 6. Угольная пыль покрыла и одежду и лица и руки шахтёров (А. Фадеев). Т. Хозяин то садился на диван то подходил к окну то выходил на улицу (Н. Гоголь)."},{"t":"p","h":"<span class=\"pg\" data-n=\"139\">139<\/span>8. Анфиса подносила или топор или пилу или молоток и горсть гвоздей (С. Бабаевский)."},{"t":"p","h":"Упражнение 217. Переведите на русский язык и запишите. Подчеркните однородные члены предложения."},{"t":"p","h":"1. Асан, Акмат жана Жамийла мектепке келишти. Алар окушту, жазышты жана сурет тартышты. 2. Талаада кызыл, жашыл жана кек гулдер есет. 3. Биздин жаш натуралисттер коён, тоок жана кегучкендерду остурушет. 4. Ырчылар малчыларга, кызылчачыларга жана механизаторлорго концерт беришти. 5. Мында да, тигинде да гулдер жайнап турат. 6. Кундуз да, тун ичинде да жаан жаады."},{"t":"p","h":"7. Класста, уйде, кечеде да биз улгулу\\ журебуз."}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[134,139]},{"title":"§ 39. СОГЛАСОВАНИЕ СКАЗУЕМОГО С ОДНОРОДНЫМИ ПОДЛЕЖАЩИМИ.","blocks":[{"t":"h3","h":"§ 39. СОГЛАСОВАНИЕ СКАЗУЕМОГО С ОДНОРОДНЫМИ ПОДЛЕЖАЩИМИ."},{"t":"p","h":"(Баяндоочтун бир ончей ээлери менен ээрчиши.)"},{"t":"p","h":"Повторить 5 24"},{"t":"p","h":"Вспомните:"},{"t":"p","h":"1. Какие члёны предложения называются подлежащими и сказуемыми?"},{"t":"p","h":"о. Какие члены предложения называются однородными?"},{"t":"p","h":"3. Как согласуется сказуемое с подлежащим?"},{"t":"p","h":"Когда в предложении имеются однородные подлежащие, сказуемое может стоять в единственном или во множественном числе."},{"t":"p","h":"Если однородные подлежащие стоят во множественном числе, то и сказуемое употребляется во множественном числе. Напримёр: В зале собрались студенты и преподаватели университета."},{"t":"p","h":"Если однородные подлежащие стоят в единственном числе, то сказуемое, стоящее перед ними, может быть и во множественном и в единственном числе (согласуясь в этом случае с первым подлежащим). Наприм ер: В коридор <span class=\"pg\" data-n=\"140\">140<\/span>не проникали ни свет, ни жара. По улице нёсся топот лошадей и грохот повозок."},{"t":"p","h":"Если однородные подлежащие обозначают людей, а также, если сказуемое стоит после однородных подлежащих, оно употребляется обычно во множественном числе. Например: Мать и отец подозвали сына к себе. Скромность и простота украшают человека."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"1. Когда при однородных подлежащих сказуемое употребляется во множественном или в единственном числе?"},{"t":"p","h":"2. Когда при однородных подлежащих сказуемое употребляется во множественном числе?"},{"t":"p","h":"Упражнение 218. Перепишите. Расставьте знаки препинания и подчеркните окончания сказуемых. Объясните, почему сказуемые употреблены в том или другом числе."},{"t":"p","h":"1. Старики и красавица сели в карету и поехали (А.П ушкин 2.В бабушкиной корзине лежит ржаной хлеб лук огурцы и творог |: тряпочке (М. Горький). 3. Отец и мать долго горевали о своей дочери (И. Бунин). 4. Ни трава ни кусты ни листья деревьев не шевелились (И. Тургенев)."},{"t":"p","h":"5. На стене висела винтовка и кривая казачья сабля (А. Куприн). 6. Молодость и природа ускорили моё выздоровление (А. Пушкин). Т. Кое-где вдоль дороги растёт осина или молодая берёза (К. Паустовский). 8. Рабочие и крестьяне царской России не раз бунтовали против богачей."},{"t":"p","h":"Словары: красавица – чурек"},{"t":"v","l":["горевать – кайгылуу","ускорить – тездетуу","выздоровление – айыгуу","бунтовать – козголон чыгаруу"]},{"t":"p","h":"Упражнение 219. Спишите, дописывая вместо точек окончания и суффиксы глаголов-сказуемых."},{"t":"p","h":"1. Отец и сын работал... на одном заводе. 2. Рабочие, служащие и студенты организованно вышл... на субботник."},{"t":"p","h":"3. Вслед за Николаем разошл... по домам Андрей Рыбин и другие участники кружка (М. Горький). 4. В классе был..."},{"t":"p","h":"<span class=\"pg\" data-n=\"141\">141<\/span>тишина и порядок. 5. На торжество пришл... передовики труда и отличники учёбы. 6. В квартире под лестницей поселил... старик со старухой (К. Паустовский). Т. Полеводы и механизаторы законч... обмолот хлебов. 8. Дед с внуком до вечера рыбач... на реке. 9. По улице проходил... отряд красноармейцев и группа партизан (Л. Соболев). Словарь:"},{"t":"p","h":"обмолот – эгинди бастыруу разойтись – тарап кетуу торжество – салтанат"},{"t":"p","h":"Упражнение 220. По данной схеме составьте четыре однотипных предложения. Между подлежащими, где нужно, поставьте запятую. Правильно употребляйте число сказуемого."},{"t":"img","src":"data:image/webp;base64,UklGRtghAABXRUJQVlA4IMwhAAAQ0ACdASqAAkIBPrVWpk2nJKQmIzPLIOAWiWlu1P/+5/lrLjo7/I/0FQk8yjx5/ra59RhDrB7yjefkjVdXU7xT/G/qv95+X3xZfn+k/6PwZ/sf4T/df4Dk9+Rfz57FP5b/PvOxkq8bKCvz3/D8V32x9H/H5/zPSu9Gn/c9PX5d6GA4+dvl7ieEmKThDT42dWnKrNd9yEZ7D2pLdzXOkc/ibAIaJpyW6vFya5wsj3/2b3i6s9jVK2iF4t7MYxe/O26I1A2F+2aWrv56IKFPQCQjjhlhquyMRL5855HHbqZMMH+kwk+YP2ldRw0vr5GLwfJF/PanYwul01uQl9e6DpbBQhRGZi6Hiwje/KffdOvjH5k9vXBnbe6YouTbnn2ibLFMNE2E0akOBf1yvt01ueTt8+Pp3WthcbtGwqL3pE0N7A5FyIqREjOtPK4G9Me8F/LHMkDawIwdW4xDdWK3UJ1II/6VBiUn6dMNPY0/Yp5N3VaP/Sda8J/EbpQcGxOvvQxnAnKTY/vfaRU5T5/yDy5QfYD7dc3VFz4pkLb7RGVFbkhCu4U7dALrLZl0egqmH4ngb5SOE5G6d19ieH0ja4PJjyLHUAK0KwA/KFLh5fR2cOPkGVIkSnw4FAywpyObs7jPkj169dEUwtpe+lpwL6zdka10S5o0zKoaszZ0kwGrnI3x200KAKy8kG5E1KjSv59P8h48aPWCH3annRCY4MSuEeQ/COPwF9Gzg9u4UaWyUA9zuNJ6ozbBD/uBid2xQPiC32J28E2urDV2quE цвело всё: и тюльпаны, и сирень, и вишня. Потемнело везде: на улице, в степи, за лесом."},{"t":"v","l":["Вопросы для повторения:","1. Для чего употребляются обобщающие слова?"]},{"t":"p","h":"2. Какие местоимения и наречия часто бывают обобщающими словами?"},{"t":"p","h":"3. Каким членом предложения является обобщающее слово?"},{"t":"p","h":"4. Какой знак препинания ставится перед однородными членами предложения, стоящими после обобщающих слов?"},{"t":"p","h":"Упражнение 221. Перепишгите и подчеркните обобщающие слова."},{"t":"p","h":"1. Туман покрыл всё: лес, дорогу, равнину (М. Пришвин). 2. На площади села собрались оставшиеся жители: женщины, старики, дети (М. Пришвин). 3. Старый Дюйшен, казалось, не отдыхал никогда: ни утром, ни днём, ни вечером (Ч. Айтматов). 4. Красноармейцы отобрали у бандитов много оружия: пистолетов, винтовок, пулемётов (А. Гайдар). 5. Котёнка искали всюду: в беседке, под сараем, за усадьбой (В. Панова). 6. В поле всё созрело: и пшеница, и ячмень, и овёс (С. Бабаевский). Т. В сумке охотника лежала дичь: заяц, две утки и перепёлка (Н. Вирта)."},{"t":"p","h":"Упражнение 222. Перепишите, расставляя двоеточия."},{"t":"p","h":"1. Мы видели везде счастливых людей в Москве, на Урале, в Сибири, в Центральной Азии (Н. Михайлов)."},{"t":"p","h":"2. Всети попала крупная рыба сазан, маринка, осман и форель. 3. Прошлым летом Акбар успел побывать везде на Иссык- Куле, Таласе, в заповеднике Сары- Челек."},{"t":"p","h":"4. В человеке должно быть всё прекрасно и лицо, и одежда, и душа, и мысли (А. Чехов). 5. На сессию Верховного Совета <span class=\"pg\" data-n=\"143\">143<\/span>приехали депутаты разных национальностей кыргызы, русские, украинцы, казахи. 6. Из молока готовят разные продукты питания масло, сыр, творог. 7. В школу привезли нужную мебель парты, столы и стулья. 8. В совхозе выращивают овощи капусту, помидоры, огурцы, редиску."},{"t":"p","h":"Упражнение 223. Перепишите, подбирая к однородным членам подходящие по смыслу обобщающие слова."},{"t":"p","h":"Образец: На клумбе росли цветы: розы, георгины, ромашки."},{"t":"p","h":"1. На клумбе росли розы, георгины, ромашки. 2. На главной улице города выросли многоэтажные ... театр, гостиница, Дворец культуры. 3. В магазине продавали различные .. мыло, одежду, обувь. 4. Наш народ трудится ...на заводах, ‘фабриках, стройках. 5. Заяц боится разных"},{"t":"p","h":"волка, лису, беркута. 6. На стадионе соревновались... бегуны, прыгуны, метатели. 7. Дикие звери водятся ... в лесах, в степях, в горах."},{"t":"p","h":"Упражнение 224. Перепишите и вставьте после обобщающих слов однородные члены."},{"t":"p","h":"Образец: В Кыргызстане есть красивые города: Бишкек, Ош, Каракол, Нарын."},{"t":"p","h":"1. В Кыргызстане есть красивые города: 2. В школе мы изучаем разные предметы: .... 3. Сабира выучила известные стихотворения Пушкина: ЕЕ Яркие цветы росли везде: .... 5. В магазин привезли кожаную обувь: ...."},{"t":"p","h":"6. В Европе текут большие реки: ...."}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[142,143]},{"title":"§ 41. ОБРАЩЕНИЕ.","blocks":[{"t":"h3","h":"§ 41. ОБРАЩЕНИЕ."},{"t":"p","h":"(Каратма Вспомните:"},{"t":"p","h":"1. Какие части речи являются членами предложения?"},{"t":"p","h":"2. Каковы главные члены предложения?"},{"t":"p","h":"В нашей речи иногда называют людей, с которыми разговаривают. Эти слова являются обращениями."},{"t":"p","h":"<span class=\"pg\" data-n=\"144\">144<\/span>Обычно обращение – это название людей, иногда животных, а реже – неживых предметов. Например: Сансызбай, принеси свой дневник. Иди сюда, Барбос! Дождик, дождик, перестань!"},{"t":"p","h":"В русском языке обращение может стоять в начале, в середине и в конце предложения. Обращение не является членом предложения. Оно грамматически не связано с членами предложения, т.е. к нему нельзя поставить вопрос от членов предложения. На письме, как и в кыргызском языке, оно выделяется запятыми."},{"t":"p","h":"Если обращение стоит в середине предложения, запятые ставятся с обеих сторон. Если обращение стоит в начале предложения, то запятая ставится после обращения. Если обращение стоит в конце предложения, то запятая ставится перед обращением. Например: Дай мне, Бейшегуль, твою книгу. Бейшегуль, дай мне твою книгу! Дай мне твою книгу, Бейшегуль."},{"t":"p","h":"Личные местоимения не бывают обращениями. Обычно обращение выражается именем существительным в именительном падеже."},{"t":"p","h":"Обращение, как и в кыргызском языке, может составить отдельное предложение (обычно восклицательное). Например: Помните, что ученье – свет, а неученье тьма!"},{"t":"p","h":"Обращение может состоять из нескольких слов. Так, обращение может иметь при себе определения. Например, письма часто начинаются с обращения: Дорогой друг! Многоуважаемый Иван Сергеевич!"},{"t":"p","h":"Обращение и относящиеся к нему слова составляют распространённое обращение. Оно выделяется, как и обычное обращение. Например: Дорогой мой сын Джапар, твоё письмо мы получили."},{"t":"v","l":["Вопросы для повторения:",". Какие слова называются обращениями?",". Является ли обращение членом предложения?",". Как выделяется обращение на письме?",". Где может стоять обращение в предложении?",". Какие обращения являются распространёнными?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"145\">145<\/span>Упражнение 225. Перепишите. Найдите обращения и подчеркните их."},{"t":"p","h":"1. Мамочка, сегодня у нас большая радость (А. Гайдар)."},{"t":"p","h":"2. – Учитель, а Вы с Лениным за руку здоровались? – Нет, дети, я никогда не видел Ленина (Ч. Айтматов). 3. Товарищи! Мы будем бороться за своё освобождение (М. Горький)."},{"t":"p","h":"4. Друзья! Я шлю вам привет и крепко жму ваши руки! (Н. Островский). 5. В защиту мира вставайте, люди! 6. Учетом медикаментов, медсестра Глаша, будете заниматься вы (В. Панова). Т. Дорогие гости, заходите в дом, отдохните до утра. 8. Ночной тишине, пограничник, не верь!"},{"t":"v","l":["Словарь;","освобождение – бошотуу учёт – эсепке алуу"]},{"t":"p","h":"Упражнение 226. Перепишите. Найдите определения, которые относятся к обращениям, и подчеркните их."},{"t":"p","h":"1. Тебе, мой любимый учитель, посвящаю я свои стихи (А. Осмонов). 2. Эй, добрый человек, не знаешь ли ты, где здесь дорога? (А. Пушкин). 3. Прекрасен ты, мой край родной (А. Токомбаев). 4. Прощай, мой товарищ, мой верный слуга (А. П ушкин). 5. Лети, письмо приветное, лети в далёкий край (М. Исаковский). 6. Здравствуй, новая жизнь! (А. Чехов). Т. Светлая дружба, ты греешь сердца! (Джамбул). 8. А ну-ка песню нам пропой, весёлый ветер! (В. Лебедев-Кумач). 9. С добрым утром, милый город! Что молчишь ты, степь широкая?"},{"t":"v","l":["Словарь:","породнить – туугандашуу слуга – уй кызматчысы"]},{"t":"p","h":"Упражнение 227. Перепишите. Подчеркните в нечётных предложениях обращения. Укажите в чётных предложениях, как связаны подлежащее и сказуемое."},{"t":"p","h":"1. Дети, входите в класс! 2. Дети входят в класс и усаживаются на свой места. 3. Осмон, подойди к доске и повбёсь карту Европы. 4. Осмон подошёл к доске и повесил карту Европы. 5. Мама, разбуди нас рано утром. 6. Мама разбудила нас рано утром. 7. Расскажи нам, дедушка, новую сказку. 8. Дедушка рассказывает нам новую сказку."},{"t":"p","h":"<span class=\"pg\" data-n=\"146\">146<\/span>9. Андрей Иванович, не забудьте выполнить нашу просьбу."},{"t":"p","h":"10. Андрей Иванович не забудет выполнить нашу просьбу."},{"t":"p","h":"11. Студенты и школьники! Учитесь на «хорошо» и «отлично»! 12. Студенты и школьники учатся на «хорошо» и «отлично»!"},{"t":"p","h":"Упражнение 228. Передвлайте следующие предложения так, чтобы слова, являющиеся в них подлежащими, стали обращениями. Запишите эти предложения. Расставьте знаки препинания."},{"t":"p","h":"Образец: Майрамбек, помоги мне выполнить трудное упражнение."},{"t":"p","h":"1. Майрамбек помог мне выполнить трудное упражнение. 2. Дежурный открыл окно и проветрил класс."},{"t":"p","h":"3. Мама сообщила в школу о моей болезни. 4. Джыпаргуль сходила в аптеку за лекарством. 5. Пешеходы были осторожны при переходе через опасный перекрёсток."},{"t":"p","h":"6. Майсалбек пойдёт в сад и принесёт спелых яблок."},{"t":"p","h":"7. Друзья пошли в лес за ягодами и грибами. 8. Механизаторы и полеводы борются за высокие урожаи сельскохозяйственной продукции."},{"t":"p","h":"Упражнение 229. Составьте короткое письмо, употребив обращения."}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[144,146]},{"title":"§ 42. ВВОДНЫЕ СЛОВА И СОЧЕТАНИЯ СЛОВ.","blocks":[{"t":"h3","h":"§ 42. ВВОДНЫЕ СЛОВА И СОЧЕТАНИЯ СЛОВ."},{"t":"v","l":["(Киринди сездер.)","Вепомните:","1. Какие члены предложения вы знаете?","2. Является ли обращение членом предложения?","3. Как выделяется обращение на письме?"]},{"t":"p","h":"Не меняя основного содержания предложения, можно включить в предложение слова, которые придадут дополнительный оттенок его смыслу. Сравните два предложения. Соня, возможно, сегодня не придёт на урок. Соня, безусловно, сегодня не придёт на урок."},{"t":"p","h":"Основное содержание обоих предложений состоит в том, что Соня не придёт на урок. Но в первом предложении говорящий в этом не уверен. Он, может быть, слышал, что <span class=\"pg\" data-n=\"147\">147<\/span>Соня заболела, но точно этого не знает. Во втором же предложении мысль высказана твёрдо: говорящий знает, что Соня наверняка не сможет прийти на урок. В первом предложении возможность осуществления того, о чём говорится В предложении, выражена словом возможно. Во втором предложении уверенность в этом высказана при помощи слова безусловно. К этим словам нельзя поставить вопрос от членов предложения. Они грамматически не связаны с предложением, не являются членами предложения."},{"t":"p","h":"Слова или сочетания слов, грамматически не связанные с предложением, не меняющие основного содержания предложения, а лишь вносящие какой-то дополнительный оттенок в сообщения, называются вводными словами или сочетаниями слов."},{"t":"p","h":"В устной рёчи вводные слова выделяются в произношении, а на письме их выделяют запятыми."},{"t":"p","h":"Вводные слова и сочетания слов в русском языке чаще всего указывают на следующие оттенки смысла:"},{"t":"p","h":"а) достоверность сообщения (правда, наверное, поистине, видимо, возможно, вероятно, безусловно, бесспорно, действительно, по-видимому, думаю, полагаю, надеюсь, без всякого сомнения и др-);"},{"t":"p","h":"6) оценку говорящим содержания сообщения (к счастью, к несчастью, к радости, к удивлению, к сожалению, к стыду, на счастье, на беду, чего доброго и др.);"},{"t":"p","h":"в) источник сообщения (по слухам, по преданию, говорят, по-моему, по-вашему, по-такому, по словам такого-то, по мнению такой-то, с точки зрения такого-то и др.);"},{"t":"p","h":"г) порядок и важность сообщений (60- первых, во-вторых, в-третьих, в-четвёртых, главное, кстати, например, в частности, в общем, между прочим, в конце концов, следовательно, напротив, наоборот, таким образом и 9др.)."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"1. Какие слова и сочетания слов называются вводными?"},{"t":"p","h":"2. Являются ли вводные слова членами предложения?"},{"t":"p","h":"<span class=\"pg\" data-n=\"148\">148<\/span>3. Какие оттенки смысла передаются часто вводными словами?"},{"t":"p","h":"4. Приведите примеры вводных слов, передающих разные оттенки смысла."},{"t":"p","h":"Упражнение 230. Перепишите. Вводные слова и вводные сочетания слов подчеркните и укажите, какое значение они выражают."},{"t":"p","h":"1. Чтение книг, во- первых, помогает понять жизнь, ВО-вторых, укрепляет грамотность, в- развивает речь."},{"t":"p","h":"2. Морской воздух, по мнению врачей, благотворно действует на здоровье человека. 3. По преданию, через Санташ когда-то прошли войска Чингисхана. 4. От сильного толчка Танабай, правда, едва не вылетел из седла, но удержался (Ч. Айтматов). 5. По-моему, барсов надо искать там, где есть архары (К. Джантошев). 6. К сожалению, добраться до знаменитого озера нам не удалось (Н. Пржевальский)."},{"t":"p","h":"7. Темирбек зимой простудился и заболел. Следовательно, ему надо закалять организм."},{"t":"v","l":["Словарь:","мнение – пикир, ой","благотворно – пайдалуу, жакшы","таасир кылат","предание – ылакап, уламыш","закалять – чыноо"]},{"t":"p","h":"Упражнение 231. Перепишите, ставя знаки препинания при вводных словах и сочетаниях слов. Объясните значения вводных слов и сочетаний слов."},{"t":"p","h":"1. Лодка наша затонула к счастью не на глубоком месте (И. Тургенев). 2. К моему удивлению вода в Иссык-Куле оказалась слабосолёной (Н. Пржевальский). 3. Уже цветёт черёмуха, и скоро очевидно зацветёт сирень. 4. Занятия спортом во- первых укрепляют здоровье во-вторых дисциплинируют человека. 5. Кстати я с твоим братом работаю на одном заводе (В. Кетлинская). 6. По слухам возле Новой Земли нас ожидают тяжёлые льды (В. Конецкий). Т. Из-за тумана корабль по- видимому прошёл мимо маяка. 8. Листья на деревьях желтеют следовательно приближается осень."},{"t":"p","h":"Словарь:"},{"t":"p","h":"удивление – тан калуу кстати – айтмакчы, баса очевидно – мумкун, болжолу следовательно – демек, ошондуктан"},{"t":"p","h":"<span class=\"pg\" data-n=\"149\">149<\/span>Упражнение 232. Перепишите. Вставьте вместо точек вводные слова и сочетания слов, указывающие на достоверность сообщения."},{"t":"p","h":"1. Этот вопрос нам, .., нужно обсудить на классном собрании. 2. ЯК, ... ‚ очень сильное и выносливое животное."},{"t":"p","h":"3. К вёчеру, ..., погода может измениться. 4. В весеннем кроссе, ... ‚ победит команда нашей школы. 5. Витамины,"},{"t":"p","h":"необходимы для здоровья человбка. 6. ..., Жанболот был маленького роста, но зато крепкий. Т. ..., Шарипа обидится на меня за критику, но я не буду молчать."},{"t":"v","l":["Словарь:","обидеть – таарынтуу","як – топоз"]},{"t":"p","h":"Упражнение 233. Перепишите, вставляя пропущенные вводные слова в сочетания слов, обозначающие источник сообщения или оценку его содержания."},{"t":"p","h":"1. Помощь, .., подоспела вовремя. 2. ...., Карыипбек не сумёл достать билеты в театр. 3. ..., лучше сегодня сделать, чем завтра обещать. 4. ..., перед соревнованиями наш лучший шахматист заболел. 5. Атомный ледокол «Ленин»,"},{"t":"p","h":"вернулся из трудного рейса. 6. ..., охотник успел перезарядить ружьё и выстрелить в дикого кабана. Т. ..., на месте пустыни были когда-то цветущие города."},{"t":"v","l":["Словарь:","перезарядить – жаныдан дурметтее"]},{"t":"p","h":"Упражнение 234. Составьте развёрнутый ответ на вопрос: «Что надо делать, чтобы быть сильным и крепким?». Для ответа используйте вводные слова, указывающие порядок и важность сообщаемого."},{"t":"p","h":"Упражнение 235. Переведите с кыргызского языка на русский, используя вводные слова и сочетания слов. Перевод запишите."},{"t":"p","h":"1. Албетте, биз женебиз (К. Баялинов). 2. Курулушка, шексиз, карагай керек (К. Баялинов). 3. Тилегиме каршы, суу кирип кетиптир (Ч. Айтматов). 4. Энемин айтуусу 6боюнча, Бишкек чон жана кооз шаар. 5. Мен, балким, эртен силердикине келип калармын (К. Жантешев). 6. Ырас, Батма, туура айтып отурасын. 7. Менимче, жолдоштор, бул маселе туура чечилди (А. Сасыкбаев И"},{"t":"p","h":"<span class=\"pg\" data-n=\"150\">150<\/span>Упражнение 236. Некоторые слова могут быть и вводными и могут употребляться как члены предложения. Из данного упражнения выпишите те предложения, в которых выделенные слова являются вводными словами."},{"t":"p","h":"1. Из окна автобуса было видно море. 2. Асанбек не сможет, видно, до пятницы, написать доклад о Маяковском."},{"t":"p","h":"3. Напротив меня в автобусе сидел пожилой мужчина."},{"t":"p","h":"4. Джамиля была весёлая и разговорчивая девушка, а Айша, напротив, спокойная и серьёзная. 5. Из-за сильных дождей в горах возможно наводнение. 6. В ближайшие дни в горах, возможно, произойдёт наводнение. 7. В данный момент директор может быть в своём кабинете. 8. В данный момент директор, может быть, находится на совещании. 9. Мать мужественно отнеслась к несчастью. 10. К несчастью, землетрясение разрушило мост через реку."}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[147,150]},{"title":"§ 43. ДЕЕПРИЧАСТНЫЙ ОБОРОТ.","blocks":[{"t":"h3","h":"§ 43. ДЕЕПРИЧАСТНЫЙ ОБОРОТ."},{"t":"p","h":"Повторить деепричастие, 5 31, 32, 33."},{"t":"p","h":"Вспомните:"},{"t":"p","h":"1. Какими частями речи выражаются обстоятельства образа действия, причины, времени?"},{"t":"p","h":"2. Что означают деепричастия?"},{"t":"p","h":"Некоторые виды обстоятельств выражаются при помощи деепричастия. Напри мер: Ученик отвечает стоя. Войдя, Джусупакмат вежливо поздоровался. Лошадь, испугавшись, бросилась в сторону."},{"t":"p","h":"Обстоятельства, выраженные одиночным деепричастием, когда они стоят в начале или в середине предложения, обособляются (езгечеленет). Обособление члена предложения выражается отдельным, подчёркнутым произношением. Оно служит обычно для того, чтобы усилить, подчеркнуть смысл какого-то члена предложения, указать на его особую связь с другими словами."},{"t":"p","h":"На письме обособленные обстоятельства-деепричастия выделяются запятыми. Если деепричастие употреблено в <span class=\"pg\" data-n=\"151\">151<\/span>начале предложения, запятая ставится после него. Если деепричастие употреблено в середине предложения, запятые ставятся с обвих сторон."},{"t":"p","h":"Деепричастный оборот – это деепричастие с относящимися к нему словами (дополнениями, обстоятельствами и т.д.). Как и одиночное деепричастие, деепричастный оборот может стоять в начале, середине или в конце предложения. В устной речи он обычно обособляется, а на письме выделяется запятыми. Наприм ер: Войдя в комнату, Джусупакмат вежливо поздоровался. В этом предложении деепричастный оборот состойт из деепричастия и относящегося к нему обстоятельства места. Джусупакмат вышел из комнаты, погасив электролампочку. В этом предложении деепричастный оборот состоит из деепричастия и дополнения к нему. Джусупакмат, застёгивая на ходу пальто, выбежал на улицу. Здесь в деепричастный оборот входит дополнение пальто и обстоятельство образа действия на ходу."},{"t":"p","h":"Часто деепричастный оборот служит для передачи второго, сопровождающего первое, действия. Так в предложении Джусупакмат вышел из комнаты, погасив электролампочку главное действие передано глаголом-сказуемым вышел. Но одновременно происходит и второе действие: он погасил электролампочку. Это действие не главное, оно лишь сопровождает первое, главное, действие. Такое второстепенное действие часто передаётся, как в этом предложении, при помощи деепричастного оборота."},{"t":"p","h":"Если второстепенное действие происходит до главного, то обычно употребляется деепричастие совершенного вида. Например: Достав из шкафа нужные книги, Асанбек пошёл в школу."},{"t":"p","h":"Если второстепенное действие происходит одновременно с главным, оно часто выражается деепричастием несовершеённого вида. Например: Доставая из шкафа нужные книги, Асанбек уронил тетрадь."},{"t":"p","h":"Деепричастие – глагольная форма. Оно управляет именами существительными как соответствующий глагол. Дополнения и обстоятельства могут стоять при деепричастии, как при обычном глаголе. Например: рисую <span class=\"pg\" data-n=\"152\">152<\/span>карандашом – рисуя карандашом, рисуешь карикатуру – рисуя карикатуру, рисуют в комнате – рисуя в комнате и т. д."},{"t":"p","h":"Задание. Составьте предложения с данными деепричастными оборотами."},{"t":"p","h":"1. Закончив трудовую смену, ... 2. Написав контрольный диктант по русскому языку, 3. Напевая весёлую песенку, .... 4. Громко залаяв, .... 5. Переходя через опасный перекрёсток, .... 6. Изучая классическую русскую литературу, .... Т. Включив цветной телевизор, .... 8. Собирая металлолом и макулатуру, .... 9. Закончив десятый класс и получив аттестат, 10. Взлетев в космическом корабле над планетой, .... 11. Овладевая научными знаниями, .... 12. Прочитав в журнале «Юность» интересную статью, .... 13. Выращивая в теплице свежие овощи, .... 14. Накормив и оседлав коня, .... 15. Надев спортивную форму и взяв мячи, ...."},{"t":"p","h":"Упражнение 237. Найдите и выпишите предложения с деепричастными оборотами. Выясните, какие слова относятся к деепричастиям."},{"t":"p","h":"1. Между тем царица злая, про царевну вспоминая, не могла простить её. 2. Раз царевна молодая, милых братьев поджидая, пряла, сидя у окна. 3. Но царевна молодая, тихомолком расцветая, между тем росла, росла. 4. Им навстречу, грозно воя, пёс бежит. 5. В тот же день царица злая, доброй вести ожидая, втайне зеркальце взяла. 6. Вот царица, наряжаясь перед зеркальцем своим, перемолвилася с ним."},{"t":"p","h":"7. Нищая черница ходит по двору, клюкой отгоняя пса."},{"t":"p","h":"8. И, беседуя приятно, в путь пускаются обратно."},{"t":"p","h":"По А. Пушкину. Словарь: милый – суйкумдуу"},{"t":"v","l":["тихомолком (втихомолку) —","билинбестен, жашыруун","весть – кабар","нищий – жакыр","втайне (тайно) – жашыруун"]},{"t":"p","h":"наряжаться (одеваться, украша-"},{"t":"v","l":["ться) – кооздонуп кийину\\","перемолвиться – суйлешуу","черница – кызматчы аял"]},{"t":"p","h":"<span class=\"pg\" data-n=\"153\">153<\/span>Упражнение 238. Перепишите, расставляя пропущенные запятые. Подчеркните слова, которые относятся к деепричастиям."},{"t":"p","h":"1. Дубровский подойдя к офицеру приставил пистолет к его груди и выстрелил (А. П ушкин). 2. Вороны и сороки перелетали с места на место подбирая зёрна (Л. Толстой)."},{"t":"p","h":"3. Распространяя листовки мать помогала сыну бороться против царя (М. Горький). 4. Не подозревая об опасности Гульсары спокойно лизал соль (Ч. Айтматов). 5. Танабай не подчинившись приказу отправил иноходца в табун (Ч. Айтматов). 6. Покорив соседние племена войска монголов двинулись на Русь (В. Ян). 7. Каштанка оглядываясь по сторонам вошла в маленькую комнату (А. Чехов). 8. Отказав другу в просьбе Андрей долго сидел в кабинете (Г. Марков)."},{"t":"v","l":["Словарь:","распространять – таратуу","подозревать – шек саноо","лизать жалоо","подчиниться – багынуу","покорять – багындыруу","отказать кабыл кылбоо"]},{"t":"p","h":"Упражнение 239. Перепишите, переделывая одиночное деепричастие в деепричастный оборот путём добавления дополнений. Дополнения в скобках поставьте в нужном падеже. Расставьте запятые."},{"t":"p","h":"1. Продиктовав (предложения) учитель попросил расставить запятые. 2. Интересуясь (музыка) Джумабек в то же время любил литературу. 3. Удав проглотив (добыча) спокойно лежал на песке. 4. Баи и манапы издеваясь над (народ) боялись народного гнёва. 5. Сверкая (огни) к пристани приближался новый теплоход. 6. По дороге шли подростки распевая (песни). Т. Попросив (слбво) учитель истории стал возражать докладчику. 8. Потеряв (хозяин) овчарка долго искала его."},{"t":"p","h":"Словарь:"},{"t":"p","h":"издеваться – шылдындоо возражать – каршы суйлее гнев – ачуу, каар"},{"t":"p","h":"Упражнение 240. Перепишите, переделывая одиночное деепричастие в деепричастный оборот путём добавления к нему обстоятельств."},{"t":"p","h":"<span class=\"pg\" data-n=\"154\">154<\/span>Образец: Радостно крича, дети побежали навстречу маме."},{"t":"p","h":"1. .. крича, дети побежали навстречу маме. 2. Вернувшись из ..., Зуура долго читала стихи любимого поэта."},{"t":"p","h":"3. Коля и Осмон пошли на рыбалку, ... накопав червей."},{"t":"p","h":"4. Уехав за ..., Тургенев сильно тосковал по Родине. 5. ... рыча, тигр выбежал из чащи на поляну. 6. Скрываясь в ..., партизаны неожиданно нападали на врагов. 7. Утки, покружившись над ..., полетели вдоль берега. 8. ... обернувшись, Зина увидела свою подругу около витрины магазина."},{"t":"p","h":"Словарь:"},{"t":"p","h":"полететь вдоль берега – жээкти бойлоп учуп кетуу"},{"t":"p","h":"Упражнение 241. Вместо точек вставьте деепричастия нужного вида, чтобы действие, указанное в деепричастном обороте, предшествовало главному действию."},{"t":"p","h":"Образец: Встретив сыновей, Бульба на другое же утро поехал с ними в Сечь."},{"t":"p","h":"1. ... сыновей, Бульба на другое же утро поехал с ними в Сечь (Н. Гоголь). 2. Девушка, ... пальто, вышла из дома переулке. 3. ... Муму, Герасим ушёл из города в родную деревню. 4. ... топор, плотник начал тесать бревно (И. Тургенев). 5. ... яблоко пополам, Светлана половину отдала подруге. 6. ... тряпку в воде, Кулипа тщательно вытерла доску. Т. ... цыплёнка, коршун улетел в кустарник."},{"t":"p","h":"8. ... обувь, мы босиком перешли речку."},{"t":"p","h":"Словарь:"},{"t":"p","h":"тесать – суруу тщательно – кылдаттык менен пополам – тептен экиге"},{"t":"p","h":"Упражнение 242. Вместо точек вставьте деепричастия нужного вида, чтобы действие, указанное в деепричастном обороте, происходило одновременно с главным действием."},{"t":"p","h":"Образец: Выполняя приказ командира, бойцы поползли в тыл врага."},{"t":"p","h":"<span class=\"pg\" data-n=\"155\">155<\/span>1. ... приказ командира, бойцы поползли в тыл врага."},{"t":"p","h":"2. Бабушка сидела на лавке, ... сказки. 3. ... поезд,"},{"t":"p","h":"стояли на перроне. 4. Сестра хозяйничала на кухне, ... посудой. 5. Шофер сидел за рулём, ... автомашиной."},{"t":"p","h":"6. Джайдар играла на темир- комузе. Танабай сидел рядом, 2 древнюю кыргызскую мелодию (Ч. Айтматов). Т. ... от Москвы, фашисты в панике бросали военную технику."},{"t":"p","h":"Слова для справок: рассказывая, выполняя, гремя, ожидая, управляя, слушая, отступая."},{"t":"p","h":"Словарь:"},{"t":"p","h":"мелодия – обон, ку\\ отступать – артка чегинуу паника – корккондуктан"},{"t":"p","h":"дурбеленге тушуу"},{"t":"p","h":"Упражнение 243. Переделайте следующие предложения так, чтобы в них употреблялись деепричастные обороты."},{"t":"p","h":"Образец: Мать, накормив детей, уложила их спать."},{"t":"p","h":"1. Мать накормила детей и уложила их спать. 2. Корабли вышли из порта и взяли курс на Одессу. 3. Андрей посмотрел вверх и увидел в окне кареты красавицу. 4. Молния ярко вспыхнула и осветила мокрый лес. 5. Джамал удивлённо воскликнула и побежала навстречу брату. 6. Кадыр втихомолку собрал вещи и уехал |: морское училище. 7. Жена лесника расстелила скатерть и поставила на стол горшок молока и жареный картофель. 8. Старый мастер осмотрел станок и побеседовал с токарем. 9. Волга вытекает из родника и постепенно становится могучей рекой."},{"t":"v","l":["Словарь:","воскликнуть – кыйкырып жиберуу","постепенно – бара-бара, аз-аздан"]},{"t":"p","h":"Упражнение 244. Перепишите. Найдите обособленные деепричастия и деепричастные обороты. Выделите их запятыми."},{"t":"p","h":"1. То крылом волны касаясь то стрелой взмывая к тучам он кричит, и тучи слышат радость в смелом крике птицы."},{"t":"p","h":"2. В пене гнева стонут волны с ветром споря. 3. Вот <span class=\"pg\" data-n=\"156\">156<\/span>охватывает ветер стаи волн объятьем крепким и бросает их с размаха в дикой злобе на утёсы разбивая в пыль и брызги изумрудные громады. 4. Точно огненные змеи, вьются в море исчезая отраженья этих молний. 5. И крикнул Сокол с тоской и болью собрав все силы. 6. В ущелье лёжа Уж долго думал о смерти птицы. 7. Забыв об этом он пал на камни."},{"t":"p","h":"По М. Горькому. Словарь: вздымая – жогору кетеруп"},{"t":"v","l":["злоба – кыжырлануу, ачуулануу","утёс – зоока","исчезать – жок болуу, кетуу","отражение – кайтаруу"]},{"t":"p","h":"Упражнение 245. Прочитайте вслух. Ответьте, чем отличается произношение деепричастий и выделенных вместе с ними слов друг от друга."},{"t":"p","h":"1. Веля идти поскорее, девушка вела их к цели. 2. Там, где была гора, заходило солнце, горя последними лучами."},{"t":"p","h":"3. Кося траву, Семён следил, чтобы коса была острой."},{"t":"p","h":"4. Сверля доску, мастер присматривался к работе, чтобы не повредить сверла."},{"t":"p","h":"Словарь:"},{"t":"raw","h":"<h4 class=\"mk\">задеть – тийип кетуу сверлить – бургулоо<\/h4>"},{"t":"p","h":"присматриваться – тиктеп кароо сверло – бургу"}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[151,156]},{"title":"§ 44. ПРИЧАСТНЫЙ ОБОРОТ.","blocks":[{"t":"h3","h":"§ 44. ПРИЧАСТНЫЙ ОБОРОТ."},{"t":"v","l":["Повторить причастие, $5 25.","Вепомните:","1. Что такое причастие?","2. Чем выражается определение?"]},{"t":"p","h":"3. В чём согласуется согласованное определение с определяемым словом?"},{"t":"p","h":"4. Что называется деепричастным оборотом?"},{"t":"p","h":"Согласованное определение может выражаться причастием. Например: Запылённый грузовик въехал во двор школы. К определению, выраженному причастием, <span class=\"pg\" data-n=\"157\">157<\/span>могут относиться еще дополнения и обстоятельства. Например: Въёхавший во двор школы грузовик был нагружен дровами. Нагруженную дровами машину, мы быстро разгрузили. Причастие с зависимыми от него словами называется причастным оборотом. Причастный оборот, стоящий после определяемого слова, обособляется. Например: Ученики, разгружавшие дрова, получили благодарность директора школы."},{"t":"p","h":"Обособляется также определение (в том числе и причастный оборот), которое относится к личному местоимению и стойт перед ним. Например: Обрадованные благодарностью, онй пошли домой."},{"t":"p","h":"На письмё обособленный причастный оборот выделяется запятыми с обвих сторбн (если он стоит в середине предложения) или с одной стороны (если он стоит в начале или в конце предложения). Наприм ер: Ребята, отдохнувшие подсле разгрузки дров, сели за домашнее задание. Онй быстро справились с заданием, заинтересовавшим их."},{"t":"p","h":"Обособленный причастный оборот обычно употребляется после определяемого существительного. Часто он начинается с причастия. Причастие согласуется с определяемым существительным в роде, числе и падеже. Например: Ученикам, выполнившим домашнее задание, удалось ещё поиграть в футбол."},{"t":"p","h":"После причастия следуют дополнения и обстоятельства. Причастие, как глагольная форма, может управлять падежами существительных. Напри мер: Игра, захватившая ребят, продолжалась около часа."},{"t":"p","h":"Иногда обстоятельства, выраженные наречиями, могут з обособленном причастном обороте стоять впереди причастия. Обстоятельства, выраженные наречиями, связываются по способу примыкания. Наприм ер: День, полностью заполненный событиями, закончился."},{"t":"v","l":["Вопросы для повторения:","1. Что такое причастный оборот?"]},{"t":"p","h":"2. Какую роль выполняет причастный оборот в предложении?"},{"t":"p","h":"3. Когда причастный оборот обособляется?"},{"t":"p","h":"4. Как передаётся обособление причастного оборота на письме?"},{"t":"p","h":"<span class=\"pg\" data-n=\"158\">158<\/span>5. Где стоит в предложении обособленный причастный оборот?"},{"t":"p","h":"6. Что стоит в причастном обороте после причастия?"},{"t":"p","h":"Т. С какого слова обычно начинается обособленный причастный оборот?"},{"t":"p","h":"8. Какой член предложения иногда предшествует причастию в обособленном причастном обороте?"},{"t":"p","h":"9. В чём согласуется причастие с определяемым словом?"},{"t":"p","h":"Упражнение 246. Перепишите. Найдите причастные обороты. Обособленные причастные обороты подчеркните."},{"t":"p","h":"1. Вокруг меня простирались печальные пустыни, пересечённые холмами и оврагами. 2. Кибитка ехала по следу, проложенному крестьянскими санями. 3. Я закутался в шубу и задремал, убаюканный пением бури. 4. Меня, однако, охватила досада, что не мог отблагодарить человека, выручившего меня из неприятного положения. 5. Владимир отворил дверь и увидел человека, прижавшегося в угол."},{"t":"p","h":"6. Принятые против них меры оказались недостаточными."},{"t":"p","h":"7. Несколько троек, наполненных разбойниками, разъезжали днём по всей губернии."},{"t":"p","h":"По А. Пушкину. Словарь: простираться – созулуп жатуу"},{"t":"v","l":["кибитка (крытые сани) – чана","убаюканный – термелип","прижаться – жабышуу, корголоо","досада – екунуу","неприятный – мында: ынгайсыз","абал"]},{"t":"p","h":"Упражнение 247. Перепишите. Найдите обособленные причастные обороты и расставьте запятые."},{"t":"h3","h":"ТОСКА ПО ГУЛЬСАРЫ."},{"t":"p","h":"Издалека донеслось ржание Гульсары уведённог

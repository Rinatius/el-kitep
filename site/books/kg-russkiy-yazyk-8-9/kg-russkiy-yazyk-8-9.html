 машины лежал перепуганный генерал с портфелем. Лёня прицелился из автомата и потребовал, чтобы генерал сдался в плен. Генерал поднял руки вверх и спросил, кто помогал мальчику уничтожить машину и шофёра. Мальчик гордо ответил, что с этим делом он справился один. Потом Лёня открыл толстый портфель генерала и увидел, что там лежало. Там были ценные военные карты и документы. Мальчик доставил немца и его портфель в отряд. Вскоре все партизаны узнали, кого поймал Лёня. Они смеялись над перепуганным <span class=\"pg\" data-n=\"244\">244<\/span>генералом. А юному партизану было присвоено звание Героя."},{"t":"p","h":"По М. Дудину. Словарь;"},{"t":"p","h":"плен – туткун справиться – колдон келу\\"},{"t":"p","h":"Упражнение 364. Перепишите. Подчеркните в придаточных изъяснительных союзы одной чертой, а союзные слова двумя. Над союзными словами напишите, какими членами предложения они являются."},{"t":"p","h":"Докладчик сказал, что влияние русского языка на другие языки огромно. 2. В темноте трудно было разглядеть, что проплывало по реке (М. Горький). 3. Утром Данияр узнал, кто постирал его старую гимнастёрку (Ч. Айтматов). 4. Тарас уже не слышал, о чём говорили между собой казаки (Н. Гоголь). 5. Капитан опасался, что тяжёлые волны пробьют корпус парохода (В. Катаев). 6. Я не знал, к кому мне обратиться (К. Федин). 7. Лодочник долго соображал, чем наглухо заткнуть дыру в лодке (С. Воронин). Словарь: пробить – уруп тешуу"},{"t":"v","l":["лодочник – кайыкчы","соображать (думать) – ойлонуу","наглухо – жылчыксыз"]},{"t":"p","h":"Упражнение 365. Перепишите. Вместо многоточий вставьте союзные слова кто или что в нужном падеже."},{"t":"p","h":"1. Айгуль долго не могла выяснить, от ... пришла посылка с книгами. 2. Чинара растерялась и не знала, о ... она будет говорить на собрании. 3. Лейтенант спросил, .. желает добровольно пойти в разведку. 4. В газете сообщили, Ба выдвинули кандидатом в депутаты районного совета. 5. Отец мне объяснил, ... означает рисунок на старинной монете."},{"t":"p","h":"6. Мухтар явно знал, для ... он приготовил букет цветов."},{"t":"p","h":"7. В записке было написано, ... мы должны были вручить это письмо."},{"t":"v","l":["Словарь:","выдвинуть – корсетуу явно – ачык, даана","означать – белгилее"]},{"t":"p","h":"<span class=\"pg\" data-n=\"245\">245<\/span>Упражнение 366. Составьте сложноподчинённые предложения с придаточными изъяснительными, добавляя к главным предложениям (в первом столбике) придаточные из второго столбика. Подчеркните союзы и союзные слова, расставьте запятые."},{"t":"p","h":"1. Враги не раз убежда-"},{"t":"v","l":["лись в том ...","2. Шахматисты долго","спорили о том ...","3. Уборщица попросила","","4. Учёные предполагают","","5. Товарищ подробно","объяснил ...","6. Издалека трудно было","определить ..."]},{"t":"p","h":"1. кто победит в шахматных соревнованиях."},{"t":"p","h":"2. что дружный народ нельзя победить."},{"t":"p","h":"3. что наводнение на Неве бывает один раз в столетие."},{"t":"p","h":"4. чтобы мы следили за чистотой в классе."},{"t":"p","h":"5. что растёт на склоне горы."},{"t":"p","h":"6. с кем я должен встретиться в редакции молодёжной газеты."},{"t":"v","l":["Словарь:","предполагать – божомолдоо следить – байкоо","столетие – жуз жылдык"]},{"t":"p","h":"Упражнение 367. Перепишите, вставляя пропущенные сказуемые в главных предложениях, союзы и союзные слова – в придаточных,"},{"t":"p","h":"1. Недаром ... ... дело мастера боится. 2. Правила уличного движения ..., ... пешеходы ходили только по тротуару. 3. Весь мир ... ‚, ... совершил первый космический полёт. 4. Наши предки ... ... вяленое мясо долго не портится."},{"t":"p","h":"5. Недавно мы ..., 0... писал кыргызский герой Чолпонбай перед боем. 6. Дежурный по аэропорту ... ‚ ... самолёт из Москвы задерживается на полчаса."},{"t":"p","h":"Слова для справок: говориться, требовать, помнить, заметить, узнать, объявить."},{"t":"p","h":"Словарь:"},{"t":"p","h":"предок – тупку ата портиться – бузулуу вяленый – кунге жайып кургатылган"}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[244,245]},{"title":"§ 66. СЛлОЖНОПОДЧИНЁННЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ ОПРЕДЕЛИТЕЛЬНЫМИ.","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"246\">246<\/span>§ 66. СЛлОЖНОПОДЧИНЁННЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ ОПРЕДЕЛИТЕЛЬНЫМИ."},{"t":"v","l":["(Аныктооч багынынкы татаал суийлем.)","","Повторить $ 25, 26, 54.","","Вспомните:"]},{"t":"p","h":"Как называется поясняемое, независимое предложение в составе сложноподчинённого предложения?"},{"t":"p","h":"2. Как называется зависимое, поясняющее, предложение в составе сложноподчинённого предложения?"},{"t":"p","h":"3. Чем сходны и чем отличаются придаточные предложения и члены предложения?"},{"t":"p","h":"4. Какой член предложения называется определением?"},{"t":"p","h":"Придаточное предложение может быть определением одного из членов главного предложения. Оно раскрывает более подробно, чем обычное определение, признак, качество предмета. Такое предложение называется придаточным определительным. В нём можно сообщить о каком- -нибудь действии, которое совершает предмет, о состоянии, в котором он находится. Придаточное определительное относится обычно к члену главного предложения, выраженному именем существительным. Наприм ер: Пушкин, которого мы так любим, – великий поэт. В комнате стоял такой большой шкаф, какого я никогда не видел."},{"t":"p","h":"Придаточные определительные соединяются с главными предложениями при помощи союзного слова который, а также при помощи союзных слов какой и где и др. Союзные слова, как уже говорилось, являются членами придаточного предложения. Придаточные определительные ставятся обычно после слов, к которым они относятся в главном предложении. Следовательно, придаточные определительные не употребляются обычно в начале сложноподчинённых предложений, а находятся внутри главного предложения или после него. Нап рим ёр: Танабай, который работал табунщиком, заметил в табуне резвого буланого жеребчика. Математику преподаёт учитель, которого особенно любят все ученики."},{"t":"p","h":"<span class=\"pg\" data-n=\"247\">247<\/span>В первом предложении придаточное относится к слову Танабай, определяет его. После этого слова, внутри главного предложения, находится придаточное определительное. Во втором предложении придаточное определительное относится к слову учитель и стоит сразу после этого слова, на этот раз-—в конце сложного предложения. Итак, придаточное определительное обычно ставится сразу после определяемого слова."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"1. В чём различие между союзными словами и союзами?"},{"t":"p","h":"2. Какие предложения называются придаточными определительными?"},{"t":"p","h":"3. Какими союзными словами присоединяются придаточные определительные?"},{"t":"p","h":"4. Что определяют придаточные определительные предложения?"},{"t":"p","h":"5. Какими частями речи выражен обычно член предложения, к которому относится придаточное определительное?"},{"t":"p","h":"6. После какого слова употребляется обычно придаточное определительное?"},{"t":"p","h":"7. Как на письме отделяется придаточное предложение от главного?"},{"t":"p","h":"Упражнение 368. Перепишите. Найдите определительные придаточные предложения и те слова в главном предложении, к которым относятся эти придаточные. Подчеркните союзные слова."}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[246,247]},{"title":"ГЛОТОК ВОДЫ.","blocks":[{"t":"h3","h":"ГЛОТОК ВОДЫ."},{"t":"p","h":"После боя, который продолжался несколько часов, в живых осталось шестеро бойцов. Они были разной национальности: русский, украинец, белорус, грузин, казах и кыргыз. Бойцов мучила жажда. Вечером белорус Пётр взял фляжку, какую обычно носят бойцы. Он осторожно пополз к реке, которая протекала далеко от окопов. Когда Пётр наполнил фляжку и полз назад, его заметили фашисты. Пули засвистели над его головой. Возле куста, где боец отдыхал, пуля пробила фляжку. Когда боец вернулся в окоп, во фляжке остался всего лишь один глоток воды. Петр отдал фляжку раненому грузину Шалве. Тот поднёс фляжку к потрескавшимся губам, а затем передал соседу. Фляжка <span class=\"pg\" data-n=\"248\">248<\/span>обошла пятерых и вернулась к солдату, который ползал за водой. На дне фляжки оставался всё тот же глоток воды."},{"t":"p","h":"Так дружба и готовность пожертвовать собой для друга оказались у советских воинов сильнее смерти."},{"t":"p","h":"По Ю. Мищаткину. Словарь:"},{"t":"p","h":"потрескавшийся – жарылып кеткен пожертвовать собой – жанын курман кылуу Упражнение 369. Поставьте определительные придаточные предложения, подходящие по смыслу, после выделенных слов в главном предложении. Расставьте запятые."},{"t":"p","h":"Образец: Тополя, которые мы посадили ранней весной, нежно шумят листвой."},{"t":"p","h":"1. Тополя нежно шумят листвой. 2. Наш собеседник рассказал нам историю. 3. Полотно выпускает бишкекская текстильная фабрика. 4. Из ущелья подул ветер. 5. На щеке казака виднелся шрам. 6. Пансионат расположен в красивой местности. 7. В доме появилась обнова."},{"t":"p","h":"Предложения для вставок: которые мы посадили ранней весной, из которого сестра сшила красивое платье, которая нас необычайно заинтересовала, какой бывает от сабельного удара, который принёс свежесть и прохладу, где отдыхают рабочие, которая всем нам понравилась."},{"t":"v","l":["Словарь:","","нежно шумят – назик шуудурап","собеседник – ангемелешип","отурган киши","свежесть – салкын аба","виднеться керунуу","шрам – тырык","обнова – жаны алынган буюм"]},{"t":"p","h":"Упражнение 370. Из следующих простых предложений составьте сложноподчинённые с придаточными определительными."},{"t":"p","h":"Образец: Автомобиль подзехал к зданию, над котдрым развевался государственный флаг."},{"t":"p","h":"<span class=\"pg\" data-n=\"249\">249<\/span>1. Автомобиль подъехал к зданию. Над зданием развевался государственный флаг. 2. Художник изобразил на картине стадо. Стадо отдыхало на берегу озера. 3. Прохожий отругал мальчика. Мальчик разорил птичье гнездо. 4. Чингиз Айтматов написал повесть о кыргызской девочке. Девочка стала впоследствии известным учёным. 5. Бригадир критиковал трактористов. Трактористы не любили ухаживать за машинами. 6. В хрустальной вазе лежали плоды. Дети сорвали плоды в саду."},{"t":"p","h":"Словарь: изобразить (здесь: нарисовать) – су-"},{"t":"v","l":["реттее","ругать – тилдее","разорить – бузуу","впоследствии – акырында","критиковать – сынга алуу","плоды – жемиштер"]}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[248,249]},{"title":"§ 67. ПРИДАТОЧНЫЕ ОПРЕДЕЛИТЕЛЬНЫЕ С СОЮЗНЫМ СЛОВОМ КОТОРЫЙ.","blocks":[{"t":"h3","h":"§ 67. ПРИДАТОЧНЫЕ ОПРЕДЕЛИТЕЛЬНЫЕ С СОЮЗНЫМ СЛОВОМ КОТОРЫЙ."},{"t":"p","h":"Вепомните:"},{"t":"p","h":"1. Какие предложения называются придаточными определительными?"},{"t":"p","h":"2. Как обычно связываются придаточные определительные предложения с главными?"},{"t":"p","h":"3. Каковы различия между союзом и союзным словом? Чаще всего придаточные определительные предложения связываются с главными предложениями при помощи союзного слова который. Например: Семья Танабая жила в старом доме, котдорый стоял на краю аила. Союзное слово который служит для присоединения придаточных предложений, имеющих общее значение определения. Слово который согласуется в роде и числе с определяемым существительным в главном предложении. Например: Учитель похвалил ученицу, которая хорошо выучила урок. Учитель похвалил ученика, который хорошо выучил урок. Учитель похвалил учеников, которые хорошо выучили урок. В первом предложении определяемое существительное ученица – женского рода и стоит в единственном числе, союзное <span class=\"pg\" data-n=\"250\">250<\/span>слово котбрая тоже употреблено в форме женского рода единственного числа. Во втором примере придаточное предложбние служит определением слова ученик (мужской род, единственное число). Значит, и союзное слово который должно быть употреблено в форме мужского рода единственного числа. Наконец, в третьем предложении определяемое слово ученики употреблено во множественном числе, а следовательно, союзное слово которые тоже употребляется в форме множественного числа."},{"t":"p","h":"Падеж союзного слова который зависит от того, каким членом придаточного предложения оно является. Если слово который является подлежащим придаточного предложения, оно, конвчно, употребляется в форме именительного падежа. Например: Мы въехали в село, которое стояло у большой дордги. Здесь слово которое является подлежащим придаточного определительного, употреблено в именительном падеже. Если же слово который является второстепенным членом придаточного определительного, оно может быть употреблено в соответствующих косвенных падежах, как с предлогом, так и без предлога. Например: Мой брат, которому исполнилось восемнадцать лет, стал студентом университета. В этом предложении слово которому является дополнением к сказуемому исполнилось и употреблено в дательном падеже."},{"t":"p","h":"Лес, в который упал метеорит, был густым и непроходимым. Здесь союзное слово в который служит обстоятельством места (где упал метеорит) и употреблено в предложном падеже с предлогом в."},{"t":"p","h":"Таким образом, союзное слово который зависит от главного и от придаточного предложения. Род и число его согласуются с родом и числом определяемого члена главного предложения. Падеж союзного слова зависит от его роли в придаточном предложении. Например:"},{"t":"p","h":"Полёт в космос совершил советский человек,"},{"t":"h3","h":"которого"},{"t":"p","h":"не пугали никакие трудности и преграды."},{"t":"p","h":"<span class=\"pg\" data-n=\"251\">251<\/span>Слово которого употреблено в этом предложении в родительном падеже единственного числа мужского рода. Родительного падежа требует сказуемое придаточного предложения (когб не пугали никакие трудности). По роду и числу союзное слово который согласовано с подлежащим главного предложения (человек), которое определяется придаточным предложением."},{"t":"p","h":"Если союзное слово котбдрый является в придаточном предложении подлежащим или членом предложения, зависящим от глагола, то оно ставится в начале придаточного предложения. Например: В классе засветились компьютеры, которые помогают ученикам делать сложные расчёты. (В этом предложении слово которые – подлежащее придаточного, предложения.) Улицы и дома были покрыты снегом, все давно ждали. (Слово которого – дополнение, им управляет глагол ждали.)"},{"t":"p","h":"Если слово который зависит от имени существительного или прилагательного, то онб ставится после этих слов. Например: Состоялось заседание совета дружины, по"},{"t":"p","h":"которого мы отправимся в многодневный поход. Здесь слово которого является несогласованным определением к существительному решение (по чьему решению?). Оно стоит после слова решение."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"1. При помощи какого союзного слова придаточное определительное соединяется чаще всего с главным предложением?"},{"t":"p","h":"2. Как определить род и число, в которых надо употреблять союзное слово который?"},{"t":"p","h":"3. От чегд зависит падеж союзного слова который?"},{"t":"p","h":"4. В каких случаях союзное слово который стоит в начале придаточного предложения?"},{"t":"p","h":"5. Где ставится союзное слово который, если оно зависит от имени существительного или прилагательного?"},{"t":"p","h":"Упражнение 371. Перепишите. Найдите придаточные определительные предложения и те слова в главном предложении, к которым относятся эти придаточные. Подчеркните союзные слова."}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[250,251]},{"title":"МИРОВОЕ ЗНАЧЕНИЕ РУССКОГО ЯЗЫКА.","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"252\">252<\/span>МИРОВОЕ ЗНАЧЕНИЕ РУССКОГО ЯЗЫКА."},{"t":"p","h":"На земном шаре свыше трёх тысяч разных языков. У каждого народа родной язык – самый любимый и дорогой, потому что без родного языка невозможно развитие нации и её культуры."},{"t":"p","h":"Но есть языки, которые считаются самыми распространёнными среди всех народов мира. Это – английский, французский, испанский, арабский, китайский. К их числу относится и русский язык, который стал самым богатым и выразительным языком. Русская речь в настоящее время звучит по всей земной планете."},{"t":"p","h":"Изучая русский язык, мы становимся мудрее, быстрее овладеваем наукой и культурой, обогащаемся научно-технической информацией. Недаром великие мыслители разных народов, не забывая родной язык, призывали любить и изучать русский язык. Чингиз Айтматов и Касымкул Нанаев говорили: «Киргизский и русский языки – оба в моём сердце, а значит, и в ваших сердцах. Учите эти языки, берегите их, потому что у них большое будущее. Они помогут вам стать сильными и счастливыми»."},{"t":"p","h":"Хорошие, верные слова, которые сказаны от чистого сердца!"},{"t":"p","h":"В. Данилов."},{"t":"p","h":"Упражнение 372. Перепишите, дописывая окончания союзных слов. При этом обратите внимание на форму слов, к которым они относятся."},{"t":"p","h":"1. Данияр и Джамиля пошли к железнодорожному разъезду, за котор... начиналась широкая степь (Ч. Айтматов). 2. Жест, котор... пользуется артист на сцене, должен быть чётким и выразительным (К. Станиславский). 3. Молодые физики получили новое вещество, о котор... до этого никто не знал. 4. Юноши и девушки, котор... окончили техническое училище, стали квалифицированными токарями. 5. Мостовая, по котор... двигались войска, дрожала под тяжестью танков и самоходок (9. Казакевич). 6. Чинара пришила к платью кружева, котор... сама вязала."},{"t":"v","l":["<span class=\"pg\" data-n=\"253\">253<\/span>вещество – зат","технический – техникалык","квалифицированный – машыккан,","адистешкен","мостовая – тешеме жол","тяжесть – салмак"]},{"t":"p","h":"вязать кружева – тор согуу, токуу"},{"t":"p","h":"Упражнение 373. В следующие простые предложения вставьте другие простые предложения при помощи союзного слова который, употребляя его вместо выделенных слов."},{"t":"p","h":"Образец: Обломок, который оторвался от скалы, перегородил дорогу."},{"t":"p","h":"1. Обломок перегородил дорогу. Обломок оторвался от скалы. 2. Бегун значительно опередил соперников. Бегун упорно тренировался. 3. Машины уехали с поля. На машинах привезли удобрения. 4. Животные умеют безошибочно находить воду. Животные живут в пустыне. 5. Краска быстро высохла. Краской покрасили пол. 6. Сотрудники собрались в приёмной. Сотрудников вызвал заведующий на совещание. Словарь: значительно (намного) – бир далай"},{"t":"v","l":["опередить – чыгып кетуу","удобрения – жер семирткич","безошибочно – катасыз","наскоро – шашып-бушуп","сотрудник – кызматчы"]},{"t":"p","h":"Упражнбние 374. Перепишите. Подчеркните союзные слова и напишите над ними, какими членами предложения они являются и в каком падеже употреблены."},{"t":"p","h":"1. Русский язык, который мы изучаем, является одним из самых красивых и богатых языков мира. 2. Трудности и лишения, которые ожидали геологов, не испугали их."},{"t":"p","h":"3. Мастер, которого мы вызвали из телеателье, отремонтировал телевизор. 4. нашли серебряные украшения, которые древние модницы носили на шее и руках."},{"t":"p","h":"5. Войлок, которым кочевые народы укрывают юрты, не пропускает воду и холод. 6. Друг, к которому я пришёл за книгой, ждал меня у подъезда."},{"t":"v","l":["Словарь:","трудность – кыйындык войлок – кийиз","<span class=\"pg\" data-n=\"254\">254<\/span>лишение – айрылуу","телеателье – телеателье","подъезд – уйге кируучу эшик","украшение – жасалга"]},{"t":"p","h":"Упражнение 375. Перепишите. Союзные слова, взятые в скобки, поставьте в нужном падеже."}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[252,254]},{"title":"ЛЁТЧИК ЗАРЛЫК ИСМАНОВ.","blocks":[{"t":"h3","h":"ЛЁТЧИК ЗАРЛЫК ИСМАНОВ."},{"t":"p","h":"Самолёт летит над горами. Лётчик Зарлык Исманов уверенно ведёт самолёт над джайлоо, (который) расположено за снежными хребтами. В самолёте лежат продовольствие и тёплая одежда, (который) необходимы чабанам. Вот и пастбище, (который) Зарлык знает с детства. Здесь он работал помощником чабана. Здесь он первый раз увидел самолёт, (который) прилетел за больным. Потом Зарлык поступил в лётное училище. В училище он совершил первый полёт, о (который) мечтал много лет. Закончив училище, Зарлык вернулся в родной край."},{"t":"p","h":"Вот самолёт коснулся колёсами земли. Остановился мотор, и лётчик вышел из самолёта. Он увидел старых друзей, с (который) вместе когда-то работал в этих местах. Друзья спешили к самолёту."},{"t":"p","h":"По В. Иванову. Словарь;"},{"t":"p","h":"коснуться – тийуу"},{"t":"p","h":"Упражнение 376. Перепишите. В данных примерах союзное слово котбдрый вставьте вместо точек в начале или в середине придаточного предложения. Расставьте запятые."},{"t":"p","h":"1. Туристы ... вернулись ... из заграничной поездки рассказали о жизни итальянских рабочих. 2. Любовь к Родине ... горит .. в наших сердцах никогда не погаснет."},{"t":"p","h":"3. Сергей Есвнин о ... нам рассказал ... учитель написал прекрасные стихи о русской природе. 4. Состоялось собрание"},{"t":"p","h":"по постановлению ... началось строительство Дома культуры. 5. Рабочий подошёл к инженеру ... по указанию .. он изготовил деталь."},{"t":"p","h":"Словарь:"},{"t":"p","h":"заграничный чет элдик указание корсетме, буйрук"},{"t":"p","h":"<span class=\"pg\" data-n=\"255\">255<\/span>Упражнение 377. Составьте из следующих простых предложений сложноподчинённые предложения с союзным словом который."},{"t":"p","h":"Образец: Река, над которой летел самолёт, течёт к Аральскому морю."},{"t":"p","h":"1. Река течёт к Аральскому морю. Над рекой летел самолёт. 2. На площади открылась предпраздничная ярмар- 8.. Около площади построена многоэтажная гостиница. сияние продолжалось несколько минут. Полярное сияние наблюдали моряки. 4. Около озера паслись породистые лошади. Они принадлежали соседнему конезаводу. 5. Пришёл стекольщик. Он вставил новое стекло в раму. 6. Придаточное предложение выделяется запятыми с двух. сторон. Оно стоит в середине главного. 7. В шалаше лежал раненый Дубровский. Из шалаша вышла старуха."},{"t":"p","h":"Словарь: полярное сияние – тундук"},{"t":"v","l":["жаркырагы","породистый – асыл тукум","вставить – коюу","принадлежать – менчик, таандык"]}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[255,255]},{"title":"§ 68. ПРИДАТОЧНЫЕ ОПРЕДЕЛИТЕЛЬНЫЕ С СОЮЗНЫМИ СЛОВАМИ КАКОЙ, ЧЕЙ.","blocks":[{"t":"h3","h":"§ 68. ПРИДАТОЧНЫЕ ОПРЕДЕЛИТЕЛЬНЫЕ С СОЮЗНЫМИ СЛОВАМИ КАКОЙ, ЧЕЙ."},{"t":"p","h":"Вспомните:"},{"t":"p","h":"1. Какие предложения называются придаточными определительными?"},{"t":"p","h":"2. От чего зависит род, число и падеж союзного слова который в придаточных ‘определительных?"},{"t":"p","h":"3. Где ставится союзное слово который в придаточном определительном предложении?"},{"t":"p","h":"Придаточные определительные с союзным словом который служат в качестве определений. Если определение имеет дополнительный оттенок сравнения, уподобления, то в качестве союзного слова употребляется местоимение какой."},{"t":"p","h":"По щекам мальчика поползли блестящие капельки, какие бывают на окнах во время дождя (А.Чехов). В этом предложении капельки, которые поползли по щекам, сравниваются с дождевыми каплями."},{"t":"p","h":"<span class=\"pg\" data-n=\"256\">256<\/span>Правило употребления рода, числа и падежа союзного слова какой такое же, как и для союзного слова который."},{"t":"p","h":"В книжной рёчи используется иногда придаточное определительное предложение с союзным словом чей. Это союзное слово указывает, что предмет, названный в придаточном предложении после союзного слова, принадлежит предмету, названному в главном предложении перед союзным словом. Например: Касым задал этот вопрос учителю, чьи знания вызывали у негд глубокое уважение. В этом предложении союзное слово чьи показывает, что знания (существительное знания стоит после союзного слова чьи) принадлежат учителю (существительное учителю находится пвред союзным словом чьи). Род, число и падеж союзного слова чей зависят полностью от того слова, с которым союзное слово согласовано в придаточном предложении."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"1. В чём различие в значении придаточных определительных с союзными словами который и какой?"},{"t":"p","h":"2. Какой дополнительный оттенок придаёт придаточному определительному союзное слово какой?"},{"t":"p","h":"3. С чем согласуются в роде союзные слова который и какой?"},{"t":"p","h":"4. От чего зависит падеж союзных слов который и какой?"},{"t":"p","h":"5. С чем согласуется в числе союзное слово который?"},{"t":"p","h":"6. Что обозначает придаточное определительное с союзным словом чей?"},{"t":"p","h":"7. От чего зависят род, число и падеж союзного слова чей?"},{"t":"p","h":"Упражнение 378. Прочитайте. Устно замените союзное слово который словом какой? Укажите, как меняется значение предложения."},{"t":"p","h":"1. В зоопарке жили звери, которые встречаются только в южных странах. 2. Отец был одет в плотный бушлат, которые носят вобнные моряки. 3. В семье начались хлопоты, которые бывают при переезде с квартиры на квартиру."},{"t":"p","h":"4. Пароход, на котором обычно перевозят уголь или руду, медленно плыл по реке. 5. Ткани, которые выпускает Ошский комбинат, красивы и прочны."},{"t":"p","h":"<span class=\"pg\" data-n=\"257\">257<\/span>хлопоты – убара, машакат плотный – тыкыс обычно – ар качан бушлат – аскердик кыска чапан"},{"t":"p","h":"Упражнение 379. Перепишите. Подчеркните слова, от которых зависит род союзного слова какой. Определите, каким членом предложения является слово какой."},{"t":"p","h":"1. За час самолет пролетает расстояние, какое поезд проходит за сутки. 2. Гул, какой издают снежные лавины, слышен далеко в горах. 3. У людей появилась усталость, какая бывает после долгой ходьбы. 4. Телевизионный центр, какой построен |: Бишкеке, есть ив других городах страны."},{"t":"p","h":"5. Тело мальчика охватила дрожь, какая бывает после купания в холодной воде. 6. Горячее солнце, какое редко светит над тундрой, скрывалось за горизонтом. Словарь:"},{"t":"p","h":"дрожь – дирилдек, калтырак зависит падеж союзного слова какой. Определите, каким членом Упражнение 380. Спишите. Подчеркните слова, от которых предложения является это слово."},{"t":"p","h":"1. Яблоневые сады, какие растут |: Прииссыккулье, редко встретишь в других местах. 2. Садовник держал в руках лейку, из какой поливают цветы. 3. Командир подчинился приказу, о каком ему сообщил радист по рации."},{"t":"p","h":"4. Пушки, из каких стреляли наши предки, стоят около исторического музея. 5. Зоокомбинат разводит пушных зверей, какие хорошо размножаются в неволе."},{"t":"p","h":"Словарь:"},{"t":"p","h":"разводить – кебейтуп жиберу\\ неволя – темир тордо, капаста"},{"t":"p","h":"Упражнение 381. Перепишите, дописывая окончания союзного слова какой."},{"t":"p","h":"1. Все песни, как... мы знали, прозвучали на весеннем фестивале. 2. Районная газета писала об инициативе, как... проявили молодые шахтёры нашей области. 3. Цветы, из 2571 <span class=\"pg\" data-n=\"258\">258<\/span>как... девушки плетут венки, растут на лесных полянах."},{"t":"p","h":"4. Капкан, с как... мой дед ходил ловить барсов, висёл на стене сарая. 5. Белые курчавые, облака, как... предвещают ясную погоду, медленно плыли над горами. 6. Срок, до как... экспедиции разрешили быть в тайге, миновал."},{"t":"v","l":["Словарь:","инициатива – демилге","проявить инициативу – демилге","котеруу","курчавый – тармалданган","предвещать – алдын ала кабар","беруу","срок – меенет"]},{"t":"p","h":"Упражнение 382. Перепишите. Подчеркните союзное слово чей. Обозначьте стрелочками, что кому (чему?) принадлежит. Стрелочку направляйте в сторону предмета, которому принадлежит другой предмет. Объясните устно, чем определяется род, число и падеж союзного слова чей."},{"t":"p","h":"Образец: Мальчик, чей голос мы услышали издалека, заблудился в лесу. (Слово чей согласовано со словом голос в мужском роде, единственном числе, винительном падеже.)"},{"t":"p","h":"1. Мальчик, чей голос мы услышали издалека, заблудился в лесу. 2. Коршун, чья быстрая тень мелькнула над крышей, улетел в степь. 3. Зоя Космодемьянская, чьё мужество стало известно всему миру, была обыкновенной московской школьницей. 4. Моя мать, о чьей любви к морю я знал, мечтала увидеть меня морским офицером (К. Станюкович). 5. Бронзовая фигура поэта, чей голос призывал к борьбе за свободу, стоит на площади в центре Москвы."},{"t":"p","h":"6. Запорожские казаки, о чьих походах писал Гоголь, защищали русское государство с юга."},{"t":"p","h":"Упражнение 383. Из данных простых предложений составьте сложноподчинённые предложения с придаточными определительными и союзными словами который, какой, чей."},{"t":"p","h":"1. Из плодов шиповника медики изготовляют витамины. Шиповник растёт на склонах гор. 2. Дружной семьёй живут народы нашей республики. О такой семье мечтали Пушкин и Токтогул. 3. Чабаны выполнили обязательства. Их отары зимовали за перевалом. 4. Старший брат вернулся из города <span class=\"pg\" data-n=\"259\">259<\/span>в родное село. Со старшим братом я редко виделся. 5. Сайгаки двинулись к водопою. Их детёнышей мы видели в густой траве."},{"t":"v","l":["Словарь:","","склон – тоонун жантык бети видеться – керушуу"]}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[256,259]},{"title":"§ 69. ПРИДАТОЧНЫЕ С СОЮЗНЫМИ СЛОВАМИ ГДЕ, КУДА, КОГДА.","blocks":[{"t":"h3","h":"§ 69. ПРИДАТОЧНЫЕ С СОЮЗНЫМИ СЛОВАМИ ГДЕ, КУДА, КОГДА."},{"t":"p","h":"Повторить $ 55,56."},{"t":"p","h":"Вспомните:"},{"t":"p","h":"1. Какие предложения называются придаточными места?"},{"t":"p","h":"2. Какие предложения называются придаточными времени?"},{"t":"p","h":"3. Какие предложения называются придаточными определительными?"},{"t":"p","h":"4. К каким словам относятся придаточные определительные? Придаточные определительные предложения могут присоединяться к главному предложению при помощи союзных слов где, куда, когда и других. Такие придаточные обычно определяют в главном предложении существительные, которые обозначают место (пространство) или время: город, гора, равнина, страна, село, час, вторник, год и т.д. Напримёр: Пред ними стелится равнина, где ели изредка взошли (А. Пушкин). Оля отправилась в ту деревню, куда вчера уехала её мать. Настанет время, когда ты вырастешь и станешь работать на благо нашей Родины. В этих предложениях придаточные определительные со словами где, куда, когда определяют существительные равнина, деревня, время. Они отвечают на вопросы какой? какая? какое?"},{"t":"p","h":"От придаточных обстоятельственных они отличаются тем, что определяют существительные, употреблённые в главных предложениях."},{"t":"p","h":"Слова где, куда, когда употребляются в начале придаточного определительного, которое стоит сразу после определяемого существительного."},{"t":"p","h":"<span class=\"pg\" data-n=\"260\">260<\/span>Вопросы для повторения:"},{"t":"p","h":"1. При помощи каких союзов и союзных слов присоединяются придаточные определительные к главным предложениям?"},{"t":"p","h":"2. Каково значение придаточных определительных со словами где, куда, когда?"},{"t":"p","h":"3. Где ставятся в придаточных определительных слова где, куда, когда?"},{"t":"p","h":"Упражнение 384. Перепишите. Найдите придаточные определительные предложения с союзными словами где, куда, когда. На какие вопросы отвечают эти придаточные предложения?"},{"t":"p","h":"1. Наступит время, когда на всей планете люди будут дружно бороться за чистоту земли, воды и воздуха. 2. На избирательном участке, где проходили выборы в Жогорку Кенеш, собрались нарядно одетые люди. 3. Парк, куда мы часто ходим отдыхать, имеет образцовую чистоту. 4. Долина, где кочует мой отец с отарой, находится за перевалом."},{"t":"p","h":"5. День, когда Юрий Гагарин совершил космический полёт, советские люди запомнили на всю жизнь. 6. В деревне, куда уехал Пушкин, он написал много поэтических произведений."},{"t":"p","h":"7. На поляне, где отдыхали дети, росли синие колокольчики."},{"t":"p","h":"Словарь: нарядно одетый – кооз кийинген"},{"t":"v","l":["образцовый – улгулуу","кочевать – кечуу","поэтический – поэтикалык"]},{"t":"p","h":"Упражнение 385. Вставьте в сложноподчинённые предложения с придаточными определительными союзные слова где, куда, когда."},{"t":"p","h":"1. День, ... проходил военный парад, был тёплым и солнечным. 2. У высокого плетня, ... привела нас тропинка, росли жёлтые подсолнухи. 3. В приволжской степи, ... приземлился Гагарин, стоит величественный памятник."},{"t":"p","h":"4. Стройка, ... приехали молодые строители, находится на берегу горной реки. 6. Под деревом, ... журчал ручей, росли густые кусты смородины."},{"t":"p","h":"Словарь:"},{"t":"p","h":"плетень – чырпыктан согуп величественный – зангыраган"},{"t":"p","h":"жасалган тосмо"},{"t":"p","h":"<span class=\"pg\" data-n=\"261\">261<\/span>Упражнение 386. Из данных слов составьте сложноподчинеённые предложения с придаточными определительными."},{"t":"p","h":"1. Рыболов, знать, место, ловиться, крупный, рыба, где."},{"t":"p","h":"2. Наступить, день, друзья, встретиться, когда. 3. Кафе, мы, прийти, за мороженым, находиться, в, парк, куда."},{"t":"p","h":"4. Бригадир, ‘уехать, на, лечение, в, Крым, всегда, стоять, тёплый, погода, где. 5. В, город, приехать, иностранный, турист, есть, много, старый, памятник, куда."}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[260,261]},{"title":"§ 70. СЛОВА ТОТ И ТАКОЙ В ПРЕДЛОЖЕНИЯХ С ПРИДАТОЧНЫМИ ОПРЕДЕЛИТЕЛЬНЫМИ.","blocks":[{"t":"h3","h":"§ 70. СЛОВА ТОТ И ТАКОЙ В ПРЕДЛОЖЕНИЯХ С ПРИДАТОЧНЫМИ ОПРЕДЕЛИТЕЛЬНЫМИ."},{"t":"p","h":"Повторить $ 67, 68."},{"t":"p","h":"Вспомните:"},{"t":"p","h":"1. Какие предложения называются придаточными определительными?"},{"t":"p","h":"2. Какими союзными словами соединяются придаточные определительные с главными предложениями?"},{"t":"p","h":"3. Какой частью речи выражен обычно член предложения, к которому относится придаточное определительное?"},{"t":"p","h":"Для того чтобы подчеркнуть, к какому именно из существительных главного предложения относится придаточное определительное, это существительное может быть определено согласованными с ним в роде, числе и падеже указательными местоимбниями тот или такой. Тогда придаточное определительное раскрывает эти определения и относится к словам тот и такой. Слова тот и такой обычно предшествуют. определяемому существительному, а придаточное предложение выступает после этого существительного. Напри мер: Учитель задал на дом ту задачу, которую мы не успели решить в классе. В том городе, где живёт Шарипа, добывают железную руду. В школе устрбили такой праздник, каких давно не было."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"1. Какие предложения называются придаточными определительными?"},{"t":"p","h":"<span class=\"pg\" data-n=\"262\">262<\/span>2. Что определяют придаточные определительные предложения?"},{"t":"p","h":"3. Где ставятся придаточные определительные предложения?"},{"t":"p","h":"4. Какими союзными словами и союзами соединяются придаточные определительные предложения с главными предложениями?"},{"t":"p","h":"5. Для чего в сложноподчинённых предложениях с придаточными определительными употребляют местоимения-определения тот и такой?"},{"t":"p","h":"6. С чем согласуется род союзных слов который и какой? Т. От чего зависит падеж союзных слов который и какой?"},{"t":"p","h":"8. Где ставятся слова какой и где, куда, когда в придаточном определительном предложении?"},{"t":"p","h":"9. Когда союзное слово который ставится в начале придаточного определительного, а когда – не в начале?"},{"t":"p","h":"Упражнение 387. Перепишите. Подчеркните в главном предложении указательные местоимения тот, такой и те слова, к которым относятся придаточные определительные предложения."},{"t":"p","h":"1. Учёные сконструировали такие радиотелескопы, которые ловят сигналы из далёких глубин космоса. 2. Тот завод, где мы побывали на экскурсии, выпускает автомобили. 3. Автомобиль развил такую скорость, какую на перекрёстке опасно развивать. 4. Соболь притаился на той сосне, под которой лаяла собака. 5. Редактор подчеркнул те строки, которые сообщали о важном событии в нашей стране. 6. Асанбек надел такую же рубашку, какая была у Бектура."},{"t":"p","h":"Словарь:"},{"t":"p","h":"развить скорость – ылдамдыкты кучетуу строка жол, сап подчеркнуть – алдын сызуу"},{"t":"p","h":"Упражнение 388. Перепишите. Вместо точек в главном предложении впишите слова, к которым как определения относятся указательные местоимения тот, такой. Слова даны в конце упражнения."},{"t":"p","h":"Образец: Никогда не победить тот народ, который борется за свою свободу."},{"t":"p","h":"1. Никогда не победить тот который борется за свою свободу. 2. Автобус остановился на той ..., где расположена телестудия. 3. Бойцы пошли в такую дерзкую ..., какую враги <span class=\"pg\" data-n=\"263\">263<\/span>не ожидали. 4. Черноглазый Бечо приехал из такого ..., где растут мандарины и апельсины. 5. Марат смазал йодом ту"},{"t":"p","h":"на которой появилась мозоль. 6. Тот ..., когда закончилась Великая Отечественная война, старые солдаты помнят до сих пор. Т. На выставке особенно много людей было около тех .., которые привезли из Третьяковской галереи."},{"t":"p","h":"Слова для справок: народ, остановка, атака, край, ладонь, день, картина."},{"t":"p","h":"Словарь:"},{"t":"p","h":"расположиться – орун алуу, жайгашуу дерзкий – калтаарыбас"},{"t":"p","h":"Упражнение 389. Перепишите, согласуя указательные местоимения, взятые в скобки, с теми словами, определениями которых они являются."},{"t":"p","h":"Образец: Депутат рассказал избирателям о той работе, какую он проделал за полгода."},{"t":"p","h":"1. Депутат рассказал избирателям о (тот) работе, какую он проделал за полгода. 2. Конные скачки проводились в (такой) дни, когда люди были свободны от работы. 3. Мы любим (тот) землю, на которой родились и выросли. 4. На бзере поднялись (такой) сильные волны, какие бывают во время бури. 5. Мы вышли из машины возле (тот) переулка, где жили мои подруги. 6. В аквариуме плавали (такой) рыбки, какие бывают в южных морях."},{"t":"v","l":["Словарь:","переулок – чолок кече"]},{"t":"p","h":"Упражнение 390. Перепишите. Вместо точек в главном предложении вставьте указательные местоимения тот, такой в нужной форме."}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[262,263]},{"title":"В ГОРАХ.","blocks":[{"t":"h3","h":"В ГОРАХ."},{"t":"p","h":"Сняв рюкзаки, мы расположились на ... склоне, где росли крупные тюльпаны. Многие породы Баз деревьев, которые росли вдоль спуска, я впоследствии увидел в Ботаническом саду. Мимо нас прошли ребята из технического училища, с которыми мы вместе ехали в автобусе."},{"t":"p","h":"<span class=\"pg\" data-n=\"264\">264<\/span>Внизу под нами было видно ... озеро, на берегу которого шумела листвой берёзовая роща. Часто около ... места, где мы остановились на ночлег, проходили другие туристы. Действительно, это был ... великолепный уголок, какие будто специально созданы природой для отдыха."},{"t":"p","h":"Словарь:"},{"t":"p","h":"порода – урук, тукум впоследствии – кийин, акыры"},{"t":"p","h":"Упражнение 391. Прочитайте, добавляя окончания союзных слов, и перескажите текст."}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[264,264]},{"title":"НАРОДНЫЙ ГЕРОЙ.","blocks":[{"t":"h3","h":"НАРОДНЫЙ ГЕРОЙ."},{"t":"p","h":"Народы Средней Азии не забывают своего любимого сказочного героя, котор... защищал бедных, боролся за правду и справедливость. Там, где появлялся этот человек, радовались бедняки и дрожали от страха богачи."},{"t":"p","h":"Много лет путешествовал Ходжа Насреддин по родной земле, на котор... росли пышные сады и благоухали ‚розы. Но в городах и кишлаках, в караван- сараях и на шумных базарах – везде видел он нужду и бесправие простых людей, с котор... делил последний кусок хлеба."},{"t":"p","h":"Вот и сейчас подъехал Ходжа Насреддин к Бухаре, в котор... не был много лет. Ловко проскользнув мимо стражников, он появился на городской площади. Здесь собралось много людей, котор... были сильно опечалены. Богатый и жирный купец кричал на горшечника Нияза, у котор... не было денег отдать долг. Купец требовал, чтобы Нияз отдал ему свою единственную дочь. Старый горшечник плакал от горя. Тогда Ходжа Насреддин снял свою тюбетейку и стал просить деньги для бедняка. Ходжа распевал весёлую песенку, в котор... высмеивал жадность и глупость богача. Люди громко смеялись и бросали в тюбетейку монеты."},{"t":"p","h":"Расплатившись с купцом, Ходжа Насреддин отдал остальные монеты обрадованному Ниязу, сел на ишака и поехал дальше по улицам Бухары."},{"t":"p","h":"По В. Соловьёву."},{"t":"p","h":"Словарь:"},{"t":"p","h":"благоухать – анкуу проскользнуть – билинбей жылып киру\\у"},{"t":"p","h":"<span class=\"pg\" data-n=\"265\">265<\/span>Упражнение 392. Перепишите. Вместо точек поставьте союзное слово который в начале или в середине придаточного предложения."},{"t":"p","h":"1. На кухне стоял холодильник, ... родители ... купили в рассрочку. 2. История, ... рассказал ... мой дед, произошла в годы гражданской войны. 3. На свет костра прибежали шакалы, ... противно ... выли в ночной темноте. 4. Бригада, ... полностью обеспечила ... кормами скот, получила премию."},{"t":"p","h":"5. Археблоги нашли кости животных, ... существовали ... несколько тысяч лет назад."},{"t":"v","l":["Словарь:","купить в рассрочку – акчасын бир","нече жолу белуп телее шарты","менен сатып алуу","происходить – болуу","противно – жаман","существовать – жашоо","обеспечить – камсыз кылуу"]},{"t":"p","h":"Упражнение 393. Прочитайте. Выпишите сначала сложносочинённые, а затем – сложноподчинённые предложения. Расставьте знаки препинания. Подчеркните союзы и союзные слова. Определите типы придаточных предложений."}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[265,265]},{"title":"ПЕРВЫЙ ТРАКТОР.","blocks":[{"t":"h3","h":"ПЕРВЫЙ ТРАКТОР."},{"t":"p","h":"Когда мы организовали колхоз городские рабочие подарили нам трактор. Утром все жители села собрались там где стоял чёрный четырёхколёсный жук. На тракторе сидел Исмайл который окончил курсы трактористов. Зарокотал мотор и трактор тронулся с места. Люди испуганно отступили назад потому что они первый раз видели машину. К трактору прицепили плуг и Исмаил за час вспахал большое поле. Седобородые аксакалы важно ехали по вспаханному полю. Они убедились в том что один трактор заменит в работе целый табун лошадей. Все были рады и взволнованы, но счастливее всех был в этот день Исмаил. Он стоял на тракторе и слёзы катились из его глаз. А плакал Исмаил потому что на берегах Иссык-Куля начиналась новая жизнь. Из воспоминаний старого колхозника."},{"t":"p","h":"Словарь:"},{"t":"p","h":"зарокотать – дуулдай баштоо важно – салаваттуу тур менен"},{"t":"h3","h":"<span class=\"pg\" data-n=\"266\">266<\/span>§71. БЕССОЮЗНЫЕ СЛОЖНЫЕ ПРЕДЛОЖЕНИЯ. БЕССОЮЗНЫЕ СЛОЖНЫЕ ПРЕДЛОЖЕНИЯ."},{"t":"v","l":["(Байламтасыз татаал","","Повторить $ 48 – 50.","Вспомните:","1. Какие предложения называются сложными?"]},{"t":"p","h":"2. Какие предложения называются сложносочинёнными?"},{"t":"p","h":"3. Какие предложения называются сложноподчинёнными?"},{"t":"p","h":"4. Как связаны простые предложения в составе сложносочинённого предложения?"},{"t":"p","h":"5. Как связаны придаточные предложения с главными в составе сложноподчинённого?"},{"t":"p","h":"Простые предложения могут для выражения одной сложной мысли соединяться друг с другом в сложном предложении и без союзов. В таких сложных предложениях не устанавливают, зависит ли одно предложение от другого или же они равноправны. Когда нет союзов, нельзя сказать, с каким мы имеем дело: сложносочинённым или сложноподчинённым. Сложные предложения, состоящие из нескольких простых, не соединённых союзами, носят название бессоюзных сложных предложений. Например: Катятся ядра, свищут пули, нависли хладные штыки (А. Пушкин). Кто кивер чистил весь избитый, кто штык точил, ворча сердито, кусая длинный ус (М. Лермонтов)."},{"t":"p","h":"В сложное бессоюзное предложение могут входить простые предложения, в которых говорится о событиях, которые совершаются одновременно, совместно. Сказуемые простых предложений, входящих в такого рода бессоюзные сложные предложения, стоят обычно в одинаковом времени. Например: Ножи стучат, посуда звенит, масло шипит (А. Чехов). Метель не утихала, небо не прояснялось (А. Пушкин). Уж небо осенью дышало, уж реже солнышко блистало, короче становился день ... (А. Пушкин)."},{"t":"p","h":"Бессоюзные сложные предложения могут объединять в себб простые предложения, которые сообщают о событиях, <span class=\"pg\" data-n=\"267\">267<\/span>происходящих постепенно, последовательно, одно за другим. Например: Кусты зашевелились, взлетела птичка (В. Гаршин)."},{"t":"p","h":"В этих видах бессоюзных сложных предложений на письм6 между простыми предложениями ставится запятая. Кроме них бывают в русском языке и другие смысловые отношения между простыми предложениями, входящими в состав сложного бессоюзного предложения."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"1. Как называются сложные предложения, в которых простые предложения не соединяются союзами?"},{"t":"p","h":"2. Какая смысловая связь может быть между простыми предложениями, входящими в состав бессоюзного сложного предложения?"},{"t":"p","h":"3. Какие знаки препинания ставятся в бессоюзных сложных предложениях, 6сли в простых предложениях говорится о событиях одновременных или последовательных?"},{"t":"p","h":"Упражнение 394. Перепишите. Найдите бессоюзные сложные предложения. Подчеркните в простых предложениях, входящих в состав бессоюзного предложения, подлежащие одной чертой, сказуемые – двумя."},{"t":"p","h":"1. Лошади тронулись, колокольчик зазвенел, кибитка"},{"t":"p","h":"(А. Пушкин). 2. Наступило утро, и Тарас Бульба с сыновьями отправился в путь (Н. Гоголь). 3. Жужжат пчёлы, летают бабочки, голубые стрекозы мелькают над водой. 4. Собака залаяла, и раненая птица встрепенулась в кустах. 5. Тепловоз дал сигнал, поезд тронулся, за окнами вагона замелькали телеграфные столбы. 6. Корабль вышел из порта, и штурман отметил на карте его путь. 7. Взошло солнце, рассвялся туман, в высокой траве засверкала роса. Словарь:"},{"t":"p","h":"встрепенуться – талпынуу рассеяться (о тумане) – таркоо отметить – белгилее"},{"t":"p","h":"Упражнение 395. Перепишите, расставляя запятые. Укажите, когда происходят действия в бессоюзном сложном предложении: одновременно или последовательно одно за другим."},{"t":"p","h":"<span class=\"pg\" data-n=\"268\">268<\/span>1. По бескрайней степи отгуляли метели отшумела в оврагах вода журавли из-за моря домой прилетели пастухи выгоняют стада (М. Исаковский). 2. Сияет луна шумит камыш ветер морщит поверхность воды (В. Кожевников)."},{"t":"p","h":"3. Прозвенел третий звонок зрители заняли свои места спектакль начался. 4. За окном цветёт вишня шумят листвой молодые яблони весело щебечут ласточки. 5. Командир отдал приказ взлетела красная ракета загрохотали пушки бойцы приготовились к атаке. 6. Текут полноводные реки шумят плодородные степи."},{"t":"p","h":"Словарь:"},{"t":"p","h":"бескрайний – чексиз щебетать – сайроо морщить – тырыштыруу"},{"t":"p","h":"Упражнение 396. Перепишите, расставляя знаки препинания."},{"t":"p","h":"1. Скоро закончится учебный год дети будут отдыхать на природе. 2. Всадник быстро скакал к комбайнам густая пыль поднималась над дорогой. 3. Война закончилась старые солдаты стали возвращаться в аил. 4. Дюйшен ремонтировал школу мы помогали ему. 5. Танабай работал в кузнице молотобойцем Чоро был тогда председателем колхоза."},{"t":"p","h":"6. Костёр горел на краю оврага старый конь лежал на земле Танабай прощался со свойм верным другом. 7. Данияр пел грустную песню Джамиля молча слушала эту мелодию."},{"t":"p","h":"8. Мальчик торопился к реке пёс Балтек бежал за ним следом."},{"t":"p","h":"По Ч. Айтматову."},{"t":"p","h":"Упражнение 397. Перепишите. Уберите союз и, образуя сложные бессоюзные предложения, расставьте запятые."},{"t":"p","h":"1. Дверь отворилась и из кабинета вышел озабоченный Кутузов. 2. Оркестр играет гимн и государственный флаг Кыргызской Республики медленно поднимается вверх."},{"t":"p","h":"3. Павел подал Тоне руку и они побежали к железнодорожным мастерским. 4. Отпуск закончился и отдохнувшие шахтёры вернулись к своим рабочим местам. 5. Луна скрылась за облаками и всадники ехали наугад по бесконечному полю."},{"t":"v","l":["<span class=\"pg\" data-n=\"269\">269<\/span>озабоченный – кам керген","государственный – мамлекеттик","медленно – акырын, жай","наугад – болжоп"]},{"t":"p","h":"Упражнение 398. Взяв по одному предложению из каждого столбика, составьте такие бессоюзные сложные предложения, чтобы действия простых предложений происходили одновременно, совместно. Расставьте запятые."},{"t":"p","h":"Образец: Учитель объясняет новую тему, ученики внимательно слушают, в классе стоит тишина."},{"t":"p","h":"1. Учитель объяс- 1. Сталевары из руды полу-"},{"t":"v","l":["няет новую","1. В классе стоит","тишина.","тему. чают металл."]},{"t":"p","h":"2. Шахтёры добы- 2. Ученики внимательно слувают руду."},{"t":"p","h":"шают."},{"t":"p","h":"3. Барсы питаю- 3. Первые авто-"},{"t":"p","h":"тся мясом."},{"t":"p","h":"бусы едут по улицам."},{"t":"p","h":"4. Солнце подни- 4. Олени любят сочную траву. мается над городом."},{"t":"p","h":"2. Рабочие из ме-"},{"t":"p","h":"талла изготовляют машины."},{"t":"p","h":"3. Малыши с ро-"},{"t":"p","h":"дителями спешат в детский сад."},{"t":"p","h":"4. Цапля глотает"},{"t":"p","h":"лягушек."},{"t":"p","h":"Упражнение 399. Расставьте запятые. Переведите на кыргызский язык. Закройте русский текст. Сделайте обратный перевод. Сравните по учебнику."},{"t":"p","h":"Пугачёв вышел из саней народ снял шапки. Пугачёв остановился и поздоровался один из старшин подал ему мешок с деньгами он стал метать монеты пригоршнями. Люди с криком бросились подбирать деньги некоторые получили увечье. Пугачёва окружили главные сообщники между ними стоял и Швабрин."},{"t":"p","h":"По А. Пушкину."},{"t":"p","h":"Словарь:"},{"t":"p","h":"метать – чачуу увечье – майып болуу пригоршня – кош ууч"}],"sub":[{"title":"§71. БЕССОЮЗНЫЕ СЛОЖНЫЕ ПРЕДЛОЖЕНИЯ. БЕССОЮЗНЫЕ СЛОЖНЫЕ ПРЕДЛОЖЕНИЯ.","b":4}],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[266,269]},{"title":"ПРЯМАЯ И КОСВЕННАЯ РЕЧЬ.","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"270\">270<\/span>ПРЯМАЯ И КОСВЕННАЯ РЕЧЬ."},{"t":"p","h":"(Тике жана кыйыр с63.)"},{"t":"h3","h":"§ 72. ПРЯМАЯ РЕЧЬ."},{"t":"v","l":["(Тике сез.)","Повторить $5 1.","Вепомните:","1. Что такое предложение?"]},{"t":"p","h":"2. Припомните русские глаголы, которые обозначают речь человека."},{"t":"p","h":"3. Какой член предложения называется подлежащим?"},{"t":"p","h":"4. Какой член предложения называется сказуемым?"},{"t":"p","h":"Когда мы говорим или пишем, нередко возникает необходимость передать чужую речь. Чужую речь можно передать в русском языке, совсём не изменяя. Такая передача чужой речи без изменений называется прямой речью. Прямая речь сопровождается словами говорящего, автора, которые указывают, кому принадлежит прямая речь. Например: Осмон сказал: «Завтра я пойду гулять в парк». Прямая речь в этом примере точно передаёт то, что сказал Осмон."},{"t":"p","h":"Слова автора, вводящие прямую речь, как правило, содержат подлежащее, указывающее кому принадлежит прямая речь, и сказуемое. Сказуемое часто бывает выражено глаголами, обозначающими речь: говорить, сказать, спросить, закричать, рассказать, воскликнуть, ответить и др. Например: Девочка спросила: «Ты сегодня будешь в библиотеке?». Слова автора здесь: Девочка спросила. Подлежащее слов автора – девочка. Оно указывает, кому принадлежит прямая речь, то есть кто говорит. Сказуемое спросила указывает на характер прямой речи (вопрос). Слова автора иногда содержат также определения, обстоятельства, дополнения. Например: Высокая девочка серьёзно спросила Кенеша: «Ты сегодня будешь в библиотеке?». Определение высокая определяет подлежащее, уточняет, какой девочке принадлежит прямая речь. Обстоятельство серьёзно уточняет, каким образом был задан вопрос. Дополнение Кенеша указывает, кому был задан вопрос."},{"t":"p","h":"Прямая речь и слова автора по-разному могут быть расположены по отношению друг к другу. В кыргызском <span class=\"pg\" data-n=\"271\">271<\/span>языке слова автора стоят чаще всего после прямой речи или разрываются: подлежащее стоит до прямой речи, а сказуемое – после прямой речи. Слова автора в русском языке могут стоять перед прямой речью, в середине её и после прямой речи. Наприм ер:"},{"t":"v","l":["1. Осмон сказал: «Я пойду в парк».","2. «Я, – сказал Осмон, – пойду в парк».","3. «Я пойду в парк», – сказал Осмон."]},{"t":"p","h":"Если слова автора стоят перед прямой речью, то подлежащее в них стойт сказуемым. Если слова автора стоят после прямой речи, то в них, наоборот, сначала стоит сказуемое, а потом – подлежащее. Наприме р: Ваня спросил: «Где моя книга?». «Где моя книга?» – спросил Ваня. Вопросы для повторения:"},{"t":"v","l":["1. Что такое прямая речь?","2. На что указывают слова автора?"]},{"t":"p","h":"3. Какими словами часто бывает выражено сказуемое слов автора?"},{"t":"p","h":"4. Где располагаются слова автора по отношению к прямой речи в русском языке?"},{"t":"p","h":"5. Как расположены подлежащее и сказуемое слов автора, когда они стоят до прямой речи?"},{"t":"p","h":"6. Как расположены подлежащее и сказуемое слов автора, стоящих после прямой речи?"},{"t":"p","h":"Упражнение 400. Спишите. Подчеркните подлежащее в словах автора одной чертой, а сказуемое – двумя."},{"t":"p","h":"1. Однажды отец сказал Султанмурату: в город возьму?» (Ч. Айтматов). 2. «Да здравствуют рабочие люди всех стран!» – громко крикнул Павел (М. Горький)."},{"t":"p","h":"3. Бригадир Орозмат предупредил Джамилю: «Утром повезёшь зерно на станцию» (Ч. Айтматов). 4. «Что же ты не едешь?» – спросил я ямщика (А. Пушкин). 5. Перед казнью Зоя Космодемьянская гордо крикнула: «Никогда враги не победят советский народ!». 6. «Комсомол послал меня учить ваших детей», – твёрдо сказал Дюйшен (Ч."},{"t":"p","h":"Т. «Я никогда не забуду мою клятву», – ответил Павел и крепко пожал руки своих друзей (Н. Островский)."},{"t":"p","h":"Упражнение 401. Спишите, вставляя вместо точек пропущенные сказуемые в словах автора."},{"t":"p","h":"<span class=\"pg\" data-n=\"272\">272<\/span>1. Павел ...: «В субботу у меня будут гости из города»."},{"t":"p","h":"2. «Надо послать бойцов в разведку», -... командир."},{"t":"p","h":"3. Участники художественной самодеятельности ...: «На праздничном концерте мы покажем новую пьесу». 4. «Завтра будет прекрасная погода», – ... синоптики. 5. «На празднике всем будет весело!» – затейники. 6. Приехав в незнакомый город, гражданин ...: «Где находится гостиница?»."},{"t":"p","h":"Слова для справок: сказать, решить, пообещать, предсказать, предупредить, спросить."},{"t":"p","h":"Словарь:"},{"t":"h3","h":"затейник оюн башчы"},{"t":"p","h":"Упражнение 402. Перепишите. В следующих предложениях вставьте слова автора до и после прямой речи."},{"t":"p","h":"Образец: Карабек спросил: «На каком этаже ты живёшь?». «На каком этаже ты живёшь?» – спросил Карабек."},{"t":"p","h":"1. «На каком этаже ты живёшь?». 2. «Да здравствует свобода и равенство всех народов!». 3. «На днях будет контрольная работа по физике». 4. «Завтра выпустим праздничный номер стенгазеты». 5. «Будем примерными в учёбе и поведении». 6. «Вырастим высокий урожай кукурузы». 7Т. «Отчего бывают землетрясения?»."},{"t":"p","h":"Слова для справок: воскликнул комиссар, спросил Карабек, пообещали члены редколлегии, предупредила учительница, решили комсомольцы, постановили на собрании колхозники, поинтересовался Керим."},{"t":"p","h":"Упражнение 403. Выпишите из текста по литературному чтению (по указанию учителя) шесть предложений с прямой речью."}],"sub":[{"title":"§ 72. ПРЯМАЯ РЕЧЬ.","b":2}],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[270,272]},{"title":"§ 73. ЗНАКИ ПРЕПИНАНИЯ ПРИ ПРЯМОЙ РЕЧИ.","blocks":[{"t":"h3","h":"§ 73. ЗНАКИ ПРЕПИНАНИЯ ПРИ ПРЯМОЙ РЕЧИ."},{"t":"v","l":["(Тике сезге коюлуучу тыныш белгилер.)","Повторить 8 1-4.","Вспомните:","1. Что называется прямой речью?","2. На что указывают слова автора?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"273\">273<\/span>3. Где могут стоять слова автора по отношению к прямой речи? При передаче прямой речи на письме её ставят в кавычки («Кавычки ставятся до и после прямой речи. Если прямая речь содержит вопрос, то в конце её ставится вопросительный знак и после этого закрываются кавычки. Если прямая речь – восклицательное предложение, то после неё ставится восклицательный знак, а потом – кавычки. Прямая речь всегда начинается с заглавной буквы. Наприме р: Старая Толгонай говорила: «Каждый человек на земле должен быть счастливым». Учитель спросил: «Кто сегодня дежурный?» «Да здравствует разум!» – воск. лицал Пушкин."},{"t":"p","h":"Если слова автора стоят перед прямой речью, то после них (перед прямой речью) ставится двоеточие. Наприм ер: Кадыр написал на доске: «Мы боремся за мир»."},{"t":"p","h":"Если слова автора стоят после прямой речи, то перед ними (после прямой речи) ставится тире. Слова автора начинаются в этом случае с маленькой буквы (даже если прямая речь имеет в конце восклицательный или вопросительный знак). Например: «Да здравствует солнце!» = писал Пушкин. «Сторона мне знакомая», – ответил дорожный."},{"t":"p","h":"Если прямая речь является повествовательным предложением, то, когда она стоит после слов автора, в конце предложения ставится точка. Например: Серёжа сообщил: «Вчера был запущен новый космический корабль- спутник»."},{"t":"p","h":"Если прямая речь – повествовательное предложение, но стойт перед словами автора, то в конце прямой речи ставится запятая и тире. Например: «Вчера был запущен новый космический корабль-спутник»,— сообщил Серёжа."},{"t":"p","h":"Схёма знаков препинания при прямой речи. А) Слова автора перед прямой речью."},{"t":"p","h":"Слова автора: Прямая речь"},{"t":"p","h":"<span class=\"pg\" data-n=\"274\">274<\/span>Б) Слова автора после прямой речи."},{"t":"p","h":"Прямая речь слова автора К Вопросы для повторения:"},{"t":"p","h":"1. Как называется передача чужой речи без изменений?"},{"t":"p","h":"2. Каким знаком выделяется прямая речь?"},{"t":"p","h":"3. Какие знаки ставятся после прямой речи, представляющей собой вопрос?"},{"t":"p","h":"4. Какой знак ставится после слов автора, перед прямой речью?"},{"t":"p","h":"5. Какие знаки ставятся после прямой рёчи повествовательного предложения: 1) когда прямая речь стоит после слов автора, в конце предложения; 2) когда прямая речь стоит до слов автора, в начале предложения?"},{"t":"p","h":"6. Какие знаки ставятся после прямой речи, являющейся восклицательным предложением?"},{"t":"p","h":"7. Какой знак ставится после прямой речи перед словами автора?"},{"t":"p","h":"8. С какой буквы пишется прямая речь?"},{"t":"p","h":"9. С какой буквы пишутся слова автора после прямой речи?"},{"t":"p","h":"Упражнение 404. Перепишите. Объясните постановку знаков препинания."},{"t":"p","h":"1. Известный путешественник Николай Пржевальский говорил: «В жизни я больше всего люблю путешествовать»."},{"t":"p","h":"2. «Вставай, подымайся, рабочий народ!» – тихо Павел (М. Горький). 3. Французский писатель Ромен Роллан писал: «В Советской стране живут замечательные люди»."},{"t":"p","h":"4. «Трусы и предатели вызывают всеобщее презрение»,- записала в своём дневнике Уля Громова. 5. Токтогул советовал кыргызским школьникам: «Любите и изучайте русский язык». 6. «Скоро люди полетят к далёким планетам» предсказал учёный Эдуард Циолковский. 7. Аалы Токомбаев ответил: «Пушкин стал мойм любимым поэтом»."},{"t":"p","h":"Словарь:"},{"t":"p","h":"всеобщий – жалпы, текши презрение – жек керуу"},{"t":"p","h":"Упражнение 405. Перепишите, расставляя знаки препинания."},{"t":"p","h":"1. Наши заграничные друзья говорят Мы восхищаемся прекрасными произведениями Чингиза Айтматова. 2. С нетерпением жду твоего приезда в отпуск сказала мать сыну <span class=\"pg\" data-n=\"275\">275<\/span>по телефону. 3. Газета «Сельская жизнь» писала Объе-"},{"t":"p","h":"мелких хозяйств принесло большую пользу."},{"t":"p","h":"4. Сколько осталось патронов спросил обиженный Артёмка (В. Мирошниченко). 5. Вечером бабушка молилась и шептала Пусть сыновья мой живут в мире и согласии (М. Гбрький). 6. Тоня спросила у Павки Ты любишь читать книги? 7. Полёт проходит нормально сообщил из космоса Юрий Гагарин."},{"t":"v","l":["Словарь:","восхищаться – кубануу, суктануу","нетерпение – чыдамсыздык","объединение – бириктиру\\","обиженный – ызаланган,","таарынган","молиться – дуба кылуу,","чокунуу","жить в мире и согласии","(жить дружно) – достукта,","ынтымакта жашоо"]},{"t":"p","h":"Упражнение 406. Выпишите из текста по литературному чтению (по указанию учителя) пять предложений с прямой речью перед словами автора."},{"t":"p","h":"Упражнение 407. Выпишите из художественного произведения (по указанию учителя) пять предложений с прямой речью после слов автора."},{"t":"p","h":"Упражнение 408. Перепишите, расставляя пропущенные знаки препинания. (Прямая речь выделена жирным шрифтом)."},{"t":"p","h":"1. Ты любишь плавать спросил Чаргын у собеседника."},{"t":"p","h":"2. Да, я очень люблю плавать ответил Болот. 3. Чаргын, улыбнувшись, подтвердил это большое удовольствие. 4. Тогда, подумав, Болот предложил Давайте летом организуем туристический поход вокруг Иссык-Куля. 5. Чаргын охотно согласился Это было бы замечательно! 6. В ближайшие дни начнём подготовку к походу договорились юные друзья."},{"t":"p","h":"Упражнение 409. По данным схемам составьте сами предложения с прямой и словами автора.. | Слова автора"},{"t":"v","l":[". | Слова автора","Слова автора",".","«Прямая речь",". «Прямая речь |?» -",". «Прямая речь |! -","«| Прямая речь |».","Прямая речь |","Прямая речь","У.","слова автора.","слова автора.","слова автора."]}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[273,275]},{"title":"§ 74. КОСВЕННАЯ РЕЧЬ.","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"276\">276<\/span>§ 74. КОСВЕННАЯ РЕЧЬ."},{"t":"v","l":["(Кыйыр с6з.)","Повторить $ 63 – 65.","Вспомните:","","1. Что называется прямой речью?"]},{"t":"p","h":"2. О чём говорится в придаточном изъяснительном предложении с союзами что, будто, чтобы?"},{"t":"p","h":"3. Какие глаголы, обозначающие речь человека, часто бывают сказуемыми главных предложений в сложноподчинённых предложениях с придаточными изъяснительными?"},{"t":"p","h":"Чужую речь передают в русском языке не только абсолютно точно, используя прямую речь, но и с некоторыми изменениями. Такой тип передачи чужих слов называется косвенной речью. При помощи косвенной речи передают повествовательные предложения, вопросы. Если чужая речь – восклицательное предложение, её лучше передать в форме прямой речи. При переводе прямой речи в косвенную образуется сложноподчинённое предложение с придаточным изъяснительным. Главное предложение в нём обычно содержит слова автора, его сказуемым служат часто глаголы, обозначающие речь, мысль: сказать, спросить, говорить, ответить, подтвердить, подумать, написать и т. д. Придаточное изъяснительное предложение передаёт содержание чужой речи. Соединяется оно с главным предложением при помощи союзов что, будто, чтобы или при помощи союзных слов, являющихся вопросительными словами в чужой речи. Сравните, например, прямую и косвенную речь."},{"t":"p","h":"Прямая речь."},{"t":"v","l":["«Завтра будет хорошая","погода», – сказал дедушка."]},{"t":"p","h":"Дедушка сказал: «Завт-"},{"t":"v","l":["ра будет хорошая погода».","Косвенная речь.","Дедушка сказал, что","завтра будет хорошая","погода."]},{"t":"p","h":"Примечание. Вопросительный знак в конце косвенной речи, содержащей вопрос, не ставится. Кавычками косвенная речь не выделяется."},{"t":"p","h":"<span class=\"pg\" data-n=\"277\">277<\/span>Вопросы для повторения:"},{"t":"p","h":"1. Как передаётся чужая речь при помощи косвенной речи?"},{"t":"p","h":"2. Что содержит главное предложение в сложноподчинённом предложении, передающем косвенную речь? Какие глаголы в нём употребляются?"},{"t":"p","h":"3. Что передаёт придаточное предложение в сложноподчинеённом предложении с косвенной речью?"},{"t":"p","h":"4. Как соединяются главное и придаточное предложения в сложноподчинённом предложении с косвенной речью?"},{"t":"p","h":"Упражнение 410. Перепишите. Подчеркните сказуемые в главных предложениях. Что обозначают эти глаголы?"},{"t":"p","h":"1. Метелица на допросе заявил, что он не скажет ни слова. 2. Люба вошла с чемоданом в сообщила: «Меня к вам на квартиру поставили». 3. Девочка удивлённо спросила Любу, кто поставил её на квартиру. 4. «Ты что тут делаешь?» – удивленно спросил этот человек. 5. Олег доложил, что деятельность подпольной комсомольской организации идёт по плану. 6. Люди говорили, будто эти листовки распространяют парашютисты. Лютиков спросил юношу: «Ты сумеешь перейти линию фронта и вернуться назад?»."},{"t":"p","h":"8. Серёжа Тюленин попросил, чтобы ему разрешили взорвать немецкий штаб."},{"t":"p","h":"По А. Фадееву. Словарь:"},{"t":"p","h":"деятельность – иш-аракет суметь – мында: колдон келуу"},{"t":"p","h":"Упражнение 411. Перепишите, расставляя знаки препинания. Подчеркните союзы и союзные слова, входящие в косвенную речь."},{"t":"p","h":"1; Выступившие на митинге рабочие заявили что они горячо поддерживают, решение стачечного комитета. 2. Из газет мы узнали когда начинаются вступительные экзамены |: техникумы. 3. Сталевар подробно объяснил как из руды получается металл. 4. Начальник экспедиции дважды повторил где должны встретиться обе группы геологов. 5. Мы спросили у знакомого метеоролога почему понизилось давление воздуха. 6. Роза попросила чтобы родители купили ей магнитофон. Старики говорят будто нынешняя зима будет морозной и многоснежной."},{"t":"p","h":"давление – басым <span class=\"pg\" data-n=\"280\">280<\/span>. Придаточные изъяснительные с союзными словами кто, что Сложноподчинённые предложения с придаточными определи-"},{"t":"v","l":["тельными","Придаточные определительные с союзным словом который","","Прид   function lsGet(k, def) { try { var v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }

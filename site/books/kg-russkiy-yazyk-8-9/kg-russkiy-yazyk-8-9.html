 по отношению к другому слову."},{"t":"p","h":"Слова бывают связаны между собой двумя способами. Первый способ – сочинение, сочинительная связь. Этим способом связывают слова, которые равноправны, не зависят друг от друга. Например: в нашем предложении два равноправных подлежащих мальчики и девочки. Они связаны между собой по способу сочинительной связи."},{"t":"p","h":"Другой способ – подчинение, подчинительная связь. По этому способу связываются слова, одно из которых зависимое – зависит от другого, основного. Таким образом, при связи подчинения одно, подчинённое, слово подчинено другому слову, которое является главным. Так, например, в нашем предложении сказуемое учатся зависит от подлежащих мальчики и девочки. Подлежащие употреблены во множественном числе, и сказуемое надо употребить тоже во множественном числе. А если бы подлежащее было в единственном числе (мальчик), то и сказуемое надо было бы поставить в единственном числе (учится)."},{"t":"p","h":"Значит, число сказуемого зависит в нашем примере от числа подлежащего. Это и есть подчинительная связь."},{"t":"p","h":"Два или больше самостоятельных слова, связанных между собой по способу сочинительной или подчинительной связи, называются сочетанием слов."},{"t":"p","h":"В нашем примере можно найти такие сочетания слов:"},{"t":"p","h":"1. Мальчики и девочки. 2. Мальчики и девочки учатся."},{"t":"p","h":"3. Учатся в школе. 4. Учатся вместе."},{"t":"p","h":"Самостоятельные слова в составе сочетания могут соединяться как при помощи служебных слов (например, <span class=\"pg\" data-n=\"26\">26<\/span>сочетания 1 и 3), так и без их помощи (например, сочетание 4)."},{"t":"p","h":"Предложения строятся из сочетаний слов. Иногда одно сочетание слов может составить предложение (в нашем примере – второе сочетание слов)."},{"t":"p","h":"Задание. Добавив слова и поставив их в нужной форме, составьте сочинительные и подчинительные сочетания."},{"t":"p","h":"1. Друзья и .... 2. Интересоваться .... 3. Честно и ...."},{"t":"p","h":"4. Добиться .... 5. Красили и .... 6. Познакомиться с ...."},{"t":"p","h":"7. Фрукты и .... 8. Подъехать к .... 9. Отъехать от ...."},{"t":"p","h":"10. Опасаться .... 11. Задуматься о .... 12. Инженеры и ...."},{"t":"p","h":"13. Обменяться .... 14. Вкусный и ...."},{"t":"p","h":"Упражнение 32. Выпишите сначала сочетания слов, составленные по способу а потом – по способу подчинения."},{"t":"p","h":"1. Животноводы и полеводы Таласа заключили договор о соревновании. 2. Широкая автострада сократила путь от Бишкека до Оша. 3. Мы подготовились к празднику песен и танцев. 4. На перекрёстке горит светофор. 5. Отец и сын пошли вместе в театр. 6. Школьный кабинет получил новое оборудование взамен старого. 7. Школьники помогают инвалидам и старикам. 8. Мой старший брат вступил в общество охраны природы."},{"t":"v","l":["Словары:","договор – келишим","оборудование – жабдуулар","взамен – ордуна","вступить – кируу"]},{"t":"p","h":"Упражнение 33. Составьте предложения из данных сочетаний слов."},{"t":"p","h":"Образец: Одуванчики росли; жёлтые одуванчики; росли на поляне. – Жёлтые одуванчики росли на поляне."},{"t":"p","h":"1. Шмель перелетал; мохнатый шмель; перелетал с цветка на цветок. 2. Насекомые звенели; звенбли в траве; в густой траве. 3. Дятел стучал; одинокий дятел; стучал торопливо; стучал по сосне. 4. Бермет изучает; настойчиво изучает; изучает русский язык. 5. Учительница изложила; <span class=\"pg\" data-n=\"27\">27<\/span>убедительно изложила; изложила материал; новый материал."},{"t":"p","h":"Словарь:"},{"t":"p","h":"одуванчик – каакым убедительно – ишенердик кылып одинокий – жалгыз"},{"t":"p","h":"Упражнение 34. Составьте пять сочетаний слов из существительных, связанных по способу сочинительной связи."},{"t":"p","h":"Упражнение 35. Составьте из следующих пар сочетания слов, связанные по способу подчинения."},{"t":"p","h":"Образец: Заниматься, рукоделие. – Заниматься рукоделием."},{"t":"p","h":"1. Заниматься, рукоделие. 2. Интересоваться, живопись."},{"t":"p","h":"3. Сообразительный, ученики. 4. Мальчик, огорчиться."},{"t":"p","h":"5. Песчаный, почва. 6. Наш, поколение. 7. Пятый, бригада."},{"t":"p","h":"8. Идти, издалека. 9. Больной, челюсть."},{"t":"v","l":["Словары:","рукоделие – колго жасалган оймо, сайма, токуу","огорчаться – капа болуу","песчаный – кумдуу","почва – жер, топурак, кыртыш","издалека – алыстан"]},{"t":"p","h":"Упражнение 36. В следующих сочетаниях слов замените выделенные слова другими словами, которые даны в конце упражнения. Поставьте их в нужной форме."},{"t":"p","h":"1. Выписать журнал. 2. Рассказать торопливо. 3. Пожилой гражданин. 4. Загорать около озера. 5. Танцевать вальс. 6. Положить на стол. 7. Любимый артист. 8. Возразить другу."},{"t":"p","h":"Слова для справок: выразительно, гражданка, газета, полька, отдыхать, полка, артистка, подруга. Словарь:"},{"t":"p","h":"загорать – кунге куйуу возразить – каршы суйлее"},{"t":"p","h":"Упражнение 37. Составьте сочетания слов, подбирая к словам левого столбика слова из правого столбика и ставя их в нужной форме."},{"t":"p","h":"<span class=\"pg\" data-n=\"28\">28<\/span>Образец: Я фотографирую. Рисовать красками."},{"t":"raw","h":"<h4 class=\"mk\">я русло писатель рисовать ответ изучаю увидеть известный – белгилуу<\/h4>"},{"t":"v","l":["известный","фотографировать","красками","широкий","систематически","точный","наяву","Словарь:","точный – дал, так","русло (реки) – сай, нук, суунун сайы наяву – онде","систематически – системалуу турде, дайым"]},{"t":"p","h":"Упражнение 38. Составьте сочетания слов, выбирая подходящий из парбнимов к предложенному прилагательному."},{"t":"p","h":"1. Солнечн... затмение – затемнение. 2. Высок... мачта – матч. 3. Досадн... опечатка – отпечаток. 4. Прозрачн... родник – рудник. 5. Зимн... буран – бурун. 6. Стеклянн... ампула – амплуа."},{"t":"v","l":["Словарь:","амплуа – тип ролей, исполняемых актёром"]},{"t":"h3","h":"§ 10. СОГЛАСОВАНИЕ."},{"t":"v","l":["(Ээрчишуу.)","","Вспомните:","1. Какие члены предложения вы знаете?","2. Какая связь называется подчинительной?"]},{"t":"p","h":"Слова по-разному зависят друг от друга. Существуют различные виды подчинительной связи слов. Согласование – один из видов подчинительной связи."},{"t":"p","h":"В кыргызском языке сказуемое обычно согласуется с подлежащим в числе и лице. Например: Мен келдим. Сен келдин. Окуучулар келишет. Слово келдим имеет ту же форму числа и лица, что и слово мен, от которого оно зависит. В русском языке сказуемое тоже согласуется с <span class=\"pg\" data-n=\"29\">29<\/span>подлежащим. Например: Я иду. Ты идёшь. Ученики приходят."},{"t":"p","h":"Но в русском языке согласуется не только сказуемое с подлежащим, но и определение с определяемым словом. Например: весёлый школьник, весёлая школьница, весёлые школьники."},{"t":"p","h":"В русском языке согласование состоит в том, что зависимое слово ставится в том же числе, падеже, лице, что и слово, к которому оно относится. Например, в предложении Я пишу сказуемое пишу стоит в том же числе и лице, что и подлежащее я: в единственном числе, первом лице. В сочетании слов хороший ученик определение хороший стоит в том же (именительном), числе (единственном), роде (мужском), что и слово ученик, к которому оно относится."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"1. Чем отличается подчинительная связь от сочинительной?"},{"t":"p","h":"2. Какая связь слов называется подчинительной?"},{"t":"p","h":"3. Как согласуется зависимое слово со словом, к которому оно относится?"},{"t":"p","h":"4. Какие члвны предложения согласуются в русском языке?"},{"t":"p","h":"Упражнение 39. Перепишите. Подчеркните слова, согласующиеся с существительными в роде, числе и падеже. Укажите, какими частями речи они выражены."},{"t":"p","h":"1. В хрустальной вазе стоял букет из весенних цветов."},{"t":"p","h":"2. Наш отец купил старшему брату ботинки сорок второго размера. 3. Над старым диваном висел портрет моей матери."},{"t":"p","h":"4. Носильщик вынес тяжёлый чемодан из одиннадцатого вагона. 5. Рыжая голова Климки мелькнула около соседской калитки. 6. Разведчики пролезли под колючей проволокой и затаились в старом окопе. 7. Султанмурат надел зелёную фуражку, купленную отцом на предпраздничной ярмарке."},{"t":"p","h":"Словарь:"},{"t":"p","h":"размер – эелчем затаиться – беожейуп жашынуу носильщик – жук ташуучу киши"},{"t":"p","h":"<span class=\"pg\" data-n=\"30\">30<\/span>Упражнение 40. Перепишите. Согласуйте слова, данные в скобках, с основными словами."},{"t":"h3","h":"КОМПЬЮТЕР."},{"t":"p","h":"Что такде компьютер, объяснять никому не надо. Это такая штука, чтобы играть в (игра), набирать и красиво оформлять и распечатывать любые (текст), хранить в его памяти (информация), рисовать (картинка) и (мультфильм), записывать и исполнять (музыка), писать письма по (электронная почта), изучать иностранные (язык) и многое, многое другое. Когда я вырасту, я обязательно куплю компьютер."},{"t":"p","h":"Упражнение 41. Прочитайте вслух. Правильно читайте выделенные слова. Найдите согласованные определения."},{"t":"h3","h":"ПАТРИОТЫ."},{"t":"p","h":"Патриоты – это те, кто горячо любит свою Родину, свой народ. Они всегда готовы отдать свои силы и жизнь борьбе за счастье народа. Патриотов не испугают никакие трудности, никакие жертвы."},{"t":"p","h":"Великими патриотами были Пушкин и Тыныстанов, Маяковский и Токтогул. В годы Великой Отечественной войны тысячи патриотов совершили подвиги. Рядом с именем Александра Матросова записано имя Чолпонбая Тулебердиева. Русский паренёк и кыргызский джигит героически погибли за свободу народа. Их верность Родине и народу была сильнее смерти."},{"t":"p","h":"Молодые патриоты доблестно трудятся на заводах и фабриках. Они выращивают хлеб и пасут скот. Патриоты всегда идут впереди. Будьте и вы, ребята, патриотами своей страны!"},{"t":"p","h":"Словарь:"},{"t":"p","h":"жертва – курман верность – берилгендик героически – баатырдык"},{"t":"h3","h":"<span class=\"pg\" data-n=\"31\">31<\/span>§ 11. СОГЛАСОВАНИЕ В ЧИСЛЕ."},{"t":"p","h":"(Сан боюнча ээрчишуу.)"},{"t":"p","h":"Вспомните:"},{"t":"p","h":"1. Какая связь между словами называется согласованием?"},{"t":"p","h":"2. В чём согласуются зависимые слова со словами, к которым они относятся?"},{"t":"p","h":"При связи согласования зависимое слово ставится в том же числе, что и слово, к которому оно относится."},{"t":"p","h":"Стол стоит. Ученики пишут. Лес растёт. Большая книга. Новые дома."},{"t":"p","h":"Примечание. В отличие от кыргызского языка, в русском языке, если сказуемое-подлежащее обозначает много предметов, но употреблено в единственном числе, сказуемое тоже употребляют обычно в единственном числе. Например: Дружный народ не бойтся невзгод. Слово народ в этом предложении обозначает много людей, но употреблено в единственном числе. Значит, и сказуемое надо употребить в единственном числе."},{"t":"p","h":"Определение согласуется в роде с существительным, к которому оно относится. Напри мер: Наша школа. Городской парк. Открытое окно."},{"t":"p","h":"В кыргызском языке определение с существительным не согласуется."},{"t":"p","h":"Если изменить число главного слова, то надо изменить и число зависимого слова. Напри мер: Наш класс – наши классы. Городской парк – городские парки. Я пришёл домой – мы пришли домой."},{"t":"v","l":["Вопросы для повторения:","1. Какие члены предложения согласуются в числе?"]},{"t":"p","h":"2. Что произойдёт с согласованным зависимым словом, если изменить число главного слова?"},{"t":"p","h":"Упражнение 42. Спишите. Подчеркните согласованные зависимые слова. Сверху надпишите число согласованного слова."},{"t":"p","h":"1. Знаменосец шёл впереди полка. 2. Знаменосцы несли боевые знамёна. 3. Крупный осколок гранаты ранил бойца."},{"t":"p","h":"<span class=\"pg\" data-n=\"32\">32<\/span>4. Крупные осколки гранаты повредили пулемёт. 5. Санитар вынес раненого бойца с поля. 6. Санитары быстро перевязали всех раненых воинов. 7. Хищник охотится за оленем."},{"t":"p","h":"8. Хищники преследуют стада."},{"t":"v","l":["Словарь:","знаменосец туу алып журуучу","осколок – сынык","выносить – алып чыгуу","воин – аскер"]},{"t":"p","h":"Упражнение 43. Из данного т6кста выпишите попарно существительные и глаголы, которые согласуются. Укажите, в чём они согласованы."},{"t":"h3","h":"ЗИМОЙ НА ИССЫК-КУЛЕ."},{"t":"p","h":"Резкий улан дует из Боомского ущелья. Ветер бросает в лицо хлопья снега и мелкие камешки. Огромные волны поднимаются на озере. Катера причаливают к берегу. Птицы укрываются от ветра в кустарнике."},{"t":"p","h":"Но люди, несмотря на ненастье, не унывают. Жарко пылает в печах уголь, горят дрова. Так пройдёт несколько дней. Ветер утихнет, Снова засияет на небе ласковое солнце. По А. Забирову. Словарь: резкий – катуу"},{"t":"v","l":["улан – ветер, дующий из","Боомского ущелья","хлопья снега – кардын лапылдагы","унывать – чегу\\","пылать – жалындап куйуу"]},{"t":"p","h":"Упражнение 44. Перепишите, согласовывая зависимые слова, взятые в скобки, с основными словами в числе, а где нужно – ив роде."},{"t":"p","h":"Образец: Мягкие пушинки снега падают на землю."},{"t":"p","h":"1. (Мягкий) пушинки снега (падать) на землю. 2. Мы (мирный) люди, но наш бронепоезд (стоять) на (запасный) пути. 3. (Полярный) станция непрерывно (передавать) сведения о погоде. 4. (Молодой) поэты (прочитать) свои стихи пбред рабочими (горно-металлургический) комбината."},{"t":"p","h":"5. (Столичный) школьники (осмотреть) в Узгене (древний) памятник. 6. (Наш) школьная библиотека получила (новый) <span class=\"pg\" data-n=\"33\">33<\/span>книги. 7. На (производственный) собрании Болот подробно (рассказать) автобиографию."},{"t":"p","h":"Словарь:"},{"t":"p","h":"непрерывно узгултуксуз древний – байыркы"},{"t":"p","h":"Упражнение 45. Просклоняйте в единственном и множественном числе слова причёска и артерия. Подчеркните окончания падежей."},{"t":"p","h":"Словарь:"},{"t":"p","h":"причёска чачтын еруму, артерия – курее тамыр"},{"t":"p","h":"таралышы"}],"sub":[{"title":"§ 10. СОГЛАСОВАНИЕ.","b":49},{"title":"КОМПЬЮТЕР.","b":67},{"title":"ПАТРИОТЫ.","b":70},{"title":"§ 11. СОГЛАСОВАНИЕ В ЧИСЛЕ.","b":76},{"title":"ЗИМОЙ НА ИССЫК-КУЛЕ.","b":95}],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[25,33]},{"title":"§ 12. СОГЛАСОВАНИЕ В ЛИЦЕ.","blocks":[{"t":"h3","h":"§ 12. СОГЛАСОВАНИЕ В ЛИЦЕ."},{"t":"p","h":"Вспомните:"},{"t":"p","h":"1. В чём состоит связь согласования?"},{"t":"p","h":"2. Какие члены предложения согласуются в русском языке и с какими словами они согласуются?"},{"t":"p","h":"Как и в кыргызском языке, сказуемое в русском языке согласуется с подлежащим в лице. Это значит, что если подлежащее выражено личным местоимением, то глагол-сказуемое ставится в том же лице, что и подлежащее. На – пример: Я пишу заметку в стенгазету. После уроков ты пойдёшь домой? Мы готовимся к смотру художественной самодеятельности. Она играет на темир комузе."},{"t":"p","h":"Следует помнить, что в прошедшем времени глаголы в лице не согласуются. Если подлежащее выражено существительным, то глагол-сказуемое ставится в третьем лице. Например: Ветер утихает. Механизаторы ремонтируют сельскую технику."},{"t":"v","l":["Вопросы для повторения:","1. Какие члены предложения согласуются в числе?","2. Какой член предложения согласуется в лице?"]},{"t":"p","h":"3. В каком лице употребляется глагол-сказуемое при подлежащем-существительном?"},{"t":"p","h":"Упражнение 46. Перепишите. Согласуйте слова, взятые в скобки, с основным словом в лице и числе. Глаголы, взятые в скобки, поставьте в настоящем или будущем времени."},{"t":"p","h":"<span class=\"pg\" data-n=\"34\">34<\/span>Образец: Айгуль отсутствует по уважительной причине."},{"t":"p","h":"1. Айгуль (отсутствовать) по уважительной причине."},{"t":"p","h":"2. Жёлтые листья (осыпаться) с тополей. 3. На будущей недбле в нашем доме мастер (установить) газовую плиту."},{"t":"p","h":"4. Геологи (обнаружить) новое месторождение олова. 5: Собрание (постановлять) провести субботник по уборке территории завода. 6. Я (организовать) хоровой кружок. Т. Лесник (задыхаться) от густого дыма, но выносит из огня лосёнка. 8. Через глухую тайгу (пройти) железнодорожный путь."},{"t":"v","l":["Словарь:","обнаружить – таап алуу","олово – калай","постановлять – токтом чыгаруу","организовать – уюштуруу","задыхаться – мууну, куйугу\\","лосёнок (от лось) – багыштын","музоосу","глухая тайга – калын токой"]},{"t":"p","h":"Упражнение 47. Спишите. Слова, взятые в скобки, согласуйте в лице и числе с основным словом."},{"t":"p","h":"1. В Нарыне (состояться) областная профсоюзная конференция. 2. Я всегда (заступаться) за младшего брата."},{"t":"p","h":"3. Художник (изображать) на картине отдыхающих трактористов. 4. Террористы (отступать) под натиском воинов."},{"t":"p","h":"5. Фашисты (выстрелить) из пушки, но (промахнуться)."},{"t":"p","h":"6. Мы (наблюдать) солнечное затмение. 7. Ты (разучить) новое стихотворение."},{"t":"p","h":"Словарь:"},{"t":"p","h":"заступаться – болушуу натиск – кысым, катуу чабуул изображать – элесин, селекетун промахнуться – жаза атуу"},{"t":"p","h":"тузуу затмение – тутулуу отступать – чегинуу"},{"t":"p","h":"Упражнение 48. Перепишите. Слова, взятые в скобки, согласуйте с основным словом в лице и числе. Глаголы поставьте в настоящем времени."},{"t":"p","h":"1. Меньшинство на собрании (подчиняться) большинству. 2. Джамиля (интересоваться) историей родного <span class=\"pg\" data-n=\"35\">35<\/span>аила. 3. Молодые берёзки (клониться) к земле от сильного ветра. 4. В середине сквера (стоять) бронзовый памятник."},{"t":"p","h":"5. Опытные пловцы (искать) жемчуг на дне моря. 6. Разведчик (прислушиваться) к ночным шорохам."},{"t":"v","l":["Словарь:","подчиняться – баш ийуу","интересоваться – кызыгуу,","жакшы керуу","клониться – ийилу\\","жемчуг – бермет","прислушиваться – кулак салуу,","тыншоо"]},{"t":"p","h":"Упражнение 49. Назовите личные местоимения первого, второго и третьего лица. Просклоняйте личное местоимение первого лица в единственном числе, второго лица – во множественном числе, третьего лица – в обоих числах."}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[34,35]},{"title":"§ 13. СОГЛАСОВАНИЕ В РОДЕ И ПАДЕЖЕ.","blocks":[{"t":"h3","h":"§ 13. СОГЛАСОВАНИЕ В РОДЕ И ПАДЕЖЕ."},{"t":"v","l":["Повторить род существительных.","Вспомните:","1. Что такое сочетание слов?"]},{"t":"p","h":"2. Какие члены предложения согласуются в русском языке?"},{"t":"p","h":"3. В чём согласуются слова в русском языке?"},{"t":"p","h":"В отличие от кыргызского языка, существительные в русском языке имеют грамматический род. Слово стол, например, мужского рода, слово парта – женского рода, а слово окно – среднего рода."},{"t":"p","h":"Прилагательные, причастия, некоторые местоимения, порядковые числительные (и числительные один, два, оба), а также глаголы в прошедшем времени согласуются с существительными в роде. Это значит, что они употребляются в форме того же рода, что и существительные. Например: Большой стол. Окрашенная парта. Наше окно. Седьмой класс. Две девочки. Учитель вошёл в класс."},{"t":"p","h":"Таким образом, в роде согласуются определение (с определяемым существительным) и сказуемое, выраженное глаголом в прошедшем времени или кратким прилагательным (с подлежащим). Например: Я читаю интересную книгу. Кубанычбек написал стихотворение. Ночь тиха. Река глубока."},{"t":"p","h":"<span class=\"pg\" data-n=\"36\">36<\/span>Кроме того, определение согласуется с определяемым существительным в падеже, т.е. стоит в том же падеже, что и существительное. Например: почётный ветеран, почётного ветерана, почётному ветерану и т.д. Если изменяется падеж существительного, то должен измениться и падеж определения."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"Какие окончания бывают у существительных женского рода? Какие окончания бывают у существительных среднего рода?"},{"t":"p","h":"‚ Какие окончания бывают у существительных мужского рода? ‚ Какие части рёчи согласуются с существительными в роде? ‚ Какие члёны предложения согласуются в роде?"},{"t":"v","l":[". Какие числительные согласуются в роде?",". Какие формы глагола согласуются в роде?"]},{"t":"p","h":"0 о Назовите несколько местоимений, которые согласуются в роде."},{"t":"p","h":"9. С какой частью прилагательные, причастия и местоимения согласуются в роде и падеже?"},{"t":"p","h":"10. Что происходит с определением при изменении падежа определяемого существительного?"},{"t":"p","h":"11. В чём (кроме рода и падежа) согласуется определение с определяемым существительным?"},{"t":"v","l":["12. В чём согласуется сказуемое с подлежащим?","13. Какие члены предложения согласуются?"]},{"t":"p","h":"Упражнение 50. Перепишите. Согласованные зависимые слова подчеркните. Укажите, в чём согласованы зависимые слова с основными."},{"t":"h3","h":"ДЕДУШКИНЫ СКАЗКИ."},{"t":"p","h":"Зимним вечером дед рассказывает мне сказки. За деревянной стеной нашего дома бушует непогода. Морозный ветер раскачивает голые деревья. Мне страшно и радостно. Я ложусь поближе к дедушке. Его редкая борода щекочет мне шею. Дед рассказывает сказки тихим голосом. Сначала он рассказал сказку про маленького Чыпалака. Чыпалак победил глупого волка. Потом дедушка рассказывает грустную сказку. Но самая любимая моя сказка – про Рогатую мать-олениху."},{"t":"p","h":"По Ч. Айтматову."},{"t":"v","l":["<span class=\"pg\" data-n=\"37\">37<\/span>бушевать (о непогоде) – алай-дулей","тушуу","голый – жыланач","редкий – сейрек","щекотать – кытыгылоо,","кытыгы келтир\\у"]},{"t":"p","h":"Упражнение 51. Перепишите, согласуя слова, поставленные в скобки."},{"t":"p","h":"1. (Наш) школа. 2. (Весь) группа. 3. (Спортивный) куртка. 4. (Почищенный) ботинки. 5. (Десятый) неделя."},{"t":"p","h":"6. (Ватный) одеяло. 7. (Мой) шуба. 8. С (одна) книгой."},{"t":"p","h":"9.С (ваш) сестрой."},{"t":"p","h":"Упражнение 52. Подберите к данным основным словам подходящие зависимые слова. Согласуйте их и впишите вместо точек."},{"t":"p","h":"1... здание. 2. ... жажда. 3. ... цветы. 4. ... опыт. 5. ... поколение. 6. ... ткань. Т. ... нация. 8. ... ливень. 9. ... страница. 10. ... волнение. 11. ... почва. 12. ... зеркало. 183. ... аппетит. 14. ... будущее. 15. ... конура."},{"t":"p","h":"Упражнение 53. Выпишите из предложений сочетания слов, связанных по способу согласования, подчеркните зависимые слова и определите, в чём согласовано зависимое слово с основным?"},{"t":"h3","h":"В КОМПЬЮТЕРНОМ КЛАССЕ."},{"t":"p","h":"Представители Международной организации подарили нашей школе новые компьютеры. Компьютер – это сложный прибор, величайшее достижение человеческой мысли. Изучив работу компьютера, можно составить программу развития человеческого общества, выполнять задания по русскому языку."},{"t":"p","h":"И вот первые двенадцать компьютеров установили в просторном классе. Учитель физики Николай Семёнович объясняет нам устройство этих таинственных аппаратов. Мы взволнованно нажимаем кнопки – и засветились голубые экраны. Потом появились первые цифры, первые буквы..."},{"t":"p","h":"Пройдёт несколько месяцев упорной учёбы, и мы станем мастерами компьютерной техники."},{"t":"p","h":"В. Данилов."},{"t":"p","h":"<span class=\"pg\" data-n=\"38\">38<\/span>Упражнение 54. Выпишите сочетания слов, связанных по способу согласования. Укажите, в чём согласованы зависимые слова с основными."},{"t":"p","h":"Образец: 1. Зелёной чертой – род, число, падеж."},{"t":"p","h":"2. Ложится след – число. 3. Ваших ног – род, число, падеж."},{"t":"p","h":"1. Зелёной чертой ложится след ваших ног. 2. Быстро сохнет трава. 3. Небо темнеет по краям. 4. Сквозь густые кусты вы спускаетесь на дно оврага. 5. Под самым обрывом таится источник. 6. Вы бросаетесь на землю, вы напились. 7. Вдали темнеет поспевающая рожь. 8. Узкими полосками краснеет гречиха."},{"t":"p","h":"По И. С. Тургеневу. Упражнение 55. Подберите к существительным определения и согласуйте их."},{"t":"p","h":"Существительные: грузовик, условие, дедушка, седина, арбуз, привет, задание, подвиг, автобиография, поколение, телеграмма, аппетит, бригада."},{"t":"p","h":"Определение: первый, хороший, срочный, спелый, дружеский, трудный, славный, мой, добрый, наш, мощный, важный, ранний."},{"t":"v","l":["Словарь:","","условие – шарт","срочный – шашылыш","дружески – достук менен","мощный (сильный) – кучтуу"]},{"t":"p","h":"Упражнение 56. Подберите к существительным глаголы-сказуемые и согласуйте их с существительными."},{"t":"p","h":"Существительные: снежинки, лес, собрание, трещина, огонь, скорлупа, палец, стена, мальчик, луна."},{"t":"p","h":"Глаголы-сказуемые: щуриться, сиять, распухнуть, рухнуть, разбиться, пылать, расшириться, постановить, опустеть, падать."},{"t":"v","l":["Словарь:","трещина – жарака, сынык","скорлупа – кабык","щуриться – жулжуйу\\","распухнуть – шишип кетуу","рухнуть – жыгылуу"]},{"t":"p","h":"<span class=\"pg\" data-n=\"39\">39<\/span>Упражнение 57. Подберите определения к следующим существительным. Согласуйте их в роде и числе."},{"t":"p","h":".. план; ... шинель; .. дата; ... писатель; ... ураган; ... подушка; ... спорт; ... отопление; ... случай; ...стремление; ... парень; ... графин;"},{"t":"p","h":"Слова для справок: генеральский, генеральный, знаменитый, знаменательный, жёсткий, жестокий, водяной, водный, единичный, единый, разбитый, разбитной."},{"t":"p","h":"Словарь:"},{"t":"p","h":"разбитной (0 человеке) – бойкий развязный – шалаакы киши"},{"t":"p","h":"Упражнение 58. Просклоняйте следующие сочетания слов. Внешняя политика; священный долг; народное образование; способные ученики; голубая даль."},{"t":"p","h":"Словарь:"},{"t":"raw","h":"<h4 class=\"mk\">внешний – сырткы священный – ыйык Вепомните:<\/h4>"},{"t":"p","h":"образование билим способный – жендемдуу"},{"t":"h3","h":"§ 14. ПРИМЫКАНИЕ."},{"t":"p","h":"(Ыкташуу.)"},{"t":"p","h":"Какие есть виды связи между словами?"},{"t":"p","h":"По способу примыкания связываются с подчиняющими словами неизменяемые слова: наречия, деепричастия, неопределённая форма глагола."},{"t":"p","h":"Примыкание такой вид подчинительной связи, при котором зависимое слово связывается с главным лишь по смыслу. Например: Соня, улыбаясь, читала письмо или: Соня быстро читала письмо. Слова улыбаясь и быстро зависят по смыслу от глагола читала. Они связаны с ним по способу примыкания. В предложении Я вышел прочитать записку зависимое слово прочитать зависит от слова вышел, связано с ним по способу примыкания."},{"t":"p","h":"<span class=\"pg\" data-n=\"40\">40<\/span>Примечание: Сами неизменяемые слова, которые примыкают, могут управлять другими словами. В предложении Я вышел прочитать записку слово прочитать примыкает к слову вышел (от которого зависит по смыслу) и управляет словом записку (требует винительного падежа этого слова)."},{"t":"p","h":"В кыргызском языке связь примыкания встречается чаще, чем в русском. В русском языке примыкают только неизменяемые слова (наречие, деепричастие, неопределённая форма глагола). Подчиняющим словом при связи примыкания является глагол, наречие или имя прилагательное. Например: делал быстро, очень скоро, очень хороший."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"1. Что называется подчинительной связью между словами?"},{"t":"p","h":"2. В чём состоит связь примыкания?"},{"t":"p","h":"3. Какие слова примыкают?"},{"t":"p","h":"4. Какие слова являются главными при связи примыкания? Упражнение 59. Спишите. Найдите связь примыкания. Подчеркните примыкающие слова."},{"t":"h3","h":"ГРОЗА В ЧУЙСКОЙ ДОЛИНЕ."},{"t":"p","h":"Неожиданно послышались раскаты грома. Из ущелья справа выползла тяжёлая туча. Извиваясь, сверкали молнии. Холодный ветер высоко поднял над дорогами пыль, стал раскачивать деревья. Вот крупные капли дождя тяжело застучали по листьям виноградника. Тревожно замычали"},{"t":"p","h":"Испуганно закудахтали под навесом куры. Июньский ливень стал щедро поить водой поля, сады, виноградники. В вечерней тьме, громыхая, шумела гроза. А утром из-за гор, улыбаясь, выглянуло солнце. Ненастье прекратилось."},{"t":"p","h":"По К. Баялинову."},{"t":"p","h":"Словарь: раскаты грома – кун куркуреенун"},{"t":"v","l":["жанырыгы","виноградники – жузумдук","тревожно – коркунучтуу","кудахтать – какылдоо","щедро – марттык кылып","тьма – карангы"]},{"t":"p","h":"<span class=\"pg\" data-n=\"41\">41<\/span>Упражнение 60. Допишите в предложениях вместо точек примыкающие слова. Подберите по смыслу из списка в конце упражнения."},{"t":"p","h":"Производственный план завод выполнил ...."},{"t":"p","h":"2. Требуется сейчас выпускать ... больше промышленных изделий, чем пять лет назад. 3. Передовики нашего завода стали ... главное внимание качеству выпускаемой продукции."},{"t":"p","h":"4. Новосёлы организовали ... детскую площадку. 5. ... был виден новый микрорайон. 6. Школьники обязаны ... школьное оборудование. Т. Дети лежали, ... на солнце."},{"t":"p","h":"Слова для справок: беречь, гораздо, загорая, издали, летом, уделять, успешно."},{"t":"p","h":"Словарь:"},{"t":"p","h":"промышленные изделия – енер жай новосёлы – жаны конушка буюмдары"},{"t":"v","l":["изделие – иштеп чыгарган буюм","кечуп келген кишилер","гораздо – алда канча"]},{"t":"p","h":"Упражнение 61. Переведите на русский язык. Подчеркните слова, связанные по способу примыкания. Объясните, почему кыргызское слово жакшы при переводе на русский язык связывается то по способу примыкания, то по способу согласования."},{"t":"p","h":"1. Мектепке кеп адам келди. 2. Директор мыкты окуучуларга сыйлык тапшырды. 3. Алыстан жаны машиналарды алып келди. 4. Самолет ете бийик учту. 5. Балдар эртен китепканада болушат. 6. Алар жаны, кызыктуу китептерди алышат. 7. Биз жыйналышты жакшы 8. Кечээ окуучулар жакшы китепти окушту."}],"sub":[{"title":"ДЕДУШКИНЫ СКАЗКИ.","b":18},{"title":"В КОМПЬЮТЕРНОМ КЛАССЕ.","b":29},{"title":"§ 14. ПРИМЫКАНИЕ.","b":55},{"title":"ГРОЗА В ЧУЙСКОЙ ДОЛИНЕ.","b":67}],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[36,41]},{"title":"§ 15. УПРАВЛЕНИЕ.","blocks":[{"t":"h3","h":"§ 15. УПРАВЛЕНИЕ."},{"t":"v","l":["(Башкаруу.)","","Повторить склонение существительных.","","Вспомните:","1. Какая связь называется подчинительной?","2. В чём состойт согласование?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"42\">42<\/span>В сочетании слов пишу пером слова связаны по способу управления. При связи управления управляющее, главное, слово требует, чтобы зависимое, управляемое, слово было употреблено в том или ином падеже. В нашем примере пишу требует творительного падежа существительного, которое обозначает орудие."},{"t":"v","l":["пером","пишу авторучкой","мелом"]},{"t":"p","h":"Глагол пишу может требовать и другого падежа, например, винительного:"},{"t":"v","l":["письмо","пишу записку","диктант"]},{"t":"p","h":"При связи согласования в русском языке, если изменяется главное слово, то изменяется и согласуемое слово (карандаш коричневый, карандаши коричневые, карандашей коричневых и т.д.). При связи управления изменение главного, управляющего, слова не требует изменения зависимого, управляемого, слова."},{"t":"v","l":["Например:","писать","чем? что?"]},{"t":"raw","h":"<h4 class=\"mk\">пишу писали пишут напишет перепишет<\/h4>"},{"t":"v","l":["(тв.п.)","пером","записку"]},{"t":"p","h":"Управляющее слово требует только определённого падежа управляемого слова, но не влияет на его число и род. В качестве управляемых слов обычно употребляются имена существительные, местоимения и имена числительные. В качестве управляющих слов выступают чаще всего глаголы, имена существительные и имена числительные."},{"t":"v","l":["<span class=\"pg\" data-n=\"43\">43<\/span>Вопросы для повторения:","1. В чём состоит связь управления?","2. Чем управляет управляющее слово у зависимого?","3. Какие слова обычно являются управляемыми?","4. Какие части рёчи управляют другими словами?","Словарь:","управляющее слово – башкаруучу сез","управляемое слово – башкарылуучу сез"]},{"t":"p","h":"Упражнение 62. Перепишите. Основное слово подчеркните одной чертой, а зависимое – двумя чертами. Напишите падеж управляемого слова."},{"t":"p","h":"1. Солнце скрылось за облаками. 2. Осенние дожди не помешали уборке. 3. Герасим уложил щенка на кровать."},{"t":"p","h":"4. Ночью он долго возился с собачкой. 5. Герасим накормил щенка молоком и хлебом. 6. Железнодорожник спустился с насыпи. Т. Издалека приближался к станции поезд."},{"t":"p","h":"8. Пдезд двигался с большой скоростью. 9. Жёлтые листья плыли по воде."},{"t":"v","l":["Словарь:","возиться – убаралануу","– уйулген топурак","скорость – ылдамдык","башня – мунара"]},{"t":"p","h":"Упражнение 63. Перепишите, заменяя одни управляемые слова другими, взятыми в скобки, с предлогами или без предлогов."},{"t":"p","h":"Образец: Барабанщик шагал впереди полка, впереди колонны."},{"t":"p","h":"1. Барабанщик шагал впереди отряда (полк, колонна)."},{"t":"p","h":"2. Снег хлопьями падал на крыши (улица, деревья). 3. Поезд отошёл от вокзала (станция, перрон). 4. Рыбаки ловят рыбу удочкой (сеть, невод). 5. Варенье варят из малины (вишня, смородина). 6. Альпинисты с вершины любовались озером (долина, город). 7. Ташкентский завод выпускает тракторы (комбайны, станки)."},{"t":"v","l":["Словарь:","сеть – тор лозунг – ураан","невод – балык уулоочу чон тор"]},{"t":"p","h":"<span class=\"pg\" data-n=\"44\">44<\/span>Упражнение 64. Выпишите из данных предложений сочетания слов, связанных связью управления. Поставьте вопросы к зависимым словам."},{"t":"p","h":"Образец: Тамара карандашом нарисовала улицу города."},{"t":"v","l":["а) нарисовала (чем?) карандашом;","6) нарисовала (что?) улицу;","в) улицу (чего?) города."]},{"t":"p","h":"1. Тамара карандашом нарисовала улицу города. 2. Весенний ливень обмыл листья виноградника. 3. Солдата ранило осколком снаряда. 4. Альпинисты спустились с вершины горы. 5. Всадник вскочил на коня. 6. Мы сидели под развесистым клёном. 7. За оградой находилась мастерская школы. 8. Брат установил антенну над крышей дома. Словарь:"},{"t":"p","h":"всадник – атчан киши Упражнение 65. Правильно читайте вслух выделенные слова. Найдите управляемые слова. В каком падеже они стоят?"},{"t":"p","h":"1. Шепки трещат в печи. 2. Щавель положили в щи."},{"t":"p","h":"3. Щётка сделана из щетины. 4. Щенок подошёл к пище."},{"t":"p","h":"5. Щипцы провалились в щель. 6. Аня вышла из жилища. 7. Рыбак поймал щуку. 8. Мальчик щурился на солнце."},{"t":"p","h":"9. Из сада доносилось щебетание птиц."},{"t":"p","h":"Словарь:"},{"t":"raw","h":"<h4 class=\"mk\">щетина – кыл жилище – уй<\/h4>"},{"t":"p","h":"щебетание птиц – куштардын чыркылдашы"}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[42,44]},{"title":"§ 16. ПРЕДЛОЖНОЕ И БЕСПРЕДЛОЖНОЕ УПРАВЛЕНИЕ.","blocks":[{"t":"h3","h":"§ 16. ПРЕДЛОЖНОЕ И БЕСПРЕДЛОЖНОЕ УПРАВЛЕНИЕ."},{"t":"v","l":["1. Какие виды связи слов вы знаете?","2. Что происходит при управлении?","3. Какие части речи обычно бывают управляемыми?","4. Какая часть речи называется предлогом?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"45\">45<\/span>Управляющее слово требует употребления того или иного падежа управляемого слова. При этом управляемое слово употребляется без предлога или с предлогом."},{"t":"p","h":"Управление при помощи предлога. называется предложным управлением. Управление без помощи предлога называется беспредложным."},{"t":"p","h":"Управляемые слова в предложном падеже всегда употребляются с предлогом. Управление другими падежами может быть как предложным, так и беспредложным. (В именительном падеже управляемые слова никогда не употребляются.)"},{"t":"v","l":["Например:","Беспредложное управление.","уговорил отца","написал брату","Предложное управление.","остался без отца","обратился к брату"]},{"t":"p","h":"Наличие или отсутствие предлога зависит от значения всего сочетания слов. В одном значении сочетание слов строится без предлога (например: поставили парту), а в другом значении в сочетании слов обязательно надо употребить предлог (н априме р: поставил на парту). В первом примере поставлена сама парта, а во втором на парту поставлен какой-то предмет, например, глобус."},{"t":"v","l":["Вопросы для повторения:","1. Что такое предложное управление?","2. Что такое беспредложное управление?","3. Какой падеж употребляется только с предлогами?"]},{"t":"p","h":"4. Какие падежи употребляются и при предложном, и при беспредложном управлении?"},{"t":"p","h":"Упражнение 66. Перепишите. Слова, управляемые без предлогов, подчеркните одной чертой, а управляемые с помощью предлогов – двумя чертами."},{"t":"h3","h":"ОХОТНИКИ ЗА ЯДОМ."},{"t":"p","h":"Борис заметил на песке змеиный след. Около старого дувала он настиг кобру. Кобра подняла голову и зашипела. В раскрытой пасти змеи торчали ядовитые зубы. Борис ловко схватил змею за шею. Через секунду она уже лежала <span class=\"pg\" data-n=\"46\">46<\/span>в брезентовом мешке. Из яда змеи люди сделают лекарства. Эти лекарства излечивают от многих болезней."},{"t":"p","h":"Идут смелые змееловы в пустыню. Рискуя жизнью, они добывают ценное сырьё для лекарств."},{"t":"p","h":"По В. Пескову. Словарь: настигать – кууп жетуу"},{"t":"v","l":["пасть ооз","торчать – сороюп","брезентовый – брезент","ценный – баалуу"]},{"t":"p","h":"змеелов – жылан кармоочу кобра – уулуу жылан рисковать жизнью – омурун"},{"t":"p","h":"тобокелге салуу"},{"t":"p","h":"Упражнение 67. Перепишите. Одни управляемые слова замените другими, взятыми в скобки, с предлогами или без предлогов."},{"t":"p","h":"1. Джапар тосковал о семье (друзья). 2. Мои родители путешествовали по Волге (Урал). 3. Книги лежали на столе (тумбочка). 4. Известный писатель опубликовал в журнале «Ала-Тоо» рассказ (статья). 5. Мы весело катались на коньках (лыжи). 6. Учитель истории прочитал доклад (лекция) о международном положении. 7. Плотники проворно работали топорами (пилы). 8. Путники торопились добраться до города (деревня)."},{"t":"v","l":["Словары:","путешествовать – кыдыруу,","саякаттоо","опубликовать – жарыялоо,","жарыя кылуу"]},{"t":"p","h":"Упражнение 68. Составьте список русских предлогов, которые вы знаете."}],"sub":[{"title":"ОХОТНИКИ ЗА ЯДОМ.","b":10}],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[45,46]},{"title":"§ 17. ГЛАГОЛЬНОЕ УПРАВЛЕНИЕ.","blocks":[{"t":"h3","h":"§ 17. ГЛАГОЛЬНОЕ УПРАВЛЕНИЕ."},{"t":"v","l":["(Этиштик башкаруу.)","","Вепомните:","1. В чём состоит согласование?","2. В чём состоит управление?","3. Какие виды управления вы знаете?"]},{"t":"p","h":"4. Какие слова выступают в качестве главных, управляющих?"},{"t":"p","h":"<span class=\"pg\" data-n=\"47\">47<\/span>Такое управление, при котором в качестве главного, управляющего слова выступает глагол, называется глагольным управлением."},{"t":"p","h":"Глагольное управление бывает беспредложным и предложным. Глаголы управляют не одним, а двумя или несколькими падежами, в зависимости от сочетания слов. Например:"},{"t":"v","l":["записку","писать мелом"]},{"t":"img","src":"data:image/webp;base64,UklGRiAMAABXRUJQVlA4IBQMAABwYACdASpPAswAPrVYoUwnLacoK1dIabAWiWlL8Htb/PQLKEzt/mVTcIwSuSsW3bkF+bXvnJ46+5PXcZF/yr/J5kOy/8S/o+KVZDX5PX/qtf/9H+x+9an3+ON4hBSggFMLOpFglyZobILJhLR78oNannlfKxIiEFyyXF13xrBK7NtggF+IyMTO0PpAh6PPPZXmFOOdZKNFVsk7XHI5PbW/dBLz42Q2NlzjEXxP349HsBMYjG7BOlebKMY3z6WWhLiXIol/xBMVjzyoPyZLR9I/wuTkeSk89Md3xvBNAHdIWBy/FzZkd6jOUqSWaYmRzSNG3qswntsy1L/fz/avXA/tIuhFUTQd2WjLX3hvf55UqwG6ATrJIdiS5iNhWH2vB1gocttSUag1QcN+4TbGuN9MZpE8kgM7jBn43EAuuS+1UQXxCcHx7U/E9mEVav7z3c6WgVFIjt6cAK1W21+au9XAb3UDQ8BYT4WXWXKv9OL2L66LoFrpqFI4UNHah77XB5Ydi1JfSpPJMppmZ/XYG+jGrJkZJ2hLmlG3zkO/D1mcZQAAeCBU+sfStPE36rKXqiwTFW4DFGZXTHwoY3FLaeDIoRpBWqiJcUrWYywDDfEzmOt63hzR9YhqwROM3O915mZzEKY9JYv3KNXQSxE2uK8/uPQjdNhxdBeq/zKQlYJNcH9jHIMaeA2NbEPkjkOsVy8veLNbXV4KRklQqmvF57RHj8RoXDILHbaAo+X4YVjRFDBIrtA8zvv8Abdwwthw7WEd1mhvn38sJ/OpNWGSFWeb2IEb+bimjC9SxXx7GOY/g8q84UY7qE6/sDb4lvpiUdCWLFuih6/lAvJ+J3Km4/GPqaWa1+oYCBHgrzX8aJXJh8eK6hyu7gktEuX5bpGHrhvO5DV93oSoURJ6ZwUkjzKBQu7FelWNiT83rxZi0cY14vgrELi+WiMIKq5uMp3nD/mW1H4ppmh401DpM1cEHagZmV5HaHc1zOAlc23Bskpl4hDJX1LWJQFhYyXKAmFh4RU1jndn8XjPugByYwAA/tJ0K86uO4apzhUfngHhIeiK5CxAQU9CW1/icQ82R3OxmYI9fYgoq0J7abU55Y5KWuUm9ulxXC8yjrId6sah+l2f03YjViToxVgViBnxCPMNAB+B ":[{"title":"ЗИМНИЕ ЗАБОТЫ ЧАБАНА.","b":9}],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[47,47]},{"title":"А. БЕСПРЕДЛОЖНОЕ ГЛАГОЛЬНОЕ УПРАВЛЕНИЕ.","blocks":[{"t":"h3","h":"А. БЕСПРЕДЛОЖНОЕ ГЛАГОЛЬНОЕ УПРАВЛЕНИЕ."},{"t":"p","h":"Родительным падежом управляют глаголы хотеть, желать, просить, требовать, добиваться, достигать, жаждать, ждать, искать и другие. В этом случае существительное <span class=\"pg\" data-n=\"48\">48<\/span>в родительном падеже указывает, чего именно хочет, ищет, просит и т.д. тот, о ком говорится в предложбнии. Например: Мы требуем мира. Зуура добилась своей цели."},{"t":"p","h":"Родительный падеж употребляется также после глаголов, обозначающих боязнь, страх, стыд: бояться, опасаться, пугаться, беречься, стесняться и др."},{"t":"p","h":"Например: Девочка испугалась собаки. Они избегали встреч."},{"t":"p","h":"Родительный падеж употребляется при глаголах с отрицанием не. Наприм ёр: Швабрин не взял с собою ключа."},{"t":"p","h":"Упражнение то. Перепишите. Слова, взятые в скобки, поставьте в нужном падеже, учитывая, какой глагол ими управляет."},{"t":"p","h":"Образвб ц: Старый солдат на фронте искал сына."},{"t":"p","h":"1. Старый солдат на фронте искал (сын). 2. Народы требуют (мир). 3. Непобедимый Манас не боялся любого (враг). 4. Плохой ученик избегает (поручение). 5. Во многих странах рабочие опасаются (безработица). 6. Старик не дождался (ответ). Народы Африки хотят (свобода)."},{"t":"p","h":"8. Молодые джигиты стыдятся (скука), у них умные головы и прекрасные руки!"},{"t":"p","h":"Словарь:"},{"t":"p","h":"стыдиться – уялуу скука – зеригуу"},{"t":"p","h":"Упражнение 71. Перепишите, вставляя вместо точек нужные глаголы, управляющие родительным падежом без предлога. Управляемые этими глаголами слова подчеркните."},{"t":"p","h":"1. Земледёльцы ... наступления тёплой погоды. 2. Ракета ... цели. 3. Дбти ... грозы. 4. Дочь ... приезда отца. 5. Нурлан .. свойх плохих отметок по математике. 6. Фашисты не ... полного поражения под Москвой. 7. Павка Корчагин не ... богачей."},{"t":"p","h":"Слова для справок: любить, избежать, стыдиться, ждать, испугаться, достигнуть, желать."},{"t":"p","h":"<span class=\"pg\" data-n=\"49\">49<\/span>поражение – женилуу избежать – кутулуп кету\\"},{"t":"p","h":"Дательным падежом управляют глаголы, которые обозначают радость, удивление, хорошее отношение: радоваться, удивляться, поражаться, аплодировать, содействовать, помогать, сочувствовать, способствовать и др. Например: Отец радуется успехам своего сына. Зал аплодировал пианисту. Друзья сочувствовали её горю."},{"t":"p","h":"Дательный падеж употребляется при глаголах, обозначающих передачу чего-то (в том числе знаний, сообщений) кому-то. К таким относятся глаголы: учить, обучать, дать, преподавать, говорить, сообщать, приказать, сказать и др. Например: Радио сообщило нам важные новости."},{"t":"p","h":"Дательный падеж употребляется при глаголах, обозначающих помехи, угрозу и указывает, кому это направлено: мешать, надоедать, препятствовать, грозить, грубить, мстить, вредить и др. Например: Не мешай товарищу во время урока!"},{"t":"p","h":"Упражнение 72. Прочитайте. Выпишите глаголы с управляемыми ими словами. Укажите, каким падежом управляет каждый глагол."},{"t":"p","h":"Образец: Подарил маме – дат. п.; Просит помощи – род.п."},{"t":"p","h":"1. Отец подарил маме красивые серьги. 2. Товарищ просит помощи. 3. Партизаны жестоко отомстили врагам."},{"t":"p","h":"4. Альпинисты достигли вершины. 5. Сильный ветер мешал бегунам. 6. Весь мир удивляется успехам кыргызского балета. 7. Разговорившись, охотники не заметили волка."},{"t":"p","h":"8. Зрители аплодировали любимым артистам."},{"t":"p","h":"Словарь:"},{"t":"p","h":"серьги – иймек, сейке удивляться – ан-тан калуу жестоко – аёсуз"},{"t":"p","h":"Упражнение 73. Перепишите. Вместо точек вставьте в нужном падеже существительные, взятые из списка в конце упражнения."},{"t":"p","h":"<span class=\"pg\" data-n=\"50\">50<\/span>Образец: Утренние заморозки угрожают посевам."},{"t":"p","h":"1. Утренние заморозки угрожают 2. Дед обучал внука ... 3. Мгла мешала .... 4. Школьники учат .... 5. Мир изумился ... кыргызского искусства. 6. В лесу я не встретил ...Т. Птицы и животные радуются ...."},{"t":"p","h":"Слова для справок: весна, охотники, достижениям, стихотворение, работа, посевы, грамота."},{"t":"p","h":"Словарь:"},{"t":"p","h":"угрожать – коркутуу достижение – жетишкендик"},{"t":"p","h":"Винительный падеж употребляется после многих глаголов, обозначая предмет, на который переходит их действие. Нередко это глаголы с тем же значением, что и в кыргызском языке. Винительный падеж употребляется с глаголами писать, любить, бить, чувствовать, рассказывать и многими другими. Например: Мы любим наш город. Дедушка рассказал сказку. Почтальон принёс письмо."},{"t":"p","h":"Упражнение 74. Перепишите. Выделенные слова замените другими, взятыми в скобки, употребляя в нужном падеже. Подчеркните управляющие глаголы."},{"t":"p","h":"Образец: Слесарь отремонтировал мотор."},{"t":"p","h":"1. Слесарь отремонтировал трактор (мотор). 2. Экскурсанты посетили театр (выставка). 3. В зоопарке мы видели слона (тигр). 4. На уроке не мешай товарищу (сосед)."},{"t":"p","h":"5. Долгий разговор утомил старика (больной). 6. Ася получила письмб (телеграмма). 7. Лесорубы спилили высокую ель (сосна). 8. Молодые поэты организовали литературный вечер (викторина). 9. Охотничья собака обнаружила берлогу (зверь). 10. Выйдя на улицу, я застегнула куртку (пальто)."},{"t":"p","h":"Словарь:"},{"t":"p","h":"утомить – чарчатуу застегнуть – топчулануу берлога – аюунун ункуру"},{"t":"p","h":"<span class=\"pg\" data-n=\"51\">51<\/span>Творительны м падежом управляют глаголы со значением руководства: завидовать, командовать, управлять, руководить, распоряжаться, владеть, дирижировать и др. Например: Опытный шофёр умело управляет автомобилем."},{"t":"p","h":"Творительный падеж употребляется также при глаголах, означающих какую-нибудь работу. Этот падеж обозначает тогда орудие. Таковы глаголы рубить, копать, пилить, писать, рисовать, резать, стучать и др. Наприме р: Петя хорошо рисует красками. Отец бреется электрической бритвой."},{"t":"p","h":"Творительный падеж часто входит в состав сказуемого. При этом глагольную часть сказуемого нередко составляют глаголы быть, казаться, оказаться, остаться, стать, являться, работать, служить, избрать и др. Например: Директор театра раньше был артистом. Наш народ избрал демократический путь развития."},{"t":"p","h":"Упражнение 75. Прочитайте, найдите и выпишите глаголы, управляющие творительным падежом, с управляемыми словами. Каково значение выписанных сочетаний слов?"},{"t":"p","h":"1. Космонавт управляет космическим кораблём. 2. Ошане гордятся своим драматическим театром. 3. Сторож всю ночь стучал колотушкой. 4. Котлован для дома строители вырыли бульдозером. 5. Песок из котлована вывезли самосвалом."},{"t":"p","h":"6. Сестра заведует районной библиотекой. 7. Занимайся делом, а не чепухой! 8. Подвиг Чолпонбая служит примером для молодежи."},{"t":"p","h":"Словарь:"},{"t":"p","h":"колотушка – токмок чепуха – бекер соз, болбогон нерсе"},{"t":"p","h":"Упражнение 76. Перепишите. Вместо точек вставьте существительные в нужном падеже. Для справок используйте слова в конце упражнения."},{"t":"p","h":"1. Асанбек почистил брюки ... и погладил .... 2. Танабай Бакасов сначала работал ..., а потом .... 3. Храбрый боёц одного врага сразил ..., второго заколол ..., а третьего ударил ... 4. Молодой писатель был недоволен ..."},{"t":"p","h":"5. Рассердившись, дядя Максим топнул ... и вышел из – <span class=\"pg\" data-n=\"52\">52<\/span>комнаты. 6. Хоккейст овладел Т. Пшеничное поле"},{"t":"p","h":".... 8. Демонстранты размахивали ...."},{"t":"p","h":"Слова для справок: критика, нога, флаги, шайба, шётка, утюг, пуля, штык, приклад, табунщик, чабан, сорняки."},{"t":"v","l":["Словарь:","сразить – олтуруу","заколоть – саюу","овладеть – ээлеп алуу, ээ болуу","критика – сын, сындоо","приклад (винтовки) – кундак"]}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[48,52]},{"title":"Б. ПРЕДЛОЖНОЕ ГЛАГОЛЬНОЕ УПРАВЛЕНИЕ.","blocks":[{"t":"h3","h":"Б. ПРЕДЛОЖНОЕ ГЛАГОЛЬНОЕ УПРАВЛЕНИЕ."},{"t":"p","h":"Выбор предлога и падежа существительного зависит нередко от приставки глагола. Важнейшие соответствия глагольных приставок и падежей даны В следующей таблице."},{"t":"p","h":"В ВИН войти в дом, въехать в город взойти на гору"},{"t":"v","l":["выйти из дому","выбежать на улицу","выехать в поле","до6хать до города","зайти за дом","зайти за книгами","зайти в магазин","зайти к приятелю","исключить из школы","надеть на голову","оторваться от работы","перейти через улицу","подплыть под мост","подойти к окну","приехать к другу","приехать в Москву","сдвинуть с места","уйти от директора","уйти из дома","улететь в Ош","уехать на юг"]},{"t":"p","h":"<span class=\"pg\" data-n=\"53\">53<\/span>Кроме этого, некоторые глаголы (независимо от приставок) управляют падежами с предлогами."},{"t":"p","h":"Упражнение 77. Прочитайте. Найдите глаголы с приставками. Перепишите, вставляя вместо точек существительные в нужном падеже с предлогами (слова приведены в конце упражнения). Подчеркните приставки в глаголах и предлоги."},{"t":"p","h":"1. Мать вынула из .. стаканы и тарелки. 2. Теплоход засветло отошёл от .... 3. Чемпион первым добежал до ...."},{"t":"p","h":"4. Алиман выписала из ... два абзаца. 5. По пути в библиотеку я зашёл к .... 6. Мотоциклист неожиданно выехал из .... 7. Дворник сбросил снег с 8. Зуура отнесла грязное бельё в ...."},{"t":"p","h":"Слова для справок: прачечная, переулок, книга, шкаф, финиш, пристань, приятель, крыша."},{"t":"v","l":["Словарь:","засветло – жарыкта","финиш – маара","абзац – жаны жолдон баштоо","прачечная – кир жуучу жай","переулок – чолок кече"]},{"t":"p","h":"Упражнение 78. Из следующих групп слов составьте предложения. Обратите внимание на приставки глаголов и употребите нужные предлоги."},{"t":"p","h":"Образец: Птенец вывалился из гнезда."},{"t":"p","h":"1. Птенец, вывалиться, гнездо. 2. Мощный, ракеты, долететь, Марс и Венера. 3. Отряд, присоединиться, главные силы. 4. Связной, срочно, донесение, доставить, штаб."},{"t":"p","h":"5. Обломок скалы, скатиться, гора. 6. Мать, отнести, чулан, старые вещи. 7. Троллейбус, подъехать, остановка. 8. Гражданин с портфелем, выйти, учреждение."},{"t":"v","l":["Словарь:","связной – чабарман","срочно – тезинен, шашылыш","обломок – жарык","скатиться – тоголонуп тушуу","чулан – чулан (аны-муну","коюучу жай)"]},{"t":"p","h":"Упражнение 79. Найдите глаголы, выделите в них приставки. Переписывая, вставьте нужные предлоги. Существительные, взятые в скобки, поставьте в нужном падеже."},{"t":"p","h":"<span class=\"pg\" data-n=\"54\">54<\/span>и внучка приехали к дедушке."},{"t":"p","h":"1. Внук и внучка приехали ... (дедушка). 2. Заяц выскочил ... (кустарник). 3. Олени подошли ... (родник)."},{"t":"p","h":"4. ОКЕ вылезла ... (конура). 5. Течение отнесло лодку ... (берег). 6. Берёзы и ивы склонились ... (пруд). Т. Прислушивайся ... (советы старших). 8. Сайра успела вбежать"},{"t":"p","h":"класс до (перекличка)."},{"t":"p","h":"Упражнение 80. Перепишите, вставляя вместо точек нужные предлоги. Подчеркните приставки у глаголов."},{"t":"h3","h":"ПУТЬ ЧЕРЕЗ ПЕРЕВАЛ."},{"t":"p","h":"В сумерки автомашины с сеном подъехали ... перевалу. Дорогу преградили большие сугробы снега. Передний автомобиль застрял. Шофёры вылезли ... кабин и огляделись. Тяжёлая мрачная туча выползала ... ущелья. Снежная лавина сорвалась ... склона и с грохотом устремилась вниз. Шофёры боялись непогоды. Тогда они будут ожидать. утра бульдозер."},{"t":"p","h":"Но смелый бульдозерист Гриша уже выехал ... помощь. Бульдозер приблизился... сугробам и расчистил дорогу. Вслед за бульдозером перешли перевал и автомобили. Они направились ... отдалённые пастбища. А бульдозер отъехал ... перевала. Гриша оторвал усталые руки .. рычагов и чуточку улыбнулся."},{"t":"p","h":"По Д. Чотурову. Словарь: перевал – ашуу"},{"t":"v","l":["сугроб – куртку","застрять – тыгылуу","","Вопросы для повторения:","склон горы – тоонун энкейиши,","тоонун боору","","1. Какое управление называется глагольным?"]},{"t":"p","h":"2. Какие группы глаголов управляют родительным падежом?"},{"t":"p","h":"3. Какие группы глаголов управляют дательным падежом?"},{"t":"p","h":"4. Какое значение имеет винительный падеж при глаголах?"},{"t":"p","h":"5. Глаголы с какими приставками управляют винительным падежом с предлогами?"},{"t":"p","h":"<span class=\"pg\" data-n=\"55\">55<\/span>6. Какие глаголы управляют творительным падежом?"},{"t":"p","h":"7. Глаголы с какими приставками управляют родительным падежом с предлогами?"},{"t":"p","h":"8. Глаголы с какими приставками управляют дательным падежом с предлогами?"},{"t":"p","h":"Упражнение 81. Допишите к следующим глаголам управляемые ими существительные (с определениями) в нужном падеже с предлогом и без предлога."},{"t":"p","h":"1. Компьютерщик заложил в компьютер ... (программ)."},{"t":"p","h":"2. Полярники по радио передали „.. (привет) родным и знакомым. 3. На стройку приехали бульдозеристы из ... (города). 4. Школьник отсутствовал по ... (причина)."},{"t":"p","h":"5. Инженер всегда прислушивался К ... рабочих."},{"t":"p","h":"6. Удалой джигит проскакал на ... (конь) от (Токмак) до (Быстровка). 7. Страна гордится ... (учёные)."},{"t":"p","h":"Слова для справок: талантливый, новый, разный, искренний, резвый, уважительный, дельный. Словарь: удалой – жигердуу"},{"t":"v","l":["талантливый таланттуу","сочный – ширелуу","разный – ар турдуу","искренний (сердечный) привет – чын","журектен айтылган салам","резвый конь – кулук ат","дельный совет – орундуу кенеш"]},{"t":"p","h":"Упражнение 82. Образуйте глаголы со следующими приставками."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>до<\/td><td>при<\/td><td>вы<\/td><td>в<\/td><\/tr><tr><td>грести<\/td><td>касаться<\/td><td>селить<\/td><\/tr><tr><td>ходить<\/td><td>ехать<\/td><td>идти<\/td><td>селить<\/td><\/tr><tr><td>писать<\/td><td>идти<\/td><td>бежать<\/td><td>писать<\/td><\/tr><tr><td>скакать<\/td><td>водить<\/td><td>брать<\/td><td>катиться<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"Какими падежами, с какими предлогами управляют образованные глаголы?"},{"t":"v","l":["Словарь:","касаться – бир нерсеге тийип туруу","прикасаться – бир нерсеге тийуу","селить – кондуруу","выселить – кечуруп","жиберуу"]}],"sub":[{"title":"ПУТЬ ЧЕРЕЗ ПЕРЕВАЛ.","b":21}],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[53,55]},{"title":"§ 18. ИМЕНА СУЩЕСТВИТЕЛЬНЫЕ КАК ГЛАВНЫЕ,","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"56\">56<\/span>§ 18. ИМЕНА СУЩЕСТВИТЕЛЬНЫЕ КАК ГЛАВНЫЕ,"},{"t":"h3","h":"УПРАВЛЯЮЩИЕ СЛОВА."},{"t":"v","l":["(Зат атоочтук башкаруу.)","","Вепомните:","1. Что такое управление?","2. Какие части речи обычно бывают управляющими?"]},{"t":"p","h":"При связи управления главным словом может быть не только глагол, но и имя существительное."},{"t":"p","h":"Управляющими словами нередко являются существительные, образовавшиеся от глаголов. Они часто управляют теми же падежами, что и соответствующие глаголы. Например: желать победы – желание победы, приказать бойцу – приказ бойцу, управлять машиной управление машиной и т.д."},{"t":"p","h":"Но и другие существительные нередко управляют тем или иным падежом. В этих случаях выбор падежа управляемого слова определяется значением сочетания слов."},{"t":"p","h":"Родительный падеж без предлога управляется именами существительными в сочетаниях слов, обозначающих:"},{"t":"p","h":"а) принадлежность одного предмета другому (каки в кыргызском языке): книга ученика, дверь комнаты, портфель учительницы и т.д.;"},{"t":"p","h":"6) часть предмета: кусок хлеба, рукав рубахи, отрезок прямой ит.д."},{"t":"p","h":"Родительный падеж с предлогом из указывает на материал, из которого сделан предмет (галстук из шёлка, дом из кирпича). В других случаях он указывает на источник главного предмета и соответствует кыргызскому исходному падежу (чыгыш жендеме): письмо из Санкт- Петербурга, отрывок из повести и т.д."},{"t":"p","h":"Родительный падеж употребляется нередко с предлогом без. Он указывает на отсутствие чего-либо у другого предмета, обозначенного главным словом. Например: мужчина без усов, мальчик без кепки и т.д."},{"t":"p","h":"Творительный падеж с предлогом с, управляемый существительным, употребляется в следующих случаях:"},{"t":"p","h":"<span class=\"pg\" data-n=\"57\">57<\/span>а) когда надо указать, что два предмета (часто два человека) действуют совместно: отец с сыном, мать с отцом, трактор с прицепом;"},{"t":"p","h":"6) когда надо указать, что один предмет (человек) снабжён каким-то другим предметом: девочка с ведром, портфель с замком;"},{"t":"p","h":"в) когда надо указать на то, чем наполнен предмет,"},{"t":"p","h":"егб содержимое: кувшин с мёдом, чашка с чаем, автобус с пассажирами."},{"t":"p","h":"Задание. Составьте словосочетания, поставив слова в скобках в нужной форме."},{"t":"p","h":"(Телевизиднный) вышка, листок из (календарь), девочка с (веснушки), здание (филармония), верхушка (дуб), скорлупа (орех), футляр для (виолончель), лекарство от (простуда), ветер из (ущелье), чай с (лимон), (гречневый) каша, альбом для (рисование), посылка из (Москва), журчание (ручей), шум (водопад), лай (собака), дружба между (народы нашей страны), подвиг (вбин-интернационалист), (картофелеуборочный) машина, площадь около (театр оперы и балета), экспонат (музей), (избирательный) кампания, спор между (коллеги)."},{"t":"p","h":"Упражнение 83. Перепишите, подставляя к главным словамсуществительным зависимые слова, указанные в конце упражнения. Не забудьте поставить их в нужном падеже."},{"t":"p","h":"Образец: К штабу подъехала тачанка с пулемётом."},{"t":"p","h":"1. К штабу подъёхала тачанка с... 2. Над городом светились огни .... 3. На подоконнике стоял стакан с .... 4. Археологи обнаружили скелет .... 5. Сбоку дороги валялось колесо"},{"t":"p","h":"близ берлоги висёл клок .... 7. Повар сварил кашу из .... 8. Витя отремонтировал трубку .... 9. Дом из .. построили в переулке."},{"t":"p","h":"Слова для справок: кирпич, телефон, рис, шерсть, телега, мамонт, молоко, телебашня, пулемёт."},{"t":"p","h":"Словарь:"},{"t":"p","h":"скелет мамонта – мамонттун скелети клок – тутам"},{"t":"p","h":"<span class=\"pg\" data-n=\"58\">58<\/span>Упражнение 84. Перепишите. Слова, взятые в скобки, поставьте в требуемом падеже."},{"t":"p","h":"1. Астрономы наблюдали затмение (солнце). 2. Грива (иноходец) развевалась на ветру. 3. Ствол (пушка) раскалился от стрельбы. 4. Огромный белый санаторий стоял на берегу (озеро). 5. Артисты из (Ош) дали концерт для избирателей. 6. Палатка (геологи) стояла у самой трещины (ледник). Т. Ветер иногда доносил из долины резкий запах (полынь). 8. Пробираясь сквозь заросли (облепиха), дети исцарапали ноги. 9. В левом кармане (пиджак) Бектур носил недавно полученную из дому (фотография мамы)."},{"t":"v","l":["Словарь:","иноходец – жорго облепиха – чычырканак","полынь – эрмен, шыбак"]},{"t":"p","h":"Упражнение 85. Переведите на русский язык, заменяя кыргызские аффиксы исходного падежа (чыгыш) -дан, -ден, -тен, -тон и другие русскими предлогами родительного падежа из, от."},{"t":"p","h":"1. Керим Москвадан келди. 2. Мен жолдошумдан кат алдым. 3. Самолёт Ташкенттен келди. 4. Эртен шаардан эжем келет. 5. Айранды суттен уютат. 6. Эмгектен бакыт табасын!"},{"t":"p","h":"Примечание: При переводе в этих предложениях нужно изменить порядок слов. Например, предложение 1-е: Керим приехал из Москвы."},{"t":"p","h":"Упражнение 86. Вместо точек вставьте существительные, управляемые другими существительными, в нужном падеже. Слова берите из списка в конце упражнения."},{"t":"p","h":"Образец: На стройку приехал грузовик с кирпичом."},{"t":"p","h":"1. На стройку приехал грузовик с .... 2. Дед с ... пошли в лес за грибами. 3. На песке лежала лодка без .... 4. Кадка для .. стояла в погребе. 5. Охотник с ... прислушивался к лесному шороху. 6. Врач назначил лекарство от...."},{"t":"p","h":"7. Музыкант купил футляр для 8. Художник нарисовал девочку с ...."},{"t":"p","h":"<span class=\"pg\" data-n=\"59\">59<\/span>Слова для справок: пёрсик, скрипка, весло, внук, капуста, простуда, собака, кирпич."},{"t":"v","l":["Словарь:","прислушиваться – кулак салуу, угуу","футляр – куту","кадка – жыгач челек","погреб – жер теле"]},{"t":"p","h":"Упражнение 87. Допишите к незаконченным предложениям сочетания слов с управляющими существительными и управляемым словом."},{"t":"p","h":"Образёц: Свёжий ветер распахнул окнб квартиры."},{"t":"p","h":"1. Свежий распахнул окно .... 2. В переулке стоял ...3. Официёнтка принесла .... 4. В одной бригаде работают ...5. Из рощи доносилось .... 6. В заводском клубе выступали .... 7. На столе стояла ...."},{"t":"p","h":"Слова для справок: магазин без продавца, артисты из филармонии, окнд квартиры, отец с сыном, котлеты с макаронами, ваза с фруктами, пение птиц. Словарь:"},{"t":"p","h":"распахнуться (открыться) – ачылуу Упражнение 88. Просклоняйте слова достдинство и происшествие. Подчеркните падежные окончания."},{"t":"p","h":"Словарь:"},{"t":"p","h":"достоинство – кадыр, барк происшествие – окуя"}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[56,59]},{"title":"§ 19. СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ.","blocks":[{"t":"h3","h":"§ 19. СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"1. В чём заключается сочинительная связь между словами?"},{"t":"p","h":"2. Что называется подчинительной связью между словами?"},{"t":"p","h":"3. Какие виды подчинительной связи вы знаете?"},{"t":"p","h":"4. В чём состоит связь согласования?"},{"t":"p","h":"5. Какие слова согласуются в числе, лице, роде и падеже?"},{"t":"p","h":"<span class=\"pg\" data-n=\"60\">60<\/span>6. Что происходит со словами, связанными по способу управления?"},{"t":"p","h":"7. Какие слова бывают управляемыми?"},{"t":"p","h":"8. Какие глаголы управляют родительным (дательным, винительным, творительным) падежом без предлога?"},{"t":"p","h":"9. Какие глаголы управляют падежами с предлогами (по падежам)?"},{"t":"v","l":["10. Как управляют падежами имена существительные?","11. В чём заключается связь примыкания?","12. Какие слова примыкают?"]},{"t":"p","h":"Удобно представить связь между словами в предложении в виде схемы. Будем обозначать связь согласования между словами двумя параллельными линиями (= = =), связь управления – одной чертой (-), а связь примыкания – прерывистой чертой (- – -). Стрелочка будет указывать направление, от какого слова к какому идёт связь (она будет направлена к подчинённому слову). Сочинительную связь между словами обозначим линией из точек Составим схему предложения:"},{"t":"p","h":"Лучшие ученики нашего класса успешно закончили первую четверть."},{"t":"raw","h":"<h4 class=\"mk\">ученики Лучшие<\/h4>"},{"t":"v","l":["закончили","","класса","успешно","четверть"]},{"t":"p","h":"нашего первую"},{"t":"p","h":"Упражнение 89. Перепишите. Подчеркните согласуемые слова двумя чертами, управляемые слова – одной чертой, примыкающие слова – прерывистой чертой."},{"t":"p","h":"1. После продолжительной засухи земля досыта напилась воды. 2. Тихий ручеёк струился внизу под обрывом."},{"t":"p","h":"3. Высокие сосны шумели над головой тихо и грустно."},{"t":"p","h":"4. Крупная роса блестела на листьях деревьев. 5. Чуткий <span class=\"pg\" data-n=\"61\">61<\/span>камыш шуршал над озером. 6. Старая мельница сонно хлюпала колёсами. 7. Аил скоро пробудился от громкого лая собак. 8. Жутко кричат в лесу ночные птицы."},{"t":"p","h":"Словарь:"},{"t":"p","h":"грустно – мунайынкы жутко – урейду учуруп, урей учуруу"},{"t":"p","h":"Упражнение 90. Составьте схемы связи слов в следующих предложениях."},{"t":"p","h":"1. Ночью на звмлю выпал сухой снег. 2. В Австралии издавна водятся необычные звери. 3. Крупные капли дождя гулко стучали по крыше. 4. Яркое солнце медленно клонилось к горизонту. 5. Белые лебеди медленно летали над озером. 6. С востока быстро надвигалась густая тьма."},{"t":"p","h":"7. Высокая пшеница радостно кивала нам колосьями. Словарь: издавна эчактан бери"},{"t":"v","l":["необычный – кадимкидей эмес,","башкача","гулко – кунгуреген","кивать – баш ийкее"]},{"t":"p","h":"Упражнение 91. Перепишите. Слова, взятые в скобки, поставьте в нужном падеже, числе, лице, роде."},{"t":"h3","h":"БАРС В КАПКАНЕ."},{"t":"p","h":"Издалека мы (услышать) (грозный) рычание. Под (дерево) метался зверь. Одну (нога) его прочно (зажать) капкан. Глаза (зверь) горели (злобный) огнём. Старый охотник Бектур ловко (набросить) на (хищник) сеть. Барс (запутаться) в (сеть). Бектур связал пасть (хищник) и ноги (верёвка). Через несколько (день) (пойманный) зверя отправили на (зообаза)."},{"t":"p","h":"По Л. Дядюченко. Словарь: рычание – ырылдоо"},{"t":"v","l":["метаться – алдастоо, чабалактоо","прочно – бек","злобный – ачуулуу","запутаться – чалынуу"]},{"t":"p","h":"Упражнение 92. Перепишите. Допишите окончания в незаконченных словах."},{"t":"p","h":"<span class=\"pg\" data-n=\"62\">62<\/span>1. Спел... персики висел... за оград... сада. 2. Тонк... камыш шурш... над вод.... 3. На холм... торч... развалины древн... крепост.... 4. Старшеклассники шил... костюмы к новогоднем... бал.... 5. Жутко кричал... ночн... птица филин."},{"t":"p","h":"6. На кра... посёлк... находится кузниц.... 7. Мы слушал... по радио народ... музык...."},{"t":"v","l":["Словарь:","шуршать – птуудуроо","развалины – уранды","новогодний – жаны жылдык","филин – уку"]},{"t":"p","h":"Упражнение 93. Составьте по данной ниже схеме три предложения."},{"t":"p","h":"Образец: Ученики нашего класса летом работали на поле."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Подлежащее<\/td><td>сказуемое<\/td><\/tr><tr><td>управляемое<\/td><td>управляемое<\/td><td>примыкающее<\/td><\/tr><tr><td>слово<\/td><td>слово<\/td><td>слово<\/td><\/tr><tr><td>определение<\/td><td>определение<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"Упражнение 94. Перепишите. Вместо точек поставьте пропущенные слова в нужном числе, лице, роде, падеже. Слова для справок даны в конце упражнения."},{"t":"p","h":"1. Солнце скрылось за .... 2. Кооператив «Арал» построил уютные дома для .... 3. Советская ракета ... вымпел на Марс. 4. Первые подснежники показались из-под ...."},{"t":"p","h":"5. Коршун ... цыплёнка и скрылся за деревьями. 6. Луч прожектора ... переправу. 7. Кузнец тяжёлым ... стучал по .... 8. Большой камень скатился с ...."},{"t":"p","h":"Слова для справок: гора, осветить, наковальня, молот, снег, схватить, доставить, механизаторы, усадьба."},{"t":"p","h":"Словарь: переправа – откоел"},{"t":"v","l":["скатиться – кулануу, кулоо","наковальня – дошу","доставить – жеткизуу"]}],"sub":[{"title":"БАРС В КАПКАНЕ.","b":28}],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[60,62]},{"title":"§ 20. ПРОСТОЕ ПРЕДЛОЖЕНИЕ (Женекей суйлем.) ДВУСОСТАВНЫЕ И ОДНОСОСТАВНЫЕ ПРЕДЛОЖЕНИЯ.","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"63\">63<\/span>§ 20. ПРОСТОЕ ПРЕДЛОЖЕНИЕ (Женекей суйлем.) ДВУСОСТАВНЫЕ И ОДНОСОСТАВНЫЕ ПРЕДЛОЖЕНИЯ."},{"t":"p","h":"(Эки составдуу жана бир составдуу суйлемдер.) Вепомните:"},{"t":"p","h":"1. Какие члены предложения называются главными?"},{"t":"p","h":"2. Какие члены предложения являются второстепенными? Главные члены предложения – подлежащее и сказуемое – составляют ядро или основу предложения. Все остальные члены предложения зависят от подлежащего и сказуемого. Они подчиняются либо подлежащему, либо сказуемому. Так, например, для предложения Очень маленький мальчик рисует в тетради белый пароход мы построим такую схему:"},{"t":"img","src":"data:image/webp;base64,UklGRvgXAABXRUJQVlA4IOwXAADQeQCdASqAAqoAPrVUo04nJKOmItFMMOAWiWluc/haT/bD5/+6i/zkmt/h69fH/+h6EHp3Z/Ci//35el4t/PyOmK06PL/x+yP/mOpac5ZNjk4h4gFfVu/I/0V/FPr/9B6/VLv/keiv8t+235b+9cdfxt/xPUC/IP57/pPTAiice6APzP+pf9Tw8f9b0J+on/S9wD+X/17jQaAX9L/0/oVaaHzb/Vew3+wpDj3xLrapPHq5bhpNR2axVNm79SIzVK+ytFw3A3pabWhqQyN5w88xIf8aWemEqvfGX+XoUcOPprWB3tl8P/3yL "рисует."},{"t":"p","h":"Состав подлежащего – это подлежащее и те слова, которые ему подчинены (с тёми же словами, которые, в свою очередь, подчинены этим словам). В нашем примере в состав подлежащего входят слова: мальчик (подлежащее), согласованное с ним определение маленький и примыкающее к этому определению обстоятельство очень."},{"t":"p","h":"Состав сказуемого – это сказуемое и те слова, которые ему подчинены (с теми же словами, которые, в свою очередь, подчинены им). Напри мер, в рассматриваемом предложении в состав сказуемого входят, наряду со сказуемым рисует, подчинённое ему обстоятельство места <span class=\"pg\" data-n=\"64\">64<\/span>в тетради, управляемое сказуемым дополнение пароход и согласованное со словом пароход определение белый."},{"t":"p","h":"Если в основу предложения входят два главных члена, подлежащее и сказуемое, то оно называется двусоставным. Например, в предложении Я иду домой основу предложения составляют подлежащее я и сказуемое иду. В состав подлежащего входит только один член предложения, само подлежащее, а в состав сказуемого входит, кроме сказуемого, ещё и обстоятельство места домой. В этом предложении, следовательно, два состава и поэтому оно называется двусоставным."},{"t":"p","h":"Если в основе предложения только один главный член, то такое предложение называется односоставным. Так, например, в предложении На дворе очень холодно нет подлежащего. В этом предложении есть только состав сказуемого, в который входит сказуемое холодно и два обстоятельства, подчинённых ему: на дворе и очень. Поэтому такое предложение является односоставным."},{"t":"v","l":["Вопросы для повторения:",". Что входит в состав подлежащего?",". Что входит в состав сказуемого?",". Какой член предложения называется сказуемым?"]},{"t":"p","h":". Какие члены предложения составляют его основу (ядро)?. Какие предложения называются двусоставными?"},{"t":"p","h":". Какие предложения называются односоставными?"},{"t":"p","h":"Упражнение 95. Выпишите сначала двусоставные предложения, а затем – односоставные. Подчеркните в предложениях подлежащее одной чертой, сказуемое – двумя."},{"t":"p","h":"Дождь освежил природу. К утру подсохло. Стало тепло. Табуны двинулись в горы. Светило солнце. Пахло цветами и молодой травой. Резво шли навьюченные верблюды и кони. Сидели в сёдлах женщины и дети. Следом бежали собаки."},{"t":"p","h":"Шумно было в горах. И радостно было на душе Танабая. По Ч. Айитматову."},{"t":"p","h":"Словарь:"},{"t":"p","h":"навьюченный – жуктелген шумно – ызы-чуу"},{"t":"p","h":"<span class=\"pg\" data-n=\"65\">65<\/span>Упражнение 96. Составьте схемы следующих предложений. Рядом со схемами отметьте цифрой в скобках, сколько составов имеет каждое предложение."},{"t":"p","h":"1. Диктор передаёт сводку погоды каждый день. 2.`Цыплят по осени считают. 3. Киномеханик демонстрировал новый фильм. 4. Пахнет сеном над лугами. 5. Спортсмен очень переживал свою неудачу. 6. Нельзя нарушать трудовую дисциплину."},{"t":"p","h":"Словарь:"},{"t":"p","h":"переживать – кайгыруу неудача – жолу болбоо"}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[63,65]},{"title":"§ 21. ВЫРАЖЕНИЕ ПОДЛЕЖАЩЕГО.","blocks":[{"t":"h3","h":"§ 21. ВЫРАЖЕНИЕ ПОДЛЕЖАЩЕГО."},{"t":"p","h":"Повторить $5 5."},{"t":"p","h":"Вепомните:"},{"t":"p","h":"1. Какие члены предложения составляют основу (ядрд) предложения?"},{"t":"p","h":"2. Какой член предложения называется подлежащим?"},{"t":"p","h":"Чаще всего, как и в кыргызском языке, подлежащее в русском языке выражается именем существительным или личным местоимением в именительном падеже."},{"t":"p","h":"Например: Долгая зимняя ночь прошла незаметно. Наташа заговорила быстро, горячо и убедительно. Ты успел приготовить домашнее задание?"},{"t":"p","h":"В качестве подлежащего могут употребляться и другие местоимения, например, вопросительное местоимение кто: Кто нарисовал эту картину?"},{"t":"p","h":"Имена прилагательные и причастия, когда они заменяют существительное, тоже могут быть подлежащими. Они тоже употребляются в именительном падеже."},{"t":"p","h":"Например: Немногие вернулись с поля. Будущее принадлежит молодёжи. Имя числительное в именительном падеже может быть подлежащим. Например: Двое остались в коридоре. Шесть делится на два без остатка. Подлежащее может быть выражено глаголом в неопределённой <span class=\"pg\" data-n=\"66\">66<\/span>форме. Например: Учиться всегда пригодится. Курить – здоровью вредить."},{"t":"p","h":"В качестве подлежащего употребляются также некоторые сочетания слов. Во-первых, подлежащим может служить сочетание количественного числительного (в именительном падеже), а также слов много, несколько, сколько и т.д. с существительными (в родительном падеже единственного или множественного числа)."},{"t":"p","h":"Например: Шли два приятеля вечернею порой. В лесу раздавалось несколько голосов. Прошло пять дней."},{"t":"p","h":"Во-вторых, подлежащим может служить сочетание имени существительного или личного местоимения (в именительном падеже) с именем существительным или местоимением (в творительном падеже) с предлогом с. Например: Врач с медсестрой принимали больных. Мы с тобою дризья."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"1. Какими частями речи выражается чаще всего подлежащее?"},{"t":"p","h":"2. В каком падеже стоят имена существительные, прилагательные, числительные, а также местоимения и причастия, если они употреблены как подлежащие?"},{"t":"p","h":"3. Какие типы сочетаний слов выступают в качестве подлежащего?"},{"t":"p","h":"Упражнение 97. Спишите, подчеркните подлежащее."},{"t":"p","h":"1. В прошлом учебном году я окончил седьмой класс."},{"t":"p","h":"2. Носильщик внёс тяжёлые чемоданы в вагон. 3. Провожающие толпились у окна вагона. 4. Два разведчика перешли линию фронта. 5. Несколько фермеров привезли на рынок картофель и капусту. 6. Мать с дочерью стирали бельё в прачечной. 7. Кислота переливалась по трубке из одной колбы в другую. 8. Мать волнуется о своих детях."},{"t":"p","h":"9. Много тюльпанов расцвело в горах."},{"t":"p","h":"Словарь:"},{"t":"p","h":"толпиться – топтошуп туруу волноваться – толкундануу рынок – базар"},{"t":"p","h":"Упражнение 98. Спишите, вставляя пропущенные окончания подлежащих."},{"t":"p","h":"<span class=\"pg\" data-n=\"67\">67<\/span>1. Юные балерин... волновались во время выступления."},{"t":"p","h":"2. Три девиц... под окном пряли поздно вечерком. 3. Родители с деть... вышли на демонстрацию. 4. Вся стран... торжбственно отмётила День Победы. 5. Тракторист с помощник... выпустили стенгазету. 6. Прохож... впотьмах долго искал переулок. 7. Взросл... наблюдали за игрой детей."},{"t":"p","h":"8. Хозяйк... вскопала грядку под рассаду. 9. В подвале лопнула водопроводная труб... 10. Правд... с неправдой не уживаются."},{"t":"v","l":["Словарь:","прясть – ийируу, чыйратуу","отметить – белгилее","грядка – жеек","рассада – кочет","лопнуть – жарылуу"]},{"t":"p","h":"Упражнение 99. Допишите вторую половину подлежащих, выраженных сочетаниями слов. (Они даны в справке ниже упражнения)."},{"t":"p","h":"1. Бухгалтер с ... выдавали зарплату. 2. Трое ... вытаскивали невод из воды. 3. На ветке сидели два ...."},{"t":"p","h":"4. Доклад о хлопководстве подготовили агроном с ...."},{"t":"p","h":"5. Несколько ... упало с воза и разбилось. 6. Двадцать восемь .. не пропустили пятьдесят фашистских танков к Москве."},{"t":"p","h":"7. Дед с .. очень соскучились по внукам. 8. Четыре ... отличились на соревнованиях."},{"t":"p","h":"Слова для справок: рыбаки, кассир, чиж, инженер, панфиловцы, арбуз, бабушка, штангист."},{"t":"v","l":["Словарь:","","едины – бирдикте","соскучиться – сагынуу","чиж – боз чымчык","отличиться – мыктылык,","артыкчылык керсетуу"]},{"t":"p","h":"Упражнение 100. Переведите на русский язык. Подчеркните подлежащие."},{"t":"p","h":"1. Роза кыйын тапшырмаларды аткарды. 2. Мен жетинчи класста окуйм. 3. Бугун суук шамал болду. 4. Менин атам мугалим болуп иштейт. 5. Эжем – фабрикада инженер. <span class=\"pg\" data-n=\"68\">68<\/span>6. Кыргыз тоолору кенге бай. 7. Токтогул ГЭСи курулуп бутту. 8. Столдо шам куйуп турат."},{"t":"p","h":"Упражнение 101. Составьте предложения из следующих слов."},{"t":"p","h":"1. Самолёт, пролетать, над, город. 2. Кто, принести, географический, карта? 3. Никто, не хотеть, летом, быть, в, город. 4. Милиционер с овчаркой, идти, по, след, преступник. 5. Акмат, с, Асан, изготовить, модель, самолёт. 6. Несколько, девушки, танцевать, кыргызский, танец."},{"t":"p","h":"Словары:"},{"t":"p","h":"преступник – кылмышкер"},{"t":"p","h":"Упражнение 102. Прочитайте приведённые ниже слова. Вспомните, что они означают."},{"t":"p","h":"Бой, больно, бинт, вор, вред, ворона."},{"t":"p","h":"А тепёрь замените в этих словах б на в, ав на 6. Что стали означать слова тепврь? Если не знаете посмотрите в словаре."}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[66,68]},{"title":"§ 22. ГЛАГОЛЬНОЕ СКАЗУЕМОЕ.","blocks":[{"t":"h3","h":"§ 22. ГЛАГОЛЬНОЕ СКАЗУЕМОЕ."},{"t":"v","l":["Повторить $ 5, виды глагола.","","Вспомните:","1. Какой член предложения называется сказуемым?","2. Какие слова входят в состав сказуемого?"]},{"t":"p","h":"Сказуемое указывает, что делает предмет, что с ним делается, в каком он находится состоянии, что он собой представляет. Действие предмета лучше всего выражается глаголом. Поэтому чаще всего и сказуемое выражается глаголом. Например: Земля вращается вокруг Солнца. Мы требуем мира. Приходите к нам на праздник."},{"t":"p","h":"Такое сказуемое, состоящее из одного глагола, называется простым глагольным сказуемым."},{"t":"p","h":"Нередко сказуемое в русском языке составляется из двух глаголов. Например: Я начинаю учить уроки. В этом предложении сказуемое выражено двумя глаголами: начинаю <span class=\"pg\" data-n=\"69\">69<\/span>и учить. Вот ещё несколько таких предложений: Чолпон хочет рисовать. Бекиш кончил писать. Алмаз продолжает говорить."},{"t":"p","h":"Сказуемое в этих предложениях состоит из вспомогательного глагола (который согласуется с подлежащим в числе, а если возможно – в лице или роде) и неопределённой формы основного глагола."},{"t":"p","h":"Если вспомогательный глагол обозначает начало, конёц или продолжение действия (начать, стать, приняться, кончить, бросить, прекратить, продолжать и др.), то основной глагол всегда несовершенного вида. С другими вспомогательными глаголами основные глаголы бывают и совершенного и несовершенного вида. Например: Марат может рисовать. Марат может нарисовать."},{"t":"p","h":"Сказуемое, состоящее из вспомогательного глагола, называется составным глагольным сказуемым."},{"t":"p","h":"Вместо вспомогательного глагола в составном глагольном сказуемом могут употребляться также вспомогательные слова: должен, обязан, намерен, готов, рад."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"1. Какое сказуемое называется простым?"},{"t":"p","h":"2. Какое сказуемое называется составным глагольным?"},{"t":"p","h":"3. В чём согласуется вспомогательный глагол с подлежащим?"},{"t":"p","h":"4. Приведите несколько русских вспомогательных глаголов и вспомогательных слов, употребляемых в составных глагольных сказуемых."},{"t":"p","h":"5. С какими глаголами основной глагол бывает только несовершенного вида?"},{"t":"p","h":"Упражнение 103. Перепишите. Найдите в каждом предложении сказуемое и подчеркните его. Над составными глагольными сказуемыми надпишите сост."},{"t":"p","h":"1. Весенние ветры подули над Чуйской долиной. 2. Всё сильнее припекает солнце. 3. На тёплых склонах белеют первые подснежники. 4. Джамиля начала читать письмо (Ч. Айтматов). 5. Дюйшен каждое утро стоял около конюшни (Ч. Айтматов). 6. Река продолжала шуметь и бурлить после ливня. 7Т. Жандармы обыскали квартиру революционера. 8. С утра отец хотел приняться за работу."},{"t":"p","h":"<span class=\"pg\" data-n=\"70\">70<\/span>9. Прыгун разбегается и прыгает через планку. 10. Ветер начал трепать длинные волосы моего попутчика. 11. Жаворонок поёт над полями."},{"t":"v","l":["Словар

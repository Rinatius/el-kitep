t":"p","h":"5. Являются ли союзы членами предложения?"},{"t":"p","h":"6. Чем отличаются друг от друга союзы и союзные слова?"},{"t":"p","h":"7. На какие вопросы отвечает придаточное предложение?"},{"t":"p","h":"8. Чем отличаются придаточные предложения от членов предложения?"},{"t":"p","h":"9. Какие знаки препинания ставятся между простыми предложениями в сложноподчинённом предложении?"},{"t":"p","h":"Упражнение 308. Прочтите. Найдите сложноподчинённые предложения. Укажите, какое предложение в сложноподчиненном предложении. является главным, а какое – придаточным. Какие слова соединяют главное предложение с придаточным?"},{"t":"p","h":"Василиса Егоровна приняла нас чересчур радушно. Когда инвалид и Палаша накрывали на стол, вошла девушка лет восемнадцати. Светло-русые волосы были зачёсаны за <span class=\"pg\" data-n=\"202\">202<\/span>уши, которые у неё так и горёли. Это была Маша, капитанская дочь. Когда вошёл капитан, все сели за стол обедать. Василиса Егоровна говорила за обедом о том, что Маше пора выходить замуж. Когда я посмотрел на Машу, она испуганно взглянула на меня и вся покраснела. Желая переменить разговор, я сказал, что на крепость вроде собираются напасть башкирцы. Комендант ответил, что давно уже ничего не слыхать."},{"t":"p","h":"По А. Пушкину. Словарь:"},{"t":"p","h":"чересчур мында: оте эле"},{"t":"v","l":["радушно – суйменчуктуу","испуганно – чочулап","покраснеть – кызарып кетуу","вроде – кебетеси, болжолу"]},{"t":"p","h":"Упражнение 309. Следующие простые предложения замените сложноподчинёнными. Для этого замените выделенные обстоятельства группами слов, приведёяными в конце упражнения. Запишите получившиеся предложения, расставьте знаки препинания."},{"t":"p","h":"1. Отдохнув, путники спустились с перевала в долину."},{"t":"p","h":"2. Из любви к птицам дети сделали кормушки и насыпали в них зёрен. 3. При большом старании можно сделать многое. 4. Утром первые посетители пришли в отдел кадров завода. 5. Рано лишившись родителей, девочка воспитывалась в детском доме. 6. Заглянув в окно, Асанбай увидел своего друга Джапара."},{"t":"p","h":"Для вставки: когда путники отдохнули, если стараться, так как дети любили птиц, когда наступило утро, так как девочка рано лишилась родителей, когда Асанбай заглянул в окно."},{"t":"v","l":["Словарь:","спуститься – тушуу","старание – тырышуу, аракет кылуу","заглянуть в окно – терезеден кароо","отдел – белум","посетитель – келуучу"]},{"t":"p","h":"Упражнение 310. Дайте полные ответы на поставленные вопросы, используя сложноподчинённые предложения. Для ответов используйте слова, приведённые в столбике справа."},{"t":"p","h":"<span class=\"pg\" data-n=\"203\">203<\/span>Мой друг живёт там, где строится новый кинотеатр."},{"t":"v","l":["1. Где живёт твой друг?","","2. Когда прилетают","скворцы?","3. Почему в доме было","чисто и опрятно?","4. Что произойдёт, если"]},{"t":"p","h":"воду нагреть до 100 граду-"},{"t":"p","h":"сов?"},{"t":"p","h":"5. Где расположена пя-"},{"t":"v","l":["тая бригада колхоза?","Там, где строится","новый кинотеатр.","Тогда, когда наступает","весна.","Хозяйка ежедневно","мыла полы.","Вода закипит.","","Там, где горная река","впадает в озеро."]}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[200,203]},{"title":"§ 55. СЛлОЖНОПоОДЧиИнНЁННЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ МЕСТА.","blocks":[{"t":"h3","h":"§ 55. СЛлОЖНОПоОДЧиИнНЁННЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ МЕСТА."},{"t":"v","l":["(Орун багынынкы татаал суйлем.)","","Повторить $ 30.","","Вспомните:","1. Что поясняет придаточное предложение?","2. Чем отделяется придаточное предложение от главного?"]},{"t":"p","h":"3. В чём сходство и различие между придаточными предложе-"},{"t":"p","h":"и членами предложения?"},{"t":"p","h":"‚ В чём сходство и различие между союзами и союзными Придаточные предложения могут указывать место, где происходит действие главного предложения. Например: Павлик пошёл туда, откуда послышался голос друга. В этом сложноподчинённом предложении придаточное предложение поясняет, куда пошёл Павлик, то есть указывает место, куда было направлено действие главного предложения. Такие предложения называются придаточными места. Придаточные места обычно относятся к обстоятельству места в главном предложении, выраженному наречиями там, туда, оттуда и другими."},{"t":"p","h":"<span class=\"pg\" data-n=\"204\">204<\/span>При помощи союзного слова где с главным предложением соединяются придаточные, поясняющие место, где происходит действие, где находится что-то, о чём говорится в главном предложении. Например: 1. Кадыр живёт там, где кончается эта улица. 2. Ученики пошли туда, где деревья. 3. Оттуда, где работает Фёдор, письма идут долго."},{"t":"p","h":"При помощи союзного слова куда соединяются с главным такие придаточные места, которые указывают на место, куда направляется какой-нибудь человек или предмет. Например: 1. Я пошёл туда, куда позвал меня друг."},{"t":"p","h":"2. Усенбек живёт там, куда можно прилететь только на вертолёте."},{"t":"p","h":"Союзное слово откуда, соединяя придаточное предложение с главным, указывает на место, откуда направляется какой-то человек или предмет. Например: 1. Там, откуда слышны голоса, собрались экскурсанты. 2. Оттуда, откуда я приехал, получено письмо."},{"t":"p","h":"Таким образом, значение союзных слов где, куда, откуда различно."},{"t":"v","l":["куда откуда","","Сравните:","1. Там, где Асан вдет, стоит хорошая погода.","2. Там, куда Асан едет, стоит хорошая погода."]},{"t":"p","h":"3. Там, откуда Асан едет, стоит хорошая погода. В этих трёх предложениях главное предложение одинаково Там... стойт хорошая погода. Придаточные же предложбния уточняют обстоятельство места. При этом сами придаточные отличаются только союзными словами: где Асан едет; куда Асан едет; откуда Асан едет."},{"t":"p","h":"От изменения союзных слов меняется весь смысл предложения. В самом деле, представим, что Асан едет в поезде и вдет по Казахстану из Москвы в Бишкек. Где же стоит хорошая погода?"},{"t":"p","h":"В первом предложении с союзным словом где речь идёт о месте, где Асан едет сейчас, то есть сообщается, что <span class=\"pg\" data-n=\"205\">205<\/span>хорошая погода в Казахстане. Во втором предложении с союзным словом куда говорится, что хорошая погода стоит в Бишкеке, а в третьем – с союзным словом откуда, гово- в Москве. Так союзные рится, что хорошая погода слова могут серьёзно изменить значение предложения. Вопросы для повторения:"},{"t":"p","h":"1. Как называются придаточные предложения, указывающие на место действия главного предложения?"},{"t":"p","h":"2. Объясните разницу в значении союзных слов где, куда, откуда."},{"t":"p","h":"3. К какому члёну главного предложения относятся придаточные места?"},{"t":"p","h":"4. Какими словами обычно бывает выражено обстоятельство, к которому относится придаточное места?"},{"t":"p","h":"Упражнение 311. Выпишите сначала сложноподчинённые предложения с придаточными, связанными союзным словом 2де, потом – куда, потом – откуда. Подчеркните союзные слова. Уточните, где происходит действие предложений с разными союзными словами."},{"t":"p","h":"1. Для Вас нет опасности там, где я присутствую (А. Пушкин). 2. Куда ветер дунет, туда и дым пойдёт пословица). 3. Мальчишки побежали туда, откуда доносились звуки военного марша (А. Гайдар). 4. Там, где народы борются за свою независимость, звучат голоса правды."},{"t":"p","h":"5. Куда летят перелётные птицы, там всегда много солнца и пищи. 6. Самолёт с врачом полетел туда, откуда пришла срочная радиограмма. 7. Там, где ломался с грохотом лёд, поневоле было страшно (В. Саянов). 8. Оттуда, откуда мчался всадник, поввяло запахом гари (Г. Марков). Словарь: присутствовать – катышуу"},{"t":"v","l":["независимость – коз карандысыздык","гарь – куйук, куйкум (жыт)","поневоле – аргасыздан","мчаться – зымылдоо, жетип","келуу"]},{"t":"p","h":"Упражнение 312. Перепишите, вставляя в сложноподчиненные предложения с придаточными места вместо точек наречияобстоятельства и союзные слова."},{"t":"p","h":"1. Рис хорошо растёт ..., ... много воды и тепла. 2. Мирные люди бежали ..., „. настойчиво доносилась пулемётная <span class=\"pg\" data-n=\"206\">206<\/span>стрельба. 3. Путешественники остановились ..., ... Волга круто поворачивает направо. 4. Сын-доброволец пошёл служить ..., ... служил его отец. 5. Горная река вытекает ..., .. сползает ледник. 6. Научная экспедиция отправилась ..., ... археблоги нашли стоянку первобытных людей. 7. Танабай самоотверженно трудился ..., было особенно трудно."},{"t":"p","h":"Словарь: круто – чукул"},{"t":"v","l":["доброволец – оз ыктыяры","менен барган адам","стоянка – туруучу жай","самоотверженно трудиться – жан","аябай иштее"]},{"t":"p","h":"Упражнение 313. Из следующих групп слов составьте сложноподчинённые предложения с придаточными места."},{"t":"v","l":["где ...","1. Автобус остановился там,","","2. Школьники поедут туда,","","3. Самолёт прилетел оттуда, |","куда ...","откуда ...","где ...","куда ...","откуда ...","где ...","куда ...","откуда ..."]},{"t":"p","h":"Упражнение 314. Из данных слов составьте сложноподчинённые предложения с придаточными места."},{"t":"p","h":"1. Оттуда, мы, стоять, где, поверхность, озера, казаться, тёмно-синий. 2. Город Нижний Новгород, там, стоять, где, сливаться, Волга, и, Ока. 3. Хлеб, дать, высокий, урожай, там, есть, где, хороший, уход. 4. Рабочие, построить, железная дорога, там, где, непроходимый, тайга, быть."},{"t":"p","h":"5. Тучи, приходить, оттуда, откуда, дуть, холодный, ветер."},{"t":"p","h":"6. Туда, куда, лететь, саранча, лететь, и, розовый скворец."},{"t":"p","h":"7. Архары, обитать, там, куда, добраться, трудно человеку."},{"t":"p","h":"8. Там, где, подниматься, высокий, хребет, неподвижно, стоять, облака."},{"t":"v","l":["Словарь:","сливаться – кошулуу","уход (здесь: забота) – багуу","розовый скворец – ала чыйырчык","обитать – жить","<span class=\"pg\" data-n=\"207\">207<\/span>непроходимый – тунт, оте алгыс","саранча – чегиртке","неподвижно – кыймылдабай,","былк этпей"]},{"t":"p","h":"Упражнение 315. Переведите с русского языка на кыргызский. Закройте русский текст и сделайте обратный перевод с кыргызского на русский. Сравните то, что у вас получилось, с русским текстом. Исправьте ошибки."},{"t":"h3","h":"ПАСТУШОНОК КАНЫБЕК."},{"t":"p","h":"Там, где высится скала, стоит мальчик-пастушонок Каныбек. В окрестностях аила, где протекает небольшой ручей, пасётся отара. Мальчик смотрит туда, где живут его дед и бабушка. Отец Каныбёка когда-то приехал оттуда, где виднеются вершины Арпы. Где-то там, откуда восходит солнце, лежит город Кашгар. Его Узкие безобразные улицы начинаются оттуда, где растут тополя."},{"t":"p","h":"По К. Джантошеву."},{"t":"p","h":"Словарь:"},{"t":"p","h":"окрестности – четинде безобразный – керксуз, жаман"}],"sub":[{"title":"ПАСТУШОНОК КАНЫБЕК.","b":36}],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[204,207]},{"title":"§ 56. СЛОЖНОПОДЧИНЁННЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ ВРЕМЕНИ.","blocks":[{"t":"h3","h":"§ 56. СЛОЖНОПОДЧИНЁННЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ ВРЕМЕНИ."},{"t":"v","l":["(Мезгил багынынкы татаал суйлем.)","","Повторить $ 31.","","Вспомните:","1. Что называется предложением?"]},{"t":"p","h":"2. Как относятся друг к другу главные и придаточные предложения в составе сложноподчинённого предложения?"},{"t":"p","h":"3. Какие предложения называются придаточными места?"},{"t":"p","h":"4. Что называется обстоятельством времени?"},{"t":"p","h":"Придаточные предложения могут уточнять не только место действия главного предложения, но также указывать на время действия главного предложения. Такие придаточные предложения присоединяются к главному предложению при помощи союзов когда, пока и других. Придаточные <span class=\"pg\" data-n=\"208\">208<\/span>предложения, указывающие на время действия главного предложения, называются придаточными времени. Например: Когда учитель кончил объяснять новую тему, Сайра задала вопрос. Пока артист пел, все молчали."},{"t":"p","h":"Придаточные предложения времени часто отвечают на вопрос когда? Придаточные предложения времени в боль-"},{"t":"p","h":"случаев находятся до или после главного предложения и отделяются от него запятой."},{"t":"p","h":"По значению придаточные времени можно разделить на две группы."},{"t":"p","h":"Во-первых, придаточные предложения времени могут указывать на то, что действие главного предложения и действие придаточного происходят в одно и то же время. Такое значение выражается, когда придаточное присоединяется к главному союзом пока. Например: Пока мы возвращались домой, дождь прекратился (Биз уйго келгенче, катуу жамгыр басылды)."},{"t":"p","h":"Такое значение может выражать и союз когда. В этом случае сказуемыми и главного и придаточного предложений бывают обычно глаголы несовершенного вида, причём время глагола в главном и в придаточном предложениях должно совпадать. Например: Когда идёшь по снегу, снег под ногами скрипит. Когда я выполнял домашнее задание, брат и сестра молчали."},{"t":"p","h":"Во-вторых, действия главного предложения и придаточного предложения времени могут происходить в разное время. Так, если придаточное присоединено к главному союзом когда, сложноподчинённое предложение может показывать то, о чём говорится в главном предложении, произойдёт после того, как произойдёт действие придаточного предложения. Для этого в сказуемых обоих предложений употребляются глаголы совершенного вида. Например: Когда приехал из армии брат, все родственники и соседи пришли в наш дом. Когда прозвенит звонок, ученики сядут на свой места."},{"t":"p","h":"Придаточные предложения времени часто относятся к сказуемому главного предложения или к обстоятельству, выраженному нарёчием тогда и некоторыми другими словами. Например: Все зааплодировали <span class=\"pg\" data-n=\"209\">209<\/span>тогда (когда?), когда опустился занавес. Мы поедем к Коле тогда (когда?), когда он нас позовёт."},{"t":"p","h":"Задание. Дополните начатые конструкции так, чтобы получились сложноподчинённые предложения с придаточными времени."},{"t":"p","h":"1. Пока отец ужинал, .... 2. Когда поют солдаты, ...."},{"t":"p","h":"3. Пока врач осматривал больного, .... 4. Когда прозвенел третий звонок, .... 5. Пока шёл дождь, .... 6. Когда мальчик поднялся на Караульную гору, ....Т. Пока дед Момун седлал лошадь, .... 8. Когда скрылся за поворотом последний автомобиль, .... 9. Пока маралы пили воду, 10. Когда наступил вечер, .... 11. Ласточки прилетят тогда, ...."},{"t":"p","h":"12. После того как закончился снегопад, .... 13. Пока мама стирала бельё, .... 14. Подснежники появились тогда, ...."},{"t":"p","h":"15. После того как прошли тёплые дожди, .... 16. Моя мечта исполнится тогда, .... 17. После того как закончился концерт, .... 18. Пока стояла тёплая погода, .... 19. После того как пострбили новый Дворец культуры, .... 20. Победу одержишь только тогда,"},{"t":"p","h":"Упражнение 316. Перепишите. Найдите сложноподчинённые предложения с придаточными Подчеркните в них союзы. Объясните, когда происходит действие главного и придаточного предложений, соединённых союзами когда и пока."},{"t":"h3","h":"РАЗГОВОР У КОСТРА."},{"t":"p","h":"Когда закончилась военная игра, отряд расположился на ночлег у костра. Пока повара готовили ужин, ребята говорили о далёких походах. Они вспоминали тех смелых людей, которые сражались за счастье народа. Как живые, вставали перед ними герои. Они говорили слова, святые для каждого человека. – Я буду счастливым только тогда, когда будет свободным народ. – Эти слова сказал Чапаев. – Пока у меня в груди бьётся сердце, меня от народа не оторвать. – Эти слова написал Николай Островский. – Я иду на фронт, чтобы сражаться за Родину. – Так сказала Зоя Космодемьянская своей матери. – Мы прекратим борьбу только тогда, когда уничтожим фашистов. – Эта фраза принадлежит молодогвардейцам."},{"t":"p","h":"<span class=\"pg\" data-n=\"210\">210<\/span>До поздней ночи горел костёр, и допоздна сидели у костра юные бойцы. Они мысленно дали клятву жить так, как завещали им великие патриоты нашей страны."},{"t":"p","h":"По С. Борзенко."},{"t":"p","h":"Словарь:"},{"t":"p","h":"святой – ыйык мысленно – мында: ичинен завещать – осуят айтуу, керээз айтуу"},{"t":"p","h":"Упражнение 317. Выпишите сначала сложноподчиненные предложения, у которых действия главного и придаточного предложений происходят одновременно, а потом – предложения, в которых действие главного предложения происходит после действия придаточного."},{"t":"p","h":"1. Когда построили золоторудный комбинат, жизнь в горах изменилась. 2. Пока мать ходила в магазин, у Чука с Геком случилась неприятность (А. Гайдар). 3. Когда заведующий уехал, бригадир собрал рабочих на совещание (Е. Мальцев). 4. Пока Танабай пил кумыс, Джайдар сушила его мокрую гимнастёрку (Ч. Айтматов). 5. Когда рабочие заявили протёст, хозяин фабрики уволил их с работы (В. Фёдоров). 6. Когда наступает вечер, поворачиваю овец к дому (М. Элебаев). Т. Пока бензовозы поднимались на перевал, моторы перегрёлись (А. Сальников)."},{"t":"p","h":"Словарь;"},{"t":"p","h":"почин – саамалык, демилге протест – нааразылык заведующий – башчы"},{"t":"p","h":"Упражнение 318. Перепишите. Поставьте глаголы- сказуемые, взятые в скобки, в нужном времени, чтобы действия главного и придаточного предложений происходили одновременно."},{"t":"p","h":"1. Пока девушки (петь и танцевать), ансамбль комузистов (готовиться) к выступлению. 2. Когда (наступать) праздник, Айганыш (вспоминать) своего мужа Шамбета (Т. Сыдыкбеков). 3. Пока заведующий (беседовать) с посетителями, секретарь (печатать) на машинке постановление. 4. Когда Данияр и Джамиля (уходить) из аила, я (лежать) на земле и горько (плакать) (Ч. Айтматов)."},{"t":"p","h":"<span class=\"pg\" data-n=\"211\">211<\/span>5. Пока (готовиться) ужин, дед (рассказывать) мне сказки (Ч. Айтматов). 6. Когда Толгонай (возвращаться) с поля, ей навстречу из дома (выбегать) внуки (Ч. Айтматов)."},{"t":"p","h":"7. Пока я (ремонтировать) руль, девушка (стоять) около автомашины (Ч. Айтматов). 8. Когда диктор (сообщать) о полёте советского космического корабля, его (слушать) вся страна."},{"t":"p","h":"Упражнение 319. Перепишите. Поставьте глаголы-сказуемые придаточных предложений в форме совершенного вида, чтобы получилось, что действие главного предложения происходит после действия придаточного."},{"t":"p","h":"Образец: Когда Фатима закончит подготовительный факультет, она поступит в университет."},{"t":"p","h":"1. Когда Фатима (закончить) подготовительный факультет, она поступит в университет. 2. Когда (наступить) весна, тощие медведи покинули свои берлоги. 3. Когда мы (доказать) свою правду, народ пойдёт за нами (М. Горький). 4. Когда (закончиться) следствие, главный свидетель неожиданно уёхал в другой город (Л. Шейнин). 5. Когда (прийти) беда, робкие люди, как мыши, спрятались в кустах (Н. Островский). 6. Когда Швабрин (прочитать) песенку, он отрицательно отозвался о ней (А. Пушкин)."},{"t":"p","h":"7. Когда инженеры (создать) могучую технику, непроходимая тайга покорилась человеку (Г. Марков)."},{"t":"v","l":["Словарь:","подготовительный – даярдоо доказать – далилдее","покинуть – таштап кетуу","следствие – тергее","свидетель – кубе","робкий – коркок, жалтак","отрицательно отозваться – жаман","баа беруу, терс баалоо"]},{"t":"p","h":"Упражнение 320. Перепишите. Поставьте глаголы-сказуемые, взятые в скобки, в нужном виде и времени. Расставьте запятые."},{"t":"p","h":"1. Когда знаменитый музыкант (выйти) на сцену зрители (встретить) его бурными аплодисментами. 2. Пока Джапар (разговаривать) с отцом Джамиля (готовить) обед. 3. Когда Авдотья (получить) известие о гибели мужа на фронте она вначале (не поверить). 4. Когда щука (проглотить) <span class=\"pg\" data-n=\"212\">212<\/span>крючок рыбак от неожиданности (выронить) из рук удилище. 5. Когда звери (почуять) дым пожара они (покинуть) лес. 6. Пока мы наскоро (кормить) лошадей Дерсу Узала (чистить) свое ружье. Т. Когда отряд (прибыть) в Пишпек красноармейцы (получить) заслуженный отдых."},{"t":"v","l":["Словарь:","","известие – кабар, билдируу","проглотить – жутуп жиберу\\","выронить – туптуруп жиберуу","удилище – кайырмак жыгачы","наскоро – шашып-бушуп"]},{"t":"p","h":"Упражнение 321. Из данных простых предложений составьте сложноподчинённые предложения с придаточными времени и союзами когда и пока."},{"t":"p","h":"1. Стала развиваться наука. Началось великое преобразование природы. 2. готовила завтрак. Я помогал отцу ремонтировать пылесос. 3. Динара заметила подозритель- ного человека. Она к о нём пограничникам. 4. Костёр разгорался. Андрюша и Семетей ходили к ручью за водой. 5. Беркут налетбл на оленёнка. Мать-олениха стремительно выскочила из кустов и защитила своего детёныша."},{"t":"p","h":"6. Шоферы наскоро закусывали. На погрузку овощей прибыла группа школьников."},{"t":"p","h":"Словарь:"},{"t":"p","h":"преобразование – кайта езгертуу вооружённый – куралдуу подозрительный – шектуу налететь – учуп баратып тийуу разгораться – тутануу закусывать – шам-шум этуу"},{"t":"p","h":"Упражнение 322. Из следующих простых предложений образуйте сложные, произведя замвну выделенных обстоятельств времени придаточными предложениями времени."},{"t":"p","h":"Образец: Когда переходишь улицу, посмотри сначала налево, а потом направо."},{"t":"p","h":"1. При переходе улицы посмотри сначала налево, а потом направо. 2. После открытия выставки мы пойдём осматривать её экспонаты. 3. С наступлением темноты ночные хищники выходят на охоту. 4. При приближении экзаменов надо беречь каждый час."},{"t":"p","h":"<span class=\"pg\" data-n=\"213\">213<\/span>Упражнение 323. Из приведённых групп слов составьте сложноподчинённые предложения с придаточными времени."},{"t":"p","h":"1. Митя, подрасти, он, стать, сознательно, относиться, к, дело. 2. Дядя Павел, вернуться, с, Север, он, рассказать, забавный случай, из жизни, белые медведи. 3. Кожомкул, ожидать, попутная автомашина, гроза, прекратиться."},{"t":"p","h":"4. Джапар, выписаться, из, госпиталь, он, отыскать, друг."},{"t":"p","h":"5. Бригадир, получать, задание, рабочие, подбирать, необходимый, инструмент. 6. Змея, проглотить, лягушка, она, уползти, в, нора."},{"t":"v","l":["Словарь:","сознательно – тушунуп, билип","забавный – кызык, тамашалуу","попутная автомашина – ошол","керектуу жакка баруучу","автомашина","выписаться – чыгуу","подбирать – тандоо, тандап алуу","необходимый – зарыл"]},{"t":"p","h":"Упражнение 324. Перепишите текст. Расставьте знаки препинания. В сложноподчинённых предложениях найдите главные и придаточные предложения, подчеркните союзы."},{"t":"h3","h":"ШЁЛКОВЫЙ ПУТЬ."},{"t":"p","h":"Много веков назад торговые караваны из Европы в Китай двигались через Чуйскую долину. Этот путь был более удобным и выгодным потому что был намного короче и безопаснее. Когда Кавказские горы и седой Каспий оставались позади караваны верблюдов и мулов через Самарканд и Бухару направлялись к хребтам Тянь-Шаня. Чтобы защи- ТИТЬ товары от грабителей по бокам каравана ехали вооружённые всадники. Если встречался на пути колодец то запасались водой вдоволь. Несмотря на то что беспощадно палило солнце и лицо обжигали горячие ветры караваны упорно двигались вперёд."},{"t":"p","h":"Вот наконец и Чуйская долина. Там где сейчас стоит древняя башня Бурана когда-то находился большой караван- -сарай. Здесь уставшие люди и животные отдыхали и готовились к трудному переходу через горы. Достигнув Иссык-Куля опытные проводники поворачивали караваны к Нарыну и Ат-Баши. Ещё несколько дней пути – и за перевалом открывались ворота богатых китайских городов."},{"t":"p","h":"<span class=\"pg\" data-n=\"214\">214<\/span>Из Китая европейские купцы привозили много разных товаров, особенно шёлка, поэтому этот торговый путь назвали Шёлковым."},{"t":"p","h":"В. Данилов"},{"t":"p","h":"Словарь:"},{"t":"p","h":"вдоволь – много, в достаточном количестве"}],"sub":[{"title":"РАЗГОВОР У КОСТРА.","b":19},{"title":"ШЁЛКОВЫЙ ПУТЬ.","b":55}],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[208,214]},{"title":"§ 57. СЛОЖНОПОДЧИНЁННЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ ОБРАЗА ДЕЙСТВИЯ.","blocks":[{"t":"h3","h":"§ 57. СЛОЖНОПОДЧИНЁННЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ ОБРАЗА ДЕЙСТВИЯ."},{"t":"v","l":["(Сыпат багынынкы татаал суйлем.)","","Повторить $ 32, 48.","","Вспомните:"]},{"t":"p","h":"1. Какие предложения называются сложноподчинёнными?"},{"t":"p","h":"2. Какие предложения называются главными?"},{"t":"v","l":["3. Какие предложения называются придаточными?","4. Что поясняет обстоятельство образа действия?"]},{"t":"p","h":"Как и обстоятельство образа действия, придаточное предложение может пояснить, как, каким образом происходит действие в главном предложении. В главном предложении употребляется обычно наречие, обстоятельство образа действия так. Придаточное предложение образа действия относится обыкновенно к этому слову и часто присоединяется к главному предложению при помощи союзов как, что. Напримёр: Больной вёл себя так, как рекомендовал врач. Оратор говорил так громко, что все люди на площади его хорошо слышали."},{"t":"p","h":"Иногда в придаточном образа действия говорится о действии, с которым сравнивается действие главного предложения. Наприм 6р: Айша вошла в класс так, как обычно входила учительница. Чтобы усилить сравнение, к наречию так может быть добавлена частица же. Например: Айша вошла в класс так же, как обычно входила учительница."},{"t":"p","h":"<span class=\"pg\" data-n=\"215\">215<\/span>Если действие главного предложения сравнивается не с реальным действием, а только с возможным или даже с фантастическим, то придаточное предложение присоединяется к главному союзами словно, как будто или точно. Например: Мы стали оживлённо беседовать, как будто были давнд знакдмы. В комнате словно кто-то задёрнул занавески. Дети продолжали играть, точно они не слыхали зова матери."},{"t":"p","h":"Придаточное предложение образа действия часто (но не всегда) ставится в сложноподчинённом предложении после главного. Слвдует отличать придаточные предложения образа действия от сравнительных оборотов. В сравнительных"},{"t":"p","h":"нет сказуемых, а в придаточных предложениях они есть."},{"t":"p","h":"Сравните:"},{"t":"p","h":"Сложноподчинённое предложение Простое предложение со с придаточным образа действия."},{"t":"v","l":["Песня летела над","землёй, как летит птица.","Вопросы для повторения:","сравнительным оборотом.","Песня летела над","землёй, как птица."]},{"t":"p","h":"1. В чём отличие сложноподчинённых предложений от сложносочинённых?"},{"t":"p","h":"2. Какие виды придаточных предложений вы знаете?"},{"t":"p","h":"3. Что поясняет придаточное предложение образа действия?"},{"t":"p","h":"4. К какому слову в главном предложении часто относится придаточное образа действия?"},{"t":"p","h":"5. Какими союзами присоединяется придаточное предложение образа действия к главному предложению?"},{"t":"p","h":"6. Какое значение имеют придаточные предложения с союзами словно, точно, как будто?"},{"t":"p","h":"7. Как отделяются на письме главные и придаточные предложения?"},{"t":"p","h":"Упражнение 325. Перепишите. В сложноподчинённых предложениях с придаточными образа действия подчеркните союзы."},{"t":"p","h":"1. Дед Момун жил так, как живут простые люди."},{"t":"p","h":"2. Голова матери низко наклонилась, точно тяжёлое горе легло на плечи (М. Горький). 3. Луна сияла так, словно кто-то почистил её щёткой (В. Саянов). 4. Когда прошла <span class=\"pg\" data-n=\"216\">216<\/span>горечь обиды, Андрей решил помириться с Ольгой (Е. Мальцев Ветер хлопнул дверью так, что задрожали деревянные стены дома (К. Паустовский). 6. Пар от горячих источников поднимался над ущельем, как сизый дым костров (Н. Пржевальский). Т. Воробьи в это зимнее утро чирикали так, как будто давно наступила весна (М. Пришвин). 8. В Центральной Азии изменяется климат, потому что Аральское море наполовину высохло."},{"t":"p","h":"Словарь:"},{"t":"p","h":"горечь – ызалык помириться – элдешу\\у, таттуулашуу"},{"t":"p","h":"Упражнение 326. Вставьте вместо точек пропущенные союзы что, как, а также наречие так."},{"t":"p","h":"1. Боец поступил ..., ... приказал ему командир. 2. Алеёша испугался ..., Лицо его побледнело. 3. Оля и Раушана встретились ... ... встречаются близкие подруги. 4. Мороз обжигал щёки ... ‚, ... на глазах выступали слёзы. 5. Коршун налетёл на цыплёнка ... ... налетает разбойник. 6. Танабай тосковал ..., ... тоскует мать по родному сыну. 7. Мальчики кричали .. громко, ... испуганные журавли перелетели на другое место."},{"t":"v","l":["Словарь:","испугаться – коркуу тосковать – кусалануу","разбойник – каракчы"]},{"t":"p","h":"Упражнение 327. Составьте из следующих простых предложений сложноподчинённые предложения с придаточными образа действия. Расставьте знаки препинания. Для этого используйте союзы как, что, как будто и, где нужно, слово так."},{"t":"p","h":"1. Росинки в траве блестят. Блестят алмазы на ладони."},{"t":"p","h":"2. Товарищ убеждал моего брата. Брат невольно согласился."},{"t":"p","h":"3. Горы были высокими и белыми. Тысячи белых лебедей опустились на их вершины. 4. Парни и девушки веселились. Обычно веселится молодёжь. 5. Мартышка бросила очки. Засверкали брызги. 6. Тропинка извивается. Извивается змея. 7. Ребёнок заплакал. Кто-то испугал его. 8. Лев зарычал. Все другие звери притихли. 9. Асан смутился. Он забыл назвать своё имя."},{"t":"p","h":"<span class=\"pg\" data-n=\"217\">217<\/span>извиваться – ийри-буйру болуу убеждать – ишендир\\у"},{"t":"v","l":["невольно – айласыздан,","аргасыздан"]},{"t":"p","h":"Упражнение 328. Допишите следующие предложения, сравнивая действия главных предложений с действием предметов, упомянутых в скобках, так, чтобы у вас получились сложноподчинённые предложения с придаточными образа действия и предложения со сравнительными оборотами."},{"t":"p","h":"Образец: Весеннее солнце улыбается так, как улыбается ребёнок. Весеннее солнце улыбается, как ребёнок."},{"t":"p","h":"солнце улыбается ... (ребёнок). 2. Мы полетим в космос ... (Гагарин). 3. Усенбек читал стихи ... (артист). 4. Обоз двигался .. (черепаха). 5. Спутник сверкает ... (звезда). 6. Бейшегуль одевается ... (модница)."},{"t":"p","h":"7. Разведчик прополз ... (уж)."},{"t":"p","h":"Словарь:"},{"t":"raw","h":"<h4 class=\"mk\">черепаха – ташбака уж – сарыжылан<\/h4>"},{"t":"p","h":"модница (от модник) – модачыл,"},{"t":"p","h":"борумчул"}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[215,217]},{"title":"§ 58. сложЖноподчинЕННЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ ПРИЧИНЫ.","blocks":[{"t":"h3","h":"§ 58. сложЖноподчинЕННЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ ПРИЧИНЫ."},{"t":"v","l":["(Себеп багынынкы татаал суйлем.)","","Повторить $ 38.","Вспомните:","1. Какие типы придаточных предложений вы знаете?"]},{"t":"p","h":"2. Какие обстоятельства называются обстоятельствами причины? Придаточные предложения, которые указывают на причину или обоснование того, о чём говорится в главном предложении, называются придаточными предложениями причины. Они связываются с главными предложениями чаше всего союзами потому что, оттого что, так как. Например: Водитель остановил комбайн, потому что <span class=\"pg\" data-n=\"218\">218<\/span>начался дождь. Омор не сказал правду, оттого что он струсил. Садовник обрезал сухие ветки, так как они мешали расти яблоне."},{"t":"p","h":"Такие придаточные обычно ставятся после главного предложения и отделяются от него запятой."},{"t":"p","h":"После главного предложения ставятся также придаточные причины с устаревшим союзом ибо, который можно встретить в произведениях писателей века. Например: Создать язык невозможно, ибо егбд творит народ (В. Белинский)."},{"t":"p","h":"В деловых бумагах иногда используют союз ввиду того что. Придаточное с этим союзом может стоять в начале сложноподчинённого предложения. Например: Ввиду того что сберкасса закрыта, деньги можно получить на почте."},{"t":"p","h":"Задание. Дополните начатые конструкции так, чтобы получились сложноподчинённые предложения с причинными союзами потому что, оттого что, так как."},{"t":"p","h":"1. На Луне нет жизни, ....2. Максим Горький с детства любил книги, .... 3. Горные реки вышли из берегов, ...."},{"t":"p","h":"4. Некрасов без сожаления ушёл из отцовского дома, ...."},{"t":"p","h":"5. Морская вода непригодна для питья, .... 6. Ночью я неожиданно проснулась, .... Т. Пушкин любил бывать в Михайловском, .... 8. Беркуты парят высоко над землёй, ... 9. Овощи и фрукты моют перед едой, ...."},{"t":"p","h":"Упражнение 329. Прочтите. Найдите и выпишите сложноподчинённые предложения с придаточными причины. Союзы подчеркните."},{"t":"h3","h":"ДЕТИ ВОЕННОГО ЛЕНИНГРАДА."},{"t":"p","h":"Зимой стало очень трудно, потому что враг окружил город. Не работали электростанции, оттого что закончилось топливо. Остановились трамваи, потому что прекратилась подача электроэнергии. По улицам опасно было ходить, так как фашистские негодяи обстреливали город из тяжёлых пушек. Но ленинградцы сражались так, как сражаются герои, уверенные в победе. Взрослым помогали дети. Мальчики на заводах изготовляли снаряды и мины. Девочки <span class=\"pg\" data-n=\"219\">219<\/span>в госпиталях ухаживали за ранеными. Юные тимуровцы носили из Невы воду, потому что старики и больные не могли дойти до реки."},{"t":"p","h":"Ленинградцы победили врага, потому что им помогала вся страна. Ленинград стал городом- героем. И подлинными героями стали ленинградские дети."},{"t":"p","h":"По В. Конецкому Словарь:"},{"t":"raw","h":"<h4 class=\"mk\">топливо – отун негодяй – митаам<\/h4>"},{"t":"p","h":"уверенный ишеничту\\ подлинный – чыныгы, анык Упражнение 330. Составьте сложные предложения, взяв из"},{"t":"p","h":"столбика слова для главных предложений, а из правого – слова для придаточных предложений причины. Расставьте знаки препинания."},{"t":"v","l":["1. В вагоне стало тихо.","","2. Трудолюбивые пчёлы"]},{"t":"p","h":"1. Наступила пора медо-"},{"t":"p","h":"сбора."},{"t":"p","h":"2. Все пассажиры начали"},{"t":"p","h":"дремать."},{"t":"p","h":"3. Царь не любил Пушкина. 3. Дрова были сырые."},{"t":"p","h":"4. Великий поэт воспевал 4. Костёр долго не разго-"},{"t":"v","l":["рался.",".","5. Геологи заблудились в","тайге.","свободу.;","5. Вратарь поймал мяч. ратар"]},{"t":"p","h":"6. Футболист не забил гол. 6. Испортился компас."},{"t":"p","h":"Словарь:"},{"t":"p","h":"трудолюбивый – эмгекчил, воспевать – мактап ырдоо"},{"t":"p","h":"эмгекти суйген"},{"t":"p","h":"Упражнение 331. Перепишите, вставляя подходящие союзы, соединяющие придаточные предложения причины с главными предложениями."},{"t":"p","h":"1. Наша страна – многонациональное государство, ней живут приблизительно девяносто разных народов."},{"t":"p","h":"2. Тарас Бульба застрелил Андрия, ... он изменил Родине."},{"t":"p","h":"<span class=\"pg\" data-n=\"220\">220<\/span>3. Урок литературы прошёл интересно, ... мы слушали грампластинку с голосами писателей. 4. Мальчики притихли, .. за рекой послышались печальные крики совы."},{"t":"p","h":"5. Дикие кабаны зимуют в Арсланбобе, ... здесь много орехов и желудей. 6. Лягушки нырнули в воду, ... по болоту шагала цапля."},{"t":"v","l":["Словарь:","приблизительно – чамасында","изменить – чыккынчылык кылуу","послышаться – угулуу","цапля – коккытан"]},{"t":"p","h":"Упражнение 332. Придумайте и допишите придаточные предложения причины."},{"t":"p","h":"1. Мать по телефону вызвала врача, .... 2. Уходя на работу, сестра взяла зонтик, .... 3. Листва на деревьях начала желтеть, .... 4. Герасим утопил Муму, .... 5. Кони жадно пили воду, .... 6. Автоинспектор остановил автобус, ...Т. Девочка соскучилась по бабушке, ...."},{"t":"v","l":["Словарь:","соскучиться – сагынуу, кусалануу"]},{"t":"p","h":"Упражнение 333. Перепишите, заменяя выделенные обстоятельства придаточными причины."},{"t":"p","h":"Образец: Самолёт из Бишкека не прилетел, потому что изменилась погода."},{"t":"p","h":"1. В связи © изменением погоды самолёт из Бишкека не прилетел. 2. Бригада сталеваров получила премию за хорошую работу. 3. Перекочёвка скота приостановилась из-за большого снегопада. 4. Статья не была напечатана по причине допущенной ошибки. 5. Председатель объявил собрание закрытым ввиду отсутствия вопросов. 6. Доклад не состоялся из-за болезни докладчика."},{"t":"p","h":"Упражнение 334. Заготовьте три объявления с союзом ввиду того что о работе школьного буфета, о подписке на газеты, о посещении кино."},{"t":"p","h":"Упражнение 335. Переведите с кыргызского языка на русский, используя сложноподчинённые предложения с придаточными причины."},{"t":"p","h":"<span class=\"pg\" data-n=\"221\">221<\/span>1. Трактор иштебейт, анткени мотору бузулуп калды."},{"t":"p","h":"2. Кун суук болгондуктан, биз жылуу кийинип чыктык."},{"t":"p","h":"3. Мен кыскача гана суйлеймун, анткени убакыт кутпейт."},{"t":"p","h":"4. Мария жакшы иштегени учун, баалуу сыйлык алды."},{"t":"p","h":"Упражнение 336. Составьте по одному сложноподчинённому предложению с придаточными: а) места; 6) времени; в) образа действия; г) причины."}],"sub":[{"title":"ДЕТИ ВОЕННОГО ЛЕНИНГРАДА.","b":11}],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[218,221]},{"title":"§ 59. СЛлОЖнНоОПоОДЧиИнНЁННЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ ЦЕЛИ.","blocks":[{"t":"h3","h":"§ 59. СЛлОЖнНоОПоОДЧиИнНЁННЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ ЦЕЛИ."},{"t":"v","l":["(Максат багынынкы татаал суйлем.)","","Повторить $8 34.","Вспомните:"]},{"t":"p","h":"1. Какие придаточные предложения называются придаточными места, придаточными времени, придаточными причины?"},{"t":"p","h":"2. Какие обстоятельства называются обстоятельствами цели?"},{"t":"p","h":"3. При помощи какого союза часто вводится неопределенная форма глагола в роли обстоятельства цели?"},{"t":"p","h":"Придаточные предложения цели, как и обстоятельства цели, указывают на цель действия. Придаточные предложения цели соединяются с главными предложениями при помощи союзов чтобы, для того чтобы. Например: Соня налила в вазу свежей воды, чтобы цветы не завяли. Я приехала в аил, для того чтобы в этот день быть с моим народом (Ч. Айтматов)."},{"t":"p","h":"Придаточные предложения цели следует отличать от обстоятельств цели с союзом чтобы. В придаточном предложении цели есть обычно главные предложения или хотя бы один из них, а обстоятельство цели, в состав простого предложения союзом чтобы, выражается только неопределённой формой глагола."},{"t":"v","l":["Сравните:","Чаргын принёс воды,","чтобы напиться:","Чаргын принёс воды,","чтобы мать напилась."]},{"t":"p","h":"<span class=\"pg\" data-n=\"222\">222<\/span>В левом столбике выделено обстоятельство цели, выраженное неопределённой формой глагола, а в правом столбике – придаточное предложение цели. В нём есть подлежащее (мать) и сказуемое (напилась)."},{"t":"p","h":"Придаточные предложения цели могут стоять до или после главного предложения. Например: Для того чтобы ученики научились решать задачи по физике, учитель задал им большое домашнее задание. Учитель задал ученикам большое домашнее задание, чтобы они научились решать задачи по физике. В данных примерах обратите внимание на существительное ученики и местоимение они. В первом по порядку предложении употребляется существительное, а во втором его можно заменить местоимением, это не зависит от того, является первое предложение главным или придаточным."},{"t":"p","h":"Задание. Дополните начатые конструкции так, чтобы получились сложноподчинённые предложения с придаточными цели."},{"t":"p","h":"1. Чтобы наша страна богатела, .... 2. Чтобы не испачкать новые учебники, .... 3. Чтобы сырые дрова хорошо горёли, .... 4. Чтобы выпускать высококачественную продукцию, .... 5. Чтобы укрепить здоровье, .... 6. Чтобы телевизор хорошо принимал программу, 7. Чтобы защитить город от грозных селей, .... 8. Чтобы сохранить от истребления диких животных и птиц, .... 9. Чтобы всё знать, .... 10. Чтобы зубы не болели, ...."},{"t":"p","h":"Упражнение 337. Перепишите. Союзы, присоединяющие придаточные цели, подчеркните двумя чертами, а союзы, присоединяющие обстоятельства цели, – одной чертой."},{"t":"p","h":"1. Чтобы ягнята не замёрзли, Танабай и Джайдар перенесли их в юрту (Ч. Айтматов). 2. Чтобы поправить здоровье, старый шахтёр поехал на курорт «Джеты-Огуз»."},{"t":"p","h":"3. Рабочие объявили забастовку, чтобы хозяин отменил незаконный налог (В. Фёдоров). 4. Чтобы отвлекать народ от борьбы, попы придумали разные религиозные праздники (Ф. Достоевский). 5. Андрей открыл клапан, для того чтобы сжатый воздух вышел из котла (В. Ажаев). 6. Павел напал на конвоира, чтобы освободить Жухрая (Н. Островский)."},{"t":"p","h":"<span class=\"pg\" data-n=\"223\">223<\/span>7. Девушка поглядела в зеркало и мотнула головой, чтобы бусы зазвенели (А. Чехов). 8. Чтобы колено не болело, старик долго парил его в бане (Г. Марков)."},{"t":"v","l":["Словарь:","поправить (здоровье) – саламат- религиозный – динчил","тыгын чындоо"]},{"t":"p","h":"налог – налог, салык отвлечь – алагды кылуу,"},{"t":"p","h":"кенулун башкага буруу сжатый воздух – кысылган аба мотнуть – башын чайкоо"},{"t":"p","h":"Упражнение 338. Составьте сложноподчиненные предложения с придаточными цели, используя следующие пары простых предложений и союзы чтобы, для того чтобы."},{"t":"p","h":"1. В саду дымили костры. Мороз не повредил плодовые деревья. 2. Соня надела тёмные очки. Солнце не слепило глаза. 3. Чайник быстро закипел. Мальчики подбросили |: огонь еловых шишек. 4. Пограничники пошли напрямик через болото. Шпион не ушел от преследования. 5. Рана не загрязнилась. Медсестра смазала руку йодом. 6. Чабан всю ночь сторожил отару. Волк не зарбзал овцу."},{"t":"p","h":"Словарь:"},{"t":"p","h":"слепить глаза – кезду уялтып жиберуу напрямик – туура, туз"},{"t":"p","h":"Упражнение 339. Дайте полные ответы на поставленные вопросы. В тех ответах, где вы использовали сложноподчинённые предложения с придаточными цели, подчеркните союзы."},{"t":"p","h":"1. Зачем мы изучаем русский язык?"},{"t":"p","h":"2. С какой целью семиклассники разучили новые песни и стихи?"},{"t":"v","l":["3. Для чего Асан подал учителю свой дневник?","4. С какой целью колхозники удобряют поля?"]},{"t":"p","h":"5. Зачем Тарёс Бульба повёз сыновей в Запорожскую Сечь?"},{"t":"p","h":"Упражнение 340. В следующих сложноподчинённых предложениях поменяйте местами главное и придаточное предложения. Измените при этом выделенные слова так, чтобы сначала было употреблено существительное, а потом местоимение."},{"t":"p","h":"<span class=\"pg\" data-n=\"224\">224<\/span>Образец: Чтобы пуговица не оторвалась, я крепко пришил её к куртке. – Я крепко пришил пуговицу к куртке, чтобы она не оторвалась."},{"t":"p","h":"1. Чтобы пуговица не оторвалась, я крепко пришил её к куртке. 2. Чтобы отец не опоздал на самолёт, мать разбудила его рано утром. 3. Брат купил Светлане фотоаппарат, чтобы она научилась фотографировать. 4. Чтобы котёнок не мяукал, Роза накормила его молоком. 5. Чтобы горячий борщ не остыл, повар перелил егб в большой термос."},{"t":"p","h":"Упражнение 341. К данным придаточным предложениям цели допишите главные предложения."},{"t":"p","h":"1. Чтобы стенгазвта вышла в срок, .... 2. Чтобы весь класс написал диктант без ошибок, .... 3. Чтобы комбайн исправно работал, ....4. Чтобы в доме было чисто и уютно,"},{"t":"p","h":". 5. Чтобы мясо не испортилось, ...."}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[222,224]},{"title":"§ 60. СЛОЖНОПОДЧИНЁННЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ УСЛОВНЫМИ.","blocks":[{"t":"h3","h":"§ 60. СЛОЖНОПОДЧИНЁННЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ УСЛОВНЫМИ."},{"t":"v","l":["(Шарттуу багынынкы татаал суйлем.)","Повторить $ 48, 58.","","Вспомните:"]},{"t":"p","h":"1. Из каких предложений состоит сложноподчинённое предложение?"},{"t":"p","h":"2. На какие вопросы отвечает придаточное предложение?"},{"t":"p","h":"3. Какие предложения называются придаточными причины? Придаточные предложения могут указывать условие, при котором происходит или может происходить действие главного предложения. Таково, например, предложение Мир сохранится, если народы всех стран будут настойчиво бороться против войны. В нём придаточное предложение указывает на условие, при котором может произойти действие главного предложения. Такие придаточные предложения называются условными."},{"t":"p","h":"<span class=\"pg\" data-n=\"225\">225<\/span>Условные придаточные предложения часто присоединяются к главному при помощи союза 6сли. Когда условное придаточное стоит перед главным предложением, в главном предложении может быть употреблён союз то. Нап риме р: Если ты не будешь поливать цветы, то они могут засохнуть."},{"t":"p","h":"Союз если означает, что условие кажется говорящему вполнё редльным, вполнё возможным. Когда нужно указать, что Это условие только желательно, что оно может осуществиться, а может и не осуществиться, то к союзу если добавляется частица бы (6). Глагол-сказуемое в придаточном предложении стоит в этом случае в форме прошедшего времени. Если бы Даир захотел, он мог бы хорошод учиться."},{"t":"p","h":"В значении если иногда в сложноподчинённых предложеёниях с придаточными условными употребляется союз когда (когда бы). Например: Когда в товарищах согласья нет, на лад их дело не пойдёт (И. Крылов). Обычно союз когда в условном значении используется в разговорной речи."},{"t":"p","h":"Условные придаточные предложения чаще всего стоят перед главным предложбнием или после него и отделяются от главного предложения запятой. Например: Если каждый из нас вырастит дерево, то в нашей стране станет много садов. Пурга не страшна, если человек не будет её бояться."},{"t":"p","h":"Условные придаточные предложения отвечают на вопрос при каком условии? Ими можно заменить в простом предложении обстоятельства условия."},{"t":"v","l":["Сравните, например:","Простое предложение"]},{"t":"p","h":"с обстоятельством условия."},{"t":"p","h":"При нагревании кусок металла увеличивается в объёме."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"Сложноподчинённое предложение с придаточным условным."},{"t":"p","h":"Если ты станешь нагревать кусок металла, то он увеличится в объёме."},{"t":"p","h":"1. Какие предложения называются сложноподчинёнными?"},{"t":"p","h":"2. Какие предложения называются придаточными условными?"},{"t":"p","h":"<span class=\"pg\" data-n=\"226\">226<\/span>3. Назовите наиболее употребительный союз в придаточных условных предложениях."},{"t":"p","h":"4. Как изменится значение придаточного условного предложения, если к союзу если добавить частицу бы?"},{"t":"p","h":"5. Какова форма глагола-сказуемого придаточного предложения, 6сли в нём стоит союз если бы?"},{"t":"p","h":"6. В какой форме употребляется сказуемое главного предложения, 6сли в придаточном условном предложении употреблён союз если бы?"},{"t":"p","h":"7. Где обычно стоит придаточное условное предложение?"},{"t":"p","h":"Упражнение 342. Перепишите. Найдите сложноподчинённые предложения с придаточными условными. Что обозначают придаточные условные? Найдите в них союзы. Укажите разницу в значении предложений с союзами если и если бы."},{"t":"h3","h":"ДЕПУТАТ ЖОГОРКУ КЕНЕША."},{"t":"p","h":"Зуура Осмонова – депутат Жогорку Кенеша. Народ избрал её депутатом, потому что она добросовестно относится к труду. Зуура не только управляет государством, но и активно участвует в общественной работе. Если строится новая больница, депутат помогает строительству. Если плохо учатся ученики, она вызывает родителей и учеников на беседу. Если в какой-либо семье случится беда, Зуура побывает и здесь. Она всегда найдёт доброе слово или даст добрый совет."},{"t":"p","h":"Однажды в горах прошли сильные снегопады. Чтобы не погиб скот, Зуура поспешила на зимние пастбища. Она умело организовала подвоз и распределение кормов. Если бы депутат не приехала вовремя, чабаны с отарами попали бы в трудное положение."},{"t":"p","h":"Зуура Осмонова живёт и трудится так, как подсказывают ей её честь и совесть."},{"t":"p","h":"По Ф. Самохину. Упражнение 343. Выпишите сложноподчинённые предложения с придаточными условными. Подчеркните одной чертой союз если. Двумя чертами подчеркните союз то в главном предложении. Расставьте знаки препинания."},{"t":"p","h":"1. Если бы я мог удержать своё негодование то ссоры не произошло бы (А. П ушкин). 2. Если потихоньку подползти <span class=\"pg\" data-n=\"227\">227<\/span>к оврагу то можно увидеть детёнышей лисы. 3. За рыбаками полетел вертолёт потому что льдина далеко удалилась от берега (В. Конецкий). 4. Если ты будешь упорно трудиться то сможешь добиться любой цели. 5. Чтобы завод выполнил план рабочие договорились работать в воскресенье (В. Ажаев). 6. Когда попадёшь в беду то зови друга на помощь. 7. Если бы родители купили мне магнитофон то я записал бы самые любимые песни и мелодии."},{"t":"v","l":["Словарь:","негодование – кыжырдануу"]},{"t":"p","h":"упорно – мында: талыкпастан, тынбастан добиться – жетишуу Упражнение 344. Превратите следующие простые предложения в сложноподчинённые с придаточными условными. Для этого замените выделенные обстоятельства условия придаточными условными предложениями. Для вставки используйте придаточные предложения, данные в конце."},{"t":"p","h":"Образец: Если ты будешь серьёзно относиться к учёбе, тебя будут уважать люди."},{"t":"p","h":"1. При серьёзном отношении к учёбе тебя будут уважать люди. 2. При нашем появлении белка тотчас же пряталась в дупло. 3. В большие снегопады сайгаки безбоязненно приходили в целинный совхоз. 4. При отсутствии ветра половина растений осталась бы без семени. 5. При ярком сиянии луны озеро сверкает тысячами огней. 6. При головной боли люди обращаются к врачу."},{"t":"p","h":"Предложения для вставки: если ты будешь серьёзно относиться к учёбе, если были большие снегопады, если мы появлялись, если бы не было ветра, если ярко сияет луна, если болит голова."},{"t":"v","l":["Словарь","безбоязненно коркпой ярко – жаркырап"]},{"t":"p","h":"Упражнение 345. Составьте сложноподчинённые предложения с придаточными условными, взяв из второго столбика главные предложения, а из первого столбика – придаточные условные. Соедините их союзами."},{"t":"p","h":"<span class=\"pg\" data-n=\"228\">228<\/span>Если ты сегодня очень торопишься, мы поговорим в другой раз."},{"t":"p","h":"1. Ты сегодня очень торо-"},{"t":"v","l":["пишься.","2. Воды Иртыша и Оби","потекут на юг.","3. Акмат будет усиленно","заниматься.","4. Температура воды"]},{"t":"p","h":"Мы поговорим в другой раз."},{"t":"p","h":"Они оросят миллионы гектаров сухих земель."},{"t":"p","h":"Он успешно сдаст все экзамены."},{"t":"p","h":"Вода обязательно препонизилась до нуля градусов. вратилась бы в лёд."},{"t":"v","l":["5. Будешь терпеливо","ухаживать за кактусом. Он зацветеёт.","Словарь:","усиленно – бут кучун уреп"]},{"t":"p","h":"Упражнение 346. Переведите с русского языка на кыргызский. Закройте русский текст и сделайте обратный перевод с кыргызского языка на русский. Сравните, что получилось с первоначальным текстом. Исправьте ошибки."},{"t":"p","h":"1. Если наш класс соберёт 200 тонн металлолома, то мы поедем в Москву. 2. Если мы пойдём в Большой театр, то возьмём красивые цветы. 3. Если бы друзья помогли мне, я закончил бы работу в срок. 4. Лена сфотографирует заседание редколлегии, если Руслан принесёт фотоаппарат."},{"t":"p","h":"5. Джумабек дочитал бы книгу до конца, если бы Осмон принёс её в библиотеку."}],"sub":[{"title":"ДЕПУТАТ ЖОГОРКУ КЕНЕША.","b":24}],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[225,228]},{"title":"§ 61. сложноподчинЁННыЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ УСТУПИТЕЛЬНЫМИ.","blocks":[{"t":"h3","h":"§ 61. сложноподчинЁННыЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ УСТУПИТЕЛЬНЫМИ."},{"t":"p","h":"(Карама-каршы багынынкы татаал суйлем.)"},{"t":"p","h":"Повторить $ 49, 56, 58."},{"t":"v","l":["Вспомните:","1. Какие типы придаточных предложений вы знаете?"]},{"t":"p","h":"2. Каково значение сложносочинённых предложений с союзами а, но, однако?"},{"t":"p","h":"<span class=\"pg\" data-n=\"229\">229<\/span>В сложноподчинённых предложениях главное предлож6ние может сообщать о чём-то противоположном тому, что можно было предположить на основании содержания придаточного предложения. Например, в придаточном предложении сообщается, что на дворе идёт дождь. На этом основании можно было бы предположить, что спортсмены не стали тренироваться. Но может быть и иначе: спортсмены не испугались дождя и стали тренироваться. Об этом можно сообщить так: 1) Хотя на дворе шёл дождь, спортсмены стали тренироваться. 2) Спортсмены стали тренироваться, несмотря на то, что на дворе шёл дождь."},{"t":"p","h":"Такие предложения называются сложноподчинёнными предложениями с придаточными уступительными. В них обычно используются союзы хотя и несмотря на то что. Вместо союза хотя иногда используется его сокращённая форма хоть: Хоть видит око, да зуб неймёт (И. Крылов). Сложноподчинённые предложения с придаточными уступительными близки по смыслу сложносочинённым предложениям с союзами а, но, однако."},{"t":"p","h":"Сравните:"},{"t":"h3","h":"Сложносочинённое"},{"t":"v","l":["предложение с союзом но.","Мы ждали Чормона","целый день, но он не","пришёл.","Сложноподчинённое предложение","с придаточным уступительным.","Хотя мы ждали Чормона","целый день, но он не","пришёл."]},{"t":"p","h":"Но в придаточных уступительных более чётко подчёркивается то, что в главном предложении говорится о действии, противоположном тому, которое можно ожидать как следствие из причины, указанной в придаточном. Поэтому не для всякого сложносочинённого предложения с союзами а, но, однако можно подобрать соответствующее предложение с придаточным уступительным."},{"t":"p","h":"В художественной и в разговорной речи в сложноподчинённых предложениях с придаточными уступительными нередко используется союз пусть (пускай). Например: Пусть злится пурга, она нам не страшна. Иногда в придаточных уступительных предложениях в качестве союза <span class=\"pg\" data-n=\"230\">230<\/span>используется слово как, а также что и другие в сочетании с частицей ни и глаголами с частицей бы в качестве сказуемого придаточного предложения. Например: Как ни старались ребята, они не смогли выполнить задание полностью. (Сравните: Несмотря на то что ребята очень старались, они не смогли выполнить задание полностью.) Что ни говорили мне о Серёже, я всегда верил в нашу дружбу. (Сравните: Хотя мне и говорили о Серёже что-то, я всегда вёрил в нашу дружбу.)"},{"t":"p","h":"Задание. Дополните начатые конструкции так, чтобы получились сложноподчинённые предложения с придаточными уступительными."},{"t":"p","h":"1. Несмотря на то что механизаторы сильно устали, ...."},{"t":"p","h":"2. Хотя Николай Островский был тяжело болен, 3. Несмотря на то что Джамиля была скромной и хрупкой девушкой, ... 4. Хотя змеи вызывают у многих чувство страха и отвращения, было написано неразборчивым почерком, Несмотря на то что письмо 6. Хотя фотография была старой и пожелтевшей, Несмотря на то что в среднеазиатских пустынях жара достигает пятидесяти градусов, .... 8. Хотя мой друг живёт в другом городе, .... 9. Несмотря на то что Аркадию Гайдару было всего шестнадцать лет, .... 10. Хотя Чингиз Айтматов был студентом сельхозинститута, .... 11. Несмотря на то что синоптики обещали ненастную погоду,"},{"t":"p","h":"Упражнение 347. Перепишите. Подчеркните союзы в сложноподчинённых предложениях с придаточными уступительными."},{"t":"p","h":"1. Казаки начали купаться, несмотря на то что холодная вода обжигала тело (М. Шолохов). 2. Хотя обманутые попами люди шли к царю, большевики пытались остановить толпу (В. Никитин). 3. Пусть нам будет трудно, но мы не остановимся на полпути (М. Горький). 4. Как ни болело раненое плечо, Синцов взял автомат и выбежал из блиндажа (К. Симонов). 5. Хотя стрела пробила щит, но грудь воина спасла стальная кольчуга (В. Ян). 6. Несмотря на то что сообщение о победе отряд получил поздно, партизаны радовались, как дети Вершигора). 7. Хотя чемодан был <span class=\"pg\" data-n=\"231\">231<\/span>старый и потёртый, но в нём хранились большие ценности (И. Андроников). 8. Что ни предпринимали врачи, раненый генерал не приходил в сознание (В. Панова)."},{"t":"p","h":"Словарь:"},{"t":"raw","h":"<h4 class=\"mk\">обманутый – алданган щит – калкан кольчуга – соот сообщение – билдируу<\/h4>"},{"t":"v","l":["потёртый – сурулген, кырылып калган","ценность – баа, нарк","предпринимать – аракет кылуу"]},{"t":"p","h":"Упражнение 348. Вставьте в следующие предложения союзы хотя, несмотря на то что, а также как ни, пусть."},{"t":"p","h":"1. .. на перевале лежал глубокий снег, бульдозеры быстро расчистили дорогу. 2. Ледокол упорно пробивался к Новой Земле, ... тяжёлые льды преграждали путь. 3. ... панфиловцы погибли, но ни один вражеский танк не прорвался к Москве. 4. В апреле расцвела сирень, ..по ночам ещё стояла нулевая температура. 5. ... синоптики старались предсказать хорошую погоду, их прогнозы часто оказывались неудачными. 6. ... трудно было Косте признаться в своей ошибке, но он сделал это честно и прямо."},{"t":"p","h":"Словарь:"},{"t":"p","h":"предсказать – алдын ала айтуу прогноз погоды – аба ырайы тууралуу маалымат Упражнение 349. Выразите |: следующих предложениях такую мысль, что действие главного предложения совершается, несмотря на то, что его трудно ожидать, зная о содержании придаточного предложения."},{"t":"p","h":"Образец: Ученики выполнили упражнение, хотя онд было очень трудным."},{"t":"p","h":"1. Ученики не выполнили упражнение, потому что оно было очень трудным. 2. Мальчики не распилили бревно, так как оно было толстое и суковатое. 3. Журавль не улетел на юг, потому что у него болёло крыло. 4. Дедушка не прочитал письмо, потому что оно было написано неразборчивым почерком."},{"t":"p","h":"<span class=\"pg\" data-n=\"232\">232<\/span>суковатый – бутактуу неразборчивый почерк – жазуусу"},{"t":"h3","h":"даана эмес"},{"t":"p","h":"350. Замените сложносочинённые предложения сложноподчинёнными с придаточными уступительными."},{"t":"p","h":"Образец: Хотя ярко светила луна, но в ущелье было темно."},{"t":"p","h":"1. Ярко светила луна, но в ущелье было темно. 2. Моему дедушке 75 лет, однако он чувствует себя здоровым и крёпким. 3. Мы долго и настойчиво стучали в дверь, но нам никто не открыл. 4. Враги напали внезапно, однако бойцы отразили нападение. 5. Подул сильный ветер, но копна не развалилась. 6. Кукушка подбрасывает яйца в чужие гнёзда, однако она считается полезной птицей."},{"t":"p","h":"Словарь:"},{"t":"p","h":"внезапно – кокустан отразить нападение – соккуну кайтаруу"},{"t":"p","h":"Упражнение 351. Прочитайте. Выпишите сначала сложносочинённые предложения, а потом сложноподчинённые предложения с придаточными: а) места; 6) времени; в) образа действия;"},{"t":"p","h":"г) причины; д) цели; е) условными; ж) уступительными."},{"t":"h3","h":"КЫРГЫЗСКИЙ НАЦИОНАЛЬНЫЙ УНИВЕРСИТЕТ."},{"t":"p","h":"Молодёжь нашей республики учится в 35 высших учебных заведвниях. Самым крупным и престижным из них является Кыргызский национальный университет. Когда входишь в главный корпус Национального университета, сразу видишь огромный зал Космической лаборатории. Здесь смонтирована аппаратура мощной спутниковой связи, благодаря которой профессора и студенты за несколько секунд могут установить связь с университетами Парижа, Лондона, Нью-Йорка, Мадрида и Токио."},{"t":"p","h":"При Национальном университете функционируют много новых институтов, потому что республике нужны высококвалифицированные специалисты. Чтобы стать первоклассным юристом или экономистом, надо много и упорно учиться. Если ты любишь иностранные языки, то можешь <span class=\"pg\" data-n=\"233\">233<\/span>поступить в Институт Интеграции Международных Образовательных программ (ИИМОП). Если увлекаешься литературным творчеством, тебя ждёт факультет журналистики. Получив диплом, будешь работать там, где плещутся волны Тихого, Индийского и других океанов."},{"t":"p","h":"В Национальном университете учатся будущие педагоги по различным специальностям: кыргызскому языку и литературе, русскому языку и литературе, истории, географии, биологии, химии, математике и физике."},{"t":"p","h":"Приезжайте В университет, и вас встретят так, как встречают дорогих друзей. Несмотря на то, что вступительные экзамены будут трудными, у каждого из вас есть большие возможности стать студентом Кыргызского национального университета."},{"t":"p","h":"В. Данилов."},{"t":"p","h":"Словарь:"},{"t":"p","h":"престижный – самый авторитетный"}],"sub":[{"title":"Сложносочинённое","b":8},{"title":"КЫРГЫЗСКИЙ НАЦИОНАЛЬНЫЙ УНИВЕРСИТЕТ.","b":35}],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[229,233]},{"title":"§ 62. СлоОжЖнНоОпоОДчЧинЁННЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ ИЗЪЯСНИТЕЛЬНЫМИ.","blocks":[{"t":"h3","h":"§ 62. СлоОжЖнНоОпоОДчЧинЁННЫЕ ПРЕДЛОЖЕНИЯ С ПРИДАТОЧНЫМИ ИЗЪЯСНИТЕЛЬНЫМИ."},{"t":"p","h":"(Багынынкы ээлуу татаал багынынкы суйлем.)"},{"t":"p","h":"Повторить $8 27, 28."},{"t":"p","h":"Вспомните:"},{"t":"p","h":"1. На какие вопросы отвечают придаточные предложения?"},{"t":"p","h":"2. Чем отличаются придаточные предложения от членов предложения?"},{"t":"p","h":"3. Что называется дополнением?"},{"t":"p","h":"Придаточные предложения могут выполнять роль, похожую на роль дополнения В простом предложении. Такие придаточные разъясняют часто содержание чьей-то речи. Они называются изъяснительными. Обычно они находятся после главного предложения. Придаточные изъяснительные присоединяются к главному предложению при помощи <span class=\"pg\" data-n=\"234\">234<\/span>союзов что, будто, чтобы и др. или при помощи союзных слов. Например: Я сказал брату, что мой друг заболел."},{"t":"p","h":"Придаточные изъяснительные отвечают на вопросы дополнения (вопросы косвенных падежей): что? чего? о чём? и др. Они относятся часто к сказуемому главного предложения. Например: Асан просил Толю, чтобы он помог ему решить задачу."},{"t":"p","h":"Иногда придаточные изъяснительные поясняют существительные, называющие действия (нередко образованные от глаголов с суффиксом -ние). Например: Бейшегуль дала обещание, что она будет хорошо учиться."},{"t":"p","h":"Упражнение 352. Прочитайте. Найдите сложноподчинённые предложения с придаточными изъяснительными. На какие вопросы они отвечают? К каким словам относятся? Какими союзами присоединяются к главным предложениям?"},{"t":"h3","h":"НА КОННОМ ДВОРЕ."},{"t":"p","h":"Султанмурат спрятал платочек от Мырзагуль в нагрудный карман и прибежал на конный двор. Он понимал, что такое счастье предназначено только ему, что теперь он самый счастливый человек на свете."},{"t":"p","h":"Ребята чистили лошадей после водопоя, носили в вёдрах овёс, закладывали в кормушки сено. Султанмурат крикнул, что тоже будет чистить коня. Потом он побежал за сеном к большой скирде за конюшней. Здесь он достал из кармана платочек и стал разглядывать его. Он почувствовал, что от платочка исходит необыкновенно приятный запах горных цветов. Вдруг Султанмурату показалось, будто кто-то стоит позади него. Не успел он оглянуться, как Анатай выхватил платочек из его рук. Султанмурат побледнел и потребовал, чтобы тот немедленно вернул платочек. Анатай ответил, что не вернёт. Что было дальше – Султанмурат не помнил. Он знал только, что ему надо было во что бы то ни стало вернуть платочек любимой девушки."},{"t":"p","h":"По Ч. Айтматову. Упражнение 353. Выпишите сложноподчинённые предложения с придаточными изъяснительными. Подчеркните одной чертой союзы, которыми придаточные изъяснительные соединены с главными."},{"t":"p","h":"<span class=\"pg\" data-n=\"235\">235<\/span>Поставьте, где нужно, запятые. Двумя чертами подчеркните слова, к которым относятся придаточные изъяснительные."},{"t":"h3","h":"АНГАРА И ЕНИСЕЙ."},{"t":"p","h":"Давно мечтал о том, чтобы побывать на берегу Байкала, в том месте где из него вытекает стремительная, быстрая река Ангара. И вот, любуясь его берегами, я вспомнил красивую легенду."},{"t":"p","h":"Была у старого, седого Байкала красавица дочь Ангара. Говорил старик всем что не отпустит её от себя, держал взаперти, не отдавал никому в жёны. Но услышала однажды Ангара что живёт за горами молодой богатырь Енисей. Стала дочь просить отца чтобы отпустил он её к Енисею. Обиделся седой Байкал на то что дочь осмелилась ему сказать, рассвирепел, заковал её в камень. Долго плакала и билась о камни Ангара, но отец был неумолим. Тогда малые ручьи и речки договорились что помогут Ангаре бежать. Они стали подмывать прибрежные скалы, рухнула преграда – и Ангара устремилась к Енисею."},{"t":"p","h":"Разгневанный старик потребовал чтобы дочь вернулась. Увидев что дочь не догонишь он бросил ей вслед огромный камень. Но добежала Ангара до Енисёя и соединились они в одну мощную реку. А камень, который бросил ей вдогонку Байкал, и сейчас виден в том месте где вытекает Ангара из Байкала."},{"t":"p","h":"С тех пор люди говорят что любовь сильнее всего на свете."},{"t":"p","h":"По А. Фролову"},{"t":"p","h":"взаперти – жабык уйде заковать – кишен салуу"},{"t":"p","h":"Упражнение 354. Из следующих групп слов составьте сложноподчинённые предложения с придаточными изъяснительными."},{"t":"p","h":"1. Классный руководитель, объявить, апрель, в, состояться, общешкольный литературный конкурс. 2. Бригадир, потребовать, все, механизаторы, относиться, бережно, к, сельскохозяйственный, техника, чтобы. 3. Барометр, показать, быть, дождь, что. 4. Местные жители, сказать, нам, скоро, наступить, устойчивый, погода, что. 5. Я, слышать, <span class=\"pg\" data-n=\"236\">236<\/span>Чокмор, собираться, пойти, ночью, в, пещера, будто."},{"t":"p","h":"6. Старушка, попросить, девочка, она, помочь, ей, перейти, улица, чтобы. 7. Отец, хотеть, я, стать, врач, чтобы."},{"t":"v","l":["Словарь:","бережно – абайлап"]}],"sub":[{"title":"НА КОННОМ ДВОРЕ.","b":11},{"title":"АНГАРА И ЕНИСЕЙ.","b":16}],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[234,236]},{"title":"§ 63. ПРИДАТОЧНЫЕ ИЗЪЯСНИТЕЛЬНЫЕ С СОЮЗАМИ ЧТО, БУДТО.","blocks":[{"t":"h3","h":"§ 63. ПРИДАТОЧНЫЕ ИЗЪЯСНИТЕЛЬНЫЕ С СОЮЗАМИ ЧТО, БУДТО."},{"t":"p","h":"Повторить $5 50."},{"t":"p","h":"Вспомните:"},{"t":"p","h":"1. К каким словам относится придаточное изъяснительное?"},{"t":"p","h":"2. Какими союзами соединяются главные предложения и придаточные изъяснительные?"},{"t":"p","h":"Придаточные изъяснительные предложения с союзом что поясняют члены главного предложения, которые обозначают: 1) сообщение; 2) чувство; 3) мысль. Эти слова в составе предложения могут быть выражены:"},{"t":"p","h":"а) глаголами:"},{"t":"p","h":"1) говорить, шептать, кричать, объявлять, рассказывать, отвечать, докладывать, объяснять, повторять, писать, обещать, предупреждать, договариваться и т.д."},{"t":"p","h":"2) видеть, слушать, чувствовать, ощущать и т.д."},{"t":"p","h":"3) думать, вспоминать, знать, понимать, верить, решать, считать, соображать, наблюдать и т.д."},{"t":"v","l":["6) именами существительными:","1) сообщение, известие, заявление, обещание и др.","2) чувство, боязнь и др."]},{"t":"p","h":"3) сознание, убеждение, вывод, уверенность, надежда, мнение, мысль и др."},{"t":"p","h":"в) именами прилагательными:"},{"t":"p","h":"уверен, убеждён, рад, прав, виноват, согласен, доволен и др."},{"t":"p","h":"Например: Коля объявил, что завтра будет собрание. Старая Толгонай была рада, что её сыновья дружно носят пшеницу."},{"t":"p","h":"<span class=\"pg\" data-n=\"237\">237<\/span>Вместо союза что иногда употребляется союз будто. Это значит, что содержание придаточного предложения кажется нереальным, возможным или сомнительным (шектуу). Сравните: Табылды сказал, что он выучил урок. Табылды сказал, будто он выучил урок."},{"t":"p","h":"Эти предложения отличаются только союзами что и будто. В первом предложении мысль о том, что Табылды выучил урок, звучит уверенно. Во втором предложении говорящий не уверен, действительно ли выучил Табылды урок или только сказал об этом. Эта неуверенность выражается при помощи союза будто."},{"t":"p","h":"В главном предложении может быть употреблено дополнение, выраженное косвенными падежами местоимения. Тогда придаточное предложение раскрывает смысл такого Например: Товарищ сообщил мне о том, что он занимается в секции альпинизма. Я согласен с тем, что говорил докладчик. В этих предложениях придаточные изъяснительные раскрывают, уточняют дополнение главного предложения, выраженное косвенными падежами местоимения то."},{"t":"p","h":"Задание. Допишите начатые конструкции так, чтобы получились сложноподчиненные предложения с придаточными изъяснительными. и объясните разницу в значениях предложений, присоединяемых союзами что и будто."},{"t":"p","h":"1. Отец остался доволен тем, что .... 2. Путешествуя по тайге, я однажды услышал о том, будто 3. Метеорологи предупредили, что ... 4. Сторожу в ночной темноте показалось, будто .... 5. Наблюдая за жизнью беркутов, библоги заметили, что .... 6. Молодой учёный был уверен в том, что 7. Великие русские писатели всегда гордились тем, что ... 8. Делегаты профсоюзной конференции говорили, что ...."},{"t":"p","h":"Упражнение 355. Перепишите. Вместо многоточий вставьте слова в главных предложениях, к которым относятся придаточные изъяснительные. Для справок используйте слова, данные в конце упражнения."},{"t":"p","h":"1. Андрей ..., будто кто-то толкает его в плечо. 2. Усенбек ... что будет регулярно готовиться к урокам русского языка."},{"t":"p","h":"<span class=\"pg\" data-n=\"238\">238<\/span>3. Дерсу ... ‚, что в этом лесу нередко встречаются тигры."},{"t":"p","h":"4. Уходя из дому, мать вдруг ..., что забыла выключить электроплитку. 5. Джусуибек где-то будто в недоступных для человека местах живут какие-то таинственные существа."},{"t":"p","h":"Слова для справок: говорить, почувствовать, обещать, предупредить, вспоминать, слышать."},{"t":"v","l":["Словарь:","регулярно – дайыма","нередко – коп жолу","предупредить – алдын ала эскертуу","недоступный – бара алгыс","таинственный сырдуу,","жашыруун"]},{"t":"p","h":"Упражнение 356. Перепишите. Поставьте вместо точек союзы что или будто. Прежде чем ставить, подумайте, можно ли ставить союз будто в придаточных предложениях, если они относятся к слову уверен. Обратите внимание, в каких случаях можно поставить и союз что, и союз будто. Как при этом изменится значение предложения?"},{"t":"p","h":"1. Диктор объявил, ... завтра ожидается резкое изменение погоды. 2. Мне послышалось, ... в соседней комнате плачет ребёнок. 3. Отец ответил, ... окончательное решение о побздке на Кавказ он примет в мае. 4. Астроном с сомнением говорил о том, ... на других планетах есть жизнь. 5. Молодой охотник хвастался, ... он сразу застрелил двух волков."},{"t":"p","h":"6. Заслуженный артист сообщил, ... он готовит роль нашего современника в новом спектакле. 7. Режиссёр был уверен, ... премьера пройдёт с большим успехом. 8. Вдруг мальчикам показалось, ... за кустами промелькнула какая-то тень."},{"t":"p","h":"Словарь: объявить – жарыялоо,"},{"t":"v","l":["кулактандыруу","окончательный – биротоло","буткен","сомнение – ишенбестик, шектенуу","заслуженный – эмгек синирген","современник – замандаш"]},{"t":"p","h":"Упражнение 357. Допишите следующие предложения, чтобы получились сложноподчинённые предложения с придаточными изъяснительными. Для справок используйте слова, данные в скобках. Не забудьте поставить знаки препинания."},{"t":"p","h":"<span class=\"pg\" data-n=\"239\">239<\/span>1. У знаменитого мореплавателя Колумба была твёрдая уверенность в том ... (он, обязательно, открыть, Америка у 2. Коперник убедительно доказал ... (Земля, вращаться, вокруг, Солнце). 3. Шарипе показалось ... (её, окликнуть, подруга). 4. Чингиз Айтматов ответил .. (недавно законченный рассказ, скоро, выйти, из печати). 5. Ученики сделали вывод ... (повторять, пройденный материал, бчень полезно). 6. Пришло известие ... (Центр космических исследований, одобрить, решение, космонавты, о, выход, в, открытый космос)."},{"t":"v","l":["Словарь:","уверенность – ишенимдуулук","убедительно – ишенердик кылып","законченный – буткен","полезно – пайдалуу","одобрить – жактыруу"]},{"t":"p","h":"Упражнение 358. Переведите с кыргызского языка на русский, используя, где возможно, сложноподчинённые предложения с придаточными изъяснительными."},{"t":"h3","h":"ФЕРМАСЫНДА."},{"t":"p","h":"Мугалимибиз менен бирге канаттуулар фермасына барарыбызды класс жетекчибиз айтты. Фермага барып, ферма башчысы Абас менен ангемелештик. Биз ферманын мучелеруне тоют ташууга жардам бердик. Эл биздин ишибизге абдан ыраазы болгондугун айтышты."}],"sub":[{"title":"ФЕРМАСЫНДА.","b":35}],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[237,239]},{"title":"§ 64. ПРИДАТОЧНЫЕ ИЗЪЯСНИТЕЛЬНЫЕ С СОЮЗОМ ЧТОБЫ.","blocks":[{"t":"h3","h":"§ 64. ПРИДАТОЧНЫЕ ИЗЪЯСНИТЕЛЬНЫЕ С СОЮЗОМ ЧТОБЫ."},{"t":"p","h":"Повторить $5 50."},{"t":"p","h":"Вепомните:"},{"t":"p","h":"1. Как называется в сложноподчинённом предложении зависимая, поясняющая, часть?"},{"t":"p","h":"2. Какие слова поясняются придаточными изъяснительными? Если придаточное изъяснительное присоединено к главному при помощи союза что, его содержание кажется реальным. Если заменить союз что союзом будто, значение <span class=\"pg\" data-n=\"240\">240<\/span>придаточного становится не вполне реальным, а только возможным или сомнительным. Когда придаточное изъяснительное присоединено союзом чтобы (чтоб), это означает, что его содержание высказывается как желательное. Сравните: Я сказал, что все вышли из комнаты. Я сказал, будто все вышли из комнаты. Я сказал, чтобы все вышли из комнаты."},{"t":"p","h":"В первом предложении сообщили о реальном факте. Во втором предложении есть сомнение в реальности: может быть, на самом деле кто-то остался в комнате. В третьем предложении говорится о пожелании."},{"t":"p","h":"Союз чтобы придаёт придаточному изъяснительному значение желательности, приказания. Придаточное изъяснительное с союзом чтобы обыкновенно относится к членам главного предложения, обозначающим желание, приказ. Придаточное уточняет, что именно является желательным. Члены главного предложения, обозначающего желание, выражаются:"},{"t":"p","h":"а) глаголами: хотеть, желать, требовать, просить, добиваться, приказывать, говорить, писать и др.;"},{"t":"p","h":"6) именами существительными: желание, требование, просьба, приказ, предложение, распоряжение и др."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"1. Какое значение имвет союз чтобы в придаточных изъяснительных предложениях?"},{"t":"p","h":"2. Что обозначают слова, которые обычно поясняются придаточными изъяснительными с союзом чтобы? Приведите примеры этих слов."},{"t":"p","h":"3. Какой знак на письме ставят между предложениями, входящими в состав сложного предложения?"},{"t":"p","h":"Упражнение 359. Выпишите сложноподчинённые предложения с придаточными изъяснительными. Найдите слова в главных предложениях, к которым относятся придаточные с союзом чтобы. Каково значение этих слов?"}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[240,240]},{"title":"НА СТРОЙКЕ.","blocks":[{"t":"h3","h":"НА СТРОЙКЕ."},{"t":"p","h":"На высоких стенах мелькают сотни рабочих рук. Могучие краны поднимают тяжести, автомобили едва успевают подвозить строительные материалы. Тогда прораб <span class=\"pg\" data-n=\"241\">241<\/span>попросил, чтобы шофёры организовали добавочную бригаду. Все знают, что стройка имеет важное государственное значение. Боевой листок сообщает о том, что строители работают с большим энтузиазмом. Только отстают электросварщики. Иногда утренняя смена ожидает, пока они закончат сварку металлических конструкций. Штаб стройки отдал распоряжение, чтобы одна бригада электросварщиков работала в ночную смену. Теперь днём и ночью поднимаются ввысь корпуса будущего завода."},{"t":"p","h":"Уходя со стройки, мы пожелали, чтобы строители успешно справились с ответственным заданием."},{"t":"v","l":["Словарь:","добавочный – кошумча","энтузиазм – кайрат","металлический – темирден жасалган","распоряжение – буйрук","ответственный – жооптуу,","жоопкерчиликту\\"]},{"t":"p","h":"Упражнение 360. Перепишите. Подчеркните слова в главных предложениях, к которым относятся придаточные изъяснительные. Вместо многоточий вставьте нужный союз."},{"t":"p","h":"1. Савельич явился с известием, ... лошади готовы. 2. Я вышел из кибитки и потребовал, ... меня отвели к начальнику. 3. Гоголь не раз говорил о том, ... Пушкин писал свои произведения прекрасным русским языком. 4. Директор приказал, ... все сотрудники сделали прививки от гриппа."},{"t":"p","h":"5. Учитель предупредил, ... через несколько дней мы будем писать контрольную работу. 6. Больной попросил, ... медсестра принесла новое лекарство."},{"t":"p","h":"Упражнение 361. Перепишите, заменяя союз что союзом чтобы. Проследите, как меняется смысл предложений. Расставьте знаки препинания."},{"t":"p","h":"1. Сестра позвонила что брат встретил её. 2. Я предупредил что Акмат не ходил в кино. 3. Дежурный объявил что все ученики собрались в зале. 4. Бакас сказал что Осмон пришёл за книгой. 5. На собрании говорили о том что улучшилась дисциплина в классе. 6. Радист подтвердил что отряд в указанное время был на месте."},{"t":"p","h":"<span class=\"pg\" data-n=\"242\">242<\/span>подтвердить – тууралыгын ырастоо, аныктоо Упражнение 362. Перепишите. Вместо многоточий вставьте пропущенные слова, к которым относятся придаточные изъяснительные."},{"t":"p","h":"стала одной из крупных в стране. 2. Командир 1. Отец .. что Токтогульская гидроэлектростанция чтобы бойцы приготовились к бою. 3. Врач о том, что курение очень вредно для здоровья человека. 4. В телеграмме наш родственник чтобы мы встретили его на вокзале."},{"t":"p","h":"5. Айнагуль .. о том, что она купила несколько интересных книг для личной библиотеки."}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[241,242]},{"title":"§ 65. ПРИДАТОЧНЫЕ ИЗЪЯСНИТЕЛЬНЫЕ С СОЮЗНЫМИ СЛОВАМИ КТО, ЧТО.","blocks":[{"t":"h3","h":"§ 65. ПРИДАТОЧНЫЕ ИЗЪЯСНИТЕЛЬНЫЕ С СОЮЗНЫМИ СЛОВАМИ КТО, ЧТО."},{"t":"p","h":"Повторить $ 54, 63."},{"t":"p","h":"Вспомните:"},{"t":"p","h":"1. Как соединяются в сложноподчинённом предложении главное и придаточное предложения?"},{"t":"v","l":["2. В чём отличие союзов и союзных слов?","3. Какие две роли выполняют союзные слова?"]},{"t":"p","h":"4. Какие части речи используются в качестве союзных слов? Придаточные изъяснительные могут присоединяться к главным предложениям не только с помощью союзов, но также с помощью союзных слов. В качестве союзных слов используются в придаточных изъяснительных местоимения кто, что (в различных падежах, с предлогами и без предлогов). Местоимения кто и что употребляются |: придаточных изъяснительных предложениях, имеющих значвние, похожее на значение придаточных с союзом. Например: Только по голосу мы угадывали, кто говорил. Ребята ещё не решили, с кем они пойдут в кино."},{"t":"p","h":"Союзное слово, местоимение что, является членом придаточного предложения. Сравните: 1. Несмотря на <span class=\"pg\" data-n=\"243\">243<\/span>темноту, можно было угадать, что на столе лежит свёрток. 2. Несмотря на темноту, можно было угадать, что лежит на столе. В первом предложении слово что – союз, он лишь соединяет придаточное предложение с главным. Иначе во втором предложении. Здесь слово что – союзное слово. Онб не только присоединяет придаточное предложение к главному, но и является подлежащим придаточного предложения."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"1. Каково значение членов главного предложения, к которым относятся придаточные изъяснительные?"},{"t":"p","h":"2. В чём разница в значениях придаточных изъяснительных, присоединяемых союзом что и союзом будто?"},{"t":"p","h":"3. При помощи какого союза присоединяются придаточные изъяснительные к главным предложениям, если их содержание кажется желательным?"},{"t":"p","h":"4. Какие союзные слова используются в придаточных изъяснительных?"},{"t":"p","h":"5. Чем отличается союз что от союзного слова что?"},{"t":"p","h":"Упражнение 363. Прочитайте, найдите слова, которыми присоединены придаточные изъяснительные предложения к главным. Какие из них являются членами предложений? Как называются такие слова? Какими частями речи выражены эти члены предложения?"}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[243,243]},{"title":"ЮНЫЙ ПАРТИЗАН.","blocks":[{"t":"h3","h":"ЮНЫЙ ПАРТИЗАН."},{"t":"p","h":"Тринадцатилетний Лёня Голиков пошёл на разведку. Он заметил, что к мосту приближается немецкая автомашина. Мальчик бросил гранату, и машина перевернулась. Лёня подбежал поближе и увидел, кто ехал в автомобиле. Около

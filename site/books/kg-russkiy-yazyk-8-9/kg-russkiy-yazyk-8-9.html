о джигитами. Вылетевшие из кустарника горлинки кружились над степью. Танабай тоже уехал в степь. Долго ездил по степи покрытой цветами и ковылём. Долго сидел у табуна осиротевшего без красавца Гульсары. Домой вернулся поздно."},{"t":"p","h":"Молча вошёл он в юрту освещённую слабым огнём лампы. Девочки уже спали. Жена подала наспех приготовленный ужин. Но Танабаю не хотелось есть. Болело его <span class=\"pg\" data-n=\"159\">159<\/span>сёрдце измученное обидой и тревогой за любимого коня. Тогда Джайдар взяла темир-комуз и стала играть грустную мелодию. Это была песня о верблюдице потерявшей белого верблюжонка."},{"t":"p","h":"По Ч. Айтматову. Словарь:"},{"t":"v","l":["наспех – шашып","горлинка – бактек","осиротеть – жетим калуу обида – таарынуу"]},{"t":"p","h":"Упражнение 248. Перепишите. Подчеркните причастия одной чертой, а определяемые слова – двумя чертами. Подумайте, в чём согласовано причастие с определяемым словом. Расставьте, где нужно, запятые."},{"t":"p","h":"1. Скворцы прилетевшие с юга хозяйничали в скворечнике (М. Пришвин). 2. Народ радостно встретил Токтогула вернувшегося из сибирской ссылки. 3. Уставший от волнения я быстро заснул (М. Горький). 4. Вершины гор окутанные туманом были похожи на зубы дракона (В. Саянов)."},{"t":"p","h":"5. Мальчик с восхищением глядел на белый пароход гордо плывущий по голубому озеру (Ч. Айтматов). 6. Мать весь день хлопотавшая по хозяйству к сильно уставала (Ф. Фадеев). Т. Упавший с лошади дядя Максим сломал ногу (В. Короленко). 8. Розовый карась сорвавшийся с крючка исчез в глубине пруда (К. Паустовский). 9. Растущая по берегу озера облепиха имвет хорошие лечебные свойства."},{"t":"p","h":"Словарь:"},{"t":"raw","h":"<h4 class=\"mk\">дракон ажыдаар творить – жасоо чудеса – укмуштар<\/h4>"},{"t":"v","l":["хлопотать по хозяйству – чарба","менен алпурушуу","свойство – касиет"]},{"t":"p","h":"Упражнение 249. Перепишите. Вместо точек вставьте причастные обороты, согласуя их с определяемым словом в роде, числе и падеже. Обороты даны в конце упражнения."},{"t":"p","h":"Образец: Над стёпью Танабай увидел серого гуся, догоняющего свою стаю."},{"t":"p","h":"1. Над степью Танабай увидел серого гуся, ...."},{"t":"p","h":"2. Железная дорога, ..., тянется до Иссык-Куля. 3. Депутат <span class=\"pg\" data-n=\"160\">160<\/span>оправдал доверие, .... 4. Гюльджамал принесла от родителей записку, .... 5. Лисенок, быстро освоился в доме."},{"t":"p","h":"6. Подземная железная дорога, метро, ..., славится на весь мир. 7. Моё знакомство с Володей, ..., превратилось в крепкую дружбу."},{"t":"p","h":"Слова для справок: проложенный через ущелье, догоняющий свою стаю, оказанный ему народом, пойманный охотником, объяснявший её отсутствие, построенный в Москве, возникший летом."},{"t":"v","l":["Словарь:","освоиться – кенуу, уйренуу","подземный – жер астындагы","знакомство – таан ышкандык"]},{"t":"p","h":"отсутствие – катышпай калгандыгы, келбей калгандыгы"},{"t":"p","h":"Упражнение 250. Перепишите, дописывая вместо точек окончания причастий. Расставьте недостающие запятые."},{"t":"p","h":"1. Туристы, ходивш... к водопаду вернулись засветло."},{"t":"p","h":"2. Свеча, горевш... в медном подсвечнике потухла. 3. У пальто, купленн... сестрой был меховой воротник."},{"t":"p","h":"4. Необычный прибор изготовленн... Джумабеком, учитель использовал на уроке. 5. Ведром взят... из дома, Абдыгул чёрпал воду и выливал из лодки. 6. Шутка сказанн... вожатым, ободрила усталых пионеров. 7. Механизаторы осушили болото расположенн... за виноградниками. 8. К проруби пробит... во льду около берега, шли женщины с ведрами."},{"t":"v","l":["Словарь:","засветло – карангы туше электе шутка – тамаша","потухнуть – ечуп калуу","черпать – сузуп алуу","ободрить – кеонулун кетеруу","прорубь – муз тешиги"]},{"t":"p","h":"Упражнение 251. Перепишите, дописывая окончания дополнений в причастном обороте. Расставьте запятые."},{"t":"p","h":"1. Электросварщики гордились высоким званием присвоенным их бригад... (А. Рыбаков). 2. Асель грела воду в котле установленном Бектеми... на камнях (Ч. Айтматов). 3. Из кармана гимнастёрки пробитой пул... друзья вынули комсомольский билет Чолпонбая (Ф. Самохин)."},{"t":"p","h":"<span class=\"pg\" data-n=\"161\">161<\/span>4. Снарядом ударившим в мельниц... ранило радиста (А. Гайдар). 5. Павел рассказал матери о людях желающих счастья народ... (М. Горький). 6. Дерево поваленное ветр... лежало поперек дороги. Т. Путники попавшие в гроз... сильно промокли."},{"t":"v","l":["Словарь:","","желать – каалоо поперёк – туурасынан жатуу"]},{"t":"p","h":"Упражнение 252. Перепишите, распространяя причастные обороты обстоятельствами образа действия."},{"t":"p","h":"Образец: Железо, сильно нагретое огнём, становится красным."},{"t":"p","h":"Железо, .. нагретое огнём, становится красным. 2: Заяц, .. выскочивший из чащи, испугал детей. 3. За спиной Чапаева, ... скакавшего впереди отряда, развевалась чёрная бурка. 4. Стрекоза, ... пропевшая всё лето, пришла к муравью за помощью. 5. Рулевой, ... смотревший вперёд, изменил курс корабля. 6. Бойцы, ... шагавшие по дороге, пбли новую песню. Т. Человека, ... рассказавшего эту историю, я встретил в госпитале."},{"t":"v","l":["Словарь:","","развеваться – желбирее"]},{"t":"p","h":"Упражнение 253. Перепишите, вставляя вместо точек в причастном обороте подходящие по смыслу дополнения и обстоятельства."},{"t":"p","h":"1. Наказание, полученное ..., заставило его задуматься о своём поведении. 2. Змея, выползшая из- под .., угрожающе зашипела. 3. Пробка, брошенная в ..., не тонет."},{"t":"p","h":"4. Маску медведя, подаренную ..., девочка взяла на было новогодний утренник. 5. Распоряжение, отданное выполнено к вечеру. 6. Дождь, ливший ..., освежил природу. Т. Здание, построенное на .., стало оседать. 8. Монета, выпавшая из ..., упала на тротуар."},{"t":"p","h":"Слова для справок: камень, прогульщик, вода, утром, отец, вся ночь, кошелёк, песчаная почва."},{"t":"v","l":["<span class=\"pg\" data-n=\"162\">162<\/span>наказание – жаза","зашипеть – кышылдоо, ышкыруу","оседать – темен тушуу,","чегуу, тунуу"]},{"t":"p","h":"Упражнбние 254. Замените пояснения, взятые в скобки, причастным оборотом."},{"t":"p","h":"Образец: Знамя, выпавшее из рук знаменосца, поднял другой боец."},{"t":"p","h":"1. Знамя поднял другой боец (онд выпало из рук знаменосца). 2. Река шумит и пенится (она протекает по ущелью). 3. Кругом стояли горы (они освещены луной)."},{"t":"p","h":"4. Теннисисты получили значки (они выполнили норму мастера спорта у: Озеро Иссык-Куль никогда не замерзает (оно расположено высоко в горах). 6. Больной почувствовал себя легче (он принял лекарство). 7. Человеку легко заблудиться (он впервые приехал в Ташкент). Словарь:"},{"t":"p","h":"впервые – биринчи жолу Упражнение 255. Перепишите. Найдите деепричастные и причастные обороты и выделите их запятыми."},{"t":"h3","h":"МАРАЛЫ."},{"t":"p","h":"Опустив вниз тяжёлые рога маралы стояли в воде. Холодная струя гремевшая между камней омывала их крепкие ноги. Маралы пили воду небольшими глотками наслаждаясь ледяной влагой. А солнце поднявшееся над вершинами гор пригревало всё сильней и приятней. Птицы торжественно приветствующие солнце не умолкая звенёли в кустах."},{"t":"p","h":"Утоля жажду маралы грелись на солнце. На их ветвистых рогах сверкали упавшие с веток капли росы. Услыхав голоса людей животные вздрогнули и пошевеливая ушами торопливо пошли по тропе. А мальчик спрятавшийся за камнем зачарованно смотрел им вслед."},{"t":"p","h":"По Ч. Айтматову. Словарь: струя – агуу, агыш"},{"t":"v","l":["греметь – куркурее","омывать – жанынан агып етуу","глоток – ууртам","влага – здесь: вода","ветвистый – бутактуу","вздрогнуть – селт этуу","зачарованно – ан-тан болгон"]}],"sub":[{"title":"ТОСКА ПО ГУЛЬСАРЫ.","b":26},{"title":"МАРАЛЫ.","b":68}],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[157,162]},{"title":"§ 45. СИНТАКСИС ПРОСТОГО ПРЕДЛОЖЕНИЯ. ПОВТОРИТЕЛЬНЫЕ УПРАЖНЕНИЯ ПО СИНТАКСИСУ ПРОСТОГО ПРЕДЛОЖЕНИЯ.","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"163\">163<\/span>ДЕВЯТЫЙ КЛАСС"},{"t":"h3","h":"§ 45. СИНТАКСИС ПРОСТОГО ПРЕДЛОЖЕНИЯ. ПОВТОРИТЕЛЬНЫЕ УПРАЖНЕНИЯ ПО СИНТАКСИСУ ПРОСТОГО ПРЕДЛОЖЕНИЯ."},{"t":"p","h":"Упражнение 256. Поставьте ударения, прочитайте выразительно."},{"t":"v","l":["Старайся овладеть ты русским языком.","Он с детских лет тебе и мне знаком.","В нём много музыки и много красоты.","Всем сердцем, всей душой его полюбишь ты!","И не забудь нигде ни на единый миг","Язык твоих друзей и братьев дорогих.","Как будто целый мир тебе знаком,","Когда владеешь русским языком.","И. Гришашвили.","Словарь:","овладеть языком – тил бил познать – билу\\у, таануу","миг – бир паска"]},{"t":"p","h":"Упражнение 257. Прочитайте и перескажите текст. Найдите главные члены предложения."},{"t":"h3","h":"КАК СПЯТ ЖИВОТНЫЕ."},{"t":"p","h":"В детстве я думал, что коровы не спят, потихоньку ходил ночью в сарай, чтобы проверить нашу корову Зорьку. Она всю ночь пережёвывала отрыжку. Оказывается, коровы спят, но та часть мозга, которая контролирует жевательные мышцы, бодрствует."},{"t":"p","h":"Спят все животные: слоны и мухи, верблюды и жирафы, змеи и тараканы, воробьи и рыбы. Так, африканские львы, насытившись мясом зебры или антилопы, могут спать по 15-17 часов в сутки. Очень чутко спит в лесном буреломе стая волков. Каждый из них готов в любую секунду вскочить <span class=\"pg\" data-n=\"164\">164<\/span>и броситься на врага. Гуси и журавли спят, стоя на одной ноге. Уставшие за день лошади любят спать, положа голову на спину стоящего рядом сосёда."},{"t":"p","h":"Моржи – известные лежебоки, они вместо подушки используют жирную тушу собрата. И только обезьяны спят как люди: на спинв, на боку, положив голову на ладошку. Многие животные во сне не только храпят, но и видят сны. По В. Пескову. Словарь:"},{"t":"p","h":"жевать – кепшее жевательные мышцы – кепшеечу"},{"t":"h3","h":"булчундар"},{"t":"p","h":"Упражнение 258. Распространите следующие нераспространённые предложения добавлением к ним подходящих по смыслу второстепенных членов."},{"t":"p","h":"Поэт сочиняет .... 2. Художник нарисовал ...."},{"t":"p","h":"3. Маляр покрасил 4. Дети катаются .... 5. Почтальон разносит .... 6. Шахтёры добывают ....Т. Сторож охраняет"},{"t":"p","h":"8. Врач лечит ...."},{"t":"p","h":"Упражнение 259. Прочитайте выразительно каждое предложение. Выделите интонацией те слова, на которые падает логическое ударение. Переписывая, подчеркните слова с логическим ударением."},{"t":"p","h":"1: Вокруг озера цвела облепиха, а не барбарис. 2. Из раскрытой пасти хищника торчали клыки, а не зубы."},{"t":"p","h":"3. Камчыбек попросил у меня другой, зелёный, карандаш."},{"t":"p","h":"4. К вёчеру в цветочном магазине остались только ромашки, а не розы. 5. Вместо урбка черчения состоялся урок истории, а не географии."},{"t":"p","h":"Упражнение 260. Прочитайте текст, поставив слова в скобках в нужной форме. Найдите случаи глагольного управления, определите, какие глаголы управляют какими падежами."},{"t":"h3","h":"ЛЯГУШОНОК."},{"t":"p","h":"В (март) сильно пригрёло солнце и растопило снег. От (жаркие лучи) солнца ожил розовый лягушонок. Он выполз из-под (старый пень) и стал барахтаться в (лужица). Я проходил мимо (лужица) и увидел весело <span class=\"pg\" data-n=\"165\">165<\/span>(купающийся смельчак). От (радость) лягушонок даже заквакал. К (в6чер), однако, пошёл снег и сильно подморозило. Утром я снова шёл мимо (лужа). Из куска (лёд) торчали лапки (замёрзший розовый лягушонок). Мне стало жаль (маленький бедолага), который пострадал из-за своей (неопытность)."},{"t":"p","h":"Я принёс кусок льда домой, положилв (большая чашка) и налил (тёплая вода). Лед растаял, и лягушонок задвигал (лапки). Он плавал по (чашка) и что-то урчал. Видимо, ждал (запоздавший) весну. Через (неделя) стало совсем тепло, и я выпустил (лягушонок) на волю."},{"t":"p","h":"По М. Пришвину."},{"t":"p","h":"Словарь:"},{"t":"p","h":"барахтаться – чабалактоо урчать – ырылдоо лужа – чеет"},{"t":"p","h":"Упражнение 261. Перепишите. Существительные, стоящие в скобках, поставьте в нужном падеже."},{"t":"h3","h":"Я ИЗ ФРУНЗЕ..."},{"t":"p","h":"После война дети нашли в старом (окоп) патрон. Из патрона они извлекли (записка). Ребята прочитали записку и узнали о (подвиг) советского (боец). Фашисты прорвались к (дорога) на Москву. воины сражались геройски, но погибли. Остался один боец. Пуля пробила его (нога) возле (колено). Но раненый боец стрелял из (пулемёт). Он уничтожил много (враги). В конце (записка) он написал: «Я умираю, но не сдаюсь. Прощайте. Я из Фрунзе. Комсомолец Александр Виноградов»."},{"t":"p","h":"Теперь эта записка хранится в (музей). Дорогой друг! Пусть эта записка напоминает тебе о том, как храбро сражались за (Родина) твой отцы и деды. Пусть она учит"},{"t":"raw","h":"<h4 class=\"mk\">тебя любить и извлечь – сууруп алуу записка – кыскача кат пробить – уруп тешуу<\/h4>"},{"t":"v","l":["свою прекрасную (страна).","По С. Смирнову.","Словарь:","храниться – сакталуу"]},{"t":"h3","h":"прекрасный – эн сонун"},{"t":"p","h":"<span class=\"pg\" data-n=\"166\">166<\/span>Упражнение 262. Перепишите. Определения, взятые в скобки, согласуйте с определяемыми словами в роде, числе и падеже."},{"t":"h3","h":"ПЕРВЫЙ ПОЧТОВЫЙ ЯЩИК."},{"t":"p","h":"(Южный) половина Африки заканчивается мысом Доброй Надежды. Моряки узнали об (этот) (красивый) месте пятьсот лет назад. Корабли тогда уходили в плавание на (долгий) годы. Здесь они останавливались, чтобы набрать (питьевая } воды и (свежий) фруктов. На берегу лежал (большой) камень. Моряки, плывущие из Европы в Индию, оставляли под (этот) камнем письма. Но вот к (гранитный) берегу подходил корабль из Индии в Европу. Моряки забирали письма (свой) незнакомых товарищей и добровольно доставляли в Европу."},{"t":"p","h":"Прошли сотни лет. Появились радио и телеграф. А камень, хранивший когда-то (матросский) письма, теперь находится в музее."},{"t":"p","h":"Словарь:"},{"t":"h3","h":"добровольно – ез эрки менен"},{"t":"p","h":"Упражнение 263. Спишите. Найдите в словосочетаниях типы подчинительной связи (согласование, управление, примыкание), определите главные и зависимые слова."},{"t":"p","h":"Симфонический оркестр, добровольно трудиться, волноваться перед экзаменом, прославленная балерина, президент республики, наскоро перекусить, покраснеть от стыда, экономическое положение, отвечать улыбаясь, знаменитый конферансье, радоваться повторить дважды, серебряная свадьба, думать о будущем, жить по- -новому, передовая агротехника, выразительно прочитать, концертный рояль, выбежать из подъезда, подъехать к дому, начать тренироваться, вокально- инструментальный ансамбль, не заметить впопыхах, международный аэропорт, интересоваться живописью, по-старчески мудро."},{"t":"v","l":["Словарь:","впопыхах – шашылышта"]},{"t":"p","h":"<span class=\"pg\" data-n=\"167\">167<\/span>Упражнение 264. Прочитайте выразительно. Найдите главные и второстепенные члены предложения."},{"t":"h3","h":"ВЕЧНАЯ БОРЬБА УЛАНА И САНТАША."},{"t":"p","h":"(Кыргызская легенда) Давным-давно жила у подножия высоких кыргызских гор юная и прекрасная девушка Чолпон. Лицо её было белее горного снега, а глаза сверкали, как июньские звёзды. Многим джигитам разбила она сердце, но сильнее всех любили её Улан и Санташ."},{"t":"p","h":"Оба они были сильными и смелыми, но гордая Чолпон не знала, кому из них отдать своё сердце. Тогда начали Улён и Санташ между собой жестокую борьбу. Острые сабли зазвенвли в их руках. Днём и ночью сражались джигиты, и кровь лилась из глубоких ран. Не знает Чолпон, как остановить кровёвый поединок. Тогда вырвала она своё сёрдце из груди и упала бездыханной около скалы."},{"t":"p","h":"Долго плакали люди по своей любимой дочери. Ручьями лились слёзы, и образовалось озеро Иссык-Куль. А джигиты превратились в ветры: один дует с запада, а другой – с востока. Встрётившись над озером, они налетают друг на друга, как беркуты, и продолжают вечный спор."},{"t":"p","h":"В. Данилов."},{"t":"p","h":"Упражнение 265. Перепишите. Подчеркните в предложениях сначала глагольные, а потом именные сказуемые."},{"t":"h3","h":"ДРУГ ЖИВОТНЫХ."},{"t":"p","h":"Сурбвая зима бедствие для горных оленей. Они не могут достать корм из-под глубокого снега. Многие животные погибают от гблода и морозов. Топчубек решил помбчь животным. Он насыпал в мешок овса и пошёл в лес. Олбни бессильно лежали в снегу. Топчубек подошёл к"},{"t":"p","h":"и протянул на ладони овёс. Потом олени встали и окружили мальчика. Старый олень стал лизать руку Топчубека. Он как будто благодарил его за В. Андреев."},{"t":"p","h":"<span class=\"pg\" data-n=\"168\">168<\/span>бедствие – кырсык пугливый – коркунчаак многие – мында: кеп айбанаттар спасение – куткаруу, сактап калуу Упражнение 266. Спишите. Найдите обращения, вводные слова и вводные сочетания слов. Расставьте знаки препинания."},{"t":"p","h":"1. Я обращаюсь к вам мои верные друзья и сверстники!"},{"t":"p","h":"2. Я хочу завещать тебе мой юный друг горячую любовь к своей стране. 3. Далеко за городом слышалась пушечная стрельба. Очевидно к городу подходили петлюровцы. 4. Разрешите товарищ командир отправиться на разведку. 5. В железнодорожных мастерских к сожалению никого уже не было. 6. Какие книги Павел вам нравятся? 7. Снаряды к счастью падали далеко от переправы."},{"t":"p","h":"По Н. Островскому."},{"t":"p","h":"Упражнение 267. Спишите. Найдите причастные и деепричастные обороты и расставьте запятые."},{"t":"h3","h":"ПЕРЕХОД ЧЕРЕЗ ГОРЫ."},{"t":"p","h":"Миша Фрунзе и его друзья учившиеся в Верненской гимназии вышли в поход. Они решили пройти от Верного до Иссык-Куля через горы. Сначала шли по дороге поднимавшейся круто вверх. Дикие животные испуганные ребячьими голосами убегали в сторону. Впереди показался покрытый нетающим снегом перевал. Идти становилось труднее. Миша с тяжёлым рюкзаком давившим на плечи"},{"t":"p","h":"ступил на перевал. За ним следом не отставая ни на шаг двинулись его друзья. Через несколько дней пути они увидели синее озеро расположенное между высокими хребтами. Это был Иссык- Куль. Мальчики уставшие после трудного похода весело перекликаясь и брызгаясь купались в тёплых водах Иссык-Куля."},{"t":"p","h":"По Г. Фетисову. Словарь:"},{"t":"p","h":"Верный – город Алма-Ата"},{"t":"p","h":"<span class=\"pg\" data-n=\"169\">169<\/span>Упражнение 268. Перепишите, расставляя знаки препинания."},{"t":"h3","h":"ТОКТОГУЛ."},{"t":"p","h":"За песни призывающие к борьбе царь приказал отправить Токтогула в Сибирь. По словам друзей акын сильно тосковал по Родине. Он вспоминал всё и родную долину и родной дом и родной народ. Суровый климат и тяжелая работа ослабили здоровье Токтогула. К счастью рядом были друзья. Русские революционеры полюбившие кыргызского акына помогли ему бежать из Сибири. Долго добирался Токтогул до дома скрываясь от царских и кыргызских богачей. Но вот наконец он подошёл к родному аилу. Знакомые и незнакомые люди забыв про свои дела радостно окружили Токтогула. «Спой, Токо, – просили они. – Мы к сожалению давно не слыхали твоих песен». Взяв в руки комуз Токтогул запел. Он пел о многом о свободе о светлой мечте о счастье."}],"sub":[{"title":"КАК СПЯТ ЖИВОТНЫЕ.","b":5},{"title":"ЛЯГУШОНОК.","b":20},{"title":"Я ИЗ ФРУНЗЕ...","b":27},{"title":"ПЕРВЫЙ ПОЧТОВЫЙ ЯЩИК.","b":34},{"title":"ВЕЧНАЯ БОРЬБА УЛАНА И САНТАША.","b":43},{"title":"ДРУГ ЖИВОТНЫХ.","b":49},{"title":"ПЕРЕХОД ЧЕРЕЗ ГОРЫ.","b":57},{"title":"ТОКТОГУЛ.","b":63}],"section":"ДЕВЯТЫЙ КЛАСС","pages":[163,169]},{"title":"§ 46. ОБЩИЙ ФОНД ЛЕКСИКИ РУССКОГО И КЫРГЫЗСКОГО ЯЗЫКОВ. РУССКАЯ ЛЕКСИКА С ТОЧКИ ЗРЕНИЯ ЕЁ ПРОИСХОЖДЕНИЯ.","blocks":[{"t":"h3","h":"§ 46. ОБЩИЙ ФОНД ЛЕКСИКИ РУССКОГО И КЫРГЫЗСКОГО ЯЗЫКОВ. РУССКАЯ ЛЕКСИКА С ТОЧКИ ЗРЕНИЯ ЕЁ ПРОИСХОЖДЕНИЯ."},{"t":"p","h":"Вспомните:"},{"t":"p","h":"1. Что такое лексика?"},{"t":"p","h":"д. Приведите пример лексико-семантической группы слов. Лексика каждого языка складывается постепенно. Появляются новые орудия, люди узнают о новых явлениях природы, они знакомятся с новыми для них народами. И всё это ведёт к пополнению словаря. В русском языке есть немало старых слов, похожих на такие же слова в болгарском, польском, чешском, сербскохорватском и других славянских языках. Это такие слова, как вода, земля, небо, огонь, человек, три, высокий и др. Их называют общеславянскими. Другие слова – общие с другими восточнославянскими – украинские, белорусские. Наприме р: семья, собака и др. Есть слова, возникшие в русском языке."},{"t":"p","h":"<span class=\"pg\" data-n=\"170\">170<\/span>Например: родина, старик, роща. Всё это – исконно русские слова."},{"t":"p","h":"Другую группу слов по происхождению составляют заимствованные слова. Это такие слова, которые пришли в русский язык из других языков мира. Они обогатили его словарь и прочно вошли в него. Теперь никто уже, кроме специалистов, и не думает, что такие слова, как школа, мастер, глаз, сапог, шлем – заимствованные. А они в своё время были взяты из разных языков соседей русских. В некоторых заимствованных словах можно обнаружить отдельные приметы заимствования. Так, например, в русском языке не было раньше звука ф, а все слова, содержащие этот звук, заимствованы из других языков: арифметика, физика – из греческого; форточка, фляжка – из немецкого; факт и фильтр – из латинского; фата, кафтан – из восточных языков. Заимствовано и большинство русских слов, которые начинаются на а: абажур и актёр – из французского; ананас – из языка южноамериканских индейцев тупи; акула – из древнеисландского; аршин – из тюркских языков и т.д. Теперь эти заимствования полностью стали частью русского словаря. Лишь часть заимствованных слов сохраняет чужой характер."},{"t":"p","h":"Большую группу составляют интернационализмы – слова различного часто греческого и латинского) происхождения, которые распространились теперь во многих языках мира. Среди интернационализмов такие, например, слова, как социализм, грамматика, лексика, космос, аптека, турист, экран, формула, вертикаль, профессор и многие другие. Многие интернационализмы проникли через русский язык в кыргызский и составляют часть общего фонда русской и кыргызской лексики."},{"t":"p","h":"Другая часть общего фонда русской и кыргызской лексики – это слова, заимствованные из русского языка кыргызским, иногда ещё до революции (бутылка, пуд, картошка, самовар)."},{"t":"p","h":"Наконец, третья часть общего фонда – это слова кыргызского и родственных и соседних с ним языков, проникшие в русский язык. Это такие, например, слова, как аксакал, акын, арык, беркут, табун, капкан, камыш, базар, арба, мираб, чайхана, ишак и др."},{"t":"v","l":["<span class=\"pg\" data-n=\"171\">171<\/span>Вопросы для повторения:","1. Какие слова называются общеславянскими?","2. Приведите примеры исконно русских слов."]},{"t":"p","h":"3. Назовите заимствованные слова, прочно вошедшие в русский язык."},{"t":"p","h":"4. Какой согласный можно считать признаком заимствованных слов в русском языке?"},{"t":"p","h":"5. Какие признаки заимствованных слов в русском языке вы знаете?"},{"t":"p","h":"6. Какие слова называются интернационализмами?"},{"t":"p","h":"7. Какие три группы лексики составляют общий фонд лексики русского и кыргызского языков?"},{"t":"p","h":"Упражнение 269. Перепишите, подчёркивая заимствованные слова. По каким признакам вы узнали их? К выделенным, исконно русским словам, подберите производные слова."},{"t":"p","h":"Образец: берёза – берёзка, берёзовый, березняк, подберёзовик."},{"t":"p","h":"1. Высокие белоствольные берёзы всегда были олицетворбнием русской природы Паустовский). 2. Чингиз Айтматов подарил школьному музею книгу со своим автографом. 3. С древнейших времён люди интересовались погодой (Н. Михайлов). 4. Письмо быстро дошло до адресёта, потому что было послано авиапочтой. 5. В лесном заповеднике близ Воронежа мы насчитали десятки тысяч бобров (В. Песков). 6. По телевизору смотрёли телерепортаж о встрёче президентов независимых государств. 7. Собака – верный друг человека. 8. Ленинградский фестиваль обычно начинёется с приходом белых ночей (М. Дудин)."},{"t":"p","h":"Упражнение 270. Перепишите, подчёркивая интернациональные слова. При проверке помните, что интернациональные слова обычно совпадают в русском и кыргызском языках."},{"t":"p","h":"1. В здании филармонии состоялся заключительный концерт мастеров искусств Кыргызстана. 2. Молодой механизатор Искендер на комбайне «Нива» убрал за смену сорок гектаров зерновых (из газеты). 3. Поэт Лебедев-Кумач и композитор Дунаевский создали прекрасную песню о Родине. 4. От аэропбрта до вокзала и далее к новому микрорайону <span class=\"pg\" data-n=\"172\">172<\/span>проложена троллейбусная линия. 5. Московская олимпиада стала символом дружбы и сотрудничества всех спортсменов мира. 6. Экономический факультет университета готовит будущих менеджеров и брокеров."},{"t":"p","h":"Упражнение 271. Выпишите заимствованные слова, относящиеся к жизни и быту других народов."},{"t":"p","h":"1. Мэр южного французского города сердечно приветствовал кыргызских туристов. 2. Против бастующих рабочих на окраине Чикаго были брошены отряды полисменов."},{"t":"p","h":"3. Одни женщины были одеты в сари, другие – в кимоно (В. Овчинников 4. Почётное место среди венгерской кухни занимает гуляш, грузинской – харчо, кыргызской бешбармак. 5. Украинские девушки танцевали гопак."},{"t":"p","h":"Словарь: мэр – глава городского"},{"t":"v","l":["муниципалитета","сари – индийская одежда","гопак – украинский танец","кимоно- японская одежда","гуляш- мясное блюдо","харчо- суп"]},{"t":"p","h":"Упражнение 272. Назовите и запишите десять общих слов русского и кыргызского языков, называющих должность людей. Укажите, из какого языка в какой попали слова: из русского в кыргызский или из кыргызского в русский."},{"t":"p","h":"Например: космонавт, манасчи, режиссёр, башкарма, министр, чабан, инженер, акын, корреспондент, мираб, диктор и т. д."},{"t":"p","h":"Упражнение 273. Перепишите, подчёркивая слова, общие для русского и кыргызского языков."},{"t":"p","h":"1. В заключение спортивного праздника на ипподроме состоялась аламан-байга. 2. У моего дедушки на джайлоо есть охотничий беркут. 3. Абитуриенты, поступающие на филфак пединститута, собрались в вестибюле. 4. Кыргызские комузисты с успехом выступали на лучших сценах Европы и Америки. 5. Электронно-вычислительные машины заменяют труд десятков тысяч людей. 6. Улан и Санташ – ветры, дующие в Прииссыккулье. 7. По берегам горных рек, в густых зарослях чия, ещё сохранились <span class=\"pg\" data-n=\"173\">173<\/span>фазаны. 8. Рыболовецкий катер доставил на рыбзавод свежий улов османа и чебака (из газеты)."}],"sub":[],"section":"ДЕВЯТЫЙ КЛАСС","pages":[170,173]},{"title":"§ 47. УСТАРЕВШИЕ И НОВЫЕ СЛОВА В РУССКОЙ ЛЕКСИКЕ.","blocks":[{"t":"h3","h":"§ 47. УСТАРЕВШИЕ И НОВЫЕ СЛОВА В РУССКОЙ ЛЕКСИКЕ."},{"t":"v","l":["Вспомните:","1. Что называется лексико-семантической группой?","2. Как складывается лексика в языке?","3. Приведите примеры исконно русских слов.","4. Приведите примеры заимствованных слов."]},{"t":"p","h":"Постоянное изменвние лексики связано с изменением жизни народа. В жизни происходят перемены, ив словаре изменяются слова. Старое уходит из жизни, а с ним уходят и слова, обозначающие устаревшие явления. Появляются новые явления в жизни, а с ними приходят и новые слова."},{"t":"p","h":"Среди устаревших слов выделяется большая группа историзмов, то есть слов, вышедших теперь из употребления. Историзмы могут использоваться тогда, когда описывают, например, в учебнике истории или в историческом романе прошлые времена. В описании современной жизни историзмы можно применить только в переносном смысле."},{"t":"p","h":"Вот несколько групп русских историзмов:"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Вовнная лексика Названия лиц по<\/td><td>Старинная<\/td><\/tr><tr><td>социальной принад-<\/td><td>одежда<\/td><\/tr><tr><td>лежности и<\/td><\/tr><tr><td>должности<\/td><\/tr><tr><td>кольчуга<\/td><td>помещик<\/td><td>армяк<\/td><\/tr><tr><td>секира<\/td><td>крепостной<\/td><td>зипун<\/td><\/tr><tr><td>пищаль<\/td><td>царь<\/td><td>сюртук<\/td><\/tr><tr><td>забрало<\/td><td>урядник<\/td><td>камзол<\/td><\/tr><tr><td>цилиндр<\/td><\/tr><tr><td>щит<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"Некоторые слова устаревают, х хотя сами явления и остаются. Такие слова называются архаизмами. Вот некоторые русские архаизмы: выя- вместо современного шея, десница – правая рука, доколе – до каких пор, дружество – <span class=\"pg\" data-n=\"174\">174<\/span>дружба, град – город и др. Архаизмы используются писателями и поэтами для рассказов о старине, а также для придания торжественности. Устаревшие слова нередко входят в состав фразеологизмов. Так, архаизм башмак (тюркского происхождения) входит во фразеологизм быть у кого-либо под башмаком, т.е. находиться. у кого-либо в подчинении. Старое слово карета входит в состав выражения В карете прошлого далеко не уедешь, а архаизм меч – во фразеологизм. Взявшие меч от меча и погибнут."},{"t":"p","h":"Новые слова всё время пополняют наш язык. Вот несколько групп новых слов русского языка, появившихся в нём за последние десятилетия: автолюбитель"},{"t":"v","l":["автовокзал","автоклуб","автолавка","автосборочный","телепередача","телерепортаж","телемост","аренда","арендное предприятие","фермер","фермерское хозяйство","телефильм","телемастер","приватизация и др."]},{"t":"p","h":"Назовите тематические группы и лексико-семантическую группу приведённых новых слов."},{"t":"p","h":"Писатели для целей большей художественной выразительности иногда создают свой индивидуальные новые слова. Такие слова называются неологизмами (художественными неологизмами)."},{"t":"p","h":"Так, например, у В. Маяковского можно встретить такие неологизмы, как серпастый, молоткастый, двухметроворостая, громадьё и др."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"1. Как связаны и новые слова с процессом изменения лексики?"},{"t":"p","h":"2. Назовите два типа устаревших слов и приведите примеры."},{"t":"p","h":"3. Назовите примеры новых слов в русском языке."},{"t":"p","h":"4. К каким областям жизни (тематическим группам лексики) часто относятся новые слова?"},{"t":"p","h":"5. Что такое неологизм (художественный неологизм)?"},{"t":"p","h":"<span class=\"pg\" data-n=\"175\">175<\/span>Упражнение 274. Прочитайте. Выпишите устаревшие слова, указывая, к какой лексико-семантической группе они относятся."},{"t":"p","h":"1. На крайнем редуте воевода приказал поставить нёсколько единорогов (В. Костылёв). 2. Камердинер снял с барина пыльный кафтан и, кряхтя, стал стаскивать ботфорты (А. Толстой). 3. Приказчик протянул мне свою руку для поцелуя, но я замахнулся на него тяжёлой гирей (М. Горький). 4. В станице заночевал продотряд из пятнадцати будёновцев (М. Шолохов). 5. Омач и соху на полях Кыргызстана давно заменили могучие тракторы с мощными плугами (Т. Сыдыкбеков)."},{"t":"p","h":"Словарь:"},{"t":"p","h":"редут – вобнное укрепление ботфорты сапоги единорог – пушка"},{"t":"p","h":"Упражнение 275. Перепишите. Подчеркните архаизмы и подберите для замены современные слова."},{"t":"p","h":"Образец: аэроплан – самолёт."},{"t":"p","h":"1. На пбрвых советских аэропланах был совершён беспосадочный перелёт из Москвы в Америку (В. Водопьянов). 2. Любовь и дружество до вас дойдут сквозь мрачные затворы (А. Пушкин). 3. Красуйся, град Петров, и стой неколебимо, как Россия (А. Пушкин). 4. В центре Саратова ещё до революции был открыт первый кинематограф (Л. Кассиль). 5. Редкий парень не любовался прекрасными очами Ули Громовой (А. Фадеев). 6. Над Главным Кавказским хребтом величественно вздымаются две белых главы Эльбруса (А. Марлинский)."},{"t":"p","h":"Словарь:"},{"t":"p","h":"мрачный – карангы вздыматься – (здесь: подниматься) жогору кетерулуу Упражнение 276. Спишите текст. Подчеркните неологизмы и объясните их значение,"},{"t":"p","h":"1. Вертолёт санитарной авиации доставил на высокогорную станцию опытного врача-хирурга. 2. В прошлое воскресвнье наша семья с интересом смотрела новый телефильм. 3. На космодроме «Байконур», расположенном в <span class=\"pg\" data-n=\"176\">176<\/span>степях Казахстана, готовят к запуску космические корабли."},{"t":"p","h":"4. Художники-дизайнеры красиво оформили новые павильоны Выставки достижений народного хозяйства."},{"t":"p","h":"5. Группа девушек с транзистором отдыхала на пляже."}],"sub":[],"section":"ДЕВЯТЫЙ КЛАСС","pages":[174,176]},{"title":"§48. ОБЩИЕ СВЕДЕНИЯ о сложном ПРЕДЛОЖЕНИИ. (Татаал суйлем женунде жалпы маалымат.) СЛОЖНОЕ ПРЕДЛОЖЕНИЕ.","blocks":[{"t":"h3","h":"§48. ОБЩИЕ СВЕДЕНИЯ о сложном ПРЕДЛОЖЕНИИ. (Татаал суйлем женунде жалпы маалымат.) СЛОЖНОЕ ПРЕДЛОЖЕНИЕ."},{"t":"p","h":"(Татаал суилем.)"},{"t":"p","h":"Чтобы выразить одну сложную мысль, два, три и больше предложений могут соединяться вместе. Вот два простых предложения. Пошёл дождь. Мы ушли домой. Они могут соединиться в одно сложное предложение. Например: Пошёл дождь, и мы ушли домой. Или: Мы ушли домой, потому что пошёл дождь."},{"t":"p","h":"Сложное предложение выражает сложную мысль, и в нём можно выделить два или несколько простых предложений. Так, например, в предложении Лошади тронулись, колокольчик загремел, кибитка полетела (А. Пушкин) можно выделить три простых предложения: Лошади тронулись. Колокольчик загремел. Кибитка полетела."},{"t":"p","h":"В предложении Когда страна прикажет быть гердем, у нас героем становится любой (В. Лебедев-Кума ч) выделяется два простых предложения: Когда страна прикажет, быть героем. У нас ‚гербем. становится любой."},{"t":"p","h":"В состав сложного предложения могут входить не только личные, но и безличные предложения. Например: Небо было пасмурно, но дождя не было. Второе простое предложение в составе этого сложного (но дождя не было) – безличное."},{"t":"p","h":"Простые предложения соединяются в сложные как при помощи союзов, так и без союзов. Например:"},{"t":"p","h":"С союзом: Кенеш написал диктант без ошибок, и учительница поставила ему «пять»."},{"t":"p","h":"<span class=\"pg\" data-n=\"177\">177<\/span>Без союза: Светлвет вбздух, яснёет небо, белеют тучки, зеленвют поля"},{"t":"v","l":["Вопросы для повторения:","1. Что такое предложение?","2. Какое предложение выражает сложную мысль?","3. Что можно выделить |: сложном предложении?"]},{"t":"p","h":"4. Какие предложения могут входить в сложное предложение?"},{"t":"p","h":"5. Как соединяются простые предложения в составе сложного предложения?"},{"t":"p","h":"Упражнение 277. Прочтите. Найдите сложные предложения. Назовите простые предложения, из котдрых состоит каждое сложное предложение. Найдите в этих предложениях подлежащее и сказуемое."},{"t":"p","h":"Давно в одном из своих имений жил русский помещик Кирила Петрович Троекуров. Соседи были рады угодить ему, чиновники его боялись. К крестьянам он относился сурово, но они гордились богатством и славой своего господина. Дубровский был его соседом, У него было семьдесят крестьян. Троекуров любил своего соседа, и они каждый день бывали вместе. Когда была хорошая погода, они вместе ездили на охоту. Соседи удивлялись смелости Дубровского, когда он за столом у Кирилы Петровича прямо высказывал своё мнение. Сын Дубровского воспитывался в Петербурге, дочь Кирилы Петровича росла дома. Троекуров часто говорил, что он отдаст свою дочь за сына Дубровского."},{"t":"p","h":"По А. Пушкину. Словарь:"},{"t":"p","h":"имение – езуне тиешелуу жер, угодить – кенулун табуу господин – тере мулк, корук Упражнение 278. Составьте из каждой группы простых предложений сложные предложения. Запишите их. Подчеркните подлежащие простых предложений одной чертой, а сказуемые – двумя чертами."},{"t":"p","h":"Образец: Солнце поднялось высоко, но жары не было."},{"t":"p","h":"1. Солнце поднялось высоко. Жары не было (но)."},{"t":"p","h":"2. Вспыхнула молния. Грозно загремел гром (и)."},{"t":"p","h":"<span class=\"pg\" data-n=\"178\">178<\/span>8. Прозвенел третий звонок. В зале погас свет. Кинофильм начался (и). 4. Трактор не работает. Испортился мотор (потому что). 5. Сабуров пришёл в штаб. Приказ печатался на машинке (когда). 6. Я надеялся. Ветер разгонит тучи (что). Т. Снайпер тщательно прицелился. Пуля попала точно в цель (чтобы)."},{"t":"v","l":["Словарь:","грозно – катуу","испортиться – бузулуп калуу","приказ – буйрук","печататься – басуу","надеяться – ишенуу","снайпер – (меткий стрелок)"]},{"t":"h3","h":"кезге атар"},{"t":"p","h":"Упражнение 279. Составьте из групп слов предложения. Запишите их. Найдите союзы, при помощи которых соединяются простые предложения в сложные, и подчеркните их."},{"t":"p","h":"1. Так как, Шарапат, цветы, не поливать, они, быстро, завянуть. 2. Чтобы не ночевать, в, юрта, д душной, мы легли, на, свежее сено. 3. Густой дым, подниматься, над, лес, огонь, постепенно, угасать, но. 4. Если, причастный оборот, стоять, в, середина, предложение, он, с двух сторон, выделяться, запятые. 5. Обратный путь, быть, легче, жаркое солнце, подсушить, дорога, потому что. 6. Хотя, стоять, небывалый, жара, в, глубокий, ущелье, быть, прохладно. Утром, я, убирать, в, комната, а, сестра, покупать, продукты, в, магазин."},{"t":"v","l":["Словарь:","","завянуть – солуу","душная юрта – боз уй уп","болуп турат","угасать – очуу","обратный путь – кайра кайткан жол","небывалый – болбогон"]},{"t":"p","h":"Упражнение 280. Выпишите четыре сложных предложения из литературного текста по указанию учителя. Вертикальными чёрточками (!) разграничьте эти предложения на простые. Укажите, как соединены в них простые предложения."}],"sub":[],"section":"ДЕВЯТЫЙ КЛАСС","pages":[177,178]},{"title":"§ 49. СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"179\">179<\/span>§ 49. СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ."},{"t":"v","l":["(Тен байланыштуу суйлем.)","","Повторить $ 5, 9.","Вспомните:"]},{"t":"p","h":"1. Как называется такая связь между словами, когда одно слово зависит от другого?"},{"t":"p","h":"2. Как называется такая связь между словами, когда слова равноправны, не зависят один от другого?"},{"t":"p","h":"Так же, как слова в составе простого предложения, простые предложения, входящие в состав сложного предложения, могут быть связаны по способу сочинительной связи или по способу подчинительной связи."},{"t":"p","h":"Сложное предложение, состоящее из равноправных простых предложений, соединённых сочинительными союзами, называется сложносочинённым предложением. Наприме р: Трид кормит, а лень портит (пос. повица). Река разлилась широко, и домик лесника оказался в воде."},{"t":"p","h":"Надо различать сложносочинённые предложения и простые предложения с одними и же союзами. В сложных предложениях союзы соединяют отдельные простые предложения, а в простых предложениях сочинительные союзы употребляются между"},{"t":"v","l":["Сравните:","Ваня и Маша пошли","в школу. Петя не пишет,","а читает."]},{"t":"p","h":"членами предложения."},{"t":"p","h":"Ваня ушёл в школу, Маша пошла на урок. Петя пишет, а Ваня читает. В левом столбике – простые предложения с однородными членами, соединёнными союзами, а в правом – сложные предложения, в которых те же союзы соединяют простые предложения."},{"t":"p","h":"Простые предложения, составляющие сложносочинённое предложение, отделяются друг от друга запятой. Запятая ставится перед союзом. Например: Высоко в небе сияло солнце, а горы зноем дышали в небо (М. Горький). Душно стало в сакле, и я вышел на воздух освежиться (М. Лермонтов)."},{"t":"p","h":"<span class=\"pg\" data-n=\"180\">180<\/span>Примечание. Если в сложносочинённом предложении с союзом и имеется общий второстепенный член предложения, относящийся к обоим предложениям, то запятая между простыми предложениями не ставится. Наприме р: По улицам двигались трамваи и мчались легковые автомобили. В этом предложении. обстоятельство места по улицам относится к обоим простым предложениям, поэтому запятая между ними не ставится."},{"t":"p","h":"Задание. Образуйте сложносочинённые предложения, соединив при помощи союза и два простых предложения."},{"t":"p","h":"1. Буйно заколосилась пшеница. Первые комбайны поплыли по золотой ниве. 2. Киномеханик включил киноаппарат. На экране появились первые кадры новой кинокомедии. 3. Чабан открыл ворота. Отара овец вышла из кошары. 4. Подул сильный ветер. С высоких тополей посыпались жёлтые листья. 5. Закончились вступительные экзамены. Многие выпускники сельских школ стали студентами. 6. Самолёт пошёл на посадку. Пассажиры пристегнули ремни. 7. Ася открыла окно. Комната наполнилась запахом цветов. 8. Профессор вошёл в аудиторию. Лекция началась."},{"t":"p","h":"Упражнение 281. Выпишите сложносочинённые предложения. Подчеркните союзы, которыми связаны простые предложения. Объясните устно, что связывает эти союзы в простых предложениях."},{"t":"p","h":"1. Начинало темнеть, и на сизом небе зажигались первые звёзды (А. Чехов). 2. Картина Репина произвела на Третьякова сильное впечатление, и он купил её (Я. Минчёков)."},{"t":"p","h":"3. Дедушка аккуратно написал обратный адрес и заклеил конверт (Ю. Клименченко). 4. Люди вышли из рощи, и Владимир увидел впереди деревянную церковь (А. Пушкин)."},{"t":"p","h":"5. Умный смотрит на огонь, а глупый заглядывает в казан (кыргызская пословица). 6. Друзья высказали Пете своё плохое мнение о нём, но он нисколько не смутился. 7. Мы 6хали на юг, а зима догоняла нас с севера (В. Короленко)."},{"t":"p","h":"8. Груз был громоздкий, но не тяжёлый (Г. Николаева)."},{"t":"v","l":["<span class=\"pg\" data-n=\"181\">181<\/span>сизый – когултур","впечатление – таасир этуу","церковь – чиркее","нисколько – таптакыр","смутиться – ынгайсыздануу"]},{"t":"p","h":"Упражнение 282. При помощи союзов и, а, но составьте сложные предложения из данных простых предложений."},{"t":"p","h":"Водитель сел в кабину. Огромный самосвал подъехал к экскаватору. 2. В почтовом ящике лежали сегодняшние газеты. Телеграммы нб было. 3. Между близнецами было большое сходство. Мы их всё-таки различали. 4. Николай Островский тяжело заболел. Врачи направили его на лечение |: Крым. 5. Учитель привёл доказательство. Вывод мы сделали сами. 6. Мы в разных странах рождены. Все мы не хотим войны. Т. Камчыбеку досталось спелое яблоко. Мне – зелёное. 8. Сестра посоветовала Айше поступить в техникум. Она выбрала торговый техникум."},{"t":"v","l":["Словарь:","сегодняшний – бугунк\\","близнецы – эгиздер","вывод – корутунду","достаться – энчисине тийуу","сходство – окшоштук","доказательство – далил","советовать – кенеш айтуу","торговый – соода"]},{"t":"p","h":"Упражнение 283. Перепишите, вставляя вместо многоточия союзы а, и, но, или. Расставьте знаки препинания."},{"t":"p","h":"1. Верёвка хороша длинная ... речь хороша короткая (пословица). 2. Поезд приближался к тоннелю ... проводник закрыл окно в вагоне. 3. Иссык- Куль по площади меньше Балхаша воды в Иссык- Куле в два раза больше, чем в Балхаше. 4. За курганом послышался визг. Это ... дрались одичавшие собаки ... шакалы делили добычу. 5. Через три дня отец вернулся домой ... сын остался служить на заставе."},{"t":"p","h":"6. Мы долго звали наших спутников ... они не откликались. С Джалал- Абаде состоялось совещание хлопкоробов ... мой отец участвовал в нём."},{"t":"v","l":["Словарь:","","визг – каншылоо","одичавший – жапайы болуп кеткен","шакал – чее","откликнуться – унчугуу","совещание – кенешме"]},{"t":"p","h":"<span class=\"pg\" data-n=\"182\">182<\/span>Упражнение 284. Из приведенных групп слов составьте сложносочинённые предложения."},{"t":"p","h":"1. Вечером, в, парк, играть, оркестр, и, петь, железнодорожники, хор. 2. Землетрясение, недолго, продолжаться, но, разрушить, оно, несколько домов. 3. Пугачёв, махнуть, рука, и, казаки, отпустить, меня. 4. Золотистая пшеница, уже, давно, поспеть, а, коробочки хлопка, ещё, не, раскрыться. 5. У моего, друг, произойти, неприятность, но, я, не знать, об этом. 6. Учитель, объяснять, урок, а, ученики, слушать, внимательно. 7. Или, дедушка, приехать, в гости, или, я, поехать, к нему, на джайлоо."},{"t":"p","h":"Словарь:"},{"t":"p","h":"золотистый – алтын тустуу неприятность – жагымсыз иш"},{"t":"p","h":"Упражнение 285. Составьте по одному сложносочинённому предложению на следующие темы. (Для справок берите слова из столбика справа.)"},{"t":"p","h":"Образец: Весна. Ярко светит солнце, и люди снимают тёплую одежду."},{"t":"raw","h":"<h4 class=\"mk\">1. Весна. 2. На уроке. 3. После уроков. 4. Кем работают твой родители?<\/h4>"},{"t":"p","h":"1) Ярко, светить, солнце, люди, сни-"},{"t":"v","l":["мать, тёплая одежда.","2) Учитель, диктовать, упражнение,","ученики, расставлять, запятые.","3) Мальчики, копать, земля, девочки,","сажать, иветы.","4) Отец, работать, бригадир, мать,","лечить, больных."]},{"t":"p","h":"Упражнение 286. Ответьте на вопросы, употребляя сложные предложения. Для ответов можно использовать слова, приведённые в столбике справа. Запишите отвёты. Подчеркните союзы и расставьте запятые."},{"t":"p","h":"Образец: Барсы живут в горах, а сайгаки живут в степи."},{"t":"v","l":["1. Где живут барсы и сайгаки?","2. Откуда прилетают весной","ласточки и скворцы?","в горах, в степи","из Африки, из Индии","<span class=\"pg\" data-n=\"183\">183<\/span>3. В какие моря впадают","Волга и Днепр?","4. Что двлают молотком и","что делают пилой?","5. Из чего делают сахар и","сливочное масло?","6. Чем увлекаются твой","друзья?","в Каспийское море, в","Чёрное море","забивать гвозди,","пилить дерево","из сахарной свёклы,","из молока","собирать марки,","играть в шахматы"]}],"sub":[],"section":"ДЕВЯТЫЙ КЛАСС","pages":[179,183]},{"title":"§ 50. СЛОЖНОПОДЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","blocks":[{"t":"h3","h":"§ 50. СЛОЖНОПОДЧИНЁННОЕ ПРЕДЛОЖЕНИЕ."},{"t":"v","l":["(Багынынкы татаал суйлем.)","","Повторить $ 9.","Вспомните:"]},{"t":"p","h":"1. Какие два основных типа связи между словами в предложении вы знаете?"},{"t":"p","h":"2. Как называется сложное предложение, в котором простые предложения соединены сочинительными союзами?"},{"t":"p","h":"3. Какая связь между словами в предложении называется подчинительной? Приведите примеры подчинительной связи."},{"t":"p","h":"В сложных предложениях подчинительная связь заключается в том, что одно простое предложение является главным, а другое подчиняется ему. Например: Я ушёл, когда начался дождь. Первое предложение Я ушёл – главное. Второе предложение когда начался дождь поясняет, когда, в какое время происходило действие первого предложения. Первое предложение независимо. Второе предложение зависит от главного предложения, подчинено ему, поясняет один из его членов."},{"t":"p","h":"Сложное предложение, |: котором одно предложение подчинено другому, поясняет его, называется сложноподчинённым предложением. Независимое, поясняемое предложение, которому подчинены другие предложения, входящие в состав сложноподчинённого, называется главным. Предложение подчинённое, зависящее от другого, поясняющее его, называется придаточным."},{"t":"p","h":"<span class=\"pg\" data-n=\"184\">184<\/span>Главное и придаточное предложения соединяются при помощи союзов или союзных слов."},{"t":"p","h":"Разберём сложноподчинеёенное предложение Некрасов мечтал, чтобы простые люди читали егд произведения. В Этом сложном предложении второе предложение поясняет пбрвое: в нём говорится, о чём мечтал Некрасов. Оно отвечает на вопрос о чём? и относится к сказуемому первого предложения. Главное предложение – Некрасов мечтал, придаточное – чтобы простые люди читали его произведения. Главное и придаточное предложения связываются при помощи союза чтобы."},{"t":"p","h":"Простые предложения, составляющие сложноподчинённое предложение, разделяются на письме запятыми. Бойцы вспоминают минувшие дни и битвы, где вместе рубились они. Если придаточное предложение находится внутри главного, оно выделяется запятыми с обеих сторон: Тулип, из которого я успел вырасти, был немножко для него узок (А. Пушкин). Главное предложение разделяется придаточным на две части. Придаточное предложение из которого я успел вырасти выделено с двух сторси запятыми."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"1. Какое предложение называется сложноподчинённым?"},{"t":"p","h":"2. Какое предложение называется главным?"},{"t":"p","h":"3. Какое предложение называется придаточным?"},{"t":"p","h":"4. Как соединяются главные и придаточные предложения?"},{"t":"p","h":"5. Какие знаки препинания ставятся между простыми предложениями в сложносочинённом предложении?"},{"t":"p","h":"6. Как выделяется на письме придаточное предложение, находящееся внутри главного?"},{"t":"p","h":"Задание. Постройте схемы сложносочинённого и сложноподчинённого предложений."},{"t":"p","h":"Упражнение 287. Прочтите и перескажите текст. Найдите в тексте сложносочинённые и сложноподчинённые предложения. САРУ."},{"t":"p","h":"Если будешь ехать южным берегом Иссык- Куля, то обязательно побываешь в Сару. Это большое село, каких немало в Джеты-Огузском и в других районах республики. Я часто бывал здесь, когда работал в областном комитете."},{"t":"p","h":"<span class=\"pg\" data-n=\"185\">185<\/span>Но каждый раз я замечал одну интересную особенность: по улицам этого большого села бегали смуглолицые ребятишки с большими чёрными глазами, но имели они русские имена: Андрей, Николай, Миша, Мария, Зоя, Наташа. Вместе с ними играли русские дети, а звали их Аскарами, Искендерами, Мамбетами, Гулями и Динарами. Седой аксакал Орозалы объяснил мне, что в селе живут люди двадцати национальностей. В трудные военные годы в Сару был эвакуирован детский дом из Ленинграда, и кыргызы тепло приняли голодных и больных русских ребятишек. Они разместили их в своих семьях, накормили, обогрели, вылечили. На берегу озера также поселились тогда многие украинские, белорусские семьи, которые приехали сюда из районов, временно захваченных врагом. Прошли годы, и эти люди остались здесь жить навсегда. Они крепко полюбили этот горный край, потому что нашли здесь своё счастье. В Сару и других кыргызских сёлах появилось много интернациональных семей. Люди дружно живут и дружно работают, поэтому в каждом доме тебя встретят как родного. А по улицам села бегают черноглазые и сероглазые ребятишки с кыргызскими и русскими именами."},{"t":"p","h":"По М. Шеримкулову. Упражнение 288. Выделите вертикальными чёрточками в сложноподчинённых предложениях составляющие их простые предложения. В этих простых предложениях подчеркните главные члены (подлежащее – одной чертой, а сказуемое – двумя чертами)."},{"t":"p","h":"1. Там, где грозно поднимались утёсы, показалась золотистая полоска зари. 2. Мнение, которое высказал председатель собрания, вначале никто не поддержал. 3. Когда Танабай получил приказ сдать иноходца, он сгоряча решил не выполнить его. 4. Если рядом находился Чоро, Танабай был спокоен за исход дела. 5. Хотя с утра небо было безоблачным, но к вечеру неожиданно, погода испортилась. 6. Прежде всего Танабай решил починить крышу, потому что сквозь старую крышу вода протекала, как сквозь решето. т. Я благословила хлеб, который испекли из муки нового урожая."},{"t":"p","h":"8. Мальчик перестал дышать, чтобы не испугать маралов. По Ч. Айтматову."},{"t":"p","h":"<span class=\"pg\" data-n=\"186\">186<\/span>исход дела – иштин натыйжасы благословить – бата беруу"},{"t":"p","h":"Упражнение 289. Составьте из приведённых пар предложений сложноподчинённые предложения. В качестве союзов используйте слова, указанные в скобках."},{"t":"p","h":"Образец: Если ветер утихал, в саду начинали летать жёлтые бабочки."},{"t":"p","h":"1. Ветер утихал. В саду начинали летать жёлтые бабочки (6сли). 2. Руководитель художественной самодеятельности объявил. Приглашения на концерт разосланы (что)."},{"t":"p","h":"3. Сергей выдержал все испытания. Он не боялся трудностей (потому что). 4. Пржевальский умирал. Он просил похоронить его на берегу Иссык-Куля (когда). 5. Вершины гор покрыты вечным снегом. На их склонах летом растёт мох (хотя)."},{"t":"v","l":["Словарь:","руководитель – жетекчи","приглашение – чакыруу","испытание – сыноолор","художественная самодеятельность —","оздук керкем чыгармачылык","вечный – тубелуктуу"]},{"t":"p","h":"Упражнение 290. Переделайте сложносочинённые предложения в сложноподчинённые. Для связи используйте слова в скобках. Составьте схемы двух сложносочинённых и двух сложноподчинённых предложений."},{"t":"p","h":"Образец: Люди назвали Токтогула любимым акыном, потому что он пел свои песни для народа."},{"t":"p","h":"1. Токтогул пел свой песни для народа, и люди назвали его любимым акыном (потому что). 2. Командир приказал, и бойцы атаковали врага (чтобы). 3. В старом замке был музей, его осматривали экскурсанты (который). 4. Бегун будет настойчиво тренироваться, и рекорд на стометровку будет побит (если). 5. Инженеры составили график, и начались испытания новой машины (когда). 6. Малышам запрещали ходить к плотине, но однажды они пришли сюда (хотя)."},{"t":"v","l":["<span class=\"pg\" data-n=\"187\">187<\/span>приказать – буйрук беруу","замок – сепил, сарай","настойчиво – дегенин койбой","составить – тузуу","запрещать – тыюу"]},{"t":"p","h":"Упражнение 291. Дайте полные ответы на поставленные вопросы, используя, как в образце, сложноподчинённые предложбния. Для справок используйте слова, данные в скобках."},{"t":"p","h":"Образец: Почему Зуура стала гербем труда? – Зуура стала гердем труда, потому что она честно трудилась на ферме."},{"t":"p","h":"1. Почему Зуура стала героем труда? (она честно трудилась на ферме). 2. Когда чабаны вернутся в долину? (наступит весна). 3. Почему бушевала река? (в горах прошли сильные дожди). 4. При каком условии можно получить воду? (соединить кислород и водород). 5. Куда ты доставишь Эту записку? (туда, где работает мой отец). 6. Какое место отмётил учитель на карте? (то место, где найдено большде месторождение газа)."},{"t":"p","h":"Словарь:"},{"t":"p","h":"доставить – жеткизу\\ отметить – белгилее"},{"t":"p","h":"Упражнение 292. Переведите с кыргызского на русский, используя сложноподчинённые предложения. Перевод запишите, расставьте знаки препинания."},{"t":"p","h":"1. Павел жатып уктап калганда, энеси тешегунен туруп келди. 2. Жанболот сабагына келбесе да, мугалимдин суроолоруна так жооп берди. 3. Искендер жакшы окугандыктан, мактоо грамотасын алды. 4. Эгерде алар калышса, менин да калышым керек. 5. Биз кайда кааласак, ошол жакка барабыз. 6. Окуучу тапшырманы билбегендиктен, биз класста калдык."},{"t":"p","h":"Упражнение 293. Составьте сложноподчинённые предложения из приведённых групп слов. Придаточные предложения подчеркните. Расставьте запятые."},{"t":"p","h":"Образец: Скрипач перестал играть, потому что порвалась струна."},{"t":"p","h":"<span class=\"pg\" data-n=\"188\">188<\/span>1. Перестал играть, скрипач, порвалась струна, потому что. 2. Зрители, тепло, приветствовать, участников самодвятельности, дать, интересный, концерт, которые."},{"t":"p","h":"3. Сестра, включить, радио, я, услыхать, знакомый, мотив, когда. 4. Отец, получить, в июле, отпуск, мы, поехать, отдыхать, на Иссык-Куль, если. 5. Председатель, приказал отремонтировать, мост, тракторы, проехать, на, другой,"},{"t":"p","h":"чтобы. 6. Милиция, арестовать, преступник, совершить, убийство, который. 7. Карагул, важное поручение, исполнить, он, получить, награда, если."},{"t":"v","l":["Словарь:","","струна – комуздун, кыяктын кылы","зрители – керуучулер","участник катышуучу","приветствовать – куттуктоо","мотив – обон, мотив","преступник кылмышкер","убийство – олтуруу"]}],"sub":[],"section":"ДЕВЯТЫЙ КЛАСС","pages":[184,188]},{"title":"§ 51. СЛОЖНОСОЧИНЁННЫЕ ПРЕДЛОЖЕНИЯ","blocks":[{"t":"h3","h":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ."},{"t":"h3","h":"§ 51. СЛОЖНОСОЧИНЁННЫЕ ПРЕДЛОЖЕНИЯ"},{"t":"v","l":["С СОЮЗАМИ (в значении и).","","Повторить $8 8, 49.","","Вспомните:"]},{"t":"p","h":"1. Какое предложение называется сложносочинённым?"},{"t":"p","h":"2. Как относятся друг к другу простые предложения в составе сложносочинённого предложения?"},{"t":"p","h":"3. Как соединяются простые предложения в составе сложносочинённого предложения?"},{"t":"p","h":"Сложносочинённое предложение может состоять из простых соединённых союзом и. Этот союз выражает значение соединвния, объединения, ему приблизительно соответствуют в кыргызском языке союзы жана, да. Сложносочинённые предложения с союзом и встречаются в русском языке очень часто. Например:"},{"t":"p","h":"<span class=\"pg\" data-n=\"189\">189<\/span>Подошёл поезд, и пассажиры вошли в вагоны. День уходит, и прохлада освежает и бодрит (В. Лебедев-Кум ач)."},{"t":"p","h":"Союз и может соединять не только два предложения, но и больше. Например: Прозрачный лес один чернеет, и ель сквозь иней зеленеет, и речка подо льдом блестит (А. Пушкин)."},{"t":"p","h":"Простые предложения, соединяемые союзом и, часто обозначают действия, происходящие одновременно. Например: Все жаловались на холод, и дождь стучал в окна. (А. Чёхов). Но нередко союз и соединяет предложения, которые показывают действия, следующие одно за другим. Сначала происходит одно действие (которое описано в первом предложении), а потом – второе, описанное во втором предложении. Например: Дверь открылась, и мальчик вошёл в комнату. В этом предложении сначала происходит одно действие – открывается дверь, а потом второе – входит мальчик."},{"t":"p","h":"В том же значении, что и союз и, можно встретить союз да. Например: Только кукушка вдали куковала, да, как безумная, галка кричала (Н. Некр асов)."},{"t":"p","h":"Задание. Дополните начатые конструкции так, чтобы получились сложносочинённые предложения."},{"t":"p","h":"Дежурный открыл окно, и ....2. Агрономы применили передовую агротехнику, и .... 3. Волейболисты вышли на площадку, и .... 4. Джигиты сёли на лошадей, и ....5. Над птицефермой пролетел коршун, и... 6. Закончилось строительство многоэтажного дома, и нуло солнце, и .... 8. Больной Т. Из-за туч выгля-"},{"t":"p","h":"лекарство, 9. Наступил праздник, и... 10. Матросы подняли парус, и"},{"t":"p","h":"11. Началось солнечное затмение, и .... 12. Отец подарил сыну аккордеон, и .... 13. В селе открылась музыкальная школа, и .... 14. Над страной поднимается солнце, и 15. Дети перегородили ручей, и ...."},{"t":"p","h":"Упражнение 294. Перепишите. Найдите сложносочинённые предложения. Подчеркните союзы, соединяющие предложения, одной чертой, а соединяющие слова в простом предложении, – двумя чертами."},{"t":"p","h":"<span class=\"pg\" data-n=\"190\">190<\/span>1. Кучер свистнул, и тройка выехала из ворот усадьбы (Д. Мамин-Сибиряк). 2. Новое вещество имело большой вес и небольшой объём. 3. Теплоход подходил к пристани, и все пассажиры стояли на палубе (В. Катаев). 4. Гремела атака, и пули звенели, и ровно строчил пулемёт (из песни)."},{"t":"p","h":"5. Иностранцы долго любовались московскими дворцами и памятниками. 6. Поднялось солнце, и ожили леса, горы и поля. 7. Утки перед дождём плещутся, да трава сильно пахнет (И. Тургенев). 8. Салмоорбёек дорожил оказанным ему доверием и старался оправдать его. 9. В нашей стране начался бурный процесс перестройки, и многие заводы и фабрики стали работать по-новому."},{"t":"v","l":["Словарь:","тройка – арабага, чанага","кошулган уч ат","пристань – кеме токтоочу жер","иностранец – чет еолкелук адам","вес – салмак","объём – кеолем","дорожить – баалоо, барктоо","оправдать – актоо"]},{"t":"p","h":"Упражнение 295. Выпишите сначала сложносочинённые предложения, в которых действие происходит одновременно, а потом предложения, в которых сначала происходит одно действие, а потом – другое. Подчеркните союзы и расставьте знаки препинания."},{"t":"p","h":"1. Гроза миновала и в роще оживлённо защебетали птицы (М. Пришвин). 2. Голуби ворковали на крыше да звонко кричали петухи (М. Шолохов). 3. Льдина треснула и лошадь с санями упала в воду (Д. Мамин-Сибиряк). 4. Дети спят и хозяйка дремлет (А. Пушкин). 5. Пришёл июль и в Ашхабаде наступила невыносимая жара (К. Паустовский)."},{"t":"p","h":"6. От смелого смерть бежит и враг перед ним дрожит."},{"t":"p","h":"7. Акын пел о счастье народа и струны комуза звенели в его проворных руках."},{"t":"v","l":["Словарь:","миновать – этуп кетуу","оживлённо – жандуу, кызуу","защебетать – сайроо, чурулдоо","ворковать – куркулдоо","треснуть – сынып кетуу","невыносимый – чыдагыс"]},{"t":"p","h":"Упражнение 296. Перепишите. В тех сложносочинённых предложениях, где есть общий второстепенный член, подчеркните <span class=\"pg\" data-n=\"191\">191<\/span>его одной чертой. Союзы подчеркните двумя чертами. Расставьте, где нужно, запятые."},{"t":"p","h":"1. Над Волгой плыли облака и сияло яркое солнце (В. Некрасов). 2. Сугроб развалился и показалась морда белого медведя (Д. Мамин- Вечером агрономы съехались в райцентр и совещание началось (В. Овечкин)."},{"t":"p","h":"4. Шумел вековой лес да робко куковала поздняя кукушка (В. Короленко). 5. В школе мы приобретаем знания и учителя. учат нас применять их в жизни. 6. Советские воины перешли в наступление и обратили противника в бегство."},{"t":"p","h":"7. Ездовой выскочил из брички и тощая лошадка стала вытаскивать её из канавы. 8. Для нас цветут сады и зеленеют нивы."},{"t":"v","l":["Словарь:","развалиться – мында: бузулуп калуу","вековой – столетний; кылымдык","робко – коркуп","применять – колдонуу","бегство – качуу","тощий – арык, кетерум"]},{"t":"p","h":"Упражнение 297. Переведите сложные предложения с кыргызского языка на русский, употребляя союз и."},{"t":"p","h":"1. Булут таркады да, кун керунду. 2. Кар кетет да, жаз келет. 3. Жай келет да, биз каникулга чыгабыз. 4. Кыш келди да, тун узарды."},{"t":"p","h":"Упражнение 298. Составьте из данных групп слов сложносочинённые предложения с союзом и. Запишите их, расставляя запятые."},{"t":"p","h":"1. Юные путешественники, сбиться, с, путь, старый, лесник, показать, они, дорога. 2. Болот, осознать, свой, ошибка, он, решить, больше, не повторять, их. 3. Лагерный повар, вкусно, зажарить, картофель, пионеры, охотно, закусить. 4. Ночью, прозвучать, сигнал, тревога, бойцы, быстро, встать, в, строй. 5. Изредка, наплывать, тучи, моросить, мелкий, дождь."},{"t":"v","l":["Словарь:","сбиться – адашуу","осознать – мойнуна алуу","повар – ашпозчу","охотно – каалагандык менен","закусить – шам-шум этуу,","езек жалгоо","прозвучать – угулуу"]},{"t":"p","h":"<span class=\"pg\" data-n=\"192\">192<\/span>Упражнение 299. Перепишите, расставляя вместо точек союзы и запятые. Подчеркните союзы. В сложных предложениях союз и подчеркните двумя чертами."},{"t":"h3","h":"ИЗВЕРЖЕНИЕ ВУЛКАНА."},{"t":"p","h":"Группа туристов направилась к потухшему вулкану. На пути лежали обломки скал ... искрился снег. Вдруг путники почувствовали подземные толчки и колебание почвы. Потом они отметили появление над кратером грязно- -жёлтого дыма. Вулкан загрохотал ... из кратера полетели вверх раскалённые камни. Туристы остановились и стали наблюдать извержение вулкана."},{"t":"p","h":"Вот долетел резкий запах серы .. посыпался пепел. Чистый снег быстро покрылся слоем серого пепла. Земля под ногами дрожала огненная лава стекала в море. Вода около берега кипела ... рядом плавала мёртвая рыба."},{"t":"p","h":"Люди долго не могли забыть это нечастое, но грозное явление природы."},{"t":"p","h":"По В. Пескову. Словарь: извержение вулкана – вулкандын"},{"t":"v","l":["атырылып чыгышы","толчок – силкинуу","колебание – чайпалуу, термелуу","появление – пайда болуу","пепел – кул","слой – катмар, кабат","нечастый – редкий; сейрек"]},{"t":"p","h":"явление природы – табият-"},{"t":"p","h":"тын кубулушу"}],"sub":[{"title":"ИЗВЕРЖЕНИЕ ВУЛКАНА.","b":35}],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[189,192]},{"title":"§ 52. СЛлОЖНоОСОЧИНЁННЫЕ ПРЕДЛОЖЕНИЯ С СОЮЗАМИ А, НО, ОДНАКО.","blocks":[{"t":"h3","h":"§ 52. СЛлОЖНоОСОЧИНЁННЫЕ ПРЕДЛОЖЕНИЯ С СОЮЗАМИ А, НО, ОДНАКО."},{"t":"v","l":["Повторить $5 8, 49.","Вспомните:","1. Какое предложение называется сложносочинённым?"]},{"t":"p","h":"2. Что выражает союз и всложносочинённых предложениях и как его передать по-кыргызски?"},{"t":"p","h":"Простые предложения могут соединяться в сложносочинённые посредством союзов а, но, однако. По-кыргызски Эти союзы можно примерно передать союзами бирок, а и другими."},{"t":"p","h":"<span class=\"pg\" data-n=\"193\">193<\/span>Значение союзов а, но, однако близко друг к другу. Все они показывают, что действия простых предложений, соединённых ими, противопоставляются. Например: Кадыр пошёл в кино, а Кенеш отправился в школу. В этом Е. противопоставлены действия Кадыра и Кене-. Противопоставление выражено союзом а. По-кыргызски это предложение можно перевести примерно так: Кадыр киного кетти, а Кенеш мектепке женеду."},{"t":"p","h":"Ещё ярче значение противопоставления выражается союзом но. Например: Снег засыпал все горы, но снежные бури не приходили в долину. В этом предложении резко противопоставлена погода в горах и в долине."},{"t":"p","h":"Один из важных оттенков значения союза но – это несоответствие между тем, что происходит в одном и в другом предложениях, соединённых союзом но. Например: Мы ждали Светлану целый день, но она не пришла. То, что Светлана не пришла, не соответствует мысли первого предложения, в котором говорится о том, что её ждали."},{"t":"p","h":"Подобное значение имеет союз однако. Например:"},{"t":"p","h":"усмехнулся, однако чело и взор омрачились думой (А. Пушкин). В этом предложении противопоставлена усмешка (улыбка) Олега (первое предложение) тому, что он глубоко задумался (второе предложение)."},{"t":"p","h":"Союзы но и однако настолько близки друг к другу по значению, что в предложениях их часто можно заменять друг другом, не изменяя при этом смысла предложения. Так, можно сказать: Я хотел пойти в кино, однако билеты уже были распроданы. Но можно союз однако заменить союзом но: Я хотел пойти в кино, но билеты уже были распроданы."},{"t":"p","h":"Иногда в том же значении, что и союз но, употребляется союз да. Он чаще используется в разговорной речи. Нап рим Лучше было бы мне бросить коня и скрыться в лесу, да жаль было с ним расстаться (М. Лермонтов)."},{"t":"p","h":"Задание. Дополните начатые конструкции так, чтобы получились сложносочинённые предложения с союзами а, но, однако."},{"t":"p","h":"т Гульнара мечтает стать врачом, а .... 2. Конь за час пробегает сорок километров, а .... 3. Мать ждала сына <span class=\"pg\" data-n=\"194\">194<\/span>несколько лет, однако .... 4. Хотели пойти в Барскаунское ущелье, но 5. Смелые идут впереди, а .... 6. Работа на сенокосе была напряжённой, однако .... Т. Можно уехать из родного дома, но .... 8. В Москве р полночь, а ...."},{"t":"p","h":"9. Наташа несколько раз звонила подруге, однако .... 10. Не имей сто рублей, а .... 11. Барс приготовился к прыжку, но .... 12. Пришли в клуб на репетицию, однако ...."},{"t":"p","h":"Упражнение 300. Прочтите. Выпишите сложносочинённые предложения. Подчеркните в них союзы со значением соединения одной чертой, а со значением противопоставления – двумя чертами. Расставьте знаки препинания."},{"t":"p","h":"1. Приближался апрель а морозы не ослабевали (М. Пришвин). 2. Между народами страны существуют равенство и братство. 3. Сильный ветер опрокинул лодку и матросы добирались до берега вплавь (Л. Соболев)."},{"t":"p","h":"4. Егорка хотел стать лесорубом да отец не отпустил его в тайгу (В. Саянов). 5. Пугачёв остановился на крыльце и со всеми поздоровался (А. Пушкин). 6. Прошло несколько дней а здоровье бедного Дубровского не улучшалось (А. П ушкин 1 7. Пришёл Октябрь и кыргызский народ запел счастливые песни (А. Токомбаев)."},{"t":"v","l":["Словарь:","","сдержать своё слово – оз сезун эки","кылбоо, сезунде туруу","равенство – тендик","братство – бир туугандык"]},{"t":"p","h":"Упражнение 301. Перепишите. Скажите, какими союзами соединены сложносочинённые предложения. Каково значение этих союзов? Расставьте запятые. Вспомните похожие кыргызские пословицы."},{"t":"p","h":"1. Человек умирает но дело его не пропадает. 2. Сосед пашет а лентяй руками машет. 3. Глупый ищет видное место а умного и в углу видно. 4. Красна птица пением а человек – умением. 5. Близок локоть да не укусишь. 6. Веника не сломишь а прутья по одному все переломаются. 7. Мал муравей но сила его гору свернёт."},{"t":"v","l":["Словарь:","красна (здесь: красива, отличается чем-то) – сулуу"]},{"t":"p","h":"<span class=\"pg\" data-n=\"195\">195<\/span>Упражнение 302. Перепишите. Вместо многоточия вставьте союзы. Расставьте знаки препинания. Подчеркните в простых предложениях, входящих в состав сложных, подлежащее одной чертой, а сказуемое – двумя."},{"t":"p","h":"1. Много в мире есть красивых городов ... самый лучший из них – Москва (В. Михайлов). 2. Бурулча хотела поговорить с Джапаром ... он молча ушёл в свою комнату (К. Баялинов). 3. Хотелось пить ... дети купили лимонад."},{"t":"p","h":"4. Усталые лошади вскоре отстали ... верблюды безостановочно шли вперёд (К. Паустовский). 5. Партизаны напали ночью ... сонные фашисты не смогли найти спасения (Б. Полевой). 6. Производительность труда на автозаводе увеличилась вдвое .. брак продукции уменьшился в несколько раз."},{"t":"v","l":["Словарь:","","спасение – чара, ылаажы"]},{"t":"p","h":"производительность труда – эмгек ендурумдуулугу брак продукции – жараксыз чыгарылган Упражнение 303. Составьте из следующих пар простых предложений сложносочинённые предложения. Запишите их, правильно расставляя знаки препинания."},{"t":"p","h":"Образец: Лето припасает, а зима поедает."},{"t":"p","h":"1. Лето припасает. А зима поедает. 2. Открылась ярмарка. Началась продажа всевозможных товаров."},{"t":"p","h":"3. Выпал снег. Холодно не было. 4. Дежурный тщательно вытер доску. Учитель написал на доске новую тему. 5. Не раз приходили враги на нашу землю с мечом. Всегда они изгонялись с позором. 6. Слушатели собрались в зале. Лекция началась."},{"t":"v","l":["Словарь:","всевозможный – ар турдуу","тщательно – кылдаттык менен","изгонять – кууп чыгуу","позор – уят, маскара"]}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[193,195]},{"title":"§ 55. СЛОЖНОСОЧИНЁННЫЕ ПРЕДЛОЖЕНИЯ С СОЮЗАМИ ИЛИ, ТО... ТО.","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"196\">196<\/span>§ 55. СЛОЖНОСОЧИНЁННЫЕ ПРЕДЛОЖЕНИЯ С СОЮЗАМИ ИЛИ, ТО... ТО."},{"t":"p","h":"Повторить $ 8, 49."},{"t":"p","h":"Вепомните:"},{"t":"p","h":"При помощи каких слов соединяются простые предложения в составе сложносочинённых?"},{"t":"p","h":"2. Каково значение союза и? Как передать его по- кыргызски?"},{"t":"p","h":"3. Что обозначают союзы а, но, однако? Какие союзы соответствуют им в кыргызском языке?"},{"t":"p","h":"Союз или, соединяющий простые предложения в составе сложносочинённых, означает, что то, о чём говорится в одном предложении, делает невозможным то, о чём говорится в другом предложении. По- -кыргызски значение союза или передаётся союзом же. Союз или может ставиться между двумя простыми предложениями, входящими в сложносочинённые. Например: Летом вся наша семья будет отдыхать на Иссык- -Куле, или я один поеду в детский санаторий. Смысл этого сложного предложения состоит в том, что будет только то, о чём говорится в одном из предложений, а другое не произойдёт. Что именно произойдёт, нам пока ещё неизвестно."},{"t":"p","h":"Союз или может повторяться перед несколькими простыми предложениями. Например: Летом или весь наш класс отправится на экскурсию, или я поеду в детский санаторий, или вся наша семья будет отдыхать на Иссык-Куле."},{"t":"p","h":"Союз или, повторяющийся в этом сложносочинённом предложении, показывает, что в действительности произойдет лишь однд из трёх возможных событий. Наряду с союзом или или в близком значении может быть употреблен повторяющийся союз либо ... либо."},{"t":"p","h":"Союз то ... то всегда повторяется перед простыми предложениями, входящими в состав сложносочинённого предложения. Он означает, что по очереди происходят события, о которых говорится в простых предложениях, соединённых союзом то. Например: То лил дождь, то начинал идти снег, то неожиданно светило солнце. Это <span class=\"pg\" data-n=\"197\">197<\/span>предложение показывает, как менялась погода. По очереди происходят события, описанные в каждом из простых предложений. По-кыргызски этот союз можно передать выражением бирде ... бир туруп. Наприм ер: Жайлоодо бирде жамгыр куят, бирде кар жаайт, бир туруп, кун нурун чачат."},{"t":"v","l":["Вопросы для повторения:","1. Какое предложение называется сложносочинённым?"]},{"t":"p","h":"2. Что означает союз или, когда он соединяет простые предложения в сложные?"},{"t":"p","h":"3. Где ставится союз или, соединяющий простые предложения в сложные?"},{"t":"v","l":["4. Сравните следующие два предложения:","Или Киреше пошёл в","кино, или он отправился","на стадион.","То Киреше ходил вечером"]},{"t":"p","h":"в кино, то он отправлялся на стадион."},{"t":"p","h":"Чем отличаются значения этих двух предложений? Чем выражено это отличие?"},{"t":"v","l":["5. Сравните два предложения:","пошёл в кино, и","потом он отправился на","стадион.","Кирешеё пошёл в кино,","или он отправился на","стадион."]},{"t":"p","h":"Чем отличаются эти предложения? Сравните значение союзов и, или."},{"t":"p","h":"Упражнение 304. Прочитайте. Найдите сложносочинённые предложения. Перепишите их и подчеркните в них союзы. Что означают эти союзы?"},{"t":"p","h":"1. Или я к тебе приду, или ты ко мне придёшь. 2. То солнце тусклое блестит, то туча чёрная висит (Н. Некрасов). 3. Либо рыба плеснула в реке, либо взлетела стая уток (К. Паустовский). 4. Отец привозил из города то книгу для сына, то куклу для дочери (Г. Марков). 5. Или мы защитим Москву, или все умрём под Москвой! (А. Бек). 6. За рекою раздаются песни и мелькают едва заметные огоньки."},{"t":"p","h":"<span class=\"pg\" data-n=\"198\">198<\/span>7. То дует сильный ветер, то из ущелья выползает густой туман. 8. Под деревом белка лакомилась орехами, или другой зверь разбросал скорлупу."},{"t":"v","l":["Словарь:","тусклый – тунерунку","плеснуть – чалпылдоо","защитить – коргоо","заметный – мында: жылтылдап","жанган от"]},{"t":"p","h":"Упражнение 305. Перепишите, расставьте знаки препинания. Подчеркните союзы в сложносочинённых предложениях. Что означают эти союзы?"},{"t":"p","h":"1. Нам нужно спешить или мы опоздаем на самолёт."},{"t":"p","h":"2. Приближалась осень и в старом саду было тихо и грустно (А. Чехов). 3. То в глазах его мелькала грусть то всё лицо светилось от радости (П. Павленко). 4. Вода перестала прибывать но угроза наводнения не миновала (Н. Вирта)."},{"t":"p","h":"5. Бабушка приносила из леса корзину ягод либо мешочек с орехами (Г. Марков). 6. Или дождь стучит в окно или вбтер сердито воет (В. Саянов). Т. Тунгус хотел спрятать соболя за пазуху но купец опередил его (В. Шишков). 8. Над рекой поднимался туман или сизый дым лесного пожара (В. Шишков)."},{"t":"v","l":["Словарь:","угроза – коркунуч пазуха – коюн","соболь – кундуз"]},{"t":"p","h":"Упражнение 306. Перепишите, вставляя союзы или, или ... или, то... то. Расставьте знаки препинания. Объясните постановку союзов."},{"t":"p","h":"1. Комиссар не спал всю ночь ... покалывало сердце ... болвла старая рана (А. Гайдар). 2. На лесосплав пойдёт вторая бригада .. пошлём туда ремонтных рабочих"},{"t":"p","h":"Марков). 3. ... мы уничтожим волчью стаю .. волки опять порежут овец. и приближались радостные встречи"},{"t":"p","h":"наступали короткие прощания. 5. Загудел подземный обвал ... прогремел далёкий гром. 6. ... кукует кукушка в густой листве ... свистит иволга. 7. Краски потускнели от времени ... сырость повредила картину."},{"t":"p","h":"<span class=\"pg\" data-n=\"199\">199<\/span>покалывать – сайгылашуу лесосплав – карагай агызуучу жер порезать (здесь: загрызть) – талап елтуру\\ прощание- коштошуу листва – жалбырактар иволга – саргалдак потускнеть – ену ечуп Упражнение 307. Из следующих групп простых предложений составьте сложносочинённые предложения. Объясните выбор союзов."},{"t":"p","h":"Образец: В свободное время трактористы отдыхали, а некоторые ловили рыбу."},{"t":"p","h":"1. В свободное время трактористы отдыхали. Некоторые ловили рыбу. 2. Небо прояснилось. К зимовщикам прилетел вертолёт. 3. К зимовке часто подходили медведи. Прокрадывалась неуклюжая росомаха. 4. Абдыгул очень любил меня. Иногда его глаза смотрели сурово. 5. Мой прадед воевал с басмачами. Дед добровольцем ушёл на фронт в суровом сорок первом году. 6. Стояли тихие и ясные дни."},{"t":"raw","h":"<h4 class=\"mk\">Шёл дождь со снегом. Любопытство победило. зимовщик – кыштоочу<\/h4>"},{"t":"v","l":["Рая не хотела идти в зоопарк.","","Словарь:","зимовка – кыштоо","неуклюжий – эпсиз, олдоксон","росомаха – росомаха","(суусардын бир туру)","сурово – каардуулук менен","прадед – чон атанын атасы (баба)","– кулак туруучулук"]}],"sub":[],"section":"СЛОЖНОСОЧИНЁННОЕ ПРЕДЛОЖЕНИЕ.","pages":[196,199]},{"title":"§ 54. СЛОЖНОПОДЧИНЁЕННОЕ ПРЕДЛОЖЕНИЕ. СВЯЗЬ ПРИДАТОЧНОГО ПРЕДЛОЖЕНИЯ С ГЛАВНЫМ. СОЮЗЫ И СОЮЗНЫЕ СЛОВА.","blocks":[{"t":"h3","h":"§ 54. СЛОЖНОПОДЧИНЁЕННОЕ ПРЕДЛОЖЕНИЕ. СВЯЗЬ ПРИДАТОЧНОГО ПРЕДЛОЖЕНИЯ С ГЛАВНЫМ. СОЮЗЫ И СОЮЗНЫЕ СЛОВА."},{"t":"p","h":"(Багынынкы суйлемдун баш суйлем менен байланышы.)"},{"t":"p","h":"Повторить $ 9."},{"t":"p","h":"Вспомните:"},{"t":"p","h":"1. Какие сложные предложения называются сложноподчинёнными?"},{"t":"p","h":"2. Как называется независимое, поясняемое, предложение, входящее в состав сложноподчинённого предложения?"},{"t":"p","h":"<span class=\"pg\" data-n=\"200\">200<\/span>3. Как называется подчинённое, зависящее от другого, предложение?"},{"t":"p","h":"Главное и придаточное предложения тесно связаны между собой. Эта связь выражается прежде всего союзами и союзными словами. Союзы чтобы, потому что, если, когда и некоторые другие не являются членами предложения. Они служат для того, чтобы связать придаточное предложение с главным. Например: Ученики слушали внимательно, чтобы новый материал хорошо запомнить. Союз чтобы здесь указывает на связь между главным и придаточным предложениями. К союзу нельзя поставить вопросы. Он не является членом предложения."},{"t":"p","h":"Вместо союзов в сложноподчинённых предложениях часто используют некоторые местоимения и наречия. Они тоже связывают придаточное предложение с главным. Но к ним можно поставить вопросы. Они являются членами предложения. Эти и наречия, выполняющие роль союзов, называются союзными словами. Таким образом, союзные слова, во-первых, связывают между собой главное и придаточное предложения и, во-вторых, сами являются членами предложения. Например: Учительница похвалила ученицу, которая выразительно прочитала стихи Маяковского. Слово которая в этом предложении связывает придаточное предложение с главным. Кроме того, оно является членом придаточного предложения (подлежащим). Слово которая – союзное слово."},{"t":"p","h":"Придаточные предложения обычно отвечают на вопросы членов предложения. По смыслу они близки к членам предложения."},{"t":"v","l":["Сравните:","1. Хлопкоробы пошли","на хлопковое поле."]},{"t":"p","h":"2. Вечером ребята собрались в школе."},{"t":"p","h":"1. Хлопкоробы пошли туда, где растёт хлопок."},{"t":"p","h":"2. Когда стемнело, ребята собрались в школе."},{"t":"p","h":"Предложения в левом столбике – простые, ав правом – сложноподчинённые. В первом случае слева выделено обстоятельство места на хлопковое поле. Оно отвечает на <span class=\"pg\" data-n=\"201\">201<\/span>вопрос куда? (Куда пошли колхозники?). Этот же вопрос можно поставить в предложении справа. Но отвечает на него не член предложения, а целое придаточное предложение (где растёт хлопок). Во втором предложении (слева) отм6чено обстоятельство времени, которое отвечает на вопрос когда? (вечером). В сложноподчиненном предложении на этот вопрос отвечает придаточное предложение (когда стемнело)."},{"t":"p","h":"Придаточные предложения надо отличать от второстепенных членов предложения. Сравните: 1. Когда взошло солнце, путешественники подошли к старой крепости. 2: Утром путешественники подошли к старой крепости. Придаточное предложение когда взошло солнце и слово утром уточняют время действия. Но в придаточном предложении (пример 1) есть подлежащее солнце, сказуемое взошло, а во втором примере время уточняется не предложением, а всего одним словом —обстоятельством времени утром."},{"t":"p","h":"Вопросы для повторения:"},{"t":"p","h":"1. Как называется сложное предложение, в котором одно простое предложение подчинено другому?"},{"t":"v","l":["2. Какое предложение называется главным?","3. Какое предложение называется придаточным?"]},{"t":"p","h":"4. Как связываются простые предложения в составе сложного?"},{"

ь:","","обыскать – тинтуу","приняться – киришу\\, баштоо","разбегаться – кууленуп чуркоо","трепать – уйпалоо"]},{"t":"p","h":"Упражнение 104. Перепишите. Надпишите над глаголами неопределённой формы вид. Устно объясните, почему употреблён тот или другой вид глагола."},{"t":"p","h":"1. Друзья договорились встретиться у театра. 2: Сестра стала торопиться на рынок. 3. Дети в Индии начинают учиться с четырёх лет. 4. Приезжий захотел осмотреть центр города. 5. Анипа решила помыть посуду и почистить обувь."},{"t":"p","h":"6. Мы должны любить книгу и беречь её. 7. Подводная лодка начала всплывать на поверхность океана. 8. Сильный всегда готов помочь слабому."},{"t":"p","h":"Упражнение 105. Перепишите. Выберите из скобок глагол нужного вида."},{"t":"p","h":"Образец: За час Салмоорбек успел наловить много рыбы."},{"t":"p","h":"1. За час Салмоорбек успел ... (ловить, наловить) много рыбы. 2. Мальчик перестал .. (плакать, поплакать)."},{"t":"p","h":"3. Айша решила ... (учиться, научиться) рукоделию."},{"t":"p","h":"4. Восьмиклассники закончили ... (писать, написать) сочинбние. 5. Они захотели ... (играть, поиграть) в волейбол."},{"t":"p","h":"6. Мы стали ... (играть, поиграть) в волейбол. 7. Ребёнок научился .. (читать, прочитать) по слогам. 8. Хозяйка принялась ... (копать, вскопать) грядку."},{"t":"p","h":"Упражнение 106. Переведите на русский язык. Подчеркните простые и составные глагольные сказуемые."},{"t":"p","h":"1. Жапар суйлей баштады (К. Баялинов). 2. Баары унчукпай калышты (К. Баялинов). 3. Шаршен эки кекилик жана бир кыргоол атып алды (К. Жантешев). 4. Балдар то <span class=\"pg\" data-n=\"71\">71<\/span>орундарынан тура калышты (К. Баялинов). 5. Чыгыштан Чолпон чыга келди (К. Жантешев). 6. Скважинадан нефть атырыла баштады (Д. Чотуров). Т. Жамийла менин алдымда кетип бара жаткан (Ч. Айтматов)."},{"t":"p","h":"Упражнение 107. Составьте предложения из следующих слов и сочетаний слов."},{"t":"p","h":"1. Бойцы, успеть, приготовиться, к, атака. 2. Айгуль, обещать, выучить, стихотворение, к, следующий, урок."},{"t":"p","h":"3. Танабай, гнать, табун, через, высокий, перевал. 4. Шофёры и грузчики, после обеда, стать, собираться, в, дорога."},{"t":"p","h":"5. Маралы, осторожно, подойти, к, река. 6. После, третье блюдо, гости, приняться, пить, чай с вареньем. 7. Спортсмен, начать, тренироваться, ежедневно."}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[69,71]},{"title":"§ 23. ИМЕННОЕ СОСТАВНОЕ СКАЗУЕМОЕ.","blocks":[{"t":"h3","h":"§ 23. ИМЕННОЕ СОСТАВНОЕ СКАЗУЕМОЕ."},{"t":"p","h":"Вспомните:"},{"t":"p","h":"1. Какое сказуемое называется простым?"},{"t":"p","h":"2. Какое сказуемое называется составным глагольным? Сказуемое может быть выражено существительным. Наприм ер: Токтогул – акын. Мой друг – шахматист."},{"t":"p","h":"Если подлежащее и сказуемое выражены именем существительным в именительном падеже без связки, то на письме между ними, как и в кыргызском языке, ставится тире: Айтматов – писатель."},{"t":"p","h":"Сказуемое может быть выражено кратким именем прилагательным или причастием."},{"t":"v","l":["украинская ночь. Дерево срублено.","может","быть","Сказуемое","Например: Тиха","","именем","выражено"]},{"t":"p","h":"существительным, именем прилагательным или причастием со связкой. В качестве связки употребляются слова быть и стать в прошедшем и будущем времени (был, была, было, были, буду, будет и т.д.). Например: Мой дядя стал лётчиком. Трава будет скошена."},{"t":"p","h":"Имена существительные и полные прилагательные в составе сказуемого со связкой чаще употребляются в <span class=\"pg\" data-n=\"72\">72<\/span>творительном падеже, но иногда могут (особенно при связке есть) употребляться и в именительном падеже. Например: Моя сестра будет врачом. Квадрат есть равносторонний прямоугольник. На Кенеш был весёлым."},{"t":"p","h":"Примечание. Связка настоящего времени есть употребляется только в научной рёчи. В повседневной речи она обычно пропускается."},{"t":"p","h":"Сказуемое, выраженное существительным, прилагательным, местоимением, причастием в сочетании со связкой, называется именным составным сказуемым. Вопросы для повторения:"},{"t":"p","h":"1. Какое сказуемое называется именным составным сказуемым?"},{"t":"p","h":"2. Какой знак препинания ставится между подлежащим и сказуемым, выраженными именами существительными в именительном падеже?"},{"t":"p","h":"3. Какие слова употребляются в качестве связок при сказуемом, выраженном именем существительным, прилагательным, причастием?"},{"t":"p","h":"4. В каком падеже употребляется имя существительное в сказуемом со связкой?"},{"t":"p","h":"Упражнение 108. Перепишите. Подчеркните сказуемые. Укажите, какой частью речи они выражены."},{"t":"p","h":"1. Под окнами нашего класса расцвели красивые георгины. 2. Человек – кузнец своего счастья. 3. Река Волга широка и могуча. 4. Обмолот будет закончен в установленный срок. 5. Роща на краю города была лучшим местом отдыха. 6. Большими хлопьями падал мокрый снег (Ч. Айтматов). Т. Дверь в соседнюю комнату была открыта."},{"t":"p","h":"8. Сталевары выплавляют металл из руды. 9. Родители моего друга стали геологами. 10. Пушкин – великий русский поэт."},{"t":"p","h":"Словарь:"},{"t":"p","h":"обмолот эгин басуу руда – кен"},{"t":"p","h":"Упражнение 109. Перепишите, глаголы-сказуемые, взятые в скобки, поставьте в нужном лице, числе (настоящего или будущего времени)."},{"t":"p","h":"<span class=\"pg\" data-n=\"73\">73<\/span>1. Все кыргызские дети с любовью (изучать) русский язык. 2. Пустынные земли завтра (стать) плодорбодными нивами. 3. Птичий щебет с утра до вечера (доноситься) из рощи. 4. По команде солдат (выходить) из строя и (подходить) к командиру. 5. Сегодня холодно, но через день (пригреть) солнце и (расцвести) сирень. 6. Трудолюбивые фермеры (получать) большой доход. Т. Депутат сказал, что он (оправдать) доверие избирателей. 8. Честный человек никогда (не уронить) своего достоинства."},{"t":"v","l":["Словарь:","","нива – эгин талаасы"]},{"t":"p","h":"Упражнение 110. Перепишите. Подчеркните сказуемые. Где нужно, между подлежащим и сказуемым поставьте тире."},{"t":"p","h":"1. Мой старший брат работает механизатором. 2. Наша земля велика и прекрасна. 3. Иссык-Куль красивое высокогорное озеро. 4. В комнату вошёл Байтемир с кипящим самоваром в руках (Ч. Айтматов). 5. Отец моей подруги журналист. 6. Асель принялась стирать мою клетчатую рубашку (Ч. Айтматов). Т. Байтемир с сыном спали на одной кровати (Ч. Айтматов). 8. Дружба – источник силы людей труда. 9. Джамиля дочь табунщика из горного аила. 10. Мой брат Садык тоже работал табунщиком (Ч. Айтматов)."},{"t":"p","h":"Словарь:"},{"t":"p","h":"клетчатый – чакмактуу источник – булак"},{"t":"p","h":"Упражнение 111. Перепишите, вставляя вместо точек связку быть или стать. Согласуйте её с подлежащим."},{"t":"p","h":"1. Мы борцами за сохранвние природы. 2. Через пять лет молодой учитель ... опытным директором школы."},{"t":"p","h":"3. Наша школа ... образцовой школой в районе. 4. Кенешбек"},{"t":"p","h":"усидчивым и прилёжным учеником. 5. Рождение ребёнка ... большим праздником в семье. 6. Он ... сыном простого рабочего, и рассказ о нём ... очень коротким (С. Есенин)."},{"t":"p","h":"7. Не приученные к труду дети ... эгоистами. 8. Выпускницы <span class=\"pg\" data-n=\"74\">74<\/span>политехнического колледжа ... специалистами по вычислительной технике."},{"t":"p","h":"Словарь:"},{"t":"p","h":"усидчивый – тырышчаак рождение – терелуш"},{"t":"p","h":"Упражнение 112. Перепишите. Взятые в скобки сказуемые, выраженные краткими прилагательными и причастиями, поставьте в нужном числе и роде."},{"t":"h3","h":"МОЯ ЗЕМЛЯ."},{"t":"p","h":"Земля, на которой мы родились, (обширен и богат. Реки (быстр и полноводен). Леса (красив). Горы (высок). Вершины их (освещён) щедрым солнцем. Многочисленные города и сёла поднялись на моей земле. В них живут замечательные люди. Они (талантлив и трудолюбив, жизнерадостен и неутомим в труде). Песни, которые поют эти люди, (прекрасен)."},{"t":"p","h":"По М. Михайлову. Словарь:"},{"t":"p","h":"обширный – кен жизнерадостный – шайыр многочисленный – коп сандаган неутомимый – чарчабас"},{"t":"p","h":"Упражнение 113. Существительные и согласованные с ними слова, выражающие сказуемые и взятые в скобки, поставьте в нужном (творительном или именительном) падеже. Объясните, почему в одном случае требуется именительный, а в другом – творительный падеж. Поставьте, где нужно, тире."},{"t":"p","h":"1. Сергей Королёв был (талантливый конструктор космических кораблей). 2. После производственной практики я стану (комбайнер). 3. Мой товарищ Керим (комбайнер). 4. Сестра моей подруги (зоотехник). 5. В шестом классе Акмат был (отличник). 8. Через год птенцы станут (взрослые орлы)."},{"t":"v","l":["Словары:","производственный – ондуруштук"]},{"t":"p","h":"<span class=\"pg\" data-n=\"75\">75<\/span>Упражнение 114. Переведите на русский язык. Подчеркните сказуемые. Укажите, чем они выражены."},{"t":"p","h":"1. Мен учкуч болгум келет. 2. Сенин аган Абыл – агроном. 3. Июнь айында жайкы каникул башталат. 4. Сабира заводдо – инженер-экономист. 5. Мен бийик тоого тез чыгам. 6. Горький – сездун таланттуу художниги."}],"sub":[{"title":"МОЯ ЗЕМЛЯ.","b":35}],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[72,75]},{"title":"§ 24. СОГЛАСОВАНИЕ ГЛАГОЛА-СКАЗУЕМОГО С ПОДЛЕЖАЩИМ.","blocks":[{"t":"h3","h":"§ 24. СОГЛАСОВАНИЕ ГЛАГОЛА-СКАЗУЕМОГО С ПОДЛЕЖАЩИМ."},{"t":"v","l":["(Этиш баяндоочтун ээ менен ээрчиши.)","","Повторить $ 10-183.","Вспомните:","1. Какие члёны предложения составляют его ядро?","2. Чем выражается подлежащее?"]},{"t":"p","h":"3. Какая связь между словами называется согласованием? Сказуемое в русском языке согласуется с подлежащим. Если сказуемое выражено глаголом в настоящем или будущем времени изъявительного наклонения, оно согласуется с подлежащим в числе и лице: Я читаю книгу. Ты рисуешь дом. Студент решает задачу. Ученики выполняют домашние задания."},{"t":"p","h":"При подлежащем- существительном сказуемое употребляется в третьем лице. Если подлежащее – местоимение первого или второго лица, а сказуемое – глагол в настоящем или будущем времени, подлежащее может быть пропущено. Читаю книгу. Глагол в этом предложении стоит в первом лице единственного числа. Это показывает лицо и число подлежащего. Всегда пропускается подлежащее при сказуемом, выраженном глаголом повелительного наклонения (второе лицо единственного или множественного числа)."},{"t":"p","h":"Например: Решай задачу. Читайте книги! Если подлежащее выражено местоимениями кто, никто, кто-то, кое-кто, кто-нибудь и др., то сказуемое употребляется <span class=\"pg\" data-n=\"76\">76<\/span>обычно в третьем лице единственного числа, в прошедшем времени – в мужском роде. Например: Кто-то пришёл. Кто-нибудь запишет."},{"t":"p","h":"Если подлежащее выражено местоимениями что, ничто, что-то, что-нибудь и др., то сказуемое употребляется в третьем лице единственного числа, в прошедшем времени – в среднем роде. Например: Что-то упало. Что-нибудь висит на стене."},{"t":"p","h":"Если сказуемое выражено глаголом прошедшего времени или условного наклонения, оно согласуется с подлежащим в роде и числе. Согласование в роде происходит только в единственном числе. Например: Ученик читал книгу. Ученица читала бы книги. Яблоко упало с дерева. Дети играли в саду."},{"t":"p","h":"Глагол-связка в составном именном сказуемом согласуется с подлежащим, как и обычные глаголы-сказуемые."},{"t":"p","h":"Упражнение 115. Спишите. Подчеркните подлежащее одной чертой, а сказуемое – двумя чертами. Сверху надпишите, в чём согласовано сказуемое с подлежащим."},{"t":"p","h":"род, число Образец: На дворе стояла тёплая погода."},{"t":"p","h":"На дворе стояла тёплая погода. В родные места возвращались многочисленные стаи птиц. Солнце щедро светило с голубой высоты. Люди искренне радовались расцвету природы. Вот первый трактор выезжает в поле. За рулём сидит молодой тракторист Султан. За селом к трактористу подходит агроном Бейшегуль. Она подробно объясняет ему дневное задание. Тракторист приступил к работе, а Бейшегуль уехала на другое поле."},{"t":"p","h":"По М. Джангазиеву."},{"t":"p","h":"искренне – чын журектен подробно – майда-чуйдесуне чейин"},{"t":"p","h":"Упражнение 116. Спишите, раскрывая скобки. Глаголы ставьте в нужном числе и роде прошедшего времени."},{"t":"h3","h":"<span class=\"pg\" data-n=\"77\">77<\/span>АВТОЛАВКА."},{"t":"p","h":"В отдалённую бригаду (приехать) автолавка. Молодой продавец Рыскул (разложить) на прилавке товары. Отовсюду к автолавке (спешить) люди. Первой (прибежать) маленькая Чинара. Она (попросить) плюшевого медвежонка и конфет. Потом (подойти) тётя Батма. Рыскул (предложить) ей платок и шерстяную кофту. Но Батма (купить) три метра материала на платье."},{"t":"p","h":"К вечеру весь товар был распродан. Рыскул (подлить) воды в радиатор, (осмотреть) заднее колесо. Автолавка (уехать) в долину за новым товаром."},{"t":"p","h":"По А. Осмонбекову."},{"t":"p","h":"Словарь:"},{"t":"p","h":"плюшевый – тукаба"},{"t":"p","h":"Упражнение 117. Спишите, дописывая суффиксы и окончания глаголов-сказуемых."},{"t":"p","h":"1. Дикие животные хорошо размножа... в заповеднике. 2 Кукушка на сосне печально кукова.... 3. Школьники организованно пош... на субботник. 4. продиктова... трудное предложение. 5. Чтобы полакомиться рыбкой, лиса притворил... мёртвой. 6. Кто-то откры... калитку и тихо подош... к беседке. 7. За рекой поднимал... зарево. Что-то горел... на барской земле (В. Фёдоров). 8. На горных пастбищах стоял... лютые морозы. 9. Снег хлопьями пада... на землю."},{"t":"v","l":["Словарь:","","размножаться – кебейу\\","заповедник – корук","продиктовать – окуп беруу","лакомиться – жыргап тамактануу","","Упражнение 118. Спишите."]},{"t":"p","h":"притвориться – амалдануу зарево – кызыл чтобы – учун"},{"t":"p","h":"точек вставьте подходящие по смыслу сказуемые. Согласуйте их с подлежащими."},{"t":"p","h":"1. За успешную учёбу и общественную работу директор Бакыта грамотой. 2. Вдоль железнодорожной насыпи, = (1 <span class=\"pg\" data-n=\"78\">78<\/span>как часовые, ... телеграфные столбы. 3. Все честные люди"},{"t":"p","h":"за прочный мир на земле. 4. Империалисты ... всему миру атомной бомбой. 5. Но человечество не ... её начала."},{"t":"p","h":"6. Наши матери и отцы ... против войны. Т. ... тучка золотая на груди утёса-великана (М. Лермонтов). 8. Участники концерта ... на сцену. 9. У немецких школьников высшей оценкой ... единица."},{"t":"p","h":"Слова для справок: считаться, наградить, стоять, грозить, бороться, допустить, ночевать, выступать, выходить."},{"t":"v","l":["Словарь:","успешный ийгиликтуу","прочный – бекем","человечество – адамзат","против – каршы"]},{"t":"p","h":"Упражнение 119. Спишите, дописывая окончания связок. Укажите, в чём согласуется связка с подлежащим."},{"t":"p","h":"1. Автомобили «Жигули» буд... участвовать в автопробеге. 2. Зима был... малоснежная, но морозная. 3. Мы ста... достойными гражданами своей страны. 4. Ты буд... редактором стенной газеты. 5. Через год молодой штангист ста... мировым рекордсменом. 6. Когда-то мы с Юсупом бы... друзьями. 7. Выпускники технического училища ста... мастерами своего дела."},{"t":"v","l":["Словарь:","достойный – татыктуу"]},{"t":"p","h":"При подлежащем, выраженном сочетанием имени существительного или местоимения в именительном падеже с именем существительным или местоимением в творительном падеже, сказуемое обычно употребляется после подлежащего и стоит во множественном числе. Это и показывает, что в подлежащее входят оба существительных. Например: Танабай с женой заботливо ухаживали за жеребёнком (Ч. Айтматов). Тренер с учеником вышли из спортивного зала."},{"t":"p","h":"Примечание: Если в именительном падеже употреблено местоимение первого или второго лица единственного числа, то <span class=\"pg\" data-n=\"79\">79<\/span>стоящее с ним слово в творительном падеже не входит в состав подлежащего и является дополнением, а сказуемое стоит в единственном числе. Например: Яс товарищем поеду на рыбалку."},{"t":"p","h":"Упражнение 120. Спишите. Глаголы, взятые в скобки, поставьте в нужной форме."},{"t":"p","h":"1. Дед с внуком никогда не (расставаться) надолго."},{"t":"p","h":"2. Радист с помощником (сидеть) на ящике из-под снарядов (К. Симонов). 3. Вслед за танками через Волгу (переправиться) пехотинцы с санитарами. 4. В трудную минуту командир с комиссаром (ободрить) бойцов. 5. Я с Володей (остаться) здесь, а ты с Гришей (пойти) дальше. 6. Учитель с учениками (задуматься) над необычным заданием. 7. Отец с сыном (работать) на одном комбайне."},{"t":"v","l":["Словарь;","","вслед – артынан, удаа эле","ободрить – кенулун кетеруу","необычный адаттагыдай","эмес, башкача"]},{"t":"p","h":"Когда подлежащее выражено сочетанием имени числительного или слов много, несколько и др. с именем существительным, то сказуемое употребляется или во множественном, или в единственном числе (в третьем лице), а в прошедшем врёмени и в условном наклонении – в среднем роде."},{"t":"p","h":"Сказуемое в единственном числе употребляется часто при подлежащем, в которое входят слова много, мало, сколько, а также если оно предшествует подлежащему, в которое входят числительные пять и выше. Например: Много книг лежало на столе. Училось в классе тридцать человек."},{"t":"p","h":"Сказуемое в единственном числе употребляется обычно при подлежащем, выраженном именем числительным без существительного. Например: Пятнадцать делится на три без остатка."},{"t":"p","h":"Сказуемое во множественном числе часто употребляется при подлежащем, в которое входят слова два, три, <span class=\"pg\" data-n=\"80\">80<\/span>четыре, особенно, если сказуемое следует за подлежащим. Например: Два приятеля написали письмо."},{"t":"p","h":"Если подлежащее выражено сочетанием имени числительного с именем существительным, сказуемое допускается употреблять как в единственном, так и во множественном числе."},{"t":"p","h":"Упражнение 121. Перепишите. Глаголы-сказуемые, заключённые в скобки, поставьте в нужной форме."},{"t":"p","h":"1. До конца месяца (остаться) пять дней. 2. Много одуванчиков (желтеть) на лужайке. 3. Три плотника (отличиться) на строительстве моста через Нарын. 4. Две ученицы внимательно (просматривать) новый номер журнала. 5. Несколько пней (торчать) на дне оврага. 6. Четыре автобуса (отправиться) в рейс. Т. Сколько людей (жить) в вашем доме? 8. Двенадцать (делиться) на шесть."},{"t":"v","l":["Вопросы для повторения:","1. Как связаны между собой подлежащее и сказуемое?"]},{"t":"p","h":"2. Какие сказуемые-глаголы согласуются с подлежащими в роде?"},{"t":"p","h":"3. В каком роде употребляется сказуемое прошедшего времени при подлежащем, выраженном словами кто-то, кто-нибудь? А в каком роде оно употребляется при подлежащем что, что-то, что-нибудь, кое-что?"},{"t":"p","h":"4. В каком числе употребляется сказуемое при подлежащем, выраженном сочетанием имени существительного или местоимения в именительном падеже с именем существительным или местоимением в творительном падеже?"},{"t":"p","h":"Упражнение 122. Перепишите. Глаголы-сказуемые или связки, взятые в скобки, поставьте в нужной форме."},{"t":"h3","h":"НА СТАРОМ ПАРОХОДЕ."},{"t":"p","h":"Сорок лет назад пароходы (плавать) медленно. Путешествие (продолжаться) долго. Я с бабушкой (быть) на палубе. За бортом (плескаться) волжская волна. Слева (проплывать) зелёные холмы, равнины, луга. Справа на крутом берегу (стоять) города и сёла."},{"t":"p","h":"Недалеко от берега (мелькать) лодки. Кто-то в них (петь). Кто-то (махать) нам рукой. Однажды на берегу <span class=\"pg\" data-n=\"81\">81<\/span>(собраться) толпа. Время (быть) рабочее. Очевидно, что-то (заставить) людей бросить дела и поспешить к реке. По М. Горькому. Словарь:"},{"t":"p","h":"путешествие саякат очевидно – балким, мумкун"},{"t":"p","h":"Упражнение 123. Из данных слов составьте предложения. Подчеркните сказуемые. Скажите, чем они выражены и в чём согласуются с подлежащими."},{"t":"p","h":"1. Храбрый, Манас, победить, все, свои, враги. 2. Тарас, с, Остап, воевать, за, свобода, родной, земля. 3. После, первый, заморозки, опустёеть, роща, и, леса. 4. Брат, с, сестра, возиться, в, песочная, яма. 5. Кто, перебежать, дорога? 6. Что, преградить, путь? 7. Кое-кто из альпинистов, не одолеть, подъём, на, вершина. 8. Три, охотник, ночевать, на, опушка, лес."},{"t":"p","h":"Словарь:"},{"t":"p","h":"воевать – согушуу одолеть (победить) – женуу возиться (здесь: играть) – ойноо"}],"sub":[{"title":"АВТОЛАВКА.","b":14},{"title":"НА СТАРОМ ПАРОХОДЕ.","b":51}],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[76,81]},{"title":"§ 25. СОГЛАСОВАННОЕ ОПРЕДЕЛЕНИЕ.","blocks":[{"t":"h3","h":"§ 25. СОГЛАСОВАННОЕ ОПРЕДЕЛЕНИЕ."},{"t":"v","l":["Повторить род имён существительных, $5 13.","","Вспомните:","1. Какой член предложения называется определением?"]},{"t":"p","h":"2. В чём согласуется имя прилагательное с именем существительным?"},{"t":"p","h":"Определения, выраженные именами прилагательными, причастиями, порядковыми числительными и некоторыми видами местоимений (притяжательными, словами какой, такой и др.), являются часто согласованными определе- НИЯМи."},{"t":"p","h":"Согласованные определения согласуются с определяемыми существительными в роде, числе и падеже. Например: хороший ученик, вышедшая из класса девочка, <span class=\"pg\" data-n=\"82\">82<\/span>трётье окно, наши карандаши, мой отец, моего отца, моему отцу и др."},{"t":"p","h":"Согласованные определения обычно ставятся перед определяемым словом."},{"t":"v","l":["Вопросы для повторения:","1. Какие определения называются согласованными?"]},{"t":"p","h":"2. В чём согласуются определения с именами существительными?"},{"t":"p","h":"3. Какими частями речи могут быть выражены согласованные определения?"},{"t":"p","h":"4. Где ставятся согласованные определения?"},{"t":"p","h":"Упражнение 124. Согласуйте определение с каждым из поставленных в скобках словом."},{"t":"p","h":"Образец: День весенний, пора весенняя, утро весеннее, дни весенние."},{"t":"p","h":"1. Весенний (день, пора, утро, дни). 2. Производственный (план, задание, программа). 3. Дружеский (привет, помощь, рукопожатие). 4. Мелкий (дождь, монета, зерно, деньги)."},{"t":"p","h":"5. Срочный (задание, телеграмма, приезд, дела). 6. Крепкий (здоровье, ткань, узел, парни). Т. Первый (зарплата, звонок, блюдо, успехи)."},{"t":"p","h":"Упражнение 125. Допишите окончания, определяя род, число, падеж согласованных определений по выделенным определяемым словам."},{"t":"p","h":"1. Над домом поднималась четырёхметров... телевизионн... антенна. 2. Корреспондент печатал сроч... материал на пишущ... машинке. 3. Чабаны наш... района кажд... год отгоняют скот на далёк... пастбища Кенес-Анархая. 4. Справа от окна стояла нов... никелированн... кровать. 5. Солнечн... лучи с трудом проникали сквозь густ... тополей."},{"t":"p","h":"6. Над сед... равниной моря ветер тучи собирает (М. Горький). 7. По справедлив... приговору суда преступник был строго наказан. 8. Егорушка снял красн... рубаху и первым нырнул в прохладн... пруд (А. Чехов). десят... километром начинаются земли друг... аила."},{"t":"p","h":"Словарь:"},{"t":"p","h":"справедливый – адилет приговор – екум"},{"t":"p","h":"<span class=\"pg\" data-n=\"83\">83<\/span>Упражнение 126. Перепишите. Подчеркните определения. Сверху надпишите, в чём они согласованы с определяемым словом. Скажите, какой частью речи они выражены."},{"t":"p","h":"1. В мягком воздухе разлит осенний запах. 2. Тонкий туман стойт над жёлтыми полями. 3. Кое-где на липах висят последние золотые листья (И. Тургенев). 4. Перед всадником простиралась бесконечная степь. 5. Долгими сутками шёл непрерывный мёлкий дождь. 6. За первым поворотом дороги вы увидите сельскую аптеку. 7. Помоги товарищу тёплым приветом и дельным советом. 8. Наше будущее принадлежит нам. 9. Лишь тот достоин чести и свободы, кто каждый день за них вступает в бой! 10. Коршун набросился на беззащитного цыплёнка."},{"t":"v","l":["Словарь:","бесконечный – чексиз, учу-кыйыры жок","беззащитный – алсыз, коргоосуз"]},{"t":"p","h":"Упражнение 127. Спишите, Подчеркните определения."},{"t":"h3","h":"КАРТИНА О ЧАБАНАХ."},{"t":"p","h":"Гапар Айтиев правдиво изображает на своих картинах жизнь кыргызского народа. Большую известность получила его картина «Чабаны». Июньское солнце поднимается над горными хребтами. На склоне горы пасутся овцы. К чабанам приехал главный зоотехник. Он привёз свежие газеты и журналы. Чабаны с интересом прочитали передовую статью. Они горячо обсуждают события мира. На белой лошади подъехал молодой чабан. Он внимательно прислушивается к разговору старших товарищей. В центре картины изображён старый чабан. На его груди гордо сверкает орден. Он получил высокую награду за свой доблестный труд."},{"t":"p","h":"Словарь:"},{"t":"p","h":"правдиво – чын, туура обсуждать – талкуулоо известность – атак, данк"},{"t":"p","h":"Упражнение 128. Перепишите, дописывая вместо точек ещё по одному согласованному определению. Эти определения даны в концб упражнения."},{"t":"p","h":"<span class=\"pg\" data-n=\"84\">84<\/span>1. За Волгой нас встретили холодные дожди. 2. Дети осторожно переходили через шумную ... Улицу. 3. Патриоты всегда сохраняют в сердцах горячую ... любовь к Родине."},{"t":"p","h":"4. В клубе стояли длинные и ... скамейки. 5. Букет был составлен из голубых и цветов. 6. Космонавты укрепляют своё долгими и ... тренировками. Т. Я выразил искреннюю, ... благодарность за оказанное мне доверие. 8. Самарканд славится древними .. памятниками прошлых веков. 9. Айнагуль писала диктант ровным, ... почерком."},{"t":"p","h":"Слова для справок: красивый, сердечный, замечательный, освнний, широкий, короткий, верный, белый, упорный."},{"t":"p","h":"Упражнение 129. Прочитайте, согласуя определения, взятые в скобки, с определяемым словом в роде, числв и падеже. Перескажите текст."},{"t":"h3","h":"СПАСЁННАЯ БЕРЁЗКА."},{"t":"p","h":"От дома лесника, где живёт Димка с отцом и матерью, до (ближайший) деревни надо идти четыре километра. Димка туда в школу ходит. Можно ехать на автобусе, но он любит ходить, 6сли, конечно, (хороший) погода. Около дороги в одном месте стоит (белый) берёзка. (Золотой) листья с неё прямо Димке под ноги летят. Идёт Димка из школы, смотрит – на дороге застрял грузовик, не может выехать из (глубокий) ямы. Усталый шофёр вылез из кабины, взял топор и пошёл к берёзке. Димка всё понял и, подбежав к шофёру, стал просить его не рубить (красивый) берёзку. Шофёр сердито что у него нет времени торчать здесь, и взмахнул топорбм. Тогда Димка ухватил шофёра за руку и стал умолять не рубить деревце, потому что недалеко есть куча (большой) камней."},{"t":"p","h":"Димка побежал за поворот дороги, принёс несколько камней и бросил под колесо. Шофёр тоже пошёл за камнями. Вме6сте они быстро забросали яму камнями, и грузовик, мощно гремя мотором, выехал из (глубокий) ямы."},{"t":"p","h":"<span class=\"pg\" data-n=\"85\">85<\/span>Шофёр улыбнулся и махнул Димке рукой. А Димка, потный и грязный, стоял около (спасённый) им берёзки, которая вбсело шелествла ветвями над его головой."},{"t":"p","h":"По Ф. Халтурину. Упражнение 130. Спишите, дописывая окончания согласованных определений."},{"t":"h3","h":"ПЕТЛЮРОВЕЦ ВЕДЁТ ЖУХРАЯ."},{"t":"p","h":"Павка выбежал из переулка и вздрогнул. Впереди шёл коренаст... рабочий с широк... грудью в расстёгнутом пиджаке, в чёрн... надвинут... на лоб кепке, с тёмно-син... кровоподтёком у глаза."},{"t":"p","h":"Он шагал твёрдо, слегка выгнут... ногами, обут... в жёлт... коротк... сапоги. Позади рабочего шёл петлюровец в жупане с двумя патронташами на поясе. Из-под мохнат... шапки смотрели в спину арестованного узеньк... насторожен... глаза."},{"t":"p","h":"Павка принял неожидан... решение."},{"t":"p","h":"По Н. Островскому. Словарь: коренастый – бакжагай"},{"t":"v","l":["расстёгнутый – топчуланбаган","кровоподтёк – канталап калган","твёрдо мында: ныктай","жупан – бешмант","патронташ – патронташ","(ок салгыч)","мохнатый – саксагай"]},{"t":"p","h":"Упражнение 131. Подберите и вместо точек впишите существительные, к которым относятся согласованные определения."},{"t":"p","h":"Образец: Мой отец уехал в служебную командировку."},{"t":"p","h":"1. Мой отвц убхал в служебную .... 2. Хмурые ... низко плыли над перевалом Долон. 3. В трудной ... надо найти правильное .... 4. В клетке жил говорящий .... 5. Пчела даёт вкусный и сладкий .... 6. Виски молодого инженера покрыла ранняя 7. С каждым ... расцветает наша земля."},{"t":"p","h":"8. Приближающаяся ... заставила бойцов сойти с середины дороги. 9. В книге недоставало нескольких .... 10. По некоторым ... чувствовалось приближение грозы."},{"t":"p","h":"<span class=\"pg\" data-n=\"86\">86<\/span>Слова для справок: признак, командировка, туча, обстановка, решение, мёд, попугай, день, седина, автоколонна, страница."},{"t":"v","l":["Словарь:","хмурый – буркее","признак – белги","обстановка – абал","решение – чечим"]},{"t":"p","h":"Упражнение 132. Перепишите, вставляя вместо точек подходящие по смыслу определения, выраженные местоимением, прилагательным, причастием или числительным."},{"t":"p","h":"1. Твой книги я могу положить в ... портфель. 2. Мама поставила цветы в ... вазу. 3. В старом окопе мы нашли ... пулей каску. 4. По крыше застучали ... капли. 5. Младшая сестра Учится в .. классе. 6. Наша учительница русского языка живёт на .. улице. 7. В ..доме мы организовали общественную библиотеку. 8. Спортсмен взял двухметровую высоту с ... попытки."},{"t":"p","h":"Упражнение 133. Переведите следующие сочетания слов на русский язык. Не забудьте согласовать определения с определяемым словом."},{"t":"p","h":"1. Жаны уй, жаны театр, жаны ээр, жаны китеп, жаны китептер 2. Катуу жыгач, катуу бор. 3. Кучтуу жигит, кучтуу машина, кучтуу кишилер. 4. Жашыл жибек бак, жашыл талаа, жашыл талаалар. 5. Жоон аркан, жоон карандаш, жоон терек, жоон жип. 6. Узун жол, узун дарак, узун дарыялар."},{"t":"p","h":"Упражнение 134. Вместо выделенных существительных мужского рода поставьте существительные женского рода и наоборот. Соответственно измените форму определений."},{"t":"p","h":"Образец: Чабан прискакал на резвой лошади."},{"t":"p","h":"1. Чабан прискакал на резвом коне (лошади). 2. На окраине города вырос новый завод (фабрика). 3. Мне купили тёплую рубашку (костюм). 4. Сообразительный паренёк (девушка) быстро овладел специальностью токаря."},{"t":"p","h":"5. Хмурая погода (день) испортила настроение юным путешественникам. 6. Великий мореплаватель с детства <span class=\"pg\" data-n=\"87\">87<\/span>мечтал о далёком острове (земля). Т. Гостеприимная хозяйка (хозяин) угостила нас свежим кумысом и жареной бараниной. 8. Под ёлкой сидела рыженькая белка (зверёк)."},{"t":"p","h":"Словарь:"},{"t":"p","h":"испортить – бузуу настроение – кенул"},{"t":"p","h":"Упражнение 135. Просклоняйте следующие пары и проследите, как согласуется определение с определяемым словом."},{"t":"p","h":"Коричневый карандаш, голубая ручка, красное знамя, кумачовые стяги. 2. Идущий человек, идущая пара, плывущее облако, плывущие корабли. 3. Мой велосипед, моя подушка, моё полотенце, мои ботинки. 4. Первый выигрыш, первая ступень, первое достижение, первые проигрыши."},{"t":"v","l":["Словарь:","пара (два человека, два предмета) —","экее","выигрыш – утуш","ступень – тепкич","прбигрыш уттуруш,","женилу\\"]}],"sub":[{"title":"КАРТИНА О ЧАБАНАХ.","b":23},{"title":"СПАСЁННАЯ БЕРЁЗКА.","b":32},{"title":"ПЕТЛЮРОВЕЦ ВЕДЁТ ЖУХРАЯ.","b":37}],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[82,87]},{"title":"§ 26. НЕСОГЛАСОВАННОЕ ОПРЕДЕЛЕНИЕ.","blocks":[{"t":"h3","h":"§ 26. НЕСОГЛАСОВАННОЕ ОПРЕДЕЛЕНИЕ."},{"t":"v","l":["Повторить $5 18.","Вспомните:","","1. Что такое определение?","2. В чём заключается связь управления?"]},{"t":"p","h":"В русском языке определение может быть выражено не только прилагательным, причастием, порядковым числительным, но также именем существительным."},{"t":"p","h":"Имя существительное часто является несогласованным определением. Оно не согласуется с определяемым словом. Определяемое слово управляет определением-существительным."},{"t":"p","h":"Определение-существительное нередко стоит в родительном падеже без предлога. Например: Изба <span class=\"pg\" data-n=\"88\">88<\/span>лесника стояла на опушке леса. Я взял книгу брата с полки. Такие несогласованные определения указывают на принадлежность определяемого предмета. Иногда несогласованное определение обозначает какое-то отношение определяемого предмета к предмету, обозначенному определением. Например: Директор школы – трудная и ответственная должность. Слово школы указывает здесь на отношение определяемого существительного директор к учебному заведению – школа. В примере Его разбудило чириканье воробьёв слово воробьёв указывает, кто производит действие, в данном случае – чириканье. Определениясуществительные стоят в русском языке, в отличие от кыргызского, после определяемого слова."},{"t":"p","h":"Несогласованное определение может быть выражено также личным местоимением третьего лица в родительном падеже без предлога. Оно указывает на то, кому принадлежит определяемый предмет. Напри мер: Пришёл его товарищ. Меня встретила её подруга. Для нас интересна их работа. Эти определения стоят обычно перед определяемым словом."},{"t":"p","h":"Встречаются несогласованные определения, выраженные именем существительным в родительном падеже с предлогом из. Часто такие определения обозначают материал, из которого изготовлен определяемый предмет. На – пример: Вокруг школы построен забор из кирпича."},{"t":"p","h":"Несогласованные определения, выраженные существительными в родительном падеже с предлогом для, обозначают назначение определяемого предмета, то есть указывают, для чего он сделан. Например: В районном центре построили новое здание для библиотеки."},{"t":"p","h":"Несогласованное определение может быть выражено также именем существительным в творительном падеже с предлогом е. Такое определение указывает на то, что у определяемого предмета есть какая-то черта, какое-то свойство, какой-то предмет. Например: Женщина с косами шла по улице. Мне купили пальто с поясом."},{"t":"p","h":"Несогласованное определение может иметь, в свою очередь, согласованное определение. Например: У моего товарища есть портфель с красивым замком."},{"t":"p","h":"<span class=\"pg\" data-n=\"89\">89<\/span>При изменении определяемого слова несогласованное определение не изменяется. Например: Здание телецентра, вышел из здания телецентра, подошёл к зданию"},{"t":"p","h":"вижу здание телецентра и т.п."},{"t":"p","h":"Задание. Превратите согласованные определения в несогласованные, а несогласованные – в согласованные."},{"t":"p","h":"Платье из ситца, рогатый жук, футбольный судья, щебет птиц, мусорное ведро, дом в пять этажей, депутатский значок, скафандр для водолаза, железобетонная плотина, путешествие вокруг света, баскетбольный турнир, машина для стирки, заречная улица, двухнедельный отпуск, специалист высокой квалификации, годовой план, малиновое варенье, без страха, чемодан из кожи, рекордсмен мира, чистосердечное признание, многокилометровый пробег, переплёт книги, соловьиное пение, центр города, школьная библиотёка, стая журавлей, часовая стрелка, вбтка яблони, фасолевый суп, послеобеденный отдых, прогрёмма цирка, площадка для волейбола, длинноволосая девушка."},{"t":"p","h":"Упражнение 136. Перепишите. Подчеркните несогласованные определения. Определите, чем они выражены."},{"t":"p","h":"1. Сердце командира болело за каждого человека (К. Симонов). 2. Павел нежно обнял шею коня и ласково гладил его вздрагивающие ноздри (Н. Островский). 8. Журчание воды, пвние птиц и шелест листвы успокоили меня, ия уснул (К. Паустовский). 4. Каждое утро я обливаюсь колодезной водой и слушаю рожок пастуха (К. Паустовский)."},{"t":"p","h":"5. В ушах хозяйки заблестёли серьги из золота (М. Шолохов). 6. Женщина с веснушками продавала горшки для молока и корзины для овощей (Г. Марков). 7. К нам приехала новая воспитательница. Её имущество состояло из одного чемодана и сумки (А. Макаренко)."},{"t":"v","l":["Словарь:","вздрагивающий (от вздрагивать) —","дирилдее","веснушки – сепкил","рожок пастуха – уйчунун","чоору"]},{"t":"p","h":"<span class=\"pg\" data-n=\"90\">90<\/span>Упражнение 137. Перепишите. Вместо точек вставьте из слов для справок несогласованные определения в форме родительного падежа без предлогов."},{"t":"p","h":"1. На нивах шум ... умолк. 2. Одна в глуши ... сосновых давно, давно ты ждёшь меня. 3. Час ... приближался. 4. Что-то слышится родное в долгих песнях .... 5. Вот приходит старик к дому. На пороге сидит ... старуха."},{"t":"p","h":"А. Пушкин"},{"t":"p","h":"Слова для справок: работа, леса, обед, ямщик, он."},{"t":"p","h":"Словарь:"},{"t":"p","h":"глушь – тунт"},{"t":"p","h":"Упражнение 138. Перепишите. Подчеркните несогласованные определения. Укажите, каким падежом они выражены."},{"t":"p","h":"1. Последние лучи солнца освещали бесконечную равнину (Г. Марков). 2. Между горевшими домами бежал испуганный конь с седлом (М. Шолохов). 3. В вестибюле музея стояло чучело медведя (К. Федин). 4. Медсестра накрутила на голове раненого бойца тюрбан из марли (В. Панова)."},{"t":"p","h":"5. Девочка с косичкой робко поднималась по мраморным ступенькам лестницы (В. Панова). 6. Молодая женщина внесла в юрту столик для гостей (К. Паустовский). Т. Лесника не было дома. Но вот весёлый лай собаки известил его приход (В. Короленко)."},{"t":"p","h":"Словарь:"},{"t":"p","h":"чучело медведя – аюунун кеби робко коркуп, абайлап"},{"t":"p","h":"Упражнение 139. Перепишите. Замените выделенные несогласованные определения согласованными."},{"t":"p","h":"Образец: У водопроводной колонки стояло жестяное ведро."},{"t":"p","h":"1. У водопроводной колонки стояло ведро из жести."},{"t":"p","h":"2. В глубине леса охотники обнаружили берлогу медведя."},{"t":"p","h":"<span class=\"pg\" data-n=\"91\">91<\/span>3. На у чабана была шапка из мёха. 4. Из кустов вылетела птица с длинным хвостом. 5. В комнате бабушки стояла высокая ваза из стекла. 6. На сеансе для детей шла новая кинокомедия. 7. Девушка надела платье из шёлка."},{"t":"p","h":"8. Айдар почистил ботинки кремом для обуви. 9. Ребятишки слепили во дворе бабу из снега."},{"t":"v","l":["Словарь:","","жесть – калай"]},{"t":"p","h":"Упражнение 140. Перепишите. Несогласованные определения, взятые в скобки, поставьте в нужном падеже."},{"t":"p","h":"1. Из рощи доносился щебет (птица). 2. За кустом (шиповник) Макар ясно увидел острые уши (лисица) (В. Короленко). 3. Чтобы поймать Гульсары, за ним погнался табунщик с (укрук) (Ч. Айтматов). 4. Компот из (персик) не мог утолить нашего голода (К. П аустовский)."},{"t":"p","h":"5. Мой старенький чемодан давно ожидал меня в каюте (теплоход). 6. За изгородью из (хмель) отдыхала группа разведчиков (Э. Казакевич). 7. Мохнатая шуба из (овчина) укрыла детей от лютого холода (В. Конецкий)."},{"t":"v","l":["Словарь:","","шиповник -— ит мурун","утолять – суусунду басуу","хмель – чырмоок чеп","овчина – койдун териси"]},{"t":"p","h":"Упражнение 141. Перепишите, заменяя выделенные согласованные определения несогласованными."},{"t":"p","h":"Суп с рисом дети съели с большим аппетитом."},{"t":"p","h":"1. Рисовый суп дети съёли с большим аппетитом. 2. Недавно в Нарыне открылся специальный детский парк."},{"t":"p","h":"3. Чтобы мы не замёрзли, мать укрыла нас шерстяным одеялом. 4. Участники художественной самодеятельности разучили индийский танец. 5. Наш колхоз построил уютное школьное здание. 6. Малиновое варенье хорошо помогает от простуды. 7. Около моего письменного стола стоит <span class=\"pg\" data-n=\"92\">92<\/span>книжный шкаф. 8. Ошские школьники с интересом осмотрели музей М.В. Фрунзе."},{"t":"p","h":"Упражнение 142. Перепишите. Допишите вместо точек подходящие по смыслу несогласованные определения. Они даны в конце упражнения."},{"t":"p","h":"1. В нижнем течении ручья мальчики сделали запруду из ....2. С поля на ферму приехала бричка с .... 3. Жёлтые листья ... лежат на аллеях парка. 4. Однажды катались мы на лодке с ....5. Печальные крики ... слышны над голыми полями. 6. Сестра подарила мне альбом для ... .Т. Тетради лежали в папке из ...."},{"t":"p","h":"Слова для справок: картон, камень, тополь, сено, журавль, марка, парус."},{"t":"v","l":["Словарь:","запруда – убактылуу богот журавль – турна"]},{"t":"p","h":"Упражнение 143. Перепишите. Слова, взятые в скобки, вставьте в нужном падеже."},{"t":"p","h":"1. На трамвае я доехал до окраины (город) (А. Гайдар)."},{"t":"p","h":"2. Басмачи не дождались прибытия большого каравана с (оружие) (А. Токомбаев). 3. Из шалаша можно услышать жужжание (шмель) и плеск (вода) у старой мельницы (К. Паустовский). 4. У ворот нашего дома стоял конь (бригадир) (Ч. Айтматов). 5. Парень с (гармонь) стоял на подножке (вагон) (А. Гайдар). 6. Вечером вся наша семья собирается у экрана (телевизор). Т. Джамиля бросила на землю мешок для (зерно) (Ч. Айтматов). 8. Старый Бектур носил халат из (вата)."},{"t":"p","h":"Упражнение 144. Перепишите. К выделенным словам подберите из слов для справок подходящие по смыслу определения."},{"t":"p","h":"1. Мальчик с ... сидел на берегу пруда. 2. Собираясь в театр, мама надела бусы из .... 3. В окно пробивался слабый свет 4. Мяуканье ... испугало воробьёв. 5. Концерт для .. открыл ансамбль комузистов. 6. За изгородью белели пушистые головки 7. Студент из ... заменил заболевшего <span class=\"pg\" data-n=\"93\">93<\/span>учителя. 8. В хранится старый щит из .... 9. Я купил в буфете пирожок с ...."},{"t":"p","h":"Словё для справок: мясо, университет, кожа, передовик, кошка, удочка, луна, жемчуг, одуванчик."},{"t":"v","l":["Словарь:","бусы – мончок щит – калкан","мяуканье – мыёолоо"]}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[88,93]},{"title":"§ 27. ПРЯМОЕ ДОПОЛНЕНИЕ.","blocks":[{"t":"h3","h":"§ 27. ПРЯМОЕ ДОПОЛНЕНИЕ."},{"t":"p","h":"(Тике толуктооч.)"},{"t":"p","h":"Повторить переходные и непереходные глаголы. 8 17."},{"t":"p","h":"Вспомните:"},{"t":"p","h":"1. Какой член предложения называется дополнением?"},{"t":"p","h":"2. Какой вид связи между словами называется управлением?"},{"t":"p","h":"3. Назовите несколько глаголов, которые управляют винительным падежом без предлога."},{"t":"p","h":"4. В каком падеже ставится управляемое слово при глаголе с отрицанием?"},{"t":"p","h":"Действие, обозначаемое глаголом, может переходить на какие-то предметы. Когда я пишу записку, моё действие переходит на записку. Когда строители строят дом, их действие переходит на дом. Глаголы, которые обозначают такие переходящие действия, называются переходными."},{"t":"p","h":"Дополнение, стоящее при переходном глаголе в винительном падеже без предлога, называется прямым дополнением."},{"t":"p","h":"Прямое дополнение русского языка соответствует в основном такому же дополнению (тике толуктооч) в кыргызском языке. Например: Мир победит войну! – Тынчтык согушту женет!"},{"t":"p","h":"Прямое дополнение может быть при глаголах, называющих конкретное действие, и обозначать тот предмет, на который оно переходит. Например: резать бумагу, <span class=\"pg\" data-n=\"94\">94<\/span>рубить дерево, поймать черепаху, шить костюм, строить дорогу, воспитать дочь и т.д."},{"t":"p","h":"Прямое дополнение встречается также при глаголах с приставками лере-, про-, о- (06-), обозначающих движение. Такое дополнение указывает место, где совершается названное движение. Например: перейти речку, перепрыгнуть канаву, проехать деревню, обойти весь город, объехать гору."},{"t":"p","h":"Если при переходном глаголе есть отрицание, то прямое дополнение может быть выражено как винительным, так и родительным падежом."},{"t":"p","h":"Винительный падеж при глаголе с отрицанием лучше употреблять, когда дополнение обозначает знакомый предмет (человёка), о котором уже говорили. Например: Не обижай Нину! Я не видел девушки. В первом случае дополнение обозначает известного нам человека и употреблено в винительном падеже. Во втором предложении речь идёт о незнакомом человеке: дополнение употреблено в родительнм падеже."},{"t":"p","h":"Когда прямое дополнение стоит при глаголе с отрицанием, обозначающим чувства, мысли, желания, оно обычно употребляется в родительном падеже. Например: Он не хотел воды. Я не ждал письма. Учитель не любил подсказок."},{"t":"p","h":"В отличие от кыргызского языка, где дополнение стоит перед управляющим словом, в русском языке дополнение часто (но не всегда) стоит после управляющего слова. Сравните: Я написал письмо. – Мен кат жаздым."},{"t":"p","h":"Прямое дополнение бывает выражено обычно именем существительным или местоимением."},{"t":"v","l":["Вопросы для повторения:","1. Какие глаголы называются переходными?","2. Какие дополнения называются прямыми?"]},{"t":"p","h":"3. Каким падежом обычно выражается прямое дополнение?"},{"t":"p","h":"4. При каких глаголах обычно бывает прямое дополнение?"},{"t":"p","h":"5. Когда прямое дополнение может быть выражено родительным падежом?"},{"t":"p","h":"6. В каких случаях при глаголах с отрицанием употребляется прямое дополнение в винительном падеже?"},{"t":"p","h":"<span class=\"pg\" data-n=\"95\">95<\/span>7. На какдм месте стоит в русском языке прямое дополнение по отношению к управляющему слову?"},{"t":"p","h":"Упражнение 145. Взятые в скобки прямые дополнения поставьте в нужном падеже."},{"t":"h3","h":"ПАВЕЛ НАПАДАЕТ НА КОНВОИРА."},{"t":"p","h":"Павел решил освободить (Жухрай). На улице он не заметил (никто), кто бы мог помешать ему. Жухрай увидел (Корчагин). Он что-то сказать Павлу, но только махнул рукой. Конвоир подтолкнул (он) штыком. Павел боялся привлечь (внимание) петлюровца. Когда конвоир поравнялся с Павлом, Корчагин бросился к нему и выхватил (винтовка). Противник не ожидал (нападение), но сейчас же рванул (винтовка) к себе. Павел удержал (она). Бабахнул выстрел. Конвойный рвал винтовку. Он крутил (она), выворачивал Павлу (рука)."},{"t":"p","h":"По Н. Островскому."},{"t":"p","h":"Словарь:"},{"t":"p","h":"бабахнуть – тарс этуу выворачивать – толгоо"},{"t":"p","h":"Упражнение 146. Перепишите, заменяя прямые выделенные дополнения другими, подходящими по смыслу."},{"t":"p","h":"Образец: Художник рисует портрет."},{"t":"p","h":"1. Художник рисует картину. 2. Журналист опубликовал очерк. 3. Инженер сконструировал новый прибор."},{"t":"p","h":"4. На память о встрече пионеры сохранили фотографию с надписью писателя. 5. Наша соседка сдала телевизор в ремонтную мастерскую. 6. Герасим искренне полюбил собачку. 7. Чёрные от загара и пыли пастухи жадно пили холодный кумые. 8. Орёл заметил добычу."},{"t":"p","h":"Слова для справок: заяц, портрет, станок, статья, радиоприёмник, книга, айран, щенок."},{"t":"v","l":["Словарь:","","сохранить – сактоо загар – кунге куйу\\у"]},{"t":"p","h":"<span class=\"pg\" data-n=\"96\">96<\/span>Упражнение 147. Перепишите, вставляя вместо точек подходящие по смыслу дополнения."},{"t":"p","h":"1. Старик ловил неводом ..., старуха пряла свою ...."},{"t":"p","h":"2. Мать расстелила на столе .... 3. В мастерской мы просверлили ... в доске. 4. Наташа исполняла русскую народную .... 5. Командир отдал чёткий 6. Мы с большим желанием изучаем ... Т. Пушкин посвятил няне замечательное .... 8. Продавец открыл ...."},{"t":"v","l":["Словарь:","расстелить – жаюу посвятить – арноо","чёткий – даана"]},{"t":"p","h":"Упражнение 148. Переведите с кыргызского языка на русский. Подчеркните прямые дополнения."},{"t":"p","h":"1. Атам бул китепти сатып берди. 2. Биздин мектепте зоологиялык бурч тузулду. 3. Куруучулар мектепти тез куруп бутушту. 4. Кечээ биздин класс жыйналыш откерду."},{"t":"p","h":"5. Дежурный досканы, парталарды суртту. 6. Биз жаны кинофильмди мектептен кердук."},{"t":"p","h":"Упражнение 149. Перепишите, ставя слова из скобок в винительном или родительном падеже."},{"t":"p","h":"1. Я страстно люблю (русский человек), (русская речь), (русская музыка) (П. Чайковский). 2. Хозяйка подоила (корова) и принесла (молоко). 3. Каштанка съела (колбаса) и улеглась спать на полу. 4. Противник не прекращал (огонь). 5. Солдаты не штурмовали (крепость), а обошли (она) справа. 6. Бойцы не чувствовали (усталость) после трудного перехода. 7. Они не хотели (отдых)."},{"t":"v","l":["Словарь:","страстно любить (сильно любить) —","оте суйуу","доить – сааш","штурмовать – чабуул","жасоо","усталость – чарчагандык"]},{"t":"p","h":"Упражнение 150. Перепишите. Вместо точек вставьте дополнения в родительном или винительном падеже."},{"t":"p","h":"<span class=\"pg\" data-n=\"97\">97<\/span>1. Болот не нашёл ..., на которой жил его знакомый."},{"t":"p","h":"2. Дамира не выполнила ... по русскому языку. 3. Мы ещё не проводили ... отряда. 4. Я не купил ... по географии."},{"t":"p","h":"Слова для справок: книга, улица, задание, сбор."},{"t":"p","h":"Упражнение 151. Перепишите. Вместо точек вставьте пропущенные дополнения в нужной форме. Слова для справок даны внизу."},{"t":"p","h":"1. Дети осторожно переходили .... 2. Мы получили от родственников срочную .... 3. Серый волк в глухом лесу встретил рыжую .... 4. С легко поднял над головой тяжёлую .... 5. Сторож обнаружил .... 6. Животноводы Таласа посмотрёли ... столичного театра. 7. Пожарники быстро погасили .... 8. Я люблю своего ...."},{"t":"p","h":"Слова для справок: телеграмма, перекрёсток, лиса, штанга, пропажа, спектакль, отец, пожар."},{"t":"v","l":["Словарь:","пропажа – жоголгон"]}],"sub":[{"title":"ПАВЕЛ НАПАДАЕТ НА КОНВОИРА.","b":25}],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[94,97]},{"title":"§ 28. КОСВЕННОЕ ДОПОЛНЕНИЕ.","blocks":[{"t":"h3","h":"§ 28. КОСВЕННОЕ ДОПОЛНЕНИЕ."},{"t":"v","l":["(Кыйыр толуктооч.)","","Повторить 5 17.","","1. Что называется дополнением?","2. Какие дополнения называются прямыми?"]},{"t":"p","h":"3. Какие глаголы управляют родительным, дательным, винительным, творительным падежами без предлогов?"},{"t":"p","h":"4. Какие глаголы управляют родительным, дательным, винительным, творительным падежами с предлогами и предложным падежом?"},{"t":"p","h":"Дополнения, выраженные родительным, дательным, творительным падежами (кроме родительного при отрицании) без предлога, а также всеми падежами с предлогами, являются косвенными дополнениями."},{"t":"p","h":"<span class=\"pg\" data-n=\"98\">98<\/span>Косвенное дополнение обозначает предмет, к которому обращено действие, выраженное управляющим глаголом. Косвенное дополнвние может выражаться именем существительным или личным местоимением."},{"t":"p","h":"Упражнение 152. Прочитайте и перескажите текст. Найдите в"},{"t":"p","h":"прямые и косвенные дополнения."},{"t":"h3","h":"ПЕРВЫЙ ИССЛЕДОВАТЕЛЬ «МАНАСА»."},{"t":"p","h":"Тяжело нагруженные лошади медленно ступают по узкой тропе. Слева – горы, справа – горы, а впереди – зелёная спина перевала. Путники, идущие рядом с лошадьми, тяжело дышат, жадно хватая ртами разрежённый воздух. Наконец перевал преодолён – и перед глазами усталых людей открылась чудесная горная долина. Навстречу небольшому каравану уже спешили седобородые аксакалы, чабаны, бежали ребятишки. Они радостно встречали давно им знакомого гостя – Василия Васильевича Радлова, академика из Петербурга."},{"t":"p","h":"Прекрасный знаток жизни и быта кыргызского народа, академик Радлов в очередной раз объезжал горный край, чтобы собрать, записать и обработать героический эпос «Манас»."},{"t":"p","h":"Хотя Радлов сильно устал, он не стал терять драгоценного времени. Наскоро умывшись и переодевшись, он взял в руки тетрадь и карандаш. Рядом с ним уселись знаменитые манасчи. Зазвенвли струны комузов и аксакалы начали по очереди петь и рассказывать эпизоды из жизни знаменитого Манаса. Василий Васильевич едва успевал записывать эти красивые, звучные, мудрые народные слова."},{"t":"p","h":"Много лет провёл академик Радлов среди кыргызского народа. Он первым из европейцев записал тысячи строк великого эпоса, а вернувшись в Петербург, издал книгу, благодаря чему люди многих стран мира впервые узнали о высокой духовной культуре кыргызского народа."},{"t":"p","h":"По В. Седову. Словарь:"},{"t":"p","h":"разрежённый воздух – суюк аба"},{"t":"p","h":"<span class=\"pg\" data-n=\"99\">99<\/span>В родительном падеже употребляется дополнение при глаголах, указывающих на достижение чего-то, на соприкосновение с ним: достигнуть вершины, коснуться стены, держаться перил."},{"t":"p","h":"Дополнёние выражается родительным падежом при глаголах, обозначающих желание, ожидание: желать выздоровления, дожидаться каникул, хотеть мяса."},{"t":"p","h":"Дополнение выражается родительным падежом тогда, когда оно употреблено при переходном глаголе, но указывает лишь на часть предмета. Сравните: Я купил хлеб и Я купил хлеба. В первом случае, когда речь идёт о целом, обо всём хлебе, дополнение выражено винительным падежом. Во втором случае речь идёт не о целом хлебе, а о его части, куске, дополнение стоит в родительном падеже."},{"t":"p","h":"С предлогом для дополнение в родительном падеже указывает название предмета или человека, для которого делается что-то. Например: Мы дали для школьников концерт. Я приготовил для матери подарок."},{"t":"p","h":"С предлогом без дополнение в родительном падеже указывает на предмет, без которого невозможно какое-то действие. Например: Нельзя жить без воды."},{"t":"p","h":"Упражнение 153. Перепишите, заменяя выделенные дополнения другими, подходящими по смыслу."},{"t":"p","h":"Образец: В эту зиму многие ученики не избежали гриппа."},{"t":"p","h":"1. В эту зиму многие ученики не избежали простуды."},{"t":"p","h":"2. Лодка носом коснулась берега. 3. Хозяйка принесла из магазина хлеба и колбасы. 4. Товарищи пожелали мне здоровья. 5. Волки и другие хищники боятся огня. 6. Ребята не нашли смородины, но зато насобирали много орехов."},{"t":"p","h":"7. Айша приготовила для родителей ужин. 8. Больной попросил кефира."},{"t":"p","h":"Слова для справок: компот, ежевика, грибы, ружьё, успехи, масло и конфеты, камень, грипп, гости. Словарь:"},{"t":"p","h":"избежать – кутулуу ежевика – кара булдуркен простуда суук тийуу"},{"t":"p","h":"<span class=\"pg\" data-n=\"100\">100<\/span>Упражнение 154. Перепишите. Слова, взятые в скобки, поставьте в нужном падеже и числе."},{"t":"p","h":"1. Свинья под дубом вековым навблась (жёлуди) досыта (И. Крылов). 2. Я не встретил на вокзале (товарищ), потому что не ожидал егб (приезд). 3. Презирай (враг), но уважай (друг). 4. Мы все свои силы отдадим для (расцвет) нашей Родины! 5. Секретарь не дал (отчёт), но зато подробно ‘рассказал о своей работе. 6. Пушкин говорил, что нельзя жить без (чтение) книг. 7. Асель расстелила на столе (скатерть), поставила кипящий самовар (Ч. Айтматов). 8. Корабли успели достигнуть (порт) за несколько часов до бури (А. Куприн)."},{"t":"v","l":["Словарь:","вековой (столетний) – кылымдык","презирать – жек керуу","расцвет гулдее","отчёт – отчёт, эсеп","достигнуть – жетуу"]},{"t":"p","h":"Косвенное дополнение выражается дательным падежом, когда надо указать предмет или лицо, к которому направлено действие. Например: Пишу письмо брату. Приеду к сестре."},{"t":"p","h":"Предлог к в таких дополнениях часто употребляется с глаголами, имеющими приставки под-, при -, а также за -, по -. Например: Приехал к товарищу. Подъехал к дому. Завхать к брату. Поехать к приятелю."},{"t":"p","h":"Упражнение 155. Перепишите, вставляя там, где нужно, предлог к (ко) вместо точек."},{"t":"p","h":"1. Поздно ввчером Танабай ... знакомому дому (Ч. Айтматов). 2. Выпив воды, Абакир побежал ... трактору. 3. Молодые солдаты честно служат ... своему народу."},{"t":"p","h":"4. Перед школой мой друг Володя зашёл .. мне. 5. Свой лучший роман писатель посвятил ... молодёжи. 6. Юные партизаны подобрались ... штабу фашистов и забросали его гранатами (А. Гайдар). 7. Старый учитель подарил „. школе личную библиотвку. 8. Я нарисовал ... приятелю его портрет."},{"t":"p","h":"Словарь:"},{"t":"p","h":"подобраться – енуп баруу личный – жеке, менчик"},{"t":"p","h":"<span class=\"pg\" data-n=\"101\">101<\/span>Упражнение 156. Перепишите. Слова, взятые в скобки, поставьте в нужном падеже. Там, где надо, поставьте предлог к."},{"t":"p","h":"1. Людской поток непрерывно движется (Центральный универмаг). и: | передам Вашу просьбу (директор)."},{"t":"p","h":"3. Молодой чабан всегда обращался за советом и помощью (зоотехник). 4. После экзамена мы подарили (учитель) цветы. 5. Агитмашина направилась (животноводы)."},{"t":"p","h":"6. Браконьерам запрещено приближаться (заповедник)."},{"t":"p","h":"Словарь: людской поток (здесь: очень много"},{"t":"p","h":"людей) – элдин агымы"},{"t":"p","h":"браконьер – тыюу салын-"},{"t":"p","h":"ган анчылык женундегу законду бузган адам"},{"t":"p","h":"Косвенное дополнение выражается винительным падежом с предлогами в, на. Такое дополнение употребляется, когда один предмет превращается в другой: растереть сахар в порошок, разбить стекло на мелкие кусочки."},{"t":"p","h":"Упражнение 157. Перепишите. Слова, взятые в скобки, поставьте в нужном падеже. Подчеркните слова в винительном падеже."},{"t":"h3","h":"ГОЛОДНОЕ ДЕТСТВО."},{"t":"p","h":"Это было до Октября. В нашем доме осталась последняя лепёшка. Бабушка разломила (она) на мелкие кусочки. Каждому (малыш) дала по кусочку. Потом бабушка дала мне и послала меня к (соседка)."},{"t":"p","h":"– Иди, попроси (мука), – сказала она."},{"t":"p","h":"Я подошёл к соседнему (дом). Соседка крутила ручку (джаргылчак). Она превращала зерно в (мука). Из этой (мука) дочь (хозяйка) пекла вкусные лепёшки."},{"t":"p","h":"– Нет! – наотрез злая и жадная соседка и вытолкнула меня на (улица)."},{"t":"p","h":"Шесть мойх (братья и сёстры) остались голодными. По М. Элебаеву."},{"t":"v","l":["<span class=\"pg\" data-n=\"102\">102<\/span>разломить – сындыруу","наотрез – таптакыр","вытолкнуть – туртуп чыгаруу","превращать (здесь: молоть) —","жаргылчакка тартуу"]},{"t":"p","h":"Косвенное дополнение выражается творительным падежом. Творительным падежом обозначается орудие действия, тот предмет, при помощи которого совершается действие. Например: резать хлеб ножом, стучать по дереву палкой, махнуть издали рукой."},{"t":"p","h":"Творительный падеж обозначает также предметы, которыми кто-то занимается, интересуется. Например: заниматься математикой, увлекаться футболом, руководить школой."},{"t":"p","h":"Творительный падеж с предлогом е употребляется для указания на человека (или людей), совместно с которым совершается действие. Например: ловил с братом рыбу, участвую с товарищами в концерте."},{"t":"p","h":"Упражнение 158. Перепишите. Слова, взятые в скобки, поставьте в нужном падеже. Подчеркните слова в творительном падеже."},{"t":"p","h":"1. Турдалы с детства увлекается (музыка). 2. Маленькая Шарипа вымела сор из комнаты и вымыла посуду (К. Джантошев). 3. При спуске со скалы альпинисты обвязались (канат). 4. Орозкул ударил (топор) по рогам оленя (Ч. Айтматов). 5. Бурулча чистым (полотенце) вытерла вымя коровы и взяла ведро (К. Баялинов)."},{"t":"p","h":"6. Опытный бригадир умело руководит (бригада)."},{"t":"v","l":["Словарь:","сор – таштанды вымя – желин","канат – канат, аркан"]},{"t":"p","h":"Упражнение 159. Перепишите. Вместо точек вставьте, где нужно, предлог."},{"t":"p","h":"1. Рыбы дышат ... жабрами. 2. Днём волки ... волчатами спрятались от жары в глубоком овраге. 3. Красноармейцы не боялись .. мороза. 4. Гостеприимные чабаны угостили нас кумысом с боорсоками (К. Касымбеков). 5. Поезд <span class=\"pg\" data-n=\"103\">103<\/span>подъехал маленькой станции. 6. На этой станции Чук и Гек увидели ... бронепоезд. Т. Грозные пушки были укрыты ... брезентом. 8. Артиллеристы ... командиром стояли около пушек (А. Гайдар). 9. Старый друг Чоро одобрил Танабая тёплым словом и добрым советом (Ч. Айтматов). 10. Мы искренне обрадовались встрече ... нашей старой учительницей."},{"t":"v","l":["Словарь;","жабры – бакалоор"]},{"t":"p","h":"С глаголами, которые обозначают речь, мысли (г06в0- рить, думать, рассказать, писать ит. д.), употребляется косвенное дополнение в предложном падеже с предлогом о (об). Например: Мы говорили о своих делах. Отец думал о сыне."},{"t":"p","h":"Упражнение 160. Вставьте вместо точек пропущенные дополнения. Для этого поставьте в нужном падеже слова для справок."},{"t":"p","h":"1. Космонавт доложил .... 2. Газета «Кыргыз туусу» сообщила .... 3. Председатель объявил .... 4. Александр Матросов |: последнюю минуту думал .... 5. Чистоплотный человёк никогда не забывает .... 6. Мы написали своим далёким друзьям ....Т. Афиша извещала .... 8. Чук и Гек не рассказали маме ...."},{"t":"p","h":"Слова для справок: благополучное приземление, смелый поступок ученика, начало собрания, Родина, чистота рук, открытие новой школы, приезд артистов, потерянная телеграмма."},{"t":"v","l":["Словарь:","чистоплотный – таза киши"]},{"t":"p","h":"Задание. Составьте словосочетания с косвенными дополнениями, подобрав существительные и поставив их в нужной форме."},{"t":"p","h":"Поблагодарить за посоветоваться с ..., подготовиться к предупредить о .., погрозить ..., расстаться с ..., руководить .... мечтать о ..., требовать обрадоваться ..., лакомиться опасаться ..., вспоминать о ..., наблюдать за"},{"t":"p","h":"<span class=\"pg\" data-n=\"104\">104<\/span>верить в ..., приблизиться к ..., придираться к ..., махнуть подарить ..., уклониться от ..., вступить в спор с ..., напомнить о ..., вернуться без ..., отступить от ..., грустить о ..., встретиться с .., задуматься о ..., отказаться от ..., заключить договор с .... помириться с ..., превратить в ..., трудиться для ..., браться за .... выступать перед ..., признаться в ..., попросить у ..., следить за ..., играть на ..., спорить о..."},{"t":"p","h":"Упражнение 161. Перепишите. Вместо точек вставьте там, где нужно, предлоги к, с, о."},{"t":"p","h":"1. Многие школьники увлекаются ... баскетболом."},{"t":"p","h":"2. Алтынай написала задушевное письмо ... любимому учителю. 3. Отец сообщил в школу ... болезни сына. 4. Лиса подозрительно обнюхала нору и побежала ... кустарнику (К. Паустовский). 5. Мы ... сестрой накопили денег для поездки в Ташкент. 6. Солнце постепенно клонилось ... горизонту. 7. Доктор Айдаралиев рассказал ... успехах космической медицины. 8. Чапаев ... Фурмановым подъехали .. бойцам. 9. Акбермет рассказала только близкой подруге .. своей мечте."},{"t":"v","l":["Словарь:","увлекаться – берилип кетуу","подозрительно – шектенип","обнюхать – жыттоо","накопить денег – акча жыйноо","клониться – мында: батуу"]},{"t":"p","h":"Упражнение 162. Перепишите. Слова, взятые в скобки, поставьте в нужном падеже. Сверху напишите число и падеж этих слов."},{"t":"h3","h":"СМЕЛЫЙ ЁЖ."},{"t":"p","h":"Змея не ожидала (нападение). Она бросила свою (жертва) и проворно поползла к (скала). Ёж ухватил змею за хвост. Змея злобно шипела и хотела укусить (смельчак). Но ядовитым (зубы) змеи ёж противопоставил колючую броню. Он крепко держал змеиный хвост (зубы), трепал его и не выпускал из своих (челюсти). Жестокая борьба утомила змею. Ёж перегрыз ей (шея) и начал лакомиться (добыча)."},{"t":"p","h":"По В. Пескову."},{"t":"p","h":"<span class=\"pg\" data-n=\"105\">105<\/span>жертва – курман смельчак – кайраттуу, коркпогон противопоставить – каршы коюу колючий – сайгыч, сайгылагыч"},{"t":"v","l":["злобно – каарданып","броня – соот","трепать – уйпалоо"]},{"t":"p","h":"Упражнение 163. Просклоняйте слово стр 6мя. Подчеркните падежные окончания."},{"t":"v","l":["Словарь:","стремя – узенгу"]}],"sub":[{"title":"ПЕРВЫЙ ИССЛЕДОВАТЕЛЬ «МАНАСА».","b":8},{"title":"ГОЛОДНОЕ ДЕТСТВО.","b":47},{"title":"СМЕЛЫЙ ЁЖ.","b":77}],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[98,105]},{"title":"§ 29. ОБСТОЯТЕЛЬСТВА.","blocks":[{"t":"h3","h":"§ 29. ОБСТОЯТЕЛЬСТВА."},{"t":"v","l":["(Бышыктооч.)","","Повторить $ 6.","","Вспомните:"]},{"t":"p","h":"Какие члены предложения называются второстепенными?"},{"t":"p","h":"2. Какой член предложения называется обстоятельством? Обстоятельства указывают на место, время действия, его причину, цель, указывают на то, как происходит действие."},{"t":"p","h":"Часто обстоятельства выражаются наречием, а также деепричастиями и глаголами в неопределённой форме. Наречия, деепричастия и неопределённая форма глагола связаны с теми словами, к которым они относятся по способу примыкания. Например: Нурдин пошёл в школу рано. Вредно читать лёжа. Борцы пошли в зал тренироваться."},{"t":"p","h":"Кроме того, обстоятельства могут быть выражены именами существительными в косвенных падежах. Такие обстоятельства связаны с подчиняющими словами по способу управления. Например: Мальчик от испуга спрятался на чердаке. По улицам слона водили."},{"t":"p","h":"В зависимости от того, с какой стороны обстоятельства характеризуют действие, имеются обстоятельства места, времени, образа действия, причины, цели. Например:"},{"t":"p","h":"<span class=\"pg\" data-n=\"106\">106<\/span>Токтосун идёт домой. Это упражнение выполнено давно. Дамира быстро нашла в предложении обстоятельство. От радости она засмеялась. Мы пришли в школу учиться."},{"t":"p","h":"Обстоятельства чаще всего относятся к глаголам, в том числе к глаголам-сказуемым. Так, например, в предложении Девочка идёт в кино обстоятельство места в кино относится к слову идёт."},{"t":"p","h":"Обстоятельства отвечают на вопросы 2где? куда? откуда? когда? как? каким образом? почему? для чего? зачем? Например: в предложении Дети играют в саду обстоятельство места в саду отвечает на вопрос где?"},{"t":"p","h":"Обстоятельства в русском языке стоят перед словом, к которому они относятся, или после него. Например: Я заходил к тебе вчера. Вчера я заходил к тебе. Постановка обстоятельства ближе к началу предложения обозначает, что оно особенно важно. В первом предложении важно, что я заходил. Во втором -— главное, что заходил именно вчера, а не сегодня или позавчера."},{"t":"v","l":["Вопросы для повторения:","1. Какими частями речи выражаются обстоятельства?"]},{"t":"p","h":"2. Каким способом связываются с основным словом обстоятельства, выраженные наречиями (деепричастиями, глаголами в неопределённой форме, именами существительными)?"},{"t":"v","l":["3. Перечислите 5 видов обстоятельств по значению.","4. На какие вопросы отвечают обстоятельства?"]},{"t":"p","h":"5. К каким частям речи как к главным словам относятся обычно обстоятельства?"},{"t":"p","h":"6. Где стоят обстоятельства в предложении?"},{"t":"p","h":"Упражнение 164. Перепишите. Подчеркните обстоятельства."},{"t":"p","h":"1. Танабай задержался на собрании допоздна. 2. В армию Чоро не взяли из-за больного сердца. 3. Внезапно погода изменилась. 4. Немало учеников Дюйшена бесстрашно сражалось на фронте. 5. Пыль из-под солдатских сапог поднималась кверху. 6. Молчаливая женщина вышла из юрты. 7. Мы ходили собирать топливо для школы. 8. Вскоре началась жатва. 9. Я выбежала из вагона наружу."},{"t":"p","h":"Ч. Айтматов."},{"t":"v","l":["<span class=\"pg\" data-n=\"107\">107<\/span>допоздна – тун киргиче","внезапно – чукул жерден;","кутулбеген жерден","бесстрашно – эр журектуулук менен","кверху – ойде жакка, кекелей","наружу – сыртка"]},{"t":"p","h":"Упражнение 165. Перепишите. Подчеркните обстоятельства и надпишите, чем они выражены."},{"t":"p","h":"1. После купания отряд бодро шагал по пыльной дороге в Токмак (Н.Паршков). 2. Бекташ оставил лошадей под навесом (Ч. Айтматов). 3. За кобылой бежал, ласкаясь, жеребёнок (Ч. Айтматов). 4. Поперек дороги долго лежала ель, сломанная бурей. 5. Стекло упало и разбилось вдребезги."},{"t":"p","h":"6. Ягненок в жаркий день зашёл к ручью напиться (И. Крылов). 7. До вечера сидела старая Толгонай и смотрела на жатву (Ч. Айтматов). 8. От гордости за своих внуков она прослезилась."},{"t":"v","l":["Словарь:","бодро – кайраттуу, сергек","поперёк дороги – жолду туурасынан","кесип","вдребезги – бырынчырыны чыкты","гордоеть —- сыймык","прослезиться (заплакать) —","кезге жаш алуу"]},{"t":"p","h":"Упражнение 166. Перепишите, заменяя выделенные обстоятельства другими, подходящими по смыслу."},{"t":"p","h":"Образец: Гроза надвигалась медленно."},{"t":"p","h":"1. Гроза надвигалась быстро. 2. Карабек грустно напевал песню. 3. Каждый день утром в Бишкек прибывает московский поезд. 4. Андрей специально приехал в Этот незнакомый край. 5. За рекой строились корпуса автомобильного завода. 6. Я пришёл проститься с вами."},{"t":"p","h":"8. Лампочка в коридоре горела очень тускло."},{"t":"p","h":"Слова для справок: медленно, весело, вечером, случайно, вокзал,"},{"t":"v","l":["случайно – кокустан","ярко.","","Словарь:","тускло – булбулдеп"]},{"t":"p","h":"Упражнение 167. Составьте список известных вам русских наречий."}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[106,107]},{"title":"§ 30. ОБСТОЯТЕЛЬСТВА МЕСТА.","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"108\">108<\/span>§ 30. ОБСТОЯТЕЛЬСТВА МЕСТА."},{"t":"v","l":["(Орун бышыктооч.)","","Повторить $ 17.","","Вспомните:"]},{"t":"p","h":"1. Какие члены предложения являются второстепенными?"},{"t":"p","h":"2. На какие виды делятся обстоятельства?"},{"t":"p","h":"3. Какими частями речи выражаются обстоятельства?"},{"t":"p","h":"4. К какой части речи как к главному, подчиняющему, слову обычно относятся обстоятельства?"},{"t":"p","h":"Обстоятельства, которые указывают место действия, называются обстоятельствами места. Например: В классе окончились уроки. Жанболот идёт из школы. Он направляется домой."},{"t":"p","h":"В этих предложениях обстоятельства обозначают место действия, куда и откуда оно направлено. Обстоятельства"},{"t":"p","h":"отвечают на вопросы где? куда? откуда?"},{"t":"p","h":"Обстоятельства места часто выражаются наречиями места: здесь, там, тут, туда, сюда, всюду, везде, дома, вдали, вдаль, вперёд, впереди, назад, сзади, наверху, внизу, вверх, вокруг, налево, направо, близко, далеко, посредине, издалека, оттуда, отсюда, домой и другими. Например: Дети животноводов приехали в школуинтернат издалека. Тропинка поворачивала то влево, то вправо. Карандаш лежит здесь."},{"t":"p","h":"Обстоятельства места, которые указывают на то, где происходит действие, могут, кроме того, выражаться именами существительными в косвенных падежах с предлогами:"},{"t":"p","h":"а) родительным падежом с предлогами у, около. Например: Почтальон остановился у калитки. Библиотека находится около сельсовета;"},{"t":"p","h":"б) дательным падежом с предлогом по. Например: Стадо шло по переулку;"},{"t":"p","h":"в)творительным падежом с предлогами за, над, под. Например: За горами видны ещё более высокие горы. «Ребята! Не Москва ль за нами? Умрёмте ж под Москвой, как наши братья умирали!» (М. Лермонтов)."},{"t":"p","h":"<span class=\"pg\" data-n=\"109\">109<\/span>Над седой равниной мдря ветер тучи собирает (М. Горький)."},{"t":"p","h":"г) предложным падежом с предлогами в, на. Например: Брат живёт и учится в Москве. Сестра работает на заводе."},{"t":"p","h":"Обстоятельства места, которые указывают на то, откуда началось действие, из какого места оно исходит, кроме наречий, могут выражаться именами существительными |: родительном падеже с предлогами из, с. Например: Голуби вылетели из ущелья. Он спустился с башни."},{"t":"p","h":"Обстоятельства места, которые указывают, куда направляется действие, кроме наречий, могут быть выражены именами существительными с предлогами:"},{"t":"p","h":"а) в дательном падеже с предлогом к. Например: Гусей крикливых караван тянулся к югу (А. Пушкин). К мазару Манаса туристы подъехали уже в сумерках."},{"t":"p","h":"б) ийтельном падеже с предлогами в, на, под. Например: Пастух выгнал стадо в поле. Сам сел под дерево. Сумку с едой положил на траву."},{"t":"v","l":["Вопросы для повторения:","1. На что указывают обстоятельства места?","2. На какие вопросы отвечают обстоятельства места?"]},{"t":"p","h":"3. Перечислите несколько наречий, указывающих место. Упражнение 168. Перепишите. Подчеркните обстоятельства места и укажите, на какие вопросы они отвечают."},{"t":"p","h":"1. Далеко-далеко колокольчик звенит. Рыбаки в шалаше пробудились (И. Никитин). 2. За лесом стояли неприятельские пушки (Л. Толстой). 3. Не останусь я тут долго, уйду отсюда за Волгу (А. Толстой). 4. Голуби взлетели с крыши. 5. Отсюда, с вершины хребта, мы долго любовались долиной. 6. Мать хотела повернуть назад, но пошла вперёд (М. Горький). Т. Я лежал под кустом и глядел на мальчиков (И. Тургенев). 8. Из мастерской выехал отремонтированный трактор. 9. В клубе и в каждом доме зажглись электрические лампочки (Т. Сыдыкбеков)."},{"t":"p","h":"Упражнение 169. Перепишите. Вместо точек вставьте обстоятельства места, выраженные наречиями места."},{"t":"p","h":"<span class=\"pg\" data-n=\"110\">110<\/span>Образец: Всюду ивели голубые цветы."},{"t":"p","h":"1. ... цвели голубые цветы. 2. Смелые и бесстрашные люди идут .., а трусливые и робкие оглядываются ...."},{"t":"p","h":"3. Заметив приближение грозы, дети побежали .... 4. ... донеслись раскаты грома. 5. Тяжёлые дождевые тучи показались .... 6. Конный отряд повернул .... Т. Решительной походкой Виктор направился .... 8. ... просочилась вода."},{"t":"p","h":"Словары робкий – коркок, жалтак"},{"t":"v","l":["донестись – угулуу","направиться – багыт алуу","просочиться – жылжып агуу"]},{"t":"p","h":"Упражнение 170. Перепишите, заменяя выделенные обстоятельства места другими словами."},{"t":"p","h":"Образец: Стая воробьёв слетела с берёзы."},{"t":"p","h":"1. Стая воробьёв слетела © яблони. 2. Многие перелётные птицы зимуют на озере. 3. Фашисты потерпели под Москвой жестокое поражение. 4. Над стадионом взлетели разноцветные шары. 5. За селом слышались песни девушек."},{"t":"p","h":"6. Около перевала шофёр налил в радиатор холодной воды."},{"t":"p","h":"7. Мои родственники живут в Жалал-Абаде. 8. Из Таласа приехал в столицу знаменитый манасчи."},{"t":"p","h":"Слова для справок: Иссык-Куль, берёза, Смоленск, деревня, парк, родник, Майлуу-Сай, Нарын, Бишкек."},{"t":"p","h":"Упражнение 171. Перепишите. Существительные, заключённые в скобки, поставьте в нужном падеже."},{"t":"p","h":"1. Недавно я получил из (аил) телеграмму (Ч. Айтматов). 2. Отары спустились с зимних (пастбища) в зелёную долину (Ч. Айтматов). 3. За (Енисей) начинается тайга. 4. Мы подошли к Алексею Максимовичу. Он поливал под (окно) красные мохнатые георгины (А. Фадеев)."},{"t":"p","h":"5. Горький прошёл пешком по (Кавказ) и (Крым). 6. Чехов несколько лет жил в (Ялта). Т. Мой дед закончил войну под (Берлин). 8. Солдаты вытащили из (болото) застрявший грузовик. 9. Над (ледник) всегда стоит туман. 10. Днём и <span class=\"pg\" data-n=\"111\">111<\/span>ночью к (фронт) двигались войска. Они направлялись на самые опасные (участок). 11. Сани быстро катились под (гора)."},{"t":"p","h":"Слова рь:"},{"t":"p","h":"застрявший (от застрять) – тыгылып катиться – тоголонуу"},{"t":"p","h":"калган Упражнение 172. Перепишите, заменяя обстоятельства места, выраженные винительным падежом существительных с предлогами в, на, под, существительными в дательном падеже с предлогом к."},{"t":"p","h":"Образец: Сестра пошла к магазину."},{"t":"p","h":". Сестра пошла в магазин. 2. В жаркий день горожане спешат на пляж. 3. Колонна демонстрантов двигалась на площадь. 4. Тракторист подогнал трактор под навес. 5. Вечером выздоравливающие ходили в рощу. 6. Новые рыбачьи лодки доставлены на озеро. 7. Змея уползла под скалу."},{"t":"p","h":"8. Тропинка ведёт в ущелье."},{"t":"v","l":["Словарь:","пляж – сууга тушуп, кунге","куйуучу жай","роща токойчо","выздоравливающий – айыгып","келе жаткан"]},{"t":"p","h":"Упражнение 173. Переведите на русский язык. Подчеркните обстоятельства места. Укажите, какой частью речи они выражены."},{"t":"p","h":"1. Поездге Жалал-Абаттан туштук. 2. Экинчи куну Токмокко келдик. 3. Тигил жерге жаны стадион курулат."},{"t":"p","h":"4. Жайкы каникулда колхоздо иштейбиз. 5. Биздин кыштакта кыргыздар жана орустар турушат. 6. Оштон келген артисттер концерт беришти. 7. Жумаштын агасы Анкарада окуп журет. 8. Бул жерге шаардын Ардак тактасы коюлат."},{"t":"p","h":"Упражнение 174. Какими членами предложения являются выделенные слова? Замените их так, как показано в образце."},{"t":"p","h":"В предгорье было село."},{"t":"p","h":"1. Перед горами было село. 2. Туристы побывали под Москвой. 3. За рекой на опушке леса ребята разожгли <span class=\"pg\" data-n=\"112\">112<\/span>небольшой костёр. 4. По берегу реки и в лесной чаще росли вкусные ягоды. 5. Меж горами проходило русло реки. 6. За Волгой открылся простор казахских степей."},{"t":"v","l":["Словарь:","чаща – чытырман простор – мейкиндик","русло – сай, езен"]}],"sub":[],"section":"СВЯЗЬ СЛОВ В ПРЕДЛОЖЕНИИ. (Суйлемде сездердун байланышы.)","pages":[108,112]},{"title":"§ 31. ОБСТОЯТЕЛЬСТВА ВРЕМЕНИ.","blocks":[{"t":"h3","h":"§ 31. ОБСТОЯТЕЛЬСТВА ВРЕМЕНИ."},{"t":"p","h":"(Мезгил башыктооч.)"},{"t":"p","h":"Повторить $5 17."},{"t":"p","h":"Обстоятельства, указывающие время действия, а также время начала и конца действия, называются обстоятельствами времени. Например: Утром было тепло. Вечером начал моросить холодный дождь."},{"t":"p","h":"Нередко обстоятельства времени выражаются наречиями времени: тогда, всегда, иногда, потом, сегодня, теперь, завтра, вчера, утром, днём, вечером, ночью, весной, летом, осенью, зимой, давно, сейчас, сначала, рано, поздно, вовремя, однажды, скоро и др."},{"t":"p","h":"Обстоятельства времени, указывающие, когда совершается действие, могут выражаться деепричастиями. Например: Вернувшись, отец сел ужинать."},{"t":"p","h":"Обстоятельства времени часто выражаются сочетаниями имён существительных в родительном падеже с порядковыми числительными, обозначающими дату. Например: Первого января была ёлка. Четвёртого октября тысяча девятьсот пятьдесят седьмого года был запущен первый советский искусственный спутник Земли."},{"t":"p","h":"Обстоятельства времени, указывающие, когда происходит действие, выражаются именами существительными в косвенных падежах с предлогами:"},{"t":"p","h":"а) дательным падежом с предлогами по, к. Например: По утрам надо делать зарядку. Он вернулся только к вечеру."},{"t":"raw","h":"<h4 class=\"mk\"><span class=\"pg\" data-n=\"113\">113<\/span>6) и др.<\/h4>"},{"t":"v","l":["винительным падежом с предлогами в, через","Наприм р: Приходите ко мне в субботу. Через","час начнётся концерт."]},{"t":"p","h":"в) творительным падежом с предлогом перед. Например: Асан зашёл ко мне перед отъездом."},{"t":"p","h":"гр предложным падежом с предлогами на, в. Например: Снег выпал только в январе. Корабли уплыли на рассвете."},{"t":"p","h":"В тех случаях, когда обстоятельство указывает, с какого времени (после чего) происходит действие, обстоятельство времени может быть выражено именем существительным в родительном падеже с предлогами с, после. Например: С детских лет Андрей любил плавание. Петя обычно готовил уроки после обеда."},{"t":"p","h":"Когда обстоятельство указывает, до какого времени продолжается действие, оно может выражаться именем существительным в родительном падеже с предлогом до. Например: До конца урока все сидели тихо."},{"t":"p","h":"Задание. Составьте словосочетания с обстоятельствами времени, подобрав соответствующие существительные и поставив их в нужной форме."},{"t":"p","h":"Проснуться на ..., вспомнить через ..., вернуться проститься перед бушевать до ..., тренироваться НО: 3. позвонить в .., любить с .., прогуливаться после ..., назначить на ..., приехать в .., забыть через ..., родиться в"},{"t":"p","h":"выполнить задание за .., закончить проект к ..., отпроситься на ..., не спать до ..., встретиться в ..., завершить кругосветное путешествие через сдать дежурство в ..., послать приветственную телеграмму накануне а принимать лекарство чёрез .... вымыть руки перед ..., хранить картофель до ..., проводить внеклассные мероприятия по ..., приехать в.., отправиться в отпуск после ..., делать зарядку перед ...."},{"t":"p","h":"Упражнение 175. Прочитайте. Вспомните, из каких произведений взяты эти предложения. Найдите в них обстоятельства времени и выпишите их, указывая, чем они выражены."},{"t":"p","h":"1. И слышно было до рассвета, как ликовал француз."},{"t":"p","h":"2. Тогда считать мы стали раны, товарищей считать. 3. Да, <span class=\"pg\" data-n=\"114\">114<\/span>были люди в наше время. (М. Лермонтов). 4. Однажды Дубровский объезжал своё владение. Через минуту он услыш

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9lhAWygtaRFl5Y8trctwYeZxgE6iSV53C6K/Yl+azNkmE1c+ZHaq9qLtBqA9UphwVJqjOh4jP7vqoNsHh7mR61HjdQA=","w":640,"ht":41},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>№<\/td><td>Айтылыш максатына карай<\/td><td>Грамматикалык түзүлүшүнө же баш мүчөлөрдүн санына карай<\/td><td>Баш мүчөлөрдүн бирөө, же экөө болушуна карай<\/td><td>Айкындооч мүчөлөрүнүн болушуна, же болбошуна карай<\/td><td>Сүйлөм мүчөлөрүнүн толук берилип, же бирөөнүн калып калышы<\/td><\/tr><tr><td>1.<\/td><td>Жай сүйлөм<\/td><td>Жөнөкөй сүйлөм<\/td><td>Эки тутумдуу сүйлөм<\/td><td>Жайылма сүйлөм<\/td><td>Толук сүйлөм<\/td><\/tr><tr><td>2.<\/td><td>Суроолуу сүйлөм<\/td><td>Татаал сүйлөм<\/td><td>Бир тутумдуу сүйлөм<\/td><td>Жалаң сүйлөм<\/td><td>Кемтик сүйлөм<\/td><\/tr><tr><td>3.<\/td><td>Илептүү сүйлөм<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><tr><td>4.<\/td><td>Буйрук сүйлөм<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div>"},{"t":"h3","h":"САЯКАТ"},{"t":"p","h":"Балдар токойго саякатка камынышты. Токойдо болуу кандай сонун! Анда түрдүү жер-жемиштер көп. Жапайы алма, жаңгак – баары бышып турган мезгил. Чычырканактын, ит мурундун ашы сапсары, кыпкызыл болуп турат. Токойду аралап, тоонун суусу шаркырап агат. Мугалим балдарга: Балдар көңүл бургула! Жакшылап уккула! Жолго тамак, ылайыктуу кийим, сүлгү, самын алгыла! –деди. Балдар кандай эс алышты?"},{"t":"p","h":"Албетте, алар үчүн эсте каларлык күн болду."}],"sub":[{"title":"16-§. СҮЙЛӨМДҮН ГРАММАТИКАЛЫК ТҮЗҮЛҮШҮ","b":1},{"title":"Ишеним, Сүйүү жана Мекен","b":20},{"title":"САЯКАТ","b":31}],"pages":[44,47]},{"title":"17-§. Сүйлөмдөгү сөздөрдүн байланышы","blocks":[{"t":"h3","h":"17-§. СҮЙЛӨМДӨГҮ СӨЗДӨРДҮН БАЙЛАНЫШЫ"},{"t":"p","h":"Сүйлөм сөз айкашынан түзүлө тургандыгы белгилүү. Ушуга байланыштуу сөз айкашындагы ыкташуу, таандык байланыш, башкаруу сыяктуу багыныңкы байланыштын бардык түрлөрү сүйлөмдө да сакталат."},{"t":"p","h":"<span class=\"pg\" data-n=\"48\">48<\/span>Бирок сүйлөмдөгү сөздөрдүн байланышуу жолдору алда качан эркин жана ар түрдүү. Мисалы, баш мүчөлөрдүн ортосунда ээрчишүү бар. Ушундай эле, сүйлөмдүн бир өңчөй мүчөлөрү өз ара тең байланышат: <i>Күзүндө канаттуулар, айбанаттар кышка камынышат. Канаттуулар, айбанаттар<\/i> деген бир өңчөй сөздөр бири-бири менен тең байланышты, бири экинчисине көз каранды эмес, тең укукта."},{"t":"p","h":"Ал эми <i>күзүндө камынышат<\/i> жана <i>кышка камынышат<\/i> деген сөздөрдүн ортосунда багыныңкы байланыш (башкаруу) бар."},{"t":"p","h":"Ошентип, сүйлөмдөгү сөздөр төмөнкүдөй жолдор аркылуу байланышат: багыныңкы байланыш жана тең байланыш."},{"t":"p","h":"Эгерде сүйлөм мүчөлөрүнүн ортосундагы байланышты эске алсак, анда ээ менен баяндоочтун ортосунда ээрчишүү; толуктооч менен баяндоочтун, ушундай эле бышыктооч менен баяндоочтун ортосунда башкаруу же ыкташуу; аныктооч жана аныкталуучу сөздүн ортосунда таандык же ыкташуу байланыштары бар."},{"t":"p","h":"<b>84.<\/b> Окугула. Сөз айкашындагы сөздөр бир-бири менен кандайча (ыкташуу, таандык байланыш, башкаруу) байланышты? Байланыштын ошол түрлөрү сүйлөмдө сакталдыбы? Салыштыргыла."},{"t":"p","h":"1. Он беш окуучу – Он беш окуучу университетке өттү. 2. Кенен бөлмө – Кенен бөлмөдө окуйбуз<sup>2<\/sup>. 3. Эртең баруу —Эртең барабыз. 4. Кыпкызыл анар – Кыпкызыл анар сатып алдык. 5. Баланын аты – Баланын аты Данияр эле. 6. Ак карлуу тоолор – Ак карлуу тоолор бийик. 7. Сенин карындашың – Сенин карындашың келди. 8. Сары-Челектин жаратылышы – Сары-Челектин жаратылышы<sup>2<\/sup> жомоктогудай кооз."},{"t":"p","h":"<b>85.<\/b> Текстти окугула. Сүйлөмдүн тутумунда бири-бири менен тең мааниде байланышкан сөздөр барбы? Аларды көрсөткүлө. Алар сүйлөмдүн кайсы мүчөсү болушат?"},{"t":"h3","h":"УЛУУ ИНСАНДАР"},{"t":"p","h":"Курманжан датка жөнүндөгү аңыз кептер урпактардан урпактарга уланып келатат. Чыгыштын хандары, эмирлери, акимдери Курманжан энебизге «датка» деген наамды ыйгарышкан <span class=\"pg\" data-n=\"49\">49<\/span>экен. Курманжан датка ашкан акылман, айлакер эл энеси болгон. Чачылганды жыйнаган, үзүлгөндү улаган. Улутубуздун, элибиздин ынтымагын сактаган. Аракети, кеби аркылуу башка элдер менен достукту чыңдоого данакер болгон. Ошентип, Курманжан энебиз кыргыз аялзатынын үлгүсү болуп саналат. («КТ»)"},{"t":"p","h":"<b>86.<\/b> Көчүрүп жазгыла да, сүйлөмгө синтаксистик талдоо жүргүзгүлө. Сүйлөмдөгү сөздөрдүн ортосундагы байланыштын жолдорун түшүндүргүлө."},{"t":"p","h":"1. Баардык шумкар кыраан эмес. Баардык күлүк чыгаан эмес. 2. Түлкүнүн калтары бар. Өрдөктүн чүрөгү бар. 3. Байлыктын түрү көп, анын эң башкысы – ынтымак. 4. Уят өлүмдөн катуу. 5. Жаманга жанашпа. Жакшыдан адашпа. 6. Сөз менен убада бербе. Иш менен өрнөк көрсөт. (Мак.)"}],"sub":[{"title":"УЛУУ ИНСАНДАР","b":9}],"pages":[47,49]},{"title":"18-§. Ээрчишүү","blocks":[{"t":"h3","h":"18-§. ЭЭРЧИШҮҮ"},{"t":"p","h":"Байланыштын бул түрү сүйлөмдүн баш мүчөлөрүнүн ортосунда болот. Мында баяндооч ээ менен байланышып, аны жак жана сан боюнча ээрчийт."},{"t":"p","h":"Мисалы: 1. <i>Мен шаарга барам.<\/i> 2. <i>Сен шаарга бардың. Мен, сен<\/i> деген сүйлөмдүн ээлери I, II жакта, жекелик санда колдонулду. Баяндоочтор да (бардым, <i>бардың)<\/i> аларды ээрчип, ошол жакта, ошол санда айтылды."},{"t":"p","h":"Бирок баш мүчөлөрдүн жак жана сан боюнча ээрчишүүсү дайыма эле сакталбайт, мындай учурда алар маанилик жагынан байланышат. Төмөнкү учурларга көңүл бургула."},{"t":"p","h":"Эгерде ээ жансыз заттардан болуп, көптүк санда айтылса да, баяндооч жекелик санда турушу мүмкүн: 1) <i>Сансыз<\/i> <b><i>гүлдөр<\/i><\/b> <i>жер бетине<\/i> <b><i>жыйнады.<\/i><\/b> 2) <i>Станцияга жакын жерде<\/i> <b><i>арабалар<\/i> <i>тизилип<\/i> <i>турат.(Ч.А.)<\/i><\/b>"},{"t":"p","h":"1) <i>Быйыл да жүздөгөн<\/i> <b><i>студенттер<\/i><\/b> <i>айылга<\/i> <b><i>жиберилди.<\/i><\/b> 2) <i>Азыр бизде, мыкты<\/i> <b><i>педагогдор<\/i> <i>бар.<\/i><\/b> 3) <b><i>Тянь-Шань<\/i><\/b> кышта <b><i>жылуу,<\/i><\/b> <i>жайда<\/i> <b><i>салкын<\/i><\/b> (М.А.)"},{"t":"p","h":"<b>87.<\/b> Адегенде мүчөлөргө назар бургула. Булар кайсы мүчөлөр эле? Айтып бергиле. Андан кийин сүйлөмдөрдү көчүрүп жазып, ээ менен баяндоочунун астын сызгыла. Жак жана сан боюнча ээ менен баяндоочтон кандай жалпылыкты байкадыңар?"},{"t":"p","h":"<span class=\"pg\" data-n=\"50\">50<\/span>-мын, -мин, -мун, мүн, -быз (-пыз), -биз (пиз), -буз (-пуз), бүз (-пүз), -сын, -сиң, -суң, -сүң, -сыңар, -сиңер, -суңар, -суздар."},{"t":"p","h":"1. Ар дайым бир жакка жол жүрөрдө, мен ушул алкагы жөнөкөй жыгачтан жасалган сүрөттүн алдына келип турам. (Ч.А.) 2. Сен да аны коштоп, илкип бараттың. («АТ») 3. Балалык мени таштап кетпей эле, мен аны таштап кеткен өндөнөмүн. (А.Р.) Биз сени жамандыкка кыйбайбыз, анда эле бизди ата-бабалардын каргышы урбайбы! («КМ») 4. Жаш жетилет, болот кетилет. (Мак.) 5. Бу балдар келечекте мыкты азаматтардан болот. («КМ») 6. Мен да бирөөнүн баласымын."},{"t":"p","h":"<b>88.<\/b> Текстти окуп, баш мүчөлөрү жак боюнча ээрчишкен сүйлөмдөрдү өзүнчө ажыраткыла. Андан кийин баяндоочко уланган жак мүчөнү алып таштап, сүйлөмдү кайра окуп көргүлө. Жак мүчөлөрдүн маанисин түшүндүргүлө."},{"t":"p","h":"– Ой, сен эмне кылып жүрөсүң! – дегенде, балдардын артынан тызылдап жөнөдүм. Биздин үй эң четте болор эле. Алкылдаган жеңем экөөбүз<sup>1<\/sup> соку жанчып жатабыз. Мен улам Дүйшөндөр жакты карап жаттым."},{"t":"p","h":"Үйлөрдү катары менен кыдырып, Дүйшөн бизге да келип жетти. Дүйшөн жайдары күлүп салам берди:"},{"t":"p","h":"– Кана эмесе, бүгүн<sup>3<\/sup> окуу башталат. Кызыңар нече жашта? Алтынай, жашың канчада?"},{"t":"p","h":"Мен унчуккан жокмун. – Сен мунун жаш-пашын эмне кыласың? – деп алкынды жеңем."},{"t":"p","h":"– Сиз байкап сүйлөңүз! Бул кыз бизге керек. (Ч.А.)"},{"t":"p","h":"<b>89.<\/b> Жадыбалга көңүл бургула. Анда көрсөтүлгөн жак мүчөлөрдү эсиңерде сактагыла жана сүйлөм түзүүдө аларды пайдалангыла."},{"t":"p","h":"ЭТИШКЕ УЛАНУУЧУ ЖАК МҮЧӨЛӨР"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td rowspan=\"2\"><b>Жактар<\/b><\/td><td colspan=\"2\"><b>Жекелик сан<\/b><\/td><td colspan=\"2\"><b>Көптүк сан<\/b><\/td><\/tr><tr><td><b>толук түрү<\/b><\/td><td><b>толук эмес түрү<\/b><\/td><td><b>толук түрү<\/b><\/td><td><b>толук эмес түрү<\/b><\/td><\/tr><tr><td>I<\/td><td>-мын<\/td><td>-м<\/td><td>-быз<\/td><td>-к<\/td><\/tr><tr><td>II сылык<\/td><td>-сын<\/td><td>-ң<\/td><td>-сыңар<\/td><td>-ңар<\/td><\/tr><tr><td>III<\/td><td>-сыз<\/td><td>-ңыз<\/td><td>-сыздар<\/td><td>-ңыздар<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>90.<\/b> Көп чекиттин ордуна ээлик милдетти аткаруучу атоочту коюп, этиш сөзгө жак мүчөлөрдү улап көчүргүлө. Баш мүчөлөрдүн астын сызгыла. Эгерде этиштик баяндоочко жак мүчө уланбаса, айтылуучу ой кандай абалда болор эле?"},{"t":"p","h":"<span class=\"pg\" data-n=\"51\">51<\/span>1. Кечээ кечке ... көчөттөрдү сугаруу ... 2. Дүйшөн ошентип мугалимдик кесипти ыйык көргөн. ... да бул кесипти сүй... 3. Көрсөтмөдө болгондо ... балдардын кол эмгегине аябай таң калды.... 4. Жемиш үзүүнү ... баштап бер ...? 5. ... келечекте кандай кесипке ээ боло...?"},{"t":"p","h":"<b>91.<\/b> Текстти окугула. Сүйлөмдүн баш мүчөлөрүн көрсөткүлө. Алардын милдетин кайсы сөз түркүмдөрү аткарды? Этиштин жагын жана чагын аныктагыла. Текстке кандай ат коюуга болот? Негизги ой эмне жөнүндө?"},{"t":"p","h":"Өзбекстан – менин Мекеним деп сыймыктанабыз! Бул сыймык улуттук сыймык менен байланыштуу болуп, айрыкча башка журттарга барганда ачык-айкын сезилет. Өзүбүздүн үрп-адаттарыбыз, маданиятыбыз менен Мекенибизге болгон сүйүүбүздү билдиребиз. Президентибиз: «Перзенттерибиз бизге караганда күчтүү, билимдүү, акылдуу жана албетте бактылуу болуусу шарт» дейт."},{"t":"p","h":"<b>92.<\/b> Схеманы дептериңерге сызгыла. Байланыштын ар бир түрүнө үчтөн мисал ойлоп жазып келгиле. Сөз айкашынын тутумунда жана сүйлөмдө байланыштын кайсы түрлөрү болот?"},{"t":"img","src":"data:image/webp;base64,UklGRmofAABXRUJQVlA4INYIAACQNwCdASoEAckAPrVYp02nJSQiJ1JJUOAWiU3fj5MJcbjL8oSSGHirvn/1+ AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD2WEBCky6aobxg3L6O5LmV398Vu892haAxTavbR/PV3x8FHV5pM4gqWTQKFjiESjYfhMIIGzfsGTy72WTNMvVoV02rAA==","w":260,"ht":201},{"t":"v","l":["Багыныңкы байланыштын түрлөрү","→ ыкташуу","→ башкаруу","→ таандык байланыш","→ ээрчишүү"]},{"t":"p","h":"<b>93.<\/b> Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Баш жана айкындооч мүчөлөрдүн ортосундагы байланыштын жолдорун аныктагыла."},{"t":"h3","h":"ПАХТА"},{"t":"p","h":"Пахта Өзбекстанда эгилет. Аны элибиз «ак алтын» деп аташат. Чындыгында эле, пахта биздин жашоо-турмушубузга эң керектүү. Андан ар түрдүү кездемелер токулат. Биздин кийимдерибиз жана башка баалуу буюмдар пахтадан жасалат. Пахта көп эмгекти талап кылат."}],"sub":[{"title":"ПАХТА","b":26}],"pages":[49,51]},{"title":"19-§. Ээ, анын милдетин аткаруучу сөз түркүмдөрү","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"52\">52<\/span>СҮЙЛӨМ МҮЧӨЛӨРҮ СҮЙЛӨМДҮН БАШ МҮЧӨЛӨРҮ"},{"t":"h3","h":"19-§. ЭЭ, АНЫН МИЛДЕТИН АТКАРУУЧУ СӨЗ ТҮРКҮМДӨРҮ"},{"t":"p","h":"Лексикалык мааниге ээ болгон сөздөр гана сүйлөм мүчөлөрүнүн милдетин аткара алары силерге белгилүү. Бирок алар сүйлөм тутумунан сырткары турганда, бир нерсенин атын белгилеген кадыресе эле сөз болот. Сүйлөм тутумунда туруп, башка сөздөр менен байланышып, синтаксистик бир милдет аткарганда гана алар сүйлөм мүчөлөрү боло алат. Бирок сүйлөм мүчөлөрүнүн баары эле сүйлөм түзүүдө бирдей роль аткара бербейт. Буга байланыштуу алар баш жана айкындооч мүчөлөр болуп экиге бөлүнөт."},{"t":"p","h":"Баш мүчөлөрсүз сүйлөм түзүүгө болбойт.Ошондуктан алар сүйлөмдүн грамматикалык негизин түзүшөт. Буларга ээ менен баяндооч кирет. Мисалы: Айбек келди. Айбек – ээ, келди – баяндооч."},{"t":"p","h":"Баш мүчөлөр менен гана ойду толук түшүндүрүү мүмкүн эмес. Айталы, биз Айбектин келгендигин гана эмес, кайсы Айбектин качан, эмне үчүн, кайдан келгендигин да айткыбыз келет.Бул үчүн баш мүчөлөр менен катар айкындооч мүчөлөр да зарыл. Окууда Айбек кечээ апасына учурашайын деп курбусу менен шаардан келди. мында Айбек – ээ, келди – баяндооч, курбусу менен – толуктооч, кечээ учурашайын деп – бышыктооч, окуудагы – аныктооч. Ошентип, айкындооч мүчөлөр баш мүчөлөргө багынып турат да, аларды аныктап, тактап көрсөтүп, ойду толук жеткирүүдө кызмат өтөйт.Айкындооч мүчөлөргө аныктооч, толуктооч, бышыктооч кирет."},{"t":"p","h":"<b>94.<\/b> Жадыбалды карап, ээнин милдетин кайсы сөз түркүмдөр аткаргандыгына назар салгыла. 3—7-сүйлөмдөрдөгү сөздөр сүйлөмдүн тутумунан сырткары турганда кандай суроолорго жооп берет? Демек, алар кандай кырдаалда ээнин милдетин аткара алат экен?"},{"t":"raw","h":"<div class=\"tbl\"><span class=\"pg\" data-n=\"53\">53<\/span><table><tr><td><b>№<\/b><\/td><td><b>Сөз түркүмдөрү<\/b><\/td><td><b>Мисалдар<\/b><\/td><td><b>Суроолор<\/b><\/td><\/tr><tr><td>1<\/td><td>Зат атооч<\/td><td><b><i>Адам<\/i><\/b> <i>өз кемчилигин башканын көзү менен жакшы көрөт<\/i> (Кытай мак.)<\/td><td>Ким? – <i>адам<\/i><\/td><\/tr><tr><td>2<\/td><td>Ат атооч<\/td><td><b><i>Ал<\/i><\/b> <i>шыкты тагдыр буйругу менен татынакай табият ойготорун кийин сезди<\/i> (Б.Б.)<\/td><td>Ким? – <i>адам<\/i><\/td><\/tr><tr><td>3<\/td><td>Сын атооч<\/td><td><b><i>Билимсиз<\/i><\/b> <i>– өлүк жан. (Мак.)<\/i><\/td><td>Ким? – <i>билимсиз<\/i><\/td><\/tr><tr><td>4<\/td><td>Сан атооч<\/td><td><i>Эртең менен<\/i> <b><i>бирөө<\/i><\/b> <i>келип чакырып кеткен<\/i><\/td><td>Ким? – <i>бирөө<\/i><\/td><\/tr><tr><td>5<\/td><td>Атоочтуктар<\/td><td><b><i>Окубаган<\/i><\/b> <i>окута албайт<\/i><\/td><td>Ким? – <i>окубаган<\/i><\/td><\/tr><tr><td>6<\/td><td>Кыймыл атоочтор<\/td><td><b><i>Ишенүү<\/i><\/b> <i>көп нерсеге жеткирет<\/i><\/td><td>Эмне? – <i>ишенүү<\/i><\/td><\/tr><tr><td>7<\/td><td>Тактооч<\/td><td><b><i>Эртеңки<\/i> <i>–<\/i><\/b> <i>бүгүнкүнүн куйругу<\/i><\/td><td>Ким? – <i>эртеңки<\/i><\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>95.<\/b> Текстти окугула. Сүйлөмдүн грамматикалык негизин түзгөн сүйлөм мүчөлөрүн атагыла. Ээге мүнөздүү белгилер кайсы?"},{"t":"p","h":"Жакында кышкы каникул башталат. Каникулда мен Чимгенге барып эс алганы жатам. Ал жерде менин чоң атам, чоң энем жашашат. Мен аларга жардам бергени барам. Чимгенде аба таза, айлана аппак кар. Тоолор бийик. Чоң атама башка неберелери да жардам бергени келишет. Алар Самарканд, Ташкентте жашашат. Биз баарыбыз түштө чана, лыжа тепкени барабыз. Өзөндөгү сууга коньки тебебиз. Айылда эс алуу абдан көңүлдүү."},{"t":"p","h":"<b>96.<\/b> Көчүрүп жазгыла. Сүйлөмдүн баш мүчөлөрүнүн астын сызгыла. Алар кандай суроого жооп беришти, кайсы сөз түркүмүнөн жасалды?"},{"t":"p","h":"1. Билимдүү<sup>1<\/sup> түйшүктөнүп ойлоп жүрөт. Билимсиз ой жүгүртпөй ойноп күлөт. Билим – байлык. Ага жетсең, кем болбойсуң. Аны сенден ууру<sup>1<\/sup> да, алдамчы да тартып алалбайт. (Ж. <i>Баласагын.)<\/i> 2. Билимге көңүлдү байлаба, өмүрүндү байла. 3. Билимден өткөн күч жок. Билимдүү адам гана эч качан жеңилбейт. 4. Дененин ыракаты – ден соолук. Акылдын ыракаты – билимдүүлүк. (Мак.)"},{"t":"p","h":"<b>97.<\/b> Сүйлөмдүн грамматикалык негизин түзгөн сүйлөм мүчөлөрүн тапкыла. Ал мүчөлөр кайсылар? Текстте ээ катышпаган сүйлөм барбы?"},{"t":"p","h":"<span class=\"pg\" data-n=\"54\">54<\/span>Боз кыроо. Атакандын айылы бүгүн бака-шака. Обочороок үч ак өргөө тигилген. Коңшу айылдын келин-кыздары<sup>2<\/sup>, кемпирчалдары Атакандын айылына убап-чубап келип жатышты."},{"t":"p","h":"Аңгыча тойго Токтогул да келди<sup>4<\/sup>. Элге эрмек болуп отурган Майлыбай күүсүн эки-үч ирет чертти да, Токтогулга сунду. Токтогул Майлыбайдын күүсүн таптак аткарды."},{"t":"p","h":"<b>98.<\/b> Берилген сөздөрдү ээнин маанисинде колдонуп, ар бирине бирден сүйлөм түзгүлө. Төмөнкүдөй тартип боюнча ээге мүнөздөмө бергиле: а) кандай суроого жооп берди; б) түзүлүшү кандай; в) кайсы сөз түркүмүнөн болду?"},{"t":"p","h":"Кашкадарыя, Ата Журт, Өзбекстан Республикасы, кыргыз тили, ат сыйлаган, Өзбекстан Улуттук университети, мекенди коргоо, Таалайбек экөөбүз, ачык ооз, төө куш."},{"t":"p","h":"<b>99.<\/b> Окугула. Сүйлөмдүн ээсин көрсөткүлө. Сүйлөмдө дайым эле ээнин катышып турушу зарылбы? Эгерде ээ катышпай калса, аны кантип билүүгө болот?"},{"t":"p","h":"Күн чыкты, түш да болду, түңүлүп да калдык. Эми эмне кылабыз. Майсалбек менен жолугушпай калабызбы? Аттарга деген чөптөр да түгөнүп баратат… Айылга кайра кетүүгө да чыдабайбыз."},{"t":"p","h":"Алиман экөөбүз темир жолчуларга жардамдашып жаттык. Жолдун ортосундагы карды күрөк менен тазалап жүрөбүз. Мен уулума жолуктур деп кудайга жалбарам….. Ушул учурда чыгыш тараптан поезддин кыйкырганы угулду. Мына ал көрүнүп да калды. Поезд станциядан өтө берди. Ошол учурда «Апаа-аа», «Алимаан-аан» деген үн угула түштү. Карасам, уулум Майсалбек тумагын булгалап жатыптыр. Ошентип, мен Майсалбегиме жолукпай калдым."},{"t":"p","h":"<b>100.<\/b> Көчүрүп жазгыла. Сүйлөмдүн баш мүчөлөрүнүн астын сызгыла. Ээнин түзүлүшүн, кайсы сөз түркүмүнөн экенин жана баяндооч менен кандайча байланышканын түшүндүргүлө."},{"t":"p","h":"1. Билим алуу ийне менен кудук казгандай. 2. Билими күчтүү миңди жыгат, билеги күчтүү бирди жыгат. 3. Билимдүү миңди көрсө, билимсиз бирди көрөт. 4. Жакшы кыз – жакадагы кундуз, жакшы жигит – көктөгү жылдыз. 5. Атаны сыйлаган абийир табат, энени сыйлаган элге жагат. (Мак.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"55\">55<\/span><b>101.<\/b> Ар бир сүйлөмдөгү <b>эмне?<\/b> деген суроого жооп берген сөздү өз ара салыштыргыла. Алар сүйлөмдүн кайсы мүчөлөрү? Айырмачылыгын түшүндүргүлө."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>1. Жайлоого <i>кино<\/i> келди.<\/td><td>Биз <i>кино<\/i> көрдүк.<\/td><\/tr><tr><td>2. Конокторго <i>сыйлык<\/i> берилди.<\/td><td>Ардагерлер <i>сыйлык<\/i> алышты.<\/td><\/tr><tr><td>3. <i>Кой<\/i> биздин байлыгыбыз.<\/td><td>Менин атам <i>кой<\/i> багат.<\/td><\/tr><tr><td>4. Сенде кадимкидей <i>күч-кубат<\/i> бар.<\/td><td>Азыр <i>күч-кубатты<\/i> эл үчүн жумшайлы.<\/td><\/tr><tr><td>5. Чарбада <i>гүл<\/i> өстүрүлөт.<\/td><td>Окуучулар <i>гүл<\/i> алып келишти.<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>102.<\/b> Адегенде сүйлөмдүн ээсин таап, ал кайсы сөз түркүмүнөн экендигин аныктагыла. Андан кийин ээни башка сөз менен алмаштырып кайра түзгүлө. Алардын айырмасы эмнеде?"},{"t":"p","h":"1. Спортчулардын мыктылары медаль алышты. 2. Алар айылга баруу үчүн машинага отурушту. 3. Тогуз экиге бөлүнбөйт. 4. Эч ким жыйналыштан кечиккен жок. 5. Анын күжүрмөн жигит экендиги дароо эле билинди."},{"t":"p","h":"Үлгү: <i>Спортчулардын мыктылары медаль алышты. – Мыктылары –ээ,<\/i> зат атооч. – <i>Мыкты спортчулар медаль алышты.<\/i> – Кимдер? –спортчулар <i>–<\/i> ээ, зат атооч. Кандай спортчулар? – <i>мыкты<\/i> аныктооч."}],"sub":[{"title":"19-§. ЭЭ, АНЫН МИЛДЕТИН АТКАРУУЧУ СӨЗ ТҮРКҮМДӨРҮ","b":1}],"pages":[52,55]},{"title":"20-§. Ээнин түзүлүшү","blocks":[{"t":"h3","h":"20-§. ЭЭНИН ТҮЗҮЛҮШҮ"},{"t":"p","h":"Сүйлөмдүн ээси өзүнүн түзүлүшү боюнча жөнөкөй жана тутумдаш болот. Жөнөкөй ээ бир гана сөздөн, тутумдаш ээ бир нече сөздүн тизмегинен түзүлөт."},{"t":"p","h":"Мисалы. 1. <b><i>Китеп<\/i><\/b> <i>– билимдин булагы.<\/i> 2. <b><i>Ат<\/i> <i>аяган<\/i><\/b> <i>жер<\/i> <i>карайт.<\/i>"},{"t":"p","h":"Тутумдаш ээ төмөнкүдөй сөздөрдүн тизмегинен түзүлөт."},{"t":"p","h":"а) Маани берүүчү сөздөрдөн: <b><i>Билими<\/i> <i>күчтүү<\/i><\/b> <i>миңди<\/i> <i>жыгат,<\/i> <b><i>билеги<\/i> <i>күчтүү<\/i><\/b> <i>бирди жыгат. (Мак).<\/i>"},{"t":"p","h":"б) Маани берүүчү сөз менен кызматчы сөздөн: <b><i>Бактыбек<\/i> <i>да<\/i><\/b> <i>Ферганадан келди.<\/i>"},{"t":"p","h":"в) Туруктуу сөз тизмегинен (фразеология): <b><i>Колунан<\/i><\/b> <b><i>көөр<\/i> <i>төгүлгөндөр<\/i><\/b> <i>келишти.<\/i>"},{"t":"p","h":"<span class=\"pg\" data-n=\"56\">56<\/span>Тутумдаш ээлер: <i>билими күчтүү<\/i> (билими – зат атооч, күчтүү – сын атооч); <i>Бактыбек да (Бактыбек<\/i> – зат атооч, да – бөлүкчө); <i>колунан көөр төгүлгөндөр<\/i> (фразеология – зат атооч)."},{"t":"p","h":"Ээ менен баяндоочтун ортосунда ээрчишүү байланышы бар."},{"t":"p","h":"<b>103.<\/b> Көчүрүп жазып, баш мүчөлөрдүн астын сызгыла. Алар кайсы сөз түркүмүнөн болушту? Ээнин грамматикалык түзүлүшү кандай? Ээ менен ээрчишкен сөз сүйлөмдүн кайсы мүчөсү?"},{"t":"p","h":"1. Өзөнгө элим консочу, өмүр өчпөс болсочу. (Т.) 2. Кечээ аба ырайы жакшы болгон эле. 3. Жапар айылга башкарма болгондон кийин, эмгекти уюштуруу тез эле жолго коюлду. Эгин оруу да жакшы уюшулду. (Т.С.) 3. Жакшы менен жүргөн жарыйт, жаман менен<sup>3<\/sup> жүргөн карыйт. Карынын сөзү кеп болот, калайыкка эп болот. Ачык ооздор турмуштан өз орундарын таба алышпайт. (Мак.)"},{"t":"p","h":"<b>104.<\/b> Ээни тапкыла, ага мүнөздөмө бергиле: а) кандай суроого жооп берет; б) кайсы жөндөмөдө; в) кайсы сөз түркүмүнөн; г) түзүлүшү; д) баяндооч менен кандайча байланышты?"},{"t":"p","h":"1. Данияр<sup>1<\/sup> экөөбүз эс алып жүрөбүз. («А») 2. Ат сыйлаган жөө калбайт. 3. Ташкент – менин туулуп өскөн жерим. 4. Жамила болсо сөзмөр кыз эле. 5. Беш өрдөгүн учургандар келе жатышат. («КТ»)"},{"t":"p","h":"Үлгү: <i>Жакшы эл камын ойлойт.<\/i> (Мак.) Ким? – <i>жакшы —<\/i> ээ; атооч жөндөмөсүндө; заттык мааниде колдонулган сын атооч; жөнөкөй, баяндооч менен жак жана сан боюнча (III жак, жекелик сан) ээрчишти."},{"t":"p","h":"<b>105.<\/b> Төмөнкү сөздөрдү ээнин маанисинде колдонуп, ар бирине бирден сүйлөм түзгүлө. Төмөнкүдөй тартип боюнча ээге мүнөздөмө бергиле; а) кандай суроого жооп берди? б) кайсы жөндөмөдө? в) түзүлүшү кандай? г) кайсы сөз түркүмүнөн болду?"},{"t":"p","h":"Жызак Мамлекеттик педагогика университети, Ата Мекен, темир жол, алп кара куш, кабыл алуу, жыйырма, Суусамырда, кара кылды как жаргандар, жакшы келе жаткан."},{"t":"p","h":"<b>106.<\/b> Көчүргүлө. Сүйлөм мүчөлөрү боюнча талдоо жүргүзүп, сүйлөмдүн түзүлүшүн өз ара салыштыргыла. Адегенде ээлик милдетти аткарган сөз экинчи учурда сүйлөмдүн кайсы мүчөсү болду? Эмне үчүн мындай? Түшүндүргүлө."},{"t":"raw","h":"<div class=\"tbl\"><span class=\"pg\" data-n=\"57\">57<\/span><table><tr><td>1. Куш аяган<sup>1<\/sup> көк карайт.<\/td><td>– Куш аяган адам көк карайт.<\/td><\/tr><tr><td>2. Таптаган билет шумкарды.<\/td><td>– Таптаган адам билет шумкарды.<\/td><\/tr><tr><td>3. Чапкан билет тулпарды.<\/td><td>– Чапкан адам билет тулпарды.<\/td><\/tr><tr><td>4. Жыгылган оогонго күлөт.<\/td><td>– Жыгылган адам оогонго күлөт.<\/td><\/tr><tr><td>5. Эл сыйлаган эшикке жатпайт.<\/td><td>– Эл сыйлаган<sup>2<\/sup> адам эшикке жатпайт. (Мак.)<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>107.<\/b> Окугула. Ээни таап, анын түзүлүшүн аныктагыла; жөнөкөйбү, тутумдашпы, бир өңчөйбү, фразеологиялык айкашпы? Ээ кайсы сөз түркүмүнөн болду?"},{"t":"p","h":"1. Комуз, кыяк, чоор – кыргыз элинин музыкалык аспаптары. Комуз менен кыргыз элинин өмүрлүккө өчпөс күүлөрү чертилип келет. 2. Эне тилим – эне сүтүм. 3. Улуу<sup>1<\/sup> тоого чыккан барбы? Улар үнүн уккан барбы? 4. Тилден бал да тамат, уу да тамат. 5. Кайгысы жок кара сууга семирет. (Мак.)"},{"t":"v","l":["6. Өрдөк, чүрөк, ак куулар,","Көлдүн бетин бербеген.","Бир көргөн киши дегдеген,","Куштун жери – Ала-Тоо.","(Т.М.)"]},{"t":"p","h":"7. Ата сөзүн уккандар, албетте, ийгиликке жетишет<sup>4<\/sup>. 8. Алты саныбыз аман, ар иш колубуздан келет («ФС»)"},{"t":"p","h":"<b>108.<\/b> Ээнин түзүлүшүнө көңүл бургула. Алардын ар бирине экиден сүйлөм ойлоп таап, жазып келгиле. Ээге мүнөздүү белгилерди атагыла."},{"t":"img","src":"data:image/webp;base64,UklGRmgdAABXRUJQVlA4INQGAAAQKgCdASrZAIYAPrVUpU0nJKOiKfFJwOAWiU3cLbgbmwvQfnyocN533xm/0665+xnuA/gH+A6C/9jvcB/Hv8z6gP5R/kv3Y9//0O//rp/93I/dT4VP3h/bn24uv/6bfop+gHjk1re8PVIw+PnDxB97XzRyk0L/a98n+qHsBern0b15piP/zpq9P9U аткаруучу сөз түркүмдөрү","blocks":[{"t":"h3","h":"21-§. БАЯНДООЧ, АНЫН МИЛДЕТИН АТКАРУУЧУ СӨЗ ТҮРКҮМДӨРҮ"},{"t":"box","h":"<b>Баяндооч— сүйлөмдүн баш мүчөсү, ээ менен байланышып, анын кыймыл-аракетин, ал-абалын билдирет.<\/b> Эмне кылды? эмне кылып жатат? эмне кылат? ким? эмне? кандай? ж.б. суроолорго жооп берет."},{"t":"p","h":"<span class=\"pg\" data-n=\"58\">58<\/span>Мисалы: 1. <i>Теректин<\/i> <b><i>жалбырактары<\/i> <i>дирилдеди.<\/i><\/b> 2. <b><i>Ысык-Көл<\/i><\/b> <i>кышында<\/i> <b><i>жылуу.<\/i><\/b> Жалбырактары эмне болду? <i>– дирилдеди<\/i> – баяндооч, заттын кыймыл-аракетин билдирди. Ысык-Көл кандай? – <i>жылуу<\/i> баяндооч, заттын ал-абалы көрсөтүлдү."},{"t":"p","h":"Баяндооч ээ менен бирдикте сүйлөмдү уюштурат. Кээде ээ айтылбай калса да, сүйлөм баяндооч аркылуу түзүлө берет: <i>Чеченсинген жигитти сүйлөшкөндө көрөбүз.<\/i> (Мак.)"},{"t":"p","h":"Ошентип, сүйлөмдүн грамматикалык негизин түзүүчү баш мүчөлөрдүн бири баяндооч болуп эсептелет."},{"t":"p","h":"Баяндоочтун милдетин төмөнкү сөздөр аткарат:"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td><b>№<\/b><\/td><td><b>Сөз түркүмдөрү<\/b><\/td><td><b>Мисалдар<\/b><\/td><td><b>Суроолор<\/b><\/td><\/tr><tr><td>1<\/td><td>Зат атооч<\/td><td><i>Өмүрдүн кубанычы – эмгек.<\/i><\/td><td>эмне? – <i>эмгек<\/i><\/td><\/tr><tr><td>2<\/td><td>Сын атооч<\/td><td><i>Тянь-Шань кышта жылуу,<\/i> <i>жайда салкын (М.А.)<\/i><\/td><td>кандай? – <i>жылуу<\/i><br>кандай? – <i>салкын<\/i><\/td><\/tr><tr><td>3<\/td><td>Сан атооч<\/td><td><i>Анын жашы жыйырма<\/i> <i>бештерде.<\/i><\/td><td>канчада? – <i>жыйырма беште<\/i><\/td><\/tr><tr><td>4<\/td><td>Ат атооч<\/td><td><i>Бул баланын атасы да –<\/i> <i>мен? энеси да мен (Ч.А.)<\/i><\/td><td>ким? – <i>мен<\/i><br>ким? – <i>мен<\/i><\/td><\/tr><tr><td>5<\/td><td>Этиш<\/td><td><i>Өзүңдү өзүң мактаба.<\/i><\/td><td><i>эмне кылба? – мактаба<\/i><\/td><\/tr><tr><td>6<\/td><td>Тактооч<\/td><td><i>Биздин айыл дагы жогору.<\/i><\/td><td>кандай? – <i>дагы жогору<\/i><\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>109.<\/b> Көчүрүп жазып, сүйлөм ээсин жана баяндоочун тапкыла. Баяндоочтун милдетин кайсы сөз түркүмү аткаргандыгын айтып бергиле."},{"t":"v","l":["1. Адам иштеген ишинен таанылат.","2. Бөтөн гүлдүн жыты болбойт.","3. Эненин көөнү– балада, баланын көөнү– талаада.","4. Мекендин топурагы – алтын.","5. Мээримдүү жүрөк картайбайт.","6. Сөздүн көркү – макалда. Билимдүүнүн көзү төртөө."]},{"t":"p","h":"<b>110.<\/b> Сүйлөмдүн грамматикалык негизин тапкыла. Баяндооч кандай суроого жооп берди? Кайсы сөз түркүмүнөн болду? Этиш сөздөрдүн чагын аныктагыла."},{"t":"p","h":"1. Бурулча күндөгүсүнөн эрте турду<sup>4<\/sup>. Ушул мезгилде күн уясынан<sup>2<\/sup> чыгып келе жатат. Бир маалда Айша да ойгонду. Алар көпкө чейин кобурашып олтурушту. Тойчубек бүгүн районго барат. (К.Б.)"},{"t":"v","l":["<span class=\"pg\" data-n=\"59\">59<\/span>2. Жеримдин<sup>2<\/sup> суусу – дары, таштары – алтын,","Жыргалда, эркиндикте жашайт калкым. (А.О.)"]},{"t":"p","h":"<b>111.<\/b> Көчүргүлө. Баш мүчөлөрдүн астын сызгыла. Алардын милдетин кайсы сөз түркүмү аткарды? Кандай суроого жооп берди? Баяндооч ээ менен кандайча байланышты?"},{"t":"h3","h":"ЭЛ КАЗЫНАСЫНАН"},{"t":"p","h":"1. Акылдуунун сөзү кыска, айта келсе нуска. 2. Элиң сага<sup>2<\/sup> кол сунса, эриш-аркак тирек бол. 3. Ойлоп сүйлөгөн алкыш алар, ойлобой сүйлөгөн шылдыңга калар. 4. Улууну урматта, кичүүнү ызатта. 5. Эмгек – адамдын ыракаты. 6. Байлыктын ээси – жер. 7. Эрди эл өстүрөт."},{"t":"p","h":"<b>112.<\/b> Төмөнкү мисалдардан кайсынысы сөз айкашы, кайсынысы сүйлөм? Алардын айырмасын аныктагыла."},{"t":"p","h":"1. Оюн көрүү— Оюн көр + дү + к. 2. Алдыңкы окуучуларды кууп жетүү – Алдыңкы окуучуларды кууп жет + е + биз. 3. Улууларга ар дайым салам берүү – Улууларга ар дайым салам бер + е + мин. 4. Жаңылыктарды ойлоп табуу— Жаңылыктарды ойлоп табыш + а + т. 5. Кышка камылга көрүү – Кышка камылга көр + дү + ң + бү? 6) Эгин-тегин жыйноо – Эгин-тегин жыйна + й + быз."},{"t":"p","h":"<b>113.<\/b> Сүйлөмдүн баяндоочун ар кандай формага келтирип, кайра окугула. Кыймыл-аракетти бири-бирине салыштыргыла. Кандай айырмачылыкты байкадыңар?"},{"t":"p","h":"1. Мен бүгүн кызыктуу аңгеме айтып берем. 2. Данияр шахмат ойноп отурат. 3. Айгеримдин сүйлөгүсү келди. 4. Махабат китепти көп окуган."},{"t":"p","h":"Үлгү: <i>Бакыт атасына кат жаза баштады. – Бакыт атасына кат жазып отурат. – Бакыт атасына кат жазып бүттү. – Бакыт атасына кат жазып жиберди.— Бакыт атасына кат жазгысы келет<\/i> ж.б."},{"t":"p","h":"<b>114.<\/b> «Биздин өлкө – эгемендүү өлкө» деген темада сүрөттөө мүнөзүндөгү дилбаян жазгыла. Өзүңөрдүн жазуу ишиңерде кыймыл-аракетти ачык-так баяндоо үчүн этиштин ар кандай формаларын колдонууга аракеттенгиле."},{"t":"p","h":"<span class=\"pg\" data-n=\"60\">60<\/span><b>БК 108.<\/b> Текстти көркөм окуп, анын мазмунун айтып бергиле. Андан кийин ушул текст боюнча баяндама жазгыла."},{"t":"p","h":"Дүйнө ар жактан ар түрдүү болгондуктан адамдар да, элдер да ар түрдүү. Дүйнөдө ар түрдүү тайпа, улут жана элет ушуну менен бирге ар түрдүү диндүү адамдар жашайт. Кала берсе бир улут же бир калктын адамдарынын дүйнө таануусу инсандык касиеттери да бири-биринен айырмаланат. Ар бир тайпанын өзүнүн максат-мүдөөсү, кызыкчылыгы жана ишеними бар. Ошону менен бирге ар түрдүү катмардагы адамдардын жеке бир мамлекеттин эли, жеке бир коомдун мүчөлөрү катарында бириктирип турган жалпы улуттук максат-мүдөөлөр, кызыкчылыктар да бар. Булар, улуту, тили, дини жана жалпы өзбекстандыктар үчүн жеке Мекен болгон, аларды бойго жеткирген, каалоо-тилектерине канат берген, ата-бабаларыбыздын мекени болгон бул ыйык Мекендин өнүгүшү, тынчтыгы менен байланыштуу болгон жалпы максаты жана кызыкчылыгы болуп саналат. Мамлекетибиздин бардык жарандары ушул максат жолунда колду-колго берип аракет кылат, учураган тоскоолдук жана кыйынчылыктарды биргеликте жеңип, жетишкен ийгиликтеринен биргеликте кубанат. Социалдык демөөрчүлүк идеясы ушул бирдикти күчөйтүүгө, жалпы максат жолунда бирдиктүү эл болуп аракет кылууга кызмат кылат."}],"sub":[{"title":"ЭЛ КАЗЫНАСЫНАН","b":13}],"pages":[57,60]},{"title":"22-§. Баяндоочтун түзүлүшү","blocks":[{"t":"h3","h":"22-§. БАЯНДООЧТУН ТҮЗҮЛҮШҮ"},{"t":"p","h":"Грамматикалык түзүлүш боюнча баяндооч жөнөкөй жана тутумдаш болот. Жөнөкөйү бир гана сөздөн, тутумдаш баяндооч бир нече сөздөн түзүлөт: 1. <i>Биз эртеси да районго<\/i> <b><i>бардык.<\/i><\/b> 2. <i>Чөп чабуу<\/i> <b><i>башталган<\/i> <i>мезгил.<\/i><\/b> Баяндоочтор: <i>бардык (жөнөкөй) башталган мезгил<\/i> (тутумдаш)."},{"t":"p","h":"Тутумдаш баяндооч төмөнкүдөй сөздөрдүн тизмегинен түзүлөт:"},{"t":"p","h":"а) Маани берүүчү сөздөрдөн: <i>Биз чалгынчылык ишинде<\/i> <b><i>кызмат<\/i> <i>кылабыз.<\/i><\/b> Эмне кылабыз? <i>кызмат кылабыз<\/i> – тутумдаш баяндооч."},{"t":"p","h":"<span class=\"pg\" data-n=\"61\">61<\/span>б) Маани берүүчү жана кызматчы сөздөрдөн: <i>Бал тилдүү баатыр<\/i> <b><i>мен<\/i> <i>элем,<\/i><\/b> <i>бала баатыр<\/i> <b><i>сен<\/i> <i>элең.<\/i><\/b> («Эр Табылды») Ким? – <i>мен элем, сен элең<\/i> – тутумдаш баяндоочтор."},{"t":"p","h":"в) Туруктуу сөз тизмегинен (фразеология): <i>Жакшынын сөзү ташка тамга баскандай.<\/i> (Мак.) Кандай? – <i>ташка тамга баскандай<\/i> – тутумдаш баяндооч, фразеология."},{"t":"p","h":"Тутумдаш баяндооч атооч менен этиштин жана этиш менен этиштин айкашынан жасалат. Мисалы: 1. <i>Апамдын айткан сөзүнө<\/i> <b><i>капа<\/i> <i>болбо.<\/i><\/b> 2. <i>Алар биздикине<\/i> <b><i>келип-кетип<\/i> <i>жүрүштү.<\/i><\/b> Баяндоочтор: <i>капа болбо<\/i> (зат атооч + этиш), <i>келип-кетип жүрүштү<\/i> (этиш + этиш)."},{"t":"p","h":"<b>109.<\/b> Окугула. Суроо бергиле, баяндоочту тапкыла, анын түзүлүшү кандай? Кайсы сөз түркүмүнөн болду?"},{"t":"p","h":"1. Уят – өлүмдөн катуу<sup>3<\/sup>. Ырыскыны жер берет, ынтымакты эл сүйөт. Коркокко бир ок да көп, баатырга жүз ок да аз<sup>3<\/sup>. Көз – коркок, кол – баатыр<sup>3<\/sup>. Дүнүйө үчүн өзүндү отко салба. Бирөөнүкүн күч менен тартып алба. (Мак.)"},{"t":"p","h":"2. Дал ошол учурда Чолпонбай чыгыш жакты карады. Алда кайдан Ала-Тоо карап тургансыйт. Калдайган кыргыз эли, талкала жоону дегендей, кол булгагансыйт. «Душманга баш ийбеген баатырлардын тукуму – мен», – деп көз ачып жумганча Чолпонбай дзоттун оозун жүрөгү менен басты. (К.Ж.)"},{"t":"p","h":"<b>110.<\/b> Текстти окуп, баш мүчөлөрдү тапкыла. Алар кайсы сөз түркүмүнөн болушту? Баяндоочтун түзүлүшү кандай?"},{"t":"p","h":"1. Эгер мен кат таанысам, сенин катыңды окубайт белем. 2. Улук болсоң, кичик бол, бийик болсоң, жапыс бол. 3. Тоют көп болсо, мал кыштан семиз чыгат. 4. Күрөк кайда болсо, баштык ошондо. 6. Акылдуунун сөзү кыска, айта салса нуска. 6. Жакшы болуп бар болсоң, кимдер келбейт кашыңа. 7. Жаркырап алтын чолпонум, Семетейим келсе экен. 8. Салмактуу сөздөн айтайлык, аман-эсен кайтайлык. 9. Көптөн бери эңсеген, көргөй элем элимди. 10. Эртең менен кырманга жөнөйлүк."},{"t":"p","h":"<span class=\"pg\" data-n=\"62\">62<\/span><b>111.<\/b> Баш мүчөлөргө төмөнкүдөй тартип боюнча талдоо жүргүзгүлө: а) кандай суроого жооп берди? б) түзүлүшү кандай? в) алардын милдетин кайсы сөз түркүмү аткарды? г) бири-бири менен кандайча байланышты?"},{"t":"v","l":["1. Аты<sup>2<\/sup> Манас болсун деп,","Бата кылды баарысы:","Жашы менен карысы. («Манас»)"]},{"t":"p","h":"2. Мына ошондо Найман эне уулун<sup>2<\/sup> эсине келтирейин деди. Сенин атың – Жоламан, Уктуңбу? Сен Жоламансың. Мен сенин энеңмин. Уулу унчуккан жок. (Ч.А.) 3. Сарандардын миңинен жалгыз да болсо, март жакшы. (Калыгул.) 4. Күн жарыгы тийгендей, күлгөнү кызык баланын. (Ж.)"},{"t":"p","h":"<b>112.<\/b> Берилген сөздөрдү жана сөз айкаштарын баяндоочтун маанисинде колдонуп, сүйлөм түзгүлө. Өзүңөр түзгөн сүйлөмгө сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө, алардын милдетин кайсы сөз түркүмү аткарды?"},{"t":"p","h":"Жылдыз жерге түшүү, назары сынуу, окуп отуруу, Алай тоолору, жакшы, жоош, жыйырма беш, ушул жер, чоңураак, жатык болуу, айыпка жыгуу, жардамдашуу."}],"sub":[],"pages":[60,62]},{"title":"23-§. Баяндоочтун түрлөрү","blocks":[{"t":"h3","h":"23-§. БАЯНДООЧТУН ТҮРЛӨРҮ"},{"t":"p","h":"Баяндоочтун милдетин кайсы сөз түркүмү аткаргандыгына байланыштуу, ал экиге бөлүнөт: 1) этиштик баяндооч; 2) атоочтук баяндооч."},{"t":"p","h":"Сүйлөмдө баяндооч этиш сөздөрдөн болсо, ал этиштик баяндооч деп аталат."},{"t":"p","h":"Мисалы: <i>Кылыч жарасы<\/i> <b><i>бүтөт,<\/i><\/b> <i>тил жарасы<\/i> <b><i>бүтпөйт.<\/i><\/b> (Мак.)"},{"t":"p","h":"Сүйлөмдө баяндооч, атооч сөздөрдөн (зат атооч, сын атооч, ат атооч ж.б.) болсо, атоочтук баяндооч деп аталат."},{"t":"p","h":"Мисалы: <i>Өнөр алды —<\/i> <b><i>кызыл<\/i> <i>тил.<\/i><\/b> Баяндооч – <i>кызыл<\/i> <i>тил;<\/i> зат атооч. <i>Биздин республика<\/i> <b><i>тоолуу.<\/i><\/b> Баяндооч – <i>тоолуу;<\/i> сын атооч."},{"t":"p","h":"<b>113.<\/b> Көчүрүп жазгыла. Баш мүчөлөрдүн астын сызгыла. Баяндооч кайсы сөз түркүмүнөн болду? Баяндооч ээ менен кандайча байланышты?"},{"t":"p","h":"1. Акылы бар билимди самайт. Акылы жок кийимди самайт. Жалкоонун шылтоосу көп. Узун тил уудан жаман. Базар барга таттуу, жокко ачуу. (Мак.) 2. Түн суук. Кыш <span class=\"pg\" data-n=\"63\">63<\/span>ышкырат, үйлөрдү ачып. (А.О.) 3. Бир маалда көзүмдү ачтым. Айлана көзгө сайса көрүнгүс. Бүт айлана мемирейт. («КМ»)"},{"t":"p","h":"<b>114.<\/b> Окугула. Баяндоочту таап, анын түзүлүшүн жана түрлөрүн (этиштик, атоочтук) аныктагыла."},{"t":"p","h":"Өткөн менен бүгүнкүлөр түбүндө киндиктеш. Эл ичи ар кыл өнөргө, оозеки чыгармаларга, тилдик кенчтерге бай.(Ж.М.)"},{"t":"p","h":"Бир акылман айткан экен:"},{"t":"p","h":"– Денеге тамактын зарылдыгы кандай болсо, жүрөккө эстүүлүктүн зарылдыгы да ошончолук. («З.ой.»)"},{"t":"p","h":"Санабай туруп түгөл дебе. (Мак.) Кичинекей станциянын күүгүм бүлбүлдөгөн жападан жалгыз фонарына шамал айдаган жалбырактар урунуп, жан-жанынан учуп өтүшөт да, караңгыда көздөн кайым болушат. Бул түнү теректер жалбырак күбүп жатты (.Ч.А.)"},{"t":"p","h":"<b>115.<\/b> Көчүрүп жазгыла. Сүйлөмдүн баш мүчөлөрүнүн астын сызып, аларга мүнөздөмө бергиле: а) кайсы сөз түркүмүнөн болду? б) түзүлүшү кандай? в) баш мүчөлөрдөн гана түзүлгөн сүйлөм кандайча аталат?"},{"t":"p","h":"1. Жакшы сөз – жарым ырыс. Ал адамдын ички дүйнөсүн тазартат. 2. Тил – рухий улуу байлык. Тилди үйрөнүү – ошол рухий байлыкка ээ болуу деген сөз. 3. Жакшыга жакшы жанашып, жашаган жакшы турбайбы. 4. Ата Мекен биз үчүн бардыгынан кымбат, анткени ошол жерде төрөлгөнбүз, ошол жерде өсүп-өнгөнбүз. («ЭТ»)"},{"t":"p","h":"<b>116.<\/b> Схемага көңүл бургула, ал боюнча сүйлөмдүн баяндоочу жөнүндө айтып бергиле. Мисал келтиргиле."},{"t":"img","src":"data:image/webp;base64,UklGRjAeAABXRUJQVlA4IJwHAADQLgCdASoJAYUAPrVUn0unJSKhrZXocOAWiU3fj5MU2/5v9ie340zhrdA/i9t79pvcB+eulx/ZPUP/Mf9t6gP51/ev3Y9/30P//Lp//UA5+P/q/6T4W/3H/cv25ev/6cdtrWtLrdofYM/Pf1p8QfgzJt/M+w2xTzAvW765+vPv/zJv//T/6eaqjp+0LC8+pENfGqTT/SQTymZy+ijjje9AVtnGzITqaq4C0CCEDfaIsIWkn6V5jVXJCxGbEStXA4++Nm933T+DrMnLJN8whfRTsO8odz85iIcR3Uk6i3MmWKqAFVEVPgejVxBjCbN4akIbZa63BSvSrYw0O8LvHBu4xy2iKsllNnjizXrVaUBByOOry2C1I/1H8lCBcOxPj5hjdbc/oq7LPeJQ54Cb+cq/9dQ9aSsTSZuOWx+lL6k1sWMhB5DiNwjs02mju+BXSIbfknRIVdMeWCQpk5F08JuiuBLfArpETi7LP58z5HVAoL41qRka+NUrpENgIr7RgAD+/q3QCWhjtW1EB1O12AiZbes7vBRZtjtO16OKC7fIRdj2yLf/HaXqfVYhKzGO5I5g3aznwI/Rp6b8ZrvXAz18VWOm21w6uq7jozGnopD59m9naY6nvnjQzfnVMLPqA22Of6uNfqCzdCdcayhZ2KMZlyGMLrt4Iq16kOmOQcVOcogQbL2OjkjPaSxlpDPQd1qaQSPJwJTWrHGw8zJwtwyAK1FNhdD+De76zkZUfOiQXOnE3UpjF0+FxQchuJBZPU7Gk9Shq1AtuH09fjwmi57NApqx/IIQdvdarcnqMCdtUNjGq+YMxa8np9Ej6HkxtphkQePBi+vr6zzJH7HnM/aWKaa3tYRd5QDJJ/SjLReZrn8w+I/NZcnawe2Q7lLj5LXHfVZqh8HFMMKXtGz2MsV3AIVl13guoyNYTE3X3LLMEuzygDxyhZIaEJc+9UYHBTAVhzJZiaXp9rVrcrxYRK8jaQBg0ykKG3YckODwdagV+hWet2XkL8oYie+bBj/B/0pk2uLbNSZFhynchPhdKEw2F6av3E3lRb4nZGMSFveJVQnIdYwyfdoAOz6OucQXf2A4UpQvlPjmWDIY9PaiUmUUi9Mooz8tSCiOFO1bwMNB+sy8VfPBbrpCoJ6z32UazVBTyWIXZ8rJj4X6N61QsXDfwHRIH1f6gpZS/CitPjJMs+tIPFXmTuJckBJclmgslYjDdbB9BPV7myz4si/ygHJ7D5S/OE/O/Do5ynUJkUWFRUOkM9h5uuYY+JvH7FkEEy5kdBIr4V2UxNv8BKMeF5GwbhPR6O7HFBLzfV6AoNTuiVwNLeUE/gg94gf5ih4UYomRTb21CP2naSgv5ppHd2/msOvskacTJJJYTUfyfuSk16XgOfiL9VfMkuz/CZ1V7vrtPv

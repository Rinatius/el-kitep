AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPZYQEwUBs9U7xDxnHNSqp9bgFqxD6TmeBSotXiWRdKEsk5Dc0ydVq62fA2Vj2UqtxNKdUuIgB06Zm11gRoLhojcJ+UA","w":640,"ht":82},{"t":"v","l":["а — е, о, ө","ы — и, у, ү"]},{"t":"p","h":"Үлгү: <i>Бала + га = балага, эне + га = энеге, тоо + га = тоого, көл + га = көлгө.<\/i>"}],"sub":[{"title":"ӨЗБЕКСТАНДЫН КЕН БАЙЛЫКТАРЫ","b":3},{"title":"КЫМЫЗ КҮЧҮҢӨ КҮЧ КОШОТ","b":12},{"title":"АКЫЛ КАРАЧАЧТЫН ЖООБУ","b":15}],"pages":[5,6]},{"title":"2-§. Сөздүн курамы жана сөз жасоо","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"7\">7<\/span>2-§. СӨЗДҮН КУРАМЫ ЖАНА СӨЗ ЖАСОО"},{"t":"box","h":"<b>Сөздүн курамын (уңгу, мүчө) жана сөз жасоонун жолдорун үйрөтүүчү тил илиминин бир бөлүгү сөз жасоо деп аталат.<\/b>"},{"t":"p","h":"<b>7.<\/b> Көчүрүп жазып, сүйлөмдүн тутумундагы сөздөрдү уңгу, мүчөгө ажыраткыла. Сөз кандай бөлүктөрдөн турат? Сөз жасоочу жана сөз өзгөртүүчү мүчөлөрдүн айырмасы эмнеде? Мисал келтиргиле."},{"t":"h3","h":"ЭЛДИК КАЗЫНАДАН"},{"t":"p","h":"1. Жети элдин тилин бил, жети түрлүү билим бил. 2. Тилден бал да тамат, уу да тамат. 3. Атанын уулу<sup>1<\/sup> болуш – кымбат<sup>4<\/sup>. 4. Билим – өнөр, өмүргө<sup>3<\/sup> суудай керек. 5. Малчы малы көбөйгөн сайын кубанат. 6. Жай жакшы болсо, эл эгиндүү болот."},{"t":"p","h":"<b>8.<\/b> Төмөнкү сөздөрдүн уңгусун тапкыла. Андан кандай жаңы маанидеги сөз жасалды? Атоочтон атооч жана атоочтон этиш жасоочу мүчөлөргө мисал келтиргиле. Сөз жасоонун кандай жолдорун билесиңер?"},{"t":"p","h":"1. Билим, басма, сызгыч, камчыла, токойлуу, баатырларча, эжеке, балалуу, сырдаш, уйкучул, сүткор, достош, оймок, сулуулук, басым, иймек."},{"t":"p","h":"2. Кызмат акы, ага-тууган, бака жалбырак, өнөр жай, оюн-күлкү, окуу жылы, төө куйрук, көз сал, жазып отурат, алп каракуш, темир жол."},{"t":"p","h":"<b>9.<\/b> Өзүңөр бир сөз ойлоп таап, ага сунуш кылган мүчөлөрдү улап, жаңы маанидеги сөз жасагыла. Мурдагы сөздү жаңы маанидеги сөз менен салыштыргыла. Алардын айырмачылыгы эмнеде?"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>– ла<\/td><td>– дай<\/td><td>– ча<\/td><\/tr><tr><td>– ма<\/td><td>– лык<\/td><td>– чыл<\/td><\/tr><tr><td>– чы<\/td><td>– луу<\/td><td>– мак<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"Үлгү: <i>Ий + мак = иймек.<\/i>"},{"t":"p","h":"<b>10.<\/b> Көчүрүп жазгыла. Сүйлөмдүн тутумундагы сөздөргө сөздүн курамы жана сөз түркүмү боюнча талдоо жүргүзгүлө."},{"t":"v","l":["1. Билим алсаң, урмат-сый алып келет,","Билим сага акыл-ой, кубат берет.","<span class=\"pg\" data-n=\"8\">8<\/span>Билимсиз жүрөк, тилдин пайдасы жок,","Билим – өнөр, өмүргө суудай керек."]},{"t":"p","h":"2. <i>Муну билип ал.<\/i> «Мамлекетибиздин символдору – туу, герб жана гимн Өзбекстан элдеринин шан-шөөкөтүн, сыймыгын, тарыхый эскерүүсүн жана умтулууларын өзүндө чагылдырат. Мына ушул символдорду урматтоо – өзүнүн кадыр-баркын, мамлекетине жана өзүнө болгон ишенимин чыңдоо дегени болуп саналат. Өзүнүн мамлекети менен сыймыктана турган инсан көп нерселерге жөндөмдүү болуп эсептелет»<sup>1<\/sup>."},{"t":"p","h":"<b>11.<\/b> Адегенде көчүрүп жазгыла. Кара тамга менен басылган сөздөрдү уңгу жана мүчөлөргө ажыраткыла."},{"t":"p","h":"Ар бир инсан өз <b>дооруна милдеттүү.<\/b> Кайсы <b>доордо<\/b> жашабайлы, <b>улуттук тарыхты,<\/b> рухий <b>маданиятты, салтты, мурасты<\/b> унутпоого тийишпиз, аларды <b>ардактоо, сактоо, үйрөнүү<\/b> жана изилдөө керек. Дил, тил, оозеки мурас, ырым-жырым, <b>акылмандык<\/b> бардык доордо болуп келген. Өлкө <b>буларсыз<\/b> өнүкпөйт. Ар адам кайда иштебесин, кайда жүрбөсүн улуттук рухий <b>кутту, маданиятты<\/b> сыйлап, асырап албаса, <b>салтын<\/b> сактабаса, адегенде жеке өзүнө зыян жана жалпы <b>элдик<\/b> ырыскы <b>оброюна залалы<\/b> тиет. <i>(К.Жусупов)<\/i>"}],"sub":[{"title":"ЭЛДИК КАЗЫНАДАН","b":3}],"pages":[7,8]},{"title":"3-§. Лексика жана фразеология","blocks":[{"t":"h3","h":"3-§. ЛЕКСИКА ЖАНА ФРАЗЕОЛОГИЯ"},{"t":"box","h":"<b>Сөз катмарларын, анын маанисин үйрөтүүчү тил илиминин бир бөлүгү лексикология деп аталат.<\/b><br>Фразеология туруктуу сөз тизмегин үйрөтөт."},{"t":"p","h":"<b>12.<\/b> Төмөнкү синонимдердин маанилерин айтып бергиле жана аларды катыштырып сүйлөм түзгүлө."},{"t":"p","h":"Муң – чер – кайгы – капа – бук – санаа, мурунку – илгерки, кенже – кичүү, ири – чоң, аз – кем. асыл – кымбат, түс – өң – чырай – жүз, чайка – чайпа, иш – жумуш, ур – сок, шак – бутак."},{"t":"p","h":"<b>13.<\/b> Сүйлөмдөрдү окуп, <b>көз<\/b> деген сөздүн кандай мааниде колдонулганын айтып бергиле."},{"t":"p","h":"<span class=\"pg\" data-n=\"9\">9<\/span>1. Аны ызаа – күйүт бууду, <b>көзүнөн<\/b> жашы сыгылды. (К.Ж) 2. Ийненин <b>көзүн<\/b> баамдай албай учукту улам оозуна сала берди. 3.Терезенин <b>көзүнө<\/b> эски – уску чүпүрөктү тыгындап салган. 4. Мына, айланайын, куржундун эски <b>көзүн<\/b> толтура буудай алып келдик. <i>(К.Ж.)<\/i> 5. Анын эсине кызыл <b>көз<\/b> шакек түштү. 6. Асманды булут каптап, күндүн <b>көзүн<\/b> калкалады. 7. Кулпунун <b>көзүн<\/b> таппай убараландым <i>(Ж.М.)<\/i>"},{"t":"p","h":"<b>14.<\/b> Текстти окугула. Кара тамга менен жазылган сөздөрдүн лексикалык жана грамматикалык маанилерин аныктагыла."},{"t":"v","l":["Тил чоң <b>мурас<\/b> аталардан балага,","Өз тилиңе эч <b>кайдыгер<\/b> караба.","Өзгө тилди үйрөнө бер. А бирок,","Тилиң – дилиң бизде болсун, <b>садага.<\/b>","","Тилиң – <b>тарых,<\/b> тилиң – <b>күзгү<\/b> дилиңе,","Кимдигиңе тилиң <b>күбө<\/b> ириде.","Өз тилиңди кадыр тутуп, туу тутуп,","Өтүүң <b>парз<\/b> бул дүйнөдө тирүүдө.","","Ушул тилде <b>баба<\/b> Манас сүйлөгөн,","<b>Баар<\/b> издебейм башка тилде сүйлөөдөн.","Өз элимден, өз тилимден сүйкүмдүү,","<b>Касиетти<\/b> көрө албаймын дүйнөдөн. <i>(Ү. А.)<\/i>"]},{"t":"p","h":"<b>15.<\/b> Окугула. Фразеологиялык түрмөктөрдү (туруктуу сөз тизмектерин) көрсөткүлө. Алардын лексикалык маанисин чечмелеп айтып бергиле. Фразеология жөнүндө эмне билесиңер, мисал келтиргиле."},{"t":"p","h":"1. Түн бою кирпик какпай таң атырды. (Ч.А.) 2. Жар түбүндө жаткан буурасын көрүп, Казангаптын жанына баткан экен, түнөрүп келип, Эдигейге мурду менен бир тийди. (Ч.А.) 3. Мунун баарын маңдай тер, таман акыңардан табылган акчаңарга сатып алдыңар да. (З.С.) 4. Жоомарт адамдын колу ачык, жылдызы жарык эмеспи. (А.Т.) 5. Кай-кай жерде биздин Ысакка окшогон чолоктор калбаса, мурду менен тынып, буту менен баскандардын баары майданга кетишпедиби. (К. <i>Жус.)<\/i>"},{"t":"p","h":"<span class=\"pg\" data-n=\"10\">10<\/span><b>16.<\/b> Төмөнкү туруктуу сөз тизмектерин (фразеология) катыштырып, сүйлөм түзгүлө. Алардын лексикалык маанисин түшүндүргүлө, алар биздин тилибизде кандай мааниде колдонулат?"},{"t":"p","h":"Акесин таанытуу, ак жүрөк, ташка тамга баскандай, кара кылды как жарган, беш өрдөгүн учуруу, жел өпкө, кабагы бүркөө, каш-кабактын ортосунда."},{"t":"p","h":"<b>17.<\/b> Кашаанын ичиндеги сөздөрдү фразеологиялык айкаш менен алмаштырып, сүйлөмдөрдү көчүргүлө. Туруктуу сөз тизмеги эмне үчүн колдонулат? Алар сөз түркүмүнө жана сүйлөм мүчөлөрүнө кандайча ажыратылат?"},{"t":"p","h":"1. Кимдин ким экени Жылдызканга (түшүнүктүү) болду. (К.Б.) 2. (Бир заматта) эр Бакайдын жанына чаап чыгып барышты<sup>4<\/sup>. («Манас»). 3. Кана, карыялар, (жакшы сөз айтып) менин суроомо жооп бергиле. («КТ») 4. Жамийла да бирөөгө (алдатып жибербей), айтышканы менен айтыша турган. (Ч.А.) 5. (Сөзгө устат), жез тандай, кайраным Током, аманбы? (Т.)"}],"sub":[],"pages":[8,10]},{"title":"4-§. Морфология","blocks":[{"t":"h3","h":"4-§. МОРФОЛОГИЯ"},{"t":"box","h":"<b>Морфология – сөз формаларын, сөз түркүмдөрүн жана алардын грамматикалык маанилерин үйрөтүүчү тил илиминин бир бөлүгү.<\/b>"},{"t":"p","h":"<b>18.<\/b> Эстегиле, маани берүүчү жана кызматчы сөз түркүмдөрүнө кайсылар кирет? Тексттен аларга мисал келтиргиле. Тексттеги сырдык сөздөрдү көрсөткүлө, алар кандай мааниде колдонулду? Тыныш белгисин түшүндүргүлө."},{"t":"p","h":"1. Өзбекстандын жеринин жаратылышы абдан кооз. Анын тоо – токойлору, талаалары четтен келген адамды таң калтырбай койбойт. Чокуларын ак кар баскан кереметтүү тоолордон агып түшкөн сууларыбыз – булардын баары жерибиздин, элибиздин байлыгы. Тоо – токойлорубузда өскөн түркүн чөптөр да дары – дармектик касиетке ээ. Биздин тоолорубузда байыртадан дарылыгы болгон мумиянын да көп экендиги белгилүү."},{"t":"p","h":"2. – Опе-ей. Булар эмне? – деп чекесинен терин сүртүнө энтиге дем алып, үн катты.(Ч.А.) 3. Ош –ош, малдан башкачасың го, оңбогур.(Ж.Аш.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"11\">11<\/span><b>19.<\/b> Окугула. Заттык мааниде колдонулган сын атоочту тапкыла. Ал сүйлөмдүн кайсы мүчөсүнүн милдетин аткарды? Сын атоочко тиешелүү белгилерди атагыла."},{"t":"p","h":"1. Жакшы<sup>1<\/sup> келди дегенче, жарык келди десеңчи. Жакшылыктын жарыгын алып келди десеңчи. 2. Жакшы киши өлбөсүн, жамандыкты<sup>2<\/sup> көрбөсүн. 3. Жакшыны сыйласаң, эсинен кетпейт; жаманды сыйласаң, эшигиңден кетпейт. 4. Жакшылык унутулбас. Жакшынын<sup>2<\/sup> жаты болбойт, жамандын уяты болбойт. Жакшынын жакшылыгын<sup>2<\/sup> айт, атагы ашсын. (Мак.)"},{"t":"p","h":"<b>20.<\/b> Окугула. Сөз түркүмдөрү боюнча талдоо жүргүзгүлө."},{"t":"p","h":"1. Өзбекстандын тоолорунда айбандар көп. Тоолордо: кийик, тоо эчки, илбирс, теке, карышкыр, түлкү ж.б. кезигет. 2. Керишке минсе кебелбейт, чалгынга минсе чарчабайт, баш салып чөптү чайнабайт. (С.К.) 3. Айдын он беши жарык, он беши караңгы. (М.)"},{"t":"p","h":"<b>21.<\/b> Кызматчы сөздөрдү тапкыла. Алар сүйлөмдө кандай мааниде колдонулат? Маани берүүчү сөз түркүмүнөн кандайча айырмаланат?"},{"t":"p","h":"1. Ардактуу балдарым! Өнөр үйрөнгүлө, анткени мал-дүйнөгө кепилдик, ишенич жок жана алтын, күмүш сапарда кооптуу болуп эсептелет. Аны каракчы тоноп кетет же ээси жеп-ичип бүтүрөт. Бирок өнөр кайнар булак, бүтпөс дүйнө болуп саналат. Эгерде кол өнөрчү дүйнөсүнөн айрылса, кайгысы жок. Анткени өнөрдүн өзү дөөлөт. Кол өнөрчү кай жерге барса бааланат, сыйланат жана үйдүн төрүнөн орун ээлейт. Ал эми өнөрү жок адам дайыма кыйынчылык көрөт, кайырчылык кылат. (Саади <i>Шеразий.)<\/i>"},{"t":"p","h":"2. Албетте, ар бир кесиптин, өнөрдүн өзүнө жараша кыйынчылыктары жана ыракаты бар. Анын кыйынчылыгын тынымсыз изденүү, сабыр–такаат менен жеңген адам гана ыракатын тата алат. Жаштыкта терең өздөштүрүлгөн өнөр, эмгектин тажрыйбасы инсандын өмүрүнүн акырына чейин жыргалчылыкта жашоосунун кепили болот."}],"sub":[],"pages":[10,11]},{"title":"5-§. Кыргыз адабий тилинин жергиликтүү диалектилер менен карым-катышы","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"12\">12<\/span>5-§. КЫРГЫЗ АДАБИЙ ТИЛИНИН ЖЕРГИЛИКТҮҮ ДИАЛЕКТИЛЕР МЕНЕН КАРЫМ-КАТЫШЫ"},{"t":"p","h":"Адабий тил дегенибиз – улуттук тилдин өсүп, өнүккөн жогорку баскычы. Ал элдик тилдин негизинде түзүлөт. Мында сөздөрдүн айтылышы менен жазылышы, грамматикалык формалар иретке келтирилип, тиешелүү нормага салынат. Тактап айтканда, бир эрежеге баш ийип, жалпы элдин баарына бирдей түшүнүктүү болот. Ошондуктан жазууда да, оозеки сүйлөөдө да адабий тилдин нормасын сактоо талап кылынат."},{"t":"p","h":"Адабий тилдин оозеки жана жазма түрү бар. Оозеки түрү окуу жайларында, радиоберүү жана телекөрсөтүүлөрдө, театрларда, үй-бүлөдө, коомдук ишканаларда жана башкаларда, ал эми жазма түрү басма сөздөрдө, илим менен техникада, мамлекеттик иштерде колдонулат."},{"t":"p","h":"Коомдун, маданияттын, техника менен илимдин өнүгүшү адабий тилди жогорку баскычка көтөрүп, анын калыптанышына шарт түзүп турат."},{"t":"p","h":"Диалект – бул өзүнчө өзгөчөлүктөргө ээ болгон жергиликтүү элдин тилинде учураган сөздөр. Мындай сөздөр элдин турмуш-тиричилигине, үрп-адатына, мал чарбачылыгына, дыйканчылыгына ж.б. байланыштуу колдонулат. Мисалы: <i>бал, чака, ширеңке<\/i> деген адабий тилдеги сөздөр Кыргызстандын түштүк райондорунда <i>асел, челек, күкүрт<\/i> маанисинде пайдаланылат. Булар – жергиликтүү элдин тилинде учураган диалектилер. Диалектилик айырмалар тилдин тыбыштык түзүлүшүндө да (допу – адабий тилде – <i>топу),<\/i> грамматикасында да (келиң <i>– келиңиз),<\/i> лексикасында да (чертмек <i>– комуз)<\/i> учурай берет."},{"t":"p","h":"Диалектилик сөздөр көркөм чыгармаларда кеңири колдонулат. Мындай сөздөрдүн ичинен жалпы эл үчүн түшүнүктүү болгондору адабий тилдин лексикасын толуктайт. Мисалы, Кыргызстандын түштүк диалектидеги <i>пахта, пахтакер, чигит<\/i> сыяктуу сөздөр адабий тилибизде кеңири колдонулууда."},{"t":"p","h":"<span class=\"pg\" data-n=\"13\">13<\/span>Бирок жергиликтүү диалектилер тар чөйрөдө колдонулуп, жалпы элге бирдей түшүнүктүү болбойт, ошондуктан адабий тилде аларга кеңири орун берилбейт. Ошондой эле диалектилик сөздүн ыксыз колдонулушу адабий тилдин нормасы, анын эрежелерин тактоого жолтоолук кылат."},{"t":"p","h":"Бүгүнкү күндө кыргыз адабий тили өзүнүн ички жана тышкы каражаттарын кеңири пайдалануу аркылуу өнүгүп жатат. Алсак, ал калыптанган орфографияга ээ. Илимий иш жүргүзүүнүн, жаштарга билим жана тарбия берүүнүн, дүйнөлүк классикалык чыгармаларды кылдат которуунун тили болуп калды."},{"t":"p","h":"<b>44.<\/b> Окугула. Диалектилик сөздөрдү таап, алар адабий тилдеги кайсы сөздүн ордуна колдонулганын байкагыла. Диалектилик кандай сөздөрдү билесиңер?"},{"t":"p","h":"I"},{"t":"p","h":"1. Аары багып көбөйтүп, гүл сордуруп, бал алган. (Т.) 2. Чайга салган аселден кеселге жардам болдубу? («Саринжи-Бөкөй») 3. Жалындуу илебине чыдай албай, жалбарып маңдайынан өбөр элем. (А.Т.) 4. Пешенеден нур жанып, беттеринен кан тамган. (Ж.Б.) 5. Ал ным тартып калган ширеңкени күйгүзө албай: – Күкүртүң барбы, берчи? – деп сурап калды. 6. Муну комуз дейбиз, чертмек да дейбиз. Бул атам замандан бери чертилип келе жатат. (Т.К.)"},{"t":"p","h":"II"},{"t":"p","h":"Гүлайым деген кыз экөөбүз бирге турабыз. Көп учурда анын осол, пайдубал, шиңгил деген сөздөрүн түшүнбөйм. Агайдан сурасак, мындайча түшүндүрдү: «Гүлайым, сен ушул сөздөрдү билбешиң мүмкүн, анткени мындай сөздөр түштүктүн диалектисинде колдонулат. Ал эми диалектилик сөздөр адабий тилди байытат». (К.Боб.)"}],"sub":[],"pages":[12,13]},{"title":"6-§. Текст","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"14\">14<\/span>БАЙЛАНЫШТУУ КЕП"},{"t":"h3","h":"6-§. ТЕКСТ"},{"t":"box","h":"<b>Текст – бул ички мааниси жана грамматикалык түзүлүшү боюнча байланышкан бир нече сүйлөмдөр тобу.<\/b> Көлөмү, темасы жана түзүлүшү боюнча тексттер ар кандай болот."},{"t":"p","h":"Кээ бир текст баяндоо, экинчиси салыштырмалуу, үчүнчүсү ой жүгүртүү түрүндө болушу мүмкүн."},{"t":"p","h":"Текстти түзүп турган сүйлөмдөр өз ара тизмектешип айтылып, биринин маанисин экинчиси улантат. Мындай учурда мурдагы сүйлөмдөгү зат атоочтун ордуна же ат атооч, же ошол сөздүн өзү кайталанып колдонулат. Мисалы: <i>Дүйшөн бизди мектепке ээрчитип чыкты. Ал сүйлөбөй келе жатты.<\/i> (Ч.А.)"},{"t":"p","h":"Мында биринчи сүйлөмдөгү <i>Дүйшөндүн<\/i> ордуна экинчисине ал деген ат атооч колдонулду."},{"t":"p","h":"Тексттеги сүйлөмдөрдү байланыштырууга байламталар, ар кандай мүчөлөр ж.б. тилдик каражаттар колдонулат."},{"t":"p","h":"<b>БК 22.<\/b> Тексттердин мазмуну менен таанышып, аны өз сөзүңөр менен кайра айтып бергиле. Мында кептин кайсы түрү (баяндоо, сүрөттөө, ой жүгүртүү) колдонулду? Тексттеги сүйлөмдөр кандайча байланышты? Негизги ой эмне жөнүндө болду?"},{"t":"h3","h":"МЕКЕН"},{"t":"p","h":"Бугу эне балдарын Ысык-Көлгө жеткирди. Көлдүн баш-аягына көз жетпейт. Этегинен күн чыкса, төрүндө али таң ата элек. Тегерете курчалган Ала-Тоо чокусуна сан жеткис."},{"t":"p","h":"– Мына, ушул жер силерге Мекен болот, – деди мүйүздүү Бугу эне. – Жер тилип, эгин эккиле; мал багып, балык уулагыла. Учуңар узарып, урук-тукумуңар көбөйсүн."},{"t":"p","h":"Сүйлөсө тилге жатык, укса кулакка мукам алыстан ала келген эне тилиңерди укум-тукумуңар унутпасын, эне тилинде эл-жерин даңазалап ырдап жүрсүн. Кишиден кем болбогула, башка элге тең болгула. Мен эми силерге, силердин укум-тукумуңарга Умай энемин. Силер менен түбөлүк бирге жүрөм... (Ч.А.)"},{"t":"h3","h":"<span class=\"pg\" data-n=\"15\">15<\/span>МАНАС"},{"t":"v","l":["Кирпиги – жалын, көзү— чок,","Кишиден мындай шумдук жок.","Кара чаар кабылан,","Капталында чамынган.","","Асман менен жериңдин,","Тирөөсүнөн бүткөндөй.","Алтын менен күмүштүн,","Ширөөсүнөн бүткөндөй.","<i>(«Манас».)<\/i>"]},{"t":"h3","h":"ЖОГОРКУ РУХАНИЯТ – ЖЕҢИЛГИС КҮЧ"},{"t":"p","h":"Өзбекстан Республикасынын биринчи Президенти И.А. Каримовдун «Руханият – адам баласынын эресеге жетишинин жана күч-кудуретинин булагы» деп аталган биринчи главасында руханият түшүнүгүнүн маани-маңызы, анын адамдын жана коомдун ишкердигинде көрүнүшү, ар бир элдин, улуттун жана жеке адамдын жашоосу менен шайкеш экендиги жөнүндө ой жүгүртүлөт. Автор руханиятты калыптандыруучу негизги фактор болуп саналган руханий мурастын, маданий байлыктардын, көөнө тарыхый эстеликтердин орду жана мааниси жөнүндө кененирээк сөз кылат."},{"t":"p","h":"Ошондой эле бул главада адам жана коомдун өнүгүшүнүн эң маанилүү фактору – руханий жана материалдык турмуштун бир бүтүндүгү, бул принциптердин бирин-бири төгүнгө чыгарбастыгы, тескерисинче, бирин-бири толукташы жана алардын өлкөдө саясий, социалдык, экономикалык туруктуулуктун жана өнүгүүнүн бекем кепили түрүндө кызмат кылышы сыяктуу маселелерге өзгөчө көңүл бурулган."},{"t":"p","h":"<b>БК 23.<\/b> Текстти талдагыла: анын темасын, андагы негизги ойду жана тилдик каражаттарды аныктагыла. Тексттин маанилик бүтүндүгү дегенди кандай түшүнөсүңөр?"},{"t":"h3","h":"УЛУУГА УРМАТ"},{"t":"p","h":"Жыл өткөн сайын жаштардын кулк-мүнөзү өзгөрүп бараткансыйт. Ушуга байланыштуу силерге өзүм күбө болгон бир окуя жөнүндө айтып берейин."},{"t":"p","h":"Кычыраган кыш. Талант экөөбүз айылдан Ташкент шаарына карай сапар тартып баратканбыз."},{"t":"p","h":"Биз менен кошо алтымышка аяк басып калган эне автобуска түштү. Эл көп, орун жок. Алды жакта бир жаш келин эки жаштагы баласы менен отуруптур. Эне келинге кайрылды: <span class=\"pg\" data-n=\"16\">16<\/span>«Кызым, балаңды алдыңа алып, ары жылып койчу?» Ал орун бошотуп бермек турсун, бакылдап сүйлөп энени жемелеп кирди..."},{"t":"p","h":"Атаганат, касиеттүү карыларды сыйлап, ийиле салам айткан ата-бабаларыбыздын салтын унутпасак! Кыргыз элинде: «Улууларга урмат, кичүүлөргө сый», – деген накыл сөз бар."},{"t":"p","h":"<b>24.<\/b> Баяндоо мүнөзүндө болгон чакан дилбаян жазып келгиле. Дилбаян үчүн төмөнкү темалардын бирин пайдалангыла: «Адептүүлүк – адам көркү», «Менин айылым», «Жайлоодон келатканда»."},{"t":"p","h":"<b>БК 25.<\/b> Текстти орунсуз кайталоодон арылтып жазгыла.Тексттин атын атагыла."},{"t":"p","h":"Мектептерде жолдо жүрүүнүн эрежелери боюнча атайын сабактар өткөрүлөт. Балдар жолдо жүрүүнүн белгилерин окуп үйрөнүшүүдө. Жолдо жүрүүнүн эрежелерин үйрөнүү анча деле татаал эмес. Бирок ал эрежелерди туура жана так аткарганда гана биз бардыгыбыз жол коопсуздугун болтурбай коюуга салым кошкон болобуз. Жолдо жүрүүнүн эрежелерин бузгандарга аёосуз күрөш ачуу. кымбаттуу окуучу, сенин жана бардыгыбыздын милдетибиз."},{"t":"p","h":"<b>26.<\/b> Текстти окуп, андагы негизги ойду таап, тема койгула."},{"t":"p","h":"Өзбекстан Республикасынын мамлекеттик герби төмөнкү көрүнүшкө ээ: тоолор, дарыялар жана сол жагында болсо ачылган гозонун бутактарынан турган алкакка оролгон гүлдөгөн өрөөнгө күн алтын нурларын чачып турат. Гербдин жогору жагында Республика эркиндигинин символу иретинде сегиз бурчтук берилген болуп, анын ички бөлүгүндө жарым ай менен жылдыз сүрөттөлгөн. Гербдин борборунда бакыт жана эркиндиктин символу – канаттарын жазган Зымырык кушу сүрөттөлгөн. Гербдин төмөнкү жагында Өзбекстан Республикасынын Мамлекеттик туусун туюнткан алкак тасмасында «O‘zbekiston» деп жазып коюлган."},{"t":"p","h":"Өзбекстан Республикасы Мамлекеттик гербинин түстүү көрүнүшүндө: Зымырык кушу менен дарыялар – күмүш түстө; күн, башактар, пахта жана «O‘zbekiston» жазуусу – алтын түстө; гозонун бутактары менен жалбырактары, тоолор <span class=\"pg\" data-n=\"17\">17<\/span>жана өрөөн – жашыл түстө; пахта – ак түстө; тасма – Өзбекстан Республикасы Мамлекеттик туусунун түстөрүн чагылдырган үч түстө: сегиз бурчтук – алтын түс менен курчалган көгүлтүр түстө: жарым ай менен жылдыздар – ак түстө сүрөттөлгөн."}],"sub":[{"title":"6-§. ТЕКСТ","b":1},{"title":"МЕКЕН","b":8},{"title":"МАНАС","b":12},{"title":"ЖОГОРКУ РУХАНИЯТ – ЖЕҢИЛГИС КҮЧ","b":14},{"title":"УЛУУГА УРМАТ","b":18}],"pages":[14,17]},{"title":"7-§. Тексттин байланыштуулугу","blocks":[{"t":"h3","h":"7-§. ТЕКСТТИН БАЙЛАНЫШТУУЛУГУ"},{"t":"p","h":"Текстте сүйлөмдөр өз ара эки түрдүү байланышат:"},{"t":"p","h":"<b>1. Уланма байланыш.<\/b> Мында сүйлөмдөр лексикалык кайталоолор, синоним, антоним сөздөрдүн жардамы аркасында жана ат атоочтор аркылуу тизмектешип, мурунку сүйлөмдө айтылган ой кийинки сүйлөмдөрдө толукталып, өркүндөп турат."},{"t":"v","l":["Байланышуунун бул түрүнүн схемасы:","1 → 2 → 3 → 4 ж.б."]},{"t":"p","h":"Өз кыялында Авалбек атасы менен өрт жалынды аралап, салгылашууда жүргөнсүп жатты. Немецтин танкалары кара түтүнгө чулганып, каз тамандары быркырап, эки көзү оюлган дөөдөй албууттанып ордунан жылбай калганда энесинин алдында олтурган бала кубанганынан тыбырчылап туйлап жатты. Ал эми биздин замбирекчилер жарылган снаряддардын сыныгы тийип жыгылганда, бала боюн жыйып, томсоруп калып отурду."},{"t":"p","h":"Мында 3 сүйлөм бар. Биринчи сүйлөм экинчи менен энчилүү зат атооч (Авалбек) жана жалпы зат атооч (бала) ээлик милдетин аткарып турган кырдаалда синонимдик катышта (Авалбек, бала) байланышты. Ал эми үчүнчү сүйлөмдүн ээси (бала) болсо өзүнөн мурунку сүйлөмдүн ээси менен лексикалык кайталоо (бала-бала) ыкмасында биринчи сүйлөмдүн ээси менен обочо байланышты түздү."},{"t":"v","l":["Схемасы Авалбек → бала → бала","1 → 2 → 3"]},{"t":"p","h":"<b>Удаалаш байланыш.<\/b> Сүйлөмдөр өз алдынча мааниге ээ болуу менен баяндоочтордун жак, сан, чак боюнча катыштык мамилелери аркылуу байланышат."},{"t":"v","l":["<span class=\"pg\" data-n=\"18\">18<\/span>Байланышуунун бул түрүнүн схемасы:","– → – 1","– → – 2","– → – 3","– → – 4 ж.б."]},{"t":"p","h":"Арабакеч текирең таскакка салды. Чыгыш жакты улам карай берди. Аттар талыкшыбай жакшы баратты. Ошол учурда шамал катуулай баштады. Булут ак туманга айланып, улам калыңдап көбөйүп, асманды бүт чулгады. Кар дегенде шыбыргактап, аңгыча болбой, бурганактап жаады. Шамал ызылдап, бороонго өттү. Карарган асман учу-кыйыры жок кар менен көз ачып жумгуча аралаша урду. (А.П.)"},{"t":"p","h":"Мында 8 сүйлөм бар. Окуя бороондун башталышынан кабар берет. Сүйлөмдөрдө этиштик баяндоочтор өткөн чакта туруп, 3-жак жекелик санда жалгануу аркылуу табият кубулушун ырааттуу баяндайт. Баяндоочтордун мындай бирдей даражада колдонулушу сүйлөмдөрдү жарыша байланыштыруунун каражаты болуп эсептелинет."},{"t":"p","h":"<b>27.<\/b> Татаал сүйлөмдүн тутумундагы жөнөкөй сүйлөмдөрдүн курулушу менен тексттеги сүйлөмдөрдүн тизмектешип келишин салыштыргыла.Булардын ортосундагы өзгөчөлүктөрдү тексттин байланышуу жолдору аркылуу далилдеп айтып бергиле."},{"t":"p","h":"Сен эми билекти түрүнүп, өз турмушуңда бурулуш жаса. Күндөлүк турмушуңдун бир калыпта кылдыраган көндүм агымын өзгөрт. Өзүңдүн жалкоолугуңа. кенебестигиңе, жандын тынчын жакшы көрүүчүлүгүңө, чечкинсиздигиңе, каршы аёосуз түрдө күрөш ач. Өзүңдү өзүң башкара билүүгө өжөрлүк менен талпынып, алдыңа бир айдындуу максат коюп, аны ишке ашырууга шымаланып кириш. (С. Байгазиев.)"},{"t":"p","h":"Ал анан Бороондуда тыным жок: аскер салган эшелондор батышка жөнөп жатты. Согуштан качып жер оогондор батыштан чыгышка өтүп жатышты. Азык-түлүк жүктөгөн эшелондор батышка, жарадарларды салган эшелондор чыгышка байма-бай каттап жатты."},{"t":"p","h":"<span class=\"pg\" data-n=\"19\">19<\/span>Турмуш калыбы капилеттен өзгөрүп, ушу эрме чөлдөгү ээн Бороондуда кадимкидей сезилди….(Ч.А.)"},{"t":"p","h":"<b>28.<\/b> Тексттерди окугула. Андагы сүйлөмдөрдүн байланышуу жолдорун аныктагыла. Уланма, удаалаш байланыштарды схема боюнча көрсөткүлө."},{"t":"p","h":"1."},{"t":"p","h":"Эх, эмнесин айтайын, кесепеттүү согуш нечендердин кендирин кыйды. Атаганат! Жайнагым аман турганда, не деген адам болор эле! Мүнөзүңдөн, кылык-жоругуңдан айланайын, балам, кайдасың? Он экиден бир гүлүң ачылбай, кай жерде жалп этип түштүң экен?"},{"t":"p","h":"О, дүнүйө, о жан жараткан жер, бир оокумга гана баламды тирилтип, бир гана жолу көлөкөсүн көрсөтүп койсоңор! (Ч.А.)"},{"t":"p","h":"2."},{"t":"h3","h":"КУРМАНЖАН ДАТКА"},{"t":"p","h":"Курманжан – душмандар менен тил табышып, кыргындуу согуштарды токтотуп, элди аман сактоого бүт айла-амалын жумшаган. Душмандар Курманжандын бир баласын жазага тартып өлтүруп, эки небересин Сибирге, түрмөгө айдашкан. Ошондо да Курманжан датка эл толкуп, согуш чыгып кетпесин деп, чыдамдуулугун көрсөткөн. Курманжан болсо. кыргыздар кыргынга түшөрүн байкап, элди тынчытып, сүйлөшүүлөрдү алып барып турган. «Датка», «Алай ханышасы», «акылман» деген сөздүн баары Курманжанга арналат. Кыргыздар мындай акылман, кыраакы адамды унутпайт. Ал «Курманжан датка» деп тарыхта айтылып калган."},{"t":"p","h":"<b>29.<\/b> Окуу китептеринен, көркөм адабияттардан уланма, удаалаш байланыштагы сүйлөмдөрдүн тизмеги боюнча текст түзгүлө."},{"t":"h3","h":"СҮЙЛӨМДӨРДҮ БАЙЛАНЫШТЫРУУНУН ТЫШКЫ ТИЛ КАРАЖАТТАРЫ"},{"t":"box","h":"<b>Тексттин тутумундагы сүйлөмдөрдү байланыштыруучу тышкы каражаттарга төмөнкүлөр кирет:<\/b>"},{"t":"p","h":"<b>Синонимдик байланышуу:<\/b> Күнүгө эртең менен мектепке келгенде көрүнөө жерге илинип коюлган энесинин <span class=\"pg\" data-n=\"20\">20<\/span>сүрөтүн көрүп сыймыктанат, кубанат. Ошол сымбаттуу көрүнгөн Каалы апа кызына:"},{"t":"p","h":"– Биз силерге ушул доорду курууга жан аябай күрөштүк, эмгектендик. Заманыңар кут болсун! – дегенсийт."},{"t":"p","h":"<b>2. Маанилеш сөздөрдү алмаштыруу аркылуу байланышуу:<\/b> Карышкыр дагы жакындап келди да, кылкан жалы түктүйүп, тулку бою тырышып, секирмекчи болуп, жерге жабыша калды. Көздөрү Султанмураттын көзүнө кадала калды. Жырткычтын көзү курчураак, заардуураак көрүндү."},{"t":"p","h":"<b>3. Сөздөрдүн кайталанып келиши:<\/b>"},{"t":"v","l":["1. Ушул тилде атам, апам сүйлөгөн,","Ушул тилде бабам Манас үндөгөн,","Ушул тилде чечип тагдыр түйүнүн,","Ушул тилде турмуш сырын үйрөнгөн.","2. Эне – ыйык, жашообуздун жарчысы,","Эне – дайра, биз булактын тамчысы.","Бешиктеги балтыр бешик баланын,","Эне – өзү жүрөгүнүн жартысы."]},{"t":"p","h":"<b>4. Антонимдик байланышуу:<\/b>"},{"t":"v","l":["Муң-кайгыны кечээ баштан кечирген,","Бүгүн эне, чыгарыпсың эсиңден.(Ж.Т.)","Келериңде дүнүйө, толукшуп чыккан айдайсың,","Кетериңде дүнүйө, суу жүрбөгөн сайдайсың.(Т.)"]},{"t":"p","h":"<b>5. Зат атоочторду ат атоочтор менен алмаштыруу аркылуу байланышуу:<\/b>"},{"t":"p","h":"Тигине, Алмакан эне бүкчүңдөп басып, тамдын текчелеринен өйдө көтөрүлүп баратат. Ал бүгүн да мурдагысындай эле үйдө тынч эс алып олтурат."},{"t":"p","h":"<b>6. Киринди сөздөр аркылуу байланышуу:<\/b>"},{"t":"p","h":"1. Албетте, Дүйшөн өзү да бул абалымды жакшы билип жатты."},{"t":"p","h":"2. Карышкырдын азуусу, бактыга жараша, кулундун алкымына зыян келтирбептир."},{"t":"p","h":"<b>7. Интонация аркылуу байланышуу:<\/b> Айылдын үстүндөгү адырда мен бала чактан бери билген эки зор <span class=\"pg\" data-n=\"21\">21<\/span>терек болор эле. Бул кош терек азыр да ошол жерде. Качан карабагын, айылга кайсы туштан келбегин кыналышкан ушул бийик теректер көзгө учурайт."},{"t":"p","h":"<b>8. Баяндоочтордун жак. сан, чак боюнча бирдей келиши аркылуу байланышы:<\/b>"},{"t":"p","h":"Ошол Жеңижок жөнүндө көрсөтүүдөн кийин Алыкулду эрксизден эске түшүрдүм. Кантсе да өнөрлүү элдин кулуну, кыргыз поэзиясынын Чолпон жылдызы болуп, жашаган заманына, көксөгөн максатына жараша «он беш жолу кайра туулуп» толкуган акынды ой саябанына чакырып, жалгыз отурдум."},{"t":"p","h":"<b>30.<\/b> Төмөнкү тексттерде сөздөрдүн кайталанып келишине жана антонимдер аркылуу байланышына көңүл бургула."},{"t":"v","l":["1. Бул ырым жүрөгүмө баткан тамга,","Бул ырым кубат болор мендей жанга.","Калдайган туман курчап жазып жатам,","Калемди жүрөктөгү малып канга.","<i>(Мезгил жана Алыкул.)<\/i>"]},{"t":"p","h":"2. Жаман адам белгиси, өз камы үчүн жүгүрөт, жакшы адам бепгиси, эл камы үчүн күйүнөт. Келериңде дүнүйө булутсуз тийген күндөйсүң, кетериңде дүнүйө булут баскан түндөйсүң. Тууганына батпаган, душманына жалынат."},{"t":"v","l":["3. Бири кургак, бири суу,","Бири ширин, бири уу.","Бири бийик, бири пас,","Бири кары, бири жаш.","Бири салкын, бири дем,","Бири ашык, бири кем.","Оң тетири бул дүйнөң….(Т.К.)","","4. Өмүр деген – жарык күн,","Өмүр деген – кара түн.","Өмүр – жандын үмүтү,","Өлүм – жандын күйүтү. <i>(Б.А.)<\/i>","","<span class=\"pg\" data-n=\"22\">22<\/span>Күн менен түн сыяктуу,","Кээде кара, кээде аппак.","Кээде турмуш уу берет,","Ачуусуна караба.","Кээде турмуш кант берет.","Таттуусуна караба. <i>(А.О.)<\/i>"]},{"t":"p","h":"<b>31.<\/b> Көчүрүп жазгыла. Текстте зат атоочтордун ат атооч менен алмаштыруу аркылуу байланышкан сүйлөмдөрдү аныктагыла жана кайсы сөз маанилеш сөз менен алмашылды. Астын сызгыла."},{"t":"p","h":"1. Кырсык айтып келбейт тура. Кара таан чегирткелер эгинге да, чөпкө да чабуул коюп киришти. Аларга каршы күрөш башталды да, эл жардамга келди. Жигиттер тез эле арык казышты да, өзөндөгү суу бурулду. Бул окуяга карыялар да, балдар катышышты. Бирок алардын аракеттери зыянкечтердин чабуулун токтото албады."},{"t":"p","h":"2. Алыкул ата-энесинен эрте ажырады. Ошол себептен ал өтө жаш кезинен эле балдар үйүндө тарбияланып, билимди мына ушул жерден алды. Анын акындык шыгы да эрте билине баштады. Он төрт жашында алгачкы ырын жазып, аны бирге окуган балдарга тааныштырды. Бирок замандаштары анын бул ырларына анча маани беришкен эмес. Бирок ал талбай эмгектенип, таланттуу акын экендигин элге далилдей алды."},{"t":"p","h":"<b>32.<\/b> Төмөнкү текстти окугула, тексттеги сүйлөмдөрдү байланыштыруучу тышкы тил каражаттарына көңүл бургула."},{"t":"h3","h":"БАЛЭЭ БАШКА КАЙДАН КЕЛЕТ?"},{"t":"p","h":"Күндөрдүн биринде Жээренче чечен жана Азиз Жаныбек вазирлери болуп ордонун ичинде отурганда Алдар Көсөө эшиктен кирип: «Ассалоом алейкум, эл жоргосу», – дейт. Алдар Көсөө отургандан кийин Алдар Көсөөгө Жээренче чечен ишарат кылып колу менен башын кагат. Алдар Көсөө колунун учу менен тилин кагат да, эшикке чыгып кетет."},{"t":"p","h":"Ал чыгып кеткенден кийин Жээренче чечен Жаныбек ханга:"},{"t":"p","h":"<span class=\"pg\" data-n=\"23\">23<\/span>«Мени эч ким сөзгө жыга алчу эмес эле, ушул кирген Көсөө жыгып кетти», – деди эле хан: «Жээренче чечен сени Көсөө кантип жыкты?» – деди."},{"t":"p","h":"– Көсөө эшиктен кирип «хан ордосу» деп салам айтты, сен «эл жоргосу» деп жооп бердиң. Андан башка эч кандай сөз болгон жок го» ,– деди."},{"t":"p","h":"Анда Жээренче чечен: «Көсөө эшиктен салам айтып кирип отурганда колум менен башымды кагып, «балээ башка кайдан келет?» деп сурадым эле. Көсөө колу менен тилин кагып, «балээ башка тилден келет», – деп жеңип кетти дептир."},{"t":"p","h":"<b>33.<\/b> Тексттеги сүйлөмдөрдүн интонация аркылуу байланышканы, андагы тыныш белгилердин колдонулушун түшүндүргүлө."},{"t":"h3","h":"ТАЛЫМ КЫЗ МЕНЕН КӨБӨКТҮН АЙТЫШКАНЫ"},{"t":"v","l":["Талым кыз:","1. – Асман жерди жаркыткан","Ачык нуру не болот?","– Эл ортосун ынтымак","Кылган нуру не болот?","– Бир ордуна кебелбей","Турган нуру не болот?","2. – Сен кимсиң?","– Мен Бугу Эне болом.","– Каалаганың эмне Бугу эне?","– Ушул эки чүрпөнү мага бер. (Ч.А.)"]},{"t":"p","h":"3. Ажар мүрзөнү көргөндө буркурап боздоп ыйлап жиберди."},{"t":"p","h":"– Жаным апа, тур! Жетим тайлактай боздоп, жетимсиреп жалгызың жаныңда отурат. Жалгызыңдын сөзүн ук, ая. Жалгызың бүгүндөн баштап ата-бабасы тааныбаган бөтөн журттун бирөөнө сатылганы жатат. Андан куткар, ал азапты көрсөтпө, койнуңа ал, ач койнуңду!... Ага канткенде барам? Кантип аны өмүрлүк жолдош кылам! (К.Б.)"},{"t":"p","h":"<b>34.<\/b> Төмөнкү тексттен киринди жана кызматчы сөздөрдү белгилегиле, сүйлөмдөрдү байланыштыруудагы алардын ролун аныктагыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"24\">24<\/span>Канаттуу куштар адам баласына көп пайда келтирет, жергебиздин көркүнө көрк кошот. Мисалы, тырмактай болгон, кичинекей мыймыт чымчыкты алып көрөлүчү."},{"t":"p","h":"Ал өтө эле кичинекей, бирок ошого карабастан бир жылдын ичинде сегиз-он миллион зыяндуу курт-кумурскаларды мойсоп коёт. Эртеден кечке чейин тынч албайт, бутактан— бутакка секирип жүргөнүн көрөсүң. Мыймыттын уясын оңой менен таба албайсың."},{"t":"p","h":"Сары ала чымчыкты ким билбейт? Анын сайраганы айылдын бул учунан тигил учуна угулат. Бул канаттуу көпөлөктөр менен тамактанып, курттардан да коркпойт."},{"t":"p","h":"Адатта, күкүк өзү уя салбайт, ошон үчүн башка бирөөлөрдүн уяларына жумурткаларын таштап кете берет. Ошентип, күкүктүн жумурткасын башка канаттуу басат да, балапан чыгарат. Күкүк – эч тойбогон канаттуу, ошондуктан дайыма курт-кумурскалар көп жерде гана жашайт.(«Ж»)"},{"t":"p","h":"<b>35.<\/b> Текстте сүйлөмдөрдү байланыштыруунун кайсы жолу колдонулду?"},{"t":"p","h":"«Амир Темурдун сарайында жети жыл жашаган атактуу тарыхчы Ибн Арабшах бабабыздын көрүнүшүн жана мүнөзүн мындайча сүрөттөйт:"},{"t":"p","h":"«Темур узун бойлуу, келбети тик, жазы маңдай, башы чоң, абдан күчтүү жана салабаттуу, ак-кызыл жүздүү, кең желкелүү, келишкен, сакалы көп, оң колу менен оң буту орулуу, эки көзү шамдай күйүп туруучу, жоон үндүү, улуулугу өзүнө жарашкан, токтоолук менен сүйлөй турган, акыйкатчыл инсан эле. Ал сырдуу караганды жана көз ишараттарын сезе турган, акылдуу, сынчыл, ар кандай ишараттан сак киши болуп, келип чыгышы мүмкүн болгон бардык ишти алдын ала көрүп-билип турчу эле»."}],"sub":[{"title":"КУРМАНЖАН ДАТКА","b":20},{"title":"СҮЙЛӨМДӨРДҮ БАЙЛАНЫШТЫРУУНУН ТЫШКЫ ТИЛ КАРАЖАТТАРЫ","b":23},{"title":"БАЛЭЭ БАШКА КАЙДАН КЕЛЕТ?","b":48},{"title":"ТАЛЫМ КЫЗ МЕНЕН КӨБӨКТҮН АЙТЫШКАНЫ","b":55}],"pages":[17,24]},{"title":"8-§. Ой жүгүртүү","blocks":[{"t":"h3","h":"8-§. ОЙ ЖҮГҮРТҮҮ"},{"t":"p","h":"Тилди күндөлүк турмушубузда колдоно билсек, бул – кеп болот. Кептин үч түрү бар: <i>баяндоо, сүрөттөө, ой жүгүртүү.<\/i> Мындан мурда баяндоо жана сүрөттөө <span class=\"pg\" data-n=\"25\">25<\/span>жөнүндөгү маалыматтар менен таанышканбыз, эми ой жүгүртүүгө токтололу."},{"t":"h3","h":"ОЙ ЖҮГҮРТҮҮ"},{"t":"v","l":["– Кептин башка түрлөрүнө караганда, ой жүгүртүү татаал болот.","– Далилдерге таянуу менен оюн берүү ой жүгүртүү деп аталат."]},{"t":"h3","h":"КАМТЫЛГАН МАЗМУНУ:"},{"t":"v","l":["– Адегенде айтылуучу ойдун негизи берилет.","– Ошол ой далилдер жана мисалдар менен аныкталат.","– Акырында жыйынтык чыгарылат."]},{"t":"p","h":"<b>Мисалы:<\/b> <i>ой жүгүртүү мүнөзүндөгү төмөнкү текстке көңүл буралы.<\/i>"},{"t":"h3","h":"МУГАЛИМ БОЛГУМ КЕЛЕТ"},{"t":"p","h":"Эң ардактуу кесиптердин бири – мугалимдик. Мугалимдер балдарга «А» деген тамганы үйрөтүп, окутушат. Адамдардын бардыгы мугалимден билим алып, көп нерселерди үйрөнүшөт. Ал тургай, врачтар да, учкучтар да, соодагерлер да мугалимден окушкан. Ошондуктан мен чоңойгондо мугалим болом. Балдарга билим, тарбия берүүнү кесип кылам."},{"t":"p","h":"Бул тексттеги айтылуучу ойдун негизи – «эң ардактуу кесиптердин бири – мугалимдик» деген сүйлөмдө берилди.Андан кийин ошол ой – максат 2-3-4 – сүйлөмдөрдө далилденип, 5-6 – сүйлөмдө болсо, жыйынтык чыгарылды."},{"t":"p","h":"<b>36.<\/b> Тексттерди көркөм окугула. Адегенде айтылган ойду (тезис) тапкыла. Андан кийин ойду далилдөө үчүн колдонулган мисалдарды жана корутундуну көрсөткүлө. Текст өзүнүн темасына жооп береби? Силердин оюңар кандай?"},{"t":"h3","h":"<span class=\"pg\" data-n=\"26\">26<\/span>АТА МЕКЕНДИ СҮЙҮҮ"},{"t":"p","h":"Адам баласы жаралгандан бери анын бир нерселерге карата сүйүү сезимдери да пайда болот. Мисалы: ата-энесин сүйүү, тууган-уругун сүйүү, болочок жарын сүйүү, туулган жерин сүйүү жана башка ушул сыяктуу."},{"t":"p","h":"Ушулардын ичинен эң ыйык сүйүүлөрдүн бири бул – Ата Мекенин сүйүү. Өз Ата Мекенин сүйгөн адам өз элин да сүйө алат, анын чыныгы кадыр-баркына жеткенге татыктуу. Ата Мекен үчүн ооруп, өлүмгө да баруудан тартынбай тургандай болушу керек. Ата Мекен чындап салыштырганда, төрөгөн эне менен тең жана андан да ыйык. Энеси жок жашоого болот, ал эми Ата Мекени жок жашоого мүмкүн эмес. «Элге эр кымбат, эрге эл менен жер кымбат» дегендей ар бир патриот адамга өз Ата Мекени кымбат. Анткени, ар бир адам өз Ата Мекенинен алпештенип чоңоюп, тарбия алып, билим алып, анан чоң турмушка аттанат."},{"t":"h3","h":"УЛУТ БОЛСОМ – ТИЛИМ МЕНЕН УЛУТМУН"},{"t":"p","h":"Бир саамга дүйнө тилсиз болгонун элестетип көрөлүчү. Дүйнө кандай көрксүз, кандай керең болмок. Адамдар эң жакшы сезимдерин, каалоо-тилектерин, ой-санааларын, кайгы-капаларын бири-бирине тили менен гана жеткиликтүү түшүндүрө алат."},{"t":"p","h":"«Тилден бал да тамат, тилден уу да тамат» деген накыл сөздө айтылгандай, тил жөн эле байланышуу куралы гана эмес, тил – дилдин күзгүсү. Тил – илимдин ачкычы, тил – достуктун көпүрөсү, тил – жакшылыктын жарчысы. Тилсиз жашоо жок. Бул ойлор тууралуу ойчул, акын Жусуп Баласагын «Кут алчу билим» дастанында:"},{"t":"v","l":["«Илим менен билимге көпүрө – тил,","Көкөлөткөн адамды тили деп бил.","Тил адамды бакытка бөлөп салат,","Тил адамды шорлотот, башын алат», – деп жазган."]},{"t":"h3","h":"<span class=\"pg\" data-n=\"27\">27<\/span>ЫЙМАНДУУЛУКТУ СЕН КАНДАЙ ТҮШҮНӨСҮҢ?"},{"t":"p","h":"Ыймандуулук – адамдын эң жогорку сапаты."},{"t":"p","h":"Ушул суроого жооп издеп, курбуларым менен аңгемелештим. Көпчүлүгү ыймандуулук үй-бүлөлүк тарбиядан баштала тургандыгын айтышты. Биздин айылдагы бир карыя ыймандуулук жөнүндө мындай дечү эле: «Баланын ыймандуу болушу – ата-энеге байланыштуу. Бала жаш чырпыкка окшош, аны кайда ийсе, ошол тарапка ийилет»."},{"t":"p","h":"Ооба, тарбия көргөн балдар улууларды урматтайт, ата-энесинин айтканын эки кылбайт."},{"t":"p","h":"Адатта, биз адамдар менен саламдашууга анча деле көңүл бурбай жүрөбүз. Кээде улууларды жөөлөп өтөбүз. Муну мен ыймансыздыктын белгиси деп эсептеймин."},{"t":"p","h":"Акырында сөзүмдү мындайча бүтүргүм келет. Адамдарды сыйлай билели, аларга көңүл буралы. Кичинекей наристеден баштап ар бир адамда ыймандуулук, айкөлдүк болсо экен. («КБ»)"}],"sub":[{"title":"ОЙ ЖҮГҮРТҮҮ","b":2},{"title":"КАМТЫЛГАН МАЗМУНУ:","b":4},{"title":"МУГАЛИМ БОЛГУМ КЕЛЕТ","b":7},{"title":"АТА МЕКЕНДИ СҮЙҮҮ","b":11},{"title":"УЛУТ БОЛСОМ – ТИЛИМ МЕНЕН УЛУТМУН","b":14},{"title":"ЫЙМАНДУУЛУКТУ СЕН КАНДАЙ ТҮШҮНӨСҮҢ?","b":18}],"pages":[24,27]},{"title":"9-§. Ой жүгүртүү кебине талдоо жүргүзүү","blocks":[{"t":"h3","h":"9-§. ОЙ ЖҮГҮРТҮҮ КЕБИНЕ ТАЛДОО ЖҮРГҮЗҮҮ"},{"t":"p","h":"Тексттин бул түрүнө талдоо жүргүзгөндө төмөнкүлөр көрсөтүлүүгө тийиш:"},{"t":"v","l":["1) айтылган ой (тезис) менен анын темасынын бири-бирине шайкеш келиши;","2) ойду далилдөө үчүн колдонулган мисалдар, алардын ырааттуулугу жана жеткиликтүүлүгү;","3) тексттин ой-пикири (идеясы);","4) колдонулган тилдик каражаттар;","5) талдоо боюнча жыйынтык."]},{"t":"p","h":"<b>37.<\/b> Жогоруда көрсөтүлгөн тартип боюнча текстке талдоо жүргүзгүлө."},{"t":"p","h":"Химия өндүрүш үчүн да, кишилердин өмүрү үчүн да өтө керек."},{"t":"p","h":"Анын керектүүлүгү мына мында го деп ойлоймун. Эгерде химия илими болбосо, кишилер заттардын касиети жөнүндө эч нерсе билишпей калышар эле. Мисалы, нефтиден бензин алынарын, жер семирткичтин эмнеден жасаларын ж.б."},{"t":"p","h":"<span class=\"pg\" data-n=\"28\">28<\/span>Химиясыз кишилерди ар кандай ооруулардан сактап калууга да мүмкүн эмес. Ошентип, химия кишилердин өмүрү үчүн да керек. Деги, химия көп нерсеге пайдалуу."},{"t":"p","h":"Демек, мен өзүм үчүн эң керектүү кесипти тандап алдым, келечекте инженер-химик боломун. («КБ»)"},{"t":"p","h":"<b>БК 38.<\/b> Текстти окугула. Андагы негизги ой эмне жөнүндө болду? Ойду бекемдөө үчүн колдонулган мисалдарды көрсөткүлө. Текстке коюлган ат мазмунуна шайкеш келеби? Текст жөнүндө силердин пикириңер кандай?"},{"t":"h3","h":"ТАБИЯТТЫ КОРГОО"},{"t":"p","h":"Бул маселе XX кылымдын аягында дүйнөлүк проблемага айланып отурганын ар бир адам жүрөгү менен туюп турат. Анткени адам тагдыры менен табият тагдыры бири-биринен ажырагыс. Кийинки учурда суу булганып, жер химикаттарга ууланып, эрозияларга учурап жаткандыгы көз алдабызда болууда."},{"t":"p","h":"Чынын айтканда, кийинки учурда жашоо тиричилигибизде экология маданиятына жетише албай жатабыз. Келечек муундарыбызга жаратылышка болгон мамилесинин маданиятын көтөрмөйүнчө биз көп нерселерди жоготуп, жашообуз депрессияга учурашы мүмкүн."},{"t":"p","h":"Учурда илимий-техникалык прогресс кысымын көрсөтүп жаткан кез. Аны пайдалануунун техникасын так сактабасак көптөгөн кырсыкка учурашыбыз мүмкүн. Буга уу-химикаттарды самолёт менен чачуудан өсүмдүктөр гана эмес канаттуулар, айрым майда жаныбарлар, а түгүл адамдар да зыян тартканына күбөбүз."},{"t":"p","h":"Жаратылышты коргоо барган сайын саясий, эл аралык мааниге ээ болуп баратат. Ошондуктан экология проблемасы бир эле элдин же өлкөнүн иши эмес, бир нече мамлекеттердин биргелешип иш алып баруусун талап кылат. Алсак, Арал деңизинин маселеси буга күбө. Ага жетүүчү дарыялар кийинки мезгилдерде айыл чарба өсүмдүктөрү үчүн көп пайдаланылып, деңизге куйбай калууда. Натыйжада, деңиз улам соолуп, кургак туз чаңдары айлананы каптап, табият жабырланып, жаратылыштык катастрофа күтүлүүдө. Аны болтурбоо үчүн табияттагы тең салмактуулукту сактоо зарыл."},{"t":"p","h":"<span class=\"pg\" data-n=\"29\">29<\/span><b>БК 39.<\/b> Окугула. Негизги ойду аныктагыла. Тилдик каражаттар жөнүндө айтып бергиле. Айтылыш максаты жана грамматикалык түзүлүшү боюнча кандай сүйлөмдөр колдонулду? Текстке кандай ат коюуга болот?"},{"t":"p","h":"Бала биринчи сөздү энеден угат. Эненин сөзүн угуп, баланын тили чыгат. Бүтүндөй таалим – тарбияны бала энесинен ошол тил аркылуу алат. Силерди бул жарык дүйнөгө жаратып, бөпөлөп өстүргөн, силер үчүн өмүрүн берүүгө даяр турган эне – атаңарды урматтагыла. сыйлагыла!"},{"t":"p","h":"<i>«Балдар энциклопедиясы».<\/i>"},{"t":"p","h":"<b>БК 40.<\/b> Тексттин мазмунун окугула. Текст кептин кайсы түрүнө кирет?"},{"t":"h3","h":"ҮЧ УЛУУ ТАБЫП"},{"t":"p","h":"Бир табып катуу кесел болуп жатып калды. Анын шакирттери жыйылып, устатын дабалоого киришти. Ооруган устат аларга:"},{"t":"p","h":"– Сүйүктүү шакирттерим, мени дабалоо үчүн ашыкча азап чекпегиле. Мен түзөлүүдөн үмүт үзгөнмүн. Өлүмүм жакын калганга окшойт. Көзүм өткөндөн кийин өтө эле кокуй -налаат кыла бербегиле. Мен өз ордума үч улуу табып калтырып кетемин. Ушул зор үч табыптын кеңештерине көңүл буруп башкаларды дагы ошого моюн сундургула, – деди."},{"t":"p","h":"Шакирттердин бири:"},{"t":"p","h":"– Биздин азиз устатыбыз. Сизден кийин ордуңузда кала турган үч табып кимдер? – деп сурады. Устат көздөрүн ачты, жанындагы шакирттерине мындай деп жооп берди:"},{"t":"p","h":"– Силерге айткан зор табыптын бири – тазалык, экинчиси – тамакты кылдат менен ичүү, үчүнчүсү – дене тарбиясы. Дайыма таза абада болуу, ашыкча жебестен өз өлчөмүндө тамактануу, ичимдикти тыюу, дене мүчөлөрүнүн аракетсиз калтырбастан дене тарбия менен машыгуу – мына ушулардын бардыгы адамдын ден соолугун чыңдоочу эң улуу табып эмеспи."},{"t":"p","h":"<b>КБ 41.<\/b> Текстти окуп, планын түзгүлө. Ар бир абзацка тема койгула."},{"t":"h3","h":"ТУМАШ МЕРГЕН."},{"t":"p","h":"Илгери, илгери көгөргөн көктүн алдында, көк майсаң чөптүн үстүндө жан-жаныбарлар үркпөй, коркпой бирине-бири жанаша жашап турганда Тумаш аттуу мерген чыгыптыр."},{"t":"p","h":"<span class=\"pg\" data-n=\"30\">30<\/span>Тумаш мерген туяксыз калам деп Жаратканга жалбарып жүрүп олтуруп жалгыз уулдуу болот. Уулунун атын Карагул коёт."},{"t":"p","h":"Тумаш мерген таң аткандан түн киргенче тоо арасында мергенчилик кылчу экен. Өзү тойсо да көзү тойбоптур. Бөрүнү атып кыйратып, бөлтүрүгүн ыйлатып, түлкүнү атып кыйратып, бачкилерин ыйлатып, аюу атып кыйратып, мамалагын ыйлатып, маралды атып кыйратып, музоолорун ыйлатып, нечен мүшкүл иш кылат."},{"t":"p","h":"Байыркы өткөн заманда кийиктен миңди атканда, миңинчи аткан кийиги оңко болуп турчу дейт. Ошондон кийин мергенчи аңчылыгын койчу дейт. Эгер андай болбосо, өзү же жакын адамы майып болуп тынчу экен."},{"t":"p","h":"Көзү тойбос Тумаш мерген миңди атып, оңко тургузгандан кийин да мергенчилигин койбоптур. Ошондо кийиктин пири Кайберен адам болуп кубулуп, мергендин алдынан тороптур:"},{"t":"p","h":"– Текелерди терип аттың. эчкилерди эпсиз аттың, кана Тумаш мерген эмне кызыкка баттың? Токто, ушунчаңда! Убал-сообу кимге алардын? Энесиз калган улактын, улаксыз калган эчкинин убал-сообу кимге? Убалдан корк Тумаш! – деп кийик пири Кайберен эскертип, көздөн кайым болуптур."},{"t":"p","h":"Тумаш мергенчилигин уланта берет. Андан кийин он жолу оңко тургузган дейт. Демек, он миң жаныбарды атат. Ошондо кийик пири Кайберен чындап каарданыптыр. Адам болуп кубулуп, Тумаштын алдына тайманбай басып барыптыр."},{"t":"p","h":"Кой дегенге болбодуң. Чекесинен аз-аздан, ченеп атсаң мейли эле. Чектен чыгып кеткен соң, өз убалың өзүңө, көрүнсүн кара көзүңө. Мен деле эчки тукуму, эр болсоң мени атып ал эки кадам турайын, мергендигиң сынайын, – деп кийик пири Кайберен какайып туруп бериптир. Тумаш мерген атса, Кайберенге ок тийбейт."},{"t":"p","h":"– Жалгыз калып, кордук тартып өт. Ботосу өлгөн ингендей боздоп жүрүп өт! – деп Кайберен көздөн кайым болот."},{"t":"p","h":"<span class=\"pg\" data-n=\"31\">31<\/span>Тумаш мерген шылкыя басып келатса бадалдын түбүндө эликтин чаарчыгы жатат. Үйүмө куру барбайын – деп Тумаш чаарчыкты атат. Сүйүнүп чуркап келип караса, өз баласын атып алыптыр."},{"t":"h3","h":"КЕПТИН СТИЛДЕРИ"},{"t":"p","h":"Кыргыз адабий тилинде текст түзүүнүн ар кандай ыкмалары бар, алар кептин стилдери деп аталышат. Кептин стили жалпысынан сүйлөшүү жана китеп стили болуп эки топко бөлүнөт. Китеп стилине төмөнкүлөр кирет: <i>публицистикалык стиль, көркөм стиль, илимий стиль, официалдуу-иштиктүү стиль.<\/i>"}],"sub":[{"title":"ТАБИЯТТЫ КОРГОО","b":9},{"title":"ҮЧ УЛУУ ТАБЫП","b":18},{"title":"ТУМАШ МЕРГЕН.","b":25},{"title":"КЕПТИН СТИЛДЕРИ","b":36}],"pages":[27,31]},{"title":"10-§. Официалдуу-иштиктүү стиль","blocks":[{"t":"h3","h":"10-§. ОФИЦИАЛДУУ-ИШТИКТҮҮ СТИЛЬ"},{"t":"p","h":"Стилдин бул түрү адамдар менен мекемелердин, мекеме менен мекеменин бир-бирине жазган иш кагаздарында жана башка чөйрөлөрдө колдонулат. Аларга мына булар кирет: <i>устав, мыйзам, тактама, буйрук, ишеним кат, акт, келишим, токтом, мүнөздөмө, өмүр баян<\/i> ж.б."},{"t":"p","h":"Официалдуу-иштиктүү стилде сөздөр менен сүйлөмдөр ачык-так өз маанисинде кабыл алынып, аларды башкалар менен алмаштырууга жол берилбейт."},{"t":"p","h":"Мында коомдук-саясий сөздөр пайдаланылып, көркөм сөз каражаттары дээрлик колдонулбайт."},{"t":"p","h":"<b>42.<\/b> Официалдуу-ишиктүү стилде жазылган айрым иш кагаздарынын үлгүлөрүнө көңүл бургула жана аларды үйрөнгүлө."},{"t":"h3","h":"ТАКТАМА"},{"t":"p","h":"Берилди ушул тактама Ташкент облусу, Бөкө районунун элге билим берүү бөлүмүнө караштуу № 35 жалпы орто билим берүүчү мектебинин 8-класс окуучусу Адылов Асанга. Чындыгында бул окуучу жогоруда көрсөтүлгөн мектептин 8-классында окуйт. Тактама тийиштүү жерге көрсөтүү үчүн мектеп дирекциясы тарабынан берилди."},{"t":"v","l":["<i>Мектеп директору:<\/i>","<i>Фамилиясы жазылат жана кол коюлат. 2019-жыл. 18-сентябрь<\/i>"]},{"t":"p","h":"<span class=\"pg\" data-n=\"32\">32<\/span>Тактама – бул документ. Ал жеке адамдын үй-бүлөлүк абалын, иштеген же окуган жерин ж. б. күбөлөндүрүү үчүн берилет. Тактамада төмөнкүлөр эске алынат:"},{"t":"v","l":["а) адамдын аты-жөнү;","б) тактаманын эмне үчүн берилгендиги;","в) кайсы мекемеге көрсөтө тургандыгы."]},{"t":"h3","h":"ӨМҮР БАЯН"},{"t":"p","h":"Мында адамдар өз өмүрү жөнүндө кыскача баяндар жазышат. Өмүр баяндын көпчүлүгү документ үчүн жазылып, анда көркөм сөз каражаттары (эпитет, <i>метафора<\/i> ж.б.) колдонулбайт. Кээ бирлери адабий чыгарма түрүндө болушу мүмкүн. Мисалы, К.Акыевдин «Баскан жол» мемуардык чыгармасы ушундай мүнөзгө ээ."},{"t":"h3","h":"БАСКАН ЖОЛ"},{"t":"p","h":"Мен Жумгалдагы Карой деген жерде 1883-жылдын май айында туулган экенмин. Атабыз Акы жыгач уста болгон. Кыргыздын боз үйүнүн уук, кереге, түндүк, каалгаларын келиштирип жасачу. Көзгө атар мерген эле. Жалаң кийиктин эти менен бир айылды тамактандырган учуру болгон."},{"t":"p","h":"Ошол убактыларда беш-алтылардамын. Менден улуу агам, иним – баарыбыздын үстүбүздө үйрүп салар ыймандуу кийим жок. Мени «Акы устанын жылаңач баласы» деп коюшар эле. <i>(Калык Акыев)<\/i>"},{"t":"p","h":"<b>43.<\/b> Өзүңөрдүн өмүр баяныңарды жазууга үйрөнгүлө."},{"t":"h3","h":"СИНТАКСИС ЖАНА ПУНКТУАЦИЯ. СӨЗ АЙКАШЫ. СӨЗ АЙКАШЫНЫН ТҮРЛӨРҮ"},{"t":"p","h":"Сөздөр бири-бири менен маанилик жана грамматикалык жактан байланышып, сөз айкашын жана сүйлөмдү түзүшөт."},{"t":"p","h":"Синтаксис – грамматиканын бир бөлүгү, анда сөз айкашы, анын түрлөрү, сүйлөм мүчөлөрү жана сүйлөмдүн түрлөрү үйрөтүлөт."},{"t":"p","h":"Синтаксисти өздөштүрүү аркылуу ой-пикирди, ар кандай ички сезимдерди ачык-так түшүндүрүүгө жетише алабыз."},{"t":"p","h":"<span class=\"pg\" data-n=\"33\">33<\/span>Жазууда ой-пикирди жеткиликтүү берүүдө ар кандай тыныш белгилер колдонулат. Тыныш белгилерди колдонуу жөнүндөгү эрежелер пунктуация (латындын пунктум – «чекит» деген сөзүнөн) деп аталат."}],"sub":[{"title":"ТАКТАМА","b":5},{"title":"ӨМҮР БАЯН","b":10},{"title":"БАСКАН ЖОЛ","b":12},{"title":"СИНТАКСИС ЖАНА ПУНКТУАЦИЯ. СӨЗ АЙКАШЫ. СӨЗ АЙКАШЫНЫН ТҮРЛӨРҮ","b":16}],"pages":[31,33]},{"title":"11-§. Сөз айкашында сөздөрдүн байланышуу жолдору","blocks":[{"t":"h3","h":"11-§. СӨЗ АЙКАШЫНДА СӨЗДӨРДҮН БАЙЛАНЫШУУ ЖОЛДОРУ"},{"t":"p","h":"Сөз айкашы деп – маанилери жана грамматикалык формалары боюнча өз ара байланышкан толук маанилүү эки сөздүн айкашын айтабыз."},{"t":"p","h":"Сөз айкашы эки түгөйдөн турат. Алардын бири багыныңкы жана экинчиси багындыруучу түгөй болуп саналат. Мисалы: жаңы жоолук, мээримдүү эне, сулуу кыз, чоочун киши деген сөз айкаштарын алсак, биринчилери багыныңкы, экинчилери багындыруучу мааниге ээ экендигин көрөбүз, багыныңкы түгөй багындыруучу түгөй менен грамматикалык жана мааниси жактан байланышат."},{"t":"p","h":"Сөз айкашы багындыруучу түгөйдүн кайсы сөз түркүмүнөн экендигине карай этиштик жана атоочтук болуп экиге бөлүнөт."},{"t":"p","h":"Этиштик сөз айкашынын багындыруучу түгөйү этиш сөз болот: китеп окуу, машинага түшүү, ачык сүйлөө. Ал эми атоочтук сөз айкашынын багындыруучу түгөйү атооч сөздөрдөн болот: көпкөк асман, биздин айыл, алманын кызылы."},{"t":"p","h":"Сүйлөмдөгү сөздөр маани жактан бир-бирине тизмектешип, грамматикалык байланышта биригип келет да, сөз айкашына айланат. Алардын өз ара байланышын карап келгенде эки түрдүү."},{"t":"p","h":"1.Эркин сөз айкашы. 2. Туруктуу сөз айкашы."},{"t":"p","h":"<b>45.<\/b> Окугула. Сөз айкашындагы багындыруучу жана багыныңкы сөздөрдү тапкыла. Алар кайсы сөз түркүмүнөн болушту? Сөз айкашын этиштик жана атоочтук деп бөлүштүрүүдө кайсы сөз эске алынат?"},{"t":"p","h":"Ар бир бала, окуунун<sup>2<\/sup> мыктысы, ызгаардуу кыш, келе жаткандардын үчөө, билимге умтулуу, үйдөн алыс, машыккан <span class=\"pg\" data-n=\"34\">34<\/span>адис, жакшы сүйлөө, тынбай иштөө, экинчи көрүшүү, жарк этип күлүү, келечекке умтулуу, жайлоону көздөй баруу, окуучулардын баары<sup>1<\/sup>."},{"t":"p","h":"<b>46.<\/b> Сөз айкашы кандай сөздөрдөн түзүлөрүн, алардын орун тартибин түшүндүргүлө. Атоочтук жана этиштик сөз айкаштарынын айырмачылыгы эмнеде? Багындыруучу жана багыныңкы сөздөр кайсы сөз түркүмдөрүнөн болушту?"},{"t":"p","h":"Биринчи учурашуу, сегизинчи класс, салкын жел, бүткүл эл, айдан жарык, кесип жөнүндө сүйлөшүү, жогору көтөрүлүү, багжан-багжан сүйлөө, ата-энени сыйлоо, ушул бала, агарган кар, тестти чечүү, коргошундан<sup>2<\/sup> оор, үйдөн чоңураак, анардай кыпкызыл."},{"t":"p","h":"<b>47.<\/b> Багындыруучу сөзү зат, сын, сан жана ат атоочтордон болгон сөз айкаштарына (ар бирине төрттөн) мисал ойлоп жазгыла, атоочтук сөз айкашы жөнүндө айтып бергиле."},{"t":"p","h":"<b>48.<\/b> Төмөнкү үлгү боюнча сөз айкашын түзгүлө. Алардын түзүлүшүн жана түрлөрүн аныктагыла."},{"t":"v","l":["Сын атооч + сан атооч =","Зат атооч + зат атооч =","Сан атооч + этиш =","Зат атооч + этиш =","Зат атооч + сын атооч =","Зат атооч + этиш =","Тактооч + этиш =","Зат атооч + сын атооч ="]},{"t":"p","h":"<b>49.<\/b> Сөздөн сөз айкашын, андан сүйлөм түзгүлө. Алардын ортосундагы айырмачылыкты түшүндүргүлө."},{"t":"p","h":"Токой, биз, кызыл, сегизинчи, ар бир, бийик, жазуу, иштөө, кабыл алуу, көз байланган учур, Ысык-Көл, ат кулак, жел боо, бака жалбырак."},{"t":"p","h":"Үлгү: <i>Токой – чытырман токой – Биз чытырман токойду аралап баратабыз; же болбосо: токой – токойлуу жер – Токойлуу жерде жашайбыз.<\/i>"},{"t":"p","h":"<b>50.<\/b> Адегенде этиштик, анан атоочтук сөз айкаштарын бөлүп жазгыла."},{"t":"p","h":"Жыйырма жети жыл, эгемендүүлүккө жетишүү, түтүн булатуу, элдин ырысы, ынтымагы бар, ынтымаксыз бүлүнөт, эмгегиңди көрсөтүү, өзүнө ишенүү, атуулдук парз, жаңы <span class=\"pg\" data-n=\"35\">35<\/span>доор, республиканын калкы, бабалардын руху, туугандарга баруу, тарыхын жыйноо, санжырасын угуу, чыгармачылык өнөр, жаштарды куттуктоо, фермердик чарба, өнөр жайды жакшыртуу."},{"t":"v","l":["Үлгү: <i>Этиштик сөз айкашы:<\/i>","<i>Эгемендүүлүккө жетишүү...<\/i>","<i>Атоочтук сөз айкашы:<\/i>","<i>Жыйырма жети жыл...<\/i>","<i>фермердик чарба...<\/i>"]},{"t":"p","h":"<b>51.<\/b> <b>Күз<\/b> деген сөзгө синквейн түзүү:"},{"t":"v","l":["1. Бир сөз менен зат атооч;","2. Эки сөз менен сын атооч;","3. Үч сөз менен этиш;","4. Төрт сөз менен зат атоочко карата берилген фраза;","5. Бир сөз менен синоним.","«Күз» деген сөздөн сөз айкашын түзгүлө;","«Күз» жөнүндө макал-ылакап, табышмак айтуу;"]},{"t":"p","h":"<b>52.<\/b> Этиштик сөз айкаштарын таап, алардын ар бирине бирден сүйлөм түзгүлө. Сүйлөм түзүүдө этиш сөздүн формасы өзгөрдүбү? Кандай өзгөчөлүктү байкадыңар? Этиш сүйлөмдүн кайсы мүчөсү болду?"},{"t":"p","h":"Сапсары жүгөрү, жаанчыл күз айы, ачык-так сүйлөө, үймөк-үймөк чөп, тынчтык үчүн күрөшүү, кыйышпас достук, бийлегендердин үчөө, сабакка даярдануу, булактай тунук, максатка жетүү, ууздай сапсары, акылы айран калуу, беш өрдөгүн учуруу, ишмер жигит, ала тоодой бийик, кара чабуулга түшүү."},{"t":"p","h":"<b>53.<\/b> Төмөнкү сөздөрдөн сөз айкашын түзгүлө. Анын багындыруучу, багыныңкы түгөйлөрүн аныктагыла. Кайсы сөз түркүмүнөн жасалгандыгына көңүл бургула."},{"t":"p","h":"Бала, нан, мугалим, тоо, гүл, сабак, окуучу, китеп, дос, мектеп, максат, жомок, кызыктуу, бешөө, тез-тез, катуу, жооп берүү, сүйлөшүү, жоолук, алтын, ата-эне, бетме-бет, жайлоо, <span class=\"pg\" data-n=\"36\">36<\/span>эс алуу, филармония, концерт, достук, ойлонуу, кырман, умтулуу, эгемендүү, өнүккөн, кластер, стратегия."},{"t":"h3","h":"СӨЗ АЙКАШЫНЫН ТҮРЛӨРҮ"},{"t":"p","h":"Сөз айкашындагы сөздөр бири-бири менен төмөнкүдөй жолдор аркылуу байланышат: <b>ыкташуу, таандык байланыш, башкаруу байланыш.<\/b> Байланыштын бул түрлөрү багыныңкы байланыш деп аталат."}],"sub":[{"title":"СӨЗ АЙКАШЫНЫН ТҮРЛӨРҮ","b":26}],"pages":[33,36]},{"title":"12-§. Ыкташуу","blocks":[{"t":"h3","h":"12-§. ЫКТАШУУ"},{"t":"box","h":"<b>Ыкташуу байланышта багыныңкы түгөй багындыруучу түгөй менен эч кандай мүчөлөрсүз мааниси жактан байланышат.<\/b> Мисалы: <b>он эки<\/b> дептер, <b>кызыл<\/b> гүл, <b>балыктай<\/b> сүзүү, <b>экинчи<\/b> беттешүү."},{"t":"p","h":"Багындыруучу түгөй; <i>дептер, гүл, сүзүү, беттешүү.<\/i> Багындыруучу түгөйгө мааниси боюнча байланышкан сөздөр, <i>он эки, кызыл, балыктай, экинчи.<\/i> Мында ыкташа байланышкан сөз багындыруучу түгөйдүн маанисин толуктайт да, андан мурда келет."},{"t":"p","h":"Ыкташуу байланышы сүйлөмдө да сакталат: 1) <b>алты<\/b> китеп – сөз айкашы. 2) <b>Алты<\/b> китеп <i>сатып алдык.<\/i>"},{"t":"p","h":"<b>54.<\/b> Окугула. Багындыруучу жана багыныңкы түгөйлөрдү атагыла, алар кайсы сөз түркүмүнөн болушту? Сөз айкашындагы сөздөрдүн ортосунда байланыштын кайсы түрү бар?"},{"t":"p","h":"Таттуу алма, ишмер жигит, чукул бурулуу, үч эсе көбөйтүү, Ала-Тоолук алтоо, эрте келүү, жаркырап-жайнап отуруу, дагдаң-дагдаң басуу, күлдүрө айтуу, заңгыраган жакшынакай мектеп, аппак үй, жыйырма алты киши, ак төөнүн карды жарылган күз айы."},{"t":"p","h":"<b>55.<\/b> Көп чекиттин ордуна мааниси жагынан ылайык келүүчү сөздү ойлоп таап, сөз айкашын түзгүлө. Көчүрүп жазгыла да багындыруучу сөзгө ыкташкан сөздүн астын сызгыла. Ал кандай мааниде колдонулду? ... окуя, ... жардам, ...карыялар, ... акын, ... учурашуу, ... жооп берүү, ... суу, ... жаан, ... толкун, ...жайлоо, ... кабыл алуу, ... көздөн кайым болуу, ... чуркоо, ... жазуу."},{"t":"p","h":"<span class=\"pg\" data-n=\"37\">37<\/span><b>56.<\/b> Төмөнкү сөздөрдү багыныңкы сөздүн маанисинде пайдаланып, ыкташуу байланышындагы сөз айкашын түзгүлө. Ыкташуу деген эмне? Ал кандай мааниде колдонулат?"},{"t":"p","h":"Жакшы, алтынчы, жаркылдаган, чебер, майлуу, шайдоот, шамдагай, ысык, тоодой, көпкөк, жаңы, нөшөрлөгөн, кызыктуу, он беш, калчылдап, балдай, ойдогудай, каткырып, капкара."},{"t":"p","h":"<b>57.<\/b> Тексттерди көркөм окугула. Сүйлөмдүн тутумунда ыкташуу байланышындагы сөздөрдү көрсөткүлө. Ыкташкан сөз заттын, кыймыл-аракеттин кандай белгисин билдирди?"},{"t":"v","l":["1. <i>Жаман<sup>3<\/sup><\/i> адам белгиси","Өз камы үчүн жүгүрөт.","<i>Жакшы<\/i> адам белгиси,","Эл камы үчүн күйүнөт. (Т.)","2. <i>Мээримдүү<sup>3<\/sup>, жөнтөк аккан<\/i> Волга дайра","Үстүңдөн өткөн кезде кайра-кайра,","<i>Күмүш<\/i> түс, каракүлдөй бүйрөлөнүп,","<i>Менсинип<\/i> агар элең алда кайда. (А.Т.)"]},{"t":"p","h":"3. Намангандан Ферганага чейин жай айларында<sup>2<\/sup> аралаган адам самаганынын бардыгын көрөт: <i>ыргалган<\/i> эгиндер, <i>бийик-бийик<\/i> үйлөр, <i>короо-короо<\/i> койлор, <i>үйүр-үйүр<\/i> жылкылар, <i>тунук<\/i> булактар, <i>көйкөлгөн көк<\/i> шибер ж.б."},{"t":"p","h":"<b>58.<\/b> Окугула. Сүйлөмдөрдү бири-бирине салыштыргыла, кайсынысында заттын жана кыймыл-аракеттин белгиси ачык-айкын көрсөтүлдү, ой-пикир элестүү берилди? Мындай өзгөчөлүк эмнеге байланыштуу болду?"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>1. Ак кеме <i>каалгып<\/i> сүзүп баратты.<\/td><td>Ак кеме сүзүп баратты.<\/td><\/tr><tr><td>2. Айылдын үстүндө <i>эки<\/i> терек болор эле (Ч.А.)<\/td><td>Айылдын үстүндө терек болор эле.<\/td><\/tr><tr><td>3. Биздин айылга <i>ак таңдай<\/i> акындар келишти. («КМ»)<\/td><td>Биздин айылга акындар келишти.<\/td><\/tr><tr><td>4. <i>Ак жибек<\/i> көйнөк, <i>кызыл тукаба<\/i> бешмант, омуроодогу <i>кызыл<\/i> шуру, <i>алтын<\/i> шакек сулуунун көрүнүшүн <i>миң<\/i> кубултат.(К.Ж.)<\/td><td>Көйнөк, бешмант, омуроодогу шуру шакек сулуунун көрүнүшүн кубултат.<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"38\">38<\/span><b>59.<\/b> Окугула. Багындыруучу түгөйүн таап, анын кайсы сөз түркүмүнө кирерин аныктагыла. Схемага көңүл бургула, анан багындыруучу жана багыныңкы түгөйлөрдү үлгүдөгүдөй кылып көчүрүп жазгыла."},{"t":"p","h":"Жаркын маанай, таасын сөз, чаңкайган асман, салыңкы кабак, күкүктөнгөн суу, мүйүз тарак, көк мелжиген булут, түлкү тебетей, алыс күтүү, төртүнчү келүү, каадалана сүйлөө."},{"t":"img","src":"data:image/webp;base64,UklGRgofAABXRUJQVlA4IHYIAACQKwCdASpsAM0APrVSokynJKOiIpJOiOAWiUAakSIGgaTxB+gFTbssPtP4/effiO8w+4HqpZf7Tf5H91/0H9s84f83/PPFH4D/yP5AfAF+PfzP/G98B2+IAPx/+tf7DwMf7L0F+snoy/pP+h43bw/2AP49/Uf+D/hvXu+ofQT9P+wh+t//Y7FRmj5c1MXuDq29S0+4OJjTPPFtrwJKTMyMUpmQ0hyUY/+tYRfGsD8qMD8Bt/uYjX3sNsWgBtvHijKkjG2KtlR1eM5M0G8PPoDzCeVLSCwuqqw8jC1SkW63ZoeVKiLgoWQ6b3peULAcV8xGU/bpLgIv0E1GWtbeT5J8rOnqWQ6MtAQp6tMGZLdrHblKgrQFpz+TNvnL4NgyHnam+3esdPs+NRhtPfdq+0fFjPeliJaDwF+oCGyA+R211jp13KFMAqJdZfstg/MOAftsMEvR042qugKNmAp3KiuLR9Ir7MAA/v8d4v+HAgGuiI0/pmt3zrC65nt/VdDK1z3UYFKojLW4zIj/r1TV4/6hwFeOf/g7tDJvjROFklpcltOYi9Bt8NSL1smrwn4jGhgaN6Pj0/md4sxzt/tn/Fi4pkMBpYFICcbOR84yTA1GHG2rqmmhL0BN2tn51573OLWF09gw+9b/VhYMo2ikQASOUa3vVW/0K2kvE4K+mdjMqSPDw8tBl8+QdEXYHYB9bmOQlJgu8BTUNX+IqidQxbsQ5tc+fMsVOW2niouEiXHuWCafsk08EUSZNNrglXmh11JfvF/CYcufwnh9B3/+QhUE/bggNUuoD3rqNk+AfMfETxNgnzyC2jtPZ8mi3c9J1EHpc16ZXwtWx3Az5UagRSCoQFcOwMO332Riy3CoTXo/HHxmoCmYKZhKLt3nGgLtZ0vV8j5tfhUrJiYR+Qrj0Q/BcwW/v1gZUL34FFGS1ZB24T3zTbwBLFKnsVOvy0eZYgwC2dVUiO9E9N9LvycaZKCw086dayLCZf1MdCxH4aB+lvroK9A/qdL3cbPpp1ZUfQmZuuEWR+zDXdJ+zgyGN8+Pwn0afao6DlXCylqiacJhIOCtwYm+aSWPV/d6Dht3iLEMOed77c+YOh/A3HnY+Vvi/am9n3Jm2uZsyA4Jy4rDbYI5g+ybZjfLoFEQc+gAVL0xm5JGg0Y6vTSrA8/QS+NQPrbvk9ee6QQRH83ZcgTA3NRUX6BOzmaF/B09pLfvo1GQRpdBecrr++jjPPM2KbHJJcWUmFlf4R9Q7Sn0IFHdlz9mUE8Es8IrMrI9R6ike8Q0u2XLOxo1o9gA8+ifiQ+FIBbwlTcuGFHbqzsC3INHBb882+Hu+4lm "Үлгү: <i>Жаркын маанай.<\/i>"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><th rowspan=\"2\">Багындыруучу түгөй<\/th><th rowspan=\"2\">Багыныңкы түгөй<\/th><th colspan=\"2\">Грамматикалык мааниси<\/th><th rowspan=\"2\">Кайсы сөз айкашы?<\/th><\/tr><tr><th>Багындыруучу түгөй<\/th><th>Багыныңкы түгөй<\/th><\/tr><tr><td><i>маанай<\/i><br>(зат атооч)<\/td><td><i>жаркын<\/i><br>(сын атооч)<\/td><td colspan=\"2\">зат + анын белгиси<\/td><td>атоочтук сөз айкашы<\/td><\/tr><tr><td>—<\/td><td>—<\/td><td colspan=\"2\">—<\/td><td>—<\/td><\/tr><tr><td>—<\/td><td>—<\/td><td colspan=\"2\">—<\/td><td>—<\/td><\/tr><tr><td>—<\/td><td>—<\/td><td colspan=\"2\">—<\/td><td>—<\/td><\/tr><\/table><\/div>"}],"sub":[],"pages":[36,38]},{"title":"13-§. Таандык байланыш","blocks":[{"t":"h3","h":"13-§. ТААНДЫК БАЙЛАНЫШ"},{"t":"box","h":"<b>Багыныңкы түгөй илик жөндөмөдө туруп таандык мүчө уланган багындыруучу түгөй менен байланышса таандык байланыш деп аталат.<\/b>"},{"t":"p","h":"Мисалы: <i>окуучулардын китеби, чоң атамдын жомогу,<\/i> <i>менин карындашым.<\/i>"},{"t":"p","h":"Багындыруучу түгөйгө: <i>китеби, жомогу, карындашым.<\/i>"},{"t":"p","h":"<span class=\"pg\" data-n=\"39\">39<\/span>Багындыруучу түгөйгө: <i>окуучулардын, чоң атамдын, менин.<\/i>"},{"t":"p","h":"Жогорку мисалда <i>китеп<\/i> – окуучуларга, <i>жомок<\/i> – чоң атага, <i>карындаш<\/i> – мага таандык болуп айтылды."},{"t":"p","h":"Кээде тилдик өзгөчөлүккө байланыштуу багыныңкы же багындыруучу түгөйгө улануучу мүчөлөр айтылбай калышы мүмкүн; <i>айыл чети, биздин үй.<\/i>"},{"t":"p","h":"<b>60.<\/b> Окугула. Илик жөндөмөдө жана таандык мүчө уланып турган сөздөрдү атагыла. Мааниси боюнча алардын кайсы сөз кайсынысына таандык болуп айтылды? Таандык мүчө канчанчы жакка тиешелүү?"},{"t":"p","h":"Менин агайын-туугандарым, мектептин багы, биздин айылдаштарыбыз<sup>2<\/sup>, сенин курбу-курдаштарың<sup>2<\/sup>, силердин классташтарыңар<sup>2<\/sup>, агамдын баласы, таенемдин кызы, Сырдарыянын балыгы, Харезмдин күрүчү, Өзбекстандын пахтасы, акылдуунун сөзү."},{"t":"p","h":"<b>61.<\/b> Жадыбалда берилген таандык мүчөлөргө көңүл буруп, аларды эсиңерде сактагыла жана мындан аркы ишиңерде колдонгула."},{"t":"h3","h":"ТААНДЫК МҮЧӨЛӨР"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><th>Жактар<\/th><th>Жекелик сан<\/th><th>Көптүк сан<\/th><\/tr><tr><td>I жак<\/td><td>-ым, -м<\/td><td>-ыбыз, -быз<\/td><\/tr><tr><td rowspan=\"2\">II жак (сылык түрү)<\/td><td>-ың, -ң<\/td><td>-ыңар, -ңар<\/td><\/tr><tr><td>-ыңыз,-ңыз<\/td><td>-ыңыздар, -ңыздар<\/td><\/tr><tr><td>III жак<\/td><td>-ы -сы<\/td><td>-ы,-сы<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>62.<\/b> Текстти көркөм окуп, таандык байланышындагы сөздөрдү тапкыла. Байланыштын бул түрүндө негизги жана багыныңкы сөздөр бири-бири менен кандайча байланышат?"},{"t":"h3","h":"ҮЛГҮ ЫРЛАР"},{"t":"v","l":["Дайранын көркү<sup>2<\/sup> кемеде,","Баланын көркү энеде.","Акыл айтсаң тыңшабай,","Акмактын көркү жемеде.","","Шибердин көркү мал менен,","Жылкынын көркү жал менен.","Жылдыздай жанган кара көз,","Жигиттин көркү жар менен.","","Кулпунуп туурда таранса,","Куштун көркү түлөктө.","Кошоматчы, кууларды,","Кондурба да, түнөтпө!(Т.)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"40\">40<\/span><b>63.<\/b> Төмөнкү сөз айкаштарынын багыныңкы жана багындыруучу түгөйлөрүн таап, кандай жолдор менен байланышканын түшүндүргүлө."},{"t":"p","h":"Чимгендин абасы, күндүн нуру эмгектин шаңы, менин китебим, досумдун максаты элдин тынчтыгы, жигиттин сөзү"},{"t":"p","h":"<b>64.<\/b> Төмөнкү сүйлөмдөрдү көчүрүп жазып, таандык байланыштагы сөз айкаштарын белгилегиле. Маанисин түшүндүргүлө."},{"t":"p","h":"1.Акылдуунун сөзү – кыска. 2. Курсагы ачтын кулагы укпайт. 3. Булбул жокто баканын чардаганы керемет. 4. Тобокелдин кемеси сууга чөкпөйт. 5. Тоонун да төрөсү болот. 6. Ачуу сөздүн дамы ачуу келет. 7. Баатырдын өлүмү күндүн батканы менен барабар."},{"t":"p","h":"<b>65.<\/b> Төмөнкү сөздөр кайсы сөз түркүмүнө кирет? Алар кандай кырдаалда таандык байланыштагы сөз айкаштарынын түгөйлөрү боло алат? Берилген сөздөрдү катыштырып сөз айкаштарын түзгүлө."},{"t":"p","h":"Акылдуу, жыйырма, жыл, асыл, өнүккөн, бербес, алдыңкы, тез, алтоо, конституция, олимпиада, достор, фирма."},{"t":"p","h":"<b>66.<\/b> Окугула. Катарлаш берилген сөз айкаштарынын экөөнү тең катыштырып, сүйлөм түзүп келгиле. Экөөнүн айырмачылыгы эмнеде экен?"},{"t":"p","h":"Тоонун шамалы – тоо шамалы, кыргыз жери – кыргыздын жери, үй ичи – үйдүн ичи, көңүл дарты – көңүлдүн дарты, биздин айыл – биздин айылыбыз, элдин таалайы – эл таалайы."},{"t":"p","h":"<b>67.<\/b> Текстти окуп, таандык байланыштагы сөз айкашын көчүрүп жазгыла, текст кептин кайсы түрүнө кирет."},{"t":"p","h":"Боз үй – көчмөн элдердин биргелешкен акыл оюнан жаралган, жеңил десең жеңил, чечкенге, тиккенге оңой, жайында салкын, кышында жылуу, жөнөкөй, улуу эстелиги, ыйык куту жана кол өнөрчүлүгүнүн туу чокусу."},{"t":"p","h":"Боз үйдүн ичинен төбөңдү карасаң түндүгүнөн көк асманды, күндүз күндү, түнү айды көрөсүң. Сыртка чыксаң, кең дүйнө шарт ачылат. Чагылгандын чартылдаганын, шамалдын улуганын, дарыянын шоокумун, куштардын сайраганын даана угуп турасың."}],"sub":[{"title":"ТААНДЫК МҮЧӨЛӨР","b":10},{"title":"ҮЛГҮ ЫРЛАР","b":13}],"pages":[38,40]},{"title":"14-§. Башкаруу","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"41\">41<\/span>14-§. БАШКАРУУ"},{"t":"box","h":"<b>Байланыштын бул түрүндө багыныңкы түгөй барыш, табыш, жатыш, чыгыш жөндөмөлөрдүн биринде туруп, багындыруучу түгөй менен байланышат.<\/b>"},{"t":"p","h":"Мисалы: <b><i>мектепке<\/i><\/b> баруу, <b><i>тартипти<\/i><\/b> сактоо, <b><i>музейде<\/i><\/b> болуу, <b><i>коргошундан<\/i><\/b> оор."},{"t":"p","h":"Багындыруучу түгөй: <i>мектепке<\/i> (барыш жөндөмөдө), <i>тартипти<\/i> (табыш жөндөмөдө), <i>музейде<\/i> (жатыш жөндөмөдө)."},{"t":"p","h":"Багындыруучу түгөй: <i>баруу, сактоо, болуу, оор.<\/i>"},{"t":"p","h":"Кээде жөндөмө мүчөдөгү багыныңкы түгөйдөн кийин жандоочтун да кошулуп айтылышы мүмкүн: <b><i>баласына карай жүгүрүү,<\/i> жыйналыштан кийин<\/b> жолугуу. Багыныңкы сөздөр: <i>баласына карай<\/i> – барыш жөндөмө + карай деген жандооч; <i>жыйналыштан кийин<\/i> – чыгыш жөндөмөдө + <i>кийин<\/i> деген жандооч."},{"t":"p","h":"Багындыруучу айрым учурда багыныңкы түгөй, жөндөмө мүчөсүз келип, негизги сөз менен жандооч аркылуу байланышат: <b><i>эмгек<\/i> <i>менен<\/i><\/b> <i>жетилүү,<\/i> <b><i>мол<\/i> <i>түшүм<\/i> <i>үчүн<\/i><\/b> <i>күрөшүү.<\/i>"},{"t":"p","h":"Багыныңкы түгөйлөр: <i>эмгек менен, мол түшүм үчүн.<\/i>"},{"t":"p","h":"<b>68.<\/b> Багындыруучу жана багыныңкы сөздөрдү көрсөткүлө, алардын өз ара байланыштуу жолдорун (жөндөмө мүчө же жандооч) аныктагыла. Багындыруучу сөз көбүнчө кайсы сөз түркүмүнөн болорун эсиңерде сактагыла."},{"t":"p","h":"Айылдаштарга кезигүү, көчөттөрдү отургузуу, улууларды урматтоо, эгин талаасында иштөө, суудан кечүү, чындык үчүн аракет кылуу, радио аркылуу уктуруу, артисттер сыяктуу ырдоо, алмадан чоңураак, күндөн жарык, ушулардан үчөө, алтындан кымбат."},{"t":"p","h":"<b>69.<\/b> Төмөндө берилген мисалдарды өз ара салыштыргыла. Алардын кайсынысы сөз айкашы? Кайсынысы сүйлөм? Булардын айырмачылыгын түшүндүргүлө."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>1. Мектепке баруу<\/td><td>Мектепке бара жатабыз.<\/td><\/tr><tr><td>2. Жумуштан келүү<\/td><td>Жумуштан келдик.<\/td><\/tr><tr><td>3. Аэропортко чейин узатуу<\/td><td>Аэропортко чейин узатабыз.<\/td><\/tr><tr><td>4. Жаратылышты коргоо<\/td><td>Жаратылышты коргойбуз.<\/td><\/tr><tr><td>5. Кайык менен баруу<\/td><td>Кайык менен бардым.<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"42\">42<\/span><b>70.<\/b> Окугула. Сүйлөмдүн тутумунан ыкташуу, таандык жана башкаруу байланышындагы сөздөрдү тапкыла. Өз ара байланышкан сөздөрдүн кайсынысы багындыруучу жана кайсынысы багыныңкы?"},{"t":"p","h":"1. Жаратылыштын ажайып кооздугунан биз ыракат алабыз, аралашып жашайбыз. Толукшуган жай айында тоодо болуу кандай ыракат! Гүлдөргө суктана карайсың. Анан күз айы келет. Ал толгон-токой жер-жемишке, жашылчага толгон. Ооба, ар бир мезгилдин өзүнчө сыры бар. («А.Т.»)"},{"t":"v","l":["2. Күлүк менен жарышып,","Билимдүү менен алышпа.","Кейбир* кылат өзүндү,","Кеп салбагын маңызга. (Т.)"]},{"t":"p","h":"<b>71.<\/b> Төмөнкү схема боюнча башкаруу байланышындагы сөз айкашын түзгүлө. Анын багыныңкы жана багындыруучу түгөйлөрүн аныктагыла."},{"t":"v","l":["Зат атооч + барыш жөндөмөсү + этиш","Зат атооч + табыш жөндөмөсү+ этиш","Зат атооч + жатыш жөндөмөсү + этиш","Зат атооч + чыгыш жөндөмөсү + этиш"]},{"t":"p","h":"<b>72.<\/b> Сөз айкаштарын көчүрүп жазгыла. Багыныңкы жана багындыруучу түгөйлөрүн таап, алар кайсы сөз түркүмүнө таандык экендигин жана багыныңкы түгөйлөрүнө кайсы мүчөлөр жалганганын аныктагыла."},{"t":"p","h":"Эне тилди урматтоо, ырга ышкылуу, кыялды учуруу, жан дүйнөсүнө сиңүү, ойдон жаралуу, тоодо төрөлүү, билгенден суроо, жашоого ыңгайлуу, туш-тушка жиберүү, жалкоолуктан качуу."}],"sub":[],"pages":[41,42]},{"title":"15-§. Сөз айкашын талдоо","blocks":[{"t":"h3","h":"15-§. СӨЗ АЙКАШЫН ТАЛДОО"},{"t":"h3","h":"ТАЛДООНУН ТАРТИБИ"},{"t":"v","l":["1. Адегенде сөз айкашындагы багындыруучу түгөйдү табуу.","2. Багындыруучу түгөйдөн суроо берип, багыныңкы түгөйдү аныктоо.","3. Багындыруучу түгөй жана багыныңкы түгөйлөрдүн кайсы сөз түркүмүнөн болгонун көрсөтүү.","4. Сөз айкашындагы сөздөрдүн байланышуу жолдорун (ыкташуу, таандык, башкаруу байланыш) аныктоо."]},{"t":"h3","h":"<span class=\"pg\" data-n=\"43\">43<\/span>ТАЛДООНУН ҮЛГҮСҮ"},{"t":"p","h":"<i>Оозеки түрүндө талдоо.<\/i>"},{"t":"p","h":"<i>Салкын жел.<\/i> Эмне? – <i>жел<\/i> – багындыруучу түгөй, зат атооч; кандай жел? – <i>салкын<\/i> – багыныңкы түгөй, сын атооч; багыныңкы түгөй багындыруучу түгөй менен ички мааниси боюнча байланышты (ыкташуу)."},{"t":"p","h":"<i>Окуучулардын каалоолору.<\/i> Эмнелери? – каалоолору — багындыруучу түгөй, зат атооч; кимдин каалоолору? — <i>окуучулардын<\/i> – багыныңкы түгөй, зат атооч багындыруучу түгөй менен багыныңкынын ортосунда таандык байланыш бар."},{"t":"p","h":"<i>Акыл-эсти байытуу.<\/i> Эмне кылуу? —байытуу – багындыруучу түгөй, этиш; эмнени байытуу? —акыл-эсти — багыныңкы сөз; багындыруучу түгөй жана багыныңкы түгөйлөрдүн ортосунда башкаруу байланышы бар."},{"t":"p","h":"<i>Жазуу түрүндө талдоо.<\/i>"},{"t":"v","l":["кандай?","↓","<i>салкын<\/i> (сын атооч) ← <i>жел<\/i> (зат атооч)"]},{"t":"p","h":"<b>73.<\/b> Сөз айкаштарына оозеки талдоо жүргүзгүлө. Багыныңкы жана багындыруучу сөздөрдүн орун тартибине көңүл бургула. Дайранын көркү, адамдын жакшысы, алардын баары, ата мекенди сүйүү, көпкөк асман, менин мугалимим, жаанчыл жай айы, кайраттуу жигит, мелдешке катышуу, кыйынчылыктан коркпоо, көлгө чейин баруу, эки сааттан кийин келүү, он беш бала, тайгак кечүү, сенин айылдашың, шаардан окуу, силердин курбуларыңар."},{"t":"p","h":"<b>74.<\/b> Схеманы дептериңерге сызгыла. Сөз айкашында багыныңкы түгөй багындыруучу түгөй менен кандай жолдор аркылуу байланышарын эсиңерге сактагыла. Байланыштын ар бирине бештен мисал ойлоп таап, жазып келгиле."},{"t":"img","src":"data:image/webp;base64,UklGRioYAABXRUJQVlA4IJYBAABQDACdASo3AKMAPrVUpU0nJKOiKjN40OAWiWMA1LwyzrJWa4HqA2wHPgehPeK/QA/VXrZgSv9GPhle8ihWqnVmAOFWeDZxiqaM9wPYnE0VZMYFuKRKdceamhTbqRDpR1ljFU0lSqenrhiIAAD+9/CYVD7Nd6pzXbkXiHrtqKst/8jHuuiNZ+9oIBoyvd5OCuoAEIH2I/JSt4TI6iihXKS7k8sA/0dNu3+MtlRvC35VW+XlndrB1cIMg4xvQvbei6p296W4isy+qVYwEU6p/1XMFolwA5A61Pd9LHLW1s6hDhPLo3Nbi70VzXBfyfsc6fZtDYetg3oDMGuoFHaMSUt33hESjvaPP2Ub2CUgw1/14sK62phT7+7BJdivmbBtnjl2M8jimcd0/5S5goFO3z6eRZgvwYPt9/oFNQDEjKY6ZMOXE72/3h2GUeywf32I+klhdMO44mg1pywv2YhkDttjFHZWrAs0hfdVb8Z/9AZCGU4zB2e1vIwSuhoyN9kQADEzeqfiPlUnDjQF983Gr4/jCzhAAAAAQzJQQX8WAAAAABZ/anVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAFllqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOmNhZDQxNzVmLTk4OTMtNGEzZS1iMmZkLTZlYmNiYTk4Mjk1NwAAAAOUanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAAuWp1bWIAAABEanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5pbmdyZWRpZW50LnYzAAAAABhjMnNoE9hV9MUCj+lM2q093FW9SAAAAG1jYm9yo2lkYzpmb3JtYXRqaW1hZ2Uvd2VicGppbnN0YW5j ],"sub":[{"title":"ТАЛДООНУН ТАРТИБИ","b":1},{"title":"ТАЛДООНУН ҮЛГҮСҮ","b":3}],"pages":[42,44]},{"title":"16-§. Сүйлөмдүн грамматикалык түзүлүшү","blocks":[{"t":"h3","h":"СҮЙЛӨМ"},{"t":"h3","h":"16-§. СҮЙЛӨМДҮН ГРАММАТИКАЛЫК ТҮЗҮЛҮШҮ"},{"t":"p","h":"Сүйлөм аркылуу бир нерсе жөнүндө кабар берилет, же суроолор менен бирөөлөргө кайрылабыз, же ички сезимдер билдирилет. Ошентип, сүйлөм адамдардын ортосунда өз ара пикир алышуу кызматын аткарат. Сөз же сөз тизмектери грамматикалык жана интонациялык жактан белгилүү бир иретке келтирилип, жыйынтыктуу ойду билдиргенде сүйлөм боло алат."},{"t":"p","h":"Бүткөн айрым ойду билдирүүчү сөз же сөздөрдүн тизмеги сүйлөм деп аталат."},{"t":"p","h":"Сүйлөмдүн айтылыш максаты жана грамматикалык түзүлүшү ар түрдүү. Мисалы, айтылыш максаты боюнча жай, суроолуу, илептүү жана буйрук сүйлөмдөрдү билебиз."},{"t":"p","h":"Грамматикалык түзүлүшү боюнча сүйлөм жөнөкөй жана татаал болуп бөлүнөт. Жөнөкөй сүйлөмдө бир эле грамматикалык негиз (баш мүчө) болот, ал эми татаал сүйлөм эки же андан көп грамматикалык негизден турат. Мисалы: 1. <b><i>Жаан<\/i> <i>жаайт,<\/i><\/b> <i>2. Акылдын<\/i> <b><i>көркү<\/i> <i>—<\/i> <i>тил,<\/i><\/b> <i>тилдин<\/i> <b><i>көркү<\/i> <i>—<\/i> <i>сөз.<\/i><\/b> 1-сүйлөм – жөнөкөй, мында бир эле баш мүчө бар. 2-сүйлөм – татаал, ал эки сүйлөмдөн түзүлдү, анда эки баш мүчө бар."},{"t":"p","h":"Баш мүчөлөрдүн катышып турушу боюнча жөнөкөй сүйлөм экиге бөлүнөт:"},{"t":"p","h":"1) эки тутумдуу жана эки тутумдуу жөнөкөй сүйлөм;"},{"t":"p","h":"Айкындооч мүчөлөрдүн катышына карай жөнөкөй сүйлөм жалаң (мында айкындооч мүчө жок) жана жайылма (айкындооч мүчө бар) болушу мүмкүн."},{"t":"p","h":"<span class=\"pg\" data-n=\"45\">45<\/span><b>76.<\/b> Окуп, ойлонгула. Сөздөрдөн адегенде сөз айкаштарын, андан кийин ал сөз айкаштарынын негизинде сүйлөмдөрдү түзгүлө. Сөз менен сөз айкашынын, сөз айкашы менен сүйлөмдүн ортосунда кандай айырмачылык бар экенине көңүл бургула."},{"t":"p","h":"I. Бүгүн, чайыттай, күн ачык! Көл, нур, бетине, чагылышат: Күнгөй, килемдей, тескей, кулпурат; Жакасы көк, тоосу, жашыл; Салкын, көтөрүп, көңүлдү, жели; алып баратат, ыракатка, мээримдүү."},{"t":"p","h":"II. Ырчы, терге, оозун, чөмүлгөн, тартты, кызыл аттын; төрт, аягы, тынч, албайт, алчактай, ат; Токтоп, калды, көч; Көч, чыкты, ошентип, жолго."},{"t":"v","l":["Үлгү: ырчы тартты","оозун тартты","терге чөмүлгөн кызыл аттын"]},{"t":"p","h":"<i>Ырчы терге чөмүлгөн кызыл аттын оозун тартты.<\/i>"},{"t":"p","h":"<b>77.<\/b> Жадыбалды карап, сүйлөм менен сөз айкашын салыштыргыла. Экөөнүн айырмачылыгын мисал келтирүү аркылуу түшүндүрүп бергиле."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td><b>Сүйлөм<\/b><\/td><td><b>Сөз айкашы<\/b><\/td><\/tr><tr><td>Кабарлоо, суроо эркти билдирүү үчүн колдонулат.<\/td><td>Нерсени, кыймыл-аракетти ж.б. тагыраак, толугураак атоо үчүн колдонулат.<\/td><\/tr><tr><td>Белгилүү бир өлчөмдө жыйынтыктуу ойду билдирет да, интонациялык жактан аякталган болот.<\/td><td>—<\/td><\/tr><tr><td>Грамматикалык негизге (ээ, баяндооч) ээ.<\/td><td>Багындыруучу жана багыныңкы түгөйдөн турат.<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>78.<\/b> Сүйлөмдүн аягына коюлган тыныш белгилерге карата текстти көркөм окугула. Айтылыш максаты боюнча кандай сүйлөмдөр бар? Ал сүйлөмдөрдүн бири-биринен айырмасы эмнеде?"},{"t":"p","h":"– Эй, адамдар, дүйнөнүн төрт бурчунда жашаган адамдар, силерге эмне керек? Жерби? Мына, мен Жермин. Мен бардык адам баласына теңмин. Мага<sup>2<\/sup> талашыңардын кереги жок. Мага ынтымак керек, эмгек керек!"},{"t":"p","h":"Айдоого бир дан таштасаңар, жүз<sup>1<\/sup> дан кылып берем. Чырпык сайсаңар, чынар кылып берем. Урук-тукумуңар көбөйсө, баарыңарга жай болуп берем. Мен тарыбаймын, мен баарыңарга жай болуп берем. Мен тарыбаймын, мен кенчмин. Мен баарыңарга тегиз жетем! (Ч.А.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"46\">46<\/span><b>79.<\/b> Окугула. Сүйлөмдүн грамматикалык негизин кайсы мүчөлөр түзөт, аларды көрсөткүлө? Сүйлөмдү жай, суроолуу, илептүү деп бөлүштүрүүдө эмнени эске алабыз?"},{"t":"h3","h":"Ишеним, Сүйүү жана Мекен"},{"t":"v","l":["– Кудайдан эмнени сурасам болот?","– Үч нерсени: ден соолукту, кубаттуулукту, коопсуздукту.","– Кимден чочулабаш керек?","– Сага көз артпаган досуңдан.","– Жаш кезде эмне жасоо керек, а карыгандачы?","– Жашыңда билим алып, карыганда аны колдонуу керек.","– Эл алдында кишини эмне чүнчүтөт?","– Мактанчаактык, өзүнүн жөндөмүүлүгү жөнүндө сөз кылуу.","– Татыксыз достон кантип кол үзүш керек?","– Анын үч жолу бар. Ага басып барбай, акыбалын сурабай жана жардамга чакырбай койсоң кутуласың.","– Жаштарга жана карыяларга кандай адеп керек?","– Жаштарга тайманбастык менен уяттуулук, карыяларга билим менен токтоолук керек.","– Кандай адамдарды берешен, жоомарт десек болот?","– Кимдир бирөөгө белек берип, ошонусуна кубангандарды.","– Адам үчүн өмүрдөн артык эмне бар?","– Ишеним, сүйүү жана мекен."]},{"t":"p","h":"<i>Ибн Синанын айтканы<\/i>"},{"t":"p","h":"<b>80.<\/b> Туулуп-өскөн айылыңардын айланасына көз чаптыргылачы. Ал кандай керемет! Жаратылышка карата болгон өзүңөрдүн кубанычыңарды, суктанууңарды илептүү сүйлөм аркылуу билдиргиле. Бул жөнүндө чакан аңгеме жазып келгиле."},{"t":"p","h":"<b>82.<\/b> Жай, суроолуу, илептүү сүйлөмдөрдү колдонуп, чакан текст түзүп келгиле. Сүйлөмдүн грамматикалык негизин кайсы мүчөлөр түзөт? Сүйлөмгө мүнөздүү белгилерди түшүндүргүлө."},{"t":"p","h":"<b>83.<\/b> Төмөнкү суйлөидөрдү маанисине карап, берилген сөздөрдү пайдаланып толуктагыла."},{"t":"p","h":"Эл ар кандай улутта болсо да, бири-бирин ……турушат. Эч ким бири-бирин…… Ошондуктан .......өлкөсүндө ар дайым ….. өкүм сүрөт. Өзбекстандыктар ……каалайт. Ынтымак жана достук ….. байлыгыбыз.(сыйлап, Өзбекстан, бейпилдик, кемсинпейт, тынчтыкты, биздин)."},{"t":"p","h":"<span class=\"pg\" data-n=\"47\">47<\/span><b>81.<\/b> Жадыбалды карагыла. Сүйлөм эмнесине карай кандайча болуп бөлүнөт экен? Жадыбалдын этегиндеги мисалдарды сүйлөмдүн кайсы түрүнө кошууга болот? Сүйлөмдүн кайсы түрүнө мисал берилбептир деп ойлойсуңар,

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9lhAuNvRObEyvtg/qr87euAeR68LPkh04pYVdpSzfZZGrGjia1PpXlWCDDlucRS1MH/jjiFIKDA6Eo3ad7jqNKj+OwA=","w":265,"ht":133},{"t":"v","l":["Баяндооч","→ жөнөкөй","→ тутумдаш","→ этиштик","→ атоочтук"]},{"t":"p","h":"<b>117.<\/b> Схемадагы суроолорго көңүл бургула. Баяндооч ээнин ар кандай белгисин (кыймыл-аракетин, санын ж.б.) билдиргендей кылып, сүйлөм түзгүлө. Баяндооч ээнин кандай белгисин көрсөткөнүн эмнеге карай аныктадыңар? Түзгөн сүйлөмүңөрдөгү ээ менен баяндооч жөнөкөйбү же тутумдашпы? Тутумдаш баяндооч кандай зарылдыктан улам колдонулат деп ойлойсуңар?"},{"t":"raw","h":"<div class=\"tbl\"><span class=\"pg\" data-n=\"64\">64<\/span><table><tr><td colspan=\"3\"><b>Ээ<\/b><\/td><td colspan=\"2\"><b>Баяндооч<\/b><\/td><\/tr><tr><td>Кайсы сөз түркүмү?<\/td><td>Түзүлүшү эмнесин билдирди?<\/td><td>Ээнин эмнесин билдирет?<\/td><td>Кайсы сөз түркүмү?<\/td><td>Түзүлүшү боюнча кандай?<\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>118.<\/b> Ээ менен баяндоочтун милдетин аткарган ар бир сөз түркүмүн катыштырып, сүйлөм түзгүлө. Зат атоочтон башка сөз түркүмдөрү кандай кырдаалда ээнин милдетин аткара алчу эле? Бул жагынан алганда, баяндооч менен ээнин ортосунда кандай айырмачылык бар экен?"}],"sub":[],"pages":[62,64]},{"title":"24-§. Ээ менен баяндоочтун ортосуна сызыкчанын коюлушу","blocks":[{"t":"h3","h":"24-§. ЭЭ МЕНЕН БАЯНДООЧТУН ОРТОСУНА СЫЗЫКЧАНЫН КОЮЛУШУ"},{"t":"p","h":"Ээ менен баяндоочтун ортосуна төмөнкү учурларда сызыкча коюлат:"},{"t":"p","h":"1. Ээ да, баяндооч да зат атооч же сан атоочтон болсо: 1) <b><i>Акыл<\/i><\/b> <i>– тозбоочу<\/i> <b><i>тон,<\/i> <i>илим<\/i> <i>—<\/i><\/b> <i>жоголбочу<\/i> <b><i>кен.<\/i><\/b> 2) <b><i>Беш<\/i><\/b> <b><i>жерде<\/i> <i>беш<\/i> <i>—<\/i> <i>жыйырма<\/i> <i>беш.<\/i><\/b>"},{"t":"p","h":"2. Ээ зат атоочтон, баяндооч кыймыл атоочтон же тескерисинче болсо: 1) <i>Шамбеттин<\/i> <b><i>милдети<\/i><\/b> <i>– чарбанын<\/i> <i>өзүндө электрстанциясын<\/i> <b><i>куруу<\/i><\/b> <i>(Т.С.)<\/i> 2) <b><i>Жергебизди<\/i><\/b> <b><i>жашылдандыруу<\/i><\/b> <i>– бүткүл элдик иш.<\/i>"},{"t":"p","h":"3. Баяндооч заттык маанидеги сын атоочтон болсо: <i>Алиманын<\/i> <b><i>жоолугу<\/i> <i>—<\/i> <i>кызылы.<\/i><\/b>"},{"t":"p","h":"Мындай учурларда баш мүчөлөрдүн ортосунда бир аз тыным болот."},{"t":"p","h":"Төмөнкү учурларда баш мүчөлөрдүн ортосуна сызыкча коюлбайт:"},{"t":"p","h":"а) Зат атоочтон же заттык маанидеги башка атоочтордон болгон баяндоочко кызматчы сөз айкашып айтылса, же аларга жак, суроо мүчөлөрү уланып турса; 1) <b><i>Чынар<\/i><\/b> <i>өлкөбүздүн<\/i> алтын <b><i>кызы<\/i> <i>эле.<\/i><\/b> (Ж.Б.) 2) <i>Сен<\/i> <i>билимдүү<\/i> <b><i>жигитсиң.<\/i><\/b> <i>(К.К.)<\/i>"},{"t":"p","h":"б) Ээ зат атоочтон болуп, сан атоочтон болгон баяндооч анын конкреттүү санын көрсөтсө: <i>Окуп жаткандар<\/i> <b><i>он<\/i> <i>беш.<\/i><\/b>"},{"t":"p","h":"<b>119.<\/b> Сүйлөмдөрдү көрктүү окуп, сызыкчанын коюлушун түшүндүргүлө."},{"t":"p","h":"<span class=\"pg\" data-n=\"65\">65<\/span>1. Жакшы уул – элине баш, жаман уул – элине кас. (Мак.) 2. Эми ошол Күрпүлдөктүн кожоюну – эл. 3. Баарыбыздын милдетибиз – Мекенди чексиз сүйүү. 4. Ал – менин иним. (Т.С.) 5. Жарыштан чыккандар – экөө. Адам – адамга дос, жолдош, тууган."},{"t":"v","l":["6. Угуңузчу, Айганыш,","Кайгы – өмүрдүн уусу.","Күлкү – өмүрдүн жан азыгы. (К.Ж.)","7. Караңгыны билимге,","Сүйрөп чыккан – мугалим.","«Калем, кагаз алгын» – деп,","Сүйлөп чыккан<sup>2<\/sup> – мугалим. (Ж.Б.)"]},{"t":"p","h":"<b>120.<\/b> Сүйлөмдүн баш мүчөлөрүн аныктагыла. Баяндоочтун кайсы сөз түркүмүнөн болгонун жана анын түзүлүшүн салыштыргыла. Сызыкчанын коюлушун түшүндүргүлө, экинчи учурда ал эмне үчүн коюлбай калды?"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>1. Өнөр алды – кызыл тил.<\/td><td>1. Өнөр алды кызыл тил болот.<\/td><\/tr><tr><td>2. Жакшы адам элдин көркү.<\/td><td>2. Жакшы адам элдин көркү болууга тийиш.<\/td><\/tr><tr><td>3. Баарыбыздын милдетибиз – мекенди коргоо.<\/td><td>3. Баарыбыздын милдетибиз мекенди коргоо болуп эсептелет.<\/td><\/tr><tr><td>4. Адам адамга дос, жолдош, бир тууган.<\/td><td>4. Адам адамга дос, жолдош, бир тууган болот.<\/td><\/tr><tr><td>5. Ал менин иним.<\/td><td>5. Ал менин иним эле.<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>121.<\/b> Баш мүчөлөрдүн ортосуна сызыкча коюлуучу сүйлөмдөрдү таап, көчүрүп жазгыла. Тиешелүү жерге тыныш белгисин койгула. Кайсы учурда баш мүчөлөрдүн ортосуна сызыкча коюлбайт?"},{"t":"p","h":"1. Кыргыздын азыркы уул-кыздары кесипке бай бири мугалим, бири дарыгер, дагы бирөө жазуучу. 2. Мен<sup>1<\/sup> ак ниеттүү адаммын<sup>2<\/sup>. (Т.С.) 3. Бирде мен Токтогулдай ырчымын, бирде мен Толубайдай сынчымын. (С.А.) 4. Бул Ажар деген кыз. Беркилери ушул жерлик аялдар. (К.Б.) 5. Эң улуубуз Алмакан эжем, эң кичүүбүз Бекдайыр. 6. Бул ашуу Кызыл Кыя. 7. Ал тогуз жолдун кезигишкен жери эле. (М.Э.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"66\">66<\/span><b>122.<\/b> Көркөм окугула. Айтылыш максаты жана грамматикалык түзүлүшү боюнча кандай сүйлөмдөр бар? Сүйлөмдүн негизин кайсы мүчөлөр түзүшөт, аларды көрсөткүлө? Сүйлөмдү уюштурууда этиштик баяндооч кандай абалда болуш керек?"},{"t":"p","h":"Бугу эненин балбылдаган көздөрү муңайым тиктейт."},{"t":"p","h":"– Сен кимсиң<sup>2<\/sup>? Адамча сүйлөп, кубулган кандай жансың?"},{"t":"p","h":"– Мен Бугу эне болом. Адамча сүйлөбөсөм, сен кайдан түшүнөсүң?"},{"t":"p","h":"– Каалаганың эмне, Бугу эне?"},{"t":"p","h":"– Балдарды коё бер, акылман эне! Сенден сураганым ушул эки чүрпөнү мага бер. Балдарымдын ордуна бала издеп жүрөмүн."},{"t":"p","h":"– Жакшылап ойлондуңбу, Бугу эне? – деп күлдү майрык чаар Жезкемпир. (Ч.А.)"},{"t":"p","h":"<b>123.<\/b> Сөз айкаштарындагы негизги сөзгө тиешелүү жак жана чак мүчөлөрдү улап, ар бирине бирден сүйлөм түзгүлө. Сөз айкашы менен сүйлөм жөнүндө айтып бергиле."},{"t":"p","h":"Мактанчаактын эне сүтүн оозуна татытуу, силерден көп нерселерди күтүү, айылдаштар менен кезигишүү, университетке өтүү, ата-бабаларыбыздын наркын сактоо, туулуп-өскөн жерди сагынуу, улуулардан үлгү алуу."},{"t":"p","h":"<b>124.<\/b> Жадыбалды карагыла. Ээ менен баяндоочтун милдетин жадыбалда көрсөтүлгөн сөздөр, б.а. дал ушундай грамматикалык формада турган сөз түркүмдөрү аткаргандай кылып, ар бирине экиден сүйлөм түзгүлө. Кайсы сүйлөмдөрдө ээ менен баяндоочтун арасына сызыкча коюлду да, кайсыларында коюлбады? Себебин түшүндүргүлө."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td><b>№<\/b><\/td><td><b>Ээ<\/b><\/td><td><b>Баяндооч<\/b><\/td><\/tr><tr><td>1<\/td><td>Зат атооч<\/td><td>Атооч жөндөмөсүндөгү зат атооч<\/td><\/tr><tr><td>2<\/td><td>Зат атооч же заттык мааниде колдонулган атооч сөздөр<\/td><td>Жак же жөндөмө мүчөлөрү уланган зат атооч же заттык мааниде колдонулган атооч сөздөр<\/td><\/tr><tr><td>3<\/td><td>Зат атооч же затташкан сын атооч<\/td><td>Атооч жөндөмөсүндөгү затташкан сын атооч<\/td><\/tr><tr><td>4<\/td><td>Атоочтук<\/td><td>Атооч жөндөмөдө турган зат атооч же ат атооч<\/td><\/tr><\/table><\/div>"},{"t":"raw","h":"<div class=\"tbl\"><span class=\"pg\" data-n=\"67\">67<\/span><table><tr><td>5<\/td><td>Зат атооч<\/td><td>Атооч жөндөмөдөгү кыймыл атооч<\/td><\/tr><tr><td>6<\/td><td>Атоочтук<\/td><td>Атооч жөндөмөдөгү атоочтук<\/td><\/tr><tr><td>7<\/td><td>Сан атооч<\/td><td>Атооч жөндөмөдө турган, заттык мааниде колдонулган сан атооч<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>125.<\/b> Көчүрүп жазгыла. Сүйлөмдүн баш мүчөлөрү боюнча синтаксистик талдоо жүргүзгүлө. Аларга мүнөздүү белгилерди бергиле."},{"t":"p","h":"1. Эр жакшысы элдин жүгүн көтөрөт. Билим<sup>1<\/sup> – деңиз, түбү да, чеги да жок. Эстүүнүн өзүн сыйла, сөзүн<sup>2<\/sup> уккун. (Мак.) 2. Чоң мурун Жамыйла дегенде ак эткенден так этти. (К.Б.) 3. Жел таман желип-жортуп айылдап жүр, жээлигип өзүн-өзү дайындап жүр. (Т.М.) 4. Жолотпо ушакчыны элге-журтка, ушакчы, ууруга окшоп, калсын журтта. (Б.С.)"},{"t":"p","h":"Үлгү: <i>Эр жакшысы элдин жүгүн көтөрөт.<\/i> Эмне болот? <i>– көтөрөт —<\/i> баяндооч, этиш, жөнөкөй; ким көтөрөт? – <i>эр жакшысы<\/i> – ээ, зат атооч, тутумдаш; баш мүчөлөрдүн ортосунда ээрчишүү байланышы бар (сан, жак боюнча)."}],"sub":[],"pages":[64,67]},{"title":"25-§. Сүйлөмдүн баш мүчөлөрүн талдоо","blocks":[{"t":"h3","h":"25-§. СҮЙЛӨМДҮН БАШ МҮЧӨЛӨРҮН ТАЛДОО"},{"t":"p","h":"Баш мүчөлөргө синтаксистик талдоо жүргүзүүдө алардын төмөнкүдөй белгилери көрсөтүлүүгө тийиш:"},{"t":"v","l":["1) кандай суроого жооп берери;","2) кайсы сөз түркүмүнөн жасалгандыгы;","3) түзүлүшү;","4) баш мүчөлөрдүн өз ара байланышуу жолу;","5) сүйлөмдөгү орун тартиби."]},{"t":"h3","h":"ТАЛДООНУН ҮЛГҮСҮ"},{"t":"p","h":"<i>Быйыл эмгек да жакшы уюшулду.<\/i> Эмне болду? <i>– уюшулду<\/i> – баяндооч; эмне болду? деген суроого жооп берди; этиш; жөнөкөй; ээден кийин келди."},{"t":"p","h":"Эмне уюшулду? – <i>эмгек да<\/i> – ээ; эмне? деген суроого жооп берет; эмгек – зат атооч, <i>да<\/i> – бөлүкчө; тутумдаш ээ, баяндоочтон мурда келди. Баш мүчөлөрдүн ортосунда ээрчишүү байланышы бар; ээ жекелик санда, III жакта; баяндооч да ошол санда, ошол жакта айтылды."},{"t":"p","h":"<span class=\"pg\" data-n=\"68\">68<\/span><b>126.<\/b> Көчүрүп жазгыла. Сүйлөмдүн баш мүчөлөрү боюнча талдоо жүргүзгүлө."},{"t":"p","h":"1. Арлен менен Бакдөөлөт чогуу окушат. 2. Мекеним туулган жерден башталат. 3. Жыйырма бешке бөлүнөт. 4. Ысык-Көл кышта жылуу, жайда салкын. 5. Элүүнүн жарымы – жыйырма беш 6. Келечектин ээси – силер. 7. Күүнүн башы – Камбаркан."},{"t":"h3","h":"СҮЙЛӨМДҮН АЙКЫНДООЧ МҮЧӨЛӨРҮ"},{"t":"p","h":"Айкындоочтор баш мүчөлөрдүн маанисин айкындайт жана толуктайт. Алар өзүлөрүнүн маанилери боюнча аныктооч, толуктооч, бышыктооч болуп бөлүнөт."}],"sub":[{"title":"ТАЛДООНУН ҮЛГҮСҮ","b":3},{"title":"СҮЙЛӨМДҮН АЙКЫНДООЧ МҮЧӨЛӨРҮ","b":8}],"pages":[67,68]},{"title":"26-§. Аныктооч, анын милдетин аткаруучу сөз түркүмдөрү","blocks":[{"t":"h3","h":"26-§. АНЫКТООЧ, АНЫН МИЛДЕТИН АТКАРУУЧУ СӨЗ ТҮРКҮМДӨРҮ"},{"t":"box","h":"<b>Заттын кимге же эмнеге тиешелүү экендигин билдирип, анын сын-сыпатын, белгисин, санын, иретин көрсөткөн айкындооч мүчө аныктооч деп аталат.<\/b> Кандай? кайсы? канча? нече? канчанчы? кимдин? эмненин? ж.б. суроолорго жооп берет."},{"t":"p","h":"Мисалы: 1) <b><i>Жакшы<\/i><\/b> <i>ат камчы салдырбайт. Кандай ат? жакшы —<\/i> аныктооч, заттын сыпаты. 2) <b><i>Кызыл<\/i><\/b> <i>желек желге желбиреп турат.<\/i> Кандай желек? <i>– кызыл<\/i> – аныктооч – заттын өңү-түсү."},{"t":"p","h":"Аныктооч аныкталуучу сөздөн (заттан) мурда келип, аны менен <b>таандык байланыш<\/b> же <b>ыкташуу<\/b> жолдору аркылуу байланышат. Мисалы: 1. <b><i>Чолпонбайдын<\/i><\/b> <i>эрдиги жолдошторун таң калтырды.<\/i> (Ж.Б.) Кимдин эрдиги? <i>– Чолпонбайдын —<\/i> аныктооч, илик жөндөмөдө; ал таандык мүчө (-и) уланган эрдиги деген сөз менен байланышты (таандык байланыш). 2. <b><i>Жакшы<\/i><\/b> <i>кыз – жакадагы кундуз.<\/i> (Мак.) Кандай кыз? – <i>жакшы<\/i> – аныктооч, мааниси жагынан кыз деген сөзгө ыкташты."},{"t":"p","h":"<b>Аныктоочтун милдетин төмөнкү сөздөр аткарат:<\/b>"},{"t":"v","l":["1. Зат атооч: <b><i>Баланын<\/i><\/b> <i>аты Аксаамай болду.<\/i>","2. Сын атооч: <b><i>Жакшы<\/i><\/b> <i>адам эл камы үчүн күйүнөт.<\/i>","<span class=\"pg\" data-n=\"69\">69<\/span>3. Сан атооч: <i>Быйыл<\/i> <b><i>беш<\/i><\/b> <i>мектеп курулду.<\/i>","4. Ат атооч: <b><i>Ар<\/i> <i>кандай<\/i><\/b> <i>кесип ардактуу.<\/i>","5. Атоочтук: <b><i>Соолбос<\/i><\/b> <i>өмүр,<\/i> <b><i>сынбас<\/i><\/b> <i>темир болбойт.<\/i>"]},{"t":"p","h":"<b>127.<\/b> Окугула. Адегенде затты, андан кийин заттан суроо берип, аныктоочту тапкыла, ал кандай суроого жооп берди? Кайсы сөздү аныктады? Кайсы сөз түркүмүнөн болду?"},{"t":"p","h":"1. Жаман жолдош жоого алдырат, жаман дос доого калтырат<sup>4<\/sup>. Аргымактын<sup>2<\/sup> жакшысы азыраак оттоп, көп жуушайт. (Мак.)"},{"t":"p","h":"2. Кыш... Калың кар. Мелмилдеген кең талаа ак матага оронгон. Тыякта да, быякта да бөкөндөрдүн калың топтору жайылып жүрөт. (Ч.А.)"},{"t":"v","l":["3. Жакшы кыз<sup>1<\/sup> – эне-атанын ырыскысы.","Турмуштун тунук, таза уюткусу.","Сайраган жайкы булбул – гүлдүн көркү,","Жаркырап жайнаган кыз – үйдүн көркү. (Б.А.)"]},{"t":"p","h":"Үлгү: <i>Жаман жолдош жоого алдырат, жаман дос доого калтырат.<\/i> Ким? – <i>жолдош<\/i> – ээ, зат атооч; кандай жолдош? <i>жаман —<\/i> аныктооч; кандай деген суроого жооп берди; <i>жолдош<\/i> деген сөздү аныктады, сын атооч."},{"t":"p","h":"<b>128.<\/b> Окугула Сүйлөмдүн маанисин жана түзүлүшүн өз ара салыштыргыла. Кайсы сүйлөмдө заттын белгиси ачык-так көрсөтүлдү? Бул эмнеге байланыштуу болот?"},{"t":"p","h":"1. Орто бойлуу<sup>3<\/sup>, ак жуумал жигит ордунан турду. —Жигит ордунан турду. 2. Кырдач мурун, кичинекей жаш Каныбек бийик асканын башында ырдап турат. 3. Жыйырма сегиз баатыр душмандын отуз танкасын талкалады. – Баатыр душмандын танкасын талкалады. 4. Биринчи<sup>3<\/sup> сөз Динарга берилди. – Сөз Динарга берилди. 5. Чарчы бойлуу карыя аңгемесин баштады. – Карыя аңгемесин баштады. 6. Бук болуп отурган Касейин күмүш маңдай комузун колуна алды. (Т.С.) – Касейин комузун колуна алды."},{"t":"p","h":"<b>129.<\/b> Окугула. Затты жана анын ар кандай белгилерин билдирген сөздү (аныктооч) тапкыла. Аныктооч заттын кандай белгисин билдирди?"},{"t":"p","h":"<span class=\"pg\" data-n=\"70\">70<\/span>Ак ниет адамга асылгандар көп болот, бирок эч ким абийирин ача албайт. Пайдасыз жашоо – мезгилсиз өлүмгө тете."},{"t":"v","l":["Үч нерсенин кадырын үч адам билет:","Жаштыктын кадырын картайган билет,","Ден соолуктун кадырын оорулуу билет,","Байлыктын кадырын жарды билет.","<i>(Х,К,) «Накыл сөздөр».<\/i>"]},{"t":"p","h":"Үлгү: <i>Орто бойлуу, кең ийиндүү, арык чырай жаш жигит келди.<\/i> Ким? – <i>жигит<\/i> – зат атооч, аныкталуучу сөз; кандай жигит? – <i>орто бойлуу, кең ийиндүү, арык чырай жаш<\/i> – бир өңчөй аныктоочтор; <i>жигит<\/i> деген заттын сырткы сын-сыпатын билдирди."},{"t":"p","h":"<b>130.<\/b> Көчүрүп жазгыла да, сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Аныктоочтун грамматикалык белгилерин атагыла: а) кандай суроого жооп берди? б) заттын кандай белгисин билдирди? в) кайсы сөз түркүмүнөн жасалды? г) аныкталуучу сөз менен кандайча байланышты?"},{"t":"p","h":"1. Аппак үйлөр алыстан көрүнүп турду. 2. Күн ааламга алсыз нурун чачты. 3. Биздин жаштарыбыз ары кичи пейил, ары сылык болууга тийиш 4. Бектурган беш-алты кишинин ортосунда олтурган баласын көрө койду. (А.Т.) 5. Мингениң жакшы ат болсо, алысты жакындай көр. 6. Жалкоонун жообу көп. (Мак.)"},{"t":"p","h":"<b>131.<\/b> Төмөнкү сөз айкаштарын колдонуп, ар бирине бирден сүйлөм түзгүлө. Аныктоочту көрсөткүлө, ал кандай мааниде колдонулары жөнүндө айтып бергиле."},{"t":"p","h":"Тоодой толкун, жайкы ысык, айылдык адамдар, кышкы бороон, жыйырма беш окуучу, талаанын көркү, биздин жаштарыбыз, биринчи сөз, Ала-Тоонун атыр жели, шыңга бойлуу адам."},{"t":"p","h":"<b>132.<\/b> Текстти окуп, маанисин айтып бергиле. Аныктоочту таап, кайсы сөз түркүмүнөн экендигин аныктагыла."},{"t":"v","l":["Күчсүз душман менен күчтүү дос.","Акылман мындай дептир:"]},{"t":"p","h":"<span class=\"pg\" data-n=\"71\">71<\/span>– Күчсүз душманды күчтүү деп бил да, андан көзүңдү айырбай сак бол! Болбосо досуңа ишенип алып, душманыңдан кордук көрүп каларыңды эсиңден чыгарба. <i>«Залкар ойлор»<\/i>"},{"t":"p","h":"<b>133.<\/b> Көчүрүп жазгыла. Сүйлөм мүчөлөрү жана сөз түркүмү боюнча талдоо жүргүзгүлө. Аныктооч сүйлөмдүн кайсы мүчөсүн аныктады?"},{"t":"p","h":"1. Кең пейилдүү улуу адамдар токтоо болушат. 2. Бөрү атар уулду бөркүнөн тааны. 3. Чыныгы дос жакшылыкты, жамандыкты тең бөлөт. (Мак.) 4. Асмандагы ак булуттарды көпкө карап отурдум. 5. Шадыкан – арык чырай сары киши. 4. Ар бир сөзүн кылдаттык менен ойлоп сүйлөйт."}],"sub":[],"pages":[68,71]},{"title":"27-§. Аныктоочтун түзүлүшү","blocks":[{"t":"h3","h":"27-§. АНЫКТООЧТУН ТҮЗҮЛҮШҮ"},{"t":"p","h":"Грамматикалык түзүлүшү боюнча аныктооч жөнөкөй жана тутумдаш болот. Жөнөкөйү бир сөздөн, тутумдаш аныктооч бир нече сөздүн тизмегинен түзүлөт."},{"t":"p","h":"Мисалы: 1) <b><i>Байлыктын<\/i><\/b> <i>энеси – жер.<\/i> (Мак.) 2) <i>Биз<\/i> <b><i>ушул<\/i> <i>айылдын<\/i><\/b> <i>жигиттерибиз.<\/i> Аныктоочтор: эмненин? деген – <i>байлыктын<\/i> (жөнөкөй); кайсы айылдын жигиттерибиз? <i>– ушул айылдын<\/i> (тутумдаш)."},{"t":"p","h":"Тутумдаш аныктооч төмөнкүдөй сөздөрдүн тизмегинен түзүлөт:"},{"t":"p","h":"а) Маани берүүчү сөздөрдөн: <b><i>Туйлап<\/i> <i>аккан<\/i> <i>тунук<\/i><\/b> <i>булактарды аралап баратабыз.<\/i> Кандай булактарды? – <i>туйлап аккан тунук<\/i> – тутумдаш аныктооч."},{"t":"p","h":"б) Маани берүүчү жана кызматчы сөздөрдөн: <i>Биз<\/i> <b><i>сиз<\/i> <i>сыяктуу<\/i><\/b> <i>адамдардан тарбия алганбыз.<\/i> Ким сыяктуу адамдардан? – <i>сиз сыяктуу<\/i> – тутумдаш аныктооч."},{"t":"p","h":"в) Туруктуу сөз тизмегинен (фразеология) жана атоочтук түрмөктөн: <b><i>Ат<\/i> <i>жалын<\/i> <i>тартып<\/i> <i>минген<\/i><\/b> <i>бала жаш эмес.<\/i> (Мак.) Кайсы бала? – <i>ат жалын тартып минген<\/i> – тутумдаш аныктооч, фразеология. 2. <b><i>Жайбаракат<\/i> <i>басып<\/i> <i>келе<\/i> <i>жаткан<\/i><\/b> <i>Акман чоң короого бурулду.<\/i> (Т.С.) Кайсы Акман? – <i>жайбаракат басып келе жаткан<\/i> – тутумдаш аныктооч, атоочтук түрмөк."},{"t":"p","h":"<b>135.<\/b> Көчүрүп жазгыла. Сүйлөм мүчөлөрүнүн астын сызгыла, алар кайсы сөз түркүмүнөн болушту? Аныктооч жана аныкталуучу сөздүн сүйлөмдөгү орду кандай?"},{"t":"h3","h":"<span class=\"pg\" data-n=\"72\">72<\/span>УЧКУЛ СӨЗДӨР"},{"t":"p","h":"1. Уяты бар адамдын нуру болот бетинде. 2. Ушакчы болгон жигиттин урматы болбойт элине. 3. Уулу бардын орду бар, кызы бардын кадыры бар. 4. Өз элиңдин<sup>2<\/sup> кадырын бөтөн жерде билерсиң."},{"t":"p","h":"<b>136.<\/b> Окугула. Бөлүнгөн сөз тизмегин өз ара салыштыргыла. Алардын ар бири кандай суроого жооп берди? Сүйлөмдүн кайсы мүчөсү? Түшүндүргүлө."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>1. <i>Көп окуган<\/i> адам көптү билет.<\/td><td><i>Көп окуган<\/i> көптү билет.<\/td><\/tr><tr><td>2. <i>Колунан көөр төгүлгөн<\/i> жаштар келишти.<\/td><td><i>Колунан көөр төгүлгөндөр<\/i> келишти.<\/td><\/tr><tr><td>3. <i>Жалтанып турган<\/i> бала атасына карай чуркады.<\/td><td><i>Жалтанып турган<\/i> атасына карай чуркады.<\/td><\/tr><tr><td>4. <i>Кайгысы жок<\/i> адам кара сууга семирет.<\/td><td><i>Кайгысы жок<\/i> кара сууга семирет.<\/td><\/tr><tr><td>5. <i>Эже кийген<\/i> тонду сиңди киет.<\/td><td><i>Эже кийгенди<\/i> сиңди киет.<\/td><\/tr><tr><td>6. <i>Адамды сүйө албаган<\/i> адам ата-энени да урматтай албайт.<\/td><td><i>Адамды сүйө албаган<\/i> ата-энени да урматтай албайт.<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>137.<\/b> Жадыбалды карагыла. Анда көрсөтүлгөн жол-жобо боюнча сүйлөм түзгүлө. Мында кандайдыр бир белгини (заттын же кыймыл-аракеттин) көрсөткөн сөздөрдүн кайсыларын аныктооч катары кароого болот? Алардын кайсылары жөнөкөй, кайсылары тутумдаш? Жадыбалдагы суроолорго ылайык торчолорду толтургула. Аныктоочко кандайча кеңири аныктама берсе болот деп ойлойсуңар?"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td rowspan=\"2\"><b>Маанилери<\/b><\/td><td rowspan=\"2\"><b>Мисалдар<\/b><\/td><td colspan=\"2\"><b>Кандай суроого жооп берет?<\/b><\/td><td colspan=\"2\"><b>Кайсы сөз түркүмү?<\/b><\/td><td rowspan=\"2\"><b>Байланыштын кайсы түрү?<\/b><\/td><\/tr><tr><td><b>аныктооч<\/b><\/td><td><b>аныкталгыч<\/b><\/td><td><b>аныктооч<\/b><\/td><td><b>аныкталгыч<\/b><\/td><\/tr><tr><td>Заттын белгиси:<br>1) өңү-түсү<br>2) кейпи (формасы)<br>3) көлөмү<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div>"},{"t":"raw","h":"<div class=\"tbl\"><span class=\"pg\" data-n=\"73\">73<\/span><table><tr><td>4) кулк-мүнөзү<br>5) ички сапаты<br>6) заттын эмнеден жасалгандыгы<br>7) заттын бир жакка таандыктыгы<br>8) заттын саны, кыймыл-аракеттин белгиси:<br>1) сапаты; 2) саны<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>138.<\/b> Көчүргүлө. Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Сүйлөмдүн тутумунда зат атооч барбы? Затка тиешелүү белгини сүйлөмдүн кайсы мүчөсү билдирет?"},{"t":"p","h":"1) Адептүү ата-энесин мактатат. Адепсиз бала ата-энесин какшатат. (Мак.) 2) Каны ичине тарткан Жайнак баштагыдай эле токтоо. (С.Ө.) 3) Бурулча колунан көөр төгүлгөн уз аял эле. (К.К.) 4) Жамила болсо – шайыр, сөзмөр, жароокер кыз. (К.Б.) 5) Ак куунун тыбытынан топу кийген кыздын элеси Эшендин көз алдында дайыма калды. Биз ичмекейин ичине каткан адамдардан эмеспиз. (Т.С.)"},{"t":"p","h":"Талдоонун үлгүсү: <i>Адептүү бала ата-энесин мактатат.<\/i> Эмне болот? – <i>мактатат<\/i> – баяндооч; ким? – <i>бала<\/i> – ээ; кимди мактатат? – <i>ата-энесин —<\/i> толуктооч; кандай бала? – <i>адептүү —аныктооч; бала<\/i> деген зат атоочтун сын-сыпатын билдирди."},{"t":"p","h":"<b>139.<\/b> Жадыбалды карагыла. Сүйлөмдөрдү окуп, аныктооч менен аныкталгычты тапкыла. Жадыбалды дептериңерге көчүрүп, андагы ачык жерлерди толтургула. Аныктоочтун милдетин кайсы сөз түркүмдөрү аткарды, буга ылайык аныкталгычтын белгисин көрсөтүүдө кандай өзгөрүүлөр болду? Аныктооч менен аныкталгыч байланыштын кайсы түрү боюнча байланышкан? Муну кандайча аныктадыңар?"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td rowspan=\"2\"><b>Мисалдар<\/b><\/td><td colspan=\"2\"><b>Кайсы сөз түркүмү?<\/b><\/td><\/tr><tr><td><b>аныктооч<\/b><\/td><td><b>аныкталгыч<\/b><\/td><\/tr><tr><td>Бир эненин он эки уулу бар балбан,<br>Бири бир чапканча, экинчиси алтымыш чапкан.<br>(Таб.) (Саат.)<\/td><td><\/td><td><\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"74\">74<\/span><i>уландысы<\/i>"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Бизде он эки окуучу бар эле, он экибиз тең күнүгө эки жолудан келер элек. («ЛЖ»)<br>Элдик казына менен таанышканда не бир ойлор козголот. Адам перзентинин улуулугуна сыймыктанасың. Дирилдеген сезимдер алда кайда бийикке көтөрүлүп, эгиздеги (бийиктеги) сереге серпилгенсийт. (Ж.М.)<br>Бул жүргөнүм көп эмес,<br>Бул иш мага эп эмес...<br>Чепкен чыгып эсинен,<br>Керилип жатып алыптыр.<br>Жалкоонун жайы ушундай,<br>Жайкалып уйку салыптыр. (Т.М.)<br>Жол жүрүүдөн чарчап-чаалыктык. Бирок, айла жок, жатып алууга болбойт – ойдогу максатты аткаруу парз.<br>Ошентип, акыры көксөгөн үчүнчү айылга да жеттик. «КМ»<br>Түртпөгөн эшиги, иштебеген иши калбады. Киши бүгүнкү катасын эртең түшүнөт көрүнбөйбү. Сөзгө бат жыгылат, алда качан өткөн ишине азыр бети кызарат, кадыресе ничкерет<\/td><td><\/td><td><\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>140.<\/b> «Менин мекеним – Өзбекстан» деген темада сүрөттөө мүнөзүндөгү дилбаян жазгыла. Жандуу жана жансыз заттардын белгилерин ачык-так көрсөтүүгө аракеттенгиле."},{"t":"p","h":"<b>141.<\/b> Көчүргүлө. Сүйлөм мүчөлөрү боюнча талдоо жүргүзүп, атоочтук түрмөктү жана фразеологиялык сөз тизмегин тапкыла. Алар сүйлөмдүн кайсы мүчөсү болду? Атоочтук түрмөккө, фразеологиялык сөз тизмегине сөз түркүмү боюнча талдоо жүргүзгүлө."},{"t":"p","h":"1. Алтын сарайдан табылган акыл<sup>1<\/sup> жаман алачыктан да табылыптыр. 2. Кеңешип кескен бармак оорубайт. 3. Улуу тоого чыккан адам барбы? Улар үнүн уккан барбы? 4. Көп жашаган адам билбейт, көптү көргөн билет. (Мак.) 5. Күз айы. Ал ак төөнүн карды жарылган бышыкчылыгы менен кооз. 6. Алтын шилекейин чачыраткан карыялар<sup>1<\/sup> жооп беришти. Атам алтын шилекейин чачыратты. («ФС»)"},{"t":"p","h":"Аткаруунун үлгүсү: <i>Алтын сарайдан табылган акыл жаман алачыктан да табылыптыр.<\/i> Эмне болуптур? – <i>табылыптыр<\/i> – баяндооч; эмне? – <i>акыл —<\/i> ээ; кайдан табылыптыр? – <i>алачыктан да<\/i> – бышыктооч; кандай алачыктан? – <i>жаман<\/i> – жөнөкөй аныктооч; кайсы акыл? <i>—<\/i> <span class=\"pg\" data-n=\"75\">75<\/span><i>алтын сарайдан табылган<\/i> – тутумдаш аныктооч, атоочтук түрмөк."},{"t":"p","h":"Эмне? – <i>алтын<\/i> – зат атооч; эмнеден? <i>– сарайдан<\/i> – зат атооч; эмне болгон? – <i>табылган —<\/i> этиш."}],"sub":[{"title":"УЧКУЛ СӨЗДӨР","b":8}],"pages":[71,75]},{"title":"28-§. Жандама мүчө","blocks":[{"t":"h3","h":"28-§. ЖАНДАМА МҮЧӨ"},{"t":"box","h":"<b>Жандама мүчө – бул аныктоочтун өзгөчө түрү.<\/b> Ал аныкталуучу сөздөн кийин келип, анын кесип, жакындык, өнөр, наам, сыпат, мүнөз, даража жагынан болгон белгисин билдирет."},{"t":"p","h":"Мисалы: <i>Динар<\/i> <b><i>тентек<\/i><\/b> <i>Омордун үйүн көздөй кетти. (Т.С.)<\/i> Жандама мүчө – <i>тентек. Динардын<\/i> мүнөз жагынан болгон өзгөчөлүгүн билдирди."},{"t":"p","h":"Ошентип, жандама мүчө өзүнөн мурдагы сөз менен ажырагыс биримдикте колдонулат да, экөө биригип, сүйлөмдүн бир эле мүчөсү болот: <b><i>Сагынтай<\/i> <i>таятам<\/i><\/b> <i>айылдын алгачкы мугалимдеринен болгон.<\/i> Ким? – <i>Сагынтай таятам —<\/i> ээ."},{"t":"p","h":"<b>142.<\/b> Окугула. Билдирген маанилери жагынан кара менен басылган сөздөрдөн кандай жалпылыкты жана айырмачылыкты байкадыңар? Алар кайсы сөз түркүмүнө таандык? Синтаксистик милдети жана орун тартиби боюнча бири-биринен айырмаланабы?"},{"t":"p","h":"1. Маңгулдан Чокон <b>дөө<\/b> чыкты, ат минбеген жөө чыкты. («Манас»)"},{"t":"p","h":"2. Жаныбек <b>койчу<\/b> бүгүн тоодон негедир кеч кайтты. 3. Жеңижок <b>акын<\/b> өзүнүн ашкере таланты менен жамы журтка аттын кашкасындай таанымал болгон."},{"t":"p","h":"4. Атын байлабады, алды–артын карабады, үйгө кирди, үйгө киргенин Чыйырды <b>байбиче<\/b> көрдү.(«Манас»). 5 .Ошентип, Телибай <b>тентек<\/b> өзүнүн кемпайлыгынан өлүп тыныптыр. 6. Жергиликтүү адамдар өлөңчүлөрдү абдан кадырлашат. 7. <b>Жалгыз<\/b> аттын чаңы чыкпас (Мак.) 8. <b>Жазгы<\/b> жамгыр болбосо, жашыл чөп кайдан гүлдөсүн. (Т.)"},{"t":"p","h":"<b>143.<\/b> БК. Текстти окугула. Мазмунун айтып бергиле. Аныктооч сөздөрдү тапкыла."},{"t":"p","h":"Жеткиликтүүлүккө жетишүү жараяны улуу бабаларыбыздын чыгармаларында турмуштук мисалдар, мифология аркылуу көрсөтүлгөн. Мисалы, улуу акыныбыз Алишер <span class=\"pg\" data-n=\"76\">76<\/span>Наваийнин «Лисонут-тайр» – «Куштун тили» чыгармасында мунун үлгүсүн көрүшүбүз мүмкүн. Бул чыгармада бир топ куштар мифтик Семургду издеп жолго чыгышат. Алар дарыя жана чөлдөрдөн учуп өтүшөт. Көпчүлүк куштар жол азабына чыдабай жарым жолдо калып кетишет. Бир гана отуз куш өзүнүн максатынан кайтпай умтулат. Ошондо алар өздөрүн Семург, башкача айтканда отуз куш экенин сезип калат. Анткени фарсча «си» – отуз, «мург» – куш дегенди билдирет. Муну айтышыбыздан максат, умтулган адам дайыма алдына койгон максатына жетет."},{"t":"p","h":"<b>144.<\/b> Сүйлөмдөрдүн тутумундагы бөлүнгөн сөздөрдү бири-бирине салыштыргыла. Кайсынысы аныктооч, кайсынысы жандама мүчө? Булардын айырмачылыгы эмнеде?"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>1. <i>Бийик<\/i> тоону жанынан көр, башына чыкпа.<\/td><td>Чаргын <i>чап жаак<\/i> Шамбеттерди тамашалады.<\/td><\/tr><tr><td>2. <i>Жакшы<\/i> киши өлбөсүн, жамандыкты көрбөсүн. (Мак.)<\/td><td>Калыйпа <i>какылдак<\/i> жаагын жанууда. (Т. <i>С.)<\/i><\/td><\/tr><tr><td>3. <i>Күндүн кызылсары<\/i> нурлары чачырады. («КМ»)<\/td><td>Капар <i>сүрөтчү<\/i> көп эмгек жараткан. («А»)<\/td><\/tr><tr><td>4. <i>Кичинекей<\/i> терезеден айдын шооласы түшүп турат.<\/td><td>Кулболду <i>карыя<\/i> эмгекчил адам эле.<\/td><\/tr><\/table><\/div>"}],"sub":[],"pages":[75,76]},{"title":"29-§. Толуктооч, анын милдетин аткаруучу сөз түркүмдөрү","blocks":[{"t":"h3","h":"29-§. ТОЛУКТООЧ, АНЫН МИЛДЕТИН АТКАРУУЧУ СӨЗ ТҮРКҮМДӨРҮ"},{"t":"box","h":"<b>Толуктооч – сүйлөмдүн айкындооч мүчөсү.<\/b> Ал кыймыл-аракет багытталган заттын атын көрсөтөт. Ал барыш, табыш, жатыш, чыгыш жөндөмөлөрдүн суроолоруна жооп берет жана ушул жөндөмөлөрдө келет. Суроолору: кимге? эмнеге? кимди? эмнени? кимде? эмнеде? кимден? эмнеден? ким менен? эмне менен? ким жөнүндө? эмне жөнүндө? ким аркылуу? эмне аркылуу?"},{"t":"p","h":"Мисалы: 1. <b><i>Билимдүүгө<\/i><\/b> <i>дүйнө жарык.<\/i> 2. <i>Ачууну токтоо-лук менен жеңе бил.<\/i> (Мак.) 3. <i>Жаштарда жалындуу жаштык бар.<\/i>"},{"t":"p","h":"<span class=\"pg\" data-n=\"77\">77<\/span>Толуктоочтор: кимге жарык? – <i>билимдүүгө —<\/i> толуктооч – барыш жөндөмөдө; эмнени жеңе бил? – <i>ачууну —<\/i> толуктооч, табыш жөндөмөдө; эмне менен? – <i>токтоолук менен<\/i> – толуктооч, мында жөндөмө мүчөнүн ордуна менен деген жандооч катышты; кимдерде бар? — <i>жаштарда —<\/i> толуктооч, жатыш жөндөмөдө."},{"t":"p","h":"Толуктооч менен баяндоочтун ортосунда башкаруу байланышы бар."},{"t":"p","h":"Толуктоочтун милдетин төмөнкү сөздөр аткарат:"},{"t":"v","l":["1. Зат атооч: <b><i>Отту<\/i><\/b> <i>жаккан билет,<\/i> <b><i>малды<\/i><\/b> <i>баккан<\/i> <i>билет.<\/i>","2. Ат атооч: <b><i>Силерде<\/i><\/b> <i>кадимкидей күч-кубат бар.<\/i>","3. Заттык маанидеги сөз түркүмдөр:","а) сын атооч: <b><i>Жакшыга<\/i><\/b> <i>айтсаң билет.<\/i>","б) сан атооч: <b><i>Алтоону<\/i><\/b> <i>балдар куттукташты.<\/i>","в) атоочтук: <b><i>Экскурсиядан<\/i> <i>келгендерге<\/i><\/b> <i>жолуктум.<\/i>","г) кыймыл атооч: <b><i>Барууга<\/i><\/b> <i>шарт жок.<\/i>"]},{"t":"p","h":"<b>145.<\/b> Текстти окугула. Адегенде баяндоочту тапкыла, андан кийин ал аркылуу суроо берип, толуктоочту көрсөткүлө. Ал кандай суроого жооп берди, кайсы жөндөмөдө турат?"},{"t":"p","h":"Биз Даниярды ошондо биринчи жолу көрдүк. Ал дагы биз менен араба айдашты. Чынын айтайын, Данияр киши менен сүйлөшчү эмес. Ал дайыма суунун жанындагы үймөк чөптөргө барып жата турган."},{"t":"p","h":"Эртеси аттарды кырманга алып келдик. Арабаларга эгиндер жүктөлүп бүткөн соң, биз станцияга жөнөдүк. Ошол күндөрү биз бардыгын жеңиш үчүн жасаганбыз. (Ч.А.)"},{"t":"p","h":"Үлгү: <i>Даниярды ошондо биринчи жолу көрдүк.<\/i> Эмне болду? – <i>көрдүк<\/i> – баяндооч; кимди көрдүк? – <i>Даниярды<\/i> – толуктооч; кимди? деген суроого жооп берди, табыш жөндөмөсүндө."},{"t":"p","h":"<b>146.<\/b> Көчүргүлө. Сүйлөм мүчөлөрүнүн астын сызгыла. Толуктоочту атагыла, ал баяндооч менен кандайча (жөндөмө мүчөлөр же жандооч) байланышты? Толуктооч кайсы сөз түркүмүнөн болду?"},{"t":"p","h":"1. Эрди эл өстүрөт, гүлдү жер өстүрөт. 2. Улууну сен сыйласаң, кичүү сени сыйлайт. (Мак.) 3. Жапар эгинди көпкө тиктеп турду. 4. Тизмектелген Ала-Тоонун чокуларына <span class=\"pg\" data-n=\"78\">78<\/span>күн нурун чачты. (К.Б.) 5. Акындарды жаман деп, кепти кайдан табасың? (Т.) 6. Окуучулар эмгек ардагерлери менен жолугушту. Алар ыймандуулук жөнүндө айтып беришти."},{"t":"p","h":"<b>147.<\/b> Оозеки же жазуу түрүндө синтаксистик талдоо жүргүзгүлө. Кайталанып келген <i>бийик, телеграмма, китеп<\/i> деген сөздөр сүйлөмдүн кайсы мүчөлөрүнөн болушту? Салыштыргыла, түшүндүргүлө."},{"t":"p","h":"1. Кыраандар бийиктикти сүйүшөт, бийиктикке уялашат. Алар бийик учууну каалашат. 2. Телеграмма алысты жакын кылат. Биз телеграмма аркылуу агайын-туугандарыбызга<sup>2<\/sup> ар кандай кабарларды билдиребиз. Жакында айылдан телеграмма алдым. 3. Билбегенди билгизген китеп менин жакыным. Кымбаттуу балдар, адабий китептерди көбүрөөк окугула. («А»)"},{"t":"p","h":"<b>148.<\/b> Окугула. Жөндөмө мүчө уланган же жандооч менен келген толуктоочту тапкыла. Кайсы толуктооч жөндөмө мүчөсүз келди?"},{"t":"p","h":"1. Эмгек өмүрдү узартат, уят<sup>1<\/sup> бетти кызартат. 2. Жакшы менен сүйлөшсөң, көңүлүң ачылат. 3. Гүлдөн жылан уу жыйнаса, аары бал жыйнайт. (Мак.)"},{"t":"v","l":["4. Пейли бузук кишиге","Ички сырын айтпагын.","Алты саның соо болсо,","Бекер карап жатпагын.","(Т.)","Айтышса намыс алсын деп,","Алпештеп сени баккамын.","Алдыңдан чыккан душманды","Арстандай чапчып таштагын.","(Ж.Б.)"]},{"t":"p","h":"Үлгү: 1) <i>Эмгек өмүрдү узартат, 2) уят бетти кызартат.<\/i> Эмнени узартат? – <i>өмүрдү—<\/i> толуктооч, табыш жөндөмөсүндө; эмнени кызартат? – <i>бетти —<\/i> толуктооч – табыш жөндөмөсүндө."},{"t":"p","h":"<b>149.<\/b> Текстти окугула. Адегенде баяндоочту, андан кийин баяндоочтон суроо берип, толуктоочту тапкыла. Анын кайсы жөндөмөдө турганын же жандооч менен келген учурун аныктагыла. Толуктооч сүйлөмдүн кайсы мүчөсү менен байланышат?"},{"t":"h3","h":"ЖАКШЫ СӨЗ – ЖАРЫМ ЫРЫС"},{"t":"p","h":"Биздин ата-бабаларыбыз сөздү урматташкан. Айтор жакшы сөз кичинекей балага да, чоң кишиге да аябай<sup>2<\/sup> керек. Демек, сөздүн улуулугу ушунда."},{"t":"p","h":"<span class=\"pg\" data-n=\"79\">79<\/span>Кыргыз эли сөзгө өзгөчө маани<sup>1<\/sup> берген. Бир сөзгө жыгылып, атынан түшүп бергендер да болгон. Бир сөз үчүн өмүр кыйылган учурларды да билебиз."},{"t":"p","h":"Дүйнөнүн миң түркүн сырын баамдап көргүлөчү. Улуу ачылыштар жана жакшылыктар сөздөн башталат экен. Биз баарыбыз рухий жактан бай болууга аракеттенишибиз керек. Ал үчүн жакшы сөз керек. Жакшы сөз айтууга үйрөнгүлө. («КТ»)"},{"t":"p","h":"Үлгү: <i>Биздин ата-бабаларыбыз сөздү урматташкан.<\/i> Эмне кылышкан? – <i>урматташкан<\/i> – баяндооч, эмнени урматташкан?— <i>сөздү<\/i> – толуктооч, табыш жөндөмөдө; баяндооч менен байланышты."},{"t":"p","h":"<b>150.<\/b> Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Толуктоочту көрсөткүлө, ал кайсы сөз түркүмүнөн болду?"},{"t":"p","h":"1. Абышканын жомогу балдарды<sup>2<\/sup> кызыктырды. 2. Ак булуттарды көпкө чейин карап отурдум. Булут туманга айланды. Ал асманды чулгай баштады. 3. Тил кылычтан өткүр. Карынын<sup>2<\/sup> кебин капка сал. Пил көтөрбөгөндү тил көтөрөт. Достук менен бир туугандык бардык байлыктан артык. Жакшыга айтсаң, билет. Жаманга айтсаң, күлөт. (Мак.)"},{"t":"p","h":"Үлгү: <i>Абышканын жомогу балдарды кызыктырды.<\/i> Эмне болду? – <i>кызыктырды<\/i> – баяндооч; эмнеси? – <i>жомогу<\/i> – ээ; кимдерди кызыктырды? – <i>балдарды<\/i> – толуктооч, зат атоочтон болду; кимдин жомогу? – абышканын – аныктооч."},{"t":"p","h":"<b>151.<\/b> Окугула. Сүйлөмдөрдү өз ара салыштыргыла. Толуктоочту таап, анын сүйлөмдөгү ордуна көңүл бургула. Кандай өзгөчөлүктү байкадыңар? Мындай өзгөчөлүк эмнеге байланыштуу?"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>1. Окуучулар<sup>1<\/sup> <i>гүл<\/i> алып келишти.<\/td><td><i>Гүлдү<\/i> окуучулар алып келишти.<\/td><\/tr><tr><td>2. Мен <i>китеп<\/i> сатып алдым.<\/td><td><i>Китепти<\/i> мен сатып алдым.<\/td><\/tr><tr><td>3. Биз театрдан <i>оюн<\/i> көрдүк.<\/td><td>Биз <i>оюнду<sup>1<\/sup><\/i> театрдан көрдүк.<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"80\">80<\/span><b>152.<\/b> Окугула. Ээ менен толуктоочту тапкыла. Аларды бири-бирине салыштырып, ар биринин өзүнө тиешелүү белгилерин аныктагыла."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>1. <i>Балдар<\/i> мектепке келишти.<\/td><td>Энем балдарды издеди.<\/td><\/tr><tr><td>2. <i>Алар<\/i> жакшы иштешти.<\/td><td><i>Аларга<\/i> сыйлык берилди.<\/td><\/tr><tr><td>3. Бүгүн <i>оюн<\/i> болот.<\/td><td>Биз <i>оюн<\/i> көрөбүз.<\/td><\/tr><tr><td>4. <i>Адам<\/i> баарынан улуу болуп жаралган.<\/td><td><i>Адамга<\/i> адамча мамиле жасоого үйрөн.<\/td><\/tr><\/table><\/div>"}],"sub":[{"title":"ЖАКШЫ СӨЗ – ЖАРЫМ ЫРЫС","b":20}],"pages":[76,80]},{"title":"30-§. Толуктоочтун түзүлүшү","blocks":[{"t":"h3","h":"30-§. ТОЛУКТООЧТУН ТҮЗҮЛҮШҮ"},{"t":"p","h":"Грамматикалык түзүлүшү боюнча толуктооч жөнөкөй жана тутумдаш болот. Жөнөкөйү бир сөздөн, тутумдаш толуктооч бир нече сөздүн тизмегинен түзүлөт."},{"t":"p","h":"Мисалы: 1. <i>Ала-Тоонун чокуларына күн<\/i> <b><i>нурун<\/i><\/b> <i>чачты.<\/i> 2. <b><i>Эже<\/i> <i>кийгенди<\/i><\/b> <i>сиңди киет.<\/i> (Мак.) Толуктоочтор: эмнесин чачты? <i>– нурун<\/i> (жөнөкөй); эмнени киет? – <i>эже кийгенди<\/i> (тутумдаш)."},{"t":"p","h":"Тутумдаш толуктооч төмөнкүдөй сөздөрдүн тизмегинен түзүлөт:"},{"t":"p","h":"а) Маани берүүчү сөздөрдөн: <b><i>Билек<\/i> <i>жирей<\/i> <i>албаганды<\/i><\/b> <i>билим жирейт.<\/i> Эмнени? – <i>билек жирей албаганды<\/i> тутумдаш толуктооч."},{"t":"p","h":"б) Маани берүүчү сөз менен кызматчы сөздөн: <b><i>Окуучулар<\/i> <i>жөнүндө<\/i><\/b> <i>көп сөз болду.<\/i> Кимдер жөнүндө? – <i>окуучулар жөнүндө<\/i> – тутумдаш толуктооч."},{"t":"p","h":"в) Туруктуу сөз айкашынан (фразеология): <b><i>Беш<\/i><\/b> <b><i>өрдөгүн<\/i> <i>учургандарга<\/i><\/b> <i>кезиктим.<\/i> Кимдерге? – <i>беш<\/i> <i>өрдөгүн учургандарга<\/i> – тутумдаш толуктооч, фразеология."},{"t":"p","h":"<b>153.<\/b> Окугула. Баяндоочтон суроо берип, толуктоочту тапкыла, анын түзүлүшү кандай? Толуктооч кайсы сөз түркүмүнөн болду?"},{"t":"p","h":"1. Жаман малын коруйт, жакшы арын коруйт. 2. Жакшыга жанаш, жамандан адаш. 3. Жакшы сөзү менен сооротот, жаман токмогу менен ыйлатат. 4. Анын көрөр көзүнө жолуктум. 5. Ичи тарды ит кабат. (Мак.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"81\">81<\/span><b>154.<\/b> Ажыратылган сөз тизмектерин өз ара салыштыргыла: 1) алардын ар бири сүйлөмдүн кайсы мүчөсү? 2) түзүлүшү кандай? 3) алар кайсы сөз менен кандайча байланышты?"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>1. <i>Жашагысы келген<\/i> адамды эл сыйлайт.<\/td><td><i>Жашагысы келген<\/i> эл сыйлайт.<\/td><\/tr><tr><td>2. <i>Иш билбеген<\/i> адамга ишиң түшпөсүн.<\/td><td><i>Иш билбегенге<\/i> ишиң түшпөсүн.<\/td><\/tr><tr><td>3. <i>Сен окуган<\/i> китепти мен да окуп чыктым.<\/td><td><i>Сен окуганды<\/i> мен да окуп чыктым.<\/td><\/tr><tr><td>4. <i>Өзүм билем деген<\/i> адамга сыр айтпа.<\/td><td><i>Өзүм<\/i> <i>билем<\/i> <i>дегенге<\/i> сыр айтпа.<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"Үлгү: 1) <i>Жашагысы келген адамды эл сыйлайт.<\/i> Кандай адамды? – <i>жашагысы келген<\/i> – тутумдаш аныктооч, <i>адамды<\/i> деген толуктоочту аныктады. 2) <i>Жашагысы келгенди эл сыйлайт.<\/i> Кимди сыйлайт? – <i>жашагысы келгенди<\/i> – тутумдаш толуктооч, <i>сыйлайт<\/i> деген баяндооч менен байланышат."},{"t":"p","h":"<b>155.<\/b> Адегенде сол жактагы сүйлөмгө көңүл буруп, толуктоочту тапкыла. Түзүлүшү кандай? Кандай суроого жооп берди? Ушул эле сүйлөмдү оң жактагы сүйлөм менен салыштыргыла. Бөлүнгөн сөз тизмегинин бирде аныктооч, экинчи учурда толуктооч болушу эмнеге байланыштуу?"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>1. <i>Абийирин сактай албаган<\/i> адамдан алыс бол.<\/td><td><i>Абийирин сактай албагандан<\/i> алыс бол.<\/td><\/tr><tr><td>2. <i>Досу көп<\/i> адамды жоо албайт.<\/td><td><i>Досу көптү<\/i> жоо албайт.<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>156.<\/b> Кашаанын ичиндеги суроонун ордуна толуктоочтук маанидеги сөздү ойлоп таап, сүйлөмдөрдү көчүргүлө. Толуктооч сүйлөмдө кандай мааниде колдонуларын түшүндүргүлө. Ал аныктоочтон кандайча айырмаланат?"},{"t":"p","h":"1. (Эмне менен?) сен көп нерсеге жетише аласың. 2. Баланы (эмнеге?) үйрөтпөгүн, жашоодо белен оокат табылбастыр. 3. Биз (эмне жөнүндө) кеңештик. 4. (Эмнени?) эне жек көрөт. 5. – Адепти кимден (кимден?) үйрөндүм."}],"sub":[],"pages":[80,81]},{"title":"31-§. Бышыктооч, анын милдетин аткаруучу сөз түркүмдөрү","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"82\">82<\/span>31-§. БЫШЫКТООЧ, АНЫН МИЛДЕТИН АТКАРУУЧУ СӨЗ ТҮРКҮМДӨРҮ"},{"t":"box","h":"<b>Бышыктооч – айкындооч мүчөнүн бир түрү. Баяндооч менен байланышып, кыймыл-аракеттин ар түрдүү белгисин билдирет.<\/b> Кайда? кайдан? кандай? канчанчы? качан? эмне үчүн? ж.б. суроолорго жооп берет."},{"t":"p","h":"Мисалы: 1. <i>Элебес экөөбүз<\/i> <b><i>үйгө<\/i><\/b> <i>келдик.<\/i> (М. Э.) Кайда келдик? – <i>үйгө<\/i> – бышыктооч; кыймыл-аракеттин ордун. 2. <i>Кулболду карыя<\/i> <b><i>жакшы<\/i><\/b> <i>сүйлөдү.<\/i> (К. <i>Б.)<\/i> Кандай сүйлөдү? – <i>жакшы<\/i> – бышыктооч, кыймыл-аракеттин сыпаты көрсөтүлдү."},{"t":"p","h":"Бышыктооч барыш, табыш, жатыш, чыгыш жөндөмөлөрүндө келет, же жандооч кошулуп айтылып, баяндооч менен башкаруу же ыкташуу жолу аркылуу байланышат."},{"t":"p","h":"1. <i>Чегиртке<\/i> <b><i>итиреңдеп<\/i><\/b> <i>тура калды.<\/i> (Т.С.) Кантип тура калды? – <i>итиреңдеп —<\/i> бышыктооч, баяндоочко ыкташты."},{"t":"p","h":"2. <i>Аскат<\/i> <b><i>көл<\/i> <i>жээгинде<\/i><\/b> <i>эс алды.<\/i> Кайда эс алды? – <i>көл жээгинде<\/i> – бышыктооч, баяндооч экөөнүн ортосунда башкаруу байланышы бар."},{"t":"p","h":"Бышыктоочтун милдетин төмөнкү сөздөр аткарат:"},{"t":"v","l":["1. Зат атооч: <i>Айгүл<\/i> <b><i>Наманганда<\/i><\/b> <i>туруучу.<\/i>","2. Сын атооч: <i>Сабыр ата казак тилин<\/i> <b><i>жакшы<\/i><\/b> <i>биле турган.<\/i>","3. Сан атооч: <i>Каныбек асманды карай<\/i> <b><i>эки<\/i><\/b> <i>атты. (К.Ж.)<\/i>","4. Тактооч: <b><i>Кечээ<\/i><\/b> <i>ата-энелердин жыйналышы болду.<\/i>","5. Чакчыл: <i>Какелей<\/i> <b><i>чамгарактап<\/i><\/b> <i>Керезге атырылды.<\/i> (Ш.Б.)"]},{"t":"p","h":"<b>157.<\/b> Тексттерди көркөм окуп, сүйлөмдө кыймыл-аракеттин ордун, сыпатын, мезгилин ж.б. белгилерин билдирген сөздү көрсөткүлө. Ал сүйлөмдүн кайсы мүчөсү болот?"},{"t":"p","h":"1. Ошондон бери Гүланда менен тез-тез көрүшө турган болдум. Азыр да ушул жерде жашайт. Экөөбүз тең бала-чакалуу болдук. Сүйүүнүн сүрөттөрү азыр деле жаңы сыяктуу. Бирок ал сүйүүлөр жүрөктүн тереңинде калды. Мен аны ар дайым көргүм келет. (А.Т.)"},{"t":"p","h":"II. Эшендин да, Айдиштин да Москвага биринчи келиши. Ала-Тоолук алтоо он күндүн ичинде атактуу музейлерде болушту. Чоң-чоң заводдорго барышып, жаштардын иштери менен таанышышты. Алар менен бир туугандарча пикир алышты. (Т.С.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"83\">83<\/span>Үлгү: <i>Ошондон бери Гүланда менен тез-тез көрүшө турган болдум.<\/i> Эмне кыла турган болдум? – <i>көрүшө турган болдум —<\/i> баяндооч. Кандай көрүшө турган болдум? – <i>тез-тез<\/i> —бышыктооч, баяндооч менен байланышты; качандан бери? – ошондон бери – бышыктооч, кыймыл-аракеттин мезгили көрсөтүлдү."},{"t":"p","h":"<b>158.<\/b> Көп чекиттин ордуна кыймыл-аракеттин ордун, мезгилин, сыпатын, сан-өлчөмүн, себебин билдирген сөздү коюп жазгыла. Ал сүйлөмдүн кайсы мүчөсү болду? Кайсы сөз түркүмү?"},{"t":"p","h":"1. (Кайда?) ... бир нече космонавттар учуп жөнөштү. 2. Биздин айылдаштар (качан?) ... келишет. 3. Динар чоң энесине (кандай?) ... сүйлөдү. 4. С. Шарипов космоско (канчанчы? ... жол салган. 5. Отургандар (эмне үчүн?) ... күлүп жиберишти."},{"t":"p","h":"<b>159.<\/b> Көчүргүлө. Сүйлөм мүчөлөрүнүн астын сызгыла. Андан кийин айкындооч мүчөлөрдүн ортосундагы байланыштын жолун сызык менен көрсөткүлө. Кайсы айкындоочтор баяндооч менен байланышат?"},{"t":"p","h":"1. Кечинде Чолпон жылдызы жаркырап көрүнөт. 2. Тилек мергенчиликтин жайын жакшы билет. 3. Тянь-Шань кышта жылуу, жайда салкын. 4. Быйыл биздин жайлоо байчечекейдей гүлдөдү. 5. Асманда алтын Ай ак булуттарды жиреп баратат. 6. Гүлүма Сатардын үйүн көздөй кетти."},{"t":"p","h":"Үлгү:"},{"t":"img","src":"data:image/webp;base64,UklGRqIeAABXRUJQVlA4IA4IAABQPQCdASqAAmwAPrVUo06nJCOiIfHsEOAWiWlu4XNBG/OZ8m/3rtL/0fhv4zfJkvLuUzM/c79j4RHiDwAvU3+p398An5d/Tv1g8YL+Z9H/rh7AH8l/rfFCUA/55/jPVd/qf/h/oPPj+ef532EP1tHsgyJq3ATUFDCsdSNOokrGjCKq0AmoIpPGPWVg+73tdOiEa+i4/pvBFVaAgrIzGlEl/cjJtf4nPJnUBZUvVfw8yighFKCVedIdhYjpXAeI5lzDv+yRaeaE0ko9ElYJLhmWLCsZkMCzyT6FLnKnYZLX6a533DpEVi+1zsm1B+XU6wwv4vifb8TjYd+qte1cDZzswdSVrtv6Zby/5QSzV7X+sikD6lNtYlGCgIkbPa533DpEVi7bNEXbZ4I2Ee9rkJHXStEI19Fx/BkeKqfPt0VKEH3e9rp0Qh52+4sU9SlAKtcY+Dps9oeez2ioIRWL7UYJ1gFgrvwEeI4XWkVHHd296fZpv2PEzFCmKVoM4X2PX/9o+4dMjzcXMKZm3S7sfzE4DXWL6y3mGtcLs4dIhZNBCKxfa532zjj4ia0idFppYPBs54Wgbvoj1Hd+a6QFY/v+fxzdja7nYQ/UWz2imImOoKEEV4qql7XOy242exAl0EWunRCNeQccuZHVqs4yn2kD2WYAAP7eDhukDyONTFDXvCZi/sjaXxzAg6shzRXfZ6QD9I9sOI4rhD+s7tQnDEr3Y3CJISuvGkdiIFLUf8oykYeDR4OA+B4cVKM9AmnXHoaP20/s5BX0zOo6qA5Hi77tMVYs9GZHI48LIWND8tSC5a97qbSXjA4PX7pzDrmjqt0xkotMM7WE1oQHAAcHtCezitFadzzqo+c3lDAhO2prAeJ3u6XdBT5UTt+Hki7hjdOceoj463V1aaDl2lxMX+7rmWvmzjiMx0+uHKTKU267oIwymNzm3PcfpyuVdLp81y81IA3Wua3jEcASMMH7XrE3Bz6Xe6UXogV+1LuXGff1GxWMJTUr/IjDuu3S0FNpLEhUiwt8x+1peAleMv8a1YJt6eofw3nTrv1CFTs+TxK9lBYaA5zejti9+PTGlnSQ/8dUBTpHNTboRn7TnKMQdE8v6UVRhNwv76UOBXLUFBeTnDYkj9R5nsDQ3k146HiH2hnuNaW2ymgB AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9lhA734DmzIzgAvJjrrom17CPlBL1HRyLhGCQOzPW2eLO+UPDo8LNdjk3eU60lPeUCaHxmIB0Xx+4+6ggW5SGPhUxwA=","w":640,"ht":108},{"t":"v","l":["башкаруу","башкаруу","башкаруу"]},{"t":"p","h":"<i>Быйыл Талант менен айылга бардым.<\/i>"},{"t":"p","h":"<b>160.<\/b> Окугула. Бышыктоочту тапкыла. Бышыктоочтун милдетин кайсы сөз түркүмү аткарды?"},{"t":"p","h":"1. Чүкөбай үйдөн жаш балача чуркап чыкты. (К.Б.) 2. Күзүндө айылдан мага телеграмма келди. (Ч.А.) 3. Космосту изилдөө иши азыр өркүндөтүлүп жатат. («КТ»)"},{"t":"v","l":["<span class=\"pg\" data-n=\"84\">84<\/span>4. Кечээ күнкү күрпүлдөгөн долу Чүй,","Эпке келип бүгүн бизге багынды. (Ж.Т.)","5. Биз Ташкент шаарына окууга барабыз."]},{"t":"p","h":"Үлгү: <i>Чүкөбай үйдөн жаш балача чуркап чыкты.<\/i> Эмне болду? <i>—чуркап чыкты —<\/i> баяндооч; кандайча чуркап чыкты? – <i>жаш балача<\/i> – бышыктооч, кыймыл-аракеттин сыпатын билдирди (жаш – сын атооч, <i>балача<\/i> – тактооч); кайдан чуркап чыкты? – <i>үйдөн<\/i> – бышыктооч, кыймыл-аракеттин ордун билдирди (зат атооч)."},{"t":"p","h":"<b>161.<\/b> Окугула. Аныктоочту жана бышыктоочту тапкыла, өз ара салыштыргыла. Алар кайсы сөз менен байланышарын эсиңерге сактагыла."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>1. Гүлүма <i>көңүлдүү<\/i> (кандай?) ырларды ырдады.<\/td><td>Гүлүма <i>көңүлдүү<\/i> (кандай?) ырдады.<\/td><\/tr><tr><td>2. <i>Алты<\/i> (канча?) бала университетке өттү.<\/td><td>Нурлан университетке <i>алты<\/i> (канча?) келди.<\/td><\/tr><tr><td>3. Жээрде тайдын <i>аргымак<\/i> <i>сыяктуу<\/i> (кандай?) сыны бар.<\/td><td>Жээрде тай <i>аргымак<\/i> <i>сыяктуу<\/i> (кандай?) жүгүрдү.<\/td><\/tr><tr><td>4. Шаарда <i>бийик<\/i> (кандай?) үйлөр салынып жатат.<\/td><td>Самолёт <i>бийик<\/i> (кандай?) учат.<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>162.<\/b> Сүйлөм мүчөлөрү боюнча талдоо жүргүзүп, аныктоочту жана бышыктоочту өз ара салыштыргыла. Окшош белгилери кайсы? Айырмачылыгы эмнеде?"},{"t":"p","h":"1. Жакшы сөз сүйкүм угулат. – Талант университетте жакшы окуйт. 2. Жакшы адам сөзгө түшүнөт. – Мен төрт мезгилдин ичинен күздү жакшы көрөм. 3. Мыкты иштегендер сыйлыкка татыктуу болушту. – Биздин жаштар мыкты иштөөгө тийиш. 4. Балбандар атаандаштары менен төрт жолу беттешти. – Төрт карыя өз ара аңгемелешип отурушкан экен."},{"t":"p","h":"Үлгү: <i>Жакшы окуучу жакшы окуйт.<\/i> Эмне кылат? – <i>окуйт<\/i> – баяндооч; ким? – <i>окуучу<\/i> – ээ; кандай окуйт? —<i>жакшы<\/i> бышыктооч; кандай окуучу? – <i>жакшы<\/i> – аныктооч. Аныктооч да, бышыктооч да— экөө тең бирдей суроого жооп берди – бул окшош жагы, айырмачылыгы – аныктооч зат (окуучу), бышыктооч кыймыл-аракет (окуйт) менен байланышты."},{"t":"p","h":"<span class=\"pg\" data-n=\"85\">85<\/span><b>163.<\/b> Көчүрүп жазып, бышыктооч менен толуктоочтун астын сызгыла. Алардын окшош белгилерин жана айырмачылыгын түшүндүргүлө."},{"t":"v","l":["1. Эмгек <i>бакытка<\/i> жеткирет.","2. Мал <i>кыштан<\/i> семиз чыкты.","Сүрөт тартыш үчүн <i>айылга<\/i> бардым.","Биз <i>театрдан<\/i> «Айчүрөктү» көрдүк."]}],"sub":[],"pages":[82,85]},{"title":"32-§. Бышыктоочтун түзүлүшү","blocks":[{"t":"h3","h":"32-§. БЫШЫКТООЧТУН ТҮЗҮЛҮШҮ"},{"t":"p","h":"Бышыктооч түзүлүшү боюнча жөнөкөй жана тутумдаш болот. Мисалы: 1. <i>Мен сага бүгүн бүт өмүрүмдү айтып бердим.<\/i> 2. <i>Сууга жеткенде Данияр арабаны токтотту.<\/i> (Ч.А.) Качан айтып бердим? – <i>бүгүн—<\/i> жөнөкөй бышыктооч; качан токтотту? – <i>сууга жеткенде<\/i> – тутумдаш бышыктооч. Тутумдаш бышыктооч төмөнкүдөй сөздөрдүн тизмегинен түзүлөт:"},{"t":"p","h":"а) Маани берүүчү сөздөрдүн: <i>Окуучулар<\/i> <b><i>пахта<\/i> <i>талаасында<\/i><\/b> <i>болушту.<\/i> Кайда болушту? <i>– пахта талаасында —<\/i> тутумдаш бышыктооч."},{"t":"p","h":"б) Маани берүүчү сөз менен кызматчы сөздөн: <i>Шамбет<\/i> <b><i>келери<\/i> <i>менен<\/i><\/b> <i>ишке киришти.<\/i> (Т.С.) Качан киришти? <i>– келери менен —<\/i> тутумдаш бышыктооч."},{"t":"p","h":"в) Фразеология жана чакчыл түрмөктөн: 1. <b><i>Көз<\/i> <i>ачып<\/i> <i>жумганча<\/i><\/b> <i>Бектурган ордунан турду.<\/i> (А.Т.) Качан ордунан турду? – <i>көз ачып жумганча<\/i> – тутумдаш бышыктооч, фразеология. 2. <b><i>Аганы<\/i> <i>көрүп,<\/i><\/b> <i>ини өсөт.<\/i> (Мак.) Кантип өсөт? – <i>аганы көрүп –<\/i> тутумдаш бышыктооч, чакчыл түрмөк."},{"t":"p","h":"Чакчыл түрмөк да, фразеологиялык айкаш да бир эле суроого жооп берип, сүйлөмдүн бир мүчөсү болот."},{"t":"p","h":"Чакчыл түрмөк сүйлөмдүн ар кайсы жеринде: башында, ортосунда, аягында келип, жазууда үтүр менен ажыратылат: <b><i>Баланы<\/i> <i>карап,<\/i><\/b> <i>Айтике отура калды.<\/i> (А.Т.) <i>Айтике,<\/i> <b><i>баланы<\/i> <i>карап,<\/i><\/b> <i>отура калды. Айтике отура калды,<\/i> <b><i>баланы<\/i> <i>карап.<\/i><\/b>"},{"t":"p","h":"Чакчыл түрмөк бир өңчөй түрүндө да келет: <b><i>Чоң<\/i> <i>арабакечтерди<\/i> <i>туурап,<\/i> <i>камчыны<\/i> <i>сүйрөй,<\/i><\/b> <i>жайбаракат бастым.<\/i> (Ч.А.) Кантип бастым? – <i>чоң арабакечтерди туурап, камчыны сүйрөй<\/i> – бир өңчөй бышыктооч, чакчыл түрмөк."},{"t":"p","h":"<span class=\"pg\" data-n=\"86\">86<\/span><b>164.<\/b> Бышыктоочту тапкыла. Анын түзүлүшү кандай? Чакчыл түрмөк жөнүндө эмне билесиңер? Эсиңерге түшүргүлө. Чакчыл түрмөктөн болгон бышыктоочтун өзгөчөлүгү жөнүндө айтып бергиле. Тоо-токойлорго коңур салкын күз келди. Жайдын ысыгы өттү. Жайлоодон мал түшүп, төмөн кыштоосуна кетти. Тоотокой аңгырап ээн калды."},{"t":"p","h":"Анда-санда шаңшып коюп, асманда жалгыз бүркүт каалгыйт. Ташкындап аккан суунун шары башталды. Шыралжын куурай болду. Талдын жалбырактары дирилдеп түшүп турду."},{"t":"p","h":"Тоо баштарына, күндө кабатталып, кар жаайт. Күндө эртең менен карасаң, кечээги кара кырлар кар жамынып жатат. Капчыгай ылдый эртели-кеч ызгаар шамал болот."},{"t":"p","h":"Кайың, тал кызыл сары түскө боёлгон. Алар кечке жуук кубулжуп турат. Бирок бүгүн эртеден бери, карлуу тоону жаңыртып, таандардын тынчы кетти. (Ч.А.)"},{"t":"p","h":"<b>165.<\/b> Бөлүнгөн сөздөрдү өз ара салыштыргыла. Алар сүйлөмдүн кайсы мүчөлөрү, ар бири эмнени билдирет?"},{"t":"v","l":["1. Биздин <i>айылга<\/i> (кайда?) артисттер келишти.","2. Сыдык алгачкы билимди <i>айылдан<\/i> (кайдан?) алган.","3. Кыздар <i>окууга баруу үчүн<\/i> (эмне үчүн?) чарчабай иштешти.","4. Бала <i>ат менен<\/i> (эмне менен?) келди.","Биздин <i>айылга<\/i> (эмнеге?) быйыл кырк жыл толот.","Биз алгачкы билимди <i>Дүйшөндөн<\/i> (кимден?) алганбыз.","Бизде <i>жаштар үчүн<\/i> (кимдер үчүн?) бардык шарттар бар.","Бала ханга <i>жолдун ортосу менен<\/i> (каяк менен?) барды."]}],"sub":[],"pages":[85,86]},{"title":"33-§. Бышыктоочтун түрлөрү","blocks":[{"t":"h3","h":"33-§. БЫШЫКТООЧТУН ТҮРЛӨРҮ"},{"t":"p","h":"Берген мааниси боюнча бышыктоочтун төмөнкүдөй түрлөрү бар. Жадыбалга көңүл бургула."},{"t":"raw","h":"<div class=\"tbl\"><span class=\"pg\" data-n=\"87\">87<\/span><table><tr><td><b>Бышыктоочтун түрлөрү<\/b><\/td><td><b>Суроолору<\/b><\/td><td><b>Мисалдар<\/b><\/td><\/tr><tr><td>Сыпат<\/td><td>кантип? кандайча? кандай?<\/td><td>Электр шамдары жылдыздай (кандай?) жаркырады.<\/td><\/tr><tr><td>Орун<\/td><td>кайда? кайдан? каякка? каяктан? каерде?<\/td><td>Алайдагы Көк-Сууга (кайда?) бардык.<\/td><\/tr><tr><td>Мезгил<\/td><td>качан? качанга чейин? качантан бери? кайсы убакта?<\/td><td>Бүгүн (качан?) Ысык-Көлдөн келдик.<\/td><\/tr><tr><td>Себеп<\/td><td>эмне үчүн? эмне себептүү?<\/td><td>Кубангандан (эмнеликтен) Сабырдын жонунан тер кетти.<\/td><\/tr><tr><td>Максат<\/td><td>эмне үчүн? эмнеге? кандай максатга? эмне кылууга?<\/td><td>Балдар оюн көрүү үчүн (эмне үчүн?) келишти.<\/td><\/tr><tr><td>Сан өлчөм<\/td><td>канча? нече? канчанчы?<\/td><td>Алар мелдеште биринчи (канчанчы?) келишти.<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>166.<\/b> Окугула. Бышыктоочторду тапкыла, алардын мааниси кандай? Кайсы сөз түркүмүнөн болду? Баяндооч менен кандайча байланышты?"},{"t":"p","h":"Биз космонавттардын тобуна биринчи жолу кошулдук. Дарыгерлер мындай деп алдын ала эскертишти:"},{"t":"p","h":"– Дене жагынан такшалуу – силердин экинчи канатыңар. Ансыз космос жөнүндө ойлонуунун кереги жок."},{"t":"p","h":"Биздин шаарчабыздагы токойдо жалгыз аяк жол бар. Биз ар күнү эртең менен ушул жерден кезигишебиз. Жайында да, кышында да космонавттар ушул жерде дене тарбиясын аткарышат. («КМ»)"},{"t":"p","h":"<b>167.<\/b> Мезгил, орун, сыпат бышыктоочторду тапкыла. Аталган бышыктоочтор эмне үчүн колдонулду? Текстте кептин кайсы түрү пайдаланылды?"},{"t":"p","h":"Түштөн кийин биз, адаттагыдай, айылга шашпай кайтып бара жаткан элек. Асманда жылдыздар төгүлүп, көз байланып, түн кирип калган кез. Айлана уктап жаткансып тыптынч<sup>3<\/sup> жана жымжырт. Даниярдын обону жүрөктү эркелетет."},{"t":"p","h":"Жамийла бул жолу, колун<sup>2<\/sup> Даниярга сунуп, арабаны кармап, башын эңкейте, ээрчип келе берди. Бир убакта Даниярдын обону кайра бийик көкөлөп, үнү күч<sup>1<\/sup> алды."},{"t":"p","h":"Бул обон башкаларга окшобогон махабаттын жаңы обону эле. (Ч.А.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"88\">88<\/span><b>168.<\/b> «Жакшы адамдар жаныңда» деген тема боюнча кыскача аңгеме жазып келгиле. Оюңарды кеңири жана толук берүүдө айкындооч мүчөлөрдүн түрлөрүн колдонууга аракеттенгиле."},{"t":"p","h":"<b>169.<\/b> Окугула. Бышыктоочту таап, анын түзүлүшүн аныктагыла. Кайсы сүйлөмдө негизги кыймыл-аракет элестүү жана ачык-так көрсөтүлдү?"},{"t":"v","l":["1. Жапар Айшаны тике карады. (К.Б.)","2. Манас баатыр келе жаткансыйт. (К.Ж.)","3. Данияр арабаны жайыраак айдады. (Ч.А.)","4. Бурма ыйлап жиберди.","<i>Башын көтөрүп,<\/i> Жапар Айшаны тике карады.","<i>Аккуласын алкынтып,<\/i> Манас баатыр келе жаткансыйт.","<i>Шаркырап аккан сууга жеткенде<\/i> Данияр арабаны жайыраак айдады.","<i>Даниярды катуу-катуу кучактап,<\/i> Бурма ыйлап жиберди."]}],"sub":[],"pages":[86,88]},{"title":"34-§. Сүйлөмдөгү сөздөрдүн орун тартиби","blocks":[{"t":"h3","h":"34-§. СҮЙЛӨМДӨГҮ СӨЗДӨРДҮН ОРУН ТАРТИБИ"},{"t":"p","h":"Сүйлөмдөгү сөздөр өзүлөрүнүн синтаксистик кызматына ылайык түгөй-түгөйү менен аныкталат: 1) ээ менен баяндоочтун орду; 2) аныктооч жана аныкталгычтын орду; 3) толуктооч жана баяндоочтун орду; 4) бышыктооч жана баяндоочтун орду."},{"t":"p","h":"Сүйлөмдө ээ мурда, баяндооч андан кийин келип, түз орун тартиби боюнча орун алышат: <b><i>Жаз<\/i> <i>—<\/i> <i>жарыш,<\/i> <i>күз<\/i> <i>—<\/i> <i>күрөш.<\/i><\/b>"},{"t":"p","h":"Аныктооч аныкталуучу сөздөн мурда келет: 1. <b><i>Өмүрдүн<\/i><\/b> <i>кубанычы – эмгек.<\/i> 2. <b><i>Калдайган<\/i> <i>кара<\/i><\/b> <i>булут уламдан-улам көтөрүлүп келет.<\/i>"},{"t":"p","h":"Аныктоочтор: <i>өмүрдүн, калдайган кара. Аныкталуучу сөздөр: кубанычы, булут.<\/i>"},{"t":"p","h":"Толуктооч менен бышыктооч өздөрүн башкарган баяндоочтон мурда келет: 1. <i>Ал<\/i> <b><i>Жапарга<\/i><\/b> <i>кайрылды. —<\/i> Кимге? – <i>Жапарга<\/i> толуктооч, баяндоочтон мурда келди."},{"t":"p","h":"2. <i>Күн<\/i> <b><i>уясына<\/i><\/b> <i>батып баратат. (К.Б.)<\/i> Кайда? – уясына – бышыктооч, баяндоочтон мурда келди."},{"t":"p","h":"<span class=\"pg\" data-n=\"89\">89<\/span>Бул – сөздөрдүн көндүм болгон түз орун тартиби. Бирок сөздөрдүн түз орун тартиби дайым эле сакталбайт. Стилдик максатка, ырдын уйкаштыгын сактоого ж.б. байланыштуу алардын орду кээде өзгөрүлүп да колдонулат."},{"t":"p","h":"Мисалы: <i>Чапкан билет тулпарды, таптаган билет шумкарды. (Мак.)<\/i> Мында <b>тулпарды, шумкарды<\/b> деген толуктоочтор <b>билет<\/b> деген баяндоочтордон кийин келишти."},{"t":"p","h":"<b>170.<\/b> Сүйлөмдөгү сөздөрдүн орун тартибин өз ара салыштыргыла. Кайсынысында ой-пикир ырааттуу болуп турат? Эмне үчүн?"},{"t":"p","h":"1. Биз<sup>1<\/sup> силердин ишиңерге ыраазыбыз. – Биз ыраазыбыз ишиңерге<sup>2<\/sup> силердин. 2. Эл-журт Дүйшөнкулду узатуу үчүн чогулушту. – Эл-журт Дүйшөнкулду чогулушту узатуу<sup>3<\/sup> үчүн. 3. Акыркы менин оюм иш жүзүнө ашты. – Акыркы оюм менин ашты иш жүзүнө. 4. Аппак шекер жамынган айлана тыптынч. – Айлана аппак шекер жамынган тыптынч. 5. Нарын суусу ак көбүгүн чачыратат. – Суусу Нарын чачыратат ак көбүгүн."},{"t":"p","h":"<b>171.<\/b> Сүйлөмдөгү сөздөрдүн түз орун тартибине көңүл бургула. Ээрчишүү байланышында ээ кайсы орунда турууга тийиш. Ал эми башкаруу байланышында баяндоочко башкарылган сөздөрдүн түз орун тартиби кандай?"},{"t":"h3","h":"УЧКУЛ СӨЗДӨР"},{"t":"p","h":"1. Жаман киши ишеничти актабайт, өз абийирин сактабайт. 2. Баласына атасы акыл айтат, акылга көнгөн баладан эмгек кайтат. 3. Бир жолу калп айтсаң, өмүр бою калпычы атың өчпөйт. 4. Жоого жалынба, доско таарынба. 5. Эр энеден туулат, элге кызмат кылат."},{"t":"p","h":"<b>172.<\/b> Көчүргүлө. Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Алардын сүйлөмдөгү адат болгон түз орун тартиби жөнүндө айтып бергиле."},{"t":"p","h":"Токтогул ырын токтотту да, курбусу<sup>2<\/sup> экөө айылга бастырып кетишти. Кыз-келиндердин артынан<sup>3<\/sup> жете барышты. Токтогулдар кыз-келиндерди<sup>4<\/sup> жандап бастырып бара жатышат. Алардын күлкүлөрү көбөйдү. Акын комузун алды да, жагымдуу үн менен ырдап коё берди. <i>(Ж.Б.)<\/i>"},{"t":"p","h":"<span class=\"pg\" data-n=\"90\">90<\/span><b>173.<\/b> Сүйлөмдүн тутумундагы сөздөрдү түз орун тартибине келтирип, көчүргүлө. Аларды сүйлөм мүчөлөрү боюнча талдагыла. Аныктооч менен аныкталгычтын, бышыктооч менен баяндоочтун сүйлөмдөгү орун тартиби кандай?"},{"t":"p","h":"1. Толтурду кампага кызылды эл жайлай эмгектенген. 2. Жыттанат сопсонун гүлдөрү тоонун. 3. Төрөлгөмүн мен жерде бийик тоолуу. 4. Күн сайын сулуулугуна анын таң калчумун мен. 5. Чыктык тоого эртең менен биз. Аскат көрчү жакшы учкуч болууну."},{"t":"p","h":"<b>175.<\/b> Бышыктоочту көрсөткүлө, ага төмөнкүдөй тартип боюнча мүнөздөмө бергиле: а) кандай суроого жооп берди? б) кайсы сөз менен байланышты? в) кайсы сөз түркүмүнөн болду? г) түзүлүшү кандай?"},{"t":"p","h":"1. Күзүндө Жалал-Абаттагы Каралма токоюнун көрүнүшү укмуштуудай болот. 2. Сени тиктеп, күлүңдөп түрдүү жемиштер турат. (Н.Б.) 3. Шүүдүрүм баскан жаш гүлдөр жүгүнүп нурга карашты. 4. Асманда сызып баратып, алдына Сырга карады. (Ж.Б.) 5. Көз ачып жумганча барылдап ыйлаган баланын дабышы чыкты. 6. Кыз, жер-сууну сагынгандай, Ала-Тоону телмирип карайт. (Т.С.)"},{"t":"v","l":["Ала-Тоо – өмүрүмдүн гүлдүү багы,","Ала-Тоо кечээкиден бүгүн жаңы. (Р.Ш.)"]},{"t":"p","h":"<b>176.<\/b> Бышыктоочтун түрлөрүн эсиңерде сактагыла. Алардын ар бирин өзүнчө катыштырып, бирден сүйлөм түзгүлө. Бышыктооч сүйлөмдүн кайсы мүчөсүнө багынат?"},{"i":912,"page":90,"t":"img","src":"data:image/webp;base64,UklGRlAjAABXRUJQVlA4ILwMAADwPgCdASrxANMAPrVUpU2nJKOiJfH6iOAWiU3fj5McG+dJkfRSPYH06rX3oY1v6ddi/av3Afwf/HdKv+ifs97hv41/pfUB/TP8n+6Xv++g//9eoB///T/9QDnzv3d+Ef+s/9T92fbL////x7fPpd+mX+Q8Jv6P/wNtavLrCfrn4g/FLQA/jHlC+79jFkv+g/Vj2CPWX6D+vfvkTDv+HTb6f94MZd0e/WvsL/x0lLQKZ6cyP1f4zFr//8s5ZuyTLstApluLn4Tq0+FWLgs9OZIEii8fJ58GtBJFhhNqvKmgUzxsZxY62gNZxFQX9LWB//UAjfnKTv0cpCg/Z02GT6xqt6l+ON/1q//6sYak9OQRZ8Ez4mabgy9KFT+2Sf/0UEsgALOaB6quRvcF9Ohtku1zGL//TVf+DQl9pCEcZLqN/urfFSvqE шы билишет. Акылман аксакалдар жаштарды чындыкты бетке айтып, арамдыктан алыс болууга тарбиялашкан, аларды сөз менен куралдандырган."},{"t":"p","h":"Сөз – байлык. Оозунда сөзү бар адам – алтынга бай адам. Дүйнөдө чексиз нерселер көп. Ошонун бири – ушул сөз. Карап көрчү, үйдө, жолдо, сабакта – баардык жерде сөз колдонулат. айтор, сөз адамды аба сыяктуу курчап турат. Баарыбызга жакшы сөз керек. Эл да жакшы сөзгө муктаж."},{"t":"p","h":"Ошентип, сөздүн тазалыгы – пейилибиздин, жан дүйнөбүздүн тазалыгы. («КБ»)"},{"t":"p","h":"<b>179.<\/b> Көчүргүлө. Сүйлөм мүчөлөрүнүн астын сызгыла. Андан кийин бышыктоочко талдоо жүргүзүп, төмөнкү суроолорго жооп бергиле: а) түзүлүшү кандай? б) кайсы сөз түркүмүнөн болду? в) эмнени билдирет? г) баяндооч менен кандайча байланышты?"},{"t":"p","h":"1. Ошондо көпчүлүккө эптеп баш-көз болуп жүргөнүмө азыр да сыймыктанам. (Ч.А.) 2. Хан шарап ичкенден кийин алтын чөйчөктү дасторконго койду. («Жом».) 3. Көз байланган кезде Керимахун базар жактан келди. (К.Ж.) 4. Теректер ар кандай үнгө салып шуулдайт."},{"t":"p","h":"Үлгү: <i>Ошондо көпчүлүккө эптеп баш-көз болуп жүргөнүмө азыр да сыймыктанам.<\/i> Качан сыймыктанам? – <i>азыр да<\/i> – мезгил бышыктооч; тутумдаш, <i>азыр<\/i> – тактооч, <i>да<\/i> – бөлүкчө; кыймыл-аракеттин мезгилин билдирди."},{"t":"p","h":"<b>180.<\/b> Схемага көңүл бургула. Сүйлөмдүн айкындооч мүчөлөрүнүн түрлөрүн эсиңерге сактагыла. Алардын ар бирине экиден сүйлөм түзүп келгиле."},{"t":"img","src":"data:image/webp;base64,UklGRsQbAABXRUJQVlA4IDAFAAAwIwCdASr4AGIAPrVUo0unJSMhrXkoIOAWiU3bq93oHI5R+w5vNso/+fuF+oDml/x79iPcJ/L/9V6gP5H/gvX/9JP/56f/d0f2n+Gv9yv2qzLl+XWe73doH7Xwv/m3xJ92CbfufoA/K/5n67kyD/5o/2HvgTeg6WkWp2jfnr0ntsvgSAKKQzt6s+wZQ8jeHO1DrCpWZFX/NwvqQbpopqn7zDfTKOeTQgYi0mwiGCG/N3GJ6n2lft6v20Q0kv1UeYhNMQM29+AAO5KiPlXkcLdeI/FOdys91oKXWsaEk4z16oj/UX2n+OG1kxGrsseIDTk+gwX/eYBXfnGB4LkzK2AbxGLjiZWDu7jfDz491NjgWV1qnjoMG/mjnO1zm1O0jtKwUAD++KQAB+T7RsmInUnetD2Pvef1tSBYZs4HRDmVRv1gbNYBmaKLVwDIKzF+PiGPpO30i9sMC7MH34zQGk/20vokVR0VBfEgis AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD2WEAaMX/Wx0iyseIIcAfFND2ZYBHyTjAeqWpIMiOiOYBRe2/BhGv0ThQOZqH5oIQxGHZOdYd5MzlOgXoImqAvNwfFAA==","w":640,"ht":68},{"t":"v","l":["кайда? ↓ Күн ааламга -.-.-.-.-.","кандай? ↓ <b>~~~~~~~~<\/b> алсыз","эмнесин? ↓ – – – – – нурун","чачыратты."]},{"t":"p","h":"<b>181.<\/b> Сүйлөм мүчөлөрү боюнча оозеки талдоо жүргүзгүлө. Айтылыш максаты жана грамматикалык түзүлүшү боюнча кандай сүйлөмдөр бар?"},{"t":"p","h":"1. Сөз – улуу тарбиячы, акылман насаатчы. 2. Демек, сөз баарынан күчтүү. 3. Ошон үчүн сөз билген адам улуу деп эсептелет. 4. Адам баласы сулуу болуп жаралган. 5. Жылуу сөз анын ажарын ого бетер ачат. («КБ») 6. Алаканын шак коюп, Талап ордунан турду. 7. Ал дагы – бирөөнүн алмончоктой <span class=\"pg\" data-n=\"93\">93<\/span>баласы. («АТ») 8. Кайран энең Каныкейдин көзүнүн жашы он талаа. («Манас»)"},{"t":"p","h":"<b>182.<\/b> Сүйлөм мүчөлөрү боюнча талдоо жүргүзүп, төмөнкү суроолорго жооп бергиле: а) сүйлөмдүн кайсы мүчөлөрүнүн ортосунда ыкташуу байланышы бар? б) башкаруу байланышы кайсы мүчөлөрдүн ортосунда болот? в) баш мүчөлөр – бири-бири менен кандайча байланышат?"},{"t":"p","h":"Карымшак Боомдун капчыгайына жалгыз келатат. Жалгыз жолоочуга жол арбымак өзүнчө бир балакет. Кеч күзгө чейин мөңгүсү эрибеген бийик тоолордун ала моюн кыл чокулары алыскы бийиктен бүлбүл көрүнөт. (С.Рыскулов)."},{"t":"p","h":"Үлгү: <i>Карымшак Боомдун капчыгайына жалгыз келатат. Бул сүйлөмдө төрт сөз айкашы бар.<\/i>"},{"t":"v","l":["1. Карымшак келатат – ээрчишүү","2. Боомдун капчыгайына – таандык байланыш","3. Жалгыз келатат – ыкташуу байланыш","4. Капчыгайында келатат – башкаруу байланыш"]},{"t":"p","h":"<b>183.<\/b> Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө."},{"t":"h3","h":"БАКА МЕНЕН ЧЫЧКАН"},{"t":"p","h":"Ошентип, бака менен чычкан дос болду. Күндөрдүн биринде бака чычканды конокко чакырды. Бака жээктен сууну көрүп, чыдабай секирип түштү. Ал сүзүп жөнөдү. Артынан чычкан да секирүүгө камынат. Бирок сүзгөндү билбей, суудан аябай тумчугат. Акыры эптеп суунун аркы четине чыгат."},{"t":"p","h":"Ошондон кийин чычкан конокко барбай койду."},{"t":"p","h":"<b>184.<\/b> Окугула. Чакчыл түрмөктү тапкыла. Ал сүйлөмдүн кайсы мүчөсү? Ага сөз түркүмү боюнча талдоо жүргүзгүлө. Тыныш белгисинин коюлушун түшүндүргүлө."},{"t":"p","h":"1. Ажар, кыбырап ордунан туруп, жолуна түштү. Түн кирди. Сулуу Ай чыгыш жактан көтөрүлдү, алтын бууга боёлуп, мээримсиз караңгылыкты алда кайда кубалап, кең талааны кубантты. Талаа да жылмайып койнун ачып, кучагын жайып, Ажарга жол берди."},{"t":"p","h":"Ажар бир аз жол жүргөндө, артынан көп нерсенин улуганы угулду. Ажардын жүрөгү дүпүлдөп, оюна коркуу сезимдери келди. (К.Б.)"},{"t":"v","l":["<span class=\"pg\" data-n=\"94\">94<\/span><b>Кайталоо үчүн суроолор:<\/b>","1. Сүйлөмдүн грамматикалык негизин кайсы мүчөлөр түзөт?","2. Ээнин милдетин аткаруучу сөздөргө мисал келтиргиле.","3. Баяндооч көбүнчө кайсы сөз түркүмүнөн болот?","4. Кайсы учурда баш мүчөлөрдүн ортосуна сызыкча коюлат?","5. Жандама мүчөгө мисал келтиргиле.","6. Аныктооч эмнени билдирет, зат менен кандайча байланышат?","7. Аныктооч менен бышыктоочтун айырмасы кандай?","8. Толуктооч сүйлөмдүн кайсы мүчөсү менен байланышат?","9. Бышыктооч эмнени билдирет?","10. Чакчыл түрмөк сүйлөмдүн кайсы мүчөсү болот?","11. Атоочтук түрмөк сүйлөмдүн кайсы мүчөсү болот?","12. Сүйлөм мүчөлөрү түзүлүшүнө карай кандай болуп бөлүнүшөт?","13. Толуктооч менен бышыктоочтун айырмасы эмнеде?","14. Сүйлөм мүчөлөрүнүн түзүлүшү жөнүндө эмне билесиңер?"]}],"sub":[{"title":"ООЗЕКИ ТАЛДООНУН ҮЛГҮСҮ","b":2},{"title":"ЖАЗУУ ТҮРҮНДӨ ТАЛДООНУН ҮЛГҮСҮ","b":6},{"title":"БАКА МЕНЕН ЧЫЧКАН","b":16}],"pages":[92,94]},{"title":"36-§. Сүйлөмдүн бир өңчөй мүчөлөрү","blocks":[{"t":"h3","h":"36-§. СҮЙЛӨМДҮН БИР ӨҢЧӨЙ МҮЧӨЛӨРҮ"},{"t":"v","l":["Бир өңчөй мүчөлөргө мүнөздүү белгилер;","а) бирдей суроого жооп беришет;","б) бирдей сүйлөм мүчөлөрү болушат;","г) бирдей формада келишет (уңгу түрүндө же мүчө уланган түрүндө)."]},{"t":"p","h":"Бир өңчөй мүчөлөр өз ара тең укукта болуп, бири экинчисине багынбайт."},{"t":"p","h":"Мисалы: 1. <i>Жыйырма сегиз баатырдын ичинде<\/i> <b><i>орустар,<\/i> <i>казактар,<\/i> <i>кыргыздар<\/i><\/b> <i>бар эле. (Ж.Б.)<\/i> 2. <i>Ажар арт жагын<\/i> <b><i>карайт,<\/i> <i>жүгүрөт,<\/i> <i>шашат.<\/i><\/b> (К. <i>Б.)<\/i> 3. <b><i>Жуунуп,<\/i> <i>таранып<\/i><\/b> <i>мектепке баралык.<\/i>"},{"t":"p","h":"Биринчи сүйлөмдөгү бир өңчөй мүчөлөр: <i>орустар, казактар, кыргыздар<\/i> (кимдер?) – ээ, зат атооч, уңгу түрүндө. Экинчисинде; <i>карайт, жүгүрөт, шашат<\/i> (эмне кылат?) – баяндооч, этиш. Үчүнчүсүндө: <i>жуунуп, таранып<\/i> (кантип?) – бышыктооч, чакчыл этиш."},{"t":"p","h":"Бир өңчөй мүчөлөр затты, кыймыл-аракетти жана алардын белгилерин санап көрсөтөт, ошондуктан саноо интонациясы менен айтылып, жазууда алардын араларына үтүр коюлат."},{"t":"p","h":"Ошентип, <i>сүйлөмдө бирдей суроого жооп берип, синтаксистик бирдей милдет аткарып, сүйлөмдүн бир гана мүчөсү менен байланыш-катыш жасаган жана өз<\/i> <span class=\"pg\" data-n=\"95\">95<\/span><i>ара тең байланышта келген сүйлөм мүчөлөрү<\/i> бир өңчөй мүчөлөр <i>деп аталат.<\/i>"},{"t":"p","h":"Кыргыз тилинде сүйлөмдүн бардык мүчөлөрү бир өңчөй болот."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td><\/td><td><b>Сүйлөмдөрдүн бир өңчөй мүчөлөрү<\/b><\/td><td><b>Мисалдар<\/b><\/td><\/tr><tr><td>1<\/td><td>Бир өңчөй ээ<\/td><td><i>Байкемдин ордун басып,<\/i> <b><i>иним,<\/i> <i>жеңем,<\/i><\/b> <b><i>сиңдим,<\/i> <i>агайындар<\/i><\/b> <i>турбайбы<\/i> (Ш.С.)<\/td><\/tr><tr><td>2<\/td><td>Бир өңчөй баяндооч<\/td><td><i>Адам үчүн адамгерчилик<\/i> – <b><i>асыл<\/i> <i>кымбат.<\/i><\/b> (К.Ж.)<\/td><\/tr><tr><td>3<\/td><td>Бир өңчөй аныктооч<\/td><td><b><i>Чыдамкай,<\/i> <i>токтоо,<\/i> <i>эмгекчил<\/i> <i>адам<\/i><\/b> <i>гана баарын жеңет<\/i><\/td><\/tr><tr><td>4<\/td><td>Бир өңчөй толуктооч<\/td><td><i>Мен сенин<\/i> <b><i>билимиңди,<\/i> <i>тажрыйбаңды,<\/i> <i>адамгерчилигиңди<\/i><\/b> <i>сыйлаймын<\/i> (Т.С.)<\/td><\/tr><tr><td>5<\/td><td>Бир өңчөй бышыктооч<\/td><td><b><i>Бизден<\/i><\/b> <i>да,<\/i> <b><i>шаардан<\/i><\/b> <i>да жүздөн ашык киши алып барышкан экен<\/i> (М.Э.)<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>185.<\/b> Бир өңчөй мүчөлөрдүн саноо интонациясын туура сактап, текстти көркөм окугула. Бир өңчөй мүчөлөргө мүнөздүү белгилерди атагыла. Текстте кептин кайсы түрү колдонулду?"},{"t":"p","h":"Балага мээрим дүйнөдөгү жалпы жанзаттарга мүнөздүү. Куштар да, айбандар да өздөрүнүн балдарын эркелетет жана этияттап бойго жеткирет. Бирок перзент алдындагы милдетин аң-сезимдүү жана жогору даражада өтөө бир гана инсанга мүнөздүү."},{"t":"p","h":"Биздин улуттук салттарыбызда да ата-эненин перзент алдындагы милдети алгач ага ат коюу, аны багуу, үстүн бүтүн кылуу, өнөр, илим үйрөтүү, жакшылардын катарына кошуу, бойго жеткенде үйлүү-жайлуу кылуудан турат. Эненин милдети баласына ак сүтүн берүү, энелик мээримин берүү, аны таза кийинтүү жана ооруга чалдыктырбастан тарбиялоодон турат. Бул милдеттерди ата-энеден бөлөк эч ким аткара албайт. Мисалы, бирөөнүн баласына башка бир аял анын энесиндей алдей айта албайт. Эненин алдейинде анын бар мээрими баяндалган. Же болбосо эч ким өзүнүн атасындай башын сылап насыят кыла албайт. Ошондуктан да бул өтө татаал милдет."},{"t":"p","h":"<b>186.<\/b> Схемага көңүл бургула. Сүйлөмдүн бир өңчөй мүчөлөрү бирдей суроого жооп берерин, бирдей сөз түркүмүнөн болорун, бирдей жөндөмөдө келерин жана бир эле сөзгө байланышарын эсиңерде сактагыла."},{"t":"p","h":"<i>Коңур күз Ажарды кытыгылады, эркелетти, ойготту.<\/i>"},{"t":"v","l":["<span class=\"pg\" data-n=\"96\">96<\/span>Жел","кытыгылады,","эркелетти,","ойготту.","эмне кылды?"]},{"t":"img","src":"data:image/webp;base64,UklGRvgrAABXRUJQVlA4IGQVAADQbACdASoeAXYBPrVYpU8nJKMiIhXqUOAWiWdu/HRZUI2o6dnjPvnD1R1Eu7264/J7Zf7Ae4D9AdDv6iP4r/qvyO+AH85/v/7Y+/56FP/h6f/p++oBz3n/f/5XwnfuX+4Htef/XWgfHH9X9HXfr+l/t3kT+IfNv4f8xfkwvV9hOpr8c+/f6P+8+bf7A+IvwE/zv7/7AX5L/OP854iOyD0v9yfUF9jPoX+z/uv9y8hP/Z/s3qP/Lf3v2AP1g/2XleeCL97/3nsB/z7+/+fj/6f7f0B/nH+g/9/uI/y7+9+mz7WfRBHV3d3d3aVsR0xsXDqm570FmmH28MHm5MPpxHrj4f7O2/SLTK/qSsIROqb/n/mDN46fJM73YF7SkCCu7erfiot9FcEh8nKx07UZMKQIlfXXwKrRIhTUC2dnVgJReaRPiGHgv1SubAt4CMx0HdPxTcJzm55Jjsvih0OIvgCbKw3gG0jJzLJoerCY2EwYKwCOguu1OxfkYnzNtuZiv+23FNQ5mJWMwghS7IVds5SpCLrVSCfGegj/NSS/DY9OqqqqyOpFuihJFq2HILkIBvrUA/qGJ/Wyu1B3EAAxkIPyqqqqqydGTBiZf4oGpVpnMrhEREREREREREREREREREREREREREREREREQ8DJgPq5qLIVOFfxqj8naBI0yGUCC0kKyzZ1gLINQsKAvILFpbJBWlCvyh/2X3rMD6Zqxa/yMHyL1JBu2hOlbzSTJ0FoaGmkmJddAIRH7RivT6IMLIDcQn61kUi1YMbTgKV0U/SVyNuKsNDmkErR1M8TIc2h0/dTGxA5deXqRmFPGgBf4WgytF+ElAja1EPre6S4jb+RbcC47MP5xjZMPDKjBC0LKYN/o+CxYg1vXa20kbnB50uMe2VQbToNVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVU426Gi8pp3qUtpVVVVVVURuTYPm/9Z6/kzxXbsihXoCT8NLkOAT/ARnCifw2hoV+YCa8hQyzuRlxc7fugzWLe8eVYkxQhb2SFt5V0ufvX85L65R5IImaW/87Mh9vW48Zscrs7BW2aBdDn72RQqg2oKLRbt87QBrZiNFaJQAelyzusREREQ89Igh84KSFFmfKqqqqqqqqzhsAA/v7+FHv7Zq1zuuXkSbg9VyZ/b+QwpUbecKVxxBgijh0gJ3qZXaeCcsSRpYsdMMOskY22wVrffowEQN25yCdvqr/qI9oxQXL96KN4JcfqwrOYLFwwh7/fV0u3RB8fSHwqXOHRpuuyM2mlU3iONU/0h6I0c/3jNevvDuXmCCRuV3RFQBuoamkqvF1RooJUOBeuh7qCXVmfteJ7NTvBrsFS5wS26/1k2DrkIZ67iVeobnSI9mmnHFmorSCxJ/qXhrYylS3P0crDqecDhFDvxkWp0ajC/V+jRZB3O7vWF3eBIL9JGtw4fU538tq99v4Kr3Qfdar/T7mQU8+XCt/NDg8+hiVjat/pLHi0kZtFiH/mnOcasmHbugA2G503UvX1pwJWCgWoLTCmH3k7d7MWyiqdvUOrhD0Hwh9kWgNwnclFPcdafLn AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9lhArsEZF4DXUZo5n8Xa+JHJ2f1Fi5cs07hwxYgYT7xY8inIqd+WXKzgw/+nrbekORulxti7RcRhsXCkrfDSRyu78QA=","w":262,"ht":340},{"t":"p","h":"<b>189.<\/b> Окугула. Бир өңчөй мүчөлүү сүйлөмдү таап көчүргүлө. Бир өңчөй мүчөлөргө тиешелүү белгилерди атагыла."},{"t":"h3","h":"<span class=\"pg\" data-n=\"97\">97<\/span>АДАМЗАТ ЭНЕ СҮТҮНӨН ЖАРАЛГАН"},{"t":"p","h":"Энелер – нарк-насилдүү, оор басырыктуу, айкөл адамдар. Дени сак улут эне аркылуу калыптанат. Саламаттык, бейпилдик, токтоолук энелер аркылуу келет. Ошон үчүн «эне таманы турган жер – бейиш» дешкен эмеспи акылман бабалар. Эне мээримине, аруулугуна эч нерсе тең келе албас, анткени эне адамзаттын башына түшкөн кыйынчылыкты жер сыяктуу кебелбей көтөрүп келет."},{"t":"p","h":"Кыргыз элинин нарк-насилин, каада-салтын жүрөгүндө кыттай сактаган, карылык дөөлөтү жүзүнөн төгүлгөн апаларды ким билбейт! Алардагы ички маданият, табигый жөнөкөйлүк кимди гана суктандырбайт! Ылайым, Каныкей, Курманжан, Толгонай сыяктуу энелерибиз эл ичинде аман болсун. Дайыма бар болуңуздар, касиеттүү энелер! («КТ»)"},{"t":"p","h":"Үлгү: <i>Энелер – нарк-насилдүү, оор басырыктуу, айкөл адамдар.<\/i> Кимдер? – <i>адамдар —<\/i> баяндооч; кандай адамдар? – <i>нарк-насилдүү, оор басырыктуу, айкөл<\/i> – бир өңчөй аныктоочтор кандай деген бирдей суроого жооп беришти, сын атоочтон болду; <i>адамдар<\/i> деген баяндооч менен байланышты."},{"t":"p","h":"<b>190.<\/b> Сүйлөмдүн бир өңчөй мүчөлөрүн тапкыла, алар кандай мааниде колдонулат? Саналып айтылган сөздөр сүйлөмдүн кайсы мүчөлөрү?"},{"t":"p","h":"1. Бир кезде Асан айткан айыл өзгөрдү, өстү. (Т.С.) 2. Адамдын сезимин, мүнөзүн, көз карашын, жүрүш-турушун тарбиялоодо айлана-чөйрөнүн таасири зор. Шашкеде<sup>3<\/sup>, чак түштө бешимде, кечинде күндүн күч-кубаты ар башкача болот. Ошондой эле адам баласы да өз өмүрүнүн шашкесин, чак түшүн, бешимин, кечин жашайт. (Ш.Б.) 3. Тоолор чоң элечек оронгон энедей бейпил, сүйкүмдүү жана кооз. 4. Арча кышында да, жазында да, жайында да көгөрүп турат. 5. Кучак жайып солдатка жүгүрүп баратканыбызда биз өзүбүз менен кошо бүт турмушубузду, азап-тозогубузду, дайрадай<sup>3<\/sup> аккан көз жашыбызды, кайратыбызды алып бара жаттык. (Ч.А.)"},{"t":"p","h":"<b>191.<\/b> Берилген сөздөрдү жана сөз айкаштарын бир өңчөй мүчөлөрдүн маанисинде колдонуп, ар бирине бирден сүйлөм түзгүлө. Бир өңчөй мүчөлөрдүн грамматикалык белгилери жөнүндө айтып бергиле."},{"t":"p","h":"<span class=\"pg\" data-n=\"98\">98<\/span>1) Фергана, Андижан, Наманган; 2) Сырдарыяда, Амударыяда; 3) кызыл сары, ак гүлдөр; 4) ырдоо, бийлөө; 5) ойго, тоого, тескейге, күңгөйгө саякат жасоо; 6) эрктүү, чыдамдуу жана кайраттуу; 7) мен да, сен да; 8) эмгек менен тынчтык."},{"t":"p","h":"<b>192.<\/b> Сүйлөмдү бир өңчөй мүчөлөр менен толуктап көчүрүп жазгыла. Тыныш белгилерин койгула. Алар сүйлөмдүн кайсы мүчөсүнүн милдетин аткарышты?"},{"t":"p","h":"1. Зат атооч... маани берүүчү сөз түркүмдөрү болуп эсептелет. 2. Кызматчы сөздөргө булар кирет: ... 3. ... – сүйлөмдүн баш мүчөлөрү. 4. ... – сүйлөмдүн айкындооч мүчөлөрү. 5. Синтаксистик байланыштын түрлөрү булар: ээрчишүү, ... 6. Кептин түрлөрү булар: ..."},{"t":"p","h":"Үлгү: <i>Зат атооч, сын, сан, ат атооч, этиш, тактоочтор маани берүүчү сөз түркүмдөрү<\/i> болуп эсептелет. Бир өңчөй мүчөлөрдүн араларына үтүр коюлду, алардын баары сүйлөмдө ээлик милдетти аткарышты."},{"t":"p","h":"<b>193. Да, жана, менен, ары, же<\/b> байламталарын колдонуу аркылуу бир өңчөй мүчөлүү сүйлөм түзгүлө. Бул үчүн төмөнкү схемаларды негиз катары пайдалангыла."},{"t":"v","l":["1. ○ ← □ да, □ да, □ .","2. □ жана □ ← ○ .","3. □ менен □ → ○ .","4. ары □, ары □ → ○","5. же, □ же □ → ○ ."]},{"i":998,"page":98,"t":"img","src":"data:image/webp;base64,UklGRuYfAABXRUJQVlA4IFIJAADQOACdASqAAi0APrVQo0ynJCMiJFUM+OAWiWkA2Myofzl2kf6/pivZXtxzUolnyr7l/p/7j6O/5jxR4BHqn/UeJDuD9W8wL1o+m9+tqrZAH8y/sfF6UB/0n6rX9d/5/9D6Evz3/Wewb+tm+YGA/zR3PfB1FgX5/WCcyT9gFeh3k3DKRRC8S2Vg2YOeagKYssgDHvgyOvkjv8GU+V0lNkIRVk4lK5+hQ2elwPkakJ8y4+F+wYv8rdnZDCQ2tgZcbW3jCV6BIGD+mAEzm3Y5TXuqIjNw0TlKVlQjgQPBtlEhUsXmKA/d8tvBmvpnOH/+IEdnMWuEzqRSgtXbIa6AaguW1nOPoch/GKNfKC8rp8NHehI+8Ot+jlyce0gGLvdgrszu3G8xTmD0LTMS8Msz3n3fohMOb9Q045bhs+rWmqMD6z6XP0+Lz5TzN4klgatxtMYtJ8TUZZQbaf3c1DLN8acZbQAOuQVpz2E6GHQBqk8HIo4pFxSVdipBNhn/sRhv0KpwukZgx7OeJkiUII2RBw0sixt+0mu4U24xAxHfrLUYVj2lWszSpHndTIsDK+TzxbGMVIWJphQ2fzMdJ/sTjaBdWb0uwCkmv2ML2ddUHfgAAP76AMvntLUN1mSQ9Fa5esVg99RLY5

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9lhARsElGZzs6Vs8DGPQ/y8TpdA2h8a9fob6XpK4rlcRFdkrmAlIBCBSPINppxndAfIzkgatWYuZm7sFduRh4xfOUAA=","w":640,"ht":45},{"t":"p","h":"<b>194.<\/b> көнүгүү. Окуп, бир өңчөй мүчөлөрдү тапкыла. Ал сүйлөмдүн кайсы мүчөсү жана кайсы сөз түркүмүнөн жасалды?"},{"t":"p","h":"1. Жайында ак, кызыл, көк, сары гүлдөр бажырайып ачылат. 2. Дүйнөдөгү ардактуу, кымбаттуу адам – эне. 3. Анын ырдаганы, сүйлөгөнү, бийлегени мага жагат. 4. Алина, Айдана жана Адеми класстагы үлгүлүү окуучулардан. 5. Асел да, Айнура да, Арлен да эмгекте үлгү көрсөтүштү."}],"sub":[{"title":"АДАМЗАТ ЭНЕ СҮТҮНӨН ЖАРАЛГАН","b":24}],"pages":[94,98]},{"title":"37-§. Бир өңчөй мүчөлөрдүн байланышуу жолдору жана тыныш белгиси","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"99\">99<\/span>37-§. БИР ӨҢЧӨЙ МҮЧӨЛӨРДҮН БАЙЛАНЫШУУ ЖОЛДОРУ ЖАНА ТЫНЫШ БЕЛГИСИ"},{"t":"p","h":"Бир өңчөй мүчөлөр бири-бири менен интонация жана байламталар аркылуу байланышат: 1. <i>Дүйшөнкул<\/i> <b><i>тартиптүү,<\/i> <i>кайраттуу<\/i><\/b> <i>жоокер болду.<\/i> (Ж.Б.) 2. <b><i>Клубда<\/i> <i>да,<\/i> <i>кампада<\/i> <i>да,<\/i> <i>сарайда<\/i><\/b> <i>да өчпөс шамдар күйүп турат.<\/i>"},{"t":"p","h":"Бир өңчөй мүчөлөр 1-сүйлөмдө <b><i>интонация,<\/i><\/b> экинчисинде <b><i>да<\/i><\/b> байламтасы аркылуу байланышты."},{"t":"p","h":"Байламаталар менен байланышкан бир өңчөй мүчөлөрдө үтүр төмөнкүдөй коюлат (төрт бурчтук шарттуу белги бир өңчөй мүчөлөрдү билдирет):"},{"t":"p","h":"1. Байламта бир нече ирет кайталанып, өзүнөн мурдагы сөзгө тиешелүү болсо, үтүр байламтадан кийин коюлат: <i>Жапарды<\/i> <b><i>Айша<\/i> <i>да,<\/i> <i>Уулкан<\/i> <i>да<\/i><\/b> <i>чоң кубаныч менен тосуп алышты.<\/i>"},{"t":"v","l":["□ да, □ да"]},{"t":"p","h":"2. Байламта бир нече ирет кайталанып, өзүнөн кийинки сөзгө тиешелүү болсо, үтүр байламтадан мурда коюлат (же байламтасы бир эле жолу келсе, үтүр коюлбайт): <i>Төрт түлүк мал же<\/i> <b><i>Ичкетөр,<\/i> <i>же<\/i> <i>Коңурөлөң<\/i><\/b> <i>ашуулары аркылуу Каракужурга ашат.<\/i>"},{"t":"v","l":["же, □ же □"]},{"t":"p","h":"3. <b><i>Жана,<\/i> <i>менен<\/i><\/b> сыяктуу кайталанбас байламта байланыштырса, үтүр коюлбайт: <i>Өлкөгө<\/i> <b><i>дарыгерлер<\/i><\/b> жана <b><i>мугалимдер<\/i><\/b> <i>керек.<\/i>"},{"t":"v","l":["□ жана □"]},{"t":"p","h":"<b>195.<\/b> Окугула. Сүйлөмдүн бир өңчөй мүчөлөрүн тапкыла. Алар бири-бири менен кандайча байланышты? Жазууда тыныш белгиси кайсы жерге коюлду?"},{"t":"p","h":"Өз ара аңгемелешүүдө, баарлашууда, талкуу учурунда айтылган кепке, маселеге карата ар кандай көз караштар, ойлор болушу толук ыктымал. Мындай шартта, бирөөнүн оюн билүү, өз оюн билдирүү, калыс сүйлөө, уга билүү сыяктуу кеп адептерин билген адам эч качан өзүн да, бирөөнү да ыңгайсыз абалда калтырбайт. Талаш-тартыштагы кеп адебин билүү анын канчалык деңгээлде адептүү, маданияттуу экендигин көрсөтүп турат."},{"t":"p","h":"<span class=\"pg\" data-n=\"100\">100<\/span>Айрым бир нерсе жөнүндө талаш-тартыш жүрүп калса, эч качан орой, осол сөздөрдү айтпоо керек. «Жылуу сөз жүрөктөгү музду да эритет», «Тилден уу да тамат, бал да тамат», «Тилдин сөөгү жок» деген сыяктуу кыска, бирок нуска накыл кептерде айтылгандай, ар бир сөздү орду менен, маани-маңыздуу, жылуужумшак, сылык, уккулуктуу, жагымдуу үн менен сүйлөөгө аракет кылуу керек. Чукчуңдап, көңүлгө катуу тиер сөздөрдү айтып, колун кезеп, көзүн чакчайтып, үнүнүн барынча кыйкырып, заарын чачып сүйлөө – жеткен адепсиздик."},{"t":"p","h":"<b>196.<\/b> Байламталар аркылуу байланышкан бир өңчөй мүчөлөрдүн жадыбалына көңүл бургула. Аларда үтүр белгисинин коюлушун эсиңерге сактагыла."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td><b>№<\/b><\/td><td><b>Байламталар<\/b><\/td><td><b>Мисалдар<\/b><\/td><\/tr><tr><td>1.<\/td><td>Байланыштыргыч: <i>да, дагы, менен, жана, ары, нары<\/i><\/td><td>Жоокерлер <i>кун да, түн да<\/i> чек араны кайтарышат.<\/td><\/tr><tr><td>2.<\/td><td>Ажыраткыч: <i>же, же, болбосо<\/i><\/td><td>Балдар <i>же<\/i> <b><i>бирден,<\/i><\/b> <i>же<\/i> <b><i>экиден<\/i><\/b> көчөт отургузушту.<\/td><\/tr><tr><td>3.<\/td><td>Каршылагыч: <i>бирок<\/i><\/td><td>Ал <b><i>кичине,<\/i><\/b> <i>бирок<\/i> <b><i>чымыр<\/i> <i>күчтүү.<\/i><\/b><\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<b>197.<\/b> Байламта аркылуу байланышкан бир өңчөй мүчөлөрдү колдонуп, катардагылардын ар бирине бирден сүйлөм түзгүлө. Тыныш белгисинин коюлушун түшүндүргүлө."},{"t":"p","h":"1) же зоотехник, же дарыгер, же мугалим; 2) энелер да, окуучулар да; 3) «Гулхан» жана «Гунча» журналы; 4) Чолпонбай менен Дүйшөнкул; 5) ары тартиптүү, ары эстүү, ары кичи пейил; 6) татаал, бирок кубанычтуу; 7) кыска, бирок мазмундуу."},{"t":"p","h":"<b>198.<\/b> Текстти окуп, бир өңчөй мүчөлөр кандайча байланышканын түшүндүргүлө. Кандай интонация менен окулганын байкагыла."},{"t":"p","h":"Мал багуу – кыйын, жооптуу жумуш. Кышында аларга жем, чөп берилет. Жайында жайлоого чыгарат, откорот. Адамдар жайлата чөп чаап, кургатып жыйнайт. Жайыттан келгенде аларга чөп да, жем да берилет. Короону кыш түшө электе жылуулап, тазалап даярдашат. Ошентип, мал кышында үшүбөй, ток болот. Аларды адам багат, карышкырдан кайтарат."},{"t":"p","h":"<span class=\"pg\" data-n=\"101\">101<\/span><b>199.<\/b> Сүйлөмдөгү бир өңчөй мүчөлөр өз ара кандай жол менен байланышканын айтып бергиле."},{"t":"p","h":"1. Козу, улак, музоо, кулун, тайлактар жаңы туулганда энесинин уузун эмишет. 2. Төрөлгөндө отугат да, чөп жегенге үйрөнүшөт. 3. Кыздар сулуу да, акылдуу да, билгич да, тартиптүү да болушат. 4. Койдун жүнүн машина менен да, кайчы менен да кыркышат. 5. Карагай менен арчалар дайыма жапжашыл. 6. Жамгыр да, кар да булуттан түшөт."},{"t":"p","h":"<b>200.<\/b> Көчүргүлө. Сөз түркүмү жана сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. <i>Менен, да, жана<\/i> деген сөздөрдүн морфологиялык белгисин жана синтаксистик кызматын аныктагыла."},{"t":"p","h":"1. Эрдин көркү— эл менен, эмгегиң менен элге жак. (Т.). Мен орден жана медалдар менен сыйландым. 3. Эрме чөл менен тоолордо электр нуру жайнады. (Ж.Б.) 4. Мыскал керилген тоолорго да, көгөргөн көлгө да суктана карайт. 5. Бир аздан кийин Шамбет да сөзгө аралашты. (Т.С.) 6. Жана Сагындык эмне деди?"},{"t":"p","h":"<b>201.<\/b> Көчүргүлө. Сүйлөмдүн бир өңчөй мүчөлөрүн таап, аларга тиешелүү тыныш белгини койгула. Тыныш белгинин коюлуш шартын түшүндүргүлө."},{"t":"p","h":"Балдар – турмуштун келечеги. Келечектин жумушчулары да мугалимдери да агрономдору да жазуучулары да окумуштуулары да балдардын катарынан өсүп чыгат. Ошондуктан биздин республикада жаш жеткинчектер менен бөбөктөргө бардык жагынан камкордук көрүлөт. Балдардын же билимдүү же кайраттуу же чымыр денелүү болуп өсүшүнө толук шарттар бар. Алар адамгерчиликтин ынтымактуулуктун жогорку деңгээлин көрсөтүүгө тийиш. Кымбаттуу балдар, талыкпай окуй бергиле."},{"t":"p","h":"<b>202.<\/b> <i>Да, же, бирок<\/i> байламталарын пайдаланып, өзүңөр бир өңчөй мүчөлүү жөнөкөй сүйлөм (ар бирине экиден) түзүп келгиле. Байламталардын кызматын жана тыныш белгилердин коюлушун түшүндүргүлө."},{"t":"p","h":"<b>203.<\/b> Схемага карата бир өңчөй мүчөлүү жөнөкөй сүйлөм түзгүлө. Алардын тыныш белгиси жөнүндө айтып бергиле."},{"t":"v","l":["1. □ , □ , □","2. □ да, □ да, □ да","<span class=\"pg\" data-n=\"102\">102<\/span>3. □ , бирок □ , □","4. □ менен □"]}],"sub":[],"pages":[99,102]},{"title":"38-§. Бир өңчөй мүчөлүү сүйлөмдөгү жалпылагыч сөз жана анын тыныш белгиси","blocks":[{"t":"h3","h":"38-§. БИР ӨҢЧӨЙ МҮЧӨЛҮҮ СҮЙЛӨМДӨГҮ ЖАЛПЫЛАГЫЧ СӨЗ ЖАНА АНЫН ТЫНЫШ БЕЛГИСИ"},{"t":"p","h":"Сүйлөмдө бир өңчөй мүчөлөрдүн маанисин жалпылаган жана чечмелеген сөздөр да болот. Булар жалпылагыч сөз деп аталат."},{"t":"p","h":"Бир өңчөй мүчөлөр сүйлөмдүн кайсы мүчөсү болсо, жалпылагыч сөз да сүйлөмдүн ошол мүчөсү болот. Жалпылагыч сөз бир өңчөй мүчөлөрдөн мурда да, кийин да келет."},{"t":"p","h":"Мисалы: 1. <i>Биздин урааныбыз булар: тынчтык, достук, бир туугандык.<\/i> Эмне? – <i>тынчтык, достук, бир туугандык —<\/i> бир өңчөй ээлер; жалпылагыч сөз – <i>булар<\/i> – ээ."},{"t":"p","h":"2. <i>Ала-Тоонун атыр жыттуу абасы мага да, сага да —<\/i> <b><i>баарыбызга<\/i><\/b> <i>ден соолук тартуулайт.<\/i> Кимге тартуулайт? – <i>мага, сага<\/i> – бир өңчөй толуктооч, жалпылагыч сөз <i>– баарыбызга<\/i> – толуктооч."},{"t":"p","h":"Жалпылагыч сөздө тыныш белгиси төмөнкүдөй коюлат:"},{"t":"p","h":"▨ – шарттуу белги жалпылагыч сөздү билдирет."},{"t":"p","h":"1. Жалпылагыч сөз бир өңчөй мүчөлөрдөн мурда келсе, өзүнөн кийин кош чекит коюлат: <i>Ал жерде<\/i> <b><i>баардыгы:<\/i><\/b> <i>дарыя да, токой да бар.<\/i> (Т.С.)"},{"t":"v","l":["▨ : □ да, □ да"]},{"t":"p","h":"2. Жалпылагыч сөз бир өңчөй мүчөлөрдөн кийин келсе, өзүнөн мурда сызыкча коюлат. <i>Беккул, Эшпай —<\/i> <b><i>экөө<\/i><\/b> <i>бөлүнүп кетти.<\/i> (М. <i>Э.)<\/i>"},{"t":"v","l":["□, □ — ▨"]},{"t":"h3","h":"Касым Тыныстанов (1901—1938)"},{"t":"p","h":"Касым Тыныстанов – маданият жана эл агартуу ишмери, педагог жана акын, көрүнүктүү түрколог. Ал терең билимдүү инсан болгон."},{"t":"p","h":"<span class=\"pg\" data-n=\"103\">103<\/span>Кыргыз тили боюнча мектептер үчүн биринчи окуу программаларын жана окуу китептерин («Кыргыз тилинин морфологиясы», 1934; «Кыргыз тилинин синтаксиси», 1936) жазган, орфографиялык эрежелерди калыптандырууга негиз салган."},{"t":"p","h":"Ошентип, К. Тыныстанов кыргыз тил илиминин өсүп-өнүгүшүнө зор эмгек сиңирген."},{"t":"p","h":"Кыргыз эли Чолпон жылдыздай жаркыраган залкар уулун ар дайым эскерет."},{"t":"p","h":"<b>204.<\/b> Көчүргүлө. Бир өңчөй мүчөлөр менен жалпылагыч сөздөрдүн тыныш белгисин койгула. Алардын эмне үчүн коюлгандыгын түшүндүргүлө."},{"t":"p","h":"1. Гүл токой күмүш кайың мырза терек баардыгы салты менен турса керек. 2. Тянь-Шань Тогузторо Алай Кабак баарына бул Фрунзе берген сабак. (А.Т.) 3. Максатташ үч кара ниет<sup>1<\/sup> Түркүн Сейнеш Журтбек катуу айыпка тартылсын. 4. Алгачкы келген төртөөнүн экөө Досоева Ира Байсалова Түгөл маңдайлары жарык чыгышты. (Ш.Б.) 5. Аялдар саламаттык сактоодо<sup>3<\/sup> илим менен техникада адабият менен искусстводо баардык жерде эмгектенип жатышат."},{"t":"p","h":"<b>205.<\/b> Көп чекиттин ордуна жалпылагыч сөздү таап жазгыла да, тыныш белгисин койгула. Жалпылагыч сөздүн сүйлөмдөгү ордуна көңүл бургула. Кош чекит же сызыкча белгисин коюуда эмнени эске алабыз?"},{"t":"p","h":"1. Ой да, кыр да, тоо-таш да ... аппак. Бүгүн күн чайыттай ачык. Күңгөй, тескей ... килемдей кулпурат. 2. ... өз жайында эл-журт да, бала-бакыра да. (Т.С.) 3. Сакалы куудай агарган карыялар, эңкейген кемпирлер, кыз келиндер ... Дүйшөнкулду узатууга келишкен. Дүйшөнкул ... тууган эли, өскөн жери, үй-бүлөсү менен коштошту. 4. Булбул, торгой ... кетип, андан жору, кузгун, сагызган ... калды. (Р.Ш.)"},{"t":"p","h":"<b>206.<\/b> Көчүргүлө. Сүйлөм мүчөлөрү жана сөз түркүмү боюнча талдоо жүргүзгүлө. Жалпылагыч сөз сүйлөмдүн кайсы мүчөсү болду? Анын бир өңчөй мүчөлөрдөн айырмасы барбы? Салыштыргыла, түшүндүргүлө."},{"t":"p","h":"1. Адам баласы өзүнө керектүү эгинди, чөптү, жашылчаларды – баарын<sup>2<\/sup> жерден алат. 2. Ошон үчүн жерди иштетүү, пайдалануу жана сактай билүү керек. («А») 3. Акылбек аба, биз үчөөбүз эгиз туулган козуларды алып келдик. 4. Барган <span class=\"pg\" data-n=\"104\">104<\/span>сайын Арзымат экөөбүздүн<sup>2<\/sup> ортобуздагы көз караш жылуу тартат. (К.Ж.) 5. Төмөн жакта бардыгы: тоо кыркалары, ири дарыялар, калың токойлор, деңиздер дапдаана көрүнүп турат. («КМ»)"},{"t":"p","h":"<b>207.<\/b> Көчүргүлө. Бир өңчөй мүчөлөрдүн жана жалпылагыч сөздүн тыныш белгисин койгула жана аны түшүндүргүлө. Жалпылагыч сөз сүйлөмдүн кайсы мүчөсү болду?"},{"t":"p","h":"1. Биздин айылда буудай кызылча жашылча баары өсөт. 2. Азыр баары өмүр да, жер да кайрадан жаңырууда. 3. Чын эле, сен Табылдысыңбы же башкасыңбы? 4. Сатардын же айылга же шаарга кеткени белгисиз. («АТ») 5. Ушул жерге келген бүт эл аял-эркек улуу-кичүү тигил аялдан көздөрүн алышпайт. (Т.С.)"},{"t":"p","h":"Үлгү: <i>Биздин айылда буудай, кызылча, жашылча – баары өсөт. – Буудай, кызылча, жашылча —<\/i> сүйлөмдүн бир өңчөй мүчөлөрү, ошондуктан алардын араларына үтүр коюлду; <i>баары<\/i> – жалпылагыч сөз, бир өңчөй мүчөлөрдөн кийин келгендиктен өзүнөн мурда сызыкча коюлду; эмне? – <i>баары<\/i> – ээ."},{"t":"p","h":"<b>208.<\/b> Текстти көркөм окугула. Бир өңчөй мүчөлүү сүйлөмдөрдү гана көчүрүп жазгыла. Ошол сүйлөмдөргө сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө."},{"t":"p","h":"Ширактын өз Мекенин кара ниеттүү күчтөрдөн сактаганы, Тумаристин баатырдыгы, Нажмиддин Кубра, Жалилиддин Мангуберди, Амир Темур сыяктуу бабаларыбыздын азаттык жолундагы күрөштөрү Мекенин канчалык даражада сүйгөнүн, ыйык билгенинин далили."},{"t":"p","h":"Мекенди сүйүү, анын боорундагы кымбаттуу нерселердин кадырына жетүү керек. Анын тарыхы, эли, жери теңи жок өлкө. Өзбекстан ушундай касиеттери менен да дүйнөдөгү башка мамлекеттерден ажыралып турат. Бул Мекенди көз карегиндей сактоо – ар бирибиздин милдетибиз."},{"t":"p","h":"<b>209.<\/b> Көчүргүлө. Сүйлөм мүчөлөрү боюнча синтаксистик талдоо жүргүзгүлө. Сүйлөм мүчөлөрүнүн ортосунда байланыштын кандай түрлөрү (ээрчишүү, башкаруу, таандык байланыш, ыкташуу) бар?"},{"t":"h3","h":"<span class=\"pg\" data-n=\"105\">105<\/span>ЭЛ КАЗЫНАСЫНАН"},{"t":"p","h":"1. Ата таалими уулда болот, эне таалими кызда болот. 2. Жакшылык да сөздөн, жамандык да сөздөн. 3. Алтын, күмүш жыйнаган бай эмес, сөз билген – бай. 4. Өмүр чиркин өтөт тез, түбөлүккө калат сөз. 5. Жакшы келди дегенче, жарык келди десеңчи. Жакшылыктын жарыгын алып келди десеңчи. 6. Жакшынын жакшылыгын айт, атагы ашсын. 7. Жакшыны сыйласаң эсинен кетпейт. Жаманды сыйласаң, эшигиңден кетпейт."},{"t":"p","h":"<b>210.<\/b> Схемаларга көңүл бургула. Алардын ар бирине тиешелүү тыныш белгилерин атагыла жана ал тыныш белгилердин коюлуш эрежелерин айтып бергиле."},{"t":"img","src":"data:image/webp;base64,UklGRpAlAABXRUJQVlA4IPwOAAAwWQCdASqAAkwAPrVQoU0nJCciItHuwOAWiWkS4B7tiN+b35L/uv5DeGv+j/KDxIfSP478reWh1l5o/yT7T/jP7v+5vsD4B8AX1p/k9/f17/N/8P1CPVD6t/r/7v+8PnO/y/o/9h/+N7gH8s/rX/R8qTww/TP AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPZYQAgBD3hoxxzhtwnaYIVOctrLpfygTCJKwwX5gOv1PAEAeGFfUjjP3BGsXl4SPI3S5owuVaMwtYi9lkfVTahfNrEA","w":640,"ht":76},{"t":"v","l":["1. [ □ □ □ ○ ].","2. [ □ жана □ ]","3. [ □ да □ да ]","4. [ Же □ же □ ]","5. [ ○ □ □ ].","6. [ □ □ ○ ]."]},{"t":"p","h":"<b>211.<\/b> Төмөнкү суроолордун ар бирине жооп катары бирден сүйлөм түзгүлө. Ал сүйлөмдөрдө бир өңчөй мүчөлөр жана жалпылагыч сөз катышсын. Алар мүмкүн болушунча ар кандай сүйлөм мүчөсүнөн болсун жана жалпылагыч сөз менен бир өңчөй мүчөлөргө тиешелүү тыныш белгилерин туура койгула."},{"t":"p","h":"1. Кыргыз тилинде сөз түркүмү канча жана алар кайсылар? 2. Аныктоочтун милдетин кандай сөз түркүмдөрү аткарат? 3. Тактоочтор маанилик жактан кандай түрлөргө бөлүнөт? 4. Этиштин чактары кайсылар? 5. Сын атоочтун даражалары жөнүндө эмнени билесиңер? 6. Сүйлөмгө мүчө боло албаган сөздөр кайсылар? 7. Этиштин ыңгайлары канча жана алар кандай деп аталат?"},{"t":"p","h":"Үлгү: Толуктоочтун милдетин аткарган сөз түркүмдөрү булар: зат атооч жана заттык мааниде колдонулган башка сөз түркүмдөрү."},{"t":"v","l":["<b>Кайталоо үчүн суроолор:<\/b>","1. Сүйлөмдүн кандай мүчөсү бир өңчөй деп аталат?","2. Бир өңчөй мүчөлөр бири-бири менен кандайча байланышат?","3. Бир өңчөй мүчөлөрдү байланыштырган байламталарды атагыла.","4. Байламталар менен байланышкан бир өңчөй мүчөлөрдө үтүр белгиси кандайча коюлат?","5. Жалпылагыч сөздүн тыныш белгиси жөнүндө айтып бергиле."]},{"t":"h3","h":"<span class=\"pg\" data-n=\"106\">106<\/span>ЖӨНӨКӨЙ СҮЙЛӨМДҮН ТҮРЛӨРҮ"},{"t":"h3","h":"ЭКИ ТУТУМДУУ СҮЙЛӨМДӨР"},{"t":"p","h":"Түзүлүшү боюнча жөнөкөй сүйлөмдүн эки түрү бар: 1) эки тутумдуу; 2) бир тутумдуу."},{"t":"p","h":"Эки тутумдуу сүйлөмдө баш мүчөлөрдүн экөө тең: ээ да, баяндооч да катышып турат."},{"t":"p","h":"Мисалы: <b><i>Тил<\/i><\/b> <i>кылычтан<\/i> <b><i>өткүр.<\/i><\/b> (Мак.) Кандай?— <i>өткүр<\/i> – баяндооч; эмне) – <i>тил<\/i> – ээ; эмнеден өткүр? – <i>кылычтан<\/i> – толуктооч."},{"t":"p","h":"Ошентип, ээ жана баяндооч эки тутумдуу сүйлөмдүн грамматикалык негизин түзөт."},{"t":"p","h":"Эки тутумдуу сүйлөм айкындооч мүчөлөрдүн катышына карай экиге бөлүнөт: 1) жалаң жана 2) жайылма сүйлөм."},{"t":"p","h":"<i>Кыш келди.<\/i> Эмне болду? – <i>келди<\/i> – баяндооч; эмне келди? <i>– кыш<\/i> – ээ; жалаң сүйлөм. 2. <b><i>Ызгаардуу<\/i><\/b> <i>кыш<\/i> <i>келди.<\/i> Эмне? – <i>кыш —<\/i> ээ; <i>келди<\/i> – баяндооч; кандай кыш <i>– ызгаардуу<\/i> – аныктооч; жайылма сүйлөм."}],"sub":[{"title":"Касым Тыныстанов (1901—1938)","b":11},{"title":"ЭЛ КАЗЫНАСЫНАН","b":29},{"title":"ЖӨНӨКӨЙ СҮЙЛӨМДҮН ТҮРЛӨРҮ","b":38},{"title":"ЭКИ ТУТУМДУУ СҮЙЛӨМДӨР","b":39}],"pages":[102,106]},{"title":"39-§. Жалаң жана жайылма сүйлөмдөр","blocks":[{"t":"h3","h":"39-§. ЖАЛАҢ ЖАНА ЖАЙЫЛМА СҮЙЛӨМДӨР"},{"t":"p","h":"Баш мүчөлөрдөн гана түзүлгөн сүйлөм жалаң деп аталат."},{"t":"p","h":"Мисалы: Эгин-тегин жыйналды. Эмне? – <i>эгин-тегин<\/i> – ээ; эмне болду? <i>– жыйналды —<\/i> баяндооч."},{"t":"p","h":"Баш жана айкындооч мүчөлөрдөн түзүлгөн сүйлөм жайылма деп аталат."},{"t":"p","h":"Мисалы: <b><i>Быйыл<\/i><\/b> <i>эгин-тегин<\/i> <b><i>эрте<\/i><\/b> <i>жыйналды. Эгин-тегин —<\/i> ээ; жыйналды – баяндооч; качан жыйналды? <i>– быйыл, эрте<\/i> – бышыктооч."},{"t":"p","h":"<b>212.<\/b> Көнүгүү. Берилген сөздөрдөн жалаң жана жайылма сүйлөмдөр түзгүлө."},{"t":"p","h":"Кыш, мектеп, сабак, окуучу, ата-эне, эмгек, адептүүлүк, сыйлоо, өнөрлүү, шамдагай, спорт, кружок, мезгил, экскурсия, стратегия, Наманган, Харезм, Сырдарыя."},{"t":"p","h":"<b>213.<\/b> Текстти окуп, жалаң жана жайылма сүйлөмдөрдү ажыраткыла. Сүйлөмдүн негизин түзүп турган сөздөрдү көрсөткүлө."},{"t":"p","h":"Бака сууну жакшы көрөт. Уругун сууга таштайт. Көнөк баштар өсөт. Башы – тегерек. Куйругу бар. Түсү – кара. <span class=\"pg\" data-n=\"107\">107<\/span>Алар суудагы курттарды калтырбай жеп, көлмөнү тазалайт. Эми андай суулар жок. Уругун таштоого суу таппай жүрүп, баканын тукуму уланбай калат. Баканы өлтүрсө убал болот. Зыяны жок. Ал чымын–чиркейлерди жейт. Ал адамга пайда келтирет. Бака пайдалуу."},{"t":"p","h":"«Балдар энциклопедиясы»"},{"t":"p","h":"<b>214.<\/b> Көнүгүү. Сүйлөмдөргө жөнөкөй сүйлөмдүн түрлөрү боюнча талдоо жүргүзгүлө."},{"t":"p","h":"1. Кар жаады. 2. Арча менен карагай тоодо өсөт. 3. Арчаны түтөтүп, үйдү аластайт. 4. Чычырканак менен четиндин ашы кышында мөлтүрөп турат. 5. Кышында бакта мөмө болобу? 6. Күздүк буудайлар кардын алдында кыштайт. 7. Жаратылыш – биздин байлыгыбыз. 8. Жаратылышка аяр мамиле жасайлы."},{"t":"p","h":"Талдоонун үлгүлөрү: Арча менен карагай тоодо өсөт."},{"t":"p","h":"1. Айтылыш максатына карай – жай сүйлөм."},{"t":"p","h":"2. Сүйлөмдүн негизи: эмне? – арча, карагай, – ээ; эмне кылат? –баяндооч:"},{"t":"p","h":"3. Айкындооч мүчөлөрү: кайда өсөт? – тоодо – бышыктооч;"},{"t":"p","h":"4. Айкындооч мүчөлөрдүн катышына карай – жайылма сүйлөм;"}],"sub":[],"pages":[106,107]},{"title":"40-§. Эки тутумдуу сүйлөмгө синтаксистик талдоо жүргүзүү","blocks":[{"t":"h3","h":"40-§. ЭКИ ТУТУМДУУ СҮЙЛӨМГӨ СИНТАКСИСТИК ТАЛДОО ЖҮРГҮЗҮҮ"},{"t":"h3","h":"ТАЛДООНУН ТАРТИБИ"},{"t":"p","h":"1. Айтылыш максаты боюнча кандай сүйлөм экендигин көрсөтүү."},{"t":"p","h":"2. Түзүлүшү боюнча жөнөкөй сүйлөмдүн кайсы түрү экенин аныктоо."},{"t":"p","h":"3. Эки тутумдуу сүйлөмдүн түзүлүшү жөнүндө айтып берүү: жалаңбы же жайылмабы?"},{"t":"p","h":"4. Сүйлөм мүчөлөрүнө ажыратуу."},{"t":"p","h":"Үлгү: 1. <i>Айлана кулпура баштады.<\/i> («КБ») – Айтылыш максаты боюнча жай сүйлөм; грамматикалык түзүлүшү <span class=\"pg\" data-n=\"108\">108<\/span>боюнча жөнөкөй сүйлөм: эки тутумдуу, жалаң. Эмне боло баштады? <i>кулпуна баштады,<\/i> баяндооч; эмне? <i>– айлана<\/i> – ээ."},{"t":"p","h":"2. <i>Эл сүйгөндү ким сүйбөйт?<\/i> (Т.С.) – Айтылыш максаты боюнча суроолуу сүйлөм; түзүлүшү боюнча жайылма сүйлөм; эмне болбойт? – <i>сүйбөйт<\/i> – баяндооч; ким – <i>эл<\/i> – ээ; кимди? <i>– эл сүйгөндү<\/i> – толуктооч."},{"t":"p","h":"<b>215.<\/b> Көчүргүлө. Эки тутумдуу сүйлөмгө жазуу түрүндө талдоо жүргүзгүлө."},{"t":"p","h":"Мен көлдүн керемет таңын тосуп отурамын. Көл толкундары эми кызыл сары нурларга боёнушат. Тоолор сары. Токойлор кызыл сары, көл сымаптай көөлгүйт. Эх<sup>3<\/sup>, көлдүн керемет таңы кандай кооз! Ушундай ажайып көрүнүшүңдү көрөйүн деп, сени тосуп олтурбаймынбы! («КБ»)"},{"t":"p","h":"<b>216.<\/b> Текстти окуп чыгып, эки тутумдуу сүйлөмгө оозеки жана жазуу түрүндө талдоо жүргүзгүлө?"},{"t":"p","h":"1. Өзбекстан Республикасынын Конституциясы 1992-жылы 8-декабрда кабыл кылынган. Эл аралык эксперттердин жогорку баасын алган ушул Конституция 26 бап,128 статьяны өз ичине алган алты бөлүмдөн турат. Анда Өзбекстан элдеринин бардык ой максаттары өз ордун тапкан."},{"t":"p","h":"2. Өзбекстанда кыш узакка созулбайт. Көбүнчө аба ным, булуттуу, суук болот. Тез-тез туман түшөт, кээде кар жаайт. Бул жерде катуу суук күндөр көп болбойт. Жамгырдуу күндөр тез-тез жылуу күндөр менен алмашылып турат."},{"t":"p","h":"3. Күкүк жаздын келгенин кабарлайт. Ал ысыкты да, суукту да сүйбөйт. Күкүк айыл кыштактарда, токойлордо көп кездешет. Күкүк сайрап турган чарбак жагымдуу жана кереметтүү сезилет. Эмесе, чарбак менен токойлордо күкүк сайрай берсин."},{"t":"h3","h":"БИР ТУТУМДУУ СҮЙЛӨМДӨР"},{"t":"p","h":"Эки тутумдуу сүйлөмдө баш мүчөлөрдүн экөө тең: ээ да, баяндооч да катыша тургандыгы белгилүү."},{"t":"p","h":"Ал эми бир тутумдуу сүйлөмдө баш мүчөлөрдөн бирөө эле катышат, же баш мүчөлөрү белгисиз болот."},{"t":"p","h":"<span class=\"pg\" data-n=\"109\">109<\/span>Мисалы: 1. <i>Жер шары.<\/i> 2. <i>Түнүчүндө учуп баратабыз.<\/i> Биринчи сүйлөмдө заттын аты жөнүндө кабар берилди, бирок баш мүчөлөрү белгисиз. Экинчисинде баш мүчөлөрдөн баяндооч гана катышты (эмне кылып баратабыз?— <i>учуп баратабыз<\/i> – баяндооч. Качан? – түнүчүндө – бышыктооч), ээ катышкан жок."},{"t":"p","h":"Бир тутумдуу сүйлөмдүн төмөнкүдөй түрлөрү бар: атама, жактуу, жаксыз."}],"sub":[{"title":"ТАЛДООНУН ТАРТИБИ","b":1},{"title":"БИР ТУТУМДУУ СҮЙЛӨМДӨР","b":14}],"pages":[107,109]},{"title":"41-§. Атама сүйлөм","blocks":[{"t":"h3","h":"41-§. АТАМА СҮЙЛӨМ"},{"t":"p","h":"<b>Атама сүйлөм – затты, окуяны, мезгилди атап көрсөтөт.<\/b> Мындай сүйлөм атооч жөндөмөдөгү сөздөн жана сөз айкашынан жасалат."},{"t":"p","h":"Мисалы: 1. <b><i>Күз.<\/i><\/b> <i>Алыстан ак карлуу тоолор көрүнөт.<\/i> 2. <b><i>Айылдын<\/i> <i>кырманы.<\/i><\/b> <i>Талап элдерге эгин бөлүштүрүп берип жатат.<\/i>"},{"t":"p","h":"Атама сүйлөмдөр: <i>күз<\/i> (эмне?) – жаратылыштын мезгили; <i>айылдын кырманы<\/i> (эмне?) – заттын аты."},{"t":"p","h":"Атама сүйлөмдө аны менен байланышта айтылган сүйлөмдүн мааниси зор, анткени ал аркылуу атама сүйлөмдөгү ой андан ары улантылат, тереңдетилет. Салыштыргыла: 1. <b><i>Каракол<\/i> <i>калаасы.<\/i> <i>—<\/i><\/b> Сөз айкашы. 2. <b><i>Каракол<\/i> <i>калаасы.<\/i><\/b> <i>Калаанын айланасы бак-дарактар менен курчалган.<\/i> («КТ») <i>Каракол калаасы<\/i> – атама сүйлөм."},{"t":"p","h":"Атама сүйлөм сүйлөм мүчөлөрүнө ажыратылбайт."},{"t":"p","h":"Сүйлөмдүн бул түрү көркөм адабияттарда көбүрөөк колдонулат."},{"t":"p","h":"<b>217.<\/b> Көчүргүлө. Эки тутумдуу жана бир тутумдуу сүйлөмдөрдү өзүнчө атап, аларга сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Сүйлөмдөрдүн айырмасы эмнеде? Түшүндүргүлө."},{"t":"p","h":"1. Коштошуу минуталары ... Аз убакыттан кийин<sup>3<\/sup> булардын ар кимиси ар тарапка жөнөшөт. 2. Кыш... Ал өзүнүн ызгаарын төгүп турат. (К.Б.) 3. Талас... Кеңкол өзөнү. Алыстан-алыстан<sup>3<\/sup> ак карлуу тоолор көрүнөт. (Ж.Б.)"},{"t":"v","l":["4. Кыш мезгили... Ала-Тоону кар баскан,","Ушундай кез... Чыккан жандар адашкан! (Ж.Т.)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"110\">110<\/span><b>218.<\/b> Окугула. Атама сүйлөмдөрдү тапкыла. Аларды эки тутумдуу сүйлөмгө айландырууга болобу? Анда айландырып көчүрүп жазгыла. Сүйлөмдөрдү салыштыргыла, алардын айырмачылыгын аныктагыла."},{"t":"p","h":"1. Парктын бурчу... Май айы. Сан түркүн гүлдөр жайнап, айлана көрккө бөлөндү."},{"t":"p","h":"2. Жол... Учу-кыйырына көз жетпеген жолдор... Мына ушул жол четинде эне баласын күтүп турат. Күтүү. Күтүү бардык эле адамдарда болот. («КБ»)"},{"t":"p","h":"3. Адам. Жаратылыш... Чынында, Жер эне ушул эки алп нерсени көтөрүп турат. Бул – чындык. Бул экөө бири-бирин толуктап, бири экинчисине өмүр берет. Тоо. Суу. Аба. Адамдар буларды канчалык сактай билишсе, өздөрүн да ошончолук сактай алганы. («ЭТ»)"},{"t":"p","h":"Үлгү: <b>Класстын ичи...<\/b> <i>Күндүн нуру терезеге чагылышат. —<\/i> <b><i>Класстын<\/i> <i>ичи<\/i><\/b> <i>гүлдөр менен кооздолгон.<\/i>"},{"t":"p","h":"<b>219.<\/b> Атама сүйлөмдү колдонуп, кыштактын көрүнүшү, тарыхый эстеликтер жөнүндө макала жазып келгиле. Ага ат койгула."},{"t":"p","h":"<b>220.<\/b> Көчүрүп жазгыла. Сүйлөм мүчөлөрүнүн астын сызгыла. Сүйлөмдөрдүн түзүлүш өзгөчөлүгүн түшүндүргүлө. Жөнөкөй сүйлөмдүн кандай түрлөрүн билесиңер?"},{"t":"p","h":"1. Түн. Таш каарыган аяз. Аязда калган жалгыз атчандай ала булуту тытылган бозомтук-муздак асманда бир четинен бөксөргөн муздак ай."},{"t":"p","h":"Кыштын узун түнүн жамынып, ичине албан түркүн сыр катып, түнөрүп жаткан Кашкар."},{"t":"p","h":"Ала булуттуу асмандын бозомтук көгүлтүр көлөкөсү түшкөн ийри көчөлөрдөн эрбең-сербең чыга түшкөн караандар."},{"t":"p","h":"<b>221.<\/b> Сөз жана сөз айкаштарынын ар бирин атама сүйлөмдүн маанисинде колдонуп, сүйлөм түзгүлө. Атама сүйлөмдүн өзгөчөлүгүн аныктагыла."},{"t":"p","h":"Манастын ордосу, салкын аба, 2019-жыл, кыш айларынын бири, алмалуу калың бак, мына асман тиреген үйлөр, март айы."}],"sub":[],"pages":[109,110]},{"title":"42-§. Жактуу сүйлөм","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"111\">111<\/span>42-§. ЖАКТУУ СҮЙЛӨМ"},{"t":"p","h":"<b>Жактуу сүйлөм – бир тутумдуу сүйлөмдүн бир түрү.<\/b> Бул сүйлөмдө ээ катышпайт да, сүйлөм этиштик баяндоочтон түзүлөт. Баяндоочко, I, II жактын жак мүчөсү уланат же ал этиштин буйрук, шарттуу, каалоо-ниет ыңгайларынан болот."},{"t":"p","h":"Мисалы: 1. <i>Сүрөт тартыш үчүн айылга эки-үч күн мурунураак<\/i> <b><i>бардым.<\/i><\/b> <i>—<\/i> Эмне кылдым? – <i>бардым —<\/i> баяндооч – биринчи жактын мүчөсү (бар + ды + м) уланып турат. 2. <b><i>Жүгүр!<\/i><\/b> <i>Артынан<\/i> <b><i>сүйөп<\/i> <i>жибер.<\/i><\/b> (Ч.А.) Баяндоочтор: <i>жүгүр, сүйөп жибер.<\/i> Этиштин буйрук ыңгайынан (II жак) болду. Баяндоочко уланган жак мүчө аркылуу ээлик милдет аткаруучу жактама ат атооч өзүнөн өзү эле белгилүү болуп турат: <i>Ошол жылы Субанкулга<\/i> <b><i>жолуктум.<\/i><\/b> <i>(Ч.А.)<\/i> Эмне болдум – <i>жолуктум<\/i> – этиштик баяндооч, ага -м деген I жактын мүчөсү уланды. Ушуга байланыштуу <b><i>мен<\/i><\/b> деген ээнин катышпай калганы белгилүү болду."},{"t":"p","h":"<b>222.<\/b> Окугула. Жактуу сүйлөмдү көрсөткүлө. Анын түзүлүшү кандай болот? Баяндоочко уланган жак мүчөлөрдү аныктагыла."},{"t":"p","h":"1. «Сарыбай» деп сырттан уккан менен үйүн көргөн эмесмин. Бардым. Мен кирип токтогон алдыңкы бөлмөсүндө чымкый башайы-макмалдын үстүндө, жашыл тукаба чапанын желбегей жамынып, көөлгүгөн бир зайып олтурат. Башында заңкайган торгун элечек Байбиче ушул экенин байкадым."},{"t":"p","h":"Бир нан, жети тыйынды алгандан кийин жолума түштүм. (М.Э.)"},{"t":"v","l":["2. Ак саманды жаман деп,","Чөптү кайдан табасың?","Аз дүйнөнү жаман деп,","Көптү кайдан табасың? (Т.)"]},{"t":"p","h":"<b>223.<\/b> Жактуу сүйлөмдү таап көчүргүлө. Сүйлөм мүчөлөрү боюнча талдагыла. Мында баяндоочтон башка сүйлөмдүн дагы кайсы мүчөлөрү катышты?"},{"t":"p","h":"1. Жайнагым ачык-айрым жигит болду. Жаңы заманда тилегибизге жеттик. Үч уулдуу болдук<sup>2<\/sup>. – Ооба, Толгонай, энелик үзүрдүн эң сонун мезгилин ошондо, баштагансың! Сен анда, баралыңа жетип, толуп турган күчтүү аял элең. Жумушту да, жаштардан калышпай, кыйын иштөөчүсүң<sup>2<\/sup>. – Ооба, дыйкан талаам, сен баарына күбөсүң. Ар дайым ниетим жакшы болчу. (Ч.А.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"112\">112<\/span><b>224.<\/b> Жөнөкөй сүйлөмдөрдү өз ара салыштыргыла. Кайсынысы эки тутумдуу? Кайсынысы бир тутумдуу сүйлөм? Айырмасы эмнеде?"},{"t":"p","h":"1. Быйылкы окуу жылында университетти бүтүрөмүн. – Мен быйылкы окуу жылында университетти бүтүрөмүн. 2. Ата-бабаларыбыздын салт-санаасын кубаттайбыз. 3. Бар, кагылайын! Ок өтпөс бек бол да, жоо өтпөс чеп бол. – Бар, кагылайын! Сен ок өтпөс бек бол да, жоо өтпөс чеп бол. 4. О-о, кадырлуу агайындар! Мында ынтымак менен иштегиле! – О-о, кадырлуу агайындар! Силер мында ынтымак менен иштегиле. 5. Уюткулуу элдин тукумусуз. – Сиздер уюткулуу элдин тукумусуздар."},{"t":"p","h":"<b>225.<\/b> Сөз айкашындагы этиш сөздү тиешелүү чакка коюп, ага биринчи жана экинчи жактын жак мүчөсүн улап, ар бирине бирден сүйлөм түзгүлө. Сөз айкашы менен сүйлөмдүн айырмасын аныктагыла."},{"t":"p","h":"Саякаттан келүү, шаардын музейлеринде болуу, балдарды мектепке алып келүү, улууларды урматтоо, Мекенге кызмат кылуу, чечкиндүү сүйлөө, жогорку окуу жайына өтүү, классташтар менен кезигүү."},{"t":"p","h":"Үлгү: <i>Саякаттан келүү —<\/i> сөз айкашы. <i>– Саякаттан келдим –<\/i> сүйлөм. Сөз айкашы – бул түшүнүк, мында баш мүчөлөр болбойт; ал эми сүйлөм бар; этиштик баяндооч белгилүү бир чакта жана жакта турат."},{"t":"p","h":"<b>226.<\/b> Окугула. Сүйлөмдүн негизин түзгөн баш мүчөлөрдү тапкыла. Мында жөнөкөй сүйлөмдүн кайсы түрлөрү бар? Бир тутумдуу сүйлөмдүн кайсы түрүн өздөштүрдүңөр? Тексттен мисал келтиргиле."},{"t":"h3","h":"НООРУЗ"},{"t":"p","h":"Нооруз. Ал бизге жазды алып келди. Жаз менен кошо жаратылышка жан кирди. Бул күн – улуу күн. Ушул күнү Жер эненин дем алганын угабыз. Куштардын сайраган үнү ... Салкын аба... Карачы? Айланага жан кирген сыяктуу. Биздин сезимибизде Мекен жөнүндөгү түшүнүк уяласын."},{"t":"p","h":"Ошол күнү балдарга өзүңөрдүн Ата Мекениңерди, эне тилиңерди сүйгүлө деп айтамын. Биз жаштарга ишенебиз. Ак жолтой Нооруз келе берсин. Алас, алас. Ар балээден калас! («КТ»)"}],"sub":[{"title":"НООРУЗ","b":15}],"pages":[111,112]},{"title":"43-§. Жаксыз сүйлөм","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"113\">113<\/span>43-§. ЖАКСЫЗ СҮЙЛӨМ"},{"t":"p","h":"Жаксыз сүйлөм да – бир тутумдуу сүйлөмдүн бир түрү. Жактуу сүйлөм сыяктуу, бул сүйлөмдө да ээ катышпайт. баяндооч гана бар."},{"t":"p","h":"Баяндооч III жактагы этиштен же башка сөз түркүмүнөн болот."},{"t":"p","h":"<b>Аракет кылуучу жагы болбогон, сүйлөмдүн бардык белгилери баяндооч аркылуу гана берилип турган сүйлөм жаксыз сүйлөм деп аталат.<\/b>"},{"t":"p","h":"Мисалы: 1. <i>Уулду<\/i> <b><i>төрөйт,<\/i><\/b> <i>уятын кошо төрөбөйт.<\/i> 2. <i>Бул<\/i> <i>ишти бир күндө<\/i> <b><i>бүтүрүүгө<\/i> <i>мүмкүн<\/i> <i>эмес.<\/i><\/b> <i>(«КБ»)<\/i> Баяндоочтор: <i>төрөйт, кошо төрөбөйт, бүтүрүүгө мүмкүн эмес.<\/i>"},{"t":"p","h":"Бул сүйлөмдөрдө ээ катышкан жок."},{"t":"p","h":"<b>227.<\/b> Окугула. Сүйлөмдөрдү өз ара салыштыргыла. Кайсынысында баяндооч гана бар, ээ жок? Мындай сүйлөм кандайча аталат?"},{"t":"p","h":"1. Айылдагылар кош айдоого даярдык көрүп жатышат<sup>2<\/sup> – Айылда кош айдоого даярданып жатышат."},{"t":"p","h":"2. Мен Чырчыктагы туугандарыма баратамын. 3. Ач адамды тойгузууга болот, ач көздү тойгузууга болбойт. 4. Жакшы деген бир атты жууса кетпейт, жаман деген бир атты кууса кетпейт. (Мак.) 5. Болжолу, чоң энем мени эне тилди сүйүүгө үйрөтүп жатты. Чынында, эне тилдин сыйкырдуу сырын, кудуреттүү күчүн айтып түгөтө албайсың. Ал жаш балага эбегейсиз ыракат тартуулайт. (Ч.А.)"},{"t":"p","h":"<b>228.<\/b> Өзүңөр жаксыз сүйлөмгө беш мисал ойлоп жазып келгиле. Ал бир тутумдуу сүйлөмдүн башка түрлөрүнөн кандайча айырмаланат? Түшүндүргүлө."},{"t":"p","h":"<b>229.<\/b> Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Кайсы сүйлөмдө баш мүчөлөрдүн экөө тең, кайсынысында бирөө эле катышты? Алар жөнөкөй сүйлөмдүн кайсы түрү болот?"},{"t":"h3","h":"УЧКУЛ СӨЗДӨР"},{"t":"p","h":"1. Адепти кимден үйрөндүң? – Алепсизден үйрөндүм. 2. Жакшы жакшыга жанаштырат. Жаман жолдон адаштырат. 3. Жаманга жанашпа, жакшыдан адашпа. 4. Аргымак бирде жалдуу, бирде жалсыз. 5. Кылычынан кан тамганды, тилинен бал менен жеңиптир."},{"t":"p","h":"<span class=\"pg\" data-n=\"114\">114<\/span><b>230.<\/b> Сүйлөмдүн түзүлүшүн өзгөртүп түзүүгө болобу? Болсо өзгөртүп түзгүлө. Сүйлөмдөрдү бири-бирине салыштыргыла. Айырмачылыгын аныктагыла."},{"t":"p","h":"1. Жаздын жаркыраган күнүндө балдар<sup>2<\/sup> үйдө олтура алышпайт. 2. Мен түн бою<sup>1<\/sup> уктабай чыктым. 2. Ал биздин ийгиликтерге ишенбейт. 3. Сен шахматты жакшы ойноого үйрөн. 4. Биз эртең тоого барабыз. 5. Алым окууга кетти."},{"t":"p","h":"Үлгү: <i>Жаздын жаркырган күнүндө балдар үйдө олтура алышпайт. —Жаздын жаркыраган күнүндө балдарга үйдө олтурууга болбойт.<\/i>"},{"t":"p","h":"<b>231.<\/b> Жөнөкөй сүйлөмдүн түрлөрүн аныктагыла: а) жалаң; б) жайылма; в) атама; г) жактуу; д) жаксыз. Бул сүйлөмдөрдүн грамматикалык түзүлүшү кандай?"},{"t":"p","h":"1. Жалгыз аяк жол менен Батма кыштакгы көздөй келе жатат. Батманы карагылачы! Жакшылап карасаң 2. Тоолор... Биздин тоолор! Тоолордон бүркүт шаңшыды. (Жус.) 3. Элге сүйгүнчүлүктүү болуу керек. 4. Адамды кийиминен тааныбайт, ишинен тааныйт<sup>2<\/sup>. 5. Оор иштен коркпо, оор сөздөн корк."},{"t":"p","h":"<b>232.<\/b> Схеманы дептериңерге чийип алгыла. Бир тутумдуу сүйлөмдүн түрлөрүнө көңүл бургула. Алардын ар бирине экиден сүйлөм түзүп келгиле. Бир тутумдуу сүйлөмдөр баш мүчөлөрдүн кайсынысынан түзүлөт?"},{"t":"img","src":"data:image/webp;base64,UklGRtwbAABXRUJQVlA4IEgFAACQJACdASoNAV4APrVSoEonJSMhsBjIUOAWiU3bq9415jtZAczp8N+x7rkr/u9ur1AbYr+ff7X1AfyD+3ftt7/fo1/+/T/7ux+y/w4/2v/oftBmYD7+stXo2Q35L3k+9pM+0A9AL1Z+j+u5MX//6P8y7+L+hB/2DbwxQW02m0ejzgj+TvJDoDcDGBXTFDUp7vL9X6btviY0vMN1Cgzf3KetL16BR8FMqMxd AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPZYQB4+rRrv0HK6ZaF9nIRf+fWY/sx4pnQZ230pDHcSe6ndDjyznTjEYgIJ8o/w6ZBOa6E+rzXvkP0jDsfrYYFPlGQA","w":269,"ht":94},{"t":"v","l":["Бир тутумдуу сүйлөмдөр","атама","жактуу","жаксыз"]},{"t":"p","h":"<b>233.<\/b> Жөнөкөй сүйлөмдүн түзүлүшү боюнча төмөнкү суроолорго жооп бергиле: а) баш мүчөлөрдүн катышына карай канчага бөлүнөт? б) эки тутумдуу сүйлөмдөргө кайсылар кирет? в) бир тутумдуу сүйлөмдөр кайсылар? Жообуңарды мисалдар менен далилдегиле."},{"t":"p","h":"1. Жай мезгили<sup>1<\/sup>... Асман ачык. Эч жерде булут жок. Айдаркөл мелтиреп турат. Айлана жымжырт. 2. Сапарыңар кут болсун, Айжан балам. («КМ») 3. Күткөндүрсүң<sup>2<\/sup>, келдим, эне! Аманбы? Кучактачы, сүйчү беттен балаңды. (Ж.Т.) Маляр келди бир чоң үйдү майлады, кабак түйгөн капалыкты айдады. (А.О.) 5. Бул жерди Алабаш деп коёт. Малга жайлуу <span class=\"pg\" data-n=\"115\">115<\/span>жер. 6. Убаданы бузууга болбойт. Чындыкты бетке айтуу керек. 7. Жамгыр... Чартылдаган чагылган. Айылга бара жатабыз. («КБ»)"}],"sub":[{"title":"УЧКУЛ СӨЗДӨР","b":11}],"pages":[113,115]},{"title":"44-§. Бир тутумдуу сүйлөмгө синтаксистик талдоо жүргүзүү","blocks":[{"t":"h3","h":"44-§. БИР ТУТУМДУУ СҮЙЛӨМГӨ СИНТАКСИСТИК ТАЛДОО ЖҮРГҮЗҮҮ"},{"t":"h3","h":"ТАЛДООНУН ТАРТИБИ"},{"t":"p","h":"1. Айтылыш максаты боюнча кандай сүйлөм экендигин көрсөтүү."},{"t":"p","h":"2. Түзүлүшү боюнча жөнөкөй сүйлөмдүн кайсы түрү экенин аныктоо."},{"t":"p","h":"3. Бир тутумдуу сүйлөмдүн түзүлүшү жөнүндө айтып берүү: атама, жактуу, жаксыз."},{"t":"p","h":"4. Сүйлөм мүчөлөрүнө ажыратуу."},{"t":"p","h":"Үлгү: 1 <i>Май айы. Жүрөгүң жаңы кубанычты сезет. (Т.Ү.)<\/i> Бул жерде эки сүйлөм бар: айтылыш максаты боюнча экөө тең – жай сүйлөмдөр; грамматикалык түзүлүшү боюнча жөнөкөй. <i>Май айы —<\/i> бир тутумдуу сүйлөм, атама; сүйлөм мүчөлөрүнө ажыратылбайт. Экинчиси эки тутумдуу сүйлөм, жайылма; эмне болот? <i>– сезет —<\/i> баяндооч; эмнени? – <i>жүрөгүң<\/i> – ээ; эмнени сезет? – <i>кубанычты<\/i> – толуктооч; кандай кубанычты? – <i>жаңы<\/i> – аныктооч."},{"t":"p","h":"2. <i>Эртең да айылыма жөнөймүн.<\/i> Айтылыш максаты боюнча жай сүйлөм, түзүлүшүнө карай жөнөкөй, бир тутумдуу, жактуу; эмне кыламын? – <i>жөнөймүн —<\/i> баяндооч; ээ катышкан жок. Кайда жөнөймүн? – <i>айылыма<\/i> – орун бышыктооч; качан жөнөймүн? <i>– эртең да<\/i> – мезгил бышыктооч."},{"t":"p","h":"<b>234.<\/b> Бир тутумдуу сүйлөмгө оозеки синтаксистик талдоо жүргүзгүлө."},{"t":"p","h":"1. Март. Бул – жаздын биринчи айы. Менин атам – дыйкан. Жыл сайын Ноорузда талаасына барат. Атам да талаасын сагынат окшойт. Биз Нооруз майрамын токчулуктун жышааны катарында кабыл алабыз."},{"t":"p","h":"2. Сенин кыялың адамда жок. Кээде кишини магниттей өзүңө тартасың. Кээде жакындаган жанды жанындан түртөсүң. (А.Т.)"}],"sub":[{"title":"ТАЛДООНУН ТАРТИБИ","b":1}],"pages":[115,115]},{"title":"45-§. Кемтик сүйлөм","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"116\">116<\/span>45-§. КЕМТИК СҮЙЛӨМ"},{"t":"p","h":"Пикир алышууда толук сүйлөм менен бирге кемтик сүйлөм да колдонулат. Кемтик сүйлөмдө кандайдыр баш же айкындооч мүчөлөр айтылбай калат. Ошол айтылбай калган сүйлөм мүчөсү жанаша айтылган мурдагы сүйлөм аркылуу же сүйлөшүүнүн кырдаалынан белгилүү болуп турат."},{"t":"p","h":"Кемтик сүйлөм диалогдо көбүрөөк колдонулат."},{"t":"p","h":"Мисалы: – <i>Сен сүрөт тартканды билесиңби?<\/i> (Толук сүйлөм). – <b><i>Билем.<\/i><\/b> (Кемтик сүйлөм.) Мурда айтылган толук сүйлөмгө салыштырганда сүйлөмдүн ээси (ким? <b><i>сен)<\/i><\/b> жана толуктооч (эмнени? – <b><i>сүрөт<\/i> <i>тартканды)<\/i><\/b> айтылбай калды."},{"t":"p","h":"Кээде сүйлөмдүн бардык мүчөсү айтылбай, кемтик сүйлөм кызматчы сөздөн болушу мүмкүн:"},{"t":"p","h":"– <i>Сен сүрөт тартканды билесиңби? —<\/i> <b><i>Ооба<\/i><\/b> (кемтик сүйлөм, <i>ооба<\/i> – кызматчы сөз)."},{"t":"p","h":"Диалогдо толук сүйлөм да, кемтик сүйлөм да жаңы жолдон башталып, алдына сызыкча коюлуп жазылат:"},{"t":"v","l":["– <i>Сиз кайдан келе жатасыз?<\/i> (Толук сүйлөм.)","– <b>Айылдан.<\/b> (Кемтик сүйлөм.)"]},{"t":"p","h":"<b>235.<\/b> Окугула. Толук жана кемтик сүйлөмдөрдү көрсөткүлө. Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Айтылбай калган сүйлөм мүчөлөрүн аныктагыла."},{"t":"p","h":"– Силер Гүлстандан келе жатасыңарбы, кагылайын? – деп кемпир акырын сурап койду."},{"t":"v","l":["– Сырдарыядан.","– Силер ал жакта окуп жатасыңарбы?","– Окуп жүрөбүз.","– Келечекте ким болосунар?","– Мугалим болобуз, энеке."]},{"t":"p","h":"<b>236.<\/b> Калтырылып кеткен тыныш белгилерди коюп, көчүргүлө. Алардын эмне үчүн коюлганын түшүндүргүлө. Кемтик сүйлөмдү тапкыла."},{"t":"p","h":"Каш карайганда биз айылга жол тарттык // Ушундай түндө жол тарткан кандай жакшы // Чиркин, ошол күнкү түн өзгөчө көрктүү болду // Бүгүн да Данияр, обон салып, ырдайбы // (Ч.А.)"},{"t":"v","l":["<span class=\"pg\" data-n=\"117\">117<\/span>– Эми жакшы жүр, үйдү көрүп турбайсыңбы// деди Бурмаке // Бизди узатып жатып, дагы сурады //","– Деги эмне бермек болду//","– Айлыгы эки сом//","– Койчу // Мейли, эки сомду бирөө бекер береби// (М.Э.)"]},{"t":"p","h":"<b>237.<\/b> Сүйлөмдөрдү диалог түрүндө кайрадан түзгүлө. Көчүрүп жазып, тыныш белгилерин койгула. Кемтик сүйлөм барбы?"},{"t":"p","h":"1. «Айгерим жөнүндө Талант байкеси эч нерсе айткан жокпу»// деп Нурлан сурап калды. Кемел мындай жооп берди// «Ал мага Айгерим жөнүндө эч нерсе айткан жок». «Ал мектепке качан барат» // деп сурады Зарыл чоң энеси. «Айгерим мектепке үч күндөн кийин барат» // деп жооп берди энеси."},{"t":"p","h":"2. Мен үчүн азап тартпай эле койбойсузбу // деп күлүмсүрөдү Алымкан. Акын мындай деди // Мен сен үчүн кантип азап тартпай коём // (Ж.Б.) Айылдын жетишкендигин өз көзүңүз менен көрүңүз // деп Айнагүл өтүндү. Мен мындай деп айттым // Макул, айылдын жетишкендигин өз көзүм менен көрөйүн. (К.Ж.)"},{"t":"v","l":["Үлгү: <i>Нурлан сурап калды:<\/i>","<i>– Айгерим жөнүндө Талант байкеси эч нерсе айткан жокпу?<\/i>","<i>– Айткан жок.<\/i>"]},{"t":"p","h":"<b>238.<\/b> Жаратылышты сактоо жөнүндө дубал гезитине макала жазып келгиле. Макалага ат койгула. Макаланын тили элпек, түшүнүктүү болсун үчүн аракет кылгыла. Бул үчүн эки жана бир тутумдуу сүйлөмдөрдүн ар кандай түрлөрүн колдонгула."},{"t":"p","h":"<b>БК 239.<\/b> Окугула. Тексттеги негизги ой эмне жөнүндө? Текст кептин кайсы түрү аркылуу баяндалды? Мында жөнөкөй сүйлөмдүн кайсы түрлөрү колдонулду?"},{"t":"p","h":"Биз Мекенибизди азат жана эгемендүү, кооз жана кайталангыс, байыркы деп сүрөттөйбүз. Бул сүрөттөөлөрдүн ар бири журтубуз жөнүндөгү көпчүлүк тарабынан макулданган чындыкты чагылдырат. Бирок бул чындыктардын ар бирин өзүбүз өз алдынча түрдө жүрөктөн туюшубуз, чын <span class=\"pg\" data-n=\"118\">118<\/span>дилден түшүнүп жетүүбүз керек. Ошондо гана биз Ата Журтубуздун канчалык азат, канчалык эгемендүү, канчалык кооз жана кайталангыс экенин сезебиз. Бул сезим-туюм бизди Мекенибизди тулку боюбуз менен сүйүүгө үндөйт, бизге кубат берет. Анткени Тумарис, Ширак, Нажмиддин Кубра, Жалалиддин Мангуберди, Амир Темур сыяктуу атабабаларыбызга күч-кубат берген сезим да элди сүйүү, Ата Журтка берилгендик эле. Президентибиз Ш. Мирзиёевду элибизди эркиндиктин жолунан кайраттуулук жана эр жүрөктүүлүк менен азат жана бейпил турмушту көздөй жол баштоого үндөгөн, бүгүнкү күндө өлкөбүздү дүйнөдөгү алдыңкы мамлекеттердин катарына алып чыгууга шыктандырып жаткан күч да эң мурда Мекенге болгон сүйүү. Мекенге берилгендик сезими болуп саналган."},{"t":"p","h":"<b>240.<\/b> Схемага көңүл буруп, жөнөкөй сүйлөмдүн түрлөрүн эсиңерде сактагыла. Алардын ар бирине мисал ойлоп тапкыла. Сүйлөмдөр грамматикалык түзүлүшү боюнча кандайча айырмаланышат?"},{"i":1231,"page":118,"t":"img","src":"data:image/webp;base64,UklGRoYiAABXRUJQVlA4IPILAADwOgCdASroANYAPrVUpU4nJCOiJRH6qOAWiU3cLbS9y25j9mJtRGLXSP//L/M7b37S+4D+Ff4LpT/0j9m/cL/QP976gv5p/lP3S9/j0Nf/j1AP/n6f/qAc+r+7Xwg/17/pfu77aH/////b19Mf1k75v8LtJF4/6bwF6X+8H4pZCPLLeDcMPn/1m9gL1c+mfr37/8x3/806+nuq36Pfrj1ICO97vjGSSxx7dtvMX/6iDS+Ul8jd9//sxF8N+m+wYN/H38s5f/8oa/oU//2VLYDaUl7Bz6iz/oiR2//MUrc+uuDtHypGMBbGrIyL7Vc7gKzALh+//8g6/oh6FZ2w0EZcuoYy5CuWy9fBYdMDojOY8rPu9koAGfGYjrrXqVc9u1dKmfkXMVYm8OhUhYHIKWPPS0053g4By4PZWbRCQK/M9iETJRIbVI0go7q+ny64SD1QodlHw1RPHg66556++OcbUIsA2WNnuRSb+rK7xpU3/MLKUZEb5S9p6jZdUWY1vgq5BAyfzr+B9ygcQZXj7FD7JtTgsoolKs8flXvOGJvy460cGwjLKMkPsY8Kjm8VbVWeyWRcew8EO1KMkPsUwOXIrWo6VG8zcRS+MZJL5S7U2RGt0eg4jCL/H3+Pv8fua7AA/v2fABkzdgMHgPwaiFLov23IBc+LnzW9QWfDZ1qS59kBejuJDsihDN5HT5iFtpOnk0+ko8VgrrVfcbLLjDRWNcIILhq3NICYwz1d7jpx8nGDoTDm+BB0NsdKzL+3Zg5V7/kK+2lxHeeEYjBGAY5/9So80zhRA3FYoCL2KAiwCYouLElXlYIWAHveDTZy4nDd+nRqeNL6xevBuitmT6+Oz9dvgGhH5wpqJgNi5lr6lP6hH3tRgl81ekOzl6Wy/FQ0AI9dxjS/kzE9hYoItWM5W/6d0p2QBWq9yTtTVnTn4kA/429ko8BOVU/tkAG/0ZYxP7wCcSzofjDXTvOedbNQl0y1FZpJBsUMegbYEUbKWViQtTjiIjcqubEMNZHUJyAKLLmtT+zGUEs35EugwZuacgdGm/wC/geqRQVJ9IypdDeNtC+jjOr2WDMAJMjM8HqkFcFhFYbCYlKYYy76RBcxQMUq2TNvU5nfx5v9IgHOa6j9UskMvt2asUSukbBnM9KnkchYxTE/j45zRPCZd5EOvdV лөмдү сүйлөм мүчөлөрүнө ажыратуу (бир өңчөй мүчөлөр, жалпылагыч сөз болсо, аларды көрсөтүү)."},{"t":"p","h":"7. Тыныш белгилердин коюлушун түшүндүрүү."},{"t":"p","h":"Үлгү: 1. <i>Кечке жуук күн кызарып батты. —<\/i> Айтылыш максаты боюнча жай сүйлөм. Грамматикалык түзүлүшү боюнча эки тутумдуу сүйлөм, жайылма. Эмне болду? <i>– батты<\/i> – баяндооч; эмне? – күн – ээ; кантип батты? – <i>кызарып<\/i> – сыпат бышыктооч; качан батты? <i>– кечке жуук<\/i> – мезгил бышыктооч; жай сүйлөм болгондуктан аягына чекит коюлду."},{"t":"p","h":"2. <i>Ошентип, миң-миң жыл өмүр сүргүлө!<\/i> (Ч.А.) – Айтылыш максаты боюнча илептүү сүйлөм. Грамматикалык түзүлүшү боюнча бир тутумдуу сүйлөм, жактуу. Эмне болгула!— <i>өмүр сүргүлө<\/i> —баяндооч; мында ээ жок; канча өмүр сүргүлө?— <i>миң-миң жыл<\/i> —сан-өлчөм бышыктооч; <i>ошентип<\/i> – киринди сөз, үтүр менен бөлүндү; илептүү сүйлөм болгондуктан аягына илеп белгиси коюлду."},{"t":"p","h":"<b>242.<\/b> Жөнөкөй сүйлөмдү грамматикалык түзүлүшү боюнча талдагыла. Баш мүчөлөрдүн экөө тең катышкан сүйлөмдөргө кайсылар кирет? Атагыла. Мисал келтиргиле. Баяндооч аркылуу гана түзүлгөн сүйлөмдөр кайсылар? Атагыла. Мисал келтиргиле."},{"t":"p","h":"1. Ызгаардуу кыш... Суук! Шаркырап аккан тоо сууларынын үнү угулбайт. Айлана мемиреп тынч. Көзүң жаңы сүрөттү көрөт. Аскасы асман тиреген ак карлуу тоолор... Менин балалык чагым ушул тоолордо өткөн. («КТ») 2. Мен өзүмдүн <span class=\"pg\" data-n=\"120\">120<\/span>башымдан өткөргөн кыйынчылыктарымды айтайын. Айтууга жеңил, бирок угууга оор. – Жашыңыз канчада? —Жыйырма бирде. (К.Ж.)"},{"t":"p","h":"<b>243.<\/b> Сүйлөмдүн мүчөлөрү боюнча талдоо жүргүзгүлө. Алар кайсы сөз түркүмүнөн болду? Түзүлүшү кандай?"},{"t":"p","h":"1. Улуу тоого чыккан барбы? Улар үнүн уккан барбы? Жакшынын сөзү ташка тамга баскандай. (Мак.) 2. Тил – бул ар бир элдин каны, жаны. 3. Жамийла болсо сөзмөр кыз эле. (Ч.А.) 4. Макмалга сайма сайгандай, эмгектин көркүн жер берет. 5. Токтогулдун ырын укканда Керимбай ачуулуу үнү менен кыйкырды. (Ж.Б.) 6. Аял баланы орой салып, кыргызча таптак сүйлөдү. (А.Т.)"},{"t":"p","h":"<b>244.<\/b> Окугула Тыныш белгилеринин эмне үчүн коюлгандыгын түшүндүргүлө."},{"t":"v","l":["1. – Жаштарга жана карыларга кандай адеп керек?","– Жаштарга уяттуулук<sup>1<\/sup>, карыларга болсо билим менен токтоолук ылайык.","– Бул ааламда адам үчүн өмүрдөн артык бир нерсе барбы?","– Алар үчөө: ишеним, сүйүү жана Мекен. («КБ»)"]},{"t":"v","l":["2. Ала-Тоо, бизге бирдей кышы-жайың,","Сулуусуң жылдар аттап өткөн сайын.","Ала-Тоо – өмүрдүн гүлдүү багы,","Ала-Тоо кечээгинден бүгүн жаңы.","Сапар тартсам да, дайым кылчактаймын,","Өзүң менен бир бүткөн жүрөк каны. (Р.Ш.)"]},{"t":"v","l":["<b>Кайталоо үчүн суроолор:<\/b>","1. Кандай түзүлүштөгү сүйлөм бир тутумдуу деп аталат?","2. Жактуу жана жаксыз сүйлөмдөрдө анын грамматикалык негизин сүйлөмдүн кайсы мүчөсү түзөт?","3. Атама сүйлөм эмнелерде көбүрөөк колдонулат?","4. Кемтик сүйлөм жөнүндө айтып бергиле Мисал келтиргиле.","5. Кандай сүйлөмдү жактуу дейбиз? Мисал келтиргиле.","6. Диалогдо коюлуучу тыныш белгиси жөнүндө эмне билесиңер?"]}],"sub":[{"title":"ТАЛДООНУН ТАРТИБИ","b":1}],"pages":[119,120]},{"title":"VIII класста өздөштүрүлгөндөрдү кайталоо","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"121\">121<\/span>VIII КЛАССТА ӨЗДӨШТҮРҮЛГӨНДӨРДҮ КАЙТАЛОО"},{"t":"p","h":"<b>БК 245.<\/b> Кептин түрлөрүнө көңүл бургула жана аларды эсиңерде сактагыла. Тил менен кептин карым-катышы кандай?"},{"i":1260,"page":121,"t":"img","src":"data:image/webp;base64,UklGRv4aAABXRUJQVlA4IGoEAAAwHgCdASrGAGEAPrVSpEunJSOhrLo4cOAWiU3bq81ZLMKL27+/b7bXqA5gH9E/XT3G/y7/UeoD+Vf5T1//Q1//8fa9mj9zv2qzJZ9n9q2sBrPwB/VzxL9r8SDsjgAfk/8/9f+Zf/vaf/T/U+sh/0Dyw+A0gwo1tvZ/1QLjMDwnDM9S28OVNgcNaoIBqs//xoolaUQ71RB8/DU+YOK7+IYsrU77pplUvbho5kHqgJp1RBV11Wp52vX0N3PLaPQnbEkH7qa/UZ7LYQ+eOznncO1XzM+0eGtAWLfBmCsrK8kMJKt5olqZVcDjHKWMtXMEmzC5dwW8zWsfKEBoAP74TQAJXZ73b4oCwvZodGzG5omCE5TGH9kSPr8b5kbRV9Puf+CCVq5oLWW98/qjMIs8bB0dScMUEPzfUvAkX/QTI+jLWJRn/zDwEv05LVL7oz4npIyq9JRdSNH6bzRvm8z p","h":"Кыраан бүркүт, жаңырган айыл, көпкөк асман, тоодон бийик, ууздай сапсары, жоокерлерден алтоо, бийлегендерге кол чабуу, үч эсе көбөйтүү, мекенге кызмат кылуу, окуудан келүү, акылдуунун сөзү, биздин мектеп, сууда сүзүү, ийгиликке кубануу, эмгек менен даңктануу."},{"t":"p","h":"<b>249<\/b> Төмөнкү тартип боюнча сөз айкашын түзгүлө. Сөз айкашындагы сөздөр кайсы сөз түркүмүнөн болду? Сөз айкашынын түзүлүшүн аныктагыла."},{"t":"v","l":["Зат атооч + этиш","Сан атооч + этиш","Сын атооч + этиш","Зат атооч + зат атооч","Ат атооч + зат атооч","Зат атооч + сан атооч","Ат атооч + сан атооч","Зат атооч + сын атооч","Сын атооч + сын атооч","Сан атооч + сын атооч","Зат атооч + ат атооч","Атоочтук + зат атооч"]},{"t":"p","h":"<b>250.<\/b> Сөз айкашына талдоо жүргүзгүлө. Багыныңкы жана негизги сөздүн ортосунда синтаксистик байланыштын кандай жолдору бар? Сөз айкашы менен сөздүн жалпылыгы жана алардын айырмачылыгы эмнеде?"},{"t":"p","h":"Билим жөнүндө ойлонуу, кап-кап эгин, бүркүттүн уясы, кыштоону көздөй баруу, тырышчаак бала, шайдоот жигит, чечкиндүү сүйлөө, чоң атамдын жомогу, карыялардын сөзү, куштай сызуу, экзаменге даярдануу."},{"t":"p","h":"<span class=\"pg\" data-n=\"123\">123<\/span><b>251.<\/b> Көчүргүлө. Калтырылып кеткен тыныш белгилерди койгула. Эмне үчүн койдуңар? Сүйлөмдүн грамматикалык негизин түзгөн сүйлөм мүчөлөрүнүн астын сызгыла."},{"t":"p","h":"Эх, эми эмнесин айтайын // Кесепеттүү кырсык нечендердин кендирин кыйды // Атаганат, Жайнагым аман турганда не деген адам болор эле // Мүнөзүңдөн айланайын балам // Кайдасың // Кайдасың // Кайдасың // – Толгонай, сабыр кыл // Өзүңдү аясаң боло// Сен мойнуңдагы милдетти унуттуңбу // (Ч.А.)"},{"t":"p","h":"<b>252.<\/b> Көчүргүлө. Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Бөлүнгөн сөздөрдүн синтаксистик кызматын аныктагыла. Алар сүйлөмдүн ар башка мүчөлөрүнүн милдетин аткаргандыгын кандайча түшүндүрүүгө болот?"},{"t":"p","h":"1. Дүкөндө <i>кызыл портфель<\/i> сатылды. 2. Мен <i>кызыл портфель<\/i> сатып алдым. 3. Балдар <i>портфелдин кызылын<\/i> жакшы көрүшөт. 4. Менин сатып алган <i>портфелим – кызылы.<\/i>"},{"t":"p","h":"<b>253.<\/b> Сүйлөм мүчөлөрү боюнча оозеки талдоо жүргүзгүлө. Алар кайсы сөз түркүмүнөн болду? Бөлүнгөн сөздүн синтаксистик кызматы кандай? Жөнөкөй сүйлөмдүн кайсы түрлөрү бар?"},{"t":"p","h":"Быйыл биздин айылда жаңы <i>мектеп<\/i> курулду. Ал <i>мектеп<\/i> шаардагыдай эки кабаттуу. Мындай <i>мектептен<\/i> билим алуу кандай жакшы! Келечекте <i>мектептин<\/i> айланасына бак-дарактар отургузулат."},{"t":"p","h":"<i>Мектепти<\/i> ким сүйбөйт? Ал – жаштарга таалим-тарбия берүүнүн уясы. Тээтиги кооз имарат – биздин <i>мектеп.<\/i> (К.Б.)"},{"t":"p","h":"Үлгү: <i>Быйыл биздин айылда жаңы мектеп курулду —<\/i> Эмне болду? – <i>курулду<\/i> – баяндооч; <i>жаңы —<\/i> аныктооч; кайда курулду? <i>– айылда<\/i> – орун бышыктооч; кимдин? – <i>биздин —<\/i> аныктооч; качан курулду? – быйыл мезгил бышыктооч. Түзүлүшү боюнча эки тутумдуу сүйлөм, жайылма."},{"t":"p","h":"<b>254.<\/b> Сүйлөмдүн баш жана айкындооч мүчөлөрүн көрсөткүлө. Толуктооч жана бышыктооч баяндооч менен кандайча байланышат? Ушул көнүгүүдөн мисал келтиргиле."},{"t":"p","h":"1. Биз саякатыбызды баштадык. Дашманды, Кызылүңкүрдү, Каралманы араладык. Жаңгактын данеги ар кандай заттарга бай. («КБ») 2. Эл үчүн жан-дилибиз менен иштейбиз. Бул <span class=\"pg\" data-n=\"124\">124<\/span>жөнүндө кечээ жыйналышта сөз болду. («АТ») 3. Адегенде жакшы уул болот. Жакшы ата болууга алып баруучу жол – ошол. (Мак.)"},{"t":"p","h":"<b>255.<\/b> Окугула Аныктоочту жана бышыктоочту тапкыла. Аларды өз ара салыштырып, окшош белгилерин жана айырмачылыгын аныктагыла."},{"t":"p","h":"1. Мээримсиз туугандан мээримдүү дос жакшы. – Эне балдарына ар дайым мээримдүү мамиле жасайт. 2. Жакшы адамдын ачуусу бар, кеги жок. 3. Жакшы сүйлөсөң, жылан да ийинден чыгат. (Мак.) 4. Отургандар көңүлдүү ырларды ырдашты. – Биздин курбулар аларды көңүлдүү кабыл алышты. 5. Алты бала спорттук мелдешке кетти. – Алар атаандаштары менен алты жолу беттешиптир. 6. Аскат алтынчы класска барды. – Ал алты жолу мектепке барды. («КМ»)"},{"t":"p","h":"<b>256.<\/b> Окугула. Толуктоочту жана бышыктоочту көрсөткүлө. Алардын окшош белгилерин жана айырмачылыгын түшүндүргүлө. Бөлүнгөн сөздөр сүйлөмдүн кайсы мүчөсү?"},{"t":"p","h":"<b>257.<\/b> Окугула. Толуктоочту жана бышыктоочту көрсөткүлө. Алардын окшош белгилерин жана айырмачылыгын түшүндүргүлө. Бөлүнгөн сөздөр сүйлөмдүн кайсы мүчөсү?"},{"t":"p","h":"1. Атак-даңк <i>асмандан<\/i> түшпөйт. – Ал <i>ак эмгектен<\/i> жаралат. 2. Окууга өтөм деп, Кенжебек <i>шаарга<\/i> кеткен эле. – <i>Билимдүүгө<\/i> дүйнө жарык. 3. —Сен <i>айылдан<\/i> келдиңби? – Баккан малыбыз <i>кыштан<\/i> семиз чыкты."},{"t":"v","l":["4. <i>Бийикти<\/i> жайлайт кыргыздар,","<i>Бийикте бийик<\/i> турмуш бар.","Көйкөлүп жатсаң <i>бийикте,<\/i>","Көрүүгө болбойт ким куштар? (Б.С.)"]},{"t":"p","h":"<b>258.<\/b> Багыныңкы байланыштын жолдорун эсиңерде сактагыла. Алардын ар бири сүйлөмдүн кайсы мүчөлөрүнүн ортосунда болот? Мисал ойлоп тапкыла."},{"t":"v","l":["Багыныңкы байланыштын жолдору:","1) ээрчишүү","2) ыкташуу","3) башкаруу","4) таандык байланыш"]},{"t":"p","h":"<span class=\"pg\" data-n=\"127\">127<\/span><b>Б. Өмүралиев, Ш. Уринбаева<\/b>"},{"t":"v","l":["Ө-42 Кыргыз тили: Жалпы орто билим берүүчү мектептердин 8-классы үчүн окуу китеби /Б. Өмүралиев, Ш. Уринбаева. – 4-басылышы. Т.: «O‘zbekiston», 2019. –128-б.","1. Авторлор","ISBN 978-9943-01-516-6","<b>УҢК 811.512.154(075)<\/b>","<b>КБК 81.2(Кир)-922<\/b>"]},{"t":"p","h":"<i>O‘quv nashri<\/i>"},{"t":"p","h":"<b>Boogachi Omuraliyev, Shahzada O‘rinbayeva<\/b>"},{"t":"p","h":"<b>QIRG‘IZ TILI<\/b>"},{"t":"v","l":["<i>Umumta’lim maktablarining 8-sinf o‘quvchilari uchun darslik<\/i>","<i>(Qirg‘iz tilida)<\/i>","To‘rtinchi nashri","Редактору <i>Р. Жуманазарова<\/i>","Көркөм редактору <i>Х. Кутлуков<\/i>","Техн. редактору <i>Л. Хижова<\/i>","Компьютерде даярдаган <i>Б. Душанова<\/i>","Басма лицензиясы AI № 158.14.08.09. 2019-жылы 15-февралда басууга уруксат этилди. Форматы 60×90<sup>1<\/sup>/<sub>16<\/sub>. Офсет кагазы. Арип түрү «Таймс». Офсеттик басма ыкмасында басылды. Шарттуу басма табагы 8,0. Учёттук басма табагы 8,13. Нускасы 811. Келишим № 19-112.","Өзбекстан Республикасы Президенти Администрациясынын алдындагы Маалымат жана массалык коммуникациялар агенттигинин «O‘zbekiston» басма-полиграфиялык чыгармачылык үйүндө басылды.","100011. Ташкент. Наваий көчөсү, 30.","Телефон: (371) 244-87-55, 244-87-20","Факс: (371) 244-37-81, 244-38-10.","e-mail: uzbekistan@iptd-uzbekistan.uz","www.iptd-uzbekistan.uz"]}],"sub":[{"title":"МАНАС","b":5},{"title":"БАКАЙ","b":7}],"pages":[121,127]}],"quality":"exact"};</script>

  function fetchJSON(url) {

  // ---- sending to the server (API): error reports and uploaded books
  function api(path, opts) {
    return fetch(API + path, opts).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function postJSON(path, data) {
    // text/plain keeps this a "simple" request (no CORS preflight), which is faster on slow phones
    return api(path, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(data) });
  }
  // Reports made offline wait on the phone and go out with the next one, or when the app opens online.
  function sendReports() {
    var q = lsGet('reports', []);
    if (!API || !q.length || navigator.onLine === false) return Promise.resolve(false);
    var r = q[0];
    return postJSON('/reports', r).then(function () {
      lsSet('reports', lsGet('reports', []).filter(function (x) { return x.at !== r.at; }));
      return sendReports().then(function () { return true; });
    }, function () { return false; });
  }
  // Reading counts (only where the server is): the site was opened, a book was opened, a book was downloaded.
  // Nothing identifies the reader. "f" marks this phone's first time (the app: today; a book: ever), so the server
  // can count phones without an id. Events wait on the phone while offline and go out in batches.
  var hitTimer = null;
  function hit(book, e) {
    if (!API) return;
    var d = new Date().toISOString().slice(0, 10), f = 0;
    if (e === 'app') { f = lsGet('hitDay', '') === d ? 0 : 1; lsSet('hitDay', d); }
    if (e === 'open') { var seen = lsGet('hitSeen', {}); f = seen[book] ? 0 : 1; seen[book] = 1; lsSet('hitSeen', seen); }
    lsSet('hits', lsGet('hits', []).concat([{ b: book, e: e, f: f, d: d }]).slice(-200));
    clearTimeout(hitTimer); hitTimer = setTimeout(sendHits, 3000);
  }
  function sendHits() {
    var q = lsGet('hits', []);
    if (!API || !q.length || navigator.onLine === false) return;
    var batch = q.slice(0, 50);
    postJSON('/hits', batch).then(function () {
      lsSet('hits', lsGet('hits', []).slice(batch.length));
      if (q.length > batch.length) sendHits();
    }, function () { /* try again next time */ });
  }
  function report(r) {
    r.at = Date.now();
    lsSet('reports', lsGet('reports', []).concat([r]));
    return sendReports();
  }

  var CHUNK = 8 * 1048576, MAX_FILE = 500 * 1048576;
  function uploadForm(box, list) {
    var f = document.createElement('form'); f.className = 'up';
    f.innerHTML = '<label>' + esc(t('upBook')) + '</label><select name="book">' + list.map(function (m, i) {
      return '<option value="' + i + '">' + esc(m.title + ', ' + m.grade + ' ' + t('grade') + ' (' + m.authors + ')') + '</option>';
    }).join('') + '<option value="-1">' + esc(t('upOther')) + '</option></select>' +
      '<label>' + esc(t('upFiles')) + '</label><input type="file" name="files" multiple accept="application/pdf,image/*">' +
      '<label>' + esc(t('upContact')) + '</label><input type="text" name="contact" maxlength="200" autocomplete="off">' +
      '<label>' + esc(t('upComment')) + '</label><textarea name="comment" rows="2" maxlength="2000"></textarea>' +
      '<button class="btn primary" type="submit">' + esc(t('upSend')) + '</button><div class="progress" hidden><i></i></div>';
    box.appendChild(f);
    var btn = $('button', f), prog = $('.progress', f), bar = $('.progress i', f);
    f.onsubmit = function (e) {
      e.preventDefault();
      var files = Array.prototype.slice.call(f.files.files);
      if (!files.length) { toast(t('upNoFiles')); return; }
      for (var i = 0; i < files.length; i++) if (files[i].size > MAX_FILE) { toast(t('upTooBig') + files[i].name); return; }
      var m = list[+f.book.value], total = files.reduce(function (a, x) { return a + x.size; }, 0) || 1, sent = 0;
      btn.disabled = true; btn.textContent = t('upSending'); prog.hidden = false; bar.style.width = '0';
      postJSON('/uploads', { book: m ? m.title + ', ' + m.grade + ' (' + m.school + '): ' + m.authors : 'other', contact: f.contact.value, comment: f.comment.value, lang: S.ui })
        .then(function (up) {
          // each file goes in pieces, so a big scan survives a slow mobile connection
          return files.reduce(function (p, file) {
            return p.then(function () {
              return postJSON('/uploads/' + up.id + '/files', { name: file.name, size: file.size, type: file.type }).then(function (fr) {
                var parts = [], n = 0;
                function next() {
                  var start = n * CHUNK; if (start >= file.size && n > 0) return Promise.resolve();
                  var piece = file.slice(start, start + CHUNK), num = ++n;
                  return api('/uploads/' + up.id + '/files/' + fr.file + '/' + num, { method: 'PUT', body: piece }).then(function (pr) {
                    parts.push({ n: num, etag: pr.etag }); sent += piece.size; bar.style.width = Math.round(sent / total * 100) + '%';
                    return next();
                  });
                }
                return next().then(function () { return postJSON('/uploads/' + up.id + '/files/' + fr.file + '/done', { parts: parts }); });
              });
            });
          }, Promise.resolve());
        })
        .then(function () { f.innerHTML = '<p class="done">' + esc(t('upDone')) + '</p>'; })
        .catch(function (e) {
          if (e && e.message === '507') { f.innerHTML = '<p class="done">' + esc(t('upFull')) + '</p>'; return; } // storage full (MAX_TOTAL in the Worker)
          btn.disabled = false; btn.textContent = t('upSend'); prog.hidden = true; toast(navigator.onLine === false ? t('offline') : t('err')); });
    };
  }

  // Books under subject headings; subjects without books are never shown.
  function bySubject(books, root, myView, stubs) {
    var groups = {}, keys = [];
    books.forEach(function (b) {
      var s = subjectOf(b);
      if (!groups[s.key]) { groups[s.key] = { s: s, books: [] }; keys.push(s.key); }
      groups[s.key].books.push(b);
    });
    keys.sort(function (a, b) { var x = groups[a].s, y = groups[b].s; return x.order - y.order || (x.name < y.name ? -1 : x.name > y.name ? 1 : 0); });
    keys.forEach(function (k) {
      var h = document.createElement('h3'); h.className = 'subj'; h.textContent = groups[k].s.name;

  // sits there without the CORS header (img.elkitep.com sends it only when asked and without "Vary: Origin"), and
  // reading it from there fails, so books that had been opened could not be downloaded. One retry for bad connections.
  function getPic(u, tries) {
    return fetch(u, { mode: 'cors', cache: 'reload' }).then(function (r) { if (!r.ok) throw new Error(u); return r; })
      .catch(function (e) { if (tries > 0) return getPic(u, tries - 1); throw e; });

  // ================================================================ CARD BOOKS

  var CARD_L = {

      think: 'Подумайте', practice: 'Задания', recap: 'Итоги', pg: 'стр. {n}', step1: 'Решение: шаг 1 из {n}',
      stepN: 'Следующий шаг: {k} из {n}', ans: 'Показать ответ', ansHide: 'Скрыть ответ' },
    ky: { cover: 'Бөлүм', goal: 'Окуу максаты', recall: 'Эстеп көрөлү', idea: 'Негизгиси', example: 'Мисал', try: 'Аракет кылып көр',
      think: 'Ойлонуп көр', practice: 'Тапшырмалар', recap: 'Жыйынтык', pg: '{n}-бет', step1: 'Чыгаруу: {n} кадамдын 1-кадамы',
      stepN: 'Кийинки кадам: {n} кадамдын {k}-кадамы', ans: 'Жоопту көрсөтүү', ansHide: 'Жоопту жашыруу' }
  };

  function startCards(book, entry) {
    var L = CARD_L[book.lang] || CARD_L[entry && entry.school] || CARD_L.ru;
    function lt(k, n, kk) { return L[k].replace('{n}', n).replace('{k}', kk); }
    document.title = book.title;
    var flat = [];
    book.sections.forEach(function (s, si) { s.cards.forEach(function (c, ci) { flat.push({ s: s, si: si, c: c, ci: ci }); }); });
    var posKey = 'pos:' + book.id;
    app.innerHTML =
      '<div class="cr">' +
      '<div class="cr-top"><a class="icon" href="' + libHash + '" aria-label="' + esc(t('back')) + '">' + ICONS.back + '</a>' +
      '<div class="cr-where"><small></small><b></b></div>' +
      (qBadge(entry) ? '<button class="icon b-q" aria-label="' + esc(t('quality')) + '"><span class="qdot q-' + entry.quality + '"><i></i></span></button>' : '') +
      '<button class="icon b-toc" aria-label="' + esc(t('contents')) + '">' + ICONS.toc + '</button>' +
      '<button class="icon b-set" aria-label="' + esc(t('settings')) + '">' + ICONS.set + '</button></div>' +
      '<div class="cr-dots"></div>' +
      '<div class="cr-strip" lang="' + esc(book.lang || '') + '">' + flat.map(function (f, i) { return '<div class="cr-slot" data-i="' + i + '"></div>'; }).join('') + '</div>' +
      '<div class="cr-foot"><button class="icon cr-prev" aria-label="' + esc(t('back')) + '">' + ICONS.back + '</button>' +
      '<span class="cr-n"></span><button class="icon cr-next" aria-label="→">' + ICONS.back + '</button></div>' +
      '</div>';
    var strip = $('.cr-strip'), slots = strip.children, dots = $('.cr-dots');

    function cardHTML(c) {

        '<button class="cr-btn solid" data-act="step">' + esc(lt('step1', c.st.length)) + '</button>' : '';
      var ans = c.a ? '<button class="cr-btn" data-act="ans">' + esc(L.ans) + '</button><div class="cr-ans">' + c.a + '</div>' : '';
      var pg = c.pg ? '<span>' + esc(lt('pg', String(c.pg).replace('-', '–'))) + '</span>' : '';
      var title = c.h || L[c.t] || '';
      return '<article class="card" data-t="' + esc(c.t) + '"><div class="card-h"><div class="kind">' + esc(L[c.t] || '') + pg + '</div>' +
        (title ? '<h2>' + title + '</h2>' : '') + '</div><div class="card-b">' + (c.b || '') + steps + ans + '</div></article>';
    }
    // only the cards near the one on screen are drawn: a maths book has a thousand cards full of drawings
    function fill(i) {
      for (var k = 0; k < slots.length; k++) {
        var near = Math.abs(k - i) <= 2, el = slots[k];

    // contents: jump to a printed page of the textbook, or to a section
    function pageRange(pg) { var m = String(pg || '').match(/(\d+)(?:\s*[-–]\s*(\d+))?/); return m ? [+m[1], +(m[2] || m[1])] : null; }
    function findPage(n) {

    }
    $('.b-toc').onclick = function () {
      var start = 0, si = flat[cur].si;
      var html = '<h3>' + esc(t('contents')) + '</h3>' +
        '<div class="goto"><input type="number" inputmode="numeric" placeholder="' + esc(t('gotoPage')) + '"><button class="btn primary">' + esc(t('go')) + '</button></div><div class="toc">' +
        book.sections.map(function (s, k) {
          var r = pageRange(s.cards[0] && s.cards[0].pg);
          var h = '<a href="#" data-i="' + start + '"' + (k === si ? ' class="cur"' : '') + '>' + esc(s.title) + (r ? '<span class="p">' + r[0] + '</span>' : '') + '</a>';
          start += s.cards.length; return h;
        }).join('') + '</div>';
      var sh = openSheet(html);
      var c = $('.cur', sh); if (c && c.scrollIntoView) c.scrollIntoView({ block: 'center' });
      sh.addEventListener('click', function (e) {
        var a = e.target.closest('a[data-i]'); if (!a) return;
        e.preventDefault(); closeSheet(); go(+a.getAttribute('data-i'), false);
      });
      var inp = $('input', sh);
      function jump() { var i = findPage(parseInt(inp.value, 10)); if (i < 0) { toast(t('notFound')); return; } closeSheet(); go(i, false); }
      $('.goto button', sh).onclick = jump;
      inp.onkeydown = function (e) { if (e.key === 'Enter') jump(); };
    };
    var bq = $('.b-q'); if (bq) bq.onclick = function () { qualitySheet(entry); };
    $('.b-set').onclick = function () { settingsSheet(function () { go(cur, false); }); };

    function onKey(e) {
      if ($('.zoom')) return;
      if ($('.sheet')) { if (e.key === 'Escape') closeSheet(); return; }
      if (e.key === 'ArrowRight') { e.preventDefault(); go(cur + 1, true); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1, true); }
    }
    document.addEventListener('keydown', onKey);
    var rt; function onResize() { clearTimeout(rt); rt = setTimeout(function () { var i = cur; cur = -1; go(i, false); }, 150); }
    window.addEventListener('resize', onResize);
    cleanup = function () { document.removeEventListener('keydown', onKey); window.removeEventListener('resize', onResize); closeSheet(); };

    var pos = lsGet(posKey, null);
    go(pos && pos.c < flat.length ? pos.c : 0, false);
  }

  // ---------------------------------------------------------------- boot
  applySettings();
  window.addEventListener('hashchange', route);
  route();
  if (!EMB) {
    sendReports(); window.addEventListener('online', sendReports);
    hit('', 'app'); window.addEventListener('online', sendHits);
  }
  if (!EMB && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () { /* offline support unavailable */ });
  }
})();
</script>
</body>
</html>

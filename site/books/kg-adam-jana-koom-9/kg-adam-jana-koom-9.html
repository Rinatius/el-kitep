издин элдин салтына жатпаган көрүнүш. Ошондуктан, Конституциядагы ата-эне үчүн балдары кам көрө тургандыгы женундөгү жобо мыйзамдарда өнүктүрүлгөн. Ошентип, уулдун же кыздын парзы адептик, укуктук мааниге ээ болду. Үй-бүлөлүк укуктук ченемдерге ылайык жашы жеткен балдар жардамга муктаж ата-энелерин багууга милдеттүү. Антпесе, ата-әнелер сотко кайрылып, аларды кам көрүүгө милдеттендирүүгө мыйзам жол берет."},{"t":"p","h":"Кыргыз Республикасынын Конституциясы биздин элибиздин салтын колдоп, 37-берененин 2-пунктунда: улууларды урматтоо, туугандары менен жакындарына камкордук көрүү ар бир адамдын милдети деп белгиленген. Кыргыз элинин макалы бар: «Улууга сый, кичүүгө урмат» деген. Улууну сыйлоо, жакындарына, бей-бечараларга камкордук көрүү <span class=\"pg\" data-n=\"85\">85<\/span>Г @ ГП глава, Кыргыз Республикасынын жараны"},{"t":"p","h":"сыяктуу кыргыз элинин илгертеден келе жаткан ыйык салтын биздин мамлекет эркиндикке жетип, Конституциябызды кабыл алганда укуктук денгээлге чейин көтөрдү. Бул жобо коомубуздун өнүгүп, өсүшүнө, адамдардын ортосундагы мамилелердин жакындашына, элибиздин рухий абалынын бийиктешине көмөгүн көрсөтөрү шексиз. Бирок, буга окшогон жоболорду адамдар көңүлү менен колдобосо, ал жазуу жүзүндө эле калышы мүмкүн. Ошондуктан, элдин жакшы салттарын, мыйзамды бала кезден урматтап, сыйлап жана аткаруу керек."},{"t":"h3","h":"КОШУМЧА МАТЕРИАЛ"},{"t":"v","l":["Кыргыз Республикасынын Конституциясы","(Үзүндү)","36-берене"]},{"t":"p","h":"1. Үй-бүлө – коомдун негизи. Үй-бүлө, ата болуу, эне болуу, бапапык – бүткүл коомдун камкордугуна алынат жана мыйзам менен артыкчылыктуу корголот."},{"t":"p","h":"2. Ар бир бала анын дене-боюнун, акыл эсинин, ички рухий, ыймандык жана социапдык өнүгүүсү үчүн зарыл болгон жашоо деңгээлине укуктуу."},{"t":"p","h":"3. Баланын өнүгүшү үчүн зарыл болгон жашоо шарттарын камсыздоо жоопкерчилиги өздөрүнүн жөндөмдөрү менен финансылык мүмкүнчүлүктөрүнә жараша баланы тарбиялап жатышкан ата-эне менен тарбиячы адамдардын ар бирине жүктөлөт."},{"t":"p","h":"4. Мамлекет жетим балдарды жана ата-энесинин камкордугунан ажыраган балдарды багууну, тарбиялоону, окутууну камсыз кылат."},{"t":"p","h":"5. Нике курагына жеткен адамдар никеге турууга жана үй-бүлө күтүүгө укуктуу. Бир дагы нике никеге туруучу адамдардын ыктыярдуу, эки тараптуу макулдугусуз түзүлбөөгө тийиш. Нике мамлекет тарбынан каттоого алынат."},{"t":"h3","h":"\\ КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"v","l":["1. Үй-бүлөнүн коом үчүн кандай пайдасы бар?","2. Никеге турууга канча жаштан уруксат берилген?","3. Никеге туруу үчүн кандай шарттар талап кылынат?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"86\">86<\/span>ГП глава. Кыргыз Республикасынын жараны"},{"t":"p","h":"4. Жубайлардын жекече жана мүлктүк укуктары кандай?"},{"t":"p","h":"5. Балдардын укуктары жөнүндө эмнени билесиң?"},{"t":"p","h":"6. Балдардын жана ата-энелердин милдети жөнүндө айтып бер?"},{"t":"p","h":"7. Кыргыз Республикасынын Конституциясына кыргыз элинин салтына байланыштуу кандай жобо киргизилген?"},{"t":"v","l":["§ 18. Әмгектенүүгө укук,","социалдык камсыздандыруу"]},{"t":"p","h":"Кыргыз Республикасынын Конституциясы жана эмгек жөнүндөгү мыйзамдары эмгектенүү укугун кеңири баяндап жана анын аткарылышын камсыз кылат. Эмгектенүү укугу – бул иштөөгө жана иштеп каражат табууга гана укуктуулук эмес, ошондой эле жарандык жөндөмдүүлүгү менен таланттын өнүктүрүүгө да укуктуулук болот. Көптөгөн мамлекеттерде бул укук Конституцияларда жазылган. Бирок бул укукту жарыялоо аздык кылат, аны ишке ашыруу керек. Кыргызстанда бүл укукту ишке ашыруу төмөндөгү шарттар менен камсыз кылынат."},{"t":"p","h":"1. Кыргыз Республикасынын жараны бардык түрдөгү жана жагдайдагы эмгегинин корголушуна укуктуу. Мурдагы социалисттик коомдун убагында эмгектенүүнүн көптөгөн түрлөрүнө тыюу салынган эле. Мисалы, жекече ишкердик жүргүзүүгө жана жекече коммерция кылууга тыюу салынып, аны бузган адамдар кылмыш жообуна тартылышчу. Азыр болсо, жарандар кандай гана түрдө болбосун жана ар кандай жагдайларда эмгек кылууга укуктуу. Бирок, мамлекеттин, коомдун жана жарандардын кызыкчылыгына карама-каршы келген иштерди иштөөгө мыйзам тарабынан жол берилбейт. Мисалы, спирт ичимдиктерин чыгаруу боюнча мамлекеттик монополияны бузуу же баңги заттарын, курал-жарактарды жасоо сыяктуу иштер. Бул чөйрөдө адамдарга жекече ишкердик жүргүзүүгө болбойт."},{"t":"p","h":"<span class=\"pg\" data-n=\"87\">87<\/span>ПТ глава. Кыргыза Республикасынын жараны"},{"t":"p","h":"2. Коопсуздук жана гигиена талаптарына жооп берген эмгек шартына укуктуулук. Жумуш берип жаткан ишкана, ал мамлекеттик, коомдук же жеке менчикте болобу, техника коопсуздугуна, гигиенанын талаптарына жооп берген шарттарды түзүүгө милдеттүү. Бул коопсуздуктун ченемдери мыйзамдар тарабынан белгиленген. Ал ченемдер бузулган учурларда техника коопсуздугу, өрт коопсуздугу боюнча көзөмөл, санитариялык көзөмөл органдары тарабынан ар кандай эскертүү, жаза чаралары, ал түгүл, ишкананы жабууга чейинки чаралар колдонулушу мүмкүн."},{"t":"p","h":"3. Жарандар жумушсуздуктан социалдык коргоого алынууга укуктуу. Мыйзам боюнча жумушсуз адамга мамлекет тарабынан жөлөк пул төлөнөт. Мамлекет андай адамдардын башка кесипке үйрөнүүсүнө жана ага ылайык башка жумуш ордун таап берүүгө көмөктөшөт. Бул чара эмгектенүү укугун жен гана жарыялап койбостон, анын чыныгы камсыз болушуна мамлекет тарабынан көрүлгөн камкордук болуп эсептелет."},{"t":"p","h":"4. Мамлекет жарандарды кесипке үйрөтүүгө жана алардын адистик чеберчилигин жогорулатууга кам көрөт. Мамлекет адистикке ээ болуу үчүн жарандарга мүмкүндүк берет. Бул чара өлкөбүздөгү кесиптик-техникалык окуу жайларынын кенири тармагынын бар экендиги жана аларда окутуу бекер жүргүзүлгөндүгү менен камсыз кылынат."},{"t":"p","h":"5. Согуш, табигый кырсык, эпидемия жана башка өзгөчө абал учурларынан, ошондой эле соттун өкүмү боюнча жаза өтөөдөн башка учурларда мажбурлап иштетүүгө тыюу салынат. Бул жобо – эмгектенүү милдет эмес, укук экендигин ырастайт. Адамды мажбурлап иштетүүгө мыйзам тыюу салат. Бирок, өзгөчө учурларда коомдун, мамлекеттин, жарандардын жана ошол эле жеке адамдын өзүнүн жалпы кызыкчылыгы үчүн ар кандай иштерди аткарууга туура келет. Мисалга алсак, согуш учурунда шаарды коргоо үчүн окоп, траншея казуу керек болуп калса, ага кесибине, жашына карабай ошол шаардын калкы тартылууга мүмкүн. Же болбосо,"},{"t":"p","h":"<span class=\"pg\" data-n=\"88\">88<\/span>ТИ глава. Кыргыз Республикасынын жараны"},{"t":"p","h":"жер титирөөдөн калктуу конуш кыйрап калса, үйлөрдүн алдында калган адамдарды чыгаруу үчүн иштей ала турган адамдар чакырылышы мүмкүн. Мындай учурларда, бул жумушту аткарууга катышпайм, менин эмгек укугумду бузуп жатасынар деп айтуунун өзү барып турган акылсыздык болор эле."},{"t":"p","h":"б. Әмгек келишими боюнча иштеген жарандар тиричилик каражаттарынын мамлекет аныктаган эн төмөнкү чегинен кем эмес акы алууга укуктуу. Жеке адамга тиешелүү ишканабы же мамлекеттик ишканабы, жумушка эмгек келишими менен кирген адамга төлөнүүчү эмгек акы жумуштун көлөмүнө карабастан, мамлекет аныктаган эң төмөнкү чектен кем болбошу керек."},{"t":"p","h":"Т. Жарандардын иш таштоого укуктуу экендиги Конституция тарабынан бекемделген. Иш таштоону өткөрүүнүн тартиби жана шарттары мыйзам тарабынан аныкталган. Бул укук эмгек укугун жүзөгө ашыруунун эң маанилүү шарты болуп эсептелет. Анткени, иш таштоо аракеттери эмгектенүүнүн шарттары бузулганда, аны жоюуга иш берүүчүнү аргасыз кылуу максатында жасалат жана эреже катары натыйжалуу болот. Мисалы, Англиядагы, Россиядагы шахтёрлордун иш таштоолорун эстегиле. Алар эмгек акыны көбөйтүүнү жана убагында берүүнү, ошондой эле жумуш шарттарын жакшыртууну талап кылышкан. Натыйжада талаптарынын аткарылышына жетишкен."},{"t":"p","h":"Биз Конституцияда белгиленген эмгек укугун жүзөгө ашыруучу башка шарттарды талдадык. Әмгек мамилелери өтө татаал, ошондуктан эмгек тууралуу мыйзамдар чогултулуп, өзүнчө Эмгек кодекси иштелип чыккан. Бул Кодексте эмгектенүү, ал түгүл эс алуу жана социалдык камсыздандыруу маселелери да камтылган. Әми биз, силерге керектүү болгон эмгек жолунун башталышы, жаштардын эмгектенүүсү жөнүндөгү маселелерге кайрылалы."},{"t":"p","h":"Ишке кирип жатканда, мыйзам боюнча жаш адамдын, баарыдан мурда жашы такталат, себеби өспүрүмдөр 15 жа- <span class=\"pg\" data-n=\"89\">89<\/span>Г глава. Кыргыз Республикасынын жараны"},{"t":"p","h":"шынан баштап иштей алышат. Бул учурда 16га толгонго чейин жумуш убактысынын узактыгы жумасына 24 саат гана болот, ал эми 16 жаштан 18 жашка чейин 36 саатты тузет. 18ге чыккандан кийин жумуш убактысы бардык жарандар учун жумасына 41 саат."},{"t":"p","h":"Жаштардын кандай адистик боюнча иштегиси келгендиги да мааниге ээ, анткени жашы жетпегендер учун тыюу салынган кесиптер да бар."},{"t":"p","h":"Мисалы, 18 жашка чейин шахтёр, газ менен ширетүүчү, уста болууга мүмкүн эмес. Бул учурда мыйзам медицина менен тыгыз байланышта болуп, жаш жарандардын ден соолугун сактоо максатын көздөйт. Ал эми бул кесиптерди үйрөнүүгө 18 жашка толгонго чейин эле уруксат берилет. Эмгек кодексинде жашы жетпегендерди түнкү жана сор иштерге, дем алыш күндөрү иштетүүгө тыюу салынган."},{"t":"p","h":"Мындай чектеолер кыздарга карата бир кыйла катуу, анткени алар назик келишип, уландарга караганда алы чектүү. Мисалы, кыздар учун жүк көтөрүү ченеми уландарга караганда бир кыйла төмөн."},{"t":"p","h":"Мыйзам боюнча жашы жетпегендер үчүн бир катар жеңилдиктер берилген. Мисалы, алар өргүүнү дайым жайында алышат. Алардын өргүүсүнүн үзактыгы да чоңдордукунан көбүрөөк. Окууну иш менен айкалыштырып жаткандар үчүн да мыйзамда женилдетилген шарттар түзүлгөн."},{"t":"p","h":"Азыркы мезгилде, коомубуз рынок экономикасына өтүп жаткан учурда эмгек жөнүндөгү мыйзамдардын кээ бир жоболору кайрадан каралууда. Бирок, эмгекчилердин укуктарынын азайышына Конституция жол бербейт."},{"t":"p","h":"Әмгекке болгон укуктардан тышкары милдеттер да бар. Башкы милдеттердин бири эмгек тартибин сактоо болуп эсептелет. Ишке себепсиз келбей калса, жасаган ишинен брак кетирсе, администрация аларды тартиптик жоопкерчиликке тартат. Мындай жоопкерчиликке сөгүш жарыялоо, эмгек акысы төмөн ишке которуу жана иштен бошотуу кирет."},{"t":"p","h":"Кызматкер же жумушчу өзү иштеген ишканага же мекемеге зыян келтирсе, анын материалдык жоопкерчилигин"},{"t":"p","h":"<span class=\"pg\" data-n=\"90\">90<\/span>ГП глава. Кыргыз Республикасынын жараны"},{"t":"p","h":"кароо мүмкүн. Мисалы, жасаган продукциядан брак кетиргендерден чыгымды төлөтүү үчүн орточо эмгек акыдан ашпаган сумманы администрация төлөтүп ала алат. Әгерде көп өлчөмдөгү чыгым келтирилсе кылмыш жообуна да тартылышы мүмкүн."},{"t":"p","h":"Эмгек тартибин бузгандык учун да, эгер ал сор натыйжаларга алып келсе, күнөөлүү адамдар кылмыш жообуна тартылышат."},{"t":"p","h":"Кыргыз Республикасынын Конституциясынын 42-беренесинин жана Әмгек жөнүндөгү, Социалдык камсыздандыруу жөнүндөгү мыйзамдарга ылайык, жумушчулар менен кызматчылар, ал эми тийиштүү учурларда алардын үй-бүлө мүчөлөрү да мамлекеттик социалдык камсыздандыруу иретинде төмөндөгүлөр менен камсыз кылынат:"},{"t":"p","h":"1. Әмгекке убактылуу жарамсыз болуп калганда, аялдарга кош бойлуу кезинде, төрөгөндүгүнө жана баланы 1 жашка чейин багуу учурунда жөлөк пул төлөнөт."},{"t":"p","h":"2. Карылык, майыптык үчүн жана багып жаткан адамынан ажырап калган үй-бүлө мүчөлөрүнө бааракы төлөнөт."},{"t":"p","h":"Бул чаралар мамлекеттин эсебинен жана социалдык камсыздандыруу фондусунан теленет."},{"t":"h3","h":"КОШУМЧА МАТЕРИАЛ"},{"t":"v","l":["| к Кыргыз Республикасынын Конституциясы","(Үзүндү)","42-берене"]},{"t":"p","h":"1. Ар ким өз мүлкүнө, өз ишмердигинин натыйжаларына ээ болуу, колдонуу жана тескөө укугуна ээ."},{"t":"p","h":"2. Ар ким экономикалык эркиндикке ээ, өз жөндөмдүүлүгү менен мүлкүн мыйзамда тыюу салынбаган ар кандай экономикалык ишмердүүлүк үчүн эркин колдонууга укуктуу."},{"t":"p","h":"3. Ар ким эркин эмгектенүүгө, эмгекке жөндөмдүүлүгүн пайдаланууга, кесибин жана иштин түрүн тандоого, коопсуздуктун жана гигие- <span class=\"pg\" data-n=\"91\">91<\/span>ЇЇ глава. Кыргыз Республикасынын жараны ч, ДОР"},{"t":"p","h":"нанын талаптарына жооп берген эмгектик коргоого жана эмгек шарттарына укуктуу, ошондой эле мыйзам менен белгиленген жашоо минимумунан темен болбогон эмгек акы алуу укугуна ээ."},{"t":"v","l":["43-берене","1. Ар ким иш таштоого укуктуу.",") { КАЙТАЛОО ҮЧҮН СУРООЛОР"]},{"t":"p","h":"1. Жарандардын эмгек укугу кайсы ченемдик актыларда бекитил-"},{"t":"p","h":"ген?"},{"t":"p","h":"2. Жарандар кандай түрдө жана жагдайда эмгектене алышат? З. Эмгек укугун кепилдеген шарттар жөнүндө айтып бер?"},{"t":"p","h":"4. Кайсы учурда жарандарды милдеттүү түрдө жумушка тартууга"},{"t":"p","h":"болот?"},{"t":"p","h":"5. Жарандарга эмгек акы төлөөнүн башкы шарты кандай? Кыр-"},{"t":"p","h":"гызстанда жарандар иш таштоого акылуубу?"},{"t":"v","l":["6. Жумушка кайсы жаштан баштап орношууга болот?","7. Жаштар үчүн эмгек убактысынын узактыгы кандай?","8. Кандай жумуштарда иштөөгө жаштарга тыюу салынат?"]},{"t":"p","h":"9. Жаш жумушчулар үчүн жеңилдиктер жөнүндө эмне билесиң?"},{"t":"p","h":"10. Эмгек тартибин бузгандык үчүн кандай жоопкерчиликтер бар?"},{"t":"p","h":"11. Социалдык камсыздандыруунун кандай түрлөрү бар?"}],"sub":[],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЖАРАНЫ","pages":[81,91]},{"title":"§ 19. Билим алуу","blocks":[{"t":"h3","h":"§ 19. Билим алуу"},{"t":"p","h":"жана ден соолукту сактоо укугу"},{"t":"p","h":"1. Билим алуу укугу. Кыргыз Республикасынын Конституциясы ар бир жарандын билим алууга укуктуу экендигин белгилеген. Алар жынысына, улутуна, тилине, социалдык же мүлктүк абалына, ишинин түрүнө, жашына, мүнөзүнө, динине, саясий жана диний ишенимдерине, жашаган жерине же башка жагдайларга карабастан, билим алууга укуктуу. Кыргыз Республикасында билим берүүнүн бардык деңгээлинде мамлекеттик билим берүү стандарттары белгиленет."},{"t":"img","src":"data:image/webp;base64,UklGRuZFAABXRUJQVlA4INpFAACwqQGdASqAAo4BPrVOokwnJCcipXQduOAWiWlsyvwre7i972lnkQ7xKOEgGwK+fs5uKxxN8Z4N5aLu1+d/43aF2i+j3/q+Qwd/5e/9odj25AuemPT5TtOvX0hnAj9uegNLT6h0F/rHhZ0Q/cuhX0 птарды, окуучуларга жол бериле турган окуу талаптарынын чегин камтыйт."},{"t":"p","h":"Кыргыз Республикасында билим берүү программалары жалпы жана кесиптик болуп бөлүнөт."},{"t":"p","h":"Жалпы билим берүү программалары адамдын жалпы маданий денгээлин, интеллекттин түзүү, инсанды коомдо жашоого үйрөтүү, кесиптик билим программаларын туура тандап жана өздөштүрүүгө негиз түзүү боюнча милдеттерди аткарат. алпы билим берүү программалары төмөнкүдөй белуктөрдән турат:"},{"t":"p","h":"– мектепке чейин билим берүү (үй-бүлөдө, бала бакчада};"},{"t":"p","h":"– башталгыч билим берүү (1-5-класс);"},{"t":"p","h":"– негизги жалпы билим берүү (1—11-класс)."},{"t":"p","h":"<span class=\"pg\" data-n=\"93\">93<\/span>ШТ глава. Кыргыз Республикасынын жараны"},{"t":"p","h":"Кесиптик билим беруу программаларына:"},{"t":"p","h":"– кесиптик баштапкы билим берүү (кесиптик-техникалык окуу жайлар, лицейлер);"},{"t":"p","h":"– кесиптик орто билим берүү (техникумдар, колледждер);"},{"t":"p","h":"– кесиптик жогорку билим берүү (институттар, университеттер);"},{"t":"p","h":"– жогорку окуу жайлардан кийинки кесиптик билим берүү (ординатура, адъюнктура, аспирантура ж. 6.)."},{"t":"p","h":"Силер азыр негизги жалпы билим берүү программасын аяктоонун алдында турасынар. Күбөлүк алган сон орто (толук) билим алуу учун мектепте кала аласыңар, же болбосо, баштапкы же жогорку билим алуу үчүн кесиптик-техникалык окуу жайларына, лицейлерге, техникумдарга же колледждерге кетүүгө мүмкүндүк аласынар."},{"t":"p","h":"Өзүнөр билгендей, мектепте окуу акысыз жүргүзүлөт, ал түгүл окуу китептери дагы бекер берилет. Каалагандар жана мүмкүнчүлүгү бар ата-энелер балдарын акы төлеп, менчик мектептерге, лицейлерге берсе болот. Менчик мектептердин окуу программасы сөзсүз түрдө мамлекеттик мектеп өтә турган программаны өзүнө камтууга тийиш. Орто мектепти бүтүп, билимге ээ болуу укук гана эмес, милдет да болуп эсептелет. Ошондуктан, ар бир бала мектепте окуш керек. Мамлекет бардык адамдар үчүн ар кимдин жөндөмүнө жараша кесиптик, атайын орто жана жогорку билим алуу мүмкүнчүлүгүн камсыз кылат. Бул мүмкүнчүлүк жарандарга мамлекеттик окуу жайлардан билим берүү менен гана ишке ашырылбайт, анткени билим алууну каалаган адамдын баарын окуу жайларга кабыл алып, окутуу мүмкүн эмес. Ошондуктан мамлекеттик эмес, коммерциялык окуу жайларды ачууга уруксат берилген. Алардын санына чектөө коюлбайт. Окуу жайынын талабына жооп берген лицей, колледждер жана башка жогорку окуу жайлары Билим берүү министрлигинен лицензия алышып, көптөгөн жаштарды окутуп жатышат."},{"t":"p","h":"Кыргызстанда жаштардын билим денгээли кыйла жогору. Мында 16 жаштан 30 жашка чейинки курактагы 1000"},{"t":"p","h":"<span class=\"pg\" data-n=\"94\">94<\/span>к,"},{"t":"p","h":"“ГИ глава. Кыргыз Республикасынын жараны"},{"t":"p","h":"амга жогорку билимдүү 50 адам, толук эмес жогорку билимдүү жана атайын орто билимдүү 155 адам, жалпы орто билимдүү 536 адам жана толук эмес орто билимдүү 220 адам туура келет."},{"t":"p","h":"Жаштардын сапаттуу билим алышына мүмкүнчүлүктөр көп. Республиканын 40ка жакын жогорку окуу жайлары менен техникумдарында 146 адистик боюнча 60 минден ашык студент окуйт. Эгемендик алгандан кийин ачылган Кыргыз- Орус Славян университети, Кыргыз-Түрк «Манас» университети, Нарын университети сыяктуу кептеген окуу жайлары натыйжалуу иштеп жатышат. Азыркы мезгилде биздин өлкөгө келип жаткан чет өлкөлүк насыялардын кыйла бөлүгү билим берүүгө жана кадрларды даярдоого, студенттик аудиторияларды азыркы учурдун техникасы менен жабдууга жумшалууда, илимий жана билим берүү программаларына чет өлкөлүк гранттар бөлүнүүдө."},{"t":"p","h":"2. Ден соолукту сактоо укугу. Кыргыз Республикасында жарандар ден соолугун сактоого, мамлекеттик саламаттык сактоо мекемелеринин кызматынан акысыз пайдаланууга укуктуу. Бул укук Кыргыз Республикасынын аймагында жашаган бардык жарандарга медициналык жардамды алуу укугун жүзөгө ашырууга бирдей мүмкүнчүлүк түзүү, медициналык жардамдын ар бир этабына кепилденген дарылоо-алдын алуу жардамынын базалык өлчөмүн белгилөө, медициналык жардам менен бардык жарандарды камсыз кылуу аркылуу ишке ашырылат."},{"t":"p","h":"Жарандар врачтарды жана дарылоо-алдын алуу мекемелерин эркин тандап алууга укуктуу, ошондой эле кечиктирилгис медициналык жардамды муктаж болгон адамга ар бир медициналык мекеме менчигинин түрүнө жана кайсы ведомствого баш ийгенине карабастан, көрсөтүүгө милдеттүү. Мындай жардамды көрсөтүүдөн баш тарткан врачтар кылмыш жоопкерчилигине тартылышы мүмкүн."},{"t":"p","h":"Жарандарды акы төлөнүүчү медициналык тейлөө мүмкүнчүлүгү Кыргыз Республикасынын Өкмөтү белгилеген тартипте каралган."},{"t":"p","h":"<span class=\"pg\" data-n=\"95\">95<\/span>ГП глава. Кыргыз Республикасынын жараны – зш"},{"t":"p","h":"Мурдагы социалисттик системанын убагында жеке менчиктеги үй буюм-тайымдарынан башкасы мамлекеттин жана коомдук уюмдардын менчигинде болгондугуна байланыштуу саламаттык сактоо тармагынын мекемелери (поликлиникалар, ооруканалар) мамлекеттик гана болучу. Жеке менчик дарылоочу мекемелерди ачууга уруксат берилген эмес. Азыр мындай жайларды ачууга жана медициналык жактан акы төлөтүп тейлөөгө мыйзамда аныкталган негизде жана тартипте жол берилет, башкача айтканда алар мыйзамдын, мамлекеттин кез алдында болушат. Коомубуз эркин рынок экономикасына өтүп жаткандыгына байланыштуу саламаттык сактоо системасын реформалоо жүргүзүлүп жатат. Бул реформанын негизги багыты жарандарды медициналык жактан камсыздандырууну жүргүзүү менен байланышкан. Муну кандайча түшүнүүгө болот. Жарандар ай сайын айлыгынан медициналык камсыздандыруунун фондусуна белгилүү өлчөмдө акча төлөп турушат жана ушул төлөөлөрдүн негизинде медицина мекемелери иштешип, ооруп калган жарандарды дарылашат. Бирок, турмуш денгээлинин төмөндүгүн эске алуу менен медициналык камсыздандырууга өтүү, адегенде ыктыярдуулук менен, анан милдеттүү түрдө жүргүзүлүп, 1997- жылдан баштап ишке ашырыла баштаган. Бирок бул реформанын негизинде мамлекеттик медициналык мекемелер жоюлуп калбайт. Камсыздандыруу фондусуна төлөмүн төлөй алышпаган, жардамга муктаж адамдар мамлекеттик дарылоо жайларынан дарылана алышат."},{"t":"p","h":"Кыргыз Республикасынын өкмөтү саламаттыкты сактоо ишине ар дайым көңүлүн буруп турат. Мисалы, 1996-2000- жылдарга «Дени сак улут» программасы кабыл алынган. Ал программага ылайык саламаттык сактоо мекемелеринин ишин кайрадан жакшылап жолго коюу, курамында ургаалдуу кыска мөөнөттүү жана узак мөөнөттүү дарылоону уюштуруу менен борбордук, райондук, облустук, шаардык жана республикалык ооруканаларды кайрадан уюштуруу пландаштырылган. Бирдиктүү диагностикалык блоктор, калыбына"},{"t":"p","h":"<span class=\"pg\" data-n=\"96\">96<\/span>Ш глава. Кыргыз Республикасынын жараны"},{"t":"p","h":"келтйрүүчү дарылоо блоктору ишке киргизилет. Медицина-"},{"t":"p","h":"жардам көрсөтүүнүн адистештирилген түрлөрү өнүгөт."},{"t":"p","h":"Дарыкана мекемелерин акциялоо жүргүзүлүп, коммерциялык кабинеттер, поликлиникалар, ооруканалар (мамлекеттик саламаттык сактоо системасын сактоо менен) ачылып иштеп жатат."},{"t":"p","h":"Кадрларды даярдоо жагында да реформа жүргүзүлүп жатат, адистик денгээлин, аткарылып жаткан иштин көлөмүн, татаалдыгын эске алуу менен, медициналык кызматкерлерге төлөнүүчү эмгек акынын өлчөмү да акырындык менен жогорулоодо. Ушул чаралардын бардыгы көрсөтүлүүчү жардамдын денгээлин жана сапатын жогорулатары шексиз. 2 Кыргыз Республикасынын Конституциясы КОШУМЧА МАТЕРИАЛ"},{"t":"v","l":["(Үзүндү)","47-берене","1. Ар ким ден соолугун коргоого укуктуу."]},{"t":"p","h":"2. Мамлекет ар бир адамды медициналык жактан тейлее үчүн шарт түзөт жана саламаттыкты сактоонун мамлекеттик, муниципалдык жана жеке секторлорун өнүктүрүү боюнча чараларды керет."},{"t":"p","h":"3. Акысыз медициналык тейлее, ошондой эле жеңилдик шарттарындагы медициналык тейлее мыйзамда каралган мамлекеттик кепилдиктердин чегинде жүзөгө ашырылат."},{"t":"p","h":"4. Кызмат адамдары кишилердин өмүрү жана ден соолугу учун коркунуч туудурган фактыларды жана жагдайларды жашырып койсо, мыйзамда көрсөтүлгөн жоопкерчиликке кириптер болот."},{"t":"h3","h":"} ` КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"p","h":"1. Кыргызстанда билим берүү кандай негизде жүргүзүлөт?"},{"t":"p","h":"2. Билим берүүнүн кандай программалары бар?"},{"t":"p","h":"3. Жеке менчик окуу жайларын ачууга болобу?"},{"t":"p","h":"4. Мамлекеттик окуу жайларында окутуу кандай негиздерде"},{"t":"p","h":"жүргүзүлөт?"},{"t":"p","h":"5. Кыргызстандын жарандары саламаттыгын сактоо боюнча кан-"},{"t":"p","h":"дай үкуктарга ээ?"},{"t":"p","h":"<span class=\"pg\" data-n=\"97\">97<\/span>ПТ глава. Кыргыз Республикасынын жараны"},{"t":"p","h":"6. Саламаттык сактоо системасында жүргүзүлүп жаткан рефор-"},{"t":"p","h":"манын маңызы эмнеде?"},{"t":"p","h":"Т. Кыргыз экмету саламаттыкты сактоо боюнча кандай иш-чара-"},{"t":"p","h":"парды аткарууда?"}],"sub":[],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЖАРАНЫ","pages":[92,97]},{"title":"§ 20. Жарандардын укугун","blocks":[{"t":"h3","h":"§ 20. Жарандардын укугун"},{"t":"p","h":"жана эркиндигин коргоо – мамлекеттин милдети"},{"t":"p","h":"Жарандардын укуктары менен эркиндиктери Конституцияда жөн гана жарыяланып калбастан, ошол эле Конституция жана башка мыйзамдар тарабынан корголот жана алардын аткарылышы камсыз кылынат. Жарандардын укуктары жана эркиндиктери, биринчиден, мыйзамда бекемделиши менен, акинчиден, ашол жоболордун аткарылышын камсыз кылуучу мамлекеттик органдардын түзүлүшү менен кепилдикке алынган."},{"t":"p","h":"Кыргыз Республикасынын Конституциясы тарабынан бекемделген укуктар менен эркиндиктердин негизги башаты болуп, жарандарга Конституцияда жана башка мыйзамдарда тыюу салынып, чектөө коюлган иш-аракеттерден башка бардык аракеттерди жана иштерди жүргүзүүгө уруксат берилгендиги эсептелет. Бул жобо коомубуздагы демократиянын чон жениши деп айтсак туура болор эле, себеби мурда советтик мезгилде жарандар тыюу салынган иш-аракеттерди да, ошондой эле, атайын уруксат берилбеген иштерди да жасоого укугу жок эле. Бир ишти баштоо үчүн сөзсүз түрдө бийлик органдарынан уруксат алууга тийиш эле, ал эми көпчүлүк нерселерге тыюу салынып келгендиги белгилүү."},{"t":"p","h":"Кыргыз Республикасынын Конституциясында жарандардын укугу менен эркиндигин толук, сөзсүз, токтоосуз коргоо, бул жагынан укук бузууларга жол бербөө жана бузулган абалды өз ордуна келтирүү – мамлекеттин, анын бардык органдары менен кызмат адамдарынын милдети деп белгиленип, ошол укуктар камсыз кылынары айтылган. 9т"},{"t":"p","h":"<span class=\"pg\" data-n=\"98\">98<\/span>ПТ глава. Кыргыз Республикасынын жараны"},{"t":"p","h":"Жарандардын укугу бузулса, аны коргой турган органдардын кеңири системасы түзүлгөн. Бул, биринчиден, укук коргоо органдары өз компетенциясынын чегинде бузулган укукту ордуна келтирүүгө күч жумшашат, экинчиден, мамлекеттик бийлик органдары мыйзам чегинде укуктун бузулбашына жана бузулса ордуна келтирүүгө милдеттүү болуп эсептелишет."},{"t":"p","h":"Ал эми ар кандай укук бузууларды ордуна келтирип, мыйзам чегинде аткарылышы үчүн бирдей чечим кабыл ала турган орган – бул сот органдары. Мурунку мезгилде, сот органдары негизинен жаза чектей турган орган катары каралып келген. Азыркы Конституцияга ылайык сот органдары сот адилеттигин ишке ашыруучу орган болуп эсептелет. Кээ бир жарандар сотко барып, бузулган укугун ордуна келтирүү үчүн кайрылуу чыр адамдардын иши деп ойлошот. Бул – такыр туура эмес ой, анткени – сот мамлекеттик бийликтин өзүнчө бутагы, сот чыгарган ар бир иш боюнча чечим башкалар үчүн сабак болот. Бузулган укук үчүн күрөшүү – бул өз укугун гана калыбына келтирүү эмес, бул ошол укукту бузган орган же кызмат адамы үчүн сабак, андай бузуунун кайра кайталанбашы үчүн эскертүү болуп эсептелет. Эгер жарандардын укуктарынын жана эркиндиктеринин бузулушуна каршы жарандардын өздөрү күрөш жүргүзүшпөсө – укуктар менен эркиндиктерди камсыз кылуу мамлекет үчүн татаал иш болуп калат."},{"t":"p","h":"Жарандардын укугу менен эркиндигинин мамлекеттик органдар тарабынан сакталышын камсыз кылуу үчүн мыйзамдуу күчүнө кирген сот өкүмү күнөөлүү деп тапмайынча, жаран күнөөлүү катары эсептелбестиги белгиленген. Бул болсо жарандын укугунун жана эркиндигинин сакталышынын чоң кепилдиги болуп эсептелет. Мурда күнөө коюлганда эле, бирок сот тарабынан өкүм чыга электе эле, жаран укуктарынан ажырап калуучу."},{"t":"p","h":"Ошондой эле мамлекет мыйзамдар аркылуу ар бир адамды анын өздүк жана үй-бүлөлүк турмушуна мыйзамсыз жана <span class=\"pg\" data-n=\"99\">99<\/span>ГИ глава. Кыргыз Республикасынын жараны"},{"t":"p","h":"оз бетинче кийлигишүүдөн, анын ар-намысын, эркин кат алышуусунун жана телефон менен сүйлөшүүсүнүн жашырындуулугун бузуудан коргойт. Бирөөнүн турак жайына, тийиштүү орган уруксат берген убакта тинтүү жүргүзүлөт, коомдук тартипти коргоо, кылмышкерди кармоо, адам өмүрүн, саламаттыгын сактоо жана мүлкүн коргоого багытталган учурлардан башка убакта эч ким кире албайт."},{"t":"p","h":"Жарандын турак жайынын бул сыяктуу корголушу да анын укугунун жана эркиндигинин сакталышына мамлекет берген кепилдик болуп эсептелет."},{"t":"p","h":"Мамлекет тарабынан жарандардын укугунун жана эркиндигинин сакталышына шарт түзүү максатында адистешкен юридикалык жардам көрсөтүү кызматы колдоого алат. Бул максатты ишке ашыруу үчүн ар бир райондо юридикалык консультациялар уюштурулган, ал жерде адис юристтер иштешет жана ар дайым кайрылган жарандарга квалификациялуу кеңешин беришет."},{"t":"p","h":"Жарандар өздөрүнүн кандай укуктары жана эркиндиктери бар экендигин билүү үчүн, аларды белгилеген мыйзамдарды билүүгө тийиш. Ошондуктан, адамдын жарандык укугуна, эркиндигине жана милдеттерине тиешеси бар мыйзамдар массалык маалымат каражаттарына жарыяланмайынча күчүнө (колдонууга) кирбейт, себеби, мындай мыйзамдарда кандайдыр бир укуктук чектөөлөр же жаны милдеттер коюлушу мүмкүн, ошондуктан аларды ар бир жарандын билүүсүнө мамлекет тарабынан мүмкүндүк берилиши керек."},{"t":"h3","h":"КОШУМЧА МАТЕРИАЛ"},{"t":"v","l":["Кыргыз Республикасынын Конституциясы","(Үзүндү)","29-берене"]},{"t":"p","h":"1. Ар бир адам жеке турмушунун кол тийбестигине, ар-намысынын корголушуна укуктуу."},{"t":"p","h":"2. Ар бир адам кат-кабар алышууга, телефондук жана башка сүй- <span class=\"pg\" data-n=\"100\">100<\/span>ГИ глава. Кыргыз Республикасынын жараны"},{"t":"p","h":"пешуулерге, почта, телеграфтык, электрондук дагы белекче жол менен кабарлашуулардын купуялуулугуна укуктуу. Бул укуктарды чектееге мыйзамга ылайык жана сот актысынын негизинде гана жол берилет."},{"t":"p","h":"3. Мыйзамда бепгипенген учурлардан тышкары адамдын макулдугусуз анын жеке турмушу тууралуу маалыматты, жашыруун маалыматты жыйноого, сактоого, пайдаланууга жана жайылтууга жол берилбейт."},{"t":"p","h":"4. Ар бир адамга купуя маалыматты, адамдын жеке турмушу жөнүндө маалыматты укук-ченемсиз жыйноодон, сактоодон, жайылтуудан коргоо, анын ичинде соттук коргоо, кепилденет, ошондой эле укук-ченемсиз иш-аракеттер аркылуу келтирилген материалдык жана моралдык зыяндын ордун толтуртуп алуу укугуна кепилдик берилет."},{"t":"h3","h":"д; КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"p","h":"её 1. Жарандардын укугун жана эркиндигинин корголушу кандай ча-"},{"t":"p","h":"ралар менен камсыз кылынган?"},{"t":"p","h":"2. Жарандарга кандай иш-аракеттерди аткарууга уруксат берил-"},{"t":"p","h":"ген?"},{"t":"p","h":"3. Жарандардын укугун жана эркиндигин коргоо милдети кимдер-"},{"t":"p","h":"ге жүктөлгөн?"},{"t":"p","h":"4. Жарандардын укугун жана эркиндигин коргоо боюнча сот орган-"},{"t":"p","h":"дарынын мааниси кандай?"},{"t":"p","h":"Б. Адам кайсы учурдан баштап жасаган кылмышы үчүн күнөөлүү"},{"t":"p","h":"деп табылат?"},{"t":"p","h":"6. Жарандын турак жайына уруксатсыз кирүүгө болобу?"},{"t":"p","h":"7. Кандай учурда жарандын турак жайына уруксатсыз кирүүгө мый-"},{"t":"p","h":"зам жол берет?"},{"t":"p","h":"8. Жарандын жеке турмушуна кийлигишүүгө болобу?"},{"t":"p","h":"9. Жарандар әз укугун жана эркиндигин билишин жана аларды"},{"t":"p","h":"коргой алышы үчүн мамлекет тарабынан кандай шарттар түзүлгөн?"},{"t":"p","h":"<span class=\"pg\" data-n=\"101\">101<\/span>ТҮ глава. Укук бузуу жана жаза. Мыйзамдуулукту сактоо"},{"t":"p","h":"ТҮ глава"},{"t":"h3","h":"УКУК БУЗУУ ЖАНА ЖАЗА. МЫЙЗАМДУУЛУКТУ САКТОО"}],"sub":[{"title":"УКУК БУЗУУ ЖАНА ЖАЗА. МЫЙЗАМДУУЛУКТУ САКТОО","b":40}],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЖАРАНЫ","pages":[98,101]},{"title":"§ 21. Укук бузуулардын түрлөрү","blocks":[{"t":"h3","h":"§ 21. Укук бузуулардын түрлөрү"},{"t":"p","h":"Укук бузуу – бул коомдун кызыкчылыктарына зыян келтирүүчү же коомго коркунучтуу жана мыйзам тарабынан калыбына келтирилүүчү же жазалануучу иш-аракеттер."},{"t":"p","h":"Укук бузуунун түрлөрүнө тартип бузуулар, администрациялык укук бузуулар жана кылмыштар кирет. Эми булардын ар бирин өзүнчө талдап көрөлү."},{"t":"p","h":"Тартип бузууларга негизинен эмгек тартибин бузуулар, ар кандай аскерлештирилген кызматтар чөйрөсүндө, куралдуу күчтөрдө тартип уставдарын бузуулар кирет."},{"t":"p","h":"Эмгек тартибин бузууларга, мисалы, жумушка келбей коюу же кечигип келүү, жумушка мас абалында келүү, ишин сапатсыз жасоо ж. б. кирет."},{"t":"p","h":"Ишкана, мекеме, уюмдарда эмгектин уюштурулушун белгилөөчү негизги ченемдик акт болуп эмгек тартибинин ички эрежелери эсептелет. Ал документте жумушка алуунун тартиби, жумушчулар менен кызматчылардын негизги милдеттери, администрациянын жумуш убактысы жана аны пайдалануу, эмгектеги жегишкендик үчүн сыйлоолор, эмгек тартибин бузгандык үчүн жазалар каралат. Тартип бузууларга аскерлештирилген тармактардагы тартип уставдарын бузуулар да кирет. Мисалы, мындай тармактарга, темир жол, жарандык авиация, суу транспорту кирет. Бул тармактардын жарандарды тейлөө жана алардын коопсуздугун сактоо өтө маанилүү экендиги эске алынып, тартип бузуулардын тизмеси көбүрөөк жана ал тартип бузууларга жоопкерчилик дагы катуурак белгиленген."},{"t":"p","h":"<span class=\"pg\" data-n=\"102\">102<\/span>ГУ глава. Укук бузуу жана жаза. Мыйзамдуулукту сактоо"},{"t":"p","h":"Өзгөчө Куралдуу Күчтөрдөгү тартипти сактоо маанилүү экендиги талашсыз. Анткени, аскерлерде темирдей тартип болбосо, согуштук абалда элди, жерди коргоп, женишке жетишүүгө мүмкүн эмес да. Ошондуктан, тынчтык мезгилде эле жоокерлер тартипти катуу сактаганга үйрөтүлөт, аскердик тартип уставын аткарууга катуу талап коюлат."},{"t":"p","h":"Аскердик тартип бузуулардын эң эле кенири тараганы бул бөлүктөрдөгү уставдык эмес мамилелер, башкача айтканда мурдатан кызмат өтөп жаткан жоокерлердин жаңы келген жоокерлерди кыйнагандыгы болуп саналат. Буга окшогон терс көрүнүштү болтурбоо үчүн, аскерге бара турган жаштар мындай көрүнүштөр армиянын жалпы даярдыгына терс таасир тийгизе тургандыгын, натыйжада өлкөбүздү коргой турган Куралдуу Күчтөрдүн эч нерсеге жарамсыз болуп каларын түшүнүүгө тийиш."},{"t":"p","h":"Башка дагы кеңири тараган тартип бузууга мисал келтирели. Аскерде кызмат өтөп жаткан жоокер шаарга чыгып эс алуу үчүн беш сааттык бошотуу алган. Ал убагында келбей кечигип калды. Бул учурда ал аскердик тартиптин уставын бузган болот жана тиешелүү жаза алууга тийиш."},{"t":"p","h":"Администрациялык укук бузууларга – мамлекеттик же коомдук тартипке, мүлккө, жарандардын укуктары менен эркиндиктерине, белгиленген тартиптерге шек келтирүүчү жана мыйзам боюнча администрациялык жоопкерчиликке алып келүүчү укукка сыйбаган аракеттер кирет. Администрациялык укук бузуулар Кыргыз Республикасынын Администрациялык укук бузуулар жөнүндөгү кодексинде каралган. Бул укук бузууларга, мисалы, коомдук тартипти, паспорт системасын, жол жүрүүнүн эрежесин, санитариялык, өрткө каршы эрежелерди, чек ара режиминин эрежесин бузуулар кирет."},{"t":"p","h":"Жарандар администрациялык жоопкерчиликке 16 жаштан тартылышы мүмкүн. Администрациялык укук бузуулар жөнүндөгү иштерди жергиликтүү мамлекеттик администрациянын алдындагы администрациялык комиссиялар, соттор, <span class=\"pg\" data-n=\"103\">103<\/span>Г/ глава. Укук бузуу жана жаза. Мыйзамдуулукту сактоо"},{"t":"p","h":"ички иштер министрлигинин жана башка кээ бир министрликтердин кызмат адамдары, мамлекеттик инспекциялар жана органдар (кызмат адамдары) карашат. Мисалы, райондук администрациялык комиссиялар электр жана жылуулук энергиясын туура эмес пайдалангандык, тыюу салынган жерлерге ар кандай кулактандырууларды илүү сыяктуу иштерди, соттор болсо – майда хулигандык иштерди, мамлекеттик автоинспекциянын кызматкерлери – жол жүрүү эрежесин бузгандык ж. б. иштерди карашат."},{"t":"p","h":"Администрациялык укук бузуулардын түрлөрү, ал укук бузуулар боюнча кимдер жоопко тартылышы мүмкүн экендиги жана кимдер (кайсы органдар) жаза бере ала тургандыгы Администрациялык укук бузуулар жөнүндөгү кодексте кенири баяндалган. Администрациялык укук бузуулар кылмыш болуп эсептелбейт, бирок мүнөзү боюнча негизинен кылмышка жакын турат. Администрациялык жоопкерчиликке тартуу кылмыш кылуунун алдын алуу чараларынын бири болуп саналат."},{"t":"img","src":"data:image/webp;base64,UklGRjYVAABXRUJQVlA4ICoVAABQdgCdASqAAsUAPrVUpU0nJKOlp3Q56OAWiWVuc7A4IfIegaB6NfMVt2WBBqCJZ+WwXnAbwamhoQ+d32nk4vweZ6Yvui8vmlrb+v/ufjn+M/S/6j+4+fK+ZfMPzV+T84/874M+87/W/tfsBerf8h4kO72zvzBfXT6v35WsB3x8VTk7aAvif5F/++I1rJf2wRpgEpz+Kem1550kxJY3pAurUkcaNC2GWupJiTJJFCTEkwKGyp+colotK2U5k1dRIeO1hjaw30apVnccwAGYWARB+uVglOdTMLcgqPFU5Kpi1N1EvIjhDZU/OUURJNGiWR3YEQ7Lo4Kp7aH8kjgmLP61eNEzcl4UuobT7mbPaXrE977ZJebmagOjOJtx8T5SRBli+n+smqf52uWTC4yYjGSv1+r2FH9tlxTI+pTww7Gwa9wRZzaVIOGouMmFxk6RSMqg/mO3evxTcXrJrHF0uFz5osWbVgrqD7P/NViUaQZ3bv20Dmo9/sIflT/mfRjkr4GomDignKhMsmFWV6CnGGb1e2TQZIYka6eQS1X1TzP62//6zc6o8YnvyO9SjWq6rv4ncUajH4qP4E9Ytuvyeqngui4yPcqlLP0EAd3RunkPSMuMcYVlhTl5APajlDeELD+Tvda3eAj0kSP1IT0Gj1IcMWr6kDYKzkTAqk3ks1JfJRKsBNa3rw0YMjP4hvCGGMcin1IDCfbanlPtvOV3UKsp2RLnmdl5DXrun65diYmLdpIOmo/h0wRai3p2zCc1FdT4iTcAIAC4NfViSTlVF7yVZl/euu8NW9U2gFrzsC+K05la1mYmVQCGSk56NhhmhzKpeCjm7txyCXeM5piwXs81KU59mrmMcbiaBxoKs2eq5DAc+S3jVQTA8h1B2f+Lk5sLvxk1rb/BJ9ugeUT5qgNyk3YzPbEcilwADbomx/kLpbL+DwzNgqZl+5wX+0HfMeBBxfxUsycwJPQdq92w+VXIwv5MJKM8Jba/fYsVmlmucnmxI+reVMNfRaiySDdoVRunk46GVMoQ2XS4by6vYUIhx/kgFmw/PFNWJ7Gf6M8tvIfwF+X+YFSs7uNf95GLmpEldUWub6Ba2uhRPx+tlKhyf+9YJQmbkIZREthVx4cPm9Y+7NlqkdJMkP/4D7H1oEehCnoA1PqNEfleQkNo1e3E2rlk8TUVOU9okIT uPq/1lfaEASf0gY0BlfwdzzddmKSZQXvwAAA=","w":640,"ht":197,"cap":"дугуна, анын укуктарына жана эркиндиктерине, мамлекеттик түзүлүшкө, жарандын ден соолугуна, өмүрүнө, ар-намы-"},{"t":"p","h":"Укук бузуулардын ичинен бир кыйла коркунучтуусу кылмыш болуп эсептелет. Кылмыштын түрлөрү, аларга кандай жаза берилери Кыргыз Республикасынын Кылмыш жана жаза кодексинде каралган. Кылмыштарга адамдын коопсуз-"},{"t":"p","h":"сына, менчиктин ар кандай формаларына каршы жасалган аракет же аракетсиздик кирет. Кылмыштын негизги белгиж <span class=\"pg\" data-n=\"104\">104<\/span>„гс? Г’ глава. Укук бузуу жана жаза. Мыйзамдуулукту сактоо"},{"t":"p","h":"лери төмөнкүлөр болуп саналат: анын коом үчүн коркунучтуулугу, башкача айтканда, жалпы эле коомдук кызыкчылыкка же айрым жарандардын коомдук мааниге ээ укуктарына жана эркиндиктерине зыян же коркунуч келтирүү жана бул сыяктуу аракеттердин кылмыш жөнүндөгү мыйзам тарабынан кылмыш катары белгиленүүсү, ошондой эле аны жасаган адамдын күнөөлүү экендигинин далилденгени. Кылмыш жоопкерчилигине кылмышты атайылап же байкоосуздан жасаган күнөөлүү адамдар тартылышат. Кылмыштын түрлөрү тилекке каршы көп. Улам барган сайын дагы көбөйүүдө жана жалпы эле адамдардын жашообу үчүн коркунуч туудурган өтө терс көрүнүштөр пайда болуп жатат. Ошондуктан, ар бир адам кылмыштуулуктун коркунучтуулугун түшүнүп, ага каршы күрөш жүргүзүүгө тийиш. Кылмыштын түрлөрү жана ага берилүүчү жазаларга биз кенирирээк кийин өзүнчө токтолобуз."},{"t":"h3","h":") 1 КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"v","l":["1. Укук бузуу деп эмнени айтабыз?","2. Укук бузүунун түрлөрү кандай?","3. Тартип бузууларга кандай иш-аракеттер кирет?"]},{"t":"p","h":"4. Администрациялык укук бузуулар жөнүндө эмнени билесиң?"},{"t":"p","h":"5. Кылмыш деген эмне?"},{"t":"p","h":"5. Кылмыш жөнүндөгү негизги мыйзам болуп кайсы ченемдик до-"},{"t":"p","h":"кумент эсептелет?"},{"t":"h3","h":"&amp; 22. Жазалардын түрлөрү"},{"t":"p","h":"Жазалар – тартип жазалары, администрациялык жазалар жана кылмыш үчүн жазалар болуп бөлүнөт."},{"t":"p","h":"Тартип жазасы негизинен эмгек тартибин бузгандарга таасир көрсөтүүчү укуктук чара жана аскерлерде, ошондой эле аскерлештирилген кызмат жерлериндеги укук бузууларга карата колдонулуучу жаза болуп эсептелет."},{"t":"p","h":"<span class=\"pg\" data-n=\"105\">105<\/span>ГИ глава. Укук бузуу жана жаза. Мыйзамдуулукту сактоо"},{"t":"p","h":"Эмгек тартибин бузгандарга төмөндөгү тартип жазалары колдонулушу мүмкүн: эскертүү, сөгүш, акы аз төлөнүүчү жумушка которуу же кызматынан төмөндөтүү, жумуштан бошотуу. Жаза берүүдө тартип бузуунун денгээли жана кандай жагдайда кетирилгени, жумушчу же кызматчынын мурунку иши жана жүрүм-туруму эске алынат. Жаза колдонордон мурда тартип бузган адамдан түшүнүк алынат."},{"t":"p","h":"Тартип жазалары тартип бузуучулук администрацияга билинген күндөн тартып бир айдын ичинде жана тартип бузуу болгон күндөн кийин алты айдын ичинде гана колдонулушу мүмкүн. Бул мөөнөттөр єтүп кетсе, жаза колдонууга мыйзам жол бербейт."},{"t":"p","h":"Чектелген тартип жазасы тууралуу мыйзамда белгиленген тартипте даттанууга болот. Жаза берилген күндөн кийинки бир жылдын ичинде жумушчу же кызматкер кайрадан жаңы тартип бузуу үчүн жазаланбаса, ал жазага тартылбаган болуп эсептелет. Эгер жумушчу же кызматчы кайрадан эмгек тартибин бузбай, өзүн ак ниет, мыкты кызматкер катары керсетсе, тартип жазасы бир жылга чейин эле буйрук менен алынып ташталат."},{"t":"p","h":"Администрация тартип жазасын колдонуунун ордуна эмгек тартибин бузгандык жөнүндөгү маселени коомчулуктун кароосуна берип коюшу мүмкүн."},{"t":"p","h":"Аскер кызматчылары үчүн Тартип уставдары иштелип чыккан. Алардын кызмат өтөөсү ошол уставда белгиленген жоболор боюнча ишке ашырылат. Уставды бузгандык үчүн жоопкерчилик каралган. Жазалар – кезексиз наряд, кезектеги эс алуу үчүн бошотууну бербей коюу, гауптвахтага камоо, аскердик наамын төмөндөтүү ж. б. Тартип уставдарынын талаптары катуу, себеби, аскерде катуу тартип болбосо, армиянын начар, алсыз болуп кала тургандыгы белгилүү."},{"t":"p","h":"Ушул сыяктуу тартип уставдары аскерлештирилген кызматтарда да бар. Мындай кызматы бар тармактарга темир жол, суу жана аба транспорттору кирет. Ошондой эле иштөө режими катаал тармактарда да тартип уставдарына ылайык"},{"t":"p","h":"<span class=\"pg\" data-n=\"106\">106<\/span>Г’ глава. Укук бузуу жана жаза. Мыйзамдуулукту сактоо"},{"t":"p","h":"иш алып барышат. Буларга жер астында коркунучтуу шартта иштегендерди, укук коргоо органдарынын кызматкерлерин кошсо болот."},{"t":"p","h":"Администрациялык жаза – администрациялык укук бузуу жасаган адамды жазалоо, тарбиялоо жана жалпы эле укук бузууларды болтурбай коюу, аскертүү максатында колдонулат. Администрациялык жаза мыйзам актыларында көрсөтүлгөн учурларда гана колдонулат. Кыргыз Республикасынын Администрациялык укук бузуулар жөнүндөгү Кодекси боюнча, администрациялык жазанын төмөндөгүдөй түрлөрү бар: эскертүү, штраф, администрациялык укук бузуунун куралы болгон буюмду баасын төлөп берүү менен алып коюу же конфискациялоо, түзөтүү жумуштарына тартуу жана администрациялык камакка алуу."},{"t":"p","h":"Эскертүү – мамлекеттик орган же кызмат адамы тарабынан укук бузуучуга кат жүзүндө, болбосо мыйзам белгилеген башка түрдө жазаны колдонуп уяткаруу. Оозеки эскертүү жазага кирбейт."},{"t":"p","h":"Баасын төлөп берүү менен буюмду алып коюу – бул буюмду ээсинен тартып алып, комиссиялык жол менен сатуу үчүн соода уюмуна берүү жана түшкөн акчаны кайра ээсине кайтарып берүү. Алып коюуга тийиш болгон буюмдардын түрлөрү жана тартиби мыйзам тарабынан аныкталат. Мисалы, аба транспортунда коркунучтуу буюмдарды ташуунун эрежеси бузулганда, ал буюм алынып коюлат да, сатылып, түшкөн акча ээсине берилет."},{"t":"p","h":"Атайын укуктардан ажыратуу, б. а. жаранды анын жеке өзүнө гана берилген укуктарынан (машина айдоо, анчылык кылуу ж. 6.) 3 жылга чейинки мөөнөткө ажыратуу; бул жаза укуктарды пайдалануу тартибин одоно же системалуу түрдө бузган учурларда колдонулат. Мисалы, транспорт каражаттарын мас абалында айдагандык үчүн айдоочу транспорт айдоо укугунан 3 жылга чейин ажыратылат."},{"t":"p","h":"Жаза пул (штраф) – бул акча төлөтүү жазасы. Әреже катары, жарандар администрациялык укук бузганда штраф <span class=\"pg\" data-n=\"107\">107<\/span>и ГУ глава. Укук бузуу жана жаза. Мыйзамдуулукту сактоо"},{"t":"p","h":"бир минималдуу ставкадан ашпаган өлчөмдө, кызмат адамдары үчүн эки минималдык ставкадан ашпаган әлчәмдә салынат. Минималдык ставка дегенибиз, мыйзам тарабынан аныкталган амгек акынын эң төмөнкү өлчөмү болуп асептелет."},{"t":"p","h":"Кээ бир администрациялык укук бузуулар үчүн жоопкерчиликти көтөрүү максатында мыйзам боюнча штрафтын өлчөмүн жарандар үчүн эки минималдык ставкага, кызмат адамдары үчүн үч минималдык ставкага, ал эми пайда көрүү максатында жасалган укук бузуулар үчүн мыйзам тарабынан беш минималдык ставкага чейин чектөөгө жол берилет."},{"t":"p","h":"Мулкту конфискациялоо – бул администрациялык укук бузуунун куралы болгон буюмду мамлекеттин пайдасына алып коюу. Мисалы, мергенчилик, балыкчылык эрежелери бузулганда мылтыкты же торду алып коюу. Бул жаза, башка жазага кошумча түрдө жана өзүнчө жаза катары да колдонулат."},{"t":"p","h":"Т'\\үзөтүү жумуштары – администрациялык укук бузуучуну туруктуу иштеген жеринен 2 айга чейинки мөөнөткө айлык акысынын 20% ын мамлекеттин пайдасына кармоо."},{"t":"p","h":"Администрациялык камакка алуу – бул жаза чарасы катарында 15 суткалык мөөнөткө майда хулигандык жана милиция кызматкерлеринин мыйзамдуу буйруктарына жана талаптарына атайылап моюн сунбагандык үчүн колдонулушу мүмкүн."},{"t":"p","h":"Кылмыш үчүн жаза. Кылмыш кылгандыгы үчүн жаза чектөө мамлекеттин өзгөчө мажбурлоо чарасы болуп эсептелет. Жазалоонун түрлөрүнө жаза пул салуу, белгилүү кызматта же белгилүү ишти иштөө укугунан ажыратуу, түзөтүү жумуштарына чектөө, эркинен ажыратуу жана өмүр бою эркинен ажыратуу кирет. Мындан тышкары, соттолгондорго төмөндөгүдөй кошумча жаза чаралары колдонулушу мүмкүн: аскердик же атайын наамдан ажыратуу, мүлкүн конфискациялоо. Белгилүү кызматта же белгилүү ишти иштөөгө тыюу салуу кошумча жаза катары колдонулат."},{"t":"p","h":"<span class=\"pg\" data-n=\"108\">108<\/span>ГҮ глава. Укук бузуу жана жаза. Мыйзамдуулукту сактоо"},{"t":"p","h":"Кылмыш үчүн жаза кылмышты жасагандыгы үчүн күнөөлүү деп табылган адамга гана сот тарабынан берилет. Ал эми күнөөлүү деп табууга сот гана укуктуу, ага чейин адамды кылмыш жасагандыгы үчүн күнөөлүү деп айтууга болбойт."},{"t":"p","h":"Кылмыш жана жаза тууралуу кеңири кийинчерээк токтолобуз, ошондо кылмыштын түрлөрүн, кандай учурларда адам кылмыш жоопкерчилигине тартыларын жана жазалардын түрлөрүнүн өзгөчөлүктөрүн талдайбыз."},{"t":"h3","h":"КОШУМЧА МАТЕРИАЛ"},{"t":"p","h":"Администрациялык жоопкерчилик тууралуу кодекс (Узунду)"},{"t":"v","l":["66. 9-берене","Уруп-сабоо"]},{"t":"p","h":"Уруп-сабоо же денени ооруткан башка күч колдонуу, эгер бул аракеттер жазык жоопкерчилигине тартууга боло турган квалификациялоочу белгилерди камтыбаса, ондон жыйырмага чейинки эсептик көрсөткүчтөгү штрафка же ондон он беш суткага чейин администрациялык камакка алууга жазаланат."},{"t":"h3","h":"д КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"p","h":"1. Тартиптик жазаларга кайсылар кирет?"},{"t":"p","h":"2. Алар кандай учурларда колдонулат?"},{"t":"p","h":"3. Администрациялык жазанын түрлөрүнө кандай жазалар кирет?"},{"t":"p","h":"4. Алардын түрлөрүнө түшүнүк бер?"},{"t":"v","l":["5. Кылмыш үчүн кандай жазалар мыйзамда каралган?","6. Кылмыш үчүн жазаны кимдер чектей алат?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"109\">109<\/span>ГУ глава. Укук бузуу жана жаза. Мыйзамдуулукту сактоо"}],"sub":[{"title":"&amp; 22. Жазалардын түрлөрү","b":24}],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЖАРАНЫ","pages":[102,109]},{"title":"§ 23. Укук бузуунун себептери","blocks":[{"t":"h3","h":"§ 23. Укук бузуунун себептери"},{"t":"p","h":"Укук бузуулардын себептери бир кыйла жана ар кандай, бирок негизинен анын башкы себептерине – ээнбаштыкты, тентектикти жана тарбиясыздыкты, жоопкерчилик сезиминин жана жазаланып каламы деген сестенүү сезиминин жоктугун киргизсек болот."},{"t":"p","h":"Ээнбаштык, тентектик жана тарбиясыздык ар дайым ар кандай укук бузууга түрткү берет. Мындай терс сапаттары бар балдар укук бузууга жакын болушат. Ээнбаш, тентек балдар, адатта, сабакты начар окушуп, алсыз жана кичине балдарды ызалашат, буюмдарын тартып алышат, өздөрүн бардык балдардан кыйын деп сезишет. Тарбиясы начар болгондуктан, улууларды эч убакта сыйлашпайт, жаман сөздер менен сөгүнүшөт. Мындай балдарды кичине кезинде кандайдыр бир жазага тартууга болбойт. Алар акылы чектелүү болгондугуна байланыштуу, кылыктары үчүн жооп бере тургандарын ойлошпойт. «Менден кыйын эч ким жок» деген ойдо өзүн-өзү тыйбай жүрүп, бул мүнөзү калыптанып калат да, чоңойгондо да улантылат. Мына ошондо алар жасаган үкук бузуулары үчүн жазага тартыла башташат. Убагында ойлонуп, онолгон адам турмушун туура жолго салып кете алат, ал эми кээ бири, тилекке каршы, кылмыш жолуна түшөт."},{"t":"p","h":"Жарандардын жеке жоопкерчилик сезиминин жоктугу да укук бузуунун себептерине кирет. Ар бир адам өзүнүн кылган иши үчүн жооп берет. Психикалык жактан начар өнүккөндөр гана өздөрүнүн кылык-жоруктары үчүн башкаларды күнөөлөшөт. Мындай пикир дагы кокусунан келип чыкпайт. Көбүнчө үй-бүлөдөн алган тарбия буга түрткү берет. Көпчүлүк ата-эне өзүнүн баласы кандай күнөө кылса да, аны башка бирөөлөр жасаткансып, күнөөлүүнү башка жактан издешет. Балдар мушташа кетсе да, өзүнүн баласынын күнөөсүн жокко чыгарууга жан далбасташат. Мындай тарбиядан кийин балада өзү эмне жасаса да күнөөлүү башкалар деген ишеним пайда болот. Өздөрүнүн аракетине өздөрү жооп- <span class=\"pg\" data-n=\"110\">110<\/span>1 ти"},{"t":"p","h":"4 ГУ глава. Укук бузуу жана жаза. Мыйзамдуулукту сактоо"},{"t":"p","h":"кер экендигин билбей калышат жана ошол аракеттерин актай турган себеп издешет. Мисалы, классташын сабап койгон бала күнөөлүү деп токмок жеген баланы эсептейт, себеби ал аны жаман көз менен карап койгон же болбосо ал сураган нерсени бербей койгон. Ошондуктан, ал аны сабап коюуга толук укугум бар деп эсептейт, анткени ал күчтүү, анын айтканын бардыгы аткарыш керек. Мындай учурларда жоопкерчилик сезими жок адамдар бардык адамдардын укугу бирдей экендигине акылдары жете бербейт. Адамдык сезим менен ойлонбостон, айбандык сезимге жетеленишет."},{"t":"p","h":"Көпчүлүк учурларда өспүрүмдөр өздөрүнүн жорук-жосундарын башкалар деле ошентип жатышпайбы деп акташат. Мисалы, сабакты жалгыз таштап кете албайт, эки-үч баланы көндүрүп, алар менен кошулуп, оңой таштап кетет. Анткени, ал көпчүлүк менен бирге укук бузса, жооп бербейм деп ойлойт. Тескеринче, ал бир эмес эки күнөө жасагандыгын билбейт. Биринчиден, ал сабакты таштап кетти, экинчиден башкалардын да таштап кетүүсүн уюштурду."},{"t":"p","h":"Укук бузууга алып барган себептердин бири – рухий дүйнөнүн жардылыгы. Ар бир адам өзүн адам катары бааласа, маданияттуу болууга тийиш. Маданияттуу адам эч убакта жаман сез айтууга оозу барбайт, бирөөнү сабаганга колу көтөрүлбөйт, бирөөнүн буюмун уурдап алуу эч убакта оюна да келбейт."},{"t":"p","h":"Ошондуктан, ар бир өспүрүм келечекте жакшы адам болууну көздөсө, өзүнүн рухий дүйнөсүн байытканга, маданият менен искусствонун жетишкендиктери менен ар дайым таянышып турууга тийиш. Азыркы заман орой, тентек, зөөкүр адамдардын заманы эмес экендигин, бул заман билимдүү, маданияттуу, иштерман адамдардын заманы экендигин билүү зарыл."},{"t":"p","h":"Кыргыз элинин жакшы макалы бар: «Жакшы болуш астааста, жаман болуш бир паста», – деген. Ошондуктан, ар бир өспүрүм жаман жолго түшүп кетиш оңой эле экендигин, ал эми жакшы болуш үчүн ар дайым өзүн жакшы алып жү- <span class=\"pg\" data-n=\"111\">111<\/span>ТҮ глава. Укук бузуу жана жаза. сактоо"},{"t":"p","h":"рүү керек экендигин билүүсү керек жана ага аракеттенүүсү зарыл."},{"t":"p","h":"Байыркы Римдин юристтери илгери эле: «Мыйзамды билбөө жоопкерчиликтен куткарбайт», – деп айтышкан. Бирок азыр да, кээ бир адамдар кылмыш жасагандыгын мыйзамды билбегендиги менен түшүндүрүшөт. Коомдо жашап жаткандан кийин, коомго тийиштүү мыйзамдарды билүү ар бир адамдын өзү үчүн керектүү. Ырасында, кээ бир адам тийиштүү мыйзамды билбегендиги үчүн кылмыш жасаган деп эсептелип калат. Мисалы, мылтыкты тиешелүү уруксатсыз үйдө сактоо кылмыш экендигин бардыгы билүүгө тийиш. Бирок турмушта мындай окуялар көп кездешет. Мергенчи болуп жүргөн атасы каза болгондон кийин үйүндө анын мылтыгы калган. Баласы аны атамдан калган оокат деп, тийиштүү жерге өткөрбөстөн, үйүндө сактап жүргөн. Жоопко тартылып каларын билген эмес, бирок бул жагдай аны жоопкерчиликтен куткарууга жетиштүү себеп деп таанылбайт."},{"t":"p","h":"Көпчүлүк учурларда өспүрүмдөр кылмышка жазаланып калам деген сезимдин жоктугунан барышат. Кичинесинен тартып ата-энеси эркелетип, кандай кылык жасаса дагы кечирип койгон учурлар көп эле кездешет. Андай балдар мектепте, көчөдө жүргөндө да өздөрү бой көтөрүп жүрүшөт. Өзгөчө алар тентуштарына караганда күчтүрөөк болсо, ачык байкалат. Ар дайым бирөөгө үстөмдүк кылышат. Кичирээк кезде мындай кылыктардын тере жактары айланадагыларга көп байкалбайт, ошондуктан тиешелүү чара көрүлбөйт. Мындай жагдай ал өспүрүмдүн жооп тартып калуу сезимин мокотот, анда эмне жасаса да боло берет дегендей ишеним пайда кылат. Жазаланбоого көнүп калгандыктан, тартынбай эле жаны кылмыштарды жасай баштайт."},{"t":"p","h":"Мектепте окуп жүргөн учурда көп кылыктары кечирилгендигин жашы жете элек кылмышкерлер билишет. Эгер ошол учурда аларга тиешелүү чара көрүлгөн болсо, кылмыштар азыраак болмок."},{"t":"p","h":"<span class=\"pg\" data-n=\"112\">112<\/span>ГҮ глава. Укук бузуу жана жаза. Мыйзамдуулукту сактоо"},{"t":"p","h":"Биз укук бузуулардын кээ бир себептерин гана айттык. Негизинен, укук бузууга, адептүү, тарбиясы жетиштүү адам барбай тургандыгы белгилүү. Ошондуктан адептүүлүккө үйрөнүү ар бир өспүрүмдүн келечегинин кен болушунун бир шарты болуп эсептелет."},{"t":"p","h":"5,"}],"sub":[],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЖАРАНЫ","pages":[110,112]},{"title":"КАЙТАЛОО ҮЧҮН СУРООЛОР","blocks":[{"t":"h3","h":"КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"p","h":"1. Укук бузууга баруунун себептери эмнеде?"},{"t":"p","h":"2. Кандай терс сапаттар укук бузууга барууну шарттайт?"},{"t":"p","h":"З. Ээнбаштык, тентектик жана тарбиянын жоктугу эмнеден көрүнөт?"},{"t":"p","h":"4. Бул сапаттар жоюлбаса, эмнеге алып келиши мүмкүн?"},{"t":"p","h":"5. Жекече жоопкерчилик сезиминин жоктугу деп эмнени түшүнөсүң?"},{"t":"p","h":"6. Маданияттуу адам жаман жорук-жосунду жасоого бара алабы?"},{"t":"p","h":"7. Мыйзамды билбөө жоопкерчиликтен куткарабы? Жоопкерчилик"},{"t":"p","h":"сезими деген эмне?"},{"t":"p","h":"8. Жоопкерчилик сезиминин жоктугу эмне үчүн укук бузууларга"},{"t":"p","h":"алып келиши мүмкүн?"},{"t":"h3","h":"&amp; 24. Мыйзамдуулук жана укук тартиби"},{"t":"p","h":"Мыйзамдар боюнча укук бузуулардын, жазалардын түрлөрү жана укук бузуулардын себептери менен таанышып чыктынар. Биздин турмушта укуктун мааниси зор экендигин түшүндүңөр. Ал эми укук болсо мыйзамдар ишке чынында ашырылганда, алар бузулбастан сакталганда гана мааниге ээ."},{"t":"p","h":"Ошондуктан мыйзамдуулукту сактоо укуктук мамлекетке коюлган башкы шарт, мамлекеттик органдардын жана жарандардын милдети болуп эсептелет."},{"t":"p","h":"Мыйзамдуулук дегенибиз – бул мамлекеттик жана коомдук турмуштун негизги принциби жана ал принцип боюнча ар бир тараптын – мамлекеттик орган болобу, коомдук бирикме болобу же жаран болобу, мыйзамды сактоого жана аткарууга милдеттүүлүгү. Айтылгандай, мыйзамдуулукту <span class=\"pg\" data-n=\"113\">113<\/span>ТҮ глава. Укук бузуу жана жаза. Мыйзамдуулукту сактоо"},{"t":"p","h":"сактоо жарандардын гана милдети эмес, мамлекеттик органдардын да милдети экендигин көрдүңөр. Укуктук мамлекетте башкача болушу мүмкүн эмес. Эң оболу мыйзамдуулук мамлекеттик органдар, өзгөчө укук коргоо органдары тарабынан кыйшаюусуз сакталышы тийиш. Мисалы, райондук бийлик органдары муктаж болгон жарандарга турак жай же жер участкаларын берүүдө мыйзам бузуу менен аларды алууга укугу жок жарандарга беришсе, анда буга окшогон мыйзамсыздык жарандарда нааразылык сезим пайда кылары жана түпкүлүгүндө аларды да мыйзам бузууга түртөрү шексиз. Же милиция органдары күнөөсү жок адамды кармап, күнөөлүү адамды бошотуп жиберсе, мындай аракеттер адамдардын ишенбөөчүлүк сезимин ойготуп, мыйзамды сыйлоосун жокко чыгарып, коомдук турмуштун негизин бошондотору белгилүү. Ошондуктан, ар кандай мыйзам бузуулар, ким тарабынан кетирилсе да, ага каршы күрөшүү ар бирибиздин милдетибиз болууга тийиш. Коомубузда мыйзамдуулук өкүмүн жүргүзбөсө, мыйзамсыздык орун ээлери жана мындай учурда демократиялык мамлекеттин да, адам укугунун да сакталышы күмөндүү болуп калары шексиз."},{"t":"p","h":"Мыйзамдуулукту сактоо үчүн ошол мыйзамдарды билүү керек. Мыйзамдарды билүү юристтердин же укук коргоо кызматкерлеринин эле милдети эмес, бул бардык жарандар үчүн керек."},{"t":"p","h":"Мыйзамдуулукту сактоо үчүн мамлекет тарабынан ар кандай кепилдиктер камсыз кылынат."},{"t":"p","h":"Мындай кепилдиктерге экономикалык, саясий жана юридикалык кепилдиктер кирет."},{"t":"p","h":"Экономикалык кепилдик деп, Конституцияда жана башка мыйзамдар тарабынан берилген эмгектенүү укугун айтса болот. Ар бир адам укукту бузууга барбай эле, оокатын кылсын үчүн эмгектенүүнүн бардык түрүнө уруксат берилет, ал түгүл шарттар менен камсыз кылынат."},{"t":"p","h":"Саясий кепилдик – жарандардын өз саясий көз караштарын, мүдөөлөрүн ишке ашыруусуна жолтоо коюлган эмес."},{"t":"p","h":"<span class=\"pg\" data-n=\"114\">114<\/span>ДД Г’ глава. Укук бузуу жана жаза. Мыйзамдуулукту сактоо"},{"t":"p","h":"Өлкөбүздө бир гана идеологияга баш ийүү жок, ошондуктан ар бир жаран мыйзамга ылайык каалаган партияга өтүүсүнө, каалаган динин тутууга, каалаган адамын бийликке көтөрүү үчүн мыйзамдуу иштерди жүргүзүүгө мыйзам жол берет."},{"t":"p","h":"Юридикалык кепилдиктер – бул негизинен укуктук өнүккөн системаны түзүү, жеткиликтүү иштелген мыйзамдарды чыгаруу, мыйзамдуулуктун сакталышын натыйжалуу көзөмөлгө алуу системасын түзүү, укук коргоо органдарынын сапаттуу жана натыйжалуу иштешин камсыз кылуу."},{"t":"p","h":"Мыйзамдуулукту сактоо укук тартибинин орношуна алып келет. Укук тартиби – мыйзамдуулуктун талаптарын камсыз кылган коомдувк мамилелердин тартипке салынышы. Мыйзамдуулук менен укук тартиби жогоруда көрүнгөндөй бири-бири менен тыгыз байланышкан, аларды бөлүп кароого болбойт."},{"t":"p","h":"Укук тартибинин негизги белгилери болуп, коомдун ичиндеги мамилелерде мыйзамдын үстөмдүгү, укуктук милдеттерди бардык тараптардын так аткарышы, катуу коомдук тартип, адам укугунун корголушуна шарт түзүү, мыйзам чыгаруу, сот адилеттигин ишке ашыруу, укук коргоо органдарынын так жана натыйжалуу иштеши, ар бир укук бузуучунун сөзсүз түрдө жоопко тартылышы эсептелет. Негизинен, укук тартиби – бул мыйзамдуулуктун бардык принциптерин толук жана тайбастан ишке ашыруу болуп эсептелет."},{"t":"p","h":"Өлкөбүздө мыйзамдуулук өкүм сүрүп, укук тартиби толүк орногондо укуктук мамлекетти курдук деп айта алабыз. Азыркы кезде, укуктук мамлекеттин талабына жооп берген Конституциябыз бар, ага ылайыктап мыйзамдарыбыз өзгөртүлүп жана толукталып жатат, мамлекеттик органдарды реформалоо ишке ашырылууда. Бул иш-чаралардын башкы максаты – укуктук, демократиялык мамлекетти түзүү."},{"t":"p","h":"<span class=\"pg\" data-n=\"115\">115<\/span>ГУ глава. Укук бузуу жана жаза, Мыйзамдуулукту сактоо \"Шы"}],"sub":[{"title":"&amp; 24. Мыйзамдуулук жана укук тартиби","b":11}],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЖАРАНЫ","pages":[113,115]},{"title":"} \\ КАЙТАЛОО ҮЧҮН СУРООЛОР","blocks":[{"t":"h3","h":"} \\ КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"p","h":"1. Мыйзамдуулук деген эмне?"},{"t":"p","h":"2. Мыйзамдуулукту сактоо милдеттери кимдерге жүктөлгөн?"},{"t":"p","h":"3. Мыйзамдуулукту сактоо үчүн эмнени билүү керек?"},{"t":"p","h":"4. Мыйзамдуулукту сактоо үчүн кандай кепилдиктер керек?"},{"t":"p","h":"5. Укук тартиби деген эмне? Анын кандай белгилери бар?"},{"t":"p","h":"6. Укуктук мамлекетти куруу үчүн кандай иштер жасалган жана"},{"t":"p","h":"жасалып жатат?"}],"sub":[],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЖАРАНЫ","pages":[115,115]},{"title":"§ 25. Укук коргоо жана ал үчүн күрөшүү","blocks":[{"t":"h3","h":"§ 25. Укук коргоо жана ал үчүн күрөшүү"},{"t":"p","h":"Укук коргоо иши негизинен мамлекет тарабынан түзүлгөн укук коргоо органдары жана сот органдары тарабынан жүзөгө ашырыларын мурдагы сабактарда өткөнбүз. Азыр болсо бул ишти жарандар тарабынан жүргүзүүнүн кандай мүмкүнчүлүктөрү бар экендигин карап көрөлү."},{"t":"p","h":"Укук бузууларды жоюуга жана укук бузгандарды кармап, тиешелүү жазасын берип, мыйзамдуулукту камсыз кылууга атайын органдардын аракеттери жетишсиздик кылат. Ошондуктан, ар бир жаран коомго жат көрүнүштөргө каршы күрөш жүргүзүүсү талапка ылайык. Бул укук бузуучуга каршы жүргүзүлгөн күрөш гана эмес, өз укугун коргогондук деп да билүү керек. Себеби, кандай гана укук бузуу болбосун, ал коомго каршы жасалган иш, ал эми коом болсо ар бир жарандан турат."},{"t":"p","h":"Ар кандай укук бузууга келишпөөчүлүк менен мамиле жасоо – укук бузуунун азаюусуна алып келери шексиз, анткени, мындай мамиле укукту бузган адамдын сәзсүз түрдө жазага тартылып каларын билип, укук бузууга ойлонбостон баруусуна тоскоол болот."},{"t":"p","h":"Укукту коргоо башка адамдардын укук бузуусуна гана каршы күрөш жүргүзүүнү эмес, өзүнүн укугун коргоону да билдирет. Ар бир жаран өзүнүн кандай укуктарга ээ экендигин жакшы билип, ал укуктарынын ишке ашыруусун тие- <span class=\"pg\" data-n=\"116\">116<\/span>ГУ глава. Укук бузуу жана жаза. Мыйзамдуулукту сактоо"},{"t":"p","h":"шелүү органдардан талап кылуусу укуктук мамлекеттин бирден-бир жетишкендиги болуп эсептелмекчи."},{"t":"p","h":"Советтик коомдо сотко кандайдыр бир укугунун ордуна келтирилишин талап кылып барган адам арызчы адам катары каралып, терс пикир туудурар эле. Сот органдары жазалоочу орган катары таанылып, анын сот адилеттигин ишке ашыруучу орган экендиги айтылбай келген. Азыркы Конституциябыз боюнча сот органдары сот адилеттигин гана ишке ашырышат жана бардык талаш маселелер сот аркылуу гана чечилүүгө тийиш. Өзүнүн укугун коргоону талап кылып сотко кайрылуу, укукту коргоонун цивилизациялуу жолу болуп эсептелиши зарыл."},{"t":"p","h":"Мисалы, Кыргыз Республикасынын Конституциялык сотуна жаран С. арыз менен кайрылган. Анда мыйзам боюнча прокурор менен жарандын сот процессинде укугу бирдей эмес болгондугу үчүн анын укугу бузулуп, негизсиз кылмыш жоопкерчилигине тартылгандыгын жазып, мыйзамдын ошол жобосун Конституцияга ылайык эмес деп табууну сураган. Натыйжада, Конституциялык сот мыйзамдын ошол жобосун Конституцияга ылайык эмес деп таап, жоопко тартуу тууралу соттун чечимдери аткарылбасын деген жыйынтыкка келген. Бул учурда ал өзүнүн гана укугунун сакталышына жетишпестен, мыйзамдын Конституцияга каршы келген жобосунун аракетинен улам көптөгөн жарандарды укуктарынын бузулуусунан коргоп калды."},{"t":"p","h":"Жарандар укук коргоону жеке эле жүргүзбөстөн, биргелешип жүргүзүшүнө да мыйзам жол берет. Кыргыз Республикасынын «Коомдук бирикмелер женундегу» мыйзамына ылайык, жарандар ар кандай уюмдарды түзүүгө акылуу, мындай уюмдардын мисалы катары Кыргызстан укук коргоо кыймылын, Керектөөчүлөрдүн кызыкчылыгын коргоо коомун айтсак болот. Кыргызстан укук коргоо кыймылынын катышуучулары укугу бузулду деп эсептеген жарандарды коргоо иштерин уюштурууда, ал эми керектөөчүлөрдүн кызыкчылыгын коргоочу коомдун өкүлдөрү сатууга чыккан <span class=\"pg\" data-n=\"117\">117<\/span>Г/ глава. Укук бузуу жана жаза. Мыйзамдуулукту сактоо ЗА 2"},{"t":"p","h":"сапатсыз енер жай товарларын, тамак-аш азыктарын өндүргөн жана саткандарга каршы мыйзам чегинде күрөш жүргүзүп, жарандарга сапаттуу товарларды сатып алышына, сапаттуу азык-түлүктөрдү пайдаланышына көмөк көрсөтүп жатат."},{"t":"p","h":"Мыйзам тарабынан жарандарга өз укугун коргоого гана жол берилбестен, башкалардын да, өзүлөрүнүн да ден соолугун, ар-намысын жана өмүрүн кол салуулардан коргоого укук берилген. Мисалы, кечеде кылмышкерлер бир жаранды катуу сабап жатышса, аны коргоо үчүн башка жарандар барып кылмышкерлерге жаракат келтирген сокку урса да, кылмыш жоопкерчилигине тартылышпайт. Себеби, алар коомдук коркунучтуу аракеттерди токтотуу үчүн зарыл болгон аракеттерди жасашкан. Бирок коргонуу зарыл болгон чектен ашып кетпеши керек. Мисалы, короого алма уурдоо үчүн бир бала кирди дейли, ошондо алманын ээси ез менчигин коргоо максатында баланы кармап алып, сабап, денесине жаракат келтирген болсо, демек, ал зарыл болгон чектен ашып кеткен. Бул аракети үчүн мыйзамга ылайык жооп берип калат."},{"t":"p","h":"Азыркы мезгилде биздин өлкөбүздө адамдын конституциялык укуктарын жана эркиндиктерин камсыз кылуучу механизмдерди түзүү боюнча көптөгөн иштер жүргүзүлүп, көптөгөн мыйзамдар кабыл алынып жатат."},{"t":"p","h":"5,"}],"sub":[],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЖАРАНЫ","pages":[116,117]},{"title":"КАЙТАЛОО УЧУН СУРООЛОР","blocks":[{"t":"h3","h":"КАЙТАЛОО УЧУН СУРООЛОР"},{"t":"p","h":"1. Укук коргоо ишинде жарандардын ролу?"},{"t":"p","h":"2. Укук бузууларга каршы күрөш жүргүзүүгө мыйзамдарды билүү"},{"t":"p","h":"кандай жардам берет?"},{"t":"v","l":["3. Укукту коргоо боюнча соттордун мааниси кандай?","4. Зарылдык боюнча коргонуу тууралуу айтып бергиле?"]},{"t":"p","h":"5. Кыргызстанда жарандардын укугун коргоочу кандай уюмдарды"},{"t":"p","h":"билесиңер?"},{"t":"p","h":"<span class=\"pg\" data-n=\"118\">118<\/span>1."},{"t":"p","h":"єз, э У глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"У глава"},{"t":"h3","h":"КЫРГЫЗ РЕСПУБЛИКАСЫНДАГЫ УКУК ТАРМАКТАРЫ"},{"t":"p","h":"5 26. Укук тармактары боюнча жалпы тушунук"},{"t":"p","h":"Укук коомдогу боло турган бардык мамилелерди, бапткача айтканда жарандардын, мамлекеттик органдардын, чарба жүргүзүүчү субъектилердин бири-бири менен болгон же өз ара мамилелерин женге салып турарын билдик. Ал мамилелердин түрлөрү көп болгондуктан, өзгөчөлүктөрү боюнча тармактарга бөлүнүп, тартипке келтирилип, укук тармактары түзүлөт."},{"t":"p","h":"Укук тармагы деп – коомдук мамилелердин кандайдыр бир ири бөлүгүн жөнгө салып турган укуктук ченемдердин өзгөчөлөнгөн, жыйналган тойун аитабыз. Бул ченемдердин биримдиги алар женге салуучу коомдук мамилелердин жалпылыгына, окшоштугуна жараша түзүлөт."},{"t":"p","h":"Кыргыз Республикасында укуктун тармактары бир топ, алар 20дан ашат. Алардын негизгилерин келтирүү менен кыскача мүнөздөмө берели."},{"t":"p","h":"1. Конститүциялык укук же мамлекеттик укук деп да аталат. Бул тармак – мамлекеттик жана коомдук түзүлүштүн негиздерин, адамдардын укугу менен эркиндиктерин, жарандардын укуктарын жана милдеттерин, мамлекеттик органдардын тутумун бекемдеген мамлекеттин укуктук ченемдеринин жыйындысы."},{"t":"p","h":"Конституциялык укуктун негизги булагы – Кыргыз Республикасынын Конституциясы болуп эсептелет. Биз Конституцияга жана мамлекеттик бийликтин жогорку органдарынын функцияларына кеңири токтолгонбуз. Конституциялык укук ошол органдардын, жергиликтүү бийликтин, жерги- <span class=\"pg\" data-n=\"119\">119<\/span>М Ө – глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"ликтүү өзүн-өзү башкаруу органдарынын тутумунун түзүлүш тартибин, иштее принциптерин, шайлоо түзүмүн бекемдейт, ошондой эле мамлекет менен жарандардын ортосундагы мамилелерди женге салат. Бул укук тармагы башка укук тармактарына караганда жетектөөчү тармак катары мааниси бар, анткени өлкөнү мамлекеттик жана коомдук жактан уюмдаштыруунун, анын түзүлүшүнүн негизин бекемдейт. Мыйзамдуулук принцибин жүзөгө ашырууну камсыз кылып, укуктун башка тармактарына тиешелүү ченемдерди белгилөө, аларды Өзгөртүү боюнча укуктарды аныктайт."},{"t":"p","h":"2. Конституциялык укуктан кийин эле эң маанилүү укук тармагы жарандык укук болуп эсептелет. Жарандык укук – жарандык мамиле түзгөндөрдүн укуктук абалын, менчиктөө укугун, интеллектуалдык иш-аракеттердин жыйынтыгына укукту аныктайт, келишимдик жана башка милдеттенмелерди жөнгө салат, бөлөк мүлктүк эмес мамилелерди тууралайт. Бул укуктун тармагы өтө кенири жана ар бир жарандын билүүсү маанилүү болгондуктан, аны өзүнчө окуйбуз."},{"t":"p","h":"з. Шайлоо укугу шайлануучу мамлекеттик органдарды түзүү тартибин, жарандардын ал органдарды шайлоого жана өздөрү шайланууга болгон укуктарын жөнгө салуучу укук тармагы болуп эсептелет."},{"t":"p","h":"Бул укук тармагы өзүнчө укук булагына ээ болгон. Кыргыз Республикасынын Шайлоо жөнүндөгү кодекси кабыл алынган. Шайлоо укугу жарандын коомдогу маанилүү укук тармактарынын бири болгондуктан жана силер жакын арада бул укуктан пайдалана баштай тургандыктан, ага өзүнчө сабакта кенири токтолобуз."},{"t":"p","h":"4. Жер укугу. Жер, суу, токой жана жердин ички казынасы (кендер) жалпы элге тиешелүү. Бул байлыктарды туура пайдалануу өзгөчө маанилүү, анткени алар мамлекеттин жана элибиздин жашоо мүмкүнчүлүгүнүн негизин түзөт. Ошондуктан жерге, сууга, токойго жана кен байлыкка болгон мамилелерди жөнгә салуу үчүн ар бири өзүнчө укуктун тармагы болуп бөлүнгөн."},{"t":"img","src":"data:image/webp;base64,UklGRr45AABXRUJQVlA4ILI5AADQWQGdASpbApMBPrVUpEynJKulp7PbAXAWiWkbrNZ6dTmMr/x+Uf9X/D+QP5H9c/s/79yu4kfeXjr4K/nX836C/5n/W/M+iQ9NKBv1Xif7r71v8kf+z0Lfh5/PfUaKA1uFzKgRft48jmJKcJVqGsvNZW6+nwhVpDgXXYH6Eklh3Wzu7Bx/TuXC/sZUiQRx/ll6peynkt1lDCk2iW3jYy7KZ8PeGFWX+LUcxmrGzchtSfVoZUuqNimjOYToXd6/vCXYnahqsl1bElvgRxqhQy/kQUerfsMXfJVIBbPHxnjhpSfrmcY+ne2O/Fw3DVpt1TpWNz76cFsdyAaclnJe73M3+EEDFmusSU16JRKJRKHOeOVctn7hb/La41LXERiG8MX9x3um51EYIndAXuJ6Aif78hepkw+/imNiu6h9K+EMydg3xChcvzuy3j2iCJcK39Kowi+tbrdbrdblYlQzNjquRekEkbo1A9uBiZBt3r566LfShEo6z9J0rPFJ0TCutejmEUFKMcijaJSFw5xVBC0tHLjjFIRN2CNDkJBIJBIFU477IpKZxyn/ZX/KS3U+p+5NJRBMdKgQIglpqFVXvQxCglPZOjgUDo+z8Vz9j4ZaKWzMuW/+s3l6m6zJ7/PFNNGUymUymUymXdB4eYO9hiZ4T4JJNO//EtAK3VqunImlt1qDuY6ksa+KbFYsxajgog8PQslnoV4vxbH/Si6IvJBIJBTcgjZk4g9gkrUBsYXZUDA8oX4DgYvl9MWAEmuubNW/fgQiAFYrFYq95RmPPVyv725W/CDKArV59At0a6UZjrxTASKwlkfxhn8ol8cw3QUSE6lX8jqAEh6jSFGIzCgzLcVfcDb+bID5n5gIHva8LvdVxKC0XYRXnL8Bjn9h8NBkRAW+WLq/vDQjYcsEhvt+8XSDI+LjicWWvBcyNz57MRbtmSMVe8cwslusZIbkm9EBsRd1lwileOj96fyTdtenS4VgBR80TIonOXxztI+LsVFH6T5GYc5ZBSK15A/pDtPSZIlOcHHmiBtSd4Sl8Oe52leCk0OWvlgqkvWeaUAPHoVMyNJqyxOdJqDkrVmpH3x7xCEcouhRiWn7bvxDAdb0 гиси Жер кодекси болуп эсептелет. Анда жер жөнүндө жалпы түшүнүктер, жерди ээликке жана пайдаланууга берүүнүн эрежелери, жерди ээлее жана пайдалануу укугунун жоюлушу, жерлердин кандай учурда алынып коюлары, жерди пайдаланып жаткандардын укук-милдеттери, ар кандай жерлерди пайдалануунун эрежелери, өзгөчөлүктөрү жана жерди коргоо боюнча иш-чаралар берилген. Ошондой эле жерди пайдалануунун эрежелерин бузгандарга кандай жоопкерчилик жүктөлөрү белгиленген."},{"t":"img","src":"data:image/webp;base64,UklGRqA0AABXRUJQVlA4IJQ0AADQugGdASqAAncBPrVOnUmnLCmkMTSa+YAWiWlsG9cH+8a9uV/X5fH+HxRv54iWfVVLhHpTLu97v7f4H3VLpNMDDsz7AH688pO0uUef9jyN/YnqH0YDBJD1dbK7HuVIS5Osf/bxd9y/9L+49pT/t0j/L/+ng0zF/9vaw4MH/b1n9P/+3pPedfFtrXMoJzDx4/mhD0SvMe+Gdst2eyUAFBzyLBtc5i5/7Ds7zsQXAxvSoFBB3opt5OC6JovCMHYRhZbHa8PFR6yxcWi35/0w5DzZbbTpNQDepdIqSApQQC9nk3gyOCDEUr21/DwHcAqSumoayHqyVnzBtkuroLk6gpmwPhjHgZdUPYjmgE3SByV/bpoy9kRI0eZPyrVCKuymCO5D3Y5ozXXRiFvVZM39LtiNXmctgQMK4TiSjP828FxkbzgrqSiUggzlDyblBC14xP48lsqzly4eI2AGUzrTwbkm8GEcYEO/x3DBwIZZ9eWJLc5rIq71VxSRYu/tsKKAlxZm5Mo1TjcPR3QUURz8iL2UkW0pWgfseeBTDuF1BkRQggsEIrxijwBdbHIAkNLVIKDzhxJZsxgoyUpWm43IVj5I4ALYFNcNiaTf8PnZgTJzjWaadi8StlfXjZzyT8lzd+UCC6/iKV6t13Q5Mn7+FDu4MyNLEqMpNvk1Aa6sTFnooH+sBpcR9W2+3zAupRjhRi68TCUN4duOrxg8+/BqR146lV1KmHEnJk5XT9JGvTP3QHZ7MW1SQ0yLTj4ZTaz4jbiyGB/PeSFvleVeOd0wPzPbrhsbTInoaXEv7OIDTId+01ACWYK7S2sUABmMnzZeDbngfIMFte0zotLVrNhqZWOSPgVjP554dy8k27QKjaHSbzmtduWbp6LPDKzymRmt4Yy3Fs/0iv7cNqV/yD1FLq+f7LbzlPSb0hhcT122docFKZQPAIQKaNvWUrxjUwWzjNMKVB/fKoPoE+UpbF8myID1hrvwUIOga3PPL7a3XDFIPIoH9PLe9HkG8ekT6a+x9H4DxrwoBGZwVcY7Q6ir8RViqlH4/gjalPlWG6+D6gi3ecEADqIamHxrCTlNZ3z2VusMQO6BhyEAjVdhZFIhYXdi9Yjn+zdXASrNKFJrnzA82p40FDX8crswhFvocUa+aDdkfAbXoNuko/zREIY9yX84lAfHToWgd17XcCwNc66Psra9pubF5SPMVrRlbynU0ix0tqI8cJ3V5IDmOw+xhOLP+ivDFlzWF0Ie8E4ygilg1f0y24DWe309VA5hL2L55iz7L0gMkbS7yyl28PD8I4Za9/sHbKD1kNwAKAnU9+6jB9eHMDyNYt6BajsdM3/c/vXzKmmPN3I02OJW+UF6sYu8HbJWHA9ktX2DB4UlrJewYM0Drl45Kl7uW7DaBCxvATB1iprDpsexRp2srrx36ge2kgcLsopGjPLI5Zpoh+yNGMxK7kuONGfjDFmsBB/ci+z/6

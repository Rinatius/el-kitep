<title>Адам жана коом 9</title>
<style>/* Mobile textbook reader. No external fonts or libraries: everything works offline. */
:root {
  --bg: #ffffff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3;
  --panel: #f6f6f6; --accent: #1f6feb; --accent-fg: #ffffff;
  --fs: 19px; --lh: 1.55;
  --font: Georgia, "Noto Serif", "DejaVu Serif", "Times New Roman", serif;
  --bar-h: 48px; --foot-h: 28px;
}
[data-theme="sepia"] { --bg: #f5ecd9; --fg: #4a3b2a; --muted: #8a7458; --line: #e0d2b4; --panel: #ece0c6; --accent: #9a5b13; }
[data-theme="dark"]  { --bg: #111315; --fg: #d8d8d8; --muted: #8c8c8c; --line: #2a2d31; --panel: #1b1e21; --accent: #6ea8ff; --accent-fg: #0b0b0b; }
[data-theme="contrast"] { --bg: #000000; --fg: #ffffff; --muted: #c8c8c8; --line: #444; --panel: #151515; --accent: #ffd400; --accent-fg: #000; }
[data-font="sans"] { --font: Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 16px/1.4 Roboto, "Noto Sans", Arial, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- Library ---------- */
.lib { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lib h1 { font-size: 22px; margin: 8px 0 4px; }
.lib .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.lib-head { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
.lib-head h1 { flex: 1; margin: 0; }
.school { display: flex; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.school button { flex: 1; min-height: 44px; padding: 0 10px; font-size: 15px; background: var(--panel); }
.school button + button { border-left: 1px solid var(--line); }
.school button.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.my-link { flex: 0 0 auto; font-weight: 600; min-height: 40px; padding: 0 12px; font-size: 14px; }
.grade { margin-bottom: 10px; }
.grade-h { display: flex; width: 100%; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 18px; font-weight: 600; text-align: left; }
.grade-h::after { content: '›'; font-size: 24px; color: var(--muted); margin-left: 10px; transition: transform .15s; }
.grade.open .grade-h::after { transform: rotate(90deg); }
.grade-h .n { margin-left: auto; font-size: 14px; font-weight: 400; color: var(--muted); }
.grade-b { padding: 0 2px; }
.grade-t { font-size: 20px; margin: 18px 0 0; }
.subj { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.bk { border-bottom: 1px solid var(--line); padding: 4px 0 12px; }
.bk:last-child { border-bottom: 0; }
.bk-t { font-size: 17px; font-weight: 600; }
.bk-s { font-size: 14px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bk-m { color: var(--muted); font-size: 13px; margin: 3px 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: .5; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.bk-h { display: flex; align-items: flex-start; gap: 4px; }
.bk-h .bk-t { flex: 1; padding-top: 10px; }
.bk .row { gap: 4px; }
.bk .row .btn { min-height: 40px; padding: 0 18px; font-size: 14px; margin-right: 8px; }
.bk .icon { color: var(--muted); flex: 0 0 auto; }
.bk .icon[disabled] { opacity: .5; }
.bk .icon.on { color: var(--accent); }
.bk .star.on svg { fill: currentColor; }
.bk .star.on { color: #e3a008; }
.share-opts { display: flex; flex-direction: column; gap: 10px; }
.share-opts .note { margin-top: 0; }
.sheet h3 .icon { flex: 0 0 auto; }

/* ---------- Reader ---------- */
.reader { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; user-select: text; }
.viewport { position: absolute; left: 0; right: 0; top: 0; bottom: var(--foot-h); overflow: hidden; }
.flow {
  height: 100%; column-fill: auto; padding: 20px 0 12px;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  will-change: transform; transform: translate3d(0,0,0);
  hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
}
.flow.anim { transition: transform .25s ease-out; }
.flow p { margin: 0 0 .15em; text-indent: 1.4em; text-align: left; }
.flow p.ni { text-indent: 0; }
.flow h1, .flow h2, .flow h3 { font-family: Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.25; break-after: avoid; page-break-after: avoid; }
.flow h1 { font-size: 1.35em; margin: .2em 0 .8em; text-align: center; }
.flow h2 { font-size: 1.15em; margin: 1.1em 0 .5em; }
.flow h3 { font-size: 1.0em; margin: 1em 0 .4em; }
.flow .verse { margin: .6em 0 .8em 1em; break-inside: auto; }
.flow .verse div { text-indent: -1em; padding-left: 1em; text-align: left; }
.flow .verse .gap { height: .7em; }
.flow figure { margin: .8em 0; text-align: center; break-inside: avoid; page-break-inside: avoid; }
.flow figure img { max-width: 100%; height: auto; border-radius: 4px; background: var(--panel); }
.flow figcaption { font-size: .8em; color: var(--muted); margin-top: .3em; }
.flow .box { border-left: 3px solid var(--accent); padding: .1em 0 .1em .7em; margin: .7em 0; }
.flow .pg { font: 11px/1 Roboto, Arial, sans-serif; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 4px; margin: 0 3px; vertical-align: 2px; text-indent: 0; white-space: nowrap; user-select: none; }
.flow .end { height: 1px; }
.flow .endnote { text-align: center; color: var(--muted); font-size: .8em; margin-top: 2em; font-family: Roboto, Arial, sans-serif; }
[data-theme="dark"] .flow img, [data-theme="contrast"] .flow img { filter: brightness(.9); }

.foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot-h); display: flex; align-items: center;
  justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.foot .t { overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }

.bar { position: absolute; left: 0; right: 0; background: var(--panel); border-color: var(--line); z-index: 5;
  transition: transform .2s; display: flex; align-items: center; }
.bar.top { top: 0; height: var(--bar-h); border-bottom: 1px solid var(--line); transform: translateY(-100%); padding: 0 4px; }
.bar.bottom { bottom: 0; border-top: 1px solid var(--line); transform: translateY(100%); padding: 10px 16px 14px; flex-direction: column; align-items: stretch; gap: 6px; }
.reader.ui .bar { transform: none; }
.bar .title { flex: 1; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.bar .info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* ---------- Sheets (TOC, settings) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85%; overflow: auto; background: var(--bg);
  border-radius: 16px 16px 0 0; z-index: 11; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
.sheet h3 { margin: 10px 0 12px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.toc a { display: block; padding: 11px 4px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 15px; }
.toc a.sub { padding-left: 20px; font-size: 14px; color: var(--muted); }
.toc a.cur { color: var(--accent); font-weight: 600; }
.set { margin: 14px 0; }
.set label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; }
.seg button.on { border: 2px solid var(--accent); font-weight: 600; }
.swatch[data-v="light"] { background: #fff; color: #1b1b1b; }
.swatch[data-v="sepia"] { background: #f5ecd9; color: #4a3b2a; }
.swatch[data-v="dark"] { background: #111315; color: #d8d8d8; }
.swatch[data-v="contrast"] { background: #000; color: var(--accent-fg); }
.goto { display: flex; gap: 8px; }
.goto input { flex: 1; min-height: 44px; font-size: 16px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px;
  border-radius: 20px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Textbook elements produced by tools/convert_pdf.py ---------- */
.flow .tasks, .flow .gloss { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45;
  background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0; }
.flow .tasks p, .flow .gloss p { margin: 0 0 .35em; text-align: left; }
.flow .gloss { border-left: 3px solid var(--accent); }
.flow p.note { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; font-style: italic; text-indent: 0; margin: .6em 0; }
.flow p.attr { text-align: right; text-indent: 0; font-style: italic; color: var(--muted); margin: .1em 0 .8em; }
.flow p.sep { text-align: center; text-indent: 0; color: var(--muted); margin: .5em 0; letter-spacing: .3em; }
.flow h2 .pg, .flow h3 .pg { font-weight: normal; }
.toc .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 4px 2px; }
.toc a .p { float: right; color: var(--muted); font-size: 13px; margin-left: 8px; }

/* ---------- Elements produced by tools/convert_layout.py (typeset textbooks) ---------- */
.flow figure img { cursor: zoom-in; }
.flow h4.mk { font: 700 .78em/1.3 Roboto, "Noto Sans", Arial, sans-serif; letter-spacing: .05em; color: var(--accent);
  margin: 1em 0 .3em; break-after: avoid; page-break-after: avoid; }
.flow p.hl { color: var(--accent); text-indent: 0; }
.flow p.small { font-size: .82em; text-indent: 0; color: var(--muted); }
.flow sup, .flow sub { font-size: .7em; line-height: 0; }
.flow .kbox { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45; background: var(--panel);
  border-radius: 8px; padding: .45em .7em; margin: .5em 0; border-left: 3px solid var(--accent); }
.flow .kbox > b { display: block; }
.flow .frame { background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0;
  font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; line-height: 1.45; }
.flow .frame p { text-indent: 0; margin: 0 0 .35em; text-align: left; }
.flow .tbl { margin: .8em 0; font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .8em; line-height: 1.35; }
.flow .tbl .tt { font-weight: 600; text-indent: 0; text-align: center; margin-bottom: .3em; }
.flow .tbl table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.flow .tbl th, .flow .tbl td { border: 1px solid var(--line); padding: .3em .35em; vertical-align: top; text-align: left; overflow-wrap: anywhere; hyphens: auto; }
.flow .tbl th { background: var(--panel); }
.flow .tbl tr { break-inside: avoid; page-break-inside: avoid; }

.zoom { position: fixed; inset: 0; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; background: rgba(0,0,0,.92); z-index: 30; }
.zoom-in { position: absolute; inset: 0; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
.zoom-in img { margin: auto; flex: none; touch-action: pan-x pan-y; object-fit: contain; background: #fff; cursor: zoom-in; }
.zoom-x { position: absolute; top: 8px; right: 8px; color: #fff; background: rgba(0,0,0,.5); z-index: 31; }
.flow h4.sh { font: 700 .95em/1.3 Roboto, "Noto Sans", Arial, sans-serif; text-align: center; margin: .8em 0 .4em; break-after: avoid; page-break-after: avoid; }

/* maths books */
.flow h4.ex, .flow h4.try { font-family: Roboto, Arial, sans-serif; margin: 1.1em 0 .3em; font-size: 1em; }
.flow h4.ex { display: inline-block; background: #f7e400; color: #111; padding: .1em .6em; border-radius: 3px; }
.flow h4.try { color: var(--accent); }
.flow p.goal { font-size: .85em; text-indent: 0; background: var(--panel); border-radius: 8px; padding: .4em .7em; }
.flow b.bd { display: inline-block; text-indent: 0; padding: 0 .4em; border-radius: 1em; background: var(--fg); color: var(--bg);
  font: bold .8em/1.45 Roboto, Arial, sans-serif; margin-right: .2em; }
.flow b.nb { display: inline-block; text-indent: 0; min-width: 1.4em; border-radius: 4px; background: var(--accent); color: var(--accent-fg);
  text-align: center; font-size: .8em; margin-right: .3em; }
.flow .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.15; margin: 0 .1em; }
.flow .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .15em; }
.flow p.ml { text-indent: 0; padding-left: 1em; }
.flow p.side { font-size: .85em; }
.flow details.ans { margin: .3em 0 .8em; font-size: .9em; }
.flow details.ans summary { color: var(--accent); cursor: pointer; font-family: Roboto, Arial, sans-serif; }

/* wide tables become one card per row on phones */
@media (max-width: 560px) {
  .flow .tbl.cards table, .flow .tbl.cards tbody, .flow .tbl.cards tr, .flow .tbl.cards td { display: block; width: auto; }
  .flow .tbl.cards tr:first-child { display: none; }
  .flow .tbl.cards tr { border: 1px solid var(--line); border-radius: 8px; margin: .5em 0; padding: .3em .5em; }
  .flow .tbl.cards td { border: 0; padding: .15em 0; }
  .flow .tbl.cards td::before { content: attr(data-l); display: block; font: 600 .75em/1.3 Roboto, Arial, sans-serif; color: var(--muted); }
  .flow .tbl.cards td:first-child { font-weight: 600; }
}
.flow figure.vec svg { max-width: 100%; height: auto; display: inline-block; background: #fff; border-radius: 4px; cursor: zoom-in; }
[data-theme="dark"] .flow figure.vec svg, [data-theme="contrast"] .flow figure.vec svg { filter: brightness(.9); }
.flow .rt { border-top: 1px solid currentColor; padding-top: 1px; margin-left: 1px; }
.flow .it { display: inline-block; max-width: 100%; margin-right: .9em; text-indent: 0; }
</style>

ы маанисин түшүнүүгө жардам берет. Ошондой эле силерге укуктук билимдин негиздерин билүүгө жана аны мындан ары өркүндөтүүгө, Мектепти бүтүргөндөн кийин өз алдыңарча билим алуунарга шарт түзөт. Мамлекет жана укук тууралуу жеткиликтүү билим өлкөбүздө укук: тук, йемократиялык куруйга жана аны өнүктүрүүгө жигердүү катышууга силерге зор мумкунчулуктерду берет."},{"t":"p","h":"Мамлекет жалпыбыздын. үйүбүз, анын түзүлүшүн, мамлекет: тик бийлик органдарынын ыйгарым укуктарын жана алар кан-"},{"t":"p","h":"2296 <span class=\"pg\" data-n=\"4\">4<\/span>йай тартипте уюшуларын билүү ар бирибизге керек, Анткени, эч бир жаран жашоосун мамлекеттен тыш алын бара албайт. Мамлекет – жашоого, билим алууга, эс алууга, эмгектенүүгө шарт түзүп, коопсуздугубузду камсыз кылуучу жана ага кепил болуучу түзүлүш."},{"t":"p","h":"Мамлекет болгон жерде укук дагы сөзсүз болот. Турмушунда ар бир адам укук мамилелерисиз жашай албайт. «Укукту колдонуу укук коргап органдарына гана тиешелүү» деген түшүнүк жанылышитык, себейи ар бир адам өзүнүн жашоосунда үзгүлтүксүз укуктук мамилелерге катышат, биздин күндөлүк иштерибиздин дзэрлик ар бири укук тартиби менен жөнгө салынып турат. Укук адамдын бүт өмүрүн коштоп жүрөт. Мисалы, бала туулган күндөн тартып эле өлкөнүн жараны болууга, мурас боюнча мүлк алууга укуктуу."},{"t":"p","h":"Укук билим берүү, саламаттыкты сактоо, эмгек, үй-бүлө, турак-жай жана башка көптөгөн мамилелерди жөнге салат, бул мамилелерге жарандар менен катар мекемелер, уюмдар да катышат. Албетте, укук майда-барат иштердин бардыгын эле жөнгө сала бербейт. Бирок, мамлекет, коом жана адамдар үчүн маанилүү мамилелердин бардыгы укук жоболору менен женго салынууга тийиш."},{"t":"p","h":"Бардык жарандар коом, мамлекет алдындагы милдеттерин аткармайынча, бекем коомдук тартип орномоюнча, адамдардын укуктары жана эркиндиктери урматталмайынча демакратиянын, укуктук мамлекеттин болушу мүмкүн эмес. Башкалардын укуктарын жана мыйзамдуу таламдарын бузбастан, өз укуктарын туура пайдалануу жана милдеттерин так аткаруу үчүн мыйзамдарды билүү керек. Мыйзамды билбе жоопкерчиликтен бошаттойт.."},{"t":"p","h":"Мамлекет жүрүм-турум эрежелерин көбүнчө мыйзамдарда жана башка ченемдик актыларда баяндайт, алар укук булактары деп аталат. Кыргыз Республикасында укук булактарына Конституция, мыйзамдар, Президенттин жарлыктары, Өкмөттүн токтомдору жана министрликтердин ченемдик актылары кирет."},{"t":"p","h":"<span class=\"pg\" data-n=\"5\">5<\/span>| [5 у ЖА сэ, С?"},{"t":"p","h":"Силер бул сабакты өздөштүрүүдө окуу китептеги материалдарды, массалык маалымат каражаттарынан окуган, жашоо-турмушта көргөн окуялар менен салыштырып талдасанар, ийгиликке жетишесиңер."},{"t":"p","h":"Акырында айта турганыбыз, өзүнүн укугун жеткиликтүү билбеген, өзүнүн мыйзамдуу таламдарынын аткарылышына жетише албаган адамды билимдүү, сабаттуу адам деп айтыш кыйын, ал турмушта өзүн ишенимдүү алып жүрө албайт. Ошондуктан, силер билимдур, сабаттуу адам болууга тырышкыла."},{"t":"p","h":"Быз бул окуу китепти кызыктуу, түшүнүктүү кылууга аракеттендик. Мамлекет жана укук негиздери баюнча сабактар силерди жигердүү жаран, мазмундуу ойлонууга жөндөмдүү жана әз кызыкчылыгын коргой ала турган адам катары тарбиялоого көмөгүн тийгизет деген ишенимдебиз."},{"t":"p","h":"Сиздерге ийгилик каалаймын!"},{"t":"p","h":"Автор <span class=\"pg\" data-n=\"6\">6<\/span>Т глава. Мамлекет, укук жана адеп-ахлак"},{"t":"p","h":"Г глава"}],"sub":[],"pages":[2,6]},{"title":"§ 1. Мамлекет тушунугу, мамлекет","blocks":[{"t":"h3","h":"МАМЛЕКЕТ, УКУК ЖАНА АДЕП-АХЛАК"},{"t":"h3","h":"§ 1. Мамлекет тушунугу, мамлекет"},{"t":"p","h":"тузулушунун жана башкаруунун формалары"},{"t":"p","h":"1. Мамлекет – деген эмне? Адамзат жаралып, ушул күнгө келип жеткичекти көптөгөн мезгилди, далай жолду басып өттү. Эн алгачкы пайда болгон адамдар башка жаныбарлардан айырмаланбаса дагы, аларга табият берген акыл-эстин натыйжасында ар тараптуу өнүгүп-өсүп турган. Бул өсүүгө акыл-эс гана өбөлгө болбостон, көптөгөн башка себептер да түрткү берген. Мисалы, Жер жүзүнүн ар тарабындагы климаттык өзгөрүүлөр, белгилүү бир аймакта адам санынын көбөйүп, турмуштун татаалдашы ж. б. у. с. себептер. Ушундай өнүгүп-өсүүнүн бир натыйжасы мамлекеттин келип чыгышы болгон. Ал өз жолунда адегенде алгачкы коомдук түзүлүштү басып өткөн. Алгачкы коомдук түзүлүш адамзаттын тарыхындагы эң узак этап болуп эсептелет да, ал 1 миллион жылдан узак мезгилге созулган. Баштапкы этапта адамдар 20—30дан турган уруктардын бирикмелери катары жашашкан. Ири жаныбарларга мергенчилик кылуу үчүн гана топ-топторго биригишкен. Кийинчерээк таш доорунда кишилердин бирикмелери ирилешип отуруп, айыл же уруу болуп жашоого өтүшкан. Чарбачылык кылуу түрү боюнча бөлүнүү пайда болуп, бир уруу мал багуу менен алектенсе, экинчиси жерди иштетүүгө өтүшкөн. Бир аймакта алака кылып жашаган урууларга башка тараптан кол салуу болгон учурларда уруулар бирикмеси пайда болуп, ага жол башчы дайындалган учурлар кезиге баштаган. Негизинен, ар кайсы континенттеги алгачкы уруучулук коомдордун турмушун изилдеген окумуштуулардын жыйынтыгына караганда – алгачкы <span class=\"pg\" data-n=\"7\">7<\/span>Г глава. Мамлекет, укук жана адеп-ахлак"},{"t":"p","h":"уруучулук коомдордун башкаруу органдары болуп – жашы улуу адамдардын чогулушу, аксакалдар кеңеши, жол башчылар кеңеши, улук, жол башчы, диний жетекчилер эсептелишкен. Ошентип алгачкы коом бара-бара тенчилик принцибинен алыстай баштаган, биринчиден, башкаруучулар катмары келип чыкса, экинчиден, мүлктүк абалы боюнча ажырым пайда боло баштаган, б. а. байлар, кедейлер. Ушул себептердин натыйжасында алгачкы коомдун башкаруу органдарынын ордуна мамлекет келди."},{"t":"p","h":"Мамлекеттин уруучулук түзүлүштөн айырмасы – жалпыга тийиштүү, бардык адамдар баш ийүүгө милдеттүү болгон бийликтин пайда болушунда. Анткени, мамлекет болуп уюшулган коомдо жалан гана мамлекетти башкаруу менен алек болгон адамдардын катмары жаралат жана ушул адамдардан мамлекеттик органдар түзүлөт."},{"t":"p","h":"Әгер уруучулук коомдо адамдар туугандык белгиси менен биригишсе, мамлекет калктын аймактык уюшулушуна негизделип, бийликтин белгилүү бир аймакта жүргүзүлгөндүгү менен айырмаланат. Мамлекеттин өзгөчөлүгү ал жалпыга милдеттүү укуктук ченемдерди чыгарат жана аларга сөзсүз, милдеттүү түрдө аткарыла тургандай күч берет. Мамлекеттин башкы белгилеринин дагы бири калктан жыйналуучу салык болуп эсептелет."},{"t":"p","h":"Ошентип, мамлекет деп, белгилүү бир аймактын чегинде калктан чогулуучу салыктын негизинде иштеген бийлик органдары жана жалпыга тиешелүү укуктук ченемдери бар калктын уюшулган бирикмесин айтабыз."},{"t":"p","h":"Мамлекеттин келип чыгышынын эн негизги себеби, коомдо баш аламандыкка (анархияга) жол бербөө жана саясий бийликти жүргүзүүгө курал, каражат катары пайдалануу болуп эсептелет."},{"t":"p","h":"Жер жүзүндө биринчи мамлекеттер биздин заманга чейинки Х-XI кылымдарда Түндүк-Чыгыш Африканын аймагында пайда болгон. Андан соң мамлекеттердин жаралуу про- <span class=\"pg\" data-n=\"8\">8<\/span>Г глава. Мамлекет, укук жана адеп-ахлак"},{"t":"p","h":"цесси Жер ортолук деңиз бассейнине таралгандыгы тарыхтан белгилүү."},{"t":"p","h":"Мамлекет өзүнүн өнүгүү тарыхында ар кандай стадияларды басып өткен жана белгилүү бир калктын жогору турган катмарынын кызыкчылыгын коргоо үчүн курал катары кызмат кылган. Өзүңөр билгендей мамлекеттер кул ээлөөчүлүк, феодалдык, буржуазиялык, социалистик формадагы стадияларды басып өтүшкөн. Азыркы мезгилде элдин ан-сезиминин өсүшүнүн жана коомдун өнүгүшүнүн натыйжасында дүйнө жүзүндө жалпы элдин кызыкчылыгын демократиялык принципти туу туткан, рынок экономикасына негизделген, укуктук мамлекеттер басымдуулук кылат. Биздин мамлекетибиз – Кыргыз Республикасы эгемендүү, демократиялык, укуктук, мамлекеттик башкарууга дин аралашпаган, унитардык, социалдык мамлекет болуп эсептелет."},{"t":"p","h":"2. Мамлекеттин белгилери. Коомдо мамлекеттен башка дагы ар кандай түзүлүштөр бар, алар – саясий партиялар, массалык кыймылдар, коомдук жана диний уюмдар. Мамлекетти бул түзүлүштөрдөн айырмалап турган төмө  адеп-ахлак =) н д&gt;"},{"t":"p","h":"мүмкүн. Мамлекет биримдиктүү болушу үчүн анда жашаган калк ынтымактуу болуп, өз мамлекетине атуулдук сезими күчтүү болууга тийиш. Эгер мындай болбосо, андай мамлекеттин келечеги жок."},{"t":"p","h":"Жалпы бийлик. Әлдин жашоосун уюштурууга жөндөмдүү коомдук бийлик. Мамлекеттин алгачкы уруучулук түзүлүштөн айырмасы элди башкарууга жөндөмдүү адамдардын бөлүнүп чыгып, мамлекеттин турмушун жөнгө салып, анархияга жол бербей, белгиленген тартипти кармап туруучу кызмат адамдарынын пайда болушу эсептелет. Мамлекеттик бийлик мамлекеттик органдардын жана мекемелердин жардамы менен жүргүзүлөт. Алардын татаал тутуму бар. Кийинчерээк баарын талдоого алып үйрөнөбүз."},{"t":"p","h":"Ушул үч белгини мамлекеттин негизги белгилери гана деп билсе болот, анткени мамлекетке мүнөздүү мындан башка дагы көп белгилер бар, атап айтканда – армия, укук, салык, укук коргоо ж. б. органдардын бар болушу."},{"t":"p","h":"3. Мамлекеттин түзүлүш формалары. Мамлекеттер уюмдашуу ыкмасы боюнча унитардык, федерациялык жана конфедерациялык болуп бөлүнөт."},{"t":"img","src":"data:image/webp;base64,UklGRhgcAABXRUJQVlA4IAwcAADQkgCdASqAAtQAPrVUpUwnKKOqqhRqSVAWiWVuLbM6yfKqipPPHmhwb+fTMF1U5B+v2j9gJruRUz1Owcxe0L6aP8j0k/UtzmGnodFzfHLyf8x/f/E38c+ifyv9z81X+v6i3NN9y/1H+F9C/2N8YfgnqEflP8+/1f9v9aeDXxJ+29Aj2J+1/sf42uqV3v9IP9i4xCgH5LP975qPz7/eew0XZTPYA2DK3zIGKEZfc4aUIy+5w0oRk4+/qOncGlCMvucNKEZfc2iLLR7h3OwoPDUxkl+3dWH3JNc0aWwDIa86qRqL4ue4MRp6B4msWIQzir9P5+K/J++OlzhcLLwAmwvB1HNwZ80ztyCLgl4O/wkYn9/o+cyVpD2I9h6nho/o6g+jnwg/T/mwihL8rcQfvkaJNjGsTxNfJk29WJPbhXWc4TN6b0hhmMlRVJn8rmSIKdHIRXyb1o4K/sbxhTji68QGWkj3baPit2ETsEz0TdUH5ZJ/gomM44rs3C1/CgVmoDB7GTj9ZR39EoF3ySSIJQnb5N002B3zrjRPdgDuNZAt705W8eFk6fAHsboiBkFI9+TB7+1DcFhsW9/HGru65bQMEizj4PzvRl5eEZ9IZblW+NAM2RESDrd9RMBce9mINDMw8areQQBqNka2K6I3Vngl8GVEY/amrcWXKouyrBo1Y3wbNjOSSuijrTuW//xHrElf+Y4OXAtIvv3dThL8q9aSv3KiFakJp7wRX2kDXfGKjAlB0bUr/N5+TvvQMOP/1v3YVyOw8v1Kcdf5B+s37jK09mlEwFmtp4puxJEsVf2xW/A/yfVaPX9ykF26O6B3/7xiJCZkLmyFCUFRH42UnGED6+Px/4y гандары. Федерациянын ар бир курамдык бөлүгүнүн өзүнүн укуктук тутуму бар, алар жалпы федерациянын укуктук тутуму менен катар аракеттенет, бирок негизги маанилүү маселелер боюнча карама-каршылыктар болбоого тийиш. Мындай мамлекеттердин катарына АКШ, Россия, ГФРди кошсо болот."},{"t":"p","h":"Ҥонфедерация – федерацияга караганда, мамлекеттердин анча тыгыз эмес бирикмеси. Бул мамлекеттер конфедерацияга бириккени менен ички ишинде өзүлөрүнүн көз карандысыздыгын сактап калат. Жалпы конфедерациялык бийлик органдары, курамына кирген ар бир мамлекеттин чоң, кичинесине карабастан, бирдей санда кошо турган өкүлчүлүктөрүнөн турат. Азыркы мезгилде конфедерациялык мамлекеттин катарына Швейцарияны кошууга болот."},{"t":"p","h":"Жогоруда айтылган формалар мамлекеттердин тышкы формасын мүнөздөйт, мындан тышкары мамлекеттердин ички формалары бар, ал саясий режим деп аталат. Саясий режим <span class=\"pg\" data-n=\"11\">11<\/span>Г глава. Мамлекет, укук жана адеп-ахлак"},{"t":"p","h":"мамлекеттин өзгөчөлүгүн, анын демократиялык же антидемократиялык экендигин көрсөтүп турат. Режимдер демократиялык (кул ээлөөчүлүк режимдин демократиясы, буржуазиялык режимдин демократиясы) жана антидемократиялык (деспоттук, феодалдык, полициялык мамлекеттик режим, авторитардык, фашисттик режимдер) болуп бөлүнөт."},{"t":"p","h":"4. Мамлекетти башкаруунун формалары. Мамлекеттер башкаруу формасы боюнча негизинен – монархия жана республика болуп экиге бөлүнөт."},{"t":"img","src":"data:image/webp;base64,UklGRsgXAABXRUJQVlA4ILwXAAAQegCdASqAArgAPrVWpE4nJKumI1FbqXAWiWVuc9E7kfLqh0mjMH6T+zaZTRo+a69WTh1lMfKP7jev6C3nX9PB6LW+M2xH4v8p/P3x0+tc0+uR+ZfUb+Yfcv9X/ePRv/o+EPwo1CPYX+t/sHq9fUd3BqP+z9BH2k+3/sT4y/zb6sfY3zaOKSoHeSn/ff/P0XfXXqck3AX/goOTzM4jtK8vadq8TWRSvjLrWCofaRtEZ3x8EPQSuRJO8fMDRGNgwf6GWqQM9iU/I7JEs7whrLpi4FG+qeRHfxP/xv8I0gLUfxGzUyJRdSNI4BMzzknwH9ldsSQuCGlXE2U3Nk+izQIzBjFJ4hUJovmqUNi6C1iyU4apIXf1Jo6ItpHg0ULi4M2fU3+dCt0uxNf6tW8EOysv2F5B4dtc/NpJsBOsySw6z/x5u5vhXfDjInLqVoACvoQFHb/MoS7kuBXp3wfE4AiccR4YogVP83PPlsWXP чектелген эмес, мамлекетти жеке өзү башкарат. Ал эми конституциялык монархияда монархтын бийлиги конституция же мыйзам тарабынан чектелип, көбүнчө ал өкүлчүлүк милдеттерди гана аткарат. Мисалы: Англия королевасы."},{"t":"p","h":"Республикалык башкаруу формасындагы мамлекетте бийлик эл шайлаган бийлик органдары тарабынан жүргүзүлөт. Республикада бийлик бир адам тарабынан эмес, мамлекеттик органдардын тутуму тарабынан жүргүзүлөт. Бийлик мыйзам чыгаруу, аткаруу жана сот бийликтерине бөлүнүүгө жатат, мамлекеттик органдарды түзүүгө эл катышууга тиде <span class=\"pg\" data-n=\"12\">12<\/span>Г глава. Мамлекет, укук жана адеп-ахлак"},{"t":"p","h":"йиш, мыйзам чыгаруучу орган – парламент жана мамлекет башчысы – президент белгиленген мөөнөткө гана шайлануулары керек, ошондой эле жогорку кызмат адамдары кетирген каталары үчүн юридикалык жоопкерчиликке тартылууга жатат."},{"t":"p","h":"Республиканын негизги эки түрү бар: президенттик жана парламенттик. Президенттик республикада мамлекет башчысы – президент – жалпы эл тарабынан шайланып, мамлекетти башкарууда, өкмөттү түзүүдө чечүүчү күчкө ээ. Мындай мамлекеттердин катарына Казакстанды кошсо болот."},{"t":"p","h":"Парламенттик республикада мамлекет башчысы парламент тарабынан шайланып, парламенттин алдында отчёт берет. Мындай мамлекеттин катарына Германия, Әстония ж. б. мамлекеттерди кошсо болот."},{"t":"p","h":"Аралаш – президенттик-парламенттик республикалар дагы бар. Мындай мамлекетте президент менен парламент бири-бирин тен салмактап турат."},{"t":"h3","h":"и КОШУМЧА МАТЕРИАЛ"},{"t":"v","l":["Кыргыз Республикасынын Конституциясы","{Үзүндү)","1-берене."]},{"t":"p","h":"1. Кыргыз Республикасы (Кыргызстан) – эгемендүү, демократияпык, укуктук, мамлекеттик башкарууга дин аралашпаган, унитардык, социалдык мамлекет."},{"t":"p","h":"2. Кыргыз Республикасы өзүнүн аймагында толук мамлекеттик бийликке ээ, ички жана тышкы саясатты өз алдынча жүргүзөт."},{"t":"h3","h":"КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"p","h":"1. Алгачкы уруучулук коомдун езгече кандай белгилери бар?"},{"t":"p","h":"2. Мамлекеттин кандай белгилери бар?"},{"t":"v","l":["3. Мамлекеттин түшүнүгү кандай?","4. Мамлекеттин түзүлүшүнүн кандай формалары бар?"]},{"t":"p","h":"5. Мамлекетти башкаруунун формалары тууралуу эмнени билесиң?"},{"t":"p","h":"<span class=\"pg\" data-n=\"13\">13<\/span>Г глава. Мамлекет, укук жана адеп-ахлак"},{"t":"p","h":"6. Кандай мамлекетти унитардык мамлекет дейбиз?"},{"t":"p","h":"7. Федерациялык мамлекеттердин катарына кайсы мамлекеттер"},{"t":"p","h":"кирет?"},{"t":"p","h":"8. Конфедерациялык формадагы мамлекеттердин өзгөчөлүгү?"},{"t":"p","h":"9. Республикалык башкаруу формасы менен монархиялык баш-"},{"t":"p","h":"каруу формасынын айырмалары?"},{"t":"p","h":"10. Мамлекеттин саясий режими деген эмне?"},{"t":"p","h":"11. Президенттик республика менен парламенттик республиканын"},{"t":"p","h":"кандай айырмасы бар?"},{"t":"p","h":"52. Укук түшүнүгү. Укук жана адеп-ахлак"},{"t":"p","h":"1. Коомдук ченемдер. Ар бир адам өзүнө гана тиешелүү өзгөчөлүктөрү менен айырмаланат. Ошентсе да көпчүлүк мезгилде алар окшош аракеттерди аткарышат: иштешет, эс алышат, үй-бүлө курушат д. у. с. Демек, мындай жүрүм-турумдар жалпыга тиешелүү, кадимки мыйзам ченемдүү аракеттер болуп эсептелет. Ченем – деген түшүнүк үлгү, калып же жүрүш-туруш эрежесин билдирет. Коомдук ченемдер деп адамдар ортосундагы мамилелерди женге сала турган жүрүш-туруш эрежелерин айтабыз. Коомдук ченемдерге жомок, макал-ылакап, санат ырлары, жөрөлгө, адат, элдик салттардан баштап, ар кандай адеп-ахлак ченемдерине чейин кирет. Ушулардын бардыгында адамдардын миндеген жылдар жашоо тажрыйбасынан алынган жүрүш-туруш эрежелери камтылган. Мисалы, баланы бешикке салуу, тушоо кесүү жөрөлгөлөрү, кыз берүү жана кыз узатуу салттары, белгилүү бир жүрүм-турумга багыттаган макал-ылакаптар элибизде көп экендиги белгилүү. Мына ушулар байыртадан баштап, азыркы укук ченемдери менен катар жашап келүүдө. Себеби, бардык эле жүрүм-турум эрежелерин укук алкагына киргизип, мыйзамдаштырып коюу максатка ылайык эмес."},{"t":"p","h":"2. Укук деген эмне. Алгачкы уруучулук коомдо адамдардын мамилеси жалан адат, салт ченемдери менен жөнгө <span class=\"pg\" data-n=\"14\">14<\/span>©, дә И ӨТ Ї глава. Мамлекет, укук жана адеп-ахлак"},{"t":"p","h":"салынып келген. Укук мамлекет пайда болгон мезгилде кошо пайда болгон. Анткени, мамлекет менен адамдардын ортосундагы мамилени мурдатан колдонулуп келе жаткан коомдук ченемдер жөнгө сала албайт эле. Ошондуктан сапат жагынан ейде турган, милдеттүү түрдө аткарылууга тийиш болгон, коомдук мамилени женге салуучу элемент – укук пайда болгон."},{"t":"p","h":"Адам окуйт, эмгектенет. Турмушка зарыл болгон буюмдарды сатып алат, бирөөлөр менен келишимге кирип, иш аткарат, ушул учурларда ал башка адам, ишкана, мекеме же мамлекеттик органдар менен мамиле жасайт. Ушул мамилелердин көпчүлүгү мамлекет тарабынан укуктук ченемдердин жардамы менен жөнгө салынат."},{"t":"p","h":"Бир жагынан, укук мамлекетти башкаруунун негизги куралы, мамлекеттик саясатты ишке ашыруунун каражаты катары кызмат кылса, экинчи жагынан, ал адамдын коомдогу, мамлекеттеги абалынын маанилүү көрсөткүчү, анын мүдөөлөрүн коргоонун куралы болуп саналат. Адамдын, жарандын укуктары, эркиндиктери жана милдеттери инсандын укуктук макамын түзөт жана укуктун негизи болуп эсептелет. Инсандын укуктук макамы мамлекеттеги укук тутумунун өнүккөндүгүн, канчалык деңгээлде демократия бар экендигин баалоодо маанилүү ролду ойнойт."},{"t":"p","h":"Башка коомдук ченемдерден айырмаланып, укук өзүнче белгилеринин бар экендиги менен айырмаланат."},{"t":"p","h":"1) Укук – ченемдерден, б. а. аткарууга милдеттүү болгон жүрүм-турум эрежелеринен турат. Бул болсо укук ченемдеринин мамлекеттин бардык аймагына, калктын бардык катмарына таратыларын шарттайт. Укуктук ченемдердин милдеттүүлүүгү анын кимдир-бирөөгө жагар-жакпастыгына карабастан, бардык адамдардын аткарууга тийиш экендигин билдирет. Ал эми коомдук ченемдер бардыгы үчүн милдеттүү эмес. Мисалы, диний ырым-жырымдар ар кандай динди туткан жарандар үчүн ар башка эмеспи, ошондой эле тушоо кесүү жөрөлгөсүн аткаруу милдет эмес."},{"t":"p","h":"<span class=\"pg\" data-n=\"15\">15<\/span>Г глава. Мамлекет, укун жана адеп-ахлак"},{"t":"p","h":"2) Укук ченемдеринин аткарылышы мамлекет тарайынан камсыз кылынат жана корголот. Ар дайым ала укук ченемдери жарандар тарабынан ыктыярдуу түрдө аткарыла бербейт. Тилекке каршы, кээ бир адамдардын укуктук сезими өнүкпөгөндүгүнүн натыйжасында, укуктук ченемдерди мажбурлоо жолу менен гана аткарылышына жетишүүгө болот. Укук ченемдерин бузгандарга каршы ал бузуунун мүнөзүнө жараша ар кандай жоопкерчиликтер каралган. Мисалы: штраф, камакка алуу, эркиндигинен ажыратуу."},{"t":"p","h":"3) Укук ченемдеринин расмий формасы болууга тийиш, б. а. юридикалык документтерде бекемделиши керек. Мындай документтерди укук булактары дейбиз, аларга мыйзамдар, жарлыктар, токтомдор ж. б. кирет."},{"t":"p","h":"4) Юридикалык ченемдер тактыгы менен айырмаланууга тийиш. Укук ченемдеринин тили так, ачык, кыска болуп, башкача түшүндүрүүгө болбой тургандай жазылууга тийиш."},{"t":"p","h":"5) Укук – бул ченемдердин тутуму, 6. а. укук үй-бүлө мамилелеринен тартып, эл аралык мамилелерге чейин жөнгө салат. Ошондуктан укук көп тармактуу болуп эсептелет. Өз кезегинде биз алардын бардыгына токтолобуз."},{"t":"p","h":"Жыйынтыктап айтканда, укук – бул мыйзам денгээлине көтөрүлгөн, мамлекет тарабынан белгиленген, жалпыга милдеттүү жүрүм-турум эрежелеринин, ченемдеринин тутуму."},{"t":"p","h":"Укуктун сакталышы мамлекеттик органдар, кээ бир учурда жалпы эл тарабынан (референдум) кабыл алынган мыйзам же башка ченемдик актылар тарабынан кепилдикке алынат. Мисалы, жарандардын шайлоо укугу – Шайлоо жөнүндөгү кодекс, билим алуу укугу – Элге билим берүү жөнүндөгү мыйзам, ден соолугун сактоо укугу – Саламаттыкты сактоо жөнүндөгү мыйзам тарабынан жөнгө салынат."},{"t":"p","h":"«Укук» деген сөз турмушта юридикалык мааниден тышкары да пайдаланылат, мындай учурда ал мыйзамдарда көрсөтүлбөгөн жекече мүмкүнчүлүктөрдү билдирет (урмат- <span class=\"pg\" data-n=\"16\">16<\/span>Г глава. Мамлекет, укук жана адеп-ахлак"},{"t":"p","h":"тоого укуктуулук, өз көз карашында турууга укуктуулук ж. у. с.). Мындай укук адат, салт, жөрөлгө, коомдук пикирге таянат."},{"t":"p","h":"Азыркы тапта укук коомдук турмуштун бардык чөйрөсүн кучагына алган. Ал менчик мамилелерин бекемдейт, эмгекти – анын үзүрүн коом мүчөлөрүнүн ортосунда бөлүштүрүүнүн ченемин, формасын жөнгө салат (жарандык укук, эмгек укугу); мамлекеттик механизмди уюштурууну жана анын иш-аракетин жөнгө салат (мамлекеттик укук); өкүм сүрүп жаткан коомдук мамилелерге, мамлекетке, адамдарга зыян келтирүүгө каршы күрөшүүнүн чараларын жана талаш-тартышты чечүүнүн жол жобосун белгилейт (жазык укугу, жазык процесс укугу); адамдардын ортосундагы кептеген түрдөгү мамилелерди тейлейт (үй-бүлө укугу ж. б.); мамлекетибиздин башка мамлекеттер, эл аралык уюмдар менен болгон мамилелерин эл аралык укук жөнгө салат."},{"t":"p","h":"Азыркы тапта биздин мамлекетибиз укуктук мамлекетти курууну алдына максат кылып коюп жатат. Бул эмнени түшүндүрөт? Совет доорунда мамлекет негизинен коммунисттик партиянын жетекчилигинде жашаган. Өлкөнүн калкы дагы, мамлекеттик органдар дагы ошол партиянын чечимдерин аткарууга милдеттүү болгон. Ал гана эмес укук дагы саясатташтырылып, партиянын чечимдерин аткаруунун куралы болуп кызмат кылган. Турмуш мындай абалдын туура эмес экендигин көрсөттү, муну дүйнөлүк практика дагы айкындады. Әлдин турмушунун бакубаттыгы, мамлекеттин бекемдиги укуктун өнүгүшүнө түздөн-түз көз каранды. Качан ага ар бир жаран укук ченемдерин түзүүгө түздөн-түз же өкүлдөрү аркылуу катыша алса, бийлик органдарын түзүүгө же шайлоого катышса жана коомдук мамилелер укук тарабынан гана женго салынса, анда мындай мамлекетти укуктук мамлекет деп айтууга болот."},{"t":"p","h":"Укуктук мамлекет негизинен төмөнкү белгилер менен мүнөздөлөт."},{"t":"p","h":"<span class=\"pg\" data-n=\"17\">17<\/span>Г глава. Мамлекет, укук жана адеп-ахлак -"},{"t":"p","h":"1) Мыйзамдын ар кандай башка нерселерден артыкчылыгы, аны аткаруунун жана колдонуунун милдеттүү экендиги. Укуксуз мамлекетте мамлекеттик органдар укукка үстөмдүк кылат. Ал эми укуктук мамлекетте бийликтин бардык органдары укуктарды белгилеген мыйзамга гана баш иет, ал эми мыйзам болсо жалпы калктын эркин билдирет. Мыйзам боюнча мамлекет алдында адамдар гана жооп бербестен, адамдардын алдында мамлекет да жооп берет."},{"t":"p","h":"2) Жарандардын укуктары менен эркиндиктеринин өнүктүрүлгөн тутуму. Коомдук мамилелер мүмкүн болушунча мыйзамдаштырылып, ал мыйзамдар элге жеткиликтүү жана түшүнүктүү болууга тийиш. Ар бир жаран өз укугун жана милдетин так билип, аларды турмушунда колдонууну жана аткарууну үйрөнүшү керек."},{"t":"p","h":"3) Укукту коргоонун жакшы жолго коюлган механизми. Укуктар кандай жол менен жана ким тарабынан бузулса да, аны коргоого жөндөмдүү, укуктун сакталышын кепилдеген органдар жана алар жетекчиликке алып иштей турган мыйзам актылары болушу керек. Укукту өзүнө тиешелүү орунга көтөрүү үчүн укук коргоочу органдар – милиция, прокуратура, адвокатура ж. б. ишин түп-тамырынан бери өзгөртүшү зарыл. Укукту коргоонун эң башкы кепилдиги – соттор. Ошондуктан, эч кимге көз каранды болбогон сот органдарын түзүү – бүгүнкү күндүн башкы максаты. Ушундай сотко кайрылган укугу бузулган тарап өзүнүн мыйзамдуу талаптарын натыйжалуу коргогонго жөндөмдүү болот."},{"t":"p","h":"3. Укук жана адеп-ахлак. Көп кылымдар бою биргелешип жашоо тажрыйбасынан келип чыккан адат ченемдерине катуу баш ийип, баш кошкон, салтын бекем кармаган элдер гана кырсыктар менен кол салууларга ийгиликтүү каршы туруп, элдүүлүгүн сактап, бекемделгенине тарых күбө. Бул ченемдерди бузгандар коом тарабынан айыпта-"},{"t":"p","h":"Үрп-адаттар, каада-салттар, жөрөлгөлөр, башкача айтканда адеп-ахлак ченемдери адамдардын жүрүм-турумунун эң <span class=\"pg\" data-n=\"18\">18<\/span>Ї глава. Мамлекет, укук жана адеп-ахлак"},{"t":"p","h":"алгачкы эрежелери болгон, аларда боорукерлик, нысаптуулук, адилеттүүлүк, милдет, максат жөнүндөгү адамдардын түшүнүктөрү чагылдырылган."},{"t":"p","h":"Турмуштун улам татаалданышынан улам адамдардын коомдон мамлекеттүүлүккө өтүшү – укуктун пайда болушу менен коштолгон. Мамлекет өзүнүн талаптарын жалпыга милдеттүү ченем катары белгилеп, ал ченемдерди мыйзам түрүндө берген. Адеп-ахлактын жазылбаган ченемдеринен айырмаланып, укук ченемдери баяндоолор аркылуу көрсөтүлгөн. Эгер адеп-ахлак ченемдери ички ынануу жана коом тарабынан көрсөтүлүүчү таасир аркасында аткарылса, ал эми укук ченемдерин аткаруу үчүн мамлекеттин мажбурлоо күчү пайдаланылган жана бул максатта жазалоочу органдар түзүлгөн. Алгачкы мыйзамдарда, оболу адеп-ахлак жана салт ченемдери укук талаптары катары бекемделген."},{"t":"p","h":"Ошентип, адамдардын жүрүм-турумун жөнгө салуучу курал катары укук адеп-ахлактан кийин пайда болгон. Мыйзамдарды кабыл алганда адамдар көбүнчө адат, салттарга таянышкан. Азыркы мезгилде деле адеп-ахлакка каршы келген мыйзамды кабыл алууга жол берилбейт, укук ар дайым адеп-ахлак ченемдерине таянат. Бирок, адеп-ахлакты түзгөн каада-салттар, үрп-адаттар заманына жараша өзгөрүп турат. Бул объективдүү процесс болгондуктан, адеп-ахлак ченемдери өзгөрүлбөстөн, калыбында тургандай сезилет. Жыйынтыктап айтканда, адеп-ахлак – бул адамдардын өз ара жана коомга болгон мамилелериндеги жүрүш-туруш эрежелери менен ченемдеринин жыйындысы."},{"t":"p","h":"Укук келип чыккандан кийин да адеп-ахлак өз маанисин жоготпойт, ал калк катмарынын түпкүрүнөн чыккан жарык сымал адамдардын жүрүм-турумуна таасирин тийгизип, укуктун кандай болушун тастыктап, мезгил өзгөргөн сайын кошо өзгөрүлүп, бирок тарбиялык маанисин эч жоготпой, коомдук сезимди башкарып турат."},{"t":"p","h":"<span class=\"pg\" data-n=\"19\">19<\/span>Ї глава. Мамлекет, укук жана адеп-ахлак"},{"t":"h3","h":"} КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"v","l":["‚ Коомдук ченемдер деп эмнени түшүнөбүз?","‚ Укук кантип пайда болгон?",". Укуктун милдети кандай?","‚ Укук деген эмне?","Укук тейлеген чейрелер жөнүндө эмнени билесиңер?",". Укуктук мамлекет деп кандай мамлекетти айтабыз?","‚ Укуктук мамлекеттин белгилери кайсылар?","‚ Адеп-ахлак ченемдери эмнелерден турат?"]},{"t":"p","h":"‚ Укук менен адеп-ахлак ченемдеринин айырмасы кандай?"},{"t":"p","h":"10. Адеп-ахпак дегенибиз эмне?"}],"sub":[],"section":"МАМЛЕКЕТ, УКУК ЖАНА АДЕП-АХЛАК","pages":[7,19]},{"title":"§ 3. Кыргыз Республикасы түзүлгөнгө чейинки","blocks":[{"t":"h3","h":"§ 3. Кыргыз Республикасы түзүлгөнгө чейинки"},{"t":"p","h":"Кыргыз мамлекеттүүлүгү тууралуу түшүнүк Бириккен улуттар уюмунун Генералдык Ассамблеясынын чечими менен 2008-жыл Кыргыз мамлекеттүүлүгүнүн жылы деп табылган. Бизге белгилүү болгон тарыхый булактар боюнча Кыргыз мамлекети биздин заманга чейинки эле бар болгондугу айкын. Ошол мезгилден бери кыргыз эли улуттуулугун жоготпостон сактап, Азиядагы эң байыркы элдердин катарына кирди, ал түгүл биздин замандын Ї[Х-Х кылымында аймагы Енисейден Теңир-Тоого чейин созулган чоң мамлекетти түзүшкөн. Аны окумуштуулар Улуу Кыргыз дөөлөтүнүн мезгили деп аташат. Ал кездеги Кыргыз мамлекетинин, башкача айтканда Кыргыз кагандыгынын өнүккөн мамлекеттик башкаруу органдары жана мыйзамдары болгондугу, өздөрүнө тиешелүү жазмасы да бар экендиги белгилүү. Ал жазуу азыр Орхон-Енисей жазмасы деген ат менен белгилүү. Ошол мезгилде кыргыз маданияты коншу көчмөн элдердин маданиятынан кескин түрдө айырмаланган жана башка элдер өздөрүн кыргыз деп атоону эңсешкен."},{"t":"p","h":"Азыркы Моңголиядагы Сужин-Даван деген денсееден табылган IX кылымга таандык таш эстеликтеги кыргыз <span class=\"pg\" data-n=\"20\">20<\/span>Г глава. Мамлекет, укук жана адеп-ахлак"},{"t":"p","h":"судьясына арналган эпитафияга көнүл бөлсөк, кыргыз мамлекетинин зор аймакты ээлерин, хандыгы, башкаруучулары, ал түгүл соттору бар экендиги тууралуу маалымат алууга болот. Кийинчерээк ал мамлекет ар кандай себептердин натыйжасында бытыранды болуп бөлүнүп, бир нече майда мамлекетке айланган. Чынгызхан баштаган моңгол-татарлардын чабуулу астында ал мамлекеттер өз алдынчалыгын жоготушкан жана Чыңгызхандын мураскорлору түзгөн мамлекеттердин курамында болуп калышкан. Ал империя жоюлгандан кийин Кыргызстан Кокон хандыгынын курамына багындырылган. 1855-1876-жылдардын аралыгында Кыргызстанды Россия өзүнүн курамына кошуп алган."},{"t":"p","h":"1917-жылдагы Октябрь революциясынан кийин гана жалпы Кыргызстан өзүнчө администрациялык бирдик болуп кошулууга мүмкүнчүлүк алган. 1924-жылдын 14-октябрында Бүткүл Россиялык Борбордук Аткаруу Комитетинин чечими менен РСФСРдин курамында Кара-Кыргыз автономия облусу түзүлгөн. Ушул жыл кыргыздардын өзүнчө мамлекеттүүлүккө жетишкендигинин жылы болуп эсептелип жүрөт. 1927-жылдын 7-мартында Кыргызстанда Советтердин Биринчи уюштуруу съездинде Кыргыз Автономиялуу Социалисттик Республикасын түзүү жөнүндө Декларация кабыл алынып, анын Борбордук Аткаруу Комитети шайланган. Албетте, тарыхта бул окуянын мааниси зор. Кыргызстан республика макамын алып, мамлекеттик органдар уюштурулган, формалдуу түрдө мамлекеттин бардык атрибуттары пайда болгон. Бирок Кыргызстан өз алдынча мамлекет болуп, өз саясатын өзү жүргүзө алган эмес. Кийин, 1986-жылы Россиянын курамынан чыгарылып, Кыргыз ССРи түзүлүп, СССРдин курамындагы республика болуп уюшулганда деле өз алдынчалыкка чыга алган эмес."},{"t":"p","h":"Бирок, формалдуу түрдө мамлекеттүүлүктүн бардык белгилери болгон. Мамлекеттик символдор (туу, герб, гимн), жогорку мыйзам чыгаруу органы – Жогорку Совет, жогорку башкаруу жана тескөөчү органы – Министрлер Совети бар эле. Ал <span class=\"pg\" data-n=\"21\">21<\/span>Г глава. Мамлекет, укук жана адеп-ахлак"},{"t":"p","h":"кездеги мамлекеттик идеология боюнча мамлекеттик бийликтин «саясий ядросу» деп Компартия табылган. Мамлекеттеги бардык иш ошол партиянын, тагыраак айтканда, анын жетекчи органдарынын көрсөтмөлөрү аркылуу жүргүзүлгөн."},{"t":"p","h":"Кыргызстандын эл чарбасын башкаруу үч деңгээлде жүргүзүлгөн, биринчи – республикадагы оор өнөр жай, машина куруу, станок куруу, энергетика, кен иштетүү сыяктуу маанилүү тармактар Союзга гана баш ийип, аларды башкарууда республикалык органдардын эч кандай укуктары жок болгон. Айыл чарбасы, женил енер жай, курулуш сыяктуу тармактар союздук жана республикалык баш ийүүдө болгон, негизинен бул жакта да союздук органдардын таасири чон эле. Респүбликалык баш ийүүгө жергиликтүү өнөр жай, коммуналдык чарба жана турмуш-тиричилик жактан тейлөө тармактары гана берилген."},{"t":"p","h":"Ал эми ички жана тышкы саясат маселелери толугу менен союздук органдардын колунда болгон."},{"t":"p","h":"Кыргыз ССРи башкаруу формасынын түзүлүшү боюнча төмөндөгүдөй органдардан турган. Башында, жалпы эле коом түзүлүшүнүн «саясий ядросу» катары эсептелген Кыргызстан Коммунистик партиясы туруп, андан кийинки катарда жогорку өкүлчүлүк органы Жогорку Совет жана жогорку башкаруу органы Министрлер Совети, сот адилеттигинин органы Жогорку сот, көзөмөлдөөчү орган Прокуратура болгон. Бул аталган органдарга баш ийген облустарда, райондордо түзүмдөрү болгон."},{"t":"p","h":"Кыргыз ССРиндеги укук жалпы Советтик укуктун ажырагыс бөлүгү болуу менен бирге, республикадагы социалисттик системаны бекемдәөчү курал болуп кызмат кылган. Социалисттик укуктун башкы өзгөчөлүгү адамдын, жарандын кызыкчылыгынан коомдун, мамлекеттин кызыкчылыгын жогору коюп, идеологиялык курал катары кызмат кылгандыгы болгон."},{"t":"p","h":"Мисалга, мыйзам тарабынан жекече ишкердикти жүргүзүүгө тыюу салынган, жарандардын менчигинде өндүрүш <span class=\"pg\" data-n=\"22\">22<\/span>© Де» МЕ! [ Г глава. Мамлекет, укук жана адеп-ахлак"},{"t":"p","h":"каражатынын болушуна уруксат берилген эмес. Бир үй-бүлөдө бир үй, бир жеңил автомобиль болушуна гана жол берилген. Менчиктеги мүлккө караганда, коомдук жана мамлекеттик мүлккө каршы жасалган кылмыштар бир кыйла катуу жазаланган."},{"t":"h3","h":"|7 КОШУМЧА МАТЕРИАЛ"},{"t":"p","h":"Сужиндеги «Кыргыздын уулу» жөнүндөгү эстелик 1900-жылы Г. И. Рамстед тарабынан Моңголиянын түштүгүрөөк жагындагы Сужин-Даван деген денсееде табылган эстеликтин окулушу:"},{"t":"p","h":"1) Уйгур жерине Йаглакар хан ата келдим."},{"t":"p","h":"2) Кыргыз уулумун. Мен Бойла, даражалуу жарганмын (судьямын)."},{"t":"p","h":"3) Куттуу бага тархандын буйрук берүүчүсүмүн."},{"t":"p","h":"4) Атак-даңкым (кабарым) күн чыгышка, батышка чейин жетти."},{"t":"p","h":"5) Бай элем. Агылым (короом) он, жылкым сансыз эле."},{"t":"p","h":"6) Иним жети, уулум үч, кызым уч эле. Уулумду үйлөндүрдүм, кызымды калыңсыз бердим. Окутуучума жүз эр, турак-жай бердим."},{"t":"p","h":"7) Жээнимди, неберелеримди көрдүм. Эми өлдүм."},{"t":"p","h":"8) Уулум эр жеткенде окутуучуңдай бол, ханга кызмат кыл, кайраттан. №. КАЙТАЛОО УЧУН СУРООЛОР 1. Кыргыз мамлекеттуулугуне канча жыл болгон?"},{"t":"p","h":"2. Россияга кошулганга чейин кыргыздардын мамлекети болгонбу? З. Кыргызстан Россияга качан кошулган?"},{"t":"v","l":["4. Кара-Кыргыз автономия облусу качан түзүлгөн?","5. Кыргыз АССРи качан түзүлгөн?","6. Кыргыз ССРи качан түзүлгөн?","7. Бул түзүлүштөрдүн айырмасы эмнеде?"]},{"t":"p","h":"8. Кыргыз ССРинин башкаруу формасы түзүлүшү боюнча кайсы"},{"t":"p","h":"органдардан турган?"},{"t":"p","h":"9. Кыргыз ССРинин эл чарбасын башкаруунун өзгөчөлүктөрү кан-"},{"t":"p","h":"дай болгон?"},{"t":"p","h":"10. Кыргыз ССРиндеги укук жөнүндө эмнени билесиң?"},{"t":"p","h":"<span class=\"pg\" data-n=\"23\">23<\/span>Г глава. Мамлекет, укук жана адеп-ахлак"},{"t":"h3","h":"§ 4. Кыргыз улуттук мамлекетинин"},{"t":"p","h":"калыптанышы жана түзүлүшү"},{"t":"p","h":"СССРде 1980-жылдардын орто ченинде кайра куруу процесси башталып, коомду демократиялаштыруу колго алына баштаган. Шайлоо жөнүндөгү мыйзам өзгөртүлүп, эл депутаттыгына талапкерди көргөзүүгө чек коюлбастан, атаандаштардын ичинен тандап депутат шайлоо мүмкүнчүлүгү киргизилген. Мурда болсо талапкерлердин тизмеси Компартиянын Борбордук Комитетинде бекитилип, бир округга бир талапкер гана көрсөтүлүп, ошол депутат болуп шайланып келген."},{"t":"p","h":"Атаандаш талапкерлердин ичинен тандалып шайланган депутаттар СССР эл депутаттардын съездинин 1-жыйынында эле өлкөнүн саясий режиминин пайдубалы бошоң экендигин көрсөттү. Бул процесс кийин республикаларда уланганда дагы тоталитардык саясаттын негизинде түзүлүп, жашап келе жаткан СССР мамлекетинин мындан ары мурдагы абалында жашашы мүмкүн эместигин айкындады."},{"t":"p","h":"Кыргызстанда дагы 1990-жылы Жогорку Советке депутаттарды шайлоо атаандаштык жол менен өтүп, депутат болуп чынында эле эл тандаган талапкерлер шайланышкан. Алар ишинин башталышында эле кыргыз мамлекеттүүлүгүн чындоо боюнча мыйзамдарды кабыл ала башташкан. Атап айтканда, Кыргызстанда Президенттин постун белгилөө боюнча 1990-жылдын 19-октябрында мыйзам кабыл алынган, бул кадам мамлекеттин турмушунда Компартиянын башкы ролду ойноосун жокко чыгарган. Ошондой эле Кыргыз ССРин Кыргыз Республикасы деп атап, анын аталышынан «Советтик Социалисттик» деген сөздөрдү алып таштаган чечимди да кошууга болот."},{"t":"p","h":"Кыргыз Республикасынын Жогорку Совети 1990-жылдын 15-декабрында Кыргыз Республикасынын мамлекеттик көз карандысыздыгы жөнүндөгү декларация кабыл алган. Ал Декларация боюнча Кыргыз Республикасынын мыйзамдары СССРдин мыйзамдарына караганда артыкчылыкка ээ экен- <span class=\"pg\" data-n=\"24\">24<\/span>О Г глава. Мамлекет, укук жана адеп-ахлак"},{"t":"p","h":"диги белгиленип, СССРдин башкаруу органдары келишим түрүндө аныкталган маселелер боюнча гана бийлик жүргүзө ала тургандыгы, бийликти үч бутакка – мыйзам чыгаруу, аткаруу жана сот бийликтерине бөлүнүшүн тастыктап, келечекте биздин мамлекетибиздин түзүлүшүнүн кандай болоруна багыт берген."},{"t":"p","h":"Бул ченемдик документ биздин республикабыздын көз карандысыздыкка жетүүсүнө, өз алдынча мамлекеттүүлүктү курууга карата жасалган алгачкы кадамы экендиги менен тарыхый мааниге ээ."},{"t":"p","h":"Аталган Декларация кабыл алынгандан кийин республиканын көз каранды эместигин бекемдөөгө багытталган мыйзам актылары кабыл алына баштаган."},{"t":"p","h":"1991-жылдын 81-августунда Кыргыз Республикасынын Жогорку Совети Кыргыз Республикасынын көз карандысыздыгы жөнүндө Декларацияны кабыл алган. Бул акт боюнча Кыргыз Республикасынын СССРдин курамынан чыккандыгын жана Өз алдынча, эч кандай башка мамлекетке көз каранды эмес мамлекет болгондугун жарыялаган. Биздин мамлекетибиздин эгемендүүлүгүн башка өлкөлөр тааный баштаган. Азыркы мезгилде Кыргыз Республикасынын эгемендүүлүгүн дүйнөнүн жүздөн ашуун мамлекети тааныды. Кыргыз Республикасы Бириккен Улуттар Уюмунун мүчөсү. Демократиялык мамлекет катары дүйнөлүк коомчулукта абройго ээ."},{"t":"h3","h":"| КОШУМЧА МАТЕРИАЛ"},{"t":"p","h":"Кыргызстан Республикасынын мамлекеттик"},{"t":"p","h":"көз карандысыздыгы жөнүндө"},{"t":"p","h":"Кыргызстан Республикасынын Жогорку Советинин 1991-жылдын 31-августундагы токтому менен кабыл алынган"},{"t":"p","h":"Кыргызстан Республикасынын Жогорку Совети 1990-жылдын 15- декабрында кабыл алган «Кыргызстан Республикасынын мамлекет- <span class=\"pg\" data-n=\"25\">25<\/span>Г глава. Мамлекет, укук жана адеп-ахлак"},{"t":"p","h":"тик суверенитети тууралуу» декпарацияга ылайык жана Кыргызстан Республикасынын Конституциясын {Негизги законун) эске алып:"},{"t":"p","h":"1. Кыргызстан Республикасын көз карандысыз, суверендүү демократиялык мамлекет деп жарыялайт."},{"t":"p","h":"2. Кыргызстан Республикасынын аймагы бүтүн жана бөлүнгүс, анда Кыргызстан Республикасынын Конституциясы аракетте болот."},{"t":"p","h":"3. Кыргызстан Республикасы эл арапык укуктун жалпы таанылган принциптерин колдорун баса керсетет, элдердин ортосундагы достук жана кызматташуу принциптерин жетекчиликке алат, эл аралык, улуттар аралык мамилелерде конфронтацияга жол бербестен, өзү кабыл алган милдеттенмелерди кыйшаюусуз сактайт жана суверендүү мамлекеттердин жаңы союздук келишимин тең негизде түзүлүшүн жактайт."},{"t":"p","h":"4. Союздук республикалардын жана дүйнө өлкөлөрүнүн парламенттерин Кыргызстан Республикасынын көз карандысыздыгын таанууга чакырат."},{"t":"p","h":"5. Кыргызстан Республикасынын Президентине жана Кыргызстан Республикасынын Жогорку Совет ыккан долбоор Кыргыз Республикасынын Жогорку Кеңеши тарабынан чоң талкуудан өтүп, Кыргыз Республикасынын Конституциясы 1998-жылдын 5-майында кабыл алынган. Бул күн кыргыз эли үчүн майрам күн болуп калды."},{"t":"p","h":"Андан бери Кыргыз Республикасынын Конституциясы бир нече жолу өзгөртүүлөргө туш болду. Ал өзгөртүүлөр референдум аркылуу жүргүзүлүп, бийлик башында турган Президенттин жеке бийлигин чындоого багытталып, өлкөдө тоталитардык мүнөздөгү коррупциялык режимдин орношуна алып келди. Жыйынтыгында, эл көтөрүлүп, алгач Акаев режими, кийин Бакиев режими, тилекке каршы, кан төгүлүү менен кулады. Убактылуу өкмөттүн Декрети менен Конституцияҥын долбоорун иштеп чыгуу үчүн Конституциялык кенешме түзүлүп, анан алар иштеп чыккан Конституциянын жаңы редакциясы жалпы элдик талкууга коюлду. Андан сон, бүткүл элдик добуш берүү аркылуу 2010-жылдын 27-июнунда Кыргыз Республикасынын Конституциясы кабыл алынды."},{"t":"p","h":"Бул жаны Конституциянын негизги өзгөчөлүгү Кыргыз мамлекетинин президенттик республикадан парламенттик республикага өтүшүндө."},{"t":"p","h":"<span class=\"pg\" data-n=\"28\">28<\/span>* Ө"},{"t":"p","h":"үү, түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"Баш мыйзам катары Конституция өзүнө негизги, туруктуу жана принципиалдуу жоболорду камтыгандыгы менен башка мыйзамдардан айырмаланат. Ошондуктан, маанилүү болсо да бир катар эрежелер баш мыйзамдын алкагына сыйбагандыктан, Конституцияга кирбейт. Конституцияда берилген жоболордун негизинде, аны өнүктүрүү үчүн башка мыйзамдар иштелип чыгат жана ага ылайык келип, карама-каршы болбоого тийиш. Конституциянын өзүндөгү жоболор түздөн-түз колдонулат, ага карама-каршы келген башка ченемдик актылар колдонулбоого тийиш."},{"t":"p","h":"Жыйынтыктаганда, Конституция – бул мамлекеттин түзүлүшүн, адамдардын, жарандардын негизги укуктарын жана эркиндиктерин бекиткен жана жогорку юридикалык күчкө ээ болгон укуктук документ болуп эсептелет."},{"t":"p","h":"Кыргыз Республикасынын Конституциясы тогуз бөлүмдөн жана 114 беренеден турат."},{"t":"p","h":"Биринчи бол умдо республиканын конституциялык түзүлүшүнүн негиздери, коомдук, саясий жана экономикалык тутумунун жалпы принциптери чагылдырылган."},{"t":"p","h":"Экинчи бөлүмдө адамдын жана жарандын укуктары менен эркиндиктери, Кыргыз Республикасындагы жарандык тууралуу түшүнүк берилип, адам укуктары менен эркиндиги, жарандын укуктары менен милдеттери жөнүндөгү жоболор камтылган."},{"t":"p","h":"Үчүнчү бөлүмдө республиканын Президенти тууралуу жоболор бекитилип, Президенттикке талапкерге коюла турган талаптар, Президентти шайлоонун тартиби жана Президенттин ыйгарым укуктары иштелип чыккан."},{"t":"p","h":"Төртүнчү бөл үм Кыргыз Республикасынын Жогорку Кенешине арналган. Бул бөлүмдө Жогорку Кеңештин бийлик укуктары аныкталган. Ошондой эле парламенттин иштөө принциптери жана андагы депутаттардын саны белгиленген. Мындан тышкары бул бөлүмдө мыйзам чыгаруу ишинин тартиби аныкталган."},{"t":"p","h":"<span class=\"pg\" data-n=\"29\">29<\/span>те, те түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"Бешинчи болумдо аткаруу бийлигине кайсы органдардын кире тургандыгы, алардын түзүлүшү, жетекчилеринин дайындалыш тартиби жана бийлик-укуктары, жергиликтүү мамлекеттик администрациялар тууралуу жоболор берилген."},{"t":"p","h":"Алтынчы бөлүм сот бийлигине арналган, анда Кыргыз Республикасынын сот тутуму, судьялардын шайлануу жана дайындалуу тартиби, соттордун жогорку органдарынын бийлик укуктары көрсөтүлгөн."},{"t":"p","h":"Жетинчи бөлүмдө Кыргыз Республикасынын мамлекеттик бийлигинин борбордук органдары болуп эсептелген Прокуратура, Улуттук банк, Шайлоо жана референдум өткөрүү боюнча борбордук комиссия, Әсептөө палатасы, Акыйкатчы (Омбудсмен) тууралуу жоболор берилген."},{"t":"p","h":"Сегизинчи бөлүм жергиликтүү өз алдынча башкаруу органдары тууралуу жоболорду камтыйт."},{"t":"p","h":"Конституциянын туруктуулугун сактоо максатында, ага толуктоо жана өзгөртүү киргизүү тартиби иштелип чыккан. Конституция мамлекеттин башкы мыйзамы болуп эсептелгендиктен жана башка мыйзамдар ага негизделип иштелип чыгып, кабыл алынгандыктан, анын туруктуулугу Өзгөчө мааниге ээ. Ошондуктан, Конституциянын тогузунчу бөлүмүнө ылайык Конституцияга өзгөртүүлөрдү киргизүү жөнүндө мыйзам Жогорку Кенеш тарабынан дайындалган референдум менен кабыл алынышы мүмкүн. Ошондой эле, Конституцияга өзгөртүүлөрдү жана толуктоолорду киргизүү жөнүндөгү мыйзам Жогорку Кенештин депутаттарынын жалпы санынын көпчүлүгүнүн сунушу боюнча, же болбосо 300 минден кем эмес шайлоочулардын демилгеси боюнча Жогорку Кеңеш тарабынан кабыл алынышы мүмкүн."},{"t":"p","h":"Бул чектөөлөрдүн бардыгы Конституцияны каалаган мезгилде эле өзгөртө бербестен, терең ойлонуу, ар тараптан талдоо менен өтә керек учурда гана өзгөртүүлөрдү киргизүү үчүн жасалган."},{"t":"p","h":"<span class=\"pg\" data-n=\"30\">30<\/span>ЭД Н глава. Кыргыз Республикасынын мамлекеттик ү түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"М3 Кыргыз Республикасынын жаңы Конституциясын КОШУМЧА МАТЕРИАЛ"},{"t":"p","h":"кабыл алуу боюнча референдум (бүткүл элдик добуш берүү)"},{"t":"p","h":"жөнүндө Кыргыз Республикасынын Убактылуу өкмөтүнүн декрети 19-май, 2010-жыл, Ме 40 (Үзүндү)"},{"t":"p","h":"2010-жылдын 7-апрелинде элдик революция өз элине каршы болгон президенттин режимин кулатты. Элкеде нукура демократиялык тартипти орнотуу үчүн сейрек кездешүүчү мүмкүнчүлүк пайда болду."},{"t":"p","h":"Өлкөдө коомдук-саясий жана экономикалык кырдаалды турукташтыруу жана демократияны андан ары өнүктүрүү үчүн шарттарды түзүүгө мүмкүнчүлүк берген жаңы Конституцияны кабыл алуу зарылдыгы келип чыкты."},{"t":"p","h":"Кыргыз Республикасынын Убактылуу Экмету салтка айланган мампекеттик өзүмчүл бийликтин кайра жаралбашына жаңы Конституция мүмкүнчүлүк түзөрүнө терең ишенет."},{"t":"p","h":"Мамлекеттик бийликтин бирден бир булагы жана эгемендүүлүктү алып жүрүүчү болуп саналган Кыргызстандын элинин эркин билдирүү максатында 2010-жылдын 7-апрелиндеги Ме 1 Декретин жетекчиликке алуу менен Кыргыз Республикасынын Убактылуу екме й эле Жогорку Кеңеш жалпы эл тарабынан, жашыруун жана тикелей добуш берүү аркылуу шайланышат."},{"t":"p","h":"Кыргыз Республикасынын демократиялык экендигин корсеткен белгинин бири – бул бийликтерди бөлүү принциптерине негизделген мамлекет экендиги. Бул принцип Кыргыз Республикасынын Конституциясынын 8-беренесинде бекитилген. Мыйзам чыгаруу, аткаруу жана сот бийликтери – бул өз алдынча үч бийлик, андан тышкары бул бийликтерге кирбеген Прокуратура, Улуттук банк, Борбордук шайлоо комиссиясы, Әсептөө палатасы, Акыйкатчы сыяктуу борбордук башка органдар дагы бар. Ар бир бийлик өзүнө тиешелүү компетенцияга ээ жана бири-биринин ишине кийлигишпөөлөрү тийиш. Бийликти мындай бөлүштүрүүнүн максаты кайсы бир органдын бүт бийликти ээлеп алуусуна жол бербее, бийликтер бири-бирин көзөмөлдөп, тең салмактуулук абалды сактап туруусун жана бийлик өкүлдөрүнүн профессионалдуулугун жогорулатуу болуп саналат."},{"t":"p","h":"3. Кыргыз Республикасы – мамлекеттик башкарууга дин аралашпаган өлкө. Дүйнөдө мамлекеттик идеологиясы динге негизделген өлкөлөр бар, атап айтканда – Иран Ислам Республикасы, ошондой эле Ватикан мамлекети. Аларда коомтүзүлүшү <span class=\"pg\" data-n=\"33\">33<\/span>жана мамлекеттик башкаруу"},{"t":"p","h":"дук жана мамлекеттик турмуш шариятка, динге негизделип, андан тышкары ой-пикирлерди айтууга жана башкача жашоого тыюу салынган. Мазмуну боюнча андай мамлекеттердеги режимди тоталитардык режим деп атасак да жанылышпайбыз."},{"t":"p","h":"Биздин мамлекет коммунистик идеологияны туу кылган тоталитардык режимдүү мамлекеттин алкагынан чыгып, эркин өлкөнү курууну максат кылып койгондуктан, мындан ары динге негизделген режимди курууга жол бербөө үчүн, Конституциябызда бул жобо атайын белгиленген. Аталган жобону бекемдөө үчүн Конституциянын 7-беренесинде Кыргыз Республикасында эч бир дин мамлекеттик же милдеттүү болуп таанылышы мүмкүн эместиги жана дин жана бардык диний жерелгелер мамлекеттен ажыратылгандыгы айтылган, диний негиздеги саясий партияларды түзүүгө жол берилбестиги, диний уюмдардын саясий максаттарды жана милдеттерди көздөшүнө, диний уюмдардын жана дин кызматындагылардын мамлекеттик органдардын ишине кийлигишүүсүнө жол берилбей тургандыгы бекемделген."},{"t":"p","h":"Ошону менен бирге адамдарга туткан динине, диний ишенимине карап ыдык көрсөтүүгө, укугунун жана эркиндигинин кысымга алынышына тыюу салынып, каалаган динди тутууга эркиндик берилген."},{"t":"p","h":"4. Кыргыз Республикасы – укуктук мамлекет. Конституцияда бул жобо так кесе орун алган факт катары айтылса да, азырынча биз мындай мамлекетти куруунун үстүндө гана иштөөдөбүз. Укуктук мамлекетти, коомду башкарууда укукту пайдаланган мамлекет деп гана түшүнбөө керек. Бардык эле мамлекеттерде мыйзамдар бар, укукту колдонушат, бирок биз анча көп эмес мамлекеттерди гана укуктук деп айта алабыз. Укуктук мамлекет болуп өнөр жайы өнүккөн мамлекеттердин кээ бирлери атала алышат (Мисалы: АКШ, Германия, Англия, Франция ж. б.)."},{"t":"p","h":"Азыркы таптагы жүргүзүлүп жаткан укуктук реформалар Кыргызстанда демократиянын укуктук негиздерин, эркин <span class=\"pg\" data-n=\"34\">34<\/span>түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"экономиканы түзүүгө жана түпкүлүгүндө укуктук мамлекетти зан багытталып жатат. Укуктук мамлекеттин башкы өзгөчөлүктөрү болуп, биринчиден, адамдардын жалпыга таа-__- нымал укуктарын жана эркиндиктерин мыйзам аркылуу бекемдөө, экинчиден мамлекетти башкарууда жарандардын түздөн-түз жана өздөрү шайлаган өкүлдөрү аркылуу катышуусун камсыз кылуу, үчүнчүдөн, мамлекеттин жана коомдун турмушунда мыйзамга артыкчылык берүү, төртүнчүдөн, коомдук мамилелерди жөнгө салуу жагдайында соттордун ролун 'жогорулатуу болуп саналат."},{"t":"p","h":"5. Кыргыз Республикасы – унитардык республика. Кыргыз Республикасы унитардык, б. а. биримдиктүү мамлекет болуп саналат, курамында өзүнчө автономияга ээ болгон түзүлүш жок. Республика администрациялык-аймактык бирдиктерге гана бөлүнөт, атап айтканда, Кыргыз Республикасы азыркы тапта жети облустан жана борбор шаарыбыз Бишкектен турат, өз кезегинде облустар райондорго жана райондор айылдарга бөлүнөт. Мындан тышкары, республикага баш ийгең шаарлар, облустарга жана райондорго баш ийген шаарлар б} р. Бул администрациялык-аймактык бирдиктер өзүнчө кандайдыр бир эгемендүүлүккө ээ эмес. Бирок, мыйзамдын чегинде, жергиликтүү өз алдынча башкаруу органдары аркылуу өзүлөрү үчүн маанилүү`маселелерди чече ала тургандыгы менен СССР мезгилиндеги облустардан, шаарлардан, айы ‚дардан кескин түрдө айырмаланат. Азыр бул жергитр бирдиктерде бийлик экиге бөлүнгөн: жергиликтүү мам- лекеттик администрация – бул мамлекеттик маанидеги маселелерди жер-жерлерде тейлейт, ал эми жергиликтүү өз алдынча башкаруу органдары болсо жер-жерлерде мамлекетке көз каранды болбостон, бюджетин өз алдынча түзүп, экономикалык өнүгүүнү алып баруу мүмкүнчүлүгүнө ээ."},{"t":"p","h":"Мурда айылдын, райондун, облустун өзүнчө бюджети болгон эмес, бардыгы мамлекеттик бюджет деп аталып, каражаттар жогорку жактан бөлүнүп турган."},{"t":"p","h":"<span class=\"pg\" data-n=\"35\">35<\/span>түзүлүшү жана мамлекеттик башкаруу 5 7"},{"t":"p","h":"6, Кыргыз Республикасы – социалдык мамлекет. Ар бир"},{"t":"p","h":"з жараны улгайганда, ооруп калганда жана эмгекке"},{"t":"img","src":"data:image/webp;base64,UklGRpoQAABXRUJQVlA4II4QAAAwSgCdASp9AKYAPrVQn0wnJKKiKdOdWOAWiWcA06O5byp/eeE/4/9H/n/zJ/u/uN57+xXUa+Xfez9N/d/x895fCH4vf1/qF/lP83/1H9r4fcAn6H/Z/HW+Z87fsV/0PcC/XD/rcljQK/U3qtf5/mZ/Qv9n7DP6/rv8Clqi+L6V4Wb1fb5mrUt7l+/z5FVa70+r5EemGnTibjEqJMRc/axrMq+8IvCh8W9eT0MPdKnGne/Rls9y9hNM+W+hQGvNV4z0moetA+cwXobZLQT8v1sqvvQd2ayy9mOY070qTJlcQP7XkELQ1v2TvpJufdOkRo9XuLerlWbWnh2JkM8MBFgIaXLRxPCQjpXUy7jmAmiWwdk1MbjfyNtG6o+lQGArazX+OqmMF9jtWBSdyfeDbiRQJYdUe4etseEeAP5+g4uZ5rPHDWCMJx5pZZ0TW/cjxAw05pSbGTWQ5f9lL3rhurlGEWbGxiFqqcTU1/D8ArMtcgn8yMzJmcKFl8/ljp3M1scKqJhWzMsxmqPjo0CEZviLCM3sidasb+nrBeg69+oXB6vqO6GuJJk9pD1CQwCJP9+N5KBtrH8FPxdFFDk+a6+0uOzAa4enLZ16QxVnZBhDqRDIAqXbscaKnepMRK59xDgU92nVxnj+S2LeuQKjYGsW+uF9WPDBDdrED2Paj+vgTc43rWLXQHQJMnnpvUYEMlrFAsvphVHg9Oq/2DK9 ыз мамлекетинин эгемендүүлүгүн кандай түшүнөсүң?"},{"t":"p","h":"2. Кыргыз Республикасынын унитардык (биримдиктүү) республика"},{"t":"p","h":"экендигинин белгилери кандай?"},{"t":"p","h":"З. Кыргыз мамлекети демократиялык мамлекет экендигин кайсы"},{"t":"p","h":"шарттар ырастайт?"},{"t":"p","h":"4. Укуктук мамлекет деген эмне?"},{"t":"p","h":"5. Кыргыз мамлекетинин динге болгон көз карашы кандай? `6. Социалдык мамлекетти кандай түшүнөсүң?"},{"t":"p","h":"<span class=\"pg\" data-n=\"36\">36<\/span>© И түзүлүшү жана мамлекеттик башкаруу"}],"sub":[],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК ТҮЗҮЛҮШҮ ЖАНА МАМЛЕКЕТТИК БАШКАРУУ","pages":[32,36]},{"title":"$ \". Кыргыз Республикасында адам","blocks":[{"t":"h3","h":"$ \". Кыргыз Республикасында адам"},{"t":"p","h":"укуктары жана эркиндиктери"},{"t":"p","h":"Дүйнөлүк экинчи согуш аяктагандан кийин дүйнө элдери Бириккен Улуттар Уюмун (БУУ) түзүшкөн, анын башкы максаты – эл аралык тынчтыкты жана коопсуздукту коргоо жана чындоо, мамлекеттер ортосундагы кызматташууну өнүктүрүү болуп эсептелет. Бир нече өлкөлөрдө эле адам укуктары одоно түрдө бузулса, бүткүл дүйнө кандуу согушка тартылып калышы мүмкүн экендигин фашизмдин мисалы ачыкайкын көрсөттү. Ал эми жер жүзүндөгү тынчтык кырдаал айрым өлкөлөрдө адам укуктарын чындоого кыйла көмөк көрсөтөт."},{"t":"p","h":"1948-жылдын 10-декабрында БУУнун Генералдык Ассамблеясы Адам укуктарынын жалпы декларациясын кабыл алган. Бул документте дүйнөдө биринчи жолу адамдын негизги укуктары менен эркиндиктери жарыяланып, алар бүткүл дүйнөдөгү улуттук юридикалык документтер үчүн үлгү катары бааланган."},{"t":"p","h":"Кыргыз Республикасы өз алдынча мамлекет болуп, БУУга мүчө болуп кабыл алынгандан кийин, БУУда кабыл алынган документтерди колдой тургандыгын билдирип, алардын негизги жоболорун Конституциябызда жана башка мыйзам актыларында чагылдырып келе жатабыз."},{"t":"p","h":"Мындай иштин бири – Кыргыз Республикасынын Конституциясына «Адамдын, жарандын укуктары жана эркиндиктери» деген бөлүм киргизилип, адамдын укуктарынын мыйзам түрүндө бекемделиши болуп эсептелет."},{"t":"p","h":"Адам укугунун жана эркиндигинин негизги жоболору Кыргыз Республикасынын Конституциясынын 16—80-беренелеринде берилген жана бул жоболор башка мыйзамдарда кенейтилип, аткарылышы камсыз кылынат. Конституцияда адамдын кадыр-баркы ыйык жана кол тийгис деп жарыяланган. Ар бир адамдын негизги укугу жана эркиндиги өзү төрөлгөндө эле кошо жаралып, мыйзам тарабынан, сот артүзүлүшү <span class=\"pg\" data-n=\"37\">37<\/span>жана мамлекеттик башкаруу"},{"t":"p","h":"кылуу корголо тургандыгы белгиленген. Кыргыз Республикасында бардык адамдар мыйзам жана сот алдында алардын тегине, улутуна, жынысына, расасына, тилине, туткан динине, саясий жана диний ишенимдерине карабастан, бирдей коргоого алына тургандыгы жана ар бир адамдын эн жөнөкөй укуктары: жашоого, денесине жана ар-намысына эч кимдин тийбестигине, жеке эркиндигине жана коопсуздугуна, керт башынын эркин өсүүсүнө, сөз эркиндигине, Кыргызстандын каалаган жеринде жашоого, же тышкары жерге эркин чыгып кетүүгө, топторго биригүүгө, турак жайынын кол тийгистигинё, кат алышуу, башка жолдор менен кабарлашуусунун жашырындуулугуна, менчик күтүүгө жана аны каалагандай пайдаланууга, ишкердик кылууга, эмгектенүүгө, каалаган кесибин тандап алууга болгон укуктуулугу керсетүлгөн."},{"t":"p","h":"Бул укуктар жөн гана жазылып калбастан, Конституция жана ага ылайык кабыл алына турган мыйзамдар аркылуу алардын аткарылышы камсыз кылынат. Конституциянын 17- беренесинде түздөн-түз ушул айтылган укуктар менен эркиндиктерди жокко чыгаруу же алардын маанисин кемсинтүүчү мыйзамдар чыгарылууга, конституциялык укук жана эркиндик бузулууга тийиш эмес экендиги көрсөтүлгөн."},{"t":"p","h":"Адамдын дене-боюнун, ар-намысынын кол тийгистигин чектөөгө – жасалган кылмыш үчүн мыйзам негизинде жана жаза түрүндө соттун өкүмү боюнча гана жол берилет. Мисалы„адам жасаган оор кылмышы үчүн өмүр бою же ар кандай мөөнөткө эркинен ажыратылууга кириптер кылынышы мүмкүн. Бирбку„кандай гана кырдаал болбосун, бир да киши кыйноого же аде иликке сыйбаган мазактоочу жазага дуушар кылынышы мүмкүн эмес. Ошондой эле, адамдын өзүнүн тиешелүү түрдө ырасталган макулдугу болмоюнча аны медициналык, биологиялык, психологиялык тажрыйба сынагына салууга тыюу салынган."},{"t":"p","h":"Биздин мурунку мамлекетибиздин тарыхында адам укуктарынын кандай тепселгенин билебиз. ХА кылымдын 1930- <span class=\"pg\" data-n=\"38\">38<\/span>о Ж."},{"t":"p","h":"тузулушу жана мамлекеттик башкаруу"},{"t":"p","h":"жылдарындагы репрессиялар, соттун өкүмү жок туруп эле адамдарды эл душманы деп жарыялап, атып, анан аларды жашыруун көмүп койгон фактылар «Ата-Бейит» көрүстөнүнө коюлган инсандардын сөөктөрү табылганда белгилүү болбодубу. Мындан ары буга окшогон иштер жасалбас үчүн Конституция тийиштүү кепилдик бере алат. Алсак, мыйзамга негизделбей эч ким камакка алынып, кармалууга тийиш эмес. Соттун өкүмү чыгарылганга чейин кылмыш үчүн жоопкерчиликти адамга тануулоого багытталган ар кандай аракеттерге жол берилбейт жана мындай аракеттер жабыр тарткан адамга келтирилген материалдык жана моралдык зыяндын ордун сот аркылуу толтуруп алуусуна негиз болуп саналат. Кыргыз Республикасында өлүм жазасы алынып ташталган. Биздин мурдагы мыйзамдар боюнча экономикалык кылмыш жасаган адамдар да өлүм жазасына тартылышы мүмкүн болчу."},{"t":"p","h":"Биз жашап келген социалисттик коомдо адамдардын менчик укугу катуу кысымга алынганы маалым. Адамдардын менчигинде өндүрүш каражаттары, бирден ашык үй, машина алуусуна тыюу салынган. Ал эмес, үйдүн ички аянты да 60 м: ден ашууга тийиш эмес эле. Ушу сыяктуу чаралар адамдардын алдыга умтулуусун, кызыгуусун чектеп, коом тиешелүү түрдө өнүкпөй, мамлекеттин өнүгүшүнүн дымып, токтоп калышына алып келген. Ошондуктан Конституциянын 30—42-беренелеринде ар бир адамга өз мүлкүнө, өз ишмердигинин натыйжаларына жана тескөө укугуна ээ болууга жана мыйзамда тыюу салынбаган экономикалык ишмердүүлүгүн жүргүзүп алууга жол берилген."},{"t":"p","h":"Менчик – кол тийгис д

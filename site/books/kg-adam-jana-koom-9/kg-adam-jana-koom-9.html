биз жогоруда айтып кеткен укуктар жана эркиндиктер Кыргыз Республикасында жашаган жана убактылуу жашаган жалпы адамдарга тиешелүү."},{"t":"p","h":"Конституцияда Кыргыз Республикасынын жарандарына тиешелүү укуктар жана милдеттер кенейтилип берилген, аны кийинчерээк окуп, үйрөнөбүз."},{"t":"h3","h":"КОШУМЧА МАТЕРИАЛ"},{"t":"v","l":["Кыргыз Республикасынын Конституциясы","(Үзүндү)","","45-берене","1. Ар ким билим алууга укуктуу."]},{"t":"p","h":"2. Негизги жалпы билим алуу милдеттүү. Ар ким мамлекеттик би-"},{"t":"p","h":"пим берүү уюмдарында негизги жалпы жана орто жалпы билимди акысыз алууга укуктуу."},{"t":"p","h":"3. Мамлекет мектепке чейинки билим берүүдөн баштап негизги"},{"t":"p","h":"жалпы билим берүү мекемелерине чейин ар бир жарандын мамлекеттик, расмий жана бир эл аралык тилди окутупүйрөнүүсү үчүн шарт түзөт."},{"t":"p","h":"4. Мампекет мамлекеттик, муниципалдык жана менчик окуу жай-"},{"t":"p","h":"парын өнүктүрүү үчүн шарт түзөт."},{"t":"p","h":"5. Мамлекет дене тарбия жана спортту өнүктүрүү үчүн шарт түзөт."},{"t":"h3","h":"КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"p","h":"1. Адамдын укуктарынын жалпы декларациясы качан кабыл алын-"},{"t":"p","h":"ган жана анын мааниси эмнеде?"},{"t":"p","h":"2. Адамдын укуктары жана эркиндиктери кайсы мыйзам актыла-"},{"t":"p","h":"рында карапган?"},{"t":"p","h":"3. Адамдын негизги укуктары качан пайда болот?"},{"t":"p","h":"4. Кыргыз Республикасында адамдын укуктары бардык адамдар"},{"t":"p","h":"үчүн бирдейби?"},{"t":"p","h":"5. Кыргыз Республикасынын Конституциясына ылайык адамдын"},{"t":"p","h":"кандай укуктары бар?"},{"t":"p","h":"<span class=\"pg\" data-n=\"40\">40<\/span>©. Де } түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"6. Кыргыз Республикасында адамдын укуктарын жана эркиндик-"},{"t":"p","h":"терин жокко чыгаруучу же кемсинтуучу мыйзамдарды чыгарууга болобу?"},{"t":"p","h":"7. Адамдын денесине, ар-намысына эч кимдин тийбестигине ка-"},{"t":"p","h":"рата жасалган чектеелерге кайсы убакта жол берилиши мүмкүн?"},{"t":"p","h":"8. Адам кайсы учурда камалышы мүмкүн?"},{"t":"p","h":"9. Менчик укугунун мурунку абалы жана азыркы абалы жөнүндө"},{"t":"p","h":"эмнени билесиң?"}],"sub":[],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК ТҮЗҮЛҮШҮ ЖАНА МАМЛЕКЕТТИК БАШКАРУУ","pages":[37,40]},{"title":"у 8. Кыргыз Республикасындагы мамлекеттик","blocks":[{"t":"h3","h":"у 8. Кыргыз Республикасындагы мамлекеттик"},{"t":"p","h":"бийлик. Бийликти бөлүүнүн принциптери"},{"t":"p","h":"Кыргыз Республикасынын Конституциясынын 1-беренесинин 3—4-пункттарында Кыргыз Республикасынын эли— эгемендиктин ээси жана Кыргыз Республикасындагы мамлекеттик бийликтин бирден-бир туткасы, эл өз бийлигин түздөн-түз, ошондой эле мамлекеттик органдар аркылуу Кыргыз Республикасынын Конституциясынын жана мыйзамдарынын негизинде жүргүзөт деп көрсөтүлгөн. Әлдин мамлекеттик бийликти түздөн-түз жүргүзүшүнүн үч негизги формасы бар:"},{"t":"p","h":"1. Жалпы эл тарабынан Кыргыз Республикасынын Жогорку Кеңешинин шайланышы."},{"t":"p","h":"2. Жалпы эл тарабынан Кыргыз Республикасынын Президентинин шайланышы."},{"t":"p","h":"3. Кыргыз Республикасынын Конституциясына, Кыргыз Республикасынын мыйзамдарына өзгөртүүлөрдү жана толуктоолорду киргизүү жана мамлекеттик турмуштун башка маанилүү маселелери референдумга (жалпы элдик добуш берүүгө) коюлуп, чечилүү мүмкүндүгү."},{"t":"p","h":"Кыргыз Республикасында мамлекеттик бийлик төмөнкү принциптерге негизделип жүргүзүлөт:"},{"t":"p","h":"1. Бүткүл эл тарабынан шайланган Жогорку Кеңеш жана Президент өкүл болгон жана камсыз кылган элдик бийликт <span class=\"pg\" data-n=\"41\">41<\/span>@ тузулушу жана мамлекеттик башкаруу"},{"t":"p","h":"тин үстөмдүгүнө. Конституциянын талабына ылайык мамлекеттик бийликтин бирден бир туткасы эл болуп эсептелет. Өзүнүн ушул эн башкы укугун ишке ашыруу үчүн жалпы эл Парламентти жана мамлекет башчысы – Президентти туздентүз шайлашат. Биздин өлкөбүз парламенттик республика болгондугуна байланыштуу жогорку бийлик Парламент тарабынан жүзөгө ашырылат. Парламент өкмөттү түзөт, алардын ишине көзөмөлдүк кылат."},{"t":"p","h":"Президент Кыргыз Республикасынын мамлекет башчысы болуп саналат, элдин жана мамлекеттик бийликтин биримдигин көрсөтүп турат. Өз бийлигинин негизинде башка мамлекеттик бийлик бутактарына Конституцияда жана башка мыйзамдарда аныкталган өлчөмдө таасир этет."},{"t":"p","h":"2. Мамлекеттик биилик мыйзам чыгаруу, аткаруу жана сот бутактарына бөлүнөт кана алар макулдашып иш аткаруулары, биргелешип аракеттенүүлөрү тийиш. Мыйзам чыгаруу бийлигинин өкүлү болуп Кыргыз Республикасынын Жогорку Кенеши эсептелет. Жогорку Кеңештин негизги милдеттери – Өкмөттүн курамын түзүүдөн тышкары, мыйзам чыгаруу, бюджетти кароо жана бекитүү, Конституция тарабынан берилген башка ыйгарым укуктарды жүзөгө ашыруу."},{"t":"p","h":"Аткаруу бийлигине Кыргыз Республикасынын Өкмөтү жана ага баш ийген министрликтер, мамлекеттик комитеттер, администрациялык ведомстволор, ошондой эле жергиликтүү мамлекеттик администрациялар кирет. Бул бийликтин негизги милдети – кабыл алынган мыйзам актыларынын негизинде республиканын өнөр жайын, айыл чарбасын, социалдык жана маданий турмушун жана башка көптөгөн тармактарды башкаруу."},{"t":"p","h":"Сот бийлигинин өкүлдөрү – Кыргыз Республикасынын Жогорку соту жана жергиликтүү соттор. Соттордун башкы милдеттери сот адилеттигин ишке ашыруу, Конституцияны жана мыйзамдарды коргоо, мамлекеттик уюмдардын, жарандардын ишкана, мекемелердин ортосундагы ар кане <span class=\"pg\" data-n=\"42\">42<\/span>"},{"t":"p","h":"те ГИ"},{"t":"p","h":"с түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"дай талаш маселелерди мыйзам чегинде чечүү болуп саналат."},{"t":"p","h":"3. Мамлекеттик органдардын жана жергиликтүү өз алдынча башкаруу органдарынын эл алдында жоопверчилиги жана алардын өз бийлик укуктарын элдин таламы үчүн жүзөгө ашырышы. Кыргыз Республикасынын бардык мамлекеттик органдары – жогорку бийлик органдарынан тартып, жергиликтүү органдарга чейин эл алдында жоопкерчиликтүү. Бул органдарды түзүүнүн башкы максаты элдин турмушун жакшыртуу, бейпилдигин коргоо болуп эсептелет. Ошондуктан, ар бир мамлекеттик органдын өзүнө тиешелүү милдети болот жана ал милдетти элдин кызыкчылыгы үчүн аткарууга тийиш. Мамлекетти чындоо, анын көз карандысыздыгын коргоо сыяктуу иштер негизинен жалпы элибиздин кызыкчылыгын сактоо максатында жүргүзүлөт. Демократиялык коомдо мамлекеттин, мамлекеттик органдардын кызыкчылыгын жалпы элдин кызыкчылыгынан бөлүп кароого болбойт."},{"t":"p","h":"4. Мамлекеттик органдарынын жана жергиликтүү өз алдынча башкаруу органдарынын иш милдеттери менен ыитарым укуктарын так ажыратуу. Тоталитардык мамлекеттин бирден-бир башкы белгиси – бийликтин ашкере борборлоштурулушу болуп эсептелет. Башкача айтканда, мамлекеттик бийлик бир гана борбордон жүргүзүлүп, жер жердеги жашаган элдер өз алдынча эч нерсе жасай албай, буйрукту борбордон гана күтүп калат. Биздин Конституциябыздын негизинде бийлик мамлекеттик жана жергиликтүү болуп бөлүнүп, алардын милдеттеринин так бөлүштүрүлүшү талап кылынат. Бул болсо биздин коомдогу демократиянын чоң жеңиши деп айтсак жаңылышпайбыз. Өлкөбүздө демократиялаштыруу процесси башталганда эле, 1991-жылдын 19-апрелинде «Кыргыз Республикасынын жергиликтүү өзүн-өзү башкаруу жана жергиликтүү мамлекеттик администрация жөнүндөгү» мыйзам кабыл алынган."},{"t":"p","h":"<span class=\"pg\" data-n=\"43\">43<\/span>ШҮ, түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"Ал мыйзамга ылайык жергиликтүү администрациялар кандай бийлик укуктарын борбордон көз карандысыз түрдө ишке ашыра тургандыгы ажыратып берилген. Жергиликтүү бюджетти түзүү, бекитүү белгиленген, натыйжада, район, облус өзүлөрү иштеп тапкан каражаттарын өзүлөрүнүн кереги үчүн жумшоого мүмкүндүк алышкан. Азыркы мезгилде бийликтин көпчүлүгүн жер-жерлерде жүргүзүү мүмкүндүгүн кеңейтүү процесси жүрүп жатат."},{"t":"p","h":"Кыргыз Республикасында мамлекеттик органдардан тышкары ар кандай коомдук бирикмелерди, саясий партияларды жана диний уюмдарды түзүүгө жол берилген. Мамлекет булардын укугун жана мыйзамдуу таламдарын сактоону камсыз кылат. Ошол эле мезгилде коомдук бирикмелер мамлекеттик органдардын укуктук милдеттерин өзүлөрүнө ыйгарып ала алышпайт."},{"t":"p","h":"Саясий партиялар Жогорку Кеңешке, мамлекеттик кызматтарга өзүнүн адамдарын шайлоо үчүн талапкер катары көрсөтө алышат, ошондой эле парламентте же жергиликтүү кенештерде өзүлөрүнүн шайланган мүчөлөрүнөн фракция түзүп иштей алышат. Аларга мындан башка формада мамлекеттин ишине кийлигишүүгө тыюу салынган. Ошондой эле мамлекеттик кандайдыр бир мекеменин партиялык уюм менен биригип кетишине, мамлекет ишинин кандайдыр бир партиянын чечимине баш ийип кетүүсүнө жол берилбейт. Мамлекеттик кызматта иштегендер өзүлөрүнүн партиялык ишин кызмат ишине байланыштырбашы керек. Кээ бир категориядагы кызматкерлерге партияга мүчө болууга түздөн-түз тыюу салынган, алардын катарына аскер, ички иштер, улуттук коопсуздук, юстиция, прокуратура жана сот органдарынын кызматкерлери кирет."},{"t":"p","h":"Кыргыз Республикасында дин жана диний жөрөлгөлөр мамлекеттен ажыратылган. Диний негизде саясий партия уюштурууга, уюшулган диний уюмдардын саясий максаттарды кездеесуне жана диний уюмдардын, алардын кызматкерлеринин мамлекеттин ишине кийлигишүүсүнө жол берилө <span class=\"pg\" data-n=\"44\">44<\/span>| Р"},{"t":"p","h":"түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"бейт. Ошону менен бирге эле жарандарга алар каалаган диний уюмду түзүүгө, каалаган динин тутууга жол берилген."},{"t":"h3","h":"и КОШУМЧА МАТЕРИАЛ"},{"t":"v","l":["Кыргыз Республикасынын Конституциясы","(Үзүндү)","3-берене","Кыргыз Республикасында мампекеттик бийлик:"]},{"t":"p","h":"1) бүткүл эл тарабынан шайланган Жогорку Кеңеш жана Президент екул болгон жана камсыз кылган элдик бийликтин үстөмдүгүнүн; 2\\) мамлекеттик бийликти бөлүштүрүүнүн;"},{"t":"p","h":"3) мамлекеттик органдардын жана жергиликтүү өз алдынча башкаруу органдарынын эл алдындагы жоопкерчилигинин жана ачыктыгынын, өз ыйгарым укуктарын элдин кызыкчылыгында жүзөгө ашыруусунун;"},{"t":"p","h":"4) мамлекеттик бийлик органдарынын жана жергиликтүү өз алдынча башкаруу органдарынын иш милдеттери менен ыйгарым укуктарын так ажыратуунун принциптерине негизденет."},{"t":"p","h":"№."},{"t":"h3","h":"КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"p","h":"1. Кыргыз Республикасында мамлекеттик бийлик кандай принцип-"},{"t":"p","h":"терге негизденип иш алып барат?"},{"t":"v","l":["2. Мамлекеттик бийлик кандай бутактарга белунет?","3. Жогорку Кеңештин милдеттери кайсылар?","4. Аткаруу бийлиги кайсы органдардан турат?","5. Сот бийлигинин өкүлдөрү болуп кайсы органдар саналат?"]},{"t":"p","h":"6. Мамлекеттик бийликтин жана жергиликтүү өзүн-өзү башкаруу-"},{"t":"p","h":"нун өзгөчөлүктөрү кандай?"},{"t":"p","h":"7. Кыргыз Республикасында мамлекеттик башкаруунун езгече-"},{"t":"p","h":"лүктөрү кандай?"},{"t":"p","h":"8. Кыргыз Республикасында мамлекеттик органдардан тышкары"},{"t":"p","h":"кандай уюмдарды түзүүгө жол берилген?"},{"t":"v","l":["9. Саясий партиялардын кандай укуктары, милдеттери бар?","10. Диний уюмдардын мамлекеттеги өзгөчөлүктөрү кандай?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"45\">45<\/span>Г] түзүлүшү жана мамлекеттик башкаруу"}],"sub":[],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК ТҮЗҮЛҮШҮ ЖАНА МАМЛЕКЕТТИК БАШКАРУУ","pages":[41,45]},{"title":"§ 9. Кыргыз Республикасынын Президенти —","blocks":[{"t":"h3","h":"§ 9. Кыргыз Республикасынын Президенти —"},{"t":"p","h":"мамлекет башчысы. Президентти шайлоо."},{"t":"p","h":"Президенттин бийлик укугу Кыргыз Республикасынын Конституциясынын 60-беренеси боюнча Кыргыз Республикасынын Президенти мамлекеттин башчысы, элдин жана мамлекеттик бийликтин биримдигин көрсөтүп турат."},{"t":"p","h":"Кыргыз Республикасынын Президенти жалпы эл тарабынан шайлангандыктан, элдик бийликтин үстөмдүгүнүн өкүлү болот жана ошол элдик бийликти камсыз кылат, элдин биримдигинин жана мамлекеттик бийликтин символу болуп эсептелет."},{"t":"img","src":"data:image/webp;base64,UklGRlwZAABXRUJQVlA4IFAZAABwswCdASoZAXwBPrFMoEmnJKahLzPsuOAWCWMXwCbJqjJHv5Ht6LZLoDC3Lb ыгына бекип, Кыргыз Республикасынын жаңы Конституциясынын негизинде кызматка кепген биринчи Премьер-министр бапгон"},{"t":"p","h":"2011-жылкы президенттик шайлоодо жеңип, 2011-жыпдын 1-декабрынан президенттик кызматты аткарууда."},{"t":"h3","h":"<span class=\"pg\" data-n=\"46\">46<\/span>ҮГӨ ТИ"},{"t":"p","h":"түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"Кыргыз Республикасынын Президентин шайлоо тууралуу жоболор Кыргыз Республикасынын Конституциясынын 61—63-статьяларында берилген."},{"t":"p","h":"Алгач, кандай адам президенттикке талапкер боло ала тургандыгын билүү маанилүү. Президенттикке талапкер катары катталыш үчүн төмөнкү шарттар керек:"},{"t":"p","h":"1. Кыргыз Республикасынын жараны болууга тийиш."},{"t":"p","h":"2. Талапкер катары көрсөтүлгөнгө чейин жалпысынан республикада 15 жылдан кем эмес жашаган болуу керек."},{"t":"p","h":"3. Жашы З5тен кем эмес жана ТО жаштан жогору эмес болууга тийиш."},{"t":"p","h":"4. Мамлекеттик тилди билүүгө тийиш."},{"t":"p","h":"5. Талапкер катары колдогон 30 минден кем эмес шайлоочунун кол тамгасын чогултушу керек."},{"t":"p","h":"Ушул шарттарга ылайык келип, талаптарды аткарган адам президенттикке талапкер болуп катталат. Президенттикке шайлоодо талапкерлердин саны чектелбейт, бардыгы добүшка коюлат. Кыргыз Республикасынын Президентин шайлоо конституциялык мыйзам менен аныкталат."},{"t":"p","h":"Президент Кыргыз Республикасынын жарандары тарабынан б жылга шайланат, бир эле адам катары менен эки жолу Президент болуп шайлана албайт."},{"t":"p","h":"Шайлоочулардын жарымынан көбүнүн добушун алган талапкер президенттикке шайланды деп эсептелет. Әгер бир дагы талапкер мындай добушту ала албай калса, талапкер экиден кәп болгон учурда эн кеп добуш алган эки талапкер кайрадан добушка коюлат дагы, добуштун жарымынан көбүн алган талапкер шайланды деп табылат, ал эми талапкер бирөө же экөө болуп калган учурда, алар шайланбай калды деп табылып, жаңыдан талапкерди көрсөтүү менен шайлоо кайра өткөрүлөт. Бардык учурда шайлоого шайлоочулардын жарымынан көбү катышууга тийиш, тескери болуп калган учурда, шайлоо болгон жок деп табылат."},{"t":"p","h":"Кыргыз Республикасынын Конституциясы тарабынан аныкталган Президенттин бийлик-укуктарын терт түргө бөлүп кароого болот:"},{"t":"p","h":"<span class=\"pg\" data-n=\"47\">47<\/span>Ө түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"1. Өлкөнүн парламенти – Жогорку Кенеш менен биргелешип аткара турган бийлик-укуктары."},{"t":"p","h":"2. Аткаруу бийлиги менен байланышкан бийлик-укуктары."},{"t":"p","h":"3. Сот бийлиги менен байланышкан бийлик-укуктары."},{"t":"p","h":"4. Президенттин түздөн-түз аткара турган бийлик укуктары."},{"t":"p","h":"Мамлекет башчысы катары Президент Жогорку Кеңешке шайлоону дайындайт, Конституцияда каралган учурларда Жогорку Кенешке шайлоону мөөнөтүнөн мурда дайындоо жөнүндө чечим кабыл алат."},{"t":"p","h":"Жогорку Кеңештин макулдугу менен Башкы прокурорду дайындайт; мыйзамда каралган учурларда Жогорку Кенештин депутаттарынын жалпы санынын үчтөн биринен кем эмесинин макулдугу же болбосо Жогорку Кенештин депутаттарынын жалпы санынын демилгеси боюнча Башкы прокурорду кызматтан бошотот; Башкы прокурордун сунушу боюнча анын орун басарларын дайындайт жана кызматтан бошотот."},{"t":"p","h":"Жогорку Кенеш кабыл алган мыйзамдарга кол коёт. Ал мыйзамдар Президент кол койгондон кийин гана күчүнө кире алат. Эгер кабыл алынган мыйзам менен макул болбогон учурда каршы пикири менен кайра Жогорку Кенешке женетет. Зарыл учурларда Жогорку Кеңештин кезексиз жыйналыштарын чакырууга жана каралууга жаткан маселелерди аныктайт."},{"t":"p","h":"Президент Жогорку соттун судьяларынын кызматына шайлоо үчүн талапкерлерди Судьяларды тандоо боюнча кенештин сунушу менен Жогорку Кеңешке сунуштайт. Жогорку Кенештин сунушу боюнча Жогорку соттун судьяларын кызматынан бошотуу үчүн Жогорку Кенешке сунуштайт. Судьяларды тандоо боюнча кеңештин сунушу боюнча жергиликтүү соттордун судьяларын дайындайт, ошондой эле аларды бошотот."},{"t":"p","h":"Президент Улуттук банктын төрагасы кызмат ордуна шайлоо үчүн талапкерди Жогорку Кеңешке киргизет. Улуттук <span class=\"pg\" data-n=\"48\">48<\/span>түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"банктын төрагасынын сунушу боюнча Улуттук банктын терагасынын орун басарларын жана башкарма мүчөлөрүн дайындайт, мыйзамда каралган учурларда аларды кызматтан бошотот."},{"t":"p","h":"Шайлоо жана референдум өткөрүү боюнча борбордук комиссиянын, Әсептөө палатасынын мүчөлөрүнүн үчтөн бирин шайлоо жана кызматтан бошотуу үчүн талапкерлерди Жогорку Кеңешке киргизет."},{"t":"p","h":"Ошондой эле, Эсептее палатасынын Жогорку Кенеш тарабынан шайланган мүчөлөрүнүн ичинен Эсептее палатасынын төрагасын дайындайт жана аны мыйзамда каралган учурларда бошотот."},{"t":"p","h":"Президент мамлекет башчысы катары өлкөнүн ичинде жана анын чегинен сырткары жерлерде Кыргыз Республикасынын атынан чыгат жана сүйлөшүүлөрдү жүргүзөт, Премьер-министр менен макулдашуу боюнча эл аралык келишимдерге кол коёт."},{"t":"p","h":"Премьер-министр менен макулдашуу боюнча Кыргыз Республикасынын чет мамлекеттердеги дипломатиялык өкүлчүлүктөрүнүн башчыларын жана эл аралык уюмдардагы туруктуу өкүлдөрүн дайындайт. Аларды кайра чакыртып алат. Чет мамлекеттердин дипломатиялык өкүлчүлүктөрүнүн башчыларынан ишеним жана кайра чакыртып алуу грамоталарын кабыл алат."},{"t":"p","h":"Президент Кыргыз Республикасынын жарандыгына кабыл алуу жана жарандыгынан чыгаруу маселелерин чечет."},{"t":"p","h":"Президент Кыргыз Республикасынын Куралдуу Күчтөрүнүн башкы кол башчысы болуп саналат, Кыргыз Республикасынын Куралдуу Күчтөрүнүн жогорку командалык курамын аныктайт, дайындайт жана кызматтан бошотот."},{"t":"p","h":"Өкмөт мүчөлөрүн – коргоо жана улуттук коопсуздук маселелерин тескеген мамлекеттик органдардын жетекчилерин, ошондой эле алардын орун басарларын дайындайт жана кызматтан бошотот."},{"t":"p","h":"Конституциялык мыйзамда каралган негиздер болгон учурда өзгөчө абалды киргизүү мүмкүнчүлүгү жөнүндө эскер- <span class=\"pg\" data-n=\"49\">49<\/span>ШҮ түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"тет, ал эми зарыл болгон учурда аны айрым жерлерде алдын-ала жарыялабай туруп киргизет, ал жөнүндө Жогорку Кенешке токтоосуз билдирет."},{"t":"p","h":"Жалпы же жарым-жартылай мобилизациялоону жарыялайт. Кыргыз Республикасына баскынчылык жасалганда же түздөн-түз баскынчылык коркунучу туулганда согуш абалын жарыялайт жана бул маселени токтоосуз Жогорку Кенештин кароосуна киргизет. Өлкөнү коргоонун жана анын жарандарынын коопсуздугунун кызыкчылыктарында согуш абалын жарыялайт жана бул маселени токтоосуз Жогорку Кеңештин кароосуна киргизет."},{"t":"p","h":"Президент Кыргыз Республикасынын мамлекеттик сыйлыктары менен сыйлайт жана ардак наамдарын, жогорку аскердик наамдарды, дипломатиялык рангдарды жана башка атайын наамдарды ыйгарат."},{"t":"p","h":"Соттолгондорго ырайым кылууну жүзөгө ашырат. Президент өз ыйгарым укуктарын Кыргыз Республикасынын бардык аймактарында аткарылышы милдеттүү болгон жарлыктарды жана буйруктарды кабыл алуу аркылуу ишке ашырат."},{"t":"p","h":"Ар кандай себептер боюнча Президент өз ыйгарым укуктарын мөөнөтүнөн мурда токтоткон учурда жаңы Президент шайланганга чейин анын ыйгарым укуктарын Жогорку Кеңештин Тәрагасы аткарат. Президент ыйгарым укуктарын Жогорку Кенештин Төрагасы аткарууга мүмкүн болбогон учурда Президенттин ыйгарым укуктарын Премьер-министр аткарат."},{"t":"p","h":"Жаны Президентти шайлоо Президенттин ыйгарым укуктары мөөнөтүнөн мурда токтотулган күндөн тартып, үч айлык мөөнөттө өткөрүлөт."},{"t":"p","h":"№"},{"t":"h3","h":"КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"p","h":"1. Кыргыз Республикасынын Президентинин Кыргыз Республи-"},{"t":"p","h":"касындагы кызмат адамдарынын ичиндеги орду кандай?"},{"t":"p","h":"2. Президентти шайлоо кайсыл принциптердин негизинде жүр-"},{"t":"p","h":"гүзүлөт?"},{"t":"p","h":"<span class=\"pg\" data-n=\"50\">50<\/span>= түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"рф юш ‚ Президенттин иштее меенету канча жыл? Ошол принциптерди чечмелеп түшүндүр? Пр йланган 120 депутаттан турат. Әл добушун партияларга берет. Алган добуштарына ылайык 120 орун партияларга бөлүнөт."},{"t":"p","h":"Шайлоонун жыйынтыгы боюнча бир саясий партияга парламентте 65тен көп эмес депутаттык мандат берилет."},{"t":"p","h":"Шайлоо күнүнө карата 21 жашка чыккан, шайлоого укугу бар Кыргыз Республикасынын жараны Жогорку Кеңештин депутаты болуп шайлана алат."},{"t":"p","h":"Жогорку Кенештин депутаты депутаттык ишмердигине байланыштуу айткан ой-пикирлери же Жогорку Кеңештеги добуш берүүнүн жыйынтыктары үчүн куугунтукка алынышы мүмкүн эмес. Өзгөчө оор кылмыштарды кошпогондо, депутатты жазык жоопкерчилигине тартууга Жогорку"},{"t":"p","h":"<span class=\"pg\" data-n=\"52\">52<\/span>ИП глава. Кыргыз Республикасынын мамлекеттик түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"Кенештин депутаттарынын жалпы санынын көпчүлүгүнүн макулдугу менен жол берилет."},{"t":"p","h":"Жогорку Кеңештин депутаты депутаттык ишин башка мамлекеттик же муниципалдык кызмат менен айкалыштыра албайт, жеке ишкердик менен алектениши, коммерциялык уюмдун жетекчи органынын же байкоочулар кеңешинин курамына кириши мүмкүн эмес."},{"t":"p","h":"Жогорку Кеңештин депутаты илимий, педагогикалык жана башка чыгармачылык иштерди аткара алат."},{"t":"p","h":"Жогорку Кенеш Кыргыз Республикасынын Конституциясына ылайык референдумду дайындоо жөнүндө мыйзам кабыл алат, Президентти шайлоону дайындайт."},{"t":"p","h":"Жогорку Кенеш Конституцияга өзгөртүүлөрдү киргизет, мыйзамдарды кабыл алат, мыйзамда аныкталган тартипте эл аралык келишимдерди ратификациялайт жана денонсациялайт, Кыргыз Республикасынын чек араларын өзгөртүү тууралуу маселелерди чечет, республикалык бюджетти жана анын аткарылышы жөнүндө отчётту бекитет, Кыргыз Республикасынын администрациялык-аймактык түзүлүшүнүн маселелерин чечет, мунапыс жөнүндө актыларды чыгарат."},{"t":"p","h":"Жогорку Кенеш эң маанилүү функция катары Өкмөттүн ишинин программасын бекитет, Өкмөттүн түзүмүн жана курамын, Өкмөт мүчөлөрүн (коргоо жана улуттук коопсуздук маселелерин тескеген мамлекеттик органдардын жетекчилеринен башка) аныктайт. Өкмөт тарабынан киргизилген Кыргыз Республикасынын өнүгүүсүнүн жалпы мамлекеттик программасын бекитет. Өкмөткө ишеним көрсөтүү же керсетпее жөнүндө чечим кабыл алат."},{"t":"p","h":"Жогорку Кеңештин сот бийлигине болгон ыйгарым укуктары да чон мааниге ээ – Президенттин сунуштамасы боюнча Жогорку соттун судьяларын шайлайт, конституциялык мыйзамда көрсөтүлгөн учурларда Президенттин сунуштамасы боюнча аларды кызматтан бошотот. Мыйзамда белгиленген тартипте Судьяларды тандоо боюнча кеңештин курамын бекитет. Президенттин сунуштамасы боюнча Улуттук банктүзүлүшү <span class=\"pg\" data-n=\"53\">53<\/span>жана мамлекеттик башкаруу"},{"t":"p","h":"тын терагасын шайлайт, мыйзамда каралган учурларда аны кызматтан бошотот. Ошондой эле, Шайлоо жана референдум өткөрүү боюнча борбордук комиссиянын мүчөлөрүнүн курамынын үчтөн бирин Президенттин, үчтөн бирин парламенттик көпчүлүктүн жана үчтөн бирин парламенттик оппозициянын сунуштамасы боюнча шайлайт, мыйзамда каралган учурларда аларды кызматтарынан бошотот. Эсептее палатасынын мүчөлөрүнүн курамынын үчтөн бирин Президенттин, үчтөн бирин парламенттик көпчүлүктүн жана үчтөн бирин парламенттик оппозициянын сунуштамасы боюнча шайлайт, мыйзамда каралган учурларда аларды кызматтарынан бошотот."},{"t":"p","h":"Акыйкатчыны (Омбудсменди) шайлайт жана мыйзамда каралган учурларда кызматтан бошотот, аны жазык жоопкерчилигине тартууга макулдук берет. Акыйкатчынын (Омбудсмендин) сунуштамасы боюнча Акыйкатчынын (Омбудсмендин) орун басарларын шайлайт, аларды жазык жоопкерчилигине тартууга макулдук берет. Башкы прокурорду дайындоого макулдук берет, аны жазык жоопкерчилигине тартууга макулдук берет, Жогорку Кенештин депутаттарынын жалпы санынын үчтөн биринен кем эмес добушу менен Башкы прокурорду кызматтан бошотууга макулдук берет. Мыйзамда каралган учурларда Башкы прокурорду кызматтан бошотуу тууралуу Жогорку Кеңештин депутаттарынын жалпы санынын үчтөн биринин демилгеси Жогорку Кенештин депутаттарынын жалпы санынын үчтөн экисинен көбүнүн добушу менен жактырылат."},{"t":"p","h":"Жогорку Кенеш конституциялык мыйзамда каралган учурларда жана тартипте өзгөчө абалды киргизет, бул маселе боюнча Президенттин жарлыктарын бекитет же жокко чыгарат. Согуш жана тынчтык маселелерин чечет, согуш абалын жарыялайт, бул маселелер боюнча Президенттин жарлыктарын бекитет же жокко чыгарат. Тынчтыкты жана коопсуздукту сактоону колдоо боюнча мамлекеттер аралык келишимдик милдеттенмелерди аткаруу зарыл болгондо, <span class=\"pg\" data-n=\"54\">54<\/span>түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"Кыргыз Республикасынын Куралдуу Күчтөрүн анын чектеринен тышкары жерлерде пайдалануунун мүмкүнчүлүгү жөнүндө маселени чечет. Кыргыз Республикасынын аскердик наамдарын, дипломатиялык рангдарын жана башка атайын наамдарын белгилейт. Кыргыз Республикасынын мамлекеттик сыйлыктарын жана ардактуу наамдарын уюштурат."},{"t":"p","h":"Жогорку Кеңеш Кыргыз Республикасынын Конституциясында каралган тартипте Президентке каршы айып коёт, Президентти кызматынан четтетүү жөнүндө чечим кабыл алат."},{"t":"p","h":"1. Мыйзам чыгаруу иши. Кыргыз Республикасынын Конституциясынын 79-беренесине ылайык, мыйзам чыгаруу демилгесине: 10 мин шайлоочу (элдик демилге), Жогорку Кенештин депутаттары, Кыргыз Республикасынын Өкмөтү ээ. Жогоруда көрсөтүлгөн сандагы калк, органдар жана кызмат адамдары гана тийиштүү мыйзам долбоорун Жогорку Кенештин кароосуна коё алышат."},{"t":"img","src":"data:image/webp;base64,UklGRposAABXRUJQVlA4II4sAACwTgGdASqAAnYBPrVSokunJKOnq7JbIPAWiWlukcqW+6O8A/onr+vTw61yDARz2/KkKBoU4mheulZ5RW/mB+wm41z4vJCQL9AHw+91R+2b+l/c+whiXpkZTKbZxL/28LZxfPIiVAC3htMrd6bCzKju4EnsGRIY0Qzbr8K9TAceNsA1OKcp8lDoUujR4GMhiRl0CCn2o4wsHrQTzdZ8IFIMG7ReIxZ83xoTf3CswhzNWrap3SF9zdN14FmN/8l21QIupmarXBKKGXUWxGi6MMtRCZAHW8hXon/sKrYxo+Z7oK49rMRPkShIzFW5HniGt6suzwA3jGAWKoBGOM8FMVFRcaajWJk7I7p/l/LNqC1iRLcCgO+7YtVzP3viqLED8tUqKccJptDpF8jUO+XRpOPstJ2RRanGwf6yVjfEzoUjkKKEbZQWRZkIn5WFp8imT3kp \">56<\/span>түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"Жогорку Кеңеш тарабынан кабыл алынган мыйзам 14 күндүн ичинде Президентке кол коюу үчүн жиберилет. Президент мыйзамды алган күндөн тартып бир айдан кечиктирбестен, ага кол коёт же өзүнүн каршы пикирлери менен Жогорку Кеңешке кайрадан кароого кайтарат. Республикалык бюджет, салыктар жөнүндө мыйзамдар милдеттүү түрдө кол коюлууга жатат. Әгерде конституциялык мыйзам же мыйзам кайрадан каралганда Жогорку Кенештин депутаттарынын жалпы санынын үчтөн экисинен кем эмес көпчүлүгүнүн добушу менен мурда кабыл алынган редакциясында жактырылса, мындай мыйзам келип түшкөн күндөн тартып 14 күндүн ичинде Президент тарабынан кол коюлууга тийиш. Мурда кабыл алынган редакциясында жактырылган конституциялык мыйзамга же мыйзамда белгиленген мөөнөттө кол коюлбаса, мындай мыйзамга 10 күндөн кечиктирбестен, Жогорку Кенештин Төрагасы кол коёт жана ал жарыяланууга тийиш."},{"t":"p","h":"Эгерде мыйзамдын өзүндө же аны колдонууга киргизүүнүн тартиби жөнүндө мыйзамда башка мөөнөт каралбаса, мыйзам расмий басма сөз органында расмий жарыяланган күндөн баштап 10 күн өткөндөн кийин күчүнө кирет."},{"t":"p","h":"№"},{"t":"h3","h":"КАИТАЛОО УЧУН СУРООЛОР"},{"t":"p","h":"1. Кыргыз Республикасынын мыйзам чыгаруу бийлигин кайсы"},{"t":"p","h":"орган жузеге ашырат?"},{"t":"v","l":["2. Депутаттардын саны канча?","3. Жогорку Кенеш кандай тартипте иштейт?","4. Депутаттар канча меенетке шайланышат?","5. Аларды шайлоонун тартиби жөнүндө эмне билесиң?"]},{"t":"p","h":"6. Депутатыкка талапкер болуп катталуу үчүн кандай шарт керек?"},{"t":"p","h":"7. Депутаттын кандай макамдары жана чектөөлөрү бар?"},{"t":"v","l":["8. Жогорку Кеңештин кандай бийлик-укуктары бар?","9. Мыйзамдарды кабыл алуу тартиби кандай?","10. Мыйзам чыгаруу демилгеси кимдерге таандык?","11. Мыйзам күчүнө кандай кирет?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"57\">57<\/span>түзүлүшү жана мамлекеттик башкаруу"}],"sub":[{"title":"КАИТАЛОО УЧУН СУРООЛОР","b":35}],"section":"§ 9. Кыргыз Республикасынын Президенти —","pages":[51,57]},{"title":"&amp; 11. Аткаруу бийлиги. Өкмөт.","blocks":[{"t":"h3","h":"&amp; 11. Аткаруу бийлиги. Өкмөт."},{"t":"p","h":"Жергиликтүү мамлекеттик администрациялар"},{"t":"p","h":"Кыргыз Республикасында аткаруу бийлигин Өкмөт, ага баш ийген министрликтер, мамлекеттик комитеттер, администрациялык ведомстволор жана жергиликтүү мамлекеттик администрациялар ишке ашырат. Өкмөт Кыргыз Республикасынын аткаруу бийлигинин жогорку органы болуп саналат. Өкмөттү Премьер-министр башкарат. Өкмөт Премьерминистрден, вице-премьер-министрлерден, министрлерден жана мамлекеттик комитеттердин төрагаларынан турат. Өкмөттүн түзүмү өзүнө министрликтерди жана мамлекеттик комитеттерди камтыйт."},{"t":"p","h":"Жаңы шайланган Жогорку Кенеш биринчи жыйналышы өткөн күндөн тартып 15 жумушчу күндүн ичинде Премьер-министрдин кызматына талапкерди депутаттык мандаттардын теңинен көбүнө ээ болгон фракция же анын катышуусу менен фракциялардын коалициясы көрсөтөт."},{"t":"img","src":"data:image/webp;base64,UklGRiY7AABXRUJQVlA4IBo7AABwUQGdASqAAlkBPrVSoUwnJKciqDTMOOAWiWltnNLru6HSNZ89T/5vkmeLCmj55f0j/e7YsPTAcoqZIefJReBDZh9c/0fop8qG010gP9fyYDv/7SdpeY2ffD8lbL9mZ/jfWvfHfYXoSTunC/gvxs/wvDa/W9IHlUnaf+Ao/MqQUoasyvt7KVI8QZemPdvXHGXCUKY1mGJWWl2gyBHptltmNKbgij2CdHG9Y6qWjQhFVYnERhEUFj0U0hQujXmP7b7GDZXaoVozzZX7q89CWZ9H/cHAHr2WdRR8JwGlb150jpE5cm4CGI/UyAuIhCaRS2nLN+LxfUtjRMAQXq8r2nWBrAZheY6sUS1cpjgP4RsgygbWOhfdUT+KFvP5zDVJLROQBUPtuMZz3oCaAzPcMo5OR4mPp6R7M+jUF1bjMFVUwZlur82G8tDFekUranMkbzcx8H+sI+AxxDqu91rp0cYCgObw2GWfGYfQck2gjx9IFopzG/01flzcgoz2UWPQjYbB7NG7PZIzVde03/GIZ7l7fO3WRl+ifp+jqG20pfzVxtP48ttt9Oz6ZqlNAbKxkecVyNQPtfkgKbKthl6Ub59C1yMth0kfchQTDTVZlZECGyWOtNtG2EpTUVFrEKY0a+hqZQKfE40d1550Csb/iI/DAWI0L+eI1se+J2QCTXkk9AO9r1b25dF0Q00L/0X+ksDbrHJXGqWSuMZ8pOjdTE+0QC+1ntwMKVPz1AdHGS1T5GXD6BvlMasqD0Vl6Fi5KGeuKC5ppCXNZPIswThbFez+jfsG724Y9tXhvcgKfB56cafak5JWYPgE2KdYhFIFDGmHcD7+4lWjki/MOPaXih+kPLZPCjMqSez0MYPBwd2y0RDgbp6j7WKiedVM6CfAcyDGadmlK+vWeCq3002oklVSg/cxfsKls9OozknusdG61p ызмат ордуна талапкер жогоруда көрсөтүлгөн мөөнөт аяктаганга чейин Өкмөттүн программасын, түзүмүн жана курамын Жогорку Кеңешке киргизет."},{"t":"p","h":"Эгерде жогоруда көрсөтүлгөн мөөнөт аяктаганга чейин Жогорку Кеңеш Өкмөттүн программасын бекитпесе, түзүмүн жана курамын аныктабаса, фракциялар өз демилгеси менен 15 жумушчу күндүн ичинде парламенттик көпчүлүктү түзүүгө жана Премьер-министрдин кызмат ордуна талапкерди көрсөтүүгө тийиш."},{"t":"p","h":"Президент үч күндүк мөөнөттө Премьер-министрди жана Өкмөттүн башка мүчөлөрүн дайындоо тууралуу жарлык чыгарат."},{"t":"p","h":"Өкмөттүн ыйгарым укуктары. Өкмөт Конституциянын жана мыйзамдардын аткарылышын камсыз кылат, мамлекеттин ички жана тышкы саясатын ишке ашырат, мыйзамдуулукту, жарандардын эркиндиктерин жана укуктарын камсыз кылуу, коомдук тартипти сактоо, кылмыштуулукка каршы күрөшүү боюнча чараларды жүзөгө ашырат. Мамлекеттин эгемендигин, аймактык бүтүндүгүн коргоо, конституциялык түзүлүштү сактоо боюнча, ошондой эле коргонуу жөндөмдүүлүгүн чыңдоо, улуттук коопсуздукту жана укук тартибин бекемдөө боюнча чараларды ишке ашырууну камсыз кылат. Финансы, баа, тариф, инвестиция җана салык саясатын жүргүзүүнү камсыз кылат. Ошондой эле, республикалык бюджетти иштеп чыгат жана Жогорку Кеңешке сунуш кылат жана анын аткарылышын камсыз кылат; республикалык бюджеттин аткарылышы жөнүндө Жогорку Кеүөт? <span class=\"pg\" data-n=\"59\">59<\/span> түзүлүшү жана мамлекеттик башкаруу ых 4"},{"t":"p","h":"нешке отчёт берет. Менчиктин бардык түрлөрүн өнүктүрүүнүн жана аларды коргоонун бирдей шарттарын камсыз кылуу боюнча, мамлекеттик менчик объекттерин башкаруу боюнча чараларды ишке ашырат. Социалдык-экономикалык жана маданий чөйрөдө бирдиктүү мамлекеттик саясатты жүргүзүүнү камсыз кылат. Экономикалык, социалдык, илимий-техникалык жана маданий өнүктүрүүнүн жалпы мамлекеттик программаларын иштеп чыгат жана жүзөгө ашырат. Тышкы экономикалык иштерди жүргүзүүнү камсыз кылат."},{"t":"p","h":"Премьер-министр Өкмөттүн иши үчүн Жогорку Кенештин алдында жеке жоопкерчилик тартат."},{"t":"p","h":"Өкмөттүн жыйындарын еткерет, токтомдорго жана буйруктарга кол коёт, алардын аткарылышын камсыз кылат жана администрациялык ведомстволордун жетекчилерин дайындайт жана бошотот. Ошондой эле, мыйзамда белгиленген тартипте жергиликтүү мамлекеттик администрациялардын башчыларын жергиликтүү кеңештердин сунушу боюнча дайындайт жана бошотот."},{"t":"p","h":"Тиешелүү администрациялык-аймактык бирдиктин аймагында аткаруу бийлигин жергиликтүү мамлекеттик администрация ишке ашырат. Жергиликтүү мамлекеттик администрациялардын башчыларын дайындоо жана бошотуу тартиби мыйзам менен аныкталат."},{"t":"p","h":"Жергиликтүү мамлекеттик администрациялар Конституциянын, мыйзамдардын, Өкмөттүн ченемдик укуктук актыларынын негизинде иштейт. Өз компетенциясынын чегинде кабыл алынган жергиликтүү мамлекеттик администрациялардын чечимдери тийиштүү аймакта милдеттүү түрдө аткарылат."},{"t":"h3","h":"} ‘ КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"p","h":"1. Кыргыз Республикасында аткаруу бийлигинин курамына кайсы"},{"t":"p","h":"органдар кирет?"},{"t":"p","h":"2. Кайсы орган аткаруу бийлигинин жогорку органы болуп эсеп-"},{"t":"p","h":"тепет?"},{"t":"p","h":"3. Өкмөттүн курамы кандай тартипте түзүлөт?"},{"t":"p","h":"<span class=\"pg\" data-n=\"60\">60<\/span>түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"4. Өкмөттүн ишине ким көзөмөл жүргүзө алат?"},{"t":"v","l":["5. Өкмөт кандай маселелерди чечет?","6. Өкмөт кабыл ала турган ченемдик актыларды атап бер?"]},{"t":"p","h":"7. Райондордогу, облустардагы аткаруу бийлигинин органдары"},{"t":"p","h":"женунде эмнелерди билесиң?"}],"sub":[],"section":"§ 9. Кыргыз Республикасынын Президенти —","pages":[58,60]},{"title":"§ 12. Кыргыз Республикасындагы сот бийлиги.","blocks":[{"t":"h3","h":"§ 12. Кыргыз Республикасындагы сот бийлиги."},{"t":"img","src":"data:image/webp;base64,UklGRnZMAABXRUJQVlA4IGpMAAAwswGdASqAAoIBPrVOokwnJCcqqdF8kVAWiWluQE5rkVakVBLjAPuv+s49hed63Xh938d78/QeI/7L4L/fRJyztYFkC9q4oIe337QZ01vYbDL ":"Кыргыз Республикасынын Жогорку сотунун имараты."},{"t":"p","h":"Соттор жана сот адилеттиги"},{"t":"p","h":"Бийликти бөлүү принцибине ылайык Кыргыз Республикасында көз карандысыз сот бийлиги бар. Соттордун негизги милдети – бул сот адилеттигин жүзөгө ашыруу."},{"t":"p","h":"Бул эмнени түшүндүрөт? Мисалы, Жогорку Кеңеш кандайдыр бир мыйзамды кабыл алды дейли. Ага депутаттар-"},{"t":"h3","h":"<span class=\"pg\" data-n=\"61\">61<\/span>жем"},{"t":"p","h":"\\ Ө түзүлүшү жана мамлекеттик башкаруу и"},{"t":"p","h":"дын азчылык болугу макул болбой, Конституцияга карама-каршы келген мыйзам деп эсептейт. Бул учурда Конституция бузулду деген тарап Кыргыз Республикасынын Жогорку сотунун Конституциялык палатасына кайрылат, ал болсо чырды бир тараптын пайдасына чечет. Бул кабыл алынган чечим акыркы чечим болуп саналат, даттанылууга жатпайт жана аны бардык мамлекеттик органдар, кызмат адамдары милдеттүү түрдө аткарууга тийиш."},{"t":"p","h":"Же болбосо, кылмыш жасаган адамдардын ишин карап, аны күнөөлүү же күнөөлүү эмес деп таап, эгер күнөөсү бар болсо жаза чектей турган орган сот гана болуп эсептелет. Ошондой эле соттордо мүлктүк, үй-бүлө мамилесиндеги, эмгек мамилесиндеги жана башка бардык чейрелердегу талаш-тартыштар каралат."},{"t":"p","h":"Кыргыз Республикасынын сотторунун катарына Кыргыз Республикасынын Жогорку соту, анын алдындагы Конституциялык палата жана жергиликтүү соттор кирет."},{"t":"p","h":"Кыргыз Республикасынын Жогорку соту жарандык, жазык, администрациялык жана башка сот иштери боюнча сот бийлигинин жогорку органы болуп эсептелет. Бул иштерди жер-жерлерде райондук, шаардык жана облустук соттор карашат. Жарандык иштерге, мисал үчүн, автордук укук, мурастык укук боюнча талаш-тартыштар, ажырашуу, баланын атасын аныктоо, эмгек боюнча талаш-тартыштар кирет. Жазык иштерине Кыргыз Республикасынын Кылмыш жана жаза кодексинде каралган кылмышты жасаган адамдардын күнөөлүүлүгүн аныктап, жаза чектөө кирет. Администрациялык сот иштерине Кыргыз Республикасынын бийликукукту жүзөгө ашыруу органдарынын ишине келтирилген арыздарды териштирүү кирет. Ушул иштерди караган жергиликтүү соттордун ишин көзөмөлдөөнү Жогорку сот жүргүзет, бирок конкреттүү ишти кароодо көрсөтмө бере албайт. Анткени, кайсы гана судья болбосун, эч кимге көз каранды эмес, мыйзамга гана баш иет дагы, ишти мыйзамга негиздеп чечиши керек. Эгерде мыйзамга туура келбеген чечим"},{"t":"p","h":"<span class=\"pg\" data-n=\"62\">62<\/span>ө єз. ДЕР түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"кабыл алынса, жогору турган сот ал чечимди бузуп, өзгөртүп, башка чечим кабыл алып же ишти башка судьяга кайрадан тууралап кароо үчүн бериши мүмкүн."},{"t":"p","h":"Кыргыз Республикасынын Жогорку сотунун судьялары Жогорку Кеңеш тарабынан Президенттин сунушу боюнча шайланышат, курагы 40 жаштан кем болбошу, ТО жаштан ашпашы, юридикалык жогорку билими жана кесиби боюнча 10 жыл стажысы болууга тийиш. Ал эми жергиликтүү соттордун судьялары Кыргыз Республикасынын Президенти тарабынан биринчи ирет 5 жылдык мөөнөткө, кийин 65 жашка чыкканга чейин дайындалышат. Бардык судьяларды Судьяларды тандоо боюнча кенеш тандап сунуштайт."},{"t":"p","h":"Конституциялык көзөмөлдү жүзөгө ашыруучу орган болуп Жогорку соттун Конституциялык палатасы саналат. Курагы 40 жаштан кем болбогон жана Т0 жаштан ашпаган, юридикалык жогорку билими бар жана юридикалык кесиби боюнча кеминде 15 жыл стажысы бар Кыргыз Республикасынын жараны Жогорку соттун Конституциялык палатасынын судьясы боло алат."},{"t":"p","h":"Жогорку соттун Конституциялык палатасы өз курамынан төраганы, төраганын орун басарын 8 жылдык мөөнөткө шайлайт."},{"t":"p","h":"Жогорку соттун Конституциялык палатасы:"},{"t":"p","h":"1) мыйзамдар жана башка ченемдик укуктук актылар Конституцияга карама-каршы келген учурда аларды Конституцияга ылайык эмес деп табат;"},{"t":"p","h":"2) Кыргыз Республикасы катышуучу болуп саналган күчүнө кирбеген эл аралык келишимдердин конституциялуулугу тууралуу корутунду берет;"},{"t":"p","h":"3) Конституцияга өзгөртүүлөр тууралуу мыйзамдын долбооруна корутунду берет."},{"t":"p","h":"Конституция тарабынан таанылган укуктар жана эркиндиктер алар тарабынан бузулуп жатат деп эсептелсе, ар бир адам мыйзамдын жана башка ченемдик укук актыларынын конституциялуулугун талашууга укуктуу."},{"t":"p","h":"<span class=\"pg\" data-n=\"63\">63<\/span>түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"Конституциялык палатанын чечими акыркы болуп эсептелет жана даттанууга жатпайт."},{"t":"p","h":"Конституциялык палата тарабынан мыйзамдардын же алардын жоболорунун конституциялык эмес деп белгилениши алардын Кыргыз Республикасынын аймагында колдонулушун жокко чыгарат, ошондой эле, сот актыларын кошпогондо, конституциялык эмес деп таанылган мыйзамдарга же алардын жоболоруна негизделген башка ченемдик укуктук актылардын колдонулушу да жокко чыгарылат."},{"t":"p","h":"Бардык соттордун судьялары мөөнөтүнөн мурда өз эрки менен, оорусуна байланыштуу, күчүнө кирген айыптоо өкүмүнүн негизинде жасаган кылмышы үчүн жана конституциялык мыйзамда каралган башка учурларда гана кызматтан бошотулушу мүмкүн. Ошондо да, Жогорку соттун судьяларын бошотуу үчүн Жогорку Кенештин депутаттарынын жалпы санынын үчтөн экисинин добушу талап кылынат. Ал эми шайлоо үчүн жарымынан көбү эле жетиштүү."},{"t":"p","h":"Кыргыз Республикасындагы сот тутуму башка бийликтерге көз каранды болбой сот адилеттигин Конституцияга жана мыйзамдарга гана таянып ишке ашыруусу үчүн бир кыйла кепилдиктер каралган. Кыргыз Республикасынын Конституциясынын 95-беренеси судьянын Конституцияга жана мыйзамга баш иерин, судья кол тийбес иммунитет укугунан пайдаланарын жана өз макамына ылайык анын көз карандысыздыгы социалдык, материалдык жана башка кепилдиктер менен камсыз кылынарын бекиткен."},{"t":"v","l":["2 | Кыргыз Республикасынын Конституциясы КОШУМЧА МАТЕРИАЛ","(Үзүндү)","","94-берене"]},{"t":"p","h":"1. Судьялар көз карандысыз жана Конституцияга жана мыйзамдарга гана баш иет."},{"t":"p","h":"2. Судья кол тийбестик укугуна ээ жана кылмыш үстүндө тутулгана <span class=\"pg\" data-n=\"64\">64<\/span>ТИ"},{"t":"p","h":"түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"дан тышкары учурларда кармалууга же камакка алынууга, тинтүүгө же жеке текшерилүүгө тийиш эмес."},{"t":"p","h":"3. Конкреттүү бир сот иши боюнча судьядан отчёт тапап кылууга эч кимдин укугу жок. Сот адилеттигин жүзөгө ашыруу боюнча ар кандай кийлигишүүлөргө тыюу салынат. Судьяга таасир көрсөтүүгө кунеелүү адамдар мыйзамда каралгандай жоопкерчилик тартышат."},{"t":"p","h":"4. Судья өзүнүн макамына ылайык көз карандысыздыгынын социалдык, материалдык жана башка кепилдиктери менен камсыз кылынат."},{"t":"v","l":["уе КАЙТАЛОО ҮЧҮН СУРООЛОР","1. Соттордун эң негизги максаты эмнеде?","2. Кыргыз Республикасында кандай сот органдары бар?"]},{"t":"p","h":"3. Кыргыз Республикасынын Жогорку сотунда кандай иштер ка-"},{"t":"p","h":"ралат?"},{"t":"p","h":"4. Кыргыз Республикасынын Жогорку сотунун Конституциялык"},{"t":"p","h":"палатасы кандай иштерди карайт?"},{"t":"p","h":"5. Жергиликтүү соттор жөнүндө эмне билесиң?"},{"t":"p","h":"6. Судьялар көз каранды болбошу үчүн Конституция эмнелерге"},{"t":"p","h":"кепилдик берет?"}],"sub":[],"section":"§ 9. Кыргыз Республикасынын Президенти —","pages":[61,64]},{"title":"§ 13. Укук коргоо органдары жана алардын","blocks":[{"t":"h3","h":"§ 13. Укук коргоо органдары жана алардын"},{"t":"p","h":"функциялары"},{"t":"p","h":"Мыйзам тарабынан белгиленген укук тартибин бузган адамдарга карата мамлекеттик мажбурлоо чараларын колдонуу аркылуу калктын таламдарын ар кандай кол салуулардан коргоочу органдар укук коргоо органдары деп аталат."},{"t":"p","h":"Укук коргоо органдарына прокуратура, милиция, улуттук коопсуздук органдары, финансы полициясы кирет."},{"t":"p","h":"Прокуратура. Кыргыз Республикасынын Конституциясынын 104-беренесинде прокуратуранын төмөнкү милдеттери белгиленген: Кыргыз Республикасынын Прокуратурасы"},{"t":"v","l":["<span class=\"pg\" data-n=\"65\">65<\/span>Н глава. Кыргыз Республикасынын мамлекеттик","түзүлүшү жана мамлекеттик башкаруу","Ө","ш $"]},{"t":"p","h":"аткаруу бийлигинин органдары, жергиликтүү өз алдынча башкаруу органдары, алардын кызмат адамдары тарабынан мыйзамдардын так жана бирдей аткарылышын көзөмөлдөө; изин суутпай издөөнү, тергөөнү жүзөгө ашыруучу органдар тарабынан мыйзамдардын сакталышын көзөмөлдөө; жазык иштери боюнча соттун чечимдерин аткарууда, ошондой эле жарандардын жеке эркиндигин чектоеге байланышкан мажбурлоо мүнөзүндөгү чараларды колдонууда мыйзамдардын сакталышын көзөмөлдөө; мыйзамда белгиленген учурларда сотто жарандын же мамлекеттин кызыкчылыктарына екулчулук кылуу; сотто мамлекеттик айыптоону ишке ашыруу; ошондой эле мамлекеттик органдардын кызмат адамдары кылмыш жасаган учурларда алардын ишин тергөө."},{"t":"p","h":"Прокуратура органдары жергиликтүү бийликтерге көз каранды эмес, түздөн-түз башкы прокурорго баш ийишет."},{"t":"p","h":"Ички иштер органдары (милиция). Ички иштер органдарына – Кыргыз Республикасынын Ички иштер министрлиги, облустардын, Бишкек шаарынын, ага баш ийген ички иштер башкармалары, шаардык, райондук бөлүмдөрү, айылдык бөлүкчөлөрү, милиция окуу жайлары, мекемелери жана уюмдары кирет. Ички иштер органдарынын атайын бөлүмдөрү бар, мисалы, кылмыш издөө, тергөө, коомдук тартипти сактоо, мамлекеттик автомобиль инспекциясы (МАИ) ж. б. Милициянын райондук, шаардык бөлүмдөрүнүн алдында жашы жетпегендердин иштери боюнча инспекциялар иштейт, алар жаш балдардын кылмыш жасоосун болтурбоо үчүн тарбиялык иштерди жүргүзүшөт."},{"t":"p","h":"Ички иштер органдарынын негизги милдеттери болуп коомдук тартипти, инсандын жана коомдун коопсуздугун камсыз кылуу, кылмыштуулукка каршы күрөшүү, жол коопсуздугун камсыз кылуу жумуштары саналат."},{"t":"p","h":"Ички иштер органдарынын кызматкерлерине аларга жүктөлбөгөн милдеттерди аткарууга көрсөтмө берүүгө мыйзам тарабынан тыюу салынган."},{"t":"p","h":"<span class=\"pg\" data-n=\"66\">66<\/span>түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"Ички иштер органдары өз ишин жарандардын укугун урматтоонун негизинде жүргүзүүлөрү тийиш, алардын укуктарына кандайдыр бир чек коюуга мыйзамда каралган учурда гана жол берилет."},{"t":"p","h":"Жарандар өздөрүнүн укуктарынын жана эркиндиктеринин чектелиши боюнча ички иштер органдарынын кызматкерлеринен түшүнүк алууга, милициянын аракеттерине нааразы болгон жарандар милициянын жогору турган органына, прокурорго же сотко даттанууга укуктуу."},{"t":"p","h":"Кармалган, камалган жана соттолгон адамдарга милиция органдары юридикалык жактан коргонуу укугун ишке ашырууга мүмкүнчүлүк түзүп, алардын турган жери жөнүндө туугандарына, иштеген же окуган жериндеги администрациясына билдирүүлөрү тийиш."},{"t":"p","h":"Ички иштер органдары зарыл болгон учурда аталган адамдарга токтоосуз түрдө медициналык жана башка жардам көрсөтүүгө, ар кандай коркунучтарды четтетүүгө чараларды көрүүлөрү керек."},{"t":"p","h":"Ар бир адам бирөөдөн запкы көрсө же мүлкүн уурдатса, милиция органдарына кайрылышат. Алар кайрылуу боюнча токтоосуз иш жүргүзүшүп, эгер кылмышты жасаган адам белгилүү болсо, тийиштүүлүгүнө жараша чара көрүүгө же адам белгилүү болбосо издөө салууга милдеттүү."},{"t":"p","h":"Милиция кызматкерлери тартип бузуучуга карата талаптарды так, катуу, кыска жана ачык коюшу керек, анткени бул мыйзамдуулуктун бекем шарты, кыянаттыкка жана ээнбаштыкка карата ишенимдүү тоскоолдук болот."},{"t":"p","h":"Улуттук коопсуздук органдары. Бул органдар мамлекетибиздин коопсуздугун чет өлкөлөрдүн чалгындоочуларынан, ошондой эле өлкөнүн ичиндеги мамлекетибиздин негизине зыянын тийгизе турган кылмыштардан сакташат. Улуттук коопсуздук органдарынын иши өте жооптуу, аларга коюлган милдет ыйык деп айтса болот, ошондуктан ал органдарда өтө тандалган, билимдүү, өлкөсүн сүйгөн адистер иштешет."},{"t":"p","h":"<span class=\"pg\" data-n=\"67\">67<\/span>ЇП глава. Кыргыз Республикасынын мамлекеттик"},{"t":"p","h":"тузулушу жана мамлекеттик башкаруу"},{"t":"p","h":"Финансы полициясы. Мамлекетибиз социалисттик системада жашап турган кезинде ишкердикти жүргүзүүгө мамлекеттик жана коомдук ишканаларга жана чарбаларга гана уруксат берилип, алар жаап-жашырбастан, салыкты мамлекетке төгүп турушкан. Салыкты убагында жана так төлөп туруунун мааниси өте зор, себеби мамлекеттин бийлик органдары, укук коргоо органдары, Куралдуу күчтөрү, саламаттыкты сактоо, билим берүү, социалдык камсыз кылуулар (жөлөк пул, стипендия) мамлекеттик бюджеттин эсебинен каржыланат. Азыр эркин рынок экономикасына еткен учурда ишкердикти жүргүзүүгө тыюу салуу жок, ар бир адам ишкана ачып алып, продукция өндүрүүгө же дыйкан чарба продукциясын өндүрүүгө акылуу. Ошону менен бирге эле мыйзамда белгиленген өлчөмдө жана тартипте мамлекетке салык төлөөгө милдеттүү. Тилекке каршы, кээ бир ишкерлер кирешесин жашырып, мамлекетке салык төлөөдөн качкан фактылар кездешет. Бул болсо кылмыш болуп эсептелет. Ошондуктан, мындай аракеттерге каршы күрөшүү үчүн жана дээрлик экономика чөйрөсүндөгү кылмыш менен күрөшүү үчүн финансы полициясы түзүлгөн."},{"t":"h3","h":"1 КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"p","h":"чо са һю – ‚ Тергөө ишинде прокуратуранын кандай укук милдеттери бар? ‚Сот процессиндеги прокурордун кандай укук милдеттери бар? ‚ Укук коргоо органдары эмне кызмат кылат? ‚ Милиция органдарынын башкы милдети кандай? Милиция органдары кандай тармактар боюнча иш алып ба-"},{"t":"p","h":"Прокуратура органдарынын милдеттери кандай?"},{"t":"p","h":"‚ Мыйзамдарды аткарууну жалпы көзөмөлдөө деген эмне?"},{"t":"p","h":"рышат?"},{"t":"p","h":"В. Улуттук коопсуздукту сактоо органдарынын башкы милдеттери"},{"t":"p","h":"кандай?"},{"t":"p","h":"9. Финансы полициясы жөнүнде эмнени билесиң?"},{"t":"p","h":"бт <span class=\"pg\" data-n=\"68\">68<\/span>“өт түзүлүшү жана мамлекеттик башкаруу"}],"sub":[{"title":"1 КАЙТАЛОО ҮЧҮН СУРООЛОР","b":22}],"section":"§ 9. Кыргыз Республикасынын Президенти —","pages":[65,68]},{"title":"&amp; 14. Жергиликтүү өз алдынча","blocks":[{"t":"h3","h":"&amp; 14. Жергиликтүү өз алдынча"},{"t":"p","h":"башкаруу органдары"},{"t":"p","h":"Кыргыз Республикасында жергиликтүү өз алдынча башкаруу – жергиликтүү кенештер жана мыйзамда белгиленген тартипте калктын өзү тарабынан түзүлгөн башка органдар аркылуу жүргүзүлөт, алар мыйзамдын чегинде өз жоопкерчилиги астында жергиликтүү маанидеги иштерди башкарышат."},{"t":"p","h":"Жергиликтүү кеңештер өз алдынча башкаруунун өкүлчүлүктүү органы болуп эсептелип, ошол аймакта жашап жаткан жарандар тарабынан шайланат. Жергиликтүү кеңештер тиешелүү администрациялык аймактарда, шаарларда, айылдарда түзүлөт. Жергиликтүү кенештер өзүлөрүнүн сессиясында терагасын шайлашат, анын отчётун угушат, аймактын социалдык, экономикалык өнүгүү жана калкты социалдык жактан коргоо программасын бекитет, анын ишке ашырылышын кеземелдейт, жергиликтүү бюджетти, анын аткарылышы жөнүндөгү отчётту бекитет жана бюджеттен сырткары фонддордун сарпталышын карайт."},{"t":"p","h":"Жергиликтүү маанидеги маселелерди чечүү үчүн ошол аймакта жашаган жарандар ыктыярдуу түрдө биригип, аймактык-коомдук өз алдынча башкаруу органдарын түзүүгө мыйзам жол берген. Мындай органдарга кичирайондордун кеңештери же комитеттери, үй, көчө, квартал, айыл комитеттери жана ошол жерде жашоочулардын жергиликтүү шарттарына, салттарына ылайыкталып түзүлгөн башка органдар кирет."},{"t":"p","h":"Жергиликтүү өз алдынча башкаруу органдарына мыйзам тарабынан йир кыйла чоң укуктар берилген. Бул болсо биздин өлкөбүздө демократиянын өнүгүп жаткандыгынын күбөсү болот. Мурдагы социалистик режимдин убактысында бардык маселелер мамлекеттик гана органдар тарабынан чечилуучу. Жада калса кичине көчөгө асфальт төктүрүш үчүн <span class=\"pg\" data-n=\"69\">69<\/span>/\\ ет түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"же үйгө суу түтүгүн орнотуу үчүн дагы мамлекеттик органдарга кайрылууга туура келген. Азыр болсо мыйзамга ылайык ар бир айыл же квартал өзүлөрүнүн комитетин шайлап алып, аны жергиликтүү кеңештен каттоодон өткөрүп, андан каражат алууга акылуу жана отого. жапатпа.ваулцпу, үчүн,.. зарыл иштерди жасай алышат."},{"t":"p","h":"Жергиликтүү өз алдынча башкаруу органдары ошол аймактын жашоочуларынын кызыкчылыгын мамлекеттик органдардын алдында коргойт, жергиликтүү кенештерде ошол аймакка тиешелүү маселелер каралып жатса, ага катышууга, пикирлерин айтууга укуктуу, социалдык чөйрөдө курулган, жайгаштырылган, ремонттолгон объектилерди кабыл алууга катышышат, жергиликтүү кенештин жана мамлекеттик акимчиликтердин чечимин аткарууга көмөктөшөт, жарандардын жыйындарынын чечимдеринин аткарылышын уюштурат."},{"t":"p","h":"Өздөрүнүн мыйзам тарабынан берилген укуктарын ишке ашыруу үчүн алар чарба жүргүзүүгө укуктуу, түшкөн кирешеге ар кандай клубдарды, оюн-зоок откерчу жайларды, ышкыбоздордун бирикмелерин ача алышат. Башкача айтканда, калктын жашоосун ондоо үчүн ар кандай жумуштарды аткарууга аларга мүмкүнчүлүк берилген."},{"t":"p","h":"Жергиликтүү өз алдынча башкаруу органдары өзүнүн ээлигинде муниципалдык (коммуналдык) менчикти кармоого укуктары бар."},{"t":"p","h":"Жергиликтүү өз алдынча башкаруунун жарандар чогулушу, жергиликтүү кеңеш же башка өкүлчүлүктүү органдарынын чечими менен айылдарда, шаарларда сый-урматка ээ аксакалдардан же башка жарандардан аксакалдар соту түзүлүшү мүмкүн."},{"t":"p","h":"Аксакалдар соту тараптардын макулдашуусу менен берилген мүлктүк, үй-бүлөлүк же башка талаштарды карап, чырлашкан тараптарды жараштыруу жана адилеттүү, мыйзамга каршы келбеген чечимдерди чыгаруу максатын көздөйт. Аксакалдар сотунун чечимине макул болбогон таєз <span class=\"pg\" data-n=\"70\">70<\/span>де түзүлүшү жана мамлекеттик башкаруу"},{"t":"p","h":"рап Кыргыз Республикасынын мыйзамы менен белгиленген тартипте райондук сотко даттана алат."},{"t":"p","h":"Мамлекеттик органдар жергиликтүү өз алдынча башкаруу органдарынын мыйзамда каралган ыйгарым укуктарына кийлигишүүгө укуксуз."},{"t":"p","h":"Жергиликтүү өз алдынча башкаруу органдарына мамлекеттик ыйгарым укуктар ыйгарылышы мүмкүн, бул учурда укуктарды жузеге ашыруу үчүн зарыл болгон материалдык, финансылык жана башка каражаттар еткерулуп берилет. Мамлекеттик ыйгарым укуктар жергиликтүү өз алдынча башкаруу органдарына мыйзамдын же келишимдин негизинде берилип, өткөрүлүп берилген ыйгарым укуктар боюнча жергиликтүү өз алдынча башкаруу органдары мамлекеттик органдарга отчёт беришет."},{"t":"p","h":"Жергиликтүү өз алдынча башкаруу органдары мамлекет жана анын органдарынын алдында мыйзамдардын аткарылышы үчүн, жергиликтүү жамааттын алдында – өз ишинин натыйжасы үчүн жоопкерчиликтүү болушат."},{"t":"p","h":"Жергиликтүү өз алдынча башкаруу органдары өздөрүнүн укуктарынын бузулушуна байланыштуу соттук коргоо үчүн сот органдарына кайрылууга укуктуу."},{"t":"p","h":"5"},{"t":"h3","h":"КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"p","h":"1. Жергиликтүү өз алдынча башкаруу кайсы органдар тарабынан"},{"t":"p","h":"жүргүзүлөт?"},{"t":"v","l":["2. Жергиликтүү кеңештер кандай тартипте түзүлөт?","3. Алардын кандай укуктары, милдеттери бар?"]},{"t":"p","h":"4. Аймактын коомдук өз алдынча башкаруу органдарына кайсы"},{"t":"p","h":"органдар кирет?"},{"t":"v","l":["Б. Алардын кандай укуктары бар?","6. Аксакалдар соту жөнүндө эмне билесиң?","","то"]},{"t":"p","h":"<span class=\"pg\" data-n=\"71\">71<\/span>ПТ глава, Кыргыз Республикасынын жараны д"},{"t":"p","h":"11 глава"}],"sub":[],"section":"§ 9. Кыргыз Республикасынын Президенти —","pages":[69,71]},{"title":"§ 15. Кыргыз Республикасынын жаранынын","blocks":[{"t":"h3","h":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЖАРАНЫ"},{"t":"h3","h":"§ 15. Кыргыз Республикасынын жаранынын"},{"t":"p","h":"укуктары жана милдеттери"},{"t":"p","h":"Кыргыз Республикасынын жаранынын укуктары жана милдеттери Кыргыз Республикасынын Конституциясында бекемделген. Жарандык – бул адамдын кандайдыр бир мамлекетке таандык экендиги. Укуктар менен милдеттердин жыйындысы мамлекетте жарандык укук абалын түзөт да, ошол аркылуу алар чет өлкөлүк жарандардан айырмаланат."},{"t":"p","h":"Кыргыз Республикасынын жарандары бирдей укуктарга ээ. Алар тегине, социалдык жана мүлктүк абалына, расасына жана улутуна, жынысына, билимине, тилине, туткан динине, ишинин түрүнө жана мүнөзүнө, жашоо ордуна жана башка жагдайларга карабастан, мыйзам алдында бирдей абалда болушат."},{"t":"p","h":"Кыргыз Республикасынын жарандарынын укуктары жана милдеттери жөнүндөгү мыйзамдар бардык жарандарга карата бирдей колдонулат, бирок жарандарды социалдык жактан коргоо үчүн каралган чаралар (жөлөк пул, стипендия) бардыгына эле колдонула берилбестиги түшүнүктүү. Себеби, ал чараларга кимдер муктаж болсо, ошолорго гана берилет. Ошондой эле, Ата Мекенди коргоо милдети да коргоого жарамдуу жарандарга гана тарары белгилүү."},{"t":"p","h":"Кыргыз Республикасынын жарандары түздөн-түз жана Өздөрүнүн өкүлдөрү аркылуу мамлекетти башкарууга, республикалык жана жергиликтүү маанидеги мыйзамдарды, чечимдерди талкуулоого жана кабыл алууга катышууга, мамлекеттик кызматка турууга бирдей укуктуу. Жарандардын мамлекетти башкарууга түздөн-түз катышуусунун күбөсү, Т1"},{"t":"p","h":"<span class=\"pg\" data-n=\"72\">72<\/span>ГИ глава. Кыргыз Республикасынын жараны"},{"t":"p","h":"алардын Кыргыз мамлекетинин башчысын – Президентти шайлашы, мыйзам чыгаруу бийлигинин өкүлү болгон – Жогорку Кенешти шайлашы болуп эсептелет. Ошондой эле Жогорку Кенештин депутаттары элдин өкүлү болгондуктан, эл өкүлдөрү аркылуу мамлекетти башкаруу принцибинин аткарылышын камсыз кылышат. Мамлекеттик эн маанилүү маселелердин чечилиши, Конституцияга киргизилүүчү өзгөртүүлөр жана толуктоолор, кээ бир мыйзамдардын кабыл алынышы бүткүл элдик добуш берүүгө коюлуу менен чечилет."},{"t":"p","h":"Кыргыз Республикасынын жарандары мекенди коргоого, эмгектенүүгө, социалдык камсыздандырылууга, билим алууга, ден соолугун сактоого укуктуу. Бул укуктарды билүү өзгөчө маанилүү болгондуктан, өз-өзүнчө талдайбыз."},{"t":"p","h":"Конституциянын 55-беренесинде жарандардын мыйзамдарга ылайык салык жана жыйым төлөөгө милдеттүүлүгү көрсөтүлгөн. Мамлекетибиз рынок экономикасына өтүп жаткан чакта бул жобо мамлекеттин иштешине жана жашашына чоң таасир көрсөтүүчү жобо болуп эсептелет. Анткени, азыр мамлекеттик ишканалар жана чарбалар жокко эсе, көбү менчиктештирилип, элдин менчигине өткөрүлүп берилген. Демек, алардан түшкөн киреше элдин колуна тиет, ал эми мамлекеттик органдарды күтүү үчүн, мугалимдерге, врачтарга айлык төлөө үчүн, окуу жайларын, мектептерди, ооруканаларды күтүү үчүн, кары-картандарга пенсия төлөө үчүн, студенттерге стипендия бериш үчүн каражат салыктардан топтолот. Ошондуктан, салыкты убагында так телеп туруу иштеп жаткан жарандардын конституциялык милдети катары көрсөтүлгөн. Салык телееден баш тарткан же кирешесинин өлчөмүн жашырып, салыкты аз төлөгөндөр үчүн кылмыш жоопкерчилиги каралган."},{"t":"p","h":"Кыргыз Республикасынын жараны эс алууга укуктуу. Жумушчулар, кызматчылар иштөөчү убактын узактыгы, ар жумадагы эс алуу күндөрүнүн саны жана жыл сайын акы та <span class=\"pg\" data-n=\"73\">73<\/span>ПТ глава. Кыргыз Республикасынын жараны"},{"t":"p","h":"теленуучу эс алуу оргуулерунун узактыгы, ошондой эле эс алуу укугунун башка шарттары мыйзамдар тарабынан женге салынат. Биздин өлкөдө дем алыш, майрам, өргүү күндөрү жылына 150 күнгө жакындайт. Әмгекке жумшалган күчтү калыбына келтирүү, үй чарбасында иштөө, балдарды тарбиялоо, жаккан ишин жасоо, чыгармачылык ж. у. с. жумуштар үчүн бул убакыт жетиштүү."},{"t":"p","h":"Кыргыз Республикасынын жарандары турак-жайга ээ болууга укуктуу. Мамлекет турак-жайга болгон укукту ишке ашырууда, мамлекеттин турак-жай фондусунан үй берүү же сатуу жолу менен көмөктешәт. Турак-жайга муктаж болгон адамдар иштеген жери же жашаган жери боюнча кезекке турушат. Ошол кезек боюнча мамлекет тарабынан же ишкана, мекеме тарабынан курулган үйлөрдөн квартира алышат. Мамлекет жеке турак-жай кургандарга да ссуда, кредит берүү менен көмөктөшөт. Азыркы мезгилде турак-жайга болгон адамдардын укугу кеңейтилген, мурдагы СССРдин тушунда бир үй-бүлө бир гана үй же квартира ээлөөгө укуктуу болуучу, азыр мүмкүнчүлүгүнө жараша каалаган сандагы үйлөрдү, квартираларды сатып алууга же куруп алууга мыйзам тыюу салбайт."},{"t":"p","h":"Кыргыз Республикасынын жарандары саламаттыгына жагымдуу жана ыңгайлуу айлана-чөйрөдөн, жаратылыштан пайдаланууга, ошондой эле жаратылыштан пайдалануу тармагындагы аракеттерден улам саламаттыгына келтирилген залалдын, мүлкүнө келтирилген зыяндан ордун толтуруп алууга укуктуу. Бул укукту камсыз кылуу үчүн Кыргыз Республикасында «Жаратылышты коргоо жөнүндө» мыйзам кабыл алынган. Ал мыйзамда жаратылышты коргоо боюнча жарандардын, мамлекеттин, ишканалардын, ар кандай чарба жүргүзүүчү субъектилердин милдеттери аныкталган. Жаратылышты коргоо эрежелерин бузгандар кандай жоопкерчиликке тартылары белгиленген. Жаратылыш объектилерин бузгандар кылмыш жообуна да тартылышы мүмкүн."},{"t":"p","h":"Жарандар маданий дөөлөттөрдөн пайдаланууга, керкем ТЗ"},{"t":"p","h":"<span class=\"pg\" data-n=\"74\">74<\/span>ШП глава. Кыргыз Республикасынын жараны"},{"t":"p","h":"өнөр, чыгармачылык, илим жаатында иштееге укуктуу. Бул укук мамлекет тарабынан тарыхый эстеликтердин корголушу, адабият, көркөм өнөр, илим, массалык-маалымат каражаттарынын жана спорттун енугушу үчүн кам көрүшү, зарыл шарттарды түзүшү менен камсыз кылынат."},{"t":"p","h":"Биздин жарандарга берилген чоң укуктардын бири – ал экономикалык эркиндик. Муну кандай деп түшүнсө болот. СССРдин тушунда ишкердикти жүргүзүшсө кылмыш жообуна тартылышчу, жарандардын менчигинде өндүрүш каражаттарынын болушуна тыюу салынган. Азыр болсо ар бир жаран ишкана ачууга, дыйкан чарбасын жүргүзүүгө, башка иш менен алектенип, өзүнүн жана үй-бүлөсүнүн турмуш шартын жакшыртууга акылуу. Мындай шартты коомубуздагы демократиянын жеңиши деп түшүнүү керек."},{"t":"h3","h":"КОШУМЧА МАТЕРИАЛ"},{"t":"v","l":["Кыргыз Республикасынын Конституциясы","{Үзүндү)","50-берене"]},{"t":"p","h":"1. Жаран өзүнүн жарандыгына жараша укуктарга эз жана милдеттерди аткарат."},{"t":"p","h":"2. Бир дагы жаран өзүнүн жарандыгынан жана өзүнүн жарандыгын өзгөртүү укугунан ажыратылышы мүмкүн эмес. Кыргыз Республикасынын жарандары болуп эсептелген адамдардын мыйзамдарга жана Кыргыз Республикасы катышуучу болуп саналган эл аралык келишимдерге ылайык башка мамлекеттин жарандыгына тийиштүүлүгү да таанылат."},{"t":"p","h":"3. Кыргыз Республикасынын чегинен тышкары жашаган кыргыздар башка мамлекеттин жараны болгондугуна карабастан, женекейлештурулген тартипте Кыргыз Республикасынын жарандыгын алууга укуктуу."},{"t":"p","h":"Кыргыз Республикасынын жарандыгын берүүнүн тартиби жана шарты мыйзам менен аныкталат."},{"t":"p","h":"4. Жаран республиканын чегинен сыртка чыгарып салынбайт же башка мамлекетке берилбейт."},{"t":"p","h":"<span class=\"pg\" data-n=\"75\">75<\/span>ПП глава. Кыргыз Республикасынын жараны ь"},{"t":"p","h":"5. Кыргыз Республикасы ез чегинен тышкы жерлерде жарандарын коргоого жана калкалоого кепилдик берет."},{"t":"p","h":"А"},{"t":"h3","h":"е КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"p","h":"1. Укуктар бардык жарандар үчүн бирдейби?"},{"t":"p","h":"2. Жарандар мыйзам тарабынан уруксат берилген иштерди гана"},{"t":"p","h":"жасай алабы же мыйзам тарабынан тыюу салынбаган, каалаган иштерин жасайбы?"},{"t":"p","h":"3. Жарандардын Конституция тарабынан бекемделген укукта-"},{"t":"p","h":"рын айтып бер?"},{"t":"p","h":"4. Жарандардын кандай милдеттери бар?"},{"t":"p","h":"5. Жарандардын көрсөтүлгөн милдеттерин негиздеп айтып бер?"}],"sub":[],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЖАРАНЫ","pages":[72,75]},{"title":"§ 16. Ата Мекенди коргоо","blocks":[{"t":"h3","h":"§ 16. Ата Мекенди коргоо"},{"t":"p","h":"Кыргыз Республикасынын Конституциясынын б6-беренесинде Ата Мекенди коргоо жарандардын ыйык парзы жана милдети деп белгиленген."},{"t":"p","h":"Жарандарды аскер кызматын өтөөдөн бошотуунун же аны альтернативалык (аскерден тышкары) кызмат менен алмаштыруунун негиздери жана тартиби мыйзам менен белгиленет."},{"t":"p","h":"Конституциянын бул беренеси Кыргыз Республикасынын «Жалпы аскердик жөнүндөгү» мыйзамында кеңири баяндалган. Бул мыйзамда аскер кызматы республиканын жарандарынын ардактуу милдети, Мекенди коргоо ар бир жарандын ыйык парзы деп көрсөтүлгөн."},{"t":"p","h":"Бул мыйзам боюнча Кыргыз Республикасынын бардык эркек жарандары тегине, социалдык жана мүлктүк абалына, расасына жана улутуна, саясий жана башка көз караштарына, билимине, динге болгон мамилесине, ишинин түрүнө жана мүнөзүнө, жашаган жерине карабастан, мамлекетибиздин Куралдуу Күчтөрүнүн катарында аскер кызматын өтөөгө милдеттүү."},{"t":"img","src":"data:image/webp;base64,UklGRiAwAABXRUJQVlA4IBQwAADwXAGdASqAAswBPrVQo06nJCemIpA78PAWiWlu1PAncugf9sV/tqw2Pcv1+Ff7b9hvWx56Y7us8ca5H+efqyP3828S5KodpyO9rLtcdmoyGAK4gBaX73WHNb0qVYQakce2hGdYc1vSp2uQHNb0qdrkBXIGUgzAei2whhCOfu27CtPTMvKPSsJcBedrXTrCIl09Gto6JhISgcOvmKeHzQRQetbJ3tLtw6SbbUm1p5FnCg9UkOIR8GdZyooPVJD0AiVGqNh9c8gVxon9FxY6eAfcZVWMVJFGHjZ5taeRZwoPUZjzH8zK1H9J0O5K24CBuZ6KqAZoPsl+Fg/JajxAIm4gm8ZVooW4WMzZsyTxogu+p9ujxQmmE2WiCb+yfIGxYohUHWO/mEHRvyjQ8QAltCwffT9Wu19PXlRnCTwJT36gj/6+7aCxkiwb6pP95/sPl9QQs3YDxXUms445nFm61ndH9D6KuBv2S72d5hgZET0QgLOx0zra4VhbY65504BpeHkJl3DIWWr8Q+Jd0w3oVHW1JMZoojj+rRr/wRru7fC2DosvRGuOWMvEFw5dn+Smu4eYXBBfHgbRLuI7SfjSQ9QFmW8x5ysOX3IkqYzC+g0AHwpBchf3FjLc/0miy0H36ufE1TU1NxpbzzAVxOx9JVp4WeiuSTz/8z4mc6N8IwjmlpBfvSC1vazCNC03HKEof4rD9VXuR1n4+RsaDVtBbVudTO2qRZRTiuhfwwitXTR1NP+t8brZ1Cej+634K36WdjccHMOZsNVO3Dd+xF/ktjzKMiq93VzhDTo7E/3W8e0tdo3dbzUi/2si8ov9dh5hRirsPCIEtUxg3EsYoNUyY8RwYtc4DB2GdcJ/LjWqyDQP7rUjq5CnwALaamgcgsB+0wSxPiNjle6viFE6He4GtJIh2kv9/bw8uv65bUqMQqmnZMU36aU3P5yFPu/EwWSewv3gIP/25rzYqNH0hKE7vSfJf3pmuHJqB0Jj+vcu4vXp0Y9jajdqTj9nApgxd/DThfUhReg2e/4G0xDOHYRnYbZfuurJ3Rjy5xpAfGjaVd8dQlOFJ5b2trh2YOr6RtBn3Rhox9ZrgKuPC3m8c8zKOz0g34+nWmZncY5VU1FS0X86VNdHrCVou2+dIX1KGNkpGXgDIDk4opx9mQYCt7SarvzegAb4Czt+Ocmo7kTKN9NpRPRK8MDvGomjLiphxwIkAeKOZajcf784QIvqxdYAN0+piksVqtTpkAb2TVr1UDHGxfounMx8OXvzMHCCPGrQWgGKoQwKsmaYajnV2edhCeENdjub1QBwd8v/rPqiKghd7YxiznfCZtOzqEtIOAk6wwVhO2n6vSIboUanEgcSvMlIcgFmhamGVVT/t7OKDaKHtIAbP0VDH5vSN7F25Uaw6ULqczbtHsBIIkFzzYxwx628npr5Cb3tNW3jSgVWJH/fJFjPeemGYdT1VLi7xkEj1JyYJ8zi/wp/SHALXmW1Nub2MTrhiMh5sCwXf7oiEbnym8RR35e0QeMcculvH00IZNT8LQAjsO7GUVjQpJlUV2TCsVQOFZQGZlMvpEwjPZUn6QqgohVlTO9P2bh1Gr8tQRONt2dnQiuw4JV4duwf8 Президентинин жарлыгы боюнча жүргүзүлөт. Чакырылуучу жарандардын санын Кыргыз Республикасынын екмету белгилейт. Ал эми жарандардын чакыруу участкаларына келчү так күнү аскер комиссариаттары тарабынан аныкталат."},{"t":"p","h":"Мыйзамда чакыруунун бирдиктүү курагы 18 жаш болуп аныкталган. Ушул курактагы жаштар орто билим алууну аякташат. Алардын дене жагынан өсүшү аскер кызматын эотееге байланыштуу иштерди аткарууга мүмкүндүк берет."},{"t":"p","h":"Аскер кызматын өтөө, Мекенди коргоо ар бир жарандын ыйык милдети экендиги шексиз. Биздин ата-бабалар эл үчүн, жер үчүн күрөшүп, жандарын кыйышкан. Алар сактап келген элди, жерди коргоо – азыркы жана келечек муундардын милдети."},{"t":"p","h":"Кыргыз Республикасынын жарандары Куралдуу Күчтөрдө кызмат өтөөдөн тышкары, чек араны коргоо аскерлеринде, Улуттук Гвардияда, Ички аскерлерде кызмат өтөөгө даярдыгы жетиштүү, татыктуу жарандардан чакырылат. Анткени, чек араны ар кандай бузуулар болуп кетиши мүмкүн, ошондуктан жоокерлер согуштук абалда кызмат өтөшөт."},{"t":"p","h":"Улуттук Гвардияга да даярдыгы жетиштүү, билимдүү жана дене түзүлүшү ылайык келген уландар чакырылат, алар ар кандай ардактуу кароолдордо турушат. Өлкөбүзгө расмий визит менен келген башка мамлекеттердин башчыларын тосуп алууда ардактуу кароолдо турушат."},{"t":"p","h":"Ички аскерлердин негизги милдети мамлекеттеги коомдук тартипти сактоону камсыз кылуу болуп эсептелет. Алар массалык тартипсиздик чыгып кетсе, аны жоюу үчүн, табигый кырсыктардын убагында коомдук тартипти коргоо үчүн, камоо жайларын кайтаруу үчүн пайдаланылат."},{"t":"p","h":"Аскер кызматчылары – Кыргыз Республикасынын толук укуктуу жарандары. Алар жарандарга берилген бардык укуктардан жана эркиндиктерден пайдалана алышат. Бирок, алар кандайдыр бир саясий партияга мүчө болушуна же колтт"},{"t":"p","h":"<span class=\"pg\" data-n=\"78\">78<\/span>Г глава, Кыргыз Республикасынын жараны"},{"t":"p","h":"доп чыгышына жол берилбейт. Бул чектөө аскерлердин жалпы мамлекетке, элге кызмат кылышын шарттайт."},{"t":"p","h":"Ушуну менен бирге аскер кызматчыларынын өкүлдөрүнө гана тиешелүү укуктары жана милдеттери бар. Алар «Жалпы аскерге милдеттүүлүк жөнүндөгү» мыйзамда, аскердик антта, уставдарда баяндалган."},{"t":"p","h":"Ошондой эле, аскер кызматчылары бир катар атайын укуктарга да ээ. Мисалы, аскер кызматчысы кароолдук, патрулдук же суткалык наряддын курамында турганда ага атайын укуктар берилет. Кароолдо турганда жоокер зарылдыгына, жагдайга жараша курал колдонууга да укуктуу."},{"t":"p","h":"Тагылган милдеттерге жараша аскер кызматчыларынын жоопкерчилиги бир кыйла катуу белгиленген. Алар жазыгына жараша тартиптик, материалдык, администрациялык жазага жана кылмыш жообуна тартылышы мүмкүн. Тартиптик жазаларга эскертүү, сөгүш, катуу сөгүш жарыялоо, кезексиз нарядга тургузуу, гауптвахтага камоо, аскердик наамын төмөндөтүү ж. б. у. с. кирет. Жоокерлердин материалдык жоопкерчилиги аскер кызматчыларынын материалдык жоопкерчилиги жөнүндөгү жобо менен жөнгө салынат. Майданда зыянга учураган же жараксыз абалга келген курал-жарактарынын наркын төлөөгө жоокер милдеттүү эмес. Эгер аскер кызматчысынын шалаакылыгынан аскердик мүлккө зыян келсе, анда ал келтирилген зыянды толугу менен төлөөгө тийиш."},{"t":"p","h":"Бардык адамдар үчүн, алардын ичинде аскер кызматчылары үчүн да милдеттүү болгон жүрүш-туруш эрежелерин бузгандык үчүн, мисалы, жол кыймылынын эрежелерин бузгандыгы үчүн администрациялык жаза колдонулат."},{"t":"p","h":"Аскер кызматчыларын кылмыш жоопкерчилигине тартуу жалпы негиздерде эле жүргүзүлөт. Мындан тышкары, Кылмыш жана жаза кодексинде аскердик кылмыштар жөнүндө бөлүм бар, анда каралган кылмыш жасалса, ал үчүн да жооп беришет."},{"t":"p","h":"ТВ <span class=\"pg\" data-n=\"79\">79<\/span>ПТ глава. Кыргыз Республикасынын жараны"},{"t":"p","h":"Өлкөбүздүн коопсуздугун коргоп, тынчтыкты сактап туруу үчүн Куралдуу Күчтөрдүн мааниси зор. Бирок, бул маселе боюнча аскерлердин күчтүүлүгүнө эле таянбастан, башка мамлекеттер менен тынчтыкта жашоо үчүн мамиле орнотуу талапка ылайык. Бул жагдайда биздин мамлекетибиз кол койгон келишимдер өтө маанилүү. Аскердик келишим Кыргызстан тарабынан КМШга кирген мамлекеттер менен да түзүлгөн. Бул мамлекеттер менен аскердик иштер боюнча кызматташтык кеңири. Ошондой эле, Кыргызстан, Казакстан, Өзбекстан мамлекеттери «Түбөлүк достук жөнүндөгү» келишимге кол коюп, ушул үч мамлекеттин бирине кол салуу бардык үч мамлекетке тең кол салуу деп табыларын жана алар чогуу коргонушарын белгилешти. Ошондой эле «Коллективдүү коопсуздук» келишими Кыргызстан, Россия, Казакстан, Белоруссия, Тажикстан жана Армения мамлекеттеринин ортосунда түзүлгөн. Кыргыз Республикасы НАТО менен бирдикте «Тынчтык үчүн кызматташтык» деген келишим түзгөн. Бул блок менен тынчтыкты бүт дүйнөдө сактоо үчүн иштер жүргүзүлүүдө."},{"t":"p","h":"Ушул жүргүзүлүп жаткан иштердин бардыгы – өлкөбүздүн коопсуздугун коргоп, тынчтыкты сактап, натыйжада элдин жыргалчылыгын камсыз кылууга жасалган аракет."},{"t":"h3","h":"КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"p","h":"1. Кыргызстандын жарандарынын Мекенин коргоого укугу жана"},{"t":"p","h":"милдеттүүлүгү кайсы укуктук документте белгиленген?"},{"t":"p","h":"2. Аскер кызматын кимдер өтөй алышат?"},{"t":"p","h":"3. Аскер кызматын етееден бошотуу кандай негиздерде жүргү-"},{"t":"p","h":"зүлөт?"},{"t":"p","h":"4. Аскер кызматын өтөө үчүн чакыруулар кайсы мезгилдерде"},{"t":"p","h":"жүргүзүлөт?"},{"t":"p","h":"5. Кыргыз Республикасында аскер бөлүктөрүнүн кандай турлеру"},{"t":"p","h":"бар жана алардын милдеттери жөнүндө эмнелерди билесиң?"},{"t":"p","h":"<span class=\"pg\" data-n=\"80\">80<\/span>си, дс | ПТ глава. Кыргыз Республикасынын жараны"},{"t":"p","h":"6. Аскер кызматчыларынын укуктары кандай?"},{"t":"p","h":"7. Аскер кызматчыларынын кандай жоопкерчиликтери бар?"},{"t":"p","h":"8. Кыргыз Республикасында тынчтыкты сактоо үчүн кандай иш-"},{"t":"p","h":"тер аткарылууда?"}],"sub":[],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЖАРАНЫ","pages":[76,80]},{"title":"§ 17. Нике жана үй-бүлө, ата-эне жана бала","blocks" болбойт."},{"t":"p","h":"Кодекс тарабынан никеге туруунун ыктыярдуулугу белгиленген. Никеге туруу үчүн эркектин да, аялдын да макулдугу талап кылынат. Никеге туруу үчүн арыз берилгенден кийин ЗАГС органдары жаш жубайларга ойлонуу үчүн бир айлык мөөнөт берет. Әгер, никеге турууну алар чындап чечкен болсо, бир айдан кийин каттоодон өтүшүп нике тууралуу күбөлүгүн алышат. Бул шарттын туура экендигин тажрыйба көргөзүп жүрөт, анткени бир топ учурларда жаштар никеге туруу жөнүндө арыз берип, сыноо мөөнөтү бүткөндө кайра келишпейт. Бул болсо, алардын никеге туруу жөнүндөгү чечимди шашып кабыл алгандыктарын көрсөтөт."},{"t":"p","h":"<span class=\"pg\" data-n=\"82\">82<\/span>©. де Ш глава. Кыргыз Республикасынын жараны"},{"t":"p","h":"Ал эми сыноо мөөнөтүн өткөрүп, никеге туруп, нике күбөлүгүн алгандан кийин жаш жубайларда бири-бирине карата белгилүү укуктар жана милдеттер пайда болот. Булар жекече жана мүлктүк болуп бөлүнөт."},{"t":"p","h":"Мисалы, фамилияны тандоо жекече укуктарга кирет. Өзүнүн каалоосу менен жубайлардын бири же күйөөсүнүн же аялынын фамилиясына өтө алат, же болбосо ар кимиси өзүнүн мурдагы фамилияларын сактап кала алат. Ишти, кесипти тандоо боюнча жубайларга жекече укук камсыз кылынат. Никелешүүдөн кийин жашоо ордун тандоодо да жубайларга жекече укуктар берилет. Бул жөнүндө үйлөнгөнгө чейин эле макулдашып алуу керек, күйөө менен колукту ар башка шаарлардан, райондордон, айылдардан болгон учурларда бул өзгөчө зарыл."},{"t":"p","h":"Жубайларга мыйзам боюнча үй-бүлөлүк турмуштун жана балдарды тарбиялоонун маселелерин биргелешип чечүү укугу берилген. Үй-бүлөлүк иштерде акыл-эс менен макулдашып маселе чечүү —- жаш жубайлардын алдындагы эн негизги милдет."},{"t":"p","h":"Жубайлардын мүлктүк укуктары төмөндөгү жобого негизделет:"},{"t":"p","h":"Никеге чейинки ээ болгон бардык мүлктөрү күйөөсүнүн же аялынын өздүк менчиги болуп, ал эми никеге турган мезгилде ээ болгон мүлктөрү жубайлардын жалпы менчиги болуп эсептелет."},{"t":"p","h":"Үй-бүлөнүн бузулушу – жубайлар үчүн да, ошондой эле жалпы коом үчүн да терс көрүнүш. Бир эле үй-бүлө бузулганда коомдун маанилүү очогу бузулуп, анын туруктуулугу начарлайт. Тилекке каршы, никеден ажырашуулардын саны али да болсо арбын. Мындай терс көрүнүштү болтурбоо үчүн үйлөнүү маселесине женил карабай, бардык жактан таразалап, көңүл менен турмуш куруу жана андан кийин да үй-бүлөнү ыйык тутуп, сактай билүү зарыл."},{"t":"p","h":"Үй-бүлөнүн бузулушу – никеден ажырашуунун бирден-бир негизи болуп эсептелет. Үй-бүлөнү сактап калуунун кан- <span class=\"pg\" data-n=\"83\">83<\/span>=. ГП глава. Кыргыз Республикасынын жараны 5. 45"},{"t":"p","h":"дайдыр бир мүмкүндүгү болгондо сот жана ЗАГС органдары жубайларды жараштыруу үчүн бардык чараларды көрүүгө милдеттүү."},{"t":"p","h":"Конституциябызда белгиленгендей, балага камкордук көрүү – ата-эненин милдети, ошондой эле жашы жеткен, эмгекке жарамдуу балдар дагы ата-энесине камкордук көрүүгө милдеттүү."},{"t":"p","h":"Үй-бүлөнүн башкы максаты – балдарды тарбиялап өстүрүү. Көпчүлүк ата-эне бардык мүмкүнчүлүгүн балдары үчүн жумшап, аларга жакшы билим берип, келечектеги турмушунун жакшы болуусуна аракет кылышат. Бирок, тилекке каршы, балдарына такыр көнүл бурбаган, өзүлөрү ичкиликке берилип кеткен, натыйжада балдары окубай же тамакка курсагы тойбой, көчөдөгү ар кандай жаман иштерге аралашып, аягында кылмыштарды жасоого барып жаткан учурлар да жок эмес."},{"t":"p","h":"1959-жылдын ноябрында БУУнун Генералдык Ассамблеясы тарабынан кабыл алынган Балдар укуктарынын декларациясында мындай деп айтылган: «Балага мыйзам жана"},{"t":"p","h":"Жарандыкты Цин жана"},{"t":"v","l":["ыйман","жөнүндө","эркин ой","жүгүртүүгө","укуктуу"]},{"t":"p","h":"апууга жана ата-энесинин камкордугуна"},{"t":"img","src":"data:image/webp;base64,UklGRnQrAABXRUJQVlA4IGgrAAAw+wCdASrSAZEBPrVWpU0nJKerplNKuXAWiWluZa3DwYBWCpCNLjHdg/feDed5wkvfNl7atcGJD6dj3K/6Xxb/IPs/9PmsfzD8S/1f8p6VeD/zH+kvYF/Lf6J/uP71wsIA/0D/F+BDrf+Nde4oFeTB/vefz8wJbChSFXk78crCWSqKwEvCjrsc/skOrlWxJ7/rq21lhqcztofEF9weQ7Ku/fqu5T

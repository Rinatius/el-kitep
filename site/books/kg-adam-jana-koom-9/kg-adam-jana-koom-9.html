 Республикасынын Суу кодекси. Анда суу тууралуу, суу мамилелерин кандай органдар жөнгө салары, сууну пайдалануу тартиптери, сууну сактоо жана анын зыяндуу таасирин алдын алуу боюнча жоболор, сууну пайдаланууну мамлекеттик эсепке алуу тартиптери жана суу тууралуу мыйзамдарды бузгандык үчүн жоопкерчиликтер каралган."},{"t":"p","h":"6. Токой укугу. Кыргыз Республикасында токойлор экономиканы өстүрүүдө, курчап турган чөйрөнү жакшыртууда, калктын жыргалчылыгын жогорулатууда зор жардамы бар. Алар өлкөбүздүн жыгач жана башка токойдон алынуучу продукцияга болгон керектөөлөрүн канааттандыруунун булагы болуп эсептелет. Аба ырайына, атмосферага, дарыялардын жана башка суу объектилеринин гидрологиялык режимине <span class=\"pg\" data-n=\"123\">123<\/span>(Ой У глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"ынгайлуу таасир көрсөтөт, жер кыртышын суу жана шамал эрозиясынан сактайт, мындан башка да пайдалуу табигый касиеттерге ээ. Токойлор ден соолукту чындоо максатында, калктын маданий жана эстетикалык талаптарын канааттандыруу үчүн улам барган сайын көбүрөөк пайдаланылып жатат."},{"t":"p","h":"Биздин өлкөдөгү мамлекеттик жана жергиликтүү мааниси бар токойлор көбүнчө суу коргоочу, сактоочу, санитариялык-гигиеналык жана ден соолукту чындоочу милдеттерди аткарышат. Чарбага пайдаланылуучу токойлорубуз өтө аз. Жыгач негизги курулуш каражаты экендиги белгилүү, ал эми токой болбосо, жыгач дагы болбойт да, ошондуктан курулушта пайдаланылуучу жыгач алына турган токойлорду көбөйтүүгө чаралар көрүлүп жатат."},{"t":"p","h":"Токойлордун көп түрдүү мааниси болгондуктан жана аларды өстүрүү узакка созулгандыктан, токой байлыктарын максатка ылайыктуу пайдалануу, сактоо жана көбөйтүү жалпы мамлекеттик милдет болуп эсептелет. Ошондуктан, бул проблемага тиешелүү көңүл бурулуп, токой мамилелерин жөнгә салуу укугу өзүнчө укук тармагы болуп табылган жана токой жөнүндөгү мыйзамдар бириктирилип, Кыргыз Республикасынын Токой кодекси иштелип чыккан."},{"t":"p","h":"Кыргыз Республикасынын Токой кодекси токойлорду илимий жактан негизделген комплекстүү пайдаланууга, азыркы учурдун жана келечектин таламдарына ылайык аларды көбөйтүп өстүрүүгө жана натыйжалуу коргоого, биздин Ата Мекенибиздин жаратылыш байлыктарынын эң маанилүү курамдык бөлүгү катары токойго сарамжалдуулук жана чарбакечтик менен мамиле кылууга жоопкерчиликти сезүүгө жарандарыбызды чакырат жана милдеттендирет."},{"t":"p","h":"Т. Тоо-кен укугу. Кыргыз Республикасынын Конституциясы боюнча жер алдындагы байлыктар мамлекеттин менчиги, элибиздин энчиси болуп эсептелет."},{"t":"p","h":"Кыргыз Республикасында кен байлыктардын көптөгөн запастары бар. Ошону менен бирге аларды керектөөнүн барган сайын өсүп жатышы пайдалуу кен байлыктарды илимий"},{"t":"p","h":"<span class=\"pg\" data-n=\"124\">124<\/span>У глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"негизде, натыйжалуу пайдалануунун маанисин жогорулатып, бардык ишканалардын, уюмдардын жана жарандардын жер алдындагы байлыктарга сарамжалдуулук менен мамиле жасоосун талап кылат."},{"t":"p","h":"Мамлекетибиз кен байлыктарга болгон муктаждыктарыбызды камсыз кылууну гана максат кылбастан, келечектеги муундарыбыздын да муктаждыктары үчүн жаратылыш байлыктарын сактоого камкордук көрүүгө тийиш. Анткени, кен байлыктар жаңыдан пайда болбойт, болгонун казып алгандан кийин калбай калат. Мунун өзү кен байлыктардын кандай маанилүү экендигин көрсөтүп турат."},{"t":"p","h":"Ошондуктан, тоо-кен мамилелерин мыйзам чегинде жөнгө салуу үчүн өзүнчө тоо-кен укугу деген тармак келип чыккан жана бул жагдайды аныктаган мыйзамдар топтолуп, тартипке келтирилип, Жердин ички казынасы жөнүндөгү кодекс иштелип чыккан. Бул кодекстин милдети минералдык сырьёну керектөө жана башка муктаждыктарды канааттандыруу үчүн жер алдын натыйжалуу, сарамжалдуу жана ар тараптан пайдаланууну камсыз кылуу, жер алдын коргоо, жер алдын пайдаланган кезде жумуштардын коопсуздугун камсыз кылуу максатында тоо-кен мамилелерин жөнгө салуу, ошондой эле тоо-кен жаатында ишканалардын, уюмдардын, мекемелердин жана жарандардын укуктарын коргоо жана мыйзамдуулукту чындоо болуп саналат."},{"t":"p","h":"Биз жогоруда мамлекеттин түзүлүшүн жана анын байлыгынын негизин түзө турган укук тармактары менен тааныштык. Кийинки карала турган укук тармактарын мамлекеттик органдардын функциясын аныктоочу жана алар менен жарандардын ортосундагы коомдук мамилелерди женге салган укук тармактары деп шарттуу түрдө атаса болот. Мындай укук тармактарына теменкулер кирет."},{"t":"p","h":"8. Администрациялык укук – мамлекеттик башкаруу органдарын уюштурууда жана алардын аткаруу – тескөө ишаракетинин жүрүшүндө келип чыгуучу мамилелерди жөнгө"},{"t":"p","h":"<span class=\"pg\" data-n=\"125\">125<\/span>глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"салат. Администрациялык укуктун ченемдери аткаруу-тескөө иш-аракетин жүргүзгөн органдарды түзүүнүн, өзгөртүүнүн, жоюунун эрежелерин, ушул органдардын, алардын кызматкерлеринин, ошондой эле ушул жагдайдан жарандардын укук-милдеттерин аныктайт. Администрациялык укукта башкаруунун тармактары боюнча органдардын укук-милдеттери аныкталат. Мындай органдарга, эсеп-кысап, каржылоо, өнер жай, курулуш, айыл чарба, транспорт, байланыш, билим берүү, илим, маданият, саламаттык сактоо, социалдык камсыздандыруу, коргоо, коопсуздукту сактоо, коомдук тартипти сактоо, юстиция органдары кирет. Айтылган органдардын иштөө тартиби администрациялык укук менен женге салынат."},{"t":"p","h":"9. Финансы укугу же бюджеттик укук. УкуЁтун бул тармагы мамлекеттин каржылоо иштерин жүргүзүү процессинде пайда болгон коомдук мамилелерди жөнгө салат. Мисалы, мамлекеттик органдардын иштеши үчүн, алардын кызматкерлерине айлык телее үчүн, ошондой эле билим берүү, саламаттык сактоо, бааракы, желек пул төлөө үчүн мамлекет киреше топтойт, аларды жогоруда көрсөтүлгөн максаттарга жумшайт. Мамлекеттин казынасына, башкача айтканда бюджетке акча топтоо, кирешелерди жана чыгашаларды укуктук жактан женге салуу, насыялоо, эсептешүү жана акча жүгүртүүнүн укуктук негиздери, мамлекеттик жана жергиликтүү бюджеттердин айырмачылыктары, бири бирине болгон карым-катнаштары боюнча маселелер жөнгө салынат."},{"t":"p","h":"10. Салык укугу. Мамлекетибиз рынок экономикасына өтүп жаткан еткеел мезгилдин шартында укуктун бул тармагынын мааниси етө жогору. Анткени, мурда бардык ишканалар мамлекеттин менчигинде болуп, алардан түшкөн кирешелер мамлекеттин бюджетин түзүүчү. Азыр болсо ишканалар, колхоз-совхоздор дээрлик менчиктештирилген, алардан түшкөн кирешелер менчик ээлеринде калат. Ал эми бюджет болсо, негизинен салыктардан түзүлүп калды. Салыктар <span class=\"pg\" data-n=\"126\">126<\/span>©з. э у глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"алынган пайдадан, кирешеден, бажы төлөмдөрүнөн, жерди, сууну пайдалануудан түшкөн телемдерден топтолот."},{"t":"p","h":"Кыргыз Республикасында бул коомдук мамилени жөнгө салуу боюнча Салык кодекси иштелип чыккан, ал боюнча ар бир ишкер адам, жаран тапкан кирешесинин аныкталган өлчөмүн салык катары төлеп турууга тийиш. Салык канчалык кеп төлөнсө, экономикабыздын ошончолук өсүп жатканын билдирет жана мамлекет тарабынан каржыланган иштердин жакшыруусун шарттайт. Салык төлөөдөн баш тартуу кылмыш катары каралып, жоопко тартылууга жатат."},{"t":"p","h":"Жарандардын Конституция тарабынан бекемделген укуктарынын маанилүүлөрү да өзүнчө укуктун тармагы болуп белгиленген, мындай укуктун тармактарына төмөнкүлөрдү кошсо болот."},{"t":"p","h":"11. Эмгек укугу – жумушчулар менен кызматчылардын ишкана, уюм, мекемелердеги жана башка иш берүүчү жактардагы эмгегин жөнгө салат. Эмгек укугу эмгектенүүгө байланыштуу жумушчулар менен кызматчылардын жана ишкана, мекеме, уюмдардын (булардын атынан администрация иш жүргүзөт) жана башка иш берүүчүлөрдүн ортосунда болгон мамилелерди, эмгек талаштарын коргоо боюнча мамилелерди жөнге салат. Эмгек укугунун маанилүү булагы болуп Кыргыз Республикасынын Әмгек кодекси эсептелет. Биз мурда бул укук жөнүндө жарандардын укуктарын талдаганда негизинен окуганбыз."},{"t":"p","h":"12. Үй-бүлө укугу. Бул укуктун ченемдери нике жана үй-бүлөгө байланыштуу келип чыгуучу өздүк жана мүлктүк мамилелерди жөнгө салат. Үй-бүлө укугунун негизги ченемдик документи болуп, Кыргыз Республикасынын Нике жана үй-бүлө жөнүндөгү кодекси эсептелет. Бул кодексте никелешүүнүн тартиби жана шарттары, жубайлардын укуктары жана милдеттери, ата-эне жана балдардын укук-милдеттери, алименттик милдеттер, бала асырап алуунун шарттары, опекага (камкордукка) алуу, багууга алуу шарттары, төрөлүүлөрдү, каза болууларды, никени, никеден ажырашуу- <span class=\"pg\" data-n=\"127\">127<\/span>Ө а | У глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"ну, бала асырап алууну, аталыкты аныктоону жана ошондой эле ысымын, атасынын атын, фамилиясын өзгөртүүнү каттоонун шарттары аныкталган."},{"t":"p","h":"13. Турак жай укугу. Укуктун бул тармагы жарандар менен мамлекеттин, ведомстволордун турак жай менен байланышкан мамилелерин жөнгө салат."},{"t":"p","h":"Турак жай жарандарга мамлекет курган үйлөрдөн, ишкана, мекеме жана уюмдар курган үйлөрдөн, турак жай-курулуш кооперативдери курган үйлөрдөн пайдаланууга берилет же болбосо менчигине сатылат. Жарандар мыйзам боюнча жер участкасын алып, ага турак жай салып алууга укуктуу."},{"t":"p","h":"Совет мезгилинде жарандарга турак жай куруу үчүн шаардан жер берилген эмес. Турак жайды мамлекет өзү куруп (эреже катары көп кабаттуу үйлөрдү) жарандарга квартира берип келишкен. Бирок, ал аз курулгандыктан, турак жай үчүн жарандар кезекке жылдап турушкан. Мамлекетибиз демократиялаштырылгандан кийин жарандардын турак жайга болгон укугу бир кыйла кенейтилди."},{"t":"p","h":"Турак жайды мамлекет тарабынан куруу сакталып калды, ошону менен бирге каалагандарга үй куруу үчүн жер тилкелерин берүү мүмкүн болуп калды. Турак жайды менчикке өткөрүп берүү жүргүзүлдү. Азыр каалаган адам өзүнүн квартирасын башкага сата алат жана сатып да ала алат. Әгер мурда бир үй-бүлө менчигинде бир квартираны же бир үйдү гана ээлей алса, азыр андай чектөө жок. Ошондой эле турак жайдын аянтын чектөө да алынып салынды, мурда үй-бүлөнүн ээлеген турак жайынын аянты 60 м*ден ашпоого тийиш эле, азыр мүмкүнчүлүгүнө жараша чоң же кичине үй салып же сатып алуу адамдардын өз эрки."}],"sub":[{"title":"КЫРГЫЗ РЕСПУБЛИКАСЫНДАГЫ УКУК ТАРМАКТАРЫ","b":10}],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЖАРАНЫ","pages":[118,127]},{"title":"` КАЙТАЛОО ҮЧҮН СУРООЛОР","blocks":[{"t":"h3","h":"` КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"v","l":["е","1. Укуктун кандай тармактары бар?","2. Конституциялык укук эмнени үйрөтөт?","3. Жер укугу кандай мамилелерди женге салат?","4. Мыйзам боюнча жер кандай турлерге бөлүнөт?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"128\">128<\/span>у глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"5. Суу укугу кандай мамилелерди женге салат?"},{"t":"v","l":["6. Токой укугу кандай мамилелерди жанга салат?","7. Тоо-кен укугу кандай мамилелерди женге салат?","8. Администрациялык укук эмнени окутат?","9. Администрациялык органдарга кайсы органдар кирет?","10. Финансы укугу кандай мамилелерди женге салат?","11. Салык укугу коомдогу кандай мамилелерди тейлейт?","12. Эмгек укугу кандай мамилелерди женге салат?","13. Үй-бүлө укугунун предмети кайсы?","14. Турак жай укугу тууралуу эмнелерди билесиң?"]},{"t":"h3","h":"&amp; 27. Жарандык укук"},{"t":"p","h":"1. Жарандык укук жана жарандык укук мамилелеринин катышуучулары, Укуктун бул тармагын маанилүүлүгү боюнча экинчи конституция деп коюшат. Анткени, жарандык укук жашоодо боло турган көптөгөн мамилелерди женге салат. Кандай гана адам болбосун, бул укуктун катышуучусу болот жана андан четтеп кетүү мүмкүн эмес. Ар бир адам турмушунда ар кандай иштерди жасайт. Әртең менен туруп, автобуска түшүп ишке барат, түштө ашканага кирип тамактанат, дүкөндөн керектүү нерселерин сатып алат. Ушул иштерди жасап жатышып, алар жарандык укук мамилелеринин катышуучусу болуп жаткандыгын байкашпайт. Жогоруда келтирилген мисалдардагы аракеттер укук ченемдери менен женге салынган. Атап айтканда ар бир адам коомдук транспорттон пайдаланууга акылуу, коомдук транспорт адамдарды белгиленген график боюнча ташууга милдеттүү. Ашканадан тамак же дүкөндөн буюм сатып алууда жарандар белгилүү баадагы буюмду сатып алуу менен соода келишиминин катышуучусу болуп эсептелет."},{"t":"p","h":"Жарандык укук —бул жарандардын өз ара, жарандар менен юридикалык жактардын ортосундагы жана юридикалык жактардын өз ара мүлктүк жана ага байланышкан <span class=\"pg\" data-n=\"129\">129<\/span>У глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"мүлктүк мамилелерин жөнгө салып турган укук тармагы болуп эсептелет."},{"t":"p","h":"Юридикалык жак деп менчигинде же башкаруусунда мүлкү бар жана өзүнүн милдеттенмелери үчүн ушул мүлкү менен жооп бере ала турган, өзүнүн атынан башкалар менен келишим түзө ала турган уюмдарды айтабыз. Мисалы, силер окуган мектеп юридикалык жак болуп эсептелет."},{"t":"p","h":"Жарандык укук бардык жарандык мамилелер үчүн маанилүү жоболорду, атап айтканда, жарандык укуктун жана милдеттердин келип чыгышы, аларды коргоо, ар кандай бүтүмдөрдүн түрлөрү, өкүлчүлүк, ишеним кат, мөөнөт, доо коюу мөөнөтү жөнүндөгү жоболорду камтыйт. Жарандык укуктун жана милдеттердин келип чыгышына мисал катары жаран менен курулуш уюмунун ортосундагы үй куруу боюнча түзүлгөн келишимди алсак болот. Бул учурда жаран белгилүү суммадагы акчаны курулуш уюмуна төлөп берет, курулуш уюму үйдү сүйлөшүлгөн мөөнөттө жана сапаттуу куруп берүүгө милдеттенет. Жаран келишиминин шарты боюнча сапаттуу курулган үйдү алууга укуктуу, ал эми курулуш уюму келишим боюнча үйдү мөөнөтүндө жана сапаттуу куруп, өткөрүп берууге милдеттүү. Әгерде бул келишимди аткарууда укуктар бузулса, аны коргоонун да жолдору бар. Мисалы, курулуш уюму үйдү сапатсыз жана мөөнөтүнөн кечиктирип бүткөрсө, жаран сотко кайрылып кеткен чыгымын, тарткан моралдык зыянын акчалай баалап, өндүрүп ала алат."},{"t":"p","h":"Ушуга окшогон мүлктүк мамилелер, акчалай баасы бар материалдык байлыктар жарандык укук мамилелеринин эң негизги жана бир кыйла кенири таралган түрү болуп саналат. Жарандык укук менчик укугун, милдеттенме укугун, автордук укукту, ачылыш укугун, ойлоп чыгаруу укугун, мурас укугун камтыйт. Мындан тышкары жарандык укуктарга мүлктүк эмес мамилелер, наамы, сыймыгы, ар намысы, бедел-баркы сыяктуу мүлккө тиешеси жок дөөлөттөр менен байланышкан маселелер кирет."},{"t":"p","h":"Жарандык укук мамилелеринин катышуучуларынын өзгөчөлүгү болуп алардын бири-бирине баш ийбегендиги,"},{"t":"p","h":"<span class=\"pg\" data-n=\"130\">130<\/span>И глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"бул мамиледе уюмдун укугу менен жарандын укугу бирдей болуп, алар жарандык мамилеге эреже катары өз ыктыярлары менен киргендиги жана мыйзам алдында алар бирдей милдетке жана укукка за экендиги эсептелет."},{"t":"p","h":"Жарандык укуктар менен милдеттер жарандын же уюмдун жалпы эле жарандык укуктарын жана милдеттерин камтыбастан, жарандын мыйзамдарда каралган укуктарын жана милдеттерин да камтыйт. Жарандын өзүнүн жарандык укуктарынан жана милдеттеринен башка, конституциялык укуктары жана милдеттери бар экендигин билесинер (эмгек, билим алуу, саламаттыгын сактоо, шайлоо ж. б. укуктар)."},{"t":"p","h":"2. Жарандын укукка жөндөмдүүлүгү жана аракетке жөндөмдүүлүгү. Җарандык укук мамилесине кирүү үчүн жарандар да, юридикалык жактар да жарандык укук жендемдүүлүгүнө ээ болууга тийиш. Жарандык укук жөндөмдүүлүгү деп жарандын укуктарга жана милдеттерге ээ болуу жендемдүүлүгүн айтабыз. Жарандык укук жөндөмдүүлүгү ал төрөлгенде эле пайда болуп, дүйнөдөн өтүшү менен токтолот."},{"t":"p","h":"Жарандын укукка жөндөмдүүлүгү төмөндөгү иштерди жасай ала тургандыгы менен айкындалат: өзүнүн менчигинде мүлк күтө алышы, мүлктү мурастап алышы же мураска калтырышы, ишкердик жүргүзүүсү жана мыйзам тарабынан тыюу салынбаган башка ар кандай иштерди жүргүзө алышы, өз алдынча же башка жарандар жана юридикалык жактар менен бирдикте юридикалык жактарды ача алышы, мыйзам тарабынан тыюу салынбаган ар кандай бүтүмдөрдү жасашы жана милдеттенмелерге катышуусу, жашай турган жерин тандап алышы, автордук укукка ээ боло алуусу жана башка мүлктүк жана мүлктүк эмес укуктарга ээ болушу."},{"t":"p","h":"Бул укук жөндөмдүүлүгүн толугу менен ишке ашыруу үчүн жаранда аракетке жөндөмдүүлүгү болуш керек. Аракет жөндөмдүүлүгү толугу менен жаран 18 жашка толгондо келип чыгат. Бул чектөө жарандар 18 жашка толгонго чейин, аныш менчигинде мүлкү боло албайт же кандайдыр бир чы- <span class=\"pg\" data-n=\"131\">131<\/span>У глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"гарманын автору боло албайт дегендикке жатпайт, алар бул керсетулген укуктарды гана толугу менен өздөрү ишке ашыра алышпайт. Мисалы, мурас катары алган үйүн өздөрү бирееге белек кылып бере алышпайт же сата алышпайт. Алар үчүн бул бүтүмдөрдү мыйзамдуу өкүлдөрү жасоого тийиш. Мындай мыйзамдуу өкүл катары өз ата-энеси же асырап алган адамдар же камкор деп табылган адамдар таанылат."},{"t":"p","h":"Жашы толо электердин аракетке жөндөмдүүлүгүнүн чеги мыйзам тарабынан белгиленген. Мисалы, 14 жашка чейинки балдар, кыздар майда турмуш-тиричилик бүтүмдөрдү өз алдынча жасай алышат (дүкөндөн азык-түлүк, буюм-тайым сатып алууга окшогон), ошондой эле ата-энеси же башка мыйзамдуу өкүлдөрү аларга атайын берген каражатты сарптай алышат. 14 жаштан 18 жашка чейинки өспүрүмдөр өзүлөрү тапкан эмгек акысын, стипендиясын же башка кирешелерин өздөрү каалагандай пайдаланышат, автордук укуктарын толук пайдалана алышат, кассага акча сала жана аны ала алышат жана майда-барат турмуш-тиричилик бүтүмдөрүн жасай алышат."},{"t":"p","h":"Эгерде, 16 жашка чыккан өспүрүм эмгек келишими боюнча иштеп жатса же мыйзамдуу өкүлдөрүнүн уруксаты менен ишкердик жүргүзүп жүрсө, толук аракетке жөндөмдүүлүгү бар деп табылат."},{"t":"p","h":"3. Бүтүмдөр. Бирөө айдап жүргөн машинасын, экинчиси үйүн сатат, башка бирөөлөр сатып алат. Буга окшогон аракеттер бүтүмдөр аркылуу ишке ашырылат. Аныктап айтканда, бүтүмдөр деп, жарандар менен юридикалык жактардын жарандык укуктарды жана милдеттерди белгилөөгө, озгортүүгө же токтотууга байланышкан аракеттери таанылат. Бүтүмдөр оозеки же жазуу түрүндө жасалат. Жазуу түрүндө жасалчу бүтүмдөрдүн да жөнөкөй жана нотариалдык тартипте жүргүзүлүүчү эки түрү бар. Нотариалдык күбөлөндүрүү талап кылынган бүтүмдөр мыйзам тарабынан аныкталган, ошондой эле бир тарап нотариалдык күбөлөндүрүүнү талап кылган учурда да жүргүзүлөт."},{"t":"p","h":"<span class=\"pg\" data-n=\"132\">132<\/span>ӨТ"},{"t":"p","h":"де У глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"Мисалы, үйдү сатуу, белек кылуу бүтүмдөрү сөзсүз нотариус аркылуу күбөлөндүрүүгө жатат."},{"t":"p","h":"Женекей жазуу түрүндө жасалуучу бүтүмдөргө юридикалык жактардын өз ара же жарандар менен жасалган бүтүмдөрү, ошондой эле бүтүмдөрдүн өлчөмү эмгек акынын минималдуу өлчөмүнөн он эсе көп болгон жана мыйзам тарабынан атайын көрсөтүлгән учурларда жасалган буюмдар кирет."},{"t":"p","h":"Оозеки бүтүмдөр мыйзам тарабынан аны жазуу түрүндө тастыктоо талап кылынбаган учурларда жасалат. Ошондой эле тараптардын макулдашуусу менен дароо аткарылган бүтүмдөр да оозеки эле жасалышы мүмкүн. Мисалы, мал базардан жылкы же уй сатып алынууда бүтүм, эреже катары, оозеки эле түзүлөт."},{"t":"p","h":"Бүтүмдөрдү жасоонун мыйзам тарабынан аныкталган түрлөрүн сактабоо бүтүмдү анык эмес деп табууга алып келет. Мындай учурда, абал мурдагы калыбына келтирилет, башкача айтканда, сатып алуучуга акчасы кайтарылып берилет, сатуучуга буюму кайтарылып берилет. Әгерде мындай бүтүмдүн мамлекеттин же коомдун кызыкчылыгына каршы жасалганы аныкталса, бүтүмдүн объектиси (акча, буюм, мүлк) мамлекеттин пайдасына алынып коюлат."},{"t":"p","h":"Ошондой эле жашы жете элек жана сот тарабынан аракет жөндөмдүүлүгү жок деп табылган жарандар жасаган бүтүмдөр анык эмес деп табылат. Жашы жеткен, бирок акылэси ордунда болбогон жарандар сот тарабынан аракет жөндөмдүүлүгү жок деп табылышы мүмкүн."},{"t":"p","h":"4. Менчик укугу жана башка мүлктүк укуктар. Жарандардын мүлккө карата укуктары, менчик жана башка мүлктүк укуктарды пайдалануудан чыккан мамилелер жарандык укук тарабынан жөнгө салынат."},{"t":"p","h":"Мыйзам боюнча менчик укугу – бул мыйзам актылары тарабынан таанылган жана корголгон, жарандардын жана юридикалык жактардын өзүлөрү каалагандай ээлик кылуу, пайдалануу жана башкаруу укугу."},{"t":"p","h":"<span class=\"pg\" data-n=\"133\">133<\/span>ея Г глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"Менчик ээсине ээлик кылуу, пайдалануу жана башкаруу укуктары тиешелүү. Бул үч белгинин бирөөнү эле жасоого укугу жок болсо, анда менчик укугу жок болуп эсептелет."},{"t":"p","h":"Ээлик кылуу укугу – мыйзам тарабынан камсыз кылынган, мүлктү чындыгында ээлеп туруу мүмкүнчүлүгү."},{"t":"p","h":"Пайдалануу укугу = мыйзам тарабынан камсыз кылынган, мүлктүн юридикалык тагдырын чечүү мүмкүндүгү, башкача айтканда, өзү билип сатып жиберүү, белекке берүү, алмашып жиберүү жана башка мүмкүндүктөр."},{"t":"p","h":"Менчик ээси өзүнүн мүлкүн кандай пайдаланам десе өз эрки, башка бирөөнүн менчигине өткөрүп бере алат же башкага пайдаланууга бере алат, күрөөгө коё алат, бир гана шарт, бул аракеттер мыйзамга карама-каршы келбеш керек жана мыйзам тарабынан корголгон башка бирөөнүн кызыкчылыгын жана укугун бузбашы керек."},{"t":"p","h":"Мисалы, сенин атаң машина сатып алды дейли, бул учурда ал менчик укугуна ээ болду. Машинаны үйдөгү гаражда кармайт (ээлик кылат), айдайт {пайдалануу укугу), бир канча мезгил өткөндөн кийин инисине ишеним кат менен бир жылдык мөөнөткө пайдаланууга берди, натыйжада, ал машинага ээ болуу жана пайдалануу укугун өткөрүп берип, өзү башкаруу укугун пайдаланды. Бир жылдан кийин ал машинаны сатып жиберди, башкача айтканда, мүлктү башкаруу укугун пайдаланды да, машинага болгон менчик укугунан ажырады, бирок сатуудан түшкөн акчага карата менчик укугуна ээ болду. Ушул аракеттердин баары апаңардын макулдугу менен жасалышы керек, анткени жубайлар чогуу жашап турганда алынган мүлктөр жалпы менчик болуп эсептелет."},{"t":"p","h":"Мүлктүк укуктарга төмөнкүлөр кирет:"},{"t":"p","h":"1) Чарбачылык жүргүзүү укугу, мисалы мамлекеттик заводдун имараты мамлекеттин менчиги болуп эсептелет, аны заводдун администрациясы мамлекеттин уруксатысыз каалагандай жумшай албайт, башкача айтканда сата албайт, бирөөгө пайдаланууга бере албайт. Калган мүлктү башкаруу укугу бар."},{"t":"p","h":"<span class=\"pg\" data-n=\"134\">134<\/span>д ©"},{"t":"p","h":"У глава, Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"2) Мулкту оперативдик башкаруу укугу. Бул укук негизинен чарба жүргүзбөгөн мекемелерге берилет. Алар мүлктү максаттуу пайдалануулары тийиш жана менчик ээсинин макулдугусуз сата албайт, башкага берип жибере албайт."},{"t":"p","h":"Мисалы, мындай укугу бар мекемеге силердин мектебиңер да кирет."},{"t":"p","h":"3) Жер тилкелерин өмүр бою, мөөнөтсүз пайдалануу укугу. Жерди мыйзамга ылайык пайдаланууга өмүр бою, мөөнөтсүз алган адамдар жерди каалагандарындай пайдаланышат, башкача айтканда ижарага бере алышат же оздеру пайдаланышат, пайдалануу укугун сатышат, бирок жердин өзүн башкага сатып жибере алышпайт."},{"t":"p","h":"5. Милдеттенмелер. Милдеттенмелер жарандык укукта негизинен келишимден жана башка бирөөгө зыян келтиргендиктин натыйжасында келип чыгат. Жарандар турмушунда ар кандай келишимдерди түзүшөт, мисалы, кандайдыр бир жумушту аткарууга, сатып алуу же сатуу, карыз алуу, турак-жай жалдоо, жүргүнчүлөрдү жана жүктөрдү ташуу ж. б. Әреже катары, келишим эки жактуу болуп түзүлөт жана алардын укук, милдеттери мыйзам менен, ошондой эле өздөрүнүн макулдашуусу аркылуу аныкталат. Сатып алуу жана сатуу келишими боюнча сатуучу мүлктү сатып алуучунун менчигине өткөрүп берүүгө, ал эми сатып алуучу мүлктү кабыл алып, ал үчүн кандайдыр бир суммадагы акчаны төлөп берүүгө милдеттүү."},{"t":"p","h":"Бузулган телевизорунузду оңдоого бердиңиз, тиешелүү акчаны төлөдүңүз, ал эми мастер болсо аны сапаттуу ондоп берүүгө милдеттүү. Әгер телевизор ондолбостон, кайра мурдагыдан жаман болуп бузулса, келтирилген зыянды төлөтүү үчүн доо койгонго акылуусуңар."},{"t":"p","h":"Жарандардын ортосунда көп келишимдер оозеки түрүндө түзүлө тургандыгын жогоруда айтканбыз. Бирок, айрым келишимдерди (мисалы, турак үйдү, автомашинаны сатуу, эмгек акынын минималдуу өлчөмүнөн 10 эсе ашкан сумманы камтыган бүтүмдөрдү аткаруу үчүн келишим түзүү) мыйзам- <span class=\"pg\" data-n=\"135\">135<\/span>У глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"да милдеттүү түрүндө кат жүзүндөгү түрү белгиленген, ал эми алардын кээ бир түрлөрүнө карата кошумча талаптар коюлат (сөзсүз түрдө нотариус аркылуу күбөлөндүрүү же жөн эле кат жүзүндө түзүү)."},{"t":"p","h":"Милдеттенменин келип чыгышына негизги себептердин бири – эгер бир адам өзүнүн мыйзамга жатпаган аракеттери менен башка адамга мүлктүк зыян келтирсе, зыянга учураткан адам зыянга учураган адамга мүлктүн наркын телеп берүүгө милдеттүү, ал эми ден соолукка зыян келтирилгенде, дарылануу чыгымдарын, убактылуу эмгекке жараксыз же майып болуп, албай калган эмгек акысын телеп берүүгө милдеттүү."},{"t":"p","h":"Эгер жабыр тарткан адам өлүп калса, ага күнөөлүү адам өлгөн адамдын багуусундагы адамдын жашоосу үчүн зарыл каражаттарды төлөөгө тийиш."},{"t":"p","h":"Он беш жашка чыга элек балдар же өспүрүмдөр тарабынан келтирилген зыян үчүн алардын ата-энелери же башка мыйзамдуу өкүлдөрү жооп беришет. Он беш жаштан он сегиз жашка чейинки өспүрүмдөр келтирген зыян үчүн өздөрү жооп беришет. Әгерде алардын мүлкү же иштеп тапкан каражаты жок болсо, анда келтирилген зыянды алардын ата-энелери же алардын ордун баскан адамдар төлөөгө тийиш. Бул жаштагы өспүрүмдөр мектептин же башка мекеменин көзөмөлүндө болушкан күндө да келтирилген зыянды төлөө мектепке же башка мекемеге жүктөлүшү мүмкүн эмес."},{"t":"p","h":"6. Жарандык үкүктарды ишке ашыруу. Жарандык укутарды ишке ашыруу – бул жарандарга мыйзамдарда жол берилген, өзүлөрүнө таандык укуктарды өздөрү каалагандай жүзөгө ашыруусу эсептелет."},{"t":"p","h":"Жарандык укуктун негизги ченемдик булагы болуп, Кыргыз Республикасынын Конституциясы жана Кыргыз Республикасынын Жарандык кодекси эсептелет, бул Кодексте жарандык укуктарды жүзөгө ашыруунун чектери белгиленген. Жарандар менен юридикалык жактар тарабынан башка адамга зыян келтирүү максатында жасалган аракеттерге,"},{"t":"p","h":"<span class=\"pg\" data-n=\"136\">136<\/span>У глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"ошондой эле укугун кыянаттык менен пайдаланууга жол берилбейт, жарандык укукта конкуренцияны (атаандаштыкты) чектөө, өзүнүн рыноктогу үстөмдүк абалын кыянаттык менен пайдаланууга жол берилбейт. Бул талаптар сакталбаган учурда, сот мындай адамга тиешелүү укуктарды коргоодон баш тартышы мүмкүн."},{"t":"p","h":"Укугун кыянаттык менен пайдаланган адам кыянаттыктан жапа чеккен адамдын абалын калыбына келтирүүгө, ага келтирилген зыяндын ордун толтурууга милдеттүү. Мыйзам жарандык укуктарды коргоодо жарандык укуктук мамилелердин катышуучуларынын аң-сезимдүүлүгүн жана ак ниеттүүлүгүн эске алат."}],"sub":[{"title":"&amp; 27. Жарандык укук","b":5}],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЖАРАНЫ","pages":[128,136]},{"title":"‹ КАЙТАЛОО ҮЧҮН СУРООЛОР","blocks":[{"t":"h3","h":"‹ КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"p","h":"1. Жарандык укук кандай мамилелерди женге салат?"},{"t":"p","h":"ды Жарандык укуктун катышуучуларынын катарына кимдер кире"},{"t":"p","h":"апат?"},{"t":"p","h":"б› б ч л ‚ Жарандык укук жөндөмдүүлүгү деп эмнени айтабыз? ‚ Бутумдер деп эмнени айтабыз? ‚ Бүтүмдөр кандай түрдө жасалат? ‚ Менчик укугу деген эмне?"},{"t":"p","h":"‚ Жарандык аракетке жөндөмдүүлүгү кайсы жаштан башталат?"},{"t":"p","h":"8. Ээлик кылуунун, пайдалануунун жана башкаруунун кандай айыр-"},{"t":"p","h":"мапары бар?"},{"t":"v","l":["9. Мүлктүк укуктарга эмнелер кирет?","10. Милдеттенмелер эмнеден келип чыгат?"]},{"t":"p","h":"11. Жарандык укуктарды ишке ашыруу кандай жолдор менен ат-"},{"t":"p","h":"карылат?"},{"t":"p","h":"<span class=\"pg\" data-n=\"137\">137<\/span>У глава. Кыргыз Республикасындагы укук тармактары"}],"sub":[],"secti лоо укуктарынын негизинде жашыруун добуш берүү аркылуу жүргүзүлөт. Бул жагдайлар жарандардын шайлоого катышуу принциптери болуп эсептелет да төмөнкүләрдү билдирет:"},{"t":"p","h":"Жалпы шайлоо укугу – Кыргыз Республикасынын 18 жашка чыккан жараны шайлоого, ал эми Конституция жана мыйзамдар менен белгиленген куракка жеткенде мамлекеттик бийлик органдарына жана жергиликтүү өз алдынча башкаруу органдарына шайланууга укуктуу экендиги. Бул укук алардын ата-тегине, жынысына, расасына, улутуна, кызматтык жана мүлктүк абалына, кайсы динди тутканына карабастан тиешелүү."},{"t":"p","h":"Сот чечими менен аракетке жөндөмсүз деп табылган, же сот өкүмү менен эркинен ажыратуу жайларында кармалып турган жарандар шайлоого да, шайланууга да укуксуз, ал эми соттуулугу алына элек же мыйзам тарабынан жоюла элек жарандар шайлоого укуктуу да, шайланууга укуксуз."},{"t":"p","h":"Тең шайлоо укугу – бардык жарандардын шайлоого бирдей шартта катышуусу."},{"t":"p","h":"Тике шайлоо укугу – ар бир жарандын шайлоодо добушту өзү үчүн гана бериши. Үй-бүлө мүчөсү же досу учун добуш берүүгө болбойт."},{"t":"p","h":"Жашыруун добуш берүү- Кыргыз Республикасында жарандын өз пикирин, эркин билдирүүсүнө шарт түзүп, кимдир бирөө үчүн добуш берүүгө мажбурлоо болбошу үчүн шайлоодо добуш берүүнүн жашыруун жүргүзүлүшү. Шайлоо участкаларында добуш берүүнү жашыруун жүргүзүү үчүн атайын шарттар түзүлөт (мисалы, жабык кабина)."},{"t":"img","src":"data:image/webp;base64,UklGRjwiAABXRUJQVlA4IDAiAAAw+wCdASrJAVMBPrVQokunJKcnqhIMKPAWiWkGjebppImFTQf1WS2d3HhzvYl732trx76YHtgLKS4BjegUrpThyCKkWFVO9mGD1qL2X6iVUsmIC14bLJsQ9g9vvuKSSGPq0HR0ibATClJK4k5pCavJOaqMkwC7zSfeJV7cQdN5hBtLU2t/QB2cCzdZI/7Rc9disZ23fZ+Nr0kHLI37cJCa0+Bf5qj+qaHG7RiD/dnaZrqUDN0yOMkuZCXspY8yAYT2CwgGBwy8BhX554L2z+YcbLYqgnoYopyHEJly92XdJ/ltn0FOZ0C6IUWNMvhUplCDzb6j5cMowQWi2rWLbPr7811Fg/bOMh6H4qOZHPw+igwguQ5wK9DUsqMMl0fIkRxSC2Qx1KGDeXgml5f/FC8jMhXRqkeGjFw0gPBYvo8gLgQ3ypbKBzUUPV2RpVGSDt3EQjYqohVDTY2dFXS5dieW5YcqBVV8v8b/4isMfwwKilZAzGcg/jmc5+/wBVFvLgox43Nw3DlRz9kslNQ а —- Кыргыз Республикасынын жарандарынын мамлекеттик бийлик же өз алдынча башкаруу органдарына шайлануу укугу."},{"t":"p","h":"Кыргыз Республикасында шайлануучу органдар теменкүлөр:"},{"t":"v","l":["1. Кыргыз Республикасынын Президенти;","2. Кыргыз Республикасынын Жогорку Кеңеши;"]},{"t":"p","h":"3. Кыргыз Республикасынын жергиликтүү кеңештердин депутаттары."},{"t":"p","h":"1. Кыргыз Республикасынын Президентин шайлоо. Президент Кыргыз Республикасынын жарандары тарабынан б жылга шайланат. Бир эле адам эки жолу Президент болуп шайлана албайт. Президент болуп 35 жаштан төмөн эмес жана 170 жаштан жогору эмес, мамлекеттик тилди билген жана республикада жалпысынан 15 жылдан кем эмес жашаган Кыргыз Республикасынын жараны шайлана алат. Президенттин кызмат ордуна талапкерлердин саны чектелбейт. 80 минден кем эмес шайлоочунун кол тамгасын топтогон адам президенттикке талапкер болуп каттала алат. Президентти шайлоо тартиби мыйзам менен аныкталат."},{"t":"p","h":"2. Кыргыз Республикасынын Жогорку Кеңешинин депутаттарын шайлоо. Жогорку Кенеш пропорциялуу система боюнча 5 жылдык мөөнөткө шайлануучу 120 депутаттан турат. Шайлоонун жыйынтыктары боюнча саясий партияга парламентте 65тен кеп эмес депутаттык мандат берилиши мүмкүн. Шайлоо күнүнө карата 21 жашка чыккан, шайлоого укугу бар Кыргыз Республикасынын жараны Жогорку Кеңештин депутаты болуп шайлана алат. Жогорку Кеңешке шайлоо жарыяланган күнгө чейин тиешелүү каттоодон өткөн партиялар шайлоого катышууну кааласа, депутаттыкка талапкерлердин тизмесин бекитип, Борбордук шайлоо комис- <span class=\"pg\" data-n=\"141\">141<\/span>У глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"сиясына беришет. Шайлоодо жарандар добушту партияларга беришет. Кыргыз Республикасынын жалпы шайлоочуларынын 5% тен көп добушун жана ар бир облустан жана Бишкек шаарынан шайлоочулардын 0,5%тен кем эмес добушун алган партиялар өттү деп эсептелет дагы, парламенттеги 120 орун алган добушуна пропорциялуу бөлүштүрүлөт. Ошону үчүн бул шайлоо системасы пропорциялуу деп аталат."},{"t":"p","h":"3. Кыргыз Республикасынын жергиликтүү кенештеринин депутаттарын шайлоо. Жергиликтүү кеңештерге – облустук, райондук шаардык, айылдык кенештер кирет. Жергиликтүү кеңештердин депутаттыгына 20 жашка чыккан жана көрсөтүлгөнгө чейин тийиштүү аймакта кеминде 2 жыл жашаган Кыргыз Республикасынын жараны шайлана алат. Талапкерлер жер-жерлерде шайлоочулардын чогулушунда көрсөтүлөт. Жергиликтүү кенештердин депутаттары көп мандаттуу округдарда шайлана тургандыктан, чогулуштарда ошол округ үчүн белгиленген мандаттардын санынан ашпагандай сандагы талапкерлерди көрсөтүүгө болот. Талапкерлер саясий партиялар, алардын аймактык бөлүмдөрүнүн, шайлоо блогунун съезддеринде көрсөтүлүшү мүмкүн."},{"t":"p","h":"Шайлоо комиссиялары шайлоо өткөндөн кийин анын натыйжаларын аныкташат. Тиешелүү округдан шайлануучулардын кыйла көп сандагы добушун алган талапкерлер депутат болуп шайланды деп табылат. Шайлоонун натыйжалары белгилүү болгондон кийин шайланган депутаттарды округдук шайлоо комиссиясы 8 күндүн ичинде каттайт жана аларга шайлангандыгы тууралуу күбөлүктү берет."},{"t":"p","h":"УА"}],"sub":[],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЖАРАНЫ","pages":[138,141]},{"title":"о КАЙТАЛОО ҮЧҮН СУРООЛОР","blocks":[{"t":"h3","h":"о КАЙТАЛОО ҮЧҮН СУРООЛОР"},{"t":"p","h":"1. Кыргыз Республикасындагы шайлоолор кандай принциптердин"},{"t":"p","h":"негизинде жүргүзүлөт?"},{"t":"v","l":["2. Жалпы шайлоо укугу деген кандай?","З. Тең шайлоо укугу жөнүндө эмне билесиң?","4. Тике шайлоо укугу женүндө эмне билесиң?","5. Жашыруун добуш берүүнүн максаты эмнеде?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"142\">142<\/span>&lt; ыы дс глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"6. Активдүү шайлоо укугун мүнөздө?"},{"t":"p","h":"7. Пассивдүү шайлоо укугу деген эмне?"},{"t":"p","h":"8. Кыргыз Республикасынын Президенти кандайча шайланат?"},{"t":"p","h":"9. Кыргыз Республикасынын Жогорку Кеңешинин депутаттарын"},{"t":"p","h":"шайлоонун негиздери?"},{"t":"p","h":"10. Жергиликтүү кеңештин депутаттарын шайлоо кандай тартипте"},{"t":"p","h":"өтөт?"},{"t":"h3","h":"&amp; 29. Жазык укугу"},{"t":"p","h":"Жазык укугу – кандай аракеттер же аракетсиздик коом үчүн коркунучтуу, күнөөлүү жана жазалануучу жорук (кылмыш) экендигин, жазалоо шартын жана жазалоо чарасын белгилөөчү укук тармагы."},{"t":"p","h":"1. Кылмыш деген эмне? Асан аттуу жигит кечеде бара жаткан кишини токтотуп, бычак менен коркутуп, болгон акчасын тартып алды."},{"t":"p","h":"Болот деген адам өзү тааныган эки киши бирөөнү өлтүрүп, сууга таштап жибергенин көрдү, бирок эч кимге айтпай жашырып койду."},{"t":"p","h":"Жатакананын белмесунде бир нече бала улпет куруп олтурушуп, алардын ичинен Максат аттуу жигит бошогон бөтөлкөнү бешинчи кабаттын терезесинен сыртка ыргытып жиберди. Ал бетелке кечеде кетип бара жаткан аялдын башына тийип, ал оор жаракат алды."},{"t":"p","h":"Жогоруда келтирилген үч мисал кылмыш жасалганын ырастайт. Биринчи мисалда, Асан коомдук коркунучтуу аракети менен атайылап туруп оор кылмыш жасады, экинчи мисалдагы Болот өзүнүн аракетсиздиги менен тигил жасалган оор кылмыш жөнүндө тиешелүү органдарга билдирбей, жашырып койду, бул аракетсиздик дагы кылмыш болуп эсептелет, анткени мыйзам боюнча жасалган оор кылмышты көргөн, байкаган адам аны жашырса, кылмыш жообуна тартылары белгиленген. Үчүнчү мисалдагы Максат кылмышты <span class=\"pg\" data-n=\"143\">143<\/span>И глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"байкабастыктан жасады, анткени ал ылдый жактагы өтүп бара жаткан аялды көрген жок, бирок ал жактан адамдар өтүп турарын билген, ошондой болсо да женил ойлуулук менен бөтөлкөнү ыргытып жиберген."},{"t":"p","h":"Ошентип, кылмыш деп атанылап же байкабастык менен жасалган, коом үчүн коркунучтуу жана мыйзамдарда кылмыш катары каралган аракетти же аракетсиздикти айтабыз."},{"t":"p","h":"Кылмыш жасалды деп табыш үчүн адамдын күнөөсү далилдениш керек, ал эми кылмыш атайылап жана байкабастыктан жасаларын билдик. Күнөөлүү деп сот гана таба алат. Сот өкүм чыгармайынча кылмыш жасаган адам – шектүү адам, айыпкер, соттолуучу деп гана таанылат."},{"t":"p","h":"Кылмыш үчүн аны түздөн-түз жасаган адам гана жооп бербейт, кылмыш үчүн аны уюштурган адам – уюштуруучу, кылмышты жасоого түрткү берген адам – азгыруучу, кылмышты жасоого жардам берген – көмөкчүлөр дагы жоопко бирдей деңгээлде тартылышат."},{"t":"p","h":"Мыйзам тарабынан көрсөтүлгөн кылмыш аракеттерине жата турган, бирок аргасыздан коргонуу абалында жасалган же аргасыз зарылдыктын абалында жасалган аракеттер кылмыш болуп эсептелбейт жана аны жасаган адамдар жооп беришпейт."},{"t":"p","h":"Аргасыздан коргонуу деп коомдук коркунучтуу кол салуудан же башка бирөөнү коргоо максатында жасалган аракеттерди айтабыз. Мисалы, бир нече адам хулигандык менен бирөөнү тепкилеп жатса, алардын бул аракетин токтотуу максатында бирее барып ажыратып жатып, тепкилегендердин денесине жаракат келтирсе, ал бул аракети үчүн жооп бербейт. Же болбосо, жолдо бара жатканда кандайдыр бир адамга медициналык тез жардам көрсөтүү керек болуп калса жана ал үчүн токтоп турган бирөөнүн автомашинасын сурабастан айдап кетсе, ал адам айдап кеткендиги үчүн жооп бербейт."},{"t":"p","h":"Бирок, аргасыздан коргонуунун чегинен чыгып кетүү"},{"t":"p","h":"<span class=\"pg\" data-n=\"144\">144<\/span>| глава, Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"кылмыш болуп эсептелет. Коргонуунун чегинен чыгып кетүү деп, кол салуунун мүнөзүнө жана коркунучтуулугуна коргонуунун туура келбегендигин айтабыз. Мисалы, күч жагынан өзүнө тең келбеген жаш бала мастыгы менен мушташууга жулунса, аны башка чара колдонбой туруп эле, өзүмдү коргоп жатам деп бычак менен сайып салса, бул албетте, коргонуунун чегинен чыгып кетүү болуп эсептелет."},{"t":"p","h":"Ошондой эле аргасыз зарылдыктан жасалган аракеттер дагы коркунучтуу кырдаалды башка жолдор менен жоюуга мүмкүн болбосо жана келтирилген зыян болтуртпай койгон зыяндан бир кыйла аз болсо гана кылмыш деп табылбайт."},{"t":"p","h":"Жасалган кылмыш үчүн эле жооп бербестен, мыйзамда ага даярдангандык үчүн дагы жоопко тартылары каралган."},{"t":"p","h":"Кылмышты. жасоого даярдангандык деп аны жасоо үчүн каражаттарды, же куралдарды издее жана ылайыкташтырып жасоо, камдоо, же атайылап башка шарттарды түзүүнү айтабыз."},{"t":"p","h":"Кылмышты жасоого аракеттенүү деп, кылмышты жасоого түздөн-түз аракеттер жасалып, бирок башка бирөөлөрдүн аракети жана күнөөкөрдүн каалоосуна байланышпаган себептер менен кылмыш аягына чыкпай калган учурду айтабыз."},{"t":"p","h":"Эгерде кылмыш жасоодон адам ез ыктыяры менен баш тартса жана жасап койгон аракеттеринен кылмыштын курамы көрүнбөсө, жоопкерчиликке тартылбайт."},{"t":"p","h":"Кылмышкерди, кылмыш жасоонун куралдарын же кылмышты жасоонун натыйжасында алынган буюмдарды жашыргандыгы үчүн да жоопкерчилик бар, ошондой эле кылмыш жолу менен алынгандыгы белгилүү болгон мүлктү сатып алуу же сатуу үчүн дагы жоопкерчиликке тартылат."},{"t":"p","h":"Негизинен кылмыш жасагандыгы үчүн адам 16 жашка чыккандан кийин жооп берет, бирок мыйзам боюнча кылмыштын кээ бир оор түрлөрү үчүн 14 жаштан баштап жооп берери белгиленген. Мисалы, киши өлтүрүү, ден соолукка атайы оор залал же анчалык оор эмес залал келтирүү, зор- <span class=\"pg\" data-n=\"145\">145<\/span>У глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"дуктоо, адамды уурдоо, каракчылык, талоончулук, уурулук, хулигандык, банги заттарды уурдагандык, транспорт каражаттарын айдап кеткендик учун жана башка мыйзамда керсетулген учурларда."},{"t":"p","h":"Кылмыштардын толук тизмеси Кыргыз Республикасынын Кылмыш жана жаза кодексинде берилген. Бул Кодексте кылмыш катары көрсөтүлбөгөн аракеттер кылмыш деп табылышы мүмкүн эмес."},{"t":"p","h":"2. Кылмыштардын түрлөрү. Кыргыз Республикасынын Кылмыш жана жаза кодекси тарабынан кылмыш деп табылган аракеттер окшоштугу боюнча төмөнкүдөй түрлөргө бөлүнөт:"},{"t":"p","h":"1) Инсанга каршы кылмыштар. Бул бөлүмгө адамдын өмүрүнө жана ден соолугуна, инсандын эркиндигине, ар-намысына жана кадыр-баркына, жыныстык кол тийгистигине жана жыныстык эркиндигине, адамдын жана жарандын конституциялык укуктарына жана эркиндиктерине, үй-бүлөгө жана жашы жете электерге каршы жасалган кылмыштар кирет."},{"t":"p","h":"2) Экономика чөйрөсүндөгү кылмыштарга – менчикке каршы кылмыштар (уурдоо, тоноо, каракчылык, мүлккө зыян келтирүү ж. 6.), экономикалык иш чөйрөсүндөгү кылмыштар, мамлекеттик эмес ишканалардагы жана уюмдардагы кызматтык кызыкчылыктарга каршы кылмыштар кирет."},{"t":"p","h":"3) Коомдук коопсуздукка жана коомдук тартипке каршы кылмыштарга терроризм, барымтага кармоо, бандитчилик, хулигандык, ок атуучу куралдарды мыйзамсыз алып жүрүү, сатуу же сатып алуу сыяктуу жана калктын саламаттыгына жана коомдук адептүүлүккө каршы (баңги заттар менен байланышкан, сойкулук, порнография жаатындагы) кылмыштар, экологиялык кылмыштар, транспорт кыймылынын жана аны пайдалануунун коопсуздугуна каршы кылмыштар, компьютердик маалыматтар чөйрөсүндөгү кылмыштар кирет."},{"t":"p","h":"<span class=\"pg\" data-n=\"146\">146<\/span>У глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"4) Мамлекеттик бийликке каршы кылмыштар. Бул бөлүмгө: конституциялык түзүлүшкө жана мамлекеттин коопсуздугуна каршы (чыккынчылык, шпиончулук, мамлекеттик же коомдук ишмердин өмүрүнө кол салуу, бийликти күчкө салып тартып алуу же тартып алуу аракети, күч менен кармап туруу ж. 6.) кылмыштар, кызматтык кылмыштар (коррупция, кызматтык абалынан кыянаттык менен пайдалануу, пара берүү, пара алууга байланышкан кылмыштар), сот адилеттигине каршы кылмыштар (сот адилеттигин жүзөгө ашырууга тоскоолдук кылуу, алдын ала тергөө жүргүзүүгө тоскоолдук кылуу, сотту урматтабоо, күнөөсүз экендиги белгилүү адамды кылмыш жоопкерчилигине тартуу, кылмышты жаап-жашыруу ж. б.), башкаруу тартибине каршы кылмыштар (укук коргоо органынын кызматкеринин өмүрүнө кол салуу, бийлик өкүлүнө карата зомбулук көрсөтүү, аны маскаралоо, расмий документтерди жасалмалоо, сатуу ж. б.) кирет."},{"t":"p","h":"5) Аскердик кылмыштарга – буйрукту аткарбоо, башчыга каршылык көрсөтүү, ага карата зомбулук аракеттерди жасоо, дезертирлик, аскердик мүлктү зыянга учуратуу сыяктуу кылмыштар кирет."},{"t":"p","h":"6) Тынчтыкка жана адамзат коопсуздугуна каршы кылмыштар. Кылмыштардын бул тобуна – геноцид (адамдардын кандайдыр бир тобун кырууга, жоготууга багытталган аракеттер), экоцид (өсүмдүктөр жана айбанаттар дүйнөсүн массалык кырып-жоюу), жалданмачылык (куралдуу кагылышка же согушка адамды жалдоо, үйрөтүү же каржылоо, ошондой эле жалданып катышуу}, эл аралык коргоого алынган уюмдарга же мекемелерге кол салуулар кирет."},{"t":"p","h":"3. Жаза жана анын максаты. Жаза жасалган кылмыш үчүн соттун өкүмү менен мамлекеттин атынан күнөөлүү деп табылган адамга колдонулуучу жазалоо чарасы болуп эсептелет. Жазаны чектөө соттолгондорду түзөтүү жана башкаларга эскертүү максатын көздөйт."},{"t":"p","h":"<span class=\"pg\" data-n=\"147\">147<\/span>глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"Кыргыз Республикасынын Кылмыш жана жаза кодекси боюнча жазалардын төмөндөгүдөй түрлөрү белгиленген:"},{"t":"p","h":"1) коомдук иштерге тартуу;"},{"t":"v","l":["2) айып телем;","3) уч айып;"]},{"t":"p","h":"4) белгилуу бир кызматты ээлее же белгилуу бир иш жүргүзүү укугунан ажыратуу;"},{"t":"v","l":["5) дисциплинардык аскер бөлүгүндө кармоо;","б) камакка алуу;","Т) эркиндигинен ажыратуу;","8) өмүр бою эркиндигинен ажыратуу."]},{"t":"p","h":"Булар негизги жазаларга кирет, кошумча жаза катары – атайын же аскердик наамдарын алып коюу жана мүлктү конфискациялоо колдонулат."},{"t":"p","h":"1. Коомдук иштерге тартуу. Негизги ишинен же окуусунан бош убагында 40 сааттан 240 саатка чейин узактыкта, коомдун пайдасы үчүн акысыз иштеп берүү милдетин жүктөгөн жаза."},{"t":"p","h":"2. Айып төлөм. Кунеекерге салынуучу акчалай телем. Өлчөмү 2000 сомдон 100000 сомго чейин."},{"t":"p","h":"3. Кч айып. Кылмыш менен келтирилген зыянды үч эсе кылып төлөтүү жазасы. Эки бөлүгү жабырлануучунун, бир бөлүгү мамлекеттин пайдасына өндүрүлөт."},{"t":"p","h":"4. Белгилүү бир кызматты ээлее же белгилүү бир иш жүргүзүү укугунан ажыратуу. Бул жаза бир жылдан беш жылга чейинки мөөнөткө дайындалат жана негизинен адистигин же ишин туура эмес пайдалануу менен кылмышка барган адамдарга колдонулат."},{"t":"p","h":"5. Дисциплинардык аскер бөлүгүндө кармоо. Аскер кызматчыларына алты айдан эки жылга чейинки мөөнөткө колдонулат."},{"t":"p","h":"6. Камакка алуу. Адамды өзгөчө бөлүп кармоо шартында камоо. Бир айдан алты айга чейинки мөөнөткө чектелет."},{"t":"p","h":"Т. Эркиндигинен ажыратуу – кесилген адамды абактарга, түрмөгө камоо жолу менен коомдон бөлүү. Мөөнөтү алты"},{"t":"p","h":"<span class=\"pg\" data-n=\"148\">148<\/span>глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"айдан отуз жылга чейин белгиленет. Эркиндигинен ажыратуу жазасы кылмышкердин коркунучтуулугу жана кылмыштын оордугуна ылайык ар кандай режимдеги жайларда өтөлөт."},{"t":"p","h":"8. Өмүр бою эркиндигинен ажыратуу – жазанын өзгөчө чарасы, өмүргө кол салууга байланышкан өтө оор кылмыштар үчүн колдонулат. Бул жаза жашы жете элек балдарга жана аялдарга дайындалбайт."},{"t":"p","h":"Кыргыз Республикасынын Кылмыш жана жаза кодекси негизинен беренелерден турат. Ар бир беренеде кандай аракет кылмыш экендиги көрсөтүлүп жана ал кылмыш үчүн кандай жаза берилери айтылат. Әреже катары жазанын түрү, мөөнөтү же өлчөмү так кесе көрсөтүлбөйт, ылдыйкы жана жогорку чектери гана көрсөтүлөт. Ошондуктан, сот жаза чектерде кылмышкердин ким экенин карап, кылмыштын жеңилдетүүчү, оордотуучу жагдайларын талдап туруп, анан кандай жаза берерин чечет. Анткени, бир эле кылмышты жасаган эки адам бирдей болушу чанда кезигет, эреже катары алар ар башка, мисалы, бирее мурда соттолуп жүргөн, жаман мүнөздөлгөн адам, экинчиси ал кылмышка кокусунан барган адам болушу мүмкүн. Ошондуктан, бул экөөнө бирдей жаза чектелиши туура болбой калат. Әреже катары, оор эмес кылмыштар үчүн, эгер аны жасаган адам биринчи жолу соттолуп жатса, эркиндигинен ажыратууга байланышпаган жазалар чектелет. Эркиндигинен ажыратуу оор кылмыштарды жасаган же өзүнүн жүрүм-туруму коом учун коркунучтуу адамдарга колдонулат."},{"t":"p","h":"Өлкөбүздө ар бир кылмыш үчүн жоопко тартуу принциби ишке ашууга тийиш. Бул принцип боюнча, жасалган ар бир кылмыштын бети ачылууга жана ар бир кылмышкер жоопко тартылууга тийиш. Эгерде, кылмышты жасаган адам жазасыз калса, анда ал, дагы кылмыш жасоодон качпайт. Ал эми аны билген адамдардын мыйзамга ишенүү, мыйзамды сыйлоо сезимдери мокойт."},{"t":"p","h":"Коомубузда качан жогоруда айткан принцип ишке ашса, кылмыштуулук азаят, калктын коопсуздугу жакшырат, экономика өнүгөт жана мамлекетибиз күчтүү өлкөгө айланат."},{"t":"p","h":"<span class=\"pg\" data-n=\"149\">149<\/span>У глава. Кыргыз Республикасындагы укук тармактары =з д"}],"sub":[{"title":"&amp; 29. Жазык укугу","b":12}],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЖАРАНЫ","pages":[142,149]},{"title":"2 КОШУМЧА МАТЕРИАЛ","blocks":[{"t":"h3","h":"2 КОШУМЧА МАТЕРИАЛ"},{"t":"p","h":"Кыргыз Республикасынын Кылмыш жана жаза кодекси (Үзүндү) 234-берене (1) Хулиганчылык, башкача айтканда, зомбулук же зомбулук керсеткем деп коркутуу, ошого тете мүлктү жок кылам же зыянга учуратам деп коркутуу менен коштолгон, коомдук тартипти же жалпыга бирдей жүрүш-туруш нормаларын одоно бузган карасанатайлык аракеттер жасалганда – эң аз айлык акынын жүзгө чейинки өлчөмүндө айып төлөм салынат, болбосо жүз жыйырмадан жүз сексен саатка чейинки меенетке коомдук иштерге тартылат, же алты айга чейинки меенетке камакка алынат, болбосо эки жылга чейинки меенетке эркиндигинен ажыратууга жазаланат."},{"t":"v","l":["(2) хулиганчылык:","1) адамдардын тобу тарабынан;"]},{"t":"p","h":"2) апдын ала бүтүм боюнча адамдардын тобу же уюмдашкан топ тарабынан жасалганда;"},{"t":"p","h":"3) жаш балдарды, кары-картаңдарды, майыпты же алсыз абалда болгон адамды мазактоо менен коштолгондо;"},{"t":"p","h":"4) башка бирөөнүн мүлкүнө атайын олуттуу зыян келтирүү, аны жок кылуу же зыянга учуратуу менен коштолгондо – беш жылга чейинки меенетке эркиндигинен ажыратууга жазаланат."},{"t":"v","l":["(3) Хулиганчылык:","1) бир нече жолу жасалганда;"]},{"t":"p","h":"2) курап колдонуу же курал-жарак, болбосо курал катары пайдаланылуучу нерселерди колдоном деп коркутуу менен коштолгондо;"},{"t":"p","h":"3) коомдук тартипти коргоо боюнча милдетин аткарып жүргөн бийлик өкүлүнө, болбосо башка адамга, же коомдук тартиптин бузулушуна бегет койгон адамга каршылык көрсөтүү менен жасалганда, – терт жылдан жети жылга чейинки меенетке эркиндигинен ажыратууга жазаланат."},{"t":"h3","h":"} КАИТАЛОО УЧУН СУРООЛОР"},{"t":"p","h":"1. Кылмыш деген эмне?"},{"t":"p","h":"2. Кылмыштын жасалышы боюнча кандай турлеру бар?"},{"t":"p","h":"3. Кылмышты жасоого катышуучулардын кандай турлеру бар?"},{"t":"p","h":"<span class=\"pg\" data-n=\"150\">150<\/span>ИУ глава, Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"4. Кандай учурларда кылмышка окшогон аракеттер үчүн жоопко"},{"t":"p","h":"тартууга болбойт?"},{"t":"p","h":"5. Кылмышка даярдангандык жана кылмышты жасоого аракеттен-"},{"t":"p","h":"гендик деп кандай аракеттерди айтабыз?"},{"t":"p","h":"6. Жасаган кылмыш үчүн жарандар кайсыл жаштан баштап жооп"},{"t":"p","h":"беришет?"},{"t":"p","h":"7. Кылмыш жана жаза кодекси боюнча кылмыштын кандай түрлерү"},{"t":"p","h":"бар?"},{"t":"p","h":"8. Жазалардын түрлөрү жана анын максаты кандай?"}],"sub":[],"section":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН ЖАРАНЫ","pages":[150,150]},{"title":"&amp; 30. Сот процесси","blocks":[{"t":"h3","h":"&amp; 30. Сот процесси"},{"t":"img","src":"data:image/webp;base64,UklGRvwpAABXRUJQVlA4IPApAAAQLQGdASqAAoUBPrVUpU0nJK+opPKrYfAWiWluTCB6NwAaftiuKPTjqfyBhTnc19b2Rtp9bGx1XSq9FWs9f0LwvYIO9uhWgPmGDtKSCczAj8/Z2DAjWF/gRRL1VTrC6DWSFRcE8akiuOhI6kMTFQ0iZiHDk6g475ZgdaknUArODSzmR+FyCdYXP1EclQdthNt8u1KC7of7adlWc8NCjI0gO4o6KB1m2JMypf8t/r5FMDzv8ehUgA9+eIfPzDKA+wHq+PXaVu5iku+hf0GjPSBY+o/tvVMwTQt+DrBYOuRVg8VOvIIxOLqNmj9/7NHA5OE9+1sQqBWn8W418x/RRfVf6c5ndjvIm8yaZtJVJSPSyFWahtbtiU+jZZWsFRMypLy8qbWagJbtRachfG+rO/AMUW/HyYTOKXmW5z4a куктун үстөмдүгү, коомдун мыйзамдын негизинде жашоосу жана кандай гана мыйзам бузуу болбосун, аны калыбына келтирүүгө соттук кепилдиктин болушу. Ошондуктан, сот бийем. <span class=\"pg\" data-n=\"151\">151<\/span> &lt; к У глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"лиги бийликтин өзүнчө бутагы, аткаруу жана мыйзам чыгаруу бийлигине көз каранды эмес бийлик болуп сот адилеттигин ишке ашырууга тийиш."},{"t":"p","h":"Сот бийлиги конституциялык, жарандык, жазык, администрациялык жана башка түрләрдә жүзөгө ашырылат."},{"t":"p","h":"1. Конституциялык сот өндүрүшү. Кыргыз Республикасынын Жогорку сотунун Конституциялык палатасы Өзүнүн ыйгарым укуктарынын алкагындагы маселелерди чечүү максатында Кыргыз Республикасынын Президенти, Өкмәтү, Жогорку Кенештин депутаттары, соттор жана жарандар кайрыла алышат (Конституциялык палатанын ыйгарым укуктарын эстегиле). Бул субъектилер өздөрүнүн жүйөөлөрүн негиздеп, өтүнүч менен кайрылышат. Конституция тарабынан таанылган укуктар жана эркиндиктер мыйзам тарабынан бузулуп жатат деп эсептесе, аларды ар бир адам конституцияга ылайык эместиги тууралуу кайрылууга укуктуу."},{"t":"p","h":"Жогорку соттун Конституциялык палатасынын чечими акыркы болуп эсептелет жана даттанылууга жатпайт."},{"t":"p","h":"Жогорку соттун Конституциялык палатасы тарабынан мыйзамдардын же алардын жоболорунун конституциялык эмес деп белгилениши алардын Кыргыз Республикасынын аймагында колдонулушун жокко чыгарат, ошондой эле сот актыларын кошпогондо конституциялык эмес деп таанылган мыйзамдарга же алардын жоболоруна негизделген башка ченемдик укуктук актылардын колдонулушу да жокко чыгарылат."},{"t":"p","h":"Мыйзам ченемдерине негизделип конституциялык эмес деп таанылган сот актылары жарандардын даттануулары боюнча укуктары жана эркиндиктери бузулган ар бир такталган учурда сот тарабынан кайра каралат."},{"t":"p","h":"2. Жарандык процесс. Силер жарандык укук эмне экенин, анын турмуштагы мааниси зор экенин билдинер. Эгерде бул жарандык укук бузулса, аны кандай жолдор менен калыбына келтирүүгө мүмкүн экендигин билүү дагы эн зарыл. Мындай жолдун эн негизгиси – сотко кайрылуу. Ал"},{"t":"h3","h":"<span class=\"pg\" data-n=\"152\">152<\/span>ДМ СУ И |"},{"t":"p","h":"єзї. ЛЕ? И глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"эми сотко кандай талаш-тартыштарды чечүү үчүн кайрылууга мүмкүн экендиги жана анын тартиби жарандык процесс укугу менен жөнгө салынат."},{"t":"p","h":"Кыргыз Республикасындагы Жарандык-процесс укугу – бул сот тарабынан жарандык иштерди кароо тартибин аныктоочу, белгилөөчү укук тармагы, б. а. жарандык иштер боюнча сот адилеттигин ишке ашыруу, ошондой эле соттун токтомдорун (чечимдерин, аныктамаларын) мажбурлоо жолу менен аткаруунун тартиби жөнүндөгү укук."},{"t":"p","h":"Мамлекетибизди укуктук мамлекетке айландырууда ушул иштерди алга жылдырууга комек көрсөтүү үчүн жарандардын аң-сезимдүү, мыйзамдуу аракеттеринин зор мааниси бар. Сотко кайрылып, өзүнүн укугун коргоо – ар бир жарандын конституциялык укугу. Ошондуктан, талаш-тартыш маселелерди чечүү үчүн ар бир жаран мыйзамдуу жолду тандап алса, анда биз укуктук коомду тезирээк курат элек. Жашырбай эле айтсак болот, эл арасында «сотко чыр адамдар гана кайрылат» деген пикир бар, бул эң туура эмес пикир, өз укугун билген, сабаттуу жаран – чечилбей жаткан маселесин чечтирип алуу үчүн сотко кайрылуудан уялбайт. Көпчүлүк учурларда турмушта мындай окуялар көп кездешет. Бирөө экинчисинен карызга тил кат жазып берип акча алат да, мөөнөтүндө кайрып бербейт. Тигил болсо улам келип, качан бересиң деп сурайт. Берки «акчам жок болсо эмне кылайын» деп коёт. Ортодо чыр башталат, мушташ чыгып, биринин башы жарылып, экинчисинин көзү чыгат. Ал эми бул талашты мындай окуяга жеткирбей эле, мыйзамдуу, туура жол менен чечсе болмок. Акчаны карызга берген адам мөөнөтүндө акчасын ала албагандан кийин, сотко кайрылып, өндүрүүгө чечим чыгартып, андан сон, сот аткаруучу ал бересе кишинин үйүнө келип, чечимди милдеттүү түрдө эле аткартып, карызын өндүрүп бермек."},{"t":"p","h":"Ошондуктан, соттор жарандык тартипте кандай талаш-тартыштарды карарын жана анын тартиби кандай экенин билүү ар бир жаран үчүн зарыл."},{"t":"p","h":"<span class=\"pg\" data-n=\"153\">153<\/span>У глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"Сотто жарандык тартипте өзүнөр билгендей, жарандык укуктун келишимдик милдеттенме, менчик, зыян келтирүү, автордук, ойлоп табуу, ачылыш жасоо, мурастоо укуктарынан келип чыккан талаш-тартыш маселелер каралат."},{"t":"p","h":"Мындан тышкары, үй-бүлөлүк, эмгектик укук мамилелеринен келип чыккан талаш-тартыштар, ошондой эле жарандардын кызмат адамдарынын, мамлекеттик органдардын аракетине даттануусу боюнча талаш-тартыштар да каралат."},{"t":"p","h":"3. Жазык процесси. Жазык-процесс укугу – жазык иштерди козгоо, алдын-ала тергөө жана сотто кароо аракеттерин жана алардан келип чыгуучу укуктук мамилелерди жөнгө салуучу укук."},{"t":"p","h":"Жазык-процесс укугунун максаты кылмышты тез жана толук ачуу, күнөөлүүлөрдү ашкерелөө жана кылмыш жасаган ар бир адамдын адилеттүү жазага тартылышын жана бир дагы күнөөсүз адам кылмыш жоопкерчилигине тартылбагандай жана соттолбогондой мыйзамды туура колдонууну камсыз кылуу болуп эсептелет. Бул укук тармагы укук коргоочу органдардын, коомчулуктун иш-аракетин, коомдун жана адамдардын кызыкчылыгын ар түрдүү кылмыштуу кол салуулардан коргоого багыттайт, мыйзамдуулукту сактоодо, кылмышты болтурбай коюуда, жарандарды мыйзамды урматтоого жана аны бузуучуларга келишпөөчүлүктү тарбиялоодо зарыл болгон бардык өбөлгөлөрдү, шарттарды түзөт."},{"t":"p","h":"Жазык-процесс укугунун негизги булагы болуп, Кыргыз Республикасынын Жазык-процесс кодекси эсептелет. Бул Кодексте кылмыш аныкталгандан баштап, аны козгоо, алгачкы текшерүү жүргүзүү, алдын ала тергөө, сотто кароо жөнүндө жана алгачкы текшерүү органдарынын, тергөөчүнүн, соттун укуктары, милдеттери, жабыр тарткан адамдардын, ошондой эле айыпкерлердин, соттолуучулардын жана алардын жактоочуларынын укук-милдеттери жөнүндөгү жоболор камтылган."},{"t":"p","h":"Жазык процесси негизделген конституциялык принциптерди билүү маанилүү. Алардын катарына төмөнкүлөр кир <span class=\"pg\" data-n=\"154\">154<\/span> ү|"},{"t":"p","h":"У глава. Кыргыз Республикасындагы укук тармактары"},{"t":"p","h":"рет. Жазык иши боюнча айыпталуучу езунун кунеелуу эместигин далилдөөгө милдеттүү эмес. Күнөөлүү экендигин далилдөөгө же жокко чыгарууга мүмкүн болбогон күмөн саноолор айыпталуучунун пайдасына чечилет. Әч ким өзүнүн кылмыш жасагандыгын мойнуна алгандыгынын негизинде гана соттолушу мүмкүн эмес. Кылмыш иши үчүн соттолгон ар бир киши мыйзамда белгиленген тартипте өзүнө чыгарылган өкүмдүн жогору тургАн сот инстанциясында кайра каратууга укуктуу, ошондой* эле ырайым алууга же жазаны женилдетүүнү өтүнүүгө укуктуу. Гумандуулуктун белгиси катары эч ким өзүнө жана өзүнүн жубайына, жакын туугандарына каршы күбө болууга милдеттүү эместиги белгиленген. Ар бир кармалган, камалган же кылмыш жасаган деп айыпталып жаткан адам адвокаттын (жактоочунун) жардамынан пайдаланууга укуктуу."},{"t":"p","h":"4. Администрациялык процесс. Мыйзам менен каралг учурларда – белгиленген тартиптерге каршы аракетте жасагандык үчүн (эгер мындай кылмыш эмес @ со) иштердин кызмат адамдары же сот тарабынан кара шы бул укук менен жөнгө салынат. Мисалы, бынан жолдо жүрүү эрежесин бузгандык үчүн МАИнин кызматкеринин териштирүүсү ЖЕ: айып төлөм колдонушу, же болбосо майда хулигандык аракеттерди` адамдын ишщнин сотто карёжыш тартиптери."},{"t":"v","l":["(\\ Бардык сот процесстерине тиешелүү жалпы пр","бар.^Жлардын катарына бардык соттордо Яштерд","карал{тшын, 'жабык жыйналышта ишти кароов","да белгиленген учурда гана жүргүзүлүшүн","Ошондой эле, мыйзащда белгиленген ушурладь","до, иштерди сотто сыртынан териштирүүгө"]},{"t":"img","src":"data:image/webp;base64,UklGRqwzAABXRUJQVlA4IKAzAABw7wCdASppAW0BPrVSokunJKMlKLN76OAWiWluZZ8kajl9Z0ldIkpRuG68U1/pM83/yX5X/2n1F/Hfp/8z/d/3O/wHuf6L+wn/Q/0HqZ/L/vx+4/vfpv+y/kv+Z/wX/F9Qj8p/on+49NT8Xu1dt/5noEe3n3/v5f+L03/Sf85   // ---------------------------------------------------------------- storage helpers
  function lsGet(k, def) { try { var v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode: ignore */ } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

  function t(k) { return (I18N[S.ui] || I18N.ru)[k] || I18N.ru[k] || k; }

  function applySettings() {
    var r = document.documentElement;
    r.setAttribute('data-theme', S.theme);
    r.setAttribute('data-font', S.font);
    r.style.setProperty('--fs', S.fs + 'px');

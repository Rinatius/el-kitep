кеттин ж. б. программалары болот. Программа өз ичине бир топ жылдык иш-чараларулам кийинки жылыштар андан аркы багыттар аныкталат."},{"t":"raw","h":"<div class=\"gloss\"><p><\/p><\/div>"},{"t":"h3","h":"<span class=\"pg\" data-n=\"18\">18<\/span>УСТАВ"},{"t":"p","h":"Устав азыркы учурда көбүнчө ишкер, иш алып баруучу ишканалардан учурайт. Анын негизги максаты – иш алып баруунун негизги багыттарын баяндоо менен, кандай, кайсы акча каражаттарына байланыштуу иш алып бара тургандыгын санап берет. Кимдер тарабынан көзөмөлдөнөт, кимдерге отчёт берет, иш-аракеттеринин кирешеси жана чыгымы боюнча милдеттүү түрдө билдирип турулушу уставда камтылат. Эгер силердин ата-энеңердин ишканасы болсо, алардын уставдары менен таанышсаңар болот. Силер бүгүнкү күнгө чейинки тааныш болуп келе жаткан расмий эмес иш кагаздары мамлекеттик уюмдарды эл менен байланыштыруучу кызмат аткарса, расмий иш кагаздары милдеттүү түрдө аткарылуучу максат көздөгөнүн көрүп турасыңар. Ошондуктан расмий деп аталарын эсиңерге түйүп коюшуңар керек."},{"t":"p","h":"Окуп жаткан сабактарыңар да күн мурунтан иштелип чыккан программанын негизинде түзүлүп, ошого жараша окууга ылайык темасы, сааты, чейреги ж. б. белгиленүү менен ишке ашат. Программа алдын-ала иштелүүчү иштердин чаралары, мөөнөтү ж. 6. белгиленсе, уставда иштелүүчү иш-чараларынын негизги жол-жоболору белгиленет, каралат."},{"t":"p","h":"Мыйзам программадан жана уставдан айырмалуу. ' Ал эл тарабынан шайланган Жогорку Кеңештин мыйзам чыгаруучу органы тарабынан бекитилген болот. Бекитилерден мурун элдин талап-мүдөөсүн аске алуу менен, мамлекеттик түзүлүштүн бардык иш-чараларын жүргүзүү үчүн иштелип чыгуу керек. Мыйзам ' бардык адамдар үчүн бирдей таасирлүү болуп саналат, ‚ б. а., жаштардан карыларга чейин, жөнөкөй жумушчулардан мамлекет башкаруучуларга чейинки атуулдар үчүн кызмат аткарат. Ошондуктан мыйзам жалпы эл тарабынан сунуш этилген, аткаруучулар үчүн ийкемдүү түрдө түзүлүп, ар бир беренеси (статьясы) кыргыз улутундагылар үчүн толук түшүнүктүү, башка улуттагы- › лар үчүн орус тилинде түшүнүктүү болуу керек."},{"t":"p","h":"Указ мамлекет башчысы тарабынан чыгарылат, ал ‚ тарабынан белгилүү деп эсептелген жалпы жоболор, <span class=\"pg\" data-n=\"19\">19<\/span>белгилүү даталар белгиленет, мамлекеттик кызматкерлер дайындалат. Расмий иш кагаздарынын указдан башка түрү талкууга алынып, эл тарабынан кайра карап чыгуусу мүмкүн болсо, указ талкууланбайт, прези- ‚ денттин жеке чечими боюнча ишке ашат, Указ чыккан › шаар, датасы жана президенттин колу коюлат."},{"t":"raw","h":"<div class=\"gloss\"><p>н и н н<\/p><\/div>"},{"t":"p","h":"13. Мугалимдин жардамы менен «Кыргыз тили» же «Кыргыз адабияты» боюнча түзүлгөн программа менен таанышып, чейрек боюнча план түзүп көргүлө. Чейрек аяктаганда аткарган ишиңер, окуган темаңар боюнча отчет түзгүлө."},{"t":"p","h":"14. Мектебиңердин көрүнөө жеринде мектептин Устаны, Программасы илинип турган болуу керек. Ошону менен нышып, программа менен Уставдын айырмасын карап, дептериңерге аскертме жазгыла."},{"t":"p","h":"15. Кийинки чыккан Указдар менен таанышып, алардын өзгөчөлүгүн белгилегиле."},{"t":"p","h":"Расмий да, расмий эмес да иш кагаздарынын стилине мүнөздүү болгон негизги өзгөчөлүк катары буларды белгилөөгө болот:"},{"t":"p","h":"„тышкы түзүлүшү боюнча, б. а., формасынын өзгөчөлүгү (штампы, колу, ырастоочу белгилери болушу керек);"},{"t":"p","h":"“сөз каражаттарынын ар бирине тиешелүүлүгү, б. а., керкөм сөз каражаттары дээрлик колдонулбайт (этме маани, фразеологизмдер);"},{"t":"p","h":"– айтыла турган ой ачык, так, анык туюндурулушу керек;"},{"t":"p","h":". сүйлөм курулушу, сөз айкаштары иш кагаздарынын мүнөзүнө ылайык колдонулат, б. а., чагылдырылып жаткан мазмунга шайкеш келген терминдер, айрым учурда иш кагаздарынын мүнөзүнө жараша сүйлөмдөгү сөздер орун алмашып түшөт ж. б."}],"sub":[{"title":"ПРОГРАММА","b":1},{"title":"УСТАВ","b":6}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[18,19]},{"title":"&amp; 5. ИЛИМИЙ СТИЛДЕГИ ПРАКТИКАЛЫК ИШТЕР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"20\">20<\/span>&amp; 5. ИЛИМИЙ СТИЛДЕГИ ПРАКТИКАЛЫК ИШТЕР"},{"t":"p","h":"Илимий иштердин аткарылышы коомдук башка кызмат аткарган жазуу жумуштардан айырмаланат. Анткени илимий иштердин өзүнүн өзгөчөлүктөрү бар. Илимий иштерге окуу китептери, илимий изилдөөлөрдүн аткарылышы, рефераттар, илимий монографиялар, курстук, дипломдук иштер ж. б. кирет. Ар бир илимдин тармагына байланыштуу терминдердин колдонулушу, жазылуу өзгөчөлүгү башкалардан айырмалайт. Ойдун тактыгы, баяндоо ыкмасы менен аткарылышы, түзүлүшү боюнча киришүүдөн, негизги иликтөөдөн, корутундудан турушу, пайдаланылган адабияттардан цитатанын камтылышы жеке айырмачылыгын айгинелейт. Бул – илимий стилдин сырткы өзгөчөлүгү."},{"t":"p","h":"Силер окуп жаткан учурларыңарда күнүгө илимий чыгармалар менен иштеп келе жаткандыгыңарды байкасаңар керек. Анткени тигил же бул сабактарга даярданган учуруңарда сабагынардын мүнөзүнө жараша терминдер, формулалар, аныктамалар (эрежелер), теоремалар ж. б. менен кезигишип келесиңер. Андагы терминдер кадимки биз пикир алышып келген сөздөрдөн айырмаланат, мисалы, сөз негизги атоо маанисинен тышкары көркөм ыкма катары өтмө мааниге ээ, ал бир канча семантикага ажыроо аркылуу контексттеги колдонулушу кенен. Ал эми термин болсо, илимдин ошол тармагына тиешелүү гана түшүнүктү билдирип, чектелген семантикалуулугу менен айырмаланат."},{"t":"p","h":"Физикадагы сүрүлүү термини заттын тегиздиктеги кыймыл менен бирге болгон түшүнүктү белгилөө үчүн колдонулса, пикир алышуу куралы катары сүрүлүү артка жылуу, жылмышуу, өтмө маанисинде коомдон, элден чыгып калуу абалындагы бир канча маанини билдирет."},{"t":"h3","h":"РЕФЕРАТ"},{"t":"p","h":"Реферат – кандайдыр бир тема боюнча жазылган кыска илимий эмгек. Илимий стилди калыптоодо чоң мааниге ээ, тактыгы, маалыматтарынын арбындыгы, тилинин жеткиликтүүлүгү менен айырмаланууга <span class=\"pg\" data-n=\"21\">21<\/span>тийиш. Рефератта илимий маалымат гана берилбестен, референттин (реферат жазган автордун) жазып жаткан материалга карата мамилеси, баасы чагылдырылат. Ал монографиялык (бир чыгармага же жеке авторго арналган) же обзордук (бир топ чыгарманы жалпылаштырып камтыган) формада болот. Реферат референттин өз сөзүнөн турат, анда айрым зарыл деп эсептелген учурларга гана цитаталар колдонулат жана ал кайдан алынганы (китептин автору, аты, чыккан жылы, бети) көрсөтүлөт. Илимий иштин бул жөнөкөй түрүн ар кандай композициялык планда түзсө болот. Адатта реферат төмөнкүдөй тартипте түзүлөт:"},{"t":"raw","h":"<div class=\"gloss\"><p> (| җ <\/p><\/div>"},{"t":"p","h":"1. Кириш бөлүмү – рефераттын темасы болгон чыгарманын, илимий эмгектин автору жөнүндө кыска маалымат, сөз болуп жаткан чыгарманын жазылыш тарыхы ж. б.;"},{"t":"p","h":"2. Рефераттын негизги бөлүгү – тема боюнча кыскача, бирок жеткиликтүү илимий маалымат берүү;"},{"t":"p","h":"3. Баяндалган маалыматтарга карата, анын мааниси тууралуу жыйынтыктар, жалпылоолор."},{"t":"p","h":"Рефератта адабий талдоо берүүгө, сын макалалардан, мемуарлардан, тарыхый-биографиялык башка булактардан пайдаланууга кебуреек аракеттенуу керек, ошондой эле алгачкы илимий изилдөөнүн усулу болууга тийиш."},{"t":"p","h":"Реферат – илимий стилге мүнөздүү. Атайын бир темага арналган маселеге байланыштуу адабияттарды изилдеп окуп чыгуу менен ой маселе жөнүндө кеңири Ө ШЕ ЧЫ ЭШЕ СЫ СШ ЭЧЕ ЧЕ Л ыы „ылыныы йыйын т түшүнүк берүү, рефератты аткаруудан мурда керектүү коюу максаттуу. Андан соң рефераттын планын түзүп, ар бир бөлүмгө тиешелүү маалыматтарды түшүргөн оң. Өзүңөр жазып жаткан оюңарды бекемдөө үчүн силер күн мурун окуп алган илимий адабияттарга шилтеме жасап, цитата бересиңер. Рефераттын аягында кору- тунду болуу керек, ал силердин ишиңердин, оюңардын, иштеп чыккан маселелер боюнча аз болсо да жеке көз адабияттар боюнча кыскача конспект түзүп, анын авторун, чыккан жылын, шаарын биротоло кагазга түшүрүп карашыңардын бир жыйынтыкка келгендигине далил болот. Андан кийин силер окуп чыккан адабияттардын тизмеси берилет."},{"t":"raw","h":"<div class=\"gloss\"><p>ош йай айы ААЙЫ т<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"22\">22<\/span>„Реферат түзүүнүн үлгүсү:"},{"t":"p","h":"Эгерде география сабагы боюнча «Кыргызстандын суу байлыктары» деген темада реферат жазуу керек болсо, көрсөтүлгөн адабияттардан тышкары окуу китебинен материал аласыңар. Планын болжолдуу мындай түзсө болот:"},{"t":"p","h":"Киришүү: (Суу байлыктары боюнча кыскача маалымат берүү менен тандап алган темаңардын иликтөө зарылчылыгын көрсөтөсүңөр)."},{"t":"p","h":"1. Мөңгүлөр. (Мында мөңгүлөр, көп жылдык тоң кыртыштар жөнүндө жазасыңар. Алар кантип жаралат, эришинин себептери, көп эрип кетсе эмне болот, андан кантип сактанууга болот ж. б.)."},{"t":"p","h":"П. Суулар. (Мында теманы ачуу үчүн «Агын суулар. Көлдөр. Суу сактагычтар. Жер алдындагы суулар» деп бөлүп алуу зарыл)."},{"t":"v","l":["Корутунду.","Пайдаланылган адабияттардын тизмеси.","Шилтеме берүүнүн үлгүсү:"]},{"t":"p","h":"Силер жазып жаткан оюңардын чын, анык экендигин, илимий так маалыматка кайрылуу зарылчылыгы келген учурда бүтүндөй сүйлөмдү, абзацты өзгөрүүсүз киргиздиңер дейли. Анда өзүңөрдүн оюңардын арасына тырмакча («») аркылуу берип, андан соң силер таянган адабияттын маалымдамасын бересиңер. Көңүл бургула:"},{"t":"p","h":"«Кыргызстандын аймагында аянты 0,1 ки? ден жогору болгон 6516 мөңгү катталган. Алардын ээлеп турган аянты 8047,8 км?, б. а., республиканын жалпы аянтынын 4%ин ээлейт. Эгерде бардык менгулерду (аянты 0,1 км? ден төмөн) эсептесек, алардын саны 7688ге жетет жана аянты 8107,7 км? ге барат». (Бакиров Н. Б., Исаев А. И., Осмонов А. О. Кыргыз Республикасынын географиясы. – Б., 1998, 59-б.)"},{"t":"p","h":"Силер кээ бир сабактардан реферат жазып жүрөсүңөр. Реферат тигил же бул тармак боюнча жазылган илимий эмгектердин негизинде изилдөө иштерин жүргүзүү менен аткарылган монографиянын кыскача такталган, аныкталган мазмуну болуп саналат. Ал изилдөөнүн негизин, кыскача маңызын берүүдө автордун өз стили болушу мүмкүн. Экинчи бир туру <span class=\"pg\" data-n=\"23\">23<\/span>илимдер тармактарындагы жаңылыктарды окуучуларга жеткирүү максатында атайын журналдарда атайын басылма катары ишке ашышы мүмкүн. Ал эми силер түзүп жүргөн рефераттар белгилүү бир темага арналып, ал боюнча жазылган илимий эмгектерди окуп чыгуу менен тема боюнча өзүңөрдүн ой жыйынтыктарыңар, көз караштарыңар топтолгон болот. Оюңардын тууралыгын аныктоо үчүн окумуштуулардын илимий пикирлерине таянып, цитата бересиңер. Цитата менен катар автору, илимий эмгектин аты, чыккан шаары, жылы, эмгектин бети кошо көрсөтүлөт."},{"t":"h3","h":"КОНСПЕКТ"},{"t":"p","h":"К о не п е к т -— окулган же угулган тексттин кыскача мазмунун негизги ойду кагазга түшүрүү. Текстти адегенде көңүл коюп окуп чыгып, анан план түзүп, ар бир бөлүмдөгү эң негизги ойду белгилеп алып, кагазга кыскача баяндоо керек. Сөздөрдү, сүйлөмдөрдү кыскартып жазууну, шарттуу белгилер менен берүүнү уйренуу кажет. Тексттин негизги маанисин сактоодо тезис жазуу талап кылынат. Тезис – тексттин кыскартылган формасы, ар кандай тезис узартып сүйлөөгө ылайыкталган болуш керек. Тезисте өзүңөр кошо турган фактылар менен ойлор айтылбайт, аны кийин конспектиге кошосуңар. Конспектини кыска жазса да, текстке жакын узун жазса да болот, эң негизгиси ошол конспект кийин өзүңөргө кеңири жана системалуу сүйлөгөнгө мүмкүнчүлүк ачууга тийиш. Демек, конспекти- ЧИЛЧЕ Чү АР ч ЧЕ ананан ч ч е ИШИНЕ ЧЕ нин негизи – тезис. темаларга айлантып сүйлөп берүүгө да мүмкүн. Цитата- ларды, айрым цифраларды дароо көзгө чагылсын үчүн башка түстөгү (кызыл, жашыл) сыя менен жазууга бо- лот, ете керектүү маанилүү жерлеринин астын сызып же ар бир ойду он абзацка бөлүп койгон да ыңгайлуу. жаткан текст кайсыл чыгармадан экенин толук жазып чыккан маалыматтарын берүү керек. Конспектиңердин Конспектинин баш жагына ошол конспектиленип"},{"t":"p","h":"Конспектинин жазылыш формаларын да үйрөнгүлө, Текстин планын тузсенер болот, аны кийин майда <span class=\"pg\" data-n=\"24\">24<\/span>бир четине актай бош орун калтыргыла, кокус жаңы ойлор, толуктоолор болсо ошол жерге жазасыңар."},{"t":"raw","h":"<div class=\"gloss\"><p>„ы“ ч сч ср сч чү<\/p><\/div>"},{"t":"p","h":"Конспектилеенун өзгөчө туру – жогорку класстарда мугалимдин дарсын кагазга түшүрүү. Лекторлор ар түрдүү болот, бирөө жай айтат, атайын жазып алсын үчүн айрым учурларды бөлүп, кайталап сүйлөйт, кээ бирөөлөр өтө тез, шашып окуйт. Ошондуктан ар кандай окулган дарсты конспектилеп үйрөнүү керек. Мугалим- дин оозунан чыккандын баарын эле кагазга түшүрүүгө аракеттенбеш керек, маанилүүлөрүн бөлүп алганга үлгүрүп, башкы ойдун өнүгүшүн ээрчип отуруу зарыл. ©з конспектинди башкалардыкы менен салыштырып көрүп, толуктап, ашыкча жазылган жерлерин байкоо керек. Мектепте конспектилөөнү үйрөнүп алуу менен окуу жайында кыйналбай биреенун кебин жакшы угууга җана негизги нерселерди туя билүүгө, сезимтал жана зирек болууга көнүгөсүң."},{"t":"p","h":"Конспект рефераттан айырмалуу болот. Конспект окуган адамдын өзүнүн жекече кызыкчылыгы, вез карашы үчүн маанилүү. Ошондуктан илимий эмгек болобу, көркөм чыгарма болобу, унутуп калбаш үчүн кыскача, маанилүү жерлерин өзүнө эскерткич катары жазып алуу конспектинин бир түрүн билдирет. Айрым учурда сүйлөй турган сөздөрдүн конспектисин түзүп алуу ‚ учурайт. Мындай түрүнө официалдуу жерлерде чыгып сүйлөгөн учурда цифралык маалыматтарды, саясий жол-жоболорду, кынтыксыз ишке ашырылуучу мамлекеттик маанилүү маселелерди ойдон чыгарбаш үчүн күн мурунтан түзүлгөн конспект аркылуу берет. Анын негизинде күндөлүк массалык маалымат каражаттарына таралат."},{"t":"h3","h":"ЦИТАТА"},{"t":"p","h":"Илимий иштерде эске алынуучу маанилүү таяныч цитата болуп эсептелет. Цитатаны кеңири карасак, бирөөнүн оюн өз оюңду бекемдөө үчүн колдонуу деп караса болот. Андай учурда макал-лакаптарды, философ ойчулдардын учкул сөздөрүн да цитата деп айтууга болот. Мындайда элде баландай деп айтылат, ушундай макал бар эмеспи, баланча айткандай ж. б. кеп каражаттары аркылуу өз оюндун тууралыгын бекемдейсиң."},{"t":"p","h":"<span class=\"pg\" data-n=\"25\">25<\/span>М.: Калыгул олуя «Ысык-Көл жер соорусу» дегендей, кыргыз элимдин касиеттүү көлү ак калпактуу тоонун ортосунда, кышы анча суук эмес, жайы анча мээ кайнаткан ысык амес, жер-жемиштери төгүлгөн, эгин десең эгинге мол, мал десең мал киндиктүү жер экени жалганбы десең, анда Калыгул олуянын бул айткан жер соорусу деген оюн тереңдетип чечмелөө менен бирге, ал адамдын оюнун калети жок экенине да таянган болосуң. Илимий чыгармалардагы цитата – өзгөчө. Эмгектерде берилиши да жогорудагы мисалдан айырмалуу. Илимий иштин аткарылышында окумуштуулардын ошол темага байланыштуу изилдөөлөрүнө таянуу менен өзүнүн (автордун) ою такталып, бекемделет. Андыктан илимий көз карашынын тууралыгын бекемдеш үчүн өз оюна окшош, автордун эмгегине шилтеме жасайт. Муну өзгөчөлөнгөн белгилер менен жазууда ылайыкташтырат. Мисал келтирели:"},{"t":"p","h":"«XX кылымдын ортосунда табигый илимдердин өнүгүшү, анын метод-ыкмаларын, принциптерин тил илиминде колдонуу натуралисттик багыттын жаралышына, өнүгүшүнө өбөлгө болду. «Теория Дарвина и наука о языке» (1863), «Значение языка для естественной истории человека» (1865) ж. 6. у. с. эмгектери А. Шлейхердин тил илиминдеги натуралисттик багыттын негиздөөчүсү катары лингвистиканын тарыхындагы ордун белгиледи». (Мусаев С. Жалпы тил илими. чүү че тилдик багыттын өнүгүшүнө токтолду. Бул жерде С. Мусаев өз оюнун бекемдигин далилдеш учун А. Шлейхердин эмгектерин көрсөтүү менен,"},{"t":"p","h":"Цитата да, бирөөнүн өздөштүрүлгөн сөзү да бөтөн сөз катары текст ичинде өзгөчө белгилер менен берилет. Цитата айрым учурда өздөштүрүлгөн абалында ез сөзү катары берилгени менен, шилтеме белгиси коюлуп белгиленет."},{"t":"p","h":"М и с а л ы, ономастика термини грек тилинен ат берүү искусствосу деген түшүнүктү берүү менен энчилүү аттар жөнүндөгү илим экендигин туюндурат. (Бондалетова В. Д. Русская ономастика. – М., «Просвещение», 1983, 3-6.)"},{"t":"p","h":"2%"},{"t":"raw","h":"<div class=\"gloss\"><p>ч \"Н ачыш ы ЫР \"ШР ЧЕ ы Че ЧЕ СЕ БЕРСИН чы с ч е ы<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"26\">26<\/span>Жогоруда өзүңөр көргөндөй цитатанын илимий бе- ‹ рилиши тактыкты, атайын шарттуу белгилердин дал өзүндөй камтылышын талап кылат. Илимий эмгектин ‚ чыккан шаары, басманын аты, жылы жана китептин бети көрсөтүлөт. Бул илимий этиканы туюндурат."},{"t":"p","h":"16. Төмөнкү илимий эмгектеги түз цитатаны жана өздөштүрүлгөн цитатаны байкап, алардын тыныш белгилерине көңүл бургула. Илимий стилге мүнөздүү белгилерин аныктагыла."},{"t":"p","h":"Топонимика термини XX кылымдын 20-жылдарынан тартып колдонула баштайт. Изилдөөчүлөрдүн бири С. Б. Веселовский «Топонимика – топономастика термининин кыскартылган (Веселовский С. Б. Топонимика на службе у истории. Исторические запис-"},{"t":"p","h":"Географиялык объектинин чон же кичинелигине карай макротопонимдер жана микротопонимдер деп экиге бөлүп кароо да орун алып жүрөт. Бул гректердин «макро» – чоң жана «микро» – кичине деген сөздөрүнөн келип чыккан. Кээ бир окумуштуулар тарабынан макротопонимдерге Азия, Африка, Европа, Атлантика, Индия, Борбордук Азия, Сибирь, Тян-Шань сыяктуу континенттерди, океандарды, өлкөлөрдү географиялык планда жалпылаштырып, чектеп көрсөтүлгөн белгилүү бир зор территориянын аттары кирүүгө тийиш деген пикирлер айтылат. (Микротопонимия. – М., 1967, 85 – 36-6.) Ошону менен бирге микротопонимдердин баарын, макротопонимдер деп өзүнчө бөлүп карабастан эле жалпысынан топонимдер деп атай берүү учурлары кездешет. Латыш топонимдерин изилдеген эмгектерде макротопонимдерге жана микротопонимдерге бөлүп кароо жок. (Микрото-"},{"t":"p","h":"Дарыялардын, өзөндөрдүн, ар кандай агын суулардын, булактардын, суу бассейндеринин аттары жалпысынан кидронимдер, көлдөрдүн аттары – лимонимдер, саздардын аттары – геланимдер, өзөндүн аттары – патонимдер, тоолордун аттары – оронимдер, кыштактардын аттары – комонимдер, шаарлардын аттары – полисонимдер, аянттардын, көчө, көпүрөлөрдүн аттары – урбонимдер деп аталат. (Исаев Д. Жер-суу аттарынын сыры. —"},{"t":"p","h":"<span class=\"pg\" data-n=\"27\">27<\/span>17. Төмөнкү тексттен цитата берүү ыкмасын, техникалык берилишин, тыныш белгилерин карагыла. Илимий стилге мүнөздүү өзгөчөлүктөрүн белгилегиле. Ушул тексттен кийин Ч. Айтматовдун «Кылым карытар бир кун» романын окуп, конспект тузгуле."},{"t":"p","h":"Чынгыз Айтматов өз чыгармачылык жолунда биринчи жолу фантастикалык сюжетке кайрылып, өзүнүн бүгүнкү күндүн турмуш чындыгы жөнүндөгү ойлорун, байкоолорун космологиялык окуялардын метафорасында интерпретациялоого аракеттенгендигин көрөбүз. Чыгармада сүрөттөлгөн ошол фантастикалык сюжеттин көркем-философиялык түйүнү да жер адамынын өмүр-тагдырына уюп турат."},{"t":"p","h":"«Кылым карытар бир күн» романы туурасында бүгүнкү күнгө дейре бизде жана чет өлкөлөрдө бир катар макалалар жазылды. Аларда чыгарманын негизги идеясы, көтөргөн проблемасы, ал идеяны, проблеманы алып жүргөн көркөм образдардын идеялык-көркөмдүк мазмуну женунде бир кыйла олуттуу ойлор айтылды. (Караңыз: Асаналиев К. Дела земные. – Сов. Киргизия, 1981, 8 января; Абдумомунов Т. Живет в Буранном человек."},{"t":"p","h":"– Сов. Киргизия, 1981, 8 февраля; Дудин М. На дальнем разъезде. – Сов. Киргизия, 1981, 16 января; Потапов Н. Мир человека и человек в мире. – Правда, 1981, 22 мая; Григорьева Н. И Дольше века длится день. Путь Ильича. 1981, 7 июля; Какеев А. Адамдыкты даңазала: ган роман. – Кыргызстан маданияты, 1981, 26-март; Касымбеков Т. Гуманизмдин туусун котерген. – Кыргызстан маданияты, 1981, 13-март.) Негизинен ал макалаларда азыркы учурдун курч саясий, идеологиялык, нравалык-философиялык маселелерин камтыгандыгы белгиленип, ал эми башкы каарман Эдигей биздин учурдун нагыз белгилерин өзүнө сиңирген каарман катары эң жогору бааланды."},{"t":"p","h":"Ч. Айтматовдун жазуучу, ойчул катары башка калемдештеринен айырмалап турган бир өзгөчөлүгү ал өзүнүн көркөм изилдөөбүнүн негизги кредосун, ага карата автордук мамилесин окуучуларынан жаап-жашырбай, ачык айтып, алардын ой-кыялдарын өз учурунда туура багыттай билүүсүндө турат. Аябагандай полемиканын айдыңы болгон «Ак кеме» повестинин идеялык-эстетикалык; <span class=\"pg\" data-n=\"28\">28<\/span>көркөм-философиялык катмарын таасын аңдапбилүүдө да реалист-автор өзү окуучуларына жардамга келип, «Литературная газетага» «Айласыздан болгон толуктоолор» («Литературная газета», 1970, 29 июля) аттуу макаласын жазган эле."},{"t":"p","h":"«Кылым карытар бир кун» романында мындай милдетти алдын-ала эле «Автордон» деген кичинекей макаласында абдан компакттуу жана терең мазмунда аткарып койгондугуна күбө болобуз. Ал эми романга байланыштуу кийинчерээк берген интервьюларында (Айтматов Ч. Коомдун идеяларына кызмат өтөө. – Ленинчил жаш, 1981, 12-сентябрь; Понять и воспеть современника. – Ленинское знамя, 1981, 22 марта.) Чыңгыз Айтматов романы боюнча өз ой жыйынтыктарын дагы да чечмелеп толуктады. Албетте, мына ушул жагдайлар жазуучунун жаңы перзенти туурасында кандайдыр бир өзгөчөлүктү башкаларга үндөшпөгөн пикир айтуу кыйынчылык туудурары өзүнөн өзү түшүнүктүү. Бирок ошондой болсо дагы, «Кылым карытар бир күн» романына кайрылган ар бир адабиятчы, сынчы өзүн бетенче кызыктырган көз караштан чыгарманы аңдап, окуган адамдын жан-сезимин козгоп, жаңы идеялык-нпавалык бийиктиктерге умтулткан анын көп кырдуу, көп сырдуу поэтикасынын табышмагын мезгилдин арымын улай жандыра беришери табигый иш. (Укибаева Л. Адам дүйнөсү көркөм образда. – Б.,"},{"t":"p","h":"18. Текстти окуп чыгып, конспект түзүүгө обелге болуучу кыскача ой натыйжа жазгыла."},{"t":"p","h":"19. Тарых сабагына карата «Үркүн» темасына ылайыктуу реферат жазгыла. План түзүүдө мугалимиңер менен биргелешип, жардамдашуусун өтүнгүлө. Буга 1998-жылы чыккан * Үркүн» аттуу тарыхый-даректүү очерктердин жыйнагын пайдалангыла."},{"t":"p","h":"20. Төмөнкү илимий эмгекти окуп, анын конспектисин түзгүлө. Илимий жанрга тиешелүү белгилерди аныктагыла."},{"t":"p","h":"Жаңы кыргыз тили. Болжол менен XVI кылымдан башталган жаңы кыргыз тилинин тарыхы негизинен тянь-шандык доорду өз ичине камтып, кыргыз диалектилеринин өнүгүш өзгөчөлүктөрүнө жараша үч мезгилге бөлүнөт:"},{"t":"p","h":"<span class=\"pg\" data-n=\"29\">29<\/span>а) моголстандык-жунгардык мезгил (ХУГ – ХУШ кылымдар);"},{"t":"p","h":"б) XVIII кылымдан революцияга чейинки мезгил;"},{"t":"p","h":"в) советтик мезгил."},{"t":"p","h":"а) Моголстандык-жунгардык мезгилде кыргыз уруулары Чыгыш Түркстандан, кийинчерээк Борбордук Тян- Шандан байыр алып, ал жерлердеги элдер алгачкы кездерде көбүнчө уйгур диалектилери менен ар түрдүү байланышта жашайт. Ошондуктан Моголстандагы кыргыз диалектилери уйгур тили менен тыгыз байланышта болуп, бир бирине өз ара таасир тийгизип, биринчи кезекте лексикалык кабыл алуулар башталат. Азыркы кыргыз диалектилери менен уйгур тилиндеги жалпылыктар,» асыресе кыргыз тилине уйгур диалектилери аркылуу иран-араб сөздөрүнүн өтэ башташы ошол мезгилге туура келет деп болжолдоого болот."},{"t":"p","h":"Борбор Азиядагы жунгарлар (кийин аларды түрк элдери «калмактар» дёп аташкан) улам барган сайын чоң күчкө айланып, Чыгыш Түркстандагы жана Борбор Азиядагы элдерге катуу чабуул жасап турат. Ал элдердин чыгыш тарабындагы кыргыз уруулары жунгарлардын үстөккө-босток соккуларынын натыйжасында улам түштүк-йатыш тарапка жылууга мажбур болот. Кыргыз урууларынын алды улам сүрүлүп отуруп, Кара тегин, Кысар өрөөндөрүнө (б. а., Памир тоолоруна чейин), арты Анжиян, Алай тоолоруна чейин жетет. Бул мезгилде (КУП кылымдан XVIII кылымдын ортосуна чейин) кыргыздар көбүнчө уйгур, өзбек, тажик, казак элдери менен саясий жана экономикалык байланышта болот, ошондуктан ал тилдерден негизинен соодага, дыйканчылыкка же ислам динине байланышкан көп иран-араб сөздөрү кабыл алынат."},{"t":"p","h":"б} XVIII кылымдын орто ченинде азиялык элдердин каардуу душманы – жунгарлар жеңилет, кыргыз уруулары өзүнүн мурунку жерлеринен душманды кууп чыгып, кайта ээлешет. Ысык-Көл, Чүй, Талас өрөөндөрүнө, Нарын дарыясынын салааларына түндүк кыргыз уруулары, Түркстанга, Фергана өрөөнүнүн түштүк жана батыш тарабындагы тоолордун этектерине ичкилик урууларынын өкүлдөрү Памир тоолору тараптан кайта көчүп келишет. Мына ушул жер которуудан кийин диалектилердин тарыхында <span class=\"pg\" data-n=\"30\">30<\/span>маанилүү өзгөчөлүктөр башталат. Түндүк говорлор менен түштүк говорлор ортосундагы мурункудай байланыш болбой калат. Нечен-нечен улуу тоолор аркылуу карым-катыш жасап туруу азаят, саясий жактан биримдик болбой, феодалдык бытырандылык күчөйт. Башкача айтканда, түндүк жана түштүк диалектилер ар бири өзүнчө башка-башка шарттарда өнүгө баштайт: түштүк кыргыздар мурунку эле коңшулар – өзбек, уйгур, тажик элдери менен алакада болсо, түндүк кыргыздар көбүнчө казактар менен тыгыз саясий мамиледе болот. Азыркы түштүк диалектилерде өтэ активдүү колдонулган, бирок түндүк диалектилерде учурабаган иран-араб лексикасы бүт дээрлик жаңы кыргыз тилинин экинчи мезгилинде уйгур, өзбек, тажик тилдеринен түштүк кыргыз диалектилерине кирген. Кабыл алынган сөздөр менен кошо түштүк кыргыз диалектилери ошол тилдерден айрым тыбыштарды жана айрым грамматикалык элементтерди да аз-аздап өздөштүргөн. ХІХ кылымдын экинчи жарымында кыргыз элинин Россияга ыктыярдуу кошулушуна байланыштуу кыргыз диалектилерине, көбүнчө түндүк говорлорго орус сөздөрү кире баштады. Ошентип, революцияга чейин түштүк жана түндүк диалектилердин ортосунда лексикалык жана грамматикалык айырмалар улам күчөй берген."},{"t":"p","h":"Диалектилик өзгөчөлүктөр жазма эстеликтерде да байкалат, анткени ал убактагы, мисалы, ХІХ кылымда жазма адабият, негизинен, диалектилик тилде өнүккөн. ХІХ кылымдын биринчи жарымында жаза баштаган Молдо Нияздын санат ырларынын тили, анын лексикалык, фонетикалык жана морфологиялык өзгөчөлүктөрү ичкилик диалектисинин ушул күнгө чейин сакталып келген өзгөчөлүктөрүн толук чагылдырат деп айтууга болот."},{"t":"p","h":"в) Жаңы кыргыз тилинин үчүнчү советтик мезгили бардык башка доорлордон принципиалдуу түрдө айырмаланат. (Юнусалиев Б. М. Тандалган эмгектер.)"}],"sub":[{"title":"РЕФЕРАТ","b":4},{"title":"КОНСПЕКТ","b":23},{"title":"ЦИТАТА","b":29}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[20,30]},{"title":"&amp; 6. ПУБЛИЦИСТИКАЛЫК СТИЛДЕГИ ПРАКТИКАЛЫК ИШТЕР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"31\">31<\/span>&amp; 6. ПУБЛИЦИСТИКАЛЫК СТИЛДЕГИ ПРАКТИКАЛЫК ИШТЕР"},{"t":"p","h":"Публицистикалык стиль же коомдук публицистикалык стиль деп аталган жанр коом менен адам баласын, адам менен мамлекеттик кызыкчылыкты, же анын тескерисинче, мамлекеттик кызыкчылык менен адамдардын кызыкчылыгын байланыштыруу үчүн кызмат кылат. Ал массалык маалымат каражаттарында кызмат аткарат. Күндөлүк турмуштагы маанилүү мамлекеттик маселелерди радио, телевидение, газета-журналдар аркылуу алып чыгып, кайрадан элдин ал маселеге карата болгон мамилелерин чагылдырат."},{"t":"p","h":"Силер күнүгө телевидениеден көрүп, радиодон угуп жүргөндөй, маанилүү деген иштер боюнча элдин пикири топтолот. Керегине жараша журналист ой натыйжаларын топтойт. Элдин пикирин топтоочу негизги каражаттарга интервью жана репортаж кирет. Булар бири бирине окшош, бирок интервьюда көпчүлүк учурда суроого жооп берип жаткан адамдын чындыкка болгон көз карашы басымдуулук кылса, репортажда жыйналган материалдар боюнча журналисттин жөндөмүнө жараша жыйналган ой, жыйынтык басымдуулук кылат."},{"t":"p","h":"Жол баяндамасы, илим менен байланышкан, бирок элге тааныштыруу максатында жөнөкөйлөтүп, билим, таанып-билүүчүлүк максатта жазылган илимий-публицистикалык материалдар, тарбия-таалимге, адептүүлүккө үндөгөн макалалар да публицистикалык стилде болот. Ошондуктан публика – эл деген маанисине шайкеш келүү аркылуу элди үндөөгө, тарбиялоого арналган иштер жөнөкөйлөтүп жазылуу менен маанилүү негизге, илимий маалыматка таянат."},{"t":"p","h":"21. Текстти окуп чыгып, анын илимий жана публицистикалык негизин түзүп турган мүнөзүн белгилегиле. Текст аралык, стиль аралык байланышын аныктагыла."},{"t":"p","h":"Кыргыз эли жөнүндөгү маалыматтар биздин „доорго чейинки мезгилдерде эле тарыхта белгилүү болгон. Ошол байыркы мезгилдерде уйгурлар хаягас деген атты жаңылыш түрдө хакньсы деп бурмалап, өз тилиндеги «кызыл жүздүү» эл деген мааниде айтышкан деген маалымат <span class=\"pg\" data-n=\"32\">32<\/span>бар. Ушул пикирди окумуштуу Шлегель толук кубаттайт. Ал да кыргыз деген сөздү кырыг жүз – кызыл жиз деген маанидеги сез деп табат. Окумуштуунун ою боюнча, кызыл деген маанидеги кырыг сөзүнө жуз деген сөз биригип кетишинен кыргыз деген сөз келип чыгат."},{"t":"p","h":"ХІ кылымда жазылган «Кутадгу билик» («Кут алчу билим») дастанында кыргу энин деген тизмекте кыргу сөзү кызыл деген маанини туюндурат. Мына ушундай далилге таянып, байыркы уйгурлардын жана Шлегелдин пикирин бир аз толукташып, К. И. Петров, Н. А. Баскаков кырыг // кыргу сөзү кызыл деген маанидеги сөз экенин, ал эми -ыз болсо көптүк маанидеги мүчө экенин аныктап, жалпысынан кыргыз деген сөз кызылдар деген маанидеги сөз деп далилдеди..."},{"t":"p","h":"Бирок кыргыз деген сөз байыркы орхон-енисей жазма эстеликтеринде жана Махмуд Кашгаринин сөздүгүндө кыргыз түрүндө эле жолугат. Демек, кыргыз дегени эң баштапкы формасы экени бышык, сөздүн ортосундагы к тыбышы г тыбышына өзгөрүп кеткен. Азыркы тилибизде жалкы жана эки деген сөздөр бар. Бирок ушул сөздөргө -ыз мүчөсү жалганганда жалкы, экиз болбостон, жалгыз, эгиз болуп, к жумшарып кетет. Ошентип, -ыз мүчөсү көптүк санды жасоочу, б. а., сан атоочтон сын атооч жасоочу мүчө болуп, кырктар деген маанидеги сөз келип чыгат. Элибиздеги кырк чоро, кырк кыз түшүнүктөрү ушундан калган болуу керек (К. С.)"},{"t":"h3","h":"РЕПОРТАЖ"},{"t":"p","h":"Р еп ор т а ж – публицистикалык жанрда жара- ‚ луучу, журналисттин жеке чыгармачылыгы менен байланышкан чыгармачылык процесс, коомдук маанилүү маселелерди, жагдайларды иш кайнап турган жеринен, окуя болуп жаткан убакыттан айырбастан берет. Интервью болсо эки же үч адамдын маектешүүсү менен тексттин темасын ачып берүү аракетинде болот, ал эми репортаж коомдук маселелердин болуп жаткан жагдайын дал ошол учур менен байланыштырат, маселени чечип берүүдө журналисттин жеке көз карашы бирин-) чи орунга чыга келет."},{"t":"p","h":"Репортаж окуяны чагылдыруучу ыкма болуп саналат. <span class=\"pg\" data-n=\"33\">33<\/span>Аны жаратууда журналист иш жүрүп жаткан жерден баяндайт. Анда жаратылыш, аба ырайы, окуяга карата элдин маанайы жана башка каражаттар чагылдырылат. Биз радиодон, телевидениеден мындай репортажды күнүгө эле кезиктирип келе жатабыз, МИсалы, спорттук берүүлөрдөгү, талаа жумушун берүүдөгү, майрамдык атайын көрсөтүүдөгү, уктуруулардагы ж. б. публицистикалык чыгармалар репортаждык жанрга кирет."},{"t":"p","h":"М и с а л ы, «Мээрим» эл аралык кайрымдуулук фондунун «Алтын балалык» аттуу ыр-бий конкурсунун өткөрүлүшү жөнүндө Ысык-Көлдүн жээгиндеги телерепортажга көңүл бурсак, анда телеоператордун жардамы менен бардыгы көрүнүп турат. Айтуучу журналист баяндоо ыкмасы менен ар бир катышуучунун маанайын, кийген кийиминин түсүн, кайсы мамлекеттен келгенин ж. б. айтып, конкурстун жүрүшүн көрсөтөт. Ал ами газетадагы же радиодогу репортаж телерепортаждан айырмаланат. Анткени окурман да, угарман да өзү көрүп тургандай маалымат берүү максатында бардыгын айтып жана жазып берүү керек. Байкап көргүлө:"},{"t":"p","h":"Кымбаттуу радио угуучулар, сиздердин кенулунуздорду көгүлтүр көлдүн жээгиндеги «Алтын балалык» аттуу эл аралык конкурстун жүрүшүнө бурабыз. Бул конкурс «Мээрим» эл аралык кайрымдуулук фонду тарабынан бир канча жылдан бери таланттууларды тандоо максатында, аларды эл арасына тааныштыруу учун уюштурулуп келе жаткандыгын билебиз. Эмесе, бул жолку конкурстун жүрүшү Ысык-Көлдүн жээгинде эткеруле тургандыгын сиздерге айта кетуу менен андан мезгилдүү репортажга көңүлүңүздөрдү бурабыз."},{"t":"p","h":"Эртең менен кызгылтым кундун нуру айлананы тегиз каптап, көлдүн түсүнө чагылыша асман менен көл бирдей түскө боёлгондой көрүндү. Көл жээктей учуп-конуп үн алышкан ак чардактар балык терип жеш учун көлгө коно калып, кайра учуп, айтор, когултур жээкти өзгөчө кооздукка бөлөйт. Конкурска келген таланттуу балдар жана кыздар өзүнчө бир маанай менен болуучу конкурста аткара турган ыр болобу, бий болобу кайра-кайра кайталап, өзүнчө сынч <span class=\"pg\" data-n=\"34\">34<\/span>=н дап, толкунданууда. Кун ысык болчудай. Ошондуктан конкурс өтүүчү ачык асман астындагы театрды конкурсту уюштуруучулар кечки маалга ылайыктап,"},{"t":"raw","h":"<div class=\"gloss\"><p>ыы ай. ай йы ай а ай а ай йб йй и айай дай ай ай ай айй ай йай йай ай йй ай ы. ай ай ай аы йы айы йы айы йы айы ыйы. ай а йы айй<\/p><\/div>"},{"t":"p","h":"иретке келтиришуу менен алек."},{"t":"p","h":"Конкурсанттар тушуп келуучу тепкичтерге төшөлгөн килем-жолчолор, андан ылдый сахна деп ылайыкташтырылган аянтта бирдей туствгу килемдер, аны тегерете коюлган отургучтар өзүнчө эле ажайып кооздукту берет. Нарыда атырылган фонтандан суунун салкын илеби келет."},{"t":"p","h":"Кун эңкейип, айланага жайкы серуундцк келе баштады. Мына, азыр бир аздан соң орундуктарга толгон элдин кол чабуусу менен конкурсанттар ирети ‚ менен келе башташты. Эмесе, туз афирди конкурстун) журушине бурабыз. (Мындан ары окуянын өзү берилет.)"},{"t":"p","h":"22 Төмөндөгү репортажды окуп чыгып, ойдун бүтүндүгүн бузуп турган бөлүктөрдү (... коюлган жерлерди) толуктагыла. Репортаж эгемендүүлүк күнүн белгилөөгө арналган салтанатты чагылдыра тургандыгына ой кошуп, түшүнүгүңөрдү бекемдегиле."},{"t":"p","h":"Жайдын акыркы аптабынын илеби сынып калганы байкалат. Бирок ошондой болсо да, айлананы ысык дем басып турат. Өкмөттүк аянтта шаңдын элесин берген ар кандай жазуулары бар чакырыктар, илинген байрактар... ордо калааны көркүнө чыгарып тургансыйт."},{"t":"p","h":"Көчөдөгү элдин маанайы... жаш балдардын... өзүнчө бир салтанаттан кабар берет. Мамлекеттик желектин алдында турган аскер кийимчен жигиттер бир караганда эгиздердей көрүнөт. Алардын кыймылсыз катып калган көз ирмемдей элеси бизге... ой калтырат."},{"t":"p","h":"Аянттагы адамдардын айрымдары кайдадыр алдастап шашып, майрамдын уюшулушуна жоопкерчиликтүүлүк менен улам бир нерсеге алаксышат. Кээ бирлери жөн гана ар бир кыймылды, көрүнүштү сыдыргыга салгандай.... көпчүлүгү жай гана өз иштери менен, же тек гана майрамдык салтанаттын акыркы даярдыгына маашырлана..."},{"t":"p","h":"Мына, майрамдык салтанаттын башталышына саналуу мүнөттөр калды. Сиздердин көңүлүңүздөрдү майрамдык демонстрация болуучу аянтка бурабыз."},{"t":"p","h":"(Мындан ары ойду өзүңөр улап жазгыла. Телерепортаж тизсенер да болот.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"35\">35<\/span>23. Мектеп турмушуна байланыштуу репортаж түзүп көргүлө. Класста репортаж конкурсун уюштуруп, мыктысын дубал газетанарга жарыялагыла."},{"t":"p","h":"24. 'Телевизордон көргөн спорттук берүүнү байкап, ал женунде өзүңөр репортаж түзүп көргүлө. Интервью менен болгон айырмасын аныктагыла."},{"t":"h3","h":"ИНТЕРВЬЮ"},{"t":"p","h":"Интервью – публицистикалык стилге жатуучу ыкма. Ал журналист менен маалымат берүүчү адамдын ортосунда ишке ашат. Белгилүү бир маселени эл алдына алып чыгууда журналист тешелүү адамдын ой-пикирин, турмуштук чындыкка болгон көз карашын чагылдырат. Тактап айтканда, интервью пикирлешүүчү адамдын ою дегендикти билдирет. Силер телевизордон, радиодон, газеталардан белгилүү адамдар, коомдук абал, жалпы жагдай, экономикалык маселелер жөнүндө көп эле пикирлерди кезиктиресиңер. Бул сыяктуу ыкма журналисттин жана пикирлешүүчүнүн бир темага болгон жалпылаштырылган көз карашын билдирет."},{"t":"p","h":"М исал ы: Ч. Айтматовдун «Тутумдашуу түйүнү» (адабиятчы В. Левченко менен болгон маек) деген интервьюсунун кыскартылган мазмунуна көңүл буралы: Анан силер калган бөлүктөрүн, б. а., интервьюну толук окуп, маанисин айтып бергиле. Бул интервьюну «Биз дүйнөнү жаңыртабыз, дүйнө бизди жаңыртат» аттуу жыйнактан табасыңар."},{"t":"p","h":"В. Л. – Улуу Ата Мекендик согуштун бүткөнүнө кыйла жылдар етсе да азыркы жазуучулардын китептеринде ошол согуштун катаал салгылаштарынын жаңырыгы дале дүңгүрөп, канонадалардын үндөрү дале басаңдабай келе жатат. Сиздин «Эрте жаздагы турналар» аттуу соңку повестиниз да ушул темага арналыптыр. Айтыңызчы, бул темага кайрадан кайрылышыңызга эмне себеп болду? Мында, мүмкүн, бүгунки күндүн маселелеринин да таасири бардыр?"},{"t":"p","h":"Ч. А. – Эгер сиз айткан менин чакан повестимди ушундай көз караштан карай турган болсок, анда аны адам жана согуш деген темайагы чыгармалар менен бир катарга коюуга болот. Бул теманы: адам <span class=\"pg\" data-n=\"36\">36<\/span>согушта, тылда, душман тылында, партизандык отрядда деген сыяктуу ар турдуч аспектилерде кароого боло тургандыгы тушунуктцу. Кийинки мезгилдерйе айрыкча чалгынчыны душман чөйрөсүндө көрсөтүү модага айланды."},{"t":"p","h":"Өз повестимде мен адамды согуш менен тузден-туз кагылышууда эмес (бул жагдай менсиз да кеп жазылган), «Саманчы жолундагыдай» жандатылган, кыйыр кагылышууда көрсөтцүнү максат кылгам. Кандайдыр алыс жакта башталганына карабастан согуш Толгонайдын тагдырына эгин талаасында аралашып отурат."},{"t":"p","h":"«Жамийлада» да ушундай. Суйуу жөнүндөгү повесть болгонуна карабастан, согуштун каңшаары абдан курч. «Согушка женеп бараткан элдин артында кайгылуу издер калып жатты» деген сүйлөм эле көп нерсени айтып тират."},{"t":"p","h":"Анык согуш «Бетме-бет» повестинде да жүрөт. Сөз эмне жөнүндө болорун билбесек да, сумдей түптүз теректер жалбырактарын кубугендугун билдирген алгачкы фразаларды окуганда эле өзүбүздү кандайдыр коогалуу жагдайда даярдай баштайбыз."},{"t":"p","h":"Өз чыгармам туурасында айтайын. Менде адамдын, жаш өспүрүмдүн согуш менен кандайча кагылышкандыгын айтуу талабы болгон. Ал коомдун бир бөлүкчөсү, демек, согуштун капшабы анын үлүшүнө да таандык, анын тагдырына да сөзсүз аралашат. Бул, биринчиден. Экинчиден, менин алдымда согуш канчалык кыйраткыч, булдургич болбосун, ал адамды адамдык касиетинен тандыра албай тургандыгын көрсөтүү милдети болгон. Согуш турмуштун көндүм ыргагын бузат, багытын, турун, адамдардын өз ара мамилелерин өзгөртөт, материалдык пландагы жоготууларды, ачкачылыкты, журек каарыган ызгаарды алып келет. Адамдарды катаал, ырайымсыз, жанкечти кылып, ӨЗ жаны учун күрөшүүгө мажбур кылышы да мүмкүн. Эгер ушундай кырдаал пайда болсо, анда катаалдык тере турге өтөт. Бирок так мына ушул учурда согуштун табиятына карама-каршы, анын кыйраткыч кучу менен эрегишке чыккандай адам руханы бур ачат, ал жамандыктын изин кайтаруу. алсыздантуу учун өзүнүн коргонуу күчтөрүн ишке кийирет."},{"t":"raw","h":"<div class=\"gloss\"><p> тЫ (|<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"37\">37<\/span>@зимдун Султанмуратымды башкача түрдө, мисалы, ал кандайча адилеттикти орноткондугун, ат уурдоочулардын жазасын кандайча бергендигин же өзү алар тарабынан кандайча жырткычтык менен жазалангандыгын, кордолгондугун асемдуц, жаркырак боёктор менен керсете алар элем. Бирок менде башка максат – адамды нормалдуу, чыныгы табигый тур: патында көрсөтө турган сапаттарды ачуу максаты болган. Ак менен каранын, жакшылык менен жамандыктын күрөшүн көрсөтүү – бул, албетте, женил иш эмес."},{"t":"p","h":"В. Л. – Чыңгыз Төрөкулович, «Эрте жаздагы турналар» согушка арналган деп биз шарттуу турде айтып жатабыз, чындыгында бул чыгармада согуш жылдарындагы, сиздин өспүрүм кездеги көңүлдө калган таасирлер чагылтылган деп айтуу туура болор эле. Чыгармачылык учун балалык жана өспүрүм кездин таасирлери өзгөчө маанилиц эмеспи, ушуга байланыштуу сиз азыр дүйнөнүн жарымына жакынын кыйдырып көргөндөн кийин да жандуиненуз боюнча туулуп өскөн Шекер айылында калып, бир кездерде так мына ушул жерде баштан кечирген таасирлер женүндө жаза берууцгө сизди мажбурлап жаткан жокпу деп сурагым келет."},{"t":"p","h":"Ч. А. – Балалык жана өспүрүм кездин таасирлери жазуучунун чыгармачылык турмушу үчүн чынында да маанилуц фактор. Бул – ойлорду, картиналарды адамдардын образдарын сен ар дайым сузуп алып турган ыйык башат же күйүк сыяктуу. Жаштык жана балалык кез дүйнөнүн сулуулугун таза кабылдоочу, аны ошол калыбында көңүлгө бекем түйүп калуучу эн дилгир күнөөсүз жана кристаллдай тунук курак."},{"t":"p","h":"Бул жагдайда турк акыны Фазыл Хуүенү Даглараждын «Ачык цй» деген, менимче, эн сонун ыры бар. Анын:"},{"t":"v","l":["Балалык – уй сыяктуу","ар дайым эшиги ачык,","батат ага топурашып","тайлактар да, кулундар да,","мышыктар да, булуттар да,","кымгуут түшкөн баш-аяксыз","калаалар да батат ага,—","деген саптары эсимде."]},{"t":"p","h":"<span class=\"pg\" data-n=\"38\">38<\/span>В. Л. – Мен да бул ырды билем, анын автору менен да жакшы таанышмын. Аны эске салганыңыз абдан жагымдуу. Балалыктын дүйнөсүнө бүтүндөй шаарлар кирери ырас. Бирок шаардагы балалык табият менен коюн-колтук өтпөйт, табият кереметин, анын чырайын сезууге, жайбаракат санаркоолорго батууга убактысы болбойт. Чындыгында балалык кезде адам өзү менен өзү көбүрөөк болгону жакшы."},{"t":"p","h":"Мен «Эрте жаздагы турналарды», «Ак кемени» жана «Жамийланы» окуп жатканда да коптеген таасирлуц, турмуштук деталдарга кез келип: буларды ойдон чыгарып жазуу мумкун эмес, жазуучу ушунун баарын өзүнүн «ыйык булагынан» алып жаткан болуу керек деген ойго көп токтолдум."},{"t":"p","h":"Ч. А. – Мен отуруп алып өзүмдү Күркүрөө суусунан сузуп бараткандай сезген «Ээр таш» азыр да турат. Албетте, турмуштук реалдуу, конумуи эле көрүнүштөрдү сезим кыйла чоңойтуп, экилентип элестетээри бышык, бирок мен аларды кийин жаңырган, өзгөргөн тцрүнйө пайдаландым. Мындан башка дагы далай деталдар да ошол балалыктын дүйнөсүнөн алынып жатышы ыктымал."},{"t":"p","h":"Балалык кездин таасирлери жазуучиу учун канчалык маанилиц экендиги туурасында көп эле жазылды, биз муну айтуу менен жаңылык ача албайбыз. Мен бала кезимден көрсөм деп эңсеген ажайып жерлерде, алыскы өлкөлөрдө – Африкада, Индияда болуп, кеп нерселерди көрүүгө жана байкоого аракеттендим. Азыркы кунде алар жөнүндө айтуу ыкласы болгондо көргендерумду толук элестетуугв, эстегилерди жандандырууга чымырканып киришем. Эгер ушул жетилген курагымда көргөн дүйнө мени балалык кезден бери курчаган болсо, азыр өз жеримдей ысык, жакын сезилиши, башкача айтканда, Ата Жирт сыяктанып калышы толук мумкун эле."},{"t":"p","h":"25. Жаны окуу жылынын башталыш салтанатына арналган репортаж уюштургула. Өзүңөр уюштурган репортаждагы сүрөттөө жана баяндоо ыкмаларын бөлүп көрсөтүүгө аракеттенгиле."},{"t":"p","h":"26. «Эгерде сиз Билим берүү министри болсоңуз...» деген темада интервью уюштургула. Маекке айрым мугалимдерди, окуу бөлүмүнүн башчысын, же тентуштарынарды чакыргыла."},{"t":"raw","h":"<div class=\"gloss\"><p> 1 Г. 1 |) <\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"39\">39<\/span>27. Телевизордогу маектешүүнү карап, анын башталышын, жүрүшүн, журналисттин жыйынтыгын байкоо менен аны репортажга айландырып көргүлө."},{"t":"p","h":"28. Төмөнкү тексттин жанрдык, Стилдик өзгөчөлүгүнө көңүл бургула. Стилдин кайсы түрүнө кире тургандыгын аныктап, илимий жана көркөм негизин, тилдик каражаттарын айтып бергиле. Энциклопедиядан, газета-журналдардан Памир кыргыздары жөнүндө маалымат топтогула, ал жөнүндө бозеки аңгеме-дүкөн уюштургула."},{"t":"p","h":"Илгери-илгери бир жылдарда, болжолдуу, 200 – 300 жыл чамасы мурун, элди жалпы улуу тумоо оорулары каптап, мында бир кырылган. Ал оору кийин дагы бир каптап, алда канча адамдардын өмүрүн алып кеткен. Чамасы 100 жыл илгери жут болду, мында көрбөгөндү көрүшкөн (бул женунде саякатчылардын жазган китептеринде айтылган). Кыйла кагылыштар, чабышуулар, топ-тобу менен тентип кетуулер болгон."},{"t":"p","h":"Жыргал кийин келди. Ошондо да кээ бир каатчылык баштан өттү. 1941 – 1945-жылдарда курсак бөксөрдү. Эл не бир түркүн чөптөрдү тамак катары пайдаланышты. Өзгөчө мадил, замоорук, чайыр, рогын, чүкүрү ж. б. өсүмдүктөр кадимкидей тамакка жараган. Эчен бир адамдар ак шишик болуп айыгышкан. Бирок элдин кайраты, үмүтү, күрөшү ал кыйынчылыктарды жеңип чыккан."},{"t":"p","h":"1949-жылдары дагы бир сыноо болду. Жергетал районунун Хаит деген жеринде «отуз эки чайкана элди» бир жутту. Ал мындай болуптур: жайында бир күнү таңга маал жер бир аз солкулдайт. Эл эч капары жок, күндөлүк оокатына киришет. Бири мал кайтарып, бири чөпкө чыгат, бири эгин орот, бири жер-жемиш үзөт, бири үйдө, бири жолдо болот, айтор, күндөгү өмүр, күндөгү турмуш кызыйт. Ал аңгыча, күн улуу шашке ченде эки тоо катыша түшүп, чаң уюлгуйт да калат. Эми эле кызып жаткан өмүрдү жер соруп, дүйнө алай-дүлөй түшөт. Түз жер тоо болуп, суу бөгөлүп, жер жарыгына тирүү адамдар, ал гана эмес ат-маты менен, топ-тобу менен кирип кеткендер болот. Заңгыраган үйлөр, бак-дарактар, мал-сал, короо-жай көмүлөт. Ошондо бир кыз чоң дарактын ачасына илинип, жана бир чал кандайдыр бир тоо башында жүрүп, кулабай калган зоока таштын түбүндө аман калат."},{"t":"p","h":"<span class=\"pg\" data-n=\"40\">40<\/span>Бул алааматтын изин кийин мен 1951 – 53-жылдарда, анан 1969-жылдары да көрдүм. 1951 – 54-жылдарда жер күнүнө 3 – 4 жолудай чайкалып өтөр эле. Ал кезде аттын туягы кирип кеткидей жер жаракалары көп болучу. Чополуу тоолордун беттери суудай агып жылып кетчү... Азыр так Хаиттин оозунда, 5 – 6 метр бийиктикте ак мрамордон кайгы тарткан, бирок кайраты бар, келечекке үмүт менен караган эненин эстелиги орнотулган. Болжол менен он беш миңге жакын адамдын өмүрүнө арналган бул эненин эстелиги, бир жагынан апаат болгон адамдарды түбөлүккө эскерүү болсо, экинчи жагынан тирүү адамдарга ыраазы болууну эске салат. Эне – өмүрдүн символу, эне бар, демек, өмүр улана бермекчи."}],"sub":[{"title":"РЕПОРТАЖ","b":8},{"title":"ИНТЕРВЬЮ","b":27}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[31,40]},{"title":"§ 7. КЕПТИН ОЙ ЖҮГҮРТҮҮ ТҮРҮНДӨ ДИЛБАЯН ЖАЗУУГА ҮЙРӨНҮҮ ЖАНА МАШЫГУУ»","blocks":[{"t":"h3","h":"§ 7. КЕПТИН ОЙ ЖҮГҮРТҮҮ ТҮРҮНДӨ ДИЛБАЯН ЖАЗУУГА ҮЙРӨНҮҮ ЖАНА МАШЫГУУ»"},{"t":"p","h":"Силер ушул учурга чейин дилбаяндын ар кандай түрлөрүн билесиңер. Булардын ичинен ой жүгүртүү дилбаяны таяныч болуучу кайсы бир окуяга, көрүнүшкө, кубулушка, фактыга ж. б. негизделип жаралат."},{"t":"p","h":"Дилбаян – силердин алгачкы чакан чыгармаңар, чече че че ш че чт ч ы че ш т ш е и =т= че ы ошондуктан чыгарма жазуудан мурда жеткиликтүү гүн пайдаланууну унутпашыңар зарыл. Алды менен эмне жөнүндө жазуунун планын ойлонуштуруп, тактап алсаңар, оюңар ырааттуу баяндалат, мазмун менен бай- ланышын үзбөйт. быңар, сунушуңар, айтуучу оюңар факты аркылуу ча- тылдырылышы абзел. нимдердин, фразеологизмдердин, антонимдердин сөздү- Белгилүү темага карата өзүңөрдүн мүдөө-талафактылар, чыгармачылык эргүүлөр болуу керек. Чыгарма супсак, кайталама сөздөрдөн турбасы үчүн, сино-"},{"t":"p","h":"29. Факт топтоо менен «Карылар үйү керекпи?» деген темада дилбаян жазгыла. Таяныч материалдарды пайдалангыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"41\">41<\/span>30. «Менин замандашымдын коомдогу орду» деген темада (бул шарттуу аталыш, теманын атын өзүңөр тандап койсоңор да болот) мектептин дубал газетасына макала жазгыла. Көркөм публицистикалык стилде аткарылган макалаңардын ажарын ачкан сөз каражаттарын белгилегиле."},{"t":"p","h":"31. «Ата Журтту коргоо – ар бирибиздин ыйык милдетибиз», «Кыргызстан – эгемендүү мамлекет» деген темаларга дилбаян же публицистикалык макала жазгыла."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[41,41]},{"title":"ФОНЕТИКА, ОРФОГРАФИЯ,","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"42\">42<\/span>ФОНЕТИКА, ОРФОГРАФИЯ,"},{"t":"h3","h":"ОРФОЭПИЯ ЖАНА КЕП МАДАНИЯТЫ"},{"t":"h3","h":"ФОНЕМА ЖӨНҮНДӨ ТҮШҮНҮК"},{"t":"p","h":"Фф о н е м а – тилдин бөлүктөргө ажырабай турган, сөздөрдү, морфемаларды, сүйлөмдөрдү түзүүгө катышып, аларды бири-биринен айырмалоого жардам берүүчү эң жөнөкөй элементи – тыбыштары. Кыргыз тилиндеги тыбыштардын баары фонемалык касиетке ээ. Тилдеги тыбыштардын баары эле фонема боло бербейт. Бирок ар бир фонема өз алдынча тыбыш. Ошондуктан фонемага караганда тилде тыбыштар сан жагынан көп. Фонема морфеманы, сөздү грамматикалык формаларды маани жактан айырмалоочу касиетке ээ. Ал эми тыбышта мындай касиет жок. Фонема менен тыбышты так айырмалай билүү өтө маанилүү."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[42,42]},{"title":"$ В. ҮНСҮЗ ТЫБЫШТАРДЫН ЖАСАЛУУ ОРДУНА КАРАЙ БӨЛҮНҮШҮ","blocks":[{"t":"h3","h":"$ В. ҮНСҮЗ ТЫБЫШТАРДЫН ЖАСАЛУУ ОРДУНА КАРАЙ БӨЛҮНҮШҮ"},{"t":"p","h":"Кыргыз тилиндеги үнсүз тыбыштардын жасалуу орду анын айтылышында өпкөдөн келе жаткан абанын кайсы жерде тоскоолдукка учурап, ага активдүү кептик аппараттардын, атап айтканда, тил менен эриндин жана тиштин катышы канчалык даражада болгондугуна байланыштуу аныкталат."},{"t":"p","h":"Мына ошолорго байланыштуу унсуз тыбыштар жасалуу ордуна карай төмөндөгүдөй болуп бөлүнөт."},{"t":"p","h":"1. Уччулдар. Уччул үнсүздөр тилдин учу тиштерге же таңдайдын алдыңкы бөлүгүнө тийип же жакындаган абалда жасалат. Аларга төмөнкү үнсүздөр кирет: д, т, н, з, С, л, р, ж, ш, ц, щ,"},{"t":"p","h":"2. Орточулдар; Тилдин орто бөлүгү жогору көтөрүлүп, катуу таңдайга тийишүүдөн же таңдайга"},{"t":"p","h":" з <span class=\"pg\" data-n=\"43\">43<\/span>карай көтөрүлгөн абалында жасалган үнсүз тыбыштар орточулдар деп аталат. Аларга ч, ж (жоон үндүүлөр менен катар келген ж) тыбыштары кирет."},{"t":"raw","h":"<div class=\"gloss\"><p>ч Ыр че че че е че е р ш р ү чү че ч ше че че чт тү<\/p><\/div>"},{"t":"p","h":"3. Түпчүлдөр. Түпчүл үнсүздөр тилдин арткы белугу (туп жагы) жумшак таңдайга тийишүүдөн жасалат. Буга жоон үндүүлөр менен катар келүүчү к (к), г (т) тыбыштары кирет. Мисалы: кыз, кара, кыш, кой, куш, коон, каар, куу ж. у. с."},{"t":"p","h":"4. Кош эринчилдер. Астыңкы эриндин үстүнкү эринге тийишүүсү аркылуу пайда болгон үнсүздөр кош эринчилдер деп аталат. Аларга б, п, м тыбыштары кирет."},{"t":"p","h":"Б. Эрин-тишчилдер. Үстүнкү тишке астыңкы эриндин тийишүүсүнөн пайда болгон үнсүз тыбыштар эрин-тишчилдер деп аталат. Ага в, ф тыбыштары кирет."},{"t":"p","h":"Эскертуу: Эрин-тишчил үнсүздөр кобунче чет тилдерден кирген сездерде учурайт. Мунун өзү бул тыбыштардын кыргыз тилинде кийинчерээк өздөштүрүлгөндүгүнөн кабар берет."},{"t":"p","h":"М и сал ы: ферма, кефир, Зульфия, фонарь, вагон, эвфемизм, Бавария, вольфрам."},{"t":"p","h":"Ошондой эле фамилияларды туюндуруу үчүн орус тилинин таасиринде пайда болгон -ов, -ова мүчөлөрү кошулат: Эшматов, Ташматова ж. у. С."},{"t":"p","h":"32. Теменку текстти окуп чыгып, андагы сөздөрдөгү үнсүз тыбыштарды жасалуу орду боюнча ажыратып көрсөткүлө."},{"t":"p","h":"Үлгү:"},{"t":"p","h":"Замандан деген сөздө з, м, н, д деген үнсүз тыбыштар бар. Жасалуу орду боюнча з – уччул, м – кош эринчил, н – уччул, д – уччул. (Андай болиштиурицунун себебин жогорку эрежелерге негиздеп айтып берүү керек.)"},{"t":"p","h":"Атам замандан бери эле кыргыз элинде өкүм сүрүп келаткан ат менен байланыштуу болгон: ат чабыш, жорго салдырыш, улак тартыш, эр эңиш ж. б. салтанаттуу улуттук оюндарынан башка да көптөгөн оюндун түрлөрү бар."},{"t":"p","h":"Калкыбыздын көңүлүн өзүнө бурган кызыктуу оюндардын бири – күрөш болуп эсептелет. Ал элдик спорттук оюнда ат менен байланыштуу: айырмачылыгы беттешкен <span class=\"pg\" data-n=\"44\">44<\/span>эки балбан жөө күрөшкөн. Кыргыз элинин шаан-шеекеттүү, спорттук мелдеш оюндары жөө күрөшсүз өтпөй турганын белгилеп кетүүгө туура келет. Ошондуктан, атам замандан бери келаткан кыргыз элинин жаштарды ар тараптан чыдамдуулукка тарбиялоо маселесине бөтөнчө маани берип келгендиги бекеринен эмес. Күчтүү, эр жүрөк жигиттер (жоокерлер) кармаштарда жана жортуулдарда каармандыкты, туруктуулукту көрсөтүү менен айырмаланышкан. Мындай эр азаматтар элин душмандардан сактап, «эр жигиттер эл четинде, жоо бетинде» турушкан."},{"t":"p","h":"33. Берилген текстти окуп чыгып, андагы создерден өзүңөр ондон сөз тандап, беш топко бөлгүлө. Ар бир топко ажыраткан сөзүңөрдү уччулдар, орточулдар, тупчулдер, кош эринчилдер, эрин-тишчилдер деп белгилеп, ошол топтогу сөздөрдүн жалаң гана аталган тематикага тиешелүү тыбыштардын астын сызып чыккыла."},{"t":"p","h":"Мисалы:"},{"t":"p","h":"Кош эринчилдер: Балам, көп окуп, билимиңди, болбогун, кийим, жооп, ойлонуп д. у. с."},{"t":"p","h":"Уччулдар: Балам, сабакты, билим, бол, азыр, дайыма, далилсиз, иш ж. у. с."},{"t":"p","h":"Балам, улук болсоң, чынчыл бол. Сабакты көп окуп, билимиңди өркүндөтүп, көп нерсени жатка билгидей бол. Эки жүздүү болбогун, денеңди, кийимиңди таза тут. Ар бир маселеге ойлонуп жооп бергин. Бекерден бекер бирөөнү туурап иш кылбагын. Ишенимдүү адамдардын каты болмоюнча, ар кимдин айттырып жибергенине ишене бербе. Адамдардын далилсиз сөздөрүн укпа. Китеп менен дептерге аздектеп мамиле жаса. Туура сөздү угууну кааласаң, адамдардын сөздөрүнө байкоо жүргүз."},{"t":"p","h":"Балам, адам болсоң тил безеген чечен бол, көп нерсени жатка бил. Адамдар менен сөз талашпастан, сүйлөр учурду күт. Сөз кезеги келгенде чечен, чебер тил менен сүйлөгүн. Эл алдына чыкканыңда кийим-кечең, үстүбашың таза болсун. Жыйында, топ алдында кабагыңы салып үтүрөйбөстөн жайдары маанайда, маңыздуу кеп кур. Сүйлөө учурунда элге карап, кыймылда болуп тур. Эл алдында туруу адебин сактап, кекирейме текеберчиликтен оолак бол."},{"t":"p","h":"<span class=\"pg\" data-n=\"45\">45<\/span>Эгерде көп окуп, билимиң артып, даанышмандык даражага жетсең, бийликке көтөрүлсөң токтоо, чыдамкай болгун. Алысты акылы менен көрө билген адам тагдырына кайдыгер карабагын. Адилет, калыс адамдар менен акылдашып иш кыл. Алган билимиң, жеткен акылыц, колуңдагы бийлигиң ак ниет, момун адамдар үчүн кызмат кылбаса тез эле ооматың кетет. Ошон үчүн, сыйлуу болом десең элди сыйла, кадырлуу болгуң келсе калкты кадырла. («Кабус наама».)"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[43,45]},{"title":"§ 9. ҮНСҮЗ ТЫБЫШТАРДЫН ЖАСАЛУУ ЫГЫНА КАРАЙ БӨЛҮНҮШҮ","blocks":[{"t":"h3","h":"§ 9. ҮНСҮЗ ТЫБЫШТАРДЫН ЖАСАЛУУ ЫГЫНА КАРАЙ БӨЛҮНҮШҮ"},{"t":"p","h":"Үнсүз тыбыштар жасалуу ыгына карай жарылма, жылчыкчыл, мурунчул, капталчыл жана дирилдеме болуп бөлүнөт."},{"t":"p","h":"1. Жарылмалар. Бири-бирине жакындашып, тийи- шип турган сүйлөө органдарыбызды өпкөдөн келе жаткан абанын жарып өтүүсү аркылуу жасалган үнсүз тыбыштар жарылмалар деп аталат. Алар: б, п, д, т, г (кагаз), г (гул), к (кел), к (кол)."},{"t":"p","h":"2. Жылчыкчыл үнсүздөр. Сүйлөө органдарыбыздын бири-бирине тиер-тийбес болуп жакындашып турганда түзүлгөн жылчык аркылуу абанын сүрүлүп өтүшүнөн пайда болгон үнсүздөрдү жылчыкчыл үнсүздөр дейбиз. Буларга: з, с, ж, ш, й, г (ага), в, ф, х тыбыштары кирет."},{"t":"p","h":"3. Мурунчул үнсүздөр. Аларга: м,н, Ңң тыбыштары кирет. Булар өпкөдөн келаткан абанын айрым бөлүгү мурун көңдөйүнө өтүү аркылуу жасалат."},{"t":"p","h":"4. Капталчыл үнсүз тыбышы. Буга д тыбышы кирет. Ал тыбыш тилдин учу үстүнкү тиштерге такалып, аба тилдин эки капталындагы ачыктар менен өткөндө жасалат."},{"t":"p","h":"Б. Дирилдеме үнсүз. Р тыбышы дирилдеме деп ата- (лат. Анткени бул үнсүз тыбыш опкеден чыгып келе жаткан аба агымы тилибиздин учун бир нече ирет кыймылга келтирип, дирилдетүү менен жасалат."},{"t":"p","h":"34. Текстти окуп чыгып, кара тамга менен басылган сөздөрдү терип, көчүрүп жазгыла. Андан соң андагы үнсүз тыбыштарга жасалуу ыгына карата оозеки талдоо жүргүзгүлө."},{"t":"p","h":"<span class=\"pg\" data-n=\"46\">46<\/span>1870-1900-жылдары Испаниядагы Альтамира ункуру, Франциядагы Ля-Мут менен Пэр-нон-чер, кийинчерээк табылган Марсулая, Комбарель Фон де Гюль үңкүрлөрү, алардагы байыркы живопись дүйнөнү дунгүрөтсө, биздин Саймалуу таш жалпы коомчулукка 1902 – 1904-жылдары орус окумуштуулары (топограф А. Хлудов) тарабынан белгилүү боло баштаган. Фергана тоо кыркасында, Көгарт суусунун башталышында, деңиз деңгээлинен 3 мин метр бийиктикте жайгашкан бул жер кимди гана дегдетпей койбойт."},{"t":"p","h":"ОШМУнун доценти Л. Жусупахматовдун атуулдук демилгеси он жылдан бери эч ким тарабынан колдоого алынбашы, биздин элдин тектеш элдерден ар нерсени өз убагында чечпей, ыкшоолуктун кулу болуп калган өзгөчөлүгүбүздүн бир касиетин айгинелейт. Бүгүнкү күндөгү Саймалуу таштагы көркөм өнөрдү Москва, Санкт-Петербург, коңшу вабек туугандардын алып кетип жатышы көңүл оорутат. Кыргыз ташы кимге керек? Кыргыз тарыхы кимдин гана бүйрүсүн кызытпайт? Көөнө мурастар эмнеге уурдалууда? Кайсы максатка?"},{"t":"p","h":"Ал жакында Саймалуу ташта йолуп кайтты. «Сүрөтчулерден биринчи сени көрүшүм. Археологдордон келип калабы дедим эле»,— дептир Л. Жусупахматов. Ташиев Саймалуу ташка барган биринчи кыргыз сүрөтчүсү гана эмес, ушул темада алпурушкан жалгыз кыл чебер. Ушундан-улам сүрөтчүгө мындай собол менен кайрылып калдык:"},{"t":"p","h":"– Жумагул, Саймалуу ташка болгон кызыгууң качан башталды?"},{"t":"p","h":"– Тарыхка абдан кызыгам. Саймалуу ташка арналган эмне болсо баарын окуп чыктым. Дүйнөнүн башка жерлериндеги үндөш байыркы эстеликтерге тиешелүү адабияттарды куру калтырган жокмун. Мынчалык бийиктикте кылымдарды карыткан мындай көөнө мурастар эч бир жерде жок. Мен үчүн Саймалуу таш ыйык. Ата-баба калтырган мурас ар бир кыргыздын өз энчиси болсо дейм."},{"t":"img","src":"data:image/webp;base64,UklGRjRNAABXRUJQVlA4IChNAABwqgGdASqAAmECPrVYpE0nJSerpBRr4XAWiWlu05RsT3Zv072Df3+XF6DIiYhn96/XTvN/tl/jLF/YkaFm1jCA7alymVjP56whfl96bfl32o/L30F/G/pv9P/dv8l/2P8B7nOdf4n/P/73ox9Uf1P+G/yvvO/xv/L5O/uv75/u/UO/Mv51/p/79+SPycfl93BpH/G9Av2n+8/s95IWq58A/l/2O+AT+ff331S8Pf8d6hvi8axP0L/eftb7QpWw+XOfCkN2Q51CCkuCg8t/UKHnX6OtvHFByitDKpKV9K4vlPG36BKqKtlWu1c8ocEF/l5n5KMNTRlHGbUfxqggzFOR7x/+/NKILWAzOnSfBJuptxKpyvSbIXJO5xTPDHFr9J6DX8GDrqfqOBqAVh4IBV+FP+P2NyTSGTvWxDiOSk0bpXMDvxfedh1F4UYylhbdWli60TMXpLFQ8iyck6mt6+28eQTe/As0BDmyLW/FwgSkIblSOUYeBEAh45rUUOzbgHh+fKY46PeZQIXssw9ca6Z+dqGcHV1mnxQlD0/qAy3KsLqbBSdqwj8NL5kZXouSSTDGfWKaHd32D88pvcA4lmnS1IOZHkVj9o9gv/usgA3AAuMQu8VMKF1XDLkNC1vQ98vwNiULCGjvBDw8j8nsXZvwBBsAAvz0se0jTrLdfj1mWpQ6BYmVvtekKucvCWPOgigqUZg3G1apIb4aA0VfqDh97osyC1fyTRK7gyS2DbXfwlY8gMQKzQrjoUH1ZkFdScmbOOak0cZSxi9q1H9zB9OnsRXvQZ+mk8E/V9ccw8/oIlofXXe4NQ6R3QO4Iyf5+cEaipRB4EbRkMhdyUVNYQW+FQDHN4dK0IKKsxv3pTi/G53KXM1xGrL2WaFdOqaBuq8EFWViGY3M2pI7XHgy5nrq0e01Ya5lXTVVBIzBFFfk3mpME1PWLLmXYagKGPsNV6hiSsif6sluICPo4vLPRHPyKpn5hS/1vAF913H7aVaTZyJAyEn33rCZgh4nk/nYCPS5yPBlVUb6WAnOrVYzkxCMwH9veucDH6JlifEVgo03wpwH3GUUI1Qo35RaxW4RLzaCTpN6kKWCZGCSdxLjIGUiSvkfq5lkEfBVs68wo68Ts+8qUqM+MqPxxWFbNZXUH7TfCmtB72gL3h56+knfKP+NulDcOcUqpbK7w8Be09Ph9WMlkSKybfLKQG3wINJFeb7KNTOXfzK5XFXHNUzl3NOIzV1l9AKWfVfU67G099TDVdzP24SmFESzF0ZPScULgL0fz0w3ugR2Ngq9DSLjYHv7zKs8f6eZOneaPp7NYeWsrrtuGWzqLLRBjCipJhBfjSfE2S5qTzN4ynQDNEF6SXATW4uqi6Y3k5GVzlgKmPOVTuPQ50WfaKHYGTR7m8+obTYMhBXyFWxiSW5GwP3C9vAZDLumGuZqrXI2OW7ouqJXNRgJ2WFXDrV0eEXWJFqwfsrDWU ","h":"Бир сөздөгү тыбыштардын бири-бирине таасир атип, бир кылка ыргакка ээ болушун үндөштүк мыйзамы дейбиз."},{"t":"p","h":"М исал ы: Берекелерим, жыйынтык, уйдегулергө, энелерибизге, сүймөнчүктүц, тоолордо, китептерде, талаалардагы, керунгендерге, кулкулууц, окуучу ж. у. с."},{"t":"p","h":"36. Ырды окуп, кара тамга менен басылган сездерду көчүрүп жазгыла. Ал сөздөрдөгү үндөштүк мыйзамына байланыштуу окшошуу учурларын тандап, ага карата өз оюңарды кеңири баяндап бергиле,"},{"t":"h3","h":"ОКУП КОЙ"},{"t":"v","l":["Турмушту көрүп жаздым, үңүп жаздым,","Тоолорго, жерге тизе бүгүп жаздым.","Алкынган тулпар минбей, дуулап күлбөй,","Аксаңдап, кош таякчан жүрүп жаздым.","","Олтуруп досторумдун канатына,","Ой издеп жүрдүм тоонун арасында.","Ылымта издеп барсам аскаларга,","Ыр берди, ыйманыма жамап шыбаа.","","Журтумдун түнөп жүрдүм жүрөгүндө,","Жол айтты үлбүр болуп түнөгүмө,","<span class=\"pg\" data-n=\"49\">49<\/span>Суу бурдум уюткулуу ак мөңгүдөн,","Сезимде аздыр-көптүр уренуме.","","Калкыман каран түндү жашырбадым,","Кайгынын эрким менен ташын жардым.","Биринчи ыр жазганда олтургамын,"]},{"t":"raw","h":"<div class=\"gloss\"><p>кей йа. а лы ы. лы ы ы ы ы а ы а а а а Са ыы ы<\/p><\/div>"},{"t":"p","h":"Түбүндө бүчүр жарган жаш ыргайдын. (Ө. К.) Үндүү тыбыштардын окшошуусу башка тилдерге караганда кыргыз тилинде күчтүү өнүккөн. Кыргыз тилинин тел сөздөрүнүн дээрлик бардыгы үндөштүк мыйзамына баш ийип турат."},{"t":"p","h":"Мисалы: бадал, бадалдан, бадалдуу; акыл, акылман; жыгач, жыгачтарды; кымыз, кымыздан; нашар, нешерлеп, нешерлуу; ийин, ийинден; күкүк, күкүктөн; күч, кучтцу, кучтуцуреек ж. б."},{"t":"p","h":"Үндүүлөрдүн үндөштүгү кыргыз тилинен башка тилдерде дайыма сактала бербейт. Муну кыргыз тилине башка тилдерден кабыл алынган сөздөрдөн байкоого болот."},{"t":"p","h":"Мисалы: адеп, адабият, мугалим, алиппе, абийир, айнек, бетпак, каниет, далил, данек, табият, адилет, насип, сармерден, шакирт, агент, авария, авторитет, бактерия, балет ж. б. у. с. сөздөр башка тилдерден кабыл алынган. Бирок ага уланган мүчө анын акыркы мууну боюнча үндөштүк законуна баш иет."},{"t":"p","h":"Кэз бир мүчөлөр уңгуга уланганда үндөштүк мыйзамына баш ийбестен өзгөрүүсүз калат. Алар: 1) башка тилдерден кирген мүчөлөр (-бей, -стан): бейбаш, бейкут, беймаал, Өзбекстан, Түркмөнстан; 2) туруктуу мүчөлөр (-кер, -кор, -кеч): жоокер, кызматкер, сүткор, арабакеч; 3) эркелетүү же кичирейтүү маанисин билдирүүчү мүчөлөр (-ке, -бай, -тай): абаке, атаке, акебай, жеңетай."},{"t":"p","h":"З7Т. Төмөнкү текстти окуп, андагы үндөштүк мыйзамына байланыштуу езгерген сөздөрдү таап, аларга мүнөздөмө бергиле. Ошондой эле андай өзгөрүүгө учурабаган сөздөргө токтолуп, анын себебин түшүндүргүлө."},{"t":"p","h":"Мен чоң окууга экзамен тапшырууга кетерде буудайга жаңы гана орок тийген эле, эми бүтө жаздап, жон-жондо ак саман чаңып, кызылы кырманга үйүлүп калыптыр."},{"t":"p","h":"<span class=\"pg\" data-n=\"50\">50<\/span>Эски чемоданымды көтөрүп, кылкылдап турган көк жүгөрүнү түптөй басып, бурчунда жалгыз түп тыты бар жалпак кызыл тамдын эшигине келе бергенимде, бери чыгып келе жаткан атам бетме-бет келе түштү. Мени көрүп, оозунан сөзү түшүп, аңкайып токтоп калды."},{"t":"p","h":"– Кел уулум?.. – деп күңк этти, тула боюмду бир тегерете тиктеп. Ичкертен апамын карбаластаган үнү чыкты:"},{"t":"p","h":"– Асылбы? Каралдым!"},{"t":"p","h":"Экөө ортого алып, сен-жыттап, сылап-сыйпап, энеаталык мээримге бөлөдү. Апам көпөлөктөй дилдиреп, башыма суу тегеретип чачып, үйгө киргизди."},{"t":"p","h":"– И... иш кандай? – деп сурады атам, жанына отургузуп. Эмелеки шатман жылмаюу жүзүнөн жылан сыйпагандай жоголду да, анын ордун кооптонуу, оор зааркануу басты."},{"t":"p","h":"Мурдуму быш тартып, бутумун учун тиктедим:"},{"t":"p","h":"– Өтпөй калдым... Тиги Мыкты деле өтпөй калды... Атам үн катпай, былк этпей тунжурай түштү. Бир оокумда апам:"},{"t":"p","h":"– Ой... Эмне мынча урпейдун, окубаса жүрөр! – деп жиберди. Бирок атамын уккусу келбеди. Табиятынан назик, бирок өз билгенин бербеген мүнөзү кармап, этек кагынып, күңкүлдөп эшикке чыгып кетти:"},{"t":"p","h":"– Адам болот экен десе..."},{"t":"p","h":"Апам улутунуп койду да, бешенемден сылады:"},{"t":"p","h":"– Тегеренейин, азып кетипсиң. Бир жериң оорудубу, ыя?.. – деди,—- атаң дулдундай берет, адаты."},{"t":"p","h":"Апам чымчыктай үйрүлө түшүп, айланып, үйрүлүп астыма дасторкон жайып, нан, айран койду."},{"t":"p","h":"– Атаң өзү капа,— деди апам,— ишинен түшүрүп коюшуптур. Насип буйруп, үйдө болсоң, аки-чүкүсүн угарсың."},{"t":"p","h":"Атам керели-кечке үн катпады. Кантсе да, ал эми ичинен куйпелектегенун жашыра албай, баш ийкеп, мени жанына чакырып алды."},{"t":"p","h":"– ..Мына? – деди атам кайрадан буулугуп,— менин бел кыларым, таянарым ким? Сенби? Атадан бала, устадан шакирт өтүү керек. А сен... Сени адам болот экен деп..."},{"t":"p","h":"<span class=\"pg\" data-n=\"51\">51<\/span>Шүмүрөйүп турган жеримде туруп кала бердим... „..Анын көз алдынан айылдык кеңештин төрагасынын баласы Мыкты экөөнүн университетке экзамен тапшыруу үчүн даярданбай эле шаарга экскурсияга баргандай кыдырып жүргөндөрү чууруп өтүп жатты... (Т. К.)"}],"sub":[{"title":"ОКУП КОЙ","b":26}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[46,51]},{"title":"6 11. ҮНДӨШТҮК МЫЙЗАМЫНЫН ТҮРЛӨРҮ","blocks":[{"t":"h3","h":"6 11. ҮНДӨШТҮК МЫЙЗАМЫНЫН ТҮРЛӨРҮ"},{"t":"p","h":"Бир сөз ичиндеги тыбыштардын үндөшүүсү кебунче ундуу тыбыштарга мунездуу. Кыргыз тилинде ундуулер боюнча үндөштүк мыйзамына ылайык экиге бөлүнөт: 1) үндүүлөрдүн тилдин күүсүнө карата, 2) үндүүлөрдүн эриндин күүсүнө карата үндөшүп өзгөрүшү (окшошуусу)."},{"t":"p","h":"1. Үндүүлөрдүн тилдин күүсүнө карата үндөшүп өзгөрүшү (окшошуусу). Сөз ичиндеги ундуу тыбыштардын тил артына (жоон үндүүгө) жана тил алдына (ичке үндүүгө) карата ундешууеу үндцулөрдүн тилдин күүсүнө карата өзгөрүшү (окшошуусу) деп аталат."},{"t":"p","h":"Эгерде сөздүн акыркы муунунда жоон үндүү болсо, ага уланган мүчөнүн үндүү тыбышы да жоон үндүү боюнча кала берет."},{"t":"p","h":"Мисалы:"},{"t":"p","h":"Эгерде сөздүн аяккы муунунда ичке үндүү болсо, ага уланган мүчөдөгү үндүү тыбыш да ичке үндүүгө өтүп өзгөрөт."},{"t":"v","l":["Мисалы:","үй + лар үйлөр","эсеп + чы эсепчи","өтүк + чы өтүкчү","сүз + ма сүзмө","көңүл + сыз көңүлсүз","сүт + луу сүттүү"]},{"t":"p","h":"38. Төмөнкү сүйлөмдөрдөгү сөздөрдүн кайсынысында тил алды (ичке) жана тил арты (жоон) үндүүлөр боюнча үндөштүк мыйзамына ылайык өзгөрүүлөр болгондугун айтып бергиле."},{"t":"p","h":"1. Абийириңди жашыңдан сакта. 2. Адам аласы – ичинде, мал аласы – сыртында. 3. Ашың калса калсын, ишиң калбасын. 4. Илим алуу ийне менен кудук казгандай. <span class=\"pg\" data-n=\"52\">52<\/span>5. Билеги күчтүү бирди жыгат, билими күчтүү минди жыгат. 6. Адамды сүйө албаган адам, Ата Мекенин да урматтай албайт. Т. Өз кемчилигин сезбөө – наадандык."},{"t":"raw","h":"<div class=\"gloss\"><p>СЕ ч ЧЕ Се ы ү ч ЧЕ СШ ыш ч с^<\/p><\/div>"},{"t":"p","h":"8. Адилет адамдын адилеттигине шек келтирүү – кечирилбес күнөө. 9. Элге сүйгүнчүктүү болом десең, элиңди сүйө бил. 10. Чыныгы сүйүү – бардык кыйынчылыкты көтөрүүгө көмөктөш болот."},{"t":"p","h":"Кыргыз тилинде ундуулердун тил күүсүнө карата) үндөшүүсү өзүнчө бир ырааттуулукка ээ. Аны төмөн) жакта келтирилген таблицадан байкоого болот."},{"t":"p","h":"Сөздүн баш- Ошол үндүү- Мисалдар кы же акыр- ге окшошуп, уунунда анан кийин- келүүчү ун-"},{"t":"v","l":["дүү","ки муунда","(муундарда)"]},{"t":"p","h":"колдонулуу- чу үндүүлөр"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>1<\/td><td>2<\/td><td>3<\/td><\/tr><tr><td>жоон<\/td><td>а<\/td><td>а, ы, о, у<\/td><td>акыл, карагай, жа-<\/td><\/tr><tr><td>үн-<\/td><td>ратылыш, чалгын-<\/td><\/tr><tr><td>дүүлөр<\/td><td>доочулар<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"ы ы, а, о, у кыймыл, жылан, сыноо, кыштоодогулар у,а,ы,о |буйрук, булак, турагы, бургулоочулар, сурамжыла о,у,а,ы жорголоп, конок, конду, жогоркуларйы ойлобаду"},{"t":"p","h":"<span class=\"pg\" data-n=\"53\">53<\/span> Б,"},{"t":"raw","h":"<h4 class=\"mk\">ичке Үндүүлөр<\/h4>"},{"t":"v","l":["э, и, в, у","эне, мээрим,","э"]},{"t":"p","h":"негиздөөчү, ке-"},{"t":"p","h":"и и, э, у, @ ийгилик, шибер, ширелүү, тигуучулер уки, күкүк, сүйүнүч, кузетчулер, түнөк, куркуреш көргөзмө, көчүр, өрүм, көтөрүлүш"},{"t":"p","h":"§ 12. ҮНДҮҮЛӨРДҮН ЭРИН КҮҮСҮНӨ КАРАЙ,"},{"t":"h3","h":"ҮНДӨШҮП ӨЗГӨРҮҮСҮ (ОКШОШУУСУ)"},{"t":"p","h":"Сөздүн аяккы муунундагы үндүүнүн эринчил же эринчил эмес болушуна карата ага уланган мүчөдөгү үндүү тыбыштардын да эринчил же эринчил эмес болуп) ээрчишип өзгөрүп кетишин үндүүлөрдүн эрин күүсүнө карата үндөшүп окшошуусу (өзгөрүүсү) деп айтабыз."},{"t":"p","h":"Эгерде сездун акыркы муунундагы үндүү эринчил (болсо, ага уланган мучелердегу ундуулер да эринчил болуп өзгөрөт:"},{"t":"v","l":[") ой + сыз ойсуз тоо + лык тоолук","көр + ды көрдү","жазуу + чы жазуучу","кол + нын колдун","кол + ла колйо","бөлүн + ган бөлүнгөн","ойно + ба ойнобо нокто + ла ноктоло","көйнөк + чан көйнөкчөн","маанөт+сыз мөөнөтсүз","суз + гуч сүзгүч","күрө + ба куребе","уй + лар уйлер"]},{"t":"p","h":"Эскертүү: Кыргыз тилиндеги а тыбышы менен келген бир катар мүчөлөр (-ла, -лар, -га, -ган, -да, -дан, -чан) эринчил у тыбышы менен аяктаган сөздөргө уланганда, алар эрин күүсүнө багынбастан өзгөрүүсүз кала берет:"},{"t":"raw","h":"<div class=\"gloss\"><p> })<\/p><\/div>"},{"t":"v","l":["<span class=\"pg\" data-n=\"54\">54<\/span>улуу + лар улуулар","оорук + чан аорукчан","суу + ла суула","коюу + ла коюула","жоолук + чан жоолукчан окуу + га окууга","туурул + ган туурулган туу + га тууга","жууп + ган жуулган","суу + ган сууган","суу + дан суудан","учур + да учурда"]},{"t":"p","h":"Төмөндөгү текстти окуп, белгиленген сөздөрдөгү үндүүлөрдүн үндөшүүсү бар же жок экендигин байкайлы. Алардын ичинен кайсылары тил артына, кайсылары тил алдына карата үндөшкөндүгүн бөлүп керелу."},{"t":"p","h":"Үлгү: Кенже-си-мин. Сездун уңгусунда тил алды же ичке үндүүлөр бар. Ага уланган -сы, -мын деген мүчөлөрдөгү тил арты же жоон үндүүлөр уңгудагы ичке үндүүлөрдүн таасири менен ичкерип, тил алдына карата өзгөрдү."},{"t":"p","h":"Мисалы:"},{"t":"p","h":"Мен эң кенжесимин. Агам көбүнчө сүрөт тартып, мен гитарада ойной берчүмүн. Үйүбүздө пианино жок эле. Ошондуктан бөлөк бирөөлөрдүкүнө барып, суранып ойноп жүрдүм. Адегенде Харьковдогу музыкалык мектепте окуп, анан жогорку типтеги музыкалык окуу жайын бүтүрдүм. с"},{"t":"p","h":"Атам 1935-жылы дүйнөдөн кайтты. Ошондуктан музыкалык мектепке мугалим болуп иштөөгө туура келди. Мектептин директору мени жактырып, жаштыгыма карабастан фортепиано бөлүм башчылыгына дайындап койду. Бирок көпкө иштеп бере алганым жок. Харьков консерваториясына кирип, окуй баштадым. Төртүнчү курсту бүтө жаздап калганымда согуш чыкты. 1941-жылдын 21-ноябрь күнү Кыргызстанга эвакуацияланып келдим. Бул жердин жаратылышын да, адамдарын да дароо эле жактырдым. Кыйын учурда бир тууганча кучак жайып тосуп ала турган кыргыздай меймандос эл бар экенин мурда билген да эмес элем. Өзүм туш болгон ар түркүн адамдардын мамилелерине ыраазы болуп, бул элге жан аябай бир иштеп берейинчи деген ойго келдим. О, ал кезде иш чачтан кеп болуучу. Адистер жетишпейт... (9. М.)"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[52,54]},{"title":"§ 13. БИР СӨЗ ИЧИНДЕ ҮНДҮҮЛӨРДҮН АЛГА КАРАЙ ЭЭРЧИП ҮНДӨШҮҮЛӨРҮ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"55\">55<\/span>§ 13. БИР СӨЗ ИЧИНДЕ ҮНДҮҮЛӨРДҮН АЛГА КАРАЙ ЭЭРЧИП ҮНДӨШҮҮЛӨРҮ"},{"t":"p","h":"Сөз жасоочу же сөз өзгөртүүчү мүчө сөзгө жалганганда анын үндүү тыбышы өзүнөн мурда (алдында) турган үндүүнү ээрчип үндөшөт (эзгерет). Мындай өзгөрүүлөр (окшошуулар) бир сөз ичинде үндүүлөрдүн алга карай ээрчип үндөшүүлөрү деп аталат."},{"t":"p","h":"Мисалы:"},{"t":"v","l":["окуу + чы окуучу","тигцу + чы тигүүчү","сөз + сыз сөзсүз","үй + га үйгө","терме + ла термеле","көр + ды көрдү","жазуу + чы жазуучу","кол + нын колдун","өмүр + га өмүргө","кир + сыз кирсиз","кел + ба келбе","тон + чан тончон","тоо + лык тоолук","эс + ым + лык + лар ","өсүмдүктөр","көйнөк + чан= көйнөкчөн","мөөнөт + сыз мөөнөтсүз","суз + гыч сүзгүч","үй + дан үйдөн","бөлүн + ган бөлүнгөн цйі лар цилер"]},{"t":"p","h":"39. Ырды окуп чыгып, тил жана эриндин күүсүнө карата үндөшүп турган сөздөрдү таап, көчүрүп жазгыла да аларга мүнөздөмө бергиле."},{"t":"h3","h":"КОМУЗ"},{"t":"p","h":"Үч буроо, жалгыз тээк, үч кыл комуз, Чертилбейт, күүгө келбейт, чебер колсуз. Опоңой, керген көзгө жөпжөнөкөй,"},{"t":"v","l":["Бирок да өнөрү бар айтып болгус.","","Кылымдан кылым санап көксөй-көксөй,","Жыргалдуу биздин ушул күндү көздөй,","Бул комуз, көп сууларды кечип келген,"]},{"t":"p","h":"Эли да комузундай жөпжөнөкөй. (А.О.) 40. «Жер катмарларынын түзүлүшүе» деген тексттеги, кара тамга менен басылган сөздөрдү көңүл коюп окуп чыккыла. Ал сөздөрдүн уңгу жана мүчөлөрүнүн ортосуна сызыкча коюп <span class=\"pg\" data-n=\"56\">56<\/span>көчүрүп жазгыла. Сөздүн уңгу бөлүгү боюнча кыргыз тилине мүнөздүү болгон үндүүлөрдүн үндөштүк мыйзамы сакталбаган учурун таап, анын себебин айтып бергиле. Үндөштүк мыйзамы толук сакталган сөздөрдүн ичинен 8 – 10 сөздү тандап алып, алардагы үндөштүктү тил күүсү жана эрин күүсү боюнча ажыраткыла."},{"t":"raw","h":"<div class=\"gloss\"><p>Г<\/p><\/div>"},{"t":"p","h":"Улгы: 1. Физика-лык. Бул сөздүн уңгусунда кыргыз тилине мунездуу болгон үндөштүк мыйзамдын тил куусу сакталбаган. Анткени ал – орус тили аркылуу башка тилден кирген сөз. Ал эми ага жалганган мүчө сөздүн унгусунун акыркы муунундагы үндүү менен үндөшүп турат."},{"t":"p","h":"2. Эс-ум-дук-тер. Бул сөздүн уңгусу – өс, ө— тил алды, ичке үндүү. Ага уланган -ым, -лык, -лар мүчөлөрү уңгудагы тил алды ичке үндүүнүн таасири менен мүчөлөрдөгү тил арты жоон үндүү тыбыштар ага багынып, ичкерип, үндөшүп кетти. Ал эми эрин күүсү боюнча алганда ө эринчил үндүү тыбыш. Ага уланган мүчөлөрдөгү -ы, -ы, -а үндүү тыбыштар эринчил эмес. Бул сөздө -лар өзүнөн мурдагы эринчил үндүүнүн таасиринде өзгөрүп, эринчилдерге өтүп кеткен. Үндүүлөрдүн мындай ээрчишүүсү эрин күүсүнө карата үндөшүп өзгөрүүсүнө кирет. Демек, бүл сөздө тил күүсүнө карата да үндөштүктүн мыйзамдары сакталган."},{"t":"h3","h":"ЖЕР КАТМАРЛАРЫНЫН ТҮЗҮЛҮШҮ"},{"t":"p","h":"Жер шары атмосфера, гидросфера, биосфера, геосфера деген катмарлардан турат. Ар бир катмар физикалык абалы, түзүлүшү, өзгөчөлүгү, химиялык курамы жана геологиялык процесстеринин ар түрдүүлүгү менен айырмаланат. Жер шарынын эн үстүнкү аба курчап турган бөлүгү – атмосфераны, океан-деңиздер, көлдөр, муз-мөңгүлөр ээлеп жаткан аянты – гидросфераны, жаныбарлар менен өсүмдүктөр тараган аймак – биосфераны, ал эми Жердин ички катмарлары – геосфераны түзөт."},{"t":"p","h":"Аба катмарынын түзүлүшүнө, алардын оордук күчү менен таралышына, аба массаларынын кыймыл-аракетине жана Күндөн бөлүнгөн радиациянын тийгизген таасирине жараша атмосфера өз ичинен бир топ кабаттарга бөлүнөт. Атмосферанын Жер бетине жакын орун алган кабатын тропосфера деп атайбыз."},{"t":"p","h":"<span class=\"pg\" data-n=\"57\">57<\/span>Тропосферанын үстүңкү бөлүгү стратосфера деп аталат. Стратосферада температура көтөрүлүп, кычкылтек озонго өтүп кетет. Ошентип, күндөн келген нурларды жер бетине толук өткөрбөй турган озон экраны түзүлөт. Алар ар кандай зыяндуу нурлардан жер бетин сактай турган коргогуч калкан болуп саналат. Атмосферанын курамы 78,09% азоттон, 20.95% кычкылтектен, бир пайызга жакыны аргон, неон, криптон, ксенон сыяктуу инерттүү газдардан жана суутек, озон, көмүр кычкыл газынан турат. Жер бетине жакын суу буулары, жанар тоолордон бөлүнүп чыккан түтүндөр, күлдөр, газдар, шамал учуруп келген чаңдар, кыпындар, космостук заттар кездешет."},{"t":"p","h":"Жер бетинде өсүмдүктөр менен жаныбарлардын түрлөрү өтө көп. Ага жараша жашоо шарттары, кыймыл-аракеттери, тамактануулары, өсүп-өнүгүү процесстери да ар башка. Айрымдары узак убакытка чейин өмүр сүрөт, тоо тектеринин талкалануу процессине катышат. Кен байлыктарды, топурак кыртышын» ар кандай чөкмөлөрдү пайда кылат. Чирүү, калыбына келүү, кычкылдануу, ажырап бөлүнүү процесстерине көмөктөшөт. Организмдердин турмуш-тиричилигинен таш көмүр, графит, акиташ, чым, кен, нефть ж. б. кендердин мол запастары орун алган. {«Жер – биздин планетабыз» деген китептен.)"}],"sub":[{"title":"КОМУЗ","b":5},{"title":"ЖЕР КАТМАРЛАРЫНЫН ТҮЗҮЛҮШҮ","b":12}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[55,57]},{"title":"&amp; 14. ЭКИ СӨЗДҮН АРАЛЫГЫНДА","blocks":[{"t":"h3","h":"&amp; 14. ЭКИ СӨЗДҮН АРАЛЫГЫНДА"},{"t":"p","h":"ҮНДҮҮЛӨРДҮН ТҮШҮРҮЛҮП АЙТЫЛЫШЫ,"},{"t":"h3","h":"АЛАРДЫН ЖАЗЫЛЫШЫ"},{"t":"p","h":"Удаа айтылган эки сөздүн мурункусу үндүү тыбыш менен аяктап, кийинкиси үндүү менен башталса, ошол сөздөр биригип айтылып, ортосундагы катарлаш келген (эки үндүүнүн бири сыйлыгышып түшүп калат. Жазууда ал үндүүлөр өз абалын сактап, ар бир сөз өз алдынча жазылат:"},{"t":"p","h":"41. Ырларды көчүрүп, сөздөрдү кашаадан чыгарып жазгыла. Анда кайсы үндүү тыбыш эмне себептен түшүрүлүп айтылгандыгын көрсөткүлө."},{"t":"v","l":["<span class=\"pg\" data-n=\"58\">58<\/span>1,","Ак калпак кыргыз эл-журтум,","Аман жүрсүн {дечүлең).","Алты сан жыйын чогулса,","Артыкча булбул (көркүлең).","","Агын суудай ташыган,","Алтын сөздүн (кенчилен).","Алыска наамың угулуп,","Алайлык ырчы (делчүлең).","2.","Суу келатат,","Суу келатат бир кулак,","Момун сууну мактап алчу (жакшубак),","Ураа достор! Арык толо аккан суу,"]},{"t":"p","h":"Колхозчуга табылбаган кадыр-барк. (А. О.) 3."},{"t":"v","l":["Кечээ жаштык түтүн эле (жаналек),","Жүзүм эле тамчы суусу (тамалек)."]},{"t":"p","h":"Тагдыр кошуп жолдош кылган турмушка, Тамашалуу бир топ, бир топ (балалек). (А. О.) 4."},{"t":"v","l":["Экөөнө бирөө (баталбайт),","Аттууга жөө (жеталбайт). (Т.)","5.","(Каройдун) суусу терен – деп,","(Кечалбай) турдум элеңдеп. (Эл ыры.)","6.","(Алтай) иштеп тер теккен,","(Алалбадым) акымды. Барпы.)"]},{"t":"h3","h":"&amp; 15. БИР СӨЗ ИЧИНДЕ ҮНСҮЗДӨРДҮН АЛГА КАРАЙ ОКШОШУП ӨЗГӨРҮҮСҮ"},{"t":"p","h":"Эгерде удаа келген эки үнсүздүн кийинкиси өзүнөн мурдагы үнсүздүн таасири менен ага окшошуп (өзгөрүп) айтылса, андай кубулушту үнсүздөрдүн алга карай окшошуп (өзгөрүп) айтылышы дейбиз."},{"t":"p","h":"Мисалы: кат + нын каттын, китеп + га › китепке, бас + ба баспа."},{"t":"raw","h":"<div class=\"gloss\"><p>58<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"59\">59<\/span>Үнсүздөрдүн алга карай окшошуп (өзгөрүп) айтылышы жалпысынан алганда эки түрдүү жол менен ишке ашат: 1. Каткалаң цнсуз тыбыштардын таасиринде алга карай окшошуулар (өзгөрүүлөр)."},{"t":"p","h":"2. Жумшак цнсцүз тыбыштардын таасиринде алга карай окшошуулар."},{"t":"p","h":"(Каткалаң үнсүз тыбыштардын таасиринде алга карай окшошуулар (өзгөрүүлөр)."},{"t":"p","h":"Каткалаң үнсүз менен аяктаган сөзгө жумшак үнсүз тыныш менен башталган мүчө жалганганда, өзүнөн мурда келген каткалаң үнсүздүн таасири менен мүчөнүн башкы үнсүз тыбышы да каткалаңдашып, ага окшошуп ч си ч (өзгөрүп) айтылат. намыстуу, белек + га белекке, бак + да бакта, тё- М исалы: топ + нын топтун, намыс + луу рек + дай теректей, сызып + бы сызыппы, кесип +"},{"t":"p","h":"лаш кесиптеш."},{"t":"p","h":"42. Текстти окуп, кайсы сөздөрдө каткалаң тыбыштардын таасири менен үнсүздөрдүн окшошуп {өзгөрүп) кеткенин айтып бергиле. Андай учурларды түшүндүрүү үчүн, ал сөздөрдү уңгу, мүчөгө ажыратып, мүчөлөрдүн алгачкы варианты кийин өзгөргөнүн же каткалаң тыбыштын таасиринде ага окшошуп кеткенин көрсөткүлө."},{"t":"p","h":"Кыргыз элинин коомдук-саясий турмушунда МХ кылым менен XX кылымдын башы алааматтуу, өтө татаал, кайгылуу заман болсо да, калайык-калк арасынан караңгыда жылт эткен жылдыз сыңары жаркын таланттардын: төкмө ырчылар, залкар комузчулар, манасчылар, жазгыч акындар, тарыхка, санжыра-салтка куштарланган адамдардын болгону бизге белгилүү. Кээ бирлеринин мурасы, шоораты өз кезегинде элге жетип, журттун рухий казынасына кут болуп уюду. Айрымдарынын эмгектери убагында жарыяланып, а тургай китеби жарык көрсө да, ез көлөкөсүнөн кабатыр болгон, кайдыгер заманда коомчулук көрмөксөн, укмаксан калган тейден, эч этибарга алынбады. Кайсы бир таланттар жеке адамдын зоболосуна жүгүнүүнүн кедергисинен элге жетпей, ак жеринен караланып, жазага кабылып, өмүрү дарексиз, эмгеги барксыз болуп кала берди..."},{"t":"p","h":"<span class=\"pg\" data-n=\"60\">60<\/span>Кыргыз маданиятынын тарыхында чыгармачылык өмүрү мүлдө оозго алынбаган, алтымыш жылдан бери кол жазмасынын дареги элге жетпей, кара сандыкта бөөдө катылып жаткан, коомчулуктун барк-баасынан өксүп келаткан алгачкы окумуштуу-агартуучунун бири – Белек Солтоноев."},{"t":"p","h":"‚..Мына, насип буюрду, үстөл үстүндө жедеп саргарып, эскилиги жеткен, чети убалана баштаган, калем менен мизилдете эң этият жазылган, миң беттен ашуун кол жазмасынын асили нускасы жатат. Калың мукабаны ачканда барак бетинен мындай жазууну окуйсуз: «Кызыл кыргыз тарыхы. Жазуучу Белек Солтонкелди уулу Солтоноев. Насиним – кыргыз. 1895-жылдан баштап жыйып, 1934-жылы жамдадым»."},{"t":"p","h":"Белек Солтоноев урпактарга «Кызыл кыргыз тарыхын», элдин оозеки чыгармачылыгы, салт-санжырасы, маданияты жөнүндө жыйнаган бай материалдарды жана адабий мурастарды калтырыптыр. Ушунчаны эриккенде же эрмек үчүн жазган эмес. Элге жетсе, урпактар окуур, окуса ойлонор, ойлонсо тарыхка көзү ачылар деп тилеген."},{"t":"p","h":"Б. Солтоноевдин кырк жыл жазып, чогулткан эмгегин үңүлүп окуудан мурда анын миз бакпаган өмүр-тагдырына, мээнет эмгегине суктана карап, «ушундай да аталарыбыз жашаптыр, мунун баарын кантип чогултуп, жазды экен, эсил кайран киши...» деп ойго батып, ага астейдил таазим кылабыз. (К. Жус.)"},{"t":"p","h":"4З. Төмөнкү сөздөргө ылайыгына жараша -лаш, -луу, -дай, -лык, -гыч, -ла, -ныкы мүчөлөрүн жалгап, мүчөлөр жалганган сөздөрдүн ичинде үнсүздөрдүн алга карай окшошуп айтылышы болгондугун түшүндүрүп бергиле."},{"t":"p","h":"Китеп, ат, ырыс, таш, күрүч, иш, саат, класс, чап, эшик, сүт, жаак, баш."},{"t":"v","l":["Үлгү:","Сут + дай сүттөй, сут + луу сүттүү."]},{"t":"p","h":"Мында сут деген сөзгө -дай жана -луу мүчөлөр жалганды. Ал мүчөлөрдүн башкы жумшак тыбыштары (д, л) каткалаң үнсүз тыбыш менен аяктаган сөзгө жалганганда, өзүнүн алдындагы тыбыштын таасири менен өзгөрүүгө учурап д, л тыбыштары каткалаң т т

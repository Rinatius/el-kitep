к. Ал чунак карыз берерин берип, кайра алгыча жаныңды сууруйт. Сибирге барып токойго заара кылсаң <span class=\"pg\" data-n=\"191\">191<\/span>үч күнгө чейин чиркейдин чакканынан такымың шишип, кычышып, мазаңды алат экен десе болобу. Муну уккан биз же күлөрүбүздү билбей, же ыйларыбызды билбей отуруп калдык. Ошентип, мындан жыйырма жыл мурда керез айткан Эркебай ушу кезде деле өлбөй-житпей куландан соо жүрөт. (А. С.)"},{"t":"p","h":"150. Бул сатиралык аңгемени да окуп чыгып, анын мазмунун, башкы оюн жана идеясын түшүнгүлө. Эне тилиңде таза сүйлөп, ыймандуу болгула. \"Уз менен баяндоочтун жак, сан боюнча толук аэрчишүүсүн тексттеги мисалдар менен далилдегиле."},{"t":"h3","h":"КАРА ИТ"},{"t":"p","h":"Автобуста бараттык. Жол узак. Сапар тарткан жүргүнчүлөр да ар кыл жаштагы адамдар. Бир дагы бош орун жок. Эн алдыңкы орунда чүрүшкөн кара кемпир. Анын бет алдындагы орундукта аки кыз катар отурушат. Тырмактары упузун жана кыпкызыл. Беттери кара тору. кездеру капкара болсо да чачтарын күрөң-саргыл кылып боётуп алышкан экен. Эки кызды жандап тикесинен тик туруп келатышкан үч жигит тигилерге бирдеме айтымыш болуп кайра өздөрү каткыра күлүп калышат. Чачтары үрпөйгөн кер ооз жигиттерди жана тиги Айша менен Айнаны алдыртан жактыра бербеген кара кемпир кээде өзүнчө кобуранып коёт. «Жаман өлүксүздөр десе. Эркеги менен кызынын айырмасы жок. Карасаң, чачтары желкесине түшүп, катын десең баары мурутчан. Буларың эркек дейин десең тырмактары узун, эмчектери салаңдай катын кейпин кийип турушат. Катын дейин десең албарстыга окшоп чачтары сапсары». «Ладно, ладно, не выступай, мастан». Жигиттер кемпирди зекиген болушат да, тамекини бурулдатышууда. Автобустун ичи ысык. Тигилерди тамеки тартпа деп айтууга эч ким даабай, жол азабын тартып келатышкан жүргүнчүлөр өзүнчө беймаза. Бир даары үргүлөп, бир даары өз ара акырын сүйлөшкөн болушат. Ушу -кезде күйүк жыттанып, кыздар кыйкырып жиберишти:"},{"t":"p","h":"– Энеке, горит, горит! Вставайте..."},{"t":"p","h":"Жүргүнчүлөр түйшөлө түштү. Көрсө, тамеки тарткан жигиттердин учкуну тийип, кара кемпирдин этеги тутанып, күйө баштаган экен. Бирок кемпир түйшөлгөн элге <span class=\"pg\" data-n=\"192\">192<\/span>көңүл бурбай, кыздарды жек көрө карап, буркан-шаркан түштү:"},{"t":"p","h":"– Өлүгүңдү гана көрөйүн албарстылар. Баятан бери тим койсо ашынып баратышат. Энесиндей кишини шылдындап. Кусурум урсун, өлүгүңдү көрөйүн албарстылар. Кара ит, кара ит деп коюшат. Мен кара ит болсом, силер сары итсиңер. Мына эмесе,— деп этегин кагына бергенде колу тутанып келаткан жалынга тийип ордунан ыргып турду. (А. С.)"},{"t":"p","h":". Төмөнкү тексттен баш мучелердун толук эмес ээрчишүүсүн белгилегиле. Тексттин мазмунун толук үйрөнүп, башкы идеясын чечмелегиле. Ошондой эле баш мүчөлөрдүн толук ээрчишүүсүн да далилдегиле."},{"t":"h3","h":"ЭНЕ"},{"t":"p","h":"Перзентке эненин мээр-махабаты атаныкынан да көбүрөөк болот. Айрым перзенттер баарынан ыйык, ары мээрбан эненин кадыр-сыйын билишпейт. Бир жаш жигит энесинин сөзүнө кулак салбады. Кыйкырып-өкүрүп, анын дилине азар берди. Мээрбан эне уулунун кылыгынан көңүлү сууп, көзүнө жаш алды. Анан уулунун наристе кезинде жаткан бешигин анын алдына алып келип коюп мындай деди:"},{"t":"p","h":"– Эй, жаштыгын, наристе чагын унуткан уят-сыйытсыз акмак! Мына бул бешикти көрдүңбү? Наристе кезиңде сени ушул бешикке бөлөп, кечкисин таң атканча уктабай терметээр элем. Адеп ыйлай берсең бешиктен чечип алып, боорума басып сооротоор элем. Өтө көптөгөн машакаттарды көрүп, сени тарбияладым. Сен деп күч-кубаттан тайдым. Сен деп көп кыйынчылыктарга моюн сундум. Мына эми эр жетип, күч-кубатка толдуң, бирок жаштыгыңды жана наристелик дооруңду унутуп, мээрбан энеңе баш ийбейсиң! Анын көңүлүн жаралап, көз жашын тектуресун. Андай кылбагын, уулум, эненин махабаты канчалык зор жана чексиз экендигин унутпагын. Мен дагы, атаң дагы сенин дайыма бактылуу болушуңду каалайбыз. Бизди капа кылбагын. Дилибизди оорутпагын. Айткандарыбызды кабыл тутуп, бизди ыраазы кылып, батабызды алгының."},{"t":"p","h":"<span class=\"pg\" data-n=\"193\">193<\/span>Эненин ыйлап айткан сөздөрү жигиттин жүрөгүнө октой кадалды. Ал өзүнүн кылган кылмышына бушайман болду. Энесин бек кучактап алып көзүнөн, бетинен өпкүлөдү, ыйлап кечирим сурады. Эне эмеспи, уулунун күнөөсүн кечирип жүзүнөн өөп, ага ак батасын берди. («Акыл тамчыларынан»)"},{"t":"p","h":"152. Эз менен баяндоочтун толук эмес ээрчишүүсүн катыштырып, өзүңөр каалаган темада ой жүгүртүп чакан текст түзгүлө, ага тема тандагыла жана башкы оюн, идеясын аныктагыла."},{"t":"p","h":"153. Төмөнкү тексттен ээге карата бандоочтун сан жагынан ээрчибеген учурларын аныктагыла. Тексттин мазмунун, башкы оюн жана идеясын жакшылап ездештургуле."},{"t":"p","h":"... Эл тоюнуп, алардын ичинде эч кимге залалы жок биздин чакан үй-бүлө да бат эле ирденип кетти... Ошол кышта апам узакка ооруду. Бул кыш биз үчүн этэ оор мезгил болду..."},{"t":"p","h":"«Өлбөгөн адам алтын аяктан суу ичет» деген төгүн эмес турбайбы. Бардыгы өзгөрөт, жаңырат дегенге мен ошондо эле ынанып калдым. Өмүрлөр жомоктогу алтын булактай бир калыпта шылдырап агып жатты... Рысбек мединституттун үчүнчү курсунда болучу. Апам кийинчерээк көп ооруп төшөккө жатып калчу болду. Окубай эле коёюн десем өзү болбойт."},{"t":"p","h":"Эптеп күн өтэр. Тууган-урук бар эмеспи. Тиги атанын туугандары да жардам берип турар. Көп эле камтама боло бербе,— деп мени сооротот."},{"t":"p","h":"Көңүлүм тынчыбаган мен агама: – Апам катуу ооруп жатат – деп кат жазып жибердим. Эмне үчүн жаздым экен ошондо..."},{"t":"p","h":"Демейде энесаак Рысбек Суусамыр ашып жөө келди. Ошол бойдон окуусун таштап койду. Бир чети жардамдашар бүлөсү болбогондуктан, кийим-кече, тамак-ашынан кыйналса керек, же... Апамын оорусун шылтоолоп эле таштап койду го окуусун."},{"t":"p","h":"Эмне учун кат жаздым экен. Ичимен кыжалат болом. Эмне, Рысбек чындап ажал жетсе апамы алып калат беле. Бу арга түгөнгөндөгү оюм да, болбосо... Кеп өтпөй байкуш апам дагы оорусунан сакайып, Рысбегин үйлөнтүп коюуга жетишти. Апамдын бактысынанбы, келини жаман <span class=\"pg\" data-n=\"194\">194<\/span>чыккан жок. Колуна кол, бутуна бут болуп, апамдын айтканы менен. Апам да бир санаасынан тынчыгандай тигинтип келиним жаман чыккан жок. Өзүмө күйүмдүү, байкушум. Теңирге шүгүр, экөө бири-бирине ынак жар болчудай. – Алар жокто апам ушинтип божурап калат, Мен тек, ичимен апамын оюн кубаттайм... (А. Т.)"},{"t":"p","h":"154. Суйлемдун баш мүчөлөрүнүн т олук жана толук эмес ээрчишгуулерун камтыган өзүңөр тандаган моралдык-этикалык же коомдук-саясий темада чакан текст түзгүлө."},{"t":"p","h":"155. Ээге карата баяндоочтун сан жагынан ээрчибеген учурларына ылайыктуу каалаган темаңарда ой жүгүртүп, оозеки баяндама даярдагыла, Баяндаманын планын түзүп, темасын аныктагыла, башкы оюн жани идеясын тапкыла."}],"sub":[{"title":"КАРА ИТ","b":10},{"title":"ЭНЕ","b":16}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[191,194]},{"title":"§ 52. ТЕН ЖАНА БАГЫНЫҢКЫ ТАТААЛ СҮЙЛӨМДӨРДҮН ГРАММАТИКАЛЫК ТҮЗҮЛҮШТӨРҮ БОЮНЧА АЙЫРМАЧЫЛЫКТАРЫ","blocks":[{"t":"h3","h":"§ 52. ТЕН ЖАНА БАГЫНЫҢКЫ ТАТААЛ СҮЙЛӨМДӨРДҮН ГРАММАТИКАЛЫК ТҮЗҮЛҮШТӨРҮ БОЮНЧА АЙЫРМАЧЫЛЫКТАРЫ"},{"t":"p","h":"(Тен байланыштагы татаал суйлемдердун синтак- ‚ систик түгөйлөрү интонация жана байламталар аркылуу өз ара байланышат. Тең байланыштагы татаал сүйлөмдөр тутумундагы жөнөкөй сүйлөмдөрдүн өз ара ‚ байланышуу жолдору боюнча байламталуу жана бай-! ламтасыз татаал сүйлөмдүн тутумундагы жөнөкөй сүй- (лемдердун биринде негизги ой айтылса, экинчисинде ‚ ал ой улантылат, толукталат, чечмеленет."},{"t":"p","h":"М исалы: Адам бардык жактан татынакай болууга тийиш: жүзү жарык, ичи таза, ою тунук, сыр- ты сымбат. Багыныңкы байланыштагы татаал сүйлөмдүн туту- мунда синтаксистик эки түгөй болот да, анын бири багынынкы суйлем, экинчиси баш суйлем деп аталат. Бул эки түгөй грамматикалык татаал бир бүтүндүн) (татаал сүйлөмдүн) өз ара ажырагыс бекем байланыш- кан жана маанилери боюнча бири экинчисине багы- нычтуу, кез каранды болгон бөлүктөрү болуп саналат. Баш сүйлөм багыныңкы сүйлөмдү маани жактан өзүнө) багындыруу менен, татаал сүйлөм аркылуу берилип <span class=\"pg\" data-n=\"195\">195<\/span>жаткан ой-пикирди жыйынтыктап турат. Ошондуктан багыныңкы сүйлөмгө караганда баш сүйлөм маани жактан үстөмдүк кылат. Ал эми багыныңкы сүйлөм болсо баш сүйлөмдөгү ойдун түрдүү кырдаалын, белгилерин, мүнөзүн баяндайт, түшүндүрөт. Ошентип, алардын сүйлөмдүк касиети, белгилери, багыныңкы байланыштагы татаал сүйлөмдүн тутумунда гана сакталат."},{"t":"p","h":"М исал ы: Бардыгын билген гана акылдуу болбостон, билгенин иш жузундо көрсөтө алган акылдуу болот. (Аристотель.)"},{"t":"p","h":"Тен жана багыныңкы байланыштагы татаал суйлемдердун грамматикалык түзүлүштөрү бирдей болбойт."},{"t":"p","h":"Тең байланыштагы татаал сүйлөмдөрдүн тутумундагы жөнөкөй сүйлөмдөрдүн баяндоочтору өзүлөрүнүн грамматикалык түзүлүшү боюнча жеке турган женекей сүйлөмдөрдөн эч айырмаланбайт. Ошол себептүү мындай сүйлөмдөр өз алдынча турганда да, жөнөкөй сүйлөмдөр сыяктуу толук ой корутундусун билдирүүгө жөндөмдүү."},{"t":"p","h":"М исал ы: Жакшы уул элин багат, жаман уул элин уят кылат. Акылдуу таап сүйлөйт, акмак каап сүйлөйт. (Макалдар."},{"t":"p","h":"Багыныңкы байланыштагы татаал сүйлөмдөрдүн тутумундагы женекей сүйлөмдөрдүн багыныңкы түгөйлөрүнүн баяндоочтору грамматикалык жактан өзгөчө түзүлүштө болот, т. а., алар синтаксистик чак жана жак формаларында келбейт. Ошондуктан, өз алдынча туруп, кандайдыр бир ой корутундусун да билдире албайт."},{"t":"p","h":"М исал ы: Ниетиң таза болсо, ишиң алга жылат. Максат киргенде, кыздар күлүп калышты."},{"t":"p","h":"Жогорудагыдай белгилери боюнча тең жана багыныңкы байланыштагы татаал сүйлөмдөр өздөрүнүн грамматикалык түзүлүштөрү боюнча айырмаланып турат."},{"t":"p","h":"156. Төмөнкү тексттерди окугула. Тең жана багыныңкы татаал сүйлөмдөрдү белгилегиле. Алардын грамматикалык түзүлүштөрүнөн болгон айырмачылыктарын чечмелегиле."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[195,195]},{"title":"ЧАЛДЫН КУСАЛЫГЫ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"196\">196<\/span>ЧАЛДЫН КУСАЛЫГЫ"},{"t":"p","h":"1 ... Турна да, Талип да издешпей табышкансып, ээсин айланчыктап анда-санда үн салып, оттоп жүрдү. Төкөр чал колду мелтирей тиктеп, төрт уулунун аттарын атап дуба кылды. Кийинчерээк ал көлгө тынымсыз каттоочу болду. Чайын ичип-ичпей эле көлгө камынат төкөр чал. Колуна куш кондургансып, өзүндөй каркайган карт турнаны зэрдин кашына кондуруп, эки буту тепеңдеп тынбайт. Жарым ай үзгүлтүктөн кийин асман түнөрүп, муздак сыдырым токтоп, аба нымшып жылуу тартты. Мындай болгондо сөзсүз кар жаайт. Төкөр аны жакшы биле турган. Калдайган жалбырактарга шүүдүрүм түшүп, шелпейуп жер менен жер болуп, айлана тымтырс. Асман түнөрүп тоолордун баштарын жаап, бара-бара көлдүн айланасына да алгачкы кар түшө баштады. Талип бу күнү үйүнө тез кайтты... Бу сапар чал көлүнө бара албай калды. Анткени кар боройлоп беттеп уйгу-туйгу жаап, шамал бет маңдайдан уруп турган. Ал улам асманды карап, ушу кышты көргөнүнө ыраазы болсо да артта калган сексен жылы, бүгүнкү күнүнчө сезилбеди. Анткени Талип абдан эле шайдоот, тың эле."},{"t":"p","h":"Мындай көрүнүш кепке созулган жок. Карыянын кабагы кар жаагандай бат эле түнөрүп, анын улам мезгил өткөн сайын чычаладай кароолонуп өчүп бараткан өмүрү, эч кимге залалы жок өтсө да, турна менен болгондон берки күндөрүнчө көрүнбөдү. Аны тапканы санаачыл болуп, шордуу турна чалдын көл тарапка качышына себепчи болгонсуду."},{"t":"p","h":"п Экее бирдей кел алдында калган жаштыктарын ойлогондой суз тартышып, биринин оюн бири бат түшүнүшкөндөй, тиктешип калышат."},{"t":"p","h":"Кийинки күндөрү Талип көлгэ көп каттабай санаачыл болуп кетти. Өзүнчө кысылып, жүдөдү. Анысы аз келгенсип күрт-күрт жөтөлүп, төшөккө кепке жатчу болду. Турнанын унун УГУП кары чыйрала тушту. Төшөктөн <span class=\"pg\" data-n=\"197\">197<\/span>турам деп тура албады. Коңкойгон тумшугу этсиз купкуу терисине жабышып катып калгандай, таноолору кыпчылып бат-бат дем алат. Чекеси от менен жалын болуп, согушта курман болгон уулдарынын аттарын атап: Муса, Карып, Калый, Жакып деп кайталап, алар менен сүйлөшкөнсүп, күңүрттөнгөн добуш менен жөөлүй берди. Күйпөлөктөгөн кемпири чалынын жөөлүшүн жамандыкка жоруй, көзүнө жаш алып тынчы кетип"},{"t":"p","h":"Түшкө жакын врач келди, чалдын ден соолугун текшерип, ооруканага жатуусун талап кылды. Эки өпкөсүнө тең суук тийиптир, жатпаса болбойт. Врач ток этер жерин айтты..."},{"t":"p","h":"Эртеси чал доктурдун салган ийнесинен жаны жай алгандай шайдоот туруп, эшикке бет алды. Адатынча пейили бузулуп, тигинде турган эшегин токунуп, кайра үйгө кирип, турнаны үшүп калат дегениби, колтугуна кыса дагы көлүнө жөнөдү. Эшеги тушоордон жааган карды жиреп, жеткирчү жерине жеткирди да тык токтоду. Талип эшегинен түшүп, турнаны тигиндей уй чачкан саманга коюп, мелтиреп жаткан көлдү кубатсыз көздөрү менен көпкө ач көздөнө сугалактык менен карады. Көл тынч."},{"t":"p","h":"Ш"},{"t":"p","h":"Талип артында туяк калбаганына, жада калса тун баласы Мусадан болбогонуна кейиди. Ырас Муса аял алып келиндүү кылды. Алар балалуу да болушкан. Согуш аяктап, ошондо катуу алсырап шалдая түштү го эл. Анысы аз келгенсип катуу жер титирөө да болуп берди. Башынан өзүнчө жашаган келинин үч баласы менен там басып опат болушту. Айтпай турган жорукпу."},{"t":"p","h":"Чал титиреп кетти. Ооба, төртөөнүн өлүгүн жанаша коюшпады беле. Эми минтип тынчтык заманда сөөктөрү көрүстөндүн кайсы жеринде экени билинбей, көл астында калбасын деп боолголоп көрүн ачып, тиги көрүнгөн жаңы бейитке жашырып, кой союп, куран окутуп, оюнда арбактарын ыраазы кылды."},{"t":"p","h":"Талип сакалын мыжыга көзүнө күч келтирди, бирок жаш чыкпады. Денеден кубат качып, эти от менен жалын болуп денени тер кысты. Акылын жоготкондой дендароо <span class=\"pg\" data-n=\"198\">198<\/span>басып келип, муздак суудан даарат алып, намаз окуюн деди. Окуй албады. Ал эрксизден жантыгынан жантая кетти. Чүңүрөйгөн нурсуз көздөрү коюуланып, денеси чымырап улам оозу ачыла жанында турган турнага бир нерсе айткандай боло берди. Бирок анын үнү сыртка чыкпады. Жөн гана шыбырап жаткансыды. Төкөр көпкө козголбоду. Анын денесинен жылуулук качып, жүрөк кагышы акырындап баратты."},{"t":"p","h":"Талип төкөр небак эле уулдарына, неберелерине барып кошулган эле. Кар күчөп, айлана бозоруп, арты катуу борошого айланды. Денесин калчылдак баскан карт турна ээсин жоготкондой улам-улам куркулдайт. Алыстан атчан киши көрүндү. Тиги караан берилеген сайын кусасынан арылбай кеткен ээсин жоктоп, шордуу карт турна куркулдай берди, куркулдай берди... (А. Т.)"},{"t":"p","h":"157. Тең жана багыныңкы татаал сүйлөмдөрдү квтыштырып, моралдык-этикалык темада дилбаян жазгыла. Татаал сүйлөмдөрдүн грамматикалык түзүлүштөрү боюнча айырмачылыктарын байкагыла."},{"t":"p","h":"158. Өзүңөрдүн оозеки жана жазуу кебиңерде тең жана багыныңкы байланыштагы татаал сүйлөмдөрдү стилдик максатта орундуу колдоно билгиле."},{"t":"img","src":"data:image/webp;base64,UklGRqYLAABXRUJQVlA4IJoLAAAQNgCdASoOATsAPqVGmkmmJCKiN5j5yMAUiWkAFIP9zf5f8ffO/yGeqfc71ms1fVxqO/Kfuj+v/wHoz38/Ez+69QL2P/p/Qv+f7n3Y/9p6AvtJ9975rVx75frp6r/jd+I9517BH6m9Vn/O81H1p/6jbEdpwhajYu3+ZcrdZSSnvIiukgZQr56TfO2FO2qUeagJO2Hn7vi/Ciu0qIUmYbhaAeYT764h6PTgFrJtIJ6azkGDJJTqFo6j7+sMBe13GUyPgnjnZ5I6LEdK1NokR79IP2n0x8+n3NuGQDXudGZ/oITwveB36v9PWhGB70Z+fimQx+aMoEAOjt4FMIoM373mL5MWTPnFNFE4OjEPuntk7aW/1JstDq8F8rL82yXju8iBuLcQ4lrZP0K16UeytpJjDzwzDWNIGqRHeUiVgAeCImY5guh3pesN0z1b95GZdJUhy8o4y7YHFifaFPbhFmtqEpIT0OR68jNF4aAtzXJ72b/RxgNPfiVIPPTLty6OvYlHzQZLAapt6EcP5mEfVZAFGVJiHTpxvUp5KO+vINMWc2RiH1t2rWfX6MYbdmt2uOZhXqjvJTcCzAAA/tKwWqi+6Juo193D7j4HWIau4brNliTJXkOsOudNOC4dueEJMhcouVz2Wc7+odgBp6Edr5bWDSHEY2v0L4qx5YGWeIgCCuVv4Eyr7eZSh7WpesCKtZVKKXknnlTJUlzlrkzyhvQzOYB51liaov2UaQzJe2CSpgRwC9hIf9V9nPDq4o/GljPSFirAtsSHnQvD60zSY8hmbtjLA1Id9JjVgvNMAEci7cPzAr64MvzalFx1vh8gURZR8FVnBXviokrQsf0yQpN2n8i83FQCySLloFrHZy57aM7KGKopZ5sSx9QaWMkbyanaq4AwClmbrBY0/SBOsIQp6VtzJef7uWwxlUTO9vI35NvOXr6gCU2QwAvpSsXeyo6Hdb+Uv8t1OB/CKFkOqhmQIW7B3l16ipoxdROrkyMBpv+3VTz6OuGY6PTx5wcxKwKklLCYirjgQ0A00BefmRXcAKyiMQR03OV7fUIKpYEdrT+Y+g0qtJL+EYGOEUlRpxK/3850hokwS1UkSO2rxtuEPSXi . (Табышмак.)) Тен байланыштагы татаал суйлемдун синтаксис- › тик түгөйлөрүн байланыштырган байламталардын айрымдары өзүнөн мурунку сүйлөмгө, айрымдары өзүнөн кийинки сүйлөмгэ тиешелүү болот. Тыныш белгилери ошол орун тартибине карата коюлат. Мисалы: да, ‚ дагы байламтасы өзүнөн мурунку сүйлөмгө тиешелүү ‚ болуп айтылат, ошон үчүн үтүр андан кийин келет."},{"t":"p","h":"М и сал ы: Биринчи барып көр да, андан кийин ишен."},{"t":"p","h":"Калган байламталардын бардыгы өзүнөн кийинки жөнөкөй сүйлөмгө таандык болгондуктан, үтүр алардан мурда коюлат: Биз бардык, ал эми алар келишпейи."},{"t":"p","h":"160. Төмөнкү татаал сүйлөмдөрдөгү тыныш белгилеринин коюлушуна көңүл бургула. Накыл кептердин маанисин чечмелеп түшүнгүлө, жатка билгиле."},{"t":"p","h":"Жакшы адамдан – бак калат, жамандан – Ойдо так калат. Жерге айтсаң саламды, жер алдабайт адамды. Көздүн көргөнүнөн, кулактын укканы көп. Акылдууга алкыш айтсаң – алкыш аласың, акылсызга акыл айтсаң – шылдыңга каласың. Байдын кулу болгончо, байкуштун уулу бол. Акылдуу жыйырма жашта – башмын дейт, акылсыз элүү жашта – жашмын дейт. Жүктүн оорун нар көтөрөр, сөздүн оорун эр көтөрөр. Эл агасыз болбойт, суу жакасыз болбойт. Эрке бала жаңы кийимге сүйүнөт, жетим бала тойгонуна сүйүнөт. Жакшыга жанашсаң – максатыңа жетесиң, жаманга жанашсаң – адашып кетесиң. Жалкоонун үйүндө отун жок, соргоктун үйүндө тамак жок. Жаман киши ичкен-жегенин айтат, жакшы киши уккан-көргөнүн айтат. Кел канча терең болсо да – түбү бар, тоо канча бийик болсо да – төбөсү бар. Ийинге кол салганда, жыландын уусун эсте, гүлдү үзгөн кезде, тикени келсин эске. Көп кыйкыргандан коркпо, унчукпай <span class=\"pg\" data-n=\"200\">200<\/span>тургандан корк. Акмак менен тойго барганча, акылдуу менен таш ташы. Чегелеп жашаганча, какайып жүрүп өлгөн жакшы. Бир киши казган кудуктан, миң киши суу ичет. Сөз кылычтан өткүр, балдан таттуу. Жакшы адам ачык сүйлөйт, сөз тамырын казып сүйлөйт. Жаман адам сасык сүйлөйт, өзгөлөрдү басып сүйлөйт. Адептүү сылык сүйлөйт, амалкей былых сүйлөйт."},{"t":"p","h":"161. Төмөнкү тексттеги татаал сүйлөмдөрдүн тутумундагы жөнөкөй сүйлөмдөрдүн тыныш белгилерин койгула. Акылман ойлорду үйрөнүп, турмушуңарда колдонгула."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[199,200]},{"title":"АКЫЛМАН ОЙЛОР","blocks":[{"t":"h3","h":"АКЫЛМАН ОЙЛОР"},{"t":"p","h":"Ар түрдүү мүнөздөгү адамдар менен таанышып алардын пейил-куюн жакшылап үйрөнгүн. Алардын ар бирин сынап көргүн. Ошону менен сан досту душмандан жакшыны-жамандан билимдүүнү түркөйдөн чоңду-кичинеден айырмалай аласың. Эгерде ушундай кылсаң сен адамдардын тышкы көрүнүштөрүнөн алданбайсың. Алар менен жасаган мамилеңден сенин максатың айкын болот. Тегерегиңдеги адамдар бактылуу болушса сен дагы ага окшош бактылуу болуу үчүн тырышкын."},{"t":"p","h":"Кимде-ким куру сөз таратуучу жана бирөөдөн айып кемчилик издөөчү болсо ал эч кимдин дилине макул да төп да келбейт. Ал өзүнүн алтындай өмүрүн текке кетирет. Кимде-ким калайык-журтка кайрымдуу болбосо ал эл урматына эгедер болбойт мартабасы көтөрүлбөйт. Кимде-ким өзүн ысырапкерчиликтен чектебесе, тиричиликке көңүлкоштук менен ортозаар эки анжы жол тутса ал сөзсүз түрдө муктаждык отунда куурулат. Кимде-ким эзмеликтен, жалган сүйлөөдөн тыйылбаса эч ким анын сөздөрүн этибар албайт."},{"t":"p","h":"162. Бул татаал сүйлөмдөрдүн тутумундагы жөнөкөй сүйлөмдөр кандайча байланышып турат. Кандай тыныш белгилери коюлган? Акылман кеңештерди жатка билгиле жана колдонгула,"},{"t":"p","h":"Жолго кир сууну төгүүгө болбойт, же тебелендиге кирдин суусун чачпа. Жаман түшүңдү сууга айт, суу менен кетсин. Алыскы сапардан кайткан адамдын башынан үч жолу суу тегеретип, түкүртүп, идишин эшикке көмкөрүп <span class=\"pg\" data-n=\"201\">201<\/span>коёт. Жаш баланын салмагын айтып, татынакай дебе. Караңгыда шыпырынба, душманыңды көбөйтөсүң. Таң азандан турсаң, ырыскындан куру калбайсың. Балаңдын ыйманын жашынан тиле, чоңойгондо тилесең кеч болуп калат. Нанды тегеретип сындырбай, тең бөлүп сындыр. Караңгыда күзгү караба, чач тараса, жылдыз санаба. Алган чачыңды тебелендиге таштаба, мөмөлүү дарактын түбүнө көөмп кой. Чыныны чертпейт, казанды калдыратпайт. Эки кишинин ортосунан этпей жур, жыйылган жүккө жатпай жур. Чон жолдо жаткан буюмду алып, четке койсоң соопко каласың. Досуңдун үйүндө тырмак алба, касыңдын үйүнөн чач алдырба. Беймаал убакта оорулууну сурап барбайт, бала көрбөйт. Үйдө ышкырба, үй айланып чуркаба. Мурун кычышса – эт, кол кычышса – акча, бут кычышса – жол. Түшкө суу кирсе – өмүр, камчы – бийлик, бит, жылан – байлык, нан, тамак – дөөлөт, токчулук."},{"t":"p","h":"168. Жөнөкөй сүйлөмдөрдөн турган татаал сүйлөмдөрдү катыштырып, «Эне тили – менин дилим» деген темада дилбаян жазгыла. Анда жөнөкөй сүйлөмдөрдүн арасына коюлуучу тыныш белгилерди байкагыла."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[201,201]},{"title":"§ 54. ТИКЕ СӨЗДҮН ТҮРЛӨРҮ: ЦИТАТА, ДИАЛОГ. АЛАРДА КОЮЛУУЧУ ТЫНЫШ БЕЛГИЛЕР","blocks":[{"t":"h3","h":"§ 54. ТИКЕ СӨЗДҮН ТҮРЛӨРҮ: ЦИТАТА, ДИАЛОГ. АЛАРДА КОЮЛУУЧУ ТЫНЫШ БЕЛГИЛЕР"},{"t":"p","h":"Бөтөн сөз эч өзгөрүүсүз берилсе, тике сөз деп аталат. Мында башка бирөөнүн сезу автор тарабынан сөзмө-сөз берилип, анын мазмуну да, грамматикалык түзүлүшү да дал өзүндөй толук сакталат да тырмакчага алынып жазылат."},{"t":"p","h":"Цитата – (латынча – күбөгө тартуу) өзүнүн пикирин түшүндүрүү жана бекемдөө үчүн башка бир автордун чыгармасынан өтө чакан үзүндү же бирөөнүн кыска сөзүн пайдалануу. Цитатаны өз орду менен ыктуу пайдалануу зарыл."},{"t":"p","h":"Цитата – тике сөздү пайдалануунун бир ыкмасы. Цитатанын тыныш белгилери тике сездегудей, бирок төмөнкүдөй айырмачылыктар бар: Айрым учурда цитата түзүлүшү жагынан төл сез менен байланышып, анын"},{"t":"p","h":"201 <span class=\"pg\" data-n=\"202\">202<\/span> бир бөлүгү катары колдонулат. Анда ал тырмакчага ‚ алынып, андан мурун кош чекит коюлат, кичине тамга ‚ менен жазылат."},{"t":"raw","h":"<div class=\"gloss\"><p>азы. – ——————4—<\/p><\/div>"},{"t":"raw","h":"<h4 class=\"mk\">(((<\/h4>"},{"t":"v","l":["Мисалы: Элибизде мындай макал кёп кезигет;","‚ «Жигитке жетимиш өнөр аздык кылат».","Айрым учурда цитата толук колдонулбаса анда"]},{"t":"p","h":"‹ калтырылып кеткен сөздүн орду көп чекит менен бел-"},{"t":"v","l":["‚ гиленет, кээде цитатанын баш жагы калтырылса же"," кыскартылса анда абзац көп чекит менен башталат.","Диалог (грекче – сүйлөшүү, ангемелешуцу) эки же"]},{"t":"p","h":"' андан ашык адамдардын өз ара оозеки сүйлөшүүсү, аң-"},{"t":"v","l":["! гемелешүүсү. Көркөм чыгармадагы диалог каармандын"," кебин мүнөздөөнүн эң кеңири түрүнөн болуп саналат."," Диалог бардык жанрдагы чыгармаларда бар, өзгөчө ал"]},{"t":"p","h":"‚ драмада окуяны өнүктүрүүнүн каражаты катары кол- ‚ донулат. Диалог бардык турмуштук кырдаалдарда ке-"},{"t":"v","l":["! зигип, оозеки кепти өнүктүрүүнүн негизги каражаты","‚ катары саналат.","Мисалы:","– Айдай, сен бош убактыңды кандай өткөрөсүң?","– Китеп окуйм, эс алам.","– Кандай китептерди окуйсуң?","– Ар кандай кызыктуу китептерди.","– А өзүң кандай өткөрөсүң?","– Менде бош убакыт деле болбойт.","– Китеп акуйсуңбу?","– Окуйм, албетте, ара-чолодо убакыт табам."]},{"t":"p","h":"Диалог жаңы саптан башталып жазылып, алдына ‘ сызыкча коюлат. Айрым учурда бир нече кишилердин диалогу болушу мүмкүн."},{"t":"p","h":"164. Төмөнкү текстти окуп чыккыла, андагы диалогдун курулушуна карап, диалог кандай кырдаалда өтүп жатканына жана анын тыныш белгилерине байкоп жүргүзгүлө."},{"t":"p","h":"Ат-Башы районунун Жаңы-Күч айылында Айты аттуу санжырачы адам жашап өткөн. Ал жаш кезинде жолоочулап баратып чоочун аймактагы жалгыз үйгө туш болот. Учурашып, үйгө киргенден кийин келин күйөөсүнө бир нерселерди шыбырайт да, алдыларына бир аяктан жарма коюп кетет."},{"t":"p","h":"– Ээ, Күлүмкан, акем келип калыптыр, казан ас,— деп кыйкырат күйөөсү."},{"t":"p","h":"<span class=\"pg\" data-n=\"203\">203<\/span>– Азыр,— деп коюп, Күлүмкан өз ишин жасай берет. – Күлүмкан, чый-пый кыла койсоң боло!? – деп күйөөсү дагы үн салат."},{"t":"p","h":"– Азыр,— дейт да Күлүмкан дагы эле өз ишимен алектене берет. Күйөөсү андан кийин да бир нече жолу кыйкырат."},{"t":"p","h":"– Азыр, азыр,— дей берет Күлүмкан кебелбей. Акыры тажашканда Айты аттанмакчы болот."},{"t":"p","h":"– Кап, тамак иче кетсеңиз болбойт беле?! – деп үй ээси сыпайгерчилик кылат да, аттандырып коёт. Көрсө, алардын колунда чынында эле эч нерсе жок кембагалдар тура. Күлүмкандын акылы менен тамак ас деп опулдай бериптир күйөөсү калп эле. Айты болсо айылга: – Күйөө бала ченде жок даалдаган жобмарт жигит энденет. Кептин баары жанагы кесип алса кан чыкпаган өзүбүздүн карындашта экен,— деп келиптир. (Ы. К.)"},{"t":"p","h":"165. Төмөнкү тексттеги диалогдун курулушуна жана анын тил каражаттарына көңүл бургула, диалогдун түзүлүш тартиби жана тыныш белгилери кандай, тексттин мазмунун кунт коюп түшүнгүлө."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[202,203]},{"title":"КАРТӨШКӨ","blocks":[{"t":"h3","h":"КАРТӨШКӨ"},{"t":"p","h":"‚.. – Кана, балдар сюжет деген эмне? – адабият мугалими бирөөнү эркелетип жаткансып, жумшак сүйлөдү."},{"t":"p","h":"«Агай-агай, мен айтам! Мен айтам агай! Агай-агай..."},{"t":"p","h":"– деп, биринен бири озунуп шаша баштады балдар."},{"t":"p","h":"– Кана, сен айт."},{"t":"p","h":"Мурат капканга түшкөн калтардан бетер алдастай түштү да, соңунан чийкил иреңи анардай кызарып чыкты."},{"t":"p","h":"– Тиги... Сюжет болсо... Ал... – Акырында биротоло жооп бере албай шылкыйып туруп берди."},{"t":"p","h":"Муну көргөн балдар: «Мен айтам... Мен айтам...» – деп чуру-чуу түштү. А агай Мураттын куулугун кармаганына ууртунан жылмайды. Анан баланы тамашалагысы келди: – Сюжет желеби, же желбейби? – деп сурап калды. Муну укканда Мураттын көздөрү кыбындап, саал жандана калды: «Ал... ал... сүжет болсо...» – Деди ке-"},{"t":"p","h":"203 <span class=\"pg\" data-n=\"204\">204<\/span>кечтенип. Эми тобокелге салып «желет», же «желбейт» деши керек эле, А балким, туура чыгып калар. Туура чыгып калса жакшы баа алып калышы ажеп эмес. А жаңылып калса – «бая ала жүргөн эки» эч кайда качпайт."},{"t":"p","h":"– Желет, – деди кыйды Мурат тобокелге салып. Анан агайын кантээр экен дегендей элейип карап калды."},{"t":"p","h":"– Ту-ура-а. – Аганы мостоюп туруп кадимки олуттуулугу менен баш ийкеди."},{"t":"p","h":"Балдар буга аң-таң калышты. Бирде Муратты, бирде агайды карашты."},{"t":"p","h":"– Туура, жейбиз! – деди агай тигинин жообун ого бетер ырастап. Муну көргөн Муратта «туура айткан экемин» деген сокур ишеним пайда боло калды."},{"t":"p","h":"– Аза-ма-ат, Мурат. Агай тигинин алиги жообуна ыраазы болгондой тур керсетту."},{"t":"p","h":"– Кана, эмнеге кошуп жейбиз?"},{"t":"p","h":"Мурат бир аз ойлоно калып дагы тобокелге ооду:"},{"t":"p","h":"– Картешкеге..."},{"t":"p","h":"Жанатан бери күлкүсүн зорго тыйып араң турган агай тарс жарылды. Иштин жайын түшүнгөн балдар боорун тытып күлүштү... Ошондон кийин жалкоо Мурат «картошке» атка конуп кетти. (О. А.) 166. Досуңар, классташыңар, ини-карындаштарыңар менен ар кыл темада диалог куруп сүйлөшкүлө."},{"t":"p","h":"167. Көркем адабий чыгармалардан диалог түрүндөгү тексттерди жыйнап чогултуп, диалог түрүндө сүйлөшүүгө: аңгемелешүүгө, маек кебин кура билгенге машыгып, оозеки кебиңерди байыткыла."},{"t":"p","h":"168. Улуу ойчулдардын, акылман, даанышмандардын, окумуштуулардын айтып кеткен накыл, нуска, насаат ойлорунан цитаталарды жыйнагыла, аларды оозеки сүйлөшүүлөрдө жана жазуу жумуштарында орундуу пайдалана билгиле."},{"t":"p","h":"169. Ар кыл цитаталарды колдонуу менен тандаган Темаңар боюнча дилбаян жазгыла. Цитатаны колдонууда андагы тыныш белгилерди орду менен туура коё билгиле."},{"t":"p","h":"Эскертуу: Сүйлөмдө бетен сөздөр эч өзгөрүүсүз ошол калыбында да, грамматикалык түзүлүшү боюн- (ча өзгөрүп да колдонула берет. Мына ушул өзгөчөлүктөрүнө <span class=\"pg\" data-n=\"205\">205<\/span>байланыштуу алар тике жана кыйыр сөз болуп, экиге бөлүнөрүн эсиңерге салгыла."},{"t":"raw","h":"<div class=\"gloss\"><p> <\/p><\/div>"},{"t":"p","h":"Мисалы: 1. «Кыялсыз адам – канатсыз куш», дейт. кыргыз элинде. 2. Илгертен кыргыздар кыялсыз адамды канатсыз кушка салыштырып келишкен."},{"t":"p","h":"Биринчи мисалда бөтөн сөз эч өзгөрүүсүз берилди, =ч. ЧИ чү с елы» ЧЕЧ ШР ЫЧ че =н К че че кч: ш е ыы ый ошондуктан аны тел сөздөн ажыратуу үчүн тырмакча- жактан биригип, жуурулушуп кеткен, ошол себептүү ал сүйлөмдө эч кандай тыныш белгиси аркылуу ажы- ратылбайт. Демек, тыныш белгилердин коюлушу анын биринчи учуруна (тике сөздө) гана тиешелүү болот да, экинчи учурда (кыйыр сөздө) анын жазылышы кадыре- се сүйлөмдөрдөн эч айырмаланбайт. жана анын ортосунда да, кээде эки жагында тең колдо- нула берет. Мына ушуга байланыштуу аларда коюлуучу тыныш белгилер да түрдүүчө болот. ныш белгилерди керсеткен схемаларга көңүл бургула. Ал эми тике сөз төл сөздөн мурун да, кийин да Төмөндө бөтөн сөз жана анын түрлөрүнө, андагы ты- [БӨТӨН СӨЗ га алынып, үтүрлүү сызыкча коюлду. Ал ами экинчи суйлемде бетен сөз тел сөз менен грамматикалык"},{"t":"p","h":"2 [Цитата |—— Кыйыр о "},{"t":"p","h":"в Диалог"},{"t":"v","l":["1. Цитатада коюлуучу тыныш белгилер:","","П. Диалогдо коюлуучу тыныш белгилер:","1. тиын 'Т'; а. Т,— а."]},{"t":"p","h":"Схемада берилген тыныш белгилерди мисалдар аркылуу теменкудей туюндурууга болот:"},{"t":"p","h":"<span class=\"pg\" data-n=\"206\">206<\/span>Г. 1. Кыргыздарда мындай макал бар: «Уят – (өлүмдөн катуу». 2. «Уят – өлүмдөн катуу», – деген макал бар кыргыздарда. 8. Кыргыздарда: «Уят – өлүмдөн катуу»,— деген макал бар. 4. «Китеп,— деп айткан (В. Белинский,— билим алуунун булагы». 5. В. Белин- ‚ ский: «Китеп, – деп таамай айткан, – билим алуунун булагы»."},{"t":"v","l":["П. 1. – Кайсы Каныбек?","– Биздинчи. Штанга көтөргөн.","– Аа. Осмоналиевби?","2. – Ооба, – деди жигит анча түшүнө бербей."]},{"t":"p","h":"170. Схема боюнча буларды айтып бергиле: а) төл сөз менен бетон сөздүн өз ара орун алуу багыты; б) ошого байланыштуу тыныш белгилердин коюлушу; в) тике сөздүн түрлөрү боюнча андагы тыныш белгилердин коюлуш өзгөчөлүктөрү. Өзүңөр алгачкы терт схеманын үстүндө сүйлөм түзгүлө. Бир эле сүйлөмдү пайдалансаңар болот."},{"t":"p","h":"171. Тексттеги тике сөздөрдү түрлөргө (цитата, диалог) ажыратып, тиешелүү тыныш белгилерди койгула. Тике сөздүн арбир түрүнө карата тел сөздүн колдонулуш өзгөчөлүгүн түшүндүргүлө. Тексттеги тике сөздер стилдин кайсы түрүнө кирерин жана андагы мүнөздүү белгилерди айтып бергиле."},{"t":"p","h":"1. Көп сүйлөгөндүн баары билимдүү эмес, төп сүйлөгөн билимдүү дейт элибиз. 2. Кам санабаңыз, аксакал, мен да кичине эмесмин, ардемени көрүп калбадыкпы."},{"t":"p","h":"3. Аның дурус, эмесе, билип ал, аты Гүлсары, Гүлсары?"},{"t":"p","h":"Ооба. Былтыр жайлоодо небере кызым коюп кеткен Гүлсары атын өчүрбө, балам деди Танабай. (Ч. А.)"},{"t":"p","h":"4. Билимдин коомдогу маанисине чоң баа берип, М. Горький мындай дептир билимден кубаттуу күч жок. Элдик оозеки чыгармалар жөнүндөгү өзүнүн сөздөрүнүн биринде Ч. Айтматов «Манас» эпосу – элдик оозеки мурастардын туу чокусу дегени бар. Тыянак чыгара турган максатты көздөгөн акын дейт Г. Гёте баарынан мыкты акын. Ал сөзүнүн аягын мындайча бүтүрдү Силер биздин келечегибизсиңер! Силерден, жаштар, элибиз, мекенибиз айкын максаттуулукту, жигердүүлүктү жана сезимталдуулукту күтөт! А. С. Пушкин Ата Журттун өткөнүн сыйлабоо, кадырлабоо – анын артта калгандыгы жана адепсиз караңгылыгы деп эскерген."},{"t":"p","h":"<span class=\"pg\" data-n=\"207\">207<\/span>172. Төмөнкү улуу адамдардын айткандарын тике сөз катары пайдаланып, сүйлөм түзгүлө. Ал тике сөздөрдү төл сөздөн мурун да, кийин да, ортосунда да жайгаштыргыла жана тиешелүү тыныш белгилерин койгула."},{"t":"p","h":"1. Эмгек – ар кандай дарттын дабасы. Эмгектен өткөн ырыс жок. (Н. О.) 2. Китеп – биздин доордун күзгүсү. (Б. Б.) 3. Талбас эмгек гана тоодой тоскоолдукту жеңе алат. (М. Л.) 4. Эне сүтүн актоо – өмүр бою кутулгус карыз. (Н. О.) 5. Турмушту ак ниеттиктен артык эч нерсе көркүнө чыгара албайт. (Л. Т.) 6. Абийириңди жашыңдан сакта. (Макал.)"},{"t":"p","h":"Үлгү:"},{"t":"p","h":"«Адал эмгек абийир таптырат»,— деген макал бар кыргыз элинде. Кыргыздарда мындай макал бар: «Адал эмгек абийир таптырат». Кыргыздар: «Адал эмгек абийир таптырат» – деп эң таамай айткан."},{"t":"p","h":"173. Текстти окуп, андагы айтылган ойго жана сүйлөмдөрдүн курулушуна маани бергиле, аны диалог түрүндө өзгөртүп түзгүлө. Андагы тел жана бөтөн сөздөрдү ажыратып, тиешелүү тыныш белгилерин койгула. Мындай текст стилдин кайсы түрүнө кирет?"},{"t":"p","h":"Тээтетигичи анын артында балбылдап турган жылдызчы? Кайсы? Мобу топтошконучу дейм. Атам колун серепчилеп минтет тигил “етиген Үч Аркар дейт мобу кырка оңкосунан турганды Үркөр деген мобу топ жылдыз. Тээтиги жактан карачы. Бүлбүлдөп турабы ошондо бир жылдыз? Кана? Көргөнүм жок деп чыркырайм. Мына, мындай кара. Мен кол сунган жакты деп сөөмөйүн серейтет. Кайда ушундайбы? Ооба колумдун башын кара. И-и ошент көрдүңбү? И-и көрдүм көрдүм тигинде турат дейм кубанып. Ошол Алтын казык. Анын казыгы кана? Казыгы жок. Жөн эле ошентип атап коюшкан дейт атам. Ким ошентип атап койгон? Илгери бабаларыбыз. Бабаларыбыз? Ооба. (Н.Б.)"},{"t":"p","h":"174. Окугула, андан тел жана бетен сездерду ажыраткыла. Тиешелуу тыныш белгилерин койгула жана алардын коюлуш эрежелерин айтып бергиле."},{"t":"p","h":"5, 6, 7, В, 11-суйлемдердегу тел жана бетон сөздөрдүн өз ара орун алуу багытын, андагы коюлуучу тыныш белгилерди схема аркылуу бергиле."},{"t":"p","h":"<span class=\"pg\" data-n=\"208\">208<\/span>каттайсыз деди, б. Ар кандай. Чеги Тогуз-Торо деди шо- Га Жакындап калды. 5. Көптөн кийин ал кайсы жерге пур. Т. Жакшы деди ал кайдыгер, (Б. У.) 8. Адеп"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[204,208]},{"title":"10-КЛАССТА ӨТҮЛГӨН МАТЕРИАЛДАРДЫ БЕКЕМДӨӨ ЖАНА БЫШЫКТОО","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"209\">209<\/span>10-КЛАССТА ӨТҮЛГӨН МАТЕРИАЛДАРДЫ БЕКЕМДӨӨ ЖАНА БЫШЫКТОО"},{"t":"h3","h":"&amp; 55. ҮНДҮҮ ТЫБЫШТАРДЫН БИР СӨЗ ИЧИНДЕ ЖАНА ЭКИ СӨЗ АРАЛЫГЫНДА ТЫБЫШТАРДЫН"},{"t":"p","h":"ӨЗ АРА ТААСИРИ АРКЫЛУУ АЛГА КАРАЙ ЭЭРЧИП"},{"t":"h3","h":"АЙТЫЛЫШЫ ЖАНА ЖАЗЫЛЫШЫН БЫШЫКТОО ҮЧҮН КӨНҮГҮҮ ИШТЕРИ"},{"t":"p","h":"Кайталоо үчүн суроолор:"},{"t":"p","h":"1. Үндүү тыбыштар кандай учурда бир сөз ичинде тыбыштардын эз ара таасири аркылуу алга карай ээрчишип айтылат?"},{"t":"p","h":"2. Үндүүлөрдүн алга карай ээрчип айтылышы уңгу сөздө учурайбы же туунду сөздөргө тиешелүүбү?"},{"t":"p","h":"3. Үндүүлөрдүн алга карай ээрчиши тыбыштардын айтылышындагы жаактын ачылышына же эрин күүсүнө байланышы барбы? Алардын үндөштүк законуна тиешеси кандай?"},{"t":"p","h":"175. Төмөнкү текстти окуп чыгып, андагы кара тамга менен басылган сөздөрдү терип жазып алып, бир сөз ичинде үндүүлөрдүн алга карай ээрчигендигин жана алар кандай таасирден улам өзгөрүүгө учурагандыгын айтып бергиле."},{"t":"h3","h":"СЕН ДА ТАЛАНТ БОЛУП ЖҮРБӨ?"},{"t":"p","h":"Чын эле адамдар өздөрүнүн дээри, жендему, акыл мүмкүнчүлүгү боюнча асман менен жердей айырмаланып турушабы? Жаратылышынан тубаса түрдөгү акылсыз, акылдуу, жөндөмсүз, жөндөмдүү, жетик жана жетесиз адамдар болобу? Ойлонуп көрсөк, илим менен турмуштун тажрыйбасы буга бөлөкчө жооп берет. Илимий изилдөөлөр жогорудагыдай ажыратып бөлүүлөрдүн туура эмес, тескери көз караш экендигин ашкерелейт."},{"t":"p","h":"<span class=\"pg\" data-n=\"210\">210<\/span>Эстеп көрчү, атактуу гений Ломоносов жөнөкөй эле балыкчынын уулу эмеспи. Атагы таш жарган жазуучу Достоевский болсо жарыбаган дарыгердин баласы болгон. Ал эми жергебизге келсек мынабу кыргыздын көрүнүктүү акын-жазуучуларынын бардыгы тең кечээки эле бут алдында тепселип келген чор таман кедейлердин балдары эмеспи. Мындай мисалдарды жүздөп, миңдеп келтирсе болот."},{"t":"p","h":"Ырас, элдин баары А. Эйнштейн, П. Колмогоров, Ю. Лермонтов же Саякбай болуп төрөлбөйт. Бирок таптакыр эч нерсеге жөндөмү жок болуп да эч ким төрөлбөстүгүн илим далилдеп жатат. Адамдардын бардыгы тең тереңде уюп жаткан эбегейсиз чоң мүмкүнчүлүктөр өсүп-өнүгүүгө, өркүндөөгө, «канат күүлөп учууга» чоң жөндөм менен төрөлөт. Ошондуктан биздин ар бирибиз төрөлгөнүбүздөн, кичинеден генийбиз деген сөз бекеринен айтылбайт. Эски убакта жазылган бир китептин автору «бардык адамдар – генийлер», себеби ар бир адам бирөөдөн бир нерсеси менен артыкчылык кылат деп түз айтат. Адамдардын бардыгы, албетте, бирдей эмес. Биз өзүбүздүн шык-жөндөмүбүз, кулк-мүнөзүбүз, дененин чыңдыгы боюнча бири-бирибизден айырмаланабыз. Бирок биздин ар бирибиздин алга арыш керип көкөлөп өсүүгө, жаратууга, түзүүгө, ачылыштарды жасоого мүмкүнчүлүгүйүз бар."},{"t":"p","h":"Ошентип, иним, менин ишенимимде сен бул дүйнөгө таланттуу жаралган өзүңчө жаткан түгөнгүс кенчсиң. Канча адамдар өзүнүн чөгүп жаткан кенч экенин билбей өзү менен кошо зор мүмкүнчүлүктү кошо көтөрүп жүргөнүн байкабай бул дүйнөдөн «дың» бойдон өтүшөт. Ойлоп алып кейийсиң, кечээки илим-билимсиз мүңкүрөгөн турмуштун колу-бутту тушап, канатты кайрыган коомдун айынан канча ала-тоолук таланттын оргуган күч-кубаты алмадай баш менен жер алдына кошо кетти. Канча саякбайлар, сагымбайлар, канча токтогулдар, карамолдолор караңгы турмуштун катмарында дайынсыз калды. Эгерде мындан мурда жер үстүндө жашап өткен адамдардын көбү жогоруда айтылгандай өз мүмкүнчүлүгүнүн жок дегенде жарымын эле толук пайдаланууга үлгүрүп өткөн болсо, анда адамзат цивилизациясы азыркы деңгээлинен алда канча алдыда турмак. (С. Байг.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"211\">211<\/span>Үндүүлөрдүн алга карай ээрчишип өзгөрүүсү көбүн- ' че уңгуга жалганган мүчөлөрдө, тактап айтканда, жендеме таандык, көптүк идеяны билдирүүчү зат атоочтун мүчөлөрүндө жана сын атооч, этиш, сан атооч сөздөрдүн мүчөлөрү жалганганда ишке ашат. Мындай алга карай ээрчип өзгөрүү бир гана жактама ат атоочту ‚ жөндөгөнүбүздө, ал барыш жөндөмөдө алга карай ээрчибестен, артка карай өзгөрүп айтылганын жана жазылганын көрөбүз."},{"t":"p","h":"Арийне, ар бир тилдин атайын иштелип чыккан орфографиясы, орфоэпиясы ошол тилдин өзүнө мүнөздүү болгон ички мыйзамченемдуулуктеруне баш иет эмеспи. Алсак, кыргыз тилиндеги уңгу же негиз сөзгө сөз мүчөлөрү уланганда, алар чогуу жазылып, (айтылып) сөздүн акыркы муунундагы үндүү тыбыштын таасири менен уланган мүчөнүн үндүү тыбышы да өзгөрүүгө учурайт. Мындай көрүнүштү үндүүлөрдүн бир сөз ичинде алга карай ээрчип айтылышы дейбиз."},{"t":"p","h":"М исалы: -чы мүчөсү сөзгө уланганда: мал + чы малчы, окуу + чы окуучу, өтүк + чы өтүкчү."},{"t":"p","h":"Үндүүлөрдүн мындай өзгөрүүсү жөндөмө таандык, көптүк жана этиштин формаларын билдирүүчү ‚ мүчөлөр сөзгө уланганда көрөбүз. Адатта, аларды орфографиянын фонетикалык принцибине таянып, өзгөрүп айтылышы боюнча жазып жүрөбүз."},{"t":"p","h":"176. Барыш {-га), чыгыш (-дан) көптүк маанини билдирүүчү (-лар) мүчөлөрү канча вариантка ээ, Алардын ар бир вариантына ылайык келүүчү сөздөрдү келтирип сүйлөмдөрдү түзгүлө."},{"t":"p","h":"М и сал ы: Алымга, Болотко, Айгеримге, Айгулге жакшы окугандыктары учун Ардак грамоталар тапшырылды."},{"t":"p","h":"177. Ырды окуп, анда кайсы сөздөрдө үндүүлөрдүн алга карай ээрчишип, өзгөрүп кеткендигин жана ал үндүүнүн алгачкы варианты кандай болгонун айтып бергиле."}],"sub":[{"title":"АЙТЫЛЫШЫ ЖАНА ЖАЗЫЛЫШЫН БЫШЫКТОО ҮЧҮН КӨНҮГҮҮ ИШТЕРИ","b":3},{"title":"СЕН ДА ТАЛАНТ БОЛУП ЖҮРБӨ?","b":9}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[209,211]},{"title":"ӨМҮРДҮ ОЙЛОО","blocks":[{"t":"h3","h":"ӨМҮРДҮ ОЙЛОО"},{"t":"v","l":["Жетелек өмүрүмдүн теңине","Качан келдим коркунучтуу жээгине.","Окшоп кетет тиши сынган аскалар","Жүрөгүмдүн жараланган жерине.","<span class=\"pg\" data-n=\"212\">212<\/span>Муктаж болуп өмүрүмдүн муңуна","Качан келдим учугу жок учуна?","Тургунбайлап ажал сайрап жаткансыйт,","Келип алар тереземдин тушуна.","","Жаш өмүрүм шамал менен жарышкан,","Жаны тынбай жагалмайдай жаңы учкан.","Сакташ үчүн өрттө калган жашоосун,","Өлбөстүктүн ырын улам угузган.","","Мени ойносо өлүм деген кумарчы","Сок жүрөгүм, өмүргө – өмүр улачы.","Саналбаган сан жылдыздан жымыңдап,","Көздөрүмө жансын жашоо кубанчы.","","Кайрат ырын окуп берип алсызга,","Кайгырбадым катуу өткөн турмушка.","Мага алмашпайт өмүрүн да өлүмүн","Жук көтөрүп жолдо жүргөн кумурска. (Т. Э.)"]},{"t":"p","h":"178. Орфографиялык сөздүктү пайдалануу менен төмөнкү сөздөрдүн кайсынысы туура, кайсылары туура эмес жазылгандыгын тактагыла."},{"t":"p","h":"Көрүмдүк, эсиринки, ыргычта, ыргышта, эштеке, эчтенке, айкара, айкала, жаңгыз, карлыгач, кардыгач, кыйбат, кымбат, мылтык, мынтык, сөөлжан, жеелжан, теңшерүү, текшерүү, улуксат, уруксат, айыгышуу, айгышуу, нокто, окто, насыбай, асман, чайыттай, чайттай, айза, найза, ноопаз, оопаз, ыгыр, ныгыр, айтор, айтоор, былтыр, былтыры, бүкүл бойдон, бүкүлү бойдон, барыктуу, барктуу, жаңылмач, жаңылтмач, парда, барда, пейил, бейил, балчык, балкыч, мобу, мынабу, обон, абен. 1Т9. Берилген сүйлөмдөрдөн ташымалдап жазууга болбой турган сөздөрдү таап, аларды төмөнкүчө бөлүштүрүп жазгыла:"},{"t":"p","h":"1) бир муундан турган сөздөр; 2) эки муундан турган сөздөр; 3) бир мууну йоттошкон тамгалар менен берилип, бирок ташымалдап жазууга болбой турган сөздөр. Бул сөздөрдү эмне үчүн ташымалдоого болбой тургандыгын айтып бергиле."},{"t":"p","h":"1. – Ооба, байчечекей жайнаган көктөмдө жаңыдан гана кош чыгарган мезгил эмес беле. Күн тийбеген кемерлерде күрткүлөр али да жондонуп бугуп жаткан. Анткен <span class=\"pg\" data-n=\"213\">213<\/span>менен төмөнтөн сары жел жүрүп, топурак тоборсуп, чөп кылтыйып, жаз иши улам илгерилей берген. (Ч. А.) 2. Суунун астында бегелген баягы казандай таштар эми сыртка чыгып, алардын үстүнө жапжашыл, сапсары тукаба өңдүү эңгилчектер оюу жүргүзгөн. (Ч. А.) 3. Эгерде уят болбосо, кече менен жүгүрүп да кетер але."},{"t":"raw","h":"<div class=\"gloss\"><p>212<\/p><\/div>"},{"t":"p","h":"4. «Бербейм, тезекти мектепке алып барам! Коё бер мени, коё бер!» – деп чаңырып жаттым."},{"t":"p","h":"5. Өрүштөгү жылкыны айдап келиш үчүн бая эле кишилер кетишкен, аксакал! – деди Самтыр."},{"t":"p","h":"6. Азыр асман тунук, аба суюк, кез жеткен жер даа- Т. Эки жүзгө жакын кою, үч ую, алты аты, бир төөсү бар эле."},{"t":"p","h":"8. Сыя менен жазыңыз."},{"t":"p","h":"9, Балдардын көздөрүн кызартып, капталдагы кызыл чие мөлтүрөйт."},{"t":"p","h":"10. Бизден улуу адам экен, ач болбосо таап берейин деген кепке келсе болобу?"},{"t":"p","h":"11. Күү чертилип бүткөндөн кийин, кичине дем алууга тарашты. Атай менин жаныма комузун кармай келип отурду."},{"t":"p","h":"12. Биздин айылга ушундай үйдөн дагы экөө-үчөө салынып кеткен экен."},{"t":"p","h":"13. Мектеп жаңы окуу жылына толук даяр. (К. Б.)"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[212,213]},{"title":"&amp; 56. ҮНСҮЗ ТЫБЫШТАРДЫН БИР СӨЗ ИЧИНДЕ ЖАНА ЭКИ СӨЗ АРАЛЫГЫНДА ТЫБЫШТАРДЫН ӨЗ АРА ТААСИРИ АРКЫЛУУ АЛГА ЖЕ АРТКА КАРАЙ ЗЭРЧИП АЙТЫЛЫШЫН, ","blocks":[{"t":"h3","h":"&amp; 56. ҮНСҮЗ ТЫБЫШТАРДЫН БИР СӨЗ ИЧИНДЕ ЖАНА ЭКИ СӨЗ АРАЛЫГЫНДА ТЫБЫШТАРДЫН ӨЗ АРА ТААСИРИ АРКЫЛУУ АЛГА ЖЕ АРТКА КАРАЙ ЗЭРЧИП АЙТЫЛЫШЫН, ЖАЗЫЛЫШЫН БЫШЫКТОО ЖАНА АГА КӨНҮГҮҮ ИШТЕРИ"},{"t":"p","h":"Үнсүз тыбыштар бир сез ичинде да, эки сөз аралыгында да башка тыбыштардын таасири менен алга карай да, артка карай да ээрчип, өзгөрүп айтыла берерин төмөнкүдөй фактылар аркылуу эске салгыла:"},{"t":"p","h":"1. Уңгу сөздүн (негиздин) аягы н тыбышы менен аяктап, ага к, г, б, м тыбыштары менен башталган <span class=\"pg\" data-n=\"214\">214<\/span>мүчөлөр уланса, н тыбышы кайсы тыбышка өтүп, кандайча айтылат жана кандай жазылат? Мисалдарды келтиргиле:"},{"t":"raw","h":"<div class=\"gloss\"><p>на.<\/p><\/div>"},{"t":"p","h":"2. Эгерде сөздүн аягы ч, з тыбыштары менен аяктап, ага уланган мүчөлөр с, ч, т тыбыштары менен башталса, ал сөздөрдүн айтылышы жана жазылышы кандай болот? Мисалдарды келтиргиле."},{"t":"p","h":"3. Жанаша айтылган сөздөрдүн биринчиси к, п үнсүздөрү менен аяктап, кийинки сөз үндүү менен башталса, алгачкы сөздүн аягындагы к, п тыбыштары кандайча айтылат да, жазууда кандайча болот? Мисалдар келтиргиле."},{"t":"p","h":"4. Удаа айтылган эки сөздүн мурункусу н, з, л, м, р, й тыбыштары менен аяктап, кийинки сөз к тыбышы менен башталса, ал сөздөрдүн кайсы жеринде өзгөрүү болот же каткалаң ң тыбышы жумшарып айтылат. Жазууда алардын кайсы абалы сакталат? Мисалдар келтиргиле."},{"t":"p","h":"180. Төмөндө келтирилген текстти окуп чыгып, андагы үндүү жана үнсүз тыбыштардын ээрчишип, өзгөрүп айтылышына көңүл бургула. Ал сөздөрдү терип жазып алып, орфоэпиялык жана орфографиялык талдоо жүргүзгүлө."},{"t":"h3","h":"КУРМАНЖАН ДАТКА"},{"t":"p","h":"1832-жылы 21 жаштагы Курманжанга баргы уруусунун бийи катары жана Кокон бийликтерине кызмат кылып, датка деген наам алган, элге билгилиги менен маалым Алымбек датка кокусунан жолугуп сөз салат, андан көп узабай экөөнүн тагдыры кошулгандыгы тууралуу кеп угулат."},{"t":"p","h":"Ошол күндөн баштап, Курманжан өз чөлкөмүндө гана эмес, күчтүү мамлекет болуп эсептелген Кокон бийликтеринин иш-аракеттерине күйөөсү Алымбек датка менен катар аралаша баштайт. Курманжан күйөөсү Алымбек датка Кокондо мамлекеттик бийлик кызмат аткарып жүргөндө анын ордунда билгилик менен элин башкарган. Ал эми Алымбектин мамлекеттик иштеринде акылман кеңешчи катары тынбай өз ойлорун ортого салып турган."},{"t":"p","h":"Алымбек менен Курманжан 29 жыл бирге өмүр сүрүшүп, ошол кездеги аз сандуу жоокери болгон кайраты <span class=\"pg\" data-n=\"215\">215<\/span>мол кыргыз элинин бир канатына кам көрүп отурушту. 1861-жылы Алымбекти кас душмандары Кокондо өлтүрүп кетишкенде, тагдырдын соккусуна мүңкүрөп отуруп калган эмес. Тескерисинче, күйөөсүнүн бийлигин улантып, өзүнүн көсөмдүгү жана дипломатиялык жөндөмдүүлүгү менен Алайдын гана кыргыздарына эмес, Ффергана өрөөнүнө даңктуу башкаруучу катары таанылган."},{"t":"p","h":"1862-жылы Кудаярды зкинчи жолу такка отургузуу маалында, ага таяныч табуу ишенимде Ошко Бухара эмири Музаффар келет. Ал ошол мүдөөсүн ишке ашыруу менен бирге Алымбек датканын ордуна бирөөнү дайындап, ага «датка» деген наамды ыйгарып кетүү назипасын да аткарып кетүү керек эле. Бул орунга Музаффар Алымбек датканын улуу уулу Жаркынбайды сунуштайт. Бул даражаны алуудан Жаркынбай караманча баш тартып, өз туугандары учсуз ойлордун түйүнүн тынбай чечүүгө аракет жасап отурушуп, бул орунга Курманжан гана ылайыктуу экендигин сөз салышып, Музаффар улукка кеп айтышат. Музаффар эмир бирде Курманжанга ишенген элге, бирде анын иш билгилигине таң калып, кийинки сунушту макул көрүп, муну Кудаяр ханга билдирет. Кудаяр хан Курманжанга «датка» деген наамды ыйгарууга аргасыз болот. Буга чейин Орто Азия жана түрк элдеринде датка даражасын алып жүргөн аял тарыхта болгон эмес экен. Ал кабар элге тез таркайт."},{"t":"p","h":"Курманжан датка ошол учурдагы орус төбөлдөрүнө да коомдук жана мамлекеттик ишмер, акылман жана билгиликтүү башкаруучу, элине камкор эне катары кадыр-баркка ээ экендиги менен да белгилүү болгон. Бекеринен аны Кауфман баш болгон орус генералдары «Алай ханышасы» деп атаган эмес. Курманжан датка өз мезгилинде Россия падышачылыгынын Фергана өрөөнүндөгү ишенимдүү акимдери Скобелев, Ионов, Черняев, Фон Кауфман, Духовский сыяктуу генералдар, атүгүл согуш министри А. Н. Куропаткиндердин урмат-сыйына арзыган. Анын акылман саясаты, билгичтиги, орус-кыргыз элдеринин ортосундагы куралдуу кагылышууларды токтотуп, тынчтыкта жашоого жол ачкан. {Т'. К.)"},{"t":"p","h":"181. Төмөндөгү ырды окуп чыгып, анда н тыбышынын ң, м тыбышына өтүп айтылган учурларын тапкыла."}],"sub":[{"title":"КУРМАНЖАН ДАТКА","b":8}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[214,215]},{"title":"КЫРГЫЗ КӨЛҮ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"216\">216<\/span>КЫРГЫЗ КӨЛҮ"},{"t":"p","h":"Ысык-Көл – кыргыз көлү кылкылдаган, Кыз-келин кылаасында шыңкылдаган. Кылымдар колдон түшкөн маржан болуп, Көрүнбөй тереңинде жылтылдаган."},{"t":"p","h":"Ысык-Көл – кыргыз көлү шарпылдаган, Көркүнө көктөн башка тартынбаган."},{"t":"v","l":["Замандар кербенчидей чубап өтүп,","Чарчаса саясында салкындаган."]},{"t":"p","h":"Ысык-Көл – күрдөөлдүү көл күрпүлдөгөн, Көркүнө көктөн башка сүртүнбөгөн."},{"t":"p","h":"Көк түсү, таалай көркү, ырыс көркү, Толкуса толкундары түркүмдөнгөн. (А. О."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[216,216]},{"title":"§57. ӨТМӨ МААНИЛҮҮ СӨЗДӨРДҮН ТҮРЛӨРҮ","blocks":[{"t":"h3","h":"§57. ӨТМӨ МААНИЛҮҮ СӨЗДӨРДҮН ТҮРЛӨРҮ"},{"t":"p","h":"(МЕТАФОРА, МЕТОНИМИЯ. СИНЕКДОХА) боюнча талдоо жүргүзгүлө. 182. Төмөнкү текстти окуп, ичиндеги өтмө маанилүү сөздөр"},{"t":"h3","h":"ТЕРЕЗЕСИ ЧАЧЫП ТУРАТ ЖАРЫКТЫ"},{"t":"v","l":["Черлеринде оймо-чийме сызыктын...","Сырларына кичинемден кызыктым.","Көмкөрүлгөн асман бетин карасаң,","Көзү тиктейт","сансыз сары мышыктын.","Издей берем бүт сырларын тапканча","Колум менен дарбазасын какканча","Билем жылдыз","күн нуруна жылыбайт","Адам жетип очок отун жакканча.","Бул турмушта билгени бар күлгөндүн.","Табышмагын издейм","көктө күйгөндүн.","<span class=\"pg\" data-n=\"217\">217<\/span>Тээ капкайда жанып-өчкөн жылдыздар","Терезеси сыяктанат сүйгөндүн.","","Кызыгуунун аңыраят кулкуну...","Канат кылат ошол ойлор тулкуну.","Жымындаган үмүт жанат туш-туштан","Жылдыз сары ага болбойт кулпулуу.","","Ал да күтөт, мен да күтөм жалдырап,","Кез караштар каректерди талдырат.","Аз жылдарда ааламдардын ачкычы","Чентектерле жүргөн болот"]},{"t":"raw","h":"<div class=\"gloss\"><p>216<\/p><\/div>"},{"t":"h3","h":"§ 58. ЭТИШТИН ТАТААЛ ФОРМАЛАРЫНЫН ЖАСАЛЫШЫ, ЭТИШТЕРДИН ӨЗ АРА АЙКАШУУСУ"},{"t":"p","h":"183. Төмөнкү тексттерден этиштин татаал формаларынын мүнөздүү белгилерин жана татаал формалар кандайча жолдор менен жасала тургандыгын аныктагыла. Мурда өтүлгөн атиштин татаал формалары боюнча материалдарды эсиңерге түшүрүп кайталагыла."},{"t":"h3","h":"БАТАСЫН АЛУУ"},{"t":"p","h":"Бата алуу эл ичинде кадыр-барктуу, отуруп-турганы нарктуу, айткандары эм, улуу-кичүүлөргө дем, урмат-сыйы бирдей, жекече касиет жылоологон карыя-байбичелерге атайын жолдук менен баруу. Бата алуу – балалуу болууга, алыс сапарга аттанууда, сапардан аман-эсен кайтууда, ойлогон оюна, тилеген тилегине, максатына жетүүгө кылган далалат."},{"t":"p","h":"Улууларды кастарлап, чүйлүү тамактар менен даам сыздыруу бул – бата алуу болуп саналат. Бата даам таткандан кийин ыраазычылык менен берилет."},{"t":"p","h":"Бата тилеген келин-кесектер абалы жүгүнүп, улууларга баш ийип, таазим кылышат. Бата алаарда туруп эки колдорун бооруна алышат. «Оомийин, алдынды бала, артыңды мал бассын. Алганың менен тең кары. Кудай менин жашымды берсин. Пайгамбар-сабаалар колдосун!»"},{"t":"p","h":"<span class=\"pg\" data-n=\"218\">218<\/span>– деп бата беришет. Кийин «Анын батасы тийген», «Тегин кишиден бата албаган», «Батадан жаралган бала»... өңдүү сөздөр бара-бара уламышка айланат. Ушундан-улам кан Кошойдун, кан Бакайдын жайган алакандары, алкаган сөздөрү тегин чыккан эмес деп айта алабыз. (А. А.)"}],"sub":[{"title":"ТЕРЕЗЕСИ ЧАЧЫП ТУРАТ ЖАРЫКТЫ","b":2},{"title":"§ 58. ЭТИШТИН ТАТААЛ ФОРМАЛАРЫНЫН ЖАСАЛЫШЫ, ЭТИШТЕРДИН ӨЗ АРА АЙКАШУУСУ","b":5},{"title":"БАТАСЫН АЛУУ","b":7}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[217,218]},{"title":"АКИМДИН АМАЛЫ","blocks":[{"t":"h3","h":"АКИМДИН АМАЛЫ"},{"t":"p","h":"Бир бийик тоону мекендеген жол тосуучу уурулар тоо аралап еткен жолдон өтүүчү кербендерге жана башка жолоочуларга кол салып, алардын мал-мүлкүн талап алып, кайра тоого чыгып кетишүүчү. Калайык-журт бул уурулардын дартынан көп азап чегүүчү. Аким ал ууруларды арга менен амал колдонуп жоготууга чечим чыгарды. Бир нече идишти өтө курч уу кошулган халва менен башка дагы таттуу тамактарга толтуруп, бир эшекке жүктөштү. Бир кызматчысын чакырып алып:"},{"t":"p","h":"– Бул эшекке артылган жүк аялымдын палан досумдун аялына жөнөтүп жаткан белеги. Сен аялымдын досуна эптеп жеткирип бер,— деди дагы аны кербенге кошуп жөнөттү. Жолдо уурулар кербенди тоношту. Эшекти дагы жүгү менен кошо ала кетишти. Жүктү түшүрүп, идишти алышты. Курсактары ете ачка эле. Ууланган халва менен дагы башка тамактарды талашып-тартышып жешти. Ошол замат эле катып калышты. Мына ушундай жол менен аким ууруларды бир жаңсыл кылып, элин тонолуудан сактап калган. («Акыл ойлорунан»)"},{"t":"p","h":"184. Төмөнкү тексттен этиштин өзгөчө формаларын (атоочтук, чакчыл, кыймыл атооч) тапкыла жана алардагы этиштик белгилерди аныктагыла."},{"t":"h3","h":"МҮЧӨЛ"},{"t":"p","h":"Кыргыз эли жылдан чоң убакытты эсептөө бирдигин мүчөл дешкен. Мүчөл жылдардын кандайча жаралганы жөнүндө Махмуд Кашгари мындай болмушту келтирет. Түрк кагандарынын бири өзүнөн бир нече жыл мурда болгон согушту изилдемекчи болот. Бирок анын датасын тактоодо аябай кыйналат. «Биз кыйналгандай болуп бизден <span class=\"pg\" data-n=\"219\">219<\/span>кийинки муундар да кыйналбасын, андыктан он эки ай менен асмандагы он эки зодиактын атын негиз кылып он эки жылга ат коюшубуз керек. Кийин жыл эсеби ошол жылдардын айланышы боюнча жүргүзүлсүн жана бул нерсе жакшы салт болуп калсын»,— деп сунуш кылат. «Сиздин айтканыңыздай болсун», – дешип увазирлери да жактырат."},{"t":"p","h":"Хан ууга чыгып, жапайы айбандарды Иле дарыясына карай айдоого буюрат. Дарыяга келип такалып калган соң айласы түгөнгөндө жанын ала качып айбандар суудан сүзүп өтө баштайт. Кимиси биринчи сүзүп өткөнүнө жараша он эки жаныбардын аты жылдын аты болуп калат. Ошондо жаныбарлар мындайча тартипте суудан сүзүп өткен имиш: 1. Чычкан. 2, Уй. 3. Барс. 4. Коён. 5. Улуу. б. Жылан. Т. Жылкы. 8. Кой. 9. Мечин. 10. Тоок. 11. Ит."},{"t":"p","h":"12. Доңуз."},{"t":"p","h":"Махмуд Кашгаринин эмгегинде байыркы түрктөр он эки айдын атын билдирген сөздөр асмандагы он эки зодиак жылдыздын атынан келип чыгары жана он эки айды билдирген сөз он эки жылды туюнтуу үчүн кабыл алынганы таасын айтылган. Чычкан, уй, барс, коён, улуу, жылан, жылкы, кой, мечин, тоок, ит, доңуз деген сөздөр алгач асмандагы он эки зодиак жылдыздын аты гана болгон. Кийин ар бир айда ай менен тогошкон жылдыздын аты он эки айдын атын билдирип калган. Ушундай кылып улам кеңейтип колдоно берууден улам он эки айдын атын билдирген сез кийин он эки жылдын, он аки күндүк жуманын, он эки сааттын атын билдирген сөзгө айланган. (К. С.)"},{"t":"p","h":"185. Көркөм чыгармалардан этиштин өзгөчө формалары (атоочтук, чакчыл, кыймыл атооч) катышкан сүйлөмдөрдүн ар бирине ондон отуз сүйлөм жыйнап жазгыла. Алардагы этиштин өзгөчө белгилерин жана оозеки, жазуу кептеги коммуникативдик кызматын чечмелегиле."},{"t":"p","h":"186. Этиштик татаал формалардын мүнөздүү белгилери, жасалыш жолдору жана түрлөрү тууралуу эрежелерди эсиңерге түшүргүлө. Кыймыл-аракеттин башталышын, өнүгүүсүн жана аякталышын билдирген этиштик татаал формаларды катыштырып, чакан текст түзгүлө."},{"t":"p","h":"<span class=\"pg\" data-n=\"220\">220<\/span>187. Кыймыл-аракеттин максатка багытталгандыгын, ишке ашууга даяр экендигин жана аз жерден ишке ашпай калгандыгын билдирүүчү этиштик татаал формаларды жыйнап, алардын негизинде өзүңөр күбө болгон бир окуя тууралуу аңгеме жазгыла."},{"t":"p","h":"188. Кыймыл-аракеттин узакка созулушун, тездик менен капыстан болуп өткөндүгүн, жасалма мүнөздө экендигин туюндурган этиштик татаал формаларды көркөм адабий чыгармалардан чогултуп жазып, алардын жасалыш жолдорун аныктагыла."},{"t":"p","h":"189. Этиш менен экен, эле, бейм, бекен деген жардамчы сөздөр аркылуу жасалган этиштик татаал формаларды пайдалануу менен өз алдыңарча ой жүгүртүп, кызыктуу окуяларды баяндаган жомок жазып келгиле. Ага тема тандап, башкы оюн жана идеясын чечмелегиле."},{"t":"p","h":"190. Этиштик татаал формаларды, этиштин эзгече формаларын терең өздөштүрүү менен аларды тил каражаты катары оозеки, жазуу кебиңерде орундуу колдоно билгенге кенуккуле. Куб. Ж. – К. Жусубалиев"}],"sub":[{"title":"МҮЧӨЛ","b":4}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[219,220]},{"title":"ШАРТТУУ КЫСКАРТУУЛАР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"221\">221<\/span>ШАРТТУУ КЫСКАРТУУЛАР"},{"t":"v","l":["– «Асаба»","А. Ж. – А. Жутакеев","А.Р. – А. Рыскулов","А.Т. – А. Токомбаев","А. Токт. – А. Токтогулов","А. У. – А. Убукеев","А. Фр. – А. Франс","Б. – Барпы","Б. У. – Б. Усубалиев","В. Б. – В. Белинский","В. П. – В. Плоских","В. Ш. – В. Шекспир","В. Шилл. – В. Шиллер","Ж. – Женижок","«Жом.» – Жомок","Т. К. – Т. Касымбеков"]},{"t":"p","h":"Т. Кож. – Т. Кожомберди-"},{"t":"v","l":["ев","Т. М. – Тоголок Молдо","Т. Мук. – Т. Муканов","Т. С. – Т. Сыдыкбеков","К. М. – К. Мусаев","К. Жус. – К. Жусупов","К.К. – К. Каимов","К.О. – К. Осмоналиев","К.С. – К. Сейдакматов","К.Т. – К. Тыныстанов","«КТ» – «Кыргыз Туусу»","К.Э. – К. Эсенкожоев","Л.Т. – Л. Толстой"]},{"t":"p","h":"Ж. Мук. – Ж. Мукамбаев Л. У. – Л. Үкүбаева Ж. М. – Ж. Медералиев"},{"t":"v","l":["Ж. С. – ЖЖ. Саатов","3. ой – Залкар ойлор","«М.» – «Манас»","М. А. – М. Абдукаримов","М. Ал. – М. Алыбаев"]},{"t":"p","h":"үе. С. – Зуура Сооронбаева Мух. А. – М. Ауэзов И. М. – И. Мансуров"},{"t":"v","l":["К.А. – В. Асаналиев","К. Б. – К. Баялинов","К. Бект. – К. Бектенов","К.Ж. – К. Жантөшев"]},{"t":"p","h":"«КМ» – «Кыргыз мада-"},{"t":"v","l":["НИЯТЫ *","К. К. – К. Кулуев","Сан. – Санат","С. Ө. – С. Өмүрбаев","С.Р. – С. Раев","С. С. – С. Сасыкбаев","Таб. – Табышмак","Т. – Токтогул","Т. А. – Т. Абдумомунов"]},{"t":"p","h":"«Мур.» – «Мурас» журна-"},{"t":"v","l":["лы","‚ Б. – М. Борбугулов","‚ Г. – М. Горький",". Л. – М. Ломоносов","‚ М. – М. Мичурин",". Б, – Н. Байтемиров","‚ Г.— Н. Гоголь","О. – Н. Островский","Соор. – О. Сооронов","А. – О. Айтымбетов","Ү.— Т. Үмөталиев","Ш. – Т. Шабданбаев","А. – У. Абдукаимов","– Фалес"]},{"t":"raw","h":"<div class=\"gloss\"><p>221<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"222\">222<\/span>Ф. В. – Ф. Вольтер Ш. С. – Ш. Садыбакасов Фф. А. А. – фамилиясы, «Эр. Т.» – «Эр Табылды» аты, атасынын аты"},{"t":"v","l":["Ч. А. – Ч. Айтматов","Ч. Н. – Ч. Нусупов","Ш. А. – Ш. Абдыраманов","Ш. Б. – Ш. Бейшеналиев","Ш. Д. – Ш. Дүйшеев","","ааа","Э. М. – Э. Медербеков","«ЭТ» – «Эркин Тоо»","Ы. К. – Ы. Кадыров"]}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[221,222]},{"title":"ОКУУЧУЛАР ҮЧҮН ТЕСТ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"223\">223<\/span>ОКУУЧУЛАР ҮЧҮН ТЕСТ"},{"t":"p","h":"1. Тексттин мүнөздүү белгилери кайсылар? А) женекей жана татаал план Б) тематикалык, маанилик, стилдик, грамматикалык бүтүндүгү В) маанилик жана стилдик бүтүндүгү"},{"t":"p","h":"2. Тексттин бөлүктөрүнө эмнелер кирет? А) ойдун башталышы, өнүгүшү, аякталышы Б) тексттеги ойдун аякталышы В) тема,орундуу жана орунсуз кайталоо"},{"t":"p","h":"3. Стиль жалпысынан кандай б :"p","h":"<span class=\"pg\" data-n=\"225\">225<\/span>14. Үнсүз тыбыштар жасалуу ыгына карай кандай бөлүнөт?"},{"t":"p","h":"А) жарылмалар, жылчыкчылдар, мурунчул, капталчыл, дирилдеме"},{"t":"v","l":["Б) капталчыл, дирилдеме, мурунчул","В) ачык, жабык жана тутумдаш"]},{"t":"p","h":"15. Үндөштүк мыйзамынын кандай түрлөрүн билесиң?"},{"t":"p","h":"А) үндүүлөрдүн эринчил жана эринчил амес болуп үндөшүүсү Б) үндүүлөрдүн тилдин күүсүнө карата жана эриндин күүсүнө карата өзгөрүшү В) үндүүлөрдүн тилдин күүсүнө карата алга,артка карай үндөшүүсү"},{"t":"p","h":"16. Кыргыз орфографиясынын негизги принциптери кайсылар?"},{"t":"v","l":["А) фонетикалык жана синтаксистик","Б) оозеки, жазуу жана диалектилик","В) морфологиялык жана фонетикалык"]},{"t":"p","h":"17. Кыргыз орфографиясынын жалпы эрежелерине эмнелер кирет?"},{"t":"p","h":"А) сөздөрдү бирге жана бөлөк жазуу, баш тамгаларды жазуу, сөздүн уңгусун жана мүчөсүн жазуу, сөздөрдү ташымалдап жазуу Б) сөздөрдү ташымалдап жазуу, баш тамгаларды жазуу В) кыргыз алфавитиндеги тамгалардын жайгашуусу 18. Омонимдердин пайда болуу жолдорун жана түрлөрүн сана?"},{"t":"p","h":"А) фонетикалык, морфологиялык, семантикалык, омограф, омофон Б) семантикалык, омограф, табу жана эвфемизмдер В) лексикалык жана синтаксистик жолдор"},{"t":"p","h":"<span class=\"pg\" data-n=\"226\">226<\/span>19. Синонимдердин жана антонимдердин түрлөрүн билесиңби?"},{"t":"v","l":["А) толук эмес, көп манилүү жана окшош","Б) толук, толук эмес жана контексттик","В) орундуу, орунсуз жана логикалуу"]},{"t":"p","h":"20. Этиштин өзгөчө формалары кайсылар? А) чакчылдар, негизги жана жардамчы этиштер Б) метафора, метонимия, синекдоха В) атоочтуктар, чакчылдар, кыймыл атоочтор"},{"t":"h3","h":"<span class=\"pg\" data-n=\"228\">228<\/span>&amp; 17. К, П тыбыштарынын бир сез ичинде үндүүлөрдүн"},{"t":"p","h":"таасири менен г, 6 тыбыштарына өтүшү..................89"},{"t":"h3","h":"&amp; 18. Эки сөз аралыгындагы үнсүз тыбыштардын"},{"t":"p","h":"алга же артка окшошуп өзгөрүү   // ---------------------------------------------------------------- storage helpers

    ['kyrgyz-adabiyat', /кыргыз адабият|кыргызская литература/, 'Кыргыз адабияты', 'Кыргызская литература'],
    ['russkiy-yazyk', /русский язык|орус тили/, 'Орус тили', 'Русский язык'],
    ['russkaya-literatura', /русская литература|литературное чтение|орус адабият/, 'Орус адабияты', 'Русская литература'],
    ['adabiyat', /адабият|литератур/, 'Адабият', 'Литература'],
    ['matematika', /математик|алгебр|геометр/, 'Математика', 'Математика'],
    ['fizika', /физик/, 'Физика', 'Физика'],
    ['himiya', /хими/, 'Химия', 'Химия'],
    ['biologiya', /биолог/, 'Биология', 'Биология'],
    ['geografiya', /географ/, 'География', 'География'],
    ['istoriya-kg', /кыргызстан\S* тарых|история кыргызстана/, 'Кыргызстандын тарыхы', 'История Кыргызстана'],
    ['istoriya-mir', /дүйнө тарых|орто кылым|жаңы тарых|соңку тарых|байыркы|всемирная история|средних век|новая история|новейшая история|древн/, 'Дүйнө тарыхы', 'Всемирная история'],
    ['religii', /диндер|религи/, 'Диндердин тарыхы', 'История религий'],
    ['obshchestvo', /адам жана коом|человек и общество/, 'Адам жана коом', 'Человек и общество'],
    ['grazhdanstvennost', /гражданствен|жарандык/, 'Жарандык', 'Гражданственность'],
    ['english', /англ|english/, 'Англис тили', 'Английский язык']

  function subjectOf(b) {
    var s = String(b.subject || b.title || '').toLowerCase();
    for (var i = 0; i < SUBJECTS.length; i++) {
      if (b.subject === SUBJECTS[i][0] || SUBJECTS[i][1].test(s)) return { key: SUBJECTS[i][0], order: i, name: SUBJECTS[i][S.ui === 'ky' ? 2 : 3] };
    }
    return { key: 'x:' + s, order: SUBJECTS.length, name: b.subject || b.title };

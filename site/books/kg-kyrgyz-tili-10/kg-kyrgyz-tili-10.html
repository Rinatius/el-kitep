дүн тобу катар деп аталат."},{"t":"p","h":"Көңүл буруп, карап көргүлө: курбу, курдаш, тентуш, замандаш, куракташ, курбалдаш. тен, катар, жолдош, классташ деген синонимдерди алсак, доминанты курбу, калган маанилеш сездер уяны, ал эми калгандарын синонимдердин ар кандай катарларына бөлсө болот. 1-катар: курбу, курдаш, теңтуш, жолдош; 2-катар: теңтуш, курбалдаш, тең, катар; 8-катар: тентуш, жолдош, классташ."},{"t":"p","h":"Синонимдер маанилик катышына карай толук жана толук эмес, контексттик синонимдер болуп белунет. Толук синонимдер сүйлөмдүн катарында бирин бири менен алмаштырса, маанилик жактан эч өзгөрүү болбостон алмаштырууга мүмкүн: Накыл, санат, насыят. Омкор, томкор, оодар."},{"t":"raw","h":"<div class=\"gloss\"><p>„ШЕ ЭШЕ ШЕ ЭЕ ЧЕ ЭЕ ЕЕ ЕУ ыны ЫР ШУ ШР СЕ ЭШ СЕ ЭШ ЧЕ ЕЕЕ ыыы ч ЧЕР ЕРСИ С<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"107\">107<\/span>Толук эмес синонимдер сүйлөм тутумунда биринин ордун бири толук маанилик жактан алмаштыра албайт, бирде алмаштырса, экинчи бир учурда синонимдешпейт: сулуу, кооз, көркөм, жакшынакай, жагымодууц, чырайлуу, жылдыздуу ж. б. десек, сулуу – адамга, көркем – чыгармачылык менен бүткөн нерселерге (чыгарма, сүрөт, архитектура ж. б.), жакшынакай – жалпы жагымдуу туюмга, чырайлуу жана жылдыздуу – адамга карата колдонулат. Сулуу жана чырайлуу толук синоним боло алат, сулуу менен көркөм синоним боло албайт, сулуу кыз, сулуу байбиче десек, көркөм кыз, көркөм байбиче дебестен, көркөм сүрөт, керкөм фильм дейбиз, сулуу фильм дебейбиз. Чырайлуу адам дейбиз, чырайлуу тоо дебейбиз. Ошентип, толук же толук эмес синонимдерди сүйлөм катарына коюп көрүү менен аныктайбыз."},{"t":"p","h":"Контексттик синонимдерди контексттеги маанилешүүсүнө карата аныктайбыз: Узун үстөлдүн башында райондун чоңу Асанакун Шамыратович отурат. Көкүрөк тушунда лук-лук урган жүрөгүнүн түрсүлдөшүн туйду."},{"t":"p","h":"Келтирилген мисалдарда чоң – башчы деген сезге, жүрөгүнүн түрсүлдөшү – коркуу сезими деген түшүнүктөргө синонимдешет. Чоңдун синоними – зор, эбегейсиз, коркуунун синоними – сестенди. кооптонду деген сөздөрдү келтирсе болот. Бирок бул жерде контекстте өтмө мааниде туруу менен маанилеш сөздөр катары колдонулууда."},{"t":"p","h":"Синонимдерди пайда кылуучу булактарды ички жана тышкы таасирдин негизинен көрүүгө болот. Ички мүмкүнчүлүктүн таасириндеги пайда болгон синонимдерге кыргыз тилинин өзүнүн булактарын асептейбиз. Ал эвфемизмдин, табунун, фразеологизмдердин, диалектизмдердин таасиринде өнүгөт."},{"t":"h3","h":"Табу жана эвфемизм"},{"t":"p","h":"Т а б у деген түшүнүк элдин аң-сезими менен байланыштуу. Жаратылыштан, табияттан коркунуч алып келет деген сезимде түшүнүктөрдү башка сөздөр менен айырбаштайт, б. а., тергөө сөздөр деп да аталат: Карышкыр деген сөздү айтса, малды жеп, кырып кетет <span class=\"pg\" data-n=\"108\">108<\/span>деп, кудайдын ити, кашабаң, бөрү, кек серек деген синонимдер менен алмаштырышкан."},{"t":"p","h":"Тергөө, табу сөздөрдүн пайда болушуна социалдык, гносеологиялык жана психологиялык себептер өбөлгө түзгөн. Табу дайыма эле синонимди пайда кыла бербейт, көпчүлүк учурда нагыз түшүнүктүн аты аталбай калат, т. а., тергелген нерсенин аты колдонулбастан, анын ордуна табу сөз гана колдонулуп, ал элге кеңири тарап кетет. Табу керкөм чыгармаларда өтө аз учурайт. Себеби ал өтмө мааниде колдонулбайт, т. а., табу өзүнүн табияты боюнча түздөн-түз атоого жакын турат. Ал эми бул болсо анын эл үчүн коркунучтуу жана ыйык туюлган нерселердин атын атагандыгы менен шартталат. Алсак, кыргыздар ыйык жандык катары эсептелген бугу деген түшүнүктү берүүдө Ч. Айтматов М уйуздуу эне, Бугу ане, Умай эне деген табуну колдонгон."},{"t":"p","h":"Табу сөздөр элдин коомдук-социалдык абалы менен тыгыз байланышта болгондуктан, көбүнчө ал оозеки чыгармаларда, эпостордо же кары адамдардын кептеринде учурайт. Адамдын аттарын тергеп айтуу да бүгүнкү күндө кездешет. Ошентип, табу сөздөр аркылуу кыргыз элинин өткөн доордогу жашоо турмушунан, үрп-адат, көз караштарынан маалымат алабыз."},{"t":"p","h":"Э вфе м из м одоно, айтууга ыңгайсыз сөздөрдү башка жагымдуу сездер менен алмаштыруудан келип чыгат. Бул элдин маданияты менен байланышкан. Элдик жана тилдик маданияттуулук катары эсептелет. Бооз деген түшүнүк малга карата колдонулса, адамга карата боюнда бар, кош бойлуу, кош кайбат деген сыякү ч туу синонимдер менен алмаштырылат. мизмдер лексикалык курамда өтмө маанини пайда"},{"t":"p","h":"Эвфемизмдер – синонимдердин бир түрү. Эвфекылып, айрымдары адабий нормага айланат. Алар тилде синонимдуулукту жаратат. М ы: кечигүү – кармалуу, толду – эттенди – семирди. Эвфемизмдер коомдогу адамдардын жүрүш-турушунан, этикалык нормадан, сылыктыктан улам жаралып, көпчүлүгү нукура эвфемизмдер катары адабий тилибизден орун алса, айрымдары контексттик, индивидуалдык синонимдер катары белгилүү бир көркөм чыгармада гана жашап калат."},{"t":"raw","h":"<div class=\"gloss\"><p>ый ы ет<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"109\">109<\/span>Эвфемизм – көркөм сөз каражаттарынын бири. Элдин жашоо турмушу, ички маданияты менен тыгыз байланышта. Эвфемизмдер тээ алмустакта эле жаралган. «Манас» эпосунан кептеген эвфемизмдерди жолуктурабыз:"},{"t":"v","l":["Казы байлап бул өзү","Толгон экен шиши да.","Кумга төөсү төлдөгөн","Көп байлыгын жыйноого","Кытайдын алы келбеген.","Этегин эч ким ачпаган,","Эчактан сыйлап көпчүлүк","Ээнбаш сөздү айтпаган."]},{"t":"p","h":"Эвфемизмдер көркөм чыгармаларда түгөйлөр катары кеңири учурайт. Эвфемизмдер структуралык жактан сөз түрүндө да, фразеологизм түрүндө да учурайт жана алардын мааниси контекст аркылуу аныкталат."},{"t":"p","h":"Фразеологизмдер өтмө мааниде туруу менен түз маанидеги сөздөргө маанилеш келет: Жыш токой, эгин дегендин ордуна чычкан мурду жөргөлөгүс деген фразеологизм колдонулат."},{"t":"p","h":"Фразеологизм – өтмө, образдуу маанини берүүчү ыкма."},{"t":"p","h":"Диалектизм же тилдин территориялык чектелген түшүнүгү болуу менен адабий тилде синонимди пайда кылат: Дос, жолдош, орток."},{"t":"p","h":"Бул сыяктуу ыкмалар ички булактардан пайда болгон синонимдер деп аталат. Мындан тышкары башка тил- ‚ ден кирген сөздөр да эне тилибиздеги сөздөргө маанилеш ' келет, булар тышкы булактардын негизинен пайда болгон синонимдер болуп эсептелет: колдоо, демөөр, спонсор, мелдеш, соревнование, мөөнөт, срок ж. б."},{"t":"p","h":"ТТ. а) Төмөнкү сүйлөмдөрдөгү синонимдерди түрлөрүнө ажыратып, толук, толук эмес, контексттик экенин далилдегиле."},{"t":"p","h":"Апамдын деги кимге сүйлөп, ким менен жекелешип, урушуп жатканы белгисиз. Ошондон улам байкуш апамдын кара жини кармай кетти окшойт. Урушкан сайын атама айтып жүргөн дооматына өтүп кетти окшойт. Биз <span class=\"pg\" data-n=\"110\">110<\/span>бала болсок да апамдын бул дооматына өзгөчө бир чатак бардай карачубуз. Анткени башка эч бир жемеге чым этип койбогон атам ушул алтын сейке дегенди укканда каны бир башкача бузулуп кетер эле... Көрсө, ошентип араздашкандардын аз-аздан ачуусу кетет тура. (К. А.)"},{"t":"p","h":"б) Төмөнкү синонимдерге мисалдар түзүп, маанисинин алыс-жакындыгын аныктагыла."},{"t":"p","h":"Чөнтөк, калта, чонтой; Үлгү, өрнөк, таалим, нуска, мисал: Кумар, мооку, ышкы; Жашы, жашоору, ыйламсыра, бошо; Акылсыз, бейакыл, наадан, эселек, эсер; Кекеч, сакоо, чүчүк."},{"t":"p","h":"78. Төмөнкү тексттен кара менен басылган создерду маанилешине карата ажыраткыла. Доминанттарын таап, салыштыргыла."},{"t":"p","h":"Катты окуп бүткөнүмдө бир шүмшүк үстүмө жугунду куюп жибергендей эле болду. Флчесу курусун, эң жаман кат экен. Мынчалык ачуу сөздөрдү өмүрү угуп керген эмесмин. Калыстыгы жок бир бейадеп баарыбыздын бетибизге жок жерден көө сыйпап жибергенине чыдабай, адегенде аябай катуу жиндендим."},{"t":"p","h":"Аз-аздан кийин бой токтотуп, ойлоп көрсөм, маркум апамды жашырганыбызга үч жылга аяк басыптыр. Айылдагы аталаш туугандарыбыз кышкысын атаңарды шаарга алып кеткиле, ошол жерден бир бойдок кемпир таап кошуп коёбуз дептир. Айылда башы бош кемпир деген калбай калса керек."},{"t":"p","h":"Нечен жылдар бою апам эмнегедир ал аял менен араздашып, үйлөрүбүз көчөмө-көчө турса да киришкенибиз жок. Айтору Мунабия тууралуу апам бир да жылуу сөз айтканы жок. Ал мастан бизге жакшылык санабайт. Ал шүмшүк биздин үйдүн кутун учурду. Ал жез кемпир дегенден апам жадачу эмес."},{"t":"p","h":"Сени уул, кыркка чыккан киши дейт. Бул жакта жалгыз атаңар бир мастанга апаңардын ак шейшебин тебелетип, салтта жок жосунду жасап отурат. Бейиши болгон жеңем, көрүндө ала салып аткандыр. Жайына кеткен кишинин керезин аткаруу керек. Көрдүңбү кичине бала, о дүйнө кеткен адамдын сөзүн угуу керек."},{"t":"p","h":"Бош керебетти үйдүн ортосуна чыгарып, сөөктүн бетин ачып, азага карата үн чыгарышып жатышты. (К. А.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"111\">111<\/span>79. Ыр саптарындагы кара менен белгиленген сөздөрдүн синонимин ордуна коюп көрүп, анын көркөм каражат катары колдонулганын аныктагыла. Доминантын, маанилеш жакындыгын айтып бергиле."},{"t":"v","l":["Кечиккен соң зарыгып,","Унутту деп таарынып,","Коргоол менен күн санап","(төлгө таш жөнүндө айтып жатат),","Жүргөндүрсүң камыгып,","","Түндө жатып уктайай,","Күндүзүндө токтобой,","Жолоочудан жол сурап,","Тургандырсың Ала-Тоо!","","Баламдан кабар укчу – деп,","Санаймын эрте-кечти – деп,","Кагылбаган жаш балам.","Кандай жолго түштү – деп","Зардап, ыйлап, үн салып,","Башынан түшпөй күү чалып.","Дөңдөн түшпөй эрте-кеч","Тургандырсың Ала-Тоо!","","Айлар-жылдар өттү – деп,","Кабарсыз болуп кетти – деп,","Катпаган балтыр баламды,","Кимиси мерт этти – деп,","Булуттан жоолук оронуп,","Ак чачың музга боёлуп.","Кез жашың менен сай-сайды","Жуугандырсың Ала-Тоо! (К. Т.)"]},{"t":"p","h":"80. Бул эвфемизмдердин, табулардын колдонулуш себебин айткыла. Доминантын тапкыла. Ар бирине мисал берип, сүйлөмдөр түзгүлө, катарын таап, ага да мисал келтиргиле."},{"t":"p","h":"Төрөдү, көзү өттү, оозунан ак ит кирип, кара ит чыкты, бети ачыла элек кыз, жаман оору, сылтып баскан адам, азиз киши."},{"t":"p","h":"81. Кара тамга менен басылган сөздөрдү мааниси жана пайда болушу боюнча кайсы түрдөгү синоним экенин аныктагыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"112\">112<\/span>Өзү да үшүгөн Инкамал апай өзүнөн бетер көк тумшук болгон балдарга география сабагын өтүп жатат... Талаадан куурай оруп, өлүп-талбай, эки колду чөнтөккө салып, чыйт түкүрүп коюп жүрө берет экенсиң."},{"t":"p","h":"Эмнесин айтасың, ажайып укмуштун баары Цейлондо. Кардың ток, кайгың жок, жүрө бер көчөнү как жарып. Бир плантаторлор элдерди кулдай жумшап кулакка чаап иштетет экен... Фашист иштебей, кутурган арам тамактардан чыгат турбайбы."},{"t":"p","h":"Үшүп турган балдардын ичинен бирөө ыкшып жетелсө, сөзүн токтото калып, өзү далысын күйшөп коюп, суук класста Инкамал апай сабак өтүп турат. Султанмурат Цейлондо төрөлбөй калганына ичи күйөт. Ал жакта жаныбарлар кандай төлдөйт экен, бир жылда канча жолу? Ана турмуш, ана жашоо деген деп санаасы алыста жүрсө да көз кыйыгы терезеде. Мугалимди тиктеп тургансып, бир байкатпай терезеге көз кыйыгын салып тура берүүчү. Азыр сыртта кар кымкарлап, айнекке тийип бурч-бурчуна үйүлүп жатат. Цейлондо терезенин деле кереги жок го, а түгүл тамдын кереги не, эки талдын башын ийип, чөп алачык куруп ал да, жашай бер. (Ч. А.)"},{"t":"p","h":"Көңүл бургула!"},{"t":"p","h":"Терезе деген сөздүн мааниси эшик менен үйдү бөлүп туруучу, көрүп туруучу мааниде, андан тышкары айнек маанисинде, эшик – көчө маанисинде колдонулуп жатат. Терезени кара – бул айнекти эмес, көчөдөгү болуп жаткан кыймыл-аракетти кароо. Терезеге кар цйцулцп жатат десе – анда эшик менен үйдүн ичин бөлүүчү ' тамдын бир бөлүгү. Айнек бул контекстте алгачкы до- минант маанисинде, б. а., кумдан жасалган химиялык) элемент маанисинде пайдаланылган эмес. Көрдүңөрбү, синонимдер керкем чыгармаларда атайын сөз каража- ‚ ты катары катар колдонулуу менен бирге толук жана толук эмес, контексттик маанилери ачылып турат. Жогорудагы баса белгиленген сөздөрдү дал ушул сыяктуу түшүнүүгө, талдоого алууга аракет жасагыла. Өзүңөр мугалим менен бирдикте адабияттан өтүп жаткан чыгармалардан таап, сөз – каражат экенин байкагыла."}],"sub":[{"title":"Табу жана эвфемизм","b":13}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[107,112]},{"title":"§ 28. АНТОНИМ, АНЫН ТҮРЛӨРҮ ЖАНА ПАЙДА БОЛУУ ЖОЛДОРУ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"113\">113<\/span>§ 28. АНТОНИМ, АНЫН ТҮРЛӨРҮ ЖАНА ПАЙДА БОЛУУ ЖОЛДОРУ"},{"t":"p","h":"Бизди курчап турган чөйрөнүн өзүндө бири экинчисинен кичирээк, дагы бирөө үчүнчүсүнөн чоңураак, бири-биринен сапаты жагынан жакшыраак болгон заттардан, кубулуштардан турат. Аба ырайы бир күнү суук, бир күнү ысык, дагы бир күнү суугураак, ысыгыраак, суунун агымы бирде катуу, бирде жай экенин күндө эле байкап жүрөсүңөр. Мына ушунун өзү тилибизде бирине экинчисин карама-каршы коюу менен антонимдерди пайда кылат."},{"t":"p","h":"Антонимдерди көп маанилүүлүккө, синонимге салыштырмалуу карасаңар, ал таза тилдик көрүнүш эмес, ал табиятынан, жаратылышынан бири-биринен айырмалануунун негизинде келип чыкканын көрөсүңөр. Ошондуктан, карама-каршы маанидеги сөздөрдү өз ара антонимдештирбесек, анда ар биринин аталышы езунче эле түшүнүктөрдү атоо катары колдонулат. Мисалы, ак деген сөздү алсак, ал кардын, сүттүн өңүндөй таза, кирсиз деген атоону берет. Ага карама-каршы кара деген түс көмүрдүн өңүндөй, актын каршысы деген гана атоону берет. Биз түс катары катар коюп салыштырсак, алардын карама-каршы антоним мааниси келип чыгат. Ошентип, антоним сөздөрдүн маанилик гана карама-каршылыгы деп карабастан, табиятынан болгон кескин айырмачылыктардын негизинде антоним келип чыгарын көрөбүз. Демек, антоним – мааниси боюнча карама-каршы сөздер."},{"t":"p","h":"Антонимдерди жаратылышынан, табиятынан карама-каршы жана сапаты боюнча карама-каршы сөздөр деп бөлүүгө болот: чоң – кичине, ачуу – таттуу, чоң – майда, караңгы – жарык, жакшы – жаман, катуу – жумшак, кир – таза ж. 6."},{"t":"p","h":"Антонимдер маанисине карай толук, толук эмес, контексттик болуп бөлүнөт. “Толук антонимдер синонимдер сыяктуу эле маанилери бирине бири толугу менен карама-каршылаша алат. Мындай антонимдерге келди – кетти, өйдө – төмөн, чоң – кичине, ак – кара сыяктуулар кирет. Б. а., маанилик жактан толугу менен бирине бири карама-каршылашат."},{"t":"raw","h":"<div class=\"gloss\"><p>– тн ш ш ы шс ш р чү чү чүсү сү чү че чү чү чест че чү ч е чш ш ш ш ч че ш ы ш е<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"114\">114<\/span>Толук эмес антонимдер дегенде бир түгөйү экинчи түгөйүнө толугу менен каршылаша албастан, бирде каршылашып, бирде каршылаша албайт. Мындай түрүнө ысык – жылуу, узун – орто бойлуу, жакшы – начар (жаман эмес, бир аз начарыраак), чоң – кесек (майда эмес), таттуу – даамдуу (ачуу эмес) ж. б."},{"t":"p","h":"Контексттик антонимдер эз алдынча турганда карама-каршылаша албастан, контекстте гана антонимдешет. Алардын бир түгөйү же экөө тен өтмө мааниде туруп, көркөм сөз каражаты катары колдонулат: «Буга окшогон куу томаяк жетим амес, нанды «нанай» деп жүргөн эркелер да окубай жүрөт». Кандай укмуш ээ, бийиктиги канчалык! Досберген, бери карачы, тетиги этекте көгөргөн кайсы айыл? (Ч. А.)"},{"t":"p","h":"Антонимдердин ичинен омонимге да, полисемияга окшошураак түрү – энантиосемия. Ал кыймыл-аракеттин, көрүнүштүн кайсы бир окшоштугу боюнча полисемияга, ар башка маани бериши боюнча омонимге, маанилеринин карама-каршылыгы боюнча антоним болуп, тилдик каражаттардын, контексттин жардамы менен айкындалат. Тактап айтканда, бир эле сөздүн карама-каршы мааниси болуп эсептелет."},{"t":"p","h":"М и с а л ы: көөлө деген сөздү алсак, казанды көөлөсө, казан тазаланат, кийим кееленсе булганат. Чыгуу деген сөздү алсак, үйгө чыгуу жана үйдөн чыгуу маанисинде чыгыш жана барыш жөндөмөлөрүнүн мүчөлөрү антонимдештирет. Антонимдердин көркөм каражат катары колдонулуучу түрү – оксюморон. Ал карама-каршы маанидеги сездерден турган атайын стилдик фигура болуп саналат:"},{"t":"p","h":"Үшүсөм ысык үйдө суук сөздөн, жүрөгүм жылып кетти кышкы түндөн. (Ф. А.) Тилдүү дудук: көздүү сокур, колдогу куш ж. б. Антонимдер морфологиялык жол менен -луу жана -сыз (-бей префикси) мүчөлөрү аркылуу жасалат: ыймандуу – ыймансыз, кийимдуц – кийимсиз, туура – натуура ж. б.\\ /"},{"t":"p","h":"82. Бул антонимдердин толук же толук эмес маанилеш экендигин аныкташ үчүн мисалдар түзгүлө. Кайсы сөз түркүмдөрүнөн экендигин айткыла."},{"t":"raw","h":"<div class=\"gloss\"><p>чет Чы н ыч н<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"115\">115<\/span>Байыртан – азыртан, акылуу – бекер, бакыт – балакет, сараң – берешен, сараң – март, соо – оору, соо – кызымтал, мас, төмөн – жогору, тер – иреге, тер – жака, теоретик – практик, кургак – ным, кургак сыз."},{"t":"p","h":"83. Төмөнкү тексттеги антонимдердин маанилик катышын, түрлөрүн тапкыла. Антонимдердин көркөм сөз каражат экенин далилдегиле."},{"t":"v","l":["АПА","(Т. Кожомбердиевдин поэмасынан узунду)","","Тузсуз жеген сыяктандык тамакты,","Караңгылык уялады кабакты,","Апам кетип, от ажырап табынан,","Жетим кылды чайнек, чыны, табакты.","","Бийиктердин жапыздады барааны...","Жүрүп калды мүңкүрөөнүн арааны.","Апам кетип, казан түбү муз болуп,","Жетим кылды тулга менен чараны.","","Дөңгэлэнүп, өмүр барат ерунде.","Урмат менен сый көрмөкпү көрүндө?","Эмне болмок сени менен бир барып,","Конок болсо досторуңдун төрүндө,"]},{"t":"p","h":"Мүрзөң тымтырс. Кесе тиштейм бармакты. Сезем жондо качыраган салмакты."},{"t":"v","l":["Өбер элем, өзүң эмес, апаке,","Өңү сага кебетелеш арбакты.","","Жашап келем кечти көрүп, таң көрүп,","Элесиңди маңдайымда шам көрүп.","Эне гана ушинталмак жадабай,","Эртели-кеч баласына кам көрүп.","","Алды жактан күндөй жарык түн келет,","Алды жактан шаңга толгон үн келет.","Алды жактан «жетим» деген сөзү жок,","Апа баарын жөнгө салчу күн келет."]},{"t":"p","h":"<span class=\"pg\" data-n=\"116\">116<\/span>84. Төмөнкү энантиосемияларга антоним маанисиндеги мисалдарды келтирип, карама-каршылыгын аныктагыла."},{"t":"p","h":"Түтөө (күйүү) – түтөө (жакшы күйбөө), тара (чачты тарап, иретке келтирүү) – тара (окуудан туш-тарапка тароо), атты (мылтыктын огу денеге кирүү) – кан атты (жараттан кан сыртка катуу агуу)."},{"t":"p","h":"85. Төмөнкү оксюморондорго өзүңөр мисалдар түзүп, антоним түгөйлөрдүн кайсынысы өтмө мааниде экендигин аныктагыла."},{"t":"p","h":"Тирүү өлүк, жарыксыз нур, күнөөсүз күнөөлүү, көрүнүп барып көрүнбөй, түгөнгөн сайын түтөө, эскинин жаңысы, пайдалуу чатак, арбын туруп аз болуу."},{"t":"p","h":"86. Текст ичиндеги антонимдерди маанилерине карата бөлүштүргүлө, карама-каршылашуунун мүнөзүн аныктагыла."},{"t":"p","h":"Кызыраңдаган жигиттин сөзү элге тарай электе жакшы да, жаман да айтып, бал тилге салып көрүштү. Ит кыял неме экен, сөзгө көнбөдү. Басыкең муну жөн коёбу, эс-акылы түзүк немени мээсинде дарты бар деп колундагы адамдарга нечен-нечен тил кат жаздырбадыбы? Акыры ал чабан кой артында жүрүп, аскадан учуп өлгөндө да сыртынан каңырыгы түтөп, ичинен кудуңдап барбады беле бата кылганы, ошондо кайсы бир киши анын ак кепинде жаткан денесин ача койсо, кудай бетин салбасын, анын көзү тирүү жандыкынан бетер умачтай ачылып, жансыз болсо да чырактай жанып турган экен го."},{"t":"p","h":"Сен жашайм деп кур үмүт кылбагының. Сенин күнөөң ошончолук көп, ошон үчүн өлүм менен өмүрдүн ортосунда жаның үзүлө албай кыйналасың. (С. Р.)"},{"t":"p","h":"В7. Төмөнкү тексттеги антонимдерди таап, аларды маанисине карай бөлүштүргүлө."},{"t":"p","h":"Тирүү болгон соң иштеш керек. Эмгек эч кимди өлтүрбөйт. «Иштеген киши өлбөйбү?» – дейм чындап таңдана. «Өлбөйт! – дейт, атам ишенимдүү, – Иштедиңби – өлбөйсүң. Ошон үчүн иштейт да, болбосо...* Эмне даэрин таппай калат. Мен кээде ишенсем, кээде ишенчү эмесмин. Анын үстүнө иштесең эле болду, өлбөйсүң деп какшап жаткан ушул эле атам көп өтпөй: «Туулмак ак, өлмөк ак,- деп ойго чекчу. Туулдум дегениң, өлдүм дегениң. Туулган соң, эртеби-кечпи кетериң анык, дүйнөгө <span class=\"pg\" data-n=\"117\">117<\/span>түркүк болчу эч ким жок». Мына ушуну да унутпоо керек!.. Мени карап сырдуу муңаят: – Өлүмдү ойлой жүргөн жакшы, балам... Бирок ошентсе деле: «Кишини өлтүрбөй коё ала турган эмгек деген эмне?» – деп баш катыра берчүмүн."},{"t":"p","h":"Энкейсен – эмгек, мына бүгүн иштедикпи, мунун өзү – эмгек,— дечү атам."},{"t":"p","h":"Анан мен эмгекти терге окшоштура берчүмүн. Бир күнү иштеп жатып атам экөөбүз тең көл-шал болуп тердедик. Анан мен тердеген колумду жалап кердум – ачуу экен. Ишенген жокмун. Атамдын колун жаладым, аныкы да апачуу. Тер мындай болот деп үч уктасам, түшүмө кирген эмес. Коркуп кеттим: «Ата, ата,— дедим элеңдеп."},{"t":"p","h":"– Тер ачуу болот тура!» «Жок, балам,— деди атам. – Терден таттуу эч нерсе жок. Тер адамды баарынан – жамандыктан, жада калса оорудан да арылтат!» Кийин мен эсиме түшкөн сайын теримди жалачумун, бирок бир да жолу таттуу даамданбады, туз эле даамданып тура берчү. А атам айтканынан кайтчу эмес: «Бу сенин тилиң эмне, элдикинен белекпу,- дечү күлүп. – Тер деген таптаттуу."},{"t":"p","h":"– Өзүнүн колун жалап тамшана кетчү. – Атаңдын көрү, карачы жарыктыкты, таптаттуу!..» Чуркап барып атамдын колун жалайм да, элейип туруп калам, баягыдай эле туз даамданат! Атам боору эзилгенче каткырат: «Тердин даамын биле электигин ушул,- дейт анан ойлуу. – Кийин билесиң...* Чын эле, бул айткандарынын төркүнүнө эми түшүнүп келе жатам. (Б. У.)"},{"t":"p","h":"Көңүл бургула!"},{"t":"p","h":"Бул текстте өтмө мааниде колдонулган сөздер бар. Аларды көп маанилүүлүккө, синонимге жата тургандарына карата да талдагыла. Контексттик антонимдердин өтмө мааниде тургандыгын байкагыла."},{"t":"p","h":"88. Төмөнкү антонимдерге мисал түзүп, маанилик катышын айткыла."},{"t":"p","h":"Келтир – кетир, кеменгер – кеңкелес, ме – келе, муң – кубаныч, нымдуу – нымсыз, адептүү – бейадеп, чыдамкай – жалакай, айрык – бүтүн, айлалуу – айласыз, дайындуу – белгисиз, жылуу – салкын, кат – көрсөт."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[113,117]},{"title":"&amp; 29. КЫРГЫЗ ЛЕКСИК АСЫНДАГЫ АКТИВДҮҮ ЖАНА ПАССИВДҮҮ СӨЗ КАТМАРЛАРЫ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"118\">118<\/span>&amp; 29. КЫРГЫЗ ЛЕКСИК АСЫНДАГЫ АКТИВДҮҮ ЖАНА ПАССИВДҮҮ СӨЗ КАТМАРЛАРЫ"},{"t":"p","h":"Тилдеги сөздөр коом менен байланыштуу. Ал өзгөрсө, өркүндөсө, лексикадагы сөздөр да өзгөрүүгө учурап, кээси коомдук шартка туура келбегендиктен, колдонуудан чыгып турса, айрым бир жаңы заттар, кубулуштар менен бирге жаңы сөздөр келип толукталып олтурат. Ошондуктан тилдин лексикалык курамы кыймылдуу келип, өзгөрүп, өнүгүп турат."},{"t":"p","h":"Күнүмдүк жашоо-турмуштагы сайма-бай колдонулуп туруучу буюмдардай, дайыма пикир алышуунун негизин түзүп турган сөздөр бар: кел, кет, тур, суу, нан, жаша, айт, сут, аба, тамак ж. б. көптөгөн сөздөр дайыма биздин пикирлешүүбүз катары активдүү катмарга кирет."},{"t":"p","h":"Коомдун өнүгүшү менен айрым бир түшүнүктөр учурдун талабына жооп бербей калгандыктан, алар эскирип, кээ бирлери такыр колдонуудан чыгып калса, кээлеринин аталышы башка сөздөргө орун бошотот. Мындайлар көөнөргөн сөздөр деп аталат да, пассивдүү катмарга кирет. Көөнөргөн сөздөрдү эки топко бөлүштүрүүгө болот, алар – архаизмдер, историзмдер."},{"t":"p","h":"Аркаизмде р- колдонуудан биротоло чыгып калган түшүнүктөр болбостон, түшүнүгү бар, аталышы учурга жооп бербестен, башкача аталышка ээ болуп калган сөздөр: буурусун – соко, буулум – кымбат кездеме, төңкөрүш – революция, комсомол уюму – жаштар кошуну, аткаруу комитети – акимчилик ж. б."},{"t":"p","h":"Историзмдер же тарыхый сөздөр деп аталган катар коомдук тарыхый шартка карата келип, колдонулуш чөйрөсү зарылчылыкты түзбөй калганда колдонуудан чыгып кете берет. Мындай сөздөрдүн катарын көпчүлүк учурда коомдук, саясий, административдик башкаруу ж. б. түшүнүктөрүн туюндурган сөздөр түзөт. Алар колдонуудан биротоло чыгып, илимий изилдөөлөрдө, тарыхый чыгармаларда атайын каражат катары колдонулат: удайчы – хан ордосун кайтаруучу, парванчы – хандын жарлыгын жарыялоочу, мударис – медреседе сабак берүүчү, даре – сабак, каракелтек – элден чогулган <span class=\"pg\" data-n=\"119\">119<\/span>жардамчы күч, ополчение, жаңгер – согушчул, жеңүүчү."},{"t":"p","h":"Лексиканын пассивдүү катмарын бир гана архаизмдер, тарыхый сөздөр түзбөстөн, терминдик кесиптик жана неологизм сөздөр да түзөт."},{"t":"p","h":"Терминдик жана кесиптик сөздөр илимдин же эл чарбачылыгынын тиешелүү тармагына гана түшүнүктүү болуу менен бирге ошол тармактарда гана колдонулгандыктан, жалпы элдик пикир алышуунун куралы боло албайт."},{"t":"p","h":"М исал ы: медицинадагы: анастезиолог, опера: ция, папаверин, но-шпа, вич ж. б., физикадагы: мас са, аордук, тартылуу кучи, ампер, вольтметр ж. б., жыгач устачылыктагы: сургу, араа, мык, көк. керки ж. б. ошол кесипчиликте, иш убактысында гана колдонулуусу менен чектелген мүнөзгө ээ. Бул сөздөрдү бардык элдин сүйлөшүү куралы деп эсептей албайбыз, иш уюштуруу, же маалында жалпы иш кызыкчылыгына карата колдонулат деп билебиз. нь архаизмдерди, тарыхый сөздөрдү түшүнүү менен ар бирине ылайык чакан түшүндүрмө жазгыла. Түшүнүгүңөрдүн аныктыгын билүү үчүн сөздүктөргө кайрылгыла."},{"t":"p","h":"Хан, бек, неекер, ордо, элүү башы, эмир, шах, султан, аталык, кыр көрсөтүү, кесипчилик уюм, дилде, от араба, кол араба, айдакчы."},{"t":"p","h":"90. Таменку чакан тексттен алынган көөнөргөн сөздөр түшүндүрмөсү менен берилди. Бул Х. Карасаевдин «Камус нааме», «Манас» сөздүгү деп аталган чыгармаларынан алынды. Көөнөргөн сөздөрдү түр боюнча ажыраткыла."},{"t":"v","l":["«Байла, Жакып чалды – деп,","Басып калды жабылып.","Бай Жакып шондо кеп айтат:","«Балдарым токто» – деп айтат.","Күнөөм болсо, балдарым,","Күндөңдү мага камдагын","Шоктугум болсо, балдарым,","Зоолунду мага камдагын.","Дос кишини кам көрүп,","Убалга бөөдө калбагын».","(«Манас» эпосунан)"]},{"t":"raw","h":"<div class=\"gloss\"><p>шы ще и шш чи че ы ш э е е че е ш ш шшш е че Че ЧЕН ш<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"120\">120<\/span>«Күндө», «зоону» деген фарсы сөзү. Экөө тең эле колго, бутка салына турган кишен. «Күндө» – арабча кылмыш, «дос» – фарсыча тамыр, ынак."},{"t":"v","l":["«Ойлогула балбандар,","Көк темирден туулга,","Кимдер ыкшап кийбеген»."]},{"t":"p","h":"{«Семетей» эпосунан)"},{"t":"p","h":"«Туулга» – байыркы түрк-монгол сөзү, жоокерлердин баш кийими. Монголчо – «дуулга», калмакча – &amp;дуулгх», өзбекче – «дабылга», казакча – «дулыга»."},{"t":"p","h":"91. Х. Карасаевдин «Накыл сездер» сөздүгүнөн алынган тексттен көөнөргөн сездарду таап, талдоого алгыла, сөздүгүн түзгүлө."},{"t":"v","l":["«Алыска минсе чарчабас,","Кара байыр казанат».","{«Манастан»)","","«Казанат минип ойноткон","Калгандыр дүйнө кыйладан».","(Элдик ырлардан.)"]},{"t":"p","h":"«Казанат» – эл адабиятында айтылуучу буудан, күлүк, чыдамкай аттардын сапаты."},{"t":"p","h":"Ушул күнгө чейин чыгып келген сөздүктөрдүн биринде да, «казанат» деген сөздүн теги ачыла элек. «Казанат» – эки сөздөн биригип калган. Иран тилдеринде «хане» – уй, «зад» – бала деген маанини туюндурат. Демек, «ханезад» – үйдө туулган жылкы."},{"t":"p","h":"«Кара байыр» – мыкты аттын сапаты. Биздин оюбузча, «кара» – мал, «байыр» – деген мааниде, казанат // каназат синонимдер."},{"t":"v","l":["«Калем тарткан сыядай,","Кашынды бир пас ырдайын.","Каз элечек жарашкан,","Башынды бир пас ырдайын».","(Элдик ырлардан)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"121\">121<\/span>«Каз элечек» – койкойто оролгон жакшы, апакай элечек. Кээ бирөөлөр кадимки каз сыяктуу апакай жана койкойгон деп түшүндүрөт. Бул туура эмес."},{"t":"p","h":"«Каз» сөзүнүн төркүнү – Өзбекстанда чыгарылган ак жибек кездемеге барып такалат. Аны көбүнчө селдеге, аялдардын баш кийимине колдонушкан. Кийин фабрикада токула баштагандан кийин бул кездеме колдон токулбай калган, ошол жибектин аты «каз» деп аталар эле. «Каз» кыргыз, өзбек тилдеринде «каса, хоса» делинип, каз элечек – жибектен оролгон элечек деген түшүнүктү берет."},{"t":"p","h":"92. Тексттеги көөнөргөн сөздөрдү ажыраткыла."},{"t":"p","h":"Азыр мектеп жашындагы балдардын кечеде майда бизнес жасап жүргөндөрүн көрүп, өзүбүздүн бала кезибиз эске түшөт. Ыдырап кеткен СССР мамлекетинде ар бир жаш адамдын орду бар эле го. Октябрятка өтөбүз деп ак көйнөгүбүздүн жакасын камдап, Володянын сүрөтүн тагууга түнү бою уктабай чыгар элек, пионерге өтүү андан да салтанаттуу эле. Пионердик антты жаттап, «Дайым даяр» туруу үчүн боюбузду түздөйт элек. Ал эми комсомолго татыктуулар өтөт десе, жакшы окуп, жакшы иштеп, кары-картандарды шефке алуу деген бар эле."},{"t":"p","h":"Замандын оош-кыйышы бар дечи. Азыркы заманыбызда эгемендүүлүккө за болуу менен катар, моминтип жаштарыбыздын ичинде көп таланттуу өспүрүмдөр билимсиз калып жатканы өкүнүчтүү. («Кыргыз руху»)"},{"t":"p","h":"9З. Бул тексттен пассивдүү катмардагы сөздөрдү таап, ал кайсы топко кире турганын аныктагыла."},{"t":"p","h":"Адам баласы геометриялык фигуралардын касиеттери жөнүндөгү алгачкы маалыматтарды курчап турган дүйнөнү байкап жана турмуштук иш-аракеттеринин натыйжасынан табышкан. Учурунда окумуштуулар, геометриялык фигуралардын кээ бир касиеттери башка касиеттеринен талкуу жүргүзүү жолу менен табыларын байкашкан. Ошентип, теорема жана далилдөө пайда болган."},{"t":"p","h":"Геометриялык фигуралардын түздөн-түз тажрыйбаларынан алынган касиеттеринин санын мүмкүн болушунча кыскартуучу табигый каалоолор пайда болот. Касиеттери далилдөөсүз калган ырастоолор аксиома болуп калган."},{"t":"p","h":"<span class=\"pg\" data-n=\"122\">122<\/span>Геометрия алгачкы мезгилде жогорку деңгээлде өзүнүн өзгөчө өнүгүүсүнө Египетте жетишкен. Биздин доорго чейинки биринчи миң жылдыкта геометриялык маалыматтар египеттиктерден гректерге өткөн. Биздин заманга чейинки VII кылымдан ПІ кылымга чейин грек математиктери жеке эле геометрияны кептеген жаңы теоремалар менен байытпастан, аны дагы так негиздөө үчүн маанилүү кадам жасашкан. (Геометрия, 7— 11-кл.)"},{"t":"p","h":"94. Төмөнкү текстти окуп, илимий негизди түзүп турган пассивдүү лексиканы тапкыла. Кайсы тармакка тиешелүү терминдер экенин аныктагыла."},{"t":"p","h":"Түзүлүшү менен функцияларынын өзгөчөлүктөрүн укумдан тукумга сактоочу же утур кийинкисине берүүчү организмдердеги бардык касиеттер тукум куучулук деп аталат."},{"t":"p","h":"Чочко жаңгагынан эмен өсүп чыгарын, күкүктүн жумурткасынан анын балапандары пайда болорун ар ким билет. Маданий өсүмдүктөрдүн белгилүү бир сортунун уругунан ошол эле сорттун өсүмдүктөрү өсүп чыгат. Үй жаныбарларынын породасынын касиети кийинки жумурткаларда сакталат."},{"t":"p","h":"Эмне үчүн укум-тукуму ата-энелерине окшош болот? Дарвиндин убагында тукум куучулуктун себептери толук изилденген эмес. Азыркы убакта тукум куучулуктун материалдык негизин хромосомаларда орун алган гендер түзөрү белгилүү. Ген – татаал органикалык зат, ДНКнын молекуласынын бир участогу экендигин билесиңер. Гендин таасири астында белгилер түзүлөт. Ар кайсы түрлөрдүн организмдеринин клеткаларында бирин-серин же ондогон хромосомалар, ошондой эле жүз миңдеген гендер болот. Гендер жайгашкан хромосомалар жыныс клеткаларында да, дененин клеткаларында да болот. (Жалпы биология, Э—10-кл.)"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[118,122]},{"title":"§ 30. НЕОЛОГИЗМДЕР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"123\">123<\/span>§ 30. НЕОЛОГИЗМДЕР"},{"t":"p","h":"Коомдук өзгөрүүлөргө, илимдин, техниканын, эл чарбачылыгынын, соода экономикасынын ж. б. өнүгүшү менен катар жаңы түшүнүктөр, анын атын ата- ган сөздөр лексикалык курамга кирип отурат. Тилде-) ги мындай сөздөр неологизмдер деп аталат. Алар пассивдүү катмарга кирет, анткени андай сөздөр бардык элдер үчүн түшүнүктүү болуп, пикир алышуу каражаттары катары кызмат аткарса, алар неологизм касиетин жоготуп, активдүү катарды түзүп калат."},{"t":"p","h":"(Неологизмдер лексикалык, грамматикалык, семантикалык жолдор менен пайда болот."},{"t":"p","h":"Лексикалык неологизмдер башка тилдерден атоо катары сөзмө-сөз кирип, сөздүк катарды көбөйтөт: алле, блейзер, бейсик, рейтинг, рокер, рэкет, социум, элек-) торат ж. 6.; грамматикалык неологизмдер көпчүлүк учурда эне тилдин сөз жасоо жана сөз өзгөртүү категориясынын жардамы менен, которуу жолу менен (жарым-жартылай которуу, же толук которуу}: мыйзамдык чек, социалдык фонд, чет өлкөлүк инвестициялар, нормативдик укук актысы ж. б.; семантикалык неологизмдер башка тилдердеги түшүнүктөр эне тилдеги мүмкүнчүлүктөрдү аракетке келтирип, кыргыз тилиндеги сөздөрдүн маанисин кеңейтет: мамлекеттик катчы, келечек план, жаза (штраф), упай (транспорт) ж. б."},{"t":"p","h":"95. Тексттен неологизмдерди таап, манисин түшүндүргүлө."},{"t":"p","h":"1. Кыргыз Республикасынын Премьер-министри соодадагы техникалык тоскоолдуктар боюнча макулдашуулардагы милдеттенмелерди жана Бүткүл дүйнөлүк соода уюмунун маалымат жана маалыматты жыйноо, иштеп чыгуу жана берүү бөлүгү боюнча санитардык жана фитосанитардык чараларды ишке ашыруу максатында «Бүткүл дүйнөлүк соода уюму менен техникалык регламенттерди, стандарттарды, санитардык жана фитосанитардык чараларды иштеп чыгуу, кабыл алуу жана колдонуу маселелери боюнча өз ара байланыштар боюнча маалымдама кызматын түзүү жөнүндө» токтомго кол койду."},{"t":"p","h":"<span class=\"pg\" data-n=\"124\">124<\/span>2. 2-февралда «Манас» аэропортунда Кыргыз Республикасынын Өкмөтү Түркиянын Өкмөтүнө гуманитардык жардам иретинде майыптар үчүн 100 колясканы жер титирееден зыян чеккендерге берди. газетасы, 2000-жыл, 4-февраль.)"},{"t":"p","h":"96. Тексттеги неологизмдердин мүнөзүн аныктагыла. Формативдик баалоо деген эмне жана ал суммативдик баалоодон эмнеси менен айырмаланат? 1960-жылдары Майкл Скривен тарабынан баалоонун эки туру сунуш кылынган: формативдик жана суммативдик. Билим берүүдөгү адистер баалоонун ушул баштапкы концепциясына таянуу менен баалоого тиешелүү төмөндөгү терминдерди киргизишкен. Алар мисалы: класстагы баалоо, ички баалоо, тышкы баалоо, окутуу процессиндеги баялоо, формалдык жана формалдык эмес баалоо ж.б."},{"t":"p","h":"Суммативдик баалоо – белгилүү бир убакыттын ичинде окуучулардын эмнени билерин жана эмнени жасай ала тургандыгын, эмнени билбесин жана жасай албай тургандыгын аныктоо максатында мезгил-мезгили менен жүргүзүлүп турат. Бул – окуучулардын белгилүү бир убакыт аралыгында билимди өздөштүрүүсүн жана компетенциясынын калыптанышынын деңгээлин аныктоо болуп саналат. Суммативдик баалоонун айрым түрлөрүнө: мамлекеттик сертификациялоо экзамендери, чейрек, жарым жылдык жана көчүрүү экзамендери, теманы өткөндөн кийинки текшерүү иштери кирет. Баалоонун кайсы түрүнүн маанилүү экендигине карабастан, ал билим берүү процессинин айрым жактарын гана баалоого жардам берет. Суммативдик баалоо формативдик баалоодон айырмаланып, окутуу процессине өзгөртүү, оңдоо киргизүүгө ылайыксыз.Суммативдик баалоодон айырмаланып, формативдик баалоо окутуу процессинин ажырагыс бөлүгү болуп эсептелет. Формативдик баалоонун стратегиясы ар түрдүү форматтарда байкалса да, анын суммативдик баалоо усулдарынан белгилүү бир деңгээлде айырмачылыктары бар. (Окуучуларды баалоо. Жаңыча мамилелер жана усулдар: Алымова А., Буркитова А. Мугалимдер үчүн окуу-методикалык курал ж.б. – Б., 2010. 156 6.)"},{"t":"p","h":"97. Төмөнкү неологизмдерди сөздүктөрдөн карап, маанисине түшүнүп, сүйлөмдөр түзгүлө."},{"t":"p","h":"<span class=\"pg\" data-n=\"125\">125<\/span>Фристайл, фуете, холдинг, чипсы, шарм, шоу, шейпинг, экю, дисплей, дискет, диаспора, килобайт, кондоминат."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[123,125]},{"title":"§ 31. КЫРГЫЗ АДАБИЙ ТИЛИ ЖАНА АЛАРДЫН ЖЕРГИЛИКТҮҮ ДИАЛЕКТИЛЕР МЕНЕН КАРЫМ-КАТЫШЫ","blocks":[{"t":"h3","h":"§ 31. КЫРГЫЗ АДАБИЙ ТИЛИ ЖАНА АЛАРДЫН ЖЕРГИЛИКТҮҮ ДИАЛЕКТИЛЕР МЕНЕН КАРЫМ-КАТЫШЫ"},{"t":"p","h":"Адабий тил жалпы элдик тилдин негизинде калыптанат. Ал бардык диалектилер үчүн түшүнүктүү болгон, тилдик нормаларга (фонетикалык, орфографиялык, грамматикалык ж. б.) баш ийген, мамлекеттик, коомдук иштерди жүргүзүүгө ийкемдүү болгон орток тил болуп саналат. Ал эми диалектилерди адабий тилден айырмалап турган тилдик-территориялык белгилери боюнча аныктайбыз. Айрым бир аймакта жашаган эл тилдик өзгөчөлүккө ээ болуу менен адабий тилден ажырымда экендиги байкалат. Мындай айырмачылык жергиликтүү өзгөчөлүккө учуроо менен ал жерде жашаган адамдар үчүн байкала бербейт. Бирок коомдук иштерди аткаруу учурунда, жазуу иштеринде, окутууда кагаздарын толтурууда, массалык маалымат каражаттарында пайдаланууга ийкемсиз. Анткени коомдук иштер адабий тилдин нормасында аткарылуу менен, адабий норманын чегинде бардык элдер үчүн түшүнүктүү, ынанымдуу болууга тийиш."},{"t":"p","h":"Жергиликтүү тилдик өзгөчөлүктөрдү диалектилер деп айтабыз. Кыргыз тилинде түндүк жана түштүк диалекти деген эки чоң топ бар экендигин билесиңер. Ал эми территориялык жактан анча чоң эмес аймактагы тилдик өзгөчөлүктөр говорлор деп аталат. Кыргыз тилинде Чүй, Талас, Ысык-Көл, Нарын, Тогуз-Торо, Чаткал ж. б. говорлор бар."},{"t":"p","h":"Тилдик өзгөчөлүктөрдү адабий нормадан айырмалап турган фонетикалык, лексикалык, грамматикалык белгилери боюнча бөлөбүз. Эгерде адабий нормадан айрым бир тыбыштык жагынан гана өзгөчөлөнүп турса, ал фонетикалык диалектизм деп аталат: Тоо// тош, суу//суш, көлдө/ /кэллз, сызгыч//чызгыч, сагыз// чаккыч, кэм//кэм, маки//баки, пияз//мияз, үбөлүк// увалик, галош/ /калиш, баар/ /бапор, депкир//капкир, тарелка/ /далинке ж. б."},{"t":"p","h":"<span class=\"pg\" data-n=\"126\">126<\/span>Адабий нормадан түшүнүктү атоо учурунда сөз катары айырмаланып калган болсо, анда лексикалык диалектизмдер деп аталат: Балапан//жөжө//чыбый; кур// белбоо; свйке//иймек//сырга; музоо//торпок; акча// пул; денгелек//кылдырек; чака//челек; таз//кал, сокур//кер ж. б."},{"t":"p","h":"Адабий нормадан айрым бир грамматикалык категориялардын колдонулушу боюнча айырмачылыкка ээ болсо, ал грамматикалык диалектизмдер деп аталат: ушул жерде//ушуетте, бул жакта//буетте, келет// келеттер, келе жатат//келе жатыры, башынан// башыдан, куурдак//куурма, ачыма /ачкыл."},{"t":"p","h":"Диалектилик сөздөр адабий тилдин ар тараптан өнүгүшүнө тиешелүү даражада түрткү болот, бир аймактагы жок түшүнүктөр – атоолор экинчи аймакка тароого, адабий тилдин базасын кеңейтүүгө шарт түзөт, тилде синонимдин катарларын пайда кылат."},{"t":"p","h":"М и сал ы: чыны деген сөз менен катар пиала, эрин менен катар илеп, төмөн (адам) сөзү менен пас, сөйкө менен бирге иймек, сулуу менен чырайлуу ж. б. сөздөр катар синонимди байытып келет. Түштүк аймактагы айрым өсүмдүктөрдүн аттары адабий нормада болбогондуктан алар адабий сөздөрдүн өзүнчө катарын түзүп калды: бээ, алма, анар, пахта, инжир ж. б."},{"t":"p","h":"Диалектизмдер керкем адабий чыгармаларда окуя болуп жаткан доорду, кейипкерлер жашаган чөйрөнү, анын кулк-мүнөзүн ж. б. чагылдырыш үчүн атайын ыкма катары пайдаланылат. М и с а л г а, өзүңөр окуп келген Т. Касымбековдун «Сынган кылыч» жана «Келкел» тарыхый романдарындагы диалектизмдер өзүнүн доору, аймагы менен шайкеш."},{"t":"p","h":"98. Төмөнкү диалектилик кепте жазылган сүйлөмдөрдөгү диалектизмдерди түрлөргө (фонетикалык, лексикалык, грамматикалык) ажыраткыла. (Бул материал Б. М. Юнусалиевдин «Тандалган эмгектер», Фрунзе, 1985, 270-б. илимий монографиясынан алынды)."},{"t":"p","h":"1. Ушуйетте тушлуп, ушуетте кэттэ болгонруз, ич жакка барган эмеспиз. 2. Эми шалыны (күрүчтү) мына эки айдап, көң салдык, сушкамдадык, ылаймач (баткак) кылып септик. 3. Муну гэлэ гөш менен жэнчтик (гэл гөш (гол – майда гөш – өгүз) майдалап, топурагын жанчтык <span class=\"pg\" data-n=\"127\">127<\/span>деген мааниде) 4. Чаар-Таш, Ак-Сери эйлеш лерде мал баккамын. 5. Ол курулуш болгон эмес, талаада жатып, талаада багып, кечеси менен, күндүзү менен күтүп баккамбыз. б. Анан жэйлшмө-жэйлөш багып, дал шул етектерге багып, Орто-Төбөдө келериз. Т. Ак эмгек иштечи эдек да. 8. Ана шулорду багып кегеммин да,"},{"t":"raw","h":"<div class=\"gloss\"><p> (|) (|) <\/p><\/div>"},{"t":"p","h":"99. Төмөнкү сөздөрдү диалектилик-тилдик өзгөчөлүккө карай топторго белуштургуле. Адабий тилдеги синонимин, диалектизмин коюп, сүйлөмдөр түзгүлө, кайсы говорго тиешелүү экенин байкагыла."},{"t":"p","h":"Күйөш, баратыры, жайлош, (айлана-чөйрө, квартал), аташ күрөк (кычкач) (кыпчыкей), шайлоо (сайлоо), зардек (сабиз), жүрүң, жакандос (жер төшөк), ише (шише), зыя (сыя), оногу (ал), моногу (мына бу), барыштылар, бадбод {чоң кесе), айза (найза), атасыга, атасыны, атасыда, атасыдан."},{"t":"p","h":"100. Төмөнкү тексттеги диалектизмдердин стилдик колдонулуш максатын байкагыла, синонимин коюп көргүлө."},{"t":"p","h":"– Ошого ичим күйөт да, кайсы күнү кызым ол эҗекейлердин үйүгө сув алып келип бериптир. Мен шунча алаам кылып, ону жекирип койдум. Өзүмө жардам бербейт анан каяктагы..."},{"t":"p","h":"Бардык аялдар Ажар эжени кетире койбой тегеректеп алышты."},{"t":"p","h":"– Жанындагы шеригичи?"},{"t":"p","h":"– Нуржандыкы таңды-кеч тиктегени эле китеп, кагаз. Ачкосун тагып алат көзүнө. Менин тилим да кевейт аспырантур беле, бир балаа деген окуу бар имиш, шондо окууга барат имиш."},{"t":"p","h":"– И-и, баса, ол эжекей өзүям раса күчтүү деп калышат, аа?"},{"t":"p","h":"– Оо, келиндер,— деп бек улантты сөзүн Ажар эже,— онон көрэ, шол эки мейман эжекейди колдон келишинче сыйлап жүргөн дурус. Бирэвдүн элиде мусаапыр болуп жүрөттүр."},{"t":"p","h":"– Ырас, ыймандуу, акыл-эстүү кыздар, бовосо биздин шу тов-таштарыбыздын арасында иштегени келибатты эле, шартыга конуп,- дешип жайма-жай сөздөр сүйлөнө баштады. (Б. С.)"},{"t":"p","h":"101. Төмөнкү сүйлөмдөрдөгү диалектизмдерди да озгечелугуне карай талдагыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"128\">128<\/span>_1. нич ким жок экен. 2. Ойагы жантакзар, буйагы чычырканакзар экен. 3. Бир жүзү алтымыш жыл өттү."},{"t":"p","h":"4. Онон нарагы калып каган. 5. Жигирмоэ бешинчи жылдары кэн чыккан. б. Ушу кэндин чыкканыга элдик жылдан ашты. 1; Мурда келип кешлеп кеткен дешет."},{"t":"p","h":"8. Жамгырдын сушуну толтуруп коюп, эгин сугарып, тиричилик кылган экен. 9. Бозунач эгиз (бийик) жерге чыгат. 10. Сары сапил (өсүмдүк) болот кэтта тошлордо дечү эделери, биз көрбөдүк. (Б. Ю.)"},{"t":"p","h":"102. Өзүңөр жашаган аймакта адабий нормадан айырмаланган тилдик өзгөчөлүк барбы? Болсо аларды мугалимиңер менен бирдикте талдап көргүлө, адабий тилден эмнеси менен айырмаланарын айткыла."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[126,128]},{"title":"§ 32. КЫРГЫЗ ОНОМАСТИКАСЫ ЖАНА АНЫН КОЛДОНУЛУШУ","blocks":[{"t":"h3","h":"§ 32. КЫРГЫЗ ОНОМАСТИКАСЫ ЖАНА АНЫН КОЛДОНУЛУШУ"},{"t":"p","h":"Ономастика – энчилүү аттар жөнүндөгү илим. Энчилүү аттар бир канча түргө бөлүнөрү силерге белгилүү. Адам аттары, жер-суулардын, жылдыздардын, мекемелердин, мамлекеттердин, басылмалардын ж. б. аттары атайын коюлуп, өзүнчө бир мааниге ээ. Ар бир аттын коюлушу белгилүү бир коомдук, тарыхый же дагы бир шартты туюндурат. Биздин күнгө чейин келип жеткен энчилүү аттардын айрымдарынын сыры бизге белгилүү болсо, айрымдарыныкы белгисиз, чечмеленүүнү талап кылат. Адам аттарынын кээ бирлери башка тилден кирип, түшүнүксүз кала бергендери бар: Жамал – сулуу, ажарлуу, Абды – кул, Азиз – урматтуу, кымбат, Аким – кудурети күчтүү, Кадыр – урмат, нарк, Зуура – Чолпон ж. б. аттар араб сөздөрү болуп эсептелсе, кыргыз элинин жашоо-шартына карай: Большевик, Колхозбек, Артелбек, Шайлоо, Космосбек ж. б. аттар пайда болгон. Орус тилинин таасири менен ал тилден жина ал аркылуу башка тилдерден да аттар келип кирген: Спартак, Аида, Венера, Радмир, Альбина ж. б."},{"t":"p","h":"Жер-суулардын аттары өзүнчө бир чечмелееге муктаж. Байыртадан келе жаткан Ат-Башы, Нарын, Дөрбөлжүн, Жалал-Абад, Күрмөнтү, Долоноту, Ысык-Көл, Кара-Суу, Каракол ж. б. аттардын келип чыгышы кызыгууну туудурат. Айрымдары легендалар менен байланышса, <span class=\"pg\" data-n=\"129\">129<\/span>кээси илимий тактоонун натыйжасында чеч- ‚ меленет."},{"t":"raw","h":"<div class=\"gloss\"><p>ты. чы.<\/p><\/div>"},{"t":"p","h":") Нарын жана Дөрбөлжүн кыргыз жана монгол тил- ' деринде бирдей кездешүү менен, Нарын – ичке, кууш ‚ дегенди билдирсе, Дөрбөлжүн – төрт чарчы дегенди ' туюндурат, Кара деген сөз монгол тилинде чоң, кол – монгол тилинде суу деген түшүнүктү берет. Демек, Ка- ‚ ра-Суу да, Каракол да синоним – Чоң суу деген туюмду! билдирет. Абад – шаар (араб тилинде), Жалал – адам (аты же таштак, демек, Таштуу шаар же Жалалдын шаары, -ты мүчөсү -луу менен синонимдеш. Күрмөнтү таштак менен синоним, Долоноту долонолуу менен синоним. Ысык-Көл жөнүндөгү ар кандай легендаларды негиз кылып албасак, илимий жагынан туздуу, тонбо- гон деген мааниге шайкеш келет."},{"t":"p","h":"Ошентип, ономастика жалпысынан энчилүү ат- ‚ тар жөнүндөгү илим болуу менен, бир канча тармакка р бөлүнөт. Адам аттары – антропонимика, суу аттары – ‚ гидронимика, жер аттары – топонимика, жылдыздардын аттары – космонимика илимдери болуп аталат."},{"t":"p","h":"108. Төмөнкү аттар эмнеден улам келип чыккандыгын баамдап, айтып көргүлө."},{"t":"p","h":"Дүйшөмбү, Дүйшөкан, Шейшембек, Шейшекан, Шаршембай, Шаршекан, Бейшембек, Бейшегүл, Жумабай, Жумагүл, Ишембек, Ишенгүл, Жекшенбек, Жекшекан."},{"t":"p","h":"104. Өзүңөр жашаган жерлердин, суулардын аты эмне үчүн ушундай аталгандыгын айыл адамдарынан сурап тактагыла."},{"t":"p","h":"105. Чолпон-Ата деген жердин аты тууралуу легендага көңүл бургула. Бул сыяктуу легендалардын варианттарын чогултуп, класста талкуу, аңгеме-дүкөн кургула."},{"t":"p","h":"Азыркы Чолпон-Ата шаары турган жерде бир кедей адам жашаган экен. Ал байдын малын багып оокат кылуучу дейт. Көпкө чейин балалуу болбой, жашы улгайып бара жатканда, бир кыздуу болот. Ал абдан сулуу, эстүү болуп бой тартат. Кызы чоңоюп келе жатканда, апасы дүйнөдөн көзү өтөт. Абышка менен кызы катуу кайгырат, бирок айла жок, тирүүчүлүк өтө берет, кызы Чолпон экөө эптеп күн өткөрүп, оокат кечирет."},{"t":"p","h":"<span class=\"pg\" data-n=\"130\">130<\/span>Күндөрдүн биринде ошол тегеректеги бай адам Чолпондун сулуулугуна, акылдуулугуна суктанып, бой тартып келе жаткан кызга куда түшөт. Атасы да ага каршы болбойт. Кыязы, жетишпеген жашоодон өзү да кыйналса керек, кызым кыйналбаса деп ойлогон го. Кызы ары айтып, бери айтып, байга, анан калса, жашы өтүп калган адамга баргысы келбегенин түшүндүрсө, атасы көшөрүп болбой коёт. Ошентип, ата-баланын ортосу сууй түшөт."},{"t":"p","h":"Күндөн күн өтет. Атасына түшүндүрө албаган кыз бир күнү атасы мал артынан кеткенде, тоого чыгып, көз жашын көлдөй төгүп, бул жашоодон аша кечип, тоодон боюн таштамакчы болот. Эңкейип секире берер абалында ал ташка айланат да, калат."},{"t":"p","h":"Кечинде атасы үйгө келсе, кызынан дайын жок. Ана келет, мына келет менен кыйла убакыт өтөт. Айылдагылардан сураса, эртең менен тоого бет алганын айтышат. Атасы күйүгүп тоого чыкса, таш болуп катып калган Чолпон эңкейип турат. Картайганда көргөн кызынын абалын керген атасы сакалынан жаш агызып ыйлап турат. Же кемпири болбосо, кызынан тирүүлөй ажыраса, айласы куруган чал да секирип өлгүсү келет. Ошол учурда жалгыз кызынан ажыраган абышка да ташка айланат."},{"t":"p","h":"Күн ачык турганда Чолпон-Ата шаарынын үстүндөгү тоонун кырында энкейип турган кыз жана секирип келе жаткан сакалдуу адамдын элеси катып турат дейт. Мына ушул жерди айылдагылар Чолпон жана атасынын элесинен Чолпон-Ата деп атаган экен байыркы заманда. (Жомок.)"},{"t":"p","h":"106. Бул үзүндүнү окуп, семантикалык талдоо жүргүзгүлө (көп маанилүү, өтмө маанилүү, синонимдик, омонимдик, антонимдик маанилердин түгөйүн тапкыла), стилине ажыраткыла."},{"t":"p","h":"«Кечинде атасы келди. Ал балдарынын муңайым кейпинен улам, бир жосун болгонун билди. Ичинен сызып, үндөбөдү."},{"t":"p","h":"– Асылгүл кайда? Уктап калдыбы? Эрте жаткан го?"},{"t":"p","h":"– деди, өзүнүн мыжылганын билдирбегендей."},{"t":"p","h":"Баары үнсүз баш ийкеди. Атасынын үнүн угаары менен Асылгүл ордунан ыргып турду да, чуркап келип мойнуна асылып, солуктап ийди:"},{"t":"p","h":"– Апамдын түркүгүн кыям деп... Апамдын түркүгү..."},{"t":"p","h":"– Ким? Качан?"},{"t":"p","h":"<span class=\"pg\" data-n=\"131\">131<\/span>Бирөө да батынып жооп бере албады, бышактап ыйлай башташты."},{"t":"p","h":"Аялы албууттанып коё берди:"},{"t":"p","h":"– Мен кыям дедим! Мына мен! Эмне, союп жейсиңби? Мына мен, уктуңбу? Мен кыям дедим! Апамдын түркүгү деп коюшат, кастарлап коюшат! Өзүңөр жутуп алган апаңардын ордуна ушул чириген сөңгөк апа болуп береби? – Кичине тынып алды да, кайра өкүрдү: – Апаңар өлгөн, аны эчак жуткансынар! Ал келбейт! Өлгөн киши тирилмек беле! Түркүк деген отунга да жарабайт, чирип калыптыр. Апаңар елген дейм, өлгөн..."},{"t":"p","h":"...Атасы баягы каргашалуу күндөгүдөй, Асылгүлдү бооруна кысып: «Эмне дейсиң?» – деп бакырып алды. Дене-боюн калтырак басып, өзүн токтото албай калчылдап жатты. Анан Асылгүлдү боорунан бошотту да, бир да жолу колу тийбеген, тиймек турсун өйдө карап ооз ачпаган аялын жулмалап кирди. Эч бир аяган жок, башка-көзгө койгулай берди."},{"t":"p","h":"Жаңы апа кокуйлап өкүрө баштады. Элдер чогулуп калышты, экөөнү араң ажыратышты. Жаңы апа, өгөй апа, дагы эле алкынып жүрөт:"},{"t":"p","h":"– Апаңарды жуткансыңар! Ал өлгөн!"},{"t":"p","h":"Жаңы апаны алкынтып элдер ары алыйп кетишти. Ал ошол бойдон кайрылып келбеди... Ошонун эртеси эле атам менен Асылгүл ноокастап, төшөккө жатып калган. Араң айыгышкан...» (Б. У.)"},{"t":"p","h":"107. Текстти окуп, өтмө маанидеги сөздөрдүн маанисин туюндургула. Энчилүү аттар жөнүндө айтып бергиле."},{"t":"p","h":"Жаратылыш Чыңгыз Айтматовдун калеминин сыйкырдуу күчү менен жанданып, таң калтырып, өзүнүн табигыйлыгы, башта байкалбаган жомоктогудай сыры менен, жаңылыгы менен адамды Өзүнө тартып турат. Жазуучу өзүнө мүнөздүү ийкемдик менен жаратылыштын өзгөчө дүйнөсүнө сүңгүп кирип, анын улуулугун, көркөмүн, жандүйнөсүн кадимкидей түшүнүп, аны окуучусуна аңтарып ачып берет. Айталы, Чыңгыз Айтматов бизге «теректердин бөтөнчө үндүү жандүйнөсүн», жер адамынын кубаныч-кайгысын өзүнө батырган Жер эненин дүйнөсүн ачып көрсөттү. Гүлсарынын сезимтал дүйнөсүчү! Анын ар бир кыймылын автор художниктик <span class=\"pg\" data-n=\"132\">132<\/span>көрөгөчтүк менен тартып, «жандүйнөсүнүн» абалы менен сырткы аракетин гармониялаштыруусучу? Мындайды элес алуу, байкоо жан-жаныбарларды чын дилден сүйгэн адамда гана болушу мүмкүн. Повесттеги Гүлсарыны үйрөтүү жана майрамдагы Аламан байгени сүрөттөгөн учурларды эле эске түшүрөлүчү... Бул өзүнчө эле бир чоң сүйүүгө жуурулган поэзия го! Ал эпизоддордо Гүлсарынын күлүктүк касиети бүтүндөй ачылып, анын ар бир кыймылы психологиясына шайкеш. Ал эми эң негизгиси – ошол сценалардан Гүлсарынын өзүнүн кожоюну Танабай менен болгон сезимди козгогон ынактыгынын чыга келүүсү. Автор эч кандай аша чабуусуз, жасалгалабай эле алардын өз ара түшүнүүлөрүн, жан-биргеликтерин билгичтик менен чебер сүрөттөйт. Танабайдын ички дүйнөсүндө болуп жаткан уйгу-туйгу сезимдердин бардыгы анын атына өтүп турат. «Гүлсарыны минип баратканда Танабай эл көзүнө көйрөңдөнүп коюудан тартынбады. Сымаптай чайкалган жоргонун үстүндө кеойренденбеске чара барбы? Аны Гүлсары да жакшы сезчү. Айрыкча жакага түшүп келатканда, эгин талаасында иштеп жүргөн топ келин жолукса, аларды алыстан көрө сала Танабай ээр үстүндө боюн түзөп, үзөңгүнү чирене тээп, чалкалай олтурат да, тизгинди бошотот. Ээсинин кыймылын Гүлсары да сезе коёт, арымдап жоргосун күүлөп жиберет»."},{"t":"p","h":"108. Тексттеги кара тамга менен басылган сөздөрдүн омоним, полисемия, синонимдерин тапкыла. Энчилүү аттар жөнүндө билгениңерди бышыктап айтып бергиле."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[129,132]},{"title":"САМЫНДЫН ТАРЫХЫ","blocks":[{"t":"h3","h":"САМЫНДЫН ТАРЫХЫ"},{"t":"p","h":"Самын мындан 400 жыл мурда Байыркы Египет, Кытай, Вавилон, Ассирия элдеринде кир нерсени тазартуу үчүн пайдаланылып келген. Биздин заманга чейинки XVI кылымдагы байыркы Египетте самынды дары-дармек катары колдонгондугу белгилүү."},{"t":"p","h":"Мурдагы доорлордо бук карагайынын күлүнө эчкинин, койдун, өгүздүн майын кошуп жасаган самынды өтө пайдалуу дары-дармек жана косметикалык май катары <span class=\"pg\" data-n=\"133\">133<\/span>баалап келишкен. Ошол эле учурда аны жууганга да колдонушкан."},{"t":"p","h":"Орто кылымда самын өндүрүү Франциянын Марсель шаарында пайда болгон. Самын Россияга Петр 1нин падышачылыгынын мезгилинде келген. Самындын жакшысы менен жыттуусун бай, төбөл адамдар гана пайдаланышкан. Ал эми карапайым эл жыгачтын күлүнө ысык суу куюп, отко коюп аралаштырат да, андан пайда болгон коймолжун затты самын катары колдонушкан."},{"t":"p","h":"Кыргыз элине самынды соодагерлер Кытай тараптан алып келип турушкан. Көбүнчө алабата чөбүн өрттөп, анын күлүн малдын майы менен аралаштырып кайнатып, самын жасап пайдаланышкан."},{"t":"h3","h":"<span class=\"pg\" data-n=\"134\">134<\/span>МОРФОЛОГИЯ ЖАНА КЕП МАДАНИЯТЫ"},{"t":"h3","h":"§ 33. ЭТИШТИН ТАТААЛ ФОРМАЛАРЫ"},{"t":"p","h":"Этиштин татаал формалары эки же андан ашык этиш сөздөрдүн бир мааниге бириккен тобу аркылуу уюшулат. Бирок алардын тутумун түзүп турган бөлүктөрү берген маанилери боюнча бирдей даражада болбойт. Алардын бири кыймыл-аракеттик негизги маанини билгизет да, калгандары анын маанисин толуктайт, грамматикалык жактан ал маанини жыйынтыктайт."},{"t":"p","h":"Ушул өзгөчөлүгүнө байланыштуу алар өз ара н егизги жана жарда мч ы этиштер болуп бөлүнөт:"},{"t":"p","h":"1. Көк майсаңдан жай алган чакан айылдан анча алыс эмес жердеги капчыгайдан салт атчан киши чыга келди. 2. Өзөндүн баш-аягынан агылып эл келе баштады."},{"t":"p","h":"Мында кыймыл-аракет жөнүндөгү негизги түшүнүк чакчыл формасындагы алардын биринчи түгөйлөрү (чыга, келе) аркылуу берилди. Ал эми экинчи түгөйлөрү аларга кошумча маани киргизүү менен грамматикалык жактан жыйынтыкталды."},{"t":"p","h":"Демек, негизги жана жардамчы этиштер маанилик жана грамматикалык жактан өз ара ажырагыс болуп уюмдашып келип, кеңири маанидеги кыймыл-аракетти билдирсе, этиштин татаал формалары деп аталат."},{"t":"p","h":"Негизги жана жардамчы этиштер өздөрүнүн лексикалык маанилери жагынан болсун, грамматикалык түзүлүшү жагынан болсун, бири-биринен айырмалуу. ч ш сш маанилерин дайыма сактайт да, чакчылдын -а// -е// Негизги этиштер лексикалык баштапкы -й жана -ып, -ганы формаларында турушат. Мындай чакчыл формалар, биринчиден, негизги жана жардамчы этиштерди өз ара байланыштырса, экинчиден, <span class=\"pg\" data-n=\"135\">135<\/span>’ этиштик татаал формаларды уюштурууда негизги каражат болуп эсептелет: 1. Эси эки болгон баатырың, оозун ачып туруп калды. 2. Кайрадан эл тынчый түштү."},{"t":"raw","h":"<div class=\"gloss\"><p>об ЫЕ ЫТЫ ЧЕ<\/p><\/div>"},{"t":"p","h":"3. Баатырлар ортого чыгышып, бет алышып тура калышты. (Ч. Н.)"},{"t":"p","h":"Мисалдардагы баса белгиленген чакчыл формасындагы этиштердин алгачкы лексикалык маанилери сакталган жана сөз болуп жаткан окуядагы кыймыл-аракеттин негизги түшүнүгүн билдирип турат. Ошондуктан, этиштин татаал формасынын тутумундагы мындай этиштер негизги этиштер деп аталат."},{"t":"p","h":"Жардамчы этиштер өздөрүнүн баштапкы лексикалык маанилеринен, негизинен, алыстаган болот да, негизги этиш билдирген түшүнүктү маани жагынан толуктоо, жыйынтыктоо кызматын аткарат. Грамматикалык түзүлүшү жагынан жардамчы этиштер көбүнчө жак жана чак формалуу келишет. Тагыраак айтканда, негизги этиш тарабынан берилген кыймыл-аракеттин кайсыл жак тарабынан жана качан аткарылгандыгын да билдирет. Демек, жардамчы этиштер төмөнкүдөй белгилерге зэ: 1) баштапкы лексикалык маанисинен ажыраган болот да, абстракттуу мааниде колдонулат;"},{"t":"p","h":"2) негизги этиш аркылуу берилген кыймыл-аракеттин кайсы жак тарабынан аткарылганын жана качан аткарылганын (кайсы чакта экенин) билдирет; 3) негизги этишке кошумча маани киргизет (негизги этиш аркылуу берилген кыймыл-аракеттин кандайча мүнөздө болуп өткөнүн, болуп жатканын, болорун}; 1. Төпө баатыр тер баскан атын моюнга чапкылай, жай гана четке чыга берди. 2. Анын канталаган тумшугу жакындап келип калган душманга оро-пара келе түштү."},{"t":"p","h":"3. Тобурчак четти көздөй ойт берип, жеништуу кишенеп жиберйи. (Ч. Н.)"},{"t":"p","h":"Мисалдардагы белгиленген жардамчы этиштер (түштү, берди, жиберди) аттан тушту, алма берди, үйгө жиберди деген сыяктуу өзүлөрүнүн баштапкы лексикалык маанилерин сактабастан, негизги этиш билдирген түшүнүктөрдүн кандай мүнөздө өтүшүн (күтүлбөгөн жерден тез аткарылганын) билдирип турат. Экинчиден, кыймыл-аракеттин үчүнчү жактагы субъект тарабынан аткарылгандыгын, ошондой эле сөз <span class=\"pg\" data-n=\"136\">136<\/span>болуп жаткан учурдан алда канча мурда болуп өткөндүгүн көрсөттү. Демек, мындай этиштер жардамчы этиштер деп аталат."},{"t":"raw","h":"<div class=\"gloss\"><p>чш \"Ше ЫШ ч ЧЧ ыы ы чы<\/p><\/div>"},{"t":"p","h":"Негизги этиштер канчалык лексикалык алгачкы маанисин сактаганына карабастан, этиштик татаал форманын тутумунда турганда, жардамчы этиш сыяктуу эле ез алдынча колдонула албайт. Анткени анын мааниси жардамчы этиштер аркылуу гана жыйынтыкталат, такталат. Ошондуктан алар өз ара ажырагыс болуп тутумдашат да, бир гана кыймыл-аракеттик татаал маанини туюндурат. Ошондой эле экөө биригип, сүйлөмдүн бир гана мүчөсүнүн милдетин аткарат."},{"t":"p","h":"Этиштин татаал формалары көбүнчө эки сөздөн ‚ турса, айрым учурларда үч сөздөн да болушу мүмкүн. Мындай учурда, анын биринчи түгөйү негизги этиш катары келет да, калган экөө жардамчы этиштин милдетин аткарат: 1. Өр чапчып чыккан аттар антаңдап ' дем алып, кэзэде токтой калып жатты. (И. М.) 2. Экинчи балбаныбыз да жеңилип, биз кубана албай турабыз. («ЛЖ»)"},{"t":"p","h":"Мисалдардагы этиштик татаал формаларда негизги маани биринчи түгөйлөрү (токтой, кубана) аркылуу берилди да, калган түгөйлөрү (калып, жатты, албай турабыз) алардын маанисин толуктоо, тактоо үчүн жардамчы, кошумча маанилерде колдонулду."},{"t":"p","h":"Негизги жана жардамчы этиштердин өз ара орун алуу багыты да туруктуу, б. а., негизги этиш дайыма мурун, ал эми жардамчы этиш андан кийин орун алат."},{"t":"p","h":"Эскертүү Чакчылдар менен жак формасындагы этиштердин айкашы (катар келиши) дайыма эле этиштин татаал формасын түзө бербейт: 1. Жигит не дээрин билбей оңтойсуздана күлдү. 2. Жигит не дээрин билбей, оңтойсуздана баштады."},{"t":"p","h":"Жогорку кара менен басылган этиштер бири экинчисине карата бирдей эле каражат (чакчылдын -а формасы) аркылуу байланышканына карабастан, анын биринчисинде этиштердин (оңтойсуздана кулду), ар бири өзүнүн лексикалык баштапкы манилерин сактап турат. Ошондуктан алар маанилик жактан бири экинчисине көз каранды эмес. Сүйлөмдө жеке-жеке сүйлөм мүчөсүнүн милдетин аткарат. Ал эми экинчи учурда жак формасындагы этиш (баштады) өзүнүн лексикалык <span class=\"pg\" data-n=\"137\">137<\/span>баштапкы маанисинен алыстап калган. Ошондуктан мындай этиштер негизги этишке карата дайы- › ма маанилик жактан көз каранды болот да, аны менен ' ажырагыс биримдикте колдонулуп, этиштин татаал формасын түзөт. Демек, мындай түзүлүштөгү катар) келген этиштерде алардын жак формасындагы түгөйүнүн өз алдынча лексикалык мааниге ээ, же ээ эместиги чечүүчү ролду ойнойт."},{"t":"p","h":"Төмөнкү мисалдарга көңүл буралы: 1. Кыз жетпей койду да, кыткылыктап кулду. 2. Аял жылмайып ицндебеди. 3. Кыз чуркап кетти. А. Аял жылмайып койду."},{"t":"p","h":"1-2-мисалдардагы этиштердин ар бири өз алдынча мааниге ээ болсо, 4—4-мисалдардагы этиштер татаал ‚ формалуу этиштер."},{"t":"raw","h":"<h4 class=\"mk\">(1<\/h4>"},{"t":"p","h":"Негизги жана жардамчы этиштердин өз ара байланышуу жолдору да, жогоруда айтылгандай ар түрдүү. Аларды төмөнкүдөй схема аркылуу туюндурууга болот."},{"t":"p","h":" и * -И Негизги этиш ып Жардамчы этиш"},{"t":"p","h":"– ‚ -ганы. ‚ \"МЫШ"},{"t":"p","h":"109. Текстти окуп, андан атиштин татаал формаларын ажыраткыла жана алардын мүнөздүү белгилерин айтып бергиле:"},{"t":"p","h":"а) тутумундагы негизги жана жардамчы этиштерди ажыраткыла;"},{"t":"p","h":"б) негизги жана жардамчы этиштердин ар бирине кеңири мүнөздөмө бергиле."},{"t":"p","h":"1. Кечкирип келе жаткан. 2. Жоломан экөөбүз коюбузду бөлүп алдык да, жон ылдый куюлтуп женей бердик."},{"t":"p","h":"3. Жер алай-дүлөй түшүп, кардуу бороон ышкырып турган. 4. Бети-башыбызды тумчулап, араң жүрүп келебиз."},{"t":"p","h":"5. Бир кезде мен артыма бурулуп карай калдым. 6. Уч карышкыр булак этип, жонго чыга түштү да, так #оломандын коюнун тушунан качырып сала берди. 7. Мен көре коюп, чыйылдаган жапыз үнүм менен кыйкырып калдым эле, бирөө жалт кайра тартты. 8. Жоломан болсо көрбөйт, тебетейин көзүнө баса кийип алыптыр, жерди <span class=\"pg\" data-n=\"138\">138<\/span>карап келет. 9. Мен чуркап жеткиче, аки карышкыр эки-үч койдун куйругун жулуп жиберип, бирден койду бөлүп алып, сайды карай зыркыратты. 10. Жоломан ошондо гана көрүп калды да, узап кеткен карышкырдын артынан кыйкыра жөнөдү. 11. Карышкырлар алактап, анда-санда жалт этип, артын карап коюп, койдун куйругун кызыл ала кылып, кыйратып кетип барат. 12. Жоломан терезе аркылуу асман тиреген алыскы кырка тоолорду телмирип карап баратты. 13. Өсүп-чоңойгон жери ошол тоолордун ары жагында, ыраакта калгансып жатты. 14. Ал өз сагыныч-кусалыгын ошол тоолорду карап тараткандай болду. 15. Бирге өсүп, бирге чоңойгон курбулары жакын эле жүргөндөй сезилип кетти. 16. Тууган жердин жыты келе калды. 17. Ошого кубанып, өзүнөн өзү эреркей түштү."},{"t":"p","h":"18. Эми анын өмүрү да дал ушул кырка тоолор болгон өрөөндөргө окшоп экиге бөлүнгөнсүп кетти. 19. Аял ушуга окшогон түркүн ойлордун кучагында термелип келет."},{"t":"p","h":"20. Бир кезде эмнегедир кыздын чыканактай далысын тиктеген калыбында ойлоно калды. 21. Менин кызым да ушундай болуп калгандыр."},{"t":"p","h":"– Эчедесиң, карагым? 22. Кыз ошол замат чочугандай артын жалт карап алды, бирок ошол эле замат аялдын мээримдүү ырайынан жалтана түштү."},{"t":"v","l":["– Он терттемун,— нары карап кетти кыз.","– Кайда бара жатасың, калкам?","– Таласка."]},{"t":"p","h":"«Кашка жерден тура!» – аялдын деми сууй түштү. ГЭ. М.)"},{"t":"p","h":"110, Көп чекиттин ордуна сүйлөмдүн маанисине ылайык келүүчү этиштин татаал формасынын тиешелүү түгөйүн койгула."},{"t":"p","h":"1. Экөө караңгыда темселеп жүрүп, куурап түшкөн чегедектерден бир далай чогултуп.... 2. Булактын боюна жакын шамал тийбеген ыктоого от... салышты. 8. От алоолоп күйгүчөктү сууган аттарды суунун боюна тушап ... беришти. 4. От барган сайын алоолонуп, денеге жагымдуу бир аптап таратып ....о. Абага көтөрүлгөн түтүн көөдөй асманга житип көрүнбөй ... жатты. б. Бекежан тилке-тилке болуп кесилген сан этти чегедектин үстүнө калап таштап .... (И. М.) Т. Кош-беш айтышып жөнөгөнү... алиги жигит. 8. Күлсүн да ордунан ... баштады."},{"t":"p","h":"<span class=\"pg\" data-n=\"139\">139<\/span>(«КМ») 9. Профессор колун ... берди эле, спиртке малынган марлини кармата .... 10. Кыздын акырегинен тартып, киндигине чейин эки-үч жолу дыкаттап сүртүп ‚ 11. Менин денем болор-болбос ... түштү. 12. Хирургдун колундагы скальпель жүрөктүн тушундагы кабыргалардын ортосун жиреп .... 13. Профессор Ахунбаен биринчи кимдин жүрөгүнө операция жасады экен деген ой бүт денемди аралап .... 14. Буга байланыштуу бир көргөн элес көз ирмемдей бет алдыма... калды. (М. С.)"}],"sub":[{"title":"МОРФОЛОГИЯ ЖАНА КЕП МАДАНИЯТЫ","b":5}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[133,139]},{"title":"§ 34. ЖАРДАМЧЫ ЭТИШТЕРДИН ТҮРЛӨРҮ","blocks":[{"t":"h3","h":"§ 34. ЖАРДАМЧЫ ЭТИШТЕРДИН ТҮРЛӨРҮ"},{"t":"p","h":"Татаал этиштин тутумунда турган жардамчы этиштердин колдонулушундагы кошумча маанилери бирдей эмес. Мына ушул өзгөчөлүктөрү боюнча алар кыймыл-аракеттин узакка созулушун, багытталышын жана толук иштелишин билдирүүчү жардамчы этиштер өлүп үчкө бөлүнөт."},{"t":"p","h":"1. Кыймыл-аракеттин узакка созулушу жат, отур, тур, жүр жана бер деген жардамчы этиштер аркылуу уюшулат да, анда кыймыл-аракеттин бүтүшү же бүтүү чеги көрсөтүлбөйт: жүрүп отурду, бара жатты, окуп жүрдү."},{"t":"p","h":" бар деген жардамчы этиштер чакчылдар формасындагы 2. Кыймыл-аракеттин багытталышында кел, кет, негизги этиштер менен айкалышып, кыймыл-аракеттин бир жакка багытталышын билдирет: кирип келди, жөнөп кетти, айта бар."},{"t":"p","h":"Бирок жогорку маанилерди билдирүүдө негизги этишке жалгануучу чакчыл формалар менен жардамчы этиштердин өз ара айкалышуу мүнөзү кыргыз тилинде бир кылка эмес, өтө ар түрдүү. Демек, ал маанилерди билдирүүчү жардамчы этиштер жана алардын чакчыл формалар менен айкалышуу мүмкүнчүлүктөрүн схема аркылуу төмөнкүдөй чагылдырууга болот."},{"t":"p","h":"3. Кыймыл-аракеттин качандыр бир мезгилде же сөз жүрүп жаткан учурда толук иштелип бүткөндүгү татаал этиштин тутумундагы ташта, сал, кой, жибер, кал, чык, бол, ал деген жардамчы этиштер аркылуу <span class=\"pg\" data-n=\"140\">140<\/span>' уюшулат: окуп чыктык, карай калды, ырдап жиберди, айтып салды."},{"t":"raw","h":"<div class=\"gloss\"><p> <\/p><\/div>"},{"t":"p","h":"Негизги этишке жалгануучу Жардамчы этиштер жана"},{"t":"raw","h":"<h4 class=\"mk\"> чакчыл формалар |-а |-й |-ып<\/h4>"},{"t":"p","h":"алардын түрлөрү Кыймыл-аракеттин узак- ка созулушун билдирүүчү жардамчы этиштер"},{"t":"p","h":"Кыймыл-аракеттин багытталышын билдирүүчү жар-"},{"t":"v","l":["дамчы этиштер","","Кыймыл-аракеттин толук","иштелгенин билдирүүчү","жардамчы этиштер","","сал","жибер (ий, ир)","чык","ташта","кой","кал","ал","бол"]},{"t":"p","h":"Таблицада этиштин терс формасынан (-ба) кийин жалгануучу чакчылдын -й формасындагы негизги этиш менен жардамчы этиштин айкалышы берилген жок, анткени мындай учурда жардамчы этиштер кошумча мааниси боюнча кандайдыр бир бөтөнчөлөнгөн жаңы мааниге ээ боло албайт."},{"t":"raw","h":"<div class=\"gloss\"><p>Эскертүү: 140<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"141\">141<\/span>111. Тексттеги жардамчы атиштердин кандай маанилерде колдонулганын аныктагыла жана аларды маанилик түрлөрү боюнча көчүргүлө."},{"t":"p","h":"1. Бала кезу ачык бойдон магдырап жата берди."},{"t":"p","h":"2. Анын көңүлүн айнытып албайын дегенсип, эне унчукпай калды. 8. Комуз черткен бала эмне кыларын билбей, ал да момоюп отура берди. 4. Бир маалда Абдыракман башын көтөрө калды."},{"t":"p","h":"– Черт!"},{"t":"p","h":"5. Баланын колундагы комуздун кылдары жүрөктү сайгылап, дирилдей баштады. 6. Бул убакта бирин-сериндеп келген кишилер үйгө толуп кетти. Т. Бала черткен бул күү Талас өрөөнүндө белгилүү болуп бараткан."},{"t":"p","h":"8. Келгендер күү аяктаганча, тынч угуп отурушту."},{"t":"p","h":"9. Күү аяктап калган. Аңгыча Султаналы кирип келди. 10. Үйдөгүлөр жапырт туруп калышты. 11. Зуура да шашканынан колундагы чынысын таштап жиберди."},{"t":"p","h":"12. Комузду кучактай кармаган Атай гана бейкапар керегеге сүйөнүп турду. 18. Ичине муң толгон Субан Султаналыга эреркедиби, жаш балача эчкирип ыйлап жиберди."},{"t":"p","h":"112. Кал, жат, бер, кел, бол деген сөздөрдү жардамчы этиш катары пайдаланып, таблицадагы (140-б.) алар менен айкалышуу мүмкүнчүлүгүнө эз болган бардык чакчыл формаларды маанисине ылайык келген негизги этиштерге жалгоо аркылуу адегенде этиштин татаал формаларын жасагыла, андан кийин аларды катыштырып, чакан аңгеме түзгүлө. Аңгемедеги ар бир жардамчы этиштин ар башка чакчыл формадагы негизги этиштер менен айкалышуусундагы маанилерине байкоо жүргүзгүлө. Эгерде алардын ортосунда маанилик айырма болсо, анын пайда болуу себептерин түшүндүргүлө."},{"t":"p","h":"Кал жардамчы этиш катары (таблицада көрсөтүлгөндөй) төмөнкүдөй чакчыл формалуу этиш менен айкашып, татаал формалуу этишти түзөт: көрө калды, карай калды, карап калды, жеткени калды."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[140,141]},{"title":"§ 35. ЭТИШТИН ТАТААЛ ФОРМАЛАРЫНЫН ЖАСАЛЫШЫ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"142\">142<\/span>§ 35. ЭТИШТИН ТАТААЛ ФОРМАЛАРЫНЫН ЖАСАЛЫШЫ"},{"t":"p","h":"Этиштин татаал формалары негизги этиштерден жана жардамчы этиштерден жасалат."},{"t":"p","h":"М иса л ы: Вертолёт Аламенгунун ак кар, көк муздуу ашуусун ашып, булуттан ары көрүнбөй, .добушу угулбай кеткенден кийин деле бүткөн бою калчылдап, калыбына келе албай жатты. (Аргасын түгөтүп келаткан коркунучтан Акбара улуп жиберди. Чон боз бабырган жаңы талпынган балапандарын ээрчитип, бирине бири үн салып, улам бир жерге конуп-учуп журушет. (Ч. А.)"},{"t":"p","h":"Бул сүйлөмдөрдөгү кара менен басылган чакчыл формасындагы этиш сөздөрдүн алгачкы лексикалык маанилери сакталган жана ошондой эле сөз болуп жаткан окуядагы кыймыл-аракеттин негизги түшүнүгүн туюндуруп турат."},{"t":"p","h":"М иса л ы: Беккул болуп бир топ балдар жугуруп барып, кок шибердин арасында жайнап калган буудайды тоокчо терип жеп жатышты. Чуркураган чаржайыт үнйөр уламдан-улам кучей берип, жаман уйду которуп кетишти. Бурмаке бөкчөңдөп, калтыраган кары колу менен кыдырып, ооруларга суу берип жүрөт. (М. 9.)"},{"t":"p","h":"Бул сүйлөмдөрдөгү жатышты, кетишти, жүрөт деген жардамчы этиштер керебетке жатышты, үйгө кетишти, тоодо журет сыяктуу өзүлөрүнүн баштапкы лексикалык маанилерин сактабастан, негизги этиш билдирген түшүнүктөрдүн кандай мүнөздө өтүшүн туюндуруп турат. Ошондой эле кыймыл-аракеттин үчүнчү жак тарабынан аткарылгандыгын, сез болуп жаткан учурдан мурда болуп өткөндүгүн билдирип турат."},{"t":"p","h":"Этиштин татаал формалары эки сөздөн гана эмес, үч сөздөн да жасалышы ыктымал. Мында биринчи сөзү негизги этиштен, ал эми калган экеб жардамчы этиштерден жасалат."},{"t":"p","h":"М исалы: Людмила Зыкина жаратылышынан берген талантты тынбаган эмгеги менен өргө тартып, ездештиуруп жүрүп отурган. Ярославлда суйуктии <span class=\"pg\" data-n=\"143\">143<\/span>ырчысын тарт саат бою пристанда эл жык-жыйма болуп кетпей, жаандын жааганына карабай күтүп турушкандыгы эле Людмила Георгиевнага болгон элдин суйцусц өчмөк тургай, кайра ого бетер тутанып жаткандыгын көрсөтүп турбайбы. («КТ»)"},{"t":"raw","h":"<div class=\"gloss\"><p>нн. ЧИ н ЭЧЕ СЕ ЧЕ СЕ СЕ СЕ ЭЕ ЧЕ ЭЕ ЭЕ ЕЕ ть ын к р ү ү ү ү ү р ЫС ЫС СЕ ЭЕ СЕ<\/p><\/div>"},{"t":"p","h":"Сүйлөмдөрдөгү этиштик татаал формаларда негизги маани биринчи түгөйлөрү (өздөштүрүп, тутанып) аркылуу берилди да, калган сөздөр (жүрүп отурган, жаткандыгын көрсөтүп турбайбы) алардын маанисин толуктоо, тактоо максатында кошумча мааниде колдонулду."},{"t":"p","h":"Этиштин татаал формаларынын жасалышында негизги жана жардамчы этиштердин өз ара орун алуу багыты да туруктуу, тактап айтканда, негизги этиш дайыма мурун, ал эми жардамчы этиштер андан кийин жайгашат."},{"t":"p","h":"Чакчылдар менен жак формасындагы этиштердин айкашы же катар келиши дайыма эле этиштин татаал формасын жасай бербейт."},{"t":"p","h":"М ы: Атасы уулунун суроосуна ыңгайсыздана жылмайды. Атасы уулунун суроосуна ыңгайсыздана тушту."},{"t":"p","h":"Кара менен басылган этиш сездер бири экинчисине карата бирдей эле каражат (чакчылдын -а формасы) аркылуу байланышканына карабастан, анын биринчисинде этиштердин (ынгайсыздана жылмайды) ар бири өзүнүн лексикалык баштапкы маанилерин сактап турат. Ошон үчүн алар маанилик жактан бири экинчисине көз каранды эмес. Сүйлөмдө жеке-жеке сүйлөм мүчөсүнүн милдетин аткарат. Ал эми экинчи вариантында жак формасындагы этиш (түштү) өзүнүн лексика у ЭШ ЧЕ ЧЕ СЕ ыыы ЭТ р А калык алгачкы маанисинен алыстап калган. Ошондук- ажырагыс биримдикте колдонулуп, этиштин татаал формасын жасайт. Демек, мындай түзүлүштөгү катар үнүн ёз алдынча лексикалык мааниге за, же ээ эмести- келген этиштерде алардын жак формасындагы түгөй- ги негизги милдетти аткарат. баттуу урду. @. Апасы кызынын билгичтигине ичинен кубанып жылмайды. 3. Ит бейтааныш адамга кара- Мисалы: 1. Ит бейтааныш адамга карата айтан мындай этиштер негизги этишке карата ар дайым маанилик жактан көз каранды болот да, аны менен"},{"t":"raw","h":"<div class=\"gloss\"><p>ЧЕ чү че чү чүт ы Чү чү че чч чн н», чы чы ы<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"144\">144<\/span>та уруп жатты. 4. Апасы кызынын билгичтигине ку- ‚ банып турду. Мындагы алгачкы эки сүйлөмдөгү этиш сөздөрдүн ар бири (айбаттуу үрдү, кубанып жылмайды) ’ Өз алдынча турганда мааниге ээ, ал эми акыркы эки сүйлөмдөгү этиш сөздөр татаал формалуу этиштер болуп саналат."},{"t":"p","h":"118. Тексттердеги этиштин татаал формаларынын тутумундагы негизги жана жардамчы этиштерди белгилегиле. Негизги жана жардамчы этиштердин мүнөздүү белгилерин айтып бергиле. Эки кана уч сөздөн жасалган этиштин татаал формаларын өз-өзүнчө жазгыла."},{"t":"h3","h":"ЖЫЛКЫ"},{"t":"p","h":"1 7 Жуматай Көк-Түздө чачырап жүргөн жылкылардын четине келгенде асмандагы кара булуттар ого бетер оордоп, аба ным тарта баштаган эле. Ана, так тебеден чарт жарылып, күн күркүрөдү. Кандайдыр бир дөө шапалак менен булуттарды тиле-тиле чаап жаткансып, булут арасына көз уялткан тилимдер түштү..."},{"t":"p","h":"Жылкылар кошкуруп, туяктар дүпүрөй баштады. Мына, кара айгыр айбаттуу кишенеди. Ал бээлерди бир жерге үйрүп аткандай. – А-а-а-у-у!.. Түнкүсүн, тоо арасында, карышкыр алыстан улуса да, бүт тоо жаңырыктап, карышкырдын кайдан улуп атканы билинбей калат. Жылкылар кайсы тарапка агыларын билбей, Көк-Түздүн орто ченинде дүпүрөп турганын сезди бала. Көөдөй ТЕ ден алардын карааны көрүнбөйт, ажыратып болбойт. А-а-а-у-у!.. – Бут тоо жанырыктады."},{"t":"p","h":"Жылкылар дүпүрөп, төрдү кездей салганын сезди бала. Ошондо ал шашкалактап атын теминип, жылкыларды тосмой болду. ‚Бирок астындагы аты улам мүдүрүлүп, көзгө сайса көрүнгүс түндөн сестенип, чуркачудай амес. „Ошондо ал жонундагы мылтыгын ала коюп, асманга каратып туруп атып жиберди. Ошо тапта, асман да күрс-тарс этип, мылтыктын атылганын басып кетти. Чагылгандын көз уялткан нуру Көктүздү эки-үч курдай жайлап өттү. Бала жылкылар төрдүн оң тарабындагы Көк-Жарды көздөй жапырылып баратканын көрө койду. Жүрөгү шуу эте түштү. Анткени ал жер өтө бийик эле, <span class=\"pg\" data-n=\"145\">145<\/span>агер андан жылкылар учса, бири да тирүү калмак эмес. Жардын түбүндөгү коргулга түшүп, баарынын талпагы жайылмак."},{"t":"p","h":"– Ка-а-айт! Ка-а-айт! – Жуматай эки колун оозуна сурнай сыяктанта болгон кудурети менен кыйкырды. – Ка-а-айт! Баланын үнүн уктубу, Кара айгыр кишенеп жиберди. Анан туяктар дүпүрөй калып токтоп калышкансыды. Ка-а-айт! – Бала болгон үнү менен дагы айкырды. Ана, туяктар кайра тилге кирди, дүбүрөй баштады. Жуматай жылкылардын дүбүртү жакындап келатканын сезди. Кубанганынан дагы айкырды: – По-по-по-о-о-о-0!"},{"t":"p","h":"Дүбүрт өтө чукул кирип келгенсиди. Калың жылкынын селдей каптаган илеби билине баштады. Ошо тапта, алдындагы тору ат келаткан калың дүбүрттөн сестенип, кошкуруп, өзүнөн өзү эле балага ээ кылбай, тизгинге баш ийбей, үстү жактагы этекти көздөй чыга берди. Тигине, миң сан дүбүрт, кошкурук-бышкырык жер дүңгүрөтүп кирип келди да, алиги бала турган жерден селдей каптап өтө берди..."},{"t":"p","h":"П"},{"t":"p","h":"Жуматайдын торуга аябай ачуусу келип, аны камчы менен башка-көзгө койгулап, тилдеп атты. Бирок үрккөн жылкылардын калың дүбүртүнөн анын үнү да, камчысынын чыпылдаганы да угулбады. Калың дүбүрт эми батыш тараптагы жыш карагайды көздөй бет алды."},{"t":"p","h":"– А-а-а-у-у-у-у! – Карышкырдын кайдан улуп атканы белгисиз, бүт тоо кайрадан жаңырды. Калың дүбүрт уламдан-улам алыстап баратты. Жуматай карышкыр жалгыз эмес экенин, алар дал ошол калың карагай тараптан улуп атканын сезген эле."},{"t":"p","h":"– Ка-а-айт! Эми жаны чыга дагы кыйкырды. Бирок анын үнү калың дүбүрттөн жылкыларга угулмак эмес. Ошондо ал мылтыгына чапталуу кур дурметтен дагы салып, жылкылар кетип бараткан тарапты каратып туруп атып жиберди да, соңунан: —Ка-а-айт! – деп бакырды. Дүбүрт улам акырындап, улам акырындап барып токтоп калгансыды. – Ка-а-айт! – Бала эки колун оозуна сурнайдай кыла коюп, дагы бакырды. Дүбүрт токтоп калгандыктан анын үнү эми жылкыларга шашпай жетти. Тигине, <span class=\"pg\" data-n=\"146\">146<\/span>Кара айгыр баланын кыйкырыгына жооп кыла кишенеп жиберди. Кийин дүбүрт кайра башталды. Ал эми кайра жакындай баштады. Түз эле баланы көздөй келатты. Ошол кезде асман чарт жарылып, жарк-журк күн күркүрөдү. Өзүн көздөй каптап келаткан калың жылкыны бала даана көрдү. Эми, кубангандай дагы кыйкырды."},{"t":"p","h":"Тигине, калың дүбүрт чукулдай берген кезде тору ала качып, кайрадан четке чыга берди... Жылкылар шуу-шуу этип, баланын тушунан дагы өтө берди. Эми алар кайрадан Көк-Жарды көздөй бет алды. Баланын кыйкырыгы калың дүбүрттөн угулмак эмес, бирок ал жаналы калбай кыйкыра берди. Тизгинге ээ бербей алып жүрүп кеткен торуну башы-көзүнө карабай камчыга алды. – А-а-у-у-у!"},{"t":"p","h":"– Тоолор кайрадан улуй баштады. Жылкылар ого бетер үркүп, дүбүрт күчөдү. Ал дүбүрт уламдан-улам алыстай баштады. (О. А.)"},{"t":"p","h":"114. Төмөнкү тексттен атиштин татаал формаларын жана жөнөкөй этиш сөздөрдү тапкыла. Этиштин татаал формаларынын жасалышын аныктагыла."},{"t":"p","h":"„.. Асман кур-р, шар-р этип, кайрадан калайман түштү. Кара айгыр баштаган жылкылар калың тилке болуп удургуп баратканын көрдү. Эми бала алдындагы торуну сабалап, алардын артынан айкырып чаап жөнөдү. Көзгө сайса көрүнгүс боло түшкөн көөдөй түндө ат жакшы чуркай албады. Ошентсе да камчынын уусу өтүп кеткен жаныбар мүдүрүлгөнүнө карабай чуркап баратты."},{"t":"p","h":"– Ка-а-айт! – Баланын үнү дагы угулбай калды. – Ка-а-айт! – деди дагы."},{"t":"p","h":"Жуматай эми чаап бараткан бойдон мылтыгын дүрметтеп, асманга каратып бир койду. Артынан дагы кыйкырды."},{"t":"p","h":"Калың дүбүрт эми гана акырындап: алды жактан Кара айгырдын жылкыдан бетенче кошкуругу угулду. Бала ушу көзгө сайса көрүнгүс түндө анын кошкуругун жазбай тааныды. Ал мылтыкты чаап баратып кайра дүрмөттөп дагы атты, дагы кыйкырды. – Ка-а-айт!"},{"t":"p","h":"Ушул өз үнү өчө электе ал жылкылардын бир капталына илээшип калды. Байкаса, жылкылар оң жагында дүпүрөп бараткан экен. – Ка-а-айт!"},{"t":"p","h":"Кара айгыр дагы айбаттуу кишенеди да, жылкылардын алдын кайыра баштады. Дүбүрт акырындай берип <span class=\"pg\" data-n=\"147\">147<\/span>уюлгуй түштү. Эми бала калың жылкынын арасында калды. Сүрдүгүү, жөөлөшүү, кошкурук, бышкырыктан баланын үнү угулар эмес. Тигине, Кара айгыр кишенеп, кайра алдыга түшүп, бүтүндөй жылкы анын артынан селдей агып, келген жолу менен кайра агылды... Жылкылар өлөр-тирилерине карабай сызып баратты. Үстүндөгү баланы эчак унутуп калган тору ээлигип, эми туш келди урунуп-беринип, топ жылкыга кошулуп жин ургандай сызды. (О. А.)"}],"sub":[{"title":"ЖЫЛКЫ","b":19}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[142,147]},{"title":"§ 36. ЭТИШТИК ТАТААЛ ФОРМАЛАРДЫН ТҮРЛӨРҮ","blocks":[{"t":"h3","h":"§ 36. ЭТИШТИК ТАТААЛ ФОРМАЛАРДЫН ТҮРЛӨРҮ"},{"t":"p","h":"Чакчыл формасындагы негизги этиштер менен жардамчы этиштердин тутумунан турган этиштин татаал формалары өзүлөрүнүн берген маанилери боюнча ар түрдүү болушат: 1. Бабам Манас колдо деп, кутурган тиги калмакты качырып сала бергени."},{"t":"p","h":"2. Ниязбек калтаарыган колдору менен терин аарчыды да, күлүмүш болду. 3. Үйүр-үйүр жылкылар, жайыт толо малдарды айдап кетип жатышты. (Ч. Н.)"},{"t":"p","h":"Мисалдардагы этиштик татаал формалар кыймыл-аракеттин маанисин биринчи учурда күтүлбөгөн жерден тезинен өткөндүгүн, экинчиде жасалма мүнөздө экендигин, үчүнчүдө анын созулушун билдирип турат."},{"t":"p","h":"Этиштик татаал формалардын мындай ар түрдүү мааниде колдонулушу аларды уюштуруучу каражаттардын мүнөзүнө (негизги этишке жалганган формаларга жана көмөкчү этиштин маанилик оттенкаларына) тыгыз байланыштуу болот. Демек, ушул өзгөчөлүктөрүнө карата этиштик татаал формалар төмөнкүдөй негизги маанилик топторго бөлүнөт."},{"t":"raw","h":"<div class=\"gloss\"><p>чү чүчү ще с ЧЕ ЧЕ ЕЕЕ е ЧЕ ЭЕ Ет ү ү ч<\/p><\/div>"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[147,147]},{"title":"§ 37. КЫЙМЫЛ-АРАКЕТТИН УЗАККА СОЗУЛУШУН БИЛДИРҮҮЧҮ ЭТИШТИК ТАТААЛ ФОРМАЛАР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"148\">148<\/span>§ 37. КЫЙМЫЛ-АРАКЕТТИН УЗАККА СОЗУЛУШУН БИЛДИРҮҮЧҮ ЭТИШТИК ТАТААЛ ФОРМАЛАР"},{"t":"p","h":"Негизги этишке -а//, -е//, -й жана -ып чакчыл формалары жалганат да, ага жат, отур, тур, жур, кел, бер деген жардамчы этиштер айкашып, кыймыл-аракеттин узакка созулушун же кайталанышын билдирет:"},{"t":"p","h":"1. Жайлоонун салкын жели бир калыпта эбелектеп ойной берди. 2. Терт уйдун ортосунда акты-карады быкылдаган көп кой жуушап жатты. (М. Э.)"},{"t":"p","h":"Мисалдардан көрүнүп тургандай, мындай этиштик татаал формалар аркылуу берилген кыймыл-аракет сез жүрүп жаткан учурда бүтпөйт, анда бүтүү чеги да көп көрсөтүлбөйт. Тек гана анын ошол сез жүрүп жаткан учурда болуп жаткандыгы жана андан ары да созулары көрсөтүлөт."},{"t":"h3","h":"§ 38. КЫЙМЫЛ-АРАКЕТТИН ТЕЗДИК МЕНЕН КАПЫСТАН БОЛУП ӨТКӨНДҮГҮН БИЛДИРҮҮЧҮ ЭТИШТИК ТАТААЛ ФОРМАЛАР"},{"t":"p","h":"Тездик менен капыстан болуп өтүүчү кыймыл-аракет чакчылдын -а//, -е//, -й формасындагы негизги этиш менен туш, кал, кой деген жардамчы этиштердин ‚ жана -ып формасындагы чакчыл этиш менен жибер жардамчы этишинин айкалышынан жасалат. 1. Артыкча сак, этият келаткан Батийна сестейе калды."},{"t":"p","h":"2. Өкүнгөн, ардыккан Тургунбай жаш балача эчкирип, шолоктоп ыйлап жиберд

и. (Т. С.) 3. Бекежандын аты ийрелеңдеп барып, жээкке чыга калды. (И. М.)"}],"sub":[{"title":"§ 38. КЫЙМЫЛ-АРАКЕТТИН ТЕЗДИК МЕНЕН КАПЫСТАН БОЛУП ӨТКӨНДҮГҮН БИЛДИРҮҮЧҮ ЭТИШТИК ТАТААЛ ФОРМАЛАР","b":4}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[148,148]},{"title":"§ 39. КЫЙМЫЛ-АРАКЕТТИН АЗ ЖЕРДЕН","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"149\">149<\/span>§ 39. КЫЙМЫЛ-АРАКЕТТИН АЗ ЖЕРДЕН"},{"t":"p","h":"ИШКЕ АШПАЙ КАЛГАНДЫГЫН БИЛДИРҮҮЧҮ"},{"t":"h3","h":"ЭТИШТИК ТАТААЛ ФОРМАЛАР"},{"t":"p","h":"Кыймыл-аракеттин башталып барып аягына чыкпай, же аз жерден ишке ашпай калышы дайыма үч сөздөн турган татаал формалар аркылуу берилет. Анын биринчиси негизги маани берүүчү бөлүк катары келет да, кийинки экее аркылуу кошумча маани берилет. Грамматикалык түзүлүшү жагынан биринчи маани берүүчү негизги бөлүгү -ып, экинчиси -а//, -е формасындагы чакчылдан, үчүнчүсү жак формасындагы ташта, жазда деген маанилеш жардамчы этиштерден болот: 1. Боз чаңгыл тартып албууттанган тоо сешису Гафуну ат-маты менен көмөлөтүп коюп кете жаздайы. 2. Тиякка эрте жетели деп жатып, сени сууга агызып ала жаздайым. (И. М.)"},{"t":"p","h":"Эскертуи: Өтө аз санда болсо да кыймыл-аракеттин аз жерден ишке ашпай калышы -ып формасындагы негизги этиш менен кыймыл атоочтун -мак формасы жалганган сал, кал, жибер деген жардамчы этиштин тутуму аркылуу да уюшулат: Сиз айтпаганда, атып салмакмын. (И. М.)"},{"t":"h3","h":"§ 40. КЫЙМЫЛ-АРАКЕТТИН МАКСАТКА БАГЫТТАЛГАНДЫГЫН БИЛДИРҮҮЧҮ ЭТИШТИК ТАТААЛ ФОРМАЛАР"},{"t":"p","h":"Негизги этишке чакчылдын -ганы формасы жалганат да, ага бар, тур, кел, чык деген сыяктуу жардамчы этиштер айкашуу аркылуу бир максатка багытталган кыймыл-аракет берилет: 1. Алардын көпчүлүгү жайынча оюн-шоок көргөнү келгендер болсо, айрымдары – атайын кыз көргөнү, кыз жактырганы келгендер. (Т. С.) 2. Анан эмне, жайлоого кымыз ичип, таза аба жутуп дегендей, эс алганы келбегенде... (К. К.)"},{"t":"p","h":"Мындай маанини билдирүүчү этиштик татаал формалар аркылуу аткарылган кыймыл-аракет толук иштелип бүткөн болот."},{"t":"raw","h":"<div class=\"gloss\"><p>чү ү сч че че үлүлү ү чүч ч чт ш сы. угуп че че чү р ш с си Б ч р н<\/p><\/div>"},{"t":"h3","h":"<span class=\"pg\" data-n=\"150\">150<\/span>&amp; 41. КЫЙМЫЛ-АРАКЕТТИН ИШКЕ АШУУГА ДАЯР ЭКЕНДИГИН БИЛДИРҮҮЧҮ ЭТИШТИК ТАТААЛ ФОРМАЛАР"},{"t":"p","h":"Кыймыл-аракеттин башталууга же ишке ашууга даяр экендиги чакчылдын -ганы формасы жалганган негизги этиш менен тур, кал деген сыяктуу жардамчы этиштердин айкашы аркылуу берилет. 1. Оттун алоолонгон жалыны кичине басаңдаса эле, карышкырлар кол салганы турат. (К. Б.) 2. Бир куну Жоломан экөөбүз сүйлөшүп жатсак, койлорубуз кошулганы калыптыр. (М. 9.)"}],"sub":[{"title":"ЭТИШТИК ТАТААЛ ФОРМАЛАР","b":2},{"title":"§ 40. КЫЙМЫЛ-АРАКЕТТИН МАКСАТКА БАГЫТТАЛГАНДЫГЫН БИЛДИРҮҮЧҮ ЭТИШТИК ТАТААЛ ФОРМАЛАР","b":5},{"title":"&amp; 41. КЫЙМЫЛ-АРАКЕТТИН ИШКЕ АШУУГА ДАЯР ЭКЕНДИГИН БИЛДИРҮҮЧҮ ЭТИШТИК ТАТААЛ ФОРМАЛАР","b":9}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[149,150]},{"title":"§ 42. КЫЙМЫЛ-АРАКЕТТИН ЖАСАЛМА МҮНӨЗДӨ","blocks":[{"t":"h3","h":"§ 42. КЫЙМЫЛ-АРАКЕТТИН ЖАСАЛМА МҮНӨЗДӨ"},{"t":"p","h":"ЭКЕНДИГИН БИЛДИРҮҮЧҮ ЭТИШТИК ТАТААЛ"},{"t":"h3","h":"ФОРМАЛАР"},{"t":"p","h":"Негизги этишке атоочтуктун -ган жана кыймыл ы ще ще че е ын атоочтун -мыш мүчөсү жалгануу менен, ага бол, эт кет уюшулат: 1. Ал ыйлаганын сездирбеске тырышып, көзүн жеңи менен басып, демин ичине алып олтуруп, кууну тыңшамыш. болду. (Т. К.) 2. Сатаров эмнегедир кыңкыетамыш атти. (К. А.) деген жардамчы этиштер айкашкан этиштик татаал формалар аркылуу жасалма мүнөздөгү кыймыл-ара-"},{"t":"p","h":"§ 43. КЫЙМЫЛ-АРАКЕТТИН БҮТКӨНҮН,"},{"t":"h3","h":"ТОЛУК ИШКЕ АШКАНЫН БИЛДИРҮҮЧҮ ЭТИШТИК ТАТААЛ ФОРМАЛАР"},{"t":"p","h":"Кыймыл-аракеттин толук иштелиши, аякталышы чакчылдын -ып формасы жалганган негизги этиш менен сал, кой, чык, кал, бил, бүт, кет, ташта деген жардамчы этиштердин айкашы аркылуу берилет:"},{"t":"p","h":"1. Кабыл айтканы жатса, кемпир анын сөзүн бутурбөй жулуп кетти. (Ш. А.) 2. Мына, Бекежан иним, туней турган жерге да келип калдык,— дейи Гафу."},{"t":"raw","h":"<div class=\"gloss\"><p>Са. ы. н ы. ы ы. а.<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"151\">151<\/span>115. Тексттен этиштин татаал формаларын таап, аларды маанилик түрлөргө ажыраткыла жана ажыратуунун себептерин түшүндүргүлө."},{"t":"p","h":"1. Жунгар аскерлеринин ач кыйкырыгы кыргыз айылын үч көтөрүп кеткендей болду. 2. Ниязбек баатыр болбосо, ойроттор кыргыз айылын тыйпыл кылып чапканы турат. 3. Бирок алардын алы эмнеге жетмек."},{"t":"p","h":"4. Кечке чейин талашып олтуруп, ойроттун ханы акыры байгеден үлүшүн бөлдүрүп алып, конок болуп бербей, тоо таянып кетип калышты. 5. Кыргыздар болсо жай-жайына эс алганы тарады. б. Арадан эки күн өттү. Т. Кыргыз айылында той дагы эле уланып жатты. 8. Аңгыча майдандын борборуна кула айгыр минген карыя чыга келди."},{"t":"p","h":"9. Эл тымтырс боло түштү. 10. Аксакал кула жоргону салдырып четке чыга берди. 11. Майдандын ортосуна эл коштогон үн менен бир кара тоголок баатыр чыга келди. 12. Кайрадан эл тынчый түштү. 18. Тиги тараптан сайышка денеси чулу бир жаш жигит чыкканы калган."},{"t":"p","h":"14. Аңгыча андан озунуп, бир узун жоокер майдандын ортосуна чаап чыкты. (Ч. Н.)"},{"t":"p","h":"116. Тексттеги этиштин татаал формаларынын жасалыш жолдорун аныктап, ошого ылайык алардын кандай мааниде колдонулганын айтып бергиле. Ал маанилердин кандай каражаттар аркылуу уюшулганын түшүндүргүлө."},{"t":"p","h":"1. Мына! Кырдын жогорку мизи оттук тийгендей чачыла түшкөнсүдү. 2. Тоонун кырбуусун бирөө тиретип жаткандай, чачыраган оттуу нур өрөөнгө аба жарып төгүлүп түштү. 3. Күндүн нуруна адеп чайынган кыр-кырлар кызара бөртүп күлүп жибергенсиди. 5. Заматта тоо арасына өмүр-жашоонун жылуу демин үйлөп кеткенсиди. (И. М.) 6. – Деле унута албай койдуң,— деди эркек таарынгандай. 7. Аял эмне кылам дегендей улутунуп койду. 8. Экөө эмне жөнүндө сүйлөшүштү билбей туруп калышты. 9. Сөздөрү ушуну менен бүтүп калгандай болду. 10. – Менин белем бар эле. Тиш доктор болчу. Ошко кетип калыптыр,- өкүнүмүш болду. Аял үндөбөдү."},{"t":"p","h":"11. – Ушинтип эле кирип калдык,-— деди эркек оңтойсуздана. 12. – Келип тургула,— деди аял баягысындай эле."},{"t":"p","h":"13. – Телефон аркылуу кабарлашып турсаң. 14. Эркек башын ийкеди. Үндөшпөй калышты. Аял ордунан козголгону калды. Эркек алактап шашып кетти. 15. – Кубаттан <span class=\"pg\" data-n=\"152\">152<\/span>сени сурап калсам: – Жүрөт, чоң болуп кеткен,— дейт. Аял жылмайган болду. (Б. У.)"},{"t":"p","h":"117. Муну да жогоркудай иштегиле."},{"t":"p","h":"1. Кош тарабын арчалуу аска курчаган капчыгай бара-бара тээ ылдыйда чалкып жаткан Талас өрөөнүнө кошулуп кетет. 2. Айткандай эле, Таласың жер соорусу турбайбы,— деп койду жолоочу өзүнчө. 3. Кош капталы чер токой, бууракандап агат дайрасы, ал тараптан соккон салкын жел жолоочуну элиртип жиберди. 4. Жигит ажайып кооздукка дагы бир сыйра карап алды. 5. Жигит аттын башын түз эле ошол боз үйгө бура тартты. 6. Эшик алдында жаткан чоң сары тайган азууларын арсайта ырылдап коё берди. Т. Ордунан атып туруп, чындап эле качырганы калды. 8. Чукул кирип келген кашка айгыр жалт берди. 9. Байкоосуз келаткан жигит ат үстүнөн ооп кала жаздады. 10. Ал аңгыча үйдөн ак сакалын жайкалткан карыя чыга келди. 11. Сөөктүү кең далысына чапанын желбегей жамынып алыптыр. 12. Аргымагың туйлатып, Таласка келип калыпсың, баатыр. Байбиче, коноктун атын ал да, орун салып жибер. 18. Арадан үч күн өтүп калган. 14. Акыры той болор күн да келип жетти. 15. Өрөөндүн баш-аягынан агылып ал келе баштады."},{"t":"p","h":"16. Айылдан алыс эмес жерде бир үйүр жылкы жайылып жүрдү. 17. Түшкө жуук кыргыздардын айылына калмактар келип түштү. Өздөрүнчө үй тигип, чардап жатып калышты. 18. Оюн-зоок болот деп жарчылар чууну салганда гана, алар кыргыздарга жандап барган болушту."},{"t":"p","h":"19. Ал аңгыча кең көкүрөк, бою пас айгыр минип, ортого окторулуп чыга келди калмактын баатыры. 20. Ниязбек баатыр токтоно албай атына ыргып мингенин өзү да сезбей калды. (Ч.Н.)"},{"t":"p","h":"118. Этиштик татаал формалар канча сөздөн турганын аныктагыла, алардын негизги жана жардамчы түгөйлөрүн атап, кандай мааниде колдонулганын айтып бергиле. Ал маанилердин кандай каражаттар аркылуу уюшулганын түшүндүргүлө."},{"t":"p","h":"1. Ормон асманды карап койду. 2. Мына ошол карашында көзүнө көпүрө менен келаткан аял уруна түштү."},{"t":"p","h":"3. Суусардын өзү. Ормондун картайып бараткан жүрөгү бир жолу туйлап алды. 4. Бул керунуш согуш жылдарында калып кеткен башка бир көрүнүштү элестетип <span class=\"pg\" data-n=\"153\">153<\/span>жиберди Ормонго. 5. – А-а, сенсиңби, Суусар,- деди ал жылмайымыш болуп. (М. Га.) 6. Кечке иштеп чарчагандыктан жен эле кыйшайсам, уйкуга жүрүп кеткени турам. (Н. Б.) Т. Көек мелжиген аскарлуу тоолор мунарыкка сүңгүп кетет. (Ч. Н.) 8. Бир нече жолу ишин таштап кетип кала жаздады. (И.М.) 9. Аңгыча жайытта жүргөн бардык мал күтүрөп, короого да айдалып келип калды. (М. Э.) 10. Тайызга жакындаганда, Гафунун аты жээкке чыга качканы калган эле. (И.М.)"}],"sub":[{"title":"ФОРМАЛАР","b":2},{"title":"ТОЛУК ИШКЕ АШКАНЫН БИЛДИРҮҮЧҮ ЭТИШТИК ТАТААЛ ФОРМАЛАР","b":5}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[151,153]},{"title":"КЕП МАДАНИЯТЫ","blocks":[{"t":"h3","h":"КЕП МАДАНИЯТЫ"},{"t":"p","h":"Айтуучу же жазуучу кандайдыр бир окуя, кубулуш жөнүндө сөз кылганда, андагы айтылып жаткан ойдун) кырдаалына жараша кыймыл-аракет ар кандай мүнөздө ‚ өтүшү мүмкүн. Айталы, капысынан, чукулунан, же узакка созулган, кээде аз жерден ишке ашпай калган, же жасалма мүнөздө ж.б. кыймыл-аракет аркылуу берилүүчү мындай маанилер тилде, негизинен, этиштин татаал формалары аркылуу ишке ашырылат."},{"t":"p","h":"Мисалы: эжем шаардан келди – эжем шаардан келип калыптыр – эжем шаардан келгени жатат."},{"t":"p","h":"Биринчи мисалдагы жөнөкөй этиште кыймыл-аракеттин тек гана болуп өткөндүгү көрсөтүлсө, экинчи учурда анын этиштин татаал формасы аркылуу берилишинде капыстан, күтүлбөгөн жерден болуп өткөндүгү, ал эми үчүнчүсүндө кыймыл-аракеттин ишке ашууга даяр экендиги жөнүндө маанилер берилди. Демек, этиштик татаал форманы колдонуу кыймыл-аракеттин кандайдыр бир езгече түрдүк маанилерин берүү зарылдыгы менен тыгыз байланыштуу болот."},{"t":"p","h":"Этиштин татаал формаларынын маанилик жактан түрлөнүшү боюнча анын уюшулушунун, негизинен, төмөнкүдөй жолдорун белгилөөгө болот."},{"t":"p","h":"1. Жардамчы этиштердин негизги этиштерге карата болгон ошол учурдагы маанилерине (оттенокторуна) байланыштуу."},{"t":"p","h":"М иса л ы: жур, жат, тур деген жардамчы этиштер негизги этиштер менен айкашып, негизинен, узакка созулуучу, дайыма болуп туруучу маанини бил- <span class=\"pg\" data-n=\"154\">154<\/span> дирет: келип жүрдү, окуп жүрөт, ойлоп жатты, келе жатат, кун жаап турат, карап турду ж. 6."},{"t":"raw","h":"<div class=\"gloss\"><p>=ч ы ы аы лы илы а. ал. а ы ал „чыг ы с ч с<\/p><\/div>"},{"t":"p","h":"Ал эми жибер менен айкашкан негизги этиштер кыймыл-аракеттин тездик менен аткарылганын билдирет: чаап жиберди, атып жиберди."},{"t":"p","h":"Жаздады (таштады) жардамчы этиши негизги этиштеги берилген кыймыл-аракеттин аз жерден ишке ашпай калганын туюндурат: жыгылып кете жаздабы, айтып коё жаздады ж. б."},{"t":"p","h":"2. Негизги этишке жалгануучу чакчыл жана кыймыл атоочтук формалар да этиштин татаал формаларынын маанилик жактан түрлөнүшүнө таасир тийгизет: жазып салды,"},{"t":"v","l":["Эркин отту","жаза салды"]},{"t":"p","h":"Биринчи учурдагы чакчылдын -ып формасы аркылуу уюшулган этиштик татаал формада кыймыл-аракеттин толук иштелиши жай мааниде берилсе, экинчи учурдагы анын -а формасы аркылуу уюшулушунда р ы чүч ы ы чш кин кыймыл-аракеттин капысынан болгондугу, тездик ме- зарылдыгын, алардын маанилеринин турленушун жана ал маанилерди берүүдөгү тилдик каражаттарды туура өздөштүрүү үчүн жогорку учурларды эске алуу талап пайдалана билүүнүн жолдорун практикалык жактан кылынат. нен иштелгендиги көрсөтүлдү."},{"t":"p","h":"Демек, этиштик татаал формаларды колдонуунун"},{"t":"p","h":"119. Этиштик татаал формаларды женекей этиштерге айландыргыла жана алардын ортосундагы мванилик айырмачылыктарды түшүндүргүлө. Этиштик татаал форманы колдонуунун зарылдыгы эмнеде?"},{"t":"p","h":"Канчык кызуусу менен муйцзден бошонуп чыкты. Канчык кызуусу менен мүйүздөн бошонду."},{"t":"p","h":"1. Канчык кызуусу менен мүйүздөн бошонуп чыкты, дөбөттүн артына жашынам деп баратып, өзүнөн өзү томолонуп кетти. 2. Жаратынын ооруганына чыдабай кыңшылап, капталын тиштегилеп жиберди, турган ордунда уюлгуп, <span class=\"pg\" data-n=\"155\">155<\/span>чарк айлана баштады. 3. Өзү менен өзү алек болуп калды, эмнегедир чайпала кетип да жатты. 4. Дебет ага карагысы келбеди. 5. Маралдын тамагынан куюла баштаган кандан көзү өтүп баратты. 6. Өзүнүн жараатын өзү тиштеп, ийиктей тегеренип кала берген канчыкка карап да койбоду. Т. Ысык кандын куйкум жытына мас болгон көңүлү аны ого бетер ожерлентуп баратты. 8. Ашуунун алдына келгенде, Марал акактап жүрбөй калды, чубуруп агып бараткан канынын токтобогонунан алсырап баратты. 9. Солуктап туруп калды. 10. Эми көк жал аларды мурдагыдай кез келди качырып сала бербеди. 11. Маралдын кансырап жыгыла турган учурун күттү. 12. Ак Бугу кебелбей жатып алган карышкырды бир нече ирет качырып сүрдүктүрдү. 13. Бирок ойт берип чыга берген кек жалга мүйүзү да жетпей жатты. 14. Барган сайын кансырай берген маралын алдына салып айдап алды. 15. Кыламык кар жааган бийик ашуунун боорунда үч караан ээрчишип бийиктей беришти. 16. Ак Бугу мындай өжөр карышкырды мурда көрбөгөн чыгар. (И. М.)"},{"t":"raw","h":"<div class=\"gloss\"><p>ЧИ\" ҮЧ сы ЧЕ Б ч ашы лы аы ыч<\/p><\/div>"},{"t":"p","h":"120. Тексттеги жөнөкөй этиштерди негизги этиш катары пайдаланып, анын маанисине ылайык келүүчү жардамчы этиштерди тапкыла да, этиштик татаал форма түрүндө өзгөртүп түзгүлө. Экөөнүн ортосундагы маанилик өзгөчөлүктөрдү түшүндүргүлө."},{"t":"p","h":"Марал эң акыркы кучун жыйнап обдулуп турду. – Марал эң акыркы кучун жыйнап обдулуп тура калды."},{"t":"p","h":"Биринчи учурда кыймыл-аракеттин тек гана аткарылышы берилсе, экинчи учурда анын аткарылышынын капыстан, тез арада болуп өткөндүгү жөнүндө маани берилди."},{"t":"p","h":"1. Марал эң акыркы күчүн жыйнап обдулуп турду."},{"t":"p","h":"2. Кар баскан ашууга кетүүчү чыйыр жолду карай жан талашты. 3. Көпкө чыдабады. 4. Казандай ташты аттап өтүүгө чамасы келбей, бөк түшүп жыгылды. 5. Марал ыйлагандай көз жашын чубуртту. б. Тумандай баштаган көзүнүн тушунан аны жыттап, энтигип турган Ак Бугунун жылуу демин сезди. 7. Айла канча, эң акыркы каны менен асыл жанынын кошо чыгышын күттү. 8. Ал күткөн мүнөт да келди. 9. Жашоонун булагы какшыды."},{"t":"p","h":"<span class=\"pg\" data-n=\"156\">156<\/span>10. Жана эле суналып бой керген кара көз марал заматта солуган сулп этке айланды. 11. Ак Бугу көргөн көзүнө ишенбеди, төрт бутун сунуп кыймылсыз жаткан маралды түрткүлөп айланчыктады. 12. Кандын жытына чыдабай, жер чапчып өңгүрөдү, жанындагы таштарды туш келди ызалуу сузгуледу. 13. Анан акмалап аңдып турган көк жалды дагы качырды. 14. Карышкыр каарына келген Ак Бугудан жаа бою дыргаяктап качты. (И. М.)"},{"t":"p","h":"121. Этиштик татаал формалардын тутумундагы жардамчы этиштерди сүйлөмдүн жалпы мазмунун бузбастан, мүмкүн болгон башка жардамчы этиштер менен алмаштыргыла. Алардын тексттеги жана кийинки озгерген варианттарындагы маанилерин салыштыргыла. Эгер маанилик жактан өзгөрсө, анын себебин түшүндүргүлө."},{"t":"v","l":["Үлгү:","","—— турат.","жатат.","Кун конектоп жаап кирди.","келди.","—— жиберди."]},{"t":"p","h":"Биринчи эки учурда (жаап турат, жаап жатат) кыймыл-аракеттин эбактан башталып, дагы узакка созулары, экинчи эки учурда (жаап кирди, жаап келди) кыймыл-аракет жаңы гана башталгандыгы жөнүндө берилди. Ал эми үчүнчү учурда (жаап жиберди) кыймыл-аракеттин тездик менен капыстан болуп өткөндүгү көрсөтүлдү. Демек, жогорку атиштик татаал формалардын маанилик жактан өзгөрүшү андагы колдонулган жардамчы этиштердин мааниси менен байланыштуу каралат."},{"t":"p","h":"1. Күн көнөктөп жаап турат. (К. Б.) 2. Ал онтоп, ынкыстап, чалкасынан созулуп жата берди. (Т. С.) 3. Чотурдун башы маң, бир азга дендароо боло түштү да, колундагы акты кагаздарын тытып салды. («КМ») 4. Андан ары жөн-жайды сураштыра кетти. (И. М.) 5. Алар тоодон айдалып келген малдарды бат эле санап коюшту. (М. Э.) 6. Чатырдан алыс эмес, шамал тийбеген ыктоого от жагып салышты. ?. От алоолоп күйгөнчөктү сууган аттарды суунун боюна тушап коюшту. (И. М.) 8. Баланын көзү комуздан өтүп баратты. (К. К.) 9. Ниязбек <span class=\"pg\" data-n=\"157\">157<\/span>белестин кырына чыкканда, Талас өрэөнү ажайып көрүнө баштады. {Ч. Н.)"},{"t":"p","h":"122. Айт, кел, күл, ойно, оку, укта деген сөздөрдүн ичинен үчөөнү негизги этиш катары пайдаланып, аларды мүмкүн болгон грамматикалык формалар аркылуу өзгөртүп, мүмкүн болгон жардамчы этиштердин айкашында сүйлөм түзгүлө. Алардын ар бир учурдагы маанилерине мүнөздөмө бергиле жана ал маанидердин келип чыгышындагы факторлорду түшүндүргүлө. Эгер, мүмкүн болсо, теменкудей схеманы пайдалансаңар да болот."},{"t":"p","h":"Г——* + а баштады. + а койду."},{"t":"p","h":"+ а салды."},{"t":"p","h":"Эшмат айылдагы досуна кат жаз – + ып койду. + ып таштаны. +ып жиберди. + ып турат, —— +ганы жүрөт. 123. Этиштик татаал формалардын тутумундагы негизги этиштердин грамматикалык формаларын сүйлөмдүн мазмунун бузбастан, мүмкүн болгон башка формалар менен алмаштыргыла. Аларды өз ара салыштыруу аркылуу андагы маанилик айырмачылыктарды айтып бергиле жана түшүндүргүлө."},{"t":"p","h":"Үлгү:"},{"t":"p","h":"“карап Жолоочу айланасын аяр карай калды. ‚караганы"},{"t":"p","h":"Биринчи учурда кыймыл-аракеттин ишке ашкандыгы, экинчисинде анын тез арада капыстан болуп өткөндүгү жана үчүнчүсүндө кыймыл-аракеттин ишке ашууга даяр экендиги женүндө маалыматтар берилди. Демек, этиштик татаал формалардын маанилик өзгөрүшү бул жерде негизги этиштерге жалганган чакчыл формалардын таасирине түздөн-түз байланыштуу."},{"t":"p","h":"1. Жолоочу узак жолдо чаалыккан аттын тизгинин тартып, белиндеги жебе салынган саадакты оңдоп койду да, айланасын аяр карап калды. (Ч. Н.) 2. Мени жан-дили менен аяган, жакшы көргөн асыл жеңем бир кезде дирилдеп, ачууланып кетти. (Т. С.) 8. Жыбыттан чыккан Гафуну алиги экөө бурулуп карап калышты. (И. М.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"158\">158<\/span>4. Көк майсаңдан жай алган чакан айылдан анча алыс эмес жердеги капчыгайдан салт атчан киши чыга келди. (Ч. Н.) 5. Ал жерде убакты-убакты менен же аркы беттен, же бу беттен трактордун фараларынын оттору көрүнүп калат. 6. Баланы дыргаяктатып барып, куйругун чычаңдатып токтоп калды өгүз. (М. Э.) Т. Аңгыча тиги өйүздөн сегиз канат даңкайган боз үйдүн карааны көрүнө калды. (Ч. Н.) 8. Өтө берип кайра кылчайсам, келин дагы жалт бурула карап калган экен. (М. 9.) 9. Бир убакта күүлдөгөн үндөр басылып, эл саамга дымый калды. {(Ч. Н.) 10. Бирин-серин жүргүнчү каршы алдыбыздан кезигип калат. (Н. Б.) 11. Саркерлер дуу этип тура калышты. (Т. К.)"},{"t":"p","h":"124. Окуп, этиштин татаал формаларын таап, анын тутумундагы негизги этишти сүйлөмдүн маанисине (контекстке) ылайык мүмкүн болгон синонимдер менен алмаштыргыла. Алардын контекст үчүн мааниси бирдейби? Кайсынысынын мааниси контекстке ылайык келет, эгер келбесе, эмне үчүн экенин түшүндүргүлө."},{"t":"p","h":"Улгы Ошондон кийин экинчи ал айылга барбай калдым. – Ошондон кийин экинчи ал айылга каттабай калдым. – Ошондон кийин ал айылга экинчи жолобой калдым."},{"t":"p","h":"1. Маралдын музоосунун баркы ого бетер көтөрүлүп калды. 2. Колго көнгөн неме анда-санда күтүлбөгөн эле жерден антаңдап чуркап калчу. 8. Ал биринчи кар түшкөндөн баштап, айылга көп келбей калды. 4. Анын үстүнө чоочун иттер кубалай берип, үркүтүп да коюшту. (И. М.) 5. Иштин жайын билгенден кийин унчукпай калдым. («АТ») 6. Осмонбек ырчыны машинага чейин узатып барышты. (К. Б.) Т. Бирин-серин жүргүнчүлөр каршы астыбыздан кезигип калат. 8. Кезиккендердин баарысы таятама салам берип өтүшөт. 9. Биз дагы эле жол жүрүп бара жатабыз. 10. Бала кездеги кайдагы бир ыры эсине түшөбү, таятам анда-санда кыңылдап коёт."},{"t":"p","h":"11. Эмнегедир Тазабек байкем биздикине көп каттабай калган. 17. Кез-кез Тазабек байкем, аны менен ойногонум эсиме түшөт. (Н. Б.)"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[154,158]},{"title":"§ 44. ЭТИШТЕРДИН АЙКАШУУСУ АРКЫЛУУ ЖАСАЛГАН ТАТААЛ ФОРМАЛАР ЖАНА АЛАРДЫН ТҮРЛӨРҮ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"159\">159<\/span>§ 44. ЭТИШТЕРДИН АЙКАШУУСУ АРКЫЛУУ ЖАСАЛГАН ТАТААЛ ФОРМАЛАР ЖАНА АЛАРДЫН ТҮРЛӨРҮ"},{"t":"p","h":"Татаал этиштин тутумунда турган жардамчы этиштердин кошумча маанилери бирдей эмес. Ошондуктан алар төмөнкүдөй үч түргө бөлүнөт:"},{"t":"p","h":"1. Кыймыл-аракеттин узакка созулушун билдирүүчү жардамчы этиштер;"},{"t":"p","h":"2. Кыймыл-аракеттин багытталышын билдирүүчү жардамчы этиштер;"},{"t":"p","h":"3. Кыймыл-аракеттин толук иштелишин билдирүүчү жардамчы этиштер."},{"t":"p","h":"Кыймыл-аракеттин узакка созулушун бер, тур, жүр, отур деген сыяктуу жардамчы этиштер уюштурат. Мында кыймыл-аракеттин бүтө турган чеги айтылбайт."},{"t":"p","h":"М и сал ы: берип жиберди, тура женеду, отура берди, журүп отурду ж. б."},{"t":"p","h":"Кыймыл-аракеттин багытталышын бар, кел, кет деген жардамчы этиштер чакчылдар формасындагы негизги этиштер менен айкалышып, кыймыл-аракеттин белгилүү бир жакка багытталгандыгын туюндурат: барып келди, айта барды, келип кетти ж. б."},{"t":"p","h":"Кыймыл-аракеттин өткөн бир мезгилде же сөз бо- ЧЫ ү ЫР СЕ СИР ЧЕ СЕ СЕ ЭЧЕ СЕ ЭЕ ТЕ ы анасыны С ЭЕ чуч Р С луп жаткан учурда толук иштелип бүткөндүгү бол, салды, болуп жатты, калып калды, алып салды ж. б. этишке жалгануучу чакчыл формалар менен жардамчы этиштердин ич ара айкашуусу ар түрдүү келет. жардамчы этиштердин тутумунан турган этиштин татаал формалары өзүлөрүнүн маанилери боюнча ар түрдүү келишет: Мисалы: карап чыктык, ыйлап жиберди, карай Мына ушундай маанилерди туюндурууда негизги Чакчыл формасындагы негизги этиштер менен чык, кал, ал, жибер, кой, сал, ташта деген сыяктуу жардамчы этиштер менен уюштурулат."},{"t":"p","h":"М исал ы: 1. Меймандар көпкө күттүрбөй, бат эле келип калышты. 2. «Көп суур ийин казбайт, казса да терең казбайт» дегендей алар эптеп эле жардам беримиш <span class=\"pg\" data-n=\"160\">160<\/span>болушту. 3. Конференцияга чакырылгандардын айрымдары кечигип келип жатышты."},{"t":"raw","h":"<div class=\"gloss\"><p>чу ч чү ч чү с с чү ч ү чү ч Че чу ш с<\/p><\/div>"},{"t":"p","h":"Биринчи мисалдагы этиштик татаал формалар кыймыл-аракеттин маанисин күтүлбөгөн жерден тезинен өткөндүгүн билдирип жатат."},{"t":"p","h":"Экинчи мисалдагы этиштик татаал формалар кыймыл-аракеттин жасалма мүнөздө экендигин көрсөтүп турат."},{"t":"p","h":"Үчүнчү мисалдагы этиштик татаал формалар кыймыл-аракеттин узакка созулушун туюндуруп турат."},{"t":"p","h":"Этиштик татаал формалардын мындай ар түрдүү мааниде колдонулушу аларды уюштуруучу каражаттардын мүнөзүнө, тактап айтканда, негизги этишке жалганган формаларга жана жардамчы этиштин маанилик белгилерине тыгыз байланыштуу. Мына ушундай өзгөчөлүктөрүнө карата этиштик татаал формалар төмөнкүдөй түрлөргө же негизги маанилик топторго бөлүштүрүлөт:"},{"t":"p","h":"1. Кыймыл-аракеттин башталышын, (өнүгүш баскычын, өтүү процессин жана аякталышын) билдирүүчү татаал формалар;"},{"t":"p","h":"2. Кыймыл-аракеттин кандайча өтүшүн (жасалма мүнөздө экендигин, аз жерден ишке ашпай калгандыгын, максатка багытталгандыгын, чектелгендигин, созулушун, күчөтүлүшүн, ишке ашууга даяр экендигин) сыпаттап көрсөтүүчү татаал формалар;"},{"t":"p","h":"3. Атооч сөздөр менен этиштердин айкаптуусу аркылуу жасалган татаал формалар;"},{"t":"p","h":"4. Этиш менен экен, эле, бекен, бейм деген сыяктуу жардамчы сездер аркылуу жасалган татаал формалар."},{"t":"p","h":"125. Текстти окуп чыккыла. Андагы жардамчы этиштердин кандай мааниде колдонулгандыгын аныктагыла. Аларды маанилик түрлөрүнө карата ажыраткыла."},{"t":"h3","h":"ДАРЫ СУУ"},{"t":"p","h":"...Жылт-жулт эткен көк кашка булак күнгө чагылыша түштү. {Адыл колун төмөн малып, тиш какшіаткан суудан кочуштап иче баштады. Даамы башкача. Кандайдыр жагымдуу суу. Адыл суудан кыйлага жутту да, <span class=\"pg\" data-n=\"161\">161<\/span>алиги таштарды ордуна коюп, сапарын улады. Тээ төмөн жакта табигый өткөөл бар эле. Узун карагайды шамал түбү менен омкоруп, ал алиги чоң суунун үстүн баса жыгылып, түбү берки өйүздө, башы аркы өйүздө болуп, өзүнчө көпүрө бөлүп калган. Ал ошо жерден аркы өйүзгө өттү. Анан суу бойлоп кеткен жол менен сүт фермасы жакка бет алды. Ага жетсе, сүт ташыган машиналар менен айылга заматта кирип барат..."},{"t":"raw","h":"<div class=\"gloss\"><p>Т шы к шы лы а. ы ы а. ы ы ы а а Т ы ы Т Т Та Са Т ы ылы аз ы ыл. ы ы а ы а а ы ш ы,<\/p><\/div>"},{"t":"p","h":"Мына кызык, ал аябай ачка боло баштады. Мындан бир саат мурда эле, ала келген бир жилик этин мүлжүп, ала келген жууратын нан менен жеп алган. Аябай тоюп кеткендиктен бир аз жууратты «чымчыктар ичсин» деп, жалпак таштын үстүнө төккөн... А азыр эмне болуп атат? Ачка... Мына кызык... Алиги жен суу эмес... Сүт формасына ал заматта келди. аралыкта ал өзөрүп калды. Фермадагылардан айран сурап, ага нан туурап жеди. Бирок аздан кийин кайрадан ачка болгонун сезди... Ооба, бул жен суу эмес эле. Ал эртеси эле тоого, капкандарга кайра келди. Кетээринде болсо кур кетпей, алиги суудан айран куя келген идишине толтура куя кетти."},{"t":"p","h":"Адылдын байбичеси ошол кезде ашказанынан жабыр тартып, ичкен тамагын сиңире албай, жакшылыктуу тамак да иче албай, табы жок жүргөн эле. Ошол суудан ичип жүрүп оңолуп кетти. Адыл өзү да кийинчерээк тамактан кала баштагандай болгон. Анын да тамакка табити тартып калды..."},{"t":"p","h":"Кийинчерээк ошол суудан бүт айыл ташып иче турган болду. Ал жүрө-жүрө «дары суу» атка конду. Ал «дары суудан» башка кыштактан да кишилер келип, алып кете башташты. Акырындап, анын кабары узун элдин учуна, кыска элдин кыйырына тарай берди. Ал эми республиканын борборуна ал суу туурасындагы кабар эки жылда жетти. Атайын адистер келип, кышында тоңбогон бул суунун химиялык жагдайын текшергенде, ал – дүйна жүзүндөгү минералдык суулардын эң мыктысы болуп чыкты. Ага «Арашан» деген ат коюлду. Бетелкелерге куюлуп, элге сатыла баштады. Бөтөлкөнүн сыртында тоо булагы жана анын жанындагы гуу ичип жаткан эки мамалагы менен аюу тартылган... (О. А.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"162\">162<\/span>126. Тур, жүр, кал, отур, кел, кет деген жардамчы этиштер аркылуу этиштин татаал формаларын жасагыла. Аларды катыштырып, моралдык-этикалык темада чакан текст түзгүлө."},{"t":"p","h":"&amp; 45. КЫЙМЫЛ-АРАКЕТТИН БАШТАЛЫШЫН,"}],"sub":[{"title":"ДАРЫ СУУ","b":20}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[159,162]},{"title":"ӨНҮГҮҮСҮН ЖАНА АЯКТАЛЫШЫН","blocks":[{"t":"h3","h":"ӨНҮГҮҮСҮН ЖАНА АЯКТАЛЫШЫН"},{"t":"p","h":"БИЛДИРҮҮЧҮ ЭТИШТИК ТАТААЛ ФОРМАЛАР,"},{"t":"h3","h":"АЛАРДЫН ЖАСАЛЫШЫ"},{"t":"p","h":"Этиштик татаал формалардын тутумундагы негизги этиш менен жардамчы этиштер биригип келип, кыймыл-аракеттин өнүгүшүнүн ар кыл баскычын, ар түрдүү кырдаалда өтүүсүн сыпаттап, модалдык ыңгайдык маанилерди тюундуруп турат."},{"t":"p","h":"Татаал формалар негизги этиш аркылуу туюндурулган кыймыл-аракеттин кандай өзгөчөлүктөрүн билдиргенине жараша үч чоң топко бөлүнөт:"},{"t":"p","h":"1. Кыймыл-аракеттин өнүгүш баскычын (фазасын) билгизүүчү татаал формалар. Булар үч баскычты түшүндүрөт:"},{"t":"v","l":["а) кыймыл-аракеттин башталышы;","б) кыймыл-аракеттин өтүү (болуу) процесси;","в) кыймыл-аракеттин аякталышы."]},{"t":"p","h":"2. Кыймыл-аракеттин өтүү сыпатын, (мүнөзүн) билгизүүчү татаал формалар. Булар кыймыл-аракеттин теменкудей өзгөчөлүктөрүн туюндурат:"},{"t":"p","h":"а) кыймыл-аракеттин узакка созулушун, кайталанышын;"},{"t":"p","h":"б) тез, чукулунан же капысынан жасалышын;"},{"t":"p","h":"в) кыймыл-аракеттин кандайдыр бир чекке жетейин деп максатка багытталгандыгын;"},{"t":"v","l":["г) аз жерден ишке ашпай калгандыгын;","д) ишке ашууга даяр экендигин;","е) жасалма мүнөздө экендигин;","ж) толук ишке ашкандыгын, бүткөндүгүн;"]},{"t":"p","h":"з) дагы бир кыймыл-аракетке уланыша жасаларын."},{"t":"p","h":"3. Модалдык маанилерди билдирүүчү татаал формалар. Булардан тышкары ыңгай категориясынын <span class=\"pg\" data-n=\"163\">163<\/span>теменкудей татаал формалары бар: -ган эле, -чу ‚ эле, -ар эле, -чу болбо, -а көр, -а көрбө, -гай эле, -са экен, -ар эле, -т эле."},{"t":"raw","h":"<div class=\"gloss\"><p>ЧЕ ЧЕ ЧЕ ЧЕ ЧЕ Ее Ыр СЕ ЧЕ<\/p><\/div>"},{"t":"p","h":"Кыймыл-аракеттин өнүгүш баскычын билдирген татаал формаларда кыймыл-аракеттин баштал ыш ын төмөнкү татаал формалар туюндуруп турат: -а башта."},{"t":"p","h":"М и с а л ы: чогула башта, бара башта, сала башта; -ып коё бер."},{"t":"p","h":"М исал ы: алып коё бер, каткырып коё бер; -ып сала бер."},{"t":"p","h":"М исалы: качырып сала бер, бастырып сала бер. Кыймыл-аракеттин өтүү, болуу процессин билдирген татаал формалар төмөнкүдөй жасалат; -ып жат."},{"t":"p","h":"М исалы: казып жатат, чачып жатат, барып жатат; -ып тур."},{"t":"p","h":"Мисалы: жазып тур, айтып тур, барып тур; -ып отур."},{"t":"p","h":"Мисалы: айтып отур, барып отир; -ып жур. Мисал ы: барып жур, басып жур; -ып келе жатат."},{"t":"p","h":"М исал ы: билип келе жатат, көрүп келе жатат, басып келе жатат; -ып бара жатат."},{"t":"p","h":"М исал ы: басып бара жатат, качып бара жатат, көрүп бара жатат."},{"t":"p","h":"Кыймыл-аракеттин аякталышын билдирүүчү этиштик татаал формалар төмөнкүдөй жол менен жасалат: -ып бүт."},{"t":"p","h":"Ми салы: ташып бут, алып бут. көрүп бут; =ып чык."},{"t":"p","h":"Мисалы: окуп чык, көрүп чык, кирип чык; -ып бол."},{"t":"p","h":"Мисалы: алып бол, алмашып бол, саламдашып бол; -ып кой."},{"t":"p","h":"М исал ы: алыл кой, берип кой, көрүп кой; -ып"},{"t":"p","h":"Мисал ы: айтып от, көрүп от, барып өт. 127. Төмөнкү тексттен кыймыл-аракеттин ар кыл баскычын (башталышын, өтүү процессин, аякталышын) билдирген этиштик татаал формаларды белгилегиле."},{"t":"raw","h":"<div class=\"gloss\"><p>ет.<\/p><\/div>"}],"sub":[{"title":"АЛАРДЫН ЖАСАЛЫШЫ","b":2}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[163,163]},{"title":"АК БУГУ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"164\">164<\/span>АК БУГУ"},{"t":"p","h":"Тынч алган Ак Бугу маралга куйрук улаш жата кетти. Көзүн жумуп, алда немелерди эсине түшүрүп жаткансып жуушай баштады. Таңдын шооласы наркы кырдын артынан сөгүлө баштады. Ак Бугу маралды бетегелүү ачыкка ээрчитип чыкты. Кыроо каптаган чөптүн ширесин чыгара чайнап, жерге жарык киргенге дейре сейрек торсойто тоюнуп алышты. Эми маралды ээрчитип темен коктуга туше баштаганда, Ак Бугу берки секиде соксоюп отурган канчык карышкырдын караанын кере калды. Артына жалт берип бурулду. Аңгыча болбоду, жогору топ карагайдын булуңунан дебет карышкыр качырып сала берди. Ак Бугунун омуроосуна атырылып барып жармашты. Ач кенедей кадала түшкөн карышкырды Ак Бугунун курч мүйүзү челип ыргытты. Кек жал беш-алты кадам жерге ала салып оңолду. Ак Бугунун дебет менен алек боло калганынан пайдаланып, канчык маралды тамактан алды. Ак Бугу кайрыла калып, канчыкты асканын коңулуна жапшыра сүздү. Мүйүзүнүн үч-төрт айрысы канчыктын ичеги-боорун тешип өттү. Салмагы кабыргасынан бир-экөөнү чорт-чорт сындырып салыптыр. Дөбөт ийиктей тегеренип жаткан канчыкка кылчайып карабады. Ал ашууну карай качып сала берген бугу менен маралдын артынан сая түштү. (И. М.)"},{"t":"p","h":"128. «Маданияттуулук деген эмне?» аттуу моралдык-этикалык темада чакан текст түзгүлө. Анда кыймыл-аракеттин өнүгүшүнүн ар кыл баскычын (башталышын, өнүгүүсүн, аякталышын) билдирген этиштин татаал формаларын колдонгула."},{"t":"p","h":"129. Кыймыл-аракеттин башталышын туюндурган (-а башта, -ып коё бер, -ып сала бер), кыймыл-аракеттин өнүгүүсүн билдирген (-ып жатат, -ып тур, -ып отур, -ып жүр, -ып келе жатат, -ып бара жатат), кыймыл-аракеттин аякталышын туюндурган {-ып чык, -ып бол, -ып кой, -ып өт) этиштин татаал формаларын катыштырып, өзүңөрдүн башыңардан өткөргөн кызыктуу окуя тууралуу оозеки жана жазуу түрүндө кыскача аңгеме кургула. Аңгемеңерге тема тандагыла жана планын түзгүлө."},{"t":"p","h":"130. Төмөнкү тексттен кыймыл-аракеттин өнүгүш баскычтарын билдирген этиштин татаал формаларын таап белгилегиле, алардын бири-биринен айырмасын аныктагыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"165\">165<\/span>... Мына, каптал жактан бир жылкы торуну омуроого уруп өттү. Бала камгактай учуп барып, аркы бээлердин үстүнө түштү, жанталашып мине калууга үлгүрдү. Астындагыны кош колдоп жалынан алды. Ал жылкы үстүнө түшкөн балээден үркүп, кайда үркөт, калың жылкы ичинде же оңго, же солго бурула албай, же алдыга ашып, же артка кала албай кошкуругу күчөп, денеси диртилдеп, көп менен бирге агып баратты..."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[164,165]},{"title":"§ 46. АТООЧ СӨЗДӨР МЕНЕН ЭТИШТЕРДИН","blocks":[{"t":"h3","h":"§ 46. АТООЧ СӨЗДӨР МЕНЕН ЭТИШТЕРДИН"},{"t":"p","h":"АЙКАШУУСУ АРКЫЛУУ ЖАСАЛГАН ЭТИШТИК"},{"t":"h3","h":"ТАТААЛ ФОРМАЛАР"},{"t":"p","h":"Этиштик татаал формалардын бул түрү атооч менен этиштин айкалышынан жасалат да, татаал формалары биригип келип бир маанини туюндурат. Этиштик татаал форманын семантикалык түзүлүшүнө атоочтук да, этиштик да маани катышат. Нерсе жөнүндөгү түшүнүк атоочтук форма аркылуу, анын кыймыл-аракети, абалы этиштик форма аркылуу берилет жана алар ошол эле калыбы боюнча этишке өтөт."},{"t":"p","h":"Айрым учурда татаал формалар бирге алынганда өз алдынча тургандагыга караганда, башкачараак маанини билдирип калган учурлары да кездешет."},{"t":"p","h":"М и сал ы: албан тай – күч-кубаты кайтуу, күчсүз болуу дегенди билдирет."},{"t":"p","h":"Атооч сөздөр менен айкашуусу бир кылка эмес. Алардын тутумундагы айрым этиштер лексикалык өз алдынчалыгын эрте эле жоготушкан. Кээ бирөөлөрү өзүнчө турганда мааниге ээ болсо, атоочтор менен биригип айтылганда маанилери бүдөмүктөлүп, жардамчы этиштердин тобуна өтүп, этиштик татаал формаларды жасашат. Этиштин татаал формасынын тутумундагы жардамчы этиштер булар: эт, де, бол, кыл."},{"t":"p","h":"М исал ы: заңк этти, тарс атти, ар этти, этип көрүнөт."},{"t":"p","h":"Эт – бул этиш өз алдынча колдонулбайт. Атооч сөздөр менен айрыкча табыш, тууранды жана элестүү сөздөр менен бирге айтылат да, этиштик татаал формаларды жасоого активдүү катышат. Негизги өзгөчөлүгү"},{"t":"p","h":"<span class=\"pg\" data-n=\"166\">166<\/span>– өзүнөн мурунку атооч сөз менен уңгу формасында эмес, дайыма грамматикалык маанидеги мучелер жалганып айкашат."},{"t":"p","h":"Де – бул этиштик татаал формаларды жасоодо анча деле активдүү роль ойнобойт. Тууранды жана сырдык сөздөрдөн этиш жасоого катышат. Эт менен бирге колдонулат."},{"t":"p","h":"Мисалы: быш этпейт, быш дебейт, чу де."},{"t":"p","h":"Бол – бул этиш өз алдынча колдонулат, лексикалык мааниге да ээ. Өзүнчө туруп сүйлөм мүчөсү да боло алат."},{"t":"p","h":"М исалы: Бугун мектепте чогулуш болот. Үйдө канчага чейин болосуң?"},{"t":"p","h":"Атоочтук формалар бирге айкашып, этиштик татаал форманы жасоого катышат. Мындай учурда башка этиштер сыяктуу эле өзүнчө сүйлөм мүчөсүнүн милдетин аткарбайт. Бул касиетке ал өзүнүн алдындагы негизги компонент менен бирге алынганда гана жетишет. Ушул белги ар кандай этиш сөздөрдүн өз алдынчалыгын, же алар этиштик татаал формалардын тутумундагы жардамчы компонент экендигин аныктоочу чек болуп саналат."},{"t":"p","h":"Бол этиши атооч жендемеде турган сөздөр менен айкашат да, этиштик татаал формаларды жасоого катышат. Мындай этиштик татаал формалар грамматикалык жагынан пассивдүү, өтпөс мааниде болушат, негизинен, ал-абалдык маанини билдирет. Мүчө улоо аркылуу керектүү маанини алууга мүмкүн болбогондуктан, же жогорудагы атоочтук формалардан керектүү маанидеги этиш сөздөр жасалбагандыктан, атоочторго этиштерди кошуп айтуу зарылдыгы келип чыккан. Этиштик татаал формалардын жасалышы мына ушуну менен байланыштуу."},{"t":"p","h":"Атооч сөздер менен этиштердин айкашуусу аркылуу жасалган этиштик татаал формалар жөндөмөлүк формаларына карата төмөнкүдөй бөлүнөт:"},{"t":"p","h":"1. Барыш жөндөмөсү менен этиштин айкашуусу аркылуу жасалган этиштик татаал формалар: калыпка сал, четке как, кайгыга сал, сөзга кел;"},{"t":"p","h":"2. Жатыш жөндөмө менен этиштин айкалышынан жасалган этиштик татаал формалар: бойго жет, бейпилйе жат;"},{"t":"p","h":"<span class=\"pg\" data-n=\"167\">167<\/span>3. Чыгыш жендеме менен этиштин айкалышынан жасалган татаал формалар: тилден кал, жандан кеч, анттан тай;"},{"t":"p","h":"4. Атооч жөндөмө менен этиштин айкалышынан жасалган этиштик татаал формалар: казан ас, байге сай, кырман бае, тамыр ал;"},{"t":"p","h":"5. Табыш жөндөмө менен этиштин айкалышынан жасалган этиштик татаал формалар: сабатсыздыкты жой, жообумду бер."},{"t":"p","h":"Этиштик татаал формалар -а, -е, -и, -ып формасындагы чакчылдарга жак мучесунун жалганчу этиштердин айкалышы аркылуу жасалат. Мындай айкалыштарда кыймыл-аракет женундегу негизги тушунук чакчылдар формасындагы компонент аркылуу берилет да, экинчиси ага кошумча маани киргизет же экөө биригип келип татаал кыймыл-аракетти билдирет. Биринчи учурда жак мүчө жалгануучу компонент өзүнүн лексикалык мурунку маанисинен ажырайт да, грамматикалашкан алемент катары колдонулат. Мындай этиштик татаал формалар кыймыл-аракеттин өтүш өзгөчөлүгүн (кыймыл-аракеттин созулушун, кайталанышын, бүтүшүн, багытын, чукулунан же капысынан болушун) туйгузуп турат. Айрым учурда этиштик татаал формалардын жак мүчөлөр менен өзгөрүүчү бөлүктөрүнүн маанилери сакталат жана алар чакчылдар формасындагы компоненттер менен биригип келип, этиштин семантикалык түзүлүшүн курат. Мына ушундай өзгөчөлүктөрүнө карата этиштик татаал формалар өз ара (мурунку параграфтарда окутулгандай) маанилик ар кыл топторго бөлүнөт."},{"t":"p","h":"131. Атооч сөздөр менен этиштердин айкашуусу аркылуу жасалган этиштик татаал формалардын алдын белгилегиле, атооч сөздөр кайсы жендемелерде турганын айткыла."}],"sub":[{"title":"ТАТААЛ ФОРМАЛАР","b":2}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[166,167]},{"title":"КОШУНА","blocks":[{"t":"h3","h":"КОШУНА"},{"t":"p","h":"Кошунам начальник. Мен үстүнкү кабатта жашайм. Ал менин алдымда турат. Бир абадан дем алып, бир түтүктөн келген сууну ичебиз. Эртен менен мен папкемди колтуктап, аялдамага женейм. Кызматтык волгасына жалгыз түшүп, ал жанымдан өтүп кетет шуулдап. Кечинде <span class=\"pg\" data-n=\"168\">168<\/span>келем мен, ар ким менен түртүшүп жүрүп автобуска араң батып. Колумдагы папкеме кошуп картошке салган баштык көтөрүп. Кошунам келет волгасында жалгыз чалкалай оолжуп. Айтор, эртели-кеч бир волга ошол кошунамды, саан уйдай чайпалган сары автобус менен арабадай кылдыраган троллейбус калган кошуналарды ташыйт. Кошунам менен бет маңдайлаша калганда ишарат кылып баш ийкешкен болобуз. Кээде бул турмуштун көйгөйү көөдөнүмө көк таштай тийгенде кошунамды келиштире бир сөгүп алам, дал төбөсүндө туруп полду тепкилеп. Бирок ал анымды билбейт. (Ы. К.)"},{"t":"raw","h":"<div class=\"gloss\"><p>шы ШЕ с че чү Че ЧЫ ЭЕ ЭЕ ЧЕЧЕ Ттт ы таан ны аы ай. ай ай. айы ы. „йы айы. ай. ай. ыы ЕТ<\/p><\/div>"},{"t":"p","h":"132. Тексттен атооч сөздөр менен айкашып жасалган этиштик татаал формаларды тапкыла. Аңгеменин мазмунун оозеки сүйлөгүлө."},{"t":"h3","h":"ЭНЕ"},{"t":"p","h":"Кемпир ооруп калды. Эзели кандай кыйчалыш заман болсо да жетим-жесирин, карыптарды кароосуз калтырбаган, ээн таштабаган эл бул жолу да кемпирди көз жаздымда калтырбады. Бири күлүн чыгарып, отун жакса, экинчиси чайын кайнатып берип, кезектешип карап турушту. Дагы бирөөлөрү үч жыл мурда окуйм деп Бишкекке кеткен бойдон дайын-дарегин билдирбеген жалгыз уулун издетип, атайын киши жөнөттү."},{"t":"p","h":"Издеп барган киши кемпирдин уулун сураштырып, Бишкектин булуң-буйткасын бүт аңтарып чыкты, Акыры автовокзалдын эле жанындагы аялдамада алдына 5—6 куту тамеки, кирдеген кичинекей баштыкка семичкени коюп, соода кылган кемпир-кесектердин катарында кылгырып кызуу отурган абалында тапты. Айылдашы ал-абалды айтып, анын кыйылганына карабай айылга алып жөнөдү. Бул учурда кемпирдин бир жума тил-сөзсүз жатып, үзүлүп кеткенине бир аз эле убакыт болгон. Аттуу-баштуулары акылдашып кемпирди майрам сууга алууга жаңыдан камданып атышканда кирип келген уулун көрүшкөн эл өзүлөрү эркек уулдуу болгондой сүйүнүштү."},{"t":"p","h":"– Карагым, тагдырдын буйругу экен, апаңдан ажырап калдык!? – деп шарт эле угузду бир аксакал."},{"t":"p","h":"– Энеке! – деп бакырып алган уулу али жаткан ордунан алып коюла элек энесине бой таштады. Денеси <span class=\"pg\" data-n=\"169\">169<\/span>сууй баштап, суналып калган кемпирге жан кирди. Акырындап көзү ачылып, өңүндө жылмаюу пайда болду. Оозун кыбыратып, бир нерсе айтмакчы болду эле, алы жетпеди. Обдулмакчы болуп, анысынан да майнап чыкпады. Уулун теше тиктеп, саамга созулуп жатты да түбөлүк уйкуга кете берди. (Ы. К.)"}],"sub":[{"title":"ЭНЕ","b":4}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[168,169]},{"title":"§ 47. ЭТИШ МЕНЕН ЭКЕН, ЭЛЕ, БЕЙМ, БЕКЕН ДЕГЕН СЫЯКТУУ ЖАРДАМЧЫ СӨЗДӨР АРКЫЛУУ ЖАСАЛГАН ЭТИШТИК ТАТААЛ ФОРМАЛАР","blocks":[{"t":"h3","h":"§ 47. ЭТИШ МЕНЕН ЭКЕН, ЭЛЕ, БЕЙМ, БЕКЕН ДЕГЕН СЫЯКТУУ ЖАРДАМЧЫ СӨЗДӨР АРКЫЛУУ ЖАСАЛГАН ЭТИШТИК ТАТААЛ ФОРМАЛАР"},{"t":"p","h":"Этиштик татаал формалар этиш сөзгө экен, эле, бейм, бекен деген жардамчы сөздөрдүн биригүүсү менен да жасалат."},{"t":"p","h":"Тилек маанисиндеги -са мүчөлүү этишке экен деген жардамчы этиш кошулуп, этиштик татаал форма жасалат."},{"t":"p","h":"М иса л ы: Тууган-туушкандарым, ата-энем аман-эсен болушса экен. Уулум эстцу болуп чоңоюп, атасын тартса экен."},{"t":"p","h":"Шарттуу ыңгайдын формасында экен деген жардамчы этиштер менен жана эле деген бөлүкчө менен айкашып да этиштик татаал формалар жасалат. Мындай учурда жак мүчөнүн толук эмес түрү биринчи компонентке жалганат да, ар кандай модалдык кошумча маанилер туюндурулат."},{"t":"p","h":"М ы: Мен быйыл жогорку окуу жайына окууга өтсөм экен (тилек, каалоо). Мен китепти алсам болду (канааттангандыкты билдирет)."},{"t":"p","h":"Тилек ыңгайдын грамматикалык формасы -гай жана ага жардамчы этиш эле кошулуп келип, этиштик татаал формалар жасалат. Мында кыймыл-аракеттин ишке ашышы тиленет."},{"t":"p","h":"М исалы: Мен айылга баргай элем. Сен айылга баргай элен. Ал айылга баргай эле. Ушул эле этиштик татаал форма кептук турунде да колдонулат: баргай элек, баргай элеңер, баргай элеңиздер."},{"t":"p","h":"Ниет ыңгайдын -мак, -макчы мүчөлөрүнө эле, экен деген жардамчы этиштердин айкалышуусу аркылуу да этиштик татаал формалар жасалат."},{"t":"raw","h":"<div class=\"gloss\"><p><\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"170\">170<\/span>Мисалы: Мен бармак элем. Ал келмек экен. Эле деген жардамчы сөз менен бирге айтылган учурда ниеттин иш жүзүнө аткарылган, аткарылбаганы сүйлөөчү үчүн белгисиз болот. Ошондуктан -мак, -макчы деген мүчөлөр жалганган этиштен кийин түшүндүрменун кошулушу талап кылынат:"},{"t":"p","h":"М и сал ы: Ал айылга келмек эле (келиптирби?). Эгер айтылган сөз иш жүзүнө аткарылбай калса, анда түшүндүрмө сөз тескери формада колдонулат."},{"t":"p","h":"М исал ы: Бугун борбор шаарыбызга кар жаамак эле, жаабаптыр."},{"t":"p","h":"Ниет ыңгайдын -мак, -макчы формасына жардамчы этиш экен кошулганда иш жөнүндөгү маалымат башка биреелерден алынгандыгы жана өткөн чактык кошумча маани туюндурулат."},{"t":"p","h":"М ы: Көрсө, Алмаздар да конокко барышмак экен."},{"t":"p","h":"Этиштин -мак формасынын суроолуу түрү беле {-бы эле) аркылуу түзүлөт."},{"t":"p","h":"М исал ы: Чогулуш залда өтмөк беле? Кай бир учурда мындай сүйлөмдөр интонацияга карата суроо иретинде эмес, жайынча гана айтылат да, субъективдүү мамилени билгизет."},{"t":"p","h":"Татаал баяндоочтук форма катары келүүчү экен деген жардамчы сөз адат жана белгисиз өткөн чак этиштерге айкалышат. Мындай тутумундагы баяндооч мүчөлөр ээ болуп турган сөздөрдүн каймана маанидеги адат, белгисиз өткөн чактарда болгон аракеттерин баяндайт."},{"t":"p","h":"М исалы: Аларды кутуп жатып, көзүм илинип кеткен экен. Атасы уулунун акылсыз, бейбаш чыкканына дайыма кайгырчу экен."},{"t":"p","h":"Ал эми баяндооч сездер айкын өткен чак, же учур чак этиштерден болсо, бул көмөкчү сөз (акен) өзүнчө туруп айкалыша албайт. Экен суроолуу -бы уландысы менен биригип кеткен учурларда гана, бекен түрүндө турганда гана баяндоочтук форма катары айкалыша алат. Бул сыяктуу этиштик татаал формалар ээ болуп келген сөздөрдүн ошол эле чактардагы каймана жана суроо маанисиндеги аракеттерин баяндайт."},{"t":"p","h":"М исал ы: Анаралар макулдашты бекен? Айбек иштеп жатат бекен? Сен окууга өттүң бекен?"},{"t":"raw","h":"<div class=\"gloss\"><p>чи ще ш ч сщ р Чү че ЧЕ ЧЕ ЧЕ чү че. О р ы О с<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"171\">171<\/span>(Айрым учурларда мындай этиштик татаал формалар контекстке карай өткөн чак маанисинде да туруп калышы ыктымал."},{"t":"p","h":"Мисалы: Ал күтүп отурат экен. Анын азабын башкалар тартат экен. Ал түштө тамакка келет акен."},{"t":"p","h":"Толук маанилуу де деген этишке -бы суроолуу уландысы менен чакчыл -й, жак -м уландысынын ажырагыс түрдө тутумдашышынан этиштик татаал форма- ‚ лар бейм, дейм деген катыштык сөздөр пайда болгон. Этиштик татаал форма бейм биротоло жардамчы сөз ка- тегориясына өтүп кеткен. Ал азыркы шарты боюнча суроо маанисин да билдире албайт. Баяндооч мүчөлөрдүн эз менен болгон жак байланышын да тейлей албайт. Мындай тутумдагы баяндоочтук комплекстердин ээ менен болгон байланышы чак этиштер аркылуу тейленет. Бул аналитикалык форма бейм белгисиз, айкын өткөн чак этиштер менен айкын келер чак жана учур чак этиштерден болгон баяндоочторго айкалышат да бар ‚ болгону алардын каймана, болжол маанисинде турушун гана шарттай алат."},{"t":"p","h":"М исал ы: Мен жолугушуудан кечигип калдым бейм. Алар кайра айнып калган бейм."},{"t":"p","h":"Бирок булардын этиштик татаал формаларды ' түзүүдө өзгөчө ээлеген орду бар."},{"t":"p","h":"133. Жардамчы сөздөр аркылуу жасалган этиштик татаал формалар текстте барбы? Аңгемени кунт коюп окуп, мазмунун түшүнгүлө."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[170,171]},{"title":"АКЫЛДУУ БАЛА","blocks":[{"t":"h3","h":"АКЫЛДУУ БАЛА"},{"t":"p","h":"Бир карыя келе жатса, козу кайтарып жүргөн бала жолугат. – Балам, кайсы айылдансың? Кимдин баласысың? Бул кимдин малы? – деп сурайт карыя."},{"t":"p","h":"– Өзүм сырты бүтүн, ичи түтүн айылданмын. Тууган энемдин өгөй баласымын, баккан малым жоонуку, – деп жооп берет бала."},{"t":"p","h":"– Жообуңа түшүнбөдүм, уулум. Жакшылап айтчы,— дейт карыя."},{"t":"p","h":"– Айылымдын сырты бүтүн, ичи түтүн дегеним, биздин айылдагылар сырт көзгө ынтымактуу көрүнгөн <span class=\"pg\" data-n=\"172\">172<\/span>менен ич ара түтүндөй быкшып, кырды-бычак болуп жашайт. Тууган энемдин өгөй баласымын дегеним, энем мени төрөгөнү менен өгөйдүн ишин кылып, балалыктын кызыгын али мага көрсөтө элек. Ал эми бул жоонун малы дегеним, энем тың чыгып, атамды өз төркүндөрүнө жетелеп келген экен. Таякелерим аны кулча жумшап, эмгегин жеп жүрөт. Жада калса: «Күйөө карыса жээн болот» – деп күйөө баланы сыйлаган эзелтеден берки ата-бабанын салтын да эстен чыгарышкан. Анан бул мал жоонуку болбогондо меники болмок бекен,— дептир бала. Карыя баланын тирикарактыгына ыраазы болуп, ак батасын берген экен. (Элдик уламыш)"},{"t":"p","h":"184. Акындардын ыр саптарынан жардамчы сөздөр менен жасалган этиштик татаал формаларды таап окугула. Аларды өз-өзүнчө бөлүп жазгыла, силер да ушул сыяктуу ыр саптарын жазууга аракеттенгиле."},{"t":"h3","h":"БОЛОТ"},{"t":"p","h":"Бак-дарактын бутагын алып, ал аз келгенсип, Балдардын оюнчугуна айланып? – «Жоокердин колунда болсом душманга жарар элем. Мында менин болоттугум бекер экен» – деген."},{"t":"p","h":"Айла жок, майда ишти кыласың, Өзүң айтчы, бошпу менин башым?"},{"t":"p","h":"Жок, мага үят эмес, мен эмнеден үялмак элем, Уят ошол адамга, менин эмнеге керек экеними билбеген. (Р. Ш.)"},{"t":"h3","h":"КАЙДЫГЕРЛИК"},{"t":"v","l":["Ээй,","Эштек байке,","эзели төрдө олтуруп,","чер жазып күлдүң бекен өмүрүңдө,","Керзи өтүктөн башка дагы","бут кийим","кийдиң бекен өмүрүңдө,","дем алыш деген дагы күн болорун","билдиң бекен өмүрүңдө? (ПТ. Д.)"]}],"sub":[{"title":"БОЛОТ","b":6},{"title":"КАЙДЫГЕРЛИК","b":10}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[172,172]},{"title":"ЭКӨӨБҮЗ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"173\">173<\/span>ЭКӨӨБҮЗ"},{"t":"v","l":["Чырпык кезде чырмалыша бир есуп,","Кырчын кезде кыналышып ансайын,","азыр бирок айбалталап ургандай","аралары ажыраган «кош» дарак —","эскерме бейм экөөбүздүн чоо-жайга,","астеник бейм экөөбүздүн өксүккө.","","Мага таандык ой-кыялдар алардын","жалбырактуу шактарындай ийилип,","сага таандык чекте дагы турчу эле.","Сага таандык ой-кыялдар алардын","жалбырактуу шактарындай ийилип,"]},{"t":"p","h":"мага таандык чекте дагы турчу эле. (К. К.) 135. Экен, эле, бейм, бекен деген жардамчы сөздөрдү этиш сөздөр менен айкалыштырып, этиштик татаал формаларды жасагыла. Ал этиштик татаал формаларды катыштырып, моралдык-этикалык каалаган теманарда ой жүгүртүп, текст даярда-"},{"t":"p","h":"136. Этиш сөздөр менен экен, эле, бекен, бейм деген жардамчы сөздердү айкалыштырып, этиштик татаал формаларды жасагыла. Ал этиштик татаал формаларды колдонуу менен чакан көлөмдө жомок жазгыла, Жомогуңарга тема койгула, анын башкы оюн, иденсын аныктап, татаал планын түзгүлө."},{"t":"p","h":"137. Жомокту окуп чыккыла. Андагы жардамчы сөздөр менен этиштин айкалышынан турган этиштик татаал формаларды белгилегиле. Өзүңөр да кызыктуу жомок ойлоп таап, жазууга аракеттенгиле."},{"t":"h3","h":"ЖЫЛАН МЕНЕН КИШИ"},{"t":"p","h":"Илгери-илгери бир дыйкан болгон экен. Эгинин отоп жүрсө, жакын эле жерден ышкырган дабыш чыгат. «Эмне болду экен?» – деп карай салса, бет мандайында эки-үч кадам аралыкта эгинден да бийигирээк болгон жылан куйругу менен тикесинен турат. Дыйкан апкаарып жыланды тиктеген боюнча туруп калат. Баягы жылан да кишиден көзүн албай, тостоё тигилет. Дыйкан да көзүн ирмебей көпкө чейин карап тура берет экен."},{"t":"raw","h":"<div class=\"gloss\"><p>гыла.<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"174\">174<\/span>Бир топтон кийин дыйкан жылан менен арбашып калганын билип, бир аз эсин жыйнап, мындай учурда эмне кылуу керек экенин элден уккандары боюнча жасоого аракет кылат. Жылан менен арбашып турганда ал кыймылдап, же бурулуп кетпей, жыландын атын табууга аракет кылып, ар кандай ысымдарды айта баштайт: «Мар», «Мокочо», «Кайыш», «Айнек+, «Айнек көз», «Уу», «Заар», «Чаар». Бирок жылан эч кыймылдабай тикесинен катып турат. Дыйкан жыландын аты ушул болуп калбасын деп болжогон сөздөрүн жобурап улантат. Бирок таба албайт. Жылан анда-санда ышкырып коюп, тилин соймоңдотуп, дыйкандан көзүн албай кыймылсыз. Булардын арбашуусу узакка созулуп, бир топ убакыт өтөт."},{"t":"p","h":"Түш ченде дыйкандын кызы атасына тамак алып келет. Келсе, атасы жылан менен тиктешип турат. Атасы күндүн ысыгына какталып тура берип, бүткөн боюнан шорголоп тер кетип, деми кыстыгып, ичи көөп бара жаткан экен. Жыланды караса анын да ичи көөп, шайы кетип, көзү тостоюп чанагынан чыгарына аз калыптыр. Кыз жүрөгү түшүп, бир кадам жасай албай каккан казыктай туруп калат."},{"t":"p","h":"Кызынын келгенин билген дыйкан: «Топчумду чеч!» – деп айтууга араң кудурети жетет. Эмнегедир ошол замат баягы жыландын ичи тарс жарылып, сулап жатып калат. Көрсө, жыландын аты «Топчу» экен. Жыландын аты табылган соң, ичи жарылып кетиптир."},{"t":"p","h":"Жылан менен арбашкан адам, жыландын атын таба албаса ичи көөп, жарылып өлэт экен."},{"t":"p","h":"Ошентип, дыйкан жыланды жеңип, бала-бакырасы менен аман-эсен оокатын кылып жатып калган экен. («Кыргыз эл жомогу»)"},{"t":"p","h":"188. Бул көнүгүүнү да жогорудагыдай эле тартипте иштегиле."},{"t":"h3","h":"ТҮЛКҮ МЕНЕН КОЁН"},{"t":"p","h":"Элдин айтуусуна караганда мурда түлкүнүн куйругу жок экен. Карышкыр менен мамилеси жаман болуптур. Анан куйругунун жоктугунан баскан изин жашыра албай, мунусу өзүнө чоң залалын тийгизчү экен."},{"t":"p","h":"Бир күнү түлкү калың токойго барып, дарактын түбүндө жаткан коёнду көрүп калат. Ал кезде коёндордун <span class=\"pg\" data-n=\"175\">175<\/span>куйругу узун болуп, ылдам жүрүшкө чоң тоскоолдук кылчу экен. Түлкү коёнду кармап алат да, жемекчи болот. Ошондо коён: «Мени өлтүрбө, куйругумду берейин»,— дейт. Буга түлкү макул болот. Экее куйруктарын алмаштырат. Ошондон бери түлкүнүн куйругу узун, коёндуку кыска болуп калган экен. («Казак эл жомогу»"}],"sub":[{"title":"ЖЫЛАН МЕНЕН КИШИ","b":5},{"title":"ТҮЛКҮ МЕНЕН КОЁН","b":14}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[173,175]},{"title":"&amp; 48. ЭТИШТИН ӨЗГӨЧӨ ФОРМАЛАРЫ","blocks":[{"t":"h3","h":"&amp; 48. ЭТИШТИН ӨЗГӨЧӨ ФОРМАЛАРЫ"},{"t":"p","h":"Атоочтуктар бир жагынан этишке, акинчи жагынан сын атоочко окшошкон туунду формалар."},{"t":"p","h":"Атоочтуктардагы этиштик белгилер:"},{"t":"p","h":"1. Башка этиштердей эле кыймыл-аракетти билдирет."},{"t":"p","h":"Ми сал ы: маараган (кой), мөөрөгөн (уй), ирген (ит)."},{"t":"p","h":"з. Мамиле категориясынын маанисине ээ болот. Алардын кайсы мамиледе экендиги өздөрүнүн жасалышына негиз болгондор кайсы мамиледе тургандыгына ылайык аныкталат."},{"t":"p","h":"М исал ы: жаз – негизги мамиледе, катташ – кош мамиледе. Алардан жасалган атоочтуктар да ошондой."},{"t":"p","h":"3. Өтмө жана өтпөс болот: катты окуган (етме атоочтук) жигит, акталган (өтпөс атоочтук) уй."},{"t":"p","h":"4. Чактык маанини берет: окуп жаткан (учур чак) адам, окуй турган (келер чак), окуган (өткөн чак) адам."},{"t":"p","h":"5, Оң жана терс формада айтылат: айтылар (оң форма), айтылбас (терс форма)."},{"t":"p","h":"Мисалы: Билген унчукпайт, билбеген тынчытпайт."},{"t":"p","h":"6. Башка сөздөрдү өзүнө багындырып, алардын белгилүү жөндөмөдө турушун талап кылат, башкарат: тактооч менен сын атоочту өзүнө ыкташтырат: окууга барган кыз. Иштен келген киши, эрте (тактооч) бышкан өрүк, таза (сын атооч) жуулган көйнөк."},{"t":"p","h":"Өзгөрмөлүү кыймыл-аракетти заттын белгиси катары көрсөтүп, сүйлөмдө көбүнчө аныктоочтук милдетти аткарган чак, мамиле категорияларынын маанилерин билгизип, он, терс формада айтылган сөздер атоочтуктар деп аталат."},{"t":"p","h":"<span class=\"pg\" data-n=\"176\">176<\/span>Чакчылдар бир жагынан тактоочторго, экинчи жагынан этиштерге окшошиат."},{"t":"p","h":"Чакчылдардын этиштик белгилери Чакчылдар башка этиштердей эле кыймыл-аракеттик маанини билдирет. Бирок чакчылдар аркылуу туюндурулган кыймыл-аракет көбүнчө башка бир кыймыл-аракетти мүнөздөө учун колдонулгандыктан, кошумча кыймыл-аракет катары саналат."},{"t":"p","h":"Мисалы: Ишти акылдашып иштеди деген сүйлөмдө эки кыймыл-аракет бар: акылдашып – кошумча кыймыл-аракет, иштеди – негизги кыймыл-аракет."},{"t":"p","h":"Атоочтуктардагы этиштик касиеттер чакчылдарга (да тиешелүү."},{"t":"p","h":"Чакчылдар нагыз этиштерден тактоочко окшошкон- $ дугу жана төмөнкүдөй өзгөчөлүктөрү менен айырмаланат:"},{"t":"p","h":"Нагыз этиштер чак, жак категориялары менен өз- мүчөлөр жалганган сөздөргө чак, жак мүчөлөрү жал- гөрсе, чакчылдар ал касиетке ээ болбойт. Эгерде чакчыл ганса, андай сөздөр нагыз этиштер катары каралат. Мындай учурда чакчыл мүчөлөр менен жак мүчөлөр этиштин чак категориясын уюштуруучу каражаттар катары кызмат кылат. Салыштыралык: бар-а, кел-е, сана-й, кел-ип (чакчылдар): бара-мын, кел-е-мин, кел-ипсин (нагыз этиштер, ар турдуу чактар)."},{"t":"p","h":"Нагыз этиштер чак, жак категориялары боюнча өзгөргөндүктөн, жөнөкөй сүйлөмдүн да, татаал суйлемдун да баяндоочунун милдетин аткара берет жана ээ менен ээрчишүү байланышы аркылуу тутумдашат."},{"t":"p","h":"Чакчылдар багыныңкы сүйлөмдүн тутумунда гана баяндооч катары колдонула алат. Бирок ээ менен маани жактан гана тутумдашат. Ошондуктан сүйлөмдүн ээси кайсы жакта турса да, чакчыл баяндооч аларды форма жактан ээрчип өзгөрбөйт."},{"t":"p","h":"М исал ы: Ал окуду, Айгул кат жазды сыяктуу сүйлөмдөрдө ал деген сөздүн ордуна мен, сен, сиз, биз дегендей сөздөрдү колдоно берсе болот. Андан баяндооч өзгөрбөйт."},{"t":"p","h":"Кошумча кыймыл-аракетти негизги кыймыл-аракеттин ар кандай шарты катары көрсөткөн, жөнөкөй <span class=\"pg\" data-n=\"177\">177<\/span>сүйлөмдүн тутумунда мүнөздүү түрдө бышыктоочтук милдетти аткарган, чак, жак маанисин өзүнчө турганда билгизе албаган этиштик формалар чакчылдар деп аталат."},{"t":"raw","h":"<div class=\"gloss\"><p><\/p><\/div>"},{"t":"p","h":"Кыймыл атоочтор зат атоочко жана нагыз этишке окшош."},{"t":"p","h":"Кыймыл атоочтордун этиштик белгилери"},{"t":"p","h":"1. Кыймыл атоочтордо кыймыл-аракеттик, ал-абалдык, өзгөрмөлүүлүк маани басымдуулук кылат. Салыштырсак: Суроо (зат) бер, аны кайра сураш//сурамай (кыймыл атооч) жок. Азыр жазуубуз (зат атооч) бар, аны кайра жазыш (кыймыл атооч) керек."},{"t":"p","h":"2. Атоочтуктар, чакчылдар үчүн мүнөздүү болгон этиштик белгилердин көпчүлүгү кыймыл атоочторго да мүнөздүү."},{"t":"p","h":"Мисалы: Акылдуу адам өз теңин табууга умтулат. Мындагы кыймыл атооч (табууга) оң формада, негизги мамиледе, өтмө мааниде туруп, тең деген сөздү табыш жөндөмөсүндө башкарды."},{"t":"p","h":"Кыймыл атоочтор зат атоочко окшошкондугу жана чак, жак категорияларынын мүчөлөрүн өзүнө кабыл албагандыгы менен да нагыз этиштерден айырмаланат. Бирок -мак мүчөсү уланган кыймыл атоочтор жак мүчөлөрү менен бармак-мын, бармак-сың, бармак-сыз деген сыяктуу өзгөрүп, нагыз кыймыл атоочтук мааниде эмес, ыңгай категориясынын маанисинде колдонулат."},{"t":"p","h":"Кыймыл атоочтогу этиштик белгилер канчалык азайган сайын, ал сөздүн зат атоочтук касиети ошончолук айкын сезилет. Ал акыры зат атоочко толугу менен өтүп да кетет."},{"t":"p","h":"Мисалы: Китеп окууну жакшы көрбөгөндөрдүн ой жугуртууеу да начар болот. Аз ойлоп, көп жазуу – бул акылмандардын иши. Окуу жакында башталат. Жазуу – бул эң баалуу байлыгыбыз. Алгачкы эки сүйлөмдөгү окуу, жазуу – кыймыл атоочтор. Алар кыймыл-аракеттин, иш процессинин (кыймылдуу) аттарын билдирип турат. Аларга көбүнчө эмне кылуу? кээде эмне? деген суроо берилет. Үчүнчү жана төртүнчү <span class=\"pg\" data-n=\"178\">178<\/span>мисалдардагы окуу, жазуу заттык түшүнүктүн (кыймылсыз) аталышын билгизет. Алар толугу менен зат атоочко өтүп кеткендиктен, мүнөздүү түрдө эмне? деген суроо берилет."},{"t":"raw","h":"<div class=\"gloss\"><p>ы. ың, бы а ы лы лы ллы аа а. аы ы ыы ы ар К ы ы а ы ы а е ы ы ы аы Ты ааыа<\/p><\/div>"},{"t":"p","h":"Кыймыл-аракеттин атын билгизип, белгилүү даражада жендеме, таандык, көптүк мүчөлөр менен өзгөргөн, этиштик белгилерге да ээ болуп көбүнчө ээлик, толуктоочтук милдетти аткарган өзгөчө формалар кыймыл атоочтор деп аталат."},{"t":"p","h":"139. Макал-лакаптарды көңүл коюп окуп чыккыла, жатка билгиле. Макал-лакаптардагы атоочтуктардын этиштик белгилерин аныктагыла."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[176,178]},{"title":"МАКАЛ-ЛАКАПТАР","blocks":[{"t":"h3","h":"МАКАЛ-ЛАКАПТАР"},{"t":"v","l":["Кулактан кирген суук сөз,","Жүрөккө жетип муз болот.","","Билимдүү билгенин иштейт,","Билбеген бармагын тиштейт.","","Жоголгон байлыктын орду толсо да,","Жоголгон убакыттын орду толбос.","","Кези келсе кетмен чап.","Кайрылбаган – кайрылсын,","ийилбеген – ийилсин.","","Эгиндин жайын эккен билер,","Арабанын жайын чеккен билер.","","Айтылган сез акыл болсо,","Уккан кулак макул болот."]},{"t":"p","h":"Жакшы кошунаң – бөксөрбөгөн казынаң. Жалгыздын колунан келбеген,"},{"t":"v","l":["Жаамы журттун колунан келет.","","Көп жашагандан сураба,","Көптү көргөндөн сура.","<span class=\"pg\" data-n=\"179\">179<\/span>Ойлобой туруп баштаба,","Баштаган ишти таштана.","","Ойлоп сүйлөгөн алкыш алар,","Ойлобой сүйлөгөн каргышка калар.","","Күндө келген коноктун кадыры жок.","","Өнөр агып жаткан булак,","Илим жанып турган чырак.","","Сабырдын түбү – сары алтын.","","Чакырылган жүз конок үчүн – бар.","Чакырылбаган бир конок үчүн – жок."]},{"t":"raw","h":"<div class=\"gloss\"><p>178<\/p><\/div>"},{"t":"p","h":"140. Тексттеги чакчылдардын этиштик белгилерин мүнөздөгүлө, чакчылдар аркылуу кыймыл-аракет кандайча туюндурулуп жатат?"},{"t":"h3","h":"ЖАЙСАҢ КОМУЗЧУ"},{"t":"p","h":"Жайсаң комузчу өзүнүн шакирти Каражигит менен эл аралап, күү чертишип, айылдан айылга аласасы бардай шашып келет. Азыр да кеч калбайлы дегендей, алдындагы карагерин үстөккө-босток камчыланып, туу белди эңкейишти. Тээ алыстан көл көрүндү мелтиреп... Жай толугунда айлана кандай кооз..."},{"t":"p","h":"Күн чыгышты беттеп жүрүшкөндүктөн жүздөрүндө жаңы чыгып келаткан күндүн нуру ойноп, көздөрүн уялта тиктейт. Аттардын таноолору бырылдап, тердик алды булоолоп, сааркы шүүдүрүмдө буу асманга көтөрүлүп, алтын нурга көгүш-жашыл болуп чагылышат... Жылгадан агып түшкөн сууларды шимирип жаткан көлгө жел жүргөн сайын нурлар сынып, жээктеги узун шырыктай камыштардын көлөкөсүнө жашынып көрүнбөй калат."},{"t":"p","h":"Жайсаң комузчу көлдү көрүп, эргип да алды... ПІакирти устаты менен анчалык иши болбогондой теребел шоокумун ичинен белгисиз күүнүн кайрыктарына кайрып кыңылдап келет. Каражигит демекчи анын аты – Таабалды. Өңүнө карап, асан чакырып коюлган аты унутулуп, Каражигит аталып кеткен. Жайсаң комузчу элүүлөрдү чамалап калса да жаш жигиттей илбериңки."},{"t":"p","h":"<span class=\"pg\" data-n=\"180\">180<\/span>Көздөрү ойноктоп жандуу. Ал комуз чертип жатып, атайын күү укканы келген келин-кыздарды керген сайын жоготконун издегендей, болгон ажары менен телмире тиктеп, бетме-бет олтурган ургаачы затынын көздөрүн тайгылтып, жамалына кан дүргүтөт..."},{"t":"p","h":"Эртеси эл арасында Жайсаң элине кайтыптыр, Каражигитке күү таштап кетиптир деген сөз жел менен кошо элге тарады. (А. К.)"},{"t":"p","h":"141. Кыймыл атоочторду катыштырып, моралдык-этикалык каалаган теманарда чакан байланыштуу текст түзгүлө. Андагы кыймыл атоочтордун этиштик белгилерин көрсөткүлө. Текстиңерге тема тандап, планын түзүп, башкы оюн жана идеясын аныктагыла."},{"t":"p","h":"149. Тексттин мазмуну менен таанышып чыккыла. Атоочтуктарды, чакчылдарды жана кыймыл атоочторду таап, алардын этиштик белгилерин айткыла."},{"t":"h3","h":"ЖЕҢИШ"},{"t":"p","h":"Эки жылдан кийин биз күткөн улуу Жеңиш да келди. Ошондо сүйүнгөнүбүздү айтпа. Согушка кеткендердин баары келет имиш. Мектептеги балдар өздөрүнчө эле кеткендерди түгөлдөп жатышты. Бирок биздин атабыз келбейт да. Ал согуштан мурун өлгөн. Атамды көрүстөнгө койгону жөнөшкөндө, агам менен кошо мени да алып барышкан. Менин колума ак топурак уучтатышып, күрөктүн бетине салдырышып, тиги атам жаткан жайга алып кетишкен. Мен ыйлабай койгондо таякем: атаң эми келбейт. Чыкпай турган кылып көөмп койдук деп ыйлаткан. Ошондо апамды кучактап алып, солуктаганча ыйлагам. Атам келбейт. Мен мектепте жүрүп ошону ойлонуп жаттым. Жеңишти уккан Рысбек тимеле атасы тирилип келгендей сүйүнүп алыптыр. Анын көңүлүн сууткум келген жок. Кантсе да Жеңиш жеңиш эмеспи. Ага атам келбейт дегим келген жок."},{"t":"p","h":"Апам кээде мени: «Өзүмчүлсүң, туура эмес болсо да, айтканыңды коё бербейсиң»,— деп тилдеп калуучу. Чын эле ошондоймунбу? Өзүмдү өзүм жемелеп, агамдын сүйүнүчүнө ортоктош болуп, апама жеткизгенче үйгө шаштык. Мурун эле укса керек. Апам да сүйүнгөнүнө чыдабай, балбалактап ыйлап алыптыр."},{"t":"p","h":"<span class=\"pg\" data-n=\"181\">181<\/span>– Токчулук болот. Курсагыңар тоюнат эми."},{"t":"p","h":"Апам мени кучактап алып көпкө солуктап ыйлады. Апамын ыйлаганын буга чейин жалаң таарынычтан, биздин турмуштун жетишсиздигинен го дечүмүн. Эми эмнеге ыйлайт?.."},{"t":"p","h":"Баса, ушул жеңиш айынан эки ай өтпөй жай толугунда Самтыр жамакчы эски кеселинен кайтыш болду. Аны да ылдыйкы айылдан чүкө ойногону барып мен угуп, апама жеткизгенче шаштым."},{"t":"p","h":"Апам өңү бир аз кызара түшкөндөй:"},{"t":"p","h":"– Рахматы болсун, пас киши эле, өлүп жаны тынган тура,— деп бош унчукту. Андан башка эч нерсе айткан жок. {О. А.)"},{"t":"p","h":"143. Этиштин озгече формаларын катыштырып, өзүңөр кубе болгон же чоңдордон уккандарынар боюнча кандайдыр окуя тууралуу баяндап, аңгеме кургула."},{"t":"p","h":"144. Жазуу жумуштарында {жат жазуу, баяндама, дилбаян) этиштин өзгөчө формаларын тил каражаты катары стилдик максатта орундуу колдоно билгиле, оозеки кебиңерде да орундуу пайдалангыла."}],"sub":[{"title":"ЖАЙСАҢ КОМУЗЧУ","b":6},{"title":"ЖЕҢИШ","b":14}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[179,181]},{"title":"СИНТАКСИС ЖАНА КЕП МАДАНИЯТЫ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"182\">182<\/span>СИНТАКСИС ЖАНА КЕП МАДАНИЯТЫ"},{"t":"h3","h":"&amp; 49. БАШ МҮЧӨЛӨРДҮН (99 МЕНЕН БАЯНДООЧТУН) ОРТОСУНА СЫЗЫКЧАНЫН КОЮЛУШУ"},{"t":"p","h":"Эз 8-жакта туруп, баяндоочтун милдетин атооч жөндөмөдөгү зат атоочтор же заттык маанидеги башка атоочтор аткарса, аларга баяндоочтук белги болгон жак мүчөлөр уланбайт. Мындай учурда баяндоочтун ээден кийин алган соңчул орун тартиби баяндоочтук белгиси катары келет."},{"t":"p","h":"М исалы: Ал – жазуучу. Эмгек – бакыт. Оозеки кепте бул түзүлүштөгү сүйлөмдөрдүн ээ, баяндоочунун ортосунда кыска тыным болот. Ал эми жазууда ал тыным болгон жерге, ээ менен атоочтук баяндоочтун ортосуна сызыкча коюлат. Сызыкча андай сөз тизмектеринин сүйлөмдүк касиетке ээ болушуна жардамдашып турат."},{"t":"p","h":"з менен баяндоочтун ортосуна төмөнкү учурларда сызыкча коюлат:"},{"t":"p","h":"1. Ээ менен баяндоочтун милдетин атооч жөндөмөдөгү зат атоочтор аткарса, эгерде баяндоочко тиешелүү айкындооч мүчөлөрү болсо, сызыкча ошол айкындооч мүчөлөрдөн мурда коюлат."},{"t":"p","h":"М исалы: Акыл – рухий байлык. Мугалим – мемелуц дарак."},{"t":"p","h":"2. Ээнин милдетин шилтеме ат атоочтор аткарып, баяндоочу атооч жөндөмөдөгү зат атоочтордон болсо коюлат."},{"t":"p","h":"Мисалы: Бул – менин апам. Ал – Мараттын уйц. Ал – өз кесибинин устасы."},{"t":"p","h":"3. Ээнин милдетин заттык маанидеги атоочтук аткарып, баяндоочу атооч жөндөмөдөгү зат атоочтон болсо коюлат."},{"t":"raw","h":"<div class=\"gloss\"><p>к рү са<\/p><\/div>"},{"t":"v","l":["<span class=\"pg\" data-n=\"183\">183<\/span>Мисалы:","Алтын билим өнөрдүн","Сүтүн берген – мугалим.","Аябастан эмгекке","Күчүн берген – мугалим. (Ж. Б.)"]},{"t":"p","h":"4. Ээ менен баяндоочтун биринин милдетин атооч жөндөмөдөгү зат атооч, экинчисиникин кыймыл атооч аткарса:"},{"t":"p","h":"М исалы: Ата Мекенди коргоо – ыйык милдет. Ар бир атуулдун ыйык милдети – Ата Мекенди коргоо."},{"t":"p","h":"Эгерде атооч жөндөмөдөгү зат атоочтон же кыймыл атоочтон болгон баяндоочтун алдына бул, ал, ошол деген сөздөр кошулуп айтылса, сызыкча бул сөздөрдүн алды жагына коюлат."},{"t":"p","h":"М исалы: Ынтымактцуулук – бул күч, ынтымактуулук – бул жашоо, ынтымактуулук – бул жеңиш. Элге эркиндик, эгемендуулук алып келген – ошол демократия."},{"t":"p","h":"5. Ээ да, баяндооч да эсептик сан атоочтон болсо, же баяндоочтун милдетин абстракттуу маанидеги сан атооч аткарса."},{"t":"p","h":"Мисалы: Алты жерде алты – отуз алты. Эки элуу – жиз. Сексендин жартысы – кырк."},{"t":"p","h":"Зат атоочтон турган баяндоочко кызматчы сөздөр айкашып айтылса же аларга жак, суроо, уланды мүчөлөр уланып келсе, баш мүчөлөрдүн арасына сызыкча коюлбайт. Мындай учурда атоочтук баяндооч толук баяндоочтук белгиге ээ болуп, ээ менен тыгыз байланышып келет."},{"t":"p","h":"М и сал ы: Сен акылдуу кызсың. Улан биздин мыкты жигитибиз эле. Мен демократмын. Айгул студентпи?"},{"t":"p","h":"Ээ зат атоочтон болуп, сан атоочтон турган баяндооч анын конкреттүү санын көрсөтсө, баш мүчөлөрдүн ортосуна сызыкча коюлбайт."},{"t":"p","h":"Мисал ы: Бизде айылга баруучулар кырк беш."},{"t":"p","h":"145. Төмөнкү накыл кептерди жатка билип алгыла. Ээ менен баяндоочтун ортосуна сызыкчанын коюлушуна көңүл бургула. Сызыкча кайсыл учурда коюла тургандыгын эстегиле."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[182,183]},{"title":"НАКЫЛ КЕПТЕР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"184\">184<\/span>НАКЫЛ КЕПТЕР"},{"t":"v","l":["Дүйна – улуу жол,","Заман – соккон жел.","","Алдыдагы толкун – агалар.","Арттагы толкун – инилер.","","Атаң өлсө – агаң ата,","Энең өлсө – эжең апа.","","Киреше – тоскон суудай,","Чыгаша – аккан суудай.","","Эли байдын – дили бай.","","Жакшы келсе – кут,","Жаман келсе – жут.","","Бал – аарыдан,","Мээрим – аялдан.","","Өз жериң – алтын бешик,","Бетен жер – көңдөй тешик.","","Күрөштүн максаты – жеңиш.","","Сөз – үрөн, иш – мөмө.","Бирдиктүү эл – кебелбес аскадай."]},{"t":"p","h":"Жаштык – шаттык, карылык – сактык."},{"t":"p","h":"Бала тарбиясы – бешиктен."},{"t":"p","h":"14б. Эз менен бандоочтун ортосуна сызыкча коюлган сүйлөмдөрдү жыйнагыла. Аларды катыштырып, чакан текст түзгүлө. дэ менен баяндоочтун ортосуна сызыкчанын коюлушунун себебин аныктагыла."},{"t":"p","h":"147. Төмөнкү тексттин мазмунун кунт коюп окугула. Андагы баш мүчөлөрдүн ортосуна сызыкчанын коюлушуна көңүл"},{"t":"raw","h":"<div class=\"gloss\"><p>бургула. 184<\/p><\/div>"},{"t":"h3","h":"<span class=\"pg\" data-n=\"185\">185<\/span>ПЕРЗЕНТТИ ТАРБИЯЛОО"},{"t":"p","h":"Уулум, эгер сен перзент көрсөн, перзентине жакшы, жарашыктуу ысым койгун. Жакшы ысым коюу – перзенттин атадагы акысынын бири. Уул перзентиң бир аз торолгондон кийин күч-кудуретиңе карап, той-тамаша өткөрүп бергин. Чама-чаркыңа карабай чоң той кылуудан сактан, каражатыңа ылайык той кылгын. Тойго бары-жогуңду сарптап, муктаждыкка түшүп калуу, карызга белчеден батуу – акылдуу жандардын иши эмес. Перзентиң бой тарта баштагандан тартып, өзүнүн жөндөмүнө карап ага өнөр үйрөт."},{"t":"p","h":"Зарыл учурда өзү гана аткара ала турган, башка киши анын ордуна өтүп аткара албай турган өнөрдү үйрөтүү керек. Ал өнөр – сууда сүзүү өнөрү эмеспи."},{"t":"p","h":"Перзентти тарбиялоо – бул жооптуу милдет. Өз перзенттериңе ар түрдүү илим-өнөрдү үйрөт. Ошону менен сен аталык ыйык милдетиңди аткарган болосуң."},{"t":"p","h":"Адамдын башына эмнелер келип-кетерин алдын-ала билип болбойт. Ар бир сапаттуу өнөр, албетте, бир күнү кереги тиет. Ошон үчүн перзенттериндин илим-енер үйренуусуне кош көңүлдүк менен карабагын. («Ой гулдерунен».)"}],"sub":[{"title":"ПЕРЗЕНТТИ ТАРБИЯЛОО","b":7}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[184,185]},{"title":"§ 50. СҮЙЛӨМДҮН БАШ МҮЧӨЛӨРҮНҮН","blocks":[{"t":"h3","h":"§ 50. СҮЙЛӨМДҮН БАШ МҮЧӨЛӨРҮНҮН"},{"t":"p","h":"ЭЭРЧИШҮҮСҮ: ТОЛУК ЭЭРЧИШУУ,"},{"t":"h3","h":"ТОЛУК ЭМЕС ЭЭРЧИШГУУ"},{"t":"p","h":"Суйлемдердегу сөздөр бири-бири менен терт жол аркылуу байланышат: ыкташуу, башкаруу, таандык ч ы СШ ЭЕ ЧЕ йы алы лыы кы С киш с байланыш жана ээрчишүү. Булардын ичинен ээрчишүү баш ийип, аны жак жана сан боюнча ээрчип байланышат. тордон болсо, баяндоочуна да ошол жактын мүчөлөрү жалганып, ээни дайыма жак боюнча толук аэрчийт. /1. Сүйлөмдүн ээси 1, 2-жактагы жактама ат атооч- Сүйлөмдүн баяндоочу грамматикалык жактан ээге менен ээ жана баяндооч байланышат,"},{"t":"h3","h":"Сүйлөмдүн баш мүчөлөрүнүн толук ээрчишүүсү"},{"t":"p","h":"<span class=\"pg\" data-n=\"186\">186<\/span>М иса л ы: Биз келечекке карыздарбыз. Мен медицина тармагында иштейм. Силер бейпилчиликте"},{"t":"p","h":"2. Ээнин милдетин аягына Т, ІІ жакка таандык мүчөлөр жалганган өз, баары деген ат атоочтор жана жамдама сан атоочтор аткарышса да, баяндоочтору дайыма ээни жак боюнча толук ээрчип, 1 же П жакта айтылат."},{"t":"p","h":"М исалы: Табышмактын жандырмагын өзүм табам. Баарыбыз студентпиз. Бешөөңөр шаарга барасыңар."},{"t":"p","h":"3. Сүйлөмдүн ээси маани жагынан Ш жакта туруп, баяндоочу учур чакта же айкын келер чакта болсо, баяндооч ээни жак боюнча толук ээрчип, Ш жакта айтылат. Мындай баяндоочтордун аягына үчүнчү жактын -т мүчөсү жалганып келет."},{"t":"p","h":"М исал ы: Ал дайыма туулган жерин мактайт. Жыгылган күрөшкө тойбойт. Ашыккан дайыма уятка калат."},{"t":"p","h":"4. Өткөн чактагы атиштердин Ш жагынын жак мүчөсү жок. Ошол себептүү сүйлөмдүн ээси ПТ жакта, баяндоочу еткен чакта болсо, андай бандооч жак мүчөсүз туруп эле ээни толук ээрчип, Ш жактын маанисинде айтылат."},{"t":"p","h":"М исалы: Поезд түндө келген. Ал конокторго сөз берди. Айналар үй сатып алышыптыр."},{"t":"p","h":"Сүйлөмдүн баш мүчөлөрүнүн толук эмес ээрчишүүсү"},{"t":"p","h":"1. Сүйлөмдүн баяндоочу ээ менен жак уландылары боюнча дайыма эле толук ээрчише бербейт. Айрым учурда баяндооч эз менен жак мүчөсү уланбай туруп эле мааниси боюнча ээрчишип байланышат."},{"t":"p","h":"Мындай мааниси боюнча ээрчишүү буйрук ыңгайдын П жагында турган баяндоочтор менен ІП жак маанисиндеги атоочтук баяндоочторго мүнөздүү."},{"t":"p","h":"М исал ы: Сен шаарга окууга тапшырганы бар."},{"t":"p","h":"– Ой, жолоочу, сен токтой тур! Кыргызстан – эге- – мендуулукке ээ салган өлкө."},{"t":"p","h":"Бул мисалдардагы биринчи, экинчи сүйлөмдөрдүн баяндоочунун милдетин бар, токтой тур деген буйрук <span class=\"pg\" data-n=\"187\">187<\/span>ыңгайдын И жагындагы этиштер аткарып турат. Алар сүйлөмдүн ІІ жактагы сен деген ээси менен жак уландысы аркылуу байланышкан жок. Мааниси боюнча П жакка тиешелүү болуп айтылып, ээ менен маани жагынан ээрчишип байланышып турат,"},{"t":"raw","h":"<div class=\"gloss\"><p>аы ы (| <\/p><\/div>"},{"t":"p","h":"Ошондой эле үчүнчү сүйлөмдүн өлкө деген атоочтук бандоочуна да жак мүчө уланган жок. Ал Ш жактагы ээни ээрчип, ошол жактын маанисинде айтылып, ээ менен мааниси боюнча гана ээрчишип турат."},{"t":"p","h":"2. Ээнин милдетин аягына Г, П жакка таандык мүчө уланган зат атоочтор аткарганда, алар сырткы түрү жагынан, 1, П жакка таандык формада турганы менен ички мааниси боюнча Ш жакты билдирет. Ошондуктан баяндооч да аны ээрчип, үчүнчү жактын маанисинде айтылат."},{"t":"p","h":"Мисалы: Менин сиңдим институтта иштейт. Биздин директорубуз эс алууга кеткен. Сенин кызың орто мектепти алтын медаль менен бутту."},{"t":"p","h":"3. Сүйлөмдүн ээси Ш жакта туруп, баяндоочтун милдетин 1, П жакка таандык формадагы зат атоочтор аткарса, алар ээ менен жак боюнча ээрчишпей, мааниси боюнча ээрчишип байланышат."},{"t":"p","h":"Мисалы: Бул – менин балам. Ракыя – силер йин тууганыңар."},{"t":"p","h":"Бул сүйлөмдөрдүн ээлери үчүнчү жакта, ал эми баяндоочтору 1, П жакта турат. Бирок ал баяндоочтор ички мааниси жагынан үчүнчү жакты билдиргендиктен, сүйлөмдүн үчүнчү жактагы ээси менен мааниси боюнча байланышты."},{"t":"p","h":"4. Баяндоочтун милдетин жактама ат атоочтор аткарышса, же тутумдаш баяндоочтун курамында жактама ат атооч болсо, алар ээни жак боюнча ээрчибейт. Баяндоочу кайсы жактагы жактама ат атоочтон болсо, ага ошол жактын жак уландысы жалганат."},{"t":"p","h":"М исал ы: Алсыздарга көмөк керсете турган адамдар – силерсиңер. Мактоого эз болгон алдыңкылар биз болобуз. Алардын эң кичүү уулу менмин."},{"t":"p","h":"Бул сүйлөмдөрдүн ээлери үчүнчү жакта, баяндоочтору, 1, П жакта турат. Баяндоочтун милдетин кайсы жактагы жактама ат атооч аткарса, ага ошол жактын жак уландысы жалганган."},{"t":"raw","h":"<div class=\"gloss\"><p><\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"188\">188<\/span>М исал ы: силерсиңер, биз болобуз, менмин. Баш мүчөлөрдүн сан боюнча ээрчишүүсү төмөнкүдөй жол менен ишке ашырылат:"},{"t":"p","h":"1. Баяндоочтун ээни сан боюнча ээрчиши да жак мучелер аркылуу болот. Демек, 1, П жактын жекелик, көптүк маанидеги жак мүчөлэрү, ээ менен баяндоочтун ортосундагы жак байланышын билдирсе, экинчи жагынан, алардын сан жагынан болгон байланышын да билдирет."},{"t":"p","h":"М исалы: Биз алардын жоруктарын кийин билдик. Силер былтыр айылга келбей калгансыңар."},{"t":"p","h":"2. Сүйлөмдүн ээси Ш жак, көптүк мааниде туруп, баяндоочу этиштен болсо, ал ээ менен сан жагынан көптүк -ыш мүчөсү аркылуу байланышат. Эгерде баяндоочу атооч сөздөрдөн болсо, -лар мүчөсү аркылуу байланышат."},{"t":"p","h":"М исал ы: Цирктеги жаныбарларга балдар кызыга карашат. Келе жаткандар – тааныштар."},{"t":"p","h":"3. Ээнин милдетин жекелик сандагы сөздер аткарышса, баяндоочу аны ээрчип, дайыма жекелик санда айтылат."},{"t":"p","h":"М и сал ы: Мен бала бакчага барып, бөбөгүмдү алып келдим."},{"t":"p","h":"4. Ээнин милдетин көптүк маанидеги сөздөр аткарышса, баяндоочу аны сан боюнча ээрчип, көптүк түрдө айтылат."},{"t":"p","h":"М ы: Биз билим менен алыска барабыз. Меймандар үй ээсин ээрчип үйгө киришти. Алар көп жылдан бери шаарда жашашат."}],"sub":[{"title":"ТОЛУК ЭМЕС ЭЭРЧИШГУУ","b":2},{"title":"Сүйлөмдүн баш мүчөлөрүнүн толук ээрчишүүсү","b":5}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[186,188]},{"title":"§ 51. ЭЭГЕ КАРАТА БАЯНДООЧТУН САН ЖАГЫНАН ЭЭРЧИБЕГЕН УЧУРЛАРЫ","blocks":[{"t":"h3","h":"§ 51. ЭЭГЕ КАРАТА БАЯНДООЧТУН САН ЖАГЫНАН ЭЭРЧИБЕГЕН УЧУРЛАРЫ"},{"t":"p","h":"1. Сүйлөмдүн баяндоочу ээни дайыма эле сан жагынан ээрчий бербейт. Кээде ээ көптүк түрдө турса да, баяндоочу жекелик санда айтылып калат."},{"t":"p","h":"М исал ы: Коноктор бириндеп-сериндеп келип жатты. Душмандар бат эле чек арага жакынйайы."},{"t":"p","h":"Бул сүйлөмдөрдөгү келип жатты, жакындады. деген баяндоочтор көптүк сандагы ээлеринин бир учурда чогуу болгон кыймыл-аракетин билдирип турат."},{"t":"raw","h":"<div class=\"gloss\"><p>ш чи с ч Чү ч ч ч ШР ШЕ ЫЕ СЕ С С к и ЧЕ айвы ч ЧЕ СЕ ЧЕ к Чү ЭС ЧЕ Р<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"189\">189<\/span>9 Ээнин милдетин жансыз заттарды билдирген көптүк түрдөгү зат атооч аткарса, сүйлөмдүн баяндоочу ээни сан боюнча ээрчибей, көбүнчө жекелик санда айтылат."},{"t":"p","h":"М исал ы: Көптөн бери суу куюлбагандыктан гүлдөр солуду. Атасынын айткан акылдары балага зор таасир берди. Кээде конференциялар болуп калат."},{"t":"p","h":"Эгерде кыймыл-аракет көптүк түрдөгү ээ бириктирип турган жансыз заттардын ар бирине тиешелүү экендигин баса көрсөтүү керек болсо, баяндоочу ээни сан боюнча ээрчип, көптүк санда айтылып калат."},{"t":"p","h":"М исал ы: Студенттер сессиясын ийгиликти аякташты."},{"t":"p","h":"3. Ээнин алдында сан атоочтон же сандык маанидеги башка сөздөрдөн аныктоочу болуп, ал өзүнөн кийинки ээге көптүк маани берип турса, баяндоочу аны сан жагынан ээрчибей, көбүнчө жекелик санда айтылат."},{"t":"p","h":"М исал ы: Дөбөдө бир топ киши сүйлөшүп отурат. Алардын астынан жоон топ адам чыга келди."},{"t":"p","h":"Эгерде кыймыл-аракет көптүк маанидеги ээ билдирген заттардын ар бирине тиешелүү экендигин баса көрсөтүү керек болсо, баяндоочу ээни сан боюнча ээрчип, көптүк түрдө айтылып калат."},{"t":"p","h":"М и сал ы: Дөбөдө бир топ кишилер сүйлөшүп отурушат. Алардын астынан жоон топ адамдар чыга келишти."},{"t":"p","h":"4. Баяндоочтун милдетин туюк мамиледеги этиш аткарса, ээси көптүк түрдө турса да, баяндоочу дайыма жекелик санда айтылат."},{"t":"p","h":"М иса л ы: Алар женцучулер йеп аталды. Жаштар алыскы райондорго жумушка жиберилди."},{"t":"p","h":"5. Сүйлөмдүн ээси Ш жак көптүк түрдө туруп, баяндоочу көптүк мүчө менен өзгербэй турган сөздөрдөн (сын атооч, сан атооч, тактоочтордон (бар, жок) жана жатыш жөндөмөдөгү сөздөрдөн) болсо, ээ көптүк санда турганы менен баяндоочу дайыма жекелик санда айтылат."},{"t":"p","h":"Мисалы: Балдардын кабактары салыңкы. Топтун ичинде далайды көргөн карыялар да бар. Бул мектептин мугалимдери да жаш, тажрыйбасыз."},{"t":"p","h":"<span class=\"pg\" data-n=\"190\">190<\/span>149. Төмөнкү сатиралык аңгеме менен таанышкыла. Сүйлөмдүн баш мүчөлөрүнүн толук ээрчишүүсүн белгилегиле. Баш мүчалөрдүн жак, сан боюнча толук ээрчишкенин мисалдар менен далилдегиле."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[189,190]},{"title":"ҮЧ КЕРЕЗ","blocks":[{"t":"h3","h":"ҮЧ КЕРЕЗ"},{"t":"p","h":"Эркебай агабыздын оорусу катуу экен деп уктук. Бул саам да жетип бардым. Ал адатынча курс-курс жөтөлүп, чекесин тырыштырганда чын эле боорубуз ооруй тунжурай түштүк. Бир маалда шайы оогонсуган Эркебай көзүнөн жаш кылгыра четте турган аялына кайрылды."},{"t":"p","h":"– И, өлдүм, и, бүттүм! Кармагыла колдон! О, о, алып калгыла! Айтор, үйдүн ичин үч көтөрүп балдарынын ыйлаганына, доктур чакырганыбызга карабай айлабызды кетиргендин үстүндө. Аңгыча азыраак тынчый түшүп, кол жаңсады."},{"t":"p","h":"– Бүттү баары, кашкарайганга жетпей үзүлөм. Чакыргыла балдарды. – Ары жакта ыйлап жаткан балдарды аяган биз: – Эке, эси чыгат. Балдарды эмнеге чакырдың?"},{"t":"p","h":"– Балдарым жаш калды. Колуңардан келишинче көз сала жүргүлө. Анча болду үч керезим бар. Айтып калайын, – Бизде эмне айла, макул болдук. Ошондо Эркебайдын балдарына айткан үч керези булар:"},{"t":"p","h":"– Ылайым Туйту менен дос болбогула, балдарым. Бакастан такыр карыз акча алба. Үчүнчүдөн, кокусунан, жайдын толук кезинде Сибирге барып калсаң, токойго кирип заара кылба..."},{"t":"p","h":"Ошо бойдон Эркебай түнжурады. Биз да үн каткан жокпуз. Эркебайдын үч керезинин маанисин уулдары тургай биз түшүнгөн жокпуз. Жөөлүп жатат деп ойлодук. Биздин абалды түшүнгөн Жөжө аксакал бүшүркөдү."},{"t":"p","h":"– Эркебай, керезинди чечмелеп бер. Туйтуң, Бакасын ким? Эмнеликтен Сибирди айттың?"},{"t":"p","h":"Эркебай тангалып койду: – Туйтуну билбейсинерби? Ал арам менин илгерки досум эмеспи. Атасынын оозун урайын, ал достошорун достошуп алып эле үстүңөн арыз жаза берет. Бакас да мага дос чалыш ит, жогорку жарташты

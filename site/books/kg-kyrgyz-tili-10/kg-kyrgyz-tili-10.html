<title>Кыргыз тили 10</title>
<style>/* Mobile textbook reader. No external fonts or libraries: everything works offline. */
:root {
  --bg: #ffffff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3;
  --panel: #f6f6f6; --accent: #1f6feb; --accent-fg: #ffffff;
  --fs: 19px; --lh: 1.55;
  --font: Georgia, "Noto Serif", "DejaVu Serif", "Times New Roman", serif;
  --bar-h: 48px; --foot-h: 28px;
}
[data-theme="sepia"] { --bg: #f5ecd9; --fg: #4a3b2a; --muted: #8a7458; --line: #e0d2b4; --panel: #ece0c6; --accent: #9a5b13; }
[data-theme="dark"]  { --bg: #111315; --fg: #d8d8d8; --muted: #8c8c8c; --line: #2a2d31; --panel: #1b1e21; --accent: #6ea8ff; --accent-fg: #0b0b0b; }
[data-theme="contrast"] { --bg: #000000; --fg: #ffffff; --muted: #c8c8c8; --line: #444; --panel: #151515; --accent: #ffd400; --accent-fg: #000; }
[data-font="sans"] { --font: Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 16px/1.4 Roboto, "Noto Sans", Arial, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- Library ---------- */
.lib { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lib h1 { font-size: 22px; margin: 8px 0 4px; }
.lib .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.lib-head { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
.lib-head h1 { flex: 1; margin: 0; }
.school { display: flex; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.school button { flex: 1; min-height: 44px; padding: 0 10px; font-size: 15px; background: var(--panel); }
.school button + button { border-left: 1px solid var(--line); }
.school button.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.my-link { flex: 0 0 auto; font-weight: 600; min-height: 40px; padding: 0 12px; font-size: 14px; }
.grade { margin-bottom: 10px; }
.grade-h { display: flex; width: 100%; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 18px; font-weight: 600; text-align: left; }
.grade-h::after { content: '›'; font-size: 24px; color: var(--muted); margin-left: 10px; transition: transform .15s; }
.grade.open .grade-h::after { transform: rotate(90deg); }
.grade-h .n { margin-left: auto; font-size: 14px; font-weight: 400; color: var(--muted); }
.grade-b { padding: 0 2px; }
.grade-t { font-size: 20px; margin: 18px 0 0; }
.subj { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.bk { border-bottom: 1px solid var(--line); padding: 4px 0 12px; }
.bk:last-child { border-bottom: 0; }
.bk-t { font-size: 17px; font-weight: 600; }
.bk-s { font-size: 14px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bk-m { color: var(--muted); font-size: 13px; margin: 3px 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: .5; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.bk-h { display: flex; align-items: flex-start; gap: 4px; }
.bk-h .bk-t { flex: 1; padding-top: 10px; }
.bk .row { gap: 4px; }
.bk .row .btn { min-height: 40px; padding: 0 18px; font-size: 14px; margin-right: 8px; }
.bk .icon { color: var(--muted); flex: 0 0 auto; }
.bk .icon[disabled] { opacity: .5; }
.bk .icon.on { color: var(--accent); }
.bk .star.on svg { fill: currentColor; }
.bk .star.on { color: #e3a008; }
.share-opts { display: flex; flex-direction: column; gap: 10px; }
.share-opts .note { margin-top: 0; }
.sheet h3 .icon { flex: 0 0 auto; }

/* ---------- Reader ---------- */
.reader { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; user-select: text; }
.viewport { position: absolute; left: 0; right: 0; top: 0; bottom: var(--foot-h); overflow: hidden; }
.flow {
  height: 100%; column-fill: auto; padding: 20px 0 12px;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  will-change: transform; transform: translate3d(0,0,0);
  hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
}
.flow.anim { transition: transform .25s ease-out; }
.flow p { margin: 0 0 .15em; text-indent: 1.4em; text-align: left; }
.flow p.ni { text-indent: 0; }
.flow h1, .flow h2, .flow h3 { font-family: Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.25; break-after: avoid; page-break-after: avoid; }
.flow h1 { font-size: 1.35em; margin: .2em 0 .8em; text-align: center; }
.flow h2 { font-size: 1.15em; margin: 1.1em 0 .5em; }
.flow h3 { font-size: 1.0em; margin: 1em 0 .4em; }
.flow .verse { margin: .6em 0 .8em 1em; break-inside: auto; }
.flow .verse div { text-indent: -1em; padding-left: 1em; text-align: left; }
.flow .verse .gap { height: .7em; }
.flow figure { margin: .8em 0; text-align: center; break-inside: avoid; page-break-inside: avoid; }
.flow figure img { max-width: 100%; height: auto; border-radius: 4px; background: var(--panel); }
.flow figcaption { font-size: .8em; color: var(--muted); margin-top: .3em; }
.flow .box { border-left: 3px solid var(--accent); padding: .1em 0 .1em .7em; margin: .7em 0; }
.flow .pg { font: 11px/1 Roboto, Arial, sans-serif; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 4px; margin: 0 3px; vertical-align: 2px; text-indent: 0; white-space: nowrap; user-select: none; }
.flow .end { height: 1px; }
.flow .endnote { text-align: center; color: var(--muted); font-size: .8em; margin-top: 2em; font-family: Roboto, Arial, sans-serif; }
[data-theme="dark"] .flow img, [data-theme="contrast"] .flow img { filter: brightness(.9); }

.foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot-h); display: flex; align-items: center;
  justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.foot .t { overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }

.bar { position: absolute; left: 0; right: 0; background: var(--panel); border-color: var(--line); z-index: 5;
  transition: transform .2s; display: flex; align-items: center; }
.bar.top { top: 0; height: var(--bar-h); border-bottom: 1px solid var(--line); transform: translateY(-100%); padding: 0 4px; }
.bar.bottom { bottom: 0; border-top: 1px solid var(--line); transform: translateY(100%); padding: 10px 16px 14px; flex-direction: column; align-items: stretch; gap: 6px; }
.reader.ui .bar { transform: none; }
.bar .title { flex: 1; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.bar .info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* ---------- Sheets (TOC, settings) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85%; overflow: auto; background: var(--bg);
  border-radius: 16px 16px 0 0; z-index: 11; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
.sheet h3 { margin: 10px 0 12px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.toc a { display: block; padding: 11px 4px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 15px; }
.toc a.sub { padding-left: 20px; font-size: 14px; color: var(--muted); }
.toc a.cur { color: var(--accent); font-weight: 600; }
.set { margin: 14px 0; }
.set label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; }
.seg button.on { border: 2px solid var(--accent); font-weight: 600; }
.swatch[data-v="light"] { background: #fff; color: #1b1b1b; }
.swatch[data-v="sepia"] { background: #f5ecd9; color: #4a3b2a; }
.swatch[data-v="dark"] { background: #111315; color: #d8d8d8; }
.swatch[data-v="contrast"] { background: #000; color: var(--accent-fg); }
.goto { display: flex; gap: 8px; }
.goto input { flex: 1; min-height: 44px; font-size: 16px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px;
  border-radius: 20px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Textbook elements produced by tools/convert_pdf.py ---------- */
.flow .tasks, .flow .gloss { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45;
  background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0; }
.flow .tasks p, .flow .gloss p { margin: 0 0 .35em; text-align: left; }
.flow .gloss { border-left: 3px solid var(--accent); }
.flow p.note { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; font-style: italic; text-indent: 0; margin: .6em 0; }
.flow p.attr { text-align: right; text-indent: 0; font-style: italic; color: var(--muted); margin: .1em 0 .8em; }
.flow p.sep { text-align: center; text-indent: 0; color: var(--muted); margin: .5em 0; letter-spacing: .3em; }
.flow h2 .pg, .flow h3 .pg { font-weight: normal; }
.toc .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 4px 2px; }
.toc a .p { float: right; color: var(--muted); font-size: 13px; margin-left: 8px; }

/* ---------- Elements produced by tools/convert_layout.py (typeset textbooks) ---------- */
.flow figure img { cursor: zoom-in; }
.flow h4.mk { font: 700 .78em/1.3 Roboto, "Noto Sans", Arial, sans-serif; letter-spacing: .05em; color: var(--accent);
  margin: 1em 0 .3em; break-after: avoid; page-break-after: avoid; }
.flow p.hl { color: var(--accent); text-indent: 0; }
.flow p.small { font-size: .82em; text-indent: 0; color: var(--muted); }
.flow sup, .flow sub { font-size: .7em; line-height: 0; }
.flow .kbox { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45; background: var(--panel);
  border-radius: 8px; padding: .45em .7em; margin: .5em 0; border-left: 3px solid var(--accent); }
.flow .kbox > b { display: block; }
.flow .frame { background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0;
  font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; line-height: 1.45; }
.flow .frame p { text-indent: 0; margin: 0 0 .35em; text-align: left; }
.flow .tbl { margin: .8em 0; font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .8em; line-height: 1.35; }
.flow .tbl .tt { font-weight: 600; text-indent: 0; text-align: center; margin-bottom: .3em; }
.flow .tbl table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.flow .tbl th, .flow .tbl td { border: 1px solid var(--line); padding: .3em .35em; vertical-align: top; text-align: left; overflow-wrap: anywhere; hyphens: auto; }
.flow .tbl th { background: var(--panel); }
.flow .tbl tr { break-inside: avoid; page-break-inside: avoid; }

.zoom { position: fixed; inset: 0; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; background: rgba(0,0,0,.92); z-index: 30; }
.zoom-in { position: absolute; inset: 0; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
.zoom-in img { margin: auto; flex: none; touch-action: pan-x pan-y; object-fit: contain; background: #fff; cursor: zoom-in; }
.zoom-x { position: absolute; top: 8px; right: 8px; color: #fff; background: rgba(0,0,0,.5); z-index: 31; }
.flow h4.sh { font: 700 .95em/1.3 Roboto, "Noto Sans", Arial, sans-serif; text-align: center; margin: .8em 0 .4em; break-after: avoid; page-break-after: avoid; }

/* maths books */
.flow h4.ex, .flow h4.try { font-family: Roboto, Arial, sans-serif; margin: 1.1em 0 .3em; font-size: 1em; }
.flow h4.ex { display: inline-block; background: #f7e400; color: #111; padding: .1em .6em; border-radius: 3px; }
.flow h4.try { color: var(--accent); }
.flow p.goal { font-size: .85em; text-indent: 0; background: var(--panel); border-radius: 8px; padding: .4em .7em; }
.flow b.bd { display: inline-block; text-indent: 0; padding: 0 .4em; border-radius: 1em; background: var(--fg); color: var(--bg);
  font: bold .8em/1.45 Roboto, Arial, sans-serif; margin-right: .2em; }
.flow b.nb { display: inline-block; text-indent: 0; min-width: 1.4em; border-radius: 4px; background: var(--accent); color: var(--accent-fg);
  text-align: center; font-size: .8em; margin-right: .3em; }
.flow .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.15; margin: 0 .1em; }
.flow .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .15em; }
.flow p.ml { text-indent: 0; padding-left: 1em; }
.flow p.side { font-size: .85em; }
.flow details.ans { margin: .3em 0 .8em; font-size: .9em; }
.flow details.ans summary { color: var(--accent); cursor: pointer; font-family: Roboto, Arial, sans-serif; }

/* wide tables become one card per row on phones */
@media (max-width: 560px) {
  .flow .tbl.cards table, .flow .tbl.cards tbody, .flow .tbl.cards tr, .flow .tbl.cards td { display: block; width: auto; }
  .flow .tbl.cards tr:first-child { display: none; }
  .flow .tbl.cards tr { border: 1px solid var(--line); border-radius: 8px; margin: .5em 0; padding: .3em .5em; }
  .flow .tbl.cards td { border: 0; padding: .15em 0; }
  .flow .tbl.cards td::before { content: attr(data-l); display: block; font: 600 .75em/1.3 Roboto, Arial, sans-serif; color: var(--muted); }
  .flow .tbl.cards td:first-child { font-weight: 600; }
}
.flow figure.vec svg { max-width: 100%; height: auto; display: inline-block; background: #fff; border-radius: 4px; cursor: zoom-in; }
[data-theme="dark"] .flow figure.vec svg, [data-theme="contrast"] .flow figure.vec svg { filter: brightness(.9); }
.flow .rt { border-top: 1px solid currentColor; padding-top: 1px; margin-left: 1px; }
.flow .it { display: inline-block; max-width: 100%; margin-right: .9em; text-indent: 0; }
</style>

, алардын түрлөрү. Этиштин өзгөчө формалары. Синтаксис: Сүйлөмдүн баш мүчөлөрүнүн ээрчишүүсү $ 44, 53, 58. Окуучулар учун тест."},{"t":"h3","h":"ББК 81. 2Ки я721"},{"t":"p","h":"©[Өмүралнева С], [Сапарбаев А.) Эгембердиев Р., Мусаева В. 2007. © КР Билим беруу жана илим министрлиги, 2007."},{"t":"p","h":"© =Полиграфбумресурсы», 2013."}],"sub":[{"title":"ББК 81. 2Ки я721","b":12}],"pages":[1,2]},{"title":"БАШ СӨЗ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"3\">3<\/span>БАШ СӨЗ"},{"t":"p","h":"Кыргыз тили – кыргыз элинин мамлекеттик тили жана ошондой эле улуттук маданияттын эн жогорку формасы катары саналат. Кыргыз тилин эне тил катары мектептердин жогорку класстарында окутуу тилдик, кептик жана маданий компетенттуулуктерду калыптандыруу максатын көздөйт."},{"t":"p","h":"Бул 10-класстын «Кыргыз тили» окуу китебинин экинчи басылышы 1993-жылы жарык көргөн. Андан кийин оңдолуп, толукталып кыргыз тили боюнча билим беруунун Мамлекет: тик стандартына жана кыргыз тилинин окуу программасьг на {5-11-кл.) ылайыкташтырылып 2003-жылы учунчу жолу, «Жер-жерлердеги мектептерде окуу китептери жетишпейт» деген мугалимдердин суроо-талаптарынан улам, «Кыргыз тилинин программасынын такталган акыркы вариантынын негизинде толукталып 2004-жылы төртүнчү, ал эми 2007-жылы бешинчи ирет басылып чыккан. 6-басылышы КР Өкмөтүнүн «Билим берүү женунде», «Мамлекеттик тил женунде» мыйзамдарын жана 2012-жылкы «Туруктуулук жана бакубат жашоо»"},{"t":"p","h":"ларын эске алуу менен (1 0-класс – жумасына 2 саат, жыл бою 68 саат.) кайрайан иштелип чыкты."},{"t":"p","h":"Тил илиминин фонетика, орфография, лексика, орфоэпия, морфология, синтаксис, байланыштуу кеп сыяктуу негизги бвлумдеру бешинчи класстан баштал, тогузунчу класска че йин системалуу курс катары жөнөкөйдөн татаалга, жеңилден оорго карата деген дийактикалык принциптин негизинде окутулуп келген. Эми 10-класста ал тилдик материалдар анйан ары дагы бир кыйла тергндет буга чейин алган билимдерин сис бекемдее максатында окутулмакчы. министеп  жендвмдуулугун көркөм тил каражаттарынын таасирдүүлүгүн, эмоционалдуу образдуулугун терең өздөштүрүү максатын көздөгөн практикалык машыгуу, көнүгүүлөргө озгоче көңүл бөлүндү. Буларга кошумча дагы балдар буга чейинки класстарда ээ болуп келген билимдерин иш жүзүндө турмушта колдоно билуу мүмкүнчүлүктөрүн арттыруу, дааналап айтканда, билгичтик, ыкма, машыгууларын калыптандыруу эне тилин практикалык-коммуникативдик багытта уйретиуу максатында кеп» бөлүмүнө ботенче одун берилди. Мында «Текст боюнча машыгуу иштери», «Кептин стилдери», «Иш"},{"t":"v","l":["иш кагаздары»,","«Расмий эмес","стиль», «Илимий стиль»,"]},{"t":"p","h":"«©тилдер жана байланыштиу кеп боюнча жалпы көнүгүүлөр» аттуу темалар орун алып, кептин функционалдык-маанилик тиурлеру, стилдери, тексттер менен иштөө, аларга карата тил каражаттарын туура тандоо боюнча тушунуктер, ар кыл типтеги көнүгүүлөрдү. баяндама, дилбаяндарды аткаруу жана аларды талдоо иштери сунуш кылынды. Грамматикалык темаларга ылайыгына жараша окутуп-тарбиялоочулук максаттагы тексттер кенцгүү, машыгуу учун сунушталды."},{"t":"p","h":"Кыргыз адабий тилиндеги сөздөрдү, терминдерди туура, так, корктуу, логикалуу ачык-айкын, таза, орундуу колдоно билиууге, суйлев маданиятына, кеп адебине, сөзмөрлүккө, чечендикке (риторикага), ораторлукка. кепкорлук, куйма кулактыкка багытталган өз алдыларынча иштее учун оозеки, жазуу жумуштарына да жетишээрлик даражада көңүл бөлүндү."},{"t":"p","h":"Окуу китебин жазууйа бугунку күнгө чейинки жалпы тил илиминдеги, эне тилибиздеги илимий жетишкендиктер, методикалык адабияттар колдонулуп, педагогиканын, дидактиканын бардык принциптери сакталды жана инсанга багыттап окутуу менен тилдик, кептик жана маданий компетенттуулуктерду калыптандырууга өзгөчө көңүл бөлүндү. Китептин мазмундук-структуралык жагдайы тууралуу кошумча ой-пикирлерйи билдирсеңиздер кабыл алабыз. Авторлор."}],"sub":[],"pages":[3,4]},{"title":"&amp; 1. ТИЛДИН ЧЫГЫШЫ ЖАНА ӨНҮГҮШҮ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"5\">5<\/span>&amp; 1. ТИЛДИН ЧЫГЫШЫ ЖАНА ӨНҮГҮШҮ"},{"t":"p","h":"Тил кандайча пайда болгон? Биздин күнгө чейин кандай процесстерди башынан өткөргөн? Анын өсүп-өнүгүү, баюу жолу кандай? Бул өңдүү суроолорду чечмелөө үчүн адам баласынын басып өткөн жолуна кайрылууга туура келет."},{"t":"p","h":"Эмгектенүүнүн натыйжасында адам жекече күн өткөрбөстөн биргелешип, алгачкы эң жөнөкөй эмгек каражаттарын ойлоп табууда, коркунучтуу жаныбарлардын таасиринен коргонууда, биргелешип аң уулоого чыкканда өз ара пикир алышуунун элементтери пайда боло баштаган. Тиешелүү даражада бирин бири түшүнүүгө аракеттер жасалган. Ымдоо, жаңдоо, сүрөт тартуу аркылуу түшүнүшүп отуруп, бара-бара татаалданган, бир муундуу сөздөрдөн куралган жөнөкөй сездерден баштап, заманбап пикир алышуунун каражатына, улуттук, мамлекеттик, эл аралык милдет аткаруучу кызматка айланды."},{"t":"p","h":"Тилдин пайда болушун Ф. Энгельс эмгектин натыйжасында келип чыккан деп карайт. Чындыгында, адамзаттын ар кандай түйшүгү да, ойлоосу да, ар кандай чыгармачылыгы да эмгек менен байланышкан. Ар бир ишти жасоодон, аткаруудан мурда ичибизден ойлонуп, бирөөлөр менен кеңешип көрүп, анан ишке ашырабыз. Демек, ичибизденби, же сыртыбызданбы, баары бир сүйлөө менен оюбуз жүзөгө ашырылат. Айталы, силер жазуу үчүн колдонулган калем азыркы абалына жеткенче кыйла өзгөрүүнү, өнүгүүнү башынан кечирди. Жазуунун алгачкы башатында куштун канатынын калемчесин пайдаланса, кийин атайын жасалган калемге уч кийгизип пайдаланышкан. Андан соң <span class=\"pg\" data-n=\"6\">6<\/span>сыяны дайыма көтөрүп жүрбөө үчүн, поршендүү ка- ‚ лемди ойлоп табышкан, бара-бара аны өркүндөтүүнүн ' натыйжасында учунда шариги бар калемди ойлоп чыгарышты. Мына, көрдүңөрбү, жөнөкөй эле калемдин биздин күнгө чейинки тарыхында өнүгүп, өркүндөөнүн натыйжасында канча ойлонууну, эмгектенүүнү талап ‚› кылган. Мындан кандай жыйынтык чыгарууга болот? Калемдин улам жаңы түрүн чыгаруу учун, аны жасап жаткан адамдар өз ара пикир алышуулары керек эле. Эгерде бири-бири менен түшүнүшүү, ошондой эле коомдук өнүгүү зарылчылыгы болбосо, анда калемдин мынчалаган улам жаңы түрлөрү жасалмак эмес. Ошентип, адам баласынын жашоосундагы негизги шарт, пикир алышуу зарылчылыгы келип чыккан. Анын натыйжасында тилдин өнүгүүсү пайда болуп олтурат."},{"t":"p","h":"Тилдин чыгышын окумуштуулар кандай негизде карашат? Маселен, айрым көз караштарды карап көрсөк, тил үн тууроонун негизинде пайда болгон деген пикир бар. Алардын ою боюнча, жаныбарлардын үнүн тууроонун негизинде пайда болгон."},{"t":"p","h":"Мындай пикир алгылыктуу эмес. Анткени бизди курчап турган бардык эле заттар үн чыгара бербейт. Үн чыкса да, дүйнөдөгү окшош заттардан бирдей эле үн чыкмак да, дүйнө тилдеринде улуттук тилге ажырабастан, бирдей аталып калмак. Үн тууроо теориясынын жактоочуларынын айтымы боюнча жылкы – кишенеме, уй- мөөрөмө, жылан – ышкырма ж. б. болуп калмак."},{"t":"p","h":"Мындан тышкары сырдык сөз теориясы деген топтогу окумуштуулардын пикири боюнча корккондон, чочугандан, кубангандан, кайгыргандан тил пайда болгон дешет. Бул пикир толук алгылыктуу эмес. Айрым бир эмоциялуу сезимдер үн чыгарууга түрткү берип, таасир этсе эткендир, бирок тил жалаң эле сырдык сөздөрдөн турбасы белгилүү."},{"t":"p","h":"Тил – коомдук көрүнүш, ал коом пайда болгондо ыы келип чыккан. Коомдун өнүгүшү менен тил да өнүгүү- да тил адам баласынын оюн тиешелүү деңгээлде андан ары өнүктүрүп, болгон бардык иш-тажрыйбаларын тил гө, өзгөрүүгө дуушар болуп отурат. Эмгектенүү учурун- <span class=\"pg\" data-n=\"7\">7<\/span>' аркылуу бир элден экинчи элге, бир муундан экинчи муунга өткөрүп турат. Тил коомдук эмгекти уюштурууда, аны андан ары өнүктүрүүдө, илим менен техниканын өнүгүшүнө өбөлгө түзөт."},{"t":"raw","h":"<div class=\"gloss\"><p>рл<\/p><\/div>"},{"t":"p","h":"Коомдук өнүгүштүн тиешелүү деңгээлге жетишине, маданият менен адабияттын өнүгүшүнө тилдин түздөн-түз таасири бар. Коомдук, күндөлүк жашоо-турмуштагы өнүгүштү тил аркылуу калыптандырып, өндүрүштүк тажрыйбаларды топтоп, эмгек каражаттарын өнүктүрүүнү камсыз кылып, ошону менен жашоонун материалдык негизин, деңгээлин жогорулатууга түрткү берет. Башка тилде сүйлөгөн адамдар менен катыш-байланыш түзүп, алардын иш-тажрыйбаларын өзүнүн чөйрөсүнө жайылтат. Демек, тил – адам коомунун өнүгүшүнүн негизин түзөт."},{"t":"p","h":"Дүйнө жүзүндө жашаган элдер, улуттар, мамлекеттер өз алдынча улуттук тилге, аң-сезимге ээ, Айрым бир элдин тили аймактык кеңейүүгө ээ болуу менен диалектилерге бөлүнөт. Кээ бир улуттук тилдер ажырап отуруп, жакын тектеш тилдерге айланып кетиши да мүмкүн. Андай аймактык ажыроо бара-бара жакын жана алыс тектеш тилдерге бөлүнөрү дүйнө тилдеринин практикасында белгилүү. Бирок мындай көрүнүш кылымдаган убакытты талап кылуучу кубулуш."},{"t":"p","h":"Биздин кыргыз тили түрк тилдеринин катарына кирет. Ал узак жолду басып өткөндүктөн, тектеш жана тектеш эмес тилдердин арасында өнүгүп, биздин күнгө ЧЕ ЧЕ сы ЧЕ ыйыы т аный к ЕЛЕ ч үү ы ы крл жетип отурат. Кыргыз элинин тарыхын карап чыгуу жана жакын тектеш элдер менен саясий, экономика- лык, географиялык жактан өз ара катышта болгонду- гун тилдик жана адабий мурастар далилдейт. Кыргыз тили айрыкча эгемендүүлүккө ээ болгондон бери му- рункудай тилдик карым-катыштар орус тили аркылуу жүрбөстөн, ар бир мамлекет менен тикеден-тике байла- нышта болуунун натыйжасында ар кандай сөздер ка- был алынуу менен тилдик өнүгүүгө дуушар болууда. менен Орхон-Енисей доорунан баштап, Борбор Азияда жашаган мезгилге чейинки жашоо турмушунда алыс"},{"t":"raw","h":"<div class=\"gloss\"><p>алы жы ыл айы ы лы н К<\/p><\/div>"}],"sub":[],"pages":[5,7]},{"title":"у 2. КЕПТИН СТИЛДЕРИ БОЮНЧА БИЛИМДЕРИН СИСТЕМАЛАШТЫРУУ ЖАНА ЖАЛПЫЛАШТЫРУУ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"8\">8<\/span>БАЙЛАНЫШТУУ КЕП"},{"t":"h3","h":"у 2. КЕПТИН СТИЛДЕРИ БОЮНЧА БИЛИМДЕРИН СИСТЕМАЛАШТЫРУУ ЖАНА ЖАЛПЫЛАШТЫРУУ"},{"t":"p","h":"Тил – адам баласынын байланыш куралы экендигин билебиз. Байланыш түзүүнүн ар кандай жолдору бар. Бирде оозеки түрүндө сүйлөшсөк, кээде жазуу түрүндө пикир алышабыз. Ошондуктан оозеки жана жазма түрү пикир алышуунун эки жактуулугун пайда кылат. Пикир алышуудан башка коомдо алака мамиле түзүүчү жагдайлар бар. Мына ушундай коомдогу кызматына карата тилдин стилдик кызматы келип чыгат."},{"t":"p","h":"Стиль – ыкма дегенди билдирет. Ал түшүнүк бир эле тил илиминде колдонулбай, анын мааниси кең. Түшүндүрүү стили, кийим стили, көркем сүрөттөгү Жый айный йр айр аы ый а у айбы айы ай. а. ы. ы Са Ты бб аы ай а. ы а аа ы аа дон калат. Анткени физика илиминде иштеген адамдар- тарыхчылар үчүн аны түшүнүүнүн зарылчылыгы бол- үчүн түшүнүктүү, илимий стиль илим жаатында эмгек- тенгендер үчүн терең түшүнүктүү болсо, башка бир илимдин тармагындагылар үчүн терең түшүнүксүз бой- га физикалык терминдер түшүнүктүү болгону менен, блицистикалык стиль болуп бөлүнөт. Ар бир стилдин колдонулуш өзгөчөлүгү, тил каражаттарынын катышы, окуучулардын, пайдалануучулардын түшүнүү жана пайдалана билүү мүмкүнчүлүгү да ар кыл. Мисалы, көркөм чыгарманын стили бардык курактагы адамдар стиль ж. б. көм чыгарманын стили, расмий жана расмий эмес иш кагаздарынын стили, илимий-техникалык стиль, пу-"},{"t":"p","h":"Тил коомдо пайдалануу мүмкүнчүлүгүнө карата бир канча ыкмада же стилде колдонулат. Алар көрбөйт. <span class=\"pg\" data-n=\"9\">9<\/span>Химиялык аныктамалар, терминдер химия илиминин стилдик өзгөчөлүгүн түзсө, адабиятчылар үчүн адабий каарман, пейзаждык сүрөттөө, кульминация ж. б. түшүнүктөр адабият илимине тиешелүү стилди пайда кылат. Мамлекеттик иш кагазды жүргүзүүчү тил кат, программа, устав ж. б. стилдик жактан бир жактуу, штамптуулугу менен айырмаланат. Алар түшүндүрүү, элге маалымат берүү кызматынан мурда адам менен мекемени, мекеме менен мекемени, мамлекет менен мамлекетти ж. б. байланыштыруучу кызмат аткарат."},{"t":"p","h":"Ошентип, тилибиздеги сөздөрдүн кеп түзүү өзгөчөлүгүнө карата бир башкача түргө бөлүнө тургандыгы мындан мурдагы класстардан белгилүү. 10-класста стилдин түрлөрү боюнча алган билимдер машыгуу аркылуу системалаштырылат."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[8,9]},{"title":"§ 3. КӨРКӨМ СТИЛДИН КЕПТИН ТҮРЛӨРҮ МЕНЕН КАРЫМ-КАТНАШЫ","blocks":[{"t":"h3","h":"§ 3. КӨРКӨМ СТИЛДИН КЕПТИН ТҮРЛӨРҮ МЕНЕН КАРЫМ-КАТНАШЫ"},{"t":"p","h":"Керкем стиль башка түрлөрдөн айырмаланып, универсалдуу стиль деп аталат. Ал бардык курактагы, ар кандай кесиптеги адамдарга түшүнүктүү. Көркөм чыгарманын жаралышынын негизги максаты – адамдарга эстетикалык-нравалык тарбия берүү менен бирге руханий дүйнөсүн, таанып-билүүсүн, дүйнөгө болгон көз карашын калыптандыруу."},{"t":"p","h":"Көркөм стиль башкалардан айырмаланып, тилдик каражаттарды колдонууда эне тилдеги бай материалдардын бардык түрлөрүн, б. а., синонимдердин, өтмө майнидеги сөздөрдүн, антонимдердин көркем ыкмада колдонулушун, фразеологизмдерди ж. б. пайдалануу менен окурмандын көңүлүн өзүнө бурат, чыгарманын көркөм сөз кудурети артат, стилдик өзгөчөлүгү пайда болот."},{"t":"p","h":"Көркөм текст пайда болордон мурда автор тарабынан иштелип чыккан план боюнча системаланып, окуяны бир ыраатта берүү үчүн кырдаалды баяндоо, жаратылышты же көрүнүштү сүрөттөө, кыялындагы нерсени ой жүгүртүү аркылуу берүү ыкмалары ишке ашат."},{"t":"raw","h":"<div class=\"gloss\"><p>ЧЕ ЧЕ ЧЕ ЧЕ ЧЕР ЧЕ ЧЕ ЧЕ ЧЕ ЧЕ че жр че ЧЕ СЕ Че СҮ С<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"10\">10<\/span>Ошентип, тексттеги сүрөттөө, баяндоо, ой жүгүртүү ыкмалары келип чыгат. Булар тексттин түзүлүшүн пайда кылып туруу менен бирге ар биринин өзгөчөлүгү көрүнүп турат."},{"t":"p","h":"Сүрөттөөнүн түрлөрүнө жаратылышты, адамдын тышкы келбетин, ички мүнөзүн, үй буюмдарын, алардын жайгашуусун ж. б. чагылдыруу кирет. Ар бирин сүрөттөө үчүн ар кыл сөз каражаттары тандалат."},{"t":"p","h":"1. Бул тексттен көркөм сөз каражаттарын таап, сүрөттөөнүн кайсы түрүн түзгөндүгүн аныктагыла."},{"t":"p","h":"Ким билбейт, жайдын толгон кезиндеги август түндөрүн! Асмандагы жылдыздар алыста турганы менен, ар бири өңүнө чыгып, алаканга салгандай ар бири өзүнчө нур төгүп, чет-четинен бүлбүлдөгөн күмүш кырчоо чалып, асмандын тиги каптал, бу капталына жайнап, кири жок жадырап карашат."},{"t":"p","h":"‚..Капчыгайга сырттан келе берген сыдырым талаанын алда кайсы жеринен бүрдөгэн эрмендин кермек ачуу чаңын учуруп, аңызда шамалдап жаткан самандын билинер-билинбес коңур жытын лепилдетип, жол катары шыралжын буруксуп, ушунун баары терге жибиген камыт-шлиянын кара май жытына аралашып, адамды энги-денги мас кылгансыйт. Жол устуне унулген аскалар кыйгач көлөкө таштап, нары сайдагы бадалдын арасында Күркүрөө жаны тынбай алдастайт. Тээ артта калган темир жолдо поезддер көпүрөдө нары өтүп, бери еткен сайын жаңырык ээрчитип, гудокторду алыска-алыска созолонтот. (Ч. А.)"},{"t":"p","h":"Өзүңөрдү текшергиле:"},{"t":"p","h":"толгон кези, жылдыздар өңүнө чыгып, алаканга салгандай нур төгүп, бүлбүлдөгөн күмүш кырчоо чалып, асмандын капталы кири жок жадырап карашат, коңур жытын лепилдетип, шыралжын буруксуп, эңги-деңги мас кылгансыйт, жол үстүнө үңүлгөн аскалар, Күркүрөө жаны тынбай алдастайт, жаңырык ээрчитип, гудокторду созолонтот."},{"t":"p","h":"(Көркөм чыгарманын тутумунда суреттее, сүрөттөөнүн ичинен жаратылыштык сүрөттөө.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"11\">11<\/span>2. Тексттеги етме маанилүү сөздердү таап, алардын негизги мааниге карата болгон катышын аныктагыла. Сүрөттөөнүн кайсы түрүн түздү?"},{"t":"p","h":"Биздин Шекер – эң чоң айыл, үч жүздөн ашык түтүн. Каттаган сайын тигинден-мындан жаңы үйдүн төбөсүн көрүп калам. Айылым өсүп баратат, чоңоюп баратат. Турган орду мал-жанга жайлуу, суу башында. Таластын Жон-Арпа тоосунун этегинде, эзелтен Манас делип аталган кош чокулуу улуу тоонун так түбүндө. Кезинде Аккуласын алкынтып, ушул чокуга чыккан экен алп Манас, дагы кайдан жоо келип калбасын деп, туш-тарапка көз чаптырып турган экен ушул бийиктикте эр Манас. (Ч. А.)"},{"t":"p","h":"Көңүл бургула:"},{"t":"p","h":"Бул чакан тексттеги 2- жана З-сүйлөмдөн башкасынын баяндоочу этиштен эмес. Бул сүрөттөөнүн өзгөчөлүгү, силер белгилегенден тышкары, оозеки кепке жакындыгында, акыркы сүйлөм кадимки оозеки сүйлөшүү кебинин үлгүсүндө түзүлгөн, ички эргүүнү (эмоцияны) билдирип турат."},{"t":"p","h":"83. Күзгү жаратылышка көңүл буруу менен өзүңөр сүрөттөө түзгүлө. Көркөм сөз каражаттардын астын сызгыла, Текстти улап түзгүлө."},{"t":"p","h":"Күз. Айланадагы кооздук саргыч-жашыл түс менен алмаша баштаган. Асманда бозомук булуттар каалгып, кайдадыр белгисиз удургушат. Жер бетиндеги майда жандыктар да өз түйшүгү менен алек. Алп кумурска өзүнөн чоң коңузду сүйрөп, үйүнө карай кара терге түшүп жол тартууда."},{"t":"p","h":"4. Текстти көңүл буруп окуп, тил каражаттарын тапкыла. Ырды кара сөз түрүндө кайра түзүп көргүлө."},{"t":"h3","h":"КУМДАГЫ ИЗДЕР"},{"t":"v","l":["Көл жээгин кыйыр түздөдү,","кыдырып коңур күз келди.","Кырданып жаткан кызыл кум","кургаган балык түспөлдүү.","","Кургаган балык түспөлдүү","кубулуп, коңур күз келди,","<span class=\"pg\" data-n=\"12\">12<\/span>көбүрөөк байкай баштадым","көл жактан кайткан издерди.","","Жаныма жакын бул аймак","жүрбөсөм дагы жыл-айлап.","Жалтырап кумда из жатат","жанаша баскан жыңайлак.","","Ачылбай калган барактын —","ал издин сырын жабат кум.","Аптабы кайткан күн турат","ашындай чычырканактын.","","Көл калаар артта, кум калаар,","ал кумга чөгүп ыр калаар...","Кыйкуулап кайтып баратат","катарын жазбай турналар. (А. Р.)","","Көңүл бургула:"]},{"t":"p","h":"Ыр саптарындагы тыныш белгилер кандай коюлган? Бул автордун атайын стилиби, же сүйлөм курулушуна ылайык коюлганбы? Эмне үчүн ар бир саптын башы баш тамга менен башталбайт?"},{"t":"p","h":"Сүрөттөөнүн бир түрү – адамдын тышкы келбетин, ички мүнөзүн сүрөттөө. Мындай сүрөттөө көркөм чы- гармадагы каармандын текст ичиндеги абалын, адамдар арасындагы ордун, анын кулк-мүнөзүн чагылдырууга жардам берет. Ага шайкеш келүүчү сөз каражаттары- нын тандалышы мүнөздү, келбетти ачып берүүчү куду- рет болуп саналат."},{"t":"p","h":"5. Тексттин үзүндүсүнөн Жамийланын келбетин берген керкөм сөз каражаттарын белгилегиле."},{"t":"p","h":"Жамийла өзү шыңга бойлуураак, белдүү келин. Эки өрүмгө батпай, дүркүрөп ескен калың чачын кысып туруп, бир байлам ак жоолукту маңдайына кыйгачтатып, шарт буунуп алса, кызыл торусунан келген, балкылдаган төгөрөк жүзүнө ак жоолук эп келише калат. Жамийла күлгөндө, анын чымкый кара сүйрүрөөк көзүндө ден соолуктун, жаштыктын ашып-ташкан күчү ойт берип, <span class=\"pg\" data-n=\"13\">13<\/span>ал эмнегедир өзүнчө бой каранып, секетпайдын туздуусунан ырдап жиберет. Билбейм, балким, жаштайынан атасы менен бирге ой-кырда жылкы айдашып, ат чапкылап жүрүп өктөм өскөнбү, анын үстүнө, жалгыз кыз бала экен, айтор, Жамийланын жүрүш-турушунда кандайдыр кайраттуулук, эркекке таандык мүнөз бар. Ар бир ишке шамдагай киришип, башка келиндердей башым, белим дечү эмес. Анан өзү да бирееге жемин жегизбеген, өжөр, айтышкан менен айтышып, тилдешкен менен тилдешип, ал тургай, бир-эки жолу келиндер менен тытышканы да бар..."},{"t":"raw","h":"<div class=\"gloss\"><p>И 12<\/p><\/div>"},{"t":"p","h":"Ал жөнүндө апам: «Келинибиз ошондой ачык-айрым, тайманбас... Адамдын ичи-койнуна ачыгы эле жакшы болот, сасыткылар кайра ошол тымпыгыйлардан"},{"t":"v","l":["дегени бар. (Ч. А.)","","Көңүл бургула:"]},{"t":"p","h":"Бул кандай сүрөттөө, портретпи, мүнөзбү? Сүрөттөө кимдин кеби аркылуу кетип жатат, автордукубу же каар мандыкыбы?"},{"t":"p","h":"6. Өзүңөрдүн жолдошунардын, курбуңардын келбетин, мүнөзүн сүрөттөгүлө."},{"t":"p","h":"Т. Бул сүрөттөөнүн кайсы түрү? Эмнени сүрөттөп жатат? Бул – биздин үй. Биздин үй үч бөлмөлүү. Терезе тарапта чоң карапада гүл өстүрүлгөн – менин бөлмөм. Бийик өскөн гүл менин бөлмөмө өзүнчө бир ажайып көрк бергендей сезилет. Андан бери жакта түстүү телевизор, катарында үн жазгыч. Терезенин сол жак тарабында менин жазуу столум. Столдун катарында китеп текчем турат. Текчелердеги китептин саны эки миң беш жүздөн ашат. Аны ата-энем мен төрөлө электен бери жыйнаган экен. Он сегизге чыкканымда белекке беришкен."},{"t":"p","h":"Ар бир текчеде тематикага ылайык китептер бар: биринчи катарда жалаң сөздүктөр, б. а., энциклопедиялык, котормо, орфографиялык, түшүндүрмө ж. б. Андан ылдыйкы катарда дүйнөлүк жана кыргыз жазуучуларынын чыгармалары. Алардын мукабалары абдан ар түрдүү. Айрым бир авторлордун бир канча томдогон жыйнактары гана окшош түстө болбосо, калгандары ар кандай түстө <span class=\"pg\" data-n=\"14\">14<\/span>болуп, кооздук да берген сыяктуу көрүнөт. Окууга ылайык кызыктуу китептер көп."},{"t":"p","h":"Керебеттин жанында чакан күзгү, каршысында жапыз, жумшак отургуч бар. Жерде чакан шырдак салынып жатат. Шырдак менен китептин мукабалары түстөшүп, кооздук бергендей. Тамдын боорунда Ысык-Көлдүн колго тартылган чоң сүрөтү илинип турат."},{"t":"p","h":"Көңүл бургула:"},{"t":"p","h":"Суреттеего ылайык тандалган сөздөрдү белгилегиле."},{"t":"p","h":"8. Силердин мектептин кире беришин сүрөттөп жазгыла. Анда өсүп турган гүлдөргө, отургучтарга, алардын жаңы, эскилигине, кандай абалда турганына, кийим чечкичтерге чейин көңүл буруу менен жазгыла."},{"t":"p","h":"Керкем чыгармаларды тузуучу каражаттар катары ч сүрөттөөдөн башка автордук баяндоо деген тексттик категория бар. Баяндоо автордук же кейипкердик ыкмада ишке ашат да, окуянын жүрүшүн, кыймыл-аракеттик өнүгүүнү жазуу түрүндө бере алат. Баяндоо монолог түрүндө керкөм тексттин бир кылка, ырааттуу өнүгүп отурушуна шарт түзөт. Баяндоо көркөм тексттин маанилүү бөлүгүн түзөт, анткени сүрөттөө чыгармадагы жагдайды берүүчү кошумча каражат болсо, баяндоо автор тарабынан атайын маанини түзүүчү негизги маселе болуп саналат. Ошондуктан автордук баяндоо окуяны берүүчү автордук көз караш деп да аталат."},{"t":"p","h":"9. Тексттин кыскача бөлүгүндөгү баяндоого көңүл буруу менен эмне жөнүндө баяндалып жаткандыгын айткыла. Кандай тема койсоңор ылайык келет? Бул жерде кандай окуялык маанилүү бөлүк бар?"},{"t":"p","h":"...Тун ортосу эбак ооп кетсе да, ижарадан чыккан жарыктын көзү өчпөдү. Анын да жөнү бар. Эртең Ирсалат акыркы экзаменин бериш керек. Эртеңки экзамени «Элдик оозеки Ирсалатка бу сабак оңой сезилет огеле, бирок бирдемке айтайын деп акыл салса оозунан сөзү качып, эчтеңки эсине келбейт. Билип эле турган өңдөнөт, айта келсе эле Кудай акы, үн жок, сөз жок. Күйөөсү жана эле Ирсалатка: «Ушу сабагыңды заводдо иштесем да, көзүмдү жуумп тапшырып берем."},{"t":"p","h":"<span class=\"pg\" data-n=\"15\">15<\/span>Опоңой экен. Өлөйүн эгер калп айтсам,— деп карганып да алган, – чын. Чын айтам. «Манас», «Семетей», «Сейтек», «Кожожаш», «Курманбек» дегендеринди окубай эле семичкедей чакса болот. Неден коркосуң, неден? Биздин айылда көзү көр манасчы бар эле. «Манас» айтса барбы, таң аткыча оозу талыбайт. Колуна китеп карматып койсоң болду, айта берет... Бир сапар эл чогулган жерде «Манас» айтыңыз десек, түк айтпай койду, кашайып. Ошондо бирөө: «Бу акемин колуна китеп бербесеңер, асти айтпайт. Китеп бергиле – деди. Менин анатомия китебимди берген ошондо. Кызык деп ушуну айт! Угуп эле тургуң келет эми. Таң аткыча айтты. Ошо көр манасчыны биздин айылдык шыргыйдай болгон узун жазуучу повесть кылып жазыптыр. Билдиңби? А сен болсо «Манасты» билбейм деп коркуп отурасың. Коркпо»,— деп кабат-кабат кайрат айтып, Ирсалатка түзүк эле бакылдап алган. Азыр болсо кыргый алчу куштан бетер, столго отуруп, керебет үстүндө кыңкая жаткан Ирсалатка «Манасты» окуп жатат. Күйөөсүнүн кебетеси кудум эле өзү айткан манасчыдай тур салат. Дембе-дем чыйрала калып, кыраатын келтирип, «Манасты» окуп кирди:"},{"t":"v","l":["Эбин чагын журт күтүп,","Эл көрө элек экенбиз.","Эрегишип урушуп,","Эр көрө элек экенбиз.","Ала мөңгү тоо ашып,","Тоо көрө элек экенбиз... (С. Р.)"]},{"t":"p","h":"10. Төмөнкү текстке тема койгула. Көркем жанрды түзгөн көркөм боёкчолуу сөздөрдү көчүрүп, сөздүк түзгүлө."},{"t":"p","h":"Күн ылдыйлап, көлдүн тер жагына батканы калды. Ушул маалда Ак кеме көлдүн тиги кызгылт-сары нур эриген төрүнөн каалгып сүзүп чыкчу эле."},{"t":"p","h":"Бала дүрбүнү көлдүн төрүнө жиберди да, дем албай кадала тиктеди."},{"t":"p","h":"Тигине!"},{"t":"p","h":"Бала баарын унутту, кайгысын да, коопеунганын да ошол замат унутту. Көлдүн тиги нур куюлган көк жээгинен бери карай Ак кеме кылайып чыгып келатат. Тигине! Ана! Катар созолонгон морлору бар, сыналган узун, көл <span class=\"pg\" data-n=\"16\">16<\/span>бетин кескен кубаттуу, көздөн учкан кооз кеме келберсип келе жатыры! Бурулбастан, чайпалбастан көл толкунун үркүтпөй сүзүп келе жатыры! Бала аптыгып, дүрбүнүн көздөрүн көйнөгүнүн этеги менен сүртүп алды да, оңдоп кайра кармады. Кеменин элеси даана тартылды. Артында оргуштап калып жаткан көбүктүн изи эми көрүндү. Бала көзүн ирмебей, көңүлү толкуп карап жатты Ак кемени. Баланын эркинде болсо, кемени жакын кел деп чакырып алып, үстүндө түшүп бараткандарды көргүсү бар. Бирок кеме баланын бул оюн кайдан билсин. Кайдан келатканы белгисиз, кайда баратканы билинбей, Ак кеме келберсий сүзүп баратат. Кеме көз учунан өткүчө көп убакыт. Ал ортодо бала кыялы менен кантип балык болуп, кемеге кантип сүзүп барарына дейре элестетип чыгат... {Ч. А.)"},{"t":"p","h":"11. Тексттин темасын койгула, керкем стиль экендигин түшүндүргүлө. Ырдын терең мазмунун айтып бергиле."},{"t":"v","l":["Өмүр өтөт, өтө берет билинбей,","Сен өткөргөн өткөн күндүн бириндей.","Толкуп кыял кээде жокко урунуп,","А да кетер сызып тоонун желиндей.","","Өнөр, билим, эмгек менен гүлдөп ал,","Күлгүн жаштар күчүң барда эринбей.","Түбөлүккө ишиң калсын артыңда,","Кайран өмүр бошко кеткен дедирбей. (Н. Ж.)"]},{"t":"p","h":"12. Текстти окуп, андагы диалогдук кеп менен монологдук кептин өз ара шайкештигин, автордук кепти бөлүп, анын диалог менен карым-катышын аныктагыла."},{"t":"p","h":"Канча жатканымы билбейм. Кулагыма кебез тыгып алгансып, алыстан акырын үндөр чыгат: «Кана, жарык кылчы!» Кайсы бир колдор башымы, ийними, кекурегүмү сыйпалап жатты. «Жаны бар, мас тура»,— деди үн. Башка үн унчукту: «Жолду бошотуш керек»."},{"t":"p","h":"– Кана, достум, кичине жылып отур, машинени жолдон чыгарып коёлу – деп, бир кол ийинимен акырын сүрө итерди."},{"t":"p","h":"Мен онтоп алып баш көтөрдүм. Башым ылдый бетими жууп кан агып туруптур. Түзөнө албайм, көкүрөгүмөн бирдеме мыкчып турат. Тиги киши ширеңке чагып, <span class=\"pg\" data-n=\"17\">17<\/span>жүзүмө карады. Ишенбей калгансып, дагы ширеңке чагып, дагы карады..."},{"t":"p","h":"– Сага эмне болгон, дос? Бу кылганың эмне? – деди ал караңгыда кейиштүү үн менен."},{"t":"p","h":"– Машине... катуу сыныптырбы? – деп араң сурадым кан түкүрүп."},{"t":"p","h":"– Анча эмес. Аскага тийип, жолго туураланып калыптыр."},{"t":"p","h":"– Анда, коё бергиле, азыр жөнөйм! – Калтыраган колум менен ачкыч издеп, стартерди бастым."},{"t":"p","h":"– Токтот! – деп алиги киши мени капшыра кучактады. – Жетишет бейбаштыгың! Түш! Түнөп ал, эртең көрө жатабыз..."},{"t":"p","h":"Мени кабинадан сүйрөп чыгышты. (Ч. А.)"},{"t":"h3","h":"&amp; 4. РАСМИЙ ИШ КАГАЗДАРЫ"}],"sub":[{"title":"КУМДАГЫ ИЗДЕР","b":20},{"title":"&amp; 4. РАСМИЙ ИШ КАГАЗДАРЫ","b":59}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[10,17]},{"title":"$ 4. Расмий иш","blocks":[{"t":"p","h":"Расмий иш кагаздары мамлекеттик деңгээлде иш жүргүзүлүүчү, сөзсүз, аткарылуучу документтер болуп эсептелет. Буларга мамлекеттер ортосундагы иш кагаздардан тартып, мыйзам, указ, устав жана программалар кирет."},{"t":"h3","h":"ПРОГРАММА"},{"t":"img","src":"data:image/webp;base64,UklGRiRBAABXRUJQVlA4IBhBAAAQ9gCdASpNAS4BPrFKnkmnJKMkLvSuCOAWCWUA0uEUK+zdcezjUfRvY+pz/VeldnZn7gcDr64X85lpvwT/IeFP4v84/jv7X/k/+n/d/a7/zfJL6b/Of+L/G+on8s+/37X+++f//L/0njP8Ov9L/K+wL+V/1P/i/3r1k/w+0z3T/begR7u/hfIS+R86P0T/Ffsj8Av82/unqJ/3fFk9n9gr9i+ql/n+br9B/4H7Z/BD+xSOB601OUVVKeWQcAZqrgWXtmnTFU6VNhA6uZ4O5MAuP3V1UqLs4OxFRUYT+HhJkO4X1L/USaQqE4CttNc41+lVMq+l/vrb0TJsuxPo0+g/jRz2D45W8+PP+tx3zcYHZdbx0XwgRE/hJT9FEmHsIV9Df+MXtF0hjOjvnLrzX6dEzOCc+VMc4yuQJXdoPKsJ8GLUZ5D4Z0CY1Fr4UQlvz9+ybgRzrKwd1O8KKVuVJjw1IZWwMNah/9l09vmhevsAoESCDBZtjeESi1VHQG/JcDc/18YSQWzF2YQAG12Kuq4TjvbZb3Kd6U+OPD4KY+D0/yGFB/q6HxshGPdOH8y+0iKvgAXDWUNmshEJ/XS/d0T1JTgP3V8OcAF+X9lolVQxJx1LHaP/oRmgcQLoJ7AHH5FwNFPATca8YweLbk4FYGbXhiBqJX8UBX2Ux0LkTRtg6cQhQPl3QI+gasJsDF7a3B0vFUd6A5eGBpJxz/DHVMRy3dmko1uBgWkq4gixpk/NuBLMqzN0eF5+VR7/vc47

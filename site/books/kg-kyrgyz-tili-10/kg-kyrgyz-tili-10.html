ыбышына өтүп кетти."},{"t":"p","h":"<span class=\"pg\" data-n=\"61\">61<\/span>Жумшак үнсүз тыбыштардын таасиринде алга карай окшошуулар (өзгөрүүлөр)."},{"t":"p","h":"Жумшак үнсүздөр менен аяктаган сөздөргө мүчө жалганганда, анын таасири менен мүчөнүн башкы үнсүзү өзгөрүп айтылса, андай кубулуштарды жумшак үнсүздөрдүн алга карай окшошуп (өзгөрүп) айтылышы дейбиз."},{"t":"p","h":"Мисалы: жай + нын жайдын, тил + нын тилдин, кооз + лык кооздук, заман + лаш заман даш, чоң + лар чоңдор, тон + луу тондуу, эл + лык элдик."},{"t":"p","h":"Жумшак үнсүздөрдүн алга карай өзгөрүүсү негизинен сөзгө жалганган мүчөлөрдүн башкы л, н, тыбыштары д тыбышына өтүп айтылышынан көрүнүп турат. Аны төмөнкүдөй схема аркылуу байкасак да болот."},{"t":"p","h":"Л"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>(<\/td><td>же<\/td><td>д<\/td><\/tr><tr><td>н<\/td><\/tr><tr><td>Мисалы:<\/td><\/tr><tr><td>туз + лаш туздаш<\/td><\/tr><tr><td>коом + нын коомдун<\/td><\/tr><tr><td>там + лар тамдар<\/td><td>(л—ъд)<\/td><\/tr><tr><td>биз + ныкы биздики<\/td><td>(н – д)<\/td><\/tr><tr><td>кал + лык калдык<\/td><td>(л<\/td><td>д)<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"Бир сез ичинде жумшак унсуздер алга карай кандай езгеруп айтылса, жазууда да так ошондой жазылат."},{"t":"p","h":"44. Төмөнкү фантастикалык аңгемени окуп, андагы кара тамга менен басылган сөздөрдү дептериңерге көчүрүп жазгыла да, аларды уңгу, мүчөгө ажыратуу менен үнсүздөрдүн алга карай окшошуп айтылыштарын тапкыла. Андай кубулуштарды далилдүү кылып, түшүндүрүп бергиле."},{"t":"raw","h":"<div class=\"gloss\"><p><\/p><\/div>"},{"t":"h3","h":"<span class=\"pg\" data-n=\"62\">62<\/span>МАМОНТ КАНТИП ТИРИЛДИ?"},{"t":"p","h":"Менин Сибирь жакта эң бир кысталыш жумушум чыгып, барып калдым. Сибирге барганда жеке эле ал жумушумдун артынан түшпөй, башка дагы илим-изилдөө жагына кирише баштадым."},{"t":"p","h":"„..Ошондой болгондуктан мамонттун муз доорунан калган калдыгын табууга кириштим. Мен кандайча мамонттун калдыгын табууга киришкендигимди сиздерге айтып бербесем, мамонтту издегендигим туура да болуп чыкпас. Июль айынын бири дегенде бир тунгусту итке чана коштуруп, жолдош кылып ээрчитип жөнөдүм. Ал чукугандай сөз тапкыч, шайыр экен. Баруучу жерибиз – Түндүк деңизи."},{"t":"p","h":"‚...Ошентип Түндүк деңиздин чет жагында чанабызды токтотуп, жүгүбүздү түшүрдүк да, өзүбүз мамонт калдыгын издөөгө кириштик. Бир маалда тоодой болуп сүзүп жүргөн муздун арасынан эле жолдошум: «Таптым, таптым!» – деп кыйкырып калды. Экөөбүз тең кубанып, айлананы шаттык каптады. Тоодой муздун төбөсүнө чыгып барып, муздун арасын карасам, алдыңкы артылып чыккан тишинин бирөө муздан чыгып калган экен. Музду казып, тоңуп калган мамонтту ажыратып алдык..."},{"t":"p","h":"Мамонтту жолдошумдун үйүнө алып келип, тышка отту чоң жактырып коюп, анын муздуу денесин эритүү үчүн, ар жак-бер жагын отко кактай бердим. Бир маалда дем алгансып, бир дабыш мамонттон пайда боло баштады. Бир аздан кийин ички мүчөлөрүнүн музу эригенде, чыны менен эле дем алып, башын ары-бери көтөрүп, көзүн ачып-жума берди. Бир аздан кийин мамонт башын чулгуп тура баштады."},{"t":"p","h":"Мындан эчен кылым мурда тоңсо да, ички жана тышкы организмдери бузулбаган экен. Ал менин тирилткеними билбестен чочуркап, «кайдан келдиң?» дегенсип, олурайып карап койду. Кийинчерээк акырындап үйүр боло баштады. Мен ал мамонтко курсагын тойгузуу үчүн, түрдүү тамактарды да алып келе бердим."},{"t":"p","h":"Бир канча убакыттан кийин артынан тезегин чыгара баштады. Мага анын тезегин текшерүүгө туура келди, себеби ошол мамонт музга катканда кандай чөптү жегенин билүү кызыктуу эле. Мамонттун тезегин текшерип отурсам, <span class=\"pg\" data-n=\"63\">63<\/span>папоротник жана ийне жалбырактуу өсүмдүктөрдүн бир тобу учурады."},{"t":"p","h":"Мен ал мамонтту алып, үй жакка жол тартууга туура келди. Бир күнү жолдошум менен коштошуп, жан баштыгымды азыктарга ныктап толтуруп, мамонтту минип алып, үйдү көздөй жөнөдүм. (К. Э.)"},{"t":"p","h":"45. Текстти окуп, кара тамга менен басылган сездерде үнсүздөрдүн алга карай ээрчишип өзгөрүүсүнүн кандай түрлөрү бар экендигин айтып бергиле."},{"t":"p","h":"‚.Мына ушинтип биз айылга кетип бара жаттык. Чиркин, ошол күнкү түн бөтөнчө жаралгансып, эң эле керктуу болду."},{"t":"p","h":"Ким билбейт, жайдын толгон кезиндеги ангуст түндөрүн! Асмандагы жылдыздар алыста турганы менен, ар бири өңүнө чыгып, алаканга салгандай ар бири өзүнчө нур төгүп, чет-четинен бүлбүлдөгөн күмүш кыроо чалып, асмандын тиги каптал, бул капталына жайнап, кири жок жадырап карашат."},{"t":"p","h":"Жылдыздар ушинтип толгондо, биз капчыгай аралап келе жатканбыз. Аттар салкынданып, үйдү көздөй көңүлдүү жортууда. Араба кычыр-кучур дүңгүрөп, ташка тийген такалардан учкун чагылат... Тээ артта калган поезддер көпүрөдөн нары өтүп, бери өткөн сайын жаңырык ээрчитип, гудокторду алыска-алыска созолонтот."},{"t":"p","h":"Ушундай түндө жол жүргөн кандай жакшы! Караңгыда термелген аттардын жондорун карап отурсаң, ушул түнкү дабыштарга кулак салып, ушул түнкү жыттарга мас болгон кандай жыргал!"},{"t":"p","h":"Жамийла ошондо... тизгиндерди бош коё берип, эки жагына көз сала, акырын гана кыңылдап ырдамыш болот. Биздин унчукпай, сүйлөбөй келе жатканыбыз анын көңүлүн басынтып жатты. Мен аны билип эле турдум. Чын эле ушундай түндө унчукпай коюш болобу? Адам деген тилдүү, жандуу болсо, анан табигаттын ушул көрүнүшүнө жооп бербейби?"},{"t":"p","h":"Айткандай эле, Жамийла тынч отура алган жок, кори үнүн көтөрүп, өрөөндү жаңыртып ырдап кирди."}],"sub":[{"title":"АЛАРДЫН ЖАЗЫЛЫШЫ","b":2},{"title":"&amp; 15. БИР СӨЗ ИЧИНДЕ ҮНСҮЗДӨРДҮН АЛГА КАРАЙ ОКШОШУП ӨЗГӨРҮҮСҮ","b":11},{"title":"МАМОНТ КАНТИП ТИРИЛДИ?","b":41}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[58,63]},{"title":"§ 16. БИР СӨЗ ИЧИНДЕ ҮНСҮЗДӨРДҮН (Н, 3, Ч) АРТКА КАРАЙ ӨЗГӨРҮЛҮП АЙТЫЛЫШЫ ЖАНА ЖАЗЫЛЫШЫ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"64\">64<\/span>§ 16. БИР СӨЗ ИЧИНДЕ ҮНСҮЗДӨРДҮН (Н, 3, Ч) АРТКА КАРАЙ ӨЗГӨРҮЛҮП АЙТЫЛЫШЫ ЖАНА ЖАЗЫЛЫШЫ"},{"t":"p","h":"Бир сөз ичинде же удаа айтылган эки сөздүн ортосундагы үнсүздөрдүн алгачкысы өзүнөн кийинки үнсүз тыбыштын таасири менен өзгөрүүгө учурап айтылышын үнсүздөрдүн артка карай өзгөрүп айтылышы дейбиз."},{"t":"p","h":"Үнсүздөрдүн мындайча өзгөрүп айтылышы оозеки кебибизде колдонулат, бирок жазууда өзүнүн алгачкы формасын сактайт. Башкача айтканда, үнсүздөрдүн артка карай өзгөрүп айтылышын берүүдө орфоэпиялык жана орфографиялык принциптер колдонулат."},{"t":"p","h":"Үнсүздөрдүн артка карай өзгөрүп айтылышы н, з, ч тыбыштарынын өзүнөн кийинки үнсүздөрдүн таасири астында өзгөрүүсүнөн улам пайда болот. Алар төмөнкүчө жолдор менен ишке ашат."},{"t":"p","h":"1. Н тыбышынын артка карай өзгөрүп айтылышы"},{"t":"p","h":"Н тыбышынын артка карай өзгөрүп айтылышы эки түргө ээ:"},{"t":"p","h":"а) Сөздүн аягы н тыбышы менен аяктап, ага жалганган мүчөлөр к, г тыбыштары менен башталса, н тыбышы өзгөрүп, ң болуп айтылат."},{"t":"p","h":"айтылышы:"},{"t":"v","l":["күңгө","сыңган","салынган","жаңга","качаңга","жазылышы:","күнгө","сынган","салынган","жанга","качанга"]},{"t":"p","h":"б) Н тыбышы менен аяктаган сөзгө б, м тыбышы менен башталган мүчөлөр жалганганда н тыбышы өзгөрүп, м болуп айтылат."},{"t":"raw","h":"<div class=\"gloss\"><p>кыйа ый йй л ы а. а. а. а ы ыы а ы а аа аа Т а н ы „ч...<\/p><\/div>"},{"t":"v","l":["<span class=\"pg\" data-n=\"65\">65<\/span>айтылышы:","көмбөй","кыйыктамбай","жамамбы","экембиз","тымбай.","жакыммын","ишеммек","тумма","жазылышы:","көнбөй","кыйыктанбай","жаманбы","экенбиз","тынбай","жакынмын","ишенмек","тунма"]},{"t":"p","h":"46. Төмөнкү сүйлөмдөрдөн сөздүн аягы н тыбышы менен аяктап, ага л, г, 6, м тыбыштары менен башталган мүчөлөрдүн улануусунун натыйжасында үнсүз тыбыштардын артка карай өзгөрүп айтылышын таап, аларга түшүндүрмө бергиле,"},{"t":"p","h":"1. Ал согуш чыгардан мурунку жылы айылдык мектепте мугалим болуп иштеп, анан согуш чыгары менен аскерге алыныптыр. 2. Орбиталык станцияда уч айдан ашуун бирге болуп, ушу күнгө чейин жүктөлгөн функцияларын так аткарып келаткан эки киши кандайча капилеттен дайынсыз жоголуп кетишин, канаттуу кыял, учкул санаа элестете албай койду. 3. Анын баарын биз кийинки кабарыбызда же «Паритетке» кайтып барганыбызда айтып беребиз. 4. Согуш деген согуш, адам өмүрү бир атымга эле жарайт: же бир чабуулга аттанганга, же танк алдына граната байланып жатып бергенге. 5. Найман казактардын ата-баба арбагы жаткан уруу көрүстөн Эне-Бейитке чейинки жол бир далай. 6. Кунге тотуккан Эдигей колун улам мандайына алып, бараткан багытын серепчилеп карап коёт да, чарчанкы абалы менен өзүнөн кийинкилерди карап коюп үнсүз баратты. Т. Баскан сайын батинкеси шпалдан шпалга шалактап, өзү менен өзү болуп баратты. 8. Жан чыдатпаган ысык кайта түштү да, саамдан кийин салкын тартып, дегинкиси түнкү уйку тынчыраак болуп калды. 9. Караңгы түн жарыла берип жол ачып, Зарипа туманга кирип көрүнбөй кетет."},{"t":"p","h":"10. Тентектер уктар замат, Зарипа китебин окуганга киришет. 11. Бирок бул үйдө башка турмуш – таза, жарык, жанга жагымдуу. 12. Зарипа менен Эдигей купеленген вагонго түшүптүр. 13. Деңиз кылаалап ырдаганга <span class=\"pg\" data-n=\"66\">66<\/span>не жетсин. 14. Эми алиги телеграммаларын салып жатып Зарипанын суранганы, көптөн көп өтүнгөнү эле мурунку каттарды туугандары алышты бекен, жок бекен... деген бир суроо болчу. 15. Сары-Өзөккө байланган, жөн байланбай кан-жаны менен, дини-дили менен байланган Эдигейдин кыялы жанагы ээ?.. (Ч. А.)"},{"t":"p","h":"2 3 тыбышынын артка карай өзгөрүп айтылышы"},{"t":"p","h":"Сөздүн аягы з тыбышы менен аяктап, ага жалганган мүчөлөр с, ч тыбыштары менен башталса, жумшак з тыбышы каткалаң © тыбышына өтүп, өзгөрүп айты- лат."},{"t":"v","l":["айтылышы: жазылышы:","тозсо","тоссо","казса","касса","эзсе","эссе","кыргызча","кыргысча","комузчу","комусчу"]},{"t":"p","h":"3. Ч тыбышынын артка карай өзгөрүп айтылышы"},{"t":"p","h":"Ч тыбышы менен аяктаган сезге с, ч, т тыбыштары менен башталган мүчөлөр жалганса, ч тыбышы ш болуп өзгөрүп айтылат."},{"t":"p","h":"айтылышы:"},{"t":"v","l":["жыгашсыз","кашса","эшсун","ешту","ашты","үштөн","күштүү","ушта","жазылышы:","жыгачсыз","качса","өчсүн","өчтү","ачты","үчтөн","күчтүү","учта"]},{"t":"p","h":"<span class=\"pg\" data-n=\"67\">67<\/span>4. Н, з, ч тыбыштарынын эки сөздүн аралыгында артка карай өзгөрүп айтылышы Н, з, ч, тыбыштарынын артка карай өзгөрүп ай- тылышы бир эле сөздүн ичинде эмес, эки сөздүн аралы- гында да кезигет."},{"t":"p","h":"М исалы: кумбою (кун бою), сенкал (сен кал), ункошуу (үн кошуу), кессал (көз сал), ассуйле (аз суйле), туссура (туз сура), жессымал (жез сымал), чырыштер (чырыч тер), ууштолбойт (ууч толбойт), жыгашчелек (жыгач челек), ушсом (уч сом), кештурба) (кеч турба) д. у. с."},{"t":"p","h":"47. Жогоруда берилген сөздөрдүн айтылышына жана жазылышына бештен сүйлөм түзүп, тыбыштардын өзгөрүп айтылуу себебин түшүндүргүлө."},{"t":"p","h":"48. Төмөнкү суйлемдерду окуп, андагы үнсүздөрдүн артка карай өзгөрүлүп айтылгандарын таап, аларды айтылышы жана жазылышы боюнча эки тилкеге жазып көрсөткүлө."},{"t":"v","l":["Үлгү:","айтылышы:","көсчачырап","иштен","жазылышы:","","көз чачырап","ичтен"]},{"t":"p","h":"1. Колдо өскөн жаныбар эртедир-кечтир үйүрүн издеп келүүсү керек эле... 2. Ичтен күдүктөнүп кыйналбай, үмүт-тилектин баарынан айрылып бүткөн соң, калган жашоо тузсуз болуп, эчтемеге буйдалбай өлүмгө даяр туруп бермек. 3. Куржунду эки өркөчтүн ортосуна арта салып, Найман эне Желмаянга минди. 4. Ошол ичтен күйүп жок болуу процессине каршы күрөшкө эң мыкты күчтөр, илимий жана материалдык каражаттар аябагандай жумшалган. (Ч. А.) 5. Алайда кыш узак болот, кош кеч чыгат. (К. Ж.) 6. Күндөгүдөй үйлөрүнө кеч чубап, талаалардан кайткан кез, кечки убак. (А. О.) Т. Деги тынччылыкпы, демиңди басып, айтарыңды айтчы? 8. Эсиңерде болсун, кимде ким менден уруксатсыз мунун колун чеччү болсо, эч кандай аёо болбойт. 9. Сизсиз биз кайда бармак элек. (Т. К.) 10. Ооба, апа, сөзсүз мени туура дээрсиң."},{"t":"p","h":"<span class=\"pg\" data-n=\"68\">68<\/span>(Ч. А.) 11. «Мага да мүмкүн бекен?» – деп, бети күнгө тотуккан, улгайыңкы аял чогулушту башкаруучудан сөз сурады. (А. С.) 12. Кенди казса, сөздү айтса чыгат, балам, аңгемең кызык экен, уланта бер. 13. Ошол күндөн ушул күнгө чейин жалгызсызбы? (А. Т.) 14. Ой, комузчу, комузчу, чертсең чертчи комузду. (Т'; Ү.)"},{"t":"p","h":"49. Төмөнкү текстти жазып, андагы каталарды оңдогула. Окуу китебиндеги кетирилген каталардын себебин табууга аракеттенгиле, оюнардын тууралыгын мугалимиңер менен тактагыла."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[64,68]},{"title":"ИСА КОНОЕВИЧ АХУНБАЕВ","blocks":[{"t":"h3","h":"ИСА КОНОЕВИЧ АХУНБАЕВ"},{"t":"p","h":"Иса Ахунбаев Ысык-Көл районундагы Торайгыр айылында 1908-жылы төрөлгөн. Ал адам 1948-жылы медицина илиминин доктору, профессор, 1949-жылы СССР Медицина илимдер академиясынын муче-корреспонденти, 1954-жылы уюшулган Кыргыз илимдер академиясынын туңгуч президенти болгон."},{"t":"p","h":"Ахунбаев 1935-жылы Ташкенттеги Орто Азия Медицина институтун бүтүргөндөн кийин Кыргыз ССР саламаттык сактоо комиссарынын орун басары болуп иштеген. Кийин 1948 – 52-жылдары Кыргыз мамлекеттик медицина институтунун ректору, 1947-жылдын өмүрүнүн аягына чейин ошол институттун жалпы хирургия кафедрасынын башчысы болгон. Балдардын сокур ичегиси, богок, эхинококкоз, шок, жүрөк оорулары боюнча илимий эмгектерди жараткан. Анын демилгеси менен борбор шаардагы республикалык ооруканада көкүрөк хирургиясы кафедрасы уюшулган."},{"t":"p","h":"Ахунбаев жөнүндөгү эң маанилүү факты – бул, ал бизде жүрөккө эң биринчи операция жасаган адам. Ал 1978-жылы дүйнөдөн кайткан."},{"t":"p","h":"Кайталоо үчүн суроолор:"},{"t":"p","h":"1. Үнсүздөрдүн сез ичинде артка карай өзгөрүп айтылышы, дегизинен, кандай тыбыштарга тиешелүү экен?"},{"t":"p","h":"2. Үнсүздөрдүн артка карай өзгөрүп айтыльиты менен жазылышынын ортосунда кандай айырма бар?"},{"t":"h3","h":"<span class=\"pg\" data-n=\"69\">69<\/span>&amp; 17. К,П ТЫБЫШТАРЫНЫН БИР сөз ИЧИНДЕ ҮНДҮҮЛӨРДҮН ТААСИРИ МЕНЕН Г, БТЫБЫШТАРЫНА ӨТҮШҮ"},{"t":"p","h":"Каткалаң к, п үнсүз тыбыштарынын жумшарып г, б болуп айтылышы төмөнкүдөй учурларда болот."},{"t":"p","h":"1. Сөздүн уңгусу (негизи) к, п үнсүз тыбыштары менен аяктап, ага үндүү тыбыштар менен башталган мүчөлөр жалганса к, п тыбыштары жумшарып т, б болуп өзгөрүп айтылат. Жазууда булардын ошол өзгөргөн түрү сакталат:"},{"t":"v","l":["шак + гы шагы","ээк + ым ээгим","ак + ар агар","тик + уу тигүү","кабак + ым кабагым","жаээк + ы жээги","чап + ын чөбүн","сап + ы сайы","сеп + уу себүү","топ + ы тобу","азап + ы азабы","жап + уу жабуу","кокиурек + ың кокурегун тек тыл тагул"]},{"t":"p","h":"сап + ы сабы тарак + ым тарагым"},{"t":"p","h":"Эскертүү: к, п тыбыштары менен аяктаган уңгу сөздөргө үндүү менен башталган -ылда (кээде -ылда + п) мүчөсү жалганса, тууранды же этиштик маани берүүчү сөздөрдө к, п тыбыштары өзгөрүүгө учурабайт."},{"t":"p","h":"М ы: бакылда, купулде, шыпылда, акылдап, шыкылдап, бакылдап ж. б. к, п тыбышынын жумшарбай калышы айрым бир сөздөрдө да учурайт."},{"t":"p","h":"М исал ы: бек + и беки, кек + ен кекен 50. Төмөнкү сөздөргө ылайыгына жараша мүчөлөрдү улап, каткалаң к, п тыбыштарынын г, б тыбыштарына өтүп жумшарышын көрсөтүүчү сөздөрдү катыштырып бир нече сүйлөм түагүлө. Алардын кандай себептен жумшарып, өзгөрүп кеткендигин түшүндүргүлө."},{"t":"p","h":"Ак, бак, чөп, кабык, күрөк, ысык, шок, арык, көк, китеп, мектеп, топ, сап, кеп, жарык, жук, жап."},{"t":"p","h":"Үлгү:"},{"t":"p","h":"Сулуу кыздын агынан эмес, кара кыздын багынан. Акыл аашот, билим жугушат."},{"t":"raw","h":"<div class=\"gloss\"><p>чч.<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"70\">70<\/span>51. Ырды окуп к, п тыбыштарынын г, б тыбыштарына кандайча өткөндүгүн мүнөздөп бергиле."}],"sub":[{"title":"&amp; 17. К,П ТЫБЫШТАРЫНЫН БИР сөз ИЧИНДЕ ҮНДҮҮЛӨРДҮН ТААСИРИ МЕНЕН Г, БТЫБЫШТАРЫНА ӨТҮШҮ","b":7}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[69,70]},{"title":"АР НЕРСЕНИН ЧЕГИ БАР","blocks":[{"t":"h3","h":"АР НЕРСЕНИН ЧЕГИ БАР"},{"t":"v","l":["Тилдей берсең жадатып,","Тили чыгат дудуктун.","Түгөнөт суусу көп алсаң...","Түбү кургап кудуктун."]},{"t":"p","h":"52. Үнсүз тыбыштардын өзгөрүшү, артка жана алга карай окшошуусуна өзүңөр бир канча мисалдарды келтиргиле. Оюңардын туура экендигин мугалимиңер менен текшергиле."},{"t":"h3","h":"&amp; 18. ЭКИ СӨЗ АРАЛЫГЫНДАГЫ ҮНСҮЗ ТЫБЫШТАРДЫН АЛГА ЖЕ АРТКА ОКШОШУП ӨЗГӨРҮҮСҮ ЖАНА АЛАРДЫН ЖАЗЫЛЫШЫ"},{"t":"p","h":"Удаа айтылган эки сөздүн биринчисинин аягындагы же экинчи сөздүн башындагы үнсүз тыбыштар өзүнүн катарындагы тыбыштардын таасири менен өзгөрүп айтылса, аны эки сөз аралыгындагы үнсүз тыбыштардын өзгөрүүсү деп атайбыз. Бирок алар жазууда өзгөргөн түрүндө эмес, өз алдынча кандай айтылса, ошол калыбында жазылат, Мисалы: айтылышы:"},{"t":"h3","h":"агала"},{"t":"v","l":["боёгалдык","агуй","серегой","жогеле","кебук","кеккул","алыппар","жазгелди","","то","жазылышы:","","ак ала","боёк алдык","ак уй","бере кой","жок эле","кеп ук","кок гул","алып бар","жаз келди"]},{"t":"raw","h":"<div class=\"gloss\"><p>че че тет ((| <\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"71\">71<\/span>53. Төмөнкү текстти окуп, анда эки сөз аралыгында үнсүз тыбыштардын өзгөрүүсү кайсы сөздөрдүн аралыгында болорун жазып көрсөткүлө."},{"t":"p","h":"Элдик ырларды угуп отуруп, канчалык сеп алсам, кайрадан каалгып ойго батам... Бир топ ойлор биринин артынан бири келип, көкүрөгүмдү уйгу-туйгу кылат. Анан менин көз алдыма ак сакалын жайкалткан аталар, ак элечегин кийген апалар чубап өтөт. Алар менин көзүмө элдик акындарыбыз көкөлөтүп ырга кошкон нарктуу, салабаттуу кадырман кишилерибиздин элесин тартат. Керсе, биз ошо жен эле эмес, Ала-Тоодой бийик. таза, токтоо кишилердин жакшы тилек айткан үндөрүн угуп, бешикте жаткан экенбиз. Алар бизди терметип отурса да, жен эле жаныбызда болсо да жакшы тилегин айтышып, асмандагы куштун сызып учуп жүргөнүндөй, көлдүн сыдырым желден жыбырап термелгениндей каада күтүшүп, бешик ырын ырдашып, биздин келечегибиз жөнүндө түйшөлүп отурушчу тура. Анан алардын күткөн каадасын бузбай өркүндөтүү, карыялардын нуска сөздөрүн балдарга сиңирүү наристе түйшүгүн аркалаган апаларга жүктөлөт акен. Алардын бул вазипаны аткаруудагы эң башкы да, күндөлүк да, түбөлүк да иши бешик айланасында өтөт тура. Бул бешик ырынан башталып, бешик ыры менен уланат. Бешик ырын ары мукамдуу, ары угумдуу, ары маанилүү чыгарып, ошол ыр аркылуу коштолуп, ар бир кыргыз перзентинин кулагынан кетпеген музага айланат. Анда музыка да, анда нуска да, анда тилек да, ишенич да жуурулушкан."},{"t":"p","h":"Ушул үн мурда ар бир наристелүү үйдөн сызылып турчу. Ушундай күчтүү кереметке ээ болгон, сырдуу обон ар бир үйдө созолончу. Ал добуш – бейпил турмушка, эмгекке, эл-жерди сүйүүгө ар бир наристени үндөп ырдалчу. Ал ыр – кыргыз элинин бешик ыры эле."},{"t":"p","h":"Бүгүн бешик ырынын сейрек угулуп жатканы'жүрөк өйүйт. Созолонгон угумдуу мукам үндөрдүн ордуна ызы-чууга, бакырыкка толгон чет элдик музыкалардын кулак жеп, үзгүлтүксүз чыгышы жаштарды ата-энесин, эли-жерин сүйүүгө, акылдуулук менен сабырдуулукка үйрөтө алар бекен... Деги алар болсо деле, бешик ыры калбаса экен. («КМ»)"},{"t":"p","h":"<span class=\"pg\" data-n=\"72\">72<\/span>Эки сез аралыгындагы унсуз тыбыштардын езгеруп айтылышы, ага таасир берген тыбыштын алга же артка карай өзгөрүп, окшошуп кетүүсүнө байланыштуу алар өз ара экиге бөлүнөт."},{"t":"p","h":"1. Эки сөз аралыгындагы тыбыштардын алга карай ээрчишип (окшошуп) өзгөрүүсү."},{"t":"p","h":"2. Эки сөз аралыгындагы үнсүз тыбыштардын артка карай ээрчишип (окшошуп) өзгөрүүсү."}],"sub":[{"title":"&amp; 18. ЭКИ СӨЗ АРАЛЫГЫНДАГЫ ҮНСҮЗ ТЫБЫШТАРДЫН АЛГА ЖЕ АРТКА ОКШОШУП ӨЗГӨРҮҮСҮ ЖАНА АЛАРДЫН ЖАЗЫЛЫШЫ","b":3}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[71,72]},{"title":"§ 19. ЭКИ СӨЗ АРАЛЫГЫНДАГЫ ҮНСҮЗ ТЫБЫШТАРДЫН АЛГА КАРАЙ ЭЭРЧИШИП (ОКШОШУП) ӨЗГӨРҮҮСҮ","blocks":[{"t":"h3","h":"§ 19. ЭКИ СӨЗ АРАЛЫГЫНДАГЫ ҮНСҮЗ ТЫБЫШТАРДЫН АЛГА КАРАЙ ЭЭРЧИШИП (ОКШОШУП) ӨЗГӨРҮҮСҮ"},{"t":"p","h":"А. Эгерде удаа келген эки сөздүн биринчиси үндүү тыбыш менен аяктап, экинчиси каткалаң к тыбышы менен башталса, кийинки сөздүн башкы тыбышы жумшарып г тыбышына өтүп айтылат, бирок жазууда ар бири өз алдынча турганда кандай болсо, ошол калыбында жазылат. Мисалы:"},{"t":"p","h":"айтылышы:"},{"t":"v","l":["алагарга","серегой","малагек","алагач","беригел","суугуй","ботогөз","жазылышы:","","ала карга","бере кой","мала кок","ала кач","бери кел","суу куй","бото көз","веде карма"]},{"t":"p","h":"Б. Удаа келген эки сездун биринчиси жумшак (а, р, л, м, н) үнсүз менен аяктап, кийинкиси к, п тыбыштары менен башталса, айтылганда өзүнөн мурда же кийин турган үнсүз тыбыштын таасири менен жумшарып же каткалаңдашып өзгөрүп айтылат. Бирок жазууда өз алдынча кандай турган болсо, эч өзгөрүүсүз ошол калыбында жазылат. Мисалы:"},{"t":"p","h":"Та"},{"t":"v","l":["<span class=\"pg\" data-n=\"73\">73<\/span>айтылышы:","жазгелди","каргетти","колгой","тангалды","тааппер","жолгайда","алыппер","тереңгел","жазылышы:","жаз келди","кар кетти","кол кой","тан калды","таап бер","жол кайда","алып бер","терең көл"]},{"t":"p","h":"54. Төмөнкү текстти окуп чыгып, анда үнсүздөрдүн эки сөз аралыгындагы алга карай ээрчишип (окшошуп) өзгөрүүсү учураган сөздөрдү көрсөтүп, анын айтылышы жана жазылышын чечмелеп айтып бергиле."},{"t":"h3","h":"АЛП МАНАСЧЫЛАРДЫН АКЫРКЫСЫ"},{"t":"p","h":"«О чиркин дүйнөнүн айкөлдүгүн карачы, айтууга аны тил кайда, ырдоого аны үн кайда...› —деп Ала-Тоонун арасында агып жаткан улуу дайра – манасчы Саякбай Карала уулунун керемет талантын күүгө салып кеткен акын Курбанбай Калдыбаевдин ушул саптары эсиме түшүп отурду. Дүйнөдөн эрте көчкөн таланттуу акындын Сакеме арналган поэтикалык саптарында биздин кылымдын улуу адамынын көркөм дүйнөсү кыйла таамай чагылдырылган."},{"t":"p","h":"Улуу «Манас» эпосунун тегерегинде канчадан бери кеп болуп келатат."},{"t":"p","h":"Демек, «Манас» аз-аздан суюлуп бараткан азганактай калктын муңун муңдап, эртеңкисине жол көрсөткүч кеменгери катары элдик пассионардык улуу күчүн ойготкон, алдыга баштап чыккан."},{"t":"p","h":"Саякбай Карала уулунун «Манасы» өзүнүн көркөмдүк бүтүндүгү, таасир этуу күчү, окуяларынын жыйынтыктуулугу, образдардын кеңири чечмелениши жагынан гана айырмаланбастан, бийик доошко ээ болгон трагедиялуулугу менен да айырмаланат."},{"t":"p","h":"Айтса, Сакеңдин «Манасын» шатырата төгүп жаткан жамгырга карабай угуп отургандардын кино экранда тартылып калган жүздөрүнө абай салып караңызчы. Бул дүйнөнүн көйгөйүн таптакыр унутуп, Сакеңдин артынан"},{"t":"p","h":"ТЗ <span class=\"pg\" data-n=\"74\">74<\/span>улуу эпостун керемет дүйнөсүнө жутулуп кеткен карапайым адамдарды көрүп туруп, кылымдардан кылымдарды карытып келген улуу сөздүн бир жерин кемитпей, океандай толкуп-ташып, уйерленген толкун менен баатырдыктын драмасы жана трагедиясына, ташка тамга баскандай образдуу поэзиясына угуп отургандарды толук багындырып, төгүлүп-чачылып отурган манасчынын ички абалын жогоруда эскерген ырында К. Калдыбаев абдан таамай туюндурган..."},{"t":"p","h":"Анын сыйкырдуу саптарына катылган элдин эткену менен бүгүнкүсү ушу азыр да сез кереметинин касиетин жоготпой, укканды таңгалдырып, окуганды ойго салбай койбойт. Элдин мына ушул көркөм таберигинде анын кайгы-кубанычы, салт-санаасы, улуттук үрп-адаты анан да, эң башкысы, улуу трагедиясы камтылган. Кыргыз кыргыз болгону маңдай жарган кубанычы, маанайын түшүргөн кайгысы, ич ара ынтымакка келе албаган улуттук чектелүүчүлүгү эпосто таамай, ишенимдүү берилген."},{"t":"p","h":"Саякбай Карала уулунун эли үчүн жасап кеткен опол-тоодой эмгеги урпактары тарабынан кастарланып, унутта калбашы керек. (Бект. Ш.)"}],"sub":[{"title":"АЛП МАНАСЧЫЛАРДЫН АКЫРКЫСЫ","b":8}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[73,74]},{"title":"§ 20. ЭКИ СӨЗ АРАЛЫГЫНДАГЫ ҮНСҮЗ ТЫБЫШТАРДЫН АРТКА КАРАЙ ЭЭРЧИШИП (ОКШОШУП) ӨЗГӨРҮҮСҮ (ЭЭРЧИШГУУСУ)","blocks":[{"t":"h3","h":"§ 20. ЭКИ СӨЗ АРАЛЫГЫНДАГЫ ҮНСҮЗ ТЫБЫШТАРДЫН АРТКА КАРАЙ ЭЭРЧИШИП (ОКШОШУП) ӨЗГӨРҮҮСҮ (ЭЭРЧИШГУУСУ)"},{"t":"p","h":"А. Жанаша турган эки сөздүн биринчиси к, п унсүзү менен аяктап, кийинкиси үндүү тыбыштар менен башталса, эки сөздүн аралыгындагы үнсүздөр артка карай ээрчишип (жумшарып) өзгөрүп айтылат. Бирок жазууда алгачкы калыбындагыдай эч өзгөрүүсүз калат."},{"t":"p","h":"Мисалы:"},{"t":"p","h":"айтылышы:"},{"t":"p","h":"агала көбайтты кебукпайт боёгалдым жазылышы:"},{"t":"p","h":"ак ала көөп айтты кеп укпайт боёк алдым"},{"t":"v","l":["<span class=\"pg\" data-n=\"75\">75<\/span>көк экен","И","чаабал","жогеле","тобойноду","чаап ал","жок эле","топ ойноду"]},{"t":"p","h":"55. К, п тыбыштарынын эки сөз аралыгындагы өзүнөн мурда же кийинки келген тыбыштардын таасири менен өзгөрүп айтылышына далил болчу он сүйлөм түзгүлө. Өзгөрүүгө учурап айтылуучу сөздөрдүн жазылышы менен айтылышындагы айырмачылыктарды жана алардын алга же артка өзгөрүүсүн көрсөткүлө."},{"t":"p","h":"Үлгү:"},{"t":"p","h":"1. Ашык аткан азат, топ ойногон тозот, көп окуган озот. (Макал.) 2. Сатыбалды тоого барып отун алды, келе жатса жолунан коён чыкты, тарс эттирип аны да атып алды, ал олжосун койнуна катып алды. (Эл оозунан.) 3. Ала койду бөлө кырккан жүнгө жарыбайт. (Макал.) 4. Газетага жазылган сөз суу кечпей калды. («КР»)"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>айтылышы:<\/td><td>жазылышы:<\/td><td>кандай өзгөрдү?<\/td><\/tr><tr><td>ашыгаткан<\/td><td>ашык аткан<\/td><td>артка карай<\/td><\/tr><tr><td>тобойногон<\/td><td>топ ойногон<\/td><td>артка карай<\/td><\/tr><tr><td>кебокуган<\/td><td>көп окуган<\/td><td>артка карай<\/td><\/tr><tr><td>алагойду<\/td><td>ала койду<\/td><td>алга карай<\/td><\/tr><tr><td>суугечпейт<\/td><td>суу кечпейт<\/td><td>алга карай<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"56. Текстти окуп чыккыла да, андагы к,п тыбыштары г, б тыбыштарына өткен учурларын таап, андай сөздөрдү дептериңерге көчүрүп жазып, аларга талдоо жүргүзгүлө."},{"t":"p","h":"Акыры Мыкы баатыр: «Анжыянга барабыз» деп уч жүз үйлүү элди көчүрүп алып жөнөйт экен."},{"t":"p","h":"Аларга: «Эмгектеген баланы, эңкейип калган карыны таштайлы, жер алыс, кийин алып кетебиз»,— деп жарлык түшүрөт. Эл көчкөндө: «Үч-Каркыра, Көк-Дөбө, эми бизге жок дебе»,- деп ыйлашып, көчүп жөнөйт."},{"t":"p","h":"Алардын ичинен бир жигердүү жигит карыган атасын таштагысы келбей, сандыкка салып, эч кимге көрсөтпөй жүктөп алат."},{"t":"p","h":"<span class=\"pg\" data-n=\"76\">76<\/span>Көч жүрүп отуруп, бир канча күн өткөндөн кийин баягы кары киши баласынан: «Оо, балам, эмне үчүн кэз бир жерде жымжырт болуп каласыңар?» – деп сураптыр. Анда баласы: «Суу табылган жерде чуркурап, суу жок жерде суусаганда жымжырт болуп араң баратабыз» ,— дептир. Атасы баласына мындай деп кеңеш бериптир. «Балам, суу жок жерге барганда жүк жүктөгөн өгүзүңдү агытып коё бергин». Бир күнү суу жок жерге туш болуп, эл өте суусап еле турган болгондо, баягы бала өгүзүн коё берет. Ал өгүз нары-бери басып жүрүп, бир камыштуу жерди чапчып турган экен, баласы атасына муну айтканда, атасы: «Эмесе ошол жерди чукуп каз»,- дептир. Бала казса аерден суу чыгып, эл жыргап суу ичип, чаңкоолорун аябай кандырышыптыр. Андан ары эл көчүп-конуп отуруп, бир күнү дагы бир жерге келгенде талаадан күйгөн эки шам көрүнөт. Мыкы баатыр: «Шамды тапмайынча кечпейбуз»,- деп буйрук кылат. Абышка баласынан: «Эл эмне үчүн көчпөй жатат?» – деп сурайт. Баласы элинин көчпөй турганынын себебин айтат. Абышка: «Балам, ал шам эмес, каухар таш. Ушул сайда дарак бар бекен?»— дейт. Баласы: «Бир гана жалгыз тал бар экен», деп жооп берет. Абышка: «Ал каухар таш ошол жалгыз талдын чиригинин көңдөйүн карасаң ошондон табасың, ал эки шаардын куну менен тең»,— деген экен. (Эл жомогу.)) Б. Жанаша айтылган сездердун биринчиси жумшак з, л, р, м, н, ң тыбыштары менен аяктап, кийинки сөз каткалаң к тыбышынан башталса, көпчүлүк учурда ал жумшарып, г болуп айтылат. Бирок жазылганда өз-өзүнчө туруп, к тамгасы менен жазылат. Мындай көрүнүш үнсүз тыбыштардын алга карай окшошуп өзгөрүүсүнө кирет."},{"t":"v","l":["айтылышы","жазгелди","каргетти","колгой","камгерду","менгелем","таңгалды","Мисалы:"]},{"t":"h3","h":"жазылышы:"},{"t":"v","l":["жаз келди","кар кетти","кол кой","кам көрдү","мен келем","таң калды"]},{"t":"p","h":"<span class=\"pg\" data-n=\"77\">77<\/span>Удаа айтылган эки сөздүн биринчисинин аягындагы үнсүз тыбыштын таасири менен кийинки сөздүн башындагы үнсүз өзгөрүп айтылган учурлар да болот. Мындай кубулуштар да үнсүздөрдүн алга карай өзгөрүп айтылышына кирет. Бирок алардын жазылышында орфографиялык принцип сакталып, ар бири өз алдынча тургандагы абалы менен жазылат."},{"t":"p","h":"57. Төмөнкү ыр саптарын окуп чыгып, андагы кара тамга менен басылган сөздөрдүн ортосунда үнсүздөрдүн алга же артка карай өзгөрүп, же эч кандай өзгөрүүсүз айтылгандыгын айтып"},{"t":"h3","h":"ЖАРЫШ"},{"t":"v","l":["Чу койдум жол каржымды бөктөрүнүп,","Сабымда сууп бүткөн өңчөй күлүк.","Жанымдан шуу деп өтөт, селт дей түшөм,","Канымда кайнап барат жек көрүүлүк.","","Диркиреп сезим канап, канат канап,","Үмүттүн учкундары өчөт, жанат.","Алдыда бара жаткан күлүк тобу","Көзүнүн арты менен карап барат.","","Жарышта аяп болбойт, сыйлоо болбойт,","Жарышта чаңда калсаң ыйлоо болбойт.","Түз-дөңбү, адыр-тоосу, чытырманбы,"]},{"t":"p","h":"Күлүктөр дайым жанын кыйноону ойлойт. Бир күлүк түшүп барат башка жолго,"},{"t":"v","l":["Бир тобу самсып барат кашка жолдо.","Бир күлүк жаны кейийт тер чача албай,"]},{"t":"p","h":"Бир күлүк өзүн сабайт башка жонго. (К. К.)"},{"t":"p","h":"58. Текстти окуп чыгып, андагы кара тамга менен басылган сөздөргө көңүл бургула. Ал сөздөрдүн айтылышы менен жазылышындагы айырмачылыктар болсо, эмне себептен экендигин түшүндүрүп бергиле. Андай өзгөчөлүктөр үнсүз тыбыштардын алга карай окшошуп өзгөрүүсүнө кирер-кирбесин"},{"t":"p","h":"ТТ"},{"t":"raw","h":"<div class=\"gloss\"><p>бергиле.<\/p><\/div>"}],"sub":[{"title":"ЖАРЫШ","b":22}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[75,77]},{"title":"КАЙРАН ТОКОМ КОМУЗУ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"78\">78<\/span>КАЙРАН ТОКОМ КОМУЗУ"},{"t":"p","h":"Улуу акын Сибирден келгенден кийин да, Сибирге айдалганга чейин да, өмүрүнүн акыркы жылдарында да атактуу Беш-Таш ашуусун ашып, Талас жергесине эчен курдай келген. Таластын аягынан башына чейин нечен кыдырып, эл аралап көптөгөн тойлордо, жыйындарда болгондугун, кутмандуу Талас жергесинен көптөгөн көңүлү жакын дос тапкандыгын, аны чоң, кичине дебей сый-урмат кылгандыгын карыялардан азыр да уга калып жүрөбүз. Сөзүбүз куру болбосун үчүн өзүбүз көрүп билип жүргөн фактылардын бирине кайрылалы. Убагында сөз кудуретин жогору баалап, сөз баккан карыялардан Током тууралуу уккандарыбызды кагаз бетине түшүрө бербей, эми минтип улуу акын тууралуу билгенибизден биле элегибиз көп болуп отурат. Ошентсе да тагдырга таберик дегендей, жакында Токтогулдун өзү чаап, өмүрүнүн акыркы жылдарына чейин урунган кыпкызыл өрүк комузу табылды. Муну ардагер, сарамжалдуу Наскара уулу Эсенкулдун үйүнөн көрдүк."},{"t":"p","h":"Сурай келгенде, бул комуздун баяны төмөндөгүчө экен. Эсенкулдун атасы Наскара өз мезгилинде орто чарбалуу, оокат-ашы кенен, элге карамдуу да, алымдуу да анчалык төгүп ырдабаганы менен сөздүн кыябын келтире сүйлөй да, уга да, баалай да билген, анын куну менен кудуретин өтө жогору баалаган уламалуу адам болгон экен."},{"t":"p","h":"Талас районунун Талдуу-Булак айылында Кулназар аттуу ете сөзмөр, эски уламыш менен болмуштарды да бабына келтире кызыктуу кылып сүйлөй билген санжырачы, Токомдун Талас жерине ар бир келишинде күн-түн кошо жүрүп, кошо жатып дегендей, бирге болгон етө кадырман адам бар эле. Мына ошол Кулназар кары: «Токтогул ырдаган эле, Токтогул айткан эле»,— деп Токомдун ырларынан далайды айта калып жүргөнүн бала кезде уккан элем. Кайран кишинин сөзүн убагында чогулткан, кунт кылган адам болбоду. Не бир сонун сөз казыналары, Токомдун ал киши билген ырлары өзү менен кошо кете берди."},{"t":"p","h":"Мына ошол Кулназар чечен согуш мезгилинде Намас уулу Наскарага (биз сөз кылган Эсенкулдун атасы) келип, Токомдун комузун алып кетип, көпкө өзүндө сак-"},{"t":"p","h":"ТВ <span class=\"pg\" data-n=\"79\">79<\/span>таган экен. Эсенкул 1946—47-жылдарда Кулназардан атайы барып кайра өзүнө алгандыгын кеп кылды. Кыясы, Кулназар сөзмөр Токомду самап-сагынып дегендей комузун эш тутуп, улуу акынга деген сагыныч-кумарын басаңдаткандай түрү байкалат. Мына ошондон ушул күнгө чейин бул комуз Эсенкул карыянын үйүндө ак дакиге оролгон боюнча етө ыйык буюм катары сакталып турат. Балким, бул комуз бул күндө улуу Токомдон калган жападан-жалгыз өздүк буюмудур. («КМ»)"},{"t":"p","h":"59. Текстти окуп, кара тамга менен басылган сөздөрдүн кайсынысы туура жазылгандыгын жана кайсылары туура эмес, айтылышы боюнча жазылгандыгын белгилеп, тууралап жазгыла."},{"t":"p","h":"Назар салып угуп ал! Даанышмандар уйкуну чакан өлүмгө тете дебайтышкан. Ошондуктан уктаган адам өлүгадам менен барабар. Бул экөөнүн тең дүйнөдөн кабары жок жатарын акылмандар көбайтышкан. Биринчиси – жандуу өлүгекен, экинчиси – жансыз дешкен."},{"t":"p","h":"Көбуктоо – өтө жаман адат. Тулку боюң талыкшып, жүзүңдү сыркоого окшотуп койгонун көбеле байкагандырсыңар. Уйкуга жеңдирсең, ооруну өзүң таабаласың. Күндүз менен түн биригип 24 саат. Анын үчтөн бири – сегиз саат. Ошо сегиз сааттан көбуктаба. 24 сааттын үчтөн эки бөлүгү эмгек, окуу, курсантчылык менен өтсүн. Акылмандар: өмүрүңдүн үштөмбир бөлүгүн укта да, эки бөлүгүн ойгоо жүрүп, жашабет дебайтышыптыр, айтканда да көбайтышыптыр."},{"t":"p","h":"Бул сөздөрдү ар дайым дилиңде сакта. Аны эртең менен турубатканда да, кечинде төшөгүңө жатыбатканда да унутпа."},{"t":"p","h":"Кабагачып, сергек жүргүң келсе, эртелеп ойгон. Эрте тургандын бир ырыскысы артык дебайтылганды чыгарба ойдон."},{"t":"p","h":"Уядагы жумуртка жатыбалбайт жумуртка бойдон. Ал ачылса куш болот, асманда учкан обологон. Балдарым, силер да жүрө бербейсиңер ушул бойдон, бийикке чыгып, алыска учкуңар келсе, азыртан азыраагуктап, акылмандар сөзүн угуп, көбүрөөк ойлон... («Кабус нааме»."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[78,79]},{"title":"ОРФОГРАФИЯ ЖАНА ОРФОЭПИЯ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"80\">80<\/span>ОРФОГРАФИЯ ЖАНА ОРФОЭПИЯ"},{"t":"p","h":"Адабий тилдин жазууда колдонула турган бирдиктүү нормаларын туура сактап, сөздөрдү бир түрдүү жазыш үчүн, атайын иштелип чыккан эрежелердин системасы орфография деп аталат."},{"t":"p","h":"Сөздөрдү адабий тилдеги бирдиктүү норма боюнча айтууга жетектей турган жалпы эрежелердин жыйындысы орфоэпия деп аталат."},{"t":"p","h":"Тилдеги сөздөрдү белгилүү норма боюнча туура жазуу канчалык мааниге ээ болсо, аларды туура айтуунун да ошончолук мааниси бар. Ансыз тил маданиятынын жогорулашы мүмкүн эмес."},{"t":"p","h":"Тилибиздеги сөздөрдүн баары эле айтылышы жана жазылышы боюнча бирдей эмес. Мисалы:"},{"t":"p","h":"айтылышы:"},{"t":"v","l":["көрүмбайт","кешти","көссал","таабал","керелек","кебук","жазылышы:","көрүнбөйт","кечти","көз сал","таап ал","көрэ элек","кеп ук"]}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[80,80]},{"title":"§ 21. КЫРГЫЗ ОРФОГРАФИЯСЫНЫН НЕГИЗГИ ПРИНЦИПТЕРИ","blocks":[{"t":"h3","h":"§ 21. КЫРГЫЗ ОРФОГРАФИЯСЫНЫН НЕГИЗГИ ПРИНЦИПТЕРИ"},{"t":"p","h":"Кыргыз тилиндеги уңгу сездердун жана сөз мүчөлөрүнүн жазылышы эки түрдүү орфографиялык принципке негизделген:"},{"t":"v","l":["1. Морфологиялык принцип.","2. Фонетикалык принцип."]},{"t":"raw","h":"<div class=\"gloss\"><p><\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"81\">81<\/span>1. Морфологиялык принцип, Бул уңгу сөздөрдүн бир түрдүү жазылышын камсыз кылат. Башкача айтканда, уңгу сөздөрдүн ар кандай тыбыштык өазгөрүүгө учурап айтылышы боюнча эмес, алардын баштапкы түрүндөгү тыбыштык көрүнүшү сакталып жазылат."},{"t":"p","h":"Мисалы:"},{"t":"v","l":["комусчу эмес, комузчу","кештурду эмес, кеч турду"]},{"t":"p","h":"Сөздөрдүн айтылышы менен жазылышындагы мындай айырмачылыктар тууралуу буга чейин да айтылган."},{"t":"p","h":"ты Н ж. да сөз мүчөлөрүнүн жазылышы фонетикалык прин- 2. фонетикалык принцип. Кыргыз орфографиясынкү ципке негизделген. Тактап айтканда, уңгуга уланган мүчө кандай өзгөрүүлөргө учурап айтылса, ошол ты- быштык түрү жазууда толук сакталат. Мисалы, илик жөндөмөсүнүн -нын мүчөсү 12 вариантка ээ. Алар уңгу сөздөрдүн аяккы муунуна карата 12 түрдүү айтылат. Мынчалык көп вариантка ээ болгон мүчөлөрдү бир формага келтирип жазуу мүмкүн эмес. Ошондуктан кыргыз тилиндеги туунду сөздөрдү жазууда фонетикалык принцип колдонулат."},{"t":"p","h":"М исал ы: ак куулар, тоолор, уйлер, текчелер, тактар, жемиштер, оттор, чейчектер, каздар, колдор, көздөр, бендер."},{"t":"p","h":"Мында -лар мүчөсүнүн калган варианттары фонети- ‚ калык принциптин негизинде ишке ашты."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[81,81]},{"title":"§ 22. КЫРГЫЗ ОРФОГРАФИЯСЫНЫН ЖАЛПЫ ЭРЕЖЕЛЕР СИСТЕМАСЫ","blocks":[{"t":"h3","h":"§ 22. КЫРГЫЗ ОРФОГРАФИЯСЫНЫН ЖАЛПЫ ЭРЕЖЕЛЕР СИСТЕМАСЫ"},{"t":"p","h":"Кыргыз орфографиясынын атайын иштелип чыккан эрежелеринин системасы негизинен төмөнкүдөй (бөлүмдөрдөн турат:"},{"t":"p","h":"1. Сөздөрдүн уңгусу жана сөз мүчөлөрүн жазуу эре- желери;"},{"t":"p","h":"2. Сөздөрдү бирге жана бөлөк жазуу эрежелери;"},{"t":"p","h":"3. Баш тамгаларды коюп жазуу эрежелери;"},{"t":"p","h":"4. Сөздөрдү ташымалдап жазуу эрежелери."},{"t":"h3","h":"<span class=\"pg\" data-n=\"82\">82<\/span>Сөздөрдүн уңгусун жана сез мүчөлөрүн жазуу эрежелери"},{"t":"p","h":"а) Кыргыз тилиндеги уңгу сөздөрдүн жана ага жалганган мүчөлөрдүн жазылышы морфологиялык жана фонетикалык принципке негизделген. Уңгу сөздөр морфологиялык принцип боюнча ар кандай тыбыштык өзгөрүүлөргө учурап айтылышы эсепке алынбастан, жазууда алардын уңгу түрүндөгү баштапкы тыбыштык көрүнүшү сакталат. Ал фонетикалык принцип боюнча ага уланган мүчөлөрдүн тыбыштык өзгөрүүгө учурап айтылышы (мүчөлөрдүн варианттары) боюнча жазылат."},{"t":"p","h":"б) Оозеки кепте ар түрдүү варианттарда айтылып жүргөн сөздөрдү жана диалектилик фактыларды бир калыпка түшүрүү үчүн, тактап айтканда, айтылышынын да, жазылышынын да бир вариантын алуу үчүн орфографиялык сөздүктөргө кайрылуу зарыл. Алсак:"},{"t":"p","h":"Оозеки жана диалек-"},{"t":"v","l":["тилик варианттар:","жыңайлак","жаңгыз","абан","балкыч","баки, паки","быяз, мыяз","Орфографиялык","варианттар:","жылаңаяк","жалгыз","обон.","балчык","маки","пияз"]},{"t":"p","h":"в) Кээде айрым сездерге мүчө уланганда морфологиялык принцип толук сакталбай, ага фонетикалык принцип үстөмдүк кылып кеткен учурлар болот. Башкача айтканда, кээ бир уңгу сөздөр айрым мүчөлөрдүн таасири аркылуу тыбыштык курамын өзгөртүп айтылып калат:"},{"t":"v","l":["эки + оо экөө","там + ып таамп","мен + га мага","бала + лар балдар","орун + а орду","жумуш + а жумша"]},{"t":"p","h":"<span class=\"pg\" data-n=\"83\">83<\/span>Сөздөрдү бирге жана бөлөк жазуу эрежелери а) Сөздөрдү бириктирбей, ар бирин айрым-айрым жазуу айтылып жаткан ойду так, туура түшүнүүгө, сүйлөмдөгү ар бир сөздүн чегин ажыратып таанууга толук мүмкүнчүлүк берет."},{"t":"p","h":"Оозеки кепте удаа айтылган сөздөрдүн көпчүлүгү бири-бирине кошулуп айтылат. Бирок алар бири-биринен басым аркылуу айырмаланып турат. Андай жанаша келип, дээрлик биригип айтылган создер жазууда өз алдынча белек-белек жазылбаса, сөздүн мааниси түшүнүксүз болуп калышы мүмкүн."},{"t":"v","l":["Салыштырып көргүлө:","","карамай","кираиды","малалат","кара май","кир алды","мал алат"]},{"t":"p","h":"б) Сөздөрдү бириктирип жазуу төмөнкүдөй учурларда болот. Тарыхый жагынан татаал, ал эми азыркы учурда женекей сөз катары колдонулуп жүргөн сөздөр бирге жазылат: бүгүн (бул – күн), унчук (үн – чык), токсон (тогуз-он), агайын (ага-ини), таяке (тай – аке) ж. у. с."},{"t":"p","h":"Адамдарга, жаныбарларга коюлган энчилуу аттар бир нече сөздөрдөн турса, алар биригип жазылат: Керимкул, Турдубай, Туратбек, Гулбубу (булар – адам аттары); Бөрүбасар, Аккула, Тайтору, Суречки (булар – жаныбарлардын аттары)."},{"t":"p","h":"Эскертүү: Өз аты менен катар же өз атынын ордун басып, ылакап катары колдонулуп кеткен аттар белекбөлөк жазылат: Жаңыл мырза, Тоголок Молдо, Молдо Нияз."},{"t":"p","h":"Баш тамгаларды коюп жазуу эрежелери"},{"t":"p","h":"Жазуу иштеринде баш тамгалар төмөнкү учурларда колдонулат:"},{"t":"v","l":["а) сүйлөмдүн башында;","б) энчилүү аттарды жазганда;","в) баш тамгасынан кыскартылган сөздөрдө."]},{"t":"p","h":"<span class=\"pg\" data-n=\"84\">84<\/span>Сөздөрдү ташымалдап жазуу эрежелери Эгерде жазып келе жаткан сөз саптын аягына батпай калса, анын батпай калган бөлүгүн жаңы сапка ташып жазууга туура келет. Бирок сөздөрдү бир саптан экинчи сапка туш келди эле ташый берүүгө болбойт. Алар төмөнкүдөй жолдор менен ишке ашат;"},{"t":"p","h":"а) Сөздөр бир саптан экинчи сапка муунга ажыроо тартиби боюнча ташылат: деп-тер, ка-ран-даш, ку-баттуу ж. у. с."},{"t":"p","h":"б) Эгерде сөз бир гана муундан турса, андай сөздөрдү ташууга мүмкүн эмес: топ, беш, жаак, суу."},{"t":"p","h":"в) Эгерде муундар жалаң гана үндүүдөн турса, аларды мурдагы саптын акырына бөлүп калтырууга же жаңы сапка ташууга жол берилбейт: эне (э-не), ысык (ы-сык), өмүр (е-мур). Ошондой эле йоттошкон тамгаларды жалгыз бөлүп ташууга да болбойт: я-щик, ю-мор, сы-н."},{"t":"p","h":"г) Баш тамгаларынан кыскартылган сөздөрдү ташууга жол берилбейт. Мисалы:"}],"sub":[{"title":"Сөздөрдүн уңгусун жана сез мүчөлөрүн жазуу эрежелери","b":6}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[82,84]},{"title":"АКШ, БУУ (ООН), КМШ, ЖОЖ, ЕДЕ ж. у. с.","blocks":[{"t":"h3","h":"АКШ, БУУ (ООН), КМШ, ЖОЖ, ЕДЕ ж. у. с."},{"t":"h3","h":"&amp; 23. ОРФОЭПИЯНЫН НЕГИЗГИ ЭРЕЖЕЛЕРИ"},{"t":"p","h":"1. Үнсүздөрдүн артка карай ээрчишүүсүнөн улам өзгөрүүгө учураган тыбыштар орфоэпиянын эрежесине ылайык айтылат, бирок аларды орфографиянын эрежеси боюнча жазабыз."},{"t":"v","l":["айтылышы:","сөссүз","тамба","карыммай","күштүү","жазылышы:","","сөзсүз","танба","карын май"]},{"t":"p","h":"2. Эки сөз ортосунда к, п тыбыштары жумшарып айтылат, бирок жазууда морфологиялык принцип сакталат."},{"t":"p","h":"в4"},{"t":"h3","h":"<span class=\"pg\" data-n=\"85\">85<\/span>айтылышы:"},{"t":"v","l":["агулак","тагайт","(","кебук",")","таабал","жазылышы:","","ак улак","так айт","кеп ук","таап ал"]},{"t":"p","h":"3. Жанаша айтылган эки сөздүн мурункусу үндүү › менен аяктап, кийинкиси үндүү менен башталса, ал үндүүлөрдүн бирөө түшүрүлүп айтылат:"},{"t":"p","h":"айтылышы: сарала көрелек туралбайт"},{"t":"v","l":["жазылышы:","","сары ала","көрэ элек","тура албайт"]},{"t":"p","h":"(4. Адабий тилде н тыбышы сөз башында туруктуу сакталып айтылат: нарк, найза, нокто, нечен, ныпта (арк, айза, окто, эчен, ыпта эмес)."},{"t":"p","h":"5. Орус тилинен же ал аркылуу башка тилдерден › кирген сөздөрдүн аягындагы айрым жумшак үнсүз (б, в, г, д, ж, з) тыбыштар (п, ф, к, т, ш, с) болуп каткалаңдашып айтылат: клуп (клуб), актип (актив), склат (склад), тираш (тираж), эскис (эскиз) ж. у. с."},{"t":"p","h":"60. Тексттеги кара тамга менен басылган сездерге көңүл бөлүп, алардын жазылышында кандай ката кетирилгенин таап, оңдоп жазгыла. Аларды оңдоодо кайсы эрежелерге таянганыңарды айткыла. Кетирилген ката менен силер оңдоо киргизген фактылардын ортосундагы орфографияга, орфоэпияга тиешелүү өзгөчөлүктөрдү мүнөздөп бергиле."},{"t":"h3","h":"САРЫЧЕЛЕК КОРУГУ ‘"},{"t":"p","h":"Борбор азияда жайгашкан өлкөлөрдүн ичинде кыргыз Республикасы – кооз көлдөргө бай. Анын көлдөрү бири-биринен чоңдугу, тереңдиги, суусунун көлөмү, өңүтүсү айлана-тегерегиндеги жаратылышы, абасы жана башка белгилери менен айырмаланат, анткени алар ар кандай бийиктикте жатат. Күңгөй менен тескей тоолорунун <span class=\"pg\" data-n=\"86\">86<\/span>аралыгындагы кеңири өрөөндүн чуңкурлуу бөлүгүн ээлеп, 1609 метр бийиктикте миң кубулуп кыялдана толкуган кыргыздын ЫсыкКөлүн кимдер гана билбейт. Деңиз деңгээлинен 3000—3500 м жогору көтөрүлгөн бийик тоолордун арасында созулган соңкөл жана чалкыган чатыркел да баарыга белгилүү."},{"t":"p","h":"Ал эми СарыЧелекчи! Ал чаткал тоолорунун ат ойнокко тутумдашкан чыгыш бөлүгүндө жайгашкан. Жайкысын кайсыл убакта барбагын, кандай маалда көрбөгүн теренгелдун көшүлгөнү көшүлгөн, суйкайганы суйкайган. Көл деңиз деңгээлинен 1858 метр бийиктикте орун алган. Узундугу 6,5 чакырым. Туурасы өтө жазы келген, түштүк жагында 1,5 километрден ашык. Сарычелек Ысыккөлдөн кийинки эле теренгел. Анын эң терең жери – 244 м. Тоскоолду тең ортосунан бөлүп, көлдөн суу агып чыгат. Сарычелек көлүнүн айланасы укмуштуудай кооз. Ал аймакта өскөн өсүмдүктөрдүн жүздөгөн түрлөрү арча, кайың, карагай аралашкан токоюна көрк берип турат. Анын ичинде сейрек учуроочу айбанаттар, канаттуулар да кезигет. Ошолордун өсүп-өнүгүшү үчүн, сейрек кезиккен жаныбарлар да, есумдуктер да атайын корукка алынган."},{"t":"p","h":"Өзүнүн укмуштуудай кереметтүү табияты, таңгаларлык кооздугу ар бир кишини кызыктырып, кучагына тартып, герелек адам болсо, өзүнө чакырып турат. Уптундай өзгөчөлүгү менен кишини таңгалдырган Сарычелек коругу жалпыга маалым. («Мурас» журналы.)"}],"sub":[{"title":"САРЫЧЕЛЕК КОРУГУ ‘","b":16}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[85,86]},{"title":"§ 24. ОРФОЭПИЯЛЫК ЖАНА ОРФОГРАФИЯЛЫК ТАЛДОО","blocks":[{"t":"h3","h":"§ 24. ОРФОЭПИЯЛЫК ЖАНА ОРФОГРАФИЯЛЫК ТАЛДОО"},{"t":"p","h":"Орфоэпиялык жана орфографиялык талдоо жүргүзүү учун төмөнкүлөр көңүлдүн борборунда болууга тийиш:"},{"t":"p","h":"1. Адабий тилдин нормаларын сактап сүйлөө жана аларды туура жазуу үчүн кандай негиздерге таянышыбыз керек?"},{"t":"p","h":"2. Адабий тилдин жазууда колдоно турган бир- ‚ диктүү нормаларын туура сактап, сөздөрдү бир түрдүү <span class=\"pg\" data-n=\"87\">87<\/span>жазуу үчүн атайын иштелип чыккан эрежелердин сис- ‚ темасын кандайча атайбыз?"},{"t":"p","h":"3. Атайын иштелип чыккан ар бир тилдин жазуу эрежелери кандай принциптерге негизделет?"},{"t":"p","h":"4. Орфоэпия жана анын негизги эрежелери жөнүн- ’ дө эмнелерди билесиңер?"},{"t":"p","h":"5. Айтылышы менен жазылышы бирдей боло бербе- ‚ ген сөздөрдүн туура айтылышы кайсы эрежеге ылайык ' келет?"},{"t":"p","h":"6. Сөздөрдү бөлөк, бирге жана алардын араларына дефис коюп жазууда кандай эрежелерге таянуу керек?"},{"t":"p","h":"7. Ташымалдоонун кандай жолдору бар?"},{"t":"p","h":"8. Баш тамгалардын, кыскартылган сөздөрдүн жазылуу эрежелерин эске салгыла."},{"t":"p","h":"Ушул эскертилгендерди эске түшүргөн соң, орфографиялык жана орфоэпиялык талдоолорду жүргүзүү мүмкүнчүлүгү ачылат."},{"t":"p","h":"61. Төмөндө келтирилген сөздөрдү дептериңерге туура жазылышы жана айтылышы боюнча эки тилкеге бөлүп чыккыла. Аларды орфоэпиялык, орфографиялык эрежеге ылайык экендигин көрсөткүлө."},{"t":"p","h":"Качты, кашты, таңгалды, экөө, таабалды, таап алды, өкөө, жообал, түңкү, клуб, клуп, куваныштуу, чебер, убада, чевер, кубанычтуу, портфель, партфел, увада, көп иште, жыгаччы, көбиште, жыгашчы, сен гимсиң, сен кимсиң, комузчу, комусчу."},{"t":"v","l":["Үлгү:","орфографиялык","эрежеге ылайык:","үзсүн","кучтуу","экөө","жооп ал"]},{"t":"p","h":"62. Энчилүү татаал аттардын жазылышы боюнча эрежелерге таянып, адам аттарына, жер-суу аттарына, мекеме-уюмдардын, газета-журналдардын аттары катышкан 15-20 сүйлөм түзгүлө. Ал сүйлөмдөрдөгү энчилүү татаал аттардын жазылышында кетирилүүчү каталардын себептерине байланышкан оюңарды айтып, өз пикириңерди билдиргиле."},{"t":"p","h":"в?"},{"t":"p","h":"<span class=\"pg\" data-n=\"88\">88<\/span>Үлгіщ:"},{"t":"p","h":"Молдокерим агай колундагы «Эркин-Тоо» газетасын көрсөтүп, Кумтердун аймагында алтын кенинин кору мол экендигин геологдор изилдеп чыккандыгын айтып жатты."},{"t":"p","h":"Бул сүйлөмдө адамдын, газетанын, жердин атына байланышкан үч энчилүү татаал ат колдонулду. Эре- жете ылайык энчилүү татаал аттардын адамга коюлганы чогуу, газетага берилгени тырмакчага алынып, айрым- айрым, ал эми жерди билдирген атоонун ар бир сөзү баш тамгалар менен жазылып, арасына сызыкча коюлду. Булардын баары орфография эрежелери- ' не ылайык келет. Бул сүйлөмдү жазууда теменкудей каталар кетирилиши мүмкүн: а) адам аты Молдо Керим болуп эки бөлүнүп, б) жер аты Кумтөр болуп чогуу жазылып же тырмакчага алынып жазылышы. Мындай каталыктар, биринчиден, орфографиянын эрежелерин так билбегендиктен, экинчиден кийинки кезде басма сөздөрдө айрым адамдардын же уюмдун сунуштарын мыйзамдаштырбай туруп эле ез иштеринде колдонуп жаткандыктарынан болушу мүмкүн."},{"t":"p","h":"Орфография эрежелерин кайталоо үчүн суроолор:"},{"t":"p","h":"1. Э, е тамгаларынын кыргыз тилинин төл сөздөрүндэ жазылышынын кандай өзгөчөлүктөрү бар? Четтен кирген сөздөрдү жазууда ал эреже сакталабы?"},{"t":"p","h":"2. Баш тамгалар менен кандай учурларда жазабыз?"},{"t":"p","h":"3. Кыскартылган сөздөрдүн кандай түрлөрү бар жана алар кандайча жазылат?"},{"t":"p","h":"4. Татаал сөздөрдүн кандай түрлөрү биригип, кайсылары бөлөк-бөлөк өз алдынча жазылат?"},{"t":"p","h":"5. Ташымалдап жазуунун кандай эрежелери бар?"},{"t":"p","h":"6. Сөздөрдү бириктирбей, бөлөк-бөлөк жазуу кандай мааниге ээ (малалат, мал алат; бат ат, батат; белен деди, белендеди д. у. с.)."},{"t":"p","h":"ВВ"},{"t":"h3","h":"<span class=\"pg\" data-n=\"89\">89<\/span>Кыргыз тилиндеги"},{"t":"p","h":"сөздөрдө басымдын колдонулушу Б а е ы м – сөздөгү бир муундун көтөрүңкү үн менен айтылышы. Сөздөгү басым эки түрдүү болот: динамикалык жана музыкалык. Эгерде басымдуу муун сөздүн тутумундагы башка муундардан үндүн жогорулашы менен бөлүнүп айтылса, ал динамикалык басым деп аталат. Эгерде басымдуу муун сөздүн тутумундагы башка муундардан тонунун өзгөрүшү менен бөлүнүп айтылса, музыкалуу басым деп аталат. Кыргыз тилиндеги басым – динамикалык басым. Муну менен катар кыргыз тилиндеги басымдуу муун сөздүн тутумундагы башка муундарда үн узундугунун узарышы менен да мүнөздөлөт. Кептин тигил же бул элементин бөлүп айтуу сөздө да, сүйлөмдө да болот. Ушундан-улам фразалык жана еөздүк басым болуп, басымдын эки тиби ажыратылат, Фразалык басым сүйлөмдүн курамынын бир элементин башка элементтерден, ал эми сөздөгү басым сөздүн бир элементин башка элементтеринен айырмалоо аркылуу мүнөздөлөт. Ушун үчүн басым түшүп айтылган муунду басымдуу муун, басым түшпөгөн муун басымсыз муун деп аталат. Фонетикалык каражаттардын негизинде сөздөгү бир муунду башка муундардан күчтүү жана үндү бийик чыгарып, айырмалап айтуу аркылуу басымды билдиребиз. Демек, басым деген сөздүн тигил же бул элементин баса бөлүп айтуу. Кыргыз тилинде эки жана андан көп курамдуу бардык сөздөрдүн бир мууну басым түшкөн муун болот. Кыргыз тилинде басым сөздүн негизги белгиси катарында колдонулат. Кыргыз тилинде басым төл сөздөрдө дайыма сөздүн эң акыркы муунуна түшөт."},{"t":"h3","h":"Үйрөтүүчү жана текшерүүчү"},{"t":"p","h":"жазуу жумуштарына көнүгүүлөр 63. Төмөнкү текстти окуп чыгып, андагы кара тамга менен басылган сөздөрдүн жазылышын байкап, катасы болсо аны орфографиянын эрежелерине ылайык оңдоп көчүрүп жазгыла."}],"sub":[{"title":"Кыргыз тилиндеги","b":30},{"title":"Үйрөтүүчү жана текшерүүчү","b":32}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[87,89]},{"title":"ДОСТУКТАН ШИРЕЛГЕН ӨМҮР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"90\">90<\/span>ДОСТУКТАН ШИРЕЛГЕН ӨМҮР"},{"t":"p","h":"20-жылдары жыламыш кыштагында жаңы мектеп ачылып, анда жарды-жалчылардын балдары окуй башташканын байманаптар көралбастык менен карашкан. Алар: «Жарды окуп кимди жарытмак эле»,— дешип, келекелешкен. Бирок Аманкул мындай сөздөрдүн эченин укса да терикпеди. Эки жылдын ичинде эркин окуп, таза жазып калууга жетишти. Сабаты ачылган жаш жигит андан кийин кыска мөөнөттүү курсдан окуп, айылга мугалим болуп келди."},{"t":"p","h":"Күндөрдүн биринде Аманкул окуу куралдарын алуу үчүн шаарга гелди. Ошол учурда окуу жөнүндө сөссүйлөгөн жаш жигиттин сөзү анын көңүлүн өзүнө бурду. Анын бири:"},{"t":"p","h":"– Обулустук эл агартуу мекемесинин алдында музыкалык тийатр койчу төгөрөк ачылыптыр. Окуу алтайга созулат экен,—- деп калды."},{"t":"p","h":"...Бул күтүлбөгөн окуядан кийин, Аманкул Прогресс деген жумушчулар клубуна келди. Клуптун ичи жаштарга жык толгон..."},{"t":"p","h":"Анда окууга ышкыбоздорду тандап алуу үчүн, Мацуцин жана Еленин дегендер экзамен алып жатышыптыр."},{"t":"p","h":"Алар адегенде эле:"},{"t":"p","h":"– Фамилияң ким? – деп сурап калышты."},{"t":"p","h":"– Куту байдын уулумун. Атым Аманкул деди..."},{"t":"p","h":"– Сен ырдаганды билесиңби? Мынавул обонго салып ырдап берчи,— деп рояль ойной баштады."},{"t":"p","h":"Бул обон мага тааныш болгондуктан, эркин ырдадым. Анан тиги киши жанындагысына кайрылып:"},{"t":"p","h":"– Николай Николаевич, бул жигитти сөссүз окууга кабыл алуу керек, – деди."},{"t":"p","h":"... Н. Н. Еленин студиянын окуу программасын мурда герелек жаштарга чын бейили менен үйрөтө берди. Көбувакыт өтпөй эле, мени ал өзүнүн «Молдо Насирдин» аттуу үч көшөгөлүү комедиясындагы башкы ролго дайындады. Адегенде артистикке гөналбай жүрүп, анан тезеле коллектипке камыр-жумур болуп аралашып кеттим. Болочоктогу кыргыз элинин керкем өнер чеберлеринин бири Аманкул Куттубаев менен Н. Н. Елениндин чыгармачыл байланышы, ширелген достугу ошолгунден <span class=\"pg\" data-n=\"91\">91<\/span>башталып, алардын өмүрүнүн аягына чейин уланган. («Залкар таланттар» деген китептен.)"},{"t":"p","h":"64. Бул аңгемедеги татаал географиялык аттардын кандай жазыларын айтып бергиле."},{"t":"p","h":"Сарычелек – Кыргызстандагы айтылуу көлдөрдүн бири. Анын узундугу сегиз жарым километр, айрым жерлеринде туурасы терт жарым километрге чейин созулат. Көл деңиз деңгээлинен 1925 метр бийиктикте турат. Айрым жерлеринин тереңдиги 400 метрге чейин жетет."},{"t":"p","h":"Сарычелек тоо массивдеринин ортосуна жайгашкан. Оң жагында Упалуу тоосу бой созсо, сол тарабында Атжайлоо тоосу керилет. Төр жагын Музтөр деп коёт. Ал андан ары атактуу Атойнок тоосу менен чектешип кетет."},{"t":"p","h":"Сарычелектин айланасында Кыла, Чейчеккол, Ийрикел, Арманкел деген дагы башка көлдөр бар. Мурда бул көлдөрдү жээктеп айыл отура турган. Сарычелек корукка айландырылгандан бери анда жайлоого тыюу салынган."},{"t":"p","h":"Бул көлдөргө 1960-жылы карп балыгынын чабактары коё берилген. Азыр карп балыктары эң сонун өөрчүп жатат. Кээ бир балыктардын салмагы 15 килограммга чейин өсүп жеткен. («Кыргызетан маданияты» жумалыгынан.)"},{"t":"p","h":"65. Х. Карасаевдин түзгөн орфографиялык сөздүктөрүнөн пайдаланып, бул татаал сөздөрдүн ичинен кошмок сөздөрдү өзүнчө, кош сөздөрдү өзүнчө бөлүп көчүргүлө, Кош сөздөрдүн арасына дефис белгисин коюп жазгыла."},{"t":"p","h":"Аба ырайы, ала шалбырт, ала була, буюм терим, атамекен, өнөр жай, маңдай тескей, бет маңдай, бет алды (бет алды кете берүү) жалгыз жарым, жоро жолдош, үзөңгү жолдош, жан жөкөр, ит куш, тоту куш, ит мурун, эмгек куралы, курал жарак, баш макала, баш көз, бала чака, музоо баш, музоо торпок, кийим кече, эртели кеч, кара курт, кир кок, болор болбос, жаан чачын, бака жалбырак, ай балта, айлап жылдап, мелт калт."},{"t":"p","h":"66. Текстти окуп, кашаага алынган сөздөрдүн кайсынысы кош сөз, алардын кандай жазыларын айтып бергиле."},{"t":"p","h":"(Ой тоону) чулгаган калың кар. (Кез кез) асман тунарып, (жер жүзүн) түгөл буркегудей булут каптап борошо <span class=\"pg\" data-n=\"92\">92<\/span>урат. Суукка каткан теректин, (кара жыгачтын) бутактары кычырап, жел жүргөн сайын (аркы терки) термелет. (Бак дарактардын) бутагында жай учурундагыдай сайран куруп жүрүшкөн келгин куштар азыр жок. Канаттарын далдайткан (ала каргалар) сагызгандар тооктон жем талашып, (короо короого) үйүр болгон таранчылар гана көрүнөт."},{"t":"p","h":"Анткени менен шаардын көчөлөрүндөгү кыймыл баягыдай эле. Кечелерден машиналар (каршы терши) өтүп турат. (Катар катар) тизилген вагондорун сүйрөп, жүк тарткан паровоздор шаардын (чет жакаларындагы) (темир жолдордо) зымырайт. (Эртең менен) эрте жумушчулар (завод фабрикаларга) женесе, окуучулар мектепке, кичинекей балдар (бала бакчага) бет алышат. Мына ошентип, (күнү бою) тынбаган кыймыл түнкүсүн гана (бир азга) тынчыйт да, эртеси кайрадан башталат. («Ала- Тоо» журналы.)"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[90,92]},{"title":"ЛЕКСИКА ЖАНА КЕП МАДАНИЯТЫ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"93\">93<\/span>ЛЕКСИКА ЖАНА КЕП МАДАНИЯТЫ"},{"t":"p","h":"гг"},{"t":"p","h":"Бир тилдеги сөздөрдүн жалпы жыйындысы лексика деп аталат. Ал эми сөздөр жөнүндөгү окуу, илим лексикология болот. Деги эле сөз кандайча пайда болот деген сүрөп туулат."},{"t":"p","h":"Бизди курчап турган чөйрөдөгү жандуу, жансыз нерселер, кубулуштар, окуялар ж. б. бардыгы атоого муктаж. Адам акылына, көзүнө, кулагына таасир эткен конкреттүү жана абстракттуу түшүнүктөр, адамдар ортосундагы мамилелер зат жөнүндөгү туюмдарды топтоштурат да, конкреттуу, абстракттуу маанидеги заттык атоолорду алып келет. Заттардын түшүнүгүн билдирген сөздөр: адам, тоо, суу, мөңгц, темир, жаан, жцрек, акыл, суйцу, кыял ж. б."},{"t":"p","h":"Заттын өзүнө тиешелүү, мүнөздүү белгилери (сапаты, формасы, даамы ж. б.) атоо катары сын атоочту (чоң, сүйрү, ачуу ж. б.), кыймыл-аракеттин мүнөзүн туюндурган (тез, ылдам, жай ж. б.) тактоочту, санды туюндурган сан атоочту, заттын кыймыл-аракеттик белгилерин, абалын туюндурган этиш сөздөр пайда болот. Мына ошентип, биздин айланабыздагы туюмдар менен байланыштуу атоолор – сөздөр лексиканын корун түзөт."},{"t":"p","h":"Түшүнүктөр менен байланышкан атоолор сөздүк маанини туюндурат, сез маанилери жөнүндөгү илим семасиология деп аталат. Эми сөз маанилери кантип ажырайт, кандайча окшош болот деген суроо келип чыгат."},{"t":"p","h":"Заттар же кубулуштар өзүлөрү бирине бири окшош келет, ошондуктан атоодон мурун адам баласынын акылында типтештирилген окшоштук же кескин айырмачылыктар байкалат. Бири-бирине типтеш туюмдар бирдей аталып, жакын маанилеш сөздөрдү – полисемияны (көп маанилүүлүктү) түзүп, ага образдашкан окшош элестүү, керкөм боёкчолуу маанилер өтмө маанилерди <span class=\"pg\" data-n=\"94\">94<\/span>түзүп калат. Кокустуктан тыбыштык түзүлүшү бирдей келип калган сөздөр омонимдик түгөйлөргө айланат, ар башка аталыштагы бир типте жата турган түшүнүктөгү сөздөрдүн катары синонимди түзүп, таанып-билүү учурунда бирине бири көлөмдүк, сапаттык ж. б. белгилери боюнча карама-каршы келген сөздөр антонимдер болот. Ошентип, сөздөрдүн семантикалык маанилеринин түрлөрү келип чыгат."},{"t":"h3","h":"&amp; 25. СӨЗДҮН КӨП МААНИЛҮҮЛҮГҮ (ПОЛИСЕМИЯ)"},{"t":"p","h":"П оли сем и я – көп маани, көп маанилүүлүк жөнүндөгү илим. Сөздүн көп маанилүүлүгү кантип пайда болот?"},{"t":"p","h":"Бизди курчап турган айлана-чөйрөдө окшош заттар, ‚ кубулуштар, окуялар болот. Алар бирин бири толук ок- › шоштурбаса, айрым бир белгилери боюнча окшошот, дал келет. Улам жаңы заттарды ойлоп табышат. Ошентип бирин бири тууроочулук да келип чыгат. Мындай учурда окшош заттар, кубулуштар, окуялар бирдей түшүнүктү пайда кылат да, алардын аталышында улам жаңы сөз ойлоп тай устан, мурдагы эле сездер менен ' атай салышат. Ошентип көп маанилүүлүк (полисемия) ‚ кубулушу пайда болот. Алар омонимдер менен окшош, бирок айырмалуу жактары маанилик өзгөчөлүктү түзөт да, окшоштугу сырткы кейпинде гана учурайт. Аны жогоруда көрдүңөр."},{"t":"p","h":"Айырмачылыктын негизин полисемия менен омонимиянын пайда болуу булактарынан көрөбүз. Эгерде омонимия кокустуктан окшош аталып калган ар башка ‚ түшүнүктөн пайда болсо, полисемия заттардын, окуялардын, кубулуштардын окшоштугунун негизинде пайда болот. Мисалы:"},{"t":"p","h":"Туяк – 1. Малдын шыйрагынын учундагы катуу мүйүзчө. 2. Өтмө мааниде. Адамдын артында калган эркек баласы."},{"t":"p","h":"Тырмак – 1. Адамдын колунун, бутунун манжаларынын учундагы жумшак сеекче. 2. Тырмактын учундагы кесип салуучу бөлүкчө (тырмагым өстү)."},{"t":"raw","h":"<div class=\"gloss\"><p>Ныл ны ы. ы, ш ы ы ы Н =н<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"95\">95<\/span>Табак – 1. Тамак салынуучу, эт тартуучу идиш."},{"t":"p","h":"2. Тамак-аш (табакты кайсы дасторконго тартабыз). 3. Тамак ичүүгө келген элдин саны (канча табак эл экен?)."},{"t":"p","h":"(Полисемия пайда болуу ыгына карата метафоралык, метонимиялык, синекдохалык жолдор менен пайда болот)"},{"t":"p","h":"Метафоралык жол менен пайда болгон көп маанилүүлүк заттардын, кубулуштардын, окуялардын тышкы окшоштугунун негизинде маанилер оошот. ‚ Тышкы жалпы окшоштуктар, белгилер метафоризацияланууга негиз түзөт, натыйжада тектеш маанилердин ‚ бутагы келип чыгат."},{"t":"p","h":"М ы: Ком – 1. Төөгө жүк артуу үчүн өркөчүнө, белине орой таңылган кабат-кабат кийиз же башка калың нерселер, чом. Төөлөргө жук жүктөлбөйт ком болбосо {Барпы). 2. Уйдун, төөнүн абдан семиргенде пайда болгон жон майы. Төө семирип ком алган, ком алганда чоң алган {Тоголок Молдо)."},{"t":"p","h":"Метонимиялык жол заттардын маңыздык, мезгилдик, мейкиндик жалпылыгынын негизинде пайда болот, айрым учурда маңыз катары заттын эмнеден жасалгандыгынан да келип чыгат."},{"t":"p","h":"М исалы: Мейкиндикте алган орду боюнча пайда болгон метонимия:"},{"t":"p","h":"Класс – 1. Мектеп окуучуларынын жаш өзгөчөлүк- ‚ төрүнө карата топко бөлүнүшү (5-класс); 2. Ошол топтогу окуучулар үчүн арналып бөлүнгөн мектеп бөлмөсү."},{"t":"p","h":"Мезгилдик катышка карата пайда болгон метонимия:"},{"t":"p","h":"Ай – 1. Планетанын бирөө. 2. Күндүн жана өзүнүн огунда айлануунун негизинде пайда болгон он экиден бир бөлүгүн билдирүүчү мезгил."},{"t":"p","h":"Маңыз, көлөм, зат жайланышкан орунду ж. б. билдирүүдөн пайда болгон метонимия:"},{"t":"p","h":"Чыны – 1. Суюктук, чай куюу учун пайдаланылуу- ‚ чу идиш. 2. Чынынын ичиндеги тамак, суу (беш чыны ичтим)."},{"t":"p","h":"Жыгач – 1. Көп жылдык дарак өсүмдүктөрүнүн жалпы аты. 2. Отун (жыгач суу болуп, от күйбөдү)."},{"t":"p","h":"3. Жыгач эмерек, мебель (үйү толтура эле жыгач)."},{"t":"raw","h":"<div class=\"gloss\"><p> <\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"96\">96<\/span> Ч. Айтматов – 1. Жазуучу. 2. Айтматовдун чыгармаларынын жыйыны (Айтматов басмадан чыгыптыр; Айтматовду окудум)."},{"t":"p","h":"Синекдохалык жол менен пайда болгон полисемия ‚ заттын тышкы белгилерине, көлөмүнө, б. а., бүтүндү бөлүк катары, бөлүктү бүтүн катары атоо менен пайда болот."},{"t":"p","h":"Мисалы:"},{"t":"p","h":"Кол – 1. Адамдын эки ийининен баштап, манжаларынын учуна чейинки мүчөсү. 2. Малдын алдыңкы буту. 3. Беш манжа."},{"t":"p","h":"7Т{ \"Төмөнкү полисемиялуу сез маанилеринин кайсы жол менен жасалганын аныктап, ар бир маанисине мисал келтиргиле."},{"t":"p","h":"Кыял – 1. Ойлогон ой; тилек кылган, эңсеген ой;. фантазия. 2. Мүнөз. 3. Оюнун бир түрү."},{"t":"p","h":"Мүлтүлдө – 1. Бир калыпта турбай кылтылдоо, ойноктоо. 2. Улам бирине жагынып, же өз пайдасына карай эки тараптын улам бирине ооп кылтылдоо, чыныгы жүзүн билдирбееге аракет кылуу."},{"t":"p","h":"Муун – 1. Адамдын жана жаныбарлардын сөөктөрүнүн же чемирчектеринин кыймылга келип туруучу кошулган жери. 2. Каруу, күч, кубат. 3. Өтмө мааниде. Кээ бир өсүмдүктөрдүн бөлүк-бөлүк болуп турган жери, муунактары. 4. Ата-бабанын укум-тукуму; жашташ адамдар, курбулар. 5. Грамм. Сөздөгү бир ыргак менен айтылган бир же бир нече тыбыш."},{"t":"p","h":"Ички – 1. Ич жагын караган. 2. Ич жактагы, тер жактагы. 3. Ичтеги, жарыялана элек, көмүскө. 4. Өз ич арасына гана таандык, башкаларга, бетен тарапка тиешеси жок."},{"t":"p","h":"68. Төмөнкү «Көз» деген сөздүн маанилеринин ичинен метафоралык, метонимиялык, синекдохалык маанилерди ажыраткыла. Ар бирине мисалдар келтиргиле."},{"t":"p","h":"1. Адамдын, жан-жаныбарлардын көрүү мүчөсү."},{"t":"p","h":"2. Бир нерсенин тешиги, жылчыгы, ачык бөлүгү, көзөнөгү."},{"t":"p","h":"3. Куржундун бир жак бөлүгү."},{"t":"p","h":"4. Көбүнчө шакектин кичине асыл таш, мончок ж. б. орнотулган жери, бөлүгү."},{"t":"p","h":"<span class=\"pg\" data-n=\"97\">97<\/span>5. Терезенин ачылууга ылайык бөлүгү."},{"t":"p","h":"6. Күндүн, айдын бети."},{"t":"p","h":"89] «Баш» жана «Тарт» деген сөздүн маанилерин сөздүктөн карап, жогоркудай талдагыла."},{"t":"p","h":"Көп маанилүү сөздер сөздүктөрдө араб цифрасы менен, ал эми омонимдер рим цифрасы менен берилерине көңүл бургула."},{"t":"p","h":"Көп маанилүү сөздөр туунду жана өтмө маанилердин негизинде пайда болот. Омонимдин ар бир мааниси түз маани катары колдонулат, андай болбой туунду, же өтмө маанини (мындай маани коннотациялык маани деп аталат) пайда кылса, анда ал көп маанилүүлүккө айланат."},{"t":"p","h":"М исал ы: Жык деген сөздүн омоним да, полисемия да экенин карагыла:"},{"t":"p","h":"Жыйнаштыр. Этиш 1. Жыйнаштыруу, жыйнап, иреттеп коюу. 2. Токтотуп коюу, кандайдыр бир ишти андан ары улантпай, токтотуп таштоо."},{"t":"p","h":"Жык 1. Этиш. 1. Тикесинен турган нерсени узунунан түшүрүү, жыгылган абалга келтирүү. 2. Жеңүү, жеңилүүгө аргасыз кылуу. 8. Буруу, бир жакка багыт алдыруу (суу жөнүндө). 4. Дуушар кылуу, бир нерсеге милдеттүү кылуу, чыгымдатуу."},{"t":"p","h":"Жык П. Абдан толуу, абдан көп болуу."},{"t":"p","h":"Көңүл бурдуңарбы, жыйнаштыр сөзү көп маанилүүлүккө гана ээ, ал араб цифрасы менен гана белгиленди. Экинчи жык сөзү омоним 1, П рим цифрасы менен, ал эми полисемиялык маанилер 1, 2, 3, 4 араб цифрасы менен берилди."},{"t":"p","h":"10. Кыргыз тилинин түшүндүрмө сөздүгүнөн бир канча полисемиялуулуктарды таап, дептериңерге көчүргүлө."},{"t":"p","h":"71. Тексттен көп маанилүүлүккө, өтмө маанилүүлүккө зэ болгон сөздөрдү таап, түшүндүргүлө."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[93,97]},{"title":"МЕНИН МЕКЕНИМ","blocks":[{"t":"h3","h":"МЕНИН МЕКЕНИМ"},{"t":"p","h":"Ар бир адамдын өз мекени бар. «Мекен» деген сөз кыргызда – ата-бабанын жери, туулуп-өскөн жер дегенди билдирет. Ал, албетте, бүт эле гүлбакча эмес. Мен азыркы дүйнө жөнүндө кеңирээк сөз кылардан мурда өзүмдүн <span class=\"pg\" data-n=\"98\">98<\/span>өмүр башатыма ой жүгүртөм. Абдан сагындырып, бир көрүүгө куштарланткан Талас жергемди, ак-карасы аралаш жаткан өз келбетинде көз алдыма элестетүүгө аракеттенем. Эгер мен аалам койнун аралаган космикалык саякатта жүрүп, жер жөнүндө ойлончу болсом, сөзсүз, аны өз айлым Шекердин образы аркылуу элестетерим бышык. Анткени менин башатым ушул – Шекер. Ушул жерде аталарым жана бабаларым жашаган. Ушул жерде мен жарык дүйнөгө келип, турмуш тааныгам, өз тагдырымды тапкам. Ата Журт деп аталган туулуп-өскөн жердин тирлик тартиби, салт-санаасы, ыр, жомогу, жаратылышы, абасы – бүткүл турпаты адамдын адам болуп калыптанышында жана өз тагдырына ээ болуусунда зор таасири бар экендигине бекем ишенемин."},{"t":"p","h":"Биздин айылдын абышкалары ар бир баладан: «Кана, жети атаңды айт!» – деп, катуу талап менен сурашар эле. Элдин акыл-ас мурасы да, муундардын байланышы да мына ушуга негизделген. Бул жөнүндө мен «Ак кеме» повестимде бала менен машина айдаган казак жигит экөөнүн аңгемелешүүсүндө айтууга аракеттенгем. Турмушта жети атасын билбей эле жашап жүргөн адамдар бар экендигине бала аябай таң калат:"},{"t":"p","h":"– Жети атаңдын аттарын үйрөткөн жок беле акең?"},{"t":"p","h":"– деди бали."},{"t":"p","h":"– Ит билеби. Ага не тансык болдың? Жети атамы билбейм, бирак көрүп турасың гой, көп катары жасап жүрмин."},{"t":"p","h":"– Атам айтат, адамдар ата-тегин унутуп койсо, бузулуп кетет дейт."},{"t":"p","h":"– Не үшин?"},{"t":"p","h":"– Анда дейт, атам айтат, баары бир балдарым, балдарымдын балдары билбей калат деп, адамдар арам иштен жийиркенбей, тартынбай калат дейт..."},{"t":"p","h":"Бул жөнөкөй элдик философияны мен бала кезде уккан шекерлик абышкалардын насаат сөздөрүнөн алгамын. {Ч. А.)"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[98,98]},{"title":"§ 26. ОМОНИМДЕР ЖАНА АЛАРДЫН ТҮРЛӨРҮ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"99\">99<\/span>§ 26. ОМОНИМДЕР ЖАНА АЛАРДЫН ТҮРЛӨРҮ"},{"t":"p","h":"Силер ушул учурга чейин билгендей, пикир алышуунун каражаты катары колдонулган сөздөрдүн жалпы жыйындысы лексикалык корду (составды) түзөт. Заттарды, түшүнүктөрдү атоо мүмкүнчүлүгүнө карата ар башка сөздөрдөн турган жакын маанилеш синонимдерди, карама-каршы түшүнүктөрдөн турган антонимдерди, сөздөрдүн өтмө, туунду, образдуу маанилеринен пайда болгон полисемияны, ар башка маанилүү, бирок бирдей айтылып, бирдей жазылган омонимдерди жакшы билесиңер. Булар туюндурган түшүнүктөрүнө, маанилик катышына жараша өз ара байырланат жана карым-катышта болот. Мына ошондой сырткы түзүлүшү боюнча бири-бирине окшош келген тилдин лексикалык бутактарынын бири омонимия жана полисом и я кубулушу болуп эсептелет."},{"t":"p","h":"Омонимия жана полисемия экөө тең эки же андан көп мааниден турат, айтылышы да, жазылышы да бирдей келет. Бирок алардын маанилик карым-катышы, пайда болуу булактары ар башка."},{"t":"p","h":"Омон и мде р- айтылышы жана жазылышы бирдей, бирок маанилери ар башка сөздөр. Сырткы түзүлүшү боюнча алар көп маанилүү сөздөргө окшош келет, анткени омоним да, полисемия да көп мааниге ээ болуп, тыбыштык түзүлүшү бирдей болот. Эгерде полисемия (көөп маанилүүлүк) кубулуштун, заттардын атынын түпкү мааниси бирдей экендигине таянса, омоним сөздөрдүн мааниси бири-бирине окшошпойт. Аны төмөндөгү мисалдар менен далилдееге болот."},{"t":"p","h":"Жай / зат жаз айларынан кийин келүүчү мезгил, жаз менен күздүн ортосу."},{"t":"v","l":["Жай 1! зат орун, турак, мекен.","Жай [П тактооч акырын, шашпай,"]},{"t":"p","h":"Жай ГІ этиш жазуу, төшөө, жайып коюу, таратуу, маалым кылуу, малды жайытка коё берүү."},{"t":"p","h":"Бул жердеги жай деген сөздүн төрт түрдүү омоним маанилери бири-бирине окшош эмес. Сөз түркүмдөрү боюнча да ар башка. Бул сыяктуу сөздүк маанилер омоним болуп саналат. Эми жай деген сөздүн башкача көрүнүшүнө токтолуп көрөлү."},{"t":"p","h":"<span class=\"pg\" data-n=\"100\">100<\/span>1. Орун, турак, мекен. Көлүрө салууга жыгач жок, аттамчыкка жай коёлу деген акыл менен бир күнү! майда балдарды үйгө узатып жиберип, Дуйшен экөөбүз таш жыйнап, устуне чым коюп, ишке кириштик. (Ч. А.) Ой, жаныңды жеген Апенди, кудайды карап калп айтсаң боло, болуптур, атаңдын ошончолук узун укуругу бар болсо, аны кайсы жайга коюп журду › экен? – дейт калпычы. (Жом.)"},{"t":"p","h":"2. Төшөк, жата турган орун. Өзүңөр башыңарды. ‚ жууп, анан жай салып, балкып уктап жаткыла,— дейт. жез кемпир. (Ж. М.)"},{"t":"p","h":"3. Ал-абал, шарт. Жаман жайын айтам деп, баа- ' рын айтат. (Мак.)"},{"t":"p","h":"4. Мекеме, ишкана, уюм. Агроөнөр жай комплекси айыл чарбасынын бардык тармактарын өзүнө камтыйт. («СК»)"},{"t":"p","h":"Омоним менен полисемиянын маанилик бутакта-, нышын төмөндөгүдөй элестетүүгө болот."},{"t":"h3","h":"Салыштырып көргүлө:"},{"t":"p","h":"Кабык І зат. Нерсенин сыртынан каптап турган бөлүгү, катмары."},{"t":"p","h":"Кабык П зат. Жууркан, төшөктүн же сырт кийимдердин кабылып тигилиши."},{"t":"p","h":"Кагаз зат. 1. Жыгач, чүпүрөк жана башка нерселерден даярдалып, жазууда, басмада колдонууга, бетине сүрөт тартууга Кагаз арналган материал."},{"t":"p","h":"2. Жазылган ар кандай документ, кат ж. б. (Кагазга кол койдурам.)"},{"t":"p","h":"3. Өтмө. Кагазга оролгон буюм. (Дүкөндөн эки кагаз чай, эки-уч кагаз тамеки ала үйүн көздөй жөнөдү.)"},{"t":"p","h":"Жогорку мисалдардан кандай жыйынтык чыгарууга болот? Бир эле сөз эки башка мааниге ээ. 1. Затты ‚ сыртынан каптап турган бөлүк. 2. Кийим тигүү ыкмасы. Экөө бири-бирине эч кандай байланышпай пайда <span class=\"pg\" data-n=\"101\">101<\/span>болгон сөздөр экендиги даана байкалып турат. Ал эми кагаз сөзүнүн маанилери бири экинчисин, үчүнчүсүн пайда кылганын билиш кыйынчылык туудурбайт. Ал турмак, үч маанинин заттык жасалышы бир гана буюмдан улам чыкканын көрөсүңөр, Демек, көп маанилүү сөздөрдүн туюндурган түшүнүк түйүнү бир булактан келет, ал эми омонимдер ар башка булактан кокусунан окшош айтылып калган сөздөрдүн жыйындысын түзөт. Сөздөрдөн издеген учурда маани берип карасаңар, омонимдер рим цифрасы, көп маанилүү сөздөр араб цифрасы аркылуу ажыратылып берилет."},{"t":"p","h":"Кыргыз тилиндеги омонимдер төмөндөгүдөй жолдор менен пайда болот:"},{"t":"p","h":"1. кокустуктан (тыбыштык дал келүүдөн);"},{"t":"p","h":"П. Сөздөргө муче жалгануу менен пайда болгон омонимдер;"},{"t":"p","h":"ПТ. Сөздөрдүн маанилери алыстап кетүүнүн натыйжасында пайда болгон омонимдер;"},{"t":"p","h":"ТҮ. Башка тилдерден кабыл алуу учурунда тыбыштык окшоштуктардын натыйжасында пайда болгон омонимдер."},{"t":"p","h":"1. Фонетикалык омонимдер. Заттардын атын атоо учурунда ар башка заттар же түшүнүктөр кокустуктан бирдей аталышка ээ болуп калат. Андай омонимдердин кэз бирлери тилдин тарыхый өзгөрүшүнөн, өнүгүшүнөн улам тыбыштык өзгөрүүгө учураса, кай бирлери кокустуктан тыбыштык окшошууга дуушар болуунун натыйжасы."},{"t":"p","h":"М исалы: байыркы кыргыз тилиндеги айрым бозулмалар кыскарып, окшош сөздөрдүн катарын түзгөн:"},{"t":"p","h":"бар І этиш баруу баар же бар П этиш бир нерсенин бар болушу ат [зат жылкы"},{"t":"v","l":["аад же ат П зат адамдын ысмы","ат Ш этиш мылтыктан атуу ж. 6.","кул Т зат оттун күлү","кул П этиш кулу","кул Ш зат койдун терисиндеги оору","сыр Г зат боёк"]},{"t":"p","h":"<span class=\"pg\" data-n=\"102\">102<\/span>сыр П зат адамдын ички, купуя ою сыр Ш зат быштак."},{"t":"p","h":"П. Морфологиялык омонимдер. Уңгу сөздөргө сөз жасоочу мүчөлөр жалгануу менен морфологиялык омонимдер жасалат. Мындай учурда омоним уңгуга мүчө жалганганда андан келип чыккан сөздүн мааниси окшошпостон, ар түркүн түшүнүктү берет. Кээде уңгу сөзгө туунду сөздөр омонимдешет:"},{"t":"p","h":"чалма Ізат жылкы кармоочу курал чалма П зат там салууга ылайыкталган баткак чалма Ш зат баш кийим"},{"t":"v","l":["тутуу Г зат боз үйдүн кийизи","тутуу П этиш кармоо."]},{"t":"p","h":"Омонимдик түгөйлөрдүн бири уңгу сөз тибинде, экинчиси туунду түрүндө болуу менен бирдей аталышка ээ болуп калганын көрөбүз:"},{"t":"p","h":"бармак 1 зат колдун манжаларынын бири (баш бармак) бармак П этиш кыймыл-аракеттин келер чагын билдирет шыбак І зат талаадагы жыттуу өсүмдүктөрдүн түрү шыбак П зат шыба этишинен жасалган, тамдын, дубалдын сүртүлгөн шыбагы ачуу Г зат каар, жини келгендик, кыжырлангандык ачуу П сын даам, жагымсыз, ачуу, кычкыл ачуу Ш кыймыл атооч, ач этиш сөзүнөн жасалган (жабык нерсени ачык абалга келтируу) ж.б."},{"t":"p","h":"1. Семантикалык омонимдер. Көп маанилүү сөздөр бара-бара ажырап отуруп, кыйла мезгилдерден кийин, омонимдик түгөйдү пайда кылат:"},{"t":"p","h":"жем зат азык, тамак жем П зат тегирмендин чанагынан түшүп жаткан данды кичинеден жана бир калыпта чубурта турган, чанактын алдына орнотулган бөлүгү шайман І зат бир нерсе жасоого, иштөөгө керек болгон жарак-жабдыктар, курал-жарактар шайман П зат күч, кубат, ал-күч, дарман чыр І зат чатак, жаңжал, чатак чыгарган нааразылык <span class=\"pg\" data-n=\"103\">103<\/span>чыр П сын урушчаак, жаңжал чыгарганды жакшы көргөн адам."},{"t":"p","h":"ГУ. Омонимдер башка тилдерден кабыл алуу жолу менен да пайда болот. Кыргыз эли башка элдер менен такай карым-катнашта болгондуктан, алардын сөзү эне тилибизге аралашып турган. Кабыл алынган сөздөрдүн айрымдары кыргыз тилинин тыбыштык түзүлүшүнө карай фонетикалык өзгөрүүгө дуушар болгон. Ал турмак, омонимдик түгөй өз сөз катары колдонулуп жүргөндөрү да жок эмес."},{"t":"v","l":["Мисалы:","ак І (кырг.) кардын, сүттүн өңүндөй түс"]},{"t":"p","h":"ак П {ар.) каргыш, балалыктан кечүү, терс бата берүү (Кечтим сенин балалыгыңдан! Ак кылдым!)"},{"t":"p","h":"ак Ш (ар.) Кудай, Теңир ак ГУ (ар.) чын, чыныгы, чындык, таза Орус тили жана ал аркылуу баптка тилдерден кабыл алынган сөздөр да кыргыз тилиндеги айрым сөздөргө окшошуп, омонимдерди пайда кылат:"},{"t":"v","l":["билет 1 чыпта","билет П билүү, аңдоо"]},{"t":"p","h":"баян І зат жөн-жайды, ал-абалды билдирген кабар, маалымат баян П зат татаал системадагы кыяк, гармонь, музыкалык аспап метрика І ыр түзүлүш закондорунун жыйындысы метрика П баланын туулгандыгы тууралуу күбөлүк Жогоруда силер омонимдердин пайда болуу булактары менен тааныш болдуңар. Эми төмөнкү класста окуган омонимдердин түрлөрүн эсиңерге түшүргүлө:"},{"t":"p","h":"Омограф – айтылышы айырмаланган, бирдей жазылган сөздөр; карта – жылкынын ички эти; карта – географиялык түшүнүк; ток – электр кубаты; ток – курсагы ток; корк – коркуу сезими; Корк – Англиядагы шаардын аты."},{"t":"p","h":"Омофон – айтылышы окшош, формалары да бирдей сөздөр (алар омоформалар деп да аталат): тапта – этиш табына келтирүү, шыктандыруу, демилге берип, үйрөтүп даярдоо; тапта – этиш тегиздее, бырышын жазуу, ныктоо; тапта – этиш шилтеп, чаап, уруп <span class=\"pg\" data-n=\"104\">104<\/span>жиберүүгө камынган, обдулган абал; кайыш – зат ийленген, иштелген тери; кайыш – этиш ийилүү, майышуу, катуу азап чегүү жанга батып, кыйноо тартуу; ага – ага-ини, тууган; ага – ал ат атоочунун барыш жөндөмөсү менен езгерген туру."},{"t":"p","h":"Т2. Төмөнкү сөздөрдүн омонимдик маанилерин карап, тыбыштык өзгөрүүсүн байкагыла. Кабыл алынган сөздөрдү сөздүк дептериңерге жазып, көп маанилүүлүгүнө көңүл бургула. Маанилерге өзүңөр сүйлөм түзгүлө. (Бул сөздөр, маанилер, чыгыш теги Х. Карасаевдин «Өздөштүрүлгөн сөздөр» аттуу сөздүгүнөн алынды. "},{"t":"p","h":"Илеп 1 Илаб (ир.) 1) эрин. Абыл Бегайымдын көзүнөн өбөйүн дегенде илебине ачуу жаш тийди. (К. Ж.) 2) этме кашат, жээк. Буркулдаган чоң дайра, илебинен ашыптыр. («С»)"},{"t":"p","h":"Илеп П (ир.) жалын, ысык, тап. Илебине нан бышып турган кези. (Ыл.)"},{"t":"p","h":"Жам Г {ар.) чогуу, жалпы, бардык. Жакын көрдүң байларды, Жам букара бирикти, Таба албассың айлаңды. (Т.)"},{"t":"p","h":"Жам П {(ар.) деңиз, дарыя, суу. Отко-жамга түшүп деген сөз айкашында гана жолугат."},{"t":"p","h":"Жам Ш (ир.) 1) түштүк диалектиде кир жуугуч чылапчын; 2) чөйчөк, бокал. Сары алтындан жам кесе."},{"t":"p","h":"Манги 1 Баңги (ир.) нашаа чегүүчү, нашаачы. Жети таз езу маңги таз, Акылы жок аңги таз. (Т. М.)"},{"t":"p","h":"Манги П (ар.) диний, түбөлүк, баки, таптакыр. ПТайтан манги тозокто калган имиш."},{"t":"p","h":"Сооп Г собой Гар.) диний, жанга аралжы боло турган иш, тиги дүйнөдө жанга аралжы болучу иш. Сообуңду өзүң ал, Султаным Чубак келатат. («М»)"},{"t":"p","h":"Сооп П собой (ар.) адилет, туура. Таяк жегениң сага сооп болуптур."},{"t":"p","h":"73. Кыргыз тилинин омонимдер, түшүндүрмө сездуктөрүнөн бута, жан, жен, карк, кары, түндүк сөздөрүнүн омоним маанилерин дептериңерге көчүрүп жазып, түрлөрүнө карата ажыраткыла."},{"t":"p","h":"74. Тексттеги сөздөрдүн омоним түгөйлөрүн сөздүктөрдөн таап, өзүңөргө сөздүк түзгүлө (кара менен басылган уңгу сөздөрдү карагыла)."},{"t":"p","h":"<span class=\"pg\" data-n=\"105\">105<\/span>Жар ташка сүйөнүп тура бериптирмин, шылкыйып артка тарттым. Жыгылып жаткан оюнчук машинеге келдим. Денгелектеру көктү карап, оодарылып жатат. Көзүмөн жаш чыгып кетти. Мына! Баары бүттү! – деп, чоң мащицем менен муңдашып, капотунан сыладым. Мотордун ысык деми бетке урду. Уулум менен эң акыркы жолукканымдын жалгыз күбөсү ушу жансыз машине да мага азыр жакын көрүндү... (Ч. А.)"},{"t":"p","h":"75. Ыр саптарындагы белгиленген сөздөрдүн етме маанилүүлүгүн, образдуулугун айтып бергиле. Таш, жар сөздөрүнүн омонимдик маанилерин, түгөйлөрүн белгилеп, мисал түзгүлө."},{"t":"p","h":"Ысык-Көл канча булак, канча өзөн"},{"t":"v","l":["куюп жатат, куюп жатат шаркырап.","Ошондо да ашып-ташпай мелтиреп,","уюп жатат ал чыдап!","Мен – мел булак, көл табалбай тызылдап,","жарга урунган, ташка урунган нук издеп,","Аттиң, сенин жүрөгүң"]},{"t":"p","h":"Ошол көлдөй туруп берсе «Куюл» – деп. (Т. Мук.) 76. Төмөнкү сөздөрдүн маанисин ажыраткыла. Сөздүн кандай маанилерин түзөт белгилегиле, мисал келтиргиле."},{"t":"p","h":"карта 1"},{"t":"v","l":["карта П","ток 1","ток П","сөгүш 1","сөгүш П","сөгүш Ш","тик ","тик П","тик Ш","бак 1","бак П","бак Ш","жээк 1","жээк П","жаэк Ш","так 1","так П","так Ш"]},{"t":"p","h":"<span class=\"pg\" data-n=\"106\">106<\/span>&amp; 97. СИНОНИМ, АНЫН ТҮРЛӨРҮ,"}],"sub":[{"title":"Салыштырып көргүлө:","b":13}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[99,106]},{"title":"ПАЙДА БОЛУУ ЖОЛДОРУ","blocks":[{"t":"h3","h":"ПАЙДА БОЛУУ ЖОЛДОРУ"},{"t":"p","h":"Бизди курчап турган чөйрөдөгү окшош, типтеш заттар, кубулуштар, окуялар, кыймыл-аракеттер бирдей же жакын маанилеш сөздөр менен аталат. Эгерде маанилеш, тектеш сөздөр полисемия деп аталса, айтылышы боюнча айырмаланган, жакын маанилеш сөздөр синанимдер деп аталат."},{"t":"p","h":"М исал ы: жорук, кылык, жоро, жосун, жендем, ийкем, шык, эп, ык, талант."},{"t":"p","h":"Синонимдер көркем каражат катары стилдик максатта пайда болот. Анткени бирдей түшүнүктөрдү кайра-кайра бир эле сөз менен айта берсе, кептин мааниси супсак, жагымсыз туюлат, ошондуктан аларды улам башка бир сөз менен атап, пикир алышкан учурда ийкемдүү, коозураак сезилет. Ошондой болсо да синонимдердин алгачкы туюмду атоону берген түпкү маанилүү сөзү учурайт, аны синонимдин доминанты дейбиз, т. а., басым кылуучу, башкы маани деген түшүнүктү берет."},{"t":"p","h":"М и сал ы: каала сөзүн алсак, ал доминант болот да, каала, сама, тиле, кусе, эңсе, көксө деген синонимдер синонимдик уяны түзөт."},{"t":"p","h":"Синонимдеш келген сөздөрдүн жалпы жыйындысы уя деп аталат, алардын ичиндеги өтө жакын маанилеш сөздөр

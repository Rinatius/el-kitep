<style>/* Mobile textbook reader. No external fonts or libraries: everything works offline. */

}
[data-theme="sepia"] { --bg: #f5ecd9; --fg: #4a3b2a; --muted: #8a7458; --line: #e0d2b4; --panel: #ece0c6; --accent: #9a5b13; }
[data-theme="dark"]  { --bg: #111315; --fg: #d8d8d8; --muted: #8c8c8c; --line: #2a2d31; --panel: #1b1e21; --accent: #6ea8ff; --accent-fg: #0b0b0b; }
[data-theme="contrast"] { --bg: #000000; --fg: #ffffff; --muted: #c8c8c8; --line: #444; --panel: #151515; --accent: #ffd400; --accent-fg: #000; }
[data-font="sans"] { --font: Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 16px/1.4 Roboto, "Noto Sans", Arial, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

/* ---------- Library ---------- */
.lib { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lib h1 { font-size: 22px; margin: 8px 0 4px; }
.lib .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }

.school { display: flex; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.school button { flex: 1; min-height: 44px; padding: 0 10px; font-size: 15px; background: var(--panel); }
.school button + button { border-left: 1px solid var(--line); }
.school button.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.my-link { flex: 0 0 auto; font-weight: 600; min-height: 40px; padding: 0 12px; font-size: 14px; }
.grade { margin-bottom: 10px; }
.grade-h { display: flex; width: 100%; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 18px; font-weight: 600; text-align: left; }
.grade-h::after { content: '›'; font-size: 24px; color: var(--muted); margin-left: 10px; transition: transform .15s; }
.grade.open .grade-h::after { transform: rotate(90deg); }
.grade-h .n { margin-left: auto; font-size: 14px; font-weight: 400; color: var(--muted); }
.grade-b { padding: 0 2px; }
.grade-t { font-size: 20px; margin: 18px 0 0; }
.subj { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.bk { border-bottom: 1px solid var(--line); padding: 4px 0 12px; }
.bk:last-child { border-bottom: 0; }
.bk-t { font-size: 17px; font-weight: 600; }
.bk-s { font-size: 14px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bk-m { color: var(--muted); font-size: 13px; margin: 3px 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: .5; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.bk-h { display: flex; align-items: flex-start; gap: 4px; }
.bk-h .bk-t { flex: 1; padding-top: 10px; }
.bk .row { gap: 4px; }
.bk .row .btn { min-height: 40px; padding: 0 18px; font-size: 14px; margin-right: 8px; }
.bk .icon { color: var(--muted); flex: 0 0 auto; }
.bk .icon[disabled] { opacity: .5; }
.bk .icon.on { color: var(--accent); }
.bk .star.on svg { fill: currentColor; }
.bk .star.on { color: #e3a008; }
.share-opts { display: flex; flex-direction: column; gap: 10px; }
.share-opts .note { margin-top: 0; }
.sheet h3 .icon { flex: 0 0 auto; }

/* ---------- Reader ---------- */
.reader { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; user-select: text; }
.viewport { position: absolute; left: 0; right: 0; top: 0; bottom: var(--foot-h); overflow: hidden; }
.flow {
  height: 100%; column-fill: auto; padding: 20px 0 12px;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  will-change: transform; transform: translate3d(0,0,0);
  hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
}
.flow.anim { transition: transform .25s ease-out; }
.flow p { margin: 0 0 .15em; text-indent: 1.4em; text-align: left; }
.flow p.ni { text-indent: 0; }
.flow h1, .flow h2, .flow h3 { font-family: Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.25; break-after: avoid; page-break-after: avoid; }
.flow h1 { font-size: 1.35em; margin: .2em 0 .8em; text-align: center; }
.flow h2 { font-size: 1.15em; margin: 1.1em 0 .5em; }
.flow h3 { font-size: 1.0em; margin: 1em 0 .4em; }
.flow .verse { margin: .6em 0 .8em 1em; break-inside: auto; }
.flow .verse div { text-indent: -1em; padding-left: 1em; text-align: left; }
.flow .verse .gap { height: .7em; }
.flow figure { margin: .8em 0; text-align: center; break-inside: avoid; page-break-inside: avoid; }
.flow figure img { max-width: 100%; height: auto; border-radius: 4px; background: var(--panel); }
.flow figcaption { font-size: .8em; color: var(--muted); margin-top: .3em; }
.flow .box { border-left: 3px solid var(--accent); padding: .1em 0 .1em .7em; margin: .7em 0; }
.flow .pg { font: 11px/1 Roboto, Arial, sans-serif; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 4px; margin: 0 3px; vertical-align: 2px; text-indent: 0; white-space: nowrap; user-select: none; }
.flow .end { height: 1px; }
.flow .endnote { text-align: center; color: var(--muted); font-size: .8em; margin-top: 2em; font-family: Roboto, Arial, sans-serif; }
[data-theme="dark"] .flow img, [data-theme="contrast"] .flow img { filter: brightness(.9); }

.foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot-h); display: flex; align-items: center;
  justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.foot .t { overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }

.bar { position: absolute; left: 0; right: 0; background: var(--panel); border-color: var(--line); z-index: 5;
  transition: transform .2s; display: flex; align-items: center; }
.bar.top { top: 0; height: var(--bar-h); border-bottom: 1px solid var(--line); transform: translateY(-100%); padding: 0 4px; }
.bar.bottom { bottom: 0; border-top: 1px solid var(--line); transform: translateY(100%); padding: 10px 16px 14px; flex-direction: column; align-items: stretch; gap: 6px; }
.reader.ui .bar { transform: none; }
.bar .title { flex: 1; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.bar .info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* ---------- Sheets (TOC, settings) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85%; overflow: auto; background: var(--bg);
  border-radius: 16px 16px 0 0; z-index: 11; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
.sheet h3 { margin: 10px 0 12px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.toc a { display: block; padding: 11px 4px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 15px; }
.toc a.sub { padding-left: 20px; font-size: 14px; color: var(--muted); }
.toc a.cur { color: var(--accent); font-weight: 600; }
.set { margin: 14px 0; }
.set label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; }
.seg button.on { border: 2px solid var(--accent); font-weight: 600; }
.swatch[data-v="light"] { background: #fff; color: #1b1b1b; }
.swatch[data-v="sepia"] { background: #f5ecd9; color: #4a3b2a; }
.swatch[data-v="dark"] { background: #111315; color: #d8d8d8; }
.swatch[data-v="contrast"] { background: #000; color: var(--accent-fg); }
.goto { display: flex; gap: 8px; }
.goto input { flex: 1; min-height: 44px; font-size: 16px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px;
  border-radius: 20px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Textbook elements produced by tools/convert_pdf.py ---------- */
.flow .tasks, .flow .gloss { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45;

.flow details.ans { margin: .3em 0 .8em; font-size: .9em; }

.flow figure.vec svg { max-width: 100%; height: auto; display: inline-block; background: #fff; border-radius: 4px; cursor: zoom-in; }

.flow .it { display: inline-block; max-width: 100%; margin-right: .9em; text-indent: 0; }

 Өз оюнарды билдиргиле."},{"t":"v","l":["1. Илим менен билимге көпүрө – тил,","Көкөлөткөн адамды тили деп бил.","Ж. Баласагын.","","2. Келбесе сөз сүйлөөгө кызыл тилиң,","Кайдан болот азыркы толгон билим!","Сөз сүйлөп, сөздөн сөзгө жетпеген сон,","Дүйнөнүн биз билмекпиз кайсы бирин?","А. Токомбаев.","","3. Тилине кулдук кылам, энем, атам!","Кечиргин, мен тараптан болсо катам.","Сен сүйгөн, сен сүйлөгөн ушул тилде,","Кубултуп, безеп ырдап келе жатам.","А. Токтомушев.","","4. Сөзү жоголгон журттун өзү жоголот.","А. Байтурсунов."]},{"t":"p","h":"2. Текстти көркөм окугула. Андагы негизги ой эмне жөнүндө? Текстте сөздүн кереметтүү касиети жөнүндө эмнелер айтылды? Сенин оюн кандай?"},{"t":"h3","h":"СӨЗ ЖӨНҮНДӨ ДАСТАН"},{"t":"p","h":"Сөз – адамдын маданияты. Адамды адам менен байланыштырган – сөз. Сөз – акылман насаатчы, мыкты билим. Эл билген улуу эмес, сөз билген улуу. Ошон үчүн элибиз: – Жылуу сөзгө жылан ийнинен чыгат, – деп айтышкан. Демек, сөз – баарынын башаты."},{"t":"p","h":"– Сөз болбосо, эненин балага болгон мээрими кантип төгүлмөк. Атанын акылы кайдан айтылмак?! Сүйгөн жардын жылмаюусу да, көз жашы да – сөз. Аалам кандай чексиз болсо, сөз да андан кем эмес."},{"t":"p","h":"Сөз билүүнүн өзү да улуу керемет! Ошон үчүн сөз үйрөнөлү! (С. Р.)"},{"t":"h3","h":"<span class=\"pg\" data-n=\"4\">4<\/span>&amp; 1. СӨЗ АЙКАШЫ"},{"t":"p","h":"З. Окугула. Сөз айкашындагы негизги жана багынынкы сөздү тапкыла. Бул сөздөр бири-бири менен кандайча байланышат?"},{"t":"p","h":"Терен! билим, сочинение жазуу, акырын айтуу, мелдешке чыгуу, жолдошторго кезигуу', алты окуучу, мектептен билим алуу, асмандагы жылдыздар?, лыжа менен жүрүү, айылдаштар? менен кезигүү, ашуу аркылуу баруу, алмалуу бак, кыраан бүркүт, эне тилди үйрөнүү, эненин мээрими, бийиктиктен секирүү, айылдан кезигишүү, кара кылды как жарган*, ак тандай акын."},{"t":"p","h":"4. Атоочтук жана этиштик сөз айкаштарын тапкыла. Негизги сөздү аныктагыла, ал кайсы сөз түркүмүнөн болду? Сөз айкашынын түзүлүшү кандай?"},{"t":"p","h":"Кырааты менен сүйлөө, жасалма жибек, жакшы адаттарды калыптандыруу, жайлоодон түшүү, жайлоонун гүлү, башына чөп сындыруу, данкы таш жаруу, кара чыйырчыкка уя салуу, кара сур келин, кара көз кыз, үйүр-үйүр жылкы, үйдөгүлөрдүн экөө, жүгөрүдөй сапсары, аскадай бийик, алардын баары, суудан кургак чыгуу, эт менен челдин ортосунда, ырдагандардын ар бири, накыл сөз, жасап сүйлөө, жагалмайдай сызуу, кой чарбасын өстүрүү."},{"t":"p","h":"5. Сөз менен сөз айкашын, сөз айкашы менен сүйлөмдү салыштыргыла. Алардын айырмачылыгын түшүндүргүлө."},{"t":"p","h":"1. Күмбөз – Манастын күмбөзү. – Биз Манастын күмбөзүн көрдүк. 2. Жер – туулуп-өскөн жер. – Туулуп өскөн жеримди сагындым. 8. Жардам берүү – ата-энеге жардам берүү. – Ата-энеге жардам бердик. 4. Аңгемелешүү – Ата мекен жөнүндө аңгемелештик. 5. Көз – ач көз. – Ач көз дүйнөгө тойбойт."},{"t":"p","h":"6. Бото – ботодой боздоо. – Ал ботодой боздоду. Тил- тили таттуу. Тили таттуу жаш бала сүйлөп берди жай гана."},{"t":"p","h":"6. Сөз айкашын катыштырып, ар бирине бирден сүйлөм түзгүлө. Сүйлөм эмнеден түзүлөт? Сөз айкашы менен сүйлөмдүн айырмасы эмнеде? Түшүндүргүлө."},{"t":"p","h":"Ак бата алуу, акактай таза тилек, деңиздей толкуу, жогорку окуу жайына баруу, илимий китепкана, көздөн кайым болуу, көзү ала чакмак болуу, көзүнүн агы менен тен айлануу, балдан таттуу, алмаздан катуу, келаткандардын бирөө."},{"t":"p","h":"7. Сөз айкашындагы байланыштын жолдорун (ыкташуу, таандык байланыш, башкаруу) аныктагыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"5\">5<\/span>Адептүү бала, ажырагыс достук?, жазуучулар менен жолугушуу?, абайлап сүйлөө, аскердик бөлүк, тилекке жетүү, балык кармоо, бейкуттукта жашоо, кырсыктан сактануу, гүл өстүрүү, ата мекендин топурагы, жакшылыктын белгиси, илимий даража, тоонун суусу."},{"t":"v","l":["Улгу: Адептүү бала","кандай?","","ыкташуу","адептуу","х","бала"]},{"t":"p","h":"8. Кочургуле. Сез айкашына талдоо жургузгуле: а) негизги жана багынынкы сөздү көрсөтүү; б) сөз айкашынын кайсы туру (атоочтук, этиштик); в) негизги жана багыныңкы сөздөрдүн байланышуу жолдорун аныктоо; д) алар кайсы сөз түркүмүнөн экенин."},{"t":"p","h":"Жогорку билим, курбуларымдын үчөө, анардай кыпкызыл, каада-салтты үйрөнүү, карыны сыйлоо, биринчи учурашуу, жанылбай сүйлөө, учурашкандардын экөө, айдан ачык, кабагы бүркөлүү, комуз чертүү, кыякчынын ар бири, кызыл гүл."},{"t":"p","h":"9. Окугула. Сөз менен сөз айкашынын айырмасын түшүндүргүлө."},{"t":"p","h":"Бака жалбырак – бака жалбырак жыйноо, ачык-айрым – ачык-айрым киши, көл – көлгө түшүү, жалбыз – жалбыздын жыты, үчүнчү – үчүнчү беттешүү, залкар – залкар жазуучу, оюн – оюнга баруу, уч – үч киши, сабак – мугалимдин сабагы, түзсүз – түзсүз көл, тунук – тунук булак, таттуу – таттуу алма."}],"sub":[{"title":"СӨЗ ЖӨНҮНДӨ ДАСТАН","b":4},{"title":"&amp; 1. СӨЗ АЙКАШЫ","b":8}],"pages":[3,5]},{"title":"§2. ЖӨНӨКӨЙ СҮЙЛӨМДҮН ТҮРЛӨРҮ","blocks":[{"t":"h3","h":"§2. ЖӨНӨКӨЙ СҮЙЛӨМДҮН ТҮРЛӨРҮ"},{"t":"p","h":"10. Окугула. Айтылыш максаты жана грамматикалык түзүлүшү боюнча кандай сүйлөмдөр бар? Сүйлөмдүн баш мүчөлөрүн тапкыла. Эмне үчүн ээ менен баяндооч сүйлөмдүн негизин түзөт?"},{"t":"p","h":"1. Бостон карышкырды өзү да көрдү. Ал желе-жортуп кетип бара жаткан экен. Жалына арта салынган бала өкүрүп-бакырып ыйлап баратат. Бостон тамагы айрылганча бакырып, артында чуркап баратты:"},{"t":"p","h":"– Ташта, Акбара! Ташта баланы! Экинчи бөрү аттууга тийбейин! (Ч. А.) 2. Ал таң калгандай балдарга карады:"},{"t":"v","l":["– Силерге ким керек, балдар?","– Эже, уруксат этиниз? Биз агайга келдик. (Т. С.)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"6\">6<\/span>11. Сүйлөм мүчөлөрү боюнча талдоо жүргүзүп, төмөнкү суроолорго жооп бергиле; а) баш мүчөлөрү толук катышса, ал кандай сүйлөм болот; б) баяндоочко айкындоочтордун ичинен кайсылар башкарылат; в) башкаруу байланышы деген эмне?"},{"t":"p","h":"1. Туйгундун экинчи туру – тунжур. Бул да – куштун кырааны. Сырткы жүндөрү, канат-куйруктары боз ала келет. Ылаачындар кара чаар, кызыл чаар, көк чаар түстө кездешет. Ылаачын ителгиден да учкул. («КБ») 2. Агай, биз айылдан келдик. Биздин айылга быйыл элүү жыл толот. Эл-журт айылды Өз эмгектери менен гүлдөттү. Заңгыраган сулуу мектеп курулду. Бак-дарактар отургузулган. Жыйырма кишилик оорукана да бар."},{"t":"p","h":"Ошентип, айылыбыз өсүп-өнүгүп баратат. («А»)"},{"t":"p","h":"12. Окугула. Сүйлөмдөрдүн грамматикалык түзүлүшүн аныктагыла. Жөнөкөй сүйлөмдүн кандай түрлөрү бар?"},{"t":"p","h":"1. Каныбектин кызыл ала болуп турганын көргөндө Анархан, ээги-ээгине тийбей, ыйлап жиберди. (К. Ж.) 2. Бурмаке бөкчөндөп калтыраган арык колу менен ооруларга суу берип жүрөт. (М. Э.) Эл ичи – алтын бешик. Бир көргөн – билиш. Эки көргөн? – тааныш (Мак.) 4. Тил – ар улуттун руханий күзгүсү. Тилсиз улут болбойт. (Ч. А.) 5. Кыш. Суук катуу. Жол жүрүп баратабыз."},{"t":"p","h":"13. Окугула. Сүйлөмдөрдүн аягына кайсы тыныш белгиси коюлат? Эмне үчүн? Сүйлөмдөрдүн интонациялык айырмачылыктары кандай?"},{"t":"p","h":"Душманымды эзелде кечирбейм // Бирок заманыма кек санаган жерим жок // Антсе да, согушта доом көп // Атылган ок, төгүлгөн кан тарыхтын эсебинде // Ал эми адамдардын бүлүнгөн өмүрүчү // Аны тарыхтын кайсы бетине жазабыз // Ал үчүн ким жооп берет // Алимандын тагдырын эстегенде ичим күйүп чок болот // Анын убал-сообу кимде // Кайран келиним // Гүл сүйгөн келиним // (Ч.А.)"},{"t":"p","h":"14. Көчүргүлө. Сүйлөм мүчөлөрү боюнча талдоо жүргүзүп, эки жана бир тутумдуу жөнөкөй сүйлөмдүн түрлөрүн аныктагыла. Алардын түзүлүшү кандай болот?"},{"t":"p","h":"1. Түз сүйлөп, чынчыл болгун. (Ж. Баласагын) 2. Айкөл Манас кабылан чачылган элди жыйнаган. («Манас») 3. Жай айы... Ала-Башка бара жатабыз. Айлана тыптынч. Алыстан Чон-Тер көрүнөт! («КБ») 4. – Таятам экөөбүз сени абдан жакшы көрөбүз, мүйүздүү Бугу эне. – Билем. (Ч. А.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"7\">7<\/span>15. Окугула. Жөнөкөй сүйлөмдүн түрлөрүн аныктагыла. Анда сүйлөмдүн кайсы мүчөлөрү катышты?"},{"t":"h3","h":"ӨМҮРДҮН БАШАТЫ – ЭНЕ"},{"t":"p","h":"Эне... Кандай кереметтүү сөз! Жашоодо туу туткан адамым – менин энем. Энемде бир касиет бар эле. Кишинин назарын сындырганын ушунча болуп көргөн жокмун. Бир нерсени кыйытып жумшак айтчу."},{"t":"p","h":"Энемдин көтөрүмдүүлүгүнө таң калам. Көрсө, бул балдарынын бактысы үчүн кылган аракети турбайбы! Ал киши үчүн адам көңүлүнөн өткөн улук нерсе жок болсо керек. («Асылзат» гезити)"}],"sub":[{"title":"ӨМҮРДҮН БАШАТЫ – ЭНЕ","b":15}],"pages":[6,7]},{"title":"§ 3. ТЕКСТ ЖАНА КЕП ЖӨНҮНДӨГҮ МААЛЫМАТТАРДЫ ЖАЛПЫЛОО","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"8\">8<\/span>БАЙЛАНЫШТУУ КЕП"},{"t":"h3","h":"§ 3. ТЕКСТ ЖАНА КЕП ЖӨНҮНДӨГҮ МААЛЫМАТТАРДЫ ЖАЛПЫЛОО"},{"t":"p","h":"Текст – бул мааниси жана грамматикалык түзүлүшү боюнча өз ара байланышкан бир канча сүйлөм."},{"t":"p","h":"Ар бир тексттин мазмуну, темасы, негизги ою (идеясы) болот."},{"t":"p","h":"Текстке мүнөздүү белгилердин бири – анда бир нерсе жөнүндө кабар берүүнүн аякталып бүткөндүгү. Башкача айтканда, тексттин маанилик бүтүндүгү."},{"t":"p","h":"Дагы бир негизги белгиси – текстти түзүп турган сүйлөмдөрдүн өз ара байланыштуу болушу. Мында сүйлөмдөр тизмектешип айтылып, биринин маанисин экинчиси улантат жана толуктайт. Ушуга байланыштуу тексттин мазмуну, андагы негизги ой ачык-так жана толук баяндалат."},{"t":"p","h":"Тексттеги сүйлөмдөрдү ырааттуу байланыштырууда мурдагы сөз кайталанып келиши мүмкүн, же анын ордуна башка сөздөр, же синонимдер пайдаланылат."},{"t":"p","h":"Ушундай эле, байламта, киринди сөз ж. б. тилдик каражаттардын мааниси чоң."},{"t":"p","h":"Тексттин жалпы мазмунун берүүдө баяндоо, сүрөттөө, ой жүгүртүү сыяктуу кептин ар кандай түрлөрү колдонулат."},{"t":"p","h":"16. БК. Текст деген эмне? Ага мүнөздүү белгилер кайсы? Тексттин темасы жана андагы негизги ой жөнүндө эмне билесинер? Төмөнкү тексттен мисал келтиргиле."},{"t":"h3","h":"ЧОЛПОНБАЙ"},{"t":"p","h":"Ысык-Көлдүн балыгындай сүзүп, Чолпонбай бат эле суунун аркы өйүзүнө чыкты. Дон суусунун бөгөп аккан терендиги, мөндүрдөй жааган душмандын октору Чолпонбайды чочута албады. Эмне кылуу керек? деген ой көз ачып жумганча пайда болду."},{"t":"p","h":"Чолпонбай ДЗОТко! улам жакындап, жети баштуу желмогуздар менен арбашты. Ажал менен бетме-бет кармашты. Уламдан-улам шумдуктуу окуя жакындап келет."},{"t":"p","h":"' ДЗОТ – коргонуу үчүн жыгачтан жасалган жашыруун траншей."},{"t":"p","h":"<span class=\"pg\" data-n=\"9\">9<\/span>Чолпонбай болжогон жерине жетип, биринин артынан бирин зыркыратып, гранаталарды ыргытты. Бирок ийинде жаткан жети баштуу желмогуздар ажалдын огун себе беришти. Дал ошол секундада Чолпонбай чыгыш тарапты бир карады. Алда кайдан аркайып Ала-Тоо карап тургансыйт. Аккуласын алкынтып, баатыр Манас келе жаткансыйт!.."},{"t":"p","h":"Чолпонбай көзүнөн жалынын чыгарып, тишин кычыратып чайнап алды да: «Мына менин ата-бабаларым ким экенин бүт дүйнө билсин, өз көзү менен көрсүн! Айтканынан кайтпаган, ажалдан башын тартпаган, душманга башын ийбеген баатырлардын тукуму – мен!.. Мен дагы элим үчүн, жерим үчүн, ата мекеним үчүн ыйык милдетимди аткарам!.. – деп ДЗОТтун оозун жүрөгү менен басты."},{"t":"p","h":"Бул укмушка карап турган жолдоштору эмес, кара жер да солк эткенсиди. Бул – кимдин уулу? Бул кыргыз элинин уулу! (К. Ж.)"},{"t":"p","h":"17. БК. Текстти талдагыла: а) анын мазмуну темасына шайкеш келеби; б)андагы негизги ой эмне жөнүндө болду; в) текстте кептин кайсы түрү колдонулду;"},{"t":"p","h":"г) сүйлөмдүн кайсы түрлөрү пайдаланылды?"},{"t":"h3","h":"УЛУУ АГАРТУУЧУ"},{"t":"p","h":"Ар бир элдин улуттук сыймыгы болгон илимпоздору, залкар жазуучулары, чыгаан ишмерлери болот эмеспи. Ошондой жылдыздардын бири – Ишеналы Арабай уулу. Деги, агартуу ишине ак эмгек өтөгөн Ишеналы Арабай уулу ким?"},{"t":"img","src":"data:image/webp;base64,UklGRsYeAABXRUJQVlA4ILoeAABwlgGdASpIAp4CPrVUoEs3Orgsq/wp41AWiWluzoxHcpjUH3U+2aVuvPFd5PBP+58YvgR/zPTd/Vue89FRXj5H8fg3/09HHxD/l8b/yH+T//f8Lood+eGvMH//+k/4T/46+xNsMltwaI3Qlew+o9ayI3BK7Di2LVVKqp/KlcAxpPZaWdwRKhmL++xATq+0jlQYzTe7tBbM+V0RyKIx09gQC7jv+S041fVUqxQtCgD8RRsLB41kw/ZReBmNXftrGV6ToWGsVat22q2cCGV

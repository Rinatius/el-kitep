":"224. Окугула. Татаал сүйлөмдүн тутумундагы ойдун натыйжасын жана натыйжанын болушу үчүн шартты билдирген сүйлөмдү көрсөткүлө. Алар өз ара кандайча байланышты?"},{"t":"v","l":["1. Аккан суу! түз кете албайт, сай болбосо?.","Караңгы жарык болбойт, Ай болбосо. (Б. А.)","","2. Капсалан болбой?, жут болбойт,","Кара өзгөй болбой, доо болбойт. (Калыгул)","","3. Табият мага тил алса,","Жайкы таң болуп сөгүлсөм.","Жер-сууну нурга бөлөнтүп,","Күн болуп, жерге төгүлсөм. (А. Т.)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"88\">88<\/span>4. Шагылы болбой, зоо болбойт,"},{"t":"p","h":"Шайыры болбой, эл болбойт. (Калыгул)"},{"t":"p","h":"225. Окугула. Баяндоочтору -са, -бай мүчөлөрү менен аяктаса, ал багынынкы сүйлөмдүн кайсы түрү болот? Аларды туура аныктоодо эмнеге көнүл буруу керек: сүйлөмдүн маанисинеби, же баяндоочтун формасынабы, же кандай суроого жооп бергенинеби?"},{"t":"p","h":"1. Ашуу тез ачылса, бир жумадан кечикпей дыйкандар кош чыгарышат. – Мээнетин катуу болсо!, тапканын таттуу болот. 2. Бала жакшы болсо, ал – элдин баласы. – Билим алсан, урмат-сый алып келет. З. Малчылар тоодон келе жатышса, алдыларынан жаралуу кийик кезигет. – Сен билимди кайдан алсан, мен да? ошол жактан аламын. 4. Тоскоолдуктар болбой, улуу иштер жаралбайт. – Күн ачылбай, кар кетпейт."},{"t":"p","h":"226. -са, -бай мүчөлөрүн этиштик баяндоочко улап, мезгил жана шарттуу багынынкы сүйлөм (ар бирине экиден) түзгүлө. Алардын маанисин бири бирине салыштыргыла. Айырмачылыгын аныктагыла."},{"t":"p","h":"227. Сүйлөмдүн түзүлүшүнө көнүл бургула. Көпчүлүк учурда багынынкы сүйлөм баш сүйлөмдүн кайсы жеринде келет? Сүйлөмдүн маанисин туура аныктоодо эмнеге көнүл буруу керек? Төмөнкүлөр багынынкы сүйлөмдүн кайсы түрү?"},{"t":"p","h":"1. Асмандан балкып күн тийсе,"},{"t":"v","l":["шооласы жерге төгүлөт. (Т.)","2. Талант үйгө келсе, бөлмөнүн ичи","капкарангы.","3. Көздөгөн ишим ордунан чыкпай,","катуу кейидим.","4. Нурбай карыя келбей, биз бул","маселени чече албайбыз?. (К. Б.)"]},{"t":"p","h":"(-се)"},{"t":"p","h":"(-се)"},{"t":"p","h":"(-па+й)"},{"t":"p","h":"(-бе+й)"},{"t":"p","h":"228. Келечектен күткөн ар кандай ой-тилегинер, үмүтүнөр бар. Аларды жүзөгө ашырыш үчүн кандайдыр бир шарт болуш керек. Ошол кырдаалды шарттуу багынынкы сүйлөм аркылуу билдирип, чакан аңгеме жазып келгиле."},{"t":"p","h":"229. Көчүргүлө. Түзүлүшү боюнча кандай сүйлөмдөр бар экендигин аныктагыла. Андан кийин сүйлөм мүчөлөрүнүн астын сызгыла."},{"t":"p","h":"1. Айлана көзгө сайса көрүнгүс?. 2. Дагы эшик ачылды, чон сакал Дмитрий үй-бүлөсү менен келди. (Т. С.) З. Кыйкырган Кыргыл кары бар, кырааны <span class=\"pg\" data-n=\"89\">89<\/span>Бакай кары бар. («Манас».) 4. Эгерде басмачынын шеги билинсе?, ок чыгаргыла. (А. Т.) 5. Эгин өз убагында айдалса, аба ырайы түзүк болсо, түшүм мол болот."},{"t":"p","h":"230. Төмөнкү мүчөлөрдү багыныңкы сүйлөмдүн баяндоочуна улап, багыныңкы байланыштагы татаал сүйлөмдөрдү түзгүлө. Багынынкы сүйлөм баш сүйлөмдөгү ойдун кандай кырдаалын билдирди?"},{"t":"p","h":"1) -са"},{"t":"v","l":["2) -ган+да","3) -ба+й","4) -са деп"]},{"t":"p","h":"У л гү: Жер бай бол+со, эл да бай болот. Шарттуу багынынкы сүйлөм. – Кун чык+са, жер бети кыймылга келет. Мезгил багыныңкы сүйлөм."},{"t":"p","h":"231 БК. Көркөм окугула. Аларда негизги ой эмне жөнүндө болду? Тарбиялык мааниси кандай? Багынынкы сүйлөмдүн кайсы түрү колдонулду?"},{"t":"p","h":"1. Ары жок – күлкүчү,"},{"t":"v","l":["Санаасы жок – уйкучу.","Аюу аманын тилейт,","Акмак жаманын тилейт.","","2. Шатыратып күн жааса,","Жерге жагат дечү эле.","Жакшы чыккан азамат","Элин багат дечү эле.","(Калыгул.)","","3. Ынтымак болсо калкында,","Душманындан тартынба.","Айбаты бар жигиттин","Атагы калат артында. (Т.)","4. Ак мээнеттин пайдасы","Акыры барып ирденет.","Эрте туруп иш кылсаң,","Элден ишин бат бүтөт.","","5. Жаш экенде бир атка","Конгон жигит жакшы экен.","Калың элдин калкасы","Болгон жигит жакшы экен. (Б. А.)","","6. Алтындап үйгө кирсе да,","Асмандан жылдыз аралап,","Ай нурун кармап минсе да,","Бактыга тойбойт адамзат. (А. Т.)"]},{"t":"p","h":"232. Окугула. Татаал сүйлөмдү көрсөткүлө, анын кандай түрлөрү бар? Жөнөкөй сүйлөмдүн айырмасы эмнеде? Мисал келтиргиле."},{"t":"p","h":"1. Кең аалам өзүнүн жылдыздары, Айы, Күнү менен сыймыктанса, Жер шары бийик тоолору, океандары менен сыймыктанат. Ошол сыңары, адамзат өзүнүн асыл адамдары менен сыймыктанат. Алардан жаштар үлгү алышат. Ошон үчүн: «Жакшынын аты өчпөсүн, жалпы журт дайым эстесин."},{"t":"p","h":"<span class=\"pg\" data-n=\"90\">90<\/span>Ай, жылдар учуп өтсө да, арчадай болуп көктөсүн!» – деген ыр саптары жаралса керек. («КТ»)"},{"t":"v","l":["2. Эч кемтик таппайм кымындай,","Эн сейрек чыккан сулуудай.","Эргиткен чөккөн көнүлдү","Эх, чиркин! Кандай сулуу жай! (Б. С.)"]},{"t":"p","h":"233. Окугула. Жөнөкөй жана татаал сүйлөмдөрдү көрсөткүлө, алардын түрлөрүн аныктагыла. Каратма сөз барбы? Анын маанисин түшүндүргүлө."},{"t":"p","h":"Ар кандай ишти сулуу иштеген азаматтар болот эмеспи. Субанкул ошондой болчу! Ал бат эле узап кетчү, мен деле орокко белдүү элем, ошентсе да артта калып калам."},{"t":"p","h":"– Силер ошондо дайым элдин алды болуп келчү элеңер жумушка, Толгонай."},{"t":"p","h":"– Ооба, айланайын дыйкан талаам! Эл тура электе Субанкул экөөбүз ээрчишип кетчүбүз. Биз ээрчишип келе жатканда, дүйнө башкача көрүнүп, башкача сезиле турган. (Ч. А.)"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[88,90]},{"title":"§ 28. КАРАМА-КАРШЫ БАГЫНЫНКЫ СҮЙЛӨМ","blocks":[{"t":"h3","h":"§ 28. КАРАМА-КАРШЫ БАГЫНЫНКЫ СҮЙЛӨМ"},{"t":"h3","h":"Багыныңкы сүйлөмдүн бул түрүндө баш жана багыныңкы сүйлөмдөр"},{"t":"p","h":"бири бирине каршы мааниде колдонулат. Эмне болсо да? Эмне болгону менен? Эмне болгону болбосо? Кантсе д а? деген суроолорго жооп берет."},{"t":"p","h":"Мисалы, Эл уйкуга кирсе да, электр шамы жаркырап күйүп ту: рат. – Эм не болсо да электр шамы жаркырап күйүп турат? – Эл уйкуга кирсе да – карама-каршы багынынкы сүйлөм."},{"t":"p","h":"Багыныңкы сүйлөмдүн баяндоочу төмөнкүдөй мүчөлөр менен аяктайт:"},{"t":"p","h":"1. Шарттуу ынгайдын -са мүчөсү, кээде ага да, дагы, деле байламталары кошулуп айтылат: Кун төбөдөн эчак оосо да, анын ысыгы али кайта элек. (К. Б.)"},{"t":"p","h":"2. -ган түрүндөгү атоочтук мүчөгө менен деген жандооч кошулуп айтылат: Мен көзүмдү жумган менен, өткөн күндөр көз алдымда тартылып турду. (К. Ж.)"},{"t":"p","h":"3. -ба+сын мүчөсү: Кандай кыйынчылык алдыга келбесин, биз аны жеңип чыгабыз. (Т. С.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"91\">91<\/span>234. Окугула. Татаал сүйлөмдүн кандай түрлөрү бар? Багынынкы баш сүйлөмдүн кандай кырдаалын билдирди? Сүйлөмдүн грамматикалык негизин сүйлөмдүн кайсы мүчөлөрү түзөт?"},{"t":"p","h":"1. Жашыныз жаш көрүнсө да“, сөзүңүз көптү көргөн кишиникиндей. Биз илгерки кишилерден болбосок да, күн санап өсүп бара жаткан жаштарданбыз. Демек, сиз менен пикир алышып, тажрыйбаны талкуулашып, баштан өткөн кыйынчылыктарды айтышсак."},{"t":"p","h":"Албетте?, мен өзүмдүн башыман өткөргөн кыйынчылыктарды айтайын. Алар айтууга женил, угууга оор. Менин жашым ушул жылдын күзүндө жыйырма бирге толот. Жашым жаш болсо да, өз башымдан далай кыйынчылыктарды өткөрдүм. Менин? ата-энемдин оокаты жармач болгондуктан, жайлоого чыгууну алар билишкен эмес экен."},{"t":"p","h":"Мен бой тартып калган кезде, атамдын малы жок болсо да, кадырлап салам айтуучулар көбөйө баштады. Ошентип, жуучулар ойдон да келет, кырдан да келет. (К. Ж.)"},{"t":"p","h":"235. Окугула, -са мүчөсү аркылуу байланышкан багынынкы байланыштагы татаал сүйлөмдөрдү тапкыла. Багынынкы баш сүйлөмдүн кандай кырдаалын билдирди? Тен жана багыныңкы байланыштагы татаал сүйлөмдөрдүн айырмасын түшүндүргүлө."},{"t":"p","h":"1. Атадан жакшы туулса, элинин камын көрөр. Атадан жаман туулса, элинин малын жээр. (Мак.) 2. Анча-мынчасы ооздон-оозго өткөн элдик жомок болсо да, биз үчүн анын баары – сүттөн ак чындык. (Ч. А.) 3. Петр Кузьмич тирүү болсо?, ал кишини Сабыр «мөмө тоюна» атайлап чакырат эле. (Т. С.) 4. Пахтаны жакшы баксаныз, ал сиздин акыңызды жебейт. (Т. У.) 5. Мен ыраазымын, эгер мунун чын болсо. (Н. Б.) 6. Мүнүшкөр мыкты таптаса, бүркүттүн көркү алганда. (Мак.)"},{"t":"v","l":["7. Жанында өлүм турса? да,","Жалантып кылыч сунса да,","Жабыгып жүрөк кансырап,","Ирмелбей көзү тунса да,","Үмүткө тойбойт адамзат. (А. Т.)"]},{"t":"p","h":"236. Схема боюнча карама-каршы багыныңкылуу татаал сүйлөм түзгүлө. Жөнөкөй сүйлөмдөрдүн ортосундагы маанилик катышты түшүндүргүлө."},{"t":"v","l":["со да","со дагы","Бол со деле","гон менен","гону менен"]},{"t":"p","h":"<span class=\"pg\" data-n=\"92\">92<\/span>237. Карама-каршы багынынкы сүйлөмдөрдүн баяндоочтору кандай формада түзүлгөнүн жазып көрсөткүлө. Багынынкы сүйлөмдөрдүн айырмачылыгы эмнеде: түзүлүшүндөбү же маанисиндеби?"},{"t":"v","l":["1. Мүнөзү катуу болсо да, ал адилеттүү адам эле.","2. Мүнөзү катуу болсо дагы, ал адилеттүү адам эле.","л. Мүнөзү катуу болсо деле, ал адилеттүү адам эле.. Мүнөзү катуу болгон менен, ал адилеттүү адам эле. Мүнөзү катуу болгону менен, ал адилеттүү адам эле."]},{"t":"p","h":"238. Көчүргүлө. Калтырылып кеткен тыныш белгилерди өз ордуна коюп, анын эмне үчүн коюлганын түшүндүргүлө. Сүйлөмгө грамматикалык түзүлүшү жана сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Сүйлөм мүчөлөрү кайсы сөз түркүмүнөн болду?"},{"t":"p","h":"1. Канча жаным кыйналса кардыгып калбайт добушум. (Т.) 2. Атом менен космостун доору болсо да Дүйшөн сыяктуу биринчи мугалимдер дале биздин катарыбызда. 83. Мен өзүм жүк ташуучу болгонум менен аткара турган милдетим башкача. 4. Чоң-Төрдү булут каптап турганы болбосо аба ырайында өзгөрүү жок. 5. Бекендин сөзү катуу тийсе да Садыр унчукпай тура берди. (Ш. Б.)"},{"t":"p","h":"239. Сүйлөмдүн грамматикалык түзүлүшүн бири бирине салыштыргыла. Татаал сүйлөмдүн түрлөрүн аныктагыла. Алардын ортосунда кандай окшоштуктар бар? Айырмачылыгы эмнеде? Түшүндүргүлө."},{"t":"p","h":"1. Мына эми мен бир топ таж- Мына эми мен бир топ тажрыйбарыйбалуу болдум, ошондо да кээде луу болсом дагы, кээде тарткандарым тарткандарым ойдогудай болбой ка- ойдогудай болбой калат."},{"t":"p","h":"лат."},{"t":"p","h":"2. Бул – адамдын ачуусу келе тур- Бул адамдын ачуусу келе турган ган жорук, бирок Данияр таарынчу жорук болгону менен, Данияр таарынэмес. (Ч. А.)"},{"t":"v","l":["3. Эгерде ким эмгектен көрүнгүсү","чу эмес."]},{"t":"p","h":"Эмгектен көрүнгүм келет, ошонкелсе, ал кыйынчылыктан коркпоого дуктан кыйынчылыктан коркпоймун. тийиш. («КТ»)"},{"t":"p","h":"240. Баш жана багынынкы сүйлөмдөрдү көрсөткүлө. Багынынкы сүйлөмдүн кайсы түрү бар? Багынынкы байланыштагы татаал сүйлөмдү тен байланыштагы татаал сүйлөмдүн маанисинде колдонууга болобу? Эгерде болсо, сүйлөмдү ондоп түзгүлө, алардын ортосундагы айырмачылыкты далилдегиле,"},{"t":"p","h":"<span class=\"pg\" data-n=\"93\">93<\/span>1. Кумурсканын өзү кичине болсо да, кайраты тоо антарат. (Мак.) 2. Ал уктабаса, эне да уктабайт. 3. Кычандын жүрөгүн түпөйүл басканы болбосо, көнүлү сергек. (Ш. Б.) 4. Жемиш бөтөнчө сонун чыкканы менен, Ашымакундун тилеги ордунан чыккан жок. (А. Т.)"},{"t":"p","h":"241. Орун, шарттуу жана карама-каршы багынынкы сүйлөмдөрдүн ар бирине экиден сүйлөм түзгүлө. Алардын грамматикалык түзүлүшүн жана айырмачылыктарын түшүндүргүлө."},{"t":"p","h":"242. Сүйлөмдүн аягына коюлган тыныш белгиге карай текстти көркөм окугула. Тыныш белгилердин эмне үчүн коюлганын түшүндүргүлө. Сүйлөмдө кандай сезимдер көрсөтүлдү?"},{"t":"p","h":"– Башынды өйдө! көтөр, Толгонай. Кайрат кыл."},{"t":"p","h":"– Жарайт, андан башка чарам барбы? Эсиндеби, айланайын тууган жер, ошол күнкү?!"},{"t":"p","h":"– Мен эчтекени унутпаймын, Толгонай. Сенин да баштан өткөргөн тагдырын жүрөгүмдө. Сүйлөй бер, бүгүн кулак сенде."},{"t":"p","h":"– Ох, эмнени айтайын! Бүгүн менин сыйынуу күнүм. Бүгүн менин Субанкулду, Касымды, Майсалбекти, Жайнакты, Алимандарды эстеген күнүм. Мен аларды өлөр-өлгөнчө унутпаймын! Кезеги келгенде Жанболотко түшүндүрүп айтып берем. Эси болсо, түшүнөр... (Ч. А.)"},{"t":"p","h":"248. БК. Тексттин мазмуну менен таанышкыла. Андагы негизги ой эмне жөнүндө болду? Негизги ойду далилдөө үчүн кандай мисалдар колдонулду? Мында жөнөкөй жана татаал сүйлөмдөрдүн кайсы түрлөрү бар? Акылдуулук дегенди сен кандай түшүнөсүн?"},{"t":"h3","h":"АКЫЛ КАРАЧАЧ"},{"t":"p","h":"Өткөн заманда өзү чечен, сөзү бекем Жээренче Чечен деген киши болгон экен. Бир күнү келе жатып, бир топ келин-кыздардын отун көтөрүп келе жатканын көрөт. Ал аңгыча күн жаайт. Ошентип, келин-кыздардын баары музоосун эмизип, отунун таштап, үйүн көздөй чуркап кетишти."},{"t":"p","h":"Бир кыз, музоосун эмизбей кармап, отунун чапаны менен жаап, өзү отундун далдасына отуруп калды. Жээренче Чечен кыздын жанына келип:"},{"t":"p","h":"– Ээ, балам, тиги кыздар жүгүргөн бойдон үйлөрүнө кетти, сен эмне учун отуруп калдың? – деди."},{"t":"p","h":"Кыз: – Ээ, ата, ал кыздардын төрт зыяны бар. Менин бир зыяным, үч пайдам бар, – деди."},{"t":"p","h":"Жээренче Чечен кыздын пайдасын сурап калды:"},{"t":"p","h":"<span class=\"pg\" data-n=\"94\">94<\/span>Кыз: – Музоом эмген жок, отунум кургак калды, өзүм суу болгон жокмун. Бул үч пайдам. Чапаным суу болду, бир зыяным – ушул. Кыздардын музоосу эмди, отуну суу болду, кийими да суу болду. Музоону эмиздин деп, кыздарын энеси урат. Ошентип, качып кеткен кыздардын төрт зыяны бар."},{"t":"p","h":"Бул кыздын айткан сөзүнө Жээренче Чечен ыраазы болду. Ошол убактан ушул күнгө чейин Акыл Карачач деген ат эл оозунда сакталып калган экен. («Жомок»)"}],"sub":[{"title":"АКЫЛ КАРАЧАЧ","b":36}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[91,94]},{"title":"§ 29. СЫПАТ БАГЫНЫҢКЫ СҮЙЛӨМ","blocks":[{"t":"h3","h":"§ 29. СЫПАТ БАГЫНЫҢКЫ СҮЙЛӨМ"},{"t":"p","h":"Сыпат багыныңкы сүйлөм баш сүйлөмдөгү ойдун ар кандай сыпатын билдирет. К а н т и п? К а н д а й ч а? деген суроолорго жооп берет."},{"t":"p","h":"Мисалы, Кулжадай көзү кызарып, болжоосуз күлүк Тайтору болбой чуркап алыптыр. («Семетей») – К а н т и п? – Кулжадай көзү кызарып – сыпат багынынкы сүйлөм."},{"t":"p","h":"Багыныңкы сүйлөмдүн баяндоочу төмөнкүдөй мүчөлөр менен аяктайт:"},{"t":"p","h":"1. -ып, -бай: Нурматтын кара чаар өңү сурданып, заардуу сөздөрү чыга баштады. (К. Ж.) К ан т и п? Нурматтын кара чаар өңү сурданып – сыпат багынынкы сүйлөм."},{"t":"p","h":"2. -гансып (ган+сы+ып): Ортобузда эч нерсе болбогонсуп, Данияр мурдагыдай эле бир сырдуу, токтоо. (Ч. А.) – К ан т и п? – Ортобузда эч нерсе болбогонсуп – сыпат багыныңкы сүйлөм."},{"t":"p","h":"244. Окугула. Татаал сүйлөмдүн тутумундагы баш жана багынынкы сүйлөмдөрдү көрсөткүлө. Багынынкы сүйлөм баш сүйлөмдүн кандай кырдаалын билдирди? Кандай суроого жооп берди? Баяндоочу кандай мүчөлөр менен аяктады?"},{"t":"p","h":"Күн тийбес тамда жатамын,"},{"t":"v","l":["Күч кетип, эс ооп, алсырап.","Козголор менде дарман жок,","Кол-бутта кишен шалдырап.","Мурутум-чачым алынбай,","Мусапыр болдум момундай. (Т.)"]},{"t":"p","h":"245. Көчүргүлө. Сыпат багынынкы сүйлөмдөрдү таап, ага сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Ал баш сүйлөм менен кандайча байланышты."},{"t":"p","h":"<span class=\"pg\" data-n=\"95\">95<\/span>1. Зоолору күмүш кымкап жамынгансып, Алай тоолору асман тирейт. (К. Ж.) 2. Өз төшүн өзү жара муштап, эр болбойт. 3. Кубанычы койнуна батпай, Зарыл сыймыктанып келе жатыптыр. (Т.. С.) 4. Эрте айдалган эгиндер сенселип, кеч айдалган айдоолор көк майсандан көйнөк кийгенсип, айдоо аянты көзгө жакшы көрүнөт. (К. Ж.)"},{"t":"p","h":"Ү лг ү: К а н т и п Алай тоолору асман тирейт? – зоолору күмүш кымкап жамынгансып – сыпат багынынкы сүйлөм; э м н е болгонсуп? – жамынгансып -— баяндооч; э м н е л е р и? – Алай тоолору – э;эмне жамынгансып? – кымкап – толуктооч; к а н д а й кымкап? – кумуш – аныктооч; баш сүйлөм менен -гансып мүчөлөрү аркылуу байланышты."},{"t":"p","h":"246. Чакчыл түрмөк катышкан жөнөкөй сүйлөмдү жана сыпат багыныңкы сүйлөмдү өз-өзүнчө ажыраткыла. Салыштыргыла. Алардын ортосунда кандай айырмачылык бар?"},{"t":"p","h":"1. Агасын көрүп?, ини өсөт. Эжесин көрүп, синди өсөт. (Мак.) 2. Кош кубаныч жүрөгүн туйлатып?, Кычан далайга чейин уктаган жок. (Ш. Б.) 3. Жапар, башын көтөрүп?, балдарды карады. —- Көл тынчыйт, толкундары тарап-тарап. (А. О.) 4. Өз ара сүйлөшпөй, кыз-келиндер кызуу иштеп жатышты. – Ар кимиси Өз ара сүйлөшпөй?, кыз-келиндер кызуу иштеп жатышты. 5. Камчыны сүйрөй, жайбаракат бастым. – Муңайып жүрөм Сибирде, бошонор күнүм табылбай. (Т.) 6. Алда кандай бир укмуш болуп жаткандай, айыл ичи ызы-чуу. (К. Ж.) – Жамгыр болбой, дан болбойт. («КБ»)"},{"t":"p","h":"247. Көчүргүлө. Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Ал түзүлүшү боюнча сүйлөмдүн кайсы түрү? -ып мүчөсү менен аяктаган сөз тизмегинин синтаксистик кызматын аныктагыла."},{"t":"p","h":"1. Бектурган, баланы өзүнө тартып, эки бетинен эки өптү. (А. Т.) – Көңүлүм айдай ачылып, жүрөгүм толкуп кубанат. (Р. Ш.) 2. Катуу кыйкырыкты угуп, Бектурган токтой калды. (А. Т.) – Бүткүл аалам кызара түшүп, эн эле зор кочкул жалын асманды көздөй көтөрүлдү. («КТ») Бул күү, делебе козгоп, кайрат берүүдө. – Алыстан зоо жанырып, укмуштуу добуш угулат. («КБ»)"},{"t":"p","h":"248. Көчүргүлө. Сүйлөмдүн мүчөлөрүнүн астын сызып, -ып мүчөсү менен келген сөз тизмегинин синтаксистик кызматын аныктагыла: өзүнчө сүйлөмбү же сүйлөм мүчөсүбү? Түшүндүргүлө."},{"t":"p","h":"1. Көздөрү чырактай жайнап, жүзүнөн нур төгүлөт. Күн, өрттөнгөн немедей кыпкызыл болуп, батууга жакындады. 2. Улуу кубанычы жүрөгүн толкутуп, <span class=\"pg\" data-n=\"96\">96<\/span>Кымкап кары байыркы колун мөмөгө карай созду. (Т. С.) – Ысман, бөбөгүн көкөлөтө көтөрүп, өпкүлөп жиберди. 3. Кыш айы келип, бүткүл жер жүзү аппак. – Ал, арабадан ыргып түшүп, Бектурганга карай чуркады. (А. Т.)"},{"t":"p","h":"Улгу: Көздөрү чырактай жайнап, жүзүнөн нур төгүлөт. – көздөрү чырактай жайнап – сыпат багынынкы сүйлөм; -ып мүчөсү менен аяктады, өзүнө тиешелүү көздөрү деген ээси бар."},{"t":"p","h":"249. Көчүргүлө. Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө, -ыл мүчөсү уланган сөз же сөз тизмеги сүйлөмдүн кайсы мүчөсү болду же өзүнчө сүйлөмбү?"},{"t":"p","h":"1. – Балам, балдар кайда чыгып кетишти? 2. Алачыктын ары жагында тунук суу шылдырап агып жатат. 3. Метрейдин уулун көрүп, Бектурган чочуп кетти. (А. Т.) 4. Кайын ыйлап, тал ыйлап, калын журттун баары ыйлап. («Манас»)"},{"t":"p","h":"250. Окугула. Чакчыл түрмөктү тапкыла, алардын синтаксистик кызматын аныктагыла. Түзүлүшү боюнча кандай сүйлөмдөр бар?"},{"t":"p","h":"1. Түн... Жаратылыштагы нерселердин баары, салкын абага көшүлүп, уйкуда. Акырын басып, Ажар үйдөн чыкты. Ушул кезде, алтын бууга боёлуп, чыгыш жактан Ай көтөрүлдү. (К. Б.) 2. Айтике, көнөчөгүн коё коюп, дубалга сүйөнүп, баланы карап, отура калды. (А. Т.) 3. Майрык, уйпаланган эски тебетейин баса кийип, кара чепкенин ак жоолук менен курчанып, үңүрөйгөн көзүн үлүндөтүп, ичке куркуйгап мойнун көтөрүп, Керездин жанына басып келди. (Ш. Б.) 4. Аккуласын алкынтып, кырк чоросун жулкунтуп, ак асаба кызыл туусун кармап, айгайланган ызы-чуусун салып, Манас баатыр келе жаткансыйт. (К. Ж.)"},{"t":"p","h":"251. Көчүрүп жазып тыныш белгилерин койгула. Эмне үчүн коюлганын түшүндүргүлө? Андан кийин багынынкы сүйлөмдөрдү тапкыла, алар баш сүйлөмдөгү ойдун кандай кырдаалын билдирди?"},{"t":"p","h":"1. Ошентип // кар калың түшсө // кычыраган аяздар болот. 2. Ардактуу балдар // сабактарды жакшы өздөштүрүүгө аракеттенгиле. («ЕБ») 3. Алиман сүйлөп бүткөндө // биз көпкө унчукпай отурдук. (Ч. А.) 4. Каалга шарт ачылып // Сатар кирип келди. 5. Тууган күйдүрүп айтат // душман сүйдүрүп айтат. (Мак.) 6. Камка кары // эки колун артына алып // козголбой отура берди. (Т. С.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"97\">97<\/span>252. Кайсы сүйлөмдө -ып формасындагы сөз тизмеги, негизги кыймыл-аракетти айкындап, бышыктооч; кайсынысында баш сүйлөмдү айкындап, сыпат багынынкы сүйлөм болду?"},{"t":"p","h":"1. Койнун ачып, кучагын жайып, Боом капчыгайы көрүндү. – Жапар менен Жамийла келип, Уулжандын санаасы тынды. (К. Б.) 2. Алимандын мамилесине ыраазы болуп, ичим жылыды. – Касымдын комбайны эгин чаап, талаа дан жыттанып жатты. (Ч.А.) 3. Колун өйдө көтөрүп, Манап ордунан турду. – Гүлдөр жайнап, булбул сайрап турган убак. («КМ»)"},{"t":"p","h":"253. Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Түзүлүшү боюнча булар кандай сүйлөмдөр?"},{"t":"p","h":"1. Дуу жарылган күлкүгө суу да дуу жарылып, күмүштөй чачырандылар бүркүлдү. Уялганына чыдабай, балдар кыпкызыл болуп кетишти. («КБ») 2. Бектурган, суудан өтүүгө даярданып, этегин белине кыстарып, таягын алып, кечүүнүн мандайына барды. (А. Т.) 3. Баланы колуна алып, Айымбүбү эне отура калды. («А»)"},{"t":"p","h":"254. БК. Тексттин мазмуну менен таанышкыла. Андан кийин текстте баяндалган негизги ойду аныктагыла. Тилдик каражаттардын колдонулушун талдагыла: Сүйлөмдүн кайсы түрлөрү бар? Алар өз ара кандайча байланышты? Текст кайсы чыгармадан? Анын автору ким?"},{"t":"h3","h":"АТАДАН КАЛГАН ТУЯК"},{"t":"p","h":"Күндөрдүн биринде айылга көчмө кино келип калса болобу. Аны элден мурда Абалбек көрүп, өпкөсү жарылып кете жаздады: «Кино келди!.. Кино келди!» – деп кыркынчыларга кабар салды."},{"t":"p","h":"Кино согуш жөнүндө экен. Бомбалар жарылып, замбиректер тарсылдап, кара жер сапырылып жатты... Мына согуш деп ушуну айт! Мына согуш десе!"},{"t":"p","h":"Замбирекчилер жети-сегиз адам экен. Арасында кебете-иреңи кыргызга окшогон бирөө экранда улам көрсөтүлүп, көзгө жылуу учурай берди. «Атам экен» деп бала эч убакта ойлобос беле, мындай ишти капарына да албас беле... Баарын энеси жасады."},{"t":"p","h":"– Тетиги сенин атан, – деп койду ал бир убакта, баланын кулагына шыбырап. Ушундан баштап жанагы замбирекчи Абалбектин атасы болду да калды."},{"t":"p","h":"Замбиректин жанында эки эле киши калды: Абалбектин атасы, дагы бир жоокер. Абалбектин атасы тенселип, жерден зорго турду. Жакындап <span class=\"pg\" data-n=\"98\">98<\/span>келе жаткан танканы көздөй, гранатаны колго алып, ал тайманбай бет алды. Гранатаны шилтөөгө камданып, бир оокумга, кулачын кере, туруп калды. Дал ошол учурда пулемёттун оозунан ок төгүлүп, Абалбектин атасы кыйган теректей сулады."},{"t":"p","h":"Бир маалда кимдир бирөөнүн кыйкырыгы тынчтыкты жарды:"},{"t":"p","h":"– Балдар!.. Менин! атамды көрдүнөрбү?! Ал менин атам болчу! Кердунербу, менин? атам!.."},{"t":"p","h":"Кишилер, эмне болуп кеткенин андабай, айран-таң болушту. Өмүрү атасын көрбөгөн балага бул учур анын атасы бар экенин далилдеген окуя эле. Ошондо балдардын бири чындыкты бетке айтты:"},{"t":"p","h":"– Ал сенин атаң эмес. Эмнеге кыйкырасын? Ал – артист."},{"t":"p","h":"Иштин жайын билген эстүү-баштуулар атасыз баланын жасап алган таттуу да, ачуу да алданмасын бүлдүргүлөрү келишпеди. (Ч. А.)"}],"sub":[{"title":"АТАДАН КАЛГАН ТУЯК","b":30}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[95,98]},{"title":"$ ЗО. САЛЫШТЫРМА БАГЫНЫҢКЫ СҮЙЛӨМ","blocks":[{"t":"h3","h":"$ ЗО. САЛЫШТЫРМА БАГЫНЫҢКЫ СҮЙЛӨМ"},{"t":"p","h":"Салыштырма багынынкы сүйлөмдө баш сүйлөмдөгү ой салыштыруу маанисинде колдонулат.Кандай? Эмне болгон сыяктуу? Эмне болгондон бетер? деген суроолорго жооп берет."},{"t":"p","h":"Мисалы, Килем төшөп койгондой, жер бети түркүн гүлдөр менен кооздолгон. – К а н д а й? – Килем төшөп койгондой – салыштырма багыныңкы сүйлөм."},{"t":"p","h":"Багыныңкы сүйлөмдүн баяндоочу төмөнкүдөй мүчөлөрдөн түзүлөт:"},{"t":"p","h":"1. Атоочтуктун -ган формасына -дай мүчөсү уланат же жандоочтор (сыңары, сыяктуу, бетер, шекилдүү ж. б.) кошулуп айтылат: Майрам болуп жаткан сыяктуу, туш-туштан музыка жаңырат."},{"t":"p","h":"2. Шарттуу ынгайдын -са мүчөсү жана кандай деген сөз, ал эми баш сүйлөмгө ошондой деген сөз кошулуп айтылат: Уста кандай болсо, устаттык ошондой болот. (Мак.)"},{"t":"p","h":"255. Окугула. Багынынкы байланыштагы татаал сүйлөмдү көрсөткүлө. Анын тутумунда салыштырма багынынкы сүйлөм барбы? Ал баш сүйлөмдүн кандай кырдаалын билдирди."},{"t":"p","h":"1. Ийилип турган розанын гүлү кандай болсо, бул келин да ошондой. Ачык-айрымдыгы түштүктүн аялдарына окшобосо да, кыйылган эки каштын ортосундагы билинер-билинбес болуп салынган кал бул келиндин түштүк аялдарынан экендигине күбө болуп турат. (К. Ж.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"99\">99<\/span>2. Жаш жарын бозой тоскондой,"},{"t":"p","h":"Жадырап аппак тан атты. (Ж. Б.) 3. Улууларды кандай сыйласан, кичүүлөрдөн ошондой сый көрөсүн. 4. Атаэнене кандай мамиле жасасан, балдарындан ошондой мамилени күтө бер."},{"t":"p","h":"5. Энеден сүт ич, акылмандан акыл ич. (Мак.)"},{"t":"p","h":"256. Баяндоочу -са мүчөсү менен аяктагандар багынынкы сүйлөмдүн кайсы түрү? Мааниси жана грамматикалык түзүлүшү боюнча аларды бири бирине салыштыргыла. Кандай айырмачылыгы бар?"},{"t":"p","h":"1. Табигат, тагдыр тил алса, мөл булак болуп ойносом. (А. Т.) 2. Адам канчалык акылдуу болсо, башкалардын жакшы жагын ошончолук тез көрүүгө тийиш. 3. Жолдошун жаман болсо, алыс жолго түн катпа. (Мак.) 4. Биз дагы, эгин сээп, кырман бастырсак, бак-таалай деген – ошол."},{"t":"v","l":["5. Күн болбосо?, Жер да болбос, Ай болбос.","Ай болбосо?, турмуш көркү шай болбос. (А. О.)"]},{"t":"p","h":"6. Биз шаарга келсек, шаардын ичи майрамдагыдай кооздолгон. 7. Жаман жолдоштун таасири кандай болсо, жаман китептин таасири ошондой. («А»)"},{"t":"p","h":"257. Окугула. Салыштырма багынынкы сүйлөмдүн баяндоочу кандай формада түзүлгөнүн эсинерде сактагыла, алардын мааниси өзгөрдүбү? Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө."},{"t":"v","l":["Күн жылуулугун чачкандай, жер бети көшүлөт.","Күн жылуулугун чачкандан бетер, жер бети көшүлөт.","Күн жылуулугун чачкан шекилдүү, жер бети көшүлөт.","Күн жылуулугун чачкан сыяктуу, жер бети көшүлөт.","Күн жылуулугун чачкан сынары, жер бети көшүлөт."]},{"t":"p","h":"258. Өзүңөр жашаган айылдын көрүнүшүнүн бир учурун сүрөттөп жазып келгиле. Сүрөттөөдө салыштырма багынынкы сүйлөмдү колдонууга аракеттенгиле."},{"t":"p","h":"259. Мисалдарга анын грамматикалык түзүлүшү (жөнөкөй сүйлөм жана анын түрлөрү; татаал сүйлөм жана анын түрлөрү) боюнча талдоо жүргүзгүлө. Багынынкы сүйлөмдүн маанисин аныктагыла."},{"t":"p","h":"1. Кимде-ким зымырык кушту тапса, мен ага байлыгымдын жарымын беремин. 2. Ак пейилдүү азамат адамга кылбайт кыянат. (Т.) 3. Күн жаап тургандай, оттун учкуну жерге жалбырттап түшүп турду. 4. Жолдошу шайыр болсо, жолоочунун кумары канат. (К. Б.) 5. Суунун үстүнө жааган мөндүр кандай болсо, Чолпонбайларга каршы атылган октор так ошондой эле. (К. Ж.) 6. Кыш... Суук катуу. Ак кар... Көк муз. Жол жүрүп баратабыз. («А»)"},{"t":"p","h":"<span class=\"pg\" data-n=\"100\">100<\/span>260. Мааниси жагынан ылайык келүүчү сүйлөмдү ойлоп тапкыла да, көп чекиттин ордуна коюп, багынынкы байланыштагы татаал сүйлөм түзгүлө. Ойлоп тапкан сүйлөмүнөр багынынкы сүйлөмдүн кайсы түрү болду?"},{"t":"p","h":"1. ... Соке абышка туталана түштү. 2. ... Бектурган сүйүнүп кетти. 3З.... душманга моюн суна албайм. 4. ... жанында Бугу эне турат. 5. ... Каныбек издеп кеткен Самсахун да келди."},{"t":"p","h":"261. Сүйлөм мүчөлөрү боюнча талдоо жүргүзүп, татаал сүйлөмдүн кайсы түрү бар экенин жана анын бөлүктөрү жөнөкөйдүн кайсы түрүнөн (эки тутумдуу, бир тутумдуу) түзүлгөнүн түшүндүргүлө."},{"t":"p","h":"1. Жолой Каныбекке акыл айтты: – Каныбек балам, жаш экенсин, айткан сөзүндүн көбү олуттуу. Мен сыяктуу өз башындын камын ойлобо, элдин тагдырын ойло. Кишини кандай сыйласан, алардан ошондой сый көрөсүн. (К. Ж.) 2. Тоого чыккан адам алысты көргөндөй, окуган адам дүйнөнү кен тааныйт. (Т. С.) 3. Жаш жарын бозой тоскондой, жадырап аппак тан атты."},{"t":"p","h":"Улгу: Каныбек балам, жаш экенсиң, айткан сөзүңдүн көбү олуттуу. – Тең байланыштагы татаал сүйлөм; 1) жаш экенсиң (к а н д а й экенсин?) – баяндооч; Каныбек балам – каратма сөз, сүйлөм мүчөсүнүн милдетин аткара албайт; бир тутумдуу сүйлөм; 2) айткан сөзүңдүн көбү олуттуу – дай? – олуттуу – баяндооч; көбү (канч ас ы?)- ээ; айткан сөзүңдүн (э м н е н д и н?) аныктооч; эки тутумдуу."},{"t":"p","h":"262. Интонацияны сактап, текстти көркөм окугула. Тыныш белгилеринин эмне үчүн коюлганын түшүндүргүлө,"},{"t":"p","h":"Жаным апа, тур! Жетим' тайлактай боздоп, жетимсиреп жалгызын келип отурат. Жалгызындын сөзүн ук, ая!"},{"t":"p","h":"Жалгызын, бүгүндөн баштап, ата-бабасы? тааныбаган бөтөн журттун бирөөнө? башы байланганы, ага сатылганы жатат. Андан куткар, ал азапты көрсөтпө, койнуна ал!.."},{"t":"p","h":"Жасаган ай, мунун эмне?* Анык бар болсон, мени эмне кербедун! Кантейин!..* Эн болбогондо, тентуш болсо, жаттыгына карабай, «мейли» деп коёт элем. Бирок ал маркум атамдан да карыган киши экен. Кантип аны өмүрлүк жолдош кылам? Андан канткенде кутулам!"},{"t":"p","h":"Айт, апа! Мага айла тап... Менин сенден башка барар жерим, таянар тоом калбай калды. Бирок сен, апа, жоксун... Түбөлүк уйкуда жатасын..."},{"t":"p","h":"<span class=\"pg\" data-n=\"101\">101<\/span>263. Татаал сүйлөмдөрдү таап көчүргүлө. Калтырып кеткен үтүр белгисин койгула, анын эмне үчүн коюлганын айтып бергиле. Мында татаал сүйлөмдүн кайсы түрү колдонулду?"},{"t":"p","h":"1. Бектурган Ысман келгенде ордунан турууга аракет кылды. Бирок муундары калтырап бели бөкчөйүп тамырлары үзүлүп кетчүдөй болду."},{"t":"p","h":"– Сиз азыр баса албайсыз, атаке, – деп Ысман жылмайды."},{"t":"p","h":"Ошентип, чаалыкканын билгизбей, Ысман атасын көтөрүп жүрүп отурду. Мына, арабанын шалдыраганы угулгансыйт ырайымдуу кишилер болгон эле. Бектурган арабадан үмүт кылган жок бирок баласынын көнүлүн кыйбады. Ал аңгыча арабалар жетип да келишти."},{"t":"p","h":"– Ой, сен кимсин?"},{"t":"p","h":"– Биз турпанчыбыз, айланайындар! Карыган атам оору эле көтөрүп келе жатам, – деди Ысман. (А. Т.)"},{"t":"p","h":"264. Окугула. Татаал сүйлөмдүн түрлөрүн аныктагыла, аларга коюлган тыныш белгилерди түшүндүргүлө."},{"t":"p","h":"1. Жаңылбаган адам болбойт, бирок? акмак адам гана жанылышын мойнуна албайт. 2. Баланды жалкоолукка үйрөтпөгүн, жашоодо белен оокат табылбастыр. («ЗО») 3. Бектурган бүгүн бактылуу: эки уулу бала-бакырасы менен кашында, алар ойноп-күлүп отурушат. (А. Т.) 4. Динар колундагы китебин жолдошторуна берди да, өзү койлорду тосууга чуркады. (Т. С.) Токтогул, күн айылга нурун төккөндө, жөнөп кетти. (Ж. Б.)"},{"t":"p","h":"265. Окугула. Татаал сүйлөмдүн кайсы туру бар? Түзүлүшү боюнча алардын айырмасы эмнеде? Түшүндүргүлө."},{"t":"p","h":"1. Ак ниет адамга асылгандар көп болот, бирок абийирин эч ким ача албайт. 2. Күн асмандын көркү болсо, абийир – адамдын көркү. (Мак.) 3. Адам баласы жакшы нерсени жаратканы үчүн кандай кубанса, ал жакшы нерсени көргөнү үчүн да ошондой кубанат. («КТ») 4. Алыстагы Теңир-Тоо кандай мемиресе, андан берки Ысык-Көл да ошондой мемирейт. 5. Айыл өзгөргөн: жаңы мектеп салынган, айдоо аянттары көбөйүптүр, төлгө төл кошулуптур."},{"t":"p","h":"6. Биздин классташтар, экзамен бүткөнчө, курбуларын күтүп турушту. («КБ»)"},{"t":"p","h":"266. Төмөңдө багынынкы сүйлөмдөр берилди. Аларды ушул түрүндө окуганда ой жыйынтыктуу болдубу? Анда эмесе, ой түшүнүктүү болсун үчүн баш сүйлөмдөрдү ойлоп таап, көп чекиттин ордуна жазгыла. Баш жана багынынкы сүйлөмдөр жөнүндө айтып бергиле."},{"t":"v","l":["<span class=\"pg\" data-n=\"102\">102<\/span>1. Эгерде комузчу болгудай шыгын болсо ... 2. Жаз айы келгенде ...","3. Кыш канчалык катуу болсо да... 4. Килем төшөп койгондой... 5. Жамгыр","күчөгөндөн күчөп ... 6. Жениш майрамы келгенче ...","","267. Текстти көркөм окугула. Анда түзүлүшү боюнча кандай сүйлөмдөр бар?","Сүйлөм мүчөлөрүнүн орун тартибинин өзгөчөлүгүнө көнүл бургула.","","Буркурап ыйлап жиберип,","Асыл энен Каныкей","Дүрбү салып турду эле.","Тайторуга көз салса,","Жетим мойнок жонунда,","Келе жатат бууданым,","Темиркандын үч атынын сонунда.","","Аркардай арыш узарып,","Кулжадай көзү кызарып,","Келе жатат Тайтору","Учкан куш менен жарышып.","","Ошол кезде Семетей,","«Манастап» ураан чакырып,","Тайторудай бууданды","Букара сүрөп калды эми.","","Манастап ураан чакырып.","Калаалуу Букар шаарына","Тайтору чыгып барды эми!","(«Семетей»)"]}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[99,102]},{"title":"&amp; 31. СЕБЕП БАГЫНЫҢКЫ СҮЙЛӨМ","blocks":[{"t":"h3","h":"&amp; 31. СЕБЕП БАГЫНЫҢКЫ СҮЙЛӨМ"},{"t":"p","h":"Себеп багыныңкы сүйлөм баш сүйлөмдөгү ойдун себебин билди-"},{"t":"v","l":["рет. Эмне үчүн? Эмне себептен? Эмнеликте н? деген","суроолорго жооп берет.","Мисалы, Ашуу бек болгондуктан, Жолой Кашкарды көздөй бет","алды. (К. Ж.) Э м н е үчүн Жолой Кашкарды көздөй бет алды? – ашуу","бек болгондуктан – себеп багынынкы сүйлөм."]},{"t":"p","h":"<span class=\"pg\" data-n=\"103\">103<\/span>Себеп багынынкы сүйлөмдүн баяндоочу төмөнкүдөй мүчөлөр менен аяктайт:"},{"t":"p","h":"1. Атоочтуктун -ган мүчөсүнө -дыктан мүчөсү уланат: Кар жаап тургандыктан, мал короодон чыккан жок."},{"t":"p","h":"2. -ган, -ганы түрүндөгү атоочтуктарга себептүү, үчүн ж. б. жандоочтор кошулуп айтылат: Күн жылыган себептүү, жаз эрте келди."},{"t":"p","h":"3. Этиштин терс түрү жана чакчыл мүчө: -ба+й, -ып: Аба ырайы бир калыпта турбай, суук күчөй берди."},{"t":"p","h":"268. Көчүрүп жазгыла. Татаал сүйлөмдөрдүн тутумундагы себеп багынынкы сүйлөмдү таап, үтүр менен ажыраткыла. Ал баш сүйлөм менен кандайча байланышты? Түшүндүргүлө."},{"t":"p","h":"1. Ай жарык тийгендиктен айлана дапдаана керунет\". (К. Б.) 2. Арзымат бай-манаптарды мактап ырдаган үчүн Токтогул аны жакшы көргөн эмес. (Ж. Б.) З. Матай ордунан турбай койгон Айдар эшикке чыгып кетти. (С. С.) 4. Көл бети мелтиреп жаткан үчүн? шырп эткен балыктын дабышы алда кайдан угулуп турду. 5. Айдалган аңыз куру калып үрөн себилбей жүрөгүм кансырап жатты. (Ч. А.)"},{"t":"p","h":"269. Окугула. Баш жана багынынкы сүйлөмдөрдүн сүйлөмдөгү орун тартибине көнүл бургула. Багынынкы сүйлөмдөрдүн баяндоочунун түзүлүшүндө кандай жалпылык бар?"},{"t":"p","h":"1. биз өзүбүздүн -ган+дыктан айлыбызга кайттык."},{"t":"p","h":"2. Саякат аяктаган үчүн, биз өзүбүздүн айлыбызга кайттык."},{"t":"p","h":"3. Саякат аяктаган себептүү, биз өзүбүздүн айлыбызга кайттык."},{"t":"v","l":["-ган үчүн","","-ган себептүү"]},{"t":"p","h":"270. Көп чекиттин ордуна тиешелүү мүчөлөрдү (-дыктан, -ып, -бай) коюп, же жандоочторду (учун, себептүү) кошуп жазып, багынынкы байланыштагы татаал сүйлөм түзгүлө. Ал баш сүйлөмдүн кандай кырдаалын билдирди?"},{"t":"p","h":"1. Жаан басыл..., биз жолго чыкпай калдык. 2. Кышында кар калың болгон..., быйыл эгин мол болду. 3. Беш тогол ет..., жай болбойт. (Калыгул.) 4. Айжан окууга келбей кал..., мен анын үйүнө бардым."},{"t":"p","h":"271. Окугула. Грамматикалык түзүлүшү боюнча кандай сүйлөмдөр бар? Аныктагыла. Сүйлөмдөрдүн айырмасын түшүндүргүлө."},{"t":"p","h":"<span class=\"pg\" data-n=\"104\">104<\/span>1. Чынын айтыш керек, келиним жаман чыккан жок. Ошонун өзү да үй-бүлөдө чоң ырыскы эмеспи. 2. Касым менен Алиман чон жолго жеткенге чейин карап турдум. (Ч. А.) З. Эртеси Султаналы баласын окутуу үчүн Таласка жөнөдү (К. К.) 4. Тенчилик доор чыкканда, териме батпай семирдим. (Т.) 5. Казанбак өтө саран бай болгондуктан, Сатылган менен Бурманын турмушу оордой баштады. (Ж. Б.) 6. Билесинби, алардын ичинде бир жигит бар экен. Ал менин ордума башкарма болуптур, иштери кандай. (Т. С.)"},{"t":"p","h":"272. Көчүргүлө. Калтырылып кеткен тыныш белгилерди койгула. Эмне үчүн коюлду? Синтаксистик талдоо жүргүзгүлө. Татаал сүйлөмдүн кандай түрлөрүн (грамматикалык түзүлүшү боюнча) билесинер?"},{"t":"p","h":"1. Ал жерден Күрпүлдөк айылынын аймагы дапдаана көрүнүп турган себептүү // окуучулар Орто-Кырга чейин барышты. (Т. С.) 2. Ошол жылда күз көпкө созулгандыктан // күн жаанчыл болбодубу. (Ч. А.) 3. Мугалим эртенки замандын кишилерин даярдаган үчүн // анын иши ардактуу жана жооптуу. 4. Ал бизден улуу адам эле // ошондуктан баарыбыз ал кишини сыйлачубуз. 5. Күн кылкылдап батып бара жатканда // биз айылды көздөй жөнөдүк. («КТ»)"},{"t":"p","h":"273. Өзүңөр окуган адабий китептерден мезгил жана себеп багынынкы сүйлөмдөрдүн ар бирине экиден сүйлөм жазып келгиле. Баш жана багынынкы сүйлөмдөрдүн байланышуу жолдорун түшүндүргүлө."},{"t":"p","h":"274. Төмөндө багынынкы сүйлөмдөр берилди. Окугула. Айтылуучу ой түшүнүктүүбү? Түшүнүктүү болсун үчүн баш сүйлөмдү ойлоп таап, көп чекиттин ордуна жазгыла. Багынынкы жана баш сүйлөмгө синтаксистик талдоо жүргүзгүлө."},{"t":"p","h":"1. Быйыл кыш катуу болгондуктан ... 2. Аба ырайы бир калыпта турбай ... 8. Күн жылыган себептүү ... 4. Жол тайгак болгон үчүн..."},{"t":"p","h":"275. Баш жана багынынкы сүйлөмдөрдү аныктагыла. Алар өз ара кайсы мүчөлөр менен байланышкандыгын түшүндүргүлө. Багыныңкы сүйлөмдүн кайсы түрү колдонулду?"},{"t":"p","h":"1. Жолдошторубуз өз убагында келбеген үчүн, биз жолго чыга албай жатабыз. 2. Адамга тиричилик канчалык керек болсо, жашоо да ошончолук кызык го. (Т. С.) З. Күз узак болгондуктан, жаз айы кечигип келди. Керез сабакка бир жума келбей калган сон, Тенти агай анын үйүнө барды. (Ш. Б.) 4. Ынтымак болбой, иш оңолбойт. Көп акылман чогулса, кыйын ишти бүтүрөр. (Мак.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"105\">105<\/span>276. Окугула. Багынынкы байланыштагы татаал сүйлөмдү көрсөткүлө. Ал кандай сүйлөмдөрдөн түзүлөт? Багынынкы сүйлөмдүн кайсы түрү катышты? Ал жөнүндө эмне билесинер?"},{"t":"p","h":"Жаан басылган үчүн, гидротехник Бектемир атка минди. Ал түндүк тараптагы аскалуу капчыгайды көздөй бет алды. Бир убакта аты кошкуруп, ордунан жылбай койду. Аска таштардын арасын караса, башы-көзү канжалап, үстөмөнүнөн түшкөн бирөө жатты. Ал түнү менен жаанда калган сыяктуу. Жаан тынбай жаай бергендиктен, аны топурак чала-була көөмп калыптыр. Аңгыча жаткан киши кыңылдап, болор-болбос дабыш чыгарды эле, Бектемир, анын тирүү экенине ишенип, кубана түштү. (Ч. А.)"},{"t":"p","h":"277. Төмөндө баяндоочтору окшош мүчөлөр менен аяктаган багыныңкы сүйлөмдөр берилди. Силер, аларды өз ара салыштырып, ар бири кандай мааниде колдонулганын аныктагыла. Айырмасы эмнеде?"},{"t":"p","h":"1. Бурулча эшиктен кирип келген сон, кыз-келиндер орундарынан тура калышты. (К. Б.) – Өз кулагы укпаган сон, Батыш алдыртадан тымпыйган болот. (Т. С.) 2. Алдаркөсөө келип караса, чык татырбас Чынарбай койдун башын куйкалап жатыптыр. («Жомок») – Ушул бойдон күн ачык турса, жер бети бат эле кулпуруп кетет. («КТ») 3. Капсалан болбой, жут болбойт. (Калыгул.) Күн басылбай, оруу-жыюу иштери башталбайт. («БК»)"},{"t":"p","h":"278. Мааниси жагынан бири бирине байланыштуу жөнөкөй сүйлөмдөр берилди. Алардан багыныңкы байланыштагы татаал сүйлөм түзгүлө. Жөнөкөй жана татаал сүйлөмдөрдүн түзүлүшү жөнүндө айтып бергиле."},{"t":"p","h":"1. Күн нуру өрөөндү тегиз басты. Биз жайлоого жөнөдүк. 2. Биз космодромго келдик. Ал жердеги көргөндөрүбүз баарыбызды кубанычка бөлөдү."},{"t":"p","h":"3. Мен ойгондум. Элдин баары уйкунун тынчтык кучагында эле. 4. Аба ырайы бузулду. Бурганактап кар жаай баштады."},{"t":"p","h":"Улгу: Кун нуру өрөөндү тегиз баскандан кийин, биз жайлоого жөнөдүк. – Бул – багынынкы байланыштагы татаал сүйлөм; эки сүйлөмдөн (баш жана багынынкы) түзүлдү; мындай өзгөчөлүк жөнөкөй сүйлөмдө болбойт; экинчиден, жөнөкөй сүйлөмдө бир эле грамматикалык негиз (бир баш мүчө) болот; ал эми татаал эки сүйлөмдөн түзүлгөндүктөн, анда эки грамматикалык негиз (эки баш мүчө) бар."},{"t":"p","h":"279. Текстти көркөм окугула. Андагы жөнөкөй жана татаал сүйлөмдөрдү өз-өзүнчө ажыраткыла. Алардын кандай түрлөрү бар? Тексттен мисал келтиргиле."},{"t":"p","h":"<span class=\"pg\" data-n=\"106\">106<\/span>Алиман сүйлөп бүткөндө, көпкө унчукпай отурдук. Майдын орто чени беле ошондо. Тэ-ээ алда кайда агала булут түрмөктөлүп, анда-санда күн күркүрөп, шамал желдеп турду. Ошондо жазгы нөшөр төгүп турса керек. Жаандын салаалары, сымаптай кубулуп, дүйнө жүзүн жууп келе жатты."},{"t":"p","h":"Алиманга мен эчтеке деп айткан жокмун, бирок менин айтарым тетиги жаркыраган жаандай таза сөздөр эле. Алиман сыяктуу адамдарды жаратканына ыракмат, Жер эне! Дүйнөнүн тазалыгына, адамдын тазалыгына ыракмат. Жаан жаайт, эгин өсөт, эл күн көрөт, мен да алар менен кошо жашайм."},{"t":"p","h":"Буларды айтканым, Алиман мени урматтаганы үчүн эмес, адамдын улуулугуна сыйындым. Менин Алиманым адам да! (Ч. А.)"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[103,106]},{"title":"§ 32. МАКСАТ БАГЫНЫҢКЫ СҮНЛӨМ","blocks":[{"t":"h3","h":"§ 32. МАКСАТ БАГЫНЫҢКЫ СҮНЛӨМ"},{"t":"p","h":"Максат багыныңкы сүйлөм баш сүйлөмдөгү ойдун максатын билдирет. Эмне максат менен? Эмнеүч үн? Эм не ге? деген суроолорго жооп берет."},{"t":"p","h":"Мисалы, 1. Жаш кулундарга жел тийбесин деп, Кулболду карыя бээлерди короого айдап келди. (К. Б.)"},{"t":"p","h":"Э м не учун Кулболду карыя бээлерди короого айдап келди? – жаш кулундарга жел тийбесин деп – максат багынынкы сүйлөм."},{"t":"p","h":"Багынынкы сүйлөмдүн баяндоочу келер чакта болуп, ага -бас, -сың (-сың деп, -са деп, -сын учун) -уу, -ыш мүчөлөрү уланат жана учун деген жандооч кошулуп айтылат: Эгинден мол түшүм алуу учун, окучуулар ишембиликке чыгышты."},{"t":"p","h":"280. Багынынкы байланыштагы татаал сүйлөмдөн баш сүйлөмдү тапкыла. Ал аркылуу суроо берип, багынынкынын кайсы түрү экенин аныктагыла."},{"t":"p","h":"1. Ошол түнү! асманды карап жатсам, Саманчынын жолу жылт-жулт* этип копшолуп жатты. Бүгүн түнү дүйнөгө дагы бир жаны дыйкан келди, өмүрлүү болсун."},{"t":"p","h":"Сепкен аштыгы жылдыздай түгөнгүс болсун деп, Саманчынын жолун тиктеп жатып уктап кеттим. (Ч. А.) 2. Мал кыштан семиз чыксын үчүн, тоюткор жетиштүү камдалды. 3. Бардык жерде тен укуктуулук болсун* үчүн?, биздин мамлекетибиз зор иштерди жүргүзүүдө*'. 2. Жаандын суусу кирип келбес үчүн, боз үйдү айланта арык каздык. («КТ») 3. Биздин саякат эстелик болсун деп, ушул таштын бетине сөз жазалы. (Т. С.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"107\">107<\/span>281. Көп чекиттердин ордуна баш сүйлөмдү ойлоп таап жазгыла. Тыныш белгилерин койгула. Максат багынынкы сүйлөм жөнүндө айтып бергиле."},{"t":"p","h":"1. Такшалган мыкты педагог болуш үчүн ... 2. Араба ала салып кетпесин деп ... З. Арстанбек окуудан бүгүн келер деп... 4. Иш жемиштүү болсун учун ..."},{"t":"p","h":"282. Төмөндө татаал сүйлөмдөрдөгү ойдун жыйынтыктары берилди. Силер дагы бирден сүйлөм ойлоп таап, ошол ойдун максатын билдиргиле. Ал сүйлөмдөрдү көп чекиттин ордуна жазгыла, тыныш белгилерин койгула."},{"t":"p","h":"1. ... атасы даярдык көрө баштады. 2. ... мектептин айланасына бак отургуздук. 3. ... ата-энелерим жайлоого көчүп кетишти. 4. ... баарыбыз жакшы окууга тийишпиз."},{"t":"p","h":"283. Көчүрүп жазгыла. Сүйлөм мүчөлөрүнүн астын сызгыла. Түзүлүшү боюнча кандай сүйлөмдөр бар?"},{"t":"p","h":"1. Сабатсыздыгымды жоём деп, Субанкул бригадирликтен бошонуп алган. 2. Эртен-бүрсүгүнү чабыкка чыгабыз деп, ал комбайнын даярдап койгон эле. (Ч. А.) 3. Ошол күнү Бектурган балдарды көрүп кетүү максаты менен келген эле. (А. Т.) 4. Жетимдерге көз салууга Бурмаке байбиче келди. (М. Э.) 5. Эчкилер бактарды аарчып койбосун деп, биз мектептин айланасын курчап койдук. (М. Ж.)"},{"t":"p","h":"284. Сүйлөм мүчөлөрү боюнча талдоо жүргүзүп, максат бышыктоочту жана максат багынынкы сүйлөмдү аныктагыла. Алардын айырмачылыгы эмнеде?"},{"t":"p","h":"1. Элге дагы сүйгүнчүлүктүү болуш үчүн, мен өзүмдүн ырымды ого бетер сүйөмүн. (А. Т.) 2. Такшалган мыкты геолог болуу үчүн, Керимбек жердин геологиялык сырын жакшы өздөштүргөн. 3. Көчөттөр тез күч алсын үчүн?, үзбөй сугарып турабыз. 4. Негизги маселе туура чечилсин үчүн, студенттер шайлоого өз убагында барышты. («КТ»)"},{"t":"p","h":"285. Окугула. Сүйлөмдөрдү өз ара салыштырып, багынынкы сүйлөмдүн түрлөрүн аныктагыла. Айырмачылыгы эмнеде? Максат багынынкы сүйлөмдүн баяндоочу келер чакта болорун эсинерде сактагыла."},{"t":"p","h":"1. Милдеттенме өз убагында ат- Милдеттенме өз убагында аткакарылсын үчүн, биздин бригадага рылган? үчүн, биздин бригадага сыйайылдаштар жардам беришти."},{"t":"p","h":"2. Балдар эртели-кеч футбол ойлыктар берилди."},{"t":"p","h":"Балдар эртели-кеч футбол ойногон ношсун үчүн, үйдүн алдына кичи- үчүн, үйдүн алдына кичинекей аянтча некей аянтча жасадык. жасадык."},{"t":"p","h":"<span class=\"pg\" data-n=\"108\">108<\/span>286. Максат багынынкы сүйлөмдүн баяндоочун төмөнкүдөй формаларга келтирип, ар бирине бирден татаал сүйлөм түзгүлө. Аларга синтаксистик талдоо жүргүзгүлө. Багынынкы сүйлөмдүн баяндоочу этиштин кайсы чагында келди?"},{"t":"p","h":"1. -сын үчүн"},{"t":"v","l":["2. -ыш учун","3. -уу учун","4. -са деп"]},{"t":"p","h":"287. Синтаксистик талдоо жургузгуле: а) женекей суйлемдун грамматикалык түзүлүшү боюнча; б) татаал сүйлөмдүн түзүлүшү боюнча; в) сүйлөм мүчөлөрү боюнча."},{"t":"p","h":"1. Күз!. Атакандын айылы бүгүн? жандуу. (Ж. Б.) 2. Мектепке кирип келгенден кийин Дүйшөн күндөгүсүндөй от жаккан жок. (Ч. А.) 3. Кырк баатырдын баары бар, Кыргыл чал менен Бакай кары бар. («Манас».) 4. Дүйнөнүн эмгекчил адамдары бекем достукта турганда, адам изин эч ким? баса албайт. 5. Күлкү тып басылган үчүн, үй ичи жымжырт боло түштү. (Т. С.)"},{"t":"p","h":"288. «Өз кесибинин ээси» деген темада ой жүгүртүү мүнөздө сочинение жазып келгиле. Ой-пикиринерди кенен-кесир жана ачык-так баяндоодо багынынкы сүйлөмдүн ар кыл түрлөрүн колдонууга аракет кылгыла."},{"t":"p","h":"289. Текстти окугула. Жөнөкөй жана татаал сүйлөмдөрдүн кайсы түрлөрү бар, аныктагыла. Багынынкы сүйлөмдөр барбы? Анын кайсы түрү?"},{"t":"p","h":"Бүгүн жекшемби. Курбулар кайра көл боюна чыгышты. Баягыдай серке чаначка кымыз тенденип, Акман да келди. Камканы ээрчитип, Мыскал келди. Бүгүн сейил. Тигил булунда күлкү жаңырат, ал жерде жаштар олтурушат."},{"t":"p","h":"Шамбеттин алп денеси чымырап, жүрөгү кубанычта согот. Ал, Чаргынды катарына алып, теребелге көз чаптырат. Шамбет терен дем алса, колунда кесе толо кымыз мелт-калт этет."},{"t":"p","h":"– Мына көксөгөн тилекке жеттик! Кайрадан жолугушканыбыз үчүн ичелик, курдаштар!"},{"t":"p","h":"Булар – кыштактын жаштары, айылды гүлдөткөн ушулар. Бири жаны көктөгөн чырпыктай, бири жаны ачылган гүлдөй. Пай-пай! Эмгек сүйгөн кишилер алп экен го. Өлбөс жан экен го! (Т. С.)"},{"t":"p","h":"290. Синтаксистик талдоо жүргүзгүлө: а) жөнөкөй жана татаал сүйлөмдөрдүн грамматикалык түзүлүшү боюнча; б) сүйлөм мүчөлөрү боюнча; в) тыныш белгилери боюнча."},{"t":"p","h":"1. Түн. Ай жарык. Бак жактан музыканын үнү угулат. Машина, күн бата, Бишкек шаарына келди. (К. Б.) 2. Чаргын, колуна кесени алып, күлүп"},{"t":"v","l":["<span class=\"pg\" data-n=\"109\">109<\/span>койду. (Т. С.) 3. Алдейлеп баккан журт үчүн арнадым кырчын өмүрдү! (Ж. Б.)","4. Баарынан намыс кымбат турарын, балдар, унутпагыла. 5. Талаага гүл","кандай көрк берсе, акылдуулук да адамга ошондой көрк берет. 6. Күрдөлдүү","эл – алтын терек, кол сунган адам жете албас. Эл деген аскалуу зоо, эч"]},{"t":"p","h":"душман бузуп өтө албас. («ЗО») Т. Көгөргөнү чын болсо, гүлдөр соолбос бол-"},{"t":"v","l":["сочу. (Т.)","","291. Мезгил, сыпат, салыштырма багынынкылуу татаал сүйлөм (ар бирине","экиден) түзүп келгиле. Алар жөнүндө айтып бергиле.","","292. Текстти көркөм окугула, түзүлүшү боюнча талдап, жөнөкөй жана татаал","сүйлөмдөрдү тапкыла. Сүйлөмдөгү сөздөрдүн орун тартиби кандай болду? Алардын","түз орун тартибин эсинерге түшүргүлө."]},{"t":"h3","h":"АЯЛГА"},{"t":"v","l":["Жар салып, сүйөмүн деп айткандардын","Жүрөгү таш болбосун абайлагын.","Касиет, нарк-насилин бузулбасын,","Бактынды башка келген учурбагын.","","Сагынтып санаа кылсын касиетин,","Сүйүшсүн жоготуп акыл-эсин.","Баш ийсен, бир сүйүүгө баш иерсин,","Ал сенин айкөл терен касиетин.","Жашоодо жашыл жарык экенинди","Далилдеп турсун дайым акыл-эсин.","М. Токторов"]}],"sub":[{"title":"АЯЛГА","b":36}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[107,109]},{"title":"§ 33. САН-ӨЛЧӨМ БАГЫНЫҢКЫ СҮЙЛӨМ","blocks":[{"t":"h3","h":"§ 33. САН-ӨЛЧӨМ БАГЫНЫҢКЫ СҮЙЛӨМ"},{"t":"p","h":"Сан-өлчөм багыныңкы сүйлөм баш сүйлөмдөгү ойдун көлөм, сан, даража өлчөмдөрүн билдирет. Канча? Канчалык? Эмне бол-"},{"t":"v","l":["с о? ж. б. суроолорго жооп берет.","Мисалы, Адам канчалык көп окуса, ал ошончолук көптү билет. —","Э м не б ол с о ал ошончолук көптү билет? – Адам канчалык көп","окуса – сан-өлчөм багынынкы сүйлөм.","Багыныңкы сүйлөмдүн баяндоочу -са мүчөсү менен аяктап, баш","сүйлөмгө канча, канчалык, багынынкы сүйлөмгө ошончо, ошончолук деген","сөздөр кошулуп айтылат: Күчүм канча жетсе, ошончо окутам. (Ч. А.)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"110\">110<\/span>293. Окугула. Багынынкы байланыштагы татаал сүйлөмдөрдү ажыратып, андагы сан-өлчөм багыныңкы сүйлөм жөнүндө айтып бергиле. Тыныш белгилеринин коюлушун түшүндүргүлө."},{"t":"p","h":"Ооба, Жер энем, ымандай сырымды айтып жатам, өзүн билесин го. Алиманга эч нерсе айта албадым. Эгерде айтсам, адамзатынын кандайдыр бир асыл дүйнөсүн бүлдүрүп, кандайдыр бир ак нерсени булгап коё тургансып, батына албай жүрдүм. Андан бери канча жылдар өтсө да, эл ошончолук сыйлашып келе жатышат. Ыракмат, көзүм жумулганча ыраазымын."},{"t":"p","h":"Жылдар өтө берди. Сүйүнгөнүм канчалык көп болсо, өкүнүп-өксүгөнүм андан да көп болду. (Ч. А.)"},{"t":"p","h":"294. Синтаксистик талдоо жүргүзгүлө: а) грамматикалык түзүлүшү боюнча;"},{"t":"p","h":"б)багынынкы сүйлөмдүн түрлөрү боюнча; в) сүйлөмдүн баш мүчөлөрү боюнча."},{"t":"p","h":"1. Төө канча болсо, жүк ошончо болот. (Мак.) 2. Өмүрбектин көнүлү канчалык жумшак болсо, ал ошончолук көк эле. 3. Мен бүгүн агайым менен сүйлөштүм. 4. Менин биринчи ырлар жыйнагым басылып жатыптыр. 5. Менин ырымды эл канчалык сүйсө, мен аларга ошончолук кызмат кылам. (А. Т.)"},{"t":"p","h":"295. Багыныңкы сүйлөмгө канча, канчалык, ал эми баш сүйлөмдө ошончо, ошончолук деген сөздөрдү катыштырып, сан-өлчөм багынынкы сүйлөм (ар бирине экиден) түзгүлө. Баш жана багынынкы сүйлөмдүн байланышуу жолдорун түшүндүргүлө."},{"t":"p","h":"296. Текстти окугула. Багынынкы байланыштагы татаал сүйлөмдү ажыраткыла. Багынынкы сүйлөмдүн кайсы түрлөрү бар? Алар жөнүндө эмне билесинер? Тыныш белгилеринин коюлушун айтып бергиле."},{"t":"p","h":"Кымбаттуу иним! Канчалык зарыл жумуштарым болсо да, бардыгын жыйыштырып таштап, мен ушул катты жазууну туура таптым... Эгерде ушунда айтылгандар сизди кызыктырса, анда өз чыгарманызга пайдаланууну суранам. Бул жаштар үчүн керек го деп эсептеймин."},{"t":"p","h":"Муну канчалык көп адам билсе, мен ошончолук бактылуу болом. Ошончолук эл алдында ыйык парзымды аткарып, ошончолук менин да кетирген күнөөм кемийт."},{"t":"p","h":"Эгер жаза турган болсонуз, мени уялат деп тартынбаныз. Эч нерсесин жашырбай, ачыктан-ачык жазыныз. (Ч. А.)"},{"t":"p","h":"297. Багыныңкы сүйлөмдүн баяндоочун төмөнкүдөй формаларга келтирип, татаал сүйлөм түзгүлө. Алар багынынкы сүйлөмдүн кайсы түрү болду? Көчүрүп жазып, тыныш белгисин койгула. Баш мүчөлөрдүн астын сызгыла."},{"t":"h3","h":"<span class=\"pg\" data-n=\"111\">111<\/span>са деп"},{"t":"p","h":"Оку са да ганы болбосо"},{"t":"h3","h":"гансып"},{"t":"p","h":"298. Жөнөкөй сүйлөмдөн адегенде тең байланыштагы, андан кийин багынынкы байланыштагы татаал сүйлөм түзгүлө. Көчүрүп жазып, тыныш белгилерин койгула, Татаал сүйлөмдүн түрлөрүнүн айырмачылыгы эмнеде?"},{"t":"p","h":"1. Күн нуру жер бетин тегиз каптады. Биз айылдан чыктык. 2. Музейге баргыбыз келди. Убакыт болбой калды. 3. Үчүнчү күнү шамал басылды. Кун ачылды."},{"t":"p","h":"Улгу: Күн нуру жер бетин каптады, биз айылдан чыктык. – Кун нуру жер бетин тегиз каптаганда, биз айылдан чыктык. – Күн нуру жер бетин каптаса, биз айылдан чыгабыз. – Күн нуру жер бетин каптаган үчүн, биз айылдан чыктык. Күн нуру жер бетин каптап, биз айылдан чыктык ж.б."},{"t":"p","h":"299. Татаал сүйлөмдөргө оозеки талдоо жүргүзгүлө. Багынынкы сүйлөмдүн кайсы түрлөрү бар? Алардын кандай мааниде колдонулганын туура аныктоодо эмнеге көнүл буруу керек?"},{"t":"p","h":"1. Сууну көп кечсе, чалчык болот. Сөздү көп сүйлөсө, тантык болот. (Мак.) 2. Күн кылкылдап батып бара жатканда, Чоро жөнөп калды. (К. Ж.) З. Эр жигит акылдуу болсо, ак шумкардай айланат. 4. Таанысан, кыргыз, кутман эл, тартыштан мөрөй уткан эл. (Ж. Б.) 5. Бактыбыз болсо, душманды женели. («Курманбек») Дулдуйган Атай, апасына кошулуп, көз жашын шыпырды. (Ш. Б.) Т. Баланы карап, Айтике отура калды. (А. Т.) 8. Адырларды аралап, шылдырап аккан сууга жеткенибизде, Дүйшөн менин көзүмө эркелей карады. (Ч. А.)"},{"t":"p","h":"300. «Ысык-Көлдү сактоо» деген темада чакан текст түзүп келгиле. Багынынкы сүйлөмдүн түрлөрүн колдонууга аракеттенгиле."},{"t":"p","h":"301. Таблицага көңүл бургула. Шарттуу ыңгайдын -са мүчөсү багынынкы сүйлөмдүн кайсы түрлөрүндө колдонуларын эсинерде сактагыла."},{"t":"p","h":"‚ Мисалдар"},{"t":"v","l":["ее","Балдар мектептен чыгышса,","кар жаап жаткан экен.","Багынынкы суйлемдун","кайсы туру","","Мезгил багыныңкы сүйлөм."]},{"t":"raw","h":"<div class=\"tbl\"><span class=\"pg\" data-n=\"112\">112<\/span><table><tr><td>Ынтымагын болбосо, жене<\/td><td>Шарттуу багынынкы сүйлөм.<\/td><\/tr><tr><td>албайт жоону бир адам.<\/td><\/tr><tr><td>8;<\/td><td>Билим кайда болсо, өнөр<\/td><td>Орун багынынкы сүйлөм.<\/td><\/tr><tr><td>ошол жерде болот.<\/td><\/tr><tr><td>4.<\/td><td>Чон-Төрдү булут каптап тур-<\/td><td>Карама-каршы багынынкы<\/td><\/tr><tr><td>ганы болбосо, аба ырайы бир ка-<\/td><td>сүйлөм.<\/td><\/tr><tr><td>лыпта.<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"302. Көчүргүлө. Синтаксистик талдоо жүргүзгүлө: а) багыныңкы сүйлөмдүн кайсы түрлөрү бар; б) чакчыл -ыл мүчөсү кандай сүйлөмдөрдө колдонулду; в) ал уланып турган сөз сүйлөмдүн кайсы мүчөсү?"},{"t":"p","h":"1. Колун жаагына таяп, отту карап отурган Бектурган көз ачып-жумганча ордунан турду. (А. Т.) 2. Кайсы бирөөлөр орондосо, биз сылык мамиле менен өзүн уялтуубуз керек. («А») 3. Бүткөн боюм ымыр-чымыр болуп, аттан түштү. 4. Нары жактан Алиманды ээрчитип, үч-төрт аял келе жаткан экен. 5. Ангыча болбой Айша кошунамдын короосунан аялдар чыга калып, мени колдон бекем кармашты. (Ч. А.)"},{"t":"p","h":"303. Сүйлөм мүчөлөрү боюнча талдоо жүргүзүлө. Жөнөкөй жана татаал сүйлөмдөрдүн кайсы түрү бар?"},{"t":"p","h":"Үн салып ырдап жатышкан келин-кыздарды Жутабай карыя, башын көтөрүп, кылчайып карап койду. Алыстан, кырман жактан, тамак мезгили болгонун билгизип, коңгуроо кагылды. Ушул кезде Оморбек да жетип келди."},{"t":"p","h":"– Сүйүнчү, Жапар ага, сүйүнчү, Жутаке, – деди шашып."},{"t":"v","l":["– Болсун, болсун, кагылайын.","– Биз «Кенеш» айылынан өтүптүрбүз. (К. Б.)"]},{"t":"p","h":"304. Таблицага көнүл бургула. Чакчыл -ып мүчөсүнүн колдонулушуна көнүл бургула. Эсинерде сактагыла."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>-ып мүчөсү катыш-<\/td><td>Сүйлөмдүн кайсы<\/td><\/tr><tr><td>кан сүйлөм жана<\/td><td>түрү<\/td><\/tr><tr><td>сөз тизмеги<\/td><\/tr><tr><td>Бетинен нуру чачырап,<\/td><td>Бетинен нуру чачы-<\/td><td>Сыпат багынынкы<\/td><\/tr><tr><td>толкундап Сырга кубан-<\/td><td>рап (канти п?)<\/td><td>сүйлөм.<\/td><\/tr><tr><td>ды.<\/td><\/tr><\/table><\/div>"},{"t":"raw","h":"<h4 class=\"mk\"><span class=\"pg\" data-n=\"113\">113<\/span>Нурлан жумушка келбей калып, мен анын үйүнө бардым. Гүлдүү жоолугун салынып, Алиман жасанып алган.<\/h4>"},{"t":"p","h":"Нурлан жумушка Себеп багынынкы келбей калып"},{"t":"v","l":["сүйлөм.","(эмне үчүн?)"]},{"t":"p","h":"Гүлдүү жоолугун са- Чакчыл түрмөк лынып (к ан т и п?) (жөнөкөй сүйлөм)."},{"t":"p","h":"305. Баш жана багынынкы сүйлөмдөрдүн ордун аныктагыла. Көчүргүлө. Калтырылып кеткен тыныш белгилерин койгула жана алардын коюлушун түшүндүргүлө."},{"t":"p","h":"1. Адегенде биз кантер экен деп сыр алдырган жокпуз. 2. Жамийла Данияр трапка жакындай келгенде артынан жетти. 3. Данияр аксай баштаганда биз аны кандай азапка салганыбызды ошондо түшүндүк. 4. Ал Жамийланын үнүн укканда кайра чымырканып илгери умтулду. (Ч. А.)"},{"t":"p","h":"306. Жөнөкөй жана татаал сүйлөмдөрдө тыныш белгилеринин эмне учун коюлганын түшүндүргүлө."},{"t":"p","h":"1. Үйдүн ичи баягы өзү көргөндөй: эч бир өзгөрүш жок, чон күзгү өз ордунда. Жамийла ага карангысы, чачын тарангысы келди. Ордунан туруп, күзгүгө барды. (К. Б.) 2. Данияр, эрдин кесе тиштеп, көзүн жумду. Ушул учурда Жамийла, көзүн Даниярдан албай, телмирип калыптыр."},{"t":"p","h":"– Ташта! Ташта капты! – деп кыйкырып жиберди Жамийла. Данияр тил алган жок."},{"t":"p","h":"Ушул учурда алдан кеткен Данияр капты коё бербесе, жыгылганы эле калды."},{"t":"p","h":"– Жүгүр! Артынан сүйөп жибер! – деди мага Жамийла, өзү болсо, Даниярды тосуп алчудай, шашканынан ага колун сунуп көтөрдү. (Ч. А.)"},{"t":"p","h":"307. Багынынкыга карата баш сүйлөмдү ойлоп таап, көп чекиттин ордуна жазгыла, тыныш белгилерин койгула. Багынынкы сүйлөмдүн кайсы түрү экендигин аныктагыла. Жөнөкөй сүйлөмдөрдүн баш мүчөлөрүнүн астын сызгыла."},{"t":"p","h":"1. Жакшынын өзү өлсө да... 2. Окуучулар шаардан келатса ... 3. Эгер жаан басылса ... 4. Кайсы жерде кыйын иш болсо..."},{"t":"p","h":"308. Төмөндө баш сүйлөмдөр берилди. Багынынкы сүйлөмдү ойлоп таап, көп чекиттин ордуна жазгыла, тыныш белгисин койгула. Тапкан сүйлөмүнөр багыныңкынын кайсы түрү?"},{"t":"p","h":"<span class=\"pg\" data-n=\"114\">114<\/span>1. ... Каныш апа жалгыздык тарткан жок. 2. ... мен да ошол окууга барамын. 3. ... аба ырайында өзгөрүү болгон жок. 4. ... биз жакшы окууга аракеттенишибиз керек."},{"t":"p","h":"309. Түзүлүшү боюнча кандай сүйлөмдөр бар? Алардын айырмачылыгын түшүндүргүлө."},{"t":"p","h":"1. Көп бириксе, көл болот. Көл каптаса, сел болот. 2. Кылыч жарасы бүтөт, тил жарасы бүтпөйт. 3. Көрө-көрө көсөм болот, сүйлөй-сүйлөй чечен болот. (Мак.) 4. Караңгы түн. Алда кандай бир нерсеге түшүнө албай жаткандай, табийгаттын көрүнүшү тыптынч. 5. Табийгаттын ушундай кубулуштарын байкап жатып, мен көпкө чейин уктай албадым. (М. Э.)"},{"t":"p","h":"310. Калтырылып кеткен тыныш белгилерди өз ордуна койгула, Алар эмне үчүн коюлду?"},{"t":"p","h":"Күн балбылдап уясынан чыгып келе жаткан кезде // Өмүрбек балдарын самолетко отургузду. Ошентип, беш күндөн кийин так он сегизинчи август күнү шумкар баласы булуттун үстү менен жөнөдү."},{"t":"p","h":"Коноктор Бектурган карыянын өмүрүндөгү кызык окуяларын тыңшашып // кээде күлүшүп // кээде кейишип отурушту. Карыя // кубанычка балкып // муундары бошоп // жыргалга көңүлү жибип отурду."},{"t":"v","l":["Карыя көп жашапсыз // Сизде да арман болот бекен?","// Карыянын сөзүн угалык, чынын айтыныз //"]},{"t":"p","h":"Э-э балам // Сурооң эн эле сонун // деди Бектурган // сакалын сылап."},{"t":"p","h":"311. Баш жана багынынкы сүйлөмдөрдү тапкыла жана алар өз ара кайсы мүчөлөр аркылуу байланышканын түшүндүргүлө."},{"t":"p","h":"1. Желгенине жел жетпей, жетик чуркап алыптыр. Басканына мал жетпей, башкача чуркап алыптыр. («Семетей».) 2. Акыркы оюн ойлогондо Каныбек аябай кубанып кетти. Көздөрү жайнап, бүркөлгөн кабагы ачылып, дүнүйөсү түгөл болгондой боло түштү. (К. Ж.) 3. Апийимди тилип болуп, күн батарга жакындаганда, биз үйгө кайттык. (М. Э.)"},{"t":"v","l":["4. Көтөрүлүп көп сүйлөп,","Болбос ишке күлбөгүн.","Алган жарын жаш болсо,","Акырын айтып үндөгүн.","Акылын жетсе ар ишке,","Билип туруп сүйлөгүн. (Т.)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"115\">115<\/span>Кайталоо үчүн суроолор:"},{"t":"p","h":"1. Багыныңкы байланыштагы татаал сүйлөм кандай бөлүктөрдөн турат?"},{"t":"p","h":"2. Баш жана багынынкы сүйлөм деген эмне? Мисал келтиргиле."},{"t":"p","h":"3. Багынынкы сүйлөмдүн кандай түрлөрү бар?"},{"t":"p","h":"4. Шарттуу багынынкы баш сүйлөм кайсы мүчөлөр аркылуу байланышат? Мисал келтиргиле."},{"t":"p","h":"5. Баш жана багыныңкы сүйлөмдөрдүн орду кандай?"},{"t":"p","h":"6. Мезгил багынынкы сүйлөм менен тутумдаш мезгил бышыктоочтун айырмасын түшүндүргүлө."},{"t":"p","h":"Т. Чакчыл түрмөк менен сыпат багынынкы сүйлөмдүн айырмасы кандай?"},{"t":"p","h":"8. -са, -ып мүчөлөрү багынынкы сүйлөмдүн кайсы түрлөрүндө колдонулат? Мисал келтиргиле."},{"t":"p","h":"9. Баш жана багыныңкы сүйлөмдөрдүн тыныш белгиси жөнүндө айтып бер."},{"t":"p","h":"10. Себеп жана максат багынынкы сүйлөмдүн баяндоочтору этиштин кайсы чагында келет? Мисал келтиргиле."},{"t":"p","h":"11. Тен жана багыныңкы байланыштагы татаал сүйлөмдөрдүн айырмасы эмнеде?"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[110,115]},{"title":"§ 34. КӨП БАГЫНЫНКЫЛУУ ТАТААЛ","blocks":[{"t":"h3","h":"§ 34. КӨП БАГЫНЫНКЫЛУУ ТАТААЛ"},{"t":"p","h":"Баш сүйлөмгө эки же андан көп багынынкы сүйлөм байланышып келсе, бул көп багыныңкылуу татаал сүйлөм болот."},{"t":"p","h":"Мисалы, 1. Күз келгенде, эгин бышканда, ал биздин айылга кызматка келген. (Н. Б.) 2. Алым Каныбектин тарыхын укканда, ичи туз куйгандай ачышып, жүрөгүнүн башына тикенек кадалгандай болду. (К. Ж.)"},{"t":"p","h":"Биринчи мисалдагы баш сүйлөм – ал биздин айылга кызматка келген. К а ч а н? – 1) куз келгенде; 2) эгин бышканда. Экөө тең бирдей суроого (к а ч а н?) жооп берди, мезгил багынынкы сүйлөм. Баяндоочтору да бирдей формада (-ган+да) түзүлдү. Демек, булар бир өнчөй түрүндө кезикти."},{"t":"p","h":"Экинчи мисалдагы баш сүйлөм – жүрөгүнүн башына тикенек кадалгандай болду. К а ч а н? – 1) Алым Каныбектин тарыхын укканда – мезгил багынынкы сүйлөм. К ан т и п? – 2) ичи туз куйгандай ачышып – сыпат багынынкы сүйлөм. Булар бир өңчөй эмес."},{"t":"p","h":"Демек, багынынкы сүйлөмдөр өзүлөрүнүн түзүлүшү боюнча бир өнчөй же бир өнчөй эмес түрүндө болушу мүмкүн."},{"t":"p","h":"<span class=\"pg\" data-n=\"116\">116<\/span>312. Окугула, Адегенде баш сүйлөмдү тапкыла. Андан кийин ал аркылуу суроо берип, багынынкы сүйлөмдөрдү аныктагыла. Багынынкы сүйлөмдөрдүн түзүлүшү кандай: бир өңчөйбү же бир өнчөй эмеспи?"},{"t":"p","h":"Гүлжандын ушул турган турпаты Өзгөчө сонун көрүндү. Беттеринин нурлары ак жуумал жүзүн албыртып, узун кирпиктери тынымсыз ирмелип, жука эриндери жылмайып, көздөрү моймолжуп кетти. Назик манжалары, ал колун шилтеген сайын, көргөндөрдүн көз отторун чачырата берди."},{"t":"p","h":"Кыш түшкөндө, күн кыскарганда, ал биздин айылга кызматка келген. Келгенден бери эл оозуна алынып, ар кимге кадыры етуп калган. Жыйналышта отурган жаштар анын сөзүн абдан көнүл коюп угушту."},{"t":"p","h":"– Кар кетсе, күн жылыса, жазгы талаа жумуштары башталат, – деп Гүлжан сөзүн улантып жатты. (Н. Б.)"},{"t":"p","h":"313. Көчүргүлө. Көп багынынкылуу татаал сүйлөмдүн бөлүктөрү багыныңкы сүйлөмдүн кайсы түрүнөн түзүлгөнүн аныктагыла. Алардын ар бири баш сүйлөм менен кандайча байланышты?"},{"t":"p","h":"Кычан! жакындап барганда?, өрт чет жагынан тутанып, куураган беделер чатырап?, кыпкызыл жалын асманга көтөрүлүп жаткан экен. (Ш. Б.) 2. Жамийла окууга кирмейинче, өзү бир кызматка турмайынча, Чоңмурун да ага ооз ачпас болду. (К. Б.) 3. Күркүрөгөн күз айлары келип, коон-дарбыз эзилип, ак алтын булайып, мээнеткеч адамдар берекеге белчесинен батып, түштүктө ак төөнүн карды жарылып турган кез эле. (К. Бект.)"},{"t":"p","h":"314. Көп багыныңкылуу татаал сүйлөмдү көрсөткүлө. Баш сүйлөмдөн суроо берип, багынынкы сүйлөмдөрдүн кайсы түрү экенин аныктагыла. Алардын түзүлүшү бир өнчөйбү же бир өнчөй эмеспи?"},{"t":"p","h":"Токтогул көпкө чейин ырдады, эч ким? үргүлөп да койгон жок. Үйдүн ичи да, тышы да кыз-келиндер, жаш балдар, кемпир-чалдар менен? жык толду. Булардын ичинде Алымкан да? бар."},{"t":"p","h":"Токтогул ырдап отурганда?, чогулгандар туурдуктарды жыртып жиберчү эле. Алымканга акындын көзү түштү?. Ай тоодон ашып, күн чыгууга аз калганда, жаштар айыл-айылга тарашты. Кыз-келиндер кетүүгө камынышып, алды узай бергенде, Алымкан жанындагы келинге бирдемени шыбырады. Төртөө калышты, жаштар үй-үйлөрүнө кирип кетишти. (Ж. Б.)"},{"t":"p","h":"315. Берилген мисалды баш сүйлөмдүн маанисинде колдонуп, ага карата бир нече багынынкы сүйлөмдү ойлоп таап, көп чекиттин ордуна жазгыла. Алар багыныңкы сүйлөмдүн кайсы түрлөрү?"},{"t":"p","h":"<span class=\"pg\" data-n=\"117\">117<\/span>1.... биз жолго! чыктык. 2.... кышкы талаа жумуштары башталды. 3. ... жаан басылды. 4. ... жер бети гүлгө оронду. 5. ... эл жымжырт отурушту."},{"t":"p","h":"316. Багынынкыларга карата баш сүйлөмдү ойлоп тапкыла. Аны көп чекиттин ордуна коюп, көчүргүлө. Татаал сүйлөмдүн грамматикалык түзүлүшү жөнүндө айтып бергиле. Сүйлөмдүн ар биринин баш мүчөлөрүнүн астын сызгыла."},{"t":"p","h":"1. Булуттар уйгу-туйгу болуп, күн күркүрөп, чагылган чартылдап, ..."},{"t":"p","h":"2. Кара жер көк тукабадай кулпунганда, келгин куштар келе баштаганда, ... 8. Улуу жагылган от балбылдап, жаштар бийлеп бүткөн кезде, ... 4. Эл-журт жаз эмгегине жарыша киргендиктен, талаада түркүн үндөр өз ара айкашып, ..."},{"t":"p","h":"317. Калтырылып кеткен тыныш белгилерин коюп, көп багынынкылуу татаал сүйлөмдү көчүргүлө. Тыныш белгиси эмне үчүн коюлду? Ушул сүйлөмдөргө синтаксистик талдоо жүргүзгүлө: а) татаал сүйлөмдө канча баш мүчө бар? б) татаал сүйлөмдүн башка түрлөрүнөн айырмасы эмнеде?"},{"t":"p","h":"1. Жаз. Чөп тушарга чыккан кез... Кой короодон узап кетти. Күн ысый берген кезде козулар! бадалга кирип кеткен убакта биз көнөчөгүбүздөн айран ичүүгө отурдук. (М. Э.) 2. Сырттан дабыш угулар замат эшик шарт ачылып шашкалактаган? Көкө ирегеге тура калды. (К. Ж.) 3. Август айы ортолоп? калган убакта чөп чабылып жатканда Сабыр баштаган уч бала окууга келди. (Т. С.)"},{"t":"p","h":"318. Көркөм адабий китептерден же өзүңөрчө ойлоп таап, көп багынынкылуу татаал сүйлөмгө төрт мисал жазып келгиле. Экөөндө багынынкы сүйлөмдөр бир өнчөй, калгандары бир өнчөй эмес түрүндө болсун. Сүйлөмдөрдүн баш мүчөлөрүнүн астын сызгыла."},{"t":"p","h":"319. Текстти көркөм окугула. Ой-пикирди ачык, так, кенен жана толук баяндоодо бир нече багынынкылуу татаал сүйлөм кандай мааниге ээ болорун байкагыла. Татаал сүйлөмдүн дагы кандай түрлөрү колдонулганын атагыла."},{"t":"p","h":"Киши канчалык! көп жер көрсө, ошончолук анын кемтиги толуп, ойсанаасы кенейет. Токтогул Ныязаалыдан нечен түркүн күү, Жеңижоктон төрт санат ырды каныга укту. Акындын ой чабыты кенейип, таланты өөрчүп, эл казынасы чети оюлбаган кенч экенине көзү жетти."},{"t":"p","h":"Жер үлбүрөгөн ак кыроо. Желп эткен жел сезилбейт, аба Токтогул, өнөрпоздор үйгө келгенде, салам айтып, жай сурап, ырдап учурашты. Тентуш Ныязаалы, «ыр пиринин эсин бир чыгарайын» – деп кымыйып <span class=\"pg\" data-n=\"118\">118<\/span>карап турду. Женижок, урушчаак бөдөнөдөй чукчуюп, кыя карап отуруп тыншады. «Эми алымсабак айтышкыла, собол-жооп беришкиле», – деп отурган эл дуулдашып калышты. Жеңижок акырын нускоо айтты: «Ырчы болсон, эрди айт, эрди тапкан элди айт. Эл ичинде тенди айт, пейли жакшы кенди айт». (Т. К.)"},{"t":"p","h":"320. Окугула. Сүйлөмдүн грамматикалык түзүлүшүн өз ара салыштыргыла. Чакчыл түрмөктөн болгон бир өнчөй бышыктооч менен бир нече багынынкылуу татаал сүйлөмдүн өзгөчөлүгүн түшүндүргүлө."},{"t":"p","h":"1. Момун чал, оор дем алып, колун көтөрө албай, көзүн аран ачып, баланы бир карады. 2. Айдалган аныз куру калып, үрөн себилбей, жүрөгүм кансырап жатты. (Ч. А.) 3. Башымдан сылап, мандайымдан өөп, тизеси оозуна тийген кара кемпир бир далайга мени карап отурду. 4. Менин кубанычым койнума батпай, жүрөгүм сүйүнгөндөн ээлигип, толкунданып турдум. 5. Кыз, менин калп айтканыма түшүнүп, үнүн чыгарып, күлүп жиберди. (А. Т.)"},{"t":"p","h":"321. Көчүргүлө. Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Сүйлөмдөрдүн грамматикалык түзүлүшүн аныктагыла."},{"t":"p","h":"1. Кыз, колун сунуп, эркелеткендей болду. 2. – Эртен менен эрте туруп, малга барып, келген жолунду байка. Төөлөрдүн ичинде жез буйлалуу боз инген бар, ошону сууткун. Кыздын айтканындай, иштей баштадым. Ай батууга жакындап, коноктор уктаганда, биз жолго чыктык. (А. Т.)"},{"t":"p","h":"У лг ү: Кыз, колун сунуп, эркелеткендей болду. – Канткендей болду? – эркелеткендей болду – баяндооч; к и м? – кыз – ээ; К а н т и п эркелеткендей болду? – колун сунуп – чакчыл түрмөктөн болгон сыпат бышыктооч. Түзүлүшү боюнча эки тутумдуу жөнөкөй, жайылма сүйлөм."},{"t":"p","h":"322. Бир нече багынынкылуу үч татаал сүйлөм түзүп келгиле. Ар бир сүйлөмдүн баш мүчөлөр“\"'нүн астын сызгыла."},{"t":"p","h":"323. Окугула. Түзүлүшү боюнча татаал сүйлөмдүн кайсы түрлөрү бар? Алардын ар бирине мүнөздүү өзгөчөлүгү кандай?"},{"t":"p","h":"1. Жүрөктү жүрөк сагынса, жолборс да болсо арытат. Жанына кылыч тийгендей, жаралап денди тартылтат. (А. Т.) 2. Жаз – жарыш, күз – күрөш."},{"t":"p","h":"3. Буюмдун кирин самын жууйт, көнүлдүн кирин акыл жууйт. 4. Ата уулу айтканынан кайтпайт, жоомарт бергенин айтпайт. (Мак.) 5. Эл чогулуп, көпчүлүк батпай турган сон, чогулуш сыртта өттү. («КТ»)"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[116,118]},{"title":"§ 35. АРАЛАШ ТАТААЛ СҮЙЛӨМ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"119\">119<\/span>§ 35. АРАЛАШ ТАТААЛ СҮЙЛӨМ"},{"t":"p","h":"Сүйлөмдүн бул түрү тең байланыштагы жана багыныңкы байланыштагы татаал сүйлөмдөрдөн түзүлөт."},{"t":"p","h":"Мисалы, Калк көбөйгөндөн кийин, кыштак, пайда болот, ал шаарга айланат. Мында үч жөнөкөй сүйлөм бар: 1) калк көбөйгөндөн кийин;"},{"t":"p","h":"2) кыштак пайда болот; 3) ал шаарга айланат."},{"t":"p","h":"Булардын ичинен экинчи жана үчүнчү сүйлөм бири-бири менен тен байланышты, тактап айтканда, бири экинчисине мааниси боюнча багынбайт."},{"t":"p","h":"Ал эми биринчи менен үчүнчү сүйлөм өз ара багынынкы абалда байланышты, тактап айтканда, биринчиси үчүнчү сүйлөмгө багынып турат, себеби ал өзүнчө турганда жыйынтыктуу ойду билдире албайт."},{"t":"p","h":"324. Татаал сүйлөмдү таап, анын кайсы түрү экенин (тен байланыштагы, багынынкы байланыштагы, аралаш) көрсөткүлө. Алардын айырмачылыгы эмнеде?"},{"t":"p","h":"– Согуш чыкпаганда, Субанкул менен Касым канча эгин өстүрөт эле, өздөрү да дүйнөнүн канча ыракатына ээ болушар эле! Согуштун болушуна мен макул эмесмин. Адам баласы, бири бирине залал келтирбей, тынчтыкта жашай албайбы? Айтчы чынынды, сырдаш талаам."},{"t":"p","h":"– Мына мен Жермин, мен бардык адам баласына теңмин. Айдоого бир дан таштасанар, жүз дан кылып берем. Чырпык сайсанар, чынар кылып берем. Мага чатагынардын кереги жок."},{"t":"p","h":"Согуштун залалын мен тартпайт дейсинерби. Курман болгон дыйкандардын эмгегин сагынам, кырман өз убагында бастырылбай жатканда, аларды чакырам. (Ч. А.)"},{"t":"p","h":"325. Татаал сүйлөмдөрдү таап, ал канча бөлүктөн түзүлгөндүгүн, жөнөкөй сүйлөмдөр өз ара кандайча байланышканын айтып бергиле. Алар татаал сүйлөмдүн кайсы түрү?"},{"t":"p","h":"1. Устакананын ичи кереметтүү, себеби! туш-тушка ширенди бүркүлөт, оор барскандар күрсүлдөп, чулу темир жадная түшөт. Зор көөрүктөр тынбай үшкүрүнөт, көк жалын үйлөйт, бирок? уста эч бир чаалыкпагансыйт. (Т. С.) 2. Алым эшиктен киргенде, үй ичи жымжырт боло түштү да, төрдөгү бирөө чочугандай ордунан тура калды. (К. Ж.) 3. Поезд өтүп кеткенден кийин, бир топко чейин станцияда эч жан жоктой байкалды, тынчтык өкүм сүрдү. (Ч. А.)"},{"t":"p","h":"326. Аралаш татаал сүйлөмгө үч мисал жазып келгиле. Анын тутумунда татаал сүйлөмдүн кайсы түрлөрү болот? Татаал сүйлөмдүн кайсы түрлөрүн билесинер?"},{"t":"p","h":"<span class=\"pg\" data-n=\"120\">120<\/span>327. Таблицага көнүл бургула. Көп багыныңкылуу менен аралаш татаал сүйлөмдөрдүн айырмачылыгын түшүндүргүлө."},{"t":"p","h":"Көп багынынкылуу татаал сүйлөм"},{"t":"p","h":"Тарам-тарам суулар акса, жер тамыры көктөсө, анда бак-дарактар көбөйөт эле."},{"t":"p","h":"Биз аттанганда, асман бүркөлүп, күн салкындап турган."},{"t":"p","h":"Күн чыкканда, жаан басылып, айлана шанга бөлөнөт."},{"t":"p","h":"Аралаш татаал сүйлөм"},{"t":"p","h":"Эшик ачылды да, чоң энеси үйгө киргенде, Динар ангемесин кайталап окуй баштады."},{"t":"p","h":"Турмуш өзү сонун турбайбы, үтүрөйгөн кайгы дарбазаны ачканча, кош кубаныч кирип келди."},{"t":"p","h":"Аба конур тартты, кок майсан чөптөр жытын аңкытып, бак-дарактар көркүнө келе түштү."},{"t":"p","h":"328. Татаал сүйлөмдөрдүн курамында канчадан сүйлөм бар? Алардын түзүлүшүн жана өз ара байланышуу жолдорун аныктагыла. Тен байланыштагы татаал сүйлөмгө синтаксистик талдоо жүргүзгүлө."},{"t":"p","h":"Тил, албетте, өзгөрөт, мен муну талашпайм. Ал эмес, дарактын жалбырактары жыл сайын алмашат, бири куурайт, анын ордуна жаңысы өсөт. Дарак жыл өткөн сайын коюу да, бутактуу да, бекем да боло берет. Ошол сыяктуу эле тил да өсүп-өнүгөт, жаны сөздөр пайда болот, айрымдары колдонуудан чыгып калат. (Р. Гамзатов.)"},{"t":"p","h":"329. Өзүнөр аралаш татаал сүйлөмгө үч мисал түзүп келгиле. Анын тутумундагы сүйлөмгө грамматикалык түзүлүшү боюнча мүнөздөмө бергиле. Аралаш татаал сүйлөм көп багынынкылуудан кандайча айырмаланат?"},{"t":"p","h":"330. Окугула. Айтылыш максаты жана грамматикалык түзүлүшү боюнча кандай сүйлөмдөр бар? Алар жөнүндө эмне билесинер? Тыныш белгилердин коюлушун түшүндүргүлө."},{"t":"p","h":"Шолоктоп ыйлап! ат жалына жыгылдым?. Мен ыйлап бүткөнчө, Дүйшөн, башымдан сылап, унчукпай турду."},{"t":"p","h":"– Кой эми, Алтынай, жол тарталы. Турмуш ушуну менен эле токтоп туруп албайт да. Же сен таптакыр эле жакшылыктан түнүлдүнбү? Кой айланайын?, антпе, антпегин!"},{"t":"p","h":"<span class=\"pg\" data-n=\"121\">121<\/span>Адырларды аралап, биз шылдырап аккан сууга жеткенде, Дүйшөн менин жүзүмө эркелей карады:"},{"t":"p","h":"– Аттан түшүп, бети-колунду жууп алчы! Жуунгун, бардыгын эстен чыгарып, унуткун. Суудан жаңы киши, таза киши болуп чыга кел, макулбу."},{"t":"p","h":"331. Көчүргүлө. Синтаксистик талдоо жүргүзгүлө: а) сүйлөмдүн түзүлүшүн аныктагыла: жөнөкөйбү же татаалбы? б) сүйлөм мүчөлөрүнүн астын сызгыла; в) тыныш белгилеринин коюлушун түшүндүргүлө."},{"t":"p","h":"Пайдалуу достон үчөө, зыяндуу достон үчөө болот. Пайдалуу досторго булар кирет: чындыкты бетке айткан, сөздү түз сүйлөгөн, көп билген адамдар. Эки жүздүү, калп айткан, маныздар – булар зыяндуу адамдар. («ЗО»)"},{"t":"p","h":"332. Түзүлүшү боюнча жөнөкөй, татаал сүйлөмдөрдүн кандай түрлөрүн билесиңер? Алардын ар бирине мүнөздүү кандай өзгөчөлүктөр бар? Төмөнкү сүйлөмдөрдөн мисал келтиргиле."},{"t":"p","h":"1. Күн дайым эле күлкү менен чыгып, кубаныч менен батпайт. Анын көзүн жөө туман, кара булут калкалап калган учурлар да болот. Ошондой эле адам баласы да кубаныч менен өкүнүчкө дуушар болот. (Ш. Б.) 2. Жалкоо күн батканга сүйүнөт, эпкиндүү күн батканга күйүнөт, анткени жалкоо эртерээк жатып уктаганды кааласа, эпкиндүү жумушунун көбүрөөк бүтүшүн каалайт. (Н. Б.) З. Жокту жок издеген табат, жолдошу шайыр болсо, жолоочунун кумары канат. (К. Ж.)"},{"t":"p","h":"333. Татаал сүйлөмдүн кандай түрлөрүн билесин? Бул боюнча схемага көнүл буруп, алардын ар бирине экиден сүйлөм түз жана алардын түзүлүш өзгөчөлүгүн түшүндүр."},{"t":"v","l":["тең байланыштагы","Татаал сүйлөм багынынкы байланыштагы"]},{"t":"h3","h":"аралаш"},{"t":"p","h":"334. БК. Тексттин түзүлүшү кептин кайсы түрүнө таандык? Текстте сүйлөмдүн кайсы түрлөрү колдонулду? Алардын байланышуу жолдорун белгилегиле."},{"t":"h3","h":"БАЛЕТ АСМАНЫНДАГЫ АК КУУ"},{"t":"p","h":"Искусствонун дагы бир улуу сыры, ички касиети балет өнөрү аркылуу ачылат. Балеттин артыкчылыгы мына мында, окуялар, кубулуштар сөз менен эмес, бий жана үнсүз ишарат аркылуу түшүндүрүлөт."},{"t":"p","h":"<span class=\"pg\" data-n=\"122\">122<\/span>Эгерде биз турмушту бий аркылуу түшүнгүбүз келсе, анда балет өнөрүнүн чебери Б. Бейшеналиева көз алдыбызга келет. Ал өз өнөрүнүн туу чокусуна жетип, кыргыз балетин көп өлкөлөргө тааныткан. Аны кыргыз хореографиясынын устаты десек да болот."},{"t":"p","h":"Б. Бейшеналиеванын татынакай талантына көптөгөн өлкөлөрдүн балет сүйүүчүлөрү таазим кылышкан. Кыскасы, анын ак куудай учкан элеси ар дайым элдин эсинде. («КТ») 335. Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө, алардын ар бири кайсы сөз түркүмүнөн болду? Түзүлүшү боюнча кандай сүйлөмдөр бар, алар жөнүндө эмне билесинер?"},{"t":"p","h":"Бир сөз үчүн далай улуу жортуулдар болгон, килейген шаарлар тургузулган. Бир сөз үчүн нечен адамдын өмүрү кыйылган учурлар да бар. Бир эле кыргыз деген сөз бир зор мамлекетти туюндурат."},{"t":"p","h":"Бир эле тил канча сан кишилердин башын бириктирип турат, тили болбогон эл чачылып кетет, ошон үчүн ар бир элдин ата мекени, эне тили бар. Ошентип, адамды бир эле сөздөн билсе болот. Бир эле сөздө не деген тарых, не деген керемет күч бар! («КТ») 336. Көчүргүлө. Кандай сүйлөмдөр (жөнөкөй, татаал) бар? Аларга синтаксистик талдоо жүргүзгүлө. Тыныш белгилеринин коюлушун түшүндүргүлө."},{"t":"p","h":"«Сабырдуу бол, айланайын, сабырдын түбү – сары алтын», – деген сөз бар. Ушундай сөздүн өзү эле – жаштар үчүн улуу тарбия. Биздин айылда мен бала кезден билген бир адам бар. Мен анын адамдык сапаттарын үлгү тутам, токтоо мүнөзүнө, сылык-сыпаа мамилесине суктанамын."},{"t":"p","h":"Ал табиятынан эмгекчил, жөнөкөй. Ылайым эле, ушундай пейли кенен, кадырман карыяларыбыз көбөйө берсин. («КТ»)"},{"t":"p","h":"337. Тексттерди көркөм окугула. Татаал сүйлөмдү көрсөткүлө, анын кандай түрлөрү бар?"},{"t":"h3","h":"ТЕРМЕ"},{"t":"v","l":["Кыз кыялдуу кылтындап,","Жакшы ат камчы салдырбайт.","Жакшы адамдын белгиси,","Көнүлүндү калтырбайт.","Жашылданган көк шибер,","Жайдын көркү турбайбы,","Жабыраган көп жылдыз","Айдын көркү турбайбы.","Көтөрүлүп көп сүйлөп,","Болбос ишке күлбөгүн.","Акылың жетсе ар ишке,","Билип туруп сүйлөгүн. (Т.)","Жамандык башка түшкөндө,","Жакын кандай, жат кандай?","Турпатына карасак,","Туйгун кандай, каз кандай? (О. Б.)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"123\">123<\/span>338. Татаал сүйлөмдүн түрлөрүн ажыраткыла. Алардын түзүлүш өзгөчөлүктөрү кандай? Түшүндүргүлө."},{"t":"p","h":"Булардын сөзүн тыңшап отурган киши акырын гана балдарына сүйлөдү:"},{"t":"p","h":"– Кагылайын кулундарым! Силер менин бактымсынар, силер аман болсонор, мөмөлөгөн бакыт – ошол. Менден бактылуу ким бар?! Силер өссөнөр, бакыт силердин колунарда болот."},{"t":"p","h":"Күндөрдүн биринде кандын вазири акылмандан сурады: – Сен айтчы деги, бактылуу киши азыр барбы?"},{"t":"p","h":"Акылман катуу каткырып күлдү:"},{"t":"p","h":"– Хан өлсө, сен зынданга кирсен, байдын казынасы чачылса, бактылуу кишилер ошондо жаралат. («АТ»)"},{"t":"p","h":"339. -са, -ып мүчөлөрүн сүйлөмдүн баяндоочуна улап жазып, багынынкы байланыштагы татаал сүйлөм түзгүлө (ар бирине экиден мисал). Алардын тен байланыштагы татаал сүйлөмдөн айырмасы кандай?"},{"t":"p","h":"З40. Төмөндө баш сүйлөмдөр берилди. Мааниси боюнча ылайык келүүчү багыныңкы сүйлөмдөрдү ойлоп таап, татаал сүйлөм түзгүлө. Багынынкы сүйлөмдөр кандай мааниде колдонулду?"},{"t":"p","h":"1. ... биздин айылдаштар жогорку окуу жайларына окууга өтүү учун кетишти. 2. ... биз Ысык-Көлгө эс алууга барабыз. 3. ... минген аты баспай койду. 4.... классташтар футбол ойноп жатышыптыр."},{"t":"p","h":"341. Көчүргүлө. Синтаксистик талдоо жүргүзүп, сүйлөмдүн түзүлүшүн аныктагыла: жөнөкөй же татаал; алардын кайсы түрү?"},{"t":"p","h":"1. Эмесе, курдаштар, мени ошондо ээрчитип баргыла, мен алардын баласымын. 2. Таягын колуна алып, калгандан күтүп турган атам менен кучакташып көрүштүм. (А. Т.) З. Эртеден бери көйкөлүп, тынч жаткан Ысык-Көл да чайпала баштады. 4. Күндүн ысыгы катуу тийип, балдар көлөкөдө отурушат. («КТ»)"},{"t":"p","h":"342. Баш жана багынынкы сүйлөмдөрдү өз-өзүнчө ажыраткыла. Алар бири-бири менен кандай мүчөлөр аркылуу байланышат?"},{"t":"p","h":"1. Калыстыгын болбосо, акимдигин не пайда. Кайрымдуу жоомарт болбосо, калын малын не пайда. 2. Эрге нөөмөт! келгенде, элиртип күлүк ат байлайт. Жерге нөөмөт келгенде, көк чымырап, гүл жайнайт. («ЗО») 3. Алиман угуп койбосо экен деп, оозумду басып, чүмкөнө бердим. 4. Сүйлөөгө дарманым келбей, мен ыйлап эле тура бердим. Ыйлаба, Алтынай. Улам күч"},{"t":"p","h":"' Нөөмөт – учуру, доору."},{"t":"p","h":"<span class=\"pg\" data-n=\"124\">124<\/span>алып ылдамдаган поезд күпүлдөп, мен казактын даркан талаасы менен жаны турмушка бара жаттым. (Ч. А.)"},{"t":"p","h":"343. БК. Тексттин мазмуну менен таанышкыла, андагы негизги ой эмне жөнүндө айтылды. Тилдик кандай каражаттар колдонулду? Бул текст кептин кайсы түрүнө кирет? Кеп жөнүндө айтып бергиле."},{"t":"h3","h":"АКЫЛМАНДЫН ЖООБУ"},{"t":"p","h":"Хандын ооруганы бир жылдан ашып кеткен эле. Эч кандай табып анын оорусуна дары таба албады. Кулак угуп, бут жеткен жердеги билгичтердин баарын жыйнады да, хан аларга суроо берди:"},{"t":"v","l":["– Бул оорунун дарысы барбы?","Акылман билгичтер бир кишидей жооп беришти:","– Бул оорунун дарысы жок."]},{"t":"p","h":"Хан каарына алды да, булардын ичинен кырк бир кишини тандап алып:"},{"t":"p","h":"– Оорунун аягы эмне менен бүтөт? – деди."},{"t":"p","h":"Буга эч ким жооп бере алган жок."},{"t":"p","h":"– Буга жооп таппасанар, дарынын атын билбесенер баарынардын башынарды аламын, – деди хан."},{"t":"p","h":"Билгичтер үч күнгө мөөнөт сурашты, өздөрүнчө кенешип жооп бермек болушту."},{"t":"p","h":"Билгичтердин баары жооп таба алышпай, ар кимиси өз арманын айтышты. Үч күндүк мөөнөт да бүттү. Хандын вазирлери келишип:"},{"t":"v","l":["– Хан силерден жооп күтөт. Таптынарбы, жокпу? – дешти.","Отурган кырк бир кишинин бири да унчуккан жок.","Алардын көзүнө өлүм гана элестеди, ыйлай башташты."]},{"t":"p","h":"Жупуну кара киши, ордунан тура калып, кулдук кылды да: «Жооп даяр, ханга айта бериниз», – деди."},{"t":"v","l":["Кырк бир киши жалгыз кишинин колун өпкүлөштү:","– Дарысы табылдыбы, жаныбыз калабы?"]},{"t":"p","h":"– Жаныбыз калат, дарысы табылбайт. Өздөрүнө өздөрү жооп бергендей кыламын. Аны силер хандын алдында уккула."},{"t":"p","h":"– Алдаяр ханым! Сөзүнүз эки бол

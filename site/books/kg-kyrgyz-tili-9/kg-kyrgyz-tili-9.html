 сүйлөмдөгү ойдун мезгилин билдирди, ага мааниси боюнча багынды."},{"t":"p","h":"Эгерде ушул сүйлөмдү өзүнчө алып карасак, тыянактуу ойду билдире албайт, ошон үчүн Майсалбектен кат келди деген сүйлөм менен ажырагыс бирдикте колдонулат."},{"t":"p","h":"<span class=\"pg\" data-n=\"48\">48<\/span>Ошентип, жөнөкөй сүйлөмдөрдүн бири экинчисине багынып турса, ал багыныңкы байланыштагы татаал сүйлөм деп аталат."},{"t":"p","h":"Демек, татаал сүйлөмдү түзүп турган сүйлөмдөр өз ара тен укукта болушат, же болбосо, бири экинчисине багынат. Ушуга байланыштуу татаал сүйлөмдүн эки туру бар: 1) тен татаал сүйлөм; 2) багынынкы байлан ыш тагы татаал сүйлөм."},{"t":"p","h":"115. Текстти окугула. Татаал сүйлөмдү атагыла, ал канча жөнөкөй сүйлөмдөн түзүлдү? Татаал сүйлөмдүн кайсынысында жөнөкөй сүйлөмдөр өз ара тен байланышты?"},{"t":"p","h":"Эртеден кечке Лена дарыясынын үстүндө саякатта болдук. Лена мелтиреп гана турат, акканы билинбейт."},{"t":"p","h":"Жазылыгы жагынан эч кайсы дарыядан кем калбайт. Табигат бийик аскаларды пайда кылгандыктан, «Ленанын жаагы» деп аталган бийиктик өтө эле кооз. Биз барганда, Лена дарыясы көркүнө чыгып турган экен."},{"t":"p","h":"Кышында Ленанын үстү менен машиналар жүрө берет, курулуш материалдары ташылат. Ленада көп кемелер сүзүп жүрүшөт, алардын бири «Ысык- Көл» деп аталыптыр. (Т. У.)"},{"t":"p","h":"116. Окугула. Татаал сүйлөмдү көрсөткүлө. Алардын кайсынысында жөнөкөй сүйлөмдүн бирөө экинчисине багыныңкы байланышты?"},{"t":"p","h":"1. Бүгүн бала Кароол-Дөбөгө чыкты. Күнгөйгө дүрбү салса, бул тараптын тоолору жапызыраак. Эриген коргошундай көлкүлдөп, Ысык-Көл жатат. Көлдүн төрүнө көз жетпейт, көгүлтүр суу менен көк асман биригип кеткендей. Бала дүрбүсүн кайра көлгө бурду. Ак кеме али көрүнбөйт. (Ч. А.)"},{"t":"p","h":"2. Адыры болбой, тоо болбойт,"},{"t":"v","l":["Аркары болбой, зоо болбойт.","Карысы болбой, эл болбойт,","Камышы болбой, чөл болбойт. (Т. М.)"]},{"t":"p","h":"117. Ата-эненерден сурап, макал жана учкул сөз жазып келгиле. Грамматикалык түзүлүшү боюнча алар кандай сүйлөмдөр? Түшүндүргүлө."},{"t":"p","h":"118. Окугула. Жыйынтыктуу ой берилдиби? Анда эмесе, мааниси боюнча байланыштуу болгон экинчи сүйлөмдү ойлоп таап, көп чекиттин ордуна жазып, татаал сүйлөмдөрдү түзгүлө. Тыныш белгилерин койгула. Мындай түзүлүштөгү татаал сүйлөм кандайча аталат?"},{"t":"p","h":"1. Жакшынын өзү өлсө да... 2. Биз айылдан келгенче 8З. Кыздар үйгө келгенде ... 4. Ызгаардуу кыш келип... 5. Эрте айдалган эгиндер сенселип ‚.. 6. Уста кандай болсо..."},{"t":"p","h":"<span class=\"pg\" data-n=\"49\">49<\/span>119. Көп чекиттердин ордуна экинчи сүйлөмдү ойлоп таап, тең байланыштагы татаал сүйлөмдөрдү түзгүлө. Дептеринерге жазгыла да, баш мүчөлөрдүн астын сызгыла, Татаал сүйлөмдө канча баш мүчө болот? Ал эми жөнөкөй сүйлөмдөчү?"},{"t":"p","h":"1. Аларга сен алтын бергенин жок... 2. Күн чыкты... 3. Үчүнчү күнү күн ачылды, туман тарады ... 4.... кыш түштү. 5.... жаман сөз баш жарат."},{"t":"p","h":"120. Окугула, Татаал сүйлөмдөрдү таап, аларды бири бирине салыштыргыла. Кандай өзгөчөлүктү байкадынар? Кайсынысында жөнөкөй сүйлөмдөр тен укукта, кайсынысында багынынкы абалда байланышты?"},{"t":"p","h":"Жекшемби күнү курбулар кайра көл жээгине чыгышты. Тигил көкөмерендүү булунда күлкү чыгат, тамашалуу кишилер отурушат. Шамбеттин алп денеси чымырап, жүрөгү кубанычта согот. Алыста аскалар каалгыйт, Шамбет кубанычта демин терең алса, колунда кесе толо кымыз мелт-калт этет. Жээк баягыдай, жер-суу баягыдай! Элебес көрүнбөйт."},{"t":"p","h":"Курдаштары Элебести эстешет. Кыялын айтышат. Буларды четтен байкап, тигиндейде карыялар отурушат."},{"t":"p","h":"Пай-пай, эмгек сүйгөн кишилер алп экен го, эмгек өлбөс экен го! (Т. С.)"},{"t":"p","h":"121. Тексттерди көркөм окугула. Татаал сүйлөмдүн кайсы түрү (тен байланыштагы же багыныңкы байланыштагы) колдонулду? Бул сүйлөмдөрдүн айырмасын айтып бергиле."},{"t":"v","l":["1. Тар элен, таштак элен, такыр элен,","Киргил суу шылдыраган арык менен.","Мен өстүм, жаш көбөйдү, сен көгөрдүн,","Жашымды, көгөрсүн деп, сага бергем. (А. О.)","","2. Күн жарыгы тийгендей,","Күлгөнү кызык баланын. (Ж.)","","3. Жанында өлүм турса да,","Жалтантып кылыч сунса да,","Жабыгып журек кансырап,","Ирмелбей кезу турса да,","Үмүткө тойбойт адамзат. (А. Т.)"]},{"t":"p","h":"122. «Келечек жаштарга таандык» деген темада ой жүгүртүү мүнөзүндөгү дилбаян жазгыла. Татаал сүйлөмдү колдонгула."},{"t":"p","h":"<span class=\"pg\" data-n=\"50\">50<\/span>123. Схемага көңүл бургула. Татаал сүйлөмдүн түрлөрүн эсинерде сактагыла, алардын ар бирине үчтөн мисал ойлоп жазгыла. Сүйлөмгө синтаксистик талдоо жүргүзгүлө."},{"t":"v","l":["тең байланыштагы татаал сүйлөм","Татаал сүйлөм"]},{"t":"p","h":"багынынкы байланыштагы татаал сүйлөм"},{"t":"p","h":"124. Сүйлөм мүчөлөрү боюнча талдоо жүргүзүп, сүйлөмдүн түзүлүш өзгөчөлүгүн аныктагыла."},{"t":"p","h":"1. Биз аттанганда, асман бүркөлүп, күн салкындап турган эле. (М. Э.) 2. Казактын кең талаасы... Тууган жердин шамалы коюн-колтукка кирип, Эдигейди кучакташып тосуп алды. (Ч. А.) 3. Бүт дитин коюп, Токтогул ырдап жатты. (Т. К.)"},{"t":"v","l":["4. Ак кар, сен сүйкүм көрүнгүн,","Ашыгы болуп жеримдин.","Берет деп ак кар ак нанды,","Пейли толсун элимдин.","Тазалап кочкул абаны,","Дарысы болгун өмүрдүн! (С. А.)"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"51\">51<\/span>ТЕҢ БАЙЛАНЫШТАГЫ ТАТААЛ СҮЙЛӨМ"}],"sub":[{"title":"ТЕҢ БАЙЛАНЫШТАГЫ ТАТААЛ СҮЙЛӨМ","b":35}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[48,51]},{"title":"&amp; 16. ЖӨНӨКӨЙ СҮЙЛӨМДӨРДҮН ОРТОСУНДАГЫ МААНИЛИК КАТЫШТАР","blocks":[{"t":"h3","h":"&amp; 16. ЖӨНӨКӨЙ СҮЙЛӨМДӨРДҮН ОРТОСУНДАГЫ МААНИЛИК КАТЫШТАР"},{"t":"p","h":"Тен байланыштагы татаал сүйлөмдөр өзүлөрүнүн маанилери боюнча бири бирине багынбаган, тен укуктагы жөнөкөй сүйлөмдөрдөн түзүлө тургандыгы белгилүү. Алардын ортосунда төмөнкүдөй маанилик катыштар болот:"},{"t":"p","h":"1. Те н м а а н и л е ш. Сүйлөмдөр тен мааниде колдонулат: Жакшы кыз – жакадагы кундуз, жакшы жигит – асмандагы жылдыз. (Мак.)"},{"t":"p","h":"2. М ез г и л д е ш. Жөнөкөй сүйлөмдөр бир мезгилде же ар мезгилде, же биринин артынан бири болгон окуянын иретин билдирет: 1. Таң атты, жер бети кыймылга келе баштады. (Н. Б.) Бир мезгилде. 2. Бороон-чапкындуу кыш кетти да, жадыраган жаз айы келди. (М. Э.) Ар мезгилде болду."},{"t":"p","h":"3. Кар ш ы л а ш, Сүйлөмдөр бири бирине каршы мааниде айтылат: Оору кетет, адат кетпейт. (Мак.)"},{"t":"p","h":"4.Себеп-натый ж алаш. Сүйлөмдөр өз ара себеп-натыйжалаш, же тескерисинче, натыйжа-себеп маанисинде колдонулат: Ат мүдүрүлүп кетти, Ажар үстүнөн кулап түштү. (К. Б.)"},{"t":"p","h":"5. Чечмелөө (түшүндүрүү). Жөнөкөй сүйлөмдүн бирөө жалпы айтылып, калгандары анын маанисин толуктайт: Бектурган бүгүн бактылуу: эки уулу бала-чакасы менен кашында, алар ойноп-күлүп конокто отурушат. (А. Т.) Мында Бектурган бүгүн бактылуу деген сүйлөмдүн маанисин калгандары чечмеледи."},{"t":"p","h":"125. Тен байланыштагы татаал сүйлөмдүн бөлүктөрүнүн (сүйлөмдөрдүн) ортосундагы маанилик карым-катыштарды аныктагыла. Татаал сүйлөмгө тыныш белгиси кандайча коюлат?"},{"t":"p","h":"1. Айтор*, тууган жер Мыскалдын көзүнө алда эмедей көрүнөт: теребел көк жашыл тартат, ой-тоо кайкалайт. 2. Устакана кереметтенет, туш-тушка ширенди бүркүлөт*. (Т. С.) 3. Күз өттү, кыш келди. 4. Сен улуусун, улуулар ар дайым кичүүлөрдүн күнөөсүн кечүүгө тийиш. 5. Сураган тоодон ашат, сурабаган түздөн адашат*. (Мак.)"},{"t":"v","l":["<span class=\"pg\" data-n=\"52\">52<\/span>6. Ачуунун баары кас эмес,","Адилет бар мойнунда.","Күлгөндүн баары дос эмес,","Котур ташы койнунда. (А. Т.)"]},{"t":"p","h":"126. Тен байланыштагы татаал сүйлөмдү көрсөткүлө. Эмне учун тен байланыштагы деп аталат? Андагы жөнөкөй сүйлөмдүн баяндоочтору кандай формада аяктайт?"},{"t":"p","h":"1. Артыкча, быйылкы кыш каарында*. Жер жүзү аппак. Улуу тоонун бөрүсүндөй, кез-кез бороон улуйт, борошо сапырылат. Темир аяз чыкылдайт, алкынган тоо суулары төнгөн. (Т. С.)"},{"t":"p","h":"2. Акылдуулардын арасында акылга акыл кошулат, акмактардын арасында акыл акырындап жошулат. Пайдасыз жаткан темирди дат басат, акпай турган сууну балыр басат, ал эми пайдаланбаган акылды ман басат."},{"t":"p","h":"127. Мааниси жагынан жакын болгон сүйлөмдү ойлоп таап, көп чекиттин ордуна жазгыла. Тыныш белгисин койгула. Натыйжада, татаал сүйлөмдүн кайсы түрү түзүлдү? Анын грамматикалык түзүлүшү жөнүндө айтып бергиле."},{"t":"p","h":"1. Бүгүн күн чайыттай ачык ... 2. Бул сүрөт мен үчүн дүйнөдө эн кымбаттуу зат, анткени ... 3. ... бир аздан кийин Ай көтөрүлдү ... 4. Турмуш өзү сонун турбайбы ... 5. Билимдүүнүн сөзү өткүр... 6. Жакшы сөз таш жарат..."},{"t":"p","h":"128. Окугула. Тен байланыштагы татаал сүйлөмдү тапкыла. Аны көчүрүп жазып, сүйлөм мүчөлөрүнүн астын сызгыла. Алар жөнөкөй сүйлөмдүн кайсы түрлөрүнөн түзүлгөндүгүн сан менен көрсөткүлө."},{"t":"p","h":"1. Күн өттү, ай өттү, кыш түштү. 2. Чолпон-Атага келдик. Машина токтоду, эл ураалап кыйкырды. Деректир жыйналышты ачты. Акырында сөз мага берилди, мен ордумдан турдум. (К. Б.) 3. Ак күмүштөй колу бар, ак кайындай бою бар. (Ж. Б.) 4. Түн суук, кыш ышкырат, үйлөрдү ачып. Ыйлатат, урат, ойнойт, ыза кылат, жыргалдуу жазды ала качып. (А. О.)"},{"t":"p","h":"У лгу: Күн өттү, ай өттү, кыш түштү. Бул – татаал сүйлөм. Түзүлүшү: эки тутумдуу + эки тутумдуу + эки тутумдуу сүйлөмдөр. (2+2+2)"},{"t":"p","h":"129. Татаал сүйлөм канча жөнөкөй сүйлөмдөн түзүлдү? Алардын ортосундагы маанилик катышты аныктагыла. Тыныш белгисинин коюлушу жөнүндө айтып бергиле."},{"t":"p","h":"<span class=\"pg\" data-n=\"53\">53<\/span>1. Төрт түрдүү кулк-мүнөздүн акыры төмөнкүчө бүтөт: өжөрлүк уятка калтырат, женилдик өкүнүчкө алып келет, заар тил өчөштүккө жол берет, жалкоолук басырынууга алып келет. 2. Мен үчүн аялзатынын эки түрү маалым: биринчиси бизди азапка салат, экинчиси биздин азабыбызды тартат. Биздин азабыбызды тарткандан мен бирөөнү гана билем, ал – менин энем! («30»)"},{"t":"p","h":"130. Тен байланыштагы татаал сүйлөмдү көрсөткүлө. Аларды көчүрүп жазып, схемасын түзгүлө. Жөнөкөй сүйлөм үчүн чарчы кашааны пайдалангыла. Жөнөкөй сүйлөмдөр бири-бири менен кандайча байланышты?"},{"t":"p","h":"1. Саламатсынарбы, асыл зат теректер! Мынча эмне мундана шуулдайсынар?“\" Кыш келе жатат, кейип турасынарбы? Ооба, бороон-чапкындуу кыш да болот, бирок жаз да келет. Кейибегиле, биз силерди жакшылыкка багыштап тиккенбиз. Силер толукшуп бүрдөгөн жаздын биринде жениш да келер, тынчтык да келер..."},{"t":"p","h":"Ошол жерден айылда турган жаңы мектепти көрдүм, биздин мектептин орду жок. Ушуну менен мен жолго чыктым да, кайра арабага түшүп, станцияга кеттим. (Ч. А.)"},{"t":"p","h":"Ү лгү: Кыш келе жатат, кейип турасыңарбы?"},{"t":"p","h":" ], ]- жөнөкөй сүйлөмдөр бири-бири менен интонация аркылуу байланышты."},{"t":"p","h":"131. Мезгилдеш жана карама-каршы мааниде байланышкан сүйлөмдөрдөн тең байланыштагы татаал сүйлөм (ар бирине үчтөн) түзүп келгиле. Тыныш белгисин түшүндүргүлө. Эгерде жөнөкөй сүйлөмдөрдүн ортосунда маанилик жактан карым-катыш болбосо, кандай болор эле?"},{"t":"p","h":"132. Жөнөкөй сүйлөмдөрү тең мааниде, себеп-натыйжа жана чечмелөө маанисинде колдонулган татаал сүйлөмдү көрсөткүлө. Алардын тыныш белгиси жөнүндө айтып бергиле."},{"t":"p","h":"1. Ар бир эл рухий байлыктардын эн керектүүлөрүн улам кийинки муундарга жеткирип турат. Ошондой байлыктардын бири – макалдар. Адатта, эл макалдарды жогору баалашкан, аларды сөздүн гүлү, сөздүн бермети деп коюшкан. Бул боюнча төмөнкү макалдардын маанисине көңүл бургула. Жылдыздын көбү – асмандын көркү, билимдин көбү – адамдын көркү."},{"t":"p","h":"2. Мылтык тарс этти, Жапаркул жерде сулап жатты. Эл чогулуп калды. Мен түшө калып Жапаркулдун башын жөлөдүм, ыйлап жибердим. (К. Б.)"},{"t":"p","h":"3. Сергей курбусу жөнүндө өзү билген чындыкты баяндоого отурду. Үй ичи Сергейдин көзүнө баягыдай: акталган дубалда илинип сүрөттөр турат, ортодогу чон үстөлдө баягы эле узун ак дасторкон жабылган. (Т. С.) <span class=\"pg\" data-n=\"54\">54<\/span>133. Окугула. Тен байланыштагы татаал сүйлөмдөрдү көчүргүлө жана аларга синтаксистик талдоо жүргүзгүлө."},{"t":"p","h":"1. Субанкул келип тамактанды да, түндөп айылга кетти. 2. Жер энем, биринчи жолу сага ошондо кайрылдым. Эсиндеби, менин айткандарым? (Ч. А.) 3. Баатыр бир өлөт, артында данкы калат. Коркок мин өлөт, артында тарпы калат. 4. Азаттыкты каалабаган адам жок: адилет адам азаттыкты жалпыга каалайт, адилетсиз жалгыз өзүнө каалайт. (Мак.)"},{"t":"p","h":"134. Татаал сүйлөм жөнөкөйдүн кайсы түрлөрүнөн (бир же эки тутумдуу) түзүлдү? Алардын ортосундагы маанилик карым-катышты аныктагыла. Түзүлүшүн сан менен белгилеп, татаал сүйлөмдүн схемасын көрсөткүлө."},{"t":"p","h":"1. Кечигебиз, тез чурка деп тентек кызым жетеледи. 2. Үчүнчү күнү бороон басылды, асман кирсиз ачылды. (Т. С.) 3. Биз аттанганда, күн салкындап турган. (М. Э.) 4. Ажар чочуп кетти, жүрөгү туйлай баштады, бүткөн боюна калтырак кирди. (К. Б.) 5. Жалкоо күн батканга сүйүнөт, эпкиндүү күн батканга күйүнөт. 6. Ата жакшы – уул жакшы, эне жакшы – кыз жакшы. (Мак.) У лг ү: Кечигебиз, тез чурка деп тентек кызым жетеледи. – Татаал сүйлөм. 1) кечигебиз (бир тутумдуу); 2) тез чурка деп тентек кызым жетеледи (эки тутумдуу); 1+2."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[52,54]},{"title":"&amp; 17. ТЕҢ БАЙЛАНЫШТАГЫ ТАТААЛ СҮЙЛӨМДҮН ТЫНЫШ БЕЛГИЛЕРИ","blocks":[{"t":"h3","h":"&amp; 17. ТЕҢ БАЙЛАНЫШТАГЫ ТАТААЛ СҮЙЛӨМДҮН ТЫНЫШ БЕЛГИЛЕРИ"},{"t":"p","h":"1. Сүйлөмдөрдүн ортосунда мезгилдеш, каршылаш, тен маанилеш, себеп-натыйжа маанисиндеги карым-катыштар болсо, жөнөкөй сүйлөмдүн араларына ү т ү р коюлат: 1. Жаан күчөдү, мен саманга көмүлүп жата бердим. (Ч. А.) 2. Жашыл оңот, жаш чоңоёт. (Мак.)"},{"t":"p","h":"2. Биринчи сүйлөмдө негизги ой берилип, калгандары анын маанисин чечмелеп турса, биринчисинен кийин кош чекит, кийинкилеринин араларына ү т ү р коюлат: Чаке, бардыгы өз жайында: айдоо аянты кеңиптир, койлоруңа төл кошулуптур. (Т. С.)"},{"t":"p","h":"Тен байланыштагы татаал сүйлөмдө коюлуучу тыныш белгилеринин схемасына көңүл бургула:"},{"t":"p","h":"<span class=\"pg\" data-n=\"55\">55<\/span>135. Окугула. Үтүр, сызыкча жана кош чекит белгилеринин эмне учун коюлганын түшүндүргүлө. Татаал жана жөнөкөй сүйлөмдөрдүн кандай түрлөрү бар?"},{"t":"p","h":"1. Төгүлдү, балкыды, нур мемиреди,"},{"t":"v","l":["Гүлдөрдөй күлмүн-күлмүн берди белги.","Жыргал да, кубаныч да жана бакыт","Каптады, карагыла биздин жерди! (А. О.)"]},{"t":"p","h":"2. Баатыр адам – тирүү адам, кайраттуу адам – соо адам. (Мак.) З. Бурма капаланган болуу керек: узун кирпиктери сууланып турат, өнү өчүнкү, кабагы бүркөө. (К. Б.)"},{"t":"p","h":"4. Кары да, жаш да – баары тен ишке чыгышкан. – Каныбек эмне кылып жатат? – Билбейм. (К. Ж.)"},{"t":"v","l":["5. Адамдан артык билгич бол, Төштүк,","Кыргыйдан кыраан илгич бол, Төштүк!","Мен бугудай моюн бурайын,","Өгөөгө жакын турайын, Төштүк. (С. К.)"]},{"t":"p","h":"136. Татаал сүйлөмгө тиешелүү тыныш белгилерди коюп, көчүрүп жазгыла. Алардын эмне үчүн коюлганын түшүндүргүлө. Жөнөкөй сүйлөмдөрдүн ортосунда маанилик жактан кандай катыштар бар?"},{"t":"p","h":"1. Шамбет теребелге көз чаптырат алыста аскалар каалгыйт астында көл мелтирейт булунда күлкү жаңырат 2. Жээк баягыдай жер-суу баягыдай. (Т. С.) З. Канча уктаганымды билбейм бир убакта бирөө басып келгендей болду. Көзүмдү ачсам Жамийла экен. (Ч. А.) 4. Тарбия берүү – улуу иш, ошол аркылуу адамдын келечек тагдыры чечилет. («КБ»)"},{"t":"p","h":"137. Тең байланыштагы татаал сүйлөмдү көчүрүп жазгыла. Эмне үчүн ал тен байланыштагы деп аталат? Татаал сүйлөмдүн дагы кандай түрүн билесинер? Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө."},{"t":"p","h":"1. Иштин көзү дагы алдыда. Өстөн казылса?, станция курулса, тентек суу жүгөндөлөт. Күчтүү кубат зымда агылат, ар бир үйдө өчпөс шамдар жанат. (Т. С.) 2. Ошол Бүркүт-Уядан гана кыйналабыз, бирок ал деле оной. (Н. Б.) З. Даниярдын арабасы атырылган бойдон короодон жулунуп чыкты да, чан уюлгутуп, жолго түштү. (Ч. А.) 4. Ынтымак болсо калкында, душманындан тартынба. (Т.) 5. Сен аларга? алтын бергенин жок, алтындан кымбат сөзүндү бердин. Ал эми сөздүн өмүрү түбөлүктүү. Сөз жүрөктүн ачкычы. («АТ»)"},{"t":"p","h":"<span class=\"pg\" data-n=\"56\">56<\/span>138. Көп чекиттин ордуна мааниси боюнча ылайык келүүчү экинчи сүйлөмдү ойлоп таап, тен байланыштагы татаал сүйлөм түзгүлө. Жөнөкөй жана татаал сүйлөмдөрдүн айырмасын түшүндүргүлө."},{"t":"p","h":"1. Силер мага карабай кете бергиле ... 2. Менин тажрыйбам жакшы натыйжаларды берди ... 3. Айыл ичи куду баягыдай.... 4. ... аба укмуштуудай таптаза. 5. Ушулардын бардыгы Ала-Тоо өзөнүндө чоңоюшкан жөнөкөй кишилер эле..."},{"t":"p","h":"139. Көчүргүлө. Сүйлөмгө синтаксистик талдоо жүргүзгүлө: а) түзүлүшү боюнча кандай сүйлөм экендигин аныктоо; б) жөнөкөй сүйлөмдүн кайсы түрү; в) татаал сүйлөмдүн кайсы түрү; г) сүйлөм мүчөлөрүнүн астын сызуу."},{"t":"p","h":"1. Ушундай коркунучтуу талаада ким жүрсүн, бирок турмушта эмнелер болбойт. 2. Чүй талаасы сапсары алтындай. 3. Сенин кыялын адамда жок: кээде кишини магниттей тартасын, кээде жакындаган жанды жанындан түртөсүң. 4. Букарага келгениме алты ай болду. Мен үчүн ал алты жылдай сезилди. (А. Т.) 5. Колум ачык, бир чыны уудан бир чака бал бөлө алам. Көнүлүм жарык, музда көктөп, өнө алам. (А. О.)"},{"t":"p","h":"140. Окугула. Түзүлүшү боюнча кандай сүйлөмдөр бар? Тыныш белгилердин эмне үчүн коюлганын түшүндүргүлө."},{"t":"p","h":"1. Быйыл жыл учуру болду го. Кар кетти, соко чыгарылды. Кен аянтта, тракторду күрүлдөтүп, Люба жүрдү. (Т. С.)"},{"t":"p","h":"2. – Ооба, айланайын, дыйкан талаам, сен баарына күбөсүн, ниетим жакшы болчу. Ошентсе да, көздөгөн ишим ордунан чыкпай, жүрөгүм кансырап жатты."},{"t":"p","h":"– Аның чын, Толгонай. Менин барып турган душманым – согуш баштагандар, анткени алар эгин сеппейт."},{"t":"p","h":"– Туура айтасын. Согушкан эгин айдабайт, ал бардык адамдардын насибине кол салат. (Ч. А.)"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[55,56]},{"title":"§ 18 ЖӨНӨКӨЙ СҮЙЛӨМДӨРДҮН БАЙЛАНЫШУУ ЖОЛДОРУ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"57\">57<\/span>§ 18 ЖӨНӨКӨЙ СҮЙЛӨМДӨРДҮН БАЙЛАНЫШУУ ЖОЛДОРУ"},{"t":"p","h":"Тен байланыштагы татаал сүйлөмдүн курамындагы сүйлөмдөр өз ара төмөнкүдөй жолдор менен байланышат:"},{"t":"p","h":"1. Интонация аркылуу (байламтасыз): Атанын уулу болуш – урмат, элдин уулу болуш баарынан кымбат. (Мак.)"},{"t":"p","h":"2. Байламталар аркылуу:"},{"t":"p","h":"а)Байланыш тыргыч (жана, ары, да, жана да, дагы ж. 6.): Жаан басылды да, күн ачыла баштады.(«КБ»)"},{"t":"p","h":"6) Каршылагыч (бирок, анткени менен, ошенткени менен, ал эми, ошентсе да, антсе да ж. б.): Айткулу менен бирге кеткендер келишти, бирок Айткулу жок. (К. Б.)"},{"t":"p","h":"в) Себеп – наты йжалагыч (анткени, себеби, ошондуктан, ошол себептүү, эмне учун десен, неге десен ж. 6.): Адамдар бактыга жетишет, анткени биздин доордо бардык жолдор жакшылыкка алып барат. («А»)"},{"t":"p","h":"г) Ажыраткыч (же, же болбосо): Атаң да барат, же мен араба менен киши жиберейинби? (А. Т.)"},{"t":"p","h":"141. Окугула. Тен байланыштагы татаал сүйлөмдөрдүн бөлүктөрү бири-бири менен кандайча байланышты? Тыныш белгилери кандайча коюлду?"},{"t":"p","h":"1. Согуштан кийин да? жылдар өтүп жатты, бирок* айылга бара албай жүрдүм. Анын себеби көп. Актанайын деген жерим жок, анткени менен% элге каттабагандыгымды чон күнөө деп эсептеймин?. Багым бар экен, жолдошум экөөбүз ынтымакта жакшы турабыз. (Ч. А.) 2. Аке, койлор өзү үрктүбү, же карышкыр тийдиби. Шаймерден – бир киши, а биз көппүз. (Т. С.) 3. Таңга маал кар басылды, күн чайыттай ачылды*. 4. Бүгүн Самсахундун иши чатак, Каныбек жок. 5. Кичи Алайдын кышы суук, ошондуктан Ошко каттоо эчак эле тыйылган. (К. Ж.)"},{"t":"p","h":"142. Байламталуу тең байланыштагы татаал сүйлөмдү көрсөткүлө. Жөнөкөй сүйлөмдөрдүн ортосундагы маанилик катыштарды аныктагыла."},{"t":"p","h":"1. Баса, биздин жерибиз начар бекен, же? кишилерибиз алсыз беле?"},{"t":"p","h":"2. Сабыр Орусбекке күлүмсүрөп койду да*, кебин балдарга да, чондорго да таандык кылып уланта берди. (Т. С.) 3. Сатар баланын түшүнгөнүн биле койду. – Окуйсуңбу? Сендей балдар бизде абдан көп, ал эми мен ошолорду окута турган кишимин. Сенин топун абдан эски турбайбы, а мен сага жаны <span class=\"pg\" data-n=\"58\">58<\/span>топу берем. Карандаш, китеп – баарын берем, барасынбы? Бала бир далайга чейин унчуккан жок, ошондой болсо да Сатардын айтканына аябай кызыкты. (А. Т.)"},{"t":"p","h":"148. Окугула. Түзүлүшү боюнча кандай сүйлөмдөр бар? Жөнөкөй жана татаал сүйлөмдөрдүн түрлөрүн эстегиле. Алардын айырмасы кандай? Түшүндүргүлө."},{"t":"p","h":"1. Кулакты жапырып, тили жок бир дудук болдум да калдым. Бир кезде элдин катары менен мага да бир аяк жарма келди. Кайгылуу, жүдөө кабагым менен салбырап барып аякты колума алдым. (М. Э.)"},{"t":"v","l":["2. – Сага кимден кат келмек эле, кызым?","– Алыс жактан. («А»)","3. Ата-бабам өскөн жер. Киндик каным тамган жер!","Калсам кантет? ... Жок, институтту бүтүрүшүм керек."]},{"t":"p","h":"4. О-о, эмгекчил адам, сенин укугун зор: бул дүйнөнүн ээси да – сен, башкаруучусу да – сен. 5. Күн кечтедиби, же күндүн көзүн булут каптадыбы? 6. Чон ишти башкарасын, иштерине ийгилик берсин. (Т. С.)"},{"t":"p","h":"144. Окугула. Грамматикалык түзүлүшү боюнча кандай сүйлөмдөр бар? Да, жана байламталары кайсы учурда сүйлөм мүчөлөрүн, кайсы учурда жөнөкөй сүйлөмдөрдү байланыштырат? Сүйлөмдүн бир өнчөй мүчөлөрү жөнүндө эмне билесинер?"},{"t":"p","h":"1. Айтикенин эрки да, өмүрү да, бактысы да баланын колунда сыяктуу! эле. 2. Сулуулук сырткы көрүнүш менен чектелбейт да, мен адамдын ички сулуулугуна суктанам. 8. Чынын айтканда, силердин ишинер да, кылыкжоругунар да элге үлгү болгондой болсун. 4. Эл силерден* үйрөнсүн, жаштар силерди туурасын. (А. Т.) 5. Шандуу күү жана шайыр күлкүлөр жел менен бүт дүйнөгө кетип жаткансыйт. 6. Биз Валя менен Валерийди космоско узаттык жана алар өкмөттүн тапшырмасын орундатарына бекем ишендик. Т. Жыйналыш өз учурунда чакырылды жана жаштарды тарбиялоо жөнүндөгү маселе туура коюлду. («КТ»)"},{"t":"p","h":"145. «Кыргызстан – көп улуттуу өлкө» деген темада ой жүгүртүү мүнөзүндөгү сочинение жазып келгиле. Элдердин достугуна, боорукердигине көнүл бургула. Тен байланыштагы татаал сүйлөмдү колдонгула."},{"t":"p","h":"146. Көчүргүлө. Синтаксистик талдоо жүргүзгүлө: а) айтылыш максаты боюнча; б) грамматикалык түзүлүшү боюнча; в) сүйлөм мүчөлөрү боюнча."},{"t":"p","h":"<span class=\"pg\" data-n=\"59\">59<\/span>1. Устакана кереметтенет, туш-тушка ширенди бүркүлөт. 2. Оор барскандар күрсүлдөп, чулу темирлер жадная түшөт. 3. Зор көөрүк тынбай үшкүрүнөт да, көк жалын үйлөйт. (Т. С.) 4. Жол тайгак эле, ошондуктан Бектемир жай гана бастырып келе жатты. 5. Ушул жерде эн кызык кармашуу башталды, себеби? канаттуу жырткыч кол салууну күткөн эмес."},{"t":"p","h":"147. Текстти көркөм окугула. Тыныш белгилеринин коюлушун түшүндүргүлө. Сүйлөмдүн кайсы түрлөрү колдонулду?"},{"t":"p","h":"Момун бая көргөн маралдарды эстей койду."},{"t":"p","h":"– Бүгүн мен бир сыр көрдүм, балам. Маралдар кайтып келиптир, бадал арасынан учуп өткөн элес болуп көрүндү."},{"t":"v","l":["Бала жалт кылчая карады:","– Чынбы?","– Чын! Өз көзүм менен көрдүм, уч баш экен.","– Каяктан келиптир?"]},{"t":"p","h":"– Ашуу ашып, тоо басып, келген го. Илгери, мүйүздүү Бугу эненин тушунда, бу жерлерде мин-сан марал жүрчү экен... (Ч. А.)"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[57,59]},{"title":"&amp; 19. БАЙЛАМТАЛАР МЕНЕН БАЙЛАНЫШКАН ТАТААЛ СҮЙЛӨМДҮН ТЫНЫШ БЕЛГИЛЕРИ","blocks":[{"t":"h3","h":"&amp; 19. БАЙЛАМТАЛАР МЕНЕН БАЙЛАНЫШКАН ТАТААЛ СҮЙЛӨМДҮН ТЫНЫШ БЕЛГИЛЕРИ"},{"t":"p","h":"Байламта аркылуу байланышкан татаал сүйлөмдө үтүр белгиси төмөнкүдөй коюлат:"},{"t":"p","h":"1. Байламта өзүнөн мурдагы сүйлөмгө тиешелүү болсо, ү т ү р байламтадан кийин коюлат (чарчы кашаа жөнөкөй сүйлөмдү билдирет):"},{"t":"p","h":"Чоң-Төрдү булут каптады да, аба ырайы бузула баштады."},{"t":"p","h":"2. Байламта өзүнөн кийинки сүйлөмгө тиешелүү болсо, ү т ү р байламтадан мурда коюлат:"},{"t":"p","h":"Кечээ Адисбектен кат келген, ошол себептүү Батма энеде тынчтык жок."},{"t":"p","h":" ошол себептүү[]."},{"t":"p","h":"148. Окугула. Байламталуу тен байланыштагы татаал сүйлөмдү көрсөткүлө. Тыныш белгилери кандайча коюларын түшүндүргүлө. Байламталар жөнүндө эмне билесинер?"},{"t":"p","h":"Кабагына караганда, ал качандыр бир кезде атактуу баатыр киши болгон сыяктуу, бирок көрүнүшү анын карылыгын далилдейт. Кайдан келе жатканымды <span class=\"pg\" data-n=\"60\">60<\/span>сурап койду да?, мундуу күүсүн черте баштады. Менин сөзүмдү тыншадыбы, аны карыядан байкоого болбойт, анткени ал бир калыпта жерди карайт. Балам, узак жолдон чыккан экенсин, насыбай тартасыңбы? Мен жалтандап калдым."},{"t":"p","h":"Абышка баягы күүсүн дагы сыздатты. Бул күүнүн сыры эмнеде болду экен? Мүмкүн, эчен жылы ушинтип черткендир, бирок? эч ким билбейт. (А. Т.)"},{"t":"p","h":"149. Көчүргүлө. Жөнөкөй сүйлөмдөр өз ара кандай жол менен байланышты? Үтүр белгиси кандайча коюлду? Сүйлөм мүчөлөрүнүн астын сызгыла."},{"t":"p","h":"1. Жоо жинденет, ошентсе да биздин элдин мизин кайтара албайт. (Т. С.) 2. Чынын айтайын, биз аны анча жактыра бербедик, себеби Данияр киши менен көп сүйлөшчү эмес. 3. Журе-бара женемдин бул тамашасына мен да кошулдум, анткени Данияр Жамийлага өтө эле кадала карай турган. (Ч. А.) 4. Бул түш Өмүрбекти ыза кылды, бирок анын ызасын сүйкүмдүү кыялы жууп жиберди. 5. Силерди көргөндө гүл соруп жаткан аарылар эсиме түшөт, же мунум жалганбы? (А. Т.)"},{"t":"p","h":"150. Көп чекиттин ордуна мааниси жагынан ылайык келүүчү байламтаны коюп, тен байланыштагы татаал сүйлөм түзгүлө. Көчүрүп жазып тыныш белгилерин койгула. Эмне үчүн үтүр кээде байламтадан кийин, кээде андан мурда коюлат?"},{"t":"p","h":"1. Кыз кайра тирилип адам болот... сенин заманын ушуну менен бүттү. (Ч. А.) 2. Акман кыйлага чыккан адам ... абышка карылыкка алдырган киши эмес. 3. Ала-Баш айылы ар жыл сайын мол түшүм алат ... суусу мол."},{"t":"p","h":"4. Сыдырым жел бир аз жортту ... шыбак башы термелди. (Т. С.)"},{"t":"p","h":"151. Өзүнөр себеби, ошондуктан, же, жана, да байламталары аркылуу эки жөнөкөй сүйлөмдү байланыштырып, бир нече татаал сүйлөм түзгүлө. Көчүрүп жазып сүйлөмдөргө сөз түркүмү жана сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө,"},{"t":"p","h":"152. Байламталар аркылуу жөнөкөй сүйлөмдөрдү байланыштырып, тен байланыштагы татаал сүйлөм түзгүлө. Сүйлөмдөрдүн ортосунда маанилик кандай карым-катыштар бар? Тыныш белгилерин койгула. Түшүндүргүлө. Схемасын чийгиле."},{"t":"p","h":"1. Кычан кыялданат. Көнүлү алып учат. 2. Силер аба менен дем ала турганынарды жакшы билесинер. Аба жердин айланасында гана бар. 3. Айтике түш көргөндөй болду. Өзүнө ишенбеди. 4. Бала бир далайга чейин унчуккан жок. Сатардын айтканына аябай ишенди. 5. Биз эми үчөөбүз. Сен кыргыздан чыккан тунгуч сүрөтчүсүн."},{"t":"p","h":"<span class=\"pg\" data-n=\"61\">61<\/span>Ү лгү: Кычан кыялданат да, көңүлү алып учат."},{"t":"p","h":"153. Көчүргүлө. Калтырылып кеткен тыныш белгилерди койгула. Алар эмне үчүн коюлганын түшүндүргүлө. Түзүлүшү боюнча алар кандай сүйлөмдөр?"},{"t":"p","h":"1. Аксакал сөзүн айтып бүттү да комузун безелентип, «Чоң кербезди» чертти. Шамбет да, Сергей да, Чаргын да – баары дөбөчөдө отурат. 2. Алар азыр Динарды караан туттубу же Окжетпес айдадыбы? Же үйдө болсун же талаада болсун мени ар дайым урматтап жүрдүнөр."},{"t":"p","h":"З. Бул сүрөт – азырынча ойдогу тилек ошондой болсо да бүтө элек чыгармамды ортого салайын. 4. Силер азыр да ошондойсунарбы же болбосо чарчаган күндөрүнөр болобу? (Ч. А.)"},{"t":"p","h":"154. Бирок, ошентсе да, анткени менен, же болбосо деген байламталарды катыштырып, ар бирине бирден тең байланыштагы татаал сүйлөм түзгүлө. Тыныш белгилерин койгула, алардын коюлушун түшүндүргүлө."},{"t":"p","h":"155. Жаратылыштын сүрөттөлүшүнө көңүл бургула, ага мүнөздүү негизги белгилерди атагыла. Тен байланыштагы татаал сүйлөмдөрдү көрсөткүлө. Бул кайсы чыгармадан? Автору ким?"},{"t":"p","h":"Улуу-Чаттын чөйрөсү аскалуу тоо... Какыраган таштак, адырлуу боз чап. Анда-санда эрбейген алтыгана, кай бир жерлеринде бир-эки элиден артпаган суйдан чөптөр бар. Чон суунун бою токой. Башка жерде өсүп, бетегени белден буратып, карагайлуу токойлорун аралаган адамга бул жерде эл жашайт деп ишендирүү кыйын эле."},{"t":"p","h":"Улуу-Чаттын түштүк-чыгыш тарабында Үч-Таш жайлоосу жайгашкан. Анда кичинекей көл бар. Көлдүн айланасы тай чабымдай... Өскөн камыш, балгын, жекендер көлдүн көрүнүшүн кубултуп, көркөмдүгүн арттырат. Көлдүн аты – Айдын-Көл. Эртели-кеч көлдүн үстү өрдөктөн көрүнбөйт. (К. Ж.)"},{"t":"p","h":"156. Татаал сүйлөмдөрдү таап, алардын бөлүктөрүн үтүр менен ажыраткыла. Эмне үчүн үтүр кээде байламтадан мурда, кээде андан кийин коюлду? Үтүр белгиси дагы кайсы учурларда колдонулат? Мисал келтиргиле."},{"t":"p","h":"1. Ырдынҥ мазмуну шахтёр Мусабектин жүрөгүн сыздатты анткени анын өткөндөгү турмушу таптакыр башкача эле. (С. С.) 2. Аны Өмүрбек атайын калтырдыбы же Гүланда билдирбей алып калдыбы? Анысы бизге белгисиз. З. Ысман бөбөгү жөнүндөгү кабарды атасына жазды да Өмүрбек менен Жалал- Абадга кайтты. (А. Т.) 4. Чакен ырыс толгон үйдүн ээси ошондой эле ырыска <span class=\"pg\" data-n=\"62\">62<\/span>шерик уулдун атасы. 5. Жигит тек турмушка ыраазы жана үй-бүлөсүнө ыраазы. Бардыгы үйдөн чыгышты да Чаргын тарапта басышты. (Т. С.)"},{"t":"p","h":"157. Көп чекиттердин ордуна экинчи сүйлөмдү ойлоп таап, тен байланыштагы татаал сүйлөм түзгүлө. Көчүрүп жазып тыныш белгилерин койгула. Алардын коюлушун түшүндүргүлө."},{"t":"p","h":"1. Айгеримдин ачуусу келди бирок ... 2. Айыл арасында күндөгүдөй кыймыл жок анткени менен ... 3. Эл карыбайт ошондуктан ... 4. Үйдө отурган Бермет катуу-катуу сүйлөдү да... 5. Эртеси да козу кайтарууга чыктык..."},{"t":"p","h":"158. Окугула. Тен байланыштагы татаал сүйлөмдөрдү таап көчүргүлө. Аларга талдоо жүргүзгүлө: а) айтылыш максаты боюнча; б) түзүлүшү боюнча жөнөкөй сүйлөмдүн кайсы түрүнөн түзүлдү; в) тыныш белгиси."},{"t":"p","h":"1. Көп өнөрдү киши акылы ойлоп табууда. Эмесе, кишинин сыры терен! Чын ниетин менен элди сүйө бил, ошондо анын улуу дүйнөсүн тааныйсын. Булар бейпилдикти сүйүшөт, өзүлөрүнүн ата мекени менен сыймыктанышат. Жолдоштор, күн чыгып калды, эл өстөнгө чыгышсын. (Т. С.) 2. Мен сенин аган болом, а сен мени көргөн эмессин. Аида сен ымыркай болчусун. Бул – менин досумдун баласы, анда мен зергер болчумун. (А. Т.)"},{"t":"p","h":"159. Тен байланыштагы татаал сүйлөмдөргө сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Татаал сүйлөм жөнөкөйдүн кайсы түрүнөн түзүлдү? Татаал сүйлөмдүн түзүлүшүн шарттуу сан белгиси менен көрсөткүлө."},{"t":"p","h":"1. Досу көптү жоо албайт, акылы көптү доо албайт. (Мак.) 2. Аке, койлор өзү үрктүбү, же карышкыр тийдиби. (Т. С.) 3. Ал бизге кол булгалады, бирок суунун шарынан эч нерсе угулган жок. 4. Алиман ордунан кайра ыргып турду да, чоң жолду кездей атырылып жөнөдү. (Ч. А.)"},{"t":"p","h":"Ү лгү: Досу көптү жоо албайт, акылы көптү доо албайт. 1) досу көптү жоо албайт – эки тутумдуу сүйлөм, жайылма; эмне болбойт? – албайт – баяндооч; ким? – жоо – ээ; кимди албайт? – досу көптү – толуктооч; 2) акы: лы көптү доо албайт – эки тутумдуу. жайылма: албайт – баяндооч, доо – ээ; акылы көптү – толуктооч; 2 + 2,"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[60,62]},{"title":"§ 20. ТЕҢ БАЙЛАНЫШТАГЫ ТАТААЛ СҮЙЛӨМ БОЮНЧА СИНТАКСИСТИК ТАЛДОО","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"63\">63<\/span>§ 20. ТЕҢ БАЙЛАНЫШТАГЫ ТАТААЛ СҮЙЛӨМ БОЮНЧА СИНТАКСИСТИК ТАЛДОО"},{"t":"p","h":"Талдоонун тартиби:"},{"t":"p","h":"1. Айтылыш максаты боюнча кандай сүйлөм экендигин аныктоо."},{"t":"p","h":"2. Канча жөнөкөй сүйлөмдөн түзүлгөнүн атап көрсөтүү, алардын ар биринин баш мүчөлөрүн табуу."},{"t":"p","h":"3. Татаал сүйлөмдүн кайсы түрү экендигин аныктоо; жөнөкөй сүйлөмдөрдүн байланышуу жолдорун (интонация же байламта) белгилөө."},{"t":"p","h":"4. Жөнөкөй сүйлөмдөрдүн ортосундагы маанилик байланышты аныктоо."},{"t":"p","h":"5. Тыныш белгисинин коюлушун түшүндүрүү."},{"t":"p","h":"6. Мындан ары татаал сүйлөмдүн ар бир бөлүгү жөнөкөй сүйлөм сыяктуу эле талдалат."},{"t":"p","h":"Ү Ар иштин устасы бар, ар устанын устаты бар. (Мак.) – Айтылыш максаты боюнча жай сүйлөм; түзүлүшү жагынан тең байланыштагы татаал сүйлөм; эки жөнөкөй сүйлөмдөн түзүлдү: 1) ар иштин устасы бар (ээси – устасы, баяндоочу – бар); 2) ар устанын устаты бар (ээси – устаты, баяндоочу – бар). Жөнөкөй сүйлөмдөр өз ара интонация аркылуу байланышты; алардын ортосунда тен маанилеш катыш бар; жөнөкөй сүйлөмдөрдүн ортосуна үтүр коюлат."},{"t":"p","h":"160. Тен байланыштагы татаал сүйлөмдөргө синтаксистик талдоо жүргүзгүлө."},{"t":"p","h":"1. Мен ага каршылык айтууга даай албайм, анткени? ал – менден улуу адам. 2. Дыйкан чарбасынын бардык тармагы өсүп-өнүктү: төлгө төл кошулду, айдоо аянты көбөйдү, элдин турмушу оңолду. 3. Чын айтып залал тап, акырында жетерсин муратка. Калп айтып пайда тап, акырында каларсын уятка. 4. Асман ачык, Ысык-Көл мелтиреп турат. 5. Мен аз гана жашадым, бирок* чексиз узак жол жүрдүм."},{"t":"p","h":"161. Текстти окуп, тен байланыштагы татаал сүйлөмдөрдү тапкыла. Аларга оозеки талдоо жүргүзгүлө. Татаал сүйлөмдүн жөнөкөйдөн айырмасы эмнеде? Жөнөкөй жана татаал сүйлөмдөрдүн кандай түрлөрүн билесинер?"},{"t":"p","h":"Марттын аягы ... Бир күнү бороон болду, кар жаады. Ой-тоону кар басып, жаман шашып калдык. Кун да, түн да мен жылкылардын жанында болдум. Сакал-мурутум музга тонуп, колум кымтууга келбей калды. Жыл- ‹ычылар болбой жатып мени үйгө жиберишти. Үйдү көздөй келе жатамын, ‹ер-суу көрүнбөйт. Бардык нерсе ак кардын алдында."},{"t":"p","h":"<span class=\"pg\" data-n=\"64\">64<\/span>Үч күндөн кийин күн ачылды, бирок ой-тоо кар. Биз жылкыларды төмөндөтүп айдап түштүк да, эртеси мен Чолпон-Атага жүрүп кеттим. Абийир болуп, ал жылы да малым аман болду, бээлердин бири да кулун салган жок. (К. Б.)"},{"t":"p","h":"162. БК. Тексттин мазмуну менен таанышкыла, андагы негизги ой эмне жөнүндө? Мазмуну темасына жооп береби? Анын мазмунун өз сөзүнөр менен кайра айтып бергиле. Түзүлүшү боюнча сүйлөмдүн кайсы түрлөрү колдонулду?"},{"t":"h3","h":"АКЫЛДУУ ДЫЙКАН"},{"t":"p","h":"Бир хан эсирип отуруп жигиттерине буйрук берет: «Мага акмак таап бергиле!» Эки жигит, акмакты издеп келе жатышып, карагай сүйрөткөн бир кишиге жолукту:"},{"t":"p","h":"– Карагайынды таштагын, сени хан чакырып жатат, – дешти."},{"t":"p","h":"– Жок, жигиттер, карагайды орто жолго таштап, бара албайм, – деп бастырып кетип калды."},{"t":"p","h":"Андан кийин хандын эки жигити жер айдап жаткан дыйканга жолугуп:"},{"t":"v","l":["– Ой, дыйкан, жүргүн ханга! – дешти.","– Эмне учун?","– Хан акмакты таап кел деген, сен акмак экенсин!..","Жигиттерге дыйкандын ачуусу келип:","– Силер үчүн акмакты даярдаган киши жок, жоголгула! – деди."]},{"t":"p","h":"– Эмесе, акмакты таап бер, – деп абышканы кармап туруп алышты. Дыйкан ойлонуп туруп мындай деди: «Акмакты таап кел деген хандын өзү акмак, же акмакты издеп жүргөн экөөн акмак». Эки жигит дыйкандын сөзүн ханга айтып келишти. «Ошол дыйкандын колу-бутун байлап, алып келгиле!» – деп хан буйрук кылды."},{"t":"p","h":"Дыйкан хандын астына келип отурду. Хан дыйканды кекетип:"},{"t":"p","h":"– Сен мени акмак депсин, эгер акылдын баары сенде болсо, кудай кайсы жерде турат, ушуну айтчы? – деди."},{"t":"p","h":"– Ханым, ушул кебетем менен кантип айтам, тагыңызга отуруп, анан айтайын."},{"t":"p","h":"Хан макул болуп кийимин чечип берди. Дыйкан хандын кийимин кийип, тагына отуруп, жигиттерди чакырды:"},{"t":"v","l":["– Ушул убакка чейин акмакты таппай жүрүпсүнөр.","Мындан артык акмак барбы, башын кескиле, – деди."]},{"t":"p","h":"Жигиттер хандын башын кесип ыргытышты. Ошентип, дыйкан элге кайрымдуу жана адилет болуп калган экен. («Кыргыз эл жомоктору» <span class=\"pg\" data-n=\"65\">65<\/span>163. БК. Чубакка тиешелүү сапаттар, белгилер кандайча сүрөттөлгөн? Чечмелеп айтып бергиле."},{"t":"h3","h":"ЧУБАК"},{"t":"v","l":["Акбалтанын Чубагы —","Арстандын бирөө бу дагы.","Ач айкырык, куу сүрөөн,","Ала байрак, жез найза,","Сунгандан кайра тартпаган,","Сумсайганын жазбаган.","Бузуку сөзгө көнбөгөн,","Акылга дыйкан, заары күч,","Душманга моюн бербеген.","Көркөмү бөлөк, көзү тик.","Найзакердин ыктуусу,","Алышса балбан мыктуусу.","","Кайталоо учун суроолор:","","1. Татаал суйлем жөнөкөйдөн кандайча айырмаланат?","2. Татаал суйлемдун кандай турлеру бар? Мисал келтир.","3. Тен байланыштагы татаал суйлем деген эмне? Мисал келтир."]},{"t":"p","h":"4. Жөнөкөй сүйлөмдөрдүн ортосунда маанилик жактан кандай катыштар болот?"},{"t":"p","h":"5. Татаал сүйлөмдүн курамындагы сүйлөмдөр өз ара кандай жолдор менен байланышат? Мисал келтир."},{"t":"p","h":"6. Татаал сүйлөмдүн тыныш белгиси жөнүндө айтып бер. Мисал келтир."}],"sub":[{"title":"АКЫЛДУУ ДЫЙКАН","b":15},{"title":"ЧУБАК","b":28}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[63,65]},{"title":"БАГЫНЫҢКЫ БАЙЛАНЫШТАГЫ ТАТААЛ СҮЙЛӨМ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"66\">66<\/span>БАГЫНЫҢКЫ БАЙЛАНЫШТАГЫ ТАТААЛ СҮЙЛӨМ"},{"t":"h3","h":"&amp; 21, БАГЫНЫНКЫ БАЙЛАНЫШТАГЫ ТАТААЛ СҮЙЛӨМДҮН ТҮЗҮЛҮШҮ"},{"t":"p","h":"Багынынкы байланыштагы татаал сүйлөм баш жанабагынынк ы сүйлөмдөрдөн түзүлөт."},{"t":"p","h":"Ойдун натыйжасын билдирсе, баш сүйлөм деп аталат."},{"t":"p","h":"Баш сүйлөмдүн ар кандай кырдаалын (мезгилин, сыпатын, себебин, ордун ж. б;) билдирсе, багыныңкы сүйлөм деп аталат."},{"t":"p","h":"Мисалы, Атам устаканадан кайтканча, Садык байкемдин катына жооп жаздым. (Ч. А.) 1) Садык байкемдин катына жооп жаздым – баш сүйлөм; к а ч а н? – 2) атам устаканадан кайтканча – багыныңкы сүйлөм; баш сүйлөмдөгү ойдун мезгилин билдирди."},{"t":"p","h":"Эгерде атам устаканадан кайтканча деген багынынкы сүйлөмдү өзүнчө алып карасак, ал жыйынтыктуу ойду билдире албайт. Ошон үчүн ал баш сүйлөм менен ажырагыс бирдикте колдонулат."},{"t":"p","h":"Баш жана багынынкы сүйлөмдөр ү т ү р менен ажыратылат."},{"t":"p","h":"164. Окугула. Багынынкы байланыштагы татаал сүйлөмдөрдү таап, аларды баш жана багынынкы бөлүктөргө ажыраткыла. Багынынкысы баш сүйлөмдүн кандай кырдаалын билдирди?"},{"t":"p","h":"1. Балдар мени үйгө жеткиришип койгондон кийин, үч-төрт күн төшөктө жаттым*. Айылдагылар көнүл сурап, келип-кетип турушту. Элге ыраазымын?. Ошондо эч ким эчтеке деп кекеткен жок, ошентсе да көздөгөн ишим ордунан чыкпай, катуу кейидим. (Ч. А.) 2. Жигит айылга келсе, айыл дүрбөп жаткан экен. (Ж. Б.) 3. Мээнетин катуу болсо, татканын таттуу болор*. (Мак.) 4. Ошол күнү Бектурган аларды көрүп кетүү үчүн келген. 5. Араба ала салып кетпесин үчүн, анын дөңгөлөгүнө чынжыр байладык. (А. Т.)"},{"t":"v","l":["6. Алты санын соо болсо,","Бекер карап жатпагын.","Атаң жаман болсо да,","Акылын ойго сактагын. (Т.)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"67\">67<\/span>165. Окугула. Багынынкы байланыштагы татаал сүйлөмдү тапкыла. Ал кандай сүйлөмдөрдөн түзүлөт? Багынынкыны баш сүйлөмдөн ажыратып, өзүнчө колдонууга болобу? Эмне үчүн?"},{"t":"p","h":"1. Биз ээрчишип келе жатканда, дүйнө башкача сезиле турган. Бул айткандарын туура, Толгонай, отурчу бери. (Ч. А.) 2. Бүгүн күн чайыттай ачык, көл бетине нур чагылышат. Салкын жел көнүлдү көтөрүп, баарыбыз теребелге көз чаптырып баратабыз. (Т. С.) З. Поезд Казан вокзалына токтоду, баарыбыз вагондон чыктык. Кенешме бүткөндөн кийин, бизди конок үйүнө алып келишти. (К. Б.) 4. Жапар ойгонгондо, канатсыз учкан күндүн нуру терезеден жаны эле шыкаалаган эле. Мезгил канаттуу куштай сызат, мага аны пайдалануу керек. (А. Т.)"},{"t":"p","h":"166. Көчүрүп жазгыла. Татаал сүйлөмдүн бөлүктөрүн үтүр менен ажыраткыла. Баш жана багыныңкы сүйлөмдөрдү атагыла. Кайсынысында айтылып жаткан ой жыйынтыктуу берилет?"},{"t":"p","h":"1. Батийна үйдөн чыкса мамыда эки жылкы байланып туруптур. (Т. С.) 2. Жайыт от болгондуктан Орто-Сай айылынын малы жакшы эттенди. 3. Биз Шумкар-Уяга бурула бергенибизде Улар-Ашуунун белинен төрт киши чыкты. (А. Т.) 4. Ынтымак бар жерде ырыс да бар. 5. Шагылы болбой зоо болбойт, шайыры болбой эл болбойт. 6. Ишин калганча ашын калсын. (Мак.)"},{"t":"p","h":"167. Татаал сүйлөмдөрдү тапкыла. Кайсынысында жөнөкөй сүйлөмдөр тен укукта, кайсынысында багынынкы абалда байланышты? Алардын айырмасын түшүндүргүлө."},{"t":"p","h":"Эки бала, улутуна бышактап жатып, уктап калышты. Жетимдин жары – кыдыр, бирок тагдыры жети ача деген – ак сөз. Түн бейкут өттү. Сүрдүү токойдун жырткычы тийбеди, желмогузу келбеди. Экөө ойгонсо, күн чыгып калыптыр. Экөө турду да, из кубалап дагы жөнөдү. Мөмө-чөмө менен өзөк жалгап жүрүп отурушту. Үч күн, үч түн дегенде бир бийик дөбөгө келип токтошту. Төмөн жакты карашса, көк жайыкта улуу той болуп жатат. Тигилген үйлөргө сан жеткис, жыйылган элге сан жеткис."},{"t":"p","h":"Балдар дөбөдөн түшүп барышты. Жоо эли балдардын сүйлөгөн сөзүнөн баамдап, бул экөө кыргыз тукуму экенин таанышты. (Ч. А.)"},{"t":"p","h":"168. Көп чекиттин ордуна экинчи сүйлөмдү ойлоп таап, багынынкы байланыштагы татаал сүйлөм түзгүлө, тыныш белгисин койгула. Баш жана багынынкы сүйлөмдөрдү аныктагыла. Алар жөнүндө айтып бергиле."},{"t":"p","h":"<span class=\"pg\" data-n=\"68\">68<\/span>1.... Зарыл апа жалгыздык тарткан жок. 2. ... ал ордунан обдулуп тура калды. 3. ... айылда калдым. 4. Жылдар өтсө... 5. Кышында кар калын жаап... 6. Мээнетин катуу болсо ... 7. Күн аркан бою көтөрүлгөндө..."},{"t":"p","h":"169. Тен жана багынынкы байланыштагы татаал сүйлөмдөрдү өз өзүнчө ажыраткыла. Алардын айырмачылыгын түшүндүргүлө. Баяндоочтору кандай формада аяктай тургандыгына көнүл бургула."},{"t":"p","h":"1. Билим – дарак, иш болсо – анын мөмөсү. 2. Акыл – тозбос тон, илим – түгөнбөс кен. (Мак.) 3. Күн батууга жакындап калган кезде, батыш тараптан калдайган кара булут көтөрүлдү. 4. Мен айылда жүргөн кезде, Дүйшөн айылдын мурасы эле. (Ч. А.) 5. Силердей уулдардан кандай сонун укмуштуу адамдар чыгарын болжоп болбойт, аны белгилей турган – бир гана келечек."},{"t":"v","l":["6. Бириндеп булут! бөлүнсө,","Күндүн көзү ачылат. (Т.)","","Т. Эне тилсиз тааныр белем жеримди,","Эне тилсиз тааныр белем элимди? (Т. Б.)"]},{"t":"p","h":"170. «Манас» эпосунан тен жана багынынкы байланыштагы татаал сүйлөмдөрдүн ар бирине төрттөн мисал жазып келгиле. Алардын грамматикалык түзүлүшү, өз ара байланышуу жолдору жөнүндө айтып бергиле."},{"t":"p","h":"171. Көчүргүлө. Сүйлөм мүчөлөрүнүн астын сызгыла. Баш жана багынынкы сүйлөмдөрдүн сүйлөмдөгү орундары кандай? Багынынкы сүйлөмдүн баяндоочу ойду кандайча билдирет?"},{"t":"p","h":"1. Чолпонбайлар жабылып сууга киргенде, аларды душмандар көрүп калышты. (К. Ж.)"},{"t":"v","l":["2. Артымда солдат балдырап', айдоого кетип барамын. (Т.)","","3. Талаанын көркү кайда, гүл болбосо?","Акындар ырдай албайт, тил болбосо,","Душманын жазганабы, сүр болбосо? (Б. А.)"]},{"t":"p","h":"4. Ал, согуштун элеси көз алдына келгендей, ордунан ыргып турду."},{"t":"p","h":"5. Алар, балдар оюндан келгенче, күтүп отурушту. 6. Мен, Аксаамай окууга келбей калып, анын үйүнө бардым. («КБ»)"},{"t":"p","h":"<span class=\"pg\" data-n=\"69\">69<\/span>172. Баш жана багынынкы сүйлөмдөрдү аныктагыла. Алардын сүйлөмдөгү орун тартибине көнүл бургула. Тыныш белгилеринин коюлушун түшүндүргүлө."},{"t":"p","h":"1. Бириндеп булут бөлүнсө?, күндүн көзү ачылат. (Т.) Жанында досун болбосо, бул дүйнөнүн көркү жок. (Мак.) 3. Бөлмөнүн ичи, Жутабай Нурбайга сөз бергенде, жымжырт боло түштү. (К. Б.) 4. Ай батууга жакындаганда, мен, төөнү алып, коктуга жөнөдүм. 5. Жок жерден шамал жаралып, көзүмдөн жаш куюла баштады. 6. Карыя ангемесин бүткөнчө, добул токтоп, таң атты. (А. Т.)"},{"t":"p","h":"173. Сүйлөмдөрдү берилген түрүндө окугула. Айтылып жаткан ой кандай абалда болду? Ой-пикир жыйынтыктуу болсун үчүн экинчи сүйлөмдү ойлоп таап, көп чекиттин ордуна жазгыла. Тыныш белгисин койгула. Татаал сүйлөмдүн кайсы түрү түзүлдү?"},{"t":"p","h":"1. Уста кандай болсо ... 2. Жомокто айтылган баштык андай болсо ..."},{"t":"p","h":"3. Жаан басылган сон ... 4. Балдардын жүздөрүнөн нур төгүлөт ... 5. Энем жумуштан келгенде ..."},{"t":"p","h":"174. Синтаксистик талдоо жүргүзгүлө: а) түзүлүшү боюнча кандай сүйлөм;"},{"t":"p","h":"б) жөнөкөй жана татаал сүйлөмдөрдүн түрлөрүн аныктоо; в) сүйлөмдү сүйлөм мүчөлөрүнө ажыратуу."},{"t":"p","h":"1. Жамандыкты көрбөгөн жакшылыктын кадырын билбес. 2. Дүйнөдө майда эл жок, элдин улуулугу анын көптүгүнө карабайт. (Мак.) 3. Ынтымагын болбосо, жене албайт жоону бир адам. (Т.) 4. Жамгыр күчөгөндөн күчөп, чагылган чартылдады. 5. Күн жаап турган себептүү, биз жолго чыга албай калдык. («АТ»)"},{"t":"p","h":"У л г ү: Жамандыкты көрбөгөн жакшылыктын кадырын билбес. – Жөнөкөй сүйлөм – эки тутумдуу, жайылма; к и м? – жамандыкты көрбөгөн – ээ; эм не бол бо с? – билбес – баяндооч; э м не син билбес? кадырын – толуктооч; эмненин кадырын? – жакшылыктын – аныктооч."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[66,69]},{"title":"§ 22. БАШ ЖАНА БАГЫНЫНКЫ СҮЙЛӨМДӨРДҮН БАЙЛАНЫШУУ ЖОЛДОРУ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"70\">70<\/span>§ 22. БАШ ЖАНА БАГЫНЫНКЫ СҮЙЛӨМДӨРДҮН БАЙЛАНЫШУУ ЖОЛДОРУ"},{"t":"p","h":"Сүйлөмдөрдүн байланышуу жолдору багынынкы сүйлөмдүн этиштик баяндоочуна уланган мүчөлөр аркылуу аныкталат. Баяндооч төмөнкүдөй формада келип, баш сүйлөм менен байланышат:"},{"t":"p","h":"1. Атоочтуктун -ган мүчөсүнө жөндөмө мүчөлөр уланат, же жандоочтор кошулуп айтылат: 1. Жоокерлер жакындап кел + ген + де, алар: ды душмандар көрүп калышты. (К. Ж.) Качан? – жоокерлер жакындап келгенде – багынынкы сүйлөм; -ген – атоочтук мүчө, -де – барыш жөндөмөнүн мүчөсү. 2. Аба салкында+ган кезде, Жапар менен Жамийла жолго чыгышты. (К. Б.) Качан? – аба салкындаган кезде; – ган – атоочтук мүчө, кезде – жандооч."},{"t":"p","h":"2. Чакчыл мүчөлөр: -ып, -а(-й), -ганча, -ганы, -гыча ж. б.: Жүрөгүм элжир+еп, Алимандын сүйкүмдүүлүгүнө тойбодум. (Ч. А.) Кант ип? – жүрөгүм элжиреп – багынынкы сүйлөм; -ып – чакчыл мүчө."},{"t":"p","h":"3. Шарттуу ыңгайдын -са мүчөсү: Гүл болбо+со, талаанын көркү кайда? Гүл болбосо – багыныңкы сүйлөм; -са – шарттуу ынгайдын мүчөсү."},{"t":"p","h":"Кээде -са мүчөсүнөн кийин да (дагы) байламтасы кошулуп айтыла берет: Зарыл жумуштарым болсо да, мен ушул катты жазууну туура таптым. (Ч. А.) Зарыл жумуштарым болсо да – багынынкы сүйлөм."},{"t":"p","h":"175. Багыныңкы байланыштагы татаал сүйлөмдү тапкыла, андагы баш жана багынынкы сүйлөмдөрдү аныктагыла. Алардын байланышуу жолдорун түшүндүргүлө. Багынынкы сүйлөм баш сүйлөмдүн кандай кырдаалын билдирди?"},{"t":"p","h":"1. Жайыт кенейген сайын?, Кычан уйларын сонундатып кайтарчу болду. 2. Ызакул кирип келгенде?, балдар тымтырс боло түшүштү. (Ш. Б.) 3. Күн мемиреп, асман көгүлтүр тартып, бүгүнкү күн жаш баланын жылмаюусундай көңүлдүү. (Т. С.) 4. Баканын өзү чөлдө болсо да, көзү көлдө болот. (Мак.) 5. Мен турган убакта*, элдин бардыгы уйкунун тынчтык кучагында эле. (К. Ж.) 6. Ким эмгектен көрүнгүсү келсе?, ал кыйынчылыктан коркпоого тийиш. («А») 176. Багынынкы байланыштагы татаал сүйлөмдүн курамындагы баш жана багынынкы сүйлөмдөрдү өзүнчө ажыраткыла. Багыныңкы сүйлөмдүн баяндоочу кандай формада аяктады? Атоочтуктар, чакчылдар жөнүндө эмне билесинер?"},{"t":"p","h":"Байбиче, сол колун сунуп, мага бирдеме берди. Бул садагасы экен, анткени Сарыбай бай көптөн бери ноокас эле. Жолдо бара жатканда бирөө мени кемсинткендей болуп, көнүлүм иренжиди."},{"t":"p","h":"то"},{"t":"p","h":"<span class=\"pg\" data-n=\"71\">71<\/span>Мен Кызыл-Кыяга барганда?, атам төшөктө жаткан экен. Эшбай, көз жашын көлдөтүп, тамак сурап отурат."},{"t":"p","h":"Кийинки жылы Элебес мени бир байга малайлыкка берди. Биз аттаналы деп жатканда, Бурмаке байбиче келди. Биз аттанганда?, асман бүркөлүп, бир кара булут ары-бери уюлгуп, жел согуп, күн салкындап турган. (М. Э.)"},{"t":"p","h":"177. Багынынкы сүйлөмдүн баяндоочун ар кандай түргө келтирип, сүйлөмдөрдү кайра түзгүлө. Аларды бири бирине салыштыргыла. Багынынкы сүйлөмдүн мааниси өзгөрдүбү?"},{"t":"p","h":"1. Космосту өздөштүрүү жөнүндө берүүлөр башталганда, мен үйгө шаштым. 2. Күн уясына киргенде, кечки сыдырым өз кезегин алды. 3. Аба ырайы бир калыпта турбай, суук күчөй берди."},{"t":"p","h":"У л гү: а) космосту өздөштүрүү жөнүндө берүүлөр башталгандыктан, мен үйгө шаштым (баш сүйлөмдөгү ойдун себеби көрсөтүлдү); б) космосту өздөштүрүү жөнүндө берүүлөр башталса, мен үйгө шашам (баш сүйлөмдөгү ойдун шарты көрсөтүлдү) ж.б."},{"t":"p","h":"178. БК. Окугула. Текст кептин кайсы түрүнө таандык? Түзүлүшү жана айтылыш максаты боюнча сүйлөмдүн кайсы түрлөрү катышкандыгын аныктагыла."},{"t":"h3","h":"ТӨРТ ГАНА КҮН КАЛГАН ЭЛЕ"},{"t":"p","h":"Жанга жагымдуу жай айы. Кычан бүгүн да бадачы кейпинде. Кыял кушун чабыттатып, чексиз мейкиндикте учуп жүрдү. Биринчи сентябрь жаңырат... Кол кармашуулар... Кучакташуулар... Жаны мугалимдер... Тенти агайындай сүйкүмдүү, билимдүү болуу..."},{"t":"p","h":"Көз ачып жумганча Карагер кунан, башын көтөрүп, кош кулагын тикчийтип, тура калды. Бет алдында, Карагерди жылдырбай, кыл чылбырдан кармап, кара малакай, кара таар чапанчан Жумаалы каракчынын турганын көрдү. Заматта ачуусу ташыды."},{"t":"v","l":["– Коё бер кунанды! Бул жерге эмне келдин?!","– Эмнеге келгенимди билбейсинби?"]},{"t":"p","h":"Ызырынган мыкаачы Кычанды бардык күчү менен жерге басты да, денесине канжар урду."},{"t":"p","h":"Окуу башталарына төрт гана күн калган эле!.. (Ш. Б.)"},{"t":"p","h":"179. БК. Бул текст кептин кайсы түрүнө таандык? Баяндоо, сүрөттөө, ой жүгүртүү кеби жөнүндө эмне билесинер? Алардын айырмачылыгы кандай?"},{"t":"h3","h":"<span class=\"pg\" data-n=\"72\">72<\/span>УЛАР"},{"t":"p","h":"Улар – куштардын кыргоолдор тукумундагы уруусу. Чымыр денелүү, буттары күчтүү. Улардын беш түрү Кавказ, Түштүк Сибирь, Кичи, Борбордук жана Орто Азиянын тоолорунда учурайт. Кыргызстандын тоолорунда кара боор уларлар кезигет. Боз түстө, кара ала тактуу, капталы менен мойнунда кызгылт күрөн чийиндери бар. Уясын жерге салып, бир нече жумуртка тууйт. Өсүмдүктүн бүчүрү, гүлү, уругу менен тамактанат. Улардын эти ширелүү. («КТ»)"},{"t":"p","h":"180. Көчүргүлө. Сүйлөм мүчөлөрүнүн астын сызгыла. Атоочтук, чакчыл түрмөк катышкан жөнөкөй сүйлөмдү жана багынынкы байланыштагы татаал сүйлөмдү таап, аларды өз ара салыштыргыла. Грамматикалык түзүлүшү боюнча кандай өзгөчөлүктү байкадынар? Түшүндүргүлө."},{"t":"p","h":"1. Кычандар келишкенде, жыйналыш аяктап калган. 2. Ызакулдун сөзүн укканда Кычан токтоно албай кетти. (Ш. Б.) 3. Шаркырап аккан сууга жеткенде Данияр арабаны жайыраак айдады. 4. Ал кайра ырдаганда, мен сүйүнүп кеттим. 5. Айылга кайтып бара жатып, бирибиз да ооз ачып сүйлөгөн жокпуз. (Ч. А.) 6. Көнүлүм айдай ачылып, жүрөгүм толкуп кубанат. (Р. Ш.)"},{"t":"p","h":"181. Тен байланыштагы татаал сүйлөмдүн биринчи бөлүгүнүн баяндоочуна -ып, -са, -гандан кийин, -ган соң, -ган убакта деген формаларды улап, сүйлөмдөрдү кайра түзгүлө. Мурунку сүйлөм менен салыштыргыла. Алардын айырмачылыгын түшүндүргүлө."},{"t":"p","h":"1. Жигит өзү да иштейт, элге демилге берет. 2. Шамбеттин демилгеси ишти кызытат, алар эгин талаасынан мол түшүм алсак дешет. (Т. С.) 3З. Аба барган сайын салкын тартты, күн кыскарды. 4. Чөптөр кубарды, тал-теректер жалбырактарын түшүрдү. (К. Б.) 5. Күндүн нуру жер бетине тегиз чачырады, биз жайлоого жөнөдүк. (К. Ж.)"},{"t":"p","h":"Ү лгү: Жигит өзү да иштейт, элге демилге берет. Жигит өзү да иштеп, элге демилге берет. Багынынкы байланыштагы татаал сүйлөм. Мында баш жана багынынкы сүйлөм бар. Ал эми мурдагысы тен байланыштагы татаал сүйлөм болчу, анда баш жана багынынкы сүйлөм дегендер болбойт."},{"t":"p","h":"182. Биринчи сүйлөмдүн баяндоочун ар кандай формага келтирип, сүйлөмдү кайра түзгүлө. Татаал сүйлөмдөрдүн ортосундагы айырмачылыкты аныктагыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"73\">73<\/span>а) Кыш түштү, кар жаады. б) Кыш кетти, жаз келди. в) Жогортон соккон сыдырым жел басылды, кырман тынчыды. г) Күн батты, жылдыздар көрүндү."},{"t":"p","h":"Ү лгү: 1. Күн батты, Ай чыкты. – Күн баткан соң, Ай чыкты. – Кун батты, бирок, Ай чыккан жок. – Күн баткандан кийин, Ай чыкты. – Күн батса, Ай чыгат."},{"t":"p","h":"183. Окугула. Татаал сүйлөмдөрдүн түрлөрүн аныктагыла. Алардын айырмачылыгын түшүндүргүлө. Жөнөкөй сүйлөмдөр бири-бири менен кандайча байланышты?"},{"t":"p","h":"1. Асмандагы жылдыздар алыста турганы менен, ар бири өзүнчө нур төгөт*. 2. Жылдыздар ушинтип толгондо, биз капчыгай аралап келе жатканбыз. 3. Ушундай түндө жол жүргөн кандай жакшы! (Ч. А.) 4. Кез байланган учурда Чолпонбай үйгө келди да, аскерге кетүүгө даярдана баштады."},{"t":"p","h":"5. Жай айлары аяктап калган, Чолпонбай жүргөн бөлүк Дон суусунун чыгыш тарабына орношту!. 6. Алда кайдан аркайып, Ала-Тоо карап тургансыйт, калдайган кыргыз эли, «талкала жоону» дегендей, кол булгалагансыйт. (К. Ж.)"},{"t":"p","h":"184. Көчүргүлө. Синтаксистик талдоо жүргүзгүлө: а) грамматикалык түзүлүшү боюнча; б) сүйлөм мүчөлөрү боюнча; в) баш жана багынынкы сүйлөмдөрдүн байланышуу жолдору боюнча."},{"t":"p","h":"Тоо-токойго конур күз келгенде, мен биринчи жолу мектепке бардым. Ушундан тартып, Дүйшөн айылды үймө-үй кыдырып, бизди мектепке алып барып жүрдү. Мен силерге, балдар, арип жазууну, сан жазууну үйрөтөм. Өзүм эмнени билсем, ошону окутам. Анын ак пейилинен кылган аракети, менимче, талаага кеткен жок. (Ч. А.)"},{"t":"p","h":"185. Көп чекиттин ордуна экинчи сүйлөмдү ойлоп таап, көчүргүлө. Тыныш белгисин койгула. Татаал сүйлөмдүн кайсы түрү түзүлдү? Анын бөлүктөрү өз ара кандайча байланышты?"},{"t":"p","h":"1. Чон эненин жүрөгү элжиреп ... 2.... балдар орундарынан тура калышты. 3. Жер бай болсо ... 4. Баатыр кол баштайт... 5. ... тоого баратабыз."},{"t":"p","h":"186. Көчүргүлө. Сүйлөм мүчөлөрүнүн астын сызгыла. Атоочтук, чакчыл түрмөктөрдү тапкыла. Багынынкы сүйлөмдүн синтаксистик түрмөктөр менен окшоштугу барбы? Айырмасы кандай?"},{"t":"p","h":"<span class=\"pg\" data-n=\"74\">74<\/span>1. Антип-минтип арабаны кайырганча, Жамийла нары жакта иштеп жаткан аялдарга чуркап кетиптир. – Биздин баатырлар кыштактан кездешкенче, арадан көп мезгил өттү."},{"t":"p","h":"2. Токтогулдун үнүн угуп, эл чогула калышты. – Мөмөлөр гүлдөп, айлана кулпура баштады. 8. Сапарчылар жолго чыкканда, майдалап кар жаай баштады. – Айылга жакындаганда Зарыл машинадан түшүп калды. (Т. С.)"},{"t":"p","h":"187. Эки жөнөкөй сүйлөмдү -ып, -са, -ган+да мүчөлөрү менен байланыштырып, багынынкы байланыштагы татаал сүйлөм (ар бирине экиден мисал) түзгүлө. Баш жана багынынкы сүйлөмдөр жөнүндө айтып бергиле."}],"sub":[{"title":"ТӨРТ ГАНА КҮН КАЛГАН ЭЛЕ","b":16},{"title":"УЛАР","b":23}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[70,74]},{"title":"§ 23. БАШ ЖАНА БАГЫНЫҢКЫ СҮЙЛӨМДӨРДҮН ОРДУ ЖАНА ТЫНЫШ БЕЛГИЛЕРИ","blocks":[{"t":"h3","h":"§ 23. БАШ ЖАНА БАГЫНЫҢКЫ СҮЙЛӨМДӨРДҮН ОРДУ ЖАНА ТЫНЫШ БЕЛГИЛЕРИ"},{"t":"p","h":"1. Көпчүлүк учурда багынынкы сүйлөм баш сүйлөмдөн мурда келет: Соно суудан көтөрүлүп учканча, ак шумкар шыпылдап жетип келди. Соно суудан көтөрүлүп учканча – багынынкы сүйлөм."},{"t":"p","h":"2. Кээде баш сүйлөмдүн ортосунда кыстырылып келет: Нурланбек, мен барганда, кубанып кетчү. Мен барганда – багынынкы сүйлөм."},{"t":"p","h":"3. Баш сүйлөмдөн кийин келген учурлары да болот: Бала кубанып жалп-жалп этип тоголонгондо. (Ч. А.) Фашисттер жалп-жалп этип тоголонгондо – багынынкы сүйлөм."},{"t":"p","h":"Багынынкы сүйлөм ар дайым ү т ү р менен ажыратылат. Эгерде ал баш сүйлөмдүн ортосунда келсе, үтүр багынынкы сүйлөмдүн эки жагына коюлат: Келин-кыздар, Бурулча эшиктен келгенде, орундарынан тура калышты. (К. Б.)"},{"t":"p","h":"Баш жана багынынкы сүйлөмдөргө коюлуучу тыныш белгилердин схемасына көнүл бургула (чарчы кашаа баш сүйлөмдү, кашаа – багынынкы сүйлөмдү билдирет):"},{"t":"v","l":["1. Эне тил болбой, эл болбойт. (Мак.)","","2. Таятам үйгө, мен жаткандан кийин, келди.","(,","3. Ала-Тоо көрккө келбейт, эл болбосо. (Б. А.)",")."]},{"t":"p","h":"<span class=\"pg\" data-n=\"75\">75<\/span>188. Окугула. Багынынкы сүйлөмдүн ордун аныктагыла. Тыныш белгисинин кандайча коюларын түшүндүргүлө. Алардын схемасын чийгиле (биринчи, төртүнчү жана алтынчы сүйлөмдүн)."},{"t":"p","h":"1. «Ак зыйнат» чертилип, Султаналы уулунун келечегин ойлоду. 2. Алар айкөл Манастын күмбөзүнүн тушуна келген убакта, жаан күчөй баштады. (К. К.) З. Бетинен нуру чачырап, толкундап Сырга кубанды. 4. Кара бороон согуп турду, карышкыр капчыгайдан улугандай. (Ж. Б.) 5. Жамгыр күчөгөндөн күчөп, чагылган чартылдап, койлор дыр берип үркүп жатты. (А. Т.) 6. Күн, ал Таабалдыны ээрчитип чыкканда, жаңыдан кылкылдап батып бараткан эле. (К. Бек.) 8. Уулжан, Жамийла келгенче, үй ичин тартипке келтирди. (К. Б.)"},{"t":"p","h":"189. Окугула. Баш жана багыныңкы сүйлөмдөрдү аныктагыла. Алардын сүйлөмдөгү орду кандай? Тыныш белгиси кандайча коюлду?"},{"t":"p","h":"1. Ал, күрөөсү кызарганча, сүйлөдү. 2. Эки жигит, ырчылар жакындаганда, утурлай бастырышты. (К. К.) 3. Отундары күйүп бүткөндөн кийин, ракетанын баскычтары ыргып түшө баштады. («КТ») 4. Люба келгенден бери, Каныш жалгыздык тарткан жок. (Т.С.) 5. Күн нуру өрөөндү тегиз басканда, биз Жалал-Абадда болдук. 6. Сенин ишин орундалат, Зарыл тоодон келсе. («КБ»)"},{"t":"p","h":"190. Көчүргүлө, Баш жана багынынкы сүйлөмдөрдү тапкыла. Тыныш белгилерин койгула. Түшүндүргүлө. Багынынкы сүйлөмдүн баяндоочуна сөздүн курамы (унгу, мүчө) боюнча талдоо жүргүзгүлө."},{"t":"p","h":"1. Бир аздан кийин Ай көтөрүлүп анын шооласы үйдүн ичин жаркыратып жиберди. (М. Э.) 2. Салмаксыздык абал пайда болгон учурда мен ордумдан камгактай жогору көтөрүлдүм. («КТ») 3. Абышка биз боз үйгө киргенче жалгыз күүсүн он чакты кайталап чертти. (А. Т.) 4. Алар эл уктаганча сүйлөшүп отурушту. 5. Алым Каныбектин кабарын укканда жүрөгүнүн башына тикенек кадалгандай болду. (К. Ж.)"},{"t":"p","h":"191. Калтырылып кеткен тыныш белгилерди коюп, көчүргүлө. Эмне үчүн коюлду? Түшүндүргүлө. Баш жана багынынкы сүйлөмдөр бири-бири менен кандайча байланышты?"},{"t":"p","h":"1. Баатыры! жообун бергенче эр Алмамбет кеп айтат. («Манас».) 2. Токтогул кезекти шакиртине бергенде Атай анын бир катар күүлөрүн аткарды."},{"t":"p","h":"3. Атай буга чейин Токтогулдун чон акындыгын, комузчулугун гана билсе, анын даанышман киши экендигин азыр түшүндү. (К. К.) 4. Мен эгерде атаэнем <span class=\"pg\" data-n=\"76\">76<\/span>жаман көрбөсө мугалим болгум келет. (Н. Б.) 5. Токтогулдун өнөрү комуз колуна тийгенде төгүлдү. (Ж. Б.)"},{"t":"p","h":"192. Көркөм окугула. Татаал сүйлөмдү таап, анын түрлөрүн (тен байланыштагы же багынынкы байланыштагы) аныктагыла. Алардын тутумундагы жөнөкөй сүйлөмдөр кандайча байланышат?"},{"t":"p","h":"1. Аргымактын баласы Буудан болот турбайбы. Баатыр жигит эл учун Курман болот турбайбы."},{"t":"v","l":["Кызыл онбос болсочу,","Кыз бурулбас болсочу!","Жибек онбос болсочу,","Жигит өлбөс болсочу. (Т.)"]},{"t":"p","h":"2. Мугалим бала поездден түшкөндө, сен унчукпай тур, эне. Мени тааныр бекен? (Ч. А.) 3. Балам, шартын келсе, Кетмен-Төбөгө өзүн каттап тур. Атай жанына келгенде, Токтогул аны менен коштошту. (К. К.)"},{"t":"p","h":"193. Көчүргүлө. Синтаксистик талдоо жүргүзгүлө: а) сүйлөмдүн грамматикалык түзүлүшү боюнча; б) сүйлөм мүчөлөрү боюнча. Үтүрдүн коюлушун түшүндүргүлө."},{"t":"p","h":"1. Айылдын мектеби. Мектептин ичи кенен, жарык. Алды жагында чон кара такта. Тактадан ары кырка коюлган көп парта... Парталарда отурган – отузга жакын балдар. (К. Б.) 2. Жамгыр өз убагында жаап, жер бети жашыл ыранга бөлөндү. Жер да марттыгын көрсөттү. Бали! Быйылкы эгинге көз тийбесин, жаратылыш ©зу колдосун! Буудай орокту күтүп турат, Чаргын, башташ керек. (Т. С.)"},{"t":"p","h":"194. Татаал сүйлөмдүн тутумундагы баш жана багынынкы сүйлөмдөрдү тапкыла. Аларды өз ара байланыштырууда грамматикалык кандай формалар колдонулду?"},{"t":"p","h":"1. Көнүлү туш-тушка бөлүнүп, Сейде дагы башын ылдый салды. Айыл тынчыганда, Сейде, жибин алып, отунга кетти. Туманда энтелеген аял өзүнүн эн жакшы көргөн кишисине шашып кетип бара жатты. (Ч. А.)"},{"t":"v","l":["2. Туура сүйлөп, түз жүрсөн,","Кадырын болот калкына.","«Жайдары жигит болчу» деп,","Ыракмат айтат артында.","Кыялын, оюн түз болсо,","Кыргыз эмес кыпчак да","Жетет го, балдар, баркына. (Т.)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"77\">77<\/span>195. Көп чекиттин ордуна сүйлөм ойлоп таап, багынынкы байланыштагы татаал сүйлөм түзгүлө. Татаал сүйлөмдүн ушул түрү жөнүндө айтып бергиле. Тең байланыштагы татаал сүйлөмдөн айырмасы эмнеде?"},{"t":"p","h":"1. Тилек Туура-Суудан келгенче ... 2. Окуучулар эс алууга тараган кезде ... 3. Жаз эрте келсе ... 4. ... биз жолго чыга албай калдык. 5. ... мал короодон чыккан жок. 6. ... булбулдар сайрап турган убак. 7?.... жаан жаап жатыптыр."},{"t":"p","h":"196. БК. Окугула. Кептин кайсы түрү колдонулду? Анын кептин башка түрлөрүнөн айырмасы кандай? Ойду элестүү берүүдө чакчыл түрмөктүн кандай мааниге ээ болорун байкагыла."},{"t":"p","h":"1. Береги үйүн жана бардыгер мүлкүн бир гана төөгө жүктөп, эки жаш баласын жүктүн үстүнө отургузуп, жаман төшөк менен ороп таңып, зайыбы Күлүканга эшек мингизип, төө жетелетип, кызы Сүйүмкан менен уулу Алымды ээрчитип, белиндеги таягына эки колун арта салып, көкүрөгүн жагжайта, басып келе жаткан москоол денелүү, узун бойлуу кара киши Сансыздын досу – Карып. Ажар менен Сансыз жалынып-жалбарып жатып, ушул төөнүн күчүн Карыпка сурап беришкен."},{"t":"p","h":"2. Элечегине саймалуу ак жибек тартмасын тартынып, тартманын сол жагынан түркүн жибек жиптен жасалган чачысын булактатып, тартманын оң жагына келиштире тагылган үкүсүн сенселтип, алтын менен жалатып жасалган үзөнгүсүн чирене теминип, кара чапандын эки этегин бош коюп, жүк үстүнө килем жайдырып, чон кара атанды жетелеп, Түлкүбектин зайыбы Күмүш чубалжыган көчтүн эң алдында келе жатат. (К. Ж.)"},{"t":"p","h":"197. Окугула. Багынынкы байланыштагы татаал сүйлөмдөрдү таап көчүргүлө, калтырылып кеткен тыныш белгисин койгула, анын схемасын чийгиле. Татаал сүйлөмдүн ушул түрү жөнүндө айтып бергиле."},{"t":"p","h":"1. Талаа да, кучагын жайып, Ажарга жол берди. Ажар бир аз жол жүргөндөн кийин арт жагынан көп нерсенин үргөнү угулду. Ажар коркту, ыйлап жиберди. Бирок илешкен жоо калчубу? Ажар карышкырлар жакындап кирип келген сайын ширенке тартып жатты. (К. Б.) 2. Сулуунун көркү болбойт кал болбосо. Өрдөк, каз кайда конот көл болбосо? (Б. А.)"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[75,77]},{"title":"&amp; 24, БАГЫНЫҢКЫ БАЙЛАНЫШТАГЫ ТАТААЛ СҮЙЛӨМ БОЮНЧА СИНТАКСИСТИК ТАЛДОО","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"78\">78<\/span>&amp; 24, БАГЫНЫҢКЫ БАЙЛАНЫШТАГЫ ТАТААЛ СҮЙЛӨМ БОЮНЧА СИНТАКСИСТИК ТАЛДОО"},{"t":"p","h":"Талдоонун тартиби:"},{"t":"p","h":"1. Канча жөнөкөй сүйлөмдөн түзүлгөнүн атап көрсөтүү, алардын ар биринин баш мүчөлөрүн табуу."},{"t":"p","h":"2. Баш жана багынынкы сүйлөмдү атоо."},{"t":"p","h":"3. Баш жана багынынкы сүйлөмдөрдүн байланышуу жолун, багынынкы сүйлөмдүн кайсы түрү экенин аныктоо."},{"t":"p","h":"4. Тыныш белгилеринин коюлушун түшүндүрүү."},{"t":"p","h":"Ү л гү: Биз белге чыкканда, чыныдай аппак үйлөр көрүндү. (Н. Б.) – Айтылыш максаты боюнча жай сүйлөм, түзүлүшү боюнча багыныңкы байланыштагы татаал сүйлөм; эки жөнөкөй сүйлөмдөн түзүлдү: а) биз белге чыга бергенде (биз – ээ, чыга бергенде – баяндооч); б) чыныдай аппак үйлөр көрүндү (үйлөр – ээ, көрүндү – баяндооч). Жөнөкөй сүйлөмдүн ар биринин баш мүчөлөрүнүн асты сызылат; экинчиси – баш сүйлөм. Биринчиси багынынкы сүйлөм. Баш сүйлөмдөн мурда келип, аны менен -ган+да формасында байланышты. Качан чыныдай аппак үйлөр көрүндү? – биз белге чыга бергенде – мезгил багынынкы сүйлөм. Баш жана багынынкы сүйлөмдүн ортосуна ү т үр коюлат."},{"t":"p","h":"198. Багынынкы байланыштагы татаал сүйлөмгө синтаксистик талдоо жүргүзгүлө."},{"t":"p","h":"1. Жаз аяктаганда, тоо таянып, малчылар көчүп келишет. 2. Токойдун бир бутагы сынбасын деп, биз атайы коруп отурбайбызбы. (Ч. А.)"},{"t":"v","l":["3. Жаманга дөөлөт келгенде,","Көтөрө албай мас болот,","Пайдалуу иши аз болот. (Ж.)"]},{"t":"p","h":"4. Ылай суу бара-бара тазаланар, каран түн, күн чыкканда, кайра жанар. («ЗО») 5. Жигиттин наамы чыкпайт, март болбосо. Ак бетте кызыл болбойт, нур болбосо. (Б.А.)"},{"t":"p","h":"199. Багынынкы байланыштагы татаал сүйлөмдү таап, ага синтаксистик талдоо (оозеки) жүргүзгүлө."},{"t":"p","h":"<span class=\"pg\" data-n=\"79\">79<\/span>Душман жеңилип, согуш аяктаганда, алдастаган дүйнө тымтырс боло түштү. Алиман экөөбүз баштагыдай эле талаада иштеп жүрдүк. Бригадирликти мен, балдар фронттон кайтып келер замат, өткөрүп бергем. Заман тынчыганы менен, Алиман экөөбүздүн санаабыз тынган жок. Сыртыбыздан жашырып, сыр билдирбеген болобуз. Ал эми Алиман болсо, мени аяп, кыялбай жүрдү окшойт. Ичимден аябай ыраазы болдум. Ушинтип, бир-бирибизди кыялбай жүрдүк. Билесин го, Жер энем, ошол жылы мен үчүн кандай оор жыл болду... (Ч. А.)"},{"t":"p","h":"200. ««Манас» эпосу – кыргыз рухунун туу чокусу» деген темада ой жүгүртүү мүнөзүндөгү дилбаян жазып келгиле. Татаал сүйлөмдүн түрлөрүн колдонгула."},{"t":"p","h":"201. Текстти окугула. Татаал сүйлөмдөрдү көрсөткүлө, алардын кандай түрлөрүн билесинер? Алардын айырмасын түшүндүргүлө."},{"t":"p","h":"– Мындайча айтканда, менде дагы кемчиликтер көп эле, ар нерсеге али түшүнгөн эмес экенмин. Мен да, Арзымат да – экөөбүз унчукпай отурабыз. Бүткөн боюм чымырап, бетим тамылжып, жүрөгүм алып учат, азоо жүрөк тык-тык урат!.. Ошентип, кыйынчылыктар артта калды, оор күндөрдү женип чыктык, – деп сөзүн бүтүрдү Айнагүл."},{"t":"p","h":"Машина айылга жакындаганда, Эргеш менен Арзымат алдыбыздан чыкты. Кызыл-тазыл кийинген жаштар эл аралык аялдар күнүн майрамдап жүрүшкөн экен, бул майрамга биз да аралашып кеттик. (К. Ж.)"},{"t":"p","h":"202. Көчүргүлө. Синтаксистик талдоо жүргүзгүлө."},{"t":"h3","h":"ЭЛ КАЗЫНАСЫНАН"},{"t":"p","h":"1. Жөнөкөйлүктүн эки түрү бар: табигый түрү жана үйрөнгөн түрү."},{"t":"p","h":"2. Жүрүш-туруш адамдын ким экендигин билдире турган күзгү болот. 3. Адам эки жашабайт, бирок адам болуп бир жолу да жашай албагандар бар. 4. Жаманга башчы болгуча, жакшыга кошчу бол. 5. Жазуучунун бир гана мугалими болот, ал – анын окурманы. 6. Жакшы адам сөзүн бир айтар, жаман адам мин айтар."}],"sub":[{"title":"ЭЛ КАЗЫНАСЫНАН","b":18}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[78,79]},{"title":"БАГЫНЫҢКЫ СҮЙЛӨМДҮН ТҮРЛӨРҮ","blocks":[{"t":"h2","h":"<span class=\"pg\" data-n=\"80\">80<\/span>БАГЫНЫҢКЫ СҮЙЛӨМДҮН ТҮРЛӨРҮ"},{"t":"v","l":["Мааниси жана грамматикалык түзүлүшү боюнча багынынкы сүйлөмдүн","төмөнкүдөй түрлөрү бар. Таблицага көнүл бургула.","","Багынынкы","сүйлөмдүн түрлөрү","Сапарчылар мейкинге чыкканда, майдалап","кар жаады."]},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>2.<\/td><td>Орун<\/td><td>Билим кайда болсо, өнөр да ошол жерд со ол е<\/td><\/tr><tr><td>болот.<\/td><\/tr><tr><td>3.<\/td><td>Шарттуу<\/td><td>Асмандан жамгыр төгүлсө, чөптүн гүлү<\/td><\/tr><tr><td>ачылат.<\/td><\/tr><tr><td>4.<\/td><td>Карама-каршы<\/td><td>Ал канчалык аракет кылса да, минген аты<\/td><\/tr><tr><td>баспай койду.<\/td><\/tr><tr><td>5.<\/td><td>Сыпат<\/td><td>Кош кубаныч жүрөгүн толкутуп, Кычан түндүн<\/td><\/tr><tr><td>далайына чейин уктабады.<\/td><\/tr><tr><td>6.<\/td><td>Салыштырма<\/td><td>Тоого чыккан адам алысты көргөндөй, окуган<\/td><\/tr><tr><td>адам дүйнөнү кен тааныйт.<\/td><\/tr><tr><td>Т.<\/td><td>Себеп<\/td><td>Жол тайгак болгондуктан, Бектемир жай гана<\/td><\/tr><tr><td>бастырып келе жатты.<\/td><\/tr><tr><td>8.<\/td><td>Максат<\/td><td>Нурлан тоого барып келсин үчүн, энеси кам<\/td><\/tr><tr><td>көрө баштады.<\/td><\/tr><tr><td>9.<\/td><td>Сан-өлчөм<\/td><\/tr><tr><td>Адам канчалык көп окуса, ал ошончолук көптү<\/td><\/tr><tr><td>билет.<\/td><\/tr><tr><td>§ 25. МЕЗГИЛ БАГЫНЫҢКЫ СҮЙЛӨМ<\/td><\/tr><tr><td>Мезгил багыныңкы сүйлөм баш сүйлөмдөгү ойдун мезгилин бил-<\/td><\/tr><tr><td>дирет. Качан? Качанга чейин? Качантан бери? Качанга<\/td><\/tr><tr><td>дейре? Кайсы учурда? Кайсы убакта? деген суроолорго<\/td><\/tr><tr><td>жооп берет.<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"81\">81<\/span>Мисалы: 1. Турсун эшикке чыкканда, күн батып кеткен болчу. (К. Б) – Качан кун батып кеткен болчу? – Турсун эшикке чыкканда – мезгил багынынкы сүйлөм."},{"t":"p","h":"Баш сүйлөм менен байланышууда мезгил багынынкы сүйлөмдүн баяндоочуна төмөнкүдөй мүчөлөр уланат:"},{"t":"p","h":"1. Чакчыл мүчөлөр -а(-й),-ганча, -ганы, -гыча, -майынча, -майын: Жолдошторубуз кел+мейинче, биз мелдешке барбайбыз."},{"t":"p","h":"2. Атоочтуктун -ган мүчөсүнө ж ө н д ө мө мүчөлөр (барыш, жатыш, чыгыш) уланат же жандооч (кийин, соң, чейин, кезде, бери ж.б.) айкашып келет: 1. Биз ээрчишип келе жат+кан+да, дүйнө башкача сезиле турган. (Ч. А.). 2. Меймандар отур+ган убакта, Токтогул комузун колуна алды. (К. К.)"},{"t":"p","h":"3. Шарттуу ынгайдын -са мүчөсү: Балдар токойдон чыгыш +са, айлананы туман каптап калыптыр."},{"t":"p","h":"203. Окугула. Мезгил багынынкы сүйлөмдү көчүрүп жазгыла. Анын баяндоочу кандай формада түзүлгөнүн жазып көрсөткүлө. Баш сүйлөм менен кандайча байланышты?"},{"t":"p","h":"1. Бир аз убакыт өткөндөн кийин, Чолпонбайлар Дон суусунун чыгыш жээгиндеги камышка келишти“. Душман аларды али көрө элек. Суудан кантип өтүү керек? Чолпонбайлар жабылып сууга киргенде, душмандар көрүп калышты. (К. Ж.) 2. Күн чыга, Жапар кырмандан келди. 3. Кыш ооп, жаз да келди. (К. Б.) 4. Чөп чабык жаны башталган кезде, фронттон бир жарадар аскер келди. (Ч. А.) 5. Эртеси малчылар белге чыгышса, борошолоп? кар жаады. Малчылар мындай күндөрдүн канчасын көрбөдү! («КТ»)"},{"t":"p","h":"Улгу: Бир аз убакыт өткөндөн кийин, жаркырап электр шамы күйдү. Качан? – бир аз убакыт өткөндөн кийин – мезгил багынынкы сүйлөм; баяндоочу -көн+дөн кийин формасында түзүлдү; ушул эле формалар аны баш сүйлөм менен байланыштырды (-көн – атоочтук мүчө, -дөн – чыгыш жөндөмөнүн мүчөсү, кийин – жандооч)."},{"t":"p","h":"204. Сол жак катардан мезгил багыныңкы сүйлөмдү тапкыла. Аны оң жактагы сүйлөм менен салыштыргыла. Тутумдаш мезгил бышыктоочтун жана аныктоочтун милдетин аткарган сөз тизмеги эмне үчүн өзүнчө сүйлөм боло албайт? Түшүндүргүлө?"},{"t":"p","h":"1.Сапарчылар тамактангандан кийин, команда станциянын началь-"},{"t":"v","l":["нигине жолугушту. (Т. С.)","Тамактангандан кийин команда","станциянын начальнигине жолугушту."]},{"t":"p","h":"<span class=\"pg\" data-n=\"82\">82<\/span>2. Мамбетов жетекчилик кылган убакта*, бригада эгинден мол түшүм алды. («К. Б».)"},{"t":"p","h":"3. Токтогул тигилген үйлөргө жөнөгөндө, эл кашатты көздөй бет алды."},{"t":"v","l":["Мамбетов жетекчилик кылган","бригада эгинден мол түшүм алды.","","Айылдан"]},{"t":"p","h":"Бекташ арабаны жайыраак айдады. (Ч. А.)"},{"t":"p","h":"205. Адегенде баш сүйлөмдү, андан кийин ал аркылуу суроо берип, мезгил багыныңкы сүйлөмдү аныктагыла. Баш жана багынынкы сүйлөмдөр өз ара кандайча байланышты?"},{"t":"p","h":"Ю. Гагарин ааламда учуп жүргөндө, ал жөнүндөгү атак-данк бүткүл дүйнөгө тараган. – Ю. Гагарин ааламда учуп жүргөн мезгилде, ал жөнүндөгү атак-данк бүткүл дүйнөгө тараган. – Ю. Гагарин ааламда учуп жүрсө, ал жөнүндөгү атак-данк бүткүл дүйнөгө тараган. – Ю. Гагарин ааламда учуп жүргөн убакта, ал жөнүндөгү атак-данк бүткүл дүйнөгө тараган."},{"t":"p","h":"206. Калтырылып кеткен тыныш белгини өз ордуна коюп, мезгил багынынкы сүйлөм катышкан татаал сүйлөмдү көчүрүп жазгыла. Баш мүчөлөрүнүн астын сызгыла. Багынынкы сүйлөм баш сүйлөм менен кандайча байланышты?"},{"t":"p","h":"1. Мен кийинип жатканда кыздын энеси сөз сүйлөдү. Кызым, жалгыз жанын бар, бул баланы кор кылбай жумша. Эне сүтү оозунан кете элек бирөөнүн жалгызы экен. (А. Т.) 2. Билимге көнүлүндү байлаба, өмүрүндү байла. (Мак.) 3. Жаз жакындаган сон бул жерде да күндүн кыялы өзгөрүлүп турду. Каныбек нанды ала койгуча эшиктен кишилер кирип келишти. (К. Ж.) 4. Самтыр сүйлөгөндөн кийин бир саамга журт жымжырт отурушту. (Т. С.) 5. Кабар келгенине сүйүнбөй, кайра шылкыя калат экенсин да, балам. Ушинтип, Толгонай Алиманды жемелейт. (Ч. А.)"},{"t":"p","h":"207. Мезгил багыныңкы сүйлөмдүн баяндоочун ар түрдүү формага келтирип, кайра түзгүлө, анын баяндоочу синонимдүү болорун эсинерде сактагыла."},{"t":"p","h":"1. Чарбанын жумушу бир аз сээлдей түшөр замат, эл Шамбеттикине чогулду. (Т. С.) 2. Биз аянттан өтүп бараткан мезгилде, жаркырап күн ачылды. (А. Т.) З. Жыйналыш бүтөрү менен, студенттер шатырата кол чабышты."},{"t":"p","h":"4. Талап шаардан келмейинче, биз тоого барбайбыз. («А. Т.»)"},{"t":"p","h":"208. Кеп чекиттин ордуна баш сүйлөмдү, тескерисинче, багынынкы сүйлөмдү ойлоп таап жазгыла. Тыныш белгилерин койгула. Татаал сүйлөмдүн кайсы түрү <span class=\"pg\" data-n=\"83\">83<\/span>түзүлдү? Мезгил багыныңкы сүйлөм деген эмне? Ал баш сүйлөм менен кандайча байланышат?"},{"t":"p","h":"1. Кызмат аяктаган сон ... 2. Сен бак-даракты сугарып бүткөнчө... 3. ... балдар жапырт гүл терүүгө чыгышты. 4. ... ал ордунан обдулуп тура калды."},{"t":"p","h":"5. Зина үйдөн чыгар замат.... 6.... гидротехник Бектемир атка минди."},{"t":"p","h":"209. Мезгил багынынкы сүйлөмдүн баяндоочун төмөнкүдөй формаларга келтирип, багынынкы байланыштагы татаал сүйлөм түзгүлө."},{"t":"p","h":"1) -ган убакта"},{"t":"v","l":["2) -ган сайын","3) -са","4) -ган+да","5) -ган+га чейин","6) -майынча"]},{"t":"p","h":"210. Атоочтук түрмөктү жана мезгил багынынкы сүйлөмдү тапкыла. Аларды салыштыргыла. Кандай айырмачылыкты байкадыңар?"},{"t":"p","h":"1. Ызасы ташыган Динар алга карай ылдамдай басты. – Ызасы ташыган соң, Динар алга карай ылдамдай басты. 2. Уйкусу ачылып кеткен Аскат ордунан ыргып турду. – Уйкусу ачылып кеткенден кийин, Аскат ордунан ыргып турду. 3. Айылда жүргөн учурда ал айылдык кеңештин төрагасы эле. – Алтынай Сулайманова станцияга жөнөп жаткан учурда, мен да кошо жөнөп калдым. (Ч. А.) 4. Биз Бишкектен айылга кайтып баратканда, айылдаштар өзүлөрүн кубанычтуу сезишти. }йүн көздөй кетип баратканда Махабат өзүн бактылуу сезди. («А»)"},{"t":"p","h":"211. Мезгил багыныңкы сүйлөмдү пайдаланып, чакан ангеме жазып келгиле. Аңгеме түзүүдө кептин кайсы түрүн колдондунар?"},{"t":"p","h":"212. Мезгил багыныңкы сүйлөм катышкан татаал сүйлөмдү тапкыла. Ал боюнча төмөнкү суроолорго жооп бергиле: а) мезгил багыныңкы баш сүйлөм менен кандай формада байланышат; б) кандай суроолорго жооп берет; в) аны баш сүйлөмдөн ажыратып, өзүнчө колдонууга болобу?"},{"t":"p","h":"Адегенде Берлинден Табылды кайтты. Ал күрөштөрдө дасыккан, көкүрөгү ордендерге толгон. Алаамат башталган күндөн бери, жигит майданда жүрдү. Ошентсе да жигиттин эч бир жерин ок чарпыган эмес."},{"t":"p","h":"Шамбет менен Табылды катар келе жатышса, көчөдө ойногон балдар, аларды карап, токтой калышат."},{"t":"p","h":"Күндөрдүн биринде Касейин экөө эрмектешип отурган кезде, Каныштын үйүнө дагы бир капитан жигит кирди. Баласынын кызыгына кубанып отурган Люба ордунан учуп турду. (Т. С.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"84\">84<\/span>213. Баш жана мезгил багынынкы сүйлөмдүн ордун аныктагыла. Тыныш белгисин койгула, үтүр кайсы жерге коюлду?"},{"t":"p","h":"1. Мен чоң энем үйгө келгенде кубанып кеттим. 2. Чогулган эл Сабырлар келгенден кийин жемиш үзүүнү башташты. 3. Күркүрөп мотор айланды тетигин Сырга басканда. (Ж. Б.) 4. Ынтымак болсо калкында, душманындан тартынба. (Т.)"},{"t":"p","h":"214. Суроолорго жооп бергиле: а) грамматикалык түзүлүшү боюнча сүйлөм канчага бөлүнөт? б) татаал сүйлөмдүн кандай түрлөрү бар? в) мезгил багыныңкы сүйлөм деген эмне? Жообунарды мисалдар менен бекемдегиле."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[80,84]},{"title":"§ 26. ОРУН БАГЫНЫҢКЫ СҮЙЛӨМ","blocks":[{"t":"h3","h":"§ 26. ОРУН БАГЫНЫҢКЫ СҮЙЛӨМ"},{"t":"p","h":"Орун багыныңкы сүйлөм баш сүйлөмдөгү ойдун ордун билдирет. Кайда? Каерде? Кайдан? Кайсы ж а к т а? деген суроолорго жооп берет."},{"t":"p","h":"М ы: Токтогул ырчы кайсы жерде болсо, ыр менен күлкү ошол жерде болот. (К. К.) К ае рде ыр менен күлкү болот? – Токтогул ырчы кайсы жерде болсо – орун багынынкы сүйлөм."},{"t":"p","h":"Багынынкы сүйлөмдүн баяндоочу шарттуу ыңгайдын -са мүчөсү менен аяктап, ага кайда, каерде, кайдан, кайсы жерде; баш сүйлөмгө ошол жерде, ошерде, ошол жерден деген сөздөр кошулуп айтылат: Тартип кайда болсо, жеңиш ошол жерде болот. (Мак.)"},{"t":"p","h":"215. Текстти окугула. Орун багынынкы сүйлөмдү тапкыла. Ал кандай суроолорго жооп берди? Баш сүйлөм менен кандайча байланышты? Текстте багынынкы сүйлөмдүн башка түрү барбы?"},{"t":"p","h":"Аскер кишиси тизме окуганда, Чаргындын аты чыкпай калды, – Ой, жолдош! Мен эмне үчүн жокмун? – деди Чаргын. Аскер кишиси токтоо гана жылмайды:"},{"t":"p","h":"– Айылына кете бер."},{"t":"p","h":"– Кетпеймин! – деди Чаргын ызаланып. Жолдошторум Элебес, Шамбеттер кайда баратса, мен да ошол жакка барамын. Жолдошторумдан бөлүнүп кала албаймын."},{"t":"p","h":"Жылдыз толгон кез. Күндүзгү уу-дуу жок. Пристанга келген эл каяктан келишсе, баары ошол жакка кетип баратышат. Түн бир убак. Жылдыздуу асман кереметтенет, Ала-Тоо көшүлүүдө. (Т. С.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"85\">85<\/span>216. Жөнөкөй сүйлөмдүн биринчисине кайда? каерде? кайдан? экинчисине ошол жерде, ошерде, ошол жерге, ошол жерден деген сөздөрдү кошуп жазып, орун багынынкылуу татаал сүйлөм түзгүлө. Сүйлөмдүн түзүлүшүндө кандай өзгөрүүлөр болду?"},{"t":"p","h":"1. Нурланбек иштеп жатат. Таалайбек да врач болуп иштейт. 2. Мен айылдан келдим. Сен да айылга барасын. 3. Булут жылды. Көлөкө да жылды. 4. Мергенчилер барат. Тилек экөөбүз да барабыз."},{"t":"p","h":"Улгу: Нурланбек кайда иштесе, Таалайбек да ошол жерде врач болуп иштейт."},{"t":"p","h":"217. Орун багынынкы сүйлөмгө карата баш сүйлөмдү ойлоп таап, татаал сүйлөм түзгүлө. Тыныш белгисин койгула. Багынынкы баш сүйлөм менен кандайча байланышты?"},{"t":"p","h":"1. Билим кайда болсо ... 2. Кайсы жерде кыйын иш болсо ... 3. Биз каякка барсак ... 4. Адистер кайдан келишсе ...5. Мен кайда болсом ..."},{"t":"p","h":"6. Менин балдарым кайсы жерде иштешсе ..."},{"t":"p","h":"218. Окугула. Татаал сүйлөмдөрдү көрсөткүлө, анын кайсы түрү? Багыныңкы байланыштагы татаал сүйлөм кандай бөлүктөрдөн түзүлөт? Багынынкы баш сүйлөмдүн кандай кырдаалын билдирет? Текстте кептин кайсы түрү колдонулду?"},{"t":"p","h":"Кыштын узак түнү... Чырак өчкөндө, мергенчи ангемесин баштады. Күндөрдүн биринде тоодон келе жатсам, бир аюу таш көтөрүп бараткан экен. Ташты жардын башына койду да, эңкейип алды жагын карады. Ошентип, казандай таштан беш-алтыны жыйды."},{"t":"p","h":"Мен аюунун бул ишине таң калдым. Бир кезде аюу тикесинен тура калды да, таштарды асканын астын көздөй зыркыратып ыргыта баштады. Бир маалда келе жаткан каманды көрө коюп, аюу бакыра жөнөдү. Аюу каякка качса, каман да ошол жакка чуркап бара жатты. Каман аюуну чала турган болгондо, каманды мандайга басып калдым."},{"t":"p","h":"Окуя мындай болуптур. Асканын түбүндө аюунун балдары бар экен. Каман анын балдарын жей баштаганда, аюу таш менен уруп, бир топ торопоюн жалпайтыптыр. Ошентип, балдары үчүн аюуну ажалдан алып калдым."},{"t": а ...са +... ошол жакта...","4)... каякта ...са +... ошол жерде...","","Ү лгү: Тартип кайда болсо, ошол жерде ийгилик болот."]},{"t":"p","h":"221. Көчүргүлө. Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Орун бышыктооч менен орун багынынкы сүйлөмдүн айырмасы эмнеде?"},{"t":"p","h":"1. Эмгек бар жерде жылыш бар. Жылыш бар жерде ырыс бар. («ЗО») 2. Кыз менин калпыма түшүндү окшойт, үнүн чыгарып, күлүп жиберди: – Мен сени менен качкым келет. Кайсы жактан келгенинди билесинби? Сен кайдан келсен, экөөбүз ошол жакка барабыз. Куткарып кете аласынбы? (А. Т.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"87\">87<\/span>222. -са мүчөсү менен аяктаган сүйлөмдөр мааниси боюнча багынынкы сүйлөмдүн кайсы түрү?"},{"t":"p","h":"1. Көгүчкөн учар, жем чыкса. Көк тулпар чуркар, тер чыкса. (Калыгул.) 2. Арыктын көркү болбойт, тал болбосо. Чарбанын көркү болбойт, мал болбосо (Б. А.) 3. Баккан ээси жарашса, күйпүл күчүк сак болот. Балан пайдалуу болсо, аштыгың айдалуу. 4. Кайсы жерде окуу болсо, сени ошол жерге жиберем. («КБ»)"},{"t":"p","h":"223. -са мүчөсүн пайдаланып, багыныңкы байланыштагы бир нече татаал сүйлөм түзгүлө. Багынынкы баш сүйлөмдүн кандай кырдаалын билдиргендигин түшүндүргүлө."}],"sub":[{"title":"БОЛОТ МУРАТАЛИЕВИЧ ЮНУСАЛИЕВ","b":19}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[85,87]},{"title":"§ 27. ШАРТТУУ БАГЫНЫҢКЫ СҮЙЛӨМ","blocks":[{"t":"h3","h":"§ 27. ШАРТТУУ БАГЫНЫҢКЫ СҮЙЛӨМ"},{"t":"p","h":"Шарттуу багыныңкы сүйлөм баш сүйлөмдөгү ойдун шартын билдирет. Эмне болот? Кандай болгондо? Эмне болбой? деген суроолорго жооп берет."},{"t":"p","h":"Мисалы, Сүрөт элге жакса, мен өзүмдү бактылуу деп эсептеймин. (А. Т.)"},{"t":"p","h":"Э м не б ол с о мен өзүмдү бактылуу деп эсептеймин? – Сүрөт элге жакса – шарттуу багынынкы сүйлөм."},{"t":"p","h":"Багынынкы сүйлөмдүн баяндоочу этиштин төмөндөкүдөй мүчөлөрү аркылуу түзүлөт:"},{"t":"p","h":"1. Шарттуу ынгайдын -са мүчөсү: Дыйканчылык көп болсо, жердин гүлү ачылат. (Т.) 2. -бай (-ба+й) мүчөсү: Ынтымак болбой, иш оңолбойт. (Мак.)"},{"t":"p","h

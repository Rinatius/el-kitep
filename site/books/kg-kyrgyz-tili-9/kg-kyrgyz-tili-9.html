,{"t":"p","h":"– Ошондо мен боз коёндон жапыз болоюн, сен боз куштан илгир бол. Кемпирдин жети башын ыргыта чаап, өгөөнү илип алсан, бизге кудай бергени."},{"t":"p","h":"Төштүк кемпирдин жанына барып, айтышып туруп, алты башын кылыч менен кыя чапты. Кемпир качып берди. Төштүк артынан кубалап калды. Аттын дүбүртүнөн улам тоо жарылып, көл болду. Тоодой таштар убаланып кумга айланды. Ангыча кара жер как жарылып, желмогуз кемпир жер астына кирип кетти. Төштүк кууп артынан кошо кирди."},{"t":"p","h":"Көрсө, желмогуз кемпирдин Төштүккө келишинин себеби мындай экен. Жер алдындагы Урумкандын Узунчач аттуу кызы жер үстүндөгү тогуз уулдун кенжеси, Элемандын эркеси Төштүккө ашык болуп калат да, «Төштүктү азгырып алып кел» деп жети баштуу желмогуз кемпирди жиберген экен. («Эр Төштүк»)."},{"t":"p","h":"19. БК. Текстти окугула. Анда сөздүн күчү аркылуу көркөм чыгарманын каарманы кандайча сүрөттөлгөн? Каарманга мүнөздүү негизги белгилерди көрсөткүлө. Текст кайсы адабий чыгармадан алынган?"},{"t":"p","h":"Желелеп калын бырыш баскан жүзү качан болсо чүрүшө күлүмсүрөп, жүлжүйгөн көздөрү «ыя, бир жумушунду бүтүрүп берейинби? Айт, айта кой, <span class=\"pg\" data-n=\"11\">11<\/span>мен азыр....» – деп тургансыйт. Мурду саландап, кемирчек эмей эле жалаң эт өндүү. Кудай же бойдон, же сакалдан айтпаптыр, кедейген бою бакене, чүрүшкөн ээгинде эки-үч куйкул сары кыл сербейип, маке чал десен да келишпейт."},{"t":"p","h":"Момун курактуу башка карыяларды көрчү: күмүш чапкан ээр токунуп, жараган ат минип, кең жака ичикчен, суусар тебетейчен; сакалы көкүрөгүндө жайкалып, салабаттуу бастырып баратса, ким да болсо ийилип салам айтат. А Момунчу, жеткен атагы Момун элпек. (Ч. А.)"},{"t":"h3","h":"КЕПТИН СТИЛДЕРИ"},{"t":"p","h":"Кыргыз адабий тилинде текст түзүүнүн ар кандай ыктары бар, алар кептин с т ил дери деп аталышат."},{"t":"p","h":"Кептин стили жалпысынан сүйлөшүү жана китеп стили болуп экиге бөлүнөт. Китеп стилине төмөнкүлөр кирет: публицистикалык стиль, көркөм стиль, илимий стиль, иш кагаздарынын стили."},{"t":"h3","h":"$ э. ПУБЛИЦИСТИКАЛЫК СТИЛЬ"},{"t":"p","h":"Учурдагы маанилүү окуялар, иш-аракеттер, жаңылыктар жөнүндө маалымат берген чыгарманын бир туру публицистика деп аталат. Ал латындын публикус деген сөзүнөн алынган, бизче коомдук деген маанини билдирет. Бул чыгарма элдин кеңири катмарына ылайыкталып, коомдук, саясий, маданий маселелер боюнча кабар берет."},{"t":"p","h":"Публицистикалык стилге төмөнкүлөр мүнөздүү:"},{"t":"p","h":"а) гезит, журналдарда, радиоуктурууларда, телекөрсөтүүлөрдө, жарыш сөздөрдө, журналисттердин кептеринде ж. б. колдонулат;"},{"t":"p","h":"б) маанилүү коомдук, саясий жана маданий кабарларды билдирет, аларга туура мамиле жасоого чакырат;"},{"t":"p","h":"в) ачык-так, жеткиликтүү жана таасирдүү болуш үчүн учкул сөздөр, макал-ылакаптар, фразеологизмдер кенири пайдаланылат;"},{"t":"p","h":"г) коомдук, саясий сөздөр көбүрөөк колдонулуп, кээ бир сөздөр өтмө мааниде (пахта – ак алтын) болот жана кайталанып келе берет."},{"t":"p","h":"20. Тексттерди көрктүү окуп, алар кандай стилде берилгенин аныктагыла. Публицистикалык стилге мүнөздүү белгилер кайсылар? Ал жөнүндө айтып берип, тексттерден мисал келтиргиле."},{"t":"h3","h":"<span class=\"pg\" data-n=\"12\">12<\/span>НАН БИЗДИН БАЙЛЫГЫБЫЗ"},{"t":"p","h":"Нан биздин тугенгус байлыгыбыз! Нансыз жашоо да, тиричилик да болбостугу жалпыбызга маалым. Нан канчалык кеп болсо, кайсы гана жерде болбосун токчулук екум суреру белгилуу."},{"t":"p","h":"Биздин колубуздагы токчулуктан кабар берип турган ак нан кайратман баба дыйкандарыбыздын ак ниеттуу эмгегинен, мандай теринен жаралат эмеспи!"},{"t":"p","h":"Азыркы турмушта ар кандай учур кездешет, мисалы, кээ бир адамдар жерде жаткан нанды өйдө алып коюудан намыстанышат. Бир сындырым нанды да коромжуга учуратпай, аны ыйык жана улук деп билүүбүз керек. Эмесе, «нан болсо, ыр да болот» деген кепке терен түшүнө билүүбүз зарыл."},{"t":"p","h":"Нанды ысырапкорчулукка учуратып жаткандар менен келишпес түрдө, аеосуз күрөш жүргүзөлү, жаш достор!"},{"t":"p","h":"Грамматика – тил илиминин бир бөлүгү. Кен мааниде «лингвистика» деген түшүнүк менен синонимдеш. Адатта, ал тилдин морфология жана синтаксис деп аталган бөлүктөрүн өз ичине камтып, сөздөрдүн жана сүйлөмдөрдүн ички түзүлүш өзгөчөлүктөрүн үйрөтөт. Ар бир тилдин өзүнө мүнөздүү грамматикалык өзгөчөлүктөрү бар."},{"t":"p","h":"П"},{"t":"p","h":"1. Кычыраган кыш. Күн суук. Чыкылдаган кышкы аяз бети-колду тондурат. Күн чайыттай ачык. Асманда токумдай да булут жок. Кышкы күн алсыз нурун ай-ааламга чачууда. Аппак карлар жарк-журк этет. (К. Б.)"},{"t":"p","h":"2. Чаргын – айылдын белгилүү жигиттеринин бири. Жашы отуздан ашкан. Жаагы кере карыш бөтөнчө чон, көздөрү аландай берген, тартайган узун неме. Кичирээк жылкыга минсе, үч бүктөлөт. Жөө арышы саржан салган кишидей, өзү менен катар баскан адамдын алдына озуп кетет. (Т. С.)"},{"t":"p","h":"ш"},{"t":"h3","h":"ЖАЙДЫН КЕЧИ"},{"t":"p","h":"Манаттай асман кызарып, Магдырап барат айланам. Чачырайт көбүк бетиме, Чамынып аккан дайрадан."},{"t":"v","l":["Жалбыздын жыты буркурап,","Жанына жыпар чачкандай.","Торгойлор тынбай шаншышат,","Токтогул күүсүн тарткандай!","<span class=\"pg\" data-n=\"13\">13<\/span>Үргүлөп тоолор баратат,","Уйкуга батып, алсырап.","Токтой тур, курбум, ток той тур,","Чолпон да чыгар чачырап. (Ж. Б.)"]},{"t":"h3","h":"§ 6. ТҮШҮНДҮРМӨ МҮЧӨ"},{"t":"p","h":"Т ү ш үн д ү р м ө м ү ч ө сүйлөмдүн баш жана айкындооч мүчөлөрүнөн кийин келет да, алардын маанисин тактайт, толуктайт жана ким, эмне экендигин билдирет."},{"t":"p","h":"Түшүндүрмө мүчө бир же бир нече сөздөн түзүлүшү мүмкүн."},{"t":"p","h":"Мисалы, 1. Биз, жаштар, ата-бабаларыбыздын осуяттарын аткарууга аракеттенебиз. 2. Биз, чөп чапкыч машина айдаган балдар, Даниярды ошондо биринчи жолу көрдүк. (Ч. А.)"},{"t":"p","h":"Түшүндүрмө мүчөлөр: жаштар, чөп чапкыч машина айдаган балдар. Булар биз деген сөздүн маанисин толуктады: 1-сүйлөмдө биз деген жаштар экендигин, 2-сүйлөмдө биз деген чөп чапкыч машина айдаган балдар экендигин билдирди."},{"t":"p","h":"Өзүнөн мурда келген сөз сүйлөмдүн кайсы мүчөсү болсо, түшүндүрмө мүчө да ошондой милдетти аткарат: Бизге, окуучуларга, сыйлыктар берилди. К и м ге берилди? – бизге – толуктооч; кимдерге? окуучуларга – толуктоочтун түшүндүрмө мүчөсү."},{"t":"p","h":"Түшүндүрмө мүчө интонациялык жактан бөлүнүп айтылат да, жазууда эки жагынан үтүр менен ажыратылат: Мени Бишкекке, педагогикалык университетке, жиберишти."},{"t":"p","h":"Эскертүү. Чакырык маанисинде айтылган сүйлөмдө түшүндүрмө мүчө сызыкча менен ажыратылат: Жашасын тынчтык – адамзаттын жаркыраган келечеги!"},{"t":"p","h":"21. Окугула. Сүйлөмдөгү түшүндүрмө мүчөнү тапкыла. Ал кайсы сөздүн маанисин тактады? Сүйлөмдүн кайсы мүчөсү?"},{"t":"p","h":"1. Январь айы... Биз Сухуми шаарына келдик. Күн жылуу. Пай-пай, шаар эмес бекен! Кышы жок бул эмне деген шаар? Азыркы күндө бизде, Кыргызстанда, катуу кыш. А мында, Абхазияда, коңур күз."},{"t":"p","h":"Карыя бизди, Кыргызстандан баргандарды, конок үйүнө алып кирди*. Үйдөгү адамдар жабыла тура калышты. Көрсө, алар, конок үйүндө отургандар, карыянын небере-чөбүрөлөрү экен. (К. Б.) 2. Айтканындай эле, Дүйшөн бизди ак дилинен окутуп жатты. Ошондо биз үчүн, тоо койнундагы кыргыз балдары үчүн, укмуштуудай жаңы дүйнө <span class=\"pg\" data-n=\"14\">14<\/span>ачылды. Ошондо эле Олуя-Ата, Ташкен сыяктуу чоң шаарлар бар экенин укканбыз. Турмуш онолгондо, биздин мектеп чон ак там болоруна ошондо эле ишенгенбиз. Биз, тоо балдары, эч бир күмөн санабай окуп жаттык. (Ч. А.)"},{"t":"p","h":"22. Сүйлөмдөрдү бири бирине салыштыргыла. Түшүндүрмө мүчө кандай мааниде колдонуларын түшүндүргүлө."},{"t":"p","h":"1. Улуу акын Токтогул өз өнөрүн шакирттерине, Калык менен Алымкулга, үйрөтүүнү эч качан көнүлүнөн чыгарган эмес. – Улуу акын Токтогул өз өнөрүн шакирттерине үйрөтүүнү эч качан көнүлүнөн чыгарган эмес. 2. Акындын кыргыз элине атагы чыккан ондогон окуучулары бар. 3. Алар, шакирттери, Токтогулдун күүлөрүн кылдаттык менен аткарышат. (Ж. Б.) 4. Алыста жүргөн атан өзүнүн сагынычтуу саламын жиберет. – Алыста, кандуу майданда, жүргөн атан өзүнүн сагынычтуу саламын жиберет. 5. Биз Батышта арстандарча алышып жатабыз. – Биз, кыргыз жоокерлери, Батышта арстандарча алышып жатабыз. (К. Б.)"},{"t":"p","h":"23. Көчүргүлө. Синтаксистик талдоо жүргүзүп, түшүндүрмө мүчө сүйлөмдүн кайсы мүчөсүнүн милдетин аткарганын аныктагыла,"},{"t":"p","h":"1. Анда мен, он төрттөгү жетим кыз, туугандарымдын колунда жүргөм. (Ч. А.) 2. Ал кишини биз, кыргыз балдары, Кузьмич ата дечүбүз. (Т. С.) 3. Бүбүсайра Бейшеналиеванын, кыргыз балеринасынын, аты көп жерге белгилүү. 4. Эки-үч күндө жайлоого, Сары-Белге, барганы жатабыз. 5. Бизге, жаштарга, билимге ээ болуу керек. («КБ»)"},{"t":"p","h":"У л гү: Анда мен, он төрттөгү жетим кыз, туугандарымдын колунда жүргөм. – Э м не болгом? – жүргөм – баяндооч; ким? – мен – он төрт жаштагы жетим кыз – ээнин түшүндүрмө мучесу; жүргөм? – туугандарымдын колунда – орун бышыктооч."},{"t":"v","l":["ким? -","кайда"]},{"t":"p","h":"24. Көчүргүлө. Түшүндүрмө мүчөнү таап, аны үтүр менен ажыраткыла. Ал сүйлөмдүн кайсы мүчөсүнүн милдетин аткарды?"},{"t":"p","h":"1. Менин? турмушумдагы ушундай тан каларлык күндү 1962-жылдын 12-апрелин чыдамсыздык менен күттүк. Биз космонавттар тынчтык үчүн кызмат кылабыз. («КТ») 2. Биз акындар жылдыз болсок көктөгү, анда Алыкул – жылдыздардын Чолпону. (Б. С.) 3. Анда биз бир кур өспүрүм балдар чарбада суу сугарабыз. Согушта салгылашып жаткан эр бүлөнүн оор түйшүгү биздин жаш балдардын мойнунда. Өзгөчө, эгин-жыйын келгенде, аптасы менен үй бетин көрбөйбүз. (Ч. А.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"15\">15<\/span>25. Көп чекиттин ордуна мааниси жагынан ылайык келүүчү түшүндүрмө мүчөнү коюп, сүйлөм түзгүлө. Аларды сүйлөм мүчөлөрү боюнча талдагыла. Түшүндүрмө мүчө сүйлөмдүн кайсы мүчөсү?"},{"t":"p","h":"Силер ..., биз ..., туулуп-өскөн айылыма ..., институтка ..., кечинде ..., силер учун ..., бизге..."},{"t":"p","h":"У л г ү: Силер, тогузунчу класстын окуучулары, эл жүгүн көтөргөн улан, кыздардан болгула."},{"t":"p","h":"26. Көчүргүлө. Калтырылып кеткен тыныш белгини койгула. Эмне үчүн коюлганын түшүндүргүлө. Андан кийин сүйлөмгө синтаксистик талдоо жүргүзгүлө:"},{"t":"p","h":"а) айтылыш максаты боюнча; б) грамматикалык түзүлүшү боюнча; в) сүйлөм мүчөлөрү боюнча."},{"t":"p","h":"1. Биз тоо балдары өзүбүздүн ата журтубузга кызмат кылабыз. Силерге окуунун алдыңкыларына ыракмат айтабыз. 3. Кырмандын бир четинде өзүнүн күндүзгү ордунда бир комбайн турат. («КБ») 4. Адам баласы өзүнө керектүү эгинди чөптү жашылчаларды баарын жерден алат. Ошон үчүн жерди иштетүү пайдалануу жана сактай билүү керек. («А»)5. Кайгы өмүрдүн уусу. Күлкү – өмүрдүн жан азыгы. (Мак.)"},{"t":"p","h":"27. Көп чекиттин ордуна түшүндүрмө мүчөнү таап койгула. Көчүрүп жазып сүйлөм мүчөлөрү боюнча талдагыла. Түшүндүрмө мүчө сүйлөмдүн кайсы мүчөсү? Тыныш белгиси кандайча коюлду?"},{"t":"p","h":"1. Биз ... өз мектебибизге жардам бердик?. 2. Газдын эн көп запасы бизде .... 3. Анда силер... келечек жөнүндө көп ойлончусунар. 4. Биз... ата мекенди коргоого ар дайым даярбыз. 5. Биздин улуу кенчибизди ... этият сактайлы."},{"t":"p","h":"28. Окугула. Тыныш белгиси эмне үчүн коюлгандыгын түшүндүргүлө. Жөнөкөй сүйлөмдүн кандай түрлөрү бар?"},{"t":"p","h":"– Карасан, карасан! Тигилер эмне? – деп Сейдакмат биринчи кыйкырды. Бугулар! Кайдан келген бугулар? – Эмне кыйкырдын? Буларды марал дейт. Биз кечээ эле көргөнбүз, – деди Орозкул байкас албагандай."},{"t":"p","h":"– Пай-пай-пай! – деп тамшанып, Көкөтай көйнөгүнүн жакасын чечип жиберди. – Сүмбөдөй семирген экен ээ..."},{"t":"p","h":"– Мүйүзүнүн чоңдугун, бай түп чынар! – Кантип көтөрүп жүрөт болду экен? – деп Көкөтай сугун артып турду. (Ч. А.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"16\">16<\/span>29. Синтаксистик талдоо жүргүзгүлө. Сүйлөмдүн бир өнчөй мүчөлөрүн, жалпылагыч сөздү жана түшүндүрмө мүчөнү аныктагыла. Аларда тыныш белгиси кандайча коюлган?"},{"t":"p","h":"1. Таятамдыкы Чоң-Таштан кырк чакырымдай ары, Кен-Сууда. (М. Э.) 2. Бизге, дыйкан чарбасына, айыл чарба машиналары керек. 3. Ата, ал – Кубат, менин эн жакын жолдошум. (Т. С.) 4. Сары-Жаз кырка тоосунан батышты көздөй созулуп жаткан тоолор булар: Көөлү, Ак-Шыйрак, Кара- Кече, Кабак. («АТ»)"}],"sub":[{"title":"ЧОЛПОНБАЙ","b":10},{"title":"УЛУУ АГАРТУУЧУ","b":19},{"title":"§ 4. КЕПТИН ТҮРЛӨРҮ","b":25},{"title":"ТӨШТҮК","b":28},{"title":"КЕПТИН СТИЛДЕРИ","b":38},{"title":"$ э. ПУБЛИЦИСТИКАЛЫК СТИЛЬ","b":41},{"title":"НАН БИЗДИН БАЙЛЫГЫБЫЗ","b":49},{"title":"ЖАЙДЫН КЕЧИ","b":59},{"title":"§ 6. ТҮШҮНДҮРМӨ МҮЧӨ","b":62}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[8,16]},{"title":"СҮЙЛӨМДӨГҮ СӨЗДӨРДҮН ОРУН ТАРТИБИ","blocks":[{"t":"h3","h":"СҮЙЛӨМДӨГҮ СӨЗДӨРДҮН ОРУН ТАРТИБИ"},{"t":"p","h":"Сүйлөмдөгү сөздөр өзүлөрүнүн синтаксистик кызматына ылайык түгөй-түгөйү менен аныкталат: 1) ээ менен баяндоочтун орду; 2) аныктооч жана аныкталгычтын орду; 8) толуктооч жана баяндоочтун орду; 4) бышыктооч жана баяндоочтун орду."},{"t":"p","h":"Сүйлөмдө ээ мурда, баяндооч андан кийин келип, түз орун тартиби боюнча орун алышат: Жаз – жарыш, күз – күрөш."},{"t":"p","h":"Аныктооч аныкталуучу сөздөн мурда келет: 1. Өмүрдүн кубанычы – эмгек. 2. Калдайган кара булут уламдан-улам көтөрүлүп келет."},{"t":"p","h":"Аныктоочтор: өмүрдүн, калдайган кара. Аныкталуучу сөздөр: ку: банычы, булут."},{"t":"p","h":"Толуктооч менен бышыктооч өздөрүн башкарган баяндоочтон мурда келет: 1. Ал Жапарга кайрылды. К и м ге? – Жапарга толуктооч, баяндоочтон мурда келди. 2. Күн уясына батып баратат. (К. Б.) Кай – д а? – уясына – бышыктооч, баяндоочтон мурда келди."},{"t":"p","h":"Бул – сөздөрдүн көндүм болгон түз орун тартиби. Бирок сөздөрдүн түз орун тартиби дайым эле сакталбайт. Стилдик максатка, ырдын уйкаштыгын сактоого ж. б. байланыштуу алардын орду кээде өзгөрүлүп да колдонулат."},{"t":"p","h":"Мисалы, Чапкан билет тулпарды, таптаган билет шумкарды. (Мак.) Мында тулпарды, шумкарды деген толуктоочтор билет деген баяндоочтордон кийин келишти."},{"t":"p","h":"30. Окугула. Сүйлөмдөгү сөздөрдүн түз орун тартибин аныктагыла. Этиштик баяндоочко сүйлөмдүн кайсы мүчөлөрү башкарылат? Башкаруу байланышында багыныңкы сөздүн орду кандай болууга тийиш?"},{"t":"p","h":"1. – Ташта! Ташта капты! – деп кыйкырып жиберди Жамийла. Данияр тил алган жок. Кампачы токтоно албады. Даниярга жулкунду:"},{"t":"p","h":"<span class=\"pg\" data-n=\"17\">17<\/span>– Токто! Мен билем сени. Ташта ушул жерге! Кайт артына. Ким айтты сага ушундай каптарды көтөрөсүн деп?"},{"t":"p","h":"Айылга кайтып баратканда бирибиз да сүйлөгөн жокпуз. Ошондой болсо да, Даниярдын бүгүнкүсү катуу тийип жатты бизге. (Ч. А.) 2. Айтса тил жетпес керкунду,"},{"t":"v","l":["Атактуу Соң-Көл сенсиңби?","Аркансыз, жипсиз заматта","Алдын, го ээлеп эркимди.","Ачыгын айтчы жашырбай,","Акмөөрсүңбү, келсунбу? (Б. С.)","Күн жарыгы тийгендей,","Күлгөнү кызык баланын.","Көйкөлүп өссө эгин, чөп,","Көркү экен эгин талаанын.","Умтулсан жакшы жүрүүгө","Узарат, жаштар, кадамын. (Ж.)"]},{"t":"p","h":"31. Сүйлөмдөгү сөздөрдүн орун тартибин өз ара салыштыргыла. Кайсынысында ой-пикир ырааттуу болуп турат? Эмне үчүн?"},{"t":"p","h":"1. Биз! силердин ишинерге ыраазыбыз. – Биз ыраазыбыз ишинерге? силердин. 2. Эл-журт Дүйшөнкулду узатуу үчүн чогулушту. – Эл-журт Дүйшөнкулду чогулушту узатуу? учун. 3. Акыры менин оюм иш жүзүнө ашты. – Акыры оюм менин ашты иш жүзүнө. 4. Аппак шекер жамынган айлана тыптынч. – Айлана аппак шекер жамынган тыптынч. 5. Нарын суусу ак көбүгүн чачыратат. – Суусу Нарын чачыратат ак көбүгүн."},{"t":"p","h":"32. Сүйлөмдөгү сөздөрдүн түз орун тартибине көнүл бургула. Ээрчишүү байланышында ээ кайсы орунда турууга тийиш. Ал эми башкаруу байланышында баяндоочко башкарылган сөздөрдүн түз орун тартиби кандай?"},{"t":"h3","h":"УЧКУЛ СӨЗДӨР"},{"t":"p","h":"1. Жаман киши ишеничти актабайт, өз абийирин сактабайт. 2. Баласына атасы акыл айтат, акылга көнгөн баладан эмгек кайтат. 3. Бир жолу калп айтсан, өмүр бою калпычы атын өчпөйт. 4. Жоого жалынба, доско таарынба."},{"t":"p","h":"5. Эр энеден туулат, элге кызмат кылат."},{"t":"p","h":"33. БК. Текст кептин кайсы түрүнө кирет? Негизги ойду далилдөө учун кандай мисалдар колдонулду? Аларды көрсөткүлө. Ой жүгүртүү кеби женунде ‘Яты\" 5эргиле. Текстке эмне деген ат койсок?"},{"t":"p","h":"Ар адамдын кадырлап сүйгөн кесиби болот эмеспи. Аный сызары, мен мугалим болсом деп тилейм."},{"t":"p","h":"Эмне себептен бул кесипти тандап алдым? Анткени кичинекей бөбөктөрдү окутканды жакшы көрөм. Окуучуларды адептүүлүккө. сылыктыкка -арбияласам кандай бакыт!"},{"t":"p","h":"түт"},{"t":"p","h":"<span class=\"pg\" data-n=\"18\">18<\/span>Азыр мен, ез мугалимдеримди көрүп алып, суктанам."},{"t":"p","h":"Биринчи арип үйрөткөн мугалимим али эсимде. Канча мезгил өтсө да, эже-агайларымды унутпайм деп ойлойм, себеби мугалимдердин эмгеги абдан ардактуу. Коомубузда бардык адамдар эн алгач мугалимдердин тарбиясынан өтөт. Азыр атагы дүйнөгө тараган Чыңгыз Айтматов дагы кезегинде Инкамал апанын таалимин алган."},{"t":"p","h":"Кийин өзүң окуткан окуучун эл ишине жараган белгилүү азамат болсо, андан артык сыймык болобу! Ошондуктан мен мугалим болууну чечтим."},{"t":"p","h":"34. Көчүргүлө. Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Алардын сүйлөмдөгү адат болгон түз орун тартиби жөнүндө айтып бергиле."},{"t":"p","h":"Токтогул ырын токтотту да, курбусу? экөө айылга бастырып кетишти. Кыз-келиндердин артынан? жете барышты. Токтогулдар кыз-келиндерди* жандап бастырып бара жатышат. Алардын күлкүлөрү көбөйдү. Акын комузун алды да, жагымдуу үн менен ырдап коё берди. (Ж. Б.)"},{"t":"p","h":"35. Сүйлөмдүн тутумундагы сөздөрдү түз орун тартибине келтирип, көчүргүлө. Аларды сүйлөм мүчөлөрү боюнча талдагыла. Аныктооч менен аныкталгычтын, бышыктооч менен баяндоочтун сүйлөмдөгү орун тартиби кандай?"},{"t":"p","h":"1. Толтурду кампага кызылды эл жайлай эмгектенген. 2. Жыттанат сопсонун гүлдөрү тоонун. 3. Төрөлгөнмүн мен жерде бийик тоолуу. 4. Кун сайын сулуулугуна анын таң калчумун мен. 5. Чыктык тоого эртен менен биз. 6. Аскат көрчү жакшы учкуч болууну."},{"t":"p","h":"З6. Текстти адегенде берилген түрүндө окугула. Эмнени байкадынар? Айтылып жаткан ой түшүнүктүү болдубу? Мындан кийин айрым сүйлөмдөгү сөздөрдү түз орун тартибине келтирип, кайра окугула. Эми кандай болду? Ойдун түшүнүктүү болушу эмнеге байланыштуу болорун түшүндүргүлө."},{"t":"p","h":"Бир күнү Орозалы карыя мени Токтогулга ээрчитип жөнөдү. Айылга үнү угулду акындын алар келгенде. Орозалы сыртка ээрчитип келген баласын койду да, кирди өзү үйгө."},{"t":"p","h":"Токо, сизди атайын издеп келдим. Бир балам ээрчитип келген бар. Өзү ырдап жүрөт айлыбызда. Ошондо Токтогул ырдап жаткан ырын токтото коюп, келген кишиге учурашты. Эшик жакка карап, мындай деди: «Качып жүрбөй далдаада, каргадай балам, кел мында»."},{"t":"p","h":"Муундары баланын титиреп, учурашты менен Токтогул. Баланын акын аты-жөнүн сурай баштады. (Ж. Б.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"19\">19<\/span>37. Окугула. Үтүр, чекит, кош чекит, тырмакча, суроо белгилеринин эмне үчүн коюлгандыгын түшүндүргүлө."},{"t":"p","h":"Байыркы өткөн заманда Толубай Сынчы, Жейренче Чечен, Алдар Көсөө, Акыл Карачач, Асан Кайгы, чык татырбас Чынарбай жашаган экен. Толубай Сынчы акылга дыйкан, кыраакы адам болгон. Адамды, малды сындаганда түп жайына дейре билген. Бир күнү Толубай жолдошторуна кенеш курду: «Жер тандап, шаар куруп, оокат кылсак кантет?» Шериктери анын акылына көнүштү. Жер тандап, Арал деңизинин боюн турукташты."},{"t":"p","h":"Бирок Жаныбек хан тынчтык бербеди. Элди талады. Толубай шериктерине дагы мындай деди: «Бейкутураак жакка көчсөк кантет? Асан Кайгы макул болду. Кыргыз уруулары Ала-Тоого көчүп жөнөшөт. (Т. М.)"},{"t":"p","h":"38. Көчүргүлө. Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Сүйлөмдөгү сөздөрдүн орун тартиби жөнүндө эмне билесинер? Эр жигиттин жакшысы – Сөзүндө болбойт жалганы. Элине жагат кыялы, Эч кимге тийбейт зыяны."},{"t":"v","l":["Эркин өсөр эр жигит,","Эл намысын талашат.","Кадыры бар эр жигит,","Калк намысын талашат. (Б. А.)"]},{"t":"p","h":"39. Жөнөкөй сүйлөмдүн кандай түрүн билесинер? Төмөнкү тексттен мисал келтиргиле. Алар жөнүндө айтып бергиле."},{"t":"p","h":"Күз... Айлуу түн. Кеңкол өзөнүнүн бою. Алыстан ак карлуу Ала-Тоо көрүнөт. Семетейдин ордосу. Кызыл-тазыл кийинген кыз-келиндер, ак калпактуу жигиттер эки топко бөлүнүшүп, оюн куруп жатышат. Бир топтун башчысы – Күлчоро, экинчи топтун башчысы – Канчоро."},{"t":"p","h":"Көпчүлүк жаштар селкинчек тээп жатышат. (Ж. Б.)"}],"sub":[{"title":"УЧКУЛ СӨЗДӨР","b":16}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[17,19]},{"title":"СҮЙЛӨМГӨ МҮЧӨ БОЛО АЛБАГАН СӨЗДӨР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"20\">20<\/span>СҮЙЛӨМГӨ МҮЧӨ БОЛО АЛБАГАН СӨЗДӨР"},{"t":"p","h":"Сүйлөмдө сүйлөм мүчөлөрүнүн милдетин аткара албаган жана алар менен байланышта болбогон сөздөрдүн болушу да мүмкүн. Мындай сөздөр сүйлөмдүн жалпы маанисине гана таандык болуп айтылат."},{"t":"p","h":"Мисалы, 1. Акия, сиз кырманга баш болуңуз. (Т. С.) Акия – каратма сөз, Акиянын көнүлүн өтүнүчкө буруу үчүн колдонулду. 2. Ошентип, биз көздөгөн максатыбызга жеттик. Ошентип – киринди сөз, ойду жыйынтыктады. 3. Ботом, сизге эмне болду, эжеке! (Ч. А.) Ботом – сырдык сөз, ички сезимди (тан калууну, чочуп кетүүнү) билдирди."},{"t":"p","h":"Мындай сөздөргө төмөнкүлөр кирет: каратма сөз, киринди сөз, сырдык сөз."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[20,20]},{"title":"§8. КАРАТМА СӨЗ ЖАНА АНЫН ТЫНЫШ БЕЛГИЛЕРИ","blocks":[{"t":"h3","h":"§8. КАРАТМА СӨЗ ЖАНА АНЫН ТЫНЫШ БЕЛГИЛЕРИ"},{"t":"p","h":"К а ра т м а с ө з – бул ойдун кимге багытталганын атап көрсөтүүчү сөз. Ал атооч жөндөмөдөгү зат атоочтон же заттык маанидеги сөздөн болот да, бирөөгө кайрылуу интонациясы менен айтылат. Түзүлүшү боюнча бир сөздөн же бир нече сөздүн тизмегинен турат."},{"t":"p","h":"Мисалы, 1. Данияр, мына мен өзүм келдим. (Ч.А.) 2. Жолдош секретарь балам, биздин эмгек – кубанычтын жарчысы. (Т. С.) Каратма сөздөр: Данияр – жөнөкөй сөз; жолдош секретарь балам – сөз тизмеги."},{"t":"p","h":"Көркөм чыгармаларда жансыз заттарга да кайрылабыз: Ук, жер жүзү, Тянь-Шанда кеним бар. (Ж. Т.) Каратма сөз – жер жүзү."},{"t":"p","h":"Каратма сөз сүйлөмдүн ар кайсы жеринде келет да, жазууда үтүр менен ажыратылат:"},{"t":"p","h":"а) Сүйлөмдүн башында келсе, үтүр өзүнөн кийин коюлат: Балам, сенин колуңдан иш келет. (Т. С.)"},{"t":"p","h":"б) Сүйлөмдүн ортосунда келсе, үтүр анын эки жагына коюлат: Гүлдөй бер, Кыргызстаным, күнөстүү тоонун боорунда. («А»)"},{"t":"p","h":"в) Сүйлөмдүн аягында келсе, үтүр андан мурда коюлат: Жемиши көлдөй толкуган жеримди макта, комузум."},{"t":"p","h":"Каратма сөз сүйлөмдүн башында келип, күчтүү интонация менен айтылса, андан кийин илеп белгиси коюлат да, кийинки сөз баш тамга менен башталып жазылат: Уландар жана кыздар! Баарыңар терең билимге ээ болгула!"},{"t":"p","h":"<span class=\"pg\" data-n=\"21\">21<\/span>40. Окугула. Каратма сөздөрдү тапкыла. Алар кандай мааниде колдонулду? Кайсы сөз түркүмүнөн болду? Түзүлүшү кандай?"},{"t":"p","h":"– Толгонай, байкуш Толгонайым! Алдагы калтандаган башынды ошондо боз кыроо чалбадыбы! Кайран олон чач! Сен бул жерге келген сайын ар качан башкача болуп келчүсүн."},{"t":"p","h":"– Ооба, Жер энем. Эсиндеби, Жер, Касымдан кат келгендеги күн?"},{"t":"p","h":"– Эсимде эмей, Толгонай. Сен ошондо келинин менен кичүү баланды сүйүнчүлөп келгенсип“, Толгонай. (Ч. А.)"},{"t":"v","l":["Ук, жер жүзү,","Тянь-Шанда кеним! бар.","Ук,","Чүй боорундай жерим бар! (Ж. Т.)"]},{"t":"p","h":"41. Каратма сөздөрдү көрсөткүлө. Оозеки кепте каратма сөзгө кандай интонация мүнөздүү? Сүйлөмдөгү орду кандай? Жазууда үтүр белгиси кандайча коюлат?"},{"t":"p","h":"О-о, кутмандуу талаам, сенин азыр дем алып жаткан кезин*. Жан-жакадан комбайндар да көрүнбөйт. Мал дагы тоодон түшүп келе элек. Төрөгөн аялдай көшүлүп жатканындан, Жер энем!“ Бүгүн менин Субанкулду, Касымды, Майсалбекти, Жайнакты, Алиманды эстеген кунум*. Кезеги келгенде Жанболотко түшүндүрүп айтып берем. Эси болсо түшүнөр, кечирер бизди, касиеттүү Жер эне! (Ч. А.)"},{"t":"v","l":["Ардактуу ага-инилер, жан курбулар,","Жаны өскөн, жайдары ачык жаш муундар!","Сиздерге айта турган сөзүм – ушул,","Ар дайым китеп менен дос болунар. (А. О.)"]},{"t":"p","h":"42. Интонацияны туура сактап, коюлган тыныш белгилерине карай сүйлөмдү көркөм окугула. Каратма сөздүн интонациясын өз ара салыштыргыла. Тыныш белгилери кандайча коюларын түшүндүргүлө."},{"t":"p","h":"1. Кадырлуу жолдоштор,"},{"t":"v","l":["тапшырган кызматыныздарды","аткардым.* (К. Ж.)"]},{"t":"p","h":"2. Жаш курбулар, жашарт-"},{"t":"v","l":["кыла өмүрдү. (Ж. Б.)","3. Баатыр, мени иретке чыксын","деген экенсиз. (К. Б.)","4. Садагасы, сен таалайлуу","баласын. (Ж. Т.)","Кадырлуу жолдоштор!","Тапшырган кызматыныздарды","аткардым."]},{"t":"p","h":"Кагылайын энеке! Менин жа-"},{"t":"v","l":["ралуу жүрөгүмдү козгобочу.","Кымбаттуу окуучулар! Терен","билим алуу үчүн күрөшкүлө!","Токтогул! Токтогул! Барсынбы","үйдө? (Ж. Б.)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"22\">22<\/span>43. Тексттерди көркөм окуп, каратма сөз катышкан сүйлөмдөрдү тапкыла. Аны көчүрүп жазып, тыныш белгилерин койгула, кандайча коюлганын түшүндүргүлө. Сүйлөмдөргө синтаксистик талдоо жүргүзгүлө."},{"t":"p","h":"1. Сабыр алдыга өттү да, бүгүнкү «мөмө тоюна» арналган салтанатты ачты. Жолдош окуучулар кадырлуу ата-энелер биз эркин эмгектин жемишин жыйноого чогулдук. Жолдоштор бүгүнкү Үч-Дөбө насипке толгон ырыс дасторконундай берекелүү! Кадырлуу агайындар сөз профессор Константин Кузьмичке берилет. (Т. С.)"},{"t":"v","l":["2. Арнап жаздым бул ырды.","Ардактуу балдар көбүнө.","Чынарга чырпык жеткинчек.","Кулак сал балдар кебиме. (А. У.)"]},{"t":"p","h":"44. Каратма сөз катышкан сүйлөмдөрдү тапкыла. Каратма сөздү бир нече сөздүн тизмеги аркылуу берип, сүйлөмдү көчүргүлө. Сүйлөмгө синтаксистик талдоо жүргүзгүлө."},{"t":"p","h":"1. Ызакул байке, Актан атамды убара кылбай эле коюнуз. (Ш. Б.) 2.Улуу ынтымак, күчтүү эмгек таалайдын эшигин кененирээк ачат, балдар. (Т. С.) 3. Биз жакшы заманда жашап жатабыз, жолдоштор. 4. Жардамынызга ыракмат, аке."},{"t":"p","h":"5. Жолдоштор, бир кездерде биз «а» деген тамганы тааныбаган Дүйшөндүн мектебинде да окудук. 6. Ырдап жибер, Жамийла, кулак сенде. (Ч. А.)"},{"t":"p","h":"У л г ү: Урматтуу Ызакул байке, Актан атамды убара кылбай эле коюңуз? Э м н е кылбай эле коюнуз? – убара кылбай эле коюңуз – баяндооч; ээ катышкан жок; к и м д и? – Актан атамды – толуктооч; урматтуу Ызакул байке – каратма сөз."},{"t":"p","h":"45. Төмөнкү сөздөрдү каратма сөздүн маанисинде колдонуп, ар бирине бирден ураан жана чакырык түрүндөгү сүйлөм түзгүлө. Аларда тыныш белгилери кандайча коюлду? Каратма сөз бир өнчөй түрүндө келеби? Мисал келтиргиле."},{"t":"p","h":"Студенттер жана окуучулар, эл агартуу кызматкерлери, курбулар, мекендештер, Ысык-Көл, Ала-Тоо, урматтуу классташтар, энеке."},{"t":"p","h":"46. Көчүргүлө. Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Андан кийин ээ каратма сөздүн милдетин аткаргандай кылып, сүйлөмдү кайрадан ондоп түзгүлө. Кандай айырмачылыкты байкадынар? Түшүндүргүлө."},{"t":"p","h":"1. Окуучулар мекен үчүн иштөөнү үйрөнүп жатышат. 2. Айымбүбү эне балдарга окуу китептерин алып келди. 3. Курбулары Гулуманын бийлегенин сагынышты. 4. Жайлоого баруучулар жылуу кийимдерин да алышты."},{"t":"p","h":"<span class=\"pg\" data-n=\"23\">23<\/span>Улгу: Окуучулар мекен үчүн иштөөнү үйрөнүп жатышат. – Жай сүйлөм: эмне болуп жатышат? – үйрөнүп жатышат – баяндооч; кимдер?-— окуучулар – ээ; эм нен и үйрөнүп жатышат? – мекен үчүн иштөөнү. Оңдоп түзөбүз: Окуучулар! Мекен үчүн иштөөнү Жай сүйлөм: окуучулар – каратма сөз, өзүнөн кийин илеп белгиси коюлду, мында ээ катышкан жок."},{"t":"p","h":"47. Көчүргүлө. Каратма сөздөрдү таап, аны үтүр же илеп белгиси менен ажыраткыла. Алардын эмне үчүн колдонулганын түшүндүргүлө. Сүйлөм мүчөлөрүнүн астын сызгыла."},{"t":"p","h":"1. Садагасы өсөт чалгын канатың. Жаны жерде, жаны шартта туулган садагасы сен таалайлуу баласын! (Ж. Т.) 2. Ала-Тоо жерин салкын, ээлесин кедей калкын. (А. Т.) 3. Урумкан эне Урумкан эне Күн чыгып калбадыбы? (Ш. Б.) 4. – Ооба кутмандуу талаам уста майданга кетерде балкасы менен коштошот дейт. Касым да өз кесибинин устасы эмес беле. – Туура айтасын Толгонай. (Ч. А.)"},{"t":"p","h":"48. Каратма сөздү сүйлөмдүн ар кайсы жерине келтирип окуп, үтүрдүн кайсы орунга коюларын байкагыла. Ал кайсы сөз түркүмүнөн болду?"},{"t":"p","h":"1. Кымбаттуу уулубуз Жапар! Сен дайыма алдыда бол. Башкаларга үлгү көрсөт. (К. Б.) 2. Балам Нуркасым, чон сакал Метрей экөөбүздүн айта турган бир ооз кебибиз бар*. Береги Тентеккерди кол башчы минсин, балам. Бул менин ак ниетим, чын сөзүм. З. – Эсиндеби, Жер эне, баягы айлуу түн? Балким, жаратылышта экинчи андай түн болбос. – Эсимде, Толгонай. Сен ошондо? мындай дегенсин: «Жер, жан жараткан Жер, биз сенин балдарынбыз. Ак тилегибизге жеткиргин». (Ч. А.)"},{"t":"p","h":"49. Каратма сөздөрдү пайдаланып, курбуларынарга, туугандарынарга, таене, таятанарга кат жазгыла."},{"t":"p","h":"50. Интонацияны туура сактап, көркөм окугула. Сүйлөмгө коюлган тыныш белгилери жөнүндө айтып бергиле."},{"t":"p","h":"1. Кымбаттуу окуучулар! Мектептин айланасын жашылдандырууга активдүү катышкыла! 2. Саламатсынарбы, асыл зат теректерим? (Ч. А.) 3. Күн дегенибиз ыпысык, жалындап күйүп турган жылдыз. Күндү айланып жүргөн планеталар булар: Меркурий, Чолпон, Юпитер, Марс, Сатурн, Уран, Нептун, Плутон жана биз жашап турган Жер. 4. Бизге, мектеп окуучуларына, илим жана билим керек. («КБ»)"},{"t":"p","h":"<span class=\"pg\" data-n=\"24\">24<\/span>51. Таблицага көнүл бургула. Каратма сөздүн үтүр менен ажыратыларын эсинерге сактагыла. Анын ар бир учуруна мисал ойлоп тапкыла."},{"t":"p","h":" – каратма сөз – сүйлөм."},{"t":"p","h":"52. «Абийиринди жашындан сакта» деген темада ой жүгүртүү мүнөзүндөгү дилбаян жазгыла. Жөнөкөй сүйлөмдүн түрлөрүн колдонгула."},{"t":"p","h":"53. Көчүргүлө. Сүйлөм мүчөлөрү жана сөз түркүмү боюнча талдоо жүргүзгүлө. Каратма сөз боюнча төмөнкүдөй суроолорго жооп бергиле: а) Кайсы сөз түркүмүнөн болот? б) Түзүлүшү кандай? в) Сүйлөмдөн алган орду кандай? г) Үтүр менен кандайча ажыратылат?"},{"t":"p","h":"1. Жол карайын, токтой турчу, Ата журт!! (А. О.) 2. Кыпкызыл, сары, капкара чар тарап толгон алчага. (А. Токт.) 3. Токо, Атай деген балаңыз – ушул. Сенин колундан күү келет, балам. (К. К.) 4. Токон жеңе! Токон жене! Аскерлер келе жатышат. (Ч. А.)"}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[21,24]},{"title":"§ 9. КИРИНДИ СӨЗ ЖАНА АНЫН ТЫНЫШ БЕЛГИЛЕРИ","blocks":[{"t":"h3","h":"§ 9. КИРИНДИ СӨЗ ЖАНА АНЫН ТЫНЫШ БЕЛГИЛЕРИ"},{"t":"p","h":"К иринди сөз- бул айтылып жаткан ойго карата сүйлөөчүнүн ар кандай мамилесин билдирген сөз."},{"t":"p","h":"Мисалы, 1. Албетте, менин бул эмгегим биздин айылдын биринчи мугалими Дүйшөн аксакалга арналат. (Ч. А.) Албетте – киринди сөз; сүйлөөчүнүн айтып жаткан оюн ырастады. 2. Силер, мүмкүн, эртең жолго чыгасыңар. («А») Мүмкүн – киринди сөз; сүйлөөчүнүн ойго карата болгон божомолун билдирди."},{"t":"p","h":"Түзүлүшү боюнча бир сөздөн же бир нече сөздүн тизмегинен болот: Бактыга жараша, биз улуу адамдардан үлгү алганбыз. Бактыга жараша – киринди сөз, бир нече сөздүн тизмеги."},{"t":"p","h":"Киринди сөз сүйлөмдүн ар кайсы жеринде келет да, жазуудаүтүр менен ажыратылат:"},{"t":"p","h":"а) Сүйлөмдүн башында келсе, үтүр өзүнөн кийин коюлат: Эң оболу, сен жанагы ишиңди айтчы? («КТ»)"},{"t":"p","h":"б) Сүйлөмдүн ортосунда келсе, үтүр анын эки жагына коюлат: Адам баласына, менимче, тынчтык керек. («А»)"},{"t":"p","h":"<span class=\"pg\" data-n=\"25\">25<\/span>в) Сүйлөмдүн аягында келсе, үтүр андан мурда коюлат: Адис сиздин айылдан болсо керек, сыягы. («КБ»)"},{"t":"p","h":"Маектешүү кебинде киринди сөз кемтик сүйлөмдүн маанисинде колдонулушу мүмкүн:"},{"t":"p","h":"– Сен мага таарынып калдыңбы, Гүланда?"},{"t":"p","h":"– Албетте. (А. Т.) Албетте деген – киринди сөз; кемтик сүйлөм."},{"t":"p","h":"54. Окугула. Сүйлөмдөрдү өз ара салыштырып, киринди сөздөрдү тапкыла. Ал кандай мааниде колдонулду?"},{"t":"p","h":"1. Биз өзүбүздүн ийгиликтерибизге ишенебиз."},{"t":"p","h":"2. Жамийланын жүрүш-турушунда кайраттуулук мүнөз бар."},{"t":"p","h":"3. Айыл чарбанын бардык тармагын енуктурелу*."},{"t":"p","h":"4. Ал уялганынан келген жок."},{"t":"p","h":"Албетте*, биз өзүбүздүн ийгиликтерибизге ишенебиз."},{"t":"p","h":"Жамийланын жүрүш-турушунда, айтор*, кайраттуулук мүнөз бар."},{"t":"p","h":"Бактыга жараша, айыл чарбанын бардык тармагын өнүктүрөлү. Ал уялганынан келген жок, менин оюмча."},{"t":"p","h":"55. Окугула, Киринди сөздүү сүйлөмдөрдү көрсөткүлө. Ал аркылуу сүйлөп жаткан адам ойго карата өзүнүн кандай мамилесин билдирди? Тыныш белгилеринин коюлушун түшүндүргүлө."},{"t":"p","h":"1. Ырас, Жапар адеп майданга келгенде? коркуп жүрдү. Бирок бара-бара көнүктү. Кийинчерээк коркуудан калды, чыйралды. (К. Б.) 2. Ал күнү, Орозмат айткандай, чачымды тезирээк шыпыртып алдым да, кырманга барып түнөдүм. Көрсө, Данияр түпкүлүгү биздин айылдан экен. Кишилердин айтышына караганда, анын тартпаган азабы калбаптыр. Эмнеси болсо да, элдер анын кайтып келгенин туура табышты. Ал тез-тез кыймылдап, чапчан иштөөчү эле. Мүмкүн, турмуш аны тез иштөөгө үйрөттүбү? Балким, ошондой болуш керек. (Ч. А.)"},{"t":"p","h":"56. Текстти көркөм окугула. Айтылып жаткан ойго карата сүйлөөчүнүн мамилесин билдирген сөздү тапкыла. Ал кандай мааниде колдонулду?"},{"t":"p","h":"– Бул тарапка келбегениме беш жыл болду дедиңизби? – деди келин."},{"t":"p","h":"– Ооба, беш жыл болду."},{"t":"p","h":"– Ырас, анда мени тааныбаганыныз чын экен, – деп жылмайды. Чынынайтканда, андан бери көп жанылык, көп жетишкендиктер болду*."},{"t":"p","h":"– Менимче, жашыңыз жаш көрүнсө да, сөзүнүз көптү көргөн кишиникиндей экен, – деп камдап келе жаткан суроолорумду алдына койдум."},{"t":"p","h":"– Арийне, мен өзүмдүн башыман өткөргөндөрдү айтайын. Азыркы айта турганымды уксаңыз, балким, ашыктык кылбас, – деди."},{"t":"p","h":"<span class=\"pg\" data-n=\"26\">26<\/span>– Жок... Жок... Балким, аздык кылар, – деп шашып кеттим. Ошентип, ал башынан өткөргөн окуясын баяндоого киришти. (К. Ж.)"},{"t":"p","h":"57. Текстти окугула. Сүйлөмгө мүчө боло албаган сөздөрдү (каратма сөз, киринди сөз) көрсөткүлө, алар эмне үчүн колдонулду?"},{"t":"h3","h":"АЛТЫНАЙ СУЛАЙМАНОВАНЫН КАТЫ"},{"t":"p","h":"Жолдош окуучулар, аңгеменин аягында мен дагы бир ирет Алтынай Сулайманованын катына кайрылгым келет. Мисалы, ал мындайча жазылган."},{"t":"p","h":"«Менин оюм боюнча, ошондо жаны мектептин кадырлуу төрүндө Дүйшөн аксакал отуруш керек эле. Тескерисинче, биз үлпөттүн үстүндө отурдук. Мен, Дүйшөн мугалимиме барып, кечирим сурап өтүнөм. Ал киши экөөбүз, менимче, бири-бирибизди түшүнө турган жалпы тил табарбыз. Урматтуу жаштар, биз буларды сыйлабасак, өзүбүздү сыйлабаганыбыз."},{"t":"p","h":"Азыр атом менен космостун доору болсо да, жаштар үчүн Дүйшөн сыяктуу адам үлгү боло албайбы, туурасын айтканда? Эгерде биз, баарыбыз, ошол Дүйшөндөй эле болсок кана! (Ч. А.)"},{"t":"p","h":"58. Калтырылып кеткен тыныш белгилерди коюп, сүйлөмдөрдү көчүргүлө. Ал белги эмне үчүн коюлду? Синтаксистик талдоо жүргүзгүлө, Сүйлөм мүчөсүнүн милдетин аткара албаган сөздөр барбы? Алар жөнүндө эмне билесинер?"},{"t":"p","h":"1. Кагылайын энеке менин жаралуу жүрөгүмдү козгобочу?! (К. Ж.) 2. Улуу ынтымак, күчтүү эмгек таалайдын эшигин кеңири ачат кымбаттуу балдар. (Т. С.) 3. – Чын эле космостон келдинби? – Ооба. («КТ») 4. Спорттук машыгуу сөзсүз адамдын ден соолугун чындайт. («КБ»)"},{"t":"p","h":"59. Көчүргүлө. Көп чекиттин ордуна киринди сөздү коюп, айтылып жаткан ойго карата өз мамиленерди билдиргиле. Киринди сөзгө тыныш белгисин койгула."},{"t":"p","h":"1. адам баласына бейкутчулук керек. ... күн бая эле чыккан. 2. ... саат он экиге жакындап келатат. 3. Мен ... ал кишинин адамгерчилигине, адамга жасаган мамилесине ыраазы болдум. 4. Биз... ата-бабаларыбыздын касиеттүү салттарын уланткыбыз келет. 5. Биз силерге, жаштарга, ак ниетибиз менен суктанабыз ..."},{"t":"p","h":"60. Сунуш кылынган сөздөрдү жана сөз тизмектерин киринди сөздүн маанисинде колдонуп, ар бирине бирден сүйлөм түзгүлө. Анда айтылып жаткан ойго карата өзүндүн кандай мамиленди билдирдиң?"},{"t":"p","h":"Балким, чынын айтканда, тилекке каршы, мүмкүн, агайдын айтканына караганда, ырас, менин оюмча, энем айткандай, ошентип."},{"t":"h3","h":"<span class=\"pg\" data-n=\"27\">27<\/span>§ 10. КИРИНДИ СӨЗДҮН МААНИСИ"},{"t":"p","h":"Кыргыз тилинде киринди сөз төмөнкүдөй маанилерде колдонулат"},{"t":"p","h":"1. Бекемдөө, ырас- Албетте, арийне, чын- Сыягы, ал чоң майрамтоо, божомолдоо, кү- дыгында, сөзсүз, кадик- га даярдангандай болду."},{"t":"raw","h":"<h4 class=\"mk\">мөндүүлүк ж. б. 2. Ар кандай сезим-<\/h4>"},{"t":"p","h":"сиз, кандай болбосун, балким, мүмкүн, сыягы, калыбы, болжолу ж. б."},{"t":"p","h":"Бактыга карай, ти- Тилекке каршы, биз дер: сүйүнүү, капалануу, лекке каршы, бактысыз- экскурсияга чыкпай калэлжирөө, жактырбоо, дыкка жараша ж. б."},{"t":"p","h":"ыраазы болуу."},{"t":"p","h":"Менимче, менин оюм- 3. Ойдун ким тадык."},{"t":"p","h":"Агайдын айтканына рабынан айтылганды- ча, анын айтуусуна кара- караганда, бүгүн концерт гы, кимге тиешелүү ганда ж. б."},{"t":"v","l":["экендиги.","","4. Ойдун ирети,"]},{"t":"p","h":"Биринчиден, экинчиболот."},{"t":"p","h":"Биринчиден, кыргызырааттуулугу. ден, бир жактан, эн обо- дын айылынын шартын лу, алды менен ж. б."},{"t":"v","l":["Мындайча айтканда,","5. Ойду чечмелөө,"]},{"t":"p","h":"билбейт. Экинчиден, бизге ишенбейт."},{"t":"p","h":"Бул иш, башкача тактоо, натыйжалоо. демек, чындыгында, ошен- айтканда, жаштардын кетип, кыскасын айтканда. лунан келет."},{"t":"p","h":"Айтылып жаткан ойго карата болгон мамилекиринди сүйлөм аркылуу да берилиши мүмкүн."},{"t":"p","h":"Салыштыргы л а: 1. Бороон, менимче, жакында басылат. Менимче – киринди сөз. 2. Бороон, мен ишенемин, жакында басылат. Мен ишенемин – киринди сүйлөм."},{"t":"p","h":"61. Мааниси жагынан ылайык келүүчү киринди сөздү кошуп окугула. Айтылып жаткан ойдун кандай кырдаалы билдирилди?"},{"t":"p","h":"<span class=\"pg\" data-n=\"28\">28<\/span>Г. Ойду бекемдөө, ырастоо 1. Канышай жыйналышка өз убагында келет. 2. Жайкы каникулду жакшы өткөрөбүз. 3. Ден соолукту бекемдөө! үчүн спорт менен машыгуу керек."},{"t":"p","h":"4. Эртен күн бүгүнкүдөн ачык болот."},{"t":"p","h":"П. Ойду болжолдоо, кумендее 1. Быйыл жай айы жаандуу болор. 2. Университетке бара турган болдум. 3. Түштүктө азыр? деле ысык болуп турса керек. 4. Айылга артисттер келген окшойт."},{"t":"p","h":"Ш. Ар кандай сезимди билдирүү 1. Күн ачылып кетти. 2. Үчүнчү жолу учуу үчүн космодромго жөнөдүк."},{"t":"p","h":"3. Айрым окуучулар жакшы окуп жатышат. 4. Жолдошторума? кезиге албай калдым."},{"t":"p","h":"62. Көчүргүлө. Сөз түркүмү жана сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Мүмкүн, чамасы, ошентип деген сөздөрдүн биринчи учурдагы маанисин жана экинчи учурдагы синтаксистик кызматын аныктагыла. Эмнени байкадынар?"},{"t":"p","h":"1. Мүмкүн, биздин! космонавттар Айга да учуп барышат. – Биздин космонавттардын Айга да учуп барышы мумкун. 2. Чамасы, бул адам биздин айылдан болсо керек. – Бул ишти өз убагында аткарууга анын чамасы келбей калды. 3. Ошентип, Ала-Баш айылы дүркүрөп өсүүдө. – Илима сен жөнүндө ошентип айткан эле."},{"t":"p","h":"63. Окугула. Киринди сөздү тапкыла. Ал ойдун кандай кырдаалын билдирди? Тыбыш белгисинин коюлушун түшүндүргүлө. Киринди сөздүн синонимдерин тапкыла."},{"t":"p","h":"Ошентип, үчүнчү жолу космоско учуу үчүн космодромго келдик. Адат боюнча, космоско учар алдында жыйналыш болуп өттү. Бардык тапшырмаларды, албетте, абийирдүүлүк менен аткаруу жөнүндө убада бердик."},{"t":"p","h":"Космодромдо биз ошол эле «космостук» үйдө уктадык. Бактыга жараша, энсеген убакыт да келип жетти."},{"t":"p","h":"«Учургула!» деген буйрук берилди. Ю. Гагарин айткандай, бир маалда салмаксыздык абал пайда болду."},{"t":"p","h":"Жерге кайра келдик, чынын айтканда, ушул учурда космоско карай бешинчи жана алтынчы жолу учууга даярдык көрүлүп жаткан эле. («КТ»)"},{"t":"p","h":"<span class=\"pg\" data-n=\"29\">29<\/span>64. Көчүргүлө. Киринди сөздөрдү таап, аны үтүр менен ажыраткыла. Үтүр белгиси кандайча коюлду? Мындан кийин сүйлөмгө синтаксистик талдоо жүргүзгүлө. Киринди сөз кайсы сөз түркүмүнөн болду?"},{"t":"p","h":"1. Ырас жумуш оор, жол алыс эле. Эки ортодо ашуу да бар. Жумуш оор деп, сырттагы курулуштан качканыбыз болбойт менин оюмча. (К. Б.) 2. Биринчиден Аскатты чоң атасы менен чоң энеси жалынып-жалбарып эркелетишет. Экинчиден аны көл жээгине алып кетишет. 3. Ал батып бара жаткан күндү неге карайт? Балким анын бирдемесин байкап жаткандыр. Болжолу бир ойго малынгандай. («А»)"},{"t":"p","h":"65. Айтылып жаткан ойго карата өз мамиленерди билдирүү үчүн киринди сөздү пайдаланып, аны көп чекиттин ордуна койгула. Көчүргүлө да, тыныш белгилери жөнүндө айтып бергиле."},{"t":"p","h":"1.... көркөм адабият адамдын мүнөзүн тарбиялайт. Ал чоң иштерди жасоого үйрөтөт ... 2.... кантип сыйланганынды айт. 3. Эртен ... биздин айылдаштар районго барышат. Мен да... алар менен кошо жөнөшүм керек, себеби баарыбыз ... өздүк көркөм чыгармачылыктын кароосуна катышабыз. («АТ»)"},{"t":"p","h":"66. Окугула. Киринди сөздөр ойдун кандай кырдаалын билдирди? Аларды сүйлөмдүн ар кайсы жерине келтирип, кайрадан окугула. Тыныш белгилери кандайча коюлду?"},{"t":"p","h":"1. Быйыл, чынында, эгин талаасында жакшы иштедик. 2. Карыялардын айткандарына караганда, бир кезде ушул жерде чытырман өскөн жүзүмдөр болгон экен. 3. Ырас, бул кезде улуу «Манас» эпосу дүйнөгө тааныла баштады. 4. Тилек айткандай, учурдун кандай өткөнүн да байкабай калдык. 5. Чынын айтканда, ал убакта биздин айылда жети жылдык мектеп гана бар эле. («КТ»)"},{"t":"p","h":"Улгу: Быйыл, чынында, эгин талаасында жакшы иштедик. – Чынында, быйыл эгин талаасында жакшы иштедик. – Быйыл эгин талаасында жакшы иштедик, чынында."},{"t":"p","h":"67. Ырастоо, божомолдоо, натыйжалоо, тактоо, ырааттуулук маанисиндеги киринди сөздөрдү колдонуп, суроолорго жооп бергиле. Жообунарды көчүрүп жазып, киринди сӨздөрдүн тыныш белгилерин койгула."},{"t":"p","h":"Бугун* телевизордон футбол көрөсүнөрбү? 2. Радиодон балдар үчүн берүүлөрдү угасыңарбы? Кыргыз эл акыны А. Токомбаевдин «Тан алдында» деген чыгармасын окудунбу?"},{"t":"p","h":"<span class=\"pg\" data-n=\"30\">30<\/span>Ү л г ү: Сен Ч. Айтматовдун «Биринчи мугалим» деген чыгармасын окудуңбу? – Албетте, окугам. Кыязы, окуп чыксам керек. Кыскасын айтканда, окуп чыккамын. Биринчиден, окуп чыккамын; экинчиден, ал боюнча сочинение да жазгам. ж. б."},{"t":"p","h":"68. Сүйлөмдөргө мүнөздөмө бергиле: а) айтылыш максаты боюнча; б) грамматикалык түзүлүшү боюнча; в) жөнөкөй сүйлөмдүн түрлөрү боюнча."},{"t":"p","h":"1. Кымбаттуу иним! Канчалык зарыл жумуштарым болбосун, баарын жыйыштырып коюп, мен ушул катты жазууну туура таптым. Менин оюмча, айтылгандар сизди кызыктырса, анда өз чыгарманызга пайдаланыңыз."},{"t":"p","h":"2. – Ушул эки чүрпөнү мага бер, акылман эне. – Болуптур. (Ч. А.) 3. – Сиз жаштарды ашыра мактап жибердиниз го. – Мүмкүн. («КТ»)"},{"t":"p","h":"69. Текстти көркөм окугула. Интонацияны сактагыла. Сүйлөмгө мүчө боло албаган сөздөрдү көрсөткүлө. Алар эмне үчүн колдонулду? Айтылыш максаты боюнча кандай сүйлөмдөр бар?"},{"t":"p","h":"– О-о, айланайын даркан талаам! Өзүң көрбөдүң беле, ал окуя да ушунда болбоду беле?"},{"t":"p","h":"– Ооба, Толгонай, ушунда'."},{"t":"p","h":"– Кантип жетип барганымды билбейм? Алиман экөөбүз кучакташып калдык."},{"t":"v","l":["– Келдинби, балам, энене кайрылып келдинби?*","– Келдим, энеке, келдим!"]},{"t":"p","h":"– Көзүндөн айланайын, караанындан айланайын! – деп бети-башын сыйпалап, жалынып-жалбарып ыйлап жибердим."},{"t":"p","h":"– Ыйлабачы, эне! Ыйлабачы. Кечирип кой мени, кечиргин."},{"t":"p","h":"Ошентип, бул жолу да келиниме эч нерсе айта албадым. Эсиндедир, Жер энем, ошол жылкы күз абдан жаанчыл болбодубу? Алимандын кабагы да ачылбай, сүйлөбөс болуп калды. оюмча, ай-күнү да жакындап келе жаткан эле. (Ч. А.)"}],"sub":[{"title":"АЛТЫНАЙ СУЛАЙМАНОВАНЫН КАТЫ","b":29},{"title":"§ 10. КИРИНДИ СӨЗДҮН МААНИСИ","b":39}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[25,30]},{"title":"$ 11, СЫРДЫК СӨЗ ЖАНА АНЫН ТЫНЫШ БЕЛГИЛЕРИ","blocks":[{"t":"h3","h":"$ 11, СЫРДЫК СӨЗ ЖАНА АНЫН ТЫНЫШ БЕЛГИЛЕРИ"},{"t":"p","h":"С ырды к сөз айтылып жаткан ойдогу ички сезимдерди (куба- ' нуу, өкүнүү, корку, кубаттоо ж. б.) билдирет."},{"t":"p","h":"М и с ал ы: 1. Өмүрүң узун болсун, кагылайын! Сырдык сөз – кагылайын – ыраазы болуу сезими. 2. Пай-пай, эмгек сүйгөн кишилер алп экен го (Т. С.) Сырдык сөз – пай-пай – таң калуу сезими."},{"t":"p","h":"<span class=\"pg\" data-n=\"31\">31<\/span>Сырдык сөздүн сүйлөмдөгү орду эркин, тактап айтканда, сүйлөмдүн башында, ортосунда жана аягында келет. Оозеки кепте өзгөчө интонация менен бөлүнүп айтылып, жазууда үтүр менен ажыратылат:"},{"t":"p","h":"а) Сүйлөмдүн башында келсе, өзүнөн кийин үтүр коюлат: Ботом, айылдан качан келдиң? Пай-пай, эл да жаңы, жер да жаңы! (Т. С.)"},{"t":"p","h":"б) Сүйлөмдүн ортосунда келсе, үтүр анын эки жагына коюлат: Табийгаттын көрүнүшү, бах, кандай кооз! (Н. Б.)"},{"t":"p","h":"в) Сүйлөмдүн аягында келсе, өзүнөн мурда үтүр коюлат: Данияр ушундай экен да, капырай! (Ч. А.)"},{"t":"p","h":"Сырдык сөз сүйлөмдүн башында келип, күчтүү интонация менен айтылса, андан кийин илеп белгиси коюлат да, кийинки сүйлөм баш тамга менен башталып жазылат: Бах! Ала-Тоомдун булагы муздаксың да, тунуксуң! (Т. С.)"},{"t":"p","h":"Башка сөздөргө караганда, сырдык сөз интонацияга өтө бай, бирок жазууда алардын бардыгын тыныш белгилери менен толук көрсөтүүгө мүмкүн эмес."},{"t":"p","h":"70. Окугула. Сырдык сөздөр кандай сезимдерди билдирди? Тыныш белгилери менен кандайча ажыратылды? Дагы кайсы сөздөр сүйлөм мүчөсүнүн милдетин аткара алышпайт?"},{"t":"v","l":["1. Акман машинанын артынан бек унчукту:","– Ой, саякатчылар', келип калдынарбы?","Шамбет, машинадан түшүп, айланага көз жүгүрттү:"]},{"t":"p","h":"– Бах! Аба кандай таптаза*. Быйыл ар бир үйдө өчпөс шамдар жанат. Ботом, келип калдыкпы! Бул кайсы жер? – деди кары аял. (Т. С.)"},{"t":"v","l":["2. Жибек көйнөк сулууча кыз энтелейт,","Жамгыр кантсин, жаба куюп эркелейт.","Ай, булганды, ай, бузулду көйнөгүм,","Жаздын жааны жаабай койсо эмне? – дейт. (А. О.)"]},{"t":"p","h":"З. Э-э ботом, Жийдекан! Бул бала эмне болот? – деди бир кезде ал."},{"t":"p","h":"– Апээй, катыгүн, мен унутуп калган турбаймынбы."},{"t":"v","l":["– Женеке, бүгүнчө мени батыргыла.","– Эми кандай кылам, кап! (М. Э.)"]},{"t":"p","h":"71. Теменку сездерду сырдык сездун маанисинде колдонуп, ар бирине бирден суйлем тузгуле. Кандай сезимдер билдирилди?"},{"t":"p","h":"Бах, пай-пай, капырай, аттиң ай, апий ботом, ой кокуй, бали, кап, а-а, баракелде, о-о."},{"t":"p","h":"<span class=\"pg\" data-n=\"32\">32<\/span>72. Окугула. Ай деген сырдык сөз кандай сезимдерди билдирди? Аны кантип аныктоого болот? Сүйлөмдүн тыныш белгилери жөнүндө айтып бергиле."},{"t":"p","h":"1. Ай-ай, ушундай да иш кыласынарбы? Мен силерден мындан башканы күткөн элем. (Н. Б.) 2. Ай, ушу сеники өтүп кетти. 3. Ай-ай, не деген жигиттер ушул сонун жерин кайрылып көрө албай кетишти. (Т. С.) 4. Ай, жолдош, токто! Кайт артына! – Жоош немени ушинте бергенин кандай, жене? – деп айтсам, Жамийла: – Ай, койчу ушуну, – деп колун шилтеп күлчү. – Ай, эми кетет го бир жакка, калбайт айылда! – деп ойлодум мен. 5. Жаштар гана эмес, бул тамашага биз да аябай кандык. Ошондогу асмандын ыраңы, ай! Ошондогу элдин күлкүсү, ай! (Ч. А.)"},{"t":"p","h":"73. Калтырылып кеткен тыныш белгилерин койгула. Үтүр эмне үчүн коюлду? Сүйлөмдөгү сөздөргө сөз түркүмү боюнча талдоо жүргүзгүлө."},{"t":"p","h":"1. Садагасы // Салмоорбек бизди тосуп чыккан тура. Бери кел // садага, 2. Бали // Сөздүн атасын айтып, Акман келди. (Т. С.) 3. Эл-журт үчүн // пай-пай // бул жаман болду го. Өзү тийишкен жоонун катыгын бергиле // жолдоштор. (Н. Б.)"},{"t":"p","h":"74. Интонацияны туура сактап, көркөм окугула. Сырдык сөз кандай интонация менен айтылды? Үтүр же илеп белгисин колдонууда эмнени эске алабыз."},{"t":"p","h":"1. Кап, азыр төрөлсө, атын Женишбек койбойт белем. – Кап! Ушул акмакты кантсем болот ыя? 2. Кокуй, Искендер ыкка көнөт экен деп ойлобонуз. (Ж. Т.) Охо-о!.. Тенти агайдай киши кайда! (Ш. Б.) 3. Баракелде, колунардан иш келет деген ушул. – Аттиңай! Жакып устанын жоктугун карачы. (Ш. Б.) 4. Бах!.. Түнкү толкунду карачы. – Бах! Тынччылык заманда суу да кандай тунук агат. (Т. С.) 5. Ай-и-ий, ушунун баары бүгүн орулдубу? – Ай-ай! Мени алда качан байлап алган турбайсынарбы? (К. Ж.)"},{"t":"p","h":"75. Таблицага көнүл бургула. Сырдык сөздө тыныш белгилери кандайча коюларын эсинерде сактагыла. Алардын ар бир көрүнүшүнө бирден сүйлөм түзгүлө."},{"t":"p","h":"– сырдык сөз. ]- сүйлөм."},{"t":"p","h":"<span class=\"pg\" data-n=\"33\">33<\/span>76. Көп чекиттин ордуна сырдык сөздөрдү колдонуп, өзүнөрдүн ички сезиминерди билдиргиле. Тыныш белгилерин койгула. Сырдык сөздөрдүн маанилерин түшүндүргүлө."},{"t":"p","h":"1. Алабаштан качан келдин ...? 2. Аксаамайдын ошондогу мүнөзү... али да көз алдымда турганын карачы. 3. Жакшы болот ... ошентип иштейлик."},{"t":"p","h":"4. иштесенер, тигил Сыдыктай иштегиле! 5. Чын жүрөктөн күлгөн жаштардын добуштары ... 6. ... ушул жердеги карагаттын коюулугун карачы!"},{"t":"p","h":"77. Көчүргүлө. Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Алардын милдетин аткара албаган сөздөр барбы? Атагыла, алар сүйлөмдө кандай мааниде колдонулат?"},{"t":"p","h":"1. Кадырлуу ата-энелер! Эмгек үзүрүнө арналган салтанатты ачык деп жарыялаймын. Мамлекеттик гимн аткарылды. Ушуну көзүбүз көрдү, Омор аке, бизде не арман. Эй, Кыяз ата! Илимге багыныныз. (Т. С.) 2. Чиркин, сүрөтчү болсом, ушул эртең мененки күндү сүрөткө тартсам. («КТ»)"},{"t":"p","h":"78. Сүйлөм мүчөлөрү жана сөз түркүмдөрү боюнча талдоо жүргүзгүлө. Ырас, мүмкүн, кийин деген сөздөрдүн синтаксистик кызматын жана морфологиялык белгисин аныктагыла."},{"t":"p","h":"1. Ырас, Асия адегенде эле өз пикирин түз айтты 2. Мүмкүн, Мырзакул Ысмайыл тууганынын качып келгенин сезип калгандыр. (Ч. А.) 3. Өнөрлүү, шыктуу балдардын ийримге тартылышы мүмкүн. 4. Тамактангандан кийин сапарыбызды уланттык. Кийин ушул саякат жөнүндө аңгеме жаздым. («КТ»)"},{"t":"p","h":"79. Окугула. Сүйлөмгө мүчө боло албаган сөздөрдү атагыла. Алардын маанилери жана тыныш белгилери жөнүндө эмне билесинер? Жалпы эле, сүйлөмдөгү тыныш белгилердин эмне үчүн коюлгандыгын түшүндүргүлө."},{"t":"p","h":"1. Дүйшөн өзү, албетте, менин бул абалымды жакшы билип жатты. Мүмкүн, менин көңүлүмдү көтөрөйүн деген ой менен ал ушунун эртесинде мектепке эки жаш терекче алып барды."},{"t":"p","h":"– Экөөбүз азыр чоң иш кылабыз, Алтынай, – деди мени күлө карап. Менин баамда, сен чон окумуштуу адам болосун. (Ч. А.)"},{"t":"v","l":["2. Пай-пай, мындай жигитке ким таң калбасын?","– Бали, балам! Сен кимсин? – деди көк сакал чал.","– Мен Айдар деген болом, аксакал, – деди жигит.","– Баракелде, балам! Атынды уктум эле. Ошол сен экенсин.","– Чын айтасыз, аксакал. (А. Т.)","","з-к-9"]},{"t":"p","h":"<span class=\"pg\" data-n=\"34\">34<\/span>80. Туулуп-өскөн айылынардын керемет кооздугун билесиңерби! Эмесе, ажайып айланага көз чаптырып көргүлөчү. Киндик каның туулган жерге болгон кубаныч, сүйүү, таң калуу сыяктуу сезимдеринерди сырдык сөз аркылуу билдирип, чакан текст түзгүлө."},{"t":"p","h":"Кайталоо үчүн суроолор:"},{"t":"p","h":"1. Сүйлөмдө каратма сөз кандай мааниде колдонулат? Ал кайсы сөз түркүмүнөн болот?"},{"t":"p","h":"2. Киринди сөз айтылып жаткан ойго карата сүйлөөчүнүн кандай мамилесин билдирет? Мисал келтиргиле."},{"t":"p","h":"3. Каратма жана киринди сөздөрдүн тыныш белгиси жөнүндө айтып бергиле. Мисал келтиргиле."},{"t":"p","h":"4. Сырдык сөздүн мааниси эмнеде?"},{"t":"p","h":"5. Сүйлөм мүчөсүнүн милдетин аткара албаган сөздөрдүн сүйлөмдө орду кандай болот?"},{"t":"p","h":"6. Бул сөздөрдүн интонациялык өзгөчөлүгү кандай?"},{"t":"h3","h":"<span class=\"pg\" data-n=\"35\">35<\/span>СИНТАКСИСТИК ТҮРМӨКТӨ"}],"sub":[{"title":"СИНТАКСИСТИК ТҮРМӨКТӨ","b":45}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[31,35]},{"title":"§ 12. АТООЧТУК ТҮРМӨКТҮН СИНТАКСИСТИК КЫЗМАТЫ","blocks":[{"t":"h3","h":"§ 12. АТООЧТУК ТҮРМӨКТҮН СИНТАКСИСТИК КЫЗМАТЫ"},{"t":"p","h":"Атоочтук мүчөлөр (-ган, -ар, -оочу, -уучу ж. б.) менен аяктаган сөз тизмеги атоочтук түрмөк болот. Мындай сөз тизмеги бир эле суроого жооп берет жана сүйлөмдүн бир гана мүчөсү болот."},{"t":"p","h":"Мисалы, Таттуу кыялга алданган Зарыл кыздарды көздөй басты. (Т. С.) Кайсы Зарыл? – таттуу кыялга алданган – атоочтук түрмөк, аныктооч."},{"t":"p","h":"Атоочтук түрмөктө сүйлөмдүн грамматикалык негизин түзүүчү ээ жана баяндооч болбойт."},{"t":"p","h":"81. Окугула. Атоочтук түрмөктөн болгон аныктоочторду тапкыла. Аларды аныктоочтун башка түрү менен салыштыргыла, Кайсынысында заттын белгиси кенен-кесир көрсөтүлдү?"},{"t":"p","h":"1. Мен ак ниет кишимин. – Мен кемчиликти бетке айткан кишимин."},{"t":"p","h":"2. Азамат – жакшы жигит. – Азамат – шаардан окуп келген жигит. 3. Кичинекей Элгулу атасынын жанында турат. – Өмүргө сараң караган Жапар станоктун жанында турат. 4. Жаман жолдош доого алдырат. – Салтка түшүнгөн Жеңишкүл ыр кезегин башкага берди."},{"t":"p","h":"82. Атоочтук түрмөк катышкан сүйлөмдөрдү тапкыла. Аларды көчүрүп жазгыла да, сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Атоочтук түрмөк сүйлөмдүн кайсы мүчөсү болду? Кандай суроого жооп берди жана кайсы сөздү айкындады?"},{"t":"p","h":"1. Уркуя көптөн бери шаарда турган? аял эле. Ал калпты чындай, &lt;ынды жоктой кылып сүйлөчү. Ал дейсиңби? Уркуя ушакка да жакын аял болучу. Бирөөдөн уккан? сөздү дароо илип алчу. (К. Б.) 2. Жолоочуларды ташуучу машина саат алтыда ордунан козголду. Эл арты болуп түшкөн адамдарга кыйын болду. – Апай, мындай келип отурунузчу, – деди Акия. – Байбиче, келиниңиз көрсөткөн орунга өтүнүз? (Т. С.) Талдын көлөкөсүнө отуруп, кечке чейин карап отурдум. Жол чаңдаткан машиналар кызылды кырманга ташып жатышты. Күүгүм кирерде комбайнчылар келишти. Отуруп чай ичтик. Бир сындырым нан алып тиштегенимде, комбайнчынын кара май колу жыттанган“ нан оозума тыгыла түштү. Ооба, керосин жыттанган нан экен. (Ч.А.)"},{"t":"p","h":"З*"},{"t":"p","h":"<span class=\"pg\" data-n=\"36\">36<\/span>83. Көчүргүлө. Сүйлөм мүчөсү жана сөз түркүмү боюнча талдоо жүргүзгүлө. Атоочтук түрмөктү тапкыла, ал сүйлөмдүн кайсы мүчөсү болду? Атоочтуктардын кандай мааниде колдонуларын эсинерге түшүргүлө."},{"t":"p","h":"1. Таң азандан атка минген* Шамбет жайлоого чейин барды. 2. Өзүнөн өзү эле эл менен коштошуп жүргөн Чаргын Камканын үйүн көздөй келе жатты. (Т. С.) 3. Жакшы менен? жүргөн жарыйт. Жаман менен жүргөн карыйт. 4. Эже кийгенди* синди киет. Кылычынан кан тамганды тилинен бал тамган жеңиптир. (Мак.)"},{"t":"p","h":"84. Сөз тизмектерин пайдаланып, ар бирине бирден сүйлөм түзгүлө. Сүйлөм мүчөлөрү боюнча талдоо жүргүзүп, атоочтук түрмөк жөнүндө айтып бергиле."},{"t":"p","h":"Ысык-Көлгө баруучу? кишилер, Сагындык жетектеген бригада, сен окуган* китепти, тынчы кеткен адам, мен окуганды, эр сыйлаган, сабаттуулугу жогору адам, аскерге баруучу уулум."},{"t":"p","h":"85. Аныктоочту өзү аныктап турган зат менен бирдикте, сүйлөмдөн ажыратып, көчүргүлө. Аныктоочтордун түзүлүшүн бири бирине салыштыргыла. Кандай өзгөчөлүктү байкадынар? Түшүндүргүлө."},{"t":"v","l":["1. Күн тийбес? тамда жатамын,","Күч кетип?, эс ооп алсырап.","Алдымдан нымдуу сыз өтөт,","Айласыз жатам жалдырап. (Т.)"]},{"t":"p","h":"2. Эриндери дирилдеген* Жамийла Осмонду бардык күчү менен жекирди. Айрыны алды да, унчукпай четке басты. (Ч. А.) 3. Айша -— эстүү кыз. Жамийла болсо – шайыр, сөзмөр?, жароокер кыз. (К. Б.) 4. Алтоо жүрүштөрүн тездетүүдө. Москвалык жаштар аларды куттукташты. Балапандай үрпөйгөн кыз Эшендин көз алдында"},{"t":"p","h":"Улгу: Кун тийбес тамда – к а н д ай тамда? кун тийбес – аныктооч, атоочтук түрмөк. Нымдуу сыз – кан дай с ы з? – нымдуу – аныктооч, жөнэкөй."},{"t":"p","h":"86. Көчүргүлө. Атоочтуктан жана атоочтук түрмөктөн жасалган аныктоочтордун астын сызгыла. Мааниси жана түзүлүшү жагынан буларда кандай айырмачылыктар бар? Адегенде окшош белгилерин, андан кийин айырмачылыгын аныктагыла."},{"t":"p","h":"1. Мени жамандаган адам – менден корккон адам."},{"t":"p","h":"Мени! жактаган адам – мени жек көргөн? адам."},{"t":"p","h":"2. Боло турган азамат болоттон кылыч байланат. 3. Туулган жердин топурагы – алтын. 4. Кенешип иш кылган адам жанылбайт. 5. Тандаган адам тазга жолугат. 6. Элге пайдасы тийген адам – мыкты адам. («ЗО»)"},{"t":"p","h":"<span class=\"pg\" data-n=\"37\">37<\/span>87. Окугула. Текстте кептин кайсы түрү колдонулду? Атоочтук түрмөктү көрсөткүлө. Ал кайсы сөз менен байланышты? Сүйлөмдүн кайсы мүчөсү болду?"},{"t":"p","h":"1. Берки кыз Батиш деген. Орто бойлуу, мүчө түзүлүшү сыйда. Өнү да анча серт эмес. Сурмасы тартылган көздөрү оттуу. Сырын чыгара бербеген, кээде кырс эткен мүнөзү бар. Кепке саран, кенешке жок. Кээде кара таштай мелтиреген кыз. (Т. С.)"},{"t":"p","h":"2. – Өнөр алды окуу экен, балам. Жаш чагында өнөр үйрөнүп алсан, карыганда кор болбойсун. Билек жирей албаганды билим жирейт'. Билим алуучу адамга карылык жок*. Сен азыр жашсың. Өнөр үйрөнүүгө аракет жаса. Өзүң билбегенди башкалардан сура. Адамдын акысын? жештен намыс кыл, – деп Чонкойчу Каныбекке акыл-насаатын айтты. (К. Ж.)"},{"t":"p","h":"88. Көчүргүлө. Сүйлөм мүчөлөрүнүн астын сызгыла. Атоочтук түрмөктүн аныктоочтук жана толуктоочтук милдетти аткарышын түшүндүргүлө. Атоочтук түрмөк кайсы учурда заттык мааниде колдонулат?"},{"t":"p","h":"1. Көптү көргөн адамдан сөз оку. – Көптү көргөндөн? сөз оку. 2. Карылар айткан? сөздү угуп жатасынбы, балам. – Карылар айтканды угуп жатасынбы, балам. 3. Колунан көөр төгүлгөн усталардан үйрөнгөнбүз. – Колунан көөр төгүлгөндөрдөн үйрөнгөнбүз. 4. Жайлоого баруучу малчыларды узатып жатабыз. – Жайлоого баруучуларды узатып жатабыз."},{"t":"p","h":"89. Көчүргүлө. Синтаксистик талдоо жүргүзгүлө: а) жөнөкөй сүйлөмдүн түрлөрү боюнча; б) сүйлөм мүчөлөрү боюнча."},{"t":"p","h":"1. Карыялар айткан сөздүн калети жок. 2. Карыялар айткан менин оюмда. 3. Карыялар! айтканды оюмдан чыгарбаймын. 4. Карыялар жөнүндө камкордук көрөлү. 5. Карыялар – үйдүн куту."},{"t":"p","h":"Ү лгү: Карыялар айткан сөздүн калети жок. – Бир тутумдуу сүйлөм, жаксыз; калети жок – баяндооч; э м н е н и н? – сөздүн – аныктооч; кайсы сөздүн? – карыялар айткан – аныктооч, атоочтук түрмөктөн болду."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[36,37]},{"title":"§ 13. ЧАКЧЫЛ ТҮРМӨКТҮН СИНТАКСИСТИК КЫЗМАТЫ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"38\">38<\/span>§ 13. ЧАКЧЫЛ ТҮРМӨКТҮН СИНТАКСИСТИК КЫЗМАТЫ"},{"t":"p","h":"Чакчыл мүчөлөр (-ып, -а, -ганча, -гыча ж. б.) менен аяктаган сөз тизмеги чакчыл түрмөк болот. Мындай сөз тизмеги негизги кыймыл-аракеттин маанисин толуктайт, сүйлөмдө бышыктоочтук милдетти аткарат."},{"t":"p","h":"Мисалы, Кыш ышкырат, үйлөрдү ачып. (А. О.) Кантип ышкырат? – үйлөрдү ачып – чакчыл түрмөк, бышыктооч. Ышкырат деген негизги кыймыл-аракеттин маанисин толуктады."},{"t":"p","h":"Чакчыл түрмөктө сүйлөмдүн негизин түзүүчү ээ жана баяндооч болбойт. Ал интонациялык жактан бөлүнүп айтылып, жазууда үтүр менен ажыратылат:"},{"t":"p","h":"а) Сүйлөмдүн башында келсе, өзүнөн кийин үтүр коюлат: Чоң арабакечтерди туурап, жайбаракат бастым. (Ч. А.)"},{"t":"p","h":"б) Сүйлөмдүн ортосунда келсе, үтүр анын эки жагына коюлат. Дүйшөн, ордунан ыргып туруп, тизелеп отура калды. (Ч. А.)"},{"t":"p","h":"в) Сүйлөмдүн аягында келсе, үтүр өзүнөн мурда коюлат. Акын таң атканча уктаган жок, курбу-курдаштарынын аманчылыгын сурап."},{"t":"p","h":"90. Окугула. Негизги кыймыл-аракетти билдирген баяндоочту тапкыла. Андан кийин анын маанисин толуктаган чакчыл түрмөктү көрсөткүлө. Ал сүйлөмдүн кайсы мүчөсү болду? Кайсы сүйлөмдө кыймыл-аракет элестүү баяндалды?"},{"t":"p","h":"1. Ал көпчүлүктү кубандырып "},{"t":"p","h":"койду."},{"t":"p","h":"2. Кыз-келиндер иштеп жатышат."},{"t":"p","h":"3. Эдиса ордунан тура калды."},{"t":"p","h":"4. Бактыбек ата-энесинин айткандарына макул болду."},{"t":"p","h":"– Чукугандай сөз таап, ал көпчүлүктү кубандырып койду."},{"t":"p","h":"– Чарчаганды билбей, оюн-күлкүгө батып, кыз-келиндер иштеп жатышат."},{"t":"p","h":"– Эдиса, эки жакты карап, алака: нын шак коюп*, ордунан тура калды."},{"t":"p","h":"– Бактыбек ата-энесинин айткандарына макул болду, көздөрүн кыбын: датып."},{"t":"p","h":"91. Тексттерди көркөм окугула. Жөнөкөй сүйлөмдүн кайсы түрлөрү колдонулду? Негизги кыймыл-аракеттин (баяндоочтун) маанисин толуктаган чакчыл түрмөктү тапкыла. Ал сүйлөмдө кандай милдетти аткарды?"},{"t":"p","h":"1. Май айынын салкын жели. Талаа тынч... Кыбырап ордунан туруп?, Ажар жолуна түштү. Каш карайып түн кирди. Бирок сулуу ай, алтын бууга боелуп*, чыгыш тараптан көрүндү. Ал, мээримсиз карангылыкты алда кайда <span class=\"pg\" data-n=\"39\">39<\/span>кубалап?, кен талааны кубантты. Ыйлап сооронгон баладай койнун ачып?, кучагын жайып, кен талаа да Ажарга жол берди. (К. Б.)"},{"t":"p","h":"2. Айтике беш-алты кишинин ортосунда турган баласын көрө койду. Ал, кирпигин жай ирмеп, тактайдын бетин тиктейт. Атасын да байкаган жок."},{"t":"p","h":"Айтике, көнөчөгүн коё коюп?, дубалга сүйөнүп, баланы карап, отура калды. Кол жоолугун ала коюп, боргулданган баланын бетин сүртүп, быйпыйган кичинекей мурдунан чымчып эркелетип*, Наташа баланы отургандарга тааныштырды. Айтике түш көргөндөй болду, өз көзүнө өзү ишенбеди. (А. Т.)"},{"t":"p","h":"92. Окугула. Сүйлөм мүчөлөрү боюнча оозеки талдоо жүргүзгүлө. Чакчыл түрмөк катыштыбы? Ал сүйлөмдүн кайсы мүчөсү болду? Кайсы сөз менен байланышты?"},{"t":"p","h":"1. Кырк чоросун жулкунтуп?, айгайлаган ызы-чуусун салып?, ак асаба кызыл туусун кармап?, кабылан Манас келе жаткансыйт. 2. Айкөл Манас кабылан, Аккуланы чуратып?, Аккелте менен бир атып?, жоону сүрүп баратты. («Манас».) З. Майрык, уйпаланган эски түлкү тебетейин баса кийип, кара чепкенин ак жоолук менен оро курчанып, үнүрөйгөн көзүн үлүндөтүп, ичке куркуйган мойнун көтөрүп, Керездин жанына басып келди. (Ш. Б.) 4. Камчыны сүйрөй, чон арабакечтерди туурап, чыйт түкүрүп, жайбаракат бастым. (Ч. А.) 5. Ысык-Көлдүн балыгындай сүзүп, Чолпонбай суунун аркы өйүзүнө чыкты. (К. Ж.)"},{"t":"p","h":"9З. Көчүргүлө. Чакчыл түрмөктү таап, аны үтүр менен ажыраткыла. Аталган түрмөк сүйлөмдүн кайсы мүчөсү менен байланышты? Андагы үтүрдүн коюлушун түшүндүргүлө."},{"t":"p","h":"1. Күрөгүнүн сабына таянып? саамай чачын сылап? Зарыл бир саамга токтоп калды. Чаргын шашкалак башка сөзгө келбей жөнөп кетти. 2. Акман карылыкка ашыккан киши эмес. Суу башкарат колунан кетменин түшүрбөй. (Т. С.) 3. Ырыскысына мас болуп* мөмөлүү жыгачтар үргүлөгөндөй сезилет. Бир кезде Жапар Чүкөбайга карады. Чүкөбай шашып дароо ордунан тура калды. Эки жагын каранып? тамагын кырып? жыйналышты ачты."},{"t":"p","h":"94. Көчүргүлө. Сүйлөмдөрдү түзүлүшү боюнча салыштыргыла. Кайсынысы жөнөкөй, кайсынысы татаал сүйлөм? Эмне үчүн?"},{"t":"p","h":"1. Айдалган аңыз куру калып, үрөн себилбей, жүрөгүм кансырап жатты. – Ушундай ойлорго берилип, Субанкулду эстедим. 2. Мени кучактап, Алиман боюн таштады. – Көзүмө жаш толуп, үрөндү алып кеткен качкындарды <span class=\"pg\" data-n=\"40\">40<\/span>карадым. 3. Алимандын башын тиземе коюп, мойнунан кучактап отурдум. – Санаа басып, келинимдин тагдырын ойлоп кеттим. (Ч. А.)"},{"t":"p","h":"95. Көчүргүлө. Синтаксистик талдоо жүргүзүп, чакчыл -ып мүчөсү менен аяктаган сөздүн жана сөз тизмегинин грамматикалык белгисин аныктагыла: чакчылбы, чакчыл түрмөкпү, татаал сүйлөмдүн бир бөлүгүбү, татаал этиштин түгөйүбү? Булардын синтаксистик кызматы кандай?"},{"t":"p","h":"1. Жамийла Кыргызстандын жаратылышы жөнүндө айтып? берди. – Жамийла, башын төмөн салып?, унчукпастан жүрүп отурду. – Жапардын сөзүнө күлүмсүрөп” жооп берди. – Жүрөгү уйгу-туйгу болуп?, түпсүз кыял Жапарды курчап алды. (К. Б.)"},{"t":"p","h":"2. Чагылган жаркылдап*, жүрөк титирейт. – Чон көздөрүн бажырайтып, Чаргын отургандарга тандана карады. – Акия айткандай, ошол эле күнү көпчүлүк эл Чаргынды башкармалыкка шайлап? коюшту. (Т. С.)"},{"t":"p","h":"96. Чакчыл түрмөктү сүйлөмдүн башында, ортосунда жана аягында келтирип, ар бир сүйлөмдү кайрадан окугула. Үтүр белгисинин кандайча коюларын түшүндүргүлө. Сүйлөм мүчөсү боюнча талдагыла."},{"t":"p","h":"1. Динарды катуу-катуу кучактап?, Бурма ыйлап жиберди. (Т. С.) 2. Колун жаагына таяп', Бектурган көз ачып жумганча өйдө болду. (А. Т.) 3. Жапар, башын Айшаны тике карады. (К. Б.)"},{"t":"p","h":"97. Чакчыл түрмөктөрдү пайдаланып, ар бирине бирден сүйлөм түзгүлө. Чакчыл түрмөктүн маанисин айтып бергиле. Ал сүйлөмдүн кайсы мүчөсү болду?"},{"t":"p","h":"Колун өйдө көтөрүп; мени көрө коюп; туулуп-өскөн жерди көрүп; китебин алып; баланын үнүн угуп; бизди тике карап; бөбөгүн көкөлөтө көтөрүп; көзүн улам-улам ирмеп; колун ушалап; алаканын чапкылап."},{"t":"p","h":"98. Жөнөкөй сүйлөмдүн түзүлүшү боюнча синтаксистик талдоо жүргүзгүлө, а) эки тутумдуу сүйлөмдөрдү аныктоо; б) бир тутумдуу сүйлөмдөрдү көрсөтүү. Сүйлөмдөрдүн айырмасы эмнеде?"},{"t":"p","h":"1. Күз... Чүйдүн талаасы сапсары алтындай. Башы кере карыш буудайлар... Жол... Ушул жол менен далай жүрдүм."},{"t":"v","l":["– Сиз ким деген болосуз? – деди атчан жигит.","– Мен Бектурган деген болом.","– Кайда бара жатасыз? – Балдарыма. (А. Т.)"]},{"t":"p","h":"2. Биздин жаштар өз элине, ата мекенине кызмат кылууга тийиш. 3. Атанын салган жолу бар. Эненин бычкан тону бар. 4. Эненин ырын унуткан эне тилин унутканга барабар. 5. Адамды кийиминен тааныбайт. (Мак.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"41\">41<\/span>6. Айта-бунта дегиче, ачып көздү жумганча алып жетип барайын. («Эр Төштүк») Т. Кана карыялар, алтын шилекейинерди чачыратып, менин суроомо жооп бергиле. (К. Б.)"},{"t":"p","h":"99. Атама, жактуу жана жаксыз сүйлөмдөрдүн түзүлүшү кандай болот? Төмөнкү сүйлөмдөрдөн мисал келтиргиле. Алардын баш мүчөлөрүн тапкыла."}],"sub":[],"section":"БАЙЛАНЫШТУУ КЕП","pages":[38,41]},{"title":"ДҮЙНӨНҮН КООЗ ЖЕРЛЕРИ","blocks":[{"t":"h3","h":"ДҮЙНӨНҮН КООЗ ЖЕРЛЕРИ"},{"t":"p","h":"Сары-Челекти дүйнөнүн кооз жери деп аташат. Чындыгында, ошондой жер!.. Жер-жемиштер. Алмалар. Арча-кайындар. Көз жоосун алган жангактарга тан каласын. Эмнелер гана жок бул жерде!"},{"t":"p","h":"Токойду аралап баратабыз. Тунук суусуна жүз чайкадык. Гүлдөргө суктандык. Албетте, жаратылыштын ушундай байлыгын сакташ керек."},{"t":"p","h":"Бул жер – табигатка көрк берген элик, аркар, бугулардын мекени. Көзүбүз көрбөгөн илбирстер да жашайт. Бир карап, токойду аралап, гүлдөргө суктанып, Өмүрүңөргө өмүр кошкула, кымбаттуу жаштар! (Н. Б.)"},{"t":"p","h":"100. Текстти окугула. Ал сүйлөмдүн кандай түрлөрүнөн түзүлдү? Сүйлөмдүн бир өнчөй мүчөлөрү барбы?"},{"t":"p","h":"Бир адам сапарга чыгат. Анын өзү менен кошо алып алган бир карышкыр, бир эчки, бир боо чөбү бар эле."},{"t":"p","h":"Бир жерден кайык менен аркы өйүзгө өтүүгө туура келет. Жанындагынын баарын бир алып өтүүгө мүмкүн эмес."},{"t":"p","h":"Эгерде карышкыр менен эчкини бул жээкте калтырса, эчкиден айрылат. Эчки менен чөптү калтырса, чөптөн айрылат. Эчкини адегенде алып өтсө, кийинкисинде анын кашына сөзсүз карышкыр же чөп келтирилет. Ал адам бул абалдан кантип чыкса болот? («КТ»)."},{"t":"p","h":"101. Көчүргүлө. Синтаксистик талдоо жүргүзгүлө: а) түзүлүшү боюнча кандай сүйлөмдөр бар? б) сүйлөм мүчөлөрүнүн астын сызгыла."},{"t":"p","h":"1. Ысык-Ата курорту – кыргыз жергесинин бир керемети. 2. Жерден атырылып чыккан ысык суу ашказан, муун, нерв ооруларына жардам берет. («КТ») 3. Чоку болот тоолордун бийик жери. Чокудай бол, кыргыздын жигиттери! (Б. С.) 4. Кудай таала энеге үч касиетти артык берген. Биринчиден, эне мүнөзү жагынан кечиримдүү. Экинчиден, эне бардык өмүрүн балдарын тарбиялоого арнайт. Үчүнчүдөн, эненин күнүнкү турмуш-тиричиликтеги түйшүгүн эч нерсе менен салыштырууга болбойт. («КТ»)"},{"t":"p","h":"<span class=\"pg\" data-n=\"42\">42<\/span>102. Көчүргүлө. Сүйлөм мүчөлөрүнүн астын сызгыла жана алардын ортосундагы байланыштын жолдорун (ээрчишүү, башкаруу, ыкташуу, таандык байланыш) аныктагыла,"},{"t":"p","h":"1. Ысык-Көл бизге ден соолук тартуулайт. 2. Ошон үчүн биз анын керемет сырына таазим этебиз. 3. Көпкөн жигит көп сүйлөйт. Чечен жигит төп сүйлөйт. 4. Эл амандыкты тилейт. Душман жамандыкты тилейт. (Мак.)"},{"t":"p","h":"103. Тексттин мазмуну менен таанышып чыккыла. Андагы негизги ой эмне жөнүндө болуп жатат? Эне тил жөнүндө сенин пикирин кандай? Бул текст кептин кайсы түрүнө таандык."},{"t":"h3","h":"ТИЛ"},{"t":"p","h":"Абуталиб бир жолу Москвада болуп калып, бирдеме сураш үчүн көчөдө өтүп бараткан бирөөгө кайрылып калат. Болгону, базардын каерде экенин сурамакчы го. Абуталиб токтоткон киши англичан экен. Англичан Абуталибдин айтканына түшүнбөй, кайрадан англисче, анан французча, анан испанча сураган окшойт."},{"t":"p","h":"Абуталиб болсо англичанга элден мурун орусча, анан лакча, анан аварча, анан лезгинче, анан даргынча, анан кумыкча түшүндүрөм менен убара болот. Акыры бирин-бири түшүнбөгөндөн кийин бөлүнүп кетишет."},{"t":"p","h":"Англисче эки жарым сөз билген, «маданияты» башынан ашкан дагстандык бирөө кийинчерээк Абуталибге акыл үйрөткөн экен:"},{"t":"p","h":"– Мына көрдүнбү, маданият деген эмне экенин? Сен анча-мынча маданияттуураак болгонунда англичан менен сүйлөшө алат элен. Көрдүнбү, түркөйлүктүн кесепетин?"},{"t":"p","h":"– Көрдүм, – дептир Абуталиб. Бирок эмне үчүн англичан менден көрө маданияттуураак болуп кетет, аделе мен сүйлөгөн тилдин бирин түшүнгөн жок го?"},{"t":"p","h":"Мага ар түркүн элдердин тилдери көктөгү жылдыз катары туюлат. Мейли, жылдыздар да жаркырап турсун. Мейли, ар бир адамдын өз жылдызы болсун. Мен өз жылдызымды, эне тилимди, боор этим менен тен көрөм. Кичинекей тоолордон да сандаган алтын кен чыгышы мүмкүн. (Р. Гамзатов.)"},{"t":"img","src":"data:image/webp;base64,UklGRmgHAABXRUJQVlA4IFwHAADwKACdASqAAiEAPrVUo04nJCOvJfF6seAWiWVuKOZ/9RqR8i7TIaqu9NmWm3+97bQ/b/2wk9hf6ISR/ez9D+TfLLwAvXG+1gA3Vvq55p/+78knxM6Afkt/4fls+t/YOVWA2wMs4kc/I2fIhPO8Bwqtf8RzWZwu93EoGXb+lQnDvtFDC1yjbFvs2p6gCORle4MLuzK/uvXq7gCIkRNZnN6iQZUTku7s91C8vTRkowVPvnqlkMC2ViZLuS5dESwSp/behRXt1unX8AXglmIltt8AU/v2tTAdSw1d1km1GDXeoXC33rNg2RJcHKbhP9u9Pwu2Iw5A9a3Exl1Y3fEiGIRCNSfBVx+6G5zUOIW+9P+W6eG6qDEl2pJJ/+/hm4FYz/4mCcBiElBidC+dQh90eAvtivJpkTlRWqTAA9hwpplprYxZakJCftxHtX6H/Vad8oAA/vqVlD6cqTP1qxKnY6IFLiydyNmnx7zH9BtY6No1uzR7sEA2f7cBGLcXN6JzXIRZWXB7OPY8YHfxDGN+kLHUvIIi4cnw+OCOYjMN61OBmn4P0kuHcDiYN4EYv9n/NuasSZTTtbS9ImdRNyXvXybYTGdrQqAjfHTSf5CeEtzfJGm9M77U7W4abT8+mWj0r63U6DGh7RwVAyjif5XYsvwV8DblO1f5Jxm7SfuoXKUvom0c2EqXJ8N+VGOFNa0di8AbK593xCQnyyu6q/MTwzRpByzjLKb91pryx8CRaAeh4zP2ib3rxMdWskvdb7aUkzGLrK4z+1xohd+cMsLKII/i9A+NQ/  же андан көп жөнөкөй сүйлөмдөн түзүлөт. Анын тутумундагы сүйлөмдөр маанилик жактан да, грамматикалык жактан да өз ара байланыштуу болушуп, бүтүн бир ойду билдиришет."},{"t":"p","h":"Мисалы, төмөнкү сүйлөмдөргө көнүл буруп көрөлү:"},{"t":"p","h":"„Каан жаайт, эгин өсөт, эл күн көрөт, мен да алар менен кошо жашайм. (Ч. А.)"},{"t":"p","h":"Бул татаал сүйлөм төрт жөнөкөй сүйлөмдөн түзүлдү. Мындагы сүилөмдөр бири-бири менен мезгилдик мааниси боюнча байланышып, болгон окуялар биринин артынан экинчиси көрсөтүлдү."},{"t":"p","h":"Ал эми маанилик жактан бири бирине жакын болбогон жөнөкөй сүйлөмдөр татаал сүйлөмдү уюштура алышпайт. Мисалы, Сабак башталды жана Ысык-Көл тоңбойт деген жөнөкөй сүйлөмдөрдөн татаал сүйлөм түзүлбөйт, себеби бул сүйлөмдөр мааниси боюнча өз ара байланыштуу эмес."},{"t":"p","h":"Жөнөкөй жана татаал сүйлөмдөр бири биринен грамматикалык түзүлүшү боюнча айырмаланышат. Атап айтканда, жөнөкөй сүйлөмдө бир эле грамматикалык негиз (баш мүчөлөр) болсо, ал эми татаал сүйлөмдө эки же андан көп грамматикалык негиз болот."},{"t":"v","l":["Салыштыргыла:","","1. Конур салкын күз келди.","2. Ак кеме каалгып сүзүп","баратты.","3. Жер тойгузат, от күйгүзөт. (Мак.)","4. Каалга шарт ачылды да,","Ызакул үйгө кирип келди."]},{"t":"p","h":"Татаал сүйлөмдүн өзүнө мүнөздүү грамматикалык түзүлүшү бар. Ал төмөнкүдөй жөнөкөй сүйлөмдөрдөн түзүлөт (кашаанын ичиндеги 2 деген сан – эки тутумдуу, 1 дегени – бир тутумдуу жөнөкөй сүйлөмдү билдирүүчү шарттуу белгилер)."},{"t":"p","h":"1. Акылы бар билимди самайт, акылы жок кийимди самайт. (Мак.) Эки тутумдуу жөнөкөй сүйлөмдөр. (2+2) Эки сүйлөмдө тен баш мүчөлөр катышты."},{"t":"p","h":"<span class=\"pg\" data-n=\"44\">44<\/span>2. Китепти сүйгүлө, ал силердин келечек турмушуңар үчүн керек болот. Биринчи бөлүгү – бир тутумдуу (ээ катышкан жок); экинчиси – эки тутумдуу жөнөкөй сүйлөм. (1+2)"},{"t":"p","h":"3. Кеңешме болот, ошого дейре уюштуруу иштериңди жолго кой. Биринчи бөлүгү – эки тутумдуу; экинчиси – бир тутумдуу (ээ катышкан жок) жөнөкөй сүйлөм. (2+1)"},{"t":"p","h":"4. Өзүңдү эр ойлосоң, башканы шер ойло. (Мак.) Бир тутумдуу жөнөкөй сүйлөмдөр; эки сүйлөмдө тен ээ катышкан жок. (1+1)"},{"t":"p","h":"Жазууда жөнөкөй сүйлөмдөрдүн ортосуна үтүр коюлат."},{"t":"p","h":"104. Текстти окугула. Жөнөкөй жана татаал сүйлөмдөрдү атагыла. Айырмачылыктары эмнеде?"},{"t":"h3","h":"АТА ЖУРТТУН БИР УУЧ ТОПУРАГЫ"},{"t":"p","h":"Бир ууч топурактын эмне деген касиети бар? Чабалекей таруудай топурактан уя салат. Балапан чыгарып, алыска учуруп кетет. Келерки жылы жыт синген эски уясына кайра келет. Ошентип, бир ууч топурактан куштардын мекени пайда болот экен."},{"t":"p","h":"Көл бир тамчы суудан жыйылат, күү бир кайрыктан чертилет, кылым бир күндөн түзүлөт. Демек, санжырачылардын ата журт бир ууч топурактан куралат дегендери чындык экен да. Ата журттун бир ууч топурагы ыйык, ошондуктан эл жаман көргөн адамына бир ууч топурак салбай коёт. Баарыбыз ата мекенди сүйөбүз, туулган жердин топурагы – алтын. («КБ»)"},{"t":"p","h":"105. Окугула. Татаал сүйлөмдөрдү көрсөткүлө. Жөнөкөй сүйлөмдүн кайсы түрлөрүнөн түзүлгөнүн аныктагыла. Баш мүчөлөрдү атагыла."},{"t":"p","h":"Алиман, ичтен солкулдап, үшкүрүп келе жатты. Айтор, багы ачылса болду. Касымдай болгон ынагына жолугар бекен, ким билет? «Бактылуу бол, чырагым! Убалына калбайын, качан кетсен да, башын бош. Ыраазымын сага, балам, күнүндү көр», – деп сүйлөшүүгө даярданып келе жаттым. Мен ошондо ушинтип санаа чектим, аны Алиман билген экен. Алимандын тоодой адамгерчилигине ыраазымын. Эмне үчүн ошондо мен боштук кылып жаш балача ыйладым?"},{"t":"p","h":"– Эне, – деди ошондо Алиман:"},{"t":"p","h":"– Жакшылык колдосо, кичине бала аман кайтып келет. Биздин кичине бала аман эле, көкүрөгүм айтып турат. Сабыр кылалы, эне, күтөлү. (Ч. А.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"45\">45<\/span>106. Көчүргүлө. Сүйлөмдүн баш мүчөлөрүнүн астын сызгыла. Татаал сүйлөмдө канча грамматикалык негиз болот? Грамматикалык түзүлүшү боюнча сүйлөм канчага бөлүнөт? Татаал сүйлөмдүн жөнөкөйдөн айырмасы эмнеде?"},{"t":"p","h":"1. Нан бекеринен улуу деп аталбайт. Кимде ким нандын кадырына жетсе, ал элдин урмат-сыйына ээ болот. («ЕБ») 2. Сөзүм бүттү, жасадым гүлзар жайды; жыпар жытын ааламга чачсын деги. Билим ал, киши болгун! (Ж. Б.) З. Алар көз ачып жумганча асман мелжиген бир үйгө келип токтошту, машинадан түштүк. Баарыбыздын жүзүбүз жарык, кубанычтуубуз. (К. Б.)"},{"t":"p","h":"107. Татаал сүйлөмдөрдү таап, аларды көчүргүлө. Тутумундагы ар бир сүйлөмдү өзүнчө атап, үтүр менен ажыраткыла. Татаал сүйлөмдөр түзүлүшү боюнча жөнөкөй сүйлөмдүн кайсы түрүнөн түзүлгөнүн шарттуу белгилер менен көрсөткүлө."},{"t":"p","h":"1. Асманда алакандай булут жок, өлчөмсүз асман тыптынч жаткан океан сыяктанат. Гүлдөн гүлгө конуп, бал тарткан аарылар. Кызыл ала, көк ала көпөлөктөр... Бул көрүнүштү сүрөттөш кыйын, эч нерсе менен салыштырууга болбойт. Табияттын кол тийбеген байлыктары наристе бойдон, бардыгы керемет. Жапайы жүзүмдөр жашыл жалбырактын арасынан күндү шыкаалашат. (А. Т.)"},{"t":"p","h":"2. Ат тойгон жерине качат, эр жигит туулган жерине шашат. Душманга жанынды берсен да, сырынды бербе. (Мак.)"},{"t":"p","h":"3. Көзүмдүн жашы көл болуп, жаш баладай ыйладым. (Т.) Ү л гү: Ат тойгон жерине качат, эр жигит туулган жерине шашат. Татаал сүйлөмдүн биринчи бөлүгү да, экинчиси да – эки тутумдуу жөнөкөй сүйлөм. (2+2)"},{"t":"p","h":"108. Төмөндө татаал сүйлөмдүн түзүлүшү шарттуу белгилер аркылуу көрсөтүлдү. Ошол схемаларга карата татаал сүйлөм түзгүлө. Эки жана бир тутумдуу сүйлөмдөр жөнүндө эмне билесинер?"},{"t":"v","l":["1. Эки тутумдуу + эки тутумдуу =2+2","2. Эки тутумдуу + бир тутумдуу 2+1","З. Бир тутумдуу + Эки тутумдуу 1+2","4. Бир тутумдуу + бир тутумдуу 1+1"]},{"t":"p","h":"109. Мааниси жагынан ылайык келүүчү экинчи сүйлөмдү ойлоп таап, көп чекиттин ордуңа жазгыла да, татаал сүйлөм түзгүлө. Татаал сүйлөмдүн тыныш белгисин койгула. Баш мүчөлөрдүн астын сызгыла."},{"t":"p","h":"1. Адамдын акысын жер кайтарат ... 2. Биз жолго чыга албадык ..."},{"t":"p","h":"3. Сабак бүткөндөн кийин ... 4. Баатыр кол баштайт... 5. Жашыл өнөт..."},{"t":"p","h":"6. Эки тоо көрүшпөйт ... 7. Туура бийде тууган жок ..."},{"t":"p","h":"<span class=\"pg\" data-n=\"46\">46<\/span>110. Татаал сүйлөмдөрдү көчүрүп жазгыла. Аларга сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Татаал сүйлөм жөнөкөй сүйлөмдүн кайсы түрүнөн түзүлдү? Бир тутумдуу сүйлөмдүн кандай түрлөрүн билесин?"},{"t":"p","h":"1. Бүгүн? менин сыйынуу күнүм. Мен аларды өлөр өлгүчө 2. Кыш киргенче, балдардан кат келип турду. (Ч. А.) 3. Чилде түшкөн... Аяз! барынча күчөп турган кез. (М. Э.) 4. Өзүн билесин, сен барда энен үй кызматында жүрчү эмес беле. Эми эпкиндүүлөрдүн бири. Айылыбыз жаман эмес. Кыйынчылыктардан кутулдук. (К. Б.)"},{"t":"v","l":["5. Күз келсе, гүл да солуйт, жазында өсөт.","Күн чыкса, калын жылдыз жапырт өчөт. (А. Токт.)"]},{"t":"p","h":"111. БК. Окугула. Текст түзүүдө сүйлөмдүн кайсы түрү колдонулду? Ал сүйлөмдөрдүн ортосунда айырмачылыктар барбы? Мында автордун айтайын деген негизги ою эмнеде?"},{"t":"p","h":"Бир жаш жигит сурап калды: – Урматтуу карыя, улуулук деген кандай болот? – Бул сурооңо байыркы бабалардан калган бир уламыш кеп менен жооп берейин."},{"t":"p","h":"Кайсы бир кылымдардын биринде Адам ата улуулукту табуу үчүн көп жол басат, дүйнөнү түгөл кыдырат, таппайт. Акыры дүйнөдөгү эн чон океандан сурайт, ал да өзү таппай жүргөнүн айтат. Андан соң Тибеттеги дүйнө боюнча эң бийик Эверест тоосунан сурайт. Ал да, арчаларын түтөтүп, улуулуктун кайда экенин таппай жаткан болот."},{"t":"p","h":"Акырында улуулукту сурап ааламга кайрылат. Анда ал мындай деген экен: «О-о, адам, муну мен сенден сураганы бараттым эле, анткени улуулук сага берилген»."},{"t":"p","h":"Көрдүнбү, көрсө улуулук өзүбүздө тура. Эми аны барктап, баалай билүүбүз керек. Анткени улуулук – адам баласынын эн таза маданияты, акыл-эси, кубанычы, жашоосу... («КТ»)."},{"t":"p","h":"112. Өзүнөр жөнөкөй жана татаал сүйлөмдөргө (ар бирине үчтөн) мисал ойлоп жазып келгиле. Аларга мүнөздүү грамматикалык белгилер жөнүндө айтып бергиле: а) сүйлөмдүн грамматикалык негизи жөнүндө; б) түзүлүшү жөнүндө; в) тыныш белгилери жөнүндө."},{"t":"p","h":"113. Схемага көнүл бургула: айтылыш максаты, грамматикалык түзүлүшү боюнча сүйлөмдүн бөлүнүшүн эсинерде сактагыла. Ар бирине мисал келтиргиле,"},{"t":"h3","h":"<span class=\"pg\" data-n=\"47\">47<\/span>айтылыш максаты боюнча:"},{"t":"v","l":["а) жай","б) суроолуу","Сүйлөм","в) илептүү","г) буйрук","грамматикалык түзүлүшү боюнча:","а) жөнөкөй","б) татаал"]},{"t":"p","h":"114. Сүйлөмдөрдү алардын түзүлүшү боюнча талдагыла. Кандай сүйлөмдөр бар? Түшүндүргүлө."},{"t":"v","l":["1. – Уулун өспүрүм жетип калыптыр, Толгонай.","– Ооба, кутмандуу талаам. (Ч. А.)"]},{"t":"p","h":"2. Жаш иштейт, карыя акыл берет. Жаштык бар жерде жалын бар. Асыл таштан чыгат, акыл жаштан чыгат. (Мак.) З. Ныязаалы комузчу, кылдын ыргагын көрүп, комузун күүлөй баштады. Ошентип, «Кер толгоо» күүсү жаңырды. Андан кийин Токтогул, комуз күүлөп, «Чон кербезди» чертти (Т. К.)"}],"sub":[{"title":"АТА ЖУРТТУН БИР УУЧ ТОПУРАГЫ","b":15}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[44,47]},{"title":"§ 15. ТАТААЛ СҮЙЛӨМДҮН ТҮРЛӨРҮ","blocks":[{"t":"h3","h":"§ 15. ТАТААЛ СҮЙЛӨМДҮН ТҮРЛӨРҮ"},{"t":"p","h":"Татаал сүйлөмдү түзгөн жөнөкөй сүйлөмдөр өз ара тен укукта, тен мааниде колдонулушу мүмкүн."},{"t":"p","h":"Мисалы, Көпкөн жигит көп сүйлөйт, чечен жигит эп сүйлөйт. (Мак.) Мында эки сүйлөм бар: 1. Көпкөн жигит көп сүйлөйт. 2. Чечен жигит эп сүйлөйт. Эки сүйлөмдүн бири экинчисине багынган жок, ар биринин баяндоочу тыянактуу айтылды."},{"t":"p","h":"Ошентип, тең укуктагы жөнөкөй сүйлөмдөрдөн түзүлсө, ал тең байланыштагы татаал сүйлөм деп аталат."},{"t":"p","h":"Кээде жөнөкөй сүйлөмдүн бирөө ойдун натыйжасын билдирет да, экинчиси мааниси боюнча ага багынып, анын ар кандай кырдаалын (ордун, мезгилин, шартын ж. б.) билдирет."},{"t":"p","h":"Мисалы, Касым жөнөп кеткенден кийин, Майсалбектен кат келди (Ч. А.) Негизги сүйлөм – Майсалбектен кат келди. Качан? – Касым җөнөп кеткенден кийин – негизги

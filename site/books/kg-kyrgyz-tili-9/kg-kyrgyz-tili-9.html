босун, дары – мына бул, дүйнөдө ким бактылуу болсо, ошол кишинин кир көйнөгү – дары. Ошол көйнөктү кечинде кийсениз, эртен менен куландан соо болосуз."},{"t":"p","h":"Вазирлер элди бүт кыдырып, бактылуу кишини таба алышпады. Акыры акылман кишиге келишти, ал күлүп мындай деди:"},{"t":"p","h":"– Бактылуу киши азыр жок. Хан өлсө, казынасы чачылса, бактылуу кишилер ошондо жаралат."},{"t":"p","h":"Ошентип, хандын оорусуна дары табылган жок. Бактылуу кишилер алардан кийин жаралды. (А. Т.)"}],"sub":[{"title":"БАЛЕТ АСМАНЫНДАГЫ АК КУУ","b":38},{"title":"ТЕРМЕ","b":47},{"title":"АКЫЛМАНДЫН ЖООБУ","b":65}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[119,124]},{"title":"§ 36. ТИКЕ ЖАНА КЫЙЫР СӨЗ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"125\">125<\/span>БӨТӨН СӨЗДҮ КОЛДОНУУНУН ЖОЛДОРУ"},{"t":"h3","h":"§ 36. ТИКЕ ЖАНА КЫЙЫР СӨЗ"},{"t":"p","h":"Бөтөн сөз ар кандай жолдор менен колдонулат: 1) тике сөз түрүндө;"},{"t":"p","h":"2) к ый ы р сөз түрүндө. Салыштыргыла:"},{"t":"v","l":["1. Элде мындай деген макал бар: «Билим – түгөнбөс байлык».","2. Эл билим түбөлүк байлык болорун айтышкан."]},{"t":"p","h":"Биринчи мисалда «Билим – түгөнбөс байлык» бөтөн сөз, эч өзгөрүүсүз колдонулду. Экинчи мисалда бөтөн сөздүн грамматикалык түзүлүшү өзгөртүлүп, анын жалпы мазмуну гана берилди."},{"t":"p","h":"Ушундай эле, бөтөн сөздү кыйыр сөз түрүндө берүүдө киринди сөздүн колдонулушу мүмкүн, мисалы: Элдин айтканына караганда, билим түгөнбөс байлык болот."},{"t":"p","h":"Мында элдин айтканына караганда – киринди сөз."},{"t":"p","h":"Ошентип, бөтөн сөз эч кандай өзгөрүүсүз берилсе, бул тике сөз деп аталат. Тике сөз тырмакчага алынып жазылат."},{"t":"p","h":"Бөтөн сөз өзгөртүлүп колдонулса, ал кыйыр сөз болот. Тырмакчага алынбайт."},{"t":"p","h":"344. Окугула. Кайсы сүйлөмдө бөтөн сөз өзгөрүүсүз колдонулду, кайсынысында анын грамматикалык түзүлүшү өзгөрүлдү? Түзүлүшүн өз ара салыштыргыла."},{"t":"p","h":"345. Төл жана бөтөн сөздөрдүн ортосунда бир аз тыным жасап, окугула."},{"t":"p","h":"Бөтөн сөздү тапкыла, ал кандай жол менен берилди? Тыныш белгилеринин коюлушу жөнүндө айтып бергиле."},{"t":"p","h":"1. Элде мындай сөз бар: «Жигитке жетимиш түрдүү өнөр аз»."},{"t":"p","h":"2. Нурлан мындай деди: «Ке-"},{"t":"p","h":"Элдин айтканына караганда, жигитке жетимиш түрдүү өнөр аздык кылат."},{"t":"p","h":"Нурлан кенешүү акылдардын кошунешуу – акылдардын кошулуусу». луусу боло тургандыгы жөнүндө айтты."},{"t":"p","h":"3. «Жылкычылар жайлоодон Жылкычылардын жайлоодон кел-"},{"t":"v","l":["келишти», – деп Жумакадыр ай- гендигин Жумакадыр айтып келди.","тып келди.","4. Омор карыя мындай деди: Омор карыя бул жылы да эгинден","«Бул жылы да эгинден мол түшүм мол түшүм алгандыгын билдирди.","алдым»."]},{"t":"p","h":"<span class=\"pg\" data-n=\"126\">126<\/span>1. Улуу! акын Токтогул жаштарга мындай деген насаат айткан:"},{"t":"p","h":"«Колдон келер иш болсо,"},{"t":"v","l":["Коркуп? бекер качпагын.","Мурунку жаман ишинди","Кийинки жерде таштагын»."]},{"t":"p","h":"2. «Эне тилиң? жан дүйнөндү сугарып, биринчи жолу улуттук сезиминди ойготот... Адамга эбегейсиз эстетикалык ыракат тартуулайт»,— деп айткан азыркы доордун көрүнүктүү жазуучусу Чынгыз Айтматов."},{"t":"p","h":"3. Элде мындай сөз бар: «Жамандык жолго баспагын, кырсык тилеп аласын. Досуңа чуңкур казбагын, өзүң түшүп каласын». («ЗО»)"},{"t":"p","h":"346. Окугула. Тике сөздү көрсөткүлө. Аны кыйыр сөзгө айландырып, кайра окугула, Кандай өзгөрүүлөр болду? Түшүндүргүлө. Кыйыр сөз деген эмне?"},{"t":"p","h":"1. Ойчул! акын Калыгул Бай уулу өз учурунда мындай деген экен: «Ысык-Көл – бейиштин эшиги. Ысык-Көлдөн чыкпагыла, балдар». («Мурас».) 2. «Башка тилди кандай жакшы көрсөм да, эне тилин? сүйгөнүмдөн жанылбайм», – деп айткан таланттуу акын А. Осмонов. 3. Элде мындай деген макал бар: «Жаштык бар жерде жалын бар». «Жаш улук эмес, акыл улук». «Кырсык болсо, кыламыктан бут сынат». («ЗО») 4. Ошондо Толгонай мындай деди: «О-о, жан жараткан Жер! Биз сенин балдарынбыз, ак тилегибизге жеткиргин!» (Ч. А.)"},{"t":"p","h":"347. Эл ичинде айтылып жүргөн макал, учкул сөздөрдү жазып келгиле. Алардын айрымдарын тике сөз түрүндө колдонуп, сүйлөм түзгүлө. Эмне үчүн тике сөз колдонулат?"},{"t":"p","h":"348. Окугула. Тике сөздү тапкыла, ага коюлган тыныш белгилери жөнүндө айтып бергиле. Андан кийин көчүрүп жазгыла да, сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө."},{"t":"p","h":"1. Элде мындай макал бар: «Эне тилим? – эне сүтүм». 2. «Алдагы колундагы эмне?» – деп Жамийла сүрөттү менден тартып алды. 3. Жамийла Даниярга шыбырап? жатты: «Кантип эле сени бирөөгө алмаштырайын...»."},{"t":"p","h":"4. «Кадырлай билсен карыны, касиет дейбиз аныны», – деп көрүнүктүү акын Ысмайыл Борончиев ырдаган."},{"t":"p","h":"349. Тике сөздү тапкыла, калтырылып кеткен тыныш белгисин коюп, көчүргүлө. Алардын эмне үчүн коюлгандыгы жөнүндө айтып бергиле."},{"t":"p","h":"<span class=\"pg\" data-n=\"127\">127<\/span>1. Эмгек кылгыла, жолдоштор // Эмгек! кылсаңар, баарынар биз сыяктуу сыйланасынар // деп Кулболду карыя сөзүн бүтүрдү. (К. Б.) 2. Сен Токтогул болуп жүрбөгүн // деп Ныязалы сүйүнүп кетти. (Ж. Б.) 3. Атам заманда кыргыз журту Эне-Сайды жайлап турган экен. Эне-Сай сенден жаркын мекен барбы? // деген ыр ошондон калыптыр // (Ч. А.) 4. О-о, саякатчылар // келип калдынарбы // деп сурап калды Акман карыя. (Т. С.)"},{"t":"p","h":"350. Тике сөздү кыйыр сөзгө айландырып, сүйлөмдү кайра түзгүлө. Сүйлөмдөрдүн грамматикалык түзүлүшүндө жана тыныш белгилердин коюлушунда өзгөрүү болдубу? Салыштыргыла. Кандай өзгөрүүлөрдү байкадынар?"},{"t":"p","h":"1. Мындай деген накыл сөз бар: «Карынын кебин капка сал». 2. «Ооба, апасына окшош экени чын!» – деди Толгонай. 3. «Агайынды жаман деп, тууганды кайдан табасын?» – деп улуу акын Токтогул айткан эле. 4. Мугалим минтип айтты: «Адеп менен нусканы биле жүр, балам»."},{"t":"p","h":"351. Берилген сүйлөмдөрдү тике сөз катышкан сүйлөмгө айландырып жазгыла. Тыныш белгилерин койгула жана аны түшүндүргүлө."},{"t":"p","h":"1. Дарыгердин айтканына караганда, тамеки тартуу ден соолукка өтө зыяндуу. 2. Карыялардын айткандары боюнча, абийирди жаш кезден сактоо керек. З. Бакыттын окуудан келгендиги жөнүндө таянем айтып келди."},{"t":"p","h":"4. Ар качан ар бир иште сабырдуу болуу жөнүндө айтылган сөз бар."},{"t":"p","h":"352. Төмөнкү схема боюнча тике сөз катышкан сүйлөм түзгүлө. Тике жана кыйыр сөз жөнүндө эмне билесинер? Тике сөздө тыныш белгиси кандайча коюлат?"},{"t":"p","h":"Шарттуу белгилер: ш – төл сөз. 777 – тике сөз."},{"t":"p","h":"353. Тике сөздүн ордун алмаштырып түзүп, сүйлөмдү кайра көчүргүлө. Тыныш белгилеринин коюлушун түшүндүргүлө."},{"t":"p","h":"1. Мындай деген макал бар: «Жер бай болсо, эл да бай болот». 2. Шамбет тигил кызга түшүндүрдү: «Акман деген – ушул, сонун киши!» (Т. С.) 3. Баланын ою чаташат: «Эмне үчүн адамдар тынч жашай алышпайт? Эмне үчүн <span class=\"pg\" data-n=\"128\">128<\/span>бирөө жаман, бирөө жакшы?» (Ч. А.) 4. К. Шопокова мындай деди: «Мен өз антымды жемиштүү эмгегим менен актадым». (Ж. Б.) Улгу: Мындай деген макал бар: «Жер бай болсо, эл да бай болот». – «Жер бай болсо, эл да бай болот», – деген макал бар. Биринчисинде, тике сөз тел сөздөн кийин келди да, өзүнөн мурда кош чекит коюлду; экинчисинде төл сөздөн мурда келип, өзүнөн кийин үтүр (жай сүйлөм болгон үчүн) жана сызыкча (,-) коюлду."},{"t":"p","h":"354. Диалог түрүндөгү текстти окугула. Анда төл жана бөтөн сөз барбы? Алардын ар бирин өзүнчө ажыраткыла. Тыныш белгилери кандайча коюлду? Бир киши көп жашаган карыяга кайрылат:"},{"t":"v","l":["Айтыңызчы, карыя, кандай адам акылдуу?","Карыя мындай жооп берген экен:","– Колдон келген ишке умтулган адам акылдуу.","– Адам баласы бардыгын билет деп ойлойсузбу?"]},{"t":"p","h":"– Жок, дүйнөдөгү нерселерди толук билип чыгууга кудурети жетпейт."},{"t":"p","h":"– Демек, адам бардыгын билип чыга албайт дечи."},{"t":"v","l":["– Албетте.","– Адамдын акылдуу болушуна эмне себепкер?","– Билим. Ал – көрүнбөгөн нерсени көрсөтүүчү көз. («ЗО»)"]},{"t":"p","h":"355. Тике сөзгө коюлган тыныш белгилерге карай, интонацияны туура сактап, текстти көркөм окугула. Интонациянын жардамы менен ар кандай ички сезимдер даана байкалып турсун."},{"t":"v","l":["1. Жигит келүүгө намыс кылды да, катуу буйрук берди:","– Кел жаныма! Кел, жүгүн! Түбөлүк күн кылам!","Кыз, төөнү бура тартып, эскертти:","– Чатаксыз кайт, менин колум сага барбайт.","– Кел дегенде кел! Багынасынбы, жокпу?! (А. Т.)","2. Жамийла Даниярга акырын шыбырап жатты:"]},{"t":"p","h":"– Чын эле, күмөн санадынбы? Кантип эле сени бирөөгө алмаштырайын!.. Керек эмес, түштөн кийинки сүйүүсү, өзүнө буюрсун! Жалгызым, секетим, эч кимге сени ыраа көрбөйм!.."},{"t":"p","h":"– Жамийлам, жаным калкатайым, кызыл гүлүм, Жамалтай! – деп Данияр кыргыз менен казакта болгон эн назик аттарды сүйгөнүнө арноодо."},{"t":"p","h":"– Көрсө, менин сүйгөнүм тууган жеримде тура! Көрсө, ал сен экенсин, кызыл гүлүм!"},{"t":"p","h":"– Бүркүтүм! Шаншыган бүркүтүм! Бери болчу, көзүндү көрсөтчү! О-о, шаншыган бүркүтүм! (Ч. А.)"}],"sub":[],"section":"БӨТӨН СӨЗДҮ КОЛДОНУУНУН ЖОЛДОРУ","pages":[125,128]},{"title":"§ 37. ТИКЕ СӨЗДҮН ТЫНЫШ БЕЛГИЛЕРИ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"129\">129<\/span>§ 37. ТИКЕ СӨЗДҮН ТЫНЫШ БЕЛГИЛЕРИ"},{"t":"p","h":"Тике сөз төл сөздөн мурда же андан кийин, же анын ортосунда келе берет. Ошентип, тике сөздө тыныш белгилердин колдонулушу алардын сүйлөмдөгү орун тартибине негизделген:"},{"t":"p","h":"1. Тике сөз (автордун сөзү) төл сөздөн кийин келсе, өзүнөн мурда кош чекит коюлат да, баш тамга менен башталып жазылат: Жанболот сүйүнүп кетти: «Эне, алма алып келдиңби?» (Ч. А.) 2. Тике сөз төл сөздөн мурда келсе, (жай сүйлөм болсо, чекиттин ордуна үтүр коюлат), өзүнөн кийин үтүр жана сызыкча коюлат: «Уят өлүмдөн катуу» деген макал бар."},{"t":"p","h":"Эгерде тике сөз суроолуу же илептүү сүйлөм болсо, суроо (?) жана илеп белгиси (!) сакталат: 1. «Алтынай, жашың канчада?» – деп Дүйшөн күлүп койду. 2. «Эмгек өлбөйт экен го, нан өлбөйт экен го!» – деди Толгонай. (Ч. А.) 3. Тике сөз төл сөздүн ортосунда келсе, тике сөздөн мурда кош чекит, кийин үтүр жана сызыкча коюлат:"},{"t":"p","h":"Элде: «Эр эмгегин жер жебейт» – деген сөз бар."},{"t":"p","h":"4. Тескерисинче, тике сөздүн ортосунда төл сөз келсе, төл сөздүн эки жагына үтүр жана сызыкча коюлат:"},{"t":"p","h":"«Мен, – деди Бугу эне, – силерге Умай эне болом»."},{"t":"p","h":"Тике сөз менен төл сөздү өз ара байланыштырууда деп, деген, деди ж. б. сөздөр колдонулат."},{"t":"p","h":"5. Диалогдордо тике сөз тырмакчага алынбайт, ар бир кишинин сөзү жаңы жолдон башталып, алдына сызыкча коюлат:"},{"t":"p","h":"– Аксакал, башта эмне болуп иштөөчү элеңиз?"},{"t":"p","h":"– Укем, башта мен уста элем, – деп Чыныбай сөзгө киришти. (Н. Б.)"},{"t":"p","h":"356. Окугула. Тике сөздүн сүйлөмдөгү ордуна көнүл бургула. Ушуга байланыштуу ага тыныш белгилеринин кандайча коюларын түшүндүргүлө."},{"t":"p","h":"1. «Бул сабакта мен силерге! өзүбүздүн ата мекенибиз жөнүндө айтып берем», – деп Жамийла шашпай сабагын баштады. (К. Б.) «Карачы, эне, – деди ал шолоктоп, – күн минтип жаркырап турса, Касым келбейт ээ?» (Ч. А.) З. Бектурган баланы? мойнунан кучактады: «Эми менин жараланган жүрөгүм айыкты! Силер бактылуу болгула!» (А. Т.) 4. Докладчы сөзүнүн аягында: «Жашасын эркиндик, ура!» – деп кыйкырып жиберди. (Н. Б.) 5. Кадырлуу ага-инилер, – деди Шамбет, көпчүлүктүн назарын өзүнө буруп, – биз силерди эмгекке чакырабыз». (Т. С.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"130\">130<\/span>357. Окугула. Тике сөз катышкан сүйлөмдү тапкыла. Ал айтылыш максаты боюнча кандай сүйлөм? Тике сөздөн кийин коюлган үтүр жана сызыкча, суроо белгиси жана сызыкча, илеп белгиси жана сызыкча неге негизделип коюлду? Түшүндүргүлө."},{"t":"p","h":"«Ашыралы байкем келе жатат!» – деп бир кичинекей кыз кыйкырып жиберди. Кыйкырган бойдон солдатты көздөй жүгүрдү. чын эле, Ашыралы турбайбы!» – деп аялдар да чуулдап жөнөштү. Ошол учурда бизди кандайдыр бир күч бийлеп, баарыбызды тен эргитип алып учту. Ошол ызычууда ар кимибиз, туш-туштан Ашыралынын мойнуна асылып, өпкүлөдүк. «Кайда менин Касымым?» – деп чыңырды Алиман. «Башкалар кайда кайда? Качан келет калгандар!» – деп эл-журт жабыла сурап жатышты."},{"t":"p","h":"Ашыралыны туугандары үйүнө ээрчитип кеткенден кийин, Алиман экөөбүз үйгө кайттык. Биз унчукпай келе жаттык. «Ай°, эми айрылышабыз го. Касымдан түңүлүп бүттү го», – деп ойлоп келе жаттым. «Эне, мынча эмне бөксөрдүң? Антпечи, энеке! Мындай дөнсөөгө отуруп, сүйлөшөлүчү», – деди бир маалда Алиман. (Ч. А.)"},{"t":"p","h":"358. Окугула. Төл жана тике сөздөрдү көрсөткүлө. Көчүрүп жазып, тыныш белгилерин койгула. Алардын эмне үчүн коюлгандыгын түшүндүргүлө."},{"t":"p","h":"1. Баарынан намыс кымбат! турарын унутпа // деп акылмандар айтышкан. 2. Кузьмич ата мындай деди // Силерди билим күтүп турат. (Т. С.) 3. Муну ким? тарткан // деп ал чоң барак кагазды сунду. 4. Дүйшөн толкундап сүйлөдү // өкмөт бизди билимге жетилсин деп жатат, балдарды окутуубуз керек. (Ч. А.) 5. Сиз такыр байкабагансыз // деди Сатар // бул балада талант бар. (А. Т.)"},{"t":"p","h":"359. Тике сөздү кыйыр сөз менен алмаштырып, сүйлөмдү кайра түзгүлө. Көчүрүп жазып, сүйлөмдүн грамматикалык түзүлүшүндөгү өзгөрүүлөрдү аныктагыла. Тыныш белгилердин коюлушунда кандай өзгөрүүлөр болду?"},{"t":"p","h":"1. Шамбеттин үнү заңк! этип бийик чыкты: «Биздин ишибиз адил, жениш биздики болот!» 2. «Биз дагы бул чакырыкты кубаттайбыз», – деди чоң сакал Дмитрий. (Т. С.) 8. Сөздү Султаналы баштады: «Сен Кетмен-Төбөдөн башка жакты араладынбы?» (К. К.) 4. Элде: «Чыныгы кайрат эр жигитке учууга? канат, конууга? куйрук берет», – деген сөз бар."},{"t":"p","h":"360. Кашаанын ичиндеги сүйлөмдү төл сөздүн маанисинде колдонуп, көп чекиттин ордуна жазгыла да, тике сөз катышкан сүйлөм түзгүлө. Көчүрүп жазып тыныш белгилерин койгула. Алар эмнеге негизделип коюлду?"},{"t":"p","h":"<span class=\"pg\" data-n=\"131\">131<\/span>1. Көрө-көрө көсөм болот... (деп Чаргын алдыртан ойлонот). 2. ... Эл ичи – өнөр кенчи (элде мындай деген макал бар). 3. Биз .., эл алдында берген убадабызды аткарабыз (деди Акия кетирекей). 4. Коркок дос .., душмандан жаман (деп айткан улуу адамдар). 5. Ырыс алды – ынтымак (элде мындай деген макал бар)."},{"t":"p","h":"361. Тике сөздүн сүйлөмдөгү ордун алмаштырып, сүйлөмдү кайрадан көчүрүп жазгыла. Тыныш белгилеринин коюлушу жөнүндө айтып бергиле."},{"t":"p","h":"1. «Адеби жаман элди булгайт»,— деген макал бар. 2. Улуу адамдар минтип айтышкан экен: «Ыр деген тоодон аккан тунук булак». 3. Чыгыш элдеринде мындай деген сөз бар: «Сөздүн мыктысы жөнөкөй, түшүнүктүү жана терен мазмундуу келет». («ЗО»)"},{"t":"p","h":"Ү лгү: Мындай деген макал бар: «Адеби жаман элди булгайт». «Адеби жаман, – деген макал бар, – элди булгайт». Элде: «Адеби жаман элди булгайт»,- деген макал бар."},{"t":"p","h":"362. Схемага көнүл бургула. Ал боюнча тике сөз катышкан сүйлөм түзгүлө. Тике сөз деген эмне?"},{"t":"p","h":"363. Тел сез менен тике сездун ортосундагы интонацияны туура сактап, сүйлөмдү көркөм окугула. Тике сөздөн кийин коюлган үтүр жана сызыкча (,-), суроо жана сызыкча (?—), илеп жана сызыкча (!—) белгилери бир эле тыныш белгисиби же ар башкабы? Булардын колдонулушу эмнеге негизделген?"},{"t":"p","h":"1. «Аман болгула, эл-журт! Биз кеттик!» – деп Чаргын арабанын үстүнө? тартайып тура калды. 2. «Эмне? мен мылтык да ата албай калыптырмынбы?» – деп Чаргын намыстанат. (Т. С.) З. «Жүрөгүм алып учат, кандай окуя болорун билбейм, корком!» – деп Лайлыкан чочуп кетти. 4. «Лайлыкан! Сен бала болуп турасынбы? Арзымат аман бекен?» – деп женем сурап калды. о. «Кадырлуу жолдоштор! Мен, Кан-Абатка барып, тапшырган кызматынарды орундатып, келдим»,— деп Айнагүл сөзүн бүтүрдү. (К. Ж.)"},{"t":"p","h":"364. Көчүргүлө. Тике сөз катышкан сүйлөмдүн схемасын чийгиле. Анын сүйлөмдөгү орун тартиби кандай? Тыныш белгиси кандайча коюлду?"},{"t":"p","h":"<span class=\"pg\" data-n=\"132\">132<\/span>1. Алымкан байбиче Токтогулга сүлөөсүн бөрк кийгизди да, мындай деди: «Токо, тагдыр кошподу, мени эстеп жүрүңүз!» «Кургурум ай?, дагы элез сарсанаа кылар жоругун»,— деп Токтогул муңкана күңгүрөнүп жиберди. (Т. К.) 2. «Куттуктаймын! Шакен аман тура!» – деп Батыш күйөөсүн карады."},{"t":"p","h":"3. «Өчпөс шам жетпейт?» – деди бак-бак этип Чаргын. (Т. С.) 4. «Кен асылы жерде, сөз асылы элде», – деген макал бар. 5. Эл: «Байлыктын атасы эмгек, энеси – жер»*, – деп айткан."},{"t":"p","h":"365. Көркөм окугула. Маектешүүгө кимдер катышты? Алардын сөзүн (төл жана тике сөз) өз-өзүнчө ажыраткыла. Тыныш белгилери кандайча коюлду? Алтынай Сулайманова, өзүнчө кыялданып, келе жатты."},{"t":"v","l":["– Сизге эмне болду, эжеке?“ – деп арабакеч бала сурап калды.","– Анчейин, иним, сен бул айылдын элин тааныйсыңбы?","– Таанычу элем.","– Дүйшөн деген башта мугалим болуп жүрчү кишини? билесинби?","– Дүйшөн? Ал киши аскерге кетти жакында.","– Аял, балдары барбы?","– Ооба, бар. Үйү суунун тиги мандайында. (Ч. А.)"]},{"t":"p","h":"366. Окугула. Диалогго кимдер катышканын аныктагыла. Тыныш белгилеринин коюлушун түшүндүргүлө. Диалог кандай кырдаалда колдонулат?"},{"t":"p","h":"– Ата, эмне учун сен көптү билесин?“ – деп сурады баласы атасынан?."},{"t":"p","h":"– Менин эн жакшы досум жана окутуучум бар. Ал бардыгын үйрөтөт,— деди атасы."},{"t":"p","h":"– Ал окутуучун кайда? Эмне учун мен аны көргөн жокмун? – деди баласы."},{"t":"p","h":"– Ал мына,- деп атасы китептерин көрсөттү."},{"t":"p","h":"– Китептер мага? бардыгын үйрөтөт. Мына бул китептер адамдардын баатырдыгы, ата-бабаларыбыздын байыркы турмушу жөнүндө айтып берет. («А»)"},{"t":"p","h":"367. Өзүнөр кыскача диалог түзгүлө. Мында бирөөгө суроо менен кайрылууда каратма сөздү колдонгула. Тыныш белгилерди коюп, алардын эмне үчүн коюлганын түшүндүргүлө."},{"t":"p","h":"368. Тике сөздү атагыла. Андан кийин аларды диалог түрүндө ондоп түзгүлө. Тыныш белгилеринин коюлушунда кандай өзгөрүүлөр болгондугун аныктагыла."},{"t":"p","h":"1. Жамийла бир убакта алдыда бара жаткан Даниярга мындай деп кыйкырды: «Ой, сустайган неме, ырдап койсоң болбойбу?» 2. «Ырдай бер, Жамийла, кулак сенде!» – деди Данияр. 3. Жамийла кекете какшыктады:"},{"t":"p","h":"<span class=\"pg\" data-n=\"133\">133<\/span>«Ырдабасан жен кой, бой көтөргөнүн мунун!»*. «Сен ырдабасан, мен ырдаймын»?, – деп кайра өзү ырдады. 5. Бир аз өткөндөн кийин Жамийла Даниярды дагы үндөдү: «Ай, Данияр! Сен деги бирөөнү сүйдүң беле?» (Ч. А.)"},{"t":"p","h":"369. Тиешелүү тыныш белгилерди өз ордуна коюп, текстти диалог түрүндө көчүргүлө. Сүйлөшүүгө кимдер катышты? Диалог жөнүндө эмне билесинер?"},{"t":"p","h":"Москванын поезди биздин станциядан түнкү он бирде өтөбү? Ооба эже он бирде өтөт. Эмесе, мен азыр жөнөшүм керек. Эмне үчүн? Сиз бир-эки күн туруп кетмек убаданыз бар эмес беле? Эл сизди коё бербейт, эже. Зарыл жумуштарым бар."},{"t":"p","h":"370. Маектешүүнү андан ары улап, диалог түзгүлө. Бирөөгө кайрылууда каратма сөздү колдонгула. Мумкунчулугунерге карата кашаанын ичиндеги сөздөрдү (саламатсызбы, ырахмат, кечирип коюңуз, жакшы калыңыз, ыраазымын) пайдалангыла."},{"t":"p","h":"У л гү: – Саламатсызбы! Талантты чакырып коёсузбу?"}],"sub":[],"section":"БӨТӨН СӨЗДҮ КОЛДОНУУНУН ЖОЛДОРУ","pages":[129,133]},{"title":"§ 38. ЦИТАТА ЖАНА АНЫН ТЫНЫШ БЕЛГИЛЕРИ","blocks":[{"t":"h3","h":"§ 38. ЦИТАТА ЖАНА АНЫН ТЫНЫШ БЕЛГИЛЕРИ"},{"t":"p","h":"Цитата – бул башка бирөөнүн сөзүн эч өзгөртпөй сөзмө-сөз колдонуу. Башкача айтканда, тике сөздү колдонуунун бир түрү."},{"t":"p","h":"Цитата баяндалып жаткан ой-пикирди ырастоо, бекемдөө максатында колдонулат. Анын тыныш белгилери тике сөздүкүндөй эле, бирок кээ бир айырмачылыктар бар."},{"t":"p","h":"Мисалы, цитата түзүлүшү жагынан төл сөз менен байланышып, анын бир бөлүгү катары колдонулушу мүмкүн. Мындай учурда цитата тырмакчага алынып, кичине тамга менен жазылат (башка белгилер коюлбайт)."},{"t":"p","h":"Мисалы, Эне тилсиз улуттун болушу мүмкүн эмес, ошондуктан «элди түбөлүк эл кылып турган анын тили» боло тургандыгын Ч.Айтматов таасын көрсөткөн."},{"t":"p","h":"Эгерде цитата толук колдонулбаса, анда калтырылып кеткен сөздүн же сүйлөмдүн орду көп чекит менен көрсөтүлөт: «...Тил менен эмгек эмнени гана жаратпайт. Египеттик улуу пирамидалардан тартып XX кылымдын таң каларлык жетишкендиктери – тил менен эмгектин натыйжасы», – деп жазат улуу акыныбыз А. Токомбаев."},{"t":"p","h":"371. Окугула. Цитата түрүндө колдонулган сүйлөмдү көрсөткүлө. Ал сүйлөмдө кандай мааниде колдонулду? Цитатада тыныш белгилери кандайча коюлат?"},{"t":"p","h":"<span class=\"pg\" data-n=\"134\">134<\/span>1. Кыргыз тил илиминин өнүгүшүндө К. Тыныстановдун сиңирген эмгеги бөтөнчө. Анын колу тийбеген кыргыз лингвистикасынын теориялык, методикалык маселелери сейрек. Анын кесиптеши жана тагдырлашы, залкар окумуштуу профессор Е. Д. Поливанов мындайча эскерген экен: «Кыргызстандагы тил курулушу облусунда жана кыргыз тилин окутуу ишинде жолдош К. Тыныстанов эн маанилүү роль ойноп келген жана ойноп жатат». Демек, профессор К. Тыныстанов терен билимдүү инсан болгон."},{"t":"p","h":"2. – Атыныз?, фамилияныз ким? – Атты айткан менен эмне чыгат? «Мин кишинин атын? билгенче, бир кишинин сырын бил» деген эмеспи? Сырымды билсеңиз, атымды да билерсиз. Албеттез, мен өзүмдүн башыман өткөргөн кыйынчылыктарды айтайын, бирок* угууга оор. Ошондой болсо да, айтайын. (К. Ж.)"},{"t":"p","h":"372. «Мен кайсы кесипти жакшы көрөм» деген темада дилбаян жазгыла. Өзүнөрдүн ой-пикиринерди, тилегинерди жана каалоонорду ачык-так, ишенимдүү баяндоодо көрүнүктүү адамдардын айткандарын цитата түрүндө колдонгула."},{"t":"p","h":"373. Тике сөз катышкан сүйлөмгө синтаксистик талдоо жүргүзгүлө."},{"t":"p","h":"1. Элде мындай деген накыл сөз бар: «Акыл сурасан Сарт акеге, сөз сурасан Тилекмат акеге бар». («КТ»)"},{"t":"p","h":"2. Улуу ойчул Ж. Баласагын: «Билим – өнөр, өмүргө суудай керек»,- деген осуят калтырган. 3. «Дарак бир жерде когерер»,- деп айткан экен нускоочу акын Калыгул. («Мурас») 4. «Эрди кабагынан сына» дегендей, сен өзүн ким болосун, мырзам?» – деди Бектурган. (А. Т.)"},{"t":"p","h":"374. Эл ичинде колдонулган макалдарды пайдаланып, төрт сүйлөм түзгүлө. Эки сүйлөмдө тике сөз төл сөздөн мурда, экөөндө андан кийин келсин. Тыныш белгилеринин коюлушун түшүндүргүлө."},{"t":"p","h":"375. Калтырылып кеткен тыныш белгилерди өз ордуна коюп, көчүргүлө. Алардын коюлушу кайсы эрежелерге негизделди?"},{"t":"p","h":"1. Аксакал жөнөбөйлүбү // деди Керимбек. 2. Абдан жакшы болот, мен сизди эле күтүп турам // деди Чыныбай. (Н. Б.) 3. Жапар, баланы бооруна кысып, өпкүлөп жиберди // бул – менин досумдун баласы. 4. Сизге кыянат болбосо, күүнүн сырын чечип берсениз // дедим. Олда балам ай // деди карыя // эми болбостур. (А. Т.)"},{"t":"p","h":"376. Көчүргүлө. Синтаксистик талдоо жүргүзгүлө: а) түзүлүшү боюнча кандай сүйлөмдөр бар? б) сүйлөм мүчөлөрүнүн астын сызгыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"135\">135<\/span>1. Кезинде азуусун айга жаныган Арстанаалы кылычынын курчтугун байкаш үчүн адамдын башын? алдырган экен. (Т. С.) 2. Айта-бунта дегенче эр Бакайдын жанына чаап чыгып барышты. («Манас») 3. Чапанымды желбегей жамынып, тышка чыктым. 4. Асмандагы Ай, жымындап нурун чачып?, уясына карай жылып бара жатат. (К. Ж.) 5. «Досу көптү жоо албайт, акылы көптү доо албайт»,- деген макал бар."},{"t":"p","h":"377. Төмөндө элдик макалдар берилди. Алардын ар бирин тике сөздүн маанисинде колдонуп, сүйлөм түзгүлө. Макалдын мааниси жөнүндө айтып бергиле."},{"t":"p","h":"1. Туулган жердин топурагы – алтын. 2. Өкүм болмок өзүндөн, сылык болмок сезунден. 3. Жаман сөз жүрөккө барып таш болот. 4. Туура бийде тууган жок, туугандуу бийде ыйман жок. 5. Карагай болбой, чер болбойт, кайратсыз адам эр болбойт."}],"sub":[],"section":"БӨТӨН СӨЗДҮ КОЛДОНУУНУН ЖОЛДОРУ","pages":[134,135]},{"title":"§ 39. ТИКЕ СӨЗ КАТЫШКАН СҮЙЛӨМ БОЮНЧА СИНТАКСИСТИК ТАЛДОО","blocks":[{"t":"h3","h":"§ 39. ТИКЕ СӨЗ КАТЫШКАН СҮЙЛӨМ БОЮНЧА СИНТАКСИСТИК ТАЛДОО"},{"t":"v","l":["Талдоонун тартиби:","","1. Тике сөз катышкан сүйлөм экендигин көрсөтүү.","2. Тике жана төл сөздү (автордун сөзүн) ажыратуу.","3. Төл сөзгө карата тике сөздүн ордун аныктоо.","4. Тыныш белгилердин коюлушун түшүндүрүү.","5. Тике жана төл сөздөрдүн ар бири жөнөкөй же татаал","сүйлөмдөрдүн тартибинде талдалат.","","Талдоонун үлгүсү:"]},{"t":"p","h":"1. Өмүрбек учкуч жигиттен сурап калды: «Сиз Бектурганов дегенди билесизби?» (А. Т.) – Бул – тике сөз катышкан сүйлөм; Өмүрбек учкуч жигиттен сурап калды – төл сөз; «Сиз Бектурганов дегенди билесизби?» – тике сөз. Тике сөз төл сөздөн кийин келди, ал тырмакчага алынып, өзүнөн мурда кош чекит коюлат; суроолуу сүйлөм болгондуктан, аягына суроо белгиси коюлду."},{"t":"p","h":"Андан ары сүйлөм мүчөлөрү боюнча талдоо зарыл болсо, анда төл жана тике сөздүн ар бири жөнөкөй сүйлөм катары талдалат."},{"t":"p","h":"2. «Эне, сени таштап деле кете албайт экенмин», – деп үшкүрдү Алиман. (Ч. А.) – Бул тике сөз катышкан сүйлөм; «Эне, сени таштап деле кете <span class=\"pg\" data-n=\"136\">136<\/span>албайт экенмин» – тике сөз; деп үшкүрдү Алиман – төл сөз. Тике сөз төл сөздөн мурда келди, ал тырмакчага алынып, өзүнөн кийин үтүр (жай сүйлөм болгон үчүн) жана сызыкча коюлду."},{"t":"p","h":"378. Тике сөз катышкан сүйлөмдү таап, ага синтаксистик талдоо жүргүзгүлө."},{"t":"p","h":"Эртен, мененки салкын жел, таза аба кандай! Көнүлдүн кирин кетирип, бир кубанычка бөлөйт, тула бойду кытыгылайт. «Элөөрүп эки жакты карап, чайды да жарытып ичпединиз?» – деп жанымда отурган келин жылмайды."},{"t":"p","h":"Жолоочу жолунда болсо, курсагы ток болсо, пикирлешип, ойноп-күлүп отуруу өзүнчө бир ыракат го! Сөздүн ыгы келгенде, келин сурап калды: «Сиз кайсы райондон болосуз, аты-жөнүнүз ким?» Кайдан келе жатканымды, ким экенимди айтып, өзүмдү тааныштырдым. Менин шашканымды билди. Келин: «Сизге жакын отурбасам, машинанын табышы сөзүмдү угузбас»,— деп мага карай ыктады. (К. Ж.)"},{"t":"p","h":"379. Көчүргүлө. Тике сөз катышкан сүйлөмдөрдү сүйлөм мүчөлөрү боюнча талдагыла. Тике сөздүн тыныш белгисин түшүндүргүлө."},{"t":"p","h":"1. «Окуу – билим азыгы, билим – ырыс казыгы», – деген макал бар."},{"t":"p","h":"2. «Абийирдүү жигитке ажалдуу кийик жолугат» – деген ушул, балам."},{"t":"p","h":"3. «Ий-ий, ушул чон энем кызык киши деди Динар кейип. 4. «Ооба, – деди Динар – мен чонойгондо инженер болом». (Т. С.)"},{"t":"p","h":"380. Өзүнөр тике сөз катышкан беш сүйлөм түзүп келгиле, анда тике сөз сүйлөмдүн ар кайсы жеринен орун алсын. Тыныш белгилеринин коюлушун түшүндүргүлө."}],"sub":[],"section":"БӨТӨН СӨЗДҮ КОЛДОНУУНУН ЖОЛДОРУ","pages":[136,136]},{"title":"§ 40. ТЫНЫШ БЕЛГИЛЕРДИН МААНИСИ ЖАНА КЫЗМАТЫ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"137\">137<\/span>ПУНКТУАЦИЯ"},{"t":"h3","h":"§ 40. ТЫНЫШ БЕЛГИЛЕРДИН МААНИСИ ЖАНА КЫЗМАТЫ"},{"t":"p","h":"Ойду жана ички сезимдерди жазуу түрүндө ачык-айкын билдирүүдө тыныш белгилеринин мааниси зор, ошондуктан ал пикир алышуунун кошумча каражаты болуп эсептелет. Жазууда тыныш белгилери колдонулбаса, анда айтылып жаткан ой чаташып, баш аламандык болор эле."},{"t":"p","h":"Ушундай эле, сүйлөмдүн тутумундагы синтаксистик категорияларды: бир өнчөй мүчөлөрдү, түшүндүрмө мүчөнү, киринди сөздү, тике сөздү ж. б. өзүнчө бөлүп көрсөтөт. Ошентип, тыныш белгилери айтылып жаткан ойго кошумча маани, кошумча түс берет. Мисалы, сүйлөмдүн аягына коюлган суроо, илеп белгилери, биринчиден, сүйлөмдүн аякталып бүткөндүгүн билдирсе, экинчиден, анын кандай максатта колдонулуп жаткандыгын көрсөтөт."},{"t":"p","h":"Жазууда тыныш белгилерин туура колдонууда төмөнкү жоболор эске алынууга тийиш: а) сүйлөмдүн кандай мааниде айтылып жаткандыгы; б) сүйлөмдүн грамматикалык түзүлүшү; в) интонация. Бул жоболор бири-бири менен байланыштуу, өз ара шартташкан мүнөздө каралат."},{"t":"p","h":"Азыркы кыргыз тилинде колдонулуп жүргөн тыныш белгилерге төмөнкүлөр кирет: чекит, көп чекит, суроо жана илеп белгиси, үтүр, үтүрлүү чекит, сызыкча, тырмакча, кашаа."},{"t":"p","h":"381. Төмөндө тыныш белгилери коюлбаган текст берилди. Текстти ошол түрүндө окугула. Кандай кыйынчылыкты байкадынар? Эмне жөнүндө сөз болуп жатканын ачык-так аныктоого болобу? Андан кийин ушул эле текстти тыныш белгилери коюлган түрүндө кайта окугула. Сүйлөмдүн маанисин ачык-так кабыл алууга эмнелер жардам берди?"},{"t":"p","h":"1. Суу болобуз кокуй үйгө кире туралы десем Алиман эчтеке эмес эне бүтүрүп коёлу деп жаандын кытыгылаганына каткыра күлүп жерди айдай берди Алиман улам алакандарын бетин жаанга тосуп эне бери карачы кандай сонун жаан кандай таза жаан быйыл эгин мол болот төгө бер берекенди төгө бер деп кубанып жатты келинимдин бул кылыгына мен да баттым."},{"t":"p","h":"2. Суу болобуз!, кокуй?, үйгө кире туралы десем, Алиман: «Эчтеке эмес, эне, бүтүрүп коёлу!» – деп жаандын кытыгылаганына каткыра күлүп, жерди айдай берди. Алиман улам алакандарын, бетин жаанга тосуп: «Эне, бери <span class=\"pg\" data-n=\"138\">138<\/span>карачы? Кандай сонун жаан! Кандай таза жаан! Быйыл эгин мол болот. Төгө бер, берекенди төгө бер!» – деп кубанып жатты. Келинимдин бул кылыгына мен да баттым. (Ч. А.)"},{"t":"p","h":"382. Коюлган тыныш белгилерине карай, интонацияны туура сактап, текстти көркөм окугула. Тыныш белгилердин эмне үчүн коюлганын түшүндүргүлө."},{"t":"p","h":"Ушинтип!, согуш эн акыркы өчүн да алып тынды. Ошол күнкү баскан жол турмушумда эн оор жол болду го! Ай, ошондогу карангы түн ай! «Тү! Сенин бетиңе, дүйнө. Кечтим сенден, кечтим! Жашагым келбейт!» – деп ниеттен бузулуп, турмуштан безип келе жаттым. Мен ушинтип келе жатканымда, чапанымдагы кызыл эт бала, үн ынаалап ыйлап жатты. Алда байкушум ай?, адегенде эле эненди жоктоп калдын го деп, ого бетер буркурап ыйладым."},{"t":"p","h":"Ымыркай баланын денеси° жүрөгүмдүн астында улам жылуу тартып, боорума жакындай берди. Ошол күйүт, арман, ыйдын арасынан кандайдыр бир бүдөмүк ой туулду: «Өмүр таптакыр эле түгөнүп калбаптыр го. Аягында кичинекей тирүү жан калыптыр го. Турмуш менен дагы кармашып көрсөк кантет». (Ч. А.)"},{"t":"p","h":"383. Көчүрүп жазгыла да, тиешелүү жерлерге тыныш белгилерди койгула. Алар эмне үчүн коюлду? Кызматы эмне? Түшүндүргүлө."},{"t":"p","h":"Карыя жалгыз күүсүн! алда канча чертип жиберди // // Аксакалдын бул күүсүнүн аты эмне // деп сурадым жанымдагы кара сакал кишиден //"},{"t":"p","h":"// Билбеймин? // муну эч ким билбейт // // Сиз ушул айылдансызбы // Эмне* үчүн билбейсиз // деп ал кишиден дагы сурадым //"},{"t":"p","h":"// Ооба? // иним // ушул эле айылданмын // Мен бул кишиден элүү жаш кичүүмүн // деп жылмайды."},{"t":"p","h":"Бул кишинин сөзү мени ого бетер кызыктырды // (А. Т.) 384. Сүйлөмдөрдүн аягындагы тыныш белгилер эмнеге негизделип коюлду? Каратма сөз менен сырдык сөздөрдөн кийин илеп белгисин коюуда эмнени эске алдык? Жалпы эле, тыныш белгилери кандай кызматты аткарышты?"},{"t":"p","h":"1. Алимандын тагдырын? эстегенде ичим күйүп чок болот... Анын* убал-сообу кимде? Анын дартын кимге* айтам? Кайран* келиним! Гүл сүйгөн келиним! (Ч. А.) 2. Батманын оорусу күчөдү. Эки сөзүнүн биринде айтканы – Ажар."},{"t":"p","h":"– Жалгызым... Сен кантесин?. Келчи мага!.. Айткулу ай!.. Ажарды алчы... Алчы!.. Ушудунбу? (К. Б.) 3. Турсун эже эмгегине танданат: «Пай-пай! <span class=\"pg\" data-n=\"139\">139<\/span>Көз тийбесин!.. Былтыр эмне үчүн ушундай иштебедим экен?» Эсенгелдиге уулунан кат келди: «Ардактуу ата, эне! Мен жаңы тарбияга өткөндөн бери өзүмдүн эр жетип калганымды биле баштадым...» Энеси! Уулундан кат алдым."},{"t":"p","h":"Кана, буга эмне дейсин. (Т. С.)"},{"t":"p","h":"385. Сүйлөмдөрдүн аягына кайсы белгилер коюлат? Аларды коюуда эмнени эске алдынар? Мисалдарды көркөм окуп, далилдегиле."},{"t":"p","h":"– А-а-аз, Айганыш балам, ал-жайын кандай* // көрүнүшүң жаман го, улундеп' күйгөн шамдай //"},{"t":"p","h":"– «Курманбек өлдү» деген кабар көнүлүнө майдай жагар // – Абдан сонун кабар, балким, сага да жагар // – Абдан жагат // (К. Ж.)"},{"t":"p","h":"386. Окугула. Үтүр белгисинин эмне үчүн коюлганын түшүндүргүлө. Сүйлөмгө мүчө боло албаган сөздөр сүйлөмдүн ортосуна келгенде, үтүр кандайча коюлат?"},{"t":"p","h":"1. Ажардын! бардык үмүтү да?*, тилеги да, өмүр сүрүүсү да ушул отко байланышкан. От өчсө, аны менен бирге Ажар да өчмөк. (К. Б.) 2. Биз, кыргыз эли, жаңы турмушту көздөй бет алдык*. Силер, жаштар, бул иште көч башында болуунар керек. («КТ») 3. Көптөн бери, курбулар, Жапардын созолонтуп ырдаганын сагындык“+*. 4. Балалык чак, айторз, бүлбүлдөп артта калууда. 5. – Бали?, балам! Сен – деди көк ала сакал абышка."},{"t":"p","h":"– Мен Айдар деген болом, аксакал, – деди жигит. (Т. С.) 387. Текстти окугула. Коюлбай калтырылып кеткен үтүр белгисин койгула. Кайсы эрежеге ылайык коюлду? Түшүндүргүлө. Оюңарды мисалдар аркылуу далилдегиле. Текст кептин кайсы түрүнө кирет?"},{"t":"p","h":"Албетте // Дүйшөн өзү да менин? бул абалымды жакшы билип жатты. Мүмкүн // менин! көңүлүмдү көтөрөйүн дедиби // эртесинде мектепке эки терекче алып барды. Окуу бүткөндөн кийин // Дүйшөн мени колумдан жетелеп:"},{"t":"p","h":"– Экөөбүз? азыр бир иш кылабыз // Алтынай // деди // мени күлө карап. Мына бул теректерди мен сага арнап алып келдим. Ушулар жетилип чоңойгондо // сен дагы көктөп бүрдөйсүн. (Ч. А.)"},{"t":"p","h":"388. Кош чёкит кайсы эрежеге ылайык коюлгандыгын түшүндүргүлө. Төмөндө берилген сүйлөмдөрдөн мисал келтирип, өз оюңарды бекемдегиле."},{"t":"p","h":"1. Поезд акырын келип? Казан вокзалына токтоду. Баарыбыз: кыргызстандыктар да, казакстандыктар да, өзбекстандыктар да вагондон чыктык."},{"t":"p","h":"<span class=\"pg\" data-n=\"140\">140<\/span>Тышта! бизди көп эл күтүп турган экен. (К. Б.) 2. Адамдын баарында эки түрдүү кемчилик болот: бирөө? өзү менен кошо жаралат, экинчиси башкалардан жугат. 3. Даанышмандар минтип айтышкан: «Акылмандын акылдуу болушуна билим себепкер». («ЗО»)"},{"t":"p","h":"389. Окугула. Диалогдо жана тике сөздө сызыкча кандайча коюлду? Эрежесин түшүндүргүлө. Тыныш белгилеринин коюлушунда кандай окшоштуктар бар? Айырмачылыгы эмнеде?"},{"t":"v","l":["1. Бурулча Айшага мындай деди:","– Садаган*, мен жумушка кетем. Сен үйдө кал."]},{"t":"p","h":"– Жок, энеке, мен да сиз менен барам. Үйдө жалгыз кантип калат элем? – деди Айша. (К. Б.) 2. Жоокер, эки жагын каранып, күлүндөп? турду да:"},{"t":"p","h":"– Күркүрөө айылынан! ким бар? – деп кыйкырып* жиберди."},{"t":"p","h":"390. Окугула. Сызыкча, кош чекит белгилери кайсы эрежеге ылайык коюлду? Ушул үзүндү өзүнчө текст болобу? Далилдегиле."},{"t":"p","h":"Биз жерден көтөрүлдүк. Баары дапдаана көрүнүп турду: айдоо аянттары, айылдар, шаарлар. Баары тен тааныш."},{"t":"p","h":"Алды жактан көрүнгөн шаарлар, кыштактар булар:"},{"t":"p","h":"Кара-Балта, Сокулук, Ак-Суу, Кайынды. Мына Зууракан Кайназарова жашаган айыл. Ал азыр дүркүрөп өсүүдө."},{"t":"p","h":"Самолёттун жолу даңгыр. Анын жолу – асман. Ага аска да, суу да – бардыгы тоскоол боло албайт."},{"t":"p","h":"Таластын тарыхый эстеликтеринин үстүнөн учуп бара жатабыз. Манастын күмбөзү, Айчүрөк конгон боз секи – баары көрүнүп турат. Дагы тоолор!.. Кубангандан же ырдагын, же кыйкыргын келет! (Ж. Б.)"},{"t":"v","l":["Кайталоо үчүн суроолор:","","1. Бөтөн сөз кандай жолдор аркылуу колдонулат? Мисал келтиргиле."]},{"t":"p","h":". Тике сөз деген эмне? Ага тыныш белгиси кандайча коюлат? Мисал келтиргиле."},{"t":"v","l":["С› б л —1. Кыйыр сөз деген эмне? Мисал келтиргиле.. Диалог жөнүндө айтып бергиле.. Диалогдо тыныш белгиси кандайча коюлат? ‚ Тыныш белгилеринин жазуудагы мааниси жөнүндө эмне билесинер?",". Цитата жана анын тыныш белгилери жөнүндө эмне билесинер?"]},{"t":"p","h":"8. Тыныш белгилерди колдонууда кандай жоболорду жетекчиликке алабыз?"}],"sub":[],"section":"ПУНКТУАЦИЯ","pages":[137,140]},{"title":"ГХ КЛАССТА ӨЗДӨШТҮРҮЛГӨНДӨРДҮ КАЙТАЛОО","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"141\">141<\/span>ГХ КЛАССТА ӨЗДӨШТҮРҮЛГӨНДӨРДҮ КАЙТАЛОО"},{"t":"p","h":"391. Окугула. Түшүндүрмө мүчө катышкан сүйлөмдү тапкыла, ал жөнүндө айтып бергиле, анда тыныш белгилери кандайча коюлат? Ошол сүйлөмгө синтаксистик талдоо жүргүзгүлө. Түшүндүрмө мүчө сүйлөмдүн кайсы мүчөсү болду?"},{"t":"p","h":"Биздин айыл Ак-Жар тоо этегинде орношкон. Айылдын үстүндөгү адырда эки зор терек болор эле. Кийин, эс тартып чоңойгондо, мен бул теректердин сырын түшүндүм. Окуудан тараган жайкы маалда биз, бир топ балдар, балапан алабыз деп, ушул жерге келчүбүз. Ошондо биз, чор таман тентектер, теректерге мышыкча асылып чыкчубуз."},{"t":"p","h":"Мына ушул теректер турган жерди айылдагылар «Дүйшөндүн мектеби» деп койчу. Бир кездерде ошол дөбөнүн үстүндө, эки зор терек турган жерде, мектеп болгон имиш. (Ч. А.)"},{"t":"p","h":"392. Сүйлөмдөгү сөздөрдүн орун тартиби жөнүндө эмне билесинер? Сүйлөм мүчөлөрүнүн түз жана өзгөргөн терс орун тартиби кандай? Төмөнкү тексттерден мисал келтиргиле."},{"t":"h3","h":"НОБЕЛЬ СЫЙЛЫГЫ"},{"t":"p","h":"1. Бул барктуу сыйлык химия, физика, адабият жана саясий иштер жаатында жетишкен ийгиликтер үчүн берилет. Аталган сыйлык Альфред Нобель деген швед окумуштуусунун ысмы менен байланышкан жана 1900- жылы уюшулган."},{"t":"p","h":"Ошентип, Нобель сыйлыгы ар жыл сайын (10-декабрь) көрүнүктүү окумуштууларга, жазуучуларга, ишмерлерге ыйгарылат. Стокгольм жана Осло шаарларында бул баалуу сыйлыкты тапшыруу аземи болуп турат. («КТ»)"},{"t":"p","h":"2. Бир көрдүм Аркыт өрөөнүн,"},{"t":"v","l":["Эсимден чыкпайт эгерим.","Бардыгы анда дээр элем,","Бар болсо «бейиш» дегенин. (Б. С.)"]},{"t":"p","h":"393. Каратма сөз катышкан сүйлөмдү көрсөткүлө. Бул сөз эмне үчүн колдонулат? Ага тыныш белгиси кандайча коюлат? Бирөөлөргө кайрылганда же алар менен аңгемелешкенде каратма сөздү колдонууга аракеттенгиле."},{"t":"v","l":["1. Суйкайган сулуу сеники, төрөм!","Сымбаттуу күлүк меники, төрөм!","<span class=\"pg\" data-n=\"142\">142<\/span>Айтылуу сулуу сеники, төрөм,","Ашкере күлүк меники, төрөм! (Ж. Т.)","2. – Башынды өйдө көтөр, Толгонай, кайрат кыл."]},{"t":"p","h":"– Жарайт. Андан башка чарам барбы. Эсиндеби, айланайын тууган жер, ошол күнкү?"},{"t":"p","h":"– Мен эчтекени унутпайм, Толгонай. Сүйлөй бер, сүйлө, Толгонай, сүйлө, пендем. Бүгүн кулак сенде."},{"t":"p","h":"– Ох, эмнени айтайын, Жер энем! Ошонун эртесинде, күн чыга электе, орок оруп, жумушка кириштик. (Ч. А.)"},{"t":"p","h":"394. Көчүргүлө. Сүйлөм мүчөлөрү боюнча синтаксистик талдоо жүргүзгүлө, Мында сүйлөм мүчөсүнүн милдетин аткара албаган сөз барбы? Ал жөнүндө эмне билесинер?"},{"t":"p","h":"1. Акия айткандай, ошол эле күнү көпчүлүк Чаргынды башкармалыкка шайлап коюшту. 2. Чынында эле, Чаргын майданга кеткен жолдошторунун ордун басышы керек эле. З. Жакшылап ойлон, Чаке. Сен эми, албетте, баягы тентек жигит эмессин. 4. Сүйгүнчүлүктүү бол. Баарынан мурда, калыс бол. (Т. С.)"},{"t":"p","h":"395. Текстти көркөм окугула. Ички сезимдерди билдирүүдө кайсы сөз колдонулат? Ошондой сөздү атагыла, ал кандай сезимди билдирди? Жазууда кайсы тыныш белгилери менен ажыратылды."},{"t":"p","h":"Ошентип, украиналык жаш аялды көрүү үчүн бүжүрөп баскан кемпирлер Каныштыкына киришти."},{"t":"p","h":"– Ботом, Каныш! Келин келди дешет. Кайсы келиниң?"},{"t":"p","h":"– Апей, кайсы келини болсун,— деди кайкы мурун кара кемпир, – жанакы орус..."},{"t":"p","h":"Ал ангычакты болбой келгендерден көрүндүк алууга даяр отурган аялдардын бири кемпирлерге кайрылды:"},{"t":"p","h":"– Көрүндүгүн бергиле, байбичелер? Бир эмес эки баш кошулду?"},{"t":"p","h":"Камка кары үч сомдук кагазды уктап жаткан баланын койнуна салып койду да:"},{"t":"p","h":"– О-о, садагасы, онкойгон арам! – деп баланын бөрсөйгөн мурдунан чымчып өөп койду. (Т. С.)"},{"t":"p","h":"396. Атоочтук же чакчыл түрмөк катышкан жөнөкөй сүйлөмдү көчүрүп жазгыла. Алар сүйлөмдүн кайсы мүчөлөрүнөн болушту? Кайсы сөз менен байланышты?"},{"t":"p","h":"<span class=\"pg\" data-n=\"143\">143<\/span>1. Мен ушинтип турганда, үйдөн Алиман чыгып келди. Гүлдүү жоолугун салынып, жибек көйнөгүн кийип, жасанып алган. (Ч. А.) 2. Алымдын келишин күтө берип, Чоконун чыдамы кетти. Каныбектин дайынын билүү үчүн кеткен Алымдан эч кабар жок. Алым аман барбы же бирөөнүн колуна түштүбү? (К. Ж.) 3. Айтмакчы, унутуп баратыпмын. Сени бедеге төрөткөн Чаргын байкен кандай турат? Иштери кандай? (Т. С.)"},{"t":"p","h":"397. Көчүргүлө. Сүйлөм мүчөлөрү боюнча талдоо жүргүзгүлө. Грамматикалык түзүлүшү жагынан булар сүйлөмдүн кайсы түрлөрүнөн болушту?"},{"t":"p","h":"1. Бала, ызасына чыдабай, ыйлап жиберди. Муштумдарын түйүп, өйдө тура калып, колун көсөп сүйлөдү. Мен анын ушул кайратына ыраазы болдум. 2. Терең сайда күрөшкө тойбос Байдамтал дагы эле, жанын сабап, толкундарды ташка жанчат. (Ч. А.) 3. Ажардын көз жашы тыйылып, санаасы алда кайда кетти. (К. Б.)"},{"t":"p","h":"398. Текстти көркөм окугула. Тыныш белгилердин коюлуш эрежелерин түшүндүргүлө."},{"t":"p","h":"Найман эне, эки колдоп бетин басып, солуктап ыйлап көпкө отурду. Анан калган күч-кубатын жыйнап, уулуна жөнөдү. Манкурт уулу эчтеке көрбөгөн-билбегендей, кайдыгер карап турду."},{"t":"p","h":"– Отурчу, сүйлөшөлү, – деди Найман эне, оор үшкүрүнүп. – Сени издебеген жерим калбады го!"},{"t":"v","l":["Экее бет мандай отурушту.","– Мени тааныйсынбы? – деди эне.","Маңкурт башын чайкады.","– Сенин атың ким?","– Маңкурт, – деди ал."]},{"t":"p","h":"– Сени азыр ошентип аташат, мурдагы атын эсиндеби? Атандын аты – Дөнөнбай, ошону билбейсинби? Сенин атын – Жоломан!"},{"t":"p","h":"Мунун баарысы уулуна эч кандай таасир этпей жатты. (Ч. А.) 399. Көчүргүлө. Калтырылып кеткен тыныш белгилерди өз ордуна койгула. Алар эмне үчүн коюлду? Түшүндүргүлө."},{"t":"p","h":"1. – Энеке // тиги кимдин баласы // деди Жапар. – А-а, кагылайын // ал Балтабайдын баласы Сатар эмеспи."},{"t":"p","h":"2. Сатар // бетиндеги терин сүртүп // күлүндөп басып келди."},{"t":"p","h":"3. Биз // кыргыз жазуучулары // дүйнөнүн алдынкы адамдары менен жакындашуу үчүн көп иштерди аткардык. (К. Б.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"144\">144<\/span>400. Окугула. Татаал сүйлөмдү көрсөткүлө, анын кандай түрлөрүн билесинер? Алардын айырмачылыгы эмнеде?"},{"t":"h3","h":"ЭЛ КАЗЫНАСЫНАН"},{"t":"p","h":"1. Акылдуу адам көптү билиш үчүн окуйт, майда адам көпкө көрүнүш үчүн окуйт. 2. Адам болууга умтулгандар үчүн илимдин кандайы болсо да оордук кылбайт. 8. Чөйрө кандай болсо, акыл ошондой болот: акылдуулардын арасында акылга акыл кошулат, акмактардын арасында акыл акырындап жошулат, өзү тендүүлөрдүн арасында калыбын жоготпойт. 4. Туш келип дөөлөт жолукса, душманын келип дос болот. («ЗО»)"},{"t":"p","h":"401. Татаал сүйлөмдүн кайсы түрү баш жана багыныңкы сүйлөмдөрдөн түзүлөт. Багынынкы баш сүйлөм менен кайсы мүчөлөр аркылуу байланышат? Төмөнкүлөрдөн мисал келтиргиле."},{"t":"p","h":"1. Күн батып кетсе? да, анын асманды алоолонткон жарыгы талаа бетин куугумдентуп турат. 2. Тоо басып калгансып, Эдигей үч бүктөлүп отурат."},{"t":"p","h":"3. Ошондой болсо да, күн жылып, тоого жаз келип, биз кош айдоого эртерээк кириштик. 4. Нурбектин кубанычы кучагына батпай, ал өзүн эн эле бактылуу сезди. (Ч. А.)"},{"t":"p","h":"402. Текстти көркөм окугула. Сүйлөмдүн түзүлүшүнө байкоо жүргүзгүлө да, үтүр белгилеринин эмне үчүн коюлгандыгын аныктагыла."},{"t":"v","l":["Комузчу, ырчы, обончу, чексиз чебер","Билсен айт, дагы акынга жетпейт нелер?","Ташыса Ысык-Көлдөй ташкыны бар,","Таланттан Токтогулга ким тең келер?","Эмесе «Жаш кыялы», «Алымканы»","Кылымдап кыргызында жашай берер.","","Аппак? кар түшүп турат, түшүп турат,","Себилип тээ тетиги көктөн кулап.","Дарактар калч-калч этип үшүп турат,","Ар бири аппак кардан тумак сурап. (С. Э.)"]},{"t":"p","h":"403. Сүйлөмдөргө синтаксистик талдоо жүргүзгүлө. Түзүлүшү боюнча кандай сүйлөмдөрдү өздөштүрдүнөр? Алардын ар бирине мисал келтиргиле."},{"t":"p","h":"1. Бирде мен сөз кутулбас акынмын, бирде мен жоого кирчү баатырмын. (С. А.) 2. Конур күз. Эртен айылга жөнөймүн. Ысык-Көл мелтиреп турат. Толкун <span class=\"pg\" data-n=\"145\">145<\/span>да көрүнбөйт. Айлана тыптынч. Сапарынар кут болсун, Талант балам. («КБ») 3. Күн бата, Чон-Ташты көздөй жол тарттык. (М. Э.)"},{"t":"p","h":"404. Татаал сүйлөмдүн кандай түрлөрүн билесинер? Алардын ар бирине бирден сүйлөм ойлоп тапкыла, сүйлөмдөрдүн айырмачылыгы жөнүндө айтып бергиле."},{"t":"p","h":"405. Багыныңкы сүйлөмдүн кандай түрлөрү бар? Алардын кайсы түрлөрү катышты жана алар баш сүйлөм менен кандайча байланышты?"},{"t":"p","h":"1. Буралып шибер чыкпаса,"},{"t":"v","l":["Жердин көркү болобу?","Каз, өрдөгү болбосо,","Көлдүн көркү болобу? (Т.)","","3. Күн жарыгы тийгендей,","Күлгөнү кызык баланын.","Оргу-баргы кеп айтып,","Жүргөнү кызык баланын.","2. Жакшыга дөөлөт келгенде,","Бой көтөрбөй пас болот.","Жаманга дөөлөт келгенде,","Көтөрө албай мас болот. (Ж.)","","4. Жамаатын жакшы болгон сон,","Ырыска ыктоо эл болот.","Каршылашып жоо келсе,","Биригип каптап сел болот. (Ж.)"]},{"t":"p","h":"406. Төл жана бөтөн сөздөрдү өзүнчө ажыраткыла. Бөтөн сөздү кандай жол менен колдонсо болот? Тике сөздүн тыныш белгиси жөнүндө айтып бергиле."},{"t":"p","h":"1. Ойчул акын Калыгул мындай деп айткан: «Окусан илим үйрөнүп, орундуу жазган кат жакшы». 2. «Айдан жылдыз чексиз көп, түн эмнеге караңгы?» – деп суроо койгон акын Женижок. («Мурас») 8. Кыз төөнү бура тартып тура калды да: «Мен убадама жеттим», – деди (А. Т.)"},{"t":"p","h":"407. Көчүргүлө. Тике сөздү таап, анын тыныш белгисин койгула. Эмне үчүн коюлгандыгын түшүндүргүлө."},{"t":"p","h":"1. Эне, жер муштап, кайталап айта берди / / Эсте атынды, сенин атын ким эле / / 2. Жакшы окуйт, балам зээндүү / / деди Момун. 3З. Бугу эне уул бала менен кыз балага / / Балдарым, мына эми мен силердин эненермин, мен силерди Ала-Тоого алып барамын / / деди. 4. —- Жок, ал менин атам болчу, менин атам / / дей берди ызага туталанган Абалбек. (Ч. А.)"},{"t":"p","h":"408. Көчүргүлө. Сүйлөмдөргө синтаксистик талдоо жүргүзгүлө: а) айтылыш максаты боюнча; б) грамматикалык түзүлүшү боюнча; в) сүйлөм мүчөлөрү боюнча."},{"t":"p","h":"1. Таятамдыкы Чон-Таштан кырк чакырымдай ары, Кең-Сууда. (М. Э.) 2. Көктөйүн деген чырпык элем, гүлдөйүн деген дарак элем. (Т. С.) 3. Тан атты. Кар жаап турат. Танабай, атын теминип, желе-жорго жүрдү. (Ч. А.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"146\">146<\/span>4. Кызым, эгер намысын болсо, макул дебе? Намыс үчүн өлчү атана кенедей да кайгы жебе? (К. Ж.)"},{"t":"p","h":"409. БК. Текстти көркөм окуп, анын мазмуну менен таанышкыла. Текстке талдоо жүргүзгүлө, тилдик каражаттардын колдонулушун аныктагыла, Текстке кандай аталыш берүүгө болот?"},{"t":"p","h":"Өткөн бир заманда Акыл аке аттуу киши болуптур. Мүмкүн, ал кишинин аты бардыр, бирок эл аны Акыл аке дешчү экен."},{"t":"p","h":"Элден элге барып, кызыктуу жомокторду, сонун аңгемелерди айтып, элдин моокумун кандырар эле. Эл анын сонун ангемелери үчүн көп акча, кымбаттуу буюмдарын да аяшкан эмес."},{"t":"p","h":"Акыл аке элден эч нерсе сурачу эмес, бирок бергенин таштабай алып, оокаты жетишпегендерге бөлүп, андан калганын үйүнө жыйнап коё берүүчү."},{"t":"p","h":"Күндөрдүн биринде Акыл аке дагы элди аралап, өзүнүн кызыктуу сөздөрүн өзү тыңшоого чыкты. Тилекке каршы, өзүнүн берметтей сөздөрүн уга алган жок. Ошондон кийин жыйналган көп дүйнөсүнө он беш бөлмөлүү үй салдырды да, сергек балдардан отузду жыйнап, балдан ширин, суудан тунук, кылычтан өткүр сөздөрүн аларга үйрөтө баштады."},{"t":"p","h":"Эл Акыл акеге ыраазы болушуп: «Акыл аке дүйнөнү кубалабайт, акылды кубалайт. Өзүнүн артына акылдуу кишилерди тарбиялап чыгармакчы. Ал кишинин билгенин биз билбейбиз, ал киши – доордун булбулу», – дей турган болушту."},{"t":"p","h":"Акыл акенин сөзүн угуу үчүн ар кайсы хандыктардан кишилер келишип, анын өлбөс сөздөрүн уга башташты. Анын кадыры күн санап артылып, байлыгы өлчөмсүз арбый берди. «Хандардын казнасы Акыл акенин казнасына жетпейт», – деген сөз бардык элге жайылды. (А. Т.)"}],"sub":[{"title":"НОБЕЛЬ СЫЙЛЫГЫ","b":5},{"title":"ЭЛ КАЗЫНАСЫНАН","b":39}],"section":"ПУНКТУАЦИЯ","pages":[141,146]},{"title":"ТАТААЛ СҮЙЛӨМДӨ КОЮЛУУЧУ ТЫНЫШ БЕЛГИЛЕР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"147\">147<\/span>ТАТААЛ СҮЙЛӨМДӨ КОЮЛУУЧУ ТЫНЫШ БЕЛГИЛЕР"},{"t":"h3","h":"Чекит (.)"},{"t":"p","h":"Жай сүйлөмдүн маанисиндеги татаал сүйлөмдүн аягына чекит коюлат: 1. Көл бетине нур чагылышат, айлана килемдей кулпурат. (Т. С.) 2. Өнөрүң болсо, өргө чап. (Т.)"},{"t":"p","h":"Суроо белгиси (?) Суроолуу сүйлөмдүн маанисиндеги татаал сүйлөмдүн аягына суроо белгиси коюлат: 1. Жакшы сөзү болбосо, карынын көркү болобу? (Т.) 2. Тең курбум эсен кайтып, биз кайрадан бирге иштөөчү күн келер бекен? (Т. С.)"},{"t":"h3","h":"Илеп белгиси (!)"},{"t":"p","h":"Илептүү сүйлөмдүн маанисиндеги татаал сүйлөмдүн аягына илеп белгиси коюлат: Барагой эми, балам, ак жолуң ачылсын! (Ч. А.)"},{"t":"h3","h":"Кош чекит (:)"},{"t":"p","h":"Татаал сүйлөмдү түзүп турган жөнөкөй сүйлөмдөрдүн бирөө негизгиси болуп, калгандары анын маанисин чечмелеп турса, негизги сүйлөмдөн кийин кош чекит коюлат: Мезгил бардыгын өзгөртөт: жыл өткөн сайын мүнөз да өзгөрөт, тагдыр да башкача болот. («КТ»)"},{"t":"h3","h":"Үтүр (,)"},{"t":"p","h":"1. Татаал сүйлөмдүн курамындагы жөнөкөй сүйлөмдөр үтүр менен ажыратылат: Намысы бар жигиттин нар күчүндөй күчү бар, намысы жок жигиттин намыс менен неси бар. (Мак.)"},{"t":"p","h":"2. Эгерде багынынкы сүйлөм баш сүйлөмдүн ортосунда кыстырылып келсе, үтүр анын эки жагына коюлат: Чүкөбай, Жапар канча айтса да, өз билгенин берген жок. (К. Б.)"},{"t":"p","h":"3. Сүйлөмдүн тутумундагы каратма, киринди, сырдык сөздөр үтүр менен ажыратылат: 1. Жолдоштор, ар дайым карапайым жана жөнөкөй болгула."},{"t":"p","h":"2. Биз, албетте, өзүбүздүн ата мекенибизди сүйөбүз. («А») 3. Эй, алтын тоо, бөйрөгүңдү казабыз, уктап жаткан алтын кенин ачабыз. (К. М.)"},{"t":"p","h":"4. Сүйлөмдүн тутумундагы түшүндүрмө мүчөнүн эки жагына үтүр коюлат: Ал кишини биз, кыргыз балдары, Кузьмич ата дечүбүз. (Т. С.)"},{"t":"p","h":"5. Сүйлөмдүн тутумундагы чакчыл түрмөк үтүр менен ажыратылат: Чаргын колуна кесени алып, күлүп койду. Чаргынды катарына алып, Жапар теребелге көз чаптырат. (Т. С.)"}],"sub":[],"section":"ПУНКТУАЦИЯ","pages":[147,147]},{"title":"ФОНЕТИКАЛЫК ТАЛДООНУН ТАРТИБИ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"148\">148<\/span>ТИРКЕМЕ"},{"t":"h3","h":"ФОНЕТИКАЛЫК ТАЛДООНУН ТАРТИБИ"},{"t":"p","h":"1. Сөздө канча муун, канча тыбыш, канча тамга бар экендигин аныктоо."},{"t":"p","h":"2. Үндүү тыбышка мүнөздөмө берүү (жоон же ичке, кен же кууш, эриндүү же эринсиз, кыска же созулма)."},{"t":"p","h":"3. Үнсүз тыбышка мүнөздөмө берүү (жумшак же каткалан түгөйлүү же түгөйсүз)."}],"sub":[],"section":"ТИРКЕМЕ","pages":[148,148]},{"title":"СӨЗ ЖАСОО БОЮНЧА ТАЛДООНУН ТАРТИБИ","blocks":[{"t":"h3","h":"СӨЗДҮН КУРАМЫ БОЮНЧА ТАЛДООНУН ТАРТИБИ"},{"t":"v","l":["1. Сөздүн унгусун жана мүчөсүн аныктоо.","2. Мүчөнүн түрлөрүн атоо (сөз жасоочу же сөз өзгөртүүчү).","3. Сөз жасоочу жана сөз өзгөртүүчү мүчөлөрдүн түрлөрүн аныктоо."]},{"t":"h3","h":"СӨЗ ЖАСОО БОЮНЧА ТАЛДООНУН ТАРТИБИ"},{"t":"p","h":"1. Кайсы сөздөн кандай маанидеги сөздүн жасалганын аныктоо (заттан этиш; этиштен зат; заттан сын атооч ж. б.)."},{"t":"v","l":["2. Сөз кайсы мүчөнүн жардамы менен жасалгандыгын белгилөө.","3. Сөз жасоонун жолун атап көрсөтүү."]}],"sub":[{"title":"СӨЗ ЖАСОО БОЮНЧА ТАЛДООНУН ТАРТИБИ","b":2}],"section":"СӨЗДҮН КУРАМЫ БОЮНЧА ТАЛДООНУН ТАРТИБИ","pages":[148,148]},{"title":"МОРФОЛОГИЯЛЫК ТАЛДООНУН ТАРТИБИ","blocks":[{"t":"h3","h":"МОРФОЛОГИЯЛЫК ТАЛДООНУН ТАРТИБИ"},{"t":"p","h":"1. Маани берүүчү сөз түркүмдөрү"},{"t":"p","h":"Адегенде кайсы сөз түркүмү экендиги аталууга тийиш. Андан кийин сөз түркүмдөрүнүн ар бирине мүнөздүү белгилер көрсөтүлөт."},{"t":"p","h":"З а т а т о оч: энчилүү же жалпы зат атооч экендиги; кандай формада колдонулганы; жекелик же көптүк санда, жөндөмө, жак, таандык мүчөлөр менен келиши."},{"t":"p","h":"С ын а т о оч: түрлөрү (сапаттык же катыштык); даражалары (жай, салыштырма, басандатма, күчөтмө); заттык мааниде болсо, кандай формада колдонулганы: жекелик же көптүк санда, жөндөмө, жак, таандык мүчөлөрдө келиши."},{"t":"p","h":"Сан а т о оч: түрлөрү (эсептик, иреттик, жандама, чамалама, бөлчөк, топ сан); кайсы формада колдонулганы: жөндөмө, жак, таандык мүчөлөрдө келиши."},{"t":"p","h":"<span class=\"pg\" data-n=\"149\">149<\/span>А т а т о оч: түрлөрү (жактама, шилтеме, сурама, тангыч, аныктама, белгисиз ат атоочтор); кайсы формада колдонулганы: жекелик же көптүк санда, жөндөмө мүчөлөрдө келиши."},{"t":"p","h":"Эти ш: түзүлүшү (негизги же жардамчы); кайсы формада колдонулганы: чагы, жагы, ынгайы, мамилеси; этиштин өзгөчө түрлөрү: атоочтук, чакчыл, кыймыл атооч."},{"t":"p","h":"Т а к т о о ч: кандай мааниде колдонулганы (орун, мезгил, сыпат, сан-өлчөм)."},{"t":"h3","h":"П. Кызматчы сөздөр"},{"t":"p","h":"Ж. а нд о оч: кайсы жөндөмө менен колдонулганын белгилөө."},{"t":"p","h":"Б а йл а м т а: түрлөрү (каршылагыч, байланыштыргыч, ажыраткыч, себеп-натыйжалагыч, шарттуу, салыштырма)."},{"t":"p","h":"Б ө лү к чө: мааниси (чектеме, күчөтмө, аныктагыч, тангыч ж. б.)."},{"t":"h3","h":"Ш. Өзгөчө сөз түркүмдөрү"},{"t":"p","h":"Тууранды сөз: тыбыш же элестүү сөз."},{"t":"p","h":"Сырдык сөз: кандай мааниде колдонулганы (ички сезимди же эркти билдиргендиги)."}],"sub":[{"title":"П. Кызматчы сөздөр","b":9},{"title":"Ш. Өзгөчө сөз түркүмдөрү","b":13}],"section":"СӨЗДҮН КУРАМЫ БОЮНЧА ТАЛДООНУН ТАРТИБИ","pages":[149,149]},{"title":"СИНТАКСИСТИК ТАЛДООНУН ТАРТИБИ 1. Сөз айкашы","blocks":[{"t":"h3","h":"СИНТАКСИСТИК ТАЛДООНУН ТАРТИБИ 1. Сөз айкашы"},{"t":"p","h":"1. Сөз айкашынын түзүлүшү жөнүндө айтып берүү: а) негизги жана багынынкы сөздү табуу; б) алардын кайсы сөз түркүмүнөн болгондугун көрсөтүү."},{"t":"p","h":"2. Негизги жана багынынкы сөздөрдүн байланышуу жолдорун (ыкташуу, башкаруу, таандык байланыш) аныктоо."},{"t":"h3","h":"П. Жөнөкөй сүйлөм"},{"t":"p","h":"1. Айтылыш максаты боюнча сүйлөмдүн кайсы түрү (жай, суроолуу, буйрук, илептүү) экенин атоо."},{"t":"p","h":"2. Сүйлөмдүн грамматикалык негизин (ээ, баяндооч) таап, анын жөнөкөй же татаал сүйлөм экендигин белгилөө."},{"t":"p","h":"З. Жөнөкөй сүйлөмдүн түзүлүшү жөнүндө айтып берүү:"},{"t":"p","h":"а) эки тутумдуубу (жалан жайылма) же бир тутумдуубу (атама, жактуу, жаксыз);"},{"t":"p","h":"б) толук же кемтик сүйлөмбү (кемтик сүйлөм болсо, анын кайсы мүчөсү айтылбай калганын табуу)."},{"t":"p","h":"<span class=\"pg\" data-n=\"150\">150<\/span>4. Эгерде бир өңчөй мүчөлөр, жалпылагыч сөз, түшүндүрмө мүчө, сүйлөмгө мүчө боло албаган сөздөр, чакчыл жана атоочтук түрмөктөр (алар сүйлөмдүн кайсы мүчөсү экендиги аныкталат) болсо, аларды өзүнчө белгилөө керек (өздөштүрүлгөндөн кийин)."},{"t":"p","h":"5. Сүйлөмдү сүйлөм мүчөлөрүнө ажыратып, алардын милдетин кайсы сөз түркүмү аткаргандыгы айтылат; мында адегенде сүйлөмдүн баш мүчөлөрү, андан сон, айкындоочтор табылууга тийиш."},{"t":"p","h":"6. Тыныш белгилеринин коюлушун түшүндүрүү."},{"t":"h3","h":"Ш. Татаал сүйлөм"},{"t":"p","h":"1. Сүйлөмдүн грамматикалык негиздерин (баш мүчөлөрүн) белгилөө менен татаал сүйлөм экендигин көрсөтүү."},{"t":"p","h":"2. Татаал сүйлөмдүн кайсы түрү экенин аныктоо:"},{"t":"p","h":"а) тен байланыштагы татаал сүйлөм; анын тутумунда канча жөнөкөй сүйлөм бар экенин, алардын өз ара байланышуу жолдорун (интонация, байламта) аныктоо;"},{"t":"p","h":"б) жөнөкөй сүйлөмдөрдүн ортосундагы маанилик катышты (тен, маанилеш, мезгилдеш, себеп-натыйжа ж. б.) аныктоо."},{"t":"p","h":"3. Багынынкы байланыштагы татаал сүйлөм болсо, андагы баш жана багынынкы сүйлөмдөрдү көрсөтүү; багынынкы сүйлөмдүн түрлөрүн (мезгил, себеп, максат ж. б.) аныктоо."},{"t":"p","h":"4. Тыныш белгилердин коюлушун түшүндүрүү."},{"t":"p","h":"5. Мындан кийин татаал сүйлөмдүн ар бир бөлүгүн жөнөкөй сүйлөм катары талдоо."},{"t":"p","h":"6. Көп багынынкылуу татаал сүйлөмдү талдоодо багынынкы сүйлөмдөрдүн бир өнчөй, же бир өнчөй эмес экендигин белгилөө."},{"t":"p","h":"Т. Аралаш татаал сүйлөм болсо, андагы тен жана багынынкы байланыштагы сүйлөмдөрдү ажыратуу."}],"sub":[{"title":"П. Жөнөкөй сүйлөм","b":3},{"title":"Ш. Татаал сүйлөм","b":12}],"section":"СӨЗДҮН КУРАМЫ БОЮНЧА ТАЛДООНУН ТАРТИБИ","pages":[150,150]},{"title":"ІХ КЛАСС БОЮНЧА ТЕСТТИН ҮЛГҮЛӨРҮ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"151\">151<\/span>ІХ КЛАСС БОЮНЧА ТЕСТТИН ҮЛГҮЛӨРҮ"},{"t":"v","l":["1. Кайсы сүйлөмдө түшүндүрмө мүчө катышты:","а) Кыз көгөргөн көлгө, керилген тоолорго суктана карайт.","б) Шамбетке Чаргын чапжаак ыраазы."]},{"t":"p","h":"в) Биз, айылдын жаштары, быйыл өзүбүздүн айылга электр станциясын курабыз. (Т. С.)"},{"t":"v","l":["2. Төмөнкү мисалдардын ичинен кайсынысы татаал сүйлөм:","а) Аркы-беркини байкас албай, Чаргын бек-бек унчукту.","б) Кишилерди күлдүрүп отуруучу Элебес көрүнбөйт.","в) Ооба, бийлегин, Сергей эмдигиче тим эле чимирилип кетмек. (Т. С.)","","З. Татаал сүйлөм грамматикалык түзүлүшү боюнча канчага бөлүнөт:","а) экиге; б) төрткө; в) бешке.","","4. Татаал сүйлөмдүн кандай түрлөрү бар:","а) тең байланыштагы жана багынынкы байланыштагы;","б) жөнөкөй жана татаал;","в) бир тутумдуу жана эки тутумдуу."]},{"t":"p","h":"5. Түшүндүрмө мүчө катышкан сүйлөмдү тапкыла жана тыныш белгисин койгула:"},{"t":"p","h":"а) Күн кылкылдап уясына батып баратат."},{"t":"p","h":"б) Силер мугалимдер жаш өспүрүмдөргө таалим-тарбия берүүдө баа жеткис эмгек сиңирдинер. (К. Б.) в) Шаркырап аккан сууга жеткенде Данияр арабаны жайыраак айдады. (Ч. А.) 6. Каратма сөз катышкан сүйлөмдү көрсөткүлө:"},{"t":"p","h":"а) Таятамдын жомогу көп: кайгылуусу да, коркунучтуусу да бар."},{"t":"p","h":"б) Баарынан жакшы көргөнүм – жанагы мүйүздүү Бугу эне жөнүндөгү жомок."},{"t":"p","h":"в) Сен ал жомокту билесинби, ата? (Ч. А.) 7. Сүйлөмдүн курамындагы каратма сөздүн астын сызгыла, тыныш белгилерин койгула:"},{"t":"v","l":["а) Мен Бугу эне болом. (Ч. А.)","б) Келдим эне элди-жерди сагынып. (Ж. Т.)","в) Байлык – колго кармаган муз. (Мак.)"]},{"t":"p","h":"8. Сүйлөмгө мүчө боло албаган сөздүн астын сызгыла жана тыныш белгисин койгула:"},{"t":"v","l":["а) Маралдар суу ичип турганда, өйүз жээкке корукчулар келди.","б) Эх ак маралдай маңкайып дегендей эле бар экен!","в) Фотоаппаратты ала келсек, сонун болмок экен да! (Ч. А.)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"152\">152<\/span>9. Тең байланыштагы татаал сүйлөмдү тапкыла:"},{"t":"p","h":"а) Улуу кубаныч Акияны да толкундаткан, ошентсе да өкүнүчтүү келин Элебесин эстейт."},{"t":"p","h":"б) Мыскал башынан өткөргөн окуясын Камкага сүйлөп жатканда, Сатай менен Салмоорбек, көчөнү жаңыртып, чуркап келишти. (Т. С.) в) Күзүндө жамгыр болбосо, күлгүн чөп кайдан бүрдөсүн. (Т.) 10. Багыныңкы байланыштагы татаал сүйлөм кандай сүйлөмдөрдөн түзүлөт:"},{"t":"p","h":"а) баш жана багынынкы;"},{"t":"v","l":["б) толук жана кемтик;","в) тен укуктагы жөнөкөй сүйлөмдөрдөн.","","11. Мезгил багыныңкы сүйлөмдү тапкыла:","а) Оор барскандар күрсүлдөп, устакана кереметтенет."]},{"t":"p","h":"б) Эки абышканын жемесинен кийин элдин уу-дуусу бир азга басандады."},{"t":"p","h":"в) Шамбет майданга кеткенден кийин, күтүлбөгөн жерден Чаргын башкарма болду. (Т. С.)"},{"t":"v","l":["12. Киринди сөз катышкан сүйлөмдү тапкыла:","а) Бектурган тан куланөөк болгондо эшикте болду.","б) Адам, чынын айтканда, бактыга тойбойт.","в) Эки гүлдүн ортосуна кандай тикенек чыкканы мага белгисиз. (А. Т.)","","13. Кайсы сүйлөмдө чакчыл түрмөк катышты:","а) Арабадан ыргып түшүп, Алиман жаныма жетип келди.","б) Алимандын мунусуна ыраазы болуп калдым.","в) Энеке, Касымдан кат келди. (Ч. А.)"]},{"t":"p","h":"14. Баш жана багыныңкы сүйлөм бири-бири менен грамматикалык кайсы каражаттар аркылуу байланышат:"},{"t":"v","l":["а) интонация, байламталар;","б) чакчыл, атоочтук жана шарттуу ынгайдын -са мүчөсү;","в) түзүлүшү, орун тартиби.","","15. Багыныңкы байланыштагы татаал сүйлөмдү тапкыла:","а) Кайгысы жок кара сууга семирет.","б) Жакшылардын үлгүсү жанып турган шамдай. (Мак.)","в) Каптаган душман ала албайт, тилектеш болсо мин адам. (Т.)","","16. Атоочтук түрмөк катышкан сүйлөм кайсы:","а) Көтөрүлүп көп сүйлөп, болбос ишке күлбөгүн. (Т.)","б) Улар үнүн уккан адам барбы?","в) Таптаган билет шумкарды. (Мак.)","<span class=\"pg\" data-n=\"153\">153<\/span>17. Сыпат багынынкы сүйлөмдү көрсөткүлө:","а) Эне тил болбой, эл болбойт. (Мак.)","б) Бетинен нуру чачырап, толкундап Сырга кубанды. (Ж. Б.)","в) Айылдан эртең менен чыгып, станцияга түш оой барабыз. (Ч. А.)","","18. Шарттуу багыныңкы сүйлөмдү тапкыла:","а) Күндүн нуру болбосо, суу күркүрөп көбөйбөйт.","б) Бардыгына күн себеп, бардыгына күн керек. (Ж.)","в) Бекендин сөзү катуу тийсе да, Садыр унчукпай тура берди. (Ш. Б.)","","19. Тең байланыштагы татаал сүйлөм кайсы:","а) Өткөн күндү эскерген – өскөндүктүн белгиси.","б) Мээримдүүлүктү энеден үйрөн, адептүүлүктү эстүүдөн үйрөн. (Мак.)","в) Айтике, баланы карап, отура калды. (А. Т.)"]},{"t":"p","h":"20. Баш сүйлөмдүн ортосунда кыстырылып келген багынынкы сүйлөмдү тапкыла:"},{"t":"v","l":["а) Жапар катты окуп чыкканда, өңү кумсарып, көзү ымыр-чымыр","болду.","б) Бүткөн бою дирилдеп, бир топко чейин каттан көзүн албады.","в) Ажар, карышкырлар жакындап кирип келген сайын, ширенке","тартып жатты. (К. Б.)"]},{"t":"p","h":"21. Татаал сүйлөмдүн тутумундагы максат багыныңкы сүйлөмдү аныктагыла:"},{"t":"p","h":"а) Балдар окусун деп, Дүйшөн бизди мектепке ээрчитип чыкты."},{"t":"p","h":"б) Дүйшөн өзү жол баштап, анын артынан балдар чыйырга түштү."},{"t":"p","h":"в) Балдар чогулгандан кийин, Дүйшөн күндөгүдөй от жаккан жок. (Ч. А.) 22. Көп багыныңкылуу татаал сүйлөмдү көрсөткүлө:"},{"t":"p","h":"а) Чынында, турмуш өзү сонун турбайбы, үтүрөйгөн кайгы дарбазаны ачканча, кош кубаныч кирип келди."},{"t":"p","h":"б) Дагы эшик ачылды, үйгө Зарыл менен Касейин кирди, Касейиндин колунда комузу бар."},{"t":"p","h":"в) Өстөн казылса, станция тургузулса, ар бир үйдө өчпөс шамдар жанат. (Т. С.) 23. Аралаш татаал сүйлөмдү тапкыла:"},{"t":"p","h":"а) Мылтык тарс этти, мен карай калсам, Жапаркул жерде сулап жатыптыр."},{"t":"p","h":"б) Эл чогулуп калды, мен Жапаркулдун башын жөлөдүм, ыйлап жибердим."},{"t":"p","h":"в) Күн бүркөлдү, туман түштү, борошолоп кар жаады. (К. Б.)"},{"t":"v","l":["24. Тике сөздү таап, ага тиешелүү тыныш белгилерди койгула:","а) Элдин айтканына караганда, өнөр алды – кызыл тил."]},{"t":"p","h":"б) Кишиден кем болбогула, башка элге тен болгула деди мүйүздүү Бугу эне."},{"t":"p","h":"<span class=\"pg\" data-n=\"154\">154<\/span>в) Бугу эне коштошуп турганда, арамдыкты каргап, адалдыкты зарлап кеткен экен дешет. (Ч. А.) 25. Кандай учурда төл жана бөтөн сөздөрдө кош чекит коюлат:"},{"t":"p","h":"а) тике сөз төл сөздөн мурда келгенде; б) тике сөз төл сөздөн кийин келгенде;"},{"t":"p","h":"в) тике сөз төл сөздүн ортосуна келгенде."},{"t":"v","l":["26. Тике сөздү таап, анын тыныш белгилерин койгула:","а) Шамбет эмгектин ийгилиги, аракеттин берекеси бар деди.","б) Демилге берип, Чаргын да эл менен бирге иштеп жатат.","в) Адырдан калкып жел жүрсө, ак буудай башы ыргалат."]},{"t":"p","h":"27. Кайсы учурда тике сөз катышкан сүйлөмдө суроо жана сызыкча белгилери коюлат:"},{"t":"v","l":["а) тике сөз төл сөздөн кийин келсе;","б) суроолуу сүйлөмдүн маанисиндеги тике сөз төл сөздөн мурда келсе;","в) тике сөз кыйыр сөз түрүндө колдонулса.","","28. Жайылма сүйлөмдү тапкыла:","а) Бул кыз Мыскалды билер бекен, сурачы?","б) Энемди кыя албай, кайра айылга кеттим."]},{"t":"p","h":"в) Өзүнүз баланын энеси болдунуз, сизди чыгышты карай жөнөтөбүз.(Т'. С.) 29. Багынынкы байланыштагы татаал сүйлөмдү көрсөткүлө:"},{"t":"v","l":["а) Биз, Бейшемби келген кезде, чөп үйүп жатканбыз. (М. Э.)","б) Бир аздан кийин күн ысый баштады."]},{"t":"p","h":"в) Күндүн ысык шооласы Ажарды ысытып жиберди, бир тамчы суу көзүнөн учту. (К. Б.)"},{"t":"v","l":["ЗО. Чакчыл түрмөк катышкан жөнөкөй сүйлөмдү тапкыла.","а) Жалындаган от өчүп, карышкырлар кайра качырышты.","б) Ажар коркту, ыйлап жиберди.","в) Асмандагы сулуу Ай да кош айтышты, Ажарды аяп. (К. Б.)","","31. Тең байланыштагы татаал сүйлөм барбы:","а) Мен өйдө турганым жок, оозумдан үн да чыккан жок.","б) Сүйүнгөнүм канчалык көп болсо, өкүнүп-өксүгөнүм андан көп.","в) Дүйшөн, аттан секирип түшүп, эшикти жара тепти. (Ч. А.)"]},{"t":"p","h":"32. Татаал сүйлөмдүн курамында биринчи бөлүгү жайылма, экинчиси жалан сүйлөмдөн түзүлгөн татаал сүйлөмдү көрсөткүлө:"},{"t":"p","h":"а) Байлыктын атасы – эмгек, энеси – жер. б) Акыл – тозбос тон, билим – түгөнбөс кен.в) Күч кетет, билим кетпейт. (Мак.)"},{"t":"p","h":"<span class=\"pg\" data-n=\"155\">155<\/span>33. Эки тутумдуу жөнөкөй сүйлөмдөрдөн түзүлгөн татаал сүйлөм барбы, тапкыла:"},{"t":"v","l":["а) Алтын алба, алкыш ал.","б) Жолдон чыксан да, элден чыкпа.","в) Акыл денизден терен, билим тоодон бийик. (Мак.)","","34. Каратма сөз катышкан сүйлөмдү тап:","а) Анын туура, улуу талаам, бирок биз пендебиз да, жакшылыктан","дайым үмүтүбүз чон.","б   function cacheName(b) { return 'book-' + b.id + '-' + b.v; }

  // The library is organised by school (language of instruction), then grade, then subject.
  // Choosing the school also sets the interface language.
  var SCHOOLS = [['ky', 'Кыргыз мектеби'], ['ru', 'Русская школа']];

  // Subjects in the order the ministry lists them. A book's subject comes from its "subject"
  // field when index.json has one, otherwise from its title; a title that matches nothing
  // becomes its own subject, so new books always show up.
  var SUBJECTS = [

    ['kyrgyz-adabiyat', /кыргыз адабият|кыргызская литература/, 'Кыргыз адабияты', 'Кыргызская литература'],
    ['russkiy-yazyk', /русский язык|орус тили/, 'Орус тили', 'Русский язык'],
    ['russkaya-literatura', /русская литература|литературное чтение|орус адабият/, 'Орус адабияты', 'Русская литература'],
    ['adabiyat', /адабият|литератур/, 'Адабият', 'Литература'],
    ['matematika', /математик|алгебр|геометр/, 'Математика', 'Математика'],
    ['fizika', /физик/, 'Физика', 'Физика'],
    ['himiya', /хими/, 'Химия', 'Химия'],
    ['biologiya', /биолог/, 'Биология', 'Биология'],
    ['geografiya', /географ/, 'География', 'География'],
    ['istoriya-kg', /кыргызстан\S* тарых|история кыргызстана/, 'Кыргызстандын тарыхы', 'История Кыргызстана'],
    ['istoriya-mir', /дүйнө тарых|орто кылым|жаңы тарых|соңку тарых|байыркы|всемирная история|средних век|новая история|новейшая история|древн/, 'Дүйнө тарыхы', 'Всемирная история'],
    ['religii', /диндер|религи/, 'Диндердин тарыхы', 'История религий'],
    ['obshchestvo', /адам жана коом|человек и общество/, 'Адам жана коом', 'Человек и общество'],

  function subjectOf(b) {
    var s = String(b.subject || b.title || '').toLowerCase();
    for (var i = 0; i < SUBJECTS.length; i++) {
      if (b.subject === SUBJECTS[i][0] || SUBJECTS[i][1].test(s)) return { key: SUBJECTS[i][0], order: i, name: SUBJECTS[i][S.ui === 'ky' ? 2 : 3] };
    }
    return { key: 'x:' + s, order: SUBJECTS.length, name: b.subject || b.title };
  }

  // "My books": books the reader opened or added, stored on the phone. 1 = in the list,
  // 0 = removed by the reader. Books opened before this list existed count as added.
  function myState() { return lsGet('mybooks', null) || {}; }
  function inMy(id) { var s = myState()[id]; return s === 1 || (s !== 0 && !!lsGet('pos:' + id, null)); }
  function setMy(id, on) { var s = myState(); s[id] = on ? 1 : 0; lsSet('mybooks', s); }

  var libHash = '#/'; // where the reader's back button returns to

      (main ? '<p class="sub">' + esc(t('appSub')) + '</p><div class="school">' + SCHOOLS.map(function (o) {
        return '<button data-s="' + o[0] + '"' + (o[0] === school ? ' class="on"' : '') + '>' + esc(o[1]) + '</button>';
      }).join('') + '</div>' : '') +

    Array.prototype.forEach.call(app.querySelectorAll('.school button'), function (btn) {
      btn.onclick = function () {
        S.school = S.ui = btn.getAttribute('data-s'); applySettings();

  function loadList() {

  function showLibrary() {
    libHash = '#/';

    loadList().then(function (list) {
      list = list.filter(function (b) { return !b.school || b.school === school; });
      var grades = [];
      list.forEach(function (b) { gradesOf(b).forEach(function (g) { if (grades.indexOf(g) < 0) grades.push(g); }); });
      grades.sort(function (a, b) { return a - b; });

  function showMyBooks() {

<title>Кыргыз тили 11</title>
<style>/* Mobile textbook reader. No external fonts or libraries: everything works offline. */
:root {
  --bg: #ffffff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3;
  --panel: #f6f6f6; --accent: #1f6feb; --accent-fg: #ffffff;
  --fs: 19px; --lh: 1.55;
  --font: Georgia, "Noto Serif", "DejaVu Serif", "Times New Roman", serif;
  --bar-h: 48px; --foot-h: 28px;
}
[data-theme="sepia"] { --bg: #f5ecd9; --fg: #4a3b2a; --muted: #8a7458; --line: #e0d2b4; --panel: #ece0c6; --accent: #9a5b13; }
[data-theme="dark"]  { --bg: #111315; --fg: #d8d8d8; --muted: #8c8c8c; --line: #2a2d31; --panel: #1b1e21; --accent: #6ea8ff; --accent-fg: #0b0b0b; }
[data-theme="contrast"] { --bg: #000000; --fg: #ffffff; --muted: #c8c8c8; --line: #444; --panel: #151515; --accent: #ffd400; --accent-fg: #000; }
[data-font="sans"] { --font: Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 16px/1.4 Roboto, "Noto Sans", Arial, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- Library ---------- */
.lib { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lib h1 { font-size: 22px; margin: 8px 0 4px; }
.lib .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.lib-head { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
.lib-head h1 { flex: 1; margin: 0; }
.school { display: flex; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.school button { flex: 1; min-height: 44px; padding: 0 10px; font-size: 15px; background: var(--panel); }
.school button + button { border-left: 1px solid var(--line); }
.school button.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.my-link { flex: 0 0 auto; font-weight: 600; min-height: 40px; padding: 0 12px; font-size: 14px; }
.grade { margin-bottom: 10px; }
.grade-h { display: flex; width: 100%; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 18px; font-weight: 600; text-align: left; }
.grade-h::after { content: '›'; font-size: 24px; color: var(--muted); margin-left: 10px; transition: transform .15s; }
.grade.open .grade-h::after { transform: rotate(90deg); }
.grade-h .n { margin-left: auto; font-size: 14px; font-weight: 400; color: var(--muted); }
.grade-b { padding: 0 2px; }
.grade-t { font-size: 20px; margin: 18px 0 0; }
.subj { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.bk { border-bottom: 1px solid var(--line); padding: 4px 0 12px; }
.bk:last-child { border-bottom: 0; }
.bk-t { font-size: 17px; font-weight: 600; }
.bk-s { font-size: 14px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bk-m { color: var(--muted); font-size: 13px; margin: 3px 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: .5; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.bk-h { display: flex; align-items: flex-start; gap: 4px; }
.bk-h .bk-t { flex: 1; padding-top: 10px; }
.bk .row { gap: 4px; }
.bk .row .btn { min-height: 40px; padding: 0 18px; font-size: 14px; margin-right: 8px; }
.bk .icon { color: var(--muted); flex: 0 0 auto; }
.bk .icon[disabled] { opacity: .5; }
.bk .icon.on { color: var(--accent); }
.bk .star.on svg { fill: currentColor; }
.bk .star.on { color: #e3a008; }
.share-opts { display: flex; flex-direction: column; gap: 10px; }
.share-opts .note { margin-top: 0; }
.sheet h3 .icon { flex: 0 0 auto; }

/* ---------- Reader ---------- */
.reader { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; user-select: text; }
.viewport { position: absolute; left: 0; right: 0; top: 0; bottom: var(--foot-h); overflow: hidden; }
.flow {
  height: 100%; column-fill: auto; padding: 20px 0 12px;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  will-change: transform; transform: translate3d(0,0,0);
  hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
}
.flow.anim { transition: transform .25s ease-out; }
.flow p { margin: 0 0 .15em; text-indent: 1.4em; text-align: left; }
.flow p.ni { text-indent: 0; }
.flow h1, .flow h2, .flow h3 { font-family: Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.25; break-after: avoid; page-break-after: avoid; }
.flow h1 { font-size: 1.35em; margin: .2em 0 .8em; text-align: center; }
.flow h2 { font-size: 1.15em; margin: 1.1em 0 .5em; }
.flow h3 { font-size: 1.0em; margin: 1em 0 .4em; }
.flow .verse { margin: .6em 0 .8em 1em; break-inside: auto; }
.flow .verse div { text-indent: -1em; padding-left: 1em; text-align: left; }
.flow .verse .gap { height: .7em; }
.flow figure { margin: .8em 0; text-align: center; break-inside: avoid; page-break-inside: avoid; }
.flow figure img { max-width: 100%; height: auto; border-radius: 4px; background: var(--panel); }
.flow figcaption { font-size: .8em; color: var(--muted); margin-top: .3em; }
.flow .box { border-left: 3px solid var(--accent); padding: .1em 0 .1em .7em; margin: .7em 0; }
.flow .pg { font: 11px/1 Roboto, Arial, sans-serif; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 4px; margin: 0 3px; vertical-align: 2px; text-indent: 0; white-space: nowrap; user-select: none; }
.flow .end { height: 1px; }
.flow .endnote { text-align: center; color: var(--muted); font-size: .8em; margin-top: 2em; font-family: Roboto, Arial, sans-serif; }
[data-theme="dark"] .flow img, [data-theme="contrast"] .flow img { filter: brightness(.9); }

.foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot-h); display: flex; align-items: center;
  justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.foot .t { overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }

.bar { position: absolute; left: 0; right: 0; background: var(--panel); border-color: var(--line); z-index: 5;
  transition: transform .2s; display: flex; align-items: center; }
.bar.top { top: 0; height: var(--bar-h); border-bottom: 1px solid var(--line); transform: translateY(-100%); padding: 0 4px; }
.bar.bottom { bottom: 0; border-top: 1px solid var(--line); transform: translateY(100%); padding: 10px 16px 14px; flex-direction: column; align-items: stretch; gap: 6px; }
.reader.ui .bar { transform: none; }
.bar .title { flex: 1; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.bar .info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* ---------- Sheets (TOC, settings) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85%; overflow: auto; background: var(--bg);
  border-radius: 16px 16px 0 0; z-index: 11; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
.sheet h3 { margin: 10px 0 12px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.toc a { display: block; padding: 11px 4px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 15px; }
.toc a.sub { padding-left: 20px; font-size: 14px; color: var(--muted); }
.toc a.cur { color: var(--accent); font-weight: 600; }
.set { margin: 14px 0; }
.set label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; }
.seg button.on { border: 2px solid var(--accent); font-weight: 600; }
.swatch[data-v="light"] { background: #fff; color: #1b1b1b; }
.swatch[data-v="sepia"] { background: #f5ecd9; color: #4a3b2a; }
.swatch[data-v="dark"] { background: #111315; color: #d8d8d8; }
.swatch[data-v="contrast"] { background: #000; color: var(--accent-fg); }
.goto { display: flex; gap: 8px; }
.goto input { flex: 1; min-height: 44px; font-size: 16px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px;
  border-radius: 20px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Textbook elements produced by tools/convert_pdf.py ---------- */
.flow .tasks, .flow .gloss { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45;
  background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0; }
.flow .tasks p, .flow .gloss p { margin: 0 0 .35em; text-align: left; }
.flow .gloss { border-left: 3px solid var(--accent); }
.flow p.note { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; font-style: italic; text-indent: 0; margin: .6em 0; }
.flow p.attr { text-align: right; text-indent: 0; font-style: italic; color: var(--muted); margin: .1em 0 .8em; }
.flow p.sep { text-align: center; text-indent: 0; color: var(--muted); margin: .5em 0; letter-spacing: .3em; }
.flow h2 .pg, .flow h3 .pg { font-weight: normal; }
.toc .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 4px 2px; }
.toc a .p { float: right; color: var(--muted); font-size: 13px; margin-left: 8px; }

/* ---------- Elements produced by tools/convert_layout.py (typeset textbooks) ---------- */
.flow figure img { cursor: zoom-in; }
.flow h4.mk { font: 700 .78em/1.3 Roboto, "Noto Sans", Arial, sans-serif; letter-spacing: .05em; color: var(--accent);
  margin: 1em 0 .3em; break-after: avoid; page-break-after: avoid; }
.flow p.hl { color: var(--accent); text-indent: 0; }
.flow p.small { font-size: .82em; text-indent: 0; color: var(--muted); }
.flow sup, .flow sub { font-size: .7em; line-height: 0; }
.flow .kbox { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45; background: var(--panel);
  border-radius: 8px; padding: .45em .7em; margin: .5em 0; border-left: 3px solid var(--accent); }
.flow .kbox > b { display: block; }
.flow .frame { background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0;
  font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; line-height: 1.45; }
.flow .frame p { text-indent: 0; margin: 0 0 .35em; text-align: left; }
.flow .tbl { margin: .8em 0; font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .8em; line-height: 1.35; }
.flow .tbl .tt { font-weight: 600; text-indent: 0; text-align: center; margin-bottom: .3em; }
.flow .tbl table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.flow .tbl th, .flow .tbl td { border: 1px solid var(--line); padding: .3em .35em; vertical-align: top; text-align: left; overflow-wrap: anywhere; hyphens: auto; }
.flow .tbl th { background: var(--panel); }
.flow .tbl tr { break-inside: avoid; page-break-inside: avoid; }

.zoom { position: fixed; inset: 0; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; background: rgba(0,0,0,.92); z-index: 30; }
.zoom-in { position: absolute; inset: 0; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
.zoom-in img { margin: auto; flex: none; touch-action: pan-x pan-y; object-fit: contain; background: #fff; cursor: zoom-in; }
.zoom-x { position: absolute; top: 8px; right: 8px; color: #fff; background: rgba(0,0,0,.5); z-index: 31; }
.flow h4.sh { font: 700 .95em/1.3 Roboto, "Noto Sans", Arial, sans-serif; text-align: center; margin: .8em 0 .4em; break-after: avoid; page-break-after: avoid; }

/* maths books */
.flow h4.ex, .flow h4.try { font-family: Roboto, Arial, sans-serif; margin: 1.1em 0 .3em; font-size: 1em; }
.flow h4.ex { display: inline-block; background: #f7e400; color: #111; padding: .1em .6em; border-radius: 3px; }
.flow h4.try { color: var(--accent); }
.flow p.goal { font-size: .85em; text-indent: 0; background: var(--panel); border-radius: 8px; padding: .4em .7em; }
.flow b.bd { display: inline-block; text-indent: 0; padding: 0 .4em; border-radius: 1em; background: var(--fg); color: var(--bg);
  font: bold .8em/1.45 Roboto, Arial, sans-serif; margin-right: .2em; }
.flow b.nb { display: inline-block; text-indent: 0; min-width: 1.4em; border-radius: 4px; background: var(--accent); color: var(--accent-fg);
  text-align: center; font-size: .8em; margin-right: .3em; }
.flow .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.15; margin: 0 .1em; }
.flow .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .15em; }
.flow p.ml { text-indent: 0; padding-left: 1em; }
.flow p.side { font-size: .85em; }
.flow details.ans { margin: .3em 0 .8em; font-size: .9em; }
.flow details.ans summary { color: var(--accent); cursor: pointer; font-family: Roboto, Arial, sans-serif; }

/* wide tables become one card per row on phones */
@media (max-width: 560px) {
  .flow .tbl.cards table, .flow .tbl.cards tbody, .flow .tbl.cards tr, .flow .tbl.cards td { display: block; width: auto; }
  .flow .tbl.cards tr:first-child { display: none; }
  .flow .tbl.cards tr { border: 1px solid var(--line); border-radius: 8px; margin: .5em 0; padding: .3em .5em; }
  .flow .tbl.cards td { border: 0; padding: .15em 0; }
  .flow .tbl.cards td::before { content: attr(data-l); display: block; font: 600 .75em/1.3 Roboto, Arial, sans-serif; color: var(--muted); }
  .flow .tbl.cards td:first-child { font-weight: 600; }
}
.flow figure.vec svg { max-width: 100%; height: auto; display: inline-block; background: #fff; border-radius: 4px; cursor: zoom-in; }
[data-theme="dark"] .flow figure.vec svg, [data-theme="contrast"] .flow figure.vec svg { filter: brightness(.9); }
.flow .rt { border-top: 1px solid currentColor; padding-top: 1px; margin-left: 1px; }
.flow .it { display: inline-block; max-width: 100%; margin-right: .9em; text-indent: 0; }
</style>

"t":"p","h":"‚Асанкан Сапарбаев – ф.и.к., доцент. Морфология белумундегу айрым темалар."},{"t":"p","h":"Венера Мусаева – п.и.к., Кыргыз билим беруу академиясынын жетектеечу илимий кызматкери. Морфология белумундегу № 47-50-параграфтар. Кайталоо. Доклад."},{"t":"p","h":"_ББК 81. 2Ки Я721"},{"t":"p","h":"“© Эгембердиев Р., Өмүралиева С), 'Сапарбаев А., Мусаева В., 2007 ©) КР Билим берүү жана илим министрлиги, 2007 © .Полиграфбумресурсы»,2013"},{"t":"h3","h":"<span class=\"pg\" data-n=\"3\">3<\/span>КИРИШ СӨЗ"},{"t":"p","h":"«Кыргыз тили» окуу китеби 10 – 11-класстарга ылайыкталып, ошол кездеги жаңыланган программанын негизинде 1991-жылы жарыкка чыккан. Андан бери 11-класстын «Кыргыз тили» окуу китеби КР Билим берүү, илим жана жаштар саясаты министрлиги тарабынан «Кыргыз тилинен билим беруунун Мамлекеттик стандартына» ылайык Республикалык эксперттик комиссиясынын 2004-жылдагы чечими менен кайра басылып чыгуу мүмкүнчүлүгүнө ээ болгон. Ал эми 2007- жылы бешинчи ирет басылып чыккан. Бул оңдолуп, толукталып 6-басылышы КРнын Өкмөтүнүн «Билим берүү жөнүндө», «Мамлекеттик тил жөнүндө» мыйзамдарын жана 2012-жылкы «Туруктуулук жана бакубат жашоо» Программаларын эске алган окуу планынын (11-класс – жумасына 2 саат, жыл бою 68 саат) негизинде кыргыз тилинин окуу программасына ылайык иштелип чыкты."},{"t":"p","h":"Окуу китебинде окуучулардын кеп жаратуу мүмкүнчүлүгүн, текст түзө билуу жагдайын эсепке алып, айрым бир темалар коомдо тилдин колдонулуш кызматына ылайыкталып оңдолду. Бардык темалар кайрадан түзүлгөнгө муктаж эмес, ошондуктан керегине жараша толукталып, кыргыз тилин инсанга багыттап окутуу менен маданий компетенттцулуктөрүн калыптандыруу сунушталды."},{"t":"p","h":"Кыргыз тил илиминин фонетика, орфография, орфоэпия, лексика, морфология, синтаксис, байланыштуу кеп сыяктуу негизги бөлүмдөрү системалуу курс катары жөнөкөйдөн татаалга, жеңилден оорго карай принцибинин негизинде окутулуп келген жана 10-класста ал материалдар бир кыйла тереңдетилип, кеңейтилген. Ал эми 11-класста «Кыргыз эли колдонгон жазуулар», «Фразеология», «Кыргыз лексикасынын баюу жолдору», «Стиль жана стилистика» өңдүү жаңы бөлүмдөр киргизилип, буга чейинки окуучулардын алган илимий-теориялык билимдери бир кыйла тереңдетилип, кээ <span class=\"pg\" data-n=\"4\">4<\/span>бир темаларга окуучулардын өз алдынча ой жугурте билуц жөндөмдүүлүгүн арттыруу, тил каражаттарынын таасирдуцлиугин, образдуулугун терең өздөштүрүү менен суйлев маданиятына, чечендик кепке (риторикага) окутуп-үйрөтүү максаты көздөгөн практикалык иштерге көбүрөөк орун берилди."},{"t":"p","h":"Булардан сырткары окуучулардын алган билимдерин практикада колдоно билцу мүмкүнчүлүктөрүн арттыруу, тактап айтканда, билгичтик, ыкма, машыгууларын калыптандыруу, окутуунун практикалык багытын кучөтцү максатында, «Байланыштуу кеп» бөлүмүнө кыйла көңүл бөлүндү. Текст боюнча машыгуу иштери, кептин стилдери, иш кагаздары, расмий иш кагаздары, публицистикалык стиль, илимий стиль, ал стилдер боюнча практикалык иштер, тексттер менен иштөө, аларга карата тил каражаттарын туура тандоо боюнча маалыматтар сунуш кылынып, аларды практикалык жактан жабдуу учун ар турдуу мүнөздөгү кенугуцлердуц, дилбаяндарды аткаруу, аларды талдоо иштери сунуш кылынды. Ар бир темадан кийин ылайыгына жараша мазмунга бай, окутуп-тарбиялоочулук максатты көздөгөн тексттер машыгуу иштери үчун сунуш кылынды."},{"t":"p","h":"Адабий тилдин нормасын орду менен өздөштиүрцү, ар кандай тилдик каражаттарды иргеп, тандап колдонуучу, кепти туура, так, ачык-айкын, таза орундуу, адептуу түрдө сүйлөй билүүгө, сөзмөрлүккө, кепкорлукка, чечендикке уйретцу учун окуучулар өз алдыларынча машыгууларына оозеки жана жазуу жумуштарына окуу китебинен кеңири орун бөлүнүп, «Кеп маданияты» деген атайын бөлүмгө да сааттар ыйгарылды."},{"t":"p","h":"Окуучулардын билимин өркүндөтүү, чыгармачылык менен ой жүгүртүүсүн өнүктурцу, доклад, реферат, макалаларды жазууда кептин окуу илимий жана публицистикалык стилдерин бири-биринен айырмалап талдай билцү, кептик компетенттцулугун арттыруу жана калыптандыруу максатында негизги билгичтиктер жана предмет аралык байланыштар эске алынып, окуу китебинин мазмунуна киргизилди. Окуу китебин түзүүнүн талабына ылайык илимий методикалык эмгектер жана тил илиминин жетишкендиктери пайдаланылып, анын жогорку идеялуулугу, илимге негизделгендиги сакталып, кабыл алууга жеңил, кыска жана так эреже, корутундулар менен жабдылды. Орто мектепти аяктаган окуучу кыргыз тили предметинен тилдик, кептик жана маданий компетенттцулуктөргө ээ болуп чыгуусуна айрыкча басым жасалды. Эгерде окуу китебине карата ой-пикир, сунуштарыңыздар болсо авторлорго кайрылсаңыздар болот."}],"sub":[{"title":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК ТУУСУ","b":2},{"title":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК ГИМНИ","b":4},{"title":"А. САПАРБАЕВ., В. МУСАЕВА","b":8},{"title":"ОШ МАМПЕКЕТТИК УНИВЕРСИТЕТИ","b":18},{"title":"ББК 81. 2Ки Я721","b":21},{"title":"КИРИШ СӨЗ","b":35}],"pages":[0,4]},{"title":"&amp; 1. КЫРГЫЗ АДАБИЙ ТИЛИНИН ӨНҮГҮҮСҮ ЖАНА КАЛЫПТАНУУСУ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"5\">5<\/span>&amp; 1. КЫРГЫЗ АДАБИЙ ТИЛИНИН ӨНҮГҮҮСҮ ЖАНА КАЛЫПТАНУУСУ"},{"t":"p","h":"Кыргыз тили – Кыргыз Республикасынын негизги калкы болуп эсептелген кыргыз улутунун тили. Кыргыз тилинде сүйлөп, кыргыз улутуна киргендер республикабызда гана эмес, башка өлкөлөрдө да бар. Алсак, көп сандагы кыргыздар Өзбекстанда, Тажикстанда, Казакстанда, Россия Федерациясында Кытай Эл Республикасында, Афганистанда, Түркияда ж. б. өлкөлөрдө да кыргыз улутундагы элдер жашашат."},{"t":"p","h":"Кыргыз эли – Борбордук Азиядагы байыркы элдердин бири. Анын тили да байыртадан бери жашап келе жаткандыгы талашсыз. Арийне, ал өзүнүн узак мезгилдер ичиндеги өнүгүү доорунда далай өзгөрүүлөргө учуроосу мүмкүн. Анткени тил менен коом тыгыз байланышта болот. Коом өнүгүп, өзгөргөн сайын тилде да өнүгүү жүрүп турат."},{"t":"p","h":"Ондогон кылымдардын ичинде элдин турмушунда, коомдо көптөгөн өзгөрүүлөр болуп өтөт. Бир тилде же анын диалектилеринде сүйлөгөн эл ар түрдүү өзгөрүүлөрдүн натыйжасында дагы көптөгөн диалектилерге ажырап, же өз алдынча тилге айланып кетиши да мүмкүн. Арийне, алардын бири-биринен ар түрдүү деңгээлде айырмаланышы коомдун жана тилдин өнүгүп, өзгөрүү процессиндеги шарттарга байланыштуу. Бири-биринен канчалык деңгээлде алыстаганына карабастан, алардын түпкү теги бир болгондуктан, биз андай тилдерди тектеш тилдер дейбиз."},{"t":"p","h":"<span class=\"pg\" data-n=\"6\">6<\/span>Кыргыз тили өзүнүн түпкү келип чыгышы жагынан түрк тилдеринин тобуна кирет. Алар: алтай, азербайжан, башкыр, гагауз, казак, кара калпак, карачай, ногой, татар, тува, түрк (осмон түркү), түркмөн, өзбек, уйгур, хакас, чуваш, якут (саха) д. у. с."},{"t":"p","h":"Алардын тектештиги бул тилдердин тыбыштык түзүлүшү: морфологиялык курулушу, лексикалык кору, синтаксистик өзгөчөлүгү жана өнүгүп-өзгөрүү тарыхындагы жакындыктар менен белгиленет. Тектеш тилде алыскы жана жакынкы т е к те ш деп эки топко бөлүнөт."},{"t":"p","h":"Кыргыз тилине жакынкы тектеш тил катары алтай, казак, кара калпак, өзбек, уйгур, башкыр, татар, түркмөн ж. б. тилдер эсептелет. Булардын ичинен алтай тили айрыкча жакын. Алар төмөнкүдөй белгилерден даана байкалат."},{"t":"p","h":"1. Фонетикалык белгилер: а) эки тилде тең сегиз кыска үндүү (а, э, о, ө, у, ү, ы, и) учурайт; б) сингармонизмдин (үндөшүүнүн) кеңири өнүгүшү; в) созулмалардын колдонулушу (алтай тилинде – 8, кыргыз тилинде – 6, ы, и тыбыштарынын созулма түгөйү жоктугун эске алганда) дээрлик бирдей; г) кыргыз, алтай тилдеринде -ла, -лар мүчөсү бирдей вариантка ээ. Байыркы -лыг мүчө бул эки тилде -луу түрүнө өткөн."},{"t":"p","h":"2. Морфологиялык белгилер: а) -ыптыр, -лы, -лык мүчөлөрүнүн бул тилде бирдейлиги. М.: баралы, баралык, келели, келелик, жүрөлү, журелук. Башка тектеш тилдерде бул форма ар түрдүүчө кезигет. Алсак: казакча – барайык, келейик; өзбекче – барайлы, барайлик; уйгурча – барайли. 6) Ш жактын -т мучесунун окшоштугу."},{"t":"p","h":"3. Лексикалык белгилер: а) унгу сездердун басымдуу бөлүгүнүн тыбыштык комплекси жагынан бирдейлиги (М.: бөдөнө, томолок, унчук ж. 6.); б) кыргыз, алтай тилдеринде гана учураган сөздөр: таан, таар, шибеге, чуркура, кокуй, унчук ж. б."},{"t":"p","h":"<span class=\"pg\" data-n=\"7\">7<\/span>Ушул сыяктуу фактылар кыргыз тилине, башка түрк тилдерине караганда, алтай тили жакын экендигин көрсөтүп турат."},{"t":"p","h":"Алыскы текте ш тилдерге (монгол, манжур тилдери) байыркы теги жагынан бир, бирок азыркы учурда бири-биринен алыстаган, пикир алышууга мүмкүн болбой калган тилдер кирет. Алардын өз ара тектештигин байыркы түп уңгулардан, грамматикалык элементтердин жалпылыгынан жана тыбыштык түзүлүшүнүн жакындыгынан байкоого болот."},{"t":"p","h":"Мына ошол көптөгөн тилдердин арасында кыргыз тили – кыргыз элинин улуттук тили катары өнүгүп жатат. Кыргыз тилинде азыркы кезде газеталар, журналдар чыгып, радио уктуруулар, телекөрсөтүүлөр берилүүдө. Республикабыздын көпчүлүк жалпы билим берүүчү орто мектептеринде окуучулар кыргыз тилинде билим алышат."},{"t":"p","h":"Кыргыз тилинин өнүгүүсү, баюусу жана калыптануусу боюнча илимий иштер кеңири жайылтылып, анын адабий тилдик нормалары улам такталууда."},{"t":"p","h":"Кыргыз тили бүгүнкү күндө түрк тилдеринин ичинде жазмасы өнүккөн, адабий тилдин нормалары дээрлик такталган улуттук тил катары өнүгүүдө."},{"t":"p","h":"Байыркы мезгилде кыргыз элинин улуттук белгиге ээ болгон мектептери болгон эмес. Кат тааныгандары сейрек учуроочу. Октябрь революциясынын жеңишинен кийин тилибизге саясат, коомдук өнүгүш менен бирге орус тилинин таасири тийди. Орус тили аркылуу түшүнүктөрү менен атоолору кошо келди, элдин таанып-билүү мүмкүнчүлүгү кеңейди. Алгачкылардан болуп И. Арабаев, К. Тыныстановдордун окуу китептери эне тилибизде сабат ачууга түрткү берди. Бара-бара кыргыз адабий тили калыптануу жолуна түштү."},{"t":"p","h":"Коомдук өзгөрүү, өнүгүү менен бирдикте кыргыз тили да өзгөрүүгө, өнүгүүгө дуушар болуп отурат. Айрыкча, эгемендүүлүккө ээ болгондон бери элибиз <span class=\"pg\" data-n=\"8\">8<\/span>башка чет мамлекеттер менен соода, экономикалык жактан, саясий, маданий ж. б. карым-катышты түздөн-түз жүргүзө алгандыктан, чет тилдеринен көптөгөн сөздөр адабий тилибиздин неологизм катмарын байытууда: плеер, видео, аудио техникалар, гамбургер, чисбургер, скотч ж. б."},{"t":"p","h":"Азыркы күндө коомдук маалымат массалык каражаттарын тейлеген адабий тилибизде көп сандагы басылмалар, ар кандай телерадиоберүүлөр, окуу жайлары (орто жана жогорку), мамлекеттик иш кагаздары иш алып барууда."}],"sub":[],"pages":[5,8]},{"title":"§ 2. ҮНДҮҮ ЖАНА ҮНСҮЗ ТЫБЫШТАРДЫН БИР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"9\">9<\/span>ОКУУЧУЛАРДЫН 10-КЛАССТА АЛГАН БИЛИМДЕРИН ЭСКЕ САЛУУ ЖАНА БЫШЫКТОО"},{"t":"h3","h":"§ 2. ҮНДҮҮ ЖАНА ҮНСҮЗ ТЫБЫШТАРДЫН БИР"},{"t":"p","h":"СӨЗ ИЧИНДЕ АЛГА, АРТКА КАРАЙ ЭЭРЧИП"},{"t":"h3","h":"ҮНДӨШҮҮСҮ ЖАНА ӨЗГӨРҮҮСҮ"},{"t":"p","h":"Аларга кандай өзгөрүүлөрдү кошобуз? Үндөшүү дегенге кандай түшүнөбүз? Үндөшүүлөр жалаң эле үндүүлөр арасында болобу же үнсүздөр арасында да үндөшүп, окшошуп, ээрчишүүлөр барбы?"},{"t":"p","h":"Жогорку жооп берүү менен биз 10-класста өткөн темалардын ичинен үндүү жана үнсүз тыбыштардын бир сөз ичинде алга, артка карай ээрчип үндөшүүсүн дагы бир жолу эске салабыз. Алар, баарыдан мурда, үндөшүү (сингармонизм) мыйзамы менен түздөн-түз байланыштуу экенине дагы бир жолу ынанабыз. Үндүүлөрдүн бир сөз ичинде ээрчишүүсү көбүнчө акыркы үндүүгө же анын акыркы муунундагы үндүүгө карата ага уланган мүчөлөрдүн үндүү тыбышынын ээрчишүүсү аркылуу ишке ашарын биз мурда өткөнбүз. Алардын эрин күүсүнө жана тил күүсүнө карата ээрчишүүсү деп экиге бөлүнөөрүн да билебиз. Аларга байланыштырып көнүгүү иштеп көрөлү."},{"t":"p","h":"1. Төмөндө берилген текстти окуп, андагы үндүүлөрдүн ээрчишүүсүн көрсөткүлө да, алардын кайсылары тил күүсүнө, кайсылары эрин күүсүнө байланыштуу ээрчишкенин, кандай өзгөрүүлөргө учураганын же окшошуп кеткендигин айтып бергиле."},{"t":"h3","h":"БАШ КИЙИМ"},{"t":"p","h":"Саймалуу, шуру-мончоктуу кийимди кыз-келиндер кийишкен. Эркектин кийимин саймалаганды кийин <span class=\"pg\" data-n=\"10\">10<\/span>отузунчу жылдарда сырттан келген театр адистери баштады. Алар улуттук орнаменттер кандай эле деп элден, этнограф тарыхчылардан жыйналып баш кийим, бут кийим, сырт кийимдерди даярдашты. Азыр ошондой эле саймалуу калпактарды артист эмес жаштар да, карылар да кийип жүрүшөт. Эркектин сырт кийимдери да саймалуу болуп кетти. Эми театрда кийиле турган тебесу кек тиреген калпактар элге сатыла баштады."},{"t":"p","h":"Кунделук кийип журе турган баш кийим тыкан, жарашыктуу болушу зарыл. Кийимдердин түрүн, сырын чыгармачылык менен өркүндөтүүгө эч ким тыюу салбаш керек. Калпактын азыркы түрлөрүнөн Бакай калпак, кийиз калпак, жырык калпак, бийик калпак, жапыз калпак сыяктуу түрлөрүн көрөбүз. Ал кийиз калпак менен бирге кара калпак, жашыл калпак, кыргыз калпак ж. д. у. с. бар. Кыргыз калпактарынын формасы жалаң эле азыркыдай эмес, тегерек же арты гана түрүлүп, алды жагы түрүлбөгөн жана дагы ушу сыяктуу ар түрдүү болушуна эч ким мурунку заманда тыюу салган эмес."},{"t":"p","h":"Шырыма калпак кездемеден тигилет. Ал кара, кызыл, жашыл, көк ж. б. түстө болот. Албетте, шырыма калпактар кийиз калпактан кийин чыккан. Аны жигиттерге жана балдарга ылайыктап иштүү, уз аялдар тиккен. Мындай калпакты каалаган формага келтирип тиге берсе болот. Бирок жаңы изденүүлөр жана табылгаларда улуттук салт белгилери сакталыш керек."},{"t":"p","h":"Үндүүлөрдүн бир сөз ичинде алга, артка карай окшошуп өзгөрүүсү көбүнчө уңгуга же жалпы эле сөзгө мүчө уланганда ишке ашкандыгын тилдик далилдер көрсөтүп турат."},{"t":"p","h":"Ал эми үнсүздөрдүн бир сөз ичинде алга же артка карай окшошуп өзгөрүүсү да улануучу мүчөнүн алдындагы тыбыштарга байланыштуу экендигин биз мурдагы сабактарда окуганбыз. Андай өзгөрүүлөр көбүнчө мүчөнүн алдындагы тыбыштардын каткалаң <span class=\"pg\" data-n=\"11\">11<\/span>же жумшак экендигине (топ + нын топтун, жай+ нын жайдын), ошондой эле ң, з, ч, тыбыштары өзүнөн кийин келген айрым тыбыштардын таасиринде өзгөргөндүгүн билебиз. Анда ошол окшошууларды, өзгөрүүлөрдү бышыктоо үчүн көнүгүүлөрдү иштейли."},{"t":"p","h":"2. Мына бул сөздөргө ылайыктуу мүчөлөрдү улап, н, з, ч, к, п тыбыштарынын алга же артка карай өзгөрүүгө учураганын көрсөтүп бергиле."},{"t":"p","h":"М.: жээк жээги."},{"t":"p","h":"Күн, сын, чейин, жан, түшүн, качан; көн, кыйыктан, экен, жуун, ишен, эрин; каз, тоз, кыргыз, тамыз, эз; кач, көч, тынч, үч, ач, кылыч; топ, кеп, кабак, жээк."}],"sub":[{"title":"ҮНДӨШҮҮСҮ ЖАНА ӨЗГӨРҮҮСҮ","b":3},{"title":"БАШ КИЙИМ","b":7}],"section":"ОКУУЧУЛАРДЫН 10-КЛАССТА АЛГАН БИЛИМДЕРИН ЭСКЕ САЛУУ ЖАНА БЫШЫКТОО","pages":[9,11]},{"title":"§ 3. СӨЗДӨРДҮН КӨП МААНИЛҮҮЛҮГҮН ЖАНА","blocks":[{"t":"h3","h":"§ 3. СӨЗДӨРДҮН КӨП МААНИЛҮҮЛҮГҮН ЖАНА"},{"t":"p","h":"АНЫН ПАЙДА БОЛУУ ЖОЛДОРУН БЫШЫКТОО"},{"t":"h3","h":"ҮЧҮН СУРООЛОР:"},{"t":"v","l":["1. Полисемия дегенди кандай түшүнөсүңөр?","2. Көп маанилүүлүк кантип пайда болот?","Кол деген сөздүн маанилерин карап, алардын","ортосундагы карым-катышты аныктагыла:","Кол 1. Адамдын ийининен манжаларына","чейинки дене бөлүгү.","Адамдын каруу бөлүгү (колун булгап чакырды).","Беш манжаларынын бири (колун кесип алды).","Жазуу иши (колу жаман, кол койду ж. б.)","Кол 2. Аскер, солдат.","3. Көп маанилүү сөздөр кандай жолдор менен","пайда болот?","4. Метафора деген эмне, адабияттык метафорадан","эмне айырмасы бар?"]},{"t":"p","h":"5. Метонимия деген эмне, адабияттык метонимиядан эмне айырмасы бар?"},{"t":"p","h":"<span class=\"pg\" data-n=\"12\">12<\/span>6. Синекдоха деген эмне, адабияттык синекдохадан айырмасы барбы?"},{"t":"p","h":"Т. Полисемия менен көп маанилүүлүктүн айырмасы барбы, же экөө бир эле түшүнүкпү?"}],"sub":[{"title":"ҮЧҮН СУРООЛОР:","b":2}],"section":"ОКУУЧУЛАРДЫН 10-КЛАССТА АЛГАН БИЛИМДЕРИН ЭСКЕ САЛУУ ЖАНА БЫШЫКТОО","pages":[12,12]},{"title":"§ 4. ЦИТАТА ЖАНА ДИАЛОГ БОЮНЧА ЖАЛПЫ СУРООЛОР","blocks":[{"t":"h3","h":"§ 4. ЦИТАТА ЖАНА ДИАЛОГ БОЮНЧА ЖАЛПЫ СУРООЛОР"},{"t":"p","h":"Бул түшүнүктөр боюнча өзүңөрчө ой жүгүртүп, чечмелөөгө аракет жасагыла."},{"t":"p","h":"Цитата бөтөн сөз, анткени өз оюн бекемдөө үчүн бирөөнүн оюна шилтеме берет, кайрылат."},{"t":"p","h":"Цитата эки түрдүү ишке ашат: биринчиси, илимий адабияттардан же авторлордон, айтуучудан тикеден-тике, сөзмө-сөз кайталап көрсөтөт; экинчиси, өздөштүргөн түрүндө, б. а., алардын оюн өз сөзү менен аралаштыра пайдаланат."},{"t":"p","h":"Цитата колдонулуш өзгөчөлүгүнө карата тыныш белгилери менен коштолот."},{"t":"p","h":"Диалог адабий чыгармаларда тике сөз деп айтылат, бирок ал автордук кептен улам караганда бөтөн сөз болуп эсептелет. Анткени жазуучу тарабынан жазылып жаткан үн – өз сөзү, кейипкердин үнү – бөлөк сөз деп эсептелинет. Эмне үчүн?"},{"t":"p","h":"Оозеки кепте диалог өз кеп, же тике кеп деп аталат. Эмне үчүн?"},{"t":"p","h":"Диалогдун жазуу учурундагы белгиси кайсы? Диалог автордук кептин ичинен бөлүнүп, үзүлүп берилсе, ал кандайча белгиленер эле? Мисалдарды адабияттардан карап, өз оюңарды тактагыла."},{"t":"p","h":"Диалог менен цитатанын тыныш белгилеринин ортосундагы айырмачылыктарды, окшоштуктарды байкап, айтып бергиле."},{"t":"p","h":"<span class=\"pg\" data-n=\"13\">13<\/span>Адабий жазма тил менен оозеки кептин байланышы жана айырмасы боюнча Адабий тил жалпы диалектилер үчүн түшүнүктүү болгон, коомдук иш жүргүзүүгө, көркөм чыгарма жаратууга, иш кагаздарын мектептерде, окуу жайларында окуу процессин жүргүзүүгө ийкемдүү тил болуп саналат. Ошол эле учурда диалектилердин ортосунда адабий тил менен кескин айырмаланбаган өз ара байланышы бар."},{"t":"p","h":"Диалектилик сөздөргө силер буга чейин өткөндөй, атайын көркөм адабияттарды жаратууда, илимий изилдөө иштерин жүргүзүүдө көңүл бурулат. Кээде диалектизмдер адабий тилдин өнүгүшүнө булак катары кызмат аткарат."},{"t":"p","h":"Адабий тилдин өнүгүшүнө диалектилик сөздөр түшүнүктүн атын атоо катары кирип да, байытат. Шып, пахта, косек, иймек, бел боо ж. б. сөздөр адабий нормада кезикпеген түшүнүктүн атын туюндурат. Ошондуктан адабий тил менен диалектилердин аралыгы пикир алышуу куралы катары айырмаланбастан, өз ара байланышта болот."},{"t":"p","h":"Өзүңөр окуган китептердин материалдарын да карап көрсөңөр, айрым диалектилик сөздөр адабий нормага айлангандыгын байкайсыңар."}],"sub":[],"section":"ОКУУЧУЛАРДЫН 10-КЛАССТА АЛГАН БИЛИМДЕРИН ЭСКЕ САЛУУ ЖАНА БЫШЫКТОО","pages":[13,13]},{"title":"§ 5. У – Х КЛАССТАРДА БАЙЛАНЫШТУУ КЕП","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"14\">14<\/span>БАЙЛАНЫШТУУ КЕП"},{"t":"h3","h":"§ 5. У – Х КЛАССТАРДА БАЙЛАНЫШТУУ КЕП"},{"t":"p","h":"БОЮНЧА ӨТҮЛГӨН МАТЕРИАЛДАРДЫ СИСТЕМА-"},{"t":"h3","h":"ЛАШТЫРУУ ЖАНА ЖАЛПЫЛАШТЫРУУ"},{"t":"p","h":"Текст – коомдук кызмат аткаруучу стилдин тигил же бул түрүндө жазылган, башы жана аягы бир бүтүндүктү түзүп турган, коммуникациялык кызмат аткарган жумуру продукт. Көркөм, публицистикалык, окуу илимий иш кагаздарынын тексти болбосун, логикалык жактан бүткөн бир ойду билдирүү менен бирге сүйлөмдөр ич ара байланышта болуп, көлөмдү пайда кылат. Демек, текст азбы, чоңбу көлөмгө көз каранды, белгилүү бир теманын чагылдырылышы, анын негизи."},{"t":"p","h":"Текст ичинен майда бөлүктөргө бөлүнөт, 6. а., иш кагаздарын албаганда, түзүлүшү боюнча маанилик бир бүтүндүккө ээ болуп турган бөлүкчөлөрдөн турат. Ар бир бөлүкчө өзүнчө маанилүүлүккө ээ болуу аркылуу өзүнөн чоңураак маңыздуу ойду пайда кылат. Андай маңыздуу ойлордун жыйынтыгы тексттин мазмунун түзөт. Мисалга, көркөм тексттеги адам маанайы жаратылыштык кубулуш, көрүнүш менен байланышта бериле турган болсо, маанайдын берилиши бир бүтүндүк маани, жаратылыштык кубулуштун берилиши өзүнчө бир маани, көрүнүштүн берилиши өзүнчө дагы бир маанини түзөт. Бирок алар ошол тексттин бир тутумдаш бөлүгүн түзүп турган абалында бир нече маанилерден чогулган адам маанайын билдирүүчү чакан маңыз болуп саналат. Көркөм тексттин түзүлүшү жалаң эле маанайдан турбайт, окуяны берүү үчүн адам баласынын реалдуу чындыкка <span class=\"pg\" data-n=\"15\">15<\/span>болгон жеке же жалпы мамилеси окуяны түзөт. Аны чечүү ыкмасы да ар кандай. Окуяны берүү үчүн да автор жогоруда айтылгандай, маанилик бөлүктөрдөн түзөт. Ошентип, текст ичиндеги маанилер тексттин чакан логикалык бөлүкчөлөрүнөн, маани, маңыз, мазмун деген текст түзүүчү категориялар келип чыгат."},{"t":"p","h":"Маани – текст ичиндеги логикалык бир бүткөн ойду туюндурган чакан ой. Ал бир абзацта чагылдырылышы мүмкүн. Чакан темачага ээ болушу да күтүлөт. Демек, сөз мааниси бизди курчап турган чөйрөнүн атынан улам келип чыкса, тексттин ичиндеги маани, ой жыйынтыктуу бир бүтүндүктү туюндурган сүйлөмдөн же сүйлөмдөрдүн жыйындысынан турат. Бул – тексттин маанилүү бөлүгү."},{"t":"p","h":"Маңыз көлөмү боюнча мааниден кенен, б. а., маанилердин чогундусунан турат да, бир темага жооп боло турган окуялык билдирүүдөн, же баяндоодон, же жаратылыштык сүрөттөөдөн улам келип чыгат. Ал бир канча абзацтарды ичине камтуу менен тексттин тутумдуу бир чоң бөлүгүн түзөт. Маңыз микротекст (же минитекст) деп аталып, ар бир маңыздык бөлүк чакан темачаны түзөт, андай маңыздардын жалпы түзүлүшү мазмунду пайда кылат."},{"t":"p","h":"Мазмун тиешелүү темага арналган, окуялык-композициялык түзүлүшкө ээ болгон, маңыздардын интегралдык жайланышынан турган чыгарма болуп эсептелет."},{"t":"p","h":"Тексттин түзүлүшү үчүн өбөлгө болгон маалыматтык булак бизге чейинки белгилүүбү, же белгисизби, кандайдыр бир маалыматтарды берүү кызматын аткарат. Маселен, Республиканын Президентинин Швейцарияга барышы бизге белгилүү маалымат болсо, бара жаткан учурунда анын визитинин максаты белгисиз маалымат эле. Айрым бир келишимдерге кол койгондугун массалык маалымат каражаттары билдиргенинен улам, белгилүүлүккө айланды. Ошентип, маалымат – текст түзүүчү дагы бир категория."},{"t":"p","h":"<span class=\"pg\" data-n=\"16\">16<\/span>Маалыматтын мүнөзүнө жараша тексттин стилдик түрлөрү түзүлөт. Айталы, кайсы бир адамдын иштеген жери жөнүндө маалымат бериш керек болсо, коомдук максатына жараша расмий эмес иш кагаздары түзүлүп (мис.: мүнөздөмө, маалымат кат), иш кагаздарынын тексти пайда болот. Ал адам жөнүндө портреттик макала, очерк жаралуу менен публицистикалык текст, көркөм каарман түзүлсө, көркөм текст жаралат. Ошол эле сыяктуу илимий текст пайда болот. Ошентип, тексттин стилдик бир нече түрү келип чыгат."},{"t":"p","h":"Тексттеги окуялардын, кубулуштардын ж. б. берилиши автор тарабынан ойлонуп, ылайык деп табылган ырааттуулукта ишке ашып жайланышат. Чакан тексттерде белгилүү башталыштан аягына чейинки улануу бир кылкалыкта аткарылса, бул проспекциялык ык менен жайланышуу деп аталат. Ал эми көркөм тексттерде андай башталыштан аягына чейин ырааттуу жайланышуу боло бербейт. Эске салуу, башынан кайра түшүү ыкмасы менен окуяны артка кайруу ыкмасы көркөм чыгарманын чегинде боло берүүчү атайын усул катары колдонулат. Мындай артка кайрылуу – ретроспекциялык жайланыш."},{"t":"p","h":"Тексттин түзүлүшүндө кеп каражаттарынын түрлөрү бир эле текстте ар кандай максатта колдонулушу мүмкүн. Монологдук баяндоо текстти тынч окуялык билдирүү, автордун ага карата болгон жеке мамилеси, көз карашы болуп эсептелет. Мындан тышкары диалогдук кептин колдонулушу тексттеги кырдаал (жагдай) түзүүчү каражат катары пайдаланылат."},{"t":"p","h":"Диалог бир жагынан кырдаал түзүүчү ыкма болсо, экинчиден, тексттеги тынчтыктан кыймыл-аракетке өткөрүүчү, үчүнчүдөн, бир үндүүлүктөн бир канча үндүүлүккө алмаштыруучу, кейипкерлерди аралаштыруучу, мүнөзүн, кыялын ачып берүүчү каражат болуп кызмат кылат. Мындай ыкма көркөм текстте композициялык түзүлүштү алып келет."},{"t":"p","h":"<span class=\"pg\" data-n=\"17\">17<\/span>Диалог окуяны чагылдыруучу каражат эмес, ал автордун ыкмасына карата кейипкерлерди окуяга аралаштыруучу жагдайды гана берет. Окуя автордук баяндоодо, окуянын чечилиши да автордук ой жүгүртүүдө чагылдырылат."},{"t":"p","h":"Текст ичинде ар бир маани берүүчү (түзүүчү) чакан бөлүктөрдө маани топтоочу сөз каражаттары топтолот (мисалы, сингармонизм жөнүндө жазыла турган болсо)."},{"t":"p","h":"Сингармонизм – бир сөздөгү үндүү жана үнсүз тыбыштардын айтылышы, угулушу боюнча бир өңчөй фонетикалык ыргакка ээ болгон тилдик норма. Бул нормага баш ийген үндүүлөр бүтүндөй тил арты (жоон) же бүтүндөй тил алды (ичке) үндүүлөр болот да, ага ылайыктуу үнсүздөр түпчүл же таңдайлашып айтылышы бардык түрк тилдеринде, негизинен, бирдей болсо, эрин күүсү боюнча кыргыз тили бардык түрк тилдеринен айырмаланып турат. Сөздүн курамында эриндүү үндүүлөр болсо, ага ылайык үнсүздөр да эринчил мүнөзгө ээ болот. (Ахматов Т. К., Мукамбаев Ж., Азыркы кыргыз тили. Фрунзе, 1978, 44-б.)"},{"t":"p","h":"Бул жердеги маани топтоочу негизги сөздөр: сингармонизм, ундуц, унсуз, айтылыш, угулуш, фонетикалык ыргак, тилдик норма, тил алды, тил арты, түпчүл, таңдайлашуу, турк тилдери, эрин куусу, айырмалануу, ылайык, кыргыз тили. Ушул негизги сөздөрдүн айланасында сүйлөм түзүлүп, сингармонизм жөнүндө маанилүү ой айтылып жатат. Мындай каражаттарды маани топтоочу семантикалык лексемалар деп атайбыз."},{"t":"p","h":"Көркөм тексттерде мындай активдүү семантикалык лексемалар ар түрдүү болот, б. а., синонимдердин, өтмө маанилүү сөздөрдүн, фразеологизмдердин колдонулушу көркөмдүк үчүн тандалып алынса, антонимдер ажыратуу же бириктирүү, анализдөө же синтездөө, салыштыруу максатында пайдаланылат."},{"t":"p","h":"Тексттин структуралык түзүлүшү баяндоодон (автордук же кейипкердик), сүрөттөөдөн (жара-"},{"t":"h3","h":"ОШ Ан /ПИЙВЕРСИТЕТИ 17 ХИТЕЙХАНА"},{"t":"p","h":"<span class=\"pg\" data-n=\"18\">18<\/span>тылыштык, кубулуштук, жагдайлык, интерьердик (үй ичин, адамдын тышкы келбетин жана мүнөзүн ж. б.), автордук же кейипкердик ой жүгүртүүдөн, б. а., кайсы бир маселени чечүүгө карата болгон мамиледен турат. Көркөм стилдин ичинен драмалык жанрда гана бул сыяктуу структуралык түзүлүш башкача чечилет."},{"t":"p","h":"Драмалык текст сахна үчүн ылайыкталып жазылгандыктан, актерлордун алып чыгуусуна арналат, көрүүчү менен түздөн-түз катышта болгондугуна байланыштуу баяндоо жана сүрөттөө каармандардын кыймыл-аракети, декорациялык жасалгалары менен чечилет. Ошондуктан, ал жанрда ремарка (автор тарабынан кыймыл-аракетке, жасалгага багыт берүүчү кеби: сахнадан тоо, андан бери айыл, анын четиндеги бак арасындагы үйдүн короосу көрүнүп турат; эшиктен шашып жаш кыз кирип келет; колунда бир букет гүлү бар; байбиче ордунан тура жөнөйт ж. б.). Бул жанрда диалог кеби активдүү болот да, автордук ой жүгүртүү кейипкердин ички жана тышкы монологу аркылуу ишке ашат."},{"t":"p","h":"3. Теменку тексттерди окуп чыгып, кыргыз элинин оозеки мурастарынан өзүңөр билгендерден, ата-энеңерден сураштырып, жыйынтыктап чакан текст түзгүлө. Аны класста талкуулап, жанрдык стилин аныктагыла, тарбиялык маанисин түшүндүргүлө. (Булар 3. Бектеновдун «Эне тилден гүлдесте», «Мектеп», 1989, китебинен алынды.) 1. Баланын эң биринчи жакын кишиси – эне. Ак ороого ороп, ак мамасын берип жатып:"},{"t":"v","l":["Айланайын, ай сары,","Жабыгымдын жапсары,","Жапкан нандын ортосу,","Жүрөгүмдүн толтосу.","Аппак бөпөм, ыйлаба,","Ата-энеңди кыйнаба.","Уктай койчу, бөбөгүм! —","деп, бешик ырын ырдап уктатат.","<span class=\"pg\" data-n=\"19\">19<\/span>Көкөтөйдөй сөз тапкан","Чечен болор бекенсиң?","Көпкө чейин баспаган","Бечел болор бекенсиң?","Сал билек, сал билек,","Сары майга мал билек!","Кунан койду сой билек,","Куйругуна той билек! —","деп эркелетет атасы."]},{"t":"p","h":"П. Жылкы, кой, уй, төө, чычкан, ит, доңуз, улуу, барс, коён, мечин, жылан – баары чогулуп алып: «Жыл башы мен болом» – деп, ар кимиси өз жүйөсүн айтып талашыптыр."},{"t":"p","h":"Чычкан байкуштун айтарга жүйөсү жок, куулук менен ойлоно баштаптыр: «Мындай талашуудан эч пайда чыкпайт. Андан көрө баарыбыз жылдын келишин карап туралык. Кимибиз жылды биринчи көрсөк, ошонубуз жыл башы дептир."},{"t":"p","h":"Төөнүн бою бийик болгондуктан, чычкандын сөзүн кубаттаптыр. Ошентип, жылдын келишин баары жарданып карап турганда, чычкан төөнүн өркөчүнө чыгып алып, келе жаткан жылды баарыдан мурда көрүптүр да, жыл башы болуп алыптыр. Боюна ишенип алып, төө жылдан куру жалак калыптыр."},{"t":"p","h":"Жылдын аттары: чычкан, уй, жолборс, коён, балык, жылан, жылкы, кой, маймыл, тоок, ит, доңуз."},{"t":"p","h":"Мына ушуга байланыштуу адамдын мүчөл жылдарын эсептейт. Адам он экиге толуп, он үчкө кадам койгондо – бир мүчөлү, жыйырма төрткө толуп, жыйырма бешке аяк шилтегенде – эки мүчөлү, отуз алтыга толуп, отуз жетиге аяк шилтегенде – үч мүчөлү... болот."},{"t":"p","h":"Кыргыздардын түшүнүгү боюнча, адам ушул мүчөл жылдарында ооруп калышы мүмкүн деп ойлошуп, мүчөл жылдарында мал союп, түлөө өткөрүшкөн."},{"t":"p","h":"Кыргыздын мына ушул салты өтө туура. Адамдын туулган күнүн жыл сайын белгилеп, убара болуунун кажети жок."},{"t":"p","h":"<span class=\"pg\" data-n=\"20\">20<\/span>Ш. Адамдын беш манжасы үч түрдүү аталат:"},{"t":"raw","h":"<h4 class=\"mk\">1. 2. 3.<\/h4>"},{"t":"v","l":["Бармак, сөөмөй, ортон, аты жок, чыпалак.","Баш бармак,","Баделеки сүйрү баш.","Ортон эки чакилик,","Ою башы солтоной,","Кичинекей мөнтөнөй.","Баш бармак,","Бадал журек,","Ортон оймок,","Оюу чиймек,","Чыйп-чыйп чыпалак."]},{"t":"p","h":"ГУ. – Жүргүн, буудай, алтын чыккан жерге барып өсөлү,— деди арпа."},{"t":"p","h":"– Мурутуң узун болгону менен акылың кыска экен, арпам! Биз эмне үчүн алтынды издеп барабыз? Алтын бизге өзү келет! – деди буудай."},{"t":"p","h":"Илгери бир ачарчылыкта кичинекей жерге эгин айдаган бир кедей ачкачылыкка учурабай аман калып, алтын, күмүшү көп бай ачкадан өлүп бара жатып:"},{"t":"p","h":"– Арпа, буудай – аш экен, алтын, күмүш – таш экен! – деп көз жумган экен."},{"t":"p","h":"4. Төмөнкү тексттик үзүндүдө белгиленгендей, үч маани, бир маңыз бар (маани алынып турат). Андагы маани түзүүчү активдүү лексемаларды бөлүп, көркөм сөз каражаттарын тапкыла. Диалог менен монологду өз ара байланыштырган каражаттарын белгилегиле. Монологдун ички жана тышкы түрүн: ой толгообу, ой жүгүртүүбү айтып бергиле. Стилдик жанрын айткыла."},{"t":"p","h":"– Ата, нике деген эмне?"},{"t":"p","h":"– Нике деген нике,— деди атам,- киши аял алганда нике кыйылат. Экее чогуу жашасын, урушуп-талашпай ынтымактуу өмүр сүрүшсүн деп кыйылат. Бири-биринен айнып кетишпесин дейт. Эми бири-бирин таштабашы керек, таштаса күнөө болот..."},{"t":"p","h":"– Ата, абышка да аял алабы?"},{"t":"p","h":"Мен атамдын артынан келатып, Кудайберди атанын ыйлаганын эстедим. Эмне экенин билбейм, чу дегенде <span class=\"pg\" data-n=\"21\">21<\/span>эле эсиме ушул келди. Бир күнү биз эшиктин алдында ойноп олтурсак, ылдый жактан чуу чыгып калды. Алда катыгүн ай-ээ, үзүлгөн экен ээ! – деди да, апам жүгүргөн бойдон кетти. Артынан биз да чымын-куюн болуп жөнөдүк. Барсак, Кудайберди ата өкүрүп-бакырып ыйлап жатыптыр. Сакалынан жаш куюлуп, таягы менен жер сабап жатат... Мен чоң кишилер ыйлабайт го деп ойлочумун. Кудайберди атаны көргөндө коркуп кеттим. Адам, чопчоң адам да ыйлайбы, ата? – деп сурадым атамдан кийин. «Адамдан ажыроо кыйын, балам»,— деген атам. Кишинин бул дүйнөдө өлгөнү жамандын жаманы экендигин мен ошондо биринчи билдим. Чоң кишилер, атүгүл, абышка-кемпирлер да, көздөрүнөн жаш чубуртуп боздоп ыйлаарын мен ошондо биринчи жолу билдим... Ошол Кудайберди ата бүгүн күнөөлүү адамдай жер карап, бир кара кемпирдин жанында отурат."},{"t":"p","h":"...Беш-алты жыл өтпөй, Кудайберди атанын дагы эле баягысындай өкүрүп-бакырып боздогонуна күбө болдум. Бир күнү мектептен келсем, апам: «Алда кокуй күн ай, акемдин шору каткан тура!» – деп ыйлап отуруптур. Сөөгүн жашырганда мен да бардым. Сөөк койгондо атам көбүнчө мени жанына ээрчитип алчу. Мен да чоңдор менен чогуу топурак салчумун. Топурак!.. «Ченебеген киши эле»,— деди атам үшкүрүп, – эми Кукеме кыйын болуп калды». Таап айткан окшойт, жыл айланбай, Кудайберди атаны да ээсине бердик, ал азыр кемпирлеринин катарында жатат. (Б. Усубалиев)"},{"t":"h3","h":"Байкадыңарбы?"},{"t":"p","h":"Диалог жалаң гана кейипкердин өзүнүн сөзү, ал эми: деди атам, деди да, деп сурадым, деген деп ыйлап отуруптур, деди атам ушкуриуп деген автордук кептер негизги окуя түзүүчү каражат болду."},{"t":"p","h":"Бул жерде кептин баяндоо түрү апасынын кыймыл-аракетин, Кудайберди атанын кейип, ыйлап, боздогонун образдуу-эмоционалдуу сөздөр менен сүрөттөөгөн кептин сүрөттөн түрү «Адамдан ажыроо <span class=\"pg\" data-n=\"22\">22<\/span>кыйын...»; Кишинин бул дүйнөдө өлгөнү жамандын жаманы; ченебеген киши эле сыяктуу кептин ой жүгүртүү түрү жана жыйынтык чыгаруу бар."},{"t":"p","h":"Тышкы монолог текстке түздөн-түз катыша тургандыгын, ички монолог айтуучунун сыртына чыкпай ойлогон ою боюнча кала бергендигин байкадыңарбы?"},{"t":"p","h":"5. Тексттеги көркөм каражаттарды бөлүп, анын ордуна түз маанидеги синонимдерин коюп көргүлө. Көркөм стилдин жанрына туура келеби, ыр касиетин сактайбы, айтып бергиле. Поэ-"},{"t":"v","l":["тикалык ыр саптары сүрөттөөбү, кубулушту берүүбү, окуясы","түшүндүргүлө. Маани топтоочу сөздөрдү тапкыла.","Агарып нурдуу атты таң,","Ар бир жанда шаттуу таң.","Музыкадай зуулатып,","Молдо торгой чалды аң.","Коргошундай көйкөлүп,","Терметилди жыргап жан.","Эркеленип жел аргы","Чөптүн башын ыргаган.","Тунук булак шылдырайт,","Сырын айтып жылгадан.","Буруксуган атыр жыт,","Тегеректи чулгаган.","Таңшыган бакта булбулу","Бир басылып, тынбаган.","Бак-дарактар шуулдап,","Таң күүсүнө ырдаган.","Тур деп кабар бергенсип,","Добуш чыгат турнадан.","Кош айтышып түн менен","Көлдө бака чардаган.","Таарынып таңда басылган,","Түн ырчысы бабырган.","Мемиреген табият,","Эрте туруп эмгекчи,","Иш кылууга камынган.","(К. Тыныстанов)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"23\">23<\/span>6. Төмөнкү текстти окуп чыгып, белгиленген сөздөрдү сөздүн маанилеринин бөлүнүшүнө карата (түз жана өтмө) ажыраткыла."},{"t":"p","h":"Сүт – бул алмаштыргыс тамак. Маалыматтарга караганда нечен кылымдардан бери якут, казак, кыргыз, кыпчак жана башка элдер жер которуп, көчүп жүрүшкөн. Алар сүттөн быштак, айран, эжигей, курут, сүзмө, кымыз жана башка тамак-аштарды даярдашып, азыктанып келишкен. Сүт – кичинекей наристеден тартып, чоң кишиге чейин, алардын алмаштыргыс тамагы."},{"t":"p","h":"Академик И. П. Павлов сүт тамак продуктуларын пайдалануудагы өзгөчөлүктөрүн артыкча белгилеп кеткен. Биринчиден, анын жеңил сиңимдүүлүгүн, экинчиден, тамак-аш сиңирүүчү дене бөлүктөрүнүн иштешин жөнгө салып, бир калыпта алып жүрүүсү менен айырмаланарын белгилеген. Сүттөн даярдалган азык-заттардын сиңимдүүлүгү 95-98 пайызга жетет. Андай касиет башка тамак-ашта болбойт. Мисалы, тамак ичердин алдында же ичип жатканда, аз гана өлчөмдө сүт ичип койсо, тамак сиңирүүчү бездердин иштеши күчөйт. Сүт адамдын табитин ачат. «Аш жебей туруп, анын сиңээрин ойло» дегендей, тамактын сиңимдүүлүгүнө көңүл буруу зарыл."},{"t":"p","h":"Жалпысынан алганда, сүттө орто эсеп менен 13 пайызга жакын кургак зат жана 100дөн ашуун ар түрдүү заттар бар. Сүттүн эң маанилүү тутумдук бөлүгү каймак, камкаймак болуп эсептелет. Сүттө белоктордон тышкары, анын майы адамга пайдалуу. Бардык эле малдын сүтүнүн майлуулугу бирдей эмес. Алсак, койдун сүтүндө – 5—6, буйволдукунда – 7-8, төөнүкүндө – 4—7, бээникинде – 5-7, бугунукунда – 22,5 пайызга чейин май болот."},{"t":"p","h":"Т7. Төмөнкү үч теманын бирөөнө дилбаян жазгыла. Керектүү адабияттардан пайдалангыла. Оюңардын өз ара байланышына, ыраатына көңүл бургула: 1. «Жамийладагы» Садык менен Сейиттин ортосундагы конфликттин берилиши, андагы диалогдун текст түзүүчү мүмкүнчүлүгү. 2. «Жээренче чечен», <span class=\"pg\" data-n=\"24\">24<\/span>«Акыл Карачач» жомогундагы кыргыздын чечендик кепке, улуттук көркөм сөзгө баа берүү кудурети. 3. Жаратылышты коргоо – бүгүнкү күндүн милдети."},{"t":"p","h":"Тексттеги баяндоону, сүрөттөөнү, ой жүгүртүүнү ажыраткыла."},{"t":"p","h":"Илгери Жаныбек хандын тушунда, Асан кайгы аттуу боорукер адам жашаган дешет. Ал абдан боорукердиги менен эл оозунда ылакап катары: «Бул бир Асан кайгы», «Асан кайгы болуп калганбы?»"},{"t":"p","h":"– деп айтылып калган. Ал адам жер үстүндөгү тирүү жандыктардын бардыгын аяп, ал тургай басып алып, кумурска, курттарды өлтүрдүм го деп кейүүчү экен."},{"t":"p","h":"Жер түбүндөгү ийининен кара чаар жылан күн табын өзүнө сиңиргени, бир чети, кабышкан курсагына чымын-чиркей күсөп, караңгылыктан жарык жакка – жер үстүнө чыкты. Жыты буруксуп турган гүлдүү чөптөрдү аралап, такырайган ачыкка чыгып, башын коомай көтөрүп, туш-тарабына көз агытты. Ушул жыландарга эле кыйын. Соймоңдоп жер астынан араң чыкса, бу жактарда да бейкапар боло албайт. Душманы көп. Шыбырттаган добуштан качып, дүбүрт тыңшаганы тыңшаган. Бу жолу тобокелге салып, ийрелеңдеген узун денесин жыйрып, тоголонуп, күндүн аптабына денеси эрип, өзүн ага тосуп, көшүлүп баратты..."},{"t":"p","h":"Бир убакта коркунучтуу добуш жакындап калганын сезип, узун денесин чубап, чөп ичин көздөй шашып калды. Дүпүрөгөн көп добуш жакындагандан жакындап, калдайган бир кара нерсе такырайган жолдон чыгара койбой белден басып өттү. Кийинкиси куду башын туштап келип, анан жылан жыйрыла берерде, баягы баскан жердин жогорураагын кырча койду. Заары чыккан жылан тилин соймоңдотуп, тиштөөгө үлгүрбөдү. Жанталашып, көзү тумандап, денеси эки жерден бөлүнүп, же калып калбай илээшип, эптеп жан далбаска түшүп, өлгүсү келбей, жарааты ооруп сыздатып, жаны жер тартып баратты..."},{"t":"p","h":"Ошол мезгилде тоонун боорунда жол менен кыңылдап ырдаган Асан кайгы:"},{"t":"v","l":["<span class=\"pg\" data-n=\"25\">25<\/span>Казы кертип, жал чайнап,","Хандар өтөт дүйнөдөн.","Кара жарма жалмалап,","Биз да өтөбүз дүйнөдөн.","Суу кадырын ким билсин,","Суусап келип канбаса.","Ат кадырын ким билсин,","Ашуу ашып көрбөсө.","Жер кадырын ким билсин,","Көчүп-конуп көнбөсө.","Эр кадырын ким билсин,","Жоого түшүп көрбөсө,—"]},{"t":"p","h":"деп келе жатып, бут алдында алсырап жаткан жыланды тебелеп ала жаздады."},{"t":"p","h":"– Ой, жыланым, эмне болгонсуң? – Ал чөгөлөп отура калды. – Не болгонсуң? Атаа-а, Жаныбектин жигиттери болбой кал. Белиңди мертинтип, далыңдан оё баскан турбайбы? Ушул Кудай Тааланын өзү менен өзү болуп жүргөн макулуктарынын жазыгы не эле? «Мейли эми. Жамап берем... Кел, калтама туш...» (Мурас.)"},{"t":"p","h":"Мына бул Асан кайгынын жыланды аяган бир гана жерин көрүп турабыз. Ал адам жаратылыштагы бардык нерсе адам тарабынан аялуу болуш керек. Эч нерсе зыянга учурабаш керек деген аяр сезими менен жашап өткөн дешет. Дайым көтөрө жүрүүчү кабына жарадар жаныбарларды дарылаганын дарылап, дарылабаганын салып алып, үйүнө ала келип айыктырып, аяктантып коё берчү экен. Тоо-таштарды аралай жүрүп, сынып калган арчанын, бадалдын бутактарын кайра ордуна келтире таңып, калыбына келтирчү дешет."},{"t":"p","h":"Акыры Жаныбектин жигиттери аңчылыктан жолу болбой, Асан кайгыны кармап келип, колу-бутун кайрып, кыйноого алганда да кейибестен мындай деген экен:"},{"t":"p","h":"– Ыракмат, хан. Бу дүйнөдө кумурсканы тебелеп кетсем, куртту билбей басып өткөн болсом, ошол күнөөм үчүн сиздин кыйнооңуз менен жанып кетээр."},{"t":"p","h":"<span class=\"pg\" data-n=\"26\">26<\/span>Кумурска деген алсыз. Бутка туш келсе, тебелеп кете-"},{"t":"v","l":["сиң. Ыракмат, ханым, айыбымды жуудум.","Бирок элде:","«Жатарына жайы жок,","Көрөрүнө көзү жок,","Чымын байкуш кантти экен?","Таразасын көтөрүп,","Тарбаңдаган шор тумшук,","Таш бака байкуш кантти экен?","Боору жерге жармашкан,","Баса албаган балчыктан","Бака байкуш кантти экен?","Куйругу жок, жалы жок,","Кулан байкуш кантти экен?","Боорунда буту жок,","Жылан байкуш кантти экен?","Оргон, жыйган чөбү жок,","Эчтемеге эби жок,","Доңуз байкуш кантти экен?","Кирерге эшиги жок,","Корголоорго тешиги жок,","Коңуз байкуш кантти экен?","Ээси жок багарга,","Элик байкуш кантти экен?","Жерге, сууга батпаган","Жейрен байкуш кантти экен?» —","","деген ыры калды.","Асан кайгы бабабыз жөнүндөгү адабияттарды,"]},{"t":"p","h":"анын ырларын окуп отуруп, азыркы адамдардын, биздин замандаштарыбыздын боорукерлиги, акылмандыгы кайда кеткен дегим келет. Чын эле бизди курчаган табият, жаратылыш, макулуктар ким үчүн? Эгерде алар адам үчүн, анын акыл-туюусу менен пайдалануу-"},{"t":"v","l":["га татыбаса, биз баалабасак, анан ким баалайт?","8. Текстти окуп чыгып, сүрөттөө менен баяндоонун чегин","ажыраткыла. Ар бир сүйлөмдүн ортосун байланыштыруучу","сөздөрдү тапкыла, көркөм каражаттарын белгилегиле."]},{"t":"p","h":"<span class=\"pg\" data-n=\"27\">27<\/span>Курманжанды кош ак боз ат чегилген үлпүнчөктүү араба ичинен колтугунан Повало-Шыйковский төрө өзү сүйөп, жерге түштү. Элдин шыбыры шыбакты шыбыраткан майда желдей желнине жүрүп барып, кайра дымый калды. Курманжан кадимки ак паашанын Ташкенге койгон санжыргалуу төрөлөрүнүн кабыл алуусуна келген сыяктуу башында ак илеки, жакасынан бүт өңүрүн тегерете кундуз кармаган кызыл кымкап тон кийип келди. Сылыктык үчүн төрөгө ооз учунан ыракмат билдирип, ошончо көпчүлүккө өйдө карап бир тиктебей, жарыла салам айткан элге үнсүз баш ийкей баягы жупуну, саал эңкейе баскан сөөлөтүндө жай өттү. Дардын тушуна бет маңдайына эшик-төрдөй жерге катар секи коюлган экен. Дайыма төргө өтүп келген көнүмүшүнөнбү, же төрөгө атайын дымак көрсөткөнүбү, ортодогу чоң орунга келип отурду."},{"t":"p","h":"«Айымдын дагы эле бир билгени бар окшойт? Ак тилегинин белгиси кылып, ак боз ат чегилген араба менен келди го? Көңүлү да тынч окшойт. Кабатыр кейпи көрүнбөйт. Же төрө көзүнө мүңкүрөбөйүн, сыр алдырбайын дегениби?..» – деп турушту кай бири ичинен. (Т. Касымбеков)"},{"t":"p","h":"9. Тексттеги кептин түрүн ажыраткыла (баяндообу, сүрөттөөбү, ой жүгүртүүбү). Абзацтардын ортосундагы байланыштарды белгилегиле."},{"t":"p","h":"«Ким билбейт, жайдын толгон кезиндеги август түндөрүн! Асмандагы жылдыздар алыс турганы менен ар бири өңүнө чыгып, алаканга салгандай, ар бири өзүнчө нур төгүп, чет-четинен бүлбүлдөгөн күмүш кыроо чалып, асмандын тигил капталы бул капталына чейин жайнап, кири жок жадырап карашат."},{"t":"p","h":"Жылдыздар ушинтип толгондо, биз капчыгай аралап келе жатканбыз. Аттар салкындап, үйдү көздөй көңүлдүү жортууда. Араба кычыр-кучур дүңгүрөп, ташка тийген такалардан учкун чагылат. Капчыгайга сырттан келе берген сыдырым талаанын алда кайсы жеринен бүрдөгөн эрмендин кермек-ачуу чаңын учуруп, <span class=\"pg\" data-n=\"28\">28<\/span>аңызда шамалдап жаткан самандын билинер-билинбес коңур жытын лепилдетип, жол катары шыраалжын буруксуп, ушунун баары жерге жибиген анын жытына аралашып, адамды эңги-деңги мас кылгансыйт. Жел үстүнө үңүлгөн аскалар кыйгач көлөкө таштап, нары сайдагы бадалдын арасында Күркүрөө жаны тынбай алдастайт. Тээ артта калган темир жолдо поезддер көпүрөдөн нары өтүп, бери өткөн сайын жаңырык ээрчитип, гудокторду алыска-алыска созолонтот». (Ч. Айтматов) 10. Тексттеги кеп түзүлүшүн түшүндүргүлө. Диалог менен монологдун, ой жүгүртүүнүн ортосундагы байланыштарды аныктагыла."},{"t":"p","h":"...Бир күнү үйдө отуруп, мектептин дубал газетасы үчүн сүрөт тартып жатат элем, апам да мештин жанында от жагып отурган. Бир убакта эшик шарт ачылып, үйгө купкуу болуп сурданган Садык акем кирип келди. Ал мени көздөй жулкунуп басканда, желбегей жамынган шинели учуп түштү."},{"t":"p","h":"– Муну ким тарткан? – деп, ал чоң барак кагазды бетиме сунду. Кагаздагы сүрөттү көргөндө үрөйүм учту. Бул менин баягы кырманда Данияр менен Жамийланы калем менен тарткан сүрөтүм экен. Алар мени ушул учурда тике карашкандай болушту. Ай, Жамийла ай, муну кантип таштап кетти экен? Үйдүн бир жерине бекитип коюп, ошо бойдон унутуп калган го!.."},{"t":"v","l":["– Мен тарткан элем! – дедим.","– Булчу, бул ким өзү?","– Данияр!"]},{"t":"p","h":"– Бузуксун сен! – деп калчылдаган Садык акем сүрөттү майда кылып тытты да, жерге тебелеп, эшикти шарт жаап, сыртка чыкты."},{"t":"p","h":"Үйдүн ичин көпкө тунжураган сүрдүү тынчтык бийледи."},{"t":"p","h":"– Сен билчү белең? – деп сурады бир убакта апам."},{"t":"p","h":"– Ооба, билчүмүн."},{"t":"p","h":"<span class=\"pg\" data-n=\"29\">29<\/span>Апам мешке жөлөнө калып, мени ушундай бир кыжаалат болгон көз караш менен телмирип тиктегенде, биротоло чабар бармакты чабайын деп:"},{"t":"p","h":"– Мен алардын сүрөтүн дагы тартам! – дедим. Апам унчуккан жок, башын кайгылуу чайкап төмөн түшүрдү."},{"t":"p","h":"Жерде тытылып жаткан сүрөттү карап, ичимди өрттөп куйкалаган ызага чыдабай жаттым. Мейли мен биздин үй-бүлө, биздин уруу үчүн «бузуку» болоюн. Адамдык чоң чындыкка мен кыянаттык кылган жокмун. Турмуштун чоң чындыгына мен акыр аягына чейин адилеттүү болгом. Менин мына ушул ак ниеттүүлүгүмдү эч ким билген эмес. Аны элге айтууга болбос эле. Анткени башкалар түгүл, жанымдай көргөн өз энем да мунун маанисин түшүнбөс эле."},{"t":"p","h":"Апам унчукпай отура берди. Жанагы ыза болгонума көзүмө жаш имериле түшкөн окшойт, жерде чачылган сүрөттүн үзүндүлөрү айлампа сууга аккансып, каалгып жатты. Жана Данияр менен Жамийланы сүрөттөн тирүү сыяктуу көргөн учур мээме ушунчалык кадалган экен, көз алдыма баягы август түнүндөгү гүлдөгөн талаа келип, Даниярдын от менен жалын алып шаңшыган обону кулагыма угулгансып жатты. Жамийла менен Даниярдын ошондогусун эстеп, муңайыңкы жылмайып отурдум. Алардын айылдан кеткендегисин эстегенде жүрөгүмө кайрат толуп, мен дагы ошолор сыяктуу өз таалайым үчүн кыйын жолго чыгууга тайманбай бел байладым."},{"t":"p","h":"– Мен окууга кетем! – дедим мен апама. – Сүрөтчү болгум келет, сүрөтчүнүн окуусуна барам, атама да ушуну айтып кой... (Ч. Айтматов)"},{"t":"h3","h":"<span class=\"pg\" data-n=\"30\">30<\/span>§ 6. КЕПТИН СТИЛДЕРИ"},{"t":"p","h":"Тил коомдо пикир алышуу, иш жүргүзүүчү кызмат аткара тургандыгын билебиз. Ошол кызматына карата, мүнөзүнө карай ар кыл стиль жараларын да мурунтан бери окуп келе жатабыз. Эгерде көркөм стилде жаралган текст окуучуга эстетикалык, адептик тарбия татым берүү менен көркөм рухун калыптандырууну максат койсо, расмий жана расмий эмес иш кагаздары мамлекеттик мекемелер менен адамдарды байланыштырып, мамлекет менен мамлекеттин ортосундагы ж. б. мамилелерди тейлейт жана жөнгө салат."},{"t":"p","h":"Адабий тил (оозеки жана жазуу түрү) – бул радио менен телекөрсөтүүнүн, газета менен журналдын, адабияттын, маданият менен мамлекеттик мекемелердин тили. Жакын досторубуз, эне-аталарыбыз менен пикир алышканда, атайын иштиктүү кырдаалдагы сөздөрдү, сүйлөмдөрдү тандабайбыз. Тескерисинче, расмий-иштиктүү же илимий максаттагы иштерди баяндоодо жөнөкөй пикир алышуучу сөздөрдүн, сүйлөмдөрдүн тизмегин колдонбойбуз. Маселен, газетадан алсак: «Экономикалык реформага келсек, мында али көп нерсе алдыда. Бааларды реформалоо, дүң соода, дегеле финансылык жактан жакшыртуу маселелери – булардын баары эң ири, эң оор катмарлар. Мында эң башкысы, экономиканын калган бөлүгү чарбалык эсепке өтөт» («Кыргыз Туусу»). Бул ойду оозеки сүйлөшүүгө айландырсак, анда мындай болушу мүмкүн. «Экономиканы кайра карап чыгуу учун бааны соода менен эсеп-кысапты кайрадан тизцу керек. Буларды жасоо кыйын го. Анан калса чарбалык эсепке баарын өткөрүш керек»."},{"t":"p","h":"Көпчүлүк сөздөр, сүйлөмдөр жазуу жана оозеки кепте, көркөм жана публицистикада, окуу-илимий жана иштиктүү стилдерде бирдей учурай берет. Мындай тилдик формалар бейтарап стилди түзөт: кыш, <span class=\"pg\" data-n=\"31\">31<\/span>жай, мектеп, китеп, газета, таза, жаңы, эски, жашоо, иштөө, эртең, жакшы, бекитет, ачат, мен, сен, биз, ал ж. б. Сүйлөм мүчөлөрүнүн түз орун тартибинде жайланышы, сүйлөмдүн баш мүчөлөрүнүн катышуусу, ээ менен баяндоочтун ээрчишүүсү сыяктуу сүйлөм курулуштары да бейтарап стилге тиешелүүлүгүн айгинелейт. Мындай бейтарап стилге мүнөздүү болгон, колдонууга ийкемдүү сөздөрдөн, сүйлөмдөрдөн, сөз айкаштардан тышкары колдонуу мүмкүнчүлүгү чектелген мүнөздөгү сөздөр да учурайт."},{"t":"p","h":"Демек, эң жөнөкөй кат жазышуудан баштап, илимий иштерге, газеталык материалдарга, иш кагаздарына чейин өз максатына ылайык сөздөр тандалып, оюнун ырааттуулугу, сүйлөм түзүлүшү, ал тургай, айрым учурда тышкы жазылыш формаларына чейин бири-биринен өзгөчөлөнүүчү стилдин түрлөрү бар. Андыктан стилдин ар биринин бөлүнүшүнүн чектери болуу керек. Аны мындайча элестетүүгө болот:"},{"t":"p","h":"– жазылып жаткан маалымат же айтылып жаткан билдирүү кандай максатты көздөйт (адамдардын өз ара пикирлешүүсүбү, андай болсо коомдук жайдагы иш абалы боюнчабы; адам менен коомду байланыштыруучу мүнөзгө ээси ж. б.);"},{"t":"p","h":"– маалыматталуучу нерсенин жаратылуучу жана тароочу чөйрөсү;"},{"t":"p","h":"– маалыматтын берилиш максатына, аны жаратуучу автордун атайын максатка карата тандап алган сөздүк кору, ага карата тандап алган стилге ийкемдүү сөздөрү, сөз айкаштары, сүйлөмдүк курулуштарын баяндоонун ыкмалары ж. б. стилдерди бири-биринен өзгөчөлөп туруучу ыкмаларга, чектерге бөлүштүрөт."}],"sub":[{"title":"ЛАШТЫРУУ ЖАНА ЖАЛПЫЛАШТЫРУУ","b":3},{"title":"ОШ Ан /ПИЙВЕРСИТЕТИ 17 ХИТЕЙХАНА","b":20},{"title":"Байкадыңарбы?","b":45},{"title":"§ 6. КЕПТИН СТИЛДЕРИ","b":89}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[14,31]},{"title":"&amp; 7. РАСМИЙ ИШ КАГАЗДАРЫ БОЮНЧА БИЛИМДЕРИН СИСТЕМАЛАШТЫРУУ ЖАНА ЖАЛПЫЛАШТЫРУУ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"32\">32<\/span>&amp; 7. РАСМИЙ ИШ КАГАЗДАРЫ БОЮНЧА БИЛИМДЕРИН СИСТЕМАЛАШТЫРУУ ЖАНА ЖАЛПЫЛАШТЫРУУ"},{"t":"p","h":"Расмий иш кагаздары мамлекеттик, эл аралык деңгээлдеги иш чөйрөлөрүн тейлесе, расмий эмес иш кагаздары күнүмдүк иш чөйрөлөрү үчүн кызмат аткарат. Расмий иш кагаздарын билдирүү максатында өкмөт башчыларынын кабарлоо бөлүмү тарабынан баян этилет."},{"t":"p","h":"11. Президенттин Жарлыгынын мазмуну менен таанышкыла. Жарлык менен мындай билдирүүнүн айырмасын байкагыла."},{"t":"p","h":"Кыргыз Республикасынын Президентинин Жарлыгы менен маданият жаатындагы сиңирген эмгеги жана көп жылдык ак ниет иши үчүн эмгек ардагери Сагинбаева Уруяпса «Даңк» медалы менен сыйланды."},{"t":"p","h":"Кыргыз Республикасынын Президентинин Жарлыгы менен илим жаатындагы сиңирген эмгеги үчүн төмөнкүлөргө «Кыргыз Республикасынын илимине эмгек сиңирген ишмер» деген ардактуу наам берилди:"},{"t":"p","h":"Аттокуров Сабыр Аттокуровичке – тарых илимдеринин доктору, профессор;"},{"t":"p","h":"Караев Өмүркулга – тарых илимдеринин доктору, профессор."},{"t":"p","h":"Кыргыз Республикасынын Президентинин Жарлыгы менен базар экономикасынын шартында үзүрлүү иши үчүн «Акун» жоопкерчилиги чектелген коомдун башкы директору Турсунбеков Чыныбай Ахунович Кыргыз Республикасынын «Ардак грамотасы» менен сыйланды."},{"t":"p","h":"Кыргыз Республикасынын Президенти Ата Мекенди коргоочуларды Кыргыз Республикасынын мамлекеттик сыйлыктары менен сыйлоо жөнүндө Жарлыкка кол койду. Ага ылайык Ата Мекенди коргоодо эл аралык террорчуларга каршы күрөштө көрсөткөн жеке эрдиги үчүн төмөнкүлөр сыйланышты:"},{"t":"p","h":"<span class=\"pg\" data-n=\"33\">33<\/span>«Эрдик» медалы менен:"},{"t":"p","h":"Жайлообаев Баишбек Садаваевич – полковник; Коңурбаев Макамбай – милициянын полковниги; Султанов Курманбек Матиевич – полковник;"},{"t":"p","h":"Супатаев Асангул Аманович – полковник;"},{"t":"p","h":"Шадыбеков Касымбек Арызбекович – милициянын улук сержанты (көзү өткөндөн кийин)."},{"t":"p","h":"12. Мугалимдин тапшыруусу менен расмий эмес иш кагаздарынын үлгүсүнө салып ар кандай көнүгүүлөрдү иштегиле."},{"t":"p","h":"Расмий эмес иш кагаздары"},{"t":"p","h":"Расмий эмес иш кагаздарына ишеним кат, түшүнүк кат, мүнөздөмө, арыз, маалым кат ж. б. кирет. Алар коом менен адамдарды, адамдар менен мамлекеттик мекемелерди, ошондой эле адамдар менен адамдарды байланыштыруучу кызмат аткарат."},{"t":"p","h":"Т ү ш ү н ү к к а т иш кагаздарынын башка түрлөрү сыяктуу эле турмушта кеңири колдонулат Түшүнүк кат жеке адамдын, тиешелүү уюмдун же администрациянын жетекчилеринин бирине багытталат да, аткарылган иштин жыйынтыгы же аткарылбаган жумуштун себеби көрсөтүлөт."},{"t":"p","h":"Бул жерде образдуу, эмоционалдуу сөздөр колдонулбайт. Анткени түшүнүк катты жазууда көркөм боёкчолуу сөздөрдүн, ойдон чыгарылган каармандардын, жаратылыштык сүрөттөөлөрдүн зарылчылыгы жок. Ошондуктан болгон иш кыска, так түшүндүрүлүп, айтылуучу ойдун негизи гана жазылат. Түшүнүк кат жазган адамдын колу, күнү, айы, жылы менен күбөлөндүрүлөт."},{"t":"p","h":"Түшүнүк каттын даяр мөөр басыла турган бөлүгүнө белгилүү уюмдун аты, анын жетекчиси жана түшүнүк катты жазып жаткан адамдын иш абалы жазылат. Ал атайын үлгүдө, жазылып жаткан барактын оң жак бөлүгүнө толтурулуп, каттын мазмуну <span class=\"pg\" data-n=\"34\">34<\/span>жазылган бөлүктөн бөлүнүп турат. Ал эми сол жагындагы ачык бөлүк мекеменин иш жүргүзүү ыңгайына, каттоо үчүн (регистрацияга) калтырылат."},{"t":"h3","h":"ТҮШҮНҮК КАТ"},{"t":"p","h":"Дыйкандарга кол кабыш көрсөтүү максатында, «Ак-Терек» айылынын 20 га аянтындагы жашылчаларын сабактан тышкаркы мезгилде жыйнап бердик. Ага 7-, 9-класстардын окуучулары катышты. Жыйналган азык-түлүктөр чарбага өз убагында тапшырылды. 9-класстын үч окуучусу: Бердикеев Алмаз, Турусов Бакыт, Касымов Таланттар жумушка чыгууну себепсиз үзгүлтүккө учуратышып, эмгек тартибин бузушту. Окуучулар жамааты жогорку аты аталган балдардын тартибин карап чыгууну талап кылат. Мындан тышкары Байтемирова Асел ооругандыгы жөнүндө маалымат катын тапшырды."},{"t":"p","h":"Дуйшекеев Данияр 18. 10. 2012."},{"t":"p","h":"Түшүнүк кат сыяктуу билдирүү (рапорт, маалымат) бири-бирине окшош келип, ишкананын, мекеменин, уюмдун, адамдын конкреттүү эмгек мүнөзүнө, тармактын өзгөчөлүгүнө карата түзүлөт да, атайын алынган сөз каражаттары болот. Мисалы, айыл чарба шаймандарын ремонттоодо кетирилген кемчиликтер болсо, ага керектүү техникалык каражаттардын аты, анын тетиктери, паспорттук аталыштары кошо камтылуу менен техникалык терминдер колдонулат. Мындай учурда номенклатуралык аталыштар жалпы элге түшүнүктүү тилде жазылып, ага тилдин грамматикалык формалары жалганат."},{"t":"p","h":"Токтомдордо, чечимдерде, арыздарда, актыларда ж. б. мекеме менен мекеменин, адам менен коомдун өз ара байланыш-катышын камсыз кылып туруучу <span class=\"pg\" data-n=\"35\">35<\/span>расмий иш кагаздарынын өзүнө тиешелүү тышкы кейпи, жеке өзүнө гана мүнөздүү болгон сөздөрү, сүйлөм каражаттары бар. Ал сыяктуу иш кагаздарына ылайык терминдери жана калыпка салынган сөз айкаштары иштиктүү стилдин өзгөчөлүгүн бекемдейт: токтом кылат, чечим кабыл алат, резолюция чечүүнү талап кылат, кол коюучулар, акт, ишеним кат ж. б. сөздөр, сөздөрдүн айкашы расмий иштиктүү стилдин өзөгүн түзөт. Иштиктүү стилде образдуу, көркөм боёкчолуу сөздөр колдонулбайт."},{"t":"p","h":"Төмөндө түшүнүгүңөрдү бекемдөө үчүн, айрым иш кагаздарынын болжолдуу үлгүлөрү берилди."},{"t":"h3","h":"ИШЕНИМ КАТ"},{"t":"p","h":"Мен, Белеков Аскар Аземович, ушул ишеним катты Тилеков Таалай Садыковичке беремин. Анткени ооруп калгандышыма байланыштуу убактылуу ооруканада жаткандыктан, март айынын стипендиясын алып коюуга ишеним көрсөтөм."},{"t":"p","h":"Тилеков Таалай Садыковичтин өзүн күбөлөндүрүүчү кагазы катары паспорту, анын номуру (1-ТЕ № 388654, дайын-дареги Бишкек шаары, Чалдыбар көчөсү, 32) берилет."},{"t":"p","h":"Белеков А. А."},{"t":"p","h":"(Ишеним катты окуу жайынын (мекеменин) жетекчиси колу жана мөөрү менен бекитет.)"},{"t":"v","l":["Мекеменин штампы","Каттоо №"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"36\">36<\/span>МААЛЫМАТ КАТ"},{"t":"p","h":"Берилет бул маалымат кат Белеков Аскар Аземовичке, анткени ал Кыргыз мамлекеттик медициналык академиянын 1 курсунда дарылоо факультетинде окугандыгы анык."},{"t":"p","h":"Окуу мезгилинде бардык сабактарынан «эң жакшы» деген баага жетише алгандыктан, академиянын атайын бөлүнгөн стипендиясына көрсөтүлгөн."},{"t":"v","l":["Кыргыз мамлекеттик медициналык","академиянын дарылоо факультетинин","деканы, профессор","Мекеменин аты, жетекчинин аты-жөнү"]},{"t":"p","h":"Дарылоо факультетинин биринчи курсунун студенти Белеков Аскардан"},{"t":"h3","h":"ТҮШҮНҮК КАТ"},{"t":"p","h":"Эне-атам пенсия жашында болгондуктан, алардын күзгү жумуштарына, башкача айтканда, жер-жемиштерин жыйнап, чөбүн чаап берүүгө кол кабыш жасаган элем. Ошондуктан студенттердин күзгү айыл чарба жумушуна катыша албай калгандыгым жөнүндө түшүнүк кат беремин. Эне-атамдын пенсия жашында экендигин күбөлөндүргөн маалымат катты түшүнүк катка кошо тиркейм."},{"t":"p","h":"Белеков А."},{"t":"h3","h":"МҮНӨЗДӨМӨ"},{"t":"p","h":"Белеков Аскар 2006-жылы медициналык академиянын дарылоо факультетинин 1-курсуна өткөн. Окууга өткөндөн бери өзүнүн окууга болгон жөндөмүн көрсөтө алды. Окуу семестринде бардык экзамендерин «4» жана «5» деген бааларга ийгиликтүү тапшырды."},{"t":"p","h":"<span class=\"pg\" data-n=\"37\">37<\/span>Факультетте коомдук иштерге активдүү катышат. Жаштар уюумунда жетектөөчү кызмат аткарат."},{"t":"p","h":"Мүнөзү токтоо, оор басырыктуу, адамдар менен тез эле тил табыша алат."},{"t":"p","h":"Мүнөздөмө талап кылынуучу жайга берилет."},{"t":"p","h":"Дарылоо факультетинин деканы (Ф. А. А.) Катчы. (Ф. А. А.)"},{"t":"h3","h":"АКТ"},{"t":"p","h":"Биз, төмөндө кол коюп, акт түзүүчүлөр, Белеков Аскар Аземович – Медакадемиянын студенттик № 5 жатаканасынын студенттик кеңешинин төрагасы, Иванова Валентина Ивановна – ошол жатаканын коменданты, Садыков Таалай Турусович – окуу жайдын акимчилик чарбалык иштер боюнча проректору."},{"t":"p","h":"Акт түзүүнүн негизги себеби: жатаканадагы айрым жыгач эмеректер колдонуу мөөнөтүнөн өткөндүктөн, айрымдары сынып колдонууга, оңдоого мүмкүн болбой калгандыктан, комиссия аркылуу карап чыгып, колдонууга жараксыз деген бүтүм чыгарууну чечтик. Алар:"},{"t":"v","l":["1. Кийим илүүчү күзгүлүү","шкаф (эки эшиктүү)","2. Кийим илүүчү үч эшиктүү шкаф","3. Жазуу үстөлү","4. Ашкана үчүн үстөл","5. Отургуч (жумшак)","6. Кресло","Т. Шыпыргы (чийден жасалган)","8. Тактай жуучу чүпүрөк"]},{"t":"p","h":"– 5 даана – 3 даан – 12 даана – 16 даана – 55 даана – 8 даана – 12 даана – 8 метр"},{"t":"p","h":"Белеков А.А."},{"t":"v","l":["Иванова В.И.","Садыков Т.Т."]},{"t":"h3","h":"<span class=\"pg\" data-n=\"38\">38<\/span>АРЫЗ"},{"t":"p","h":"Биздин үй-бүлөбүз көп балалуу (эне-атамдан башка 9 бир тууганым бар) болгондуктан, кышкы сессиянын маалында эки сабактан экзаменди «үч» деген баага бергендиктен, үй-бүлөлүк шартымды эске алып, стипендия бөлүштүрүп берүүңүздү өтүнөм."},{"t":"p","h":"Үй-бүлөнүн саны, абалы жөнүндө айылдык кеңештин маалымат катын арызыма тиркеймин."},{"t":"p","h":"Белеков А. А."},{"t":"p","h":"19. 03. 2011."},{"t":"p","h":"Бишкек шаарынын мэри"},{"t":"v","l":["(аты-жөнү)","","Октябрь районунун акими","","(аты-жөнү)"]},{"t":"h3","h":"БИЛДИРҮҮ"},{"t":"p","h":"Кыргыз Республикасынын эгемендүүлүк күнүнө карата өткөрүлүүчү маданий массалык иш-чаралардын дайындалгандыгы, көчө, аянттардын тазаланып, тартипке келгендиги жөнүндө билдирем."},{"t":"p","h":"Акимдин колу 28. 08. 2011"}],"sub":[{"title":"ТҮШҮНҮК КАТ","b":19},{"title":"ИШЕНИМ КАТ","b":25},{"title":"МААЛЫМАТ КАТ","b":31},{"title":"ТҮШҮНҮК КАТ","b":36},{"title":"МҮНӨЗДӨМӨ","b":39},{"title":"АКТ","b":45},{"title":"АРЫЗ","b":52},{"title":"БИЛДИРҮҮ","b":59}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[32,38]},{"title":"§ 8. ПУБЛИЦИСТИКАЛЫК СТИЛЬ","blocks":[{"t":"h3","h":"§ 8. ПУБЛИЦИСТИКАЛЫК СТИЛЬ"},{"t":"p","h":"Публицистикалык стилди мындан мурдагы билимиңер боюнча билесиңер. Газетада радио, телекөрсөтүүдө атайын макалалар чагылдырылат. Алар ар түрдүү планда, кээси сүрөттөмө, айрымдары жол <span class=\"pg\" data-n=\"39\">39<\/span>баяны, көпчүлүк убакта учурдагы эмгек же маданий, илимий иштер менен алектенген адамдардын портреттик очерктери болот."},{"t":"p","h":"Мындай портреттик очерктер, адатта, массалык маалымат каражаттары үчүн жазылып, макала катары кызмат аткарат. Ал адамдын эмгеги башкалар үчүн өрнөк болуп, ага теңелүүгө, иш аракеттерин өз ишине пайдаланууга өбөлгө түзөт."},{"t":"p","h":"Публицистикалык стилде аткарылуучу иштердин дагы бири – макала. Макала гезиттерде, радио, телекөрсөтүүдө берилүүчү алдыңкы жанр болуп саналат. Анын тематикасы ар түрдүү болушу мүмкүн. Күндөлүк турмуштагы маанилүү баяндоолордун бардыгы макалалардан турат. Тарбиялык мүнөздөгү, адептүүлүккө чакыруу, үндөө максатындагы макалалар да публицистикалык стилде аткарылган болот."},{"t":"p","h":"18. Төмөнкү портреттик макаланы «Текст» деген бөлүктөгү Курманжан датка жөнүндөгү портрет менен салыштыргыла. Экөөндөгү портрет түзүүчү сөз каражаттарын белгилегиле."},{"t":"p","h":"Күлүйпа Жапарбековнаны көптөн бери билем. Анда баш калаабызда улуттук каада-салт жаңыдан эле башбага баштаган. Ал эже жетектеген № 172 балдар бакчасынын жамааты Нооруз майрамын өткөрүүгө бел байлашкан. Ошондон кийин шек санагандын өздөрү бул майрамдын философиялык жана тарбиялык мааниси зор экенине баа беришкен."},{"t":"p","h":"Күлүйпа Сагынбаева – иш дегенде ичкен ашын жерге койгон чыныгы педагог, уюштуруу жөндөмдүүлүгү бар жетекчи. Ал башкарган балдар бакчасындагы чакан педагогикалык жамааттын аракети менен түзүлгөн кабинеттерди көргөн адам: «Атаганат, башкалар да ушундай иштесе кана»,— деп бир тамшанып алат. Бул балдар бакчасынын педагогикалык жамааты тогуз жылдан бери «Айкөл Манас бабабыз» деген программанын үстүндө иштеп келди. Алардын тажрыйбасы адегенде шаарга, андан кийин республика боюнча жайылтылды. «Арген» балдар бакчасынын иш-тажрыйбасы <span class=\"pg\" data-n=\"40\">40<\/span>окумуштуулардын кызыгуусун пайда кылып, жогорку окуу жайларынын эксперимент жүргүзүүчү базасына айланды. Азыр бул программа толугу менен ишке ашып, Кыргыз Республикасынын билим берүү жана маданият министрлигинин кубаттоосуна ээ болгон."},{"t":"p","h":"Күлүйпа Сагынбаева 1995-жылы «Манастаануу» программасын ийгиликтүү иштеп чыккандыгы үчүн юбилейлик «Манас» медалы менен сыйланган. («Эркин-Тоо»)"},{"t":"p","h":"14. Маалымат беруу мүнөзүндөгү чакан макала менен таанышкыла. Публицистикалык стилге тиешелуу сез каражаттарын тапкыла."},{"t":"h3","h":"ШАЙЛООГО ЧЕТ ЭЛДИКТЕР ДА КЫЗЫГЫШУУДА"},{"t":"p","h":"Улуттук демократия институту (УДИ) биздеги парламенттик шайлоолор алдындагы абалды баалоо учун эл аралык делегациянын келишин уюштурду. Делегация Кыргызстанда журуп жаткан демократиялык процесстерде эл аралык коомчулуктун кызыкчылыктарын көргөзөт. Ошондой эле шайлоолорго даярдыктарды жана жалпы саясий абалды изилдейт."},{"t":"p","h":"Бүгүн алар ишинин жыйынтыктары боюнча прессконференция өткөрөт. («Эркин-Тоо»)"},{"t":"p","h":"15. Төмөнкү макаланын жанрдык өзгөчөлүгүн, стилдик түрүн аныктагыла."},{"t":"p","h":"Бул күндөрдө кээ бир жаштарыбыздын арасында кекирейүүчүлүк, менменсинүүчүлүк, улууларды сыйлабоочулук сыяктуу жаман адаттардын бар экендигин айтууга болот. Алар колуна арбыныраак акча тийип калса же кызмат даражасы жогорулай түшсө эле өз пикирин, өз зоболосун бийик коюшуп, оройлонуп, берген суроону жоопсуз калтырып, айтор, бир кыйла сүрдүү болуп чыга келишет."},{"t":"p","h":"Жашы элүүлөргө барып калган бир жолдошум менен көчөдө кобурашып бараткан элем. Ал менин сол тарабымда болгондуктан, кайчылаш өтүп бара жатышкан <span class=\"pg\" data-n=\"41\">41<\/span>жыйырма-жыйырма бештердеги үч жигит менен жөөлөшүп өткөндөй болду. Жолдошумдун куушурула беришинен улам мен дагы жолдон четке чыга бердим."},{"t":"p","h":"– Айланайын, кичине этияттап өтсөң болбойбу? – деп, ошол үчилтиктин берки жактагысына тигиле карады."},{"t":"p","h":"– Этият кылбаган кишини эмне, чаап алат белең! – деп, тиги ошол замат корс этип, чагып алчу жыландай жыйрыла түштү. – Андай экенсиң, көчөгө чыкпай, үйдө тынч эле олтура бербейсиңби, алжыбай,-— деп жибербеспи."},{"t":"p","h":"– Эй, адеби жок десе,— деди жолдошум чыйрала түшүп,— жердигин ылай көрүнөсүң го. Ушул мүнөзүңдүн азабын далай тартаар бекенсиң..."},{"t":"p","h":"Алар бир эрдик иш жасагандай күлүшө төмөн карай шарактап жүрүп кетишти."},{"t":"p","h":"Көрдүңүзбү, кымбаттуу замандашым, бул – адепсиздиктин бир белгиси. Ал жанагы ушундай оройлугу менен жүрүп отурса, бара-бара зөөкүрдүктүн жолуна түшөрү анык эмеспи. Кичүүлөрдүн улууларга ыйбаа кылуусу кандай сонун. Бирок алиги дулдуйган жигит өзүн көрсөтүп койбодубу. Ал сырттагыларга компоюп көрүнгөнү менен көп нерсени уттуруп жибербедиби. Аны ал шордуу кайдан туйсун, дардактап жүрсө болду да ага. Бирок турмуш анын тескерисинче болуп бара жатпайбы."},{"t":"p","h":"Бул жерде улууга ыйбаа кылып, жол бошотуп өтүп кетсе, эч сөз жок эле. Кайра өзүнүн адамгерчилигин, адамдыгын, маданияттуулугун көрсөтсө, жакшы көрүнүштөрдүн ээси болуп калмак. («Кыргыз Туусу»)"},{"t":"p","h":"16. «Мен идеал туткан адам» деген темада портреттик макала жазгыла."},{"t":"p","h":"17. Үй-бүлөңөрдөгү ата-энеңдин же бир туугандарыңардын бирөөнүн портретин түз."}],"sub":[{"title":"ШАЙЛООГО ЧЕТ ЭЛДИКТЕР ДА КЫЗЫГЫШУУДА","b":10}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[39,41]},{"title":"§ 9. ПУБЛИЦИСТИКАЛЫК СТИЛДЕГИ ПРАКТИКАЛЫК ИШТЕР","blocks":[{"t":"h3","h":"<span cl

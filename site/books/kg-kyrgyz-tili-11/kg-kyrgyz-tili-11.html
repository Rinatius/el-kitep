ass=\"pg\" data-n=\"42\">42<\/span>§ 9. ПУБЛИЦИСТИКАЛЫК СТИЛДЕГИ ПРАКТИКАЛЫК ИШТЕР"},{"t":"h3","h":"ОЧЕРК"},{"t":"p","h":"Очерк – публицистикалык стилге кире турган жанр. Ал көбүнчө массалык маалымат каражаттарында чагылдырылат. Окуучунун көңүлүн кайсы бир кубулушка, көрүнүшкө, коомдук орду бар адамга бура турган жагы менен, көлөмүнүн чакандыгы менен мүнөздөлөт. Жазылуучу нерсеге карата болгон чындык, фактылык материалдардын болушу менен публицистикалык башка чыгармалардан айырмаланат. Көлөмү анча чоң эмес. Анын жазылыш максатына карата жол очерки (мында жол сапары катары берилип, көркөмдүк, табигый кооздук ж. б. окуучунун көңүлүн бурат), жаратылыш көрүнүштөрү менен кубулуштарын айкалыштыра репортаждык жанрга жакын келүүчү очерк да болот."},{"t":"p","h":"Булардан айырмалануучу портреттик очеркке көңүлүңөрдү бурабыз. Силер буга чейин билгендей, портрет адам элеси деген түшүнүктү берсе, портреттик очерк адамдын коомдук орду, иштеген иши, эл арасындагы кадыр-баркы, өз ара мамилеси менен айырмаланган белгилүү адамдар жөнүндөгү маалымат берүүгө арналат. Мында көркөм стилге мүнөздүү сөз каражаттары колдонулуу менен окуучунун көңүлүн өзүнө бурат. Алар, негизинен, гезитке жарыяланууга, радио жана телеберүүлөргө арналат да, эл арасына каармандарды тааныштыруу максатын көздөйт."},{"t":"p","h":"18. Төмөнкү очерктик макаланы окугула жана өз алдыңарча очерк түзүүгө аракет жасагыла."},{"t":"p","h":"Азыркы жайдын ысык аптаптуу күндөрүнө карабай, алыскы бийик тоонун арасында жайланышкан Тоң районунун атактуу малчысы, бир кезде Кыргыз Республикасынын Жогорку Кеңешинин төрагасы, Социалисттик <span class=\"pg\" data-n=\"43\">43<\/span>Эмгектин эки жолку баатыры Таштанбек Акматов менен кездешүүгө жөнөдүм. Жол азабы дегендей, бийик аскалуу тоону аралап, улам бийиктеген сайын машинага күч келип жүрүп отурдук. Тоң району мал киндиктүү жер болгону менен, жеринде шибер чөптөр буралбастан, такыр, анчалык бийик эмес өскөн чөбү жеринин кыртыштуу экенинен кабар берет. Таштак жерлерди жарып чыккан чөбү токчулуктуу, малга жайлуу, тоо-ташы жылаңач болушу менен айырмаланат."},{"t":"p","h":"Ошондой сүрдүү тоолорду, кулап кетчүдөй бийик аскаларды аралап отуруп, жарым күндөн ашык жол басып, улам бир белес ашып дегендей атактуу малчыныкына жете бардык. Тоонун салкын абасы жүрүп турат го десек, айланасы курчалган чөйчөктөй аралыкта деле жайдын ысык деми куйкалап турган экен."},{"t":"p","h":"Кызык бир жери бийик тоолуу жерде эки кабат бийик салынган там үй көзгө урунат. Үстүндө спутник менен телеберүүнү кармоочу антенна. Жакындай берген сайын ал адамдын короо жайы тыкан, чачылып жаткан бир ашык буюму көзгө урунбады. Малчынын короосундай эмес тыкан кармалган чарбачыл адамдын өзү көрүнбөсө да, элесин берип турат. Биз жакындаганыбызды көрүп, өзү тоонун бети жактан түшүп келе жаткан экен. Баскан-турганы шайдоот, бетинде күндөн, шамалдан калган бырыш издер карылыктын эмес, эмгектин элесин берет. Кардан карыкпасын үчүн көзүнө тагынган кара көз айнегин алып, бизге күлүңдөй карап келе жатты."},{"t":"p","h":"Сүйлөшүп отурганыбызда алыстаган жаштыгына кейибестен, андан, эмгектен тапкан урмат-сыйын, кантип эмгектин эки жолку баатыры болгондугун, өкмөттүк кызматта кандай иштегендигин, анан эмне үчүн шаарда жашай бербегендигин сыймык менен айтып отурду. Азыркы учурда асыл тукум кыргыз жылкыларынын тукумун таза сактап, калыбына келтирүү үчүн аракет кылып жаткандыгын, топоздордун бийик тоодогу жашоосун айтып отурду. Жаныбызда <span class=\"pg\" data-n=\"44\">44<\/span>агып жаткан мөңгүдөн түшкөн суунун шарына кулак төшөп отуруп, карыдым деп айыл аксакалдарынын жанында, от башында отуруп калбастан, эл камын көрүп, асыл таза кандуу улуттук жылкы жөнүндө кам көрүп жүргөн карыянын бейнесине ыраазы болдум. Кыр-кырларда жайылган жылкы, уй, топоздору жөнүндө айтып, ушундай бийик тоо арасында, деңиз деңгээлинен кыйла. бийиктиктеги жайытында демикпей шайдоот басып кетип бараткан адамдын элесин көпкө карап келе бердим."},{"t":"p","h":"Суроолор жана тапшырмалар:"},{"t":"p","h":"1. Силер жашаган аймакта эмгектин атактуу адамы барбы?"},{"t":"p","h":"Болсо ал жөнүндө очерк жазып көргүлө."},{"t":"p","h":"2. Мектебиңер жөнүндө жазгыла. Анда силерди өзүнө тартып турган жагдайлар кайсы экенин бөлүп көрсөткүлө."},{"t":"p","h":"з. Силердин айылдагы сен идеал туткан адамың жөнүндө портреттик очерк жаз. Ар биринде анын адамдык сапатына, тышкы келбети менен ишинин келишкен сапаттарына көңүл бургула."},{"t":"h3","h":"МАКАЛА"},{"t":"p","h":"Макала – күндөлүк маалымат каражаттарына ылайыкталып аткарылган публицистикалык стилдеги практикалык иштин бир түрү. Анын жазылыш максатына маалымат берүү ылайыгына карата ар кандай түргө бөлүштүрүүгө болот."},{"t":"p","h":"Макаланын бир түрү маалымат берүү максатын көздөйт. Ал эми коомдук турмушта тигил же бул жагдайлардын жагымдуу же жагымсыз жагын чагылдыруу менен коомчулуктун көңүлүн бурууга аракеттенет. Маселен, кыргыз тилинин мамлекеттик тил катары коомдук кызматын чагылдыруу үчүн ар бир адамдын ой-мүдөөсүн билдирүү керек болсо, анда ал ошол темада жазылган макалалардын топтомун түзөт. Бул коомдук кызмат аткаруучу маалымат берүүгө ылайыкталган макала."},{"t":"p","h":"<span class=\"pg\" data-n=\"45\">45<\/span>Макаланын дагы бир түрү болуп илимий жанрды түзүүчү түрү саналат. Мунун негизги максаты – тиешелүү темага арналган илимий маалыматтарды топтоо менен, ошол темага карата жазып жаткан автордун жеке көз карашын билдирүү. Өзүнүн жеке көз карашын аныктоодо башка илимий булактарга шилтеме берип, авторлордун оюн туура же ага кайчы келе турган багыттарына талдоо жүргүзөт. Силер мындай илимий макала жаратуунун алгачкы кадамын реферат жазган учурда пайдаланып келе жатасыңар. Бирок андай рефераттарды силер окуган илимий адабияттарыңар боюнча түшүнүгүңөрдү гана калыптандырып, бир ыргакка келтирип келе жатсаңар, илимий макалада ошол темадагы илимий маселеге сын көз менен кароого, өз оюңардын туура же кайсы бир жагынан макул эмес экендигиңерди далилдөөгө үйрөнүшүңөр зарыл. Андыктан окуган адабияттарыңарды көрсөтүп, шилтеме жасоого көнүгүшүңөр керек."},{"t":"p","h":"Макаланын үчүнчү туру – сын макала. Бул адабият таануу илимине тиешелүү болот да, көркөм чыгармага карата айтылган окуучунун жекече көз карашына кирет. Сын макала чыгармадагы окуянын берилиш ыкмасынан баштап, жазуучунун тандап алган усулдук ыкмасына чейин, дүйнөлүк адабият жаратуучулардын дүйнө таанымдык чеберчилигинин ченинде берилиш ыкмасынан бери талдоого алынат. Андыктан сын макала жаратуучунун дүйнө таанымы кенен, бир канча илимий сын эмгектер менен тааныш болуусу керек. Жазуучу жараткан адабий чыгарманын жаралыш доору, анын айланасындагы калемгерлердин ошол окуяны чагылдыруу стилинен бери талданып, автордун жеке ийгилиги менен жетишсиз жактары белгиленет. Ою куру болбош үчүн бир канча типтеш маселелер талданат, иргелет. Адам мүнөздөрү, коомдук жагдай-шарт, эстетикалык маселелер бүтүндөй адабий өнүгүү же жаралуу мезгил :атары иргелет. Демек, сын макала жаратуу сезимталдуулук <span class=\"pg\" data-n=\"46\">46<\/span>менен бирге илимий талдоо жүргүзө алуу дареметтен келип чыгат. Ошондуктан маалымат берүүчү макалага караганда илимий макала же сын макала жаратуу кыйынга турат. Биринчиси, баамчылдыкка көбүнчө багыт алса, экинчи жана үчүнчү түрү илимий талдоонун негизинде жаралат."},{"t":"p","h":"Макалалардын жаралышынын негизинде коомдогу болуп жаткан өнүгүш, өзгөрүш жатса, аны жазып маалымат жаратуучу автор ошондой өнүгүүнү көрө билүү менен талдоосу абзел. Макалада кандайдыр бир жаңы адамдын оюна төп келүүчү маселелер болушу менен окуучунун көңүлүн өзүнө бурат."},{"t":"p","h":"19. Бул макалаларды окуп, жанрын аныктагыла. Маалымат берүүчү мүнөздөгү макалабы, же таанып-билүүчүлүк максаты барбы? Эгер болсо оюңарды далилдер менен бекемдегиле."},{"t":"p","h":"1926-жылга чейин борборубуз Пишпек деп аталып келсе, ошол жылдан баштап, атактуу жердешибиз, Советтик Кызыл Армияны түзүүчүлөрдүн бири, көрүнүктүү аскер башчысы Михаил Васильевич Фрунзенин атын алган. 1991-жылы эгемендүүлүктү алгандан баштап, мурдагы Бишкек деген атына ээ болгон. Бул Бишкек деген баатырдын атынан улам келип чыккан деп жүрүшөт."},{"t":"p","h":"Борбордун ортосунан тең жарып Чыгыштан Батышты карай ондогон километрге созулуп жаткан эң узун көчө Чүй канчалаган аталыштарды албады. Октябрь революциясына чейин ал Купеческая деп аталса, андан кийин Гражданская деген атка ээ болгон. 1940-жылдан кийин Сталин, анан ХХП партсъезд деп аталган. Бул дагы мезгилге туура келбей 1974-жылы Лениндин ысымы берилген. Эгемендүүлүккө ээ болгондон баштап, Чүй проспектиси болуп аталып калды. Өкмөт үйү, Улуттук академия, ТЭЦ ушул көчөдө жайгашкан."},{"t":"p","h":"Совет доорунда Советская деп аталып келген көчө мурда Базарная деп аталчу. Азыр ал үч бөлүктөн туруп, темир жолдон тоо тарапка кеткен бөлүгү Байтик баатыр, Чоң Чүй каналынан түштүк тараптагы бөлүгү Баку деп аталат. Ал эми шаардын ортосун аралап өткөн <span class=\"pg\" data-n=\"47\">47<\/span>борбордук бөлүгү Кыргызстандын эң биринчи эл комиссарлар Кеңешинин төрагасы Юсуп Абдырахмановдун ысымында. Мурдагы Белинский көчөсү азыр эки аталышта – темир жолго чейин Тынчтык проспектиси, андан түндүк жагы Манас көчөсү. Бир кезде азыркы университеттин жана анын ботаникалык багынын жакын тегерегинен жер алдынан булактар чыккандыктан, ал көчө Ключевая деп аталчу экен."},{"t":"p","h":"Борбордун түштүк тарабындагы эң чоң Ахунбаев көчөсүнүн тарыхы да өзүнчө кызык. Россиянын чоң шаарларынын бири Ярославлдин урматына ушул аталышты алган. Кийинчерээк СССРдин 50 жылдыгы атындагы көчө деп аталган. Кыргыз Республикасы өзүнчө мамлекеттүүлүккө ээ болгондон баштап атактуу хирург, академик Иса Ахунбаевдин атына коюлган. Анткени ушул көчөдө жайгашкан медициналык академияда (мурдагы мединститутта) ал киши ректор болуп иштеп, көп мыкты дарыгерлерди даярдап, уядан учурган."},{"t":"p","h":"Байкасаңар борбордо Россиянын чоң-чоң шаарларынын, союздук республикалардын борборлорунун аттары коюлбаган көчө дээрлик жокко эсе. Мисалы: Ленинград, Москва, Тамбов, Тула, Ростов, Киев, Баку, Ташкент, Рига, Вильнюс, Таллин, Душанбе, Алма-Ата, Тбилиси, Ереван, Кишинев көчөлөрүн билбегениңер чанда чыгаар. Андан башка орус элинин улуу жазуучу-акындарынын, окумуштууларынын аттары менен да көчөлөр аталган. Некрасов, Пушкин, Толстой, Маяковский, Тургенев, Чехов, Островский, Ломоносов, Кривоносов, Павлов, Сеченов ж. б. көчөлөр буга далил."},{"t":"p","h":"Эгемендуулук алгандан кийин көп көчөлөрдүн аттары өз элибиздин көрүнүктүү адамдарынын аттарын ала баштады. Үмөталиев, Токомбаев, Абдумомунов, Раззаков, Кулатов, Сүйүмбаев, Тыныстанов, Т. Айтматов, Юнусалиев, Маликов, Рыскулов, Бейшеналиева деген көчөлөрдү азыр билбеген адамдар чанда болуш керек. («Жаңы кылым»)"},{"t":"h3","h":"<span class=\"pg\" data-n=\"48\">48<\/span>ПАХТА ӨНДҮРҮҮНҮН САПАТЫ – ЭН НЕГИЗГИ МАСЕЛЕ"},{"t":"p","h":"Жалал-Абад областы республикабыздын түштүк регионундагы эң көп пахта эгүүчү аймак болуп саналат. Өлкөбүздө өндүрүлгөн пахтанын ?0% ы Жалал- Абад областына туура келип, пахта өндүрүү боюнча областтын экономикасында негизги орунду ээлеп, айыл чарбасынын экспорттук негизин түзөт. Тилекке каршы, областтын аймагында үрөнчүлүк чарбалардын жер аянттары айыл өкмөттөрү тарабынан жыл өткөн сайын кыскартылып жатат. Бул үрөн маселесине, анын сапатына түздөн-түз терс таасирин тийгизет."},{"t":"p","h":"Жала-Абад областынын Ноокен районуна караштуу «Абдикерим-агроном» үрөнчүлүк чарбасынын базасында пахтанын апробациясы боюнча областтык семинар өтүп, ага областтык мекеме уюмдардын жетекчилери, райондук агрардык өнүктүрүү башкармалыктарынын башчылары, агрономдору, өсүмдүктөрдү коргоо станцияларынын үрөнчүлүк инспекциялардын өкүлдөрү, айыл өкмөттөрүнүн башчылары жана үрөнчүлүк чарбаларынын жетекчилери катышты. Семинарда үрөн өндүрүүдөгү абал терең талкууланып, аны жакшыртуу боюнча сунуштар айтылды. Республикалык пахта үрөн инспекциясынын башчысы Өсөржан Назирбековдун айтымында бүгүнкү күндө областтын аймагында 1-репродукциядагы үрөндөр өтө аз, көпчүлүгү 2—3-репродукциядагы үрөндөрдү түзөт. Пахтанын түшүмдүүлүгүн жогорулатуунун шарттарынын бири – бул сапаттуу үрөн өндүрүү. Ал эми айылдык товар өндүрүүчүлөрдү колдоо максатында сапаттуу үрөн менен камсыз кылуу багытында облус боюнча 15 үрөнчүлүк чарба иш алып барууда."},{"t":"p","h":"Акыркы мезгилдерде област боюнча кондициялык үрөн өндүрүүнүн көлөмү бир топ кыскарып, жалпы керектелүүчү үрөндүн 30-40 пайызы араң даярдалууда. Мындан ары да ушул ыргак менен кете турган болсо, даяр үрөндү учурдагы баасынан 2-3 эсе жогорку <span class=\"pg\" data-n=\"49\">49<\/span>баада коңшу республикалардан сатып алуу коркунучу күтүлүп жатканын областтын губернаторунун биринчи орун басары Ж. Курбанов билдирди."},{"t":"p","h":"Семинарда сырт жактан контрабандалык жол менен алынып келинген үрөндөрдүн кесепетинен областта өндүрүлүп жаткан үрөндүн көпчүлүк бөлүгүнүн сапаты төмөндөп жаткандыгы айтылды. Сырттан ташылып келинген үрөндөрдүн тиешелүү документтери жок болгондуктан, вегетация учурунда сорттордун кайра чандашуусунун натыйжасында «Кыргыз – 3» жана «Кыргыз —5» сортторунун технологиялык сапаттары жоголуп бара жаткандыгы айтылды."},{"t":"p","h":"Областтын аймагындагы үрөнчүлүк чарбалары үрөндүк материалды мамлекеттик стандартка жооп берүүчү тиешелүү базасы жана үрөндүк лабораториясы жок пахта заводдоруна кайра иштетүүгө тапшырышып, натыйжада үрөндү тазалоонун, сактоонун жана кондицияга жеткирүүнүн эрежелеринде өтө олуттуу кемчиликтерге жол берилип жаткандыгы белгиленди. («Агропресс»)"},{"t":"p","h":"20. Бул макаланы окуп, эмне жөнүндө маалымат берип жаткандыгын аныктагыла. Өзүңөр ушундай темада чакан билдирүү жазып, мектептин дубал гезитине жана гезиттерге жиберип көргүлө."},{"t":"h3","h":"СУНУШ БИЗДЕН, ЧЕЧИМ СИЗДЕН"},{"t":"p","h":"Москва Өкмөтү менен Кыргыз Өкмөтүнүн 2006 – 2007-жылдар аралыгында соода-экономикалык, илимий-техникалык жана маданий тармактар боюнча кызматташуу жөнүндө иш-чараларды жүзөгө ашыруу келишимине ылайык, үстүбүздөгү жылы Москванын керектөө базарларына 2000 тонна сабиз, 2000 тонна төө буурчак, кургатылган жемиштер жана башка азык-түлүк товарлары жөнөтүлдү."},{"t":"p","h":"Кыргызстандын продукцияларын Россия Федерациясынын башка региондоруна жөнөтүү максатында айыл, суу чарба жана кайра иштетүү өнөр жай министрлиги <span class=\"pg\" data-n=\"50\">50<\/span>тарабынан Татарстан, Свердлов жана Россиянын башка областтарына 2006-жылдын түшүмүнөн кайра иштетилген азык-түлүктөрдү жөнөтүү жана аларды өнөр жай продукцияларына, айыл чарба машинелерине жана алардын камдык бөлүктөрүнө бартердик айырбаштоо сунушу менен кайрылды. Аны россиялыктар кандайча кабыл алышат, азырынча белгисиз. Бирок эң негизгиси биз өз сунушубузду айттык. Мына ушундай эле сунуш кат Өзбекстандагы Кыргыз Республикасынын соода өкүлчүлүгүнө да жөнөтүлдү. Анда коңшу мамлекетке жогоркудай эле шартта картошка жөнөтүү сунушу айтылган."},{"t":"p","h":"(«Жаңы кылым»)"},{"t":"p","h":"Суроолор жана тапшырмалар:"},{"t":"p","h":"1. Макалалардын жазылыш максаты канааттандырабы?"},{"t":"p","h":"2. Силердин көңүлүңөрдү бурган маселелер кайсылар?"},{"t":"p","h":"3. Алар жөнүндө кандай маалыматтык макала жазса болот?"},{"t":"p","h":"4. Окуган көркөм чыгармаңар жөнүндө өз алдыңарча сын жазып, мугалимиңер менен талдагыла."}],"sub":[{"title":"МАКАЛА","b":16},{"title":"ПАХТА ӨНДҮРҮҮНҮН САПАТЫ – ЭН НЕГИЗГИ МАСЕЛЕ","b":29},{"title":"СУНУШ БИЗДЕН, ЧЕЧИМ СИЗДЕН","b":36}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[42,50]},{"title":"§ 10. ИЛИМИЙ СТИЛДЕГИ ПРАКТИКАЛЫК ИШТЕР","blocks":[{"t":"h3","h":"§ 10. ИЛИМИЙ СТИЛДЕГИ ПРАКТИКАЛЫК ИШТЕР"},{"t":"p","h":"Көпчүлүк учурда илимий стилге мүнөздүү болгон атайын терминдик сөздөр колдонулат. Илимдин ар бир тармагына ылайык терминдин лексикасы, өзүнө жараша терминдик маанилери бар. Мисалы, медицинага байланыштуу: оорулуу, температура, амидопирин, эндоскопия, кислород, кан басымы. ж. б.; тил илимине байланыштуу: басым, тил, синтаксис, тыбыш, тембр, жөндөмө, текст ж. б.; химияга байланыштуу: реакция, кычкылтек, темир, этил сыяктуу ар тармактуу аталыштар басымдуулук кылат."},{"t":"p","h":"Илимий эмгектерде заттардын, кубулуштардын аттарын атоо, илимий жыйынтыктарды баяндоо болгондуктан, сөздөрдүн образдуу мааниси дээрлик колдонулбайт. Илимий стилде татаал багыныңкылуу <span class=\"pg\" data-n=\"51\">51<\/span>сүйлөмдөр, киринди сөздөр ойдун ырааттуулугун туюндуруучу каражаттар катары кеңири колдонулат."},{"t":"p","h":"Илимий стиль автордук ой жүгүртүү монологунан турат. Анда илимий ой жүгүртүү, ой толгоолор илимий проблемага болгон жеке пикири катары, ал эми өзүнө окшош изилдөөлөргө таянуу – оюнун аныктыгын бекемдөөсү болуп саналат. Так (табигый) илимдерде теориялык аныктоолор автордук ой натыйжасы катары ишке ашат. Ошону менен илимий тактыкты талап кылуучу корутунду же илимий натыйжа текстти мазмундук жана структуралык жактан жыйынтыктап турат."},{"t":"p","h":"21. Тексттин илимий негизин аныктагыла. Автордук фактылык материалды жана ой жүгүртүүнүн чегин ажыраткыла."},{"t":"p","h":"Жусуп Баласагындын «Кут алчу билим» аттуу эмгеги – түрк тилиндеги алгачкы энциклопедиялык чыгармалардын бири. Бул эмгектин эне тилинде жазылышы түрк тилинин ички мүмкүнчүлүгүн, анын али белгисиз ажарын ачып берди. Деги эле эл менен тилдин тагдыры тутумдаш. Тил, анын түзүлүшү элдин ой жүгүртүү өзгөчөлүгү менен тыгыз байланышта. Тил жандуу кубулуш катары өсүп-өнүгүп, улам жогорулаган сайын татаалданып, анын мүмкүнчүлүктөрү арта берет. Демек, «Кут алчу билим» түрк элдеринин тили, акыл-эси жөндөмдүүлүгүнүн өсүшүнө дем берип, түрткү болгон баалуу мурас экендиги талашсыз."},{"t":"p","h":"Жусуптун турмуш жолу, чыгармачылыгы жөнүндө үстүрт гана маалыматтар бар. Ал Токмок шаарынан анча алыс эмес жерде жайгашкан Баласагын шаарында жашаган. Биз сөз кылып жаткан эмгегин 1069-жылы Кашкарды бийлеген Табгач-Богра Кара-Хакан-Абу Али Хасанга арнап жазган. Эмгектин жаралышынын негизги себептеринин бири – эне тилге карата ойчулдун назик сезими, патриоттуулугу. (А. Бекбоев)"},{"t":"p","h":"22. Муну да жогоркудай талдоого алгыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"52\">52<\/span>1930-жылдары М. Элебаевдин чыгармачылыгынын гүлдөп турган мезгили болду. Бул жылдары акындын калеминен жогорку идеялуу, көркөмдүк деңгээли бийик бир катар лирикалык ырлары жаралды. Алар: «Ысык-Көл», «Мында кел», «Экөөбүз», «Өлмөк эмес» ж. б."},{"t":"p","h":"Мукай жаңы заманда жаңы төрөлүп, анын күрдөөлдүү арымы менен эриш-аркак тороиду. Анын граждандык жоопкерчилиги, акындык таланты партиянын жетекчилиги астында күрөштөрдө такшалды. Акындын өзү айткан:"},{"t":"p","h":"«Мен жаралгам, бел байлап эмгекчилердин, Эзелтен көксөп жүргөн арманы үчүн."},{"t":"v","l":["Өмүр күнүм бир жолу батмайынча,","Ошолорго жумшалмак бардык күчүм!»—"]},{"t":"p","h":"деген жашоодогу урааны иш менен күн өткөн сайын бекемделип жатканына окуучулары, замандаштары кубе болушту.(Л. Үкүбаева)"},{"t":"p","h":"23. Ж. Баласагындын «Кут алчу билим» китебинин баш сөзү боюнча конспект түзгүлө. Илимий стиль экендигин аныктагыла."},{"t":"p","h":"24. Ж. Баласагын жөнүндө реферат жазгыла, анын ыр саптарынан өз оюңарды бекемдөө үчүн цитата колдонгула."},{"t":"h3","h":"БИБЛИОГРАФИЯ"},{"t":"p","h":"Илимий стилдин ичинде көңүл буруучу бөлүгү – библиография. Библиография – китептердин илимий тартипте тизмеленип жазылышы, алфавиттик көрсөткүчү. Кайсы бир тармактар боюнча ырааттуу тизмеси деген тушунукту билдирет."},{"t":"p","h":"Биз окуу же керкем китептердин алгачкы бетин ачкан учурубузда бизге тааныш эмес тамгалардын, сандардын жыйыны турат. Булар китептин кайсы бир тармакка тиешелуу экендигин билдирет. Мындай белгилерди китепканага барган учурунарда да <span class=\"pg\" data-n=\"53\">53<\/span>каталогдун четинде жазылып тургандыгын баамдаган чыгарсыңар. Демек, ар бир китеп китепканаларда бир канча жылдап сакталарынан улам, ар бири өзүнүн тармагына тиешелүү экендигин, ар бири илимий негизде жайланышы керектигин, ар бирин сурап алууда китептин автору, аталышынан тышкары алиги шифр белгилерди кошо толтуруп сурашыбыз керек экендигин эстешибиз керек."},{"t":"p","h":"Библиография деген терминдин өзү илимий маалымат дегенди билдирет. Ал илимдин тигил же бул тармагына же автордун жазма иштеринин топтомуна байланыштуу китепканаларда же атайын чыгарылган китептерде маалыматтык көрсөткүч болуп эсептелет. Маселен, китеп болуп басылып чыккан маалымдамада автордун чакан макалаларынан баштап, көлөмдүү чыгармаларына чейин жарык көргөн жылына, кандай тематиканын ичине кире тургандыгына чейин бөлүнүп берилген болот. Окумуштуунун библиографиялык көрсөткүчү болсо, анын өмүр таржымалы, андан соң илимий макалалары, анан илимий конференцияларда сүйлөгөн баяндамалары, илимий эмгектери (монографиялары – бир илимий маселени толук, терең иштеп чыгууга арналган илимий эмгек), окууга арналган усулдук эмгектери, илимий эмгектерге карата жазылган сындык же рецензиялык материалдары, ал окумуштуунун эмгектерине карата жазылган сын же рецензиялык материалдардын тизмеги ж. б. болуп бөлүштүрүлөт. Бул белгилүү бир адамдын эмгектерине арналган библиографиялык түзүлүш болуп саналат. Булардын бардыгы кайсы басылмада, качан (айы, күнү, жылы менен бирге) чыккан журнал же гезиттик материал болсо номери да көрсөтүлөт."},{"t":"p","h":"Ал эми тематикалык библиографиялык көрсөткүчтөрдүн максаты ошол тиешелүү тематикага байланыштуу адамдар же маалыматтык билдирүүлөр бир китепке топтолуп, кыскача билдирилет. «Кыргыз энциклопедиясы» китебинин материалдарында <span class=\"pg\" data-n=\"54\">54<\/span>ар бир макалада кыскача илимий да, тарыхый да маалымат берилип, акырында ошол материалдарды толуктап кароо үчүн пайдаланылган илимий эмгектер тиешелүү алфавиттик илимий тартипте берилет. Силер муну өзүңөр да карап чыксаңар болот."},{"t":"p","h":"Ал эми китепканалардагы библиографиялык көрсөткүч китептердин арасынан ар ким өзүнө тиешелүү эмгектерди тандап алуу үчүн ылайыктап түзүлгөн атайын китептканалык тартип болуп эсептелет. Анда автордук же тематикалык көрсөткүчкө жараша тизмеленип, издеп, иргеп табууга ылайык атайын китепканалык белгилер (шрифттер) коюлган болот. Эгер алфавиттик библиографиялык көрсөткүч болсо, анда авторлордун алфавиттик тартибинен, окшош фамилиялуу болсо, аттарынын тартибине чейин ажыратылып иреттелет. Чыккан жылы боюнча тартипке келтирилет. Чыккан жылы боюнча иреттелиш хронологиялык тартип деп аталат. Ал эми тематикалык тартипте жайланышкан болсо, анда химия тармагын мисал алсак, ал тармактагы илимий эмгектер, макалалар, ал боюнча илимий конференциялардын материалдары ж. б. ага тиешелүү деп эсептелген майдадан чоңго чейинки жарык көргөн бардык эмгектер иретке келтирилген болот. Бул системалык тартип деп аталат."},{"t":"p","h":"Тапшырмалар:"},{"t":"p","h":"1. Мектептин же өзүңөр жашаган жердеги китепкананын китептеринин жайланышын, тематикалык же алфавиттик бөлүнүшүн карап байкагыла, андан эмнени билсеңер айтып бергиле."},{"t":"p","h":"2. Китептердин тышындагы сол бурчундагы жазууларды карагыла: ичиндеги жабыштырылган кагаздагы белгилер эмнени билдирерин мугалимиңерден же китепканачыдан сурагыла."},{"t":"p","h":"3. Китепканадан кайсы бир окумуштуунун чыгармачылыгына арналган библиографиялык көрсөткүчтү карап, ал боюнча айтып бергиле."},{"t":"p","h":"4. Силер окуган чыгармалардын кыскача аннотациясын өзүңөр түзүп көргүлө. Бул чакан текст экенин белгилегиле."},{"t":"p","h":"5. Өз алдыңарча библиография түзүп, көнүккүлө."},{"t":"h3","h":"<span class=\"pg\" data-n=\"55\">55<\/span>КОНСПЕКТ"},{"t":"p","h":"Конспект түзүү илимий же жөнөкөй адамдын жашоосундагы окулган чыгармалары боюнча же адамдын чыгармачылыгына жасай турган ишине ылайыкталып түзүлөт. Уккан же окуган тексттин маанилүү деп эсептелген жерлерин кыскача кагаз бетине түшүрүүнүн натыйжасы конспект болот. Силер окуган чыгармалар же сабактардан окуган, уккан маалыматтарды унутуп калбас үчүн белгилеп жазып алуунун негизинде түзүлөт."},{"t":"p","h":"Конспект эки түрдүү максатта: Биринчи түрү —- окулган же угулган текстти эске сактап калуу үчүн кыскача мазмунун түшүрүү. Мында ар бир адам өзүнүн жеке кабылдоосуна, кайра окуу мүмкүнчүлүгүнө жараша түзөт. Аны түзүүнүн бир кылка эрежеси жок, бирок жалпыга белгилүү же жеке ыкмада кыскартуулары менен, тиешелүү маанилүү жерлерин сызып, башка түстөгү сыя менен жазуу калыптанган."},{"t":"p","h":"Экинчи туру – аткарыла турган илимий иштерге, окула турган лекцияларга карата түзүлгөн конспект. Булар тезис түрүндө кыскача айтыла турган, изилдөөгө алына турган маселенин кыска усулу берилет да, кийин аны кеңейтип, айтып берүү же изилдөө жолуна салуу максатын көздөйт. Булардын негизинде илимий эмгектер же илимий докладдар жатат. Шилтеме берип таянуучу илимий эмгектер, авторлордун көз карашы да эскертүү катары камтылышы мүмкүн."},{"t":"p","h":"Тезис – конспектилөөнүн же изилдөө иретинде иш жүргүзүүнүн кыскача формасы. Анда айтыла турган ой бир канча абзацка берилет. Абзац кыскача сүйлөмдөргө батырыла турган ыкма. Эгер сүрүлүү жөнүндө тезис түзсөк, анда сүрүлүү эмненин натыйжасы экендиги бир абзацтуу сүйлөмдөргө, аны белгилөө үчүн алынган шарттуу белги – формуласы берилип, аны чечмелөө бир абзацтагы сүйлөмдөр, <span class=\"pg\" data-n=\"56\">56<\/span>сүрүлүүдөн пайда болгон натыйжадан келип чыккан өндүрүштүк пайда ж. б. кыскача үч абзацты ээлеген 6-7 сүйлөм көлөмүндө болушу керек. Анын ар бирин кеңейтип, изилдөө же оозеки айтып берүүдө чоң көлөмгө жетише тургандыгынын негизи болуп саналат."},{"t":"p","h":"Ал эми изилдөө иштерине карата түзүлгөн тезистин негизи илимий божомол-гипотеза болуп эсептелет. Анын негизи илимий конференцияларга алдын-ала жарык көрүү аркылуу окумуштуулардын көңүлүн буруу максатын көздөйт. Илимий баяндоо мезгилинде ар бир тезистик жол-жоболор чечмеленип, окумуштуулардын көңүлүнө коюлуп, оюнун анык экендиги же тактоо талап кыла тургандыгы тастыкталат."},{"t":"p","h":"Суроолор жана тапшырмалар:"},{"t":"p","h":"1. Мугалимдин жардамы менен сабакка кыскача конспект түзгүлө. Туура экендигин сабак берген мугалимиңер менен текшергиле."},{"t":"p","h":"2. Окуган көркөм чыгарманын конспектисин түзүп, адабият сабагында пайдалангыла."},{"t":"p","h":"3. Жыйналышта сүйлөй турган сөзүңөрдүн кыскача тезис-конспектисин түзүп, класс жыйналышында пайдалангыла."},{"t":"p","h":"4. Мугалимдин жардамы менен ««Манас» – дүйнөгө белгилүү баатырдык эпос» деген окуучулук конференция уюштургула. Анын докладынын тезистерин түзүп, конференция өткөргүлө."},{"t":"p","h":"5. Өз алдыңарча конспект, тезис түзүп көнүккүлө."},{"t":"h3","h":"РЕФЕРАТ"},{"t":"p","h":"Силер 10-класста реферат деген эмне экендиги, ал кандайча жазыла тургандыгы жөнүндө маалымат алгансыңар. Азыр анын айрым бир жагын эске салабыз."},{"t":"p","h":"Реферат – илимий стилде жазыла турган окуучунун өзүнүн жеке ой жүгүртүүсүнө багытталган чакан <span class=\"pg\" data-n=\"57\">57<\/span>көлөмдөгү эмгек. Ал конспектилөөнүн негизинде ишке ашат. Башкача айтканда, тигил же бул илимий тема боюнча кыскача маалымат берүүнүн ыкмасы болуп саналат. Эгерде силер химия илиминин башталышы, анын ичинде М. В. Ломоносов жөнүндө реферат жаза турган болсоңор, алды менен химия илими жөнүндө, ал кайсы кылымда иликтөөнүн же иштей баштоонун башаты болгону жөнүндө маалыматтарды конспектилеп, иреттеп жазасыңар. Ал химиктер кимдер, эмне үчүн аталып калганына көңүл бурасыңар. Анан М. В. Ломоносовдун химия илиминдеги салымын, ордун аныктайсыңар. Муну үчүн бир канча адабияттарды карап окуп, толук маалымат алышыңар зарыл. Анын мезгилдик системасынан кийин кандай толуктоолор болгонун жана болоорун айтышыңар зарыл. Ошондуктан реферат алгачкы илимий эмгектин башталышы деп эсептелгендиктен, жазылыш ыраатынын сакталуусу да маанилүү."},{"t":"p","h":"Реферативдик журналдар деп атала турган илимий топтомдор бар. Алар илимдин тармактары боюнча акыркы чыккан илимий эмгектердин кыскача мазмуну, илимий жаңылыктар менен тааныштыруу максатын көздөйт. Мисалы, «Илим жана турмуш», «Вопросы языкознания», «Русский язык в кыргызской школе», «Эл агартуу» ж. б. журналдарды келтирсе болот. Энциклопедиялар да илимий реферативдик эмгектердин катарына кирет."},{"t":"p","h":"Реферат – кандайдыр бир тема боюнча жазылган кыска илимий эмгек. Илимий стилди калыптоодо чоң мааниге ээ. Тактыгы, маалыматтарынын арбындыгы, тилинин жеткиликтүүлүгү менен айырмаланууга тийиш. Рефератта илимий маалымат гана берилбестен, референттин (реферат жазган автордун) жазып жаткан материалга карата мамилеси, баасы чагылдырылат. Ал монографиялык (бир чыгармага же жеке авторго арналган) же обзордук (бир топ чыгарманы жалпылаштырып камтыган) формада болот. Реферат референттин өз сөзүнөн турат. Анда айрым <span class=\"pg\" data-n=\"58\">58<\/span>зарыл деп эсептелген учурларга гана цитаталар колдонулат жана ал кайдан алынганы (китептин автору, аты, чыккан жылы, бети) көрсөтүлөт. Илимий иштин бул жөнөкөй түрүн ар кандай композициялык планда түзсө болот. Адатта, реферат төмөнкүдөй тартипте түзүлөт:"},{"t":"p","h":"1. Кириш бөлүмү – рефераттын темасы болгон чыгарманын, илимий эмгектин автору жөнүндө кыска маалымат, сөз болуп жаткан чыгарманын жазылыш тарыхы ж. б.;"},{"t":"p","h":"2. Рефераттын негизги бөлүгү – тема боюнча кыскача, бирок жеткиликтүү илимий маалымат берүү;"},{"t":"p","h":"3. Баяндалган маалыматтарга карата анын мааниси тууралуу жыйынтыктар, жалпылоолор."},{"t":"p","h":"Жазылган темага карата окуучулук пикирдин, көз караштын болушу да шарт. Силер азыр мындай илимий чоң маселелерге илимий көз карашыңарды айтканга эрте деп эсептешиңер мүмкүн, бирок өз оюңарды айтууга көнүшүңөр керек. Автор менен макул болбогон учурда кайчы пикир айта аласыңар. Бул силердин илимий сезимталдыгыңарга түрткү бериши ыктымал."},{"t":"p","h":"Рефераттын акырында корутунду жазылат да, темага байланыштуу пайдаланган адабияттардын библиографиялык тизмеси берилет. Ал максатына, цитата берилгенине жараша катар номери менен белгиленип, же алфавиттик тартипте жайланыштырылат. Авторлордун фамилиялары тышкы гана эмес, ички алфавитке да салынышы жалпы илимий талапка жооп берет. Бир эле автордун бир канча эмгеги келтирилсе, чыккан жылынын ирети менен болушу шарт."},{"t":"p","h":"<span class=\"pg\" data-n=\"59\">59<\/span>Суроолор жана тапшырмалар:"},{"t":"p","h":"1. Мугалимдин тапшыруусу менен сабактардан реферат жазгыла да, андагы маалыматтын тууралыгы жөнүндө кайсы сабактан жазылган болсо, ошол мугалим менен тактагыла."},{"t":"p","h":"2. Жазылган рефераттын адабияттарынын тизмеси тартип менен жайланышканбы, текшергиле. Кайсыл шаардан, басмадан, кайсы жылы чыккандыгынан бери тактап аныктагыла."},{"t":"h3","h":"РЕЦЕНЗИЯ ЖАНА ОТЗЫВ"},{"t":"p","h":"Рецензия жана отзыв (пикир деген мааниде) окулган китептин, көрүлгөн кинонун, спектаклдин негизинде жазылат. Бул жанрларды дилбаян катары кароого да болот. Адабият сабагында жана класстан тышкаркы иштерде отзыв көбүнчө 5-8-класстарда көбүрөөк жүргүзүлсө, рецензия окуучулары тарабынан аткарылат. Отзывда чыгарманын автору жөнүндө айрым бир маалыматтар берилет. Китептин темаларынын жана бөлүмдөрүнүн аттары аталып, башкы каармандарынын кээ бир кызыктуу окуялары жөнүндө сөз болот."},{"t":"p","h":"Рецензия – отзывдын өнүккөн жана татаал түрү. Ал адабий көз карашты калыптандырып, жазуу маданиятын көтөрүүгө, илимий жана публицистикалык стилдерди айкалыштыра билүүгө жардам берет. Рецензияны жогорку деңгээлде жазуу үчүн төмөнкүлөр талап кылынат: чыгарманын мүнөзүн, анын темасын, идеялык мазмунун, проблематикасын аныктоо; сөз болуп жаткан автордун стилин мүнөздөп, анын көркөм ыкмаларын түшүндүрүү; чыгарма боюнча пикир айтып, ошол пикирлерди аргументтүү далилдеп, рецензияланып жаткан эмгекке жалпы баа берүү; ой-сезимди сабаттуу, бийик адабий деңгээлде таасын, так берүүгө аракеттенүү. Рецензияланып жаткан чыгарманы жакын темадагы идеядагы башка чыгармалар менен салыштырууга да болот."},{"t":"p","h":"<span class=\"pg\" data-n=\"60\">60<\/span>Рецензияда чыгарманы баалоодо бир жактуу «жакшы» же «жаман» дегендей шаблондордон алыс болуу керек. Сөз кылып жатканда эле окурманга сенин ой-пикириңдин багыты, көз карашың белгилүү болсун."},{"t":"p","h":"Көркөм чыгармага рецензия жазганда анын мазмунунда эмнелер камтылат:"},{"t":"p","h":"– автор жана анын китеби жөнүндө кыска маалымат;"},{"t":"p","h":"– рецензияланып жаткан чыгарманын темасы, идеясы, андагы автордун ниети, негизги проблематикасы, азыркы учурдагы актуалдуулугу;"},{"t":"p","h":"– ошол чыгарманын композициялык жактан өзгөчөлүгү, анын идеялык мазмунду ачуудагы мааниси;"},{"t":"p","h":"– жазуучунун талант кудурети, чеберчилик денгээли;"},{"t":"p","h":"– рецензияланып жаткан чыгарманы окугандан улам пайда болгон ойлор, сезимдер, пикирлер. Автордун чыгармасындагы сүрөттөө, баяндоонун чындык менен байланышы, эстетикалык көз карашы ж. б."},{"t":"p","h":"Бирок бул сөзсүз аткарылуучу эреже же аттап өтө алгыс жол эмес. Рецензиянын ар түрдүү формаларын издеп табууга болот. Жогорудагы талаптар окуучулардын рецензиясына коюлган жалпы шарттар болуп саналат."},{"t":"p","h":"Рецензияларды мектептин адабий газетасында, олимпиадаларда, окурмандар конференцияларында жана диспуттарда пайдаланууга болот."},{"t":"h3","h":"<span class=\"pg\" data-n=\"61\">61<\/span>ДОКЛАД"},{"t":"p","h":"Доклад конференцияларда, кыргыз тили, адабияты боюнча класстан тышкаркы иштерде – ийримдин ишинде, көчөлөрдө, жолугушууларда окулат. Доклад жазуудан мурда ошол жазыла турган материалга негиз болчу тема терең үйрөнүлүүгө тийиш. Тема жөнүндө жазылган сын макалаларды, окурмандардын пикирлерин таап таанышып, керектүү учурларын конспектилөө керек. Алар докладда пайдаланылат. Бирок цитата кимдин кайсыл китебинен, кайсыл жеринен алынганы көрсөтүлүүгө тийиш. Докладыңда эмне жөнүндө айтарың, кайсыл багытка көбүрөөк көңүл бурарың алдын-ала дайын болсун. Ыймандуулук маселесине кайрыласыңбы, жаратылышты коргоо маселеси кызыктырабы, белгилүү бир чыйыр, белгилүү багыт боюнча аракеттенүү дурус. Докладда баарын камтыймын деп отуруп, баарын чөп башылап калгандан жаманы жок. Докладга план түзүп алган бир топ пайдалуу. Айта турган оюңар ырааттуу болсун, бир ой менен экинчиси бири-бирин улап кетсин. Ойлоруң жипке тизилген мончоктордой болуп тизилип турганы абзел. Докладдагы пикирлер ырааттуу болсун. Дайыма эсиңерде болсун, доклад алдыңардагы кишилердин өздөрү окуп алышы үчүн эмес, силер окуп берип, алар угуп кабыл алуу үчүн ылайыкталууга тийиш. Ошондуктан анын стили оозеки баянга жакын, түшүнүктүү болгону жөн. Доклад окулуп жатканда түшүнүксүз сүйлөмдөрдүн, сөздөрдүн маанисин туюнуу үчүн угуучулар сөздүктөрдү, маалыматтама китептерди карап отурбайт."},{"t":"p","h":"Докладдар бири-бирин кайталабасын. Азыр көп эле докладдар, маселен, акын же жазуучунун өмүрү, чыгармачылыгына арналган болсо, адегенде ошол кишинин качан, кайда туулганы, балалыгы кантип өткөнү, окуган жылдары, адабият майданына кошулган алгачкы чыгармасы жөнүндө гана айтылат. Негизги китептери, чыгармалары, кызматтары, сыйлыктары <span class=\"pg\" data-n=\"62\">62<\/span>саналып чыгат. Мындай кургак маалыматтар угармандарды кызыктырбайт."},{"t":"p","h":"Доклад даяр болгондон кийин силер аны үйдөн кайра-кайра окуп, машыккыла. Угармандардын алдына чыкканда жазылган нерселерди үңүлүп окуп отурбай, жай сөз менен баяндап берген абзел. Айрым мисалдарды, цитаталарды окуп, калганын жөн гана сүйлөөгө болот. Докладдын соңунда кайсыл адабияттардан пайдаланганыңарды көрсөткүлө. Доклад бир жактуу болбош үчүн ар кандай басылыштагы китептерди, схема-таблицаларды, сүрөттөрдү, иллюстрацияларды, диафильмдерди ж. б. көргөзмөлүү нерселерди пайдаланган оң."}],"sub":[{"title":"БИБЛИОГРАФИЯ","b":15},{"title":"КОНСПЕКТ","b":31},{"title":"РЕФЕРАТ","b":47},{"title":"РЕЦЕНЗИЯ ЖАНА ОТЗЫВ","b":62},{"title":"ДОКЛАД","b":74}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[51,62]},{"title":"&amp; 11. КЕПТИН ТҮРЛӨРҮ ЖАНА СТИЛДЕРИ","blocks":[{"t":"h3","h":"&amp; 11. КЕПТИН ТҮРЛӨРҮ ЖАНА СТИЛДЕРИ"},{"t":"p","h":"БОЮНЧА БИЛИМДЕРДИ СИСТЕМАЛАШТЫРУУ"},{"t":"h3","h":"ЖАНА ЖАЛПЫЛАШТЫРУУ"},{"t":"p","h":"25. Төмөнкү тексттерди окуп, стилдин кайсы түрлөрүнө таандык экендигин аныктагыла. Жообуңардын негизин бекемдегиле. Тексттин маанилик байланышына көңүл буруп, сүйлөмдөрдүн өз ара байланышын айтып бергиле."},{"t":"p","h":"«Манас» деген этноним жөнүндө ар кандай далил, божомолдор аз эмес. Айрым чыгыш өлкөлөрүндө Манас ысмына уйкаш жерлердин, шаарлардын аталыштары бар. Ал эми байыркы индиялыктардын философиясында «Манас» деген сөз терең, айкөл, бийик деген маанини түшүндүрөт экен. Демек, Манасты жаратуучулар затына аты төп келген ысымды кокусунан таап коюшкан эмес. Ушундай болгондон кийин, баатырдын ысмынын мааниси анын образы менен төп келиши, кандайдыр бир деңгээлде негиздүү, чындыкка жакын тургандай. (Р. Сарыпбеков)"},{"t":"p","h":"<span class=\"pg\" data-n=\"63\">63<\/span>Ж. Баласагын атындагы Кыргыз Улуттук университетинин ректору"},{"t":"p","h":"(аты-жөнү) Байболотов Бакирден"},{"t":"h3","h":"АРЫЗ"},{"t":"p","h":"Кыргыз улуттук университетинин математика факультетине кирүү үчүн экзамен тапшырууга уруксат берүүңүздү суранам. Мен Ош шаарындагы № 2 орто мектепти 2011-жылы бүтүргөмүн. Арызга төмөнкү документтерди тиркейм:"},{"t":"p","h":"1. Орто мектепти бүткөндүгүм жөнүндө жетилүү аттестаты."},{"t":"p","h":"2. Ден соолугум тууралуу № 286-медициналык справка."},{"t":"v","l":["3. Мүнөздөмө.","4. 3х4 өлчөмүндөгү 6 сүрөт."]},{"t":"p","h":"(колу) Б. Байболотов"},{"t":"p","h":"23. Теменку эки тексттеги кептин стилдерин аныктагыла."},{"t":"p","h":"1. Бала бат, бирок катуу чынырып жиберди. Сарай тарапка кир жайганы бараткан Асылгүл Кенжештин кыйкырыгын угуп, бурчту айлана чуркап чыкты да, ошо замат көтөрүп бараткан кирин жерге ыргытып жиберип, Бостондун эшигине аттап-буттап жетип барды:"},{"t":"p","h":"– Карышкыр! Баланы алып кетти, кокуй күн? Болгула, болгула тез, айланайындар!"},{"t":"p","h":"Бостон эмне болуп кеткенин түшүнбөй, дубалдан шапа-шуп мылтыгын ала коюп, үйдөн атып чыкты. Артынан Гүлүмкан жүгүрдү:"},{"t":"p","h":"– Тигине! Тигине, Кенжеш! Карышкырдын жонунда баратат, кудай ай! – деп ирең-алеттен кеткен Асылгүл кыйкырып жатты."},{"t":"p","h":"<span class=\"pg\" data-n=\"64\">64<\/span>Бостон карышкырды өзү да көрдү. Желе-жортуп кетип бараткан экен, жалына арта салынган бала өкүрүп-бакырып баратат."},{"t":"p","h":"– Ташта, Акбара! Ташта баланы! Экинчи беру аттууга тийбейм. Таштай кет, баламды! Акбара! Айланайын, Акбара, ташта баламды! (Ч. Айтматов)"},{"t":"v","l":["2. Аба, жер, суу, асман, көк,","Оболу мурун жаралды,","Адамзат, айбан таралды.","Эр башы менен Ай башы,","Канча ойлосок билбейбиз,","Кайсы жерде каларды.","(Жеңижок)"]},{"t":"p","h":"26. Үй-бүлөлүк шартка байланыштуу айыл чарба жумушунан бошотуу тууралуу мектептин директоруна арыз жана жолдошуңарга мүнөздөмө жазгыла."},{"t":"p","h":"27. Текстти окуп, стилин аныктагыла. Оюңардын тууралыгын талдап, бекемдегиле. Белгиленген сөздөрдүн маанисин айткыла."},{"t":"p","h":"«..Бир жолу чөп чабыкта жүрөм. Чалгыны бир шилтегенде эле кандайдыр бир жагымсыз ышкырыктын үнү угулду. Карай салсам, жыландын куйругу чалгыга чөп менен кошо кетиптир. Кайдан-жайдан дагы бир жылан сойлоп келип, айланып карап, кайра кетти. Жарадары ордунан козголбой эле турат. Тез эле тигиниси чачырак деген чөптү оозуна бурдай тиштеп келип, жараатына баса койсо, жыландан агып жаткан бир сары суюктук тып эле басылып калса болобу? Ошондо көргөмүн, жыландан кан чыкпайт экен. Анан менин да чачыракка кызыгуум артып калды. Колумду чалгы менен канатып, баягы чачыракты басып көрсөм, дароо эле каны тыйылып калды."},{"t":"p","h":"Демек, табигатта биз биле элек канча сыр бар, бизге окшоп сүйлөй албаган тилдери, дилдери бар. Ошону эстесем эле баягы жыландын өз ара түшүнүү менен бирин бири дарылап, анан экөө чөп аралай сойлоп кеткенин көрүп азыркыга чейин тан берем. Адам ээй, адам адам болуп жаралганы бирине бири нааразы, бири менен <span class=\"pg\" data-n=\"65\">65<\/span>бири урушкан, деги неси болсо да, ушул тилсиз жыландардай, макулуктардай жалпы бир түшүнүшүү аз деп ойлоно берем»,— дейт акылга дыйкан Жээнбай агайым."},{"t":"p","h":"Мына ушул сыяктуу акылмандуулукту, ыйманызаатты, керегине жараша тилдик материалдарды түшүндүрмөсү менен баян этип отурган орто бойлуу, ак чач, күлмүңдөгөн көзүнөн дайыма мээримдин, жылмаюунун изи кетпеген, көзүнүн тегерегинде терең кеткен бырышы бар адам көз алдыма келе берет. Ар дайым гезиттин жаңы сандарын бүктөй кармап, ара-чело боло калса, машинкадан жаңы чыккан эмгегинин катасын оңдоо үчүн, көз айнегин иле, башын саал бир жагына кыйшайта отурган Жээнбай Мукамбаев агайым эсиме түшүп, кайра-кайра карегиме катып калгандай көрүнөт."},{"t":"p","h":"Дайыма аралаш иштеп, чогуу жүрсөң, адамдын барк-насилин билбейт экенсиң. Араңдан кеткенден кийин кайран гана адам, кандай жакшы киши эле, илимдин дулдулу, кенен маанидеги педагог эмес беле деп, алаканды куушуруп отуруп калат экенсиң. («Асаба»)"},{"t":"p","h":"28. Илимий жана публицистикалык стилге ылайык тексттерди тандагыла. Алардын аталган стилдерге тиешелүүлүгүн далилдегиле."},{"t":"p","h":"29. Ырдагы синоним сөздөрдүн көркөм боёкчого ээ болуп тургандыгын, образдуулугун айтып бергиле. Бул тексттин жанрдык бөтөнчөлүгүн айткыла."},{"t":"h3","h":"КҮН ЖАНА КӨЗ"},{"t":"v","l":["Көрбөйм итти, угам бирок үргөнүн,","Сезем отту көрбөсөм да күйгөнүн.","Көрбөй калдым жадегенде уулумдун,","Эң алгачкы бажырайып күлгөнүн.","","Сезим менен чарк айланып ааламды,","Ассалоом! – деп, айтам күнгө саламды.","Башта, колдо, жүрөгүмдө жарыктык,","Таманымда, согончокто караңгы.","<span class=\"pg\" data-n=\"66\">66<\/span>О, улуу Күн, жүрөктөгү балалык,","Сен керемет, сенден таппай чалалык.","Ушунчалык жакын элек экөөбүз,","Ушунчалык алыстады аралык."]},{"t":"p","h":"(Т. Кожомбердиев) ЗО. Төмөнкү тексттен стиль түзүүчү сөз каражаттарын белгилегиле. Көөнөргөн сөздөрдүн азыркы учурдагы синонимдерин койгула. Сөздөрдүн эскиришинин себебин белгилегиле (бул материал 1937-жылдагы, архивдик кагаздардан алынды)."},{"t":"h3","h":"КҮБӨЛҮК КАТ"},{"t":"p","h":"Берилди ушул күбөлүк кат Мажит Матабек уулуна анын үчүн бул жолдош Нарын шаарындагы 1-баскыч кыргыз мектебинин 3-бөлүгүндө окуб, орусча, энетил, жазуу, эссе, жарапиа, саясы, жаратылыш, сүрөт жана адамчылык жагынан бүтүрүп, 5-класска көчүрүлдү. Ушунун чындыгына кол коюб, кеңеш мөөрүн басуу менен ишендирилсин."},{"t":"v","l":["Мектеп башчысы","Окутуучулар"]},{"t":"p","h":"31. «Мекен эмнеден башталат?» деген темада оозеки маек уюштуруп, анын стилдик каражаттарына көңүл бургула."},{"t":"p","h":"32. «Эне тилим – эне сүтүм» деген темада дилбаян жазгыла. Стилиңерди аныктагыла."},{"t":"p","h":"33. Ырды окуп, эпиграмма катары пайдаланып, ой толгоо жазгыла."},{"t":"v","l":["«Эзелтен чечилбеген улуу талаш,","Канткенде адам уулу адам болот?","Ураалап жоо кууса да улуу талаш,","Канткенде адам уулу адам болот?","Ажалга көз жумса да ушул талаш,","<span class=\"pg\" data-n=\"67\">67<\/span>Канткенде адам уулу адам болот?","Душмандан жан соогалап качканда да,","Душманды кырып-жоюп басканда да,","Түбөлүк чечилбеген ушул талаш,","Канткенде адам уулу адам болот?","Адамзат качан чечет, качан коёт,","Канткенде адам уулу адам болот?»"]},{"t":"p","h":"(Ч. Айтматов)"},{"t":"p","h":"34. 1) Жогорку ырдын негизинде оозеки пикир алышкыла. Оюңарды кенен, терең билдирүүгө аракет жасагыла. Чечендикке, ораторлукка көнүккүлө. Дүйнөдөгү согуштар эмнеден чыгат, адамдар арасындагы көрө албастык, ич тардык кайдан келет ж. б. суроолорго токтолууга аракет жасагыла; 2) «Ыймандуулукту мен кандай түшүнөм» деген темада макала жазып, мектептин дубал газетасына чыгаргыла."},{"t":"p","h":"35. «Музыка – менин жандүйнөм» деген темада макала жазгыла. Музыка кумириңердин өмүрү, чыгармачылыгы жөнүндө адабияттардан пайдалангыла."}],"sub":[{"title":"ЖАНА ЖАЛПЫЛАШТЫРУУ","b":2},{"title":"АРЫЗ","b":7},{"title":"КҮН ЖАНА КӨЗ","b":29},{"title":"КҮБӨЛҮК КАТ","b":32}],"section":"БАЙЛАНЫШТУУ КЕП","pages":[63,67]},{"title":"§ 12. ОРХОН-ЕНИСЕЙ (ЭНЕСАЙ) ЖАЗУУЛАРЫ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"68\">68<\/span>КЫРГЫЗ ЭЛИ КОЛДОНГОН ЖАЗУУЛАР"},{"t":"h3","h":"§ 12. ОРХОН-ЕНИСЕЙ (ЭНЕСАЙ) ЖАЗУУЛАРЫ"},{"t":"p","h":"Октябрь Революциясына чейин кыргыз элинин жазуусу болгон эмес деген туура эмес ой-пикирлер айтылып келген. Кыргыз эли дүйнө элдери сыяктуу эле өзүнүн тарыхын, үрп-адатын, салтын, маданиятын, тилин сактап келген жана жазуу-сызуусу да илгертеден эле бар экендиги тарыхый маалыматтардан улам белгилүү. Жазуу эстеликтери Тывадан, Тоолуу Алтайдан, Якутиянын түндүгүнөн жана Кыргызстандын Талас өрөөнүнөн табылган. Таластагы жазуулар Енисейдеги жазуу эстеликтерине тектеш. Енисей жазууларын Енисейдеги Кыргыз мамлекети, Чыгыш Түрк кагандыгы, Уйгур кагандыгы, Жети-Суу Чыгыш Түркстандагы бир катар түрк өлкөлөрүнүн калкы колдонушкан. Биздин күндөргө жетип келген ташка чегерилип калтырылган Орхон-Енисей эстеликтери кыргыз элинин УІ кылымдардан бери эле өзүнчө жазуусу бар экендигин далилдеп турат. Орхон-Енисей жазуусу – түрк тилинде сүйлөгөн элдердин жазма эстеликтери болуп саналат. Аны ХПХ, XX кылымда аты чыккан көрүнүктүү окумуштуулар С. Ремезов, Ф. Страленберг, Д. Миссершмидт Енисей дарыясынын боюнан табышкан. Мындай жазууларды Н. М. Ядринцев Орхон дарыясынын боюнан Монголиядан да тапкан. Аларды адеп окугандар В. Томсен менен орус түркологу В. В. Радлов болгон. Ал жазуулардагы маалыматтарды кыргыз эли колдонгондугун далилдеп турат. Орхон- Енисей жазуулары бүгүнкү күндө кеңири изилденилип, анда баяндалган окуялар кыргыз тарыхы, жазуусу катары гана саналбастан, Күлтегиндин эстелигиндеги <span class=\"pg\" data-n=\"69\">69<\/span>жазуулар кыргыздын байыркы адабий мурасы катары да бааланууда."},{"t":"v","l":["Суроолор жана тапшырмалар:","1. Орхон-Енисей жазуулары кайсы кылымдарга таандык?","2. Дагы кандай таш эстеликтерин билериңди айтып бер."]},{"t":"p","h":"3. Күлтегиндин эстелигиндеги жазууларды кыргыздын, байыркы адабиятынын үлгүлөрү катары эсептөөгө болобу?"},{"t":"h3","h":"ОРХОН-ЕНИСЕЙ ЖАЗУУСУНУН ТАМГАЛАРЫ"},{"t":"img","src":"data:image/webp;base64,UklGRtJzAABXRUJQVlA4IMZzAABQ6wGdASqAAgoCPrVSoUynJKcrJRMNmWAWiWluBi2Zv8zxsfFH6Ra2fT/Z72R6HGeeorbX/Y9CnW5BigrtcMyK+VnymciPBM9E/znSA4LXcD2BeNr9qNxEpEf8PlfaHyU3hz+G/+T/C+mr47/R/6b/G/uD/f/Uv8f+tfy/9z/zP/B/y3uN/6HUAfW/+i9i/5l+BP0n+B/dr+9e9n/R/03lj8lP8n/N/jz8h35V/Vv8//gfyI+Nn7vufd0/237eewX7W/Zf+1/kvRJ+q/7/+u9c/0f/Lf9L3A/5l/Z/+vyTlA3yW/8z/8f7H/b+1L86/3X/0/1/wRfz7/Bf9T/CF8OlN3Ac5OBxTqHYogGM9IDrVKqmrDhOJlhKICaAdXa6QDAasm69HfRyip9KZUBbgWqNdi1SCYgGDAtuWjltzFVEjc7mlsbLQhPWBL1rdQob3f2q0sXvCLLTMYlsRp6EuLpVKXzhffr3aTLI5DbkQz73YlphfeT :"p","h":"Кыргызстанга ислам дини тарай баштаган онунчу кылымдан тартып кыргыздар араб тамгасын колдонушкан. Орто кылымдардагы даңазалуу аалым, акындар Махмуд Кашгари менен Жусуп Баласагын араб тамгасын колдонуп, «Түрк тилдеринин сөздүгүн», «Кут алчу билим» дастанын жазышкан. ХУ кылымдын аягы ХУІ кылымдын башында Сайпидин Ахсыкенди кыргыз тарыхы боюнча жыйнагын араб тамгасы менен жазган. XVIII кылымда ата-бабаларыбыз Орусияга, Кытайга жазган каттарын араб тамгасы менен жазышкан."},{"t":"p","h":"Эн башкысы алфавитти түзүү болуп эсептелген. Ал үчүн мамлекет тарабынан жаңы алфавиттин Бүткүл- союздук Борбордук Комитети, ар бир республикада жана автономиялык областтарда анын жергиликтүү органдары түзүлүп, жаңы алфавитке өтүүнүн <span class=\"pg\" data-n=\"71\">71<\/span>ар кандай маселелери боюнча бүткүлсоюздук, аймактык кеңешмелер өткөрүлгөн. Анда партиялык, советтик органдардын, окумуштуулардын, методисттердин жана коомчулуктун кеңири катмары бул ишти жөнгө салуу боюнча баалуу пикирлерди айтышкан."},{"t":"p","h":"1924-жылы кыргыз тилинде «Эркин-Тоо» газетасынын биринчи саны жарык көрүп, улуттук басма сөздүн негизин түздү. Бул газетанын чыгышы Кыргызстанда эл агартуу иштерин өнүктүрүп, калктын сабатсыздыгын жоюу үчүн абдан чоң түрткү болду. «Эркин-Тоо» газетасы иш жүзүндө алгачкы окуу куралы, алгачкы Алиппенин милдетин аткарып, көпчүлүк эл ошол газетадан өзүлөрүнүн сабатсыздыгын жоюшту."},{"t":"p","h":"Бирок араб алфавити кыргыз тилинин тыбыштык өзгөчөлүктөрүн толук чагылдыра алган эмес, б. а., бир эле тамга сөз башында, сөз ортосунда, сөз аягында ар башка жазылып, анын асты, үстүнө коюлуучу кошумча белгилери көп болгон. Мунун өзү окуу, жазуу ишин өтө кыйындатып, кыргыз тилинин фонетикалык өзгөчөлүктөрүн толук көрсөтө алган эмес. Ошондуктан 1925-жылы май айында болуп өткөн мугалимдердин тунгуч съездинде араб тамгасына караганда колдонууга жеңил болгон латын тамгасына өтүүнүн зарылдыгы талкууланган. Бул маселенин курч коюлушунун дагы бир себеби, ошол кезде көп элдер латын алфавитине өтө баштагандыктан анын да алдыңкы жактары болгон."},{"t":"p","h":"Араб тамгасын кыргыздар 1928-жылга чейин пайдаланып, андан кийин латын жазуусуна өтүшкөн."},{"t":"p","h":"Араб жазуусунда төмөндөгүдөй кемчиликтер бар эле:"},{"t":"p","h":"– араб алфавитинин курамында үндүү тамгалар, ичке үндүүлөр жетишсиз эле;"},{"t":"p","h":"– бир эле тамга сөз башында, сөз ортосунда, сөз аягында ар түрдүү жазылган;"},{"t":"p","h":"<span class=\"pg\" data-n=\"72\">72<\/span>– араб алфавитинин оңдон солго карай жазылышы жазууну татаалданткан;"},{"t":"p","h":"– алфавиттин курамындагы 24 тамга кыргыз тилинин тыбыштык өзгөчөлүгүн толук тейлей алган эмес."},{"t":"h3","h":"АРАБ АЛФАВИТИ"},{"t":"img","src":"data:image/webp;base64,UklGRvxwAABXRUJQVlA4IPBwAADQTwKdASqAAuMCPrVQo0ynJKeoJBHtUQAWiWluSEOd7+1Xn79wvujLZ+cwv/eeVt6PoEfyeC3/I87f5Pz/GBfnf+RLIRQfUQhUmtw/CEPj4QhZXm1tVX1h6JPKKI1hl4hn7KeB3+o/3P5iekP459m/ov79+5n+T93K4B/Uf+H0P/mH4o/b/4r8jPfT/z+SfzB/2fUO/MP6p/qP2M/Yr1md08Ab9E/vHjXfg+gv5x/p/YH/ovoh43dBf/L//r1Wv9n0Hfmn/A/bD3NP8MVjQnKROIHF+6BcgP77CM5SJtckWazEO59DpA9lWi5JAg++VtBGeI0bD1QtN/D8WtPzcFgEJwic/rShtDDTR2bkDbBD1i6A5lfcZyB+BSjObF+utsPkckrU96oDgKWoXphywRmASUpFCbUYorBCA49I8ARTby239+uBf7hHC8B9TObU7/niWR1VA0+03u1/7MBfOP9WTTIwC18R0mtbsAtU4ju41gfM4DYH0HZhQj1MJ1XLXdx3qswqHwDQP2YFmFzsUwY7uzZzaF9eIxETdnNCIk/aDJfzgAK9+3fZCmdqmlkSDC897GBQKviqn9guZnKjZahP4UsVFPbaCDud3EjmvtWbTCNhX+2oLzRP4DXZ6dE//J1lW/l1DcBXMNecEoMwfAcFQfd1bL3KBNKMC1pS48kc93Sg9H6RTwemh6yplDZGIboyZVnC7N1K/1UZtUINXGvKsAKFt91pyyrZtExarcSHDO6RLrS3g4fPB3SDKUd8JYn2PLumvbYvdg+dvuk9vfXzUdjFwM/BK2vhoQ4FHTGfkdhcyzIozXAUY2Eh3hmBw7IifY6mH76vjnxHZmWW6zw0JjhkiF4RVyay4CEOwmPssNicdHN4lDvkoWFqJJLUBF5TldxioUzdkGcqIbcNzRzKIqFfsW7ZPbgXC7ej8U/BSAQh2oZAe/rrGoVgIVHbmvNjxrhso73jbDAJF9b7Zb5LReP/CeJeS4074vW3CbJXBZKkkaFpO02Q+u6BvEl41n6aqVEFsor6mEIITJQtvHPvM4bWF3f2wTrRz4imC8fbDEk0VPJqyhDiR+bQjpdSubxrOdY2U/jIafh/gguj8FligmuRtg87G905E5aLi9kMAoRyl1MWBO7PV5UsPlwvYccvjFCzhkXb0iyqq5j0nzPpVqXIqJQkvZro26DoUibpkiub33kshHxLLk4a6vM6GhCzcjlmbYAJ7dCHKhFTSEQ/IE+J3I оорунда гана такай колдонулган. Орто кылым доорунан тартып латын жазуусу көпчүлүк Европа тилдерин, азыркы учурда Африка, Американын бир катар жана азиянын айрым тилдерин тейлейт."},{"t":"p","h":"1929-жылдан баштап кыргыз эли латын графикасына өткөн. Чынында бул жазууга өтүүнүн кыргыз тили үчүн бир топ жакшы жактары бар эле. Атап айтканда, кыргыз тилиндеги тыбыштарды латын тамгалары менен туюндуруу ыңгайлуу болгон. Экинчиден, мурдагы араб алфавитиндеги тамгалардай сөз башында, ортосунда, аягында ар түрдүү жазылыштарга байланыштуу кыйынчылыктардан арылды. Анын кыргыз тили үчүн оңтойлуу болгондугунан ошол учурдагы оор абалга карабастан калайык-калк бул алфавитти тез эле өздөштүрүп алышкан. Кыргыз эли 1927-жылдан 1940-жылдарга чейин латын жазуусун колдонгон."},{"t":"p","h":"1926-жылы мартта Бакудаөткөрүлгөн туркологиялык съездде латын алфавитине өтүү үчүн анын долбоорун иштеп чыгуу жагы республикалардын жаңы Алиппе комитетине тапшырылат."},{"t":"p","h":"1926-жылы 22-ноябрда «Крестьянская путь» газетасына кыргыздын жаңы алфавити жөнүндө жарыяланган макалада бул маанилүү милдетти турмушка ашыруу үчүн областтык аткаруу комитетинин алдында атайын комитеттер түзүлүп, анын төрагасы болуп Т. Орозбеков дайындалганы айтылган."},{"t":"p","h":"1928-жылы латын алфавити менен «Жаңы маданият жолунда» журналынын биринчи саны, «Алиппе», «Эне тили», «Жаңылык» сыяктуу алгачкы окуу китептери чыга баштайт. Кыргыз АССРинин <span class=\"pg\" data-n=\"74\">74<\/span>Борбордук Аткаруу Комитетинин Президиумунун токтомунда: «1930-жылдын 1-январынан баштап, республиканын территориясында өндүрүштүн бардык тармактарынан араб алфавити колдонуудан таптакыр алынып, латын алфавити менен алмаштырылсын» деп көрсөтүлгөн."},{"t":"p","h":"Кыргыз элинин сабатсыздыгын жоюп, жазуусун өнүктүрүп, маданиятын жогорулатууда латын алфавитинин аткарган ролу өтө чоң болду. Бирок кыргыз тилинин лексикасы орус жана интернационалдык терминдер менен байып, илимдин жана техниканын дүркүрөп өскөн мезгилинде латын алфавити эми өз"},{"t":"h3","h":"ЛАТЫН АЛФАВИТИ"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Баш тамга<\/td><td>Кичине тамга<\/td><td>Аталышы Айтылышы<\/td><\/tr><tr><td>А<\/td><td>а<\/td><\/tr><tr><td>В<\/td><td>бе<\/td><\/tr><tr><td>С<\/td><\/tr><tr><td>р<\/td><\/tr><tr><td>Е<\/td><\/tr><tr><td>Е<\/td><\/tr><tr><td>С<\/td><\/tr><tr><td>Н<\/td><\/tr><tr><td>1<\/td><\/tr><tr><td>к<\/td><\/tr><tr><td>О 5 т 7, В у х Г, Р<\/td><td>ЖЫЛ: ДЖ: Ж®- Йыш „сый – уы. КЧ КЛ \"Ж А. -<\/td><td>зета икс ипсилон<\/td><\/tr><tr><td>М<\/td><\/tr><tr><td>М<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"75\">75<\/span>милдетин толук өтөй албай калды. Ошондуктан орус алфавитине өтүү зарылдыгы пайда болду, анткени орус тили кыргыз тилин байытуунун булагы болуп калган. Ал жөнүндө профессор Б. М. Юнусалиев мындай деп жазат: «Азыркы кыргыз тилинин сөздүк курамы революцияга чейинкиге салыштырганда сан жана сапат жагынан өсүп, көп түрдүү болуп калды. Ушунун аркасында кыргыз тилинин сөздүк курамы салыштыргыс түрдө байыды жана маанилүү болуп калды. Бул орус тилинен зор өлчөмдө үзүлбөй кирип жаткан лексикалык сөздөрдүн жардамы аркасында мүмкүн болду»."},{"t":"p","h":"Ошентип, убакыттын өтүшү менен мурда кыргыздын жазуусун өнүктүрүүдө чоң роль ойногон латын алфавити жаңы шартта турмуштун талаптарына толук жооп бере албай калды. Анын үстүнө ошол кезде бир катар түрк элдери орус алфавитине өтүп, азербайжан, татар, казак республикалары жаңыдан өтүү жөнүндө маселе козголуп жаткан эле. 1939-жылдан тартып кыргыз жазмасын орус алфавитине өткөрүү жөнүндө басма сөздөрдө кеңири талкуу жүрө баштады."},{"t":"p","h":"Латын жазуусунун кемчиликтери төмөндөгүдөй:"},{"t":"p","h":"– латын алфавити орус тилинен өздөштүрүлгөн жаңы сөздөрдү, саясий-коомдук терминдердин туура жазылышын камсыз кыла алган эмес;"},{"t":"p","h":"– бир эле сөз орус тилинде да, кыргыз тилинде да ар башка жазылган;"},{"t":"p","h":"– бир эле республикада эки алфавиттин (латын, орус) колдонулушу полиграфиялык иштерде кыйынчылыкка алып келген."},{"t":"h3","h":"§ 15. ОРУС ЖАЗУУСУ"},{"t":"p","h":"Орус алфавити – орус улутунун тилинин тыбыштык курамын туюндуруучу графикалык белгилердин иреттүү катары. Орус алфавитинде жумшартуу <span class=\"pg\" data-n=\"76\">76<\/span>белгиси (ь), ажыратуу белгиси (ъ) бар. «Алар өз алдынча тыбышты туюнтпайт: «ь» жумшартуу белгиси өзүнөн мурунку тыбышты жумшартып айтуу үчүн, ал эми «ъ» ажыратуу белгиси сөздөрдү ажыратып айтуу керектигин эскертет. Орус алфавитинин башаты – кириллица. Ал Петр Інин реформасынан кийин киргизилип, ар кандай өзгөрүүлөр менен азыркы орус алфавити түзүлгөнгө чейин колдонулган. Орус алфавити Орто Азия элдеринин көпчүлүгүнүн алфавиттерин, анын ичинде кыргыз элинин алфавитин түзгөнгө негиз болгон."},{"t":"p","h":"Кыргыз эли 1941-жылдан баштап, 36 тамгадан турган орус алфавитине өткөн. Кыргыздарда буга чейин болбогон е, ё, я, ю, ц, ш, ъ, ь, х тамгалары киргизилген. Ошондон баштап бүгүнкү күнгө чейин ушул алфавит колдонулуп жатат."},{"t":"p","h":"Орус алфавитине өтүү жөнүндөгү алгачкы макала кыргыз тилинин жана жазуусунун илим-изилдөө институту тарабынан жазылды. Анда орус алфавитине өтүүнүн зарылдыгы көрсөтүлүп, анын негизги шарттары айтылган. Бул сунушту Кыргызстандын коомчулугу кызуу тосуп алышты. Ушундан тартып жаңы алфавитке өтүү жөнүндө газета-журналдарга бир катар макалалар жарыяланып, атайын чогулуштар өткөрүлдү."},{"t":"p","h":"Орус алфавити дүйнө боюнча бай алфавиттердин бири. Аны ар кандай улуттардын тилдеринин муктаждыктарын канааттандырууга мүмкүнчүлүгү бар. Орус алфавитине негизделген полиграфиялык базасы да бай болуп, алдыңкы техника менен жабдылган. Орус графикасына өтүү улуттук басма ишин жолго коюуга, аны өнүктүрүүгө толук мүмкүнчүлүк түздү."},{"t":"p","h":"Орус графикасына өтүүдөгү дагы бир жеңилдик – орус тилин тез үйрөнүү үчүн алфавиттин биримдигин туура пайдалануу. Кыргыз тилинин сөздүк курамын байыткан илим, техника, экономика, саясатка байланыштуу турмушта кеңири колдонулуп жаткан термин сөздөрдү эки тилде бирдей жазууга <span class=\"pg\" data-n=\"77\">77<\/span>жана туура окууга мүмкүнчүлүк берет. Ошондуктан орус тилинин аз убакыттын ичинде башка улуттардын экинчи тили деп аталууга чейин жетишине ал-"},{"t":"h3","h":"ОРУС АЛФАВИТИ (КИРИЛЛИЦА)"},{"t":"img","src":"data:image/webp;base64,UklGRrKpAABXRUJQVlA4IKapAADQngKdASqAAgADPrVUokynJKcrJpL8wWAWiWluTCl2P8zyE/CH4N9Odb3ZMJN5gn/ZEexn/U811Af0H/O4T0R1dxpNsPYvE9yZ8DDsN0qX+T3piAXhQ85tqh+vvRJ9RP/T5ZiPwBfAP3m/zn5Ee9v43/O/6L++ftv6J/jH1L+N/uv+R/3f9++Pj8z/xuvp+9P8r/M+pv8o+8H6D+7f57/2f3r3e/4/+V/Ib11+Rf+F/kfyW+Qj8o/pH+c/uX4/fJd9b/4u7N3z/a/tP7Bftb9b/8v+Y8/743/of5T/Te0H53/f/+d/hPyp+wH+Xf1f/lf332s/6ni1/lf+t7A/9f/3vqsf4n/v/1/+39kv6B/tP/r/pPgV/on+I/8H+K/0Rcjx1hsn7ObOncJu55gF2MKKhe0iTuWbto8OBsdBk1TuI9wqNmhaD7T/t9QZfsT1///FcJ9Lnl474lH3B+eNK/tkoDuZwtsJHqeFfhvFIcxs9QT9RTnax2C1ekOWldfOB6kWtjEFpxXyk7qwWNkIiANA9yadCGucqZWBkB3yapbX2Bk50egNOK+oZENpHTC6xTgUKfwRwqJMqT7+h+FDK9sSiVyGVZ4ol9EhLPggkS/p6BX0YxdjAnOtucAtIMcsgqRC1LV8CCXhowNdsoAJejR5Cpgex2GMFMq+HRiTJSmtQKjRhTpwgTcAqsMbYxOfGhudvdsTYLunkIa2w87uRl17DLrTDoI/LFr6aGFFOMS8bEZ4QvP5GTJZKNd9lpIww9fCQM3s97jAXrYRAdUoV362Id2hhPlfQYxCrVKO2pSCLXZkW1W2gsvT3ylRQ+4DbmAdNWd6jFY+gOqe0gJDMMvj4FGT7d5EorTzsu5aaj3rs6u7rLo9bAViGZii5GQsUYXiY8K6Ys4EvyN5UBQ2tUe42Lu30fleTdP8vgz1rSb85qQYphHiGT983NmaKDK8dzhMBvGGIZkeIO2li/XBxHkAFxD4iQMI2SRDGsipwGYIpnh6GZLQJcahS/pIxYoioxOz+wnZB36c/LU1jiw2m75qZZIzBpCFRpn2Q7aGgWP8kOq889V6yx2ZDZnkUfqMb3KcPHaeCEr+vEt7k/NYhp4L+qrIQ0y4rOHajsrcHaDgDDcL0hATbyoJ9rVky/zWcvBgWnXzDLEV5NUa6Uby8rbrJvlzc/igAXDsHMWI7dAfzTyh/+U9+TtFLMym9W83mLrXux7cCRsB5uF8meUl93Yeq8dgUwQ/xnk4d5oJ9opkq+UFxeQReIP4kl28ld2to1SDAasPwNTdw4iB4EfWZD4VWU+8364BJKsrKSF2W98oljo/UXVPdGLKwZ5litFyK0Vu9fHcPb6OPmg0nd2DjNpdL8jyxwFC7IEySivcGEuXfh5mwQfpWyMw6PXaX796z/SXq8AwKmurwJ1N9VpaHHhyOjdztR/m8mG+60mK5IPKrGah87LzAzqJAYNqsJwJkxY5vSp94zdkkoEunMNNjwBg/52J2lPy0X+hpD4UY9pZxZeP53jwi2kbo4FwGYGpw85hJEQUgaTbT0+C5/3eQeM3Mmb3tqzeBFvU5hUph0Sd/NguHooFavwlXw6f71GzamPkwFdpOBKeGM9yWMkeVtiPH4ayxD6Q3T/IyurvHHeTIC/k7GToyfDV4hpeZwoCrBBW8OMqvMQsSbCLft2c47/7ble ble><tr><td>Тамгалардын<\/td><td>Тамгалардын<\/td><td>Тамгалардын Тамгалардын<\/td><\/tr><tr><td>жазылышы<\/td><td>айтылышы<\/td><td>жазылышы<\/td><td>айтылышы<\/td><\/tr><tr><td>Аа<\/td><td>а<\/td><td>Пп<\/td><\/tr><tr><td>Бб<\/td><td>б<\/td><\/tr><tr><td>ажыратуу<\/td><\/tr><tr><td>белгиси<\/td><\/tr><tr><td>ы<\/td><\/tr><tr><td>ичкертүү<\/td><\/tr><tr><td>белгиси<\/td><\/tr><tr><td>э<\/td><\/tr><tr><td>юу (йу)<\/td><\/tr><tr><td>я (йа)<\/td><\/tr><\/table><\/div>"}],"sub":[{"title":"ОРХОН-ЕНИСЕЙ ЖАЗУУСУНУН ТАМГАЛАРЫ","b":6},{"title":"§ 13. АРАБ АЛФАВИТИ","b":8},{"title":"АРАБ АЛФАВИТИ","b":22},{"title":"§ 14. ЛАТЫН АЛФАВИТИ","b":24},{"title":"ЛАТЫН АЛФАВИТИ","b":31},{"title":"§ 15. ОРУС ЖАЗУУСУ","b":39},{"title":"КЫРГЫЗ АЛФАВИТИ","b":56}],"section":"КЫРГЫЗ ЭЛИ КОЛДОНГОН ЖАЗУУЛАР","pages":[68,79]},{"title":"§ 16. ФРАЗЕОЛОГИЯ ЖӨНҮНДӨ ЖАЛПЫ МААЛЫМАТ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"80\">80<\/span>ФРАЗЕОЛОГИЯ ЖАНА КЕП МАДАНИЯТЫ"},{"t":"h3","h":"§ 16. ФРАЗЕОЛОГИЯ ЖӨНҮНДӨ ЖАЛПЫ МААЛЫМАТ"},{"t":"p","h":"Биздин кебибиз сүйлөмдөрдөн турат. Сөз, сөз айкаштары, анын курулуш каражаттары. Ошол каражаттар менен түзүлгөн сүйлөмдөр аркылуу оюбузду башка бирөөлөргө туюндуруп, толук пикир алышууга жетишебиз. Оюбузду түшүндүрүү, адатта, сүйлөмдөргө камтылган сөздөрдүн, сөз айкаштарынын лексикалык тике мааниси аркылуу ишке ашат."},{"t":"p","h":"М исал ы: кол, таш, жылдыз. Бул сөздөр затты туюндурууда. Ал эми колу узун, катуу таш, жарык жылдыз десек, заттын сын-сыпаты жөнүндө маалымат алабыз. Кээде кебибизде колу чүрүш, таш боор, жылдызы жарык, жүрөгү алкымына капталды, жургөн жерине чөп чыкпайт, сиркеси суу көтөрбөө д. у. с. сөз айкаштары жолугат. Эгерде булардын тике маанисин көңүлдүн борборунда тутсак, сөзүбүз чындыкка коошпой калат. Анткени мындай сөз айкаштары алгачкы маанилеринен алыстап, айтайын дегенибизди элестүү кылып, оюбузду өзгөчө туюндурат. Алар бир нече сөздөрдүн түрмөгүнөн турса да, бир мааниге ширелишип, өзүнчө бирдикти түзүп, тилибизде көркөм каражат катары кызмат аткарат."},{"t":"p","h":"М исал ы: колу ачык (март, берешен), каш кабактын ортосунда (күтүүсүз), бешиктен бели чыга элек (жаш), көз ачып, жумганча (тез), кесип алса кан чыкпайт (сараң), колтугуна суу буркцу (тукуруу), жунун жейт (көп), ит өлгөн жерде (алыс), кара кылды как жарган (адилет, калыс), жылан сыйпагандай (такыр эч нерсе калбоо) д. у. с."},{"t":"p","h":"Мындай сөз түрмөктөрү сүйлөм ичинде туруктуу формасын сактап, кебибизде даяр форма катары <span class=\"pg\" data-n=\"81\">81<\/span>колдонулат. Алар эркин сөз сыяктуу ар түрдүүчө өзгөрүп, ар башка сөздөр менен айкаша бербейт. Тилибиздеги мындай туюнтмалар фразеологизмдер деп аталат. Фразеологизмдерди окутуп-үйрөтүүчү илим – фразеология деп аталат. Бул термин гректин (туюнтма) жана [050$ (сөз, илим) деген сөздөрүнөн алынган."},{"t":"p","h":"36. Төмөнкү сүйлөмдөрдөн фразеологизмдерди таап, алардын маанисине кандайча түшүнгөнүңөрдү айтып бергиле."},{"t":"p","h":"1. Түн бою кирпик какпай таң атырды. (Ч. Айтматов) 2. Жар түбүндө жаткан буурасын көрүп, Казангаптын жанына баткан экен, түнөрүп келип, Эдигейге мурду менен бир тийди. (Ч. Айтматов) 3. Мунун баарын маңдай тер, таман акыңардан табылган акчаңарга сатып алдыңар да. (3. Сооронбаева) 4. Жоомарт адамдын колу ачык, жылдызы жарык эмеспи. (А. Токомбаев) 5. Кай-кай жерде биздин Ысакка окшогон чолоктор калбаса, мурду менен тынып, буту менен баскандардын баары майданга кетишпедиби. 6. Кийимди эмне кыласың? Же аяктан жаңы жыл тоспосоң. Айылда принцче кийинсең, балдар сени өпкөсү жок мактанчаак деп эрмектешпейби? – деди атасы. (К. Жусупов) Т. Мына ушундай учурда өз көмөчүнө күл тартып, өз максатына гана чаба турган болсо, мейли хан болсун, мейли бек болсун, ал эл безери деп бааланат. (Т. Касымбеков) 8. Өзү иштен качкан ак каптал, бирок сүйлөсө тили буудай куурат. 9. Дилде менен Айгеримдин оту күйүшпөгөнүн Абай мурда эле сезген. (М. Абдукаримов) 10. Ажардын жаны жер тартып, кирпигинен тартса жыгылчудай болуп, бутун шилтесе эле мүдүрүлөт. (К. Баялинов) 11. Ырасын айтсам, Нэпманды желкемдин чуңкуру көрсүн. (А. Токомбаев) 12. Кээде Жунус экөөбүз карандай суу ичип, тишибиздин кирин соруп жаткан күндөрүбүз болгон. 13. Кара жанын карч уруп иштеген киши, эмгегинин үзүрүн көрбөй койбойт. (Т. Сыдыкбеков)"},{"t":"p","h":"<span class=\"pg\" data-n=\"82\">82<\/span>Тилдин башка бирдиктериндей эле фразеологизмдердин табиятын аныктоочу өзүнө тиешелүү жактары бар. Ошолорго таянып, фразеологизмдерге төмөндөгүдөй аныктама берилет."},{"t":"p","h":"Кепте (речибизде) дайыма даяр материал катары колдонулуп, эки же андан артык компоненттен турган, маани жактан ширелишип, лексикалык бир бүтүндүккө айланган, образдуу сапатка ээ туруктуу сөз түрмөктөрүн фразеологизмдер деп айтабыз. Мисалы: Ак каптал, ала көөдөн, ат тезегин кургатпай, бети калың, бөйрөктөн шыйрак чыгаруу, жең ичинен, жылдызы жерге тушуу, иттен чыгаруу, кара жаак, кабыргасы кайышуу, казаны оттон түшкөн, кулагы жок, колу туткак, мурдун тарта албаган, оту куйцшпеген, тил эмизцү, мурдун көтөргөн ж. б."}],"sub":[],"section":"ФРАЗЕОЛОГИЯ ЖАНА КЕП МАДАНИЯТЫ","pages":[80,82]},{"title":"§ 17. ФРАЗЕОЛОГИЗМДЕРДИН МҮНӨЗДҮҮ БЕЛГИЛЕРИ","blocks":[{"t":"h3","h":"§ 17. ФРАЗЕОЛОГИЗМДЕРДИН МҮНӨЗДҮҮ БЕЛГИЛЕРИ"},{"t":"p","h":"Тилдин башка бирдиктериндей эле, фразеологизмдердин да езуне мунездуу белгилери бар. Аларга теменкулер кирет: а) кепте даяр материал катары колдонулушу; б) компоненттуулугу (тугейлештугу);"},{"t":"p","h":"в) маани жактан ширелишип, лексикалык бир бүтүндүккө айланышы; г) образдуулугу; д) туруктуулугу."},{"t":"p","h":"1. Фразеологизмдердин кепке даяр материал катары колдонулушу. Фразеологизмдер кепте, сөз жүрүп жаткан учурда, мурдатан калыптанган формасында даяр материал катары колдонулат."},{"t":"p","h":"М исал ы: – Ээ, Кенжеш, агаларыңа керээз айтсам укпады. Укпаган соң, күйбөгөн жерим кул болду. Алардын келечегин ойлоп кабыргам кайышты. Биз сиздерди канаттууга кактырбай, тумшуктууга чокутпай өстүргөн элек. Эми минтип бир аягыбыз төрдө, бир аягыбыз көрдө болуп турганда, силерге айтар керээзибиз, отцунучубуз бар эле, аны агаларыңа айтсак, моюндарын толгошту."},{"t":"p","h":"<span class=\"pg\" data-n=\"83\">83<\/span>– Ата, айтыңыз мага. Мен сиздердин керээзиниздерди угам, айткандарыңызды аткарам. Убада берем, ата! Сиздердин өтүнүчтү төбөм менен жер казып журуп аткарам. Айтыңыздар. (Ж. Мукамбаев)"},{"t":"p","h":"Жогорку сүйлөмдөрдөгү фразеологизмдер дээрлик ушул калыбында учурап, кепте даяр материал катары колдонулат. Алар башка сүйлөмдөрдө да ушул формасын бузбайт."},{"t":"p","h":"2. Фразеологизмдердеги компоненттүүлүк. Жылдызы жарык, колу ачык, жону жука, ак каптал, бармагын тиштөө. Бул фразеологизмдердин ар бири эки компоненттен куралгандыгын көрүп турабыз. Аларды эки сөздөн турат деп айтуу туура эмес. Анткени ар бир сөз өз алдынча мааниге ээ. Фразеологизмдердин тутумундагылар өз өзүнчө эмес, бири-бири менен биригип, баары чогуусу менен бир маанини берип, бир гана түшүнүктү туюндурат. Ошондуктан фразеологизмдин тутумунда турган элементтер сөз эмес, анын компоненттери (түгөйлөрү) деп аталат."},{"t":"p","h":"Фразеологизмдер эки, үч, төрт, кээде андан ашык компоненттерден турат: төбөсү көккө жетуц, ала жипти аттабоо, беш өрдөгүн учуруу, арасынан кыл өтпөө, колтугуна суу буркин, ээрдин кашын таанытуу, жаны көзүнө көрүнүү, кулу додо болбоо д. у. с. Булар үч компоненттүү экендигин көрүп турабыз. Ал эми төмөнкү мисалдар төрт компонентке ээ: кара кылды как жаруу, кой устунде торгой жумурткалоо, төбөсү менен жер казуу, ичине кара таруу айланбоо, кой оозунан чөп албоо, биттин ичегисине кан куюу, жүрөгүнүн сары суусун алуу д. у. с."},{"t":"p","h":"Мындан көп компоненттерден турган фразеологизмдер да кезигет. Аларга төмөнкүлөрдү кошууга болот: оозуң кайсы десе, мурдун көрсөтцү; бир аягы төрдө, бир аягы көрдө; жеңилдин асты менен, оордун устц менен журиуц; как эткен карга, кук эткен кузгун жок д. у. с."},{"t":"p","h":"<span class=\"pg\" data-n=\"84\">84<\/span>Жогоруда келтирилген мисалдар фразеоло- гизмдердин эки же андан артык компоненттерден тургандыгын, тактап айтканда, алардын компонент- түүлүгүн ырастап турат."},{"t":"p","h":"37. Текстти окуп, анда колдонулган фразеологизмдерди тапкыла. Алардын канча түгөйдөн тургандыгын аныктагыла."},{"t":"p","h":"Түндүн биринчи жарымы күндөгүдөн да көзгө сайса көрүнгүс. Ай түн ооп барып, тетиги карарган кыр арканын чокусунан чыгат."},{"t":"p","h":"Сугат үчүн түн эң жакшы убак. Сабырбек кирпик көзүн какпай, сугаттын кандай жүрүп жатканын текшерип жүрдү. Баары өз ордунда. Бир убакта:"},{"t":"p","h":"– Сабырбек байке, оо Сабырбек байке-е – деген үн таш жарып чыкты. Жүрөгү оозуна тыгыла түшүп, анан өзүн токтотту да:"},{"t":"p","h":"– Эмне болуп кетти, мен мындамын – деп, үн салды Сабырбек."},{"t":"p","h":"– Суу жок. Суу соолуп баратат! – деп, сугатчылардын бири буту күйгөн тооктой чебеленип чуркап келди. Сабырбек жылаңач төөнү шыйракка чапкандай, көз ачып-жумганча чоң арыктын боюна жетип барганда, ары жактан дагы бирөөнүн кыйкырыгы угулду."},{"t":"p","h":"– Ой, мурап, суу кана? Суу жок!"},{"t":"p","h":"Чын эле азыр гана шаркырап агып жаткан суу жок. Арык бир заматта жылан сыйпагандай болду да калды. Капырай, бул эмнеси, – деп, Сабырбек таң калды. Анан каналдын бир жерин суу алып кеттиби деген ой келгенде, дагы төбө чачы тик турду. Мына, Сабырбек ал каналдын боюна да жетип келди. Көзүң жамандыкты көрбөсүн, Сабырбектердин арыгына суу берилчү алыштын оозундагы чен тосмо төмөн түшүрүлүп жабылган да, Каратайдын алышынын чен тосмосу аябай өөдө көтөрүлгөн..."},{"t":"p","h":"Сабырбек атынын канжыгасында дайыма байланып жүрчү чоң бурама ачкычын алып келди да, өз арыгынын чен тосмосун көтөрө баштады. Аңгыча аяк астынан:"},{"t":"p","h":"<span class=\"pg\" data-n=\"85\">85<\/span>– Тарт колуңду, болбосо азыр акеңди таанытам! – деген үн чыкты..."},{"t":"p","h":"Каратай арбаң-арбаң этип, бир-эки аттаганда эле Сабырбекке жакындап келди."},{"t":"p","h":"– Жогол, көзүмө көрүнбө! – Көзүнөн чаары чыккан Каратайга Сабырбектин теңелгиси келген жок. (Ч. Айтматов.)"},{"t":"p","h":"3. Фразеологизмдердин маани жактан ширелишип, лексикалык бир бүтүндүккө айланышы. Фразеологизмдердин тутумундагы компоненттер маани жактан ез ара ширелишип, лексикалык бир бүтүндүккө айланат. Алар ездерунун алгачкы лексикалык маанилеринен толук же жарым-жартылай алыстап, фразеологиялык бир мааниге биригет. Натыйжада, лексикалык бир бүтүндүккө айланып, бир сөзгө синоним болууга чейин жетет."},{"t":"p","h":"М исал ы: колу ачык – март, берешен; жылдызы жарык – суйкумдуу; бармагын тиштөө – өкүнүү; төбөсү көккө жетуу – кубануу; арасынан кыл өтпөгөн – ынтымак; кой оозунан чөп албаган – момун, жоош; оозуң кайсы десе, мурдун көрсөткөн – аңкоо."},{"t":"p","h":"Бул фразеологизмдердин компоненттери өз ара маани жактан бири-бирине ширелишип, бир гана түшүнүктү туюндуруп, лексикалык бир гана бүтүндүктү түзүп жатат. Алсак, төбөсү көккө жетти десек, кимдир бирөөнүн төбөсү көккө бийиктеп, анын асманга жетип, көккө тийип турганын түшүнбөстөн, кимдир бирөөнүн кубанычын түшүнөбүз. Бул фразеологизмдин үч компоненти тең өз ара маани жактан ширелишип, лексикалык бир бүтүндүккө айланып, кубанды деген маанини билдирип калды. Алардын курамын ой келди өзгөртө берүүгө болбойт. Мурдатан калыпка түшүп, кебибизде даяр материал катары колдонулуп келе жаткан мындай туюнтмалардын компоненттерин сан жактан ыксыз өзгөртө берүү же алардын ордун алмаштыруу фразеологиялык маанинин <span class=\"pg\" data-n=\"86\">86<\/span>бузулушуна алып келет. Алсак, териси тар дегенди эти тар десе, ачуусу чукул, урушчаак кишини элестетүү мүмкүн эмес. Куурай башын сындырбоо дебестен, куурай сындырбоо же башын сындырбоо десек, андан иш кылбаган жалкоону элестете албайбыз. Тың, чыйрак, шайдоот өспүрүмдү сыпаттоочу биттин ичегисине кан куйган деген фразеологизмдин компоненттеринин бирөөнү эле өзгөртсөк, анда маани бузулат. Анткени алар өз ара бири-бири менен ширелишип, лексикалык бир бүтүндүктү түзүүдө. Мындай ширелишүүнүн натыйжасында алар, көпчүлүк учурда, бир сөзгө синоним болуу деңгээлине чейин жетишет. Анын натыйжасында, фразеологизмдер сүйлөмдө анын бир гана мүчөсүнүн милдетин аткарып калат."},{"t":"p","h":"Эскертуу: фразеологизмдер дайыма лексикалык бир бүтүндүктү түзүп турса да, анын маанисин бир сөз менен түшүндүрүп берүү бардык учурда мүмкүн эмес. Айрым туюнтмалардын маанисин бир нече сөз аркылуу, атүгүл бүтүндөй бир сүйлөмдөрдүн жардамы менен түшүндүрүп берүүгө да туура келет."},{"t":"p","h":"М и с а л ы: камчы салдырбоо – кимдир бирөөнүн кандайдыр бир иште тыңдыгын, бирөөнүн жардамысыз эле бүтүрө турган жөндөмдүүлүгүн билдирет. Аны чыйрак, тың деген сөздөр менен эле түшүндүрүп койсок, айтылуучу ой толук чагылбай калат. Эки аягын бир өтүккө тыгуу – бул кимдир бирөөнү абдан ыңгайсыз абалга коюу, айласын кетирүү. Ажыдаардын куйругун басып алуу дегенди кандайдыр бир балээлүү ишке кабылуу, күчтүү, каардуу бирөөнүн ачуусуна тийүү деп түшүнөбүз."},{"t":"p","h":"38. Төмөнкү сүйлөмдөрдөн фразеологизмдерди таап, алардын канча компоненттен тургандыгын тактап, маанисин оң жак четте жазылган сөздөр аркылуу түшүндүрүп бергиле."},{"t":"v","l":["<span class=\"pg\" data-n=\"87\">87<\/span>Азыр ак төөнүн карды жарылган кез.","Аялдар – биздин коомдо чоң куч. Бирок","арасында бар ак кол, ак чүч.","уялуу,","сараң,"]},{"t":"p","h":"Качыке өзүнүн айыптуу экенин сезип, токчулук, Батийнаны көргөндө башы жерге кирди. Жүрөгүндө оту бар жигиттер өз ыктыярлары менен катталып жа-"},{"t":"v","l":["тышты.","Катачылыгын кеч тушцнуп, бармагын","тиштеди."]},{"t":"p","h":"калп айтуу, жалкоо, кайраттуу."},{"t":"v","l":["Же бул беш өрдөгүн учуруп жибердиби – (өткүр),","деп, кумен санап турдум.","Чычканга кебек алдырбаган немелерди","качанга чейин имерчиктейбиз."]},{"t":"p","h":"Дилде менен Айгеримдин оту куйушпөгондугун Абай башта эле сезген."},{"t":"p","h":"Кылдан кыйкам, жумурткадан кыр ынтымак-"},{"t":"v","l":["сыздык,","(араз","дашуу),"]},{"t":"p","h":"капаланиу, көрө тапчу Тулкиубек бул жолу да өзүнүн ким албастык, экендигин көрсөттү."},{"t":"p","h":"Териштире келсек, ал бир топ эле би-"},{"t":"v","l":["лимдцц адам экен. Бирок анын ичине","таруу айланбаган мүнөзү бизди тан","калтырды.","Абдыракманды көргөн сайын бечара","Батийнанын жылдызы жерге тушип...","өксүйт.","(арман),"]},{"t":"p","h":"кыйкымчыл"},{"t":"p","h":"4. Фразеологизмдердеги образдуулук. Фразеологизмдер жөнөкөй сөзгө караганда айтылуучу ойду элестүү туюндуруучу өзгөчөлүгү менен айырмаланат. Мисалы, араларынан кыл өтпөйт дегенде, бизге эки кишинин ортосунун жакындыгы, башка эч нерсе тоскоолдук кылбагандыгы, экөөнүн бири-бирине абдан жакындыгы элестейт. Ушундан-улам эки кишинин ынтымактуулугунун, ынактыгынын элеси тартылат. Ал эми ачып көздү-жумганча же көз ачып-жумганча дегенибизде кандайдыр бир иштин, кыймыл-аракеттин тез, бир заматта болуп өткөндүгү элестүү тартылат. Кой оозунан чөп албаган деген фразеологизм жоош, момун адамдын образын чагылдырат. Төрт <span class=\"pg\" data-n=\"88\">88<\/span>түлүк малдын ичинен эң эле жоошу кой эмеспи. Ошол малдын мүнөзүнө ылайык, айрым адамдардын мүнөзү салыштырылып, ал аркылуу жоош адамдын элеси берилүүдө. Сараң адам чычканга кебек алдырбаган же битин сыгып, канын жалаган деген туюнтмаларда эң эле элестүү, таамай берилген. Мындай образдуулук төмөнкү фразеологизмдерден да ачык байкалып турат. Төбө чачы тик туруу; жүрөгү оозуна капталуу; камырдан кыл суургандай; көзгө сайса көрүнгүс; кулагынан кун көрүнүү; ооз ачпоо; тилин тишине катуу; уруп чыгар ити жок; чычкан мурду өткүс; эне сүтү оозунан кете элек д. у. с."},{"t":"p","h":"Фразеологизмдердеги образдуулук дайыма эле ачык боло бербейт. Анткени айрым учурда алардын компоненттери өзүнүн алгачкы лексикалык маанилеринен абдан алыстап кеткен. Андай фразеологизмдердин пайда болуу жолдорун толук билбей туруп, андагы образдуулукту байкоо кыйын. Алсак, колтугуна суу буркццу (тукуруу), ыңырчагы ырдоо (жакырлануу, кедейленүү), ала жипти аттабоо (ак ниет) сыяктуу фразеологизмдердин кантип, эмнеге байланыштуу келип чыкканын билбей туруп, андагы образдуулукту туюу мүмкүн эмес. Колтугуна суу буркцу (уруштуруу үчүн болгон аракет, тукуруу) – бул сөз мурун кээ бир элдерде канаттууларды (короз, бөдөнө) уруштуруучу кумар оюндарында колдонулган. Корозду же бөдөнөнү уруштурар алдында канатын көтөрүп, анын ысык колтугуна муздак суу бүркүп, сезимине терс таасир кылып, жинин козутуп, бири-бирине тукурган. Ал көрүнүш кийин адамдарга карата айтылып, бирөөнү бирөөгө тукуруучулуктун образы жаралып отурат. Ынырчагы ырдоо – мурдагы заманда колунда жок кедейлердин жарытылуу ат жабдыктары да болбогон. Алар унаасына токуу үчүн жыгачтарды аштап, көк менен бекемдеп, ыңырчак (токулуучу жабдык) жасашкан. Адам ыңырчакка отурганда ашталган жыгач бири-бирине өйкөлүп кыйчылдап, жагымсыз үн чыгарган. Ошондон улам <span class=\"pg\" data-n=\"89\">89<\/span>ыңырчагы ырдап калыптыр (ыңырчагы ырдаган) деген туюнтманын пайда болгондугу талашсыз. Демек, ар бир фразеологизм, ар түрдүү себептер менен образдуулук сапатка ээ жана ойду таамай, элестүү жеткирүүдө анын мааниси чоң. Алар ушул өзгөчөлүгү менен тилибизде көркөм каражат катары кызмат кылат."},{"t":"p","h":"39. Текстти окуп, анда учураган фразеологизмдерди таап, маанисин түшүндүрүп бергиле. Алардын кепте даяр материал катары колдонулушуна, лексикалык бүтүндүгүнө, образдуулугуна көңүл бургула."},{"t":"p","h":"Төрт баланын кенжеси ата сөзүн эки кылбай, анын күмбөзүн үч түнү күзөтөт. Биринчи түнү: – Ай, бала, сен абийирдүү бала экенсиң. Атаңдын керээзин аткарам деп бул жерде жатасың. Анын сөзүн жерге калтырбаганың – жигиттик. Кокус башыңа иш түшсө, менин керегим тиет. Ме, мобу жалдын бир кылын ал. Керек кезде түтөт. – Ошентип айтып, боз жылкы көз ачып-жумганча көздөн кайым болот."},{"t":"p","h":"Экинчи түнү аяк астынан жээрде жылкы пайда болот. Ал минтет:"},{"t":"p","h":"– Ай, бала, атаң кыйын адам эле. Эл дегенде ала жипти аттабай жүрүп жанын берди. Сен ата сөзүн сыйлап, минтип керээзин аткарып отурасың. Сендей жигитке менин сөөгүм агарды,- дейт. Анан ал да боз жылкынын сөзүн кайталап, жалынан бир тал жулуп берет."},{"t":"p","h":"Үчүнчү түн болот. Бул түнү да бир жылдызы ысык карагер жылкы көрүндү. Жылкы адамча үн салат."},{"t":"p","h":"– Оо, бала, сен ата-энеңдин оту менен кирипсиң, күлү менен чыгыпсың. Ысыгына күйүпсүң, суугуна тоңупсуң. Боорукер экенсиң. Атаңдын сөзүн сыйладың. Агаларың өңдөнүп, өлгөндүн үстүнө көмгөн кылбадың – деп, бул да жалынан бир тал кыл берет. Үч жылкынын айтканы баланын кулагынан кетпейт."},{"t":"p","h":"Арадан жылдар өтөт... Үч агасы жарытымдуу оокат кылышпайт. Кичүүсү гана кара кылды как жарган <span class=\"pg\" data-n=\"90\">90<\/span>калыс болуп чыга келет. Эл берки үчөөнү жек көрүп, арасынан кууйт. Элге батпаган алар кулак угуп, көз көрбөгөн жакка кетүүгө аргасыз болушат. Кенжеси үч агасы жөнүндө ойлонуп, ичкени ирим, жегени желим болот. Акыры аларды издеп, жолго чыгат."},{"t":"p","h":"Ата-энеси бар кезде бетинен кан тамган балдар эми өңдөн азышты. Эң кенжеси малай болуп мал багат. Андан улуусу ашпозчуга кирет. Эң улуу экөө эт менен челдин ортосунда дагы эле тим жүрө беришет. Инилерин кээде «бол-бол, иштегиле» деп койгону болбосо, өздөрү куурай башын сындырышпайт. Бирок зөөкүр агалары инилерин сагалап жүрүшүп, эки боло алышпады."},{"t":"p","h":"Күндөрдүн биринде эң кенжеси баягы жылкылардын жалын түтөтүп, алардын жардамы менен жакшылыкка жетти... Өзүнө тийген байлыкты агаларына бөлүп берет да, мындай дейт:"},{"t":"p","h":"– Ээн талааны гүлдөтүп, иштеткиле. Таман акы, маңдай териңерден гана турмушуңар жакшырып, бактылуу жашай аласыңар. Бирөөнүн бергени силерге түбөлүк кенч болбойт."},{"t":"p","h":"Үч агасы акылдуу инисинин айткандарын кулак төшөп угушуп, ага макул болушат... Анан үчөө тең ата-энесин аябай эстешип, керээзин укпай койгондорун ойлошкондо, ичи жалын, сырты чок болуп, бармагын тиштешет. Акырында:"},{"t":"p","h":"– Атабыз айткан керээздерден эч болбосо, «Эмгек менен эр көгөрөт» дегенди аткаралы дешип, үчөө жапа тырмак ишке киришет. Арадан көп жыл өтпөй, үчөө тең өз каалагандарына баш кошушуп, өз-өзүнчө түтүн булатышып, бактылуу жашап калышкан экен."},{"t":"p","h":"(Ж. Мукамбаев)"},{"t":"h3","h":"<span class=\"pg\" data-n=\"91\">91<\/span>ФРАЗЕОЛОГИЗМДЕРДИН ӨЗ АРА БӨЛҮНҮШҮ"},{"t":"p","h":"Кыргыз тилинде фразеологизмдер өз ара үчкө бөлүнөт. Алар-фразеологиялык ширешме, фразеологиялык бирдик, фразеологиялык тиз ме к (айкаш). Мындайча бөлүштүрүү алардын тутумундагы компоненттердин (түгөйлөрдүн) жеке тургандагы тике мааниси менен жалпы фразеологиялык маанинин ортосундагы жакындыгына, бири-бирине болгон маанилик байланышынын даражасына ылайык аныкталат."}],"sub":[{"title":"ФРАЗЕОЛОГИЗМДЕРДИН ӨЗ АРА БӨЛҮНҮШҮ","b":56}],"section":"ФРАЗЕОЛОГИЯ ЖАНА КЕП МАДАНИЯТЫ","pages":[83,91]},{"title":"§ 18. ФРАЗЕОЛОГИЯЛЫК ШИРЕШМЕ","blocks":[{"t":"h3","h":"§ 18. ФРАЗЕОЛОГИЯЛЫК ШИРЕШМЕ"},{"t":"p","h":"Мааниси тутумундагы компоненттердин алгачкы лексикалык маанилери менен таптакыр байланышы жоктой сезилген фразеологизмдерди фразеологиялык ширешме дейбиз: М и с а л ы: Мурдун балта кеспөө, беш өрдөгүн учуруу, котур ташы койнунда, ала жипти аттабоо, кекиртегин талга асуу, жабуулуу кара инген, сиркеси суу көтөрбөө, эки көзү төрт д. у. с. Булардын фразеологиялык мааниси тутумундагы компоненттердин өз алдынча тургандагы тике маанилери менен байланышы жок. Албетте, качандыр бир учурда анда байланышы болгондур, бирок азыр байкалбайт."},{"t":"p","h":"40. Текстти окуп чыгып, андан фразеологиялык ширешмелерди тапкыла."},{"t":"h3","h":"ЖАЙЛООГО САПАР"},{"t":"p","h":"Бакыт жайкы каникулду эки-үч жыл катары шаардан анча алыс эмес эс алуу лагеринде өткөрдү. Ал быйылкы жылы жайлоону көрсөм дегенде, эки көзү төрт болуп жүргөн эле. Өзгөчө Суусамыр жайлоосуна барууга көп куштарланчу."},{"t":"p","h":"<span class=\"pg\" data-n=\"92\">92<\/span>Күндөрдүн биринде алардын үйүнө жайлоодогу айылдаштарынан бирөө келип калды. Ал Бакыттын атасы менен ортосунан кыл өтпөгөн курдаш экен. Ага Бакытты кошуп, Суусамыр жайлоосуна жибермекчи болду. Аны укканда Бакыттын төбөсү көккө жетти, көктөн издегени жерден табылгандай сүйүндү. Эртеңки таңдын атышын күтүп, Бакыт көпкө чейин кирпик какпай жатты. Таң суп

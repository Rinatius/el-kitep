а салганда гана көзү илинип кетти."},{"t":"p","h":"Эртеси күндүн мурду менен «ГАЗ-63» автомашинасынын кузовундагы бир топ адамдарга кошулуп, Бакыт да жолго чыкты."},{"t":"p","h":"Бир топ жол жүрүшкөн соң, отургандардын ичинен бетинен каны тамган, чарчы бойлуу, толук, тилинен чаң чыккан бир киши жанындагыларга кайрылды:"},{"t":"p","h":"– Кана туугандар, узун жолду кыскартып, ат жалына казан аспайлыбы. Ансыз алыскы жолдо зеригип кетебиз го. Же кыргый кабак болуп эле бир-бирибизге колтук ачпай, телмирип кете беребизби?"},{"t":"p","h":"– Ырас айтасыз, Жумаке, оозубузга талкан куюп албастан, сүйлөй отуралы,— деп бакылдады берки кара мурутчан. Мал баккандардын баары эле ушундай болобу деп, Бакыт ичинен тиги кишинин да бетинен кан таамп, илебине нан бышып турганына таңдана карады. Тиги андан ары сөз учугун улап:"},{"t":"p","h":"– Шаар деген жакшы турбайбы, Жумаке, оту жагылуу, суусу алынуу. Бул азыркы кой үстүнө торгой жумурткалаган замандын бир көрүнүшү эмей эмне. Бирок ошондой шарт айрым шаардыктарды ак кол кылып коёт көрүнөт. Гезит окуп, телевизор көргөндөн башка дегеле куурай башын сындырышпайт экен..."},{"t":"p","h":"Кепти алгач баштаган киши бул сөздү жактыра бербей кабагын карыш салып:"},{"t":"p","h":"– Ээ-э ботом, алар деле карга тезек чокуй электе турушуп, этек-жеңин үзө баса автобуска жүгүрүшүп, ишке кетип жатышпайбы!"},{"t":"p","h":"—- Аныңыз ырас. Бирок мен алардын өз үйлөрүндө, короосунда эңкейип отун албай, кинодон кино тандашып, көчө таптап жүрүшкөнүн айтам."},{"t":"p","h":"<span class=\"pg\" data-n=\"93\">93<\/span>– Кой, антип алардын жашоосуна көлөкө түшүрбө. Алар да эртеден-кечке кара жанын карч уруп иштешет. Анан бош убактыларында эс алышат да. Алар жайлоого келип калышса, сен кантет элең?"},{"t":"p","h":"– Мен адегенде чекесинен чертип туруп козуларымдан бирди союп, бешбармак тартып, кымызга тойгузуп, жайлоону кыдыртар элем."},{"t":"p","h":"– О, катыгүн десе, анда анык жатып ичээрлер ушулар дебейби. Анан калса, конокко сойгон козуну да бирөөнүн мүлкүбү деп ойлойт го."},{"t":"p","h":"– Жо-ок, жок, Жумаке. Андай болбойт. Эмне, мени адалдан түгү жок дейсизби. Өзүмүн эле таман акым, маңдай терим менен тапкан козуларым жетет. Өмүрү бирөөнүн ала жибин аттап, бөтөн мүлккө суук кол салып көргөн эмесмин! – деп, чычалай түштү."}],"sub":[{"title":"ЖАЙЛООГО САПАР","b":3}],"section":"ФРАЗЕОЛОГИЯ ЖАНА КЕП МАДАНИЯТЫ","pages":[92,93]},{"title":"§ 19. ФРАЗЕОЛОГИЯЛЫК БИРДИК","blocks":[{"t":"h3","h":"§ 19. ФРАЗЕОЛОГИЯЛЫК БИРДИК"},{"t":"p","h":"Фразеологиялык жалпы маани фразеологизмдин тутумундагы компоненттердин жеке тургандагы маанилерине аздыр-көптүр жакындыгы бардай болуп, жалпы маани ошол компоненттер аркылуу келип чыккандай сезилген туюнтмалар фразеологиялык бирдик деп аталат: М и с а л ы: көз ачып-жумганча, көздүн карегиндей сактоо, уруп чыгаар ити жок, кулу додо болбогон, чоң муштум, туп-тамырынан бери, көчүк айланбаган, ийне-жибине чейин, алты саны аман д. у. с. Келтирилген фразеологизмдер аркылуу туюндурулган, тез (бачым), кастарлап сактоо, кедей, көчмөн (туруктуу жашабаган), зөөкүр, бут (калтырбай), тар, соо-саламат деген маанилер ошол фразеологизмдердин тутумундагы компоненттердин өз алдынча тургандагы маанилери менен үндөшүп, жалпы маани ошолордун маанилери аркылуу келип чыккандай сезилип турат. Алсак, көз ачып-жумганча аз гана убакыт өтөт, демек, көз ачып-жумганча фразеологизми – заматта, тез деген <span class=\"pg\" data-n=\"94\">94<\/span>маанини берип, өз тутумундагы компоненттердин маанилерине үндөшүп турат. Кулу додо болбогон деген туюнтмага көңүл бурсак, кыргыз элинде жаккан оттун күлүн чогуу, бир жерге төгөт. Натыйжада, күлү өзүнчө додолонуп, чакан дөбөчөгө айланат. Ал эми бир жерде туруктуу жашабай, тез-тез көчүп, журт которуп жүргөн кишилердин (үй-бүлөнүн) күлү додо болбойт. Демек, бул туюнтманын фразеологиялык мааниси турмуштагы чындыкты түз, бирок образдуу чагылдыруудан улам пайда болгондугу көрүнүп турат."},{"t":"p","h":"41. Тексттен фразеологиялык бирдиктерди бөлүп көрсөткүлө."},{"t":"p","h":"Кандай ата-эне болбосун, очогунун отун өчүрбөй, куттуу үйүнөн түтүн булаткан туяк калышын тилейт. Баласы теңтушунан кем калбай билим алып, журтунун керегине жараган киши болуп чыгышын самабаган жан жоктур. «Адамдын бир кызыгы -— бала»"},{"t":"p","h":"– деп, кеменгер Абай атабыз айткандай, наристенин ыңаалап дүйнөгө келгени, там-туң басканы, алгачкы ирет арипти жазганы... ушулардын бардыгы – ата-эненин кубанычы. Уулу эр жетип, үйлөнүп, башына баш кошулса, кызы бой жетип ордун таап, өрүшү кеңисе, кайсы ата-эне балкып-чалкыбасын."},{"t":"p","h":"Көптөгөн жаштар дүйнөгө келип, ат жалын тарткан азамат болгондугун, ата-эненин таман акы, маңдай теринин акыбети катары билишет. Перзенттик парызын мээрими, ысык ыкыласы, адамгерчилиги менен актоого тырышат. Алар Мекен, калк алдындагы милдеттерин да адал аткарышат. Анткени Мекенди сүйүү өз очогун сүйүүдөн башталат. Ата-энени ардактаган, улууга урмат көрсөтүп, кичүүгө үлгү болгон жигит калкынын да кадырына жетет. Карыялардын кардай аппак чачын сыйлап, өйдөдө өбөк, ылдыйда жөлөк болуу – жаштардын ыйык милдети, кылымдар бою калыптанган асыл салтыбыз."},{"t":"p","h":"Арийне, карыялардын ак батасын алып, өзүнчө түтүн булатып, үй-бүлөсүнүн ысык-суугун көтөрсө, нур үстүнө нур. («Кыргыз Туусу»)"}],"sub":[],"section":"ФРАЗЕОЛОГИЯ ЖАНА КЕП МАДАНИЯТЫ","pages":[94,94]},{"title":"§ 20. ФРАЗЕОЛОГИЯЛЫК АЙКАШТАР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"95\">95<\/span>§ 20. ФРАЗЕОЛОГИЯЛЫК АЙКАШТАР"},{"t":"p","h":"Фразеологизмдердин бул тобу көпчүлүк учурда фразеологиялык тизмектер деп да аталып жүрөт."},{"t":"p","h":"Кебибизде эркин, өз маанисинде кеңири колдонулбастан, белгилүү бир сөздөрдө гана колдонулуп, фразеологиялык маанини пайда кылган туруктуу сөз айкаштарын фразеологиялык тизмектер (айкаштар) дейбиз: кымча бел, кыямат күн, аскар тоо, чарк айлануу, жылас болуу (кылуу) д. у. с. Келтирилген мисалдагы кыпча, кыямат, аскар, чарк, жылас деген компоненттер дээрлик ушул сөздөр менен гана айкашып колдонулат да, келбеттцу, алаамат, медер (таяныч), далалаттануу (өтө ылдам), таптакыр жоголуу (жоготуу) маанилерин туюндурат. Аталган компоненттер белгилүү гана сөздөр менен чектелген түрдө айкалышат."},{"t":"p","h":"§ 21. ФРАЗЕОЛОГИЗМДЕР МЕНЕН МАКАЛ,"},{"t":"h3","h":"ЛАКАПТАРДЫН КАРЫМ-КАТЫШЫ"},{"t":"p","h":"Макал, лакаптарга фразеологизмдердин бир топ окшош жактары бар. Алар:"},{"t":"p","h":"1) кепте даяр материал катары колдонулушу;"},{"t":"p","h":"2) тутумунун туруктуулугу;"},{"t":"p","h":"3) образдуулугу."},{"t":"p","h":"Бирок бул окшоштуктар аркылуу эле фразеологизмдер менен макал, лакаптар бирдей экен деп эсептөөгө болбойт. Алардын ортосунда мындай окшоштуктар менен бирге олуттуу айырмачылыктар да бар. Алар төмөнкүлөр:"},{"t":"p","h":"1. Макал, лакаптар сүйлөмдүк түзүлүшкө ээ. Алардын тутумундагы ар бир сөз өз алдынча маани берет жана алар синтаксистик жагынан сүйлөмдө айрым-айрым сүйлөм мүчөлөрүнүн милдетин аткарышат. Фразеологизмдер болсо, канча компоненттен (түгөйдөн) тургандыгына карабастан, чогуусу менен бир гана маанини туюндуруп, сүйлөмдүн бир гана мүчөсүнүн милдетин аткарат: Жигитке жетимиш <span class=\"pg\" data-n=\"96\">96<\/span>өнөр аздык кылат. (Макал) Ар бир сөз өз алдынча маани берип, сүйлөмдүн ар түрдүү мүчөлөрүнүн милдетин аткарып турат. Ал ат тезегин кургатпай келип турат (ат тезегин кургатпоо – фразеологизм)."},{"t":"p","h":"2. Макалдар, лакаптар эл турмушунун бай тажрыйбасынан улам корутундуланган белгилүү бир пикирди билдирет. Фразеологизм болсо, бир эле түшүнүктү элестүү туюндуруу менен чектелет."},{"t":"p","h":"3. Макалдар дидактикалык мүнөзгө ээ, алар көбүнчө таалим-тарбия максатын көздөйт. Фразеологизмдерде андай касиет жок."},{"t":"p","h":"4. Фразеологизм тилде көркөм каражат катары гана кызмат кылат. Ал эми макалдар, лакаптар ошондой көркөм каражаттар менен өз алдынча эркин мааниде колдонулган сөздөрдөн турат. Өз ичине белгилүү бир мазмунду камтыйт."},{"t":"p","h":"Жогорудагыдай айырмачылыктар макалдарды, лакаптарды фразеологизмдер менен чогуу, тилдин бир бирдиги (единица) катары кароого жол бербейт."},{"t":"p","h":"42. Төмөнкү сүйлөмдөрдөн фразеологизмдерди өз алдынча, макал, лакаптарды өз алдынча бөлүп алып, алардын окшош жактары менен айырмачылыктарын айтып бергиле."},{"t":"p","h":"1. Баштагыдан беш бетер, жер майышкан кол келет. («Манас») 2. Ат – адамдын канаты дегендей эле бар экен. Каныбек бул сөздүн калетсиз айтылганына баа берип, Акжалды өз канатындай көрүп баратты."},{"t":"p","h":"3. «Карга карганын көзүн чокубайт» деген ырас тура. Байлар менен манаптар өз ара келишип, дагы эле байкуш чор тамандарга оорчулук түшүүдө. 4. – Турдубек, үңкүйбөй башыңды көтөр, «өңгө жалган, өлүм ак» деген. Балдар менен коштошуунун камын көрөлү."},{"t":"p","h":"5. Айдарбек датка эмне деп айтаарын билбей жүрөгү оозуна тыгылып, көздөрү чанагынан чыгып, атынын башын тартып токтой калды. (К. Жантөшев) 6. Эмне эле кабагыңа кар жаап калган, айтчы жайыңды. 7. Ээ, балам, «келиниң жакшы болсо – кыз тапканың, келиниң жаман болсо – уулуңду жоготконуң» деген ушул."},{"t":"p","h":"<span class=\"pg\" data-n=\"97\">97<\/span>Сага деле оңой болбой жатат, көрүп турам. Мени ошол жетимдер үйүнө эле жеткирип кой. Анда жакшы экен."},{"t":"p","h":"8. Демек, маселенин кыйыны да, оору да бизде. Дал ушундай жагдайда чөп башылап кеп козгоп, жалтайлоого акыбыз жок. 9. Кайра-кайра сай-сөөктү сыздата комузду боздоткондо, адамдардын көзүнөн чолок жаш сыгылат. (Ш. Бейшеналиев) 10. Текшерүүчүлөр күтүлбөстөн келип калганда, «айланайын ала байтал, акылың болсо сууга чап» дегенчелик болуп, кантээр айласын таппай калды. 11. Сен аны эмитен минтип алаканга сала берсең, эртең ал сенин мойнуңа минип алат. «Баланы жашынан, аялды башынан» деген сөз бар, бир аз катуураак эле болсоң, айланайын. (Т. Сыдыкбеков) 12. Жаман уул атанын кашыктап жыйганын чөмүчтөп чачат тура. Жаман өзү бел оорутуп, кол жоорутпай, тапкан дүнүйөнү ошентип чача берет. (Элдики)"},{"t":"p","h":"Суроолор жана тапшырмалар:"},{"t":"p","h":"1. Фразеологизмдер менен макалдардын, лакаптардын окшош жактары деп кайсы жактарын айтабыз?"},{"t":"p","h":"2. Алардын айырмачылыктары кайсылар?"},{"t":"p","h":"3. Дидактикалык (тарбия-таалим берүүчү) мүнөз макал, лакаптарга тиешелүүбү же фразеологизмдергеби? Үйрөтүү жана текшерүү үчүн жазуу жумуштары: Төмөнкү суроолорго жазуу түрүндө жооп бергиле:"},{"t":"p","h":"1. Тилибиздеги кандай туюнтмалар фразеологизмдер деп аталат? Аларды окутуп-үйрөтүүчү тил илиминин бир салаасы кандайча аталат? Бул термин гректин кандай сөздөрүнөн алынган?"},{"t":"p","h":"2. Азыркы тил илиминде бир тилдеги өзгөчө туюнтмаларды тил илиминин кайсы тармагы изилдейт жана окутуп-үйрөтөт?"},{"t":"p","h":"3. Фразеологизмдердин сөздөн, эркин сөз айкашынан айырмасы бар бекен? Болсо түшүндүрүп бергиле."},{"t":"p","h":"4. Фразеологизмге жаңы мисалдарды келтиргиле (10-15 мисал)."},{"t":"p","h":"<span class=\"pg\" data-n=\"98\">98<\/span>Фразеологиялык талдоо"},{"t":"p","h":"Фразеологизмдерге талдоо жүргүзүүдө төмөнкүлөргө көңүл буруу керек:"},{"t":"p","h":"1. Сүйлөмдүн ичинен фразеологизмдерди табуу;"},{"t":"p","h":"2. Ал фразеологизмдер кандай мааниде колдонулган;"},{"t":"p","h":"3. Ал кепте туруктуу, даяр материал катары колдонулабы;"},{"t":"p","h":"4. Канча компоненттен турат;"},{"t":"p","h":"5. Маани жактан ширелишип, лексикалык бүтүндүккө айланганбы;"},{"t":"p","h":"6. Образдуулукка ээси;"},{"t":"p","h":"Т1. Фразеологизмдердин өз ара бөлүнүшүндөгү кайсы түрүнө кирет (фразеологиялык ширешме, фразеологиялык бирдик, фразеологиялык айкаш)."},{"t":"p","h":"Мына ушуларды эске тутуу менен бирге сүйлөмдүн ичине камтылган эки фразеологизмди талдоону үлгү катары карап көрөлү. Араздашуудан оту күйүшпөй, кулу додо болбой өз бетинче кеткен ата-эне сөрөй ушул жетимдерди кайдан ойлошсун. («Кыргыз руху»)"},{"t":"p","h":"Талдоого улгу: Бул сүйлөмдө «оту күйүшпөй», «күлү додо болбой» деген эки фразеологизм колдонулган. Биринчиси – ынтымаксыз, ыркы жок, ымаласы келишпеген деген маанини туюндуруп турат. Экинчисинде – отуруксуз, бир жерде туруктуу жашабаган же иштебеген деген маани бар. Кыргыз тилинде «оту күйүшпөө» деген фразеологизм кебибизде дайыма ушул формасында даяр материал катары колдонулат. Ал эки компоненттен турат. Эки компонент тең өзүнүн алгачкы лексикалык маанисинен алыстап, маани жактан өз ара ширелишип, «ынтымаксыз», «ыркы жок» дегендей мааниге айланып, лексикалык бир бүтүндүктү түзүп калган. Ал компоненттерди ажыратып, же башка сөздөр менен алмаштырып жиберүүдөн фразеологиялык маани бузулат. Анда образдуулук да бар. Анткени мамиледеги эки адам өз <span class=\"pg\" data-n=\"99\">99<\/span>ара келишпесе, алардын жага турган отуну да алынбайт, оту да жагылбайт. Бул бир. Экинчиден, эгерде бул фразеологизмдин пайда болуу булагына кайрылсак, анда байыртан эле баш кошууга максат койгон эки адамдын сүйүүсү – жүрөк отуна, сүйүүнүн күчү – алоолонгон отко салыштырылып келген. Демек, ошол оттун «алоолонуп күйүшү» алардын ортосундагы сүйүүнүн ысыктыгы – ал экөөнүн ынактыгы менен салыштырылган. Эгер ал от өчсө, күйбөй калса, демек, алардын ортосундагы ынак мамиле, сүйүү да өчөт. Экөөнүн оту ошентип күйүшпөй калат. Мында сүйүүнү отко салыштырып берген образдуулук бар. Демек, «оту күйүшпөө» деген фразеологизм кепте даяр материал катары колдонулган, эки компоненттүү, маани жактан ширелишип, лексикалык бир бүтүндүккө айланган, образдуу сапатка ээ болгон тилдик бирдик. Биз ушул белгилерден улам тилдин мындай бирдигин фразеологизм деп айтабыз."},{"t":"p","h":"Фразеологизмдерди өз ара түрлөрү боюнча бөлүштүргөнүбүздө, бул – фразеологиялык ширешме. Анткени ал өзүнүн алгачкы маанисинен такыр алыстап кеткен."},{"t":"p","h":"Мисалдагы экинчи фразеологизм – «күлү додо болбоо». Бул да кебибизде даяр материал катары колдонулду. Үч компонентке ээ. Алар маани жактан өз ара ширелишип, лексикалык бир бүтүндүктү түзүп, «отуруксуз» (бир жерде тынып жашабаган) деген маанини туюндуруп турат. Мында да образдуулук бар. Анткени бир жерде узакка тургандардын гана төккөн күлү додо болот эмеспи."},{"t":"p","h":"Семантикалык жактан өз ара түрлөргө ажыратканда бул – фразеологиялык бирдик. Себеби компоненттердин алгачкы лексикалык маанилери берип турган маани менен фразеологиялык маанинин ортосунда байланыш бар экендигин сезип турабыз."},{"t":"p","h":"Мисалдагы эки фразеологизм тең өзгөрүүгө учурабастан, араларына сөз кыскартылбастан, тиешелүү грамматикалык формасы менен гана колдонулган."},{"t":"p","h":"<span class=\"pg\" data-n=\"100\">100<\/span>43. Төмөнкү сүйлөм топтомдорунан фразеологизмдерди таап, жогоруда көрсөтүлгөн үлгү боюнча аларды талдагыла."},{"t":"p","h":"1. Анын байпагы манат болуп, ыргыткан ташы өөдө кулап турган чагы. 2. Жол жүргөндөн улам алсырап, касиеттүү көлүбүзгө жетсек экен дешкенде эки көзү төрт болуп жатышты. (К. Баялинов) 8. Уулум качан келет деп, ичкен ашы ирим, жегени желим болуп, күн өтпөйт. (Ч. Айтматов) 4. Ээ, баракелде, жигит болсо ушундай болсун, колу ачык, жылдызы жарык неме экен, тим эле адамды айттырбай түшүнүп турат. (К. Жантөшев) 5. Кудай сактай көр, чындыкты сүйлөйм деп, накта ажыдаардын куйругун басып алган окшодум. (К. Баялинов) 6. Болор бала ушундайында эле билинет, карачы тим эле тили буудай кууруп, биттин ичегисине кан куйчудай болуп турат. 7. Музыкага башынан эле шыктуу эле, комуз дегенде ичкен ашын жерге коё салчу. 8. Сактыкка кордук жок дейт, кырсык каш-кабактын ортосунда болорун унутпа, этият бол балам (Жомоктон). 9. – Мынча болду, ачык айт. Жаныңды жесең, бул дүйнөдөн как баш болуп так өтөсүң (А. Матисаков). 10. Көптөгөн жаштар дүйнөгө келип, ат жалын тартканда, азамат болгондугун, ата-энесинин таман акы, маңдай тери кайткандыгын сезишкенин билишсе кандай сонун (К. Сактанов)."},{"t":"p","h":"11. Ансыз элдин итке минген абалын оңдоо кыйын, токтоосуз айыл чарбасын көтөрүүнүн аракетин жасоо зарыл. («К. Т.») 12. Ошо катчылар, балким, жер-жерлердеги партиялык лидерлердин, асыресе эл башкаруудан тайдырылгандардын баш терисин байкап, тамырын тартып, алардын колтугуна суу бүркүп, чырагына май тамызып жаткандыр. (С. Жигитов)"},{"t":"h3","h":"<span class=\"pg\" data-n=\"101\">101<\/span>КЕП МАДАНИЯТЫ"}],"sub":[{"title":"ЛАКАПТАРДЫН КАРЫМ-КАТЫШЫ","b":4},{"title":"КЕП МАДАНИЯТЫ","b":53}],"section":"§ 20. ФРАЗЕОЛОГИЯЛЫК АЙКАШТАР","pages":[95,101]},{"title":"§ 22. ФРАЗЕОЛОГИЗМДЕРДИН КЕПТИН КӨРКӨМ СТИЛИНЕ МҮНӨЗДҮҮЛҮГҮ","blocks":[{"t":"h3","h":"§ 22. ФРАЗЕОЛОГИЗМДЕРДИН КЕПТИН КӨРКӨМ СТИЛИНЕ МҮНӨЗДҮҮЛҮГҮ"},{"t":"p","h":"Фразеологизмдер тилдик көркөм каражат болгондуктан алар дээрлик бардык учурда стилдик максатта колдонулат. Айтылуучу ойду элестүү, таамай кылып, угуучунун же окурмандын сезимине жеткирүүдө анын ролу чоң. Жөнөкөй эле сөз менен ойду туюндурганга караганда ал түшүнүктү фразеологизм аркылуу берсек, ал маани ары жеткиликтүү, ары таасын, ары көркөм мүнөзгө ээ болот. Адатта жөн эле сөз аркылуу берилген маани фразеологизмдер менен берилгенде тилдин көркөмдүгү да артат. Ушул өзгөчөлүктөрдүн өзү фразеологизм – дердин кептин көркөм стилине жатарын ырастап турат."},{"t":"p","h":"М и сал ы: «ылдам, тез» деген сөздү «көз ачып-жумганча», «өкүндү» дегендин ордуна «бармагын тиштеди», «кайрымсыз» дегенди «таш боор», «кыйкымчыл» дегенди «жумурткадан кыр тапкан» деп фразеологизмдер аркылуу берүү алда канча элестүү, сезимге жетерлик таасирге ээ болуп, кепти көркөмдөп тургандыгы даана эле байкалып турат."},{"t":"p","h":"Фразеологизмдердин кепте колдонулушунда да ар турдуу стилдик ыкмалар пайдаланылат."},{"t":"p","h":"Фразеологизмдердин кепте колдонулушу"},{"t":"p","h":"Фразеологизмдер кепте даяр материал катары туруктуу формасы менен колдонулары женунде мурда сез болгон. Биз муну менен фразеологизмдер таптакыр <span class=\"pg\" data-n=\"102\">102<\/span>эле сенек түрүндө, бир эле калыбында, өзгөрбөгөн көрүнүш экен деп түшүнбөшүбүз керек. Анткени алар ар кандай стилдик максатта (кээде эч кандай өзгөртүүсүз, кээде айрым өзгөрүүлөр менен) колдонулат. Бирок ал өзгөрүүлөр мурдатан калыпка түшкөн фразеологизмдерди ой келди өзгөртө берсе болот экен дегенди билдирбейт. Анын алгачкы формасын сактоо менен аларга кошумча (көбүнчө, күчөтмө мааниге ээ болгон) сөздөр кошулуп, же синоним сөздөр менен алмашуулар учурайт. Кээде маанилеш фразеологизмдер катар-катар же аларга синоним сөздөр жарыш колдонуу аркылуу атайын стилдик ыкмалар пайдаланылып, максат ишке ашат."}],"sub":[],"section":"§ 20. ФРАЗЕОЛОГИЯЛЫК АЙКАШТАР","pages":[102,102]},{"title":"Фразеологизмдердин кепте өзгөрүүсүз колдонулущу","blocks":[{"t":"v","l":["Фразеологизмдердин кепте","өзгөрүүсүз колдонулушу"]},{"t":"p","h":"Фразеологизмдер жазма же оозеки кепте нукура компоненттери сакталып, өзгөрбөй колдонулса, аны фразеологизмдердин кепте өзгөрүү сүз колдонул ушу дейбиз."},{"t":"p","h":"Нукура компоненттүү фразеологизмдер: тили буудай кууруйт, эки көзү төрт, азуусун айга жанган, төбө чачым тик турду, кабыргам кайышты, ары карап ыйлап, бери карап кулуп ж. б."},{"t":"p","h":"М и сал ы: Баламдын боштугун көрүп кабыргам кайышты. Анын классташтарынын тилинен чаң чыгат. Эч кимге сыр бербей ары карап ыйлап, бери карап кулуп, тишимдин кашкасын көрсөтөм."},{"t":"p","h":"Келтирилген мисалдардагы фразеологизмдерде эч кандай өзгөрүүлөр болгон жок. Бирок фразеологизмдер дайыма эле бирдей, сенек формасында эмес, атайын стилдик ыкманы колдонуу менен сырткы жагынан айрым өзгөрүүлөргө учурап да колдонулат."}],"sub":[],"section":"§ 20. ФРАЗЕОЛОГИЯЛЫК АЙКАШТАР","pages":[102,102]},{"title":"Фразеологизмдердин кепте","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"103\">103<\/span>Фразеологизмдердин кепте"},{"t":"p","h":"өзгөртүлүп колдонулушу"},{"t":"p","h":"Жазма же оозеки кепте фразеологизмдердин компоненттеринин кемип же алардын арасына бир же бир нече сөз кыстарылып, кээде компоненттердин орду алмаштырылып колдонулса, мындай көрүнүштү фразеологизмдердин кепте (речте) өзгөртүлүп колдонулушу деп айтабыз: Жердин жети түбүндө – жердин түбүндө, жылдызы жерге түшүү – жылдызы түшүү, кабыргам кайышты – кабыргам жаман кайышты; ичине таруу айланбайт – ичине жарты таруу айланбайт; жүрөгүндө кири жок – жүрөгүндө кымындай кири жок д. у. с."},{"t":"p","h":"Фразеологизмдердин өзгөрүүгө учурап колдонулушу, негизинен, стилдик максатта ишке ашат. Тактап айтканда, маанини күчөтүү үчүн, ыр саптарында муун өлчөмүн же ыргакты сактоо үчүн, фразеологизмдердин маанисине доо кетирбей туруп, аларды өзгөртүп колдонгон учурлар болот. Орунсуз, туш келди өзгөртүүлөр фразеологиялык маанинин бузулушуна алып келет."},{"t":"p","h":"44. Төмөнкү сүйлөмдөрдөн фразеологизмдерди таап, алардын ичинде кандайдыр бир өзгөрүүгө учурап колдонулганы болсо, анда ал өзгөрүүнүн кайсы түрүнө ээ экендигин түшүндүргүлө."},{"t":"p","h":"1. Сары изине чөп салып, саргара кууп алалык."},{"t":"p","h":"2. Туйдуңбу балээ шумдугуң, басып алган окшодук, ажыдаардын куйругун. 3. Бөрк ал десе улугу, аянбастан баш алган, башынан канкор аталган. 4. Бирөөнүн сөзүнө ишенип сызга гана отуруп калбадымбы. 5. Кабыргаңа жакшылап кеңешип туруп, жообуңду берип кой, садага. 6. Өзүңдүн иштеп тапканың колуңа толук тийсе, канга да салам бербейсиң. 7. «Кыял» бирикмесинде колунан тим эле көөрү төгүлгөн кыз-келиндер эмгектенет эмеспи. 8. Анын эмнесине таң каласың, ал музоо кезинде эле катуу сүздүрүп алып, жалтанчаак <span class=\"pg\" data-n=\"104\">104<\/span>болуп калган. (Т. Сыдыкбеков) 9. Ошондо жаңылганын сезип, «аттиң» деп бармагын кесе тиштеп, оозун карманды. 10. Ак көкүл бир атка, Кара көкүл бир атка сылай күлазык артышып, кулак угуп, дегеле көз көргүс жерге жүрүп кетишет. (Жомоктон)"}],"sub":[],"section":"§ 20. ФРАЗЕОЛОГИЯЛЫК АЙКАШТАР","pages":[103,104]},{"title":"Фразеологизмдердин жарыш колдонулушу","blocks":[{"t":"h3","h":"Фразеологизмдердин жарыш колдонулушу"},{"t":"p","h":"Эки же андан ашык фразеологизмдердин же фразеологизм менен ага маанилеш сөздүн удаа колдонулушун фразеологизмдердин жарыш колдонулушу дейбиз: 1. Күлүктөр суулугу менен суу ичип, эр азаматтар өтүгү менен суу кечип, эл башына оорчулук түшкөндө, капилеттен сөз тапкан, караңгыда жол ачкан карыялардын акылы керек болду."},{"t":"p","h":"2. Ошондо, калың элдин алдына кара кылды как жарган, калыс Бакай чыгып, акыл сөзүн айтты: «Калайык, көп эле жылдызыңарды түшүрүп, башыңарды жерге салбагыла! Ач тоюнат, арык семирет...» («Манас», кара сөз түрүндө) 3. Ал бирөөнүн жырык ийнесине тийбеген, ак ниет, ак көңүл неме эле."},{"t":"v","l":["4.Өчкөн отун тамызган,","Өлгөн жанды тиргизген.","Чачылганды жыйнаган,","Үзүлгөндү улаган.","Кайран жеңем Каныкей. («Манас»)","","Кара сууга кан төккөн,","Бөрк ал десе баш алган.","Канкор эрдин бири ушул. («Манас»)"]},{"t":"p","h":"Фразеологизмдерди жарыш колдонуунун натыйжасында маани күчөйт, образдуулук артат. Айтылып жаткан ойго угуучу же окуучунун көңүлү өзгөчө бурулат. Көркөм чыгармаларда болсун, оозеки кепте <span class=\"pg\" data-n=\"105\">105<\/span>болсун, фразеологизмдердин мындайча кабат, удаа айтылып, алардын маанилеш сөз менен жарыш колдонулушу каармандардын сапаттарын ачууда өзгөчө таасирдүүлүккө ээ болот."},{"t":"p","h":"45. Төмөнкү сүйлөмдөрдөн жарыш колдонулган фразеологизмдерди тапкыла. Алардын сөз же фразеологизмдер менен өз ара жарыш колдонулуп жаткандыгын аныктагыла. Фразеологизмдердин жарыш колдонулушунан улам кандай натыйжа болорун, тактап айтканда, угуучунун кепке көңүл буруусуна, айтылуучу ойдун элестүүлүгүнө алардын тийгизген таасири барбы, эгер болсо ага карата өз түшүнүгүңөрдү айтып бергиле."},{"t":"p","h":"1. Мен деле тууганыма кошулуп, кайта өз элиме кетсем дегенде эки көзүм төрт болуп, ак эткенден так этем. 2. Көпчүлүгү колу жука, эшигинде адалдан түгү жок, атүгүл кээ биринин үрүп чыгар ити да жок. (К. Жантөшев) 3. Тили буудай кууруп, тандайынан чаң чыккан Дөнөнбайдын сөздөрү чакырылгандардын үрөйүн учурду. (Э. Турсунов) 4. Атасынын жоктугун билдирбей, канаттууга кактырбай, тумшуктууга чокутпай алаканга салып, алпештеп өстүрдүм. (М. Абдукаримов) 5. А тигинден кесип алса да кан чыга турган түрү жок, битин сыгып, канын жалаган зыкым экендиги кебетесинен эле көрүнүп турбайбы. (Ж. Медералиев) 6. Анан кайра буту сыздап зыркыраганда жаны көзүнө көрүнүп, жанын коёрго жер таппай кыйналат. 7. Кыш катаал болуп, жон жукарып, кол кыскарып турган чак. 8. Сыртынан карасаң, кой оозунан чөп албаган бир момун, жоош киши. (Ж. Саатов) 9. Жаңы келген жетекчи жөнүндө «Бөйрөктөн шыйрак чыгарып, жумурткадан кыр издеген киши экен, чеке жылытып, элге жакшылык кылар түрү жок» деген күбүр-шыбыр эл ичинде жүрүп жатты. («Асаба») 10. Көзгө сайса көрүнгүс караңгы экенине карабай жолго чыктык. 11. Сабыр кыл, балам, сабыр менен эмгектенгендер көбөйсө, беш колубуздан май таамп, байпагыбыз макмал болгон заманга сен да жетесиң. («Мурас»)"},{"t":"v","l":["<span class=\"pg\" data-n=\"106\">106<\/span>Фразеологизмдердин жеке сөз менен","синонимдик катышты түзүшү, алардын","кошумча маанилериндеги өзгөчөлүктөр"]},{"t":"p","h":"Фразеологизмдер түзүлүшү боюнча канчалык татаал болгондугуна карабастан бир мааниге, лексикалык бир бүтүндүккө ээ. Ошондуктан ал маанини сөз аркылуу да түшүндүрүп берүүгө мүмкүн. Фразеологизмдин маанисине дал келген сөз аны менен синонимдик катышты түзөт."}],"sub":[],"section":"§ 20. ФРАЗЕОЛОГИЯЛЫК АЙКАШТАР","pages":[105,106]},{"title":"Фразеологизмдердин жеке сез менен синонимдик катышты түзүшү, алардын кошумча маанилериндеги өзгөчөлүктөр...... я","blocks":[{"t":"v","l":["фразеологизм:","","бармагын тиштөө","таш. боор","алчы-таасын жеген","көзү тирүү","сөз:","","– өкүнүү","– кайрымсыз","– шылуун","– чыйрак, тың ж. у. с."]},{"t":"p","h":"Мисалдардагы фразеологизмдер менен сөздөр бири-бирине синонимдик катышты түзүп турат. Алар бир эле түшүнүктү туюндурууда."},{"t":"p","h":"Ырас, сөз аркылуу туюндурулган түшүнүккө караганда, фразеологизм аркылуу туюндуруу өзгөчөлүккө ээ. Анткени сөз тигил же бул түшүнүктү жөн эле тике түшүндүрүп турса, фразеологизм ал түшүнүктү бир топ элестүү, таасирдүү жеткирүү үчүн кошумча маани берип турган өзгөчөлүккө ээ."},{"t":"p","h":"46. Таблицада бөлүштүрүлүп берилген фразеологизмдерди жана сөздөрдү бири-биринен болгон маанилик жакындыгы (синонимдик катышы) боюнча орун которуп, өз-өз тушуна жазып чыккыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"107\">107<\/span>Үлгү:"},{"t":"p","h":"Предмет аралык байланыш"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Маанилеш (синоним)<\/td><td>Аларга синоним<\/td><\/tr><tr><td>фразеологизмдер<\/td><td>сөздөр<\/td><\/tr><tr><td>колу ачык<\/td><td>ак көрпө жайыл<\/td><td>март, берешен жал-<\/td><\/tr><tr><td>ак каптал<\/td><td>көчө таптап жүрүү<\/td><td>коо<\/td><\/tr><tr><td>көз ачып-жумгуча<\/td><td>ана-мына дегиче<\/td><td>тез, бир заматта<\/td><\/tr><tr><td>кара суудан<\/td><\/tr><tr><td>биттин ичегисине<\/td><td>каймак алган<\/td><td>чыйрак<\/td><\/tr><tr><td>кан куйган<\/td><\/tr><tr><td>Фразеологизмдер<\/td><\/tr><tr><td>Ак эткенден так этүү<\/td><td>Жумурткадан<\/td><td>мактоо<\/td><\/tr><tr><td>Ак каптал<\/td><td>кыр табуу<\/td><td>чыйрак<\/td><\/tr><tr><td>Күн карама<\/td><td>Куурай башын<\/td><td>тоготпоо<\/td><\/tr><tr><td>Мурдун балта кеспөө<\/td><td>сындырбоо<\/td><td>март<\/td><\/tr><tr><td>Битин сыгып, канын<\/td><td>Күн тийген<\/td><td>берешен<\/td><\/tr><tr><td>жалоо<\/td><td>тоонун күкүгү<\/td><td>жалкоо<\/td><\/tr><tr><td>Биттин ичегисине кан<\/td><td>Кыртышы сүйбөө<\/td><td>зыкым<\/td><\/tr><tr><td>куюу<\/td><td>Кара суудан<\/td><td>сараң<\/td><\/tr><tr><td>Кайырмакка саяр<\/td><td>каймак алган<\/td><td>көпкөндүк<\/td><\/tr><\/table><\/div>"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>эти жок<\/td><td>Эки көзү төрт болуу<\/td><td>жактырбоо<\/td><\/tr><tr><td>Кылдан кыйкым<\/td><td>Ааламды сел каптаса араздашуу<\/td><\/tr><tr><td>издөө<\/td><td>тушарына келбейт<\/td><td>кошоматчы<\/td><\/tr><tr><td>Оту күйүшпөө<\/td><td>Кулагынан күн<\/td><td>тукуруу<\/td><\/tr><tr><td>Каны ичине тартуу<\/td><td>көрүнүү<\/td><td>суусоо<\/td><\/tr><tr><td>Текей оттоп жүрүү<\/td><td>Кесип алса, кан<\/td><td>ачуулануу кый-<\/td><\/tr><tr><td>Колтугуна суу бүркүү<\/td><td>чыкпас<\/td><td>кымчыл арык<\/td><\/tr><tr><td>Тили оозуна батпоо<\/td><td>Мурдун көтөрүү<\/td><td>ачка болуу<\/td><\/tr><tr><td>Жер баспай калуу<\/td><td>Кабагына кар жаап<\/td><\/tr><tr><td>Кыл жугузбоо<\/td><td>Кырды-бычак болуу<\/td><\/tr><tr><td>Көчө таптоо<\/td><td>Көчө таптап жүрүү<\/td><\/tr><tr><td>Колу ачык<\/td><td>Ортосуна от жагуу<\/td><\/tr><tr><td>Кекиртегин талга асуу<\/td><td>Каны катуу<\/td><\/tr><tr><td>Жерге-сууга тийгиз-<\/td><\/tr><tr><td>бөө<\/td><\/tr><tr><td>Тишинин кирин соруу<\/td><\/tr><tr><td>Ак көрпө жайыл<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"108\">108<\/span>Кыргыз тили фразеологизмдерге бай. Жазуучулар аларды өз чыгармаларында кеңири колдонушат. Фразеологизмдер авторлор тарабынан канчалык орундуу колдонулса, каармандардын образдары ошончолук элестүү, таамай, түшүнүктүү чечилет. Чыгарманын тили да, көркөмдүүлүгү да жогору болот."},{"t":"p","h":"Фразеологизмдердин колдонулуш чөйрөсү жалаң эле чыгармачыл адистер менен чектелбейт. Аларды арбын, орундуу колдоно билүү ар бирибиздин кебибизди кооз, таасын, элестүү, жеткиликтүү кылат."},{"t":"p","h":"Тапшырма: Ч. Айтматовдун «Жамийла» повестин окуп чыгып, андагы фразеологизмдерди дептериңерге көчүрүп жазгыла."},{"t":"p","h":"47. Төмөнкү сүйлөмдөрдөн фразеологизмдерди таап, алардын колдонулушуна, маани жактан өзгөчөлүктөрүнө, компоненттеринин өзгөргөнүн же өзгөрбөгөнүнө байкоо жүргүзгүлө. Аларды колдонулуш өзгөчөлүктөрү боюнча топторго бөлүштүрүп жазгыла."},{"t":"p","h":"1. Алты саны аман кишиге айылда көчө таптап жүргөнү уят. (А. Убукеев) 2. Өткөн кылымдын 60-70-жылдары коомубуздун дымып турган мезгили болгондугу бүгүн баарыбызга бештен белгилүү болуп отурат. Ошондой болсо да, ал учурда «тигини бүтүрдүк, муну жаратып жатабыз, анысын ашыгы менен аткарабыз!» деген ач айкырык, куу сүрөөн мол эле. («Кыргыз Туусу») 3. Бычакка саптык уулуң жок, камчыга саптык бириң жок, карап туруп силерди, ичим жалын, сыртым чок. («Эр Төштүк») 4. Ансыз да жону жука немени чыгашага учуратып, анан иттен жок, же ит байлаган жиптен жок болуп, сенделип кайра келгеним, бардык күнөөнү мойнума үйөт. (Т. Касымбеков)"},{"t":"p","h":"5. Токойду, сазды аралап,"},{"t":"v","l":["Токтолбой Ажал чурады.","Азуусун айга бир кайрап,","Ааламдан минтип сурады.","(Ж. Бөкөнбаев)","<span class=\"pg\" data-n=\"109\">109<\/span>6. Мен жүрүп Ысык-Көлдүн бойлорунда,","Көп болдум үлпөт менен тойлорунда.","Ошондо муну сездим:","Жаткан экен,","Боз торгой жумурткалап","Кой жонунда.","(С. Өмүрбаев)","","7. Көзүнчө ырсак-ырсак күлүп коёт.","Ичине котур ташын түйүп коёт.","(Б. Асаналиев)","","8. Айдаткан жалаа менен намыс үчүн,","Андыктан аман келдиң башың бүтүн.","Бир чылбыр, эки тизгин өз колуңда,","Актагын журтуң үчүн эне сүтүн.","(А. Токомбаев)"]},{"t":"p","h":"9. Апаң эсен болсо, жаман атаңдын аягынан жел эптеп өтүп турса, чоочун жерде, кызым, жер каратып кызартпайбыз. (К. Баялинов) 10. Териси жука киши курусун, ачуум дайыма мурдумдун учунда."},{"t":"p","h":"11. Кайгы басып, бир көзүнөн жаш, бир көзүнөн кан акса да, ичтен тынып, ары карап ыйлап, анан бери карап күлүп, тагдырына моюн сунуп жүрө берет."},{"t":"p","h":"12. Атаң анда алп эле, жоонун жүрөк суусун алган эле. Эми минтип бир аягым төрдө, бир аягым көрдө турат."},{"t":"p","h":"18. Ошондо атасы: «Ии... бул уулумду сары ооз балапан десе, жетилген экен. Эми ыраазымын!» – дейт да, көз жумат. (Ж. Мукамбаев) 14. Мен болгонду болгондой айтып чыга бергенимде, ал мени көзүнүн төбөсү менен карап, мурутун чыйралткан боюнча кабагын чытыды. 15. Мына ошентип, Шамырбектин ашына дос да, кас да келет. Демек, алар жумурткадан кыр таап, бөйрөктөн шыйрак чыгарууга аракет кылышат, ошондуктан өзүбүзгө сак болуп, ашка жакшы даярданалы. (К. Жантөшев) 16. Начальниктин көзү чанагынан чыгып, каардуу бакырды. Ага теңелип эмне <span class=\"pg\" data-n=\"110\">110<\/span>кылайын деп, тилимди тишиме басып, айткандарын угуп, жер карап отура бердим. 17. Ар ким өз көмөчүнө күл тарткан – болбогон иш. Биз бири-бирибизге кам көргөнүбүз оң. (Т. Касымбеков)"},{"t":"p","h":"Суроолор жана тапшырмалар:"},{"t":"p","h":"1. Фразеологизмдердин кепте колдонулушунун кандай түрлөрүн билесиңер?"},{"t":"p","h":"2. Фразеологизмдердин кепте өзгөрүүгө учурап колдонулушун кандай түшүнөсүңөр? Алардын кандай жолдору бар?"},{"t":"p","h":"3. Фразеологизм менен сөздүн синонимдик катышын кандай түшүнөсүңөр? 5—6 мисал келтиргиле."},{"t":"p","h":"4. Оозеки жазуу кебиңерде фразеалогизмдерди орундуу пайдалана билгиле."}],"sub":[],"section":"§ 20. ФРАЗЕОЛОГИЯЛЫК АЙКАШТАР","pages":[107,110]},{"title":"у 23. КЫРГЫЗ ТИЛИНИН ЛЕКСИКАСЫНЫН","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"111\">111<\/span>КЫРГЫЗ ЛЕКСИКАСЫНЫН БАЮУ ЖОЛДОРУ"},{"t":"h3","h":"у 23. КЫРГЫЗ ТИЛИНИН ЛЕКСИКАСЫНЫН"},{"t":"p","h":"БАЙЫШЫНЫН НЕГИЗГИ БАГЫТТАРЫ,"},{"t":"h3","h":"ЖОЛДОРУ (БУЛАКТАРЫ)"},{"t":"p","h":"Коомдук турмуштагы ар кандай жаңылыктарга, айлана-чөйрөдөгү түрдүү өзгөрүүлөргө жараша адамдардын да түшүнүгү, аң-сезими өркүндөп, өсүп-өнүгүп турат. Мындай кубулуштар тилдин лексикалык курамына жаңы сөз каражаттарынын кошулуп, толукталып турушун талап кылат."},{"t":"p","h":"Тил түрдүүчө жолдор менен өнүгөт. Анын эң ийкемдүү, өнүмдүү жолдорунун бири катарында мурдатан колдонулуп жүргөн сөздөрдүн морфологиялык (аффиксациялык) жана семантикалык (маанилердин жаңыланыш) жолдору болуп эсептелет. Булар менен катар адабий тилдин кору диалектизмдердин жана башка тилдердеги сөздөрдү которуп алуу жолдору менен да ишке ашат. Албетте, ар кандай эл башка элдер менен саясий, маданий, экономикалык байланышта болуп тургандыктан ал элдердин тилинен кирген сөздөр аркылуу да лексика байып турат. Лексиканын ушундайча өнүгүп-өрчүшүн, тактап айтканда, кыргыз тилинин лексикасынын байышынын негизги багыттарын кыргыз тилинин байышынын ички жана сырткы булактары деп эки чоң топко бөлөбүз."},{"t":"v","l":["Кыргыз тилинин лексикасынын","байышынын ички булактары"]},{"t":"p","h":"Тилдин лексикасынын байышынын ички булактары да өз ара бир нечеге бөлүнөт. Алар: а) морфологиялык <span class=\"pg\" data-n=\"112\">112<\/span>(аффиксациялык), б) семантикалык, в) синтаксистик, г) башка тилден сөзмө-сөз которуу (калькалоо) жолдору. Ошондой эле диалектилик байлыктардан да туура пайдалануу аркылуу адабий тилдин кору артат."}],"sub":[],"section":"КЫРГЫЗ ЛЕКСИКАСЫНЫН БАЮУ ЖОЛДОРУ","pages":[111,112]},{"title":"$ 24, МОРФОЛОГИЯЛЫК (АФФИКСАЦИЯ) ЖОЛ АРКЫЛУУ БАЙЫШЫ","blocks":[{"t":"h3","h":"$ 24, МОРФОЛОГИЯЛЫК (АФФИКСАЦИЯ) ЖОЛ АРКЫЛУУ БАЙЫШЫ"},{"t":"p","h":"Уңгу жана туунду сөздөргө ар түрдүү сөз жасоочу мүчөлөр жалганып, жаңы маанидеги сөздөрдүн жасалышы сөз жасоонун морфологиялык же аффиксация жолу деп аталат."},{"t":"p","h":"М исал ы: окууу + чы окуучу, бас + ым басым, котор + мо котормо, иш + кер ишкер, эл + чы элчи, башкар + ма башкарма."},{"t":"p","h":"Аффиксация жолу менен бир эле сөз түркүмүндөгү сөздөр да, бир сөз түркүмүнөн башка сөз түркүмүнө кирүүчү сөздөр да жасалат."},{"t":"p","h":"М исал ы: бас- этиш сөзү, ага -ма, мүчөсү жалганып, басма болуп этиштен зат атооч жасалды. Мал деген сөзгө -чы мүчөсү жалганганда малчы болуп зат атоочтон зат атооч жасалды."},{"t":"p","h":"Сөз жасоочу мүчөлөр же аффиксация жолу менен жаңы маанидеги сөздөрдү жасоодо бардык мүчөлөрдүн ролу бирдей эмес. Алардын айрымдарынын колдонулушу менен көптөгөн жаңы маанидеги сөздөр жасалса, айрымдары саналуу гана сөздөрдү жасоого катышат. Алсак, -чы, -луу, -ма, -ым, -кер сыяктуу мүчөлөр көптөгөн жаңы маанидеги сөздөрдү жасаганга катышкандыктан, алар өнүмдүү мүчөлөр деп аталат. Ал эми -чан, -чак, -ак (ык), -кор сыяктуу мүчөлөр жаңы сөздөрдү жасоодо анчалык көп колдонулбагандыктан, алар өнүмсүз мүчөлөр деп эсептелет. Тилдеги төл сөздөрдүн морфологиялык (аффиксациялык) жол менен жаңы түшүнүк берип, жаңы мааниге ээ болушу тилдин лексикасын байытууда чоң роль ойнойт."},{"t":"p","h":"<span class=\"pg\" data-n=\"113\">113<\/span>48. Төмөнкү текстти окуп чыгып, андагы аффиксация (морфологиялык) жол менен жаңы мааниге ээ болгон сөздөрдү тапкыла. Алардын кайсы мүчө аркылуу жаңы маанидеги сөздү жасап жаткандыгын түшүндүргүлө."},{"t":"p","h":"Мектепте ыр, сүрөт сабактарына (өзгөчө айылда) алиге чейин жеңил-желпи карашат. «Ырды мал баксаң, тоо-түздө ырдасаң болот, а сүрөтчү болуп жыргап кеткендерди да учурата элекпиз. Эсиң болсо, математика менен химиядан баш көтөрбө, азыр ошол илимдердин заманы»-— деп балдарынын кулагына куюп, өткүр сезимине жөргөмүштүн желесин тарткан ата-энелерди да көрүп жүрөбүз. Алардан мугалимдер ашып түшөт. Көп жерлерде сүрөттөн, ырдан адистиги жок, эптеп-септеп «саатка жеткен» мугалимдер өз билгенинче сабак өтүшөт. Сааттар аз. Аягы эмне болот? Кулунчак кезден искусствого кайдыгерлик жаралат."},{"t":"p","h":"«Симфония – жандүйнөмдүн төгүлүүсү»— дептир Чайковский. Менимче, «Дон Кихот», «Король Лир», «Согуш жана тынчтык», «Кыямат» сыяктуу классикалык чыгармаларсыз, Рембрандттын атактуу полотнолорусуз, Бетховендин музыкаларысыз биз жашаган дүйнө алда канча жарды болуп турмак. Александр Ивановдун «Христостун элге келиши» аттуу картинасы дүйнөдөгү теңдеши жок чыгарма. Бирок мага композициясы, тартылыш чеберчилиги, философиялык тереңдиги, адамдардын психологиясынын берилиши жагынан ага теңдеш чыгарма чалдыккан жок."},{"t":"p","h":"Третьяковкага кирген эл, бул ажайып картинанын маңдайында сааттап турушат. Дагы бир сөз, Брюллов, Левитан, Перов, Айвазовский, Крамской, Репиндин полотнолоруна арбалган көрүүчүлөрдүн ой-сезими сүрөтчүнүн бай дүйнөсү менен жуурулушуп, ортодогу узак мезгил көз ирмемге айланып, кадимкидей «сүйлөшүп» турушат. Рембрандттын сүрөттөрүн карап көрчү, ар бир чыгармасын жүрөк каны менен жазган."},{"t":"p","h":"49. -ма, -ым, -мер, -кер, -чы, -поз, -ла, -уу, -гы, -кеч, -лык мучелерун пайдаланып, жаңы маанидеги сөздөрдүн жасалышын көрсөткүлө. Аларда кандай сөз түркүмдөрүнө тиешелүү сөздөр жасалгандыгын айтып бергиле."},{"t":"p","h":"<span class=\"pg\" data-n=\"114\">114<\/span>50. Төмөнкү сүйлөм топтомдорунан морфологиялык жол менен жасалган сөздөрдү таап, ал кайсы мүчөнүн жардамы менен жаңы мааниге ээ болгонун көрсөткүлө. Ошондой эле уңгу сөз менен кайсы сөз түркүмдөрүнө тиешелүү экендигине да токтоло кеткиле."},{"t":"p","h":"1. Көңүлдүн ачкычы – сөз, билимдин ачкычы – китеп. 2. Бекерчиден безе кач, илимпозду ээрчий бас."},{"t":"p","h":"3. Боёкчу, боёкчу десе сакалын кошо боёптур. (Макал) 4. Эринчээк жалкоо дедирбей, аштык айдап эчки бак, эмгекти сүйүп дайыма, эрте туруп, шашпай жат. (Токтогул) 5. Байлык мурас эмес, жокчулук уят эмес. (Макал) 6. Көп окуу – чыгармачылыкка өбөлгө. Т7. Ары жок адам – күлкүчү, жалкоо адам – уйкучу. (Макал)"}],"sub":[],"section":"КЫРГЫЗ ЛЕКСИКАСЫНЫН БАЮУ ЖОЛДОРУ","pages":[113,114]},{"title":"§ 25. СИНТАКСИСТИК ЖОЛ АРКЫЛУУ БАЙЫШЫ","blocks":[{"t":"h3","h":"§ 25. СИНТАКСИСТИК ЖОЛ АРКЫЛУУ БАЙЫШЫ"},{"t":"p","h":"Кыргыз тилинде көптөгөн сөздөр төл лексикабыздын эсебинен сөздөрдүн айкашуусу аркылуу да жаңы мааниге ээ болгон учурлар бар. Мындай ыкма менен жаңы мааниге ээ болуп, сөздүк корду (лексиканы) байыткан сөздөр аз эмес."},{"t":"p","h":"Андай ыкма менен пайда болуп, тилдин корун толуктаган жол, лексиканын синтаксистик жол аркылуу баюусу деп аталат."},{"t":"p","h":"М ис ал ы: Басма сөз, жарыш сөз, окуу жайы, бала бакча, калем уч, китеп кап, айыл чарбасы, жел тегирмен, өнөр жай, эмгек кун, кара сөз, дене тарбия, турмуш-тиричилик, көркөм адабият, жол башчы, чакан ишкана, Жогорку Кеңеш д. у. с."},{"t":"p","h":"51. Төмөнкү сүйлөм топтомдорунан синтаксистик жол менен жаңы мааниге ээ болгон сөздөрдү таап, алар кандай сөздөрдүн айкашынан курулуп, кандай маани берип турганын айтып бергиле."},{"t":"p","h":"1. Жол башчысы жакшы болсо, эл башына бак конот. (Макал) 2. Балыкчы – Кара-Кече темир жолу элибизге көп пайда алып келери шексиз. («Кыргыз <span class=\"pg\" data-n=\"115\">115<\/span>Туусу») 3. Биз жакшы жасалгаланган боз үйдөн орун алдык. 4. Кант кызылчасы канчалык көп жыйналса, кумшекер да ошончолук көп болот. 5. Дем алыш күнү баарыбыз чогулмай болдук. 6. Окуучунун күндө керектөөчү куралы – калем сап, дептер жана окуу китеби."},{"t":"p","h":"7. Мектептин ремонтуна мен акиташ жана кол кап алып келмекчи болдум. («Кут билим») 8. Алганың акжолтой болуп, тең арып, тең карыгыла. 9. Мурда чек ара дегенди билбестен мазарыбыз да бир, базарыбыз да бир болуп, аралашып эле жүрбөдүк беле. 10. Убакыттын кечтеп баратканы унутулуп, улам биринен соң бири жарыш сөзгө чыгып жатты. 11. Массалык маалымат каражаттарында, басма сөз беттеринде айыл чарбасын кайра куруу жөнүндө кеңири талкуу жүрүп жатты. 12. «Жандоочуң жакшы болсо кийик аттырат» дегендей, орун басары мыкты болгон жетекчинин да иши оңунан чыгып турат экен. («Кыргыз Туусу»)"}],"sub":[],"section":"КЫРГЫЗ ЛЕКСИКАСЫНЫН БАЮУ ЖОЛДОРУ","pages":[115,115]},{"title":"§ 26. СЕМАНТИКАЛЫК ЖОЛ АРКЫЛУУ БАЙЫШЫ","blocks":[{"t":"h3","h":"§ 26. СЕМАНТИКАЛЫК ЖОЛ АРКЫЛУУ БАЙЫШЫ"},{"t":"p","h":"Эне тилибизде төл сөз катары мурдатан эле колдонулуп жүргөн кээ бир сөздөрдүн маанилик жактан кеңип, жаңы кошумча мааниге ээ болушун кыргыз тилинин лексикасынын семантикалык жол аркылуу байышы дейбиз."},{"t":"p","h":"М исал ы: уӊгу, көшөгө, тамыр, мүчө, борбор, солчул, көргөзмө, ээ, айлана, ордо, бурч д. у. с."},{"t":"p","h":"Бул сөздөрдүн алгачкы маанилерине жана кийинки учурда пайда болуп, кеңири колдонулуп жүргөн маанилерине көз салсак, алардын семантикалык (маанилердин кеңейүү же көбөйүү) жолу менен лексикабыздын байып жатканына күбө болобуз."},{"t":"p","h":"Мисалы: Тамыр- алгачкы манисинде өсүмдүктүн жерге кирип, азык алып жана анын өзүн бышык кармап турган бөлүгүн же адамдын денелерин кан менен азыктандырып турган түшүнүктөрдү берсе, кийинки <span class=\"pg\" data-n=\"116\">116<\/span>учурда математикалык термин катары колдонулуп, радикалдын алдындагы туюнтманы билдирип калды. Мүчө – алгачкы маанисинде дене бөлүктөрүн билдирсе, кийинки учурда кандайдыр бир уюмга тиешелүү экендикти же грамматикалык түшүнүктү (баш же айкындооч мүчөнү) билдирип калды."},{"t":"p","h":"М и с а л ы: Мен партиялардын бирине мүчө болоюн деп жүрөм. Сиз кайсы акционердик коомго мүчө элеңиз? Сүйлөмдүн баш мүчөлөрү – ээ жана баяндооч. Театрдын көшөгөсү ачылар замат көрүүчүлөр сахнага тигиле карашты. Эки көшөгөлүү, төрт сүрөттүү пьесаны көрүп кайттык. Борбордон бардык чекиттери бирдей аралыкта турган туташ сызык айлана деп аталат. Дептердеги карандаш менен жазылгандарды өчүргүч менен өчүрүп чыккыла. Жарыкты өчүргүч бузулуп калыптыр, жаңысын сатып келүү керек."},{"t":"p","h":"52. Төмөндөгү сүйлөмдөрдү окуп чыгып, андагы семантикалык (маанилик жаңылануу) жолу менен колдонулган сөздөрдү бөлүп көрсөткүлө. Ал сөздөрдүн алгачкы маанилери кандай түшүнүктү бергендигин жана кийинки болгон маанилик өзгөрүштөрүн айтып бергиле."},{"t":"p","h":"1. Ордонун борборунан бир аз аралыкта жаткан чүкөлөрдү чертип бүтөрүнө жакын «эми ханды черт, ханды черт» деген жабалактаган үндөр чыкты. (Т. Сыдыкбеков) 2. Бишкек – биздин мамлекеттин административдик гана борбору эмес, өнөр жай тармактарынын, маданияттын да борбору. («Кыргыз Туусу») 8. Оң кол, сол кол экөө бирдей кол. Көп жылдан бери алым алып, салык жыйып, күн көрсөтпөй турган баскынчылардын зомбулугунан кутулуу үчүн кол курап, жол камын көрө баштайт. («Курманбек») 4. Башталгыч класстарда окуткан мугалими жазууга жакшы көңүл бөлсө, окуучулардын колу да жакшы болот. («Кут билим») 5. Жакшылап ынтаа коюп угуп, окуп, эрежени үйрөнгөн окуучу сөздөргө морфологиялык талдоо жүргүзгөндө аны уңгу, мүчөгө так ажыратат. (Б. Үмөталиева) 6. Уңгусу карыш чоң кетмен, кол <span class=\"pg\" data-n=\"117\">117<\/span>учунда ойносоң. (Осмонкул) Т. «Бас» деген уңгу этишке -ма мүчөсүн улаганда кандай сөз түркүмүнө өтөт? 8. Ар ким өз эмгеги менен тапкан дөөлөткө өзү ээ болуу керек. (Ж. Медералиев)"}],"sub":[],"section":"КЫРГЫЗ ЛЕКСИКАСЫНЫН БАЮУ ЖОЛДОРУ","pages":[116,117]},{"title":"§ 27. БАШКА ТИЛДЕРДЕН СӨЗМӨ-СӨЗ КОТОРУУ ЖОЛУ МЕНЕН БАЙЫШЫ ЖЕ КАЛЬКАЛОО","blocks":[{"t":"h3","h":"§ 27. БАШКА ТИЛДЕРДЕН СӨЗМӨ-СӨЗ КОТОРУУ ЖОЛУ МЕНЕН БАЙЫШЫ ЖЕ КАЛЬКАЛОО"},{"t":"p","h":"Бир тилдеги сөздү же сөз тизмегин ошол үлгү менен экинчи бир тилге сөзмө-сөз которуу аркылуу пайда болгон жаңы маанидеги сөздөр тилдин лексикалык курамын байытууда өзүнчө орунга ээ. Кыргыз тилинин лексикасынын баюу жолунда мындайча которуу жолу (калькалоо) аркылуу жаңы мааниге ээ болгон сөздөр, негизинен, кыргыз элинин орус эли менен маданий, саясий, экономикалык тыгыз байланышта болгон мезгилине туш келет. Бул айрыкча Октябрь революциясынан кийинки учурду кучагына алат."},{"t":"p","h":"Башка бир тилдеги сөздөрдүн же сөз тизмегин ошол үлгүсүндө сөзмө-сөз которуу жолу менен жаңы мааниге ээ болгон сөздөр азыркы учурда тилибизде арбын учурайт."},{"t":"p","h":"М и с а л ы: @ндуруш (производство), айыл чарбасы (сельское хозяйство), кол жазма (рукопись), курулуш материалдары (строительные материалы), көркөм чыгармачылык (художественная деятельность), көп чекит (многоточие), угуучу (слушатель), көрсөткүч (показатель), солчул агым (левое течение), суу сактагыч (водохранилище) д. у. с."},{"t":"p","h":"Сөзмө-сез которуу (калькалоо) жолу аркылуу жаны мааниде пайдаланыла баштаган сездер которуу мунезунде же ыгына карата эки топко белунет. Алар толук жана толук эмес которуу же калькалоо деп аталат."},{"t":"p","h":"1. Толук которуу. Бир тилден экинчи тилге толук, сөзмө-сөз которуу жолу менен алынып, маанилик <span class=\"pg\" data-n=\"118\">118<\/span>жылышка же жаңы мааниге ээ болгон сөздөр жана сөз айкаштары толук калька деп аталат."},{"t":"p","h":"М и сал ы: кызыл бурч (красный уголок), Ардак такта (Доска почета), темир жол (железная дорога), муздаткыч (холодильник), буу казан (паровой котел), ылдамдык (скорость), абанын басымы (давление воздуха), эл аралык (международный), ага окутуучу (старший преподаватель), кенже илимий кызматкер (младший научный сотрудник), учкуч (летчик), жумушчу табы (рабочий класс), тундук уюл (северный полюс), Аяз ата (Дед Мороз), сөздүк (словарь), байланыш бөлүмү (отделение связи) д. у. с."},{"t":"p","h":"2. Толук эмес которуу. Бир тилден экинчи тилге бири толук которулуп, экинчиси (же калган сынарлары) которулбастан алынып жаңы түшүнүктү пайда кылган же маанилик жылыштарга ээ болгон татаал сөздөрдү же туруктуу сөз айкаштарын толук эмес калька дейбиз."},{"t":"p","h":"М и с а л ы: ак гвардия, чийки сырье, кыймыл инерциясы, улуттук банк, беш жылдык план, электр өткөргүч, партиялык уюм, археологиялык казуу, солчулдар партиясы, капиталдык салым, негизги фонд, убакыт нормасы, массалык өндүрүш, бухгалтердик эсеп, мамлекеттик стандарт, коллектив менчиги, жергиликтуу бюджет, товар айлантуу д. у. с."},{"t":"p","h":"53. Төмөндө берилген текстти окуп чыгып, андагы которуу (калькалоо) жолу менен лексикабызга кирген сөздөрдү көрсөткүлө. Алардын кайсынысы толук, кайсылары толук эмес калька экендигин түшүндүрүп бергиле."},{"t":"p","h":"Салттар – тарыхый жактан калыптанып, өтө туруктуу, муундан-муунга өтүп жашап келаткан, көркөм нарктуу адаттар, жөрөлгөлөр, адамдардын көз караштары, ой сезимдери, көркөм чыгармачылыктын сюжеттери, ыкмалары ж. б. Салт коомдук психологиянын чөйрөсүндө жаралат, белгилүү бир шарттарда ал теориялык аң-сезимдин деңгээлинде түшүндүрүлүшү мүмкүн, ошондон барып ал идеялык, <span class=\"pg\" data-n=\"119\">119<\/span>саясий багытка ээ болот. Салттын мүнөздүү белгиси – белгилүү бир ыймандык-эстетикалык касиеттерге ээ болушу."},{"t":"p","h":"Ар бир эле коомдук формациянын көркөм маданиятында бекем же бошоң көркөм салт калыптанат, алар тарыхый шарттарга жана социалдык топтордун, таптардын, элдердин өзгөчөлүктөрүнө байланыштуу болот. Салт болуп калган ыкмалардын жардамы менен көркөм маданият чыгармачылыктын социалдык касиеттерин улам кийинкиге өткөрүп келе берет. Бул көркөм чыгармачылыктын ыкмаларынын ар түрдүү улуттук символдорунун, көркөм каражаттарынын образдар системасын ж. б. көп ирет кайталоо менен ишке ашырылат. Салттуу искусство, көркөм маданияттын андан ары өнүгүшүнүн негизи болуп саналат. Жаңы коомдун маданияты жок жерден пайда болбостон, демократиялык салтты сактоо менен өткөндүн бүткүл маданий мурасын сын көз менен өздөштүрүүнүн жана кайра иштеп чыгуунун негизинде түзүлөт. («Көркөм маданият»)"},{"t":"p","h":"54. Төмөнкү сүйлөм топтомдорунан сөзмө-сөз которуу (калькалоо) жолу менен лексикабызда жыш колдонулуп жүргөн сөздөрдү жана сөз айкаштарын тапкыла. Алардын кайсынысы толук эмес калька экенин аныктап, аны негиздеп бергиле."},{"t":"p","h":"1. Кийинки жылдары китеп чыгаруу кыйындап кеткендиктен канчалаган көркөм чыгармалар кол жазма түрүндө өз бактысын күтүп жатат. (К. Сактанов) 2. Кыргыз Республикасынын Улуттук илимдер академиясында кенже илимий кызматкер болуп иштегениме отуз жылдан ашып баратат. 3. Ош шаарынын үч миң жылдыгына карата жүргүзүлгөн археологиялык казуунун табылгалары эл аралык көргөзмөлөргө коюлду. 4. Ош – Бишкек жолун оңдоого эл аралык банктан каражат бөлүнгөн эле. Азыр эл аралык стандартка ылайык келүүчү иштер жүргүзүлүп, жол бойлоруна көрсөткүч белгилер коюлду. («Кыргыз Туусу») 5. Кыргыз жеринин кен байлыктары башка өлкөлөр <span class=\"pg\" data-n=\"120\">120<\/span>үчүн чийки сырье берүүчү база гана болбостон, өзүнүн өнөр жайы, өндүргүч күчү, жумушчу табы болууга тийиш. 6. Жалал-Абад шаарындагы электр жабдууларын чыгаруучу ишкана өз продукциясын массалык өндүрүшкө коюп жатат. 7. Салык саясаты мамлекеттик казынаны гана эмес, жергиликтүү бюджетти да толтурат. 8. Телемост аркылуу алыста турган эки шаардагы адамдар түз эфирге чыгышып сүйлөшүп, пикир алышып жатканы көнүмүш иш болуп бара жатат. («Кыргыз Туусу») 9. Мамлекеттик негизги фонд өнөр жайлары тарабынан кошулган капиталдык салымдарга түздөн-түз байланыштуу. 10. Акционердик коомдун мүлкү – коомдук менчик, анда болгон байлык коллективдин менчиги катары көпчүлүк тарабынан көзөмөлгө алынат. 11. Жаңы жылдык ёлкада Аяз ата берген белекке жаш балдар кубанып, зал ичин күлкү менен шаңга бөлөштү. 12. Базар экономикасы сарамжалдуулукту, так бухгалтериялык эсепти сүйөт. («Кыргыз Туусу»)"}],"sub":[],"section":"КЫРГЫЗ ЛЕКСИКАСЫНЫН БАЮУ ЖОЛДОРУ","pages":[118,120]},{"title":"§ 28. ДИАЛЕКТИЛИК БАЙЛЫКТАРДАН ТУУРА ПАЙДАЛАНУУ АРКЫЛУУ БАЙЫШЫ","blocks":[{"t":"h3","h":"§ 28. ДИАЛЕКТИЛИК БАЙЛЫКТАРДАН ТУУРА ПАЙДАЛАНУУ АРКЫЛУУ БАЙЫШЫ"},{"t":"p","h":"Ар бир элдин адабий тили анын диалектилик байлыктарынын эсебинен да толукталып турат. Адабий жактан калыптанган улуттук тилдин бир нече диалектиси болот. Диалекти дегенибиз – адабий тилдин нормасынын фонетикалык, морфологиялык, лексикалык жактан айырмаланып, белгилүү бир аймакка гана тиешелүү болуп турган өзгөчөлүктөрдүн жергиликтүү жалпылыктары. Кыргыз тилинин үч диалектиси бар. Алар: түштүк-чыгыш, түштүк-батыш жана түндүк диалектиси (Б. М. Юнусалиев. Кыргыз диалектологиясы, Ф., «Мектеп», 1971). Ошондой диалектилерде, б. а., чектелген аймактарда гана колдонулуп, адабий тилден айырмаланган сөздөр диалектизмдер деп аталат. Ал диалектизмдердин адабий тилде синонимдери <span class=\"pg\" data-n=\"121\">121<\/span>жоктору же абдан кеңири колдонулгандары адабий тилге кирип, анын лексикасын байытат."},{"t":"p","h":"М и с ал ы: десте (гүлдесте, мурда «букет» деп да жүргөнбүз), дарче (терезенин четиндеги кичинекей ачылма, мурда «форточка» деп айтылчу), кардар (сатып алуучу катары кайрылган тарап), замбар (замбил деп да койчубуз), шып (муну түндүк диалектиде кээде адабий тилдеги басылмаларда «потолок» деп айтылган учурлары бар), дализ (коридор), палок (коон, дарбыздын сабагы), гозо пая (пахтанын сотосу), пакза (сокмо дубалдын катмары), сойго (эгин отоочу курал), загыра нан (жүгөрү унунан жасалган нан), жабан (сандыктын түрү), сынч (дубалдын арасына коюлган жыгач), азил (тамаша), маараке (аш-тойлор, юбилейлик аземдер), мис табак (тамак-аш салынуучу жезден жасалган табак), пахта (кебез), парасат (аң-сезим, акыл-эс, аңдап билүү), бейпил (тынч, мамыр-жумур, эч нерседен капарсыз), дидар (өң, жүз), алээм (ичи күйүү, өзүндө жокко же өзү аткара албаганына ичи күйүп, бушайман болуу), почок (коон, дарбыздын жегенден калгандагы кабыгы), кунжара (чигиттен, күн карамадан д. у. с. өсүмдүктөрдөн май чыгарып алгандагы калдыгы), андава (шыбак шыбоодо колдонулуучу курал-аспап), ак жубаз (күрүч актоочу жай жана ага керектөөчү шаймандары) д. у. с."},{"t":"p","h":"55. Төмөндөгү сүйлөм топтомдорун окуп чыгып, кайсы сөздөрдүн диалекти аркылуу адабий тилге кирип, азыркы учурда активдүү колдонулуп жүргөндөрүн дептериңерге көчүрүп жазып, ал боюнча өз пикириңерди айтып, маанисин чечмелеп бергиле,"},{"t":"p","h":"1. Ошондо он эки кыз 1-класстын астанасын бирге аттаган элек, азыр ошолордон үчөөбүз гана калдык. (К. Бобулов) 2. Той кызматындагы аялдардын экөө бир-бирден мис чылапчын, жаркыраган мис абдесте көтөрүп кирип келишти. 3. Анын ийниндеги мизи жалтылдаган байтешеси оңой уста эмес экендигинен кабар берип турду. Сыягы, жанындагы тамтыгы <span class=\"pg\" data-n=\"122\">122<\/span>кеткен боз жегдечен жигит экөө мандикер болуп жүргөн окшойт. (М. Абдукаримов) 4. Төрүбүздө шыпка жете жыйылган үч мээрап жүк үйүбүздүн көркү."},{"t":"p","h":"5. Пешайбандын кыбыла жак бурчундагы чарпаяда бостек төшөлгөн орун салынган. 6. Сайдан өткөн соң аттан түшпөй эле, көк моюн шишени койнунан алып чыгып: «Келгиле бир аздан сеп этип алалы»,- деди. (Ш. Абдыраманов) Т. Бий өзүнүн өкүмдарлиги, каардуулугу менен гана эмес, пакизалиги менен да беркилерден айырмаланып турду. 8. Кыштоодо калгандар негизинен жер айдап, эгин эккен чарбакерлер болучу. (М. Абдукаримов) 9. Куршаб селосунун суу маселесин талкуулоо үчүн маале башчылары чогулушту. 10. Нарын шаарында областтан чыккан мыкты инсандарынын айкелдери орнотулду. 11. Журналисттик кесибиме байланыштуу көп жерде болуп, Таластын күлчөтайын, түштүктүн палоосун, тандырга жабылган нанын жакшы эле жедим. 12. Жаңы курулган бейтапкана төрт чоң айылдын эли үчүн жакшы болду, эми райондун борборуна зарыгып автобус күтпөй, оору үстүнө оору кошпой оңуп эле калдык. («Кыргыз Туусу»)"}],"sub":[],"section":"КЫРГЫЗ ЛЕКСИКАСЫНЫН БАЮУ ЖОЛДОРУ","pages":[121,122]},{"title":"Кыргыз тилинин лексикасынын байышынын","blocks":[{"t":"h3","h":"Кыргыз тилинин лексикасынын байышынын"},{"t":"p","h":"тышкы булактары"},{"t":"p","h":"Ар кандай тилдин лексикасынын байышы башка тилдерден кабыл алынган сөздөрдүн эсебинен да жүрөт. Анткени эл тарыхтын бардык учурларында экинчи бир эл менен маданий байланышта, экономикалык жактан карым-катнашта болуп келген. Коомдун өнүгүшүндөгү бир улут менен экинчи улуттун мындай байланыштары алардын тилинин сөздүк коруна кошулуп, лексикасын байыткан. Андай көрүнүштөр коомдук өнүгүүнүн түрдүү тармактарынан байкалат. Тактап айтканда, бир тилден экинчи тилге өткөн же кабыл алынган сөздөр дыйканчылыкка, мал чарбачылыгына, багбанчылыкка, курулуш <span class=\"pg\" data-n=\"123\">123<\/span>иштерине, көркөм өнөргө, саясатка, жоокерчиликке, соодага, өнөр жайына, техникага, илим-билимге д. у. с. байланыштуу өткөн. Сөздөрдүн мындай жол менен кабыл алынышы кыргыз тилинде эң арбын учурайт. Ал кыргыз тилинин лексикасынын баюусунун тышкы булагын түзөт."},{"t":"p","h":"Кыргыз эли өзүнүн тарыхында ар түрдүү доорлордо ар башка улуттар, элдер, мамлекеттер менен алака-катнашта болгондуктан, кабыл алынган сөздөр да ошол турмуштун кайсы тармагында аралашкандыгына байланыштуу сөздөр менен ырасталып турат. Алсак, иран-перси тилинен курулуш, дыйканчылыкка, араб тилинен динге, монгол тилинен мал чарбачылыгына, орус тилинен техникага, илим-билимге байланыштуу сөздөрдүн арбын учурашы жогоруда айтылгандарды ырастайт. (Башка тилдерден кирген сөздөр ушул айтылган багыттар менен эле чектелбейт. Андай сөздөр турмуштун бардык тармактарынан жолугушу мүмкүн.)"}],"sub":[],"section":"КЫРГЫЗ ЛЕКСИКАСЫНЫН БАЮУ ЖОЛДОРУ","pages":[123,123]},{"title":"§ 29. ОРУС ТИЛИНЕН КИРГЕН ЖАНА ОРУС ТИЛИ АРКЫЛУУ КАБЫЛ АЛЫНГАН СӨЗДӨР","blocks":[{"t":"h3","h":"§ 29. ОРУС ТИЛИНЕН КИРГЕН ЖАНА ОРУС ТИЛИ АРКЫЛУУ КАБЫЛ АЛЫНГАН СӨЗДӨР"},{"t":"p","h":"Кыргыз тилинин лексикасында орус тилинен тикелей кирген же кабыл алынган, ошондой эле ал тил аркылуу башка тилдерден кабыл алынган сөздөр арбын. Бул көрүнүш кыргыз элинин тарыхый жолунун соңку учурларында, айрыкча, ХІХ кылымдын акырындагы жана XX кылымдын ичиндеги байланышы жана жанаша жашоосу менен түшүндүрүлөт."},{"t":"p","h":"М и сал ы: керебет, завод, актив, поезд, меш, ашмушке чай, болуш, агроном, машина, алфавит, адрес, үстөл, пароход, соко, чиркөө, цифра, карта, банк д. у. с."},{"t":"p","h":"Кыргыз тилине орус тилинен кабыл алынган сөздөрдү, негизинен, эки доорго бөлөбүз:"},{"t":"p","h":"<span class=\"pg\" data-n=\"124\">124<\/span>1. Октябрь революциясына чейин кабыл алынган сөздөр;"},{"t":"p","h":"2. Октябрь революциясынан кийин кабыл алынган сөздөр."},{"t":"p","h":"Илим-билимге, искусствого, курулушка, адабиятка, техникалык жетишкендиктерге байланыштуу көптөгөн д. у. с. сөздөр орус тили аркылуу кыргыз тилине кирген. Ал сөздөрдүн дээрлик бардыгы советтик доордо кабыл алынгандыктан тыбыштык өзгөрүүлөргө дээрлик учураган эмес."},{"t":"p","h":"М и с а л ы: поэзия, либретто, морфология, театр, архитектура, этаж, аэрофлот, полиартрит, симфония, дирижер, актер, конституция, парламент, президент, конгресс, автомобиль, атмосфера, космос, фонд, аксиома, спорт, пейзаж, авангард, экран д. у. с."},{"t":"p","h":"56. Теменку тексттен кыргыз тилинин лексикасына орус тили аркылуу башка тилдерден кирген сездерду тапкыла, маанисин тушундургуле. Мисалы: лексикология – грек сезу. «Лексикос» – сөз, «логос» – илим деген маанини билдирет. Экөө биригип сөз жөнүндөгү илим, т. а., сөздөрдү окутуп үйрөтүүчү тил илиминин бир салаасы."},{"t":"h3","h":"космос"},{"t":"p","h":"Биз аба менен дем алабыз, аба катмары атмосфера деп аталат. Атмосферанын катмары бир нече ондогон километр бийиктикке чейин гана жетет да, андан ары абасыз аалам башталат. Ошол мейкиндикти космос деп атайбыз."},{"t":"p","h":"Эгерде биз айга саякат жасай турган болсок, жолубуз эки бөлүктөн турар эле: анын биринчи бөлүгү – атмосфера катмары, экинчи бөлүгү космос мейкиндиги болмокчу. Жерден жогору көтөрүлгөн сайын салмагыбыз азая берет жана салмаксыздык абал пайда болот. Мисалы, он килограмм жүктү 18 миң метр бийиктикке көтөрүп алып чыга турган болсок, анда ал жүгүбүз бир килограмм гана болуп калар эле. («Кырчын»)"},{"t":"p","h":"<span class=\"pg\" data-n=\"125\">125<\/span>57. Текстти окуп чыгып, андагы которуу (калька) жолу менен жана орус тили аркылуу кабыл алынган сөздөрдү көрсөткүлө."},{"t":"h3","h":"ОТУН ЖАНА АНЫ КҮЙГҮЗҮҮНҮН ЫКМАЛАРЫ"},{"t":"p","h":"Отундун түрлөрү. Практикада отундун -— катуу, суюк жана газ абалындагы үч түрүн пайдаланышат. Катуу отундарга антрацит, таш көмүр, күрөң көмүр, күйүүчү сланецтер, чым көң жана жыгач кирет."},{"t":"p","h":"Отундун сапаты анын жылуулук пайда кылуучу жөндөмдүүлүгүнө, б. а., 1 кг отун күйгөндө бөлүнүп чыккан жылуулуктун саны менен аныкталып белгиленет. Отун көмүртекке канчалык бай болсо, анын жылуулук пайда кылуу жөндөмдүүлүгү ошончолук жогору болот."},{"t":"p","h":"Казылып алынуучу көмүрлөр отун түрүндө гана пайдаланылбайт. Казылып алынган көмүрдүн 1/4 ине жакынын абаны катыштырбай ысытышат (пиролиз). Натыйжада коксту жана пластмассаларды, боёкторду, дарылык заттарды ж. б. үчүн пайдаланылуучу ар кандай заттарды алышат."},{"t":"p","h":"Суюк отунга нефтини кайра иштетүүнүн продуктулары: бензин, керосин, мазут ж. б. кирет. Нефтинин жана анын продуктуларынын жылуулук пайда кылуу жөндөмдүүлүгү өтө чоң."},{"t":"p","h":"Өнөр жайда катуу отунду үзгүлтүксүз иштей турган мештерде күйгүзүшөт. Үзгүлтүксүздүк принциби кыймылдуу колосник торчосунун жардамы менен ишке ашат, ага катуу отун үзгүлтүксүз берилип турат."},{"t":"p","h":"Катуу заттар катышкан реакциянын ылдамдыгы алардын беттерине, ал эми бет өлчөмү – заттардын майдалануу даражасына байланыштуу болгондуктан бир кыйла рационалдуу күйгүзүү максаттарында, катуу отунду күкүмдөлүп майдаланган чаң абалында күйгүзүүгө боло турган мештерди курушат. Суюк отунду да ушинтип күйгүзүшөт."},{"t":"p","h":"Күйүүчү газдарды отун катары жылдан-жылга көп колдонуп жатабыз. Күйгүзүү үчүн газ абалындагы <span class=\"pg\" data-n=\"126\">126<\/span>отунду жана абаны мешке металл түтүк боюнча беришет. Газ аралашмасын түтүктөн чыкканда күйгүзүшөт. Газ абалындагы отунду күйгүзүү үчүн, ошондой эле өзгөчө керамикалык мештер кызмат кылат, ага күйүүчү газ жана зарыл болгон өлчөмдөгү аба өтө майда каналдар аркылуу берилип күйгүзүлөт."},{"t":"p","h":"(9-класстын «Химия» окуу китебинен алынды)"}],"sub":[{"title":"ОТУН ЖАНА АНЫ КҮЙГҮЗҮҮНҮН ЫКМАЛАРЫ","b":13}],"section":"КЫРГЫЗ ЛЕКСИКАСЫНЫН БАЮУ ЖОЛДОРУ","pages":[124,126]},{"title":"§ 30. ОКТЯБРЬ РЕВОЛЮЦИЯСЫНА ЧЕЙИН ОРУС ТИЛИНЕН КАБЫЛ АЛЫНГАН СӨЗДӨР","blocks":[{"t":"h3","h":"§ 30. ОКТЯБРЬ РЕВОЛЮЦИЯСЫНА ЧЕЙИН ОРУС ТИЛИНЕН КАБЫЛ АЛЫНГАН СӨЗДӨР"},{"t":"p","h":"ХІХ кылымдын аягында орус калкынын кыргыз жергесине келип отурукташа башташы кыргыздар менен орустардын карым-катнашта жашоосуна шарт түзгөн. Натыйжада, алардын жаңы жерге келип, тиричилигин өткөрүүгө байланыштуу колдонгон буюмдарына, айыл чарба шаймандарына, административдик бөлүүгө байланышкан бир топ сөздөр жергиликтүү элдин тилинде колдонула баштаган."},{"t":"p","h":"М и сал ы: саржан, бороз, каамыт, боожу (айыл чарба шаймандары), үстөл, керебет, самоор (үй буюмдары), батнике, шапке, купайке (кийим-кечелер), болуш, ыстарчын, уйез же ойоз (кызмат жана аймактык атоо), жарманке, көпөс, сөлкөбай (соода-сатыкка байланыштуу) д. у. с."},{"t":"p","h":"Арбиртилдин мыйзамченемдүүлүгү (ички мыйзамы) болот. Ага байланыштуу башка тилден кабыл алынган сөздөр кабыл алган тилдин өзүнүн ички мыйзамына баш ийүү аркылуу айрым тыбыштык өзгөрүүлөргө учурайт. Алсак, самоор деген сөз орус тилиндеги самовар, жарманке (орусча ярмарка), ыстарчын (старшина), каамыт (хомут), соко (соха), болуш (волость) деген сөздөр. Алардагы тыбыштык өзгөрүүлөр али орус тилинин тыбыштык системасына көнө электиги жана кыргыз тилиндеги мыйзамченемдүүлүктөр менен түшүндүрүлөт."},{"t":"p","h":"М и сал ы: орусча «церковь» деген сөздү кыргыз тилинде сүйлөөчүлөр дароо өздөштүрүп кете албастыгы <span class=\"pg\" data-n=\"127\">127<\/span>табигый көрүнүш. Себеби биринчиден, кыргызда ц тыбышы мурда болбогон, аны сөз башында айтууга да тилдик аппараттар көнбөгөн. Натыйжада, өз тилине ыңгайлаштырылып «чиркөө» деп алынганы ыңгайлуу, айтууга жеңил болду. «Бөтөлкө» деген сөз орус тилинде «бутылка» болуп айтылат, бирок кыргыз тилинде үндүүлөрдүн үндөшүүсү күчтүү болгондуктан, у, ы, а тыбыштарынын айтылышы эриндин катышы жана жаактын ачылышы боюнча да бири-биринен айырмалангандыктан, аларды бир эле сөздө айтуу кыйын. Ошондуктан андай ар түрдүү мүнөздөгү үндүү катышкан сөз кыргыз тилинде бири-бирине жакындашып, окшошуп айтылып, өзгөрүүгө учурайт. Бул сөздөгү у, ы, а тыбыштары айтууга оңтойлошуп, баары ө тыбышына өтүп, «бөтөлкө» болуп өзгөрүп кеткен. «Көпөс» деген сөз да орус тилиндеги «купец» деген сөздөн алынган. Мында да ц тыбышынын жоктугунан жана үндөшүп окшошуунун таасиринен «көлөс» болуп тыбыштык жактан өзгөрүүгө учураган. «Боожу» деген сөз да (орус тилинде «вожжи» – сокого же арабага чиркелген аттарды алыстан башкарып алып жүрүүчү тизгин сымал узун жип), биринчиден, сөз башында в тыбышынын келбестиги, экинчиден ж тыбышынын катар айтылбасы, үчүнчүдөн, үндөштүк (сингармонизм) мыйзамынын таасири менен ушундай өзгөрүүгө учураган."},{"t":"p","h":"Башка тилдердеги, айрыкча, орусча сөздөрдү тыбыштык жактан өзгөртүп, кыргыз тилинин ички мыйзамына (табиятына) ылайыктап алуу, негизинен, советтик доорго чейинки мезгилге тиешелүү."},{"t":"p","h":"58. Текстти көңүл коюп окуп чыккыла. Андагы советтик доорго чейин кыргыз тилине орус тилинен кирген сөздөрдү таап, кандай тыбыштык өзгөрүүлөр менен кабыл алынганын айтып бергиле."},{"t":"p","h":"Быйыл жети жылдын жүзү болду. Орусиядан келген мужуктардан соко айдаганды өздөштүрүп, кара топурактуу кыртыштары бар жерлерге картөшкө эге баштадык. Ойоз, кантон деген бөлүштүрүүлөргө кулагыбыз <span class=\"pg\" data-n=\"128\">128<\/span>бышып, өз ыстарчындарыбызды, болуштарды ажырата билип калдык. Келгендердин керебетине кериле жатып, үстөлүнө өбөктөп, бөлкөлөрүн бөлө жешкен учурлар болду. Кантсе да, алар өнөргө жакын эл келет экен, соколорду көбөйтүп, буурсундар азайды, олдоксон моюнтуруктар жылма каамыттарга алмашылды."},{"t":"p","h":"Көл кылаасында жана Чүй боорунда отурукташкандар көбөйүп, кээ бир селолордо орус-тузем мектептери ачылды. Токмок жана Караколдо чиркөө курулуптур дегенди угуп, аны көрүү үчүн атайын ат арытып баргандар да болгон."},{"t":"p","h":"Орустардын акчасынан сөлкөбайларды кыргыз кыздары боо тактырып, көкүрөгүнө кадап, кооздук үчүн пайдаланышса, ага келгиндер баш чайкашып, таң калышар эле. А түгүл кээде «Бул ак падышанын акча бирдиги, аны бузсаңар түрмөгө түшөсүңөр» деген сөздөн улам, аларды кайрадан чогултуп алышып, көз көрбөс жерге бекиткендер кезиккен."},{"t":"p","h":"Келгиндер менен жергиликтүүлөрдүн ынтымагы он бешинчи, он алтынчы жылдары бузула баштады. Анткени ошол жылдары жергиликтүү элден солдатка алуу маселеси коюлуп жаткан болчу. Атүгүл, буга каршы айрым ойоздордо нааразылык билдирген көтөрүлүштөр да чыгып кеткендиги айтылып жатты."},{"t":"p","h":"Биз, 14-15 жаштар чамасындагы балдар, ата-энебиздин «эч кайда чыкпай отургула» дегенине карабай, шаардагы казарма аянтындагы атчандар атрияты турчу жерге бардык. Саат 10го жакын чиркөөдө коңгуроо чалынып, эл ошол жакка сүрүлдү. Ал жерде ойоз начальниги Иванов элге кайрылып сүйлөп жатты. (Х. Карасаев)"}],"sub":[],"section":"КЫРГЫЗ ЛЕКСИКАСЫНЫН БАЮУ ЖОЛДОРУ","pages":[127,128]},{"title":"§ 31. СОВЕТТИК ДООРДО ОРУС ТИЛИНЕН КАБЫЛ АЛЫНГАН СӨЗДӨР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"129\">129<\/span>§ 31. СОВЕТТИК ДООРДО ОРУС ТИЛИНЕН КАБЫЛ АЛЫНГАН СӨЗДӨР"},{"t":"p","h":"Кыргыз тилинин лексикасынын байышына совет доорунан кийинки мезгилдеги орус тилинен кабыл алынган сөздөргө өзгөчө орун тиешелүү. Анткени бул мезгилде эки элдин ортосундагы карым-катнаш абдан кеңейип, илим-билимге, маданиятка, техникага, өндүрүшкө, саясатка байланыштуу көптөгөн сөздөр кыргыз тилине кирди."},{"t":"p","h":"М исал ы: завод, бригада, кооператив, трактор, станция, реформа, сезон, станок, цех, класс, норма, самолет, закон, район, консерва, квартира, повесть, художник д. у. с."},{"t":"p","h":"Орус тилинен кыргыз тилине кабыл алынган сөздөр абдан көп. Ошону менен бирге – ал сөздөрдүн бир тобу орус тилине да башка тилдерден кирген сөздөр. Алардын кыргыз тилине келиши орус тили аркылуу ишке ашып жатат. Ошондуктан андай сөздөрдү кыргыз тилине башка тилдерден орус тили аркылуу кабыл алынган сөздөр деп атайбыз."},{"t":"p","h":"М и с ал ы: поэзия, республика, конституция, премьер, музыка, архитектура, грамматика, спорт, рекорд, кодекс, комбайн, гений, глобус, база, атлас, архив ж. у.с."},{"t":"p","h":"59. Төмөндөгү текстти окугула да, кайсы сөздөрдү кабыл алынган сөздөр деп эсептериңерди көрсөтүп, себебин айтып бергиле."},{"t":"h3","h":"ДЕМОКРАТИЯ ДЕГЕН ЭМНЕ?"},{"t":"p","h":"Биздин заманга чейинки V кылымдагы Афинада алгачкы демократия – элдик башкаруу пайда болгон. Сөздүктө: «Демократия – бул башкаруунун элдик формасы, ал эң жогорку бийликке жана эл бийликти өзү же өзүнүн эркин шайлоо системасында шайланган өкүлдөрү аркылуу ишке ашырат», – деп аныкталат."},{"t":"p","h":"<span class=\"pg\" data-n=\"130\">130<\/span>Авраам Линколдун айтуусунда: «Демократия – бул эл үчүн өзү ишке ашырган элдик башкаруу»."},{"t":"p","h":"Эркиндик жана демократия, адатта бири-бирин алмаштыра алган түшүнүктөр, бирок алар синонимдүү сөздөр эмес. Демократия – чындыгында эле эркиндик жөнүндөгү идеялар менен принциптердин топтому, бирок ал ошол учурда узак мезгил аралыгындагы калыптанган практикалык нормалар менен процедуралардын да топтому болуп саналат. Кыскача айтканда, демократия – бул эркиндикке мыйзамдык статус берүү."},{"t":"p","h":"Демократия түз жана өкүлчүлүктүү деген эки негизги категорияларга бөлүнөт. Түз демократияда атуулдар шайланган же бекитилген расмий адамдардын ортомчулугусуз эле коомдук чечимдердин кабыл алынышына катыша алат."},{"t":"p","h":"Мындай система салыштырмалуу аз сандагы адамдар болгон учурда, маселен, тил табышуу же көпчүлүк добуш менен маселе талкуулап жана чечим кабыл алуу үчүн бир жайда чогула алган жергиликтүү уюмдарда колдонулушу мүмкүн."},{"t":"p","h":"Өзүнүн татаал жана көп сандуулугунан улам азыркы коомдун түз демократияны ишке ашырууга мүмкүнчүлүктөрү аз."},{"t":"p","h":"Өкүлчүлүктүү демократия бүгүн саясий чечимдерди, мыйзамдарды, коомдук жыргалчылыкты көздөгөн программаларды кабыл алуу максатында расмий өкүлдөр шайлоочу 50 миң калкы бар шаар үчүн да, 50 миллион калкы бар мамлекет үчүн да, демократиянын эң ылайыктуу формаларынын бири болуп калды. («Кыргыз Туусу»)"},{"t":"p","h":"60. Текстти окуп чыгып, андагы орус тилинен кабыл алынган сөздөргө талдоо жүргүзгүлө."},{"t":"h3","h":"ТАБИЯТТЫ КОРГОО"},{"t":"p","h":"Бул маселе ХХІ кылымдын башында дүйнөлүк проблемага айланып отурганын ар бир адам жүрөгү менен <span class=\"pg\" data-n=\"131\">131<\/span>туюп турат. Анткени адам тагдыры менен табият тагдыры бири-биринен ажырагыс. Кийинки учурда суу булганып, жер химикаттарга ууланып, эрозияларга учурап жаткандыгы көз алдыбызда болууда."},{"t":"p","h":"Чынын айтканда, кийинки учурда жашоо тиричилигибизде экология маданиятына жетише албай жатабыз. Келечек муундарыбызга жаратылышка болгон мамилесинин маданиятын көтөрмөйүнчө биз көп нерселерди жоготуп, жашообуз депрессияга учурашы мүмкүн."},{"t":"p","h":"Учурда илимий-техникалык прогресс кысымын көрсөтүп жаткан кез. Аны пайдалануунун техникасын так сактабасак көптөгөн кырсыкка учурашыбыз мүмкүн. Буга уу-химикаттарды арбын пайдалануудан улам өсүмдүктөр гана эмес канаттуулар, айрым майда жаныбарлар, атүгүл адамдар да зыян тартканына күбөбүз."},{"t":"p","h":"Жаратылышты коргоо барган сайын саясий, эл аралык мааниге ээ болуп баратат. Ошондуктан экология проблемасы бир эле элдин же өлкөнүн иши эмес, бир нече мамлекеттердин биргелешип иш алып баруусун талап кылат. Алсак, Арал деңизинин маселеси буга күбө. Ага жетүүчү дарыялар кийинки мезгилдерде айыл чарба өсүмдүктөрү үчүн көп пайдаланылып, деңизге куйбай калууда. Натыйжада, деңиз улам соолуп, кургак туз чаңдары айлананы каптап, табият жабырланып, жаратылыштык катастрофа күтүлүүдө. Аны болтурбоо үчүн табияттагы тең салмактуулукту сактоо зарыл. («Кыргыз Туусу»)"}],"sub":[{"title":"ДЕМОКРАТИЯ ДЕГЕН ЭМНЕ?","b":6},{"title":"ТАБИЯТТЫ КОРГОО","b":15}],"section":"КЫРГЫЗ ЛЕКСИКАСЫНЫН БАЮУ ЖОЛДОРУ","pages":[129,131]},{"title":"§ 32. АРАБ ТИЛИНЕН КАБЫЛ АЛЫНГАН СӨЗДӨР","blocks":[{"t":"h3","h":"§ 32. АРАБ ТИЛИНЕН КАБЫЛ АЛЫНГАН СӨЗДӨР"},{"t":"p","h":"Кыргыз тилинин лексикасында көптөгөн араб сөздөрү учурайт. Алардын басымдуу бөлүгү төл сөзүбүздөй болуп бекем сиңип кеткен. Анын себеби, биринчиден, араб тилинен алынган сөздөр мындан <span class=\"pg\" data-n=\"132\">132<\/span>бир нече кылымдар илгери болуп, арадан көп убакыт өткөндүгүндө болсо, экинчиден, ал сөздөрдүн көпчүлүгү тыбыштык өзгөрүүгө учурап, эне тилибиздин ички мыйзамдарына ылайыкташып кеткен."},{"t":"p","h":"Араб тилинен алынган сөздөр көбүнчө дин, илим, саясат д. у. с. түшүнүктөргө байланыштуу экендигин тилдик фактылар ырастап турат. Ушуларды эске алуу менен бирге араб тилинен кирген сөздөрдү төмөнкүдөй топторго бөлүп карасак болот."},{"t":"p","h":"1. Динге байланыштуу сөздөр: намаз, имам, молдо, орозо, айт, арбак, сопу, дуба, сооп, тозок, кайып, ажал, ажы, азезил, акыр заман, бата, зекет, битир, кыбыла, кыямат, арам, күнөө, тобо, шайтан, шарыкелме, даарат, кадыр түн, казат ж. у. с."},{"t":"p","h":"2. Илимге, сабаттуулукка, тарбия-таалимге байланыштуу сөздөр: алиппе, арип, кат, китеп, адабият, мектеп, мударис, илим, сабат, тарбия, кагаз, калем, насаат, нускоо, санжыра, аалым, каниет, акыйкат, адеп, куш кат, касиет, ызат, ибарат, зээндуц, канаат, сабыр д. у. с."},{"t":"p","h":"3. Коомдук-саясий түшүнүктөрдү билдирген сездер: мамлекет, мекеме, саясат, укук, жаза, жамаат, ка- ‚ зына, арыз, өкүм, өкүмөт, алака, медресе д. у. с. 4. Кесипти, кызматты билдирген сөздөр: касан, табып, мугалим, дүкөнчү, өкүл, аким, сыйкырчы д.у.с."},{"t":"p","h":"5. Ар түрдүү заттардын атын билдирүүчү сөздөр: имарат, мата, айбан, арак, пил, атыр, мунара, саат, алкым, дурбу, халва, нур, такыя, тумар д. у. с."},{"t":"p","h":"6. Абстракттуу түшүнүктөрдү атаган сөздөр: айла, акыбет, бакыт, балакет, зыйнат, махабат, убайым, нике, касиет, максат, кыял, карып, урмат, кайрат, куса, дөөлөт, тагдыр, ажайып, айран (таң калуу), насыя, санаа, каада, ниет ж. б."},{"t":"p","h":"Араб тилинен кабыл алынган сөздөрдүн көпчүлүгүн төл сөздөрдөн айырмалоо кыйын. Айрымдары гана келгин сөз катары байкалбаса, көпчүлүгү кыргыз тилинин табиятына ылайыкталып, өзгөрүп кеткендиктен, аларды келгин сөз деп бөлүп көрсөтүү кыйын. <span class=\"pg\" data-n=\"133\">133<\/span>Ал сөздөрдүн тыбыштык өзгөрүүгө учураганы этимологиялык жактан (сөздөрдүн келип чыгышын, өнүгүшүн) иликтегенде даана көрүнүп турат. Аларга байкоо жүргүзүү үчүн төмөнкү таблицага көңүл буралы."},{"t":"p","h":"Арабча Кыргызча Арабча Кыргызча аталышы ездештурулгену аталышы өздөштүрүлгөнү "},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>хаял<\/td><td>кыял<\/td><td>Хасил<\/td><td>асыл<\/td><\/tr><tr><td>хазиз<\/td><td>азиз<\/td><td> хушвакт<\/td><td>кушубак<\/td><\/tr><tr><td>хурмат<\/td><td>урмат<\/td><td>вакил<\/td><td>өкүл<\/td><\/tr><tr><td>галым<\/td><td>алым<\/td><td>мурад<\/td><td>мурат<\/td><\/tr><tr><td> тахлим<\/td><td>таалим<\/td><td>харам<\/td><td>арам<\/td><\/tr><tr><td>танина-<\/td><td>танапим<\/td><td>сиясат<\/td><td>саясат<\/td><\/tr><tr><td> фас<\/td><td>дунуйе<\/td><td> хат<\/td><td>кат<\/td><\/tr><tr><td>дүнүйа<\/td><td>дүкөн<\/td><td>хаки кат<\/td><td>акыйкат<\/td><\/tr><tr><td> дукан<\/td><td>убайым<\/td><td>соваб<\/td><td>сооп<\/td><\/tr><tr><td>хубайма<\/td><td>күнөө<\/td><td>эхтияр<\/td><td>ыктыяр<\/td><\/tr><tr><td> гунах<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"61. Аңгемени окуп чыгып, андагы араб тилинен кирген сөздөрдү көрсөткүлө."},{"t":"p","h":"Адатта адамдын башкаларга жасаган камкор мамилеси «оң көзүн салуу», «көз кырын салуу», ал эми кайдыгер, салкын мамилеси «бир көзүн аса, бир көзүн баса карады», жек көрүү сезими «көзүнүн төбөсү менен карады», «көрөйүн деген көзү жок, айтайын деген сөзү жок» деп сыпатталат."},{"t":"p","h":"Кыргыз элинин тарбиялоонун мааниси жөнүндөгү түшүнүктөрүн ар тараптуу аңдап билүүдө «кемелине келтирүү», «баралына келтирүү», «эрезеге жеткирүү» сыяктуу сөздөр да өзгөчө мааниге ээ."},{"t":"p","h":"К. К. Юдахиндин «Кыргызча-орусча сөздүгүндө» «барал» – эр жеткендик, толук жетилцү деп түшүндүрүлөт. Демек, «баралына келтирүү», «баралга жеткирүү» деген түшүнүктөр, төгөрөгү төп, жигит катары жетилдирүү деген маанини билдирип, көбүнчө, уул балдарды тарбиялоо, өстүрүү процессин мүнөздөйт."},{"t":"p","h":"<span class=\"pg\" data-n=\"134\">134<\/span>Ал эми «кемелине келтирүү» деген түшүнүк кызуландын кайрат, күч, рухий маданият, өнөр жагынан өнүгүп-өсүп калыптангандыгынын чен өлчөмү катары мүнөздөлөт."},{"t":"p","h":"Кыргыз фольклорундагы «санат», «насыят», «терме», «нуска», «үлгү», «үгүт» ырлары да генезиси элдин түшүнүгүндөгү колдонулуп келинген ар кандай семантикалык мааниси жагынан, элдик тарбия-таалим деген түшүнүккө тамырлаш. Алсак, «санат», «насыят айтуу», «үлгү», «өрнөк», «адеп көрсөтүү», «нуска сөз айтуу» сыяктуу түшүнүктөр жаштардын жандүйнөсүнө небактан калыптанган, аныкталган, такталган абийир-ар, адеп-ыймандуулуктун жол-жобо, эреже тартиптерди сиңирүүгө байланышкан улуулардын педагогикалык иш-аракетин туюнтат. Албетте, санат-насыят айтуу табиятынан даанышмандык нускасы бар, турмуштук тажрыйбасы мол карыялардын гана энчиси болгон. Ал бара-бара акындар чыгармачылыгын чырайына чыгарып, этикалык, дидактикалык жанр катары өркүндөп-өнүгүүгө ээ кылган. Демек, санат-насыят айтуу үлгү көрсөтүү, нуска болуу, мазмуну жагынан да, чөйрөсү жагынан да бир топ масштабдуу келет."},{"t":"p","h":"Кыргыз тилинде адамдын тарбиялангандыгын, маданий көрөңгөсүн мүнөздөп көрсөтүп турган терминдер да арбын. Түшүндүрмө сөздүктөрдө «каада», «салт» деген түшүнүктөр түгөйлөш катары чечмеленген. Ал эми «каадалуу» деген сөз адамдын ички тартибин, адебин, жүрүш-турушун сыпаттоо маанисинде колдонулат."},{"t":"p","h":"Элде кыз каадасы, уул каадасы, жигит каадасы, келин каадасы, байбиче каадасы, аксакал каадасы өз-өзүнчө жиктелип айтылат. Дегиңкиси «каадалуу» деген түшүнүк, ар ким өзүнүн жаш курагына, турмуштагы ордуна, вазийпасына ылайык адеп-тартипке, акыл-тажрыйбага, жүрүм-турум маданиятына ээ болуу зарылдыгын шарттайт. («Заман Кыргызстан»)"}],"sub":[],"section":"КЫРГЫЗ ЛЕКСИКАСЫНЫН БАЮУ ЖОЛДОРУ","pages":[132,134]},{"title":"§ 33. ИРАН-ФАРСЫ ТИЛИНЕН КАБЫЛ АЛЫНГАН СӨЗДӨР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"135\">135<\/span>§ 33. ИРАН-ФАРСЫ ТИЛИНЕН КАБЫЛ АЛЫНГАН СӨЗДӨР"},{"t":"p","h":"Кыргыздар ХІ кылымга чейин эле иран (фарсы) тилинде сүйлөгөн калктар менен аздыр-көптүр экономикалык байланышта болгон. Натыйжада ал тилден кыргыз тилине, дыйканчылыкка, багбанчылыкка, курулушка, соода-сатыкка, кол өнөрчүлүккө жана абстракттуу түшүнүктөргө байланыштуу сөздөр кабыл алынгандыгын жана алардын көпчүлүгү төл сөзүбүздөй болуп сиңип кеткендигин тилдик фактылар далилдеп турат."},{"t":"p","h":"Мисалы: душман, датка, кошомат, наристе, кодура, кемпай, денгене, бак, багбан, март, балит, бейтап, дидар, жекшемби, шаршемби, зергер, көчө. перзент, дос, осмо, сирке, тараза, устун, устат, чоро, шакирт ж. у. с."},{"t":"p","h":"Иран-фарсы тилинен кирген сөздөр төмөнкүдөй тематикалык топторго бөлүнөт:"},{"t":"p","h":"1. Багбанчылыкка байланыштуу сөздөр: мөмө, шабдалы, мейиз, анар, бак, дарак, тыт, шак ж. 6."},{"t":"p","h":"2. Жашылча жана тамак-ашка байланыштуу сөздөр: дарбыз, бадыраң, сабиз, шалгам, түрп, мурч, мастаба, палоо, сирке д. у. с."},{"t":"p","h":"З. Дыйканчылыкка байланыштуу сөздөр: пахта, кодура, куруч, зыгыр, чааракер, кырман ж. у. с."},{"t":"p","h":"4. Курулушка жана өнөргө байланышкан сөздөр: дубал, устун, сынч, терезе, шыйпаң, уста, шакирт, зергер, өнөр, шаар, айкел, шып, дарче ж. б."},{"t":"p","h":"5. Ар түрдүү буюмдарды, металлдарды туюндурган сөздөр: кулпу, дукарт, кетмен, дасторкон, шише, сымап, тукаба, килем д. у. с."},{"t":"p","h":"6. Соода-сатыкка байланыштуу сөздөр: соода, тараза, арзан, кардар ж. б."},{"t":"p","h":"Мындан башка да ар түрдүү түшүнүктү билдирген сөздөр бар. Аларга төмөнкүлөрдү кошсок болот: майдан, балбан, укук, чарба, мейман, наабай, кептер, жөжө, келбет, дарт, кучала, чилде, бечара, капа, чейрек, осмо, үлпөт, жоро ж. у. с."},{"t":"p","h":"<span class=\"pg\" data-n=\"136\">136<\/span>Кээ бир учурларда араб тилдеринен кабыл алынган сөздөрдү иран-фарсы тилдеринен ажырата билүү биз үчүн кыйын. Анткени, биринчиден, иран, араб тилдериндеги көп сөздөр эки тилде тең учурайт жана бирдей мааниде колдонулат. Буларга айрыкча диний, тарбия-таалим, илим-билим, маданият тармактарына тиешелүү сөздөрдү кошууга болот."},{"t":"p","h":"Мисалы: парасат (аң-сезим), айкел (таштан жасалган адам келбети), кагаз, дептер, алиппе (алифбэ), устаз (устат), дүнүйө, кубат, сапар, кодура (эгилбестен өзү чыккан дан) ж. у. с."},{"t":"p","h":"Иран-фарсы тилинен кирген сөздөр да араб тилинен кабыл алынган сөздөрдөй кыргыз тилинин ички мыйзамдарына баш ийдирилип, тыбыштык өзгөрүүлөргө учураган. Алсак: хафта -апта, чахаррэк чейрек, шафтолу шабдалы, шогирд шакирт, гува кубе, гуман кумен, устад устат, сафар сапар, умид умут, инсоб нысап, шоир шайыр, худра кодура, хушомад кошомат, капил кепил, гориб карып (элинен ажырап, алдан күчтөн тайып, жардамга муктаж болгон абалдагы адам), хаким аким, фалакэт балакет, афэнде апенди ж. у. с."},{"t":"p","h":"62. Төмөндө берилген текстти окуп чыгып, андагы иран-фарсы тилинен кирген сөздөрдү бөлүп бергиле. Бул көнүгүүнү аткарууда сөздүктөрдү пайдалангыла."},{"t":"h3","h":"УМАЙ ЭНЕНИН КОЛУ"},{"t":"p","h":"Жер шарында жашаган калктардын көпчүлүгүндө энелерди жана жаш балдарды коргогон, дайыма руханий жактан колдоого алып турган аял кудайлары, пайгамбарлары, легендарлуу ыйык энелери болгон. Маселен, египеттиктерде «Исида», вавилондуктарда «Иштар», финикиялыктарда «Астарда», байыркы Индиянын жергиликтүү калктарында «Аи» ыйык энелердин ролун аткарган. Ал эми Борбордук Азияда, Түштүк Сибирде жана Саян-Алтай аймактарында <span class=\"pg\" data-n=\"137\">137<\/span>жашаган байыркы түрк калктарында бул сыяктуу касиеттүү эне «Умай» (Умай эне) деп аталган."},{"t":"p","h":"Эгерде биз этнографиялык материалдарга көз чаптырсак, анда «Умай эне» жөнүндөгү түшүнүктөр жана аны менен байланыштуу аткарылган ырым-жырымдар байыркы кыргыздардын үй-бүлө турмушунда кенен орун алгандыгын көрөбүз. Маселен, жаңы төрөлгөн баланын куймулчагындагы тубаса көк такты кыргыздар «Умай энеси уруп кетиптир» дешип кубанышып, жакшылыкка жорушкан. Жаш баласынын бетин эртең менен жууп жатканд

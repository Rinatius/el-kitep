а айрым энелердин: «Мурунку убакта балдар түнүчүндө уктап жатканда Умай энеси келип жууп койчу эле»,— деген сөздөрүнөн касиеттүү эненин балдар жөнүндөгү камкордугун байкоого болот. Умай эненин жардамына, айрыкча, боюнда бар аялдар, төрөт мезгилинде, балдарды оорудан жана башка ар кандай кырсыктардан сактап калуу үчүн өткөргөн ырым-жырымдарында кайрылышкан. Балдарды бир жакка жөнөткөндө энелери: «Умай энеңе тапшырдым» деп сөзүн аяктаган."},{"t":"p","h":"Умай эне жөнүндөгү түшүнүктүн өзүнчө тарыхы бар. Этнографиялык материалдарга караганда Умай эне жөнүндөгү уламыштар, ырым-жырымдар жана ал жөнүндөгү терминдер биздин замандын алгачкы этаптарында эле түрк тилинде сүйлөгөн Батыш Сибирь калктарында орун алгандыгын көрөбүз. УТ – УШ кылымдарга таандык болгон байыркы турк руникалык жазууларынан да Умай эненин ысмы аталгандыгын көрүүгө болот. Маселен, таш жазуусунан мындай сүйлөмдү жолуктурабыз: «Түрк эли жок болбосун деп Каган атамды, Умай энемди Теңир колдоду, Теңир өзүмдү хандыкка отургузду». («Заман Кыргызстан»)"}],"sub":[{"title":"УМАЙ ЭНЕНИН КОЛУ","b":15}],"section":"КЫРГЫЗ ЛЕКСИКАСЫНЫН БАЮУ ЖОЛДОРУ","pages":[135,137]},{"title":"§ 34. МОНГОЛ ТИЛИНЕН КАБЫЛ АЛЫНГАН СӨЗДӨР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"138\">138<\/span>§ 34. МОНГОЛ ТИЛИНЕН КАБЫЛ АЛЫНГАН СӨЗДӨР"},{"t":"p","h":"Кыргыз тилинин лексикасында монгол тилинен кабыл алынган сөздөр да арбын учурайт. Бул кыргыз эли менен монголдордун өткөн турмушундагы тарыхый байланыштын болгондугунан кабар берет. Ал сөздөрдү иликтей келгенде алардын архаизмге айланып, азыраак колдонулгандары да, азыркы учурда эки тилде тең бирдей мааниде активдүү колдонулгандары да бар. Ырас, алардын да аздыр-көптүр тыбыштык өзгөрүүлөргө учурагандыгына күбө болобуз. кыргызча:"},{"t":"v","l":["мөндүр","бүркүт","алтын","далы","жыргал","босого","буурул","арбын","бороон","даркан","нөкөр","абысын","кунажын","токулга","бото","инек","субай","аргымак","монголчо:","мөндөр","бүргөд","алтын","дал","жаргал","босого","буурал","арвин","борогон","дархан","нохор","авсан","гунжин","тохылга","ботго","үнэк","сувай","аргамаг"]},{"t":"p","h":"Кыргыз тили менен монгол тилиндеги сөздөрдүн тыбыштык түзүлүшү, айтылышы, лексикалык мааниси бирдей болгон сөздөр биздин сөздүк корубузда арбын учурайт. Аларды монгол тилинен кыргыз тилине же, тескерисинче, кыргыз тилинен монгол тилине кабыл алынган деп кесе айтуу кыйын. Анткени тилдердин өнүгүү тарыхынын байыркы учурунда <span class=\"pg\" data-n=\"139\">139<\/span>алар алтай тилдеринин тобуна кирген, түбү бир экендиги тууралуу илимий иликтөөчүлөрдүн жыйынтыктары бар. Ага караганда айрым сөздөрдүн эки тилде бирдей мааниде, бирдей тыбыштык түзүлүштө учурагандыгы мыйзамченемдүү. Бирок ошондой болсо да, орто кылымда монгол тилинен кыргыз тилине көптөгөн сөздөрдүн өткөндүгү окумуштуулар тарабынан ырасталган."},{"t":"p","h":"М и сал ы: төркүн, абысын, кары (колдун жогорку бөлүгү), буура, субай, дөнөн, аргымак нокто, токум, көгөн (козу байлачу), ирик, шири, тулуп, жейрен, бөкөн, деңиз, тозоң (чаң), алтын, жебе, чирке, нарында (майдалап этти тууроо), нөкөр (жолдош жигит, аскер маанисинде), көлүк (ат-көлүк аманбы?), чулу (бекем, нык, масса), тул (жесир), көмөлдүрүк ж. у. с."},{"t":"p","h":"63. Теменку суйлем топтомдорундагы кара тамга менен жазылган сездердун кайсы тилден киргендигин же кыргыз тилинен башка дагы кайсы тилдерде учурарын сөздүктөрдү пайдалануу менен аныктап бергиле. (Пайдаланууга төмөнкү сөздүктөр сунуш кылынат: 1. Х. Карасаев. Өздөштүрүлгөн сөздөр; 2. К. К. Юдахин. Кыргызча-орусча сөздүк; 8. К. Сейдакматов. Кыргыз тилинин кыскача этимологиялык сөздүгү; 4. В. Мусаева, Э. Ташбалтаева. Кыргызча-орусча, орусча-кыргызча сездук)."},{"t":"p","h":"1. Бул аймакта Кара-Кужур жайлоосу бар. 2. Жылкычылар даван ашып, Кекемерен суусуна жетип, жайыт алышты. 3. Малчылар бул жайлоого келгени сабаа толтура кымыз жасашып, белен тамактарын ортого салышып, ынтымакчылыктын ырахатына батышты. 4. Жегендери куурдак, эжигей, айланасы көйкөлгөн сонун шибер. 5. Мөңгүдөн башталган сууларга, тунук арашандар Чоң-Корумду ылдый сыгылып келип, Караколго кошулат. 6. Шибер үстүнө салынган таар, кийизге көлдөлөң салынып, анда отурган ак сакал киши өз жакындарына керээзин айтып отурду."},{"t":"p","h":"7. Аркы четтеги чоң кемегеде боркулдап кайнаган этти карашып эки бажа өздөрүнчө кепке түшүшкөн."},{"t":"p","h":"8. Алардын бирөө суукка байымы жок өңдөнөт, колунда <span class=\"pg\" data-n=\"140\">140<\/span>мээлей, башында малакай. 9. Аркы булуңдан чоң мүйүздүү серке баштаган бир короо кой жайыттан кайтып келатты. 10. Боз үйдүн эскилиги жеткен каалгасы шамалга улам ачыла берди эле, ага бакан тиреп, бекем жаап коюп, ээси топтошкон кишилерди көздөй басып келди. 11 Ортодо отурган тегерек сакал мергенчи кечээги аңга барганын айтып, олжолуу кайтканына мактанып жатты. 12. Аргымактын жакшысы азыраак оттоп, көп жуушайт, Азаматтын жакшысы, азыраак сүйлөп көп тыңшайт."}],"sub":[],"section":"КЫРГЫЗ ЛЕКСИКАСЫНЫН БАЮУ ЖОЛДОРУ","pages":[138,140]},{"title":"Кыргыз лексикасынын баюу жолдору боюнча талдоолор","blocks":[{"t":"v","l":["Кыргыз лексикасынын баюу жолдору","боюнча талдоолор"]},{"t":"p","h":"Сүйлөмдөгү сөздөрдүн башка тилдерден киргендигин жана алар кандай жол менен кабыл алынгандыгын же эне тилибиздеги айрым сөздөрдүн маанилик жылыштарга кандайча ыкмалар аркылуу ишке ашкандыгын тактап-талдоо – лексиканын баюу жолдору боюнча талдоого кирет."},{"t":"p","h":"М и с а л ы: 1. Атаны урматтасаң, баладан сый көрөсүң. (Мак.) 2. Дасторконго көз чаптырсам анар, жүзүм, шабдалы, тандырга жабылган патир нан, болпойгон боорсоктор, берки четинде койкойгон бөтөлкө, тизилген стакандар туруптур. (К. Сактанов) 3. Алкынган аттын кемелдуругу кумуш бастырылган токулгасына жарашып турду. (Т. Касымбеков) 4. Анын поэзиялык чыгармалары патриотизмге жык толгон. (О. Сооронов) 5. Борбордук шайлоо комиссиясында бир жазуучу мүчө болуп катталыптыр."},{"t":"p","h":"Биринчи сүйлөмдүн курамындагы «урмат» деген сөз араб тилинен кирген. Ал сөз эне тилибизге тыбыштык өзгөрүүгө учуроо менен кабыл алынып, азыркы учурда төл сөздөрдөй активдүү колдонулат."},{"t":"p","h":"Экинчи сүйлөмдө дасторкон, анар, жүзүм, шабдалы, тандыр, патир нан деген сөздөр иран-фарсы <span class=\"pg\" data-n=\"141\">141<\/span>тилдеринен, ал эми бөтөлкө, ыстыкан деген сөздөр орус тилинен кабыл алынган. Албетте, буларда эне тилибиздин ички мыйзамына ылайыкташкан тыбыштык өзгөрүүлөр бар. Алсак, дастурхан – дасторкон, шафтолу – шабдалы, бутылка – бөтөлкө, стакан – ыстакан болуп өзгөргөн."},{"t":"p","h":"Үчүнчү сүйлөмдөгү көмөлдүрүк, токулга деген ат жабдыктары монгол тилинен кабыл алынган. Ал эми төртүнчү сүйлөмдөгү поэзия, патриот деген сөздөр кыргыз тилинин лексикасына орус тили аркылуу башка тилдерден тыбыштык өзгөрүүсүз кабыл алынган. Акыркы сүйлөмдөгү борбордук, жазуучу, мүчө деген сөздөр эне тилибиздин ички булактарынан аффиксация (морфологиялык) жолу менен – жазуучу-жазуучу болуп жаңы маанидеги сөз жасалса, борбор, мүчө деген сөздөрдүн маанилери кеңейип, жаңы түшүнүктү берип турат."},{"t":"p","h":"Эскертуу: Кыргыз лексикасынын баюу жолдору боюнча талдоо, сөздөргө толугу менен талдоо жүргүзүлбөстөн, анын бир гана багытын, т. а., ал сөздөрдүн кайдан келгендигин же кандай жолдор менен жаңы мааниге ээ болгондугуна гана көңүл бурулат. Ал эми лексикалык талдоодо ар бир сөздүн төл сөз же келгин сөз экендиги, алардын тике же өтмө мааниге ээлиги, синоним, антонимдик катарлары, жаңы же эскирген сөз экендиги, курамы ж. у. с. жактары эске алынат."},{"t":"p","h":"64. Аңгемени окуп чыгып, андагы башка тилден кабыл алынган сөздөргө кыргыз лексикасынын баюу жолдору боюнча жогору жакта көрсөтүлгөн үлгүнүн негизинде талдоо жүргүзгүлө."},{"t":"h3","h":"КЕКЧИЛ БУУРА"},{"t":"p","h":"Минген аттарыбыз чарчап-чаалыгып, куюшкан, көмөлдүрүктөрдүн алды ак көбүккө балкылдап, улам барган сайын жолубуз оор тартып баратты."},{"t":"p","h":"<span class=\"pg\" data-n=\"142\">142<\/span>– Бастыр досум, камчылан! – Сансызбай мага тыңсына карап, минген тору атынын соорусуна камчы чапты."},{"t":"p","h":"Сөздүн күүсүнө термелип, оттоп жүргөн төөлөрдүн жанына барып калганбыз. Чуудалары үзүлгөн кийиздей салаңдаган чоң буура бурк-бурк этип, оозунан ак көбүгүн бүркөт. Бууранын алдыңкы өркөчү быржык-быржык тырык."},{"t":"p","h":"– Буураныздын алдыңкы өркөчү эмне болгон? – Айбет аксакалдан сурадым."},{"t":"p","h":"– Ээ, чырагым, анын өзүнчө кызыгы бар. Тынчы кетип, туйлап турган тайлак чагында тиги Байбеттин кара кашка айгырына чайнатып койгон."},{"t":"v","l":["– Кандайча?","Айбет кебин улады."]},{"t":"p","h":"– Тайлак кезинде оюнкарап Байбеттин кулундар байланган желесине барып калыптыр. Бала да, ар бир кулунду жыттагылап, ойноп жүрсө ары жактан үйүрдүн кара кашка айгыры кулундарын кызганып, кубалайт. Тайлак кетпейт. Айгырдын ачуусу келет. Тайлактын алдыңкы өркөчүн чайнап таштайт. Байкуш өлүп, кайра тирилет."},{"t":"p","h":"Өткөн жылы бирөө атайылап жибергендей баягы кара кашка айгырдын кулундары желеленген жерге барып, четки кулундардын бирөөн чайнап кирет. Жылкычы байкап калып, кууса да кетпейт. Бир кезде кара кашка айгыр, оттоп жүргөн бээлердин арасынан суурулуп чыгып, буураны көздөй жөнөйт. Мойнун аркандай созуп, кош кулагын жапырып, чабуулга өтөт. Буура да ачуу айкырып башын жерге катуу бир коюп (бууралар киргенде же бирөөгө кол саларда баштарын катуу нерсеге коймоюн жиндене бербейт) айгырды карай атырылат."},{"t":"p","h":"– Бууранын кирген учуру беле?"},{"t":"p","h":"– Жок, кек го! Анткени тайлак кезинде чайнатып койгон да, ошону унутпаса керек! Айгыр менен буура кармашат деп укканбыз. Бирок көргөн эмеспиз. Малчылар чогула түштүк. Айгыр түз эле качырып кирип, мойнун созгон бойдон бир орундан жылбаган буурага тие албай кайкып кетти. Айгыр кайкып кеткенде буура башын <span class=\"pg\" data-n=\"143\">143<\/span>жанында жаткан үйдөй ташка бир коюп алып, айгырды кууп жетип, соорусунан серпти. Айгыр ачуулуу кишенеп, тикесинен тике тура калып, алдыңкы албууттуу колдору менен буураны моюнга чапты."},{"t":"p","h":"Кармаш күчөдү. Айгыр карылык кылдыбы, аздан соң чарчап калгандай көрүндү. Буура ансайын күчүнө кирип, оозунан көбүгүн чачат. Айгырдын шайын оодарат. «Ой, Айбет, айгырыңды ажырат. Буура чайнап коймок болду»,— деди айгырга жаны ачыган бирөө."},{"t":"p","h":"Экее тирешип, апчышып турганда алардын жанына жакын барууга болбойт. Ачуусу келген кектүү буура адамды майып кылып коюудан баш тартпайт. Карап турган малчылардын баары чогуу аттарыбызга миндик. Тигилерге жакындабай, алыстан-алыстан айбат бердик."},{"t":"p","h":"Экөөнүн тең оозунан кан шорголоп агып жүрөт. Кара кашка айгырдын ээси ооп бараткан экен. Буура тың. Өкүмдөнөт. Жулунат. Урунат. Көпчүлүктөн айбыгып, турган ордунда калчылдайт. Көрсө, бууранын кара кашка айгырдын үйүрүнүн желесине барганы, кулундарын чайнап киргени, айгырдан өч алганы тура. Бирөөгө өчөшүп калса төөнүн ачуусу тарабайт экен. («Асаба»)"},{"t":"p","h":"Суроолор жана тапшырмалар:"},{"t":"p","h":"1. Кыргыз тилинин лексикасынын байышынын ички булактарына кайсылар кирет? Эмне үчүн аларды ички булактар деп айтабыз?"},{"t":"p","h":"2. Морфологиялык (аффиксациялык) жол менен жаңы маанидеги сөздөрдү жасоодо кандай мүчөлөр активдүү роль ойнойт?"},{"t":"p","h":"з. Синтаксистик жол менен жасалган жаңы маанидеги сөздөрдүн жана семантикалык ыкма менен пайда болгон сөздөрдүн айырмачылыгы эмнеде?"},{"t":"p","h":"4. Сөзмө-сөз которуу жолу (калькалоо) аркылуу пайда болгон сөздөрдүн кандай түрлөрү (же жолдору) бар. Эмне үчүн аларды «толук» жана «толук эмес» деп бөлүштүрөбүз?"},{"t":"p","h":"5. Орус тилинен кабыл алынган сөздөрдү кандай доорлорго бөлүштүрөбүз, алардын негизги айырмачылыгы эмнеде?"},{"t":"p","h":"6. Араб, иран-фарсы тилинен кабыл алынган сөздөрдүн лексикабыздагы орду кандай, алар тыбыштык өзгөрүүлөргө учураганбы?"},{"t":"p","h":"<span class=\"pg\" data-n=\"144\">144<\/span>Суроолорго жооп берүү учурунда төмөнкү тексттен пайдалангыла."},{"t":"h3","h":"ДҮЙНӨНҮ СУЛУУЛУК ГАНА САКТАП КАЛАТ"},{"t":"p","h":"Өткөн доордун улуу даанышмандары адамдын жаратылышты ойлонбостон эле «багындырышынын» кесепеттерин алдын-ала көрө билишкен. Алар адамзат тукуму өсүмдүктөр менен жаныбарлар дүйнөсүн жок кылып, жерди, сууну, абаны булгап, өзүн өзү кырышы мүмкүн экендигин алдын-ала эскертишкен. Бирок ошондой көрө билүүнүн далилин сенектик мезгилде жокко чыгарып, адам баласы бардыгын жеңүүгө тийиш деген бүтүм менен жашап келгенбиз. Мына эми XX кылымдын аягында адамдын, коомдун, жаратылыштын ортосундагы мамилелерде биз эң кейиштүү көрүнүшкө дуушар болуп, өзүбүздүн шайкеш жашообуздагы, айлана-чөйрөдөгү байлыктарга сарамжалсыздык менен мамиле жасап келгендигибизди эми моюнга алып, эртеңки күндүн, эгер ушинтип бара берсек жашоого мүмкүн болбой калуучу жердин бейне-тагдырын ойлочу болдук. Ойлогон менен адамда эң биринчи кезекте экологиялык билим, маданият, эстетикалык табит болуш керек эле."},{"t":"p","h":"Өткөн кылымдардын биринде жашаган жапан каганы жөнүндө мындай кеп айтылып калыптыр. Анын сейил курчу багында адамдын көз жоосун алган жыпар жыттуу гүлдөрү жайы-кышы гүлдөп, көргөн адамды суктандырып турчу экен. Сулуулук менен өмүр жашарткан даанышман өкүмдар букараларын дайым ушу гүлзар багында кабыл алып, алардын жашоого болгон кумарлануусун арттырып, кушубак черлерин жазып жөнөткөнүнө эли ыраазы болгон."},{"t":"p","h":"Күндөрдүн биринде Жапанияда теңдеши жок бакчы жөнүндө укмуштуудай куш кабарды угуп, ага эртеси эле бармакчы болот. Кагандын келерин дароо эле бакчыга жеткиришет. Ошондо бакчы ойлонуп отурбастан, ар түрдүү гүлдөрдөн бирден коюп, калганын <span class=\"pg\" data-n=\"145\">145<\/span>бүтүндөй үзүп салыптыр. Эртеси каган гүлзарларды аралап баратып, бир гүлдүн тушуна келгенде эстен тана түшөт. Ордо кызматчылары күтүлбөгөн мындай коркунучтан чочулап, өкүмдарды алып кеткенге ашыгышат. Бакчынын атайылап кылганы деп түшүнүшөт. Жүрөгүндө сулуулуктун кудайы жашаган адамды ким уксун, ким түшүнсүн. «Сен атайлап, каганды үзүлгөн гүлдөрдү көрсөтүп жүрөгүн жарып өлтүргүң келген»,— деп аны зынданга салышат."},{"t":"p","h":"Каган эсине келгенде, кызматчылары: «Улуу урматтуум, аны өлүм жазасы күтүп турат. Сиздин буйругуңуз гана керек»,— дешет."},{"t":"p","h":"«Оо, сезими жок кургурларым, анын жүрөгү жараткан сулуулук мени эстен тандырды. Кандай гана керемет дүйнө! Шундай адамдардын катары көп болсо гана. Аттиң, силер уялбай сулуулуктун кудайын зынданга салдыңарбы?» – деп ачууланыптыр."},{"t":"p","h":"Бакчыга суктанган өкүмдар өзүнүн гүлзар багынан орун берип, өмүрү өткөнчө керемет дүйнөнү бакчынын көзү менен кароого, жүрөгү менен сүйүүгө үйрөнүп жүрүп өткөн экен. Бул өткөндүн жаңырыгы."},{"t":"p","h":"А кээ бирөөлөр ушу таптагы төгөрөгү төп келишкен кылымда бул жарыктыкка келип кетүүбүздүн төркүнү эмнеде экендигин да билбей калды окшойт. Келип-кетип, бул кылымдын адамдары саясаттын ашкере басмырттоосуна тумчугуп, буйрукчул-тескөөчүл мамиленин күч алуусу баш көтөртпөй, жапырт маданияттын илдеттүү туткуну бийлеп, рухий асылдуулуктан кол жууп кала жаздаганбыз. Ушуну өсүп келе жаткан жаш муундардын аң-сезимине жеткирип, аларды өз ата конушун, кыргыз жерин, кыргыз элин сүйүүгө тарбиялоону күчөтүүбүз керек. Ала-Тоонун жаратылышын коргошубуз абзел."},{"t":"p","h":"Экологиялык тынчсыздануу ар бирибиздин жүрөгүбүздө жатып, чөйрөгө болгон көз карашыбызды өзгөртүп баратканы – бул биздин сулуулукту туя билүүбүз, түшүнүүбүз, Достоевскийдин «дүйнөнү сулуулук гана сактап калат» деген акылман сөзүнө таң берүүбүз деп түшүнсөк болот. («Кут билим»)"}],"sub":[{"title":"КЕКЧИЛ БУУРА","b":8},{"title":"ДҮЙНӨНҮ СУЛУУЛУК ГАНА САКТАП КАЛАТ","b":36}],"section":"КЫРГЫЗ ЛЕКСИКАСЫНЫН БАЮУ ЖОЛДОРУ","pages":[141,145]},{"title":"§ 35. КЕП МАДАНИЯТЫ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"146\">146<\/span>§ 35. КЕП МАДАНИЯТЫ"},{"t":"p","h":"Кыргыз тилинин лексикасынын башында ички булактар аркылуу пайда болгон жана чет тилдерден кабыл алынган сөздөрдүн бир тобу терминдик (атоо) мүнөзгө ээ."},{"t":"p","h":"М и сал ы: поэзия, роман (адабияттык термин), лексикология, уңгу, мүчө, ээ, архаизм (тил илиминдеги терминдер), өнөр жайы, кооператив, салык инспекциясы, кредит, товар айлантуу, брокер, жумушчу, бизнесмен, кампачы, материалдык байлык, экспорт, акча реформасы, дүң баа, экономикалык саясат, баалуу кагаздар, тейлөө чөйрөсү (экономикалык терминдер), кандын резусу, симптом, кан басымы, хирургия, дарыгер (медициналык терминдер) д. у. с."},{"t":"p","h":"65. Текстти окугула. Андагы кабыл алынган жана кыргыз тилинин ички булактарынан жасалган сездерду тапкыла. Алардын терминдик мунезге ээ же ээ эместигин аныктагыла. Кептин стили боюнча да байкоо жүргүзүп, бул текст кептин кайсы стилине жакындыгын аныктагыла."},{"t":"p","h":"Борбордук Азиядагы елкелердун жерлери аридалык зонадан орун алгандыктан жаан-чачындын басымдуу белугу бууланып кетууге дуушар болот. Анткени бул аймактар чел жана жарым челдерден турат, ошондуктан айыл чарба жумуштарын сугаруусуз аткаруу мумкун эмес. Региондун эн башкы суу булактары – тоолордогу мөңгүлөр жана карлар. Кыргыз Республикасындагы суулардын болжол менен 89% айыл чарбасына жана сугат жерлерге пайдаланылат. Борбордук Азияда жер 1936-жылга чейин жеке менчикке таандык болгон. Жер ээлери анча чоң эмес жерлерин түшүмдү көп берүүчү жер кыртышын туура колдонууга умтулушкан, ошондой эле сууну жана жер ресурстарын пайдаланууда эң катуу чектер коюлган. Ушундай талаптардан улам өзгөчө түшүмдүү жерлер түзүлгөн, ал жерлер өзүнүн түшүмдүүлүгү менен айырмалангандыктан региондогу жер ресурстарынын алтын фондусу <span class=\"pg\" data-n=\"147\">147<\/span>деген наам алган. Кийинки жылдардагы коллективдүү айыл чарбасынын түзүлүшү суулуу аянттардын көбөйүшүнө алып келди. Айыл чарбасында жаңы технологияны пайдалануу узун тиштүү соколордун жерди тилип кеткен жөөктөрү, суунун тереңде фильтрленишине жана өндүрүмсүз жок болушуна негиз түзөт, суулуу жерлерди өз мезгилинде сугаруу өлчөмүн 40- 50%га жогорулатат. Суулуу аянттарды сугаруу үчүн өз кезегинде дренаждык системаларды курууда көптөгөн каражаттар талап кылынган. Акыркы жылдардын алкагында теория менен практика даана көрсөткөндөй аридалык аймактарда жер интенсивдүү сугаруунун таасиринен, дренаждык системасы эффективдүү иштегенде да жер кыртышынан гумус, кальций, магний жана башка өтө пайдалуу заттар «жуулуп» жок болуп, жер кыртышынын табигый курамынын бузулушуна алып келет, биохимиялык кычкылтек аркылуу өзүн өзү калыбына келтирүү, сактоо, толуктоо режимдери начарлайт. Анын үстүнө жер кыртышына пайдаланган жасалма минералдык жер семирткичтердин 30-40% ы суунун агымы менен ысырапка учурайт, бул процесс геохимиялык агымынын күчөшүнө алып келет, анын натыйжасында пайдасыз жана зыян туздар менен бирге пайдалуу заттар, туздар жер кыртышынын астынан «жуулуп» сыртка чыгып, бардыгы аралашып, жердин сапаты өтө төмөндөйт, дарыялардын, төмөнкү агымдагы суунун сапаты кескин түрдө бузулат."},{"t":"p","h":"Жыйынтыгында, жерди традициялык технологиянын негизинде рационалдуу эмес пайдалануу жердин 60% ынын туздуу болушуна жана региондун экологиясын кризистик абалга алып келди. Сууну сугат жер аянттарында ченемсиз пайдалануунун натыйжасынан Арал бассейнине тиешелүү дарыялардын суу агымын көзөмөлдөө зарылчылыгы пайда болду."},{"t":"p","h":"1960-жылдарда дарыялардан алынган суу 40,4 куб. км чейин жогорулаган, бирок Арал деңизине эч кандай таасирин тийгизген эмес. А бирок бул чектен жогорулоо Аралдын жоголушуна алып келди. 1960-жылдан <span class=\"pg\" data-n=\"148\">148<\/span>баштап азыркы учурга чейин сугатка алынган суулардын өлчөмү көбөйүп (суулуу жердин аянты 2 миллион гектарга көбөйтүлгөн) жалпысынан 86 чарчы км түзгөн. Анын натыйжасында Арал деңизи 14 метрге төмөндөгөн, көптөгөн дарыялар жана булактар соолуп жоголгон. Дельталары «суусап», суунун туздуулугу жогорулаган, табигый өсүмдүктөр кыйроого учурап, экосистеманын түшүмдүүлүгү деградацияланган. Арал деңизи кургап шоролонгон, асты ачылган соң, катуу шамал ошол заттарды айлана-чөйрөгө чачып, региондун экологиясына кошумча терс таасирин тийгизе баштады. («Мурас»)"},{"t":"p","h":"66. «Кыргызча-орусча сөздүктөн жана Х. Карасаев түзгөн «Өздөштүрүлгөн сөздөр» деген сөздүктү пайдаланып, башка тилдерден кабыл алынган, тарбия-таалим багытындагы 10-15, абстракттуу түшүнүктөрдү билдирген 8-10 сөз терип алып, аларга талдоо жүргүзгүлө. Алардын төл сөздө синонимдери болсо аны көрсөткүлө жана турмуштун кайсы тармагына байланыштуу киргендигин айтып бергиле."},{"t":"p","h":"Предмет аралык байланыш"},{"t":"p","h":"География окуу китеби боюнча В. П. Максаковский тарабынан жазылып, кыргыз тилине которулган «Дүйнөнүн экономикалык жана социалдык географиясы» деген китептеги «Коомдун жана табияттын өз ара кыймылын үйрөнөбүз» деген бөлүмүн окуп чыккыла. Андагы табиятка, анын байлыгына, аны иштетүүнүн технологиясына жана ага карата коомдун мүчөлөрүнүн мамилесине, иштеген иштерине байланыштуу колдонулган терминдерди, баш- ка тилдерден кирген жана эне тилибиздин ички бу- лактарынан ар турдуу ыкма менен жаны мааниге ээ болгон сездерду белуп керсетуп, аларга талдоо жургузгуле. Ушул мунездегу талдоолорду жүргүзүүдө «Кишинин анатомиясы...» окуу китебиндеги «Алкоголь – организм учун уу» деген теманын жана кыргыз тарыхы боюнча окуу китептерди окуп, андагы <span class=\"pg\" data-n=\"149\">149<\/span>сөздөрдүн өтүлүп жаткан темага байланыштуу жактарына көңүл буруу зарыл."},{"t":"p","h":"67. Текстти окуп, андагы орус тили жана ал аркылуу кирген сөздөрдү бөлүп, талдоого алгыла."},{"t":"h3","h":"Д. И. МЕНДЕЛЕЕВДИН ӨМҮР БАЯНЫ ЖАНА ЭМГЕКТЕРИ"},{"t":"p","h":"Дмитрий Иванович Менделеев – дүйнөнүн эң улуу окумуштууларынын бири. 27-январда (8-февралда) 1834-ж. Тобольск шаарында жергиликтүү гимназиянын деректиринин үй-бүлөсүндө туулган. Тобольск гимназиясын бүткөндөн кийин Д. И. Менделеев Петербург педагогикалык институтуна келип түшөт, аны 1857-ж. алтын медаль менен бүтөт."},{"t":"p","h":"1859-ж. магистрдик диссертацияны жактап, Д. И. Менделеев чет мамлекетке эки жылдык илимий командировкага барган."},{"t":"p","h":"Чет мамлекеттен кайтып келгенден кийин адегенде Петербург технологиялык институттун, андан кийин университеттин профессору болуп шайланган, ошондо ал 23 жыл бою илимий жана педагогикалык ишти жүргүзүп келген. 90-жылдардагы студенттик нааразылык билдирген толкундоолордо ал студенттерди жактап сөз сүйлөгөндүгү үчүн университеттен кетүүгө мажбур болгон. Өзүнүн өмүрүнүн акыркы жылдарында Д. И. Менделеев Өлчөм жана салмактар Башкы палатасында иштеген."},{"t":"p","h":"Д. И. Менделеевдин чыгармачылык иштеринин эң чоң ийгиликтери элементтердин мезгилдик законунун ачышы жана элементтердин мезгилдик системасын түзүшү болгон. Анын «Спирттин суу менен болгон бирикмеси жана эритмелерди ассоциациялар катары түшүнүү жөнүндөгү» доктордук диссертациясы чоң атакка ээ болду. Д. И. Менделеев иштеп чыккан эритмелердин гидраттык теориясы илим үчүн биздин убагыбызда да мааниси бар."},{"t":"p","h":"<span class=\"pg\" data-n=\"150\">150<\/span>Д. И. Менделеевдин өтө көрүнүктүү эмгеги болуп, анын «Химиянын негиздери» деген китеби саналат. Бул китепке органикалык эмес химиянын баары биринчи жолу мезгилдик закондун негизинде баяндалган болучу."},{"t":"p","h":"Теорияны практика менен тыгыз байланыштырып, Д. И. Менделеев нефтинин технологиясына көп көңүл бурган. Ал нефтини өндүрүүнү бардык күчтү жумшап көбөйтүүнү жана анын химиялык иштелишин өркүндөтүүнү сунуш кылган. Уралдын темир кен өнөр жайына маани берип, Д. И. Менделеев Кузнецк бассейнинин таш көмүрүн пайдаланууну сунуш кылган. Ал өзүнүн Атамекенинин патриоту катары металлургиянын жана Ата Мекендик өнөр жайдын көптөгөн башка тармактарынын өнүгүшү үчүн бир катар баалуу сунуштарды киргизген."},{"t":"p","h":"Д. И. Менделеевдин илимий иштери өтө көп кырдуу болгон. Так өлчөөлөрдүн техникасын иштеп чыгууда, абада учуу теориясында, физикада жана химиялык технологияда анын сиңирген эмгек салымдары зор. Ата Мекендин байлыктарын бардык жактан жана акылдуулук менен пайдалануу жөнүндө анын айткандары өтө баалуу болгон."}],"sub":[{"title":"Д. И. МЕНДЕЛЕЕВДИН ӨМҮР БАЯНЫ ЖАНА ЭМГЕКТЕРИ","b":13}],"section":"КЫРГЫЗ ЛЕКСИКАСЫНЫН БАЮУ ЖОЛДОРУ","pages":[146,150]},{"title":"§ 36. СТИЛИСТИКА, АНЫН МИЛДЕТИ ЖАНА ИЗИЛДӨӨ ОБЪЕКТИСИ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"151\">151<\/span>СТИЛЬ ЖАНА СТИЛИСТИКА"},{"t":"h3","h":"§ 36. СТИЛИСТИКА, АНЫН МИЛДЕТИ ЖАНА ИЗИЛДӨӨ ОБЪЕКТИСИ"},{"t":"p","h":"Бизди курчап турган чөйрөдөгү кайсы бир чындыкты дал өзүндөй жеткирип берүүдө сөздөрдү же сөз айкаштарын туура тандоо маанилүү болуп саналат. Күнүмдүк пикир алышууда ар кандай кырдаалдарда кеңири колдонулган сөздөр буга уютку болот да, ага көмөккө көркөм боёкчолуу сөздөр, колдонулушу чектелген (пассивдүү катмардагы) сөздөр да жардамга келет. Адабий нормада жазуу үчүн, оюбуз түшүнүктүү болуш үчүн ушулардын бардыгына көңүл бурабыз. Мындай ойдун так, даана жана адабий нормада туура берилишинен, коомдук кызматынан улам стиль келип чыгат."},{"t":"p","h":"Адабий нормада, коомдук кайсы бир аткарган кызматына жараша иш алып баруу адам баласынын тармактуу иш аракетинен келип чыгат. Кээси иш кагаздары менен жүргүзүү зарылчылыгынан, кээси илимий иштерди жүргүзүүнүн натыйжасында, айрымдары массалык маалымат каражаттарында иштегендиктен, кайсы бири көркөм чыгарма жаратуудан улам алардын чыгармачыл иш аракеттери пайда болот. Анын натыйжасында пикир алышуу куралы болгон тилдик мүмкүнчүлүгүбүз да колдонулуусуна карай бөлүнүүгө дуушарланат. Ошентип, тилибизде илимдин дагы бир тармагынын пайда болушу шартталат. Бул – стилистика деп аталат."},{"t":"p","h":"Стиль адам баласынын оюн жазуу же оозеки билдирүүдөгү бир ыкма болуп эсептелет, ошондой тилдик өзгөчөлүктү изилдей турган илимдин тармагы <span class=\"pg\" data-n=\"152\">152<\/span>стилистика деп аталат. Мында адам баласынын чыгармачылыгына тиешелүү болгон чыгармачыл иштеринин жазылышындагы адабий норманын, сөз каражаттарынын, сүйлөмдөгү сөздөрдүн орун тартибинин жайланышынын принциптерин, сүйлөмдөрдүн типтеринин атайын ыкма катары колдонулуш өзгөчөлүктөрүнүн жалпы эрежелерин изилдейт. Стиль деген тил каражаттарын пайдалануу, тилдик материалдарын жазуу учурунда колдонуу ыкмасы болсо, стилистика ошол материалдардын колдонуу эрежелери деп эсептелет."},{"t":"p","h":"Пикир алышуу жазуу жана оозеки түрүндө жүргүзүлүп, эки топко бөлүү (оозеки жана жазуу стили) шартталган. Жазуу тилинин стили «жогорку» жана «китептик» деп бөлүнөт. Жогорку стилге мамлекеттик иш жүргүзүүгө, мамлекет менен мамлекеттердин ортосундагы, расмий жерлердеги сүйлөнүүчү сөздөр кирет: улуу урматтуу король, президенттин урматына, резиденция, сый тамак (мамлекеттик деңгээлдеги), айымдар жана мырзалар, кан айымы (королева) ж. б. тандалган сөздөр (алар жалпы тилдик деңгээлде анча көп эмес)."},{"t":"p","h":"Китептик стиль жалпы адабий нормадагы ар кандай иш жүргүзүүгө сайма-бай колдонулуучу сөздөр. Булар кыргыз тилиндеги жалпы сөздүк курам болуп саналат."},{"t":"p","h":"Сүйлөө тилинин стили жазуу түрүндөгү пикир алышуудан айырмалуу. Анткени оозеки пикирлешүү тикеден-тике сүйлөшүүнүн куралы болгондуктан, сүйлөшүүчүнүн абалына, жалпы маданий деңгээлине, өз ара мамилесине, ошол сүйлөшүп жаткан кырдаал, жагдай, мезгил менен шартталат. Ал диалог түрүндө ишке ашат. Буга мимика, кол шилтөө, булгоо, баш чайкоо ж. б. элементтер кошумча курал катары коштолот."},{"t":"p","h":"Карапайым жана жаргондук кеп ушул оозеки кептин стилине жакын. Карапайым сөздөр адамдардын күндөлүк пикир алышуусундагы барды-келди <span class=\"pg\" data-n=\"153\">153<\/span>сөздөрдөн турат. Ал эми жаргондор болсо иш кызыкчылыгы байланышкан топтордун өз кызыкчылыгына байланыштуу чектелген маанидеги сөздөрү болуп саналат. Мисалы, студенттердеги общяга, стипуха, сессия ж. б. сыяктуу; уурулардын, киши тоногучтардын ж. б. өзүнчө жаргондук сөздөрү болот."},{"t":"p","h":"Силер мындан мурда көркөм стилден башка стилдер менен тааныш болгонсуңар, ошондуктан бул жерде көркөм стилдин өзгөчөлүгүнө токтолуп, оюңарды бекемдешиңер керек."}],"sub":[],"section":"СТИЛЬ ЖАНА СТИЛИСТИКА","pages":[151,153]},{"title":"§ 37. КЫРГЫЗ АДАБИЙ ТИЛИНИН ӨНҮГҮҮ ЭТАПТАРЫНДА ПАЙДА БОЛГОН СТИЛДЕР ЖӨНҮНДӨ ЖАЛПЫ МААЛЫМАТ","blocks":[{"t":"h3","h":"§ 37. КЫРГЫЗ АДАБИЙ ТИЛИНИН ӨНҮГҮҮ ЭТАПТАРЫНДА ПАЙДА БОЛГОН СТИЛДЕР ЖӨНҮНДӨ ЖАЛПЫ МААЛЫМАТ"},{"t":"p","h":"Адабий тилде көркөм чыгарманын стили өзгөчө орунду ээлейт. Көркөм чыгармада тигил же бул көрүнүштү, кубулушту билдирүү жана баяндоо мүмкүнчүлүгүнө гана ээ болбостон, бул стиль окуучуга көркөм каарман аркылуу эстетикалык таасир этип, табитин калыптандыруу максатына ээ болот. Көркөм каарман канчалык чындыкка жакын, айкын мүнөзгө ээ болсо, окурманга ошончолук таасирдүү болот. Табиятты сүрөттөөдө болсун, каармандардын кебете-кешпирин, кулк-мүнөзүн сүрөттөөдө болсун, же кейипкердин ички дүйнөсүн берүүдө болсун, жазуучунун кыябын келтире тандап алган көркөм сөз каражаттары ажарын анык ачып берет."},{"t":"p","h":"Көркөм чыгармада адам баласы жашап өткөн ар кандай тарыхый доорду, коомдук ар кыл формацияны сүрөттөп берет. Ошондуктан кейипкердин кебинде же баяндоодо ошол доордогу сөздөрдү автор колдоно алат. Турмуштук чындыкты дал өзүндөй сүрөттөө максатында тарыхый сөздөрдүн колдонулушу көркөм ыкманы пайда кылат. Маселен, Төлөгөн Касымбековдун чыгармаларындагы тарыхый жана архаикалык <span class=\"pg\" data-n=\"154\">154<\/span>сөздөр кыргыз элинин өткөн кылымдардагы жашоо турмушун айкын чагылдырып берүү максатында, атайын каражат катары тандалып алынган."},{"t":"p","h":"Чыгармаларды жаратууда жазуучулар жеке эле бир элдин турмушундагы жашоону баяндабастан, мамлекеттик чектеги, ал түгүл, мамлекеттер аралык ар кандай алака-мамилелерге чейинки маселелерге кайрылышат. Мына ушундай учурда четтен кабыл алынган түшүнүктөр, ар кандай маанидеги сөздөр, терминдер колдонулушу атайын муктаждыкты түзөт. Мисалы, Ч. Айтматовдун «Кылым карытар бир күн», «Кыямат» чыгармаларындагы терминдик маанидеги жана четтен кабыл алынган сөздөр элдин туюмунда жок түшүнүктөрдү атоо максатында колдонулат."},{"t":"p","h":"Көркөм чыгармаларда стилдин башка түрлөрү да максатка ылайыктуу пайдаланылат. Айрыкча, диалогдук кепте эки же андан ашык адамдардын пикирлешүүсү жашоонун активдүү бир үзүмү сыяктуу чагылдырылат. Ошондуктан кейипкердин кыял-мүнөзүнө, тарбиясына жараша орой сөздөр да, диалектизмдер да, кесиптик сөздөр да керегинче колдонула берет."},{"t":"p","h":"Көркөм боёкчолорду пайда кылууда, кооздукту арттырууда синонимдердин, антонимдердин, фразеологизмдердин мааниси чоң. Алардын бир мааниси түз, тике атоону туюндурса, экинчиси өтмө же образдуулук туюмду билдирип, ажыратуучу же бириктирүүчү, кооздоочу боёкту түзөт:"},{"t":"v","l":["Кээде турмуш. уу берет,","Ачуусуна карабай.","Кээде турмуш кант берет,","Таттуусуна алданба.","(А. Осмонов)"]},{"t":"p","h":"Мындагы синонимдер жана антонимдер көркөм каражат катары колдонулууда. Антонимдер карама-каршылыкты <span class=\"pg\" data-n=\"155\">155<\/span>көрсөтүүчү гана сөздөр болбостон, турмуштун татаалдыгын билдирүүчү-нарктоочу боёк катары колдонулат. Сүйлөшүү стили адамдардын ортосундагы пикир алышууну, үналгы жана сыналгынын текст түзүү каражаттарын ичине камтыйт. Оозеки пикирлешүү маектешүүчү адамдын маанайын, аң-сезимине, убакытка, пикирлешүүчүнүн камына ж. б. байланыштуу максатка жетет."},{"t":"p","h":"Оозеки кептин негизин диалог түзсө, жазуу кептин негизин баяндоо, монолог түзөт."},{"t":"p","h":"68. Оозеки пикирлешүү менен радио жана телекөрсөтүүнүн берүүлөрүнүн ортосундагы стилдик өзгөчөлүктү байкап, айтып бергиле."}],"sub":[],"section":"СТИЛЬ ЖАНА СТИЛИСТИКА","pages":[154,155]},{"title":"НИН МАМЛЕКЕТТИК ЖАНА УЛУТТУК ТИЛИ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"156\">156<\/span>5-11-КЛАССТАРДА ӨТҮЛГӨН МАТЕРИАЛДАРДЫ СИСТЕМАЛАШТЫРУУ ЖАНА ЖАЛПЫЛАШТЫРУУ"},{"t":"p","h":"§ 38. АЗЫРКЫ КЫРГЫЗ ТИЛИ – КЫРГЫЗ ЭЛИ-"},{"t":"h3","h":"НИН МАМЛЕКЕТТИК ЖАНА УЛУТТУК ТИЛИ"},{"t":"p","h":"Азыркы кыргыз тили кыргыз элинин улуттук, мамлекеттик тили болуп эсептелет. Ал тилде Кыргыз Республикасында жашаган кыргыз улутундагы атуулдар, Өзбекстандагы, Тажикстандагы, Казакстандагы ж. б. кыргыздар сүйлөшөт, иш жүргүзөт. Өзбекстандагы, Тажикстандагы кыргыздар үчүн билим алуучу кыргыз тилинде мектептер бар."},{"t":"p","h":"Азыркы күндө кыргыз улутундагы атуулдар дүйнөнүн көп мамлекеттеринде жашайт, бирок алардын саны жөнүндө так маалыматтар жок, алар башка өлкөлөрдө кыргыз тилин коомдук чөйрөдө колдоно албайт. Түркия мамлекетиндеги кыргыздар өз эне тилинде пикир алышат, бирок мамлекеттик деңгээлде пайдаланышпайт."},{"t":"p","h":"Мамлекеттик тил ошол улутка жана бирдиктүү бир территорияда жашаган адамдар үчүн бирдей түшүнүктүү болгондуктан, бардык диалектилер үчүн бирдей орток тил катары ошол тилде иш жүргүзүү үчүн ийкемдүү кызмат аткарат. Кыргыз мамлекети эгемендүүлүккө ээ болгон мезгилден баштап, кыргыз тили мамлекеттик тил катары жарыяланган. Ал тилде иш кагаздары жүргүзүлөт, массалык маалымат каражаттары иш алып барат. Окуу жайларынын бардыгында (мектепке чейинки, мектепте, жогорку окуу жайларында) окуу иштери жүргүзүлөт."},{"t":"p","h":"Мамлекеттик тил адабий норманын принциптерине таянуу менен түзүлөт. Диалектилик, говордук сөздүк курам чектелген сөздөрдүн катарына кирет."},{"t":"p","h":"<span class=\"pg\" data-n=\"157\">157<\/span>Буларга көңүл бургула;"},{"t":"p","h":"1. Силер жашаган аймактагылар адабий тилде сүйлөшөбү?"},{"t":"p","h":"2. Адабий тилден тышкары турган сөздөр эмне үчүн мамлекеттик тилдин катарына кирбейт?"},{"t":"p","h":"З. Улуттук тил менен мамлекеттик тилдин эмне айырмасы бар?"},{"t":"p","h":"4. Мамлекеттик белгилерге тилден башка дагы эмнелер кирет?"}],"sub":[{"title":"НИН МАМЛЕКЕТТИК ЖАНА УЛУТТУК ТИЛИ","b":2}],"section":"5-11-КЛАССТАРДА ӨТҮЛГӨН МАТЕРИАЛДАРДЫ СИСТЕМАЛАШТЫРУУ ЖАНА ЖАЛПЫЛАШТЫРУУ","pages":[156,157]},{"title":"§ 39. КЫРГЫЗ ТИЛИНДЕГИ СТИЛДЕРДИН ПАЙДА БОЛУШУНДАГЫ ТЫШКЫ ФАКТОРЛОРДУН РОЛУ","blocks":[{"t":"h3","h":"§ 39. КЫРГЫЗ ТИЛИНДЕГИ СТИЛДЕРДИН ПАЙДА БОЛУШУНДАГЫ ТЫШКЫ ФАКТОРЛОРДУН РОЛУ"},{"t":"p","h":"Кыргыз тилинин акыркы жүз жылдык өнүгүшү боюнча караганда, тилдин коомдук иш аткаруу кызматына көңүл буруу керек. Кыргыз эли совет дооруна чейин эле оозеки чыгармалар менен балдарын тарбиялап, көркөм руханий дүйнөсүн байытып, көркөм мурастарды оозеки сактап келген. Ага чейин жазуу иштери да көркөм мурас казынасы катары окуу билгендер үчүн кызмат кылганы белгилүү."},{"t":"p","h":"Революциядан кийин мурдагы СССР мамлекетинин катарында функционалдык стилдин бардык тармагында иш жүргүзүүгө киришкени да белгилүү, б. а., ойду бере билүүнүн, иш жүргүзүүнүн ар кандай тармактары боюнча чыгармачылык өнүгүүгө дуушарланды. Көркөм чыгармалар жаралды, илимий иштер жүргүзүлүп, газета-журналдар, радио, телеберүүлөр, билдирүүлөр менен иш жүргүзүү өркүндөдү. Иш кагаздарынын ар кандай түрлөрүнүн үлгүлөрү иштелип чыкты."},{"t":"p","h":"Кыргыз тилинин стилдик өнүгүшүнө көз жүгүрткөндө, тилибизге гана эмес, аң-сезимибизге таасир эткен тышкы факторлорго карообуз керек. Адам баласына кандайдыр бир таасир эткен нерселер атоону гана талап кылбастан, аны пикир алышуу каражаты катары пайдаланууга негиз берет. Ошонун сыңарындай коомдогу өзгөрүүлөрдү жазуучулар көркөм чыгармаларга <span class=\"pg\" data-n=\"158\">158<\/span>айландырышат. Мисалы, кыргыз элинин турмушундагы урунттуу учурларды – революцияны, тап күрөшүн, Улуу Ата Мекендик согушту, сталиндик репрессияны, кайра курууну, эгемендүүлүктү көркөм чыгармалар аркылуу элдин кеңири катмарына берүү менен көркөм стиль жаралды, ага тышкы коомдук факторлор таасир этти, ички чыгармачыл демди ойготту."},{"t":"p","h":"Коомдук өнүгүш менен бирге илимий изилдөөлөр жаралат. Мына ушундай жооптуу мезгилде кыргыз тилинде ар тараптуу илимий изилдөөлөр, окуу китептерин, энциклопедияларды ж. б. түзүү ишке аша баштады. Натыйжада, көп сандаган реферативдик эмгектер, диссертациялар, монографиялык эмгектер, окуу куралдары, китептери, энциклопедиянын тармактары пайда болду. Булардын жаралышына дүйнөлүк изилдөөлөр, ага болгон кыргыз интеллигенттеринин илимий чыгармачылык деми түрткү болду. Демек, илимий стилдин жаралышына сырткы жана ички факторлор таасир эткендигин билүү керек."},{"t":"p","h":"Публицистикалык стилдин жаралышына, калыптанышына коомдук күнүгө болуп туруучу өзгөрүү, өнүгүү, алга умтулуу чоң таасир этет. Стилдердин бардыгынын ичинен активдүүсү публицистикалык стиль болуп саналат. Анткени ал стиль күнүгө, ал түгүл бир канча жолу эфирге чыгуу менен тынбастан, эл менен иш жүргүзөт. Ошондуктан бул стилге таасир этүүчү күч катары өлкөнүн ички жана тышкы саясаты, экономикалык-социалдык маселелер ж. б. кызмат аткарат."},{"t":"p","h":"Кыргыз тилиндеги иш кагаздарынын пайда болушуна, анын стиль катары калыптанып, жөнгө салынышына алды менен орус тилиндеги үлгүлөр кеңири таасир эткен. Ошондуктан формасы, мазмуну орус тилиндегидей кебетеге келген. Сүйлөмдөгү сөздөрдүн орун тартиби кыргыз тилиндеги адабий нормага жооп бербейт, б. а., сүйлөмдүн баяндоочу орус тилиндегидей башталышына келет, айкындооч мүчөлөрүнүн <span class=\"pg\" data-n=\"159\">159<\/span>орду да орус тилинин үлгүсүндө иштелип келген. Акыркы эгемендүүлүккө ээ болгон мезгилден бери карай, кыргыз тилинин адабий нормасына ылайык иштелүүдө."},{"t":"p","h":"Көңүл бургула:"},{"t":"p","h":"Буга чейинки силер карап, иштеп келген иш кагаздарынын үлгүлөрүн салыштырып, ар кандай жылдагы абалын кароо менен иш кагаздарына тышкы таасирлерди аныктагыла."}],"sub":[],"section":"5-11-КЛАССТАРДА ӨТҮЛГӨН МАТЕРИАЛДАРДЫ СИСТЕМАЛАШТЫРУУ ЖАНА ЖАЛПЫЛАШТЫРУУ","pages":[158,159]},{"title":"§ 40. ФОНЕТИКА, ОРФОГРАФИЯ ЖАНА КЕП МАДАНИЯТЫ БОЮНЧА","blocks":[{"t":"h3","h":"§ 40. ФОНЕТИКА, ОРФОГРАФИЯ ЖАНА КЕП МАДАНИЯТЫ БОЮНЧА"},{"t":"p","h":"Кыргыз тилиндеги ундуу тыбыштардын бөлүнүштөрүн (классификацияланышын) эске салгыла. Кыска ундуулер менен созулма ундуулердун негизги айырмачылыгы эмнеде? Ал боюнча тушунугунерду, далилдеринерди мисалдар менен бекемдегиле."},{"t":"p","h":"М исалы: Куш канаты менен учат, куйругу менен конот (Макал). Уурунун арты кууш (Макал). Ач кадырын ток билбейт (Макал). Тоок маалында какылыктайт (Макал). Сук адамдын өзү тойсо да, көзү тойбойт. Суук болмоюнча суу бетине муз тоңбойт. (Макал) д. у. с. Ар бир созулма үндүүгө түгөйлөш болгон кыска үндүүлөргө мисал келтиргиле."},{"t":"p","h":"Үндүү тыбыштардын тилге карай жоон, ичке, эринге карай эринчил жана эринчил эмес, жаактын ачылышына карай кең жана кууш болуп бөлүнүштөрүн эсиңерге салгыла. Алардын ар бирине мисалдарды келтиргиле да, андагы үндүүлөргө жогоруда айтылган тартип менен талдоо жүргүзгүлө."},{"t":"p","h":"69. Төмөнкү ыр саптарын окуп, андагы кара тамга менен басылган сөздөрдөгү үндүү тыбыштарга талдоо жүргүзгүлө."},{"t":"p","h":"Таң аткандан казып, ташып, кескилеп, Кызык жумуш кызылчада кеч кирет."},{"t":"v","l":["<span class=\"pg\" data-n=\"160\">160<\/span>Жалын жаштар чаалыкканын унутуп,","Түн койнуна түрлүү оюнду жеткирет.","","Мен тилеймин бүгүн жаштар жатпаса,","Түн узарып, ай, жылдыздар батпаса.","Ушул оюн кайра-кайра уланып,","Сен качпасаң, мени бирөө чаппаса."]},{"t":"p","h":"(О. Сооронов)"}],"sub":[],"section":"5-11-КЛАССТАРДА ӨТҮЛГӨН МАТЕРИАЛДАРДЫ СИСТЕМАЛАШТЫРУУ ЖАНА ЖАЛПЫЛАШТЫРУУ","pages":[160,160]},{"title":"§ 41. КЫРГЫЗ ОРФОГРАФИЯСЫНЫН ПРИНЦИП-","blocks":[{"t":"h3","h":"§ 41. КЫРГЫЗ ОРФОГРАФИЯСЫНЫН ПРИНЦИП-"},{"t":"h3","h":"ТЕРИ ЖАНА ЭРЕЖЕЛЕРИ БОЮНЧА ӨТҮЛГӨНДӨРДҮ КАЙТАЛОО"},{"t":"p","h":"Адабий тилдин жазууда колдонула турган бирдиктүү нормаларын туура сактап, сөздөрдү бир түрдүү жазыш үчүн, атайын иштелип чыккан эрежелердин системасы кандайча аталарын эсиңерге салгыла."},{"t":"p","h":"Атайын иштелип чыккан ар бир тилдин орфографиясы өзүнө тиешелүү бир катар принциптерге негизделет эмеспи. Андай болсо, кыргыз орфографиясы кайсы принциптерге негизделген? Морфологиялык принципти кандай түшүнөсүңөр? Фонетикалык принцип менен морфологиялык принциптин айырмасы эмнеде?"},{"t":"v","l":["Төмөнкү сөздөрдө кайсы принцип сакталган?","","Айтылышы:","тынштык","кашты","тамба","өкөө","бержак","Жазылышы:","тынчтык","качты","танба","экөө","бир жак"]},{"t":"p","h":"Сөзгө уланган мүчөлөрдүн көп варианттуулукка ээ болушу, алардын айтылышы боюнча жазылышы кайсы принциптин негизинде ишке ашкан?"},{"t":"p","h":"<span class=\"pg\" data-n=\"161\">161<\/span>70. Барыш жөндөмөсүнүн -га, чыгыш жөндөмөсүнүн -дан, көптүк маанини билдирүүчү -лар мүчөлөрү канча вариантка ээ? Алардын ар бир вариантына ылайыктуу мисалдарды келтиргиле."},{"t":"p","h":"Ү л гү: барыш жөндөмөсүнүн -га мүчөсүнө: малга, тойго, үйгө, жерге, саатка, чокко, терекке, сүткө."},{"t":"p","h":"71. Төмөнкү мисалдардын топтомундагы кашаага алынган сөздөрдү сүйлөмдүн маанисине карата кашаадан чыгарып, туура жазгыла. Туура жазууга орфографиялык принциптердин кайсынысын негиз тутканыңарды айтып бергиле."},{"t":"p","h":"1. (Токтогул + нын) мукам жан эргиткен (күү + лар + ы) кыргыз (композитор + лар + у + нын) көптөгөн чыгармаларына жем берген. 2. Ак буудай сепсе (өңгөн) жер, адамга (тынштык) берген жер. 3. Сатылгановдун портретин (сүрөт + ла + ып) (берүү + га), так эмес болсо да (акын + нын) (өзү + дан) айрым чыгармаларын жазып, калууга жетишти. («Кырг.мад.») 4. Жердин жүзүн – аштырып, (ууштап) тукум (чаштырып). («Манас») 5. Каныбек бүгүн күндөгүсүнөн (кештуруп), серүүндөп басканча айланага (көссалды). (К. Жантөшев) 6. Энкейип жер сыйпалай берди эле, бирок анын (колуга) жерден (эшнерсе) (урунган) жок."},{"t":"p","h":"7. Ушул (саат + дан) баштап, сен да (аянба), мен да (аянбайм). 8. Алда (неме + лар + ны) башбаж айткан чал (качаңкы) бир кезде ушул төрдө өткөн (өкүнүштүү) окуяны сүйлөп келатып (жоңго) кандай чыга бергенин сезбей калышты. (Т. Сыдыкбеков)"},{"t":"h3","h":"КЫРГЫЗ ОРФОГРАФИЯСЫНЫН НЕГИЗГИ ЭРЕЖЕЛЕРИ"},{"t":"p","h":"Кыргыз орфографиясынын жазуу эрежелеринин жалпы системасы канча бөлүккө ажыратылганын эсиңерге салгыла. Алардын бири – уңгу сөздөрдү жана сөз мүчөлөрүн (морфемаларды) жазуунун эрежелери. Экинчиси – сөздөрдү бөлөк, бирге жана алардын араларына дефис коюп жазуунун эрежелери."},{"t":"p","h":"<span class=\"pg\" data-n=\"162\">162<\/span>Бөлөк жазууга тийиш болгон сөздөрдү чогуу жазса, алардын мааниси таптакыр өзгөрүп кетерин унутпагыла. Салыштыргыла: куралды – кур алды, малалат – мал алат, алачык – ал ачык."},{"t":"p","h":"Адамдарга жана жаныбарларга берилген энчилүү татаал аттар кандай жазылат? Төмөнкү мисалдарды карап, анын кайсынысы туура жазылгандыгын айтып, далилдеп бергиле: Кожо жаш – Кожожаш; Керим бек – Керимбек; Дөөлөт аалы – Дөөлөт Аалы – Дөөлөталы; Сары ала – Сары Ала – Сарала; Телтору – Тел тору."},{"t":"p","h":"Кандай учурларда сөздөрдүн арасына дефис белгиси коюлуп жазылат? Төмөнкү сөздөрдүн кайсынысынын ортосуна дефис белгиси коюлуп жазылат? Бала чака, ачык айкын, ит куш, аба ырайы, коон дарбыз, басма сөз, Тескей Ала-Тоо, жаан чачын, эмгек куралы, Ала-Бел."},{"t":"p","h":"Баш тамгаларды колдонуу – кыргыз орфографиясынын жазуу эрежелеринин маанилүү бөлүктөрүнүн бири. Алардын кандай түрлөрүн билесиңер? Географиялык татаал энчилүү аттарды баш тамгалар менен жазуу кандай тартипте ишке ашат?"},{"t":"p","h":"Кыскартылган сөздөрдүн жазылышын эсиңерге салгыла. Алардын кайсы түрү жалаң баш тамгалар менен жазылат? Бир нече мисал келтирип, айтып бергиле."},{"t":"p","h":"Ташымалдап жазууда сакталуучу эрежелерди да эске салыңыздар. Андагы муунга бөлүп ташууга мисалдарды келтиргиле. Ошондой эле кайсыл учурда же татаал цифраларды, кыскартылган сөздөрдү бир муундуу же бир үндүү тыбыштан турган муундардын ташылышы же ташылбоосу жөнүндө түшүнүгүңөрдү айтып, мисалдарды келтиргиле."},{"t":"h3","h":"<span class=\"pg\" data-n=\"163\">163<\/span>§ 42. ЛЕКСИКА, ФРАЗЕОЛОГИЯ БОЮНЧА"},{"t":"p","h":"Кыргыз тилинин лексикасынын баюу жолдору"},{"t":"p","h":"Кыргыз лексикасынын баюу жолдору, негизинен, канчага бөлүнөт? Анын ички жана сырткы булактар аркылуу байышы кандай ыкмалар аркылуу ишке ашат? Морфологиялык, синтаксистик, семантикалык ыкмалар менен жаңы маанидеги сөздүн пайда болушун лексикалык корубуздун байышынын кайсы жолуна киргизебиз? Башка чет тилдеринен кабыл алынган сөздөр кандай жолдор менен ишке ашарын санап бергиле жана айтканыңарды мисалдар менен бекемдегиле."},{"t":"p","h":"72. Төмөндө берилген тексттин негизинде көнүгүү иштөөдө анда кыргыз лексикасынын баюу жолдоруна тиешелүү фактыларга көңүл бургула. Эгер андай сөздөр бар болсо, алардын ар бирине токтолуп, талдоо жүргүзгүлө."},{"t":"p","h":"Гаражга шоферлор келе башташты. Көпчүлүгү мени көрмөксөнгө сала жанымдан өтүп кетишет. Менин сунушумду жок дегенде Набиев жактырар бекен десем, мурдагыдай эле жакын арадагы дүкөндөрдүн бирине керосин ташыйсың деп, жолдомону колума карматты."},{"t":"p","h":"Диспетчерканадан жолдомо алып чыгар замат, адегенде буферге таянып машинанын астына эңилип карадым, жерге бир тамчы суу же май тамбаптыр. Эгерде машинадан суу же май акчу болсо, анда алыскы рейске баруу абдан түйшүктүү. Ар бир саат сайын токтоп, тажап кетесиң, ал түгүл техниканы иштен чыгарып коюшуң ыктымал."},{"t":"p","h":"Тобо десе, эмнегедир биздин базадагы айрым шоферлор ушуга окшогон түйшүктөрдү эч качан жасабайт. Көз салсаң, машинасынан суу да, май да ага берет, ошол сарыгып чыккан жерин бир күн атайын түзөтүүгө моюндары жар бербейт. Мындай ойлоп көрсөң, бир күнү азап чегерин ойлошпойт. Айрыкча Заирге таң каламын. <span class=\"pg\" data-n=\"164\">164<\/span>Ушул күнгө чейин бир жолу колуна шприц же ачкыч кармаганын, жок дегенде куру чүпүрөк менен машинасын аарчып койгонун көрө элекмин. Кудум мейманга келгендей, такыясын кашына чейин баса кийип алып, туз эле кабинага олтурат да, стартёрду чарылдатып басат."},{"t":"p","h":"Ооба, адам деген жаштайынан кандай тарбияланса, ал өзүнүн карамагындагы буюмга да дал ошондой мамиле жасайт экен. «Шофёрдун ким экенин анын карамагындагы машинасынан оңой-олтоң байкоого болот»,— деп армияда ротабыздын командири айтканы жүрөгүмө мөөрдөй басылган белем, дале эсимден кетпейт. Ушуну уккандан кийин, негедир мотордон май да, суу да агыздырбоого ант бергеним кызык. (Ч. Айтматов)"}],"sub":[{"title":"КЫРГЫЗ ОРФОГРАФИЯСЫНЫН НЕГИЗГИ ЭРЕЖЕЛЕРИ","b":11},{"title":"§ 42. ЛЕКСИКА, ФРАЗЕОЛОГИЯ БОЮНЧА","b":19}],"section":"5-11-КЛАССТАРДА ӨТҮЛГӨН МАТЕРИАЛДАРДЫ СИСТЕМАЛАШТЫРУУ ЖАНА ЖАЛПЫЛАШТЫРУУ","pages":[161,164]},{"title":"§ 43. ФРАЗЕОЛОГИЗМДЕРДИН ТҮРЛӨРҮ (ӨЗ АРА","blocks":[{"t":"h3","h":"§ 43. ФРАЗЕОЛОГИЗМДЕРДИН ТҮРЛӨРҮ (ӨЗ АРА"},{"t":"p","h":"БӨЛҮНҮШТӨРҮ) АЛАРДЫН БИРИ-БИРИНЕН"},{"t":"h3","h":"АЙЫРМАЛАРЫ"},{"t":"p","h":"Фразеологизмдер лексике-семантикалык жактан өз ара бир нече түргө бөлүнөрүн (классификациясын) өткөнбүз. Ал боюнча бөлүштүрүү фразеологизмдердин (составындагы) курамындагы компоненттердин алгачкы (же ар биринин өз алдынча тургандагы) лексикалык маани менен кийинки фразеологиялык жалпы маанинин ортосундагы жакындыгына, маанилик байланышына карата жүргүзүлгөн. Натыйжада, кыргыз тилиндеги фразеологизмдер үч түргө: фразеологиялык ширешме, фразеологиялык бирдик, фразеологиялык тизмек (же айкаш) деп бөлүштүрүлгөн."},{"t":"p","h":"Фразеологизмдерди жогорудагыдай бөлүштүрүүдөгү алардын бири-биринен болгон айырмачылыктарын эсиңерге салгыла. Ал түрлөрдүн ар бирине карата аныктамаларды келтирип, аны мисалдар менен бекемдегиле."},{"t":"p","h":"М и сал ы: котур ташы койнунда, колтугуна суу бүркүү, кули додо болбогон, көз ачып-жумганча, <span class=\"pg\" data-n=\"165\">165<\/span>кымча бел, кыяматтык дос д. у. с. туюнтмалар лексике-семантикалык жактан бири-биринен айырмаланабы, айырмасы болсо, алар фразеологизмдердин кайсы түрүнө кирерин айтып бергиле."},{"t":"p","h":"Фразеологиялык сөздүктөрдү пайдаланып, фразеологиялык ширешмеге – жыйырма, фразеологиялык бирдикке – он беш, фразеологиялык тизмекке (айкашка) – беш мисал келтиргиле. Аларды кайсы негизде фразеологизмдердин өз ара бөлүнүштөрү (түрлөрү) боюнча ажыратканыңарды далилдегиле."},{"t":"p","h":"73. Төмөнкү сүйлөмдөрдөн фразеологизмдерди таап, аларды фразеологиялык ширешмеге, фразеологиялык бирдикке, фразеологиялык айкашка ажыратып айтып бергиле."},{"t":"p","h":"1. «Букарда пулу бардын көөнү ток» дегендей, ишенген демөөрчүбүз бар, кайгы-капа менен жумушубуз жок, дүйнөкапар ойноп-күлүп келе жатабыз. (А. Убукеев) 2. Ата сакалы оозуна бүткөн чоң эле кишинин кылар иши ушубу? 3. Конкурстан өтпөгөндөрдүн жылдызы түшүп, бирин-сериндеп айылдарына кайта башташты (М. Борбугулов) 4. Кээде Жунус экөөбүз карандай сууну ичип, тишибиздин кирин соруп жаткан күндөрүбүз болду. 5. Эсиңдеби, баягы Бообек деген киши – атаңдын акыреттик досу. (Н. Байтемиров) 6. Керт башынын гана кызыкчылыгын ойлоо – биздин коомго жат. 7?. Бири мал багат, бири ашпозчуга кирет. Эң улуусу кара өзгөй өсүп, дагы эле эт менен челдин ортосунда жүрө берет. (Ж. Мукамбаев) 8. Батийна аялдардын чыныгы жабуулу кара ингени го чиркин. (Т. Сыдыкбеков) 9. Карачы, айланайын, карап туруп беш өрдөгүн учурду, деги мындан эмнени күтүүгө болот? (К. Сактанов) 10. Мен анын сырын беш колумдай билем, ошон үчүн ага ишенип, иш тапшырууга ниеттенип турам. 11. Эми булар да өздөрүнчө түтүн булатсын, качанга чейин биздин көзүбүздү карамак эле."},{"t":"p","h":"12. Бул энемден калган таберик, мен муну көзүмдүн карегиндей сактайм. (К. Сактанов) 18. Келгиле эми, ушул жерде аттарыбызды өргүткөнчө, өзүбүз да өзөк <span class=\"pg\" data-n=\"166\">166<\/span>жалгап алалы. 14. Андан ары эки бел калды, буюрса көз байланганча жетип барабыз. (К. Осмоналиев)"}],"sub":[{"title":"АЙЫРМАЛАРЫ","b":2}],"section":"5-11-КЛАССТАРДА ӨТҮЛГӨН МАТЕРИАЛДАРДЫ СИСТЕМАЛАШТЫРУУ ЖАНА ЖАЛПЫЛАШТЫРУУ","pages":[165,166]},{"title":"§ 44. ФРАЗЕОЛОГИЗМДЕРДИН КЕПТИН ОО- ЗЕКИ СҮЙЛӨШҮҮ ЖАНА КӨРКӨМ СТИЛГЕ","blocks":[{"t":"h3","h":"§ 44. ФРАЗЕОЛОГИЗМДЕРДИН КЕПТИН ОО- ЗЕКИ СҮЙЛӨШҮҮ ЖАНА КӨРКӨМ СТИЛГЕ"},{"t":"h3","h":"МҮНӨЗДҮҮЛҮГҮ"},{"t":"p","h":"Ффразеологизмдердин, негизинен, кепте ойду элестүү, таамай берүү үчүн колдонулуучу тилдик көркөм каражат экендигине биз өткөн сабактарда толук ынанганбыз. Алсак, «сараң» деген сөз аркылуу бирөөгө ажат ачпаган, байлыгынын, акыбетин көрбөгөн кишинин сапаты жөнүндө жөн гана түшүнүк алабыз. Ал эми кишидеги андай сапат «колу чүрүш», «кесип алса кан чыкпаган», «битин сыгып, канын жалаган» деген фразеологизмдер аркылуу берилсе, адамдын сөз болуп жаткан терс сапаты алда канча элестүү, таасын, таасирдүү боёк менен тартылып, угарманга (же окурманга) айкын жетип жаткандыгы даана байкалат. Мындан фразеологизм оозеки сүйлөшүүдө болсун, жазуу жүзүндө болсун кептин көркөм стилине жакындыгы ырасталып турат. Демек, фразеологизмдердин кепте тилдик көркөм каражат катары колдонулары талашсыз экени чындык."},{"t":"p","h":"Фразеологизмдер тууралуу өтүлгөн сабактардын материалдарын бышыктоо жана алган билимдерди бекемдөө үчүн аларды ар ким өз сөзүндө колдоно билүү үчүн оозеки жана жазуу түрүндө машыгуу иштерин жүргүзүү зарыл."},{"t":"p","h":"74. Адамдын оң сапаттарын (марттык, кайрымдуулук, токтоолук, ишке берилгендик, ак ниеттүүлүк, эмгекчилдик, калыстык) жана терс сапаттарын (сараңдык, өзүмчүлдүк, кайрымсыздык, кенебестик, кара ниеттик, жалкоолук, чагымчылдык ж. у. с.) туюндуруучу фразеологизмдерди жыйнап, аларды колдонуу аркылуу чакан сүрөттөмө жазып келгиле."},{"t":"p","h":"Мындай тапшырманы аткаруу үчүн, төмөнкүдөй ыкманы пайдалансаңар болот."},{"t":"p","h":"<span class=\"pg\" data-n=\"167\">167<\/span>1. Адамдын оң жана терс сапатын билдирүүчү кадимки сөздөрдү (лексикалык маанидеги) тандап алып, аны дептериңердин сол жак четине, жогортон төмөн карай тизмелеп жазгыла."},{"t":"p","h":"2. Алардын тушуна ага маанилеш фразеологизмдерди таап, коюп чыккыла."},{"t":"p","h":"3. Тапкан фразеологизмдерди колдонуу менен, бири-бирине мүнөзү карама-каршы келген эки каарманды алып, алардын кылык-жоругун, көпчүлүккө жасаган мамилесин, окууга жана коомдук иштерге катышуусун баяндоо аркылуу чакан сүрөттөмө же аңгеме жазсаңар болот."},{"t":"p","h":"Сөздөр, сөз айкаштар"},{"t":"v","l":["берешен","сараң","таза ойлуу","арамза","берилгендик","иштен качуу","","ишке берилгендик","көңүлкоштук","","жалкоолук","","Улгу:","Аларга маанилеш","фразеологизмдер","","колу ачык","колу чүрүш","жүрөгүндө кири жок","койнунда котур ташы бар","ичкен ашын коё салуу","моюн толгоо, жаа бою качуу","тикесинен тик туруу","кол учун тийгизүү, колдон","өтөр, үйгө жетер кылуу","куурай башын сындырбоо,","текей терип жүрүү, көчө","таптоо..."]},{"t":"h3","h":"БИЗДИН КЛАССТАШТАРЫБЫЗ"},{"t":"p","h":"(Теманы башкача койсонор да болот.)"},{"t":"p","h":"Асан менен Тополон биздин класста окушат. Асан – окуунун отличниги. Ал – көңүлүндө кири жок, ак көңүл, колу ачык бала. Анын окуу дегенде ичкен ашын жерге коё салчу сапаты бизди абдан суктандырат. Биз да ошондой окуучу болсок дегенде эки көзүбүз төрт. Ал мектептин коомдук иштерине активдүү катышат. Берилген тапшырманы аткаруу үчүн тикесинен тик турат."},{"t":"p","h":"<span class=\"pg\" data-n=\"168\">168<\/span>Ал эми Тополоң – биздин классты артка тарткан окуучулардын бири. Ал тапшырмаларын аткарбай келгенден бети кызарбайт. Биз менен мамилеси начар, колу чүрүш, бирөөнүн ийгилигине ичи тардык менен караган, койнунда котур ташы бар бала. Китеп окугандан жаа бою качат. Коомдук иштерге мойнунан байлагандай кыйылып, кол учун тийгизип, колдон өтөр, үйгө жетер кыла салат. Өз демилгеси менен куурай башын сындырбайт... (ушул сыяктуу ырааттуулук менен улантуу керек)."}],"sub":[{"title":"БИЗДИН КЛАССТАШТАРЫБЫЗ","b":11}],"section":"5-11-КЛАССТАРДА ӨТҮЛГӨН МАТЕРИАЛДАРДЫ СИСТЕМАЛАШТЫРУУ ЖАНА ЖАЛПЫЛАШТЫРУУ","pages":[167,168]},{"title":"§ 45. ТЕКСТ ТҮЗҮҮДӨ, ООЗЕКИ ПИКИР АЛЫШУУДА ФРАЗЕОЛОГИЗМДЕРДИ СТИЛДИК МАКСАТТАРГА ЫЛАЙЫК КОЛДОНО БИЛҮҮ","blocks":[{"t":"h3","h":"§ 45. ТЕКСТ ТҮЗҮҮДӨ, ООЗЕКИ ПИКИР АЛЫШУУДА ФРАЗЕОЛОГИЗМДЕРДИ СТИЛДИК МАКСАТТАРГА ЫЛАЙЫК КОЛДОНО БИЛҮҮ"},{"t":"p","h":"Биз бири-бирибиз менен оозеки сүйлөшүп пикир алышканда же өз оюбузду жазуу аркылуу кагазга түшүргөнүбүздө, тактап айтканда, текст түзгөнүбүздө эне тилибизде көркөм каражат катары арбын учураган фразеологизмдерди көп эле колдонобуз. Арийне, ошол тилдик көркөм каражаттар ар түрдүү стилдик максаттарды аркалайт. Ошондуктан ал максаттардын ишке ашуусу көркөм каражаттарды орду менен, ылайыгына жараша колдонуу чоң мааниге ээ. Эгерде фразеологизмдер ылайыгы менен орундуу колдонулбаса, же алар ыгы жок өзгөртүлүп колдонулса, бир максатты көздөп айтылган оюбуз же түзгөн текст өз максатына жетпейт. Атайын көздөгөн стилдик максатта фразеологизмдерди берген маанисине ылайык тандап алып сүйлөмгө пайдалануу, зарыл болгон учурда алардын маанисине доо кетирбей, айрым өзгөртүүлөр менен колдонуу да стилдик максаттарга ылайыктап, орундуу колдоно билүүгө жатат. Бул багыттагы алган билимди тереңдетүү жана фразеологизмдерди колдоно билүүгө машыгуу үчүн оозеки да, жазуу түрүндө да көнүгүүлөрдү көп иштөө зарыл."},{"t":"p","h":"<span class=\"pg\" data-n=\"169\">169<\/span>Фразеологизмдердин колдонулуш өзгөчөлүгүн эске салуу жана аны кайталап бышыктоо үчүн төмөнкүдөй жагдайлар көңүлдүн борборунда болууга тийиш: 1. Фразеологизмдердин колдонулуш өзгөчөлүктөрү; 2. Фразеологизмдерди орундуу пайдалануу."},{"t":"p","h":"75. Текстти окуп чыгып, анда учураган фразеологизмдердин кепте колдонулушуна байкоо жүргүзгүлө. Алардын маанилерин чечмелегиле. Орундуу же орунсуз колдонулгандыгы жөнүндө өз байкооңорду айтып бергиле."},{"t":"p","h":"Калкыбызда «Карысы бар элдин ырысы бар» деген накыл кеп бар. Элибиздин кайсы жеринде болбойлу, улууларга урмат көрсөтүшүп, карыяларга төрдөн орун беришип, жаштар алардын сөзүн эки кылбай, келиндер алдыларынан кыя өтүшпөй кадырлашат, сыйлашат. Үй-бүлөдө да чоң ата, чоң энелерди алаканга салышып, аздектеп отургандарды көп көрөбүз. Карыялар да өз каадасын бекем сакташып, кара кылды как жарган адилдиги менен өздөрүн таза тутуунун аракетинде. Куйма кулак, жез таңдай аксакалдар баштарынан өткөргөн бай тажрыйбага таянып, жаштарды жакшы тарбиялоого багыт берип, алтын шилекейлерин чачыратышып, акыл насааттарын айтуудан чарчашпайт. Жаз алды менен арык тазалап, жол тегиздөөгө өздөрү баштап чыгышканда, аларды көргөн айыл адамдары жапа тырмак бел чечип, жаз жарышына аттанышат."},{"t":"p","h":"Жай саратанда да дыйканчылыкка көз болушуп, же малчыларга бел болушуп, айтор, же сөзү менен, же иши менен эмгекчилерге кол кабыш кылышат. Күзгү күрөштө алардын кол ишинен да акылман кеңештери баалуу. Анан кыш, жаз, жай, күз мезгилдериндеги адам эмгегинин жыйынтыгы чыгарылып, эмгекке жараша ырахат алып, эмки жылдын камы көрүлөт. Ошондо карыялар ак сакалдарын жайкалтып, акыл чайкап, эмгегинен баар тапкандарга алкыш айтып, атасынын кашыктап тапканын чөмүчтөп чачкандарды эсиңе кел деп, кепке чакырышат. Эмгекчил адамдын эл алдында жүзү жарык экендигин, ал эми берилген <span class=\"pg\" data-n=\"170\">170<\/span>иштин майын чыгара албастан, чөп башылап жүргөн ак капталдардын колу кыска, жону жука болорун ишендире айтышат. Адам өмүрүн жаратылыштын мезгилдерине салыштырып, мисалдата нуска сүйлөшөт."},{"t":"p","h":"Чын эле байкап турсаң, адам өмүрүнүн мезгилдери да жыл мезгилине окшоп кетет экен. Эне сүтү оозуңан кете элек балтыр бешик кезиң, жаңыдан табиятты таанып, жазгы жаратылыштай күн сайын сергек өскөн өмүрүң жаз эмей эмне. Каруусуна күч толуп, жесе аш түтпөй, иштесе иш түтпөй, жадырап-жайнап турган учур жашоонун жай мезгили эмес бекен. Ата сакал оозуңа бүткөн күндөн тартып, өз ишиңе тараза салып, эмгегиңден тапкан ырахатыңды бала-бакыраңа, көпчүлүккө тартуулап, кийинки муундарга мурас калтырууну ойлоп, арканды алыс таштап, өз ишиңди өзүң таразалап, тактай баштаган учур өмүрдүн күзү тура. Анан ак кар түстөнүп, ак сакалын жайнатып, төрдө отурган карыяларыбызды элестетели. Ошол сыпаттуу, ошол курактуу жашы эңкейген карыларыбыз эл ичинде арбын. Бирок алардын ичинде да сыйга арзыган кадырлуулардын кадырлуусу болгон карыялар бар. Алар ар качан элдин жакшылыгын көргөндө төбөлөрү көккө жетип, кубанычтары койнуна сыйбайт. Нуска сөздөрү, айткан акылдары менен элге өөдөдө өбөк, ылдыйда жөлөк болушат. Ар бир айыл, ар бир эл ошондой касиеттүү, кадырман карылары менен сыймыктанышат. «Карысы бардын ырысы бар» деген сөздүн калети жок тура. («Кырчын»)"}],"sub":[],"section":"5-11-КЛАССТАРДА ӨТҮЛГӨН МАТЕРИАЛДАРДЫ СИСТЕМАЛАШТЫРУУ ЖАНА ЖАЛПЫЛАШТЫРУУ","pages":[169,170]},{"title":"§ 46. КЕПТЕ ФРАЗЕОЛОГИЗМДЕРДИ ОРУНДУУ ПАЙДАЛАНУУ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"171\">171<\/span>§ 46. КЕПТЕ ФРАЗЕОЛОГИЗМДЕРДИ ОРУНДУУ ПАЙДАЛАНУУ"},{"t":"p","h":"76. Төмөнкү фразеологизмдерди пайдаланып, 7-8 сүйлөм тузгуле."},{"t":"p","h":"У л г у: 1. Эптеп бирөөнү айыптагысы келгендер, бөйрөктөн шыйрак чыгарышып, кемчиликти издешет. 2. Ал сүйлөгөндө таңдайынан чан чыгып, элди өзүнө бат эле тартып алчу."},{"t":"p","h":"Ажат ачуу, айдан ачык, ак таңдай, алчы-таасын жеген, аяк бошотоор, бармак басты, көз кысты, башы жерге кирүү, бешиктен бели чыга элек, бөйрөктөн шыйрак чыгаруу, жаасы катуу, жан кечти, жел өпкө, жең ичинен, жети өмүрү жерге кирүү, жүрөгүндө оту бар, жылан сыйпагандай, кой терисин жамынган, көзү жок, кыргый кабак болуу, кара жаак, көзүнүн агы менен кароо, кулагынан күн көрүнүү, мурдун көтөрүү, ооз көптүрүү, сакасы алчы конуу, сөөк жаңыртуу, таманы жерге тийбөө, таңдайынан чаң чыгуу, топурагы жеңил, төө кыядан өтүү, түтүн булатуу."},{"t":"p","h":"77. Тексттеги кашаага алынган фразеологизмдерди тийиштүү формага келтирип, кашаадан чыгарып жазгыла."},{"t":"p","h":"Мугалимдин ал жерде эмне кылып жүргөнүн билүүгө кызыгып, бир күнү адырдан тезек терип келе жатып, үч-төрт кыз болуп, кайрылып калдык. Биз ошол тушка дем алмакка отура калганда, үстү-башы ылай болуп, (кулагынан күн көрүнүп) Дүйшөн тамдан чыга келди да, бизди көрүп:"},{"t":"p","h":"– Ии, кыздар, келгиле. Тезектен келе жатасыңарбы?"},{"t":"p","h":"Биз уялганыбыздан (оозуна талкан куюп алуу) мостоюп, бири-бирибизди карап, тим болдук. Дүйшөн дагы жылмая күлүп, мага кайрылды:"},{"t":"p","h":"– Атың ким, сенин?"},{"t":"p","h":"– Алтынай,— дедим мен жыртык тиземди этегим менен жаба салып."},{"t":"p","h":"<span class=\"pg\" data-n=\"172\">172<\/span>– Алтынай... жакшы экен. Сен чоңоюп калган, эстүү (жылдызы жарык) кыз экенсин,— деди ал мени эркелете. – Эмесе, Алтынай, сен башка балдарды да мектепке окуйлу деп ээрчиткин, макулбу?"},{"t":"p","h":"– Макул."},{"t":"p","h":"... Ал кеткенде биз дагы каптарды көтөрүп алып жөнөп калдык. Мындайыраак чыкканда менин башыма бир ой түштү да:"},{"t":"p","h":"– Токтогула, кыздар, коё тургула,— дедим, – мектепке отун керек экен, Дүйшөн агага (кол кабыш кылуу) тезегибизди тамдын түбүнө төгүп кетели, ичкери киргизип алсын."},{"t":"p","h":"– Үйгө (эки колду мурунга тыгуу) барабызбы анан, акылдуусун мунун!"},{"t":"p","h":"– Кайра барып, дагы терип келели."},{"t":"p","h":"– Койчу нары, күн (көз байлануу) баратат, апаларыбыз урушат – деп, кыздар мага карабай, каптарын бөжөңдөшө көтөрүп, чуркап кетишти."},{"t":"p","h":"Кыздар менин сөзүмү (кулагына илбөө) коюшканына намыстандымбы же болбосо (боорун жерден алуу) бери (шору кайноо) келаткан мени көрбөгөн, билбеген адамдын (жүрөгү жибүү) эркелете карап: «Сен эстүү, жылдызы жарык кыз экенсиң»,— деп эки ооз сөз айтканы (делебеси козголуу) кеттиби, айталбаймын. Бирок азыр ойлоп-ойлоп отуруп, менин чыныгы тагдырым, менин (тар жол, тайгак кечүү) өткөн таалайым ушул бир кап тезектен башталдыбы деп да кетем. Анткени так ушул күнү бул жоругумдун аягы эмне болот деп, тартынбай (бел байлоо), (бала болуп башыма чач чыгуу) биринчи жолу өзүм туура деп тапкан оюмду иштедим. Айтор, курбуларым менин (шагы сынуу) таштап кеткенден кийин, мен кайра жүгүрүп отуруп, Дүйшөндүн мектебине келдим да, каптагы тезекти там түбүнө төгө салып, тызылдаган бойдон адырдын кокту-копотун аралап тезек терүүгө шашылдым."},{"t":"p","h":"Алда кандай зор эрдик көрсөткөндөй (жүрөгү алып учуу), адегенде (аңды-дөңдү карабоо) чуркап кете бердим... Бирөөгө (көз жашындай) жакшылык кылганымдан <span class=\"pg\" data-n=\"173\">173<\/span>дикилдеген жүрөгүмдө канчалык кубаныч бар экенин билгендей, менин (ийне саяр жери жок) бешмантымдын топчуларына кечки күндүн нуру чагылышып, маңдайымдан эркелетип, балкыган нур төгүлүп жатты. «Билип койгула! Мен эми сөзсүз мектепте окуйм! Өзүм гана эмес башка балдарды окууга ээрчитем!» – деп көңүлүм көтөрүлүп, (кубаныч койнуна сыйбоо), сыймыктанып келе жаттым. Ушинтип жүгүрүп бара жатып, бир убакытта эсиме келе түштүм да, жерден тезек издей баштадым. Демейде жайнаган тезек азыр эмне үчүндүр (көзгө илинбөө) жатты. Караңгы түшкүчө кабым толбой калат экен го деп, ого бетер (учуп-күйүү) жаттым. Айткандай эле, менин кабым ортолой электе күн батып, (көз байлануу) баштады. Мени бул жерде бир нерсе кармап калчудай, капты ийниме арта таштап (таманы жерге тийбөө), айылды көздөй жүгүрдүм."},{"t":"p","h":"Ала-шала тер болуп, үйгө жетип келгенимде, очок боюнда от жагып отурган жеңем мени (көзүндө огу болсо атып жиберүү) көрүп, өйдө тура калды. Жеңем урушчаак (ачуусу мурдунун учунда) аял эле."},{"t":"p","h":"– Сен кайда жүрөсүң, ыя!? – деди (көзү ала чакмактануу). Колумдагы капты жулуп алып,— жети түнгө чейин сандалып, жүрүп тергениң ушубу? Оо, өлүкканаңды көрөйүн (суук тумшук, тумшугу суук). Мектептен айланат бекенсиң! Экинчи ошол жакка басып көр, шыйрагыңды чагып (талпагын ташка жаюу), (терисин тескери сыйруу), таманыңа туз куям! – деп жеңем улам күүлөнүп (оозуна ак ит кирип, кара ит чыгуу) жатты."},{"t":"p","h":"Мен (тилин тишине басуу) сөз да, үн да кайтарбадым. Очоктун боюна бүрүшүп, дабыш чыгарбай (өпкө-өпкөсүнө батпоо) ыйлап отурдум. Бул акмактын урган-сокконуна ыйлабас элем, андайга бышып бүткөнмүн. Мени жеңем мектепке жибербей коюшун ойлоп (ичи өрттөнүү) ыйлап жаттым... (Ч. Айтматов)"}],"sub":[],"section":"5-11-КЛАССТАРДА ӨТҮЛГӨН МАТЕРИАЛДАРДЫ СИСТЕМАЛАШТЫРУУ ЖАНА ЖАЛПЫЛАШТЫРУУ","pages":[171,173]},{"title":"§ 47. КЫЙМЫЛ-АРАКЕТТИН КАНДАЙЧА","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"174\">174<\/span>§ 47. КЫЙМЫЛ-АРАКЕТТИН КАНДАЙЧА"},{"t":"p","h":"ӨТҮШҮН СЫПАТТАП КӨРСӨТҮҮЧҮ ТАТААЛ"},{"t":"h3","h":"ФОРМАЛАР, АЛАРДЫН ЖАСАЛЫШЫ"},{"t":"p","h":"Кыймыл-аракеттин максатка багытталгандыгын, кыймыл-аракеттин ишке ашууга даяр экендигин жана кыймыл-аракеттин аз жерден ишке ашпай калгандыгын билдирүүчү этиштик татаал формалар"},{"t":"p","h":"1. Кыймыл-аракеттин максатка багытталгандыгын билдирген этиштик татаал формалар негизги этишке чакчылдын -ганы формасынын жалгануусу жана ага «бар», «тур», «кел», «чык» деген сыяктуу жардамчы этиштердин айкашуусу аркылуу жасалат. Мындай маанини билдирүүчү этиштик татаал формалар аркылуу аткарылган кыймыл-аракет толук иштелип бүткөн болот. -ып ал: жазып ал, көрүп ал; -ып бер: айтып бер, көрүп бер сыяктуу да жасалат."},{"t":"p","h":"М и сал ы: Кыймыл-аракеттин ким үчүн, кандай максатта иштелишинде -ып ал (жазып ал, көрүп ал), -ып бер (айтып бер, көрсөтүп бер) татаал формалары туюндуруп турат."},{"t":"p","h":"М и сал ы: Айылдан келгендер циркке жан-жаныбарларды көргөнү барышты. Айгул китепканага китеп алганы келди. Студент мугалимдин лекциясын жазып алды. Мугалим керектуу суроолорду көрсөтүп берди. Атасы небересине өткөндөгү бир тарыхый окуя тууралуу кызыктуу аңгеме айтып берди."},{"t":"p","h":"Кыймыл-аракеттин ишке ашууга даяр экендигин билдирүүчү этиштик татаал формалар төмөнкүдөй жол менен жасалат: Чакчылдын -ганы формасы жалганган негизги этиш менен тур, кал деген сыяктуу жардамчы этиштердин айкашуусу аркылуу жасалат."},{"t":"p","h":"М и с ал ы: Кун күркүрөп, аба ырайы бузулуп, жаан жааганы турат. Чоң залга элдер жык толуп, маараке-той башталганы калды."},{"t":"p","h":"Кыймыл-аракеттин ишке ашканы турганын ошондой эле, -ганы отур (барганы отурат, көргөнү <span class=\"pg\" data-n=\"175\">175<\/span>отурат), -ганы жат (алганы жатат, барганы жатат), -ганы жүр (көчкөнү жүрөт, барганы жүрөт) сыяктуу татаал формалар да жасашат."},{"t":"p","h":"М и с а л ы: Уул-кыздарын эрезеге жеткирген ата-энеси эми гана алардын убайын көргөнү отурушат. Апасы атайын кызынын туулган күнүнө арнап, белек алганы жатат. Алар жакында айылдан шаарга көчкөнү журушет."},{"t":"p","h":"Кыймыл-аракеттин аз жерден ишке ашпай калгандыгын билдирүүчү этиштик татаал формалар төмөнкүдөй жол менен жасалат: Кыймыл-аракеттин башталып барып аягына чыкпай же, аз жерден ишке ашпай калуусу төмөнкүдөй үч сөздөн турган татаал формалар аркылуу жасалат. Алардын биринчиси негизги маани берүүчү бөлүк катары эсептелет да калган экөө гана кошумча маани беришет."},{"t":"p","h":"Грамматикалык түзүлүшү жагынан биринчи маани берүүчү негизги бөлүгү -ып, экинчиси -а//, е формасындагы чакчылдан, үчүнчүсү жак формасындагы ташта, жазда деген маанилеш жардамчы этиштер болуп саналат."},{"t":"p","h":"М исалы: Улак тартышмай оюнуна кызуу берилип алышкан атчандар жөө адамдарды көмөлөтө коюп кете жаздашты. Алар колдорундагы буюмдарын жууйбуз деп жатышып, сууга агызып ала жаздашты."},{"t":"p","h":"Ошону менен бирге кыймыл-аракеттин аз жерден ишке ашпай калгандыгы -ып формасындагы негизги этиш менен кыймыл атоочтун -мак формасы жалганган сал, кал, жибер деген жардамчы этиштин тутуму аркылуу да жасалат. Мындай жасалуу жолу сейрек гана кездешет."},{"t":"p","h":"М исал ы: Топту издешээрин билгенде катып салмакмын."},{"t":"p","h":"78. Тексттен кыймыл-аракеттин максатка багытталгандыгын билдирген этиштик татаал формаларды аныктагыла. Алардын жасалышын айтып бергиле."},{"t":"h3","h":"<span class=\"pg\" data-n=\"176\">176<\/span>БАЗАР"},{"t":"p","h":"Ун алганы баргам. Ун базарына жетерим менен эле көздөрүнө чейин ун болгон кыз-келиндер, шуулдаган жигиттер тегеректеп калышты."},{"t":"p","h":"– Ун алыңыз. Тегирмендики. Аппак."},{"t":"p","h":"– Меникин алыңыз. Комбинаттын уну. Арзан. Чымчып көрсөтүп атышып, заматта агала кылып жиберишти."},{"t":"v","l":["– Мүшөгүңөр канча килден?","– Кырк беш.","– Элүү. Меники так, байке."]},{"t":"p","h":"Тике карадым. Алдамчы көздөр. Айтыла берип, башкага бурулбай калган сөздөр."},{"t":"p","h":"– Албайм?!"},{"t":"p","h":"«Албасаң базардын балакетин алганы келдиңби?» дегенсип, сууган шаабайлары менен көз ирмемге мени жек көрө тиктешти да, жаңы келген адамды туз сураган койлордой жабалактап, тегеректеп калышты. Мындайраак барып күбүндүм да, тигилерчилеп көрүнгөндү жакалабай, четте турган балага басып келдим."},{"t":"p","h":"– Сеники канча кил чыгат?"},{"t":"p","h":"– Ачык айтсам 42 килден кемибейт, байке."},{"t":"p","h":"Момураган бейкүнөө көз мени тике карады. Чындык экенин көзү айтып турат. Чындык айтылган жерде арамдык болбос. Чындыкты айткан көз жалтайлабай тике карады. Айткан акчасын төлөп бердим."},{"t":"p","h":"– Аш болсун,— деди бала."},{"t":"p","h":"– Береке тап,— дедим мен."},{"t":"p","h":"О, кагылайын турмуш, ушул момураган бейкүнөө көздү да бир күнү тигилердикиндей кытмыр көзгө айлантат эмессиңби?! Аны өзү да билбей калат го, чиркин!? (Ы. Кадыров)"},{"t":"p","h":"79. Төмөнкү тексттен кыймыл-аракеттин ишке ашууга даяр экендигин жана ишке ашпай калгандыгын билдирген этиштик татаал формаларды таап, белгилегиле. Алардын жасалыш жолдорун, канча сөздөн тураарын аныктагыла."},{"t":"h3","h":"<span class=\"pg\" data-n=\"177\">177<\/span>ЖОЛООЧУ"},{"t":"p","h":"Кош тарабын арчалуу аска курчаган капчыгай бара-бара тээ ылдыйда чалкып жаткан Талас өрөөнүнө кошулуп кетет. Айткандай эле, Таласың жер соорусу турбайбы, – деп койду жолоочу өзүнчө. Кош капталы чер токой, бууракандап агат дайрасы, ал тараптан соккон салкын жел жолоочуну элиртип жиберди. Жигит ажайып кооздукка дагы бир сыйра карап алды. Жигит аттын башын түз эле ошол боз үйгө бура тартты. Эшик алдында жаткан чоң сары тайган азууларын арсайта ырылдап коё берди. Ордунан атып туруп, чындап эле качырганы калды. Чукул кирип келген кашка айгыр жалт берди. Байкоосуз келаткан жигит ат үстүнөн ооп кала жаздады. Ал аңгыча үйдөн ак сакалын жайкалткан карыя чыга келди. Сөөктүү кең далысына чапанын желбегей жамынып алыптыр."},{"t":"p","h":"– Аргымагың туйлатып, Таласка келип калыпсың, баатыр. Байбиче, коноктун атын ал да, орун салып жибер."},{"t":"p","h":"Арадан үч күн өтүп калган. Акыры той болор күн да келип жетти. Өрөөндүн баш-аягынан агылып эл келе баштады. Айылдан алыс эмес жерде бир үйүр жылкы жайылып жүрдү. Түшкө жуук кыргыздардын айылына калмактар келип түштү. Өздөрүнчө үй тигип, чардап жатып калышты. Оюн-зоок болот деп жарчылар чууну салганда гана, алар кыргыздарга жандап барган болушту. Ал аңгыча кең көкүрөк, бою пас айгыр минип, ортого окторулуп чыга келди калмактын баатыры. Ниязбек баатыр токтоно албай атына ыргып мингенин өзү да сезбей калды. (Ч. Нусупов)"},{"t":"p","h":"80. Кыймыл-аракеттин максатка багытталгандыгын, ишке ашууга даяр экендигин жана ишке ашпай калгандыгын билдирүүчү этиштик татаал формаларды катыштырып моралдык-этикалык темада ой жүгүртүү дилбаянын жазгыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"178\">178<\/span>81. Этиштик татаал формалардын маанилик түрлөрүн катыштырып, досуңар, таанышыңар же тууганыңар менен каалаган темада оозеки аңгемелешүү, диалог уюштургула."},{"t":"p","h":"82. Тексттен этиштик татаал формалардын кандай маанилик түрлөрү бар экендигин тапкыла жана алардын жасалыш жолдорун баяндагыла."},{"t":"p","h":"...Атасы дагы кыйлага унчукпай отуруп калды. Кийин күрсүнүп койду. – Балам, жылкыны сабабай жүр. Ал эчен кылымдар бою биздин элдин жан жолдошу болуп келген... Ага камчы үйүрбөш керек... Сылап-сыйпап, сыйлап туруш керек... Атасынын үнү эбегейсиз кайгыга, муңга чалынып чыкты да сөзүн аяктабай туруп, сыртка чыгып кетти..."},{"t":"p","h":"Жуматай түндө камчы менен торуну башка-көзгө карабай сабап аткан учурун эстеди да, жаш жүрөгү тыз эте түштү. Анан ордунан ишенимсиз туруп, олдоксон басып сыртка бет алды."},{"t":"p","h":"Тору үйдүн капталындагы мамыда байланып туруптур. Атасы жембаштыкты илди. Чөнтөгүнөн жүз аарчысын алып чыгып, торунун көздөрүн сүртө баштады. Жуматай ошондо гана жылкынын көздөрүнөн мөлт-мөлт жаш агып атканын көрдү."},{"t":"p","h":"Атасы торунун көздөрүнүн шоролоно түшкөн кычыктарын, жаагына түшкөн жаштын издерин шашпай аарчып болгон соң, атты ээгинен сүйөп, көкүлүнөн сылап, сыла-ап туруп, ары булак жакка басып кетти. Бечара торунун муңдуу көздөрү ошондо жылдыздай жайнай түшүп, алиги шүмүрөйүп турган турпаты жазылып, ээсинин артынан сыймыктуу кошкуруп койду. (О. Айтымбетов) <span class=\"pg\" data-n=\"179\">179<\/span>§ 48. КЫЙМЫЛ-АРАКЕТТИН УЗАККА СОЗУЛУ- ШУН, АНЫН ТЕЗДИК МЕНЕН КАПЫСТАН БО- ЛУП ӨТКӨНДҮГҮН, ОШОНДОЙ ЭЛЕ ЖАСАЛМА МҮНӨЗДӨ ЭКЕНДИГИН ЖАНА ТОЛУК ИШКЕ АШ- КАНДЫГЫН БИЛДИРҮҮЧҮ ЭТИШТИК ТАТААЛ"},{"t":"h3","h":"ФОРМАЛАР"},{"t":"p","h":"Кыймыл-аракеттин узакка созулушун же кайталанышын билдирүүчү этиштик татаал формалар негизги этишке -а//, -е//, -й жана -ып чакчыл формаларынын жалганышы жана ага жат, отур, тур, жүр, кел, бер деген жардамчы этиштердин айкашуусу аркылуу жасалат."},{"t":"p","h":"Ошондой эле, -а(й) бер (жаза бер, ырдай бер), а- (-й) тур (жаза тур, сүйлөй тур), -ып тур (жазып тур), -а(-й) туш (жаза туш, ырдай туш), -а (-й) отур (жаза отур, сүйлөй отур), -а(й) жур (жаза жур, эстей жур) татаал формалары аркылуу да жасалат."},{"t":"p","h":"М и сал ы: Нооруз майрамында атайын даярданышкан окуучулар биринин артынан бири уламулам ырдай беришти. Мугалим тынбастан, доскага суйлемдерду чубуртуп жаза берди. Ал жардам берген адамдардын жакшы мамилелерин дайыма эстей жүрдү."},{"t":"p","h":"Демек, көрүнүп тургандай, мындай этиштик татаал формалары аркылуу берилген кыймыл-аракет сөз жүрүп жаткан учурда бүтпөйт. Анда бүтүү чеги да көп көрсөтүлбөйт. Кыймыл-аракеттин сөз жүрүп жаткан учурда болуп жаткандыгы жана андан ары да созулары же кыймыл-аракеттин дагы кайталана тургандыгы көрсөтүлөт."},{"t":"p","h":"Тездик менен капыстан болуп өтүүчү кыймыл-аракет чакчылдын -а//, -е//, -й формасындагы негизги этиш менен туш, кал, кой деген жардамчы этиштердин жана -ып формасындагы чакчыл этиш менен жибер деген жардамчы этиштин айкалышынан жасалат."},{"t":"p","h":"<span class=\"pg\" data-n=\"180\">180<\/span>Ошондой эле -кал (айта кал, бара кал), -ып жибер (тизип жибер, берип жибер), -ып түш (шылып түшөт), -ып кал (көрүп кал, барып кал), -ып ий (чаап ий), -а сал (ката сал, бара сал), -а кой (бере кой, бара кой), -ып ташта (айтып таштады, катып таштады) татаал формаларынын жардамы менен да жасалат."},{"t":"p","h":"М и с а л ы: Атчандардын астынан капыстан жөө адамдар чыга калышты. Кичинекей баласынын жоругуна атасы чыдай албай кулуп жиберди. Өзүнө кайтара айтылган сын сөзгө ал сестейе калды."},{"t":"p","h":"Кыймыл-аракеттин жасалма мүнөздө экендигин билдирүүчү этиштик татаал формалар төмөнкүдөй жол менен жасалат: негизги этишке атоочтуктун -ган жана кыймыл атоочтун -мыш мүчөсү жалгануу менен ага бол, эт деген жардамчы этиштердин айкашуусу аркылуу жасалат."},{"t":"p","h":"М и с а л ы: Ал жактырбаса да кучке салып күлүмүш болду. Башкаларды туурап ал дагы баш ийкемиш болду. Коноктор ыр-кууну тыңшамыш болушту."},{"t":"p","h":"Кыймыл-аракеттин жасалма мүнөздө экендигин, чын ыкластан иштелбегендигин -ымыш бол (айтымыш бол, жазымыш бол, күлүмүш бол), -ган бол (жасаган бол, караган бол) жана кыймыл-аракеттин толук ишке ашкандыгын, аякталышын билдирүүчү этиштик татаал формалар төмөнкүдөй жол менен жасалат; чакчылдын -ып формасы жалганган негизги этиш менен сал, кой, чык, кал, бил, ташта, кет, бут деген жардамчы этиштердин айкашуусу аркылуу жасалат."},{"t":"p","h":"М и с а л ы: Окуучулар борбордук аянттагы болжогон жерге өз мөөнөтүндө келип калышты. Ат майданындагы улуттук оюндун ар кыл турлеру боюнча уюштурулган оюн-зоок көрсөтүүсүн керуичулер көрүп бутушту."},{"t":"p","h":"<span class=\"pg\" data-n=\"181\">181<\/span>83. Тексттен этиштин кыймыл-аракеттин узакка созулушун билдирген этиштик татаал формаларды тапкыла. Алардын кандай жол менен жасалышын далилдегиле."},{"t":"h3","h":"КУДАЙБЕРГЕН"},{"t":"p","h":"– Эже, жыйырма тыйыныңыз барбы? Бир буюм алайын десем жетпей жатат,— дедим жер караган калыбымда."},{"t":"p","h":"– Бар, айланайын. – Аял сумкасын оодара баштады."},{"t":"p","h":"– Апа, бербе. Бул ичкич! – деди бэла апасына акырын."},{"t":"p","h":"– Жөн турчу. Аны сен кайдан билесиң!?"},{"t":"p","h":"– Билем. Карачы кебетесин. Көрүнүп турбайбы... Аял жыйырма тыйын берип басып кетти. Ыракмат айтууга да жарабадым. Наристе баланын сөзү сөөгүмөн өтүп, чучугума жетти. Ушуга чейин эч бир күч таасир эте албаган сезимиме бүлүк түштү. Ызалыкка буулугуп чыктым."},{"t":"p","h":"– Ушунчалыкка жеткеминби? Кайсы ырысыма ичип атам? Энемдин мени эрезеге жеткирип, күткөнү ушул беле? Энемди жалгыз таштап, эмнеге баса бердим?.. Деги жашоомдун максаты эмне? Өзүмдүн суроолорума өзүм жооп таба албай, башым катып турду. «Акыры түшүнөөрүңдү билгем» дегенсип, тыйын колумдан «шыңгыр» этип жерге кулап түштү..."},{"t":"p","h":"Мен келгенде бирде жок болуп, бирде жылт этип кайра көрүнө калып, булуттарды аралай каалгып жылган ай гана болбосо, айыл бүт таттуу уйкунун кучагында магдырап жаткан экен. Эчактан бери оңдолбой эскирген короонун эшиги болор-болбос ачылып туруптур. Абайлай эшикти түртүп, короого кирдим."},{"t":"p","h":"– Энеке!? – үйдүн терезесин чертип, акырын үн салдым."},{"t":"p","h":"– Ак сары башыл, айланайын! Кагылайын каралдым! Кудайбергеним! Аман-эсен барсыңбы?!"},{"t":"p","h":"Уйкусу качып, сак жаткан энем караңгыда төшөгүнөн <span class=\"pg\" data-n=\"182\">182<\/span>томолонуп-жумаланып турду да, сүйүнгөндөн кайсалап илгичти таппай жатып, араңдан зорго ачаары менен босогодо турган мага боюн таштады. Ал көпкө чейин шолоктоп ыйлап жатты. Мен жөнүндө ар кимден уккандарын, эч кимисине ишенбегенин айтып, бабырап сүйлөп да жатты."},{"t":"p","h":"– Эне, энекебай, кечир мени!? Сиздин тилиңизди албай мен акмак болуп жүргөн экенмин. Мындан ары ошол азезилди оозума алсам, сиздин ак сүтүңүз урсун!"},{"t":"p","h":"Энем экөөбүз бири-бирибизге улам жашып, көпкө чейин кучакташкан боюнча турдук. Кудайберген терең күрсүнүп алды..."},{"t":"p","h":"– Мына иним, сага айтып берейин дегеним. Азыр энем колумда экенин өзүң билесиң. Быйыл окууну бүтсөм, үйлөнүп, айылга кетем. Атамдын салган үйүн оңдоп, көптөн бери ээн турган үйдөн түтүн булатышым мойнумдагы карызым дагы, парызым дагы."},{"t":"p","h":"Кудайберген абама бир ооз сөз айтууга жарай албай, аны аягандан уламбы, терең улутундум. Азезилди жеңип, ак жолго түшкөн эрки күчтүү, акылы жетик адамга суктана карап турдум. (Ы. Кадыров)"},{"t":"p","h":"84. Тексттен кыймыл-аракеттин тездик менен капыстан болуп өткөндүгүн билдирген этиштик татаал формаларды тапкыла. Татаал форманын бул маанилик түрүнүн кандайча жасалганын чечмелегиле."},{"t":"h3","h":"ЖАТ ЖАЗУУ"},{"t":"p","h":"– Кана, балдар,— деди эжей жат жазууну окуп бүткөндөн кийин. – Саяктын жазгандарына ишенелиби?"},{"t":"p","h":"– Жок! Калп! Жалган! – деген кыйкырыктар чыкты туш-туштан. – Ал окуудан тарагандан кийин үйүнө жолобойт..."},{"t":"p","h":"– Буга эмне дейбиз, ия, Саяк? – Эжей аны уяткара карады."},{"t":"p","h":"Саяк деген Саяк го, жат жазуусуна туш-туштан чыгып, жокко чыгарып аткан балдардын өзүлөрүнө «калп айтышат...» деп жалаа жаап көрөйүн деди эле, <span class=\"pg\" data-n=\"183\">183<\/span>бирок андан эч нерсе чыкпасын көрүп, шылкыйып калды..."},{"t":"p","h":"Эжей башка балдардын жат жазуусуна жарыя окуп, ар бирине баа берип келди да, эми Үсөндүн жат жазуусун колуна алды. Ошол учурда эжей күтүлбөгөн жерден күлүп да жиберди. Анын күлкүсүндө бир кеп бар экенин сезе койгон Үсөн эжейди карап, элейип калды."},{"t":"p","h":"– Эми Үсөндүн жат жазуусуна кулак салгыла! – деди эжей күлкүсүн зорго тыйып. – Анын жат жазуусун сөзмө-сөз окуп берейин."},{"t":"p","h":"«Мен сабактан келгенден кийин үйгө берилген тапшырмаларымды аткарамын,-— деп жазыптыр. – Ошондон кийин апама каралашамын. Идиш-аяктарды жууп, иреттеймин. Үйгө суу ташыйм, андан кийин суу жылытып алып, ини-сиңдилеримдин кирин жууймун. Кечинде тамак жасаймын... А эртеси эрте туруп, мешке от жагам, чай коём, кийим-кечелеримди жана бантигимди үтүктөйм, жакшынакай жуунуп-таранып, чачымды өрүп мектепке жөнөйм...»"},{"t":"p","h":"Балдар таңданып отуруп калышты. Буга балдар гана эмес, Үсөндүн өзү да таңданды..."},{"t":"p","h":"Ошол учурда Жаңыл жанындагы Үсөндү жалт карады да, бырс күлүп жиберди. Иштин жайын түшүнө койгон балдар дуу эте түштү. Эжей да күлдү. Бирде Саякты, бирде Үсөндү карап баш чайкады."},{"t":"p","h":"– Ай-ай, эки дос... силерге даба жок турбайбы?! (О. Айтымбетов) 85. Төмөнкү тексттерден кыймыл-аракеттин узакка созулушун, тездик менен капыстан болуп өткөндүгүн жана толук ишке ашкандыгын билдирүүчү этиштик татаал формаларды бөлүп-бөлүп жазгыла. Бул татаал формалардын кандайча жасалышын түшүндүргүлө."},{"t":"h3","h":"МЕДАЛДЫН ЭКИ ЖАГЫ"},{"t":"p","h":"Айылдын кадырлуу адамы Бектен карыя – согуш ардагери. Майрам кундеру же чон салтанаттарда көкүрөгү туркун орден, медалга толуп калат."},{"t":"p","h":"– Балдарым, медалдын эки жагы деп калар эле ал мектептеги жолугушууларда окуучуларга."},{"t":"p","h":"<span class=\"pg\" data-n=\"184\">184<\/span>– Силер анын бир гана бетин көрүп турасыңар, а экинчи жагын Кудай силерге көргүлүк кылбасын..."},{"t":"p","h":"Бектен карыянын ушул сөзүн эстегенде Чоро: «Медалдын экинчи жагы канда

Семетейдей» атайылап угуучуларга кеңири аткарылган эмес. Анын себеби «Сейтек» мезгили жагынан өзүнөн мурдагы эки эпоско караганда, кийинчерээк чыккан жана ал таланттуу жомокчулардын чыгармачылык иштеп чыгууларынан өткөн эмес,"},{"t":"p","h":"Ошону менен бирге «Сейтек» өзүнчө бел. гилүү салттык сюжетке ээ болгон коп варианттуу жана толук кандуу чыгарма."},{"t":"p","h":"жыйынтыктаган -"},{"t":"p","h":"обобщающий корутунду – заклю-"},{"t":"p","h":"чительный"},{"t":"p","h":"курулушу жагы-"},{"t":"p","h":"нан- по строению"},{"t":"p","h":"угуучу слушатель"},{"t":"p","h":"чыгармачылык иш-"},{"t":"p","h":"теп чыгуулар – творческая обработка толук кандуу – пол-"},{"t":"p","h":"ноценный"},{"t":"v","l":["<span class=\"pg\" data-n=\"40\">40<\/span>«Сейтек» эпосундагы негизги идея – ич ара","келишпеген (не ладящие между собой) кыргыз","урууларынын башын кошуу (объединение),"]},{"t":"p","h":"кыргыз элинин көз каранды эместигин четтен кол салуучу душмандардан сактоо, атасы Семетейдин кунун кууп, Канчоро менен Кыяздан өч алуу."},{"t":"p","h":"Сейтек чоңойсо, элдин биримдигин бузган кара ниет чыккыячылардан оч алып, кыргыздын чачылган уруулары кайрадан бир жерге баш кошуп, кыргыз эли Манас баатырдын тушундагы денгээлге келет деген үмүт эпостун башынан аягына чейин көрүнөт."},{"t":"p","h":"четтен кол салуу-"},{"t":"p","h":"чу душман – враг, нападавший со стороны"},{"t":"p","h":"кайрадан баш ко-"},{"t":"p","h":"шуп – снова объединившись"},{"t":"p","h":"Бул идея эпосто Бакайдын, Сейтектин чоң энеси Каныкейдин, агалары Күлчоро, Карадөөнүн жана энеси Айчүрөктүн аракеттеринен билинет, Сейтектин» сюжетинин өнүгүшүнө Каныкей, Бакайдын образы, Семетей, Айчүрөк, Күлчоронун образдары маанилүү роль ойнойт."},{"t":"p","h":"«Сейтек» эпосу – байыркы кыргыздардын башынан кечирген тарыхый-социалдык турмушу, бактылуу келечек жана элдин биримдиги үчүн патриоттук күрөштөрү жөнүндө эпикалык бөлүм."},{"t":"p","h":"*Сейтек» эпосу «Манас» эпосунун масштабын кеңитип, арымын арттырып (унеличивая размах), жалпы чыгарманын үчилтик абалына жеткирип, «Манас» эпосунун идеялык-көркөмдүк тутумун (структура) жаңылап, толуктап, тереңдетип турат."},{"t":"p","h":"Эстегиле! Тааныш солдор:"},{"t":"p","h":"коз каранды эместик – независимость (9.кл., 22.6. «Манастын» идеялык"},{"t":"p","h":"мазмуну: Чыгарма элдин душманга көз каранды болбостугу учун Манас, Алмамбет, Чубак өңдүү баатырлар, Бакай, Кошойдой адилет акылмандар болуу керектигин далилдейт.) өч алуу – отомстить (7-кл., 16-б. «Кожожаштын Суречкиге ант"},{"t":"p","h":"Суречки мергенден «Алабашты тирүү калтыр»,- деп суранат. Кожожаш ага макул болбой, Алабаштын башын кесип алат, Ошондо Суречки мергендин айылына жазында келип, оч алмакчы болуп, ант берет. 8-кл., 7-б., «Курманбек» эпосунун негизги темасы, идеясы, варианттары»:"},{"t":"p","h":"Курманбек бала кезинен балбан чыгып, он эки жашка келгенде, кыргызкыпчак элинен кырк жигит курап, калмактардан кыргыз, кыпчактардын өчүн, кеткен кегин аламын деп, жоого аттанат."},{"t":"p","h":"8-кл., 10.6. «Курманбек», Эпостогу каармандардын образдары:"},{"t":"p","h":"Аккан – адамгерчиликтүү жолдош, мээримдүү дос. Курманбек олгондон"},{"t":"p","h":"кийин да анын өчүн алып, баласы Сейитбекти тарбиялайт.) Манас баатырдын тушунда – ло премена Манас баатыра (6-кл., 36.6. «Кошой"},{"t":"p","h":"коргон» уламышы: Илгери Манас баатырдын тушунда кадимки катаган уруусунун ханы Кошой балбан салдырган экен.) чабылган, чачылган – будучи разгромленным, рассеяться (7-кл., 8-6. «Манас» эпосунун иделлык мазмуну»; Эпостогу негизги идея"},{"t":"p","h":"Ата-Мекен үчүн күрөш. Мурда чабылып-чачылган уруулардын башын кошуп, уруунун эркиидиги, тынчтыгы үчүн, душмандарга өз кезегинде сокку уруу.)"},{"t":"h3","h":"<span class=\"pg\" data-n=\"41\">41<\/span>Сейтектин образы"},{"t":"p","h":"Сейтек – «Манас» эпосунун үчүнчү бөлүмүнүн башкы каарманы, Манастын небереси, Сейтек да мурунку муундагы баатырлардай эле элдин башына кыйынчылык түшүп турганда төрөлөт. Ал атасынын кас душманы Кыяздын сарайында болочок баатырга тиешелүү кара жалы менен, колуна кан чеңгелдеп, алгы менен тик түшөт. Ошондо күндүр-түндүр түн түшүп, жер айрылып, тоо кулап, журт чуркурап, жаратылыш кубулат. Эки күндө эне деп, алты күндө ата деп өтө тез чоңоёт. Сейтектин төрөлүшү душмандарга аябаган чоң коркунуч туудурат, Эли, туугандары Сейтектин эр жетишин чыдамсыздык менен күтүшөт. Ага Күлчоро атасы Семетей жөнүндө айтып берет. 12 жашка толгондо чыныгы баатыр катары жетилет, Ички душмандардын бетин ачып, Карагулга кул болуп жүргөн Күлчорону бошотот. Күлчоронун, Айчүрөктүн жардамы менен Кыясты жок кылат. Таластын кабарын угуп, ата-журтту сүйүү сезими ойгонот: «Кетем Талас жериме, баргым келет батыраак, калың кыргыз элиме»,- деп жөнөйт. Сейтек элине келгенде адам түгүл жан-жаратылыш солкулдап (дрожа, тресясь), кубанычтын жашын төгөт, атасынан калган Тайбуурул алдынан тосуп чыгат,"},{"t":"p","h":"Сейтек атасы Семетей сыяктуу атасынын ишин улаган баатыр болуп чыгат. Ал Сарыбай дөө менен жекеме-жеке сайышканда:"},{"t":"v","l":["Кара чаар кабылан,","Капталында чамынып,","Чолок көк жал арстан","Туурасында камынып,","Эл алдында сур жолборс,","Калкымда мындай жан болбос,"]},{"t":"p","h":"Кошо согуш кылды эле,- деп, колдоочулары (дух-покровитель) менен бирге сүрөттөлөт. Манастын курал-жарагы Сейтекке мурас катары өтөт. «Ак калпак кыргыз уулуна арка болор ейтек бар» болуп, Сейтек баатырдын учурунда кас душман – злоу-"},{"t":"p","h":"мышляющий враг кара жалы менен-"},{"t":"p","h":"черногривый чеңгелдеп – хватая аягы менен тик —"},{"t":"p","h":"ногой прямо вниз айрылып – разбив-"},{"t":"p","h":"шись, треснув чуркурап – крича кубулат – меняется коркунуч – страх"},{"t":"p","h":"кара чаар кабы-"},{"t":"p","h":"лан- черно-чубарый леопард чамынып – взры-"},{"t":"p","h":"вая землю ногами чолок -— куцый, кур-"},{"t":"p","h":"гузый (с обрезанным хвостом) камынып – прини-"},{"t":"p","h":"мая меры предосторожности сур —- мрачный"},{"t":"p","h":"Манас, Семетей баатырлардын тушундагыдай эле эл жыргап-куунап жашап калышат."},{"t":"p","h":"Сейтектин образы – жетим-жесирге боорукер, кедей-кембагалга кайрымдуу, адилеттүү башкаруучунун образы. Сейтектин образы <span class=\"pg\" data-n=\"42\">42<\/span>аркылуу ата-бабанын ишин улап, эл-жерин сактоодогу патриоттук сезим көркөм сүрөттөлгөн."},{"t":"v","l":["Тапшырмалар:","1, Суроолорго жооп бергиле:","«Сейтек» эпосунун негизги идеясы эмие?"]},{"t":"p","h":"«Манас» үчилтигинин «Сейтек» бөлүгү эмне себептен угуучуларга кеңири таралган эмес?"},{"t":"p","h":"2. Сейтек айкөл Манастын, атасы эр Семетейдии негизги иштерин"},{"t":"p","h":"улантып кете алчу баатыр экенин далилдеп сүйлөп бергиле, 8. Томонку сөздөрдүн синонимдерин, антонимдерин таап, дептериңерге"},{"t":"p","h":"жазгыла; баатыр, көк жал, көз каранды, уруу, уул, мурас, жас, со: гуш, ата-баба, колдоочу, улантуучиу."}],"sub":[{"title":"Сейтектин образы","b":33}],"pages":[40,42]},{"title":"САРЫБАЙ ДӨӨ МЕНЕН БОЛГОН СОГУШ","blocks":[{"t":"h3","h":"САРЫБАЙ ДӨӨ МЕНЕН БОЛГОН СОГУШ"},{"t":"p","h":"Сарыбай Желмогуз уулу – «Сейтек» эпосундагы тышкы жоо, фантастикалык кейипкер. Сейтек баатырдын Сарыбай дөө менен согушу Саякбай Каралаевдин, Жакшылык Сарык уулунун, Шапак Рысмендеевдин айтуусунда окуянын мүнөзү, максаты бирдей болгону менен, Сарыбайдын аты ар башкача айтылат. Илгери Сарыбайдын атасы Желмогуз Карлыгач деген кызы түшкөн айылды чапканда (напал), жети күндүк согушта Манастын колунан өлгөн экен. Сарыбай Манастын тукумуна каршы (против потомства) чыгып, жок кылууну көздөп жүрөт (намеревается),"},{"t":"v","l":["Карадоо менен Бозбала кийик уулап жүрүп,","Желмогуз уулу Сарыбай деген дөөнүн уктап"]},{"t":"p","h":"жаткан жеринде, үстүнөн чыгышат. Карадөө «Манас» деп ураан чакырып, Сарыбайды найза менен сайса, найзасы быркырап кетет, Ал жерде Карадөө Сарыбайдан каза табат, Карадөөнүн өлгөнүн Бозбаладан угуп, Сейтек, Күлчоро кол курап барып, Сарыбай менен бир нече күн урушуп, аны жеңе алышпайт. Күлчоро мурдагыдай күчкө кире элек, Сейтек али жаш болот."},{"t":"p","h":"Күлчоро Сарыбайдан отуз күндүк мөөнөт үстүнөн чыгышат —"},{"t":"p","h":"обнаружили ураан – призыв."},{"t":"p","h":"клич быркырап – ло-"},{"t":"p","h":"мается в дребезги кол курап – собрав"},{"t":"p","h":"войско"},{"t":"p","h":"сурайт, согушту убактылуу токтотот. Айчүрөк ак куу кебин кийип, Сарыбайды жеңе турган шер издеп, бир кезде достошкон курбусу, Кайыпчалдын Куялы деген балбан кызын табат."},{"t":"p","h":"Куялынын образы чыгармага баштан-аяк катышпаганы (не участвует) менен, эпикалык монументтүүлүккө жеткире сүрөттөлөт, Баатыр кыз Куялынын образы – эпостун идеялык мазмунуна чоң таасир тийгизген образ. Куялы кырк жигиттен кошчу алып, кырк балбаны жол чалып жерин коруп жүргөн алп кыз. Анын атасы Кайыпчал кудайдан бала сурап жүрүп, Куялы деген кызды тапкан экен. Кызы алтыга чыкканда атасы баатырларча ат коюп, чоң той берет. Жетиге чыкканда Куялы «кан шимирип катыгып, кыз <span class=\"pg\" data-n=\"43\">43<\/span>арстан атыгып», он үчкө чыкканда атасы өлөт. Ошондо Сарыбай кол жыйнап келип чаба турган болгондо Сарыбайдын колун кырып, өзүн качырып жиберет (упустит). Биротоло жоготуш үчүн Куялы ошондон бери Сарыбайды издеп таппай келет."},{"t":"p","h":"Эми Сарыбайга каршы Күлчоро менен Сейтекти жанына алып, аттанып чыгат. Куялы чачын төбөсүнө ороп түйүп, башына көк темир туулга кийип, Желжетпес тулпарын минип, Сарыбайга жекеге чыгат."},{"t":"p","h":"Отуз күн мөөнөт бүтүп, баатырлардын кармашы кайрадан башталат. Сейтек Куялы экоо Сарыбай дөө менен алмак-салмак кармашып, акыры ачууланган Куялы Сарыбайдын боорун жара саят (пронзит). Сейтек менен Куялынын баатырдыгы аркасында эл Сарыбайды жеңет да, жыргап жатып калат. Чоң той өткөрүлөт. Жарды-жалчыга (бедным) казына чачылып, Сейтек элге кан шайланат."},{"t":"v","l":["Жаңы сөздөр:","кейипкер – персонаж, литературный тип","туулга – шлем, каска","алмак-салмак – поочерёдно","","Тапшырмалар:"]},{"t":"p","h":"1. Төмөнкү сөздөргө көңүл бургула, мындай создөр эмне деп аталат: кошчу – сопровождающий в пути, Куялы кырк жигиттен кошчу алып,"},{"t":"p","h":"кырк балбаны жол чалып жерин коруп жүргөн алп кыз."},{"t":"p","h":"кошчу – пахарь (7Т-кл,, 67-6. Ч. Айтматовдун «Эрте келген турналар»"},{"t":"p","h":"повестинен: Ал айдоонун тигил учун кайрып, тоого бет алып барат, улам-улам кошчуларды карап коёт.) 2. Төмөнкү сөздөрдүн синонимдерин, антонимдерин таап, дептериңерге"},{"t":"p","h":"жазгыла: алп, тулпар, кейипкер, жеңет, кол, кыз, дөө, жок кылуун. Эстегиле! Тааныш сөздөр:"},{"t":"p","h":"дөө – див, сказочный исполин, великан (9-кл., 16-б. «Кошой дөө менен"},{"t":"p","h":"‚Жолой дөөнүн күрөшү») найза, айза – копьб, пика (7-кл., 114.6. «Эр Табылды» эпосунан:"},{"t":"p","h":"Алма баш асып жонуна,"},{"t":"v","l":["Сыр найза алып колуна,","Суу ичинде сайсам деп,","Сулатып жыгып салсам деп.","8-кл., 88-б. «Манастын Таласка көчүп келиши»:","Ак болотко айзаны","Аштай чыгып дөө болуп.","Кырк үйлүү, кыргыз лз элге","Кабылан Манас ээ» болуп."]},{"t":"p","h":"8-кл, 94-б. «Каныкейдин жомогу»: Каныкей аргасыздан: «Кечээ атаң Манас"},{"t":"p","h":"Бээжинге барып, Алмамбет, Чубактан, айрылып Конурбайдан найза жеп, Таласка келип өлдү, Отуз эки жашымда жесир калдым, Атаңдын керээзи боюнча, сени алты арамдан ала качып, мында келгенмин. Эми Таласка баргын» – дейт.) <span class=\"pg\" data-n=\"44\">44<\/span>ак куу кебин кийип – превратившись в лебедя (9-кл. 36-б. «Чынкожо, Тол-"},{"t":"p","h":"тойдун зордугу, Чүрөктүн учушу»:"},{"t":"v","l":["Ак куу кебин чечинип,","Анык адам болду дейт.)"]},{"t":"p","h":"балбан – силач (6-кл., 36.60. «Кошой коргон,» уламышы: Илгери Манас"},{"t":"p","h":"баатырдын тушунда кадимки катаган уруусунун ханы Кошой балбан салдырган экен."},{"t":"p","h":"8-кл.,91-6. «Каныкейдин Тайторуну чаптырышые»: Темиркан той берип,"},{"t":"p","h":"Семетейди кан көтөрөт, Тойдогу күрөштө Семетей Төө балбандын колун сууруй өлтүрөт."},{"t":"p","h":"8-кл.‚, 94-б. «Каиыкейдин жомогу»: Семетейдин балбандыгын коргон кандар"},{"t":"p","h":"аны чоңойтпой жаштайында өлтүрүүнү ойлойт.) али – великан, богатырь {9-кл..22-6. «Манастын» идеялык мазмуну: Алта пой, окурмандар эңсеген эмгектердин катарына кирет."},{"t":"p","h":"«Кут алчу билим» дастаны кыргыз, немис, түрк, орус, өзбек, уйгур, англис тилдерине которулган."},{"t":"p","h":"эмгегинде терең философиялык ойлорду батырган – в этом труде поместил"},{"t":"p","h":"гпубокие философские мысли"},{"t":"v","l":["жаратылыш кубулуштары – природные явления","адам мамилелери – человеческие отношения"]},{"t":"p","h":"<span class=\"pg\" data-n=\"48\">48<\/span>аскер башкаруучу жана эл башкаруучу кандай болушу керек – каким должен"},{"t":"p","h":"быть военачальник и каким должен быть правитель кандай мамиле түзүүнү насаат катары көрсөтөт- показывает в виде на-"},{"t":"p","h":"зидания, как строить отношения Эстегиле! Тааныш сөздөр:"},{"t":"p","h":"даанышман – мудрый, мудрец (9-кл., 18-б. Манастын образы: Ошол үчүн"},{"t":"p","h":"эл андан келечектеги коргоочуну, чабылган кыргыздарды чогултуучу азаматты күтөт, «айкөл, кок жал, даанышман, эр Манас» деп атайт, 9-кл., 20-б. Каныкейдин образы: Алдын-ала коре билген дааньииман Каны."},{"t":"p","h":"кей Манас чоң казатка аттанар алдында, мунун арты жамандык менен бүтө турганын билет да, Манаска эскертет.)"},{"t":"h3","h":"«КУТ АЛЧУ БИЛИМ» ЧЫГАРМАСЫ"},{"t":"v","l":["«Кут алчу билим» же «Куттуу билим» -","Теңир-Тоодогу түрк элдеринин даанышман","акыны жана ойчулу Ж. Баласагындын жазган","философиялык дастаны. Бул чыгарманын","жалпы көлөмү 13444 сапты түзөт, ыр түрүндө"]},{"t":"p","h":"жана кара сөз түрүндө жазылган чакан кириш бөлүмү бар. Кириш бөлүмүндө ал Баласагын шаарында туулгандыгы, дастанын Кашкарда жазып бүтүрүп, Кашкардын ханы Табгач ханга тартуулагандыгы, ушул эмгек үчүн «Улук хаас хажиб» наам алгандыгы айтылат. Кара сөз түрүндөгү кириш сөзүндө Жусуп Баласагын:"},{"t":"p","h":"*Буграхан тилинде жана түрк сөзү менен (эч ким) мындан жакшыраак китепти дегеле жазган жок»,— деп жазган. Ушул эле ой ыр түрүндө жазылган кириш сөздө:"},{"t":"p","h":"«Китепти окуй турган окурманым,"},{"t":"p","h":"Көркүнө түрк сөзүнүн нак тунарсың»,— деп айтылат. Демек, Жусуп Баласагын өзүнүн дастанын байыркы кыргыз тилинде жазган. Ал бул эмгегинде адеп-ахлактын ар бир үлгүсүн, таасирин, коомдук түзүлүштүн мыйзамын, тартип эрежелерин, ал тургай адам өз боюн кантип алып жүрүшү керек экендигине чейин баяндап айткан."},{"t":"p","h":"«Кут алчу билим» чыгармасы биздин күндөргө үч кол жазма түрүндө жеткен, Дастандын эң алгачкы кол жазмасы ХЇХ кылымдын 20-жылдарында табылган. Бул кол жазма Герат жана Вена нускасы деп аталат."},{"t":"p","h":"Кол жазманын арт жагындагы бул нусканын тарыхы тууралуу маалыматка караганда, кол жазма 1439-жылы 17-июлда көчүрүлүп бүткөн."},{"t":"p","h":"Көчүрмөнү жасаган адам уйгур улутундагы кириш бөлүмү —"},{"t":"p","h":"вводная часть"},{"t":"p","h":"тартуулагандыгы"},{"t":"p","h":"айтылат – говорит отом, что подарил буграхан – орто"},{"t":"p","h":"кылымдарда капыптанган кыргыз тили – название кыргызского языка в средние века нак тунарсың – как"},{"t":"p","h":"раз, точь-в-точь наспадишся адеп-ахлак – нрав-"},{"t":"p","h":"ственность коомдук тузулуш-"},{"t":"p","h":"тун мыйзамы – законы общественного строя кол жазма – руко-"},{"t":"p","h":"пись нуска – экземпляр"},{"t":"p","h":"көчүрмө – копия <span class=\"pg\" data-n=\"49\">49<\/span>адам болгондуктан, бул л жазма уйгур тилине которулган экен, Экинчи кол жазма Каир нускасы деп аталат. Ал араб ариби менен ХУ! кылымдын башында көчүрүлгөн. Үчүнчүсү – Наманган кол жазмасы. Аны илим чөйрөсүндө Фергана кол жазмасы деп да коюшат. Бул кол жазманы Наманган шаарынан 1913-жылы чыгыш илимпозу Ахмед Заки Валидов тапкан, Каир нускасы сыяктуу эң алгачкылардан болуп ХЕ-ХИ кылымдарда көчүрүлгөн."},{"t":"p","h":"Жусуп Баласагын өз дастанында киндик каны тамган жерин, анын ыйык топурагын, агын суусун, тоо-таштарын, жаратылыштын кооздугун сүрөттөгөн. Айрым тарыхый инсандар, кыпчак, мундуз, ягма, күнтуу сыяктуу кыргыз урууларынын аталыштары, алардын кесиби, маданияты, салттары жөнүндө айткандары өтө маанилүү."},{"t":"p","h":"Жусуп Баласагын коом жана адам баласынын коомдогу ээлеген орду жонүндө айтып, адам баласы мамлекетти өзүнүн жакшы сапаттары, айрыкча илими, билими, эмгек менен башкара алат деп көрсөткөн."},{"t":"v","l":["Билим менен эмгек ишти бүтүрөт,","Илим бекти мурасына жеткирет."]},{"t":"p","h":"Биздин ата-бабаларыбыз дал ушундай куттуу, касиеттүү сөздөрдөн тарбияланып, таалим алган."},{"t":"p","h":"Өлкөнү башкаруу үчүн өкүмдар же бек ар бир сөзүн талдап, байкоосу керек, тил өнөрүн үйрөнүү керек. Орой сөздөн алыс, билимдүү болсоң, акылман да болосуң, мына ошондо өлкөнү башкаруу жеңилдей түшөт."},{"t":"v","l":["Илим менен билимге көпүрө тил,","Көкөлөткөн адамды дили деп бил."]},{"t":"p","h":"Калкты башкаруу үчүн эң мыкты мыйзам керек экендигин айткан акын бабабыз мындай мыйзам адилеттүүлүктү камсыз кыларына ишенген."},{"t":"v","l":["Адилет бол, катаалдыкка кабылба,","Элди кубант эмгектенип, жаңылба,","Эсендикте элиңе жакшылык кыл,","Колдогунду кедейге таратып тур.","Көр дүйнөнүн артынан түшүп кетпе,"]},{"t":"p","h":"Адилдикти ар кылган иштен изде,- деп"},{"t":"p","h":"1.83 араб ариби ме-"},{"t":"p","h":"нен – арабскими буквами илим чейресунде -"},{"t":"p","h":"в научной среде"},{"t":"p","h":"киндик каны там-"},{"t":"p","h":"ган жер – здесь: родная земля топурак – глина,"},{"t":"p","h":"земля, почва"},{"t":"p","h":"айрыкча – особенно"},{"t":"p","h":"жеткирет – доведёт куттуу, касиеттүү"},{"t":"p","h":"сөздөр – святые слова өкүмдар – власти-"},{"t":"p","h":"тель бек – бек, правитель талдап – анализи-"},{"t":"p","h":"руя орой – грубо, грубый"},{"t":"p","h":"мыйзам – закон"},{"t":"p","h":"камсыз кыл – обе-"},{"t":"p","h":"спечить катаалдык – суро-"},{"t":"p","h":"вость <span class=\"pg\" data-n=\"50\">50<\/span>жазган, Акындын ою боюнча (по мнению), адилеттүүлүк өкүмдарга өлкөнү башкарууда урмат-сый, даңк (слава) алып келет. Улуу ойчул Жусуп Баласагын көчмөндөрдүн кулк-мүнөзүн, кызуу кандуулугун (разгорячённость, возбуждённость), бардык ишти тезирээк бүтүрүүнү каалаганын билип, мамлекетти башкаруу ишинде сабырдуулук да керек экендигин эскерткен."},{"t":"p","h":"Өзүндү отко салба бийлик үчүн, Бироенун жибин алба, салба күчүң."},{"t":"p","h":"Поэмада алдыңкы гуманисттик идеялар көпчүлүк орунду ээлейт. Чыгарма ар түрдүү кесиптеги адамдарды, илим-билимди, адилеттүүлүктү, акылды, абийирдүүлүктү, чынчылдыкты даңазалайт. Поэманын мааниси, идеясы ошол кездеги тарыхый мезгил менен шартталган рухий байлыктарды туюнтуу менен бирге адам турмушунун түпкү маанимаңызын (основную суть) ачып көрсөтөт."},{"t":"p","h":"Акын көркөм сүрөттөөнүн өзгөчө формасын эркин колдоно алган. Чыгарманын идеясы каармандар Кунчыкты, Айтолду, Элик, Акдилмиш, Өткөрмүш деген образдар аркылуу каймана мааниде туюнтулат. Төрт адамдын ортосундагы суроо-жооп, диспут, полемика формасындагы диалогдордо поэманын негизги мазмуну жүзөгө ашат."},{"t":"p","h":"«Кут алчу билим» поэмасы ар тараптуу акыл-насааттын, саясий-социалдык, коомдукэкономикалык, адеп-актык маселелердин маанилүү жактарын камтыган (содержащий, охвативший) философиялык трактат, түрк элдеринин адабий мурасы жана алардын маданиятынын жалпы энчиси болуп саналат."},{"t":"p","h":"Эстегиле! Тааныш сөздөр:"},{"t":"p","h":"кулк-мүнөз – харак-"},{"t":"p","h":"тер, поведение"},{"t":"p","h":"сабырдуулук – тер-"},{"t":"p","h":"пеливость, сдержанность, выдержка абийирдүүлүк – со-"},{"t":"p","h":"вестливость, честность чынчылдык – прав-"},{"t":"p","h":"долюбие даңазалайт – про-"},{"t":"p","h":"спавляет рухий байлык – ду-"},{"t":"p","h":"ховное богатство туюнтуу – тракто-"},{"t":"p","h":"вать, объяснить каймана – иноска-"},{"t":"p","h":"зательно, скрытно жүзөгө ашат – осу-"},{"t":"p","h":"ществится"},{"t":"p","h":"акыл-насаат – на-"},{"t":"p","h":"зидание, наставление адеп-актык – нрав-"},{"t":"p","h":"ственный жалпы энчи – об-"},{"t":"p","h":"щая доля в наспедстве"},{"t":"p","h":"даанышман – мудрец (9.кл.. 47-б. Жусуп Баласагын жөнүндөгү тексттен:"},{"t":"p","h":"Жусуп Баласагын өзү жашаган доордун даанышманы, түрк элдеринин акыны, ойчул жана мамлекеттик ишмер болгон.) наам "t":"p","h":"Адабиятчылар, тарыхчылар, тилчилер, философутор Молдо Нияздын колкитептерин тарыхый уникалдуу казына катары баалашат. жазгыч акын – пишущий акын"},{"t":"v","l":["а түгүл – даже","аймак – территория"]},{"t":"p","h":"мезгилинин кадыр-барктуу инсаны – уважаемый человек своего времени,"},{"t":"p","h":"личность эл бийлеген – руководившие народом; акындык чабыты – поэтические поис-"},{"t":"p","h":"ки, мысли"},{"t":"v","l":["илим-билимдуулугу – образованность","кыраакы кенешчилиги – мудрый советчик;","таасирдуулугу – влиятельность"]},{"t":"p","h":"түрк адабияты менен өзөктөш – имеет общую основу с туркской литературой зулумдук – тирания, жестокость, притеснение"},{"t":"v","l":["нааразычылык – недовольство","колкитептер – книги, написанные от руки"]},{"t":"p","h":"<span class=\"pg\" data-n=\"59\">59<\/span>Эстегиле! Тааныш сөздөр:"},{"t":"p","h":"кыдырып – побывать, бродить в поисках, обходить (7-кл., 4-6. «Жарамазан"},{"t":"p","h":"айтуу салты жөнүндо»: Жарамазан айткандар эки-үчтөн жүрүшкөн. Алар үймө-үй, айылма-айыл кыдырышкан.) кол жазма түрүндө – в виде рукописи (9-кл., 48-б. «Кут алчу билим» чы-"},{"t":"p","h":"гармасы: «Кут алчу билим» чыгармасы биздин күндөргө үч кол жазма түрүндө жеткен.) чагылдырган – отражал (7-кл,, 92.6. Аман Саспаев жөнүндөгү тексттен;"},{"t":"p","h":"Амаи Саспаев өзүнүн чыгармаларында Кытайда жашаган кыргыз эми. гранттарынын жана социалдык абалын чагылдырган) кордук – унижение (Т-кл., 11-б. «Манасо элосунун кыскача мазмуну: Бакайды"},{"t":"p","h":"тирүүлөй улак кылып тарттырып, аябай көп кордук көрсөтөт, Каныкей музоо кайтарат, Күлчоронун аялы Акбала отун алып, күл чыгарат. 7-кл.. 21-б. Калык Акыев жөнүндөгү тексттен: Төрөгелди Калыкты кор-"},{"t":"p","h":"доп, шылдыңдап, өзүнчө эрмектеп күлкү кылмакка гана ыр үйрөнүшүн талап кылат."},{"t":"p","h":"казына – казна, сокровищница (7-кл., 88-6, «Эр Табылды» эпосунан: Он"},{"t":"p","h":"торт жашка чыкканда Табылды атасынын казынасын ачып, жоо жа» рагын алат."},{"t":"p","h":"9-кл., 1-б. Киришүү: Орто кылымдарда кыргыз элинин оозеки чыгармалары"},{"t":"p","h":"мазмуну, формасы, стили жагынаи олуттуу өзгөрүүлөргө учурап отуруп, айрым үлгүлөрү классикалык денгоолге жетип, жалпы адамзаттык маданий казынага айланган.)"},{"t":"h3","h":"Академик Болот Мураталы уулу"},{"t":"p","h":"Юнусалиевдин «Молдо Нияздын санаттарындагы диалектик санат – песня, состоя-"},{"t":"p","h":"щая изрифмованных афоризмов өзгөчөлүктүн чагылдырылышы» макаласынан диалектик өзгөчөлүктүн чагылдырылы- «Биз «Молдо Нияздын санаты» деп атап жүрчү кол жазма жөнүндө алгачкы кабарды шы – отражение особенностей диалекта 1951- жылы октябрь айында Охна кыштагында макала – статья жашоочу 68 жаштагы Баит Исманалиев деген атап жүрчү – названколхозчудан уктук. Кол жазма жана анын ная нами автору жөнүндө бул кишинин айткандарын кол жазма – рукопись кийин Шаймардан өрөөнүндөгү башка кыштактын бир топ адамдары да ырасташты. Баит ырасташты – подтверакенин айтканына караганда (по рассказам) дили кечээ жакында эле (ещё недавно) айыл адамдары бат-бат чогулушуп, арасынан арабча кат кат тааныгандар – тааныгандары Молдо Нияз ырчынын санатын грамотные окуп берчү экен. Санат жазылган үч дептери болуптур. Анын биринде (мага айтышканына караганда) Молдо Нияз Түндүк Кыргызстандын ар кайсы жеринде болгондугу тууралуу сүткор соодагер – рожазса, дагы биринде сүткор соодагерлерди стовщик шакабалап ашкерелеген экен. Абышкалар, бул шакабалап – высмедептерди Молдо Нияз өз колу менен жазган ивая <span class=\"pg\" data-n=\"60\">60<\/span>деп бир ооздон (все) айтышса, кээде колдон- КОЛГО өткөн көчүрмөсү болушу мүмкүн деп божомолдошот."},{"t":"p","h":"Мен бул дептерди издеп көрдүм, бирок тыянак чыкпады, Болгону жол болуп 1957- жылы Азиза Токтобаеванын жардамы менен ал дептерлердин бири колубузга тийди (попал нам в руки), Анда Молдо Нияз өзү ат арытып кыдырган Түндүк Кыргызстандын Жумгал, Кочкор, Суусамыр, Чүй, Нарын, Ат-Башы жерлери жөнүндө эскерген экен."},{"t":"p","h":"Кол жазма Орто Азиядагы кеңири тараган көчүрмө болушу мүмкүн – может быть это копия божомолдошот"},{"t":"p","h":"предполагают тыянак чыкпады —"},{"t":"p","h":"безрезультатно ат арытып – ездить өңү өчө башта-"},{"t":"p","h":"ган – цвет начал стираться, уничтожаться жазма ыгына салынып (по распространённому методу писания), мезгилдин өтүшү менен (со временем) өңү өчө баштаган кара сыя менен (чёрными чернилами) жазылыптыр."},{"t":"p","h":"Санат жети-сегиз саптуу ырлар менен бет толо (на целую страницу) жазылган, Санатта чагылдырылган (отраженные в санате) падыша аскерлеринин Чымкент менен Ташкентти (1865-жылы) алышы, айрым ферганалык кыргыздар менен кыпчактардын Сары-Колду көздөй (по направлению) качышы сыяктуу жана башка тарыхый окуялар (исторические события) Молдо Нияздын жашап өткөн дооруна туш келет (совпадает). +"},{"t":"h3","h":"Молдо Нияздын «Курбанжан датка» санаты жөнүндө"},{"t":"p","h":"Молдо Нияздын чыгармаларынын ичинде өзүнчө өзгөчөлөнүп турганы Курманжан датка жөнүндөгү санаты болуп эсептелет. Бул санатта Молдо Нияз Алайдын атактуу ханышасы Курманжан датканын жеке адамдык трагедиясы жөнүндө баяндаган."},{"t":"p","h":"Орус бийлигинин келиши менен кыргыз жеринде тарыхый бурулуштар болгону, ошон- ДОЙ эле уруучулдук-патриархалдык тартип жол-жобо менен жашаган коомдо (в обществе, где жили родово-патриархальными порядками), күтүлбөгөн кайгылуу окуялар (печальные события) болгону да талашсыз. Курманжан датка – ошондой оор тагдырга туш келген. Алымбектен кийин даткалык деелетко ээ болгон (имеющая достояние датки) Курманжан оз уулдарынын бири Сибирге айдалып, бири Афганистанга качып, бири орус падышачылыгынын колунан курман болуп жатса да, ушундай тагдырдын мүшкүлүнө карабастан, ал орус бийлиги менен элдешүүгө барат."},{"t":"p","h":"өзгөчөлөнүп тур."},{"t":"p","h":"ганы – то, что выделяется, обособляется жеке адамдык -"},{"t":"p","h":"личная человеческая тарыхый буру-"},{"t":"p","h":"луштар болгону – произошли исторические повороты күтүлбөгөн – не-"},{"t":"p","h":"ожиданные талашсыз – бес-"},{"t":"p","h":"спорно"},{"t":"p","h":"мушкулуне – на"},{"t":"p","h":"трудности элдешууге – на при-"},{"t":"p","h":"мирение"},{"t":"p","h":"<span class=\"pg\" data-n=\"61\">61<\/span>Албетте, бул Курманжан үчүн өтө оор эле, бирок ал элдин тынчтыгы үчүн, бөөдө кырсыкха кабылбашы учун орус бийлиги менен жарашууга аргасыз болчу. Мындай чечим кабыл алуу Курманжан үчүн оңой болгон эмес, Акын Молдо Нияз Курманжан датканын энелик оор кайгысын, эл алдында милдетин, аткарган патриоттук күрөшүн бир кыйла таасирлүү сүрөттөгөн."},{"t":"p","h":"Убакыт өткөн сайын Курманжандын ысымы санжырага айланып, биздин күндөргө чейин жетти. Анын улуу иштерин эл унуткан бөөдө кырсыкка"},{"t":"p","h":"кабылбашы үчүн – чтобы не пострадать жарашууга арга-"},{"t":"p","h":"сыз болчу – была вынуждена ми-"},{"t":"p","h":"бир кыйла таасир-"},{"t":"p","h":"лүү – очень влиятельно"},{"t":"p","h":"жок. Укум-тукуму анын даңкын өчүргөн жок, Курманжан датканын элеси элдин жүрөгүндө сакталып кала берет. Бишкек шаарында Курманжан даткага эстелик тургузулган."},{"t":"p","h":"Молдо Нияздын «Курбанжан датка» чыгармасы да – «Алай ха. нышасына» тургузулган эстеликтердин бири."},{"t":"p","h":"Тапшырмалар:"},{"t":"p","h":"1. Молдо Нияздын өмүр жолу жана чыгармачылыгы жөнүндө сүйлөп"},{"t":"p","h":"бергиле. Ал үчүн төмөнкү суроолорго жооп бергиле: Молдо Нияз ким болгон? Ал качан жана кайсы жерде туулган? Ал кайсы жерден билим алган жана билимин кандай пайдалаигаи? Кайсы тилдерди билген? Ал кандай баалуу сапаттарга ээ адам болгон экен? Молдо Нияздын чыгармалары кайсы формада жазылган, кандай темаларды чагылдырган?"},{"t":"p","h":"2. Академик Болот Юнусалиевдин Молдо Нияз жөнүндө жазган мака-"},{"t":"p","h":"ласынын аталышы кандай? Ал макаладан алынган үзүндү боюнча сүйлөп бергиле."},{"t":"p","h":"З. Молдо Нияздын «Курбанжан датка» чыгармасы жөнүндө сүйлөп"},{"t":"p","h":"бергиле."},{"t":"p","h":"4. Чыгармадагы башкы каарманды Молдо Нияз эмне үчүн «Курбан-"},{"t":"p","h":"жан» деп атаганын түшүндүргүлө."},{"t":"p","h":"5. Курманжан датканы «Курбанжан датка» санаты жөнүндө","b":34},{"title":"МОЛДО НИЯЗДЫН ҮЧҮНЧҮ КОЛКИТЕБИНДЕГИ «КУРБАНЖАН ДАТКА» САНАТЫНАН","b":67},{"title":"Жан күйдүргөн балдарың","b":83}],"section":"КЫРГЫЗ АКЫНДАРЫНЫН ПОЭЗИЯСЫНАН","pages":[58,64]},{"title":"Замана акындары жөнүндө алгачкы сөз","blocks":[{"t":"h3","h":"Замана акындары жөнүндө алгачкы сөз"},{"t":"p","h":"Замана акындары деп Молдо Ниязды, Ка. лыгулду, Арстанбекти, Молдо Кылычты атасак болот. Себеби, алар өз заманы жөнүндө айтып, бул дүйнө убактылуу, сөзсүз кыямат-кайым болот деген ой-пикирлерин (мнения) билдиришкен. Бай-болуштардын үстөмдүгү, зордук-зомбулугу, бей-бечаралардын оор турмушу жөнүндө (о тёжелой жизни бедняков) заман темасында айтышкан. Элдин баркы, наркы кетти деп (что теряются ценности, уходят в прошлое) кейип, бул акындар өз эли-жери учун күйүп, кабатыр болушкан. Өз заманындагы өзгөрүштөрдү байкап, ал окуяларды сын көз караш (критический взгляд) менен баалашкан."},{"t":"p","h":"Замана акындары эл арасындагы каадасалттын, нурктун азайганына (что среди людей всё меньше соблюдаются родовые, племенные обычаи} кейишет, адилетсиз заманда жашаган элдин оор турмушун баяндашат. Алар турмушту жакшыртууга чакырышат."},{"t":"p","h":"Эстегиле! Тааныш сөздөр:"},{"t":"p","h":"кыямат-кайым -"},{"t":"p","h":"судный день, страшный суд, светопреставление үстөмдүк —превос-"},{"t":"p","h":"ходство, господство"},{"t":"p","h":"кейип – горюя, огор-"},{"t":"p","h":"чаясь, сетуя кабатыр – страх,"},{"t":"p","h":"беспокойство өзгөрүш – измене-"},{"t":"p","h":"ние, премены"},{"t":"p","h":"турмушту жакшыр-"},{"t":"p","h":"туу – улучшить жизнь"},{"t":"p","h":"зордук – зомбулук – иасилие, принуждение (7-кл., 27-б. Калык Акыев"},{"t":"p","h":"жөнүндөгү тексттен: Манаптардын зомбулугунан жер оодарып, Кетмен- Төбөгө кетет."},{"t":"p","h":"9.кл., 35-б. «Чынкожо, Толтойдун зордугу. Чүрөктүн учушу») вдилетсиз – несправедливый (6-кл., 56-б, Токтогул Сатылганов + Жетимдер"},{"t":"p","h":"жөнүндө»: Адилетсиз турмуш ай,"},{"t":"v","l":["Өз колунда жок болсо,","Бечаралык ушундай."]},{"t":"p","h":"7-кл., 24-б. Т. Сатылгановдун «Санат-иасыят», «Үлгү ырлары»: Акын бул"},{"t":"p","h":"чыгармаларында жаштарды эмгекке, ынтымакка, адептүүлүккө, бири-бирин сыйлоого үндөгөн, адилетсиздиктен, жаман адаттан, жалкоолук. тан алыс болууга чакырган.)"},{"t":"p","h":"Тапшырма:"},{"t":"p","h":"Профессор К. К. Юдахин түзгөн «Кыргызча-орусча сөздүктөн» алын-"},{"t":"p","h":"ган «замана» деген сөздүн түшүндүрмөсүн окуп чыккыла, айтып бергиле:"},{"t":"p","h":"<span class=\"pg\" data-n=\"65\">65<\/span>замана – 1, время, эпоха; жаңы замаи – новое время, нопые времена;"},{"t":"p","h":"азыркы заман – современность, наше время;"},{"t":"p","h":"2. лит, заманы – литературный жанр дореволюционной поэзии; корот-"},{"t":"p","h":"кие бессюжетные произведения, выражающие отношение акына к сопременности; в большинстве заманов пыражается недовольство"},{"t":"p","h":"забвением требований ислама, разрушением устоен патриархально-феодального общества; есть много стихов, порицаюцих леность, воровство, пьянство, междуродовые распри, алчность богачей и властителей, жадность и развратность служителей культа. И наряду с этим восхваляющих труд, доблесть, честность, призыпающих перенимать у русских формы хозяйства, сеять хлеб, разводить сады и т.п.; у разных акынов название варьируется; акыр заман – тяжёлое время. конец мира, зар заман – эпоха скорби, тар заман – трудное время, замана – времена, эпоха."},{"t":"p","h":"(«Кыргызча-орусча сөздүктөн» – түзгөн профессор К. К. Юдахин."}],"sub":[],"section":"КЫРГЫЗ АКЫНДАРЫНЫН ПОЭЗИЯСЫНАН","pages":[65,65]},{"title":"КАЛЫГУЛ БАЙ УУЛУ","blocks":[{"t":"h3","h":"КАЛЫГУЛ БАЙ УУЛУ"},{"t":"p","h":"«Калыгул акын кыргыз акындарынын атасы эсептелет. Андан мурунку эл-журтка маалим, ырлары сакталбаган биринчи кыргыз акынын уга албадык»."},{"t":"p","h":"{Сагымбай Орозбак уулу)"},{"t":"img","src":"data:image/webp;base64,UklGRhYVAABXRUJQVlA4IAoVAADQnACdASr0ADUBPq1Mn0mmJKMmsLVMSNAViWkA2ArJ/uRsrjTxbooPPzjj3MuId7zx7v/Pj6VKsq7HR адамдын начар жүрүм-турумун сындаган, жаштарды ынтымакка, адептүүлүккө чакырган саптары да арбын. Калыгулдун «көзү ачык» даанышман болгону тууралуу Тоголок Молдо, Сагынбай Орозбаков айтышкан. Ал жөнүндө 1940-жылы Ыбырай Абдыракманов: «Калыгул чыгарган ырларын обонго салбай, жөн эле маселдентип айтып берген. Ал кезде ыр-"},{"t":"p","h":"5."},{"t":"p","h":"<span class=\"pg\" data-n=\"66\">66<\/span>ларын обонго салып, комузга кошуп ырдагандарды(тех, кто поет с мелодией на комузе) еырчы» дешкен. Ал эми Калыгул болсо, чечендик искусствосунун өкүлү катарында өзүнүн терең образдуу санат, накыл, макал-лакап иретиндеги сөздөрүнө философиялык маани киргизип, даанышмандык көрк бергендиктен, аны «акын» аташкан. Анын үстүнө анын манаптык даражасы да ырдап отурууга, же комуз кармоого жол бербеген»,— деп жазган."},{"t":"p","h":"Калыгул олуя өзүнүн калыстыгы, даанышмандыгы менен эл арасында чоң кадыр-баркка жетишкен, Атак-даңкы алыска тараган Калыгулга көпчүлүк эл ар кандай доолор менен келип, акыл-кеңеш сурашкан. Олуя алардын доосун туура, калыс чечип, «кара кылды как жарган» калыс болгон."},{"t":"p","h":"_Калыгул Бай уулу 1855-жылы Ак-Суу деген жерде дүйнөдөн кайткан."},{"t":"v","l":["нускоочу – певец-импровизатор, слагающий назидательные песни","сынчыл көз караш – критический взгляд","сезим-туюм – интуиция","терт тулугу тугел – в достатке, жить зажиточно","акыр заман идеясы – идея конца света","«олуя», «көзү ачык» – святой, провидец","обонго салбай – не положив на мелодию","чечендик – красноречивость, ораторство","даанышмандык көрк – мудрость, философский вид","манаптык даража – положение манапа","Эстегиле! Тааныш сөздөр:"]},{"t":"p","h":"сөз устаты – мастер слова (7-кл., 27-б. Калык Акыев: Калык Акыев кыргыз"},{"t":"p","h":"журтчулугуна чебер комузчу, көөдөнүнөн ыр төгүлгөн көркөм сөздүн устаты катары белгилүү.) адилетсиздик – несправедливость (8-кл., 131-б. Чыңгыз Айтматовдуин «Сл."},{"t":"p","h":"манчынын жолу» повести жөнүндө: Ал эми Толгонай тылда өз эмгеги, көтөрүмдүүлүгү сторду айта билген,","Анын чыгармаларынын ичинен «Тар заман» деген поэмасы эң","көлөмдүү. „Тар заман» поэмасы Калыгул Бай уулунун «Акыр заман»","поэмасы менен багыты жагынан бирдей жана окшош."]},{"t":"p","h":"Бул поэмада Арстанбек Буйлаш уулу кыргыз элинин оор турмушу, кыйынчылыктары жөнүндө айтат. Тилекке каршы, бул поэма да акындын калган ырларындай эле бизге толугу менен жеткен жок."},{"t":"p","h":"Атасы Буйлашты ээрчип, Арстанбектин Анжыянга барышы акын-"},{"t":"v","l":["дын ырчылык чеберчилигинин жогорулашына, анын атак-даңкка ээ","болушуна комок көрсөтүп, кийинки тагдырына чоң таасир тийгизет.","Арстанбек Алымбек датканын жанында туруп, той-тамашаларга","көп катышат. Анжыян тегерегин бүт кыдырып, көп эл, көп жер","көрөт. Далай комузчу, ырчылар менен беттешип, аларды жеңет.","Арстанбек кыргыз элинин башынан өткөн бир нече оор окуяларды"]},{"t":"p","h":"<span class=\"pg\" data-n=\"69\">69<\/span>көрөт. Кокон хандыгынын үстөмдүгүн, бугу-сарыбагыш (названия племен) чабыштарын, орус падышачылыгынын Кыргызстанда жүргүзгөн колониялык саясатын көргөн. Ушундай тар замандагы карапайым кыргыз элинин оор турмушун ырларында чагылдырган."},{"t":"p","h":"Арстанбек Буйлаш уулу өз чыгармачылыгында сүйүү, арман, кошок ырларынан тартып, көлөмдүү чоң поэмаларды жараткан. Беш жүздөн ашуун күүлөрдү аткарган."},{"t":"v","l":["Акын 1882-жылы 42 жашында дүйнөдөн кайткан.","тар заман – трудное время","багыты жагынан -— по направлению","чеберчилик – мастерство","атак-даңкка ээ болушу – прославиться","далай – много, несколько","үстөмдүк – превосходство","","Эстегиле! Тааныш сөздөр:","чабыштар – столкновения","орус падышачылыгы – русский","царизм"]},{"t":"p","h":"колониялык саясат колонияпь-"},{"t":"p","h":"ная политика"},{"t":"p","h":"кенже эпостор – малые эпосы {7-кл., 7-б. «Элдик эпостор Эпостор"},{"t":"p","h":"көлөмү жагынан ири, кенже эпос болуп экиге бөлүнөт.) кыдырып – побывать, бродить в поисках, обходить (9-кл., 59-б. Молдо Нияз:"},{"t":"p","h":"Молдо Нияа Кашкар шаарындагы медреседен билим алган. Ал Арка, Анжиянга, а түгүл кытайлык кыргыздарга чейин кыдырып чыккан.) тагдыр – судьба (9.кл., 62.6. Молдо Нияздын «Курбанжан датка поэмасы:"},{"t":"p","h":"Алымбектен кийин даткалык дөөлөткө ээ болгон Курманжан өз уулдарынын бири Сибирге айдалып, бири Афганистанга качып, бири орус падышачылыгынын колуңан курман болуй жатса ди, ушундай тагдырдын мүшкүлүнө карабастан ал орус бийлиги менен элдешүүгө барат.) таасир – влияние (9.кл.. 4.6. «Манас» эпосу жөнүндө жалпы маалымат:"},{"t":"p","h":"*Манасты» айтуучу акындар менен жомокчулар айылдан-айыл кыдырып, «Манас, айтуу аркылуу элдин жүрөгүнө чоң таасир берип, баскынчыларды жек көргөзүү сезимии"},{"t":"h3","h":"«Тар заман» чыгармасы жөнүндө"},{"t":"p","h":"Арстанбек «Тар заман» поэмасын 1860-жылдарда чыгарган. Бул поэмасын кийинки 15-20 жыл ичинде эл алдында үзбөй ырдап жүргөн,"},{"t":"p","h":"Ошондуктан Арстанбек «Тар заманын» улам өзгөртүп, оңдоп, анын көркөмдүгүн арттыра берген. Кыргыз элинин башынан өткөргөн тарыхый окуялары элдин социалдык абалына таасирин тийгизип, эл жакыр турмушта, кыйынчылыкта жашаган. Кокон хандары кыргыздарга бийлик кылып, зордук-зомбулук көргөзгөн. Кыргыздардын сарыбагыш, бугу уруулары өз ара урушуп турушкан. Казактын Кенесары ханы да кыргыздарга чабуул жасап, элди кырган. Орус падышасы да кыргыз жетар заман – трудное"},{"t":"p","h":"время"},{"t":"p","h":"үзбөй – непрерыв-"},{"t":"p","h":"но, не переставая"},{"t":"p","h":"арттыра берген —"},{"t":"p","h":"увеличивал <span class=\"pg\" data-n=\"70\">70<\/span>ринде өзүнүн колониялык саясатын кучоткон, элдин туш-тараптан көргөн запкысы акындын жүрөгүн ооруткан, Акын бул поэмасында кыргыздардын уруу баштаган кан, баатырлары ынтымакка келип, күчтөрүн бирге жыйнап, бул күчтүү жоого каршы турса экен деген ойду айткан. «Тар заман» поэмасында Арстанбек замандын түрүн чебердик менен мүнөздөйт. Эл мал-жандан, баштан, жер-суусунан айрылат деп айтат, Элдин таалайсыз келечегине кейийт. Эстегиле! Тааныш сөз:"},{"t":"p","h":"запкы – унижение,"},{"t":"p","h":"притеснение, оскорбление күчтүү жоого кар-"},{"t":"p","h":"шы тур – стоять против сильного врага айрылат – лишится"},{"t":"p","h":"түр – вид, облик (9-кл., 9-б. Сагымбай Орозбак уулу: «Балам, айтышың"},{"t":"p","h":"жакшы экен, кыймыл-аракетке кедей экенсиц. Жомокту айтып жаткан учурда, окуянын мазмунуна карай, түрүңдү, түсүңдү өзгөртүп, колуң менен түрдүү ишараттарды жасап айтсаң, жакшы болот+,- дегеи экен.)"},{"t":"h3","h":"ТАР ЗАМАН"},{"t":"v","l":["Байыркы бала жаш чакта,","Кызыл өңүм ток чакта,","Кыл сакалым жок чакта,","Карылардан көп уктук.","Уламадан сөз уктук."]},{"t":"p","h":"кызыл өңүм ток чакта – когда был бес-"},{"t":"p","h":"печным кыл сакалым жок чакта – здесь: был"},{"t":"p","h":"ещё молодым"},{"t":"p","h":"Тар замандын келиши кайсы мезгилде белгилуц болгон? Ошондо өңү сары, көзү көк,"},{"t":"v","l":["Орус чыгат дечи экен,","Кыска чөптүн баарысын","Коруп чыгат дечү экен.","Ай-ааламдын баарысын","Соруп чыгат дечү экен,","коруп чыгат – здесь: присвоит себе","соруп чыгат дечү – все приберет к","своим рукам"]},{"t":"p","h":"Тар замандын белгилерин кайсы саптардан билсек болот? Улуу суунун баарысы"},{"t":"v","l":["Чулук болот дечи эле.","Кичи атанын баарысы","Улук болот дечи эле,","Жаан-чачын азайып","Шамал болот дечи эле,","Адамзаттын билгени,","Амал болот дечи эле.","Кыш көбөйүп жылынан","Жай азаят дечү эле.","Короодогу айдаган","Кой азаят дечү эле.","Журтта ургаачы көбөйүп","","то","чулук болот – будет водоворот","","жаан-чачын – осадки","","ургаачы – женщины","<span class=\"pg\" data-n=\"71\">71<\/span>Бой азаят дечи эле.","Ошол орус чыкканда","Төгөрөктөп урдурган","Коргон чыгат дечи эле.","бой – мужчина","азаят – станет меньше"]},{"t":"p","h":"Айтылган окуялар орис элинин келиши менен байланыштуубу? Акча, теңге түгөнүп,"},{"t":"v","l":["Тыйын чыгат дечү эле,","Атасынан баласы","Кыйын чыгат дечү эле.","Калаа-коргон көбөйүп,"]},{"t":"p","h":"Кент түгөнөт дечү эле. кент— пункт оседлости, селение Тегеректин баарысын"},{"t":"v","l":["  өсүшү.","3} Түштүктө Алымбек датканын жанында жүрүшү."]},{"t":"p","h":"А) Тарыхый окуялардын акындын «Тар замаи» поэмасынын жара."},{"t":"p","h":"дуусуна шарт түзүшү."},{"t":"p","h":"2. «Тар замано поэмасынын багыты жөнүндө сөз кылуу үчүн төмөнкү суроолорго жооп бергиле:"},{"t":"p","h":"1) «Тар заманда» айтылган жат көрүнүштөрдүн болушу падышалык"},{"t":"p","h":"Россияга гана тиешелүүбү?"},{"t":"p","h":"2) Арстанбектин атуулдук ар-намыстуулугунан үлгү алууга болобу? З) Калың элди эзүүчүлөргө каршы күрөшкө чакыруу идеясы кайсы"},{"t":"p","h":"саптардан көрүнөт?"},{"t":"p","h":"4) Акындын айтканы боюнча анын заманы эмне үчүн тар заман"},{"t":"p","h":"болгон?"},{"t":"p","h":"8. «Тар замандагы» ырлар мезгил боюнча боло элек жана болуп жаткан окуялардын тогошуусунан куралган. Ошол үзүндүдөн кайсынысын боло элекке, кайсынысын болуп жатканга кошуу керек?"},{"t":"p","h":"1. Төмөнкү сөздөрдүн синонимдерин, антонимдерин таап, дептериңерге жазып алгыла: орус, чебер, тар заман, квлемдуц, амал, коргон, тозок, болуш, жер-сий."},{"t":"p","h":"5. Төмөнкү саптарда акын эмнени айткысы келген? «Заманын келди жакындап, тайган иттей такымдап, Устаранын мизиндей, оодарылган дүнүйө»,"},{"t":"v","l":["6. «Тар заман» поэмасынан төмөнкү үзүндүнү жаттагыла.","Карылардан кеп уктук,","Уламадан сөз уктук.","Ушу заман тар заман,"]},{"t":"p","h":"Азуулууга бар заман, азуулуу – хищник. зубастый, то есть богатый"},{"t":"raw","h":"<h4 class=\"mk\"><span class=\"pg\" data-n=\"73\">73<\/span>Бечарага зар заман. Заманың келди закымдап, Тайган иттей такымдап, Устаранын мизиндей, Оодарылган дүнүйө. Байыркыдан барк кетти, Каадалуу нуска, нарк кетти. Жардылардан барк кетти, Казда, нуска, нарк кетти. Эстегиле! Тааныш сөз:<\/h4>"},{"t":"p","h":"тайган ит – борзая собака; такымдап – на-"},{"t":"p","h":"ступая на пятки барк – ценность, значимость, достоинство,"},{"t":"p","h":"авторитет каадалуу нуска – знающий обычаи, пример,"},{"t":"p","h":"образец нарк – цена, стоимость: жарды – бедняк,"},{"t":"p","h":"беднота"},{"t":"p","h":"бечара – бедняга (6-кл., 56-6. Токтогул Сатылганов «Жетимдер жөнүндө»:"},{"t":"p","h":"Сурап койбойт эч бир жан"},{"t":"v","l":["Бечара жетим сен ким деп...","Адилетсиз турмуш ай,","Өз колунда жок болсо,"]},{"t":"h3","h":"бечаралык ушундай.)"}],"sub":[{"title":"«Тар заман» чыгармасы жөнүндө","b":19},{"title":"ТАР ЗАМАН","b":32}],"section":"КЫРГЫЗ АКЫНДАРЫНЫН ПОЭЗИЯСЫНАН","pages":[69,73]},{"title":"МОЛДО КЫЛЫЧ ШАМЫРКАН УУЛУ","blocks":[{"t":"h3","h":"МОЛДО КЫЛЫЧ ШАМЫРКАН УУЛУ"},{"t":"p","h":"Молдо Кылыч Шамыркан уулу – кыргыздын тунгуч жазма акыны, эл ырчысы. Ал 1866.жылы Кочкор өрөөнүндө туулган. Анын атасы Шамыркан Торогелди уулу тың чыгып, эл бийлөөчүлөрдүн өкүлү болгон. Ал Кылыч беш жашка келгенде дүйнөдөн кайтат. Кылыч Жумгалдык чала молдо Баян дегенден арабча кат тааныйт. Кийинчерээк Чүйдөгү Мамбетаалыдан, Акмолдодон сабак алат. Токмоктогу Закир калпадан окуп, казак, татар тилдеринде чыккан гезит-журналдарды окуй баштайт. Сабатсыздыгы жоюлуп, Молдо Кылыч атка конот."},{"t":"p","h":"Молдо Кылычтын ырларынын көпчүлүгү диний темада экенинин себеби (причина) да ушундан улам болуу керек. Анын ырлары элдижерди даңазалайт. Ошондой эле ал эски коомдогу уруулук (уруулук – родовой, племенной) көз караштарды колдогон ырларды да жазган. Молдо Кылыч өзү манап тукумунан болсо да, эл бийлегенге катышкан эмес. Бийлик камчысын колго албай, башкача жашап, эл турмушуна аралашкан."},{"t":"p","h":"Анын «Зар заман» поэмасы – эң көлөмдүү чыгармасы. Кылыч Шамыркан уулу «Чүй баяны», «Зилзала», «Керме тоо», «Кинди суу+, «Алдамчы», «Кыз-жигит» жана башка чыгармаларды жазган.«Зар заман» поэмасы санат түрүндө жазылган. Белгилүү адабиятчы жана окумуштуу Ш.Үмөталиев белгилегендей, Кылычты далай жылга унутта калтырууга шылтоо болгон маселе – чыгармаларындагы «орус» темасы. Молдо Кылычтын орустарга болгон мамилесин, көз карашын эки мезгилге: алгачкы жана кийинки мезгилге бөлүүгө болот. Эгерде алгачкы мезгилде акынга толгонуу, чочуркоо, шектенүү, <span class=\"pg\" data-n=\"74\">74<\/span>жек көрүү мүнөздүү болсо, кийинчерээк Кылычтын көз карашында белгилүү оң өзгөрүүлөр пайда болот."},{"t":"p","h":"Эгерде алгачкы мезгилде акын «ислам динин орустар булгап коёт го»,— деп коркуп (боясь, что русские испортят ислам), патриархалдык-феодалдык мамилелердин акырындык менен ыдырай башташын (постепенный развал патриархально-феодальных отношений) орустардан деп аларды жек көрсө, кийинчерээк Чүйдөгү жаңы өзгөрүүлөрдү, чарбадагы жаңылыктарды орус алып келгенин ачык эле айтат, Буга анын «Чүй баяны» аттуу поэмасы айкын далил."},{"t":"p","h":"Молдо Кылыч Шамыркан уулу 1917-жылы каза болгон. эл бийлөөчүлөрдүн өкүлү – пред-"},{"t":"p","h":"ставитель правящих чала молдо – попуграмотный молдо калпа – наставник медресе диний темада – на религиозную тему манап тукумунан – из рода манапов унутта калтыруу – забыть"},{"t":"v","l":["Эстегиле! Тааныш сөздөр:","шылтоо болгон маселе – проблема,","которое послужила поводом","толгонуу – волнение","чочуркоо – опасение","шектенүү – недоверие; жек көрүү —","ненависть","айкын далил- явное доказательство"]},{"t":"p","h":"көз караш – пзгляд (9-кл., 68.6. Калыгул Бай уулу: Элдин арасындагы"},{"t":"p","h":"адилетсиздик, адепсиздик көрүнүштөрдү сын коз караш менен кара. ган.)өзгөрүүлөр – изменения, перемены (8-кл., 106-б. «Чүй баяны»: -..кийиичерээк Чүй боорундагы жаңы өзгөрүүлөрдү, чарбадагы жанылыктарды орустар алып келгенин айтат."},{"t":"p","h":"Э-кл., 67.6. «Замана акындары жөнүндо алгачкы сөздөн»: Өз заманындагы өзгөрүштөрдү байкап, ал окуяларды сын көз караш менен баалашкан.)"}],"sub":[],"section":"КЫРГЫЗ АКЫНДАРЫНЫН ПОЭЗИЯСЫНАН","pages":[74,74]},{"title":"«Зар заман» поэмасы жөнүндө","blocks":[{"t":"h3","h":"«Зар заман» поэмасы жөнүндө"},{"t":"v","l":["Кыргыз жазма адабиятынын көрүнүктүү","өкүлү Молдо Кылыч Шамыркан уулунун «Зар","заман» поэмасы эл арасында кол жазма түрүндө"]},{"t":"p","h":"да, оозеки түрүндө да кеңири таралган. Калыгулдун «Акыр заман», Арстанбектин «Тар заман» поэмалары сыяктуу эле Молдо Кылычтын «Зар заман» поэмасы акындын өз зама-"},{"t":"v","l":["нынын өзгөчөлүктөрүнө, коомдук-социалдык","абалына карата мамилесин, ой-пикирлерин","чагылдырат. Ошол мезгилдеги адамдардын"]},{"t":"p","h":"кылык-жоругуна, жаш муундардын келечек жашоосуна ой жүгүртүп, ошол кездин курч маселеси – кыргыздар менен орус элинин өз ара байланыш мамилелери жөнүндөгү ой толгоолорун билдирет."},{"t":"p","h":"Элди эмгектенип, жашоо-турмушту жакшыртууга, бири-бирине кайрымдуу болууга, кылык-жорук – по-"},{"t":"p","h":"ведение курч маселе -"},{"t":"p","h":"острая проблема ой толгоо – зрею-"},{"t":"p","h":"щая мысль <span class=\"pg\" data-n=\"75\">75<\/span>эл бийлеген бийлерди эл-журт учун адилеттуу, калыс болууга чакырат. Жарашыктуу замандын адамдары жана ал заманды даназалаган акындары кандай болуу керектигин көрсөтөт."},{"t":"p","h":"жарашыктуу -"},{"t":"p","h":"приятный, правильный даңазалаган – про-"},{"t":"p","h":"славляющий"},{"t":"p","h":"ЗАР ЗАМАН зар заман – эпоха скорби Зар замандын казалы"},{"t":"v","l":["Калем алып жазалы.","Жену жокту жаздың деп","Кудайым кылба жазаны.","Молдо Кылыч мен атым,","Болжолу жок санатым.","Чаар китептен аз окуп,","Чала чыккан сабатым.","Санаадагы сөзүңдөн,","Чыгаар сөзүм орундуу.","казал – название произведений поэтов —","письменников","жаза – син.: айып; наказание","чаар китеп-испещрённая. исписанная","книга"]},{"t":"p","h":"чала сабат – малограмотный, полугра-"},{"t":"v","l":["мотный","санаа – мысль, дума, намерение","чыгаар сөз – слова, которые собираюсь","сказать","Акын өзү жөнинде эмнелерди баяндады?","Жигит болсоң абайла,","Убал кылба жаныңа,","Тазалагын жолуңду","Тарта жүргүн колуңду.","Жаман адам курусун,","Доо чыгарып бир жерден,","Милдет кылаар жумушун.","Жакшыларды карасаң","Кылганынын доосу жок,","Сыр билгизбейт тымызын,","убал – ущерб, урон","","куру – пропади: курусун – пусть пропадет","доо чыгарып – иск подавая, затевая тяжбу","","доосу жок – без претензий","тымызын – этихую","Жаман менен жакшынын айырмасы эмнеде?","Мен сүйлөйүн канчан рдай.","зекети жок – без напога со скота","","акыр – ир. ясли (для скота)"]},{"t":"p","h":"жигери бар – храбрый, смелый, самоот-"},{"t":"p","h":"верженный Санаттагы азамат кандай сапаттарга ээ?"},{"t":"p","h":"<span class=\"pg\" data-n=\"77\">77<\/span>Тилим шыдыр, түздүгү – зым карагай жолундай. Баары сонун тийимдүү, бардеңкенин огундай. Язык мой гладок, его стройиость подобна телеграфной линии, всб в иём попадает в цель, будто пуля винтовки, (Кыргызско-русский словарь. К.К.Юдахин. – Б. «Шам»,"},{"t":"p","h":"Эстегиле! Тааныш сөздөр:"},{"t":"p","h":"далай – много, неисчислимо (9-кл., 71-б. Арстанбек Буйлаш уулу жөнүндө: Арстанбек Алымбек датканын жанында туруп, той-тамашаларга көп катышат, Далай комузчу, ырчылар менен беттешип, аларды жеңет.) Асан кайгы – Асан-горемыка (персонаж казахских и кыргызских сказок, искатель правды} (Т-кл., 88-6. К.Жусуповдун «Ыр сабындагы өмүр» эссесинен: Акындын оксугонун туура түшүнөлү. Акын адамзатты жек көрүп айткан жери жок, кайра адамзаттын өмүрү, асылдыгы учун асанкайгы тартып жатпайбы!) бул – южн.; пул – деньги (9-кл,,64-6. Молдо Нияздын «Курбанжан датка» санатынан:"},{"t":"v","l":["Казынана батпаган","Пулундун көбүн айтамын.)","","Тапшырмалар:"]},{"t":"p","h":"1. Молдо Кылыч Шамыркан уулунун өмүрү жана чыгармачылыгы жонүндо баяндап берүү үчүн төмөнкү суроолорго жооп издегиле:"},{"t":"p","h":"1) Молдо Кылыч качан, кайсы жерде, кимдин үй-бүлөсүндө төрөлгөн?"},{"t":"p","h":"2) Ал байдын уулу болсо да, эмне үчүн эл бийлегенге катышкан эмес? З) Бул акын эмне себептен Молдо атка конгон? Дагы кайсы акын-"},{"t":"p","h":"дардын аттары «молдо» деген ат менен кошо айтылат?"},{"t":"p","h":"4) Акынды эмне үчүн далай жылга унутта калтырышкан?"},{"t":"p","h":"2. Молдо Кылыч Шамыркан уулунун «Зар замане поэмасынан үзүндү тандап жаттагыла."},{"t":"p","h":"3. «Акыр заман», «Зар заман» жана «Тар заман» чыгармаларын Венндин диаграммасы боюнча салыштыргыла. Диаграмманы түзүүдө төмөнкү суроолорго жооп издегиле:"},{"t":"p","h":"1) Бул чыгармалардын о t":"p","h":"Биздин элибиз Токтогулду бекеринен «Тоо булбулу Токтогуль, «Асыл Током», «Кайран Током» деп айтышпаса керек."},{"t":"p","h":"Бул эпитеттер Т. Сатылгановдун акындык өнөрүнүн мыктылыгын, адамдык сапатынын жогорулугун (высокие человеческие качества), өмүрүнүн армандуу учурларынын бар экенин белгилеп турат."},{"t":"p","h":"<span class=\"pg\" data-n=\"79\">79<\/span>Анын алыскы Сибирь жеринде сүргүндө жүрүп да комузун колунан түшүрбөй, эли-жерин сагынып жараткан ыр-күүлөрү, өз жерине жөө-жалаңдап отуруп кайра келиши, кайратынан жанбай өмүрүнүн аягына чейин шакирттерине өз өнөрүн үйрөткөнү акындын өзгөчөлүгүн айгинелейт."},{"t":"p","h":"Токтогул Керимбай манаптын ырчысы Арзыматтан баштап отузга жакын акын менен айтышкан. Алардын арасында Эшмамбет, Калык, Алымкул, Барпы жана башкалар бар. Акын «Манас» эпосун,"},{"t":"p","h":"«Курманбек», «Шырдакбек», «Саринжи-Бөкөй» жана башка дастандарды айткан,"},{"t":"p","h":"Токтогул Сатылганов 1933-жылы 17-февралда Саз-Жийдеде 69 жаш кезинде дүйнөдөн кайткан."},{"t":"v","l":["аттын кашкасындай таанымал – известный","куйкум сөздүү – острое слово","чөлкөм – окрестность","чейре – среда","толкун жөнүндө – о волнениях","билдирүү жиберет – отправит сообщение","суракка алынат – был допрошен","өлүм жазасы – смертный приговор","өкүм чыгарат – приговорит","ар кандай көлөмдөгү – разного объёма","кеңири тараган – широко распространённые"]},{"t":"p","h":"аспаптык 250 күүсү жана обону – 250 инструментальных мелодий и кюи бекеринен айтышпаса керек – не спроста говорят"},{"t":"v","l":["Керимбай манаптын ырчысы – певец Керимбай манапа","баштап – начиная","айтышкан – соревновался в импровизации","жее-жаландап – пешком","кайратынан жанбай – не теряя решимость","акындын өзгөчөлүгү – особенность поэта","айгинелейт – доказывает"]},{"t":"p","h":"акындык өнөрүнүн мыктылыгын – уровень поэтического мастерства армандуу учур – горестные моменты"},{"t":"p","h":"Эстегиле! Тааныш сөздор:"},{"t":"p","h":"жамактатып ырдоо- импровизировать (7-кл., 4-6, «Жарамазан айтуу»: Орто"},{"t":"p","h":"Азия элдеринин ичинде кыргыздарда гана жамактатып ырдоо өнөрү – жарамазан айтуу кездешет."},{"t":"p","h":"куудул – имитатор, комик (7-кл., 20-б.Токтогул Сатылганов жөнүндө: Атасы"},{"t":"p","h":"Сатылган жамактатып ырдай койгон куудул киши болгон.)"},{"t":"p","h":"«Дүнүйө» ыры жөнүндө «Дүнүйө» – бул байлыкты, чоң чентектуунү даңазалаган ыр эмес, тирүүчүлүктүн, жашоонун даңкталышы. Бирөөнү алдабай, чыныгы мээнет менен жашасаң, ошол – чыныгы дүнүйө, Көзүң көрүп, жаркырап турган дүнүйө – богатство."},{"t":"p","h":"блага жизни чоң чөнтөктүү – с"},{"t":"p","h":"толстым кошельком: тируучулукту даңкта – прославпяй жизнь <span class=\"pg\" data-n=\"80\">80<\/span>дүйнө – бул бейиш, бул бак-таалай, бул адамдын келкели."},{"t":"p","h":"Кеткен дүйнө – тозок, бул талкалануу, өчүү, өлүү, жок болуу. Ошондуктан, бар болуп жашоо, ак пейилди жоготпоо: толукшуп чыккан айдай, мөмөлүү дарак шактай, асмандагы күндөй, алтын така тулпардай."},{"t":"p","h":"Әгерде кишинин адамдык касиети өчсө, оюн арамдык бийлесе, ал рухий жактан өлөт, анан ал суу жүрбөгөн сайдай, капкагы сынган комуздай, кышкы чилде, муздай, таманы түшкөн чарыктай керексиз. Демек, ар бир тирүү пенденин алдында эки жол бар, бири – жарык дүйнө, экинчиси – караңгы дуйне.Акын ошол эки дуйно женунде айтат."},{"t":"p","h":"Дуйнонун-жашоонун тубуне эч ким жетпейт. Акын өмүргө келгендеги жашоону ай менен күнгө, мөмөлүү шакка, күчтүү төөгө, күлүк аргымакка, кушка, дайрага салыштырса, дүнүйө жоголгондо, өмүр бүткөндө какталган жерге, суусуз сайга, кайгыга, таманы түшкөн чарыкка, кышкы чилдеге салыштырат. Демек, «дүнүйөнү» – бул байлык эмес, «жашоонун жыргал керемети» катары карасак, жашоо келет жана кайра кетет деп сөз кылабыз, Жашоонун келгени канчалык жакшы болсо, жашоонун аякташы ошончолук өкүнүчтүү, жаман."},{"t":"p","h":"Эстегиле! Тааныш сөздөр:"},{"t":"p","h":"чыныгы мээнет менен – честным"},{"t":"p","h":"трудом бейиш – рай талкалануу – разру-"},{"t":"p","h":"шение ак пейил – добро-"},{"t" йин – после"},{"t":"p","h":"междоусобиц курал алып – во-"},{"t":"p","h":"оружившись жетери менен- как"},{"t":"p","h":"только дошли тизмедеги – в спи-"},{"t":"p","h":"сках туткундашкан -"},{"t":"p","h":"пленили, задержали коркунучтуу адам- дар – опасные"},{"t":"p","h":"люди ак жеринен – буду-"},{"t":"p","h":"чи невиновным жыйналып келген-—"},{"t":"p","h":"собравшимся ичтеги куйуту -"},{"t":"p","h":"свое горе, печаль, обида, досада <span class=\"pg\" data-n=\"85\">85<\/span>Эстегиле! Тааныш сөздөр:"},{"t":"p","h":"окумуштуу – ученый; (9-кл., 77-б. Молдо Кылыч Шамыркан уулу жөнүндө:"},{"t":"p","h":"Белгилүү адабиятчы жана окумуштуу Ш.Умоталиев белгилегендей, Кылычты далай жылга унутта калтырууга шылтоо болгон маселе чыгармаларындагы «орус» темасы.) эмгектери труды (9-кл.,54-6. Махмуд Кашгаринин «Диван лугат"},{"t":"p","h":"ат-түрк» чыгармасы жөнүндө: „Түрк тилдеринин соз жыйнагы» 1072-1077-жылдардын аралыгында жазылган энциклопедиялык эмгек.) жалган жалаа менен – по доносу, оговору, клевете {7-кл.‚ 21-6.Токтогул"},{"t":"p","h":"Сатылганов жөнүндө: Ошол үчүн байлар улуу акындан кутулуу максатында «Анжияига басып киргени жатышат» деген жалган жалаа менен аны Сибирге сүргүнгө айдатышат.)"}],"sub":[{"title":"ӨМҮР","b":44},{"title":"«Кош, апаке!«ыры жөнүндө","b":63}],"section":"КЫРГЫЗ АКЫНДАРЫНЫН ПОЭЗИЯСЫНАН","pages":[81,85]},{"title":"КОШ, АПАКЕ!","blocks":[{"t":"h3","h":"КОШ, АПАКЕ!"},{"t":"v","l":["Боздодуң, апа, боздодуң,","Кайгымды кайра козгодуң,","Кайрат кылсаң болбойбу,","Тирүүмдө жоктодуң...","ь","Карууң кетет, кейибе,","Кулак сал менин кебиме,","Ажалым жетип олбосом,","Карчыга куштай айланып,","Келээрмин кайра элиме!","боздодуң – горько плакала"]},{"t":"p","h":"кайгымды козгодуң – мою печаль раз-"},{"t":"p","h":"ворошипа тирүүмдө жоктодун – оплакиваешь ме-"},{"t":"v","l":["ня, пока я жив","карууң кетет – ослабишься: кейибе -","не горюй","кулак сал – послушай","карчыга куштай айланып – к ак ястреб","кружась","Акын кайда кетип бара жатат?","Айланайын апаке, айланайы ":"Таластан чыккан Жеңижок, Ак калпак кыргыз элинде, Таймашарга теңи жок. (нет равного в соревновании) Аксыдан чыккан Жеңижок,"},{"t":"v","l":["Ак калпак кыргыз элинде,","Айтышарга теңи жок","болгон улуу акын Жеңижок, өз аты Өтө Көкө","уулу өз доорунун белгилүү төкмөсү (известный","поэт-импровизатор своего времени) экен. Анын","ырлары баалуу жана кайталангыс ырлар. Улуу"]},{"t":"p","h":"акын Токтогул: «...Жеңижок ырдоо жагынан эч кимди алдына сал-"},{"t":"v","l":["ган эмес (никому не уступал)»,- деп бекеринен мойнуна албагандыр","(признавался не зря).","Кыргыз элинин ак тандай акыны Жеңижок (Өтө Көкө уулу)","1860-жылы Таласта Сары-Көбөн айылында туулган. Жеңижоктун","оз аты."]},{"t":"p","h":"<span class=\"pg\" data-n=\"87\">87<\/span>Өтө. Ал ата-энеден эрте ажырап калган, Уч бир тууган балдар томолой жетим калышкан."},{"t":"p","h":"Жетимчиликтин айынан эптеп жан багып (выживал как мог) жүргөн. Өтөнүн колуна жара чыгып, айыккан жерлери ала болуп калат."},{"t":"p","h":"Өтө мал айдаган соодагерлерге кошулуп, Аксыга таякелери тарапка жөнөйт. Анын энеси Алтынай Аксыдагы Кара-Суу айлынан болгон экен. Ал жерде Жеңижок айылдык молдодон окуган. Эл арасыпдагы жомокчу, ырчыларды ээрчип жүрүп, кунт коюп алардын төкмөлүк өнөрүн үйрөнгөн."},{"t":"p","h":"Бир күнү Нурмолдо деген белгилүү ырчы менен айтышып, жеңишке ээ болот. Көргөн эл таң калып угуп, «бул жеңи жок кемсел кийген жаш жигит Нурмолдону баш көтөргүс кылып жеңбедиби!» – деп сөз кылышат, Ошондон кийин акындын аты Жеңижок болуп калат."},{"t":"p","h":"Сынчы А. Токтогуловдун айтканы боюнча «Жеңижок тарбиялык мааниси терең, уккан элдин акылына уюй турган кептерди санаттап айткан чоң акын, калк алдында бетме-бет чыга келгенде эч кимден жеңилбеген айтыштын устаты, жамактатып ырдаганда чү деген жерден оозунан ыр куюлган (песня льётся изо рта, как только начнёт) төкмө, өз заманынын окуй билген, жаза билген билимдүү, түшүнүктүү адамы болгон»,"},{"t":"p","h":"Акын «Балалык», «Дүнүйө» деген ырларында кыргыз элинин наркын, салтын, а . Токтогулой эмне деп айтыптыр? Улуу акын Жеңижоктун жаштарга айткан акыл сөздөрүн кандайча түшүнөсүңөр?"},{"t":"p","h":"2. Жеңижок аккан сууга кандай мүнөздөмө бериптир? Акындын мезгилиндеги аккан суу менен биздин убактагы аккан суу силердин оюңарча бири-биринен айырмаланабы?"},{"t":"p","h":"З. «Аккан суу» деген сөз айкаштын синонимин тапкыла. Кыргызстандын чоң сууларын атагыла, Силер кайсы суулардын жээгинде болгонуңарды баяндап бергиле, Аккан суунун кооздугу, мааниси жөнүндө ойлоидуңар беле? Азыркы кезде жаратылыштагы аккаи сууну булгабай колдонуу жана аяр мамиле кылуу маселелери сага таанышпы?"},{"t":"p","h":"4. Берилген сөздүктүн жардамы менен «Аккан суу» ырынын текстин которгула. Ырды көркөм окугула,"},{"t":"v","l":["5. Жеңижок жөнүндө кошумча маалымат издеп, таап келгиле.","6. «Аккан суу» ырынын биринчи 16 сабын жаттап, айтып бергиле,"]},{"t":"p","h":"Т. Төмөнкү макал-лакаптардын маанисин чечмелеп бергиле: Суу менен жер көгөрөт, эл менен эр көгөрөт. Суу канык – эгиндин даны толук, Суусаганга сиу таттуу. Суу атасы – булак. сөз атасы – кулак."},{"t":"p","h":"«Жалгыз тал» ырынын жаралышы жөнүндө «Жалгыз тал менен сүйлөшүү (разговор с одинокой ивой)» деген ыры адамдын сезим дүйнөсүнүн тереңин аңтара (наизнанку) сүрөттөгөн кыргыз лирикасындагы эң алгачкы элегия болуп саналат."},{"t":"p","h":"Жеңижок жаш кезинде ооруп калган экен. Айылдын бийи Тазкара бий «Бул бала жугуштуу оору менен ооруйт»,- деп жигиттерине Өтөнү Кара – Буура суусуна салып, агызып сезим дуйнесунун"},{"t":"p","h":"тереңи – глубина мира чувств"},{"t":"p","h":"жугуштуу – зараз-"},{"t":"p","h":"ный"},{"t":"p","h":"агызып жиберуу —"},{"t":"p","h":"утопить. сплавить <span class=\"pg\" data-n=\"91\">91<\/span>жиберууге буйрук берет, Жигиттер жаш баланы өлтүргүсү келбей, качырып жиберишкен. Ошондо Өтө мал айдаган соодагерлерге кошулуп, Аксыга таякелери тарапка жөө жөнөп кеткени жөнүндө окуганбыз."},{"t":"p","h":"Качып бара жатып, Бакайыр деген жерде өскөн жалгыз талды көрүп, элин-жерин таштап жалгыз бар «Аккан суу», «Күн»,әАжал», «Шамал»өңдүү жана башка чыгармаларында материалисттик-атеисттик ой жүгүртүүлөр кездешет."},{"t":"p","h":"Барпы акын 1910-1915-жылдарда атактуу акындар Эшмамбет, Коргол, Жеңижок менен жолугушат. Айрыкча ага улуу акын Токтогул менен жолугушуу чоң таасир берет."},{"t":"p","h":"Анын ырларында таптык идеялар ачык көрүнө баштайт. Түштүктө Совет бийлигин түзүү жана чыңдоо иштерине ал активдүү катышкан, Ал жаңы замандагы ырларын элдин жакшы турмушуна арнап ырдаган. Улуу Ата Мекендик согуш мезгилинде жараткан ырларында душмандарды жеңүүгө, эли-жерин бошотууга чакырган."},{"t":"p","h":"Акын 1949-жылы 65 жашында дүйнөдөн кайткан."},{"t":"v","l":["томаяк кедей – бедняк","жалчылык менен күн көргөн – жил батрачеством","<span class=\"pg\" data-n=\"95\">95<\/span>бардар адамдар – зажиточные пюди","жокчулуктун запкысын тартып – терпел лишения","жеңгенден тартып – начиная с победы","арналган ырлар – посвященные песни","аёосуз жазалап – наказывая беспощадно"]},{"t":"p","h":"материалисттик-атеисттик ой жүгүртүүлөр – материалистически-атеистиче-"},{"t":"p","h":"ские мышления"},{"t":"v","l":["таптык идеялар – классовые идеи","түзүү жана чыңдоо – создать и укреплять"]}],"sub":[],"section":"КЫРГЫЗ АКЫНДАРЫНЫН ПОЭЗИЯСЫНАН","pages":[95,95]},{"title":"ЫНТЫМАКТУУ ӘЛ","blocks":[{"t":"h3","h":"ЫНТЫМАКТУУ ӘЛ"},{"t":"v","l":["Ынтымагы бар элдин,","Таалайы, багы ачылат.","Ынтымагы жок элдин,","Тапканы бекер чачылат.","Ынтымагы бар элдин,","Калага карды ток болот.","Ынтымагы жок элдин,","Бириге – бири октолот.","Ынтымагы бар элдин,","Адил болот улугу.","таалай, бак – счастье","","тапканы – собранное, накопленное;","бекер – зря","карды ток -— сытый","","октолот – настраивается против","улугу адил – их старший справедлив","","Ынтымактщу әл кандай сапаттарга ээ?","Ынтымагы жок элдин,","Ичинен чыгат бузугу.","Ынтымагы бар элдин","Кеңеш берет карысы.","Ынтымагы жок элдин","Тозуп качат баарысы.","Ынтымактуу эл болсо,","Душманга тиет, ок болот.","Ынтымаксыз эл болсо,","Дыркырап к p","h":"З. Төмөнкү сүйлөмдөрдү толуктап, дептериңерге жазып алгыла: Кыргыз ... залкар „бири – Барпы 1884- жылы Жалал – Абад „Сузак районунда „. деген кыштакта ... уй – булөсунде туулган. .. улиц Токтогулга -. барыл ‚андан -. алган."},{"t":"p","h":"4. Төмөнкү сөздөрдүн синонимдерин, антонимдерин таап, дептериңерге жазгыла: ынтымак, ырыс, бак-таалай, барк, адил, кары, кеңеш. бекер, дишман."},{"t":"p","h":"5. Төмөнкү макалдардын маанисин талкуулагыла, ынтымак, достук жөнүндө өзүңөр да макал-лакаптарды таап жазып келгиле: Ынтымак болбой, иш оңолбойт. Ынтымак бар жерде – ырыс бар. Ырыс алды – ынтымак. Ынтымак тубиу – ийгилик, тирилик тцбү – бир: дик. Дос куйдуруп айтат, душман суйдуруп айтат. Достук тар кыяда сыналат,"},{"t":"p","h":"«Мөлмөлүм» ыры жөнүндө Барпынын ашыктык лирикалык ырларынын бири."},{"t":"p","h":"Биринчи бөлүк – сулуунун сыпаты. Молмелумдун эки илеби кызыл гүл маңдай чачы – Маргалаңдын жибеги, серпилиши чынардын чырпыгындай, ыргалышы талдын кырчынындай, өтүмдүүлүгү Өзгөндүн күрүчүндөй, созулганы зергердин күмүшүндөй жан. Анан ага жигиттин «Башымды берем тартууга кедей деп менден качпагын» деген күчтүү өтүнүчү, сүйүү сезими, ашыктыгы ырдалат. Анан: «Чыныга куйган бал болсоң, чымындай ага малынсам, чыга албай жатып ошондо, чын өзүңө багын- 9в ашыктык лирика -"},{"t":"p","h":"пюбовная лирика сулуунун сыпаты -"},{"t":"p","h":"красота красавицы илеби – губы маңдай чачы – чел-"},{"t":"p","h":"ка талдын кырчынын-"},{"t":"p","h":"дай – как побеги деревьев зергер – ювелир башымды берем тар-"},{"t":"p","h":"тууга – отдам жизнь <span class=\"pg\" data-n=\"97\">97<\/span>сам, чыгарып койсоң боор ооруп, чырагың болуп жагылсам, алты оролуп мойнуңа, ак маржан болуп тагылсам» деп тиленет. Бул саптар- Барпынын талантын, суреткерлигин көрсөтөт. Андан ары ырда боз уландын окунучөтүнүч, арман-арзуу маанайы аралаш келет. Эстегиле! Тааныш сөздөр:"},{"t":"p","h":"чырагың болуп"},{"t":"p","h":"жагылсам – буду освещающим фонарем ак маржан – коралл"},{"t":"p","h":"сүрөткерлик – балаев 1888-жылы Сары езен Чуйдегу Чон-Далы айылында туулган. Атасы сөзгө уста киши болгон, уламыш, санжыра, жомокторду айта билген, энеси да акындын талантына чоң көмөк берген жомокчу, ырчы болгон."},{"t":"p","h":"Анын акындык шыгынын ойгонушуна, талантынын курчушуна элдик оозеки чыгармалар, белгилүү ырчылардын ырлары, казак оозеки адабиятынын үлгүлөрү таасир берген, Кийин белгилүү акын Калык менен жолугушуп, андан таалим алган, Мезгил үнү менен үндөш, эл талабына, суроосуна татымдуу ата-журт, эмгек, достук, санат-насыят темасындагы чакан ырлары, «Ашымжан», «Баатыр баяны» «Гүлнар», «Сапарбек», «Баатырбек» ж. б. поэмалары бар. Анын чыгармалары эмгекчилердин ийгиликтерине, маданияттын өсүшүнө арналган."},{"t":"p","h":"Айтыш өнөрүнүн чебери катары Калык, Алымкул менен болгон айтыштарында эл-жерибиздин байлыктарын, коомдогу жетишкендиктерди, кемчиликтерди толук көркөм сүрөттөгөн айтыштын мыкты үлгүлөрүн жараткан. О, Болобалаев элдин оозеки чыгармачылыгын жакшы билген, «Курманбек», «Ак Мөөр», «Жаныш- Байыш» сыяктуу элдик эпосторду айта билген. Аны билгендердин баары Осоке деп аташып, өтө сыйлашкан. Ал 1931-жылы кыргыз театрына, 1936-жылы филармонияга артист болуп кирген. Филармонияда ошол кездерде аны менен бирге белгилүү комузчу Карамолдо Орозов, акын Калык Акыев, белгилүү өнөрпоз Шаршен Термечиков менен бирге иштешкен."},{"t":"v","l":["Акын 1967-жылы 79 жаш курагында каза болгон.","","акындык шыгы – поэтический дар","талантынын курчушу – развитие его таланта","адабият үлгүлөрү – литературные образцы","мезгил үнү – голос времени","үндөш – созвучный","эл талабы требование народа","татымдуу – соответствующий","айтыш өнөрүнүн чебери – мастер импровизации","кемчилик – недостаток","айтыш үлгүлөрү – образцы импровизации","аны билгендердин баары – все, кто его знал","Осоке деп аташып – называли его уважительно Осоке","өнөрпоз – мастер, искусник"]}],"sub":[],"section":"КЫРГЫЗ АКЫНДАРЫНЫН ПОЭЗИЯСЫНАН","pages":[100,100]},{"title":"ОСМОНКУЛДУН ТЕРМЕСИ","blocks":[{"t":"h3","h":"<s ардар адам болгон, эл алдында ырдоого Казыбекке атасы уруксат берген эмес, Атасынын айтканын сыйлап, көптөгөн казалдарды жазса да, отуздан өткөнгө чейин эл алдына чыгып ырдабаптыр. Анын ырлары элге арналып, элдин жашоосу жөнүндө баяндайт. Аны 1929-жылы «кулактын баласы» деп куугунтукка алышып, ата-энеси менен кырк төрт манапка кошуп, алыскы Оренбургга айдашкан. 1934-жылы кайра Ат-Башыга кайтып келген. 1935-жылы июнь айында түрмөгө отургузушкан, Ал түрмөдө жатып да алты жүз барак көлөмүндө ырларды жазган.Тилекке каршы, ал ырлары түрмөдөн сыртка чыкпай жок болгон. Анын көп кол жазмалары өрттөлүп кеткен, Ал 1936-жылы түрмөдө жүрүп, оорудан каза болгон."},{"t":"p","h":"Бирок, мезгил өтүп кетсе да кыргыз эли анын ырларын унутпай эстеп жүрөт. 2002-жылы Ат-Башыда Казыбек казалчынын 100 жылдык мааракеси болду. Ал жерде атайын чогулган эл Казыбек ырчыны эскеришти. Мааракеге келгендерге элдик оюндар уюштурулуп, ат чабыш, жорго салыш, улак тартыш, күрөш, кыз куумай сыяктуу улуттук оюндар өткөрүлдү."},{"t":"p","h":"Казыбектин поэзиясында Ата мекендин кадыр-баркын баалап билген адамдын сүйүүсү жатат. Эл-жер, Ата мекен жөнүндө ойлонуу адегенде акындын жекече сезиминен келип чыгат. Казыбектин чыгармачылыгы – эл-жеринен айдалып, туткунда жаткан адамдын муң-зары, кайгысы, ой-санаасы."},{"t":"v","l":["куугунтукка алынган подвергался гонениям","казалчы – акын; поэт","диний сабаттуу – религиозно грамотный","диний багытта – в религиозном направлении","аймакка аты белгилүү – известный в своем округе","бардар – зажиточный кулактын баласы – сын кулака","алты жүз барак көлөмүндө – в объёме 600 листов","кадыр-барк – то барк – уважение, почет","баалап билген – умеющий ценить"]}],"sub":[],"section":"КЫРГЫЗ АКЫНДАРЫНЫН ПОЭЗИЯСЫНАН","pages":[104,104]},{"title":"КАЗЫБЕКТИН КАЗАЛДАРЫНАН","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"105\">105<\/span>КАЗЫБЕКТИН КАЗАЛДАРЫНАН"},{"t":"v","l":["...Бетине күзгү карманган","Жууп чачын таранган","Абдан кооз болсом деп","Ак бетмайдан каалаган","Ак ж

40},{"t":"p","h":"Мамлекеттик сыйлыгынын лауреаты Түгөлбай Сыдыкбеков 1912-жылы Ысык-Көлдөгү Кен.Суу деген жерде туулган. Ал эки жашка караганда атасы өлүп калып, жетим калат. Анын энеси"},{"t":"h3","h":"Айымкан сөзмөр, жамакчы аял болгон, Созго"},{"t":"p","h":"шыктуулук талантты болочок жазуучу апасы Айымкандан үйрөнөт. 1916-жылкы кыргыз элинин козголоңунда Түгөлбайдын энеси да балдары менен Текеске качып барып, 1918-жылы кайра жөө-жалаңдап, арып-ачып кайтып келишет."},{"t":"p","h":"Совет бийлиги орноп, болочок жазуучу айылдык мектепке кирип окуйт. 1925-жылдан баштап Караколдогу орус мектептен окуйт. Мектепте окуп жүргөндө А. С. Пушкиндин, Н. В. Гоголдун, И. С. Тургеневдин атын угуп, айрым чыгармаларын окуйт. 1928- жылы Түгөлбай Сыдыкбеков Фрунзедеги айыл чарба институтуна кирип, аны 1931-жылы бүтүрүп чыгат да, Ашхабаддагы Орто Азиялык зооветинститутка өтөт."},{"t":"p","h":"Анын «Булар кимдер» деген ыры 1930-жылы басылып чыгат. Тунгуч ырлар жыйнагы 1933-жылы ат менен жарыяланган."},{"t":"p","h":"Жазуучунун «Кең-Суу» романы 1937-жылы жана 1988-жылы эки китеп болуп жарыяланган. Бул роман кыргыз адабиятындагы биринчи роман эле. 1948-жылы «Биздин замандын кишилери» романы чыккан, ал романы үчүн 1949-жылы кыргыз адабиятынын тарыхында биринчи болуп Түгөлбай Сыдыкбеков СССРдин Мамлекеттик сыйлыгына ээ болгон. «Биздин замандын кишилери» романында согуш убагындагы кыргыз элинин патриоттук эмгеги, майтарылбас маанайы, достук таза сезимдери таасын сүрөттөлгөн."},{"t":"p","h":"Андан кийин жазуучу «Тоо балдары» деген романын жазган, бул чыгармасында балдар менен чоңдордун өз ара психологиялык мамилелерин, ошол мезгилдеги элдин жашоосунун өзгөчөлүктөрүн көрсөткөн. 1955 -1958-жылдары «Кең-Суу» романын автор кайрадан иштеп чыгып, «Тоо арасында» деген ат менен чыгарган."},{"t":"p","h":"Ал өмүрүнүн аягына чейин тынбастан көптөгөн кызыктуу чыгармаларды жараткан. «Зайыптар», „Мезгил сабактары» чыгармалары, «Табылга» деген ат менен макалалар жыйнагы бар. Анын драматургия <span class=\"pg\" data-n=\"111\">111<\/span>менен кино өнөрүндө да өз орду бар: «Манас жана Алмамбет», «Майдандан», «Кыштактын ээлери» пьесаларын, «Түштүктүн токоюнда», «Кыргызстан» деген фильмдердин сценарийлерин жазган."},{"t":"p","h":"Жазуучу 1997-жылы Бишкек шаарында каза болгон."},{"t":"p","h":"Түгөлбай Сыдыкбеков —- кыргыз адабиятындагы роман жанрынын баштоочусу, кыргыз элинин улуу, көрүнүктүү, залкар жазуучусу. Окурмандар анын чыгармаларын азыркы күндө да сүйүп окушат. сөзмөр – красноречивый жамакчы – певец-импровизатор (исполняющий мелкие жанры мактоо, кордоо,"},{"t":"p","h":"лирические песни и др.)"},{"t":"v","l":["болочок – будущий","тунгуч – биринчи; первый","майтарылбас маанай – твердый, устойчивый настрой","таасын – точно","","Тапшырмалар:"]},{"t":"p","h":"&lt; 1. Түгөлбай Сыдыкбековдун өмүрү жана чыгармачылыгы жөнүндө"},{"t":"p","h":"плаи боюнча кыскача сүйлөп берүүгө даярдангыла."},{"t":"p","h":"– Түгөлбай Сыдыкбековдун балалыгы"},{"t":"p","h":"1916-жылкы козголоң убагындагы болочок жазуучунун тагдыры – Анын жазуучу болуп чыгышына түрткү болгон себептер – Анын чыгармаларынын жанры жөнүндо 2. XX кылымдагы кыргыз элинин жашоосу, өнүгүү шарты жөнүндө"},{"t":"p","h":"жазылган көркөм чыгармалар ошол мезгилдин тарыхый окуяларын камтыйбы же жокпу, кандай деп ойлойсунар?"},{"t":"p","h":"3. Т. Сыдыкбековдун китептерин ата-энеңердин китеп текчесинен из."},{"t":"p","h":"деп көргүлө. Болбосо шаардын китепканаларынан таап окугула."},{"t":"p","h":"4. Жазуучу жөнүндө кошумча маалымат карап келгиле."},{"t":"p","h":"5. Төмөнкү сүйлөмдөрдү толуктап, дептериңерге жазып алгыла:"},{"t":"p","h":"Тигелбай Сыдыкбеков жылы -.. деген „. туул ган. Анын .. Айымкан .., ... аял болгон. 1916-жылкы .. элинин"},{"t":"p","h":"Тугалбайдын ... да балдары .. .. качып барып, „жылы „ жөө-жалаңдап, _.. келишет. Жазийчунун романы 1937-жылы „= 1938-жылы ... китеп болуп „.. Бул... кыргыз... „. роман эле."},{"t":"p","h":"6. Төмөнкү сөздөрдүн синонимдерин, антонимдерин таап, дептериңерге"},{"t":"p","h":"жазып алгыла: козголоң, балалык, жомокчу, жөө-жалаңдап, сөзмөр, жамакчы, көрүнүктүц, баштоочу, жыйнак, жарык көргөн,"},{"t":"h3","h":"«Тоо балдары» романынан үзүндүлөр 1. Омор аке жана анын уулу"},{"t":"p","h":"Омордун образына мүнөздөмө берциго даярдангыла. Омордун үйүн көздөй бурулган кезде, Сабыр тымызын жылмайды. Анткени Омордун кыял-жоругун эсине түшүргөн адам эрксизден күлө турган. Ал оюндагысын кишиге бербеген бир мүнөздүү, өжөр, эр көкүрөк, кайраттуу, тымызын – тихо,"},{"t":"p","h":"незаметно эрксизден – поне-"},{"t":"p","h":"воле өжөр – упрямый <span class=\"pg\" data-n=\"112\">112<\/span>күпүлдөп сүйлөгөн адам. Баланы айрыкча жак- шы көрөт. Бирок эркелетпейт. Ойноп жүргөн балдарды өзүнө чакырат. Бир жолу анын колуна түшкөн бала оолак качат. Омор жашыраак кезинде өзүнөн качкан балдарды тартактап кубалоодон да тартынчу эмес. Аны көргөндө айрыкча Сабыр артына кылчайбай кача турган, Ал Омор жакындап келатканын анын тери шымыныи кең багалектеринин күдүр-күдүр эткен доошунан сезчү. Кээде коркуп баратып Сабыр шашканынан мүдүрүлүп жыгылчу."},{"t":"p","h":"Анда Омор:»А кудагыйдын баласы, колума түштүңбү? Качасың, э! Мен киммин, ыя!» – деп баланы ыйлата берчу."},{"t":"p","h":"Сабырдын энеси кээде ачууланый: «Ой, береги куу баш баланын жүрөгүн түшүрүп сал-"},{"t":"p","h":"десе, Сабырдын эжеси: «Кой, апа. мак Сакалдуу кишини куу баш дебе, шагы сынып калат»,- деп энени тыюучу."},{"t":"p","h":"– Сынса сынсын. Анын шагы сынат эле деп баламдын жүрөгүн тушуртейунбу. Ой, Омор, коё бер алдагы баланы. Эмне сенин сүтүңдү төктүбү?"},{"t":"p","h":"– Э, балаңды эркелетип жатам!"},{"t":"p","h":"– Сенин бала эркелеткенин курусун..."},{"t":"p","h":"– Эмне!? – дечү Омор ызаланып. – Мен бала коркутуучу карышкыр эмесмин го! Атанарга наалат, чор кыргыздар. Булар жадаса, баланы эркелеткенди да билишпейт. «Уфулен» үстүнө үйрүлө беришип, балдарын арпа жарманын каймагындай былжырак өстүрүп алышты. Бала дегенди бешиктен бели чыга элек кезинен жаагынан кайыш алып үйрөтсө, эч нерсе тоотпос өрт өсөт! Чоң атам мени эркелеткенде, муунта кармап, эки жаагымды ысыта-ысыта чабычу."},{"t":"p","h":"тарпактап куба- лоо- грузно и не- уклюже догонять тери шым – брюки"},{"t":"p","h":"из шкуры кең багалектери -"},{"t":"p","h":"широкие штанины; күдүр-күдүр эткен доошу – здесь: звук шуршащих штанин мүдүрүлүп —споты-"},{"t":"p","h":"каясь кудагыйдын бала-"},{"t":"p","h":"сы – здесь: сын свахи, обращение как к родственнике"},{"t":"p","h":"сакалдуу киши -"},{"t":"p","h":"здесь: старший, пожилой куу баш – человек, у"},{"t":"p","h":"которого нет детей шагы сынып ка-"},{"t":"p","h":"лат- обидится арпа жарманын"},{"t":"p","h":"каймагындай – сповно сливки ячменной похлёбки былжырак – растя-"},{"t":"p","h":"па, размазня жаагынан кайыш"},{"t":"p","h":"алып – здесь: строго воспиты- вать тоотпос – безраз-"},{"t":"p","h":"личный, не обращающий внимание"},{"t":"p","h":"Омордун оюнда баланы кантип тарбиялоо керек?"},{"t":"p","h":"Рас, а дегенде ыйлачумун. Кийин мен да көнүп кеттим. Ал чапкан сайын: «Дагы чап, чоң ата. Эки бетим калың болуп баратат»,— деп тике карачу болгомун... Мен эр жеткен кезимде эки жаат болуп чабышсак, булдурсун камчы тийсе да бетим түктүйүп койчу эмес! А, атаңарга аалат чор кыргыздар, мен силердин балдарыңарды киши болсун дейм."},{"t":"p","h":"Менден корксоңор, айыл конбой койгула!? Үшинтчү Омор бир жылы айылчылап келбулдурсун камчы – атаңарга аалат – плеть, нагаика"},{"t":"p","h":"здесь: атанарга наалат; недовольствие их отцами, которые не так воспитывают сво0- их детей; чор – айыл конбой кой- мозолистый"},{"t":"p","h":"гула- не распологен <span class=\"pg\" data-n=\"113\">113<\/span>чоочун аялдын баласын ошентип эркелетсе, сырын билбеген бала коркуп кетип талып калган. Сакалдуу кишилер: «Таштасаңчы адатыңды, бирөөнүн баласынын жүрөгүн түшүрүп, кункор болуп каласың! – дешип, Оморду жемелешкенден кийин, кубалаганын коё баштады."},{"t":"p","h":"Балким, Омор ошол адатын таштабас беле? Жашы элүүдөн өтүп калганда, өзү балалуу болду. Ошондон баштап бирөөнүн баласын катуу эркелеткенди да койду. Омордун кийинки эмгеги окуган балдарды көрсө:"},{"t":"p","h":"– Эй, кудагыйымдын балдары! Менин жа. ныма келип койчу! – дечү. Окуган балдарга Омор кадимки чоң кишиге кылган мамилени иштеп: «Э, өкмөттөр, келгиле! – деп козголуп коюп, катарынан орун көрсөтөт. Кээде Сабырды да чакырып: «Те-ек, ыйлаак. Көзү чоң, коён жүрөк. Эми окуп жүрөт. Качан өкмөт болуп, жаныңда тапанчанын боосун салпылдатасың ыя?"},{"t":"p","h":"– Сабыр тымызын гана күлүп койчу:"},{"t":"p","h":"– Окугандын баары эле тапанча тагынмак беле?"},{"t":"p","h":"Те.ек, бул чоң көз тапанча тагынгандан да коркот. Анан эмне үчүн оку. жүрөсүң? Койчунуку – таяк менен көнөчөк."},{"t":"p","h":"Жылкычыныкы – кыл аркан менен укурук; эгинчиники – чалгы менен орок; мага окшогон көк чекелердики – көк союл менен жомок. А союлга окуунун эмне кереги бар?"},{"t":"p","h":"гайтесь соседом на пастбище талып калган- слу-"},{"t":"p","h":"чился припадок эпилепсии кункор – виновный"},{"t":"p","h":"в убийстве жемелешкен – упре-"},{"t":"p","h":"кали"},{"t":"p","h":"тапанчанын боо-"},{"t":"p","h":"су- завязка от пистолета саппылдатат – бол-"},{"t":"p","h":"тается көнөчөк – ведерко"},{"t":"p","h":"из верблюжьей кожи кыл аркан – воло-"},{"t":"p","h":"сяной аркан; укурук- укрючина, жердь с арканом; көк чеке – тот. ко-"},{"t":"p","h":"торый постоянно выигрывает в альчики; кексоюл – забияка, скандалист Окуу жөнүндө Омордун айткандарын талдагыла. Же моюнга жагоо тагынып үп боло албасак... ансыз да бир үйдөгү үч бала бирдей мектепке жүгүрөт. Теги, эртең өкмөтчүлүк кимисине жетишет, ыя? – Сабыр техникумдун үчүнчү курсун бүтүрүп келгенде, Омор аны үйүнө чакырды, Бул жолу Сабырдын алдына каймакка көптүргөн тарууну койдуруп, чын ниетинде кеп баштады:"},{"t":"p","h":"– Мен өз айлымдын козусунан кочкор агытканды жакшы көрөм, Сабыржан. Окууну окуй берсе акылдуу кишинин мээси айнып калат деген. Эсептесем мектеп эшигин аттаганыңа далай жыл болуптур. Бир башка жетишерлик"},{"t":"p","h":"кому үп бол – здесь: стать"},{"t":"p","h":"активом в колхозе"},{"t":"p","h":"каймакка көптүр-"},{"t":"p","h":"гөн таруу – кушанье из жареного пшена, залитого сливками <span class=\"pg\" data-n=\"114\">114<\/span>илим алдың. Тил ал, Сабыржан, Ушунчаңда окууңду токтот. Дагы он жыл окусаң көп болсо, ачендик болорсун."},{"t":"p","h":"Тилимди ал, биздин айылга часковой милиса бол да, окуунду бүт! Алдыңда ат. Үстүңдө көк жака. Жетишкендик ошол да! Өгүнү бир серке союп, терисин бербей койсом, актисин жазышты... Э, дүйнөдө мен ушул часковойдон чоңду көрбөдүм. Тапанчасынын боосун салпылдатып, деле ар түрдүү иштин баарына көз салат экен. Тил ал да ушул часковой бол..."},{"t":"p","h":"– Ал казматты аткарышка менин жөнүм келбейт."},{"t":"p","h":"= Тек! Ага окууң аздык кылабы?"},{"t":"p","h":"– Ар иштин өзүнүн окуусу бар, Омор аке, – Ә кандайча өз окуу? Кат жазасыңбы? Колуңду коёсуңбу? Болду, меерунду басып, ишинди агыза – бер! Дагы кандай окуу?.. Ушул замандын окуусу коп, Илгери бир эле молдо тил кат жазып, катындын да башын ачый... Эми аарынын да окуусу чыкты. Тек, койдумчу деги?! – Сабыр Омордун ушул жоруктарын эсине түшүрдү. Аялы төрөбөй «куу баш» атка конуп жүргөн кезинде, кээде дөңгө жалгыз отуруп алып, көк союл менен жерди дүп чаап коюп, Омор кудайды тилдөөчү. Ал антип отурганда: «Кой, барбайлык. Биз эмес, Омор кудайды сабап олтурат» дешип анын жанына адам жолочу эмес."},{"t":"p","h":"Омордун минези өзгөрдүбү?"},{"t":"p","h":"ачендик – здесь:"},{"t":"p","h":"начальник"},{"t":"p","h":"көк жака – здесь:"},{"t":"p","h":"синяя форма мипиционера серке -— костриро-"},{"t":"p","h":"ванный козёл, ведущий стадо овец"},{"t":"p","h":"мөөр – печать"},{"t":"p","h":"жолочу эмес – не"},{"t":"p","h":"подходил"},{"t":"p","h":"Анын кырктан ашып калган аялы догдурга көрүнүп жүрүп бала төрөдү... Эй, атаңдын көрүнө!» – деди Омор кубангандан."},{"t":"p","h":"– Дөбөдө отуруп кудай менен сабашканча, байбичем, мурунтан эле догдурга барсак болмок экен го». „Ошентсек болмок экен»,- деп аялы кубаттаса, Омор: – «Бу кайран Сабет, тоодогу кыргызга трактыр жеткизди. Өнөр, илим берди. Жадаса, төрөттөн калгандарды минтип четинен төрөтө баштады»,- деп корс-корс күлгөн."},{"t":"p","h":"...Омор уулунун атын Орусбек койгон. Ал жетиге толгондо, Омордун үйүнө сельсоветтен киши келди:"},{"t":"v","l":["= Омор аке,- деди ал – Орусбегиңиз мектепке барат.","– 9! – деди Омор кежирлении,- Орусбекте эмне бар?","Окубайбы, жарыктык.","Эй, жигит, мага жооп берчи?","– Кана сураңыз."]},{"t":"p","h":"<span class=\"pg\" data-n=\"115\">115<\/span>Бир уйде он бала болсо, ону тен окуу дешип делнилдешет. Эркеги жетишпей калгансып, кыздары кошо энтеңдейт. Мынча элге окуунун не кереги? Бул өкмөтчүлүк кимисине жетишет, ыя, жооп тапчы? – Омор сөөмөйүн чочойткон."},{"t":"p","h":"– Окуу керек. Окугандын баары эле өкмөт болбойт."},{"t":"p","h":"– Анаи эмне кылат?Он жыл окуп алып уй багабы?"},{"t":"p","h":"– Ооба! – деди сельсоветтин кишиси камырабай,- окуп алган киши уйду бакса, ага көк көйнөктү жолотпойт..."},{"t":"p","h":"– Тек, уйчуга окуунун кереги не? Малды окуу тосо албайт. Көк союл тосот. Окуп, окуп койчу болсо, менин Орусбегим окубай ак, оо деген адам болот. Бара бер!"},{"t":"p","h":"Айтканынан кайтпас Омор биринчи жылы Орусбегин мектепке жибербей койду. Бир күнү Орусбек ыйлап келди."},{"t":"p","h":"– Эмне ыйлайсың? – деди атасы."},{"t":"p","h":"– Окуган балдар мени шылдыңдашат... = Эмне деп?"},{"t":"p","h":"– Окубаган торпок, торпок дешет."},{"t":"p","h":"– О кайраты жок жаман? Алар торпок десе, сен ого бетер торпоктугуңду билгизип, үйгө мөөрөп келесиңби? Экинчи мага жашыңды көрсөтпо, «Жалгыз болсоң, чогоол бол»... деген. – Сени торпок деген балдарга кыргыйдай тий!"},{"t":"p","h":"– Маалим болушса, мага айт. Мектебинин эшигин жулуп ыргытканымды бир көрсүн. Байыркы молдо табылгы чыбыгын көтөрсө, балдардын башы жерге кире түшчү."},{"t":"p","h":"делпилдешет – про-"},{"t":"p","h":"являют рвение, рвутся к учебе энтендейт – суетит-"},{"t":"p","h":"ся, торопится"},{"t":"p","h":"кыргыйдай – как"},{"t":"p","h":"ястреб"},{"t":"p","h":"табылгы чыбык —"},{"t":"p","h":"прутик таволги, кустарника"},{"t":"p","h":"Омор мектепке Орусбекти окутпайм деген сөзүнөн эмне учун кайтты?"},{"t":"v","l":["Тапшырмалар:","1. Суроолорго жооп бергиле:"]},{"t":"p","h":"1) Үзүндүдөгү окуялар кайсы мезгилде болгон деп ойлойсунар?"},{"t":"p","h":"Эмие үчүн?"},{"t":"p","h":"2) Омор кандай киши? Ал кичинекей балдарга кандай мамиле кылат"},{"t":"p","h":"экен? Баласынын атын эмне үчүн Орусбек деп коюптур? Адамдын атын коюу майнилүүбү же маанилүү эмеспи, ой жүгүрткүлө."},{"t":"p","h":"3) Азыркы ата-энелердин арасында Оморго окшоп балдарын мектеп."},{"t":"p","h":"ке жибербей койгондор барбы? Болсо, силер ал адамдарга эмне айтат элеңер, айтып көргүлө."},{"t":"p","h":"4) Омордун оюнча мектеп жана окуу эмие үчүн керек? Анын оюнча"},{"t":"p","h":"<span class=\"pg\" data-n=\"116\">116<\/span>милиционер кандай адам экен? Эмне үчүн «дүйнөдө мен ушул часковойдон чоң кишини көрбөдүм» дейт?"},{"t":"p","h":"5) Үзүндү эмие үчүн «Омор аке жана анын баласы» деп аталат? Мын-"},{"t":"p","h":"дан башкача да атаса болобу? Кандай атаса болот деп ойлойсуңар?"},{"t":"p","h":"2. Үзүндүнү дагы бир сыйра окуп, өз алдыңарча сүйлөп бергиле. З. Омордун образына мүнөздөмө берүүгө үйрөнгүлө."},{"t":"p","h":"4. Төмөнкү сөздөрдүн синонимдерин, антонимдерин таап, дептериңерге"},{"t":"p","h":"жазып алгыла: Тымызын, өжөр, эр көкүрөк, кайраттиу„ кипулдегон,"},{"t":"p","h":"шым, кең багалек, камчы. жемеле, тапанча, көнөчөк, жылкычы, кыл аркан, укурук, көк чеке, кок союл,"},{"t":"p","h":"И. Жүрөктөн чыккан сөздөр Омордун пионерлерге кайрылуусун өз сөзүңөр менен айтып"},{"t":"p","h":"бериццгө даярдангыла, «Илим менен эрте жазда өмүрдү гүлдөткүлө!»* – деди Омор, эми эле атактуу академик Яковлевдин «Күрпүлдөк» мектебинин пионерлерине жиберген катындагы окулган сөздөрдү өз ичинен күңкүлдөп. – Те-ек сөз эмес бекен,"},{"t":"p","h":"– дале болсо өз билгенине бек турган бир мүнөздүү кары оюн угуза айталбады. Пионерлердин сборунда чоң энеге сөздү биринчи бергиси келген Сабыр азыр күңкүлдөгөн Омордун алда эмнеге таасирленип, өзүнчө кызып отурганын көрдү да, ордунан турары менен:"},{"t":"p","h":"– Омор аке, сөз сизге берилет! – деди. Омор таң калгансып, салмак менен Сабырга бир карады да, үнсүз таягын «түк» эткизди. Балким, кызыктуу жакшы кеп айтар деп күткөн Сабыр Оморго кайталады:"},{"t":"p","h":"– Сөз сизге берилди, Омор аке!"},{"t":"p","h":"– Тек,- деди Омор. – Бала болуп башыма жүн чыккандан бери менин докладчы болгонумду укканынар барбы?!"},{"t":"p","h":"– Сиз көргөн, билгениңизден пионерлерге эстелик сүйлөп бериңиз. – Сабыр Оморду ыкка көндүрүү үчүн атайы айтты. – Сиздики доклад эмес, анчейин жай сөз."},{"t":"p","h":"– Эмне үчүн меники доклад эмес?"},{"t":"p","h":"Бул суроону же оюндан, же чындан бергенин түшүнө албаган Сабыр саал күлүмсүрөп айтты:"},{"t":"p","h":"– Сиз эстелик айтасыз."},{"t":"p","h":"– Те-ек, Сабыржан! – кексе кары Сабырга бүркүтчө карады. – Сен сүйлөсөң доклад, тетиги Мерген сүйлөсө доклад. А сөздөрү чолпондой өмүрдү гүлдөткү-"},{"t":"p","h":"ле- процветайте в жизни күңкүлдөп – буб-"},{"t":"p","h":"нить сөз эмес бекен —"},{"t":"p","h":"здесь: одобрение; это ли не слово бир мүнөздүү -"},{"t":"p","h":"устойчивый характер таасирленип – под"},{"t":"p","h":"влиянием"},{"t":"p","h":"эстелик сүйлөп бе-"},{"t":"p","h":"риңиз – скажите им на память анчейин – так себе"},{"t":"p","h":"кексе – хитрый, видавший виды <span class=\"pg\" data-n=\"117\">117<\/span>жайнаган жалаң гүлдөгөн пионерлерге Омор сөз айтса, тек зэстелик – анчейин жай сөз» боло калат,"},{"t":"p","h":"= Э, ант урган Омор, башыма чач чыкканы доклад айтып көргөн жан эмесмин деп эми эле өзүң айтпадыңбы,- деди чоң эне."},{"t":"p","h":"– Ооба, өзүм айттым,— деди Омор. – А өзүм айтсам эле менин сөзүм докладга кошулбайбы?"},{"t":"p","h":"– Кошулат, Омор аке,- деди Сабыр токтоо,- докладчы десем чочуп кетеби дедим сизди."},{"t":"v","l":["Докладчы Омор өз сөзүндө эмне жөнүндө айтат?","– Тек! Чочуй турган кишини тапкан","экенсиң! – Омор ордунан турары менен кебин","жөнөттү,","Э, кагылайын балдарым! Силердин Омор"]},{"t":"p","h":"акеңер эчтемеден чочубайт. Ошону билип койгула! – Омордун кайраттуу чыккан бийик унуа дегенде эле пионерлерди өзүнө тартты. – Тетиги башкарма Мерген доклат сүйлөсө мисалга да калат. Айткан кебим сумсак болбосун, доклатымды мен да мисалсыз баштабайын,"},{"t":"p","h":"Терезе жактан Орусбектин үнү чыкты:"},{"t":"p","h":"Те-ек, сиздин мисалды уккубуз келет, жолдош Карабашев!"},{"t":"p","h":"Бирок Орусбектин үнүнө күлгөндөр болбоду. Бир катар пионерлер, ага: Ай, уятсыз, өз атасын да ошентип айтат бекен?» – дегендей үнсүз карашты. Кулагына чейин кызара түшкөн Орусбек ошол замат тим болду."},{"t":"p","h":"Омор укмаксанга салып өз кебин улады:"},{"t":"p","h":"– Ооба, кагылайын неберелерим! Менин мисалым – илгери силердей бала кезимден баштап жүрөгүм да, сөзүм да, союлум да эч эчтемеден жалтанган эмес!...„Те.ек, деп ойлонуп карадым. Те алда кайдагы орус эрте жаздай өмүрдү гүлдөткүлө деп кыргыздын балдарына кеңеш кошту. Ошолордун ичинде менин да уулум бар, Өз атасы болуп туруп ушул күнгө уулума ошончо акыл айта албаймын. Ойлоп-ойлоп алысты жуук, эл-журтту дос кылган ушу биздин өкмөттүн илимине чын пейилимден ыраазы болдум. Көрсө, ачендик мындай турсун, биздин колхоздун көп козуларын ич өткөктөн сактаган да мал доктурдун окуусу болду! Ушундай деп мени Сабыр үгүттөбөдү."},{"t":"p","h":"Турмуш өзү баян этти. Окусаң ачендик болуп кел. Ачендик болбосоң өкмөттүн накебим супсак бол-"},{"t":"p","h":"босун – чтобы мои спова не быпи сухими"},{"t":"p","h":"союлум – моя ду-"},{"t":"p","h":"бинка"},{"t":"p","h":"жуук – близко"},{"t":"p","h":"ич өткөк – дизен-"},{"t":"p","h":"терия <span class=\"pg\" data-n=\"118\">118<\/span>нын бекер жебе дечү элем. Жылдыздай жайнаган кагылайын неберелерим, силердин көз алдыңарда мен ушул жаңылыш айтып жүргөн сөздү кайра аламын. Так ушул мөөнөттөн баш-"},{"t":"v","l":["тап ал сөздү мени айтты, деп эсептебегиле!","Сабыр баштап пионерлер алакан чабышты.","ушул мөөнөттөн","баштап – с этой","минуты","Омордун окуу жөнүндө пикири өзгөргөнүн анын кайсы сөздөрү","далилдейт?","","Таишырмалар;","1. Суроолорго жооп бергиле:"]},{"t":"p","h":"1) Сабырдын бардык аракеттери Оморго кандай тайсир калтырды?"},{"t":"p","h":"2) Чогулушта сүйлөп жаткан атасына Орусбек эмне үчүн үй чыгарып"},{"t":"p","h":"тоскоол болду? Орусбек жөнүндө айтып бергиле."},{"t":"p","h":"3} Мектепте откөн чогулушта Омор аке озунун мурунку катасын"},{"t":"p","h":"кантип мойнуна алды? Ал окуунун керек экенин кантип түшүндү?"},{"t":"p","h":"4) Орусбек чоңойгондо кандай адам болот деп ойлойсуңар? Эмне"},{"t":"p","h":"үчүн?"},{"t":"p","h":"2. Омор акенин «алысты жуик, эл – журтту дос кылган ушу биздин өкмөттүн илимине чын пейлимден ыраазы болдум. Көрсө ачендик мындай турсун, биздин колхоздун көп козуларын ич өткөктөн сактаган да мал доктурдун окуусу болду» деген сөздөрүн кандай түшүнөсүңөр?"},{"t":"p","h":"3. Омор аке оң каарманбы же терс каарманбы? Талкуулагыла."},{"t":"p","h":"4. Ошол кездеги мектеп менен азыркы мектептин окшоштуктарын жана айырмачылыктарын Венидин диаграммасында көрсөткүлө, 5. Төмөнкү макалдардын маанисин чечмелеп бергиле: Окуу – билим азыгы, билим – ырыс азыгы. Окуган – жарык, окубаган – чарык. Билими кучтцу миңди жыгат, билеги куичтициу бирди жыгат. Билимдицнин сөзү өткүр, мергенчинин көзү өткүр."},{"t":"p","h":"дийнө жарык, билимсизге дуйнө караңгы."},{"t":"p","h":"б. Төмөнкү создордун синонимдерин, антонимдерин таап, дептериңерге жазып алгыла: бир минездуи. таасирлении. эстелик, кексе, сумсак кеп, жуук. ич өткөк, мөөнөт."},{"t":"v","l":["7. Өз алдыңарча томонку суроолорго жооп жазгыла:","Роман деген эмне?"]},{"t":"p","h":"– Түгөлбай Сыдыкбеков өзүнүн +Тоо балдары» романында кайсы"},{"t":"p","h":"мезгилдеги окуяларды баяндаган?"},{"t":"p","h":"– Эмне үчүн Т. Сыдыкбековду «ромаичы» деп айтабыз?"},{"t":"p","h":"– Силердин оюңарча роман эмне үчүн «Тоо балдары» деп аталат?"},{"t":"p","h":"Адабият теориясынан Роман – турмушту ар тараптан жана кеңири сүрөттөөгө алган көп пландуу стиндегидей сүйүү даңкталган эмес. Бул повестти француз тилине которгон Луи Арагон «Сүйүү жөнүндө дүйнөдөгү эн улуу дастан» деген баа берген. Чыңгыз Айтматовду дүйнө жүзүнө таанымал кылган «Эрте келген турналар», «Гулсарат», «Атадан калган туяк» жана башка чыгармалары көптөгөн дүйнө элдеринин тилдеринде басылып чыккан. Бул чыгармаларында ал согуш учурундагы кыргыз элинин жашоосун, көргөн кыйынчылыктарын чагылдырган."},{"t":"p","h":"Чынгыз Айтматов «Тоолор жана талаалар баяны» жыйнагы үчүн Лениндик сыйлыкка татыктуу болгон. «Гүлсарат» повести үчүн"},{"t":"h3","h":"<span class=\"pg\" data-n=\"120\">120<\/span>СССРдин Мамлекеттик сыйлыгын алган. «Эрте келген турналар»"},{"t":"p","h":"повести үчүн Кыргыз Республикасынын 'Токтогул атындагы сыйлыгына ээ болгон. «Ак кеме» повести үчүн СССРдин Мамлекеттик сыйлыгына, «Кылым карытар бир күн»* романы үчүн да СССРдин Мамлекеттик сыйлыгына татыктуу болгон."},{"t":"p","h":"Ал – Социалисттик Эмгектин Баатыры. Кыргыз Республикасынын Эл Баатыры."},{"t":"p","h":"Ч. Айтматов 80-жылдардан баштап роман жанрына кайрыла баштаган. Анын «Кылым карытаар бир кун», «Кыямат», «Кассандранын эн тамгасы», «Чыңгызхандын ак булуту», «Тоолор кулаганда (Түбөлүк колукту)» аттуу романдары өзүнүн баалуулугу менен дүйнө элинин көп тилдерине которулду."},{"t":"p","h":"Чыңгыз Айтматов – Париждеги Европа илимдер, искусство жана адабият академиясынын жана Рим клубунун мүчөсү, «Ысык-Көл форумунун» президенти, Дж. Неру атындагы сыйлыктын лауреаты."},{"t":"p","h":"Жазуучунун ар бир чыгармасынын көтөргөн жүгү, коркөм жалпыланып чечилген маселеси бар. Чыңгыз Айтматовдун сүрөткердик улуу, укмуш өзгөчо касиети бар. Бул анын олуттуу маселени бир чыгармасында көтөрүп чыгып, ал толгонуусун кийинки чыгармаларында туу чокуга жеткирип, ийине чыгарып (делать как надо, довести до ума), окуган адамды биротоло жипсиз (незримо) байлаганы. Анын каармандары – күрөшчүл, темирдей эрктүү, айтканынан кайтпаган, жалаң идея үчүн жаралган адамдар: Жамийла, Толгонай, Сейде, Ильяс, Дүйшөн, Алтынай, Танабай, Султанмурат, Эдигей, Бостон... Бул каармандардын тагдырлары ар башка, жамандыкка, адилетсиздикке күрөштөрү да бөлөкчө, бири-бирине окшобойт. Бирок ошондой болсо да, аларды бириктирип турган бир нерсе бар – алар айтканынан кайтпайт, максат-тилектерин аткармайын жандары тынбайт, эгер керек болсо идея учун курман болуудан тартынбайт. Жазуучунун эн негизги темасы – адам фактору менен концепциясы. Чыңгыз Айтматовдун чыгармаларындагы көркөм дүйнө мазмуну боюнча да, формасы боюнча да жаңы. Чыгармаларындагы каралган маселелер, алардын көркөм чечилиши менен жалпыланышы өзгочө айырмалуу. Анын чыгармалары өзүнүн жаңычылдыгы, маселелеринин актуалдуулугу жана курчтугу менен айырмаланат. Чыңгыз Айтматовдун аты менен бүгүн ар бир кыргыз сыймыктана алат. Жаңы сөздөр:"},{"t":"v","l":["өздөштүрө билген – освоил","илим изилдөө – научно-исспедовательский","Тоолор кулаганда – Когда падают горы","Түбөлүк колукту – вечная невеста","жүк – груз","толгонуу – раздумье","туу чоку – бухв.: самая макушка"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"121\">121<\/span>«Фудзиямада кадыр түн» чыгармасы жөнүндө"},{"t":"p","h":"Бул пьеса Ч. Айтматовдун адабий биографиясындагы алгачкы драмалык чыгарма."},{"t":"p","h":"Сыягы, айрым жагдайлар болбогондо (если бы не некоторые обстоятельства), балким, бул чыгарма автордун сүйүктүү жанры повестке да айланып кетиши мүмкүн эле."},{"t":"p","h":"«Адегенде материалды пьеса эмес, повесть кылып жазам го деп ойлогом. Бирок Галина Волчек жана Олег Табаков өңдүү театр өкүлдөрү менин сюжетим сахна учун куп ылайык экен дешкенинен казак драматургу, досум Калтай Мухамеджановго сюжетти айтып бергем. Экөөбүз бири-бирибизди толуктадык окшойт, соңунда минтип пьеса жаралды.»"},{"t":"p","h":"(«Человек и мир. Семидесятые годы», китепте: В сооавторстве с землей и водою, Фр.,"},{"t":"p","h":"Чыгармадагы көтөрүлгөн маселелер, камтылган материалдын көркөм чечмелениши, курч формада коюлган адам жана абийир, адам ыйманынын тазалыгы сыяктуу проблемалар пьеса Айтматовдун чыгармачылык жолунан кокусунан жаралган көрүнүш эмес экенин кашкайта көрсөтүп турат. Анын үстүнє, Айтматовдун чыгармалары демейде повесть жанрынын же аңгеменин алкагына батырылып жазылганы менен (хотя помещено в границы повести или рассказа) алардын драматургиялык касиеттери өтө белгилүү. Буга анын повесттеринин көп сандаган инсценировкалары, спектаклдер, кинофильмдер ачык күбө. Драмада окуя окумал курбулардын бири Фудзияма деп атай койгон дөбөдө өнүгөт, мезгилдик жактан бир суткага жакын убакытта өтөт. Ал жерге бир кезде балдар үйүндө чогуу тарбияланышып, андан кийин университетте бирге окушуп, согушта да бир батареяда кызмат өтөшүп, кийин турмуштук жолдору ар жакка бөлүнүп кеткен төрт курбу чейрек кылымдай убакыттан кийин (после четверти века) чогулушат."},{"t":"p","h":"Курбуларды баш коштурууга себепкер болуп, чакырып, сый көрсөтүп жаткан ошол жердеги совхоздун башкы агроному Досберген."},{"t":"p","h":"Сыйлуу коноктордун бири – тарых илиадабий биография-"},{"t":"p","h":"сы – литературная биография"},{"t":"p","h":"айланып кетиши -"},{"t":"p","h":"превратиться"},{"t":"p","h":"куп ылайык экен -"},{"t":"p","h":"очень подходящий"},{"t":"p","h":"соңунда – в итоге керкем чечмеле-"},{"t":"p","h":"ниши – художественное топкование абийир – стыд, со-"},{"t":"p","h":"весть адам ыйманынын"},{"t":"p","h":"тазалыгы -чистота человеческой совести кашкайта – явно,"},{"t":"p","h":"заметно, безапепляционно демейде – обычно"},{"t":"p","h":"окумал курбулар -"},{"t":"p","h":"одноклассники"},{"t":"p","h":"кызмат өтөшүп -"},{"t":"p","h":"служили турмуштук жол-"},{"t":"p","h":"дору бөлүнүп кеткен – чьи жизненные пути разошлись баш коштуруу – со-"},{"t":"p","h":"брать вместе"},{"t":"v","l":["<span class=\"pg\" data-n=\"122\">122<\/span>минин доктору, кайсыл бир институттун","директорунун орун басары Иосиф Татаев, же","Осипбай. Экинчиси жазуучу, журналист","Исабек Мергенов актриса аялы Гүлжан менен,"]},{"t":"p","h":"учунчусу- жергиликтүү мектептин тарых сабагынын мугалими Мамбет Абаев аялы Анвар менен. Чогулгандардын сөздөрүнөн улам алардын Сабыр деген дагы бири болгондугун билебиз, бирок, ал эмнегедир курбулардын жыйынына келбейт."},{"t":"p","h":"Алгач дободогулор көңүлдүү отурушат. Бирок, реплика чымчышуулар тереңдеген сайын ал мугалим Мамбеттин демилгеси, экиленген актриса Гүлжандын, курбуларга балдар үйүндө таалим-тарбия берген апанын коштоосу менен кимдин ким экенин тастыктаган анализ-чегинууго, азыр кайда экендиги белгисиз, бир кезекте мыкты ырларды жазып, көптөн үмүттөндүргөн Сабырдын руханий дүйнөсүнүн алдындагы «ачык сотко» айланып кетет. «Ачык сотту» Осипбай менен Исабек каалашпайт, сөздү башка темага бургулары келишет, бирок Мамбет Сабырдын маселесин козгоп туруп алат."},{"t":"p","h":"Дөбөдөгү «ачык сотто» курбуларды турмуш аёсуз калчап, бир нече ирет оор сыноолорго дуушар кылгандыгы, сыноолордо балалык кездеги көп касиеттерин, сапаттарын жоготушкандыктары, айрымдары кыйынчылык кездерде таланттуу акын Сабырды сатып кетишсе, бирөөлөрү анын үстүнөн чагым жазып Сабырды каматкандыгы айкын болот."},{"t":"p","h":"Чуулгандуу поэмасы жөнүндө жазалоочу органдарга тоголок кат жазып, Сабырдын камакка алынышына түздөн түз себепкер болгон ким?"},{"t":"p","h":"Драмада буга ачык жооп берилбегени менен ким экендигин Мамбет эң сонун билет. Анын ким экендигин окурман деле байкайт. Ал Фудзияма деп аталган дөбөчөгө чогулган адамдардын ичиндегилердин бирөөсү. Аны Айша апа да түшүнүп, Фудзиямадагы курбулардан качканча шашат,"},{"t":"p","h":"Жазыксыз репрессияланган Сабырдын ырлары автордун айтайын деген оюнун негизин түзүп турат:"},{"t":"p","h":"сөздөрүнөн улам -"},{"t":"p","h":"со слов эмнегедир – по-"},{"t":"p","h":"чему-то дөбөдөгүлөр – те."},{"t":"p","h":"кто на холме чымчышуу -— драз-"},{"t":"p","h":"нить друг друга"},{"t":"p","h":"тастыктаган – уточ-"},{"t":"p","h":"нять"},{"t":"p","h":"каалашпайт не"},{"t":"p","h":"желают"},{"t":"p","h":"аёосуз калчап -"},{"t":"p","h":"беспощадно испытывать сапаттарын жого-"},{"t":"p","h":"тушкандыктары – что растеряли свои качества айкын болот – ста-"},{"t":"p","h":"нет известно чуулгандуу – скандальный тоголок кат – ано-"},{"t":"p","h":"нимное письмо ачык жооп берил-"},{"t":"p","h":"бегени менен – хотя нет однозначного ответа <span class=\"pg\" data-n=\"123\">123<\/span>Эзелтен чечилбеген улуу талаш, улуу талаш – великий спор Канткенде адам уулу адам болот?"},{"t":"v","l":["Ураалап жоо кууса да ушул талаш,","Канткенде адам уулу адам болот?","Ажалга көз жумса да ушул талаш,","Канткенде адам уулу адам болот?","Эстегиле! Тааныш сөздөр:"]},{"t":"p","h":"себепкер – виновник (7-кл., 10-6. «Манас» эпосунун кыскача мазмуну»:"},{"t":"p","h":"Коңурбай – Манастын өлүмүнө себепкер.) козгоп туруп алат – затрагивает этот вопрос (9-кл., 113.6. Осмонкулдун"},{"t":"p","h":"термесинен:"},{"t":"v","l":["Калем алып жазайын,","Казалдыи кенин ачайын,","Ичимдеги өнөрдү.","Козгогум келди атайын.)","чагым – донос (9-кл..67-6. Калыгул бай уулу «Акыр заманә:","Аганын тилин ини албай,"]},{"t":"h3","h":"Чагым болот деп айткаи.)"},{"t":"h3","h":"«Фудзиямада кадыр түн» драмасынан үзүндү"},{"t":"v","l":["(Эки бөлүмдүү драма)","Катышуучулар:","Досберген – совхоздун агроному,","Алмагүл – аялы, география сабагынын мугалими.","Мамбет – тарых сабагынын муголими,","Анвар – аялы, врач.","Осипбай – Иосиф Татаевич, илим доктору.","Исабек – журналист, жазуучу.","Гүлжан – аялы, актриса.","Айша – апа.","Жумушчу.","Биринчи бөлүм","Алыстан ак карлуу тоолордун шаңында"]},{"t":"p","h":"береги Фудзияма деп аталган Туу чокунун башындагы көк тайпац. Бир тарабы аска: лии зындан, тубундө суу агып жаткансыйт, шары игулат,"},{"t":"p","h":"Жайдын толук кези. Ишемби кундүн кечи. Дөбөнүн оң тарабында чыгып келер кыя жол калың бар сыяктанат, Адам изи тулаң, терки аскалуу – жарлуу коктуларда топ-топ өскөн бадал, карагай. Туш тарап ээн."},{"t":"p","h":"Бирок бцгун бөтөнчө шаңга толгон. Досбергендин чакыруусу менен буерге анын класс: таш, кийин куралдаш курбулары (друзья по Туу чоку – самая"},{"t":"p","h":"макушка көк тайпаң – горное"},{"t":"p","h":"плато с зелёной травой кыя жол – косогор калың тулаң – гу-"},{"t":"p","h":"стой ковыль; поросшая ковылём местность <span class=\"pg\" data-n=\"124\">124<\/span>оружию) келген. Осипбайдан, башкача айтканда Иосиф Татаевичтен башкалары сейилге ылайыктап жупуну (просто, незатейливо } кийинишкен. Даражасына ылайык жосунун бузбаган Иосиф Татаевич үтуктөлгөн костюмчан, галстукчан, асынган транзисторун анда-санда толгоп коёт."},{"t":"p","h":"Аялдар азырынча көрүнбөйт. Алар кийинче:"},{"t":"p","h":"рээк келер."},{"t":"v","l":["жосунун бузбаган","– не нарушающий","порядок, правило"]},{"t":"p","h":"Д ге н. Алмагүл биердеги дөбөденсеолорго чейин ат коюп чыкты, Топонимика дейт имиш. Экскурсия деп балдарга тыным бербейт. «Фудзамия», айта албасам ал күлөт... «Фудзияма дегениң айтууга кыйын экен. Өзүбүздө толуп жаткан чокуларыбыздын аты буюрбадыбы сага?» десем, ал «мында терең маани бар», дейт. «Фудзияма» деген касиеттүү, ыйык тоо дегенди түшүндүрөт дейт."},{"t":"p","h":"Иосиф Татаевич. Бусөздүн сырын мен былтыр Японияга барганда билдим. Алыстан Фудзияманын өзүн да көрдүм."},{"t":"p","h":"И с а бе к. Мен билгенден мунун мааниси мында; ар бир такыба буддист өмүрүндө жок дегенде бир ирет касиеттүү Фудзиямага чыгып, кудай менен сырдашат экен, бул дүйнө тууралуу ой ойлоп, кылган күнөөлөрүн моюнуна алат имиш, бизче айтканда, кудай алдында ымандай сырын айтып, эсеп берет экен. (Ушул учурда төмөнтөн келаткан аялдардын иундери угулат.)"},{"t":"p","h":"Гүл жан {айланага карап). Сонун экен. Укмуш! Бүт дүйнө алакандагыдай көрүнөт. Ах, керемет! Бүгүн буерге келишти укмуш ойлоп таапсың, Алмагүл, Фудзияманын чокусу ажайып болсо ушунчалык болор да. Ах, керемет."},{"t":"p","h":"И с аб е к. Фудзияманын чокусуна чыккан адам жүрөгүнүн эн купуя сырын ачарын билесиңби, жаным? Фудзияманын шарты ушундай,"},{"t":"p","h":"Гүлжан, Кудай алдында жан-жүрөгүмдү жайып салууга азыр да даярмын. Жашырар эч кандай купуя сырым жок,"},{"t":"p","h":"Алмагул. Кимдин ким экенин билсек, кызык болор эле..."},{"t":"p","h":"(Төмөндөн машиненин уни угулат. Ак чачтуу апа келет. Баары ордунан туруп, Айша – апаны тосуп алышат.) тыным бербейт —"},{"t":"p","h":"не даёт покоя аты буюрбады-"},{"t":"p","h":"бы – не суждено дать другое название"},{"t":"p","h":"сыр – тайна"},{"t":"p","h":"такыба буддист —"},{"t":"p","h":"бпагочестивый буддист"},{"t":"p","h":"ымандай сыр —"},{"t":"p","h":"букв.: тайна как совесть; настоящая тайна"},{"t":"p","h":"керемет – чудо, ди-"},{"t":"p","h":"во"},{"t":"p","h":"купуя сыр – сокро-"},{"t":"p","h":"венная тайна"},{"t":"p","h":"жан-журегумду жа- йып салуу – рас-"},{"t":"p","h":"крыть свое сердце"},{"t":"h3","h":"<span class=\"pg\" data-n=\"125\">125<\/span>А й ша ап а. Арыбагыла, айланайындар!"},{"t":"p","h":"Өх, жүрөгү кургур жарылып кетеби. Карылык деген ушу,"},{"t":"p","h":"И сабе к. Мына дасторкондун ажары эми ачылды. Сиздин келгениңиз сонун болбодубу, Айша апа."},{"t":"p","h":"Айша а п а. Силер үчүн жердин түбүнө да барууга даярмын, балдарым. Баш кошуп көрүшпөгөнүбүзгө канча жылдар болду? Силер чакырганда кантип үйдө отурайын."},{"t":"p","h":"Сабырды да келди деп уктум."},{"t":"p","h":"арыбагыла -здрав-"},{"t":"p","h":"ствуйте"},{"t":"p","h":"ажары -— здесь: кра-"},{"t":"p","h":"сота"},{"t":"p","h":"көрүшпөгөнүбүзгө"},{"t":"p","h":"канча – сколько мы не встречались Драманын биринчи бөлүмү кандай окуя менен башталды?"},{"t":"p","h":"«Фудзияма» деп атаган дөбөдө кимдер чогулушту? ххх"},{"t":"v","l":["А й ша а п а. Укканыма караганда (по","слихам) Сабыр согуштан келгенден кийин бир","поэма жазат, ошол үчүн айыпталып соттолот,"]},{"t":"p","h":"Кийин күнөөсүздүгү аныкталып, акталып чыгат. Бирок мунун баары эмнеден башталып, кандай болгону силерге гана маалым. Тек айтарым, бешөөң тең мага колумдун беш салаасындай (как пять пальцев) кымбатсыңар. Сабырды согуш мезгилинде бүт жаштар жакшы көрчү, ырларын ант катары жатка айтышар эле. Жакында Интернаттын кырк жылдыгына байланыштуу мектеп музейине материалдарыңды жибер деп кат жазсам, «Ардактуу Айша апа, мени Ата Мекендик согушта курман болгон деп белгилеп коюңуз» деп жооп жазыптыр. Бул эмне шумдугу?"},{"t":"p","h":"Гүлжан. Деги анын тагдыры эмне менен бүттү? Айта турган болсоңор айтпайсыңарбы? (Пауза)"},{"t":"p","h":"И с а бе к. Эмнесин айтмак элек... согуш бүттү. Бешөөбүз тең аман-эсен кайра кайттык, албетте, төш толтура орден-медаль. Антсе да турмушту кайра баштап, ар ким өз жолун издөөгө туура келди. Көп кыйынчылыгы жок эле баарыбыз институтка кирдик: Сабыр экөөбүз филфакка өттүк, Осипбай тарых факультетине, Досберген болсо – айыл чарба институтуна. Сабырдын таланты ташкындап турган кези, мен да колдон келишинче жамактап, калышчу эмесмин, (Пауза.)"},{"t":"p","h":"Андан аркысы болсо... Менимче, Сабырдын ант катары – как"},{"t":"p","h":"клятву"},{"t":"p","h":"эмне шумдук – что"},{"t":"p","h":"за дикость, небыпица"},{"t":"p","h":"төш – грудь"},{"t":"p","h":"таланты ташкын-"},{"t":"p","h":"дап – его талант перепивался через край <span class=\"pg\" data-n=\"126\">126<\/span>көз карашында кандайдыр бир өзгөрүүлөр пайда болду... Аны түшүндүрүштүн өзү да кыйын. Күндөрдүн биринде ажайып бир ырлар окуду, чоң поэманын башталышы экен... Кыскача мазмуну: «Мен согуштан чарчадым, ичиркенем кандуу-сүрдүү жүзүнөн, нечен-нечен жаш өмүрлөр жеңиш үчүн окко учуп, улуу Мекеним фашизмден бошонуп турганда, басып откөн жолумду, эч убакта кайталагым келбес эле...»"},{"t":"p","h":"Алмагүл. Ким эле согушту кайра басып өткүсү келсин? Анын неси бар?"},{"t":"p","h":"Исабек, Биздин жеңиштин даңазасын ырдоонун ордуна, каяктагы бир калпыс ойлорду айтып туруп албадыбы..."},{"t":"p","h":"Көркөмдүгү күчтүү болгону менен, ички түшүнүгү талаштуу болуп калды. «Арамдыкты адамдык менен жеңе албайсың, согушту согуш жеңет, бул чындыктан четке чыгып турууга эч кимдин укугу жок» деп айттым ага,"},{"t":"p","h":"Г үл жан. Поэманы окуп берүүчү беле силерге?"},{"t":"p","h":"түшүндүрүш кый-"},{"t":"p","h":"ын- трудно обяснить ичиркенем – вздра-"},{"t":"p","h":"гиваю, невольно передергиваюсь"},{"t":"p","h":"жеңиштин дана-"},{"t":"p","h":"засы – прославпять победу ички түшүнүгү та-"},{"t":"p","h":"лаштуу – внутреннее понятие спорно"},{"t":"v","l":["М а Ии. Улам жазганын улам окуп","берүүчү.","Досберген. Бекер кылган экен эми","ойлосом,","И са бе к. Кеп анда эмес, кеп жолдоштук"]},{"t":"p","h":"кеңешти укпай койгонунда. Мына ушуну бекер кылган."},{"t":"p","h":"Мамбет. Эч кандай бекер – мекер эмес, Ал бизди адал деп ойлогон.. анан калса түштөн кийин күйөрман болуп алыпсың... Анын өзү да, өчүп кеткен таланты да, сага бир тыйынчалык зарылдыгы жок эмеспи... Поэмасы «Добулбас үнү өчкөндө» деп аталчу."},{"t":"p","h":"Сабырдын жазганын ар качан ары карап ыйлап, бери карап күлүп, мактачу элең, суктанчу элең..."},{"t":"p","h":"И с а б е к, Азыр да мактайм, азыр да танбайм."},{"t":"p","h":"М а м б е т. Болгон адилдигиң ошобу? Өмүрүңдө бир жолу да батынып Сабырга чындыкты айтпадың."},{"t":"p","h":"Исабек, Оозуңа кара. Мен сага окшоп мушташып, жакалашкан эмесмин аны менен. Касташкан мен эмес..."},{"t":"p","h":"Айша ап а. Ээ, Мамбет, касташканың чынбы?"},{"t":"p","h":"жолдоштук кенеш"},{"t":"p","h":"– дружеский совет"},{"t":"p","h":"добулбас – неболь-"},{"t":"p","h":"шой барабан"},{"t":"p","h":"жакалашкан – не"},{"t":"p","h":"дрался, тряся за воротник касташкан – враждующий"},{"t":"p","h":"<span class=\"pg\" data-n=\"127\">127<\/span>М а м бе т. Бетке айтканым чын болчу. Анын баары жаңкы поэмадан келип чыкпадыбы. Ошондогу түшүнүгүм менен, мен аны бетке айттым: «Сен акын катары түз жолуңдан адаштың»."},{"t":"p","h":"«Көркөм өнөрдө сызып койгон түз жолдор жок, сенин ченемин мага туура келбейто,- деп ал мага жооп кайтарды. „Сенин поэман өткөндү эңсегендик, саясый ката» деп айттым. Антсем, каны ичине тартып, мени жакадан алды. Мен да карап турбадым. Андай болорун ким билиптир. Көрсө экөөбүз узак жылдарга ажырашардын алдында, эси жоктук кылган экенбиз. Чынында кеп жакалашканда эмес, Менин кечиримсиз күнөөм – жанагыдай саясый айып тагып түшүнбөстүгүм экен. Көрсө ошондо чыгармачылык жол издеп, өзү менен өзү жакалашып, изденүүнүн азап-тозогунда жүргөн турбайбы,"},{"t":"p","h":"Алмагүл. Кийин толук акталган тура. Досберген. Сабырдын ал ырлары тууралуу кандай ойлойсуң деп азыр сурасаңар бар эмеспи, мына ак дасторкон турат, башымды көп оорутпагыла дээрим ачык. А кезде болсо, унчукпай кутулганды туура көргөм. Чакырып алып сураса бирдеме айтат элек дечи. Жөнү жок жулуна бериш (попусту рваться), кудай билет, туура болот беле, же... ал мезгил өзү катаал мезгил болчу."},{"t":"p","h":"мен антмек Иосиф Татаевич."},{"t":"p","h":"элем, минтмек элем деп көкүрөк кага албайм. Анан калса Сабырың да периште эмес го, болбосо ак жеринен сүргүнгө айдалып кетмек беле. «Заман, заман» дейсиңер. Заманда не айып? Ырларынын өзү тескери болчу. Менин эркиме койгондо, мындайларды мен азыр да жакын жуутпас элем..."},{"t":"p","h":"Исабек. Кудай сактай көр! Токол эчкиге кудай мүйүз бербептир дейт. Сенден башкалары да жетишер, бөрк ал десе, баш алгандар азыр да жок эмес... Бизден да жашыраак, бизден да эптүүлөр чыгып жатпайбы."},{"t":"p","h":"Айша апа, Башым катты силерди угуп отуруп эле. Түшүнө албай койдум, сөзүңөрдү... бирге окуп... бирге чоңойуп, бир сындырым нанды тең бөлүшүп, согушта кан кечип жүрүп, түз жолуңдан адаш-"},{"t":"p","h":"тың – ты сбился с правильного пути ченем – мера, мер-"},{"t":"p","h":"ка, норма откенду энсеген-"},{"t":"p","h":"дик- стремление к прошлому саясый ката – поли-"},{"t":"p","h":"тическая ошибка каны ичине тар-"},{"t":"p","h":"тып- здесь: разозпившись саясый айып – по-"},{"t":"p","h":"литическая вина изденүүнүн азап —"},{"t":"p","h":"тозогу – муки. мучения творческого поиска"},{"t":"p","h":"кудай билет – бог"},{"t":"p","h":"знает катаал мезгил – же-"},{"t":"p","h":"стокое, свирепое время көкүрөк кага ал-"},{"t":"p","h":"байм – не могу стучать в грудь периште эмес – не"},{"t":"p","h":"ангел жакын жуутпас"},{"t":"p","h":"элем – близко не подпустил бы токол эчкиге мүйүз"},{"t":"p","h":"бербептир – не дал бог рога комолой (безрогой) козе бөрк ал десе, баш"},{"t":"p","h":"алган – велели шапку принести, а он голову отрезал"},{"t":"p","h":"башым катты – го-"},{"t":"p","h":"лова моя зэтвердела; здесь: не пойму я"},{"t":"v","l":["<span class=\"pg\" data-n=\"128\">128<\/span>бир-бириңерге жөлөк болуп келдиңер эле, Анан","бироонцун башыңа мүшкүл түшсө тааныбаган","адамдай таштап кете бергениңер кандай?","Ушундай да болобу?","И сабе к, Кайрылып Сабырга кол бербей"]},{"t":"p","h":"коюпсуңар деп ойлобоңуз, Айша апа. Ал акта-"},{"t":"v","l":["лып келгенде мына мен өзүм жетелеп барып,","редакцияга орноштурдум (устроил).Ичкиликке","берилип (пристрастился к спиртному) калган"]},{"t":"p","h":"экен, андан кетти. Башка бир жерге ориош-"},{"t":"v","l":["турсам аерге да турук ала албады. Анан кайда","кеткенин өзүм да билбей калдым,","М а м бе т. Ошол кезде биз ага жардам","көрсөтө албадык. Ар ким өз башын коргоп, өз","этегине бекинди,","Иосиф Татаевич. Мен эч"]},{"t":"p","h":"айгак болгон жокмун, бирок ошол маселени мен азыр чечсем, азыр дагы ошентмекмин,"},{"t":"p","h":"Гүл жан, Сенин бул түрүң менен турмуштагы пастыктын баарын актап кетүүгө болот."},{"t":"p","h":"Азыр ойлоп карасам, баарыңар ошондо арам-"},{"t":"v","l":["дыкка барууга жетилип калган экенсиңер.","Кимиңер иттик кылдыңар? (Исабекке) Сен","болуп жүрбө?","И с а бе к. Аны Осипбайдан сура.","Иосиф Татаевич. Эмне учун мен?","Байкап сүйлө, жигит!","И с а бе к. Институттун топ бузары сен","эмес белең, Сабырды окуудан чыгаргандагы","жыйынды сен башкарбадың беле?","Иосиф Татаевич. Кечирип","кана коёсуң! Айтууңа караганда (по-твоему)","күнөөнүн баары менде экен да, башкаларыңар","таза, күнөөсүз периште экенсиңер го. Башканы","коюп өзүңдүн баягы «ур токмоктой» макалаң","жөнүңдө айтып берчи отургандарга.","И са бе к. Бирок мении макгла жазууда","максатым эмнеде эле? Сен ошону эмне үчүн"]},{"t":"p","h":"айтпайсың? Мен газет бетинде, көпчүлүк калайык= журт алдында, өз калемдеш жолдош-"},{"t":"v","l":["торумдун чыгармачылыктагы адашууларын","сындадым.","мүшкүл – трудный,","мучительный", (Беркилердин үрөйү учат.)","Ж умуш чу. Милийса көрсөтөрү менен","эле тааныдым, биздин лесхоздук бала. Кечээ","кечинде эле көргөм... Мобу жардын түбүндө"]},{"t":"p","h":"кызыл-жаян кан болуп жатат,.. Таш тийип-"},{"t":"v","l":["тир... так чокусуна...","Досберген. Эмне деп тантырап атасың?","Жөндөп айтчы..."]},{"t":"p","h":"оңтойсуз абал-"},{"t":"v","l":["да – в неповком","положении","","таш кулатып -","сваливая камни","вниз","жыйын-терин -—","уборка"]},{"t":"p","h":"буердеги кожо-"},{"t":"v","l":["юн – здешний","хозяин","","капчыгай – ущелье"]},{"t":"p","h":"кубе болосуң – бу-"},{"t":"p","h":"дешь свидетелем үрөйү учат – силь-"},{"t":"v","l":["но испугались,","пришли в ужас","кызыл-жаян кан -","весь в крови","","жөндөп – дельно"]},{"t":"p","h":"Ж Милийса мени силерге жиберди. Эки жакка жылбасын деди. (Узакка пауза.)"},{"t":"p","h":"Иосиф Татаевич. Бизге буйрук берүүгө кандай акысы бар экен? Өлгөн адам төмөндө... ошоякта бир кокустук болгон да. Биз бу Фудзияманын чокусундабыз."},{"t":"p","h":"жылбасын – пусть"},{"t":"p","h":"не расходятся кокустук – неожиданность, несчастный случай"},{"t":"p","h":"<span class=\"pg\" data-n=\"130\">130<\/span>М а м бе т. Бирок участковый бизге эмне үчүн эскертет? Мүмкүн жар кулап өлгөндүр?"},{"t":"p","h":"Ж у м у ш ч у. Ага окшобойт. Тегерегин бүт карадык, көчкүнүн белгиси жок. Жол үстүндө он чакты таш жатат, момунчалык, мындан чоңу бар. Ошолордун бири башына дал тийсе керек."},{"t":"p","h":"ИосифТата евич. Ушерден чамалап көрсөтө аласыңбы, өлүк каерде жатат?"},{"t":"p","h":"Ж уму ш чу. Мына ушул туш. (Жар башына барып төмөн карашат.) Ушулардын эң чоңу сиз окшойсуз? Кимсиз? Кайдан келдиңиз?"},{"t":"p","h":"ИосифТа та ев и ч. Суракка жооп берүү мындай турсун, мен эчтекени билбейм, билгим да келбейт."},{"t":"p","h":"Баары тең шашып, жок шылтоолорду айтып (говоря разные отговорки, под пред. логами) жөнөй башташат. Мамбет менен Алмагул гана калышат. Мамбеттин аялы Мамбетти, Алмагцлдун күйөөсү Алмагилду чакырып, шашып кете башташат."},{"t":       var F = lsGet('libFilter', null) || { g: '', s: '' };
      var grades = [];
      list.forEach(function (b) { gradesOf(b).forEach(function (g) { if (grades.indexOf(g) < 0) grades.push(g); }); });
      grades.sort(function (a, b) { return a - b; });
      var hasSchools = list.some(function (b) { return b.school; });
      var box = $('#books');
      function chips(key, opts) {
        return '<div class="chips" data-k="' + key + '">' + opts.map(function (o) {
          return '<button data-v="' + o[0] + '"' + (String(F[key]) === String(o[0]) ? ' class="on"' : '') + '>' + esc(o[1]) + '</button>';
        }).join('') + '</div>';
      }
      function draw() {
        var html = '';
        if (list.length > 6) {
          html += chips('g', [['', t('allGrades')]].concat(grades.map(function (g) { return [g, g + ' ' + t('grade')]; })));
          if (hasSchools) html += chips('s', [['', t('allSchools')], ['ru', t('schoolRu')], ['ky', t('schoolKy')]]);
        }
        box.innerHTML = html + '<div class="cards-list"></div>';
        var cl = $('.cards-list', box);
        var shown = list.filter(function (b) {
          return (!F.g || gradesOf(b).indexOf(+F.g) >= 0) && (!F.s || !b.school || b.school === F.s);
        });
        if (!shown.length) cl.innerHTML = '<div class="loading">' + esc(t('noBooks')) + '</div>';
        shown.forEach(function (b) { cl.appendChild(bookCard(b)); });
        Array.prototype.forEach.call(box.querySelectorAll('.chips button'), function (btn) {
          btn.onclick = function () { F[btn.parentNode.getAttribute('data-k')] = btn.getAttribute('data-v'); lsSet('libFilter', F); draw(); };
        });
      }
      draw();
    }).catch(function () { $('#books').innerHTML = '<div class="loading">' + esc(t('err')) + '</div>'; });
  }

  // "7", 7, "7–9" or "10-11" -> [7], [7, 8, 9], [10, 11]
  function gradesOf(b) {
    var m = String(b.grade == null ? '' : b.grade).match(/(\d+)\s*[–-]\s*(\d+)|(\d+)/);
    if (!m) return [];
    if (m[3]) return [+m[3]];
    var out = []; for (var g = +m[1]; g <= +m[2]; g++) out.push(g); return out;
  }

  function bookCard(b) {
    var el = document.createElement('div'); el.className = 'card';
    var hasPos = !!lsGet('pos:' + b.id, null);
    var mb = (b.size / 1048576).toFixed(1);
    el.innerHTML = '<h2>' + esc(b.title) + '</h2>' + (b.subtitle ? '<div class="subt">' + esc(b.subtitle) + '</div>' : '') +
      '<div class="meta">' + esc(b.author) + (b.year ? ', ' + b.year : '') + '<br>' + esc(b.grade + ' ' + t('grade') + ' · ' + b.langName + ' · ' + mb + ' ' + t('mb')) + '</div>' +
      '<div class="row"><a class="btn primary" href="#/read/' + esc(b.id) + '">' + esc(hasPos ? t('cont') : t('read')) + '</a>' +
      '<button class="btn dl"></button></div>' +
      '<div class="progress" hidden><i></i></div>' +
      (b.standalone ? '<div class="row" style="margin-top:8px"><a class="btn" href="books/' + esc(b.id) + '/' + esc(b.standalone) + '" download>' + esc(t('file')) + '</a></div><div class="note">' + esc(t('fileNote')) + '</div>' : '');
    var btn = $('.dl', el), prog = $('.progress', el), bar = $('.progress i', el);

    function setState(done) {
      btn.disabled = false;
      btn.textContent = done ? '✓ ' + t('remove') : '⬇ ' + t('download');
      btn.title = done ? t('downloaded') : '';
      btn.onclick = done ? remove : download;
      if (done) { prog.hidden = false; bar.style.width = '100%'; } else { prog.hidden = true; }
    }
    function download() {
      if (!window.caches) { toast(t('noStorage')); return; }
      btn.disabled = true; btn.textContent = t('downloading'); prog.hidden = false; bar.style.width = '0';
      downloadBook(b, function (f) { bar.style.width = Math.round(f * 100) + '%'; })
        .then(function () { setState(true); toast(t('dlDone')); })
        .catch(function () { setState(false); toast(navigator.onLine === false ? t('offline') : t('err')); });
    }
    function remove() {
      caches.keys().then(function (keys) {
        return Promise.all(keys.filter(function (k) { return k.indexOf('book-' + b.id + '-') === 0; }).map(function (k) { return caches.delete(k); }));
      }).then(function () { lsDel('dl:' + b.id); setState(false); toast(t('removed')); });
    }
    setState(false);
    if (window.caches) {
      caches.open(cacheName(b)).then(function (c) { return c.match('books/' + b.id + '/book.json'); })
        .then(function (r) { setState(!!r && lsGet('dl:' + b.id, null) === b.v); });
    }
    return el;
  }

  function downloadBook(b, onProgress) {
    var base = 'books/' + b.id + '/';
    var cache;
    return caches.open(cacheName(b)).then(function (c) {
      cache = c;
      return fetch(base + 'book.json');
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return cache.put(base + 'book.json', r.clone()).then(function () { return r.json(); });
    }).then(function (book) {
      // app shell too, in case the service worker has not finished installing yet
      var urls = ['./', 'index.html', 'app.js', 'style.css', 'books/index.json'].concat(book.images.map(function (i) { return base + i; }));
      var done = 0;
      // a few requests in parallel: fast on 3G, gentle on slow phones
      var queue = urls.slice();
      function worker() {
        var u = queue.shift();
        if (!u) return Promise.resolve();
        return cache.match(u).then(function (hit) {
          if (hit) return;
          return fetch(u).then(function (r) { if (!r.ok) throw new Error(u); return cache.put(u, r); });
        }).then(function () { done++; onProgress(done / urls.length); return worker(); });
      }
      return Promise.all([worker(), worker(), worker(), worker()]);
    }).then(function () {
      lsSet('dl:' + b.id, b.v);
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      return caches.keys().then(function (keys) { // drop older versions of this book
        return Promise.all(keys.filter(function (k) { return k.indexOf('book-' + b.id + '-') === 0 && k !== cacheName(b); }).map(function (k) { return caches.delete(k); }));
      });
    });
  }

  // ================================================================ READER
  var ICONS = {
    back: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
    toc: '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
    set: '<svg viewBox="0 0 24 24"><path d="M4 20l5-14h2l5 14M6.5 14h7"/><path d="M17 11l2.5-6L22 11M17.8 9h3.4"/></svg>',
    close: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };

  function openReader(id) {
    app.innerHTML = '<div class="loading">' + esc(t('loading')) + '</div>';
    var p = EMB ? Promise.resolve(EMB) : fetchJSON('books/' + id + '/book.json');
    p.then(function (book) { startReader(book, EMB ? '' : 'books/' + id + '/'); })
      .catch(function () {
        app.innerHTML = '<div class="lib"><p class="loading">' + esc(navigator.onLine === false ? t('offline') : t('err')) +
          '</p><p style="text-align:center"><a class="btn" href="#/">' + esc(t('back')) + '</a></p></div>';
      });
  }

  function startReader(book, base) {
    document.title = book.title;
    var chapters = book.chapters;
    var posKey = 'pos:' + book.id;

    app.innerHTML =
      '<div class="reader">' +
      '<div class="viewport"><div class="flow" lang="' + esc(book.lang) + '"></div></div>' +
      '<div class="foot"><span class="t"></span><span class="n"></span></div>' +
      '<div class="bar top">' + (EMB ? '' : '<a class="icon" href="#/" aria-label="' + esc(t('back')) + '">' + ICONS.back + '</a>') +
      '<div class="title">' + esc(book.title) + '</div>' +
      '<button class="icon b-toc" aria-label="' + esc(t('contents')) + '">' + ICONS.toc + '</button>' +
      '<button class="icon b-set" aria-label="' + esc(t('settings')) + '">' + ICONS.set + '</button></div>' +
      '<div class="bar bottom"><div class="info"><span class="i1"></span><span class="i2"></span></div>' +
      '<input type="range" class="slider" min="0" max="1" step="1"></div>' +
      '</div>';

    var reader = $('.reader'), vp = $('.viewport'), flow = $('.flow'), footT = $('.foot .t'), footN = $('.foot .n');
    var slider = $('.slider'), i1 = $('.bar .i1'), i2 = $('.bar .i2');

    // original textbook page numbers -> chapter, for "go to page" and the slider
    var pgChapter = {}, pgList = [];
    chapters.forEach(function (c, ci) {
      c.blocks.forEach(function (b) {
        var html = b.h || (b.l ? b.l.join(' ') : '');
        var re = /data-n="(\d+)"/g, m;
        while ((m = re.exec(html))) { var n = +m[1]; if (!(n in pgChapter)) { pgChapter[n] = ci; pgList.push(n); } }
      });
    });
    pgList.sort(function (a, b) { return a - b; });
    if (pgList.length) { slider.min = 0; slider.max = pgList.length - 1; }

    var ch = -1, page = 0, pages = 1, step = 0, colW = 0, H = 0;
    var blockPage = [], pgMarks = []; // [{n, page}]

    function src(s) { return /^data:/.test(s) ? s : base + s; }

    function blockHTML(b, i) {
      var a = ' data-i="' + i + '"';
      switch (b.t) {
        case 'h1': case 'h2': case 'h3': return '<' + b.t + a + '>' + b.h + '</' + b.t + '>';
        case 'p': return '<p' + a + (b.ni ? ' class="ni"' : '') + '>' + b.h + '</p>';
        case 'box': return '<div class="box"' + a + '>' + b.h + '</div>';
        case 'raw': return b.h.replace(/^<(\w+)/, '<$1' + a).replace(/src="img\//g, 'src="' + base + 'img/');
        case 'v': return '<div class="verse"' + a + '>' + b.l.map(function (l) { return l === '' ? '<div class="gap"></div>' : '<div>' + l + '</div>'; }).join('') + '</div>';
        case 'img': return '<figure' + a + '><img data-w="' + b.w + '" data-h="' + b.ht + '"' + (b.dw ? ' style="width:' + b.dw + 'em"' : '') + ' src="' + esc(src(b.src)) + '" alt="' + esc(b.alt || '') + '">' +
          (b.cap ? '<figcaption>' + b.cap + '</figcaption>' : '') + '</figure>';
      }
      return '';
    }

    function renderChapter(ci) {
      ch = ci;
      var c = chapters[ci];
      var html = c.blocks.map(blockHTML).join('');
      if (ci === chapters.length - 1) html += '<div class="endnote">— ' + esc(t('end')) + ' —<br>' + esc(t('source')) + ': ' + esc(book.source && book.source.site || '') + '</div>';
      flow.innerHTML = html + '<div class="end"></div>';
      layout();
    }

    function layout() {
      var W = vp.clientWidth; H = vp.clientHeight;
      var pad = Math.max(18, Math.round((W - 680) / 2));
      colW = W - 2 * pad; step = W;
      flow.style.width = colW + 'px';
      flow.style.marginLeft = pad + 'px';
      flow.style.columnWidth = colW + 'px';
      flow.style.columnGap = (2 * pad) + 'px';
      // size images explicitly so pages do not shift when pictures load
      var maxH = H - 32 - 3 * S.fs;
      Array.prototype.forEach.call(flow.querySelectorAll('img[data-w]'), function (img) {
        var w = +img.getAttribute('data-w'), h = +img.getAttribute('data-h');
        var dw = Math.min(colW, maxH * w / h, w * 1.6);
        img.style.width = Math.round(dw) + 'px'; img.style.height = Math.round(dw * h / w) + 'px';
      });
      var fr = flow.getBoundingClientRect();
      var endEl = flow.lastChild;
      pages = Math.max(1, Math.floor((endEl.getBoundingClientRect().left - fr.left + 2) / step) + 1);
      blockPage = [];
      Array.prototype.forEach.call(flow.querySelectorAll('[data-i]'), function (el) {
        blockPage[+el.getAttribute('data-i')] = Math.floor((el.getBoundingClientRect().left - fr.left + 2) / step);
      });
      pgMarks = Array.prototype.map.call(flow.querySelectorAll('.pg'), function (el) {
        return { n: +el.getAttribute('data-n'), page: Math.floor((el.getBoundingClientRect().left - fr.left + 2) / step) };
      });
    }

    function curBlock() {
      var b = 0;
      for (var i = 0; i < blockPage.length; i++) { if (blockPage[i] != null && blockPage[i] <= page) b = i; else if (blockPage[i] > page) break; }
      return b;
    }
    function bookPage() { // textbook page shown at top of this screen
      var n = null;
      for (var i = 0; i < pgMarks.length; i++) { if (pgMarks[i].page <= page) n = pgMarks[i].n; else break; }
      if (n == null) { // before first marker of this chapter: previous chapter's last page
        for (var j = pgList.length - 1; j >= 0; j--) if (pgChapter[pgList[j]] < ch) { n = pgList[j]; break; }
      }
      return n == null ? (pgMarks[0] ? pgMarks[0].n : null) : n;
    }

    function show(p, anim) {
      page = Math.max(0, Math.min(pages - 1, p));
      flow.classList.toggle('anim', !!anim);
      flow.style.transform = 'translate3d(' + (-page * step) + 'px,0,0)';
      var bp = bookPage();
      footT.textContent = chapters[ch].title;
      footN.textContent = (bp != null ? t('page') + ' ' + bp + ' · ' : '') + (page + 1) + '/' + pages;
      i1.textContent = chapters[ch].title;
      i2.textContent = bp != null ? t('page') + ' ' + bp + ' / ' + pgList[pgList.length - 1] : '';
      if (bp != null && document.activeElement !== slider) slider.value = pgList.indexOf(bp);
      lsSet(posKey, { ch: ch, b: curBlock(), at: Date.now() });
    }

    function goBlock(ci, bi) {
      if (ci !== ch) renderChapter(ci);
      show(blockPage[bi] || 0, false);
    }
    function goBookPage(n) {
      if (!(n in pgChapter)) { toast(t('notFound')); return false; }
      if (pgChapter[n] !== ch) renderChapter(pgChapter[n]);
      for (var i = 0; i < pgMarks.length; i++) if (pgMarks[i].n === n) { show(pgMarks[i].page, false); return true; }
      show(0, false); return true;
    }
    function next() {
      if (page < pages - 1) show(page + 1, true);
      else if (ch < chapters.length - 1) { renderChapter(ch + 1); show(0, false); }
      else show(page, true);
    }
    function prev() {
      if (page > 0) show(page - 1, true);
      else if (ch > 0) { renderChapter(ch - 1); show(pages - 1, false); }
      else show(0, true);
    }
    function relayout() { var b = curBlock(); layout(); show(blockPage[b] || 0, false); }

    // ---- touch: swipe to turn pages
    var sx = 0, sy = 0, st = 0, dx = 0, horiz = null, touching = false;
    vp.addEventListener('touchstart', function (e) {
      if (e.touches.length > 1) { touching = false; return; }
      touching = true; horiz = null; dx = 0;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
      flow.classList.remove('anim');
    }, { passive: true });
    vp.addEventListener('touchmove', function (e) {
      if (!touching) return;
      var x = e.touches[0].clientX, y = e.touches[0].clientY;
      dx = x - sx;
      if (horiz === null && (Math.abs(dx) > 8 || Math.abs(y - sy) > 8)) horiz = Math.abs(dx) > Math.abs(y - sy);
      if (horiz) {
        e.preventDefault();
        var atEdge = (dx > 0 && page === 0 && ch === 0) || (dx < 0 && page === pages - 1 && ch === chapters.length - 1);
        flow.style.transform = 'translate3d(' + (-page * step + dx * (atEdge ? 0.25 : 1)) + 'px,0,0)';
      }
    }, { passive: false });
    vp.addEventListener('touchend', function () {
      if (!touching) return; touching = false;
      if (!horiz) return;
      var v = Math.abs(dx) / Math.max(1, Date.now() - st);
      if (dx < -60 || (dx < -20 && v > 0.3)) next();
      else if (dx > 60 || (dx > 20 && v > 0.3)) prev();
      else show(page, true);
    });

    // ---- taps: left third back, right third forward, middle shows menus
    vp.addEventListener('click', function (e) {
      var sel = window.getSelection && String(window.getSelection());
      if (sel) return;
      if (reader.classList.contains('ui')) { reader.classList.remove('ui'); return; }
      var x = e.clientX / vp.clientWidth;
      if (x < 0.3) prev(); else if (x > 0.7) next();
      else if (e.target.tagName === 'IMG' && e.target.closest('figure')) openZoom(e.target);
      else if (e.target.closest && e.target.closest('figure svg')) {
        var sv = e.target.closest('figure svg'), vb = (sv.getAttribute('viewBox') || '0 0 300 150').split(/\s+/);
        var im = document.createElement('img');
        im.setAttribute('data-w', Math.round(vb[2] * 4)); im.setAttribute('data-h', Math.round(vb[3] * 4));
        var xml = sv.outerHTML.indexOf('xmlns=') < 0 ? sv.outerHTML.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"') : sv.outerHTML;
        im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml.replace(/style="[^"]*"/, ''));
        openZoom(im);
      }
      else reader.classList.add('ui');
    });
    // ---- picture viewer: tap a picture to see it full screen; tap again to enlarge, scroll to move
    function openZoom(img) {
      var z = document.createElement('div'); z.className = 'zoom';
      var big = false;
      z.innerHTML = '<div class="zoom-in"><img alt=""></div><button class="icon zoom-x" aria-label="' + esc(t('close')) + '">' + ICONS.close + '</button>';
      var zi = $('img', z); zi.src = img.src;
      var fit = function () {
        var W = window.innerWidth, H = window.innerHeight, w = +img.getAttribute('data-w'), h = +img.getAttribute('data-h');
        var s = Math.min(W / w, H / h) * (big ? 2.5 : 1);
        zi.style.width = Math.round(w * s) + 'px'; zi.style.height = 'auto'; zi.style.maxWidth = 'none'; zi.style.maxHeight = 'none';
      };
      zi.onclick = function (e) {
        var inr = $('.zoom-in', z), r = zi.getBoundingClientRect();
        var fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
        big = !big; fit();
        if (big) { inr.scrollLeft = fx * zi.offsetWidth - window.innerWidth / 2; inr.scrollTop = fy * zi.offsetHeight - window.innerHeight / 2; }
      };
      $('.zoom-x', z).onclick = function () { z.remove(); document.removeEventListener('keydown', zkey); };
      var zkey = function (e) { if (e.key === 'Escape') { z.remove(); document.removeEventListener('keydown', zkey); } };
      document.addEventListener('keydown', zkey);
      document.body.appendChild(z); fit();
    }

    function onKey(e) {
      if ($('.zoom')) return;
      if ($('.sheet')) { if (e.key === 'Escape') closeSheet(); return; }
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    }

    var rt; function onResize() { clearTimeout(rt); rt = setTimeout(relayout, 150); }

      wheelLock = Date.now() + 350; if (d > 0) next(); else prev();
    }, { passive: true });

    slider.addEventListener('input', function () { i2.textContent = t('page') + ' ' + pgList[+slider.value] + ' / ' + pgList[pgList.length - 1]; });
    slider.addEventListener('change', function () { goBookPage(pgList[+slider.value]); });

    // ---- sheets
    function closeSheet() { var a = $('.sheet'), b = $('.sheet-bg'); if (a) a.remove(); if (b) b.remove(); }
    function openSheet(html) {
      closeSheet();
      var bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.onclick = closeSheet;
      var sh = document.createElement('div'); sh.className = 'sheet'; sh.innerHTML = html;
      document.body.appendChild(bg); document.body.appendChild(sh);
      return sh;
    }

    $('.b-toc').onclick = function () {
      var html = '<h3>' + esc(t('contents')) + '</h3>' +
        '<div class="goto"><input type="number" inputmode="numeric" placeholder="' + esc(t('gotoPage')) + '"><button class="btn primary">' + esc(t('go')) + '</button></div><div class="toc">';
      var lastSec = null;
      chapters.forEach(function (c, ci) {
        if (c.section && c.section !== lastSec) html += '<div class="sec">' + esc(c.section) + '</div>';
        lastSec = c.section || lastSec;
        html += '<a href="#" data-c="' + ci + '" data-b="0"' + (ci === ch ? ' class="cur"' : '') + '>' + esc(c.title) +
          (c.pages ? '<span class="p">' + c.pages[0] + '</span>' : '') + '</a>';
        if (c.sub) {
          c.sub.forEach(function (s) {
            if (s.b != null) html += '<a href="#" class="sub" data-c="' + ci + '" data-b="' + s.b + '">' + esc(s.title) + '</a>';
          });
        } else {
          c.blocks.forEach(function (b, bi) {
            if (b.t === 'h2' && bi > 0) html += '<a href="#" class="sub" data-c="' + ci + '" data-b="' + bi + '">' + b.h.replace(/<[^>]+>/g, '') + '</a>';
          });
        }
      });
      var sh = openSheet(html + '</div>');
      var cur = $('.cur', sh); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'center' });
      sh.addEventListener('click', function (e) {
        var a = e.target.closest('a[data-c]'); if (!a) return;
        e.preventDefault(); closeSheet(); reader.classList.remove('ui');
        goBlock(+a.getAttribute('data-c'), +a.getAttribute('data-b'));
      });
      var inp = $('input', sh);
      function go() { if (goBookPage(parseInt(inp.value, 10))) { closeSheet(); reader.classList.remove('ui'); } }
      $('.goto button', sh).onclick = go;
      inp.onkeydown = function (e) { if (e.key === 'Enter') go(); };
    };

    $('.b-set').onclick = function () {
      function seg(key, opts) {
        return '<div class="seg" data-k="' + key + '">' + opts.map(function (o) {
          return '<button data-v="' + o[0] + '"' + (o[2] ? ' class="' + o[2] + (String(S[key]) === String(o[0]) ? ' on' : '') + '"' : (String(S[key]) === String(o[0]) ? ' class="on"' : '')) + '>' + o[1] + '</button>';
        }).join('') + '</div>';
      }
      var sh = openSheet(
        '<h3>' + esc(t('settings')) + '</h3>' +
        '<div class="set"><label>' + esc(t('fontSize')) + '</label><div class="seg"><button data-fs="-2" style="font-size:14px">A−</button><button class="fsv" disabled>' + S.fs + '</button><button data-fs="2" style="font-size:20px">A+</button></div></div>' +
        '<div class="set"><label>' + esc(t('theme')) + '</label>' + seg('theme', [['light', t('light'), 'swatch'], ['sepia', t('sepia'), 'swatch'], ['dark', t('dark'), 'swatch'], ['contrast', t('contrast'), 'swatch']]) + '</div>' +
        '<div class="set"><label>' + esc(t('font')) + '</label>' + seg('font', [['serif', '<span style="font-family:Georgia,serif">' + esc(t('serif')) + '</span>'], ['sans', '<span style="font-family:Roboto,Arial,sans-serif">' + esc(t('sans')) + '</span>']]) + '</div>' +
        '<div class="set"><label>' + esc(t('spacing')) + '</label>' + seg('lh', [[1.35, '1.35'], [1.55, '1.55'], [1.8, '1.8']]) + '</div>' +
        '<div class="set"><label>' + esc(t('lang')) + '</label>' + seg('ui', [['ru', 'Русский'], ['ky', 'Кыргызча']]) + '</div>');
      sh.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.hasAttribute('data-fs')) {
          S.fs = Math.max(13, Math.min(34, S.fs + +b.getAttribute('data-fs')));
          $('.fsv', sh).textContent = S.fs;
        } else {
          var k = b.parentNode.getAttribute('data-k'); if (!k) return;
          var v = b.getAttribute('data-v'); S[k] = k === 'lh' ? +v : v;
          Array.prototype.forEach.call(b.parentNode.children, function (x) { x.classList.toggle('on', x === b); });
          if (k === 'ui') { applySettings(); closeSheet(); route(); return; }
        }
        applySettings(); relayout();
      });
    };

    cleanup = function () {
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('resize', onResize);
      closeSheet();
    };

    var pos = lsGet(posKey, null);
    if (pos && chapters[pos.ch]) goBlock(pos.ch, pos.b || 0); else { renderChapter(0); show(0, false); }
    // fonts can change metrics after first paint
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  }

  // ---------------------------------------------------------------- boot
  applySettings();
  window.addEventListener('hashchange', route);
  route();
  if (!EMB && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline support unavailable */ });
  }
})();
</script>
</body>
</html>

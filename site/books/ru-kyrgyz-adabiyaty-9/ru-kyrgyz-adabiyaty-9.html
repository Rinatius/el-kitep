<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Кыргыз адабияты 9</title>
<style>/* Mobile textbook reader. No external fonts or libraries: everything works offline. */
:root {
  --bg: #ffffff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3;
  --panel: #f6f6f6; --accent: #1f6feb; --accent-fg: #ffffff;
  --fs: 19px; --lh: 1.55;
  --font: Georgia, "Noto Serif", "DejaVu Serif", "Times New Roman", serif;
  --bar-h: 48px; --foot-h: 28px;
}
[data-theme="sepia"] { --bg: #f5ecd9; --fg: #4a3b2a; --muted: #8a7458; --line: #e0d2b4; --panel: #ece0c6; --accent: #9a5b13; }
[data-theme="dark"]  { --bg: #111315; --fg: #d8d8d8; --muted: #8c8c8c; --line: #2a2d31; --panel: #1b1e21; --accent: #6ea8ff; --accent-fg: #0b0b0b; }
[data-theme="contrast"] { --bg: #000000; --fg: #ffffff; --muted: #c8c8c8; --line: #444; --panel: #151515; --accent: #ffd400; --accent-fg: #000; }
[data-font="sans"] { --font: Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 16px/1.4 Roboto, "Noto Sans", Arial, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- Library ---------- */
.lib { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lib h1 { font-size: 22px; margin: 8px 0 4px; }
.lib .sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; background: var(--panel); }
.card h2 { font-size: 18px; margin: 0 0 4px; }
.card .meta { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
.card .subt { font-size: 14px; margin: 0 0 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.chips button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); color: inherit; }
.chips button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: .5; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.lib-foot { color: var(--muted); font-size: 13px; margin-top: 24px; }
.lib-foot select { font: inherit; }

/* ---------- Reader ---------- */
.reader { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; user-select: text; }
.viewport { position: absolute; left: 0; right: 0; top: 0; bottom: var(--foot-h); overflow: hidden; }
.flow {
  height: 100%; column-fill: auto; padding: 20px 0 12px;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  will-change: transform; transform: translate3d(0,0,0);
  hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
}
.flow.anim { transition: transform .25s ease-out; }
.flow p { margin: 0 0 .15em; text-indent: 1.4em; text-align: left; }
.flow p.ni { text-indent: 0; }
.flow h1, .flow h2, .flow h3 { font-family: Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.25; break-after: avoid; page-break-after: avoid; }
.flow h1 { font-size: 1.35em; margin: .2em 0 .8em; text-align: center; }
.flow h2 { font-size: 1.15em; margin: 1.1em 0 .5em; }
.flow h3 { font-size: 1.0em; margin: 1em 0 .4em; }
.flow .verse { margin: .6em 0 .8em 1em; break-inside: auto; }
.flow .verse div { text-indent: -1em; padding-left: 1em; text-align: left; }
.flow .verse .gap { height: .7em; }
.flow figure { margin: .8em 0; text-align: center; break-inside: avoid; page-break-inside: avoid; }
.flow figure img { max-width: 100%; height: auto; border-radius: 4px; background: var(--panel); }
.flow figcaption { font-size: .8em; color: var(--muted); margin-top: .3em; }
.flow .box { border-left: 3px solid var(--accent); padding: .1em 0 .1em .7em; margin: .7em 0; }
.flow .pg { font: 11px/1 Roboto, Arial, sans-serif; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 4px; margin: 0 3px; vertical-align: 2px; text-indent: 0; white-space: nowrap; user-select: none; }
.flow .end { height: 1px; }
.flow .endnote { text-align: center; color: var(--muted); font-size: .8em; margin-top: 2em; font-family: Roboto, Arial, sans-serif; }
[data-theme="dark"] .flow img, [data-theme="contrast"] .flow img { filter: brightness(.9); }

.foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot-h); display: flex; align-items: center;
  justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.foot .t { overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }

.bar { position: absolute; left: 0; right: 0; background: var(--panel); border-color: var(--line); z-index: 5;
  transition: transform .2s; display: flex; align-items: center; }
.bar.top { top: 0; height: var(--bar-h); border-bottom: 1px solid var(--line); transform: translateY(-100%); padding: 0 4px; }
.bar.bottom { bottom: 0; border-top: 1px solid var(--line); transform: translateY(100%); padding: 10px 16px 14px; flex-direction: column; align-items: stretch; gap: 6px; }
.reader.ui .bar { transform: none; }
.bar .title { flex: 1; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.bar .info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* ---------- Sheets (TOC, settings) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85%; overflow: auto; background: var(--bg);
  border-radius: 16px 16px 0 0; z-index: 11; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
.sheet h3 { margin: 10px 0 12px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.toc a { display: block; padding: 11px 4px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 15px; }
.toc a.sub { padding-left: 20px; font-size: 14px; color: var(--muted); }
.toc a.cur { color: var(--accent); font-weight: 600; }
.set { margin: 14px 0; }
.set label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; }
.seg button.on { border: 2px solid var(--accent); font-weight: 600; }
.swatch[data-v="light"] { background: #fff; color: #1b1b1b; }
.swatch[data-v="sepia"] { background: #f5ecd9; color: #4a3b2a; }
.swatch[data-v="dark"] { background: #111315; color: #d8d8d8; }
.swatch[data-v="contrast"] { background: #000; color: var(--accent-fg); }
.goto { display: flex; gap: 8px; }
.goto input { flex: 1; min-height: 44px; font-size: 16px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px;
  border-radius: 20px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Textbook elements produced by tools/convert_pdf.py ---------- */
.flow .tasks, .flow .gloss { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45;
  background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0; }
.flow .tasks p, .flow .gloss p { margin: 0 0 .35em; text-align: left; }
.flow .gloss { border-left: 3px solid var(--accent); }
.flow p.note { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; font-style: italic; text-indent: 0; margin: .6em 0; }
.flow p.attr { text-align: right; text-indent: 0; font-style: italic; color: var(--muted); margin: .1em 0 .8em; }
.flow p.sep { text-align: center; text-indent: 0; color: var(--muted); margin: .5em 0; letter-spacing: .3em; }
.flow h2 .pg, .flow h3 .pg { font-weight: normal; }
.toc .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 4px 2px; }
.toc a .p { float: right; color: var(--muted); font-size: 13px; margin-left: 8px; }

/* ---------- Elements produced by tools/convert_layout.py (typeset textbooks) ---------- */
.flow figure img { cursor: zoom-in; }
.flow h4.mk { font: 700 .78em/1.3 Roboto, "Noto Sans", Arial, sans-serif; letter-spacing: .05em; color: var(--accent);
  margin: 1em 0 .3em; break-after: avoid; page-break-after: avoid; }
.flow p.hl { color: var(--accent); text-indent: 0; }
.flow p.small { font-size: .82em; text-indent: 0; color: var(--muted); }
.flow sup, .flow sub { font-size: .7em; line-height: 0; }
.flow .kbox { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45; background: var(--panel);
  border-radius: 8px; padding: .45em .7em; margin: .5em 0; border-left: 3px solid var(--accent); }
.flow .kbox > b { display: block; }
.flow .frame { background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0;
  font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; line-height: 1.45; }
.flow .frame p { text-indent: 0; margin: 0 0 .35em; text-align: left; }
.flow .tbl { margin: .8em 0; font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .8em; line-height: 1.35; }
.flow .tbl .tt { font-weight: 600; text-indent: 0; text-align: center; margin-bottom: .3em; }
.flow .tbl table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.flow .tbl th, .flow .tbl td { border: 1px solid var(--line); padding: .3em .35em; vertical-align: top; text-align: left; overflow-wrap: anywhere; hyphens: auto; }
.flow .tbl th { background: var(--panel); }
.flow .tbl tr { break-inside: avoid; page-break-inside: avoid; }

.zoom { position: fixed; inset: 0; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; background: rgba(0,0,0,.92); z-index: 30; }
.zoom-in { position: absolute; inset: 0; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
.zoom-in img { margin: auto; flex: none; touch-action: pan-x pan-y; object-fit: contain; background: #fff; cursor: zoom-in; }
.zoom-x { position: absolute; top: 8px; right: 8px; color: #fff; background: rgba(0,0,0,.5); z-index: 31; }
.flow h4.sh { font: 700 .95em/1.3 Roboto, "Noto Sans", Arial, sans-serif; text-align: center; margin: .8em 0 .4em; break-after: avoid; page-break-after: avoid; }

/* maths books */
.flow h4.ex, .flow h4.try { font-family: Roboto, Arial, sans-serif; margin: 1.1em 0 .3em; font-size: 1em; }
.flow h4.ex { display: inline-block; background: #f7e400; color: #111; padding: .1em .6em; border-radius: 3px; }
.flow h4.try { color: var(--accent); }
.flow p.goal { font-size: .85em; text-indent: 0; background: var(--panel); border-radius: 8px; padding: .4em .7em; }
.flow b.bd { display: inline-block; text-indent: 0; padding: 0 .4em; border-radius: 1em; background: var(--fg); color: var(--bg);
  font: bold .8em/1.45 Roboto, Arial, sans-serif; margin-right: .2em; }
.flow b.nb { display: inline-block; text-indent: 0; min-width: 1.4em; border-radius: 4px; background: var(--accent); color: var(--accent-fg);
  text-align: center; font-size: .8em; margin-right: .3em; }
.flow .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.15; margin: 0 .1em; }
.flow .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .15em; }
.flow p.ml { text-indent: 0; padding-left: 1em; }
.flow p.side { font-size: .85em; }
.flow details.ans { margin: .3em 0 .8em; font-size: .9em; }
.flow details.ans summary { color: var(--accent); cursor: pointer; font-family: Roboto, Arial, sans-serif; }

/* wide tables become one card per row on phones */
@media (max-width: 560px) {
  .flow .tbl.cards table, .flow .tbl.cards tbody, .flow .tbl.cards tr, .flow .tbl.cards td { display: block; width: auto; }
  .flow .tbl.cards tr:first-child { display: none; }
  .flow .tbl.cards tr { border: 1px solid var(--line); border-radius: 8px; margin: .5em 0; padding: .3em .5em; }
  .flow .tbl.cards td { border: 0; padding: .15em 0; }
  .flow .tbl.cards td::before { content: attr(data-l); display: block; font: 600 .75em/1.3 Roboto, Arial, sans-serif; color: var(--muted); }
  .flow .tbl.cards td:first-child { font-weight: 600; }
}
.flow figure.vec svg { max-width: 100%; height: auto; display: inline-block; background: #fff; border-radius: 4px; cursor: zoom-in; }
[data-theme="dark"] .flow figure.vec svg, [data-theme="contrast"] .flow figure.vec svg { filter: brightness(.9); }
.flow .rt { border-top: 1px solid currentColor; padding-top: 1px; margin-left: 1px; }
.flow .it { display: inline-block; max-width: 100%; margin-right: .9em; text-indent: 0; }
</style>
</head>

ова","b":3},{"title":"Кыргыз Республикасынын Билим берцц жана","b":7},{"title":"Бишкек – 2013","b":9}],"pages":[0,3]},{"title":"ЭЛДИК ООЗЕКИ ЧЫГАРМАЧЫЛЫК","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"4\">4<\/span>ЭЛДИК ООЗЕКИ ЧЫГАРМАЧЫЛЫК"},{"t":"p","h":"Кыргыз элинин оозеки чыгармачылыгынын тамыры алыскы доорлорго барып такалат, бери дегенде эле эки миң (самое меньшее две тысячи) жылдыкты камтыйт. Бизге чейин жеткен жазма булактарга, адабий эстеликтерге таянсак, кыргыздардын оозеки чыгармаларынын идеялык-жанрдык курамы өтө бай, кенен жана көп түрдүү. Элдик фольклор муундан-муунга оозеки түрүндө өтүп, кылымдар бою сакталып келген. Орто кылымдарда мазмуну, формасы, стили жагынан олуттуу (серьезный, существенный) өзгөрүүлөргө учурап отуруп, айрым үлгүлөрү (некоторые образцы) классикалык деңгээлге (уровень) жетип, жалпы адамзаттык маданий казынага айланган, Академик В. В. Радлов: «Кыргыздардын элдик поэзиясы өнүгүүнүн эң жогорку деңгээлине жеткен, бул эл сөздү өтө бийик тутуп, барктаган»,- деп айтканында калет жок (безошибочно)."},{"t":"p","h":"Оозеки элдик чыгармачылыктын үч чоң текке (түргө) бөлүнөрүн мурунку класстарда окугансыңар. Булар: лирикалык, эпикалык, дидактикалык тек."},{"t":"p","h":"Лирикалык тек – элдик ырлар жанрындагы чыгармалар: арман, кошок, эмгек ырлары, ырым-жырым ырлары, каада-салт ырлары."},{"t":"p","h":"Эпикалык түргө мифтер, жөө жомоктор, эпостор, дастандар, уламыштар, тамсилдер кирет."},{"t":"p","h":"Дидактикалык чыгармалар деп макал-лакаптарды, табышмактарды, санат-насыят ырларын, үлгү жана терме ырларын айтабыз."},{"t":"p","h":"Элдик эпостор, макал-лакаптар, жомоктор, элдик ырлар – баары тең көркөм эстетикалык мааниге ээ. Эпостордун көлөмүнө жараша (улуу жана кенже) жана мазмунуна карата (баатырдык жана турмуштук-социалдык) болуп бөлүнөрүн билесиңер. Алдыда баатырдык улуу эпостор менен кеңири окуп таанышасыңар,"},{"t":"p","h":"Эл өзүнүн көп кылымдык социалдык-тарыхый тажрыйбасын макал-лакаптарында жалпылап, аны негизделген учкул сөз түрүндө айткан. Макал-лакаптарда элдин жаштарды эмгекчилдикке, кайраттуулукка, улууларга урмат менен мамиле кылууга тарбиялаган көз караштары топтолгон. Мисалы, эмгектин ролу адамдардын өз ара мамилелеринин материалдык негизи гана болбостон, жогорку адеп-ахлактык (нравственный) да фактору экени төмөнкүдөй кыргыз эл макалдарында айкын көрүнөт: «Кетмен чаппасаң нан жок», «Эмгектүү кулда чарчоо жок», «Аракет кылсаң – берекет», «Бекерпоз үч үйдүн ашын аңдыса, иштерман беш адамды багат»."},{"t":"p","h":"Жомоктордо кыргыздардын көчмөн турмушу, күнүмдүк жашоотиричилиги, айлана-чөйрөгө мамилеси, улуттук тамактары жана <span class=\"pg\" data-n=\"5\">5<\/span>суусундуктары чагылдырылат. Ошондой эле кыргыз эли мекендеген жердин жаратылышы, анын тоолуу жайыттары, өсүмдүктөрү, жаныбарлары жөнүндө кеңири баяндалат. Кыргыз жомокторунун маанилүү өзгөчөлүгү – анын санат-насыят түрүндө айтылышы. Жаңы сөздөр:"},{"t":"v","l":["доор – век, эпоха","такалат – упирается","камтыйт – соединяет, охватывает","маданий – культурный","тутуп – син.: кармап; держа","","Эстегиле! Тааныш создор:","барктаган – ценил"]},{"t":"p","h":"учкул сөз – крылатое слово, выра-"},{"t":"p","h":"жение өзгөчөлүк – особенность"},{"t":"p","h":"муундан-муунга – из поколения п поколение {5-кл., 6-б.; Кыргыз элдик оозеки чыгармачылыгынан: Бул көркөм мурас эл арасынан чыккан таланттуу адамдар тарабынан жаралып, муундан-муунга оозеки өтүп турган. 7-кл., 1-б.; «Киришүү. Элдик оозеки чыгармачылыко: Элдик чыгармалар муундан-муунга оозеки түрдө сакталып келген.) казына – казна, сокровищница (7-кл., 88-б. «Эр Табылды» эпосунун мазмунунан: Он төрт жашка чыкканда Табылды атасынын казынасын ачып, жоо-жарагын алат.) көз караш – взгляд (7-кл.‚ 1-6, Киришүү. Элдик оозеки чыгармачылык: Эл өзүнүн айлана-чойрего, жаратылышка, коомго болгон көз караштарын, мамилелерин, ойлорун, кыялдарын ушул оозеки чыгармалар аркылуу билдирген.) айлана-чөйрө = окружающая среда (8-кл., 1-б. +Корком алабилт жонүндө түшүнүк»: Адабият – бардык өнөрдүн (искусствонун) ичинен турмушту, айлана-чөйрөнү кенен-кесири чагылдырып берген соз өнөрү.) Тапшырмалар:"},{"t":"p","h":"1. Текстти окуп, айтып берүүгө даярдангыла. Ал үчүн төмөнкү"},{"t":"p","h":"суроолорго көңүл буруп, жооп бергиле: Кыргыз фольклору кайсы тектерге бөлүнөт? Кайсы чыгармалар эпикалык текке кирет? Кайсы каада-салт ырларын жатка билесиңер?"},{"t":"p","h":"2. Элдик эпостордун бөлүнүштөрүн эстеп, дептерге эпостордун атл-"},{"t":"p","h":"лыштарын жазып келгиле, Элдик эпостордун басылыштарын таап, мүмкүн болсо сабакка алып келгиле."},{"t":"p","h":"8. Элдик оозеки чыгармалардын бөлүнүшүн чийме (кластер) аркылуу"},{"t":"p","h":"чагылдыргыла."},{"t":"h3","h":"Адабият теориясынан"},{"t":"p","h":"Фольклор. Бул – адабий термин. Англис тилинде «элдик акылмандык» дегенди билдирет. Англиялык окумуштуу В.Томстун сунушу боюнча 1847-жылдан «элдик оозеки чыгармачылык» деген түшүнүк «фольклор» деп атала баштаган. Фольклорду жазма адабияттан айырмалаган беш өзгөчөлүк бар:"},{"t":"p","h":"акылмандык – муд-"},{"t":"p","h":"рость сунуш – предпоже-"},{"t":"p","h":"ние өзгөчөлүк – особен-"},{"t":"p","h":"ность"},{"t":"p","h":"<span class=\"pg\" data-n=\"6\">6<\/span>1. Коллективдүүлүгү, бир чыгарманын түпкү тегин жалгыз адам түзгөн болсо да, эл арасында оозеки жашап, ага улам кийинки муундун өкүлдөрү кошумчаларын кошот, айрым жерлерин алып салат, кыскасы автору белгисиз болот да, коллективдин чыгармасына айланат."},{"t":"p","h":"2. Варианттуулугу. Элдик оозеки чыгармаларда туруктуу текст жок болот да, бир эле чыгарма жаралуу мезгили, орду, аткаруучусу жагынан ар түрдүү болуп кала берет, натыйжада анын варианттары келип чыгат."},{"t":"p","h":"3. Салттуулугу. Мындай чыгармалардын текстинен тартып, сюжет, образ мотивдеринде окшоштуктар болот да, алар варианттардан варианттарга көчүп жүрө берет."},{"t":"p","h":"4. Оозеки болушу."},{"t":"p","h":"5. Көркөмдүк системасында туруктуу сөздөрдүн, фантастиканын, гиперболанын көп кездешиши."}],"sub":[],"pages":[4,6]},{"title":"«Манас» эпосу жөнүндө жалпы маалымат","blocks":[{"t":"h3","h":"«Манас» эпосу жөнүндө жалпы маалымат"},{"t":"p","h":"«Манас» – кыргыз элинин улуттук сыймыгынын туу чокусу жана миң жылдар бою оозеки айтылып келе жаткан байыркы элдик чыгармаларынын улуу мурасы. «Манас» эпосу кылымдар бою кыргыз элинин башынан өткөн социалдык-тарыхый тагдырын, душмандарга көз карандылыктан кутулуу үчүн жүргүзгөн баатырдык күрөшүн, уруучулдук карама-каршылыктарын сүрөттөйт. Көлөмүнүн зордугу жана көркөмдүк жагынан «Манас» үчилтиги (трилогия) гректердин «Илиадасы», «Одиссеясы», ирандын «Шах-Наамесие», орус элинин «Илья Муромец», финдердин «Калеваласы» өңдүү дүйнөлүк эпостордун катарында турат. „Манастын»* үч бөлүмү биригип, 500 миңден ашык ыр сабынан турат. Кыргыз элинин өткөндөгү көчмөндүү турмушунда «Манас» эпосу өтө зор роль ойногон, анткени кылымдар бою кыргыз элинин айттырып угуп, таалим – тарбия ала турган адабияты да, көрүп көңүл ача турган театры да, музыкасы да «Манас» болуп келген. «Манасты» айтуучу акындар менен жомокчулар айылдан-айыл кыдырып, «Манас» айтуу аркылуу элдин жүрөгүнө чоң тупку теги – основа"},{"t":"p","h":"кошумчаларын ко-"},{"t":"p","h":"шот – дополняет"},{"t":"p","h":"натыйжада – в ито-"},{"t":"p","h":"ге салттуулук- тради-"},{"t":"p","h":"ционность"},{"t":"p","h":"жалпы маалымат -"},{"t":"p","h":"общие сведения"},{"t":"p","h":"тагдыр – судьба көз карандылыктан"},{"t":"p","h":"кутулуу – избавиться от зависимости:"},{"t":"p","h":"уруучулдук – родо-"},{"t":"p","h":"племенные отношения"},{"t":"p","h":"кочмендуу турму-"},{"t":"p","h":"шунда – вкочевой жизни көңүл ача турган -"},{"t":"p","h":"развлекающий <span class=\"pg\" data-n=\"7\">7<\/span>таасир берип, баскынчыларды жек көргөзүү сезимин (чувства) туудурган."},{"t":"p","h":"ХЇХ кылымдын орто ченинде казак окумуштуусу Чокан Валиханов «Манасты» – «талаа Илиадасы» деп, ал эми «Семетей» эпосун – «буруттардын Одиссеясы» – деп атаган. Ошол кездеги ири түрколог В. В. Радлов: «Манастан» элдин бүткүл турмушун, бардык умтулуштун элеси корунот»,- деген,"},{"t":"p","h":"Элдик оозеки чыгармалардын көптөгөн жанрларын «Манас» эпосунан көрүүгө болот. Бирок, «Манас» эпосу – макал-лакап, жомок, миф, кошок, армандардын жөнөкөй жыйнагы (сборник) эмес, «Манас» – Манас баатырдын жана анын баласы Семетей, Семетейдин баласы Сейтектин өмүрү, баатырдыгы, эрдиктери жөнүндө бирдиктүү баян, композициялык бүтүндүктөгү улуу дастан, Бул баатырлар кыргыз элин бирихтирип, жалпы элдин эркиндиги үчүн күрөшкө алып чыгат."},{"t":"p","h":"Эстегиле! Тааныш сөздөр:"},{"t":"p","h":"туудурган – порож-"},{"t":"p","h":"дап"},{"t":"p","h":"умтулуштун эле-"},{"t":"p","h":"си- образ стремления"},{"t":"p","h":"бирдиктүү – еди-"},{"t":"p","h":"ный баян – рассказ, по-"},{"t":"p","h":"вествование бүтүндүктөгү – в"},{"t":"p","h":"целостности"},{"t":"p","h":"мурас – наследие (7-кл.. 20.6. Токтогул Сатылганов жөнүндөгү тексттен:"},{"t":"p","h":"Токтогул айтыш жанрынын устаты болгон. Аидаи отуздай айтыш ыры мурас калган."},{"t":"p","h":"8-кл., 24-6. Молдо Кылыч Шамыркан уулу: «Кыз жигит», «Керме тоо»,"},{"t":"p","h":"+ Чуй баяны», „Бүркүттүн тою,», «Канаттуулар», +7Жииди Суу», «Буудайык» сыяктуу чыгармалары мурас катары калды.) айылдаи-айыл кыдырып – ходили по айылам (7-кл., 2.60. „Жарамазан"},{"t":"p","h":"айтуу салты жөнүндө»: Жарамазан айткандар үймө-үй, айылма-айыл кыдырышкан.) таасир – влияние (8-кл., 41-6. Жоомарт Бөконбаеп: Жоомарттын акындык"},{"t":"p","h":"шыгынын ойгонушуна Токтогулдун акыл-насаат жана таптык маанидеги ырлары тайсир эткен.) баскынчы – завоеватель (6-кл., 36-б. «Кошой коргон» уламышынан: Кал-"},{"t":"p","h":"мактардын баскынчылыгынан эл туш-тушка качканда, Кошой өз элин ошол сепилге бекитип, душмандар менен салгылашкан экен."},{"t":"p","h":"В.кл.., 14-б. «Жаңыл Мырза» эпосу жөнүндө маалымат: «Жаңыл Мырза» —"},{"t":"p","h":"кеиже эпостордун бири. Бул эпосто кыргый элинин калмак баскынчыларына каршы баатырдык күрөшү айтылат.)"}],"sub":[],"pages":[7,7]},{"title":"«Манас» эпосун жыйноо жана изилдөө (собирание и исследование)","blocks":[{"t":"h3","h":"«Манас» эпосун жыйноо жана изилдөө (собирание и исследование)"},{"t":"p","h":"„Манас» эпосун жыйноо жана изилдөө ХЇХ кылымдын орто ченинде башталган. Эпосту эң биринчи жолу казак окумуштуусу Чокан Валиханов кагазга түшүргөн. Ал «Көкөтөйдүн ашы» эпизодун кара т <span class=\"pg\" data-n=\"8\">8<\/span>сөз менен (прозой) жазып алып, орус тилине которуп бастырган. Ч.Валиханов «Жунгариянын очерктери» деген эмгегинде: «Манас» кыргыздын бардык мифтеринин, жөө жомокторунун, ылакаптарынын энциклопедиялык жыйнагы, булардын бардыгы бир гана мезгилде тушташтырылып (точно прилажен одно к другому) жана бир гана адамдын – Манас баатырдын тегерегине жыйналган. Бул зор жомоктон кыргыздардын жашоосун, үрп-адаттарын, географиясын, диндик (религиозное), медициналык түшүнүктөрүн (понятие) жана эл аралык мамилелерин түшүнүүгө болот»,- деген."},{"t":"p","h":"ХЇХ кылымдын атактуу окумуштуусу академик В, В, Радлов (1837-1918-ж.) «Манастын» мазмуну менен бүт таанышып, 1885- жылы эки миң сап ырды орус алфавитинин жардамы менен кыргыз тилинде Санкт – Петербургда бастырып, немец тилине которуп чыгарган.!В. В. Радлов «Манасты» сактап жана өнүктүрүп келген айтуучулардын чыгармачылык өзгөчөлүктөрү жөнүндө илимий пикирлерди айткан. Ал: «Эпостун тили так, ыр саптары көркөм, тазсирдүү, кыргыздар ыр жаратууга жөндөмдүү» деп жогору баалаган."},{"t":"p","h":"«Манас» эпосун илимий изилдөөдө Д. Алмаши, К. Рахматуллин, А, Бериштам, С, Абрамзон, В.М. Журминский, М. Ауэзов, К.Тыныстанов сыяктуу кептеген окумуштуулар эмгектенишкен. Алардын ичинде «Манас» эпосун белгилүү бир инструкциянын не. гизинде жыйноо, иреттөө иштерин 1921-жылы Каюм Мифтаков өз демилгеси менен эпосту Сагымбай Орозбак уулунан жазып алуудан баштаган. Кийин Ыбырайым Абдыракмановду да «Манас» эпосун жыйноого К.Мифтаков тарткан. Ал Тоголок Молдодон «Семетей» эпосунан үзүндүлөрдү да жыйнаган, Ошондой эле 1950-жылдарда «Манас» эпосунун орчундуу маселелерин изилдөө ишине академик Болот Юнусалиев киришкен. Бул мезгилде «Манаска» байланыштуу талаш-тартыштар кызуу журүп турган,"},{"t":"p","h":"* Манас» эпосун изилдөө, башка тилдерге которуу иштери азыр да 'лантылып жатат. «Манастын» айрым бөлүктөрү жана үзүндүлөрү англис, немис, француз, орус, түрк, казак, озбек, монгол, кытай жана башка дүйнө тилдерине которулган."},{"t":"p","h":"«Манас» эпосунун бүткүл дүйнөлүк маданий казынадагы кайталангыс маанисин эске алып (учитывая), ЮНЕСКО 1995-жылды «Манас» эпосунун миң жылдыгын майрамдоо жылы катары чечим (решение) кабыл алды. Дүйнө окумуштуулары, адабий коомчулук «Манас» эпосун кыргыз элинин баа жеткис (неоценимый) адабий жана тарыхый мурасы катары тааныды."},{"t":"p","h":"Эпостун кыргыз элинин маданиятында алган орду эбегейсиз зор болуп саналат. Айта кетсек, Җалил Садыковдун «Айкөл Манас», «Манастын уулу Семетей» жана «Сейтек» драмалары Кыргыз драма театрынын бүгүнкү күндөгү репертуарында үзүлбөй коюлуп келе жатат. Кыргыз улуттук кино искусствосунда белгилүү режиссерлор Болот Шамшиев, Мелис Убукеевдер эпостун улуу идеясын ачып, даректүү фильмдерди тартышкан. Атактуу скульптор Тургунбай Садыков жети бөлүктүү «Манас» архитектура-скульптуралык композициясын жараткан."},{"t":"v","l":["<span class=\"pg\" data-n=\"9\">9<\/span>Жаны сездер:","пикир – мнение","демилге – инициатива","орчундуу – значительный","маселе – проблема, задача","","Эстегиле! Тааныш сөздөр:","талаш-тартыш – спор","коомчулук – общественность","эбегейсиз – чрезмерно. несоразмерно"]},{"t":"p","h":"мамиле – отношение {9-кл.,1-б. Киришүү: Макал.лакаптарда элдин жаш."},{"t":"p","h":"тарды эмгекчилдикке, улууларга урмат менен мамиле кылууга тарбиялаган көз караштары топтолгон.) маданий – культурный (9.кл., 1-б. Киришүү: Орто кылымдарда кыргыз"},{"t":"p","h":"элинин оозеки чыгармалары мазмуиу, фюрмасы, стили жагынан олуттуу өзгөрүүлөргө учурап отуруп, айрым үлгүлөрү классикалык деңгээлге жетип, жалпы адамзаттык маданий казынага айланган.) кайталангыс – непопторимый Т-кл., 101-б. А. Осмонов: Бир күн да ырсыз"},{"t":"p","h":"жашай албаган, кайталангыс таланттуу акын Алыкул Осмонов 1915- жылы Панфилов районундагы Каптал-Арык айылында туулган."},{"t":"p","h":"Тапшырмалар:"},{"t":"p","h":"1. Текстти окуп чыгып, маамунун айтып, томоику суроолорго жооп"},{"t":"p","h":"бергиле:"},{"t":"p","h":"1) ХЇХ кылымда «Манас» эпосун кайсы окумуштуулар изилдеген?"},{"t":"p","h":"Алардын бул эмгектери болбогондо манастаануу илими бүгүнкү күндө канчалык деңгээлде өнүгөт эле?"},{"t":"p","h":"2) Советтик доордо «Манас» эпосун алгачкы изилдөөчүлөр, эпосту"},{"t":"p","h":"жазып алгандар кимдер?"},{"t":"p","h":"3) Азыркы кезде + Манас» эпосун изилдөө, башка тилдерге которуу"},{"t":"p","h":"иштери кандайча жүрүп жатат?"},{"t":"p","h":"4) «Манас» эпосунун миң жылдыгын майрамдоо жөнүндө буга че-"},{"t":"p","h":"йин эмнелерди окугансыңар жана айтып бере аласыңар? «Манас» эпосунун кыргыз элинин маданиятыида алгаи орду кандай?"},{"t":"p","h":"2. Академик В, В. Радловдун «Манас» эпосу жөнүндө: «Бул зор жо-"},{"t":"p","h":"моктон кыргыздардын жашоосун, географиясын, диндик, медициналык түшүнүктөрүн жана эл аралык мамилелерин түшүнүүгө болот»,- дегенин кандай түшүнөсүңөр?"}],"sub":[],"pages":[8,9]},{"title":"Манасчылар жана манасчылык өнөр жөнүндө","blocks":[{"t":"h3","h":"Манасчылар жана манасчылык өнөр жөнүндө"},{"t":"p","h":"«Манас» эпосу – кыргыз элинин көркөм сөз өнөрүнүн эң бийик үлгүсү. Улуу «Манас» эпосун жараткан, укумдан-тукумга өткөрүп, оозеки сактаган, мазмунун байытып, көркөмдүк деңгээлге жеткирген көркөм сөз чеберлери – манасчылар деп аталат. ХЇХ кылымдын ортосунда, кыргыз жерине элдик чыгармаларды изилдегени казак окумуштуусу Чокан Валиханов келип, «Манас» эпосун кагазга түшүрүп баштаган. Окумуштуу 1856-жылдын 26-майында ага кыргыздардын ырчысы келип жолукканын, ал ырчы «Манас» эпосун билерин жазган. Мындан улам «ырчы» деген сөз ал мезгилде «Манас» айткан адамдарга карата айтылганы белгилүү болгон, Бирок «ырчы» толук бойдон «манасчы» деген түшүнүккө (понятие) синоним <span class=\"pg\" data-n=\"10\">10<\/span>боло албайт. Манасчы болуу үчүн ырчы болуу жетишсиз (недостаточно). Ал үчүн ырчынын эпикалык чыгарма жаратуу жөндөмү (способность) болушу керек."},{"t":"p","h":"Кыргыз элинин көрүнүктүү тилчи, адабиятчы окумуштуулары Ташым Байжиев менен Зияш Бектеновдун «Манас насааты» окуу китебинен:"},{"t":"p","h":"«Манасты» эң биринчи айткан манасчынын аты белгисиз. Сагымбай Орозбак уулунун айтуусу боюнча: «Манасты» эн биринчи айткан – Жайсаң ырчы. Ал үйдүн жасалгасын эле жарым күнү ырдачу экен»,- деген маалыматты кезиктиребиз, Жайсан Манастын тушунда жашаган имиш, Профессор Мухтар Ауэзов Жайсан ырчы – Ырамандын Ырчы уулу (Манастын кырк чоросунун бири), Жайсаң анын экинчи аты деген пикирди айтат,"},{"t":"p","h":"«Манастагы» окуяларды бир жомокко бириктирип, көркөмдөп иштеп чыккан мындан беш жүз жыл мурда жашаган Токтогул ырчы болгон деген да оозеки сөз бар, бирок андай ырчынын болгон-болбогонун аныктаган маалымат жок."},{"t":"p","h":"XX – XX кылымда атактуу манасчылар Келдибек Карыбоз уулу (1800-1880-ж.). Балык (Бекмурат) Кумар уулу (1 199-1887-ж.), Тыныбек Жапый уулу (1846-1902-ж.)., Найманбай Балык уулу (1847- 1913-ж.), Багыш Сазан уулу (1878-1958.ж.), Шапак Рысмендеев (1863—1956-ж.), Сагымбай Орозбак уулу (1867-1930-ж.), Чоюке Өмүр уулу (1880-1925-ж.), Саякбай Каралаев (1894- 1971-ж.) жашаган. Эстегиле! Тааныш сөздөр:"},{"t":"p","h":"маалымат – сведение, информация (9-кл., 5-б. «Манас» эпосу жөнүндө"},{"t":"p","h":"жалпы маалымат. } пикир – мнение (9-кл., 7-6. «Манас» эпосун жыйноо жана изилдоо:"},{"t":"p","h":"В.В. Радлов + Манасты» сактал жана өнүктүрүп келген айтуучулардын"},{"t":"h3","h":"чыгармачылык өзгөчөлүктөрү жөнүндө илимий пикирлерди айткан.)"}],"sub":[],"pages":[10,10]},{"title":"САГЫМБАЙ ОРОЗБАК УУЛУ","blocks":[{"t":"h3","h":"САГЫМБАЙ ОРОЗБАК УУЛУ"},{"t":"p","h":"*Бул бир ааламда укмуш жаралган уникалдуу талант. Балким, эч ибакта кайталангыс руханий карунуитиур. «Манас», «Манас» болгондон берки эпостун тамчыга тамчы кошулуп, сөлгө сөз, ойго ой кыналып, байыркы кыргыз журтунун буткул чыгармачылык кубатын Сагымбай бир Өлү дилине сыйгызып тургандай селилет.ь Ч.Т.Айтматов Белгилүү адабиятчы Зияш Бектенов «Манас» жөнүндө сөз» деген эмгегинде улуу манасчы Сагымбай Орозбак уулу жөнүндө мындай деп жазган: «Сагымбай Орозбак уулу 1867-жылы төрөлүп, 1931-жылы каза болгон. Ал Ысык-Көл өрөөнүндөгү Кабырга деген жерде төрөлгөн. Сагымбайдын атасы Ормонканга сурнайчы (музыкант, зурнист) болгон. Атасынын аты Акеш экен, ал сурнайчы <span class=\"pg\" data-n=\"11\">11<\/span>болуп жүргөндө Ормонканга жагып калат. «Сенин атың болбогон ат экен, мындан ары атың Орозбак болсун» – деп, Ормонкан анын атын өзгөртүп жибериптир."},{"t":"img","src":"data:image/webp;base64,UklGRmwWAABXRUJQVlA4IGAWAAAQwgCdASoVAWgBPqVGmkmmJ6KkNnYr2PAUiWkI9BsPv3I3vxq5O8Vnzj/+77PRe+3///pW/af//xJ/+/abXtzpv/0WJCieKj22u8ypJZf9+ToCJGuCLMXxQXjhn2HEiC3vnuiBZoELPza38G2TUTYhpcirRgP4iz36qmQZCezoeaFIOFVFGGpE76zJtRMPzSvR3TQUY3i4N+WW+eiCu8ATrFgtEgyiP+NfzsGiJtPvu167f4RB6U3X8M2+d0G9vPJPb+cptc3UZUmf2CXp27P+ZKg/pqQiOXwpL9zBGeMkFsQk33/2rxXgqpWa8u1CBQDv+9TyEcW1tEFhkdDJSJB/QdIuAS0CucUvIIeNjMnzEwIJm5dZSjCTlTSeOKSnH+m+GtKnLCuCWlzYEpMoZnaxg926uYIhEeSNCIf0cqX8bY53RjRYU9zzr3VLc2v01ukFNlx/5++bpFTdK/sz9FneLXkTLEedJgN+kKzu/Q7eM9Kkw685FFx0zuVQ2qaxSMx6NEi6WbEcgTImLRObfkYWG23JeQ6HAAtVeZBTH/2xr4plX+KfCxukev5FtiF8HqofObrx1e6X7waJUwgM1B3cCF1GgXodnnHv5lw4wA8rWNmfV7epOaIGTspgY8ugMyskWRzbU/+c1Ka+AIC6adGn+RwrD/cNqEUqx4oZPiIgSOdHt64uTb+Oe3uXczvSspBHROYuCrHGTOpD3VrKvfXUGrJVKyU4SJH7mIORVpgSS0itpES+AOPRyUSf3T5Ur5XW3bLFaLIO1voGj0+JZVEAk9CEVv5ixskLfP+En/zAub+YAmjV6aglSqfUWO0oM5hpFH9FyO5JKZ26RG01Ua1c5uvLnuDWodJ8gp6FQtPA62bbGryPMLFvB9X3DATzg75z4XgmqQTqgWwBGs3pUjwHLgWJUKJHult2lDFuzXTA0Q2utI8VH6Vm3ce+lWlmy9nbrvDqWxJ85SNeyBcR/ZhFjwkWSttiyKL5OfO3Hm3rT8iyDs12rGGrQvs76lGi4yBESfaHFKjslQz9XvjrhTFHfAhZkmHPeZG1/ERBxtTuO4kErXhL6gJm4Q2U4DPyVeYfT62QpBYfVgmj30xrbvFwBcS168HKwzBL7N3/F0JihvhnhRpRDQI3WMgrdCDNTtL7rKHvVspdtNM2s57E+iBWbEAKA3kNG+DE0hrzulmR0Z9WfiQMhFt4A0EYxMG/HQXojJ5rP9mzNkOGY9awnIHR2YoWqQWJ/UhkF0mVwZjXB/A8VQDFh7PIqKxxSxj н манасчы болу-"},{"t":"p","h":"шуна өзүнүн агасы Алишер себепчи болгои.) себепкер – виновник (7-кл. 10-б, «Манасо эпосунун кыскача мазмуну»:"},{"t":"p","h":"Конурбай Манастын өлүмүнө себепкер)."},{"t":"p","h":"2. Окумуштуулар Ташым Байжиев менен Зияш Бектеновдун алгачкы"},{"t":"p","h":"маийсчылар жөнүндө «Манас насааты» деген китебинде айтылган маалыматты сүйлөп бергиле."},{"t":"p","h":"$. Суроолорго жооп бергиле:"},{"t":"p","h":"<span class=\"pg\" data-n=\"12\">12<\/span>1) Сагымбайдын атасы, агасы кимдер болгон экен?"},{"t":"p","h":"2) Сагымбай Орозбак уулу кайсы манасчылардан үлгү алыптыр?"},{"t":"p","h":"Ал манасчылар жөнүндө эмне билесиңер?"},{"t":"p","h":"З) Әмне үчүн З. Бектенов «Сагымбайдын вариантына эч бир париант"},{"t":"p","h":"теңдеше албайт» – деп жазган?"},{"t":"p","h":"&gt; 4. Сагымбай Орозбак уулу жөнүндө мурда билгендериңерди эстеп,"},{"t":"p","h":"айтып бергиле."},{"t":"p","h":"5. Ормонкан жөнүндө тарых сабагынаи окуган маалыматтарды сүйлөп"},{"t":"p","h":"бергиле."},{"t":"p","h":"6. Аллитерация жөнүндө окуу китептин 46-бетинен окуп, айтып"},{"t":"p","h":"бергиле."},{"t":"p","h":"Т. Төмөнкү сөздөрдүн синонимдерин, антонимдерин таап, дептериңерге"},{"t":"p","h":"жазгыла; кабылан, теңдешсиз, чебер, пикир, манасчы, биринчи, илги."}],"sub":[],"pages":[11,12]},{"title":"САЯКБАЙ КАРАЛАЕВ","blocks":[{"t":"h3","h":"САЯКБАЙ КАРАЛАЕВ"},{"t":"p","h":"Кыргыздын залкар манасчысы Саякбай Ка: ралаев Ысык-Көлдүн Ак-Өлөң айылында кедейдыйкандын үй-бүлөсүндө туулган. Жаш кезинен ар нерсеге ышкыбоз, шок, шайыр жана өткүр бала болуп өсөт,"},{"t":"img","src":"data:image/webp;base64,UklGRtAEAABXRUJQVlA4IMQEAACQMgCdASoVAaYAPrVUoEynLTErK9B6WiAWiWluiI9k8+jLQHWCQx/DP+HrFS22QF+vJf0n8K52v8gzvaaM+b09z1omfdSWyBQ8VP569EPfztGwt8Hf8bYKAYCb4WzLb1cOPDOYD4oT5EC8YPpTIfTeoWEgAOfwJlCLJitCDQNcFBon4/svJwZmGkodzrCEMjUkvQbxC3YO1juLNM11bZot2J7r3iO6FXMPuRuBUTs3jZkAaH3keqM/+8L8bfhWwUylpXAnkGZ4d6DEFcLT5ok73CuboRgFVH1rxyH0XrPTzyTfQqRXwTZMqAcmAa/4wMNVhJTJv+KiZOGBTE2HVdc2zeFZrxqE7aqfzmXAleI4Id8A , манасчылык талант гана эпостун эл арасында жашап келе жаткан зор казынасын өзүнчө толук өздөштүрүп айтууга мүмкүнчүлүк ачат."},{"t":"p","h":"'Саякбайдын айтуусу боюнча 1931-жылдан 1947-жылга чейин эпостун үчилтиги толугу менен жазылып алынган. Көбүнчө андан Ыбырайым Абдрахманов кагазга түшүргөн. Сейтектин уулу Кенен, анын уулдары Алымсарык, Кулансарык жөнүндө баяндар болуп отуруп, баш аягы – 500553 сап ыр жазылып алынган. Бул колдо бар варианттардын эң көлөмдүүсү болуп саналат."},{"t":"p","h":"С. Каралаев менен, анын «Манасы» менен таанышкан белгилүү адамдар Саякбайдын талантын жеке анын өзүнө таандык кылбастан, кыргыз элинин улуттук сыймыгы катары карашкан. «Манас»"},{"t":"p","h":"<span class=\"pg\" data-n=\"13\">13<\/span>эпосун изилдөөчүлөр С. Каралаевдин айткан варианты «Манастын» бардык салттуу окуяларын (традиционные события) толук камтыганын (соединил, содержал, охватил), эпизоддор майдаланып сүрөттөлгөнүн белгилешет, Б. М. Юнусалиев «Улуу эпос, укмуштуу жомокчу» макаласында' мындай деп жазган: «Сакемден башка эч бир манасчыдан эпостун үч бөлүгү толук жазылып алынган эмес. Ошондуктан, ал вариант – уникалдык, жападан жалгыз вариант. Муну Саякбай карыянын өз элине, бүткүл адамзатка калтырган баа жеткис чоң тартуусу деп билиш керек»."},{"t":"p","h":"Зияш Бектенов «Манас» жөнүндө сөз» деген эмгегинде Саякбай Каралаевди «Даңкы таш жарган, жыйырманчы кылымдын Гомери катары эсептелген, өзүнөн мурдагы турк тилинде ырдап өткөн акындардын алпы, атактуу жомокчусу»,- деп баалаган."},{"t":"p","h":"С. Каралаев 1971-жылы Фрунзеде (азыркы Бишкекте) каза болгон. ышкыбоз – имеющий к чему-либо склонность"},{"t":"v","l":["шок – озорной, шаловливый","өткүр – энергичный, боевой. смелый","Даңкы таш жарган – прославленный","Гомери эсептелген – считающийся Гомером;"]},{"t":"p","h":"өзүнөн мурдагы түрк тилинде ырдап өткөн акындардын алпы —"},{"t":"h3","h":"великан из всех живших до него тюркоязычных поэтов"},{"t":"p","h":"Эстегиле! Тааныш сөздөр:"},{"t":"p","h":"баа жеткис – неоценимый (9-кл., 6-б, «Манас» эпосун жыйноо жана изилдөө:"},{"t":"p","h":"Дүйнө окумуштуулары, адабий коомчулук «Мамас» эпосун кыргыз"},{"t":"h3","h":"элинин баа жеткис адабий жана тарыхый мурасы катары тааныды.)"},{"t":"p","h":"Тапшырмалар:"},{"t":"p","h":"1. Манасчы деген түшүнүк боюнча билгениңерди айтып бергиле."},{"t":"p","h":"2. Улуу манасчылар Сагымбай Ороабак уулу жана Саякбай Каралаев"},{"t":"p","h":"жөнүндө тексттерди окуп чыгып, айтып бергиле, өз ара ой бөлүшкүлө."},{"t":"p","h":"3. Жаны сөздөрдү жаттагыла."},{"t":"p","h":"4. Мелис Убукеепдии «Саякбай» даректүү фильмин (+ Кыргызфильм»"},{"t":"p","h":"киностудиясы, 1966-ж.) көргөндөн кийин манасчыный аор таланты, адамды өзүнө тарткан аткаруучулук чеберчилиги жөнүндө айтып бергиле."},{"t":"p","h":"5. Манасчылар Сагымбай менен Саякбайдын өмүрүн жана чыгармачы."},{"t":"p","h":"лыгын Венндин диаграммасын толтуруп салыштыргыла. Ал үчүн төмөнкү суроолорго жооп бергиле: Алар кайсы мезгилде жашап өтүшкөн? Бул манасчылардын варианттары кандай артыкчылыктарга ээ жана бири-биринен эмнелери менеи айырмаланышат?"},{"t":"p","h":"6. Төмөнкү сөздөрдүн синонимдерин, антонимдерин таап, дептериңерге"},{"t":"p","h":"жазып алгыла: байланышкан, керемет, даам, күлазык, таалим, жомокчу, камтыган, даңк, баа жеткис."},{"t":"p","h":"т. Төмөнкү сүйлөмдөрдү толуктап, дептериңерге жазып алгыла: «Ма-"},{"t":"p","h":"масты» „ айткан „аты Жайсаң ырчы .. уйдун жасалгасын эле „ырдачу экен. Жайсаң Манастын -.. жашаган .... Профессор ... Ауэзов Жайсаң – Ырамандын „уулу. Жайсаң анын .„ аты деген"},{"t":"p","h":"<span class=\"pg\" data-n=\"14\">14<\/span>„айтат. «Манастагы» „. бир бириктирип, көркөмдөп ... мындан беш жиз жыл мурда жашаган ... болгон деген да оолеки – бар."},{"t":"h3","h":"«КӨКӨТӨЙДҮН АШЫ» БӨЛҮМҮ"},{"t":"p","h":"{Саякбайдын боюнча) Эпостун «Көкөтөйдүн ашы» бөлүмүндө кыргыз элинин үрп-адаттары, каада-салттары кенен-кесири сүрөттөлөт. Эпизод эл арасында кеңири тараган. Анын ар түрдүү айтылыштары коп жолугат. Бул бөлүм өзгөчө маанилүү чоң окуянын – «Чоң казаттын» башталышына себеп болгон түйүн. Ошондуктан, «Көкөтөйдүн ашы – көп чырдын башы» делет."},{"t":"p","h":"Ташкент тарапта жашаган кыргыздардын каны Көкөтөй – эң бай, кадырлуу адам болгон. Көкөтөй кабыргасынан кагынып, катуу ооруп, өлөрүнө көзү жеткенде керээзин айтат. Көкөтөйдүн уулу Бокмурун атасынын айткан керээзи боюнча Каркырага эл чогултуп аш берет. Ашка Кытайдан Коңурбай, Жолой сандаган аскерлери менен келип түшөт."},{"t":"p","h":"Аш өткөрүү жөнүндөгү кеңешке чакырылбай калган үчүн ачууланса да, айкөл Манас токсон миң колу менен келип жетет. Кыргыздын кандары аны урмат менен (с уважением) тосуп алышат. Бокмурун Манаска тогуз жоргого тогуз жамбы байлатып тартуу кылат. Буга Коңурбайдын ачуусу келип, Мааникер деген атты Бокмурундан суратып жиберет. Бокмурун кандардын кеңеши боюнча атты бермек болот. Ашка келген коноктордун ичинен кытайкалмак улуктары кыргыздарга кыр көрсөтүп, басмырлоого аракет кылышат. Манас угуп калып, Коңурбай менен уруша кетип, анын колун бир топ кыргынга учуратат. Коңурбай, Нескара кечирим сурашат. Кошой, Бакай арага түшүп, чыр басылат, Ашта ат чабыш, эңиш, жамбы атыш, күрөш, сайыш болот, Балбан курошто Жолойго каршы чыгууга киши жок, Кошой чыгат да, кырк күн, кырк түн күрөшүп, Кошой Жолойду жеңет. Эр сайышта Манас менен Коңурбай беттешип, Манас жеңет. Жамбы атышта да Манас жеңет, Бул оюндардын баарында мөрөйдү кыргыздар алат. Буга кытайлар нааразы болуп (будучи недовольными), уруш чыгарат, аш – поминки"},{"t":"p","h":"кенен-кесири —"},{"t":"p","h":"широко"},{"t":"p","h":"түйүн – узел чыр – свара, ссора,"},{"t":"p","h":"скандал"},{"t":"p","h":"кабыргасынан ка-"},{"t":"p","h":"гынып – заболел крупозным воспалением легких сандаган – много-"},{"t":"p","h":"численное колу менен – со"},{"t":"p","h":"своим войском, ратью тартуу кылат – да-"},{"t":"p","h":"рит ачуусу келип – ра-"},{"t":"p","h":"зозлившись улук – начальник,"},{"t":"p","h":"правитель кыр көрсөтүп – за-"},{"t":"p","h":"пугать басмырлоо – по-"},{"t":"p","h":"дав "},{"t":"v","l":["5} Кытай-калмактардын нааразы болуп, уруш чыгарышы","р 6) Кыргыздардын жеңиши"]},{"t":"p","h":"&lt; 3, Төмөнкү сөздөрдүн синонимдерин таап, дептериңерге жазып алгыла: Аш, кенси-кесири, түйүн, чыр, токсон мин кол, тартуу кылат, журт, бурут."},{"t":"p","h":"4. Ат чабыш жөнүндө айтылган төмөнкү ыр саптарынын маанисин түшүндүргүлө: Түркүн-түркүн болушуп,"},{"t":"v","l":["Дүнүйө жүзү толушуп,","Найзанын башы жылтылдап,","Адамдын башы кылкылдап","Орчун кара кол болду."]},{"t":"p","h":"5. Төмөнкү ыр саптарында кандай корком соз каражаттары колдонулган:"},{"t":"p","h":"Касиеттүү эр Кошой"},{"t":"v","l":["Бир тартуу менен Жолойдон","Билегин сууруп алганы.","Кол терисин шыпырып,","Жолой алып калганы."]},{"t":"p","h":"6. Бул бөлүмдө айтылган кыргыз элинин кайдй-салттарынын кайсынысы азыркы кезде сакталып калган? Ал салттар жонүндө айтып бергиле."},{"t":"v","l":["7. Таблицаны толтургула.","«Көкөтөйдүн ашы» бөлү-| Дагы кандай улут-| Эрежелерин кыскача","мүндө айтылган оюндарды | тук оюндарды биле- | жазгыла."]},{"t":"raw","h":"<h4 class=\"mk\">жазгыла. «Ат чабыш»<\/h4>"},{"t":"v","l":["сиңер?","Оодарышта жигиттер","ат үстүнөн бири-бирин","кулатышат."]}],"sub":[],"pages":[17,18]},{"title":"«МАНАСТАГЫ» ОБРАЗДАР","blocks":[{"t":"h3","h":"«МАНАСТАГЫ» ОБРАЗДАР"},{"t":"p","h":"Манастын образы Эпостогу бардык окуялар башынан аягына чейин Манас менен тыгыз байланыштуу. Манастан баатырлыктын барып турган болжолсуз мыкты үлгүсү көрүнөт. Анын эбегейсиз күчү, ашкан кайраты туйбаса өңдүү. Ал боюна бүткөндө, энеси жолборстун жүрөгүнө талгак болот:"},{"t":"p","h":"<span class=\"pg\" data-n=\"19\">19<\/span>«Жейм дейт жолборс жүрөгүн Мындан башка самабайт (не мечтает),» Манас төрөлгөндө эки уучуна уюган кара кан чеңгелдеп түшөт, үч карын майды бир жейт. Ыйласа үнү отуз кишиникиндей угулат. Мындай баатырдын торолушун кыргыз эли көптөн күтүп жүргөн болот. Атасы Жакып элүүгө чыкканча бала көрбөй, энеси Чыйырды экөө кудайдан зарлап тилешкен. Манас төрөлоордо алдын ала ар түрдүү аяндар берилет."},{"t":"p","h":"Бул белгилердин баары келечекте анын жеңилбес (непобедимый), душман үчүн каардуу эр болорун билгизет."},{"t":"p","h":"Ошол үчүн эл андан келечектеги коргоочуну, чабылган кыргыздарды чогултуучу азаматты күтөт, «айкөл, көк жал, даанышман, эр Манас» деп атайт."},{"t":"p","h":"Манастын бир өзүндө мин балбандын күчү болот. Жоо менен беттешкенде (когда он встречается с врагом), аны эч бир жан жеңе албайт. Манастын дене түзүлүшү (строение тела), ыкчамдыгы да өзүнүн күчүнө, айбатына ылайык келген. Анын кейпи:"},{"t":"v","l":["«Болжолукка караса,","Болот өткүс кара таш."]},{"t":"p","h":"Күрсү (палица, булава) тийсе оюлгус, Туюк сөөк, чулу баш»,- деп сүрөттөлгөн. Демек, Манастын образы – күч, кайрат, туруктуулуктун теңдеши жок үлгүсү. Манас балбан гана эмес, иштин ыгын билген акылман (мудрец), калыс, көпчүлүктүн күчүнө ишенген, чынчыл, адамгерчиликти сүйгөн боорукер адам. Басып алган элдерди басынтпайт, талап-тоногонго жол бербейт."},{"t":"p","h":"Ал ар дайым казатка жөнөөр алдында (перед тем, как отправиться в поход), өзүнүн жеке бийлигин жүргүзбөй (не пользуясь своей властью), элин, чоролорун жыйнап, алар менен акылдашат."},{"t":"p","h":"Манастын образы – кыргыз элинин өз алдынча мамлекеттүүлүгүн даңазалаган әң күчтүү жана түбөлүктүү образ."},{"t":"p","h":"Эстегиле! Тааиыш сөздөр:"},{"t":"p","h":"тыгыз байланыш-"},{"t":"p","h":"туу – тесно связаны болжолсуз – неиз-"},{"t":"p","h":"меримо эбегейсиз – чрез-"},{"t":"p","h":"мерный чеңгелдеп түшөт -"},{"t":"p","h":"сжимая в кулаке зарлап – горевать аян – предостере-"},{"t":"p","h":"жение, внушение «свыше»"},{"t":"p","h":"каардуу эр – гнчев-"},{"t":"p","h":"ный, яростный храбрец айкөл —великодуш-"},{"t":"p","h":"ный көк жал-богатырь,"},{"t":"p","h":"храбрец даанышман – му-"},{"t":"p","h":"дрый ыкчамдык – провор-"},{"t":"p","h":"ность, скорость; айбатына ылайык-"},{"t":"p","h":"подходит его суровости, грозному виду, ярости; кейпи – внешний"},{"t":"p","h":"вид иштин ыгын бил-"},{"t":"p","h":"ген- умелый калыс – справед-"},{"t":"p","h":"пивый чынчыл – правди-"},{"t":"p","h":"вый талап-тоногонго жол"},{"t":"p","h":"бербейт – не позволяет грабить"},{"t":"p","h":"ашкан кайраты – превосходная доблесть, решимость; кайраттуу – реши-"},{"t":"p","h":"тельный, энергичный (8-кл., 10-6, «Курманбек». Эпостогу каармаидардын образдары: Курманбектин чыныгы жары, түгөйлөшү Канышай."},{"t":"p","h":"<span class=\"pg\" data-n=\"20\">20<\/span>Теодор Герцендин тарткан сүрөтү: «Маилс баатыр»"},{"t":"img","src":"data:image/webp;base64,UklGRiI7AABXRUJQVlA4IBY7AAAQKwKdASqqAbYCPqlKnUmmK6MmtHO8IXAVCWlt2aTDl5HFIhWOninpL7SOThwzz//+Ty3kRRPT/pec2+c/8k/wf/t43+57/V9m+vPpv9//8/B4//9Tn/h2s/+Xh/elxf30p/P/iT/++2OvqnNP/32TNJ/CunaeFGaZnrCEZiH12lCEPUZeoT5XxatJjiMu1fiwwbOpNjqmKHFU54iblNi7+u/NE04r4G3fgFZ90vdK0S4b7Oxt+bQEBoylGC0o0JMXeQvT/fbcAQCzlFxNcowBBjqsp2NOncnC4BDIJ9X7NMxtEMBbJDjVhI4TfLB/QuaND/faCORuaLCjQEKa3cVouWk14HEb4hMXvHklM+1cYvijRkSKx01JqJ37wIajUAuLnK3DPkh73+Gp4auHXhXIUoRafy2OKWsGM5RMgB57iDFEmB5dcL2iwYb4iPoH/unn+9A982+b5SDplxqI5kKlFkELJR4Rl9QDw6X/8ExeC0lOq1Ip+ekH3Y/XOejmpN4gzrXVBzeh0j2TUNzlfTYRs4FgUJglscX55VOz0Q3sKpAsR/Pn6tL5h4GBf2xrr67Ge/5D42xGiu9ZqEzVpqvXtZDCZ4uCqFGtRRUCyxHG+5u8HZKU49T4IyaX3HVLCAEAMKtEcH/HdratYvx19Pi6fMZZYtxUfqqSV6hTNtHx9aFo6FDzFJPOzhfJyIfWjAbVT+Nc/ZHlowMMri0WDnbcbqhFwPz2QxhzThSZMUmh3zejtk7zGMGXz08KiLenh1ZoQytKPbcc4StMqX8GMc5YznGsMRcDsJZXJn137OvQLGX3qt7yD0buZE8jatipm8r+IE72vYfiBQ/7dgQf3imy3645rnEq2pPwnbNTq0rJk1c6NmY9ZX/4Cj7rljufBn48b57pnJQlw2Ssp4dms9D7TJvXypU9Fm9Trg45u1G3+2F7hxvKaorUpJhddPzw7vanF67+AIp3KnINNHAzmEo+Ic0JnfZcOjqAhvbOKXXZn0UMxqtTgUCWwThsdjhKaPyfBIsMhKSI/NX/TtJjVQtf0jucWpIbUxWBdmqXCM757oPEEYfg7NlDTsb4g5amEhEIr51ocf59W9jKiU2PQ2PIinWImRqvR9InGN9KDvsAmEeVD93QDuX38iCZgfMl/fOvGbiTGlXzRcmGwbxAlCNsB2UvnOz9WhMcPNE8BdUUaCYDv+tGMMxP99mjHUYnKkoQoAEQ7gTUi5ipyrgrCsefziOdQAqYT/GIIOacDMjavBmlGxVuyTBZnPysf12Mvm8epRRkxfRclJtGPZ1rU96HkfIr++bTRWjO0N+4jLayj8RxjBeWxX8Wj+L4AiUaeMoH6F94VnZ+jl959N/duI956GFaSig/p+UgOXHid+KG0CaPHMCjyczcv4MGIhc1jLfPzpFeWZK8ypf+iNTis2RkGXUniSDX9mH68Um+TVai1E айсы чоро таарынса,","Кабылан Манас баатырдын","Каратты тарти жүргөн адаты.)","","Каныкейдин образы"]},{"t":"p","h":"Каныкейдин турпатына кыргыз аялдарындагы ак ниеттуулук, кайраттуулук, калыстык, өмүрлүк жолдошуна (супруг) берилгендик, элди, жерди сүйүү өңдүү мыкты сапаттардын бардыгы чогултулган."},{"t":"p","h":"Каныкей – айтканынан кайтпас, сөзгө бек, кыраакы, акылман, колунан көөр төгүлгөн уз аял. Жомокто Каныкей:"},{"t":"p","h":"турпат – здесь: образ ак ниеттүүлүк -"},{"t":"p","h":"честность берилгендик – пре. данность кыраакы – дально-"},{"t":"p","h":"видная"},{"t":"v","l":["<span class=\"pg\" data-n=\"21\">21<\/span>«Кабылан жеңең Каныкей,","Зайып заттын паашасы.","Кең көйнөктүн тазасы.","Кара сурдун сулуусу,","Адамзаттын"]},{"t":"p","h":"Демек, Манасты Манас деген атакка жеткирген, «чачылганын жыйнаган, үзүлгөнүн улаган» – Каныкей. Ал – сүйүктүү жар, камкор эне. Негизги касиеттери – айлакердик, акылмандык, чечкиндүүлүк, чыдамкайлык. Тажик каны Темиркандын кызы Санирабига өзүнүн адамдык, аялдык мыкты сапаттары менен эл оозунда Каныкей деген атка конот. Алдын-ала көрө билген даанышман Каныкей Манас чоң казатка аттанар алдында, мунун арты жамандык менен буто турганын билет да, Манаска эскертет. Аялдан чыккан чебер, уз Каныкей айкөлүнө жоо кийимдерин, ку рал-жарактарын жана күлазыктарын камдап берет. Манас чоң казаттан жарадар болуп кайтканда, Каныкей Муз-Жайлоого кочүп Манастын шилисиндеги жарасына дары жаап, айыктырат. Манас айыгып, кайра Таласка келип, эл башкарып турат. Алмамйеттин сөөгү жүктөлгөн Сарала келип, сөөктү Ат-Башыдагы Чеч-Дөбөгө коюшат, Досу Алмамбеттен айрылганына капаланган Манас зил кусуп, ээси ооп жыгылат."},{"t":"p","h":"Көрсө, Коңурбайдын найзасы тийген белин. деги жарасынын оозу бүтүп калгандыктан Каныкейге айткан эмес экен. Жаранын оозу айыгып, нары жагы сөөктү чиритип жиберген экен. Эл менен, баатырлар менен, Каныкей менен коштошуп, Манас көз жумат. Манастын керээзин аткарып, Каныкей «бир адамга билгизбей, бир адамга туйгузбай» айкөлдүн сөөгүн Эчкиликтин кара зоосуна жашырат. Мурдатан салдырган күмбөзгө теректен чабылган кепти көмдүрөт."},{"t":"p","h":"Семетейди тарбиялап өстүрүш үчүн атасы Темиркандын шаарына кайненеси Чыйырды менен Семетейди алып, ички душмандардан качып кетет."},{"t":"p","h":"колунан коор төгүл-"},{"t":"p","h":"ген уз – рукодельница, искусница зайып заттын"},{"t":"p","h":"паашасы – царица женщин кең кобнектун"},{"t":"p","h":"тазасы – здесь истинная аристократка кара сурдун сулуу-"},{"t":"p","h":"су – смугпая красавица адамзаттын нур-"},{"t":"p","h":"дуусу – пучезарная из пюдей атак – слава"},{"t":"p","h":"шили – шейное су-"},{"t":"p","h":"хожилие зил – болезнь, про-"},{"t":"p","h":"ходящая вглубь поражающая изнутри зил кусуп – вырвать"},{"t":"p","h":"зеленью, желчью жарасынын оозу"},{"t":"p","h":"бүтүп – затянулась поверхность раны бир адамга билгиз-"},{"t":"p","h":"бей, бир адамга туйгузбай – в полном секрете не дав никому догадаться теректен чабыл-"},{"t":"p","h":"ган кеп – форма, вырубленная из тополя Каныкей Семетейди Манастан кем эмес эр жүрөк кылып чоңойтуп, атасы Манастын жоо жарагын, минген атын сактап жүрөт. Баласы эр жеткенде ага атасы Манас, жери Талас экенин айтып, эл-жерине алып келет. Каныкейдин образы эпостун үч бөлүгүндө тең кездешкен, Манаска, Семетейге, Сейтекке жардам йерген, элдин <span class=\"pg\" data-n=\"22\">22<\/span>эркиндиги жана биримдиги үчүн күрөшкөн чыныгы патриот аялдын жаркын образы."},{"t":"p","h":"Эстегиле! Тааныш сөздөр:"},{"t":"p","h":"кайраттуу – решительный, энергичный (8-кл., 10-6. «Курманбек». Эпостогу"},{"t":"p","h":"каармандардын образдары: Курманбектин чыныгы жары,түгөйлөшү Канышай. Ал Курманбектин демине дем, күчүнө күч кошкон акылман, кайраттуу аял заты.) дайнышмаи – мудрый, мудрец (9-кл., 19.6. Манастын образы: Ошол учун"},{"t":"p","h":"эл андан келечектеги коргоочуну, чабылган кыргыздарды чогултуучу азаматты күтөт, «айкөл, кок жал, даанышман, эр Манас» деп атайт.)"},{"t":"p","h":"Тапшырмалар:"},{"t":"p","h":"1. 20-беттеги Теодор Герцендин тарткан сүрөтү боюнча Манас баатырды"},{"t":"p","h":"сүрөттөп бергиле."},{"t":"p","h":"2. Мурунку класстарда окуган + Манас» эпосу жөнүндө билгениңерди"},{"t":"p","h":"эстегиле. 7-класстын «Кыргыз адабияты» окуу китебинде беридген үзүндүдө эр Манастын келбети, күч-кубаты кандай сүрөттөлгөнүн түшүндүрүп бергиле:"},{"t":"v","l":["Алтын менен күмүштүн","Ширөөсүнөн бүткөндөй,","Асман меней жериңдин","Тирөөсүнөн бүткөндөй.","Айың менен күнүңдүн","Бир озунон бүткөндөй,","Алды калың кара жер","Жердигинен туткоидой!"]},{"t":"p","h":"З. Манастын кандай эрдиктери, кайсы сапаттары эл-журтту бирикти."},{"t":"p","h":"рип, эркиндик үчүн күрөшүүдө маанилүү деп эсептейсиңер? 4, Окуган үзүндүлөрдүн ичинен бир узунду тандап, жаттагыла."},{"t":"p","h":"5. Каныкейдин эң иегизги касиеттерин атагыла. Ал касиеттери эпосто"},{"t":"p","h":"кайсы учурда бааланат? Өз оюңарды иш дептериңерге жазгыла, 6. Каныкейдин образы кандай образ? Аны сүрөттөп айтып бергиле."},{"t":"p","h":"Бул жөнүндө кластер түзгүлө."}],"sub":[],"pages":[19,22]},{"title":"Манастын» идеялык","blocks":[{"t":"p","h":"«Манастын» идеялык мазмуну Эпостогу негизги идея – Ата Мекенди коргоо, мурда чабылып-чачылган урууларды бириктирүү, элдин эркиндиги, тынчтыгы үчүн, душмандарга өз кезегинде сокку уруу. Жомокто баатырдык эрдик жана эли-жерин сүйүү өтө бийик кадырланат. «Эр жигит эл четинде, жоо бетинде», «Жатып өлгөнчө, атып ол+, «Эр жигит үйдө туулат, жоодо өлөт» деген макалдар эл арасында жашап келет."},{"t":"p","h":"Чыгарма элдин көз каранды болбостугу үчүн Манас, Алмамбет, Чубак өңдүү баатырлар, Бакай, Кошойдой адилет акылмандар болуу чабылып-чачылган —"},{"t":"p","h":"разрозненные өз кезегинде – свое-"},{"t":"p","h":"временно сокку уруу – нане-"},{"t":"p","h":"сти удар кадырланат – це-"},{"t":"p","h":"нится жоо бетинде – пе-"},{"t":"p","h":"ред пицом врага көз каранды бол-"},{"t":"p","h":"бостугу учун – за независимость <span class=\"pg\" data-n=\"23\">23<\/span>керектигин далилдейт. Баатырдын кырк чо. росу да Манасты согушта жеңиштерге жеткирген, эрдиктери менен баатырдын эрдигин камсыздап турушкан."},{"t":"p","h":"Манас көп учурда Кошой балбанга, Бакай акылманга таянып иш кылат. Алтайдан кыргыздарды көчүрүп келип, Ала-Тоону далилдейт – дока-"},{"t":"p","h":"зывает жеткирген – дово-"},{"t":"p","h":"дит камсыздап туруш-"},{"t":"p","h":"кан – обеспечивали душмандардан бошотуп, бүт элди бириктирүүдө Манас баатыр өзүнүн жанындагы акылман Бакайга, алп Кошойго ишенет. Кошой"},{"t":"p","h":"эпостогу баардык каармандардан улуу адам. Ал көптү көргөн, акылман, кыраакы (дальновидный) жана балбан адам болгондуктан, Манас баш болуп анын айтканына көнүшөт (соглашаются). Көкөтөйдүн ашында калмактардын «мас болгон пилдей чамынган» балбаны Жолой менен күрөшкө эч ким каршы чыкпай, сексендеги Кошой намыска турат да, Жолой менен күрөшөт, ЭКолойду женет. Кошойдун образы – элдин башын кошкон, туура жолго баштаган, терең акылман карыянын, теңдеши жок балбандын образы, эл туткасы."},{"t":"p","h":"Бакай – акылмандыктын, калыстыктын, кең пейилдин үлгүсү. Чоң казатка чыгарда Манас чоролору менен кеңешип, алгач Бакайды кол башчы, Алмамбетти жол башчы кылып дайындайт. Жолго чыкканда Алмамбет аскердин жүрүшүнө, тартибине нааразы (недоволен) болот. Аскердик тартипти чыңдоо керек, болбосо Кытайга барчу жол узак, ийгилик болбойт дейт. Манас эми кол башчылыкты Бакайдан Алмамбетке тапшырат. Муну Бакайга Серек менен Ажыбай: «Манас сизге кечээ берген кандыкты кайта алып салды»,- деп айтып барышат. Кең пейил Бакай: «Алмамбет баатырды баламдан жакын көрөмүн. Аскерин башкарсын, бачым барып айткыла»,- деп каткырып күлүп жооп берет, Бакайдын аталык мээрими күчтүү болот. Ал Манас үчүн бир тууган ага, кандуу согуштарда жоокер, тиричиликте насаатчы (наставник) болгон туруктуу каарман."},{"t":"p","h":"Манас өзүнүн чоролору, жакын достору, насаатчылары менен кыргыз мамлекетин түзөт, чыңдайт. Анын ишин уулу Семетей улантат. Атасынын өчүн Коңурбайдан алып, душмандарды жеңип, ички душмандардан элин бошотуп, адилет кан болот. Семетейдин жолун улантып, Сейтек баатыр эл биримдигин сактайт. Ыдыраган кыргыз урууларын ынтымакка келтирип, ата-бабасынын көтөргөн идеясын сактоо үчүн бүт өмүрүн арнайт, Ошентип, элдин эркиндиги үчүн күрөшүү идеясы эпостун үч бөлүгүндө тең терең мааниге ээ. Жаңы сөздөр:"},{"t":"v","l":["тутка – опора","ыдыраган – разлаженный, рассеянный в разные стороны","Эстегиле! Тааныш сөздөр:"]},{"t":"p","h":"балбан – силач (9-кл.‚ 20-6. Манастын образы: Манас балбан гана эмес,"},{"t":"p","h":"иштин ыгын билген акылман, калыс, көпчүлүктүн күчүнө ишенген, чынчыл, адамгерчиликти сүйгөн боорукер адам.) <span class=\"pg\" data-n=\"24\">24<\/span>каарман – герой {7-кл.‚ 34-б. Тоголок Молдонун «Кемчонтой» поэмасы"},{"t":"p","h":"жөнүндө: Тоголок Молдонун бул чыгармасы элдик жомоктун негизинде жазылган сатиралык чыгарма, Поэмадагы баш каармандар – Кемчонтой менен Багдагүл."},{"t":"p","h":"1-ил., 56.6. «ФЭрте келген турнпаларә повести жөнүндө: Повесттеги башкы"},{"t":"p","h":"каарман – Султанмурат,) теңдеши жок – несравнимый (9.кл., 9-6. Сагымбай Орозбак уулу: Анын"},{"t":"p","h":"жер-сууну, табиитты сүрөттөгөнү теңдешсиз.» }"},{"t":"p","h":"Тапшырмалар:"},{"t":"p","h":"1. «Манас» эпосунун негизги идеясы жөнүндө айтып бергиле."},{"t":"p","h":"2. «Манас» эпосундагы негизги каармандарды атагыла, Суроолорго"},{"t":"p","h":"жооп бергиле:"},{"t":"p","h":"Кошой балбли менен кырк чоронуи образдары кандай мааниге ээ? Айкөл Манас өзүнүн негизги ой-тилегин ишке ашыра алдыбы? Ма-"},{"t":"p","h":"настын кыргыз мамлекетин түзүү жана чыңдоо иштерин кимдер улаган?"},{"t":"p","h":"3. Биз – Манастын бүгүнкү урпактары, анын идеяларын улантып"},{"t":"p","h":"жатабызбы? Бул жөнүндө аңгеме түзгүлө."},{"t":"p","h":"4. Төмөнкү сөздөрдүн синонимдерин жанай аитонимдерии талп,"},{"t":"p","h":"дептериңерге жазып алгыла: балбан, баатыр, биримдик, эркиндик. курөш, эл„ мекен, тутка."},{"t":"p","h":"5, Төмөнкү сөздөрдүн омонимдерии таап, дептеринерге жазып алгыли:"},{"t":"p","h":"бет, кан. кандык. урпак."},{"t":"p","h":"6. «Манас» эпосунун каармандарын мүнөздөн көрсөткөн синквейндерди"},{"t":"p","h":"түзгүлө, Мисалы:"},{"t":"v","l":["Манас","Күчтүү, эр жүрөк","Коргогон, согушкан, башкарган","Әр жүрөк Манас элин коргогон.","Баатыр","","«Семетей» эпосу жөнүндө жалпы маалымат"]},{"t":"p","h":"«Семетей» – «Манас» эпосунун экинчи бөлүгү. Мында Манастын уулу Семетейдин төрөл. гөндөн өлгөнгө чейинки башынан өткөргөн окуялары айтылат. «Семетейде» да элдин биримдигин сактоо, чет душмандарга көз каранды болбостугу идеясы жакталып, элди, жерди суйуу, душманды жек коруу, баатырдык эрдик, патриоттук темасы улантылган."},{"t":"p","h":"иегизги каармандардын (Мабашынан өткөр-"},{"t":"p","h":"гөн- пережитые биримдик – един-"},{"t":"p","h":"ство"},{"t":"p","h":"улантылган – продолжено нас, Алмамбет, Чубак, Каныкей, Бакайдын) _ өзгөрүүсүз – без образдары өзгөрүүсүз түрдө «Семетейде» да сүрөттөлөт."},{"t":"p","h":"«Манастагы» кыргыздардын ички карамакаршылыктары «Семетейде» Абыке, Көбөш, Чынкожо, Толтой, Чачыкей, Кыяз, Канчоронун"},{"t":"p","h":"изменения ички карама-кар-"},{"t":"p","h":"шылыктары – внутренние противоречия <span class=\"pg\" data-n=\"25\">25<\/span>образдары аркылуу берилген. «Семетей» эпо. сунда кыргыз уруулары туш-тушка сүрүлүп, өзүнчөлүгү бут жоголуп, согуштук кучу кетип, четки душмандарга көз каранды болгон учуру айтылат."},{"t":"p","h":"Өткөн кылымдардагы жана ушул күндөгү жомокчулардын баары «Семетейди»:"},{"t":"p","h":"1. 1.Семетейдин жетим калышы, Букарда өсүп, Таласка келиши;"},{"t":"p","h":"2. Семетейдин Чынкожо, Толтой менен согушуп, Айчүрөктү алышы;"},{"t":"p","h":"3. Семетейдин Конурбай менен согушу; А. Семетейдин өлүмү деген төрт темада айтышат."},{"t":"p","h":"«Семетей» «Манастай» накта баатырдык эпос эмес. Андагы Бакай менен Каныкейдин оор абалына кайгыруу, мыкты баатырлардын жок болушуна өкүнүү, сүйүү, кектөө өңдүү талаптар бул эпоско лирикалык мүнөз (лирический характер) берип турат. Манас өлгөндөн кийинки Каныкейдин мундуу жашоосуна байланыштуу сюжеттерден корком психологизм көрүнүп турат,"},{"t":"p","h":"«Семетейди,» кагаз бетине биринчи ирет Чокан Валиханов түшүрүп, мазмунун кара сөз менен жазган. Андан кийин 1862-1869 жылдарда академик В. В. Радлов «Семетейден» 3005 сап ыр жазып алып, 1885-жылы өзүнүн «Түндүк түрк урууларынын эл адабиятынын үлгүлөрү» деген китебинде басып чыгарган. «Семетейди» эл оозунан жазып алуу иши 1930-жылдардан кийин гана кызуу жургузулген. С. Каралаевдин айтуусунда толугу менен өзүнчө китеп болуп жарык көргөн."},{"t":"p","h":"Эстегиле! Тааныш сөздөр:"},{"t":"p","h":"туш-тушка сүрү-"},{"t":"p","h":"плуп- отброшены в разные места өзүнчөлүк – само-"},{"t":"p","h":"стоятельность"},{"t":"p","h":"накта эмес – не совсем өкүнүү – сожаление кектөө – месть талаптар – требо-"},{"t":"p","h":"вания"},{"t":"p","h":"Түндүк түрк уруу-"},{"t":"p","h":"ларынын эл адабиятынын үлгүлөрү – образцы народной литературы северных тюркских племён эл оозунан жазып"},{"t":"p","h":"алуу иши – записать у исполнителей"},{"t":"p","h":"коз каранды болбостук – быть независимым (9-кл.. 22-б. «Манастын"},{"t":"p","h":"идеялык Чыгарма элдин душмаига кол караиды болбостугу учун Манас. Алмамбет, Чубак өңдүү баатырлар, Бакай, Кошойдой адилет икылмаидар болуу керектигин далилдейт.) кара сөз менен – прозой (6-кл., 134-б. «Поэзия. Ыргак, рифма жөнүндө"},{"t":"p","h":"түшүнүк»: Кыргыз элинин кара сөз түрүндөгү речи да, эпостору да, поэзиясы да уйкаштыкка ыктап турат, 8-кл,, 52-б. Т. Сыдыкбековдун «Көк серек» аңгемеси жөнүндө: Т.Сы-"},{"t":"p","h":"дыкбековдун кара сөздүн чон устаты экендиги «Кок серек» ангемесинде ачык даана көрүнөт.)"},{"t":"h3","h":"<span class=\"pg\" data-n=\"26\">26<\/span>«СЕМЕТЕЙДЕГИ» ОБРАЗДАР Семетейдин образы Эр Семетей атасы айкөл Манастын ордун басып, Манас өлгөндөн"},{"t":"p","h":"берки элдин күткөн тилегин ишке ашырат. Анын баатырдык мүнөзү, касиеттери атасы Манас баатырдан Семетейге өткөн. Ал элдин кыялындагы баатырдык идеалга төп келген, «каарданып урушса, катылышкан душманды жеңген» намыскөй эр. Семетейдин тулку бою Манаска окшош, кийим-кечеси, курал-жарагы, ээрчиткен жандыктары да бирдей. Себеби, Семетейдин төрөлүшү – Манастын кайрадан жаңыланып, жарыкчылыкка келиши (появление на свет) менен барабар, бул «Семетейди» жараткан (создавший) эл учун ото маанилуу байыркы тушунук (понятие). Ошондуктан, Семетейде Манастан калышпаган зор касиет, эпикалык сүр бар. Жоо жарагын алып, Тайбуурулга минип ок өтпөс, кылыч кеспес, отко күйбөс, сууга чокпөс касиетке ээ болот. Семетейдин образы аркылуу туруктуу, эр жүрөк, эл сүйгөн жигиттин үлгүсү берилет. Эпостун аягында Семетей өзүнүн алдына коюлган милдеттерин аткарып, ордун уулу Сейтекке берип, Бакай, Каныкей, Айчүрөк, Күлчорого кошулуп кайып болуп кетет. Себеби, элдин учкул кыялы Семетейди өлүмгө кыйбайт,"},{"t":"h3","h":"Айчүрөктүн образы"},{"t":"p","h":"«Манас» эпосундагы салтка айланган би р көрүнүш – баатырлардын өздөрүнө ылайык (подходящий) мыкты аялдары айрыкча даңазаланат. Айчүрөк ооган каны Акундун кызы. Манас менен Акун балдары төрөлө электе эле бел куда болушкан, Семетей менен Айчүрөк эс тартканда бир-бирин көрүп сүйүп калышат. Айчүрөктүн образы аркылуу акылман, кайраттуу, алдын-ала сезе билген, айлакер, ашкан сулуу аялдын үлгүсү көрсөтүлөт. «Шекерди көр, сөзүн көр, чолпонду көр, көзүн көр, жибекти көр, чачын көр, бели тутам, бети айдай» Айчүрөк жамандыкты алдын-ала билип, Семетей атасынын күмбөзүнө жөнөгөндө, кой, барба – деп айтат. Бирок Семетей өкүмдүгүнө (вспыльчивость), курчтугуна салып, жөнөп кетет да, ич ара чыккынчылыктын курманы (жертва внутреннего предательства) болот."},{"t":"v","l":["Жаңы сөздөр:","касиет – свойство","төп келген – туура кепген; подходящий","катылышкан – схватившийся","намыскөй – защищающий честь","тулку бою – весь целиком","эпикалык сур – эпическое величие","бел куда – сваты. просватывающие своих ещё не родившихся детей"]}],"sub":[{"title":"«СЕМЕТЕЙДЕГИ» ОБРАЗДАР Семетейдин образы Эр Семетей атасы айкөл Манастын ордун басып, Манас өлгөндөн","b":64},{"title":"Айчүрөктүн образы","b":66}],"pages":[23,26]},{"title":"«Семетей» эпосунун кыскача мазмуну","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"27\">27<\/span>«Семетей» эпосунун кыскача мазмуну"},{"t":"p","h":"(Саякбай Каралаевдики боюнча) Манас баатыр өлгөндөн кийин Манастын аталаш иниси Көбөш Каныкейди алмак болуп, кырк чоросу менен Манас ордого чабуул жасайт. Манастын казына башчысы тоого бекинет."},{"t":"p","h":"Манастын мураскорун, уулун сактап калуу үчүн Каныкей Букарага качат. Букарада Каныкейдин атасы Темиркан Семетей 12 жашка чыкканда «Билгенге Семетейдин тою, билбегенге Манастын ашы» деп той берип, өзүнүн мураскору кылып жарыялайт. Каныкей алтымыш асый Тайторуну төлгө кылып, байгеге чабат."},{"t":"p","h":"Семетей келечекте баатыр болуп, Манастын ордун басар бекен деп үмүттөнөт. Семетейди үйүнө ээрчитип барып, Манастан калган өтүк, кылыч, тебетей, чепкендерин берет, карасанатай кандар Семетейди өлтүрүүнү ойлогонун айтат."},{"t":"p","h":"Семетей ал кандарды сабап, туш-тушка таратат, Токойдо бир көмүрчү Сарытаз деген киши Семетейге элинин, жеринин кабарын айтат. Каныкей аргасыздан чындыкты айтып берет. Манастын керээзин аткарып, Букарага качып келгенин түшүндүрөт. Таласта атасы Манастан калган мүлктөрдүн жайын айтат."},{"t":"p","h":"Семетей Таласка келип, атасынын күмбөзүнө барып, чоң атасы Жакыпка, Алмамбеттин уулу Күлчорого жана башкаларга кезигет. Чоң атасы Жакып, Манастын аталаш инилери Абыке, Көбөш Семетейге касташып, кол салышат. Семетей душмандарын жеңет."},{"t":"p","h":"Айчүрөк экоо жолугушуп, бири-бирин сүйүп калышат. Кудалашып, колуктусу Айчүрөккө үйлөнөт (женится). Семетей атасынын душманы Коңурбайдан Манастын кунун алууга аттанат. Семетей, Бакай, Күлчоро, Канчоро чектеш Кытайдын кулжасын, куу-өрдөгүн атып салышат. Жылкычы башы Карагул Семетейди алдап, Семетейдин башын айра чаап, качат. Карагулдун кабары боюнча Коңурбай көп кол менен келип, Таластын суусун буруп салып, согуш баштайт. Семетей Конурбайды жеңет. Кыргыздар кытайларды Бээжинге дейре кууп барат. Ал жерден миң пилге жүктөлгөн дилде алып, кайра Таласка келишет."},{"t":"p","h":"алмак болуп – хо-"},{"t":"p","h":"чет жениться чабуул – атака казына башчы -"},{"t":"p","h":"казначей мураскор – наслед-"},{"t":"p","h":"ник"},{"t":"p","h":"алтымыш асый"},{"t":"p","h":"шестьдесят асыйев үмүттөнөт – наде-"},{"t":"p","h":"ется карасанатай – нена-"},{"t":"p","h":"вистник өлтүрүүнү ойло-"},{"t":"p","h":"гон- хотели убить туш-тушка тара-"},{"t":"p","h":"тат— разгонит во все стороны кабарын айтат —"},{"t":"p","h":"расскажет мүлк —- имущество"},{"t":"p","h":"касташуу – враж-"},{"t":"p","h":"довать"},{"t":"p","h":"кудалашуу – сва-"},{"t":"p","h":"таться колукту – невеста"},{"t":"p","h":"кулжа – горный ба-"},{"t":"p","h":"ран куу-өрдөгү – птица."},{"t":"p","h":"дичь"},{"t":"p","h":"дилде – золотая мо-"},{"t":"p","h":"нета пятирублевого достоинства"},{"t":"p","h":"<span class=\"pg\" data-n=\"28\">28<\/span>Манастын бажасынын уулу атасынын кунун доолап, бөлөсү Семетейге кол салат. Күлчоро Үмөтөйдү өлтүрөт. Семетей Үмөтөйдүн сөөгүн Тайбуурулга жуктетуп (загрузив) жөнөтөт."},{"t":"p","h":"Канчоро душмандык кылып, Семетейди алдап, Манастын күмбөзүнө алып келет. Ал жерде бээ союп, эт бышырып, куран окутуп жатканда жедигер каны Кыяз көп кол менен Семетейди жарадар кылат. Семетей жарадар болгондо катуу бороон башталып, калың туман түшөт, Кыяздын аскери кырылат. Семетей эч кимге корунбей кездон кайым болот,"},{"t":"v","l":["Эстегиле! Тааныш сөздөр:","бажа – саояк"]},{"t":"p","h":"сөөк – кости, тело"},{"t":"p","h":"после смерти"},{"t":"p","h":"көздөн кайым болот – скроется из виду, исчезает"},{"t":"p","h":"мурас-наследие, наследство (7-кл., 1-б. «Киришүү: Кыргыз эли – бай жана"},{"t":"p","h":"кызыктуу фольклордук мурастын ээсн. } керээз – зашчцание, предсмертиое наставление {9-кл., 13.6. «Көкөтөйдүн"},{"t":"p","h":"ашы» бөлүмү: Көкөтөйдүн уулу Бокмурун атасынын айткан керээли, Манастын кеңеши боюнча Каркырага эл чогултуп аш берет.) жылкычы башы-главный табунщик (Т.кл., 10-6. «Манасе эпосунун кыскача"},{"t":"p"," н Айчүрөктү ал»,- деп көкүтөт. Толтой макул болбойт, Чынкожо аны «достуктун антына коём!» – деп коркутат. Өзүнүн жеке, тар кызыкчылыктары үчүн Чынкожо Толтойду чоң чырга аралаштырат. Чынкожо өз кызыкчылыгы үчүн эч нерседен кайра тартпайт. Анын баатырдык ар-намысы жок, жекеме-жеке беттешүү эрежелерин билбейт. Семетей менен жекеге чыгып, Чынкожо жеңе албайт."},{"t":"p","h":"Эми кезекти Семетейге берүүнүн ордуна чокмору менен башка уруп өтөт. Асмандап учуп, Семетей, Кулчоролорду мына елтурәм деген ишенимге дөгүрсүгөн Чынкожо Толтойго зомбулук көрсөтүүгө даяр турган. Чынкожо каарман жоокер катары өлүүгө татыктуу эмес."},{"t":"p","h":"таарынып – оби-"},{"t":"p","h":"девшись баш ийип берет"},{"t":"p","h":"экенмин – буду ПОДЧИНЯТЬСЯ сокур намыс-сле-"},{"t":"p","h":"пая гордость чөгөлөтүп – заста-"},{"t":"p","h":"вить пасть на колени колукту – невеста көкүтөт – поддраз-"},{"t":"p","h":"нивает тар кызыкчылык-"},{"t":"p","h":"тары -личные ин- тересы чырга аралашты-"},{"t":"p","h":"рат – вовлекать в ссору;"},{"t":"p","h":"кайра тартпайт – не"},{"t":"p","h":"отступает жекеме жеке бет-"},{"t":"p","h":"тешуу – борьба один на один зомбулук керсе-"},{"t":"p","h":"туу- подвергать жестокости татыктуу эмес – не"},{"t":"p","h":"достоин"},{"t":"h3","h":"<span class=\"pg\" data-n=\"30\">30<\/span>Мына ошон үчүн Семетей аны шыйрактан"},{"t":"p","h":"алып, ташка чаап өлтүрөт. Ал эми Толтой – жедигер уруусунун башчысы, элдик баатыр болгону менен, эрки бош, көңүлчөөк адам. Анын ошондоюн билип, Чынкожо Толтойду өзүнүн арам иштерине аралаштырган."},{"t":"p","h":"Толтой Семетейге чындап душман деле эмес. Бир канча жолу «ушу Семетей менен чырдашпай эле коёлучу» деп Чынкожону акылга чакырган, улам артын карап, кылчактаган, Бирок канчалык кыйылганы менен, Толтой Чынкожонун эркинен чыга албайт. Аргасыз Семетейге каршы урушка аралашып, акыры өлүп тынат."},{"t":"h3","h":"Адабият теориясынан"},{"t":"p","h":"эрки бош – без-"},{"t":"p","h":"вольный"},{"t":"p","h":"арам иштерн – не. достойные дела кылчактаган – ог-"},{"t":"p","h":"лядывался кыйылганы ме-"},{"t":"p","h":"нен- проявлял ОИК өлүп тынат – поги- бает"},{"t":"p","h":"Конфликт – көркөм чыгармада берилген бири-бирине карамакаршы турган эки идеянын, пикирдин ортосундагы каршылыктын жогорку формасы. Ал чыгармадагы каармандардын кулк-мүнөзүндөгү, көз карашындагы жана аракетиндеги күрөшүндө көрүнөт. Коом турмушундагы эски менен жаңынын, оң менен терстин ортосунда жүрүүчү элдешпес күрөш көркөм чыгармаларда адам мүнөздөрү аркылуу ачылат, Конфликт эпикалык жана драмалык текке мүнөздүү."},{"t":"p","h":"Эстегиле! Тааныш сөздөр:"},{"t":"p","h":"чатак – ссора, склока, конфликт (7-кл., 47-б. Аалы Токомбаевдин «Күүнүн"},{"t":"p","h":"сыры» аңгемесинен; – Эркем! Эми калыц болсо бүттү. Атаң дагы чатак кылып жатат, Качпайсыңбы? – деди жигит. .Жок, мырзам. Атамдын жалгыз кызы болсом, той тойлотпой туруп, босогодон аттабаймын. Атам эмне чатак кылып жатат? – деди кыз.) чокмор, чочмор – дубинка (Т-кл., 43.6. А, Токтомушевдин «Какшаалдан кат» поэмасынан:"},{"t":"v","l":["Атакем белин курчанып,","Чочморун алып кумсарып,","Эл менен кошо аттанган,)"]},{"t":"p","h":"шыйрактан алып – схватил за голень {7-кл.. 53.6. Аалы Токомбаевдин"},{"t":"p","h":"«Күүнүн сырых аңгемесинен: Учуп келе жаткан буурулдун алдыңкы шыйрагы сыртына чабыла түштү...) уруш – сражение, ссора, драка (7. кл., 94-б. «Эр Табылды» эпосунан:"},{"t":"p","h":"Урушту коюп эки жак, Буларды карап калыптыр.)"}],"sub":[{"title":"Мына ошон үчүн Семетей аны шыйрактан","b":68}],"pages":[27,30]},{"title":"ЧЫНКОЖОНУН СЕМЕТЕЙДЕН АТ СУРАТКАНЫ","blocks":[{"t":"h3","h":"ЧЫНКОЖОНУН СЕМЕТЕЙДЕН АТ СУРАТКАНЫ"},{"t":"v","l":["Эр Чынкожо ойлонуп,","Ок жыландай толгонуп,","Семетейге теңешип,","зо","ок жыландай толгонуп – извиваясь","как змея","теңешип – равняясь","<span class=\"pg\" data-n=\"31\">31<\/span>Бул сөздү айтты эгешип:","«Семетей» десе дардайып,","Уктап жатат барбайып.","Эси жок жетим баш болуп,","Этке, майга мас болуп.","Канын чачкан калмактан","Манастын кунун куубады.","Акун

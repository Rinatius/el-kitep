йрат болуп эмгекке,","Таза жүрөк жанган жалын эл үчүн!"]},{"t":"p","h":"Бул ырда бүткүл өмүрүн элдин тагдыры, кызыкчылыгы үчүн арнап койгон акындын поэтикалык образы жалындайт."},{"t":"p","h":"Анын поэзиясы эл ырчыларынын поэтикалык салттарына айкалышып чыгып, уйкашы, жеңил ыргагы менен айырмаланып турат."},{"t":"p","h":"Жоомарт Бөкөнбаев драматургия жанрында да белсенип иштеп, бир катар пьесаларды жаратты, 1937-жылы «Алтын кыз», 1939-жылы «Каргаша», 1939-жылы «Токтогул» операларына авторлош болгон, Ал бир катар очерк, публицистикалык сын макалаларды жазган. А. С. Пушкиндин, М. Ю. Лермонтовдун, А. Н. Некрасовдун, В. В. Маяковскийдин айрым чыгармаларын которгон."},{"t":"v","l":["ы уйкаш – складный","каргаша – помеха, препятствие"]},{"t":"h3","h":"Акындын патриоттук ырлары. «Антым»"},{"t":"v","l":["Жан алгыч салып тырмагын,","Жазыксыз кандар тегулду.","Ажыдаар сойлоп жеримле,","Ажалдын чогу тегулду.","Колума курал кармадым,","Коргоого тууган элимди,","Алдейлеп баккан журт үчүн,","Арнадым кырчын өмүрдү...","","Касташкан кара душманды,","Каптаймын жүргөн кыянча...","Арманым калбайт дүйнөдө,","«Актадың антың балам» деп,","Артымдан калкым кубанса...","","Талкалайт, элим, жооңду,","Тапшырып берген куралың.","Жыргалга кастык кылганды,","Жыландай жанчып, кырамын.","Кастарлап багып өстүргөн,","Калайык мени сынагын.","Өчүңдү алып бербесем,","Өмүрдө калкым ичирбе,","Өрүштүн салкын булагын...","","Көйкөлгөн ыраң шиберде,","Көпөлөк кууп өскөмүн.","","+5","Танкы жел коштоп көңүлдү,","Таалайдын күүсүн черткемин.","","«Садагам балам эркинче,","Сайрандап жүрүп өс» дедин.","Калайык ошол жыргалды,","Канткенде актап кетпейин...","","Айбыгып качсам душмандан,","Артымдан элим каргагын","Көмүлбөй сөөгүм чирисин.","Көмүүгө басып барбагын.","«Ал коркок атам эмес» деп,","Атымдан тансын балдарым...","Ажалдан башым тартпастан,","Ата журт үчүн жан берем","Калтырап, коркуп тургандай,","Кайратсыз өскөн жан белем,","Абалтан ата салт ушул -","Адамдын көркү эр менен.","","Ар үчүн өлсө эр жигит,","Айтылган элге калганы,","«Атакем баатыр болгон» деп,","Артынан айтар балдары.","Канча жыл кылым өтсө да,","Калкынын болор ардагы."]},{"t":"h3","h":"<span class=\"pg\" data-n=\"50\">50<\/span>(Көркөм сөз кулурети)"},{"t":"p","h":"Ж. Бөкөнбаев «Жел кайык» М. Ю. Лермонтов «Парус» Агарат жалгыз жел кайык —"},{"t":"v","l":["Көгөргөн деңиз үстүндө,","Алыстан эмне издемек,","Калтырды эмне бул жерде.","Толкундар ойноп, жел согот,","Качырап кайык козголот,","Бактыны издеп барбады,","Бактыдан да качкан жок.","Астында деңиз шарпылдайт,","Үстүнөн күн нур жаркырап,","Бороонду сурайт ал тентек.","Бороондо тынчтык барчылап.","Белеет парус одинокой"]},{"t":"p","h":"В тумане моря голубом!.. Что ищет он в стране далекой? Что кинул он в краю родном?.. Играют волны – ветер свищет, И мачта гнется и скрыпит... Увы! Он счастья не ищет, И не от счастья бежит!"},{"t":"p","h":"Под ним струя светлей лазури. Над ним луч солнца золотой... А он, мятежный, просит бури, Как будто в бурях есть покой! Ырлары жана поэмалары орус тилинде которулган. «Ардак белгиси» ордени менен сыйланган. Бөкөнбаевдин ысымы республикабыздын айрым кыштактарына, мектептерине жана шаар көчөлөрүнө коюлган. Акынга эстелик тургузулган."},{"t":"h3","h":"«Алтын кыз» драмасы"},{"t":"p","h":"«Алтын кыз» драмасы фольклордук салтты реалисттик орус адабиятынын тажрыйбалары менен ишенимдүү айкалыштыра билүүнүн далили деп айтышка негиз бар. Буга пьесанын баш каармандарынын образы ачык далил. Драмасынын каармандары чу деген эле жерден бири «арстан», экинчиси «тоонун эркин улары, кыздын сулуусу» болуп мүнөздөлөт"},{"t":"p","h":"Чынар – өз эркиндигин сезген, алдыга умтулуп, элдин талабын аткарууга, өз табынын кызыкчылыгы үчүн өмүрүн кыюуга даяр турган кыргыздын алдыңкы кыздарынын образы. Жаңы турмуштун өсүш темпине тоскоолдук кылуу, элди иренжитүү максаты менен Момуш, Мадылар колхоздун пахта сакталган складына өрт коюп жаткан учурда Чынар жанын аябастан биринчи болуп өзүн отко таштап, аны өчүрүүгө аракет жасайт."},{"t":"p","h":"Ал эми Жапардын образын түзүү автор үчүн онойлукка турган эмес, Турмушта Жапардын прототиби бар. Ал прототип автор тарабынан кыйла өзгөрүүгө учураган. Бала кезинде капчыгайда басмачылар менен кармашып, өлүм алдында жатса да комсомол комитетинин тапшырмасын толук аткара албай калганына өкүнүп, кайгырган Жапарды автор партизан отрядынын жетекчиси катары сүрөттөп берген."},{"t":"p","h":"Демек, Жапардын образы пьесанын идеялык мазмунун тереңдеткен революциячыл күрөшкө бүт өмүрүн арнап койгон күрөшүүчүнүн образы катары алынган. Жапар али өзү көрүнүп, сахнага кире электе эле түрдүүчө макталып, көпчүлүк эл да, Чынар да аны даназалап чыдамсызданып күтүшөт."},{"t":"v","l":["<span class=\"pg\" data-n=\"51\">51<\/span>Коюу түндүн кучагынан,","Тигил кайсы үн салган?","Күткөн Жапар ошол болот,","Чынар мында нурданган.","„Күткөн Жапар ошол болот,","Биздер мында нурданган."]},{"t":"p","h":"Жапар – жалаң эле эр жүрөк, баатыр, акылдуу эмес. башка ар кандай жакшы сапаттардын алып жүрүүчүсү. Ал – сулуу, ырчы. («Чынар: «Жапардын жарык мандайын көрөр күнүм барбы?» – десе, Ажар: «Курбулар, көптөн бери Жапардын созолонтуп ырдаганын сагындык» – дейт). Бирок кеп мында оң каармандардын он сапатын саноодо, аларга тагылган эпитетте эмес, а автор, пьесанын персонаждары үчүн Жапар, Чынар, Кузнецовдор даназалоонун, таңыркап тамшануунун, жүгүнүп-сыйынуунун предмети экендигинде."},{"t":"p","h":"Элдердин мурдатан түптөлгөн достугу колхоз курулушу жылдарында ого бетер чыңдалды. Пьесада достук мамилесинин күбөсү катары «жыйырма беш миңчи» Кузнецовдун Жапарлар менен бирге тоо-токой аралап. басмачыларга каршы күрөшүшү аркылуу сүрөттөлгөн. Кузнецов Жапарлар менен дайым кенештеш, кезегинде акыл айтат, кезегинде алардан кеңеш сурайт, Басмачылар талкаланып, Чынар туткундан бошотулгандан кийин да ал кыргыз жеринде эмгектенүүнү уланта берет,"},{"t":"p","h":"Жумушчу Кузнецов партиянын чакырыгы боюнча жыйырма беш миңчилердин катарына кошулуп, Кыргызстанга келип басмачыларга каршы күрөшүүдө орус адамына мүнөздүү чыдамдуулукту. туруктуулукту көрсөтүп, кыргыз айылында Совет бийлигин чыңдоодо аянбай кызмат аткарган орус коммунистинин жалпыланган образынын деңгээлине чыккан,"},{"t":"p","h":"Ошентип, пьесанын каармандары – Совет бийлигин кыргыз айылында чыңдоо күрөшүнө тирек болгон жаңы адамдар. Окуя баатырдын жар издеши жөнүндөгү сюжет боюнча өнүгөт. Баатырдын (Жапардын) колуктусун партизандар («басмачылар») туткундап алып кетишет. Сюжеттин мыйзамына ылайык, баатыр жигит душмандарды жеңип, жарын куткаруу керек. Автор эле эмес, пьесанын каармандары да окуянын кандай өнүгөөрүн алдын ала билип турушат."},{"t":"p","h":"Жапардын намысы болсо, сүйгөн кызын издеп барар, ошондо таштуу капчыгайда канын төгөрмүн, – дейт Чынарды туткундаган Момуш."},{"t":"p","h":"Пьесанын каарманы – Чынар, Ага берилген негизги мүнөздөмө – «токсон кайрып ышкырган, тоонун эркин улары». Ал, албетте, жандан ашкан сулуу: ага «нурданган», «жаркын кыз», «көркөмү Чынар келишкен», саамайы «тал-тал өрүлгөн», маңдайы «таңкы чолпон жылдыздай», көзү «айнектей», «замандын гүлү» деген мүнөздөмөлөр берилет, Жапарга салыштырганда пьесада Чынар көп орун ээлейт, анын ролу кеңирирээк, ал түрдүү драмалык кырдаалдарда көрсөтүлөт. Демек, анын образын ачуу үчүн материал байыраак."},{"t":"p","h":"Бул драмалык жагдай шарттардын баарында тең Чынардын мүнөзүнүн бир гана жагы – баатырлыгы көрсөтүлөт."},{"t":"p","h":"Жапардын өлүмү жөнүндөгү мотив башкача өнүгүүгө мүмкүн беле?"},{"t":"p","h":"<span class=\"pg\" data-n=\"52\">52<\/span>Мисалы, партизандар Жапардын өлгөндүгүнө Чынарды ишендирип коюшу, же болбосо Жапар чын эле өлүп калышы мүмкүн беле? Албетте, мүмкүн болчу. Анда героиня өзүн кандай алып жүрүшү ыктымал эле? Кармашып жатып курман болмокпу? Жапар өлгөндөн кийин эми ким болсо баары бир деп Токторго токол болууга макул болмокпу? Кайгыга, ыза-кордукка чыдабай акыл-эсин жоготуп жинди болуп кетмекпи? Мындай варианттардын токсон тогузун келтирүүгө болор эле."},{"t":"p","h":"Бирок автор булардын бирин да тандап албайт. Жапардын өлүмү жөнүндөгү сөз пьесада кокусунан пайда болуп, кыстырыла кетет да, өнүгүп-өөрчүбөстөн ошол эле замат кайра жокко чыгарылат. Бул кокустукпу? Албетте, жок. Жогоруда биз санаган мүмкүндүктөрдүн баары адабияттын, эстетикалык ой жүгүртүүнүн бүгүнкү күндөгү позициясынан, көз карашынан алганда гана мүмкүн. Ал эми 30-жылдардын идеологиялык талабынан, нравалык көз карашынан жана эстетикалык түшүнүгүнөн алганда, буларга жол берилмек эмес, Баатырлык жөнүндөгү эпостук түшүнүккө жана адамды сүрөттөөдөгү эпостук принципке ылайык, каармандын ички күрөшүн, карама-каршылыгын, олку-солкулугун көрсөтө турган ар кандай жагдай шарт четке кагылып ташталат да, анын мүнөзүнүн бир гана белгиси, бир гана психологиялык ал-абалы – баатырдыгы көрсөтүлөт жана героиня түрдүүчө макталып данкталат."},{"t":"p","h":"Пьесанын темасы – ушул убакка чейин саясы-коомдук душмандар катары адабиятта, театр, кино ж, б. чыгармаларда терс образдар катары сүрөттөлүп келген партизандар («басмачылар») менен кызыл аскерлер (ыктыярдуу отрядчылар) ортосундагы күрөш."},{"t":"p","h":"Пьесанын «Алтын кыз» деген аты да метафоралык мааниде алынган. Андан биз сөздүн түз маанисиндеги алтынды эмес, эл үчүн аткарган иши алтындай кыздын сүйкүмдүү элесин түшүнөбүз."},{"t":"v","l":["Ж салт – обычай","далил – доказательство, довод, аргумент","тоскоолдук – трулность","бетер чыңдалды – лучше оправдался","чыдамдуулук – терпеливость, выносливость, стойкость","туруктуулук – постоянстпо","С Алтын кыз","(Драмасынан узунду)","","Катышуучулар:"]},{"t":"p","h":"Жапар – басмачыларды жоготуу учун түзүлгөн эрктүү отряддын командири – 25 жашта,"},{"t":"v","l":["Чынар – колхоз жумушундагы активдүү кыз – 17 жашта,","Эне – Чынардын энеси – 55 жашта."]},{"t":"p","h":"Кузнецов – эски жумушчу. Иваново-Вознесенскийден келген (25 минчи) – 45 жашта."},{"t":"v","l":["Ажар – Чынардын курбусу – 25 жашта.","Момуш – мурунку кулак, соодагер. Басмачы – 40 жашта.","<span class=\"pg\" data-n=\"53\">53<\/span>Калыбек – эл ырчысы – 60 жашта.","Токтор – бай – 70 жашта.","Берик – дувана – 45 жашта."]},{"t":"p","h":"Калдыр – жесир катын, басмачылардын тыңчысы. Улутчул 35 жашта. Ады-корбашы -— 55 жашта."},{"t":"p","h":"Булардан башка: кыз-келиндер, жигиттер, көпчүлүк эл, отряд жана басмачылар катышат."},{"t":"h3","h":"Көшөгө"},{"t":"p","h":"Алыстагы көрүнгөн ак кардуу тоо. Толгон ай, Тирелишип өскөн кайыңдардын бутактарына курулган селкинчектер. Жасалгалуу кийинген кыз-келиндер, жигиттер шаттуу ойноп ырдап жатышат."},{"t":"v","l":["Баары: Кыл аркандын селкинчек,","Кыздар ойноп эркиндеп,","Кыл аркандын селкинчек","Кыздар да ойноп эркиндеп,","Айлуу түндүн салкын жел,","Айдай тепсек желпинсек.","Айлуу тундун салкын жел,","Айдай тепсек желпинсек.","Жигиттер: Жашыл көйнөк турдей жан,","Жаш өмүрүн гүлдөй жан,","Жаш өмүрүң өткөн соң,","Жанып келбейт мындай жан."]},{"t":"raw","h":"<h4 class=\"mk\">Кызлар: Ажар: Кыздар: Жигит:<\/h4>"},{"t":"v","l":["Кызыл көйнөк түрдөй жан,","Кыз өмүрүң гүлдөй жан,","Кыз өмүрүң өткөн соң,","Кызый келбейт мындай жан.","(Кубанып). Сулуу түндүн салган,","Элдин шаттуу жаштары,","Кимди сүйөт болду экен,","Элдин Жапар арстаны?","Кимди сүйөт болду экен —","Элдин Жапар арстаны?","Токсон кайрып ышкырган","Тоонун эркин улары,","Кимди сүйөт болду экен,","Кыздын сулуу Чынары?","Жигиттер: Кимди сүйөт болду экен,","Кыздын сулуу Чынары?"]},{"t":"raw","h":"<h4 class=\"mk\">Баары: Чынар:<\/h4>"},{"t":"v","l":["Тоодо кирген дайранын,","Шарындайсың жашчылык.","Толкун өмүр бар чакта,","Жалындайсың жашчылык.","Кимди сүйөт Чынар жан","Кимдин көөнүн шат кылып?","Адамзаттын жадырап,","<span class=\"pg\" data-n=\"54\">54<\/span>Гулдеп турган кези ушул.","Акын булбул комузун,","Куулеп турган кез ушул.","Агын суудай шар менен,","Бийлеп турган кез ушул.","Келин дебей, кыз дебей,","Кемпир дебей, жаш дебей,","Өмүр күнүн сүрөбүз,","Өркүндөйбүз күлөбүз,","Өчпөс таалай мекени —","Өлкөбүздү сүйөбүз."]},{"t":"raw","h":"<h4 class=\"mk\">Ажар: Жапар: Жапар: Чынар: Жапар: Чынар:<\/h4>"},{"t":"v","l":["(Сүйүнүп). Коюу түндүн кучагынан,","Тигил кайсы үн салган,","Күткөн Жапар ошол болот,","Чынар мында нурданган!","Отряд, смирно! (Отрядчылар тизилип турушат).","Оюн курган келин, кыздар,","Оюндарын кут болсун!","Эркин турмуш көркү болуп,","Эрке ойногон кыз болсун.","Жаз нурундай сайрандаган,","Жасалгалуу заманды.","Жаңы айылдын көркү болгон.","Жаркын достор, аманбы?","Эл камы үчүн кан төгүп,","Кармашканлар аманбы?!","Эл камы үчүн өмүрлөрүн,","Арнашкандар аманбы?","Айлуу түндө сайрандап,","Айлуу түндө сонун да,","Кош келгиле, курбулар,","Кошулгула оюнга!","Отряд, вольно! (Отрядчылар менен кыз-келиндер учурашат.","Жапар – Кузнецовго). Мына – Чынар, Чынар деген Чынар"]},{"t":"p","h":"ушул, (Келиндерге), Курбулар – мына жолдош Кузнецов, Иваново-Вознесенскийлик жумушчу туугандарыбыз бизге жар-"},{"t":"v","l":["дам үчүн жиберишкен.","Арыбай бетпак чөлдү баскандарлан,","Азаптуу тайгак даван ашкандардан,","От кечип кыргын күндөр арасынан,","Октябрь каалгасын ачкандардан.","(Куттуктоолор).","Баатыр уулу орустун,","Сизге салам айтабыз,","Бүт дүйнөнү терметкен,","Күчкө салам айтабыз.","Кузнецов: Салам айткан сөзүңө,","<span class=\"pg\" data-n=\"55\">55<\/span>Толкунданып турамын.","Мин ракмат силерге,","Жаркын кызым, Чынарым.","(Эл менен кол кармашып учурашып).","Кыз-жигиттер – селкилер,","Кырда ойносо эркиңер,","Кыз, жигиттин сүйгөн ойну,","Кырдан шапар тепсенер,","","я курбусу – подружка","соодагер – торговец","дувана – дервиш","улутчул – националист","селкиичек – качели","желпиисек – развеваться","ышкыр – свистеть","дайранын – реки","шарындайсын – бурлишь","жалындайсын – ярко светишь","булбул – соловей","өчпөс – не погаснувший","камы – забота","арнашканлар – посвешающие","курбу – ровесник, сверстник","бетпак чөл – дикая пустыня","селки – левушка, красотка","шапар теп – развлекаться, наслаждаться"]},{"t":"h3","h":"§ 1. Жоомарт Бөкөнбаевдин өмүр таржымалын айтып бергиле."},{"t":"p","h":"2. Акындын балалык кезин эскергиле."},{"t":"p","h":"3. Чыгармачылыгы тууралуу эмне билесиңер?"},{"t":"p","h":"4. «Алтын кыз» драмасы жөнүндө жана акындын эмгек темасына арналган ырлары тууралуу айтып бергиле."},{"t":"v","l":["5. Башкы каармандарды сүрөттөгүлө, аларга мүнөздөмө бергиле.","6. Салыштыргыла!","","«Алтын кыз»"]},{"t":"p","h":"драмадагы жаштар Мүнөздөрү"},{"t":"v","l":["Жашоо турмуштары","Жашоо максаттары","Досчулукка болгон мамилеси"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"56\">56<\/span>Билип алгыла!"},{"t":"p","h":"Жоомарт Бөкөнбаев 1924-жылы Жалал-Абаддагы Кок-Арт балдар үйүнө алынат, андан соң Оштогу педтехникумга, андан Фрунзедеги педтехникумга жиберилет. 1928-жылдан баштап ал Борбордук педтехникумдун студенти болот."},{"t":"p","h":"Он жети жашар Жоомарт басма бетине жарык коргон «Жер алган кедейлерге» аттуу туңгуч ырын Кыргызстандын түштүк бөлүгүндө 1927-жылы жүргүзүлгөн жер-суу реформасына арнап жазгандан баштап эле өзүнүн өмүрүн эл үчүн, Октябрь Революциясынын жеңишин бекемдеш үчүн арнап койгону таалим болот."},{"t":"p","h":"Акындын 1933-жылы Москвадагы журналисттер институтунда окуп келиши анын өмүрүндөгү эң кымбат күндөрүнүн бирине айланган."},{"t":"p","h":"1943-жылы Ж. Бөкөнбаев делегат болуп Украинага барат."},{"t":"p","h":"Ж. Боконбаев Москвадан окуп келгенден кийин драматургия жанрына да кайрыла баштайт."},{"t":"p","h":"Кыргыздын опералык искусствосунун башталышын белгилеген «Айчүрөк» операсы 1939-жылы жиарыкка келип, ошондон Ушу күнгө чейин театр сахнасынан түшө элек,"},{"t":"p","h":"Акындар: Ж. Турусбеков, Ж. Бөкөнбаев, К. Маликов «Манас» трилогиясынын бир эпизодунун негизинде операнын либреттосун, композиторлор А. Малдыбаев, В. Власов, В. Фере анын музыкасын жазышкан эле."},{"t":"p","h":"«Айчүрөк» операсы Кыргыз искусствосунун Москвада 1939-жылы өткөрүлгөн декадасында көрсөтүлүп, москвалык көрүүчүлөр тарабынан жогору бааланган."},{"t":"p","h":"Жоомарт Бөкөнбаев өтө кыска – 34 жаш өм үр сүрсө да, анын калеминен жаралган канаттуу ыр, поэмалар «Алтын кыз» пьесасы жана элибиздин тарыхындагы туңгуч «Айчүрөк» операсынын либреттосу кыргыз адабиятынын жолундагы мерчемдүү ийгиликтери катары кала бермек. = мерчемдүү – удобный, подходящий"},{"t":"h3","h":"АДАБИЯТ ТЕОРИЯСЫНАН"},{"t":"p","h":"Роман (франц. – итальян, португал ж. б. роман тилдеринде жазылган чыгармалар) – эпикалык түргө кирүүчү, турмушту ар тараптан кеңири жана жайбаракат сүрөттөөгө алган, каармандары көп жана алардын негизгилеринин образдарын ачуу үчүн бир канча эпизоддор киргизилген, композициялык түзүлүшү жана сюжети көп пландуу чыгарма. «Роман» деген термин 12-13-кылымда Батыш Европа адабиятында колдонула баштап, бул мезгилде роман тилдеринде (француз, итальян, португал ж. б.) чыккан кара сөз түрүндөгү чыгармалар аталган. Ал кезде термин азыркы маанисинде колдонулган эмес. Мезгилдин өтүшү менен терминдин мааниси өзгөрүп, азыр башкача түшүнүктү билдирип калды. Бул же тигил доордун улуттук адабий процессинин өнүгүшү биринчи кезекте роман жанрынын ийгиликтери менен өлчөнөт, Романдарда бир нече инсандын сапаттары, алардын иш-аракеттери, бүтүндөй бир мезгилдеги социалдык катмарлардын же <span class=\"pg\" data-n=\"57\">57<\/span>таптардын мүнөздүү жалпылыктары кенири сүрөттөлөт, Тилдик каражаттардын да ар кандай түрлөрү жазуучунун чеберчилигине ылайык кеңири пайдаланылат. Эгерде бир гана каармандын тагдырын көрсөтүүгө арналса, анын чөйрөсүн, алакалашкан адамдарын, аткарган иш-аракеттерин, жамаат ичиндеги ролун ачып берүүчү эпизоддорду киргизүү менен башка каармандардын образы да белгилүү деңгээлде ачылат. Роман жазуу үчүн автор сөзсүз кеңири масштабда ойлонот. Алгачкы романдардын пайда болушу кайра жаралуу доорундагы Боккаччонун «Декамерон», Сервантестин «Дон Кихот» деген чыгармалары менен байланыштуу. Дүйнөлүк адабияттын казнасын түзүп турушкан О. Бальзак, Л. Н. Толстой, Р, Роллан, В, Скотт, Г, Флобер, И. А. Гончаров, Ф. Н. Достоевский, Т. Манн ж. 6, улуу классиктердин романдары жанрдын кийинки өнүгүшүнө чоң салым кошту. Алардын романдарында бүтүндөй мезгилдердин татаал карама-каршылыктары терең ачылып берилген. Романдар мазмунуна, көлөмүнө, композициялык курулушуна жана катышуучу каармандарына карай төмөнкүдөй түрлөргө бөлүнөт: дилогия – эки, трилогия – уч, тетралогия – төрт, пенталогия – беш бөлүктөн турат, андан да көп бөлүктөрдөн турса романдар цикли деп аталат. Мис., О. Бальзактын «Адамдар тамашасы» романдар циклине кирет. Бүтүндөй бир доордун типтүү каармандарын жана окуяларын жогорку көркөмдүктө ачып берген, көптөгөн адамдардын образын көрсөткөн романдар роман-эпопея деп аталат. Буга Л. Н. Толстойдун «Согуш жана тынчтык», М, Шолоховдун «Тынч Дон», М. Ауэзовдун «Абай» романдарын көрсөтүүгө болот."},{"t":"p","h":"Кыргыз адабиятында роман жанрынын жаралышы кыргыз элинин улуттук жазуусунун пайда болушу менен тике байланыштуу. Бул процесске мурдатан жазмасы бар элдердин адабияты өзгөчө чоң таасир этти. Кыргыз романынын жанр катары калыптанышында Т. Сыдыкбековдун чыгармачылыгынын чоң мааниси бар. Анын «Тоо арасында», «Темир», «Биздин замандын кишилери», «Тоо балдары», «Жол», «Көк асаба» романдары улуттук сыймыкка ээ болгон чыгармалардан болуп калды. М. Элебаевдин «Узак жол», К. Баялиновдун «Боордоштор», У. Абдукаимовдун «Майдан», Т. Касымбековдун «Сынган кылыч», «Келкел», Ч. Айтматовдун «Кылым карытар бир күн» аттуу чыгармаларда каармандардын турмушун ар тараптан кеңири масштабда сүрөттөөдө далай эпизоддор киргизилген,"},{"t":"p","h":"Албетте, төмөнкү аталып келген чыгармалар кыргыз адабиятында роман жанрынын өсүп өнүгүүсүнө чоң таасир этти десек жаңылбайбыз."}],"sub":[{"title":"Чейрек жүгөрү ун жана Зулайка","b":2},{"title":"Жоомарт Бокенбаев","b":25},{"title":"Акындын патриоттук ырлары. «Антым»","b":37},{"title":"«Алтын кыз» драмасы","b":44},{"title":"Көшөгө","b":69},{"title":"§ 1. Жоомарт Бөкөнбаевдин өмүр таржымалын айтып бергиле.","b":80}],"pages":[44,57]},{"title":"Түгөлбай Сыдыкбеков","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"58\">58<\/span>Түгөлбай Сыдыкбеков"},{"t":"img","src":"data:image/webp;base64,UklGRv4aAABXRUJQVlA4IPIaAADQFAGdASqfARsCPrVUn0snMa2xrlP54jAWiWluHF401VwHPdfS5L7BaRMBeC12S6bjB8yuOIef5/z+ZMgYBqQtLzn лө баштады. Орус падышачылыгынын бийлик ээлери жергиликтүү манаптар менен келишип алып, Гүгөлбайлардын коңушун ээлеп, өздөрүн башка жакка сүрүп чыгышат. Аңгыча, 1916-жылкы Улуттук-боштондук көтөрүлүш чыгып Түгөлбайлар качкан кыргыздар менен Кытайга жөнөшөт. 1918-жылы кайра туулган жери Кең-Сууга келишет да, Василий Коровин деген орус адамына малай болушат. 1919-жылы кеч күздө Түгөлбайдын энеси аны Түнкатар деген молдого окууга берет, Арабча ариптерди кошуп жазып, сөздөрдү эжелеп окууга жарап калган кезде, 1920-жылы Кең-С ууда мектеп ачылып, Түгөлбай ошол мектепке кирип окуй баштайт. 1921-жылы Василий Коровин Түгөлбайды калаадан окутам деп Караколго алып кетет. Ал кышы менен орус тамгасын, орусча сөздөрдү үйрөтөт. Бул жөнүндө Т. Сыдыкбеков өзү минтип жазган: «...Мен орус тамгаларын жаңы жазып, бирок тез өздөштүрдүм. Канча айтса да элеттен алган билимимдин жардамы тийди. Эжелеп окууга мен да бат эле жетиштим. Эмнени окуганымды. чыны, туюна албадым далайга,"},{"t":"p","h":"һ Мурла Кең-Сууда экенде Василий уй-булесу менен кыргызча сүйлөшчү. Эми калаада алар өз тилинде сүйлөшөт. Менин көзүмө баары тең эле чын орус экени таанылды. Эми ушулардан орус тилин үйрөнүүгө тырыштым»."},{"t":"p","h":"1921-жылы Василий Коровин камалганда, Кең-Суулук кыргыздар бүт бойдон «бул кожоюндан биз жамандык коргөн эмеспиз, жакшылык гана көргөнбүз, бул жакшы киши, элдик киши» деп чечим кагаз беришип, аны камактан куткарып, бошотуп алышат. Василий Коровин Түгөлбайды <span class=\"pg\" data-n=\"59\">59<\/span>1923-жылы Караколдогу А. П. Чехов атындагы биринчи баскыч орус мектебине окууга өткөзөт, ал мектепти Түгөлбай 1927-жылы бүтүрөт."},{"t":"p","h":"«Дал ошол А. П. Чехов атындагы мектепте окуп жүрүп Пушкин, Гоголь, Тургеневдердин аттарын уктум. Ырас, алардын ар бири ааламга атагы кеткен улуу жазуучу экенин кийинчерээк тааныдым. Негедир орус жазуучуларынын ичинен эн алгач мага чыгармасы менен таанылган Тургенев болду», – деп эскерет Түгөлбай Сыдыкбеков ошол жылдардагы окуусу жөнүндө."},{"t":"p","h":"1929-жылы Т. Сыдыкбеков Фрунзедеги Айыл-чарба техникумунда окуп, аны бүткөндөн кийин, ошол жылы жаңыдан ачылган Ашхабаддагы Орто Азиялык зооветеринардык институтка кирет."},{"t":"p","h":"Т. Сыдыкбеков ошол кездеги кыргыздын бардык жазуучуларындай эле өз чыгармачылыгын поэзиядан баштады, Анын биринчи «Булар кимдер» деген ыры 1920-жылы басылып чыгат."},{"t":"p","h":"1936-жылы Түгөлбай Сыдыкбековдун «Баатырлар», 1938-жылы «Акын булбул» деген ырлар жыйнактары жарыяланды. Бирок келечектеги белгилүү романистти проза жанры өтө кызыктыра берди. Т. Сыдыкбеков да, башка кыргыз жазуучуларындай эле, орустун классикалык адабиятынан, орустун советтик мыкты жазуучуларынан, ошонун ичинде М, Шолоховдон да көп нерселерди үйрөнгөнүн танбайт. Бирок «Кең-Суу» романын түздөн-түз «Көтөрүлгөн дын» романынын таасири астында жазылган деп айтышка деле эч негиз жок сыяктуу. Анын үстүнө, М. Шолохов «Көтөрүлгөн дыңдын» экинчи китебин элүүнчү жылдары гана жазып олтурбайбы, Дегинкиси, таасир маселесин эске алган күндө да, аны биринчи пландагы чечүүчү фактор катары кароо эч убакта туура болмок эмес, Мисалы, «Кең-Сууну» жазууда Т, Сыдыкбековго, эң алды менен, турмуш чындыгынын өзү жана өзүндөгү жазуучулук дарамет күчтүү таасир эткенин эч убакта унутпасак. Эгерде «Көтөрүлгөн дыңда» коллективдештирүү учуру, андагы тап күрөшү сүрөттөлсө, «Кең-Суунун» биринчи китебинде коллективдештирүү мезгилине чейинки турмуш чындыгы, тагыраак айтканда, Совет бийлиги орногондон кийинки кыргыз айылдарында болгон өзгөрүүлөр, карапайым айыл адамдарынын аң-сезимдеринин жаңы замандын талаптарына карата акырындап ойгоно баштоо процесси кылдат жана билгичтик менен чагылдырылган. Ал эми, коллективдештирүү учуру, андагы карама-каршылыктар «Кең-Суунун» экинчи китебинде камтылган. Эгерде Т. Сыдыкбековдун өзүндө жазуучулук дарамет болбосо, эгерде ал ошол өзү сүрөттөп жаткан мезгилдеги кыргыз айылдарынын турмуш чындыгын жакшы билбесе, романын жаза алмак эмес. Ал эми, тигил, же бул жазуучудагы эстетикалык тажрыйбалардан үйрөнүү, аны өзүнүн чыгармачылык ишине сиңирип, жуурулуштуруп алуу бул кошумча көмөкчү факторлор катары оз алдынча мааниге ээ боло турган көрүнүш гана, ошондуктан ал эч качан негизги чечүүчү, жетектөөчү орунга көтөрүлө албайт. М. Шолоховдун Т, Сыдыкбековго болгон таасирин ушундай планда түшүнсөк, чындыкты туура жана так айткан болобуз."},{"t":"p","h":"Согуштан кийин жарыяланган «Биздин замандын кишилери» романы Т. Сыдыкбековдун атын союзга гана эмес, чет өлкөлөргө да таанытты, Роман үчүн Т, Сыдыкбеков СССРдин Мамлекеттик сыйлыгынын лауреаты деген наам алды."},{"t":"p","h":"<span class=\"pg\" data-n=\"60\">60<\/span>1957-жылдары дүйнөлүк тарыхта биринчи жолу Советтер Союзу косганда Т. Сыдыкбеков толкунданып, фантастикалык дастандарды жараткан моско р жандоочусун (спутник), андан кийин 1961-жылы адамды учур- «Күн жана анын балдары», № Жетимишинчи жылдары Т. Сыдыкбековлун жаны жазган «Сыр ачуу», урбулар» деген романдары жарык көрдү. Бул романдарында ошол кездеги студенттердин башынан өткөн турмушун чагылдырган."},{"t":"p","h":"ч Сексенинчи жылдары жазуучу үчүн өтө жемиштүү болду: «Ыманбай эим «Жол», «Көк асаба», «Мезгил сабактары» китептери жарык көрдү алпылап айтканда жазуучу кыргыз адабиятына чоң салым салган,"},{"t":"p","h":"айка кыйла жогору профессионалдык деңгээли менен айырчечек – оспа"},{"t":"v","l":["ырас – правда, действительно","наам – звание","ЫШ] Тоо арасында","(Романдан үзүндү)","Соке абышка"]},{"t":"p","h":"Тизме узарып баратканда Сапарбай ордунан турду да ар кимисине мүнөздөмө берип туруп: Бүбүш, Соке абышка. Жа кып жана Самтырды өкүлдүккө шайлоого сунуш киргизди."},{"t":"v","l":["– @тушсун!","– @тушсун!","– Сокеме, мына, колумду азыр көтөрөм.","– Карыган кезинде Сокем да бир өкмөтчү болуп калсын!"]},{"t":"p","h":"к... а жаш базан ордунан элпек турду да жарым кулачын ‚эки колун би ун бирдей көтөрдү. Калдастап шашкан калыбында жок. отт жат Сөз – Ой суруңарды урайындар. й"},{"t":"p","h":"– Угалык, сөзүңүздү айтыңыз, Каткан муундары жибип, кат-кат бырыш алган беттери албырып толкундап Соке: – Мени шайлап эмне кыласыңар? О айт, десенерчи. Бегирээк сүйлөгөндө ооздогу эски тиш өзү ыргып, көздүн курчу кетти Акыл ордунда жок. Мени койгула, Тетиги батрак өссүн, адам болсун, С амтырды шайлагыла! Сапарбай туура айтты. Бүбүш келинимди шайлайлы Акылы тунук жаштар, «А» сына да, «Бээ» сине де, «Сээ» сине да тилдери так келет. Лекбезде жүрүшүп, бат эле кара катты көздөрү таанып кетти, Ой, тигил сурунду урайын, Ыманбай экөөбүз үйдөгү жапма челекте эс дартыбыз Беш тамганы араң тааныдык. Алар да биз менен ыркын кошо элек. Күүгүмдөгү"},{"t":"p","h":"жүрөктү чочутат. Сурунду урайын, Ыманбай Манас экен, имди тоотпойт, уктап калат, Жаначы «А» лар чокмордон бетер косүйлөйт окшойм. Кемпирим муш менен бөйрөккө берет. Ой, ушул мен ры роктоп таң аткыча түшүмдөн да кетпейт. Кээ күнү чочуп кетип балдырап болгондо тамдын кырында мыёлоп олтурган мышык жерге тушпейт го."},{"t":"v","l":["<span class=\"pg\" data-n=\"61\">61<\/span>окмотчү- служащий (в государственном учреждении)","элпек – послушный, услужливый, проворный","бырыш – морщиться","чочу – пугаться, бояться","&lt; Текстти көркөм окугула.","Ыманбайдын элчиликке жөнөшү"]},{"t":"p","h":"Айтор элчиликке аттанган Ыманбай жол жомогун кыскарта чаап, айта кетер бир окуя: ал жана үйдөн аттанарда Бүбүнү шаштырып, өзүнүн жапма челегинен чоң аягы менен бирин тим, бирине талкан чалдырып эки «кара кер аяк» бозону жута чыккан. Башкадан ырысы тайкы болсо болор, ал эми Ымаштын үйүнөн жайы, кышы жапма челеги үзүлбөйт, күкүрттөнүп сары каймак тартып бозосу да күчтүү чыгат. Ушул күкүрттөнгөн бозонун кадыры менен (Шокуртту жайына коёлу) андан кийинки мыктылардын көбүнө Ыманбай теңтушсунчу. Айыл ынтымакта турган күндөрү ушул азыр өзү элчиликке бараткан Касейин да алда нече ирет мактап олтуруп Ымаштын бозосун ичкен."},{"t":"p","h":"– Адам жылкы кыял болотко – деди Ыманбай жолдо келатып өзүнчө. – Касейин чоң жерге куда түшкөмүн деп көөп кетсе, менин бозомду унутар. Болбосо сөзгө келер... Атаң көрү, Саадат атанын уулу да. Ал Айна сулууну ала качпаса, маа да элчилик кайда эле, Бах, чиркин дүйнө, өлбөгөн кедей кеңештин тушунда таалайга жетмек болду го."},{"t":"p","h":"Жанагы эки аяк бозосуна кызып, азыр ага эмки таттуу кыял эриш-аркак кубанычы толкуган Ыманбай кулакчынды көзүнө карай түртүп койду да кыңкылдап ырдады:"},{"t":"v","l":["Дуркун, дүркүн, дүркүндө,","Чиркин —","Дүнүйө өтөр бир күндө.","Алты күн атан болгуча,","Бир күнү бура болуп зиркилде!"]},{"t":"p","h":"Бах, жаша Айсарала! Биздин алтын баштар да бир күнү жер астында калат ээ! Кудайымдын бизге жиберген ушул зоболосуна ыраазыбыз... Алчактай бас, Сарала. Алчактай бас..."},{"t":"p","h":"Ал ангычакты болгон жок сууга келип такалды. Тарам-тарам өстөндөргө бөлүнбөй чогуу аккан бир айрыктын суусу майдалап көбүк чертип шуулдап жаткан экен. Теги санаадан күлүк жок белем, баягы Семетейдин Тайбуурулун минип Үргөнчтү кечкен Күлчоро азыр Ыманбайдын көз алдына келе түштү да, өзү да, Айсараласы да башкача болуп кеттиби? Айтор, – чү, жаныбарым! – деп эки-үч теминген сон Сарала эки алдыңкы колун «чулп» эттирип кашатка чыга берерде Сараланын күчөгөнүн эскербеске болбос. Ал тургай сопол куйругун шыйпатты көрүнөт: Ымаштын эки балтырына «топ-топ» кылдар тийди."},{"t":"v","l":["О, чиркин —","Дүнүйө өтөр бир күндө.","Алты күн атан болгуча,","Бир күнү бура болуп зиркилде."]},{"t":"p","h":"<span class=\"pg\" data-n=\"62\">62<\/span>Сараланын соорусуна сагызганча конуп алган Ымаш ушул кайрат менен «зиркилдей» бастырып, Касейиндин айлына кандай жеткенин өзү да сезбей калды."},{"t":"v","l":["№ сильные, крепкие","ынтымак – согласие, сдинодушие","дуркун – группа, толпа, отряд","чогуу – вместе, скопом","күлүк – скакун, скакопая лошадь,","сопол куйрук – облезший хвост"]},{"t":"h3","h":"Ыманбай менен Айсарала"},{"t":"p","h":"Сараласы желип-жортуп, тоо арасын көздөй кетип олтурду. Өзүнөн-өзү чубурган ачуу жаш жакасына таамп калат, Кандайдыр күңкүлдөгөнсүп үнү коңгурап коёт кез-кез:"},{"t":"p","h":"– О кудай-ай, о кудай басмачысына да кошулбайм, башкасына да кошулбайм, Тилегим ак, диним ыйман, о кудай-ай? Мени пендем десен. ушу калабадан аман ко-ой, о кудай? Айсарала ат астымда, Айкөлдүн тону үстүмдө о кудай. Үйдө аманат калган алты кыз менен акмак катынды да аман кой, кудай?"},{"t":"p","h":"Ушинткен Ымандай кайда баратканын өзү билбейт. Жаш чайыган сайын көзү тунарыктады. Жүрөгү калтаарып, далай жерге жеткендей болду... Улам барган сайын Сарала жаныбар кызып, күүлөнүп, ээликкенсийт... Алчактап, башын экчей салат... Тоону, ташты аралап, бир жонду ашкандай болду. Андан кайра ойго түштү, Дагы бир белеске чыкты, Андан капталдай жүрдү... Бир маалда Сарала жаныбар тык токтоду, Караса, алды бозорот. Чочуп кеткен ээси сүйлөйүн десе, үнү чыкпай, оозу ачылган бойдон калды. Бозоргон нерсе, улам соройду, Улам жакындагансыды... Бүткөн бою муз боло түшкөн бечара көздү бек жуумп, «Эмне болсоң ошо бол» деди. Айсараланы такымга басып, басып жиберди. Кудай жамандыкты көрсөтпөсүн? Сарала жаныбарын тулпар болуп кеттиби, ким билет? – Тоону, ташты аттап. аттап койгондой енкулдеду... Бир маалда Ымаш көзүн ачты эле, ээрдин актасы жоорун баскан Сарала кыйкактап. кекчеңдеп кандайдыр бир бадалдарды аралап баратат. Жанагы бозоргондон аман-соо кутулганына кубанган Ыманбай угуза кобурады;"},{"t":"p","h":"– Кудай сакта, жаныбарым? Кандай жерге келип калдык, кудурет? – Канырыгы түтөй түштү. – Ушундайындан сенден айрылгым келбейт да. Сенин баркынды билген мен элемин го, тулпар! Болду, ажалдан куткардын, жаныбар, Эки дүйнөдө тен саа ыраазымын. Темир өзөк дүйнөдө мал барбы, же нан барбы? Кокус. майып болсоң, баш сөөгүңдү үч жолдун айырмасына мазар илем жаныбар. Куугун келсе, куткар. Куюн тийсе, тоотпо, Жерге жарык киргенде, мени Көйкапка жеткир, жаныбар..."},{"t":"p","h":"Улам барган сайын жаныбары кекчендей басты, Көктөөсү сөгүлүп, актасы кажыган байыркы ээри «кыйч-куйч», Кандайдыр бир темирден чыккан шылдыр бар, Көрсө, Сараланын ооздугу салынбаптыр. Тизгин тарткан сайын башы катуулап, «ээ-жаа» бербей, «күчөгөнү» жана ушундан улам болсо керек?.."},{"t":"p","h":"<span class=\"pg\" data-n=\"63\">63<\/span>Айтор, дагы далайга жортту. Эчен талаа черлерди аралап, эчен таштуу кыялардан өткөндөй болду. Айтор, ким билет? Сарала жаныбар күчкубатты кайдан алган? – Учуп келатат, желип келатат, басып келатат..."},{"t":"p","h":"Каймагы алынган сүттөй чыгыш жак агарды. Тоо арасы жарык тартты. Бозоргон кызыр эмес, чөгүп жаткан таш экен. Арып-азган Сарала көрсө. атайы токтогон тура. Ээсин алдап, жедеп, дакиликтин «мектебин бүтүргөн» жаныбар айылдан анча узабаптыр, Тээ өрдөштөгү таш тумшукту улам айланып жүрө берген тура, Тигине, баягыда Бердибайлар конуучу конуш. Мына, баягыда түлөө өткөргөн өзөн, Аны көргөндө бечара Ыманбайдын жүрөгү шуу дей түштү. Кылчайып караса, арт жакта айылдын чексси даана көрүндү. Ыманбай кейип кетти. – Кеминде кырк кыр ашты десем. Кудайдын узун түнүндө ушу жерде жүргөн белең? Ушундай айбан болчусун. Кайнатпай шорду катырган чочко-о. Эми ком атрет жолукса, мени басмачы деп кармап калат ээ. Сенин териңди тескери сыйрыйт ээ..."},{"t":"p","h":"Не кыларын биле албай жан-жанына карап койду Ыманбай:"},{"t":"p","h":"– Ылайым ошентсе экен, чочко-о сени – деп кержейген Сараласын каргап койду Ыманбай... Анан амал издеп, акыл ойлоду. Атаганат десең мындайда акыл да өзү келет белем? Ыманбай көп турган жок. Аттан түшмөк болду. Түштү да, Ээрди шыпырып, тердикти төрт бүктөп, ээрге капшыра танды да, аны өзү көтөрүп алды. Башынан жүгөндү шыпырып, каржайып үргүлөп турган «жаныбарды» килтейген кендир чылбыр менен сооруга салды."},{"t":"p","h":"– Бар, чочко! Сени мен көргөн жокмун. Мени сен көргөн жоксуң, Бас- ч мачы болдуң деп ком артрет коркутса, коркутсун, Кайра өздөрүн беттен алайын. – Короктоп, короктоп салып уруп жүрөсүнөр. Кедей байкушту басмачы чочкодон не коргобойсунар? Айсараланы алып кетти. басмачы. Асыл башты темтейтип жөө калтырды басмачы дейин. Айкырык салып, айылга барайын эми..."},{"t":"p","h":"Тери шымдын каткан багелеги куудурап, ачык боз тондун эки этеги далбалактап, энтеңдеген Ымаштын көтөргөнү ээр токум. Чекесинен тер кеткен. Күн жерге, сууга тегиз жайылган мезгилде Ыманбай төрт кереге боз тамынын артына бута атымдай калды,"},{"t":"v","l":["м акмак – глупый, дурак","аман – благополучный, испредимый","белеске – к отрогу (ответвление, горный хребет)","бозор – обессилеть, блелнеть","тулпар – боевой конь, вылающийся скакун","мазар – могила, кладбище","куюн – вихрь, смерч","шылдыр журчание, шуршание","таштуу – каменистый","тескери – в обратную сторону, наоборот","амал – действие, поступок, 2. хитрость,","кендир – верёвка конопляная","байкушту – бедняга, белняжка (с оттенком сочуйствия]","айкырык – громкий и грубый крик, окрик"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"64\">64<\/span>§ 1. Т. Сыдыкбеков жөнүндө эмне айтып бере аласың?"},{"t":"v","l":["2. Жазуучунун балалык чагын айтып бер.","3. Кандай чыгармаларын билесин?","4. «Тоо арасында» романы качан жазылган?"]},{"t":"h3","h":"АДАБИЯТ ТЕОРИЯСЫНАН"},{"t":"p","h":"Новатордук (лат. – жаңыланып туруучу). жаңычылык – адабият жана искусстводо сөз чеберлеринин окурмандардын өсүп бара жаткан талабына ылайык келген, жалпы эле ошол элдин көркөм процесске кошулган мазмун жана формалык жактан жаратылган жаңылыгы, көркөм ачылышы, табылгасы, Жаңычылык мурдагы адабий салтт арды танып, жокко чыгарбайт, тескерисинче, ага таянат, жаңы шартка ылайык өздөштүрөт. Новатордук түшүнүгү жеке жазуучунун же жеке бир конкреттүү мезгилдеги адабияттын өнүгүшү менен тыгыз байланышта каралат. Кыргыз адабиятын биз новатор адабият дейбиз, анткени анын алдыңкы өкүлдөрү, биринчиден, турмуш көрүнүштөрүн терең өздөштүрүштү жана чыгармалары үчүн бул нерсени баалуу булак кылып пайдаланышты, экинчиден, элдик оозеки чыгармачылыктын жана элдик ырчылардын ыр, поэмаларынын салттарын, үчүнчүдөн, дүйнөлүк адабияттын, боордош элдердин адабияттарынын прогресси."},{"t":"p","h":"Традиция (лат. – салт маанисинде) – өткөн мезгилдеги адабий өнүгүштүн же жеке жазуучунун калтырган, адабий процесске же жеке жазуучунун чыгармачылык өсүшүнө таасир берүүчү булак катары колдонулган идеялык көркөмдүк табылгалары, Салтсыз адабий процесс өнүкпөйт. Кыргыз жазма адабиятынын пайда болуп, өнүгүшү үчүн биринчи кезекте кыргыз фольклорунун жана акындардын чыгармачылык салттары, экинчиден. орус жана боордош чет элдер адабияттарынын салттары таасир этти. Салтты билгичтик менен пайдалануу эч убакта жаңычылыктын жолун тоспойт, кайра ага активдүү таасир көрсөтүп турат. салтты тануу менен жаңычылык жаратууга мүмкүн эмес."},{"t":"p","h":"Чынчыл жактарын өздөштүрүштү жана өздөрүнүн жекече жаңы табылгаларын кошту. Кыргыз поэзиясын Ж. Турусбеков саясий публицистикалык ыр-поэмалары, ыр түзүлүшүндөгү жаңычылыктары менен байытса, А. Осмонов философиялык ойлору терең, конкреттүү жана романтикалуу стили менен андан ары поэзиябыздын диапазонун кеңейтти, эркин ыр формасынын кыргыз поэзиясында биротоло жашап калышын өз изденүүлөрү менен далилдеп берди, албетте, булар анын новаторлугун белгилөөчү шарттар."},{"t":"v","l":["<span class=\"pg\" data-n=\"65\">65<\/span>Алыкул Осмонов","","«Бар бололу, түгөнбөйлү курдаштар,","Узак, узак, узак болсун бул сапар,"]},{"t":"p","h":"Кылым бүтүп, дүйнөдөн жок болсок да, Кайра кайтып жолугушчу жолдор бар»."},{"t":"img","src":"data:image/webp;base64,UklGRpgVAABXRUJQVlA4IIwVAACQ9QCdASqYARkCPrVQn0ouObQpLVpbezAWiWluZaYoYoxTK73EGPdzG288Pq4vQA459prpAWpynySHXisM/+Xos+Hf8Xjv+N/3+TW374Q8w3/96V/hf/Vr7BztdBnlP8FZxSHYN7r5ExITlaM0IZ2Po09Oznu8zOwwxmANg2+Bdz/MDSxl7oC/rrOwAG9zgZfCgWQdsGRM2iW8dy3WB64hZxnKfUYP13lDewg9vNHg8SXjsjq7SVrsaQqSwkyLO5gYyomK9HcChpy1YG7ArkvvafroXt3p+M+HNpcUUTHjkCcSN5m9WRSZOgjmhaF9YnE5Z5ljgRAadCz2k55vNsdKPJxhfvb1Wa8KNw4QHwdMZp+yegnafQYbVC73CCZrgcjYuefRN4Pnuq0HcgIRNBMXpfK9FmM/QZ3W/oDxNCqoijTJUe+GZ/h55ct/4BEuTmV98p6YxDeNB/1x2Ai8tpx0liR96jeR32/o2SIYjyh6AF9XDJ9/nKfHBfVjWKL5buCNrrTNp/aRgWiLEYe0+gKAvIaK9lGpz9d6oSs88Ei4jd91LEe3rve8vvEiiY2uiUnwPyd7hqHAxYD4iUGX0EbMtAVNcPyYrSzXhWyeO0GoUacEANdgM+6BupRRQLB7nfBSIhwJerD6tPK5l/C11ItgahyLkCeCptCww7Y23XKNZ9GKLE9ng5NkA3nyMTo8YyKEnJikBzJpyyYHvJZBRK7NpSSf+NXZNMq5TOURzLxjWtosFikTr3U  Адамзат үчүн ак жаркын келечекти каалап, согуш менен түшүнбөстүктүн болбошун жана"},{"t":"p","h":"й дүйнө элдеринин ортосундагы эриш-аркак кызматта! 4 ‹ кызматташууну тилеген. – Т. Сыдыкбеков р узак – долгий, долго"},{"t":"v","l":["сапар – путешествие, лальний путь","оргуштап чыккан – выхолил бурля","тангалткан – улививший","нлхам – желание","эрдик – мужество, геройство, храбрость","эрк – воля, свобода","азлектео – боготворить","","5-35","<span class=\"pg\" data-n=\"66\">66<\/span>Берилген ырларды салыштыргыла. Каалаган тилде жаттап келгиле.","Музыка","Мен суу ичпейм, таңдай катып турганда,","Мен нан жебейм алдан тайып курганда,","Музыкадай мага таттуу суусун жок,","Берчи мага,","Берчи мага,","Жарым кашык музыка!","Мен ыйлабайм, капа тартып турганда,","Мен кубанбайм, бак дөөлөткө тунганда,","Дарым ушул, кайгы жана шаттыкка,","Берчи мага,","Берчи мага,","Жарым ууртам музыка!","Эмнелер жок, бул дүйнөдө – жарыкта,","Не бир сонун... не бир кымбат асыл баа...","Мен кетерде, ошончонун ичинен","Сагынарым,","Эң аярым,","Эң кымбатым – музыка!"]},{"t":"h3","h":"Мизїс"},{"t":"v","l":["1 Чоп`{ юр йгїпКїпр эуа!ег \\уВеп Гат Чгу.","1 доп”! ор еайїпр Бгеа \\уВеп һипргу апа \\меаК.","Моге їаз!у 15 тизїс, ууһаїеуег у/їпе 1 їгу,","Сїуе те,","Слуе те","Те їеа-зрооп оГ","1 доп! зїап \\уеерте.","[ зееК!","до,","1 Чоп'1 ге]оїсе ту Вапа","Опе Базат {пеге 15 Гог те араїп! #15 апа \\мое —","Суе те,","те 5оте ти$їс,","Опе ипу 51р!","\\\\ Ва! ууопдег$ т 1115 оЁ ош 1 па!","1геазигев їо из сай!","\\еп 1еауїпр а|! {Везе 1оуейу {тез","1 Бит, Г уеагп","Рог тизїс —","Тре гет оГа!!","","От молодости отказаться смогу,","Но песню не троньте, сс сберегу.","И если солгу перед богом стократно,","То песне моей никогда не солгу,","<span class=\"pg\" data-n=\"67\">67<\/span>Стыжусь, мои друзья, лишь одного,","Не создал я пока что ничего","Такого, чтобы в душу к Вам запало,","А ведь живу я только для того...","эж»","Постелют мне камень, накроют песком,","Но, если строка моя вспыхнет хоть в ком,","Могильные плиты я сброшу с себя","И вродной степи проскачу рысаком!"]},{"t":"h3","h":"Викторина «Эстей жүр!»"},{"t":"v","l":["А. Осмоновдун чыгармачылыгы боюнча, викторинанын суроолоруна жооп бер.","Г. А. Осмонов кайсы жерде, качан туулган?","2. 1925-1929-жылдары кайсы окуу жайында окуган?","3. А. Осмоновду кайсы элдин улуу акыны менен салыштырган, анын аты ким?","4. Канчанчы жылы акындын биринчи ыры жарык көрген?","5. Бул ырдын аты эмие?","Жарашыктуу жаштайын,","Жалыраган жаз сайын,","Жаш күнүмдөн тең өскөн,","Жакшынакай ак кайын,","6. А. Осмонов кайсы чыгармаларды орус тилине которгон?","7. Кыргызстандын кайсы жергесин акын өзгөчө сүйгөн?"]},{"t":"p","h":"8. А. Осмонов адабият ишмердиги үчүн кандай наамдарга, сыйлыктарга ээ болгон? &lt; 1. Алыкул «чу» деген жерден эле күчтүү, нукура ырларды жазып, чыгааи акын катары"},{"t":"p","h":"чыкканбы же акырындап отуруп такшалганбы?"},{"t":"p","h":"2. Акындын чыгармачылыгындагы бурулуш кайсы ырдан, кайсы жыйнактан башталган"},{"t":"p","h":"деп ойлойсуңар?"},{"t":"p","h":"3. Акындын жекече тагдырынын драмасы анын чыгармачылыгына кандай таасир"},{"t":"p","h":"берген?"},{"t":"p","h":"4. А. Осмоновдун поэзиясы кыргыз адабиятына кандай жаңылыктарды киргизген? ‚ «Кол толкуну» ыр жыйнагынан Алыкулдун көл жөнүндөгү ырларынан өзүңөргө жакканын жаттап алгыла."},{"t":"p","h":"6. А. Осмоновдун котормочулук чеберчилиги кайсы чыгармада таасын көрүнөт?"},{"t":"p","h":"‚ «Жумушчу калк дал өзүмдөй жөнөкөй, Анда каруу, менде таттуу көмөкөй» – леген саптары бар кайсы ырында кайсы кесиптин ээлери жөнүндө кеп болот?"},{"t":"p","h":"8, Акындын жумушчулар темасына арналган ырларын атап, «Акын жана эмгек» деген"},{"t":"p","h":"темала сочинение жалгыла."},{"t":"h3","h":"«Женишбек» поэмасы женунде"},{"t":"p","h":"Албетте, Осмоновдун жалпы акындык өнөрүнүн ла, жеке дастанчылык өнөрүнүн да барып жеткен чокусу деп «Жеңишбек» поэмасын айтуу керек, Акындын башка поэмаларына салыштырганда «Жеңишбектин» сюжети эн эле жөнөкөй, Мында көп катмарлуу окуя же оош-кыйыштуу адам тагдыры, каармандардын өз ара кагылыштары же активдүү аракеттери жок, тек гана кара чечекей уулу Жеңишбекти кандуу согушка мойсоткон"},{"t":"p","h":"<span class=\"pg\" data-n=\"68\">68<\/span>Минбай чалдын өзгөчө күйүттүү абалы, өксүктүү арманы кеп кылынат, Миңбай, сыягы, баласынын курман болгону тууралуу «кара кагаз» алган көрүнөт, бирок андан түбөлүк айрылганына ынанбайт, жалгызын келет деп зарылып күтө берет. Башкалар жоо жеңип кайткан жакындарын тосуп пристанга барса, Минбай да кур үмүткө азгырылып кошо барып алат. Кеме кайра-кайра жоокерлердин жаны тобун алып келет, Кеме келген сайын Миңбайдын күткөнү ордунан чыкпайт... Бир сапар чал дагы кеме тосуп, Дагы кур үмүткө алданат. Үйүнө баргандан заарканып, курдашы Курманбектикине кайрылат. Курманбек кан майданга алты уулун атказганын, алтоонон экөө гана жараланып кайтканын кеп салып, Минбайга кайрат айтат. Анан өзү жетимиштен ашканда алтымыштагы кемпири экөө уулдуу болгонун сүйүнчүлөйт. Минбай бешикте жаткан баланы көрүп, атгын Жеңишбек коёт. Ал Курманбектикинен аттанып, арбалгандай кайра көл жээгине барат. Женишбегинин Варшава жанында көмүлүп жатканына, өзү өлгөнү тууралуу атасына борошодон кабар айттырганына ишенгиси келбейт, кайран уулунан күдөр үзгүсү келбейт. Долу толкунун шарпылдаткан Ысык-Көлдүн кыйырына кусалуу үмүт менен көз чаптырат."},{"t":"v","l":["Кол толкуйт, атасына белги берет,","Антпесе кур толкундун неси керек...","Бирок да үмүт кургур кыйын тура,","Атасы кайра келет, кайра келст..."]},{"t":"p","h":"Демек, «Жеңишбекте» кыймылдуу окуяларга караганда кейиштүү сезим-туйгулар, лирикалык ой-толгоолор, пейзаждык сүрөттөр көбүрөөк. Дал ошол көмөкчү элементтер поэманын жөнөкөй сюжетине кошумча жаңырык, көмүскө терендик бергенсийт."},{"t":"p","h":"«Жеңишбектин» мазмунун эмоциялык жактан курч кылган, албетте. баш каармандын аянычтуу абалы, бөксөрбөс убайымы, Миңбай чалдын курман болгон уулун күтүп, кур убара тартышы өзүнчө алганда эле жан кейитет, согуш мезгилинен тынч күндөргө сарыккан көп трагедиянын бирин кескин сездирет, далай кишинин башына түшкөн арман-күйүттүн оорчулугун, кепке дейре өксүбөсүн таасын билдирет, Миңбайдын кур бекер күтүүсүнө, арылбас капасына Ысык-Көл тен орток болот, Башкача айтканда, поэманын жалпы кусалуу күүсүн жаратууга, баш каармандын психологиялык толгонууларын ачууга Ысык-Көл өзүнүн ар кыл көрүнүштөрү менен активдүү катышат. Ошол пейзаждык коштоолор Миңбайдын кайгыкасиретин өзгөчө күчтүү, өзгөчө жугумдуу кылат, Миллиондордун жазмышына туш келген согуш трагедиясын, бир кыргыз чалынын өмүр бою өксүбөс убайымын Осмонов жасалмасы жок адамдык жапаакечтик менен кабыл алып, куду керт башынын кайгы-зарындай туюнуп, өтө күчтүү акындык эргүү менен ыр тилинде айтып берген."},{"t":"p","h":"«Женишбек» бар болгону 156 ыр сабынан турат, бирок аны адеп окуп чыкканда көлөмдүү бир чыгарма окугандай таасир калат. Анткени анын мазмунунда окурмандын ой-сезимин, фантазиясын дүрт жандырып, албан образдык ассоциацияларга толтуруп жиберчү көп маанилүү ойлор, жандуу турмуштук элестер, таамай психологиялык деталдар, эмоциялуу пейзаждык сүрөттөр бар,"},{"t":"v","l":["<span class=\"pg\" data-n=\"69\">69<\/span>Стилдик-ырдык касиеттери жагынан да «Жеңишбек» А.","башка поэмаларынан таасын айырмаланат. Анын лексикалык изын р","(сөздөрү) түз маанисинде да, өтмө маанисинде да өз орду ии лат, бири-бирине нары мыйзам ченемдүү, нары","тиешелүү жеринде кадыресе шыдыр уйкашып, мукамдуу н ыр чы","гарган, конкреттүү ойго же элеске каныккан ыр саптарына эү рл","Ырас, поэманын речтик түзүлүшү баштан-аяк идеалдуу эн р сил пы-жонунан орошон «Жеңишбекти» жеке автордун гана эмес, та ү гыз поэзиясынын татынакай табылгасы деп айтканга толук негиз бар.","","Текстти аудиодон кунт коюп уккула.","&lt; Текст боюнча тапшырмалар."]},{"t":"raw","h":"<h4 class=\"mk\">Е Өзүнчө<\/h4>"}],"sub":[{"title":"Ыманбай менен Айсарала","b":30},{"title":"§ 1. Т. Сыдыкбеков жөнүндө эмне айтып бере аласың?","b":43},{"title":"Мизїс","b":59},{"title":"Викторина «Эстей жүр!»","b":61},{"title":"«Женишбек» по жазылды, Октябрь Революциясына чейин жашаган жана өз чыгармаларын жазган Молдо Нияз, Молдо Кылыч ж. б. сыяктуу акындардын чыгармалары санат, казал жанрынын нугунда чыккан. Кыргыздын баатырдык эпос менен бирге ыр түрүндөгү элдик романдар, дастандар бар. 20-жылдарда К. Тыныстанов «Жаңыл Мырзаны» көбүрөөк даражада элдик дастандардын салтында жазган болсо, андан он жылдан ашыгыраак убакыт болгондон кийин А. Токомбаев жакынкы өткөндү чагылткан <span class=\"pg\" data-n=\"76\">76<\/span>«Кандуу жылдарды» азыркы замандын адабий бычымына ылайыктап, берүүгө далалат кылат."},{"t":"p","h":"М, Элебаевдин «Узак жолу», Т. Сыдыкбековдун «Кең-Суу», «Темир», К. Жантөшевдин «Каныбек» аттуу романдарынын жазылышы менен кыргыз адабиятынын тарыхында биринчи жолу адабияттын эпикалык түрүнүн таптакыр жаңы жанры прозалык роман жаралды. Булардын ичинен «Узак жол», «Кең-Суу» романдарында турмушту чагылтуунун реалисттик принциби биринчи планда турган. Мына ушинтип, 30-жылдарда ушул убакка чейин кыргыздын көркөм сөз чыгармачылыгына белгисиз болгон реалисттик роман, драма (Ж, Турусбековдун «Ажал ордунасы») пайда болду."},{"t":"p","h":"Улуттук көркөм сөз чыгармачылыгында кыйла кылымдардын ичинде калыптанып жана чогулган эстетикалык тажрыйба адабий жөрөлгө (салт) деп аталат. Адабиятыбыз ошол тажрыйбаны, албетте, пайдаланды жана өнүктүрдү. Бул – биринчиден."},{"t":"p","h":"Экинчи жактан, өз заманын көрсөтүүдө болсун, өткөндү көрсөтүүдө болсун, адабият жалаң өткөндүн тажрыйбасы менен чектелип калышы мүмкүн эмес болучу жана чектелип калган жок, Бул жааттан алып караганда, мурда өнүккөн реалисттик жөрөлгөлөрү бар адабияттардын, биринчи кезекте, орус адабиятынын идеялык-эстетикалык тажрыйбасын үйрөнүү, өздөштүрүү өтө чоң мааниге ээ болду. Ал тажрыйба улуттук жөрөлгө менен айкашып, алдыңкы жазуучуларыбыз жаны тарыхый шарттын талабына жараша жана өз заманынын көркөм-эстетикалык деңгээлинде болууга аракеттенишип, изденишип, өздөрүнө таандык жолдорду издешти жана табышты. Адабиятта турмушту кайра жаратуунун адабияттагы жаны жолдору, усул жана көркөм каражаттары жаңычылдык (новатордук) деп аталат."},{"t":"p","h":"Ар кандай адабияттын эн кыйын проблемаларынын жана өнүккөн адабияттын көрсөткүчү болгон толук кандуу реалисттик романдардын кыргыз адабиятында пайда болушу 40-50-жылдарга туура келет."},{"t":"p","h":"К. Тыныстанов, А, Токомбаев. М. Элебаев, Ж. Бөкөнбаев, К. Маликов, Т. Сыдыкбеков, Т. Үмөталиев, К. Жантөшев, А. Осмонов, У. Абдукаимов ж. б. жазуучулардын чыгармачылыгы кыргыздын адабий тилинин, демек, жаны көркөм тилинин калыптануу учуруна туш келди. Ошондуктан бул жазуучулардын тили кыргыз басма сөзү менен адабий тилинин калыптанышында аябаган зор роль ойноду. Бул жазуучулар өз чыгармаларын жазбаса, тарыхый жактан кыска мөөнөттүн ичинде мурда өнүккөн басма сөзү жана алабияты болбогон кыргыздын улуттук басма сөзү менен адабий тили мынчалык кыска мөөнөттүн ичинде бүгүнкү даражага өсүп жетмек эместиги ачык иш,"},{"t":"p","h":"<span class=\"pg\" data-n=\"77\">77<\/span>Чынгыз Айтматов"},{"t":"img","src":"data:image/webp;base64,UklGRngYAABXRUJQVlA4IGwYAAAQDgGdASqeAR0CPrVUn0snOrsqLFVrG2AWiWlttrWj/XcvKjA/6eop3uMMQPrT3+72g8p/ZdxrtztHbSVR5/3/LqQe/VLel5ztfg3/u9B3xH/x8gfxP/dyfW+fC5mL//PYundOP9kufY5b0p3TuABI/HEY+4ozQ8/qGsM2OX/r8AzrjUHiOx7cxhG4Fl5SJkVaduYoG5vSOjD/FTZaO5kb/cuxSFcpjxDcggxWHHIelSs9ZvhDnBVg9wTITTkuKfVhGWAckVkYmYEAeNPlXD7KfuHlnz2z8MUicLurxCNnWPThiLaJeOjPOp9adCklMIFF97z5tJpPkuSR3k2rhj1uMaYEaZ0F4CVzGvA84RzMf5+6idUIi9g4G1geI+9csuq27cXhBwSMfATa88hS8NZomUv014oDB+4tVf9kshYoxqtaWPBQCEE9i+SoU442h1tZXMGYfwWF6LCQx1EQlCCAhDpNUN6ye73u3sfxoZ9uZI3hDWHXHyKezITClN+4z1MF+qptjfao1TLT31KhiZPoO6/VZhTI5p1qrjDCoIPvxawI/8BSlVBCCWlpSTAsLT/7Hfgjq9VwLZF35pBUqSpsA5wFJVBOA0BO84U+mv7vsVDyAy+rjzQTOe5oLvAW+/3Lqtg8XkgX4dn147gPNF+/1LKBh0CgVfKJdrDo1knzN1KKWFHUP/qBT+8K1SI2rtlTJv4UtXxdCaWjCkxD+1Qr7hsGT09cSnSZ/V+aBoxbelM/E0d79W+TEqFoIPwJZruyRujnBE6GPITmNE6GNKuRrppYCi/UkriZVAw2zQvZj31aFd68ZDsJYyjBV54XWRcpk2F9MJkcZnqyV7/e7T15s9vsDyYo6u1559peFmgCfuyLpSQAJP3JXKda+LH5Cke8vMNaSTvOUhpqzxEs4rfIJFeeveav/6K7

<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Кыргыз адабияты 11</title>
<style>/* Mobile textbook reader. No external fonts or libraries: everything works offline. */
:root {
  --bg: #ffffff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3;
  --panel: #f6f6f6; --accent: #1f6feb; --accent-fg: #ffffff;
  --fs: 19px; --lh: 1.55;
  --font: Georgia, "Noto Serif", "DejaVu Serif", "Times New Roman", serif;
  --bar-h: 48px; --foot-h: 28px;
}
[data-theme="sepia"] { --bg: #f5ecd9; --fg: #4a3b2a; --muted: #8a7458; --line: #e0d2b4; --panel: #ece0c6; --accent: #9a5b13; }
[data-theme="dark"]  { --bg: #111315; --fg: #d8d8d8; --muted: #8c8c8c; --line: #2a2d31; --panel: #1b1e21; --accent: #6ea8ff; --accent-fg: #0b0b0b; }
[data-theme="contrast"] { --bg: #000000; --fg: #ffffff; --muted: #c8c8c8; --line: #444; --panel: #151515; --accent: #ffd400; --accent-fg: #000; }
[data-font="sans"] { --font: Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 16px/1.4 Roboto, "Noto Sans", Arial, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- Library ---------- */
.lib { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lib h1 { font-size: 22px; margin: 8px 0 4px; }
.lib .sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; background: var(--panel); }
.card h2 { font-size: 18px; margin: 0 0 4px; }
.card .meta { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
.card .subt { font-size: 14px; margin: 0 0 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.chips button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); color: inherit; }
.chips button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: .5; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.lib-foot { color: var(--muted); font-size: 13px; margin-top: 24px; }
.lib-foot select { font: inherit; }

/* ---------- Reader ---------- */
.reader { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; user-select: text; }
.viewport { position: absolute; left: 0; right: 0; top: 0; bottom: var(--foot-h); overflow: hidden; }
.flow {
  height: 100%; column-fill: auto; padding: 20px 0 12px;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  will-change: transform; transform: translate3d(0,0,0);
  hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
}
.flow.anim { transition: transform .25s ease-out; }
.flow p { margin: 0 0 .15em; text-indent: 1.4em; text-align: left; }
.flow p.ni { text-indent: 0; }
.flow h1, .flow h2, .flow h3 { font-family: Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.25; break-after: avoid; page-break-after: avoid; }
.flow h1 { font-size: 1.35em; margin: .2em 0 .8em; text-align: center; }
.flow h2 { font-size: 1.15em; margin: 1.1em 0 .5em; }
.flow h3 { font-size: 1.0em; margin: 1em 0 .4em; }
.flow .verse { margin: .6em 0 .8em 1em; break-inside: auto; }
.flow .verse div { text-indent: -1em; padding-left: 1em; text-align: left; }
.flow .verse .gap { height: .7em; }
.flow figure { margin: .8em 0; text-align: center; break-inside: avoid; page-break-inside: avoid; }
.flow figure img { max-width: 100%; height: auto; border-radius: 4px; background: var(--panel); }
.flow figcaption { font-size: .8em; color: var(--muted); margin-top: .3em; }
.flow .box { border-left: 3px solid var(--accent); padding: .1em 0 .1em .7em; margin: .7em 0; }
.flow .pg { font: 11px/1 Roboto, Arial, sans-serif; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 4px; margin: 0 3px; vertical-align: 2px; text-indent: 0; white-space: nowrap; user-select: none; }
.flow .end { height: 1px; }
.flow .endnote { text-align: center; color: var(--muted); font-size: .8em; margin-top: 2em; font-family: Roboto, Arial, sans-serif; }
[data-theme="dark"] .flow img, [data-theme="contrast"] .flow img { filter: brightness(.9); }

.foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot-h); display: flex; align-items: center;
  justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.foot .t { overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }

.bar { position: absolute; left: 0; right: 0; background: var(--panel); border-color: var(--line); z-index: 5;
  transition: transform .2s; display: flex; align-items: center; }
.bar.top { top: 0; height: var(--bar-h); border-bottom: 1px solid var(--line); transform: translateY(-100%); padding: 0 4px; }
.bar.bottom { bottom: 0; border-top: 1px solid var(--line); transform: translateY(100%); padding: 10px 16px 14px; flex-direction: column; align-items: stretch; gap: 6px; }
.reader.ui .bar { transform: none; }
.bar .title { flex: 1; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.bar .info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* ---------- Sheets (TOC, settings) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85%; overflow: auto; background: var(--bg);
  border-radius: 16px 16px 0 0; z-index: 11; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
.sheet h3 { margin: 10px 0 12px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.toc a { display: block; padding: 11px 4px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 15px; }
.toc a.sub { padding-left: 20px; font-size: 14px; color: var(--muted); }
.toc a.cur { color: var(--accent); font-weight: 600; }
.set { margin: 14px 0; }
.set label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; }
.seg button.on { border: 2px solid var(--accent); font-weight: 600; }
.swatch[data-v="light"] { background: #fff; color: #1b1b1b; }
.swatch[data-v="sepia"] { background: #f5ecd9; color: #4a3b2a; }
.swatch[data-v="dark"] { background: #111315; color: #d8d8d8; }
.swatch[data-v="contrast"] { background: #000; color: var(--accent-fg); }
.goto { display: flex; gap: 8px; }
.goto input { flex: 1; min-height: 44px; font-size: 16px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px;
  border-radius: 20px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Textbook elements produced by tools/convert_pdf.py ---------- */
.flow .tasks, .flow .gloss { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45;
  background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0; }
.flow .tasks p, .flow .gloss p { margin: 0 0 .35em; text-align: left; }
.flow .gloss { border-left: 3px solid var(--accent); }
.flow p.note { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; font-style: italic; text-indent: 0; margin: .6em 0; }
.flow p.attr { text-align: right; text-indent: 0; font-style: italic; color: var(--muted); margin: .1em 0 .8em; }
.flow p.sep { text-align: center; text-indent: 0; color: var(--muted); margin: .5em 0; letter-spacing: .3em; }
.flow h2 .pg, .flow h3 .pg { font-weight: normal; }
.toc .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 4px 2px; }
.toc a .p { float: right; color: var(--muted); font-size: 13px; margin-left: 8px; }

/* ---------- Elements produced by tools/convert_layout.py (typeset textbooks) ---------- */
.flow figure img { cursor: zoom-in; }
.flow h4.mk { font: 700 .78em/1.3 Roboto, "Noto Sans", Arial, sans-serif; letter-spacing: .05em; color: var(--accent);
  margin: 1em 0 .3em; break-after: avoid; page-break-after: avoid; }
.flow p.hl { color: var(--accent); text-indent: 0; }
.flow p.small { font-size: .82em; text-indent: 0; color: var(--muted); }
.flow sup, .flow sub { font-size: .7em; line-height: 0; }
.flow .kbox { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45; background: var(--panel);
  border-radius: 8px; padding: .45em .7em; margin: .5em 0; border-left: 3px solid var(--accent); }
.flow .kbox > b { display: block; }
.flow .frame { background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0;
  font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; line-height: 1.45; }
.flow .frame p { text-indent: 0; margin: 0 0 .35em; text-align: left; }
.flow .tbl { margin: .8em 0; font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .8em; line-height: 1.35; }
.flow .tbl .tt { font-weight: 600; text-indent: 0; text-align: center; margin-bottom: .3em; }
.flow .tbl table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.flow .tbl th, .flow .tbl td { border: 1px solid var(--line); padding: .3em .35em; vertical-align: top; text-align: left; overflow-wrap: anywhere; hyphens: auto; }
.flow .tbl th { background: var(--panel); }
.flow .tbl tr { break-inside: avoid; page-break-inside: avoid; }

.zoom { position: fixed; inset: 0; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; background: rgba(0,0,0,.92); z-index: 30; }
.zoom-in { position: absolute; inset: 0; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
.zoom-in img { margin: auto; flex: none; touch-action: pan-x pan-y; object-fit: contain; background: #fff; cursor: zoom-in; }
.zoom-x { position: absolute; top: 8px; right: 8px; color: #fff; background: rgba(0,0,0,.5); z-index: 31; }
.flow h4.sh { font: 700 .95em/1.3 Roboto, "Noto Sans", Arial, sans-serif; text-align: center; margin: .8em 0 .4em; break-after: avoid; page-break-after: avoid; }

/* maths books */
.flow h4.ex, .flow h4.try { font-family: Roboto, Arial, sans-serif; margin: 1.1em 0 .3em; font-size: 1em; }
.flow h4.ex { display: inline-block; background: #f7e400; color: #111; padding: .1em .6em; border-radius: 3px; }
.flow h4.try { color: var(--accent); }
.flow p.goal { font-size: .85em; text-indent: 0; background: var(--panel); border-radius: 8px; padding: .4em .7em; }
.flow b.bd { display: inline-block; text-indent: 0; padding: 0 .4em; border-radius: 1em; background: var(--fg); color: var(--bg);
  font: bold .8em/1.45 Roboto, Arial, sans-serif; margin-right: .2em; }
.flow b.nb { display: inline-block; text-indent: 0; min-width: 1.4em; border-radius: 4px; background: var(--accent); color: var(--accent-fg);
  text-align: center; font-size: .8em; margin-right: .3em; }
.flow .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.15; margin: 0 .1em; }
.flow .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .15em; }
.flow p.ml { text-indent: 0; padding-left: 1em; }
.flow p.side { font-size: .85em; }
.flow details.ans { margin: .3em 0 .8em; font-size: .9em; }
.flow details.ans summary { color: var(--accent); cursor: pointer; font-family: Roboto, Arial, sans-serif; }

/* wide tables become one card per row on phones */
@media (max-width: 560px) {
  .flow .tbl.cards table, .flow .tbl.cards tbody, .flow .tbl.cards tr, .flow .tbl.cards td { display: block; width: auto; }
  .flow .tbl.cards tr:first-child { display: none; }
  .flow .tbl.cards tr { border: 1px solid var(--line); border-radius: 8px; margin: .5em 0; padding: .3em .5em; }
  .flow .tbl.cards td { border: 0; padding: .15em 0; }
  .flow .tbl.cards td::before { content: attr(data-l); display: block; font: 600 .75em/1.3 Roboto, Arial, sans-serif; color: var(--muted); }
  .flow .tbl.cards td:first-child { font-weight: 600; }
}
.flow figure.vec svg { max-width: 100%; height: auto; display: inline-block; background: #fff; border-radius: 4px; cursor: zoom-in; }
[data-theme="dark"] .flow figure.vec svg, [data-theme="contrast"] .flow figure.vec svg { filter: brightness(.9); }
.flow .rt { border-top: 1px solid currentColor; padding-top: 1px; margin-left: 1px; }
.flow .it { display: inline-block; max-width: 100%; margin-right: .9em; text-indent: 0; }
</style>
</head>

 боз дөбөсү, кароол мунарасы (Кытай), Талчоку, үч Бээжин (Кытай), Оркун суусу (Монголия), Манастын жайлоосу (Казакстан), Манас тумшугу (Анапа шаары, Крым), Манас айылы (Венгрия) – мындай жерлер арбын."},{"t":"p","h":"Кыргыздар жөнүндөгү эң алгачкы кабар кытай булактарында (б. з. ч. 201-ж.) кездешерин академик В. В. Бартольд айтат. Енисейдин баш тарабында (Монголиянын түндүк-батыш жана Сибирдин түштүгү) жашаган кыргыз көчмөн коомчулугу тууралуу ИХ кылымдардагы кытай тарых булактарында көп айтылат."},{"t":"p","h":"ЇХ кылымдын ортосундагы кыргыз көчмөн мамлекети кытай жана башка коңшу түрк уруулары, өзгөчө уйгурлар менен болгон уруштар жүрүп турган доордо «Манас» эпосу түптөлгөндүгүн бир катар изилдөөчүлөр белгилешет."},{"t":"v","l":["Ш сөөгү коюлган – здесь захоронен","байланыштуу – связанная","арбын – достаточно много"]},{"t":"h3","h":"Белгилүү адамдар «Манас» жөнүндө"},{"t":"p","h":"«Манас» эпосу Ч. Валиханов тарабынан тээ качан эле талаа «Илиадасы» деп эн туура аталып, кыргыз элинин энциклопедиясы катары аныкталган,"},{"t":"p","h":"«Шах-намэ» өзүнүн көлөмү жагынан «Илиададан» сегиз эсе көп, ал эми «Манас» бир эле вариантында «Шах-намэден» беш эсеге арбын, демек, «Илиададан» кырк эсеге чоң."},{"t":"p","h":"«Манас» эпосу элдик көркөм чыгармачылыктын ажайып эстелиги гана эмес, ошондой эле башаты 820—847-жылдарда башталган кыргыз урууларынын боштондугун баяндаган тарыхый чыгарма."},{"t":"p","h":"Эпикалык Манастын негизи болуп ошо 820-947-жылдарлагы күрөштө кыргыз эяинин жол башчысынын конкреттүү тарыхый образы турат."},{"t":"p","h":"Кыргыздар өз ырларында кандайдыр бир ажайыпты эле коркунучтуу жомоктогудай дүйнөнү баалабастан, тескерисинче, өзүнүн турмушун, өз ой-сезимин жана умтулууларын, коомдун ар бир мүчөсүнүн көкүрөгүндөгү идеалдарын даңазалайт,"},{"t":"p","h":"«Манас» эл рухунан жаралган гениалдуу чыгарма катары өзөгүндө эр жүрөктүүлүктүн, каармандыктын, кен пейилдүүлүктүн мектеби, жалпы адамзаттык ыймандуулуктун бийик үлгүсү болуп саналат,"},{"t":"p","h":"<span class=\"pg\" data-n=\"5\">5<\/span>«Манаста» эки багыт байкалат. Биринчиси – каралайым калктын үмүт-тилектери менен умтулууларын чагылдырган элдүүлүк. Экинчиси – башкаруучу таптын идеологиясы менен тамырлашкан ойдон чыгарылган диний жана патриоттук мотивдер менен эпизоддор."},{"t":"p","h":"«Манас» – толтосуна толкуп кирген эл рухун кайра ысык жүрөгүнөн мөңкүтүп, күчтөнтүп чыгарган калк генераторлорунун эстелиги."},{"t":"p","h":"Чокан Валиханов жазып алган «Манастын» кыргыз тексти көп заман белгисиз жатты. Бул версияны жарыкка чыгарууга чыгыш адабиятын изилдөөчү аалымдардын далайы убактысын бөлгөн. Чокандын бул эмгектерин биринчи ирет басмага даярдаган Н. И. Веселовский 1902-жылы 21-мартта Археология коомунда Чокандын «Манас» ырынын котормосунан тааныштырып, ырдын кыргызча тексти жоголуп кеткенине капа болот. Кийин котормо Чокандын эски досу К. К. Гутковскийдин үйүнөн табылган."},{"t":"p","h":"«Манас» аты менен байланыштуу санжыра сөздү Чокан эң алгач К. Л. Врангелдин жазууларынан окуп көргөн. Ал кезде (1848) Жети-Суу өлкөсүн бийлеген барон Врангель билимдүү адам болгон. Ал өзүнүн карамагындагы түрк калктарынын тилдерин билген котормочулар аркылуу Улуу жүз казактары менен кыргыздардын санжыраларын, аңыз сөздөрүн, тарыхын жыйнап, Омбудагы чек ара комиссиясына жиберип турган."},{"t":"p","h":"даңазала – что-либо слеланное с целью прославить человека в глазах потомков тамырлашкан – здесь: связан корнями"}],"sub":[{"title":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК ГИМНИ","b":2},{"title":"Т. И. Ботбаева, Д. Д. Искакова","b":4},{"title":"«Кутаалам»","b":10},{"title":"«Манас» эпосу","b":12},{"title":"Белгилүү адамдар «Манас» жөнүндө","b":19}],"pages":[0,5]},{"title":"Манастаануу. «Манас» эпосунун улуттук жана дүйнөлүк маданиятта, адабиятта алган орду","blocks":[{"t":"h3","h":"Манастаануу. «Манас» эпосунун улуттук жана дүйнөлүк маданиятта, адабиятта алган орду"},{"t":"p","h":"«Манас» – Кыргыз рухунун туу чокусу. Ч. Айтматов «Жер үстүндө кыргыз барда, адамзат жашап турганда «Манастын» ыры да, сыры да бүтпөйт». Манастаануу – Кыргыз адабият таануу илиминин «Манас» эпосун жыйноону, изилдөөнү, бастырып чыгарууну ишке ашыруучу тармагы,"},{"t":"p","h":"Кыргыз элинин улуу мурасы болгон «Манас» эпосу уникалдуу, өзгөчө касиетке ээ чыгарма,"},{"t":"p","h":"Ооба, «Манас» – кыргыз рухунун туу чокусу» (Ч. Айтматов), Бул пикир кыргыз элинин башка рухий байлыктарына салыштырмалуу айтылып, эпостун туу чокуда баарынан бийик турганын тастыктайт. Ошону менен бирге «Манас» – миңдеген жылдарга сакталып калган кыргыз жаны, адабий мурас. А эгер анын ички маани-жайын, мазмун-манызын аңтарып, четинен эле түйүнчөк болуп түйүлгөн улуу сырды чубасак анда «Манас:» Улуу Нарк, Улуу Эрдик, Улуу Сулуулук, Улуу Ыйман-ызаат, Улуу Сүйүү, Улуу Сөз, Улуу Тарых, Улуу Намыс! «Манас» – Улуу Жол, Улуу Мектеп, Улуу Ыр, Улуу Толгоо жана Улуу Санаа! – деп айтылгандай, ал ушунун баарын өз ичине камтып турат, Ооба, «Манас» – кыргыз элин жок болуп кетүүдөн <span class=\"pg\" data-n=\"6\">6<\/span>сактаган, бар болуп жашоого үйрөткөн, кыйынчылыктарды жеңип чыгууга такшалткан. Эпос байыркыны, кечээгини, бүгүнкүнү жана эртеңкини бириктирип турган бүтүндүк."},{"t":"p","h":"«Манас» эпосу – жалпы адамзаттык маанидеги улуу дастан. 20-жылдардын башында залкар манасчы Сагымбай Орозбаков «Манасты» жаздырып жатып Ыбырайым Абдырахмановго мындай деген; «Азыркыбызга кейибейли, кийинки укум-тукумубуз үчүн кейийли. Жүр-нарыга салбай жакшылап айтып, жакшылап жазалы. Азыркылар билбесе, кийинки калыс өспүрүмдөр билер. Бизге ыракмат айтышаар». Акылман, кеменгер манасчы С. Орозбаков кыргыз журтунун кылым аркалаган асыл нарктарын ичине камтыган «Манас» дастанынын болочок ээлери – жаш муундардын рухий тарбиясы үчүн ат көтөргүс зор мааниси бар экендигин ошо кезде эле көрөгөчтүк менен баамдаган."},{"t":"p","h":"Кылымдар бою кыргыздар «Манасты» угуп, өздөштүрүп келишкен, «Манастын» океанынан «суу ичишкен». Улуу мурастын патриоттук бийик идеаларына тарбияланышкан."},{"t":"p","h":"Кыскасы, Манас руху жан дүйнөлөрүнө орногон биздин илгерки ата-бабалар абийирдүү, ар-намыстуу, сыймыктуу болушкан, Манас аларды ар дайым шыктандырып турган. Илгерки ата-бабалар баштарын бийик көтөрүп, мындай дешкен: «Биздин элден сурасаң, баатырлар менен жүрөктөш, балбандар менен билектеш, эрендер менен маңдайлаш чечендер менен таңдайлаш, беттеп адам барбаган, ар душман жеңип албаган»,"},{"t":"p","h":"Улуу Ф. Достоевский мындай дейт: «Улуттук көрөңгөсүз, элдик аңызсыз эч нерсе өспөйт жана эч кандай мөмө болбойт. Ар кандай мөмөжемиш өсүш үчүн өзүнүн топурагы, өзүнүн климаты, өзүнүн тарбиясы болуш керек. Бутуңдун алдындагы бекем кыртышсыз алдыга ийгиликтүү жылуу мүмкүн эмес». Биздин аңызыбыз, кыртышыбыз, рухий азыгыбыз, топурагыбыз – «Манас». «Манастын» илгертен кыргызга рухий түркүк болуп келген жогорудагы ыйык дөөлөттөрү, асыл баа кенчтери – Манас атанын жети осуяты. «Элдик кыртыштын», «улуттук топурактын» зарылдыгы жөнүндөгү философия менен куралданган эгемендүү жаш мамлекетибиз бүгүнкү күндө улуттук кайра жаралуу иш-чараларын жүзөгө ашырып жатат. Тоталитардык доорго умтулган, тыюу салынган калк мурастары кайрадан калыбына келтирилүүдө. Республиканын алдыңкы күчтөрү жаштарга тарыхый эсти кайрып берүүгө, элибиздин улуттук түшүнүүсүн активдештирүүгө жигердүү күч-аракеттерди жумшоодо."},{"t":"p","h":"Ш э \"!\"'кеашыруучу- реализовать в деле"},{"t":"v","l":["мурас – наследство, наслелие","тастыктайт – полтверждает","ыймаи-ызаат – воспитанность","момо болбойт – не будет плола","бекем – крепко","дөөлөт – богатство, лостояние"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"7\">7<\/span>Манастын жети осуяты"},{"t":"p","h":"1995-жылы 25-31-августта «Манас» эпосунун мин жылдык мааракеси белгиленди. Бириккен Улуттар Уюму менен ЮНЕСКО 1995-жылды «Манас» жылы – деп атады. Бул эпостун достукка, эркиндикке, гуманизмге чакырган мазмунунун эл аралык масштабда таанылышы эле. Экинчиден, бул Кыргыз элинин дүйнөлүк маданиятка кошкон зор салымы да болчу. «Манасты» таануу, маанисин ачуу, анын кенчтерин келечекте пайдалануу багытында чоң иштер бүткөрүлдү, Алардын орчундуусу – Манастын жети осуяты,"},{"t":"h3","h":"Манастын жети осуяты"},{"t":"p","h":"Калтырган жети осуят Манас баба, Кийинки урпактарга, мага, сага. Эмгекчил бол, окуучум, талыкпаган, Ээ кылат ар өнөргө билим гана. «Манас» эпосу ириде баатырдык эпос катары эсептелери жалпыга маалым. Ошондуктан анда кызыл кыргын, кара сүргүн салгылаш, согуш темасы негизги орундардын бирин ээлери табигый иш. Бирок, ошентсе да, эпосто ач кыйкырык, куу сүрөөнгө тунган ошо алаамат ичинен мына ушунун баарысы тек болбогон бир жан далбас экенин, чексиз Аалам астында жеңишин да, жеңилишин да – экөө бирдей опаасыз кур далбас экенин ачык түшүнүп, сай сөөктү сыздаткан муң-зар угулат,"},{"t":"p","h":"«Чон казаттан» кайткандагы жаралуу Манастын үч баатырын жоктоп өксүгөнү, ал ыйласа – кайың ыйлап, тал ыйлап, калың журттун баары ыйлап, жесирлер кошок кошуп зар ыйлап, аза күтүп турганы Манастын согушка каршы маңызын айдан ачык күбөлөйт."},{"t":"p","h":"Манасты жоктоп боздогон акылман Кошой аба, «токсонго чыккан кары өлбөй, эмне үчүн Манастай эрен эрте өлөт?» – деген өз суроосуна жооп табалбайт, Бу жалганга мындай адилетсиздик кайдан жаралган? Эмне үчүн бу дүйнөдө периштедей тазалык, баладай баёолук, жакшылыкты аркалаган ак ниет дайыма жабыр тартат,"},{"t":"p","h":"Мына ушул кейиштүү суроолор «Манаста» баштан аяк коңгуроодой кагылып, добулбастай жаңырган бүтпөс суроолор. Демек, жер үстүндө кыргыз барда, адамзат жашап турганда «Манастын» ыры да, сыры ла эч качан бүтпөйт."},{"t":"p","h":"Ошондуктан, биз, кыргыздар, ардактуу Чыңгыз Айтматов агайыбыз айткандай, «Ала-Тоо койнунда кылымдан-кылымга жашап келген кыргыз баласы бул дүйнө үчүн нени берди, адамзаттын өнөрүнө, маданиятына нени кошту дегенде, бирден-бир жообубуз «Манасты» берди дейбиз». «Манасты» биз тек бир эртегинин эстелиги катары гана эсептебейбиз. «Манасты» биз өзүбүздүн бүгүнкү турмушубузга түздөн-түз катышын, элди баш коштуруп, эртеңкиге шыктандырган жана болочокто да, урпактан-урпакка ошондой боло бере турган өлбөс-өчпөс улуу рух деп билебиз."},{"t":"p","h":"Ошондо биздин бүгүнкү муундун «Манастан» алар сабагы кайсы болмокчу?"},{"t":"p","h":"<span class=\"pg\" data-n=\"8\">8<\/span>1. _ Эл-журттун ажырагыс бүтүндүгү жана бир жакадан баш, бир жеңден кол чыгарган ички биримдиги."},{"t":"p","h":"Манастын бүт аракети бүлүнгөн эли-журтун бүтөп, үзүлгөнүн улап, чачылганын жыйноодо болду. Качан эл ичинен ырк кетип, биримдик бузулганда, канчалык азап менен курулган Манас ордосу кайта кулады. Ошон үчүн, даанышман Бакай бабабыздын кылымдар түпкүрүнөн үн каткан «Байкагыла балдарым, бөлүнсөң бөрү жеп кетет?» деген осуяты бүгүнкү күндө дал ушул биз үчүн айтылып аткандай угулат, 2. _Улугтар аралык ынтымак, достук жана кызматташтык."},{"t":"p","h":"Бул «Манастагы» өзөктүү идеялардын бири, Манастын улуулугу – анын «кейишке салса кечирип, кеткени болсо келтирип», башка калктардын ак ниет инсандарын бир туугандай ардактап, өз элинин колун узарта билген айкөлдүгүндө. Бу жагынан Манас менен Алмамбеттин мамилеси – биз үчүн көөнөргүс нуска, Тагдырдын жазмышы менен жергебизди мекендеген ар элдин өкүлдөрүн өз боорубузга тартып, канат-бутагыбызды өстүрүп алуу, алыс-жакын коңшулар, бөлөк мамлекеттер менен достук мамиледе болуу – Манастын осуятына ылайык азыр да биз үчүн парз."},{"t":"p","h":"3.___ Улуттук ар-намыс жана атуулдук ариет."},{"t":"p","h":"Манастын жана анын чоролорун эл-жер үчүн ажалдан кайра тарттырбай алга сүрөгөн улуу күч ушу болгон. «Жоого намыс бергиче, ажалым жетсе өлөйүн, малым менен жанымды олжого кантип берейин, өлбөй тирүү жүргөндө не мураска жетейин, калкым кыргыз сен үчүн курман болуп кетейин», – деп, алар Ата Журттун ар-намысы үчүн кара башын канжыгага сайып коюшкан, Ошонусу менен Абыке, Көбөш алты арам сыяктуу тар мүдөөлүү арсыздардан асман-жердей айырмаланышкан."},{"t":"p","h":"Улуттук ар-намысты баарынан бийик туткан ушундай атуулдук ариет ушу тапта биз үчүн абадай зарыл экени, менимче, өзүнөн-өзү түшүнүктүү."},{"t":"p","h":"4. Арыбас мээнет, алдыңкы өнөр-билим аркылуу бакубат дөөлөткө умтулуу."},{"t":"p","h":"Манас өз тегерегине ошо өз заманынын бийик өнөр – билимге канык кадырман адамдарын топтогон. Алардын жардамы менен ар дайым жеңишке жетишкен. Жашоонун маңызын эмгек, эпостун өзүнүн тили менен айтканда, мал багып, дан багып, жан багуу түзөрүн ал жакшы түшүнгөн, Жаш кезинде өзү да Ошпур койчуга кошулуп кой баккан. Жоокерчилик заманда өтө сейрек кездешүүчү тынч кездерде аштык айдап, эмгек кылып аш тапкан, эр өлтүрүп жоо чалган эрендиктен баш тарткан, аштыгына алмашып Аккуладай ат тапкан."},{"t":"p","h":"5. Адамды, ата-бабанын арбагын жана келечек урпакты урматтоо."},{"t":"p","h":"«Казан асып, кар салып, катын алып үй тигип, аспап алып, ат минип, адам болуп турган соң жолун күткүн бабаңдын», – дейт Манас. Анткени, ата-бабалардын арбагын сыйлаганын, ата-салтын жолдогуң – элиңдин өткөн тарыхын, рухий мурасын сыйлаганың ошону менен эртеңки келечегиңе жол салганың, урпактын, улуттун камын көргөнүң. «Манас» эпосу бу жагынан, асыресе, баланы тапкан, бапестеп баккан аял-энени, анын асыл аракет <span class=\"pg\" data-n=\"9\">9<\/span>– эмгегин даңктоо, адамга бийик урмат менен кең пейил мамиле жасоо жагынан бүгүнкү урпак үчүн улуу нуска."},{"t":"p","h":"6. Табийгат менен таттуу мамилеле болуу."},{"t":"p","h":"Дегеле көңкү Көчмөн цивилизация табийгат менен алака түзүүнүн, аны менен эриш-аркак жуурулушуп жашоонун адамзат тарыхындагы эң алдыңкы өрнөгүн жаратып кеткен. Көчмөн дүйнөнүн акыркы могиканы – кыргыз эли аны өзүнүн эртеги турмушунун көркөм энциклопедиясы – «Манас» өтө таасын чагылткан. Эгерде биз эпостогу ошол орошон жөрөлгөнү ыйык туталсак, анда дүйнөдөгү бирден-бир бийик ээси болобуз. Манастан калган ажайып Ала-Тообузду келечек урпактарга көрк-келбетин кемитпей калтырып кете алабыз."},{"t":"p","h":"7. _ Кыргыз мамлекеттигин чыңдоо жана аны көздүн карегиндей сактоо."},{"t":"p","h":"Айкөл Манас атабыз баштаган баатыр бабаларыбыздын бүт өмүрү ушул аруу максатка арналды. Алар мындан миң жыл мурун Улуу кыргыз мамлекетин куруп, кыйырына дан толуп, өрүшүнө мал толуп мамыр жашоо кечирди. Бирок «Манастын» өзүндө айтылган кейиштүү себептердин айынан Кыргыз мамлекети акыры кыйрады. Ошондон кийин миң жыл бою кыргыз кайра биригип, бирдиктүү дөөлөт куралбады. Бир канаты Кашкарга, бир канаты Каңгайга карап, калганы Кысарга кире качып, бөлүндүжарылды болду. Кыргызды тарых майданынан толук жок болуу коркунучунан Октябрь революциясы, Совет мамлекети сактап калды. Тарыхтын бул чындыгын танууга биздин эч акыбыз жок. Кыр-кырда жүргөн кыргыздын башын бир жерге, бир чамгарак алдына бириктирип, көз каранды болсо да, өзүнчө мамлекеттигине негиз салып, алдыңкы маданиятка жол ачкан да Совет бийлигинин шарапаты. Азыркы күндө Кыргыз эли өз тарыхында экинчи ирст өз тагдыры өз колуна тийип, эгемендүү болуп турат,"},{"t":"p","h":"Ошо жети сабакты, ошо Манас атабыздан калган жети осуятты ар кимибиз жүрөгүбүздө алдейлеп, ыйык тутсак, анда биздин келечегибиз кең болот."},{"t":"p","h":"Замандан заман арытып, бизге чейин келип жеткен Ала-Тоо, Ата Журтубуз, ак калпак кыргыз калкыбыз ата-салтын уланткан, уңгулуу асыл наркыбыз бу жарык дүйнөдө түбөлүк кала берсин."},{"t":"v","l":["&lt; 1. Манастын канча осуяты бар?","2. Кошой аба женунде эмие билесин?","3. Ч. Айтматов «Манас» жөнүндө эмне деп айтты эле?","4. «Манастын» бир осуятыи чечмелеп бер.","5. «Манастын» жети осуятын жаттап ал."]}],"sub":[{"title":"Манастын жети осуяты","b":10},{"title":"Манастын жети осуяты","b":12}],"pages":[6,9]},{"title":"«Манас» эпосунун изилдөөчүлөрү. Чокон Валиханов","blocks":[{"t":"h3","h":"«Манас» эпосунун изилдөөчүлөрү. Чокон Валиханов"},{"t":"p","h":"19-кылымдын экинчи жарымында «Манас» эпосун эл оозунан жыйнап алууга олуттуу көңүл буруп, бул ишке биринчи жолу илимий негиз салган, жогоруда ысымы аталган казак окумуштуусу Чокон Валиханов болуп саналат."},{"t":"p","h":"Сибирдеги Омск шаарында кадет корпусун бүтүргөн, 21 жаштагы <span class=\"pg\" data-n=\"10\">10<\/span>жаш офицер Чокон Валиханов орус экспедициясына кошулуп, Ала-Тоого келет. Саякатка келген Чокон Валиханов кыргыздардын арасында эки ай болот. Жаш окумуштуу Ысык-Көлдөн элдик чыгармачылыктын көркөм дүйнөсү менен кездешет."},{"t":"p","h":"Ысык-Көлдө эки ай жүргөн кезинде, Чокон Валиханов өтө зор кызыгуу менен кыргыздын көптөгөн уламыш-аңгемелерин, ырларын, санжыратарыхтарын жана башка көп кыйла фольклордук материалдарды бир нече дептерге жазып алган, Айта кетчү нерсе, ошол дептерлердин бири айтылуу Кененсары Касымовдун 1847-жылы Чүй боорунда кыргыздар менен болгон согушу жөнүндөгү эл оозунан уккан материалдарга арналыптыр, Кененсары Касымов Чокон Валихановдун жакын кандаш тууганы болуп (экөө тен казак ханы Абылай хандын небереси), ошол 1847-жылкы урушта кыргыздардын колунан каза тапкан."},{"t":"p","h":"Чокон Валиханов жыйнаган фольклордук – тарыхый материалдардын ичинен эң маанилүүсү Ысык-Көлдүн Түп аймагынан белгисиз манасчыдан жазылып алынган «Көкөтөй хандын ашы» болуп эсептелет. Манастын бул үзүндүсү бардыгы 3600 ыр саптарынан туруп, араб тамгасы менен калың кагаздуу 47 беттик дептерге жазылган."},{"t":"p","h":"Чокон Валиханов Омскиде офицердик кадет корпусунда окуп жүргөндө эле «Манас» жөнүндө эшите баштаган экен. Буга кадет корпусунун окутуучусу Н. Ф. Костылецкийдин лекциялары себеп болгон. Н. Ф, Костылецкий кыргыз-казак калктарынын элдик оозеки чыгармачылыгынын айрым үлгүлөрүнүн негизинде окуу жайда лекцияларды окуп турган. Ал лекцияларында пайдаланган фольклордук материалдардын арасында «Манас» дастанына тиешелүү «Конурбай», «Карабаш уулу Манас» деген ыр түрүндөгү баатырдык эки сюжет болгон. Бул эки сюжет казак окумуштуусу А. Маргуландын жазганы боюнча ушу күндө да Москвадагы мурдагы СССР Илимдер академиясынын чыгыш архивинде сакталып турат. «Коңурбай» деген сюжеттин сыртына Н. Ф. Костылецкий учурунда «Героический эпос» деп өз колу менен жазып койгон экен."},{"t":"p","h":"Демек, Ч. Валиханов «Манас» дастаны туурасында Кыргызстанга келе элек кезинде эле тааныша баштаган экен. Ысык-Көлгө келе жатып Каркырага жакын турган казак аймагынан «Манастын боз дөбөсү» деген айтылуу жер менен таанышып, «Манас» жөнүндөгү өзүнүн биринчи сөзүн ошол жерден дептерине чиймелеген. Ал сөз мындай эле: «Илгертен калган сөз боюнча калктын эпикалык эң кызык ырында айтылып жүргөн Эр Манас кара кытайлар менен согушканда ордосун ушул жерге тиккен дейт»."},{"t":"p","h":"Экспедициядан кийин Петербургда география коомунда чыгып сүйлөгөн сөзүндө Чокон мындай леген: «Манас» поэмасынын бир бөлүгү саналган «Көкөтөй хандын ашы» деген ырды кыргыз акынынын айтуусунда жазып алдым, Белгисиз тил менен чыгышты изилдеген окумуштууларды тааныштыруу үчүн кыскача сөздүк түзөйүн деген оюм бар»."},{"t":"p","h":"Аман-эсен болгондо Чокон «Манас» үчүн дагы далай илимийизилдөөчүлүк иштерди жасайт эле. Тилекке каршы, оорунун айынан шум ажал аны 1865-жылы 30 жаш курагында жарык дүйнөдөн алып кетти. Ушинтип, алгачкы манастаануучунун балбылдап жанып келаткан чырагы мезгилсиз жалп этип өчкөн,"},{"t":"v","l":["<span class=\"pg\" data-n=\"11\">11<\/span>3 ысымы – имя","жакын каидаш – кровные","себеп – причина","чиймелеген – расписал (слелал наброски}","изилдеген – исследовал","илимий-изилдеечулук – научио-исследовательская","оорунун айынан – из-за болезии","жалп этип өчкөн – здесь: ушел из жизни"]},{"t":"h3","h":"§ 1. Чокон Валиханов деген ким болгон?"},{"t":"v","l":["у ‚ Ысык-Көлдө «Манастын» кайсы үзүндүсүн жазып алган?","3. Ал канча ыр саптан турган чыгарма?","4. Анын дагы эмне түзөйүн деген ою бар эле?","5. Манастаануучунун салымы канча деп ойлойсуң?"]}],"sub":[{"title":"§ 1. Чокон Валиханов деген ким болгон?","b":10}],"pages":[10,11]},{"title":"В. Радлов жана «Манас» эпосунун Европада таанылышы","blocks":[{"t":"h3","h":"В. Радлов жана «Манас» эпосунун Европада таанылышы"},{"t":"p","h":"«Манасты» эл оозунан жыйноо ишине Ч. Валихановдон кийин эн зор салым кошкон, «Түркологиянын атасы» деген атка конгон, улуту немис, академик Радлов Василий Васильевич (немисче – Фридрих-Вильгельм) болуп саналат. Саякатчы – окумуштууларга Борбордук Азиянын, Түркстандын миңдеген чакырымдарга созулган аралыктарын бирде төө минип, бирде жөө жүрүп, ашуу ашып, таш басып, агыны катуу суу кечип, азаптуу кыйынчылыктар менен өтүүгө туура келген. Ошондой жол азабын тартып, күнү-түнү жер кезип, какыраган чөл басып, кар кетпеген бел ашып, алыскы Европадан Ала-Тоого келип, Сары өзөн Чүйдө, Ысык-Көлдө, Каркырада болуп, атактуу «Манасты» ак кагаз бетине түшүргөн Василий Радлов."},{"t":"p","h":"Василий Радлов (1837—1918) он бир жыл бою тынымсыз илимий экспедицияга чыгып, саякат жасап, Сибирь-Алтай жана Борбордук Азия аймактарын кыдырып, бул географиялык чөлкөмдөргө жашаган түрк элдерин түгөл аралап, өзүнүн илимий иликтөө-изилдөө иштерин жүргүзүп, фольклордук материалдарды жыйнаган, Ошондой экспедициялардын мезгилинде ал Кыргызстанга үч мертебе саякаттап келген эле."},{"t":"p","h":"Мына ошол саякат-сапарларда чыгыш таануучу филолог-илимпоз улуу «Манас» эпосу менен кездешкен. Бугу, сарыбагыш, солто элдеринин айылдарында кара кыргыз калайык-калкы менен жолугушуп, эл өкүлдөрү менен баарлашып, акындар, ырчылар, кошокчулар, кеп багып, сөз күткөн чечендер, сөзмөрлөр менен жолугушуп, алардын өнөрлөрүнө күбө болот. В, Радлов «Манасты» ар кыл акындардын, манасчылардын түрлүү жыйындарда, топтордо эл алдында күпүлдөп айткан учурунда тыңшап угат. Илимпоз кыргыздар «Манасты» абдан кадырлашып, өзгөчө, Манастын Кырк чорого кайрылып турган жерин көпчүлүктүн өтө жактырарын байкайт, «Өз көзүм менен күбө болдум, бир жолу акын ырдап жатканда, бир манап кубана кыйкырып тура калып, үстүндөгү жибек чапанын чечип ырчыга белек катары ыргытты», – деп жазат В, Радлов."},{"t":"p","h":"<span class=\"pg\" data-n=\"12\">12<\/span>Ал ысымдары белгисиз манасчылардан мухиттей чалкыган эпостун «Манас», «Семетей», «Сейтек» бөлүмдөрүн жазып алат. Бардыгы болуп эпостун 12454 ыр сабын кагазга түшүргөн. Мунун ичинен 3005 сабы «Семетей» менен «Сейтекке» тиешелүү. 9449 сабы «Манаска» таандык. «Манас» бөлүмү боюнча Манастын төрөлүшү, Алмамбеттин окуясы, Көкчө менен болгон уруш, Манастын өлүмү сыяктуу сюжеттик бөлүктөр жазылып алынган. Мындан сырткары, В, Радлов бардыгы 5322 саптан турган «Жолой хан» жана «Эр Төштүк» эпикалык поэмаларын да кагаз бетине түшүрүүгө үлгүргөн."},{"t":"p","h":"Илимпоз – түрколог өзү орус транскрипциясы менен жазып алган «Манас» үчилтигин орусча кеңири илимий баш сөз менен жабдып, 1885- жылы Санкт-Петербургда кыргыз тилинде «Түндүк түрк урууларынын элдик адабиятынын үлгүлөрү» деген ат менен өзүнчө том түрүндө жарыкка чыгарган, Ошол эле 1885-жылы «Манас» Германияда Лейпцигде немис тилинде жарыяланган. Китептеринин баш сөзүндө «Манас» эпосуна В, Радлов «элдин бүткүл турмушунун жана калктын бардык умтулуштарынын поэтикалык чагылышы» – деп жогору баа берген жана кыргыздардын сөз маданиятын, сөз чеберчилигин бийик баалаган,"},{"t":"p","h":"В. Радловдон кийин, венгер окумуштуусу Д. Алмаши 1901-жылы Орто Азияга зоологиялык экспедицияга келип, Чүйлүк жана Ысык-Көлдүк кыргыздардын арасында 8 ай жашап жана иштеген, Ошондо Дердь Алмаши «Манастан» 72 сап жазып алып, аны кийин 1911-жылы Будапешт шаарында чыгуучу «Восточное образование» аттуу журналга «Манас уулу Семетей менен коштошкону» деген ат менен жарыялаган, «Бул эпикалык ырлардын кол жазма түрүндөгүсү жок, жөн гана көптөгөн ырчылардын тилинде жашап, ооздон-оозго өтүп, көчмөндөрдүн кайсы айлында болбосун ар качандан бир качан аларды уккан киши өксүбөйт» – деп жазган, Окумуштуу «Манастын» көлөмүн анча даана элестете албаган, ошон үчүн «Манаста» 20000 ыр жолу, ал эми Семетей менен Сейтекке 30000 сап ыр деп болжолдогон."},{"t":"p","h":"Эми Октябрь революциясына чейин «Манасты» эл оозунан жыйноого кыргыздардын өздөрүнүн мамилеси жөнүндө азыноолок сөз. Революциянын алдында кыргыздардын арасында өзбек, казак, татар, башкыр молдолорунан окуп, сабатын ачкан кишилер, орус-тузем мектептерин бүтүргөндөр, 20-кылымдын баш жагында пайда болгон Кыргызстандагы «жаңы метод» мектептери деп аталган окуу жайларды, медреселерди аяктаган адамдар, өз демилгеси менен кыргызча европалык типтеги мектеп салдырган эл жакшылары сан жагынан аз-аздап арбый баштаган. А түгүл, алардын арасында Уфадан, Оренбургдан өздөрүнүн китептерин бастырып чыгарган билимдүү кишилер да болгон. Маселен, 1917-жылга чейин кыргыздардан «Сагымбайдын зары» деген ырды жазып алганы белгилүү. Балким, Б. Солтоноев манасчыдан «Манастын» башка үзүндүлөрүн да жазып алгандыр."},{"t":"p","h":"Тоголок Молдо да революцияга чейин «Манасты» кагазга түшүрүп, үркүндө жоготуп жиберген деген кабар бар."},{"t":"v","l":["жыйноо – собрание","жөө жүрүп – пешком","<span class=\"pg\" data-n=\"13\">13<\/span>азаптуу – мучительный","жер кезип – бродя по земле","бел ашып – проходя перевалы","түгөл аралап – полностью исследовав","иликтоо-изилдое – исследование","саякит-сипарларда – в дальних путешествиях","калайык-калкы – народ","күбө болот – становится свидетелем","байка – замечать","ысым – имя","мухиттей чалкыган – распростерся как оксан","уруш – ссор","үлгүр – успеть","умтулушат – порыв, стремительное движение вперёл","кол жазма – рукопись","түрүндөгүсү – в виде","көчмөндөрдүн – кочевииков","өксүбөйт – ие рыдает","болжолдогон предположительно определил","демилгеси менен – с усилием","$ |. «Түркологиянын атасы» деген атка ким конгон?","2, Ал улуу эпостун кайсы бөлүмдөрүн жазып алган?","3. Бардыгы болуп канча ыр сабын кагазга түшүргөн?","4, «Манас», «Семетей», «Сейтек» эпосторуна илимпоз кандай баа берген?","5. өӨМанастын» изилдөөчүлөрү деген тема боюнча проект жумушун жүргүзгүлө."]},{"t":"h3","h":"Адабият таануу илими"},{"t":"p","h":"1925-2000-жылдардагы Кыргыз профессионал адабияты (поэзия, проза, драматургия жана адабият таануу) боюнча жалпы обзор."},{"t":"h3","h":"Поэзия"},{"t":"p","h":"Эне тилибизде массалык маалымат каражаттарын (көбүнчө газета-журналдардын), туруктуу иштеген китеп басмасынын, дагы башка саясий, маданий, таалим-тарбия очокторунун ачылышы кыргыз поэзиясынын кадыресе адабий формада үзгүлтүксүз өрчүй башташын шарттады."},{"t":"p","h":"Улуттук басма сөзүбүздүн тунгучтары «Эркин-Тоо» («Кызыл Кыргызстан»), «Ленинчил жаш» газеталары, «Коммунист», «Дыйкан», «Жаны маданият жолунда» журналдары биринчи сандарынан баштап ыр түрүндөгү материалдарды көп жарыялаган, алардын дээрлик баары. айрыкча газеталары анда-санда гана бир ыры жок чыкпаса, калган учурларда ырдан өксүгөн эмес. 1925-1929-жылдар аралыгында биздин прессада жарыяланган ар кыл ырлардын жалпы көлөмү чоң эки томго барабар. Ал эми «Жаңы маданият жолунда» журналынын 1928-1929-жылдары чыккан 9-санында 43 ыр, 4 поэма, 4 ырлар цикли жарыяланган."},{"t":"p","h":"«Эркин-Тоонун» чыгышы менен гана акындык өнөргө умтулгандардын, ал газетанын алгачкы сандарына ырлары жарыяланган жаштардын <span class=\"pg\" data-n=\"14\">14<\/span>арасынан көп өтпөй А, Токомбаев (1904—1988), М. Токобаев (1905—1971), М, Элебаев (1905—1944), Ж. Жамгырчиев (1906—1944), Б. Кененсариев (1896— 1964) алдыга суурулуп чыккан. Булардан бир аз кийинчерээк мезгилдүү басма сөз беттеринде жаңы калемгерлердин дагы бир тобу көрүнө баштаган, Алардын чыгаандары Жоомарт Бөкөнбаев (1910—1944), Жусуп Турусбеков (1910—1943), Кубанычбек Маликов (1911-1978) болгон."},{"t":"p","h":"1925-1929-жылдары жаңыдан өнүгө баштаган басма поэзиябыздын чыгармаларынан төрт гана жыйнак жарык көргөн: «Касым ырларынын жыйнагы» (1925), «Кызыл гүл» (1927), «Ленин тууралуу» (1927), «Аял ай-"},{"t":"p","h":"Бул мезгилде жаралган поэзиялык чыгармалар бүт бойдон ошо кездеги мезгилдүү басма сөздө жарыяланган. Демек, алар газета-журналдардын күндөлүк муктаждыктарына, талаптарына ылайыкталып жазылган, Ошон үчүн алардын басымдуу көпчүлүгү Совет бийлиги жыл сайын белгилей баштаган майрамдарга жана башка атактуу даталарга, Советтер Союзундагы жана чет өлкөлөрдөгү маанилүү саясий окуяларга, республиканын коомдук турмушунда оркоюп көрүнгөн фактыларга жана көрүнүштөргө арналган, Натыйжада, ал ырлар газета-журналдык башка материалдардан мазмундук элементтери жагынан анча айырмаланган эмес, тактап айтканда. поэзия формасындагы публицистикалык чакан макалалар же кабарлар, учурдагы саясаттын тикелей жаңырыктары, актуалдуу өкмөттүк ураандардын ырга салынып айтылган түрлөрү сыяктуу эле болгон."},{"t":"p","h":"Улуу Ата Мекендик согуш советтик адамдардын бийик ансезимдүүлүгүн массалык баатырдыктын көрүнүшүнө алып келди, Жаны замандын тарбиялык иштеринин натыйжасында пайда болгон – максаттуулук. терең идеялуулук. өзүнө ишенүү. ишкердүүлүк, элге. мекенге, партияга берилгендик, туруктуулук, тайманбастык өңдүү эң сонун сапаттар согуш жылдарында жогорку деңгээлде ачык көрүндү."},{"t":"p","h":"Согуш мезгилинде көп улуттуу совет адабиятынын башкы темасы – согуш темасы болду. Кыргыз жазуучулары чакан ырлардан тартып поэмаларга, очерк, публицистикаларга чейин үзгүлтүксүз жазышып, жоокерлерди эрдикке, ар-намыстуулукка, тылдагы эмгекчилерди эмгекке, чыдамдуулукка үндөштү. А. Токомбаевдин «Алкоо», М. Элебаевдин «Улуу марш», К. Маликовдун «Канга кан», Ж. Бөкөнбаевдин «Кагылайын тууган жер», «Чабуул», Т. Үмөталиевдин «Жеңиш ырлары» ыр китепчелери, Ж. Турусбековдун «Каракчынын трагедиясы», А. Осмоновдун «Махабат», «Менин энем», «Ким болду экен?», Ж. Бөкөнбаевдин «Ажал менен ар-намыс» поэмалары жазылган."},{"t":"p","h":"Согуш мезгилинде жазылган айрым поэмалардан байкалган дагы бир нерсе – бул алардын элдик оозеки поэзиянын салтына өтө жакын болгондугу. Мисалы: Т. Үмөталиев «Эң кыйын кимиси?», Ж. Бөкөнбаев «Чептен эрдин күчү бек» аттуу чакан поэмаларын элдик сюжеттердин негизинде жазышып, душманга каршы күрөшүү үчүн темирдей бек ынтымактын, биримдиктин зарыл экендигин көркөм элес аркылуу жеткирүүгө аракеттеништи."},{"t":"p","h":"Согуш мезгилиндеги ырлар жалпы жонунан үгүт-насаат, чакырык, үндөө түрүндө жаралган."},{"t":"p","h":"<span class=\"pg\" data-n=\"15\">15<\/span>50-жылдардын башталышындагы кыргыз поэзиясында тынчтыкты коргоо темасы алдыңкы планга чыккан, Өлкөнү калыбына келтирүү аяктап, мамлекеттик масштабдагы улуу курулуштардын келечегине шыктанган акындардын чыгармаларында Ата Мекен, өмүр, турмуш, эмгек темалары жаңы бийиктикке көтөрүлдү. А. Токомбаев «Мекеним», «Волга дайра», «Коммунизмге», Т. Үмөталиев «Жеңиш ушул», «Арсланбаб», А. Токтомушев «Эмгек жана бакыт», «Менин анкетам» сыяктуу ырларда эмгек даңкталды."},{"t":"p","h":"Ал эми согуштан кийинки кыргыз айылы, айыл адамдары алардын эмгеги, ой-санаалары дүйнөгө көз карашы, үрп-адаты, салты акын А. Осмоновдун поэзиясынын негизги тематикасына айланган."},{"t":"p","h":"1950-жылдары кыргыз поэзиясына абдан көп жаштар күргүштөп кирди. Алардын ырлары газета-журналдарда, атайын альманахтарда үзүлбөй жарыяланып турду. Ал эми Ж. Садыков, С. Урманбетов, М, Сейталиев, Р, Рыскуловдор бирден-экиден ыр китептерин чыгарууга үлгүрдү. Булар эн алгачкы жыйнактарында эле бир чети Кыргыз совет поэзиясынын туруктуу салттарынын алкагында аракет кылышса, бир чети башка элдердин ыр маданиятынын тажрыйбасын да өздөштүрүп, акындык жаңычылдыкка талпынышты."},{"t":"p","h":"Ошентип, согуштан кийинки он-он беш жылда кыргыз поэзиясы өзүнчө бир тарыхый, саясий идеологиялык маданий шарттарга жараша өнүгүп отурду. Бул жолдо жоготуулар да, табылгалар да болду, Улуттук поэзиябыздын тажрыйбасы байыды, салттарына жаңы салттар кошулду."},{"t":"p","h":"Алар эң оболу граждандык темаларга көп кайрылышып, Ата Журтубуздун саясий-коомдук турмушундагы орчундуу окуяларга үн кошуп турушту; заманыбыздын маанилүү проблемалары тууралуу чымыркана ой жүгүртүп, жергебиздин табиятын, жаңыча көрүнүштөрүн, калкыбыздын күжүрмөн эмгегин, жакшы салттарын, асыл сапаттарын берилип ырдашты."},{"t":"p","h":"60-жылдардагы кыргыз поэзиясында идеялык эстетикалык изденүүлөр өтө активдешип, ыкчамдатылган түргө өттү."},{"t":"p","h":"Бул мезгилдеги кыргыз поэзиясынын өнүгүш процессин көз алдыга келтиргенде адегенде эле аксакал акындарыбыздын ыр китептери, алардын калеминен жаралган эпикалык масштабдагы ири чыгармалар эске түшөт. Алар: А. Токомбаевдин «Комуз күүсү», «Таң алдында», «Мезгил үнү», «Жылдызым», К. Маликовдун «Көл жээгинде кездешүү», «Эртеңкини ойлонуу», «Аскадан үн», «Алтын жип», Т. Үмөталиевдин «Тегене», «Баатыр», «Кутманым», «Нарын», «Ыр жүрөгү карыбайт», «Кызыл жар», «Торгой таңшык», А, Токтомушевдин «Сүйүү жана коркунуч», «Эркин саптар», «Алтын тоо», Н. Байтемировдун «Канаттуу күндөр», «Долон» ж. б."},{"t":"p","h":"60-70-жылдары кыргыз аялдар поэзиясы абдан өнүккөн. Аялдардан чыккан акындарыбыз Майрамкан Абылкасымованын «Кичинекей досторго». Тенти Адышеванын «Заманым», Ж. Тынымсеитованын «Сыбызгы», С, Абдыкадырованын «Булак», М. Буларкиеванын «Тамчы», Н. Жүндүбаеванын «Алгачкы жанырык» аттуу ыр жыйнактары жарык көргөн. Аял акындарыбыз поэзияга ишенимдүү кадам шилтешкенин далилдей алышты,"},{"t":"p","h":"Өлкөдө кайра куруу. ачык айтуу саясаты күчөгөндө поэзия мурдагыдан <span class=\"pg\" data-n=\"16\">16<\/span>да активдүү кыймылга келип коомдогу оң-терс көрүнүштөрдү тереңирээк иликтеп, өз оюн, өз көз карашын кеңири, айкын билдирүүгө аракеттене баштады. Бул багытта кемчиликтерди сындоо мотивинин кыйла активдүү көрүнгөндүгү белгилүү. Жаш акын Шайлообек Дүйшеев турмуш чындыгынын актуалдуу маселелерин күн тартибине курч койгон бир катар ырларында кемчиликтерди бетке айтууга батынды, Анын 1992-жылы жарыкка чыккан «Кайдыгерлик» аттуу ыр китеби буга далил. Акындын «Кыргызбай менен Кыргызгүл» баяны, «Ысык-Көлдү сакта дейсиң», «Эсиңе кел» деген ырларынын мазмундары да маанилүү маселелерди козгогондугу менен окурмандарды кызыктыра алган."},{"t":"p","h":"Акын Насирдин Байтемиров «Шабдан», «Байтик», «Курманжан датка», «Зууракан» жөнүндөгү көлөмдүү дастандарды, казалдарды жазды. Акын Сооронбай Жусуев «Курманжан датка» тууралуу ыр менен роман жаратты, Сүйүнбай Эралиев «Кесиринсан» поэмасын жазды. 10—11-кылымдарда жашап өткөн бабабыз Жусуп Баласагын «Кутадгу билиг», «Кут алуу билими» аттуу атактуу дастаны азыркы кыргыз поэзиясынын тилине которулуп, жарыкка эки жолу чыкты. т туруктуу – непоколебимый, стойкий"},{"t":"v","l":["максаттуулук – цель, желание","өзүнө ишенүү – самоуверенность","шартталды – обусловил","түрүндөгү – ввиде","өксүгөн эмес – здесь: ие хватало"]},{"t":"p","h":"ишкердүүлүк – активность, энергичность – көлөм – объём, масштаб, размер тайманбастык – решительность, смелость"},{"t":"v","l":["жупуну – простой","талаит","жаркын талант —","чыккан – вырвался","муктаждык – нужлаемость, потребность","чакан – немного, небольшое количество","кашкайган чындык – непреложная истина өнүгүш – развитие","таазим – поклон","коз чаптыруу – окинуть илглядом","ыкчамдатуу – ускорять, усиливать","даңаза —","роскошь","кайра куруу – перестройка","аздыр-көптүр – много ли мало ли","үгүт – насаат","айырмаланып турат – отличается","соңку учурда – последнее время","саясий – политический"]},{"t":"p","h":"иликтөө – высматривание, расспрашивание тажрыйба – практика, опыт, эксперимент үзгүлтүксүз өрчүй – испрерывно развивая асыл сапаттар – благородные качества"},{"t":"p","h":"&lt; 1. Согуш мезгилиндеги поэзиядагы башкы тема кайсы эле? Акындар кандай ыр, поэма-"},{"t":"p","h":"ларды жаратышкан?"},{"t":"p","h":"2. Согуш аяктагандан кийин чыгармачыл аламдардын негизги темасы кандай нукка"},{"t":"p","h":"бурулган?"},{"t":"p","h":"3. Алтымышынчы жылдары кыргыз поэзиясында кандай өзгөчөлүк пайда болду? Кан-"},{"t":"p","h":"дай чыгармалар пайда болду? Кыргыз акын аялдарынын чыгармачылыгы кандай өнүгө баштады?"},{"t":"p","h":"4. Кайра куруу мезгилинде жазылган чыгармаларга кандай баа берсек болот? Кайсы"},{"t":"p","h":"акындар кандай чыгармаларды жаратышты?"},{"t":"h3","h":"<span class=\"pg\" data-n=\"17\">17<\/span>Проза"},{"t":"p","h":"1925—1929-жылдары адабий прозанын көпчүлүк жанрлары (түрлөрү) жарала баштады. Алар эң оболу эле билим берүү зарылчылыгынан, саясий үгүт-насыят жүргүзүү муктаждыгынан улам пайда болду. Маселен, мектептер үчүн жаңыдан жазылчу окуу китептерине майда аңгемелер, дагы башка адабиятташтырылган материалдар керек эле. Бирок, кыргыз жазма тилинде тексттер али жок эле, Ушундан улам эне тил жана адабият боюнча окуулуктарды жазгандар чакан көлөмдүү прозалык баяндарды өздөрү жазууга аргасыз болду. Натыйжада ошол жылдары жарык көргөн «Чоңдор үчүн алиппе», «Жазуу жолундагы саамалык», «Жаңылык», «Биздин тил», «Жаңы айыл» деген окуу китептерде майда көркөм аңгемелер жарыяланды. Ал аңгемелерде жөнөкөй турмуштук окуялар кабыл алууга жеңил тил менен баяндалып берилген эле."},{"t":"p","h":"Ошол жылдары мектеп окуучулары көмөкчү окуулуктар иретинде пайдалансын деген максатта чакан прозалык чыгармалар өзүнчө жука китепчелер түрүндө чыгып турган. Алардын басымдуу көпчүлүгү башка тилдерден которулган чыгармалар болгон. Бирок ошол серияда бир катар оригиналдуу кара сөз туундулары да жарык көргөн. Алардын арасында К. Баялиновдун «Түлкү менен суур», «Чабалекей менен жылан» (1927—1928, 1929) бар."},{"t":"p","h":"Кара сөз менен жазылган адабий материалдарга «Жаңы маданият жолунда» журналынан да кеңири орун берилген. Маселен, 1928-жылдын май айынан 1929-жылдын октябрына чейин журналдын он саны жарык көрүп, тогузунда баш-аягы 15 прозалык чыгарма басылган. Алардын арасында, Узакбай Абдукаимовдун «Бакыт жолунда», Аалы Токомбаевдин «Мундуулар өлүмү», Мукамбет Дөгдүровдун «Жамангул», Касымалы Жантөшевдин «Эки жетим» деген аңгемелери бар."},{"t":"p","h":"Ал эми тематика жагынан талдай келгенде, прозалык чыгармалардын бир даарында Октябрь революциясына чейинки кыргыз турмушунан кен-кесири орун алган социалдык адилетсиздик, таптык эзүү, салт-санаанын терс көрүнүштөрү сыяктуу темалар козголгонун байкайбыз."},{"t":"p","h":"Улуу Ата Мекендик согуштун ар кыл кырдаалдары бүткүл совет адабиятынын тематикасына, жанрдык өзгөчөлүктөрүнө чечкиндүү бурулуш жасады. Бул мезгилдеги Кыргыз совет прозасынын өсүш процесси өзүнүн бөтөнчөлүктөрүнө, касиеттерине ээ. Согуштун өзгөчө шарттары, баарынан мурда «оперативдүү», ийкемдүү деп аталган аңгеме жана очерк жанрынын тез эле активдешине негиз түздү. Бир кыйла аңгемелер, очерктер фронттун жана тылдын күжүрмөн каармандарына арналды. Мына ошондуктан кыргыз жазуучулары турмуш менен учурдун өктөм талабына жооп катары согуштун реалдуу кыргыз баатырлары жөнүндө аңгеме, очерктерин жазышты. Натыйжада «Кыргыздын атактуу балдары» деген ат менен К. Маликовдун «Жайылманын талаасынан», С. Сасыкбаевдин «Нурлан», А. Токомбаевдин «Ашырбай», К. Жантөшевдин «Чолпонбай» деген аңгемелери жарыяланды."},{"t":"p","h":"Улуу Ата Мекендик согуш мезгилиндеги каармандарга арналган чыгармалардын ичинен К. Жантөшевдин «Чолпонбай» аттуу аңгемеси айырмаланып турат. Бул аңгемеде турмушта реалдуу жашаган адамдын өмүр тагдырын элестүү сүрөттөөгө аракет кылынган, Мы"},{"t":"p","h":"<span class=\"pg\" data-n=\"18\">18<\/span>Согуш жылдарында көркөм аңгеме жанрын өнүктүрүүгө да олуттуу аракет жасалган. Буга мисал катарында М. Элебаевдин «Алыскы тоодон» (1942), «Соңку бир күнү» (1942), Ж. Турусбековдун «Таза жүрөктөр соккондо» деген аңгемелерин атоого болот. Т. Сыдыкбеков бул мезгилде «Согуш күндөрүндө» деп аталган аңгемелердин жана очерктердин жыйнагын жарыялады. Бул жыйнакка киргизилген чыгармалардын басымдуу көпчүлүгү кыргыз айлынын согуш учурундагы турмушуна арналган. Андагы сүрөттөлгөн каармандар кыргыздын карыялары, кыз-келиндери, жаш өспүрүмдөрү, ар кимиси колунан келишинче жеңиш үчүн фронтко жардам, кол кабыш этишке аракеттенгендер."},{"t":"p","h":"Кыргыз прозасында да согуш турмушунун жана тылдагы ал-абалды кеңири көрсөтүү аракетинде К. Баялиновдун «Бакыт» повести, Т. Сыдыкбековдун «Биздин замандын кишилери» романы жарык көрдү."},{"t":"p","h":"Согуштан кийинки кыргыз прозасында роман, повесть жанрларынан башка аңгеме, очерк, фельетон жанрлары да жанданды. Алар Т. Сыдыкбековдун «Абысындар», С. Сасыкбаевдин «Күрөш күндөрүндө», Т. Абдумомуновдун «Жакшы адамдар», Ш. Бейшеналиевдин «Укук», Ч. Айтматовдун «Обон» сыяктуу китептеринде жарыяланган аңгемелер проза жанрынын өскөндүгүнө толук далил боло алат."},{"t":"p","h":"50-жылдардагы кыргыз прозасынын жаңы бийиктиги Ч. Айтматовдун чыгармачылыгы менен өлчөнөрүн адабиятчылар, сынчылар бир добуштан белгилешкен. «Жамийла» повести менен ал бүткүл союздук, бүткүл дүйнөлүк окуучулардын, адабий коомчулуктун көңүлүн бурду. XX кылымдын улуу жазуучуларынын бири Мухтар Ауэзов «Жамийла» повестинин психологизмине суктанып, анын адабияттагы жаны көрүнүш катары бааласа, атактуу француз жазуучусу Луи Арагон чыгарманы махабат жөнүндөгү дүйнөдөгү эн сонун баян деп атаган."},{"t":"p","h":"60-70-жылдары прозачылардын көпчүлүгү турмуш чындыгын көрсөтүүгө белсенип киришти. Бул жылдары Ч. Айтматовдун повесттеринде коомдук маанидеги, атүгүл жалпы адамзаттык маанидеги проблемалар көтөрүлөт да, ошол проблемалардын чечилиши каармандардын жүрөгү, жан сезими, ой-санаасы аркылуу өтөт. Буга мисал катары «Биринчи мугалим» чыгармасында Дүйшөндүн образы, «Саманчынын жолундагы» көптөгөн оор кайгыларды башынан өткөрүп, өзүн бүт бойдон элге арнап, акыркы деми калганча жашоо менен күрөшүп, өмүрдү турмушту улаган Толгонай, «Гүлсараттагы» ак-караны ажыратып, акыйкаттык үчүн күрөшкөн, карапайым колхозчу, коммунист Танабайдын образдары аркылуу жаңы замандын каармандары таанымал болду,"},{"t":"p","h":"Кайра куруу жылдарындагы жазуучулар коомдук турмушта болгон кемчиликтерди көркөм чагылдыруу максатын көздөдү, Ушул багытта жазылган чыгармалардын бири Ч. Айтматовдун «Кыямат» романы болду. 1991-жылы Көчкөн Сактановдун «Маркумдар үнү» романы, Ашым Жакыпбековдун «Теңири Манас» романы, Таш Мияшевдин «Аталар жолу», Эрнис Турсуновдун көптөгөн котормолору, иликтөө китептери: «Балбай жана анын доору», «Жоомарт бөтөнчө инсан», «Жусуп Абдрахманов жана анын таламдаштары» жана «Ата-Журт» романы жарыкка чыкты."},{"t":"p","h":"Публицистика жанры 80-90-жылдары бир кыйла жанданды, коомдук <span class=\"pg\" data-n=\"19\">19<\/span>өзгөрүүлөр, кайра куруу, ачык айтуу саясатынын күч алышы, эгемен мамлекетибиздин адамдарын ар кандай ой толгоолорго дуушар кылышы толук мыйзам ченемдүү көрүнүш эле."},{"t":"v","l":["Б] үгүт-насыят – натация","өлчөө – мера, измеренис","жан сезими – лушевное чувство","ой-санаасы – мысль, намерение","баян – повествование. рассказ","көлөмдүү – объёмистый, большой","көмөкчү – помощник, пособниик","туунду – вторичный","талдай – выбирая","кен-кесири – просторная","чечкиндүү бурулуш – решающий поворот","ийкемдүү – пособный, соответствующий,","действенный","элестүү – образный","басымдуу – прсобладаюший, полавляющий","өспүрүмдөр – подростки"]},{"t":"p","h":"1. Согуш мезгилиндеги кыргыз прозасынын башкы темасы эмнеге арналган?"},{"t":"p","h":"2. Согуштун баатырлары жөнүндө канлай чыгармалар жазылган?"},{"t":"p","h":"3. Согуштан кийинки мезгилде кыргыз прозасында кандай жанрлар жакшы өнүккөн?"},{"t":"p","h":"4. Элүүнчү жылдары кимдин чыгармачылыгы менен жаңы бийиктикке көтөрүлгөн?"},{"t":"p","h":"5. Кайра куруу мезгилинде кандай чыгармалар жазылды?"},{"t":"p","h":"«Эки бөлүк күндөлүктү» толтуруп салыштырма анализ жүргүз (Схеманы толтур.)."},{"t":"p","h":"«Манастын» жети осуяты чыгармасы"},{"t":"v","l":["боюнча","«Манастын» жети осуятынын азыркы","күндө актуалдуулугу"]},{"t":"h3","h":"Драматургия"},{"t":"p","h":"1920-жылдардын экинчи жарымында Фрунзеде (Бишкекте) жаңы драма жана ыр-хор ийримин (кружогун) уюштуруп, сахнада ойноого арналган адабий тексттердин эне тилибизде жогунан улам ийримге катышуучулар андай тексттерди өздөрү жаза баштаган. Чакан пьесалардын авторлору ал кездеги студенттер Т. Байжиев, Ж, Бөкөнбаев, К. Жантөшев, К. Маликов. С. Сасыкбаев, М. Элебаев болгон. Ал пьесалардын тексттери, ал түгүл аттары сакталып калган эмес. Тек гана К. Жантөшевдин педтехникум ийрими үчүн «Койчулар», «Айылда», «Лениндин уулу», «Түштө», «Биз комсомол». «Жоголсун байлар» деген бир жана көп көшөгөлүү пьесалардын аттары мемуардык материалдарда (эскерүүлөрдө) эскерилет."},{"t":"p","h":"Драматургия – адабияттын өзгөчө бир түрү. Анын жалпы адабий чыгармачылыкка ортоктош машакаттарынан тышкары өз алдынча кыйынчылыктары да бар."},{"t":"p","h":"Тилекке каршы, кыргыз адабияты жаңыдан түптөлө баштаган кезде, жаш жазуучулар аз, а түгүл жокко эсе эле. Ошон үчүн Улуттук драма музыкалык мектептин көркөм жетекчиси И. Н, Еленин «Молдо Насреддин», музыкалык жетекчиси Д. Д. Мацуцин «Жаңы турмушка», сүрөт мугалими Г. П. Петров «Москва конору» деген пьесаларды жазып беришкен. Ал пьесалар кыргызчаланып, студиянын окуучулары тарабынан ойнолгон, Ошондой <span class=\"pg\" data-n=\"20\">20<\/span>эле ушул окуу жайдан студенттери С. Сабаев жана башкалар өз-өзүнчө же биргелешип «Волисполкому жумуш күнү», «Эски турмуш» деген бир көшөгөлүү пьесалар жараткан. Булардын тышкары улуттук драма-музыкалык студиянын тарбиялануучулары М, Токобаевдин «Кайгылуу Какей», Б. Калпаковдун «Эскиден калган энчилер», М. Дөгдүровдун «Чалкан чаккандар» деген пьесаларын коюшкан."},{"t":"p","h":"Аталган пьесалардын тексттери да өз убагында жарык көргөн эмес, кол жазмалар түрүндө деле биздин М. Токобаевдин «Кайгылуу Какей», К. Жантөшевдин «Карачач» драмалары кийинчерээк (биринчиси 30-жылдары, экинчиси 50-жылдары) кайра иштелип, басылып чыккан."},{"t":"p","h":"Адегенде согуш башталар менен эле бир нече бир көшөгөлүү пьесалар пайда болду. Мекендин патриоттук чакырыгына жооп катары дүрбөлөңдүү катаал учурдун шары менен чапчаң жазылган бул чакан драмалык чыгармалар (К. Жантөшев «Көбөштүн көктүгү», А. Токомбаев «Токойдун кожоюндары», Т. Саманчин «Чалдардын жоруктары») өздөрүн аскердик катарга чакырылган жоокер катары сезген жазуучулардын калкка кайрылып, чукул айткан, чын пейилден сызылып чыккан чакырык сөзү, патриоттук үндөөсү сыяктуу көрүнөт."},{"t":"p","h":"Ушундай алгачкы кадамдардан кийин А. Токомбаевдин «Ант» (1942), Ж. Бөкөнбаевдин «Тоонун кызы» (1942), К. Жантөшевдин «Азаматтар» (1942). Р. Шүкүрбековдун «Кек» (1943), К. Жантөшевдин «Өч» (1943), Т. Байжиевдин «Жигиттер» (1944), А. Осмоновдун «Баатырдын өлүмү» (1945) сыяктуу көп көшөгөлүү драмалары жарыкка келди."},{"t":"p","h":"аралыгында драматургия айдыңында Р. Шүкүрбековдун «Эки дос», «Жашыл токой», «Менин айлым»; А. Осмоновдун «Экинчи бригада», К. Жантөшевдин «Бир үйдө»; А. Куттубаев менен Т. Абдумомуновдун «Кумдуу чап», «Замандаштар», «Курман»; К. Маликовдун «Шахтер кызы»; М, Борбугуловдун «Мелдеш», «Бир бүлөдө»; Ш. Бейшеналиевдин «Уядан учкандар»; М. Алыбаевдин «Зоотехник Буйлашев» деген сыяктуу көптөгөн пьесалары пайда болду. Алардын темалары ар түрдүү, мисалы, Р. Шүкүрбековдун «Жашыл токой» колхоз айлын көрктөндүрүү. жашылдандыруу маселесин козгосо, А. Осмоновдун «Күмүш булагы» айылдагы эски менен жаңынын күрөшүн сүрөттөйт. «Биз баягы эмеспиз» пьесасы согуштан кийин ирилешкен чарбанын өзгөрүшүнө арналса, Т. Абдумомуновдун «Кумдуу чабы» кыргыз геологдорунун турмушун, «Курман» пьесасы медицина кызматкерлеринин түйшүгүн көрсөтөт. Ш. Бейшеналиевдин «Уядан учкандары» студент жаштар женүндө баяндаса, Р. Шүкүрбеков менен А. Свистуновдун «Баатырдын жолу» пьесасы Балыкчы темир жол курулушуна арналган, К. Жантөшевдин «Бир үйдөсү» үй-бүлө турмушун, күндөлүк тиричиликтеги чыр-чатактарды көрсөтүүгө багышталса, М. Борбугуловдун «Мелдеш» драмасында пахтачылыктын түмөн түйшүгү тууралуу баян этет. Кыскасы, согуштан кийинки пьесалардын тематикасына көз чаптырсак, эл чарбачылыгында драматургдардын калеми тийбеген тармак калбаган сыяктуу."},{"t":"p","h":"80-жылдары кыргыз драматургдарынын пьесалары өзүнчө китептер түрүндө жарык көрдү. Алар Т. Абдумомунов «Пьесалар», Б. Жакиев «Саадак <span class=\"pg\" data-n=\"21\">21<\/span>какты», М. Байжиев «Ар бир үйдө майрам», М. Гапаров «Күнөстүү арал», Ш. Садыбакасов «Ак боз ат», М. Тойбаев «Өчпөс жылдыз» ж. б."},{"t":"p","h":"80-90-жылдары акын жана драматург Ж. Садыковдун драмалык чыгармалары жаралды, Алар «Айкөл Манас», «Манастын уулу Семетей», «Сейтек» – трилогия-драма жазылды. Анын «Адам жана азезил» пьесасы чоң маселени козгогон, адамдын туура жолдон чыгып кетишине азезилдердин азгырмасы себепкер болорун көрсөтүп адам туура чечим кабыл алып, ар бир ишке сабырдуулук менен мамиле жасоого даяр болушу керек экенин айтат. Зуура Сооронбаеванын «Сынган мазар» трагедиясында кыргыз турмушунда кездешип жаткан аракечтик көрсөтүлөт. Аракечтиктин натыйжасында адамдардын адамгерчиликтүү сапаттары жоголуп, өз жолдорунан адашып калган үй-бүлөнүн тагдыры көрсөтүлгөн. «Үй-бүлө – бул кичинекей мамлекет» деген сөз бекеринен айтылбагандыгын билебиз."},{"t":"p","h":"№ кэшөгөлүү-занавес"},{"t":"p","h":"эскерилет – вспоминастся ортоктош – соучастник түптөлө – основывасться дүрбөлөңдүү – переполох катаал – суровый"},{"t":"v","l":["чукул – спешный","чакырык – вызов, созыв, призыв","ирилешкен чарбанын – крупное хозяйство","түмөн түйшүгү – забота","чаптырсак – бросим взгляд","","Ф 1 ‚ Согуш жылдарында кандай драмалар жазылган? Кайсы темаларда?","2 ‚ Белгилүү драматургдардан кимдерди билесинер?","3 ‚ Кандай пьесаларды көрдүңөр эле?","4. Акыркы жылдары кандай драмалык чыгармалар жазылган?"]},{"t":"p","h":"Фантастика (гр. – кыялый енер), к. Илимий-фантастикалык чыгарма. Фантастикалуулук – кыялый, ойдон чыгарылган, турмушта болууга мүмкүн эмес нерселерди чагылдыруунун тиби, турмушту образдуу чагылдыруунун бир жолу. Адабияттын тарыхында фантастикалуулукка чоң роль таандык. Ал көбүнчө эпос, жомок, легенда, утопия, сатира сыяктуу жанрларга мүнөздүү. Фантастикалуулук ар түрдүү көркөм методдордо ар кандай өзгөчөлүктөргө ээ болгону менен, негизинен бардык эле көркөм методдордо көрүнөт. «Манас» эпосундагы баатырлардын кайып болушу, Алмамбеттин аба ырайын өзгөртөр касиети, жомоктордогу желмогуз кемпир, дөөлөр, учма килемдер, аттардын адамча сүйлөшүү, кырк кулач казан сыяктуу көрүнүштөр фантастикалуу нерселер болуп саналат."},{"t":"v","l":["Мына ушулар менен элдин кыялый","топ-тоголок топ кылып,","Чыкпас, мерее дарбазага камаптыр...","(С. Тургунбаев)","","[2 турмушта-вжизни","мүмкүн эмес – не возможно","чагылдыруунун – отражения","таандык – знакомо","мүнөздүү – характерно","өзгөчөлүктөргө – особенностям","учма – летучий","көрүнүштөр – видимости","болуп саналат – считается"]},{"t":"p","h":"<span class=\"pg\" data-n=\"22\">22<\/span>Жаны сөздөргө көнүл бургула:"},{"t":"raw","h":"<h4 class=\"mk\">түзүлүшүнүн – строение айырмалуу – отличать өзүнчө – своими өзгөчөлүктөргө – особенностям басымдуу – выделенный<\/h4>"},{"t":"v","l":["бөтөнчө – особенно","сап – куплет","бирдиктүү – объединенный","уйкаштык – рифма","","Касымалы Жантеш

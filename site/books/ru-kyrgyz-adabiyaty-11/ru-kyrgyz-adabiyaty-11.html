асмасынын балдар адабияты боюнча редакторлугуна дайындалган’. Жаш адабиятчы 1957-жылы окуу китептерди чыгаруучу «Мектеп» чулугунда оозго кире баштаганда, республиканын 1959-жылы алгачкы адабий көркөм чыгармалары китеп окурмандар кум алынган. 1960—1966-жылдарда республикалык «Ала-Тоо» адабий эн журналынын кара сөз бөлүмүнүн башчысы, союзун 1973-жылдарда ал журналдын башкы редактору, 1973—1 14-жылдары ре публикалык басма сөз боюнча Мамлекеттик комитетинин башкы редактору"},{"t":"p","h":"зма ан."},{"t":"p","h":"ал керкем сез чебери катары жетилип, ен «Адам болгум келет» повесттерин, «Сынган кылыч», «Келкел» шера жаш калсмгер маданий деңгээлди көтөрүүнүн, романдарын жазган. Ал күрөштүн адамы. Алыскы элетте скен а и ан, ге Е аскага тырмышып чыгуунун, адабий-эстетикалык кеңири түшү нү гозорго ээ болуунун азаптуу ички драмасын баштан т тозоктордун секиртме таштуу жолдорунда таман эти ни «ны кылыч» романы менен тарыхтагы ачуу чындыкты тайманбай чке д энә зуучунун башына канчалык оор мүшкүлдөрдү алып келди. үчүн, официалдуу бийликтин жасаган терс мамилеси жана кууту! ны сы келип чыккан оор санаалар жазуучунун психологиялык азаптуу дүйнөсү ч тактарды калтырган. болсо да, ачыш жана тышкы күрөштөрдө курчуп отуруп, жолдогу кедергиликтерди жана тоскоолдуктарды өжөрлүк менен Төлөгөн Касымбеков парасаттуу инсан катары да, абройлуу жазуучу а сүрөткер болуп, көңкү журттун маңдайында көкөлөгөн чынар сыңары ту атактуу атуул катары да калыптанып, көпчүлүктүн алдында көй! кы"},{"t":"p","h":"\"библ, демократия, эгемендүүлүк мезгилинде Төлөгөн сымбековдун жазуучу-атуул катары ак калпак кыргыз элинин алдынд"},{"t":"p","h":"жаза жазуучу Телеген Касымбеков 1990-жылы азыркы зор."},{"t":"p","h":"' дайындалган – поручен * баштан кечирди – пережил <span class=\"pg\" data-n=\"118\">118<\/span>Аксы аймагынан эл депутаты болуп шайланды. Жогорку Кеңештин жаңы жыйынында Жогорку Кеңештин Туруктуу Комиссиясынын Төрагасы жана Президиумунун мүчөсү болуп иштеди, Жогорку Кенеште каралган! көптөгөн маселелерге жан-дили менен? кийлигишип, өз пикирин ачык айтып, Кыргыз Республикасынын атын жаңыртуу, борбор шаардын атын мурдагы’ калыбына келтирүү, мамлекеттик тил, көз каранды эместик, Туу, Герб жана жер маселелеринин туура чечилишине түздөн-түз* кийлигишти. Маданият, билим берүү, дин тутуу, Граждандуулук жана басма сөз жөнүндөгү мыйзамдарды даярдоодо жана кабыл алууда да бул инсандын ишмерлигин белгилөөгө* болот, Ошондой эле эркин мамлекеттин биринчи Конституциясын даярдоодо жана кабыл алууда өзгөчө активдүү катышкан."},{"t":"p","h":"Бүгүнкү күндө Т. Касымбековдун чыгармаларынын атагы алыска тараган, «Адам болгум келет» повести далайдан бери окуу жайларынын адабият программаларынын чордонунан түшпөй, жаштардын сүймөнчүктүү чыгармасы болуп келет. «Сынган кылыч» романы сынчылар Мухтар Ауэзовдун «Абайына» тете чыгарма катары баалап келишет. Ал эми, «Келкел» романы жөнүндө адабият билерманы, окумуштуу Кеңешбек Асаналиев мындайча жазат: «Келкел» романы көп каармандуу, көп пландуу чыгарма. Бул чыгарма 1860-жылдан тартып Октябрь революциясынын жеңишине чейинки узак убакытты ичине камтыйт, Көрүнүп тургандай, роман кыргыз элинин тарыхый тагдырындагы эн бир маанилүү, эң бир орчундуу этаптык окуяларды көркөм чагылдырат. Ошондуктан, сүрөттөлгөн турмуштук окуялар да мүнөзү жагынан ар түрдүү, ар кыл. Турмуш-тиричилик, этнографиялык сценалардан тартып, тарыхый революциялык эпизоддорго чейин баяндалат, Романдын көп пландуу сюжеттик курулушунда Фрунзе, Токтогул, Курманжан датка, Мадамин бек, Аман палван сыяктуу тарыхый адамдар менен бирге, толуп жаткан ар түрдүү тагдырлар көрсөтүлөт. Кыргыз элинин эң кыйын, эң татаал тарыхый доорун даана, так сүрөттөөдө, мезгилдин эн бир түйүндүү маселелерин көркөм чечмелөөдө автор өзүнүн негизги чыгармачылык максатын жүзөгө ашыра алган. Ушул жагынан алып караганда, Т. Касымбековдун «Келкел» чыгармасы тарыхый романистикадан өзүнө тиешелүү ордун алат деп ойлойбуз. Романда коюлган идеялык проблемалардын масштабы жана мазмуну боюнча да, алардын көркөмдүк ишке ашырылыш деңгээли боюнча да, Т. Касымбеков «Жетилген курак» романынын, «Алымкан» аттуу драманын ж. б. көптөгөн прозалык чыгармалардын да автору. «Алымкан» боюнча мыкты көркөм телефильм да тартылган."},{"t":"p","h":"Т. Касымбеков кыргыз адабиятын ишенимдүү түзүлгөн эстетикасы бийик образдар, индивидуалдуу мүнөздөр, психологиялык анализ, масштабдуу философиялык ой толгоолор жана тарыхты көркөм талдоо маданияты менен байыткан чыгаан сүрөткер. Ал өзүнүн кайталангыс таланты менен кыргыз адабиятында мазмуну терең, көркөмдүгү бийик ангеме, по-"},{"t":"p","h":"' каралтан – рассмотренный"},{"t":"v","l":["›жан-лили менен – от чистого серлиа","*мурла – раньше","*тузден-туз – напрямую","° белгилоо – отметить"]},{"t":"p","h":"<span class=\"pg\" data-n=\"119\">119<\/span>весть, романдарды жаратып, кыргыз элине гана эмес, коңшу мамлекеттерге жана алыскы чет өлкөлөргө таанылган атак-даңкы бийик жазуучу болгон. окурман – читатель"},{"t":"v","l":["таанымал – известный","тагдырына – в сульбе","белгилемекчимин – хотел отметить","окшобогон – непохожий","шыгын – способность","алгачкы – первый","баштан кечирди – пережил","тарыхчы – историк","даярдоодо – в подготовке","мүнөздөр – характеры"]},{"t":"h3","h":"«Сынган кылыч» романы женунде"},{"t":"p","h":"«Сынган кылыч» 1998-жылы эл аралык масштабда эпопея аталган чыгармалардын денгээлинде соз кылууга арзыган."},{"t":"p","h":"Романдагы тарыхый окуянын масштабынан алганда, «Сынган кылычта» чыгарманын нагыз сюжетин тузуучу кел толкунундай кургуштеген тарыхый окуялардын тизмеги Шералы хан таажысын кийген 1842-жылдан баштап, Болот-Исках дарга асылган 1876-жылды – Кокон хандыгынын Россиянын карамагына толук өтүшүнө чейинки 34 жылды камтыганы менен автор тарабынан колдонулган тарыхый экскурс доорлордун тереңине кетет. кылымда эл тагдырына туш келген өтө опурталдуу, кандуу, кыйын жана кызык мезгил капысынан пайда болгон көрүнүш эмес. Шералыны хан шайлоонун (тарыхый окуянын) себебин окурманга жеткирүү үчүн жазуучу кыргыз тарыхый романдарынын композициялык структурасында архивдик материалдын ролун ойногон санжырага кайрылган."},{"t":"p","h":"Тарыхый окуянын масштабдуулугу жалаң гана ретроспективалык ыкма менен чектелбейт. Романда түндүк-түштүк кыргыздарынын биримдигине арналган эпизод көлөмдү көбөйтүү максатында эмес, улуттук биримдик идеясын тереңдетүү үчүн романдын структурасына кошулган."},{"t":"p","h":"Романда идеология темасынан тышкары элдин маданияты терең көрсөтүлгөн. Маселен, кыргыздын мейман күтүү маданияттын гана белгиси эмес. Үйдүн асем жасалгасы, бир тууган эл өкүлдөрүнүн бир-бирин күтүү. өз ара учурашуу маданияты, адаттан артыкча дасторкон жасалгасы, маектешүү этикасы, бийлик ээлеринин пикирлешүү манерасы – улут ынтымагынын маанисин ачуунун көркөм интерпрециясы. Өз алдынча мамлекеттүүлүккө жол издөөнүн амалы, элди азаттыкка чыгаруунун аргасын издөө болуп эсептелет."},{"t":"p","h":"б» Эл турмушунун купуя сырлары: коомдук-социалдык мамилелер, бийлик жана адам коллизиясы, ата-бала ортосундагы келишпестик (Эсенбай – Нүзүп), жубайлар ортосундагы мамиле (Алымбек – Курманжан), тууган ортосундагы мамиле (Сарыбай – Мадыл), улуттун жашоо образы, этнографиясы, этнопсихологиясы, дүйнө таанымы жогорку көркөм-эстетикалык деңгээлде чагылган. Улуу тоону мекендеген элдин бейпил турмушуна бүлүк түшүргөн кара мүртөз тарыхый доордун жүзү. ых Айрыкча еж. тертунчу белумунде кыргыздардын аш беруу (Жаманкулдун ашы) урп-адаты аркылуу бутундей элдик турмуштун кенири панорамасы түзүлгөн, Ашка келаткан Насредин бекти көк беру менен тосуп чыгуу, аштагы элдик оюндар (ат чабыш, балбан күрөш, эр чабыш ж. 6.), <span class=\"pg\" data-n=\"120\">120<\/span>Элдик турм уштагы өзгөчө мамиле кудала рдын бирин-"},{"t":"raw","h":"<h4 class=\"mk\">а тун улуу м Жазуучу улутту<\/h4>"},{"t":"h3","h":"шейит болгон кырчын жиг ит"},{"t":"p","h":"ир, айдай сулуу Айзааданын атасы ваты кылыч мизинде турганына карабай"},{"t":"h3","h":"менен Эр Эшимдин жеке таг махабат отуна күйүп жанган жесир Айзада рун тапкан. ке тагдырларына романды дын жалпы структурасынан р АнЗаада"},{"t":"p","h":"аркы? и: а драматизм менен берууго жетишкен бектер, Даткалар, касы кыргыз турмушу кайнаган жашоону гарлар жана мал ны өкүлдөрү катышкан: хандар бийл яр, албандар, чыккынчылар, айымдар, РЕ» д Улер, жан жигиттер – кыссы көрсөтүлгөн. н жашоодо мин түрдүү мамилелердин татаал Карып А азууч шнен жаралган типтүү образдар (Абил бий дар: Мусулманкул, Нүзүп, Ше Айзаада) эле эмес, тарыхый инсан-"},{"t":"v","l":["Курман датка, Абдырахман, Боло! Сарыбайдын тагдыры «ша ерли, Алымбек датка,","с, доор","Дүйнөлүк ы","кирген ХЇХ кылымда","менен сүрөттөлөт.","доор катары тары рыхка","элди эзип, салыктын ийлиги бир жактан, Кокон хандыгы э ры туру кун санап өскөн элинин улуттук тагдыры ү аз келгенсип кинчи жактан карапайым ‚ Ордо ичиндеги","былып, бий"]},{"t":"p","h":"<span class=\"pg\" data-n=\"121\">121<\/span>арааны ачылган ичтейин тыя албай, өзүнө жем издеп жүргөн ээси көзүнө айбан көрүнүп, кол салышы, өмүр үчүн болгон кармашта мүнүшкөрдүн көзүнүн чукулуп өлүшү жаратылыш «перзенттеринин» дисгармониясына алып келген."},{"t":"p","h":"Тарыхый кырдаал курчуган кезде (алмустактан бери) жеке адам жана жалпы эл менен бийлик ортосундагы мамиле болуп көрбөгөндөй бузулары белгилүү. Бийликтин азезил кумарына баткан «жогоркулар» үчүн адам тагдыры оюнчук боло баштагандыктан, Сарыбайдын асыл жылкы Тору кашкасы уурдалып, беш үйлүү нойгут жалган жалаага кабылды, Бардык ишке куулук менен өзү жумшап, аягы адам өлүмү менен бүткөн чуу жөнөкөй элди азапка салганда, Абил бий кыздан тартуу берип, хан тукумунун көңүлүн алмакчы болгондо, бул азаптуу кайгы да Сарыбайдын т агдырына туш болду."},{"t":"p","h":"– Чара жок... – деди, Сарыбайдын алсыз үнү, – соо калсын биртике тууган... – Ушуну айтты да Сарыбай бү к түшүп жатып калды."},{"t":"p","h":"Жалгыз кыз туягы – Кундузайдын тартууга кетишин көтөрө албаган эне акыл-эсинен ажырап, ээн талаага кутуруп кетип, Сарыбайдын сокур жашоосуна, жалгыздык кошулат. Өзү жалгыз калганы аз келгенсип, бир тууганы Мадыл Абил бийдин саяси й оюнунун курмандыгы болот."},{"t":"p","h":"«Сарыбай – элдик турмуштун нег изин эн терең түбүнө сиңирген улуттук мүнөздү алып жүрүүчү айсберг.»"},{"t":"p","h":"Ошол эле учурда тарыхый доор канчалык жексур, кырдаал канчалык катаал болсо да, эпопеялык чыгармада «элдин өлбөстүгү» даңкталат."},{"t":"p","h":"Романда сүрөттөлгөн мезгил ХЇХ кылымдагы дүйнөлүк чөйрөдөгү чоң бурулуш, өзгөрүүлөрдү камтыгандыктан, алардын пайда болуу өбөлгөлөрүн көркөм аңдоо үчүн автор тарыхый экскурстарга кеңири орун жырны Шералынын ат ыйын мезгилде улутту сактап калуунун аргасын издеп таап, хан а-тегинен башка да, тарыхый инсандар: Алим хан, Нарбото бий, Нузуптун атасы Эсенбай. Нармамбет датка, Алымбек даткалардын ата-теги аркылуу романист байыркы кыргыз турмушунун көркөм элесин ишенимдүү чагылдырган. Улут намысы үчүн болгон күрөштө каармандар көөнө тарыхтын сабактарын пайдаланышкан,"},{"t":"p","h":"Өткөн мезгилдеги улуттун жашоо образын, анын өзгөчө дүйнө таанымын сүрөттөөдө автордук ойдон жаратуу чыгармада эл турмушун кеңири панорамада, көп пландуу эпикалык формада баяндоого мүмкүндүк берген."},{"t":"p","h":"Ушундай тарыхый экскурстардын бири эл ичинде «баатыр» аталган – Бекназардын ата-тегине арналат."},{"t":"p","h":"Романда жазуучу тарабынан сүрөттөлгөн азем буюмдар: кайыш саадак, тоо текенин мүйүзүнөн жасалган сур жаа, кош миздүү шап кылыч, кийимдер жөн гана кооздук үчүн же бир гана ка арманды идеализациялоо үчүн эмес, элдин түптүүлүгүн, нарктуулугун, байыркылыгын баяндоо үчүн, анын ичинде жеке инсандын кадыр-баркын, түпкү тегин баалоо критерийи катары колдонулган. Демек, жазуучу сүрөттөгөн буюмдар элдик маданияттын уникалдуулугунан кабар берүү үчүн сүрөттөлөт."},{"t":"p","h":"Демек, «Сынган кылыч» романын эпопея атоого толук негиз бар."},{"t":"h3","h":"<span class=\"pg\" data-n=\"122\">122<\/span>Ш Сынган кылыч"},{"t":"p","h":"(Романдан узунду)"},{"t":"p","h":"Датка атанып аброю абдан көтөрүлгөн Курманжан ошол «ынтымак» деген макулдуктан оюн да, боюн да качырган жок. «Эрдин кеги – эл намысы» дешип, бүйрөсү кызый баштаган кишилерин «ачуу – араз, акыл – дос» ыгына ийгерип, сыйынып отурат."},{"t":"p","h":"Көп өтпөй бүткүл Россиянын эгеси улук даражалуу император Александр И мындан нары да жер кеңитүү иштерин жылдыра бере турган өзүнчө бир бийлик орунун уюштурду. «Түркстан генерал-губернаторлугу» деп аталды, генерал-губернатору болуп генерал-адъютант фон Кауфман дайындалды, а ага өзү башкарган чөлкөмдө тынышам десе тыныша турган, согушам десе кимге гана болбосун согуш ача бере турган, демек, падыша укугу берилди. Ошон үчүн жергилик элдин ичинде «жарымпаша» делинген."},{"t":"p","h":"Кудаяр-хан жарымпашанын «мейманга чакырганына» абдан кубанып, убакытты узактырбай жасалгаланган кокон арабага отуруп, оор топ ордо кишилерин кошо алып, жарактуу удайчыларын шарактатып, ошол 1868- жылы Ташкентке жөнөдү."},{"t":"p","h":"Мына, кудай буйруса, ак пашага жетиш кыйын, жарымпашасына болсо да жүз көрүшүп, ортодогу кыжы-кужуга себеп болуп жаткан жер-суу, эл туурасында ачыгын сүйлөшүп, кудай өзү оңдой берди кылса, тынччылык менен, бурадарлык менен берди-алды кылып, кайрып алмак. Өз үмүтүнө өзү жылынып, көзүн сүзүп, кокон арабанын ыгында термелип баратат."},{"t":"p","h":"Жанаша отурган абтабачысы Абдырахман да санаада: «Салт үй эгеси чакырчу эле. Биз не чапкылап келе атабыз?! Күч атасын тааныбайт, күчсүз күчтүүгө саламга келбеске, чакырыгына барбаска чарасы жокпу?!.» «Биз жерге, үйгө эгеликтен тайган окшойбуз го...» деген күдүк ойлорго аргасыз аралашып барды жолмо-жол."},{"t":"p","h":"Жарымпаша «жыландын баласына да жамандык ойлобой тургандай» дегенчелик, маанайы жарык, эки көзү жарым айлык ботонун көзүндөй жайнаган, күнөө ишке, кара ишке кириптер боло элек наристедей көрүнгөн инсан экен,"},{"t":"p","h":"Ал ордонун огожосун оор топ кишилерин кошо токтотпой кабыл алды, жылуу жүз, жылуу сөз, урмат сездирүүгө шашылып жатты."},{"t":"p","h":"Сылык адамдын мындай мамиле-көңүлүн көрүп, бүлүнгөн ордонун огожосу өзүн бир аз адам сезип, жарымпашага бурадар, атүгүл бул баш ийген акпашага деле теңдеш, өкүмдар экенин эми билгендей баягы манчыркаган кебетени кайра кийип, ыңгыранып сүйлөп калса болобу?! «И, ишти бузат эми бу...» деп, эки көзү чекирейди абтабачысынын, А «наристедей көрүнгөн» инсан ууртунан асте мунайым жымыйып карайт."},{"t":"p","h":"Сөз ыгында Кудаяр-хан эки өлкөнүн ортосунда болуп келе жаткан кандуу кагылыштарды, согуш десе өрөпкүгөн генералдардын күн санап алга жылып кирип келатышын эки ортодогу эссиз адамдардын, нары болгондо, жаман ойлуу кара ниет иштеринин натыйжасы деп түшүнөрүн, бул абалды сүйлөшүүлөр аркалуу салышка үмүттөнгөнүн айтты. Фон Кауфман башын тынымсыз ийкеп, «бурадардын» айткан арманын бөлүшүп, кошо кайгырышып, <span class=\"pg\" data-n=\"123\">123<\/span>эми мындан нары андай кандуу окуяларды кудай бизге бербесин деп, тилек билгизип отурду. Ошону менен катар, сөз арасында улук даражалуу император бу кичинекей кокон ханы менен эч качан согушууну көксөгөн эмес, көксөбөйт да, кайта аны баласындай көрүп, ички-тышкы тиги Бухара жана Хийвага окшогон кастарынан дайыма калкалоого дилгир, тыштан бир жамандык хандын башына түшсө Россиянын эгеси ал жамандыкты өз башыма түштү деп билет деп түшүнттү да, эми эчтемеден кам санабай хан бактылуу хандык доорун сүрүп, тынч жата берсе болорун билдирди."},{"t":"p","h":"Эми «уктуңарбы» кабак көрсөтүп, өз кишилерин акырын АНЯ деди ез ичинен абтабачысы Абдырахман. ып юп тиктеп алды Кудаяр-хан. ч"},{"t":"p","h":"Кокус, жазып-тайып, хан же анын амириндеги калктар кандайдыр бир Россиянын кызыкчылыгына каршы кадамдарды баштай турган болушса. анда чыдамкайлыктын түгөнгөнү ошол, бүткүл Россиянын эгеси жөн эле карап тура албастыгын кабагы жарык «бурадар» бурадарлык иретинде көңүлгө салды."},{"t":"p","h":"Абдырахмандын тымызын көз кыйыгы дагы түштү өз өкүмдарына. Кудаяр-хан бул өтө оор эскертүүнү мардемсип, урматы улук акпаша эч камтама болбосун, биртике курал, биртике көмөк эле болуп турса, андай тыраңдап чыккан калктардын жинин өзүлөрү эле кагып коюшарын күпүлдөп, өтө жеңил кабыл алды."},{"t":"p","h":"Эми «Положение» деп аталган шартнама алып келинди ортого, мурда эле даярдалып коюлган экен."},{"t":"p","h":"«Положение» боюнча мурда Кокон хандыгынын тиги эле Россиянын чегинен Ташкенге чейин жер-суу, түркүн тайпа эли Империянын кодеш не өткөрүлгөн; хан жак, анын бектери бул жакка илим максаттары юнча келген куралдуу саякатчылардын жолуна бөгөт кылбоо, кайсы гана шаар болбосун россиялык көпөстөр эркин соода жүргүзө бериши макулдашылган. Эң акыры, коңшулаш мамлекеттер менен кандаидыр бир деңгээлде алака кылыша турган зарылдык болсо андай иштер кеңешилип жүргүзүлүшү эки жакка тең эскертилген."},{"t":"p","h":"Абдырахман маңыроо тартып отурат; «Эки аягыбыз бир кончко тыгылган экен!» Генерал-губернатор фон Кауфман ордунан тура келип, Кудаяр-хандын колун кармап, бактылуу жымыйган иреңинен өзгөрбөй, таксыр Кудаяр-хандын өкүмдарлык даражасын кадырлай тургандыгын тактады. Кол койду «Положение» түбүнө."},{"t":"p","h":"«Э-э... жымыйып туруп териңди сыйрып алат деген ушубу?!» деп таң калды абтабачы Абдырахман. Мекчейип, Кудаяр-хан да ойлоно түштү: «...жер кетсе... буларсыз бирөө менен барыш-келиш кыла албасак...»"},{"t":"p","h":"Иреңи боз тилмеч: «Кол коюнуз..» деди акырын. Кудаяр-хан чала угуп калгансып, тумшугу маңыроо, аны кайра тиктеди. «Кол коё согушка даярданыңыз, таксырым...» деди тилмеч боз иреңи ан сайын кубарып, акырын. Буларды тыяктан жымыйып, «бурадар» көздөн өткөрүп турат. Биртике көз ирмемден ойгонгондой эсине келе түшө, шашылгансып да, кол мөөрүн басты Кудаяр-хан: «..жок дегенде... бирөөлөр дагы баш көтөрүп калышса мага таянар өбөк болушар, ыя, буларды кудай урбаса...»"},{"t":"p","h":"Нары толгонуп, бери толгонуп, акыры өзүн өзү жубатып, келечекте <span class=\"pg\" data-n=\"124\">124<\/span>бул «Положение» ага жамгыр өтпөс, ок өтпөс тон болуп беришин өзү болжоп, өзү ишенип, кошоматчылары көтөрө чала кубатташкан соң. астейдил кубанып кайтты."},{"t":"p","h":"У Абил бий Мадылдын арызын айттырбай көрдү. Мадыл камчыга ууккан. Сары шишик бетине чыгып кетиптир. Көздөрү же жумуп турганы, же тиктеп турганы билинбей, эрди кымтылбай отурат,"},{"t":"p","h":"– Ким? – деп сурады Абил бий."},{"t":"p","h":"Мадыл ызалыгын күрмөп жутуп, буулуп эриндерин кыбыратты:"},{"t":"p","h":"– Домбу..."},{"t":"p","h":"Бул атты укканда Абил бийдин көзү сүзүлө түштү. Домбу хантагасы? Кандайдыр ою эки анжы, томсоруп калды,"},{"t":"p","h":"– Баягы аттын күйүтүнөн... барсам..."},{"t":"p","h":"Мадыл бүк түшүп, бийдин өңүрүнө тооп кылып, сөздүн ордуна буркурап ыйлады. Абил бий акырын акырегинен түртүп, аны өйдө болгузду да, енурун тизесине басынып алды. Бийдин аяр көздөрү кылыйып, тереңден жылтылдап, анын ичи да ошондой алдастап жатты."},{"t":"p","h":"Беш түтүн бечаралардын абалы кимге дайын эмес?! Бири аңчы, бири керегечи, бири кырмачы. Сарыбайын бүркүтү тытып салды. Жакшыларга жандап, булардын талабын талашар ошонусу болучу."},{"t":"p","h":"Абил бий чөк түшкөн бойдон баш көтөрбөй бышактап отурган Мадылды да бир тиктеди, Кан жыттанган айрык боз көйнөктөн тыртайган арык эки ийин дирт-дирт этип турду."},{"t":"p","h":"– Ким бар! – Абил бий тышка үн салды. Босогонун сыртында турган жигит кирип келип колун бооруна алды. Абил бий ичиндеги кымкуут оюна алаксый жигитти бир пас кадалып ойлуу тиктеди да:"},{"t":"p","h":"– Жакын киши жолотпо. Уктуңбу? Өзүң да босогого турбай нары кет... – деди акырын."},{"t":"p","h":"– Куп, бек ага..."},{"t":"p","h":"Абил бийдин кылыйган көздөрү Мадылдын кыржыйган далыларына, канга калдырап каткан боз көйнөккө көчтү. Бирде азаптуу далылар, боз тумандын жылчыгынан чыга калгансып Домбу хантагасынын чычаланын учундай кызыл көздөрү, бирде канга каткан боз көйнөк, бирде кыжырлуу түйүлгөн кесирлүү чеке улам алмашылып, Абил бийдин көз алдында түш болуп ойноду."},{"t":"p","h":"– Кутурган экен «хантагасы» деп койсо... – деди Абил бий, ушуну менен Домбуга болгон кыжырын чыгарды, бир пас отуруп, анан: – Эмне кылайын дейсиң эми, Мадылым?.. – деп, акырын сурап койду."},{"t":"v","l":["– Эмне кыла алам, айланайын эл агасы?!","– Алы жетпеген акыретчи."]},{"t":"p","h":"Мадыл бул эки жактуу жоопко баамы жете бербей, Абил бийди жалт тиктеди. Абил бийдин көздөрү сыр тартып жылтырап, уурту жымыйып турган эле. Мадыл эчтеме биле албады. Абил бий сол колун акырын Мадылдын далысына койду. Шордуу далысына кут конгондой сезип, бүткөн бою жымырап кетти. Ал эреркеп, өксөп жиберди."},{"t":"p","h":"– Кандай кылам..."},{"t":"p","h":"<span class=\"pg\" data-n=\"125\">125<\/span>_ Өчүңдү ал, Мадылым. Бул дүйнөдө алы жетпеген акыретке коюп көңүл сооротот, Ыя, акыретке дейре эмне бар эмне жок, колдон келсе, карыш жылдырбай акынды, өчүңдү ушерде алып калганга не жетсин”?"},{"t":"p","h":"_ Айланайын... айланайын... эл агасы... – деп энтикти, Мадыл жалдырады. – Өчүмдү алып бер, кудай жалгагыр! Кара башым тартуу. Кара мээнетим менен да болсо, жакшылыгыңызды аткарармын! Менден кайтпаса кудайдан кайтар."},{"t":"p","h":"– Өзүн аласын."},{"t":"p","h":"Мадыл таң калып, оозун ачып тиктеп калды. Абил бийдин иреңинде эч өзгөрүү _ ны, мүнүшкөр тууганындын колунан мылтык көргөндөй бол жок эле. дум беле?"},{"t":"p","h":"– Бар... – деди Мадыл шашылып. – Бар. буркуттун кызыгы менен т! жүрүп, Сары акем мылтыгын көп урунган эмес. Жапжаңы бойдон турат!"},{"t":"p","h":"Мылтыкка бий колко салып калды бейм? Ал эле болсо жарасы жеңил. Тура чуркап барып, апкелип беришке даяр болуп, Мадыл делбиреп турду."},{"t":"p","h":"– Мылтык атып көргөнсүңбү?"},{"t":"p","h":"_ Жок. мага пайдасы деле жок! Кенулунузден айлансын бир мылтык! Азыр апкелем, эл агасы!"},{"t":"p","h":"Абил бий кабагын бүркөй тигинин колун кагып тынчтандырып сүйлөдү: К – Чындап ыйласа сокур көздөн жаш чыгат. Атып көрбөсөн, эми атып көрөсүң. Кулак сал. Ошол мылтыкты октоп алып, жолун тосуп жатасын..."},{"t":"p","h":"Мадыл нес боло түштү:"},{"t":"p","h":"– Кимдин?.."},{"t":"p","h":"_ Менден жакшы билесиң, – Абил бий Мадылдын көзүн тиктеди. и Чоочуба. жаман! Бүлөсө майга өтпөгөн кыз талак! Мен сени эркек деп айтып отурам, боорум ачыганынан айтып отурам! Уктунбу, мылтыкты октоп алып, жолун тосуп далдада жатасын..."},{"t":"p","h":"Мадыл шалдырап отурду."},{"t":"p","h":"– Капилеттен мылтык тарс деп. алдындагы беги жалп этип аттан түшүп калса, өлүм кимди коркутпайт, артындагы жигиттери жайылып кк чып берет, алар кайра эсине келгенче изиңди суутуп кетпей ары жан пу... Кулагына кеп кирдиби? Калганын мага кой. Бороон жүрсө да сага тийбейт, Катыныңа да айтпа, эч кимге көрүнбө. Уктуңбу? Калганын мага кой..."},{"t":"p","h":"Мадыл эми түшүндү. сынап жатпасын дегендеи Абил бийдин жүзүн мелтиреп тиктеди. Абил бий анын дилин окуп, акырын башын ийкеп койду."},{"t":"p","h":"_ Ошент. Кайратың болсо, өчүңдү ушул дүйнөдө эле алып кал, Малы лым..."},{"t":"p","h":"Мадыл обдулуп:"},{"t":"p","h":"– Сайдым башымды... – деп. күбүрөп. тура баштады эле, Абил бий колун асте жаңсап кайра отургузуп койду, Абил бийдин кабагы чытылды. Мадылдын оюн окугусу келгендей мелтиреп т й иктеди: р"},{"t":"p","h":"– Сага эн акыры айтарым: данбагарларга жакын жерден тоскондой бол. Уктунбу?"},{"t":"p","h":"<span class=\"pg\" data-n=\"126\">126<\/span>Мадылдын акылы жетпеди, Абил бий томсоруп турган, Жүзүнө эч ырайым жок эле. Мадыл жалтанып кетти, көзүн алакачып жер тиктеп баш ийкеди."},{"t":"p","h":"– Сөз ушул. Данбагарларга жакын жерден гана тос! – деди Абил бий эскертип, Эмне үчүн экенин сен ойлонбо. Сен ойлоно турган иш эмес. Эй, сөз эки болбосун. Сени Домбу өлтүрсө мен кууйм, мен өлтүрсөм ким кууйт? Ушуну билип кой. Жөнө эми."},{"t":"p","h":"– Кайыр... —- Мадыл шашыла таазим кылып чыгып кетти."},{"t":"p","h":"Абил бий бет алдын теше тиктеп былк этпей, бейиттин башына отургузган калмактын буркан ташындай кубарды."},{"t":"p","h":"Мунун баарын Абил бий бечара айылга жан тартып иштеп отурат деп түшүнүп, Мадыл байкуш көңүлүнө канат байланып, төбөсү көккө жетип кетти, Бар болгону эле ушул беле?"},{"t":"p","h":"Амир Музафар Кудаярды тагына кайра отургузганда Абил бий ушу Домбуну кошо ала барган болучу. Кудаяр-хан Абил бийге кошо муну да жылуу жүз менен тосуп, хантагасы атантып, салык жыйноочу амалдары кылып Абил бийге кошкон. Мына, Домбу күн өткөн сайын ташыды, хантагасы деген атагына көптү, Кез-кезде сөзүн этибар албай сыртын салып да кетет, Эрез талашат деген ушул! Бул биринчи түрткү. Домбу элге жек көрүндү. Ал мунусу менен ордону эл көзүнө жеңилтет. Бул экинчи түрткү. Ушундай жагдай үчүн бийдин ордодон алган жашырын жарлыгы бар. Кандай гана болбосун бийликтин оорчулугун жаап, ызгаарын актап кетишке ордо кам көргөн, Бирок, Абил бийге кандай мааниде жарлык берилген болсо, Домбу хантагасына да ошондой эле жарлык берилгени белгилүү. Озунган оодарат. Бул да Абил бийдин эсинде бар. Оодарышар мезгил келип калган сыяктуу. Элдин жону жукарып, арыз айтуулар, нары карап күңкүлдөп сөгүнүүлөр күндөн күнгө көбөйүп баратат. Бу үчүнчү түрткү. Мына ушуларды тегеретип ойлонуп, кыябы көздөн учуп отурган чагында Абил бийге Мадыл өзү келип бербедиби. Ар нерсенин артык баш чуру-чуусу жок бүткөнү жакшы. Буга Мадыл эн сонун жарак болучу."},{"t":"v","l":["Абил бий жеңилдене демин алды.","– Ким бар! – деп, тышты карап алаканын шак-шак койду."]},{"t":"p","h":"Сырттан зайыбы кирди. Каракаш айым байын бир чаргып тиктеп алды да:"},{"t":"p","h":"– Тиги бечара канга жуулуп кайдан жүрөт? Эмнеге келиптир? – деп сурады."},{"t":"p","h":"Абил бий көзүндөгү заарды зайыбынан да жашырып, көзүн сүзө үнүн муңайым чыгарып:"},{"t":"p","h":"– А баягы Домбу кара өзгөй. Булардын жалгыз атын уурдатып алып, тааныса чала өлүк кылдырып сабатып коюптур, – деп койду,"},{"t":"p","h":"– Кой деп коюң да, датка! Четинен сабай береби букараларыңызды... Күлүп койду Абил бий:"},{"t":"v","l":["– Хантагасы эмеспи?!","– Ал хантагасы болсо, Сиз эл агасысыз, Эл Сиздики."]},{"t":"p","h":"Абил бий көзүн кылыйтып жумуп, ичтен тына башын ийкегилеп:"},{"t":"p","h":"– Мындайдын жазасын кудай берет, мындайды кудай узатпайт... – деди акырын."},{"t":"v","l":["<span class=\"pg\" data-n=\"127\">127<\/span>Бул үзүндүдөн кандай тарыхый окуяларга күбө болуп олтурасың?","Бул канчанчы жылдары болгон окуя?","Тарыхтан ошол мезгил жөнүндө эмне билесиң”","Берилген схеманы толукта,"]},{"t":"h3","h":"Чыгарма б/а эмнени"},{"t":"p","h":"билдим."},{"t":"p","h":"&lt; «Сынган кылыч» романлан үзүндү."},{"t":"p","h":"Текстти балдарга топтоп окутуу. Окугандарын анализдеп балдардын ой-пикирин угуу,"},{"t":"p","h":"айым жылуу кан чокуп көнгөн бүркүт чыгы кеткен өлүү жемге"},{"t":"p","h":"кылып, мүнүшкөрдүн үшкүрүгү чыккан же на ачуу шаншып', саңоор? жүндөрүн түктөйтүп ‚ темир канат оозун ачып жалынычтуу кыйкылдап жиберип турду. Жакшы көргөн еы: Е ны карыптай суранып отурганына чыдаи албай Сарыбай мунушкер тескер карай берди. 4 – най эмнени бердим? Бүрсүгүнү эмнени бердим?"},{"t":"p","h":"Ал далысын ункуйтуп*, айласы ырь ко Журу ылар ар акет кылуу керек. Тырмалан"},{"t":"p","h":"тутуп а албай, айылдын усту жагындагы калың арчалуу кадууга чыкты*. Барып өгүнтөн бери үзбөй ар жерге коюп жү не кыл тузактарын карады*. Бири да бузулбаптыр. Сокур чычкан да жоргол"},{"t":"p","h":"оорчулугу кол караган мал тугул” тоодогу да катуу өткөн эле. кыргоол”, чил жер карайганга жетпеди. ы р жагынан кар, суук кысса, бир жагынан ачтык кысты. Турган жеринде, же кан жеринде карга кошо тоңуп, түлкүлөргө, ийри тумшук куштарга бе | болушкан, Кийиктер көздөрүн жайнатып короолорго кирип келишип, К ү адамдардын бычагына урунду, көбү кары жеңил пас тарапка Бэ: и | Мына жер карайды, Көк да чымырады\". Буту жеткен жеринен Сары р да илбээсин жолуктура элек. Жердин куту качтыбы?"},{"t":"v","l":["' ачуу шаңшып – красивая горечь","?саноор – мягкий","3 жүндөрүн түктөйтүп – палымая шерсть","* далысын үңкүйтүп – опустив голову ниже плеч","* арчалуу кадууга чыкты – забрался на арчовый склон горы","* тузактарын каралы – посмотрел на сети","1 түгүл – отриц. не","* кекилик – каменная куропатка","* кыргоол – фазан","\"чымыралы – ожила"]},{"t":"p","h":"<span class=\"pg\" data-n=\"128\">128<\/span>&lt; Автор кышкы суукту кандай сүрөттөдү? Сарыбай жей тургаига бир нерсе табат бекен?"},{"t":"p","h":"Сарыбай темтейип чарчап кечинде үйүнө келди, Эшиктин көзүнөн зайыбы Сүйүмкан ага үмүттүү карап:"},{"t":"p","h":"– Соога, мүнүшкөр, соога, – деп тосуп алды. Эмне демекчи? Кеберсиген эрдин ырсайтып кайгылуу жылмайды."},{"t":"p","h":"Кең үйдүн оң капшытында мойнун кайрып, тумшугун жогдор жүндөрүнүн арасына катып, туурунда үргүлөп отурган бүркүт мүнүшкөрүнүн дабышын сезип, зор канаттарын далдайта сары ооз балапандай жем тилеп кыйкылдап үн салды."},{"t":"p","h":"– Мүнүшкөр, ушуга убал болуп кетти. Эртеден кечке шырп! эткен дабыш? угулса ошол жакка талпынат. Кыйкылдап жем тиленет. Же бере коёрго бир үзүм бирдеме болсочу. Үмүт үзүлгөндө, байкуш жаш балача кыңылдап, канатын түшүрүп шалдырап калат... Ушуну коё берсенчи. мүнүшкөр. Бешенеңде болсо, дагы бир бүркүт табылар, коё берсеңчи ушуну кыйнабай... – деди Сүйүмкан. – Тууран жыртылып кете турган болду өзүңдүн да. жем издеп жүрүп..."},{"t":"v","l":["мы, катын ай, эмне деп отурасын?! арыбай таарынгандай кабагын бүркөп, ого бетер","калды. Коё бер? Не күндөргө туш келип турганы менен,","тунжурап","п","Өз"]},{"t":"p","h":"колунда он түлөткөн, алгыр, сынакы кушу. Өз санынан эт кесип беришке барса барар, кантип коё бере алмакчы? Бул бүркүт тилсиз макулук болсо да Сарыбайга жолдош, үйдөгү бүлөнүн бири катары! Сарыбайды жогу табылгыс санаалар эзди."},{"t":"p","h":"х ез Бүркүткө дагы тамак бериш керек. Эмне үчүн Сарыбай аны бошотуп жи-"},{"t":"p","h":"Сүйүмкан ашканасынын оозунда күйпөңдөп тулубунан талкан алып жатып;"},{"t":"p","h":"= Аштык да бүтүп баратат, – деди кейиштүү, – бир эле биз эмес, төрт үйлүү тууганыңдын баарында эчтеме калбады. Биздин үйдү тиктеп отурушат. Мына, бизде болсо, жетсе жарым айга жетер, тулуптун түбүндө биртике сырмак калды. Жылдагыдай ак мүрөөн болгондо, кичинеден жыт кылып турганда ушу деле жетет эле бышыкчылыкка дейре. Жылдагыдай ак кана?.."},{"t":"p","h":"– Болду! Мынча эмне шишке саясың мени! – деп жарылып кетти Сарыбай. Көпкө дулдуюп отуруп, акыры түтпөй Мадылды чакыртты."},{"t":"p","h":"Салам айтып эшиктен Мадыл кирди. Сарыбай шалдырап отурган калыбында башын ийкеди."},{"t":"p","h":"– Бир тууганым, – деди Сарыбай бир убакта Мадылга, – бүркүттүн жеминин камын мен көрөйүн... – Ал улутунуп алды, – Туугандардын колундагы быдыры жуттан чыкпай калды, Эмне кылабыз, көпкө келген опат. Күн сайын билинип ачарчылык келатат. Уктуңбу? Бүркүттүн жеминин камын мен кылайын. Сен оокаттын камын кылбасаң болор эмес, бир тууганым... -"},{"t":"p","h":"' шырп – подражательное слово"},{"t":"v","l":["? дабыш – звук","5 сынакы – испытанный"]},{"t":"p","h":"<span class=\"pg\" data-n=\"129\">129<\/span>Сарыбай бүркүт кондуруп жүргөн жаргак кол кабын Мадылдын алдына таштады. – Ме, көк өзөн боюна түшүп, ушуну алдына таштап, Тенирберди авама менден салам айт. Бир улоо дан берсин. Жакшы эле, алдашпай алака кылып жүргөн жер эле. Куру кол кайтарбайт. Теңирберди жай билги адам. Түшүнөт жайыбызды. Ушундай деп эле ачык айт: колубуз жер алдында жатып калбас ушул бойдон, таба-тута! кутулабыз де,"},{"t":"v","l":["– Аке, улоонун айласын эмне кылабыз?","Сарыбай күлдү:"]},{"t":"p","h":"– Оболу барчы. Алардын өзүнүн жайы кандай экен? Не болсо да, мейли. Ыдын кайда жүрөт. Ыдынды ээрчитип ал. Бир улоо дан – эки тен дан. Эки тең данды Ыдын экөөңөр көтөрүп алып баса бербей, жаныңар жокпу?"},{"t":"p","h":"Мадыл кол капты алып ордунан турду."},{"t":"v","l":["– Болуптур. Ыдынды таап, камына берейин, аке.","– Ошент, Эртең менен эрте жөнөгүлө. Жолуңар ачылсын...","Мадыл кайырлашып үйдөн чыгып кетти."]},{"t":"p","h":"Сарыбайдын көңүлү биртике ачылгансыды. Ал керегенин башында турган комузун алды. Көптөн бери колуна алалек эле. Комуздун кулактарын акырын терип бурап күүгө келтире баштады. Кылдардан чыккан түрдүү үндү тыңшап, бирин көтөрүп, бирин күңгүрөөгө чейин пастатып, үндөрдүн бирине бири жалганууларын жүрөгү менен угуп, кыял эргүүсүнө берилип кетти. О, ал комузду сүйлөтчү эле. Бу дагы ата өнөрү болгондуктан жашында кызыгып үйрөнүп калган, Бирок, ушунун аркасы менен оокат? кылбагандан кийин, кунт кылчу эмес*. Кээде гана, көңүлү чак кезде, көңүлү өтө чөгүңкү кезде гана колуна алып, бир-эки күү чертип, кайра ордуна илип коёр эле. Өмүрүндө Сарыбайдын көңүлү чөгүңкү* күнү аз болгон, ошондуктан көбүнчө комуз ээсинин көңүлү чак кезинде чертилчү. Кээде жалгыз кызын, бүркүтүн эркелеткиси келип жан терметкен ажайып мукамдуу үндөр менен алардын көңүлүн көтөргүсү келгенде чергилүүчү."},{"t":"p","h":"$ Сарыбай кайсы аспапта ойночу? Ал кандай ойночу экен?"},{"t":"p","h":"Бүркүт күүнү тыңшабай койду, Чоң ийри тумшугун ачып, шаңшып, шабырт чыккан жакка ынтылып, ормоңдоп тынчы кетти. Сарыбай комузун токтотуп, бүркүтүн дал болуп тиктеп отуруп калды. Бүркүт өзүнүн жүнүн өзү чапчып ыргытып, үйдүн ичин шамалга толтуруп зор канаттарын катуу күүлөп, ачуулуу шаңшып, өрмө кайыш боосун? карс-карс чокуп тыткылады. Үзө албасына көзү жетип ичи күйөбү, жогдор жүндөрүн түктөйтүп Сарыбай жакка тап бергиледи."},{"t":"v","l":["Сарыбай эрте турду.","– Менин жолум качса, кер тайгандын жолу качалектир..."]},{"t":"p","h":"Үмүт байлап, зайыбы менен да кайырлашпай, кер тайганды ээрчитип милтелүү“ кара мылтыгын бир ийнине салып төшкө чыгып кетти."},{"t":"p","h":"' таба-тута – здесь: как будет возможность"},{"t":"v","l":["ї оокат – кушанье","› кунт кылчу эмес – не уделял внимание","* чөгүңкү – упаяшее","* өрмө кайыш боосун – плетёнизя верёвка","* милтелүү – обязательный"]},{"t":"p","h":"<span class=\"pg\" data-n=\"130\">130<\/span>Айылдын үстү жагындагы арчалуу кадууга! күндүн нурунан мурда барды. Кыл тузактарын. капкандарын дагы бир сыйра карап чыкты, Дагы эчтеме жок. Эки жолу дүңк? дедире кур дүрмөт? атты. Эчтеме качып чыгып бербели. Чийт-чийт деп кайдадыр чымчыктар учуп жүрүшөт. Бул жаркыраган кең дүйнөнүн куту жалгыз ошолор калгансып С арыбайдын көңүлүн оодурат. Чымчык да болсо колго тийсе кана? Чымчыктар көзгө илешпей, кароолго келбей асманда жүрүшөт."},{"t":"p","h":"Кечинде зайыбы эшиктин көзүнөн:"},{"t":"p","h":"– Соога“, соога!., – деп адаттын сөзүн айтып тосуп алды. – И.,. башай... тыгың томпоёт... – Жүзү жайнап сүйүнүп баштыкка энкейли. – Кудайым"},{"t":"p","h":"Сарыбай ачык эчтеме дей алган жок."},{"t":"v","l":["$ Канлай деп ойлойсунар, Сарыбай кандай айла табат?","Бир аз күн өттү. Сарыбай дагы алдастап жем издөөгө түштү."]},{"t":"p","h":"Жандык? малга байыр болсун үчүн таштан тизе бою гана көтөрүлүп курулган кең короо. Сыртында үйгө жакын таш акыр. Төмөн жагынан билектей булак суу шылдырттап агып жатат. Мына, Кара байдын кыштоосу деп аталган атактуу кыштоо ушул. Эртең ээси көчүп окшогон таштардан башка эчтеме калбайт, ушул жерди киши ээликтеп турарын Сарыбай алыстан тиктеп келатты. Таш короонун четинде жакын-жакын тигилген эки үй турат."},{"t":"p","h":"Сарыбай байдын үйүнө кирип барып, босогого токтой кал ды. Төрдө чепкенин жамынып Кара өз ү жаткан экен. Ашканасынын оозунда нары карап зайыбы\" отурат."},{"t":"p","h":"$ Демек, Сарыбай байдын үйүнө келди. Байдан эмис сурайт, ал жардам берст бекен?"},{"t":"p","h":"– Ассалоом алейкум. Кара аке!"},{"t":"p","h":"Кара өйдө боло, тиши жок кызыл ээгин кыбыратып, саламчынын кодун көңүл кош алып:"},{"t":"v","l":["-Э... Сарыбайсыңбы, – деди, ал ошондо тааныгандай.","Сарыбай тизелеп байдын төмөн жагына отура калды.","– Жайынча эле, Кара аке... – Жанбаштыгын чечти,","Кара байдын жыртак көздөрү баштыктан өтүп кетти:"]},{"t":"p","h":"– Ие,—-деп кубангансыды ал,— кайран мүнүшкөрүм', соога апкелгенсин го, аваңа!"},{"t":"v","l":["– Ошого жакын... – деди Сарыбай да жанданып,","– О, катын! Кайдасың!","","' кадууга – на склон горы","* дүңк – подражание резкому олнократному","' дүрмөт – заряд","* соога – поларок из военной или охотничьей лобычи","* жандык – жипос сушество","* зайыбы – женщина","`мунушкерум – сокольник"]},{"t":"p","h":"<span class=\"pg\" data-n=\"131\">131<\/span>сур зайып ашканасынан чурушкен чеке син керсетту."},{"t":"p","h":"мүнүшкөрүм өзү апкелип калыптыр. Ушундайда бирге даам сызбасак оокатыны! Соога дегенди ууга кошо чыгып ачу эле, у &amp; Түнөрө түштү кара сур зайыптын кабагы. Эринен гана су албай? Бол тез... ашканасында көпкө күймөнүп жатып, акыры эки жилик сур эт. булоолуу сорпо алый ч кан эттин ыы сезген, тыштан шабырт чыкканда беките салган окшойт. ыкты. Эшиктен – н Ала бериниз, бай... – Ал дити барбай сүрдөн бир үзүп ооз тийди айдын денеси жыйрыла калды. да, дасторконго колунун учун сүртүп алып, баштыгынан тартуусун сууруп байдын алдына койду. – Бай, бергиңиз келсе, улак да болсо ыраазы суа алып кетем, көзүмдөн кан чыгып турган чак, ушу арзыбаган немеге сү байым бирдеме кайрылабы деп келгеним. Көр: эрдин бекем кымтынып онтолоп жиберди, бирок көздөрү тиги башы кошо катырылган көк чаар! илбирстин терисинен айланып кете = бады. Сарыбай леп тура калып, теринин башынан кармап жүндөрүн сыл сылап, акырын – Байым, кен аны бер, муну бер деш салтта жок иш эле... тели, кун ошондой болуп турат. Турмуш ошенткизий отурат. Жут жалгы менин башымдабы?.,"},{"t":"p","h":"Кара бай токтоло калып, ыкшалып, кайра онтолоду:"},{"t":"p","h":"– О, мунушкерум... Баатыр мактанса бир октук, бай мактанса бир ч жуттук экен! Байың баягыдайбы, баягыдай болсо Баягыдай жуз жылкы алдыбызда кутуреп турса кана! Устуне т астына ат тартсам эп эле..."},{"t":"p","h":"Сарыбайдын шагы сынып, кулактарынан бери кызарып кит з – Өзүң көрүп турасын... Көрүп турасың, мүнүшкөрүм... нч гана туяк калды... – Кара колу менен чекесин басып бүк түшүп, күйүтү шыбырады: – Карачы... Карачы, жүз жылкыдан... Жүз жылкыдан... Ушул т —- Мейли, мейли... Кара аке... Кудай салганга арга барбы! Мейли, е калды го... О, кудай ушул кунду керсеттун! й кейибеңиз... Сөзүмдү кайра алдым. Эчтеме сурабайм, жөн эле"},{"t":"p","h":"Сарыбай ушундай кишиден бирдеме үмүт кылып келгенине өзү уя лып, шылдың болуп}, эки этегин далдактатып эски бейиттей коркунучтуу"},{"t":"p","h":"жураган‘ үйлөрдөн алыстап кеткиче шашты..."},{"t":"p","h":"учпайт. Өтөк көк чалгын. Бийиктер дагы агала кар. Тоолор кандайдыр уйкулуу сыяктуу боз тартып, ач тыры ум дык али жарала элек сыяктуу, шуу-шуу өткөн жолбун желдин шоокуму нарыкка төнүп жатты. Жымжырт. Бул жаркыраган кен дүйнөгө тир фен башка эч дабыш”? жок, кулак кескендей жымжырт."},{"t":"v","l":["' чаар – пёстрый","1 үшкүрдү – вздохнул","У шылдый болуп – был осмеян","* тунжураган – безмолвный","* жымжырт – абсолютно тихо","* чымчык – птица","* дабыш – звук"]},{"t":"p","h":"<span class=\"pg\" data-n=\"132\">132<\/span>Бүркүт оор. Сарыбайдын ийнин талдырып, кабыргасын майыштырды. Бир ийнинен бир ийнине өткөрөт, Б н күч – ректерин кабыштырат."},{"t":"p","h":"Сарыбай кадуулап көп Алдынан эчтеме чыкпады, эчтеме учпады. Өжөрлөнүп кыдырды!. Эчтеменин шабырты угулбады. Көл-шал"},{"t":"p","h":"Айла куруганла, бир белеске токтоп, нары беке эңкейип, сепкил чоң кара ташка б эриндери кеберсип шалдырап"},{"t":"p","h":"Сарыбай чапанын чечип алдына салып бирпас жамбаштап жатты. Кайра турду. Бүткөн бою ныксырады, Көйнөгүн чечти."},{"t":"p","h":"Бир убакта шарпылдап жулкунуп, чеңгелине эмне кирсе ошону мы-"},{"t":"p","h":"кете баштады, Кайдадыр эркин жайга, аркыраган шамал менен жарышып үлбүрөп чубалган булуттардын үстүнөн сызгысы келгендей,"},{"t":"p","h":"– Шабырт алды окшойт..."},{"t":"p","h":"Сарыбай бүркүттүн томогосун сыйрыды. Бүркүт дароо колдон суурулуп, заматка көккө атылып чыкты. Бере көр! Сарыбайдын жүрөгү дүкүлдөп кетти. Бере көр, чоң кудай! Бере көр, кең кудай! Сарыбай эки көзүн жүлжүйтүп, кубанып көк тиктеп, кайсандап ар тарабын каранып, кайсыл жерден кандай аң качып чыгып калар экен деп, дөгдөп жүзү жаркырады."},{"t":"p","h":"Ошол бойдон, ошол кеткен бойдон бүркүттүн карааны көрүнбөй калды. Мүнүшкөр жалбырак болуп дирилдеп күттү. Жок... Жел гана шыбактардын башын шыбыраштырып жатты. Эч дареги жок... Кеткени ушубу! Сарыбайдын ичи сыйрыла баштады."},{"t":"p","h":"– О, кырааным...? Кетип калдыңбы..."},{"t":"p","h":"Сарыбайдын көздөрү жашылданып боз асманга телмирди, эч көтөрө албай турган, эч көнө албай турган сары убайым басты. Оозун кымтышты унутуп, кичинекей сакалын сербейтип, нары-бери алдастап кетти. Боз асман анын жүрөгүн байкатпай лук жутуп коюп, анан өзүн мисирейип карап тургандай болду. Сарыбайдын ичи тытылды."},{"t":"p","h":"– О. кырааным... Мени таштап кеттинби... Мен куруюн, мен бир жазгы каатчылыктан сени алып чыга албадым... О, кырааным..."},{"t":"p","h":"Сарыбай баштагыдай ундеп чакыра албады. Антууге укугу жоктой сезилди. Тили курмелбеду. Айласыз. кубатсыз мууну титирели."},{"t":"p","h":"– О, кырааным... Балам менен барабар көрчү элем... О..."},{"t":"p","h":"$ ӨүйКүт кайрылып келсеби? Же ошол бойдон учуп кетеби? Ал учуп кетсе Сарыбай ы"},{"t":"p","h":"Ана! Алда кайдан бүркүт шаншыды?. Ана! Сарыбайдын жүрөгү жарылып кете жаздады. Ана! Илбээсин көргөндө гана ушундай шаншычу ал."},{"t":"p","h":"' өжөрлөнүп кылырды – упрямо бродил"},{"t":"v","l":["* кырааным – хваткий беркут","›шаншыды – клекотал"]},{"t":"p","h":"<span class=\"pg\" data-n=\"133\">133<\/span>Сарыбай токтоно албай көйнөгүн унутуп, жыланач дардаңдап чуркады. Үндү улап чуркады."},{"t":"p","h":"– О, айланайын үнүңдөн... Айланайын... – деп. Каргылданып, эки колун ового сунуп кайкырды. Ошол! Төбө жактан абаны жарып шуулдап угулган куу гана улам жакындап келатты. Ошол! Сарыбай элтеңдеп, сүйүнгөнүнөн каңырыгы түтөп, кудайга да, бүркүтүнө да жалынды. Сарыбай эки жагын каранды. Эмне үчүндүр ал жопарада шакка корголоп же суналып качып жөнөп берген аң көрүнбөйт. Ана! Бүркүт! Күчтүү канаттарынын күүсү желдин шоокумун каптап, найзанын! учундай ышкырып тик сайылып өзүнө келатты. Сарыбай нестейе түштү... Ойлонтпой, камынтпай бүркүт аркан бою кирип келди, ошондо Сарыбайдын колу жерден балдакты ала коюп, бетине кармай берди. Каардуу бүркүт тайманбай көз ирмемде селдей шаркыраган күч менен келип бир тээп өттү, жыгач балдак шарт тен бөлүнүп сынып түштү."},{"t":"p","h":"– А-ай! Кантесиң, кырааным!.."},{"t":"p","h":"Ошол чөлкөмдү? үч айланып чабыт кылып, көзүнө тири жандуудан эчтеме илинбей, дөңдө кыбырап жүргөн жалгыз караан өзүнө тартып, ач бүркүт ал караанга таштап жиберген эле. Ал мүнүшкөрүн тааныган жок. Жылаңач Сарыбай анын көзүнө кийиктин улагы сыяктанып көрүнгөн окшоду,"},{"t":"p","h":"Бүркүт кайра көккө атылып чыкты). Сарыбай эсин жыйышка үлгүрө албады, бүркүт темир чеңгелдерин арбайтып, курч тумшугун ачып, чекирейген кызыл тегерек көздөрүнөн заар чачып, ошол замат кайра шуулдап кирип келди, Өлүм! Колунда куралы жок адам сепкилдүү* кайра качты... Өлүм! Алдастады... Өлүм! Ушул өлүм коркунучунун алдында көзүнө канга боёлуп кулактарын шалпайтын жерде жаткан тайгандын башы көрүндү, анын нуру өчкөн көздөрү кадалып тиктегендей. Табалагандай*. Келме кезек!"},{"t":"p","h":"А-а!.. Жер тыткылап, таш аткылай баштады. Колуна эмне кирсе ошону менен, топурак, чөп кирсе чөп менен шилтеп, ошону менен өлүмдөн коргонду, өлүмгө айбат кылды. А-а-а! Жандалбас кылды. А-а-а-а... $ Кандай деп ойлойсуңар! Бүркүт ээсин тааныйбы?"},{"t":"p","h":"Коркунчаак°, тартынчаак” кылган жашоо үмүтү, Жашоодон үмүт үзүлгөндө адам коркунучту унутат. Сарыбай коркунучту унутуп салды. Ач бакырыгы да тып токтоп, эрдин кесе тиштенип, кадим жырткыч болуп, кулачтап качырып бүркүттүн арбайган тырмагына кол салып кирди. Сарыбай бүркүттүн башын кармоого, мойнунан бурап басууга аракет кылып, бүркүт башын алакачып карматпай, көзгө асылып, желке жүнүн түктөйтүп жаал-"},{"t":"p","h":"' найзанын – копья"},{"t":"v","l":["1 чөлкөмдү – место","* көккө атылып чыкты – излетел на небо","+ сепкилдүү – веснушчатый","* табалагандай – как-будто злоралствовал","* коркунчаак – трусливый","тартынчаак – стеснительный"]},{"t":"p","h":"<span class=\"pg\" data-n=\"134\">134<\/span>данып чокуп!, Сарыбайдын бүт денесинен кан жошулуп бүркүттүн канаттары карсылдап сынып, куйругу жулунуп, жүндөрү сапырылды. Сарыбайдын эки колу буркутгун темир чеңгелдерин бошотпой туткактап калган. Тизеге басуунун аракетинде. Бүркүт көзгө асылат. Сарыбай башын чулгуп көздөрүн алакачат. Бүркүт мойнун жыландай буралтып көздү кууйт. Сарыбай курч тумшукка башын тосо берип көзүн калкалайт. Жан аргасы! Ал дагы бүркүттүн кез келген жерин тиштеп, бурдап тиштеп жатты."},{"t":"p","h":"Сарыбайдын көздөрүнөн от чагылды. Сарыбай көздөрүн бек жуумп, бүткүл күчүн үрөп, чымырканып кармашты. Ал акыры бүркүттүн бир чеңгелин тизеге басып, бир колун бошотууга жетти да, ошол колу менен бүркүттүн мойнун сыйпалап таап, бар күчү менен сыга кармады. Бурады. Бүткүл денеси менен өбөктөп басты."},{"t":"p","h":"&lt; Бул күрөштө ким жеңет деп ойлойсуңар? Окуя кандай уланат?"},{"t":"p","h":"Бир убакта канга жошулуп, Сарыбай бүркүттүн калдайып жатып калган денесинин үстүнөн акырын өйдө болду. Ал көзүн ачкысы келди. Көзү ачылбады, Көзүн сыйпалады. Колуна балжыраган бирдеме урунду. Ал кан болучу. Сарыбай да анын кан экенин билди. Капкараңгы. Көрдөй капкараңгы. Эмелеки жаркыраган кең дүйнө кана? Чымырап кансырап денеси улам оор тартып баратты. Ал эсине эми келди. Баягыдай коркунчаак, тартынчаак, үмүткө алданма, кайгыга, кубанычка бат алдырма пенде учуруна кайра келди. О, теңир, көздөн ажыраттынбы! Ал сендиректеп, чалыштап бүркүттүн карайып жаткан канаттарынын жанына сулап жыгылды..."},{"t":"p","h":"1. Чыгарманын башкы идеясы эмнеде?"},{"t":"v","l":["2. Сарыбайдын образы кандай?","3. Ал ким болгон?","4. Сарыбайдын бүркүткө жасаган мамилеси кандай?","5. Автор жаратылышты кандай суреттойт,","6. Байдын образы (Салыштыргыла).","$ Жалпы тапшырма.","Оюн. Өзүңөрдү текшергиле!"]},{"t":"p","h":"Бул жерде силер билген чыгармаларынан алынган каармандардын аттарын өз ара бөлгүлө, Схеманы толтургула."},{"t":"p","h":"Ак Мөөр, Сарыбай, Каныбек, Сейит. Учей-Фу, Ажар, Максүт, Данияр, Саадат, Ыманбай, Сапарбай, Кузнецов, Чынар, Жапар, Зулайка, Түлкүбек."},{"t":"h3","h":"Чыгарманын аты"},{"t":"p","h":"' түктөйтүп жаалданып чокун – озлобленно клевал"},{"t":"h3","h":"<span class=\"pg\" data-n=\"135\">135<\/span>Билип алгыла!"},{"t":"p","h":"Төлөгөн Касымбеков – прозаик. Кыргыз эл жазуучусу (1956), КМУнун филология факультетин бүткөн (1957)."},{"t":"p","h":"Редакцияда кызматкер (1957-1960), «Ала-Тоо» журналында бөлүм башчы, жооптуу катчы (1960-1966), баш редактор (1966—1971) болуп иштеген. Кийин басма жаатында, Жазуучулар союзунда, автордук укук коргоодо, жооптуу кызматтарда эмгектенген. Республиканын Жогорку Советине депутаттыкка шайланган."},{"t":"p","h":"«Жылкычынын уулу» (1956), «Туулган жер» (1958), «Адам болгум келет» (1960) аңгеме-повесть жыйнактарында жазуучунун таланты байкалган. Т. Касымбековдун этаптуу чыгармасы – «Сынган кылыч» (1966, 1971) тарыхый романы. Романдын биринчи бөлүмүндө 19-кылымдагы Кокон кандыгынын ордо турмушу, элдин азап-тозоктуу абалы, экинчи бөлүмүндө тоолуктардын бийликтегилер менен таймашы, акыры кыргыздардын Орусия карамагына өтүшү баяндалат."},{"t":"p","h":"«Келкел» романы (1986) тематикалык, идеялык-көркөмдүк жагынан «Сынган кылычка» өзөктөш, б, а. ал кыргыз элинин 19-кылымдын экинчи жарымы менен 20-кылымдын башындагы социалдык-экономикалык абалын, кыргыз жергесинде Совет бийлигинин орношун көркөм чагылдырат."},{"t":"p","h":"Бул романдар тарыхый окуяларды көркөм полотнодо жолдуу чагылдырып, белгилүү инсандардын образдарын психологиялык жактан терең көрсөткөндүгү менен жогорку идеялык-эстетикалык бийиктикте турат."},{"t":"p","h":"Кыргыз эли саясий эгемендүүлүк алгандан кийин, «Сынган кылыч» романы мезгил талабына ылайык кайрадан иштелип чыкты: структуралык өзгөрүүлөргө дуушар болду; жаңы образдар кирди; белгилүү образдар, окуялар толукталды; айрым маалыматтар алынып ташталды (1998)."},{"t":"p","h":"Түндүк Кыргызстандын Орус империясынын оторчул саясатына кириптер болуп айласыз анын карамагына өтүшү «Баскын» (2000) романынын лейтмотивин түзөт,"},{"t":"v","l":["г азап-тозоктуу абалы – трудное время","таймашы – напряжение сил","өзөктөш – близкие по духу","көркөм чагылдырат – хуложествеино отражён","дуушар болду – повстречавшийся"]},{"t":"h3","h":"АДАБИЯТ ТЕОРИЯСЫНАН"},{"t":"p","h":"Баллада (франц. – бийлөө деген мааниде) – Европанын орто кылым адабиятындагы лирикалык жанр, Ал сентименталдык жана романтикалык поэзиянын негизги түрлөрүнө кирип, укмуштуу окуяларды баяндаган сюжеттүү ырлар болгон, Ошондой эле баллада тарыхый окуяларды, фантастикалык сырдуу жоруктарды да чагылдырган, Кеңеш доорундагы баллада советтик адамдардын эрдиги, баатырдыгы ырдалган. Мисалы. А. Токомбаевдин «28 баатыр» аттуу чыгармасында жоокерлер даназаланат."},{"t":"v","l":["<span class=\"pg\" data-n=\"136\">136<\/span>Турар Кожомбердиев","(1941-1989)","","Акын Турар Кожомбердиев 1941-","жылы Калинин районунда, Сары-Булак","айылында жылкычынын үй-бүлөсүндө","туулган. Ал 1959-жылы № 5 кыргыз"]},{"t":"img","src":"data:image/webp;base64,UklGRvQUAABXRUJQVlA4IOgUAABQ+gCdASqlAR8CPrVOn0sytLQqK9uKupAWiWluZY9j4oAON4FTmf7HZn6s5XvR8SLs3rw/unqCcam0oUebWdd49LrxWD//b0j/Df/Xyl/C/8nK3f/5f+zNRGqxx3/lSWISFaw7Ea4bS+IwsRASZvtBmDPaA1acOYXcuOLFxF6AUQTb5e0LXHwzIJJOjbfF3S5kAPS4BaymtCsQZDgLTrrA9+0cq5eKJ6cNJTcweUiKjX6xdjkVtOCkU9EL6jmbRTOshcKgfX1Jtl2sosBZM32mIH4c8EoPCL6NHPoFWK53GrK3rg2H0LlJJid6zAP4+F7RnVWIO2wj9fmd9IlwpabCJjTZB0NFbxq2g9IGxD266jR/JC4WI+c1Hx3VzbyFvP23uaT1PrbzApNV8I1hXP+zcBKwo28mITB5nAggKEaIoR2+Oss1xwkz5gHRYUXb+cyKOEjHpZ98E0RwQqVxnmiagaelAnA1C1eMcTRLGn51fR+WkOb3BWG6pqfNMo1y3oIftKF+B2yvxJQktyaa32t1UlBFfcYYxGlW4bhFlSBLOANBeyXnbzd5yOGrcMu2G9yAosfQrmP5gSil8MHMoxixK6hqdyBgFZ3n30L01kB6ItMqIcfs1ZMY/4C1AtRZvH+ojHLxdROPyzIfJ59xkTxK8g5s76mRHongMgJFk3BTfqotf33Q8PIgblHVaxF9VZkvCsgXwCM5hitx38JV8IrIPVqzh/xCNVq10H/iKqX0jBoFAMOc45/aZN8tUWlrklockRqwO9D+Mt7p8s/R/MQT32mJQ4ta8+cnx7w79G2tHyiQa+KKzCna0S6L/YrswQw/EF8Ns2hLIlsg0ECD5ipi73zYUPynow2NEFqdhUoKNmNN/RpnlqhN2XhX+9MMhxlEhocO7clyieB4PRKJtK7WOUsHhaHopVNpbc47HJuWBEnapUX2gSBLfbfnWabareXIoYiVyS34B60mQtauY9ZDUE75Wq4CKz/RnwVmpj5GOjTxME6M15lplfx5DgaBcYAn0Di9WX0BgNn2/X0VYkoxGBolIDPzi/1AaR86Js1uVedMkw/4j1CAAQkDq7+YtTKLTZXXjQcmM0NDBBNuEOhyb85RCsW7ydjfzN7GImj+d2856JQvdCHxRd4M0gPFr+Hey66ujkPkGZk/xauo93yTXOBDnrxqqgpJXaTtGVmytgcLNO+bPrPINXERe/yz4lqA8YrTHmLMmQmzwCvmvLttPOMOeMTnLBx5OajKweudRgjpD4QBn2QTD/eBdJYJscUL7Jkb2scrYvIEnL6hn+HHeEIATG6akDgPK1xkUuPEJe2fJ+yx7CfRQGOs9HV2gtr6/RMi+x6g9BNoZ/lmIKHZOy6kA72BV52/5UIureqx3KsHlmOtXq157Iaip22XIHfQRXyIqrm1NWmGTM2DR33q+f+65mxAJRYdxlbRPnI6B/T5QI8IVgCldRt5VbcNJmJP6VoApOn4iBNK/CxYE3YwWUT443HMzqoKaDghyiZ5WoQ6KS2iAoymYPTJY7BpUPX6PLeYxhsbcYJdXN4CzSj21hWl0RwYoV4cTK2LqXL17cOPxnuZuml/BD үнөсүн?","4. Акындын сүйүүсү аныкпы? Аны автордун кандай сөздөрү менен аныктайсын?","5. Сенин оюнча, сүйгөнү келеби же келбей калабы? (Келет, эмне үчүн?, келбейт)."]},{"t":"h3","h":"АДАБИЯТ ТЕОРИЯСЫНАН"},{"t":"p","h":"Трагедия (гр. – «эчки ыры» деген сөздөн) – |. Драмалык чыгарманын бир түрү, аягы негизги каарманынын өлүмү же кайгы-капасы менен бүтүүчү чыгарма. Түпкү келип чыгышы байыркы Греция искусствосуна байланыштуу. Алар шараптын кудайы делген Дионистин урматына эчкилерди сүзүштүрүп, тамашалар өткөрүшкөн, мына ошол тамашалар трагедия деп аталган. Б. з. ч, 10-кылымда байыркы гректерде трагедия өзүнүн гүлдөө доорун башынан өткөрүп, Эсхил, Сокфол жана Еврипид өңдүү улуу сөз чеберлерин калтырды. Аристотель болсо ошол кездеги трагедияларжаз <span class=\"pg\" data-n=\"141\">141<\/span>лий Цезарь», «Король Лир», «Ромео менен ны бүгүнкү күнгө чейин кызыгуу менен окулуп, сахналарда Жульетта» деген классика- Е эле искусстводогу эркиндик менен эрксиздиктин, ади т. леттүүлүк менен кара өзгөйлүктүн, сулуулук менен бенден ок ж тосундагы күрөштүн келип чыгышы, сырткы көрүнүштө эрк тин, адилеттүүлүктүн, сулуулуктун жеңилиши менен көрүүчүнүн, окурмандын психология у сын тазартуучу эстетикал ин зап да, натыйжада, ал өлөт, же женилет, бирок мына ушул к башка кишилерди тазалыкка, ак ниеттүүлүккө, күрөшүүгө ү ‚ Трагедияда каарман чыгып кетүүгө мүмкүн Ч. Айтматовдун «Ак кеме» повестиндеги баланын Ё жеңилиши миллиондогон окурмандардын сезиминде кара өзгөйлүккө каршы күрөшүү сезимин пайда кылат."}],"sub":[{"title":"Суйунбай Эралиевдин ырлары менен таанышып ал! Токой вальсы","b":14},{"title":"Иңир","b":16},{"title":"Ак Мөөр","b":18},{"title":"Суу боюнда","b":20},{"title":"Көлдөгү ак куулар","b":24},{"title":"«Сынган кылыч» романы женунде","b":61},{"title":"Ш Сынган кылыч","b":84},{"title":"Чыгарма б/а эмнени","b":156},{"title":"Чыгарманын аты","b":250},{"title":"Ала-Тоо","b":270},{"title":"«Эне жүрөгү» поэмасы","b":272},{"title":"Схеманы толукта: Эне канлай?","b":278},{"title":"Күн чы

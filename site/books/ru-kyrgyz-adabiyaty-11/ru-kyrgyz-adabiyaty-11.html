гонот. Котормо иштерин студент кезинде эле баштайт. 1952-жылдан тартып, Ч. Айтматов өзүнүн оригиналдуу чыгармаларын жаратып, жарыялайт."},{"t":"p","h":"Жазуучу эмнеден башталат? Бул суроого бир ооз сөз менен жооп берүү мүмкүн эмес. Бирок кыскача айтканда, жазуучулуктун башталышы (албетте, таланттан тышкары) анын жеке тагдыры менен белгиленет. Жеке тагдыры болбогон бир дагы чоң жазуучу кездешпейт. Жеке тагдыр дегенибиз – бул жөн эле бир адамдын анчейин басып өткөн жолу, өткөргөн окуялары, кадыресе жашаган турмушу эмес, Сөз бул жерде жекече адамдын аң-сезимдүү түрдө өзүнүн өмүр-тагдырын коомдун, элдин жашоо-турмушу менен, өз доорунун, өз мезгилинин эң курч маселелери менен шайкеш, эриш-аркак келтире алышы жөнүндө жатат."},{"t":"p","h":"Элүүнчү жылдардын эң акыркы мезгилинен тартып, кыргыз ада иятынын дүйнө жүзүнө салтанаттуу жүрүшү башталды. Бир кездеги кыргыз акынынын «жортуп чыгып сары аскалуу белдерден, жайыт таап Европаны баспадык» дегени аша чапкан романтика болуп сезилсе, эми аша чапкан жупунулук, ийменчээктик сыяктуу болуп көрүнүп калды. Биз, албетте, Ч. Айтматовдун чыгармачылыгын айтып жатабыз. Ал чыгармачылыгын баштагандан бери кырк жылдын жүзү болду. Ал жөнүндө сансыз макалалар, монографиялар, диссертациялар, китептер жазылды. Азыр Ч. Айтматовдун чыгармалары жөнүндө жаңылык айтуу кыйын. Ошентсе да, кеп болуп жаткан маселеге тикеден-тике тиешеси бар, 1968-жылы жазылган «Чыңгыз Айтматовдун чыгармалары кенгуру өлкөсүндө» аттуу макаладан үзүндү келтире кетсек ашыкча болбойт."},{"t":"p","h":"Чынгыз Айтматовдун чыгармалары дагы бир мамлекетте басылып чыкты, же жазуучу жөнүндө дагы бир эмгек жазылды дегенге капкачан бышы кулак болуп калгансыдык. Анын чыгармалары немец тилине толук бойдон которулуп, жалгыз гана Германияда үч жерде – Берлинде, Майндагы Франкфуртта, Лейпцигде, ошондои эле Чехословакияда – Прагада, <span class=\"pg\" data-n=\"78\">78<\/span>Братиславада, түрк тилинде Стамбулда, япон тилинде Токиодо басылып чыкты,"},{"t":"p","h":"Ырасында да ошондой. Түштүк Вьетнамдан жана Африкадан, Кубадан жана Мексикадан келген каттарда адабияттын ышкыбоздору автор менен өздөрүнүн ой-санааларын, көңүл сырларын бөлүштүрөт. Демек, бул – чыгарма алардын сезимдеринин тереңине жетти деген сөз."},{"t":"p","h":"«Иностранная литература» журналында «бардык тилдерде» деген рубрикасынын алдында кургак иштиктүү информация берилген:"},{"t":"p","h":"Стокгольмдогу «Интернациональ ревью» басмасынан Ч. Айтматовдун «Тоолор жана талаалар баяны» деген китеби чыкты."},{"t":"p","h":"Дагы бир нече абзацтан кийин:"},{"t":"p","h":"Австралиялык «Нью-Уорлд букселлерс» басмасынан «Кыска повесттер» деген ат менен Ч. Айтматовдун чыгармаларынын жыйнагы чыкты. Сиднейден чыгуучу «Трибюн» газетасы жыйнакка кеңири рецензия жарыялаган; рецензиянын автору советтик жазуучунун чеберчилигине жогору баа берген,"},{"t":"p","h":"Ошондон берки отуз жылдын ичинде Ч. Айтматовдун чыгармачылык кампасы «Ак кеме», «Деңиз бойлоп жүгүргөн Ала дөбөт» аттуу повесттер, «Кылым карытар бир күн», «Кыямат», «Кассандранын тамгасы» сыяктуу салмактуу романдар менен байып, жакынкы жана алыскы чет элдик тилдерге которулуп, дүйнө жүзүндөгү окурмандардын жогорку баасын алды."},{"t":"p","h":"Бул фактылар бир кезде кыргыздын акыны өз калемдештеринин алдына койгон «калам – тулпар биз минип, жар салалы Европага шам кармап» деген тилеги, «максимум программасы» ашыгы менен ишке ашканын дагы бир жолу күбөлөйт."},{"t":"p","h":"Адабият чыгармасынын өз эли жана улутунун чөйрөсү менен чектелбей, башка элдер, өлкөлөр жана мамлекеттер, ал гана эмес башка материктердин окурмандарынын арасында белгилүү болушу – бул чыгарма өзүнүн эли-журтунун маданий казынасына эле эмес, ошол башка элдердин маданий казынасына да киргендиги. Ар кандай жазуучу өз замандаштарынын арасында гана кеңири белгилүү болуп, кадыр-баркка жетишүүгө эмес, ошону менен бирге келечек муундарга атын калтырып, алардын колдоосуна ээ болууга умтулуп келген. А. С, Пушкин өзүнүн «Мен өзүмө эстелик курдум кебелбес» деген кеңири белгилүү ырында мындай саптарды жазат:"},{"t":"p","h":"Мен өзүмө эстелик курдум ырларыман,"},{"t":"v","l":["Элдер каттап эч жолуна чөп өспөйт,","Билсең бийик Александр мунарынан,","Кол жетпейт да, солк этпейт.","Сөөгүм сөпөт, эгим упат болор, мен анда,","Бу дүнүйө түптүз болуп кеткиче,","Жашайм жүрөк кылын черткен лирам да,","Акыркы акын өткүчө.","Атагымды даршаан кылып угат улуу Русь,","Аздектеп ар бир тилде атаар аны.","М. Борбугулов","кесип – род занятий, профессия","сөөмөйлөп – если сказать пересчитывая по пальцам","эриш-аркак – п мире"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"79\">79<\/span>«Жамийла» повести"},{"t":"p","h":"Ч. Айтматов «Жамийла» повестинде кыргыз чындыгынын терең социалдык катмарларын көркөм изилдөөнү. турмуштук ес Гар тараптан кеңири камтып, көп пландуу панорама жатуусу."},{"t":"v","l":["өзүнүн оюн бир чекитке, бир борборго топтоду. Бул – с” 5","Кыргыз кызы Жамийланын сүйүүсү жөнүндөгү чеч эрш"]},{"t":"p","h":"Луи Арагон сүйүү жөнүндөгү «дүйнөдөгү эң сонун баян» де а: жы"},{"t":"p","h":"«Жамийла» повести сүйүү жөнүндөгү дүйнөлүк эн ониик рк ө үлгүлөрдүн катарында менчиктүү! ордун алганын реалдуу турму"},{"t":"p","h":"өзүнүн «Жамийла» повести менен улуттук эл искусствосуна күтүлбөгөн, ойго келбеген ачылышты алып чындыкка, улуттук турмушка, салт-санаага” карата болгон жаң 2 р = азыркы адамдын, азыркы инсандын ички жан дүйнөсүн ачып е өтүү за мамилени, жаны дуйнелук кез караштын негизинде кыргыз жа уу усу жетишти. Маселен, Пушкиндин Татьянасы орус райис й дун Жамийласы дал кыргыз жергесинде, ре | са дал. уй зә жүрүш-турушу, кыял-жоругу? менен дүйнөгө келмек. о ерде, ы согуштун оор жылдарында жен эле эрин таштап, башка бирөө дырып, кимди толкундатып, ушунчалык кадыр-барк тапмак узе чан баары, сүйүү проблемасы анчейин карандаи сүйүү ган жеңил баа аялдын тагдырын сүрөттөгөн болсо, анда ал кимд Ашый окуянын енугуп-ерчушунде автор адам жөнүндөгү чоң чынд чындыкты айтып жатканында, кыргыз аялынын улуттук көркөм с у уу. жан дүйнөсүн көрсөтүп жатканынд; НЫ мурда, элдин башынан өлчөмсүз, трагедия өтүп жаткан кан й а. 3 дуу согуштун оор учуру. Жамийланын күйөөсү фронтто. реа ыы чаза мийланы эрегишип «ала качып» алган болсун, мейли ал чече күй көңүл бөлбөй, кайдыгер* мамиле жасасын, баары бир мыйзамду Дал ушул кырдаал Жамийланын абалын ого бетер азыр эл четинде, жоо бетинде. Муну менен эсептешпей кукы ч бейт ички дүйнөсүндөгү драматизмди күчөтөт. Мына онд на ү к талып, дароо эле чечилип калган жок. Ч. Айтматов накта ре изилдөөчүлөр айткандай, Жамийланын сүйүүсү «бир көрг эне ку А шн никтин салтына ылайык” Жамийланын башына түшкөн бул оор еме өтө этияттык жана сабырдуулук* менен психологиялык талдоодон ик Е Бул окуя чыны менен Жамийланын адамдык, аялдык затына туур: катуу сыноо."},{"t":"v","l":["' менчиктүү – собственный","? салт-санаага – помыслы, внимание","› кыял-жоругу – характер","4 кадыр-барк – иснность","* кайдыгер – равнолушный","* мыйзамдуу – законный","ылайык – соответствующий, подходящий","* сабырдуулук – терпеливость, слержанность, выдержка"]},{"t":"p","h":"<span class=\"pg\" data-n=\"80\">80<\/span>Жамийла жөнүндө айтканда, Даниярды кошо ала жүрүү керек. Анткени булардын биринен бирин ажыратып, бөлүп таштап түшүнүү мүмкүн эмес. Жамийланын өткөн турмушу, өз «тарыхы» бар сыяктуу. Даниярдын да жекече өмүр-таржымалы! бар. Көрсө, ал өзү ушул жерлик, бирок башка жакта жүрүп, согуштан жарадар болуп, өз айлына кайтып келген. Канткен менен жатыркап, чоочун. Мындайча айтканда, бул дагы өз жайын таппаган, тагдырынын «куугунтугунда» жүргөн киши. Башы эле бош дебесе, Жамийланын экинчи бир түрү. Мына ошол тагдырлаш адамдар кайчылаш жолдордо?, чоң сыноонун алдында кездешип калышты. Кездешкенде да согуштун эң бир оор жылдарында. Чынында, бардыгы Жамийланын «тамашасынан» башталды. Ал турмак «сөз кайрыбай» баарын көтөргөн Даниярды (балким, бул «тамаша» ага жагып жаткандыр) Сейит сезип, аяп да кетти:"},{"t":"p","h":"«_ Жоош немени ушинте бергениң кандай, жеңе? – деп айтсам, Жамийла:"},{"t":"p","h":"– Ай, койчу, ушуну! – деп колун шилтеп күлчү. – Бекер жүргөндөн көрө тамаша да! Аны эмне кудай алмак беле ошондон!.."},{"t":"p","h":"Жүрө-жүрө жеңемдин бул тамашасына мен да кошулдум. Анткени Данияр Жамийлага өтө эле кадала карай турган болду»."},{"t":"p","h":"«Тамаша» эми чынга айланмак болду. Анткени Даниярдын Жамийланы «кадала караганы» шек туудура баштады. Бөтөнчө байкагыч Сейиттин көңүлүндө. «Тамашага» Сейит өзү да кошулду. «Жолду карай «чаңдатып», «алма менен ургулап» келаткан булардын тамашасы жети пуддук чоң карала каптын окуясы менен өзүнүн кыл чекитине, апогеясына жетти. Ушундан кийин «тамаша» ачыкка чыкты, баары түшүнүктүү боло баштады."},{"t":"p","h":"Карала каптын окуясы жөнүндө кимдер гана жазбады, кандай гана жазбады! Бул жерде айрым гана мүнөздүүлөрүн келтирели, Г, Гачев маселен, Данияр өткөн «сыноолордун» тизмегин түзүп келип, чоң карала кап жөнүндө мындай жазат: «Даниярдын каршылык көрсөтпөгөнүн билип калган Жамийла... аны ого бетер кемсинткиси* келди..."},{"t":"p","h":"Күчтүн жана эрктин бул сыноосунан Данияр ар-намыс менен өттү: биринчиси, аксак бут Данияр өзүнүн Олимп тоосуна чыгып баратты, экинчиси тамашакей* «уйкудагы сулуу» Жамийла ойгоно баштады». М. Борбугулов болсо түз эле минтип жазат. «Данияр бул жерде чыныгы эркек, чыныгы жигит катары сыноодон өтөт». Дал ушул учурдан баштап, Жамийла Даниярдын нукура? табиятын түшүнө баштап, өзүнүн көңүлүндө эмне бар экенин түшүнүүгө жөндөмдүү эркек ушул окшойт деген ой сезимде калат. Дал ушул жерден баштап Данияр «азоого чалма чала баштайт»®, Жамийланын образынын улуттук мазмунуна кеңири токтолгон сынчы В. Левченко мындай деп жазат:"},{"t":"p","h":"' өмүр-таржымалы – биография"},{"t":"v","l":["2 кайчылаш жоллордо – на перекрёстке дорог","5 кемсинт – относиться свысока","+ тамашакой – насмешник.","$ нукура – чистый","* азоого чалма чала баштайт – обуздать необъезженного коня"]},{"t":"p","h":"<span class=\"pg\" data-n=\"81\">81<\/span>«Француздарды Жамийланын кетиши, күйөөсүнөн кетиш фактысы эмес (Кыргызстандагы сыяктуу), искусство чыгармасынын өзү, түпкүрден. образдардан сызылып чыккан нерселер, жаратылышы, бүт турпаты менен жандуу бүкүлү кабылдоодон туулган кайталангыс! музыка таң калтырган көрүнөт»,"},{"t":"p","h":"Чыңгыз Айтматов Улуу Ата Мекендик согуш жылдарындагы кыргыз аялынын тагдырын сүрөттөгөн, ошол тарыхый мезгилдери кыргыз аялы жөнүндөгү биринчи эпикалык циклди түзгөн («Бетме-бет», «Жамийла» повесттери менен биргелешип) «Саманчынын жолу» повестине кийинчерээк келди. Буга чейин жазуучу «Ботогөз булак» (1961), «Биринчи мугалим» (1961), «Делбирим» (1963) повесттерин жарыялаган эле. Дагы бир өтө маанилүү тарыхый-адабий жагдай. Ушуга чейинки жазуучунун «Бетме-бет». «Жамийла», «Ботогөз булак», «Биринчи мугалим», «Делбирим» деген чыгармалары «Повести гор и степей» деген ат менен жыйнакталып, ага 1963-жылы Лениндик сыйлыктын лауреаттыгы берилет."},{"t":"v","l":["0 Жамийла","{Повестинен үзүндү)"]},{"t":"p","h":"Ар дайым бир жакка жол жүрөрдө, мен ушул алкагы жөнөкөй жыгачтан жасалган сүрөттүн алдына келип турам. Мына эртең да айылга жөнөймүн. Сүрөттү карап, мен андан жолума ак тилек бата алып жаткан өңдүү. аны кепке көз айрыбай тиктейм."},{"t":"p","h":"Ушул күнгө чейин бул сүрөттү эч бир көргөзмөлөргө да берген жокмун, ал тургай айылдан туугандарым келгенде, көздөн далдалап бекитип коём. Анча эле жашыргандай эмнеси бар, уяттуубу деп, кокус оюнарга кетип жүрбөсүн, – жок, бул сүрөттүн эч кандай ыксыз жайы деле жок, же болбосо, ага «көз тийип» кетет дегендей, ал бир ашкан укмуш да эмес. Биринчи көрүшкө жөнөкөй эле кадыресе сүрөт. Бетине тартылган жер кандай жөнөкөй болсо, сүрөт өзү дагы ошондой жөнөкөй."},{"t":"p","h":"Сүрөттүн тээ ички тереңинде – күзгү асмандын ала бүркөк чет жакасы. Шамал бирин-серин булуттарды бир жакка бет алдырып, алыста кылтыйган чокуларга жандатып, кыялата айдап бара жатат, Андан берки көрүнүштө – бозоргон сары талаа, кең өзөн. Чет-четтен чийлер ыкташып, жаан-чачындан кийин топурагы борпоң, тоборсуп карайган жолдо, катарлаш баскан эки жолоочунун изи тигинден бери чубайт. Жолоочулар улам жакындаган сайын алардын издери жерге даана түшүп, өздөрү азыр дагы бир-эки кадам шилтешсе, алкактын сыртына аттап, ушундан ары кетип калчудай сезилет. Айтмакчы, жолоочунун бири... Бирок мен шашпайын, сөз башынан болсун."},{"t":"p","h":"Бул өзү-кечээ эле балалык чактагы окуя. Ата Мекендик согуш үчүнчү жылга аяк басып, Курск менен Орелдун майданында күчөп турган кези. Анда биз, бир кур өспүрүм балдар, колхоздо араба? айдап, суу сугарып, чөп"},{"t":"p","h":"' кайталангыс – неповторимый 1 араба – телега <span class=\"pg\" data-n=\"82\">82<\/span>чаап, айтор, – согушта салгылашып жаткан эр бүлөлөрдүн оор түйшүгү биздин мойнубузда калган,"},{"t":"p","h":"Өзгөчө эгин-жыйын келгенде аптасы менен үй бетин көрбөй, күн-түн кырманда, же болбосо эгин төгүп станцияда, жолдо бозуп жүрчүбүз."},{"t":"p","h":"Мына ушинтип саратан талаа ороктун кызуусунан өрттөнүп турган күндөрдүн биринде, станцияга каттап жүрүп, көптөн бери үйдөгүлөрдү көрбөй, бара кетейин деп, жолдон салт! арабамды кайрыдым,"},{"t":"p","h":"Биз башынан эки үй жанаша турабыз, Үч кез дубалы мыктап салынган, мечит жактагы дебечеде: турган бак-дарактуу короолор ошол биздики. Мен чоң үйдүн баласымын. Агаларым согушка кетип кабар? жок, – экөө тен үйлөнө элегинде кеткен. Карыган атам жыгач уста, колхоздун жүрүп турган ушул тактай араба, шады араба баарысы дээрлик ошол кишинин колунан чыгып турат. Таңдан намазын окуп устаканасына кетет да, күн бата келет, Үйдө апам менен карындашым бар."},{"t":"p","h":"Берки кичи үйдө болсо биздин жакын туугандарыбыз турат. Жакын дегеним, ортобуздан эки-үч ата өтсө да, алар менен башынан малыбыз, жаныбыз бир. Тээ чоң аталарыбыз бирге көчүп, бирге конуп өтө ынтымактуу турушкан экен, ошолордун салты менен биз дагы арабызды алыстатпай, кол үзгөн жокпуз. Колхоз уюшулганда аталарыбыз короо-жайларды бир жерден жанаша тургузушуптур. Ал гана эмес, эки суунун ортосундагы биздин Арал көчө ылгый эле бир атанын балдары."},{"t":"p","h":"Кийинчерээк берки үйдүн ээси дүйнөдөн кайтып, артында аялы менен тестиер эки уулу калат. Илгертен калган адат боюнча агайын-туугандар жесирдин башын байлап коёлу деп. арбак, кудайга тууралап: менин атама никелештирип коюшат. Ал үй жонунан өзүнчө түтүн болуп саналып, мал оокаты, чарбагы бөлөк болгону менен, чынында биз баарыбыз бир үй-бүлө болчубуз. Алардын да эки уулу аскерде. Улуусу – Садык жаңы эле келинчек алганда кетти. Фронттобуз деп анда-санда* алардан кат келип турат. Кичи үйдө кичи апам менен анын келини эле калышты. Ал экөө да эртеден керээли кечке колхоздун жумушунда. Кичи апам, – аны айылдагылар иштерман деп коюшат, ээ бир дүйнөдө табылбаган карапайым, сонун киши да. Түк бир бригаттар менен жаакташпай, жүр деген жагына жүрүп, берки жаш келиндер менен тең катары эле арык да чаап, суу да сугарып, кетмен колунан түшпөйт, Анын келини Жамийла, кудай билип берген бейм, ал дагы жумушка кайраттуу, мыкты келинчек, бирок мүнөзү* башкачараак”."},{"t":"p","h":"Жамийла жеңемди мен чын ниетим менен жакшы көрчүмүн: бир жагы жеңем, бир жагы, – ал менден азыраак эле улуу, тең курбу сыяктуу эле. Ал дагы мени «кичине бала» – деп, инисиндей эркелетет."},{"t":"p","h":"Ушинтип эки үйдүн тең тиричилиги өзүмдүн атам менен карындашымда, Карындашым анда секелек ойноок кыз, садагасы, анын ошондо апама жардамдашканын, мүнөзүнүн жайдарысын түк өмүр бою унутпас-"},{"t":"p","h":"' салт – традиция"},{"t":"v","l":["дөбө – холм","кабар – известие","* анда-санда – иногда","* мүнөзү – характер","* башкачараак – другой (срави. степень)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"83\">83<\/span>мын. Эки үйдүн тең козу-улагын жайган да ошол, тезек терип, отун алган да ошол, балдарынан кабар албаган апамдын кайгы-муңун алаксыткан да ошол. Бу биздин эки үйдүн ынтымагын, ырыс-берекесин сактаган апам, билерманы да апам, ал кишилердин арбагын сыйлап, сеники-меники дебей, эки үйдү тең адилеттүү башкарып, айылдагы эски нускалуу, кадырман байбичелердин бири. Бизге тийиштүү кандай гана иш болбосун апамдан чечилет, Атамды үй ээси! экен деп эч кимиси кайрылчу да эмес. «Ой, устакене барбай эле кой, – ал дөңгөлөк, аспаптарынан башка эчтеке менен иши жок. Алардын эки үйүн тен билген байбичеси, ошого бар» – дешчү. Дагы да андай-мындай иштерге, жаштыгыма карабай, мен кийлигишип кетчүмүн. Анткени. агалар аскерге кетип, эки үйдүн бел байлар жигити деп коюшканына корсоюп, мен өзүмдү кандайдыр жоопкерчиликтүү? сезем. Апама болсо менин андайым жагат, – бышык болсун, тыкан болсун, атасынча жыгач чапкандан башканы билбей, тиричилик аласа-бересеге көнсүн дейт. Мен арабамды чарбактын четине, колөкөгө айдап келсем, биздин бригадир Орозмат, балдагын канжыгасына байланып алып, короонун оозунда апам менен эмнегедир кежеңдешип айтышып жатыптыр."},{"t":"p","h":"Жакындай келгенимде апамдын үнү угулду:"},{"t":"p","h":"– Барбайт андайынарга! Кудайды карап иш кылсаңарчы: аял деген качан эле араба айдачу эле? Кой, айланайын, келинимди ошол орогуна эле тим койгула. Ансыз да жалгыз бойлуктун’ азабын тартып, эки үйдүн тең түйшүгү өйдө каратпайт! Бир базардан бери белиме жел туруп, тиги жүгөрүлөрдүн түптөрү үйүлбөй жатат! – деп, заңкайта орогон элечектин ээк алгычын апам адатынча кайра-кайра жакасына кыстай, булкулдап жаткан экен."},{"t":"p","h":"Орозмат ээрде чалкалай берип, аргасы түгөнгөн кишиче онтоду:"},{"t":"p","h":"– О, кокуй-ой, жарыктык, менин төрт мүчөлүм соо болуп, колумдан келсе, өзүм эле баягыдай каптарды арабага ыргытып-ыргытып жиберип, шакылдата айдап кетпейт белем! Лаажы жок, – бой келиндерге араба айдаталы деп жатсак, макул деген келинди сиз тыйып салсаңыз, план толбойт: пронттун эгинин токтоосуз деп, тыяктан чоңдор үстөлдү муштагылап жемелесе, бу деги шартка түшүнсөңөр болбойбу!"},{"t":"p","h":"Нары жактан шапалак камчыны сүйрөй баскан мени көргөндө, бригадир алда кандай ой тапкансып, сүйүнүп кетти:"},{"t":"p","h":"_ Андай эле келиниңизге жолдон тентек арабакечтер тиет десеңиз, мына – кайниси турбайбы! – деди ал, мени көрсөтүп. – А бу иним жеңесине бирөөнү жакын жуутмак турсун, каратып да койбойт. Андан кам санабаңыз Сейит азамат өзү, бизди жансактатып жаткан мына ушул балдар да азыр, садагасы кетейиндер..."},{"t":"p","h":"Апам мени көрө салып, бригадирдин сөзүн бөлүп жалынды."},{"t":"p","h":"– Ии, тентиген арам... Чачың өсүп, жүдөп да калыптырсың го өзүң. Жанагы атасы түшкүрү баланын чачын алып берүүгө да чолосу тийбейт... Ата имиш..."},{"t":"p","h":"– Андай болсо бүгүн чачын алдыртып, кемпир-чалга эркелеп кетсин, – ' үй ээси – хозяйка дома"},{"t":"v","l":[": жоопкерчиликтуу – ответственный","з жалгыз бойлукту – не замужняя"]},{"t":"p","h":"<span class=\"pg\" data-n=\"84\">84<\/span>деп, Орозмат жайдарыланып коштоду. – Сейит иним, бүгүн үйгө түнөп, аттарынды тыныктыр. Эртен Жамийлага араба беребиз, жеңеңди кошуп алып өзүң баш бол. Байбиче. чочубай эле коюңуз Сейит турганда. Андан калса, жанагы «жаңы тууган Даниярды» кошуп берейин: өзүңүз билесиз ал деги адамга зыяны жок бечара... Өздөрүнчө уч араба бир бригад болуп, стансага каттай беришсин, башкаларды булардын жанына кошпоюн да... Э, Сейит, сен кандай дейсиң. Бу апаң Жамийлага араба айдаталы деп жатсак, көнбөй жатат, өзүң айтчы."},{"t":"p","h":"Бир чети, – бригадир менин мактоомду жеткизип, бир чети, – ал менден кадыресе акыл сурап жатканга, анын үстүнө женем жанымда араба айдап жүрсө, кандай сонун болор эле деген балалык ой менен, мен мурчуюмуш болуп, апама айттым:"},{"t":"p","h":"– Айлай берсин, аны эмне карышкыр жейт беле! – деп, тиги чоң арабакечтерди туурап, чырт түкүрүп, камчыны сүйрөй. жайбаракат тенселип бастым."},{"t":"p","h":"– Ии, күрсүлдөгөн урган, карышкыр дейби? Кой, айланайын, сен эмнени билип коюптурсуң! – деди апам ачуулана эреркеп."},{"t":"p","h":"– Э, билбей анан – эки үйдүн бел байлар жигити да! – деп жиберди Орозмат, апам жаны макул болуп келе жатканда, айнып кетип кайра жаакташабы деген коркунуч менен жапылдап, эмне дээрин билбей, кайсалактады."},{"t":"p","h":"Аңгыча апам солгун үшкүрүп койду:"},{"t":"p","h":"– А-а, кудай, ушу тырмактай немебизге өмүр берегөр... Бел байлар союлдай жигиттерибиз алда кайда: журтта калгандай эле аңкылдап калбадыкпы..."},{"t":"p","h":"Андан аркысын мен уккан жокмун. Тамдын бурчун камчы менен бир тартып, саамайлары сербеңдеп, кичинекей колдору менен эпилдете тезек жайып, мага кубанычтуу жылмайган карындашыма анча деле назар салбай, далисте турган чоюн кумганды эңкейте шашпай колумду жууп, колтугума аарчыдым да, дароо үйгө кирерим менен адегенде чоң кесе айранды жутуп жиберип, экинчисин терезенин түбүнө алып барып, нан туурап жедим. Эшикте апам менен Орозмат дагы эле сүйлөшүп туруптур. Бирок, бул жолу алар жай эле муң айтышып жаткандай өңдөндү. Апам улам-улам ээк алгычы менен кабара түшкөн көздөрүн аарчып, тиги бир нерселерди жоотуп айтып жаткан Орозматка өзүнчө муңдана баш ийкеп, кылгырган тумандуу көз караш менен тээ алыска-алыска, кабарсыз балдары көрүнө калчудай тиктейт. Айтор, капаланып бошой түшкөн апам, Жамийланын араба айдашына көндү окшойт. Бир аздан кийин бригадир ыраазы болгондой, жорго байталын шарт камчыланып, чойтоңдото бастырып кетти."},{"t":"p","h":"Анда бул иштин аягы эмне менен бүтөрү апамдын да, менин да капарымда жок,"},{"t":"p","h":"Жамийланын эки атты башкарып, араба айдап кетишине мен эч кандай күмөн санаган жокмун. Ал өзү кичинесинен жылкыда жүрүп өскөн, тээ боордо, Бакайыр айлындагы жылкычынын кызы эле, Биздин Садык дагы жылкычы болуп жүрүп, жайлоодогу малчылардын тоюнда кыз куумайга түшүп, Жамийлага жетпей калган имиш, ошондон кийин намыстанып аны <span class=\"pg\" data-n=\"85\">85<\/span>ала качып келгенин уккам. Андай эмес, экөө көнүлү менен кошулушкан деп да айтып жүрүштү абысын-ажындар. Эмнеси болсо да, алар үч-төрт ай эле бирге туруп, анан Садык акемди аскерге! алып кеткен, Билбейм, балким жаштайынан атасы менен бирге ой-кырда жылкы айдашып, ат чапкылап жүрүп, өктөм өскөнбү, анын үстүнө, жалгыз кыз бала экен, айтор, Жамийланын жүрүш-турушунда кандайдыр кайраттуулук?, эркекке таандык мүнөз бар. Ар бир ишке шамдагай киришип, башка келиндердей башым, белим дечү эмес. Анан өзү да бирөөгө жемин жегизбеген өжөр, айтышкан менен айтышып, тилдешкен менен тилдешип, ал тургай бир-эки жолу келиндер менен тытышканы да бар. Жан-жакадагы жене-желпилер: «Э, ботом, бул кандай тыкчындаган келин эле! Эшик төрдү көргөнүнө бир күн болбой жатып, тили менен тим эле буудай кууруйт!» – дегендерине апам: «Ошондою мейли! – деп, кайра жактай кетчү. – Келинибиз ошондой ачык-айрым, тайманбас... Адамдын ичи-койну ачыгы эле жакшы болот, – сасыткылар кайра ошо тымпыгыйлардан чыгат»,"},{"t":"p","h":"Атам менен берки иштерман энем го, алар деги кайната-кайнене катарында Жамийланы кагып-силкпей, жай эле чын ыкласы менен эркелетишип: «Кудай өзүнө ынсап берсин, түз жүрүп нээтин бузбаса эле болду!» – деп коюшчу. Өстүрүп чоңойткон төрт уулду аскерге жөнөтүп жиберип, эки үйдүн ортосунда колго кармап калган жалгыз келиндин көзүн карашабы, бирок мен апама таң калган жерим бар. Башканы мындай коёюн, апам бирөөнүн көзүн карай турган киши эмес, Эски салтты коё бербей, атам өзү чапкан алты канат боз үйдү ар жылы жаз чыгары менен короого тигип, арча түтөтүп кут сактап, бизди баарыбызды тектүү, катуу тарбияда өстүрүп, башынан эки үйдү бийлеп келген апама үй-бүлө анын айткан дегени менен болушу керек*, Ал эми Жамийла келери менен биздин арабызда айырмаланды. Ырас, ал энелеринен ийменип, аларды сыйлачы, бирок айылдагы көпчүлүк келиндердей болуп, үн этпей* башын жерге салып, же болбосо тескери карай көгөрүп сүйлөнбөй, өзү туура таап, айтам дегенин тартынбай айтып, ой-пикирин жашырчу эмес*. Жүйөлүү болсо апам көбүнчө аны менен макул, бирок ошондо да акыры ток этер сөздү ал оңой эле бирөөгө бере койбойт. Менимче, апам аны мүнөзүнүн күчтүүлүгүн, адилеттүүлүгү жагынан өзүнө жакын, өзүнө тең болорлук көрүп, келечекте аны эки үйдүн башын коштуруп, очоктун ырыс-берекесин сактаган өзүндөй мыкты орун басар катарында калтырып кетейин деген ою бар болсо керек."},{"t":"p","h":"– Аллага шүгүр, тектүү. куттуу жерденсиң балам. Ал да болсо сенин багың, ушуну билип жүр. Аял деген кудай этегинен айтып, үйүнө береке турса, башка эмнени тилемек эле. Мына, жыйган-тергенибизди биз чалкемпир кошо алып кетмек белек... Кадыр-баркынды сактасаң, энчиңе бакдөөлөт сактаганың ошол, балам! – деп, эскерте турган."},{"t":"p","h":"Баса, энелерди саал чочуткан бир нерсе бар эле. Жамийла өтө эле шайырсымак, бала кыялдуу. Кээде ал эч бир себепсизден энелерине эрке-"},{"t":"p","h":"' аскерге – в армию"},{"t":"v","l":["* кайрагтуулук – терпенье","› болушу керек – должно быть","ун этпей – без звука","* жашырчу эмес – не скрывал"]},{"t":"p","h":"<span class=\"pg\" data-n=\"86\">86<\/span>лей кетсинби, же болбосо шаңкылдап каткырып жиберсинби, же көчөдөн короого кирип келе жатканда, куду эле жаш кыздарча арыктан так секирип, жүгүрүп келсинби, анан өзүнчө эле ырдап жүрөт. Энелер Жамийланын мунусун кеп кылып, анан кайра: «Бала да, бара-бара салмак тартар» – деп коюшчу."},{"t":"p","h":"Ал эми мага женемдин ушундайы жакчу. Ал экөөбүз алышыпкүрөшүп. кубалашып да кстебиз."},{"t":"p","h":"Жамийла өзү шынга бойлуураак, белдүү келин. Эки өрүмгө батпай, дүркүрөп өскөн калың чачын кысып туруп, бир байлам ак жоолукту маңдайына кыйгачтатып, шарт буунуп алса, кызыл торусунан келген, балкылдаган тегерек жүзүнө ак жоолук эп келише калат. Жамийла күлгөндө, анын чымкый кара сүйрүрөөк көзүндө ден соолуктун. жаштыктын ашыпташкан күчү ойт берип, ал эмнегедир! өзүнчө бой каранып, секетбайдын туздуусунан ырдап жиберет. Айыл арасындагы жигиттер, өзгөчө фронттон кайтып келгендер Жамийлага кызыгып, тийишишип жүргөндөрүн алда нече байкагам. Тамашаны жакшы көргөн женем алар менен тамашалаша берчү, бирок колу шокторду жанына көп жуутчу эмес. Ошондой болсо да, мен өтө ичи тар элем, женемди кызганып, берки тийишип жаткан «бузуктарга» сыр көрсөтөйүн дегендей: «Байкагыла, мында мен, кайниси турам! Коруп алар эч кимиси жоктой көп эле сугалактай бербегиле!» – дегенчелик кылып, алардын сөзүн бөлүп, эпсиз какшыктап, эн акыркы, сүзөнөөк теке-улакчасынан кыйшайып кабактын астынан үлүрөйө тиктейм, «Ой. алдагы жаман кантет, жеңе ушунуку беле!» – деп жигиттер күлгөндө, кудай билет, кызарып-татарганым аз келгенсип, көзүмө жаш имериле түшөт окшойт. А мени түшүнгөн жеңем. кубанычтуу күлкүсүн тыялбай суз жылмайып: «Ишиңер болбосун, жене деген жерде жатыптырбы? Жүр кеттик кайним!» – деп, тигилерди ого бетер кызыктырып, бураң этип, башын өйдө чулгуп, мени менен кошо басып бара жатып, өзүнчө ыраазы болгондой да, ызалангандай да, унчукпай күлүмсүрөйт. Мүмкүн ошондо: «Жене коруйт десе ушунте бересиңби, кичине бала? Кызыксын да анан, көнүлүм бузулса, миң коругула, мен чабырдагы чымчык эмесмин да!» – деген ой кетеби ага?.. Мен дагы ошондо айыптуу немедей унчукпайм. Бирок, аздан кийин эле жеңем кайра жазылып: «Ии, кичине бала, кызыксын да анан!» – деп, адагынча мени бооруна кысып, мандайымдан өбөт."},{"t":"p","h":"Ооба. мен жеңемди эч кимге ыраа көрбөй кызганам, анын ирендуулугу менен, өзүн эркин алып жүргөн мүнөзү менен ичимден сыймыктанчумун. Билбейм эмне үчүн экенин, бирок биз өтө жакын элек, биринен-бири эчтеке жашырбас сырдаш курбулар сыяктуу элек. Ал кезде айылдагы эркектер аз, ошондон улам кээ бир көкүрөк көтөрүп, дөгүрсүнгөн жигиттер, өзүн «мен гана» дегендей сезип, аял алар үчүн кеп эместей. Бир жолу чөп чабыкта, улам эле жөнү жок ыржалактап, айтканым сая кетпейт дегендердин бири – биздин тууган сөрөй Осмон тийише бергендиктен, Жамийла анын сенек колун жактырбай силкип салды да, көлөкөдө отурган жеринен өйдө боло берип:"},{"t":"p","h":"– Турчу нары! – деди. Анан тескери карап, өзүнчө капалана үшкүрдү."},{"t":"p","h":"' эмнегедир – почему то"},{"t":"p","h":"<span class=\"pg\" data-n=\"87\">87<\/span>– Ангиликтен башка колунардан эмне келет дейсин?"},{"t":"p","h":"Чөп маянын түбүндө талтая жамбаштаган Осмон, шилекейленген калбык ээрдин кекерлене түйрүп, бышкырды:"},{"t":"p","h":"– Тигини, мышык этке жетпей жатып сасык дейт... Мурдунузду чүйрүбөй эле коюңуз! Кесирди эмне кылат экенсиң: көзүң катып өлүп эле жүрөсүн го..."},{"t":"p","h":"Жамийла жалт бурулуп кубара түштү:"},{"t":"p","h":"– Өлсөм өлүп жүргөндүрмүн, – кудайдын башка салганы! Бешенебиз ушул экен – сен, акмак, андан эмне күлөсүң? Көзүм катмак турсун миң жыл так өтсөм да, сага окшогон шүмшүккө кесиримди артканым арткан! Акмаксың, баягыдай тынчтык замана болсо, көрөр элем ушинтип айтканыңды!"},{"t":"p","h":"– Ошону айтам да! Согуштун кесепетинен камчынын уусуна сугарылбай кутуруп жүрбөйсүңбү. – Осмондун көзү жүлжүйө майланышып, ал ээрдин тиштене тамшанып алды. – Менин гана катыным болуп калсаң ээ..."},{"t":"p","h":"Эриндери! дирилдеген Жамийла Осмонду бардык күчү менен жекире карап, бир нерсе айтмакчы болуп ага умтула берди да, анан: «ушуга айткан кайран сөз» – деди окшойт”, «түү» – деп, тигини көздөй? жийиркеничтүү“ түкүрүп, жерде жаткан айрыны ийнине салып, унчукпай четке басгы, Мен бери жакта арабанын үстүнөн чөп түшүрүп жатат элем, мени көрө салып, Жамийла чукул бурулуп кетти, Жеңем мен ошондо кандай абалда экенимди билди, Сөз ага эмес мага тийгендей, мен ал үчүн ызаланып, намысым кайнап: «Андайларга эмне учун жолойсун, алар менен эмне үчүн сүйлөшөсүң?» – деп, жеңеме жаным ачып, кейип турдум."},{"t":"p","h":"Ошол күнү керээли кечке Жамийланын ийилген кашы сустайып, шыңкылдаган күлкүсү тыйылып унчукпады?. Мен шады арабаны үймөктөрдүн жанына айдап келгенде, ал мени сүйлөтпөс үчүн атайын жумушка алаксытып, ичин өрттөп жаткан ой-санаасын байкатпай, чоң үймөк чөмөлөгө айрыны ныгыра сайып, тоо омкоргондой аны бүт бойдон жерден так көтөрүп, бетине калкалай келип, улам арабага өжөрлөнө силкип таштап жатты. Тигиндей узай берип артыма караганымда, жеңем айрынын сабын таянып, бир азга солгун туруп, ойлонуп калат да, кайра жумушка кирет."},{"t":"p","h":"Кеч бешимде акыркы арабага чөп басып жатып, Жамийланын тиги өчүп бара жаткан күндү карап турганын байкадым*. Наркы өйүздө казактын боз адыр белесинде от жагылган тандырдын оозундай алоолонуп, билинер-билинбес мелт-мелт ылдый чөгүп, жерге күүгүм чакырып, асмандагы борпон булутчаларды кызыл сур түскө боёп, талыкшып албырган күндү, Жамийла алаканын көзүнө калкалап, ошол жакта кандайдыр бир сонун көрк ачылып келе жаткансып, муңайым күлүмсүрөп карап турду. Баятан куушурулган кашы азыр жазыла берип, жүзү жарык тартып жумшарды."},{"t":"v","l":["' эриндери – губы","* окшойт – похоже","› көздөй – в сторону","* жийиркеничтүү брезгливо","* унчукпады – промолчал","* байкалым – заметил"]},{"t":"p","h":"<span class=\"pg\" data-n=\"88\">88<\/span>Ошондон улам ал менин айтылбаган, бирок али да жүрөгүмдү өйкөп ния чулу «Андайларга эмнеге жолойсун. алар менен эмне өсүң?» – деген к суроомо жооп бергендей, мен анын – үч ыны: окшогондор да кишиби? Дөбөттөр да не с – Сен жанагыны оюңа албай эле кой, кичи – тин соу? кр мага эмес йн туа йты: – Андайлар адамдын черин жазмак кайда... Ал амийла унчукпай калып, күндүн И жатат Кудай билет, андай эркектер дүйнөдө жок Жа чыгыр, у ыр; үк. и ря арабаны кайырганча карасам Жамийла нары жак- жүгүрүп кетип, алар менен бир нерселерди та иа п, кубалашып да кетиптир. Күндүн таптаза батышын"},{"t":"p","h":"рү нулу ачылдыбы, же жумушту ойдогудай бүтүргөнүнө ыраазы болдубу, айталбайм. Чөп баса үйүлгөн арабанын үстүндө олтуруп, буурул-ала салкын көлөкө жайылган чабынды менен жоолукчасын булгалап, кулачын кере жүгүрүп бара жаткан Жамийланы көрүп, менин да көңүл м ач; «Ырас эле, Осмондун сөзү да кеппи?»"},{"t":"p","h":"ш Чү. аттарым, ылдамда! – деп, арабаны тездеттим, иин деп, атам устаканадан кайтканча, Садык акемдин катына жооп жаздым. Бригадир Орозмат айткандай, ал күнү мен чачымды алдыртып кете п атамдын наамына жиберчү, почточу аны апамдын колуна тапшырат. Келген Кат жазуунун бизде өзүнчө салты боло турган. Аскердеги агала катты каттарды окуп бериш жана жооп жазыш – ал менин милдетим Катты окуй электе эле анда эмнелер жазылганын мен күн мурун эле биле ту ашый, анткени алардын баары эгиз козудай бирине бири окшош болучу. С рн акем атыр жыттуу, салкын абасында жашаган, жандан артык көрүүчү агам ол. кат жазганда адегенде: «Амандык кат» – деп туруп, анан: «Андагы Таласт чубай», – деп, атамдан баштап, анан апамды, анан Иштерман энемди айтып быздын аманчылыгын сурашып, эң акырында: «Жана да аялым Жамийл ушинтип баарыбызды бир-бирден өз кезеги менен атап, жакын тууганда ыдар турганда аялын биринчи эскерип, катты анын наамына жазыш ан аман-эсен турабы?» – деп, Жамийланы бир ооз сурап етот, Ата-эне. зм Садык үчүн эмес, эркекмин дегендердин баарына эрөөн болобу, арок у ны эле катка көптөн-көп ыраазыбыз, айыл элинин түшүнүгүндө ул өзү салттагы иш, Катты бир эмес эки-үч жолу окутуп алгандан кийин 1 апам аны казан-аяктын ысык-суугуна туурулган колуна алып, кагазды руп жиберчүдөй абайлай кармап, үч бурчтук кылып кайра бүктөйт."},{"t":"p","h":"е катыңардан айланайын! – деп коёт ал, көзүнө Чай та-эне, туугандар дейт тура? Бизди коюп өзүңөрдү пгону, биз эмне... үйдө эмеспизби... Мен аманмын деп ир эле чийип койсоңор, ошо да бизге чоң каниет..."},{"t":"p","h":"киды, э азга катты телмире тиктеп, сандыктагы кат сактоочу з еы ошол учурда Жамийла да үйдө болуп калса, ал дагы катты бир ира ичтен окуйт. Ар убакытта кат колуна тиери менен Жамийланын бету алоыра түшүп, ал аны демин токтото албай, шашылып окуй баштайт. и, <span class=\"pg\" data-n=\"89\">89<\/span>рок, улам каттын аягына жакындаган сайын, өңүндөгү оту соолуп, ийилген кашы сустая жыйналат. Кээ бирде аягына чейин да окуп жетпей, Жамийла унчукпастан, катты убактылуу карызга алгандай, сустайган бойдон кайра энесине берет."},{"t":"p","h":"Кат сактоочу тулупту сандыкка бекитип жатып, келининин бозоро түшкөнүн байкаган апам, аны кайраттандырмакчы болуп жемелеп коёт:"},{"t":"p","h":"– Кабар келгенине сүйүнбөй, кайра шылкыя калат экенсиң да, балам. Же аскерге кеткен жалгыз эле сенин күйөөң бекен? Эл тарткан азапты эл менен кошо тарт,.. Кудай кошкон жарын ким сагынбасын, сагынсан да ичинде болсун, ичиңе сакта..."},{"t":"p","h":"Жамийла унчукпайт. Унчукпаганы менен ошол учурда кежирлуу капалана карап: «Сиз түшүнбөй эле айта бересиз да!» – дегенсийт."},{"t":"p","h":"Садык акемдин бул жолку каты да Саратов шаарынан келиптир. Ал анда госпиталда жаткан. Куда кааласа, күз ортосуна карай бошоп келермин дептир. Мурун да ушундай кабар келип биз сүйүнүп жүргөнбүз."},{"t":"p","h":"Атам жумуштан келгенде, чачымды тезирээк шыпыртып алдым да үйгө жатпай эле, аттарды бедеге коё берип, күндөгүдөй кырманга барып түнөдүм, Башкармалар малды бедеге жайдырчу эмес, бирок мен, аттарым мыкты болсун деп, көздөн далда алысыраак ойдуңдагы бедеге түндөп тушап койчумун, Эч ким аны билчү эмес. Бул жолу арабаны кырманга чыгарып коюп барсам, мен ээлеп жүргөн ойдунда төрт ат тушалып жүрөт. Ачуум келип, бул аттарды тээ алыска айдап салайын дедим. Бирок, эки ат жана бригадир айткан Даниярдыкы экенин таанып, эртенден баштап баарыбыз бир бригад болуп, станцияга кошулуп каттап жүрөбүз деген ой менен тим койдум. Кырмандагы саманга жатайын деп келсем, Данияр дагы ушул жерде экен. Арабанын дөңгөлөктөрүн кечки жарыкта жаңы эле майлап бүтүп, бурамаларын бекемдеп жатыптыр."},{"t":"p","h":"– Данике, сайдагы аттар сеникиби? – дедим. Ал бурула берип, жай карап койду;"},{"t":"v","l":["– Экөө меники.","– А беркилеричи?"]},{"t":"p","h":"– Жанагы Жамийла дейби... сол келиндики. Сенин ал женен беле?"},{"t":"p","h":"– Жеңем."},{"t":"p","h":"– Айтпесе бүгүн түн багып бересиң деп, бригад өзү таштап кетти. «Ии, жана аттарды айдап жибербегеним жакшы болгон экен анда», – деп койдум оюмда."},{"t":"p","h":"Түн кирип, жогортон соккон сыдырым тыйылып, кырман да тынчы* ды, Мен жаткан саманга Данияр да келип жатты. Бирок, бир аздан кийин ал туруп кетип, нары суу аккан чоң сайдын тик ылдый түшкөн кашатына барып туруп алды. Ал ошол жерде эки колун артына алып, башын саал бир жагына кыйшайта, козголбой тура берди. Артынан карасаң Даниярдын сөлөкөтү айдын күүгүм жумшак жарыгында сомдон чыккандай арбайып, кашатта жалгызсырайт, Мемиреп жуушаган түнкү тынчтыктын уйкусун бөлүп, ушул кезде улам күч алып, бөгөлгөн таштарга башка бир кулакка угулар-угулбас дабыштарды тыңшагансып Данияр козголбойт, «Адатынча дагы суунун боюна барып жатайын деген экен го!» – деп, күлүп койдум мен."},{"t":"p","h":"<span class=\"pg\" data-n=\"90\">90<\/span>Данияр биздин айылга жакында эле пайда болду, Чөп чабык жаңы башталганда, фронттон бир жарадар аскер кайтып келди дсген кабарды айылдан чуркап келген бала сүйлөп берди. Бирок, ал аскер ким экенин бала өзү да билбейт. Айылда го белгилүү: бирөө аскерден кайтып келди дегенче болбой, жабыла учурашканы жүгүрүп барат эмеспи. Ал эми бул жолу анын аты-жөнү дайынсыз болуп, чөп чабыктагылар ого бетер чуу түштү."},{"t":"p","h":"– Чоочун дейт го?"},{"t":"v","l":["– Чоочун болсо бул айылга эминеге келмек эле?","– Баса, ошондой де!"]},{"t":"p","h":"Ушинтип, ал ким экен, кимдин баласы экен, биздин баланча болуп жүрбөсүн, биздин түкүнчө болуп жүрбөсүн – деп, чуулдаган чепчулердун бир тобу айылга чаап барып да келишти."},{"t":"p","h":"Көрсө, Данияр түпкүлүгү биздин айылдан экен. Кишилердин айтымына караганда, ал кичинесинде тоголок жетим калып, анан ар кимдин колунда жүрүп, акыры тээ төмөн Чакмактагы казак таякелерине кетип, ошо бойдон артынан изденер, күйөөр жакын тууганы жок, элдин эсинен чыгып, унутулуп калат. Айылдан кеткенден кийинки өмүрү жөнүндө Данияр анча деле чечилип айтып бербептир. Бирок, азыр ойлоп карасам, анын көрбөгөн күнү, тартпаган азабы калбаса керек,"},{"t":"p","h":"Илинер-карманары жок эбелектей баланы, турмуш бир жерден экинчи жерге айдап, сүрүп отуруп, карандай баштын жан сактоосун акмалатып, далай жерди кыдыртат. Данияр бир топко чейин Чакмактын боз даңгыр айланасында кой кайтарып, анан бой жетип, кайнаган чөлдө канал чаап, жаңы пахта совхоздорунда пахта эгип. суу сугарып, акыры Ташкенттин жанынан Ангрен шахталарында иштеп, аскерге кетет,"},{"t":"p","h":"Эмнеси болсо да, элдер анын кайтып келгенин туура таап; «А. бечара, туз-насиби бар экен, акыры өз элин издеп келгенин карачы! – Ушунча жыл сыртта жүрүп өз тилибизди унутпаптыр, – аздап эле казакча чалышы бар» – дешип, өз ара ыраазылыгын айтышты."},{"t":"p","h":"«Тулпар айланып үйүрүн табат. Тууган жер, эл-журт деген оңойбу. Келгениң арбакка жагар иш: мына германды жеңип, тынчтыкка жетсек, сен дагы эл катары түтүн булатып балалуу-чакалуу болорсун» – дешкен чалдар, Даниярдын жети атасына чейин сөөк сүрүштүрүп отуруп, анын кай уруудан экенин, айылдагы анча-мынча туугандары ким экенин да таап беришти. Элдер эми аны: «Жаны тууган Данияр» – дешчү болду."},{"t":"p","h":"Ортодон көп өтпөй, бир күнү шинелин ийнине арта салып, сол бутунан сылтый баскан узун бойлуу, мойну куркуйган бирөөнү бригадир Орозмат ээрчитип келди. Өзүнчө эле чукчулдуктай бүлүнүп, жорго байталды кыдыңдата бастырган жампыгый Орозматтын жанында тиги узун бойлуу аскер, салмагын соо бутуна салып, кандайдыр демите арыштап, унчукпастан калышпай келе жатты."},{"t":"p","h":"Биз, чөп чапкыч машина айдаган балдар, Даниярды ошондо биринчи жолу көрдүк. Анда жанагы бүгүлбөгөн бутунун жараты жакшы айыга элек, чалгыга жарабай, ал дагы машина айдашты, Чынын айтайын, биз аны анча жактыра бербедик. Себеби, Данияр киши менен көп сүйлөшчү эмес. Сүйлөшсө да ошол убакытта башка бир, өзүнө гана белгилүү ойлорду ойлогонсуп, кишини тике карап турса да, көңүлү башка жакта экени сезилип <span class=\"pg\" data-n=\"91\">91<\/span>турчу. Ал өзүнөн өзү кыялга баткандай, маңыроо сыяктуу. Аны клан ы а кишилер: «Байкуш неме согуштан эси ооп калса керек», – деп да жүрү Бирок, Даниярдын ушул мүнөзү, кыймылы тез иштегенине, шуна түк байланышпайт, – сыртын йл. йт, – ан карап турсан, аны а! урч, чы оң г деп ойлойсуң. Мүмкүн, жетимдиктин запкысын коп бус. турмуш аны тез иштөөгө, бирок көп сүйлөтпөй, сырын ичке түйүп, са ганга үй Тартайган, москоол боюна жараша Даниярдын бет түзүлүшү йрөттүбү? бү? Балким, о шондой болуш керек, лынып чап жаак, кабагы дайыма чарчаңкы жыйрылып, көзү бир чыгу салмактуу тиктейт. Анын жүзүн өзгөртүп, кыймылга келтирген и кашы. Кээде ал бир үн чалгансып, се анс стейе калганда, каш серпкенде 1 өйдө боло берип, көзү жалжылдап, бир нерсеге сүйүнгөн рые эмнеси экени биз үчүн түшүнүксүз, Бул гана эмес, анын = тары бар. Кечке жуук, иңир чалышта аттарды кайнаган тамак качан даяр болот деп, отту ‚ тегеректеп, баарыбыз де кыр тн м кутуп отурабыз. Данияр болсо. жаныбыздагы Кароол дебеге чыгып карангы киргенче ошол жерде олтурат. «Эмнеси бар анда, күзөт кузетесу: деп, биз күлөбүз, Бир күнү кыз ыгып. мен дагы Даниярдын жанына дөбө дөбөнүн а айлана кеңири ачылып, тоо этектеп коюлуп келе жаш чыгып отурдум. Анча деле укму штуу эчтеке жоктой бу; рде. көгүш иңирде, жайкы талаалар деңиз түбүнө чөккөнсүп, ку А кум көлөкө жамынат. Данияр менин мында келгениме көнүл бурга! за Сынар тизесин кучактап, тек өзүнчө кыялданып, жүзү эргиген мейри ш отуруптур. Ушул учурда ал мен укпаган, менин кулагыма еттү' дыр кереметтүү бир нерсел ерди тыңшап, ошого жан дил л и менен кулак салып отурган ө м ңдүү туюлат. Кээде анын ка ээде шы бийик серпилип, көзү жайнап, ичинде демиккен бир зор күч й и ардай, ал чыңала түшүп, өйдө тура калып, кулачын жая, айланадагы көз көргөндүн баарын кипи» көкүрөгүнө бекем кысчудай термелет. Бир карасам жок, жөн эле чарч эмедей шалдырап, лем алып отург й ан сыяктуу. к"},{"t":"p","h":"Биздин колхоздун чөп чабындысы Күркүрөө суусунун ул буйдуңдуу чоң сайында. Күркүрөө дегендеи эле Г лип, ошол ашынган бойдон жан са И балап агат. Чөп чабынды маал, т ы ларынын кирген кези. Таштан-ташка күбүлүп, кум ойнотуп, ао а | тарткан суу кечтен кошула баштап, түнкүсүн анын жер"},{"t":"v","l":["аганынан алачыкта жатып ойгонуп й кетем. Каймагы алынган с","аба, сырттан муздак илеп чалып, бадырая толгон","-","","н","Е"]},{"t":"p","h":"тарга шыкаалайт. Түнкү тынчтыкта суунун агымы бөтөнчө кү ү г жга, лачыктын түбүнө шарпылдата толку: н уруп, улам жакындап сүр А ей те ее болсок да алачыкты каптап алып кетеби деген коркунуч эрксизден туулат. Жолдошторум бейкапар уйкуда, за на авы Сайдагы тун керктуу да, коркунучтуу 1 да. Жээ дын караандары тигинде, мы нда бириндеп, тынч. Аттар ба А ятан шүүдүрүм чопке тоюп, азыр кез-кез бышкыры ный. тек гана магдырашат. р. уо эле жанында булуңдагы бүткөн бою суу, солкулдап оадал элн ирге\" жапырып, таштарды ала-сала агызган Күркүрөө, эчтекеге жапайы күч менен жердин астынан чыккандай күңгүрөнүп, жандуу. | р ү <span class=\"pg\" data-n=\"92\">92<\/span>режу\" сүрдүү, укмуштуу күү чалат. Аны тыңшап сүрдөйм, ичиркенем. а, Данияр кайда болду экен?» – деп ошондо эстеймин. Ал дайыма так суунун жанындагы үймөк чөптөргө барып жата турган. «Ал эмне түнкүсүн коркпойбу, кулагы тунбайбы? – деген ой келет мага. – Уктап жатат бык ду бекен, же ойгообу? Тооба, өзү жалгыз суу боюна барып жаткандан кандай кызык табат, эмнеси бар мунун? Деги кызык неме... Аламдан оолак...» Кайда болду экен деп карайм, тыншайм. эчтеке жок. Теребел жарык кечит кара, жээкте толкун шыпшынат. Сайдын тээ башында, тоонун кыры мунарыктап, жылдыздар алыста көрүнөр-көрүнбөс."},{"t":"p","h":"рено кайтып келгенине бир топ кун болсо да, ушинтип эч кимге коуя ай, ар качан жалгыз жүрүп, Данияр өзүнө жоро-жолдош күтө албады. ирее менен жакындашуу, душмандашуу ага жат өңдүү, эч кимге жаман айтпайт, жакшы айтпайт. Айыл арасында го колунан жамандык жакшылык да келип, жыйналыш-жыйында чыгып сөз сүйлөп, аш-тойдо аксакалда менен тең катары тизгиндешип, эл башкарышып жүргөн өкмөт ный кадыр-барктуу болуп, оозго кирет. Кыз-келиндин көзүнө түшчү да"},{"t":"p","h":"Ал эми Даниярга окшоп, өзүн башкалардан окчун кармап жоош жүргөндү ишке аралашкан мыктылар анча теңине албайт, карапайымда анын зыян-пайдасы болбогон соң: «Эптеп жан сактап жүргөн бир Е ра байкуш» – деп коюшат. Өзгөчө бизге окшогон чечек балдар чоңураак"},{"t":"p","h":"тен аталашып жүргөндү мыктылык көрөт эмеспи. Биз көрүнө с со да, көзү жокто Даниярдын мүнөзүнө күлө турганбыз. Ал эмес нөгүн сууга алып барып, өзү жууганына да күлчүбүз: аскерден кийип келген көйнөгү жалгыз болгондуктан, аны чала кургатып эле кийип алчу. Бирок, бир кызык жери, Данияр момун болсо да биз ага тең аталаша албадык. Аны улуусунтуп сыйлагандай ал менин агаларым менен курбалдаш андайларды биз «сен» – деп өзүбүздүн наркыбызды төмөн түшүрбөйбүз. Сүрдөй тургандай Даниярдын эч деле жери жок, антсе да анын ошол унч к. пас, басмырт мунезунде кандайдыр терен маани бардай, демейде шок к шыкчыл балдар көп эле ага батына бербеди."},{"t":"p","h":"Анын себеби мындан да болуп кеттиби деп ойлойм. Мен өзүм элдин көргөн-билгенин, бөтөнчө фронтто болгондорду майда-чүйдөсүнө чейин дан «Сейит маңыз» – деп да атыгып кеттим. сурап, билүүгө кызыкчумун. Суроо деген менде түгөнбөйт, ушул дартым- зы"},{"t":"p","h":"Данияр келген алгачкы кундеру андан согушта болгон окуяларлы угамын го деп күтүп жүрдүм. Бир күнү жумуштан кийин, тамак ичип, отту тегеректеп жарпыбыз жазылып, тынчтанып отурганда, Даниярдан сурап калдым:"},{"t":"p","h":"– Данике, согуштан козгоп, эрмектеп бербейсиңби? Данияр адегенде унчукпай, жаман көргөнсүп түктүйө калды."},{"t":"p","h":"– Согуш дейсиңби? – деди ал жай гана эмнегедир үнүн басаңдата"},{"t":"p","h":"согуштун түрү курусун, сендер аны билбей эле койгула!"},{"t":"p","h":"жаткан катуу-кутуу куурайдан чоң тутам алып, ө к күлү. = эч кимибизди карабай, көнүмүш лдеп күйгөн жалында көзүн сүзүлтө Ал эмне үчүн ушинткенин ким билсин, бирок анын ушул эле айткан сөзүнөн согуш деген жомок катары эрмектеп сүйлөй турган кеп эмес, ал <span class=\"pg\" data-n=\"93\">93<\/span>адамдын жүрөгүнө терең батып. айтууга өтө кыйын, оор экени сезилди. Уялганымдан дагы жер карап калдым. Экинчи согуш жөнүндө Даниярдан эчтеке сураган жокмун, балдар дагы ага тийишип тең аталашканын койду."},{"t":"p","h":"Бирок, мүнөзү түнт, адамга ыгы жок Данияр мурункудай эле жалгыз жабык жүрүп, анын аскерден кайтып келгенинин кызыгы бат эле таркады. Кээ бир элдер аны анчейин: «ээ бир жүргөн бирөө да!» – дегенсип көзүнө илбей, кээ бирлер ага ачык күлө сүйлөп, көпчүлүгү болсо боору ачып, «үйүжайы жок эптеп жан сактап жүргөн бечара карып... Колхоздун талаада берген ысык оокаты болбосо тим эле тентип эле кете турган неме... Өзү да кудайдын боз кою!» – дешип, аяп жүрүштү. Бара-бара элдер Даниярдын мүнөзүнө көнүгүшүп, үйрөнүп калгандыктанбы, аны кеп кылганды да койду. Чын эле адамдын эч кимге тиешеси болбогон сон, ал көз көрүнө эле унутула берет эмеспи."},{"t":"p","h":"Эртеси кун чыкпай, Данияр экеебуз аттарды кырманга алып келдик. Ангыча Жамийла женем да орокто журген жеринен келип калган экен, бизди көрүп, тигинден эле кыйкырды:"},{"t":"p","h":"– Ай, кичине бала, менин аттарым кайсы, бери жетеле! Камыттары кайсы эле? – деп машыккан арабакечтен бетер дөңгөлөктөрдүн шалкылдагын буту менен тээп көрүп жатты. Аттарды коштой жетелеп биз жакындап келгенде, Данияр экөөбүздүн түрүбүз кызык көрүндүбү. анткени жайдак бастырган Даниярдын кончу кенен солдат өтүгү саландаган узун буттарынан шыпырылып кетчүдөй бутунун башына илинип, мен болсом мүйүздөй чор болгон согончокторум менен жылаңайлак теминип келаткам, Жамийла бизди шылдынкор карап, күлүп койду:"},{"t":"p","h":"– Оо, узунду-кыскалуу болгон кайрандар десе! Издешпей табышкансынар го!"},{"t":"p","h":"Ушундан баштап эле ал бизди башкарып алгансып: «Болгула, урушта туруш жок, эртерээк салкында жөнөй берели!» – деп, аттарды булкулдата кетенчиктетип, арабага кошо баштады."},{"t":"p","h":"Данияр жаныбызда жүрсө Жамийла аны кишиби, көлөкөбү дебей такыр эле көзүнө да илген жок, сүйлөшсө мени менен сүйлөшүп, бизден калышпай, нары-бери шамдагайлана аттарды чегип жатты. Жамийланын бул кыр көрсөткөндөй чечкиндүүлүгүнөн Данияр апкаарый түшкөндөй болду. Чекесин тырчыктырый, ал аны жактырбагандай да, таң калгандай да, түктүйө карап, сыртын салды. Тиги анысын байкаган да жок, болгондо Данияр тараза үстүнөн каптардын бирин кучактап алып, унчукпай арабасына көтөрүп таштаганда, Жамийла аны жемелей кетти:"},{"t":"p","h":"_ Ал эмнеси экен? Ар ким эле өзүнчө далбастай береби! Келе колуңду, колдошконду кудай колдойт! Ай. кичине бала, чык арабага, каптарды жаткыр!"},{"t":"p","h":"Жамийла Даниярдын колун өзү эле шап кармап, экөө колдошуп кап көтөргөндө, Данияр уялганынан кара-көк болуп кызарып кетти. Анан алар улам каптарды колдошо көтөрүп басканда, бекем кармашкан колдору чыналышый, кап үстүнөн арта салынып, Жамийлага эңкээ берген Данияр өз алдынан эле оңтойсузданып үтүрөйүп, аны карабаска аракеттенип жатты. <span class=\"pg\" data-n=\"94\">94<\/span>Жамийла анда да иши жок, таразачы келин менен ары өтүп, бери өтүп шыңкылдашат, Арабалар жүктөлүп бүт үп, жуп жөнөрдө гана, ал бе көзүн кымтый коюп, Даниярга айтты: п"},{"t":"p","h":"– АЙ, ким. Данияр белең? Караанын, эркек эмеспи, жол башта! – деди Данияр бул жолу ла унчукпады, чочугандай келинди бир карап арабаны турган эле жеринен ала-сала айлалы."},{"t":"p","h":"«Аа, шоруң кур, уялчагын мунун!» – деп аяп койдум аны."},{"t":"p","h":"төмөндө жаткан Кара-Тоонун капчыгайынан өтүп станцияга барыш ек, Жол алыс. Жыйырма чакырымдай боз талаа менен жүрүп отуруп дар ан жери, кырмандан чыгып станцияга жеткенче жер өңүтү ылдый,"},{"t":"p","h":"ул кеп женилдик. Улуу-Тоонун адырлуу тескейинде орношкон ыз, капчыгайга кире бергенче, качан артыңа кылчайып карабагын, р 1 2 бын ушинтип биз күнүн барып келип, эгин тартып жүрдүк. Айыл- ртен менен чыгып, станцияга түш оой барабыз. Жүктүү арабалардын"},{"t":"p","h":"каксоо жолдо дүнгүрөп, шагыл майдаланып бычырайт. Күн дөлөп, талаа ысыган сайын, аттардын сооруларынан жылга-жылга те кетип, үйүр алып, кошо ээрчишкен чымындар чаң аралаш учуп-конот."},{"t":"p","h":"Саратан чаңкып, жер какшыган күндөр. Станцияга келсең арабакөлүктөн басарга орун жок. Тоо койнундагы алыскы колхоздордон эгинди өгүз, эшекке артып, айдап келатышкан балдар менен катындардын жондору туздуу шор, чаң баскан беттери капкара болуп күйгөн. Шамалга кеберсиген эриндери кан кесилип, өздөрү жыланайлак-жыланбаш, ташыркап, чаалыгып келишет. Заготзернонун короосу ызы-чуу, дарбазасында: «Ба| дык эгин – фронт үчүн!» – деп, ураан жазылган. Сокмо дубал менен мета курчаган жапыс короонун сыртында, паровоз вагондорду нары-бери кагыштырып, ысык буу уруп, кумурскача тынбаган аракетте. Өткүн жаандай шартылдап, өткөн поезддер капчыгай жаңырта токтолбой зуулдашат. Так кампанын оозуна чөгөрүлгөн төөлөр өйдө тургусу келбей, жинин б рк п оозун чоё ачуулуу боздошот,"},{"t":"p","h":"Б Чон кампанын ичи тоодой үйүлгөн эгин, Каптарды жонго салып, тактайдан жасалган трап менен кампанын тээ төбөсүнө жете жаздай бийик чыгып барып төгүш керек. Кампанын ысык чыккан тунукслүү стү тем р ис берип, буудайдын чаңы абада кылкылдайт."},{"t":"p","h":"Е – Эй бала, көзүңө кара, үстүнө жеткир! – деп, уйкусуз көздөрү кызыл болуп канталаган кампачы, төмөндө колун кезеп сөгүнөт."},{"t":"p","h":"Ал эмнеге сөгүнөт? Сөгүнбөй эле койсочу! Алдан тайып жыгылып эле калбасак, ансыз да көтөрүп жеткиребиз го."},{"t":"p","h":"Биз бул эгиндин мээнетин жалаң эле ушул жерде эмес, талаанын өзүнөн, аидоого дан таштагандан баштап, көтөргөнүбүз көтөргөн. Аны жаш аялмет катын-балдар жазы-жайы тынбай, тырмактап өстүрүп азыр да ошол өрт алган саратан талаада алда качан эскилиги жетип, күнүгө жүз жолу бузулган шалдыраган комбайнды бирде жүргүзүп, бирде кайра оңдоп комбайнер жанын уруп далбастайт. Азыр да ошол эгин майданында о к. чулар куланөөк таңдан караңгы түнгө чейин. уюп сыздаган белин жебей орок тартып, жерге түшкөн ар бир баш машакты кымындай балдардын колдору <span class=\"pg\" data-n=\"95\">95<\/span>терүүдө. Ошол күндөрдө биздин бардык тапкан-тергенибиз – фронттуку, ал биздин жеңиш үчүн берген тер менен каныбыз."},{"t":"p","h":"Али да эсимде: жаш өспүрүм мен ошондо карылуу жигиттер көтөрчү каптарды ийниме салып, каптын бир бурчун тишим менен кошо тиштеп, өйдө чыгып бара жатканда, кабыргам майышып, көзүм тунарыктайт. Кадам сайын траптын тактайлары ийилип, кампанын чаңдуу деми өпкөнү кысат. Нечен-нечен жолу алдан тайып, жонумдан ылдый жылбышып бара жаткан буума капты ыргытып жиберип, өзүм да траптан кошо кулап түшсөм деген ойлор кетчү, Бирок, артымда кап көтөргөн киши бар. Ал деле мага окшогон жаш бала же болбосо, төрөп-түшүп жүргөн аял чыгар. Эгерде согуш болбосо. мындай оор жүктү буларга ким көтөртмөк эле? Эркек мен эмес, аялдар ушинтип бел байлап иштегенде алсыздык кылууга акым бар беле?"},{"t":"p","h":"Тигине алдыда Жамийла жеңем кетип бара жатат. Этегин кыстарып, багалектерин өйдө түрүнгөн Жамийланын кара тору толмоч балтырлары булчун түйүп, толорсук тарамыштары үзүлүп кетчүдөй чыналган. Жүгүн жеңилдетейин дегендей, Жамийла каптын астында бүгүлө ийилип, бат-бат басат. Кээде гана менин күчтөн тайып бара жатканымды сезгенсип, ал токтоло калат да:"},{"t":"p","h":"– Чымыркан, кичине бала, аз калды эми! – деп коёт. Бирок, өзүнүн да үнү ошондо муунуп киркирейт."},{"t":"p","h":"Каптагы буудайды кызылдын төбөсүнө төгө салып, биз кайра тартканда алдыбыздан Данияр кезиге турган. Адатынча эч кимге кошулбайт. Ал унчукпастан, салмак менен бутун сылтый басат. Биз жандаша түшкөндө, оор тарткан боюн керип, көйнөгүнүн бырыштарын жазып келе жаткан Жамийланы Данияр эңкейген калыбында кабактын астынан кыйык тиктеп өтөт. Ал аны биринчи жолу көргөнсүп, ар дайым ушинтип карайт. Бирок, Жамийла муну оюна да алчу эмес. Биз бирге кошулуп иштегенден баштап, ал экөөнүн ортосундагы мамилеси ушул: Жамийла кээде анчейин тамаша үчүн тигиге үстөмдүк менен күлө сүйлөсө. кээде анын бары-жогун такыр эле унутуп салган өңдүү, эчтеке дебейт, карап да койбойт. Бул өзү Жамийланын көңүл иши. Көнүлү келсе жолдо келе жатып Жамийла мени: «Айда аттарды, кичине бала, кеттик!» – деп үндөп коёт да, отурган жеринен өйдө тура калып, камчыны үрөй кыйкырып, арабаны айдайт. Мен дагы калышпайм. Көз-ачып жумгандын ортосунда, жол баштап алдыда кетип бара жаткан Даниярды биз кууп өтөбүз. Чаңдын баары Даниярга капталып, ал артта калат. Бул өзү тамаша болсо да, адамдын ачуусу келе тургандай жорук. Ошентсе да Данияр таарынчу эмес. Чаңды буркуратып, биз жанынан өтүп бара жатсак, ал айыптуу немедей жай эле күлүмсүрөп, арабада тикесинен туруп. аттарды оңдон солго камчылап, каткырып айдаган Жамийланы. унчукпастан таныркап карайт. Кантип жатат болду экен деп, артыма кайрыла калам: тумандай коюу чаңдын арасында да Данияр ыраазы болгондой Жамийладан көзүн түшүрчү эмес, Анын ошол таңыркаган көз карашында жаш баланын шоктугун мейличи деп кечирген өңдүү мээрим да, ичтен тымызын күйүт чегип, эч кимге сыр айтпай, тарткан санаа да бар сезилет. Жамийланын ушундай жоруктарын. какшыктап күлгөнүн, жадагалса аны теңине албагансып, жанында жүрсө ага карабай, сүйлөбөй коюшун Данияр эч бир көңүлүнө албаган сыяктуу."},{"t":"p","h":"<span class=\"pg\" data-n=\"96\">96<\/span>баарына чыдап бир да жолу сөз кайрыган жок. Адегенде Даниярга менин боорум ооруп:"},{"t":"p","h":"– Жоош немени ушинте бергениң кандай, жеңе? – деп айтсам, Жамийла:"},{"t":"p","h":"– Ай, койчу ушуну! – деп колун шилтеп күлчү. – Бекер жүргөндөн көрө тамаша да! Аны эмне кудай алмак беле ошондон!.."},{"t":"p","h":"Жүрө-бара женемдин бул тамашасына мен да кошулдум. Анткени Данияр Жамийлага өтө эле кадала карай турган болду. Өзгөчө Жамийла кап көтөргөндө, ал иш арада токтой калгансып, көзүнүн кыйыгы менен аны карайт да турат. Ар ким эле өзүнчө убараланып, жумуш менен алек болгон көпчүлүктө мунусун эч ким байкабайт деп ойлойбу, айтор, үнү кардыккан арабакечтер кыйкырышып, ат-араба тыгылышкан станциянын базар сыяктуу тополоңдуу короосунда, жалгыз эле Жамийла элден башкача жаралгансып, канчалык кыйналса да. ээн-эркин жердегидей элпек кыймылдап, жайдары күлүп, чын эле көзгө көрүнбөй койбойт экен. Арабанын кырына тикесинен тургузулган буума капты Жамийла чалкалай берип, артынан кармаганда, бүт денеси ийиле созулуп, мойну, көкүрөгү керилип, күнгө күйгөн кара күрөн, чачтын өрүмдөрү узара түшкөндөй, артына салмактантып, чала жумган кирпиктердин арасынан көздүн каректери жалт эте түшөт, Ошондо кап көтөргөн Жамийла кампанын эшигине жеткенче, Данияр аны жанагы унурейе таңыркаган көз караш менен байкатпастан карап узатат. Бирок, мен муну байкап эле жүрдүм. Башта анча деле көңүлгө албасам да, кийинчерээк барып Даниярдын минтип жеңеме кызыгып караганы мага жакмак турсун, намысымды келтирди; эч кимге ыраа көрбөй кызганган женеме, башкалар го мындай турсун, Данияр дегенди кантип эле тең көрөт элем,"},{"t":"p","h":"«Тигини, ушунун да Жамийлада ою бар болсо керек, анан башкаларга сөз барбы! Ой тобо!» – деп ачуум келип кыжырланып жүрдүм."},{"t":"p","h":"Даниярды эми момун деп аямак турсун, аны жек көрө баштадым. Ушундан улам мен дагы жеңеме кошулуп, аны шылдың кыла турган болдум. Бирок, биздин бул жоруктарыбыздын аягы уяттуу болуп чыкты."},{"t":"p","h":"Эгин ташыган каптардын арасында таардан тигилген, жети пуддук бир чоң карала кап бар эле. Аны ар дайым жеңем экөөлөп кампага жеткирип, жерге төкчүбүз, – анткени, бир кишинин алы келе тургандай эмес болучу. Бир күнү кырманда арабаларды жүктөп жатып, жеңем экөөбүз жанагы карала капты Даниярдын арабасына таштап, үстүнөн башка каптар менен бастырып койдук, Чыны, кантер экен деп, тамаша кылдык."},{"t":"p","h":"Ушинтип, күн чыга кырмандан жол тарттык. Жолдо орус кыштагында бирөөнүн багына кирип, Жамийла экөөбүз алма уурдап чыктык да, жол катары каткырып күлүп келдик: Жамийла Даниярды «тос» – демиш болуп, аны алма менен уруп келатты. Алма түгөнгөндөн кийин, биз адатыбызча Даниярга чаң каптатып, жанынан өтө чаап, бир топ узап кеттик. Данияр бизди капчыгайдан чыга бериште гана кууп жетти. Темир жолдун өткүчү тосулуу экен, ачылышын күтүп турганбыз. Бул жерден станцияга бирге келдик. Мына ушулардын ортосунда жанагы жети пуддук кап эстен чыгып да калыптыр, оюбузда эчтеке жок, эгинди ташып бүтүүгө жакын калганбыз. Бир убакта Жамийла мени кабыргага түртүп Даниярды карай көзүн кысып, күлүп койду, Данияр арабанын үстүндө турган экен. «Муну кандай <span class=\"pg\" data-n=\"97\">97<\/span>кылсам?» – дегендей жанагы чоң капты тыяк-быягынан карап, Жамийланын күлкүгө какала түшкөнүн байкай койгондо, заматта кумсарып түнөрду, – сынап жатканыбызды түшүндү окшойт,"},{"t":"p","h":"—- Ай, неме, ыштаныңды өйдө тарт, шыпырылып калбасын! – дели, кыткылыктап тамашалаган Жамийла,"},{"t":"p","h":"Данияр аны жаман көзү менен акырая бир карап алды да, еШ бери булкуп, арабанын кырына тургуза салып, бир колу менен сүйө жерге секирип түштү. Биз «а-бу» дегенче болбой зылдай болгон үч жс нуна силкий көтөрүп эңкейген Данияр, кампаны көздөй басты. Адегенде, биз кантер экен деп, байкамаксан болуп, сыр алдырган жокпуз. Башкалар болсо, Даниярга сыра да көңүл бурушкан жок, элдин баары кап көтөрүп жүрбөйбү, ким менен кимдин иши бар эле. Данияр трапка жакындай келыр кайда алпарасың, соосуңбу, ташта ушул жерге, тамашаны амийла артынан жетти: рен – деп, Данияр аны кагып салды. Шагы сынган Жамийла йсүңбү? күлүмүш болуп эле, тиги трап менен өйдө чыга баштаган Даниярды арты-"},{"t":"p","h":"а ай, елерманын, көтөрүп бара жатат! – деп, айыптуу немедей бүдөмүк күлүп, сүйлөндү. Жамийла ошол бойдон кыткылыктап күлө эле берди, бирок барган сайын анын күлкүсү суз тартып, ал өзүн-өзү күлдүргөнгө окшоп жатты. Данияр тигиндей барып эле, жарадар ун күч келип, аксай баштаганда, биз аны кандай азапка салганыбызды ошонд т буту жарадар экенин эмне учун мурда ойлободук жа к. Ай, менин балалыгым ай! Муну ойлоп чыгарган шойкон мен эмес белем!"},{"t":"p","h":"– Кайт артына! – деп жиберди Жамийла, күлкү аралаш кыйкырып, Бирок, артка кайтууга да кеч болуп калган, Даниярга удаа кап көтөргөн ки-"},{"t":"p","h":"й"},{"t":"p","h":"и."},{"t":"p","h":"эмне болгонун эсим чыгып, өзүм да жакшы билбей калдым, Менин бир көргөнүм эле Данияр, Көз алдымда ошол сабадай лыкыйган чоң карала кап. Данияр анын астында бүгүлө ийилип, трап менен өйдө чыгып бара жатат. Жарадар бутун ал сүйрөй сылтып, ага канча күч келтирбөөгө аракеттенген менен, улам жаңыдан кадам шилтегенде ооруганына чыдай албай тиштене калып, башын чулгуйт. Данияр жогорулаган сайын, үстүндөгү зор карала кап, жонуна минип алган жандуу немедеи, аны оңдон солго теңселтип жатты. Жеңем экөөбүздүн бул ойлобой кылган кылмышыбызга ушунчалык уялып эсим чыкканынан денем өлүп, калчылдап кеттим, Данияр эмес кап көтөргөн мен, ошол сыздап ооруган ок тийген бут меники сыяктуу, ал тенселгенле кошо тенселгенсип, көзүм караңгылап жатты."},{"t":"p","h":"Тигине Данияр токтой калып, ээрдин кесе тиштеп, көзүн жумду. Менин да башым айланып, жер көчүп бара жаткансыйт. Бир оокумга эсим оогондой, эчтеке билбей калдым."},{"t":"p","h":"дөй болду. Мындай карасам Жамийла экен. Өңү жууган Кимдир бирөө билегимден карыштыра кармап, сындырып жио рчү- є пбоз, эриндери мурдагы күлкүнүн элесин сактаган бойдон чала ачыла берип, <span class=\"pg\" data-n=\"98\">98<\/span>көзүн Даниярдан албай, телмирип калыптыр, Биздин жаныбызга кампачы да, башкалар да жүгүрүшүп келишкен экен. Алар да эмне болгонун жакшы түшүнө бербей, Даниярды карашат."},{"t":"p","h":"Мына Данияр жүрүп бара жатып, ылдый жылбышкан капты оңдойм деп, аны өйдө силкти эле, туруштук бере албай тизелеп жыгыла баштады."},{"t":"p","h":"– Ташта! Ташта капты! – деп кыйкырып жиберди Жамийла. Данияр тил алган жок. Капты алда качан эле траптын четинен кулатып жиберсе болмок, ал анда арттагыларды да коюп кетпес эле, бирок өжөрлөнүп көгөргөн Данияр аны кылбады. Жамийланын үнүн укканда, ал кайра чымыркана калып, илгери умтулду. Азыраак барып, дагы кетенчиктеп теңселе бергенде, кампачы жаны чыккандай бакырды:"},{"t":"v","l":["– Ташта, ташта дейм, иттин баласы!","– Ташта! – деп, башкалар да кыйкырышты."]},{"t":"p","h":"Данияр бул жолу да өз дегенин бербей, нарыдан бери уруна, чайпалып, алга басты."},{"t":"p","h":"– Ой, мунуң таштабайт, айтты дей бер! – деди тургандардын бири, ошого көзү жеткен немедей колун шилтеп. Жалгыз ал гана эмес, жаныбызда тургандар да. кап көтөрүп Даниярдын артынан трап менен кошо чыгып бара жаткандар да. бул иштин тегин эместигин, мында бир сыр бар экенин, Данияр кап менен кошо кулап түшпөсө эле, ал аны эч убакытта коё бербесин түшүнүштү окшойт."},{"t":"p","h":"Бир оокумга сөз жок, үн жок унчукпай калышты."},{"t":"p","h":"Кампанын сыртында эшелонду ордунан козгоп, паровоз күүлөнүп вагондорду кагыштырууда. Өргө жүк көтөргөн аттай жата калып, Данияр траптын бийигинде. Теңселип жыгыла баштаганда, ал токтой калып күч жыйнап, кайра алдыга утурлайт, Даниярдын артынан келе жаткандар анын ыгына көнүп, ал токтогондо туруп калышып, ал басканда басышат. Даниярга каралап, алар да кубаттан тайып, кара терге түшкөн. Бирок, бири дагы аны сен деп, ооз ачып тилдеген жок. Ашуунун тайгак жолунда бирине-бири кармашып келе жаткандай: кап көтөргөндөр үнсүз тилсиз аракетте. Эгерде бири жаза тайып учуп кетсе, башкалар да анын артынан учуп кетчүдөй сезилет, Алардын ушул үнсүз кыймылында кандайдыр оор салмак, бир ооздон чыккан дем бар: Даниярга удаа келе жаткан аял буту чаалыгып, жыгыларына аз, бирок ал кудайдан өзүнө эмес Даниярга кубат сурап, ал үчүн арбактарга сыйынып жаткан өңдүү ага боор ооруп карайт. Мына эми аз эле калды, Данияр дагы чымырканса, траптын түз жерине жете бара тургандай. Ушул учурда алдан кеткен Данияр жарадар бутун аярлаганга чамасы келбей шалактап үстүндөгү капты коё бербесе, жыгылганы эле калды."},{"t":"p","h":"= Жүгүр! Артынан, сүйөп жибер! – дели мага Жамийла, өзү болсо Даниярды тосуп алчудай, шашканынан ага колун сунуп көтөрдү. Мен трап менен өйдө жүгүрдүм. Кап көтөргөндөрдүн арасынан сыгылып, көйнөгүмдү мыкка айрытып, Даниярга жете барлым. Жонуна жүк аркалап, эңкейген калыбында Данияр колтуктун астынан мени бир карап алды, Бетинен жыш тер куюлуп, маңдайындагы кан тамырлар жарылып кетчүдөй кабарган, көзүндө – каар менен жаш толгон. Даниярга жардамдашайын деп умтулдум элем:"},{"t":"p","h":"<span class=\"pg\" data-n=\"99\">99<\/span>– Тур нары! – деп ал заардуу киркиреп, анан капты өйдө силкип, жанын оозуна тиштегендей, акыркы күч менен андан-мындан аттап, алдыга жүткүндү."},{"t":"p","h":"Шишиген салмактанган колдору шалдырап, бутун сүйрөп Данияр траптан түшкөндө, томөндө күтүп турган эл, унчукпай тең жарыла берди. Жалгыз гана кампачы токтоно алган жок, Ачуусу келген бойдон Даниярга жулкунду:"},{"t":"p","h":"– Сен эмне бала, жиндеп кеттиңби, яа? Же мен ошончо ит белем: бир ооз айтсаң, алдагы жерге эле төктүрүп салбайт белем? Ким айтты сага ушундай каптарды көтөрсүн деп?"},{"t":"p","h":"– Ишиң болбосун, өзүм билем, – деди Данияр жай гана, анан чырт түкүрүп коюп, арабасын көздөй басып кетти. Жамийла артынан шыбырады:"},{"t":"p","h":"– Тамашаны түшүнбөгөн акмак?"},{"t":"p","h":"Ушуну айтканы менен өзү башын өйдө көтөргөн жок, Данияр аны уктубу, укпадыбы, бирок азыр кайрыла калып, бизге эмне десе да, женем экөөбүз анын бетин тик карай албас элек."},{"t":"p","h":"Айылга кайтып бара жатып, жол катары бирибиз да ооз ачып сүйлөгөн жокпуз. Данияр үчүн бул көнүмүш иш, – ал ансыз да сөзгө сараң, ошондон болсо да бүгүнкүсү бизге катуу тийип жатты: же анын биротоло жүз карашпай таарынганы ушубу, болбосо ак кенулдук кылып, жанагы болгондорду алда качан унутуп да койдубу, айтор ким билсин аны? Биздин унчукпаганыбыз го түшүнүктүү: бир чети уялгандан жер карап, бир чети – ороюраак болсо да, арам санатайы жок тамашаны Данияр чын көрүп, көңүлүнө жакын алганын жактырбай келе жаттык."},{"t":"p","h":"Эртең менен эгинди капка салып жатканда, Жамийла жанагы кырсыктуу карала капты алды да, буту менен басып туруп, тигиштерин эки колдоп айрып-айрып жиберди. Бөлөк-салагы чыккан таарды ал таразачынын алдына ыргытты:, Е"},{"t":"p","h":"_ Ме, ал алдагы таарынды! Бригадирине да айтып кой, экинчи мындай капты берчү болбосун!"},{"t":"v","l":["– Ой, сен өзүң соосуңбу, бул эмнең?","– Эчтеке эмес!.."]},{"t":"p","h":"Ошонун эртесинде күндөгүдөй станцияга келип, кашкарайганда кайра айылга жол тарттык. Данияр алдыбызда кетип бара жаткан. Анын таарынчысы, ызасы жазылдыбы! биле алган жокпуз. Аны билүү да кыйын эле. Ортобузда эчтеке болбогонсуп, Данияр мурдагыдай эле бир сырдуу, токтоо мүнөз?, Болгондо, кечээ эле жараатын аябай кокустатып алса керек, демейдегиден* катуураак аксап, өзгөчө кап көтөргөндө кыйналып жүрдү. Ал эчтеке дебесе да. ушунун өзү, биз күнөөлүү экенибизди бассак-турсак да, эске салып, көңүл оорутту. Деги эмнеси болсо да, Данияр бир ооз тамашалап, күлүп койсо, ушуну менен бардыгы өз жайына келип. унутулуп да калат эле."},{"t":"v","l":["т ызасы жазылдыбы – не прохолила обида","2 токтоо мүнөз – сдержанный характер","* демейдеги – в обычных, обыленных условиях"]},{"t":"p","h":"<span class=\"pg\" data-n=\"100\">100<\/span>Жамийла болсо ал дагы өз намысын бербейт, ошондо эчтеке жоктой сыр алдырбай, күлүмүш болуп!. сыртынан жайдары. Ушинткени менен нары жагында капаланып кайгы чеккени сезилип турду."},{"t":"p","h":"Мына ушинтип, биз айылга кетип бара жаттык. Чиркин, ошол күнү түн бөтөнчө жаралгансып, эң эле көрктүү болду."},{"t":"p","h":"Ким билбейт, жайдын толгон кезиндеги август түндөрүн! Асмандагы жылдыздар алыста турганы менен, ар бири өңүнө чыгып, алаканга салгандай? ар бири өзүнчө нур төгүп, чет-четинен бүлбүлдөгөн күмүш кыроо чалып, асмандын тиги бул капталына жайнап кири жок жадырап карашат,"},{"t":"p","h":"Жылдыздар ушинтип толгондо, биз капчыгай аралап“ келе жатканбыз. Аттар салкынданып, үйдү көздөй көнүлдүү жортууда. Араба качыр-кучур дунгуреп’, ташка тийген такалардан учкун чагылат. Капчыгайга сырттан келе берген сыдырым талаанын алда кайсы жеринен бүрдөгөн эрмендин кермек-ачуу жытын лепилдетип, жол катары шыралжын буруксуп, ушунун баары терге жибиген карамай жытына аралашып, адамды энги-денги® мас кылгансыйт. Жол үстүнө үңүлгөн аскалар кыйгач көлөкө таштап, нары сайдагы бадалдын арасында Күркүрөө жаңы тынбай Тээ артта калган темир жолдо поезддер көпүрөдөн нары өтүп, бери өткөн сайын жанырык ээрчитип, гудокторду алыска-алыска созолонтот*."},{"t":"p","h":"Ушундай түндө жол жүргөн кандай жакшы. Караңгыда термелген аттардын жондорун карап олтурсан, ушул түнкү дабыштарга кулак салып, ушул түнкү жыттарга мас болсоң кандай жыргал!"},{"t":"p","h":"Жамийла ошондо менин алдымда кетип бара жаткан, Тизгиндерди бош коё берип, ал эки жагына көз сала акырын гана кыңылдап ырдамыш болот. Биздин унчукпай, сүйлөбөй келе жатканыбыз анын көңүлүн басынтып жатты. Мен аны билип эле турдум. Чын эле ушундай түндө да унчукпай коюш болобу? Адам деген тилдүү”, жандуу!'!° болсо, анан табийгаттын ушул көрүнүшүнө жооп бербейби?"}],"sub":[{"title":"Алыкул Осмоновдун сүйүүгө арнаган темасы","b":2},{"title":"Суйуу жана мен","b":4},{"title":"Сулууга","b":6},{"title":"§ 1. Автордук сүйүүгө болгон мамилеси кандай?","b":8},{"title":"«Жамийла» повести","b":47}],"section":"Женишбек","pages":[70,100]},{"title":"Сырлуу жана кереметтүү обон","blocks":[{"t":"h3","h":"Сырлуу жана кереметтүү обон"},{"t":"p","h":"Адегенде Данияр мурункудай эле үнү кысталып батына бербей акырын баштады. Бирок, бара-бара үнү улам ичтен күч алып, арышын кең таштап, чабыты толгондо, капчыгай ичи баштан аяк жаңырып, алыскы аскалар Даниярдын обонун эки үч кайтара улантып жатты, Анын үнү дагы да чыйралып, күчөй баштады. Ошондо шаңшып созолонгон үнү гана эмес,"},{"t":"p","h":"' күлүмүш болуп – смеясь"},{"t":"v","l":["алаканга салгандай – как на ладони (фразеологизм)","› каптал – бок, сторона","* капчыгай аралап – по ушелью","* качыр-кучур дүнгүрөп – скрепя шумя","* энги-ленги – здесь: лурманит","тынбай алластайт – без перерывно метается","* созолонтот – вытягивается","* тилдуу – речистый","® жандуу – вытягивается"]},{"t":"p","h":"<span class=\"pg\" data-n=\"101\">101<\/span>Даниярдын обонунда болгон жалын менен чексиз мээрим адамды тан калтырып, жакасын карматты. Ушунун өзү эмне экенин, аны эмне деп айтарымды билбедим: ырчынын көмөкөйүнөн чыккан үн элеби, же болбосо андан башка, жүрөктүн өзүнөн оргуп төгүлгөн дагы бир нерсе барбы? Ал өзү эмне, ал эмне адамдын жанын эритип ой-кыялын ойготкон? Азыр да айта албайм."},{"t":"p","h":"Атаганат, колдон келсе кагазга жазып отурбай, бул укмуштуу обондун өзүн салып берсем кана."},{"t":"p","h":"Анын ыры сөзү жок эле ыр менен обон, Анда-санда гана бир ооз сөз айтып коюп, анан бир топко! чейин жөн эле үн салып демин тартпай безеленет. Деңиздин толкуну удургуп каптагандай, төктүрмө обон? ташынып, анын сөз айтууга чамасын келтирбей жатты. Бала болуп мен мындайды эч качан* угалек элем. Бул бир өзүнчө тубаса үн, тубаса обон. Жүрөгү зор адамдын кубанычын, тилегин, баяндаган зор обон! Ал кыргызчага, казакчага да окшобойт, бирок тыңшап турсан, бул обондо байыртан“ бир боордош кыргыз менен казактын тандалган” төл обондору ширетилип кошулгандай туюлат. Обон бирде, казактын учу-кыйыры жок ай талаасындай кенен агымда жайкалып, көйкөлсө, бирде кыргыздын зоокалуу тоолорундай, бийик заңгырап көкөлөйт. «Капырай! – деп жаттым мен. = Данияр ушундай экен да? Капырай, анын мындайы кимдин оюнда бар эле?»."},{"t":"p","h":"Капчыгайды басып өтүп, жолу даңгыр, жайкалган өзөнгө чыкканда, Даниярдын ыры көкүрөк черин жазып, жаңы күч менен талпынды. Өмүрү угуп көрбөгөн кереметтүү обондор, бирине-бири куюлушуп*, биринен бири өтүп алмашууда. Даниярга бүгүн эмне болгонун түшүнбөй жаттым. Так ушул бүгүн, так ушул саатта ай-күнү жеткендей, ичеги бук болуп камалган бардык сырын, байлыгын Данияр мына азыр ачыкка чыгарып, алтын чачыладай төгүп берди. Мына эми гана мен Даниярдын эмне үчүн маңыроо сыяктанып, элге күлкү болуп жүргөнүн, эмне үчүн кечкурунда Кароол-Дөбөгө чыгып барып, өзү жалгыз кыялга батып отурганын, эмне үчүн шаркырап ташынган суунун боюнча түнөп жүргөнүн, эмне үчүн кандайдыр угулар-угулбас дабыштарды тыңшагансып, ошондо кашы өйдө серпилип, көзү кубанычка толгонун, мына эми гана бир чети түшүнгөнсүдүм. Бул адам, жүрөгүнө чон сүйүү алып жүргөн адам! Анын бул сүйүүсү менин оюмча, канчалык ысык көрүп, шыгы түшкөн жалгыз бирөөгө гана арналган сүйүү эмес, кандайдыр бир андан да зор, андан да алп, турмуш-жашоонун өзүнө, жан берип, жан жараткан адамдай жерге, жарык дүйнөгө болгон өлчөмү жок чоң сүйүү! Көрсө, ал ушул сүйүүнү көкүрөгүнө сактап өчүрбөй, ошону менен жашаган адам экен. Эгер андай эмес башкача бол-"},{"t":"p","h":"' бир топко – налолго"},{"t":"v","l":["? обон – мелодия","› мындайды – такое","+ эч качан – никогда","* ой-санаасы – мысли","* байыртаи – издавна","' тандалган – избранные (лучшее)","* куюлушуп – сливаясь","* ачыкка чыгарып – открыто"]},{"t":"p","h":"<span class=\"pg\" data-n=\"102\">102<\/span>со, эгерде ал дити супсак, жүрөгү муз болсо, жаратылыш аны кандай гана тандайы жок обончу кылбасын, ал азыр минтип ырдай албайт эле."},{"t":"p","h":"Даниярдын обону ушул кезде түнкү өзөндүн үстүнөн жайыла каалгып, көзү илинип, мемиреп бара жаткан кең талаанын бешигин алдейлеп терметкендей, алыска жумшак созолонуп, акырындап өчөрүндө жаныдан безелене үн алып, талыкшып уюган жерди кайра ойготуп, уйкусун ачат. Өзү дем берип, өзү жараткан ырчыны ойгонгон албан талаа кулак салып, тыңшап жатты. Тигине, арык бойлой жарданып, орок күткөн эгиндер ай жарыгында күүгүм көлөкө ойнотуп, үстү-үстүнөн көлкүлдөп ыргалат. Жолдон окчун жерде эски тегирмендин кыркалекей теректери жалбырак дирилдетип, алда эмнени угузбай шыбырашкансыйт. Суунун аркы маңдайында, белес-белесте кырманчылар от жагышып, эртеңки көжөсүн кайнатууда, Тигине, кимдир бирөө алда кандай иш менен шашылып, кокту бойлой далбаңдап, кыштакты көздөй чаап бара жатат. Алдыда кыштактын бакдарагы дүпүйүп, андан келген жел эзилип бышкан алманын ширесин, сото кучактап гүлдөгөн жүгөрүнүн балыр таттуу дүмбүл жытына, короолордо жайылган тезектердин жылуу демине аралашып, аңкытат,"},{"t":"p","h":"Данияр дагы көпкө чейин обон салып, ырдап келди. Чалкыган август түнү аны тыңшап, обонго арбалгандай терең тынчтыкта уюп магдырады, ал түгүл аттар да, арабаларды жай терметип, жай басышты. Мына ушинтип, адамдын денесин балкыта, толукшуп ырдап келе жаткан Данияр бир убакытта үнүн бийик закымдата келип, ырын чорт токтотту да, аттарга ала-сала камчы уруп, айдап жөнөдү. Менин оюмда Жамийла дагы анын артынан түшөт экен деп, тизгиндерди жыйып, алардын сонунан калбай, утурламак болдум. Бирок Жамийла козголуп да койгон жок. Башын бир жагына кыйшайткан калыбында терең кыялга чөгүп, нес болгон сыяктуу ошол бойдон былк этпей отура берди, Обондун абада калган учкундары дагы эле көкөлөп жүргөндөй, Жамийла аны сыйкырланып, тыңшагансыйт."},{"t":"v","l":["красивый протяжный голос","көмөкөйүнөн чыккан үн – голос издающийся из языка","безеленет – заливается","зоокалуу – наслаждённый","зангырай көкөлөйт – громко взвивает","маныроо – бестолкопый, медалёкий, простоватый","угулар-угулбас – еле слышный","дити супсак – без желания","кыркалекей – вытянуишиеся в ряд","шыбырашкансыйт – будто шепчет","дүпүйүп – зеленест","дүмбүл – корень","утурламак болдум – решил повторять","тыншахгансыйт – будто прислушивается"]},{"t":"p","h":"&lt; 1, Сейит Жамийла жөнүндө эмне леп айтып берди, ага кандай мүнөздөмө берди?"},{"t":"p","h":"2. Данияр Сейиттин айылында качан пайда болуптур? Анын мүнөзү канлай?"},{"t":"p","h":"3. Жамийла бекеринен Даниярды шылдыңдачу эмес. Балким, бул сүйүүлүр кандай деп"},{"t":"p","h":"ойлойсуң?"},{"t":"v","l":["4. Данияр каидай «сыноодон» өттү?","$. Танлап алган үзүндүнү көркөм окугула, жатка айткыла."]},{"t":"p","h":"<span class=\"pg\" data-n=\"103\">103<\/span>6. Даниярдын обонунуи ары жагында катылып жаткан сырды жана маанини аныктап 7. Даниярдын обонунан кийин Жамийла менен Сейиттин ички дүйнөлөрүндө кандай айтып бергиле. өзгөрүүлөр болду?"},{"t":"v","l":["8. Данияр менен Жамийланын сүрөтүн тарткыла.","","«Жамийла» агтуу корком фильмди көрсөтүү.","","&lt; Көркөм тасма көрсөтүү. Фильм боюнча тапшырмалар.","|. Тасманы кунт коюп көргүлө.","2. Фильмдеги негизги окуя эмне жөнүндө?","3. Башкы каармандары ким”","4. Аларга кандай мүнөздөмө бересиңер?","$. Аларлын сүйүүсү кандай?","6. Фильм тууралуу ой-пикиримерди жалгыла.","","1928-жылы 12-декабрда Чыңгыз Айтматов туулган."]},{"t":"p","h":"1952-жылдан баштап аңгемелерин кыргыз тилинде жарыялай баштаган."},{"t":"p","h":"1948- 1953-жылдары Фрунзе шаарындагы Айыл чарба институтунда окуган, окуусун аяктагандан кийин уч жыл мал чарбачылыгы боюнча илим-изилдөө институтунда иштеп, ошол эле убакта чыгармаларын жазып, басмадан чыгарып турган 1956-жылы Москва шаарындагы Жогорку адабий курска өткөн."},{"t":"p","h":"1958-жылы курсту аяктаган. «Октябрь» журналына «Бетме-бет» аңгемеси (кыргыз тилинен которулуп), «Жаңы дүйнө» журналына башка чыгармалары басылган. А йтматовду дүйнөгө белгилүү кылган «Жамийла» повести жарыкка чыккан."},{"t":"v","l":["1961-жыл – «Кызыл жоолук жалжалым».","1962-жыл – «Биринчи мугалим».","1966-жыл – «Гүлсарат».","1970-жыл – «Ак кеме», «Фудзиямадагы кадыр түн» драмасы.","1975-жыл – «Эрте жаздагы турналар».","1977-жыл – «Деңиз бойлой жорткон Ала-Дөбөт».","1980-жыл – «Кылым карытар бир кун».","1986-жыл – «Кыямат».","1990-жыл – «Ч эзияга болгон тубаса шы- үнү ту хе гын ойготууга аздыр-көптүр себепчи болгон. Ошондон улам ал Аалы Токомбаевдин, Алыкул Осмоновдун ырларын ынтызарланып окуган. Адабият мугалими болсом деген тилек дегдеткен."},{"t":"p","h":"Бирок анын бул ой-максатынын ишке ашышына гитлердик Германиянын СССРге кол салышы каргаша болуп, ал 1942-жылы согушка жөнөөгө мажбур болгон. Эл-жерин сагынуусу поэзия болуп төгүлүп, майданда жүргөндө атаэнесине, тууган-туушкандарына ыр менен кат жазчу. Согуш деген согуш, ал поэзияга ынтызар жигитти аябады, катуу кармашта оор жарадар болду. Өлүм менен өмүрдүн чегинде алты ай жатты, 23 жашында инвалид болгон Сүйүнбай 1944-жылы майдандан кайтып, өз туулган жерине келет да, райондук гезитке жооптуу катчы болуп иштеп калат. Андан кийин Талас областтык «Ленин туусу» гезитинде жооптуу катчы катары иштеп жүрүп, кез-кез өз ырларын гезиттерге жарыялап турат. Бирок ыр жазган менен С үйүнбай өзүн акын катары эсептебей, көбүнчө журналисттик кесипте калемин сынайт,"},{"t":"p","h":"1949-жылы С. Эралиевдин ырлар жыйнагы «Биринчи жаңырык» деген ат менен республикалык басмадан жарык көрүп, дароо эле СССР Жазуучулар союзуна мүчө болуп кабыл алынат. Бул күтүлбөгөн кабар менен Талас жергесине келген Насирдин Байтемиров С, Эралиевди кубанычка белеп, жазуучулук билетти колуна тапшырат. Ошого удаа эле 1950-жылы акындын «Тууган жер» деген экинчи ырлар жыйнагы жарыяланат. Муче болуп өткөнүнө жана эки ыр китепти жарыялаганына карабастан, С. Эралиев өзүн дале болсо профессионал акынмын деп эсептебейт. 1951-жылы ал Москвадагы жогорку партиялык мектепке окууга барып, анын журнадисттик бөлүмүнө өтөт. Мына ушул жерден ал өзүнүн чыныгы өмүрлүк кесибин биротоло тандап алуу бактысына кез болот, Жогорку партиялык мектепте окуп журген жылдары С. Эралиев орус элинин көптөгөн таланттуу акындары менен жолугушат. Бир жолу ал «Новый мир» журналынын ошол кездеги башкы редактору, залкар акын А. Твардовскийге барып, көпкө аңгемелешүү учурунда, анын «Василий Тёркин» деген белгилүү поэмасын = которуп жүргөнүн айтат. А. Твардовский адегенде оир аз күдүктөнүп, поэ- з <span class=\"pg\" data-n=\"106\">106<\/span>ма орус элинин нукура жандуу оозеки кеби менен жазылгандыгын, аны кыргыз тилинде кантип кайра «сүйлөтүүгө» болорун сурап, анан ага баалуу кеп-кеңештерин айтат. С. Эралиев «Василий Тёркин» поэмасынын теңин которууга үлгүрөт. Калганын окууну бүтүп Кыргызстанга келген соң адегенде «Советтик Кыргызстан» гезитинде бөлүм башчысы. анан «Кыргызстан пионери» гезитинин редактору болуп иштеп турганда бүтүрүп, 1956-жылы толугу менен жарыялайт. «Василий Тёркин» поэмасын которуу С, Эралиев үчүн эн чоң машыгуу, такшалуу мектеби болгон. Поэма чоң чеберчилик, эргүү, сүйүнүү менен которулган жана поэзиянын эпикалык формасында иштөөнүн көптөгөн сырларын түшүнүүгө мүмкүндүк берген. Поэманын которулгандыгы тууралуу ал жылдары республикалык басма сөздөрдө, борбордук «Литературная газетада» көптөгөн пикирлер айтылган. Мына ушул поэтикалык чоң сыноо-тажрыйбанын дурус ишке ашканынан кийин гана С. Эралиев, профессионал акын болдум го деп эсептеп, өзүн акындык жолго биротоло багыттаган, Көп убактар бою оригиналдуу чыгармаларды жазбай калган акын кайрадан чыгармачылык эргүүгө келип, «Ак Мөөр» поэмасын жазып бүтүрүп, ал 1959-жылы жарыяланган. Мына ушул поэма менен С. Эралиев өзүнүн нукура чебер акын экендигин бүткүл калайык калкка толук айкындай алды,"},{"t":"p","h":"Сүйүнбай Эралиевдин лирикалары менен поэмалары улуттук көркөм ойдун өнүгүшү жана жаңыланышы үчүн дайыма салым болуп келген."},{"t":"p","h":"60-жылдардан тарта акын кыргыз ыр түзүлүшүнө өзүнчө жанылыктарлы киргизе баштаган. Эркин ыр формасын колдонуу менен ал кыргыз поэтикалык ойлоосунун жаңы мүмкүнчүлүктөрүн ачкан. Айрыкча акындын «Уяң жылдыздар» (1962), «Жылдыздарга саякат» (1966), «Өмүрлөргө саякат» (1967), «Жол» (1969) сыяктуу чыгармалары поэма жанрынын тарыхындагы көрүнүктүү окуялардан болуп калган."},{"t":"p","h":"С. Эралиев жаратылыш жандуу акын. Ырас, жаратылышка кайрылбаган, аны менен жуурулушпаган акын бол

торулат. Касымалы Жантөшевдин чыгармачылык иши мына ушул педтехникумда окуп жүргөн учурунан башталат. 1930-жылы техникумду бүтүргөндөн кийин Кыргыз АССРинин агартуу комиссариатында методист, мугалим, Ош облоносунда инспектор, Өзгөндө окуу бөлүмүнүн башчысы болуп, эл агартуу майданында өтө активдүү иштейт. Бул жылдары ал «Окуу китеби», 1-жылдык үчүн (1930), «Сабатсыздар үчүн кыргыз тилинин программасы жана окуу методу» (1931), «Колхозчулар үчүн окуу китеби» (1931), «Мектеп балдарынын тилин өстүрүү жөнүндө» (1932), «Эсеп чыгаруу жолдору жана бөлчөктөр» (1932) сыяктуу окуу-методикалык куралдарды жазат, Эмгек жолун Кыргыз педтехникумунда окутуучу <span class=\"pg\" data-n=\"23\">23<\/span>болуп иштөөдөн баштаган, 1931—1933-жж. Кыргыз АССРинин Эл агартуу комитетинде усулчу, РайОНОнун башчысы."},{"t":"p","h":"Касымалы Жантөшев 1934-жылдан 1946-жылга чейин Кыргыз мамлекеттик драма театрында артист, режиссер болуп иштеп, андан кийин бир нече жылдар бою Кыргызстандын искусство иштери боюнча башкармасынын алдындагы драмалык бөлүмдө редактор, башкы редакторлук кызматтарды аткарган. 1949—1951-жж. Кыргыз ССРинин Наркоматында начальник, 1964—1968-жж. Кыргыз ССРинин Маданият министрлигинде репертуардык-редакциялык коллегиянын башкы редактору болгон."},{"t":"p","h":"Кыргыз адабиятынын өнүгүшүндөгү сиңирген зор эмгеги бааланып, ал «Эмгек Кызыл Туу». эки жолу «Ардак белгиси» ордендери, «Эмгектеги артыкчылыгы учун», «1941-1945-жылдарлагы Улуу Ата Мекендик согуштагы каарман эмгеги үчүн» медалдары менен. Кыргыз ССР Жогорку Советинин Президиумунун Ардак грамоталары менен сыйланган. Кыргызстандын «Эл жазуучусу» деген ардактуу наам берилген,"},{"t":"p","h":"Жазуучу, драматург, артист, режиссер Касымалы Жантөшевдин урпактарга белек этип калтырган адабий мурасы бай жана баалуу. Ал мурастар – көп пландуу залкар «Каныбек» романы баштаган прозалары, «Курманбек» баштаган ондогон драмалары."},{"t":"p","h":"К. Жантөшевдин чыгармачылык жолу педтехникумда окуп жүргөн мезгилинде башталган. Ал ийримдер үчүн бир катар бир актылуу пьесаларды жазган."},{"t":"p","h":"«Каныбек» романы жана «Курманбек» драмасы Кыргыз улуттук маданиятынын алтын фондусуна кирген. Жазуучунун калемине ошондой эле «Хан-Теңирлик чабан» (1963-ж.) романы, «Тилек» (1949-ж.), «Жалындуу жаштар» повесттери (1951-ж.) жана көптөгөн аңгемелери, балдар үчүн жазылган жомоктору таандык. 1957-жылы элдик оозеки чыгармачылыктын мотиви боюнча жазылган «Мендирман» поэмасы өзүнчө басылып чыккан."},{"t":"p","h":"К. Жантөшевдин чыгармалары орус тилине да которулган."},{"t":"p","h":"А. Н. Островскийдин «Бесприданница» пьесасын («Сепсиз кыз»), Н. Островскийдин «Как закалялась сталь» («Болот кантип курчуду») романын ж. б. чыгармаларды кыргыз тилине которгон."},{"t":"p","h":"Кинодраматургия жаатында ал «Девушка из Тянь-Шаня» фильминин сценарийин жазган. Анын «Каныбек» романы «Кыргызфильм» киностудиясында экрандаштырылган. К. Жантөшевдин ысмы Ысык-Көл облустук драма театрына, билим берүүчү мектептерге жана китепканаларга, республиканын шаарларынын көчөлөрүнө жана айылдарына берилген."},{"t":"v","l":["№ окүллөрүнүн бири – один из крупных основателей","кедей-кембагалдардын – нищих, обездолениых","оркундетуу – развивать","намыстан – стыдиться","ардак – почёт","мурастар – наследники","залкар – великий, выдающийся"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"24\">24<\/span>«Каныбек» романы жөнүндө"},{"t":"p","h":"«Каныбек» романы кыргыз элинин бери болгондо отуз-кырк жыл чамасындагы мезгилде, башкача айтканда, XX кылымдын акыркы жылдарынан тартып, Октябрь революциясынын жеңишинен кийин Кыргызстанда граждандык согуш аяктаганга чейинки башынан өткөргөн коомдук-саясий окуяларды, социалдык экономикалык турмушту, таптык карама-каршылыктарды жана күрөштөрдү, ошону менен эле катар кыргыз элинин үрп-адат, каада-салтын кеңири полотнодо чагылдырган бирден бир социалдык-турмуштук роман."},{"t":"p","h":"Романдын негизги идеялары:"},{"t":"p","h":"1. Романдагы эн башкы идеялардын бири – элдин эркиндик, теңдик үчүн болгон күрөшүн көрсөтүү болуп саналат, Феодалдык коомдогу теңсиздикке каршы күрөш Каныбектин образына тиешелүү мүмкүн болгон эволюциялык өнүгүштө сүрөттөлөт."},{"t":"p","h":"2. Романдагы негизги идеялардын дагы бири – бул достук идеясы. Кыргыз эли эзелтеден эле улутунун ким экендигине карабай адилет иш үчүн дайыма достук колун сунуп келген. Автор бул идеяны Самсахун менен Каныбек, Алымдардын, Муслимахун менен Анархан, Каныбек Дарыяхандардын, Каныбекти чыгарып алууга жардамдашкан уйгур жигити Ли- Чан, дарыгер чалдын, эң акырында Каныбектин Сибирь түрмөсүндөгү орус досторунун иштеген иштери, кылган жардамдарын ишенимдүү сүрөттөө менен иш жүзүнө ашырган."},{"t":"p","h":"3. Романдагы башкы идеялардын дагы бири – бул таза, гумандуу сүйүүнү даназалоо. Каныбек менен Анархандын ортосундагы сүйүү чыныгы таза сүйүүнү күбөлөп турат."},{"t":"h3","h":"Романдын башкы каармандары"},{"t":"p","h":"Каныбек өзүнүн азап чеккен кембагалдыгына, таалайсыз шордуулугуна карабастан адамгерчилик жогорку сапатты эч качан жоготпойт. Ал адамдар үчүн боорукер, Ошондуктан ал Жума, Муслимахун, Жолой, Чоко, Адыл сыяктуу карапайым адамдарга дайыма жылуу-жумшак мамиле жасайт. Колундагы болгондорун алар менен дайыма тең бөлүшөт. Бардык адамдарды бирдей көрүүгө аракеттенет. Каныбек чыныгы таза сүйүүнү даңазалаган адам. Ал шайыр, ал комузчу да, ырчы да, обончу да. Каныбек чыдамкай да, кайраттуу да. Ал мезгили келсе өлүмдөн да жалтанбайт. Каныбектин образы кылымдын аягы XX кылымдын башталышындагы адилеттүүлүк үчүн күрөшкен, эмгекчи массанын арасынан чыккан кыргыз уулдарынын таалим-тарбия бере турган образы."},{"t":"p","h":"Романда сүрөттөлгөн окуялардын масштабдуулугуна, мезгил мейкиндигинин узактыгына жараша анда катышкан каармандар дээрлик көп. Айталы биринчи китепте бизге жакшы тааныш болгон – Чоң койчу, Жапек, Кубат, Жума, Алым, Чокол, Бегайым менен Анархан жана башкалар сыяктуу оң каармандар. Экинчи китепте – Муслимахун, Маманазар, Темир, Жапектин жары Айбала дагы башкалар сыяктуу оң каармандар менен толукталган."},{"t":"p","h":"<span class=\"pg\" data-n=\"25\">25<\/span>Романда кыргыз аялдарынын революцияга чейинки теңсиз тагдыры, аларга карата болгон ар кандай мазактоолор, кордоолор, жырткычтык мамилелер Анархан образы аркылуу таамай жана ишенимдүү берилген."},{"t":"h3","h":"Романдын терс каармандары"},{"t":"p","h":"Мына карапайым калкка таш боор, зыңгырап, мансап күткөн митайым Түлкүбек, бийлик, атак-даңк үчүн айла-амал, алдамчылыкка барышкан Айдарбек датка менен Сооронбай болуш, араб-фарсы сөздөрүн аралаштыра сүйлөп, эл алдында «олуя» көрүнүп, бирок тымызын ыплас иштер жүргүзүшкөн Түнкатар молдо менен афанди кейпинде кубулган Камалбек – булар бири-биринен кескин айырмалуу, бирок бардыгында бир гана максат – элдин эсебинен баюу, аларды эзүү."},{"t":"p","h":"Жалпысынан алганда «Каныбек» романы кыргыз жазма адабиятынын тарыхында көрүнүктүү орунду ээлеген роман."},{"t":"v","l":["коомдук-саясий – обшественно-политический","үрп-адат – совокупность народных обычаев и установлений","теңдик – равенство, равноправие","теңсиздикке каршы – противостояние","өнүгүш – развитие","кембагалдыгына – на бедность","боорукер – любезный, отзывчивый, добрый","даназалаган адам – прославляющий","таш боор – жестокосерлый","зынгыра – иметь вид могучего","атак-данк – честь, слава","эзүү – перен. гнёт, угнетение, притеснение"]},{"t":"h3","h":"§ 1. К. Жантөшевдин чыгармачылыгына жалпы мүнөздөмө бергиле."},{"t":"p","h":"2. К. Жантошевди прозаик жана драматург катары негиздегиле, аны драматург катары"},{"t":"p","h":"тааныткан чыгармасы кайсы?"},{"t":"p","h":"3, К. Жантөшев чыгармачылыгын кайсы жанрдан баштаган, прозаданбы же драмаданбы? 4, «Каныбек» романы, аныи кыргыз прозасында алган орду."},{"t":"h3","h":"Каныбек"},{"t":"v","l":["(Романдан үзүндү)","Кулун жал болсо мингеним,","Кулун тон болсо кийгеним.","Куурасам акыл табышар,","Кумар көз болсо сүйгөнүм."]},{"t":"p","h":"Нура суусунун батыш өйүзүндөгү бийик тоо күндү жашырып, Улуу- Чаттын ичин ала көлөкөгө айландыргандыктан, табият Каныбек үчүн бүгүн бөтөнчө бир көрүнүштө, Тиги суунун боюнда кырка тигилген аппак үйлөр турса, ошол үйлөрдүн ар биринин жанындагы кемегеден чыккан түтүн жүлүндөй! болуп көккө карай созулуп барып жок болууда, Ошол кырка тигилген үйлөрдүн"},{"t":"p","h":"' жүлүндөй – стройный <span class=\"pg\" data-n=\"26\">26<\/span>арасындагы жөө кишилердин кыймылы, жай бастырган, шашып чапкылаган аттуулардын аракети, тушаган, өрөөлөнгөн, үч бутталган аттардын ар жерде топ-топ болуп жайылышы, кай бир жерде ат кубалап кыйкырган адамдардын үнү, кандайдыр бир! сонун сыяктанат."},{"t":"p","h":"Каныбек ошолордун бардыгын көзү менен көрүп, буту менен басып аралагысы келет. Бирок эрки жок... «Мени эркин бастырбай, эчен кызык тамашаны көрсөтпөй, бутумду жипсиз байлап отурган силерсинер!» деген ой менен Каныбек кабагын түйө терең улутуна дем алып, айылга карай бет ала жайылып жаткан койго караганда, койдун ылдыйкы четине эки жөө киши келип токтой калганын көрдү. Ал кишилердин төмөн? жагында элүү чакты аттар жайылып жатат."},{"t":"p","h":"Кишилер сырткы чапандарын чечип, алдыларына таштай отурушту да, бирөө чоор тарта кетти. Анын чоорунун үнү Каныбек үчүн алда кандай укмуш, эң тендеши жоктой сезилди. Ошол чоордун үнүндөгү касиет өзүнө карай тарткансып, Каныбек акырын кадам шилтегенин байкабады. Ал. тиги эки кишиге жакын барып чоор уккусу келсе да, чочулагандыктан, көп жакындабай токтой калды."},{"t":"p","h":"Тиги чоор тарткан киши чоорун токтотуп, Каныбекти чакыргандай колун булгалады'."},{"t":"p","h":"«Койго өтө сак бол, балам. Адам кымгуут, аш жеткенинен жетпегени көп, коюңан уурдап кетишпесин» деп, мындан төрт күнү мурун атасы Сансыз айткандыктан, Каныбек чочункурай* басып барып окчун токтой калды да:"},{"t":"p","h":"– Салоомалейкум, акелер!"},{"t":"p","h":"– Алекиме салам, жигит. Бери жакын кел. Бул көп койду кайтарып жүргөн сенсиңби? – деди Жума сакалын сылай берип,"},{"t":"v","l":["– Ооба аке!","– Бул ким деген байдын кою?","– Түлкүбек деген бектин кою."]},{"t":"p","h":"– Кайсы Түлкүбек? Агасы Шамырбекке аш берип жаткан Тулкубектин коюубу? – деп, Эсен ордунан козголуп койду*."},{"t":"p","h":"– Ооба!"},{"t":"p","h":"– О-о!.. деп, Эсен Түлкүбектин байлыгына таңдангандай Жумага карады."},{"t":"p","h":"– Сен ким дегендин баласысың? – деди, Жума өтө мээримдүү көрүнүштө."},{"t":"p","h":"– Мен... деп, Каныбек мукактана ылдый карай берип, – мен Түлкүбектин Сансыз деген жигитинин баласымын."},{"t":"p","h":"– О-о... жигитинин баласына кой кайтартып жүрсө Түлкүбек чын эле бек экен го? – деп, Эсен күлүмсүрөй* Жумага караганда, Каныбек атасынын кул экенин жашырып, «жигитинин баласымын» деп, калп айтып жибергенине уялып кызара түшкөнүн Жума сезе коюп:"},{"t":"v","l":["' каидайдыр бир – какой-то","– низ, вниз","* булгала – махать рукой","* чочуцкура – побзиваться","* козголуп койлу – слвинулся","* кулумсуре – улыбаться"]},{"t":"p","h":"<span class=\"pg\" data-n=\"27\">27<\/span>– Ушунчалык кеп койду жалгыз кайтарсан, азамат экенсин, – деп Каныбектин көңүлүн жайгара! караганда, анын жип куруна кыстарылып турган чооруна көзү түштү. И, айланайын, сен чоор тартасынбы?"},{"t":"p","h":"Каныбек калп айтып жиберип уялгандыгынан жана Жуманын чоор? тартканын уккандыктан, мен чоор тартамын деп айталбай терс карай берди."},{"t":"p","h":"– Ой, жаман жигит белемсин. Атаңдай киши сураганда жооп бербейсинби? Эмнеден уяласың? Чооруңду бери кылчы! – деди Эсен жайдарылана."},{"t":"p","h":"– Тарта албайм. Жаны эле үйрөнөйүн деп... – деди да, Каныбек андан аркы сөзүн айталбай, белиндеги чоорун алып Эсенге карай сунду."},{"t":"p","h":"– О-о, жасалышы, көзөлүшү кадимкидей}, – деп, Эсен чоорду имерип карап турду да. Жумага сунду."},{"t":"p","h":"Жума чоорду ары-бери“ имере карап отурду да:"},{"t":"p","h":"– Ата, балам а, жакшы эле жасапсын. Бирок өтө саздуу жердин сары куурайы тура, саздын четирээк жагындагы каксоого чыкканын алсан үндүү болмок, – деди да, чоордун оозун тазалап, ичин эки-үч үйлөп тарта баштаганда, Каныбек лып этип Жуманын маңдайына отура калды."},{"t":"p","h":"Каныбек чоор тартууну Атабектин койчусунан жаңы үйрөнүп жүргөн. Чоор тартуу жагынан, Каныбек үчүн Атабектин койчусунан өтөр киши жоктой туюлчу. Бирок, мына бул кишинин тартышы тири шумдуктай? угулат. Колу менен жасаган чоорду бардык сырын жашырып жүрүп, эми гана, тиги кишинин оозуна тийгенде жер чечегин безеп, ошол кишиге дүнүйө сырын айтып жаткандай болот. Каныбектин көздөрү бажырайып\", өнүнө күлүмсүрөө пайда болуп, көкүрөгүн илгери кыла Жумага карай жүткүнүп баратканын сезбеди."},{"t":"v","l":["Жума чоорду токтотуп, Каныбекке күлүмсүрөй карап:","– Мен эмне тартканыма"]},{"t":"p","h":"– Сиз «кырой-кырой аксак кой» дегизип тарттыңыз! – деп, Каныбек өтө кубанычтуулук менен тез жооп берди."},{"t":"p","h":"– О-о, – деп Каныбектин куу’ ажыратканына кубангандай. жантайып жаткан Эсен өйдө боло калды."},{"t":"p","h":"– Чоорун начар экен, жакшы чоор жаңы үйрөнчүккө көп жардам берет! – деп, Жума өзүнүн чоорун алды да, – атың ким?"},{"t":"p","h":"– Атым Каныбек!"},{"t":"p","h":"—- Каныбек жакшы ат экен. Кана, Каныбек, менин чоорум менен тартып көрчү! – деп, Жума чоорун Каныбекке сунду."},{"t":"p","h":"– Мен сиздей тарта албайм! – деп, Каныбек, чоорду албай жер карады."},{"t":"p","h":"– Ал, алагой, билгенинче тарт! – деп, Эсен чоорду Жуманын колунан алып, Каныбекке кармата салды."},{"t":"p","h":"Жаны жасалган чоор колуна тийгенде. Каныбектин бүткөн бою чы-"},{"t":"p","h":"' жайгар – привести в порядок, наладить"},{"t":"v","l":["1 чоор – дуда, пастушеская свирель, жалейка","5 кадимкидей – обыкновенный, обычный","* ары-бери – тула-сюда","* шумдуктай – невероятный"]},{"t":"p","h":"* бажырай – быть большими, навыкате (о красивых глазах на приятном полиом лице)"},{"t":"p","h":"күү – мелодия <span class=\"pg\" data-n=\"28\">28<\/span>мырап, эки колу ысып кетти. Чоорду темир дейин десе темир эмес, жыгач дейин десе жыгач эмес. Чоордун аяккы жаккы үстүндө үч тешик!, алдында эки тешик... Чоордун ичине караса жыгач сыяктуу?, а сырты такыр түшүнүксүз бирдеме,"},{"t":"p","h":"– Тартып көр айланайын, Каныбек, кандай тартарыңды угайын. Эгер чоорчу болгудай шыгың} болсо, чоор жасап берем! – деп Жума айтканда, анын аталык чын ниети менен айтканын Каныбек сезди. Ашка келген бир бейтааныш атадай камкордук менен сүйлөгөнүнө Каныбек өтө сүйүндү."},{"t":"p","h":"– Тарта албайм, ата, жаны гана үйрөнүп жүрөм! – деп, Каныбек чоордун учун оозуна салып, «кырой-кырой аксак койдун» бир гана кайруусун тартканда, чоор өзү эле күү келитип жаткандай боло түшкөндүктөн, күүсүн токтото коюп, бир эсе Жумага, бир эсе чоорго таңдана карады."},{"t":"p","h":"– И-и... Каныбегимдин идиреги бар экен! – деп, Жума эмнегедир кубангандай боло түштү."},{"t":"p","h":"Эсен Каныбектин колундагы Жуманын чоорун көрсөтө:"},{"t":"p","h":"– Эртең жоондугу ушундай сары жыгач жана бир койдун кызыл өңгөчүн таап келсен, бул атан сага да ушундай чоор жасап берет."},{"t":"p","h":"– Жо-жок... Каныбекти байкашыма караганда менин чоорума кызыгып турат, Эсен! – деп, Жума жылмая“ Каныбекке карап, – ошол чоорду сен ал айланайын! Алайдан келген Жума деген киши берди де. Ал, Жума өзү комузчу. сурнайчы, кыякчы, чоорчу экен. Ушунчалык өнөрү менен ашка келип ачка калган экен деп айта жүр, садагаң!* – деди да, Жума кабагын чытып үшкүрө туруп, комузун бир колуна, чапанын экинчи колуна алып, – кош айланайын! – деди да, аттарга карабай басып кетти,"},{"t":"p","h":"Каныбек Жуманын чоор бергенине жана айткандарына ишенерин же ишенбесин билбей, ээрчий° карап турду да, анан Эсенге карап:"},{"t":"p","h":"– Тиги атамдын айткандары чынбы, аке?"},{"t":"p","h":"Эсен унчукпай гана башын ийкеди да, Жуманын артынан басты. Каныбек Эсенди кичине ээрчий баса түштү да:"},{"t":"p","h":"– Аке, бүгүн ушул жерде болобуз! – деп, Эсен Каныбекке карабай жооп берген бойдон басып баратат."},{"t":"p","h":"Кечке кой кайтарган баласынын курсагын тойгузууну ойлогон Ажар, сол колуна табак, оң колуна сорпо куюлган аякты кармаган бойдон эшигинин алдына тура калды да:"},{"t":"p","h":"– Мынча эмне шашылдын, садагаң?"},{"t":"p","h":"– Муну көрчү! – деп, Каныбек чоорду имере кармап энесине көрсөтө, – Жума деген киши берди. Ал атам айтып жүргөн Алайдан, бейиштен келиптир. Ал өзү комузчу, сурнайчы, кыякчы, чоорчу экен. Тигине, бир жолдошу менен ат кайтарып жүрөт, – деп ымыртта жайылган аттар тарапты көздөй колун сунуп койду да, – кагылайын” энеке! Бектин үйүндөгү коноктордон"},{"t":"p","h":"' тешик – лыра"},{"t":"v","l":["1 сыяктуу – подобный","шыгын – везение","* жылмай – улыбаясь","* садаган – милый","* ээрчи – следовать, идти за кем-чем-либо","7 кагылайын – мой миленький"]},{"t":"p","h":"<span class=\"pg\" data-n=\"29\">29<\/span>арткан-урткен тамагы болсо алып берсен, ошол кишиге алып барып берип батасын алып, чоорун угуп келейин!"},{"t":"p","h":"Ажар баласынын өтө ынталуу! болуп турганына түшүндү."},{"t":"p","h":"– Ме, буларды үйгө киргизип өзүн жеп, иче тур, – деди да, колундагыларын Каныбекке берип, Ажар кайра Түлкүбектин үйүнө карай жөнөдү."},{"t":"v","l":["Каныбектин жаңыдан чакыруусу боюнча Алым жүгүрүп келип:","– Эмне?"]},{"t":"p","h":"Каныбек сүйлөбөй гана күлүңдөй башын шилтеп, сол колтугуна кыстарылып турган чоорду көрсөткөндө, Алым эч сөзгө келбей чоорду сууруп алып карап калды."},{"t":"p","h":"– Кандай сонун чоор!"},{"t":"p","h":"– Азыр мына бул тамакты алып, ушул чоорду берген кишиге барам, Сен барасынбы?"},{"t":"p","h":"– Барам жакынбы?"},{"t":"p","h":"– Тетиги аттар жайылып жаткан жерде, – деп Каныбек ээгин шилтеди. Бирок Алым аттардын караанын көргөнү менен кишилерин ажырата албады?."},{"t":"v","l":["Ажар дагы бир аяк туураган эт, үч-төрт тоголок эт алып келди да:","– Эмнеге салып барасын!"]},{"t":"p","h":"– Табак менен алып барам! – деп, Каныбек табактын тубундегу” уч тоголок этти туураган эттен бөлдү."},{"t":"p","h":"– Сен өзүң жеген эмессиң го? – деди Ажар."},{"t":"p","h":"– Мен алардан артса жейм, артпаса кайра келип Алымдардыкынан атала ичермин, – деди да, Каныбек чоң аякка бөксө сорпону өзү көтөрүп, Алымга табакты көтөртүп Жумага карай жөнөп калды."},{"t":"v","l":["– Жума дегениң жаш кишиби?","– Кейпи элүүдөн ашып калган."]},{"t":"p","h":"Аяктагы сорпосун чайпалтып төкпөс үчүн, Каныбек өтө этияттык менен баратат."},{"t":"p","h":"Жума ээрин атка токуп, чылбырдын учуна дагы бир чылбыр* улаштырып, токуган атынын ооздугун чыгарып тизгинин түрүп:"},{"t":"p","h":"– Мына, Эсеним, эми эки жакты байкап коюп олтура бер. Экөөбүз эки атты минтип токуп койбосок болбойт. Ууруну кайдан деп болобу. Кокус* тиги четинен бирөөнү мине качса, талыкпай куушка болот! – деп, Жума атынын чылбырын Эсендин атынын чылбырына улаштырып, – түн ортосуна чейин бул экөөнү минсек, андан кийин башка атты минебиз, булар таң° атканча тоюп калат."},{"t":"v","l":["– Ооба! – деп, Эсен отура кеткенде:","– Салоомалейкум, акелер! – деди Алым.","","' ынталуу – проявляющий интерес, инициативу","* ажырата албалы – не смог разлучить","* тубунлегу – на днс","* чылбыр – поволок. повод, чембур","* кокус – неожиданный","* тан – рассвет. утренняя заря"]},{"t":"p","h":"<span class=\"pg\" data-n=\"30\">30<\/span>Уурудан чочулаган Жума менен Эсен, капыстан чыккан бейтааныш! үндөн чочуңкурай, саламды алик алышпай тура калышты."},{"t":"p","h":"– Бул менин бир тууганым, Жума ата! Сизге тамак алып келдим! – деп, Каныбек айтканда, Жума кубана:"},{"t":"p","h":"– А-а, жанагы чоор берген уулум – Каныбек турбайбы!"},{"t":"p","h":"– Ата, садагаң болоюн, бала эмес эле алтын го? – деп, курсагы ачкан Эсен абдан кубанып кетти."},{"t":"p","h":"– Мына ата! – деп, Каныбек аякты Жуманын алдына койгондо, Алым табакты аяктын катарына койду."},{"t":"p","h":"– Эсеке, ооздугун салып, бул эки жигитти мингиз. Күүгүм талаштагы ууру жаман болот. Сен экөөң, айланайын, аттардын ары жагын бери кайрып, эки жакты карай тургула. Биз жаман курсакты чүргөп алгандан кийин. экөөңдү өзүмчө конок кылам! – деп, Жума бычагын сууруп табактын жанына отура кетти."},{"t":"p","h":"Эсен аттарды ооздуктап, Каныбек менен Алымды мингизип:"},{"t":"p","h":"– Кокус киши көрүнсө эле кыйкыргыла!"},{"t":"p","h":"– Макул, аке! – дешип, экөө аттарга карай бастырышты."},{"t":"p","h":"Каныбек эл көчкөндө гана жаман-жуман тай, кунан мингени болбосо, мындай мандалмалуу ат эмес, жөнөкөй чоң ат минип көрбөгөн, а Алым болсо, торпок менен эшектен башка унаанын үстүнө чыгып көрбөгөн."},{"t":"p","h":"– Ай-й-й-й. Каныке, ушундай да чоң аттар болот экен ээ! – деп, Алым аттын чоңдугуна суктануу? менен, ат минбей эле, кандайдыр бир тоонун үстүндө бараткандай сезди."},{"t":"p","h":"– Бул ат эмес, Алайдын – бейиштин аргымагы, тобурчактары*. Алай жөнүндө атамын айтканын уктум эле, баягыда. Булар ошол жердин аттары. зордугун көрдүнбү? Басышы да шумдук эмеспи, – деп, Каныбек атты капталга ыкып койгондо, ат чочуй селт этип желе бергенде, чалкасынан кете жаздап токтоп, аттын оозун чирене тартып араң токтотту."},{"t":"p","h":"– Акырын! – деп, Алым чоочуп, өзү да атынын оозун жыя кармап жай бастырды."},{"t":"p","h":"Экөө аттардын ары жагын бери имерип, таңдануу менен аттарды карашат."},{"t":"p","h":"– Ой, баракелде, бардыгы сонун аттар экен. Төөдөн чоң десе да болот! – деп, Алым таңданат."},{"t":"p","h":"– Билесиңби, бул аттарды кандай кишилер минип жүргөнүн? Муну минген кишилер, эч кимге жамандык зордук-зомбулук* кылбайт, кул жумшабайт. Адамдарынын бардыгы мээримдүү. Өзүң деле билбейсинби, жанагы киши мээримдүүлүгүнөн сонун жасаган чоорун мага бекер берди. Эгер биздин Атабек болсо, бул чоорду бир атка сатат болучу! – деп, Каныбек Алайды бейиш катарында көрүп, түркүм уккан сөздөрүнө жараша Алайды өзүнчө Алымга мактай берди“."},{"t":"v","l":["' бейтааныш – незнакомый","1 суктануу – зависть, восхищение","› жандуу – оживлённый, песёлый","* тобурчактары – боевые кони","* зордук-зомбулук – принуждение","* мактай берди – хвалил"]},{"t":"p","h":"<span class=\"pg\" data-n=\"31\">31<\/span>Эсен Каныбек менен Алымды чакырып. алардын тамагы үчүн алкышын! айтып, өз атын минип аттарды көзөмөлдөөгө кетти, Жума атынын чылбырын? такымына кысты да:"},{"t":"p","h":"– Өзүңөр билип, мени сыйлап тамак алып келгениңерге зор ыраазымын, айланайындар! Силерден сурап отурганым уят болор, өзүм билип күү чертип, кыяк тартып, сурнайым менен чоорумду ойноп берейин! – деп, Жума комузун күүлөп, «Камбаркан», «Ботой», «Кыз ойготор» деген күүлөрдүн атын айтып чертип бүттү. Бирок, Каныбек менен Алым бул күүлөрдүн маанисине жетип, манызын терен түшүнө албады. Аны Жума жакшы түшүндү да:"},{"t":"p","h":"– Комуз күүсү силерге оордук кылар, – деп, сурнайын колго алды да, – «Кер өзөн» деп бирөөлөр айтат, «Кересен» деп дагы бирөөлөр айтат. «Илгертен калган, жоого баратканда тартылчу күү» деп мен жаш чакта атам үйрөткөн эле, – деп, Жума сурнай үнүн зыңылдатып, бирде конурлатып чыңыртып, бир эсе аттуу аламдар бараткандай дүңкүлдөтүп көпкө тартты."},{"t":"p","h":"Балдар үчүн комуз күүсүнөн көрө сурнай күүсү кызыктуу жана көнүлдүү болду. Балдардын түшүнүгүн байкаган Жума, чапанын сол жаккы ичинен кыягын сууруп чыгып, «О, Татты», «Ат кетти» деген күүлөрдү айтып, аз-аздан маанисин түшүндүрүп тартканда, Каныбек менен Алым абдан кубанышты'. Ал экөө үчүн, кимдир бирөө, кыяктын ичине кирип алып сүйлөп жаткандай сезилди."},{"t":"p","h":"– Ата. жакшылап тартса ушул күүлөр чоорго келеби? – деп, чоордун күүсүн угууга ашыгып отурган Каныбек сурай калды."},{"t":"p","h":"Жума жооп берген жок. Комуз, сурнай, кыяктарын мындай жыйнаштырып койду да, Каныбек чоор тартууга кызыккандан баятан бери карап отурган өз чоорун сурабай гана алды да, азыр эле кыякка тарткан күүлөрдү чоорго тартканда:"},{"t":"p","h":"– Сонун келет экен, ата! – деди Каныбек кубануу менен. Каныбектин дегдегени чоор экенин билип, Жума чоорду көп тартты. Ар бир күүнүн атын атап, анын маанисин түшүндүрүп жатты. Жумаларга коңшулаш ат кайтарып жүрүшкөн эки киши да келип чоор угушуп отурушат."},{"t":"p","h":"Жума Каныбектин үйрөнгөн үч-төрт майда күүлөрүн тарттырып көрүп, ал күүлөрүнүн так келбей жаткан кайрууларын оңдоп көрсөттү."},{"t":"p","h":"Каныбек Жума менен кош айтышып ордунан турганда, «жолугушканыңар кут болуп, жолуңар жарык болсун» дегенсип, чыгыш тараптагы Улуу-Чаттын тоосунун кырынан ай чыга келип, азыр эле түнөрүп жаткан караңгылыкты кууп, айланага нурун төгүп көрк бергендей болду. Түн сактаган өнөрчүлөрдүн жүзүн жаркыратып, алардын келечек таалай жолдоруна күмүш нурдан көбүк төккөнсүйт”."},{"t":"p","h":"– Тиги бала да жөнөкөй бала көрүнбөйт, жанагы сиз тарткан күүнү тартып баратат, – деди Жуманын жанында отургандардын бири."},{"t":"v","l":["' алкышын – благословение","* чылбырын – узда","&gt; кубанышты – раловались","* чексиз – беспрелельный, безграничный","* коншулаш – соседний","* көбүк токконсуйт – булто разлил пену"]},{"t":"p","h":"<span class=\"pg\" data-n=\"32\">32<\/span>Жума көпкө чейин Каныбек тартып бараткан чоордун үнүн тыңшап туруп!, чоордун үнү угулбай калганда гана:"},{"t":"p","h":"– О, зайнинен айланайын? Каныбегим, өмүрүн узун болсун! – деп, бир топко унчукпай ойлонуп отурду да, анан жанындагыларга карап, – илгери, «кадимки! Толубай сынчынын уулу калмактардын колуна түшүп айдалып баратканда, «мени Толубай сынчынын уулу деп ким айтат, сени тулпарыңдын башы деп ким айтат?» деп жолунда жаткан куу башты кучактап ыйлаган экен» дешет. Анын сыңарындай, бул Каныбек аттуу бейтааныш баланын ким экенин ким айтат? Балким бул бала эч теңдеши жок“ өнөрпоз? болуп, эл мактанып жомок кылар! А балким... бул баланын алдын кор, аркасын жар тороп турган чыгар, Тиги бала бараткан айылдагы бектер, тетиги үй тиктирип чардап жаткан даткалар, мин башых, старшылар турганда, балким ал бала, мага окшош, өнөрүнүн үзүрүн көрө албас!"},{"t":"p","h":"«Жума сенин ушул сөзүң туура, күмүрөй түн басып турганда алысты кайдан көрөсүң?» дегенсип, тоо башынан көтөрүлгөн токумдай куу булут айдын бетин калкалады..."},{"t":"v","l":["§ 1. Узундуну керкем окугула (ролдоштуруп),","2. Каныбектин бала чагындагы образы кандай?"]},{"t":"p","h":"3. Каныбектин келечеги кандай болот деп ойлойсунар? (Мүнөзү, кызыгуусу, улууларга"},{"t":"p","h":"мамилеси),"},{"t":"h3","h":"Жаңы сөздөргө көңүл бургула: 7"},{"t":"v","l":["ээр – седло","ууру – вор","этияттык менен – с осторожностью","кууш – погоня","мингиз – оседлай","чапан – верхняя одежда","текпос учун – чтобы не разлить","кандайдыр бир – какой-то","«Каныбек» аттуу корком фильмди көрсөтүү.","$ 1, Каныбектин образы,","2, Романдагы аялдардын образы.","эё к ә ия","коңшулаш – соседний","сынчы – критик","мактаный – хвастаясь","талыкпай – нс уставая","арткаин-урткен – остатки","кыстарып – привав"]},{"t":"p","h":"3. Каныбек, Алым, Чон койчу, Кубат, Темир жана Түлкүбек, Зуннахун, Айдарбек,"},{"t":"p","h":"Сооронбай менен Камалбек афандини салыштырып мүнөздөгүлө,"},{"t":"v","l":["Төмөнкү схеманы толтургула («+» – оң каарман, «-» – терс каарман),","Алар кандай. Мисалы:","","Таш боор","","' тыңшап туруп – подслушав",":зайнинен айланайын – здесь: ласкательное обрашение","* кадимки – настоящий","*эч теңдеши жок – нет равных","* өнөрпөз – мастер, искусник","* мин башы – волостной управитель"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"33\">33<\/span>Үмүт"},{"t":"p","h":"Ооба!.."},{"t":"p","h":"Шумурай замандын шумдугу, шумдуктуу! болуш Сооронбайдын амалы ушундай болду."},{"t":"p","h":"Эрк издеген, адилеттикти? сүйгөн, жерге жээги өсүүнү каалаган Каныбектин эки колу артына"},{"t":"p","h":"«Атактуу каракчы Каныбекти ээрчитип алып, Айдарбек датка Сооронбай болушту өлтүрүүгө келген жерде кармадык» дешип, келген стражник менен төрөлөр акты жазып кол коюшуп, Каныбекти үч стражник менен Ошко келип түштү."},{"t":"p","h":"«Мени камакка албагыла, оёзго өзүм барайын» деп, Айдарбек датка подписке берди."},{"t":"p","h":"Жер жүзү кара кийип кайгы тарткандай, аркырап беймал жүрүп. булуттар уйгу-туйгу көчөт. Сагызган шакылыктап, кузгун куркулдайт, жорулар төбөдө айланат. Кулаалылар талпылдап, бөктөргөлөр салпылдайт, Буурсун кошкон эки унаанын башын жетелеген балдар, чалдар, келинкыздар буурсундун туткасын кармап белдерин бүкүрөйткөн дыйкандар кабактарын чытыйт, эки көздөрүн айырбай* Каныбекти карашат."},{"t":"p","h":"Эриксиз туткунду аяшат. Колдорунан келер арга жок, ыйламсырашат. «Кайран, азамат!. Не деген жигит эле?.. Айымбачанын тоюнда, Үмөтбайдын кызынын оюнунда, Тоңмурундун аркы оюнда не деген эрдик кылды эле! Алты кырдуу он эки сырдуу деген асыл жигит ушул эмес беле?., Неге тагдыр* Каныбекке карышат?.. Неге жүзү каралар минтип азапка салышат?.. Неге минтип шордууларды канап-бутап каарышат?..» деп, Каныбекти тосуп тургандар кайгырып, капалуу сөздөрдү айтышат. Каныбекти куткаруу? жөнүндө эмне кыларын билишпейт..."},{"t":"p","h":"– Бирдеме чогултуп жибергиле, берип калалы! – деп, бир жупуну кийинген адам жүз аарчысын тосуп эл арасында жүгүрүп жүрөт."},{"t":"p","h":"Бул сөзгө жандын бардыгы жан-дили менен макул болду. Колунан келгендер тыйындап, тыйыны жоктор жалынып бирөөнөн карыздап жыйнашты, Өнтөлөп эркектер арасында аялдар да жүрдү. Бирок, алар колдорунан тыйын чыгарып жыйнашкан жок, чака, чайнек, чыны, аякка куюп Каныбекке деп суусун көтөрүп жүрүшөт. Ушул суусундарын берсе Каныбекке мүрөктүн суусун берчүдөй, Каныбек өлбөй кайта аман келчүдөй сезилет, Бирок «Шибер» деген онбогон сөз эстеринен кетпейт. «Жаш балапанды солутуп Шиберге айдатып жиберет го! Жөн билгениңер сурасанарчы. Шиберине он күнү жибергиче, бул жердеги набагына он жылы жаткырсын» деп кай бир аялдар улгайган эркектерге жалынышат."},{"t":"p","h":"Эл арасына Каныбектин кабары тез тараган. Кабар уккан элдин бардыгы кары дебей, жаш дебей жол тосуп турушат."},{"t":"p","h":"Каныбектин колу артына байланган... Аттуу стражниктердин ортосун- ' шумдуктуу – удивительный"},{"t":"v","l":["1 адилет – справедлийость","5 байлаган – закопан","*айырбай – ие отрывая","$ таглыр – судьба","* куткаруу – спасти"]},{"t":"p","h":"<span class=\"pg\" data-n=\"34\">34<\/span>да жөө келе жатат. Энеси Ажарга, асыл жары Анарханга салам айттырууга эки көзү төрт. Бирок түшүнүксүз кулдурашып, стражниктер эч кимди жакын келтирбеди,"},{"t":"p","h":"«Башка түшкөндү көрөрмүн же ажалым болсо өлөрмүн» деп Каныбек кайраттанды. Жол четинде буркурап ыйлап турган чоң атасы менен чоң энесин көрдү. Өсөрү кетип, өлөрү жакын калган кемпир-чалдын муңдуу үндөрү алардын айланасында тургандардын көз жаштарын көл кылууда."},{"t":"p","h":"– Садаган кулунум!!! – деп, Урум менен Турум Каныбекке умтулганда стражниктер кемпир-чалдын баштарынан алыс удаа-удаа атып жиберишти. Каныбекти көрүп учурашып калууга ойлогондордун бардыгы жайыла кайра качышты."},{"t":"p","h":"Бирок, Урум менен Турум Каныбектин артынан калбады. Беттерин ысык жашка жуугузуп, муңдуу үндөрүн ааламга угузуп боздоп келе жатышат."},{"t":"p","h":"– Капастуу торго чалынып,"},{"t":"v","l":["Кап тоосун көздөй дөө кетти.","Калкынан бир тай мине албай,","Кадырлуу ботом жөө кетти!.. —"]},{"t":"p","h":"деп, Урум боздоп кошуп келет. Ага кошулган шордуулар муңдуу үндөрүн улам жогору көтөрүшөт."},{"t":"p","h":"Каныбектин карааны улам алыстап барат... Эл агылып самсып туштуштан келет..."},{"t":"v","l":["«Калам алдым колума.","Калкыма салам жазууга.","Туткуну болуп набактын,","Зар болдум эркин басууга.","Эркелетип баламды,","Бетинен суйбей жарымдын,","Карышкырды кой керуп,","Набакта минтип зарылдым.","Жакшылык менен чыкпоочу,","Темир торго чалындым...","Терезеси билектей,","Темир менен тордолгон...","Жалындаган берендин,","Асыл жаны кор болгон.","«Сооронбайга каршы» деп,","Суракчы күндө жадатат,","Кайран болот денемдин,","Курчу кетип баратат...","Абалы кандай болду экен,","Эмгекчи дыйкан атанын?","Энелер күнү не болду,","Оорчунун тарткан капанын?","Жалчылар куну не болду,","Баарын чеккен","Бардыгына салам айт, —","Өзүмдүк курбу тууганга!","Жол татаалы кеп эмес,","Жорго баскан бууданга,","Эр жигит бир күн жетмекчи.","Көксөп тилек кууганга!..","Кажыбаган калайык,","Чалгынын, мендей сынганга!","Жана да салам айтамын:","Бөкчөйгөн кемпир, чалдарга.","Бөжүрөгөн балдарга,","Келин менен кыздарга,","Карындаш, эже, женеме,","Кагылайын энеме:","Жолой, Чоко атама,","Карып өңдүү абама,","Күлүкан өңдүү апама!..","Каныбек туткун болду деп,","Түшпөгүлө капага!","<span class=\"pg\" data-n=\"35\">35<\/span>Ажалым жетсе өлөрмүн,","Айдаса Шибер көрөрмүн;","Эгер аман кутулсам,","Тогуздап кекти төлөрмүн!..","Жалынып салам айтамын,","Жароокер Анар жубайым!","«Набакта деп Каныкем»,","Тартпагын асты убайым!","Медер кылып балаңды,","Белиңди бекем бууп жүр,","Кайгырса шордуу энекем;","Күлкүң менен жууп жүр!..","Жалгызым эле Эркиним,","Күлүшүп да калгандыр.","Боолголоп ар кимди,","Балапан үнүн салгандыр;","Орлумду менин баскансып,","Капанарды жазгандыр!..","Жароокер жаным —","Анархан абийирдүү акыл тап!","Жаш да болсо туяк го.","Эркинимди жакшы бак!","Узун болсо өмүрү,","Балтыр эти толбойбу.","Муңуңду муңдап берүүчү,","Бат эле жигит болбойбу!","Жакшы чыкса багыңа,","Жаракты колго албайбы.","Чубагындай Манастын,","Душманга чууну салбайбы!","Камоого кеткен атанын,","Душмандан кегин албайбы!","Мундуу болгон сендейдин,","Кубанычка көөнү канбайбы!","Камыкпа, жаным, Анархан,","Тагдыры шундай болуптур.","Жалгыз гана мен эмес,","Набактын ичи толуптур!","Эми жаңы түшүндүм,","Каталык менден болуптур.","","деп, Каныбек түрмөдөн кат жазган.","Менин кылган иштерим,","Түбү чийки чала экен,","Көксөгөнгө жетүүгө,","Башкача жол бар экен!..","Уй мүйүздөп сагаалап,","Топ, жыйындан кетпеген;","Ак болсо да момунду,","Баса көктөп тепсеген;","Жоктон алып айыпты,","Өз ара бөлүп эптеген.","Бирин бири аркалап,","Бөжүгөн байын калкалап,","Баш көтөргөн момундун,","Казанын чагып талкалап.","Караны ак деп танышкан,","Кумардан бирге канышкан,","Старчы менен бийлерге,","Арада жүргөн шылуунга,","Чогултуп салам айтамын.","Айдарбек датка зулумга!..","Дагы салам айтамын.","Сооронбай «асыл» кудага!","Сен жетип күткөн тилекке,","Мен калдым минтип жазага!","Аз эмес, кыйла төлөөрсүн,","Мен үчүн кылган жазана!","Кезиң келер бир күнү,","Түшсө да кудай арага.","Тирилип туруп чон атан,","Көрүнөн бата берсе да,","Мойнуна куруң салынып,","Алдыма ыйлап келсең да,","Энекеме эркелеп,","Эмчекти бирге эмсең да?","Кудай колдоп, улукман,","Мүрөктүн суусун берсе да,","Азырынча таалайың,","– Мени минтип женсен да,","Эсепти туура кыларбыз,","Шиберге айдап ийсең да!,.» —"]},{"t":"p","h":"Бул катты Алым алып келип, эл арасына жайылганына көп болду. Ооздон оозго көчүп, ачык ырдала баштаган. Бирок бул ырды ырдап жүргөн бир койчуну Алымбек билип Сооронбайга айтып, ал койчуну «Каныбектин тууганы, мага каршы» деп, Сооронбай протокол жазып каматып жиберген."},{"t":"p","h":"<span class=\"pg\" data-n=\"36\">36<\/span>Мына ошондон кийин бул ыр эл арасына ачык ырдалбай калды. Каныбек ошентип туткунда."},{"t":"p","h":"Айла менен Каныбекти каматса, ага байланыштырган Айдарбек датка к болуштук талашмак тургай өз башын аран куткарса, ошентип Сооронбай, – уезддин начальнигинин сүйгөн болушу болсо, анын айтканы айткан болуп турса, Айдарбек тарапка болушкан старшылардын бардыгын сабап чыгымды очойто салса, Сооронбай эмнени кылбасын, кың дегендин бардыгын бүк түшүрдү."},{"t":"p","h":"Алым алда нече жолу Ошко жашырынып барып келди, бирок эч нерсе чыккан жок. Анархан дагы түрдүү акылдарды куруп көрдү, Андан дагы эч нерсе болгон жок."},{"t":"p","h":"«Неге маңдайымдын шору арылбады? Неге мен ушинтип зарланам? Неге жалгызымдын бактысы жок? Эмне үчүн ал капастуу капкандан кутулбайт?» деген сыяктуу суроолор, Ажардын башына бир күндө миң келип, миң кетет. Бирок, эч бир суроосуна жооп жок."},{"t":"p","h":"– Анархан, Эркинди бери берчи! – деди да, Ажар акырын сыйпа- ь лап жалгызынан калган жалгыз чырагынын алкымынан жыттап туруп, – садагаң Эркин, күлүп койчу! Күлүп койсоң, карып энелерине эрмек болсон! Кана, күлүп койчу, – деди, баласы аржалаңдап күлсө да, Ажар аны көргөн жок. – Кана, атаң набактан аман келер бекен, оң бутуңду көтөрүп койчу, – деп, баланы акырын тизесине тургузат, бала кайсы бутун көтөрүп жатканын көрбөйт, билгиси келип сыйпалайт,"},{"t":"p","h":"Каныбек камалгандан бери, айылдагылар Каныбектин эшигинин алдына чогула турган бир адат таап алышкан. Алардын максагы; Ажар менен Анархандын көңүлүн ачуу, Эркинди колдон колго кыдыртып, оеп, жыттап, кумарларын жазуу, чердүү көңүлдөрүн ачып көкүрөктөрүн басуу..."},{"t":"v","l":["– Капырай, береги жору эмнеге айланат?","– Жору эмеско?","Бүркүт экен!","= Жүндөрү куусан экен!","– Канжыгалуу кара сенсел го дейм?"]},{"t":"p","h":"Эмнеси болсо да баралына келген барчын экен! – дешип, отурган эркек, аялдын бардыгы айыл үстүндөгү асманда айланып жүргөн ала барчынга карап калышты. Мындай барчындын айыл үстүнө айланып учушуна тан да калышты,"},{"t":"p","h":"– Анархан балам! Эркинди бери алып келчи! – деп, кандайдыр маанилүү терең мүнөз менен Жолой эки колун балага карата сунду. Анархан Эркинди Жолойго бергенде, ал баланы, адатынча, өөп-жыттап жиберген жок."},{"t":"p","h":"Эркинди тизесинин үстүнө тургузуп, эки колтугунан сүмөй тиктеп, эки көзүнөн мончоктогон жашын куюлтуп турду да, бала менен бүркүттү алмак-салмак карай."},{"t":"p","h":"– Эркин деген атыңан айланайын!.. Агын, жакшы... Кана, айтчы. тетиги ала барчын бүркүттөй айланып, атаң аман келер бекен? Атыңа жараша эркиндик бизге болор бекен?- деп, баланын көзүнө карап тигилди. Жолойдун сөзүн угуп элдин бардыгы балага тигилишти. Урум менен Турумдар да Жолойдун сөзүнөн улам, балага жакындашты."},{"t":"p","h":"<span class=\"pg\" data-n=\"37\">37<\/span>= Жалгызымдын туягы. Эртеңки үмүт!!! – деп, Турум чекесин баланын көкүрөгүнө такады. Көзүнөн жаш мөлт-мөлт ыргыды. Бала үн чыккан жакка карап колдорун арбандатып. буттарын тыбыратып «а-а-у-у» – деп, күлүмсүрөй башын чулгутту."},{"t":"p","h":"– О, кулкунен айланайын! Ала барчындай айланып Каныбегим келип, күлкүбүзгө күлкү кошулар! – деп, Жолойдун колунан Эркинди Чоко ала коюп жыттап өөп жиберли."},{"t":"p","h":"Кандайдыр бир кубанычтын кабарын айткандай, Эркин да «а-а-у-у» – деп үнүн чыгарып, колу-бутун тарбаңдатып күлдү!.."},{"t":"h3","h":"Билип алгыла!"},{"t":"p","h":"Касымалы Жантөшевдин чоң таланттуу прозаик экендиги «Каныбек» романында ачык көрүндү. Автор романынын үстүндө жыйырма жылга жакын убакыт иштеди. Романдын 1-китеби 1939-жылы басмадан чыккан болсо, акыркысы 1958-жылы жарык көрдү. Роман МХ кылымдын экинчи жарымынан тартып XX кылымдын жыйырманчы жылдарынын акырына чейинки мезгилди ичине алат."},{"t":"p","h":"1941-жылы «Адыл мерген» аттуу повести жарыкка чыкты. Улуу Ата Мекендик согуш мезгилинде жогоруда сөз кылган бир нече драмаларынан башка Советтер Союзунун Баатыры Чолпонбай Түлөбердиевдин балалык, оспүрүм курагынан тартып согуштун өртү жалындап турган мезгилде Днепрди кечип өтүп С. селосун мыкаачы гитлерчилерден бошотуудагы легендарлык баатырлыгын чагылдырган «Чолпонбай» аттуу очерк-аңгемесин жазды,"},{"t":"p","h":"Касымалы Жантошевдин прозаларынын ичинде кийинки учурларда окурмандар жылуу тосуп алган чыгармаларынын бири азыркы учурдун темасына арналган «Хан-Теңирлик чабан» романы болуп эсептелет. Роман 1963-жылы жазылган. Жазуучу мындан кийин азтымышынчы жылдардын ичинде «Менин тагдырым», «Айып мендеби?», «Биздин секретарь» аттуу азыркы учурдун турмушунун ар кыл аспектилерине арналган повесттерин жазды,"},{"t":"v","l":["[гд өспүрүм курагынан – с подросткового возраста","ар кыл аспектилерине – разновидности аспектов"]},{"t":"h3","h":"АДАБИЯТ ТЕОРИЯСЫНАН"},{"t":"p","h":"Либретто (итал. – китепче) – сахна учун жазылган опералык чыгармалардын көркөм тексти. Музыкалдуу театрынын тарыхында либретто ыр түрүндө жазылат көбүнчө рифма аркылуу, сюжеттери драмалык жана адабият чыгармалар. Музыка театрынын тарыхында белгилүү либреттистер көп, алардын ичинде: П, Метастазио, Р. Кальцабиджи, М. Чайковский ж. б. Бизге белгилүү адабият чыгармаларынан алынып жазылган либреттолор А. Пушкиндин «Евгений Онегин», «Пиковая дама», Л. Толстойдун «Война и мир». А. Малдыбаевдин «Айчүрөк». Бирок, мазмуну жактан бул чыгармалар өзгөчөлөнгөн, ага себептер бар, биринчиден, операда ариа, ансамбль, хор коштолот, экинчиден, сөздү жон айтканы менен ырдап айткандын <span class=\"pg\" data-n=\"38\">38<\/span>айырмасы бар. Ошондуктан опера жазылып жатканда авторлор чыгармадагы сюжеттерди жана каармандарды кыскартып кайрадан дилбаян жарагышкан."},{"t":"p","h":"Быйыл «Айчүрөк» операсы 72 жылдык мааракесин өткөрөт (авторлору Ж. Бөкөнбаев, К. Маликов. Ж. Турусбеков) «Айчүрөк» операсы үч гениалдуу композиторлордун колунан жаралган, алар – В. Власов, А. Малдыбаев, В. Фере."},{"t":"p","h":"1939-жылы биринчи жолу «Айчүрөк» операсы Москва шаарында он күндүк декадасында сахнага чыгып, зор ийгиликтерге ээ болуп, москвалык көрүүчүлөр тарабынан жогору бааланган. Азыркы учурда да гениалдуу музыка жана либретто өзгөрүлгөн эмес"},{"t":"p","h":"«Айчүрөк» либреттосу дүйнө искусствосунун Алтын фондуна кирген."},{"t":"p","h":"Жусуп Турусбеков"},{"t":"img","src":"data:image/webp;base64,UklGRq4TAABXRUJQVlA4IKITAADw1gCdASqZARwCPrVUoEsuOq2vK7ypw1AWiWlub6iUrLoK8uA2d8Jacv1YsFC6i/7/wfTyOFblucU9Af/quJZm09Mwr/7ejv4n/5eWv4l/f5VP6XMZ/7em/3zZyCxayG+Hzm1IUJR0vOaA6PUOM0D79mIHaXdlDhiGynWXNo2tlJ204DudtkaWTBb/80UPxDtkHzgqQ/nlFSK6vJIa1bY4Rih1UF0Z3giZxmAFFe7yavy22CbthII5W8TpYhfnAvYACudNuWKCM3j1/mgKTL+g8kUVkUtU3cpC9vYU0p6BCVN9KEkfzPHaGgj+StRNZ8EAH9a+w7mlYBiIyf8vzRYD+OoK2ESg3dV4csQaCDCKXkEHMqw6i5EDIpJWdDOk/P0VSHjd29xv4TsJA0Rrn/7IcyoaKspnKN/GmtEETDuyNFNrHScYHf0UkLsGjqUl6CLOmDdUzWrjMyV/FM5OJJg9S2G7ONLOkoZ/6T5jSuhW5Z1LSBXHB7wVQ5/d5QUQylH96AXVOvI8PASDf/lCRiAbv3Ydi9pTxL0F6mz0sN4IOw4fmt0+msboWP4MdGYI4gks7Dt26d1tf6UfQwYq2ASbBiiLR3/X1lIjYWZpMJAVQ6T/mVwp6LdyAVbtgu/rUKsbMLOEOzq6r0Xgc6OLsDEZEoanXFghUGldX2cnH5wFOfXGyAaIYva0PjaUVXGwM6to75U+T2bFDIS71RCiwEll+BWcXIjCSZESroQlPrDzL0fRlh8vYBlzou2DfR5S8YXmrH3hJipmO2H5z5hkIrObrXdzs4T+Q8N70RSHloibIVQCi0QySCuhRlYuwbzoWxoVZcqDYFMaL8OIVMaQClzT6GEi8tmyaGEUsbjaJw9h9ZocYeb7P34uTgZOsFx7FBALdSEEdKrpl9iAF37JKf20BOq7LlPWEjWX/TPpC+HD2Xv3+vDoZTf0+y8hub6kteOVwjZVEQ/8e0y5TV26SLyA3on9UcqMHkmNtIVjFdsdM29cB4fUNz/MeB1vvmIf9Fyms2BmG0kJTzJuLJalKBKS+5FTPn0l2q+qgdnasozPdOsZtgYZExK1TZRUQYN5mZM/RIB6csd/jKcXoQ7/4tc976QBgqpEOuO0RkZeW5ec0kHRe5lEE5TVsMm3V4Hjco5VCp1fxFetsXlUNZ9Eti4nuwxCPpvqOkI/Nua2q8lLUVl2dlk98j5C/xlgi+eni3KdSYxk1RBXhLjEKYy26hNlcEDYAgGYlNQKEO2/FOsn24kiG1zzCHLASCJ5ZSe+b30F06fV611t3V0/Qkiip3tFrY9JvV7GOW2j2yhZQT8swh7JXAWAFCQov+HrJnGL0rwA35TezBMofp9ELawmjDPGM8WDyy5SizfbonUpceOhkbKVwQW5VfNs0UK/JgrC7VR0tZpKsZCYMJcFiPuVpU1rebNyBVT0hQMAhYgxv8/EfMqMOGzK0tGhEycgD3ZUkSYHkU+DExFNN5C7mTTUTQmEpg/Lch/yt3ZRBIzCnCPXnbtoOT9DBO8U9rdhw/IrskjgQ7m ып, улугтук адабияттын тарыхына унутулгус из калтырып кетти."},{"t":"p","h":"Жусуп Турусбековдун өзүнүн индивидуалдуу пенделик тагдырынын шарттарынан алып караганда да, акындын жаңы түзүлүшкө! өзгөчө мамиледе? боло турган дүйнөсү бар. Жусуп кенедей бала чагында 1916-жылдагы кандуу көтөрүлүшкө күбө болуп, Кытайга качкан, эл тарткан азапты кошо тарткан. Бөтөн жерге тентип барган ата-энеси өлбөй тирүү калыш үчүн тилемчилик кылууга чейин аргасыз болгон. Көп өтпөй эле кагуу ачарчылыкта Жусуп ата-энесинен ажырайт. Бирөөнүн ирегесинде кыйналып кордук тартып жүргөн жетимчилик күндөрүнүн бир учурун акын минтип"},{"t":"p","h":"түзүлүшкө – по строению"},{"t":"p","h":"* мамиле – отношение <span class=\"pg\" data-n=\"39\">39<\/span>эскерет: «Тандан кечке керген кунум: чий ором, куурай алам, тезек терем, музоо кайтарам, Кокус музоо ээмп кетсе менин шорум. Ал күнү Болгон мени кызылдай союп урат... Куурай отунду жагып отуруп, кокус өчүрүп койсом, кычкач же кепич менен бир коёт. Бир кыш этиме жалаң тон кийип, жылаңаяк суу ташып жүрдүм»."},{"t":"p","h":"Мына ушинтип ач-жылаңач ит көрбөгөн күндү көрүп, ичтен кан өтүп, кандай айла кылышты билбей жалдырап турган жетим балага капыстан! Совет бийлиги кол созуп, койнуна катып колу-бутун жылытты, Патриархалдык-көчмөндүк коомдо ата-энеден ажырап жетим калган балага өз кандаштары жардамга келиши мүмкүн. Болбосо, жетимдин үлүшү – адат катары күн кулдун, малайдын тагдыры, Ал эми жогорку коомдук бийлик багар-көрөрү жок байкушка атайлап үй тигип, бөпөлөп? кучагына алат, окутат дегенди кыргыз жергесинде кулак угуп, көз көргөн эмес."},{"t":"p","h":"Жусуп Турусбеков орусча китептерди көп окууга аракеттенип, орус тилин жакшы түшүнчү экен."},{"t":"p","h":"Түптөгү Айыл-чарба техникумунда Жусуптун адабиятка болгон кызыгуусу чындап ойгонот. Жусуп бул жерде өзүнчө эле бир адабий чөйрөгө туш болгондой болот. Техникумда кийин кыргыз маданиятынын таанымал’ ишмерлеринен болуп калган, ошо кездеги жаш акын Мукай Элебаев, Молдогазы Токобаев, Мукамбет Дөгдүров, Шейше Орозов сыяктуу искусствого талпынган жаш таланттар менен бирге жашап, окушу ансыз да көркөм сөзгө шыктуу Жусупту адабиятка күчтүүрөөк талаптантат. Алгачкы ырлары техникумдун «Кереге» гезитине жарыяланат. Жусуптун адабиятка болгон шыгынын тутанышына техникумда болгон драмалык ийрим өз таасирин тийгизбей койгон эмес, Ийримдин катышуучулары өздөрү даярдаган спектаклдерин кээде Караколго чейин келип көрсөтүп турушкан. Драмалык ийримге Казандан ыр китептери чыккан Фарид Ибрагимов аттуу татар акыны жетекчилик кылган, Адабиятка көзү ачылып калган мындай тажрыйбалуу, билими бар адам менен тикеден-тике ымалада болуу Жусуптун адабий көз караштарынын түптөлүшүндө чоң роль ойногон болуу керек. Кыскасы, техникумдун окуучулары активдүү рухий турмуш менен жашашкан. Буга мурдагы монастырдан калган орусча китептерге бай китепкананын болушу да бир чети түрткү болгон. Энсеген билимге тезирээк жетиш үчүн техникумдун кыргыз балдары бири-бири менен жалаң орус тилинде сүйлөшүүнү адатка айландырган. Мукамбет Дөгдүров жаңылып, кыргызча сүйлөп алган балага жолдоштору чара колдончу деп эскерет. Мына ошентип, келечекке талпынган жаштардын арасында өздөрүнчө чымырканып изденүү, турмуш, адабият жөнүндө кызуу пикир* алмашуулар, талаш-тартыштар бири-бирине атаандашып чыгарма окуу күч алат."},{"t":"p","h":"Акындын өмүрүнүн бир үзүмүн чагылгандын отундай жарк эткизип жарык кылган бул фрагмент эмнеси болсо да бизге чоң максат кууган жолдо Жусуптун канчалык даражада активдүү, мээнеткеч боло алгандыгынан, канчалык деңгээлде «саргара жортуп», машакат чеккендигинен кабар берет."},{"t":"p","h":"' капыстан – внезапно (вдруг)"},{"t":"v","l":["1 бөпөлөп – лелея","+таанымал – знакомо","* пикир – мнение"]},{"t":"p","h":"<span class=\"pg\" data-n=\"40\">40<\/span>Жаш акындын Бишкекке келип адабий-маданий чөйрөгө аралашышы менен анын көркөмдүк аң-сезими ого бетер активдешет. Өзгөчө, Жусуптун 1929-30-жылдары Россиядагы Тверь шаарына барып окуп калышы акындын адабий тагдырында чон роль ойногон, Орус чөйрөсү Жусуптун рухий-интеллектуалдык. маданий-эстетикалык, тилдик өнүгүшүн тездетүү жагынан өзүнчө эле бир катализатордун кызматын аткарган. Ушул жерден ал орустун классикалык адабияты жана советтик акын-жазуучулардын чыгармалары менен тереңден таанышат. «Жаш жигиттин алдында жаңы горизонттор ачылды, – деп жазат Өмүркул Жакишев, – Тверде ал Пушкинди, Лермонтовду, Некрасовду кызыгып окуйт. Бирок, аны А. Жаров, И. Уткин, Д, Алтаузен, А. Безыменский сыяктуу ошол кездеги комсомол акындардын чыгармачылыгы андан бетер кызыктырат»,"},{"t":"p","h":"Мунун баардыгы Ж. Турусбековду көркөм ойлоо маданиятынын өйдөлөшүнө, поэтикалык туюнтуу принциптеринин жаңыланышына, художниктик аң-сезимдин индивидуалданышына, чыгармачылык ишмердикке болгон мамиленин чукулунан өзгөрүшүнө, олуттанышына алып келген. Жусуп Турусбековдун адабиятка келиши менен кечээки көчмөн коомдогу ырчы-жомокчудан, төкмө акындан кескин айырмаланган жаңы багыттагы профессионал адабиятчынын пайда болушу, калыптанышы тыгыз байланыштуу."},{"t":"v","l":["@ чакан – немного","унутулгус из – незабываемый след","тыгыз – крепкий, плотный, тугой"]},{"t":"h3","h":"«Ажал ордуна» драмасы жөнүндө"},{"t":"p","h":"«Ажал ордуна» драмасы 1934—1935-жылдары жаралган. 1939-жылы Москвала өткөн Кыргыз искусствосунун биринчи декаласы убагында көрсөтүлүп, ага өзгөчө баа берилген."},{"t":"p","h":"Жусуп Турусбеков кыргыз адабиятында таланттуу драматург катары да таанылган акын. Ал – «Беш-Мойноктогу окуя», «Ажал ордуна» пьесаларынын, К. Маликов, Ж. Бөкөнбаев менен биргелешип жазган «Айчүрөк» аттуу операнын либреттосунун автору."},{"t":"p","h":"«Ажал ордуна» ошол кездеги өзүнө мезгилдеш пьесаларга салыштырмалуу караганда көркөмдүгү жагынан кыйла жогору профессионалдык деңгээли менен айырмаланат, Драма чагылган объект 1916-жылдагы Кыргыз элинин Улуттук-боштондук көтөрүлүшү. Чыгарма бекемдеген ой Улуу Октябрь Социалисттик революциясы кыргыз калкын кыйрап жок болуу коркунучунан сактап калды, ажалдын ордуна өмүр берди деген идея,"},{"t":"p","h":"Пьесанын өзүнө тийиштүү чыгармачылык тарыхы бар. «Ажал ордуна» 1934—35-жылдары жаралып, андан кийин 1939-жылга чейин автор тарабынан бир нече жолу редакцияланган. Ж. Турусбеков драманын идеялык мазмунун, көркөм структурасын жакшыртуунун жана өркүндөтүүнүн үстүндө тынымсыз иштеген, Пьесанын акыркы варианты 1939-жылы Москвада өткөн Кыргыз искусствосунун биринчи декадасы убагында көрсөтүлгөн."},{"t":"p","h":"<span class=\"pg\" data-n=\"41\">41<\/span>Жусуп Турусбековдун биринчи пьесасынын ийгиликтүү! чыгышы бекеринен эмес, Буга акындын бала кезинен тартып эле театр эмне экендигин баамдап, билип жүргөндүгү бир жагынан себепчи десек болот. Караколдогу жетим балдар үйүндө окуп жүргөндө ал жердин тарбиялануучулары\" шаардын актердук группасынын койгон оюндарын кез-кези менен барып көрүп турушкан. Ал эми Түптөгү Айыл-чарба техникумунда драма кружогу уюштурулуп, студенттер даярдаган спектаклдердин (кыздын ролун көбүнчө Мукай Элебаев аткарган) кээде Кара-Колго чейин жетип көрсөтүп турушкан. Адабиятка шыгы бар Ж. Турусбеков бул оюндарда роль аткарып, кружоктун ишине такай катышкан. Кийин Тверь шаарында окуп жүргөн мезгилде да партиялык мектепте түзүлгөн интернационалдык клубда өздүк-көркөм чыгармачылык кружогу, анын ичинде драмалык ийрим да иштеген. Мына ошентип, Ж, Турусбеков ар кайсы шаарда окуп жүргөн мезгилдерден тартып дайыма драма кружогуна активдүү тартылып жүрүшү акындын драматургиялык көркөм ойлоосунун эртерээк телчигишине, сахнанын спецификасын туюнушуна өзүнүн таасирин тийгизбей койгон эмес."},{"t":"p","h":"Акын-драматург, маркум Райкан Шүкүрбеков минтип эскерет: «Ажал ордуна» театрды көтөрүп кетти. Театр эл оозуна кирип, мурда анча билине элек артисттердин бир катары жарк этип эл алдына чыкты. Кыргыз ССРинин азыркы эл артисттери Анвар, Ашыралы өңдүүлөр «Ажал ордунанын» коюлушу менен зор таланттар экенин көрсөтө алышты», Зулайканын ролу чынын айтканда менин эн биринчи жүрөгүмө жеткен жана берилип аткарган ролдорумдун бири эле. Ошондо кадимкидей ыйлап жибергеним бар (Анвар Куттубаева),"},{"t":"p","h":"Драматург пьесанын башкы проблемасын бир тарапта падышалык бийлик, жергиликтүү бай-манаптар, экинчи тарапта кыргыздын калың букарасы турган карама-каршылыктын негизинде курат, Элдик көтөрүлүштүн планын талкуулоо, падышачылыктын жазалоочу отряддары менен болгон кармаш, Ысык-Көл менен коштошуу, элдин Кытай жеринде жергиликтүү сүткорлор менен курешу*, тууган жерге кайтып келүү – драманын сюжетинин башкы түйүндөрү ушулар, Пружинадай толгонгон башкы чыңалууга жеткен бул урунттуу драмалык окуялар бири-бири менен терең байланышта өнүгүп, борбордук конфликттин маңызынын ачылышына активдүү кызмат өтөйт. Сюжеттик окуялардын чордонунда Искендер, Бектур, Зулайка сыяктуу эл өкүлдөрүнүн* типтүү образдары турат,"},{"t":"p","h":"Искендердин образын оң каарман проблемасын чечүү жолундагы кыргыз драматургиясынын алгачкы ийгиликтеринин бири деп эсептөөгө болот. Искендер элдик мыкты сапаттарга эгедер, өз калкын, Мекенин терең сүйгөн, бир боор Ата Журттун эркиндиги менен көз каранды эместиги үчүн чечкиндүү күрөшкө аттанган каарман. Драматург бул образ аркылуу патриоттук күчтүү деми менен жалпыга үлгү боло турган оң идеалды көрсөтөт."},{"t":"p","h":"Искендердин образы курч драмалык ситуацияларда, катаал сюжеттик 'ийгиликтүү – успешный"},{"t":"v","l":["1 тарбиялануучу – воспитанник","5 күрөшү – борьба","* өкүлдөрү – представители"]},{"t":"p","h":"<span class=\"pg\" data-n=\"42\">42<\/span>кагылыштарда ачылып олтурат. Өмүр менен тагдырды таразага койгон татаал турмуштук жагдайлар Искендердин нравалык күч-кубатын, көз караштарын сынап, анын образын сюжеттик агымда улам дааналанта берет,"},{"t":"p","h":"«Адам драманын каарманы болуп саналат, – деп жазган улуу Белинский, өз мезгилиндеги драмалык чыгармаларды талдай олтуруп, – драмада адамга окуялар кожоюндук кылбайт, тескерисинче, адам окуяга кожоюн болуп, өз эрки менен анын тигил же бул жол менен чечилишине же аякташына таасир этет». Искендердин букара элдин жалпы кызыкчылыгынан улам келип чыккан өз позициясы бар. Ал ушунусунда бекем турат. Драманын терс каармандарынын бири Максут Синьцзяндык сүткор Учей-Фуга мындай дейт: «Жок, кокуй, Искендер ыкка көнөт деп ойлобонуз», Искендердин ыкка көнбөгөн мүнөзү анын эл мүдөөсүн көздөгөн түпкү максаты менен терең байланышкан. Ал өзүнүн туткан позициясына каршы көрүнүштөргө кез болгондо, кара таман калктын кызыкчылыгы бузулганда, чындыкка, акыйкатка шек кеткен жерде бардыгын жыйыштырып таштап, тайманбай кармашка чыгат, Анын «ыкка көнбөгөн» мүнөзү пьесада дайыма конфликттин, «чыр-чатактын» күнөөкөрү, себепкери болуп чыгат, Жусуп Турусбековдун «Ажал ордуна» драмасында бири-биринен ачык айырмаланган, бири-бирине карама-каршы багытты алып жүргөн жандуу кейипкерлерди түзө алышы, конфликтти каармандардын кагылышы катары өнүктүрө билиши драматургиядагы жагымдуу саамалык болду – жана бул жалпы эле кыргыз драматургдары искусствонун бул түрүнүн спецификасын, драмалык конструкциянын өзгөчөлүктөрүн өздөштүрө баштагандыгын айгинелеген факт эле,"},{"t":"v","l":["Драманын (башкы проблемасы) негизги сюжеттери:","1. Элдик көтөрүлүштүн планын талкуулоо."]},{"t":"p","h":"2. Падышачылыктын жазалоочу отряддары менен болгон кармаш."},{"t":"p","h":"3. Ысык-Көл менен коштошуу."},{"t":"p","h":"4. Элдин Кытай жеринде жергиликтүү сүткорлор менен күрөшү."},{"t":"p","h":"5. Туулган жерге кайтып келүү."},{"t":"h3","h":"Негизги каармандары: Искендер, Бектур, Зулайка"},{"t":"p","h":"Искендер элдик мыкты сапаттарга ээ, күчтүү, адамгерчиликтүү, Мекенин терең сүйгөн, Ата Журттун эркиндиги менен көз каранды эместиги үчүн күрөшкө аттанган каарман."},{"t":"p","h":"Бектур күчтүү патриоттук духу менен көңүлдү бурат. Ал дайыма терең ой жүгүртүп, элдин эмне үчүн көтөрүлүп жаткандыгынын себебин билүүгө аракет кылат. Бектур чынчыл, эмгекти сүйгөн, айкол адам."},{"t":"p","h":"Зулайка кыйынчылыкка майышпаган, турмуштун кыйын-кыстоолоруна оңой менен алдырбаган активдүү каармандардын бири. Зулайка аркылуу автор революциядан мурунку кыргыз кыздарынын кулк-мунезун, көз карашын, иш-аракетин жалпылаштырып көрсөткөн."},{"t":"p","h":"<span class=\"pg\" data-n=\"43\">43<\/span>«Ажал ордуна» драмасынын терс каармандары: Максүт, Учей- Фу, Алымбай."},{"t":"p","h":"Алардын ар бирине автор тарабынан так мүнөздөмө берилет. Биз түлкүдөй амалдуу, кыйды Максүттү, көкүрөгүн көтөргөн мактанчаак канкор офицерди, адамдык абийирден кеткен ач көз соодагер Учей-Фуну бири-бири менен чаташтырбайбыз."},{"t":"v","l":["ва чынчыл – правдивый","кыйынчылыкка майышпаган – не сломанная трудностями","кыйын-кыстоолоруиа – затруднения","мактанчаак – хвастун","Жаңы сөздөргө көнүл бургула! Аларлы жаттап алгыла.","чагылткан – отражено","көтөрүлүш – восстание","кыйрап калуу – разрушаться","жок болуу – исчезнуть","жергиликтүү – местный","кыйынчылык – трудность","кулк-мунез – хзрактер","мүнөздөмө – характеристика"]}],"sub":[{"title":"Адабият таануу илими","b":10},{"title":"Поэзия","b":12},{"title":"Проза","b":44},{"title":"Драматургия","b":67},{"title":"«Каныбек» романы жөнүндө","b":98},{"title":"Романдын башкы каармандары","b":104},{"title":"Романдын терс каармандары","b":108},{"title":"§ 1. К. Жантөшевдин чыгармачылыгына жалпы мүнөздөмө бергиле.","b":112},{"title":"Каныбек","b":116},{"title":"Жаңы сөздөргө көңүл бургула: 7","b":222},{"title":"Үмүт","b":227},{"title":"«Ажал ордуна» драмасы жөнүндө","b":289},{"title":"Негизги каармандары: Искендер, Бектур, Зулайка","b":307}],"pages":[12,43]},{"title":"Ажал ордуна","blocks":[{"t":"h3","h":"Ажал ордуна"},{"t":"v","l":["(Драмасынан үзүндүлөр)","Ысык-Көл менен коштошуу","Туулуп өскөн кең Ысык-Көл калдыңбы?","Заман чиркин, каарына сен алдынбы.","Кен Ала-Тоо мынча неге томсордун,","Боорундагы элиңди сен тандыңбы? |","Кордук-зордук зомбулукка кене албай,","Топурак буйруп ез боорунда еле албай.","Окко учуп өлгөндөрдү жашырып,","Жай баракат урмат кылып көмө албай.","Биз жөнөдүк түп көтөрө Кытайга,","Кош, Ысык-Көл, кош, Ала-Тоо, өскөн жер!","Алдыдагы емур жолу карангы,","Кандай кунге учураша калын эл,","Кош, ескен жер, касиеттуу Ысык-Кел!","Ко өт тарткыла."]},{"t":"p","h":"<span class=\"pg\" data-n=\"46\">46<\/span>«ленин жолу» оолгон. Л Ж суп 7 ҮТ Ф ековду, усу Урус ун адабий тушоосун кескен алгачкы саамалык ы ы у М ш г"},{"t":"p","h":"Жетим балдар үйүндө окуп жүргөндө жаш Жусуп татар, казак тилиндеги адабияттар менен тааныша баштаган."},{"t":"p","h":"Түптөгү А йыл-чарба техникумунда Жусуптун адабиятка болгон кызыгуусу чындап ойгонот. Жусуп бул жерде өзүнчө эле бир адабий чөйрөгө туш болгондой болот. Техникумда кийин кыргыз маданиятынын таанымал ишмерлеринен болуп калган, ошо кездеги жаш акын Мукай Элебаев Молдогазы Токобаев, Мукамбет Дөгдүров, Шейше Орозов сыяктуу искусствого талпынган жаш таланттар менен бирге жашап, окушу ансыз да көркөм сөзгө шыктуу Жусупту адабиятка күчтүүрөөк талаптантат"},{"t":"p","h":"Жусуп Турусбековдун учкул калеминен 30-40-жылдарда ар түрдү темага арналган «Өткөн күндө», «К\\ ыргыздар» (бүтпөй калган) крй, «Каракчынын трагедиясы» аттуу поэмалар да жаралган. Аталган поэ. маларга Жусуптун лирикаларындагыдай эле чын ыкластуу интонация образдуулугу, предметтүүлүк, поэтикалык каражаттардын сыйымдуулугу кыскалык мүнөздүү."},{"t":"p","h":"Акындын омуру Ата Журтка сөзү менен да, иши менен да кызмат кылуунун жогорку үлгүсү."},{"t":"v","l":["Еч саамалык – новинка","чындап ойгонот – серьёзно проснуться","чөйрөгө – среде","шыктуу – имеющий склонность, имеющий пристрастие","учкул – быстролётный","чын ыкластуу – сердечный","сыйымлуулук – вместимость","кыскалык мүнөздүү – кроткий"]},{"t":"h3","h":"АДАБИЯТ ТЕОРИЯСЫНАН"},{"t":"p","h":"Ар кандай көркөм чыгармада сүрөттөлгөн табияттын көрүнүштөрү"},{"t":"p","h":"заж (франц. – елке, чөлкөм) – деп аталат; ал жазуучунун стилине жана ‘ыгармачылык усулуна жараша ар түрдүү милдет аткарат. Табият сүрөттөрү чыгарманын идеялык-эстетикалык мазмунун ачууга кызмат кылат ал чыгармада сүрөттөлүп жаткан окуяга, каармандын ички дүйнөсүнө, маанайына, жалпы атмосферага шайкеш келип, аны менен үндөшүп турушу же, тескерисинче, карама-каршы келип, контраст түзүшү мүмкүн Албетте. ал же бул жердин, өлкөнүн шарты, өзгөчөлүгү, жер-суусу, климаты менен тааныштыруу максатында жазылган, тааныткыч мааниси ба сүрөттөмөлөр да болот."},{"t":"p","h":"Пейзаж (франц. – мекен, жер) – көркөм адабий чыгармаларда жаратылыш көрүнүштөрүн, табияттын көркүн сүрөттөө, Жазуучу пейзаждык сүрөттөөлөрдү жазуу менен табият көрүнүштөрүнө карата өз мамилесин зет, каармандардын ички сырын, мүнөзүн ачууга жардам кылат. Кыргыз АДЕ билдирет, жалпы чыгармадагы окуянын жүрүшүнө олуттуу таасир киргибиятында <span class=\"pg\" data-n=\"47\">47<\/span>пейзаждык лирика элдик эпостордон тартып аңгеме-очерктерге чейин пейзаждык сүрөттөө кеңири колдонулуп жатат. Эпостук чыгармада пейзаж сүрөттөрү патриотизм идеялары менен өтө тыгыз байланышта берилип, жаратылыш кубулуштары каармандарды курчап, алардын ал абалына, ишинин максатына жараша өзгөрүп турат. Баатырлар кайгырганда:"},{"t":"p","h":"«Карагай ыйлайт, тал ыйлайт, Суулар ташыйт, тоо көчөт». («Манас») Чыгармаларда билгичтик менен тартылган пейзаждык сүрөттөөлөр бүткүл чыгарманын духуна сиңип, өтө көп милдетти аткарат. Ч. Айтматовдун «Ак кеме» повестинде мындай пейзаждык сүрөттөө бар: «Түн жарымы ченде ай тоолордун үстүнө келди салаңдап, жарыгы муздак мунарыктап, мөңгүлүү чокунун кылда учунда турду. Ай нуруна мөңгү муздар түнт жылтырап, аска-зоолор сүр күткөндөй ала көлөкө, Азыр ай тырс жарылып. быркырап кулап түшчүдөй тегеректеги тоо чокулары тунжурап моюн созот, береги токой да кара көлөкө жамынып, күдүрөйт. Коктунун таманындагы суу гана жаагын баспай шаркырайт», Пейзаж дегенге жалаң эле жаратылыш табияты эмес, адам жараткан табияттын сүрөттөлүшү да кирет: «Эгин талаасынын пейзажы», «шаар пейзажы», «индустриялуу пейзажы» деген сыяктуу түшүнүктөр ушуга байланыштуу."},{"t":"p","h":"Портрет жана пейзаж. Портрет (франц. – портрет, сүрөт) – чыгармада каармандын сырткы көрүнүшүнүн сүрөттөлүшү, мисалы, өңү-түсү, сымбаты. кийим-кечеси, өзүн кармашы. Портреттин чыгармадагы ролу жана мүнөзү ар түрдүү жана ар башка болушу мүмкүн, Негизинен эки – натуралисттик, анкеталык жана психологиялык – түрү учурайт."},{"t":"p","h":"Айрым жазуучулар каармандын жалпылаштырылган портретин бербейт, анын кебете-кешпирине, сырткы көрүнүшүнө тиешелүү белгилерди санап отурбайт. Бул жагынан алар башка жазуучулардан айырмаланып турат. Анткени, адатта, көп жазуучулар каарманы биринчи киргенде эле анын толук портретин кошо беришчү. Мисалы, Жапардын («Алтын кыз») тышкы портрети кенен берилбегенине карабастан, аны адам катары мүнөздөй турган деталдардан жүрүш-турушунан, ишинен, кылган мамилесинен, ой толгоолорунан каармандын психологиялык айкын-ачык жана бир келки образы түзүлөт. Биз анын ички жана тышкы портретин көз алдыбызга толук түрдө элестете алабыз."},{"t":"p","h":"Көркөм чыгармада негизги максат – каармандын ички дүйнөсүн ачуу. Каармандын тышкы портрети, негизинен, ошол максатка кызмат кылат, адамдын ички дүйнөсүн ачуунун бир каражаты болуп эсептелет."},{"t":"p","h":"Ар кандай көркөм чыгармада сүрөттөлгөн табияттын көрүнүштөрү пейзаж (франц. – елке. чөлкөм) – деп аталат; ал жазуучунун стилине жана чыгармачылык усулуна жараша ар түрдүү милдет аткарат. Табият сүрөттөрү чыгарманын идеялык-эстетикалык мазмунун ачууга кызмат кылат, ал чыгармада сүрөттөлүп жаткан окуяга, каармандын ички дүйнөсүнө, маанайына. жалпы атмосферага шайкеш келип, аны менен үндөшүп турушу же, тескерисинче, карама-каршы келип, контраст түзүшү мүмкүн. Албетте. ал же бул жердин, өлкөнүн шарты, өзгөчөлүгү, жер-суусу, климаты <span class=\"pg\" data-n=\"48\">48<\/span>менен тааныштыруу максатында жазылган, тааныткыч мааниси пейзаж дегенге жалан эле жаратылыш табияты эмес, адам жараткан табияттын сүрөттөлүшү да кирет: «эгин талаасынын пейзажы», «шаар пейзажы», «индустриялуу пейзажы»."},{"t":"p","h":"Кыргыздын толукшуган жайлоосу болобу, орустун учу-кыйырсыз со-"},{"t":"v","l":["зулуп жаткан дүңгүрөгөн токою болобу, айтор, алардын баарын адамдын","турмуш-тиричилигине байланыштырып сүрөттөйт.","Жаңы созлорго көнүл бургула:","сырткы көрүнүшүнүн – внешность","сымбаты – достоинства","өзүн кармашы – поведение","учурайт – встречаются","айырмаланып турат – отличаются","карабастан – несмотря","айкын-ачык – открытый","элестете алабыз – можем предстапить","ички дүйнөсүн – внутренний мир"]},{"t":"h3","h":"Жоомарт Бокенбаев"},{"t":"img","src":"data:image/webp;base64,UklGRkIYAABXRUJQVlA4IDYYAADw+ACdASqYAfYBPrVUn0snLS2vLLWqmeAWiWluT+RlU8HlK7PPQ78F4musl4i523CEoAccm0y0hvBEPmAwHxgh/Cv/d3kv9j/+eVv43/D5HL37MV/5+h/5N/364IAjpjM3TIVUz+TzDeJAQsCz0V3I+3q3KX8QojRylhPmKAp4OrQwODoZ1gTQaOkOhPZCwzBHD+5+WTa8Vv7AW2XiJ7Ip5gqt+5P+hT5M6MJlAN0xnAqp7tH36HCcxAA1AQGm8UvVSWzUVf8dWkzhiiC3lGe+bIcbfWmNi3On/qr/hMli05l2ud6xv2txQAtKqZJUBfZOV+ApsYETvQOjdfat4cAjDC1bhK1bFIvh8iTkND8vZ+hYNMUrQzqJ1mlfqErFM7+uQXWcZZCHOMzikh40QXZO4HioxYlOzXQxcFnxBzMPwVDFEiYN1oHooRto6GAp31qv3AaSi4zqhty4WYEq8cqSX5Dur8MaQ4+5aeydYVg2ZYzYXyJMxq98DNPGnwODAGqFDNPFVzZzIQAgthLKAjm6/jXxaprynJXrCTcIWsfzJ1MZeflKUEej6dxjE8rviuK+ognNeiedvzZnFFqTlNBrTmKkpQRoYFOOJoUK9IUF0Yo4U1aK/TQmvqtmB8rpWbunnRh5mPW+F+MCinhFoKXI3aufHnX2QxF8A2nQVqhPb/E9p9JXXq4T52ztdNgf/p9BXFx/exyOj0UIlMHxaV8scZyMZ0Pl6nF8KamDxZoQtTw8lv+4EUyMKERg8TvHldvNV7iMJtMqITJzsZ5lV0Cg0KJbug2KTGcjRFXDOj//C3u/j6a8OXFApAXDy89b/lrX62y8owtCZmz1wDz+Nk5XLKT+yMUmVmwh/mW2qEY3IfHkXPPOk/8I173YAubph6TRjXMlTlAtypJmOMoJNwpwyuwX1xuhyVQUhNG+aXD2h6xQupuEKsBN1xMTIaHz8uIWAzyowaWiwW2HdSIuujgOXhb4nHA6D7yJFuExmnpyneCBYSqRdEpmB0SJ65rcMuWMlEJ0kCJs+7iTS8xv9vIJD9ULa4as+ZxAIFpCnESjFaZIO5/tlG0DU/zyC4a/pvfVE6ma822XSEKQo0HPc2QLeMwvF+ZMuOhTXZy7CPQ0/Z+ay71Wt9TnGAObIBdo6wRymIWnyG6XUJERh2UmJ4Axm1wUkMULMfBkgIz4dweJA05qil07NtIStf1dCgMfob4A9ZfJxjiaVkj+8piNIZLQ/AeJmCQuMi9TerJVi/FYFKkvq/ZCcCAt8V0u5nOv/IBsXLX6NH7GK+CuyLnkUr2H4mq23EUkZVS6u15d6gz2m42oB8OdH0u4+BC44ngVcDwEuFaNLHw6JAIjzNUUm/L4WocBGfhjbtrWrhxoK0/tYDiKu9Fd+bzIHrZvdcC/6nnG80nzVctdxxXGuH+PtZgBRIFBrtRrVk60Jr/fB2OehktKU1pvdm8EvVy7LBvHxUsDJdno7goIOF7zOXNTLQDgzlJJlUfg0I/EZD7rzKMrBKs35P4ygODtXqa2it5U65UUfm0DVT22Q6OW/5lB5JX+3rWjfqzgHq4EZFmrCWU/zUX3OBuXLUkYwuQBWWPLpDXGzwaEaYWcvZypFJi4Povwlh2WTv6DHnl1spcNxVsTMihl+CcWvFKg

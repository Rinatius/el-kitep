здарыбыз – ырыстуу.","<span class=\"pg\" data-n=\"179\">179<\/span>[м карылык – старость","эркеле – ласкать","таңкы – предрассветный","бейит – могила","ниет – намерение, замысел","эркин – свободный, свободно","жел – ветер","ырыстуу – счастливый"]}],"sub":[{"title":"Жоомарт Бөкөнбаев","b":34},{"title":"Кемпир, Өзү үз усен М","b":38}],"section":"Женишбек","pages":[173,179]},{"title":"ТЕРМИНДЕРДИН ТҮШҮНДҮРМӨ СӨЗДҮ ГУ","blocks":[{"t":"h3","h":"ТЕРМИНДЕРДИН ТҮШҮНДҮРМӨ СӨЗДҮ ГУ"},{"t":"p","h":"Драма (греч. – аракет) – сахнага коюуга ылайыкталып жазылган чыгарма, өзүнчө бир адабият теги. Ал байыркы грек адабиятында пайда болуп, ошол мезгилдеги негизги сапаты азыр да кадимкисиндей сакталып келе жатат, б. а. драмалык чыгармаларда окуя каармандардын речинде гана өнүгөт, мында прозадагыдай автордук баяндоо, сүрөттөөлөр болбойт, жанрдын негизин конфликт түзөт. Драма комедия, трагедия, драма болуп үч жанрга ажырайт."},{"t":"p","h":"Жанр, адабий жанр (франц. – тек, тур) – адабий чыгарманын негизги тектери – эпос, лирика, драма жана алардын ар кыл бөлүнүштөрү жанрга кирет. Жанр деп азыркы учурда адабий чыгармалардын түрлөрүнүн жана бөлүктөрүнүн формалары да аталат. Ошондой эле тематикалык өзгөчөлүктөрүнө жараша да жанрга бөлүнөт. Жанр термин катары ар түрдүү аныктамаларга ээ."},{"t":"p","h":"Идея (греч. – ой-пикир) – чыгарманын идеясы – көркөм чыгармада берейин деген ой-максат, ал образдар системасынын бирдигинде берилет. Жазуучу өз чыгармасында белгилүү бир маселелерди ортого коюу менен чектелбейт, өзүнүн идеалы катары анын чечимин берет, мамилесин билдирет, баалайт."},{"t":"p","h":"Образ, каарман (ор. – көрүнүш, туруш-турпат) – турмуштун конкреттүү жана жалпыланган жактарынан алынган адамдын искусстводогу эстетикалык мааниге эгедер чыгармачылык көркөм фантазия менен түзүлгөн көрүнүшү. Образдар илим менен искусствону айырмалап турат. Жазуучу өз предметин көркөм образдар аркылуу сүрөттөйт. Ал өзүнүн дүйнөгө болгон көз карашына, эстетикалык идеалына, чыгармачылык жана турмуштук тажрыйбасына ылайык турмуш чындыгына, көрүп-билген кишилерге алымча-кошумчаларын киргизет, натыйжада образдын эстетикалык жана тарбиялык кудурети көрүнөт, Чыгармадагы образдын аткарган кызматына жана турган ордуна карап, адабият таануу илиминде кейипкер. башкы каарман, экинчи даражадагы каарман, мүнөз. тип деп бир нечеге ажыратылып жүрөт."},{"t":"p","h":"Өмүр баян (греч. – өмүрдү жазуу) – адам өмүрүнүн тарыхын жазуу, Адабият таанууда жазуучунун өмүр жолу үйрөнүлөт. Бул же тигил акын же жазуучунун чыгармачылыгын изилдөө ишинде, аны үйрөнүүдө өмүр баяндык фактылардын, турмуштук окуялардын мааниси чоң. Көптөгөн өлкөлөрдө «Өрнөктүү адамдардын өмүрү» деген адабияттардын сериясы чыгып жатат. Алардын ичинде акын-жазуучулар да бар, Буларды үйрөнүүнүн мааниси чоң."},{"t":"p","h":"<span class=\"pg\" data-n=\"180\">180<\/span>Повесть (ор. – баяндоо) – эпикалык тектин бир жанры. Көбүнчө кара сөз формасында жазылат. Повесть романга караганда азыраак (бир же эки) каарманды сүрөттөшү, анын турмушунун азыраак мезгилин гана объект кылып алышы, аңгемеге караганда көлөмүнүн чонураактыгы, бир эле эпизод эмес, бир нече эпизоддун сүрөттөлүшү, сюжетинин, композициясы романга караганда кыскалыгы, аңгемеге салыштырганда кенендиги камтыйт. менен айырмаланат. Повесть өзүнө аңгеменин да, романдын да белгилерин"},{"t":"p","h":"Поэзия (греч. – жаратамын, чыгарамын) – 1. Байыркы заманда жалпы эле көркөм адабият, сөз өнөрү поэзия деп аталган, Көркөм кара сөз (проза) түзүлгөндөн кийин, поэзия деген термин ыр менен жазылган чыгармаларды гана билгизип калды. 2. Көркөм адабият прозалык чыгармалардан айырмаланып, ыр түзүлүшүнө негизделип жазылган түрү. Элдик эпос, лирика, ыр түрүндөгү драмалык чыгармалардын баары поэзияга кирет. Кыргыз элинин поэзиясы өтө узак мезгилдерден бери эпосто, поэмада, ырда өнүгүп келген. Ырга мүнөздүү көрүнүштөр ыргак, муун, муунак, уйкаштык, строфа – поэзия чыгармаларын жаратуунун негизги касиети."},{"t":"p","h":"Поэма (греч. – жаратам, чыгарма жазам) – поэзиялык формадагы лирикалык же баяндоо ыкмасында жазылган көлөмдүү чыгарма. Ал ыр менен жазылган романдан көлөмүнүн кичирээктиги менен айырмаланат, Алгачкы поэмалар байыркы грек адабиятында пайда болуп, белгилүү акындардын дээрлик бардыгы адабияттын бул түрүндө өз күчтөрүн сынап көрүшкөн. Кыргыз элинде да ондогон элдик поэмалар оозеки түрдө ооздон-оозго өтүп, узак убактар бою жашап келген. Аларда элдин социалдык абалы бир кыйла кеңири берилген. Элдик төкмө акындардын чыгармачылыгында да поэма негизги орунда турат."},{"t":"p","h":"Проза (лат. – эркин сөз маанисинде) – ырга мүнөздүү болгон уйкаштыктар, саптар сакталбай, эркин кара сөз түрүндөгү чыгармалар. Прозага роман, повесть, ангеме, очерк жанрлары мүнөздүү, алар кара сөз менен жазылып, сөзсүз көркөмдүүлүккө ээ болушу зарыл. Поэзияга көбүнчө лирикалуулук жана эмоциялуулук тиешелүү болсо, прозага көбүнчө эпикалуулук мүнөздүү, Кыргыз элдик оозеки адабиятында прозалык чыгармалардын үлгүлөрү (элдик жөө жомоктор, санжыралар, уламыштар, легендалар) – поэзияга караганда анчалык өнүкпөгөн болсо да, жашап келген. Жазма адабияттын пайда болушу менен кыргыз прозасы өстү, өнүктү, орус жана чет элдер, боордош улуттардын адабияттарынын таасири астында прозанын жаңы көрүнүштөрү пайда болду, мүмкүнчүлүктөрү алда канча кеңейди, жалпы адабиятыбызда омоктуу орундары бар мыкты чыгармалар жазылды."},{"t":"p","h":"Роман (франц. – француз, итальян, португал ж. б, роман тилдеринде жазылган чыгармалар) – эпикалык түргө кирүүчү, турмушту ар тараптан кеңири жана жайбаракат сүрөттөөгө алган, каармандары коп жана алардын негизгилеринин образдарын ачуу үчүн бир канча эпизоддор киргизилген, композициялык түзүлүшү жана сюжети көп пландуу чыгарма,"},{"t":"p","h":"Сюжет (франц. – предмет) – адабий чыгармадагы мүнөздөрдүн өсүшүн жана өз маанилерин ачып берүүчү конкреттүү окуялардын системасы. Сюжет түзүү менен автор чыгарманын бүткүл материалдарын бириктирип, <span class=\"pg\" data-n=\"181\">181<\/span>бүтүн картина түзөт. Жазуучу өзү билген окуяларды же ичинен токуп чыккан деталдарды с южетте өз максатына ылайык пайдаланат."},{"t":"p","h":"Үзүндү – чыгармадан алынган кандайдыр бир өзүнчө биримдиги бар түзүлгөн сөз тизмектери. [ неа Жыл р өз мыйзамдарына ылайык рифмага, ритмге, – ыргак менен айтылуучу, поэзиянын талабы менен интонацияга, синтаксиске ээ. Ырдын мындай касиеттери, өзгөчөлүктөрү аны кара сөздөн айырмалап турат. Кыргыз тилинде ыр негизинен үч маани-» деген де – колдонулуп, орус тилиндеги «стих», «стихотворение», «песня» д"},{"t":"raw","h":"<h4 class=\"mk\">терминдердин маанилерин Эпос (греч. – айтуу, сү 2. Фольклордогу эпикалык<\/h4>"},{"t":"v","l":["ат. – 1. Көркөм адабиятында уч түрдүн бири.","чү ыр формасындагы көлөмдүү чы- маданий-социалдык абалы,","гармалар, Эпостордо элдин тарыхы","карым-катнашы, үрп-адат ы, келечектен күткөн тилеги кеңири"]},{"t":"p","h":"лат. Байыркы эпостордо ми фологиялык белгилер кучтуу болсо, улам ме “ н өткөн сайын эпостор адам ту рмушунун реалдуу көрүнүштөрүнө жакынд олтурганын байкоого болот. Эпос дүйнөнүн көптөгөн элдерине мүнөздүү болсо да, кыргыз элинде алар дын өзгөчө залкар үлгүлөрү бар."},{"t":"h3","h":"АДАБИЯТ ТЕОРИЯСЫНАН ТҮШҮНҮК"},{"t":"p","h":"Адабияттагы романтика. б болуп, анын принциптери төм Романтика турмушту адаби күлөр: сүрөттөлүп жаткан көрүлүшү, тта чагылдыруунун өзүнчө бир ыгы, ж „жолу т л ые каармандык энтузиасты көрсөтүү; каармандард кү окуяны көтөрүңкү – эмоционалдык духта берүү: нү.: көркөм сөз көр аракетиндеги көтөрүңкүлүктү алдыңкы планга алып чыгуу: лугу: стилиндеги сим: воликалуулуктун, шарттуулуктун, гиперболалуулукту ажа н арбындыгы; эстетикалык объектиге, б. а. сүрөттөлүп жатийн керне н идеалын алып жүрүшү; турмуш- чурдан адамынын кел субъективдүү мамиленин күчтүүлүгү; ая издөөдөн көрө идеалга умтулууну ачып берген лиризм. анал чейин суреттелушунен, узак"},{"t":"p","h":"ый ее турмушту чагылдыруунун езунче бир айыр ссиянын күчтүү көрүнүшү. Мк Ч. Айтматовду романтик жазуучу деп атаганыбыз менен, у. у"},{"t":"p","h":"кайрылып көрөлү: анын ташка, сууга, өсүмдүктөргө, кылы нен китеп капка кайрылышы бул өзү романтикалык сүрөтт"},{"t":"p","h":"т, ме- № Кр ини Бала болгону жети гана жашта, бул мезгил адам өмүрүнү ал романтикасын жазуучу окурмак чына ачып берүүдө ы"},{"t":"p","h":"О ышты (кооз табият езу романтикалуу) романтикалуу, б. а."},{"t":"p","h":"пафосто берет, а ошол жаратылыш бүлүнүп, бу <span class=\"pg\" data-n=\"182\">182<\/span>зулат эмеспи, ошондо окурман мурдагы өзү элестеткен табияттын алдыда болуучу тагдырына жан кейиши керек болот эмеспи; үчүнчүдөн, Баланын жомокко карата романтикасы, баёо ишеними бар; төртүнчүдөн повесть өзү трагедиалдуу аяктайт эмеспи, ошол трагедиянын күчүн сездирүү үчүн"},{"t":"p","h":"р Бала дүйнөсүн ушунчалык назик, көтөрүңкү йу ей таасирдүүлүгүн күчөтүп, образды терең ачууга жарменен, мезгилдин талабы менен байланышат да, адабий аренада ар Романтика, романтикалык образдар белгилүү бир тарыхый шартта түрд { көрүнүштө байкалат, каармандардын реалдуу дүйнөсүн ачууда быды үс бир көркөмдүктүн каражаты жана формасы катары кызмат өтөйт,"},{"t":"p","h":"ар тараптуу унулууле, турмуш көрүнүштөрүнүн"},{"t":"p","h":"рүүдө сүрөткерге жардам берет,"},{"t":"p","h":"Лирикалуулук жана драмалуулук."},{"t":"p","h":"Лирика акындын ички сезимин: ой толгонууларын, кубанычын өкүнүчүн, кыялдануусун, азап чегүүсүн өксүктөрүн, түйшөлүүлөр н, ырахаттанууларын чагылдырса, драма сахнага коюуга ылайыктап ка"},{"t":"p","h":"адабияттын тектери экенин ажыратасыңар. Ал эми, лирикалууу н&gt; ери берүүчү, турмушту көркөм чагылдыруунун бир ыкма-"},{"t":"p","h":"– каармандын. же баяндоочунун, автордун ички дерин чагылдыруу, Мында речтин эмоционалдуулугу, романтикалууе лугу, ашкере буркан-шаркан төгүлүп-чачылуу, поэтикалык көркөм сөз ражаттарынын арбындыгы көзгө даана көрүнөт, стили өзүнчө би ыргактанып, ырга окшогонсуп турат. Окурманды арбап, сүрөттөлүп жайа окуяны, же тагдырды ичтен терен түшүнүүгө жардам берет, анын ички толгонууларына аралаштырат. Лирикалык чегинүүлөр адам тагдырынын"},{"t":"p","h":"романтикалуулугун, эмоционалдуулугун тастыктайт. Эпибүтүндөй бир лирикалуу романда, повесттер, комедиялар кезигет. Мындай да, драмада да мындай лирикалуу жерлер жолуга берет, атүгүл чыгармаларда, же эпизоддордо сюжет маанилүү эмес да негизги би планга ички сезимдер, адамдын маанайы чыгат."},{"t":"p","h":"калуулукту карагыла, ички сезимдер кандай берилет, же «Кылым ка ыз Ч. Айтматовдун «Жамийла» повестиндеги обон эпизодундагы лирибир күн» романындагы Абуталиптин Сары-Өзөктө балдары менен жар жаагандагы кубанычтары не деген лирикалуу деталдар, көрсө артында"},{"t":"p","h":"келатыптыр. Абуталиптин камакка алынышы, сурак, балр. тасын сагынышы, кусалыктары, түрмө мунун баары адам тагдырынын драмасы, адабиятта турмушту чагылдыруунун драмалуулугу."},{"t":"p","h":"Драмалуулук – диалектикалык эстетиканын бир көрүнүшү болуп"},{"t":"p","h":"карама-каршылыктардан жана конфликттерден келип чыгат, ст на узын чөйрө жана башка адамдар менен татаал мамиле- рчүйт. Драмалуулукта окуя – кырдаал өтө чыңалат, конфликттер"},{"t":"p","h":"ан курчуган учур болот, карама-каршы тараптар тирелишет, же адамдын <span class=\"pg\" data-n=\"183\">183<\/span>ички дүйнөсүндө дүрбөлөң жүрөт, мындай абалдар, албетте, окуянын мурдагы өсүп-өнүгүшүнүн натыйжасы, каармандардын жүрүш-турушунун акыр аягында келип чыккан корутундусунун акыбети. Окурманды китептен баш көтөртпөй, анын жыйынтыгын чыдамсыздык менен күттүргөн мындай драмалуу жагдайлар ишенимдүү болсо каармандардын образын түшүнүүдө, психологизмдин таасирин сезүүдө, мүнөздөрдүн кагылышын анализдөө чоң мааниге ээ."},{"t":"p","h":"Көркөм чыгарманын стили."},{"t":"p","h":"Силер кандайдыр бир автордун чыгармасын окуганда анын башка авторлордон айырмачылыгын байкайсыңар, маселен Т. Сыдыкбековдун романдарын окугула да, К. Жантөшевдин чыгармаларын окуп көргүлө, Үчөө үч бөлөк, окуясы эле эмес, жазуу манералары, окуяны сүрөттөө, ачып берүү ыктары. Демек, үчөөнүн уч башка стили бар."},{"t":"p","h":"Стиль – көркөм чыгарманын бүтүндөй тулку боюнан, анын мазмун жана формасынан көрүнөт, сүрөткердин дүйнө таанымы, ой жүгүртүүсү, өскөн чөйрөсү, алган турмуштук тажрыйбасы, адабий мектеби, тил байлыгы менен байланышат жана ал бара-бара калыптанат да, жазуучуну башкалардан айырмалап көрсөтөт. Адабияттагы жазуучунун жекече стили – жеке мүнөзүнө да байланыштуу каралууга тийиш, «стиль – бул адам» деген учкул сөз бар, ошондой эле улут адабиятынын ошол этаптагы конкреттүү өнүгүш абалы менен да байланышат."},{"t":"p","h":"Кара сөзчү К. Жантөшевдин стилине фольклорго жакындык, 6. а, жомок сымал сюжеттерди киргизүү, макал-ылакап, учкул сөздөрдү кеңири колдонуу, каармандары идеализациялоо, окуяларды кубултуп, кызыктуу кылып, тез алып баруу мүнөздүү болсо, У. Абдукаимовдун стилине окуяларды кылдаттык менен жайбаракат сүрөттөө, реалисттик боёктор сүртүү, каармандын ич дүйнөсүнө терен сүңгүп жазуу, окуяларды панорамалуу алып баруу, психологиялуу, драмалуу кырдаалдарды тереңдетүү мүнөздүү."},{"t":"p","h":"Психологиялык роман."},{"t":"p","h":"Адамдын ички жан дүйнөсүн психологиялык роман анализге алган чыгармалар психологиялык чыгармалар деп аталат да, ал роман жанрында жазылса – психологиялык роман катары саналат,"},{"t":"p","h":"Элдик оозеки чыгармалардын психологиялык жагдайлары, б. а. ички дүйнөсү өтө терең ачылбайт, ал көбүнчө жазма адабиятка мүнөздүү көрүнүш. Адамдын жан дүйнө диалектикасын ачып, ички купуя сырларына сүңгүп кирүү менен, биринчиден, каармандын образы тереңдейт, экинчиден. кабыл алынып жаткан чыгарманын окумдуулугу артат. Классикалык адабиятта Л. Толстойдун, Ф. Достоевскийдин, М. Шолоховдун чыгармаларында психологиялык кырдаалда өтө чебер берилип, каармандардын жан дүйнөлөрү хирург скальпелинен өткөрүлгөндөй сүрөткер анализинен өткөрөт."},{"t":"p","h":"Ж. Турусбеков «Ажал ордуна» романы мына ошолордун катарына кирет. Ал романдагы психологизмдин күчтүүлүгү жагынан кыргыз адабиятын жаңы бийиктикке көтөрдү. Муну романдагы кыйчалыш, татаал <span class=\"pg\" data-n=\"184\">184<\/span>тагдырларды ошол татаал бойдон ачып бергендигинде, алардын ички карама-каршылыктарын, санааркоо, күйүт, ыза, сүйүнүч сезимдерин терен талдап көрсөткөндүгүндө, адамдын көөдөнүндөгү купуя сырларын окурман алдына төгүп таштагандыгында, «микро дүйнөгө» (Ч. Айтматовдун мүнөздөмөсү) чалгын чалгандыгында. Сезим акыл-эстин катышы жана диалектикасын ачып берүүдө өтмө катар катышып турат."},{"t":"p","h":"Кээде каармандын психологиялык абалын көрсөтүү үчүн табият көрүнүштөрүнүн ар кыл жагдайларын (бороон, чапкын жамгыр) да ачып берет, жаныбарлардын конкреттүү абалы менен да ассоциацияланат (мисалы. Танабай менен Гүлсарат)."},{"t":"p","h":"Чыгармаларды психологиялуу жазуу сүрөткердин стилине, анын чеберчилигине байланыштуу."},{"t":"p","h":"Тарыхый чыгарма."},{"t":"p","h":"Тарыхый чыгармада – болуп өткөн окуялар, конкреттүү жашаган тагдырлар жазуучунун милтесине алынат да, чындыктан четтебей, айрым окуя-көрүнүштөр, каармандар ойдон чыгарылса да, негизги тарыхый акыйкатка дал келип көркөмдөштүрүлөт. Тарыхчы үчүн факт эң маанилүү нерсе болсо, жазуучу үчүн ошол фактыдан эстетикалык сабак алуу, көркөм сүрөт тартуу маанилүү, ошол үчүн өткөн учурду бүгүнкү күн менен, азыркы окуу окурмандын кабыл алуусу, дүнүйө таанымы менен байланыштыруу, заманды кеңири берүү зарылдыгы келип чыгат. Тарых илиминин далилдерине, маалыматтарына таянылат жана өзү ойдон чыгарган окуяларды, каармандарды да сүрөттөлүп жаткан мезгилдин өзгөчөлүктөрүнө, колоритине ылайыкташтырат, ошол кезде ушундай болушу мүмкүн сыяктуу мотивдештирилет,"},{"t":"p","h":"Дүйнө адабиятынын тарыхын карап көргөндө, англиялык жазуучу В. Скоттун (1771—1832) чыгармаларынан таргып тарыхый тема кеңири иштелип, И. Гёте, Ф. Шиллердин чыгармаларында андан ары өнүктүрүлгөн,"},{"t":"p","h":"Т. Касымбековдун «Сынган кылыч» романы дүйнөлүк тарыхый романдын көчүн улайт. Тарыхый чыгармалар көбүнчө тарыхый инсандардын тагдыр-таржымалы тууралуу жазылат, мындай биографиялык-тарыхый чыгармаларга ошол башкы каарман менен мамилелешкенин, сандардын бейнелери зарылдыгына жараша киргизилген. Улуттун, элдин тарыхындагы урунттуу бурулуш учурлар тарыхый жанрдын объектисине көп алынат, негизги милдети өткөн бир тарыхый окуяны чагылдыруу аркылуу ошондон таалим-тарбия сабагын алуу, кылчайбай кеткен жылдарды бүгүнкү күндүн адамынын таанып билүүсүнө айлантуу, өткөнгө азыркынын турнабайын салуу болуп эсептелет."},{"t":"p","h":"Тарыхый мезгилдин бөтөнчөлүгүн берүү үчүн автор сүрөттөлүп жаткан учурдун жашоо образын чагылткан, каармандардын буюм-тайымын, кийим-кечегин, ошол кез үчүн башка мүнөздүү нерселерди сүрөттөйт, тарыхый сөздөрдү колдонот, Эл арасында оозеки айтылган кептерди, аңызуламаларды, санжыраларды да колдонуу менен аларга тарыхый негиз берет."},{"t":"p","h":"Тарыхты чагылтууда жазуучу историзм принцибин карманат, б. а. сүрөткер өзү жашап аткан мезгилдин ыңгайына ылайыкташтырат, азыркы окурмандын идеалына, тибине жакындатат."},{"t":"p","h":"<span class=\"pg\" data-n=\"185\">185<\/span>Сүрөткердин чыгармачылык инд алая – милдети чыгарма жаратуу, турмушу жана нА ивидуалдуулугу. адамды ар ким ар кандайча көрс муштагы адамды ачып берүү, чагылдыруу, бирок ошол к, бекен өтөт. Л. Толстой айткандай, оку китепти колго алганда «Кана. деги кан дай адамсың? Турмуш жену 1 п эмне жаңы нерсе айтып бере аласы й сын» деп, китепке үңүлө баштайт. лен, кыргыз адабиятында 1916-жылдагы Улуттук-боштондук анын жүрүшү, жеңилиши жөнүндө көп эле чыгармалар ы; тор ошол турмуш чындыгын өзү нүн жеке өзүнчөлүгү мене б аракет кылды. Ал бетт е, анда алар ар бири езунун эмнени,"},{"t":"v","l":["керектигине ылайык, турмушту к тажрыйбасына, адаби","бир эле тарыхый окуяны, окшош тур й муш көрүнүштөрүн ар"]},{"t":"p","h":"барышты, Сүрөткер ар бир эпизодго, каарманга өзүнүн көз ка 4 ашын, стилин, антипатия – симпатия – сын билдирет."},{"t":"p","h":"Сүрөткердин чыгармачылык индивидуалдуулугу деген көп жактуу каралып жүрөт, ал автордун өмүр жолу да, көз карашы да, талант эчу\" я илиги да, ошол кезде шарт – жагдайга байланышкан социалдык масе"},{"t":"p","h":"Индивилуаллуулук бул – кайталангыс. оз алдынча башкаларга       var F = lsGet('libFilter', null) || { g: '', s: '' };
      var grades = [];
      list.forEach(function (b) { gradesOf(b).forEach(function (g) { if (grades.indexOf(g) < 0) grades.push(g); }); });
      grades.sort(function (a, b) { return a - b; });

  // "7", 7, "7–9" or "10-11" -> [7], [7, 8, 9], [10, 11]

  function downloadBook(b, onProgress) {

  // ================================================================ READER
  var ICONS = {

      '<div class="foot"><span class="t"></span><span class="n"></span></div>' +

    vp.addEventListener('touchend', function () {
      if (!touching) return; touching = false;
      if (!horiz) return;
      var v = Math.abs(dx) / Math.max(1, Date.now() - st);
      if (dx < -60 || (dx < -20 && v > 0.3)) next();
      else if (dx > 60 || (dx > 20 && v > 0.3)) prev();
      else show(page, true);
    });

    // ---- taps: left third back, right third forward, middle shows menus
    vp.addEventListener('click', function (e) {
      var sel = window.getSelection && String(window.getSelection());
      if (sel) return;
      if (reader.classList.contains('ui')) { reader.classList.remove('ui'); return; }
      var x = e.clientX / vp.clientWidth;
      if (x < 0.3) prev(); else if (x > 0.7) next();
      else if (e.target.tagName === 'IMG' && e.target.closest('figure')) openZoom(e.target);
      else if (e.target.closest && e.target.closest('figure svg')) {
        var sv = e.target.closest('figure svg'), vb = (sv.getAttribute('viewBox') || '0 0 300 150').split(/\s+/);
        var im = document.createElement('img');
        im.setAttribute('data-w', Math.round(vb[2] * 4)); im.setAttribute('data-h', Math.round(vb[3] * 4));
        var xml = sv.outerHTML.indexOf('xmlns=') < 0 ? sv.outerHTML.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"') : sv.outerHTML;
        im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml.replace(/style="[^"]*"/, ''));
        openZoom(im);
      }
      else reader.classList.add('ui');
    });
    // ---- picture viewer: tap a picture to see it full screen; tap again to enlarge, scroll to move
    function openZoom(img) {
      var z = document.createElement('div'); z.className = 'zoom';
      var big = false;
      z.innerHTML = '<div class="zoom-in"><img alt=""></div><button class="icon zoom-x" aria-label="' + esc(t('close')) + '">' + ICONS.close + '</button>';
      var zi = $('img', z); zi.src = img.src;
      var fit = function () {
        var W = window.innerWidth, H = window.innerHeight, w = +img.getAttribute('data-w'), h = +img.getAttribute('data-h');
        var s = Math.min(W / w, H / h) * (big ? 2.5 : 1);
        zi.style.width = Math.round(w * s) + 'px'; zi.style.height = 'auto'; zi.style.maxWidth = 'none'; zi.style.maxHeight = 'none';
      };
      zi.onclick = function (e) {
        var inr = $('.zoom-in', z), r = zi.getBoundingClientRect();
        var fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
        big = !big; fit();
        if (big) { inr.scrollLeft = fx * zi.offsetWidth - window.innerWidth / 2; inr.scrollTop = fy * zi.offsetHeight - window.innerHeight / 2; }
      };
      $('.zoom-x', z).onclick = function () { z.remove(); document.removeEventListener('keydown', zkey); };
      var zkey = function (e) { if (e.key === 'Escape') { z.remove(); document.removeEventListener('keydown', zkey); } };
      document.addEventListener('keydown', zkey);
      document.body.appendChild(z); fit();
    }

    function onKey(e) {
      if ($('.zoom')) return;
      if ($('.sheet')) { if (e.key === 'Escape') closeSheet(); return; }
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    }
    document.addEventListener('keydown', onKey);
    var rt; function onResize() { clearTimeout(rt); rt = setTimeout(relayout, 150); }
    window.addEventListener('resize', onResize);
    // wheel on desktop
    var wheelLock = 0;
    vp.addEventListener('wheel', function (e) {
      var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(d) < 20 || Date.now() < wheelLock) return;
      wheelLock = Date.now() + 350; if (d > 0) next(); else prev();
    }, { passive: true });

    slider.addEventListener('input', function () { i2.textContent = t('page') + ' ' + pgList[+slider.value] + ' / ' + pgList[pgList.length - 1]; });
    slider.addEventListener('change', function () { goBookPage(pgList[+slider.value]); });

    // ---- sheets
    function closeSheet() { var a = $('.sheet'), b = $('.sheet-bg'); if (a) a.remove(); if (b) b.remove(); }
    function openSheet(html) {
      closeSheet();
      var bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.onclick = closeSheet;
      var sh = document.createElement('div'); sh.className = 'sheet'; sh.innerHTML = html;
      document.body.appendChild(bg); document.body.appendChild(sh);
      return sh;
    }

    $('.b-toc').onclick = function () {
      var html = '<h3>' + esc(t('contents')) + '</h3>' +
        '<div class="goto"><input type="number" inputmode="numeric" placeholder="' + esc(t('gotoPage')) + '"><button class="btn primary">' + esc(t('go')) + '</button></div><div class="toc">';
      var lastSec = null;
      chapters.forEach(function (c, ci) {
        if (c.section && c.section !== lastSec) html += '<div class="sec">' + esc(c.section) + '</div>';
        lastSec = c.section || lastSec;
        html += '<a href="#" data-c="' + ci + '" data-b="0"' + (ci === ch ? ' class="cur"' : '') + '>' + esc(c.title) +
          (c.pages ? '<span class="p">' + c.pages[0] + '</span>' : '') + '</a>';
        if (c.sub) {
          c.sub.forEach(function (s) {
            if (s.b != null) html += '<a href="#" class="sub" data-c="' + ci + '" data-b="' + s.b + '">' + esc(s.title) + '</a>';
          });
        } else {
          c.blocks.forEach(function (b, bi) {
            if (b.t === 'h2' && bi > 0) html += '<a href="#" class="sub" data-c="' + ci + '" data-b="' + bi + '">' + b.h.replace(/<[^>]+>/g, '') + '</a>';
          });
        }
      });
      var sh = openSheet(html + '</div>');
      var cur = $('.cur', sh); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'center' });
      sh.addEventListener('click', function (e) {
        var a = e.target.closest('a[data-c]'); if (!a) return;
        e.preventDefault(); closeSheet(); reader.classList.remove('ui');
        goBlock(+a.getAttribute('data-c'), +a.getAttribute('data-b'));
      });
      var inp = $('input', sh);
      function go() { if (goBookPage(parseInt(inp.value, 10))) { closeSheet(); reader.classList.remove('ui'); } }
      $('.goto button', sh).onclick = go;
      inp.onkeydown = function (e) { if (e.key === 'Enter') go(); };
    };

    $('.b-set').onclick = function () {
      function seg(key, opts) {
        return '<div class="seg" data-k="' + key + '">' + opts.map(function (o) {
          return '<button data-v="' + o[0] + '"' + (o[2] ? ' class="' + o[2] + (String(S[key]) === String(o[0]) ? ' on' : '') + '"' : (String(S[key]) === String(o[0]) ? ' class="on"' : '')) + '>' + o[1] + '</button>';
        }).join('') + '</div>';
      }
      var sh = openSheet(
        '<h3>' + esc(t('settings')) + '</h3>' +
        '<div class="set"><label>' + esc(t('fontSize')) + '</label><div class="seg"><button data-fs="-2" style="font-size:14px">A−</button><button class="fsv" disabled>' + S.fs + '</button><button data-fs="2" style="font-size:20px">A+</button></div></div>' +
        '<div class="set"><label>' + esc(t('theme')) + '</label>' + seg('theme', [['light', t('light'), 'swatch'], ['sepia', t('sepia'), 'swatch'], ['dark', t('dark'), 'swatch'], ['contrast', t('contrast'), 'swatch']]) + '</div>' +
        '<div class="set"><label>' + esc(t('font')) + '</label>' + seg('font', [['serif', '<span style="font-family:Georgia,serif">' + esc(t('serif')) + '</span>'], ['sans', '<span style="font-family:Roboto,Arial,sans-serif">' + esc(t('sans')) + '</span>']]) + '</div>' +
        '<div class="set"><label>' + esc(t('spacing')) + '</label>' + seg('lh', [[1.35, '1.35'], [1.55, '1.55'], [1.8, '1.8']]) + '</div>' +
        '<div class="set"><label>' + esc(t('lang')) + '</label>' + seg('ui', [['ru', 'Русский'], ['ky', 'Кыргызча']]) + '</div>');
      sh.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.hasAttribute('data-fs')) {
          S.fs = Math.max(13, Math.min(34, S.fs + +b.getAttribute('data-fs')));
          $('.fsv', sh).textContent = S.fs;
        } else {
          var k = b.parentNode.getAttribute('data-k'); if (!k) return;
          var v = b.getAttribute('data-v'); S[k] = k === 'lh' ? +v : v;
          Array.prototype.forEach.call(b.parentNode.children, function (x) { x.classList.toggle('on', x === b); });
          if (k === 'ui') { applySettings(); closeSheet(); route(); return; }
        }
        applySettings(); relayout();
      });
    };

    cleanup = function () {
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('resize', onResize);
      closeSheet();
    };

    var pos = lsGet(posKey, null);
    if (pos && chapters[pos.ch]) goBlock(pos.ch, pos.b || 0); else { renderChapter(0); show(0, false); }
    // fonts can change metrics after first paint
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  }

  // ---------------------------------------------------------------- boot
  applySettings();
  window.addEventListener('hashchange', route);
  route();
  if (!EMB && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline support unavailable */ });
  }
})();
</script>
</body>
</html>

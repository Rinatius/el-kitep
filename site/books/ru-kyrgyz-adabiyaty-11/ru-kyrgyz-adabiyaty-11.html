жаңы ачылган Кыргызстан мамлекеттик медициналык институтуна өтүп, анын үчүнчү курсуна барганда оорунун айынан окууну таштоого аргасыз болгон"},{"t":"p","h":"Ошентип, Т. Абдумомуновдун көздөгөн максаты ишке ашпай калган. 1941-жылы Т. Абдумомунов Кыргыз мамлекеттик басмасында адегенде корректор, анан жарым жылдан соң редактор жана котормочу болуп иштей баштайт. 1942-1955-жылдары ал Кыргыз радиокомитетинде редактор, Ош областтык «Ленин жолу» гезитинде котормочу, СССР Жогорку Советинде котормочу жана «Советтик Кыргызстан» журналында бөлүм башчысы кызматтарын өтөгөн. 1946-жылы 26-августта «Драма театрларынын репертуарлары жана аны жакшыртуунун чаралары тууралуу» деген токтомду кабыл алып, анда Москвадагы драма театрлардын репертуарларында жалан эле өткөн замандарга байланыштуу спектаклдер коюлуп, жаңы заман, замандаштардын турмушу чагылдырылбай жаткандыгы катуу сындалган, Мына ушул көрсөтмөгө байланыштуу, С оветтер Союзунун бүткүл театрларында замандаштардын, социалисттик коомдун турмушун көрсөтө турган репертуарларды көбөйтүү аракети күчөгөн. Мына ушул талапка ылайык ал кезде драмалык чыгармаларды жазууга далалаты күчтүү Т. Абдумомунов учурдагы турмуш чындыгынан алып, пьесаларын жаратууга киришкен."},{"t":"p","h":"«Эмне үчүн Абдумомунов өзүнүн чыгармачылыгын башка кыргыз жазуучулары өңдөнүп, ыр жазуудан, же кара сөздөн баштабай, драмалык чыгармаларды жазуудан баштап отурат, мунун себеби эмнеде?». Бул суроону <span class=\"pg\" data-n=\"143\">143<\/span>Т. Абдумомунов мындайча чечмелеген: «Биринчиден, менин чоң атам жомоктогу ар бир каармандын диалогун анын мүнөзүнө жараша өзүнө таандык үн, мимика, жест жана интонация менен айтар эле. Экинчиден, техникумда орус адабиятынан мугалими Н. Н. Ивановский, ал киши жакшы көргөндүктөнбү, айтор, орус алабиятынан сабак бергенде Н. В, Гоголдун «Ревизору» менен Н, А. Островскийдин пьесаларын бизге өзү окуп берип, аны майда деталдарына чейин түшүндүргөндү эмнегедир айрыкча жакшы көрөр эле. Үчүнчүдөн, биз окуп жүргөн кезде колубузга кичине тыйын же се эле кыргыз театрына барар элек (айрыкча «Ажал ордунаны» көргөнү). / ш эми, театрдын таасири баарынан күчтүү болору кимге болбосун белгилүү эмеспи. Төртүнчүдөн, биздин техникумда өз мезгилине жараша бир кыйла күчтүү драма кружогу бар эле. Ага кыргыздын эң мыкты искусство чеберлери, Кыргыз ССРнин эл артисти А. Боталиев менен А. Куттубаев экөө жетекчилик кылышчу, Мен ал кружокко дайыма катышчумун. М. Токтобаевдин «Кайгылуу Какейинде» башкы каармандардын бири Өмүркүлдүн ролун аткарып, А. Куттубаевден мактоо алганым али да эсимде»."},{"t":"p","h":"Т. Абдумомуновдун берген ушул түшүндүрмөлөрүнөн кийин анын жаш кезинен эле драматургия жанрынын сырларын түшүнүүгө багыт алып, ошол жанрга жакын боло баштагандыгын түшүнүү анча кыйынчылыкка турбайт. Ошентип, ал 1945-жылдан баштап драма жазууга аракет кылат. Т. Абдумомуновдун драмалык чыгармаларынын тематикалык баг ыты АР түрдүү, жанрлык, композициялык, стилдик изденүүлөрү бай, Улуу Ата екендик согуштун баатыры Чолпонбай женунде «Чолпонбай» драмасын, элдик оозеки чыгармалардын материалдарынын негизинде «Карагул ботом», «Алдар Көсө» драмаларын, алыскы Вьетнам элинин күрөшү жөнүндө «Биз анын балдарыбыз» драмасын жазган. Т. Абдумомуновдун чыгармаларынын тандалмалары басма тарабынан жарык көрүп, ага 20га жакын көп актылуу пьесалары киргизилген. Мындай жалаң тандалмалуу драмалык чыгармалардан турган эки чоң томдук жарык көрүшү кыргыз драматургиясынын тарыхындагы биринчи окуя,"},{"t":"p","h":"Т. Абдумомунов драмалык чыгармаларынын техникалык багыты ар түрдүү, жанрлык, композициялык, стилдик изденүүлөрү бай."},{"t":"p","h":"Т. Абдумомунов кыргыз адабиятында драматургиянын өнүгүүсүнө зор салымын салган."},{"t":"v","l":["кт сыйлыктын ээси – облалатель награды","демин – лыхание","тыңшап отурчу – полслушивал","өз таасирин тийгизбей – не оказывая свое влияние","аргасыз – безвыходный, неизбежный, вынужденный","чечмеле – рассказыпать или растолковывать детально","таасир – впечатление","стилдик изденүүлөрү – стилевые поиски"]}],"sub":[],"section":"Женишбек","pages":[142,143]},{"title":"«Абийир кечирбейт» драмасы","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"144\">144<\/span>«Абийир кечирбейт» драмасы"},{"t":"p","h":"Т. Абдумомунов «Абийир кечирбейт» драмасы 1963-жылы жазылды. Драма чон ийгилик менен театрларга коюлду, Советтер Союзундагы кырктан ашуунун театр сахналарында көрсөтүлдү. 1977-жылы драманын кыргыз сахнасында 400 жолу коюлгандыгы белгиленди."},{"t":"p","h":"Айткандай эле, драманы адеп окуй баштаганда алгачкы биринчи сүрөттө эле камактан бошонуп келаткан Нурдиндин ичинде бүгүп жаткан чоң сырдын бар экендиги белгилүү боло баштайт. Түрмөдөн чыккан Нурдин шаардагы балдарына келаткан айылдык бир кары адамга жолугуп, экөө сүйлөшүп, сөздөн сөз чыгып отуруп, карыя Нурдинди жакшы адам деп мүнөздөйт. Нурдин таңданып: – «Менин жакшы адам экенимди кандай билдиңиз?» – деп сурайт. Карыя: – «Көзүңдөн байкап турам», – деп жооп берет, Маек андан ары улантылып, Нурдин машинасы менен атайын эле бир кишини тепсетип, сот тарабынан адилет соттолгонун билдирет. Мына ушул кырдаалды байкаган окурманда мындай бир түйүндүү суроолор пайда болот: «Эмне үчүн Нурдин адамды атайын тепсетти? Мындай өмүргө атайылап зыян келтирген адамды жакшы киши катары мүнөздөөгө болобу? Же мында бир сыр барбы?». Кыскасы, драманын биринчи эле сүрөтүндө окуя ушундайча түшүндүрүлөт да, эми андан ары окуянын жандырмагын билүү үчүн окурмандын кызыгуусу арта баштайт. Драманы окуп чыккандан кийин, окурманга мына булар ачык түшүнүктүү болот: Нурдин өзүнүн сүйгөнү Шайыргүлгө үйлөнгөнү жаткан күнү аны жолдошу Нияз бузат. «Шайыргүл Масадыкты сүйөт, Нурдин Москвада жүргөндө ал экөө дайыма бирге болуп, тоого гүл терип, эс алганга бирге барышы, эчак эле биригип алышкан» – деп, Нияз буга Нурдинди бардык жагынан ынандырат. Ачуусу келген Нурдин кетмек болгондо астынан тосуп кетирбей койгон Масадыкты машинасы менен койдуруп кетет. Масадык өлбөй калат, бирок бул кылмышы үчүн Нурдин соттолот. Кийин түрмөдөн келгенден кийин да ал Шайыргүлдүн тагдыры кандай болгонуна кызыгып, бир чети чексиз сүйгөндүктөн көрүүгө ашыгып, аныкына келсе, Шайыргүлдүн күйөөсү Оморго жолугат. Шайыргүлдүн Масадыкка турмушка чыкпаганын билип, эми Масадыктан мунун себебин билмек болот, Масадык канча жолу өзүнүн таза экенин айтса да, бул бузукулукка Нияз күнөөлүү экенин какшаса да, Нурдин ал сөздөргө ишенбейт. Качан гана Сейит бардык чындыкты айтып берип, толук далилдеп салгандан кийин Нурдин бардык күнөө өзүндө болгондугун толук сезип, өзүнүн абийири алдында кечиримсиз иш кылгандыгына өкүнөт. Шайыргүлдү чыныгы сүйүүдөн ажыратып, Масадыкты майып кылган өзүнүн абийири экенин туюп, муну эч убакта кечирүүгө болбой тургандыгын билдирет. Демек. ар кандай кыйын, татаал кырдаалдарга да адам аны сабырдуулук менен иликтеп, чындыкты туура баамдап, анан туура чечимге келсе гана өз абийиринин алдында таза бойдон калмакчы. Антпесе, абийирине балта чаап коюшка болот экен. Ал эми андай учурда абийир эч убакта кечирбейт деген жыйынтык драманын негизги сюжеттик өзөгүн, идеалык мазмунун түзгөн,"},{"t":"p","h":"«Абийир кечирбейт» драмасы Т. Абдумомуновдун гана чыгармачы- <span class=\"pg\" data-n=\"145\">145<\/span>="},{"t":"p","h":"лыгында эмес, жалпы эле кыргыз драматургиясында адам психологиясын тереңдеп ачып көрсөткөн жана ар кандай иш үчүн адам өзүн дайыма жоопкерчиликтүү сезип, өзүнүн абийир, ар-намысын эч убакта унутууга болбостугун ар бирибиздин эсибизге салган мыкты чыгарма катары жашай бермек."},{"t":"v","l":["[| абийир – совесть","карыя – старик","маек – беседа","кырдаалды – удобный момент","ачуусу келген – сердитый","кунеелуу – внновный","кечиримсиз – непростительный","кыйын – трудный"]},{"t":"h3","h":"Драманын башкы каармандары Нурдиндин образы. Нурдин зилинде жаман жигит эмес. Доктурлук"},{"t":"p","h":"кесипти мыкты билген, элдин ден соолугу үчүн пайдалуу көп иш колунан келе турган адам. Келечеги кең. Профессор Сулаймановдун шакирттеринин ичинен тыңы ушул Нурдин. Ак көңүл, боорукер, жолдоштукка бекем, өтө ишенчээк жана анча-мынча чапчаң, курч, адамдардын баарын өзүндөй таза деп ойлойт."},{"t":"p","h":"Масадыктын образы. Масадык эң жөндөмдүү, адамгерчилиги бийик, жолдоштукка сүттөй таза, чынчыл, ак ниет, ак пейил, жумшак, сабырлуу, токтоо жигит. Ал Нурдинге Нияздын таза эмес экендигин өз убагында ак ниети менен эскертет. Өзгөчө, Масадыктын Шайыргүлгө кылган мамилеси ак ниеттүүлүктүн мурда болуп көрбөгөндөй жаңы бийиктиги болуш керек. Адегенде ал Шайыргүлдү сүйөт, ага өзүнүн оюн билдирет, бирок Шайыргүл өзүнүн нака сүйгөнү Нурдин экендигин айткандан кийин, жакшы санаалаш жолдош катары сыйлашып, урматташып жүрүү мамилесине өтөт. Бул жерде автор турмушта өтө сейрек кездешүүчү бир чындыктын бар экенин, ал чындык менен да эсептешүү керек экендигин күн тартибине курч коюп отурат."},{"t":"p","h":"Шайыргүлдүн образы. Шайыргүл чыгарманын негизги каармандарынын бири катары анын башынан аягына чейин катышат. Анткени, Нурдиндин да, Масадыктын да айткан сөздөрүндө, чындыкты табуу үчүн жүргүзүлгөн күрөш аракеттеринде бүт бойдон Шайыргүл негизги фигура катары, жүргөндүгү көрүнөт. Ал эми, Шайыргүл драмада, чынында да, бардык жагынан татыктуу, сүйүүгө өтө туруктуу, бийик адамгерчиликтүү, сүйлөгөн сөздөрү орундуу, жароокер жана жылдызы жанып турган шайыр кыз. Ага баш кошкон кандай эркек болсо да бактылуу болбой койбойт. Шайыргүл ак көнүл, ниети таза, арамдыгы, куулук-кытмырлыгы жок кыз болгону үчүн, эл эмне деп ойлойт дебестен, Масадык менен мыкты жолдоштук мамилесин сактап жүргүсү келет. Бул, биринчиден, Масадыктын өзүн жакшы адам катары урматтоосу болсо, экинчиден Нурдиндин жакшы жолдошу болгондугу үчүн чын дилден аны сыйлоосу эле."},{"t":"p","h":"Нияздын, Сейиттин образы. Бул жарык дүйнөдө, адам баласы жашап турган тиричиликке жаманчылык, арамдык, көрө албастык, кара өзгөйлүк, эки жүздүүлүк. жан кечтилик бар экендигин, алардын ар бир ка-"},{"t":"p","h":"10-5% <span class=\"pg\" data-n=\"146\">146<\/span>дам сайын андып турарын биз «Абийир кечирбейт» драмасындагы Нияздын, Сейиттин образынан көрөбүз. Нияздын бар болгон максаты – Нурдинди өзүнүн алдына чыгарбоо, эмне кылса да аны аксатып, артка калтыруу, Кыскасы, Нурдин жетчү карьерага, Нурдин жетчү бийиктикке өзүм жетсем дейт. Мындай көрө албастыктын, арамдыктын оорусу менен ооруган адамдар турмушта көп эле кездешет. Нияз да ошолордун бири. Ал көз көрүнө эле Масадык менен Шайыргүлдүн жолдоштук мамилесин чыныгы сүйүү мамилеси катары көрсөтүп, Нурдинди бузуп, түз жолунан адаштырды, Бул үчүн ошол учурда бир кишини тепсеп өлтүрүп, соттолмокчу болгон Сейитти Нияз куткарып алды да, аны өзүнүн арам оюнун ишке ашышына башкы курал катары пайдаланды, Сейит Нияздын сөзүнүн «тууралыгын», портсигары эпчилдик менен ортого жүгүртүп, конкреттүү, предметтүү «далилдеп» берген каарман катары кызмат аткарды. Турмушта Сейит өңдүү жүзү каралар да көп эле кездешет. Өз башы кыйынчылыкка капталган кезде чынды калптай, калпты чындай айтып, убактылуу жеңилдик үчүн өзүнүн абийирин, ар-намысын сатып, колунан келип турган адамдардын ар кандай туура эмес айткандарын аткарып, киши өлтүрүп берүүгө чейин барган адамдардын бири дал ушул Сейит. Ырас, Сейит драманын аягында чындыкты айтып, далилдеп, Нияздын кара бет, эки;, здуулугун ашкерелеп бергенге батынды."},{"t":"v","l":["Щ","чапчан – ловкий","жөндөмдүү – рассулительный","ак пейил – невинная душа","татыктуу – достойный,","заслуживающий","туруктуу – непоколебимый, стойкий","шайыр – жизнералостный, весёлый","ниети таза – добрые намерения","арамдык – не чистый, не порядочный","өңдүү – имеющий хороший пил, имеющий","хороший цвет лица, здоропый","далилле – доказывать"]},{"t":"h3","h":"Достор"},{"t":"p","h":"(Биринчи көшөгө) Биринчи сүрөт Күүгүм!. Тоо баштарында булуттар көчүп, ызгаардуу? шамал жол ооюндагы жалгыз дарактын жыланач бутактарын сабалайт. Пальтосунун жакасын көтөрүп даракка сүйөнгөн Нурдин алыс бир жакты тиктеп, ойлуу."},{"t":"p","h":"Андан обочороокто карыя олтурат. Берген суроосуна жооп күткөндөй Нурдинди карап, куржунун чыканактайт. Нурдин карыяга назар салбайт?, папиросун үстөмөндөтө соруп, мурдагы калыбында тилсиз."},{"t":"p","h":"Карыя. Кечирип кой, уулум... Кайдагы болбогон суроону берип... конулунду кирдетип алдым окшойт... өмүрлүү-жаштуу болуп, тилсген тилегиңе жет, айланайын... Кечирип кой, чалдан кеткен каталык болсо... (Нурдин унчукпайт. Карыя сөзүн улайт.) Чекилик* кылганымды кийинче-"},{"t":"p","h":"' күүгүм – сумерки"},{"t":"v","l":["* ызгаардуу – морозный, студёный","} назар салбайт – не обращает внимание","* чекилик – неправильность"]},{"t":"p","h":"<span class=\"pg\" data-n=\"147\">147<\/span>рээк сездим.., Бир көргөн баланын дароо эле ичи-бооруна кирип кеткеним өөн! иш болду... адамга да жакпайт, кудайга да жакпайт! (Күрсүнүп). Илгери менин жаш кезимде карыялар кеп кылышар эле, кирпик ирмелеген сайын карылык кел, карылык кел, карылык? кел деп, курган карылыкты чакырып турат дешип... Алам карыганда мага окшоп алжый* баштайт тура!"},{"t":"p","h":"Нурдин. Күнөө көргөн бетер кайра-кайра кечирим сурайсыз... актанасыз... Эмнеге антесиз, жарыктыгым?.. Эмнеге?.. Билип турам, оң айтканымды тескери алды деп кейип жатасыз, Андай эмес, Суроону туура бердиңиз. Мен туура түшүндүм. (Ойлоно калып, мурдагысындай эле карыяга карабастан.) Сиз айткандай, жаш адам болушу керек... Жугумдуу болушу керек... А мен болсом мына бул жалгыз даракка окшоп тилсизмин, тунтмун*... кейиштуумун!.. Балким сиз ойлорсуз, бул бала жаралгандан эле ошондой го деп?.. Жок! (Карыяга биринчи жолу тике карап.) Эмнеге ошондоймун, билесизби?.. Мен камактан келатам!"},{"t":"v","l":["Карыя (ынабагандай). Камактан?..","Нурдин, Ооба, камактан,"]},{"t":"p","h":"Карыя. О, койчу, кайдагы жокту сүйлөбөй. Салабаттуу эле азамат көрүнөсүң. Кандай шайтан буйдалап кетип жүрөт?"},{"t":"p","h":"Нурдин (катуу күрсүнүп), Түгөнбөс жомок... Кайгылуу!.."},{"t":"p","h":"(Тамеки тартмакчы болуп, пачкасында эчтеме жок экенин көрөт да, ушалап туруп ыргытып жиберет.)"},{"t":"p","h":"Карыя. Уулум... атаңдын айтканын жаман алба... курсагың ач турбайбы... машина келгиче шам-шум этип алчы, айланайын..."},{"t":"p","h":"Нурдин. Ыракмат, жөн эле коюңуз. Курсагым ток."},{"t":"p","h":"Карыя. Ыракматынды даам ооз тийгенден кийин айткын. Шаарда неберелерим бар... Жаман күчүктөрүм ооз тийсин деп, бышырылган козунун этин алпараттым эле... Жайлоонун чөбүн оттогон козунун эти... өрүк болот, өрүк! (Куржунунун оозун чечмекчи болуп.) Түрмөдө андай этти бермек кайда!"},{"t":"p","h":"Нурдин. (Карыяны токтотуп, сүйкүм менен). Ыраазымын, ата. Убара болбоңуз*."},{"t":"p","h":"Карыя. Өзүмдү сыйлабасаң да сакалымды сыйла... кары киши таарынчак болот... Таарынбагын, уулум!"},{"t":"p","h":"Нурдин (күрсүнүп). Олда, жарыктыгым, ай-ай! Жаман кучуктерунузге арналган белекти биринчи болуп ошолор ооз тийиши керек. Илгертен келаткан салтыбыз ушундай... Жакшы салтты бузбаңыз, ата!"},{"t":"p","h":"Карыя, Жакшы адам үчүн жакшы салтты бузса боло берет, Нурдин. Жакшы адам!.. Менин жакшы адам экенимди кайдан билдиңиз?"},{"t":"p","h":"Карыя, Көзүңдөн байкап турам, (Ички чөнтөгүнөн кагазга оролгон бирдеңке* алып чыгып.) Эч болбогондо куруттан ооз тийчи..."},{"t":"v","l":["' өөн – разного рода мелкие (негодные} обрезки кошмы, кожи, материи","? карылык – старость","*алжый – ошибиться","– я замкнутый","$ убара болбоңуз – ие стоит утруждаться","* бирдеңке – что-то"]},{"t":"p","h":"<span class=\"pg\" data-n=\"148\">148<\/span>Нурдин. Ыракмат. Курут көрбөгөнүмө көп болду! (Курутту ырахаттана чайнап.) Моюнчалаш! өскөн курбуларым айтып калышар эле, сен асмандан боорсок жааган күнү төрөлгөнсүң, Нурдин, жакшы адамга калганда жолун бар дешип... Мага чынында элс ошондой көрүнчү... Кимди болбосун өзүмө жакын санап, анын адам деген атына кубанар элем... Сыймыктанар элем!.. Бул дүйнөдө менин жек көргөнүм, менин элдешпес душманым жалгыз гана оору... Адамдын жанын кейитип, жалгыз гана оору, – деп жүргөн элем... Ошол ооруга каршы жанымдын бардыгынча күрөшкөн элем..,"},{"t":"p","h":"Карыя, Доктурсунбу, уулум?"},{"t":"p","h":"Нурдин, Ооба. Көзгө көрүнбөгөн микроб менен күрөшүп жүрүп, микробдон да коркунучтуу адамдардын бар экенин байкабаптырмын!"},{"t":"p","h":"Карыя. Душманы жок да адам болчу беле!"},{"t":"p","h":"Нурдин. Жүрөгүмдүн толтосун кыйып, шыйбылчагымды? чаккан душманым болгон жок... көзүмдүн карегиндей көргөн эң жакын досум болду... (Кейиштүү күрсүнүп.) Досум!.."},{"t":"p","h":"Карыя. Ал үйүн куйгур’, үстүңдөн ушак айтып, жалаа жапкан“ го дейм, болгондо?.."},{"t":"p","h":"Нурдин. Жок, мени адилет соттошту... Мен аны машинам менен тепсетип кеттим!"},{"t":"v","l":["Карыя. Өлтүрүп койгон турбайсыңбы?!","Нурдин. Угушумда, тирүү калган имиш!"]},{"t":"p","h":"Карыя. Кыясы, жаман иш кылган көрүнөт аның. Жанына батса керек!.. Ошентсе да бетке айткандын заары жок’... Акылыңды ачууна бийлеткенин чеги болуптур, уулум!"},{"t":"p","h":"Нурдин. Таап айттыңыз. Ачууга бийлетип, жаман жорукка берилгенимди кийин түшүнүп, кийин өкүнүп калдым!.. (Кайрадан даракка барып сүйөнөт.) Нечен жыл бою менде бир гана суроо болду. Өзүңдүн бейтаалай болушуна, балким, сен өзүң айыптуудурсун, Нурдин, деп өзүмдү өзүм кысымга алып, жооп издеп жүрдүм! Азыр да мени кыйнаган ошол!"},{"t":"p","h":"Карыя (тынымдан кийин). Күйүттүү* иш болгон экен, уулум! Бирок күйүткө күйүт эм боло албайт. Өткөндү эстебе. Келечегиңди ойлон,"},{"t":"p","h":"Нурдин. Келечегимдиби?., Келечегимди... Бир кезде телегейим тегиз эле... Сүйгөнүм бар эле... Мени адам көрүп, мага урмат кылган курбу’- курдаштарым бар эле... Курбу-курдаштарым!.. Азыр алар кандай көз менен карап, кандайча тосуп аларын билсем, мынчалык күйбөс элем. Мен үчүн бардыгы тунгуюк!..*"},{"t":"p","h":"Карыя. Курбу-курдаштардын ишенимине кирип, урмат алыш өтө кыйын, андан ажырап калыш текейден арзан. (Узак тынымдан"},{"t":"v","l":["' моюнчалаш – близкие","+ шыйбылчагымды – одна из половин парного копыта","* күйгүр – здесь: неисправимая лгунья","* жалаа жапкан – клеветать","* заары жок – без вреда","* күйүттүү – горестиый, горююший, тоскующий","`курбу – подруга","* туңгуюк – бездна, пропасть"]},{"t":"p","h":"<span class=\"pg\" data-n=\"149\">149<\/span>Ач кенедей жабышып алдым... ошентсе да... айып көрбө, айланайын... еңке сурас амбы дедим эле... Менин сура йын дегеним... а..."},{"t":"v","l":["Нурдин. Досумду эмнеге майып кылганымды билсем дейсиз го?","ыя. Ооба."]},{"t":"p","h":"Бул туурасында эч кимге айта элек элем. Эч качан!.. Жалегенде, сотко да айткан эмесмин, Карыя. Атаганат, көрүнө зордогонсуп... тилиң менен кургурдун ых Нурдин. Өзүңүздү өзүңүз жекирип... Эмнеге антесиз, жарыктыгым 4 ‚ай- ай! Кыйла убакыт өттү... Сизге окшоп мени менен чечилип сүйлөшкөн эч ким болбоду!.. (Тынымдан кийин.) Айтып берейин... Тыңшап турунуз... Бул окуя май майрамынын алдыңкы күнү, отузунчу апрелде болгон эле... Ала-"},{"t":"p","h":"жоогазын гүлдөп... Ал эми досум экөөбүз турган бөлмөдө болсо..."},{"t":"p","h":"(Жакындап келаткан машинанын жарыгы коюу караңгылыкты кош найзадай жиреп өтөт.) Карыя, Машина келатат!"},{"t":"p","h":"Нурдин. Тез!.. Өтүп кетелегинде, кол көтөрөлү... Куржунду мага бериңиз..."},{"t":"p","h":"Карыя. Жок айланайын, жөн эле кой... Оор... а (куржунду алып). Мындан орду көтөрүп көргөм... Жүрүңүз!.. (Карыя менен Нурдин чыгат. Жарык өчүп, айлампа акырын тегеренет.) 1, Демек, эки бейтааныш адам кокустан кездешип калышты, алардын арасында кандай-"},{"t":"p","h":"1 дыр бир түшүнүк пайда болду. Эмнеге деп ойлойсуң? з 3 Кайдай деп ойлойсун, эмис үчүн карыя Нурдинди камактан чыкканын билип чоочуп Карыянын мүнөзүн каилай сүрөттөп бере аласың?"},{"t":"p","h":"ары басып кеткен жок?"},{"t":"v","l":["4 „ Эмне үчүн Нурдии бир көргөн карыяга оз тагдырын айткысы келди?","5. Нурдиндин образына сенин көз карашың?","6. Андан ары окуя кандай уланат деп ойлойсуң?"]},{"t":"h3","h":"Достор"},{"t":"p","h":"Нурдин менен Масадык туруучу бөлмө, Ачылуу терезеден шыңга теректүү шаар, алыстан ак карлуу тоолор көрүнөт. Терезенин ура жоо- газын салынган ваза, Жаз. Магнитофон, тумбочканын жанында Нурдин. Динамиктен угулган Шайыргүлдүн үнүн тыңшап, ойлуу."},{"t":"v","l":["‚.. Жайдын бир толук кезинде,","Адырлуу тоонун бетинде.","Сан гүлдөн тандап бирди үзгөн,","Жайдары селки эсимде..."]},{"t":"p","h":"Эшик акырын ачылып, Масадык көрүнөт. Шайыргүлдүн ырдаганын ап, бир нече секундага босогого туруп калат."},{"t":"p","h":"(Масадыкты көрүп кубанычтуу). Масадык!.. Коргошун боы п эрип кетип жүрбө... Эмнеге жалооруйсун. кир батыраак..."},{"t":"p","h":"күлүмсүрөй), Шайыргүл ырдаганда жандуунун <span class=\"pg\" data-n=\"150\">150<\/span>баары коргошун болуп эрийт. Же жалгыз эле мен дейсиңби? (Нурдинди карап, жарк этип күлүп), Байкашыма караганда тоюңдун камылгасы көңүлдөгүдөй... жалгыз гана... күйөөдөн башкасынын бардыгы даяр!., Ай, ушу сакалыңдын азабы өттү да... Дүйнөдөгү көсөөлөрдүн ырыскысын чогултуп туруп сага берген окшойт... Тишиң менен көзүңдүн карегинде гана кыл жок,.. Кантип аман калганыңа таңым бар!.. Бияк жаагыңды кыргыча тиягын бапсыя түшөт, биягынды кыргыча тиягын."},{"t":"p","h":"Нурдин. Сакалыма дайыма суктанчу болдуң... Ушундай ырыскыдан бир аз кемчил болгонуңа ичиң күйсө керек, ээ, Масадык?., Распы?"},{"t":"p","h":"Масадык. Ойноп сүйлөсөң да ойлоп сүйлө деген, Нурдин. Ээгимде туптуура беш кылым бар! Бол, батыраак кырын, кечигебиз..."},{"t":"p","h":"Нурдин. Каргаша болуп, электр устара бузулуп калыптыр... А муну менен болсо... Өмүрү алып көргөн эмесмин..."},{"t":"p","h":"Масадык. Ах, Нурдин! Куру айткан менен болобу... Ырысың тоодой... мендей досуң бар... Мен жок болсом кантип күн көрөт элең? (Нурдиндин сакалын самындап). Буга окшогон артык баш өсүмдүктү... кудай алсын, көз ачып жумгандын ортосунда жулуп таштайбыз! (Ичинен кыңылдап ырдап, артисттик кыймыл менен устараны тартат)."},{"t":"p","h":"Нурдин. (Чочугандай башын чулгуп), Ой!.. Эмне кылып жатасың? Масадык. Досумдун сакалын алып жатам. Өткөн замандагыдай кабагымды салып мурчуйбастан, бүгүнкү күндүн талабына ылайык жадырап-жайнап... көмөкөй тилди безеп... (мурдагыдай эле ырдап, Нурдиндин сакалын кырата),"},{"t":"p","h":"Нурдин, Же ырдагын, же сакалды алгын!"},{"t":"p","h":"Масадык. Эч качан антүүгө болбойт! Космос доорунда пайдалуу иштерди бири менен бирин айкалыштырып билүү керек!.."},{"t":"p","h":"Нурдин. Берчи устараны!"},{"t":"p","h":"Масадык. Абайлагың Нурдин! Устара – оюнчук эмес! (Нурдиндин ээгин колу менен сыйпап көрүп). Шайтан алгырдыкы, төрөлгөндө эле чачтарач болуп төрөлгөн окшойм, кайдан жүрүп врач болуп калганымды билбейм! Чымын консо, сөзсүз тайгаланып кетип бутун сындырат!.. Анан калса. адамдыкынан башкача сакалың бар экен... кактустун тикенегине окшоп... Сазайыңды Шайыргүл берсин, шашпа!.."},{"t":"p","h":"Нурдин. (Ээгин сыйпап көрүп). Сакал катуу... мүнөз жумшак... Жибекпиз да! (Приборду алып, күлгөн бойдон сыртка чыгат)."},{"t":"p","h":"Масадык магнитофонду жүргүзөт. Динамиктен Шайыргүлдүн үнү угулат."},{"t":"v","l":["...Кылайып тоодон таң аткан,","Суюлуп жылдыз бараткан,","Калды гой бекен эсиңде,","Кыйышпас көңүл карашкан...","Масадык. (Муңдуу)... Кыйышпас көңүл карашкан..."]},{"t":"p","h":"Нурдин. (Сырттан кирип тамашалай). Жалынсыз күйгөн жаш бозой деп ырдашканда, жалынсыз күйгөнү кандай болот деп таңданчу элем... Көрсө сендей болот тура... Күйүп-бышып ырдаганыңды укканым ушул... Өтө мунлуусун !.. Арманда калтырган бирөөнү эстей калсаң керек. Мүмкүн, ырастан эле мен айткандай болуп жүрбөсүн, я?"},{"t":"p","h":"<span class=\"pg\" data-n=\"151\">151<\/span>Масадык. (Кейиштүү күлүмсүрөй). Адамдар эмнелерди айтпады... Нурдин досуңдун колу Шайыргүлгө караганда жылдызга батыраак жетет деп шылдың кылгандар да болду... Мунун чындыгы бар. Шайыргүлдүн адамгерчилиги жылдыздан да бийик! (Нурдинди тике карап). Шалиргүлгө арзыш кыйын эле... Сен арзыдын!.. (Нурдинди кучактап). Төбөм көктө!.. Жамандыкта азапташ, жакшылыкта ырысташ курбуңмун, Нурдин. Тилегим ак. Душман күйүнгөндөй, дос сүйүнгөндөй ынтымак менен өмүр сурерунерге ишенем! (Чөнтөктөрүнөн, столдун ящигинен бирдеңке издей баштайт)."},{"t":"v","l":["Нурдин. Эмне издеп жатасын?","Масадык. Портсигар эле..."]},{"t":"p","h":"Нурдин. (/Тачкалуу сигаретти сунуп), Ошого убараланып... түтүндөн көп эмне бар..."},{"t":"p","h":"Масадык. (Чегип). Рахмат. (Кайрадан издей баштайт). Кайда коюп кой &gt;з дум?.. Жоготуп жибердимби?.. Бол, Нурдин, батыраак кийин... Кечигебиз... |"},{"t":"p","h":"Нурдин. Жаңы костюмумдун шымынын багалеги... ар бири эки аялга юбка чыкчудай... Акыркы модага ылайыктап тарытып оерейин деп Белек-аке алып кетти эле... Азыр келет..."},{"t":"p","h":"Масадык. Кээде ушинтип баладан да жаман иш кыласың! Аздан кийин тоюң болгон жатса... машинечи менен тегирменчи экөөнө да адам шы =з Белек-аке абийирдүү адам... Уятка калтырбайт. Анын үстүнө еби?! Нияз да келе элек..."},{"t":"p","h":"Масадык. Нияз, Нияз деп, эч качан оозуңан түшүроөисүң... Келсе келет, келбесе жок... Же ансыз той өтпөй калмак беле?"},{"t":"p","h":"Нурдин. (Капалуу), Менде ата да жок, эне да жок... Жатындаштан да айтпаптыр... (Жүрсүнүп). Менин тоюмда бардыгынын ордун кыным жалгыз гана Нияз. (Саатына карайт). Бая эле келиши керек эле... басуучу жашк ее Кейибе. Башка бирөөнүн эсебинен тойлогонду, Нияз жак- кечигип жатат!.. Түшүнбөйм! шы көрөт... Азыр эле жетип келет... к Качан болбосун ушул... Дайыма чымчыйсын... Бекерге + ошентесиң, Масадык... Адамдын жүрөгүн кандатып, жанын кейитуунун эмне кереги бар?.. Нияз курч... Өкүм жигит!.."},{"t":"p","h":"Масадык. Менимче, өтө эле курч... Өтө эле өкүм!"},{"t":"p","h":"Нурдин. (Тигинин какшыгын байкоос албастан). Мунуң туура. (Тамеки чегет). Менин балалык курбалым бүт бойдон Нияздын үйүндө Кундерлун биринде кыздар менен мелдеше кетип, Ала-Тоолук эр журе жигит деген момундай болот деп, бийик аскадан секирип, бутун сындырып алды... Ойносо чын көрөсүң, өпкө-бооруң үзүлүп кетсе эмне болот деп, эси чыккан кыздар чөкө таандай чурулдашканда... Нияз кебелген Эр, «Коркок болуп күн көргөнчө, баатыр болуп өлгөн артык'» деп, жылманып туруп жооп берди... Жакшы жигит!.."},{"t":"v","l":["Масадык. Мүмкүн.","Нурдин. Кумонун барбы?"]},{"t":"p","h":"Масадык. (Паузадан кийин). Кандай десем... Мурда мен дагы жакшы жигит дєп ойлочу элем... Бирок бир жолку окуядан кийин..."},{"t":"p","h":"<span class=\"pg\" data-n=\"152\">152<\/span>Нурдин. Эмнеге унчукпай калдын? дын?.. Айта бер..."},{"t":"p","h":"кын Масадык. Азыр эмес... урдин, Баштагандан кий ин б үтүргөнүң"},{"t":"p","h":"аы, Анын ийне-жибине чейин еа ч экеебуз эн жа- Кептер-Сай деген ган сон, арга дай) Кыстабасан! болот эле... (Паузадан кийин). Биздин а. ыста- К короз кептер ит лун биринде моюн жунун Ошондой уя-конул; нын боорундагы конулдарда бараттык эле. жа ШАЙ бар... Нияз экөөбүз ошону өрдөп 'н муңайым жана назик ме ы ип... жан кетип ынакай"},{"t":"p","h":"дудук тилинде сайрап жаткан Ж ашыктыгын айтып, н мезгил, мекиянына жалбарып, эркелетип аи те кептердин берге сайылды” ды ... Аттан ыргып тушуп” колума алдым... ка * колум бараткан башын зорго өр. ба сред ‚ Мүмкүн, мага ошондой көрүндүбү, айтор шашып"},{"t":"p","h":"чиритпейт!"},{"t":"p","h":"мы, т ж мындай сөздү угузбагын, Масадык!.. Макулбу? Нурдин, М курб чар уноейм, Нияз тууганыңа дайыма б. сеи ра."},{"t":"p","h":"ристе көзүң менен карайсың... Ушул кезге ошон- 1"},{"t":"v","l":["я кыстабасан – не настаивай","уялийт – гиездятся","жылтылдаган – с шая","“татынакай акай – симпатичная","кулак түрдүм – прислушался","» мылтык – пинтовка","| сайылды – вонзился","› ыргып түшүп спрыгнув","жанкы – тот самый"]},{"t":"p","h":"<span class=\"pg\" data-n=\"153\">153<\/span>дой... Эмнеге антесиң? Ишенип кой... Нияз жердешиң таптакыр! сен ойлогондой эмес!.."},{"t":"p","h":"Нурдин. (Күлүмсүрөй), Кыябы, Ниязга күнүлөйт окшойсуң, ээ, Масадык?"},{"t":"p","h":"Масадык. Уялсаң боло ошентип айткандан!.."},{"t":"p","h":"Нурдин. Кууланба, Масадык, көрүнүп турат... менин бир көзүмдөн экинчи көзүмдүн артыкчылыгы жок, экөө тең кымбат”. Силер да ошюндойсунар!.. (Масадыкты кучактап). Эх, Масадык! Муштумдай жүрөктө бир доско эмес, миң доско жетерлик сүйүү бар экенин билбейсиңби!.."},{"t":"p","h":"Масадык. (Күлүп). Болуптур, Нурдин, койдум... Бир гана айтарым: сүйүүнүн баркына жеткен да бар, жетпеген да бар... Кой, бул сөзүбүз ушул жерде эле калсын... Унуттук дейли..."},{"t":"h3","h":"Билип алгыла!"},{"t":"p","h":"1941-жылы Токтоболот Абдумомунов Кыргыз мамлекеттик басмасында адегенде корректор, редактор жана котормочу болуп иштей баштайт,"},{"t":"p","h":"1942-1955-жылдары ал Кыргыз радиокомитетинде редактор, Ош = областтык «Ленин жолу» гезитинде котормочу, СССР Жогорку Советинде котормочу жана «Советтик Кыргызстан» журналында бөлүм башчысы кызматтарын өтөгөн."},{"t":"p","h":"1945-жылдан баштап драма жазууга аракет кылат."},{"t":"p","h":"Т. Абдумомунов партиялык токтомдогу көрсөтмөгө көңүл бөлүп, замандаштардын турмушунан алып «Кумдуу чап» (1947), «Замандаштар» (1949), «Курман» (1950) пьесаларын жазат. «Кумдуу чап» пьесасында автор тоолуу райондорго нефть издеген геологдордун турмушун, «Замандаштар» пьесасында эки металлургиялык заводдун эмгектик мелдешин, ал эми «Курман» пьесасында айылдык врачтардын турмушун көрсөтмөк болгон."},{"t":"p","h":"«Жакшы адамдар» жыйнагы 1955-жылы жарык көргөн."},{"t":"p","h":"1950-жылы «Жүкөш» деген повестин жазган. Октябрь төңкөрүшүнүн кырк жылдыгына карата уюштурулган Бүткүл союздук конкурста Т. Абдумомунов «Алыскы тоолордо» деген киносценарийи сыйлыкка татыктуу болуп, ал сценарий боюнча тартылган кинокартина Бүткүл союздук, дүйнөлүк экрандарга көрсөтүлгөн."},{"t":"p","h":"СССР Жогорку Советинин 7-8-чакырылышынын депутаты болуп шайланган."},{"t":"p","h":"1970-жылы «Сүйүү жана үмүт», «Абийир кечирбейт» драмалары үчүн Кыргыз Республикасынын Токтогул атындагы Мамлекеттик сыйлыгынын лауреаты болгон."},{"t":"v","l":["– совсем","кымбат – дорого"]}],"sub":[{"title":"Драманын башкы каармандары Нурдиндин образы. Нурдин зилинде жаман жигит эмес. Доктурлук","b":6},{"title":"Достор","b":13},{"title":"Достор","b":58}],"section":"Женишбек","pages":[144,153]},{"title":"КОШУМЧА АДАБИЯТ БӨЛҮГ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"154\">154<\/span>КОШУМЧА АДАБИЯТ БӨЛҮГ"},{"t":"h3","h":"«Манас» эпосунун искусствонун башка турлерунлогу"},{"t":"p","h":"экинчи өмүрү Жер үстүндө кыргыз барда, адамзат жашап турганда «Манастын» ыры да, сыры да эч качан бүтпөйт."},{"t":"p","h":"Кыргыз Республикасынын Президентинин Указы менен 1995-жылы 25-31-августта «Манас» эпосунун миң жылдык мааракеси белгиленди. Бириккен Улуттар Уюму менен ЮНЕСКО 1995-жылды «Манас» жылы деп атады."},{"t":"p","h":"«Манас» эпосу бүгүнкү күндө искусствонун ар кандай тармактарында экинчи өмүрүн кечирип келүүдө. Мисалы: Ашым Жакыпбековдун «Теңири Манас» чыгармасы кара сөз түрүндө, Жалил Садыковдун «Айкөл Манас», «Манастын уулу Семетей», «Сейтек» пьесаларынын, «Айчүрөк» операсынын театр сахналарынан түшпөй коюлушу, М. Бегалиевдин «Манас» симфониясын жазышы, бул эпос боюнча даректүү фильмдердин тартылышы, эпоско арналган көптөгөн сүрөттөр, белгилүү манасчылардын сүрөттөрү тартылган."},{"t":"p","h":"Республикада жана чет жерлерде анын каармандарына, окуяларына байланыштуу 100дөн ашык искусство, архитектуралык, археологиялык тарыхый, табигый эстеликтер бар."},{"t":"p","h":"Бүгүнкү күндө «Манас ордо», «Манас айылы» бар, Эпостун 70 жакын варианты бар. «Манас» дүйнөдөгү өзү сыяктуу чыгармалардын ичинен көлөм жактан теңдеши жок эпос."},{"t":"v","l":["Эпостогу өзөк окуялар:","1. Манастын төрөлүшү жана балалык чагы,","2. Кыргыздардын Алтайдан Ала-Тоого кайтып келиши.","3. Алмамбеттин окуясы.","4. Көкөтөйдүн ашы,","5. Чоң казат.","6, Манастын өлүмү."]},{"t":"p","h":"«Манаста» достук, ынтымак идеясы жалаң түрк калктарынын тилектештиги менен чектелет экен деп ойлош жарабайт. Түрк боордоштугу «Манастын» тышкы дүйнө менен гармонияда, биримдикте болуу, тирлик өткөрүү жөнүндөгү глобалдык идеясынын бир гана бөлүгү. Эпосто Манасты хан көтөрүүгө дини, тили, бөлөк ар түрдүү улуттардын өкүлдөрү катышат, Дегеле, «Манаста» адам тегине, улутуна, расасына карап эч качан бааланбайт. Дүйнөлүк залкар чыгармалардын эч качан өлбөстүгү, улуулугу ушунда эмеспи. Улуу чыгармалардын таянган тоосу, туу кылып башына көтөргөнү, биринчи иретте, чындык, акыйкат, адилеттүүлүк, адамгерчилик, айкөл жүрөк, ак кызмат, адал мээнет."},{"t":"v","l":["№ мааракеси – праздник","кечирип келүүдө – здесь: проживает","даректүү – известный","теңдеши жок – нет равных","акыйкат – истина","адал мээнет – честный труд"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"155\">155<\/span>Алыкул Осмонов"},{"t":"h3","h":"Жети-Өгүз"},{"t":"v","l":["Карагайлуу кара асканын алдына,","Жети бөлөк жети тоонун жанында,","Ажыдаардай атырылып Жети-Өгүз.","Агып жатат жарды уратып каарына.","Таштар тарс-турс, калдыр-кулдур куланып,","Бууракандап көбүктөнүп бууланып,","Эр турмуштун агымындай шаркырап,","Ок жыландай оюн салып буралып. ы","Айбаты ачык, сүрү баатыр арстандай,","Ак жолборстой айга айкырат жазганбай,","Бүркүт, каблан күркүрөшүп барлыгы,","Ушул суунун балдары бейм акетай.","Ой, Жети-Өгүз, жүрөгүндө каа жок,","Кен өмүрдүн уюлуна мээлеп сок.","Адамзаттын жыргалы үчүн кам көрүп,","Ташы, күүлөн, улам күчө бизге окшоп.","","карагайлуу – изобилующий елью","акетай – вежливос обращение старшему брату","мээлеп – целясь"]},{"t":"h3","h":"Кыргыз тоолору"},{"t":"v","l":["Тоого тоолор курамалап, курашып,","Узун тартып, уламалап, улашып,","Алда кайдан кебез тартып келаткан,","Кербенчинин төөлөрүндөй чубашып,","Кара зоолор ар кай жерде каркайып,","Катмарлашып, калың тартып заңкайып.","Алмаз сындуу көккө тийген миздери,","Арстандын азуусундай арсайып.","Мөнгү кетпей чокулары жалтырап,","Тоңгон муздар шөкүлөдөй жаркырап,","Ар жагынан бер жагына куш эмес,","Аран гана бороон өтөт калтырап.","Жаз келерде эң биринчи жаз конуп,","Кыш болордо эң биринчи кыш тонуп.","Ай-ааламга ай тие элек кезинде,","Эң биринчи күндү тосуп кызарып,","Кыргыз тоосу, элдин сүйгөн тоолору,","Мындай сонун асыл тоолор болорду,","Асман тиреп жеңе билет ар качан,","Өлкөбүзгө кас санаган жоолорду."]},{"t":"p","h":"<span class=\"pg\" data-n=\"156\">156<\/span>Р кербенчи – торговец, ведущий караванную или крупную разъездную торговлю"},{"t":"p","h":"занкай – валыматься, возвышаться, быть очень высоким"},{"t":"v","l":["мөңгү – горный лелник, вечный сне!","ай-ааламга – вокруг","жене – жена брата"]},{"t":"h3","h":"Чынгыз Айтматов"},{"t":"p","h":"(«Жамийла» повестинен узунду) Данияр менен Жамийла Ушул куз эки жыл узгултуктен кийин, мен кайра мектепке бара баштадым, Сабактан кийин бош убакытта көп учурда баягы суу боюндагы жар үстүнө барып жүрдүм. Кырман ал кезде анкылдап, ээн калган, Бул жерде мен мектептен алган боёктор менен өзүмдүн биринчи этюддарымды, сүрөтчөлөрүмдү тарттым, Андагы сүрөтчөлөр анча деле жакшы болбосо керек, анткени, ошондо эле мага көп жакчу эмес. «Боёкторум начар көрүнөт, – деп ойлочумун ичимден. – Атаңдын көрү, чыныгы боёк тапсам. кандай сонун болор эле!». Ушундай дегеним менен, ошол чыныгы боёктор кандай болорун өзүм да билчү эмесмин. Тээ кийинчерээк гана сүрөтчүлөр колдонгон тюбиктеги сыкма боёкторду биринчи жолу көрүүгө туура келди."},{"t":"p","h":"Боёктор го боёк болсун, бирок мугалимдердин айткандары да туура болуп жатты окшойт: сүрөтчү болуш үчүн сүрөтчүнүн өнөрүн атайлап үйрөнүш керек, анын окуусун окуш керек, Бул акыл чеки болбогону менен, окуу жөнүндө менин үмүтүм да жок эле."},{"t":"p","h":"Окуу кайда: агаларым ошол бойдон дареги жок жатса, анан эки үйдүн жалгыз бел байлар жигитин энеси окууга жиберчү беле. Муну билип, мен унчукчу да эмесмин. Бирок ан сайын окууну эстеп ичим күйчү, анын үстүнө ошол жылкы күз өзгөчө көрктүү болду. Колдон өнөр келсе, көргөнүңдүн баарын тартсан эле, өзүнчө сүрөт боло тургандай. Аттигиң, ошондогу күз ай!"},{"t":"p","h":"Жайы менен жайлоодо түтүнгө ышталган жылкычылардын үйлөрү азыр чоң сайдын буурул тарткан чабындысында тигинде-мында караиып, ак элечек, ак көйнөк кийгендей түтүндөр чамгарактап этек-жеңин чубалжытып, той тойлогон аялдардай айылма-айыл көйкөлүшөт. Тегеректе жылкы жайылып, бет-бетинче басып кеткен үйүрүн чогулта албай тынчы кеткен айгырлар элтеңдешип азанашат, – жазга чейин эми ушунусу ушул: бээлер оңой менен үйүргө токтобойт. Тоодон түшкөн мал сары сойгок жапырып, аңыз-аңызда жүрөт. Күзгү талаанын бети изден чыбыр-ала."},{"t":"p","h":"Күз ушинтип эле жакшылыгын алып туруп алган жок. Көп кечикпей кара жел жүрдү, асмандын иреңи бузулуп, кар аралаш жаан башталды. Аптасына көз ачырбаган жаан, бир күнү басаңдап токтогондон, мен Күркүрөөнүн жээгине бардым, – нары таштак аралчада жылгын менен чычырканактын арасындагы бир түп тоо четин жалбырттап күйгөн оттой болуп, сүрөткө эле «суранып» туруп алды,"},{"t":"p","h":"Жээкте бадалдын арасында сүрөт тартып отурат элем, кеч кирейин деп калган, бир убакытта башымды өйдө көтөрүп, наркы өйүзгө суу кечип өткөн эки кишини кокус көрө калдым. Алар Данияр менен Жамийла экенин <span class=\"pg\" data-n=\"157\">157<\/span>дароо тааныдым, Эмне үчүндүр алардын жүздөрү чочулап сактангандай сүрдүү эле. Данияр адатынча демите арыштап, аттаган сайын, анын топчуланбаган шинелинин этектери, эскилиги жеткен солдат өтүгүнүн кончторуна шартылдата урунуп келе жатыптыр, Жамийла болсо, аппак жуулган жүн жоолугун салынып, үстүнө базарга кийчү кызыл-ала гүлдүү көйнөгү менен чий баркут чапанын кийип алыптыр. Бир колунда көтөргөн түйүнчөгү бар, экинчи колу менен Даниярдын асма баштыгын карманып келе жатыптыр, Экөө кез-кез бир нерсени сүйлөшүп коюшат."},{"t":"p","h":"Булар биздин айылды таштап, бир жакка кетип бара жаткандарын түшүнгөндө, ичим тыз этип куйкалана түштү."},{"t":"p","h":"Тигине, ал экөө коктудан өтүп, чий аралап жөнөштү, а мен шалдайган бойдон алардын артынан карап, эмне кыларымды билбей калдым. Үндөйүн десем, тилим таңдайыма жармашып калгандай."},{"t":"p","h":"Тоо кыркалап ээрчишкен булуттарга күндүн кыйыр нурлары акыркы жолу бир тийип, жерге күүгүм түштү, айлана бат эле караңгылай баштады."},{"t":"p","h":"Данияр менен Жамийла артына карабай темир жолдун разъезддин көздөй ылдам басууда. Алардын караандары улам алыстап отуруп, бир аздан кийин чийдин арасынан көрүнбөй калды."},{"t":"v","l":["Мен мына ошондо гана эсиме келдим,","– Жамийла-а-а-а! – деп, күчүмдүн бардыгынча кыйкырдым."]},{"t":"p","h":"Томсоргон талаанын үстүнөн: «-а-а-а!» – деген жалгыз жаңырык көпкө созолонуп, мунканып басылды."},{"t":"p","h":"– Жамийла-а-а! – дедим мен, дагы бир ачуу кыйкырып, анан турган ордумдан атырылып тигилердин артынан жүгүрдүм. Сууну суу дебей, өтүкчөн, кийимчен бойдон түз эле сууга салганымда, тызылдаткан муздак чачырандылар бетиме, бүткөн боюма жабыла берди. Ага да карабай. дагы күчөп чуркадым. Бир убакытта бутум бир нерсеге чалынып кетти эле, күү менен барып бет алдымдан жерге жыгылдым. Ошол бойдон, башымды өйдө көтөрбөй, бетимди мыкчып, өксүп-өксүп ыйлап жибердим. Астымдагы нымдуу топурак жыттанган жер, колумду, бетимди муздатып, кеч караңгысы жонума салмагын салгандай, өпкөм кысылып, чийлер менин кайгымды бөлүшүп, жан-жанымдан муңканып ышкырып жатышты. Жана Жамийланы кыйкырган үнүм дагы эле томсоргон талаанын үстүнөн жаңыргансып, кулагымдан кетпейт."},{"t":"p","h":"– Жамийла, Жамийла! – деп, жаш балача шолоктоп, мен өзүмдүн эң жакын көргөн кымбаттуу кишилерим менен коштошуп жаттым. Мына ушунда гана, жерде ыйлап жаткан учурумда, мен өзүм дагы Жамийланы сүйгөнүмдү түшүндүм."},{"t":"p","h":"Ооба, балким бул балалык кездеги менин эң таза, наристе сүйүүм болгон чыгар!"},{"t":"p","h":"«Кайдасынар силер азыр, кайсы жолдор менен кетип бара жатасынар?». Биздин жерде мындай кең талаа, мындай жолдор көп: Казакстандан тартып, Алтай менен Сибирге чейин ачык мейкиндик! Бул ачык мейкиндикти, ушул мейкиндиктей зор эмгекти сүйгөн азаматтар жаңы жерлерде, жаңы турмуш куруу үчүн аттанышты! Балким, силер дагы ошол жакка кеткен чыгарсынар! Анда сапарынар ачык болсун!.. Жамийла, менин алтын Жамийлам, сен кеткенде, башыңды бийик көтөрүп, кылчайбай, тайманбай кең <span class=\"pg\" data-n=\"158\">158<\/span>талаа менен кеткенсин... Азыр да ошондойсуңбу, азыр да жол баскандан талыбайсыңбы? Же чарчаган күндөрүң болобу, жаным Жамийла? Җе өз күчүңө ишенбей, күмөн санаган күндөрүң болобу, гүлүм Жамийла, Эгерде андай болсо алсыздыкка берилбе, Даниярды медер кылып, жөлөн! Ошондо Данияр баягыдай сүйүү, жер, жарык дүйнө, турмуш жөнүндөгү деңиздей төгүлгөн жалындуу обонун салып берсин! Ошондо көз алдыңда кең талаа гүлдөп, биздин август түнүндөгү чагылгандуу добул төгүп берсин! Коркпо Жамийла, алыс жолдон, сенин жолуң таалай жолу, андан күмөн санаба! |"},{"t":"p","h":"Жол менен Оаскандарды карап, мен алар менен сырдашам. Тигине, Данияр обон салып шаңшыды, демек, ал Жамийла экөө мени жолго чакырышат. Ооба, мен жолго чыгышым керек! Ооба, жайкалган кең талаанын жолун басып мен өзүмдүн айлыма барам! Туулган-өскөн жер – күч кубатым! Мен андан жаңы түркүн боёк табам. Сүрөт тарткан боёктун ар бир сүрткөн сызыгынан Даниярдын обону угулсун! С үрөт тарткан боёктун ар оир сүрткөн сызыгында Жамийланын жүрөк оту болсун!"},{"t":"v","l":["М","көрктүү – красивый, изящный","ышталган – копченый","чубалжыт – растягиваться, протягиваться на лалёкое расстояние","айгыр – жеребец","иреңи – окраска","таштак – каменистое место","томсоргон – омраченный","атырыл – вскочить, ринуться","жүгүрдүм – побежал","нымдуу – сырой, влажный","томсор – молча нахмуриться, насупиться. мрачно смотреть","жаныра – греметь, грохотать","шолокто – всхлипывать","наристе – невинный, безгрешный","мейкиндик – пространство","кылчайбай – не оглянувшись, бел оглядки","жалындуу – пламенный","добул – град (сильный), буря","күмөн – сомнение, подозрение","шаишы – перен. издавать мелодичные звуки"]},{"t":"p","h":"<span class=\"pg\" data-n=\"159\">159<\/span>Шукурбек Бейшеналиев"},{"t":"p","h":"Ш, Бейшеналиев прозаик, драматург, котормочу, Кыргыз эл жазуучусу (1988)."},{"t":"img","src":"data:image/webp;base64,UklGRmoZAABXRUJQVlA4IF4ZAADwFwGdASqaARgCPrVSnUouMS+rrjj7IiAWiWlt/JeGUp3Rc76THQ3CgV88PvsLro9ADjN2iyj//z+VcfMJ6atLzmy/DP/f6F/in/D//f+/6B/if+L/8/7PRa7+8MOYP/99c/xD/v1/UUojyw5IlgZq9AFqBV4ZJrolEK3MDGZWkBROtvPPCD8qpy+OQcqZmjvBI2aBHXLqAfJRRDRKiTk43Uojii5j2xMmApgSiAhGy+NKWxPToOM0E++3rV338E1jazNeVRe5XLdDJGIiipASQVkROnzUZhIscYhepRGY309N61uRpjy2DHyh6hkXUfjTkMxCiVpuMa4mkYOTn5Pz/EZiz5AvGzh2BuKi4h8TzOb0BKQj3+IK5XI99Ndo/hSGexVTXyZCAkGR/F5XT/ogsaRjmzOI1hmsnvzQWpuMZfRdGXTH66CGEbJcUp/XsWMivys8Y10TDUft9hWRKWSqmUYZXERKI5GM+c0xS5WFFFGtSRBhzSA7YauGOsJFbZMwQoN63w4wkO9bVwRUinMH0P0LrZjOBXEt0SUmDubbYrlLsWo DACmPeWPGH3ioxt4VMtLqPtYYtx98twxuyCmWRHdgBvTxADpk5W1EGofT3Om4mGEzqOQFNNQCgDtbTmmbmze6PUZOgv/G4AAAAA==","w":410,"ht":536},{"t":"p","h":"Ал Ак-Талаа районунда туулган, КМУнун филология факультетин бүткөн, Кыргыз балдар адабиятынын профессионал бийиктикке көтөрүлүшү Бейшеналиевдин ысымы менен байланыштуу. «Чыныгы достук», «Кычан», «Мүйүздүү козу», «Ак тайлак», «Аманат» ж. б. чыгармаларында жаш балдардын ары татаал, ары кооз ички дүйнөсү иликтенет. «Мүйүздүү козу» аңгемеси үчүн Токтогул атындагы Мамлекеттик сыйлык ыйгарылган."},{"t":"p","h":"Чыгармалары: «Таалай жолу», «Болот калем», «Даңкка жараша жүк» романдары, «Тайлак баатыр» даректүү баяны орус жана дүйнөлүк классикаларды кыргыз тилине которгон,"},{"t":"v","l":["тайлак – верблюжонок","мүйүздүү – рогатый","ыйгар – намечать, предназначать"]},{"t":"h3","h":"Болот калем"},{"t":"p","h":"(Романдан үзүндү) Улуу Манасчынын урматы Ажы абасы менен Апай апасынын улам кийинки сүйөмөлөрү, мына, эмки кастарлуу мыктылардын тобуна, атагы таш жарган Тыныбектен айкөл! Манастын жомогун угууга куштап-үптөп апкелгендери Байымбеттин төбөсүн көккө жеткиргендей маашырлантты дейсин! Ким билет, бүгүн андан ашкан таалайлуу жан бу чөлкөмдө бар бекен?..."},{"t":"p","h":"... Сооронбайдын короосунун алдында унаачаны, жөөсү дебей котологон калк”. Алар куштап чакырылгандарга кызмат кылып, кыябын таап Манастан угушса, ыраазы}."},{"t":"p","h":"Ажы абасы, Апай апасынын катарында лепилдете бастырган Байымбетти да малакайчан эки жигит жүткүнө чуркап, колмо кол көтөрүп түшүштү. Тобо, өзү бирөөнүн ирегесинде жүрүп, ээлерин коштоп келгени үчүн эле ушунчалык урматка бөлөнөбү, Сыртта жигиттер чет четинен дүргүтүп короого киргизе башташты. Айылчы улуулай ар топко басып барып учурашып, көпкө кармалды. Байымбеттин чый-пыйы чыгууда, Деги орун жетпей тышка сүрүлүп калышпагай эле."},{"t":"v","l":["' айкөл – всликодушный, благородный","1 калк – народ, население","5 ыраазы – удовлетворённый, довольный"]},{"t":"p","h":"<span class=\"pg\" data-n=\"160\">160<\/span>Байлар ток букалардай ынтыга четке кетенчиктегенде:"},{"t":"p","h":"– Ажы ага, мархамат, Рахим этиңиз, – Күзөтчү Айылчыны, анан, соңундагы байбичени ийилиңки узатып, акырында, ичинен кыпылдап Байымбет өтөрдө: – Ой, кайсы мырзасың? – деп күлдүрттөй шыбыштап, көзүн кысты. Байымбет апкаарып, унчукпай нарылады. «Ата-көрү, минтип мырза болуш да оңойбу? Жо-оок мырзалык мага жарашпайт»."},{"t":"p","h":"Аш, тойдо да эл мынчалык дандуулата эленип, катуу тезге салынбас. Кыязы, Манасчынын бедели бийик өңдөнөт. Болбосо, калайык! мынчалык неге топурасын, Деги, көбү – жарды, кембагалдар. Аларды эшик күзөтчүлөр жибербей коюшса, «жээликкен таз, демиңди бас» болушабы? Байымбеттин аларга боору ачып, ирети менен иргегендердин аягында киргизишээр деген үмүткө сооронду."},{"t":"p","h":"Түпкөрүдөгү заңгыраган жайдын ортосунда тирүү Манастын өзү сымалданган алибеттүү?, кара сурунан калжайып, төшүн жапкан узун калтар сакал Тыныбекти Байымбет дароо тааныды... Дардайган бөлмөнү түптөй кыдырата кенен-кесири отургандардын баарына Тыныбек даана бадыраюуда, Байымбетке андан артыктын кереги не, Эшик агадан «ичке кирүүчүлөр бүттү» деген кабар жеткенде чепкен? жамынган ата манап Сооронбай Тыныбекке көз кабын балбырата, үлүңдөдү."},{"t":"v","l":["– Баштагын,","Аңгыча сырттан бака-шака, кыйкырык“ жаңырды,","Кары кишинин ачуулуу? айкырыгы үйдөгүлөргө угулду:"]},{"t":"p","h":"– О, мыктылар, Манас элдики! Киргизгиле букараларынарлы короого! Жүткүнгөндөр жапырт коштой күүлдөштү:"},{"t":"v","l":["– Чатак чыгат! «Манастан» калганча өлгөнүбүз өйдө!","– Киргизгиле! Киргизгиле!"]},{"t":"p","h":"– Эл-журт езунуздуку баатыр. Манас журттуку. Манас арбагына сыиынганы чогулгандарды киргиздиргениниз жен."},{"t":"p","h":"Сооронбай туталанып, дарбаза ачылганда аягы тынчыганда тутамдаган колун эми араң тайгылтып, сакалын селк эттире серпти:"},{"t":"p","h":"– Манасчым, башта эми."},{"t":"p","h":"Тыныбек жайдаңдап оң-сол мүрүсүнө алмак-салмак бурула, калтар сакалын жаный бөлмөлөрдө, сырткы короодо үймөлөктөгөндөргө саламдашкансып"},{"t":"p","h":"– Жөн кишиден манасчы чыкпайт. бар, карабайсынарбы келишкен келбетин..."},{"t":"p","h":"– Баатыр, түндөгү токтоткон жерден улайбызбы же бөлөкчө курайбызбы? – Манасчы Сооронбайга сөз куюлуштура суроолуу күлдүрттөдү."},{"t":"p","h":"– А-а баракелде... Кеп ушунда, манасчым. Биздин «Манасты» ' калайык – 1. народ, 2, обращение к народу, к собранию? алибеттүү – мощный, энергичный * чепкен – род верхней мужской стёганой одежды, крытой какой-либо толстой тканью * кыйкырык – крик"},{"t":"v","l":["* ачуулуу – злой, сердитый, вспыльчивый","* кубуре – шептать, вполголоса","7 сыйкыр – чары, колловство"]},{"t":"p","h":"<span class=\"pg\" data-n=\"161\">161<\/span>өзүбүзгө гана айтасын, Кечээ тээ Алтайда Жакып чал көрүнгөнгө таланып куучуюп куруган чагында кан чеңгелдеген уулу туулуп, атын Манас койгонун, аябай тойду сойгонун... Анын тентек! чыгып, атасынын жоосун жолотпой кууганына токтогонсун. Эр жетип, мына биздин Ала-Тоого ооп, чачыраган кыргыздын башын курап, жоодон коргоп өлгөнүнө чейин, Андан Семетей, андан Сейтек тукуму? жолун жолдогонун, о-уу качан бүтөр экенсиң? Ансыз менден кетпесинди билесин."},{"t":"p","h":"Тыныбек жооп кайтарды:"},{"t":"p","h":"– Баатыр, ал бир кудаага маалым... Мүмкүн, андан да созулуп кетээр..."},{"t":"p","h":"= Болуптур. Биздин «Манасты» шашпай, ай болсо айлап, жыл болсо жылдап жетээр жерине жеткиресиң. – Сооронбай ачык терезени карай эргип моюнун көтөрдү:"},{"t":"p","h":"– О-у. жарданган журт, мынча дүрбөп чогулган сон. силер учун Тыныбекке бир түндүк Манас айтууга уруксат. Ошого ыраазысыңарбы, же-жсе..."},{"t":"p","h":"– Байым, ыраазыбыз."},{"t":"p","h":"– Оп баракелде. Эртенден ээнбаштанып' менин эшигиме топтолгонду койгула. Эми тынчтанып, талбай угуп, тан* сүргөндө тарагыла."},{"t":"p","h":"Тыныбек салкын жел соккон ачык кош терезе тарапка сызып жөнөөчүдөй кулачын” жая бир түндүк учушка Манастын, Каныкейдин, чоролорунун, тулпарларынын, курал-жарагынын, кийим жасалгасынын, кыргыздын жоолору менен досторунун сыпатын гана чолууга, ошого да улуу дастанга суусаган элди кандырарын болжолдоп, короодогу моюн созгондорго даана угулар ырдап доошун калкытты:"},{"t":"v","l":["– Э-эй, журтум.","Арыстан Манас атанар,","Арбагын сыйлап жашанар,","Сымбатын сырдап айтайын.","Жазылсын ичтен капаңар.","Алмамбет, Чубак чоролор,","Манаска тирек зоболор.","Кыргызды кырам дегендер,","Кыйрап өзү жоголор..."]},{"t":"p","h":"Манасты бир отурушта жалпылай маалымдап калайыкка жеткизиш үчүн, атайлап бул кириш сөзүн каргытты,"},{"t":"v","l":["– Баракелде, касиетиңден!","– Үнүңдөн шаншыган!"]},{"t":"p","h":"Мындай кубаттоолорго такай шерденип, дасыккан манасчы, ошо сырттагыларга тегиз° жеткенине ичинен кубаттана Манастын келбетин эргип сүрөттөдү."},{"t":"v","l":["тентек – озорной, шалун, оторник","?тукум – потомство, поколение","* ээнбаштан – своевольничать, самоуправствовать","* таң – рассвет, утренняя заря","* кулач – размах рук","* тегиз – ровный","","Ш Ыы","<span class=\"pg\" data-n=\"162\">162<\/span>О журтум, Манас,","Пендеден артык туулган...","Душманга салган чуулган...","Асман менен жериңдин,","Тирөөсүнөн бүткөндөй.","Айың менен күнүңдүн,","Бүлөөсүнөн бүткөндөй,","Алтын менен күмүштүн,","Ширөөсүнөн бүткөндөй.","Алды калың кара жер,","Жердигинен түткөндөй..."]},{"t":"raw","h":"<h4 class=\"mk\">А утун<\/h4>"},{"t":"v","l":["жайык мурусу тоо башатындай занкайып","н кашкайта куюлушкан ыр с","женегенде илеби ысык турку н салыштырмалары тоонун тун"]},{"t":"p","h":"масынын чачырандысындай бурку үркүлсө, сакалы түпөктүү! токойдой у; гуп кээде жапырыла, кээде селк ла, лкилдеп” уккандардын көз ун сыйкырлай, Ш"},{"t":"p","h":"а Журтунан бери эл коргоп ыйык даңазаланган? баатыр Манастын кереметтүү сымбаты* ар кими ый я не тируулей элестелип, журектерун чымыра- ‚лей"},{"t":"p","h":"Баатыр Манас ханынар,"},{"t":"v","l":["Байкап кулак салынар.","Кандай турдуу иш кылган,","Кабарын угуп алынар.","Барчын Манас башында,","Баатырлык кылган жашында,","Кыраандык* кылган баатырдын,","Кырк жайсаны* кашында."]},{"t":"p","h":"ЫР Кз: ыы эл болгону, алмустактан бери улам улуу дастанды энсеп. эр-"},{"t":"p","h":"дардын көбүнө Тыныбектей касиеттүү чыгаан” енерпоз* адам гана эмес, бүткүл? Ала-Тоо ту. 5 лкусу кунгурене аны коштоп, асмг келип жомоктоп жаткандай туюлууда, Сырбараны, Кумайыгы, Желмаян Ак нн о уту. Ак олпогу баатырга бап ке лишип, анын көркүн урун гана аргтырбастан, ишин онуна салган таалайына Ри сыны\", сыры бар. доочулары. Ар биринин Манаска г ана белги; белгилуу, Манаска гана ачылуучу 4"},{"t":"p","h":"; тупоктуу – снабжённый бунчуком"},{"t":"v","l":["селкилде – качаться, колебаться, трястись","даназалан – быть прославляемым","* сымбат – статность","* кырааилык – богатырство, мужество","* жайсаңы = калмыцкий начальник, зайсан","ь чыгаан – выдающийся, замечательный","к өнөрпоз – мастер, искусник","бүткүл – весь, исликом","\"сыны – 1. испытание 2, критика"]},{"t":"p","h":"<span class=\"pg\" data-n=\"163\">163<\/span>Байымбет эркине ээ болбой, күүгө эриген бийчилей манасчынын кубулган ажарын туурап, обон ыргагын, олчойгон сүрөттүү сөздөрүн көкүрөгүнө көрөңгөдөй куюп, купуя кошо күпүлдөп, Манас менен Тыныбекти ээрчип чогуу жүргөндөй чайкалууда. Манастын даңазасын ашырып, акыл кошуп, жоосун жоолап, элине каралашкан Алмамбет, Чубак, Кошой, Бакай, Сыргак шериктери, Каныкейдей айымы тууралуу бөлөк-бөлөк аземдүү каргытканда жомокчуң түшкүр алардын кубанчын да куштай калкып, кайгысында буркулдап жаш төгүп, кайра бел байлаганда томсоро сурданып, Тыныбек көз боочудай тыңдаган калайыкты миң алакетке буроодо."},{"t":"p","h":"Азап, күрөш менен талоончу!, кыркынчы жоодон калкалап, жакын элдер менен куда-сөөк достоштуруп, кыргыздын учун кеңитип, уругун улаган жоокерчилик заманындагы айкөл Манас баштаган кеменгер? эрлердин көбүнүн өмүрү салгылашкан кан майданда кыйылганын... Алардын элин коргогон, касынан өчүн алып, тукумдары: Семетей, Күлчоро, Сейтектердин далай кордук, сыноолордон кагылып, жетилгенин миң кубула сайраган Тыныбектин дастанынан, айрыкча*, букара журт бир түн болсо да угуп, куу түйшүктү унуткарып... кумардан чыгышты белем."},{"t":"p","h":"Тыныбек, о, асмандан көшүлгөн жарык себилгенде тынып тыңдаган калкка ыргагын буруп, балкылдаган алкымын кере күрсүндү:"},{"t":"v","l":["О-у журтум! Тан сүрүлдү* кылайып,","Талыдыңар сырайып.","Тоодо, түздө ишин бар,","О, журтум, тараганың ылайык!","Атанар Манас жомогу,","Ай бою бүтпөйт кылайып.","Ар кимиңде оокат бар,","Аста-секин жылалык."]},{"t":"p","h":"Айтуучу жардабаганда угуучулар уюган бойдон отура беришмек. Баракелде, өнөрдүн сыйкырына! Бир адам ушунча калайыктын көзүн боёп, көңүлүн байлап, каткаксыган жан-дилин жибите сугарды белем, Улууну сыйлап, кичүүнү жумшап, баатырларын жасалгалап, жарды-жалчыга каралашып, акылмандын насаатын угуп, уз, усталарын бапестеп, ырчы, чоорчу, добулбасчыларын көч, кол астына чыгара урматтап жашаган байыркы бабаларынын тирлигине келкушту. Үйдөгү мыктылар каада сактап ыңгырана каалгыганча, тыштагы жардылар жапырт? козголо күүлдөй Тыныбекти алкашты:"},{"t":"v","l":["– О-омийин! Манастын арбагы колдосун!","– Тыныбек акын, кор болбо!","– Уулуң уласын өнөрүңдү!","– Теңир жалгасын!","– Кызыр жылоолосун!"]},{"t":"p","h":"Тыныбек боюн созуп, терезеден көпчүлүккө телмирип, терге жуулган жаагын сүртүндү."},{"t":"v","l":["' талоончу – грабитель","? кеменгер – мудрый, умудрённый опытом","5 айрыкча – в особенности","* таи сүрүлдү – забрехжил рассвет","* жапырт – скопом, сплошь"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"164\">164<\/span>Касымалы Жантөшев"},{"t":"v","l":["Каныбек","(Романдан үзүндү)","Амалдуу малай"]},{"t":"p","h":"Ошентип, шордуу Ажар Каныбегинен ажыраган. Шум замандын шумдугу: карчылык менен карыганда эки көзүнөн ажырашы, Каныбектин душмандар колуна туткун болушу Ажар үчүн кыйын болду, Кыйын болсо да жакшылыктан үмүтүн үзбөй, Жолойдун жардамы менен беш ара кончулук жердеги Алымын издеп, Катуу-Бакыттан Какшаалга келген."},{"t":"p","h":"Ажардын алдына өбөк, аркасына жөлөк табылды. Бир тай союп, Алым Ажарды мындан үч күнү илгери териге алган, Ошондон бери Ажар бир канча дарты чыккандай сезет. Бирок, Каныбегин ойлогондо жүрөгү туз куйгандай ачышып, «а» десе оозунан күйүттүн жалыны чыккансыйт."},{"t":"p","h":"Кечки күздүн сыдырым түнү. Карыптын карала итинин анда-санда үргөнү болбосо, бардык нерсе табияттын таң атар алдындагы тынчтык кучагында."},{"t":"p","h":"– Садагаң Күлүкан! Күн чыгып калган го дейм? – деп, Ажар төшөктөн башын көтөрдү."},{"t":"p","h":"– Жок, Ажаке! Таң жаны гана сүрөйүн дептир, – леп. Күлүкан керегенин аягынан чыгышты карады да. кийинип сыртка чыгып түндүктү тартты. Үйдүн чыгыш жаккы жанында үйүлүү турган тезектен алып келип от жакты. Алда кимине ардактаган сыйнатын көрсөтчүдөй камына баштады. Кимгедир. эмнени эскертип айтчудай көшөгөнү ачып карады."},{"t":"p","h":"Али үйлөнө элек болсо да, көшөгө ичинде Алым уктап жатат."},{"t":"p","h":"– Кызык уктап жатат, садагаң! – деп, акырын гана анын алкымынан жыттап койду. Алым ойгонуп кетти. Алдейлеп өстүргөн алтын энесин капыстан көргөн балтыр бешик баладай жылмайып, кандайдыр бир сүйгүнчүлүк менен Алым маңдайында күлүмсүрөп турган Күлүканды мойнунан кучактады..."},{"t":"p","h":"= Тур, мээнетиңди алайын! Атыңа жем бер... Сапарына эрте жене!.. Күн чыгарда Күлүкандын жапкан наны бышып, ундан майга кууруган чайы кайнады. Келер-кетер сөздөрдү айтышып, бардыгы дасторконду тегеректей отурушту. Жалгыз гана Сакадай балалык таттуу уйкунун кучагында,"},{"t":"p","h":"Бутуна жаңы маасы, кепич, үстүнө эскилөө кызыл тувар көйнөк, жеңи чолок кара баркыт бешмант кийген, башына ак жибек элечек салынган узун бойлуу сулууча келин, аржаландап күлгөн балтыр бешик баласын көтөрүп күлүңдөп акырын кирди. Карып эки колун балага карай сунуп сүйлөйүн дегенде, келин ага эрдин кысып, унчукпагыла дегенсип колун жансады да, акырын табыш алдырбай барып, баланы Ажардын алдына отургуза салды да. кийин боло берди."},{"t":"p","h":"– Апей, ботом! – деп, Ажар чочуй сыйпалады да, – о, садаган болоюн Жакшылыгым турбайбы! Жакшылык деген атыңан садага кетейин! – деп, баланы түрдүүчө эркелетип өпкөндөн кийин, – энен кана?"},{"t":"p","h":"= Мен мындамын эне! – деп, Сүйүмкан Ажардын мойнунан кучактай оң жагына отурду."},{"t":"p","h":"<span class=\"pg\" data-n=\"165\">165<\/span>_ Салоомалейкум! – деп, чокчо кара сакал, муруту оар, жашы отузд – б ан ары кеткен кара тору киши төө жүнүнөн жасалган чапанын жо у мынып келип эшик алдына тура калды да, – ооруган жериңиз жакшы болу калыптырбы, эне? – деди Ажарга тигилип."},{"t":"p","h":"_ Кел кагылайын, Белек! Жакшымын, ооруган жерим такыр басылган көрүнөт. Көңүлүм да ачык, бүткөн боюм женил, – деп Ажар күлүмсүрөдү."},{"t":"p","h":"Кудайдын бергени ошол, – деди карып, Ажардын жакшы болуп калганына чексиз кубангандай."},{"t":"p","h":"– Бул кубаныч, эне! Иши кылып Алым экөөбүздүн аракетибиз талаага кетпесе болгону! – деп, сол жагына бары – п отурду."},{"t":"p","h":"Чети чачылуу, бурчтары саймаланган ак жоолукка оети, колун аарчый сырттан кирип келаткан Алым:"},{"t":"p","h":"_ Апа, тамагыңызды тездетиниз, мен эрте жөнөйүн!"},{"t":"p","h":"– Отур, бардыгы даяр! – деп, Күлүкан дасторконун салып, нан коюп, куурма чайдан куя баштады. Р _ Эми тоюп алып аттан, Алым. Өзүңө өзүн этиет бол, Ажар энем кел генден бери Каныбек жөнүндөгү акылды далай ирет акылдашып көрдүк. Эгер дүнүйө берип бошотууга мүмкүндүк болсо, анда мага Ё кабар кыл."},{"t":"p","h":"аябайм. Жети жашыман жетим калып өлбөй ушул күндү көрдүм. Каныбек аман бошонсо, дүнүйөнү таап алууга болот, – деди Белек."},{"t":"p","h":"– Каныбек учун, жезден менен эжен эч нерсесин аябайт, садаган Алым! Жездең жетим болуп чоңойсо, эжең бир ыштандык бөзгө жетпей чоңойгон, Эми болсо, короодо эки жүздөн ашуун кой, отуз кораз кра ту рат. Өзүңүн да өлбөгүдөй байлыгың турат. Аштын жардылыгы э баштын жарлылыгы жаман. Каныбегини аман бошотуп келип К ее болсон, экөөңүн көбөйсө, ата-энелерин эмес, мына с отурган эжең менен жезден дагы кор болбойт! – деп, Сүйүмкан күиөөсү шс Бра талканыбыз Ө да эптеп күн өткөрбөдүк беле! – деп. коштой чаап өттү. Күлүкан мурунку айтылган сөздөрдү бышы Е Садагаң болоюн Алым, ак жолуң ачылып аман оарып, аман кел. ктады. Өлгөндүн үстүнө көмгөндөй болтурба, өзүңө сак бол! Каныбегинли тез ээрчитип кел! – деп жашып кетти. к – Эй, эне ай!.. Ыгы жок жашыктыктын кереги эмне? Ак тилек менен алыска баратканда, ыйлабай туруп узатсаныз! – деп, Алым жайдарыланып"},{"t":"p","h":"келген акылды айттык, балам, мындан аркы акыл өзүңдүкү. Жалгыз киши оңойлук менен баатырлык кыла албайт. Ошондуктан, баягы Ма-Мин-Жун байдын колунда иштешип жүргөн теңтунтарынан ч миси бар экен, ошолорду байкаштырып, алар менен да – деп, Карып чайдын түбүн ууртап, бир нече жеринен кадалган ч Күлүканга сунду. Эки жумада келермин, же бир нече айда келермин. Мага ы ой карабай кышкы камыңарды көрө оергиле. – Кош, садагаң кетейн = деп, Ажар айтайын деген сөзүн айта албай, Алымдын эки оетине өпкөндө:"},{"t":"p","h":"о"},{"t":"v","l":["<span class=\"pg\" data-n=\"166\">166<\/span>кылып, – Ак жолуң ачылсы н, алло акбар! – кбар! – дешти, бардыгы чурулдаша бата =.","","ү руы оорон даткага эч ким эч нерсе дей алган эмес ЫМДЫН эки көзү жалжылдап т кара буура далай адамды өлтүргөн. Ал өлгөн да-с адамдар","оелерле. Анда-санда Тайкашканы","и каре Оуура шашкандыктан мүдүрүлө тура калып"]},{"t":"p","h":"ерде чаңды уюлгутуп бара жаткан Алымды көрдү да, тишин кыкууп жөнөдү."},{"t":"p","h":"алдын бир, аркасын бир карайт, көзүнө р ууга жар, чыга качууга тоо я жок. Тайкашка канбууранын тайрак Уруп келе жатышы рымын керсе да, кандуу тиштүү карт бөрүдөн кутулар эмес. Кара Алымдын көзүнө жомоктогу ажыдаар-"},{"t":"v","l":["ча өлч И ое тумшукка тийип калды. Бууранын оозу-мурдунан кан й зу-мурдунан аккан канды тоотпой й ой атылып барып, атт","дын тороп тура калды. Алым онтойлотуп экинчи ирет а кара бу","","тын ен м, ву Көздү ачып-жумгуча Тайкашка жыгылды, анын жанына к ртты","ра да бук түштү, Экөө тен бут серппей, көздөрүн жашылдантып","","[К] шордуу – несчастный","туткун – пленник, узник","обок – поддержка","үйүлүү – собранный в кучу","тувар – сорт китайского шёлка","<span class=\"pg\" data-n=\"167\">167<\/span>баркыт – бархат","чокчо кара сакал – черная бородка клинышком","кара тору – смугловатый","этиет – осторожность, осмотрительность","ээрчит – вести за собой, заставить следовать","онойлук менен – с легкостью","жалын – пламя","пайла – польза","кишичил – свирепый, набрасывающийся на человека","жалжылда – (о глазах) выражать страх, просьбу","мудурул – спотыкаться","арым – крупный шаг, размах","үзөңгү – стремя","таамайла – делать что-л. чётко, точно, без ошибок"]},{"t":"h3","h":"Жоомарт Бекенбаев"},{"t":"v","l":["Эмгек","Алтынды сансыз кылып тапкан эмгек,","Адамды адам кылып баккан эмгек.","Түрдөнтүп албан-албан жердин бетин,","Килемди, бачайыны жапкан эмгек.","Аткарып калети жок турмуш шертин,","Берметти безелентип тапкан эмгек.","","Жалпыны жадыратып берген эмгек,","Жер сырын бир казанга терген эмгек.","Жаңыртып куу турмушту башка түргө,","Эскини энтелетип керген, эмгек.","Шакылдап түмөндөгөн кайрат менен,","Душманын как жүрөккө челген эмгек.","","Жемишин жер бетине сепкен эмгек,","Гүлдөтүп берекесин төккөн эмгек.","Балкылдап көк деңизге күлүмсүрөп,","Кучактап күндүн нурун өпкөн эмгек,","Козголбой ичин сылап жөн жаткандын,","Чубалтып ичегисин тепкен эмгек.","","шерт – условие, клятва","безелен – голосить причитая","энтелетип – прихолить в замешательство, теряться","чубалт – волочить"]},{"t":"h3","h":"Өмүр"},{"t":"v","l":["Санап, санап эсептесем өмүрдү,","Өткөн өмүр балдан ширин көрүндү.","Жел жетпеген желмаяндай мал минип,","Жетип кууп, женер белем өлүмдү!","<span class=\"pg\" data-n=\"168\">168<\/span>Күүгүм кирип, күн батканын койсочу,","Саат жылып баратканын койсочу.","Оюн, күлкү салтанатка жарашкан,","Өмүр шагы бүрүн какпас болсочу,","№ ширин сладкий","желмаян – миф. верблюд-скакун, верблюд, отличающийс с","неутомимостью и силой"]},{"t":"h3","h":"Төлөгөн Касымбеков Сынган кылыч"},{"t":"v","l":["(Романдан үзүндү)","Алтын бешик тукуму","Наркы 1842-жылдын жайы...","","баштады. Күндө кыла жүргөн иши.","байлап бүтөрдө ага жигит келди;","– Шералы, датка атам чакырып жатат, жур! – деди шаштырып. Жы","маалында бир назар сал ып тиктеп койбог коиоогон чоң тай эмне жакшы көрүп кал- Р"]},{"t":"p","h":"лучу. Шералы збы, Кечээт й аксакалдар келип котолоп жатышкан бо-"},{"t":"v","l":["жымалы Ажыбай даткага келип жүрүшкөн баягы","Чекесин кашып, ана Киши коп окшойт. Шералыны сүр басты.","кыймылдатып, араң салам айт уп туруп, айласы кеткенде кирпигин араң"]},{"t":"p","h":"ры; жакшы чыкма айтып кирди. Бүт Таластын кадырман карыламырзалары он эки канат кең өргөөгө толуп отурушуп-"},{"t":"v","l":["ыбай даткадан башкасы","Жазел Эч качан мындай ызаатты көрбөгөн, көрөм деп аны чара Шералы апкаарый түштү. Үй толо көздөр Шерал Шералынын саламына али ама з -","","=з Шералысыңб К ы; Келдиң и? ле, б –: – леди, ан анын боз чалган н ал Л урсу здору 3 көздө","жансыз тиктеп турду. * Жакын келчи, жарыгым В","Шералы тез б үгүлүп, чалдын сөө"]},{"t":"p","h":"маттап, акырын кармады: дорун кош колдоп, Ур- – Отур ошондой, жарыгым... – Келдим, таяке... Чакырткан экенсиз... – деп жүүнү бош сүйлөдү."},{"t":"p","h":"– Кулагым сизде, таяке..."},{"t":"p","h":"<span class=\"pg\" data-n=\"169\">169<\/span>Ажыбай датка аппак суюк сакалын калтыраган алсыз колу менен акырын сылап, акырын жөтөлүп алды;"},{"t":"p","h":"– Жакшы атанын кашык менен жыйнаган мүлкүн жаман уул чөмүч менен чачып түгөтөт деген ырас. Амир Темир Көрөгөндүн чексиз зор өлкөсү өзүнүн көзү өткөн соң, жок дегенде, жүз жылга бүтүн турбады. Мураска алып, ар шаарда, ар элде бийлик жүргүзүп турган балдары бири-бирине баш койбой, ар кимиси ар жакка чоюп, эң акырында өлкө бытырап бөлүнүп кетти. Амир Темир Көрөгөндүн Миран-Шах деген бир уулунан Султан-Мухаммад, андан Абдусаид, андан Өмөр-шайх, Фергана ошол Өмөр-шайхтын энчиси болгон, Бир күнү ал дагы Самаркандагы улуу амирден өз алдынча болуп алды. Ал убакта өкүмдарлар атак үчүн жанына ырчы, чоорчу, чечен топточу экен, шаани үчүн ордосуна тоту куш, ак кептер бакчу экен. Бир күнү Аксы шаарынын касабасынын кырында отуруп, ак кептерлерине жем чачып отуруп, кептеркана кокустан урап кетип, Өмүр-шайх учуп өлүптүр. Ошондо тун уулу Бабыр он эки жашар экен. Ал ошол 899-жылы атасынын ордун басып султан болуп көтөрүлөт. Султан Бабыр акылы жетик, кайраттуу азамат чыгып, Амир Темир бабасынын өлкөсүнүн бөлүнгөнүн бириктирем деп, чачылганын жыйнайм деп, кол баштап чыгат. Ошол учурда илгерки Саин-хандын иниси Шайбандын тукумунан ошол түп атасынын атын алып Шайбани-хан деген кыйын чыгып, Эдил боюндагы Көк ордодон, андан берки Ак ордодон сан тийбегенден кийин күн чыгышты карай жортуул баштап, Самарканга кирип келип калган эле. Өз туугандарынын ыркы жогуна чыдаса да, бабасынын Самаркандагы ыйык тагын атасы бөлөк бирөө келип ээлешине Султан Бабыр чыдай албай, Шайбани-хан менен катуу кармашып, үч жолу Самаркандан Шайбани-ханды сүрүп чыгып, бирок, биротоло көчүк басып калышка арты алсыздык кылды, анын дитин түшүнүп көмөк көрсөтүшкө ыркы жок туугандарынын бири да жарабады го, өз агасын агалай албаган жаттын улагасын сагалайт, көмөк көрсөтмөк түгүл, кайта Шайбани-ханды жамынышып Султан Бабырдан Фаргананын өзүн талашты го, акыры келип кайран баатыр бактысын башка жактан издеп Ооган тарапка жер которуп кетишке аргасыз болду..."},{"t":"p","h":"Тамагын кыр-кыр дегизип, алсыз жөтөлүп отуруп, Ажыбай датка жай сүйлөдү. Шералы кирпигин ойсуз кыбыратып, баш көтөрбөй, бул сөздөрдүн кимге айтылып жатканын ажырата албай, дал болуп отура берди."},{"t":"p","h":"– Султан Бабыр үй-бүлөсүн гана алып, аз гана кишилери менен качып жолго чыккан экен ошондо. Атандын көрү, бапасыз дүнүйө... Ооматы кеткенде өз токоюнда жүрүп жолборс ачка өлөт деген ырас белем. Киндик каны тамган Ата Журтунан, ата-бабасынын ушунча кең өлкөсүнөн таман коёр, баш калкалар жер калбаптыр го ошондо. Ошол кезде Сейде-Бак толгоо тартып калат. Айла куруганда аттан түшүрөт. Ошерде Сейде-Бак кылыч таянып отуруп көз жарып, уул табат экен. Эми эмне кылышмакчы? Артта куугунчу. Алдыда кыйын жол... Тизгин жыйбай катуу жүрүш керек андан нары. Кызыл эт бала шалкылдап атка урунар, тердеп, кургап камыгар. Ага карап жайбаракат болушса, арттан куугунчу жетип, баарынын башына жапа түшүп калары белгилүү иш, Эмне айла бар? Бала кантет? Ала кетишсе да өлүм, таштап кетишсе да өлүм. Атка урунуп өлөрү бышык, а жол боюна таштап кетишсе, кокус бирөө кез келип таап алса аман алып калышы ыктымал."},{"t":"p","h":"<span class=\"pg\" data-n=\"170\">170<\/span>Ушинтип тегеренип ойлоп турушуп баланы жол боюна тагдырдын эркине таштап кетишмек болушат. Энесинин уузу менен оозантып, алтын сырлуу бешикке салып, үстүнө ак шайы оромол жаап, жуп атганарда түтпөй Султан Бабыр наристенин мандайына колунун учун тийгизип өөп, бир үшкүрүп, анан белиндеги каухар кемерин чечип бешиктин үстүнө арта таштайт. Ошол бойлон эки эмчегинин сүтү дирилдеп ийип көкүрөгүн жууп, көзүнүн жашы бетин жууп, үңүлдөп ыйлап кетип бараткан Сейде-Бактыны жандап бастырышып, колтугунан сүйөшүп, жөнөп кете беришкен экен. Аргасыздан ата кетти жүрөгү сыздап, бала калды боору катып солуп ыйлап..."},{"t":"p","h":"Үй ичи түйшөлө түштү. Кайра дым болуп, баары Ажыбай датканын оозун тиктеп калышты,"},{"t":"p","h":"– Ошол кезде ошол жерлерде кыргыз кыпчак, кырк, миң деген уруктар бир жамагат болушкан экен го. Султан Бабыр баласын таштап кеткен жерден көчкө жайыт чалып өтүп баратып, али эл коно элек тоо арасынан жаш баланын ыңаалап ыйлаган үнүн угуп, улап барып, бадалдын түбүндө турган жабуулуу алтын бешикти таап алат бир адам..,"},{"t":"p","h":"Үй ичи дагы түйшөлө түштү. Бул окуя бир Шералы эмес, бу отургандардын баарына эле белгисиз болучу."},{"t":"p","h":"– О, кудурети күчтүү, Көкө Теңир! Сактаарынды кыл үстүнөн сактайсын... – деп, дуулдап кетишти."},{"t":"p","h":"– Ошол таап алган адам баланы бешиги менен. кымбат баалуу каухар кемери менен айылга апкелет, Ошол кыргыз кыпчак кырк, миң уруктарынын жакшылары чогулуп, жети өлчөп бир кесип дегендей, баланын тагдырына ойлук кылышат экен. Ана көз ача элек кызыл эт бала... Алтын бешик... Кунда жок каухар кемер... Җөн тегин адамдын баласы эмес, узун элдин учуна кыска элдин кыйырына кабар кылып, таанып алары чыкпаган сон, кеңешип туруп, мин уругунун айлынан сүтү бар зайып табышып, балага алтын бешиги менен табылган бала дешип «Алтын бешик» деп ат коюшуп, бактырып коюшат. Шералы, угуп отурасынбы, айланайын?.."},{"t":"p","h":"Шералы аңкайып тиктеди, – Сен ошол Алтын бешиктин тукумусуң, Уктунбу, сен султандын тукумусуң."},{"t":"p","h":"Үй ичи дуу-дуу болуп кетти. Баары бүгүн көрүп отурушкандай Шералыны таңыркап тиктеп калышты. Шералы нестейип, иреңи бир кубарып, бир кызарып, же кубанарын. же кайгырарын билбей, сөздүн акырына акылы жетпей кеңгиреп отурду."},{"t":"p","h":"– Кийин... о кийин... Султан Бабыр бүткүл Индустанга падишах болуп турган чагында быякка элчи жиберип, баласына суроо салдырган дейт. Издеп жүрүп, белгилерин айтып жүрүп, элчилер Алтын бешикти табышкан дейт, Бирок, баккан эл бербей койгон экен. Не бар не жок, султандын бир тукуму арабызда турсун деп, бербей койгон экен. Кийин Алтын бешик балакатка жеткенде эл ага төрт уруктан төрт кыз алып беришет, Кыргыздан, кыпчактан, кырктан, миңден. Ошол улуу зайыбы Кутлуккан миң уругунун кызы болуптур. Ошол Кутлуккандан Алтын бешик Теңиряр деген уул көрөт..."},{"t":"p","h":"Алтын бешиктин төрт уруктан алган зайыптарынан тараган балдары чөлдө, тоодо, эч кимге түзүк баш койбой «өзү бий», «элет» атанып, эндекей <span class=\"pg\" data-n=\"171\">171<\/span>жаткан уруулардын ортосуна данакер болуп, башын бириктирип БИН: дан кайтып келе жатып, бу кыргыз элети кантип жатыры экен деп, байкай Бир кезде Шады деген бийи Маргалаңдын үстүнө тоого ууга АДЫ ууөтөйүнчү деп, башка кийим кийип алып, бир жолоочу кейпи менен кырс айылдарын кыдырып түшөт, касты жеткенби, бир айылда аны тааныппы, же тааныбайбы, кыргыздар аты-тонун сыйрып алып, өзүн өлтүрүп салышкан экен. Ал кезде бийинин кунун, өчүн алышка кубаттары келишкен эмес. О, 1174-жылдарда кытайлар Кашкарды басып, андан бери жунгар калмактарын катуу кырып, быякты карай түргөн. Калмактардын өлгөнүнөн калганы жаңы жер бошотуп алыш үчүн Фарганага самсып кирип келген эле. Алтын бешиктин балдары ошондо ишке жарайт, ошолор жол баштап, ошолор кол баштап, калмактардын селин токтотуп, үшүн тайдырып, рапка оодуруп жиберип, ошондо барктары катуу көтөрүлөт, Эң сту Жа = турган бирдиктүү ордо уюштурмакчы болуп, 1216-жылы тун уулу Алимд Нарбото ичтен чыккан, тигиндей тыштан кирген жоого туруштук кү ин"},{"t":"p","h":"й т алдырып хан көтө УРГАН эл ЫН сөзүн өтө кунт коюп угушуп, тиги орто жашап калган, сейрек кара сакалдуу, көзү алагар, корунчак, ы – Ошо күндөн Кокон ордо аталды, Сарай салынды. Хан атынан ал- дөө Шералыны үн катпай тиктеп отурушту. тын, күмүш теңге чыгарылып, казына жыйылып, казынанын эсебинен аскер күтүлүп, ар кандай өкүм хан атынан айтылып, бийлик бир колго чогултулду. Алим-ханды көрүп калдым. Ташкан суудай кайраттуу, өтө айлакер, акылы тетик, кишиге оңой менен ишенбеген, аяганды билбеген залим киши эле."},{"t":"p","h":"Аргымактардын туягын, азаматтардын канын аяган жок. Бүткүл хандык доорун тынымсыз жортуулга өткөрдү. Ошондо, жарыгым, күндүз де күндүз, түндө десе түндө аттанып чаап бердик биз дагы. тушунда Кокон жел тийген өрттөй күч алып өстү. ыр отурасынбы, жарыгым? Алим-хан кишиге оной менен ишенбеген киши кулак дебедимби. Саалдан кийин, Нарбото бийдин козу өткөндөн кийин, ал кокустан такка мураскор болуп чыгып калатко деп кичине эле шектенген алыс-жакын туугандарынын көзүн жойду. Биринчи болуп, угуп отурасыңбы, жарыгым сенин атаң Хажи бийдин башы кетти..."},{"t":"p","h":"Шералы селт деп карап, көздөрү чекчейип кетти."},{"t":"p","h":"– Хажи бий менен Нарбото бий атасы бир, энеси башка бир тууган болучу, Эки бир тууган батышпай, Хажи бий көбүнчө Чаткалда жамынып жүргөн. Биз менен сөөк жаңыртып, сенин эненди ушу Таласта алган. Ошо Нарбото бий өлгөндө ариетине барып, анан ошол бойдон ордодо кала берген болучу. Ошентип, эч капарсыз жүргөн убагында шек санап, кайран сөөгүбүздү Алим-хан күм-жам кылып салды. Бул иш 1223-жылы болду. Ошондо мен да ордодо элем. Жигиттеримди ээрчитип, карындашымды коштоп, сени өңөрүп алып, түн катып ордодон чыгып кет- Шыу кийин анын бир тууганы Өмөр-хан болду, Так талашчулардан кутулам деп, Өмөр-хан да Алим-хандын адатын кылды."},{"t":"p","h":"акыл менен жүргүзүшкө жөндөмү бар хан чыкты. Алим-хан таажы кийген Өмөр-хан Алим-ханга караганда кыйдырак, ишти кылыч менен аме <span class=\"pg\" data-n=\"172\">172<\/span>эмес, койкоюп такка отурган эмес, ат үстүнөн оокат жеп, ат үстүндө уктап, өмүрүн жоокерчиликте өткөргөн. Таажыны биринчи Өмөр-хан кийди, такка отуруп арыз сураганды биринчи Өмөр-хан баштады. Ал шаарларга мечит, медресе салдырды, кайракы жерлерге кош арык чыгартты, Коңшулары менен достошуп душманын азайтты. Ушинтип, агасы Алим-хан адамдын канына жууруп жараткан мамлекетти ичтен бекемдеди. Өмөр-хандын көзү өттү, Өмөр-хандын көзү өткөндөн кийин анын уулу Мадали ордун басты."},{"t":"p","h":"Акылсыз Мадали аталары улуу эмгек менен курган ордонун таркин кетирди, баарын колунан чыгарды. Мына быйыл жазда Бухаранын амири Насрулла-баатыр-хан капилеттен кол салып, Мадали хандын колун Кожон шаарынын жанында кыйратып таштап, Коконго кириптир, Өлөрүнө жакын Өмөр-хан бир кожонун сулуу кызына ынак экен. Өмөр-хандын көзү өткөндөн кийин шарыят урган Мадали сулуулугуна азгырылып жолоп койгон имиш! Насрулло-баатыр-хан мына ушул жерден кармаптыр. «Мадали энесин алды. Шарыяттан чыкты. Шарыяттан чыккан карабет киши мусулман тагында отура албайт!» деп жайып, уруш баштаптыр. Көрдүңбү, Насрулло-баатыр-хандын айласын. Мадали дин урганды жырылбас жерден кармап элден чыгарып туруп жыгыптыр, Дин урганды ордосунун босогосуна мууздатып таштап, Кокондун бүт эли, бүт жери Бухара-и-Шарифтин бактылуу амираны Насрулла-баатыр-хандын адил бийлиги астында ыкрар болду деп жар чакыртып, Коконго өзүнүн бегин коюп кетиптир. Мына уктуңбу муну, жарыгым? Жетим элен жетилдин, карып элең оңолдуң. Эми замандын кезмети сага келди. Аттан эми. Багыңды Насрулла-баатыр-хандын колунан талашып ал. Талашпасаң так жок, кутунбесен бак жок, жарыгым... Учур деген бир келет. Мына учур келди... ш! бейгам – беспечный, безтзаботиый"},{"t":"v","l":["ылдам – быстро","имер – завернуть, повернуть","кадырман – пользующийся почётом,","уважением","дүрүлдөп – здесь: поспешио (дружно)","ызаат – почтение, уважение.","артык баш – лишиий","унулле – звучать глухо и печально","туйшел – переворачиваться","кемер – ремённый пояс, ремённый пояс с","металлическими украшениями","анкай – быть широко открытым, зиять","ирен – ивет лица","түзүк – лалный, правильный, неплохой","байка – слелить, наблюдать, замечать"]},{"t":"p","h":"алсыз – немошный, слабый. бессильный самсы – двигаться непрерыйным потоком. мулкун – позможный, допустимый валить валом"},{"t":"v","l":["чексиз – беспрелельный, безграничный аскер – войско","шаани – красота","биротоло – совсем,","көмөк – помошь","сагала – заглядывать, подематривать","кайран – (обычно употребляется с","оттенком соболезнования) милый,","дорогой, горемычный","бышык – крепкий, прочный","ыктымал – может быть, возможно","шайы – шёлковая ткань","өкүм – решение (судебное), приговор","айлакер – хитрец, плут, ловкач","залим – жестокий. тиран","кокуста – нечаянно, против ожилания","капарсыз – беспечный, нерадивый","кум-жам – разрушенный, уничтоженный,","преврашённый в прах","оокат – пиша","кайрак – нсполивной, богарный","ынак – чистый","адил – справедливый"]}],"sub":[{"title":"Алыкул Осмонов","b":10},{"title":"Кыргыз тоолору","b":13},{"title":"Чынгыз Айтматов","b":18},{"title":"Болот калем","b":43},{"title":"Касымалы Жантөшев","b":94},{"title":"Жоомарт Бекенбаев","b":122},{"title":"Өмүр","b":124},{"title":"Төлөгөн Касымбеков Сынган кылыч","b":126}],"section":"Женишбек","pages":[154,172]},{"title":"Жусуп Турусбеков Ажал ордуна","blocks":[{"t":"h2","h":"<span class=\"pg\" data-n=\"173\">173<\/span>Жусуп Турусбеков Ажал ордуна"},{"t":"p","h":"(ЙЇ1 сүрөт) Боз тикендүү ачык талаа, Жолдун кошулган жери. Калың мүрзө, мамыга байлап койгон Искендер. Коюу тынчтык, Искендер чирээлеп жан талашып отурууга аракет кылып жатат."},{"t":"p","h":"Литун-Чан. (Кирип, таң

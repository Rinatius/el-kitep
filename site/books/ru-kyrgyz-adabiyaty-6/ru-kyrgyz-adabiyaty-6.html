<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Кыргыз адабияты 6</title>
<style>/* Mobile textbook reader. No external fonts or libraries: everything works offline. */
:root {
  --bg: #ffffff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3;
  --panel: #f6f6f6; --accent: #1f6feb; --accent-fg: #ffffff;
  --fs: 19px; --lh: 1.55;
  --font: Georgia, "Noto Serif", "DejaVu Serif", "Times New Roman", serif;
  --bar-h: 48px; --foot-h: 28px;
}
[data-theme="sepia"] { --bg: #f5ecd9; --fg: #4a3b2a; --muted: #8a7458; --line: #e0d2b4; --panel: #ece0c6; --accent: #9a5b13; }
[data-theme="dark"]  { --bg: #111315; --fg: #d8d8d8; --muted: #8c8c8c; --line: #2a2d31; --panel: #1b1e21; --accent: #6ea8ff; --accent-fg: #0b0b0b; }
[data-theme="contrast"] { --bg: #000000; --fg: #ffffff; --muted: #c8c8c8; --line: #444; --panel: #151515; --accent: #ffd400; --accent-fg: #000; }
[data-font="sans"] { --font: Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 16px/1.4 Roboto, "Noto Sans", Arial, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- Library ---------- */
.lib { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lib h1 { font-size: 22px; margin: 8px 0 4px; }
.lib .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.lib-head { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
.lib-head h1 { flex: 1; margin: 0; }
.school { display: flex; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.school button { flex: 1; min-height: 44px; padding: 0 10px; font-size: 15px; background: var(--panel); }
.school button + button { border-left: 1px solid var(--line); }
.school button.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.my-link { flex: 0 0 auto; font-weight: 600; min-height: 40px; padding: 0 12px; font-size: 14px; }
.grade { margin-bottom: 10px; }
.grade-h { display: flex; width: 100%; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 18px; font-weight: 600; text-align: left; }
.grade-h::after { content: '›'; font-size: 24px; color: var(--muted); margin-left: 10px; transition: transform .15s; }
.grade.open .grade-h::after { transform: rotate(90deg); }
.grade-h .n { margin-left: auto; font-size: 14px; font-weight: 400; color: var(--muted); }
.grade-b { padding: 0 2px; }
.grade-t { font-size: 20px; margin: 18px 0 0; }
.subj { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.bk { border-bottom: 1px solid var(--line); padding: 4px 0 12px; }
.bk:last-child { border-bottom: 0; }
.bk-t { font-size: 17px; font-weight: 600; }
.bk-s { font-size: 14px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bk-m { color: var(--muted); font-size: 13px; margin: 3px 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: .5; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.bk-h { display: flex; align-items: flex-start; gap: 4px; }
.bk-h .bk-t { flex: 1; padding-top: 10px; }
.bk .row { gap: 4px; }
.bk .row .btn { min-height: 40px; padding: 0 18px; font-size: 14px; margin-right: 8px; }
.bk .icon { color: var(--muted); flex: 0 0 auto; }
.bk .icon[disabled] { opacity: .5; }
.bk .icon.on { color: var(--accent); }
.bk .star.on svg { fill: currentColor; }
.bk .star.on { color: #e3a008; }
.share-opts { display: flex; flex-direction: column; gap: 10px; }
.share-opts .note { margin-top: 0; }
.sheet h3 .icon { flex: 0 0 auto; }

/* ---------- Reader ---------- */
.reader { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; user-select: text; }
.viewport { position: absolute; left: 0; right: 0; top: 0; bottom: var(--foot-h); overflow: hidden; }
.flow {
  height: 100%; column-fill: auto; padding: 20px 0 12px;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  will-change: transform; transform: translate3d(0,0,0);
  hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
}
.flow.anim { transition: transform .25s ease-out; }
.flow p { margin: 0 0 .15em; text-indent: 1.4em; text-align: left; }
.flow p.ni { text-indent: 0; }
.flow h1, .flow h2, .flow h3 { font-family: Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.25; break-after: avoid; page-break-after: avoid; }
.flow h1 { font-size: 1.35em; margin: .2em 0 .8em; text-align: center; }
.flow h2 { font-size: 1.15em; margin: 1.1em 0 .5em; }
.flow h3 { font-size: 1.0em; margin: 1em 0 .4em; }
.flow .verse { margin: .6em 0 .8em 1em; break-inside: auto; }
.flow .verse div { text-indent: -1em; padding-left: 1em; text-align: left; }
.flow .verse .gap { height: .7em; }
.flow figure { margin: .8em 0; text-align: center; break-inside: avoid; page-break-inside: avoid; }
.flow figure img { max-width: 100%; height: auto; border-radius: 4px; background: var(--panel); }
.flow figcaption { font-size: .8em; color: var(--muted); margin-top: .3em; }
.flow .box { border-left: 3px solid var(--accent); padding: .1em 0 .1em .7em; margin: .7em 0; }
.flow .pg { font: 11px/1 Roboto, Arial, sans-serif; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 4px; margin: 0 3px; vertical-align: 2px; text-indent: 0; white-space: nowrap; user-select: none; }
.flow .end { height: 1px; }
.flow .endnote { text-align: center; color: var(--muted); font-size: .8em; margin-top: 2em; font-family: Roboto, Arial, sans-serif; }
[data-theme="dark"] .flow img, [data-theme="contrast"] .flow img { filter: brightness(.9); }

.foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot-h); display: flex; align-items: center;
  justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.foot .t { overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }

.bar { position: absolute; left: 0; right: 0; background: var(--panel); border-color: var(--line); z-index: 5;
  transition: transform .2s; display: flex; align-items: center; }
.bar.top { top: 0; height: var(--bar-h); border-bottom: 1px solid var(--line); transform: translateY(-100%); padding: 0 4px; }
.bar.bottom { bottom: 0; border-top: 1px solid var(--line); transform: translateY(100%); padding: 10px 16px 14px; flex-direction: column; align-items: stretch; gap: 6px; }
.reader.ui .bar { transform: none; }
.bar .title { flex: 1; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.bar .info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* ---------- Sheets (TOC, settings) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85%; overflow: auto; background: var(--bg);
  border-radius: 16px 16px 0 0; z-index: 11; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
.sheet h3 { margin: 10px 0 12px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.toc a { display: block; padding: 11px 4px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 15px; }
.toc a.sub { padding-left: 20px; font-size: 14px; color: var(--muted); }
.toc a.cur { color: var(--accent); font-weight: 600; }
.set { margin: 14px 0; }
.set label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; }
.seg button.on { border: 2px solid var(--accent); font-weight: 600; }
.swatch[data-v="light"] { background: #fff; color: #1b1b1b; }
.swatch[data-v="sepia"] { background: #f5ecd9; color: #4a3b2a; }
.swatch[data-v="dark"] { background: #111315; color: #d8d8d8; }
.swatch[data-v="contrast"] { background: #000; color: var(--accent-fg); }
.goto { display: flex; gap: 8px; }
.goto input { flex: 1; min-height: 44px; font-size: 16px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px;
  border-radius: 20px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Textbook elements produced by tools/convert_pdf.py ---------- */
.flow .tasks, .flow .gloss { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45;
  background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0; }
.flow .tasks p, .flow .gloss p { margin: 0 0 .35em; text-align: left; }
.flow .gloss { border-left: 3px solid var(--accent); }
.flow p.note { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; font-style: italic; text-indent: 0; margin: .6em 0; }
.flow p.attr { text-align: right; text-indent: 0; font-style: italic; color: var(--muted); margin: .1em 0 .8em; }
.flow p.sep { text-align: center; text-indent: 0; color: var(--muted); margin: .5em 0; letter-spacing: .3em; }
.flow h2 .pg, .flow h3 .pg { font-weight: normal; }
.toc .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 4px 2px; }
.toc a .p { float: right; color: var(--muted); font-size: 13px; margin-left: 8px; }

/* ---------- Elements produced by tools/convert_layout.py (typeset textbooks) ---------- */
.flow figure img { cursor: zoom-in; }
.flow h4.mk { font: 700 .78em/1.3 Roboto, "Noto Sans", Arial, sans-serif; letter-spacing: .05em; color: var(--accent);
  margin: 1em 0 .3em; break-after: avoid; page-break-after: avoid; }
.flow p.hl { color: var(--accent); text-indent: 0; }
.flow p.small { font-size: .82em; text-indent: 0; color: var(--muted); }
.flow sup, .flow sub { font-size: .7em; line-height: 0; }
.flow .kbox { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45; background: var(--panel);
  border-radius: 8px; padding: .45em .7em; margin: .5em 0; border-left: 3px solid var(--accent); }
.flow .kbox > b { display: block; }
.flow .frame { background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0;
  font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; line-height: 1.45; }
.flow .frame p { text-indent: 0; margin: 0 0 .35em; text-align: left; }
.flow .tbl { margin: .8em 0; font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .8em; line-height: 1.35; }
.flow .tbl .tt { font-weight: 600; text-indent: 0; text-align: center; margin-bottom: .3em; }
.flow .tbl table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.flow .tbl th, .flow .tbl td { border: 1px solid var(--line); padding: .3em .35em; vertical-align: top; text-align: left; overflow-wrap: anywhere; hyphens: auto; }
.flow .tbl th { background: var(--panel); }
.flow .tbl tr { break-inside: avoid; page-break-inside: avoid; }

.zoom { position: fixed; inset: 0; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; background: rgba(0,0,0,.92); z-index: 30; }
.zoom-in { position: absolute; inset: 0; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
.zoom-in img { margin: auto; flex: none; touch-action: pan-x pan-y; object-fit: contain; background: #fff; cursor: zoom-in; }
.zoom-x { position: absolute; top: 8px; right: 8px; color: #fff; background: rgba(0,0,0,.5); z-index: 31; }
.flow h4.sh { font: 700 .95em/1.3 Roboto, "Noto Sans", Arial, sans-serif; text-align: center; margin: .8em 0 .4em; break-after: avoid; page-break-after: avoid; }

/* maths books */
.flow h4.ex, .flow h4.try { font-family: Roboto, Arial, sans-serif; margin: 1.1em 0 .3em; font-size: 1em; }
.flow h4.ex { display: inline-block; background: #f7e400; color: #111; padding: .1em .6em; border-radius: 3px; }
.flow h4.try { color: var(--accent); }
.flow p.goal { font-size: .85em; text-indent: 0; background: var(--panel); border-radius: 8px; padding: .4em .7em; }
.flow b.bd { display: inline-block; text-indent: 0; padding: 0 .4em; border-radius: 1em; background: var(--fg); color: var(--bg);
  font: bold .8em/1.45 Roboto, Arial, sans-serif; margin-right: .2em; }
.flow b.nb { display: inline-block; text-indent: 0; min-width: 1.4em; border-radius: 4px; background: var(--accent); color: var(--accent-fg);
  text-align: center; font-size: .8em; margin-right: .3em; }
.flow .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.15; margin: 0 .1em; }
.flow .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .15em; }
.flow p.ml { text-indent: 0; padding-left: 1em; }
.flow p.side { font-size: .85em; }
.flow details.ans { margin: .3em 0 .8em; font-size: .9em; }
.flow details.ans summary { color: var(--accent); cursor: pointer; font-family: Roboto, Arial, sans-serif; }

/* wide tables become one card per row on phones */
@media (max-width: 560px) {
  .flow .tbl.cards table, .flow .tbl.cards tbody, .flow .tbl.cards tr, .flow .tbl.cards td { display: block; width: auto; }
  .flow .tbl.cards tr:first-child { display: none; }
  .flow .tbl.cards tr { border: 1px solid var(--line); border-radius: 8px; margin: .5em 0; padding: .3em .5em; }
  .flow .tbl.cards td { border: 0; padding: .15em 0; }
  .flow .tbl.cards td::before { content: attr(data-l); display: block; font: 600 .75em/1.3 Roboto, Arial, sans-serif; color: var(--muted); }
  .flow .tbl.cards td:first-child { font-weight: 600; }
}
.flow figure.vec svg { max-width: 100%; height: auto; display: inline-block; background: #fff; border-radius: 4px; cursor: zoom-in; }
[data-theme="dark"] .flow figure.vec svg, [data-theme="contrast"] .flow figure.vec svg { filter: brightness(.9); }
.flow .rt { border-top: 1px solid currentColor; padding-top: 1px; margin-left: 1px; }
.flow .it { display: inline-block; max-width: 100%; margin-right: .9em; text-indent: 0; }

/* ---------- Text quality badge (library rows, first page of a book, reader top bar) ---------- */
.q { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 10px 2px 8px; margin: 0 8px 2px 0;
  border: 1px solid var(--line); border-radius: 13px; background: var(--panel); color: var(--fg);
  font: 12px/1.2 Roboto, "Noto Sans", Arial, sans-serif; vertical-align: middle; text-indent: 0; white-space: nowrap; }
.q i, .qdot i { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.q-exact i { background: #2da44e; }
.q-proofread i { background: #3b82f6; }
.q-ocr i { background: #e8900c; }
.qdot { display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 12px; }
.qdot i { width: 12px; height: 12px; }
.bk .row .q { margin: 0 0 0 auto; }
.flow .qline { margin: 0 0 1em; text-indent: 0; }
.flow .qline .q { font-size: 13px; cursor: pointer; }
.qsheet .q { font-size: 14px; min-height: 30px; margin: 0 0 4px; }
.qsheet p { font-size: 15px; line-height: 1.5; margin: 10px 0; }

/* ---------- Menu (☰), "What's new", missing books ---------- */
.lib-head .burger { flex: 0 0 auto; margin-left: -10px; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 85%); background: var(--bg); z-index: 11;
  padding: 8px 0 24px; overflow: auto; box-shadow: 2px 0 12px rgba(0,0,0,.2); }
.drawer-h { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 8px 16px; font-weight: 600; font-size: 17px; }
.drawer a { display: block; padding: 14px 16px; color: var(--fg); text-decoration: none; font-size: 16px; border-top: 1px solid var(--line); }
.drawer a.cur { color: var(--accent); font-weight: 600; }
.drawer .note { padding: 8px 16px 0; border-top: 1px solid var(--line); margin-top: 0; }
.news-d { font-size: 15px; color: var(--muted); font-weight: 600; margin: 20px 0 6px; }
.news { border-bottom: 1px solid var(--line); padding: 2px 0 10px; }
.news p { margin: 6px 0; font-size: 15px; line-height: 1.5; }
.news summary { color: var(--accent); cursor: pointer; font-size: 14px; min-height: 32px; line-height: 32px; }
.news-b { margin: 2px 0 4px; padding-left: 20px; font-size: 14px; line-height: 1.8; }
.bk.miss { padding: 8px 0 12px; }
.bk.miss .bk-m { margin-bottom: 6px; }
.ms { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.ms-kyonly, .ms-edition, .ms-sample { border-color: #e8900c; }
.bk.miss .note { margin-top: 6px; font-size: 14px; }
.offer { margin: 24px 0 0; padding: 14px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.offer h2 { font-size: 18px; margin: 0 0 6px; }
.offer p { margin: 6px 0; font-size: 15px; line-height: 1.5; }
.up label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
.up select, .up input[type=text], .up textarea { width: 100%; min-height: 44px; font-size: 16px; padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-family: inherit; }
.up input[type=file] { font-size: 15px; max-width: 100%; }
.up .btn { margin-top: 14px; width: 100%; }
.up .done { font-weight: 600; }

/* ---------- Report a text error (select text in a book) ---------- */
.rep { position: absolute; left: 50%; bottom: calc(var(--foot-h) + 14px); transform: translateX(-50%); z-index: 6;
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 22px;
  background: var(--accent); color: var(--accent-fg); font-size: 15px; font-weight: 600; box-shadow: 0 2px 10px rgba(0,0,0,.25);
  white-space: nowrap; -webkit-user-select: none; user-select: none; }
.rep[hidden] { display: none; }
.rep svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rq { margin: 0 0 6px; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--panel); border-radius: 6px;
  font-family: var(--font); font-size: 16px; line-height: 1.45; max-height: 30vh; overflow: auto; }
.sheet textarea { width: 100%; font-size: 16px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); font-family: inherit; }
.sheet .rsend { width: 100%; }
</style>
</head>

киндиктин желеги.","Бизге жеткен ата салтын, мурасын,","Ыйык сактап, урпактарга берели.","","Кайырма."]},{"t":"h3","h":"<span class=\"pg\" data-n=\"3\">3<\/span>А. Мусаев, Т. Үсөналиев"},{"t":"h2","h":"КЫРГЫЗ АДАБИЯТЫ"},{"t":"v","l":["Окутуу орус тилинде жүргүзүлгөн","жалпы билим берүүчү мектептердин","6-классы үчүн окуу китеби","","Экинчи басылышы","","Кыргыз Республикасынын Билим берүү, илим","жана жаштар саясаты министрлиги бекиткен"]},{"t":"h3","h":"БИШКЕК «БИЛИМ КУТУ» – 2006"},{"t":"p","h":"<span class=\"pg\" data-n=\"4\">4<\/span>дүйнөнү көрсөтөр, элдин дилин түшүндүрөр, сөз берметтерине кандырар, кеп маанисин туюнтар улуу күч-улуттук адабиятын өздөштүрүү парзы турат."},{"t":"p","h":"Сен бул адабиятты окуп үйрөнүү менен элдин байыркы кезден ушул мезгилге чейин өнүгүп-өсүп келген көркөм сөз өнөрүнүн эң сонун үлгүлөрү менен таанышасың. Кыргыз адабиятындагы элдик оозеки чыгармачылык, акындар чыгармачылыгы, байыркы жана учурдагы жазма адабияттын мыкты үлгүлөрүн окуп, көркөм дүйнөң байыйт. Эл ичинен чыккан Т. Сатылганов, Молдо Кылыч, Жеңижок, Калык өңдүү акындар, Ч. Айтматов, А. Осмонов, М. Элебаев, К. Эсенкожоев, Ж. Садыков сыяктуу көркөм сөздүн чебер сүрөткерлери жана алардын чыгармалары менен таанышасың. Аларда баяндалган окуя, көрүнүштөргө күбө болуп, оң, терс образдарды байкайсыңар, турмуштун жаманчылык-жакшылыгын, өмүр, өлүм сыяктуу түбөлүктүү түшүнүктөрдү аңдап, каармандар менен кошо кубанып, сүйүнүп, ыйлап, жек көрүп, сүйүп чыныгы адамдык сезим-туюмдарга ээ болосуң."},{"t":"p","h":"Кыргыз тилинин эң сонун сөз берметтерин, сулуу, кооз сүйлөмдөрүн, ажарлуу кептерин¹ жан дүйнөңөргө сиңирип, силер калктын тилинин байлыгына дагы бир жолу ынанасыңар. Көркөм сөздүн күчү менен токулган² ыр, жомок, макал-лакап, аңгеме-повесттерди окуйсуң. Элдин бай адабий үлгүлөрүн таанып-билип, улуттун маданий көркөм мурасынын, эстетикалык көз караштарынын сырын андайсың. Айтор, неси болсо да бул адабият силерге кыргыз элин жакындан таанытып, тили менен кошо ошол элдин көркөм ой байлыгын, ажайып, аруу дилин түшүндүрүүдө чексиз кызмат өтөөрүндө шегибиз жок. Анда эмесе, Ак Жол сага, жаш окурман!"},{"t":"p","h":"¹ Ажарлуу кептерин-мында; красивые речи (слова) – меткие и образные изречения."},{"t":"p","h":"² Сөз күчү менен токулган (түзүлгөн) – созданные с помощью художественного слова."}],"sub":[{"title":"Кыргыз Республикасынын Мамлекеттик Гимни","b":1},{"title":"Бейкуттукту берет кыргыз жерине.","b":3},{"title":"А. Мусаев, Т. Үсөналиев","b":5},{"title":"БИШКЕК «БИЛИМ КУТУ» – 2006","b":8}],"pages":[0,4]},{"title":"КӨРКӨМ АДАБИЯТ ЖӨНҮНДӨ ТҮШҮНҮК","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"5\">5<\/span>КӨРКӨМ АДАБИЯТ ЖӨНҮНДӨ ТҮШҮНҮК"},{"t":"p","h":"Кымбаттуу дос!"},{"t":"p","h":"Сенин бул кезде жалпы эле адабият, көркөм адабият жөнүндө түшүнүгүң бар. Ошондой болгон күндө да кыргыз тилинде төмөнкүлөрдү билип койгонуң да артыкбаш болбойт¹."},{"t":"p","h":"Ааламда эң бир кызык, кооз, укмуштуу дүйнө-сөз дүйнөсү² Мына ошол сөз дүйнөсүнө колундагы китеп алып кирет. Аны канчалык кызыгып, көңүл бөлүп окуган болсоң, анын сонундугуна соңуркап,³ аны ошончолук терең, кеңири таанып-билүүгө умтула баштайсың. Андагы окуялардын сыйкырлуу сыры менен ажайып каармандары сени да өзү менен алдыга жетелеп күрөшкө алып чыгат. Сен алар менен кыялында далай турмуштук, татаал кагылыштар менен карама-каршылыктардан өтүп, жаратылыштын не бир көз тайгылткан кубулуш-көрүнүштөрүнө тушугасың⁴. Сенин бул «бейтааныш таанышың»⁵ (Г.Белинский) сени көркөм саякат-сапарына алып чыгат. Сен бирде өмүрү чокусунан кар кетпеген Теңиртоо, Памир, Алай, Тяньшань тоолорунун кокту-колотторунда, жылга-төрүндө жүрсөң, бирде берметтей жылтылдаган⁶ Ысыккөл, Соңкөл аттуу көлдөрүне, мөлтүрөп аккан⁷ кашка сууларына түшөсүң. Ушул аскасы асман челген,¹ бейиштин төрү сыяктуу² жерде тиричилик кылган адамдардын жашоо-турмуштары менен таанышасың. Элдин Эр Төштүктөй баатырларынын, Акай мергендей көзгө атар мергенинин эрдиктерин көрөсүң. Ырас, бул заманга келерден мурун далай «Борондуу күндөр» (М.Элебаев) болуп өткөнүн, эл караңгылыкта жатканда³ Дүйшөндөй («Биринчи мугалим») патриоттор тамга таанытканын, анан ал элден А.Осмоновдой акындар, ойлоп табуучу⁴ инженерлер («Үчүнчү шар») ж.б. азаматтар чыкканына күбө болосуң."},{"t":"p","h":"¹ Артыкбаш болбойт – лишним не будет."},{"t":"p","h":"² Сөз дүйнөсү (мында; көркөм адабият) – мир слов, художественный мир."},{"t":"v","l":["³ Соңуркап (кызыгып) – интересоваться","⁴ Тушугасың (туш болосуң, кезигесиң) – встретишься.","⁵ «Бейтааныш таанышың» – «незнакомый знакомец»"]},{"t":"p","h":"⁶ Берметтей жылтылдаган – сверкающий, блестящий как жемчуг ⁷ Мөлтүрөп аккан – чистые, прозрачные (горные реки)."},{"t":"p","h":"<span class=\"pg\" data-n=\"6\">6<\/span>Ошентип, көркөм адабият деген дүйнөнүн чыныгы «көркөм даамы»⁵ дал ошол окуя, сюжеттерден билинет. Анда сен сүйгөн каармандар, сен туу тутунуучу көз караштар⁶ сени жашоого чакырып турат. Адабият мына ошол элестүүлүгү⁷ аркылуу адамдын жан дүйнөсүн тарбиялайт, жашоонун көзүн таанытат."},{"t":"p","h":"Адабият бардык өнөрдүн (искусствонун) ичинен турмушту, айлана-чөйрөнү кенен-кесир⁸ чагылдырып берген сөз өнөрү. Көркөм чыгарма адамдардын баарына бирдей даражада жеткиликтүү да, түшүнүктүү да болот. Ал ошол бардыгына жагымдуулугу, жугумдуулугу аркылуу искусствонун башка түрлөрүнөн айырмаланат."},{"t":"p","h":"Адабият – элдин тарыхый басып өткөн жолунун көөнөрбөс күзгүсү⁹. Ал бир элдин өткөн кездеги даңктуу да, кайгылуу да¹⁰ күндөрү, көрүнүктүү окуялары анын эпосторуна, уламыш, санжыраларына, макал-лакаптарына, аңгеме, ырларына чөгөрүлгөн¹. Биз ал көркөм тексттерден ата-бабаларыбыз ким болгон, кандай күндөрдү баштарынан өткөргөн жана урпактары – биз ким болдук, кандай учурда жашап жатабыз деген суроолорго жооп табабыз!"},{"t":"p","h":"¹ Аскасы асман челген – мында (обр.выр.) – горы с вершинами, уходящими в небо"},{"t":"p","h":"² Бейиштин төрү сыяктуу – подобно райскому уголку ³ Эл караңгылыкта жатканда – когда народ жил в темноте, был безграмотен"},{"t":"p","h":"⁴ Ойлоп табуучу – изобретатель ⁵ «Көркөм даамы» (обр.выр.перен.) – художественная красота."},{"t":"p","h":"⁶ Туу тутунуучу көз караштар – здесь опорные, фундаментальные взгляды."},{"t":"v","l":["⁷ Элестүүлүгү (образдуулугу) – образностью","⁸ Кенен-кесир (кенен-чоңон) – вполне, достаточно"]},{"t":"p","h":"⁹ Элдин тарыхый басып өткөн жолунун көөнөрбөс көркөм күзгүсү – зеркало художественно отражающий пройденный народом исторический путь."},{"t":"p","h":"¹⁰ Даңктуу да, кайгылуу да – и славные и печальные <span class=\"pg\" data-n=\"7\">7<\/span>"},{"t":"p","h":"Көркөм адабият турмушту сөз өнөрү, тил кудурети аркылуу² таанытат. Ар бир тилде жаткан санжыргалуу сөз берметтери, образдуу сөз гүлдөрү, накыл кептер, учкул сөздөр ж.б. көркөм адабияттын үлгүлөрү аркылуу «кыймылга келет»³. Айлана-чөйрөнү, турмушту, адамды таанытууда сыйкырдуу, ийкем сүрөттөөчүлүк, баяндоочулук, ой жүгүртүүчүлүк кеңири мүмкүнчүлүктөрдү ачат."},{"t":"p","h":"Адабияттын предмети адам жана анын турмушу болгондуктан, ал адамдык түбөлүктүү асыл нарктарга⁴, инсандык адеп-ахлакка үндөөдөн талбайт⁵. Жамандык-жакшылыкты, кооздукту, шандуулукту таанытып, адамды туура жолго ээрчитет. Элдик бийик идеяларга үндөйт. Мына ошентип⁶ ал адептик, эстетикалык табитти калыптандыруу кызматын аткарат!.."},{"t":"h3","h":"Сөздүк"},{"t":"v","l":["далалаттанып (аракеттенип) – пытаясь, стараясь","Ира кыргыз тилин үйрөнүүгө көп далалаттанат.","Уй да баласына энелик далалатын жумшайт.","дилин өздөштүрүүгө – чтобы осваивать духовный мир","күмөн санабайсың – не сомневаешься","Асан ичинен күмөн санап турду.","тереңден түшүнгөндө гана – когда глубже познаешь."]},{"t":"p","h":"Адамды тереңден түшүнгөндө гана ал жөнүндө туура пикир жаралат."},{"t":"v","l":["Сабакты көңүл коюп окуп, терең түшүн.","жуурулуп жашайсың- обр.выр. жить душа в душу"]},{"t":"p","h":"Ак буудайдын унундай жуурулушуп турду дейт. (фольк.) өздөштүрүү парзы – обязанность освоения, познания,"},{"t":"v","l":["күбө болуп – быть свидетелем, свидетельствовать,","түбөлүктүү түшүнүктөр – вечные понятия."]},{"t":"p","h":"Эмгек, тил, өнөр, адам, достук дегендер түбөлүктүү түшүнүктөр."},{"t":"v","l":["ынанасыңар (ишенесиңер) – убедитесь","¹ Чөгөрүлгөн (сиңирилген) – здесь: отражены"]},{"t":"p","h":"² Тил кудурети аркылуу – благодаря могуществу слова ³ «Кыймылга келет» (жанданат) – оживают, обретают красоту и силу."},{"t":"v","l":["⁴ Түбөлүктүү асыл нарктарга – к вечным ценностям.","⁵ Үндөөдөн талбайт – (обр.выр.) не устает призывать","⁶ Мына ошентип – таким образом."]},{"t":"p","h":"<span class=\"pg\" data-n=\"8\">8<\/span>көркөм мурас – художественное наследие"},{"t":"p","h":"Ар бир элдин маңдайына бүткөн көркөм мурасы болот. шегибиз жок – не сомневаемся умтула баштайсың – начинаешь стремиться"},{"t":"p","h":"Көркөм дүйнөң өссө, көп нерсеге умтула баштайсың. Эркелей жүгүрмөккө алга жүткүндү."},{"t":"p","h":"кагылыштар менен карама-каршылыктар – схватки и противоречия"},{"t":"p","h":"Тарыхта далай каршылыктар, кагылыштар болгон. Такыр эле карама-каршы жакка кетти."},{"t":"v","l":["көзгө атар мерген – меткий стрелок.","Акай бул өрөөндүн көзгө атар мергени болчу."]},{"t":"p","h":"жагымдуулугу (жугумдуулугу) – приятность, полезность, востребованность. Адилеттик сүйлөгөнү жагымдуу. Ал чөйрөсүнө жугумдуу бала."},{"t":"p","h":"көркөм адабияттын үлгүлөрү – образцы художественной литературы"},{"t":"h3","h":"Ойлонгула!?"},{"t":"p","h":"1. Кандай ойлойсуңар: силер туулуп өсүп, жашооңорду кечирип жаткан жер артыкпы же алыстагы бай өлкөлөрдүн жери артыкпы? Силер аралашып жашап жаткан башка улуттун өкүлдөрү: (кошунаңар, эл) жөнүндө көп билесиңерби же алыстагы элдер жөнүндө көп билесиңерби? Эгер силер кокустан кырсыкка учурасаңар же бакытка бөлөнсөңөр, кайгы-кубанычыңарды ким менен бөлүшө аласыңар? Мексикалык, англичан мененби же кыргыз, дунган, өзбек мененби?"},{"t":"p","h":"2. Эмне үчүн элдин, адамдын ички жан дүйнөсүн, дилин билүү керек? Улуттук адабиятты, тарыхты, географияны ж.б. сабактарды кыргызча окуу аркылуу силер эмнеге жетише аласыңар? Булар силердин элди-жерди таанышыңарга, тилди терең үйрөнүшүңөргө жардам бере алабы?"},{"t":"p","h":"3. Көркөм адабият жөнүндө кандай түшүнүктөсүңөр? Кыргыз көркөм сөз өнөрү, анын белгилүү өкүлдөрү жөнүндө билесиңерби? Кыргыз адабияты менен кыргыз искусствосунун, кыргыз тарыхынын, кыргыз тилинин, кыргыз маданиятынын кандай байланышы бар?"},{"t":"p","h":"Кыргыз эли, кыргыз тили жана адабияты жөнүндө буга чейин окуп-үйрөнгөндөрүңдү, билгендериңди эске түшүр. Сен туулуп, жашап, суусунан ичип, абасынан дем алып жаткан аймак сенин түшүнүгүңдө кандай аймак (географиялык, тарыхый ж.б. жактан) экендигине саресеп сал. (баамда – наблюдай)"},{"t":"p","h":"Туулуп-өскөн жер, чогуу жашаган эл, тил тууралуу макал-лакаптарды, ыр-аңгемелерди, сүрөт жана обондуу ырларды чогулт."},{"t":"p","h":"Мисалы: «Жеринен оогонго, жети жылы конуш жок», «Жер-казына, суу – алтын», «Эл ичи – алтын бешик», «Жаман туугандан – жакшы кошуна артык», «Өнөр алды – кызыл тил» ж.б."},{"t":"p","h":"Кыргыз тилинен жана кыргыз адабиятынан V класста эмнелер өтүлгөнүн эске түшүргүлө:"},{"t":"p","h":"<span class=\"pg\" data-n=\"9\">9<\/span>Тексттен жөнөкөй жана татаал сөздөргө, кош жана кошмок сөздөргө, синоним жана антонимдерге мисалдарды тапкыла. Алардын кайсы сөз түркүмүндө экендигин аныктагыла. Үлгүсү:"},{"t":"v","l":["Жөнөкөй сөз – зат атооч: Конуш,...; сын атооч: Кооз,...; сан атооч: Көп,...","Татаал сөз – сын атооч: Эң бир кызык,...; сан атооч: Кырк үчүнчү,...","Кош сөз – зат атооч: Сезим-туюм, нарк-насил,...; сын атооч: Кенен-кесир,","Кошмок сөз – зат атооч: Сөз өнөрү, Теңиртоо,...","Синоним – зат атооч: Накыл кеп, учкул сөз;...; сын атооч: Кооз, сулуу, аруу;...","Антоним – зат атооч: Ысыгына күйүп, суугуна тоңуп; жамандык – жакшылык;...; сын атооч: мөлтүрөп, киргилденип;..","Омоним – зат атооч: Сыр – тайна, сыр – краска, сыр (тамак) – сыр (еда);...; сын атооч: ...; сан атооч: ..."]},{"t":"h3","h":"ТҮШҮНДҮРМӨ СӨЗДҮК"},{"t":"p","h":"дил (жүрөк, көңүл, ниет, жүрөктөгү ой-пикир) – душа, внутренний духовный мир человека, средоточие чувств, помыслов, желаний. каада-салт (урп-адат) – обычаи, общепринятый порядок, традиционно установившиеся правила общественного поведения."},{"t":"p","h":"нарк-насил – то же; достоинство, авторитет. Жосун, салт маанисинде руханий бай – духовно богатый, богатство внутреннего духовного мира человека."},{"t":"p","h":"санжыргалуу сөз берметтери (сөз гүлдөрү) – обр. выр., букв. жемчужины слов, красивые изречения."},{"t":"p","h":"парз (вазифа, милдет) – обязанность."},{"t":"p","h":"кокту-колот – вид рельефа, лог, широкий овраг с пологими склонами, поросший травой, кустарником."},{"t":"p","h":"жылга-тер – вид рельефа, высокогорные пастбища с ложбинами ата-бабалар – предки, поколения, жившие задолго до настоящего времени."},{"t":"p","h":"урпактар (балдары) – потомки, люди будущих поколений."},{"t":"h3","h":"<span class=\"pg\" data-n=\"10\">10<\/span>КЫРГЫЗ ЭЛДИК ООЗЕКИ ЧЫГАРМАЛАРЫНАН"},{"t":"h3","h":"ЭПИКАЛЫК ТЕК"}],"sub":[{"title":"ТҮШҮНДҮРМӨ СӨЗДҮК","b":48},{"title":"КЫРГЫЗ ЭЛДИК ООЗЕКИ ЧЫГАРМАЛАРЫНАН","b":56}],"pages":[5,10]},{"title":"ЭР ТӨШТҮК","blocks":[{"t":"h3","h":"ЭР ТӨШТҮК"},{"t":"p","h":"...Кебезтоо деген жерде, кең кыпчак элинде Элеман деген абышка жашаптыр. Буга чейин тогуз уулдуу болсо да алары акылсыз чыгып, мал артынан кетишип, тентип жоголушат. Башына карылык келип каржайып калганда¹ тогуз уулдун кенжеси Эр Төштүк төрөлөт. Төштүк төрөлгөндө эле тың чыгат. Жоголгон агаларынын дайнын угуп, аларды ар кай жерден чогултуп келип, үйлөп-жайлап, мал-жанын бөлүп берет. Өзү да сан жылкылуу Сарыбайдын² кенжеси, тогуз кыздын эркеси Кенжекеге үйлөнөт. Кенжеке акылы арткан, ай чырайлуу кыз экен. Төштүккө барарда атасынан касиеттүү Саканы, Чайинги тонду, Чалкуйрук сындуу атын жана Төштүктүн жаны катылган өгөөнү сурайт. Анткени, алар келечекте Төштүккө керек болорун алдын-ала билет. Булар жан эти менен тең³ Сарыбай бербеймин деп айталбай, ичинен кара кан өтүп,⁴ аргасыз сурагандарын берет. Тоюн тойлотуп, кыз оюнун ойнотуп, Кенжекени аттап-тондоп, күйөөгө узатат. Жолдо келе жатышса атайын андып жүргөн желмогуз кемпир Чуктеректин⁵ боюнда, аккан суу менен кошо өпкө болуп агып келип Элеманды кармап алып, кыйнап, баласы Төштүктү сурайт. Өпкөсүнөн өжөк-өжөк кан⁶ кеткен Элеман акыры кемпирдин кыйноосуна чыдай албай, Төштүктүн жаны катылган өгөөнү унутуп, коломтонун түбүнө таштап кетүүгө убада берет. Ошондо келип, алактап шашып, акылы качып, келини Кенжекеден болот өгөөнү алдап сурап алат."},{"t":"p","h":"¹ Каржайып калганда – когда постарел ² Сан жылкылуу Сарыбай – Сарыбай имеющий много скота, зажиточный Сарыбай"},{"t":"v","l":["³ Жан эти менен – перен. дорогой сердцу","⁴ Ичинен кара кан өтүп (фраз) – с трудом, с горечью"]},{"t":"p","h":"⁵ Чуктерек – название местности. По народным преданиям дерево растущее на Аягузе."},{"t":"p","h":"⁶ Өжөк-өжөк кан кетип – мучаясь, истекая кровью"},{"t":"img","src":"data:image/webp;base64,UklGRtJXAABXRUJQVlA4IMZXAAAQYgKdASqAAowBPp1CmEmlpCKkO7XMcLATiWkBIx41iR1eha7y2eYmMTqx5F/v18Et9f17wT/oH7l/9eqTun/Lu3hxrPSf/Hygv8viqf6+uf5T/8/ZQ/dz1/9Xr/10In/r4Gx0QJxd0N/PBKiwgEou/HqJTjZiNyaGR3NyoCUbwAHuzkqD3l5mHSAbHWwEoqOveRwm6uhdBSwRPCw3H1f9mrneWY80B8gC3+DhaH8K0Df8VBZgYiP76+VVSxrdSD0httpyS0zD1FsqkGYKYmAH6Vvdz3svYS/qVDZVqZqXte3MKpBWJOH80Ao/lx7MnA+xoFmV9pFAwD7VirNvLthwXBYer1x9TxaPyFFCZEG+XDc0YOj0HVQGA06UFTEbaTwBBQYumUez6L3uEYhzTKcIyLQV4Lf03Lx822GuigdeFOvzqjDXL2Kll0ya6LWiKmRLzWb2kpI7679CZWS4Jx3ByR+Jjcfmxd4/vFeTIzapI4nO4Hvc+D6c2WgqyydCqKI+RaMtcxc6Jj9Ft7UXywUWnUZh4BghS0+/bEvUiFKBGvRNr85g5G6h3PUshb7ITyNbNbsQydkjm+kG5D7s1s5ShzN19Qhk7OlUqk4Jd64tbezotigAaGKUfUa+NH5pGAdk5t7x3m635KcFiE/Mdjk3Rwl9wDN0EVXaLtjcoBkhveMgznEn5mrD2AB3yKqyBxH1iUAbT9nGDgVIYtHVSQ5bobqm+uss0EpdorsOCyy+D0F67VuCkvu23aqh8txrS3kAQ+WYsl+dyUTR5HBqDBSqh7RbXIJlsUdOptITIMc761usc11jd+zxXChGbkp8WIhLAYxHRg+u9c2xuUf17a7KNuSmQm7OlyH+MuDje6aP6r2B67ZmbVTEzKrKC0MAgFH5Sn+S4Du/c7iYQtROYRTHFl4hWG8ytV0EmTaX1/olqgu98KTRaGCGZ0mQrnborsCRvUiWxjiylKow6/05IUY38Yf7ZgxMpVqGz57rIP7eotwP0PvmgbKBRsb/fBEDbLpM19HQB1kYGbofrEN0HxfQ6uYx2ecJp86P9QkCyR9cgEODnBK3inOjsxnWNBj7Qx5p5EZkZo/lGF0zFw

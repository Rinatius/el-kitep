KWqTuHPL2ir04MVBzbOTmLzlI3inEqgLN9vPyHYH6KuC+RARZcpUYl0AuuBs3+7wlOTHYBxttTYa81UZalBiWJkonyCHU4XDA//4N5sasraw0jR0Q+ntfArahjHwVEcKwJBDaEK4ii6ABIKJ6rWj0Qgj0hsQAAA=","w":411,"ht":469},{"t":"p","h":"«Мукайдын азыр жарыяланып жүргөн алты аңгемеси, «Кыйын кезең» повести, кыргыз адабият тарыхындагы биринчи автобиографиялык роман «Узак жолу» «Зарыгамдан» «Улуу маршка» чейинки ырлары менен эле өз ордун таап, кыргыз адабиятынын классиктеринин бири катары калайык-калк менен ажырымсыз жашап келатканы, дагы жашай берери өзүнөн өзү түшүнүктүү."},{"t":"p","h":"О. Сооронов"},{"t":"p","h":"Эмгеги турат, өзү жок,"},{"t":"v","l":["Элеси турат, сөзү жок","Элебайдын эркеси,","Элин шаңга бөлөнтүп","Эми бир кайра келсечи!"]},{"t":"p","h":"Ысмайыл"},{"t":"h3","h":"Кайталоо үчүн суроолор:"},{"t":"p","h":"1. М. Элебаев менен буга чейин тааныштыңар бар беле?"},{"t":"p","h":"2. Анын кайсы чыгармаларын окугансыңар?"},{"t":"p","h":"3. Кыргызстанда анын ысымы менен байланышкан эмнелер бар?"},{"t":"p","h":"4. М. Элебаев тууралуу билген маалыматтарды баяндагыла."},{"t":"p","h":"Мукай Элебаев – кыргыз адабиятындагы белгилүү классик жазуучулардын бири. Ал эки доорду – Октябрь революциясынан мурунку жана андан кийинки мезгилди көргөн адам. Анын балалык чагы өтө оор турмушта – жетимчиликте, жетишпеген жашоодо, качып-бозууда өткөн. Жан сактоо үчүн ал кичине кезинен эле кыргыз, орус, дунган, уйгур байларына жалданып кой кайтарат, чочко, каз багат, күрүчтө иштейт. Үркүн маалында качкан эл менен кошо Кытайга барып, ачкачылыкта бир туугандарынан ажырап, иниси экөө гана кайрадан араң кайтып келишет. Анын бул кордуктуу, азаптуу турмушу автобиографиялык «Узак жол» романында чагылдырылган."},{"t":"p","h":"1 Ажырымсыз жашап келатканы – неразрывно живет."},{"t":"p","h":"2 Эмгеги турат, өзү жок – здесь остались труды, но нет его самого"},{"t":"p","h":"3 Жалданып – нанимался"},{"t":"p","h":"<span class=\"pg\" data-n=\"101\">101<\/span>Октябрь революциясынан кийин ал Караколдогу интернаттан кат тааныган. Фрунзедеги педагогикалык техникумунан билим алат. 1924-жылы алгачкы «Зарыгам» деген ыры «Эркин Тоо» газетасына басылып чыгат. Анда окууга жете албай жүргөн Мукайдын эле эмес, бүткүл кыргыз жаштарынын арманы, умтулуусу берилген."},{"t":"v","l":["Көңүлдү койдум абыдан,","Күзөткөн максат жагынан.","Ойлоп келсем окууну","Козголот жүрөк кабынан."]},{"t":"p","h":"Ал эми 1928-жылы жарык көргөн «Биздин жаштар» ырында кечөөкү көчмөн элдин балдары Москва, Ташкен, Алматы ж.б. шаарларда окуп жатканына кубанат. «Узак жол» романы 1936-жылы жарык көргөн. Буга удаалаш эле автор «Кыйын кезең», «Зарлык», «Бороондуу күнү», «Малай артели», «Алыскы тоодон» аңгемелерин жараткан."},{"t":"p","h":"Жазуучу ошондой эле Н. В. Гоголь, Л. Н. Толстой, А. С. Пушкин, С. Маршактардын чыгармаларын которгон. Анын артисттик, драматургдук өнөрү менен таанышсаңар, жазуучу ар тараптуу таланттуу адам болгонунан кабардар болосуңар."},{"t":"p","h":"Силер төмөндө окуй турган «Бороондуу күнү» чыгармасы 1938-жылы жазылган. 1916-жылдардагы Үркүндөн кийинки мезгил сүрөттөлөт. Элдин оор социалдык абалы, жетим-жесирлердин кордуктуу турмушу жана келечектен күдөр үзбөй үмүт менен алга баруу идеясы-чыгарманын негизги лейтмотиви. Силер чыгарманы окуп чыгып, бүгүнкү күн менен салыштырып, эки доордун окшоштук жана айырмачылыгына ой жүгүртүп көргүлө!.."},{"t":"p","h":"1. М. Элебаев жөнүндө жана анын чыгармаларынан окудуңар беле? Ал тууралуу замандаштары эмне дептир? 2. Анын өмүрү кандай өтүптүр? 3. Кандай чыгармаларды жараткан экен?"},{"t":"p","h":"4. Жазуучулуктан башка дагы кандай жөндөм-шыкка ээ экен?"},{"t":"p","h":"5. «Бороондуу күнү» чыгармасы кайсы мезгилди чагылдырыптыр?"},{"t":"v","l":["1 Көчмөн элдин балдары – дети кочевного народа","2 Удаалаш эле – один за другим","3 Ар тараптуу – разнообразный"]},{"t":"p","h":"4 Кордуктуу турмуш – оскорбленная, униженная жизнь 5 Келечектен күдөр үзбөй – не теряя надежды на будущее 6 Салыштырып – сравнивая 7 Замандаштары – современники."},{"t":"p","h":"<span class=\"pg\" data-n=\"102\">102<\/span>1. М. Элебаевдин өмүрү жана чыгармачылыгын окуп чыгып, кайра көркөм айтып бергиле. Төмөнкү сөздөрдү пайдалангыла: классик жазуучу, эки доорду, жетимчиликте, жалданып, Үркүн, Октябрь революциясы, котормочу, таланттуу, үмүт менен алга баруу."},{"t":"p","h":"2. Төмөнкү сөздөр этиштин кайсы мамилелеринде тургандыгын тапкыла жана аларды андан ары уланткыла: Бер – берсе – берсечи – бериш – берил – берин, жалда – жалдан, кел – келсе – келсеңчи – келиш, чагыл, жар, тааныш, барба, үзбө, чалыштыр..."},{"t":"h3","h":"Түшүндүрмө сөздүк"},{"t":"p","h":"Үркүн – переполох, массовое беспорядочное бегство. Так в результате жестокого подавления восстания кыргызов 1916 года они бежали в Китай. Эти трагические события принято называть Үркүн."}],"sub":[{"title":"Кайталоо үчүн суроолор:","b":8}],"pages":[100,102]},{"title":"БОРООНДУУ КҮНҮ","blocks":[{"t":"h3","h":"БОРООНДУУ КҮНҮ"},{"t":"p","h":"Буга көп заман болду."},{"t":"p","h":"Кай жылы экени жадымда жок, январь айынын бир суук күнү жолдо келе жатып, кеч кирип бараткан кезде бир үтүрөйгөн боз үйгө бурулдум. Бул бир кашаттан түшө бериште, сарайчанын жанында жалгыз үй болчу. Күнү бою жөө басып, чарчап, анын үстүнө алдымдан утур карды-бороон болуп кетип, эми мындан ары жүрө турган чама жок эле."},{"t":"p","h":"Үйдүн эки-үч эркеги бар экен. Мен барганда мурунтан согуп отурган аңгемелери бөлүнгөн да жок. Жанындагы кишиге аркасын ыктай отту карап демитип, этегин жамаачылаган көк мата көйнөгү бар, оттун табынан бөрткөн кызыл балтыр, сегиз-тогуз жашар секелек кыз отурат. Ушуга көзү менен мурду жазбай окшогон бир орто жашаган аял казан-аяк жак менен алаксып жүргөн."},{"t":"p","h":"Азыраак отургандан кийин төрдө сүйлөшүп жаткан сөздөрдөн улам кирпидей тикирейген коюу кашы бар, жайык жүз, уюган кара сакалы бул үйдүн кишиси болбосо керек деп болжодум."},{"t":"p","h":"1 Көп заман (көп убакыт) – множество времени, лет (прошло) 2 Жадымда (эсимде) жок – не помню 3 Аркасын ыктай – прижавщись спиной (к кому-либо) 4 Оттун табынан бөрткөн кызыл балтыр – греющая ноги на костре, покрасневшими от тепла костра икрами."},{"t":"p","h":"5 Секелек кыз – девочка, малолетка."},{"t":"img","src":"data:image/webp;base64,UklGRryMAABXRUJQVlA4ILCMAADwKAKdASqAAi4BPrVInEmnJCKhMlS88OAWiWkA2Ps8Clv/I/3b1A/FP1j/Ff3P9zP7f++3tH+M/P/5D+3/5z/yf3v3MMl/ZbqO/Kfwt/a/w/sp/cP+N/iP9V5H/lP63/xf8D/qP2p+QX8V/m3+h/tP+X/Zz30Pof297yjUf9F/2f9L7AvsT9d/83+N/1fskfoedH8D6hH9//4Hr735X/H1Bf+N6Ln+z5z/y7/f/t78DP8v/wLDcAGW37zJz2SAgp0EYK/D7lyockf9Cc6EUfXRn5IjV3BeMLWr2jSMH2Oc+SpQfj4BU1yrf1R12MP5v8NuU9XB+nCQ9P+oIpGfv/ozfkpyf3ZG5DH0drnVFvdQyes/7Fiw7ASfsz+wORbH4j/bmF/WQY3Tf/kGZmA95j90X1pzOdg6hN05qX5/bCfAItPoXZ4Ho6liIMhseOH9sqvC8oyaMoyB5SifcKz5ur96ZigRjFtbJYsmtbx+ti7WhaNmye+4Q1GVhvW8J7Z9eqLwrZoMwmCyWM4lGyo9uefhH+Y4b2cIIsFqzNrLZmuAiQH3ZulXtwPprevBpPMJPfkNWc6B3RYGapXzzcD9rOSCuc/RTemC5l9GJB6EVCyJnfHfGZrMxon/CeFYO45Y7UfRzz/+KsTZ5pCyFBzGJM6AeXeOE0l7ENa/z4SXWhy/m9w041gFQn2P7Wzze9dCh2/7Gp3Pf8srgQBjqLAa4WkYqj6Dy5fqJQVtqWEdhp4d3/2VnEnd7xNCWrcJaMQzNf9Q+/TSVyISv82PKOXGNrXfusCW1vUNPf9Ev3PlgF/Z5NgLnj1s8/8jhAHvGVNqcRR2SDs1nqL0zTabTYCU7lwC12S/cA0/Kz6PzTH/UUw//7E9gbZTlfQPycgy5l/ic2GI2+F7En+Z5UNFbmMI8THBenPbGgDOfTQpIPEuD+ISAjmIiRYgdXPL/+vPljmKf2SGEg28rR8gqY6mvF1sQnQC8ktlf+GDx8lzi2Qnr+O41om+HbOr2bMAR7VY2SPzroCmIop8AAFzyAVY8qDOjBev5jGh02CrgTWIqf7+1s1dT9vc077A6nD7/2zVwFJcpbe36aBWSY0CcK0PXYqBwD/8PVQe0VQF3DHwN2MRb5e8DErKhaZwrSkuonb46fitsFuAh8ASbQPva64Yyp8j3GWv/rt7za8/f//Ybl+4XQS/QjxJKNf/Diqb75N6JH34UV//4t1V7bhP5jX1hPrkcNwMk9w7jQppreK/2hrwBnbY581zwkTXuv7O78Bhd4+aJcssd+nA+OxgRZ5rjxo5y7olpAd0x9VO2/JLt4jhuHGMoi50ChKj3JlAoClFtecihB//XTf/sSD/RuhyhCfgcfWe9ykOnGGUX31pfiPZu7UF8lD5GlTkm6+MJRWmljovAgtw8NRmIGWQzr47ymvpcvxYDJn58obXp7Rq4wbrXbjrJptM/vOf/zo1jKWthm2Uj4/i0uf9Jg4lZcKvC/n+pDE5Enst+Udw99hxzUPc677GeQ36io1Z/rYcxBeZdfzdvc+ul54+GgBPK/zNhr2wNyQkwdDfR/wycchoQLwNasoeYYAKtF5mB8fgp9hH9U5VB7/1PeK4SYbM2T3JMiJjWFmxG2bVvhnhKIHKD4ryZQ74QRGY1sfitf+z7dOCfsYmW4ldLPr9M04VFFeMvEJU3aPSkw1+3VL+aUORSIxcEZwBpbbiGsVjIndHSmrXSK9+uTP5ave/kUAMaQiHpfL+df0Xt4au6QSPtECVxhB6sVfl0Zon4hvJXs1zkqHI00br9BbTgys6HTt7FpXUki mZ9njlawhOca150To/M9rWJ2uiXZD7eILDZonSf5Y6kH0jqOx4aAJrzsZZUJAgFDV0ljowuQukVWFZ81xmfdWkOJ1JrLg0NVh4/4KN9Sp5VpvH06dCLmZqS395HXh0ozWCehOnvbNufxSWsFZL7Acfte+47Al5ghECY58LKsBvvy7nREdM2ZJg/toqAwm/WPVZuLumDPPALNzGvzPmMAAA","w":640,"ht":302},{"t":"p","h":"<span class=\"pg\" data-n=\"103\">103<\/span>Мага назарын салган ушунда бир кемпир болду. Бери болгондо жетимиштин кырындагы киши. Бул экөөбүз ортобуздан тутамдап саман жаккыдай гана жер коюп, катар отурабыз. Отун – ым. Бирде жалбырттап жанып кетсе, бирде жалп этип өчүп, үйдүн ичи күңүрттөй түшөт."},{"t":"p","h":"Кошунам экөөбүз бирөөдөн жашырын сүйлөшүп жаткандай табышыбыз акырын гана чыгат. Төрдөкүлөрдүн бир да жумушу жок. Бая мен келген ченде гана секелек кыздын артында отурган киши:"},{"t":"p","h":"– Алдындагы түйүнчөгүң эмне? – деп, менден бир ооз кеп сураган."},{"t":"p","h":"– Ал дүнүйө дейсиңби, өзүмө жараша бир көр оокат да..."},{"t":"p","h":"Мындан кийин биз жайыбызга калып, алар өз алдынча боло берди. Аңгеменин эмки жагы малай жүргөн бирөөнүн акысы тийбегени жөнүндө болуп жаткан сыяктуу. Сөз баштап отурган кара сакал:"},{"t":"p","h":"– Өзүнөн-өзү жүрүп, капкайда бир кудай урган ишке чырмалып алат..."},{"t":"p","h":"Мындан илгерирээк кулагым чалганы: «Ошол жылы кара чечектен журт чөп чапкандай кырылбадыбы» – деген сөз эле."},{"t":"p","h":"Жанымдагы кемпир мага сүйлөп отурат:"},{"t":"p","h":"...Бечара киши жан багышка орус ичи жакшы болот"},{"t":"p","h":"1 Назарын салган – уделила внимание, обратила внимание, заинтересовалась,"},{"t":"p","h":"2 Көр оокат (буюм-терим) – всякая мелочь по хозяйству."},{"t":"p","h":"<span class=\"pg\" data-n=\"104\">104<\/span>экен. Мына бу дөңдөгү кыштак ошол. Жолдо көргөндүрсүң. Келгенибизге беш-алты жыл болду. Бу жерде бизден бөлөк кыргыз жок."},{"t":"p","h":"Муну таштай берип, баятан болуп жаткан аңгемеге кайра көчтү."},{"t":"p","h":"– Жетимчиликти көп тарткан экенсиң. Тескейге баратам дедиңби?"},{"t":"v","l":["– Ооба.","– Ата-энең качан өлгөн?","– Көп жыл болду."]},{"t":"p","h":"– Кайра ошонуң жакшы, кулунум. Энең байкуш болсо, сен ушинтип жүргөндө: «Балам алда кандай болду экен» – деп, санааркап куурабайт беле?. Акыр өлбөсөң, бир күн жетилип кетерсиң. Түн ичинде көз кургур да көрбөйт. Болбосо тизендин береги жерин бүрүп берет элем. Чокоюң да суу..."},{"t":"h3","h":"СӨЗДҮК"},{"t":"p","h":"кеч кирип бараткан кезде – когда начало темнеть, ближе к вечеру"},{"t":"p","h":"... боз үйгө бурулдум. Эдди үйгө кеч киргенде келди."},{"t":"v","l":["Иңирде шам жагылды.","үтүрөйгөн боз үй – жалкая юрта","Аба ырайы ... турат. Саша ... бала.","жалгыз үй – одинокая юрта","... көрүндү. Кардондо Эркиндики ... эле отурушчу.","кардуу бороон болуп кетип – началась снежная буря","кашат – высокий берег. Кашаттан ... ... көрүндү."]},{"t":"p","h":"көк мата көйнөк – синяя хлопчато-бумажная (сделанная из хлопковой ткани) рубашка. Эркелей көктүк менен кыргыз тилин үйрөнүүдө."},{"t":"p","h":"кирпидей тикирейген коюу кашы – густые, въезрошенные брови төрдөгүлөр – сидевшие на почетном месте (в юрте)"},{"t":"v","l":["... аксакалдар. Кыяз төргө үй жайды.","жетимиштин кырында – под семдесять","Кемпир ... Зарлык он бир, он эки чамасында.","жетимчилик – сиротство","... көп тартыптыр. ... чоңойду.","байкуш – здесь, бедняжка (о женщине)","кара чечек – оспа","... каза болду. Үтүрөйгөн гана ...","","1 Тескей – так называют южную сторону Иссыккуля."]},{"t":"p","h":"2 Кулунум – мой милый (ласк. обр. к молодым, детям). 3 Жетилип кетерсиң – вырастешь, возмужаешь."},{"t":"p","h":"4 Бүрүп берет элем – залатала бы, сшила бы."},{"t":"p","h":"<span class=\"pg\" data-n=\"105\">105<\/span>1. Жазуучунун өмүр баянын айтып бергиле. 2. Аңгемеде сүрөттөлгөн окуя качан, кайсы жерде болгон? 3. Ал мезгил тууралуу кандай тарыхый окуяларды билесиңер? 4. Чыгармадан силерге тааныш эмес кандай сөздөрдү байкадыңар? 5. Бала кимдерге туш келди жана алардын ар бири кандай таасир калтырды? 6. Мында балага назарын салып, кепке тарткан ким болду?"},{"t":"p","h":"1. Төмөнкү сөздөрдү сөз түркүмдөрүнө ажыраткыла жана мугалимдин жардамы менен маанисин чечмелегиле: жолдо келе жатып, сарайчанын жанында, чама жок, эки-үч эркек, бөрткөн, казан-аяк, тутамдап саман жаккыдай, табыш, чөп чапкандай, санааркап."},{"t":"p","h":"2. Боз үйдү тарткыла, анда төмөнкү нерселерди өз-өз ордунда көрсөткүлө: коломто, чамгарак, керки, тердик, тезек, үзүк, уук, жүк, талпак, төр, чыгдан."},{"t":"p","h":"3. Койдун мүчөлөрүн ирети менен санап көнгүлө. Орусчага которгула, төмөнкү схеманы толтургула."},{"t":"p","h":"1. Баш. 2. Моюн. 3. Арка-омуртка. 4. Далы. 5. Каржилик. 6. Күң жилик. 7. Төш. 8. Кабырга. 9. Жамбаш."},{"t":"p","h":"10. Жотожилик. 11. Кашкажилик. 12. Куйрук."},{"t":"p","h":"Баш – Голова"},{"t":"p","h":"Моюн – Шея"},{"t":"h3","h":"II"},{"t":"p","h":"...Эшиктин ар кай жеринен зыркыраган борошо так менин тонумдун жыртыгын көздөп тургандай коолдоп, бир капталым муздап отурду."},{"t":"p","h":"Конор-конбосум али ачылган жок. Үй тар, адамы көп. Балким, мына бу казандагы тамак ичилгенден кийин, бирөө: «Чырагым, эми жайды көрүп турасың», – дей турганын ким билди. Мага келгенден ыкласын салып отурган кемпирдин колунда бийлик жогун адегенде эле байкагам. Айтор, не болсо да, бул жагынан капарында жок кишидей отура бердим. Анткени мындайды бүгүн эле көрүп отурган жан эмесмин да!"},{"t":"p","h":"– Бул да бир күн унут болор, балам. Көргөн-билген баары тең артта калмак... Мал да, дүйнө да эч кимге опо болбойт."},{"t":"p","h":"1 Коолдоп – продувало."},{"t":"p","h":"2 Ыкласын салып отурган (көңүлүн буруп) – отнеслась с вниманием, по доброму."},{"t":"p","h":"3 Капарында жок (оюнда жок) кишидей – как будто невдомек."},{"t":"p","h":"<span class=\"pg\" data-n=\"106\">106<\/span>Ушундан кийин көпкөк тарамыштары саналып турган калтыраган этсиз арык колундагы жыгач менен отту көсөп жиберип, ошол жерге мелтирей кадалып, тынып ойлоно калып, кадалган ойдун артынан козголуп коюп, куураган чачынын арасына кол жүгүртүп, кежиге ченин кашып алды да, мага шыбырачу немедей, жакындай түшүп, акырын гана:"},{"t":"p","h":"– Бөрк алдында не болбойт. Дос, душманды айрып жүр. Колундан келип турганда бөйпөңдөп, бак тийган күнү, баса берген киши дос болбойт. Жок – барда бирдей болуш керек, – деди."},{"t":"p","h":"Түн бир далай мезгил болгон сыяктуу. Казан чыгарылды. Самандын ачуу түтүнү чамгарактан чыкпай уюлгуп, кайра каптап турат."},{"t":"p","h":"Табак төрдөгү эркектерге гана тартылды. Мага бир арканын омурткасы тийген. Үйдүн аялы өзүнө алып калган бирдемесин жулкуп жеп, күйпөңдөп казандын жанында каралап отурат."},{"t":"p","h":"– Отту жарыгыраак кылып койгулачы – деп, бирөө чулчуңдап чайнап жатып, эшик жактагы кемпир экөөбүзгө карай буйрук кылды."},{"t":"p","h":"Бул арада мындан башка унчуккан киши болгон жок. Жалгыз секелек кыз колундагы каржиликти чагам деп, убараланып жатканда:"},{"t":"p","h":"– Сый чабасың, кой! – деп ачууланып барып, энеси керкини колунан алып койду."},{"t":"p","h":"Мен жалгыз омуртканы мүлжүп, таштай берип, карап калганым менен табактын эти да көп эмес эле. Туш-туштан жабылган ооздор табактын үрөйүн учуруп, бир демге калтырбай отоп жиберишти."},{"t":"p","h":"Кол жууп, бир кыйла кобурагансып отургандан кийин, журт орундарынан туруп, жатууга кам ура баштады. Сыртка чыгып бараткан бирөө, шимшилеп кирип келген кара канчыкты: «Кет!» деп, жаза-буза бир сала, жолунда кыйрайып турган эргилчекти түзөп коюп, кыңшылаган ит менен удаа чыгып кетти."},{"t":"v","l":["1 Кежиге ченин – затылок","2 Бөрк (тебетей) алдында – под головным убором","3 Арканын омурткасы – позвоночник","4 Күйпөңдөп – суетясь","5 Чулчуңдап чайнап – жевал"]},{"t":"p","h":"<span class=\"pg\" data-n=\"107\">107<\/span>Кемпир болбогондо мен унутулуп кала жаздаган элем..."},{"t":"p","h":"– Э, ботом Жийдекан, бу бала эмне болот? – деди бир кезде ал."},{"t":"p","h":"– Апей катыгүн, мен..."},{"t":"p","h":"Бул убакта кара сакал, дагы бир жигит жатып алган."},{"t":"p","h":"– Жеңеке, бүгүнчө мени батыргыла. Мындан бөлөк корголор жерим жок болгондуктан, келип олтурам. Наяты бир түнөп кетет экенмин, – деп, мен да кемпирге кошумчалап койдум."},{"t":"p","h":"– Эми кандай кыламын? Төшөктүн баары салынып,..."},{"t":"p","h":"– Баягы тердик кана?"},{"t":"p","h":"– Мунун жообу бар экен."},{"t":"p","h":"– Аны башка жаздап койбодум беле. Жатарга чоло жер да калбаптыр."},{"t":"p","h":"– Иши кылып бирдеме бер."},{"t":"p","h":"– Болсо мен аяп олтурамбы? Жүк тирелип тургандай сүйлөйсүңөр да! – деп, бу жерге келгенде, кемпирди бир каарып өттү."},{"t":"p","h":"Төшөнчү, жаздыктын сыягын өзүм да көрүп турам... Ошентип туруп, Жийдекан бир кезде жаалап жиберген далдалчылардын сүрөөнү менен арзан сатылып бараткан малына кейиген кишиче, кынжылып барып эңкейип, канжыгадай самсаалаган тердикти сууруп алганда, төшөгүнүн башы жапырайып калды."},{"t":"p","h":"– Ушул эле болот мага, – деп ирегеде жаткан бир кап тезектин жанына тердикти жая салдым. Жаздыгым ошол боло турган. Бут сунар жер жок. Жанымда коломто."},{"t":"p","h":"Жатканымдан кийин талпакты сүйрөп келип, үстүмө таштап койду да, кемпир:"},{"t":"p","h":"– Эртең бороон бастаганда кет. Жолдо куруп каларсын, – деди күңкүлдөп."},{"t":"p","h":"От өчтү. Үй жер кепедей караңгы. Жымжырт. Жалгыз гана тыштан улуган бороондун күчү менен илдибары кеткен жаман үзүк делпилдеп, уукту сабап турду..."},{"t":"v","l":["1 Наяты (арысы)- максимум, не более","2 Чоло жер калбаптыр – не осталось свободного места","3 Бир каарып өттү – излила свой гнев","4 Далдалчылардын (арачылардын) – посредников.","5 Күңкүлдөп – что-то не внятно бормотала."]},{"t":"p","h":"6 Илдибары кеткен (жыртылып бүткөн) – рваный, изодранный, старый."},{"t":"p","h":"<span class=\"pg\" data-n=\"108\">108<\/span>Эртеси бул үйдөн бир адам серпиле электе туруп алып, жолго түштүм. Мунумду кечээги мээримдүү кемпир да билбей калды. Аны кетерде бир байкаганымда – колу, буту мышыктыкындай чогулуп, уйпаланган, жүдөгөн башы койнуна кирип, мууздалган малдай кыркырап жаткан эле."},{"t":"p","h":"Тышка чыксам бороон басаңча тартып калыптыр. Бирок күн али бүркөө."},{"t":"p","h":"Кантсе да кечке жетермин деп ишенип, тээтиги көк тиреген мунарага окшогон, ак каардуу бийик заңгелди бет алып, жалгыз талаада кетип бара жаттым."},{"t":"p","h":"Бүгүн карасам, ошондон бери баскан сансыз жол бүлбүлдөп алда кайда калган! Ырас, буга таң кала турган эчтеме да жок, анткени ошол кездерде эрксиз заманда кечирген өмүрүмдүн бул бир гана күнкүсү го!.."},{"t":"h3","h":"СӨЗДҮК"},{"t":"v","l":["чырагым ласк. обр. – светик мой","... кимдин баласысың?","... балбылдап жанды."]},{"t":"p","h":"тарамыштары саналып – сухожилия (ее) проступали так, что их можно было сосчитать"},{"t":"v","l":["куураган чачы – засохшие волосы","Дарактай ... турмуш ай! Көпкө топурак чачпа, ...","Боря Айсулууга суу...","шыбырачу немедей – сделав вид, будто шепчет","Ванянын ... угулду.","бак тайган күнү— когда постигнет неудача","... баса берүү осолдук. Мектепте бак тиктик.","жулкуп жеп – здесь жадно кушая"]},{"t":"p","h":"Этти ... жатты. Ат чылбырын ... алды. Эмгекти ... кетпейби. бир демге калтырбай (бир заматта) – в один миг, быстро"},{"t":"v","l":["Этти жеп жибердик. Күн ... бүркөлдү.","кобурагансып – будто бормотал","жаза-буза бир салып – ударив на обух","жук тирелип тургандай – как будто полно одеяла","кынжылып барып эңкейип – неохотно наклонилась","талпак – высушенная шкура для подстилки","улуган бороон – завывающийся ветер","Карышкыр ... Шамал ..."]},{"t":"p","h":"адам серпиле электе (тура электе) – пока люди не проснулись мууздалган малдай кыркырап – хрипела как скот с перерезанным горлом бийик заңгел – высокая скала"},{"t":"h3","h":"<span class=\"pg\" data-n=\"109\">109<\/span>ТҮШҮНДҮРМӨ СӨЗДҮК"},{"t":"p","h":"мата – хлопчатобумажная ткань кустарного производства. кара чечек – оспа, люди иносказательно эту болезнь называли улуу тумоо, чоң жарыктык, баягы жарыктык и т.д."},{"t":"p","h":"бөрк (башкийим, тебетей) – мужской национальный головной убор."},{"t":"p","h":"чамгарак (тундук)-гнутые палочки вставляемые крест-накрест и завершающие деревянный остов юрты."},{"t":"p","h":"каржилик (каруу жилик)- лучевая кость, эргилчек – лестничная дверь юрты, в виде лесенки с поперечными перекладинами, зановешивалось снаружи."},{"t":"v","l":["тердик – потник.","канжыга – торока, прикрепляемые сзади седла,"]},{"t":"p","h":"үзүк – кошма, закрывающая верх юрты, их две – передняя и задняя. уук – унина, жердь купола юрты."},{"t":"p","h":"1. Чыгарманы окуп чыккандан кийин кайсыл мезгил көз алдыңарга тартылды? 2. Кемпир менен баланын ортосунда кандай диалог жүрдү? 3. Үйдөгү кечки тамак ичүү кандай өттү? 4. Төшөк саларда кандай окуя болуп өттү? 5. Жийдекан ким экен? 6. Эртең менен бала кайда сапар алды? 7. Кемпир жөнүндө кандай ой калды?.."},{"t":"p","h":"1. Аңгемедеги сүрөттөлгөн каармандардын мүнөздөрү, жүрүш-туруштары, жаш өзгөчөлүктөрү кандай экен? Портреттерин оозеки баяндагыла."},{"t":"p","h":"2. Окуяны баяндап жаткан каарманды жашы, мүнөзү, бой келбети менен кандай элестеттиңер?"},{"t":"p","h":"3. Чыгармага сүрөттүн тили менен ат коюуга болобу? Маселен, «Үркүндүн портрети», «Жаман алачыктагы чоң турмуш» ж.б. Силер да аңгемеге ылайык келген ат коюуга аракеттенгиле."},{"t":"p","h":"4. Төмөнкү схеманы толтургула. Анда аталган каармандардын жүрүш-турушу, мүнөздөрү, көрүнүштөрү боюнча чагылдырылсын, башкача айтканда, портреттери түзүлгөндөй болсун."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>Жетимиш-<\/td><td>Орто<\/td><td>Сегиз-тогуз Кирпидей<\/td><\/tr><tr><td>тин<\/td><td>жашап<\/td><td>жашар,<\/td><td>тикирей-<\/td><\/tr><tr><td>кырында,<\/td><td>калган,<\/td><td>...<\/td><td>ген коюу<\/td><\/tr><tr><td>кашы бар,<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"5. Чыгарманы ролдорго бөлүштүрүп окугула."},{"t":"p","h":"6. Төмөнкү сөздөрдү катыштырып сүйлөм түзгүлө жана аларды орус тилине которгула: күңүрттөй, жалп, акырын гана, кудай урган ишке, чөп чапкандай. Булар кайсы сөз түркүмү экендигин аныктагыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"110\">110<\/span>7. Төмөнкү сүйлөмдөрдү окуп чыгып, кара тамга менен берилген сөздөрдү орус тилине которгула."},{"t":"p","h":"Кошунам экөөбүз бирөөдөн жашырын сүйлөшүп жаткансып, табышыбыз акырын гана чыгат. Ушундан кийин көпкөк тарамыштары саналып турган этсиз арык колундагы жыгач менен отту көсөп жиберип, ошол жерге мелтирей кадалып, тынып ойлоно калып, куураган чачынын арасына кол жүгүртө, кежиге ченин кашып алды. Колу-буту мышыктыкындай чогулуп, уйпаланган, жүдөгөн башы койнуна кирип, мууздалган малдай кыркырап жаткан эле."},{"t":"p","h":"8. Чыгармадагы төмөнкү көркөм тропторду дептериңерге көчүрүп алгыла жана жаттагыла. Буларды өз ара сүйлөшкөнүңөрдө кебиңерде колдонууга аракеттенгиле."},{"t":"p","h":"а) салыштыруу: кирпидей, мууздалган малдай, чөп чапкандай, канжыгадай, жер кепедей..."},{"t":"p","h":"б) метафора: секелек кыз, үтүрөйгөн боз үй, мээримдүү кемпир..."},{"t":"p","h":"в) метонимия: табак – эт деген мааниде колдонулду;"},{"t":"p","h":"журт – аңгемеде боз үйдөгү адамдарды жалпылап колдонулду;..."},{"t":"p","h":"г) синекдоха: сөз баштап отурган кара сакал – сөз баштап отурган адам дегендин ордуна колдонулду ж.б."},{"t":"p","h":"Чыгармадан мындай көркөм сөз каражаттарын дагы тапкыла."},{"t":"p","h":"9. Аңгемедеги төмөнкү сүйлөмдөрдү кырааты менен көркөм окуп, интонация, басым түшкөн сөздөрдү белгилегиле. Кимдин кеби жана кандай мааниде айтылып жаткандыгын чечмелегиле. Кайра ошонуң жакшы, кулунум! Энең байкуш болсо, сен ушинтип жүргөндө «балам алда кандай болду экен!» – деп санааркап куурабайт беле. ... Акыры өлбөсөң, бир күнү жетилип кетесиң."},{"t":"p","h":"Бөрк алдында не болбойт. Дос – душманды айрып жүр. Колунан келип турганда бөйпөңдөп, бак тайган күнү баса берген киши дос болбойт."},{"t":"p","h":"«Жок – барда бирдей болуш керек!»"},{"t":"h3","h":"Макалдарды эсиңерге түйгүлө!"},{"t":"v","l":["Бирде жигит жөө жүрөт,","Бирде жигит төө минет.","Ач кадырын ток билбейт.","Жолоочунун жолдогусу жакшы,","Жолдо болбосо, үйдөгүсү жакшы."]},{"t":"p","h":"10. Этиштин буйрук, ниет, шарттуу ыңгайларын эске түшүргүлө. Чыгармадан аларга мисалдарды тапкыла."},{"t":"p","h":"Үлгүсү: Дос, душманды айрып жүр. Сый чабасың, кой! (буйрук ыңгай). Элин шаңга бөлөнтүп, Эми бир кайра келсечи (ниет ыңгай). Бала түнөмөкчү болсо, эл көп экен (шарттуу ыңгай). ..."}],"sub":[{"title":"ТҮШҮНДҮРМӨ СӨЗДҮК","b":87}],"pages":[103,110]},{"title":"ЧЫҢГЫЗ АЙТМАТОВ (1928-жылы туулган)","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"111\">111<\/span>ЧЫҢГЫЗ АЙТМАТОВ (1928-жылы туулган)"},{"t":"p","h":"Алп таланттуу экөө болсо дүйнөдө, Анда Чыкем ал экөөнүн бирөөсү."},{"t":"img","src":"data:image/webp;base64,UklGRtoTAABXRUJQVlA4IM4TAABQ4ACdASqaAagBPrVSoEsnLLSvLhOZ+pAWiWluaxduCJUp8iPp+gAzv6PyIk0sFBxtPO9JESFtMi7Y/5h//f0h/Ef+TXU5oh9WHJLurKavEglct0AUM0r7Mp98CbWLbSwGJ6O06EDre+0Gg5Hm1i20sBieo15SHA6HYXuLOFE9P72NfRD0mEfvHO9M6ctqoQFymXKndm62dY6r+bHh9rVLNuhsqrU1d2Rdm7meVe7oA3+XaREYXkSapwpLEeX/2mO70Km43QxhF046IvZRbJ4OlpnRnnce6Wv0+uqk3DP9K5TwrJ1uzhv7kYrVLgho9uF8jhUz5ArB0G7IhmrdQsOqjnBS1ArOMKBcspotutYrm7Rr3CWK3U8pMHhrz3VLz+PHfesAtsX+V/JtyhV/5xhzFGzKKGyLmTGCWE7Nth1xKcDoPSwtlHLPokQqCnVPJrZsQ39qXBNNJcUlyhv22ePOh5CQVFe02Y4qKoKHkGows6AYU7RefnoKAA0cCCCy3/XH8CkE8n5V2oi/nD1LsOo0RXJn9FGHYTHsvwUZM9o9kShQWooLSp+4p/SXOScfz/5csZyuBL40TEYJpy987whU0zKWUSeYW1h0TB2lgo4cwZoNhyoymnZjfA8JAyUQstsXt62gcutbqMTeMx9XpMsQmcM7r9xc0LJaTqkGsHBcwurrBDFfify3IhIslW5PnOz/+gHCUt4+2Dpeq6PFJHvcWaQn1pUR9oli0DRfKpA7r1/lNx01YgfdE8x8erz0Rg3yroGRXxxWkGS7i7y72vE6AX+yjYmGe85LT/lCND7i8jJP/CHo1lNxepgGsK3fPyGoie+sGwOleb2YKf3N1DZ5JYh7/dhk7dFWr72ZNcmsAaBNHB3IajtjXmzB/jYMa4Z+Ck+PmYktucQDCyTXQBsdOEro0X9YGf5AmX6vU2A2nGrB4CpuQrLaldOk3dhaLGXL6qZcs6H2tNBRbLp3XdbyrNIf3RtzI3Y0hAByj+TnjBd4K/LLzKTStYeRiFqe4ZahZxVvHh1etrm0F3tPW6h2zBocREPsYaPCCuSizDRdK1has4zS/Csuzpa/CjA9UgOtCv+iJfreB4cztBiuPwnUAaGdv4bXMsh8aNcEmYi0M2pJ7uYQUu82QceCemv/BqeLWWB+Pici5c7t8+8IyiTPf+X35fNKT9IHhVDjvWZzv8d4FTRKfnUyw6nlgY+m0q8SLhCqeK3XoWBTWAnhJOKQ0prp7tF8Ag8QfJkTIpYOoN0/eBMUpBj19FLSolAN8Z2abQr4OpPq6tTl3PrFUzHMP4nGVPR7iEnP7yG/Zuy1EIuHJDn9wzs9RmRncluF8gjuDIKLlxY23of9WoCn8POF355zGykBXQCO777/kCUqXMQFK6qurb5m4bBh/7t27JroKDaqSb4my0hleuG1vQ+8XrlHR0dUAER58ehlumC8oU0ftU1iYrqWP/d/mciLteSJpXOCRWXEy3Cksp6+C . «Мен тоонун кулунумун!» дейт автор. Ал жакта менин балалыгым, ата-энем, туугандарым, өткөн жакшы күндөрүм жатат. Мен чыгармаларыма ошол тоолордун арасынан сюжет табам. Менин каармандарым тоо арасындагы карапайым баатыр эл, күлүк аттары, данга толгон өрөөндөрү, кайнаган турмушу ж.б....»"},{"t":"p","h":"Жазуучунун чыгармалары тоодон чыгып бүтүн дүйнөнү аралап кетти. Анын «Ботогөз булак», «Түнкү сугат», «Ак жаан» аңгемелери, «Жамыйла», «Бетме-бет», «Делбирим», «Гүлсарат» ж.б. повесттери, «Кылым карытар бир күн», «Кыямат», «Кассандранын эн тамгасы» романдары, «Жар боюнда жашын төккөн аңчынын ыйы» ой толгоолору ж.б. көптөгөн чыгармалары бар. Алар Кыргызстандан Америкага чейин, Индиядан Польшага чейин таралып кетти."},{"t":"p","h":"1 Таанымал – известный"},{"t":"v","l":["2 Набыт болгон (курман болгон) – погибших","3 Бейкүнөө (күнөөсүз) – не виновные","4 Тоонун кулунумун – я сын гор."]},{"t":"p","h":"<span class=\"pg\" data-n=\"112\">112<\/span>Жер шарынын көп адамдары жазуучунун чыгармаларын сүйүп окушат. Анткени жазуучунун Толгонай, Танабай, Эдигей, Авдий, Оливер Өрдөк сыяктуу каармандарынын турмуш жолдору бардык адамдар үчүн бирдей түшүнүктүү. Элдер бул адамдардан өзүлөрүнүн турмуш жолдорун көрүшөт."},{"t":"p","h":"Чыңгыз Айтматов ошондой эле коомдук ишмер катары да дүйнөлүк мааниси бар иштерге аралашып, ааламдагы тынчтык, элдердин достугу, үчүн баалуу салымын кошту. «Ысыккөл шеринесин» уюштуруп (1986), дүйнөдөгү чыгармачыл адамдардын башын бириктирди. Учурда эгемендүү Кыргызстандын Батыш Европа өлкөлөрү боюнча элчилик кызматын аткарып, мамлекеттин тышкы саясатында маанилүү иш жасап келе жатат. Ошол эле кезде Кыргызстандын ички коомдук-саясий турмушуна да активдүү аралашууда."},{"t":"p","h":"Ал – Социалисттик Эмгектин Баатыры, Лениндик жана Мамлекеттик сыйлыктын лауреаты, Кыргызстандын эл жазуучусу. Ошондой эле Париждеги Адабият жана искусство боюнча Европа академиясынын анык мүчөсү. Жазуучуга эгемен Кыргызстандын эң жогорку сыйлыгы – Кыргыз Эл Баатыры деген наам ыйгарылды. Жазуучу азыр да чыгармачылыктын үстүндө күрдөөлдүү иштөөдө."}],"sub":[],"pages":[111,112]},{"title":"КЫРГЫЗСТАНДАГЫ АЛГАЧКЫ МУГАЛИМ","blocks":[{"t":"h3","h":"КЫРГЫЗСТАНДАГЫ АЛГАЧКЫ МУГАЛИМ"},{"t":"p","h":"1930-жылы Кыргызстанга чех жазуучусу Юлиус Фучик келет. Ал Фрунзе шаарында (азыркы Бишкек) Тяньшань өрөөнүндө иштеген мугалим менен жолугуп калат. Мугалим айылда окутуунун айрым тартиптерин унутуп калгандыктан, мектепти жаап, кеңеш суроо үчүн шаарга келген экен. Эки жүздөн ашуун чакырым аралыкты ат менен басып өтөт. Шаардан окуп, билимин өркүндөтүп, эки айдан кийин кетип баратканда жолдон басмачылар кармап алып, өлтүрүп коюшат."},{"t":"v","l":["1 Жер шарынын – здесь земли, земного шара","2 Элчилик кызмат аткарып – работая послом","3 Ошол эле кезде – в то же время"]},{"t":"p","h":"<span class=\"pg\" data-n=\"113\">113<\/span>Ошентип, Кыргызстанда ал кезде биринчи мугалимдердин көпчүлүгү чала сабаттуу болушкан. Ал кезде кат тааныган, жаза жана окуй алган кызыл аскерлер, жумушчулар деле партиянын буйругу менен айыл-кыштактарга мугалим катары жөнөтүлгөн."},{"t":"p","h":"Мына ошондой мугалимдердин бири тууралуу Ч. Айтматов «Биринчи мугалим» повестин жазат. Анын каарманы комсомол, батрактын уулу Дүйшөн эле..."},{"t":"p","h":"(Ч.Айтматов жөнүндөгү очерктен алынды)"},{"t":"h3","h":"СӨЗДҮК"},{"t":"p","h":"күн жаркырап тийген терезеден – из окна, в которое падали яркие лучи солнца репрессиянын курмандыгы – жертва репрессии"},{"t":"p","h":"Төрөкул репрессиянын курмандыгы болду. Полинанын чоң атасы согушта курман болгон."},{"t":"p","h":"данга толгон өрөөндөрү – благодатные зерном долины турмуш жолдорун көрүшөт – увидят свой жизненный путь"},{"t":"p","h":"Алар өзүлөрүнүн турмуш жолдорун көрүшөт."},{"t":"v","l":["Ар кимдин өзүнүн турмуш жолу бар.","коомдук ишмер катары – как общественный деятель"]},{"t":"p","h":"Айтматовду замандаштары коомдук ишмер катары билишет. чыгармачыл адамдардын башын бириктирди – объединил всех творческих людей"},{"t":"v","l":["Азамат ... окуучу. Дастан элдин ...","тышкы саясат – внешняя политика","ички саясат – внутренная политика"]},{"t":"p","h":"Жазуучу Кыргызстандын ... жана активдүү катышат. күрдөөлдүү иштөөдө – плодотворно работает"},{"t":"p","h":"Жазуучу азыр да күрдөөлдүү иштөөдө. Айбек күрдөөлдүү жигит. мектепти жаап – закрыв школу Мектепти жаап, Бишкекке жол тартат. Кароолчу мектепти жаап, үйүнө кетти."},{"t":"p","h":"билимин өркүндөтүп – повышая уровень своего образования"},{"t":"p","h":"Билимин өркүндөткөнү келген."},{"t":"p","h":"Ринаттын байкеси чет өлкөдөн билимин жогорулатканы кетти."},{"t":"h3","h":"ТҮШҮНДҮРМӨ СӨЗДҮК"},{"t":"p","h":"шерине (шерне) – (этн.) круг близких людей каждый из которых по очереди организовывает угощения и т. д."},{"t":"p","h":"«Ысыккөл» шеринеси (форуму) – 1986-жылы уюшулган. Демилгечиси – Ч.Айтматов. Дүйнөнүн алдыңкы окумуштуу-интеллигенттерин, чыгармачыл адамдардын башын кошкон формалдуу эмес эл аралык бирикме. Форумдун мүчөлөрү ар кайсы мезгилде жолугушуп, коомдук чоң түйүндүү маселелерди талкуулап турушат."},{"t":"p","h":"<span class=\"pg\" data-n=\"114\">114<\/span>репрессия – куугунтуктоо, Советтер Союзунда, анын ичинде Кыргызстанда 1930-1940-жылдары элдин алдыңкы сабында турган интеллигенттер куугунтукталышкан."},{"t":"p","h":"Кыргыз Эл Баатыры – Народный Герой Кыргызстана. Кыргыз Республикасында эмгекте, Атамекенди коргоодо өтө айырмаланган атуулдарга ыйгарылуучу ардак наам."},{"t":"p","h":"Басмачылар – Орто Азияда Совет бийлигинин орнотулушуна жана анын чыңалышына каршы чыккан куралдуу кыймыл."},{"t":"p","h":"1. Ч. Айтматов тууралуу буга чейин кандай маалыматтарды билчү элеңер? 2. Ал жөнүндө белгилүү чыгармачыл адамдардын эскерүүлөрүнөн, ой-пикирлеринен билесиңерби? 3. Жазуучу тууралуу кандай даректүү фильмдер бар? 4. Анын чыгармаларына сүрөттөрдү кайсы сүрөтчүлөр тартышкан? 5. Тарыхый булактарда Кыргызстандагы алгачкы мектептер, биринчи мугалимдер тууралуу кандай айтылат? 6. Ю. Фучик ким болгон жана ал алгачкы мугалим жөнүндө кандай эскерет? Шилтемеде, сөздүктө жана түшүндүрмө сөздүктө берилген сөздөрдү жообуңарга жардамчы, таяныч материал катары колдонгула!.."}],"sub":[{"title":"ТҮШҮНДҮРМӨ СӨЗДҮК","b":19}],"pages":[113,114]},{"title":"«Биринчи мугалим» Мугалим Дүйшөн","blocks":[{"t":"h3","h":"«Биринчи мугалим» Мугалим Дүйшөн"},{"t":"p","h":"Күркүрөө айлына жаңы мектеп курулду. Анын ачылышына айылдын жашоочулары атактуу жердеши академик Алтынай Сулайманованы чакырышат. Ал көп жылдар мурда шаарга кеткен. Азыр А. Сулайманова чоң окумуштуу, академияда иштейт, университетте лекция окуйт. Кээде чет өлкөгө барат, коомдук ишмер..."},{"t":"p","h":"Алтынай бул салтанатта ардактуу орунга отурду. Чыгып сүйлөгөндөрдү укту. Анан өзү окуган мектеп жана анын биринчи мугалими Дүйшөн жөнүндө эскерди. Ал бул адам жөнүндө жаш муундар билишин каалады. Ошентип Алтынай Сулайманова буларды айтып берди:"},{"t":"p","h":"Бул иш 1924-жылы болгон. Ошол жылы күздө Күркүрөө айлына мен башта көрбөгөн аскер шинель жана шлем кийген чоочун жигит келди. Бул Таштанбек кедейдин уулу Дүйшөн деген экен. Ал айылга мектеп ачып, бала окутат экен дешти."},{"t":"p","h":"1 Мектептин ачылышы – день торжественного открытия школы."},{"t":"p","h":"2 Жердеш – здесь: землячка 3 Кедейдин уулу – сын бедняка."}],"sub":[],"pages":[114,114]},{"title":"Мектептин кереги эмне?","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"115\">115<\/span>Мектептин кереги эмне?"},{"t":"p","h":"Айыл ортосундагы дөбөчөгө эл жыйналып келсин деген кабар айтылып калды. Элдин баары дөбөгө агылышты."},{"t":"p","h":"Топтун ортосунда көөнө кара шинель кийген бажырайган кубакай жигит сүйлөп жаткан экен."},{"t":"p","h":"– Эй балам,- деди ээрде кыйшая отурган атчандардын бири.— Бу сенин ата-тегинди го билебиз, бизге окшогон кара таман. Анан сен кайдан жүрүп молдо болуп алгансың."},{"t":"p","h":"– Мен молдо эмесмин аксакал, мен комсомолмун, – деди Дүйшөн. – Мен аскерде жүрүп кат таанып келдим. Менин молдолук жайым ошондой."},{"t":"v","l":["– А-а бали де.","– Аның жөн экен – демиш болушту."]},{"t":"p","h":"– Эмесе комсомол мени мугалимдикке дайындап, бала окуткун деп жиберди. Мектепти силердин жардамыңар менен тээ төбөдө турган ээн жаман тамды оңдоп, ачалы деген такилип бар."},{"t":"p","h":"Эл унчукпай калышты. Баятан унчукпай турган Сатымкул кераяк чырт түкүрүнүп сүйлөп койду:"},{"t":"p","h":"– Аныңды кое тур, окууңдун бизге кереги эмне?"},{"t":"p","h":"– Баса, туура айтат! – деп бержактагылар да жабыла, гүүлдөп козголо беришти. – Биз жер кетмендеп, жер менен эле оокат кылган дыйканбыз. А биздин балдар окуу окуп, эл сурап, өкмөт болот беле?!.. Кой, айланайын, башыбызды катырба."},{"t":"p","h":"Дүйшөн элди айландыра карап:"},{"t":"p","h":"– Силер балдарды окутууга каршысыңарбы? – деп сурады."},{"t":"p","h":"– А каршы болгонду сен зордойсуңбу? Азыр элдин өз эрки, боштондукка чыкканбыз! – деди нары жактан бир үн."},{"t":"p","h":"Шинелинин илгичтерин жула бере жаздап, Дүйшөн төш чөнтөгүнүн ичинен төрт бүктөлгөн кагазды сууруп чыкты да, аны жогору көрсөтө кармай кыйкырды:"},{"t":"p","h":"– Силерге жер, суу бөлүп берген Кеңеш өкмөтүнүн бала окутсун деп мөөрүн баскан ушул кагазына каршы чыгасыңарбы?! Кана, Кеңеш өкмөтүнүн мыйзамына ким каршы, ким?! – деп ачуулана кыйкырганда, эч ким унчукпай, баары тең тымтырс болушту."},{"t":"p","h":"1 Дөбөгө (дөбө, дөңсө) – на холме"},{"t":"v","l":["2 Ата-тегинди – твоё социальное происхождение","3 Кара таман (метаф) – бедняк","4 Такилип (ниет, пикир) бар – есть предложение.","5 Кераяк – упрямый.","6 Мөөрүн (мөөр) – печать"]},{"t":"p","h":"<span class=\"pg\" data-n=\"116\">116<\/span>– Силер кедейсиңер, – деди Дүйшөн чарчагандай үнүн басандата сүйлөп. – Биз өмүр бою эзилип, тепсенди болуп келген элбиз. Өкүмөт бизди эми көзү ачылсын, кат таанып, билимге жетишсин деп жатат. Мына ошондуктан балдарды окутушубуз керек!.."}],"sub":[],"pages":[115,116]},{"title":"Дүйшөн мектепти окууга даярдай баштады","blocks":[{"t":"h3","h":"Дүйшөн мектепти окууга даярдай баштады"},{"t":"p","h":"Эртеси күнү сууга барган жерибизден кетмен, күрөк, балта көтөргөн Дүйшөндүн суудан кечип өтүп, жогору дөбөдө турган жаман тамды көздөй кеткенин көрүп калдык. Ушундан баштап күнүгө эртең менен көөнө кара шинелчен Дүйшөндүн карааны өйдө бир өтүп, күн батарда ылдый бир өтүп турду. Кээде чоң таңгак саман же куурай көтөрүп ташып жатты. Аны көргөндөр, айылда туруп, бул ким болду экен дегенчелик кылып, үзөнгүгө такандай калып, алакан алдынан көз жүгүртүп, кеп кылышар эле:"},{"t":"p","h":"– Ой, алдагы жолдо отун көтөргөн Дүйшөн – мугалим эмеспи?"},{"t":"p","h":"– Ооба, так ошол."},{"t":"p","h":"– А-а бечара, мугалим деген кызматың деле жыргаган жумуш эмес экен го!.."},{"t":"h3","h":"СӨЗДҮК"},{"t":"p","h":"атактуу (белгилүү) – знаменитый"},{"t":"p","h":"Алтынай Сулайманова атактуу окумуштуу болгон. Ч. Айтматов – белгилүү жазуучу."},{"t":"p","h":"ардактуу орун – почетное место"},{"t":"p","h":"Алтынай ... орунга отурду. Мектепте ардактуу мейманды күтүп жатышты."},{"t":"p","h":"мен башта көрбөгөн – раньше не видела или незакомый"},{"t":"p","h":"Дүйшөндү мен башта көрбөгөм. Класска биз ... окуучу кирди. көөнө (эски) – старый"},{"t":"p","h":"Дүйшөн ... кара шинелчен экен. Учурда көптөгөн көөнө сөздөр кебибизде колдонулуп жатат."},{"t":"v","l":["1 Мыйзамына (законуна) – закона","2 Күн батарда – ближе к закату","3 Бечара – эх, бедняга"]},{"t":"p","h":"<span class=\"pg\" data-n=\"117\">117<\/span>бажырайган кубакай – здесь красивый, светлый"},{"t":"p","h":"Ноорузбек бажырайган кубакай бала. Кийими көөнөрүп кетсе да, бажырайган жүзүнө жарашып турат."},{"t":"p","h":"боштондукка (эркиндикке) чыкканбыз – вышли на свободу"},{"t":"p","h":"Биз ... – деди, Дүйшөн. Кыргызстан ... чыккан эгемен өлкө. шинелинин илгичтерин – крючки шинеля"},{"t":"v","l":["... жула жаздап чөнтөгүнөн кагаз алып чыкты.","Солдат ... оңдоду.","карааны – силуэт (кого-либо)"]},{"t":"p","h":"Дүйшөндүн ... көрүндү. Алыстан эрбеңдеп бир ... келе жатты. таңгак саман – вязанка соломы"},{"t":"p","h":"Роман саманды таңгактады. Ира ... ташып жатты. үзөнгүгө такандай калып – оперевшись на стремена (то есть поднявшись на стремена)"},{"t":"p","h":"Сатымкул ... карады. Азамат ... ээрден өйдө көтөрүлдү."},{"t":"h3","h":"ТҮШҮНДҮРМӨ СӨЗДҮК"},{"t":"p","h":"молдо (мулла) – Октябрь революциясына чейин мусулман мектебинде бала окуткан жана сабаттуу адам; ислам дин кызматкери. кеңеш өкмөтү (өкүмөт)— 1917-жылы Октябрь революциясы жеңгенден кийин бүтүндөй баштагы Орусиянын ордуна курулган жана СССР деп аталган мамлекеттин аймагына 1988-жылга чейин өкүм сүргөн бийлик ушундай аталган."},{"t":"p","h":"комсомол – коммунистический союз молодежи. Өспүрүмдөрдүн жана жаштардын кеңеш өкмөтүнүн тушунда партияга жардамчы катарында уюшулган уюмунун аталышы."},{"t":"p","h":"1. Бул болгон окуяны ким жердештерине айтып берди? Ал айлына эмнеге келди эле? 2. Күркүрөө айлына Дүйшөн эмне үчүн келди? 3. Ал ким эле? Эл аны кандай кабыл алышты? Эмне үчүн анын максатын түшүнүшкөн жок? 4. Дүйшөн мектепти окууга кантип даярдап жатты?"},{"t":"p","h":"1. Текстти ролдорго бөлүштүрүп, көркөм окугула. 2. Молдо, комсомол, армия, Кеңеш өкмөтү, атактуу жердеш деген сөздөрдү орус тилине которуп жана аларды катыштырып сүйлөм түзгүлө. Чыгармада сүрөттөлгөн мезгилге таандык тарыхый сөздөрдөн тапкыла."},{"t":"p","h":"3. «Биз өмүр бою эзилип тепсендиде келген элбиз. Өкүмөт бизди эми көзү ачылсын, кат таанып, билимге жетишсин деп, кам көрүп жатат. Мына ошондуктан балдарды окутушубуз керек» – деген Дүйшөндүн сөздөрүнүн маанисин азыркы учурга ылайыктап чечмелегиле."},{"t":"p","h":"4. Тексттен этиштин аныкталбаган түрүнө мисал уюштургула."},{"t":"p","h":"Үлгүсү: Сөзсүз билим алуу керек. Барып көрүү керек."}],"sub":[{"title":"ТҮШҮНДҮРМӨ СӨЗДҮК","b":22}],"pages":[117,117]},{"title":"Дүйшөндүн мектеби","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"118\">118<\/span>Дүйшөндүн мектеби"},{"t":"p","h":"... Мугалимдин ал жерде эмне кылып жүргөнүн билүүгө кызыгып, бир күнү адырдан тезек терип келе жатып, үч-төрт кыз болуп кайрылып калдык."},{"t":"p","h":"Дүйшөн тамдан чыга келди да, бизди көрүп, бетинин терин аарчый жылмая күлдү:"},{"t":"p","h":"– Ии, кыздар, келгиле. Тезектен келе жатасыңарбы?"},{"t":"p","h":"– Келгениңер жакшы болбодубу, кыздар! Мына мектебиңер даяр десек да болот. Азыр эле бир бурчуна меш өндүү бир нерсе куруп бүттүм. Көрдүңөрбү, мору да үстүнө чыгып турат. Эми кыштык отунубузду тамдын бир бурчуна жыйып салабыз да, жерге самандан калыңыраак төшөп таштап, окууну баштай беребиз. Кандай, мектепке келесиңерби, окугуңар келеби?"},{"t":"p","h":"Кыздардын ичинен чоңураагы мен элем, алар унчукпай жатканынан:"},{"t":"p","h":"Жеңем коё берсе келем, – дедим."},{"t":"p","h":"– Аа, дурус. Коё бербегенде кармап калат беле. Атың ким сенин?"},{"t":"p","h":"– Алтынай – дедим мен."},{"t":"p","h":"– Алтынай, ... жакшы экен. Сен чоңоюп калган эстүү кыз экенсиң,- деди ал, жайдары жылмая карап. – Эмесе, Алтынай, сен башка балдарды да мектепке окуйлу деп ээрчиткин, макулбу?!."},{"t":"p","h":"Мен жолдон ойлонуп, Дүйшөндүн мээримдүү сөздөрүнө жана эркелете караганына ыраазычылык билдиргим келди."},{"t":"p","h":"... Кыздар мага карабай каптарын көтөрүп чуркап кетишти. Мен тезек терип алып, кайра жүгүрүп олтуруп Дүйшөндүн мектебине келдим да, каптагы тезекти там түбүнө төгө салып, тызылдаган бойдон адырдын кокту-копотун аралап тезек терүүгө шашылдым."},{"t":"p","h":"Алда кандай зор эрдик көрсөткөндөй жүрөгүм алып-учуп, адегенде бет алды эле чуркап кете бердим.<span class=\"pg\" data-n=\"119\">119<\/span>"},{"t":"v","l":["1 Мор – дымоход.","2 Каптарын – мешки."]},{"t":"img","src":"data:image/webp;base64,UklGRoAqAABXRUJQVlA4IHQqAACQCAGdASqAAh0BPrVUpEwnJSOlKJRbCOAWiWlu/C44bOmKItif0n/xP736zPjv8B/wP7749/kH1f+z/uvoGZq/Uv7/zL/mn5JyA8rPlTqI/l39n3l0A+9DyXeSB/f6E7tKy0LrsX6DuKd1n0HcU7rPoO4p3WfHIZWWXClfg1C2HkQWhX++g7indZ9B3FO6z6DuKdsj+gyx3qhZgs3WypnHhglta9tindZ9B3FO6z6DuKd1n0HcU7qZwe9O0Qgqkv7pLwqhgEL13UqzCombGUud1n0HcU7rPoO4p3WfQdxOmx3Epn22XMSNr2BhG9fGmFDv6UBjkJVFnoy+f210mAsfQdxTus+g7fXcxf76DuKdsg440GsxjPFWEB7vCGiOxQqP3dy3THqKZPzMoIeGQMK61SBV/QprMQ3dY/30DHNXYZ3owwQLDbsXaw5HbeQ0Mk AvI0HeAZ4LHe9RbU6/nHOS8E8XAWiO0i0HCYAspIAAAA==","w":640,"ht":285}],"sub":[],"pages":[118,119]},{"title":"Биринчи сабак","blocks":[{"t":"h3","h":"Биринчи сабак"},{"t":"p","h":"Биринчи күнү ал бизди жерде төшөлгөн саманга олтургузуп, колубузга бирден дептер, бирден калам, ар бирибизге атайлап жасалган кичинекей тактайдан берди да:"},{"t":"p","h":"– Муну тизеңерге коюп кат жазасыңар, – деди."},{"t":"p","h":"Анан дубал бооруна жармаштырып койгон сүрөттү көрсөтүп. Мына бул киши – Ленин! – деди. – Биз ушул кишинин айткан, көрсөткөн жолу менен окуйбуз!.."},{"t":"p","h":"Лениндин ошондогу сүрөтү бүт өмүрүмдө эсимде калды. Иреңи азыңкы Ленин ал сүрөткө жарадар колун мойнуна асып, артын жапыра кийген кепканын астынан муңайым карап: «Эчтеке эмес, балдар, силер да бой жетип, чоңоюп жетилесиңер. Оо, силердин келечегиңер кандай сонун келечек!» – дегендей терең ойго берилип турган эле. Ленин тууралуу Дүйшөн өз көзү менен көрүп келгендей сүйлөр эле. Биз эч бир күмөн санабай туруп, кээде сурап калар элек:"},{"t":"p","h":"– Агай, Ленинге салам бергенде кол кармаштыңыз беле? Анда биздин мугалим башын чайкап:"},{"t":"p","h":"– Жок, балдар, жүз көрүшүп жолуга албадым, – деп, ошого өкүнүп үшкүрө турган..."}],"sub":[],"pages":[119,119]},{"title":"Дүйшөндүн эрдиги","blocks":[{"t":"h3","h":"Дүйшөндүн эрдиги"},{"t":"p","h":"– Мен силерге, балдар арип жазууну, сөз, сан жазууну үйрөтөм, – деди агай бир күнү. – Өзүм эмнени билсем ошону окутам..."},{"t":"p","h":"Айтканындай эле Дүйшөн билгенин аябай, ар бир... үстүбүздөн үйрүлүп, калам кармоодон тарта ... биз укпаган саясы сөздөргө чейин түшүндүрүп окутууга аракеттенип жатты."},{"t":"p","h":"1 Күмөн санабай – не подозревая. 2 Арип – буква."},{"t":"p","h":" <span class=\"pg\" data-n=\"120\">120<\/span>Азыр ойлосом, колунда кармаган алиппеси жок бул чала сабат, эки сөздү эптеп кошуп окуган жаш жигиттин, албетте, анда окутуунун тартиби, жол-жобосу жөнүндө эч кандай түшүнүгү, кабары да болгон эмес. Бирок анын ак пейлинен кылган аракети, менимче, талаага кеткен жок. Биз ошондо эле Олуяата, Ташкенден да чоң Москва деген Ленин жашаган чоң шаар бар экенин, баш-аягы Таластын өрөөнүндөй деңиздерде тоодой болгон кемелер сүзүп жүргөнүн, чыракка жаккан май жердин астынан чыга турганын билгенбиз. Эл байып, турмуш оңолгондо биздин мектеп столдор коюлган чоң ак там болоруна биз ошондо эле ишенгенбиз."},{"t":"p","h":"Анча-мынча арип тааныгандан кийин, «ат», «таканы» жазалбай жатып, кат жүзүндө биздин биринчи оозанган сөзүбүз «Ленин» болгон."},{"t":"p","h":"Дүйшөндүн берген дептерин аяп, кай жерде жүрбөйүн, ороктун учу менен жерге чейин, дубал боорлоруна, кар үстүнө арип салып, сөз жазып окугам. Өз көңүлүмдө мен үчүн Дүйшөндөн жакшы, андан билимдүү киши болгон эмес..."},{"t":"p","h":"Бул арада антип-минтип жатып, кыш да кирип келди. Суук түшкөнчө дөбөнүн этегинде аккан таштак сууну кол кармашып кечип жүрдүк. Кийин шыйрак какшап, майда балдар чыдагыс болгондо, Дүйшөн аларды бирин жонуна мингизип, бирин колуна көтөрүп өтүп жүрдү."},{"t":"p","h":"Анда кишилердин караңгылыгыбы, түшүнбөстүгүбү, Дүйшөндүн мунусун шылдындап күлүшө турган."},{"t":"p","h":"Азыр ойлоп карасам ошондо айылдагылар эле эки жыгач таштап бүтүрүп койчу жумуш, бирок анда окуунун маанисин эмне экенин билбеген эл Дүйшөндү анчейин бир кыларга иши жок апендидей көрүшүп, чыдасаң окут, болбосо тим кой дегендей, ат кечкен жерге көпүрө салып көрбөгөн немелер өздөрүнө кереги жок болгон соң, биздин жайыбызды көңүлдөрүнө да илишпептир."},{"t":"p","h":"1 Олуяата – Жамбыл."},{"t":"p","h":"2 Тоодой болгон кемелер – громадные пароходы (как горы)"},{"t":"p","h":"3 Антип-минтип жатып – пока то да, то се."},{"t":"p","h":"4 Таштак сууну – здесь речка горная, каменистая, холодная 5 Көпүрө салып – построив мост"},{"t":"h3","h":"<span class=\"pg\" data-n=\"121\">121<\/span>Сенин багың окуудан ачылсын"},{"t":"p","h":"Кыш ооп, жаз да келди. Жаз келгенге күлкүбүз, ойнубуз көбөйүп, мектептен чыккандан айылга чейин кубалашып келчү болдук."},{"t":"p","h":"Бир жолу Дүйшөн мектепке теректин эки көчөтүн алып келди."},{"t":"p","h":"– Экөөбүз азыр бир иш кылабыз, Алтынай, – деди өзүнчө сүйүнгөндөй мени күлө карап. – Мына бул теректерди мен сага арнап алып келдим. Ушулар жетилип чоңойгончо, сен дагы жетилип, жакшы киши болуп, көктөп бүрдөйсүн."},{"t":"p","h":"Менин баамымда сен чоң окумуштуу адам болосун. Кел эми өз колубуз менен тигип коелу. Багың окуудан ачылсын!.."},{"t":"p","h":"Сүйүнгөн-кубанганымдан, ыраазы болгонумдан, эмне дээримди билбей, мен унчукпай эле Дүйшөндү карап тура бердим..."},{"t":"p","h":"Волуста дагы бир он чакты жетим балдар менен кошо мени Ташкентке балдар үйүнө жиберүүнү чечишти. Дүйшөн мени узатып станцияга келди."},{"t":"p","h":"– Сен окушуң керек, – деп айтты ал. – Менин билимим сени мындан дагы көп окутууга жетпейт. Жөнөгүн, ошентсең туура болот. Балким, кийин сен дагы мугалим болуп балдарды окутуп калсаң, биздин жаман мектепти эстеп күлөрсүң... Бактылуу бол, Алтынай. Эчтемеден тайманбай, чабыттап учкун, окуй бер!.."},{"t":"h3","h":"СӨЗДҮК"},{"t":"v","l":["бетинин терин аарчый – вытирая с лица пот","Дүйшөн ... бизди жылмая карады.","Апасы Олегдин бетинин терин аарчыды.","меш өңдүү бир нерсе – на подобии печки","... салып жаттым эле. Бурчта ... турат.","Жамил очок, дандыр, меш жасай алат.","калыңыраак төшөп – положив побольше","Самандан ... алып окуй беребиз."]},{"t":"p","h":"Жер төшөктөн калыңыраак төшөп алгыла, – деди Жамал. жайдары жылмая – приветливо улыбаясь"},{"t":"p","h":"Дүйшөн ... карады. Мугалим балдарды карап жайдары жылмайды."},{"t":"v","l":["1 Теректин эки көчөтүн – двух свженцев тополя.","2 Волуста – волосто.","3 Билим жетпейт – не хватает знаний, образования"]},{"t":"p","h":"<span class=\"pg\" data-n=\"122\">122<\/span>жарадар колун – раненную руку муңайым карап – печально смотрел Лениндин ошондогу ... асып алып, ... турган элеси өмүр бою эсимде калды. Дүйшөн мага муңайым карады."},{"t":"v","l":["жүз көрүшүп жолуга албадым – не мог повидаться","Ленин менен ..."]},{"t":"p","h":"Карл Лена менен жүз көрүшүп жолугууну, сүйлөшүүнү каалады. үстүбүздөн үйрүлүп – он души не чаял"},{"t":"v","l":["Дүйшөн ... турчу.","Чымчык балапанынын үстүнөн үйрүлүп түшүп жатты.","талаага кеткен жок – не пропал даром","Мугалимдин эмгеги ...","Ата-энеңердин эмгегин талаага кетирбегиле!","жонуна мингизип (көтөрүп) – сажая на спину"]},{"t":"p","h":"Ал кичинекей балдарды суудан ... өткөрүп жүрдү. Таенеси Адилетти жонуна мингизип көтөрүп жүрүп бакты. Мүдүр бухгалтерди жонуна мингизип, кыңк эте албай калган."},{"t":"p","h":"көңүлүнө илишпептир (эске алышпаптыр) – не придавали значения Айылдагы чоң эле кишилер окуунун маанисин ..."},{"t":"v","l":["Айрым балдар окуунун маанисин жаш кездерде ...","эчтемеден тайманба – здесь будь смелым, решительным.","... – деди Дүйшөн.","Калыстыгыңды айтарда кандан-бектен да тайманба!","чабыттап учкун – здесь дальше учись","Алтынай, алыска ... Бүркүт көктө ... жүрөт."]},{"t":"p","h":"1. Кыздар мектепке эмне үчүн барышты жана эмнени көрүштү? 2. Алтынай Дүйшөнгө кандай жардам берди? 3. Биринчи сабакта Дүйшөн эмне жөнүндө сүйлөдү? Ал кимди тааныштырды? Алтынай Ленинди кандай элестетип калды? 4. Алтынай эмне үчүн тамгаларды дубалга, карга, жерге жазды? Азыр силер тамганы эмне менен кайда жазасыңар? 5. Алгачкы мектеп, окуу деген түшүнүктөр ал кезде кандай деңгээлде эле? Мында Дүйшөн кандай эрдик кылды? 6. Теректерди Дүйшөн кандай максат менен тиккен эле? 7. Алтынайды Дүйшөн кайда жиберди? Чыгармадагы айтылган ойду кандай түшүндүңөр?"},{"t":"p","h":"1. Тексттен тарыхый (историзм) сөздөрдү таап, алардын маанисин чечмелегиле."},{"t":"p","h":"2. Силердин биринчи мугалимиңер жана ал кантип окуткандыгы жөнүндө аңгеме түзгүлө."},{"t":"p","h":"3. Төмөнкү план боюнча Дүйшөн жөнүндө аңгеме түзгүлө:"},{"t":"p","h":"а) Дүйшөн ким? – Батрактын уулу, кубакай жүздүү, көөнө шинелчен, ..."},{"t":"p","h":"б) Ал мектепти окууга кантип даярдады? – эски ат сарай, дөбө, жалгыз, отун, суу,"},{"t":"p","h":"в) Балдарды Дүйшөн эмнеге үйрөттү? – түшүнүксүз сөздөр, арип, сан, чоң кемелер, кооз шаарлар, жер май,..."},{"t":"p","h":"<span class=\"pg\" data-n=\"123\">123<\/span>г) окуучуларына ал кандай мамиле кылды? – мээримдүү, боор ооруп, эркелеткен сөздөр, жагымдуу, жонуна көтөрүп, ...."},{"t":"p","h":"4. Чыгарманы көңүл коюп окуп чыккыла. «Октябрь революциясынын жана билим алуунун мааниси» деген ой жүгүртүү дилбаянын жазгыла."},{"t":"p","h":"5. Төмөнкү макалдарды жана учкул ойлорду адабият дептериңерге жазып алып, эсиңерге түйүп алгыла. Чыгарманын мазмунуна, идеясына ылайык келген кыргыз жана орус элиндеги макал-лакап, учкул, даанышман ойлордон тапкыла!"},{"t":"p","h":"Эсиңерге түйүп алгыла!"},{"t":"p","h":"«Мугалим – мөмөлүү дарак». «Окусаң озорсуң, окубасаң тозорсуң». «Окуу – билим азыгы, билим – ырыс казыгы». «Акыл – деңизден терең, билим – тоодон бийик»."},{"t":"v","l":["Киши көөнү түпсүз дениз ашынган,","Билим – бермет эң түбүнө катылган.","Илим менен кырсык, кемтик түзөлөт.","Билим менен эл кыйыры бүтөлөт."]},{"t":"p","h":"Жусуп Баласагын"},{"t":"h3","h":"АДАБИЯТ ТЕОРИЯСЫНАН"},{"t":"h3","h":"Каармандын мүнөзү жана адабий мүнөздөмө жөнүндө түшүнүк"},{"t":"p","h":"Балдар, силер буга чейин бул китептен дегеле көп каармандар менен тааныштыңар. Албетте алардын бардыгы силерге өзүлөрүнүн жасаган иштери, жүрүш-туруштары менен оң же терс таасир калтырды. Маселен, силер Эр Төштүктөй баатырларга, төрт Маамыттай өнөрлүүлөргө суктандыңар, ачкөз ажыдаарга, желмогуз кемпирге, каардуу Абалканга жиниңер келди. Саятчы Төлөктүн тагдырына бооруңар ооруду. Турмушта жаман жана жакшы окуялар эриш-аркак болорунан кабар алып («Балалык», «Жетимдер жөнүндө», «Айтамын санат тобуңа»), кыз-жигиттердеги жакшы жана жаман-жүрүш-туруштар кандай болорун («Жакшы кыз», «Өзү каар, тили заар кыз», «Болор жигит», «Болбос жигит») баамдадыңар."},{"t":"v","l":["1 Дегеле (оголе) көп – множество, очень много.","2 Таасир калтырды – оставил впечатление.","3 Суктандыңар – восхищались.","4 Эриш-аркак – здесь взаимосвязаны."]},{"t":"p","h":"<span class=\"pg\" data-n=\"124\">124<\/span>XIX кылымдын башындагы кыргыз элинин турмушунан кабар алып, ал кездеги силер курактуу балдардын ал-абалдары менен тааныштыңар. («Бороондуу күнү»). Билим алуунун маанисине көзүңөр жетип; аны элге таратууда Дүйшөндөй терең ыкластуу мугалимдер болгонун билдиңер. Демек, силер чыгармадагы каармандар тууралуу кенен-кесир айта аласыңар, алардын сапаттарын мүнөздөй аласыңар."},{"t":"p","h":"Чыгармада сүрөттөлгөн адамдын негизги белгилери мүнөз болуп эсептелет. Ага адамдын кылган иши, портрети, айлана-чөйрөгө, адамдарга болгон мамилеси, жүрүш-турушу, кулк-мүнөзү ж.б. кирет."},{"t":"p","h":"Ал эми ошол каармандардын бул башкы белгилерине берилген баа, аларды сүрөттөө адабий мүнөздөмө деп аталат."},{"t":"p","h":" Төмөнкү таблицаны толтургула. Анда өзүңөр окуган чыгармалардагы негизги каармандарга мүнөздөмө бергиле."},{"t":"p","h":"I. «Эр Төштүк». 1. Төштүк: сырткы көрүнүшү – буту бука белиндей, ...; кулк-мүнөзү – адилеттүү, каарданып үксөйөт...; мамилеси – боорукер; кылган иши – агаларын табат, айбандарды куткарат, мөөрөйлөрдү аткарат, алпкаракуштун балдарын сактап калат...; кандай каарман – оң каарман, элдик баатыр."},{"t":"p","h":"2. Желмогуз кемпир: сырткы көрүнүшү – мандайы тырыш; кулк-мүнөзү – каардуу ...; кылган иши – Төштүктү жер алдына түшүрөт ...; кандай каарман – терс каарман."},{"t":"p","h":"II. «Бороондуу күнү». 1. Бала: кулк-мүнөзү – жигердүү, ...; мамилеси – олуттуу, ...; кылган иши – алыска барат, ...; кандай каарман – оң каарман."},{"t":"p","h":"2. Кемпир: сырткы көрүнүшү – жетимиштин кырында; кулк-мүнөзү – боорукер, ...; мамилеси – күйүмдүү, ...; кылган иши – акыл айтат, ...; кандай каарман – оң каарман, ..."},{"t":"p","h":"III. «Биринчи мугалим». 1. Дүйшөн: сырткы көрүнүшү – арык, узун бойлуу, ... 2. Алтынай: ..."},{"t":"p","h":"IV. «Буудайык». 1. Саятчы: кулк-мүнөзү – алаңгазар; кылган иши – куш таптайт. 2. Буудайык: сырткы көрүнүшү – жүнү чаар, ... алгыр ...; кылган иши – аюу, түлкү ж.б. айбанаттарды алат."},{"t":"p","h":"5 Силер курактуу (силерге жашташ) – вашего возраста (сверстники).<span class=\"pg\" data-n=\"125\">125<\/span>"},{"t":"v","l":["6 Ыкластуу – сердечный, искренний."," 7 Кенен-кесир – глубоко, всесторонне."]}],"sub":[],"pages":[120,125]},{"title":"АЛЫКУЛ ОСМОНОВ","blocks":[{"t":"h3","h":"АЛЫКУЛ ОСМОНОВ"},{"t":"img","src":"data:image/webp;base64,UklGRhANAABXRUJQVlA4IAQNAACQiACdASpMAZ0BPrVWokunOy6qLLTJU2AWiWlDMNzFvK+WZVA0Eu5/VvPD7uMBXnB+Kf6fad/Y8mq0b1ENTBnGHhX9Kw5WXIRKD21SGa95XnfERMrbuhWfQEQ4SFAm68tz6g+0e3F01KJOf7yBxJsryA6Pz1/HHTrx3rwRqtMCF/gmV+L5jrt7tG0SL2S4LiSAzh6x+XtpiixLrPgN6QCnjmHKQe3GAS9pKtPzAvBmbuUeX5s4ow4/H0D+l2RgzyUX4rduv2Vgz1JnKUqbR1+Jdq6tI/EEPACX9WzbWMoOUmvuwU95GLijV81H8HcPFIDC3QZYtA0flpbWvIAWz39wP2Je7dJu9RfDCxDDrm8fcyGqkIv4mrS4+pLowj28AZHghJ8FxXzy33XXb3F1aGar2pG8yUS5JawAbhIRtxHZ4H2jcQAswHtD5IVDMgN3mrUrdVfTq9MNO0IprV5L39SjZwi3GbuB/07rPlgKDGw2vPygW4vO3soe7aYB87tZegMV889vEiklb2GDI3ISd0T6egZHApwyjYi46J0H3yIMpoNkS2YWe8U6GER87b79Yciwp3oH/XgOrmr4DKxJJhG/oPxSrTSESBynD66Gu3eBwkpXtGmCfuofgglTQbym6j+htflDtfLQohCS2mKHTFdIEVIBbG0oq6y14fvBFqb07Dv01oNUjjJaQrVabCUT0GHjY+dYyaZRrrLPbZ4GF7xW7/wNkkSJWyprokKFCcLKkelxijgyAtvDZPiw6J/M1t70ep4XDIj3hVyfTEQlaJ5SD26sObt8JVPfF2eXcG0JtR9+j9vB3Ia5vo87XOR3icfrUyklFcY7gAcYULPtxcC7bgdxLhtA+VEPbnuwHvOx15OBC0BT2NDQKctXMW+tYW67aYikzHhoMuS9LnoRTS6NpKkBvUdsNIbAyBiCPmpVQglSP621+ntnVdSEx5NnltUuZvWxKrYir1WBWM324IsrnveWSwBVYpz4aieEMJcPMXWX06DC0d9900z/SFzcCGVxXOhe7RqW7xgdk7277hPHApmr0OEtApbqIlBj3kcgIbKygCttKwca5F2LbNRaKPqWlk+OAlmFLsIwJqiEr3qOCK7w8WveWjusBHtusFN/EICEsQXAuLgVuLwifLMyBP6/UQ+y8nOO2POq0y7wl7bCRy4ia9enAGO5lGO8NQzOmfevEk+fA4wnHPIRkwLrlbweRZDp4sKwzNL+jZwfxYGGPkrk1uqd6ByJMhQLoUgjTHKEHXQbP6k5lHcmNGBQbQ8KUYdfo2TSsW5qFptx8QBvlk3lCzy8WE5UUZqR29uZL5JWUGifAnqocDuVMtNTVApxuX+U0Vk1ssCGLof+nzZPDrOpN0iWtHj52gO78U4n4xjXkvnyN63PfvrriZ3/PjuURoIpNideoQnGjuoKcKTyKSiTjBW96/U8HQJSEYTyBe1AkRKgSw+BvGKw7gAA/vjiGuoeFXCzoKIpLg5WfKTBq626N7S6dz8HABHvIs6+b4gd1LMKxmOe9G0Ufb/PJiXP2gU6UEAgix1niGLZbikZK5M2U2pJsPho73qSFwIKSoh2Uqy7OMFz+X1kodOGd9w3dxORXIVHkhPyXsuIa92sbdZCr7K0f/5PMGc5a5dFuFUA1ww5YyomxXARnhvmQZgp5R3wK8Cn2bOThq3ml ирдин «Отелло», «Он экинчи түн» чыгармаларын которгон."},{"t":"p","h":"А.Осмонов балдарга арнап көптөгөн чыгармаларын жараткан. Анын «Эки метр Эсенкул», «Калпычы Канымкул», «Бат айтма» «Бала тили», «Тай күлүк» жана башка чыгармалары өтө кызыктуулугу менен айырмаланат."},{"t":"p","h":"Акын ырларында Атажуртту, эл жана тилди, достукту даңазалаган. Алыкулдун «Атажурт», «Россия», «Орус эли», «Эне тилим», «Грунья Савельевнага» жана башка ырлары буга мисал."},{"t":"p","h":"Акын «Кыргыз тоолору» ырында кыргыз жеринин эң эле кооз жаратылышын сүймөнчүк менен сүрөттөйт. Чокусунан мөнгү музу кетпеген эң бийик тоолордун элесин сүрөткө тарткандай акындык эргүү менен ырга салат."},{"t":"p","h":"Ал эми «Эне тилим» ырында ар бир элге өз тилинин эң ыйыктыгын, кымбаттыгын поэтикалык тил менен чагылдырып берет. Акын ошол кезде тил үйрөнүү жакшы, келечектүү иш экендигин жазбай баамдаган."},{"t":"p","h":"Алыкул мээримдүү, боорукер, асыл эненин мыкты образын «Грунья Савельевнага» деген ырында чагылдырат. Эненин ыйыктыгын, гуманизмин салтанаттайт. Бул аял Токмоктогу балдар үйүндө тарбиячы болуп иштеген. Жетим, анан калса апа мээримине жарды Алыкулга энесиндей мамиле кылып, чоң таасир калтырган."},{"t":"p","h":"1 Чыгармачылык менен алек болот – здесь занимается творческой деятельностью"},{"t":"v","l":["2 Жарык көргөн – вышли в свет","3 Тандалган – избранные","4 Бат айтма (жаңылмач) – скороговорка","5 Даңазалаган – прославлял","6 Сүймөнчүк менен – с симпатией, с любовью","7 Сүрөткө тарткандай – будто рисовал кистью.","8 Ыйыктыгын – святость."]},{"t":"p","h":"<span class=\"pg\" data-n=\"127\">127<\/span>Алыкул – учурда жалпы кыргыз калкынын эң сүймөнчүктүү акыны. Анткени ал ошол сүйүүгө арзыган эң бийик поэзиясын түбөлүккө элине калтырып кетти."},{"t":"v","l":["Таштан болор, кумдан болор төшөгүм,","Аз болсо да сыртта калар сөздөрүм.","Өлсөм дагы жара тээп мүрзөмдү","Буудан болуп таскак салып өтөрмүн."]},{"t":"p","h":"Алыкул Осмонов жөнүндө учурда көп акын-жазуучу, драматургдар чыгарма-эскерүүлөрдү жазышкан. Алар топтолуп 1990-жылы «Мезгил жана Алыкул» деген ат менен окурмандарга тартууланды. Анын ысмы республиканын шаар, райондоруна, көчө, мектептерине берилген. Бишкектеги № 68 мектеп анын атын алып жүрөт, үй-музейи уюштурулган. Улуттук китепкананын алдына эстелиги орнотулган."},{"t":"h3","h":"СӨЗДҮК"},{"t":"v","l":["жаш муундар – молодое поколение","... билим берүү мугалимдердин парзы.","Уулу жоктун ... жок (макал)."]},{"t":"p","h":"лира (поэзия) ширесине – здесь сладость поэзии (обр. выр.) өтө кызыктуулугу менен – очень интересный"},{"t":"v","l":["төшөгүм (жаткан жерим) – здесь место где я похоронен","Кумдан болор, таштан болор ..."]},{"t":"p","h":"Жаткан жери жайлуу болсун! (пожелание усопшему) мүрзө – могила"},{"t":"v","l":["таскак салып – здесь обр.выр. бежать рысью","Даңкым ... Ат таскак салып келе жатты.","улуттук китепкана – национальная библиотека","... шаардын борборунда жайгашкан.","Сен бүгүн ... барбайсыңбы?"]},{"t":"p","h":"1. А. Осмонов жөнүндө буга чейин эмне билүүчү элеңер? 2. Ал жөнүндө замандаштары кандай пикирлерди айтышыптыр? Силер да пикир айта аласыңарбы? Акын «Өлсөм дагы жара тээп мүрзөмдү, Буудан болуп таскак салып өтөрмүн» деп кандай мааниде айтып жатат? Анын айтканы туурабы, ойлонгула."},{"t":"p","h":"1 Апа мээримине жарды (эне мээримин көрбөгөн) – не видевший материнскую любовь, ласку."},{"t":"v","l":["2 Түбөлүккө – на вечно","3 Эстелиги – памятник (ему)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"128\">128<\/span>1. Этиштин ыңгайларын эске түшүргүлө. Төмөнкү мүчөлөр аркылуу этиштин ыңгайларын уюштургула: -са, ... -гай, ... -мак, ... -чы, ... -ын, ..."},{"t":"p","h":"2. Төмөнкү сөздөрдү туура айтууга көнүккүлө: жаш муундар, тамшанышат, тай күлүк, сүймөнчүктүү – сүймөнчүлүктүү – сүймөнчүккө, баамдаган, мээримдүү, төшөгүм, өтөрмүн."},{"t":"img","src":"data:image/webp;base64,UklGRuxkAABXRUJQVlA4IOBkAABw1gGdASqAAk8BPrVOoEonJKMhrDPc6OAWiWlu/AyPO3aupH7A/5n0aeMn67/BeLv5F9L/rv7j/kP2U9y3HP2c6inzj8e+jvRX/zf6Hxd/Of3T/zf5H2C/yr+n/sN+//u нулись как верблюды караванщика (верблюжий караван)"},{"t":"v","l":["арстандын азуусундай арсайып – здесь как клыки льва","калың тартып заңкайып – здесь гордо возвышаются","Калың тартып заңкайган зоолор.","чокулары жалтырап – вершины сверкают.","Күн тийгенде асканын ..."]},{"t":"p","h":"бороон өтөт калтырап – здесь вздрагиваясь проходит пурга жаз келерде – перед наступлением весны"},{"t":"v","l":["... биринчи болуп тоого байчечекей өсөт.","ай жамынып ак болуп – здесь белеет от лунного света","Түндө талаа ... болуп турду.","Жердин жүзү ай жарыгына, аппак карга бөлөндү.","түз жерлерден – от равнинных мест","... кар эрте кетет.","1 Даам жедим – отведал."]},{"t":"p","h":"2 Бооруңдан (бир тууганыңдан) – здесь как родного брата. 3 Жаш атадай – подобно молодому отцу."},{"t":"v","l":["4 Үшкүрдүң – здесь печалилась, тяжело вздохнула.","5 Кош ат – здесь запряженная пара лошадей."]},{"t":"p","h":"6 Көңүлүмдө (эсимде) көз жашың – в памяти слезы твои."},{"t":"p","h":"<span class=\"pg\" data-n=\"131\">131<\/span>күндү тосуп кызарып – багровеет от первых лучей солнца, Тоолор күндүн нурунан Эркелей уялганынан жүзү кызарып кетти. кем көрбөдүң – здесь относилась не хуже"},{"t":"v","l":["Г.Савельевна Алыкулду өз баласынан ...","каздар каркылдап – гуси гоготали","үй жанына жакындап – приближаясь к дому"]},{"t":"p","h":"узаттың – проводила. Мирлан Сережаны ... койду. Туристти ат менен ... бара жатышты."},{"t":"p","h":"тоголонуп көз жашың – прослезилась"},{"t":"p","h":"Кубанычтан Люсянын ... . Топ ..."},{"t":"p","h":"жан боорумдай – здесь как родного"},{"t":"p","h":"«... болуп калыптырсың», – деди Света. Атасы Жибекке «... ий!» – деп жалынды."},{"t":"p","h":"көргөн эмесмин – не видел"},{"t":"p","h":"Ата-энемдин да көз жашын ... Богошту жайлоосундай кооз жерди эч жактан ..."},{"t":"h3","h":"ТҮШҮНДҮРМӨ СӨЗДҮК"},{"t":"p","h":"шөкүлө этн. – богато украшенная конусообразная шапка невесты."},{"t":"p","h":"1. Кыргыз элининин улуу акыны А. Осмонов жөнүндө эмне билесиңер? 2. Акын «Кыргыз тоолору» деген ырында жаратылыш пейзажын кандай сүрөттөгөн? 3. «Эне тил» деген ырында тилдин мааниси кандай чечмеленген? 4. «Грунья Савельевнага» ырында баланын энеге болгон сүйүүсү, сагынычы кандайча чагылдырылган? 5. Акындын ырларынан жана алардын жаралыш тарыхынан эмне билесиңер? 6. Силерде атажурттун пейзажы, эне тил жана эненин боорукерлиги жөнүндө кандай ой-сезимдер жашайт?"},{"t":"p","h":"1. «Кербенчинин төөлөрүндөй чубашып», «арстандын азуусундай арсайып», «шөкүлөдөй жаркырап» деген сөз айкаштары кайсы көркөм сөз каражаты? Буларды катыштырып сүйлөм түзгүлө. Ырлардан мындай көркөм тропторду тапкыла!"},{"t":"p","h":"2. Төмөнкү сөз айкаштарын түшүндүргүлө: ойротто жок, жакшы көрмөк – сүймөктөн, чын көңүлдөн – сүймөктөн, сүйгөнүмдөн жаңылбайм."},{"t":"p","h":"3. Төмөнкү сөздөрдү ылайык келген синоними менен алмаштыргыла. Даам жедим, көңүлүм ток, үшкүрдүң, кайтар мезгил, аман бол, көз жашың."},{"t":"p","h":"4. Ырларды көркөм окууга көнүккүлө. Мында сингармонизм (үндөшүү) законун, муундук ыргактарды, уйкаштарды, басым, интонацияларды эске түшүргүлө."},{"t":"p","h":"5. А.С.Пушкиндин «Зима», «Зимний вечер», Ж.Бөкөнбаевдин «Жайдын кечи», Ф.И. Тютчевдин «Зима недаром злится», А.Токомбаевдин «Ай нурунда кышкы түн» ырлары менен акындын «Кыргыз тоолору» ырын салыштыргыла. Ырлардын формалык түзүлүштөрүнө көңүл бөлүп, аларды көркөм айткыла. Эмнени байкадыңар?"},{"t":"p","h":"<span class=\"pg\" data-n=\"132\">132<\/span>Төмөнкү таблицаны толтургула."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>«Кыргыз тооло-<\/td><td>«Зимний вечер»<\/td><td>«Ай нурунда кышкы<\/td><\/tr><tr><td>ру» А.Осмонов<\/td><td>А.С.Пушкин<\/td><td>түн» А.Токомбаев<\/td><\/tr><tr><td>1.Кербенчинин<\/td><td>1.Как зверь, она 1. Айран төгүп койгон-<\/td><\/tr><tr><td>төөлөрүндөй чу-<\/td><td>завоет<\/td><td>дой<\/td><\/tr><tr><td>башын<\/td><td>2.То заплачет как<\/td><\/tr><tr><td>2.<\/td><td>дитя<\/td><\/tr><tr><td>3.<\/td><td>3.Ветхая лачужка 3.<\/td><\/tr><tr><td>4.<\/td><td>4.<\/td><td>4.<\/td><\/tr><tr><td>5.<\/td><td>5.<\/td><td>5.<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"6. Төмөнкү котормолор акындын ырларынын кайсы куплеттери экендигин тапкыла. Котормону андан ары уланткыла."},{"t":"v","l":["Из рук меня кормила ты, бывало,","Сластями, словно сына, баловала.","«Пусть поправляется, – твердила ты","он слаб...»","И на рассвете для меня вставала,","Пер. В.Звягивцевой","Гора с горой сошлись, гора с горой срослись,","Гора из-за горы уходит вдал и ввысь.","Ни дать, ни взять – бредет верблюдов караван,","Неровной чередой хребты их поднялись.","(Пер. В.Потаповой)","Я петь привык на языке кыргызском","Любимом с детства, с колыбели близком","Народов братских языки любя,","Родной язык забуду ли тебя.","Пер. В. Потаповой"]}],"sub":[{"title":"ЭНЕ ТИЛ","b":16},{"title":"ГРУНЬЯ САВЕЛЬЕВНАГА","b":20},{"title":"СӨЗДҮК","b":25}],"pages":[129,132]},{"title":"МУКАЙ ЭЛЕБАЕВ УЛУУ МАРШ","blocks":[{"t":"h3","h":"МУКАЙ ЭЛЕБАЕВ УЛУУ МАРШ"},{"t":"v","l":["Эрин кулдап, күндөй жумшап бүлөсүн,","Нечен жылдар аккан тердин мөмөсүн","Тартып алсам деген кара ниеттин,","Кордугуна кантип тирүү көнөсүң?"]},{"t":"p","h":"1 Аккан тердин мөмөсүн /эмгектин натыйжасын/- результаты труда."},{"t":"p","h":"2 Кара ниет (душман) – нечестный, злостный."},{"t":"v","l":["<span class=\"pg\" data-n=\"133\">133<\/span>Улуу марш, улуу сынга,","Сал барын, эч аянба!","Эр жигит эми келди,","Сыналчу зор майданга!","Кыйын-кыстоо – миң жорукка белчеден!","Жедеп бышып, көнгөн элим эзелден.","Тендеши жок кандай күчтүү болсо да,","Баш урунуп, багынбайбыз, эч кимден.","Ачууланган большевиктик замбирек,","Сүрдүү бетин жоого салды күркүрөп.","Эки дүйнө чеңгелдешкен майданда","Чыдай албай, жердин жүзү титиреп.","","Эмгек этип, ырысы мол жеринде,","Жазыгы жок, жаткан тынч элиме,","Өзү келип, катылышкан жоо менен","Чын оюнду салышалы келгиле!","Улуу марш, улуу сынга,","Сал барын, эч аянба,","Эр жигит эми келди,","Сыналчу зор майданга!"]},{"t":"p","h":"катылышкан жоо менен – с врагом салышалы (кармашалы) – схватимся, сразимся эч аянба – борись, не щадя себя"}],"sub":[],"pages":[133,133]},{"title":"ЖООМАРТ БӨКӨНБАЕВ КОШ, АЛАТОО, УУЛУҢ КЕТТИ МАЙДАНГА","blocks":[{"t":"h3","h":"ЖООМАРТ БӨКӨНБАЕВ КОШ, АЛАТОО, УУЛУҢ КЕТТИ МАЙДАНГА"},{"t":"p","h":"Дүйнө жүзүн өрт алып, Кара жалын каптады."},{"t":"p","h":"Кыяндай жүрөт шаркырап, Кызыл кандын акканы."},{"t":"v","l":["Ушундай апаат күндөрдө","Уяттан уят эмеспи"]},{"t":"p","h":"кыяндай жүрөт – как поток дождевой воды"},{"t":"p","h":"1 Миң жорукка белчеден – подвергаясь всевозможным превратностям судьбы."},{"t":"v","l":["2 Чеңгелдешкен (кармашкан) – беспощадная схватка.","3 Майданда – в поле сражения.","4 Эмгек этип (эмгектенип) – трудились"]},{"t":"p","h":"5 Жазыгы жок (күнөөсүз) элиме – на мой мирный, трудолюбивый народ."},{"t":"p","h":"6 Кара жалын – черное пламя."},{"t":"p","h":"7 Апаат (кыйын-кыстоо) күндөрдө – в такие тяжелые дни."},{"t":"p","h":"8 Уяттан уят (өтө уят) – стыд, позор."},{"t":"v","l":["<span class=\"pg\" data-n=\"134\">134<\/span>Уулундун үйдө жатканы.","«Айланам коркок болбо» деп,","Айтканын эстейм эненин.","Ай чапчып суудай толкуган","Артымда калкым турганда","Айгышкан жоону жеңемин.","Барктап багып өстүргөн","Баландын сына өнөрүн.","Жеримдин бетин булгатпай","Желмогуз канын төгөмүн...","Кулжалар оттоп семирген","Кулпунган гүлү төрүмдүн,","Колоттон сууң шаркырап,","Комузу болгон көңүлдүн.","Атылып тоодон секирген,","Булагың эстеп жүрөрмүн.","Тан менен шаңшып ышкырган","Уларың эстеп жүрөрмүн.","Аскадан аркар көтөргөн","Кырааның эстеп жүрөрмүн.","Чымчыктар сайрап олтурган","Чынарың эстеп жүрөрмүн.","Айдаткан күлүк каламды","Алмаштым найза курчуна.","Кетемин кандуу сапарга,","Керегим тийип журтума.","Абалдан келген парз ушул,","Азамат шундай кылчу да.","Кыйындык келсе чыдоого","Кызматың үчүн жаралган,","Элинин болуу курманы —","Эр жигит карзы абалтан.","«Кайрылып жоодон качат» деп","Камсанай көрбө баландан."]},{"t":"p","h":"кызыл кан – красная кровь үйдө жатканы – быть лежебокой, лентяем коркок болбо – не будь трусливым эстейм – вспоминаю артымда калкым турганда – когда за мной стоит народ багып өстүргөн – вырастила, взрастила булгатпай – не давая (врагу) пачкать шаркырап – шумно течёт булагын эстеп жүрөрмүн – буду вспоминать твой родники шаңшып ышкырган – здесь мелодичное пение (свист) кырааның эстейм – вспоминаю ловчих птиц каламды (калемди)- перо (писательское) алмаштым – поменял, заменил абалдан (абалтадан), байыртадан – с давних времен кызматың үчүн жаралган – здесь всегда готовые служить верой и правдой"},{"t":"p","h":"1 Айланам (айланайын, берекем) /баласына кайрылуу/ – миленький ты мой."},{"t":"p","h":"2 Желмогуз (душмандын) канын – пролью кровь врага. 3 Чынар (бак) – горный тополь"},{"t":"v","l":["4 Парзы (милдети) – долг, обязанность","5 Шундай (ушундай) – так, таким образом"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"135\">135<\/span>СӨЗДҮК"},{"t":"p","h":"эрин кулдап (эркегин кул кылып)- превращая мужей в рабов бүлөсүн (үй-бүлөсүн) – семью"},{"t":"p","h":"Автор үй-бүлөнү күң-кул кылгысы келет деген ойду айтты. Анатолий ... сагынды."},{"t":"p","h":"кордугуна (зордук-зомбулугуна)- унижениям, оскорблениям"},{"t":"p","h":"Өз ... жат ... жаман. Душмандын ... эл көнбөдү."},{"t":"p","h":"көнгөн элим эзелден (байыртадан)- народ мой привыкал с давних времен. Кыргыз эли ... көчмөн турмушта жашап келген. ... кайда жүрдүң? – деди Алеша. багынбайбыз – не сдадимся"},{"t":"p","h":"Жоого ... Алик жолдошторун жакшы сөзү менен багындырып алды."},{"t":"v","l":["жердин жүзү титиреп – земля дрожала","Артиллериянын залпынан ... турду.","Тоолордо жер титирөө тез-тез болот."]},{"t":"p","h":"ырысы мол жер- земля наполненная счастьем, добром, благосостоянием"},{"t":"p","h":"Кыргыз жери ... Сериктин ..."},{"t":"p","h":"суудай толкуган – здесь (о народе) заволновалось как бушующее море"},{"t":"p","h":"... элди көрүп Зоя өтө кубанды. Минанын көңүлү көлдөй толкуду."},{"t":"p","h":"айыгышкан жоону жеңемин – одолею остервеневшего врага"},{"t":"p","h":"... жеңип эл кубанды. Айгырлар айыгыша алышып жатты. кандуу сапар – кровавый путь"},{"t":"p","h":"Аскерлер ... аттанышты. Баткендеги ... аман кайтты. сына өнөрүн – испытай его мастерство"},{"t":"v","l":["Баатырды эл сынайт. Окуучулардын ... калыстар ...","колот – узкая горная долина","... баары кой текей.","уларын (улар) – горная индейка","Жаштык кез-сайрап турган ...","камсанай көрбө (камсанаба) – не переживай"]},{"t":"p","h":"«Балаңдан ...»,— деди Жоомарт. Ал иш бүтөт камсыкпа, Толя."},{"t":"h3","h":"Түшүндүрмө сөздүк"},{"t":"p","h":"большевик – 1903-жылы партиянын II съездинде В.И.Лениндин жетекчилиги астында түзүлгөн Россиялык социал-демократтык жумушчу партиясынын, көпчүлүккө ээ болгон тобу аталган. Большевиктик – ошол топко таандык деген мааниде."},{"t":"p","h":"замбирек – пушка. 1. Ири калибрдүү ок, снаряддарды атуучу артиллериялык куралдардын жалпы аты. 2. Алыска атуучу узун стволдуу артиллериялык курал."},{"t":"p","h":"эки дүйнө – бул жерде акын Советтик Армия менен фашисттик армияны айтып жатат."}],"sub":[],"pages":[134,135]},{"title":"Макалдарды эсиңерге түйгүлө!","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"136\">136<\/span>Макалдарды эсиңерге түйгүлө!"},{"t":"p","h":"«Жигит үйдө туулат, жоодо өлөт». «Жигитке намыс кымбат, ар кыйын». «Эр жигит эл четинде, жоо бетинде». «Душмандын сырты жылма, ичи кара»."},{"t":"p","h":"1. Акындардын бул ырлары кайсыл окуяны чагылдырып жатат жана алардын пафосунда жана тематикасында кандай окшоштуктар бар? 2. М.Элебаев ырында кимге кайрылып жатат? 3. Ырдын ритми эмне үчүн аскердик маршка окшошуп турат? 4. Ж.Бөкөнбаев ырында кимге кайрылып жатат жана кандай ант берди? 5. Ушундай пафостогу жана тематикадагы ырлардан билесиңерби, кайсы акындар бул темага кайрылышкан?"},{"t":"p","h":"1. Ырлардын силерге жаккан куплеттерин жаттагыла жана көркөм айтып бергиле."},{"t":"p","h":"2. М. Элебаевдин ырында «кара ниет», «жоо», Ж.Бөкөнбаевдин ырында «желмогуз жоо» деген эпитеттер кимге карата айтылып жаткандыгын аныктагыла."},{"t":"v","l":["3. Улуу марш, улуу сынга,","Сал барын, эч аянба.","Эр жигит эми келди,","Сыналчу зор майданга!"]},{"t":"p","h":"деген куплеттин интонация, басым, паузасын, муун жана муунактарын адабият теориясынан алган түшүнүгүңөргө таянып тапкыла. Ритм жана рифмаларын ажыраткыла. Бул ырды кандай маанай менен окуганга боло тургандыгын ойлонгула."},{"t":"p","h":"4. Төмөнкү сөздөрдү сүйлөмдөргө тууралап койгула жана орус тилине которгула: жоо – жоонун – жоого – жоодо – жоодон, жоомун – жоосуң – жоосу, жоолаш – жоолашкан, курал – куралчан – куралдан – куралды – куралга – куралдандыр, апаат – апааттан – апааттанып – апааттанган, мизи майтарылды – мизи майтарылган."},{"t":"p","h":"5. Этиштин чактарын эстегиле. Төмөнкү сүйлөмдөрдөгү этиштер кайсы чактарды көрсөтүп турат?"},{"t":"p","h":"Кыйын-кыстоо кездерге эл жедеп бышкан. Тынч эмгектенип жаткан элге душман капысынан кол салды. Эр-бүлөлөр жоого аттанышты. Жакын арада согуш бүтүп, жеңиш келет. Эл нанга тоюнуп, кененчиликке жетишер. Фашисттик армиянын күчү эбак алсыраган. Жакында Нооруз майрамы болот. Быйыл А. Осмоновдун юбилейин белгиледик. Жазгы жарышка камылга көрүп жатабыз."},{"t":"p","h":"1 Кыйын-кыстоо кездерге – к трудным временам, лихолетьям. 2 Капысынан – внезапно"},{"t":"v","l":["3 Эр-бүлөлөр – мужчины","4 Кененчилик – изобилие","5 Камылга – подготовка."]},{"t":"h3","h":"<span class=\"pg\" data-n=\"137\">137<\/span>АДАБИЯТ ТЕОРИЯСЫНАН"},{"t":"h3","h":"Поэзия. Ыргак. Рифма жөнөндө түшүнүк"},{"t":"p","h":"Байыркы кезде жалпы эле көркөм сөз чыгармалары поэзия (грекче жаратамын, чыгарамын) деп аталган. Кийин адабият прозага, драмага, ырларга бөлүндү. Бул термин ыр менен жазылган чыгармаларды билдирип калды. Демек поэзия – ыр түзүлүшүнө ээ болгон чыгармалар."},{"t":"p","h":"Кыргыз элинин поэзиясы эзелтеден эле эпос, поэма жана ырларда өнүгүп келген. Поэзияны өзгөчөлөнтүп турган нерселер андагы ыргак (ритм) жана уйкаштык (рифма) болуп эсептелинет. Төмөндө ошолор тууралуу түшүнүк алабыз."},{"t":"p","h":"Ыргак – бул ырдагы бирдей муундардын жана ритмдик бөлүктөрдүн кайталанышы. Силерге түшүнүктүү болсун үчүн муундарды! «-» белгиси менен ажыратып, ал эми ритмдик бөлүктөрдү (муунактарды) // белгиси менен белгилеп алып, төмөнкү ыр саптарын карап көрөлү."},{"t":"p","h":"1. Түн бо-лор-до//эң ки-йин-ки //түн-дү а -лып 12 муун"},{"t":"p","h":"Түз жер-лер-ден//ки-йин ке-тип//му-нар-рык 11 муун Бул саптар 12-11 муундан жана үч ритмдик"},{"t":"v","l":["бөлүктөн турат.","2. У-луу марш//у-луу сын-га","Сал ба-рын//эч аян-ба","3. Дүйнө жүзүн // өрт алып","Кара жалын // каптады"]},{"t":"p","h":"7 муун, 2 ритмдик бөлүк 7 муун, 2 ритмдик бөлүк 7 муун, 2 ритмдик бөлүк"},{"t":"p","h":"7 муун 2 ритмдик бөлүк"},{"t":"p","h":"Уйкаш (рифма) – (грекче өлчөм, уйкаш) эки же андан ашык ыр саптарынын тыбыштык үндөштүгү, окшоштугу. Ал ырды кара сөздөн айырмалап, анын таасирдүүлүгүн, угумдуулугун күчөтөт. Кыргыз элинин кара сөз түрүндөгү речи да, эпостору да, поэзиясы да уйкаштыкка ыктап турат. Ошондуктан окумуштуулар В.В.Радлов, В. Виноградовдор да кыргыз тилинде музыкалуулук бар экендигин белгилешкен. Кыргыз поэзиясындагы уйкаштыктар эгиз (жуп), аттама (же кайчы), аксак, оромо, шыдыр уйкаш болуп бөлүнүшөт. Мисалы:"},{"t":"p","h":"1 Тыбыштык үндөштүк – созвучие звуков (сингармонизм). 2 Угумдуулугун – мелодичность"},{"t":"v","l":["<span class=\"pg\" data-n=\"138\">138<\/span>1. Эгиз уйкаш:","Айры белес, ач кайкан,","Алакандай көк тайпан,","Мында сары ала моюн сагызган,","Сандап жаткан көгүчкөн","Молдо Кылыч","2. Аксак уйкаш:","Мен тансам, жаштан танам, ырдан танбайм (а)","Ыры жок өмүрүмө канааттанбайм.","Кудайга миң мертебе калп айтсам да,","Ырыма бир мертебе калп айта албайм.","А.Осмонов","3. Оромо уйкаш:","Агын суудай жошоюн,","Өлүмдү жакшы көрсөңөр,","Экөөндүн бириң өлгүлө,","Өз атамдан артык кошоюн.","Элдик ыр","4. Шыдыр уйкаш:","Кырманын такыр чаптырган,","Ортого мамы кактырган,","Ак буудайды чачтырган,","Ай туяк менен бастырган.","Элдик ыр","5. Аттама (кайчы) уйкаш:","Аксай менен көк сайдай","Таш алышкан Бекбекей.","Арпа менен Буудайдай","Баш алышкан Бекбекей."]},{"t":"h3","h":"«Бекбекей»"},{"t":"p","h":"Эгерде жогорку ырды «Аксайга жайлоого чыктым. Арпа менен буудай күздө бышат» деген сүйлөмдөргө айлантсак, ритм да, рифма да сезилбегенин байкайсыңар. Демек булар поэзиянын тили эмес, прозанын тилине айланды. Поэзиянын жаралышы үчүн ритм менен рифма – эң зарыл каражаттар."},{"t":"h3","h":"СӨЗДҮК"},{"t":"p","h":"ыр – стих кара сөз – здесь проза Ыргак – кара сөздөн ырды айырмалап турган негизги белги. эзелтеден (байыртадан) – с давных пор, издревле"},{"t":"p","h":"<span class=\"pg\" data-n=\"139\">139<\/span>Элибиз – эзелтеден эле ыр жандуу калк."},{"t":"p","h":"муун – слог"},{"t":"p","h":"Кыргыз ырларында муун сандары туруктуу жана бекем. поэзия жаралыш үчүн – чтобы родилась поэзия"},{"t":"p","h":"Чыныгы поэзия жаралыш үчүн ыргакты жана уйкашты туура колдонуш керек."},{"t":"p","h":"сап (саптар) – строка (строки)"},{"t":"p","h":"Ыр саптарын рифма байланыштырат, – деген В. Маяковский."},{"t":"p","h":"1. Поэзия деген эмне? 2. А.Осмоновдун «Грунья Савельевнага», Ж.Бөкөнбаевдин «Кош, Алатоо, уулуң кетти майданга» аттуу ырларындагы ыргак жана уйкаштыктарды тапкыла. 3. Ыргакты жана уйкаштыкты кандай түшүндүңөр?"}],"sub":[{"title":"«Бекбекей»","b":25}],"pages":[136,139]},{"title":"КУСЕЙИН ЭСЕНКОЖОЕВ","blocks":[{"t":"h3","h":"КУСЕЙИН ЭСЕНКОЖОЕВ"},{"t":"p","h":"(1920-1941)"},{"t":"p","h":"Ар бир элдин адабиятында фантастика өтө кызыктуу жанр. Кыргыз элинин оозеки чыгармачылыгында эпостордо, уламыш-легендаларда, апыртма жана кереметтүү жомоктордо мифологиялык фантастиканын элемент-көрүнүштөрү бар экендиги жана улам өнүгүп келгендиги тууралуу түшүнүк алгансыңар"},{"t":"p","h":"Профессионал жазма адабиятыбыз жаралгандан баштап эле бул жанрды өнүктүрүүчү көркөм сөздүн өкүлдөрү чыкты."},{"t":"p","h":"Башкача айтанда, кыргыз профессионал фантастикасынын баштоочусу катары жазуучу Кусейин Эсенкожоевди эсептешет."},{"t":"p","h":"Жазуучу Ысыккөл областынын Жетиөгүз районундагы Ичкебулуң селосунда туулган. Кыргыз Мамлекеттик пединститутунда окуп жаткан кезинде Улуу Ата Мекендик согуш башталат. Өз каалоосу менен согушка кетип, 21 жашында согуштан баатырдык менен курман болот."},{"t":"p","h":"Ал жазуучулукка эрте аралашып, балдар үчүн кызыктуу фантастикалык чыгармаларды 30-40-жылдарда эле жараткан. Маселен, «Саякатчы бала», «Үчүнчү шар», «Родинанын уулу» деген илимий-фантастикалык чыгармаларды, «Канаттуулардын сыры», «Шарше», «Жалындуу жаштар» деген поэма, аңгеме, ырларды жазып калтырган."},{"t":"p","h":"1 Көркөм сөздүн өкүлдөрү – представители художественного слова. 2 Өз каалоосу менен – по своей воле. 3 Баатырдык менен курман болот – геройски погибает."},{"t":"p","h":"<span class=\"pg\" data-n=\"140\">140<\/span>Анын бул чыгармалары 1984-1989-жылдары кайрадан жарык көрдү. Ырас, жазуучунун фантастикалары азыркы учурдагы илим менен техниканын жетишкендигинен туруп караганда, оңойдой эле туюлушу мүмкүн. Бирок, ХХ кылымдын 30-жылдары үчүн алар кыйла эле салмактуу болгон."}],"sub":[],"pages":[140,140]},{"title":"ҮЧҮНЧҮ ШАР","blocks":[{"t":"h3","h":"ҮЧҮНЧҮ ШАР"},{"t":"p","h":"Мен бир күнү асманда калкып жүргөн жаандын бууларын, абада сызып жүргөн канаттуу куштардын учушун байкап, алардын асманга көтөрүлүп, учуп жүргөндүгүнүн себептерин таба албай көпкө ойлонуп жүрдүм."},{"t":"p","h":"Жер шарын курчап турган абадан жеңил бир буюм табуу үчүн аракет кыла баштадым. Аны мен көп китептерди окуп жана тажрыйба кылып гана таба алдым. Ал буюм асмандагы водород газы эле. Ал газ суу составынын үчтөн эки бөлүгүн ээлеп, жалпы абадан 14, 5 эсе жеңил экендиги белгилүү. Мен ал водород газын бир шарга толтуруп, оозун бууп, көккө кое бердим. Ал шарым жогорулагандан жогорулап, алыстай берди."},{"t":"p","h":"Мен экинчи шар жасап, ага белгилүү оордукту көтөртүүнү ойлодум. Бир күнү экинчи шарымды жасап бүтүп, өзүмдүн багып жүргөн итиме жакшылап үй жасап, терезе салып, тамак камдап, иттин дем алууга керектүү абасын даярдап, газга толгон шар менен чиркештирип, асманды көздөй кое бердим."},{"t":"v","l":["1 Ырас – здесь действительно, коне

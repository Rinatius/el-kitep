бага көтөрүлүп уча баштадым. Шар жерден алыстай берди. Жердеги кыбыраган жан-жаныбарлар кичирейгенден кичирейди. Бир аздан кийин эч нерсе көрүнбөй, белгисиз бир караңгы түнгө кезиге баштадым. Кайда жылып баратканымды сезе албадым, шарды токтото да албадым. Себеби, ал шарды башкаруучу менде тетик болбоду.Шардагы газды чыгарайын дейм, бирок корком. Себеби газды чыгаргандан кийин токтоосуз барып жерге тиеримди билемин. Кармоого эчтеке жок. Жалгыз гана кармалбаган абанын ичинде шар менен учуп бара жаткансыйм. Жер шарын тегерете курчаган абанын арасында кетип бара жаткан жандын бири мен гана болсом керек."},{"t":"p","h":"Күн нурун тосо албаган суюк аба менин дем алышыма да суюктук кылгансып, башым кеңгирей баштады. Бирок мен жолго чыкканымда абанын сейрек болушун эске алып, өзүм менен бирге дем алдыруучу коюу абадан запас кылып алган элем. Мен ошол запас аба менен дем алып келе жатам. Кыбыраган жан, шырп эткен дабыш жок..."},{"t":"p","h":"1 Белгисиз калың аба боштугуна – в неизведанное, загадочное пространство."},{"t":"p","h":"2 Кыбыраган жан-жаныбарлар- крохотные животные. 3 Кайда жылып баратканымды (жатканымды) – куда двигаюсь."},{"t":"p","h":"4 Токтоосуз барып – здесь без остановки (упаду)."},{"t":"h3","h":"<span class=\"pg\" data-n=\"142\">142<\/span>СӨЗДҮК"},{"t":"v","l":["түшүнүк алгансыңар – здесь приобрели понятие","жаралгандан баштап эле – начиная со дня создания","баштоочусу – основатель","К. Эсенкожоев – кыргыз фантастикасынын ...","1941-жылы согуш башталат.","калтырган – оставил"]},{"t":"p","h":"Жазуучу көп чыгармаларды ... Ринат тентектигин калтырды."},{"t":"v","l":["жаандын буулары – дождевые пары","... асманда калкыйт. Тамактын буусу чыкты.","сызып жүргөн канаттуулар – плавно летающие птицы","Асманда ... учушат. Дамир марага ... куштай келди,","Оксана үч бурчтук сызып койду.","жер шары – земной шар","абадан жеңил буюм – предмет легче воздуха","газга толгон шар менен – на шаре наполненный газом","чиркештирип – здесь прицепляя","Шарга уйду чиркештирдим.","шаймандарымды – инструменты, материалы (свои)","... салдым. Жыгач устанын ... көрдүк.","эч нерсе көрүнбөй – ничего не было видно","Түндө ... калат. Көзүмө ... жогол! .... эмес.","караңгы түнгө – к ночи","Ира, ... калбай мында кел.","жерге тием – грохнусь оземь.","Газды чыгарсам ...","Кубан ... катуу ... Антон жумшак ... секирди.","тегерете курчаган – окруженный со всех сторон","коюу аба – здесь нормальный для дыхания воздух","башым кеңгирей баштады – здесь начала болеть голова"]},{"t":"p","h":"сейрек (суюк) болушун эске алып – принимая во внимание то, что воздух будет разреженным"},{"t":"p","h":"1. Буга чейин фольклордук чыгармаларда кандай фантастиканын үлгүлөрүн (образцы) кездештирдиңер? Эске түшүргүлө. 2. К. Эсенкожоев ким экен жана ал кандай чыгармаларды жазган? 3. Фантастиканын дагы кандай өкүлдөрүн билесиңер, алардын чыгармаларын окудуңар беле? 4. Учурда детектив, боевик, триллер, приключения, ужас деген терминдерге ээ болгон чыгармалар фантастика менен окшошпу же айырмаланабы?"},{"t":"p","h":"1 Шырп эткен дабыш жок – (подр. Слово) не слышно ни звука."},{"t":"p","h":"<span class=\"pg\" data-n=\"143\">143<\/span>1. Чыгарманын бул бөлүгүн окуп чыгып, ойлонгула. Турмушта мындай окуялар болобу?"},{"t":"p","h":"2. Силер учсаңар кандай предмет менен учат элеңер? Анын түзүлүшү, шаймандары кандай болот эле, кыялданып көргүлөчү."},{"t":"p","h":"3. Төмөнкү омоним сөздөрдүн берген маанилерине көңүл бөлгүлө, орус тилине которгула жана түшүндүргүлө, омонимдерди табууну уланткыла."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>1. I жер шары (зат атооч) – II шар<\/td><td>(тууранды сөз)<\/td><\/tr><tr><td>2. I буу<\/td><td>(зат атооч) – II буу<\/td><td>(этиш)<\/td><\/tr><tr><td>3. I көк<\/td><td>(зат атооч) – II көк<\/td><td>(сын атооч)<\/td><\/tr><tr><td>4. I жарык<\/td><td>(зат атооч) – II жарык<\/td><td>(сын атооч)<\/td><\/tr><tr><td><\/td><\/tr><tr><td><\/td><\/tr><\/table><\/div>"},{"t":"h3","h":"Жолугушуу"},{"t":"p","h":"Аңгыча калың караңгылыктын арасынан кулагыма бир дабыш угулду. Бул дабыш санааны эчен түргө бөлдү."},{"t":"p","h":"Калың караңгылыкты жаңырткан үн жакындай берди. Бул эмненин үнү экен дегенсип, ага мен кулагымды тосуп тыңшадым. Ал үн кез-кезде арсылдап үргөнсүп кетет."},{"t":"p","h":"... Менин итим го деген үмүт менен аны атынан чакыра баштадым. Ит ого бетер дабышын күчөттү."},{"t":"p","h":"Аңгыча жогорулап бара жаткан шарым бир буюмга урунган сыяктанды. Итимдин дабышы жогору жактан чыккандыгы ачык айкындалды. Иттин шары үйүмдөн чыккан чырактын жарыгы менен көрүнө түштү. Ал ылдыйлап бара жаткан экен. Шардын газы азайып, куушурулуп бара жатат."},{"t":"p","h":"Терезеден колумду чыгарып, шарды кармай калдым. Кармаган шарымды өөдө тарттым да, андагы итти өз үйүмө чыгарып алып, шарды кое бердим. Ал жарылып калган экен. Шуулдаган бойдон жерди көздөй түшүп кетти. Итим мага эркелеп, кыңшылап жанды койбойт. Итке тамак бердим."},{"t":"p","h":"Шар кылкылдап, жогорулаганы токтолгон сыяктуу болуп сезилди."},{"t":"p","h":"1 Аңгыча – вдруг"},{"t":"v","l":["2 Жаңырткан үн – отзвук, эхо.","3 Арсылдап үргөнсүп – будто лаял.","4 Урунган сыяктанды – будто стукнулся, столкнулся.","5 Чырактын жарыгы – свет лампы.","6 Куушурулуп – здесь сжимается, начал сжиматься.","7 Өөдө (өйдө) тарттым – потянул в верх.","8 Эркелеп, кыңшылап – ласкаясь скулил."]},{"t":"p","h":"<span class=\"pg\" data-n=\"144\">144<\/span>Анын ылдыйлашы мени да кубандырды. Бирок бул шардын жарылгандыгынанбы же ит экөөбүздүн салмагыбызданбы? Көрсө, салмактын басышынан болуп чыкты. Жаш жүрөк кабына батпай алып учкандай болду. Итти ким билет. Ал айбан го, билеби, билбейби? Бирок ал да кубанычта экендиги сезилет."},{"t":"p","h":"Бир маалда калың караңгылык суюлгансып, ылдыйлаган сайын жарыктын шооласы көзгө көрүнө баштады. Бир маалда күндүн көзүн көрдүк. Биз менен амандашкансып, жарык нурун бизге чачырата тийгендей болду."},{"t":"p","h":"Бир кезде мунарланып тоо чокулары көрүндү. Мурда көрбөгөн, чокусун ак кар каптаган бийик тоого жакындап кирип келе жатыппыз. Бир аздан кийин шар эки жагы жалама кызыл чополуу жардын бооруна жакындай баштады. Анан көк чөптүү тектирчеге барып конуп калдык."},{"t":"h3","h":"СӨЗДҮК"},{"t":"p","h":"калың караңгылыктын арасынан – среди густой темноты"},{"t":"p","h":"Караңгылыктан бирөөнүн добушу угулду."},{"t":"p","h":"санааны эчен түргө бөлдү – (я) терялся в догадках, очень беспокоился. Санаага баттым. Санаа саргайтат, убайым картайтат (макал)."},{"t":"p","h":"кулагымды тосуп тыңшадым – здесь внимательно прислушивался, навострил уши"},{"t":"v","l":["ачык айкындалды – четко прояснилось, выяснилось","Аба ... күн жарык. ... түшүндүм. ... болду.","ылдыйлап бара жаткан экен – спускается вниз"]},{"t":"p","h":"Шарым баратыптыр. Ксения ... качты, Эрик өйдө качты. жарылып калган экен – оказывается разорвалось, продырявилось"},{"t":"p","h":"Шар ... калгандыгы чын. ... отунду жый! шуулдаган бойдон – быстро"},{"t":"v","l":["... төмөн кетти. Бактын","... Бекбарс ... жигит.","жогорулаганы токтолду – перестал подниматься","Шардын ... Асан быйыл аябай ..."]},{"t":"p","h":"жүрөк кабына батпай – здесь сердце ёкнуло, наполнилось радостью"},{"t":"p","h":"... сүйүндүм. Ал ... коркту."},{"t":"v","l":["жарыктын шооласы – луч света","","1 Салмагыбызданбы – от тяжести что ли."]},{"t":"p","h":"2 Караңгылык суюлгансып – будто темнота рассеялась (немного). 3 Күндүн көзүн көрдүк – увидели солнце."},{"t":"v","l":["4 Ак кар каптаган – белоснежный.","5 Кызыл чополуу жар – обрыв из красной глины."]},{"t":"p","h":"6 Тектирче – небольшое ровное место в высоких горах."},{"t":"p","h":"<span class=\"pg\" data-n=\"145\">145<\/span>мунарланып тоо чокулары – вершины гор, слегка опутанные мглой жакындап кирип келе жатыппыз – приближались Жерге ... Шаарга ... келдик. Тоого жакындаппыз."},{"t":"p","h":"1. «Үчүнчү шар» чыгармасынын негизги маанисин эмнеден көрдүңөр? 2. Чыгармадагы окуялар болуп өткөнбү же автордун фантазиясыбы? 3. Чыгармада сүрөттөлгөн окуяларда силерге тааныш жер аттары, же белгилүү тарыхый адамдар жолугабы? 4. Каармандын жел толтурулган шары жана анын жасап алган үйү силерге жактыбы? Азыр силер автордун шары менен саякатка чыгар белеңер, же учуунун башкача жолун ойлоп табар белеңер?"},{"t":"p","h":"1. Чыгарманы окуп чыгып, мазмунун түшүнгүлө. Силер буга чейин окуган фантастикалык чыгармалар менен салыштыргыла."},{"t":"p","h":"2. Каармандын шарын жана жасап алган үйүн элестетип сүрөтүн тарткыла. Өзүңөр башка планетага учуучу космостук аппаратты кандай конструкциялайт элеңер? Моделин жыгачтан же пластилинден жасап көргүлө."},{"t":"p","h":"3. Чыгармадагы кездешкен түшүнүксүз терминдерди жана аталыштарды белгилеп алып, сөздүктүн жана мугалимдин жардамы менен алардын маанисин чечмелегиле."},{"t":"p","h":"4. Фантастикалык кичине чыгарма жазууга аракет кылгыла."},{"t":"p","h":"5. Бул чыгарманын текстинен тактоочторду тапкыла. Алардын кайсы тактооч экендигин көрсөткүлө жана суроолорун бергиле."},{"t":"p","h":"Үлгүсү: Күн жарык нурун чачырата тийди. (сын-сыпат тактооч, кандай)."},{"t":"p","h":"Мен водород газын шарга толтуруп, көккө кое бердим (орун тактооч, кайда?)."},{"t":"h3","h":"Силер билесиңерби?"},{"t":"p","h":"С поверхности соленого Мирового океана испаряется около 86 % всей влаги, при этом вода испаряется пресная."},{"t":"p","h":"В 1961 году 12 апреля первый раз в мире Юрий Алексеевич Гагарин на спутнике «Восток» пролетел вокруг Земного шара."},{"t":"h3","h":"ТҮШҮНДҮРМӨ СӨЗДҮК"},{"t":"p","h":"водород газы – суутек газы. Жеңил, түссүз, жытсыз газ. Абадан 28 эсе жеңил. Салмагы 1,008. Суунун составы суутек жана кычкылтек газынан турат. Эки газ тең күйүүгө жөндөмдүү."},{"t":"p","h":"абанын суюк катмары – абаны түзүп турган составдык элементтердин нормалдуу шартта турушу"},{"t":"p","h":"<span class=\"pg\" data-n=\"146\">146<\/span>мунарланып (мунарыктап) – мгла, атмосферанын төмөнкү катмарынын абада калкып жүргөн катуу бөлүкчөлөрдүн (чаң, түтүн ж.б.) көп болушунан бозомук тартышы. Талаа менен чөлдөрдө, чым көң өрттөнгөндө жана жанар тоо атылганда да пайда болот."},{"t":"p","h":"килограмм – массанын эл аралык системада аталыш бирдиги, белгилениши – кг. Килограмм чен жана салмактын эл аралык бюросунда сакталуучу эл аралык эталондун массасына барабар."},{"t":"h3","h":"АДАБИЯТ ТЕОРИЯСЫНАН"},{"t":"h3","h":"Фантастика жөнүндө түшүнүк"},{"t":"p","h":"Фантастика (грекче – кыялдануу өнөрү) илим менен техниканын өнүгүшүнө байланыштуу али боло элек окуялар жөнүндө ойдон чыгарылып жазылган чыгармалар. Аларда баяндалган окуя, көрүнүштөр кийин турмуш жүзүнө ашышы да, ашпай калышы да мүмкүн. Бул жанрда иштеген сүрөткерлердин илимий ой өрүштөрү, таанымдары кенен болушу керек."},{"t":"p","h":"Дүйнөлүк адабиятта, Жюль Вернди фантастикалык жанрдын классиги катары туу тутушат. Орус адабиятында К.Э.Циолковский, В.А. Обручев, В.И. Белов, В.П. Астафьев, Кир Булычев, Туве Янссон жана башка жазуучулар илимдин бүгүнкү жетишкендиктерине таянып, мыкты фантастикалык чыгармаларды жаратышкан. Кыргыз адабиятында фантастикалык көркөм чыгармаларды К. Эсенкожоев, К.Жантөшев, Б.Сартов ж.б. жаратышкан. Силер жогоруда К.Эсенкожоевдин «Үчүнчү шар» чыгармасынан үзүндү окудуңар. Бул чыгарма 30-жылдардын көркөм туундусу. Демек, ошол мезгилдин көз карашында жазылганын да байкадыңар болуш керек."},{"t":"p","h":"Илим-техниканын өсүшү жашоо-турмуштун жогорулашы менен адабиятта фантастикага болгон кызыгуу күч алды. Азыркы учурда көркөм адабиятта илимий фантастикалар кеңири жаралып жатат."},{"t":"v","l":["Али боло элек – еще не завершившиеся.","Ойдон чыгарылган – выдуманные","Туу тутушат (таанышат) – признают"]}],"sub":[{"title":"Силер билесиңерби?","b":62},{"title":"ТҮШҮНДҮРМӨ СӨЗДҮК","b":65}],"pages":[141,146]},{"title":"ЖАЛИЛ САДЫКОВ (1932-жылы туулган)","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"147\">147<\/span>ЖАЛИЛ САДЫКОВ (1932-жылы туулган)"},{"t":"img","src":"data:image/webp;base64,UklGRqAGAABXRUJQVlA4IJQGAABQRwCdASruAL0APq1MmkmyJK4msRsrmkAViWlt2YDE9XxzqPCRAsw2Hk+/BHaT/3+tbLPqUJgPHH8F1LrYQivWu4+qljrE4yxr3w4EgRyGVPYEn2L4U4RiAwfrzeyfAj8sUTcaVrczWl/XNbAeKCsRebh9Qb+/xcmAxWroNH0tMx0wvaS ва на все (не страшась даже смерти)"},{"t":"p","h":"... бардык эне кам көрөт. Алар бул жерге кыштап, жаздап ... анан көчүшчү. Махмуд өлө тойду."},{"t":"v","l":["тигил экөөн карап туруп – смотря на них (двоих)","... энеси менен баласы. Аларды ... калдык."]},{"t":"p","h":"Камкоордугу – заботливость."},{"t":"p","h":"Мээрмандыгы – милостивость."},{"t":"p","h":"Тыбырчылап – здесь трепещут."},{"t":"p","h":"Алысыраак – подальше."},{"t":"p","h":"Балапан – птенец."},{"t":"p","h":"Сук (ачкөз) болчу – был прожорливым, ненасытным."},{"t":"p","h":"Шок (тентек) болчу – был озорником."},{"t":"p","h":"Чыйпылдап – пищать."},{"t":"p","h":"Жан талашып – здесь из зо всех сил."},{"t":"p","h":"Жем тиштеп – принося корм"},{"t":"p","h":"Тиги четтен – от того края."},{"t":"p","h":"Канат жаскап – машет крыльями."},{"t":"p","h":"Эне мээри (мээрими) – материнская любовь."},{"t":"p","h":"Өткөндөн – от былых (прошлых) времен."},{"t":"p","h":"Эске түштү – вспомнил."},{"t":"p","h":"1. Жалил Садыков деген ким экен жана анын кандай чыгармалары бар экен? 2. «Эненин жүрөгү» чыгармасынын мазмуну жана идеясы эмнеде деп баамдадыңар? 3. Чымчыктын балапаны кандай эле? 4. Ал кантип жерге кулап түштү? 5. Энеси баласын кантип коргоду? 6. Бул окуя эмнени эске түшүрдү?"},{"t":"p","h":"1. Чыгарманын бул бөлүмүн окуп чыккыла. Үч куплетин жаттап, аны кырааты менен көркөм айтууга көнүккүлө."},{"t":"p","h":"2. Төмөнкү сөздөрдү таяныч-булак кылып алып, бул бөлүмдүн мазмунун кара сөз түрүндө баяндап бергиле: аялзатынын акылмандыгы, баласына, күйөөсүнө, камкордугу. мээримдүүлүгү, темир канат, сук болчу, чыйпылдап, чебеленип, жерде, селт этип, боюн таштап, чырылдап, бах чиркин, бир уламыш."}],"sub":[],"pages":[148,149]},{"title":"Жоо менен болгон кармаш","blocks":[{"t":"h3","h":"Жоо менен болгон кармаш"},{"t":"v","l":["II","Жоо менен ай талаада кырчылдашып,","Сугарып жерди канга чылпылдатып.","Биздин эл кайра сүрүп баратканда,","Кылычтап туш келгенин бырчылдатып.","Кырылып өлгөндөрдөн калбай кемип","Кайрадан кол куралат жоого келип.","Кайрадан калкандарга тийген жебе","Кадимки мөндүргө окшойт себеленип.","Келген жоо келе берип бүтөр эмес,","<span class=\"pg\" data-n=\"150\">150<\/span>Жоокерлер буга чыдап түтөр эмес.","Ангыча, калгандарга дароо тарайт","Чепке кир, коргонгула! – деген кеңеш.","Жоокерлер аргасыздан чепке кирет.","Чеп бийик, куш өтпөгөн темир тирек!","Жабылат жоону тосуп дарбазалар —","Жасалган күмүш ширеп, болот ширеп.","Душмандар чепти айланта курчап алып,","Жол таппайт ары барып, бери барып.","Илинсе чыксак дешет аркан салып,","Ыргытса кулач жетпейт колдор талып.","А бирок күндөр өттү, айга кетти...","Ашынып хандын каары чекке жетти!","Сыягы, суусуз жатып өлсө дагы","Бир адам ачып берер эмес чепти.","Бул кезде сактап алган суулар бүтүп,","Акыркы тамчыларды тең бөлүшүп,","Жатышты чептегилер айла таппай,","Жашоодон биротоло үмүт үзүп."]},{"t":"h3","h":"СӨЗДҮК"},{"t":"v","l":["ай талаада кырчылдашып – схватившись в поле","Душман менен ... кармашты. ... кал – деп каргады.","сугарып жерди канга – поливая землю кровью.","Ирина гүлдү .... Руслан ... казды. ... .... сугарылды.","туш келгенин – всех кто подвернется (встретится)","... бырчалады. Ушул тема ... карасаң!","кайра сүрүп баратканда – (когда) обратно погнали назад","Жоону ... сүрдүк. Шамал булутту ... кетти. Койду жайытка","... кой. Тактайды ...","кол куралат – соберутся войска","Тез эле ... Шахзаданын ... сулуу. Душман ... салды.","мөндүргө окшойт себеленип – здесь нахлынулись подобно граду","Жебелер ... Тоолорго ... түштү. Майда кар ...","<span class=\"pg\" data-n=\"151\">151<\/span>түтөр эмес (чыдар эмес) – выдержать.","Көп жоого ... Суу арча түтөөр эмес.","«коргонгула» деген кеңеш – (дают) совет «защищайтесь»"]},{"t":"p","h":"куш өтпөгөн (өтө албаган) темир тирек – непроходимый железный занавес"},{"t":"v","l":["... дарбаза. Агасы инисине ....","жоону тосуп дарбазалар – ворота преградили путь.","Аскерлер ... чыгышты. Дарбазалар ..... жабылды.","күмүш ширеп, болот ширеп – закаляя сталь."]},{"t":"p","h":".... жасалган кашык. ... жасалган кылыч. Күмүш – кыздын аты. Болот – баланын аты."},{"t":"p","h":"айланта курчап алып – окружив со всех сторон"},{"t":"p","h":"илинсе чыксак дешет – взобраться зацепившись (за что либо)."},{"t":"p","h":"кулач жетпейт – размах недосягаем."},{"t":"v","l":["хандын каары чекке жетти – хан очень разгневался","үмүт (күдөр) үзүп – потеряли надежду."]},{"t":"p","h":"Суусуз эл жашоодон .... Жолоочу түндө жанынан .... койду."},{"t":"p","h":"Чылпылдатып (чылпылдата) – сделав мокрым."},{"t":"p","h":"Бырчылдатып (бырчалап) – рубя на куски."},{"t":"p","h":"Кырылып өлгөндөрдөн – вместо павших (в бою)"},{"t":"p","h":"Бүтөр эмес – нескончаем"},{"t":"p","h":"Дароо тарайт – мигом распространяется"},{"t":"p","h":"Чепке кир – здесь заходите в крепость"},{"t":"p","h":"Аргасыздан – здесь вынужденно"},{"t":"p","h":"Жол таппайт – не могут найти дорогу (проход)."},{"t":"p","h":"Аркан салып – по веревкам,"},{"t":"p","h":"Сыягы – видимо."},{"t":"p","h":"Ачып берер эмес – не откроет,"},{"t":"p","h":"Акыркы тамчыларды – последние капли."},{"t":"p","h":"Биротоло – навсегда, окончательно."},{"t":"p","h":"1. Эл жоо менен кандай кармашып жатты эле? 2. Душмандын көп колуна туруштук бере албаган эл кайда жашынды? 3. Жоо чептен өтө алдыбы? 4. Эл айлар өтсө да кандай күрөштү? (как боролись). 5. Суусуз күрөштү улантуу (продолжит борьбу) мүмкүн беле?"},{"t":"p","h":"Экинчи бөлүктү окуп чыгып, суроолор боюнча жооп берүүгө камдангыла. Силерге таяныч сөздөр (опорные слова) төмөнкүлөр: кырчылдашып, жерди канга сугарып, калкан, жебе, чеп, темир тирек, жабылат, курчап алат, ыргытса жетпейт, айлар өтөт, суусуз, үмүт үзөт."}],"sub":[],"pages":[150,151]},{"title":"ХАНДЫН АМАЛЫ ЖАНА ЭНЕЛЕРДИН ЖҮРӨГҮ","blocks":[{"t":"h3","h":"ХАНДЫН АМАЛЫ ЖАНА ЭНЕЛЕРДИН ЖҮРӨГҮ"},{"t":"v","l":["Хан сыртта, өз алдынча ойго келди:","«Минткенде ала албаймын чептеги элди.","А көрөк, бир амалын табайын» – деп,","Жарчыга мына мындай буйрук берди:","– Угузгун буйругумду, кылгын маалым,","Кирсем да чептегинин кырбайм баарын.","Аялдар чепти таштап сыртка чыксын!","Көтөрүп ала кетсин каалаганын.","Өлүм жок аялдарга! Айткын барып, –","Дегенде жарчы кетти, айгай салып.","<span class=\"pg\" data-n=\"152\">152<\/span>Чептеги эл, кары дебей, жашы дебей","Дүрбөдү хан жарлыгын угуп алып...","Эртеси, бүт аялдар таңга жакын","Ачышты бийик чептин дарбазасын.","Бул кызык! Чептегинин бири калбайт,","Ким калат, кимдер менен кармашасың!?","Арчындап күйөөлөрүн таңып жонго,","Балдарын ороп-чулгап алып колго,","Элейип карап турган хандан оолак,","Энелер чубап барат оңго-солго.","Хан тиктеп кыжырлана эки жагын.","Акыры: «Жаңылдым!» – деп чапты санын.","«Сөз бирөө! Бекер айткан экенмин ээ,","Көтөрүп ала кет деп каалаганын!»","Сөз бирөө, хан буйругу болбойт эки","Хан үчүн сөзүн бузуу болор чеки.","Чубаган энелерди карап туруп,","Тултуйду чыдай албай эки бети.","Анткени, өзү келди уруш баштап,","Кыргынга өзү күбө, өзү каскак.","Ойлонсо, өзүн дагы эне тууган,","Энелер кетип барат чебин таштап...","Көргөндө энелердин аккан жашын","Чыдабай бура тартты аттын башын.","Энелер адам таппас акыл менен","Ушинтип кайтарыптыр келген касын.","Бул өзү бир уламыш ... Өзүң кара,","Энелер жанын берет дале сага.","Дагы эле эрдин жүгү аялдарда,","Дагы эле колдон түшпөйт бардык бала..."]},{"t":"h3","h":"<span class=\"pg\" data-n=\"153\">153<\/span>СӨЗДҮК"},{"t":"p","h":"өз алдынча ойго келди – пришел к мысли"},{"t":"p","h":"Алик ... ойлонду."},{"t":"p","h":"Мугалим окуучуларга ... иштеп келүүгө тапшырма берди."},{"t":"p","h":"ала албаймын (карата албайм) – не могу подчинить"},{"t":"v","l":["Чепти ... деп ойлонду. Анжелика ... деди.","бир амалын табайын – найду какой-нибудь выход","... акылын ... – деп ойлонду. ... тапты.","буйругумду кылгын маалым – объяви (мой) приказ","Хан ... берди, жарчы ... кылды.","кырбайм баарын – не уничтожу всех","Элди ... Казанды ... жууш керек."]},{"t":"p","h":"көтөрүп ала кетсин каалаганын – пусть чего хотят заберут с собой"},{"t":"p","h":"өлүм жок аялдарга – нет смерти женщинам"},{"t":"v","l":["дүрбөдү (дүрбөштү) – переполошились, заметались","Элдер дүрбөштү. Класстагы балдар ...","бийик чептин дарбазасын – ворота высокой крепости","чептегинин бири калбайт – никого не осталось в крепости"]},{"t":"p","h":"Чепте бирөө да калбады. Класста эч ким калган жок."},{"t":"p","h":"кимдер менен кармашасың – с кем будешь сражаться"},{"t":"v","l":["күйөөлөрүн таңып жонго – привязав мужей на свои спины","ороп-чулгап – окутав. Аялдар балдарын ... – ..."]},{"t":"p","h":"чубап барат оңго-солго – растянувшись медленно двинулись налево и направо"},{"t":"v","l":["кыжырлана эки жагын – разъяренно озирясь по сторонам","жаңылдым – ошибься","хан буйругу болбойт эки – хан говорит один раз"]},{"t":"p","h":"сөзүн бузуу болоор чеки – нарушить свое слово (хану) нельзя"},{"t":"p","h":"бура тартты аттын башын – повернул коня"},{"t":"v","l":["адам таппас акыл менен – мудростью","Алар ... элди сактап калышат."]},{"t":"p","h":"Сыртка чыксын – пусть выйдут (из крепости)."},{"t":"p","h":"Дегенде (деп айтканда) – когда он так сказал."},{"t":"p","h":"Таңга жакын – к утру."},{"t":"p","h":"Арчындап – привязав (себе на спину)."},{"t":"p","h":"Элейип карап – здесь растерянно смотрел."},{"t":"p","h":"Сөз бирөө – здесь мое слово твердо."},{"t":"p","h":"Тултуйду – надулся."},{"t":"p","h":"Эне тууган – мать родила."},{"t":"p","h":"Аккан жашын – омытое горькими слезами."},{"t":"p","h":"Касын (душманын) – врага своего."},{"t":"p","h":"Жанын берет – отдадут жизнь."},{"t":"p","h":"1. Чыгарманын үчүнчү бөлүгүндө эмне жөнүндө баяндалат? 2. Хан кандай ойго келди жана кандай буйрук кылды? 3. Эртеси таңда эмне окуя болду? 4. Хан эмне үчүн чыгып бараткан элди кырган жок? 5. Энелердин акылы туурабы?"},{"t":"p","h":"1. Чыгарманы бүт окуп чыгып, анын мазмунун көркөм айтууга көнүккүлө. Үчүнчү бөлүмдөгү таяныч сөздөр: ойлонду, карата албайм, акыл табайын, буйрук, жарыя кыл, аялдар кетсин, каалаганын, дүрбөштү, арчындап, ороп-чулгап, элейип, тултуйду, өзү күбө, өзү каскак, касын."},{"t":"p","h":"2. «Менин апамдын мээрими» деген темада дилбаян жазгыла."},{"t":"p","h":"3. Чыгармадагы автордун оюнан, хандын сөзүнөн жаттагыла, аны көркөм айтып бергиле."},{"t":"p","h":"4. Хандын сөзү эмне үчүн эки болбошу керек экендигин аргументтеп айтып бергиле."},{"t":"h3","h":"<span class=\"pg\" data-n=\"154\">154<\/span>Түшүндүрмө сөздүк"},{"t":"p","h":"темир канат – балапандын канат жүнчөлөрү пайда болгон учуру."},{"t":"p","h":"жарчы (глашатай) – кандайдыр бир кабарды элге жарыялоочу, жар чакыруучу адам."},{"t":"p","h":"каскак: 1) учунда темири жок жыгач найза, кээде учуна курч темир ашталган найзаны да «каскак» дей берет; 2) жолтоо, тоскоол."},{"t":"p","h":"калкан (шит) – жоокерчиликте найза, кылыч тийбесин деп тосуу үчүн колдонулуучу металлдан жасалган согуштук курал."},{"t":"p","h":"эрдин жүгү аялдарда – мужская ноша на женских плечах баласынын, күйөөсүнүн милдет, жумуштары аялдардын мойнунда деген мааниде."},{"t":"p","h":"1. Жогорку поэманы окуп чыгып, өзүнөр жактырган жеринен 3 куплетин жаттагыла, аны көркөм, так, шар айтууга көнүккүлө. Поэманын мазмунун кыскача жана толук айтууга көнгүлө."},{"t":"p","h":"2. Тактоочту эске түшүргүлө.Төмөнкү сүйлөмдөрдөгү көп чекиттин ордуна тактоочту билдирүүчү кашаадагы сөздөрдү коюп чыккыла:"},{"t":"p","h":"Ал балапан ... жатыптыр. ... чочуду. Душман ... жыйнала берди. Алар алдары жетсе ... басып алышмак (нары четте, бүгүн деле, селт этип, аз-аздан)."},{"t":"p","h":"3. Санжыргалуу сөз берметтерин жазып, жаттап алып сүйлөө кебинде колдон:"},{"t":"p","h":"Белгиленген сөздөргө өзгөчө көңүл бөл: Отко түшчү көпөлөктөй, эне мээрими, күмүш шире, болот ширеп, арчындап, ороп-чулгап, элейип, өзү күбө, өзү каскак, адам таппас акыл менен, эрдин жүгү аялдарда."},{"t":"p","h":"4. Бул куплеттеги ыргакты жана уйкаштыкты тапкыла:"},{"t":"v","l":["Ошондон жерди карай боюн таштап,","Шуу этип чөпкө түшүп канат жазгап,","Айланат отко түшчү көпөлөкчө,","Чырылдап баласы үчүн өлө жаздап."]},{"t":"p","h":"5. Поэманын мазмунун кара сөзгө айландырып, комментарийлеп, логикалуу баяндама жазгыла. Баяндамаларыңарга тема жана темача койгула. Чыгарманын идея, мазмунуна жараша эпиграф тапкыла."},{"t":"h3","h":"Макалдарды эсиңерге түйгүлө!"},{"t":"p","h":"«Энеге баланын алалыгы жок», «Аял жакшы – эр жакшы». «Эне акылы – эл үчүн, эл акылы – жер үчүн». «Эркектин миң акылынан, аялдын бир айласы өтөт»."}],"sub":[{"title":"Түшүндүрмө сөздүк","b":35}],"pages":[152,154]},{"title":"ТЕКСТТЕРДЕ КЕЗДЕШКЕН МАКАЛ-ЛАКАПТАРДЫН КЫРГЫЗЧА-ОРУСЧА СӨЗДҮГҮ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"155\">155<\/span>ТЕКСТТЕРДЕ КЕЗДЕШКЕН МАКАЛ-ЛАКАПТАРДЫН КЫРГЫЗЧА-ОРУСЧА СӨЗДҮГҮ"},{"t":"p","h":"Абийириңди жашыңдан сакта – береги честь с молоду."},{"t":"p","h":"Абийирдүү жигитке ажалдуу кийик жолугат – букв. Скромному парню (охотнику) попадается кийик, которому суждено умереть."},{"t":"p","h":"Адалсынган молдонун үйүнөн алты камандын башы чыгыптыр – В юрте святошествующего муллы обнаружилось шесть кабаньих голов."},{"t":"p","h":"Айдаганы беш эчки, ышкырыгы таш жарат – Дел мало, зато шуму много."},{"t":"p","h":"Айла алтоо, акыл жетөө – букв. Хитрость – шесть, (а) ум – семь (т.е. ум сильнее хитрости)."},{"t":"p","h":"Акылы аздын азабы көп – У кого ума мало, у того мучений много"},{"t":"p","h":"Алыстагы душмандан аңдып жүргөн дос жаман – Подсиживающий друг хуже врага"},{"t":"p","h":"Алгандын бермеги бар – Долг платежом красен"},{"t":"p","h":"Аракет кылсаң берекет – Без труда не выловишь и рыбку из пруда"},{"t":"p","h":"Ат – эрдин (адамдын) канаты – Конь – крылья молодца."},{"t":"p","h":"Аталуу жетим – арсыз жетим, энелүү жетим – эрке жетим – При отце сирота – непутевый, при матери сирота – боловень"},{"t":"p","h":"Атың барда – жер тааны, Атаң барда – эл тааны – Когда у тебя есть конь – познай землю, пока у тебя есть отец – познай народ"},{"t":"p","h":"Ач кадырын ток билбейт – Сытый голодного не разумеет."},{"t":"p","h":"Ачка олтургандан көрө айранга нан чылап жеген жакшы (л) – Под лежачий камень вода не течет."},{"t":"p","h":"Бай – бармак менен, жок – дарман менен – Богач – приказом, а бедный – мощью."},{"t":"p","h":"Байды балакет басса, жортуул баштайт – Когда на бая дурь накатит, он на грабежи пускается."},{"t":"p","h":"Байлык атасы – эмгек, энеси – жер – Отец богатства – труд, мать – земля."},{"t":"p","h":"Балалуу үй гүлүстөн, баласыз үй – гөрүстөн – букв. Дом с детьми – цветник, бездетный дом – кладбище."},{"t":"p","h":"Бир жолу даам сызган жериңе, миң жолу салам бер – За добро отвечай добром."},{"t":"p","h":"Бирде жигит жөө жүрөт, бирде жигит төө минет – Настоящему джигиту суждено испытать на себе взлеты и падения (букв. Молодец пешком ходит, то на верблюде ездит)."},{"t":"p","h":"Биринчи байлык – ден соолук, экинчи байлык – ак жоолук, үчүнчү байлык – жүз соолук – Первое богатство – здоровье, второе богатство – жена, третье богатство – сто овец."},{"t":"p","h":"Билеселүү жигитке өсүп-өнгөн эл кымбат, ардактаган жаныңдан, асыл Мекен жер кымбат – Для умного парня хорошо то место, где он родился и вырос."},{"t":"p","h":"Бөрү азыгы – мурдунда, жылкы азыгы – туягында – Волк добывает пищу зубами, конь копытами."},{"t":"p","h":"Душмандын сырты жылма, ичи кара – На вид враг любезен, а нутро черное."},{"t":"p","h":"Жакшы уул элине баш болот, жаман уул элине кас болот – Хороший сын заботится о народе, плохой сын враждует с народом."},{"t":"p","h":"Жакшыдан жаман туулса – чыгаша, жамандан жакшы туулса – киреше – От хорошего родится дурной – убыток, от дурного родится хороший – польза."},{"t":"p","h":"Жакшынын шарапаты, жамандын кесепети – От хорошего – благородство (пристанет), от дурного – пакость"},{"t":"p","h":"Жалкоонун жан жыргатары – уйку менен түш, жан кууратары – эмгек менен иш – Для ленивого сон – благодать, труд – мучение."},{"t":"p","h":"Жаш келсе ишке, кары келсе ашка – Молодцу – работы давай, старому – пищу."},{"t":"p","h":"Жашыл өңөт, жаш чоңоёт – Зеленое – полиняет, а молодое – вырастет."},{"t":"p","h":"Жел болбосо чөптүн башы кыймылдабайт – Ветерок не подует, трава не пошевелится; Нет дыма без огня."},{"t":"p","h":"Жигит үйдө туулат, жоодо өлөт – Молодец рождается дома, а умирает на войне."},{"t":"p","h":"<span class=\"pg\" data-n=\"156\">156<\/span>Жигитке намыс кымбат, ар кыйын – Молодцу честь дорога, стыд унизителен."},{"t":"p","h":"Жоктун жону катуу, өгүздүн мойну катуу – У бедняка спинной хребет тверд, у быка шея крепка."},{"t":"p","h":"Жокчулук уят эмес, байлык мурат эмес – Бедность не позор, богатство не цель."},{"t":"p","h":"Жолоочунун жолдогусу жакшы, жолдо болбосо үйдөгүсү жакшы – Путник хорош в пути, а если не в пути, хорош он дома."},{"t":"p","h":"Иштебеген тиштебейт – Кто не работает, тот не ест."},{"t":"p","h":"Кандар өтөт – калк калат, бетеге кетет – бел калат – Цари уходят, народ остается, типчак сойдет, склон горы останется."},{"t":"p","h":"Карындагы баланын кан болорун ким билет, бешиктеги баланын бек болорун ким билет – Будет ли ханом ребенок, находящийся в утробе, будет ли беком младенец в колыбели – как знать?"},{"t":"p","h":"Касапчы энесине сөөк сатат – Мясник (даже) своей матери кости продает."},{"t":"p","h":"Кетмен менен иштебей, нанды кайдан табасың – Без труда хлеб не добудешь."},{"t":"p","h":"Кой каргышы бөрүгө жетпейт – Проклятие овцы на волка не действует."},{"t":"p","h":"Короонду сак бол, коңшуңду ууру тутпа – Свой загон оберегай, соседа вором не считай."},{"t":"p","h":"Мугалим – мөмөлүү дарак – Учитель – дерево с плодами."},{"t":"p","h":"Мурун чыккан кулактан, кийин чыккан мүйүз озуптур (лакап) – Рога появившиеся после, опережают уши, младший может опередить старшего."},{"t":"p","h":"Окуу – билим азыгы, билим – ырыс казыгы – Учение – источник (букв. пища) знания, знание – основа (букв. кол) благополучия."},{"t":"p","h":"Өзөктөн күйгөн өрт жаман, өздөн чыккан жат жаман – Страшен (букв. дурак) пожар из нутра, страшен чужак из своих."},{"t":"p","h":"Өлгөн аттын такасын издеп, бир бай алты ай жер кезген – Жадный бай шесть месяцев искал подкову сдохшего коня."},{"t":"p","h":"Өнөр алды – кызыл тил – Высшее искусство – красноречие. (букв. красный язык)."},{"t":"p","h":"Сагызган сактыгынан өлбөйт, суктугунан өлөт – Сорока умирает не от осторожности, а от жадности."},{"t":"p","h":"Санаа саргайтат, убайым картайтат – Забота сушит, беспокойство старит."},{"t":"p","h":"Санаасы жок – уйкучул, акылы жок – күлкүчүл – Беззаботный – сонлив, глупый (или бесстыдный) смешлив."},{"t":"p","h":"Тегин жерден өрт чыкпайт – Нет дыма без огня."},{"t":"p","h":"Тоогун жесең, каз байла – Угостившему курицей, готовь гуся."},{"t":"p","h":"Токмок күчтүү болсо, кийиз казык жерге кирет – От молота гвоздь в стену лезет (букв. если колотушка сильна, то войлочный кол в землю войдет)."},{"t":"p","h":"Тоону, ташты сел бузат, адамзатты сөз бузат – Горы и камни сели разрушают, а людей слова (ложь, клевета)."},{"t":"p","h":"Туулган жердин топурагы алтын – И дым отечества нам сладок и приятен."},{"t":"p","h":"Уулуң өссө – урумга, кызың өссө – кырымга – Если сын у тебя вырастет – в родню (род продолжит), если дочь вырастет – в даль (уйдет)."},{"t":"p","h":"Уяда жаткан жумуртка, асманда учкан куш болот – Лежащее в гнезде яйцо, станет летающей в небе птицей."},{"t":"p","h":"Шаршенче кайталап – Не повторяй одно и то же тысячу раз, как Шаршен."},{"t":"p","h":"Шодокондун бүркүтүндөй жутунган – Не жадничай чрезмерно (по преданию беркут Шодокона держал в левой лапе одну лисицу, в правой – другую, в клюв – третью, а глазами зарился на пробегавшую мимо четвертую)."},{"t":"p","h":"Эр башына күн түшсө, өтүгү менен суу кечет, ат башына күн түшсө, ооздугу менен суу ичет – Свалится на молодца беда, он через воду в сапогах пойдет, свалится на коня беда, он с удилами воду пьет."},{"t":"p","h":"Эл – мазар, элден чыккан – азар – Народ священ, оторвавшийся от народа заблудится."},{"t":"p","h":"Экинин бири кыдыр – Поверье; хизр, каждый второй."},{"t":"p","h":"Эмгегиң катуу болсо, тапканың таттуу болор – Кончил дело – гуляй смело."},{"t":"p","h":"Эр ортону – элүү жаш – Средний возраст мужчины – пятьдесят лет."},{"t":"p","h":" <span class=\"pg\" data-n=\"157\">157<\/span>Эр достугу – эгиз, эл достугу – деңиз – Дружба богатырей – двойня, дружба народов – море."},{"t":"p","h":"Эр жигит эл четинде, жоо бетинде – Храбрый молодец (всегда) на границе страны, перед лицом врага."},{"t":"p","h":"Эр жигиттин жакшысы, эл камы үчүн кам урат – Умный молодец, о народе заботится."}],"sub":[{"title":"Жигитке намыс кымбат, ар кыйын –","b":33}],"pages":[155,157]},{"title":"ФРАЗЕОЛОГИЗМДЕРДИН КЫРГЫЗЧА – ОРУСЧА СӨЗДҮГҮ","blocks":[{"t":"h3","h":"ФРАЗЕОЛОГИЗМДЕРДИН КЫРГЫЗЧА – ОРУСЧА СӨЗДҮГҮ"},{"t":"h3","h":"А"},{"t":"p","h":"Абийрин (айрандай) аштай төгүү – Клеймить позором"},{"t":"p","h":"Жер жеберине жетүү – Пригвоздить к позорному столбу."},{"t":"p","h":"Абийири кетүү, абийири күлдөй төгүлүү – Оказаться в дураках."},{"t":"p","h":"А-бу дегиче, айтып оозду жыйгыча – С часу на час."},{"t":"p","h":"Адам катарына кошуу – Поставить на ноги; поднимать на ноги."},{"t":"p","h":"Адалдан түгү жок – Гол как сокол."},{"t":"p","h":"Айран таң калуу – Вытаращить глаза."},{"t":"p","h":"Айырмасы асман менен жердей – Как небо и земля."},{"t":"p","h":"Ак сөөк (ата-бабасы, хан, бек болгон, эл бийлеген адам) – Белая кость, высший свет, аристократ."},{"t":"p","h":"Ак-карасына жетүү – Вывести на чистую воду."},{"t":"p","h":"Акылы тайкы, ала өпкө – Ограниченный ум, неограниченное хвастолюбие."},{"t":"p","h":"Ак таңдай, жез таңдай – Красноречивый."},{"t":"p","h":"Акылдан адашуу; акылынан айнуу – С ума сойти."},{"t":"p","h":"Акылга дыйкан – Ума палата."},{"t":"p","h":"Ак сөз – Честное слово."},{"t":"p","h":"Ак жолуң ачылсын! – С богом!"},{"t":"p","h":"Акыл токтотуу – Собраться с духом."},{"t":"p","h":"Алдын көр, аркасын жар тороо – Между молотом и наковальней."},{"t":"p","h":"Ала күү; көзү ала чакмак – Быть навеселе, подвыпивший."},{"t":"p","h":"Алаканга салгандай – Как на ладони."},{"t":"p","h":"Амалы түгөнүү – Исчерпал все возможности."},{"t":"p","h":"Амал түгөнгөндө; эч болбогондо; кур дегенде – По крайней мере."},{"t":"p","h":"Ара-чолодо – Между делом."},{"t":"p","h":"Арабөк, же чок эмес, же жок эмес – Ни то, ни сё; ни рыба, ни мясо."},{"t":"p","h":"Аракет кылсаң берекет – Без труда не выловишь и рыбку из пруда; без труда нет плода."},{"t":"p","h":"Араң качып кутулуу – Еле ноги унес."},{"t":"p","h":"Ары ойлонуу, бери ойлонуу – Собираться с мыслями."},{"t":"p","h":"Артын карабоо – Без оглядки."},{"t":"p","h":"Аткан октой, учкан куштай – Быстро как пуля, как птица."},{"t":"p","h":"Аттын кашкасындай – Всем известный."},{"t":"p","h":"Атам замандагы – В древние времена."},{"t":"p","h":"Ачык айтуу – Поговорить начистоту."},{"t":"p","h":"Ачып көздү жумгуча; бир паста; бир заматта – В мгновение ока."},{"t":"h3","h":"Б"},{"t":"p","h":"Балакетке калуу – Остаться в трудном положении."},{"t":"p","h":"Баш оогон жакка – Кто куда; куда глаза глядят."},{"t":"p","h":"Баш-кулактан садага! – Из двух зол меньшее."},{"t":"p","h":"Башка чапкандай – Как ошпаренный."},{"t":"p","h":"Башы жок; башы иштебөө – Голова не варит."},{"t":"p","h":"Башмалдак атуу – Кубарем скатиться."},{"t":"p","h":"Башын ташка койгулоо – Биться головой о стенку."},{"t":"p","h":"Бел байлоо – Собраться с духом."},{"t":"p","h":"Беш колуңдай; коёндун жатагына чейин – Как свои пять пальцев."},{"t":"p","h":"Бетинен кан тамган – Кровь с молоком."},{"t":"p","h":"Боор ооруу, жаны ачуу; жан тартуу – Болеть душой (сердцем)."},{"t":"p","h":"Итке минген кедей – Бедняк из бедняков."},{"t":"p","h":"Беркундей көрүү – Как пить дать."},{"t":"p","h":"Быт-чытын чыгаруу, таш талкан кылуу – Разбивать вдребезги."},{"t":"p","h":"Быт-чыты чыгуу; ойрону чыгуу – В пух и прах."},{"t":"p","h":"Буту үзүлгөнчө – Изо всех сил."},{"t":"p","h":"Буту үзүлгөнчө; жан-алы калбай; алды-артына карабай – Во всю прыть."},{"t":"p","h":"Бүк түшүү – Лежать пластом."},{"t":"p","h":"Бүткөн бою дүр этүү; жүрөк оозго тыгылуу – Мороз пробежал по телу."},{"t":"h3","h":"<span class=\"pg\" data-n=\"158\">158<\/span>Д"},{"t":"p","h":"Дат деп отуруп калуу; бармагын (кесе) тиштөө; аттиң деш – Кусать себе локти."},{"t":"p","h":"Дем алуу а жазган – На роду (у него, ему) написан."},{"t":"p","h":"Мойнуна коюу – Вырвать признание."},{"t":"p","h":"Мына кызык тамаша; мына сага – Вот тебе на"},{"t":"p","h":"Мышык-чычкан ойнотуу – Играть в кошки-мышки."},{"t":"p","h":"Мурдун балта кеспөө, чымын чакканча көрбөө – И бровью не шевельнул."},{"t":"p","h":"Мурдунан жетелөө – Водить за нос."},{"t":"p","h":"Мурдун көтөрүү – Задирать нос."},{"t":"p","h":"Муштумун көрсөтүү; кол көтөрүү – Давать волю кулакам (рукам)."},{"t":"h3","h":"Н"},{"t":"p","h":"Нансыз тамак даамсыз; нанды адам эч бир танбайт – Горек обед без хлеба."},{"t":"p","h":"Намыс муунтуу; ачуусу келүү – Зло берет (меня, его, тебя)."},{"t":"h3","h":"О"},{"t":"p","h":"Ооз ачырбоо; кыңк эттирбөө – Зажимать рты (рот)"},{"t":"p","h":"Оозуң кайсы десе, мурдун көрсөтүү (эч нерсе билбөө) – Ни в зуб ногой"},{"t":"p","h":"Оозун басуу (сүйлөгүс кылуу) – Связать язык; закрыть рот (язык)."},{"t":"p","h":"Оозуна келгенин оттоо; оюна келгенди айта берүү – Точить лясы; молоть языком."},{"t":"p","h":"Ойго батуу – Мысль захватила; уйти в себя."},{"t":"p","h":"Окко учуу – Умирать, погибать от пули."},{"t":"p","h":"Оокаттан камсыз (жетиштүү) – Как сыр в масле кататься."},{"t":"p","h":"Окшошконго мушташкан – Два сапога пара."},{"t":"p","h":"Орой көз чарай; көзмө көз – Глаз на глаз."},{"t":"h3","h":"Ө"},{"t":"p","h":"Өйдө каратпоо; кыңк эткизбөө; өзүнө баш ийдирүү – Держать в повиновении."},{"t":"p","h":"Өз көзү; өз кишиси – Свои глаза; свой человек."},{"t":"p","h":"Өзөк жалгоо; шам-шум этүү – Заморить (замаривать) червячка."},{"t":"p","h":"<span class=\"pg\" data-n=\"159\">159<\/span>Өзүн өзү билип, өтүгүн төргө илип – Вольное житье; плевать в потолок."},{"t":"p","h":"Өлбөгөн адам алтын аяктан суу ичет – Была бы голова на плечах, а хлеб будет; букв. неумерший человек из золотой чашки воду пить будет."},{"t":"p","h":"Өмүрүн курмандыкка чалуу; кыюу – Жертвовать собой (жизнью)."},{"t":"h3","h":"С"},{"t":"p","h":"Сай сөөгү сыздоо; оор абалда калуу – Сердце кровью обливается."},   // ---------------------------------------------------------------- storage helpers
  function lsGet(k, def) { try { var v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode: ignore */ } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

  var defLang = (navigator.language || '').toLowerCase().indexOf('ky') === 0 ? 'ky' : 'ru';
  var S = lsGet('settings', null) || {};
  S.fs = S.fs || 19; S.lh = S.lh || 1.55; S.theme = S.theme || 'light'; S.font = S.font || 'serif'; S.ui = S.ui || defLang;

  function t(k) { return (I18N[S.ui] || I18N.ru)[k] || I18N.ru[k] || k; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function $(sel, root) { return (root || document).querySelector(sel); }

  var THEME_BG = { light: '#ffffff', sepia: '#f5ecd9', dark: '#111315', contrast: '#000000' };
  function applySettings() {
    var r = document.documentElement;
    r.setAttribute('data-theme', S.theme);
    r.setAttribute('data-font', S.font);
    r.style.setProperty('--fs', S.fs + 'px');
    r.style.setProperty('--lh', String(S.lh));
    r.lang = S.ui;
    var m = $('meta[name=theme-color]'); if (m) m.setAttribute('content', THEME_BG[S.theme]);
    lsSet('settings', S);
  }

  var toastTimer;
  function toast(msg) {
    var el = $('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = msg; el.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.style.display = 'none'; }, 2600);
  }

  function fetchJSON(url) {
    // revalidate with the server, so a corrected book or a new book list shows up on the next visit
    return fetch(url, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  var app = document.getElementById('app');
  var cleanup = null; // reader teardown

  function route() {
    if (cleanup) { cleanup(); cleanup = null; }
    if (EMB) return openReader(EMB.id);
    var m = location.hash.match(/^#\/read\/([\w.-]+)/);
    if (m) openReader(m[1]);
    else if (location.hash === '#/my') showMyBooks();
    else if (location.hash === '#/news') showNews();
    else if (location.hash === '#/missing') showMissing();
    else showLibrary();
  }

  // ================================================================ LIBRARY
  function cacheName(b) { return 'book-' + b.id + '-' + b.v; }

  // The library is organised by school (language of instruction), then grade, then subject.
  // Choosing the school also sets the interface language.
  var SCHOOLS = [['ky', 'Кыргыз мектеби'], ['ru', 'Русская школа']];

  // Subjects in the order the ministry lists them. A book's subject comes from its "subject"
  // field when index.json has one, otherwise from its title; a title that matches nothing
  // becomes its own subject, so new books always show up.
  var SUBJECTS = [
    ['kyrgyz-tili', /кыргыз тили|кыргызский язык/, 'Кыргыз тили', 'Кыргызский язык'],
    ['kyrgyz-adabiyat', /кыргыз адабият|кыргызская литература/, 'Кыргыз адабияты', 'Кыргызская литература'],
    ['russkiy-yazyk', /русский язык|орус тили/, 'Орус тили', 'Русский язык'],
    ['russkaya-literatura', /русская литература|литературное чтение|орус адабият/, 'Орус адабияты', 'Русская литература'],
    ['adabiyat', /адабият|литератур/, 'Адабият', 'Литература'],
    ['matematika', /математик|алгебр|геометр/, 'Математика', 'Математика'],
    ['fizika', /физик/, 'Физика', 'Физика'],
    ['himiya', /хими/, 'Химия', 'Химия'],
    ['biologiya', /биолог/, 'Биология', 'Биология'],
    ['geografiya', /географ/, 'География', 'География'],
    ['istoriya-kg', /кыргызстан\S* тарых|история кыргызстана/, 'Кыргызстандын тарыхы', 'История Кыргызстана'],
    ['istoriya-mir', /дүйнө тарых|орто кылым|жаңы тарых|соңку тарых|байыркы|всемирная история|средних век|новая история|новейшая история|древн/, 'Дүйнө тарыхы', 'Всемирная история'],
    ['religii', /диндер|религи/, 'Диндердин тарыхы', 'История религий'],
    ['obshchestvo', /адам жана коом|человек и общество/, 'Адам жана коом', 'Человек и общество'],
    ['grazhdanstvennost', /гражданствен|жарандык/, 'Жарандык', 'Гражданственность'],
    ['english', /англ|english/, 'Англис тили', 'Английский язык']
  ];
  function subjectOf(b) {
    var s = String(b.subject || b.title || '').toLowerCase();
    for (var i = 0; i < SUBJECTS.length; i++) {
      if (b.subject === SUBJECTS[i][0] || SUBJECTS[i][1].test(s)) return { key: SUBJECTS[i][0], order: i, name: SUBJECTS[i][S.ui === 'ky' ? 2 : 3] };
    }
    return { key: 'x:' + s, order: SUBJECTS.length, name: b.subject || b.title };
  }

  // "My books": books the reader opened or added, stored on the phone. 1 = in the list,
  // 0 = removed by the reader. Books opened before this list existed count as added.
  function myState() { return lsGet('mybooks', null) || {}; }
  function inMy(id) { var s = myState()[id]; return s === 1 || (s !== 0 && !!lsGet('pos:' + id, null)); }
  function setMy(id, on) { var s = myState(); s[id] = on ? 1 : 0; lsSet('mybooks', s); }

  var libHash = '#/'; // where the reader's back button returns to

  function libShell(title, link, main) { // main: the library page (intro text and school switch)
    document.title = title;
    var school = S.school || (S.ui === 'ky' ? 'ky' : 'ru');
    app.innerHTML = '<div class="lib"><div class="lib-head"><button class="icon burger" aria-label="' + esc(t('menu')) + '">' + ICONS.menu + '</button><h1>' + esc(title) + '</h1>' + link + '</div>' +
      (main ? '<p class="sub">' + esc(t('appSub')) + '</p><div class="school">' + SCHOOLS.map(function (o) {
        return '<button data-s="' + o[0] + '"' + (o[0] === school ? ' class="on"' : '') + '>' + esc(o[1]) + '</button>';
      }).join('') + '</div>' : '') +
      '<div id="books"><div class="loading">' + esc(t('loading')) + '</div></div></div>';
    $('.burger', app).onclick = openMenu;
    Array.prototype.forEach.call(app.querySelectorAll('.school button'), function (btn) {
      btn.onclick = function () {
        S.school = S.ui = btn.getAttribute('data-s'); applySettings();
        route(); // redraw the page we are on (setting the same hash would not fire hashchange)
      };
    });
    return school;
  }

  var LIST = null; // the last book list loaded, for the reader's quality badge
  function loadList() {
    return fetchJSON('books/index.json').then(function (list) { LIST = list; return list; }).catch(function (e) {
      $('#books').innerHTML = '<div class="loading">' + esc(t('err')) + '</div>'; throw e;
    });
  }

  function showLibrary() {
    libHash = '#/';
    var school = libShell(t('appTitle'), '<a class="btn my-link" href="#/my">' + esc('★ ' + t('my')) + '</a>', true);
    loadList().then(function (list) {
      list = list.filter(function (b) { return !b.school || b.school === school; });
      var grades = [];
      list.forEach(function (b) { gradesOf(b).forEach(function (g) { if (grades.indexOf(g) < 0) grades.push(g); }); });
      grades.sort(function (a, b) { return a - b; });
      var open = lsGet('libOpen', {});
      var box = $('#books');
      box.innerHTML = grades.length ? '' : '<div class="loading">' + esc(t('noBooks')) + '</div>';
      grades.forEach(function (g) {
        var books = list.filter(function (b) { return gradesOf(b).indexOf(g) >= 0; });
        var sec = document.createElement('section'); sec.className = 'grade';
        sec.innerHTML = '<button class="grade-h"><span>' + esc(g + ' ' + t('grade')) + '</span><span class="n">' + books.length + '</span></button><div class="grade-b"></div>';
        var head = $('.grade-h', sec), body = $('.grade-b', sec);
        function setOpen(on) {
          sec.classList.toggle('open', on);
          body.innerHTML = '';
          if (on) bySubject(books, body, false);
        }
        head.onclick = function () {
          var on = !sec.classList.contains('open');
          Array.prototype.forEach.call(box.querySelectorAll('.grade.open'), function (s) { if (s !== sec) { s.classList.remove('open'); $('.grade-b', s).innerHTML = ''; } });
          setOpen(on);
          open[school] = on ? g : null; lsSet('libOpen', open);
          if (on && sec.scrollIntoView) sec.scrollIntoView({ block: 'start' });
        };
        box.appendChild(sec);
        if (open[school] === g) setOpen(true);
      });
    });
  }

  function showMyBooks() {
    libHash = '#/my';
    libShell(t('my'), '<a class="btn my-link" href="#/">' + esc('‹ ' + t('allBooks')) + '</a>', false);
    loadList().then(function (list) {
      var box = $('#books');
      var mine = list.filter(function (b) { return inMy(b.id); });
      box.innerHTML = '';
      if (!mine.length) { box.innerHTML = '<div class="loading">' + esc(t('myEmpty')) + '</div>'; return; }
      var grades = [];
      mine.forEach(function (b) { var g = gradesOf(b)[0]; if (grades.indexOf(g) < 0) grades.push(g); });
      grades.sort(function (a, b) { return (a == null ? 99 : a) - (b == null ? 99 : b); });
      grades.forEach(function (g) {
        var sec = document.createElement('section'); sec.className = 'grade open';
        sec.innerHTML = '<h2 class="grade-t">' + esc(g == null ? '' : g + ' ' + t('grade')) + '</h2><div class="grade-b"></div>';
        bySubject(mine.filter(function (b) { return gradesOf(b)[0] === g; }), $('.grade-b', sec), true);
        box.appendChild(sec);
      });
    });
  }

  // The menu (☰ in the library header): the site's pages, as a panel sliding in from the left.
  function openMenu() {
    var bg = document.createElement('div'); bg.className = 'sheet-bg';
    var nav = document.createElement('nav'); nav.className = 'drawer';
    var cur = location.hash || '#/';
    var items = [['#/', t('allBooks')], ['#/my', '★ ' + t('my')], ['#/missing', t('missing')], ['#/news', t('news')]];
    nav.innerHTML = '<div class="drawer-h"><span>' + esc(t('appTitle')) + '</span><button class="icon x" aria-label="' + esc(t('close')) + '">' + ICONS.close + '</button></div>' +
      items.map(function (it) { return '<a href="' + it[0] + '"' + (it[0] === cur ? ' class="cur"' : '') + '>' + esc(it[1]) + '</a>'; }).join('') +
      (API ? '<p class="note">' + esc(t('reportHint')) + '</p>' : '');
    document.body.appendChild(bg); document.body.appendChild(nav);
    function close() { bg.remove(); nav.remove(); }
    bg.onclick = close; $('.x', nav).onclick = close;
    nav.addEventListener('click', function (e) { if (e.target.closest('a')) close(); });
  }

  var MONTHS = {
    ru: ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'],
    ky: ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь']

  function fmtDate(d) { // "2026-09-29" -> "29 сентября 2026" / "29-сентябрь, 2026"

  // ---- sending to the server (API): error reports and uploaded books
  function api(path, opts) {
    return fetch(API + path, opts).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function postJSON(path, data) {
    // text/plain keeps this a "simple" request (no CORS preflight), which is faster on slow phones
    return api(path, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(data) });
  }
  // Reports made offline wait on the phone and go out with the next one, or when the app opens online.
  function sendReports() {
    var q = lsGet('reports', []);
    if (!API || !q.length || navigator.onLine === false) return Promise.resolve(false);
    var r = q[0];
    return postJSON('/reports', r).then(function () {
      lsSet('reports', lsGet('reports', []).filter(function (x) { return x.at !== r.at; }));
      return sendReports().then(function () { return true; });
    }, function () { return false; });
  }
  function report(r) {
    r.at = Date.now();
    lsSet('reports', lsGet('reports', []).concat([r]));
    return sendReports();
  }

  var CHUNK = 8 * 1048576, MAX_FILE = 500 * 1048576;
  function uploadForm(box, list) {
    var f = document.createElement('form'); f.className = 'up';
    f.innerHTML = '<label>' + esc(t('upBook')) + '</label><select name="book">' + list.map(function (m, i) {
      return '<option value="' + i + '">' + esc(m.title + ', ' + m.grade + ' ' + t('grade') + ' (' + m.authors + ')') + '</option>';
    }).join('') + '<option value="-1">' + esc(t('upOther')) + '</option></select>' +
      '<label>' + esc(t('upFiles')) + '</label><input type="file" name="files" multiple accept="application/pdf,image/*">' +
      '<label>' + esc(t('upContact')) + '</label><input type="text" name="contact" maxlength="200" autocomplete="off">' +
      '<label>' + esc(t('upComment')) + '</label><textarea name="comment" rows="2" maxlength="2000"></textarea>' +
      '<button class="btn primary" type="submit">' + esc(t('upSend')) + '</button><div class="progress" hidden><i></i></div>';
    box.appendChild(f);
    var btn = $('button', f), prog = $('.progress', f), bar = $('.progress i', f);
    f.onsubmit = function (e) {
      e.preventDefault();
      var files = Array.prototype.slice.call(f.files.files);
      if (!files.length) { toast(t('upNoFiles')); return; }
      for (var i = 0; i < files.length; i++) if (files[i].size > MAX_FILE) { toast(t('upTooBig') + files[i].name); return; }
      var m = list[+f.book.value], total = files.reduce(function (a, x) { return a + x.size; }, 0) || 1, sent = 0;
      btn.disabled = true; btn.textContent = t('upSending'); prog.hidden = false; bar.style.width = '0';
      postJSON('/uploads', { book: m ? m.title + ', ' + m.grade + ' (' + m.school + '): ' + m.authors : 'other', contact: f.contact.value, comment: f.comment.value, lang: S.ui })
        .then(function (up) {
          // each file goes in pieces, so a big scan survives a slow mobile connection
          return files.reduce(function (p, file) {
            return p.then(function () {
              return postJSON('/uploads/' + up.id + '/files', { name: file.name, size: file.size, type: file.type }).then(function (fr) {
                var parts = [], n = 0;
                function next() {
                  var start = n * CHUNK; if (start >= file.size && n > 0) return Promise.resolve();
                  var piece = file.slice(start, start + CHUNK), num = ++n;
                  return api('/uploads/' + up.id + '/files/' + fr.file + '/' + num, { method: 'PUT', body: piece }).then(function (pr) {
                    parts.push({ n: num, etag: pr.etag }); sent += piece.size; bar.style.width = Math.round(sent / total * 100) + '%';
                    return next();
                  });
                }
                return next().then(function () { return postJSON('/uploads/' + up.id + '/files/' + fr.file + '/done', { parts: parts }); });
              });
            });
          }, Promise.resolve());
        })
        .then(function () { f.innerHTML = '<p class="done">' + esc(t('upDone')) + '</p>'; })
        .catch(function () { btn.disabled = false; btn.textContent = t('upSend'); prog.hidden = true; toast(navigator.onLine === false ? t('offline') : t('err')); });
    };
  }

  // Books under subject headings; subjects without books are never shown.
  function bySubject(books, root, myView) {
    var groups = {}, keys = [];
    books.forEach(function (b) {
      var s = subjectOf(b);
      if (!groups[s.key]) { groups[s.key] = { s: s, books: [] }; keys.push(s.key); }
      groups[s.key].books.push(b);
    });
    keys.sort(function (a, b) { var x = groups[a].s, y = groups[b].s; return x.order - y.order || (x.name < y.name ? -1 : x.name > y.name ? 1 : 0); });
    keys.forEach(function (k) {
      var h = document.createElement('h3'); h.className = 'subj'; h.textContent = groups[k].s.name;
      root.appendChild(h);
      groups[k].books.forEach(function (b) { root.appendChild(bookRow(b, myView)); });
    });
  }

  // "7", 7, "7–9" or "10-11" -> [7], [7, 8, 9], [10, 11]
  function gradesOf(b) {
    var m = String(b.grade == null ? '' : b.grade).match(/(\d+)\s*[–-]\s*(\d+)|(\d+)/);
    if (!m) return [];
    if (m[3]) return [+m[3]];
    var out = []; for (var g = +m[1]; g <= +m[2]; g++) out.push(g); return out;
  }

  function bookRow(b, myView) {
    var el = document.createElement('div'); el.className = 'bk';
    var hasPos = !!lsGet('pos:' + b.id, null);
    var mb = (b.size / 1048576).toFixed(1);
    var meta = [[b.author, b.year].filter(Boolean).join(', ')];
    if (gradesOf(b).length > 1) meta.push(b.grade + ' ' + t('grade'));
    if (myView && b.school) meta.push(b.school === 'ky' ? 'Кыргыз мектеби' : 'Русская школа');
    meta.push(mb + ' ' + t('mb'));
    el.innerHTML = '<div class="bk-h"><div class="bk-t">' + esc(b.title) + '</div>' +
      '<button class="icon star" aria-label="' + esc(t('my')) + '">' + LIB_ICONS.star + '</button></div>' +
      (b.subtitle ? '<div class="bk-s">' + esc(b.subtitle) + '</div>' : '') +
      '<div class="bk-m">' + esc(meta.filter(Boolean).join(' · ')) + '</div>' +
      '<div class="row"><a class="btn primary" href="#/read/' + esc(b.id) + '">' + esc(hasPos ? t('cont') : t('read')) + '</a>' +
      '<button class="icon dl"></button><button class="icon share" aria-label="' + esc(t('share')) + '">' + LIB_ICONS.share + '</button>' + qBadge(b) + '</div>' +
      '<div class="progress" hidden><i></i></div>';
    var btn = $('.dl', el), prog = $('.progress', el), bar = $('.progress i', el), star = $('.star', el);

    function setStar() { star.classList.toggle('on', inMy(b.id)); star.setAttribute('aria-pressed', inMy(b.id) ? 'true' : 'false'); }
    star.onclick = function () {
      var on = !inMy(b.id);
      setMy(b.id, on); toast(on ? t('myAdded') : t('myRemoved'));
      if (!on && myView) {
        var body = el.parentNode, sec = body.parentNode, h = el.previousElementSibling;
        body.removeChild(el);
        // drop a subject heading or grade that is now empty
        if (h && h.className === 'subj' && (!h.nextElementSibling || h.nextElementSibling.className === 'subj')) body.removeChild(h);
        if (!body.children.length) sec.parentNode.removeChild(sec);
        if (!$('.bk', app)) $('#books').innerHTML = '<div class="loading">' + esc(t('myEmpty')) + '</div>';
        return;
      }
      setStar();
    };
    setStar();

    $('.share', el).onclick = function () { shareSheet(b); };
    var qb = $('.q', el); if (qb) qb.onclick = function () { qualitySheet(b); };

    function setState(done) {
      btn.disabled = false;
      btn.innerHTML = done ? LIB_ICONS.done : LIB_ICONS.dl;
      btn.setAttribute('aria-label', done ? t('downloaded') : t('download'));
      btn.classList.toggle('on', done);
      btn.onclick = done ? function () { toast(t('downloaded')); if (window.confirm(t('removeAsk'))) remove(); } : download;
      prog.hidden = true;
    }
    function download(quiet) {
      if (!window.caches) { toast(t('noStorage')); return; }
      btn.disabled = true; prog.hidden = false; bar.style.width = '0'; if (quiet !== true) toast(t('downloading'));
      downloadBook(b, function (f) { bar.style.width = Math.round(f * 100) + '%'; })
        .then(function () { setState(true); if (quiet !== true) toast(t('dlDone')); })
        .catch(function () { setState(false); if (quiet !== true) toast(navigator.onLine === false ? t('offline') : t('err')); });
    }
    function remove() {
      caches.keys().then(function (keys) {
        return Promise.all(keys.filter(function (k) { return k.indexOf('book-' + b.id + '-') === 0; }).map(function (k) { return caches.delete(k); }));
      }).then(function () { lsDel('dl:' + b.id); setState(false); toast(t('removed')); });
    }
    setState(false);
    if (window.caches) {
      caches.has(cacheName(b)).then(function (has) { // caches.open would create an empty cache for every book
        return has && caches.open(cacheName(b)).then(function (c) { return c.match('books/' + b.id + '/book.json'); });
      }).then(function (r) {
        var had = lsGet('dl:' + b.id, null), cur = !!r && had === b.v;
        setState(cur);
        // downloaded before the book was corrected: fetch the new version (only changed files) in the background
        if (!cur && had && navigator.onLine !== false) download(true);
      });
    }
    return el;
  }

  // Share a book: a link (opens the app at the book) or the single-file book, through the
  // phone's own share sheet. Without Web Share the link is copied and the file is saved.
  function shareSheet(b) {
    var name = b.title + (b.grade ? ', ' + b.grade + ' ' + t('grade') : '');
    var url = location.href.split('#')[0] + '#/read/' + b.id;
    var old = $('.sheet'); if (old) old.remove(); old = $('.sheet-bg'); if (old) old.remove();
    var bg = document.createElement('div'); bg.className = 'sheet-bg';
    var sh = document.createElement('div'); sh.className = 'sheet';
    sh.innerHTML = '<h3><span>' + esc(t('share')) + ': ' + esc(name) + '</span><button class="icon x" aria-label="' + esc(t('close')) + '">' + ICONS.close + '</button></h3>' +
      '<div class="share-opts"><button class="btn primary s-link">' + esc(t('shareLink')) + '</button>' +
      (b.standalone ? '<button class="btn s-file">' + esc(t('shareFile')) + '</button><div class="note">' + esc(t('shareFileNote')) + '</div>' : '') + '</div>';
    document.body.appendChild(bg); document.body.appendChild(sh);
    function close() { bg.remove(); sh.remove(); }
    bg.onclick = close; $('.x', sh).onclick = close;

    $('.s-link', sh).onclick = function () {
      if (navigator.share) {
        navigator.share({ title: name, text: name, url: url }).then(close, function () { /* cancelled */ });
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { toast(t('linkCopied')); close(); }, function () { window.prompt(t('shareLink'), url); });
      } else {
        window.prompt(t('shareLink'), url);
      }
    };
    var fbtn = $('.s-file', sh);
    if (!fbtn) return;
    var file = null;
    function save() {
      var a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove(); toast(t('fileSaved')); close();
    }
    function send() {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: name }).then(close, function (e) {
          // the tap "expired" while the file was loading: one more tap sends it
          if (e && e.name === 'NotAllowedError') { fbtn.disabled = false; fbtn.textContent = t('fileReady'); fbtn.classList.add('primary'); }
        });
      } else save();
    }
    fbtn.onclick = function () {
      if (file) return send();
      fbtn.disabled = true; fbtn.textContent = t('preparing');
      fetch('books/' + b.id + '/' + b.standalone).then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
        .then(function (blob) {
          file = new File([blob], b.standalone, { type: 'text/html' });
          fbtn.disabled = false; fbtn.textContent = t('shareFile');
          send();
        })
        .catch(function () { fbtn.disabled = false; fbtn.textContent = t('shareFile'); toast(navigator.onLine === false ? t('offline') : t('err')); });
    };
  }

  function downloadBook(b, onProgress) {
    var base = 'books/' + b.id + '/';
    var cache;
    return caches.open(cacheName(b)).then(function (c) {
      cache = c;
      return fetch(base + 'book.json');
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return cache.put(base + 'book.json', r.clone()).then(function () { return r.json(); });
    }).then(function (book) {
      // app files are kept up to date by the service worker (sw.js), not stored with each book
      var urls = book.images.map(function (i) { return base + i; });
      var done = 0;
      // a few requests in parallel: fast on 3G, gentle on slow phones
      var queue = urls.slice();
      function worker() {
        var u = queue.shift();
        if (!u) return Promise.resolve();
        // a picture already saved with an older version of this book is reused, not downloaded again
        return caches.match(u).then(function (hit) {
          if (hit) return cache.put(u, hit);
          return fetch(u).then(function (r) { if (!r.ok) throw new Error(u); return cache.put(u, r); });
        }).then(function () { done++; onProgress(done / urls.length); return worker(); });
      }
      if (!urls.length) onProgress(1);
      return Promise.all([worker(), worker(), worker(), worker()]);
    }).then(function () {
      lsSet('dl:' + b.id, b.v);
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      return caches.keys().then(function (keys) { // drop older versions of this book
        return Promise.all(keys.filter(function (k) { return k.indexOf('book-' + b.id + '-') === 0 && k !== cacheName(b); }).map(function (k) { return caches.delete(k); }));
      });
    });
  }

эмнеден улам келип чыгат? Силердин айлана-чөйрөңөрдө, дос-курбуларыңардын арасындагы теңсиздикке силер кандай мамиле кыласыңар?"},{"t":"p","h":"Үйдөн Токтогулдун жана Жеңижоктун ырларын окуп чыгып, алардын тематика, идеясын салыштыргыла. Алардагы сүрөттөө, салыштырууларды өзүнчө бөлүп жазып чыккыла."},{"t":"p","h":"«Менин балалык кезим деген» кептин баяндоо түрүндө турган чакан ангеме жазгыла. Анда кылыгым, чарчабай, чаңдатып, жыгылып-туруп, оюн, тер агып, аман болсо, ата-энелүү, ата-энесиз, жүдөп, адилеттүү, адилетсиз деген сөздөрдү катыштыргыла."},{"t":"p","h":"1 Колу, буту тешилип – здесь руки, ноги в мазолях, ранах 2 Кайрылышпайт карыпка – здесь не сочувствуют к обездоленным."},{"t":"p","h":"<span class=\"pg\" data-n=\"60\">60<\/span>Акындын өмүрү, чыгармачылыгы жөнүндө кандай искусство чыгармалары бар? Алар жөнүндө айтып берүүгө камдангыла."},{"t":"p","h":"1. «Балалык» ырынан сан атооч сөздөрдү тапкыла жана алар кайсы категорияда тургандыгын айтып бергиле. Мисалы: Эки – иреттик сан атооч, уңгу түрүндө, ..."},{"t":"p","h":"2. Төмөнкү аталыштардын маанилерин чечмелегиле жана жандуу, жансыз экендигине карата бөлүштүргүлө: казал, күл, багалек, көпөлөк, борбаш, чегиртке, байчечекей, мандалак, торгой, жоогазын, чыбык, чымчык, балапан, тай, четин, шыйбылчак."},{"t":"v","l":["жандуу","көпөлөк","жансыз","казал"]},{"t":"h3","h":"МАКАЛДАРДЫ ЭСИҢЕРГЕ ТҮЙГҮЛӨ!"},{"t":"p","h":"«Карындагы баланын кан болорун ким билет, бешиктеги баланын бек болорун ким билет»."},{"t":"v","l":["«Бешик баласы беш түлөйт».","«Жашыл өнөт, жаш чоңоет»,","«Уулуң өссө – урумга, кызың өссө – кырымга».","«Уяда жаткан жумуртка асманда учкан куш болот»."]},{"t":"p","h":"«Аталуу жетим – арсыз жетим, энелүү жетим – эрке жетим». «Балалуу үй – гүлстан, баласыз үй – көрүстөн»."},{"t":"h3","h":"ТҮШҮНДҮРМӨ СӨЗДҮК"},{"t":"p","h":"чар тарабы тең жорго – здесь акын сравнивается с иноходцем. түрмө – то же, что тюрьма."},{"t":"p","h":"алтын жаак, жез таңдай (эпитет) – человек, который достиг высшей степени красноречия и мудрости."},{"t":"p","h":"казал (газал) – Чыгыш элдеринин поэзиясындагы лирикалык жанр. Мында ыр саптары үч бейттен он тогуз бейтке чейин болот. Кыргыз акындарынын көпчүлүгү бул формада ыр жаратышкан."},{"t":"p","h":"чүлүк (ист.) – деревянное кольцо, продевавшееся в носовую перегородку быка. К кольцу привязывался поводок, все это заменяло узду."},{"t":"v","l":["ак өпкө- название болезни легких,","тебетей – национальный головной убор."]},{"t":"p","h":"эгиз – близнецы, двойня. Мальчикам близнецам обычно даются имена Асан и Үсөн, а девочкам Батма и Зуура."},{"t":"p","h":"шыйбылчак – часть ноги парнокопытных животных."},{"t":"p","h":"устукан – кость с мясом, которая подается почетному гостью, по обычаю, он, отведав свой устукан, отдавал кому-нибудь, обычно детям."},{"t":"p","h":"Эстеп калгыла!"},{"t":"p","h":"Балалык кез – жашоого умтулат, өспүрүм кез – аны менен таанышат, кырчын кез – ага кызыгат, толгон кез – доорон сүрөт, улгайган кез – тамшанат, картайган кез – анын ыгына көнөт. П. Буаст"}],"sub":[{"title":"ТҮШҮНДҮРМӨ СӨЗДҮК","b":55}],"pages":[56,60]},{"title":"БАРПЫ АЛЫКУЛОВ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"61\">61<\/span>БАРПЫ АЛЫКУЛОВ"},{"t":"img","src":"data:image/webp;base64,UklGRgAbAABXRUJQVlA4IPQaAADw4gCdASpwAbMBPrVQnEmnJSYmrzQsyOAWiWltB6Gm4peQSrCNjLrbAlTGvC/YMexFu7Prxe4y+OrX/z/jdoB/2/v/Tzs+cs/ML/9+i/4Z/66+DOsRgAYK9XwphbIv9g1JLO5yM4LSJeAacIT2fNUqbA5InsbD9WTq89WcI5sNwXJ386Bnee0ZS9l5NW9rwIAfnPMI8rywbMfMhpJiCvqNlfW8sc3C1mHvKorCIh6+pDMd4eNwuJBbdX7oLVmuwFYXnpL9LQZGej09Ss3+jRqumQ6rH5dD+Ihip+/vN3Usc1kkxhjKKerMi/gRQRCJ3zmom3zbEOEgKqMga/tDEJZCGAVbwvBVYazVPsqI2KwLGc2sTU75A3P8KebHUDifV7+CBsTr0e9AYVVpqbIvK0BuTFtfinmJeU7IHeuMcXFzzfBDIukwPGqAqLIEiAjPqBieG8slme6JtjvIL2cZPKw1EoxsCXlEicKuHXIcN0WrNqdb5Hb9RIdKxVGtI/JK+QRugqyPLHsq3MiMJu23g53yeYJsJFwLqtSImGl2CtX2jXNE/2Qbjixm8ac/SgZYojOX0ITxYN6q65rxHeqtUH0lU94v1un8GVydkO+C1Vjdt3Zcg4QmgYnPeBcziHQgM7guNRKt4h+zUa4+fqfWIo/mSWMxEEIxlir+uYtDwpPlSvvHED3RZcxEGV+H5s5s5BfRQBPpiYwJWQcsMX2hySsGpOHkHMcc1kUjMev+i6mZqL ерелеген – разоблачал"]},{"t":"p","h":"<span class=\"pg\" data-n=\"62\">62<\/span>Барпынын «Турбайбы», «Болор жигит», «Болбос жигит», «Жакшы кыз», «Өзү каар, тили заар кыз», «Балдарга насыят» деген ж.б. ырларында балдардын, жаштардын жүрүм-турумдарын сыпаттап, аларды жакшы сапат-касиеттерди өз көңүлдөрүнө сиңире жүрүүгө чакырат."},{"t":"p","h":"Анын көпчүлүк ырлары насыят, санат, нуска айтуучу, тарбиялык мааниси менен айырмаланып турат."},{"t":"v","l":["Жакшы кыз","Сайраган жайкы булбул —","Гүлдүн көркү."]},{"t":"p","h":"Жаркырап жайнаган кыз —"},{"t":"v","l":["Үйдүн көркү","Жазында жайкалган чөп —","Дөндүн көркү.","Сулуу кыз суктандырган —","Төрдүн көркү.","Далида сындап өргөн","Кара чачы.","Маңдайга келшимдүү","Калем кашы.","Жакшы кыз-жайкы таңдай","Үйдүн куту.","Аңкыган гүлбурактай","Кыздын жыты.","Берметтей жаркыраган","Катар тиши.","Келтирип сайма саят —","Анын иши.","Ыракмат айтып кетет","Көргөн киши.","Ак бетке жарашыктуу","Кошмок калы.","1 Сыпаттап – описывая"]},{"t":"p","h":"жаркырап жайнаган кыз – радушная, гостеприимная девушка"},{"t":"v","l":["жайкалган чөп – здесь густо","растущая трава","","төрдүн көркү – здесь прелесть","почетных мест"]},{"t":"p","h":"кашы – здесь тонкие, изящные, красивые брови аңкыган – пахнущий берметтей жаркыраган – блестящий как жемчуг келтирип сайма саят – искусно вышивает көз артат (артышат) – заглядываются, любуются"},{"t":"p","h":"2 Көңүлдөрүнө сиңире жүрүүгө – здесь воспринять, брать пример. 3 Айырмаланып турат – отличается 4 Үйдүн көркү – достоинство, очарованье."},{"t":"p","h":"5 Далида (желкесинде, далысында) – на спине, на затылке 6 Гүлбурактай – один из похвальных эпитетов к девушке, пахнущей как цветы,"},{"t":"v","l":["<span class=\"pg\" data-n=\"63\">63<\/span>Көз артат көрүп калган","Жандын баары:","Болот деп тагдыр буйруп","Кимдин жары?","Оймоктой оозун кара","Майин күлгөн.","Чолпондой көзүн кара","Танда күйгөн.","Бир күлсө сүйүнчүгө","Берер элем,","Кетсе да өмүр бою","Тапкан дүйнөм.","Жакшы кыз – эне-атанын","Ырыскысы.","Турмуштун тунук, таза","Уюткусу!","Уккандар жалган дебес","Ырымды ушу."]},{"t":"p","h":"тагдыр буйруп – здесь кому суждено, кому выпадет счастье оймоктой оозун – букв. ротик как наперсток (красивый)"},{"t":"p","h":"сүйүнчүгө (кубанчыма) – за радостную весть ырыскысы – здесь счастье, благополучие"},{"t":"v","l":["«Өзү каар, тили заар кыз»","Айылдан айыл кезген кыз,","Ата-энеден безген кыз","Чарчабай басып жүргөн кыз,","Ушактын сөзүн сүйгөн кыз.","Уяты жок таскак кыз,","Этек-жеңи баткак кыз.","Кашына көөнү сүрткөн кыз,","Кишинин баары үрккөн кыз.","Балтыры жоон, күчтүү кыз.","Күрөктөй орсок тиштүү кыз.","Мойнуна баарын таккан кыз","Момундар үчүн мастан кыз.","","1 Майин (жылуу-жумшак, ажарлуу) – здесь приятно, очаровательно.","2 Ырымды ушу – этот мой стих."]},{"t":"p","h":"безген кыз – отдалившаяся, отстранившаяся от родителей, убежавшая девушка этек-жеңи баткак – здесь не чистоплотная кашына көөнү сүрткөн – сажей нарисовавшая себе брови, намалёванная үрккөн – здесь пытаются держаться подальше, от нее, обходят стороной мойнуна баарын таккан – повесившая на шею всякие побрякушки, безвкусная 3 Тили заар кыз (ачуу деген мааниде) – злословная, вредная девушка"},{"t":"p","h":"4 Кезген (кыдырган) – здесь бродяжничить, блудная девушка 5 Таскак – тоже блудная"},{"t":"v","l":["6 Орсок тиштүү – с некрасивыми, кривыми зубами.","7 Мастан (жомоктогу желмогуз кемпир) – ведьма","<span class=\"pg\" data-n=\"64\">64<\/span>Жумуш кыл десе сулкуюп,","Сом темирдей жаткан кыз.","Он алтыда көпкөн кыз,","Озунуп өзү өпкөн кыз.","Ырысын жерге тепкен кыз,","Ыймандан ыраак кеткен кыз.","Ушак айтып айылга","Азандан мурда жеткен кыз","Эсиме түшсө кокустан","Эт жүрөгүм этет тыз.","Нан ордуна аш кылат,","Ичкениңди таш кылат.","Айыбын айтсаң, алкынып","Сенден мурда кол сунат","Буудай куурат тил менен","Муунтат заар тил менен.","Өзү – каар бул кыздын,","Тили-заар бул кыздын.","Миндин бири ушундай,","Ушундайдан кутулбай,","Кыжы-кужу түгөнбөйт,","Кыздын көбү күнөөлөйт.","СӨЗДҮК"]},{"t":"p","h":"ырысын жерге тепкен – здесь не оберегавшая и не ценившая свое счастье азандан мурда – с позаранку айыбын (күнөөсүн) айтсаң —"},{"t":"p","h":"(если) скажешь о её недостатках, ошибках муунтат – душит каар (каардуу) – жестокая, злобная ушундайдан кутулбай – не избавившись от таких жакырчылыкта, жетимчиликте – в нищете, в недостатке"},{"t":"p","h":"Ооган калкы ... жашашат. ... чыгуу үчүн эмгектенүү керек. үйдүн куту – здесь счастье дома."},{"t":"p","h":"Менин үйүмдүн куту- Арууке. Атын атаса, ... сүйүнөт. кошмок (кош) калы – парная родинка."},{"t":"v","l":["Айыкенин ... өзүнө жарашат.","турмуштун уюткусу – здесь ядро, опора жизни","кыжы-кужу (кажы-кужу) – ссора, перебранка","... үн чыгат. Кызуу адамдар кыжылдап жатышты."]},{"t":"p","h":"1. Барпы Алыкулов жөнүндө башта уктуңар беле? 2. Акын качан, кайда төрөлүп, кандай күндү башынан кечириптир? 3. Ырларынын тематикасы эмне жөнүндө экен? 4. «Жакшы кыз» жана «Өзү каар, тили заар кыз» чыгармаларында кыздардын кандай сапаттарын чагылдырган?"},{"t":"p","h":"1. Силер акын чагылдырган сапат-касиеттеги кыздарды көрүп жүрөсүңөрбү? Дагы кандай кылык-жоруктуу кыздар бар?"},{"t":"p","h":"1 Сом темирдей – в знач. лежебока."},{"t":"p","h":"2 Кол сунат (кол көтөрөт) – нападает, бьет."},{"t":"p","h":"<span class=\"pg\" data-n=\"65\">65<\/span>Акындын ырларын жаттагыла, көркөм айтууга көнүккүлө. «Мага жаккан адамдык сапат» деген темада дилбаян жазгыла."},{"t":"p","h":"2. Ат атооч сөз түркүмүн эске түшүргүлө. Чыгармадан ат атооч сөздөрдү таап, аларды жакталышына жана жекелик, көптүк түрлөрүнө карата топтогула."},{"t":"v","l":["Болор жигит","Киши болор жигиттин","Киши менен иши бар.","Өзү менен барабар","Өзөк болор киши бар.","Көлөкө жерге күн тийсе,","Көрө албайт экен ичи тар","Жакшы болор жигиттин","Жүрөгүндө мүлкү бар.","Ырыс толуп үйүнө","Тамаша менен күлкү бар.","Азгырсам деп мындайды","Андып жүргөн түлкү бар.","Сөзгө алынар жигиттин","Сарайында сынчы бар","Саресеп менен сүйлөгөн","Сөздөрүнүн курчу бар.","Душманына калганда","Калемпир менен мурчу бар.","Сыпаттап айтып өтүшкө","Бизге окшогон ырчы бар.","Көзгө илинер эр жигит","Кедей да болсо малдуудай","Чырмаган дартка карабай,","Чабал да болсо алдуудай.","Чындык сөзүн бетке айтат"]},{"t":"p","h":"киши болор жигиттин – здесь джигит (молодой человек) стремящийся быть достойным человеком тамаша менен күлкү бар- есть смех и веселье андып жүргөн түлкү бар – есть хитрые как лиса и завистливые люди сөзгө алынар жигит – джигит стремящийся завоевать уважение людей"},{"t":"v","l":["сынчы – критик","душманына – к врагу"]},{"t":"p","h":"көзгө илинүү – быть заметным, выделиться дарт – болезнь чабал да болсо – хоть слабый бетке айтат- говорит прямо"},{"t":"p","h":"(в лицо) 1 Өзөк болор киши (колдоочу, тең, сырдаш киши) – здесь человек который может стать опорой, единомышленником, другом."},{"t":"p","h":"2 Ичи тар – завистливый 3 Мүлкү (жалыны) бар – широкое, доброе (сердце) 4 Азгырсам деп – чтобы сбить с правильного пути, запутать 5 Саресеп менен сүйлөгөн – здесь говорит кратко, но содержательно. Краток и мудр."},{"t":"p","h":"6 Сыпаттап (сындап) – здесь чтобы охарактеризовать, рассказать (людям)."},{"t":"v","l":["7 Малдуудай – как будто у него много скота.","","<span class=\"pg\" data-n=\"66\">66<\/span>Чангетте аккан шар суудай.","Шагдам болор жигиттин","Шаага бербес эрки бар.","Алыстан келген душманга","Арстандай көркү бар.","Күйүп турган жалындап","Жүрөгүндө өртү бар.","Элди сүйгөн жигиттин","Эндүү болот маңдайы.","Чаласы жок ишинин,","Чечен болот таңдайы.","Ушундайды көрө албайт,","Деги, ушакчынын кандайы?","Жигиттин иши эл менен","Элдин кени жер менен","Эл аралап, жер басып","Эриккенде бир келем.","Эр жигиттен сөз баштап,","Эрмек болуп мен берем.","Эси бар жигит жол тапсын","Эки ооз ушул термеден."]},{"t":"p","h":"жүрөгүндө өртү (оту) бар – здесь у него горячее сердце, он смелый, решительный берется доводит до конца чечен болот таңдайы – будет красноречивым эриккенде – когда скучаю эрмек болуп (болом) – развлекаю (рассказами, стихами)"}],"sub":[],"pages":[61,66]},{"title":"Болбос жигит","blocks":[{"t":"h3","h":"Болбос жигит"},{"t":"v","l":["Адам болбос жигит бар,","Бозодо салат жаңжалды.","Керилип сунат чаңгалди,","Орундатпайт жумушун.","Тозутат күткөн турмушун.","Жети бөлөк кыялы,","Жериге тиет зыяны.","Жүргөн жерин чыр кылып,","Элиге тиет зыяны.","жаңжал салат – устраивает","скандалы"]},{"t":"p","h":"1 Шар суудай – как бурное течение, решительный и резкий."},{"t":"p","h":"2 Шагдам (шайыр, ачык, куунак) – здесь веселый."},{"t":"p","h":"3 Шаа (шах, падыша, хан) – царь."},{"t":"p","h":"4 Арстандай көркү (сүрү) – вид (у него) грозный как лев. 5 Эндүү (жазы) болот маңдайы – широкий лоб"},{"t":"v","l":["6 Эл аралап – хожу среди людей.","7 Эси бар жигит – умный молодец.","8 Чаңгалди (муштумду) – свой кулак."]},{"t":"p","h":"9 Жериге (жерине) тиет зыяны – приносит вред своей земле. 10 Элиге (элине) – народу"},{"t":"v","l":["<span class=\"pg\" data-n=\"67\">67<\/span>Сөздөн калар жигиттин","Күндө бүтпөйт урушу.","Конок келсе, жазылбайт.","Мандайынын тырышы.","Арагын ичип, шишесин","Ташка уруп талкалайт.","Көрдүңбү мени дегенсип,","Кең дөбөдө чалкалайт.","Улуунун укпай сөзүнү","Шүмшүк кылат өзүнү.","Адамсынып корсоёт,","Өзүнөн өзү зороёт.","Иште деген кишиге","Жеп ийчүдөй ороёт.","СӨЗДҮК","конок келсе – если гости","придут","","талкалайт – ломает"]},{"t":"p","h":"чалкалайт – важно откинулся назад, важничает корсоёт – ведет себя надменно киши менен иши бар- здесь отзывчивчий, приветливый, поддерживает добрые отношения с людьми."},{"t":"v","l":["көлөкө жерге күн тийсе- если в тень падает солнце","калемпир менен мурчу бар- есть шутка в словах.","Тамакка .. көп кошулуптур. Дүкөндөн ... алчы.","сөздөрүнүн курчу бар- (у него) острослов."]},{"t":"v","l":["Адил ... ... жигит. Балтанын мизи...","жети бөлөк кыялы – характер (у него) не устойчивый.","бүтпөйт урушу – скандальный.","ороёт (орондойт) – здесь грубит, грубый, невженственный."]},{"t":"p","h":"1. Кыз бала эмне үчүн жакшы экен? 2. Акын кыздарды ата-эненин ырыскысы, үйдүн куту, турмуштун тунук уюткусу деп кандай себептерден айтып жатат? 3. Болор жигит жана болбос жигит кандай болот экен? 4. Адамдык жол, үлгүнү кимден табуу керек? 6. Өзү каар, тили заар кыздар кимдер?"},{"t":"p","h":"6. Жаман ойлуу, жаман жүрүш-туруштуу кыздар кандай болот экен?"},{"t":"p","h":"1. «Жакшы кыз» чыгармасына таянып, жаман кыз кандай болорун аныкта."},{"t":"p","h":"2. «Болор жигит» менен «Болбос жигит» деген ырларды салыштыр."},{"t":"p","h":"3. Адамдагы жакшы жана жаман сапаттарды өзгөртүүгө болобу, ушулар жөнүндө ой толгоо дилбаянын жазгыла."},{"t":"p","h":"4. Төмөнкү макалдардын маанисин чечмелегиле, алардын кайсынысы силер окуган тексттерге ылайык келерлигине маани бергиле: «Жакшынын шарапаты, жамандын кесепети», «Жамандан жаан, жакшыдан бөөн», «Жакшы бала эр болот, жаман бала жер болот», «Жакшыга жут, жаманга кут жок», «Жакшы кыз – жакадагы кундуз, жакшы жигит – көктөгү жылдыз», «Жакшы уул элине баш болот, жаман уул элине кас болот»."},{"t":"v","l":["1 Шишесин (бөтөлкөсүн) – бутылки. 2 Сөзүнү (сөзүн) – слов","3 Зороет (сороет) мында – остается в одниночестве"]},{"t":"p","h":"<span class=\"pg\" data-n=\"68\">68<\/span>Адабий тил, диалект жөнүндө билгендеринерди эске түшүргүлө. Акындын чыгармаларынан диалект сөздөрдү тапкыла."},{"t":"v","l":["Үлгүсү: диалект адабий тил","1. элиге элине","","3."]},{"t":"h3","h":"АДАБИЯТ ТЕОРИЯСЫНАН"},{"t":"h3","h":"Акындар поэзиясы жөнүндө түшүнүк"},{"t":"p","h":"Төкмөчүлүк өнөрү менен поэзия жараткан жалпы эле ырчылардын чыгармачылыгы – акындар поэзиясы деп аталат. Акындар элдин социалдык турмушун, максат-талабын, эркиндик-теңдик үчүн күрөшүн, көзкараштарын ырларында чагылдырышкан. Көпчүлүгү комуз менен оозеки ырдашкан. Бул кайталангыс феноменалдуу көрүнүш дүйнө элдерине анча мүнөздүү эмес, башка калктарда анча өнүкпөгөн."},{"t":"p","h":"Кыргыз элинде байыркы учурлардан ушул күнгө чейин далай ак таңдай акындар, кара жаак ырчылар өткөн. Алардын айрымдары төмөнкүлөр: Асан Кайгы, Токтогул, Калыгул, Т. Сатылганов, Молдо Кылыч, Жеңижок, Барпы, Алымкул, Ысмайыл, Эстебес ж.б. Кыргыз элинде азыр да Замирбек, Тууганбай сыяктуу төкмө акындар бар."},{"t":"h3","h":"ТҮШҮНДҮРМӨ СӨЗДҮК"},{"t":"p","h":"төр этн. – место против входа в юрту, почетное место. кут этн. – по народному поверью – свет падающий через тюндюк, в очаг (коломто) и приносящий счастье дому. Издревле кыргызы считали девочку или женщину счастьем (кут) дома. т.е. в значении – счастье, удача."},{"t":"p","h":"азан – азан, призыв к молитве у мусулман."},{"t":"p","h":"алкынып (алкынуу) – яростно, свирепствуя, с руганью (чаще о женщинах). тили менен буудай кууруу – пустослов, пустомеля."},{"t":"p","h":"Чаңгет – Сузак районундагы суу, Фергана өрөөнүндө. Речка находящаяся в Ферганской долине, протекающая через Сузакский район."},{"t":"p","h":"бозо (буза) – таруу, буудай, жүгөрү сыяктуу эгиндерден атайын технология менен даярдалган бир аз кызытуучу күчү бар ач кыл тамак."},{"t":"p","h":"тозутат (тоздурат) – эскиртет; көңүлсүз кылат деген мааниде. Күткөн үй-бүлөсүн, турмушун жакшы сактабайт. Семью свою не может содержать, не заботиться."}],"sub":[{"title":"ТҮШҮНДҮРМӨ СӨЗДҮК","b":25}],"pages":[67,68]},{"title":"ЖЕҢИЖОК (ӨТӨ) КӨКӨ УУЛУ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"69\">69<\/span>ЖЕҢИЖОК (ӨТӨ) КӨКӨ УУЛУ"},{"t":"p","h":"(1860-1918)"},{"t":"p","h":"Аксыдан чыккан Жеңижок, Айтышарга теңи жок."},{"t":"img","src":"data:image/webp;base64,UklGRgIbAABXRUJQVlA4IPYaAABw6QCdASpuAaQBPrVOm0mnKCkkMRQMMSAWiWlt0rBN7gXNA4g5RtQDjWIA3IdeL4OW/1d//f8fs3f/n+X6fNnbrbe2+Yf/69D/xX/y9UaS+0CV/t8pYcXz6JNzYRYQYlSKdLjj1KkK5rOfScJUh1wKjLEUrmEIbk2ovbkKzE++9QJSb+71bVboin0Ul2u51wsPyPI9qG7ylcn98pHRCXLNtx5b4zc+lxnbUTWnvpbACJ9fTwMjeI/Nob1zsGcwU0RnWlBMLX2wkoqk5NymNSh6hET50/GnweTJGCdKYle94EzVIE8Qu3KEfU9jL8WAnR9rDz2rmjKPuvRxhLG1VRWQTkfjSpeKVX1mi2ngPidqYNcusMtK/+ZniYQKK8/M+mpWy527vaaO/mTOhl6sHz7SeUg1xjuvChOsrB4bPCJDSTZ402Z4ArCYjnIvVSi9x+6abZHDVrtb0uypKIl+k8MGqsAoj/2XeB7nxh6QLf4MZzNdbAoxVa8Zhu0v0hYBMgWBf/ozn1WjC4zo/+mUIw8SwHI39emoLVZrslesMdAqLZLkzQRFxwBlKL7hssho ам эмне кылуу керек экендиги жөнүндө жаштарга акыл насаат айтат."},{"t":"p","h":"1 Жаңыжол району – азыркы Аксы району 2 Таякелериникинде – у родственников, по материнской линии. 3 Жалмандаган – здесь шустрый, пробивной 4 Анык Жеңижок (өтмө маани) – настоящий певец"},{"t":"p","h":"<span class=\"pg\" data-n=\"70\">70<\/span>Жеңижок өз замандаштарынан айыырмаланып, окуй да, жаза да билген. Анын «Ак куржун толо ыр калды» деген ыры катуу ооруп төшөктө жатканда, өмүрүнүн акырында чыгарылган ырларынын эң орчундуусу. Анда акын дүйнөдөн өтүп баратканына арман гана кылбастан, ырларынын жарыяланбай, элге жетпей калганына кейигенин да билдирген."}],"sub":[],"pages":[69,70]},{"title":"Айтамын санат тобуңа","blocks":[{"t":"h3","h":"Айтамын санат тобуңа"},{"t":"v","l":["I","Адамдын көркү кашта бар,","Арчанын көркү ташта бар","Акылдын кени башта бар.","Агайын көөнүн суутпай","Ай сайын барып каттап ал.","Алда кандай болом деп","Азап чегип ооруса,","Адамдын көөнү дартта бар.","Азыркы айткан санатты","Акылын жетсе жаттап ал!","Акын болчу Өтө деп","Айтып калсын бир нуска.","Ачка жүргөн айбанат","Ар нерсе келет жегиси.","Айласын табат ар иштин","Акылы тунук ар киши.","Антара сайып душманын","Ар кимдин келет жеңгиси.","Айткан шертин бек тутмай","Азамат эрдин белгиси.","Алганы жакшы жолукса,","Ар кимдин келет келгиси!..","Ак комуз кармап колума","Айтамын санат тобуңа."]},{"t":"p","h":"суутпай (көңүлүн калтырбай) – не разочаровывая, не огорчая азап чегип ооруса – (если) мучается от болезни ачка жүргөн айбанат- голодные звери айласын табат – находит выход аңтара сайыш (саюу) – здесь побеждая своего противника бек тутмай (тутуу) – здесь выполнять обещанное кармап колума – держа в руке"},{"t":"v","l":["1 Акылдын кени – клад разума, мудрости.","2 Дарт (оору, сыркоо) – болезнь, хворь","3 Нуска – мудрое наставление","4 Акылы тунук – светлый ум","5 Шерт (ант) – клятва","6 Алганы – здесь жена."]},{"t":"p","h":"7 Айтамын санат тобуңа – здесь свои мысли, поучения обращаю к вам,"},{"t":"v","l":["<span class=\"pg\" data-n=\"71\">71<\/span>Акылың болсо, жаш балдар,","Аракет кылгын жашыңдан","Азамат эрден болууга!..","Өз колунда болбосо","Өзгөгө кылба далбаса","Өкүттө кийин каласың,","Өкүмдүк кылып кармаса.","Атың барда – жер тааны,","Атаң барда – эл тааны!","Экөөбү тең бар чакта","Эмгектенип, эр жигит,","Эпчил болуп жан сакта!","Эртеңкинди ойлой жүр,","Эрмин десең – калп айтпа!","Ээриңди көтөртөт,","Эпсиз атың чарчатпа.","Элиң келсе көргөнү,","Эл кумарын таркат да.","Эдирейбей досуна,","Эби менен жалпакта.","Элиңдин алгын алкышын","Эсил жаның бар чакта!..","Жакшы болуп жүрүүгө,","Жакшыдан тапкын жолдошту.","Жолотпогун жаныңа","Жанын жеген оңбосту.","Жайында болот көңүлүң,","Жолдоштон тапсаң жолборсту.","Аргымак аттан не пайда","Айгышкан топко кирбесе.","Акында болбойт касиет,","Айтышкандан сүрдөсө.","1 Аракет кылгын – старайся.","жашыңдан – с молоду"]},{"t":"p","h":"экөөбү (экөөсү) тең бар чакта – когда обе есть эмгектенип – трудясь ээриңди көтөртөт – здесь букв. заставит тебя нести седло, в знач. будь расчетливым, знай меру эдирейбей – здесь не переусердствуй эби менен жалпакта – здесь неугодничай попусту жанын жеген оңбосту – здесь не чистоплотных людей"},{"t":"p","h":"2 Кылба далбаса – здесь не старайся."},{"t":"v","l":["3 Өкүттө каласың – пожалеешь.","4 Өкүм – горячий, имеющий власть.","5 Жан сакта – живи, сам себя прокорми.","6 Атың (атыңды) – своего коня.","7 Эсил жан – душа, жизнь.","8 Жаныңа – здесь к себе."]},{"t":"p","h":"9 Жолборсту – здесь храбреца, джигита с сердцем тигра. 10 Айгышкан топ – здесь ожесточенные, враждующие группы."}],"sub":[],"pages":[71,71]},{"title":"Атадан кетет касиет","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"72\">72<\/span>Атадан кетет касиет"},{"t":"v","l":["Ардактап баккан баласын,","Абийрин төгүп тилдесе.","Азамат эрде даңк болбойт,","Алышкан жоону жеңбесе.","Ак шумкардан пайда жок,","Айланып туурга келбесе.","Айылдаш болуп не керек,","Алты пул чака карызга","Арзыганда бербесе!","Адамдын болот жаманы","Акылын андап ченебейт","Ашыкпастан тирликке","Айылдап жүрөт кенебейт.","Өзүн өйдө көтөрүп","Өзгөнү жанга теңебейт.","Алганга кордук көрсөтүп","Ар күнү сабап тебелейт.","Алты күнү жемелейт.","Алты теңге пул алсаң","Арадан күндү өткөрбөй","Азыр бергин, келе дейт!"]},{"t":"p","h":"атадан кетет касиет – потеряет свой отцовский авторитет абийрин төгүп тилдесе – (если) прелюдно ругает, унижает жеңбесе – (если) не победит карызга – в долг арзыганда (керек болгондо, муктаждыкта) бербесе – не даёт (если) когда нужно, не поддерживает айылдап (айылчылап) жүрөт – ходит по гостям (забыв о своем хозяйстве)"},{"t":"p","h":"жемелейт – упрекает"},{"t":"p","h":"күндү өткөрбөй – не проходит и одного дня"},{"t":"h3","h":"СӨЗДҮК"},{"t":"p","h":"жеңи жок кемсел – камзол с короткими рукавами кат тааныса да – хотя он был грамотным."},{"t":"p","h":"Жеңижок эртелеп ... Тимур ..., мектепке беришпеди. дуу дей түшөт – здесь оживление, шум"},{"t":"v","l":["Класс ... Кургак отун ... күйдү.","атыгып кеткен – получил прозвание","Шаар кийин Бишкек ...","кырдаалдарында – в разных ситуациях","Турмушта ар кыл ... болот.","адамдын көркү кашта бар – брови укращают человека","Рашиданын ... көзүнө жарашат.","агайын (ага-ини) – братья","Чыңгыз менен Ильгиз ага-ини."]},{"t":"p","h":"өзгөгө кылба далбаса (башканын жолун тоспо) – здесь другим не мешай."},{"t":"v","l":["1 Акшумкар – вид кречета.","2 Тирлик (тиричилик) – здесь хозяйство.","3 Теңге, пул (акча) – деньги","<span class=\"pg\" data-n=\"73\">73<\/span>калп айтпа – не ври","... өтө жаман адат.","кумарын таркат (черин жаз) – дай (людям) удовольствие","жакшыдан тапкын жолдошту – найди хорошего друга","... балдар ... күтөт.","сүрдөсө – если смущается","Айтышкандан ..., акын болуп не керек.","даңк болбойт – не будет славы.","Мактанчаакта ..."]},{"t":"p","h":"өзгөнү (башканы) жанга теңебейт – других ни во что ставит."},{"t":"p","h":"Дастан деле ... көзүнө илбейт экен. Атасынан ... тоготпойт. сабап тебелейт – избивает"},{"t":"p","h":"Базарбай аялын ... Карина жүн ... жатат."},{"t":"p","h":"1. Жеңижок (Өтө) Көкө уулу тууралуу эмне билесиңер?"},{"t":"p","h":"2. Акындын аталган чыгармалары менен тааныш болсоңор, айтып бергиле."},{"t":"p","h":"3. «Төкмө акын», «айтыш өнөрү», «санат-насыят ырлары» деген түшүнүктөрдү чечмелегиле."},{"t":"p","h":"4. Этиш кандай сөз түркүмү? Ал эмнени туюнтат? Кандай суроолорго жооп берет? Жөнөкөй жана татаал түрүн кандай түшүнөсүңөр? Негизги жана жардамчы этиштер деген эмне? Суроолорго жооп бергиле. Жогорку окуган чыгармадан мисалдарды тапкыла."},{"t":"v","l":["II","Калкындын көөнүн калтырба,","Катарлаш өсүп чоңойгон,","Жетсе да колуң жылдызга,","Катуу айтпа курдашка.","Абийри бар жигиттин","Айыбын чукуп кызартпа.","Элинен безип жүргөндүн","Эски дартын ырбатпа.","Базардан алган буюмун,","Билбейт деп сатпа кымбатка.","Эл тирилик кылганда,","Эсирип уктап кур жатпа!..","Эселек болбой жолуң таап,","Эбин менен ырсакта.","","1 Курдаш (дос) – друг, товарищ"]},{"t":"p","h":"жетсе да колуң жылдызга – хоть ты и высоко взлетел, можешь достать звезду айыбын чукуп кызартпа – не стыди (не смущай) указывая на его недостатки (просчеты) ырбатпа – не раздувай эл тирилик кылганда (тиричилик) – когда трудится народ"},{"t":"v","l":["2 Абийри (абийири, адамкерчилиги) – совесть","3 Сатпа кымбатка – не продавай дорого","4 Эселек болбой (эссиз болбой) – не будь глупым","<span class=\"pg\" data-n=\"74\">74<\/span>Атадан алтоо болсоң да,","Ар жалгыздык бир башта.","Кез келгенди сүйлөбө,","Кеп ошону ылгашта!","Көтөрүм кылып минген бар","Карабай жалгыз атына...","Катуу болсо ынтымак,","Ким тиет сага батына.","Ушак айтпай артыңа,","Адал жүрүп малың бак.","Дүнүйө деген кургуруң","Жатпасын жолдо чачыла!..","Кандар өтөт – калк калат,","Укум менен тукумга","Уланышып нарк калат.","Канча заман өтсө да","Кадырланган салт калат.","Жеңсе жоону жеринде","Жергесинде салтанат.","Бабабыз баатыр Манастай","Баатыр деген даңк калат.","Кошой, Бакай, Чубактай","Канча баатыр шер өткөн,","Качырып жоону талкалап.","Бетеге кетет – бел калат,","Калкып учкан булуттай","Замандар өтөт – эл калат.","Эл оозунда айтылып,","Эрдик кылган эр калат.","Калктын камын ойлогон","Касиеттүү шер калат.","Туугандыктын белгиси"]},{"t":"p","h":"минген бар – здесь ездят верхом дүнүйө – здесь богатство, имущество кандар өтөт, калк калат – правители приходят и уходят, а народ остается даңк калат – останется слова бетеге кетет – бел калат – высохнет трава, но земля останется (типчак сойдёт, склон горы останется)"},{"t":"p","h":"камын ойлогон – заботившиеся шер калат – здесь остается отважный храбрец"},{"t":"p","h":"1 Ылгашта (ылгоодо) – различать, разбирать, выбирать"},{"t":"p","h":"2 Батына (батынат) – здесь кто осмелиться"},{"t":"v","l":["3 Ушак айтпай – не сплетничай","4 Адал жүр – будь честным","5 Жергесинде салтанат – здесь праздник на родине","6 Шерлер (эпитет богатыря) – здесь храбрец","7 Калкып (калкуу) – парить в небесах"]},{"t":"p","h":"8 Туугандыктын белгиси – родственное чувство, признак родства."},{"t":"v","l":["<span class=\"pg\" data-n=\"75\">75<\/span>Кыйын күндө кайрылат.","Карашпасаң андайда,","Көңүлү калып туугандан,","Түбөлүккө айрылат.","Ынтымактуу болсоңор,","Душманыңар айбыгат.","Кээ бир адам кейикчээл,","Болбос ишке кайгырат.","Эр жигиттин жакшысы","Эл камы үчүн кам урат.","Жабыркатып кыйнаган","Жакшылык болбойт кеселден.","Алыс карма баланды","Анги чалыш безерден.","Жадыңа бекем сактап ал,","Жеңижок төккөн шекерден.","Сексен күнү айтса да,","Сөз түгөнбөйт чеченден!","түбөлүккө айрылат – расстается навечно"]},{"t":"p","h":"ынтымактуу болсоңор – (если) будете сплочёнными, дружными шекерден (мында акындын санат сөзүнөн) – поучительных, мудрых слов (поэта)"},{"t":"h3","h":"СӨЗДҮК"},{"t":"p","h":"укум менен тукумга (мында келечек муунга) – к детьям, к потомкам ... нускалуу иштерибизди калтыралы."},{"t":"v","l":["калкып учкан булуттай – как плывущее облако","Ксения сахнада ... жеңил бийлеп жатты.","айбыгат (тартынат, коркот) – боится, стесняется","Мышык Сережадан ..., чымчыкка тийген жок.","Душман ... артка чегинди.","кейикчээл (кайгычыл) – вечно грустный, нудный","кеселден – от болезни","Кыйнаган ... чүнчүп кетти.","жашынан тартсын мээнетти – пусть с молоду трудиться","эсерден (көпкөндөн) – от легкомысленных, придурковатых","... балдардан алыс болгула."]},{"t":"p","h":"1. Акын «Айтамын санат тобуна» деген чыгармасында турмуштук кандай кырдаалдар, көрүнүштөр жөнүндө нуска кептерин айтат? 2. Анын турмуш, жашоо жөнүндөгү ойлору, нерселерди, кубулуштарды салыштыруулары, табият көрүнүштөрүн сүрөттөөлөрү туурабы? Силер акын болсоңор кандай сүрөттөйт элеңер? 3. Акындын санат-насыяттарын турмушунарда колдонууга аракеттенгиле."},{"t":"p","h":"1 Кайрылат – здесь оказывает помощь, проявляет заботу"},{"t":"p","h":"2 Кам урат – заботиться"},{"t":"v","l":["3 Безерден – здесь не порядочного (человека).","4 Жадыңа (эсиңе) – здесь сохрани в памяти, запомни"]},{"t":"p","h":"<span class=\"pg\" data-n=\"76\">76<\/span>1. Жеңижоктун өмүрү, чыгармачылыгы жөнүндө өзүңөр уккан же башка китептерден окуган маалыматыңар болсо айтып бергиле. Ырларынан жаттап, көркөм айтууга көнүккүлө"},{"t":"p","h":"2. «Айтамын санат тобуна» деген нуска ырынан ата-энелерге, балдарга, жигиттерге айтылган насыяттарды өзүнчө бөлүп жазгыла. Алардын маанисин түшүндүргүлө. Токтогулдун, Барпынын санат-насыяттары менен салыштырып, окшоштуктарын, айырмачылыктарын тапкыла. Бул санат, нуска ырында көптөгөн элдик макалдар колдонулган. Аларды тексттен таап, өзүнчө жазып чыккыла, которгула жана маанисин чечмелегиле."},{"t":"p","h":"Үлгүсү: Атың барда жер тааны – пока, у тебя есть конь, познай мир. Атаң барда эл тааны – пока у тебя есть отец, узнай людей ..."},{"t":"p","h":"3. Чыгармадан уйкаш сөздөрдү тапкыла жана алар кайсы сөз түркүмдөрүнө жатарлыгын аныктагыла:"},{"t":"p","h":"Үлгүсү: Кашта бар – ташта бар (зат атооч+этиш – зат атооч + этиш) жылдызда – кыргызда (зат атооч – зат атооч); балаңа – сага да – (зат атооч – ат атооч) ж.б."},{"t":"p","h":"4. Төмөнкү таблицаны сөздүн маанисине карай толтургула. Сан-эсеп сөздөр: 1860, 1918. Жер-суу аттары: Алатоо, Аксы, Айдыңкөл. Жаныбарлардын аталыштары: суусар, кундуз. Мааниге ээ эмес сөздөр: ... 5. Вспомните как образуются лица глагола. Из прочитанного произведения найдите глаголы и определите их лица,"},{"t":"h3","h":"ТҮШҮНДҮРМӨ СӨЗДҮК"},{"t":"p","h":"адабий псевдоним (грекче жашыруун ат дегенден) – жазуучунун өзү коюп алган кошумча адабий аты. Жеңижок деп эл ичинде айтылып жүрүп, таралып кеткен."},{"t":"p","h":"айтыш (поэтическое состязание акынов) – ырчылардын көпчүлүк алдында сындан өтүп, алым сабакташып ырдашы."},{"t":"p","h":"санат ыры (поучительная песня)- кыргыз элинин оозеки чыгармачылыгында жана акындар поэзиясында кеңири тараган жанр. Буларда элдин турмуштук тажрыйбаларынын жыйынтыгы берилет, жаман-жакшы сапаттар саналып өтүлөт."},{"t":"p","h":"куржун (переметная саква)- арта салынып жүрүүгө ылайыкталып, ортосу бириктирилген эки көздүү баштык. Бул баштык лөк куржун, кол куржун, ат куржун деп чоң, кичинесине жараша бөлүштүрүлөт."},{"t":"p","h":"арча (можжевельник, древовидный) – жайы-кышы көгөрүп туруучу, ийне жалбырактуу, жыттуу жыгач."},{"t":"p","h":"туур – подставка, насест для ловчей птицы, соколиный или орлиный постамент."},{"t":"p","h":"алты чака пул – букв. шесть ведер меди. Мелкая медная монета. көтөрүм кылуу (довести до истощения – абдан арыктаткан, каруу- күчтөн ажыраткан."}],"sub":[{"title":"СӨЗДҮК","b":5},{"title":"ТҮШҮНДҮРМӨ СӨЗДҮК","b":42}],"pages":[72,76]},{"title":"МОЛДО КЫЛЫЧ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"77\">77<\/span>МОЛДО КЫЛЫЧ"},{"t":"p","h":"(1866-1917)"},{"t":"p","h":"Кылычтын жазып кеткен чыгармалары көп. Мен бала кезимде Кылыч – элдин тарыхын көп айткан, элдин сүйгөн акыны эле. Маданияттын эң мыкты үлгүсү Кылычта бар. Ошондуктан анын чыгармаларын балдарга чыгарып берсе жакшы болор эле. Алардын билимдүү азаматтардан болуп өсүшүнө зор таасир этмек."},{"t":"p","h":"С. Каралаев"},{"t":"p","h":"Кыргыз элинин жазгыч акыны Молдо Кылыч Шамыркан уулу Кочкор өрөөнүндө туулган. Кылычтын атасы Шамыркан Төрөгелди уулу жашынан тың чыгып, эл бийлөөчүлөрдүн өкүлү болгон."},{"t":"p","h":"Молдо Кылыч жаш кезинен эле атасындай чыйрак, зирек бала болуп чоңоет. Ал арабча кат тааныганды алгач Жумгалдык Баян деген чала молдодон үйрөнөт. Кийин ал Чүйдөгү Мамбеталы менен Акмолдодон жана Токмоктогу Закир халфадан сабак алат."},{"t":"p","h":"Кылыч өзү манап тукумунан болсо да, эл бийлебей, жалаң чыгармачылык менен алпурушкан. Аталаш туугандарына окшоп мал-жан да күткөн эмес, соода-сатыкка да аралашпаган. Жатакта жалгыз аты, саан ую менен калып, кедейлер менен чогуу жашаган."},{"t":"p","h":"Акындын «Кысса зилзала» деген казалы 1911-жылы Казань шаарында жарыкка чыгат. Анын «Керме-Тоо», «Жинди суу», «Чүй баяны» чыгармаларында Кыргызстандын аймагы, табиятынын көрүнүшү, бак-дарак, чөп-чарлар тууралуу баяндалат. Ал эми «Канаттуулар», «Буудайык», «Бүркүттүн тою» деген казалдарында акын куштардын, жан-жаныбарлардын кылык-жоруктарын, сапат-турпаттарын ырга салат."},{"t":"v","l":["1 Чала молдо – полуграмотный мулла","2 Халфа (калпа) – религиозный наставник","3 Мал-жан күтпөй – не разводя скот","4 Соода-сатык – торговля"]},{"t":"p","h":"5 Жатакта калып – здесь летом не выезжал на кочевье (из за бедности)."},{"t":"p","h":"6 Казал (газел, газал) – вид, жанр восточной поэзии"},{"t":"p","h":"<span class=\"pg\" data-n=\"78\">78<\/span>Силер окуй турган «Буудайык» чыгармасы элдеги айтылып жүргөн уламыштын негизинде жазылган. Чыгармада адам менен жаратылыштын ортосундагы табигый бирдик сүрөттөлөт. Жаратылыштын өзүнө тиешелүү мыйзамын бузуу, ага зордук көрсөтүү, акыры адамдын өзүнө зыян болору жөнүндөгү ой-чыгарманын өзөк идеясы."}],"sub":[],"pages":[77,78]},{"title":"БУУДАЙЫК","blocks":[{"t":"h3","h":"БУУДАЙЫК"},{"t":"v","l":["Мурунку өткөн заманда,","Жан-жаныбар аманда,","Абалкан аттуу кан болгон,","Ар түлүккө шай болгон.","Каратөлөк саятчы","Ушул кандын тушунда","Кушка тилмер жан болгон.","Саятчы Төлөк тилмериң","Бир күнү жатып түш көргөн,","Түшүндө жакшы иш көргөн.","Эртең менен болгондо,","Энесине сүйлөгөн:","– Түндө бир жатып түш көрдүм,","Өзүмө жакшы иш көрдүм,","Токойду көздөй барыпмын,","Токойдогу көп кендир","Аны алып келипмин,","Кыз-келинге ийритип,","Торду түйүп алыпмын.","Көк кендир жибек тор алып,","Ак көгүчкөн тир алып,","Эркин-эркин-эркин тоо,","Эркин тоонун ар жагы,","Телегейи тегиз тоо,","Тегиз тоонун бер жагы,","Айры белес, ач кайкаң,","1 Бирдик (биримдик) – сплоченность"]},{"t":"p","h":"түш көргөн (көрөт) – приснился сон токойду көздөй – к лесу жибек тор алып – взял шёлковую сеть"},{"t":"p","h":"2 Жаратылыштын мыйзамын бузуу – нарушать закон природы 3 Кандын тушунда – при (этого) царе"},{"t":"v","l":["4 Ийритип – здесь пряли (делали)","5 Тир (тирүү) алып – взяв живым","6 Ар (арт) жагы – тыльная сторона","7 Телегейи тегиз тоо – здесь красивые величавые горы","8 Бер (бери) жагы – лицевая сторона","<span class=\"pg\" data-n=\"79\">79<\/span>Алакандай көк тайпаң,","Мына ошого барыпмын.","Чырпыктарды сайыпмын","Торду жайып салыпмын.","Куш төрөсү Буудайык,","Аны кармап алыпмын.","Абалкандай Жаныбек,","Ага тартуу кылыпмын.","Төрт түлүктөн төрт тогуз,","Аны берди бегилик.","Саадагым сары алтынга","толтурду,","Санаам менен болтурду.","Көмүркөйүм көп күмүшкө","толтурду,","Көңүлүм менен болтурду.","Буларды алып жатыпмын.","Бул эмне болучу,","Энеке, бул түшүмдү жоручу?","тор саюу – ставить сеть"]},{"t":"p","h":"сары алтынга толтурду – наполнил золотом"},{"t":"v","l":["","көп күмүшкө – серебром наполнил","","бул эмне болучу – что это такое"]},{"t":"p","h":"– Мен уктум эле, балам, карыдан, Көптү көргөн сарыдан,"},{"t":"v","l":["Буудайык кармап алганда,","Бу тапка кирбейт дечү эле.","Тапка кирсе буудайык,","Колго конбойт дечү эле.","Колго консо буудайык,","Туурга турбайт дечү эле.","Туурга турса буудайык,","Үндөккө келбейт дечү эле.","Үндөккө келсе буудайык,","Кармап алган ээсинин","Төш этин оёт дечү эле,","Боор этине тоёт дечү эле,","карыдан – от старых (людей)"]},{"t":"p","h":"кармап алганда – когда поймает кармап алган ээсинин – поймавшего хозяина"},{"t":"v","l":["","1 Чырпыктарды сайыпмын – вбил колышки","2 Кармап алыпмын – поймал (я)","3 Саадагым – здесь колчан (мой)","4 Көмүркөйүм – сундучок мою","5 Колго конбойт – на руку не садиться","6 Туурга турбайт – на подставку не садиться"]},{"t":"p","h":"7 Үндөккө келбейт – на зов не откликивается (не летит) 8 Төш эт – мясо грудинки 9 Боор этине тоет – насытится печенью"},{"t":"v","l":["<span class=\"pg\" data-n=\"80\">80<\/span>Канын көзүнө куят дечү эле,","Анан табы катуу буудайык","Тапка кирет дечү эле.","Койгун, балам, сен барба!","Азапка мени сен салба!","Энесинин сөзүнө","Саятчы бала болгон жок,","Асили тилин алган жок.","Кушка тилмер саятчы","Көк жибектен тор алып,","Көк көгүчкөн тир алып,","Көк тайпанга барганы,","Төлөнү казып салганы.","СӨЗДҮК"]},{"t":"p","h":"койгун, балам, сен барба – да брось, сынок, ни ходи азапка салба – не причини мне боль, страдания болгон жок – здесь не послушался көк тайпаң – здесь место ровный и поросший травой"},{"t":"v","l":["бала кезимде – в детстве, когда я был еще ребенком","... эмнелер гана болбойт."]},{"t":"p","h":"билимдүү азаматтардан болуп – стать образованным молодым человеком"},{"t":"v","l":["... бол! Азамат ... окуучу. ... умтулгула!","эл бийлөөчүлөрдүн өкүлү— представитель власти","Төрөгелди ... болгон. Рахаттын атасы ... өкүл."]},{"t":"p","h":"чыйрак, зирек – смелый (ловкий), понятливый(смышленный) манап тукумунан болсо да – хотя он родом из манапов (из аристократического сословия)"},{"t":"v","l":["алпурушкан – возился","Роман кечке чуко менен ...","табиятынын көрүнүшү – вид природы (кыргызской земли)"]},{"t":"p","h":"кылык-жоруктарын, сапат-турпаттарын – поведении, характеров птиц и животных"},{"t":"p","h":"Бегбарстын ... чыга баштады. Русландын ... жолдо калсын. Өрүк ... жыгач. Олянын ... кантет?"},{"t":"v","l":["өзөк (негизги) идеясы – основная идея","... жалгап алайынчы."]},{"t":"p","h":"... чыккан өрт жаман, өздөн чыккан жат жаман (макал). ар түлүккө шай – имеющий много разного скота"},{"t":"v","l":["түшүндө жакшы иш көргөн – во сне видел хорошее","кендир – кенаф.","Бишкекте ... токуучу фабрика бар.","айры белес, ач кайкаң – раздвоенный отрог","алакандай көк тайпаң – маленькая лужайка","түшүмдү жоручу – истолкуй сон (мою)","... эле жерге батты. ... олтурушту.","тапка кирбейт – нельзя приучить","табы катуу Буудайык – не послушный Буудайык","1 Асили (дегеле, эч кандай) – здесь никак"]},{"t":"p","h":"2 Төлөнү казып салганы – землянку (он) вырыл (построил)"},{"t":"p","h":"<span class=\"pg\" data-n=\"81\">81<\/span>1. Молдо Кылыч деген ким экен? Кандай үй-бүлөдө төрөлүп, чоңоюптур, чыгармачылыгы кандай өнүгүптүр? 2. Акын Буудайыктын тарыхын кандай баяндайт? 3. Саятчы Төлөк ким экен жана кайсы хандын тушунда жашаптыр? 4. Ал кандай түш көрдү? 5. Энеси кантип жоруду?"},{"t":"p","h":"Молдо Кылычтын өмүрү, чыгармачылыгын жана «Буудайыктын» биринчи бөлүмүн окуп чыккыла. Буйрук этишти эске түшүргүлө, бөлүмдөн буйрук этиш катышкан сүйлөмдөрдү көчүрүп жазгыла."},{"t":"p","h":"Үлгүсү: Койгун, балам, сен барба?.."}],"sub":[],"pages":[79,81]},{"title":"БУУДАЙЫКТЫН ДАЙЫНЫ","blocks":[{"t":"h3","h":"БУУДАЙЫКТЫН ДАЙЫНЫ"},{"t":"v","l":["Нак ошо кез күндөрдө","Жамы куштун төрөсү –","Буудайык тамашага чыгыптыр,","Кабар салып куштарды,","Бирин койбой жыйыптыр."]},{"t":"p","h":"Он ылаачын, он туйгун жыйыптыр (жыйды) – собрал Оң жагында кароолу,"},{"t":"v","l":["Беш ылаачын, беш туйгун,","Беш жагында кароолу.","Туштап учкан турумтай,","Жандап учкан жагалмай,","Кырдап учкан кыргыек,","Төө көтөргөн тазкара,","Туу белгиси каркыра,","Эшик ага бүркүтсүң,","Чын ачуусу келгенде,","Жалпы кушту үркүтсүн,","Баарын жыйып алды ошол,","Тамашага чыкты ошол."]},{"t":"p","h":"Саятчы Төлөк Буудайыкты андып жатса, анын торуна чалынып бөктөргө түшүп калат. Саятчы бөктөргөнү торунан чыгарып алса, ал жалынып, коё беришин суранат."},{"t":"p","h":"1 Жамы куштун төрөсү – здесь царь (господин) всех птиц."},{"t":"p","h":"2 Кароолу (карооолчулары) – здесь стражники 3 Туштап учкан – здесь летевший прямо (в его сторону) 4 Жандап учкан – летевший рядом"},{"t":"v","l":["5 Туу белгиси – здесь знамя","6 Эшик ага – здесь руководитель охраны","7 Үркүтсүн (үркүтөт) – здесь наводит страх","8 Аңдып жатса – когда выслеживал","9 Чалынып – попался в сети","10 Жалынып – умолял"]},{"t":"p","h":"<span class=\"pg\" data-n=\"82\">82<\/span>Ордуна Буудайыкты азгырып алып келип берүүгө убада кылат."},{"t":"p","h":"Саятчы аны коё берет. Бөктөргө Буудайыкка барып, көп көгүчкөндөрдү көргөндүгүн айтат. Ага ишенген Буудайык бөктөргөнү ээрчип келип, торго чалынып, колго түшөт. Ошондо саятчынын сынап турган кези:"},{"t":"v","l":["Жакын жаткан саятчы,","Төлөдөн чыга калды ошол...","Барып баса калды ошол,","Чыгарып тордон алды ошол.","Ары имерип караса,","Бери имерип караса,","Чын Буудайык өзү экен,","Өзү турмак көзү экен.","Мунун текөөрү темир турбайбы,","Тепкени өлөт турбайбы.","Үнү заар турбайбы,","Жүнү чаар турбайбы,","Куйругу кундуз турбайбы,","Чабыты жылдыз турбайбы,","Бели мекир турбайбы,","Көзү чекир турбайбы,","Куйругу кучак турбайбы,","Чалгыны бычак турбайбы.","Чын Буудайык өзү экен,","Өзү турмак көзү экен.","Кушка тилмер саятчы","Баабединди көп айтып,","Үйүн көздөй жөнөдү.","Үйүнө алып келди ошол.","Эл журтунун баарына,"]},{"t":"p","h":"ары-бери имерип – осмотрел во всех сторон тепкени өлөт – от его сильного удара умирают все жүнү чаар – перья (у него) разноцветные куйругу – хвост чабыты – полёт, рысканье в поисках добычи үйүнө жөнөдү – пошёл домой"},{"t":"p","h":"1 Азгырып алып келип берүүгө – привести обманом"},{"t":"v","l":["2 Көргөндүгүн айтат – сказал что видел","3 Ээрчип келип – следуя за ним","4 Сынап турган кези – испытывая смотрел"]},{"t":"p","h":"5 Текөөрү темир турбайбы – задний коготь у него как железо, тверд."},{"t":"v","l":["6 Үнү заар – голос у него неприятный","7 Бели мекир – хребет у него сильно изогнутый","8 Көзү чекир – на глазу бельмо (у него)","9 Куйругу кучак – огромный хвост (в охапку)"]},{"t":"p","h":"10 Чалгыны бычак – здесь крылья у него как ножи (острые)"},{"t":"v","l":["<span class=\"pg\" data-n=\"83\">83<\/span>Кабарды катуу берди ошол.","Калың түлөө кылды ошол","Абалкандай Жаныбек","Буга алып келди ошол. алып келди – принёс","СӨЗДҮК","нак ошо кез күндөрдө – как раз в те дни","тамашага чыгыптыр – вышел для развлечения","ылаачын – сокол-сапсан","туйгун – белый ястреб-стеревятник","турумтай – дербник","жагалмай – чеглок","кыргыек – ястребок молодой","тазкара – черный гриф","каркыра – журавль","бөктөргө – камышовый или болотный лунь","Кыргызстандын аймагында ..., ..., ... ж.б. куштар жашайт.","көгүчкөндөрдү көргөндүгүн – что видела голубей","баса калды – набросился","Төлөк кушту ... Наташа машинканы ..."]},{"t":"p","h":"1. Буудайык эмнеге чыкты эле? 2. Жанында ээрчиген кайсы куштар экен? 3. Саятчы Төлөк кайсы куштун жардамы менен аны кармады? 4. Буудайыктын сыны (турпаты) кандай экен? 5. Ал эмне үчүн баабедин айтып, түлөө берди? 6. Буудайыкты кимге берди?"},{"t":"p","h":"1. Экинчи бөлүмдү окуп чыгып, Буудайыктын турпатын (көрүнүшүн) орус тилине которгула. Анын сүрөтүн тарткыла."},{"t":"p","h":"2. Этиштин ыңгайларын эске түшүргүлө. Чыгармадан буйрук, ниет жана шарттуу ыңгай катышкан сүйлөмдөрдү тапкыла, көчүрүп жазгыла."},{"t":"v","l":["1.","2.","3."]},{"t":"p","h":"3. Төмөнкү сөздөрдү жана сөз айкаштарын катыштырып сүйлөмдөрдү түзгүлө: нак ошол кезде, жамы куш, алды ошол, өзү турмак, турбайбы, баабедин айтты, түлөө кылды. Төмөнкү сүйлөмдөрдөгү орусча сөздөрдү кыргызчага которгула. 1. Молдо Кылыч (очень знаменитый) акын болгон. 2. Акындын «Буудайык» (произведении) жаратылыштын (естественный), (самостоятельный) өнүгүү мыйзамы жөнүндө сөз болот. 3. Буудайык (вместе собой) ылаачын, ... ж.б. куштарын ээрчитип алды. 4. Саятчы Төлөк Буудайыкты (освободил из сети) жана Жаныбек ханга (подарил). 5. Буудайыктын (хребет сильно изогнутый), (на глазу бельмо), (огромный хвост), (крылья острые) экен."},{"t":"p","h":"<span class=\"pg\" data-n=\"84\">84<\/span>4. Этиштин мамилелерин эске түшүргүлө. Тексттен этиштин өздүк, аркылуу, кош мамилелерине мисал тапкыла. Этиштин ма-"},{"t":"v","l":["милелерине өзүңөр мисал жазгыла.","Үлгүсү: Окурмандар гүл коюп таазим кылып турушат (кош","мамиле). Келинчеги ыза болгон түр менен Акайга ачууланды (өздүк","мамиле). Жокчулук Акайды бугуну атууга баргызды (аркылуу","мамиле)."]}],"sub":[],"pages":[82,84]},{"title":"БУУДАЙЫК ЖАНЫБЕКТЕ","blocks":[{"t":"h3","h":"БУУДАЙЫК ЖАНЫБЕКТЕ"},{"t":"v","l":["Ат баштаган бир тогуз,","Аны берди бегилик.","Төө баштаган бир тогуз,","Муну берди бегилик.","Уй баштаган бир тогуз,","Аны берди бегилик.","Саадагын сары алтынга толтурду,","Санаасы менен болтурду.","Абалкандай Жаныбек,","Буудайыкты алды ошол.","Куш төрөсү Буудайык","Колго конбой койду ошол.","Колго консо Буудайык,","Туурга конбой койду ошол.","Туурга консо Буудайык,","Тапка кирбей койду ошол.","Тапка кирсе Буудайык,","Үндөккө келбей койду ошол.","Анда, Абалкандай Жаныбек","Калкына кабар салды ошол."]},{"t":"p","h":"«Буудайыкты ким тапка киргизсе, самаганын беремин» – деп жар салды."},{"t":"p","h":"Анда калың элдин ичинен куу кемпир чыгып келип:"},{"t":"p","h":"«Алдаяр ханым, мен тапка киргиземин, менин самаганымды бериңиз», – деди. Хан: «Самаганыңды айт, беремин» – деди."},{"t":"v","l":["","1 Алды ошол – взял к себе","2 Колго конбой койду – не сел на руку","3 Калың эл – народ","4 Куу кемпир – хитрая старуха","5 Тапка киргиземин – я приучу (выдрессирую)","6 Самаганыңды беремин – все что захочешь отдам."]},{"t":"p","h":"<span class=\"pg\" data-n=\"85\">85<\/span>Кемпир: «Буудайыкты ким кармаса ошону сойгузуп, төш этинен ойгузуп, боор этине тойгузуп, канын көзүнө куйса, тапка кирет, жайылып чыкканда көзүнө эмне көрүнсө ошону алат», – деди."},{"t":"p","h":"Аны уккан соң хан саятчыны чакыртты. Хан саятчыны союп, Буудайыкка жем кылып берди."},{"t":"v","l":["Куш төрөсү Буудайык","Саятчынын төш этинен ойду ошол,","Боор этине тойду ошол,","Көзүнө канын куйду ошол.","Тапка кирбес Буудайык,","Тапка кирип калды ошол,","Абалкандай Жаныбек","Алып чыгып салды ошол.","Көсөө куйрук, көк даңгыт,","Карышкыр алды Буудайык.","Чагарак куйрук, чаар жоон","Жолборс алды Буудайык.","Тоого салса Буудайык,","Тоодон эме койбоду.","Ал аңгыча болбоду","Алды жаккы батуудан","Алтымыш айры ак бугу,","Арбандап качып берди ошол.","Абалкандай Жаныбек","Ага шилтеп калды ошол.","Азуулуу куштун баласы","Ак бугуга карабай","Асмандап учуп калды ошол.","карабай – здесь не обращая внимания","1 Сойгузуп (сойдуруп, союп) – зарезать, убить","2 Ойгузуп (оюп) – выколоть (глаза)","3 Чакыртты – велел привести","4 Жем кылып берди – скормил","5 Көзүнө канын куйду – налил в глазу его крови","6 Алып чыгып салды – взял, да пустил на охоту"]},{"t":"p","h":"7 Чагарак куйрук, чаар жон – толстый хвост, загнутый кольцом, чубарая спина"},{"t":"v","l":["8 Ал аңгыча болбоду – как вдруг","9 Батуудан – от впадины, низины","10 Шилтеп (шилтөө) калды – здесь пустил, направил","11 Азуулуу куштун баласы – дитя хищней птицы","12 Асмандап учуп – взвился высоко в небо","<span class=\"pg\" data-n=\"86\">86<\/span>Караны кара аларбы,","Качып карап каларбы.","Төрөнү төрө аларбы,","Төмөн карап каларбы.","Куш төрөсү Буудайык","Алтындан боосун тытты ошол,","Айга карап сызды ошол...","Күмүштөн боосун тытты ошол","Күнгө кайым болду ошол...","СӨЗДҮК"]},{"t":"p","h":"күмүштөн боосун – здесь серебряный шнур (веревку)"},{"t":"v","l":["","санаасы менен болтурду – (он) осуществил (его) мечту","Жаныбек Төлөктүн эңсегенин аткарды.","Кабар салды, жар салды – объявил, известил","Рома класска ... Рома бүт мектепке ...","көзүнө эмне көрүнсө – что попадало на глаза","көсөө куйрук, көк даңгыт – коротко хвостовый волк-кобель","эме (эч нерсе, эчтеме) койбоду – ничего не оставил","Алик ... койбой жалмады. Бул жерде ... жок.","Эчтемке менен ишиң жок.","арбандап качты – растерянно, панически бежал","Ак бугу ... качты. Түн ичинде бирөө ... жүгүрдү."]},{"t":"p","h":"1. Абалкандын Жаныбек Буудайыкты эмне кылды? 2. Эмне үчүн жар айттырды? 3. Кемпир кандай кеңеш берди? 4. Төлөк эмне болду? 5. Буудайык тапка киргенден кийин эмне үчүн качып кетти?"},{"t":"p","h":"1. Чыгарманы толук окуп чыгып, автор айтайын деген идеяны, өзөк ойду тапкыла."},{"t":"p","h":"2. Саятчы Төлөктүн, кемпирдин, Жаныбектин мүнөздөрүн салыштыргыла, портретин түзгүлө."},{"t":"p","h":"3. Чыгарманы көркөм окуп, Төлөктүн, энесинин, хан жана кемпирдин сөздөрүн бөлүп алып жаттагыла. Саятчынын Буудайыкты сүрөттөөсүн өзүнчө бөлүп көрсөткүлө."},{"t":"p","h":"4. Төмөнкү сөздөрдү катыштырып, «Канаттуулар» деген аңгеме түзгүлө. Анда ар бир канаттуунун касиет-сапаттарын чагылдырууга аракеттенгиле: көгүчкөн, буудайык, ылаачын, турумтай, жагалмай, кыргыек, таз кара, каркыра, бүркүт, сагызган, жаман сары ж.б."},{"t":"p","h":"Мисалы, «Сагызган сактыгынан өлбөйт, суктугунан өлөт», «Ылаачын учкул канаттуу катары эсептелинет»..."},{"t":"p","h":"1 Караны карага, төрөнү төрөгө – похожих, родственных, равно могучих (нельзя сталкивать, противопоставлять)."},{"t":"p","h":"2 Алтындан боосун тытты – разорвал золотой шнур (удерживающую ее)"},{"t":"v","l":["3 Айга карап сызды – взвился к луне","4 Кайым (кайып) болду – изчез"]},{"t":"p","h":"<span class=\"pg\" data-n=\"87\">87<\/span>5. Канаттуулар жөнүндө өзүңөр билген табышмактарды, макал-лакаптарды, кызыктуу окуяларды жазып келгиле."},{"t":"h3","h":"Табышмактар"},{"t":"p","h":"Ай асманда жүргөн жигит, Алтын чоор тарткан жигит. Күн асманда жүргөн жигит, Күмүш чоор тарткан жигит. (к..., т...)"},{"t":"p","h":"Буттарында жарагы"},{"t":"v","l":["Бийик жерде жатагы.","","Көзүнө топу кийбесе,","Көбөйөт экен чатагы. (б......)","Ылайдан үй салышат жай айында,","Кышында түк калышпайт бул айылга. (ч..........)"]},{"t":"h3","h":"Макал"},{"t":"p","h":"Куш төрөсү – буудайык, Ит төрөсү – кумайык."},{"t":"p","h":"7. Төмөнкү сөздөрдү катыштырып, чыгарманын мазмунун кыргызча баяндап бергиле: саятчы, тилмер, айры белес, ач кайкаң, бегилик, бир тогуз, көмүркөй, туур, үндөк, төш эти, алтымыш айры ак бугу, текөөрү темир, баабедин."},{"t":"p","h":"8. Караны кара аларбы,"},{"t":"v","l":["Качырып карап каларбы,","Төрөнү төрө аларбы,","Төмөн карап каларбы."]},{"t":"p","h":"Ырдын маанисин чечмелегиле, жаратылыштын адам колу тийгис дагы кандай мыйзам ченемдерин билесиңер? Ушул темада «Жаратылышты бузуу – жан дүйнөнү бузуу» деген темада ой толгоо дилбаянын жазгыла."},{"t":"p","h":"Эсиңерге түйүп алгыла!"},{"t":"p","h":"Молдо Кылыч өз доорунда жогорку даражада турган алдыңкы пикирлүү адам болгон. Кыргыз элинде караңгылык өкүм сүрүп турган учурда Кылыч китеп маданияты, адабият менен таанышып, кыргыздын биринчи жазма адабиятын баштоочулардан болгон."},{"t":"p","h":"Молдо Кылыч жалаң эле ыр жазбастан, төкмөчүлүк жагынан да айтылуу акындардан кем калган эмес. Ал XIX кылымдын аягында биринчилерден болуп кыргыз жазма адабиятын негиздеген. (Т.Саманчин)"},{"t":"h3","h":"АДАБИЯТ ТЕОРИЯСЫНАН"},{"t":"h3","h":"Жазгыч акындар жана жазма адабият жөнүндө"},{"t":"p","h":"Кыргыз адабиятында Октябрь төңкөрүшүнө чейинки мезгилде өз чыгармаларын кагаз бетине түшүрүшкөн сабаттуу акындарды жазгыч акындар деп аташат. Алар Молдо Нияз, Молдо Кылыч, Алдаш Молдо, Тоголок Молдо, Ысак Шайбеков ж.б. Булар өтө көп тарыхый, этнографиялык адабий жана тилдик мурастарды калтырышкан."},{"t":"p","h":"1 Өз доорунда – в свое время"},{"t":"v","l":["2 Караңгылык – темнота, невежество","3 Баштоочулардан – один из оснавателей","4 Айтылуу акындардан – от знаменитых акынов","5 Сабаттуу – грамотные"]},{"t":"p","h":"<span class=\"pg\" data-n=\"88\">88<\/span>Кыргыз адабияты негизинен оозеки өнүгүп келген болсо да, тарыхта жазма адабият да болгондугун Орхон-Енисей жазма тексттери, М.Кашгаринин, Ж. Баласагындын эмгектери жана XIX кылымда – XX кылымдын биринчи жарымында жашаган Молдо Нияз, Молдо Кылыч, Тоголок Молдо өндүү жазгыч акындардын чыгармачылыктары толук айгинелеп турат."},{"t":"h3","h":"ТҮШҮНДҮРМӨ СӨЗДҮК"},{"t":"p","h":"манап – кыргыз элинде Совет дооруна чейин эл бийлеген, элдин эсебинен жашаган башкаруучу таптын өкүлү."},{"t":"p","h":"жатак – этн. постоянное жилище. Бедняки остающиеся на одном месте летом и зимой."},{"t":"p","h":"түш жоруу (истолкование снов) – көргөн түштүн маанисин чечмелеп, багыт берип түшүндүрүү, чындыкта мындай болот деп болжолун айтуу."},{"t":"v","l":["саятчы – охотник на ловчих птиц","кушка тилмер – человек, якобы понимающий язык птиц.","тор – сеть для ловли птиц."]},{"t":"p","h":"тир (жем) – пища которая ставилась внутри сети, приманка буудайык – куштардын падышасы, эң зору катары саналган кыраан жырткыч куш."},{"t":"p","h":"тартуу – подношение. Обычно преподносилось к власть имущим. бегилик – дар, пожертвование.Обычно со стороны богатых, власть имущим."},{"t":"p","h":"көмүркөй – небольшой сундучок (чаще из верблюжей кожи) для хранения ценных вещей, мелких инструментов."},{"t":"p","h":"төлө (жертөлө) – землянка, охотничье жилище (стоянка) сложенная из камней."},{"t":"p","h":"туур – подставка, насест для ловчей птицы, соколиный постамент. баабедин (Бахауддин)- имя покровителя Бухары, к его помощи обычно взывают богатыри."},{"t":"p","h":"түлөө – этн. жертва, жертвоприношение, Его иногда устраивают в связи с засухой и т. д. Просят у Всевышнего помощи, благодарят его за поддержку."},{"t":"p","h":"бир тогуз – девятка, подношение или штраф в количестве девяти голов разных домашних животных."},{"t":"p","h":"жар салуу (жар чакыруу) – Объявить во всеуслышанье. Жарчы аркылуу айтылган кулактандыруу, оозеки жарыяланган кабар. алтымыш айры ак бугу – фольклордо кайберендердин падышасы катары сүрөттөлөт (бугу – маралдардын эркеги). куш таптоо – специальная работа, связанная с ловчими птицами."},{"t":"p","h":"1 Мурас – наследие 2 Айгинелеп турат – здесь доказывает, подтверждает, свидетельствует."},{"t":"h3","h":"<span class=\"pg\" data-n=\"89\">89<\/span>КЫРГЫЗ ПРОФЕССИОНАЛ ЖАЗМА АДАБИЯТЫНАН"},{"t":"h3","h":"ААЛЫ ТОКОМБАЕВ"},{"t":"p","h":"(1904-1988)"},{"t":"img","src":"data:image/webp;base64,UklGRjgUAABXRUJQVlA4ICwUAACQuwCdASpwAZ4BPrVUnUsnLSmqLnQJ+aAWiWlt/IrkP4O5sI6sjjCpfLHlUPQA8CxB8CPfPjw+O/6fVrf3tPPXnUKTG//fov+N6hrLzX0JGYl8GeTXZeBHUFUv/wuGaRVIPqEDd9yggvpw7FXoaNwsa86PTe5dlxOM53IJ85elmpN1fYZqDPY6aVzytB/Kg+ ордун да автору. «Жараланган жүрөк» («Раненное сердце»), «Мезгил учат» («Время летит»), «Биз балапан кездерде» деген жана башка повесттери бар. «Ант» («Клятва»), «Тергөө жүрүп жатат», «Өлбөстүн үрөнү», «Күндүн чыгышы» сыяктуу драмалык чыгармаларды да жазган. Өзүңөр байкагандай жазуучунун <span class=\"pg\" data-n=\"90\">90<\/span>көптөгөн чыгармалары окурмандарынын жүрөгүнөн орун таап, сүймөнчүлүк менен окулуп келүүдө. Анын чыгармаларын силер да улам чоңойгон сайын көп окуйсуңар..."},{"t":"p","h":"Акынды эл-журт дайым эскерип турат. 1996-жылы Бишкек шаарынын опера жана балет театрынын маңдайына Аалы Токомбаевдин эстелиги орнотулду. Ошондой эле Эркиндик сейил багы менен Бөкөнбаев көчөсүнүн кесилишинде жазуучунун үй-музейи иштейт. Окурмандар жана жалпы эле эл сүйүктүү жазуучусун ушул жайларга барып эскеришип, таазим кылып гүл коюп турушат."},{"t":"p","h":"Силер окуй турган «Акай мерген» аңгемеси 1933-жылы жазылган. Аңгеме сюжетинин чакандыгы, окуясынын курчтугу менен айырмаланат. Бир кездеги кыргыз элинин башынан өткөргөн тарыхый турмушун көркөм баяндайт."},{"t":"h3","h":"СӨЗДҮК"},{"t":"p","h":"даана көрсөткөн чоң күзгү – четко отражающее большое зеркало"},{"t":"p","h":"Жарык жолду .... Дубалда ... илинип турат."},{"t":"v","l":["даңк берген (алып келген)— здесь (принес) славу","Республикама ... «Кандуу жылдар» акынга ...","чалкып жаткан – обширное","Акындын чыгармачылыгы ... деңиздей!"]},{"t":"p","h":"баштоочуларынын бири – один из основателей (зачинителей)"},{"t":"p","h":"Токомбаев – кыргыз адабиятынын ... ... – Асан баштаакты алдыга айдады."},{"t":"p","h":"көп чыгармаларды калтырды – оставил множество произведений"},{"t":"p","h":"Анын калтырган ... бар. Карышкыр артына из..."},{"t":"v","l":["балдарга арнап – посвятив детям","Жазуучу көп чыгармаларын ...","эскерип турат – вспоминают","Улан ... Жаш муундар ... Сен ... Мен ...","маңдайына – здесь перед, напротив","Эстелик театрдын ... тургузулган.","Ким Ира Өктөмгө маңдайлаш олтурат."]},{"t":"p","h":"Баатыр болчу жигиттин маңдайынан билинет (макал). кесилишинде – на пересечении"},{"t":"p","h":"Үй-музей эки көчөнүн ... жайгашкан. Кылмышкер он жылга кесилди."},{"t":"v","l":["1 Сүймөнчүлүк менен – с любовью","2 Эл-журт – народ","3 Ушул жайларга – к этим местам","4 Айырмаланат – отличается","5 Бир кездеги – здесь когда-то, в давние времена","<span class=\"pg\" data-n=\"91\">91<\/span>таазим кылып – чтят его память","Эстеликке ... гүл коюшат. Мансур ... кол куушурду.","көркөм баяндайт (чагылдырат) – художественно отражает"]},{"t":"p","h":"1. Ал эми силер бул жазуучу тууралуу (об этом писателе) кандай маалыматтарды билесиңер? (что знаете?) 2. Анын 100 жылдык юбилейи качан болду жана кандай өткөрүлдү? 3. Жазуучу жөнүндө тартылган сүрөт, даректүү (документальный) фильмдерди, тарыхый чыгармаларды (исторических произведении) окуган чыгарсыңар (может читали). Ошол топтогон билимиңердин негизинде (на основе этих сведений), «А. Токомбаевдин – өрнөктүү өнөрү» деген темада өз алдынарча (самостоятельно) дилбаян жазгыла."}],"sub":[{"title":"Макал","b":27},{"title":"ТҮШҮНДҮРМӨ СӨЗДҮК","b":42},{"title":"КЫРГЫЗ ПРОФЕССИОНАЛ ЖАЗМА АДАБИЯТЫНАН","b":56},{"title":"Кайталоо үчүн суроолор","b":62}],"pages":[85,91]},{"title":"АКАЙ МЕРГЕН","blocks":[{"t":"h3","h":"АКАЙ МЕРГЕН"},{"t":"h3","h":"I"},{"t":"p","h":"Эгинчилик элдин негизги кесиби эмес, шамал менен бирге көчүп, мал менен оокат кылышат."},{"t":"p","h":"Малсыздар телмирип, бай-манаптарга коңшу. Алардын бекер эмгектери менен алда кимдер карындарын чертишет. Аларды мал катарында пайдаланышат. Колунда малы жок болсо да, Акай мерген өз оокаты менен өзү алек. Анын оокаты, анан малы аскаларды ээлеген тоо кийик, кулжа, бугу, маралдар болучу. Кеп ошол мерген жөнүндө."},{"t":"p","h":"Бир күнү Акай мерген мөлтүрөгөн кара көз келинчегин чакырып:"},{"t":"p","h":"– Сен ок куя турган май сурап келчи, – деди да, кара мылтыктын сайлыктарын чукулады. Өзү эритип алган коргошунун ары-бери кармап, тойпондогон балдарын ойнотту."},{"t":"p","h":"– Мен мындай атам."},{"t":"p","h":"– Жок, сен ата албайсың. Мен так мына минтип атамын, – деп мергендин мөмөдөй балдары кара мылтыктын сүмбөсү менен ойноп жатышты. Акайдын калдайган кара кисеси менен окчонтоюн алып, эки баласы өздөрүнчө ок, саадактуу киши сыяктанышты. Аны ары-бери сүйрөп"},{"t":"p","h":"1 Эгинчилик (дыйканчылык кылуу) – здесь крестьянство, земледелие."},{"t":"p","h":"2 Малсыздар (малы жоктор) – бедняки, не имеющие скот 3 Мал катарында пайдаланышат – используют как скот 4 Мерген – охотник 5 Ок куя турган май – жир, который использовали для литья пули (в давние времена)"},{"t":"v","l":["6 Келинчегин – молодую жену","7 Мөмөдөй балдары – маленькие детишки"]},{"t":"p","h":"<span class=\"pg\" data-n=\"92\">92<\/span>алек-челек болушту. Акай мерген ачкалыгына карабай капарсыз ойноп жаткан балдарга карап олтуруп, эмнегедир бырс этип күлүп жиберди."},{"t":"p","h":"– Майың менен мамыран болгур, – деп Акай мергендин аялы ачууланып кирди. Май сураймын деп алда кимден тил укканын айтып, ыза болгон түр менен Акай мергенге ачууланды."},{"t":"p","h":"Акай мерген акырын гана ийнинен тынып улутунду да:"},{"t":"p","h":"– «Жокчулук уят эмес, байлык мурат эмес». Анын эмнесине капа болосуң! – деп сүрдүү, өткүр кара көзү менен аялына бир карап, кайта аны эркелете баштады. Бирок өзүнүн капа болгонун билдирбей, бырс этип күлүп да жиберди."},{"t":"p","h":"Акай кара бараңды ийнине салды да, үйдөн чыкты. Борсондогон чоңураак баласы ары-бери жүгүрүп кубана баштады."},{"t":"p","h":"Беркиси: «Байке, эмне атып келесиң?» – деди."},{"t":"h3","h":"СӨЗДҮК"},{"t":"p","h":"шамал менен бирге көчүп – обр.выр. кочуя вместе с ветром бекер эмгектери менен – бесплатным трудом карындарын чертишет (курсактарын сылашат) – обр. выр. чешут свои брюхи. Элдин эмгегине ..."},{"t":"v","l":["өз оокаты менен өзү алек – занят своим хозяйством","Тима өз оюну менен ...","мөлтүрөгөн кара көз – проблескивающие черные глаза","Жибек ... кыз. Рашиданын көзү ..."]},{"t":"p","h":"кара мылтыктын сайлыктарын – нарезки на стволе ружья"},{"t":"p","h":"Мерген ... чукулады."},{"t":"v","l":["тойпондогон балдарын – резвящихся детей","Токтогулдун « ... » деген ырын окуганбыз.","капарсыз ойноп жаткан – беспечно играющих","Гена окуудан капары жок ..."]},{"t":"p","h":"тил укканын айтып – рассказывая что ее оскорбили, обругали."},{"t":"p","h":"Аялы ... айтты. Руслан тентек кылганы үчүн атасынан ... борсоңдогон чоңураак баласы – его пухленький мальчик, что по старше Акайдын балдарынын бирөө ..., бирөө ..."},{"t":"v","l":["Иттин күчүгү ... жүгүрдү.","","1 Алек-челек болушту – возились, хлопотали"]},{"t":"p","h":"2 Бырс этип күлүп жиберди (тууранды сөз) – он прыснул со смеха, внезапно засмеялся."},{"t":"p","h":"3 Майың менен мамыран болгур – к черту этот жир 4 Ийининен тынып улутунду – (он) тяжело вздохнул, опечалился."},{"t":"h3","h":"<span class=\"pg\" data-n=\"93\">93<\/span>II"},{"t":"p","h":"Сымбаттуу орто боюна кара бараң кеп куйгандай келише калды. Өзүнө маалым узун кырдын кызыл арсактарын аралап, корумдарды көмүрдөй тебелей баштады. Бирок текелер жолуккан жок."},{"t":"p","h":"Кыйды болгон бугулар күмүш ала бакан сыяктуу каркайган мүйүздөрүн көтөрүп, суу боюндагы караган-черди аралап да кетишти. Алгыр бүркүттөй талпынган Акай, огунун жалгыздыгына кейип, бара жаткан бугуларды тиктегенден тиктеди."},{"t":"p","h":"Айласы кеткен мерген окчонтой, киселерин чукулоодон башка эчтеме кыла алган жок."},{"t":"p","h":"Мергендин балдары сойгон кийиктин ичинен табылган окторду жыйнап чүкөлөрүнө кыт куюшчу. Мерген эч болбосо ошондой октор табылсачы... деп ойлоду."},{"t":"p","h":"Талыкпай изденип жаткан мергендин жүрөгү, эмнегедир, тапка келген аттай жулкунду. Анын көзү жайнады. Ал жанындай сүйгөн мөлтүрөгөн кара көздүү аялын, же тойпондошкон эки бирдей балдарын кыса-кыса кучактап өпкүсү келди. Ал кисесинен кылдыраган коргошун октун бирин тапкан эле. Анын кубанычы ошол."},{"t":"p","h":"Ошентип, киседен тапкан калдыркан огуна эптеп мылтыгын дүрмөттөп алды да, ичинен шыбырап: «Жаздым атсам, мага шерт, жаңылыш тийсең, сага шерт», – деп мылтыгы менен шерттешип, түнткө кирип, узап кеткен бугуларды көздөп закымдай учту..."},{"t":"p","h":"Тоңкуган бугулар удургуган бойдон, түнт токойдун аркы четиндеги аянтка барды. Адис болгон мерген алда кайдагы кызыл асканы айланып, сонодой учуп, бугулардын алдынан чыкты. Өңүтүнө самагандай жетүүгө болбоду. Анын үстүнө майышкан окко толук ишене албады. Ошондуктан боортоктоп, жыландай сойлоп аран бутага келтирди. Жыт алып калган бугулар шоодой болуп, туура жакка созолоно баштады. Мерген шашкан бойдон тике тура калды, бугулар ага селт карай бергенде, кара барандын түтүнү уюлгуй түштү. Он эки айры бугу чалкасынан жыгылды."},{"t":"v","l":["1 Сымбаттуу орто боюна – его стройному среднему росту 2 Бугулар – олени 3 Каркайган мүйүздөрүн – огромные рога","4 Караган-чер – место поросшее елью","5 Октор – пули","6 Мылтыгын дүрмөттөп алды – зарядил ружье","7 Закымдай учту – помчался по следу","8 Адис болгон мерген – ловкий стрелок"]},{"t":"p","h":"9 Майышкан ок – пуля имеющая вмятину, деформированная пуля. 10 Бутага келтирди – прицелился <span class=\"pg\" data-n=\"94\">94<\/span>"},{"t":"p","h":"Арадан бир күн өткөндө Акайды Байтиктин алдына чакырып барышты."},{"t":"h3","h":"СӨЗДҮК"},{"t":"p","h":"кеп куйгандай (сал) – пришлось как раз впору, к лицу"},{"t":"p","h":"Каринага үкү топу ... жарашат."},{"t":"p","h":"кызыл арсактарын аралап – бродя между красными скалами"},{"t":"p","h":"Мерген ... арсактарды көп аралады."},{"t":"p","h":"күмүш ала бакан сыяктуу (сал) – подобно серебристому алабакану огунун жалгыздыгына кейип – сетуя что (у него) единственная пуля"},{"t":"p","h":"Мергендин ... эле. Ринат өзүнүн ... дайым ..."},{"t":"p","h":"Сыргак ... эле тоодон отун алып келди."},{"t":"p","h":"тапка келген аттай жулкунду (сал.)— рвался как скакун, готовый к скачке"},{"t":"v","l":["көзү жайнады – глаза заблестели, глаза разбежались","Мергендин ... ... Рита бурулуп карады.","жанындай сүйгөн – любил всей душой, от всего сердца"]},{"t":"p","h":"Марат компьютер оюндарын ... Рашиданын ... сабагы – сүрөт. кыса-кыса кучактап – крепко обнимая"},{"t":"v","l":["Балдарын бекем ... өпкүсү келди.","Кыял улагын ... өйдө көтөрдү."]},{"t":"p","h":"кылдыраган коргошун ок – громыхающая свинцовая пуля"},{"t":"p","h":"... араба жолдо келе жатат."},{"t":"p","h":"Кира ... эритти. ... мөндүрдөй жаады."},{"t":"p","h":"тоңкуган бугулар удургуган бойдон – взбудараженные олени рванули. өңүтүнө самагандай жетүүгө болбоду – не получилось как хотелось. боортоктоп, жыландай сойлоп – как змея ползая на брюхе тике тура калды – он встал прямо"},{"t":"p","h":"Мерген ... Бугу чуркады."},{"t":"p","h":"ага селт карай бергенде – когда (олени) резко повернулись к нему. чалкасынан жыгылды – упал навзничь,"},{"t":"p","h":"Игорь ..., Руслан үстөмөнүнөн түштү."},{"t":"p","h":"1. А. Токомбаевдин өмүрү жана чыгармалары жөнүндө эмне билесиңер? Буга чейин анын кандай чыгармаларын окудуңар эле? 2. «Акай мерген» чыгармасынын окуясы кайсы мезгилде болгон деп ойлойсуңар? 3. Акай мерген кайда барууга камданды? 4. Келинчеги экөөнүн ортосунда кандай диалог жүрдү?"},{"t":"p","h":"5. Акай бугуларды көргөндө эмне кылды? Кантип ок таап алды? 6. Ал бугуларды кантип аңдыды жана он эки айры мүйүздүү бугуну кантип атып алды? 1 Жыт алып калган (жыт алган) – учуяв запах 2 Туура жакка созолоно баштады – олени, почуяв запах потянулись в другую сторону"},{"t":"p","h":"3 Арадан бир күн өткөндө – через день <span class=\"pg\" data-n=\"95\">95<\/span>"},{"t":"p","h":"1. Чыгарманын I-II бөлүмдөрүн окуп чыккыла жана оозеки көркөм айтып берүүгө камдангыла. 2. Адабият дептериңерге, адабият күндөлүгүңөргө тексттин кыскача мазмунун жазгыла. 3. Сөздүктү жана түшүндүрмө сөздүктү аныктагыла. 4. Төмөнкү сөз айкаштарын баамдап окугула, берген маанисин түшүндүрүүгө аракет кылгыла жана алар кайсы көркөм сөз каражаттары экендигин аныктагыла, тексттен издеп тапкыла: алда кимдер карындарын чертишет (метафора), мөлтүрөгөн кара көз келинчеги (эпитет), тойпоңдогон балдары, кара мылтыктын сүмбөсү, тапка келген аттай, майышкан ок, жыландай сойлоп. 5. Төмөнкү сүйлөмдөр кайсы жанрдагы чыгармалар экендигин тапкыла жана орус тилине которгула, орус адабиятында буларга окшош үлгүлөр болсо, мисал келтиргиле. «Жокчулук уят эмес, байлык мурат эмес», «Жаздым атсам, мага шерт, жаңылыш тийсең, сага шерт»."},{"t":"h3","h":"III"},{"t":"p","h":"Байтик кең тигилген кара кашка ыпча кемселчен, казылары саландаган бийлердин ортосунда, он чакты жаздыктын арасында жаткан эле. Үйүндөгү элдин канынан жыйналган дүнүйөгө адамдын көзү уялат. Башайы, шайы жууркандар он эки канат үйдүн эки босогосуна чейин жыйылган. Алардын үстүнө кырка тизилген аппак мамык жаздыктар. Жабык бойлогон карышкыр, түлкү, сүлөөсүн, суусар ичиктер. Күмүш ала бакандарга керме тартылып, тизилген арстан, жолборс, аюунун талпактары турат. Шайы төшөк, илбирс терилери чоң үйдүн ичинде каршы-терши салынган. Чоң арстандын териси оозундагы тиштери менен Байтиктин жаздыктарынын алдынан башын чыгарып жатат."},{"t":"p","h":"Желдеттер Акай мергенди эки жагынан сүйрөп келди да:"},{"t":"p","h":"– Алдаяр таксыр, буйругуңуз ордунда, – дешти."},{"t":"p","h":"Олтурган бийлерге мергендин кызыл ала болуп турушу эч кандай таасир кылган жок, ыржайып гана карашты. 1 Он чакты жаздык – около десятка подушек 2 Элдин канынан жыйналган дүнүйө – накопленное за счет народа богатство,"},{"t":"v","l":["3 Жабык бойлогон – по всему (внутреннему) кругу юрты","4 Илбирс терилери – шкура снежных барсов.","5 Чоң арстандын териси – шкура большого льва","6 Желдеттер – стража","7 Ыржайып гана карашты – посмотрели с насмешкой."]},{"t":"img","src":"data:image/webp;base64,UklGRhpEAABXRUJQVlA4IA5EAADw3AGdASp2AvEBPrVUpEsnJSehqxRqqPAWiWlu4WsBGsbvjv7X/7f0deUeMrpX+x6QmbP1/wP/n36+/6eiXh/+d/0/oTfmm+03w8nz+v+9foG06PdfVD/d/hjfQ2//fqo9p54+hoONV8hHtBEpcNV8Y3el/RWZdguC/pUKVdEtNKE6VFEqPWQRKXDVfIR7QRKD8ZQxP0CwEsBDiLz1B6PnszMKBA9WpS3+ZfEf1sxyvpqgoW2OOxjyzlkwpMqxlkvV1a2b6JcuZgPrF9PIwqTw1WUN5xXCT2giUt/1IZaXgPncRPKx1Nq2rn5B3jHQWhpW7DfZWtdD4Pp1FBusar5BwHKbIHDBpJ0hEFv4YNQiGaASDtuunpw2yC5TaMqcDdBameDuVWn ного вперед."},{"t":"v","l":["2 Чуулдай түшүштү – одобрительно зашумели.","3 Аркасына – на спину","4 Көк тал союл – палка, сделанная из ивы.","5 Тымтырс болду – (он) затих.","6 Кокустан – случайно"]},{"t":"p","h":"<span class=\"pg\" data-n=\"97\">97<\/span>– Таксыр, мергендин айыбы эмне? – деп сурап, андан кийин үнсүз турган элге карады."},{"t":"p","h":"– Ырчым, бул итиң баламдын бугусун атып алыптыр, – деди Байтик."},{"t":"p","h":"Он, он бирлерге келген баласы:"},{"t":"p","h":"– Атаке, бугу меники беле? Ал жапан эмеспи? – деди. Акын өзүнүн оозундагы сөзүнө качан болсо да толук ээ эмеспи! Ал тайманбастан өзүнүн оюн айтып калды:"},{"t":"p","h":"– Таксыр, коён жылкы чоң жутта жапайы кийиктерге бетеге жулуп берип бактыңыз беле?"},{"t":"p","h":"Байтик Балыгоозго акырая карады. Балыгооз аянычтуу сыпат менен элге бурулду. Эл тилсиз гана чычырканакта жаткан мергенге бурулуп, кайта жаачу булуттай, түйүлгөн кабактары менен Байтикке акырая карап калышты..."},{"t":"h3","h":"СӨЗДҮК"},{"t":"p","h":"казылары саландаган бийлер – толстопузые судьи адамдын көзү уялат – обр. выр. у человека глаза слепнут"},{"t":"p","h":"Жалтырактан ... Күндүн жарыгынан ... кырка тизилген мамык жаздыктар – пуховые подушки поставленные в ряд"},{"t":"v","l":["... солдаттар. Олеся, ... алып бер.","сүлөөсүн, суусар ичиктер – рысьи, куньи шубы"]},{"t":"p","h":"... токойлуу жерлерде, ... таш-корумдуу жерлерде жашайт. керме тартылган – протянута веревка арстан, жолборстун талпактары – подстилки из шкур льва, тигра каршы-терши салынган – постеленные вдоль и поперек"},{"t":"p","h":"Талпактар ... салынган. Окуучулар ... жүгүрүштү. тиштери менен – зубами"},{"t":"v","l":["Арстандын ... арсаят. Бөрүнүн ... шакылдады.","башын чыгарып жатат – лежит с высунутой головой","сүйрөп келди – (его) приволокли","Желдет мергенди ... Сен отунду ... Мен чананы ...","кызыл ала болуп турушу – окровавленный вид"]},{"t":"p","h":"Мерген ... канга бөлөнүптүр. Кыздар ... болуп кийинишкен. ыңгыранган бойдон – покряхивая"},{"t":"v","l":["Байтик ыңгыранды. Мүдүр креслосуна ... отурду.","жаза бериңиздер – придумайте наказание"]},{"t":"p","h":"Мергенге ... Балдар жаза бергиле, кыздар жооп беришсин. Люсядан жаза кел."},{"t":"v","l":["өкүм өзүңүз тараптан болсун – приговор выносите сами","Өкүм өзүм ... болду. ... өзүң ... Өзү болгон.","7 Жапан эмеспи – да ведь они дикие, не домашние.","8 Аянычтуу сыпат менен – жалостливо.",""]},{"t":"p","h":"<span class=\"pg\" data-n=\"98\">98<\/span>бир киши калбай чогулсун – пусть соберутся все до одного Баары жыйналсын. Оуучулар ... ! Баардыгы ... Бүт ..."},{"t":"p","h":"дамбалчан кылып чечинтип – раздели до нижнего белья (дамбал – нижнее белье)"},{"t":"v","l":["мергенди бөлөй башташты – начали привязывать охотника","Мергенди чычырканакка ... Баланы бешикке ...","уу тикендери аз келгенсип – мало того-что колючие иглы","... чыдатпады. Уу тили чыдатпады.","анын чыңырган үнүн – его пронзительный крик","Мерген чыңырды. Сен ... Мен ... Сиз ... Мергендин үнүн.","Менин ... Сенин ... Алардын ... Силердин ... Сиздердин ..."]},{"t":"p","h":"суудан чыккан балыктай чабалактап – метался как рыба, выброшенная из воды Балыктай чабалактады. ... уктай албадым. ... жетип бардың. булчуңдары солкулдап – он весь дрожал."},{"t":"v","l":["элге таанылган – признанный народом.","Балыгооз ... акын эле.","Адил ... окуучу. Арууке жакшы окуусу менен ..."]},{"t":"p","h":"баламдын бугусун атып алыптыр – (он) застрелил олень моего сына тайманбастан өз оюн айтып калды – он смело высказал свое мнение акырая карады – посмотрел с вытаращенными глазами кайра жаачуу булуттай – в знач. с грозным видом 1. Акайды кимдин алдына алып келишти? 2. Байтик ким эле жана ал кандай жашачу? 3. Байтик мергенди кандай кабыл алды? 4. Ал кандай өкүм чыгарды? 5. Желдеттер Акайды эмне кылышты? 6. Балыгооз ырчы Байтикти эмне деп шылдындады?"},{"t":"p","h":"1. Текстти толук окуп чыгып, көркөм айтып берүүгө камдангыла."},{"t":"p","h":"2. Интерьер деген эмне экендигин адабият терминдер сөздүгүнөн тапкыла жана чыгармадагы Байтиктин үйүнүн интерьерин өз сөзүңөр менен сүрөттөгүлө."},{"t":"p","h":"3. Мергендин кийими, курал-жарактары кандай болгон? «Кожожаш» эпосундагы Кожожаш менен Акайды салыштыргыла: кисе, окчонтой, кара бараң, коргошун ок, кыт, дүрмөт, мылтыктын сүмбөсү ... деген сөздөрдүн маанисин түшүндүргүлө."},{"t":"p","h":"4. Төмөнкү сөздөр кайсы көркөм сөз каражаттары экендигин тапкыла жана аларды катыштырып сүйлөм түзгүлө: казылары салаңдаган, он эки айры мүйүздүү, күмүш алабакан сыяктуу, он эки канат, куу шыйрак, мергенди бөлөштү, суудан чыккан балыктай, коен жылындагы чоң жут, кайра жаачуу булуттай."},{"t":"p","h":"5. Төмөнкү сүйлөмдөрдүн маанисин түшүнүп, кандай сүйлөмдөр экендигин аныктагыла, өз диалогунарда түрдүү кырдаалдарга карата пайдалангыла."},{"t":"v","l":["<span class=\"pg\" data-n=\"99\">99<\/span>1. Майың менен мамыран кал!","2. Алдаяр таксыр, буйругуңуз ордунда!","3. Өкүм өзүңүз тараптан болсун, баатыр."]},{"t":"p","h":"4. Таксыр, жапайы кийиктерге бетеге жулуп берип бактыңыз беле?"},{"t":"p","h":"6. Өкүм, жаза, айып деген сөздөрдүн маанилерин аныктоого аракеттенгиле."},{"t":"p","h":"7. Тексттин мазмунуна, идеясына ылайык келген макал-лакап, накыл сөздөрдөн билесиңерби? Маселен төмөнкүдөй, буларды которуп маанисин түшүндүргүлө."},{"t":"p","h":"«Жоктун жону катуу, өгүздүн мойну катуу». «Байды балакет баса, жортуул баштайт». «Бай – барман менен, жок- арман менен». «Токмогу күчтүү болсо, кийиз казык жерге кирет»."},{"t":"h3","h":"ТҮШҮНДҮРМӨ СӨЗДҮК"},{"t":"p","h":"мылтыктын сүмбөсү – шомпол ружья."},{"t":"p","h":"кисе – этн. мешочек из кожи на поясе, который служил для ношения огнива, кремния, пули и т.п."},{"t":"p","h":"окчонтой – колчан для пуль. кара бараң (кара мылтык)- пистонное ружье. В отличие от кремневого и фитильного: встречается с различными определениями: ак бараң, көк бараң, сыр бараң."},{"t":"p","h":"корумдар – груды больших камней, отваливщихся от скал. чүкөлөрүнө кыт куюшчу – свинцом заливают алчик – биток, чтобы он был тяжелее."},{"t":"p","h":"жаздым атсам, мага шерт, жаңылыш тийсең сага шерт – заклинание охотника, разговор со своим ружьем, условится, если промахнусь – моя вина, если ты не попадешь твоя вина."},{"t":"p","h":"соно – общее название дикой водоплавающий птицы и куликов. он эки айры бугу – олень с огромным разветвленным рогом. кара кашка ыпча кемсел – камзол с короткими рукавами, сделанная из черной ткани."},{"t":"p","h":"башайы, шайы – сорт шелкового материала кустарного производства."},{"t":"p","h":"он эки канат үй – огромная юрта с кереге в двенадцать полотнищ. босого – деревянная рама у юрт."},{"t":"p","h":"алабакан – этн. Сучковатый шест, который служил вещалкой внутри юрты."},{"t":"p","h":"талпак – выделанная шкура зверя, служащая для подстилки куу шыйрак – бесплодная женщина, чычырканак – облепиха, колючки."},{"t":"p","h":"уу тикенекке бөлөп сабоо (сабатуу) – ист. Один из видов мучительного наказания."},{"t":"v","l":["жут – массовый падеж скота, из за недостатка корма.","бетеге – перистый ковыль, овсяница, типчак."]},{"t":"p","h":"ант (шерт) – этн. Присяга в потверждение верности своих показаний, клятва."}],"sub":[{"title":"ТҮШҮНДҮРМӨ СӨЗДҮК","b":112}],"pages":[92,99]},{"title":"МУКАЙ ЭЛЕБАЕВ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"100\">100<\/span>МУКАЙ ЭЛЕБАЕВ"},{"t":"p","h":"(1906-1944)"},{"t":"img","src":"data:image/webp;base64,UklGRs4ZAABXRUJQVlA4IMIZAABQAgGdASqbAdUBPrVUnUqnLTMprjVKSmAWiWluQoxG4pjRR8ggriU8t+wnPKdyPtVtObStR6/3vLwPl9FL+l5zpvhncX/1vGH4Vf0qHf2ten+8vYL/89pnUIZ7XKGNJU7SkGP563Xbrup85UYrepB8jmIdEvW3UARUz8Jj747f+cbwUxbaM/JPFxt9k1Is+dRxclx4cHRypraz6ZxLNIzL7+NWrggOlci9Q37A2QdJnofgMb7ojDZV65KfQA7SQtXOuDC+qAcfAlZQHtI+IQIiVfhAiI4JBUeUAXWRYbQPfAc4+s2EBzOAUeV5VmU/rNnVmxmhkg5o3b5MPRPDSqo4CXSFsE+ZX26pZwoQ5KvDDSBaST/MudMwuKMe+YP4AsOhKJHH7aGHqP5QdgvcUutVXPCX9fuT8vwXgXftDrWc7c4muCvLni+jpOuTF+tkal7lTOS2b1Y+QvGc6LqlMy9SQdwAoJF0PuYKKaVXGlfCt+7ganST/5Ib6Y9NVBgHCPUoCBRyRQestGIgBXrIp6GWoNOYeYnAfBfI9GmheJIUpUs4S9z4r0S38lGm1NX9M3JEJKG6Fh6QlJdtHR7PYhosN0XvLA9H/cE0w0zlRZAasZ2vAFL7JT5F9rRl

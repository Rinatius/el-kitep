 готовится"]},{"t":"p","h":"⁴ Аттап-тондоп узатты – проводила, снарядив всем необходимым."},{"t":"p","h":"⁵ Чалкуйрукка тил бүтүп – вдруг заговорил Чалкуйрук человеческим голосом."},{"t":"p","h":"<span class=\"pg\" data-n=\"12\">12<\/span>«Эрдигиң бар, эсиң жок, Төштүк, Эчтеме менен ишиң жок. Атаң өгөөнү таштап кеткен коломтонун жанында денеде жети башы бар желмогуз сени күтүп жатат. Барып амандашкан соң, аттан түшпөй, өгөөнү алып бер де. Анда кемпир: «Турсам олтура албайм, олтурсам тура албайм, өзүң ал» – дейт. Анда сен «Ээ, кокуй энеке, Акмончок менен Көкмончок эмне жүрөт» – де."},{"t":"v","l":["Сен айтканда ушуну","Анда кемпир мындай дейт:","«Апей тагай-катыгүн","Эси жок¹ туулган эки кыз","Эл кыдырып келдиби?","Мен кеткенде ээленип","Эр издеген экен деп","Экөө катар кошулуп,","Тең издеген экен – деп","Деп ошондой дегенде,","Адамдан артык","билгич бол, Төштүк!","Кыргыйдан кыраан","илгич бол, Төштүк!","Мойнума камчы баса көр,","Өгөөнү алып кача көр,","Төштүк!","Аландап такыр,","шашпагын, Төштүк!","Абайлап оозум тарта көр,²","Төштүк!","Менин капталдан чыгат","канатым,","Күн чыгыш менен күн","батыш —","Аркырап учмай адатым,","Төштүк!","Абайлап оозум жыя көр,","Төштүк!","мындай дейт – говорит так","апей тагай-катыгүн – эмоц.","выр. ой матушки!"]},{"t":"p","h":"ээленип – пользуясь моим отсутствием, самовольничая эр издеген – занялись поиском мужа"},{"t":"v","l":["тең – здесь вместе","","билгич бол – будь знатоком,","проницательным","","алып кач – бери да убеги","","шашпагын – не торопись","оозум, мында ооздугумду","мои удила /","","адатым – привычка","","абайлап (акырындап) – здесь","осторожно","","¹ Эси жок туулган – здесь: глупые, не далекие"]},{"t":"p","h":"² Абайлап оозум тарта көр – здесь: не натягивай удила, дай свободу"},{"t":"v","l":["<span class=\"pg\" data-n=\"13\">13<\/span>Айтканымды кыла көр,","Төштүк!","Кире көр айткан сөзүмө,","Төштүк!","Айткан тилге кирбесең,","Акылымды билбесең.","Өз убалың өзүңө¹ Төштүк!","Амалы артык, заары күч,","Сени андыган кемпирдин","Колуна тийсең, кылат түз,","Төштүк!» —","кире көр айткан сөзүмө —"]},{"t":"p","h":"убедись, слушай моё слово деп адамдан эстүү жаныбар Чалкуйрук ээсине акыл айтты. Алар желмогуз кемпир күтүп отурган жерге да кирип келишти."}],"sub":[],"pages":[11,13]},{"title":"ТӨШТҮК МЕНЕН ЖЕЛМОГУЗ КЕМПИР","blocks":[{"t":"h3","h":"ТӨШТҮК МЕНЕН ЖЕЛМОГУЗ КЕМПИР"},{"t":"v","l":["Элемандын Төштүгү","Ал кемпирди караса:","Куудай аппак чачы² бар","Ал кемпирдин өзүндө","Санаса жети башы бар.","Жаны жок соку аты бар","Сыягы башка, заары күч","Ал капырдан күдөр үз.","Чекеси кетип бырышкан","Көрүнгөн менен урушкан","Беттеп пенде келбеген","Төштүк, Төштүк болгону,","Төштүк атка конгону","Балакет мындай көрбөгөн.","Көк кементай³ жонунда","Ийреги бар колунда.","санаса – здесь посчитал","жаны жок – нет души"]},{"t":"p","h":"капырдан – обр. выр. от этого нечестивца"},{"t":"v","l":["көрүнгөн менен урушкан —","задира, ссорившийся со","всеми встречными"]},{"t":"p","h":"балакет мындай – здесь невиданный, необычный"},{"t":"p","h":"Кемпирдин түрүн көргөндө Элемандын Эр Төштүктүн көңүлү кетип бөлүнөт, кемпир жан алгычтай көрүнөт⁴. Ошентсе да жакындап барып, Чалкуйрук айткан акылы менен кемпирди алдап, өгөөнү жула качат."},{"t":"p","h":"¹ Өз убалың өзүңө – мында: сам будешь виновен, сам пострадаешь."},{"t":"v","l":["² Куудай аппак чачы бар – обр.срав. вся седая.","³ Кементай – верхняя одежда из войлока"]},{"t":"p","h":"⁴ Жан алгычтай көрүнүп – показался, как ангел смерти"},{"t":"v","l":["<span class=\"pg\" data-n=\"14\">14<\/span>Колуна өгөө тийген соң,","Кубаларын билген соң","Элемандын Эр Төштүк","Тулпарына камчы уруп,","Мына ошондо Чалкуйрук,","Бугудай мойнун¹ бурады,","Бурулбай аттап чурады.","Басып өткөн таштары,","Кат-катынан быркырап,","Жолум үйдөй даңканы","Кемпирди көздөй зыркырап,","Жети баштуу ал кемпир","Сокусун минип соксоктоп,","Сокбилек менен сокусун","Камчылана токмоктоп:","«Ор ийрегим, оргун» деп²","«Оруучу болсоң, ийрегим,","Элемандын Төштүгүн","Аты менен соргун» – деп","«Ал ийрегим, алгын» – деп","«Элемандын Төштүгүн","Эки бөлүп салгын» – деп,","Жети баштуу жезкемпир","Сыйкырчы экен, зерчи экен,","Жердин үстүн, жер алдын","Жетик байкап көрчү экен.","Эпсиз долу³ ал кемпир,","Элемандын Төштүктү","Эрикпей кууп алганы.","Жер тешиги чуңкурга","Бута бою калганы.","Мына ошондо бул кемпир","Амалы катуу артты эми,","Жер танабын⁴ тартты эми.","Колундагы ийректи","Оңдоп колго алды эми","билген соң – поняв, почуяв","","камчы уруп – подстегнув коня","кнутом","","кат-катынан быркырап – здесь","разлетелись в разные","стороны","зыркырап – здесь взлетели (в","сторону старухи)"]},{"t":"p","h":"сокусун минип соксоктоп – уселась в свою ступу и понеслась вприпрыжку токмоктоп – ударяя, подстегивая (кнутом)"},{"t":"p","h":"соргун – здесь проглоти, уничтож"},{"t":"v","l":["","эки бөлүп салгын – разорви на","две части","сыйкырчы (зерчи) – колдун","",""]},{"t":"p","h":"жер тешиги – букв. отверстие земли в знач. вход в подземное царство"},{"t":"v","l":["амалы артты – удвоились ее","коварство, хитрость"]},{"t":"p","h":"¹ Бугудай мойнун (моюнун) – обр. срав. как оленья шея ² Ор ийрегим, оргун – жни, моя ийрек, жни (так кричит желмогуз, нападая на Төштүк)"},{"t":"v","l":["³ Долу (албуут) – сварливая, истеричная","⁴ Жер танабы (жер ортосу) – здесь центр земли","<span class=\"pg\" data-n=\"15\">15<\/span>«Бөлүнгүрдүн кара жер,","Бөлүнө берип өткүн!» – деп,","«Жарылгырдын, кара жер,","Жарылып жатып","калгын! – деп,","Бул амалды кылды эле,","Колундагы ийректи","Эр Төштүктүн башынан","Алыс мээлеп урду эле,","Жарыла берип дем өттү","Оңурайып жел өттү,","Оодарылып жер кетти."]},{"t":"p","h":"бөлүнгүрдүн кара жер – чтобы земля раздвинулась жарылып жатып калгын – чтобы ты треснулась алыс мээлеп – прицелилась дальше жарылды – треснул оңурайды (тешилди) – провалилась, образовалось отверстие, дыра оодарылып жер кетти – земля затряслась, как будто все перевернулось"},{"t":"h3","h":"СӨЗДҮК"},{"t":"v","l":["тогуз уулдуу болушат – родили девять сыновей","тентип жоголушат – пропадают без вести.","Тогуз бир тууганы тентип жоголушат."]},{"t":"p","h":"үйлөп-жайлайт – обустраивает, женит, обеспечивает всем необходимым."},{"t":"p","h":"Төштүк туугандарын ... – ... . Баланы үйлөп-жайлоо – ата-эненин милдети."},{"t":"p","h":"ай чырайлуу (сын атооч: жүзү жарык, ажарлуу, татынакай, сулуу)- очень красивая, луне-подобная, луноликая,"},{"t":"p","h":"Кенжеке ай чырайлуу кыз болгон. Анжелика жүзү жарык, ажарлуу, татынакай окуучу."},{"t":"p","h":"аккан суу менен кошо өпкө болуп агып – унеслась по течению реки превратившись в легкие."},{"t":"p","h":"убада берет – обещает, дает обещание."},{"t":"p","h":"Элеман Төштүктү берүүгө Настя салтанаттуу убада берди. Сыргак качпоого убада берген."},{"t":"p","h":"эрдигиң бар, эсиң жок – здесь: есть у тебя сила, да ума мало. денеде жети башы бар желмогуз – семиголовое чудовище турсам олтура албайм, отурсам тура албайм – ни сесть, ни встать не могу кыргыйдан кыраан илгич бол – обр.срав. будь ловким, стремительным как ястреб, Төштүк ... баатыр экен. Илгичке күрмөмдү илдим. амалы артык, заары күч – хитрый, жестокий и коварный. сыягы (түрү, көрүнүшү) башка – вид у нее особый."},{"t":"p","h":"Желмогуздун ... адамдыкынан башка. Андрейдин көрүнүшү башка."},{"t":"p","h":"чекеси кетип бырышкан – лоб (у нее) морщинистый."},{"t":"p","h":"Анын чекеси аябай бырышкан, Кулан бети-башын бырыштырды. Сапар мектепке бырышкан көйнөк кийип келиптир."},{"t":"p","h":"<span class=\"pg\" data-n=\"16\">16<\/span>жула качат – на скаку вырывает, Өгөөнү жула качат. Берен китепти жула качты. Ат чылбырын жула качты."},{"t":"p","h":"аттап чурады (арыштап чуркады) – поскакал быстро, (делать крупные шаги). Чалкуйрук арыштап чуркайт."},{"t":"p","h":"бута бою – расстояние полета стрелы."},{"t":"p","h":"Жер тешигине бута бою калганда кемпир минтти. Адилет жарышта Ринаттан бута бою озуп келди."},{"t":"p","h":"алыс (ашыра) мээлеп – прицеливаясь чуть глубже"},{"t":"p","h":"1. Төштүк деген ким экен? Анын балалык жана жаштык кезинен кабар бергиле? Туугандарын эмне кылды? 2. Кенжекеге үйлөнүү кандай өттү жана кыздын атасы эмнелерди берди? 3. Элеман Төштүктү өгөөгө эмне үчүн жиберди? Чалкуйрук ага кандай акыл айтты? 4. Желмогуз кемпир ким эле жана Төштүк экөөнүн ортосунда кандай кармаш жүрдү? 5. Кемпир сокбилеги, ийреги менен эмне кылды? 6. Төштүк кайда түшүп кетти?"},{"t":"p","h":"1. Өз сөзүңөр, элестетүүңөр менен Төштүктүн портретин түзгүлө. Анда Төштүктүн баатырдыгын, сырткы көрүнүшүн, кулк-мүнөзүн чагылдыргыла. Төштүктүн сүрөтүн тарткыла. 2. Төмөнкү этнографиялык түшүнүктөрдү чечмелегиле. Аларды турмушуңарда жолуктурган болсоңор, кандай өтөрүнөн кабар бергиле: бешик той, үйлөнүү той, көчүү, айт..."},{"t":"h3","h":"ТҮШҮНДҮРМӨ СӨЗДҮК"},{"t":"p","h":"сака – бита, биток при игре в альчики. Чалкуйруктун жаны сакада жана ал ар түрдүү өнөргө ээ. Адамча сүйлөй алат, өкчөсө сакага айланат."},{"t":"p","h":"өгөө – напильник. Байыркы учурда эл кишинин жаны өзүндө эмес, башка бир нерседе болот деп ишенишкен. Чыгармада Төштүктүн жаны өгөөдө деген ой берилет."},{"t":"p","h":"чайинги тон – верхная боевая одежда. (в частности богатыря Төштүка). өкчөө (өкчө) – бросить (брось свой биток) при игре в альчики стараясь поставить его на алчы)."},{"t":"p","h":"күлазык – провизия. Узакка сапар жүргөндө алып жүрүүчү бузулбай турган тамак-аш. Анда талканын камдап, семиз жылкы сойдуруп, этин майда тууратып, аны аябай кургатып, татымалдарын кошуп күлазык камдашкан."},{"t":"p","h":"булдурсун (камчы) – нагайка, плеть, камча богатыря. Унааны камчылануу үчүн колдонулуучу буюм."},{"t":"p","h":"капталдан чыгат канатым – из бока выступятся крылья. Байыркы учурда адамдар жаныбарлардын капталында канаты болот деп эсептешкен. Чыгармада Чалкуйруктун канаты бар."},{"t":"p","h":"<span class=\"pg\" data-n=\"17\">17<\/span>соку – ступа деревянная. Данды туктоодо, актоодо, күйшөөдө колдонулган буюм."},{"t":"p","h":"сокбилек – деревянный пест для ступы. Соку менен сокбилек арча, тал, кайың сыяктуу катуу жыгачтардан жасалат. Чыгармада желмогуз кемпирдин аты жана камчысы катары сүрөттөлөт. ийрек (терини өңдөөгө ылайыкталып жасалган орокко окшош, мизи мокок курал) – Приспособление для очистки кожи, железная или деревянная тупая пластинка."},{"t":"p","h":"тулпар – 1 (миф) крылатый конь. 2. Боевой конь, выдающийся скакун. даңкан – комок земли или снега из под копыта коня."}],"sub":[{"title":"ТҮШҮНДҮРМӨ СӨЗДҮК","b":38}],"pages":[14,17]},{"title":"ТӨШТҮКТҮН ЖЕР АЛДЫНДА ТӨРТ МААМЫТКА ЖОЛУГУШУ","blocks":[{"t":"h3","h":"ТӨШТҮКТҮН ЖЕР АЛДЫНДА ТӨРТ МААМЫТКА ЖОЛУГУШУ"},{"t":"h3","h":"Төштүк жана жейрен секиртпес Маамыт"},{"t":"v","l":["...Адам барбас эң жаман","Жерге түштү Эр Төштүк.","Көз айныган мунарык,","Чөлгө түштү Эр Төштүк.","Чөлгө барып түшкөндө,","Көңүлү кетип бөлүнөт.","Маңдайында боз дөбө","Эр Төштүккө көрүнөт.","Такыядай¹ дөбөгө","Салып Төштүк барды эле,","Чалкуйрук оозун бурду эле","Төгөрөктүн төрт бурчун,","Төрт айланта кыдырып","Төштүк карап турду эле.","Тикилдеген сөзү² бар","Тик караган көзү бар.","Кылымда болбойт","мындай жан,","Кылымга тиет бүлүгү.","Көккө, жерге бир тийген","Кызыталактын күлүгү.","Арыш уруп чуркаса,","Адам кууп жеткисиз","","¹ Такыядай – подобно тюбетейке.","мунарык – мгла"]},{"t":"p","h":"чөлгө түштү – попал в пустыню боз дөбө – серый холм төгөрөктүн төрт бурчун – здесь весь белый свет тик караган көзү – пронзительный, уверенный, смелый взгляд көккө, жерге бир тийген – быстро мчится, летит не касаясь земли"},{"t":"p","h":"² Тикилдеген сөзү бар – (у него) уверенная, быстрая речь."},{"t":"v","l":["<span class=\"pg\" data-n=\"18\">18<\/span>Күлүктүгү билинген,","Тегирмендин бир ташы¹","Мойнуна илинген.","Анталаңдап бул өзү,","Өөдө-төмөн жүгүргөн.","Элемандын Эр Төштүк","Чалкуйрук оозун бурду эле","Анын жайын сурап","турду эле","Анда күлүк муну айтат.","Адам билип, журт туйгус","Аябаган шумду² айтат:","«Кабарчыдан кеп угуп,","Жер үстүнөн Төштүктү,","Жети баштуу жезкемпир","Зыйкыр окуп, көз байлап,","Алып келди деп угуп","Шашкандыгым дагы чын.","Алапайым таба албай","Качкандыгым дагы чын.","Билсең мындай баркым бар,","Жүгүргөн, учкан жандарды","Куткарбай турган наркым","бар","Желгениме жел жетпейт,","Басканыма мал жетпейт.","Эр кадырын билемин,","Элемандын Төштүгү","Сырттан келсе бул жерге","Жөө күлүк болуп берем деп","Ошону каалап жүрөмүн»","Ошенткенде ал экөө","Козголуша калышты.","Кол кармашып түбөлүк","Дос болуша калышты.","күлүк – здесь быстроходный,","бегун"]},{"t":"p","h":"мойнуна (моюнуна) илинген – висит на шее өөдө (өйдө)-төмөн – то вверх, то вниз (бегая), суетиться, волноваться жайын сурады – здесь спросил кто он"},{"t":"v","l":["","кабарчыдан – от вестника,","услышав весть","","зыйкыр окуп – околдовав","","шашкандыгым дагы чын —","правда, что торопился","","качкандыгым дагы чын —","правда, что бежал"]},{"t":"p","h":"баркым бар – здесь есть (такое) достоинство, честь"},{"t":"v","l":["","желгениме жел жетпейт —","скачу (мчусь) так что","даже ветерок не может","догнать"]},{"t":"p","h":"кадырын билемин – знаю цену достоинства, авторитета"},{"t":"v","l":["каалап жүрөмүн – желаю,","мечтаю"]},{"t":"p","h":"козголуша (кучакташа) калышты – обнялись"},{"t":"v","l":["дос болушту – подружились,","стали друзьями","¹ Тегирмендин ташы – жернова мельницы,","² Шумдук (мында; шумдуктуу ишти кабарды) айтат – он","такие диковины рассказывает.","<span class=\"pg\" data-n=\"19\">19<\/span>Жер тыңшаар Маамытка жолукканы","Андан ары бастырса,","Чоңдугу борчук сеңирдей.¹","Кармаша кеткен адамды","Тири койбой² жегидей","Жерди тыңшап желигип","Өөдө-төмөн тоңкондоп³","Качып жүрөт ээлигип.","Ашып-шашып жүгүрүп,","Көзү кеткен алактап⁴.","Буту кеткен салактап","Элемандын сырттаны,","Чалкуйрук оозун бурду эле,","Жайын сурап турду эле.","Анда тыңшаар муну айтат:","«Чоңдугу тоонун теңиндей","Кармашканды жегидей,","Төштүк келет деп угуп,","Каарланса ал Төштүк","Кашайта көздү оёт⁵ деп,","Тебелеп кетсе Чалкуйрук","Бөөдө өлтүрүп коет⁶ деп.","Айлам кетип антаңдап,","Шашкандыгым дагы чын,","Корголорго жер таппай","Качкандыгым дагы чын.","Жерди тыңшап карасам,","Элемандын Төштүгү","Келип калган көрүнөт.","Тилегимди бир кудай,","Берип калган көрүнөт.","Ошол Төштүк сен болсоң","Төштүккө кызмат кылуучу"]},{"t":"p","h":"жерди тыңшап – обр. выр. припадая ухом к земле качып жүрөт ээлигип – убегает, буйствует, беспокоится буту салактап – еле-еле переставляет ноги тоонун теңиндей – обр. выр. как половина горы, большой, гигантский каарланса – (если) разозлится антаңдап – растеряясь, суетиться тилегимди – мечту мою, мое желание, стремление"},{"t":"p","h":"¹ Борчук сеңирдей – подобно к небольшой острой скалы на гребне. ² Тири (тирүү) койбой – не оставил бы живым."},{"t":"p","h":"³ Тоңкондоп – двигаясь на карачках ⁴ Көзү алактап – пугливо расширив глаз, растерянно озираясь. ⁵ Кашайта көздү оёт – ослепить."},{"t":"p","h":"⁶ Бөөдө өлтүрүп коёт – (он) напрасно убьет, несправедливо умертвит."},{"t":"v","l":["<span class=\"pg\" data-n=\"20\">20<\/span>Жер тыңшаар Маамыт","мен болом.","Мураа болом¹ өзүңө","Күн чыгыш менен","күн батыш","Эмне кабар угулса,","Азыр айтып беремин.","Жоого кирсең болжошмун.","Мен өзүңө жолдошмун.","Өөдө чыксаң өбөкмүн,","Мен өзүңө жөлөкмүн.","Бир өзүңө керекмин»","Деп айтканда ал Маамыт","Элемандын Төштүгү,","Ак жылкыдан боз болуп,","Аныкташып дос болуп.","Үзүлгөнү уланып,","Жолдош таап кубанып","Чалкуйрук оозун бурду эле","Алыска карап турду эле!.."]},{"t":"p","h":"эмне кабар угулса – какие вести получу, что узнаю жоого кирсең – (если) вступишь в сражение с врагом өөдө чыксаң өбөкмүн – буду опорой, окажу поддержку, буду соратником ак жылкыдан боз болуп – обр. выр. стать близким үзүлгөнү уланып, чачылганы жыйналып – все наладилось, обрел утерянное"},{"t":"h3","h":"Куюн Маамытка жолугуп жолдош кылганы"},{"t":"v","l":["Атка минсе кишидей,","Жөө жүрсө оңбогур","Желмогуздун тишиндей².","Карыш болгон бою бар,","Ай-ааламдын баарысын,","Биле турган ою бар.","Адамдан жеңил, эң эптүү","Сүйлөп турса бал кептүү,","Жана келди бир адам:","«Атка жеңил, тайга чак","Куюн Маамыт өзүмүн.","Акылым көп, алым аз,","Көкдөө менен Кара хан","Жер алдынын падышасы,","Жерге киргир бизге кас.","Кейиш менен көп жүрдүк,"]},{"t":"p","h":"карыш болгон бою бар – обр. срав. маленький, небольшой ростом жеңил, эң эптүү – лёгкий и ловкий, проворный бал кептүү – сладкоречивый атка жеңил, тайга чак – ловкий, быстрый акылым көп, алым аз – много мыслей, задумок, но нет сил бизге кас – враждебно настроенный против нас, наш враг"},{"t":"p","h":"¹ Мураа болом – мында: буду преданным, верным другом. ² Желмогуздун тишиндей – обр.выр. как будто зуб баба-яги."},{"t":"v","l":["<span class=\"pg\" data-n=\"21\">21<\/span>«Элемандын сырттаны","Келер бекен? – деп жүрдүк».","Төштүк келип кашыма,","Абийирим минтип жабылды.","Мындан ары Көкдөө бар,","Келгендерден кеп угам,","Көкдөөнүн кызы Күлайым","Элемандын Төштүккө","Ашык экен¹ деп угам.","Күлайымды аларбыз,","Азапка нечен каларбыз.","Ал Көкдөөнүн жолдошу,","Жети баштуу жезкемпир","Жезкемпирдин колунда,","Темир ийрек тору бар.","Түшкөн кайра чыккысыз","Көкдөөнүн казган ору бар.","Балбаны бар желмогуз","Башында жалгыз көзү бар².","Билсең Көкдөө каапырда³","Барган жандар кайтпаган","Кырк кулак казан дагы бар.","Бизге душман көп жандар","Бул кебимди угуп ал!»","Кучакташып дос болуп,","Куюн Маамыт турганы.","Анын айткан сөзүнө","Эр Төштүк көңүл бурганы."]},{"t":"p","h":"абийирим жабылды – здесь избежал позора, не утерял достоинство, чести азапка каларбыз – здесь испытаем много трудностей жолдошу (пикирдеши, акылдашы)- соратник, (единомышленник, советник) темир тор- металлическая сеть кырк кулак казан дагы бар (гипербола) – есть котел о сорока ушках"},{"t":"h3","h":"Көрөгөч Маамытка жолдош болгону"},{"t":"v","l":["Андай мындай дегиче","Ачып көздү жумганча⁴","Бет алдынан бир киши"]},{"t":"p","h":"Жана келди көрүнүп."},{"t":"v","l":["Көрөгөч Маамыт көзү экен,","Элемандын Төштүккө","Жолдош болор кези экен.","¹ Ашык (сүйөт) экен – любит (она)"]},{"t":"p","h":"бет алдынан (бет маңдайынан) – встретился, предстал перед очами"},{"t":"v","l":["","² Башында жалгыз көзү бар – одноглазый","³ Каапыр – неверный, нечестивый."]},{"t":"p","h":"⁴ Ачып көздү жумганча – не успел моргнуть глазом, внезапно."},{"t":"v","l":["<span class=\"pg\" data-n=\"22\">22<\/span>Күн чыгыш менен күн батыш,","Тиктеп көрүп жүрчү экен¹","Балбандыгы башкача,","Баатырдыгы бир канча.","Эр Төштүктүн келерин,","Ал көрөгөч көрүптүр,","«Элеман уулу Төштүккө","Өлгөнчө жолдош болом»- деп","Өмүрдөн сурап жүрүптүр².","Элемандын Төштүккө,","Жолдош да экен, шер да экен,","Баары жоктун баарысын³","Көрүп берер эр да экен.","«Өчкөн отту жандырдың,","Өлгөн жанды тиргиздиң».","Деп ошентип ал экөө","Козголуша калышты","Дос болуша салышты.","Элемандын Төштүгү","Жер алдына түшкөндө","Төрт Маамыт жолдош","табылды.","Сырттан Төштүк баатырдын","Абийири минтип жабылды."]},{"t":"p","h":"балбандыгы башкача – обладал исключительной, богатырской силой баатыр – храбрец, отважный воин шер да экен – (эпитет) – оказывается храбрец өчкөн отту жандырдың – (обр. выр.) погасший огонь (ты) зажёг өлгөн жанды тиргиздиң – умершую душу (ты) оживил жер алдына түшкөндө – когда попал в подземное царство"},{"t":"p","h":"Мындан ары баратып Төштүк бутуна чөңөр кирип баса албай калган жолборско кезигип, чөңөрүн алып салып достошот. «Башына кыйынчылык түшкөндө түтөтсөң, мен даяр болом» – деп жолборс ага бир мурутун⁴ жулуп берет. Андан ары барганда орго түшүп калган аюуну, өрттөнүп жаткан⁵ кумурсканы куткарып, алар менен достошот. Алар дагы бирөө мурутун, бирөө бутун жулуп беришет."},{"t":"p","h":"Көкдөөнүн кызы Күлайым Төштүк келет деп күтүп жүргөн экен. Ага жолугуп, анын акылы менен уй кайтарган таз болуп⁶, Көкдөөнүн хандыгында жашайт. Күлайымга үйлөнүп, кайнатасынын жети мөрөйүн аткарат. Көкдөөнүн жалгыз көздүү Желмогуз баатырын өлтүрүп, анын туткунунан Кайып кандын кызы Быйты күндү бошотот."},{"t":"p","h":"¹ Тиктеп көрүп жүрчү экен – здесь его глаз был особый, наделенный волшебным качеством, мог видеть все, что происходило на земле. ² Өмүрдөн сурап жүрүптүр – мечтал, просил судьбу"},{"t":"v","l":["³ Баары-жоктун баарысын – все что есть на свете.","⁴ Мурут – усы"]},{"t":"p","h":"⁵ Өрттөнүп жаткан – горевший, схватившийся пламенем ⁶ Уй кайтарган таз болот – обр.выр. становится, прикидывается плешивым пастухом коров."},{"t":"h3","h":"<span class=\"pg\" data-n=\"23\">23<\/span>СӨЗДҮК"},{"t":"v","l":["анталаңдап (аңтаңдап) – метаясь, растерянно, волнительно.","Маамыт анталаңдап жүгүрөт.","Марат антаңдап шашып алыптыр.","алапайым таба албай – растерялся (я), опешил, испугался.","Ооганстанда адамдар алапайын таппай турган чагы.","куткарбоо (кутултпоо) – не упустить,","Бүркүт карышкырды куткарбады.","Чоң атага кутултпас оору жабышты.","кармашканды жегидей мында – обр.выр. все побеждающий.","Төштүк ... Жегидей тамагыңар барбы?","корголорго жер таппай – не найдя укрытия, убежица,","Ителги карганы корголотот (макал).","кейиш менен (кейүү менен) – с огорчением."]},{"t":"p","h":"Кейиш менен көп жүрдүк. Кеткенге кейибе, өткөнгө өкүнбө. (накыл сөз)."},{"t":"v","l":["казган ору бар – специальная яма для пленения людей.","Күнөөлүүлөрдү ... салышты. Миша орокту алып чөптү ор.","туткунунан бошотот – освовождал от плена"]},{"t":"p","h":"1. Жер жарылганда Төштүк кайда барып түштү? 2. Жейрен секиртпес Маамыт деген ким экен жана анын кандай өнөрү бар экен? Ал Төштүккө эмнелерди билдирди? 3. Жер тыңшар Маамыттын кандай өнөрү бар экен? 4. Куюн Маамыт кантип жолукту жана эмнени айтты? 5. Көрөгөч Маамыт кандай жөндөмгө ээ экен? 6. Төштүк кайсы айбанаттарга жолугуп, кандай жардам берет? Ал дагы кимдерге жолукту жана кандай иштерди жасады?"},{"t":"p","h":"Ойлонгула жана салыштыргыла: Бул төрт Маамыттын өнөрлөрүн азыркы учурдун кандай көрүнүштөрү менен салыштырууга, окшоштурууга болот? Демек байыркы элдер келечек жөнүндө кыялданышкан бекен? Алардын элестетүүлөрү азыркы кезде ишке аштыбы?"},{"t":"p","h":"Ар бир Маамыттын сөздөрүн бөлүштүрүп алып жаттагыла жана көркөм айткыла. Аларды кара сөзгө айландырып текст түзгүлө. Түзүлүшү жана мааниси боюнча кандай сүйлөмдөрдү түзгөнүнөргө көнүл бөлгүлө."},{"t":"h3","h":"ТҮШҮНДҮРМӨ СӨЗДҮК"},{"t":"p","h":"жейрен секиртпес Маамыт – букв.— не дающий джейрану (очень быстрому животному) успеть вскочить, т.е. очень быстрый, ловкий, стремительный."},{"t":"p","h":"жер тыңшаар Маамыт – Маамыт отличающийся чрезмерно острым, <span class=\"pg\" data-n=\"24\">24<\/span>волшебным слухом, приложив ухо к земле может слышать все, что происходит за три девятью земель. көрөгөч Маамыт – Маамыт зоркий глаз, своим волшебным взором он может увидеть все, что происходит на белом свете. куюн Маамыт – Маамыт быстроходный (букв. Маамыт смерчь). такыя – девичья тюбетейка. Обычно украшается перьями филина или совы. көз байлап (көз байлоо) – заколдовать. Адамды билбей калгандай кылып дубалап, сыйкырлап салуу, жазгыруу."},{"t":"p","h":"чөңөр – большая заноза. Пенёк грубой травы, камыша."},{"t":"p","h":"кайната – тесть. Аялына күйөөсүнүн, күйөөсүнө аялынын атасы кайната болот."},{"t":"p","h":"мөрөй – мында; объявленный приз."},{"t":"h3","h":"ОКУУЧУНУН ДҮЙНӨ ТААНУУСУНА"},{"t":"p","h":"Биринчи жолу телефон 1876-жылы ойлоп чыгарылган. Ал эми 1769-жылы Ж.Кюньо (Франция) алгачкы буу кыймылдаткычтуу автомобилди, 1885-жылы Г.Даймлер жана К.Бенц (Германия) ичинен күймө кыймылдаткычтуу автомобилди жасап чыгарышкан."},{"t":"p","h":"XIX кылымдын ортосунан XX кылымдын отузунчу жылдарына чейин телекөрсөтүүнүн системалары иштелип чыккан. 1939-жылдан баштап баштагы СССРдин бардык аймактарында телекөрсөтүү иштери башталган."}],"sub":[{"title":"ТҮШҮНДҮРМӨ СӨЗДҮК","b":47},{"title":"ОКУУЧУНУН ДҮЙНӨ ТААНУУСУНА","b":53}],"pages":[18,24]},{"title":"ЧААР БЭЭНИН КУЛУНДАРЫН ИЗДӨӨ","blocks":[{"t":"h3","h":"ЧААР БЭЭНИН КУЛУНДАРЫН ИЗДӨӨ"},{"t":"p","h":"Бир күнү жер алдынын падышасы Көкдөө элин жыйып алып мындай жарлык¹ кылат. «Кечээ кайрат-күчүм барында, жети жыл тынбай жорткондо², кайыптан туулган жаныбар чаар байтал³ таап алгам. Ошол тулпарымдын жоголгонуна быйыл анык кырк жыл толот. Ал бар болсо туура кырк тулпар туумак⁴. Ошону күйөө балдарым таап беришсин»."},{"t":"p","h":"Төштүк муну угуп жай-жарагын шайланып,⁵ жанына төрт Маамытты алып, чаар байталды издеп чыгат. Маамыттар байталдын кай жерде экенин айтып беришет. Ал быйыл да Эркинтөр деген жерге барып тууганы жаткан экен."},{"t":"v","l":["¹ Жарлык – мында: указ, распоряжение.","² Жорткондо – когда я рыскал (в поисках добычи).","³ Чаар байтал – рябая кобылица.","⁴ Кырк тулпар туумак – родила бы сорок скакунов"]},{"t":"p","h":"⁵ Жай-жарагын шайланып – все доспехи подобрав, тщательно подготовившись."},{"t":"p","h":"<span class=\"pg\" data-n=\"25\">25<\/span>Ошол аймакты Алпкаракуш мекендейт экен. Чабыттап жердин үстүн жети күнү кыдырып¹, жердин алдын жети күнү сыдырып турчу экен. Чаар бээнин кырк кулунун ошол куш илип кетип турчу экен. Төштүк толготуп жаткан чаар бээни кайтарып, чырым этип уйку албай² таң атырат."},{"t":"p","h":"Жерге жарык тийгенде бээ тууйт. Ошол кезде Алпкаракуш келип, кулунду илип алып жөнөйт."},{"t":"p","h":"Жаза-буза атып³ калган Эр Төштүк, атына ыргып минип⁴, оңду-солду камчылап⁵, оң-тетири теминип, куштун артынан кууп жөнөйт. Күндөп-түндөп жол жүрүп, ат аябай мол жүрүп, акыры Алпкаракуш жайлаган чынар бакка келип жетет. Күтүп жатат:"},{"t":"v","l":["Мунар башын караса,","Көңүлү кетип бөлүнөт.","Мүйүзү бар башында,⁶","Токсон кулач узуну,","Бир ажыдаар көрүнөт.","Жыты сасык, өңү чаар⁷","Өлчөсө болбойт мындай жан.","Алпкаракуш баласын","Билип калган кези экен.","Эми барып сорууга,","Жүрүп калган кези экен.","Ажыдаарды көргөндө,","Элемандын сырттаны","Дене бою тик туруп,","Арстандай көзү жайнады,","Кан ичмеси кармады⁸","Каалгадай кашка тиш,","Сырттан Төштүк ошондо,"]},{"t":"p","h":"эми барып сорууга – здесь вот-вот готова была проглотить дене бою тик туруп – здесь весь передернулся, напрягся (от отвращения) кашка тиш – передние зубы"},{"t":"p","h":"¹ Жети күнү кыдырып – семь дней бродил (в поисках добычи)."},{"t":"p","h":"² Чырым этип уйку албай – не смыкая глаз."},{"t":"p","h":"³ Жаза-бута атып – промахнулся, не попал точно в цель. ⁴ Атына ыргып минип – он вскочил на лошадь"},{"t":"v","l":["⁵ Камчылап – хлестая кнутом.","⁶ Мүйүзү бар башында – у него рога на голове"]},{"t":"p","h":"⁷ Жыты сасык, өңү чаар – ванючий и страшный, уродливый."},{"t":"p","h":"⁸ Кан ичмеси кармады – его обуяла жажда крови."},{"t":"v","l":["<span class=\"pg\" data-n=\"26\">26<\/span>Качырата чайнады.","Кара болот кылычты","Кармай калып сабынан","Сууруп алып кабынан,","Мүйүз баштуу ажыдаар","Эки бөлүп салды эми.","«Атым Төштүк мен болсом","Алпкаракуш баласын","Атайы¹ барып көрөйүн.","Баласына алп куштун","Ушу турган ажыдаар","Алты бөлүп² берейин».","Кайра байлап капшырып,","Алты бөлүп ошону","Тизеге³ байлап жапшырып,","Ал мунардын⁴ башына","Чыгып барып караса,","Алпкаракуш балдары,","Оозун ачып сабылып,","Адамча сүйлөйт, ой-тобо-ой","Эр Төштүккө жалынып:","«Кызыкты кызык мокоттун,","Төштүк","Кыркышкан жоону жоготтуң,","Төштүк.","Андыган жоону алдыңбы,","Төштүк?","Абийирин ачып салдыңбы,","Төштүк?","Жуткучту туура сойдунбу,","Төштүк?","Куу жанды аман койдуңбу,","Төштүк?","¹ Атайы (атайын) – специально"]},{"t":"p","h":"качырата чайнады – обр. выр. стиснул зубы болот кылыч – стальной меч сууруп алып кабынан – вытащил из ножен эки бөлүп салды – разрубил попалам (на две части)"},{"t":"p","h":"байлап капшырып – завязав крепко, туго."},{"t":"p","h":"сабылып – здесь умоляя ой-тобо-ой! – восклицание от удивления жалынып – тоже что «сабылып» – умоляясь сойдунбу – убил ли, уничтожил ли"},{"t":"p","h":"² Алты бөлүп – букв. разделив на шесть кусков, искромсав на куски"},{"t":"p","h":"³ Тизеге – на колено ⁴ Мунардын башына – на вершину высокого тополья (чынар бак)."},{"t":"p","h":"<span class=\"pg\" data-n=\"27\">27<\/span>Энекем боздоп кеп айткан:"},{"t":"p","h":"«Балдардын аман калары, Төштүктөн болот» – деп айткан. Ошо Төштүк сенсиң го?»"},{"t":"v","l":["Анда Төштүк мындай дейт:","«Ошо Төштүк өзүмүн,","Караган кара көзүмүн».","«Өлгөн жанды тиргиздиң,","Төштүк.","Өчкөн отту тамыздың,","Төштүк.","Жер алдынан жетилсек,","Жеткилең күчкө саларбыз,","Жер үстүнө биз чыгарып","саларбыз,","Ажал жетсе өлөрбүз.","Башыңа чындап күч келсе,","Караан болуп берербиз».","Балдар минтип турганда","Айтарлык кызык баштады,","Ажыдаардын өлүгүн¹","Балдарга эми таштады.","Көчүк этин талашып,","Эки бала тойду эле,","Башын² балдар жебестен,","Энесине койду эле.","Төштүккө балдар муну айтат,","Адам билбес шумду айтат:","«Энемдин жайын сурасаң,","Кырк жылы бала көрүптүр","Ушу капыр ажыдаар","Кырк жылы удаа жутуптур³","Кара көздөн кан агып⁴"]},{"t":"p","h":"боздоп – здесь проливая горькие слезы, огорчаясь Төштүктөн болот деп айткан – здесь сказала, что Төштүк спасет, зависит от Төштүка жеткилең күчкө саларбыз – здесь наберемся сил одолеем ажал жетсе өлөрбүз – если смертный час пробег, то умрем караан болуп берербиз – здесь будем опорой, поддержим таштады – здесь отдал, скормил тойду эле (тоюшту) – насытились, наелись энесине коюшту – оставили для матери шумду (шумдукту) айтат – рассказывают невероятное кырк жылы бала көрүптүр – здесь сорок лет подряд выводила своих птенчиков"},{"t":"v","l":["¹ Ажыдаардын өлүгүн – труп дракона","² Башын – голову (её)","³ Удаа жутуптур – подряд проглотил","⁴ Кара көздөн кан агып – плакала кровавыми слезами","<span class=\"pg\" data-n=\"28\">28<\/span>Капа болуп энем калыптыр.","Баласын быйыл сордурса,","Ташка тийип өлүүгө","Оо дүйнө жүзүн көрүүгө,","Убада кылып салыптыр».","Балдары мындай дегенче","Күн күркүрөп, мөндүр жаап¹","Жер титиреп кеткени.","Жыгачтын баары былкылдап,","Тоо-таштын баары солкулдап²,","Мунун алп экени билинди.","Бир тырмактын өзүндө","Кырктан бугу илинүү.","Мунарга келип конду эле.","Чыбыкча болбой ал мунар,","Бүктөлүп келип ийилди³.","Алпкаракуш конгон мунардын","Башы жерге үч тийди","Көтөрүлүп үч чыкты.","Силкингенде⁴ жүнүнөн","Ар кандай шуулдап үн чыкты.","Алпкаракуш ошондо","Балдарына муну айтат:","«Ээ, кагылайын балдарым,","Өңүм бекен, түшүмбү?","Кантип аман калдыңар?","Жакшылык барбы, өрт барбы,","балдар?","Ак ниет барбы, өч барбы балдар?","Канатым кетти кайрылып,"]},{"t":"p","h":"капа болуптур- опечалилась (она)"},{"t":"p","h":"оо дүйнө жүзүн көрүүгө – здесь уйти на тот свет, умереть жер титиреп кеткени – началось землетрясение былкылдап – здесь затряслись, зашатались бир тырмактын өзүндө – в одном только когте илинүү – зацеплены башы жерге уч тийди – согнулась и её верхушка три раза коснулась земли шуулдап үн чыкты – появился шумный звук кагылайын балдарым – ласк. милые, дорогие мои дети өңүм бекен, түшүмбү? – во сне (я вижу) это или наяву?"},{"t":"p","h":"балдар. Силерди аман көргөндө, Жүрөгүм кетти айрылып, балдар."},{"t":"p","h":"силерди аман көргөндө – когда увидел вас живыми и невредимыми жүрөгүм кетти айрылып – сердце вздрогнула (букв. разорвалось)"},{"t":"p","h":"¹ Мөндүр – град ² Тоо-таштын баары солкулдап – задрожали горы и камни ³ Ийилди – согнулся ⁴ Силкингенде – когда встряхнулся"},{"t":"v","l":["<span class=\"pg\" data-n=\"29\">29<\/span>Эрип кетип барамын, балдар.","Курсагың ачса бугу же, балдар.","Кардын ачса муну же, балдар».","курсагың (кардын) ачса —","если проголодались"]},{"t":"p","h":"Алпкаракуштун балдары Төштүктүн жакшылыгын баяндап беришет. Ошондо Алпкаракуш ыраазы болуп айтып турган жери:"},{"t":"v","l":["Алпкаракуш сабылды","Сырттан эрге жалынды:","«Өчкөн отум тамыздың,","Өлгөн жаным тиргиздиң.","Кубандырдың санаамды","Ажыдаарды кескилеп,","Алып калган экенсиң","Эки түгөй баламды.","Айткан сөзүң угамын,","Качан десең ошондо","Жер үстүнө¹ өзүңдү","Айланып алып чыгамын.","Башыңа мүшкүл иш келсе²","Чымындай жанга күч келсе,","Төштүк","Сен ушуну түтөтсөң","Мен алдыңа барамын, Төштүк».","Дос болушуп Төштүккө,","Алпкаракуш ошондо,","Канатынын бир талын³","Төштүккө жулуп берди дейт!..","Багып жүргөн кырк тулпар,","Түгөл айдап келди дейт","Алпкаракуш зор кушка","Кыяматтык дос болуп,","Андан алкыш бата алып","Ошентип, Төштүк аттанып","Чайингидей тон кийип,","","¹ Жер үстүнө – на поверхность земли"]},{"t":"p","h":"кубандырдың санаамды – порадовал мою душу"},{"t":"v","l":["","качан десең ошондо – когда","захочешь, в любое время","алып чыгамын – выведу","","чымындай жан – здесь","жизнь, душа"]},{"t":"p","h":"сен ушуну түтөтсөң – зажги это"},{"t":"v","l":["","жулуп берди – вырвал и","отдал","түгөл (толук) айдап келди","– пригнал всех"]},{"t":"p","h":"кыяматтык дос – здесь стали вечными друзьями"},{"t":"p","h":"² Мүшкүл иш келсе – если окажешься в трудном положении, если понадобиться помощь."},{"t":"p","h":"³ Бир талын – одно перо"},{"t":"v","l":["<span class=\"pg\" data-n=\"30\">30<\/span>Чалкуйруктай ат минип","Кырк бир чаар ат айдап,","Үйүнө жөнөп калды эми!.."]},{"t":"p","h":"Төштүк чаар тулпарларды таап келген соң, анын көзүн тазалоонун¹ жана кызы Күлайымды бербестин амалын кылып Көкдөө жети мөрөй белгилейт² Алар: 1. Темир доңгочтү кийиз балта менен жара чабуу: 2. Ат чабыш 3. Жөө күлүктөрдү жарыштыруу 4. Жерге таруу чачып Төштүккө тердирүү. 5. Жолборс күрөштүрүү. 6. Аюу күрөштүрүү. 7. Барса келбестеги кырк кулактуу казанды алдыруу."},{"t":"p","h":"Төштүк булардын баарын достору төрт Маамыт, Конокбай балбан, аюу, жолборс, кумурскалардын жардамы менен жеңип чыгат."},{"t":"p","h":"Жер үстүнө Алпкаракуш алып чыккан соң, Чоюнкулак алп менен согушуп, аны жеңип, үйүнө аман-эсен кайтат³. Кеткен Төштүк келген соң⁴, журтун көзү көргөн соң, анын келишине улуу той беришти. Кебезтоонун боюнда, кең талаанын оюнда, азуусу тутам ат союп⁵, айры өркөчтүү төө⁶ союп, атасы Элеман жетине албай чоң той берди дейт. Жети там толгон казынаны⁷ ачып, жеткен элдин баарына, зарып⁸ кылып чачып, жыргап-куунап жатып калышты дейт."},{"t":"h3","h":"СӨЗДҮК"},{"t":"p","h":"жер алдынын падышасы – владыка подземного царства кай жерде (каякта) экенин – где находится"},{"t":"p","h":"Кай жерде экенин айтышат. Русландын атасы каякта? чабыттап (чабыттоо)- путешествовать, бродить, делать разведовательные обходы."},{"t":"v","l":["Алпкаракуш ... учту. Алешанын кыялы алыска...","толготуу – начались роды, родовые схватки","жерге жарык тийгенде – когда рассвело"]},{"t":"p","h":"кыркышкан жоону жоготтуң – здесь уничтожил самого грозного, непримиримового врага ак ниет барбы, өч барбы? – друг с добрым намерением или злобный враг."},{"t":"v","l":["¹ Көзүн тазалоо – здесь избавиться, уничтожить","² Мөрөй белгилейт – здесь придумал, наметил задания"]},{"t":"p","h":"³ Аман-эсен кайтат – возвращается здоровым и невредимым ⁴ Келген соң – когда возвратился"},{"t":"v","l":["⁵ Азуусу тутам ат союп – зарезав жирного коня","⁶ Айры өркөчтүү төө – двугорбый верблюд","⁷ Казына – сокровищница","⁸ Зарып (зарп, же сарп) кылуу – расходовать"]},{"t":"p","h":"<span class=\"pg\" data-n=\"31\">31<\/span>канатынын бир талын – перья из крыльев жулуп берет. ..... алдына калкалады."},{"t":"p","h":"бербестин амалын кылып – ищет повод для отказа, не желает отдавать Көкдөө бербестин ... кылды. Канатбек ... аракет кылды."},{"t":"p","h":"1. Көкдөө күйөө балдарына кандай буйрук берди? 2. Эр Төштүк кимдерди алып жолго чыкты? 3. Чаар бээнин кулунун кайсы куш алып кетип жүргөн? 4. Алпкаракуштун балдарын кайсы жандык соруп алуучу эле? 5. Төштүк аны өлтүрүп чынардын башына чыкканда балапандар эмне дешти? 6. Алпкаракуш кантип келди жана Төштүккө эмне деди? Кийин Төштүктү жер үстүнө ким чыгарат? 7. Төштүк дагы кандай окуяларды башынан өткөрдү?"},{"t":"p","h":"1. Буга чейин бул эпоско окшош чыгармаларды окудуңар беле? Эгер окуган болсонор бири-бири менен салыштыргыла. Алардагы айырмачылыктарды жана окшоштуктарды таап, айтып бергиле. Каармандарды салыштыргыла, өткөн окуялар кайсы мезгилге таандык экендигин аныктагыла."},{"t":"p","h":"2. Тууган-туушкандыкты жана жек-жааттыкты билдирген сөздөрдү ажыраткыла: ата, бала, кыз, келин, кайната, күйөө бала, таяке, жээн, кайнага, кайнене..."},{"t":"p","h":"3. Төмөнкү сөз айкалыштарынын маанисин түшүндүргүлө. Алардын кайсылары фразеологизм, кайсылары кош жана кошмок сөздөр экендигин тапкыла. Кандай көркөм сөз каражаттары катары колдонулгандыгын аныктагыла,"},{"t":"p","h":"Сан жылкылуу Сарыбай, жан эти менен тең, аттап-тондоп, жоо-жарак, кол башындай ак баштык, ниети жаман, пейли тар, жер тыңшар Маамыт, ак жылкыдан боз болуп, кырк кулак казан, өжөк-өжөк кан, алактап качып, акылы шашып, алп кара куш, жаканын баары жамгырлап, бөксөнүн баары мөндүрлөп."},{"t":"p","h":"4. Чыгарманы окуп чыгып, маанисине, берген идеясына, сүрөттөлгөн окуя, көрүнүштөргө терең түшүнгүлө. Каармандардын оң жана терс сапаттарына анализ жүргүзгүлө. Чыгармадан алган түшүнүгүңөр аркылуу элестетип, ар бир каармандын адабий көркөм портретин тарткыла."},{"t":"p","h":"5. Элдин байыркы анимисттик, магиялык, тотемдик түшүнүктөрүнө мисалдарды келтиргиле. Бул эпоско окшогон орус элинин чыгармалары барбы? Эгер билсеңер, алардагы түшүнүктөрдү салыштыргыла, окшоштуктарын жана айырмачылыктарын белгилегиле."},{"t":"p","h":"6. Чыгарманын өзүңөргө жаккан эпизоддорунан жаттагыла жана орус жана башка тилдерге которууга аракет жасагыла."},{"t":"p","h":"7. Чыгарманын тексти боюнча баяндама жазгыла. 8. Төмөнкү сөз айкаштарын эсиңерге түйүп алгыла жана өз ара сүйлөшүүдө кебиңерде колдонгула."},{"t":"p","h":"<span class=\"pg\" data-n=\"32\">32<\/span>Тишим сары болду, өзүм карып болдум, атка жетпей чал болдум, өзүм жетим бала болдум, жол болсун, төгөрөктүн төрт бурчун, төрт айланта кыдырып, анталаңдап жүгүргөн, өөдө чыксаң өбөкмүн, үзүлгөнү уланып, атка жеңил, тайга чак, жер солкулдап, чаң басып, бармагынан май чыгып, тырмагынан чаң чыгып, жебеден мурун жеткени, олбуй-солбуй камчы уруп, умачтай көзү ачылды, акылым көп, алым аз."},{"t":"p","h":"9. Төмөнкү сүйлөмдөрдөгү көп чекиттин ордуна кашаанын ичиндеги сөздөрдүн туурасын таап койгула. 1) Сарыбайдын..., тогуз кыздын ... (туну, туусу, ортончусу, кенжеси, узуну, кыскасы, эркеси, тунгучу). 2. ...баарын оорутуп, ... баарын жоорутуп (жүрөктүн, көңүлдүн, ниеттин, тулпардын, көлүктүн, эшектин)."},{"t":"p","h":"3. Элемандын Төштүгү кемпирди ..., ... жула качат. (сыйкырлап, көндүрүп, алдап, кайракты, сокуну, өгөөнү)."},{"t":"p","h":"Кучакташып ... болуп, ... Маамыт турганы (дос, кас, куда, жээн), (куюн, көрөгөч, жер тыңшаар, жейрен секиртпес)."},{"t":"h3","h":"Түшүндүрмө сөздүк"},{"t":"p","h":"күйөө бала – жених; зять, в отношении старших родственников жены алпкаракуш – букв. птица великан; огромная сказочная птица, которая помогает спасению положительных (героев) персонажей."},{"t":"p","h":"кулач – размах рук; маховая сажень, мера длины равная расстоянию между концами вытянутых в стороны и находящихся в горизонтальном положении рук."},{"t":"p","h":"ажыдаар – дракон; перен. страшилище."},{"t":"p","h":"тутам – горсть (пространство между ладонью и согнутыми внутрь пальцами в форме трубочки)"}],"sub":[{"title":"Түшүндүрмө сөздүк","b":69}],"pages":[25,32]},{"title":"МИФОЛОГИЯЛЫК ЧЫГАРМАЛАР","blocks":[{"t":"h3","h":"МИФОЛОГИЯЛЫК ЧЫГАРМАЛАР"},{"t":"h3","h":"Легендалар"},{"t":"p","h":"Байыркы элдер жаратылышка, айлана-чөйрөгө, коомго¹ жана жандуу-жансыздарга² өзүлөрүнүн алгачкы мамилелерин, көз караштарын билдиришкен. Алар табияттын ар кандай кубулуштары, коомдук өзгөрүүлөр, жандыктардын, чөп-чардын³ пайда болуулары туурасында ой жүгүртүшкөн. Ошентип, аларды бир башка нерселерге окшоштуруу, ооштуруу келип чыгат. Мифтер – элдик түшүнүктөрдүн эң байыркыларынан. Аларда элдин алгачкы анимисттик, магиялык, тотемдик, шамандык түшүнүктөрү, көз караштары чагылдырылган."},{"t":"p","h":"¹ Коомго – обществу"},{"t":"v","l":["² Жандуу-жансыздарга – живым и не живым","³ Чөп-чар – зелень, трава"]},{"t":"p","h":"<span class=\"pg\" data-n=\"33\">33<\/span>Байыркы адамдардын түшүнүгүндө тоо-таш, жер-суу, жан-жаныбарлар жандуу деп эсептелинген. Алар да адамдар сыяктуу ойлой, сүйлөй алышат, жаман же жакшы иштерди жасашат, өч алышат¹ же жардам беришет деп ишенишкен. Уруучулук доорлордо мергенчилик менен күн көргөндөр аңчылыктан жолу болбой калса же илдетке, кырсыкка чалынса, табияттын жинине тийип, каарына калуудан деп эсептешкен. Табияттын ар кандай сырларынан коркуудан, аларга табынып сыйынуудан улам ар кандай ырым-жырымдар, кыялдануулар, мифологиялык көз караштар келип чыккан. Демек байыркы эл жаратылыш сырларын түшүнүүгө аң-сезимдери жетпегендиктен, алардын касиеттерин ар кандай божомолдошкон², ар кандай нерселерге окшоштурушкан³. Буларда элдин жаратылыш күчтөрүн түшүнүүгө болгон аракеттери, умтулуулары чагылдырылган. Силер таанышкан «Эр Төштүк» эпосунда мифтик мотивдер арбын учурайт."},{"t":"p","h":"Кыргыз элинде легендалар кеңири таралган. Алар негизинен тарыхый, топонимикалык, космогониялык, этимологиялык ж.б. легендалар деп бөлүнүшөт."},{"t":"p","h":"Легенда өзүнүн фантазиялуулугуна, дүйнө таануудагы чектелгендигине⁴ карабастан, жаратылышты үйрөнүүгө, коомдун сырларын билүүгө жасаган далалаты⁵ менен айырмаланып турат. Алардын негизги тематикасы жер-суу, күн-ай, жылдыз, тоо-таш, жан-жаныбарлардын жаралышын көркөм окшоштуруу аркылуу түшүндүрүү болгон. Эми силер тааныша турган легендаларда, топ жылдыздарынын пайда болушун түшүндүрүүгө аракет жасалат."},{"t":"v","l":["¹ Өч алышат – мстят","² Божомолдошкон – предполагали, воображали","³ Окшоштурушкан – уподобляли, сравнивали"]},{"t":"p","h":"⁴ Чектелгендигине карабастан – несмотря на ограниченность ⁵ Далалаты (аракети) – здесь: попытка, старание"}],"sub":[],"pages":[33,33]},{"title":"Үркөрдүн кызы Үлпүлдөк сулуу","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"34\">34<\/span>Үркөрдүн кызы Үлпүлдөк сулуу"},{"t":"p","h":"Үркөрдүн кызы Үлпүлдөк сулуу, ай десе аркы жок, күн десе көркү жок өтө сулуу кыз экен. Атасы Үркөр эл катары жан баккан, эби менен мал тапкан, элге-журтка алымдуу, жетим-жесирге кайрымдуу орто чарба¹ оокаты бар адам экен. «Кызым чоңойсо, өз теңин тапса, ага сүйлөшүп жүрүп баш кошсо² неберелүү, чөбөрөлүү болсом»³ – деп тилек кылчу экен."},{"t":"p","h":"Ошол чөйрөдө Жетиген⁴ атанган, ашынган уруу-кески жети бир тууган да жашашчу экен. Алар айылдан айыл кыдырып, семиз мал болсо, баалуу дүнүйө болсо уурдап алышып, көзүн будамайлап жоготушчу экен. Уурдап, тартып алгандарына корстон болушуп, уурулук өнөрлөрүнө сыймыктанышчу экен. Күндөрдүн биринде Үркөрдүн кызы Үлпүлдөк сулууну көрүшүп, жактырып калышат да, уурдап кетишет. Жалгыз кызына кайгырган Үркөр каруу-жарагын камдап:"},{"t":"v","l":["«Желке чачым буубасам,","Жетиген сени куубасам.","Жер үстүнөн жок кылып,","Жетиген атың өчүрүп,","Тыйпыл кылып тынбасам,","Туулбай туна чөгөйүн,","Күндү көрбөй өлөйүн» –","деп касам ичип, ант берип⁵ кубалайт."]},{"t":"p","h":"Жети каракчы жерден жай таппасын билишип⁶, Үлпүлдөк сулууну алып асманга чыга качышат. Үркөр артынан кубалап кошо чыгат. Жетиген жылдызына айланган ошол жети каракчы ошол күндөн ушул күнгө Алтын казык жылдызын тегеренип качат дейт. Үркөр түндөсү таң атканча аларды кууйт дейт. Үркөр төбөдөн көрүнүп, жеткени калганда, жетиген атып келе жаткан таңга аралашып жашынып калат имиш..."},{"t":"p","h":"¹ Орто чарба – среднего достатка человек."},{"t":"p","h":"² Баш кошсо (турмушка чыкса) – чтобы вышла замуж ³ Небере-чөбөрө – внук, (внучка) – правнук (правнучка) ⁴ Жетиген (жети каракчы) – семерка, прозвище семи воров; созвездие Большая Медведица"},{"t":"p","h":"⁵ Касам ичип, ант берет – клянётся, даст клятву ⁶ Жерден жай таппасын билишип – поняв, что нет места на земле"}],"sub":[],"pages":[34,34]},{"title":"ТООТАЙ МЕРГЕН МЕНЕН ҮЧ АРКАР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"35\">35<\/span>ТООТАЙ МЕРГЕН МЕНЕН ҮЧ АРКАР"},{"t":"p","h":"Жер жаралганда Тоотай деген мерген жашайт. Жанда жок кылдат¹ мерген Тоотайдын атканы эч качан жаза кеткен эмес. Аны тоготпогон, алыстан эле анын жытын алып, жаасын жолотпогон абдан шум² үч аркар болот."},{"t":"p","h":"Күндөрдүн биринде Тоотай мерген сары айгырына минип, мылтыгын асынып, тайганын³ ээрчитип жүрүп, үч аркарды жолуктуруп калат. «Мунун үчөөнү тең жайлайын» – деп, тайганын агытып, мылтыгын үч аркарга сунуп, мээлеп шыкаалап калат."},{"t":"p","h":"Аркарлар жыт алып, Тоотайды көрүшөт."},{"t":"img","src":"data:image/webp;base64,UklGRlg/AABXRUJQVlA4IEw/AADwxAGdASqAAjoBPplEm0mlpCKiObRt+LATCWkzvX6RUkUBvdwdCOlZVzo/qrC808YO+lKUOa/RT/j/keyf64vPP80/zf//5pPD75i1+fSh8+eJZ/97K/i3/49mLmzjov/56bvvZagxe64TMIECZ6oR5o7Iho6HmcgPuDkyCH3vNGKi69y6khZ0kMVasZp3BcdtKRrVCMK8nLjV0+36SSWVRWAaWmZgzfzDJSBTflLyvuelfDWL9aB9jF7xTPGAXD/Lh7iYQGQWdGvnui3s6qebYihSPnu хотник) ² Абдан шум – здесь очень хитрые, проворные,"},{"t":"v","l":["³ Тайган – борзая","⁴ Байкатпай тооруптур – здесь незаметно выследил","⁵ Дыр коюп (үркүп) – шарахнулись в испуге","⁶ Жаратканга – здесь к всевышнему","⁷ Күүлөнгөн боюнча – по инерции","⁸ Жылдызга айланып – превращались в звезды"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"36\">36<\/span>СӨЗДҮК"},{"t":"p","h":"окшоштуруу (окшоштурушкан) – сравнение (сравнивали), уподобление"},{"t":"v","l":["илдет (оору)- болезнь, хвор","кырсык – несчастье, беда"]},{"t":"p","h":"Ооруп же кырсыкташса, каарга калдык деп эсептешкен. сыйынуудан улам – из за поклонения"},{"t":"v","l":["элдин умтулуулары – стремления народа","... ... чагылдырылган. Максат алга .. бала.","көзүн будамайлап – пуская пыль в глаза, обманывая","корстон болуп – важничая здесь были довольны","каруу-жарагын камдап – подготовив оружие","Үркөр ... алып артынан кууйт.","асманга чыга качышат – улетают в небеса"]},{"t":"p","h":"тегеренип качат здесь постоянно убегает вокруг (Полярной звезды) жаза кеткен эмес – здесь никогда не промахивался тоготпогон – принебрегая, не считаясь, не принимая всерьез жайлайын деп – здесь хотел убить"},{"t":"v","l":["жыт алып- почуяв запах","Бугулар жыт алышты.","зар какшашат (жалынышат) – умоляют","Аркарлар жалынышты. Эне наристесине жалынды.","жан үрөп- встрепенув","Кристина ... ырдады.","учуп жөнөшөт – взлетели","жаза-буза – как попало, мимоходом","Тайган .. тиштеди. Апасы Дилдени ... бир чапты."]},{"t":"p","h":"тушалуу сары айгыр- название звезды (букв. Рыжий конь, со спутанными ногами)"},{"t":"v","l":["Төмөнкү таблицаны толтургула:","","Жылдыздардын (асман телолорунун) кыргызча аттары – орусча аталышы","1. Сары жылдыз (Чолпон) – Венера","2. Жетиген (Жети каракчы) – Созвездие Большой Медведицы","3. Үч аркар","4. Үркөр топ жылдызы","","5. Үлпүлдөк сулуу","6. Алтын Казык","7. Тараза Жылдыз","","8. Ак сары ат, Көк сары ат","9. Тушалуу сары айгыр"]}],"sub":[],"pages":[35,36]},{"title":"Уламыштар","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"37\">37<\/span>Уламыштар"},{"t":"p","h":"Уламыштар оозеки адабиятта ошондой эле улама сөздөр, аңыз кептер деген ат менен да белгилүү. Уламыштар легенда сыяктуу эле фантазияга мол келет. Ошентсе да легендадан айырмаланып, анда болуп өткөн окуялар, жашап өтүшкөн тарыхый инсандар¹, жер-суунун көрүнүштөрү² жана алардын аталыштарынын³ келип чыгышы жөнүндө ой жүгүртүлөт. Алар тарыхый баяндоого, чындыкка жакын чечмелөөгө аракет кылгандыгы менен айырмаланат. Кыргыз уламыштары тематикасына карап жалпысынан эки топко – тарыхый жана топонимиялык болуп бөлүнүшөт."},{"t":"p","h":"Маселен, Чынгыз хан, Аксак Темир, Жантай, Курманжан ж.б. инсандар тууралуу аңыз кептер тарыхый, ал эми Бишкек, Ысыккөл, Долон, Байтиктин боз бөлтөгү ж.б. тууралуу улама сөздөр топонимикалык уламыштар деп аталат."},{"t":"h3","h":"Балбай баатыр"},{"t":"p","h":"Балбай баатырдын энеси Жолборстун жүрөгүнө⁴ талгак болот. Бирок, ошол учурда эл жолборстун жүрөгүн таба албай коюшуп, камандын өтүн, жылкынын жүрөгүн алып келип беришет. Энеси ошолорду жеп⁵, талгаты канат экен."},{"t":"p","h":"Кийин Балбай баатыр атанып, далай эрдик көрсөтөт. Ошондо эл анын тоң моюндугун байкашат. Кандай шашылыш⁶ иш болсо да артына кылчайып, мойнун буруп карай албастан, бүтүндөй тулкусу менен бурулчу экен. Ошондон улам каман моюн деп аталып кетет. Кежигесиндеги түксүйгөн жалы ага баатырдык көрк берип турган дешет."},{"t":"p","h":"Балбай баатыр жаш кезинен эле жылкынын таза этин жеп, кымызын ичип, уу коргошундун түбүн жеп көнгөн экен. Аны кармап алып, Алматыга (ал кезде Верный деп аталган) түрмөгө салып, уу беришет⁷. Сегиз жолу берилген ууну былк этпей көтөрүп, тогузунчусунан араң кайтыш болгон⁸ экен."},{"t":"p","h":"¹ Тарыхый инсандар – исторические личности"},{"t":"v","l":["² Жер-суунун көрүнүштөрү – явления природы","³ Аталыштарынын – здесь названия, наименования","⁴ Жолборстун жүрөгүнө – сердцу тигра","⁵ Ошолорду жеп – кушала их"]},{"t":"p","h":"⁶ Шашылыш иш – спешная, срочная, безотлагательная работа. ⁷ Уу беришет – дают яд ⁸ Кайтыш болгон – умер, скончался"}],"sub":[],"pages":[37,37]},{"title":"Кошойкоргон","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"38\">38<\/span>Кошойкоргон"},{"t":"p","h":"Атбашы районунун күн батыш мандайында «Кошойкоргон» аттуу жер, сепилдин урандысы бар. Илгери Манас баатырдын тушунда кадимки катаган уруусунун ханы Кошой балбан салдырган экен. Калмактардын баскынчылыгынан эл туш-тушка качканда, Кошой элин ошол сепилге бекитип алып, алар менен салгылашкан экен."},{"t":"p","h":"Калмактар көптүк кылып Кошойдун Билерик деген баласын кармап кетишкен. Кийин Манас элди-жерди кытай-калмактардан тазалаганда, Кошой абасына жардамга келип, душмандардын курчоосунан куткарат. Көп жылдардан соң сепил бузулуп, азыр анын урандылары гана калган."},{"t":"h3","h":"СӨЗДҮК"},{"t":"v","l":["аңыз кептер (улама сөздөр) – здесь предания","Эл арасы ... өтө бай. Улама сөздөр – элдин кенчи.","мол келет («көп» деген мааниде) – много, богат"]},{"t":"p","h":"Уламада фантазия... болот. Быйыл мол түшүм алынды. көрүнүш – вид"},{"t":"p","h":"Жер-суунун ... жөнүндө ой жүгүртүшкөн. Ильянын көрүнүшү сүрдүү. Жолойдун көрүнүшү орой."},{"t":"v","l":["айырмаланат – отличаеться","Миф менен легенда бири-биринен айырмаланат.","камандын өтү – желчь кабана"]},{"t":"p","h":"баатыр атанып (аталып) – здесь стал называться (народом) богатырем, храбрецом."},{"t":"p","h":"тоң моюн – неуклюжий"},{"t":"p","h":"Балбай ... ... баатыр болгон. «Экинчи тоң моюндук кылбай жүр»,- деди."},{"t":"v","l":["тулкусу менен – всем телом","кежигесиндеги түксүйгөн жалы – хохолок на затылке","былк этпей көтөрүп – уверенно выдержал","сепилдин урандысы – развалины крепости"]},{"t":"p","h":"курчоосунан куткарат (курчоодон бошотот) – освободить от окружения"},{"t":"p","h":"1. Мифологиялык чыгармаларга кайсыл жанрлар кирет? Легенда деген эмне? Кыргыз элинде кандай легендалар бар экен? Уламыштар легендалардан эмнеси менен айырмаланат экен?"},{"t":"p","h":"2. Силер окуган легенда жана уламыштар жактыбы? Аларда айтылган окуялардын кайсынысы чындыкка жакын, кайсынысында фантазия, апыртуу бар? Дагы кандай легенда, уламыштарды билесиңер?"},{"t":"p","h":"6 Кадимки катаган уруусу – здесь давнее известное племя катаган. 7 Кармап кетишет – берут в плен."},{"t":"p","h":"<span class=\"pg\" data-n=\"39\">39<\/span>1. Төмөнкү сүйлөмдөрдүн түзүлүшү жана мааниси кандай экендигин аныктагыла. Бул сүйлөмдөрдөгү сөздөрдүн жайланыш тартибин орус тилиндеги котормосу менен салыштыргыла."},{"t":"p","h":"Атасы Үркөр эл катары жан баккан, эби менен мал тапкан, элге-журтка алымдуу, орто чарба адам экен. «Туулбай туна чөгөйүн, түндү көрбөй өлөйүн» – деп ант берет. Аркарлар жыт алышып, Тоотайды көрүшөт. «Бу балакеттен куткар!» – деп зар какшашат."},{"t":"p","h":"2. Силер кандай легенда, уламыштарды билесиңер?"},{"t":"p","h":"3. Төмөнкү сөздөрдү катыштырып, жөнөкөй жана татаал, жалаң жана жайылма мүчөлүү, жай, суроолуу, илептүү сүйлөмдөрдү уюштургула."},{"t":"p","h":"Коом, небере-чөбөрө, орто чарба, касам ичип, ант берип, көзүн будамайлап, анимизм, тотемизм, аркар..."},{"t":"h3","h":"Түшүндүрмө сөздүк"},{"t":"p","h":"анимизм (латынча жан, рух, адам) – байыркы адамдардын жан-жаныбар, чөп-чар, буюм-теримдерди киши сыяктуу ойлойт, сезет, алар сыяктуу жашоо касиетине ээ деп түшүнүшү."},{"t":"p","h":"магизм (латынча сыйкырчылык) – кандайдыр бир дубалардын жардамы менен айлана-чөйрөгө таасир этүүгө болот деген ишеним тотемизм (грекче башталыш) – бардык адам жан-жаныбарлардан келип чыккан деген түшүнүк. Ошондуктан алар ал жаныбарларга айлана алышат, алар сүйлөшө алышат деп ишенишкен. шаманизм – байыркы диндердин бири. Ага ишенгендер көрүнүштөрдүн, кубулуштардын ээси бар, алар кээде адамдарды колдойт, ачуусуна тийсе кырсык алып келет деп түшүнүшкөн. Шамандар гана ал күчтөр менен тил табыша алат деп ойлошкон. Алар башкалардан айырмаланган кийим-кече кийишкен, сыйкыр-керемет күчү бар деп эсептелинген аса-муса таяк алып жүрүшкөн. Атайын ырым-жырымдарды кылышып, бийлөө, аспапта ойноо менен таасирдүү көрүнүшкөн."},{"t":"p","h":"тарыхый -болуп өткөн окуяларга, тарыхый жашаган адамдарга байланыштуу."},{"t":"p","h":"топонимикалык —жер, суу аттарынын пайда болушуна байланыштуу."},{"t":"p","h":"космогониялык – планета, жылдыз, ж.б. асман телолорунун келип чыгышына байланыштуу."},{"t":"p","h":"аркар – архар, горный баран (самка). Койдун жапайы түрү. Жүрүшү ыкчам, тоо-таштын катаал шартына өтө чыдамдуу жаныбар. тушалуу сары айгыр – название звезды (букв.) Рыжый конь, со спутанными ногами."},{"t":"p","h":"талгак болуу -идиосинкразия, вкусовые капризы (старое поверье) если у женщины должен родиться богатырь, ей хочеться есть сердце, или мясо тигра."},{"t":"p","h":"уу коргошундун түбү – корень аконита. Кыргыздар байыртадан бул чөптү дарылык үчүн колдонушкан."},{"t":"h3","h":"<span class=\"pg\" data-n=\"40\">40<\/span>АДАБИЯТ ТЕОРИЯСЫНАН"},{"t":"h3","h":"Миф жөнүндө түшүнүк"},{"t":"p","h":"Миф (грекче улама сөз) – байыркы адамдардын айлана-чөйрөсүндөгү турмуш-тиричилик, жан-жаныбар, жаратылыш көрүнүштөрүнө байкоолорунун, ой жүгүртүүлөрүнүн натыйжасында пайда болгон чыгармалар. Аларда ар кандай укмуштуу күчтөр, кудайлар, шайтандар, сырдуу көрүнүштөр, адаттан тыш окуялар жөнүндө көркөм апыртылып баяндалат. Бул чыгармалар адамдар али жаратылыштын сырларына түшүнө элек кездерде, нерселерди, кубулуштарды көркөм ооштуруу, окшоштуруу, салыштыруунун негизинде пайда болгон."},{"t":"p","h":"Мифологиялык тексттер кыргыз элинин эпикалык чыгармаларында (эпостордо), жөө жомокторунда, уламыш жана легендаларында ж.б. жанрларда кеңири кездешет. Силер, балдар, андай тексттердин айрым үлгүлөрү менен жогоруда тааныштыңар."},{"t":"p","h":"Ошондой эле азыркы учурда да жазуучулар мифтерге кеңири кайрылат. Эсиңерге түшүрүп көргүлөчү, азыркы кайсы жазуучулардын чыгармаларынан мифологиялык тексттерди окугансыңар?!..."},{"t":"p","h":"Төмөнкү ырдын маанисин кары кишилерден сурап чечмелегиле: Жылдыздарга карата элдик байкоолордун туура экендигин текшергиле:"},{"t":"v","l":["Оң чекеден күн чыгып,","Сол чекеден ай чыгып,","Тогоол болуп бул экөө","Белги берип атыптыр.","«Семетей»"]}],"sub":[],"pages":[38,40]},{"title":"ДИДАКТИКАЛЫК ЧЫГАРМАЛАР","blocks":[{"t":"h2","h":"ДИДАКТИКАЛЫК ЧЫГАРМАЛАР"},{"t":"p","h":"Адептүү жүрүш-турушка, ак ниет, чынчыл, эмгекчил болууга, кайрымдуу, боорукер, адамкерчилик сапат-касиеттерге ээ болууга үндөгөн, кыска, так, түз маани билдирген көркөм кептер дидактикалык чыгармалар деп аталышат."},{"t":"p","h":"1 Байкоолор – наблюдения."},{"t":"p","h":"2 Шайтандар жөнүндө – про сатану, про нечистую силу. 3 Апыртылып (күчөтүлүп) – преувеличивая, фантазируя. 4 Көркөм ооштуруу – художественное уподобление, метафоричность."},{"t":"p","h":"5 Салыштыруунун негизинде – на основе сравнений."},{"t":"p","h":"6 Тогоол (астрономиялык түшүнүк) – противостояние звезд."},{"t":"p","h":"<span class=\"pg\" data-n=\"41\">41<\/span>Дидактика – грек сөзү, «өрнөк, үлгү берүүчү, таанытуучу, тарбиялоочу» деген маанини билдирет."},{"t":"p","h":"Кыргыз элинде дидактикалык чыгармалар оозеки чыгармачылыктын маанилүү бир бөлүгү. Андай чыгармаларга макал-лакаптар, насаат, терме, үлгү, санат ырлары, табышмактар кирет."}],"sub":[],"pages":[41,41]},{"title":"Макалдар жана лакаптар","blocks":[{"t":"h3","h":"Макалдар жана лакаптар"},{"t":"img","src":"data:image/webp;base64,UklGRm4/AABXRUJQVlA4IGI/AADQoQGdASqAAmcBPrVQo0mnJSOiLpNa+OAWiWlu4WQbTy2Y/SXmH8sv6vhL+U/b/n99ofJP2x6kfzv9Wf9vQfwj/PvEpf502PHC/w9Wv0P/4ey1+63PNf3ehH7T47SZ6Zby9HuSYGh9gXYmA004JCRmqmm2OKbSttmBPc+DWXMy3l6PckwN6rJqbkBocEnilNfa2Wpg7a1PrUUHrNyyxrR4C1PXeETfnnrUmzvI6fBkcXEJzxvVZNTcgNDgmfMmemW1gBm6UCnUqYvzJbdlvvZU/2nHbKNPFggu+RcQ+XVfVBTGFnGH9gAGGcgl4+cbusUqRlZviPA0fmeOCNWyiid7hIZ3plyU0LKGhwTafUnqrJqRRFGjiZAZtmZE9YI3WkuILGmQ0t3y3slI2rekoagoY3FQdCwym3vE/RhE/AzSJ4n6tEj2q90htuw0+EC4bH3nykFM/bBETXTffXpugMF25bxVXgqpcN7TTgmfMmemW8XNPsGJt+uMBfQjTa6ZYY0oXcL38bLPW6Xq3MZOQMAGBbcyufQR84PilY5rHZloa66vBZmn83Nuy4rMbvHSbRcDxDATaiHItyzobM9dS+AtGeLICc8DCGhgKadiHJrf1quR476HIsYW4x2ANLYtKlqU9V0uAKBkdJIVsQbTgmfMmemW8Qi1KYtgZy/gD/xf54qmhrg1RiifhG19up ю, мировоззрению."},{"t":"p","h":"<span class=\"pg\" data-n=\"42\">42<\/span>«Эр достугу – эгиз, эл достугу – деңиз», «Эр жигит эл четинде, жоо бетинде», «Өнөр алды – кызыл тил», «Жаш келсе ишке, кары келсе ашка», «Эл дөөлөтү – эмгек, эмгек баарын жеңмек», «Мурун чыккан кулактан, кийин чыккан мүйүз озуптур», «Ачка олтургандан көрө, айранга нан туурап жеген жакшы», «Айдаганы беш эчки, ышкырыгы таш жарат»."},{"t":"p","h":"Булардын тематикасы достук, баатырдык, тил, өмүр, эмгек ж.б. түбөлүктүү түшүнүктөргө арналат. Макал-лакаптар байыртадан эле адам эс-акылынын, оюнун энциклопедиясы – деп атоого татыктуу болгон. Аларга баа берүүдө эл суктануу менен «сөздүн гүлдөрү», «адам оюнун каймагы», «сөз килеми» деп аташкан."},{"t":"p","h":"Көп сандаган макалдар жалкоолорду, жатып ичер жанбактыларды, анткорлорду, ичи тар кералбастарды, кошоматчыларды, эки жүздүүлөрдү, кекирейүүчүлөрдү, коркоктор менен соргокторду ж.б.д.у. сыяктууларды сынга алат, шылдыңдайт. Маселен, «Байдын түбү уурулук», «Адалсынган молдонун үйүнөн, алты камандын башы чыгыптыр», «Иштебеген тиштебейт», «Жалкоонун жан жыргатары – уйку менен түш, жан кууратары – эмгек менен иш», «Корооңо сак бол, коңшуңду ууру тутпа» ж.б."},{"t":"p","h":"Элдин турмуш-тиричилигиндеги узак тажрыйбалардын корутундусунан чыккан көз караштарды таасирдүү жана терең мааниде баяндаган кыска, уйкаш сүйлөмдөрдү макалдар дейбиз. Макалдарда ой толук айтылып, анын жыйынтыгы көрүнүп турат."},{"t":"p","h":"Мисалы, «Абийиринди жашындан сакта», «Акылы аздын азабы көп», «Тоону, ташты сел бузат, адамзатты сөз бузат», «Алыстагы душмандан, андып жүргөн дос жаман», «Окуу – билим азыгы, билим – ырыс азыгы» ж.б."},{"t":"p","h":"Белгилүү бир окуядан, же адамдын мүнөзүнөн, жүрүш-турушунан улам айтылып калган, келип чыгыш тарыхы бар, элестүү сөздөрдү лакаптар дейбиз. Лакапта ой гана берилет да, корутунду угуучулар тарабынан чыгарылат. Лакаптар салыштыруу жана окшоштуруу иретинде айтылгандыктан -ган, -дай деген мүчөлөр, «окшобой», «болбой», «дегендей» сыяктуу сөздөр менен аяктайт."},{"t":"p","h":"1 Байыртадан эле (эзелтеден эле, илгертеден эле) – с древних времен."},{"t":"p","h":"2 Суктануу менен – восхищаясь, с восхищением."},{"t":"p","h":"3 Жатып ичер жанбактыларды – дармоедов, ленивых людей, стремящихся жить за счет других."},{"t":"v","l":["4 Анткорлорду – лгунов, клеветников, притворщиков","5 Кекирейүүчүлөрдү – высокомерных","6 Соргокторду – обжорливых, ненасытных"]},{"t":"p","h":"<span class=\"pg\" data-n=\"43\">43<\/span>Мисалы, «Жетигендей ээрчишпей», «Шодокондун бүркүтүндөй жутунбай», «Өлгөн аттын такасын издеп, бир бай алты ай жер кезген экен» ж.б."},{"t":"h3","h":"СӨЗДҮК"},{"t":"v","l":["жашоо-турмуш негиздери – основы жизни","Элдин ... байыртадан көчмөн турмушка ыңгайлашкан.","уютулган алтындай – как слиток золота.","Макал-лакаптар ... накыл кептердин, сөз каймактарынын","жыйындысы. Таш ... оор экен.","максат-мүдөө – цель, стремление.","Кандай ... – ... бар?"]},{"t":"p","h":"Максат мыкты окуучу. Элдин .... эле дүйнөдө тынчтык болсо. түбөлүктүү түшүнүктөр – извечные понятие"},{"t":"v","l":["Эмгек, акыл, тил ж.б. алар...","адалсынган молдо – ложно святой мулла","... айтканын кыл, кылганын кылба (макал).","Акырын баскан ... сактан, ала чапан кожодон сактан.","таасирдүү – влиятельный","Чечен ... сөз сүйлөдү","Рустам чөйрөсүндө ... бала.","сөздүн гүлдөрү, сөз килеми (эң сонун сөздөр) – прекрасные слова.","Жазуучу ... ... менен чыгармасын жаратты.","Алина апасына ... ... арнагысы келди."]},{"t":"p","h":"адам оюнун каймагы (мында адамдардын эң сонун ойлору деген мааниде) – сливки (прекрасные) человеческой мысли."},{"t":"p","h":"Макал-лакаптарда ... катылган. Кимдин ... ким билет?"},{"t":"p","h":"Төмөнкү суроолорго жооп берүүдөн мурун макал-лакаптар жөнүндөгү макаланы, алардын аныктамасын көңүл коюп окуп чыккыла. 1. Макал деп эмнени айтабыз? 2. Лакап деген эмне? 3. Аларды эмне үчүн «акыл-ойдун энциклопедиясы» деп аташат? 4. Силер кандай макал-лакап билесиңер? 5. Алар дидактикалык башка жанрлардан кандай өзгөчөлүктөрү менен айырмаланышат?"},{"t":"p","h":"Көп чекиттин ордуна тиешелүү сөздөрүн койгула. Маанисин түшүндүргүлө жана тематикасын аныктагыла:"},{"t":"v","l":["1. Эр башына ... менен суу кечет.","Ат башына ... менен суу ичет.","2. Байдан ... чыкса, кедейден ... чыгат.","3. Касапчы ... сөөк сатат.","4. Туура ... тууган жок, ... бийде ыйман жок."]},{"t":"p","h":"<span class=\"pg\" data-n=\"44\">44<\/span>5. Айгыр болор кулундун ... чоң болот. Кочкор болор ... маңдай жагы ... болот."},{"t":"p","h":"1. Төмөндөгүлөрдүн кайсынысы макал, лакап, табышмак жана фразеологизм сөздөр экендигин аныктагыла: «котур ташы койнунда»; «сиркеси суу көтөрбөй»; «Чубактын кунундай чубалган иш»; «чычканга кебек алдырбас»; «Ала-байтал акылың болсо, көлгө тарт»; «мурун туулуп, кийин калган эмне?»; «Баланын көркү энеде, дайранын көркү кемеде»; «Шаршенче кайталап»; «Ай астынан өткөн жигит, алтын чоор тарткан жигит», «Күн астынан өткөн жигит, күмүш чоор тарткан жигит»; «Илим – окуу булагы, Билим – өмүр чырагы»."},{"t":"p","h":"2. Төмөнкү орус элинин макалдарынын маанисине дал келген кыргыз элинин макалдарын тапкыла, аларды салыштыргыла: «Земля мать-подает клад», «Где цветок, там и медок». «Старое старится, молодое растет», «Без причины чирий не сядет», «Береги честь смолоду», «Труд человека кормит, а лень портит», «С родной земли умри – не сходи», «Плетью обуха не перешибешь», «Всякая сосна своему бору шумит», «Белый свет не околица, а пустая речь не пословица», «Умный плачет, глупый скачет», «Море по рыбке не тужит», «Не надобен клад, если в семье лад»."},{"t":"p","h":"3. Төмөнкү лакаптардын маанисине дал келген кыргыз элинин лакаптарын тапкыла:"},{"t":"p","h":"«Комар носа не подточит», «Совать нос не в свое дело», «Пальцы в рот не клади», «Все идет как по маслу», «Ни к селу, ни к городу», «Чужими руками жар загребать», «Работать с огоньком»."},{"t":"p","h":"4. Көп чекиттин ордуна тиешелүү сан атооч сөздү койгула. Сан атоочтун кайсы түрүндө тургандыгын жана кандай маани түшүндүрөрүн айтып бергиле."},{"t":"v","l":["1. Билеги күчтүү ... жыгат","Билими күчтүү ... жыгат.","2. ... бири кыдыр","3. Эр ортону ... жаш"]},{"t":"v","l":["4. ... байлык ден-соолук","... байлык ак жоолук, ... байлык ...","5. Айла ..., акыл ...","6. ... миңге, ... түмөнгө."]},{"t":"p","h":"5. Тил, эмгек, акыл жана билим, мал чарбасы, дыйканчылык, өнөр, эл, эрдик жана коркоктук, достук жана душмандык, үй-бүлө, өмүр жана өлүм тематикаларындагы макал-лакаптарды таап классификациялагыла!"},{"t":"p","h":"Алардын маанисин ата-энеңердин, байке-эжеңердин, түшүндүрмө сөздүктөрдүн жардамы менен чечемелегиле."},{"t":"p","h":"6. Ата-энеңер, досторуңар, силер сүйлөшүп жүргөн тааныштарыңар өз кептеринде кандай макал-лакаптарды колдонушарын байкап, аларды адабий күндөлүгүңөргө жазып алгыла."},{"t":"p","h":"1 Классификациялагыла – классифицируйте <span class=\"pg\" data-n=\"45\">45<\/span>"}],"sub":[{"title":"1. Төмөндөгүлөрдүн кайсынысы макал, лакап, табышмак","b":27}],"pages":[42,45]},{"title":"ЛИРИКАЛЫК ТЕК","blocks":[{"t":"h2","h":"ЛИРИКАЛЫК ТЕК"},{"t":"h3","h":"Эмгек ырлары"},{"t":"p","h":"«Эмгек элди жаратат» деген накыл сөздүн калети жок. Анткени эмгек менен гана адам ушул күнгө келип жетти."},{"t":"p","h":"Көптөгөн фольклордук чыгармалар да – эмгек процессинин натыйжасы. Эмгек кылуу процессинде жаралып, аны жеңилдетүү максатын көздөгөн ырлар эмгек ырлары деп аталышат."},{"t":"p","h":"Кыргыздын эмгек ырларына «Оп майда», «Бекбекей», «Шырылдаң», «Тоң чык» деген ырлар кирет. «Оп майданы» күзүндө кырман баскан дыйкандар беш-алты жылкыны же уйду, же эшекти теминге кошуп алып тегерете айдаганда ырдашкан."},{"t":"p","h":"«Бекбекей» ыры мал уурдоочуларды сестентүү максатында, түнкүсүн короо кайтарган кыз-келиндер ырдоочу ыр. Анда короону кайтарган кишилер бар экендиги, алар сак экендиги жөнүндө сөз болот."},{"t":"p","h":"«Шырылдаң» болсо – жылкычылардын турмушунан алынган ыр. Анда жылкычылар кыз оюндарда, үйлөнүү үлпөттөрүндө айылга түшүп келип ырдашкан."},{"t":"p","h":"Орус фольклорундагы – дыйкандардын, бурлактардын, ямщиктердин жана жумушчулардын ырлары жалпы жонунан кыргыз эмгек ырлары менен үндөшүп турат. Бардык эле эмгек ырлары өтө оор эмгек процессин жеңилдетүү жана эмгектин акыбети кайтышын тилек кылуу мотивинде болгон."},{"t":"p","h":"Эмгек ырларын окуп чыгып, ата-бабалардын акылдуулугуна, талантына күбө болобуз. Маселен, алар ар кандай ишти ыр менен коштоп, убакытты өткөрүүгө, чарчап-чаалыккандарын унуткарууга, аракет кылышкан. Ырлар эмгек ыңгайына жараша чыгарылып, иштин ыргагы менен үндөшүп турган. Ыр аларга дем, күч берип, көңүлдүү, маанайлары жогору болгон. Алар даяр текстти гана жаттап албастан, өзүлөрү да ага кошумча саптарды кошушкан. Ошентип ырдын варианттары жаралган."},{"t":"p","h":"1 Накыл сөз – мудрое слово, изречение."},{"t":"p","h":"2 Калети жок – безспорно, правильно."},{"t":"p","h":"3 Эмгек процессинин натыйжасы – результат трудового процесса 4 Тегерете айдаганда – когда вели по кругу."},{"t":"p","h":"5 Мал уурдоочуларды сестентүү үчүн – чтобы попугать скотокрадов."},{"t":"p","h":"6 Короону кайтарган кишилер – люди охраняющие овечий загон."},{"t":"p","h":"7 Үйлөнүү үлпөттөрүнө – к свадебным празднествам."},{"t":"p","h":"8 Акыбети кайтышын – чтобы оправдал себя, дал свои плоды.<span class=\"pg\" data-n=\"46\">46<\/span>"},{"t":"img","src":"data:image/webp;base64,UklGRqxHAABXRUJQVlA4IKBHAACwkAGdASqAAiUBPrFMoEmnJKOiLzUsWOAWCWlDQtc5FdPkX7PeZzyd/keEf5D9c/xf8T6/35Dkr9V/xfMn+c/mfIYzAed2ovjR28AC+1Eok++upT5193R0Jn/R4Gp7gUIdrrkvptRVxPkjN3o9m9OCgrXUwRWKf2SdeiWK+FaeI1uRF1YKPSvNjc9Zn+ivQguCYYwh8krlIDw59Ir6+fIpJMHKcH5ai2fnsjSq7IxC4GF8e9dbaSkVxB3Don/xONRSFkc0csNhu9LivjODapa+d4xwtU1SY6yDrEezzK49M4o4VrayPt18y1K9mvo9qiB77gTIAjk40pq0PDvCvjBekadTF8MHcv9/9Xaukx8mqwpPBiFwlQZ2TFm/Kgrriqps00TM5JPP1l6343djg/estdT8Jsls+XS99h27pwQo531NSc8LFNvofdgnBWD076clTTW7fGbI91fSj21/+7+H1dZGAHwC6lSOz8HhxDd/GGz2NBbgNF3p4Ej9+ixUWjg93vrf3J/tDuitJ/A6SYqo9fs4vpywBsXJ+FeVcOM4ViE0r+K6UZjseLciDI6YHQdl87zHQrxmpg5845h/J3dXHBNuEZqLh5r+NZSSWT3uOykRdcF+hvid+Woay0XRSfHkATxeqVuEjXxwRbjtYnu6KXsKaZbY нү жылтырак","– шерсть коня гладкая,","блестящая","белиндеги – в поясе (у тебя)"]},{"t":"p","h":"жыргал – наслаждение, благодать"},{"t":"v","l":["1 Коноюн – останавлюсь на ночлег, переночую.","2 Иче турган ашыңа – к пище (твоему).","3 Карыш бою жер каздык – выкопали пядь земли","4 Жалы бар, мында сакалы бар – с бородой","5 Эрмен – полынь горькая"]},{"t":"p","h":"6 Шерменде – пристыженный, опозоренный, посрамленный"},{"t":"v","l":["<span class=\"pg\" data-n=\"48\">48<\/span>Жылганын ичи жык текей,","Шыңгыроолуу Бекбекей.","Колоттун ичи кой текей","Коңгуроолуу Бекбекей."]}],"sub":[],"pages":[47,48]},{"title":"Шырылдаң","blocks":[{"t":"h3","h":"Шырылдаң"},{"t":"v","l":["Конок тоого бүткөндө,","Кошо чыккан шырылдаң.","Таруу ташка бүткөндө,","Талаша чыккан шырылдаң.","Жылкычы менен коюндаш","Жанаша чыккан шырылдаң.","Шырылдаң биздин шыйкыбыз","Түндө келет уйкубуз.","Аман болсо жылкыбыз.","Эртең канар уйкубуз.","Шырылдаң айтып жүргөндө","Конок менен тарууну","Жеп кетпесин жылкыбыз.","Шыпшырылдаң шыр экен,","Жылкычынын ыры экен","Карылардын наркы экен,","Жигиттердин айты экен.","Бай, байтерек, байтерек","Башын кесмек не керек?","Эт желиндүү боз койго","Тели козу не керек?","Эрге жакпас катынга,","Упа-эндиги не керек?","Ана султан шырылдаң,","Мына султан шырылдаң.","Шыпшырылдаң шыр экен,","Жылкычынын ыры экен.","","1 Конок, таруу – просо","2 Коюндаш – здесь вместе"]},{"t":"p","h":"талаша чыккан – здесь в знач. одновременно выросший жанаша чыккан – в знач. вместе, совместно выросший жеп кетпесин – не съели наркы (салты) – обычай, ценность жигиттердин айты – праздник жигитов (айт – религиозный праздник) байтерек – осина тели козу не керек – здесь зачем маленький ягненок, подпущенный к чужой овце для кормления 3 Шыйкыбыз, мында ырыбыз, таң тамашабыз деген мааниде – праздник наш"},{"t":"v","l":["4 Башын кесмек не керек – зачем срубать её верхушку.","5 Упа-эндик – белила, румяна (пудра)."]}],"sub":[],"pages":[48,48]},{"title":"ОП МАЙДА","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"49\">49<\/span>ОП МАЙДА"},{"t":"v","l":["Майда-майда, мапмайда,","Майдалансын, атты айда.","Кызыл толгон кырманды","Сузалы биз кап кайда?","Бекер жүрсөң жан багып,","Табалбайсың эч пайда.","Майда-майда, оп майда.","Орой-орой оп майда","Ороо толсун, оп майда,","Кырча-кырча басканың,","Кырман толсун, оп майда,","Майда-майда мапмайда","Майдалансын атты айда."]},{"t":"p","h":"мапмайда – мелко-мелко сузалы – здесь соберём бекер жүрсөң – если ничего не делаешь эч пайда – не будет никакой пользы кырча-кырча басканың – здесь молотили атты айда – гоняй коня (по кругу)"},{"t":"p","h":"Майда бассаң жаныбызга пайда..."},{"t":"v","l":["Талкандары бизге пайда,","Топондору сизге пайда.","Шакылдата баспасаң","Оп майда, бизге дан кайда.","Кар алдына калбасын,","Эртелеп баарын майдала.","Орой-орой, оп майда.","Орой-орой басканда,","Ороо толсун, оп майда.","Кырча-кырча басканда,","Кырман толсун, оп майда.","Даны бизге пайда,","Топону сизге пайда."]},{"t":"h3","h":"СӨЗДҮК"},{"t":"p","h":"шакылдата баспасаң – здесь если не молотить быстро, энергично кар алдына калбасын – до наступления зимы, чтобы зерно не осталось под светом даны бизге пайда – здесь зерно нужно вам короомдун чети таман жол- по краю (моего) загона проходит тропинка (дорога)"},{"t":"v","l":["Короомдун четинен таман жол өтөт.","тосмо жол – дорога с преградой","Ирина мектепке ... менен айланып өтүп келет.","таң сөгүлүп атпайбы – забрезжает, наступит рассвет."]},{"t":"p","h":"Таң сөгүлүп атып келе жатты. ... мектепке чогулгула. ыргай эмей эмине – то же ирга (вид кустарника)."},{"t":"v","l":["1 Кызыл толгон кырман – здесь ток полный зерна.","2 Талкандары – толокно.","3 Топондору – мятина.","<span class=\"pg\" data-n=\"50\">50<\/span>Ыргай, тобулгу, табылгы – баары өтө катуу жыгачтар.","шыңгыроолуу (конгуроолуу) – колокольный","Илгери мал баштаган жандыкка коңгуроо тагышкан.","... көч келе жатат.","кошо чыккан – вместе выросший","... шырылдаң. Эдил атасы менен ... ...","эртең канар уйкубуз – завтра выспимся","майдалансын – размельчаться, дробиться.","... атты айда.","дан кайда – здесь зерна не будет.","Үрөн экпесең ..."]},{"t":"p","h":"1. Кандай эмгек ырларын билесиң жана алардын кандай өзгөчөлүктөрү бар? 2. «Бекбекей» ырында койчулардын турмушу жөнүндө кандай ой айтылат? 3. «Шырылдаң» ырында жылкычылар эмне тууралуу ой бөлүшөт? 4. «Оп майда» ыры кимдердин ыры жана анын негизги идеясы кандай? 5. Орус элинин кандай эмгек ырларын билесиңер?"},{"t":"p","h":"1. Эмгек ырларын жаттагыла жана көркөм айтууга, обону менен ырдоого көнүккүлө. Орус жана башка элдердин эмгек ырларынан аткарып бергиле."},{"t":"p","h":"2. Үйдөн «Эмгек ырларынын мааниси» деген адабий пикир жазгыла. Кыргыз элинин турмушундагы кой жана жылкы багуу, кырман бастыруу процесстерин көрдүң беле? Бул эмгек процесстерин башка элдердеги өзүңөр билген эмгектин түрлөрүнө салыштырып чыккыла."},{"t":"p","h":"3. Төмөнкү улуттук-этнографиялык түшүнүктөрдүн маанисин чечмелегиле. Кандай мааниде экендигин аныктагыла жана эсиңерге түйүп алгыла:"},{"t":"p","h":"Алты аркар жылдыз, койдун сүтү коргошун, конок, таруу, макмал тон, чочмор, карала каптын кагынчык, жигиттердин айты."},{"t":"h3","h":"ТҮШҮНДҮРМӨ СӨЗДҮК"},{"t":"p","h":"бекбекей – старинная народная песня. Её исполняли девушки и молодые женщины, когда ночью строжили своих баранов (или отару овец) шырылдаң – песня конских пастухов (пелась обычно осенью и зимой когда пастух приезжал в аул на праздник, айт или свадьбу. оп майда (темин) – 1. Возглас понукания молотящих животных. 2. песня которую поют во время молотьбы."},{"t":"p","h":"кыз оюн – девичьи традиционные игры. Үйлөнүү тоюнда кыздын төркүнүндө өткөрүлүүчү оюн-зоок. Анда сармерден, кайым, жаңылмач айтышуу, көз таңмай, жоолук таштамай, селкинчек, жар көрүшүү ж.б. оюндар ойнолот. «Ак илбирстин тукуму» (реж. Төлөмүш Океев) көркөм фильминде кыз узатуу салты көрсөтүлгөн,"},{"t":"v","l":["Алты аркар жылдыз (астр.) – Малая Медведица.","макмал тон – легкая шуба, сделанная из овечьей шкуры.","<span class=\"pg\" data-n=\"51\">51<\/span>койдун сүтү коргошун (мында өтмө маани) – очень калорийное овечье молоко","ыргай – ирга (кустарник с очень крепкой древесиной)."]},{"t":"p","h":"чочмор (чокмор) – дубинка с утольщением на конце (орудие рукопашного боя)."},{"t":"p","h":"колоттун ичи кой текей – здесь узкая горная долина, сплошь покрытая козельцами."},{"t":"p","h":"эт желиндүү боз койго, тели козу не керек – (байып кеткен койго, козу телип кереги жок) – истощенной овце (которая не может дать молоко) ягненка для кормления пускать не стоит. ороо – яма для хранения зерна."},{"t":"v","l":[" Жаңылмачтарды жатта, жаңылбай айт!","Белестеги беш кашка кой,","Бешөө беш башка кой.","Беш аласы кунан кой,","Беш аласы дөнөн кой.","Асманда эки айрыкуйрук:","Бири кыска айрыкуйрук,","Бири кара кыска айрыкуйрук."]},{"t":"p","h":"4. Төмөнкү таблицаны толтургула, ар бир аталышты орус тилиндеги эквиваленти менен салыштыргыла."},{"t":"p","h":"(Таблица) кой – козу, эчки – улак, уй – музоо, жылкы – кулун, төө – бото (туулганда); 1-жыл – борук, токту (кой) ...; 2-жылы ...; 3-жылы ...; 4-жылы ..."},{"t":"h3","h":"Макалдарды эсиңерге түйгүлө!"},{"t":"v","l":["«Кетмен менен иштебей, нанды кайдан табасың»,","«Алтын күмүш – таш экен, Арпа, буудай – аш экен»,","«Байлык атасы – эмгек, энеси – жер»,","«Бөрү азыгы – мурдунда, жылкы азыгы – туягында»,","«Аксак козу тартынчаак, семиз козу – үркүнчөөк»,","«Кой каргышы бөрүгө жетпейт».","«Ат – эрдин канаты»."]},{"t":"h3","h":"<span class=\"pg\" data-n=\"52\">52<\/span>АКЫНДАР ПОЭЗИЯСЫНАН"}],"sub":[{"title":"ТҮШҮНДҮРМӨ СӨЗДҮК","b":15},{"title":"АКЫНДАР ПОЭЗИЯСЫНАН","b":27}],"pages":[49,52]},{"title":"ТОКТОГУЛ САТЫЛГАНОВ","blocks":[{"t":"h3","h":"ТОКТОГУЛ САТЫЛГАНОВ"},{"t":"img","src":"data:image/webp;base64,UklGRkoaAABXRUJQVlA4ID4aAACw4QCdASpyAb8BPrVQnUonLKmmr1Pb0ZAWiWltk5LDwkiD5fXiE53/HeAJAUcH8/XvSEMhK94eKv5F/lf/r/vdo5/n/yPT8s+crfMP/+el/4j/4a7kAFpameQCugNIJKSRFq5DkvzJawTYxjVtxmJ5Er+KDJHm0gT63NbEG5keRjHDKYzD0W2inAnv/LZk7HVFSeKYpZGb1bEseJ6Nzq+sz4P0y1H/8CtnOm1vqnW0oJ/OVypMFwkR5HHL6ye аа – ложное обвинение.","3 Устат – учитель, наставник."]},{"t":"p","h":"<span class=\"pg\" data-n=\"53\">53<\/span>Акындын «Беш каман», «Эшен-калпа» деген сатиралык, «Алымкан», «Гүлдөп ал», деген лирикалык, «Балалык», «Өмүр», «Карылык» деген философиялык ж.б. ырлары бар. «Кербез», «Жаш кыял», «Тогуз кайрык» ж.б. классикалык күү-обондору өтө алымдуу."},{"t":"p","h":"Токтогул балдарга арнап тарбиялык мааниси чоң «Санат», «Насыят», «Үлгү», «Терме» ырларын, «Балалык», «Тойпондогон жаш балдар», «Жетимдер жөнүндө» аттуу ж.б. кызыктуу чыгармаларын жараткан."},{"t":"p","h":"Акын Октябрь революциясынан кийин каза болду. Учурда ал жөнүндө даректүү фильмдер тартылып, пьеса, поэзия, проза чыгармалары жаралды. Райондун борборундагы, шаарлардагы көчөлөргө анын ысмы ыйгарылган. Бишкекте скульптуралык эстелиги тургузулуп, Кыргыз улуттук филармониясы анын атын сыймык менен алып жүрөт."},{"t":"p","h":"Силер, балдар, акындын «Балалык», «Жетимдер жөнүндө» деген ырларын окуп, анын балдар дүйнөсү жөнүндөгү ойлору менен таанышасыңар."}],"sub":[],"pages":[53,53]},{"title":"БАЛАЛЫК","blocks":[{"t":"h3","h":"БАЛАЛЫК"},{"t":"p","h":"Алтын жаак, жез таңдай"},{"t":"v","l":["Акын болгон Токоңдун","Башынан өткөн балалык.","Казал айткан бул сөзүм,","Элге калсын таралып.","Бир жашында билинип,","Кылыгы көзгө илинип,","Баланын жыты жыпардай","Дүйнөгө көзүң тигилип."]},{"t":"p","h":"башынан өткөн балалык – о его детстве элге калсын таралып – пусть распространится среди народа кылыгы көзгө илинип – замечается поведение (ребенка), детские игры"},{"t":"v","l":["1 Анык чебер – здесь настоящий (искусный) мастер","2 Өтө алымдуу – здесь народу популярен, любим.","3 Даректүү фильмдер – документальные фильмы.","4 Ысмы (ысымы) ыйгарылган – присвоено его имя."]},{"t":"p","h":"5 Балдар дүйнөсү (турмушу) жөнүндөгү – о жизни детей, о детях. 6 Алтын жаак, жез таңдай – здесь, мастер художественного слова, искусный словесник.."},{"t":"p","h":"7 Жыты жыпардай – благоухающий запах"},{"t":"v","l":["<span class=\"pg\" data-n=\"54\">54<\/span>Эки жашар кезинде","Күлдүн баарын чаңдатып","Чарчаганды билбестен","Басып жүрөт балалык.","Энесинен башкадан","Жат кишиче жалтанып","Качып жүрөт балалык.","Үчкө жашы чыкканда","Жыгылып туруп сүйүнүп","Алдыңан чыкса аталап.","Көтөрүп алып жыттасаң,","Чарчаганын билинбейт.","Бешке жашы чыкканда","Кайгы, капа ойлонбой","Жайнап турат балалык.","Алты жашка чыкканда","Алышып ойноп жаш балдар","Кыйын кызмат кылгансып","Чарчап келет алсырап,","Жааган күндөй бүркөлүп","Апасынан нан сурап.","Багалек түрүп жарышып,","Башы оогон жакка барышып,","чарчаганын билбестен – не","замечал усталости"]},{"t":"p","h":"жат кишиче – как чужой человек"},{"t":"v","l":["качып жүрөт – убегает","","сүйүнүп (сүйүнөт) – радуется","алдыңан чыкса аталап –","здесь радостно выбегает","навстречу"]},{"t":"p","h":"жайнап турат – здесь искренне радуется"},{"t":"v","l":["","кыйын кызмат кылгансып —","как будто трудились","чарчап келет (келишет) —","приходят усталыми","","Көпөлөк кууп «кон-кон» – деп,","Кумардан чыгып канышып,","Боз борбаштын баласын"]},{"t":"p","h":"Куш кылып таптап салышып"},{"t":"v","l":["Чегиртке жесе борбашы,","Кубанышат дарбышып.","Ар кимиси бир-бирден","Торпок менен эңишип","кумардан канышып – наслаждаются","боз борбаш – сорокопут","таптап – приучив","","1 Жалтанып – здесь пугливо, боязливо","2 Чарчаганың билинбейт – исчезает усталость"]},{"t":"p","h":"3 Кайгы, капа ойлонбой – здесь не зная горя, не думая о трудностях жизни."},{"t":"v","l":["4 Бүркөлүп – нахмурив брови (как пасмурная погода)","5 Башы ооган жакка – куда глаза глядят","6 Чегиртке – кузнечик"]},{"t":"p","h":"7 Кубанышат дарбышып (дарбып) – здесь радуются, шумят. 8 Торпок менен эңишип – устраивают состязания, сидя на теленках пытаются перетянуть друг-друга, свалить."},{"t":"v","l":["<span class=\"pg\" data-n=\"55\">55<\/span>Күлдүн баарын чаңдатып","Шиш менен жерди челишип","Томураңдап жаш балдар","Жетиге жашы чыкканда","Акактатып тердетип,","Чүлүк тагып мурдуна","Ак өпкө кылып курутуп.","Чатакташкан эмедей","Тебетей калып бир жерде,","Чапанын таштап унутуп,","Жаактан ылдый тер агып,","Башынан майын чыгарып.","Жоогазын менен мандалак","Казганына кубанып.","Кара суу кечип түрүнүп","Чыбыктан кесип ат минип.","Чымылдап чуркап күйүгүп","«Менин атым күлүк» деп,","Чыккандары сүйүнүп.","Кара баткак чаң кечип,","Тарам-тарам жарылып,","Балтырынан кан агып.","Ары-бери чуркашып,","Бир күндө он беш суу кечет.","Бирин-бири «жүр» дешет","«Кечээ көргөн чымчыктын","Балапанын алалык","Баарыбыз барып чоң сазга","Чегирткеге салалык».","Кандай кызык иштери","Кайра келбейт балалык.","Сегизге жашы чыкканда","Секирип ойноп жүрсө да,","Ойну канбайт балалык.","1 Чапанын – халат, верхнюю одежду","2 Түрүнүп – засучив свои (штанины)","3 Тарам-тарам – полосками"]},{"t":"p","h":"шиш менен жерди челишип – ковыряя землю колышками (острыми предметами)"},{"t":"p","h":"чатакташкан эмедей – будто поссорились жаактан ылдый тер агыш – по лицу (щекам) льется пот, вспотевшие,"},{"t":"p","h":"башынан – здесь от души"},{"t":"p","h":"чымылдап чуркап күйүгүп – бегают без устали, возбужденно кара баткак, чаң кечип – по грязи и пыли ары-бери – туда-сюда чоң сазга – в большое болото кайра келбейт – ни вернется, уйдет безвозвратно"}],"sub":[],"pages":[54,55]},{"title":"Жетимдер жөнүндө","blocks":[{"t":"p","h":"4 Балапанын алалык – возьмем птенцов (ее) 5 Ойну канбайт – здесь, не наиграются."},{"t":"v","l":["<span class=\"pg\" data-n=\"56\">56<\/span>Тогузга жашы чыкканда","Балалык саал токтолуп,","Үч жашар ойноо кездеги","Элестер калбайт жок болуп.","Онго жашы чыкканда","Балдар менен күн-түнү","Ойноп жүрөт оолугуп.","Он бирге жашы чыкканда,","Келин-кыздан чочунуп.","Он беш жашка барганда","Балалык кыял токтолуп!..","СӨЗДҮК","багалек- низ штанины."]},{"t":"p","h":"жок болуп (болот) – исчезает оолугуп (оолугат) – здесь весело, резво чочунуп (уялып)- здесь стесняясь"},{"t":"v","l":["Балдар ... түрүп, жарышууга камданышты.","... алышып, бой тирешип чалышып (фолькл.)","күлдүн баарын чаңдатып – здесь поднимая пыль

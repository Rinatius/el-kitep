ata-n=\"203\">203<\/span>жыйыштырып коюп, кол куушурат. «О, Манжы досум, – дейт Калматай,-кенулун түшүп кааласан, короодогу коюмду ал, өрүштөгү жылкымды ал, токою менен жерди алгын, илбээсинин жайнатып, толкуган Чатыр-Көлдү алгын». Мындай сыйга ыраазы болгон, алтын көрдө болсо көргө, ордо болсо орго кирүүгө маш болгон Манжы: «Мен өмүрү пайда менен байдан качкан эмесмин», – деп чын сырын айтат. Анан экөө биргелешип Жаңылдын таш талканын чыгармай болушат."},{"t":"p","h":"Ойлон. 1. Неликтен Калматай кыргыз жерин кыргыз душманы Манжы төрөгө бермей болот? Бул душмандын көктөн тилегенин жерден таап бергендик эле. Кул, күн, тулпар, шумкар, алтын-күмүш берсе болот, а жер берет деген эмне шумдук! Деги Калматайда кылчалык ар-намыс барбы? Же алжып калган немеби? Антейин десең, Жаңылга үйлөнгүсү келген дымагын кантесиң?"},{"t":"p","h":"2. Күчтүү душманга каршы калмактар менен өнөк болуп салгылашса, бир жөн. Калматай кыргыздын баатыр кызы Жаңылга каршы душман менен биригип, жаат курашы акылга сыярлыкпы? Жоо жакадан, бөрү этектен алып турган кезде кыргыз кыргызга каршы чыгыш үчүн душмандын колтугуна кирип, ага токою менен жерди, жер сулуусу Чатыр-Көлдү берип кошоматтанышы туурабы? Балким, туурадыр. Анткени ар кимде жеке мүдөө, жеке кызыкчылык деген бар да. Аларды элдин кызыкчылыгы үчүн садага чабыш керекпи? Жекече оюң кандай?"},{"t":"p","h":"3. «Әл четине жоо келсе, жан аяган жигитпи» дейт. Жанды мындай кой, жоого кошомат кылып, тоо-токойду бергенди ким дейбиз? «Жапыз да болсо тоом бар, тайыз да болсо суум бар» дейт, бул жакшы, ал эми ошолорду душманына берип койсочу?!"},{"t":"p","h":"4. Бети жок адам кандай болот? Алтын көрдө десе көргө, ородо десе орого кирген адам эпчил, жан сактоого бүйрө, тың, бардар жашайбы? Анда ага суктанса болот да."},{"t":"p","h":"Сунуш. Дилбаянды диалог түрүндө жаз. Сүйлөшкөн эки окуучунун бири Калматай менен Манжыны жактаса, экинчиси жамандасын. Бирок жүйөсү менен."},{"t":"p","h":"Тилге таек. «Өз агасын агалай албаган, бирөөнүн босогосун сагалайт». «Ата журтуң – алтын бешик». «Туулган жердин топурагы алтын». «Асманда жүргөн кыраан да түнөгүн көксөйт». «Жери байдын – эли бай». (макалдар)."},{"t":"h3","h":"<span class=\"pg\" data-n=\"204\">204<\/span>ТЕЙИТБЕК МЕНЕН КАЛМАТАЙ"},{"t":"p","h":"Ойго таек. «Курманбек» драмасында Тейитбек да – кыргыз элинин душманы. Корун менен дос болуп, анын кызы Шаазынды баласы Курманбекке алып бермекчи болуп кудалашат. Бирок Курманбек атасынын тилин албай, өзү жактырган Айганышка үйлөнөт. Атасы теңирден тескери кеткен уулуна каршыгып калат. Аңгыча Корун кыргыздарга кол салат. Эми Тейитбек эмне кылышы керек? Жоого минчи Телтору атты баласына бербейт. Оболу уулунун өлүмүн тилейт. Айганышка тетири бата берет."},{"t":"p","h":"Ойлон. Тейитбек менен Калматайда кандай окшоштук, кандай өзгөчөлүк бар?"},{"t":"p","h":"Сунуш. Ой толгоо түрүндө жаз."},{"t":"p","h":"Тилге таек. 1. «Миң ирет уулум болсо да, миң түркүн мүшкүл толсо да, бере албаймын атымды!» (Тейитбектин Чагырга айтканы)."},{"t":"p","h":"2. «Башыңдан балакет кетпесин, этегиң толорсугуңа жетпесин. Сокуну минип, сокбилегиңди камчыланып, туурдугуңду салынып, туткучуңду темингин. Ичериңе тамак таппай, куураган куу сөөктү кемиргин» (Келинине берген тетири батавы)."},{"t":"p","h":"3. Тилим жылан болуп Курманбек экөөңөрдү чаксын. Сенин чачыңды кыркып, жерге тикеңден каксын. Корундун болот найзасы Курманбектин жүрөгүн тешсин жаралап, булактай кочкул кара кан агып турсун салаалап. Кыргыздын кызы күң, катыны жесир болсун!» (Тейитбектин Айганышка айтканы)."},{"t":"h3","h":"ЫЙМАНДЫН КҮЧҮ"},{"t":"p","h":"Ойго таек. Чыңгыз Айтматовдун «Бетме-бет» повестиндеги Ысмайыл уурдаган уйдун этин үйгө алып келгенде, Сейде чочуп кетет. «Сен белең?» – дейт тамагы кургап. «Унчукпа ишиң болбосун! – дейт Ысмайыл, – заманаң бөрү болсо, бөрү бол, сен ачтан өлүп бара жатсаң, бирөө келип казаныңа аш салып бербейт. Алган алып, жулган жулат. Мен уурдайм, аскерден качып, ачтан өлөйүн деген эмесмин. Өлсө башка өлсүн, бирок мен жөн эле өлө калбайм. Әтти салып жегиле, сөөгүн көрсөтпөй жерге көмгүлө, уктуңбу?» Анан Ысмайыл чыгып кетет. Нес болгон Сейде отуруп калат. Чаташып, түрмөктөшкөн ойлор. Бир түндүн ичинде анын чачы агарып кетти. Әртеси колуна баласын көтөргөн Сейде атайы качкынды кармоого келген эки солдатка ууру күйөөсүнүн каерде жатканын колу менен көрсөтөт. Анан баласын көтөрүп, Ысмайыл жашынган жерди көздөй жөнөйт. Ок атылат. Мырзакул жарадар болот. Солдаттар да ок чыгарышты. <span class=\"pg\" data-n=\"205\">205<\/span>Каршы-терши учкан ок. Бала көтөргөн аял гана Ысмайылды көздөй баратат. «Ал азыр өлүмдү көздөй эмес, адамдын бийик касиети, адилеттиги үчүн баласын керилген көкүрөгүнө кысып, башын өйдө көтөрүп кетип бара жатты. Аңгыча болбой, нары камыштын арасынан боз шинели алама-жулама, бети башы сакал баскан киши секирип чыгып, мылтыгын кош колдоп өйдө көтөрүп, аялга калчылдап жүткүндү. Бетинен киргилт тер куюлган, капкара түнөргөн Ысмайыл Сейдеге жакындап, бетме-бет келгенде, көзү алачакмактанып, мурунку Сейде эмес, кандайдыр башка, кандайдыр өзүнүн укмуштуу күчүн, өз артыкчылыгын, адалдыгын билип, жалтанып койбостон, баласын көтөрүп, жылаңбаш аялдын маңкайып турганын көрдү. Сейденин жаш аралашкан көзүн бир карап, мылтыгын тээ тигиндей ташка жанчып ыргытты да, колун көтөрүп, мылтыгын сунуп келе жаткан солдаттарга корголоду»,-деп жазат жазуучу."},{"t":"p","h":"Ойлон. 1. Әмне үчүн Сейденин бир түндө чачы агарып кетти?"},{"t":"p","h":"2.Әмне үчүн Сейде октон коркпойт? Әмне, ага жин тийдиби?"},{"t":"p","h":"3. Аскерден качуу колунан келген, кошунасынын уюн уурдоо колунан келген Ысмайылдын эмне үчүн Сейдени атуу колунан келген жок?"},{"t":"p","h":"4. жалтанткан, мылтыгын ыргыттырып, кол көтөрттүргөн кайсы күч?"},{"t":"p","h":"Сунуш. Ой-толгоо түрүндөгү дилбаян жаз."}],"sub":[{"title":"Төртүнчү түрмөк","b":2},{"title":"Бешинчи түрмөк","b":8},{"title":"Алтынчы түрмөк","b":14},{"title":"ү: Капырай, акын эмес адам «Күн чыкты» деп эле","b":25},{"title":"Биринчи түр: Алым сабак сүйлөшүү эки окуучунун гана","b":30},{"title":"§ 32. ДИЛБАЯН Байытып баянда","b":35},{"title":"«НАМЫС» ДИЛБАЯНДАР ТҮРМӨГҮ","b":51},{"title":"3-дилбаян","b":61},{"title":"4-дилбаян","b":63},{"title":"«КҮЛЧОРОНУН КӨРГӨН КОРДУГУ» ДИЛБАЯНДАР ТҮРМӨГҮ","b":66},{"title":"1-дилбаян","b":69},{"title":"2-дилбаян","b":72},{"title":"3-дилбаян","b":78},{"title":"«БУЗУКУ» ДИЛБАЯНДАР ТҮРМӨГҮ","b":80},{"title":"2-дилбаян","b":84},{"title":"ЗАМАН ТАШ БООРБУ?","b":89},{"title":"МӘӘР ТӨККӨН АДАМ","b":93},{"title":"Эс алуу үчүн","b":99},{"title":"Дагы эс алуу үчүн","b":102},{"title":"КАЛМАТАЙ","b":111},{"title":"ТЕЙИТБЕК МЕНЕН КАЛМАТАЙ","b":119},{"title":"ЫЙМАНДЫН КҮЧҮ","b":126}],"section":"УП КЛАСС","pages":[194,205]},{"title":"§ 33. «САБАТ САНЖЫРАСЫ» ТОПТОМУ БОЮНЧА МАЕКТЕР Апенди кеп салат","blocks":[{"t":"h3","h":"§ 33. «САБАТ САНЖЫРАСЫ» ТОПТОМУ БОЮНЧА МАЕКТЕР Апенди кеп салат"},{"t":"p","h":"1. Маек (кыскача)."},{"t":"p","h":"2. Ар бир маек өзүнчө. Чакан текст."},{"t":"p","h":"3. Маектин ээси – сен экөөбүз. Мен сунуштайм. Сен улантып кетесин. Кантип? Маектин текстинин жазылышынын тууралыгын, катасын, кандай тыныш белгилери коюларын сен оозеки айтып бересиң – улантканың ошол."},{"t":"p","h":"Ул2у:"},{"t":"p","h":"Маектин тексти: Укулу тебетей кыздарга ылайык баш кийим. Анын төбөсү же баркыт же кыжым же чий баркыт же тукабадан шырылып жасалат."},{"t":"p","h":"<span class=\"pg\" data-n=\"206\">206<\/span>Окуучунун жообу: Бул текстте төмөндөгү каталар бар."},{"t":"p","h":"1. Үкүлү эмес, үкүлүү. 2. «Тебетей» деген сөздөн кийин сызыкча коюлат. 8. «Баркыт», «кыжым», «чий баркыт» деген сөздөрдүн ар биринен соң үтүр коюлат."},{"t":"p","h":"Ме 1 Ит эдигейдин алаканындагы татыны жалап алып кырсылдата чайнап жиберди да үмүтөнө көзү жалжылдап, шыйпандай туруп калды."},{"t":"p","h":"№2 – Эй иничек деп кайрыла калды тиги төөгө көз сала турчу бала бакыра бейбаштык кылбасын."},{"t":"p","h":"№3 – Бул ишиң иш эмей эле башыңа түшкөн мүшкүл экени бир көргөн көзгө көрүнүп туру эдигей. Мындай ишке али тыңый элек турбайсыңбы."},{"t":"p","h":"№ 4 Мунун эмнеси күлкү деп казангап түнөрө түштү ачусунан эриндери титиреп кети."},{"t":"p","h":"№5 Кеде гана болбосо мынчалык ачуланчы эмес айрыкча боор эти менен тен керген эчтемеден кор кылбай окутупчокуткан чон киши болот деген умуте журген улуна минтип катал сүйлөп ачуланбаса керек."},{"t":"p","h":"№ 6 Бери кара сабитжан мен өз алыма жараша өз ишим бар, карабайыр кишимин. Башка жумушка киришпеймин. Бирок билип кой сени өз мээң менен түшүндү го дечи элем. №7 Койчу Казаке. Качандыр бир өткөнгө."},{"t":"p","h":"—Кеп ошондо. Байлыгынды алып койсо өлбөйсүң эптеп күн көрүп кетесиң. А эгер абийиринди тепсеп салышса аны эч ким кайра тазарта албайт."},{"t":"p","h":"№ 8 —Казаке болду го паровозго кирип отура туралы күн ырайын күтөлү деди тонуп калган кол каптарын бири-бирине ургулап."},{"t":"p","h":"<span class=\"pg\" data-n=\"207\">207<\/span>—Кун ырайы ушу турганы турган. Жүр күрөктөйлү бекер турушка акыбыз жок."},{"t":"p","h":"№9 Эй Абуталип жолдон чык! Сен эмне дулей болуп калгансынбы деп кыйкырды эдигей. Абуталип унчукпады."},{"t":"p","h":"№ 10 Эгер улу кокус бир себептен тиру кылып айдар кекулдер аны манкурт кылып койгон болсо анда улу адам эмей эле адам- ‚ дын сеелекету болуп калды да (1-10-маектер Ч. Аатматовдон)."},{"t":"p","h":"№11 Каны кызуу жаштар бар дайым шашма алпарып алтын башын урат ташка деген Фирдоуси."},{"t":"v","l":["№ 12","В. Франклин тамчыдан таш тешилет деген.","№ 13"]},{"t":"p","h":"Талбас эмгек деген М.В. Ломоносов тоодой тоскоолдукту женет."},{"t":"p","h":"№ 14 М.Сервантес келген бакыты кармай албаган кеткен бакытка екунбешу керек деген."},{"t":"v","l":["№ 15","Абай мындай деген жаман жолдош келеке.","№ 16"]},{"t":"p","h":"Абдылас Малдыбаев уч жуздей чыгарма жараткан. Ажал ордуна драмасынын Айчурек Манас операларынын музыкасын жазышкан."},{"t":"p","h":"№ 17 Узакбай Абдукаимов Майдан романын жазган А.С. Пушкин, А.П. Чехов, М.Горький, А.А. Фадеев жана башкалардын чыгармаларын кыргызча которгон."},{"t":"p","h":"№ 18 Айдаралы Жергелек комузчу ырчы куудул. Курманбек Кожожаш сыяктуу кенже дастандарды айткан. Ар бир аткарган куусунун ыргагына жараша кебете кешпирин кубултуп төбөсүнө топусун ойнотуп куудулданган."},{"t":"p","h":"<span class=\"pg\" data-n=\"208\">208<\/span>№ 19 Гапар Айтиев чабандар Ысык кел кыргыз денизи деген суреттеру учун 1960-жылы токтогул атындагы мамлекеттик сыйлыкка татыктуу болгон."},{"t":"p","h":"№20 Алиев Осмонкул партиялык жана мамлекеттик ишмер. 1924—26-жылдарда эркин тоо гезитинин 1926-жылы коммунист журналынын редактору болуп иштеген."},{"t":"p","h":"№ 21 Атаке баатыр XVII-кылымдын 2-жарымында Чуй ереенүндөгү Сарбагыш уруусун бийлеген бий. Ал 1785-жылы Россияга элчи жиберген."},{"t":"p","h":"№ 22 Ахунбаев Иса кыргыз окумуштуусу хирург. Академик илимге эмгек сиңирген ишмер. 1959-жылы орто азияда биринчи жолу жүрөккө операция жазаган."},{"t":"p","h":"№23 Балбалдар көчмөн түрк уруулары мүрзө үстүнө койгон таш айкелдер. Бийиктиги 1—4 метр. Ал алтайда Түштүк сибирде Таласта Чүй Ысык-Көл өрөөндөрүндө көп кездешет. № 24 Барсбек 8-кылымдагы Кыргыз каганы. Чыгыш Түрк каганынын баскынчылыгына каршы күрөшүү үчүн Әрен-Улуг деген элчисин Тибетке жиберген. 711 жылы түрк каганы Капаган Көгмөндү ашып кыргыз ордосуна капысынан кол салып ошол согушта Барсбек курман болгон."},{"t":"p","h":"№ 25 Никита Яковлевич Бичурин (1777-1853) чыгыш таануу илимине чоң салым кошкон Россиялык окумуштуу. Ал кытай тилиндеги даректерди орусчага которгон. Анда байыркы жана орто кылымдагы кыргыздар хунну динлин уйгур карлук түргөш моңгол ж.б. жөнүндө маалыматтар бар. № 26 Бурулча Осмонбек кызы (1836-1916) айтылуу темир комузчу. Ал турумтай булбул тактеке Керме тоо деген күүлөрдү аткарган. Өзү да селкинчек кош кайрык Бурулчанын күүсү <span class=\"pg\" data-n=\"209\">209<\/span>деген күүлөрдү чыгарган (16-26-маектер, «Кыргыз тарыхы» энциклопедиялык сөздүгүнөн кыскартылып алынды). № 27 Көк өзөн боюнда адам байырлаган жалгыс дарак ушул чоң түп шаатыт. Жерге сойлоп чөгүп жаткан кызыл нардын мойнундай ийри ноодаларынын шагы калың түбү жайлуу көлөкөлүү. Жел болсо болбосо башына майда толкун жүрүп балыгы үркөн көлдүн бетинде жыбырап көйкөлүп дайыма акырын шыбырлап турар эле."},{"t":"p","h":"№ 28 Сарыбай сейрек сары сакалдуу көзүнүн үстү кабарчыктаган эти жука киши эле. Кебези тайыз кашкары чапанды саймалуу сары кең чалбарга шымданып койгон. Бутунда тумшугу нукчуйган кан өтүк. Колунда күмүш камчы. № 29 – Бекерчи болсоң мына жакында тарум баш алат келип тару корушсаңчу деп Теңирберди абышка тамаша сөз жиберип кызыл ээк оозун ачып, кыкылдап күлүп калды – Буркүтүңдү үксөйтүп тыттын башына кондуруп койсоң болду ошондо эле чымчык атпай бу чөлкөмгө жолобой калат! № 30 Сарыбай кулуп ал дагы тамашага жараша жооп кылды. А бу буркутумдун тырмак акысы кандай болор экен Тенирберди аке?"},{"t":"p","h":"№ 31 Тенирберди ыкчам туруп акчыл булуттай сур сулесунду тумшугунан силкти бойу менен тен болуп куйругу же чийип кумуш кылкандары сеңселе түшүп тери дагы көркүнө чыга түштү."},{"t":"p","h":"– Тебетейге чоңдук кылат. Муну ичике жакка кылдырсам болчудай (27-—31-маектер Т. Касымбековдон)."},{"t":"p","h":"Бир философ төрт аяктуу арстанга караганда эки аяктуу арстан коркунучтуу келет. Андан эки эсе сак болуш керек деп өз падышасына тийиштире сүйлөптүр."},{"t":"p","h":"№ 33 —Бай болуу менен акчасы кеп болуу экее эки башка нерсе болот дейт Диоген-Колунда болгонуна каниет кылган киши <span class=\"pg\" data-n=\"210\">210<\/span>чыныгы бай. Өзү тойсо да көзү тойбогон сугалак адам каниет кылган адамдан жардылык кылат."},{"t":"p","h":"№ 84 Чөптүн тамырын жеп жаткан Сократты көрүп бир киши биздин бекке кызмат кылсаң чөптүн тамырын жегенге чейин барбайт элең, десе, ал чөптүн тамырын жеп көрсөң бекке малай болууга чейин барбайт элең деп жооп бериптир. Ме 85 Аристотелден көпчүлүктөн сенин эмнең артык деп сураганда, ал мен жашоо үчүн тамактансам алар тамактануу үчүн жашашат дептир."},{"t":"p","h":"№ 86 Бир акылмандан эмне үчүн досту душман кылуу оңой да душманды дос кылып алуу өтө эле кыйын деп сураганда, ал мындай жооп бериптир үйдү кыйратуу оңой, куруу кыйын; идишти сындыруу жеңил, кадоо кыйын; акчаны жасоо оңой, табуу кыйын!"},{"t":"p","h":"№ 87 Бир акылман мындай деген экен сырты суук кийген жупуну адамдардан жийиркенбей жүр. Адамдын ички сымбаты сырткы сымбатынан жогору турат да көзгө көрүнбөйт көкүрөккө сезилет. Алтынды жараткан таш акылды жараткан баш."},{"t":"p","h":"№ 88 Бирөө кылган ишин талдай билген адам кетирген катасын тез оңдой алат деген экен."},{"t":"p","h":"Бир адам акмак киши башкалардын жаман жагын көрүп жакшы жагын байкабайт. Андай адамдар жоорго конгон чымын сыяктуу ыплас чөйрөгө ынак болот дептир."},{"t":"p","h":"№ 40 Бир акылман сууну сине турган жерге тек эгинди ене турган жерге эк сезду уга турган адамга айт жакшылык биле турган кишиге жаса дептир (32—40-маектер «Залкар ойлор» китебинен алынды))."}],"sub":[],"section":"УП КЛАСС","pages":[206,210]},{"title":"§ 34. КЕМЧОНТОЙДУН КӨЧҮРҮП АЛГАНДАРЫНАН","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"211\">211<\/span>§ 34. КЕМЧОНТОЙДУН КӨЧҮРҮП АЛГАНДАРЫНАН"},{"t":"p","h":"(Максатың: катадан арылтып көчүрүү)"},{"t":"h3","h":"Жетинчи жат жазуу РЫСПАЙДЫН ЫР САРАЙЫ"},{"t":"p","h":"Рыспай 2 класста окуп жүргөндө, чайыр курайдан комус кылып ага атын куйругунан кыл тагып, чыңкылдатып чертип кирет. Айылда Пазыл деген агайынын эле комузу боло турган. Баягы чайыр комуска алымсынбай анын үйүн канча имерчиктеди. Ошентип 5-класста кадыресе чертип калды. Атаганат аккордионго алдырбаганда, андан чоң комусчу чыгары кол шилтегенинен эле көрүнүп турчу. Анан кенчилердин ооз кыягын гармошкасын балалайка мондалинин канча аңдыды. Көзүнө көрүнгөн ар бир аспап бейиш төрүнө баратканда кыркалекей тизип койгон азгырма сыяктуу улам-биринен бири кызык көрүнө берди. Өздүк көркөм чыгармачылыгында алдына ат салдырган жок. Рыспайда бары бар эле, ыр жазчу (Алмашымды эстеңиз), колу сулуу эле, сүрөт тартчу мектептин кереге гезити ансыз чыкчу эмес. Спорт оюндары дегенде жантыгынан жата калчу. Ошолордун ичинен обондун азгырыгы барын басып кети. Әл акыны Сооронбай Жусуев Рыспай Абдыкадыровду билбеген бир да кыргыз жок. Ал өзүнүн ышкылуу жүрөгүнөн чыккан укмуштай мукам ырлары аркылуу элибиздин калың катмарына сиңип кеткен улуу ырчы болучу. Андай зор таланттуу ырчылар дүйнөгө чанда гана келет деп эскерген."},{"t":"p","h":"«Әх, чиркин дейт Әрнис Турсунов өтүп бараткан өмүрдү токтотуп калган жарк эткен жаштыкты кармап калган ар качан аруулуктун кучагында жаткан асыл адамдар музыка дүйнөсүндө. Орус айымы Клавдия Шульженкону азербайжан булбулу Рашид Бейбутовду казак композитору Шамшы Калдаяковдун музыкасын уканда, кандай лаззатка батсак, Рыспайдын мукам абазын уканда ошондой жыргалга балкыйбыз. Тил менен айтылгыс рух дөөлөтү ушу эмеспи. Турмуш ушунусу менен улуу»."},{"t":"p","h":"Рыспай Абдыкадыров жүрөктүн тунук сезимдеринен алтындай уютулган шаңкайып алыстан көрүнгөн жана кылымдарга урабай турган сарайын көзүнүн тирүүсүндө тургузуп койгон. Мукам кайрыктардын ширесунен бүткөн сары алтындай тулку бою эчак өзүнө ээ болбой, өмүрү ырга айланып кеткен."},{"t":"p","h":"«Кыргыз Туусу» гезити"},{"t":"h3","h":"<span class=\"pg\" data-n=\"212\">212<\/span>Сегизинчи жат жазуу ИШЕНАЛЫ АРАБАЙ УУЛУ"},{"t":"p","h":"Кыргыз элинин революцияга чейин ичкери шарларга барып билим алган бирди жарым интелегентери болгон. Ошондой интелегентердин бирөө Ишеналы Арабай уулу эле. Ал башталгыч мектептин көлөмүндө билим алгандан кийин 1900 жылдан 1910 жылга чейин айыл кыштактарда мугалим болуп бала окутат. 1910 жылдан 1918 жылга чейин Уфа шарындагы «Медресе Галия» аттуу жогорку мартабалуу диний мектепте окуган. И. Арабаев Сарсикеев деген казак студент менен бирдикте кыргыз жана казак балдарына арнап «Алиппе жаки тете окуу» деген китеп жазып аны 1911 жылы Уфа шарындагы «Шарк» басмасынан арап тамгасы менен чыгарат. Ал жалпы көлөмү 52 бетен турган чакан китеп. Бул балдарга тез кат таныта турган элге кеңири белгилүү китеп болгон. Анда айдын атары сан сөздөр малдын жашы жапайы айбандардын аты боз үйдүн жабдулары чөптөрдүн жыгачтын идиши аяктын атары казакча да кыргызча да берилген. Макал лакаптар кара сөз менен жазылган тамсилдер да бар. И. Арабаев «Жазуу өрнөктөрү» деген китепчесин 1912 жылы чыгарган. Ал 1922 жылы Манас жомогун эл озунан жыйнатуу ишинин демилгечиси болуп атактуу жомокчу Сагынбай Орозбак уулунун озунан жаздыруу ишин уюштурган да жазып алууну Каюм Мифтаковко тапшырат. Анын жазганын текшерип көрүп кыргызча таза жаза албайт экен деген чечимге келет да ал ишти Ыбырайым Абдыракман уулуна тапшырат. И. Арабаев революцияга чейин Тыныбек жомокчунун озунан Семетейдин Айчүрөккө үйлөнгөн жерин жазып алган экен ал 1925 жылы Москвадан чыкан. 1924 жылдын 7-ноябрында Әркин тоо газетасынын биринчи саны жарык көрөт. Анда И. Арабаев: «Эзелтен бери кыргыз элинин саргарып зарыгып алдыдан күткөн үмүтү эркиндик теңдик болгон эле... г"},{"t":"p","h":"Мына эми кыргыз элинин көптөгөн күткөн эркиндиги өз колуна тийип эрктүү автономиялуу облус өзүнчө мамлекет болуп түтүн булатып отурат. Ошондуктан газетанын атын Эркин тоо койдук», – деп белгилеген. 1924 жылы И. Арабай уулунун жаш балдарга арнап жазган «Кыргыз алиппеси» Ташкент шаарынан басылып чыгат. 1925 жылы колдонмо иретинде Саамалык деген китепче жазып, анда он бир сабактын үлгүсүн берген. 1928 жылы И. Арабаев менен К. Карасаев латын тамгасында Жаңылык атуу алипе түзүшкөн."},{"t":"p","h":"<span class=\"pg\" data-n=\"213\">213<\/span>Ал әң мыкты окуу куралы болуп сабатсыз элдин сабатсыздыгын жоюуда эбегейсиз зор кызмат кылган. И. Арабаев кыргыз интелегентеринин ичинен караансыз бөлүнүп чыгып, эл тагдырын ойлоп, анын келечеги үчүн кам көргөн элди агартсам-көгөртсөм дегенде ичкен ашын жерге койгон алдыңкы катардагы агартуучу болгон..."},{"t":"p","h":"З. Бектенов"},{"t":"p","h":"Тогузунчу жат жазуу"},{"t":"h3","h":"ХХЇ-КЫЛЫМ КАНДАЙ БОЛОТ?"},{"t":"p","h":"Мен ийгилике жетишүүнүн үч негизги факторун бөлүп көрсөткүм келет."},{"t":"p","h":"1. Билим дүйнөсү. Биз жашап жаткан дүйнө тулкусу ажырагыс, антсе да үч нерсе: табият дүйнөсү адам дүйнөсү мүлк дүйнөсү айрыкча айырмаланып турат. Бирок дагы бир езгечөлүү улам барган сайын чечүүчү да таасирдүү да дүйнө бар. Ал – билим дүйнөсү. XX кылым атомдун, космостун кылымы болду. Ал эми келерки кылымда мамлекетер табигый байлыктар үчүн эмес ириде информациялык көзөмөл жүргүзүү үчүн күрөшөт деп айтышкан илимпоздордун пикирин пайгамбарчылык деп эсептейм. Информациялык революция жаңы гана башталды. Алдыдагы басар жолубуз – информациялык магистраль. Магистраль алдыбызда учу кыйырсыз чалкыган малыматар деңизин ачып берет. Биз аны кайсы малда кайда болбойлу, каалаган учурда пайдалана алабыз. Мындан ажайып келечек мүмкүнчүлүктөрү комдун баардык тармактарын каї ї жаңыртып жасоого кеңири түрткү болору шексиз. Мындай революциялык толкун улам барган сайын көптөгөн адамдарды кучагына алып, коомду ылдам илгерилетет."},{"t":"p","h":"2. Рухий байлык, ыйман, адеп-ахлак. Рухий байлык, ыймандуулук ХХЇ-кылымдагы ийгиликтерге жетүүнүн экинчи катмары. ХХЇ-кылым гуманитардык маданиятын да кылымы болуга тийиш. Аристотель жазган экен «Ким илимде алдыга кетип, бирок ыймандулугу кем болсо, ал алдыга караганда көбүрөөк артка кетет». Дүйнө билим менен эле чагылбасы эчактан эле белгилүү. Дүйнөнүн абийири болот, ошондой эле дүйнөнүн сулулугу бар. Сулулук – бул береке ички таза рухий азык. Сулулук – бул ыймандуулук."},{"t":"p","h":"З. Әмгек – келерки кылымдагы ийгиликтин үчүнчү шарты. Улуу адамдардын бардыгы ашкере эмгекчил жан бол- ‘тон. Талант – кудайдын берген ырыскысы. Бирок эмгексиз <span class=\"pg\" data-n=\"214\">214<\/span>талант бат өчөт. Техниканын улуу жаратманы ойлоп табуучу Томас Әдисон укмуштай эмгекчил болгон. 50 жашка чыканча суткасына 19,5 саат андан кийинки жылдары 18 сааттан иштеген. Дайыма уйкунун кыскасы эч качан зыян эмес деп кайталап той тамашаны жек көрчү экен. Бул гений электр-техника илиминде электр лампасындагы чыңалууну жаратып энергия өндүрүшүндө революция жасаган. Телефон телеграфты өркүндөткөн."},{"t":"p","h":"М. Акаева Онунчу жат жазуу"},{"t":"h3","h":"АЯЛ ӘРКЕКТИН КАБЫРГАСЫНАН ЖАРАЛГАНБЫ?"},{"t":"p","h":"Угуп, окуп жүргөн чыгарсыңар, жети миң жыл илгери азыркы Ирактын жергесин шумерлер ээлей башташкан. Илим билим жазуу ошолордон таралган деп жүрүшпөйбү окумуштуулар. Археологиялык казуларда табылган карапа табличкаларга караганда шумерлердин бейши жөнүндө поемасы болгон. Ошол поемада Энки деген кудай кызматкери Исмуддун азгыруусу боюнча кереметтүү өсүмдүктү жеп коюп кабыргасынан катуу кагынан. Шумерлер кабырганы «ти» дешкен. Ооруну Ник-ти деген аял кудай айыктырат. Ал эми Ник-ти – кыргызча которгондо «кабырганын мырзайымы» деген мааниде. Ошентип ар кандай себептерге байланыштуу шумерлер жер үстүнөн жоголгону, карапа табличкалардагы поемалар урандылардын алдында калганы менен алардын бейиш топон суу тозок жөнүндөгү мифтер тегерегиндеги хананейлерге, ассириялыктарга, вавилондуктарга озеки өтүп өзгөрүп турган. Алар нечен кылымдардан кийин калыптанган еврейлердин «Тооротуна» да жаңы редакцияда кирген. Ошентип Энкинин кабыргасын аял кудай айыктырганы жөнүндөгү миф каңырыштан жаңылыштыктан улам жаңы мани маңызга өтүп Адамдын кабыргасынан Еванын жаралышы жөнүндөгү окуяга айланган. Анын себебин элге түшүндүрүү керек болгон учурда байыркы шумерлердин мифин анын кандайча, өзгөргөнүн билбеген еврейлер акылга салып, кудай.«аялды Адамдын денесинин катылуу бөлүгү болгон кабыргасынан жаратайын, аял жупуну жана уялчаак болсун» деп чечкенин ойлоп чыгарышкан. Аны биз археологиялык казуларда табылган карапа табличкалардагы поемалар окулгандан кийин билдик. Адамзаттын мифтери урдалбайт элден элге кылымдан кылымга өтүп башка элдерге жугушат. Акыл жугушары жөнүндө накыл ошондон калган. Диндин ыйык китептердин бары ошондойчо жаралган. Алар адамзатын тарыхы акыл казынасы. Т. Насирдинов"},{"t":"h3","h":"<span class=\"pg\" data-n=\"215\">215<\/span>Он биринчи жат жазуу ТИЛДИН КӨРӨҢГӨСҮ"},{"t":"p","h":"Тил уюган кенч. Уйуган чын. «Жек көрөм», «жек көрүндү» өңдүү туюмдарды алсак мында «жек» орусча «ненависть» деген маанини билдирет. Бул «жек» сөзүнүн түп маниси эмнеде? Көрсө «шайтан» деген сөздү кийинки кылымдарда башка тилден кабыл алыппыз. Ага чейин «жек» деген сөздү колдонуп келиптир. Аны кантип далилдөөгө болот?"},{"t":"p","h":"Мындан миң жыл мурда жазылган Махмуд Кашгарынын Диван лугат Ат түрк деген сөздүгүнөн «Биллиш йек билмезүк кишиден йаг» («Билбеген кишиден билген шайтан ийги») деген макалды окуйбуз. Анан «жек» сөзү ал кезде «шайтан» манисинде колдонулганына ынанабыз. Ал эми «От тесе агыз күймөс», «Агыз йесе көз уйазар», «Инен инресе боту бозулар», «Нече ийтик бычак эрсе, өз сабын йонумас», «Күзөкү узун болса, элик күймөс» азыр От дегенден ооз күйбөйт Ооз жесе, кол уялат Инген ынгыраса, бото боздор, Бычак канчалык курч, өткүр болсо да өз сабын жонбойт, «Көзөө узун болсо кол күйбөс» болуп өзгөрүп кеткен. Ооба тил токоюн араласак сөздөрдүн кептердин туюмдардын не бир башатына урунабыз. «Качыш болсо, кая көрү кайда» деген эмнеси? Баарынан да «кая» дегени кандай? – дейт бирөө. «Кая» деген сөз азыр бизде «кыя» болуп айтылат. Качкан адам кыяны карап турмак беле? деген ой айтылган экен го деп алиги өзүнө өзү канийет кылат."},{"t":"p","h":"Ооба тилдин көрөңгөсү кече эле уйуп калган эмес. Ал тээ байыртадан бери ар кимдин жүрөк башына конуп келет. Анан сайраган булбулдай үн салат. Куру кашык ооз жыртат, кургак сөз кулак тундурат дейбиз. Аныбыз миң жылдар мурун айтылганбы? Айтылган. «Курук кошук агыза жарамас, куру сөз кулакка йакышмак» болуп. Биз «кургак сөз кулак тундурат» деп сезимдин ашусунан ары өтө албаган кепке кейиш кылсак миң жыл мурункулар деле ошентчү экен."},{"t":"p","h":"Ж. Мукамбаев"},{"t":"h3","h":"Он экинчи жат жазуу 1. КИМ КҮНӨӨЛҮҮ?"},{"t":"p","h":"Кайра куруу башталганда, баары сындай баштаган. Бирок кемчиликтерди жойунун жолун эч ким айткан эмес айта албай коюшту. Ар бир улуу мун өзүнөн кийинкилер үчүн жооптуу. Биз жаштарды күнөөлөйбүз. Туура эмес. Өзүбүз күнөөлүбүз. Азыр күнөөлөгүдөй баягы Кокон хандыгы жок, <span class=\"pg\" data-n=\"216\">216<\/span>Москва жок, КПСС БК жок. 60 жаштагылар туура эмес кылса 10 жаштагылар күнөөлү 40 жаштагылар туура болбосо 50 жаштагылар күнөөлүү."},{"t":"h3","h":"2. КООМДУ САКТООЧУ КҮЧ"},{"t":"p","h":"Баланы башка урбайт жылкыны качы менен башка чаппайт. Күл дөбөгө баспа эртең менен күн менен кошо тур күндүн эң биринчи нурлары бакыт чачат ошол нурлардан бакыт ал анан сууга түкүрбө..."},{"t":"p","h":"Кадимки эле арыктагы суулар кандай таза акчу эле. Әл коомдун жашоо шартын мурун таза кармаган. Ошондо 30— 40 пайызы дин аркылуу келсе да 60 пайызы ислам христиан диндеринен мурда эле калыптанып калган. Кыргыздар мусулман динин эң кеч кабыл алган. ХЇ1Ї—-ХГ\\V кылымдарда – Энесайда жүргөндөн бүгүнкү күнгө чейин келинди отко киргизүү алас аластоо бешике салуу сыяктуу салттары болгон. Динчил болбосок да сакталып келгенбиз. Себеби ыймандуу салтыбыз күчтүү эле кыргыз кандыкты кармаган эл болгон Демократия башталгандан бери канча мыйзам кабыл алдык? Ошол мыйзамдардын көбү иштеген жок а коом коом болуп сакталып атпайбы! Эмне үчүн? Себеби коомду кармаган үрп адат каада салт. Мисалы мыйзамсыз эле өлгөнгө топурак салабыз алыш-беришке каташабыз тууган уруктарга барабыз. Демек бизди коом кылып кармап турган – каада салт үрп-адат нарк-насил рухий байлыгыбыз."},{"t":"p","h":"Д.Сарыгулов"},{"t":"h3","h":"ТАШЫМАЛ БЕЛГИСИ МЕНЕН КӨЧҮРҮҮ"},{"t":"p","h":"Үл г ү: Төр-дөн орун тий-ген бол-со наа-дан-га, ула-га-да кал-га-ны-ңа ар-дан-ба."},{"t":"v","l":["1. Окуу – билим, акылдуу акыл курап,","Билимдүү ойдогусун кабыл кылат.","","2. Билимдин маанисин бил, айтканын ук,","Акыл ал, ар балээден кутулуп чык.","","3. Илим менен билимге көпүрө – тил,","Көкөлөткөн адамды тили деп бил.","<span class=\"pg\" data-n=\"217\">217<\/span>4. Тил адамды бакытка бөлөп салат,","Тил адамды шорлотот, башын алат.","","5. Тил арыстан босогоңдо комдонгон,","Бошоп кетсе – өзүңдү да жеп койгон.","","6. Сөздү карма, башың кесип салбасын,","Тилди карма, тишиң сынып калбасын.","","Т. Көп сүйлөбө, а көрөкчө так сүйлө,","Түмөн сөздүн оң мааниси – бир сөздө.","","8. Өмүр кыска, туулган соң өлмөк бар,","Жакшы сөздөр тү атып, Жамийла бир убакта алдыда бара жаткан Даниярга кыйкырды (Ч. Айтматов). 5.-Трактор айдоо кыздардын иши бекен? – деди Асан, Айсулуунун муну-"},{"t":"v","l":["сун жактырбай. 6. – Тос тигини,— деди бала, чөгөлөп айран","ичип жатып (Мисалдар А. Турсуновдун «Кыргыз тилинин тыныш","белгилери» деген китебинен алынды)."]},{"t":"p","h":"Үл г ү: Көчөдө оюн менен алаксып, Жеңишбек кеч кир-"},{"t":"v","l":["генин байкабай калчу.","","23. Айрым сөздөрдүн үтүр менен жазылышы","","«КАРГА ТЫРМАК» кештеси"]},{"t":"p","h":"М.: Кана, өзүң айтчы? Кана, Ымаке, кечиктик."},{"t":"p","h":"1. Ыя, сен кайсы элчи элең?"},{"t":"raw","h":"<h4 class=\"mk\">ыы | | КҮ \\ | ү,<\/h4>"},{"t":"v","l":["2.Ыя, кайсы Ыманбайсын? 3. Жок, бул иш сенин колуңан келбейт.","4. Жок, мен али көңүлүмдөгүнү таба","5. Ме, менин калпагымды кийип ал. 6. Ме, элекмин, иштин баары алдыда.","муну алып кой. Мейли, эмне десе","ошо дешсин.","7. Оз убалы өзүнө, мейли, тим кой.","8. Мына, кимисинен болсо да, сураңыз!","9. Ана, Ормуштун үнү чыкты.","10.Тигине, жаман кулпуну сууруп алып","кетиптир.","11. Кой, деги эл укпасын!","12. Эмне, биз барсак болбойт бекен?","(Мисалдар А. Турсуновдун «Кыргыз тилинин","тыныш белгилери» деген китебинен алынды).","","Айрым кана, ыя, жок, ме, мына, ана, тигине,","кой, эмне деген өңдүү сөздөр кээде сүйлөм мүчөсүнүн"]},{"t":"p","h":"милдетин аткарбай, обочолонуп айтылат да, киринди сөз сыңары үтүр менен ажыратылып жазылат. Эгер алар сүйлөм мүчөсүнүн милдетин аткарса, анда үтүр коюлбайт. М.: – Толгонай, сенин анда күнөөң жок. Жок – сүйлөмдүн баяндоочунун милдетин өтөдү."},{"t":"p","h":"<span class=\"pg\" data-n=\"223\">223<\/span>252-көнүгүү. Кана, ыя, жок, ме, мына, ана, тигине, кой, эмне деген сөздөрдү катыштырып, өз алдыңча ар бир сөзгө экиден сүйлөм түзгүлө."},{"t":"p","h":"Үл г ү: Ана, ушундай болмок! Әч кимге айтпа, кой, өзүнөн калсын."}],"sub":[{"title":"§ 35. «САБАТ САНЖЫРАСЫ» ТОПТОМУ Билесиңби?","b":2},{"title":"1. Кештенин атын ата","b":4},{"title":"П. Бул кеште кайсы жазуу эрежесин туюндурат?","b":7},{"title":"ү: «Кыял» кештеси сырдык сөздөрдүн жазылышын","b":11}],"section":"ЇХ КЛАСС","pages":[218,223]},{"title":"24. Кыстырынды сөз менен кыстырынды сүйлөмдүн","blocks":[{"t":"h3","h":"24. Кыстырынды сөз менен кыстырынды сүйлөмдүн"},{"t":"h3","h":"жазылышы"},{"t":"p","h":"«ИЛ – БИРС» кештеси"},{"t":"p","h":"Жазылып жаткан тексттеги ойду толуктоо, тактоо жана эскерте кетүү зарылды-"},{"t":"raw","h":"<h4 class=\"mk\">ые ж |/ \\ эс<\/h4>"},{"t":"p","h":"сөз же сүйлөм киргизилет. гына жараша кыстырынды Жазуу учурунда мындай кыстырынды сөз же сүйлөм кашаага алынат."},{"t":"p","h":"253-кенугуу. Көчүрүп жаз да, кайсынысы кыстырынды сөз, кайсынысы кыстырынды сүйлөм экенин ажыратып айтып бер."},{"t":"p","h":"1. Әл ичинде кадырман Какем (Карымшак) Саадатты жактап өттү. 2. Әлементтердин валенттүүлүгүнүн чен бирдигине водороддун (суутектин) валенттүүлүгү кабыл алынган."},{"t":"p","h":"3. Кызы (анын аты Бермет эле) балача бышылдап, жайбаракат уктап жатат. 4. Бакма жаныбарлардан биз азыктүлүктөрдү (эт, сүт, жумуртка), кийимдерди тигүү үчүн материалдарды (жүн, табигый жибек, мех, булгаары) алабыз."},{"t":"p","h":"5. Айрым учурда (өзгөчө жаан-чачында) от жакшылыктуу күйбөйт. 6. Илгери бир жолу барганымда (ал кезде эжебиз Даанакан тирүү), Алымбай чуркап жүргөн бала эле (Мисалдар А. Турсуновдун «Кыргыз тилинин тыныш белгилери» деген Олд китебинен алынды.)."},{"t":"p","h":"Драмалык чыгармадагы ремарка (сүйлөөчүнүн жүрүш-турушу, кылык-жоругу ж.б."},{"t":"p","h":"<span class=\"pg\" data-n=\"224\">224<\/span>жөнүндөгү автордун түшүндүрмөсү) кашаага алынып жазылат."},{"t":"p","h":"254-кенугуу. Төмөнкү текстти үлгү катары эсинде сакта, ант-"},{"t":"v","l":["кени пьеса-дилбаян жазууда ушул мисалдын сага зор жардамы","тиет.","","Токтогул (эшикти жаап, сыртынан кулпу салып жаткан"]},{"t":"p","h":"надзирателдин соңунан). Жапайы, кара кыргыз адамча тө-"},{"t":"v","l":["рөлүп, адамча өлөт! (Жеңинин учу менен оозунун канын","сүртүп). Мыкаачы.","Дмитрий (Токтогулдун башын сүйөп). Кел, суудан жут...","Токтогул (суудан жутуп). Теңир жалгасын!","Дмитрий (жанынан орун бошотуп). Бир аз сыйлыгышып"]},{"t":"p","h":"койгула, туугандар. (Токтогулга) Бери жылгын (Т. Абдумо-"},{"t":"v","l":["мунов).","","25. Чекиттин коюлушу","","«ЖАЛБЫРАК» кештеси","","Чекиттин сүйлөмдүн аягына коюлушун"]},{"t":"p","h":"1-класстан тартып билесиң. Ошолорго кошумча."},{"t":"p","h":"1. Чекит айрым кыскартылган сөздөргө коюс., ж., к. Бирок чен бирдиктерди туюнткан км, м, см, т, кг, га, л сыяктуу кыскартылган сездерде чекит коюл-"},{"t":"v","l":["байт. М.: Арал менен Караколдун ортосу 10 км","келет.","2. Адамдын кыскартылган аты-женунен"]},{"t":"p","h":"сон чекит коюлат. М.: Л.Н. Толстой, С. Эралиев, Д.Сарыгулов, Ж. Медетов, Г. Сатылганова, Ч. Баекова, 3. Бейшекеева, Р. Ачылова."},{"t":"p","h":"3. Чекит драмага катышкан адамдын аты-"},{"t":"v","l":["нан кийин коюлат. М.: Болотбек. Мени сабаты","жок деп жемелебегиле. Азыр баарын билем.","Жат жазуу жазалыбы? (Сабактан)."]},{"t":"p","h":"4. Чекит катар номерлөөдө коюлат. М.: Ка-"},{"t":"v","l":["ралуучу маселелер:","1. Биринчи чейректин жыйынтыгы.","2. Окуучулардын жекече жүрүш-турушун","кароо."]},{"t":"h3","h":"<span class=\"pg\" data-n=\"225\">225<\/span>&amp; З6. КЕМЧОНТОЙДУН КӨЧҮРҮП АЛГАНДАРЫНАН"},{"t":"p","h":"Максатың: катадан арылтып көчүрүү"},{"t":"h3","h":"Биринчи жат жазуу БАЙТИК БААТЫР"},{"t":"p","h":"Байтик Канаев ата тегинен бери манап кийинчерек солто урусунун билермандарынын бири кыргыз коомунун бийлик төбөлдөрүнүн белгилүү өкүлү. Ал болжол менен алганда 1820 жылдары Чүй өрөөнүндөгү Ала Арча капчыгайында тулган. Анын балалык чагы кедей-кембагалдардын чөйрөсүндө өткөн. Байтик батр өз мезгилинин алысты дана көрө билген сайасатчысы. Мисалы ал 1860 жылдардын башында аргасыздан Кокон хандыгына кызмат өтөгөн бирок ал Кокон хандыгына каршы күрөшкө көтөрүлгөндө ал көтөрүлүшкө чыкан солтолордун башында турган жана Кокон хандыгына каршы чыккан. 1862 жылы Пишпек сепилин алуга жана талкалого активдүү катышкан. 1863—65 жылдарда анын жигитери кокондун Мерке, Олуя Ата, Чимкент сепилдерин алуга зор көмөк көрсөтүшкөн."},{"t":"p","h":"Падышачылыка берилгендиги үчүн Байтик батр Анненск тасмасына тагылган Чоң алтын медальга Ш таражадагы Станислав орденине татыкту болгон, ошондой эле бир нече жолу балу белектер менен сыйланган. 1867 жылы орто азийалык элдердин алгачкы өкүлдөрүнүн катарында Санкт-Петербурга император Александр Пнин кабыл алусунда болгон. Ал кыргыз элинин ичинде зор кадыр барка ээ. Өз элинин үрп адатарына жана салт санасына тайану менен ал түндүк кыргыз уруларын бириктирүгө аракет жасаган. Өзүнүн айланасындагы акылман адамдар менен дайыма кенешип иш жасаган. Байтик батр 1886 жылы 5 марта дүйнөдөн кайткан."},{"t":"p","h":"А. Беделбаев, «Чүй баяны» гезити"},{"t":"h3","h":"Әкинчи жат жазуу МАҢКУРТ"},{"t":"p","h":"Күн ысыган сайын темирдей кураган шири жылаңач башты чемгер салгандан бетер кысат. Ал аз келгенсип эки күн өткөн соң жылаңач куйкадан жаңы чач да баш багат. Азиятыктардын тикендей тик өскөн кайратуу чачы шириге сайылып аны тешип өтө албаган соң кайра кайрылып куйкага сайылат. Мунун кыйноосу ширинин азабын ого бетер күчөтөт. `Ошентип, туткундар бара-бара эс-акылын жогото баштайт."},{"t":"p","h":"<span class=\"pg\" data-n=\"226\">226<\/span>Беш күн өткөндөн кийин туткундардын кимиси тирүү калганын билүгө айдар көкүлдөр келет. Кыйноого түшкөндөрдүн бирөн тирү тапса максатына жеткендей ыразы болушчу."},{"t":"p","h":"Тирүү калганды кыйноосунан бошотуп суу берип акырындап ал-күчүнө киргизип алышчу. Бирок ал эми адам эмес эс акылдан айрылган маңкурт кул. Мындай кулдар эс акылы ордунда он кулдан артык бааланат."},{"t":"p","h":"Ошол үчүн Найман-Әне маңкурт болгон уулун кошуп отуруп жаны кашайганда минтип айтканы бекеринен эмес го:"},{"t":"p","h":"«Кулунум сени эс учундан ажыратып жатканда кулунум кычкачтап жаңгак чакансып башыңа шири кийгизип мээнди чагып жатканда кулунум чемгерлеп мыкчып мээнди чанагындан коркунучтун кан-шүүшүңү аралаш көзүң чыгып баратканда кулунум Сары-Өзөктүн түтүнү жок кыямат оту жанынды куйкалап каның катып жатканда эриниңе бир тамчы суу тамызбай асман мисирейгенде – мына ошондо бүт дүйнөгө жан берген жараткан Әгебиз Күн сага жексур көрүнүп жарык чачкан Күн эмей эле аламдагы жаркын Эгелердин эң караңгысы сен экенсиң деп Күндү каргай алдың бекен? Ч. Айтматов"},{"t":"h3","h":"Үчүнчү жат жазуу БИР УУЧ ТОПУРАК"},{"t":"p","h":"Ал үйдүн бир сызмасын чечип алып итти мойнун мунбай турган кылып байлады. Ичкери кирип жаткан ордуна өтүп баш жагында дайындуу турган комузун алды белине кыстарды кайта керегенин башын улап тышка чыкты:"},{"t":"p","h":"– Эчтеме эмес Актөш эчтеме эмес... Сенде тил жок болсо да оз бар менде көз жок болсо да тил бар... Әчтеме эмес элди таап кетебиз, издейбиз шордууну... Жүр, жол башта Актөш."},{"t":"p","h":"Ит Сарыбайдын дитин түшүнбөй алдыга баспай тегеренип туруп алды. Сарыбай таягынын учу менен жолдун угун бойлоп колот ылдый чоң жолго туштап салды. Ит ошондо билдиби алдыга түштү."},{"t":"p","h":"– Мады-ыл!.. – Сарыбай ит тарткан жака темселеп женедү, – Мады-ыл..."},{"t":"p","h":"Аттиң каңгырап калат деген ушубу! Атасы мекен кылган жер жарыктыка келген балалыгын өткөргөн жигит дорун сүрүп жар сүйгөн перзент тапкан жери, акыры келип өмүрүн үшүк уруп бардыгынан ажыратып көөдөнүндө дүкдүк эткен жүрөгү менен, бир ак төш итти жанына кара туруп кудайдын эсинен чыгып селдейип жалгыз калып турган жери... Көңүлүнө дагы кылт деп жамандык түштү. Әкинчи <span class=\"pg\" data-n=\"227\">227<\/span>бул жерге кайрылып келе албай турган сезим. Сарыбай оор үшкүрдү жерге эңилди алсыз неменин эки тизеси калтырап колу араң жерге жети. Колуна чөп чирий баштаган жалбырак урунду. Ал тырмалап жытуу ным топурактан бир ууч алып ой басып тунжурап туруп «Кай жерде өлсөм да киндик каным тамган жердин топурагы үстүмдө болсун» деп койнуна салып алды..."},{"t":"p","h":"Т. Касымбеков"},{"t":"h3","h":"Төртүнчү жат жазуу ЖАНАЛЫ БАЛБАНДЫН БАЯНЫ"},{"t":"p","h":"Эл ортосунда коюн колтук алыштырып эки тайекчи чыга бергенде ал балбан муштуму менен менин сол бөйрөгүмө байкатпай берип-берип алды эле көзүмдөн от чагылып денем ымыр чымыр болуп жыгылып кала жаздап зорго эсимди жыйдым. Силккенде темтендеп барып оңолдум. Ал бөйрөгүмө эки бармагын батырып жибергендей болду. Жаным ачыды. Анын иштегенин мен да кайталадым эле колу бошой түштү. Нары бери сүрүштүк. Булкуп силкиштик. Ыгыма келе түшкөндө торой чалып урганда, ал чалкасынан түштү. Мени тайекчим кыйкырып, элге дардандата жетелеп кирип кети. Бөйрөктөрүм оруганынан жатарда байкасам, көгала болуп калган экен. Эртеңки одарыш эсиме түшүп, өзүнчө кыжырдандым. Әртеси тамаша одарыштан башталды. Мени кийиндирип атыма мингизишти. Әкинчи тараптын балбаны көпкө чейин чыкпай калды. Көп убакытан кийин кечеги күрөштө менден жыгылып калган балбанды ат үстүнөн көрдүм. Кубана түштүм. Таекчим этийет бол, ыза болгон эме... деди. Ал балбан суранып жатып өчүн алуу үчүн мага түшкөн экен. Жакындап келгенде карасам канын ичине тартып купкуу болуп каарданып алыптыр. Мен күлүп койдум. Неге ыржыйасың жимегинди оозуңа тыгамын деп ого бетер карланды. Әңишү башталды. Алгач оң колумду карматып койдум. Чиренип тартып жатып энкейте албады. Үч жолу булкуп жатып колумду зорго суруп алдым. Кармашуу көпкө созулган жок. Оң колун тартып келип эрдин алдыңкы кашына басып аты теминдим. Атым бир чөгөлөп кайра секирип турду. Анын аты кетенчиктеп кети. Буту үзөңгүдөн ажырап эки атын ортосунда көпүрө сыяктуу турат. Теминсем атым баспайт. Камчы чабууга колум бош эмес. Акыры улактай басып жөнөрдө тизгиним колдон чыгып кетиптир. Әкөбүз тең атан учуп түштүк. жерде да мен аны баса жыгылдым уйпалап тургузбадым..."},{"t":"p","h":"«Талас турмушу» гезити"},{"t":"h3","h":"<span class=\"pg\" data-n=\"228\">228<\/span>Бешинчи жат жазуу ВАН ГОГДУН УЛУУ ЖЫРГАЛЫ"},{"t":"p","h":"Винсент Ван Гог (1858—1890) Голландиянын улуу сүрөтчүсү. Сүрөтчүлөрдүн арасында Ван Гогдой айтайын деген оюн дүйнө туюмун көкүрөктөгү дил сырын дана адабий жактан көркөм чагылдыргандар сейрек кездешет. Дээрлик жок десек да болот. Ушул улуу сүрөтчүнүн каттарынан алынган айрым үзүндүлөрдө мындайча ой-пикирлер айтылган."},{"t":"h3","h":"333-КАТТАН"},{"t":"p","h":"Ооба, албетте адамга шык керек бирок ал кепчулук ойлогондой нерсе эмес. Колду узун созуп ошол шыкты ала билген она бу оной олтоң нерсе эмес. Шыкты өзүнөн өзү эле пайда болот деп күткөн жарабайт. Тынымсыз иштесең бир нерсе үйрөнөсүң. Сүрөтчү болуу үчүн сүрөт тарта билүү керек."},{"t":"h3","h":"214-КАТТАН"},{"t":"p","h":"Менин оюмча дайыма эле эмес бирок кээде жомоктогудай бай болуп калам. Жок, акча менен эмес менин жашоомо маани-маңыз киргизип делебемди козгоп эргүү берген жан дүйнөмдү эт-жүрөгүмдү арнаган өзүмдүн ишимден кандайдыр бир каниет алам. Адам өзүнүн шык-дараметин ишке ашырган кезде менимче улуу жыргалга туш болот."},{"t":"h3","h":"336-КАТТАН"},{"t":"p","h":"Кандайдыр бир үн сага сен сүрөтчү эмессиң десе ошол замат сүрөт тарта башта. Мына ушундай жол менен гана сен көкүрөктөн чыкан үндү унчуктурбай коё аласың. Мен сүрөтчү эмесмин деп кантип адам өзүнө катал өкүм чыгарсын? Сабырдуу болуу жарабайбы, сабырдуулукту буудай кантип жайбаракат өсүп даны кантип бышып жаткандыгын көрүп туруп табияттан үйрөнсө бобойбу?"},{"t":"h3","h":"18-КАТТАН"},{"t":"p","h":"Гүлдү жан дилден сүйгөндөр базарда отуруп алып кызгалдакты саткандар эмес аны бапестеп өстүргөн адамдар чыныгы сүйүчүлөр."},{"t":"p","h":"«Кыргыз руху» гезити"},{"t":"h3","h":"<span class=\"pg\" data-n=\"229\">229<\/span>Алтынчы жат жазуу ТАЙЛАК БААТЫР"},{"t":"p","h":"Тайлак (1796-1838) – Ала-Тоо жергесин нечен ирет кокондук жана кытайлык талоончу-баскынчылардан коргогон улутук баатыр. Кыргыз аймагынын ар тарабынан кол салган күнкорлонтуп басмырлаган чет мамлекетик баскынчылардын зордук-зомбулугуна каршы байыртан уланган со- „гуш салты боюнча өзү жекеге чыгып баш баатырларын жеңип көркоолорду мекенибиздин чегинен оолак кубалап ата журтунун ар-намысын коргогон Тайлактын тендешсиз эрдиктери жеке кыргыздын эмес, кытай өзбек казактын тарыхый булактарында, мамлекеттик архивдеринде тамгалангандары кийинки кездерде белгилүү болууда. Ошондой эле баатыр тууралуу окумуштуу тарыхчылардын илимий эмгектери жетишерлик. Танымал тарыхчы профессор С. Аттокуровдун «Тайлак баатыр» аттуу китеби окуу куралы катары жарыка чыкты. Кокон хандыгынын зордугу менен кордугу кыргыз элин айосуз мүңкүрөткөн. Жергиликтүү элди 18 түрлүү алык-салык менен эзип турган. Тайлак калың элди мун-зардан арылтуу максатын атуулдук ант катары түшүнүп кол курап өмүрүн тобокелге сайып Мадали хандын ашкан залимдигине каршы казатка аттанган. Куртка чебин тургузуп Нарын чөлкөмүн мүңкүрөтө мыжыккан 500 сарбас саркерин кутурта дөгүрсүгөн кушбеги Таштанбектин сазайын колуна берип кыйла кожолору менен бектерин туткундаган Тайлак баатыр аларды барымтага кармап Мадали хан талап тоногон элдин мал-мүлкүн ордого зордоп алдырган кызкелиндерди толук кайра жеткирүү талабын коюп аргасыз аткартат. Тоо арстаны Тайлакты тирүүлөй туткундап келүү үчүн Мадали хан Арап баатырды жөнөтөт. Кылкылдаган Араптын колун Тайлак өз жоокерлери менен тосуп аёсуз салгылашта күм-жам кылат. Ошондон төрт жыл өткөндө хан атактуу баатыр, алп Әдиге төрөгө Ак мечит менен Түркстан аймагындагы бийликти берүүгө убада кылып ошол төрөнү Тайлак баатырга каршы аттантат. Әдиге султанга жекеме-жеке эрөөлгө чыгып, узака айыгышкан айкашта Тайлак аны оңкосунан жер сулатат. Әл кытай кокон баскындоосунан тынчыйт."},{"t":"p","h":"Нарын дарыясынын жегинде, Куртка өрөөнүндө Самаркан, Букара Кашгар усталары бышырылган кыштын кынаптап курушкан Тайлактын зор күмбөзү элдик баатырдын эскерткичи катары алиге заңкайып турат."},{"t":"p","h":"Ш. Бейшеналиев"},{"t":"h3","h":"<span class=\"pg\" data-n=\"230\">230<\/span>Жетинчи жат жазуу 1. БИЗДЕН ҮЙРӨНСҮН"},{"t":"p","h":"Азыр биздин эл россия, европа, ал турсун америкага чейин барып соода-сатык кылышат. Бирок алардын коом түзүлүш принциптери бизге жукпайт. Биз алардын илимий-технологиялык техникалык жактарын үйрөнүшүбүз керек. Бирок коом боюнча адамдардын мамилеси боюнча алар бизден үйрөнсүн. Анткени американын, европанын жашаганына эки миң жыл толо элек а кыргыздардыкы эки миң жылдан ашык. Буга биз арданышыбыз керек, себеби биз ошону балабайбыз балдарыбызга жеткирбей жатабыз."},{"t":"h3","h":"2. АДАМДЫН ЖАНЫ ЖАНА КЫЗЫКЧЫЛЫК"},{"t":"p","h":"Адамды адам кылган – дене анан жан. Биринчиси денеси же сөөгү адам кайтыш болгондо, аны жерге коебуз. Әкинчиси – жаны. Ошол жан менен дене кошулганда, адам деп түшүнөбүз. Жан сезим менен акылдан турат. Сезим жүрөктөн акыл баштан."},{"t":"p","h":"Биздин балдар азыр комузду уккусу жок Калыгул менен Арстанбекти окугусу жок. Кичинекейинен бала бакчадан баштап европалык музыканы укса орус тилинде ойлонсо ошолордун каада салтарын үйрөнүп мамилелерин өздөштүрсө тилин жоготсо кыргыздын жанынан эмне калат? Ушинтип биз жаныбызды өзгөртүп жатабыз. Мээ менен жүрөктү бириктирген – тил. Тил арабанын денгелугундей да. Адам ойлонсо сүйлөсө кыйналса ырдаса тил аркылуу болот."},{"t":"p","h":"Улам ыймандан ажырап бараткандайбыз. Ыйман жок болгон үчүн айрым жетекчилер элди тоноп жатат элдин насибин жеп атат. Мен каада салтынды урдум мага дүнүйө керек дегендер ыйманын жеп коюшкан. Ошон үчүн 2,5 миллион кыргыздын жанын бириктирип мекен арбак элим жерим деген түшүнүккө алып келүү керек. Ар бир адам өз кызыкчылыгын коомдун кызыкчылыгынан төмөн койушу зарыл. Жеке кызыкчылыкты улутук кызыкчылыка баш ийдирип бириктирмейин биз оңоло албайбыз."},{"t":"h3","h":"З. ЧЫНЫКЕ БИЙДИН БИР ЖАРЫМ УУЛУ"},{"t":"p","h":"Пейил оңолмоюнча иш оңолбойт. Дүйнө ак менен карадан турат. Адал менен арамга жакшылык менен жамандыка бөлүнөт. Ошон үчүн пейилди оңоо керек. Бул биз айткан улутук идеология. Бул улуттук сезим намыс коомду мекенди сүйүү."},{"t":"p","h":"XX кылымдын башында Санкт-Петербургда сенатка мүчө болгон Чыныке бий бир жолу Сусамырда-жайлодо казактын <span class=\"pg\" data-n=\"231\">231<\/span>болушу менен жолугуп калат. Казактын болушу канча уулуңуз бар? Деп сураса бир жарым уулум бар дейт. Болуш түшүнбөй калат. Чыныке бий: «Төрт уулум бар. Үчөө аялбаласын бакандан башка элге зыяны да, пайдасы да жок. Үчөөн мен жарым бала деп эсептейм. Бир уулум элдин камын жейт. Ошонун баарын бириктирип, бир жарым деп айтканым» деген экен."},{"t":"p","h":"Д.Сарыгулов"}],"sub":[{"title":"&amp; З6. КЕМЧОНТОЙДУН КӨЧҮРҮП АЛГАНДАРЫНАН","b":26},{"title":"Биринчи жат жазуу БАЙТИК БААТЫР","b":28},{"title":"Үчүнчү жат жазуу БИР УУЧ ТОПУРАК","b":38},{"title":"Төртүнчү жат жазуу ЖАНАЛЫ БАЛБАНДЫН БАЯНЫ","b":45},{"title":"Бешинчи жат жазуу ВАН ГОГДУН УЛУУ ЖЫРГАЛЫ","b":48},{"title":"333-КАТТАН","b":50},{"title":"214-КАТТАН","b":52},{"title":"336-КАТТАН","b":54},{"title":"18-КАТТАН","b":56},{"title":"Алтынчы жат жазуу ТАЙЛАК БААТЫР","b":59},{"title":"Жетинчи жат жазуу 1. БИЗДЕН ҮЙРӨНСҮН","b":63},{"title":"2. АДАМДЫН ЖАНЫ ЖАНА КЫЗЫКЧЫЛЫК","b":65},{"title":"З. ЧЫНЫКЕ БИЙДИН БИР ЖАРЫМ УУЛУ","b":69}],"section":"ЇХ КЛАСС","pages":[224,231]},{"title":"§ 37. КЕП КУРЖУН «МАКАЛ» ТОПТОМУ","blocks":[{"t":"h3","h":"§ 37. КЕП КУРЖУН «МАКАЛ» ТОПТОМУ"},{"t":"p","h":"(1—-6-тестелер УП класста, 7-12-тестелер"},{"t":"p","h":"ИШТ класста өтүлгөн.)"},{"t":"p","h":"Он үчүнчү тесте 1. «Агайындын азары болсо да, безери болбойт». 2. «Аганы көрүп ини өсөт, эжени көрүп синди өсөт». 3. «Адепсизден да адептүүлүктү үйрөн». 4. «Ай дээр ажо жок, кой дээр кожо жок». 5. «Айткандын оозу жаман, ыйлагандын көзү жаман»."},{"t":"p","h":"6. «Ала кушту атынан чакыр». 7. «Алдыңкы туяктын изин арткы туяк басат». 8. «Алдыңкы көч кайда барса, кийинки көч да ошол жакка барат». 9. «Алма сабагынан алыс түшпөйт»."},{"t":"h3","h":"Он төртүнчү тесте"},{"t":"p","h":"1. «Ар кимдики өзүнө, ай көрүнөт көзүнө». 2. «Атадан алтоо болсоң да, ар жалгыздык башта бар». 8. «Ат сыйлаган жөө баспайт, эр сыйлаган эшикте калбайт». 4. «Атаң алтымышка чыкканда, алдап-соолап күчүн ал». 5. «Аш көп болсо, каада көп». 6. «Бажа бажаны көрсө башы кычышат»."},{"t":"p","h":"7. «Бала, баланын иши чала». 8. «Бала ыйламайынча, эмчек кайда». 9. «Балалуу үй – базар, баласыз үй —мазар»."},{"t":"p","h":"Он бешинчи тесте 1. «Ата – балага сынчы». 2. «Балалуу үй – падышалуу үй». 3. «Бешиктеги баланын бек болорун ким билет, карындагы баланын хан болорун ким билет». 4. «Бир уядан бир сасыткы чыгат». 5. «Буудайдын барар жери – тегирмен, кыздын барар жери – күйөө». 6. «Жакшы атанын кашыктап жыйнаганын жаман уулу чөмүчтөп чачат». 7. «Жакшыдан жаман туулса – чыгаша, жамандан жакшы туулса – киреше». 8. «Бай болбогон бай болсо, корубаган жер калбайт». 9. «Байлык колдун кириндей»."},{"t":"h3","h":"<span class=\"pg\" data-n=\"232\">232<\/span>Он алтынчы тесте"},{"t":"p","h":"1. «Башы оорубагандын кудай менен иши жок». 2. «Бирде жигит тее минет, бирде жигит жее журет». 3. «Букарда пулу бардын кеену ток». 4. «Жаман атка жал бутсе, жанына торсук байлатпайт». 5. «Жаманды жасоол койсо, жалгыз баласынын көзүн чыгара чабат». 6. «Жети кишинин бири – кыдыр». 7. «Касапчы энесине сөөк сатат». 8. «Качкан да кудай дейт, кууган да кудай дейт». 9. «Кишинин шайтаны – киши»."},{"t":"p","h":"Он жетинчи тесте 1. «Кол – кудайдын мөөрү». 2. «Колунда талканы бар бала сүйгүнчүктүү». 8. «Кудай кошкон куда болот». 4. «Кырк жылы кыргын болсо, бейажал чымын өлбөйт». 5. «Соода сакал сыйпаганча». 6. «Соодагер санаасы менен байыйт, убайым менен карыйт». 7. «Ырайына жараша ыйманы»."},{"t":"p","h":"8. «Ырыстууга жуучу келет, ырысы жокко доочу келет»."},{"t":"p","h":"9.«Ырысы жоктун ырымы күч»."},{"t":"p","h":"Он сегизинчи тесте 1. «Бар балтаң, жок жалтаң». 2. «Аш ичсең, акылын менен ич». 3. «Ачууну таттуу кылган – туз, алысты жакын кылган – кыз». 4. «Атан төө мас болсо, тайлак менен дос болот». 5. «Ат оонаган жерде түк калат». 6. «Әл дарбыса, эшек кошо дарбыйт». 7. «Ат баспайм деген жерин үч басат». 8. «Ак ит, кара ит – баары бир ит». 9. «Кары келсе – ашка, жаш келсе – ишке»."},{"t":"h3","h":"МАКАЛ ЖАТТОО"},{"t":"v","l":["Ар бир тестени өзүнчө жатта","1. Он үчүнчү тесте: 1, 2, 8, 4, 5, 6, Т, 8, 9.","2. Он төртүнчү тесте: 1, 2, 8, 4, 5, 6, т. а. 9.","3. Он бешинчи тесте: 1, 2, 3, 4, 5, 6, Т, 8, 9","4. Он алтынчы тесте: 1, 2, 3, 4, 5, 6, 7, 8, 9.","5. Он жетинчи тесте: 1, 2, 3, 4, 5, 6, Т, 8, 9","6. Он сегизинчи тесте: 1, 2, 3, 4, 5, 6, Т, 8, 9."]},{"t":"h3","h":"МАКАЛ АЙТЫШУУ"},{"t":"p","h":"13 – 15-тестелер боюнча Шарты. Окуучулар эки топко белунет. Таймашка ар бир топ мыкты өкүлүн чыгарат. Анан алар макалды кезектешип айтышат. Бир макал эки кайталанбайт. Бирөө билбей токтоп калган учурда, экинчиси үстөккө-босток айтып, макалынын санын арбытат. Макалды аз билгени утулат."},{"t":"v","l":["<span class=\"pg\" data-n=\"233\">233<\/span>16 – 18-тестелер боюнча иштөө","Шарты. 13 – 15-тестелердикиндей.","","1—18-тестелер боюнча"]},{"t":"p","h":"Шарты. Окуучулар топко бөлүнбөйт. Ар бир окуучу макалды жеке айтат. Бир макал эки кайталанбайт, эгер кайталанса, экинчиси эсепке алынбайт. Айтылган макалдардын санына чек коюлбайт. Бирден жетиге чейин орун берилет."},{"t":"h3","h":"«Айдан, айдан ай көрөк» оюну"},{"t":"p","h":"Бул 1—18-тестелерди бүт камтыйт. Окуучу өзү каалаган макалды эркин колдонот. Бул оюндун шарты 76-77Т-беттерде айтылган ($7 де)."},{"t":"h3","h":"Сүйлөп машыгуу"},{"t":"p","h":"1. Он үчүнчү жана он төртүнчү тесте боюнча оозеки сүйлөм түз."},{"t":"p","h":"2. Он бешинчи жана он алтынчы тесте боюнча оозеки сүйлөм түз."},{"t":"p","h":"3. Он жетинчи жана он сегизинчи тесте боюнча оозеки сүйлөм түз."},{"t":"p","h":"1- үл г ү: «Агайындын азары болсо да, безери болбойт» деген чын, кайда качат элек. «Агайындын азары болсо да, безери болбойт», силерден кол үзбөй калалык. «Агайындын азары болсо да, безери болбойт», безери болбосун эсте тутуп жүргөн жакшы го. Бир макалга үлгүдөгүдөй бир нече эмес, бир эле сүйлөм түз."},{"t":"p","h":"2-үлг ү: 1. Кермекаш кудаларына мындай деген: «Агайындын азары болсо да, безери болбойт». 2. «Агайындын азары болсо да, безери болбойт»,-деп айткан Уулкан. 3. Бүбүсара: «Агайындын азары болсо да, безери болбойт»,— деп айтты. 4. «Агайындын,— деген Абыкан,— азары болсо да, безери болбойт». 5. Каналбек агайындын азары болсо да, безери болбосун айтпай койду беле. Бир макалга ушул үлгү боюнча бир эле сүйлөм түз. Бирок бир эле түр менен түзө берсен, баары коёндой окшош болуп калат. Ошол себептен улам кийинки макалда үлгүдөгү беш түрдүн улам бирин пайдалануу сунуш кылынат."},{"t":"h3","h":"Жазып машыгуу"},{"t":"p","h":"Макалдын жазылышын «Сабат санжырасындагы» «Кереге көз жана тумар» кештеси тескейт."},{"t":"v","l":["<span class=\"pg\" data-n=\"234\">234<\/span>Төмөнкүлөрдү эсиңе түшүр.","2. Е Е","","-гин","-ги жөнүндө","-ги тууралуу","","Кештелердин мисал менен туюнтулущу."]},{"t":"p","h":"1. Алтынбек мындай деген: «Жаманды тее устунен ит кабат». 2. «Ит күлүгүн түлкү сүйбөйт», – деп айткан Бакбуркан. 3. Үсөнбек: «Бирде жигит төө минет, бирде жигит жөө жүрөт» ,— деген. 4. «Касапчы,— деген Абаз,— энесине сөөк сатат». 5. Алмакан кыздын кырк чачы улуу экендигин айтты."},{"t":"p","h":"6. «Көл таянычы – жер, көсөм таянычы – эл» дегендин жалганы барбы? 7. «Көч жүрө-жүрө оңолот», ага эмнеге акидей асылып калдыңар, кичине сабыр кылсаңар боло."},{"t":"p","h":"255-көнүгүү. Он үчүнчү тестедеги макалдарды жогорку кештедеги 7 түр боюнча өзгөртүп жаз. 1-5-кештелерге бирден, ал эми 6-7- кештелердин ар бирине экиден макал туура келсин."},{"t":"p","h":"256-көнүгүү. Он төртүнчү тестедеги макалдарды 1—5-кеште боюнча жазгыла."},{"t":"p","h":"257-кенугуу. Он бешинчи тестени 2—4-кештелер боюнча жазгыла. 258-кенугуу. Он алтынчы тестени 6-7-кеште боюнча жазгыла. 259-көнүгүү. Он жетинчи тестени 5-кеште боюнча жазгыла. 260-кенугуу. Он сегизинчи тестени 1-7-кеште боюнча жазгыла."},{"t":"h3","h":"Кайталоо"},{"t":"p","h":"1. УП класс: 1- 6-тестелер («Макал» топтомунда). $ 7. 2 ҮТП класс: 7- 12-тестелер («Макал» топтомунда). $ 25."}],"sub":[{"title":"Он төртүнчү тесте","b":5},{"title":"Он алтынчы тесте","b":9},{"title":"МАКАЛ АЙТЫШУУ","b":17},{"title":"«Айдан, айдан ай көрөк» оюну","b":21}],"section":"ЇХ КЛАСС","pages":[232,234]},{"title":"§ 38. «САНАТ СӨЗ» ТОПТОМУ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"235\">235<\/span>§ 38. «САНАТ СӨЗ» ТОПТОМУ"},{"t":"p","h":"(1-4-кайрыктар УП, 5-8-кайрыктар УПШ класста өтүлгөн.)"},{"t":"h3","h":"Тогузунчу кайрык"},{"t":"p","h":"1. Жетимге камчы көтөрбө, жетимдин отун өчүрбө, жалгызга камчы көтөрбө, жардынын отун өчүрбө."},{"t":"p","h":"2. Сөзү октой жамандан жакын жүрбөй оолакта."},{"t":"p","h":"3. Бирде мырза, бирде кул, жаман-жакшы элге жак, терин төгүп, жерге жак."},{"t":"p","h":"4. Карөзгөй болбой, калыс бол, кошоматтан алыс бол. о. Күлүк минип, гүлдөп өт, күмүрөй журтка сүйлөп өт (Арстанбек)."},{"t":"p","h":"Онунчу кайрык 1. Жакшы болсоң жердей бол, баарын чыдап көтөргөн."},{"t":"p","h":"Таза болсоң суудай бол, баарын жууп кетирген."},{"t":"p","h":"2. Ырыс алды – ынтымак, ынтымагың жок болсо, алдыңан таяр алтын так."},{"t":"p","h":"3. Там бир жылы көбөйөр, дарак бир жерден көгөрөр."},{"t":"p","h":"4. Жекендүү көлдүн бал камыш, жылкы салса, от табат. Уулу жаман болгон соң, дөбөдөй болгон атасын төө үстүнөн ит кабат."},{"t":"p","h":"5. Өткөн өмүр- качкан куш, колуңа келбейт ал кайтып (Калыгул)."},{"t":"p","h":"Он биринчи кайрык 1. Баркынды билген тууганга бастырып барып амандаш. Атандай сыйлап карыны, астынан чыгып саламдаш (Нурдин Молдо)."},{"t":"p","h":"2. Балалуу аялга камчы көтөргөн эркек акмак. Балапанын ээрчиткен казга кушун шилтеген мүнүшкөр акмак (Алдаш Белек уулу)."},{"t":"p","h":"3. Бий болсон, калыс бол, калыс болбосоң, бийликтен алыс бол (Шапак уулу Шералы)."},{"t":"p","h":"4. Жаз чыкканда асманда, жарышып сайрайт боз торгой. Жигит болсон, бекем бол, чириген талдай бош болбой. о. Оокат үчүн камчылан, иштегенден эринбе. Уятынды кетирет, ичкиликке берилбе (Осмонкул)."},{"t":"p","h":"Он экинчи кайрык 1. Өзүңө бирөө тийбесе, озунуп барып чаппагын, көзүң менен көрбөсөң, күбүрөп ушак айтпагын."},{"t":"p","h":"2. Токтоо эрдин мүнөзү тойбосо да тойгондой, эмне кылса өөнү жок, калыпка салып койгондой (Осмонкул)."},{"t":"p","h":"<span class=\"pg\" data-n=\"236\">236<\/span>3. Одоно сүйлөп күпүлдөп, орой болбо жашында."},{"t":"p","h":"А. Жалакай болсоң жашындан, өмүрүндү дат басат."},{"t":"p","h":"5. Таза болсо жүрөгүң, туш тарабың даңгыр жол (Калык)."},{"t":"h3","h":"Жаттоо"},{"t":"v","l":["Ар бир кайрыкты өзүнчө жатта","1. Тогузунчу кайрык: 1, 2,8, 4, 5.","2. Онунчу кайрык: 1, 2, 3, 4, 5.","3. Он биринчи кайрык: 12","4. Он экинчи кайрык: 1, 2, 8, 4, ту","Кайталоо"]},{"t":"p","h":"1. Биринчи кайрык: 1, 2, 3, 4, 5 УП класста, «Санат сөз» топтому. $8."},{"t":"p","h":"2. Экинчи кайрык: 1, 2, 3, 4, 5 (УП класс, «Санат сез»)."},{"t":"p","h":"3. Учунчу кайрык: 1, 2, 3, 4, 5 (УП класс, «Санат сөз»). $ 8."},{"t":"p","h":"4. Төртүнчү кайрык: 1, 2, 3, 4, 5 (УП класс, «Санат сөз»)."},{"t":"p","h":"5. Бешинчи кайрык: 1, 2, 3, 4, 5 УШ класста, «Санат сез» топтому. $ 26."},{"t":"p","h":"6. Алтынчы кайрык: 1, 2, 3, 4, 5 (УШ класс, «Санат сез»)."},{"t":"p","h":"7. Жетинчи кайрык: 1, 2, 3, 4, 5 (УШ класс, «Санат сез»)."},{"t":"p","h":"8. Сегизинчи кайрык: 1, 2, 3, 4, 5 (УШ класс, «Санат сез»)."},{"t":"h3","h":"Сүйлөп машыгуу"},{"t":"p","h":"261-көнүгүү. Тогузунчу кайрыктагы санат сөздөрдү катыштырып оозеки сүйлөм түз."},{"t":"p","h":"Үлгү: Арстанбек Буйлаш уулунун «жетимге камчы көтөрбө, жесирдин отун өчүрбө, жалгызга камчы көтөрбө, жардынын отун өчүрбө» деп айтканы мурда кандай маанилүү болсо, азыр да күчүн жоготкон жок."},{"t":"p","h":"262-көнүгүү. Онунчу кайрыктагы санат сөздөрдү да 261- көнүгүүдөгү үлгүгө окшоштуруп иште."},{"t":"p","h":"263-кенугуу. Он биринчи кайрыктагы санат сөздөр да 261- көнүгүүнүн үлгүсүндө иштелет."},{"t":"p","h":"264-көнүгүү. Он экинчи кайрыкты да 261-көнүгүүдөгүдөй аткар."},{"t":"h3","h":"Жазып машыгуу"},{"t":"p","h":"265-кенугуу. Тогузунчу кайрыктагы санат сөздөрдүн ар бирин катыштырып сүйлөм түз. Төл жана бөтөн сөздүн 1-эрежесине туура келтирип жаз."},{"t":"p","h":"266-көнүгүү. Онунчу кайрыктагы санат сөздөрдү төл жана бөтөн сөздүн 2-эрежесине туура келтирип жаз."},{"t":"p","h":"<span class=\"pg\" data-n=\"237\">237<\/span>267-кенугуу. Он биринчи кайрыктагы санат сөздөрдүн ар бирин төл жана бөтөн сөздүн жазылышынын 8-эрежесине ылайыктап түз. 268-көнүгүү. Он экинчи кайрыктагы санат сөздөрдүн ар бирин төл жана бөтөн сөздүн жазылышынын 4-эрежеси боюнча жаз."},{"t":"p","h":"269-көнүгүү. 9—12-кайрыктардагы өзүң каалаган төрт санат сөздү төл жана бөтөн сөздүн 5-эрежеси менен жаз."},{"t":"p","h":"270-көнүгүү. Өзүн каалаган 4 санат сөздү төмөнкү түр боюнча сүйлөмгө катыштыр. «А С Үл г ү: Әстүү адамдын эсирбей тургандыгы жөнүндө Жеңижок айткан экен."},{"t":"h3","h":"§ 39. «СӨЗ БЕРМЕТИ» ТОПТОМУ"},{"t":"p","h":"(1-5-тестелер УПШ, 6-10-тестелер У11Ї класста өтүлгөн.)"},{"t":"p","h":"Он биринчи тесте 1. Жырык ийнесин албоо (эч нерсесине тийбөө, бирөөгө кара санабоо)."},{"t":"p","h":"2. Ийиктей чимирилүү (абдан элпек кыймыл-аракетте болуу, эпилдеп кичи пейил мамиле кылуу)."},{"t":"p","h":"3. Ийне жеген иттей (абдан арык, кыбырылган, илмейген, тыртайган)."},{"t":"p","h":"4. Ийне саяр жери жок (абдан эскирип тытылган, тарпы кеткен жамап-жаскоого мүмкүн болбой калган)."},{"t":"p","h":"5. Ийри отуруп түз кеңешүү (шашпай абдан ойлонуп иш кылуу, акылдашуу, бир пикирге, бир чечимге келишүү)."},{"t":"p","h":"6. Ийри тумшук (пайдага, олжого жакын, пайдалуу нерсенин үстүнөн чыгуучу, жолдуу)."},{"t":"p","h":"Т. Илең-салаң болуу (өтө создуккан, жакшы же жаман болуп оңолуп кете албаган абалда болуу)."},{"t":"p","h":"8. Илме кайып (болор-болбосу арсар, ачык эмес, белгисиз, так түшүнүүгө, чечмелеп айтууга мүмкүн болбогон, табышмак сыяктанган нерсе)."},{"t":"p","h":"9. Ит жандуу (ар кандай кыйынчылыкка, кыйноо-кыстоого чыдамдуу, жаны бек, чыдамкай)."},{"t":"h3","h":"Он экинчи тесте"},{"t":"p","h":". 1.Итке минип калуу (колдо болгон нерсенин бардыгынан, мал-мүлкүнөн ажырап калуу)."},{"t":"p","h":"<span class=\"pg\" data-n=\"238\">238<\/span>2.Ит көрбөгөн кордукту көрүү (абдан катуу азап чегүү, адам чыдагыс кордуктарды башынан өткөрүү)."},{"t":"p","h":"3. Ит оору (өнөкөт болгон, көндүм болгон жаман адат, терс кыял, жүрүш-туруш)."},{"t":"p","h":"4. Ит өлгөн жер (абдан кыйын, татаал, адам чыдай алгыс, өтө кыйынчылык менен араң жете тургандай жер)."},{"t":"p","h":"5. Иттин кара капталынан (абдан көп, арбын, мол)."},{"t":"p","h":"6. Ит терисин башына каптоо (аябай ызалап, кыйнап кордоо)."},{"t":"p","h":"7. Иттин уулу байкара (ким көрүнгөн, ким болсо эле, иши кылып мен адаммын дегендин баары, бардыгы эле)."},{"t":"p","h":"8. Ичер суу (адамдын жашоосу, өмүрү, көрөр күнү)."},{"t":"p","h":"9. Иттин үнү угулган жер (анча алыс эмес, жакын эле жер)."},{"t":"p","h":"Он үчүнчү тесте 1. Ичи-койнуна кирүү (тез эле жакындашып, аралашып кетүү, эпилдеп адамга жумшак мамиле жасоо, бирөөнүн ишенимине өтүү)."},{"t":"p","h":"2. Ичи муздоо (көңүлү калуу, ичи жылыбоо, жек көрө баштоо)."},{"t":"p","h":"3. Ичим тап (көп сүйлөбөгөн, бейчеки сөз айтпаган, башкалар менен көп ырк кошпогон, түнт)."},{"t":"p","h":"4. Ичине ит өлүү (бирөөгө астыртан, тымызын кастык кылуу, бирөө жөнүндө арам ою болуу)."},{"t":"p","h":"5. Ичине кара таруу айланбас (өзүнөн башка эч кимге жакшылык каалабоо, ичи тардык кылуу)."},{"t":"p","h":"6. Ичинен сызуу (билгизбей өзүнчө капалануу, кайгы-капасын сыртына чыгарбай, убайым тартуу)."},{"t":"p","h":"Т. Ичинен тынуу (кайгы-капасын, таарынчысын же ыраазы болгонун, көнүлү тынганын ж.б. билдирбөө, ачык айтпоо)."},{"t":"p","h":"8. Ичи өрт менен жалын болуу (абдан катуу кайгыруу, күйүт тартуу, күйгүлтүккө түшүү)."},{"t":"p","h":"9. Ичип-жеп коюу (аябай зекип, кулагынын кужурун алуу, кайта-кайта жемелей берип, тажатуу)."},{"t":"h3","h":"Он төртүнчү тесте"},{"t":"p","h":"1. Ичи түтпөө (чыдабоо, аёо, чыдамсыздык кылуу)."},{"t":"p","h":"2. Ичи эзилүү (ийигүү, жакшы көрүү, ичи жылуу, ыраазы болуу)."},{"t":"p","h":"3. Ичкени аш болбоо (бир нерсеге санааркап тынчы кетүү, санаасы тынбоо, тамак ичкенинин артыгы чыгуу)."},{"t":"p","h":"4. Ич күптү (ичте сакталган таарыныч, нааразылык)."},{"t":"p","h":"5. Иштин көзүн таануу (иштин шартын, жөнүн, ыгын мыкты билүү, билгичтик менен аткаруу)."},{"t":"p","h":"6. Каакы ордуна көрбөө (кенебөө, тоотпоо, эч сезбөө, тенсинбөө, теңине албоо, киши ордуна санабоо)."},{"t":"p","h":"<span class=\"pg\" data-n=\"239\">239<\/span>Т. Маңдайы жарык (көңүлдүү, шаттуу, капасы жок, жайдары, ачык айрым, пешенелүү)."},{"t":"p","h":"8. Кабагына кар жааган (түнөрүп ачуусу келген, ачууланган, каарданган)."},{"t":"p","h":"9. Кабагы карыш салаңдоо (капалануу, кайгыруу, уба- ` йым тартуу, түктүйгөн, түнөргөн абал)."},{"t":"h3","h":"Он бешинчи тесте"},{"t":"p","h":"1. Казаны оттон түшүү (жасап ичер тамак-ашы жок ка- ` луу, эч нерсеси жок болуп жакырлануу)."},{"t":"p","h":"2. Кайырмакка саяр эти жок (өтө арык, арыктап, бүткөн араң эле жаны бар)."},{"t":"p","h":"3. Какыс-кукус кылуу (анча-мынча сес көрсөтүү, кагыпсилкип урушуп коюу, урумуш болуп коюу)."},{"t":"p","h":"4. Камырдан кыл суургандай (өтө кылдаттык, эптүүлүк ’ менен, жигин билгизбей)."},{"t":"p","h":"5. Камыр-жумур болуу (бири-бири менен эң эле жакын, ынак болуп аралашып, алынышып кетуу)."},{"t":"p","h":"6. Кан буугандай (өтө тез, дароо, ошол замат)."},{"t":"p","h":"Т. Канга салам бербөө (анча-мынчаны теңине албай, тоотпой коюу, тың абалда болуу, оңоло түшүү)."},{"t":"p","h":"Ё 8. Кан какшоо (зарлоо, кейиштүү абалда болуу, зыркы- ‚ рап ооруй берүү, жан кейитип ооруу, кайра-кайра, улам-улам айта берүү)."},{"t":"p","h":"9. Каны кайноо (ачуусу келүү, каардануу, жини келүү, кыжырлануу)."},{"t":"p","h":"Суйлеп машыгуу 271-кенугуу. Он биринчи тестедеги сөздөрдү катыштырып оозеки ‚ сүйлөм туз. Ар бир сөз берметине бирден же эки-үчтөн сүйлөм туз. Каалооңо жараша."},{"t":"p","h":"Үлг ү: 1. Кайда жүрсөңөр да, бирөөнүн жырык ийнесин албагыла. 2. Жырык ийнесин алганда кайсы тешигиң бүтөлөт, балам. 3. Жырык ийнесине кара санабай калайын."},{"t":"p","h":"272-кенугуу. Он экинчи тестедеги ар бир сөз берметине бирден, же каалооңо жараша эки-үчтөн оозеки сүйлөм түз."},{"t":"p","h":"273-кенугуу. Он үчүнчү тесте боюнча иштелет. Муну 271-көнүгүүгө окшоштуруп иште."},{"t":"p","h":"274-көнүгүү. Он төртүнчү тесте камтылат. Бул да 272-көнүгүүгө окшош иштелет."},{"t":"p","h":"ы 275-кенугуу. Он бешинчи тесте боюнча. Бул да 272-көнүгүүдөй ` аткарылат."},{"t":"h3","h":"<span class=\"pg\" data-n=\"240\">240<\/span>«Чынжыр» оюну"},{"t":"p","h":"276-көнүгүү. Мында оозеки сүйлөм түзүүгө класстагы бардык окуучу катышат. Мугалим каалаганына жараша сүйлөм түзүүнү алдыңкы катардан (же арткы партада отурган окуучудан) баштай бериши мүмкүн. Бирок каерден башталса да, алдыдан артка, же арттан алдыга карай парта боюнча сүйлөм шакылдата түзүлүп кете берет. Сүйлөмдү шыр түзбөй токтотуп калган окуучу чынжырды үзүп алган болот. Ошондуктан буйдалып калган баланын жанындагы окуучу дароо үзүлгөн чынжырды «ширетет», демек, тез, үзгүлтүктү сездирбей сөз берметин катыштырып сүйлөм түзө салууга тийиш."},{"t":"h3","h":"1. Оюндун биринчи түрү"},{"t":"p","h":"Китепти ачып, он биринчи тестедеги сөз берметтерин кара. Оозеки сүйлөө ырааты сөз берметтеринин катары менен кетет. Бул ыраат он бешинчи тестенин соңуна чейин сакталат."},{"t":"p","h":"Улгу: Токтосун. Ыймандуулар булунгендун жырык ийнесин да алган эмес, ал эми азыркы уурулар бүлүнбөгөндү толук бүлдүрөт, жыйган-тергенин калтырбай алып кетишке аракет кылат."},{"t":"p","h":"Надырбек. Капырай, сыналгыны тиктеп отурсам, бир кыз муз үстүндө ийиктей чимирилип бийледи, өнөр деп ушуну айт."},{"t":"p","h":"Бакберген. Арак ичкен эргулундун бүгүн маанайы пас, ийне жеген иттей болуп ыңкыят."},{"t":"p","h":"(Дагы ушул сыяктуу болуп уланып кете берет)."},{"t":"h3","h":"2. Оюндун экинчи түрү"},{"t":"p","h":"Мында китеп пайдаланылбайт. Әсиңде калган сөз берметтери сүйлөм түзүшүңө көрөңгө болуп берет. Окуучулардын катары биринчи оюндун түрүндөгүдөй эле ыраат менен жүргүзүлөт."},{"t":"h3","h":"Кайталоо"},{"t":"p","h":"1. УП класс: 1—5-тестелер («Сөз бермети» топтому). $ 9."},{"t":"p","h":"2. УШ класс: 6—10-тестелер («Сөз бермети» топтому). $ 27."},{"t":"h3","h":"Жазып машыгуу"},{"t":"p","h":"27 1-көнүгүү. Он биринчи тестедеги ар бир сөз берметине бирден сүйлөм түз жана жаз."},{"t":"p","h":"Ул гу: Ал кичинесинен бирөөнүн жырык ийнесине да көз артпай чоңойду."},{"t":"p","h":"278-көнүгүү. Он экинчи тесте. Мындагы сөз берметтерине да бирден сүйлөм түз."},{"t":"p","h":"<span class=\"pg\" data-n=\"241\">241<\/span>279-көнүгүү. Он үчүнчү тесте. Муну да 277-көнүгүүдөгүдөй кылып иште."},{"t":"p","h":"280-көнүгүү. Он төртүнчү тесте. Мындагы ар бир сөз берметине бирден сүйлөм түз."},{"t":"p","h":"281-көнүгүү. Он бешинчи тестедеги сөз берметтерин да 277-көнүгүүдөгүдөй кылып жаз."},{"t":"p","h":"«Чиркеме» оюну 1. Мында эки сөз берметин бир сүйлөм кылып түзөсүн. Бул – бир тракторго эки прицеп чиркегендей эле кеп. Ушундай сүйлөмдөн бешти жаз."},{"t":"p","h":"2.Бир «тракторго» үч «прицеп» чиркейсин, демек төрт сүйлөм жазасың."},{"t":"p","h":"3. Бир «тракторго» төрт «прицеп» чиркейсин. Мүмкүнбү? Мүмкүн болсо, эки сүйлөм түзүп көр."},{"t":"p","h":"4. Бир «тракторго» беш «прицеп» чиркейсин, поездге окшоштуруп. Болгону бир суйлемге гана батырып жазасын."},{"t":"p","h":"Ушул төрт талапты аткаргандын баары, канча окуучу болсо, ошончосу тең биринчи орунду жеңип алат. Калгандары чама-чаркына жараша андан кийинки орундарга ээ болушат. «Сөз бермети» топтомунан 1—5-(УП класс), 6—10- (УШ класс) тестелерди да пайдаланууга болот."},{"t":"p","h":"«Көчмө барак» оюну Бул оюнда 10-15-тестелердеги сөз берметтери пайдаланылат. Окуучулар партанын жайгашуу ыңгайына жараша эки катар болсо төрт, үч катар болсо 6 топко бөлүнөт. Ар бир топко мугалим бирден актай барак берет. Ага топтун биринчи окуучусу сөз бермети катышкан бир сүйлөм жазып, анан аны арткы партадагыга, ал андан ары узатат. Зарылдыгына жараша көчмө барак улам кайра башынан бир нече жолу айланышы мүмкүн. Ошентип, алардын ичинен баракка сүйлөмдөрдү көп жана туура жазган топ утуп чыгат."},{"t":"h3","h":"СЫНАК"},{"t":"p","h":"Доскага мугалим он беш сөз берметин жазып коёт. Мүмкүн болушунча алар УП – ЇХ класстардын материалдарынын ичинен тандалып алынат. Анан окуучулар жапырт өз алдынча сүйлөм түзүп жазышат. Бир сөз берметине бир сүйлөм түзүү, же бир сүйлөмгө бир нече сөз берметин катыштыруу – ‚ал окуучунун эрки."}],"sub":[{"title":"Тогузунчу кайрык","b":2},{"title":"§ 39. «СӨЗ БЕРМЕТИ» ТОПТОМУ","b":44},{"title":"Он экинчи тесте","b":55},{"title":"Он төртүнчү тесте","b":74},{"title":"Он бешинчи тесте","b":84},{"title":"«Чынжыр» оюну","b":100},{"title":"1. Оюндун биринчи түрү","b":102},{"title":"2. Оюндун экинчи түрү","b":108}],"section":"ЇХ КЛАСС","pages":[235,241]},{"title":"§ 40. «МЭЭР СӨЗ» ТОПТОМУНАН","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"242\">242<\/span>§ 40. «МЭЭР СӨЗ» ТОПТОМУНАН"},{"t":"p","h":"(1-—3-чачылалар УП, 4-—6-чачылалар УШ класста өтүлгөн.)"},{"t":"p","h":"Жетинчи чачыла 1. Маралдар сууга куюлган шагылда турат. Шагылдан өйдө кызыл алоо каптаган калың бадал. Бадал арты жар, жардын үстүндөгү калың кайың, жыш терек батып бараткан күндүн кызылын сүртүнгөнсүп кырмызыланат (Ч. Айтматов)."},{"t":"p","h":"2. Бир маалда маралдар моюн толгоп, бурулуп жөнөй берди. Анан бадалга кирип кетишти. Кызыл бутактар чайкалып, кызыл жалбырактар маралдардын жумуру сооруларына күбүлүп жатты (Ч.Айтматов)."},{"t":"p","h":"3. Сүйлөсө тилге жатык, укса кулакка мукам, алыстан ала келген эне тилиңерди укум-тукумуңар унутпасын, эне тилинде эл-жерин даңазалап ырдап жүрсүн. Кишиден кем болбогула, башка элге тең болгула. Мен эми силерге, силердин укум-тукумуңарга Умай энемин, силер менен түбөлүккө бирге жүрөм (Ч.Айтматов)."},{"t":"p","h":"4. Жакшы түгөнбөйт! Жер туткасы эл болсо, эл туткасы – жакшы. Әли менен жер көрктүү. Жакшысы менен эл эстүү. Жакшысы түгөнгөн эл чачылып тентирейт. Эли түгөнгөн жерди сел алат (К.Осмоналиев)."},{"t":"p","h":"5. Тигинин аты да оңбогондой өктөм окшойт. Күрөң түстөгү көкүл-жалы, жышылган жез чылапчындай жылбырска түгү суудан чыккан кундуздай жылтылдайт. Үстүндөгүнүн түрү жылуу. Жаандын суусу далысына сарыксын үчүн кийиз калпактын мандайын кайрып койгон (К.Осмоналиев)."},{"t":"h3","h":"Сегизинчи чачыла"},{"t":"p","h":"1. Кулаарды кол токтотот, ураарды тирөөч токтотот. Ажыраганды ал жээгинен бул жээгине көпүрө өткөрөт. Әкөөбүз эки элди ажыратпай сунулуп калсак, эки устундун ачыгын бүтөп, туура ташталып жабылуучу шыптар керек. Көпүрө бүтүп, сунулуп бекип берсек, ал өйүзүнөн бул өйүзүнө бейкам чубоочу адамдар көбөйөр бекен?.. (К.Осмоналиев)."},{"t":"p","h":"2. Кылкылдап бараткан күн нуру аска учуна илинди. Аскалардан жарылып түшкөн курч кырлуу зор таштарга урунуп-согулуп, көк кашка шары таш түптөрүндө ак көбүк черте кайнаган сууну Алыбек кечип өттү (К. Осмоналиев)."},{"t":"p","h":"3. Ар кайсы жерде жерге баткан таштар. Чээнге кирген суурлар ың-жың. Ооздору үңүрөйгөн сары топурактуу ийиндер. Өзөгү каткан ак баш ышкындар. Жапалак арчалуу <span class=\"pg\" data-n=\"243\">243<\/span>күнгөй. Чанда улардын ышкырыгы угулат. Серүүн өрөөн. Серүүн ээндик. Серүүн тынчтык (К. Осмоналиев)."},{"t":"p","h":"4. Калыгул абанын бир айтканы эсимде: «Өзүндө күч барында айткан сөзүң эп болор, айылына чеп болор. Оомат оосо башындан, алжыган неме деп коёр, акмактар талап жеп коёр» (К.Осмоналиев)."},{"t":"p","h":"5. Тайлактардын тыбыт чокусунан кыска кулактарынын учу мулуят. Бу-буласа тиштери көрүнөт. Ийри моюн, кош өркөчү тик. Көбүнүн түсү түтүн сымал бозомук. Булуттан үзүлүп калгансыган актары жүрөт. Алар суу түбүндөгү май таштай алыстан эле чаңкаят (К.Осмоналиев)."},{"t":"p","h":"6. Жер таянып, ал акыркы жолу башын көтөрдү, канаты сынып бийиктен түшкөн бүркүт сыяктуу алысты, жарыкты армандуу тиктеди. Көзүнө бүт жер бети өрт каптап келаткандай кыпкызыл болуп көрүндү. Анын көзүн кан чырмап баратты (Т. Касымбеков)."},{"t":"p","h":"Тогузунчу чачыла 1. Күчтүү канаттарынын күүсү желдин шоокумун каптап, найзанын учундай ышкырып тик сайылып, Өзүнө келатты. Сарыбай нестее түштү. Ойлонтпой, камынтпай бүркүт аркан бою кирип келди, ошондо Сарыбай жерден балдакты ала коюп, бетине кармай берди. Каардуу бүркүт тайманбай көз ирмемде селдей шаркыраган күч менен келип бир тээп өттү, жыгач балдак шарт тең бөлүнүп сынып түштү (Т. Касымбеков)."},{"t":"p","h":"2. Бүркүт кайра көккө атылып чыкты. Сарыбай эсин жыйышка үлгүрө албады, бүркүт темир чеңгелдерин арбайтып, чекирейген кызыл тегерек көздөрүнөн заар чачып, ошол замат кайра шуулдап кирип келди. Өлүм! (Т. Касымбеков)."},{"t":"p","h":"Катуу чеңгелдешип, бири кышылдап, бири күшүлдөп, улам бири алдына басып, жумгалакташып, кериден ылдый тоголонушту. Сарыбай бүркүттүн башын кармоого, мойнунан бурап басууга аракет кылып, бүркүт башын ала качып карматпай, көзгө асылып, желке жүнүн түктөйтүп, жаалданып чокуп, Сарыбайдын бүт денесинен кан жошулуп, бүркүттүн канаттары карсылдап сынып, жүндөрү сапырылды (Т. Касымбеков)."},{"t":"p","h":"4. Сарыбайдын эки колу бүркүттүн темир чеңгелдерин бошотпой туткактап калган. Тизеге басуунун аракетинде. Бүркүт көзгө асылат. Сарыбайдын көздөрүнөн от чагылды. Ал акыры бүркүттүн бир чеңгелин тизеге басып, мойнун сыйпалап таап, бар күчү менен сыга кармады. Бурады (Т. Касымбеков)."},{"t":"p","h":"5. Бир убакта Сарыбай бүркүттүн калдайып жатып калган денесинин үстүнөн акырын өйдө болду. Ал көзүн ачкысы <span class=\"pg\" data-n=\"244\">244<\/span>келди. Көзү ачылбады. Көзүн сыйпалады. Колуна былжыраган бирдеме урунду. Сарыбай анын кан экенин билди. Капкараңгы. Әмелеки жаркыраган кең дүйнө кана? (Т. Касымбеков)."},{"t":"h3","h":"Көрктүү оку"},{"t":"p","h":"1. Адегенде 7 – 9-чачылалардагы ар бир мээр сөздү ичиңен үч сыйра окуп, үндүн кырааты кандай болорлугун аныкта."},{"t":"p","h":"2. Анан 7 – 9-чачылалардагы мээр сөздөрдү удаалаш, андан соң алым сабак түрүндө көрктүү окугула."},{"t":"p","h":"Сүйлөп машыгуу 282-көнүгүү. Жетинчи чачыладагы мээр сөздөрдү өз сөзүңө кошуп сүйлө."},{"t":"p","h":"Үлгү: Әл менен жакшы адамдын эриш-аркактыгы жөнүндө жазуучу Качкынбай Осмоналиев минтип айткан: «Жакшы түгөнбөйт! Жер туткасы эл болсо, эл туткасы – жакшы. Әли менен жер көрктүү. Жакшысы менен эл эстүү. Жакшысы түгөнгөн эл чачылып тентирейт. Әли түгөнгөн жерди сел алат»."},{"t":"p","h":"283-кенугуу. Сегизинчи чачыланы 282-көнүгүүдөгү үлгүгө окшош-"},{"t":"p","h":"р туруп иште."},{"t":"p","h":"284-көнүгүү. Тогузунчу чачыладагы мээр сөздөрдү да 282-көнүгүүнүн үлгүсүндө иште."},{"t":"h3","h":"Жазып машыгуу"},{"t":"p","h":"285-көнүгүү. Жетинчи, сегизинчи, тогузунчу чачыладагы 1-номерде турган мээр сөздөрдү $: «А кештеси 2-номерде турган мээр сөздөрдү «У = “© А, кештеси менен туюнтулган жазуу эрежелери боюнча жаз."},{"t":"p","h":"286-кенугуу. Жетинчи, сегизинчи, тогузунчу чачыладагы 3-номердеги мээр сөздөрдү «С» ‚ 4-номерде турган сөздөрдү"},{"t":"p","h":"кештелери менен туюндурулган жазуу эрежелери боюнча жаз."},{"t":"p","h":"287-кенугуу. Жетинчи, сегизинчи, тогузунчу чачылалардагы 5- номерде турган мээр сездерду теменку кештелер менен туюнтулган жазуу эрежелери боюнча жаз."},{"t":"p","h":"<span class=\"pg\" data-n=\"245\">245<\/span>– А"},{"t":"h3","h":"Кайталоо"},{"t":"p","h":"1. УП класс: 1-3-чачылалар («Мээр сез» топтомунда). $ 10."},{"t":"p","h":"2. УШ класс: 4—6-чачылалар («Мээр сөз» топтомунда). $ 28."},{"t":"h3","h":"§ 41. «САНЖЫРГАЛУУ КАЗЫНА» ТОПТОМУ"},{"t":"p","h":"(1-5-шыралгалар УП, 6-10-шыралгалар"},{"t":"p","h":"УШЩ класста өтүлгөн)"},{"t":"h3","h":"Он биринчи шыралга"},{"t":"p","h":"1. Алмадай башын алайын, ай баткандай кылайын."},{"t":"p","h":"2. эл эмес, ондуруучу неме эмес, илебине нан бышат."},{"t":"p","h":"3. Жаш чыбыктай солкулдап, жалооруп ыйлап болкулдап."},{"t":"p","h":"4. Кычык менен кылт этип, кыл куйругу жылт этип."},{"t":"p","h":"5. Әл ичинде эстүүлөргө, эбин тапкан сөздүүлөргө, аттуутондуу алдууларга, алыскы жолго камдууларга."},{"t":"h3","h":"Он экинчи шыралга"},{"t":"p","h":"1. Күндү катуу жайладым, күз булутун байладым."},{"t":"p","h":"2. Жол көрүнбөй түз болуп, сакалы шакшак муз болуп."},{"t":"p","h":"3. Тула бою ок экен, балбылдап көзү чок экен."},{"t":"p","h":"4. – Манас! Манас! Манас! – деп, баатыр эр мага жанаш! – деп."},{"t":"p","h":"5. Чоң кисе жанда шалпылдап, асабалуу чоң сүнгү айчыгы чыгып жаркылдап."},{"t":"p","h":"Он үчүнчү шыралга 1. «Алам» деп келип алдырат, «чабам» деп келип чалдырат."},{"t":"p","h":"2. Аркарын атып ойной жүр, акылың баштан жойбой жүр."},{"t":"p","h":"3. Аркардай бутун сайылтып, жал-куйругун жаныбар, асаба туудай жайылтып."},{"t":"v","l":["4. Жалпын атка мининер, жер арытып келинер.","5. Калкты кайтарып, душманды майтарып."]},{"t":"h3","h":"<span class=\"pg\" data-n=\"246\">246<\/span>Он төртүнчү шыралга"},{"t":"p","h":"1. Шекер десем, бал берген, суусасам шербет, жал берген, түн күзөтүп эмизген, түрлүү тамак жегизген, мамыкка багып уктаткан ардагым энем кайда экен?"},{"t":"v","l":["2. Зарурат болдум Әрмекке,","Сагындым аны көрмөккө.","3. Элинди эстеп эттенбей, энеңди самап күчтөнбөй.","4. Ичиң капа бук болмок, ичиңе кайгы жык толмок.","5. Өңүң сары жез болуп, акылың кетип нес болуп.","Он бешинчи шыралга",". Күн себелеп дыбырап, майдалай түшүп жыбырап."]},{"t":"p","h":"Айнектей көзү жалдырап, акылын таппай каңгырап."},{"t":"p","h":".Эки жагын каранып, эрди кургап жаланып."},{"t":"v","l":[". Колу-бутун чагалык, карысын жерге кагалык.",". Куудай сакал агартып, кузгундай көзүн кызартып."]},{"t":"p","h":"11-15-шыралгалар «Эр Табылды» дастанынан алынды."},{"t":"h3","h":"Жаттоо"},{"t":"p","h":"1. 11-15-шыралгаларды катары менен жатта."},{"t":"p","h":"2. Парталаштар бири-бириңерди жаттаганыңар боюнча текшергиле."},{"t":"p","h":"3. «1-шыр айтма» оюну. Шарты: 1) адегенде доскага бир окуучу чыгат; 2) ал санжыргалуу сөздүн эки-үч сөзүн айтат, партада отургандардын бири анын калганын таап, улап кетиши керек; 3) калган шыралгалар да ушул өңүттө уланат. Үлгү:"},{"t":"v","l":["Биринчи окуучу. Күн себелеп дыбырап. ...","Әкинчи окуучу. Майдалай түшүп жыбырап.","Биринчи окуучу. Жол көрүнбөй түз болуп...","Алтынчы окуучу. Сакалы шакшак муз болуп."]},{"t":"p","h":"4. «2-шыр айтма» оюну. Шарты: 1) мында да доскага бир окуучу чыгат; 2) бирок ал санжыргалуу сөздүн бир нечесин эмес, бирди гана айтат; 3) шыр айткыч анын калганын улап кетет. Улгу:"},{"t":"p","h":"Биринчи окуучу. Жаш..."},{"t":"p","h":"Экинчи окуучу. ... чыбыктай солкулдап, жалооруп ыйлап болкулдап."},{"t":"p","h":"Сүйлөп машыгуу 288-көнүгүү. Он биринчи шыралгадагы санжыргалуу сөздөрдү өз сөзүңө кошуп сүйлө."},{"t":"p","h":"<span class=\"pg\" data-n=\"247\">247<\/span>Үлгү: Каарданган баатыр: «Алмадай башын алайын, ай баткандай кылайын», – дейт."},{"t":"p","h":"289-көнүгүү. Он экинчи шыралгадагы сөздөрдү 288-көнүгүүдөгү үлгүгө окшоштуруп иште."},{"t":"p","h":"290-көнүгүү. Он үчүнчү шыралга, муну да 288-көнүгүүдөгү үлгүгө салып иште."},{"t":"p","h":"291-көнүгүү. Он төртүнчү шыралганы да 288-көнүгүүдөгү үлгүдөй иштелет."},{"t":"p","h":"292-көнүгүү. Он бешинчи шыралганы да 288-көнүгүүнүн үлгүсүндө аткар."},{"t":"p","h":"Жазып машыгуу 293-кенугуу. Он биринчи шыралгадагы санжыргалуу сөздөрдү киринди сөз катыштырып жаз."},{"t":"p","h":"Үлгү: Албетте, алмадай башын алайын, ай баткандай кылайын."},{"t":"p","h":"294-көнүгүү. Он экинчи шыралгадагы санжыргалуу сөздөргө каратма сөздү катыштырып жаз."},{"t":"p","h":"Үл г ү: 1. Күндү катуу жайладым, күз булутун байладым, досум. 2. Жигиттер, күндү катуу жайладым, күз булутун байладым. 295-көнүгүү. Он үчүнчү шыралгадагы санжыргалуу сөздөргө сырдык сөздөрдү катыштырып жаз."},{"t":"p","h":"Үлгү: Аттиң, «алам» деп келип алдырат, «чабам» деп келип чалдырат."},{"t":"p","h":"296-көнүгүү. Он төртүнчү шыралгадагы санжыргалуу сөздөрдү төмөнкү кештелерге ылайыктап жаз."},{"t":"v","l":["т. А, 4. А»","ОК УЛЫК &gt; 5.","т","3. ИА нь"]},{"t":"p","h":"297-көнүгүү. Он бешинчи шыралгадагы санжыргалуу сөздөрдү төмөнкү кештелерге ылайыктап жаз."},{"t":"h3","h":"<span class=\"pg\" data-n=\"248\">248<\/span>Кайталоо"},{"t":"p","h":"1. УП класс: 1 – 5-шыралгалар («Санжыргалуу казына» топтомунда). $ 11."},{"t":"p","h":"2. УШ класс: 6 – 10-шыралгалар («Санжыргалуу казына» топтомунда). $ 29."}],"sub":[{"title":"Сегизинчи чачыла","b":7},{"title":"Көрктүү оку","b":19},{"title":"§ 41. «САНЖЫРГАЛУУ КАЗЫНА» ТОПТОМУ","b":36},{"title":"Он биринчи шыралга","b":39},{"title":"Он экинчи шыралга","b":45},{"title":"Он төртүнчү шыралга","b":55}],"section":"ЇХ КЛАСС","pages":[242,248]},{"title":"§ 42. «ТИЛ КУТУЧАСЫ» ТОПТОМУ","blocks":[{"t

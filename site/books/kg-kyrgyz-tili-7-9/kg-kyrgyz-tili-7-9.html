 алышат."},{"t":"p","h":"Бирок мындан башкача да кырдаалга тушуктурган Өөзгөчөлүктөр бар. Ал ТСтин тутумундагы сүйлөмдөр бири-бири менен тыгыз байланышкан, аларды бөлүп-жарып жиберишке <span class=\"pg\" data-n=\"111\">111<\/span>болбойт. М.: Жарык шоола жайылгандыктан, теребел айкындала берди. Мында биринчи сүйлөмдүн «жайылгандыктан» деген баяндоочу ойду так бүтүрө айта алган жок, ошол себептүү «Жарык шоола жайылгандыктан» деген сүйлөм өзүнчө бөлүнүп кетүү мүмкүнчүлүгүнөн ажырап калды. Күнкор кейипке келди. Ал качан «теребел айкындала берди» деген омоктуу сүйлөмгө жөлөнгөндө гана ажары ачылып, кулпуруп, өзүнчө бир ырааттуу шайкештикке ээ болот, ой-пикирди, маанини толуктап турат. Демек, «Жарык шоола жайылгандыктан» деген «эмнеликтен?» деген суроого жооп берип, кийинки сүйлөмгө багыныңкы, көз каранды абалда."},{"t":"p","h":"Ошентип, жогорку бири-бирине окшошпогон эки мисалдагы өзгөчөлүктөрдүн негизинде төмөнкүдөй жыйынтык чыгарылат. Татаал сүйлөм (ТС) экиге бөлүнөт, бири – тең байланыштагы татаал сүйлөм (ТБТС), ал «Жарык шоола жайылды, теребел айкындала берди» деген, экинчиси – багынынкы байланыштагы татаал сүйлөм (ББТС), ал «Жарык шоола жайылгандыктан, теребел айкындала берди» деген мисал менен тастыкталды."},{"t":"h3","h":"ТБСТ"},{"t":"p","h":"а ББТС"},{"t":"h3","h":"§ 16. ТЕН БАЙЛАНЫШТАГЫ ТАТААЛ СҮЙЛӨМ (ТБТС)"},{"t":"p","h":"Әскертүү. ТБТСти окуп-үйрөнүүдө ушул эле окуу китебиндеги төмөнкү материалдар кенен пайдаланылат."},{"t":"p","h":"1. «Серектин сыр сандыгын» кара. Анын ичиндеги «Татаал сүйлөм» топтомун оку. Анда тиешелүү маалыматтар, эреже, мисалдар бар."},{"t":"p","h":"2. «Сабат санжырасы» топтомундагы «Боз үй» кештеси толугу менен сенин карамагында."},{"t":"p","h":"ТБТСтин тутумундагы жөнөкөй сүйлөмдөр бири-бири менен эки түрдүү байланыш жасайт, биринчиси – интонация, экинчиси – байламта аркылуу."},{"t":"h3","h":"<span class=\"pg\" data-n=\"112\">112<\/span>Өз алдынча иштөө"},{"t":"p","h":"Күн бүркөлдү, жамгыр жаады."},{"t":"p","h":"121-көнүгүү. 11.1 кештеси ТБТСтин тутумундагы жөнөкөй сүйлөмдөрдүн өз ара интонация менен байланышын чагылдырарын байкадын."},{"t":"p","h":"Бүркөлдү жана жаады деген баяндоочтор эки сүйлөмдө тең ойду так бүтүрө айтты. Әми ушул үлгүгө окшош сүйлөмдөрдү «Макал» топтомунан тап да, окуп бер (бул топтом да ушул окуу китебинде)."},{"t":"p","h":"М.: 1. «Жакшы таап сүйлөйт, жаман каап сүйлөйт». Мында эки сүйлөм өз ара интонация менен байланышты жана баяндоочтору ойду так бүтүрө айтты."},{"t":"p","h":"2. Күлүктөн күлүк чыкса, төрт аягы тыбырайт. Мында да эки сүйлөм интонация менен байланышты, бирок алар ТБТС боло албайт, анткени 1-сүйлөмдүн баяндоочу чыкса ойду так бүтүрө айта албай, 2-сүйлөмгө багыныңкы абалда калды."},{"t":"p","h":"122-көнүгүү. «Санат сөз» топтомунан жөнөкөй сүйлөмдөрү интонация менен байланышкан он ТБСТти тап жана окуп бер."},{"t":"p","h":"Үл г ү: «Дайранын көркү – кемеде, баланын көркү – энеде». 123-кенугуу. «Мээр сөз» топтомунан интонация менен байланышкан беш тең байланыштагы татаал сүйлөмдү тап жана окуп бер."},{"t":"p","h":"Үл г ү: Асмандын ошол күмүш жолу кандайдыр бир зор дыйкан кере кулач саман көтөрүп өткөн экен го, анын мол кучагынан себеленип түшкөн дан, топон береке төгүлгөн из чубатып кеткен турбайбы? (Ч. Айтматов)."},{"t":"p","h":"124-көнүгүү. Күн бүркөлдү, жамгыр жаады. Ушуга окшош беш ТБТСти өз алдыңча жаз."},{"t":"p","h":"125-көнүгүү. Ооба, аңгыча күн бүркөлдү, анан түнү бою шатырата жамгыр жаады – бул Күн бүркөлдү, жамгыр жаады деген үлгүнүн байытылып жазылганы. Сен да 124-көнүгүүдөн үч ТБТСти алып, аны байытып жаз."},{"t":"p","h":"<span class=\"pg\" data-n=\"113\">113<\/span>ү?"},{"t":"img","src":"data:image/webp;base64,UklGRgYTAABXRUJQVlA4IPoSAABQiQCdASqZAYkBPrVYqE0nJaylplUpoZAWiWkt78e9QFyx6sAw6o6hbO/oBG/l/8U8zO9b5Vk5X79mxc9r7R0R//t4ZXrQEBGRvF98OsjoZSOM2ailYH+/Nq83u8qTlNj5JgXzPY4sW8SfsQQIu86nLFnGb4+5EZF/jctOySeey/lMU1okQGrON5slfZ8N7hN5oBw/AkJU8sga/H+vga9pW3qBxBdU95p8XC6VAc351NI7x/2uM9XyNUwOOhYOE5teaDNagkabBVxWDB+KkgRZKKQXDWMuAkBFW4YUL3TPNq9FYhSsrjAzzTSLyR0tW , же кар жаайт."]},{"t":"p","h":"130-кенугуу. 11.6-кештеге 4 сүйлөм туз. Же – 2, же болбосо —2. Р"},{"t":"v","l":["л",",","2","","жана"]},{"t":"h3","h":"Кун буркелду, жамгыр жаады жана"},{"t":"p","h":"талаа жашыл ыранга беленду."},{"t":"p","h":"131-кенугуу. 11-кеште бул езгече тур деле эмес. Болгону ТБТСтин тутумундагы женекей суйлемдер ез ара интонация менен да, байламта менен да байланышат. Ушул үлгүгө окшоштуруп 8 сүйлөм туз."},{"t":"p","h":"132-кенугуу. Күн бүркөлдү жана жамгыр жаады, бирок биз колчатыр менен түк суу болгон жокпуз деген сүйлөмдү үлгүсүнө окшоштуруп, каалаган байламта менен 8 сүйлөм түз."}],"sub":[{"title":"ТАТААЛ СҮЙЛӨМДҮН БӨЛҮНҮШҮ","b":14},{"title":"ТБСТ","b":18},{"title":"Өз алдынча иштөө","b":25},{"title":"Кун буркелду, жамгыр жаады жана","b":58}],"section":"УП КЛАСС","pages":[110,114]},{"title":"&amp; 17. БАГЫНЫҢКЫ БАЙЛАНЫШТАГЫ ТАТААЛ СҮЙЛӨМ – ББТС","blocks":[{"t":"h3","h":"&amp; 17. БАГЫНЫҢКЫ БАЙЛАНЫШТАГЫ ТАТААЛ СҮЙЛӨМ – ББТС"},{"t":"p","h":"Ырас, ББТСтин түзүлүшү ТБТСке караганда көп түрдүү жана татаал. ТБТС тең ата сүйлөмдөрдүн тобунан турса, ББТС андай эмес. Ал баш жана багыныңкы сүйлөмдүн тутумунан түзүлөт. Баш сүйлөм ТСтеги негизги ойду туюндуруп, айтылган ой-пикирди жыйынтыктайт, ал эми багыныңкы сүйлөм (БС) баш сүйлөмгө (БШС) баш иет жана анын түрдүүчө кырдаалын билдирет."},{"t":"p","h":"Баш сүйлөмдүн түрдүүчө кырдаалын билдиргенине жараша багыныңкы сүйлөм тогузга бөлүнөт, алар; 1) мезгил, 2) себеп, 3) шарт, 4) максат, 5) каршы, 6) сыпат, 7) салыштырма, 8) өлчөм, 9) орун багыныңкы сүйлөмдөр."},{"t":"h3","h":"<span class=\"pg\" data-n=\"115\">115<\/span>1. Мезгил багыныңкы сүйлөм"},{"t":"p","h":"Ал баш сүйлөмдөгү ойдун мезгилин билдирет. Суроолору: качан? кайсы? убакта? качантан бери? качанга дейре? качанга чейин? кайсы учурда?"},{"t":"p","h":"ЫЫ"},{"t":"p","h":"Б"},{"t":"h3","h":"качан?"},{"t":"v","l":["-ганда,","-бай,","-майынча,","-майын,","-гыча,","-арда,","-ганча,","","М.: Күн бүркөлгүчө, чөптү чаап бүттүк.","","11.8","","Б"]},{"t":"h3","h":"качан?"},{"t":"v","l":["-гандан бери,","-гандан кийин,","-гандан мурда,","-ган сон,","-ганга дейре,","-ганга чейин,","-ар менен,","-ар замат,","-ган маалда,","-ган мезгилде,","-ган учурда,","","М.: Күн бүркөлөр замат, жамгыр жаады."]},{"t":"p","h":"Әскертүү. 1. Эми ББТСтин түзүлүш өзгөчөлүктөрүн көз алдыга даана элестетиш үчүн, ушул эле окуу китебиндеги «Сабат санжырасы» топтомунан «Ай жана боз үй» кештесинин жардамын кенен-чонон пайдаланмакпыз. Мисалы, жогорку 11.7-кештеде «Ай» багыныңкы сүйлөмдү «Боз үй» баш сүйлөмдү, «Б» багыныңкы сүйлөмдүн баяндоочун, -ганда ж.б. ага уланган мүчөнү билдирет (мындай кештелөө кийинки багыныңкы сүйлөмдөрдө да колдонулат)."},{"t":"p","h":"2. Ушул кештени минтип окуса да болот: «Әгер баш сүйлемге багынган сүйлөмдүн баяндоочуна -ганда, -бай, -майынча, -майын, -гыча, -арда, -ганча мүчөлөрүнүн бири уланса, анда <span class=\"pg\" data-n=\"116\">116<\/span>мезгил багыныңкы сүйлөм түзүлөт». Мындай эрежени багыныңкы сүйлөмдүн түрлөрүнүн ар бирине бир нечелеп түзүп алууга болот. Бирок минтүү жооп берүү үчүн эмес, так тааныпбилүү үчүн зарыл."},{"t":"p","h":"3З. Ал эми 11.8-кештени минтип окуу керек: «Әгер багынынкы сүйлөмдүн баяндоочуна -гандан, -ган, -ганга, -ар мучелеру уланып, алардын ар бирине удаа бери, кийин, мурда, сон, дейре, чейин, менен, замат деген жандоочтор, же маалда, мезгилде, учурда деген өңдүү сөздөрдүн бири жалганса, анда мезгил багыныңкы сүйлөм түзүлөт»."},{"t":"p","h":"133-кенугуу. Баш сүйлөмдү жана мезгил багынынкы сүйлөмдү тап. Багыныңкы сүйлөмгө кандай суроо берилерин, кандай мүчө уланарын аныкта."},{"t":"p","h":"Сугатчы эгиндин ортосуна келгенде, бөдөнө бырп этип учту. Ал учкан соң, дыйкан аны көпкө чейин аңкайып карап турду. Узаган жок, бир түп гүлкайырга жакын барып конду. Керилип кетмен чабар менен, туктан төмөн суу каптады. Талааны сугарып болгондон кийин, эгин өзгөчө бир көйкөлөт дейсиң. Буудай тегиз богок байлап калган кезде, аны сугарууга болбойт. Оруу-жыюу башталганга дейре, комбайн ондолуп бүтсө экен."},{"t":"p","h":"Улгу: Кун буркелгенде жамгыр жаайт. Жамгыр жаайт – баш сүйлөм. Анткени ал татаал сүйлөмдөгү ойдун натыйжасын билдирди."},{"t":"p","h":"Качан жамгыр жаайт? Күн бүркөлгөндө – бул мезгилди билгизген багыныңкы сүйлөм. Себеби «качан?» деген суроого жооп берди жана анын баяндоочуна -гөндө (-ганда) мүчөсү уланды."},{"t":"p","h":"184-көнүгүү. Багыныңкы сүйлөмдү уюштуруучу -ганда, -майынча, -майын, -гыча деген мүчөлөрдүн ар бирине бирден сүйлөм түз."},{"t":"p","h":"Үлг ү: Огунун баары түгөнгүчө, Тентимиш эчкиге тийгизе албай коёт (жомоктон). Огунун баары түгөнгүчө – БС. Анткени аны уюштурууга -гүчө (-гыча) мүчөсү катышты."},{"t":"p","h":"135-кенугуу. Багыныңкы сүйлөмдүн баяндоочуна -арда, -ганча мүчөлөрүн ула. Ар бир мүчөгө экиден сүйлөм түз."},{"t":"p","h":"ү: Таң кулан өөк болордо, жылдыздардын жарыгы солгундай баштайт. Таң кулан өөк болордо – мезгилди көрсөткөн БС. Себеби баяндоочко -ордо (-арда) мүчөсү уланды жана БС качан? деген суроого жооп берди."},{"t":"p","h":"186-көнүгүү. -гандан бери, -гандан кийин, -гандан мурда, -гандан соң деген грамматикалык каражаттарды пайдаланып, ар бирине бирден мезгил БС түз."},{"t":"p","h":"<span class=\"pg\" data-n=\"117\">117<\/span>187-көнүгүү. -ганга дейре, -ганга чейин, -ар менен, -ар замат деген грамматикалык каражаттарды пайдалан да, ар бирине бирден мезгил БС түз."},{"t":"p","h":"188-көнүгүү. -ган мезгилде, -ган маалда, -ган убакта, -ган учурда деген каражаттарды пайдаланып, ар бирине бирден мезгил БС түз."},{"t":"h3","h":"2. Себеп багыныңкы сүйлөм"},{"t":"p","h":"Ал баш сүйлөмдүн себебин билдирет. Суроолору: эмне үчүн? эмне себептүү? эмнеликтен?"},{"t":"v","l":["11.9","-гандыктан,","Б -ган үчүн,","-ган себептүү,","","эмнеликтен?","М.: Күн бүркөлгөндүктөн, жамгыр жаады."]},{"t":"p","h":"189-көнүгүү. Себеп багыныңкы сүйлөмдүн үстүнө суроосун жаз жана көп чекиттин ордуна баш сүйлөмдү толтур. Әки сүйлөм кандай каражат менен байланышкан?"},{"t":"v","l":["1. Капыстан астындагы тору аты үрккөндүктөн, ...","2. Ай сүттөй жарык тийгизгендиктен, ...","3. Шарт ойдогудай түзүлгөндүгү үчүн,"]},{"t":"p","h":"4. Аптапка чыдабай помидордун көчөттөрү солуп бараткандыктан, ..."},{"t":"v","l":["5. Ал өзү эрке бала болгон себептүү,","6. Кыштын мойну узарып кеткендиктен,","Тилеги ишке ашпагандыктан,"]},{"t":"p","h":"ү: Капыстан астындагы тору аты үрккөндүктөн, жаш өспүрүм кулап кала жаздады. Мында баш сүйлөм – Жаш өспүрүм кулап кала жаздады. Эмнеликтен жаш өспүрүм кулап кала жаздады? Капыстан астындагы тору аты үрккөндүктөн – бул БС. Байланыштырган мүчө -көндүктөн (-гандыктан). Калганын да ушундайча иште."},{"t":"p","h":"140-көнүгүү. Көп чекиттин ордуна баш сүйлөмдү жаз. Кандай грамматикалык каражат менен байланышканын аныкта."},{"t":"v","l":["1. Кар очойто жаап салгандыктан,","2. Кар очойто жаап салганы учун, ...","8. Кар очойто жаап салган себептүү, ...","<span class=\"pg\" data-n=\"118\">118<\/span>4. Быйыл бышыкчылык эрте келгендиктен, ...","5. Быйыл бышыкчылык эрте келген себептүү, ...","6. Быйыл бышыкчылык эрте келген үчүн, ..."]},{"t":"p","h":"141-көнүгүү. Салыштыр: биринчи менен экинчини, үчүнчү менен төртүнчүнү, бешинчи, алтынчы, жетинчи сүйлөмдөрдү, алардын өз ара окшоштугу жана айырмасы барбы?"},{"t":"p","h":"огон ль. Жамгыр көп жаагандыктан, быйыл ташка да чөп чыкты.. Театрга эл көп келгендиктен, бош орун калбаптыр.. Күлүгү чыкпагандыктан, саяпкер мункуреду. Театрга эл көп келсе, бош орун калбаптыр."},{"t":"p","h":". Жамгыр көп жааса, быйыл ташка да чөп чыкты."},{"t":"p","h":". Күлүгү чыкпай, саяпкер мункуреду."},{"t":"p","h":". Күлүгү чыкпаса, саяпкер мүңкүрөдү."},{"t":"h3","h":"3. Максат багыныңкы сүйлөм"},{"t":"p","h":"Ал баш сүйлөмдүн максатын билдирет. Суроолору: эмне үчүн? эмнеге? эмне максат менен?"},{"t":"v","l":["-уу","","-00 учун,","","эмне учун?"]},{"t":"p","h":"М.: Балага суук тийбесин деп, апасы ичик тигип берди. 142-кенугуу. Максат багынынкы суйлемдегу багынынкы суйлем менен баш суйлемду кандай грамматикалык каражаттар байланыштырып турганын аныкта."},{"t":"p","h":"Үйдүн жерпайы бекем болсун үчүн, таманына киши бою цемент куюп чыгышты. Баласынын ден соолугу чың болсун үчүн, атасы аны күнүгө эки маал жарым сааттан чуркап турууга көндүргөн. Жаш малдын эти толсун деп, эрте жазда эле быштыны жайлоонун төрүнө чыгарып жиберген. Жан сактоого бүйрө адам болуш үчүн, Нурбек соода менен алпурушуп жүрөт. Үч-төрт торпок болуп калсын деп, Медербек ылайдай семиз бээсин сатууга базарга алып барды. Мөрөй биздики болуш үчүн, биз тынымсыз машыктык."},{"t":"p","h":"<span class=\"pg\" data-n=\"119\">119<\/span>Үл г ү: Мөрөй биздики болуш учун, биз тынымсыз машыктык. Биз тынымсыз машыктык – баш сүйлөм. Мөрөй биздики болуш үчүн – максатты көрсөткөн БС. «Әмне үчүн?» деген суроого жооп берет. Баяндоочуна -уш (-ыш) мүчөсү, үчүн жандоочу жалгашты."},{"t":"p","h":"148-көнүгүү. Жогорку көнүгүүнүн грамматикалык каражаттарын өзгөртүп жаз."},{"t":"p","h":"Үлг ү: 1. Үйдүн жерпайы бекем болсун үчүн, таманына киши бою цемент куюп чыктык. 2. Үйдүн жерпайы бекем болсун деп, таманына киши бою цемент куюп чыктык."},{"t":"p","h":"3. Үйдүн жерпайы бекем болуу үчүн, таманына киши бою цемент куюп чыктык. 5. Үйдүн жерпайы бекем болуш учун, таманына киши бою цемент куюп чыктык. Демек, 1-сүйлөм беш түрлүү болду, а калганычы?"},{"t":"p","h":"144-көнүгүү. Көп чекиттин ордуна кандай баш сүйлөм келет? Таап жаз."},{"t":"p","h":"фо ль го ©. Чабылган чөп чирип кетпесин учун,. Чабылган чөп тез кургап кетсе деп,. Чабылган чөп тез чирип кетпесе деп, .... Чабылган чөптүн бүрү күбүлүп калбаш учун, ..."},{"t":"p","h":". Чабылган чөп чирип кетпесин деп,"},{"t":"v","l":[". Чабылган чөп тез кургап кетсин үчүн,","","Т. Чабылган чөп талаада чирип калбас үчүн,","","4. Шарттуу багыныңкы сүйлөм"]},{"t":"p","h":"Ал баш сүйлөмдөгү ойдун шартын билдирет. Суроолору: эмне болсо? эмне болбой?"},{"t":"v","l":["11 -са","-саң"]},{"t":"img","src":"data:image/webp;base64,UklGRuIOAABXRUJQVlA4INYOAAAwdwCdASqZAYYBPrVaqU4nJSymJRMpkZAWiWluvHzMJO/egAVJ14xeu9AP/knmTn2PMA167lHolv/zw0hrTd3d3d3amLzUl8ytc1mZmam5 ен жайында Таластагы балдардын эс алуу лагерине барсам, сен да досторуң менен кел. Калган Г, П, Ш, ТУ топтогу суйлемдерду да ушундайча кайра тузесун."},{"t":"v","l":["147-кенугуу. Кеп чекиттин ордуна баш сүйлөмдү жаз.","1. Эрланды атасы окууга жиберсе, ...","2. Мал каралбай калса, ...","3. Сүрөтчү болуу тилеги ишке аша турган болсо, ...","4. Кулун кезинен жакшылап бакса,"]},{"t":"p","h":"5. Әгер техника менен технологиянын тилин баарыбыз тегиз өздөштүрсөк, 6. Ичи тардыгын жойсо, ... 7. Ал арак ичүүнү биротоло таштаса, ..."},{"t":"h3","h":"5. Каршы багыныңкы сүйлөм"},{"t":"p","h":"Ал баш сүйлөмдөгү ойго каршы мааниде айтылат."},{"t":"p","h":"Суроолору: эмне болсо да? эмне болгону менен? кантсе да?"},{"t":"p","h":"-са да"},{"t":"v","l":["-са деле","Б -са дагы К","-ган менен","-ганы менен","-ганы болбосо","","эмне болсо да?","М.: Күн бүркөлсө да, жамгыр жааган жок."]},{"t":"p","h":"148-көнүгүү. Көчүрүп жаз. Анан баш сүйлөм менен БСны аныктап айтып бер."},{"t":"p","h":"Сыр аяктын сыры кетсе да, сыны кетпейт. Жакшынын өзү өлсө да, сөзү өлбөйт. Кумурсканын өзү кичинекей болсо да, кайраты тоо томкорот. Өпкөнүн өзү чоң болсо да, кубаты <span class=\"pg\" data-n=\"121\">121<\/span>бир кесим майча болбойт. Ашым калса да, ишим калбасын. Оозу кыйшык болсо да, байдын уулу сүйлөсүн (макалдар). Калкайып турган кара таш кар болуп эрип кетсе да, түшүрбөй = колдон бул тууну түбөлүк алып жүрөбүз (Жоомарт). Оозундан чыккан сөзүңө зоо куланып учса да, эл менен сен адамсың (Арстанбек). Жараткан көзүн алса да, жүрөгү ырдап турчу эле (Осмонкул)."},{"t":"p","h":"149-көнүгүү. Көп чекиттин ордуна тиешелүү баш сүйлөмдү жаз."},{"t":"p","h":"1. Минген аты жүрбөй калса да, ..."},{"t":"v","l":["2. Кар жааганы менен, ...","3. Күпүлдөп суу ташыганы менен,","4. Айдоо талаасы тез айдалып бүтсө дагы, ...","5. Алчалар эрте бышканы менен, ...","6. Карышкыр качса да, ..."]},{"t":"p","h":"7. Башына Алыкулдун китебин жазданып жатса дагы, ..."},{"t":"p","h":"6. Сыпат багынынкы сүйлөм Ал баш сүйлөмдөгү ойдун  бороон жер челип боздойт. 2. Зооканын курч мизи боорун тилип кеткенсип (же тилип кеткендей), бороон улуп-уңшуп ыйлайт. 8. Асканын курч мизине боору тилинип кала тургансып (же тилинип кала тургандай), ызырынган бороон ышкырат."},{"t":"p","h":"152-көнүгүү. Биринчи сүйлөмдөгү «боёп койгонсуп» деген баяндоочту кийинки өзүң түзгөн төрт сүйлөмдө «боёгонсуп», «чайып койгонсуп», «чайыгансып», «кештелеп койгонсуп» деп өзгөрт."},{"t":"p","h":"1. Бет алдыбыздагы кең жайык алтын түс менен боёп койгонсуп, көөлгүгөн жана көйкөлгөн эгин талаасы карагынды келтирет. 2. ... Ат:"},{"t":"h3","h":"7. Салыштырма багыныңкы сүйлөм"},{"t":"p","h":"Ал баш сүйлөмдөгү ойго салыштырылып айтылат. Суроолору: кандай? эмне болгон сыяктуу? эмне болгондон бетер?"},{"t":"p","h":"11.14"},{"t":"v","l":["Б","-дай,","-ган шекилдүү,","-ган сыяктуу,","-гандан бетер,","-ган сыңары","","эмне болгондой?"]},{"t":"p","h":"М.: Нөшөр төгүп өткөндөй, талаа белден баткак."},{"t":"p","h":"4 11.15"},{"t":"p","h":"Кандай Б -са, ошондой"},{"t":"p","h":"М.: Жамгыр кандай болсо, түшүм дал ошондой."},{"t":"p","h":"<span class=\"pg\" data-n=\"123\">123<\/span>153-кенугуу. Салыштырма БС баш сүйлөм менен кандайча байланышканына байкоо сал. 7Т-9-суйлемдердегу бош орунга тиешелүү сөздөрдү жаз."},{"t":"v","l":["1. Атай комуз черткендей,","2. Атай комуз черткенден бетер,","3. Атай комуз черткен сыяктуу,","","4. Атай комуз черткен сыңары,","5. Атай комуз черткен шекилдүү,","баарыбыз кулак","түрүп","калыптырбыз"]},{"t":"p","h":"6. Тегирмендин ташы калдырттап кулап келаткандан бетер, күн күркүрөйт. 7. Тегирмендин ташы. ... келаткан сыяктуу, .... 8. Тегирмендин ташы. ... келаткан шекилдүү, 9. Тегирмендин ташы ... келаткан сыңары, ..."},{"t":"p","h":"154-кенугуу. Көчүрүп жаз. Баш сүйлөм менен БСти ажыратып айтып бер."},{"t":"p","h":"Баланын дээри кандай болсо, иши да ошондой. Окуучунун зээни кандай болсо, билими да ошондой. Мээнеткечтин тапканы кандай болсо, татканы да ошондой болот. Сыйлык кандай болсо, сыймык да ошондой болот да. Мугалим кандай болсо, анын окуучусу да так ошондой экени жалганбы. Пейилиң кандай болсо, адамдык парасатын да дал ошондой."},{"t":"h3","h":"8. Өлчөм багынынкы сүйлөм"},{"t":"v","l":["Ал баш сүйлөмдөгү ойдун өлчөмүн билдирет.","11.16","канча","Б -са,","канчалык","А","ошончо","","ошончолук"]},{"t":"h3","h":"М.: Жамгыр канчалык көп жааса, түшүм ошончолук"},{"t":"p","h":"көп болот."},{"t":"p","h":"155-кенугуу. Көчүрүп жаз. Анан баш сүйлөм менен өлчөмдү билгизген БСти айырмалап айтып бер."},{"t":"p","h":"Төө канча болсо, жүк ошончо (макал). Досуң канча болсо, душманың да ошончо (макал). Күчүм канча жетсе, ошончо окутам (Ч.Айтматов). Айдоо канчалык кеч айдалса, ал түшүмгө ошончолук залалын тийгизет. Канчалык эрте турсан, көңүлүң ошончолук сергек болот. Баласы канча болсо, түйшүгү да ошончо. Дүнүйө канчалык көп болсо, жерге кирсин, анын азабы да ошончо (эл оозунан)."},{"t":"p","h":"<span class=\"pg\" data-n=\"124\">124<\/span>156-көнүгүү. Көп чекиттин ордун туура толтур."},{"t":"p","h":"Мен канчалык көп окусам, ошончолук көптү билем. Сен канчалык аз окусан, ..."},{"t":"v","l":["Сиз канчалык көп окусаңыз, ...","Ал канчалык аз окуса,","Биз канчалык","Силер канчалык","Сиздер канчалык","Алар канчалык","Бош убактысында ... окуса, ... көп билет."]},{"t":"h3","h":"9. Орун багыныңкы сүйлөм"},{"t":"p","h":"Ал баш сүйлөмдө айтылган ойдун ордун билдирет."},{"t":"p","h":"11.17"},{"t":"v","l":["кайда","кайсы жерде Б -са,","кандай","ошерде","ошол жерде","ошерден"]},{"t":"h3","h":"М.: Жамгыр кайсы `жерде жааса, берекенин баары"},{"t":"p","h":"ошол жерде."},{"t":"p","h":"157-көнүгүү. Көчүрүп жаз. Баш сүйлөм менен багыныңкы сүйлөмдү ажырат."},{"t":"p","h":"Мээнет кайда болсо, береке ошерде (макал). Оору кайда болсо, жан ошол жерде (макал). Соку кайда болсо, сокбилек да ошерде (макал). Алтын кайдан чыкса, ошерди каз (макал). Саанчы кайда болсо, сабаа ошол жерде (макал). Мергенчилер кайда барышса, Жапар экөөбүз ошол жерге барабыз (К.Жантөшев). Той-тамаша кайсы жерде болсо, Ыманбай Сараласы менен ошол жерде (Т. Сыдыкбеков)."},{"t":"p","h":"158-көнүгүү. Көп чекиттердин ордун толтур. Ошондо ар биринин баш жана багыныңкы сүйлөмү бар 15 татаал сүйлөм түзүлөт."},{"t":"raw","h":"<h4 class=\"mk\">Г. ПЕ<\/h4>"},{"t":"p","h":"‚ Мен кайда окусам, сен да ошол жерден окуйсун."},{"t":"v","l":[". Сен кайдан окусан,",". Сиз кандай окусаныз,",". Ал кайдан окуса,",". Биз кайдан окусак,",".Силер ...","‚ Сиздер...",". Алар ="]},{"t":"p","h":"<span class=\"pg\" data-n=\"125\">125<\/span>Ш. 1. Мен каерде болсом, ... | ТҮ. 1. Биз каерде болсок, ..."},{"t":"p","h":"2. Силер"},{"t":"v","l":["3. Сиздер ...","4. Алар"]}],"sub":[{"title":"1. Мезгил багыныңкы сүйлөм","b":3},{"title":"2. Себеп багыныңкы сүйлөм","b":25},{"title":"3. Максат багыныңкы сүйлөм","b":40},{"title":"5. Каршы багыныңкы сүйлөм","b":72},{"title":"7. Салыштырма багыныңкы сүйлөм","b":95},{"title":"8. Өлчөм багынынкы сүйлөм","b":108},{"title":"М.: Жамгыр канчалык көп жааса, түшүм ошончолук","b":110},{"title":"9. Орун багыныңкы сүйлөм","b":117},{"title":"М.: Жамгыр кайсы `жерде жааса, берекенин баары","b":121}],"section":"УП КЛАСС","pages":[115,125]},{"title":"§ 18. СИНТАКСИСТИК ТАЛДОО","blocks":[{"t":"h3","h":"§ 18. СИНТАКСИСТИК ТАЛДОО"},{"t":"p","h":"(Татаал суйлем боюнча)"},{"t":"p","h":"Окутуунун майнаптуулугун жогорулатууда синтаксистик талдоонун мааниси зор. Б. Өмүралиев"},{"t":"p","h":"Талдоо аркылуу гена татаал сүйлөм ийне-жибине че- Шин таанылат жана аңдалып түшүнүлөт. Бул аны, баарынан мурда, көрө билүү үчүн да керек. Анан таанылган, көрө билинген нерсени өзгөчөлүктөрү боюнча кароолго аласың. Бул – малдын этин жиликтегендей кеп, биринин эти экинчисине кетирилбейт, чеберчилик, этияттык менен так иштелет. Минтүү – катуу тартип. Так ошондой эле татаал сүйлөм да жиликтелет, башкача айтканда, жик-жиги менен бөлүктөргө ажыратылат да, маани-маңызы, орду, байланыш каражаттары көңүлдөн өткөрүлөт. Бирок эң негизги жана эң башкы. нерсе – ушунун баарын өз акылың менен иштейсиң. Анда ишиңди илгерилетүү үчүн колуңду узартар төмөнкү төрт үлгү сага тартууланат."},{"t":"p","h":"1-үлгү Талдоо туура башталышы үчүн, баарынан мурда, татаал сүйлөмдү көрө билүү керек."},{"t":"p","h":"1. Урматтуу эл-журт, бүгүнкү бейкутчулук баарыбыздын байлыгыбыз."},{"t":"p","h":"2. Ал анчалык мазасыз, күчсүз, коркок эмес."},{"t":"p","h":"8. Айгайлаган кыйкырык-чуу күчөйт, абыр-дабыр дүбүрт калың жерди дүңгүрөтөт (Т.Сыдыкбеков)."},{"t":"p","h":"Ушул үч сүйлөмдүн ичинен кайсынысы татаал сүйлөм? Карап көрөлү. 1-мисалда Урматтуу эл-журт – бул каратма сөз жана ал өзүнчө сүйлөм эмес. Демек, бул мисал ТС боло албайт. 2-мисалда үч бир өңчөй мүчө бар, алар сүйлөмдүк касиетке ээ боло албайт. Демек, бу да ТС эмес. 3-мисалда эки жөнөкөй сүйлөм бар: 1) Айгайлаган кыйкырык-чуу күчөйт, 2) абыр-дабыр дүбүрт калың жерди дүңгүрөтөт. Бул – ТС."},{"t":"p","h":"Демек, үтүрү бар сүйлөмдүн баары ТС боло бербейт, алардын ичинен тутумунда эки же андан ашык жөнөкөй сүйлөмү <span class=\"pg\" data-n=\"126\">126<\/span>бары гана татаал сүйлөм боло алат. Ошентип 8-мисал – татаал сүйлөм. Демек, биринчи шарт – татаал сүйлөмдү көрө билүү жана тааный алуу керек."},{"t":"h3","h":"2-үлгү"},{"t":"p","h":"1-үлгүдө татаал сүйлөмдү башкалар менен чаташтырбай туура аныктадың дейли. Эми кадамды андан ары шилтейсин. Бул ТС тен байланыштагы татаал суйлембу, же багынынкы байланыштагы татаал суйлембу? Аныктоо керек. Ал учун теменку эки суйлем салыштырылат."},{"t":"p","h":"1. Үлп эте жел сокту, чөйчөктөй көлмөнүн бети чыбырчыктады."},{"t":"p","h":"2. Шамал болгон соң, тулаң чөп менен буудайык аралаша өскөн талаа көлдөй толкуду."},{"t":"p","h":"Биринчи мисалда эки жөнөкөй сүйлөм интонация менен байланышты. Бирок айырмалуу өзгөчөлүк – экөөнүн тең баяндоочторунун ойду так бүтүрө айткандыгы. Бул сокту, чыбырчыктады деген баяндоочтор эки сүйлөмгө тең аталык, багынбастык касиет берет жана ТС өз алдынча эки сүйлөмгө ажыратып жиберүүгө да кудурети жетет. М.: 1. Үлп эте жел сокту."},{"t":"p","h":"2. Чөйчөктөй көлмөнүн бети чыбырчыктады (кошмоктошпой өз алдынча жашаган мындай сүйлөмдөр толуп жатпайбы). Демек, 1-мисал – ТБТС. Ал эми 2-мисал 1-мисалдан кескин айырмаланат. Анын биринчи сүйлөмү өзүнчө сүйлөм болгону менен, болгон соң деген баяндоочу ойду так бүтүрө айта албайт, өксүйт. Жана да Тулаң чөп менен буудайык аралаша өскөн талаа көлдөй толкуду деген сүйлөмгө күнкор, баш иет. Качан? деген суроого жооп берет. Демек, Шамал болгон сон – багыныңкы сүйлөм. Ошентип, 2-мисал баш жана багыныңкы сүйлөмдөн түзүлгөндүктөн, ал ББТС болот."},{"t":"p","h":"Демек, талдап билүүнүн негизинде эки мисалдын биринчиси – тен байланыштагы татаал сүйлөм, экинчиси – багынынкы байланыштагы татаал сүйлөм. Мындай түрлөрдү ажырата, көрө билүү – экинчи шарт."},{"t":"p","h":"3-улгу (ТБТС боюнча) Эми сен тең байланыштагы татаал сүйлөмдү айрып таанып алдын, эми ага талдоо жүргүзүшүң керек. Кантип? Дагы мисалга кайрылабыз."},{"t":"p","h":"кулан өөк салды, биз сугатка кеттик. Мында жөнөкөй сүйлөмдөр интонация менен гана байланышты."},{"t":"p","h":"2.'Таң кулан өөк салды жана биз сугатка кеттик. Жөнөкөй сүйлөмдөр жана байланыштыргыч байламтасы менен байланышты. <span class=\"pg\" data-n=\"127\">127<\/span>Үтүр коюлбайт, себеби жана өзүнөн мурунку, өзүнөн кийинки келген сүйлөмдүн экөөнө тең таандык болуп айтылат."},{"t":"p","h":"3. Таң кулан өөк салды да, биз сугатка кеттик. Эки сүйлөмдү байланыштыргыч да байламтасы жалгаштырды, ал өзүнөн мурунку сүйлөмгө таандык болуп айтылгандыктан, андан кийин үтүр коюлду."},{"t":"p","h":"4. Таң кулан өөк салды, бирок биз сугатка кеткен жокпуз. Мында эки сүйлөмдү бирок деген каршылагыч байламта байланыштырды, ал өзүнөн кийинки сүйлөмгө таандык болуп айтылгандыктан, үтүр андан мурда коюлду. Демек, мында жөнөкөй сүйлөмдөр өз ара кандай каражаттар менен байланышкандыгы ачык көрүнүп турат. Ал эми ар бир сүйлөм жөнөкөй сүйлөм сыяктуу эле талданат."},{"t":"p","h":"4-үлгү (ББТС боюнча) Багыныңкы байланыштагы татаал сүйлөмдү төмөнкүдөгүдөй талдоого болот."},{"t":"p","h":"М.: Таң кулан өөк салар замат, биз сугатка кеттик. Адегенде баш жана багыныңкы сүйлөмдөрдү аныктап алабыз. Биз сугатка кеттик – баш сүйлөм, Таң кулан өөк салар замат – багыныңкы сүйлөм. Анткени качан деген суроого жооп берет, -ар мүчөсү менен замат деген жандоочтун жардамы аркылуу уюштурулду. Демек, мезгил багыныңкы сүйлөм. Калган багынынкы сүйлөмдөр да ушундай талданат."},{"t":"p","h":"159-кенугуу. Татаал сүйлөмдү тап."},{"t":"p","h":"1. Кара кундуздан тигилген кыргак тебетейинин жылбырска тышталган шоңшогой төбөсүнө тагылган кызыл чачык желге лепилдейт. 2. Көкүлү түйдөктөшүп, көзү жалооруйт. 3. Төшүнөн, соорудан, колтуктан ак көбүк боржоктойт."},{"t":"p","h":"4. Арийне, бала салмагын сезген азоо кайрадан чыйралат, туйлайт. 5. Булар кандайдыр бир жоноюлдун ачыгына келген кезде, наркы калың чердин караңгылыгынан чыга калган караан буларды тике качырды. 6. Ошентсе да жер тамыры жыш, терең болгондой эле, эл тамыры да жыш, терен. Т. Билгилигин мокосо, кара күчүң жетим (Т.Сыдыкбеков р"},{"t":"p","h":"160-кенугуу. Төмөндөгүлөрдүн кайсынысы багынынкы, кайсынысы тең байланыштагы татаал сүйлөм экенин оозеки аныкта. Ї Мылгун канча сөгүп жер-жеберине жетсе да, шамалдын бакшысы былк этпей койду. Агүкүктүн көзү курч болот, туманда да, түнкүсүн да күндүзгүдөй көрө берет (Ч. Айтматов). Тоолор, андан ары калдайган булут, анан асман."},{"t":"p","h":"<span class=\"pg\" data-n=\"128\">128<\/span>п Атаганат, ушу түн ичинде капилет жел туруп, капилет добул согуп, аалам астын-үстүн түшсө, асман ачылып, жылдыз көрүнсө ээ! Бирок бул түн да пейилин жумшартпады, желдин эпкини сезилбеди, толкундун шапатасы урбады, дүйнө тилсым тынчтыкка басылып, тырп этпей жатты (Ч. Айтматов). ш Май чырактын өлүмсүк жарыгында үстүнөн апасынын жаны ачыган жүзү көрүнүп, айланып-кагылган үнү угулуп, өзү алсырап суусап жатканы эсинде. Күн менен Аалам жарала электен мурдагы караңгылык, бүгүн анын туткунунда калган чалдыбары жок кайыктагы төрт адам (Ч. Айтматов). ТУ Анан караса, езу эле жалгыз калыптыр. Жан да жок, ун да жок, көлөкө да жок. Көзү көргөн жакка чуркагысы келди, бирок тегеректе жалаң толкун, жалаң суу, башка эчтеме илинбейт (Ч. Айтматов). Өзү барып катылбаса, жылан эч кимди чакпайт экен. Алынбаган өчү бар сыяктанып, кээ бир балдар аны өлтүрүүдөн кайра качпайт."},{"t":"p","h":"ү Даркан Билги колун тартып да койбойт, эчтеме болбогондой бейпил кейипте туруп берет. Кан дирилдеп атып, сүттөй аппак кунандын алтындай саргыч жалынан, зээринен ылдый кызыл гүл болуп төгүлөт. Кишилигин -— эсиң, бул касиетиң болбосо өңгө макулуктан ашыкча эмессиң (Т.Касымбеков УТ Жети атасы кул болгон эрге келкел бир келет, кие өнбөс кум толгон жерге келкел бир келет, жети жолу чабылган, кетпес шорго кабылган элге келкел бир келет (Т. Касымбеков). Тунарып турган бийик тоо түз болуп жерге чөксө да, түшүрбөй колдон бул тууну түбөлүк алып жүрөбүз УП Ийрилип аккан чоң өзөн ийнеде учук жипке окшойт, чытырман токой, калың бак чырымтал бетте түккө окшойт (Жоомарт). Мен өзүмдү эр көкүрөк көрсөм да, ээрчип жүргөн көлөкөңдөй санадың (Мидин). Айрыкча шандуу байкасан, атканда тоодон кашка таң (Байдылда)."},{"t":"p","h":"<span class=\"pg\" data-n=\"129\">129<\/span>ҮШ Көгөрүп жаткан Ысык-Көл, жел менен ойноп турчу элен, жээгинди бойлоп жүргөндө (Жоомарт). Мен өлүп, сени экинчи көрбөсөм да, эскирген сары кагазда ырым калат (Мидин). Көп жолу тиктеп түпкүрүн, көрбөдүм мунун түк кирин (Байдылда)). Хх Качан жүрөк кагышынан танганда, бир тартылып өтүп кетер элесиң (Мидин). Акса да ташка соктуга, аялдоо мында жок тура, күүлөнүп келип бир тиет көбүргөн бойдон коктуга. Көл болбой эгер кыз болсо, көз тиймек экен капкачан"},{"t":"p","h":"161-көнүгүү. Адегенде жаз. Анан ТБТСтин өз ара байланышуу жолдорун айтып бер."},{"t":"p","h":"Эр-Кишинин жээрде сакалы чачырайт, ал бирде он жагына, бирде сол жагына моюн бура беру карашты салат (Т. Сыдыкбеков). Кириск чаңырып ыйлап жиберди, бирок аны уккан жан болбоду, эч кимде аны карар арга жок эле (Ч. Айтматов). П Ойдо, тоодо, тээ адыр жайыктарда ар тулук мал жылдыздай чачырап жайылууда, аларды көзөмөлдөгөн уйчукойчулары көрүнсө көрүнөт. Тирүүсүндө жанындагы уланды көптүкөргөн Эр-Киши тестеги кайыштай ийлейт – аны өзүндөй коркпос этет (Т.Сыдыкбеков)."},{"t":"p","h":"пш Ой-тоону оттогон жапайы кайберендер тынч, бейкапар: черден чыга калган бугу атчандарга маңкая карайт (Т. Сыдыкбеков). Балыктан кийин кичине суу ичишкен, бирок аз өтпөй мурдагыдан беш бетер суусап чыгышты (Ч. Айтматов). ТУ Адашкандар түнү бою күдөр үзбөй күтүштү, бирок эч өзгөрүү болбоду, асман ачылбады, жылдыздар жыбырап жайнап чыкпады, деңиз түнөргөн көр караңгынын астында көрүнбөй көлбүп жата берди. Анан колундагы калакты деңизге ыргытып ийди да, бетин баса өңгүрөп-өксөп ыйлады (Ч. Айтматов)."},{"t":"p","h":"У Түн бир убак, бирок Курманжан отту өчүрбөйт. Киши кишиге жакшы күндө жакын, а башыңа иш түшкөн чагында <span class=\"pg\" data-n=\"130\">130<\/span>киши кишиге калыс, алыс – кошо өрттөнбөйт, кошо өлбөйт. Дагы бир түркүн адам кездешет – өзү келип ыкташпайт, өзү жагынып сырдашпайт (Т. Касымбеков)."},{"t":"p","h":"УТ Туру жай, кабактары ачык, булар жаман кабар жеткирчу чабарман да эмес, же айдап кетчү болуштан келген жасоол да эмес. Курпенден бирди сойдура бер, коңшуларды кечкиге чакырт, бу колунан күү, оозунан мээри төгүлгөн баланы көрүп калышсын (Т. Касымбеков)."},{"t":"p","h":"УП Өргөө жасалгалуу – улагадан төрүнө дейре талдырма ала кийиз, кызыл төрбөлжүн төшөлгөн, үстүнө шайы төшөктөр эки бүктөлө салынган, он эки канат керегесине сыйралай калың килем тартылган. (Т. Касымбеков)."},{"t":"p","h":"162-көнүгүү. Адегенде жаз, анан ББТСти түрлөрү боюнча аныкта. т Кургак жерде эки буттун кучуне сыйынсан, денизде эки колдун кучуне сыйынасын. Ан сайын таноолору дердендеп, бетиндеги ууру сепкилдери таруудай жайнап чыга келет. П Тундегу алааматтан кийин алдан тайгандар кана жутуп алсын деп, бу жолу баарына аз бексе ожоо суу берди. Кириск уктап жатса да, кээ бир сездер алыстан узул-кесил угулат. ш Кириск кичине басылганда, Әмрайин өз ордуна барып отурду. Туман тараса, асмандагы жылдыздар менен багытты аныктап алса болот."},{"t":"p","h":"ТУ Табиятынан алибеттуу жаралган Эмрайин канча кайраттанса да болбой, ачкалык менен суусагандык ал-кубатын курутуп баратты."},{"t":"p","h":"У Бара-бара таптакыр алсырап, калган сууну ичүү да оюна келбей калды. Күүгүм мунарык аз-аздап суюлуп, асмандын этек жактары жээктене баштаган (Ч. Айтматов)."},{"t":"p","h":"УТ Колунан көөрү, тилинен мээри төгүлүп турса да, ойлогон оюна, каалаган мудаасына жеталбай өксүп кете бергенби?! Күн жайылган кезде сурнай үнү чыга баштады."},{"t":"p","h":"<span class=\"pg\" data-n=\"131\">131<\/span>УП Эми гана кылтыя жарылган чанагы көтөрүлө бой салып, кызгылт сары ыйык нурдун шарапаты гүл таажыларын тойго жасанткан эрке, көйрөң кыздарындай кылка-кылка сеңселтип жиберди. ҮШ Ал мээр таш дубалды тешип өткөн нур таризде анын тула боюна куюлуп, жүрөгү гана аптыга бүлкүлдөп, арбала телмирип калгансыды. Биртике өмүр сүрсөң да, азиз өмүрдү адилет ишке зарптамак абзел экен (Т. Касымбеков)."},{"t":"p","h":"Кийиз кимдики болсо, билек ошонуку. Тартип кайда болсо, жеңиш да ошол жерде. Дили кандай таза болсо, тили да ошондой таза."},{"t":"p","h":"х Ээси кандай болсо, малы да ошондой. Билек бир болгону менен, манжа башка. Канчалык тырышып эмгектенсең, ошончолук үзүрүн көрөсүң."},{"t":"p","h":"Чагылган жарк эткенде, корккон бала жүккө жабыша түштү. Бороон учуруп кете тургансып, Үсөнтур кабат-кабат кийинип алыптыр. Ал эми кышында күн ысып тургансып, Санжар биздикине жука кийим менен келди."},{"t":"v","l":["Өзүңдү сынап көрсөң ...","(Ыктыярын боюнча)"]},{"t":"p","h":"Төмөндө бир кылка эмес, түрмөк-түрмөк болуп чокмороктошкон сүйлөмдөрдү талдоо сунуш кылынат. Ырас, алар жеңил эмес. Атүгүл атайылап талдоонун үлгүсү да берилбейт. Албетте, багыныңкысы да, багыныңкы эмеси да өтмө катар аралаш, бири-бирине эптеше, машташа кыналышкан сүйлөмдөр – булар сен үчүн белгисиздик. Ойлон. Изден. Ї Әрге келкел келгенде: адилети бек болот, айткан сөзү эп болот, кыйышпасы көп болот, туугансынып душманы төгөрөгү төп болот. Әрге кеткет келгенде: уурулук кылып келини, уруусу доого жыгылат, эр өлтүрүп баласы, эли доого жыгылат, жакалашып жакыны, улагадан жоо чыгат (Т. Касымбеков)."},{"t":"p","h":"п Жерге келкел келгенде: жылан сойлоп өтө албай, калың болот тулаңы, эгини чайлайт сегиздеп, малы төлдөйт эгиздеп. <span class=\"pg\" data-n=\"132\">132<\/span>Жерге кеткет келгенде: эки айрылып өнө албай, кодура болот эгини, бала салып мал атпай, кара болот желини, дарагы куурап жыгылат, илбээсини суюлат (Т. Касымбеков). ш Элге келкел келгенде: пашасы адил башкарат, ит ыркырак тыйылат, ынтымак куруп жыйылат, азаматы туу жайып, акылманы чуу басып, тынччылыгын жайгарат, үч чабылса үч чыгып, күлүгү күндө байге алат. Әлге кеткет келгенде: пейил кетет бийинен, береке качат үйүнөн, калыстык кетет чоңунан, ит ыркырак башталат, өзүн өздөй күтмөк жок, баары жатка жагынат, баары торго чалынат, башы шорго малынат (Т. Касымбеков)."},{"t":"p","h":"ТУ Туман тушуп, дунуйе аппак сут дайрасына чемулуп, жер бетиндеги заттын баары булангыр арасынан куугумдеп көрүнүп, көңүлдү белгисиз түпөйүл үрөй ээлеп, жомоктун ажайып окуяларын күттүрчү туман моминтип арга түгөтөр жоо болорун ойлобогон (Ч. Айтматов)."},{"t":"p","h":"у Түнү аяз, боз кыроо, тан эртең менен баш-аягына көз жетпеген керилген өзөн күмүш чапкан сыңары көгүлтүр акчыл түрлөнүп, ар кай жери жалтырап, бирткелеп кыроо эриген сайын көздүн жашындай мөлтүлдөп тамып, сарыгып, жер нымыгып, жер бети алтындай саргаймактап, күн жылымдаган ченде көзгө илеше-илешпей булаңгыр чарым көк буу көтөрүлүп, аба да мемиреп, бир түркүн кеңирсий дымып турат (Т. Касымбеков)."},{"t":"p","h":"УТ Саз, сай жээктей арасына тобу менен төө кирип кетсе табылбагандай шыкала өскөн кара камыш, миң түрлүү чөп чаялаган, калың чий те алыстан ак каймалдын чуудасындай үлпүлдөйт. Коён серендеп, бир тартым жалын болуп чубала кызыл кыргоол учуп, түркүн үн алышып, тири макулук бейпил (Т. Касымбеков)."},{"t":"p","h":"УП Кыштын кыска күнүндө тоонун күнгөй беттери аз убакка жылымта тартып, наристенин тыноосундай үлпүл мемирей түштү эле, көп узабай күн ырайы кайра бузулду, капилеттен өзгөрдү, мөңгүдөн ызгаар уруп, аюудай жылган эрте күүгүм кокту-колотту мелт-калт толтура жойлоп келатты, өзү менен кошо көзгө көрүнбөгөн алтүндө түшөр мунарык аязын ала келатты (Ч. Айтматов)."}],"sub":[{"title":"2-үлгү","b":10}],"section":"УП КЛАСС","pages":[126,132]},{"title":"УШ КЛАСС","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"133\">133<\/span>УШ КЛАСС"},{"t":"h3","h":"САНЖЫРГАЛУУ КӨРӨҢГӨ"},{"t":"h3","h":"§ 19. ФОНЕТИКАЛЫК ТАЛДОО"},{"t":"p","h":"Кептеги тыбыштар үн түйүндөрүнүн дирилдегени менен өпкөдөн чыгып келе жаткан абанын агымынын сүйлөө органдарыбызга сүрүлүшүнөн пайда болот. Т. К. Акматов"},{"t":"p","h":"168-көнүгүү. Фонетикалык талдоо жүргүз."},{"t":"p","h":"Әгер сен бир нерсени кесип кылган болсон, ошого бардык күч, бардык өмүрүндү адал сарп кыл. Көпчүлүктү алдаба. Көңүл улап ишендирип жан бакпа. Андайды өлгөнчө жек көрөм (Мукай)."},{"t":"v","l":["Кемчонтойдун талдоосу:","","э— дирилдеме, жылчыкчыл, үнсүз тыбыш","г – жоон, эринчил, кууш үндүү","е талданды","р – ичке, уччул, жарылма үнсүз тыбыш"]},{"t":"p","h":"Көрөгөч Маамыт. Мына, балдар. Кемчонтой байкеңердин фонетикалык талдоосун көрдүңөр. Бир гана «р» тыбшынын уччул экени туура белгиленген. Калганы бүт ката. Кана эмесе, өзүң талдап көр. Кыйналган жериңде ушул окуу китебинин этегиндеги «Серектин сыр сандыгындагы» «Тыбыш» топтомун кунт коюп окуп чык. Анан фонетикалык талдоодо жаңылбайсың."},{"t":"p","h":"Апенди. Сөз экен да! Анда ар бир тыбышты «Серектин сыр сандыгынын» жардамы менен талдай берсе, иттин уулу Байбарак да жаңылбайт!"},{"t":"p","h":"Көрөгөч Маамыт. «Сыр сандык» – таяныч! Фонетикалык талдоо мезгилинде аны карабайсың. Бирок талдап бүткөндөн кийин аны менен өзүңдү текшерип, билген жана унутуп койгон жерлериңди аныктап алсаң болот. Жана да ошол унутулгандарды эсте сактоо үчүн кайталап алууга сага жардам берет. Демек, «Сыр сандыкка» жөлөн. Эмне үчүн? Анткени андан ары шыр кетүү, жолду узартуу үчүн."},{"t":"p","h":"<span class=\"pg\" data-n=\"134\">134<\/span>164-көнүгүү. Үндүү жана үнсүз тыбыштар боюнча талда."},{"t":"p","h":"Ажо – Эне-Сайдагы Кыргыз кагандыгынын алгачкы феодализм доорундагы бийлик ээсинин кытай жылнаамаларында эскерилген чини, титулу («Кыргыз тарыхы» сөздүгүнөн.)."},{"t":"p","h":"165-кенугуу. Үндүү жана үнсүз тыбыштарды ажырат."},{"t":"p","h":"Кыргызча ай аттары: бирдин айы – февраль, жалган куран – март, чын куран – апрель, бугу – май, кулжа – июнь, теке – июль, баш оона – август, аяк оона – сентябрь, тогуздун айы – октябрь, жетинин айы – ноябрь, бештин айы – декабрь, үчтүн айы – январь."},{"t":"p","h":"166-көнүгүү. Үндүүлөрдү тилге, жаакка жана эринге карата бөлүнүшү боюнча талда."},{"t":"p","h":"Кыргызча жыл аттары: 12 жаныбардын атына негизделген. Жыл сүрүүнүн 12 жылдык циклинин биринчи жылы – чычкан, экинчи жылы -— уй, үчүнчү жылы -— барс, тертун-"},{"t":"p","h":"коён, бешинчиси – улуу (кытайча «лу» – ажыдаар), алтынчысы – жылан, жетинчиси – жылкы, сегизинчиси – кой, тогузунчусу – мечин (маймыл), онунчусу – тоок, он биринчиси – ит, он экинчиси – доңуз (кара кийик). 1997-жыл – уй жылы, 1998-жыл – барс, 1999-жыл – коён, 2000-жыл – улуу жылы. Андан ары жылан, жылкы, кой болуп катары менен кете берет. 2009-жылы кайра уй жылы башталат."},{"t":"p","h":"167-көнүгүү. Уяң, жумшак жана каткалаң үнсүздөрдү ажыратып айтып бер."},{"t":"p","h":"Каган – орто кылымдарда көпчүлүк түрк элдеринин мамлекет башчысына берилүүчү наам. УЇ кылымдын ортосунан тартып Түрк кагандыгынын бийлик ээлери да каган наамын алышкан. Кийин аварлар, Әне-Сай кыргыздары, печенегдер, хазарлар, караханийлер ж.б. түркий элдер мамлекет башкаруучуларын «каган» деп аташкан. Моңголдордун жапырыгынан кийин «каган» термини «хан» болуп биротоло езгөргөн («Кыргыз тарыхы» сөздүгү)."},{"t":"p","h":"168-көнүгүү. Үнүз тыбыштарды жасалуу ордуна карата талда. Кыргыз кагандыгы – Әне-Сай дарыясынын боюндагы Миң-Суу өрөөнүндө УЇ кылымда пайда болуп, XIII кылымдын башына чейин өкүм сүргөн мамлекет. ]X кылымдын ортосу – X кылымдын башындагы Кыргыз кагандыгынын доорун В. В. Бартольд «Улуу кыргыз дөөлөтүнүн мезгили»"},{"t":"p","h":"<span class=\"pg\" data-n=\"135\">135<\/span>деп атаган. 904-жылы кыргыз аскерлери Кытай Таң сулалесинен такты талашуу күрөшүнө катышкан. Түштүк Сибирь, Моңголия, Байкал боюнун бир кыйла бөлүгү, Иртыш дарыясынын бою Кыргыз кагандыгына баш ийген. Бул доорду археолог-кыргыз таануучу Ю. С. Худяков кыргыз тарыхынын «жылдызды туткан сааты» деп атаган («Кыргыз тарыхы» сөздүгү)."},{"t":"p","h":"169-көнүгүү. Үнсүз тыбыштарды жасалыш ыгына карата талда. Кызыл-Суу Кыргыз автономия областы – Кытай Эл республикасынын Синьцзян-Уйгур автономия районундагы кыргыздар жашаган аймак. Борбору – Артыш шаары. Калкы негизинен мал чарбасы, дыйканчылык менен кесип кылышат. Бүгүнкү күндө араб алфавитиндеги жазманы колдонушат («Кыргыз тарыхы» сөздүгү)."},{"t":"v","l":["170-көнүгүү. Фонетикалык талдоону толук жүргүз.","Токтоо эрдин мүнөзү","Тойбосо да тойгондой,","Жүрө берет бир калып,","Әчтемени ойлонбой.","Әмне кылса өөнү жок,","Калыпка салып койгондой (Осмонкул)."]},{"t":"p","h":"171-көнүгүү. Парта боюнча ар бир тыбышты бириңен сала бириң талда. Удаалаш талдоонун тартиби мындай. Айталы, ыйман деген сөздүн ы тыбышын биринчи окуучу, й тыбышын экинчи, м тыбышын үчүнчү, а тыбышын төртүнчү, н тыбышын бешинчи окуучу талдайт. Калганы да ушундайча кете берет."},{"t":"p","h":"«Кайран кыргыз эл кайда, ордолуу Талас жер кайда?» – деп күңгүрөнүп, сакалы ылдый коюнуна кубанычтын жашы куюлуп, Акбалта шайтандай жүргөн Көкчологун теминип, Алтай тоону бөксөлөп, Шабырлууга бет алды. Әзелтен берки ата теги эсине түштү Акбалта бабанын. Балдардын тукуму көбөйүп, кыргыздар дүркүрөп өнүп-жайнап, Көк-Теңирдин Көк Туусун күн астында ай-ааламга булгалап, бел-белесте беш удургуп, Теңирин тааныбай ай чапчып, анда Теңир терс толгонсо, кумга сиңген суудай соолуп, таруудай чачылып, ошондо да кыргыз аты көгөн мисалы мөнгү сүзүп жоголбой, камгак болуп доордун кара шамалына кетпей, атабабаларынан мурас калган Алтай менен Ала-Тоону таянып, эгизинин түгөйү Әне-Сайда ыйлап, жүз чайса, түгөйү Ысык- Көлдө жүз чайып, ыйлап сагынышып, баба жайын, ата конушун көздөп, мелжеп келген тура (А.Жакыпбеков)."},{"t":"v","l":["<span class=\"pg\" data-n=\"136\">136<\/span>172-кенугуу. Муну да 171-көнүгүүнүн шарты боюнча иштегиле.","Кыз баланын жакшысы","Күмүш, шаңшур жамбыдай.","Жаман болсо кыз бала","Жазгы конгон коноктой,","Үй-бүлөсүн жүдөтөр","Мизи мокок ороктой.","Акылы бар азамат","Зымга тарткан күмүштөй.","Айткан сөзү ширелүү","Демдеп койгон күрүчтөй.","Боз баланын жаманы,","Чатак болгон кыялы (Молдо Кылыч)."]},{"t":"p","h":"178-көнүгүү. Окуп баратып, уяң жана жумшак үнсүздөрдү ток-"},{"t":"v","l":["толбой айтып бер.","Хосров чочугандай жалт караса,","Шоола жок, жалгыз калган өзү гана.","Айланды булак боюн эчен курдай,","Жана эле толукшуган жок жарык ай.","Кузгундай кара болду ак туйгуну,","Бакчасы дарттуу болду, жемиш уулуу.","Солкулдап сонун чыккан зор ак кайың,","Майышты, бороон басты, төктү ыйын (азербайжан","акыны Ганжеви Низами).","174-кенугуу. Окуп баратып, кең, эринчил жана жоон үндүүлөрдү","дароо ата.","Алпештеп, мээрин төгүп баккан энем,","Өзүңө бала чактан сырдаш элем.","Ичиңе кытмырданып сактабай кир,","Кубаныч, кайгым болсо тартыштың бир.","Энеке, бир сөз уктум жан оорутар,","Тумчуктум табыттан да дүнүйөм тар.","Аябай жүрөгүмдү мун-зар эзди,","Уу-чуудан зээним кейип, көңүл безди (Алишер Навои).","175-көнүгүү. Жарылма үнсүздөрдү тап (оозеки)."]},{"t":"p","h":"Турмушту ак ниеттиктен артык эч нерсе көркүнө чыгара албайт. Әлдин ынтымагына жолто болуп, бирин-бирине кайраштыруудан корк (Лев Толстой)."},{"t":"h3","h":"<span class=\"pg\" data-n=\"137\">137<\/span>§ 20. МОРФОЛОГИЯЛЫК ТАЛДОО"},{"t":"p","h":"1. Уңгу, мүчөлөр боюнча талдоо Уңгу сөздүн негизги маанисин туюнтат жана өз алдынча сөз катары колдонуу касиетине ээ. Ал эми мүчө мындай мүмкүнчүлүккө ээ эмес. Т. Садыков"},{"t":"p","h":"176-көнүгүү. Адегенде көчүрүп жаз, анан уңгу, мүчөлөрдүн аралыгын тик сызык менен ажырат."},{"t":"p","h":"Ар бир инсан өз дооруна милдеттүү. Кайсыл доордо жашабайлы, улуттук тарыхты, рухий маданиятты, салтты, мурасты унутпоого тийишпиз, аларды ардактоо, сактоо, үйрөнүү жана изилдөө керек. Дил, тил, оозеки мурас, ырым-жырым, акылмандык бардык доордо болуп келген. Өлкө буларсыз өнүкпөйт. Ар адам кайда иштебесин, кайда жүрбөсүн, улуттук рухий кутту, маданиятты сыйлап, асырап албаса, салтын сактабаса, адегенде жеке өзүнө зыян жана жалпы элдик ырыскы аброюна залалы тиет (К. Жусупов)."},{"t":"p","h":"Үл г ү: доор/уна. Андан соң доор – уңгусу, -уна – мүчөсү деп айтып бер."},{"t":"v","l":["177-кенугуу. Мүчөлөрдү түрү боюнча талда.","Мүрөктүн суусу жөн суулардай шылдырап,","Агып жатса мал кечпес жашыл аралда.","«Көк арчадай өндөн азбас болсун» деп,","Өзүм ичпей, ичирер элем адамга (Алыкул).","Кемчонтойдун талдоосу:","мүрөк – уңгу","-түн – куранды, ээрчибес, сыйлыгышма, сенек мүчө","-суу уңгу","-су – куранды, сенек, ээрчиме, өнүмдүү мүчө...","... (Калганын талдай албай койду)","Көрөгөч Маамыт.","1. 177-кенугууну сен да өзүңчө талдап көр."]},{"t":"p","h":"2. Күчүң жетпесе, «Серектин сыр сандыгындагы» «Тыбыш» топтомун кара да, окуп чык."},{"t":"v","l":["178-көнүгүү. Мүчөлөрдү түрү боюнча талда.","Әртең менен болгондо","Тоо башынан күлөсүн.","Нур канатың талыкпай,","Сапар тартып жүрөсүң (Барпы)."]},{"t":"p","h":"<span class=\"pg\" data-n=\"138\">138<\/span>179-көнүгүү. Ар бир сөздү жана мүчөнү өзүнчө талда."},{"t":"p","h":"Жылкы + чы + га, жат + ырка + ды, кол + д+оо+ чу+лар + дын, сапыр + уу + чу – нун."},{"t":"p","h":"Үлгү: Жылкы – уңгу."},{"t":"p","h":"-чы— куранды, өнүмдүү, ээрчиме, туруктуу, зат атооч жасоочу мүчө."},{"t":"p","h":"-га – уланды, ээрчиме, оошмо жана барыш жөндөмөнүн мүчөсү."},{"t":"p","h":"180-көнүгүү. Муну да 179-көнүгүүгө окшоштуруп иште."},{"t":"p","h":"Сереп + чи + ле, тиз + мек + теш т тир, төр + күн + сөөк, таш + ырка + ган + дай."},{"t":"p","h":"181-көнүгүү. Муну да 179-көнүгүүдөй талда."},{"t":"p","h":"Туз + ул + уш, тыз + ыл + датт + уу, чан + датттуу, шибеге + лүү + лөр + ден."},{"t":"p","h":"182-кенугуу. Кара тамга менен жазылган сездерге унгу, муче боюнча талдоо жургуз."},{"t":"p","h":"Абдыкерим Сыдыков, Жусуп Абдракманов, Абдыкадыр Орозбеков, Баялы Исакеев, Төрөбай Кулатов, Исхак Раззаков – булар өз заманынын кеменгер ишмерлери, көрөгөч саясатчылары, даанышман көсөмдөрү болушкан. Алар кыргыз эли кылымдар бою эңсеп келген арман-тилекти ишке ашырышып, тарыхта миң жылдан кийин алгачкылардан болуп кыргыз мамлекетин кайра түзүшкөн («Кыргыз Туусу» гезити.)."},{"t":"p","h":"188-көнүгүү. Бул ырдагы сөз мүчөлөрү кайсы түргө кирет (оозеки талда)."},{"t":"v","l":["Канча калың жыгачтар:","Кайың, моюл, чынары,","Алма, чие, анары","Жийде менен өрүгү (Молдо Кылыч).","184-көнүгүү. Мүчөлөрдүн түрүн оозеки аныкта.","Чакчыгайдын месели,","Куудулданып туураган","Кулун менен текени,","Бир жагынан кыңшылап","Күчүк болуп кетеби?","Байкап турсаң тили так","Балакеттин көсөмү (Молдо Кылыч).","<span class=\"pg\" data-n=\"139\">139<\/span>185-көнүгүү. Унгу, мүчөнү оозеки талда.","Безилдеген безбелдек,","Кара кашка кашкалдак,","Зыяны жок жаныбар","Суу бойлогон ак чардак.","Уста чымчык куркулдай","Уя кылат кастарлап (Молдо Кылыч)."]},{"t":"p","h":"186-көнүгүү. Удаалаш талдоо. Шарты: 1) оозеки талданат, 2) бир сөздөн гана талдоо, 8) парта боюнча."},{"t":"p","h":"1. Улут + тук. 2. Кандай + дыр. 8. Заман + дан. 4. Бала + сы. 5. Намыс +ы. 6. Уул + ум. ?. Кер + се. 8. Жемиш + түү."},{"t":"p","h":"9. Сүр + үш. 10. Жагдай + лар. 11. Муун + дун. 12. Ойгон + – ду. 18. Чач + ып. 14. Кут + туу. 15. Мезгил + де. 16. Илим – + поз. 17. Сиз + дики. 18. Жосун + суз. 19. Жет + өө. 20. Жилик 1 те. 21. Отур Егуз. 22. Ор+ул. 23. Тара+ н."},{"t":"p","h":"25. От + мей. 26. Туш + мөк. 27. Желе+н. 28. Кет + се."},{"t":"p","h":"29. Манас + чы. 30. Кырк + ынчы."},{"t":"p","h":"187-кенугуу. Удаалаш талдоо. Шарты 186-кенугууге окшош."},{"t":"p","h":"1. Тарбия + ла. 2. Иш + кер + лик. 3. Эркин + дик ти."},{"t":"p","h":"4. Чыг + уу + га. 5. Эпос + то + гу. 6. Дүйнө + су + не. 7. Жол + дор + у. 8. Кара + ш + кан. 9. Айт + уу + чу. 10. Баары + быз + га. 11. Тушун + дур + үү. 12. Бороон + до + п. 13. Шакирт + тер + и. 14. Бар + са + ныз. 15. Майыш + тыр + ган."},{"t":"p","h":"16. Найза + ла + ш. 17. Жылы + н + ды. 18. Жыг+ыл + мак."},{"t":"p","h":"19. Мамлекет + түү + лук. 20. Сын + дыр +а. 21. Ошо + лор +дуку. 22. Акыл + ман + ым. 28. Оожал + ып + мын. 24. Ык- + ма + лар. 25. Май + ла + + ган. 26. Аздек + т + өө + ден."},{"t":"p","h":"27. Ынтымак + та + ш + уу. 28. Сак т + оо + нун. 29. Керек – + т+ее+чу. 30. Сый+ мыг + ы"},{"t":"p","h":"2. Сез туркумдеру боюнча талдоо"},{"t":"p","h":"Кыргыз тилинде сөздөрдүн сөз түркүмдөрүнө бөлүштүрүлүшү 1930-1940-жылдардагы түзүлгөн алгачкы грамматикалардан эле башталат. Буга белгилүү окумуштуу Касым Тыныстанов негиз салган. И. Абдувалиев 188-көнүгүү. Төмөнкү сөздөрдү сөз түркүмүнүнүн түрлөрү боюнча талда."},{"t":"p","h":"Велосипед, даамдуу, төх, келгиле, баракелде, үч-үчтөн, дабыш, далдыраган, калдыр-шалдыр, эң мыкты, гой, далилде, <span class=\"pg\" data-n=\"140\">140<\/span>армансыз, талда, мен деле, тизме, боюнча, күн сайын, мисалы, же болбосо, чамасы, саал-паал, бүткүл, өзүңөр, эрбен-"},{"t":"v","l":["сербен, топтомолок, желп, жүз миллион, өтө чоң, тыз, чек,","түт, алмалар, кыш, түшөй, четте, түшүндүрдү, айтмак, сөзсүз,","баракелде, ырдап келе жатат, сырдаш, кара тору, тулпар,","кар, айлакер, барбайбыз, го, сен эле, калдың.","189-көнүгүү. Сөз түркүмү боюнча талда.","Үй чымыны өзү менен бирге алты миллион микробду","алып жүрөт. Ал эми анын ичегисинде 30 миллионго чейин"]},{"t":"p","h":"микроб бар. Чымын кайда консо, ошол жерде жайнаган микроб болот. Апрель айында чээнден чыккан бир эле чымын-"},{"t":"v","l":["дан майдын этегинде 7200, июндун орто ченинде 482000,","сентябрдын орто ченинде 5 триллион 598 миллиард чымын","пайда болот. Демек, апрель айында чээнден чыккан бир эле","чымынды өлтүрүү менен, биз айлана-чөйрөнү ушунчалык көп","булгануудан сактайбыз («Менгу» гезити).","190-көнүгүү. Сөз түркүмү боюнча талда."]},{"t":"h3","h":"АДАШКАН КАЙБЕРЕН"},{"t":"v","l":["Бир кайберен келди адашып","Койлор менен айыл жакка.","«Тур, кийик ат» деп кемпири","Илди чалын кайырмакка.","Даярдалып жалаңдаган","Курч бычактар, ала жиптер...","Ага бачым жетсек дешип,","Бирин-бири талады иттер.","Аттар туйлап... балдар чуулдап,","Айыл ичи чаң-тополоң.","А кайберен бөрүлөрдүн","Куугунан атып чыгып,","Ажыраган улагынан —","Солкулдаган жашыл чыбык!","Туш-тушта үн арс-арс эткен,","Туш-тушта үн тарс-тарс эткен.","Куду өрттөнүп жаткансыган","Тал-теректер, арча беттен.","Бир түйүлдү түйүлгөндө,","Он метрге бир түйүлдү,","Калбас үчүн кыкка айланып","Кара жерге бүрсүгүнү...","«О, кайберен, тоо сезими,","<span class=\"pg\" data-n=\"141\">141<\/span>„унулууда жутунуп кек,","Мендей сынып турсаң дагы","Кутулуп кет, кутулуп кет!» —","Ушуну айтып бир карт мерген","Сарайында – чөп үстүндө","Жатты онтоп... бу күтүүсүз","Окуяны көрүп мүлдө (Т. Муканов).","191-көнүгүү. Сөз түркүмү боюнча талда."]},{"t":"p","h":"1. —О-о, ке-ел, Токо! – деп ырчынын атын тизгинден алып, жетелеп, эшигине кетер замат колтуктап сүйөй аттан алып, кучакташып көрүштү."},{"t":"p","h":"Көптөн бери үн тартпай буулугуп калган белем, Токтогул тааныган ар кишинин атын атап, баланы бетинен сүйүп, зайыпка баш ийкей, баарын берметтей чууруган көркөм ыр тизмегине алып, амандык сурап, учурашып, үн баспай тышта көпкө ырдап турду."},{"t":"p","h":"2. Төргө чыгар замат Токтогул комузун колуна алды. Сакалым, кадырым бар дегендин баары улагага дейре шыкалып, сыртта эл улам көбөйдү белем, уу-дуу болуп, үй тегеректей тыңшаган элдин өбөгүнөн керегелер кычырап майышып баратты. Нары дегенди ким угат?! Мындайда ууктар дабырап түшүп, каланган чий, жабылган туурдук шара-шара тилинип калары бышык. Тезинен боз үйдү кызыл кереге кылып сыйрып жиберишти. Тыштан тегеректей тизилген ар түркүн көз жайнап, ырчынын комузу, азем үнү ансайын айлана, кыйырга шаңкылдап тарап угула баштады (Т. Касымбеков)."}],"sub":[{"title":"§ 20. МОРФОЛОГИЯЛЫК ТАЛДОО","b":29},{"title":"АДАШКАН КАЙБЕРЕН","b":67}],"section":"УП КЛАСС","pages":[133,141]},{"title":"§ 21. СИНТАКСИСТИК ТАЛДОО","blocks":[{"t":"h3","h":"§ 21. СИНТАКСИСТИК ТАЛДОО"},{"t":"p","h":"1. Сөз айкашы боюнча талдоо"},{"t":"p","h":"... 03 ара байланышкан сөздөрдун тутумунда"},{"t":"p","h":"аныкталгыч жана аныктагыч, багындыруучу жана багыныңкы, башкаруучу жана башкарылуучу сөздөр болушат. Б. Өмүралиев 192-көнүгүү. Төмөндөгү сөз айкаштарынын багындыруучу түгөйлөрү кайсы?"},{"t":"p","h":"Бөксө жайлоо, желге ыргалат, кулундар кишенейт, тоонун боору, даңктуулар гана билет, кара алачык, асманга карай созулат, ошол үйлөр, жамандыгынан корунгансыйт, көргөн кордугу, терең ойлонду, тунук суу, биз иштейбиз, <span class=\"pg\" data-n=\"142\">142<\/span>мыкты курулуш, тигилүү кийим, жакшыга жанаш, чилденин суугу, эненин көөнү, жайлоонун көркү, какшыктап сүйлөдү, бажырая күлдү, өзүбүз кам көрөбүз, экөөбүз чаап бардык, алмалар бышкан, артист келген бейм, элден безе албайсың, көпчүлүгү катышты, күн сайын отойт."},{"t":"p","h":"Үлгү: жайлоо – багындыруучу түгөй, «бөксө» ага көз каранды, жайлоонун жапыз жерде экенин билдирет."},{"t":"p","h":"193-кенугуу. Адегенде этиштик, анан атточтук сөз айкаштарын өзүнчө бөлүп көчүр."},{"t":"p","h":"Алты жыл, эгемендүүлүккө жетиштик, түтүн булаттык, жылдыздай жан, элдин ырысы, ордолуу журт, ынтымагы бар, ынтымаксыз бүлүнөт, эмгегинди көрсөт, өзүңө ишен, атуулдук парз, илхамы келди, инсандыгына шек келтирбе, жаңы доор, Республиканын калкы, рухий кенч, маданий дөөлөттөр, бабалардын руху, туугандарга бардым, тарыхын жыйнадык, санжырасын уктук, чыгармачылык өнөр, жаштарды куттуктайлы, аброй алып келет, көйгөйлөр көп, кредиттик карыздар, фермердик чарба, өнөр жайды жакшыртабыз."},{"t":"p","h":"194-көнүгүү. Төмөнкү сөз айкаштарындагы сөздөрдү өз ордуна койсоң, жалпыга белгилүү эл макалдары пайда болот."},{"t":"v","l":["1. Көтөргөн жүк, жүк жеңил, жабыла көтөргөн.","2 Жаман мактайт, өзүн мактайт, өтө жаман.","3. Жаманды кабат, ит кабат, төө үстүнөн кабат."]},{"t":"p","h":"4. Жүнүн дүгдүйтөт, беру дүгдүйтөт, сырткы жүнүн, арыгын билгизбей, билгизбей дүгдүйтөт."},{"t":"p","h":"5. Жердин топурагы, туулган жердин, топурагы алтын."},{"t":"p","h":"6. Чаңы чыкпайт, аттын чаңы, жалгыз аттын."},{"t":"p","h":"7. ичет, күрмөк ичет, күрүчтүн аркасы менен, аркасы менен ичет."},{"t":"p","h":"8. Үйдө жатпайт, кыл жатпайт, кыздуу үйдө."},{"t":"p","h":"9. Сүт менен бүткөн, нерсе кетет, сөөк менен кетет, бүткөн нерсе, кошо кетет."},{"t":"p","h":"Үлг ү: Үйдө жатпайт, кыл жатпайт, кыздуу үйдө. – Кыздуу үйдө кыл жатпайт."},{"t":"v","l":["Чыпалак эскертет.","1.Досторум, кулагыңарга күмүш сырга!"]},{"t":"p","h":"М.: Ата, айылга кар жаады. Мында айылга жаады, кар жаады деген сөз айкаштары бар, кар – ээси, жаады – баяндооч, айылга – бышыктооч. Бирок «ата» деген каратма сөз сөз айкашына кирбейт. Каратма сөздүү сүйлөм делип талданат. Сырдык сөз да, киринди сөз да ошондой."},{"t":"p","h":"2. Байламта сөздөр да сөз айкашына түгөй болуп катышпайт."},{"t":"p","h":"3. Ал эми жандоочтор, бөлүкчөлөр негизинен өзү жандаган түгөйгө кошулуп талдана берет."},{"t":"p","h":"<span class=\"pg\" data-n=\"143\">143<\/span>195-көнүгүү. Төмөндөгү тексттен төрт сүйлөмдү тандап алып, аны сөз айкашынын (ээрчишүү, ыкташуу, башкаруу, таандык байланыш) түрлөрүнө ажыратып жаз."},{"t":"h3","h":"ШОКОЛАД"},{"t":"p","h":"Акылбек менен Жыпарага атасы таттуу шоколад алып келди. Жыпара шоколадды колуна алып, артына бекитти да, инисине минтти:"},{"t":"p","h":"– Акыл, шоколад менин кайсы колумда? Эгер тапсаң, азыр жейбиз. А таба албасан, эртең жейбиз."},{"t":"p","h":"Акыл ойлонбой туруп эле шашып кетип: – Сол колуңда! – деди. А шоколад Жыпаранын оң колунда эле. Өзү да жегиси келип турса, Акылдын минтип таба албай калганын карачы. Айткандан кийин сөзгө туруу керек го. Ошентсе да Жыпара акыл тапты:"},{"t":"p","h":"– Акы, бул ирет таппай калдын, эми ойлонуп кайра айтчы. С. Рысбаев 196-көнүгүү. Адегенде окуп чык, маанисин көңүлүңө түй. Анан сөз айкашынын түрлөрү боюнча топтоштуруп жаз."},{"t":"h3","h":"АСАНБЕК ТАБАЛДИЕВ"},{"t":"p","h":"Асанбек Табалды уулу тээ элүүнчү жылдардын башында алыскы Тянь-Шандын бир бурчунан окуу издеп Бишкекке келген. Ал кезде ал орусча эки сөздүн башын кошуп сүйлөй алчу эмес. Билими жагынан айырмаланбаган карапайым балдардын бири болгон. Асанбек университеттин тарых факультетинин студенти болгондон баштап, жашоо образын чукулунан илим жакка бурду. Эки жакка максатсыз басканды токтотту. Сөздүктөрдү жазданып жатат. Жадегенде автобуста, троллейбуста баратып да китеп окуйт. Көп өтпөй аспирантурадан окуп, кандидаттык диссертациясын ийгиликтүү коргоду. 36 жаш курагында философия илимдеринин доктору деген илимий даражаны алууга жетишти. Ал өзүн көрүнүктүү окумуштуу, жөндөмдүү публицист, ийкемдүү уюштургуч, тажрыйбалуу педагог, чоң адамгерчиликтүү, мээнеткеч инсан катары таанытып кетти. Асанбек Табалдиев өзүнүн ушул жаркын, бараандуу элеси менен бизге үлгү болоруна шек жок. С. Байгазиев"},{"t":"p","h":"Үл үз 1) Ээрчишуу: Асанбек Табалды уулу келген,... (калган ээрчишүүлөрдү тексттен өзүң тап)."},{"t":"p","h":"` 2) Башкаруу: Бишкекке келген, ... (калганын өзүң тап)."},{"t":"p","h":"<span class=\"pg\" data-n=\"144\">144<\/span>3) Ыкташуу: элүүнчү жылдардын, ... (калганын өзүң тап)."},{"t":"p","h":"4) Таандык байланыш: Тянь-Шандын бурчунан, ... (калганын өзүң тап)."},{"t":"p","h":"197-көнүгүү. Төмөнкү текстте канча сөз айкашы бар? Эсептеп чык. Суусамырдын асманында керт этим булут жок. Жайдын жадырап тийген күнү жер кендигин алаканга салгандай көз алдыга тартат. Зейнептин бадырайган көздөрү ого бетер жадырап, тоттуккан буудай жүзү токтоо тартты. Ооба, ал тээ төмөнтөн жумурткадай аппак үйлөрү быжыраган чоң кыштактан көзүн албай ойго баткансыды. Азыр бул жер өзүнчө эле шаарчаны элестетет. Тасмадай чубалган жолдор, азем менен салынган үйлөр, коомдук мекемелер, оюн-шоок жайлары көз жоосун алат. Азыр Суусамыр өрөөнүндө эмгектенип жаткан адистердин дээрлик бардыгы – Зейнеп иштеген мектептин тарбиялануучулары. Алардын баары Зейнепти эже дешет. Анан аларга өзүнүн бүткүл билимин, күчкубатын, акыл-эс туйгусун берип жатканына кубаттанат (А. Жунушалиев)."},{"t":"p","h":"Үл г ү: 1. Булут жок. 2. Керт этим булут. 3. Асманында жок. Калган сөз айкаштарын катары боюнча улап жаз."},{"t":"h3","h":"2. Сүйлөм мүчөлөрү боюнча талдоо"},{"t":"p","h":"..ээ менен баяндооч сүйлөмдүн негизги уюткусун түзөт да, айкындооч мүчөлөр мына ушуларга карай гана орун алат. А. Жапаров"},{"t":"p","h":"Чыпалак эскертет."},{"t":"p","h":"Өзүңөр билесиңер, мен анчалык көп сүйлөбөйм. Сөздөрүм кыска. Биринчи – \\/!! класста «Сүйлөм мүчөлөрү боюнча талдоо» деген темадан кийин Акыл Карачач эжеңердин талдоо боюнча айткан сунуштарын окугула."},{"t":"p","h":"Экинчиси – китептин этегиндеги «Серектин сыр сандыгынан» «Сүйлөм мүчөлөрү» деген топтомду карагыла."},{"t":"p","h":"198-көнүгүү. Төмөнкү талдоолор туурабы? Текшер, катасын оңдоп көчүр."},{"t":"p","h":"Кемчонтойдун талдоосу."},{"t":"img","src":"data:image/webp;base64,UklGRjgMAABXRUJQVlA4ICwMAABQTwCdASqAAjkAPrVKoEonJCMhqjfd2OAWiWkG+IUEWcZTeB/1viP6AfoWgxoX7ANS/5d+Pf4Xm734/HD/M9RF5XaEe3mA3rwLR51jtK/Ql/sR20HLWateq7RmkoASB6lFTF6iY7XKRCtM1ZsUaY5dUI859iL2TjIl3AtLadvx6IpQQeBZIT38X5I+EnY+Kd6SQmiUEfpKmZkqEcRxyT0MqIMAnYY+4efpZqPjQ7iu86OBT6LiJARvC4hf791RdaHvJqCXPV8oBvcKfLTghYSSq6PDRApI3B37GZKYiHRRlH4kLWh9RlrgYG2KNxbx+xYYtZznyYnnTLpAUkMBRBJwpdAL9YQmP82bZbhKL4ZgdWEp1AFMbiRb9ZAQIA4OCUyL08TIZwYQrMUhur05OQycbjKzM9HVko641L1g9qeCfzZQsjADs2muxhNvG6L9JpC8y2N1ZhCB6CnycnqWcpztexrWmva/kmSms7320oYdV82Gv1usDqoGh5kuB+I4+1p8SJ1WXHtyM1et9mwOhhGSRFX9Ov/aE2gHYnN+wo05vj6ex8veYMHfMaCFpU+eXhzJjeIjyEGFAeYdksUCXUpS5E22ADpsxTvxY5RJsNqob/ySxn/573Hnyw3w1oHjL08+Gx8TYYOvLQHKX4zv/Q+0vjxGeEtWqJZZISKvSClE5Wq/842+Us3+hH/bQnhWKTSgpDe997MOFdFVGBMrG9jms0+IMs+2bolx6sNXzuq7WudASiunjPN6bOCH65DWn7fZ5MJCdMRlYIvS76iA2UaT6wVoQrugyIFDrOihoVJDKh+fdvdoKVqnjrGLXZn2nJ/umIJeGc1ZvdsYbR2sE2YZ0yJAAP7vsWPtL3XvK/IberYRy8+2bkjpvVoez2ceApchOM1pWA8rd58t+e20aipFOiFdFOe5hK5ul4wJHumZ+lviyW7QrAv31wQhyKyFi/E38wvVnUoynOwZwk6eBwsEpddMIKjoBUwTL8x63G7kV0viBdSSV4yyLPs ексиз күчү бар экендигин сен далилдеп кеттиң. Биз сени менен мактанбай кое албайбыз."},{"t":"p","h":"Музыканын бакыбат күчүн ойлоп отурсак, өтө терең экен. «Бороондуу бекетти» алалы. Аралда, кургак жээкте кара казан сыяктуу калтырылып кеткен кеменин жатканын канча айтабыз. Бирок сенин музыкаң бүгүн аны башка деңгээлден түшүндүрдү. Болбосо Толгонайдын дүйнөгө келген жаңы перзентти колуна кармап отурган көрүнүшүн музыканын кудурет-күчү менен түгөнгүс жылдыздарга, ай-ааламга көтөрүп баргандыгы – не деген дүйнө. Мен муну айтпай коё албаймын. Сен, Мурат, кыргыз элине жаралган чоң талантсың. Коркпой эле айтайын, сен – кыргыз элинин генийисин."},{"t":"p","h":"«Кыргыз руху» гезити Үлгү: Коркпой эле айтайын, сен – кыргыз элинин генийисиң. Биринчи сүйлөмдүн ээси – мен, көмүскөдө, айтайын – баяндооч, коркпой эле —- бышыктооч. Экинчи сүйлөмдө сен – ээ, генийисин – баяндооч, кыргыз элинин – аныктооч."},{"t":"p","h":"200-көнүгүү. Эки топко бөлүнгүлө. Биринчи топтун аты – «Насыйкат», экинчи топтун аты – «Саадак какты». Айталы, «Насыйкат» Г, «Саадак какты» П бөлүктү талдайт. Талдоо чогуу жүргүзүлөт. Бөлүктөр талданып бүткөн сон, бул эки топ бирин-бири текшерип чыгат."},{"t":"h3","h":"<span class=\"pg\" data-n=\"146\">146<\/span>МУРАТААЛЫНЫН КҮҮ МЕНЕН АТАСЫН АЖЫРАТЫП АЛГАНЫ"},{"t":"p","h":"Ї Мен айылда дуулдап жүрсөм, келиндердин бирөө минтип калды:"},{"t":"p","h":"– Сен кыйын болсоң, атанды ажыратып алсаң болбойбу. Бугунун комузчулары жыгып, атандын комузун колунан тартып алып, өзүн четке чыгарып коюптур."},{"t":"p","h":"Буга аябай ызаланып, боз атым бар эле, аны минип жөнөдүм. Жүрүп отуруп топко жеттим. Әл кырмандын ордундай болуп тегерете отурушкан экен. Ортодо көгала сакал эки комузчу отуруптур. Атамдын баягы күмүш кулак комузу ошолордун колунда экен. Атам четте. Мен атчан карап турганымда, дагы бирөө чаап жибердиби, атым элдин ортосуна аттап өтсө болобу. Аңгыча бирөө:"},{"t":"p","h":"– Бул жинди кайда барат? – деди. Мен «чертишем» деп жибериптирмин. Төр жакта отурган кодогой кара киши:"},{"t":"p","h":"– Атын алып байлап койгула, ошо бала чертишет, – деп калды. Тигилердин жанына барып отурдум."},{"t":"p","h":"П"},{"t":"p","h":"– Аксакалдар, ошо балага бир күү кайрып берип койгула,— деп калды жанагы кодогой кара киши. Көрсө, Чоко деген ушул киши экен. Алардын бирөө күү кайрып келип, черткен комузун мени көздөй акырын жылдырып койду. Ал кайрылган күү мен жакшы билген күү эле. Чындап келсе, андан жакшы билчүмүн. Ал баш-аягын кемчил черткенин байкадым. Комузду колума алганда эле озунуп:"},{"t":"p","h":"– Бул баш-аягы жок кандай күү? – деп эскерттим."},{"t":"p","h":"– Эмне кыласын, черте берсенчи, «Тултуйган кызыл күү» дейт муну, – деди бири. Мен ал кезде мотурайган тултуйган кызыл тоголок бала элем. Бул сөзгө ызалана түштүм. Әкинчиси:"},{"t":"p","h":"– «Ызаланган сакалчан күү» деп жүрбөгүн, – деп калды. Мен да сакал койдуруп алгамын. Ал күүнү башынан-аягына чыгара чертип токтодум."},{"t":"p","h":"– Дагы күүңөр барбы? – деп комузду таштап койгондо, алардын бирөө:"},{"t":"p","h":"– Бул, бала, башы бир бөлөк, аягы бир бөлөк болгон кандай күү? – деп калды. Алардын бирөөнүн көзү чалыр экен. Мен элди карап туруп:"},{"t":"p","h":"– «Кош көгала өгүз» деген күү ушул, – деп көзүмдү <span class=\"pg\" data-n=\"147\">147<\/span>чалырайтып койдум. Баягы кодогой кара киши санын чаап каткырып:"},{"t":"p","h":"– Эмне дейт бала,— кайрадан сурап калды."},{"t":"p","h":"– «Кош көгала өгүз», —деп мен көзүмдү чалырайтып жооп кайтардым. Отурушкандардын баары дуу этип каткырып күлүп калышты. Ошентип, ал экөөнү күлкү менен жыгып, атамды ажыратып алгам."},{"t":"p","h":"«Кыргыз Туусу» гезити Үлг ү: Муратаалы:"},{"t":"p","h":"—Мен Турпандан келе жаткам, – деди."},{"t":"p","h":"Биринчи сүйлөмдө Муратаалы – ээ, деди – баяндооч. Экинчи сүйлөмдө мен – ээ, келе жаткам – баяндооч, Турпандан – бышыктооч."},{"t":"p","h":"201-көнүгүү. Сүйлөмдү түрлөрү боюнча талда."},{"t":"p","h":"«Ак Мөөр». Төрт актылуу, 8 сүрөттүү драма. Биринчи сүрөт. Соң-Көлдүн түнкү көрүнүшү. Кыз оюн курган келинкыздар, бозойлор Баяндын сөзгө жыгылышын табалап күлүп жатышат. Оюн-күлкү."},{"t":"p","h":"Мөөр. Кана, Болот, мени түз карап туруп ырда."},{"t":"p","h":"Болот. Айтканың болсун, Мөөркан. Түз карап туруп ырдайлы..."},{"t":"p","h":"Тажалбүбү. Какылдаган кагындар, безилдеген бейбактар, түн баласы уктатпай, мазамды жаман алдынар! Карагылачы ®®%?ЁЙЁЁЗї,, жылдыз суюлуп, түн түрүлүп баратат. Болду, үй-үйүңөргө тарагыла, тарагыла! (Алыкул)."},{"t":"p","h":"Үлг ү: «Ак Мөөр» – атама сүйлөм, баш мүчөлөргө ажыратылбайт, айтылышы боюнча жай, түзүлүшү боюнча жөнөкөй сүйлөм."},{"t":"p","h":"202-көнүгүү. Сүйлөм мүчөлөрү боюнча (астын сызуу менен) толук талдап көчүр."},{"t":"h3","h":"СПОРТ ЖЫЛДЫЗЫ РОККИ МАРЧИАНО"},{"t":"p","h":"Бул италиялык адам өмүр бою утулуп көргөн эмес. Рокки баш-аягы 51 беттешүү өткөрүп, анын бирөөндө гана атаандашын топтогон упайы аркылуу уткан, калган 50 беттешүүсүндө каршылашын саналуу мүнөттөрдө эле көмөлөтө муштап жеңип алган. Роккинин соккусу чоюн темирдей катуу болгон. Ага туруштук берүү мүмкүн эмес эле. Америкалык боксчу Джо Луис 1935-1945-жылдарда дүйнөнүн чемпиону болуп турган. Ал дөө сымал турпаты менен жаалданып, алды-артын карабай арстандай бир тийген айбаттуу <span class=\"pg\" data-n=\"148\">148<\/span>түрү менен «жеңилбес» деген атка конгон. Бирок Рокки Марчианодон жеңилип калган. Джо Луис жеңилүү ызасын башынан өткөргөн менен, дүйнөдө Рокки Марчианого туруштук берип, кулабай мушташкан жападан жалгыз спортчу катары тарыхта аты калган. Джо Луис Рокки менен боксташкандан кийин, жарым айга чукул колу калтырап, тиш щётканы кармай алган эмес. Көрсө, Рокки анын бүт денесин, колун жанчып, эзип салган экен. Джо Луис Роккиге алдырып жибергенден кийин, экинчи рингге чыккан эмес. Көп жылдардан соң Рокки аба кырсыгынан күтүүсүз каза болгондо, аны Джо мындайча эскерген: «Рокки – залкар, улуу спортчу. Мындай адамдын кайрадан жаралары белгисиз. Мен аны менен мушташканда, тозокко түшкөндөй болгомун. Ал беттешүүнү эстегенде анын күчтүү соккусун тоскон колдорумдун сөөгү, ушу күндө да зыркырай түшөт»."},{"t":"p","h":"«Кыргыз Туусу» гезити"},{"t":"p","h":"Үлгү: Бул италиялык адам өмүр бою утулуп көргөн эмес."},{"t":"h3","h":"§ 22. «САБАТ САНЖЫРАСЫ» ТОПТОМУ"},{"t":"p","h":"Акыл Карачач: \\/!! класста «Сабат санжырасынын» 19 түрүн окугансың. Андан бери бир топ убакыт өттү. Алардын бир тобу жадыңдан чыгып кетиши да мүмкүн. Ошондуктан «Сабат санжырасына» кайрылып туруу, жаңыртып кайталоо, жазып машыгуу зарыл. Ошого ылайык сага төмөндө иштин үч түрү сунуш кылынат."},{"t":"h3","h":"Г. Кештенин атын аныкта"},{"t":"img","src":"data:image/webp;base64,UklGRloNAABXRUJQVlA4IE4NAACwaQCdASqUAVgBPrVaqU2nJaipJVT5WSAWiWluvHtMHIB9vkCZ8F9DbD66SGjV19Cr6j0SX/14YH//GbFwnFGitzcFdbklQSEwo5yVPn8xMu1QZk6XMXcnzD5n6KzQzt7i10iZa/VifhuS3nKFj3RUpJOVrojHFSSgX0/AsD+AL8X8cUaLnjM/6m7lNkH8TQTXYygGVRTOYGySGHvc/hlxFK7Q2bVmnFVExBIsFFUwpJLghQJ+QpGwFLd9rc7XmyM2HSBUKvSNC3vV8OcItIcP12fP23LYIpw8Inw+skveO8QWU1qTbX2tnkkEo9GjCoy6EP/zIbhXX/sEwrun/1b1LrGqr7NU39N9HCXVpOx0EZ3jB6WGJuzxZpWvKuzkwYfU374osX8+4/hIuqcgWuTx30yXarn/yf1A2wck1vdLrxXq4pAFQseX8Bz924gTZzfRxIJnHrdYQtf9XUXfNyWE1uLHdzLDEq7sz1eD9kip29HwUCgp3YhfIHYNWwAA+NhEOjmzDaeXFuGD/TGWCOqevZafNy02Sxjv03WAROcJHYAomj7kWxdnFNCiV0Dlu+U2RnNScv22Q1cUeeQQ4xzfkwQJ05LLdoI8w2iiBC9pLbZ/vazdR1Q0BZXiWzYS8tHNJzCjmwMeP0chet/1cjVqhkszLj0b5c/9a1jY+rMbfQT9DK5Zexr8RjXMcnQjiF/HOlFE+TDOu1Jk78C1Aen8XItY7f+Yyme72198CLgsj57qKL1xoJCePLQrXVxGV5ioOvajDOAQKr4oGfr5P/l/Tc0Y8T/vLNJP7/XBC3zOAzb5lqjQecV9kfVEPruWbPsGBmx0D4bBizAfcWiy4Hko6Ep57hjP4gpDaNkshUrSK6EpBM0d3K001JEVzo3V5tzoORDYpgipZu1oCzT55X/GJ7U79smtWpp5SHdlfnUEdG51d+KgVg9Kt9QUdXXxABc3MzgXy+SQ0aOFX9ug2lmGnb7wPLmULsV69xhH8C+wtiHV1nST/0UzA0JmhK5zbq+4Wb/tjeVDmS6iM6Oxj1hPxTh9ueqUzP2hspPOvEU+ifqTzr23V/nNDk+TW/QUGgmROn3aMNvh6JhOo6klRoiv5PLxcZx72N/Hqwbn8DCGzHaLRrvvgAD+8AuMEtjfoCUHbvY9BMLfK1SLZfxUX4hOot6UlWIEOZCwjuY1poIW60hvamNPoCr/bd/0FKbZEyhpRc53SSzroYFBN3ut23d2ytDm0iO0vb9579IVw8y1X6HdEqwEEtyP7hPjSeOL/3QXGfOiBscZFWyd24m0F2GRZksF47D47A+00jBZ8pvZL/XXdZdcOjJMfvziP+1p47h6bgcd9qCb94jiFzRaySXqK8lp7+F0fYOyVN a-n=\"153\">153<\/span>Чортонду Баатырбек баш болгон «мыктылар» жек көрүшчү (Т.Сыдыкбеков)."},{"t":"p","h":"2. Сүйлөм ичинде башка бирөөнүн сөзүнөн бөлүп алып киргизилген айрым сөздөр тырмакчага алынып, кичинекей тамга менен жазылат. Төл сөзгө тиешелүү кош чекит, сызыкча коюлбайт. М.: Мен «жаанга калыптыр» дегенди угуп, чыдай албадым (Н. Байтемиров). Тойчубектин «аттиң» дегени айласы кеткендиктен айтылган сөз эле (К. Баялинов)."},{"t":"p","h":"3. Өзгөчө бөлүнүп алынган сүйлөм, сөз, муун, тамга тырмакчага алынат. Ал эми китептерде кара же курсив шрифт менен жазылышы мүмкүн. М.: «Биз эгинди сугардык» деген сүйлөмдүн ээси – «биз», баяндоочу, – «сугардык». «Э» – кең, эринсиз, ичке үндүү тыбыш. «Эгин» – уңгусу, «-ди» – мүчөсү."},{"t":"p","h":"«КЕРЕГЕ КӨЗ ЖАНА ТУМАР-2» кештесине"},{"t":"p","h":"8.7."},{"t":"p","h":"– Оюңа бирдеме келип турат а, азамат? – деди Шердатка эркелете жылуу жүз багып. – Кайсы уруктансыз? (Т. Касымбеков)."},{"t":"img","src":"data:image/webp;base64,UklGRkINAABXRUJQVlA4IDYNAAAQbACdASqYAWMBPrVYqE2nJSimJZNpwRAWiWluvHrSkrGoPCMZLfd+r8vvZDWnf/7wxB1QWNB/TDhMebQZmPKjZa9IHCGM+z2R0NP9dzjvzXh2vm2PomYEp65+gA0y817ZHDcKZFilAVZXGC0BOtev7BI2GIHMPSvQjsbVD4G+nOaxqcmmEPu4P3+8GLkV1qciiVv7KyrRMfyqsgWgb852WPEg7QZn30L6sckOMIgHB/w8U4qPkaa+P1BNSXSsJWEE92E9q+JMEC3YawRB3422UgW5Ik/dOwtTJT7SrLThsoHZlKQEffgNk56TCKrG+QgbfJzmtP3Acs+oU3j2/AKhgat+svV4YyKHlrlnEZIZ26fEKeMylAUOvhijlKoW0oFQGr2NJNMwLgB4WKEoDh3eYs05MrugKMNnOlPaBuA0ULCPDuThIEU/2jCrIEnxOyhMMBjdmt2/1ibR7yi2INF8Q+kWvjDivoYrtW0JbcBR96QU0aOvpnSd7JIJ7rSiSyL7Sp/s8N8SVq8rbpdXeneqMR2o41NZjbhWPftUrEKgrO81nSZkhrwlLeX6lC7j0LCpUsW3xD39eYJWEFjPS0IdBqr7ykV3zceBMgfF3k0Mm/LEaJfdyuWlYgXTo+HwkHBf1ObL7Qy9ifQkaB16DuENfWNA33bHZDpYDQQAwbLq341VgiHeuLGm6AgsdLLFjHkMz397gHnPkRtVmxJdHtlapEILGJSFnsdTnLGhMPakQxV/rbOYJWLzCep8eyTWphKwCXHya8JUZFiUiaksdaBTaSukQyLl/jiLzTt9oMNZwWW+ZI8qOHqYoLATjOhkx+u8k4qMEtKqB6rhbwUSZ75wWb6lKuzPXBDxHkq4hQhsGQ1qErBPAknthLiq0ETiwovpFcpf3tMMBpFxyStKzCrYRXAItoNaWmFQFOQMKiuwcQPMcw2BHJmW74BX+e3lEQNUXs3lsGhCA56O88cSZM50/igpyNOZMx0 лөк жазылат)."},{"t":"p","h":"М.: 1) аалтымыш төрт, сексен мин, бир мин тогуз жүз жетимиш беш, ж. б."},{"t":"p","h":"– 2) эч качан, кимдир бирөө, ар качан,"},{"t":"p","h":"ар бир, тоону көздөй, жыйындан кийин, ага сөрөй, киши сымал, эн сонун, өтө кооз, ж.б."}],"sub":[{"title":"ШОКОЛАД","b":22},{"title":"АСАНБЕК ТАБАЛДИЕВ","b":27},{"title":"2. Сүйлөм мүчөлөрү боюнча талдоо","b":35},{"title":"МУРАТБЕК БЕГАЛИЕВ – КЫРГЫЗ МУЗЫКАСЫНЫН ГЕНИЙИ","b":45},{"title":"МУРАТААЛЫНЫН КҮҮ МЕНЕН АТАСЫН АЖЫРАТЫП АЛГАНЫ","b":51},{"title":"СПОРТ ЖЫЛДЫЗЫ РОККИ МАРЧИАНО","b":77},{"title":"§ 22. «САБАТ САНЖЫРАСЫ» ТОПТОМУ","b":81},{"title":"Г. Кештенин атын аныкта","b":83},{"title":"ПТ. Кайсы кештеде эреже кеп же аз?","b":93},{"title":"«ЖӨРГӨМҮШ» кештеси","b":143}],"section":"УП КЛАСС","pages":[142,157]},{"title":"§23. КЕМЧОНТОЙДУН КӨЧҮРҮП АЛГАНДАРЫНАН","blocks":[{"t":"h3","h":"§23. КЕМЧОНТОЙДУН КӨЧҮРҮП АЛГАНДАРЫНАН"},{"t":"p","h":"(Максатың: катадан арылтып көчүрүү) Биринчи жат жазуу"},{"t":"h3","h":"АКАДЕМИК АЛТЫМЫШОВДУН АДАПТОГЕНДЕРИ"},{"t":"p","h":"Кыргыз Республикасынын улуттук илимдер академиясынын академиги Арстанбек Алтымышов гезитин кабарчы-"},{"t":"v","l":["‚сына төмөнкүлөрдү айтып берген.","—1962-жылы Ленинграда космонавтардын ден соолугун","чындай турган дарылардын башкача айтканда күл азыгын","үстүндө иштей баштадым. Ошентип 15-20 жыл"]},{"t":"p","h":"космонавтика жаатында иштеп келдим. Натыйжа жаман болгон жок жемишин берди. Кыскасы 1965 жылдан баштап косманавтарга учканга чейин да учуп жүргөндө да учуп келгенден кийин да биздин колдон жаралган адаптогендер колдонулуп келди колдонулуп да жатат. Адоптоген деген дары менен тамак аштын ортосундагы заттардан жасалган, организмге зыяны жок акыл-эс жана күч кубат жумшап иштей турган иштерди аткарууда адамды төрт-беш эсе кубатандырган зат. Ар бир адаптогендин тутумунда жаратылыштагы ‚витаминдер, микроэлементтер, белоктор, органикалык кислоталар <span class=\"pg\" data-n=\"158\">158<\/span>ж.б. болот. Алар организмдер түгөнүп бараткан затардын ордун толтурат да ар бир клетканын органдын иштөөсүн күчөтүп, жөнгө салат. Алар адамдарга колдонуудан мурда жүздөгөн миндеген лабараториялык изилдөөлөрдөн өткөрүлөт. Жан жаныбарларга эксперимент жасалат. Мындайча айтканда бир эле адаптогенди талкудан алып чыгаруу үчүн миндеген машакаттуу жумуштар иштетилет. Ондогон медициналык мамлекетик камисияларда өткөрүлөт. Жакшырылгандан кийин гана патентке ээ болуп космонавтарга колдонууга уруксат берилет. Окумуштуулар тобу менин түздөн түз катышуум менен 12 түрлүү адаптогенди (гипкос, гипрекс, Арстанбап ж.б.) космостук тажрыйбага киргизип, ар тараптуу колдоого ээ болдук."},{"t":"p","h":"«Эркин Тоо» гезити"},{"t":"h3","h":"Әкинчи жат жазуу АТАЙДЫН КОМУЗУ"},{"t":"p","h":"Бүгүн консертке ушул комуз менен чыгам. Сиз да барып артистердин өнөрүн көрүңүз,—деп Атай Бөлөкбайды филормонияга алып келди. `Аңгыча консерт башталды. Үчөнөн кийин Атайга кезек келди. Бөлөкбай Атайдын мынчалык жылдыздуу жигит экендигине мурда анча көңүл бурган эмес экен сахнага чыга келгенде тим эле кол менен жасап койондой жарашыктуу көрүндү. Кыргызча тигилген кемселди кемер кур менен курчанып башындагы сусар тебетей бутундагы кара хром өтүк Атайга куюп койгондой. Әки бетинин ортосу билинер билинбес кызарган чап жаак кырдач мурун арыкчырай жүзгө тегизделген кыр мурут. Колунда асемделип жасалган ак боор өрүк комуз. Атай сахнага чыгары менен, залдагылар дулдата кол чабышты. Күйдүм чокту Алымканды куп гана келтирди бейм узака созулган кол чабулардан кийин Ак тамак, көк тамакты чертти. Элдин кол чабусу басандаганча Атай колун көтөрүп, бир-нерсе айтмакчы болду. Әл да муну туура түшүнгөндүктөн тынчый түштү. Тугандар өнөргө дем берип менин үнүмө үн кошуп жаткан – ак боор өрүк комуз. Бул комуздун ээси кыргыздын улуттук аспабын астейдил билген колунан көрү төгүлгөн уста Бөлөкбай аксакал. Атайын ат арытып жол басып алыскы Тоңдон келди. Ушул аксакалга ыразычылыгымды билдирем деп Бөлөкбайды колтуктап, көпчүлүккө көрсөттү. Зал ичи дүркүрөгөн кол чабуга жаңырып турду. Ошентип бул жолку консерте жаңы ак боор өрүк комуздун тушоосу кесилди. Ушундан <span class=\"pg\" data-n=\"159\">159<\/span>баштап бул комуздун аты «Ак боор» деп аталды. Атайдын көзү өткөндөн кийин, Ак боор көпкө чертилбей сумсайып илинип турат. Ордолуу журтун коломтосу куру эмес экен. Акыры колдон колго өтүп отуруп соңунда, Ысмайыл Борончиевдин колуна тийет."},{"t":"p","h":"«Чүй баяны» гезити"},{"t":"p","h":"Үчүнчү жат жазуу"},{"t":"h3","h":"АЛГЕБРАНЫН ТЕГИ – «ЭЛ ЖЕБР»"},{"t":"p","h":"Омар Хайям (1048-1122-жылдар) перс жана тажик акыны, математик, философ. Анын өмүрүнүн көбү Орто Азия менен Иранда Балх Самаркан Исфахан ж.б. шарларда өткөн."},{"t":"p","h":"Алгебра физика жана астрономия боюнча манилүү илимий ачылыштары бар Омар Хайямдын Әл-Жебр атуу китеби 1851 жылы немисче, 1957 жылы французча 1918 жылы англис тилине которулган. Кырк жыл (1052-1092) Султан Мелихшахтын кызматында, Нишапур обсерваториясынын башында мүдүр болуп турганда жазылган Эл-Жебр китеби азырынча бир да түрк элдеринин тилине которулган эмес. Алгебра менен байланыштуу эки чоң математикалык формула Омар Хайямга тийешелүү болгон менен, бүгүн мектептерде окуу китептеринде биринчи формула Омар Хайямдан үч жүз жыл кийин жашаган (1642—1727) Ньютондун атынан «Ньютон формуласы» же «Бином формуласы» деп, экинчиси болсо Паскалдын (1828-1662) атынан «Паскаль үч бурчтугу» деп аталып жүрөт. Омар Хайямдын илимий эмгектери Россиядагы Германиядагы музейлердин архивинде Англиянын Улуу Британ Оксфорд университетеринде сакталып турат. ‚ Америкалык белгилүү тарыхчы Билл Дурот минтип айткан Омар Хайямдын ыр саптарына карап өкүм чыгаргандар катуу жанылышат анткени анын 85 жылдык өмүрүндө ырлар ` аркылуу айткан ойлорунун тасири чектелүү болгон. Аны көчө кыдырган акын катары эмес үчүнчү даражадагы тендемелерди астрономиялык карталарды изилдеген түзгөн улуу окумуштуу инсан катары изилдешибиз керек."},{"t":"p","h":"КСӘ, «Заман Кыргызстан» гезити"},{"t":"p","h":"Төртүнчү жат жазуу"},{"t":"h3","h":"КҮЧТҮҮ ДАРЫЛАР"},{"t":"p","h":"Кытай медицинасында «Адамдын эң күчтүү дарысы адамдын организминде» деп айтылат. Бул адамдын ички энергиясы <span class=\"pg\" data-n=\"160\">160<\/span>«чи» – адамдын шилекейи, заарасы ж.б. Кеңеш Жусупов түзгөн кыргыздар деген эки томдук китептин ичинде «Кыргыздар жоокерчилик заманда батырлардын ичине найза сайылып калса, ал адамды териге ороп заарасын ичирип туруп, айыктырып ийишкен» – деген жери бар. Әкинчиден мен аксакалдардан уктум илгери адамды тулуптай кылып сабап таштаганда аны жаңы союлган малдын терисине ороп өзүнүн заарасын ичире берип айыктырып жиберишкен. Ошондой эле уринанын (зааранын) дагы бир касиети-адамдын ичиндеги ысыкты соруп алат. Күйүп калган жерге уринаны басса айыгып кетет. Малга көз тийип жатып калса ага уринаны шыбап жиберип айыктырып жиберген учурлар көп болуптур. Шилекейде лизацин деген зат бар. Бул зат жыландын уусун таратпай токтотуп койот. Ошондой эле денеге жарат чыканда шилекей менен сүртүп койсок айыктырып койгон касиети байкайбыз. Шилекейди кытайлар «өмүргө өтө керектүү сок» деп айтышат. Адамдын шилекейи түнкү саат 3.30 да эң күчтүү кубатына кирет. Ошол учурда туруп бир жаратың болсо шилекейиң менен сылап койсоң жакшы айыгып кетет."},{"t":"p","h":"«Кыргыз руху» гезити"},{"t":"h3","h":"Бешинчи жат жазуу КЫДЫР АКЕНИН ЧЕБЕРЧИЛИГИ"},{"t":"p","h":"Кыдыр аке кара кылды как жарган калыс данышман жылкынын күлүктүгүн сырткы келбетинен билген саяпкер куштун кыраанын дабышынан аныктаган мүнүшкөр бир айтканын эки кайталабаган токтоо оор басырыктуу адам болгон. Ошону менен катар ойлогонун башкаларга күү менен жеткире алган чеберчиликке эгедер экен. Кыдыр акеге саяк сарбагыш солто уруусунан арык белек тукумунан албандык казактардан ал жай түшүндүрүп акыл кеңеш сурап дайыма адамдар келип турган. Ошондой бир күндүн эртесинде күүгүм кирип, асманга жылдыз толгон маалда Кыдыр аке мейман күтүп жайбаракат отуруптур. Жакадан атынын ©луп-тирилерине карабай чаап келаткан чабаган аны-мунуга аялдабай шашылыш Кыдыр акени сыртка чакырып чыгып баласы Тогочунун оор абалда экенин айтат. «Болору болуп, боёсу канган тура муну кечээ эле жүрөгүм сезген меймандар тамагын жеп колдорун жууп бата кылмайынча эч шек алдырбагыла», – деп кайра кирип кетиптир. Айтканындай ошол <span class=\"pg\" data-n=\"161\">161<\/span>тегеректеги Кыдыр акенин кошуна жакын эл журт үн чыгарбайт. Меймандар беймарал тамагын ичип колун жууган соң Кыдыр аке керегеде илинип турган комузун алып кандайдыр жүрөк сыздатып көңүл чөгөргөн күү чертет. Ошондо төрдө отурган сакалдуу карыя ордунан турат да: «Ким болсо да акыретен ыйман берсин өткөнгө өкүнбөйлү, кеткенге кейибейли андан көрө көз көрсөтүп, үй-бүлөсүнө көңүл айталы», – дептир. Ошол муң-зар какшатып жүрөк үшүн алган терең сырдуу күүнү Кыдыр аке өлөр-өлгөнчө черти. «Тогочунун арманы» деп койчу дешет укан эл журт."},{"t":"p","h":"«Мугалимдер газетасынан»"},{"t":"h3","h":"Алтынчы жат жазуу"},{"t":"h3","h":"АК ТАЙЛАКТУУ КӨЧ"},{"t":"p","h":"Көч жармы ченде ак тайлактуу топ көрүндү. Чачпактай кара бээ минген зайып жүгүнүн үстүнө кызыл шырдак жабылган каймал жетелеп келет. Ак тайлак жай булутундай таза. Селкилдеп логлоп кайра жөн басып энесинин артында. Айрымач эрлүү жорго тай минген жаш бала демитип камчы менен түртүп коюп ак тайлактын жинине тийип ойноп келет. Ак тайлак ойдолой бере балага кичине айбат кыла «буу» деп тегерек капкара көздөрүн жайнатып башын чулгуп ал дагы бала да, оюнга өзү шерик, сеңселип маңган сайын мойнундагы жылаажын шыңгырап барат. Алардын сонунда үйдүн бойго жеткен кызы."},{"t":"p","h":"Кыздын мингени күмүш жабдыктуу тору кашка айгыр. Кызыл манат темингинин чачылуу жибек түймөлөрү эки үзөңгүдөн төмөн самсалап айгырдын ак шыйрагына кылтылдатып сеңселип келет. Кыз жолдо жардап турган кишилерди карап жашыл жердин сый чапанына түшкөн жамачыдай болуп жаткан чарчы эгин тилкелерине сонуркап колдорун жайган бойдон былк этпей катып тарунун ичинде турушкан каракчыларды кишиби деп, былк этпегенине таңыркап уйку толгон көздөрүн сүзүлтүп көч аягында. Кундуз бөрктүн үкүсү үлпүлдөп күндүн

кыйын эмес. Анткени анда анын байыркы тарыхы бар. Ал – ата бабалардан хан теңирлик шоңшогой баш кийим кийген огуздардан калган ыйык мурас. Әмне үчүн ак калпакты кыргыз эли гана сактап калды деген суро тулат. Бул сурого биз ар бир элдин кан жанынан бүткөн маданият гана узака жашайт жана ал аны өзү жок болуп кетмейинче түбөлүк сактоого аракет кылып улам убакытка жараша боек ыргак берип өнүктүрүп байытып отурат деп жоп берер элек. Ошондой маданий мураска кыргыздын ак калпагы, ак өргөсү, комузу кирет. «Кыргызстан маданияты» гезити"},{"t":"p","h":"<span class=\"pg\" data-n=\"69\">69<\/span>Он сегизинчи жат жазуу"}],"sub":[{"title":"ЖЫЛКЫНЫН АСЫЛДЫГЫ","b":4},{"title":"Он жетинчи жат жазуу АК КАЛПАК","b":9}],"section":"УП КЛАСС","pages":[68,69]},{"title":"КУРМАНЖАН ДАТКА","blocks":[{"t":"h3","h":"КУРМАНЖАН ДАТКА"},{"t":"p","h":"Алай канышасы аял сыртаны кыргыз аялдарынан чыкан алгачкы да акыркы да датка орус армиясынын полковниги Маматбай кызы Курманжан 1811-жылы Ош шарынын чөлкөмүндөгү жапалак айылында төрөлгөн. Ары катаал ары зобололуу өмүр кечирген бул тарыхый инсандын кеменгердиги зирек акылы өз элиндеги кадыр баркы анын көзүнүн тирүүсүндө эле татыктуу басын ала алган."},{"t":"p","h":"«Курманжан датканын акылы кайратулугу адилетүлүгү кыракылыгы жөнүндөгү аңыздар алыскы кыргыз көчмөн айылдарын аралап, Жетисуудан тартып Ооганстан Иран жана Кытай жергесинин чегине чейин жеткен», – деп жазган 1902 жылы барон Таубе Алай каникеси деген макаласында. Өз эли талапташтары гана эмес кайнаса каны кошулбаган кас душмандары да Курманжан датканын улулугун танып, ага Кокон хандыгынын акими Кудаяр, Букара эмири Сейид Мусафар Әд-дин мусулман тарыхында болуп көрбөгөн – аялзатына даткалык намды ыйгаруга аргасыз болушкан. Ал эми орус армиясынын генералы М.Д.Скобелев Курманжанга кымбат балуу чапан жаап, Алай канышасы деген атакты, орус армиясынын полковниги деген чинди берген. Россиянын императору даткага асыл таштуу алтын шакек менен каухар салып кооздолгон алтын саат тартулаган. Курманжан датка элинин башка мамлекетин бийликтин үстөмдүгү алдында болусун калабаган. Ал өз элинин жеринин толук эркин болусун биримдигин кездөгөн бүткүл өмүрүн ошол ыйык максатка багытаган инсан. Бул аял сыртаны Курманжан датка 1907 жылы 96 жаш курагында кайрымсыз сапарына кете берген."},{"t":"p","h":"«Дыйкандар гезити»"},{"t":"p","h":"Он тогузунчу жат жазуу"},{"t":"h3","h":"СУЛТАН ИБРАИМОВ"},{"t":"p","h":"Папан суу сактагычынын курулушу эчак башталыш керек эле ар кандай себеп менен создуктурула берди. Алкынып акан акбураны толугу менен эл кызыкчылыгына жумшоо көптөн берки тилек. Султан Ибраимов курулуштун ишин тездетүүнү колго алды. Курулушта кечке жүрүп кечкурун кайра тартмакчы болду шарга. Тээ алыстан жылт жылт от күйөт. Ким болду экен? Жалгыз үйдүн бул жерде эмне тирлиги бар Султан жанындагылар менен ошол жарык чыккан үйгө бурулду. <span class=\"pg\" data-n=\"70\">70<\/span>Чын эле жалгыз үй экен. Кирип келишсе, абышка кемпир, жалгыс кызы төшөктө оорууп жатыптыр. Келгиле айланайындар байбиче кесеге айран куйуп сунду кызыбыз ушинтип оорууп калыптыр."},{"t":"p","h":"Качантан бери? Султан сыңар тизелей отура калып жаш кызды чекесинен сылады. Денеси от менен жалын. Чоочуп кетти. Бул жерде эмне кесип кыласыздар? Баланын эти ысып чыкан турбайбы?"},{"t":"p","h":"Кароолчубуз, айланайындар карыя башка эч нерсе айта албай мукактанды."},{"t":"p","h":"Кызды биз алып докторго жеткиребиз. Сиздерге совхоздун жетекчилери байланышат деп шашылыш түрдө оору кызды машинасына отургузду. Ошко түн ортосуна жакын келишти. Кызды оруканага жаткырды. Кыз бир ай дегенде оруканадан чыгып, кайда барарын билбеди. Ким түн ичинде алып келип оруканага жаткырганын да билбептир. Докторлор таңдана карашат. Сени обкомдун биринчи катчысы алып келди. Ал эмнең болот? Билбейм. Биз Папанда болчубуз. Машинасына салып алып келген. Башкы врач айласыздан обкомго телефон чалып байланышты."},{"t":"p","h":"«Айыкса жакшы болуптур. Биздикине жеткирип койгула обкомдун катчысынын бул жообу башкы врачты ого бетер танданты. Султандын өмүрлүк жары Рева айыгып чыкан кызды үйүнө бөпөлөп, бир сыйра кийиндирди. Анан машина менен Папанга жеткирип койду."},{"t":"p","h":"Ие балам санама ар нерсе түшө берип алардын ким экенин да сурабай калыпмын кийин киши жибериптир. Ошолорго ырахмат сени тим эле кыдыр дарыган тура балам деп атасы кубангандан көзүнө жаш алды."},{"t":"p","h":"«Кыргыз Туусу» гезити"},{"t":"h3","h":"Жыйырманчы жат жазуу ИСХАК РАЗЗАКОВДУН БЕЙНЕСИ"},{"t":"p","h":"Арийне, Исхак Раззакович (1910—1979) өз дорунун мезгилинин артыкча бир кулуну болгон. Лейлек өрөнүндө тулуп жетимчиликтин азабын тартып балдар үйүндө тарбияланып өзгөчө зендүлүгү менен Ташкендеги педтехникумду Москвадагы пландоо институтун бүтүп бордош Өзбекстанда экономист болуп иштеген. Улуу Ата Мекендик согуштан кийинки эл али тоюна элек жыртык жылаңач оор жылдарда Исхак Раззакович республикабызда экинин бири болуп кызмат өтөп турганда, экономикабызда маданиятыбызда эң бир чоң иштер турмушка ашкан. Кыргызстан КП БКнын бирин- Т0 <span class=\"pg\" data-n=\"71\">71<\/span>чи секратары кызматында ал он бир жыл үзүрлүү эмгектенген. Анын тушунда не бир ири курулуштар ишке ашкан. Алсак отуздан ашык ири ишканалар, алардын ичинде Токмок, Аксуу, Кант комбинаттары ж.б. курулган. Анын инсандык мүнөзүн ачып көрсөткөн дагы бир касиет кыргыз тилинин орус жана башка мектептерде окутуу программасына киргизилиши. Дал Исхак Раззаковичтин демилгеси менен жогорку окуу жайларында кыргыз жаштарынын саны жетимиш пайызга жеткирилген. Кыргыз илимдер академиясынын, курортология анкология дыйканчылык мал чарба педагогика илим изилдөө институтарынын ачылышы да анын ысымы менен байланыштуу. Әгерде Кыргыз Республикасынын Президенти Аскар Акаев белгилеген Манастын жети осуятына таянып Исхак Раззаковичтин өмүр жолуна көз чаптырсак анда биз анын өз элин чексиз сүйгөн бир тууган кошуна элдердин ортосундагы ынтымакты чындоо үчүн тынымсыз иш алып барган элибиздин намысын ар дайым ыйык сактаган мээнеткеч ары айкөл ары сабырдуу, кыргыз жеринин тагдыры үчүн күрөшкөн өз өмүрүн кыргыз эгемендүү республикасы үчүн арнаган караңгыда жол тапкан кысталышта сөз тапкан жөнөкөй жана маданияттуу улуу инсан болгондугун ачык көрөбүз. А. Какеев 64-көнүгүү. Ташымал белгиси менен көчүргүлө."},{"t":"v","l":["1. Күнгөйү толгон карагат,","Күнчүлүк жол арасы","Күнүгө келсең аралап,","Күрпүлдөйт сайда суулары,","Күмүштөнүп шар агат,","Кочуштап ичсең бал татып,","Көңүлүң кубат ала алат.","Күйүшөр жарын табалбай","Күкүгү жүрөт сабалап.","Күрөң аюу капталда","Күржүйүп кетпей пааналап.","Күн ысый түшсө бир азга","Киринет сууга мамалак.","2. Түнкүсүн ойноп дүмпүлдөк,","Түрүнө чуркап акчелмек.","Жоолугун таштап бекитип,","Жонуна чапса дүңкүлдөп,","Келин-кыз күлсө шарактап,","Кемпир-чал үйдөн күңкүлдөп.","<span class=\"pg\" data-n=\"72\">72<\/span>3. Ак мөңгү жаткан төрүндө","Ак тайлак болуп суналып.","Адырдан чууруйт кой-эчки","Ала аркан болуп чубалып.","4.Кишини тиктеп таңыркап,","Кайыбы качпайт бекинип.","Коктудан түшкөн булактан","Комуздун күүсү чертилип,","Кыймылдайт кайың бутагы","Көк кашка сууга серпилип!","5. Кызыктырат көргөндү","Кыналып өскөн кайыңы.","Күз болгондо атайлап,","Керене гүлдүү сарала","Кийгендей көйнөк шайыны.","6. Кур таштуу бийик аскасын","Кургандай уста чегелеп,","Аяктай булут топтолсо,","Асманда жамгыр себелеп.","Жан-жаныбар, тоо-таштар","Жаралган кандай керемет!","Жүгүрүп чыгып баландай","Жүрөбүз сени тебелеп.","7. Жангактары шагырап","Бир ажайып керунген,","Жузумдеру салбырап","Талга асылып ерулген."]},{"t":"h3","h":"Женижок"},{"t":"p","h":"Үлгү: Жу-зум-де-ру сал -бы – ран."},{"t":"p","h":"Тал -га асы – лып ерул – ген."}],"sub":[{"title":"СУЛТАН ИБРАИМОВ","b":5},{"title":"Жыйырманчы жат жазуу ИСХАК РАЗЗАКОВДУН БЕЙНЕСИ","b":13},{"title":"Женижок","b":16}],"section":"УП КЛАСС","pages":[70,72]},{"title":"КЕП КУРЖУН","blocks":[{"t":"h3","h":"КЕП КУРЖУН"},{"t":"v","l":["Кеп куржун – бул шарттуу түшүнүк, ал кеп салынган","куржундун маанисинде, б.а., анда ата-бабанын кашыктап","жыйнап чогулткан, көздүн карегиндей сактап кастарлаган,"]},{"t":"p","h":"атадан балага берилген түркүн-түркүн тил байлыгынан алынган үзүндүлөр бар. Ал – тике келечек ээсине – сага арналган, чыпчыргасы менен тартууланган улуулардын шыбагасы."},{"t":"p","h":"Эми алардын ээси – өзүңсүң. Аны кут катары кемелине келтирип урунар да, жыйнап-термеп колдонор да, ал аркылуу Т2 <span class=\"pg\" data-n=\"73\">73<\/span>колунду узартар да, керек болсо аларды кийинки муунга төкпөй-чачпай ыйык мурас катары өткөрүп берер да – сенсиң. Кеп куржундагы дүйнө кооздук үчүн төргө куйругу чубалжыта илинип коюлган кыргоолдун кызыл корозунун кебиндей нерсе эмес, ал – ойлосоң оюңа, сүйлөсөң сөзүңө канат бүтүргөн, угарман менен окурманга тез, маани-маңыздуу, элестүү, уккулуктуу, таасирдүү түрдө жете алган кадыресе эле тилдин байланыш куралы."},{"t":"p","h":"Кеп куржунга салынган тил байлыктары төмөнкүдөй ыраатта жайгаштырылды: 1) «Макал» топтому; 2) «Санат сөз» топтому; 3) «Сөз берметтери» топтому; 4) «Мээр сөз» топтому;"},{"t":"p","h":"5) «Санжыргалуу казына» топтому; 6) «Тил кутучасы» топтому; 7) «Илхам кеп» топтому."}],"sub":[],"section":"УП КЛАСС","pages":[73,73]},{"title":"5$ 7. «МАКАЛ» ТОПТОМУ","blocks":[{"t":"h3","h":"5$ 7. «МАКАЛ» ТОПТОМУ"},{"t":"p","h":"Макалдар турмуштук тажрыйбалардын негизинде пайда болуп, ошол эл жашаган"},{"t":"p","h":"доордун бүткүл тармагын кучагына алат. С. Закиров"},{"t":"p","h":"Макал – тээ байыркы ата-бабадан берки келаткан курч, укулуктуу, таасын, учкул, таасирдүү жана куюлушкан нуска кеп. Анда жүйө да, акылгөйлүк да бар. Алар кулак курчун кандырган кара жаак, жез таңдай чечендерге, ырды көнөктөп төккөн ырчыларга, саймедиреген санжырачыларга гана тиешелүү эмес. Ал, мурда, карапайым калктын ар бир кулунуна, ошолордун ичинде кеп, сөздү дилгирлик менен үйрөнүп жаткан сага да таандык. Макалдар – бул сенин арка-жөлөгүң, таянычың. Аны колдонгондо бабырап көп сүйлөөдөн кутуласың, кыска, бирок нуска, бутага дал тийген таасын, курч сөздүн ээси болосуң, маектешиңди жүйөгө жыгасың, ошол эле учурда жыгыла билген нарктуулукту да боюңа сиңиресиң."},{"t":"p","h":"Макалдар – калктын акыл казынасы. Андан ар бир атуул чөмүчтөп сузуп алып, урунууга тийиш. Бул – кааласаң да, каалабасаң да аткарылчу жумуш. Сенин жарандык парзың."},{"t":"p","h":"Макалдар тогуздан тестеленип берилди."},{"t":"p","h":"Биринчи тесте 1. «Өнөр алды – кызыл тил». 2. «Отуз тиштен чыккан сөз отуз уруу элге тарайт». 8. «Куру сөз курсак тойгузбайт»."},{"t":"p","h":"4. «Күлүктөн күлүк чыкса, төрт аягы тыпырайт». 5. «Мактоо макоого <span class=\"pg\" data-n=\"74\">74<\/span>жагат». 6. «Кесирдүү ооздон кесепеттүү сөз чыгат». 7. «Катуу сөз – камчы, жылуу сөз – укурук». 8. «Йриген ооздон чириген сөз чыгат». 9. «Жакшы таап сүйлөйт, жаман каап сүйлөйт»."},{"t":"h3","h":"Әкинчи тесте"},{"t":"p","h":"1. «Бура сүйлөгөн күлөргө жакшы, булкунган ат минерге жакшы». 2. «Бутунан мүдүрүлгөн турат, оозунан мудүрүлгөн турбайт». 3. «Жакшы атка бир камчы, жаман атка миң камчы». 4. «Баш кесмек бар, тил кесмек жок». 5. «Бетке айткан сөздүн заары жок». 6. «Аркандын узуну, сөздүн кыскасы жакшы». 7. «Айың кеп айылды иритет». 8. «Айткан сөз – алышкан кол». 9. «Сөз билбеген муштуму менен коркутат»."},{"t":"h3","h":"Үчүнчү тесте"},{"t":"p","h":"1. «Өткүр бычак кынга кас». 2. «Сөз бирөө, кулак экөө»."},{"t":"p","h":"3. «Кептен кемтик, сөздөн сөлтүк болбо». 4. «Сөздү сөз келгенде айтпаса, атасы өлөт». 5. «Сөз сөөктөн өтөт, жүлүнгө жетет». 6. «Сөздү сөз табат». \"7. «Сөз сурамак – ызаат, ат сурамак – сүннөт (милдет)». 8. «Сөздүн айгагы – сөз». 9. «Оозуң менен орок орбо, көзүң менен машак тербе»."},{"t":"h3","h":"Төртүнчү тесте"},{"t":"p","h":"1. «Сөөксүз тил сөөктү сындырат». 2. «Сууну көп кечсе, чалчык болот, сөздү көп сүйлөсө, тантык болот». 3. «Жамандыкты амандык жеңет». 4. Тамашага – тамаша, каяшага – каяша». 5. «Тарс эткендин баары – тамаша, карс эткендин баары – күлкү». 6. «Ок жарасынан тил жарасы жаман». 7. «Тешик ооз тек турбайт». 8. «Тилазар тилге кирбейт». 9. «Тил таш жарат, таш жарбаса, баш жарат»."},{"t":"h3","h":"Бешинчи тесте"},{"t":"p","h":"1. «Тилде сөөк жок». 2. «Тили таттуу аш жейт, тили ачуу муш жейт». 8. «Тиш өтпөгөнгө тил өтөт». 4. «Тууган катары кучакташтырган – тил, душман катары бычакташтырган – тил». 5. «Туура сөз кылычтан өткүр». 6. «Туура кеп тууганга жакпайт». 7. «Уй мүйүзүнөн, адам сөзүнөн сынат»."},{"t":"p","h":"8. «Ушак уксан, унутуп сал». 9. «Каап айтканча, таап айт»."},{"t":"h3","h":"Алтынчы тесте"},{"t":"p","h":"1. «Койдун каргышы карышкырга жетпейт». 2. «Бөдөнөнүн үйү жок, кайда барса бытпылдык». 8. «Бөдөнөнүн жатагын <span class=\"pg\" data-n=\"75\">75<\/span>көр да, этине таарынба». 4. «Бөрү арыгын билгизбей сырткы жүнүн дүгдүйтөт». 5. «Бөрү атар уулду бөркүнөн тааны». 6. «Бөрү баласы ит болбойт». Т. «Касапчыга мал кайгы, кара эчкиге жан кайгы». 8. «Жоголгон бычактын сабы алтын». 9. «Битке өчөшүп, көйнөгүндү отко салба»."}],"sub":[{"title":"Үчүнчү тесте","b":10},{"title":"Төртүнчү тесте","b":13},{"title":"Бешинчи тесте","b":15},{"title":"Алтынчы тесте","b":18}],"section":"УП КЛАСС","pages":[74,75]},{"title":"МАКАЛ ЖАТТОО","blocks":[{"t":"h3","h":"МАКАЛ ЖАТТОО"},{"t":"p","h":"Ар бир тесте өз-өзүнчө жатталат."},{"t":"h3","h":"МАКАЛ АЙТЫШУУ 1—2-тесте боюнча"},{"t":"p","h":"ШАРТЫ. Класс эки топко белунет. Ар бир топ макалды кеп билген окуучусун доскага чыгарат. Анан экее кезеги менен макал айтышат. Бири токтоп калса, экинчи чуурутуп айта берет. Бир макал эки кайталанбайт. Кимиси көп макал айтса, ошол жеңет."},{"t":"h3","h":"3—4-тесте боюнча"},{"t":"p","h":"Мунун шарты да 1-2-тестеникиндей."},{"t":"h3","h":"5—6-тесте боюнча"},{"t":"p","h":"Мында да макал айтышуу жогорудагы 1-2-тестенин шартына окшош."},{"t":"h3","h":"1—6-тесте боюнча"},{"t":"p","h":"Мында да класс эки топко бөлүнөт. Ар бир топ макалды көп билген окуучусун чыгарат да, алар макал айтышат. Демек, шарты да жогоркуларга (1-2-тестеге) окшош."},{"t":"p","h":"«Айдан, айдан ай көрөк» оюну Мында да класстагы окуучулар эки топко бөлүнөт. Бирок мында таймашчу окуучуну каршы топ чакырып алат. Демек, макалды эң мыкты билгендер эмес, өтө начар же чала билгендер таймашка чыгарылат. Төмөндөгүдөй тартип сакталат. Айталы, биринчи топтун окуучулары хор менен: ТӨ"},{"t":"v","l":["<span class=\"pg\" data-n=\"76\">76<\/span>«Айдан, айдан ай көрөк,","Айдын башы төгөрөк.","Таймаштан намыс алдырбас,","Бизге тээтиги Кундуздун өзү керек!» —","деп өздөрү каалаган окуучуну доскага чакырышат."]},{"t":"p","h":"Экинчи топ да ыр менен биринчи топтон керектүү деген окуучусун доскага чыгарат. Анан кезеги боюнча улам бирден макал айтып беттешет. Бирөө токтоп калса, экинчиси макалды токтобой айта берсе болот. Әсепти мугалим жүргүзөт. Ушундай тартип менен макал айтышуу оюну төмөнкүлөрдү кучагына алат:"},{"t":"v","l":["а) 1-2-тесте боюнча;","б) 3—4-тесте боюнча;","в) 5—6-тесте боюнча;","г) 1-6-тесте боюнча жүргүзүлөт."]},{"t":"h3","h":"Сүйлөп машыгуу Үл г ү. «Тек жүрсөң, ток жүрөсүң». Бул макалды оозеки"},{"t":"p","h":"сөзүңдө төмөнкүчө пайдалансаң болот."},{"t":"p","h":"1. «Тек жүрсөң, ток жүрөсүң» дегендин эмнеси жаман. Сен «Тек жүрсөн, ток жүрөсүң» дегенди эсинден чыгарып койбо."},{"t":"p","h":"Мен «тек жүрсөн, ток жүрөсүң» деген макалды күндө угам, кулагыма кумдай куюшат. «Тек жүрсөң, ток жүрөсүң» дегендей, кудайга шүгүр, бирөөдөн жаман тил угуп көрө элекмин. «Тек жүрсөң, ток жүрөсүң» да. Тек жүргөндүн ток жүрөрү чын, мунун жалганы барбы ж.б."},{"t":"p","h":"2. Назгүл: «Тек жүрсөң, ток жүрөсүң», – деди. «Тек жүрсөң, – деген Айдай, – ток жүрөсүң». «Тек жүрсөн, ток жүрөсүң», – деп айткан Нурсултан. Дастан минтип айткан: «Тек жүрсөң, ток жүрөсүң». Тек жүргөн ток жүрөрүн Ширин айтыптыр ж.б."},{"t":"p","h":"Үлгүгө окшоштуруп иште."},{"t":"p","h":"М.: «Өнөр алды – кызыл тил» дегендин мааниси өтө терең ж.б."},{"t":"p","h":"2. Әкинчи тесте да жогоркудай эле иштелет."},{"t":"p","h":"3. Үчүнчү тесте боюнча да жогоркудай оозеки сүйлөм туз."},{"t":"p","h":"4. Төртүнчү тестени да өйдөкүлөрдөй аткар."},{"t":"v","l":["5. Бешинчи тесте да ошондой аткарылат.","6. Алтынчы тесте боюнча да ошондой иште."]},{"t":"p","h":"<span class=\"pg\" data-n=\"77\">77<\/span>Жазып машыгуу 65-кенугуу. 1-тестедеги 9 макалды катыштырып сүйлөм туз. Үлгү: «Өнөр алды – кызыл тил» дегенди доскага бадырайта жазып койдум. Нуржан: «Өнөр алды – кызыл тил»,— деди (мында «Сабат санжырасындагы» «Кереге көз жана тумар» кештелерин эсине ал)."},{"t":"p","h":"66-көнүгүү. 2-тестедеги макалдарды катыштырып бир нече сүйлөм түз."},{"t":"p","h":"67-көнүгүү. 8-тестедеги макалдардын ар бирине өүнчө бирден сүйлөм түз."},{"t":"p","h":"68-көнүгүү. 4-тестедеги макалдардын ар бирин катыштырып сүйлөм түз."},{"t":"p","h":"69-көнүгүү. 5-тестедеги ар бир макалга сүйлөм түз."},{"t":"p","h":"70-кенугуу. 6-тестедеги макалдардын маанисин чечмелеп жаз."}],"sub":[{"title":"МАКАЛ АЙТЫШУУ 1—2-тесте боюнча","b":2},{"title":"3—4-тесте боюнча","b":4},{"title":"5—6-тесте боюнча","b":6},{"title":"1—6-тесте боюнча","b":8},{"title":"Сүйлөп машыгуу Үл г ү. «Тек жүрсөң, ток жүрөсүң». Бул макалды оозеки","b":14}],"section":"УП КЛАСС","pages":[76,77]},{"title":"§ 8. «САНАТ СӨЗ» ТОПТОМУ","blocks":[{"t":"h3","h":"§ 8. «САНАТ СӨЗ» ТОПТОМУ"},{"t":"p","h":"«Сөздүн көркү – санат» Макал"},{"t":"p","h":"Санат сөз – бул да жалпы калайык-калк колдонгон мааниге бай ыргактуу кеп. Ал ырдалып да, ырдалбай да айтыла берет. Аны жалаң адабиятка таандык кылып коюуга болбойт, ал – тилдин да энчиси. Калыгул Бай уулу санаттарды ырдабай эле сүйлөп айткан. Мындай учурлар башка акындарда да кездешет. Нечен карыялар ат үстүндө баратып эле тиешелүү окуяга, же кырдаалга карата мамилесин санат сөздөр менен тизмектетип айтып салган. Ошол себептүү Х1ЇХ кылымдын экинчи жарымында кыргыз жерине келген академик В.В. Радлов минтип жазган: «Кыргыздар эч буйдалбастан, токтоосуз, шар сүйлөшөт. Алар оюн ачык, так айта билишет. Сүйлөгөндө сөздөрүндө белгилүү деңгээлде көркөмдүк сезилип турат. Жөнөкөй эле сүйлөгөн сөздөрүндө, айтыштардын курулушунда мезгилмезгили менен ритмикалык өлчөмдөр байкалып турат. Сүйлөм артынан сүйлөм, ыр сабактары түрүндө келе түшкөндөй пикир калтырат». Санат сөз эмне үчүн керек? Угуучуну ынтаа менен тыншатуу, ойдун сулуулугу менен башкаларга таасир этүү, таң калтырып кабыл алдыруу үчүн керек. Ал – укканды ыракат алдырган канаттуу кеп. Аны <span class=\"pg\" data-n=\"78\">78<\/span>менен акыл айтылып, тарбия берилет, эмне жакшы, эмне жаман экендиги, жашоо, адам, жаратылыш, заман жөн үндө санат айтылат."},{"t":"p","h":"Урматтуу окуучум, санат сөздөр – сенин да энчиң, сүйлөшүүдө колдонулуучу тил каражатың. Бир кезде кеңири пайдаланып, анан изи китептерде калып, колдонулушу сээлдеп, аягы өчүп бараткан канаттуу кептин отун кайрадан тутант, от кала!"},{"t":"h3","h":"Биринчи кайрык"},{"t":"p","h":"1. Дениң соодо эринбей, бекерликке берилбей, эркиң менен жумуш кыл, «эринчээк, жалкоо» дедирбей."},{"t":"p","h":"2. Аз өмүрдүн ичинде амандашкын күнүгө, өлбөгөнгө табылат аздыр-көптүр дүнүйө."},{"t":"p","h":"3. Өнөрүң болсо өргө чап, кор кылбай асыл жанды бак. Әрдин көркү эл менен, эмгегиң менен элге жак."},{"t":"p","h":"4. Дайранын көркү – кемеде, баланын көркү – энеде."},{"t":"p","h":"5. Ынтымак болсо калкыңда, душманындан тартынба. Күжүрмөн элдин күчү өтөт, күмүш менен алтынга. Күчүң барда, эр жигит, күмүш өңдүү жалтылда (Токтогул))."},{"t":"p","h":"Әкинчи кайрык 1. Бар болсоң, сага тууган көп, жок болсоң, арттан кууган көп."},{"t":"p","h":"2. Билгенге билген киши арыз айтпайбы, мокок бычак, кашаң ат, жаман аял эрте эле эр жигитти картайтпайбы (Эшманбет)."},{"t":"p","h":"3. Жамгырдын кыян, сели жерди бузат, адамдан чыккан бузук элди бузат."},{"t":"p","h":"4.Ушакчы ырыскылуу элди бузат, кээ бирлер карматпастан кетсе узак, ага да астыртадан коёт тузак."},{"t":"p","h":"5. Ынтымактуу биригет, ынтымаксыз бүлүнөт (Барпы)."},{"t":"h3","h":"Үчүнчү кайрык"},{"t":"p","h":"1. Арыктын көркү болбойт, тал болбосо, чарбанын көркү болбойт, мал болбосо. Дыйканга түшүм кайда, жер болбосо, Ала-Тоо көрккө келбейт, эл болбосо (Барпы)."},{"t":"p","h":"2. Жери жатык, көк шибер түздөн жакшы бар бекен?"},{"t":"p","h":"Жемиштин баары тең бышып, күздөн жакшы бар бекен?"},{"t":"p","h":"3. Карчыга салып, каз алса, уудан жакшы бар бекен? Суусап жүрүп бир жутса, сууктугу музча бар, суудан жакшы бар бекен?"},{"t":"p","h":"4. Жамандан суук сөз чыгат, уруша кетсе көз чыгат."},{"t":"p","h":"5. Эр канаты ат болот, бергендин баары март болот (Молдо Нияз)."},{"t":"h3","h":"<span class=\"pg\" data-n=\"79\">79<\/span>Төртүнчү кайрык"},{"t":"p","h":"1. Әшигинен туташып, төрү күйсүн бузуктун. Түтүн чыгып өлгөндө, көрү күйсүн бузуктун {Молдо Нияз)."},{"t":"p","h":"2. Жаман айткан суук сөз сөөккө баскан тамгадай."},{"t":"p","h":"3. Акылы бар азамат зымга тарткан күмүштөй, айткан сөзү ширелүү демдеп койгон күрүчтөй."},{"t":"p","h":"4. Айыл бузган азамат уй качырган сайгактай. Сөз бербеген жөө чечен учуп жүргөн камгактай (Молдо Кылыч)."},{"t":"p","h":"5. Коркок миң өлөт, артында тарпы калат. Баатыр бир өлөт, артында даңкы калат (Шапак баатыр)."},{"t":"v","l":["Жаттоо","","Ар бир кайрык өзүнчө жатталат.","1. Биринчи кайрык: 1, 2, 3, 4, 5.","2. Экинчи кайрык: 1, 2, 3, 4,5.","3. Учунчу кайрык: 1, 2, 3, 4, 5.","4. Төртүнчү кайрык: 1, 2, 3, 4, 5.","","Суйлеп машыгуу"]},{"t":"p","h":"71-кенугуу. Биринчи кайрыктагы санаттарды өз сөзүңө кошуп сүйлө."},{"t":"p","h":"Үлгү: Токтогул Сатылгановдун «дениң соодо эринбей, бекерликке берилбей, эркиң менен жумуш кыл, «эринчээк, жалкоо» дедирбей» дегени эч качан маанисин жоготпойт. 72-кенугуу. Экинчи кайрыктагы санаттарды да 71-кенугуунун үлгүсү менен иште."},{"t":"p","h":"73-кенугуу. Үчүнчү кайрыктагы санаттар да 71-көнүгүүнүн үлгүсүндө аткарылат."},{"t":"p","h":"74-кенугуу. Төртүнчү кайрык да 71-көнүгүүнүн үлгүсү менен иштелет."},{"t":"p","h":"Жазып машыгуу 75-кенугуу. Биринчи кайрыктагы санат сөздөрдү катыштырып, өз алдыңча сүйлөм түз. Мында төл жана бөтөн сөздүн жазылыш эрежелерин пайдаланасын. 7.1 – 7.2-кештелер боюнча, ал «Сабат санжырасы» топтомунда бар."},{"t":"p","h":"76-кенугуу. Экинчи кайрыктагы санат сөздөрдү катыштырып, сүйлөмдөр түз. Төл жана бөтөн сөздүн жазылыш эрежелерин 7.3- кеште боюнча колдон."},{"t":"p","h":"<span class=\"pg\" data-n=\"80\">80<\/span>77-кенугуу. Үчүнчү кайрыктагы санат сөздөрдү төл жана бөтөн сөздүн 7.4-кештеси боюнча жаз."},{"t":"p","h":"78-кенугуу. Төртүнчү кайрыктын ар бирин төл жана бөтөн сөздүн ар башка жазылуу эрежелери менен жаз."}],"sub":[{"title":"Биринчи кайрык","b":4},{"title":"Үчүнчү кайрык","b":15},{"title":"Төртүнчү кайрык","b":22}],"section":"УП КЛАСС","pages":[78,80]},{"title":"§ 9. «СӨЗ БЕРМЕТТЕРИ» ТОПТОМУ","blocks":[{"t":"h3","h":"§ 9. «СӨЗ БЕРМЕТТЕРИ» ТОПТОМУ"},{"t":"p","h":"Сөз берметтери (же туруктуу сөз айкаштары) – ой-пикирди таамай, курч, жеткиликтүү, көркөм кылып. берүүчү эң бай тилдик каражат (ал илимде «фразеология» деген грекчеден кабыл алынган термин менен туюндурулат). Жана да калктын кебинин каймагы. Өзүң салыштырып көр."},{"t":"p","h":"1. Ал иштебейт."},{"t":"p","h":"2. Ал чырпык башын сындырбайт."},{"t":"p","h":"Бул эки сүйлөмдүн кайсынысы жагат? Албетте, 2- сүйлөм жакшы. Эмне үчүн? Анткени «чырпык башын сындырбайт» (анын «куурай башын сындырбаган» деген да түгөйү бар) – бул күчтүү, кооз, образдуу каражат, ал – жандуу жана учкул. Аны колдонуу менен пикириңди угуучуга тез жеткире аласың. «Ал иштебейтке» караганда «Ал чырпык башын сындырбайт» деген сүйлөм тез кабыл алынат, эстен да чыкпайт, анткени көз алдыңа чырпык башын сындырып отун алуудан эринген жалкоо кишинин кейпи келе калат. Демек, мындай тилдик бай каражаттын ээси – мен, сен, ал – баарыбыз. Ал эми төмөндөгү тестелер мурдун көтөрүү, сиркеси суу көтөрбөө, мурдуна суу жетүү, жонунан кайыш алуу, төбө чачы тик туруу өңдүү жүздөгөн сөз берметтерин ийгерип алышыңдын башталышы болмокчу."},{"t":"h3","h":"Биринчи тесте"},{"t":"p","h":"1. Жаа бою качуу (өзүнө жакын жуутпоо, уккусу, көргүсү келбей качып туруу)."},{"t":"p","h":"2. Жаагы жап болуу (кеп кайыра албоо, унчуга албай, сүйлөй албай калуу)"},{"t":"p","h":"З. Жаагын жануу (безеленип көп сүйлөө, безеленип тынбай ырдоо)."},{"t":"p","h":"4. Жаактан башты айыргыдай кылуу (жакын адамдарынан ажыратып коюу, ыркын бузуу, арасын ажыратуу)."},{"t":"p","h":"5. Жаалы катуу (ачуулуу, каардуу)."},{"t":"p","h":"6. Жабуулуу кара инген (көтөрүмдүү, токтоо, текебери жок, кадырман, баарына бирдей караган)."},{"t":"p","h":"<span class=\"pg\" data-n=\"81\">81<\/span>17. Жабылуу аяк жабуусу менен калсын (эч ким билбесин, билинбеген иш билинбеген боюнча кала берсин)."},{"t":"h3","h":"Экинчи тесте"},{"t":"p","h":"1. Жайыл дасторкон (үйүнөн тамак-ашы үзүлбөгөн, казанаштуу, кең пейил, берекелүү, берешен, март)."},{"t":"p","h":"2. Жалпак тилге салуу (бирөөнү жайкама тилге салып алдоо, азгыруу, өзүнө тартуу, жасап сүйлөө)."},{"t":"p","h":"3. Жан бакты (өз алдынча аракет кылбаган, жанынын тынчын издеген, кыйналбай жан бакканды жакшы көргөн, бирөөнүн эсебинен жашаган)."},{"t":"p","h":"4. Жан бычактын мизинде (өтө коркунучтуу, кооптуу абалда, өлүм алдында)."},{"t":"p","h":"5. Жанга теңебөө (өзүн башкалардан жогору саноо, эч кимди теңсинбөө, бой көтөрүү)."},{"t":"p","h":"6. Жанга батуу (бир нерсенин запкысынан абдан кыйналуу, жаны кейүү)."},{"t":"p","h":"17. Жандан түңүлүү (жашоодон үмүт үзүү, катуу коркуу)."},{"t":"p","h":"Үчүнчү тесте 1. Жандан аша кечүү (өзүн-өзү өлүмгө кыюу, өлүмдөн баш тартпоо, коркконду, сактанганды билбөө)."},{"t":"p","h":"2. Жан деп (кубанып, сүйүнүп, кым дей түшүп)."},{"t":"p","h":"3. Жан-дили менен (чын жүрөктөн, абдан берилип, ыкласы менен, ынтаасын коюп, бардык күчү менен)."},{"t":"p","h":"4. Жанды оозго тиштөө (баарына тобокел кылуу, өлөр-тирилерине карабай киришүү, абдан коркуу, титиреп жүрөк заада болуу)."},{"t":"p","h":"5. Жакасын кармануу (бир нерсеге аябай таң калуу, тандануу)."},{"t":"p","h":"6. Жаны жер тартуу (чарчап-чаалыгуу, жаткысы, уктагысы келип талмоорсуу)."},{"t":"p","h":"Т. Жаны калбоо (жакшы көргөн, көңүлү каалаган кишисине, жакынына сый-сыпат кылуу, эпилдеп жакшы мамиле жасоо, сүйүнүү)."},{"t":"p","h":"Төртүнчү тесте 1. Жаны кашаюу (абдан ачуулануу, туталануу, түнөрүп ызасы келүү)."},{"t":"p","h":"2. Жанын жеген (эчтемени мойнуна албай, каратып туруп танып кеткен, калп айткандан уялбаган кара өзгөй, жандими)."},{"t":"p","h":"3. Жанын сеп алдырбоо (жанын жай алдырбоо)."},{"t":"p","h":"<span class=\"pg\" data-n=\"82\">82<\/span>4. Жанын таштап жиберүү (абдан берилип иштөө, бардык күчү менен катуу киришүү, бүт мүмкүнчүлүгүн жумшап аракет кылуу)."},{"t":"p","h":"5. Жан этин жеп (катуу кыйналып, кыйноо тартып, азап чегип)."},{"t":"p","h":"6. Жарма дос (атайын дос болушпаган, бирок бир аз катышы бар жолдош)."},{"t":"p","h":"Т. Жарма таарыныч (анча-мынча, майда-чүйдө нааразылык, араздашкандык)."},{"t":"h3","h":"Бешинчи тесте"},{"t":"p","h":"1. Жегени желим, ичкени ирим болуу (кандайдыр бир нерседен кооптонгондой тынчы кетүү, абдан санааркоо, сары санаа болуу, санаасы тынбай ойлой берүү, айласы кетүү)."},{"t":"p","h":"2. Желкеси тырышуу (ачуусу келүү, тырчый түшүү)."},{"t":"p","h":"3. Жемин жедирбөө (башка бирөөгө акысын кетирбөө, аны менен тең тайлашуу, алдатып жибербөө)."},{"t":"p","h":"4. Жем салды кылуу (азыраак болор-болбос гана таткантып коюу, кыныктыруу)."},{"t":"p","h":"5. Жеңилдик асты, оордук үстү менен (жанын кейитпей, ишке белсенип киришпей, тийди-качты болуп, кайпактап, оной-олтон, эптеп-септеп)."},{"t":"p","h":"6. Жер баспай калуу (эч нерсени көзүнө илбей, дөөгүрсүгөн абалда болуу, мурдун көтөрүп, көөп кетүү, текеберленүү)."},{"t":"p","h":"Т. Жерге-сууга тийгизбөө (аябай мактоо, көтөрө чалып, ашыра мактап жиберүү)."},{"t":"p","h":"Сүйлөп машыгуу Биринчи тестедеги ар бир сөз берметине бирден оозеки сүйлөм түз. Кааласаң эки-үчтөн сүйлөм түзсөң да болот. Анткени ага көп убакыт коробойт."},{"t":"p","h":"80-көнүгүү. Экинчи тесте боюнча оозеки сүйлөм түз. 79-көнүгүүнүн үлгүсүнө салып иште."},{"t":"p","h":"81-көнүгүү. Үчүнчү тестедеги сөз берметтери менен оозеки сүйлөм туз. 79-кенугууге окшош аткар."},{"t":"p","h":"82-көнүгүү. Төртүнчү тестедеги сөз берметтерин катыштырып оозеки сүйлөмдөр туз. 79-кенугуудегудей."},{"t":"p","h":"83-кенугуу. Бешинчи тестедеги сөз берметтерин катыштырып оозеки түзгөн сүйлөмдөрүң 79-көнүгүүнүн үлгүсүндө болсун."},{"t":"p","h":"<span class=\"pg\" data-n=\"83\">83<\/span>Жазып машыгуу 84-көнүгүү. Биринчи тестедеги сөз берметтерин катыштырып сүйлөм түз жана жаз. Сөз бермети сүйлөмдүн башына келсин."},{"t":"p","h":"Үлгү: Жаа бою качкандан ушу сени көрдүм, ой тооба, иш сени тиштеп калат беле."},{"t":"p","h":"85-көнүгүү. Экинчи тестедеги сөз берметтерин сүйлөмгө катыштырып жаз. Сөз берметтерин сүйлөмдүн ортосуна келтир."},{"t":"p","h":"Үл г ү: Биздин кошунабыз Бурул жайыл дасторкон, качан барсаң этеги элек, жеңи желек болуп тосуп алат, аман болсун бечара."},{"t":"p","h":"86-көнүгүү. Үчүнчү тестедеги сөз берметтерин сүйлөмдүн аягына келтирип сүйлөм түз."},{"t":"p","h":"Үлг ү: Ал ажалга тике карап, жандан аша кечиптир. 87-кенугуу. Төртүнчү тестедеги сөз берметтерин өзүң каалагандай сүйлөмдүн башына, ортосуна жана аягына келтирип жаз."},{"t":"p","h":"88-көнүгүү. Бешинчи тестедеги сөз берметтерин да өзүң каалагандай сүйлөмдүн башына, аягына жана ортосуна келтирип жаз. 89-көнүгүү. Адегенде ушул «Сөз бермети» топтомуна кирген беш тестедеги сөздөргө көз жүгүртүп чык, анан алардын эки-үчөөнү мааниси боюнча бир сүйлөмгө катыштырып жаз."},{"t":"p","h":"Үлгү: Тынбас деген кыштоодо мал баккан Жапардын зайыбы Алча – текебери жок жабуулуу кара инген жана тамак-ашы үзүлбөгөн жайыл дасторкон жан."},{"t":"p","h":"90-көнүгүү. Төмөнкү сөз берметтерин топ-тобу боюнча сүйлөмгө айландыр."},{"t":"p","h":"1..Жаагын жануу – жалпак тилге салуу."},{"t":"p","h":"2. Жан этин жеп – желкеси тырышуу – жегени желим, ичкени – ирим болуу – жаны кашаюу."},{"t":"p","h":"3. Жарма таарыныч – жаагы жап болуу."},{"t":"p","h":"4. Жарма дос – жан бакты – жеңилдин асты, оордун үстү менен."},{"t":"v","l":["5. Жерге-сууга тийгизбөө – жер баспай калуу.","6.Жакасын кармануу – жанды оозго тиштөө.","Т. Жанын сеп алдырбоо – жаны жер тартуу.","8. Жанга батуу – жаалы катуу."]},{"t":"p","h":"Үлг ү: 1. Болгон окуя жанына батты, жаалы катуу келди."},{"t":"p","h":"<span class=\"pg\" data-n=\"84\">84<\/span>91-көнүгүү. Көп чекит коюлган жерге тиешелүү сөз берметин коюп жаз."},{"t":"p","h":"Сөздү чекир көз Шаршен алды, баланы ... мактап салды. Байкуш Сакен күнү бүгүнкүгө чейин ... болуп, кан какшап жүргөн имиш. Эки айылдын ортосунда анча-мынча ... болбой коймок беле. Татыбек жумуш дегенде .... Ал ... жүрүп кун өткөрдү. Ошондон кийин молдо Ыбырайымдын ... Толгонайга баш ийип калган. Ыраматылык эжебиз Данакан зайып заттын ырыска шерик ... болгон. Өз айыбын өзү ачып, күлкүгө калгандан көрө, ... жакшы."},{"t":"p","h":"(Жабуулу кара инген; жабуулуу аяк жабуусу менен калганы; жерге-сууга тийгизбей; жаагы жап болуп; жарма таарыныч; жегени желим, ичкени ирим;жеңилдин асты, оордун үстү менен; желкеси тырышат)."}],"sub":[{"title":"Биринчи тесте","b":5},{"title":"Экинчи тесте","b":13},{"title":"Бешинчи тесте","b":35}],"section":"УП КЛАСС","pages":[81,84]},{"title":"§ 10. «МӘӘР СӨЗ» ТОПТОМУ","blocks":[{"t":"h3","h":"§ 10. «МӘӘР СӨЗ» ТОПТОМУ"},{"t":"p","h":"Кеп куржундан энчилеп ала турган буюм-тайымдарыңдын бири – мээр сөздөр. Алар топтоштурулган. Чынында, өзүң байкап жүргөндүрсүң, жазуучулардын тилинде мээршыбага, кут, сулуулук`жана асылзаадалык бар. Ал – акын Байдылда Сарногоев айткан алмадай баштын ичине баткан өзүнчө бир көлкүгөн жан дүйнө, рухий күлазык, аалам. Сүрөткердин көмөкөйүнөн төгүлгөн тил байлыгы. «Ундун барар жери – тегирмен» дегендей, бул тил байманасынын барар жери – окурман. Үзүрүн көрөрү да – келечек ээси. Ошон-"},{"t":"h3","h":"Биринчи чачыла"},{"t":"p","h":"1. «Тулпар тушунда кымбат», «атты арыганда көр» дегендей, эми сага окшогон чыпка сакалдан кайыр сурап отурам! Заман оңолсо, жараланган жүрөк жазылар. Албаган алигиң үчүн бизге салам айтарсың (А. Токомбаев у"},{"t":"p","h":"2. Мезгилдин канатындай учкул канат жоктур?.. Ооба, мезгил учат, канатсыз учат (А. Токомбаев"},{"t":"p","h":"3. Адамдын оюнан тентек, андан күлүк эчтеме жок. Кыял барды жок кылып, жокту бар кылып ойлойт (А. Токомбаев"},{"t":"p","h":"4. Эчен түстө байчечекей чайытын ачат, сонун кулпурат. Көк тайпаңда тызылдаган балдардын кызаңдаган балтырларына шибер оролот, гүл чабылат (Т. Сыдыкбеков)."},{"t":"p","h":"<span class=\"pg\" data-n=\"85\">85<\/span>5. Бөрү тытышса – берулугу. Ит кабышса – иттиги... Киши уулу кабышып-тытышпайт болучу. Киши уулу жер бетине келгенде, ач-ток болду. Азды, адашты. Жалгыз калган уулкыз бөрү эмчегин эмди. Адам уулунда эки кишинин урушу да, эки уруунун чабышы да ошол бөрү мүнөзүнөн уланып калды (Т.Сыдыкбеков)."},{"t":"h3","h":"Экинчи чачыла"},{"t":"p","h":"1. Анан, Алтынкөкүл Раушан Алтынкөкүл Раушан эле. Бою ноода чыккан кырчын талдай, кашы жаңы тууган айдай, көзү карагаттай, жаагы субагай, бети талдырмач кызылдуу, аркар көкүрөк. Башында жекей, көйнөгү – жашыл тубар, сары ноколуу кызыл манат бешманты бар; чачтары төрттөн өрүлүп, ай далы менен эки жаактан төгүлүп, алдыңкы чачы тизеден, арткы чачы толорсугунан өтүп турат (К. Жантөшев)."},{"t":"p","h":"2. Тупкуру жок, чеги жок апачык көгүлтүр асманда көркү жупуну боз чымчык, адамдын асманга учуп чыккан жүрөгү сымалы тыным албай, канат кагып дыркырап, томуктай гана болсо да, не бир назик, не бир толукшуган күүлөрдү төгүп, безеленип жатты (Ч. Айтматов)."},{"t":"p","h":"3. Мени жоктобо, апа. Дүйнөдө мындан ары согуш болбосо, жаңыдан төрөлгөн баланын ыңаалаганы – ошол мен, бой жеткен кыздардын жоодураган көздөрү – ошол мен, бутакта көгөргөн жалбырак – ошол мен, талаада өнүп чыккан эгин – ошол мен, мугалимдин балдарга биринчи үйрөткөн «А» тамгасы – ошол мен, ошонун баары мен, ошонун баары мен, мен деп жүргүн, апа! (Ч. Айтматов)."},{"t":"p","h":"4. Түн ортосунда тээ жылдыздуу төбөнү карасам, Саманчынын жолу ааламдын бир четинен экинчи четине керилип жаткан кези экен. Асмандын ошол күмүш жолу менен кандайдыр бир зор дыйкан кере кучак саман көтөрүп өткөн экен го, анын мол кучагынан себеленип түшкөн дан, топон береке төгүлгөн из чубатып кеткен турбайбы (Ч. Айтматов)."},{"t":"h3","h":"Үчүнчү чачыла"},{"t":"p","h":"1. Бул обон, күндүн мурду, кылтыйып жаңы көрүнөрүндө, саманда жаткан жеримден тура калып, жылаңайлак, жыланбаш шүүдүрүм беде менен сайдагы тушалган аттарды көздөй чуркаганымда, жүрөгүмдө күү чалып угулгандай (Ч. Айтматов)."},{"t":"p","h":"2. Күрөккө ченеп сузуп, алтын жаандай чачыратып кызыл сапырган чалдардын кыймылында да, асманда жай баракат керилип учкан айры куйруктун каалгып учушунда да бул обон угулат (Ч.Айтматов)."},{"t":"p","h":"<span class=\"pg\" data-n=\"86\">86<\/span>гыр какты. Ортоңку чың ТОЛГОНГОН чыйрак кыл сөөмөй ме-"},{"t":"p","h":"Биринчи чачыла: А Б:"},{"t":"v","l":["Экинчи чачыла: 1, 2.345","Учунчу чачыла: К Б И б"]},{"t":"p","h":"Үлгү: Аалы Токомбаевдин «Жараланган жүрөк» пове- Стинен алынган «тулпар Тушунда кымбат», «атты арыганда Көр» дегендей, эми сага окшогон Чыпка сакалдан кайыр сурап отурам! Заман оңолсо, жараланган жүрөк жазылар. Албаган алигиң учун бизге салам айтарсың» деген үзүндүдөгү Бектурган карыянын сезунде каират да, чечендик да, жуйе да бар."},{"t":"p","h":"улгусунде аткар."},{"t":"p","h":"<span class=\"pg\" data-n=\"87\">87<\/span>Жазып машыгуу 95-кенугуу. Биринчи чачыладагы мээр сөздөрдү төл жана бөтөн сөздүн төмөнкү эрежелери боюнча жаз."},{"t":"p","h":"еу УДА С&gt;"},{"t":"p","h":"96-кенугуу. Экинчи чачыладагы мээр сездерду тел жана бетен сездун теменку эрежелери боюнча жаз."},{"t":"p","h":"97-көнүгүү. Үчүнчү чачыладагы мээр сөздөрдү диалогдун төмөнкү эрежелери боюнча жаз."},{"t":"p","h":"Улгу: Телеген Касымбеков мындай дейт:"},{"t":"p","h":"– Жазгы кара килен келген кез эмеспи, карлар тутеп эрип, булангыр суулар кездун жашындай мелтулдеп таамп, кебейуп, чарык жиптей чубалып жылжып, туш-туштан өзөнгө куюп жатат."}],"sub":[{"title":"Биринчи чачыла","b":2},{"title":"Экинчи чачыла","b":8},{"title":"Үчүнчү чачыла","b":13}],"section":"УП КЛАСС","pages":[85,87]},{"title":"§ 11. «САНЖЫРГАЛУУ КАЗЫНА» ТОПТОМУ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"88\">88<\/span>§ 11. «САНЖЫРГАЛУУ КАЗЫНА» ТОПТОМУ"},{"t":"p","h":"Туюнтмалар ооз ачырган кооз, тамшандырган ийги, сыдыргыга салгандай текши болушу күтүлгөн. Ж. Мукамбаев"},{"t":"p","h":"Санжыргалуу казына – элдин керемет тили, башкача айтканда, чыгы кургабаган ширелүү кеп. Бир жолу сүйлөнүү, бир жолу ырдалуу менен өмүрүн токтоткон эмес, ал электен-элекке, муундан-муунга эстафета сымал кастарлана тартууланып отуруп, жышылган, иргелген, сомдолгон жана да сары майдай сакталган, алтындан артык асыралган кундуу кеп. Ал – «Манас» эпосунан тартып, элдик дастандардын баарын кучагына алган орток байлык, казына. Жана да ата-бабадан урпактарга тартууланган шыралга."},{"t":"h3","h":"ШЫРАЛГАЛАР Биринчи шыралга"},{"t":"p","h":"1. Казгалдак деген бир куш бар, кайрылбай учат талаа үчүн, карып болду Әлеман, бир перзент көрөр бала үчүн."},{"t":"p","h":"2.Отко салса күйбөгөн ойрондук жайы дагы бар, сууга салса акпаган султандык жайы дагы бар (Төштүк)."},{"t":"p","h":"3. Кермесин кенен кердирип, кермедеги тулпардан садагага бердирип."},{"t":"p","h":"4. Кара кычы эттерин кылыч менен кырды эле, кымыз менен жууду эле."},{"t":"p","h":"о. Бир атадан тогузбуз, айбандардан өйдөрөөк, адамдардан көп төмөн арада жүргөн доңузбуз."},{"t":"h3","h":"Экинчи шыралга"},{"t":"p","h":"1. Кирерине чөл таппай, кечерине көл таппай."},{"t":"p","h":"2. Әбедейи эзилип, эт тырмагы созулуп, эрте сөзү кеч болуп, эки көзү төрт болуп."},{"t":"p","h":"3. Көкөтөйдүн Кызылнар, ман-ман-ман басып, чуудаларын чан басып, эки өркөчүн коркойтуп, өрдөктөй мойнун койкойтуп."},{"t":"p","h":"4. Эт жүрөгү болкулдап, дене бою солкулдап (Көкөтөй)."},{"t":"p","h":"<span class=\"pg\" data-n=\"89\">89<\/span>5. Чалды кудай колдоду, Әлемандын эшикке май көл, сүт көл орноду."},{"t":"p","h":"Үчүнчү шыралга 1. Ашка барбай апат бол, Төштүк! Тойго барбай топот бол, Төштүк! (Кыздардын акыйнеги)."},{"t":"p","h":"2. Ат бороюн сыдырып, жердин баарын кыдырып, жел өтпөс торко кийбесем, желбеген жорго минбесем, кулак угуп, көз көргөн жерге чейин жүрбөсөм."},{"t":"p","h":"3. Кызылдан буурул ат минип, кыл куйругун чарт түйүп."},{"t":"p","h":"4. Ай эсебин алган жок, айда тынып калган жок, күн эсебин алган жок, күндө тынып калган жок."},{"t":"p","h":"5. Тобулгу жакса, чок өтпөс, таамайлап атса, ок өтпөс чайиңги тонду беремин."},{"t":"p","h":"Төртүнчү шыралга 1. Жолсуз жерге жол салган болот өгөөм ошо бар, өкчөп койсо ат болгон алтын сакам кошо бар."},{"t":"p","h":"2. Мал көөнүнө карабай, малын берди аябай. Тон көөнүнө карабай, тонун берди аябай."},{"t":"p","h":"3. Бөдөнөдөй кара көз, бөлөк-бөлөк жаш кетти. Карагаттай кара көз, камчы бою жаш кетти."},{"t":"p","h":"4. Жаактууга жай бербес, жайдак атка бой бербес."},{"t":"p","h":"5. Карылыктын айынан отурамын окшоюп, улуган иттей шоңшоюп."},{"t":"h3","h":"Бешинчи шыралга"},{"t":"p","h":"1. Тикилдеген сөзү бар, тик караган көзү бар. Жан казандай башы бар, кылдан ичке мойну бар. Көккө, жерге бир тийген, тегирмендин бир ташы моюнуна илинген (Жейрен секиртпес Маамыт)."},{"t":"p","h":"2. Күн чыгыш менен күн батыш элине кабар угулса, азыр айтып беремин. Жоого кирсең болжошмун, мен өзүңө жолдошмун (Жер тыңшаар Маамыт)."},{"t":"p","h":"3. Атка минсе кишидей, жөө жүрсө оңбогур, желмогуздун тишиндей."},{"t":"p","h":"Карыш болгон бою бар, ай-ааламдын баарысын биле турган ою бар (Куюн көтөн Маамыт)."},{"t":"p","h":"4. Өчкөн бир отум тамызчы, Төштүк, өлгөн жаным тиргизчи, Төштүк (Жолборс)."},{"t":"p","h":"5. Андай-мындай дегиче, ачып көздү жумгуча, жейренге учуп жетчи элем, бура тарта бергиче, эки-үчөөн илип кетчи элем. (1-5-шыралгалар «Эр Төштүк» дастанынан алынды)."},{"t":"h3","h":"<span class=\"pg\" data-n=\"90\">90<\/span>Жаттоо"},{"t":"p","h":"1. шыралгадагы санжыргалуу сөздөрдү ичиңен бир сыйра оку. Анан катары боюнча хор менен керктуу окугула."},{"t":"p","h":"2. Жаттагыла."},{"t":"v","l":["Биринчи шыралга: 1, 2, 3, 4, 5.","Экинчи шыралга: 1, 2, 3, 4, 5.","Учунчу шыралга: 1, 2, 3, 4, 5.","Тертунчу шыралга: 1, 2, 3, 4, 5.","Бешинчи шыралга: 1, 2, 3, 4, 5.","","Сүйлөп машыгуу"]},{"t":"p","h":"98-көнүгүү. Биринчи шыралгадагы санжыргалуу сөздөрдү өз сөзүңө кошуп сүйлө."},{"t":"p","h":"Үл г ү: «Әр Төштүк» эпосунда мындай деп айтылат: «Казгалдак деген бир куш бар, кайрылбай учат талаа үчүн, карып болду Әлеман бир перзент көрөр бала үчүн» ж.б."},{"t":"p","h":"99-көнүгүү. Әкинчи шыралгадагы санжыргалуу сөздөрдү 98- көнүгүүнүн үлгүсүнө окшоштуруп иште."},{"t":"p","h":"100-көнүгүү. Үчүнчү шыралгадагы сөздөрдү да 98-көнүгүүнүн үлгүсүнө салып аткар."},{"t":"p","h":"101-көнүгүү. Төртүнчү шыралга да 98-көнүгүүнүн үлгүсүндө иштелет."},{"t":"p","h":"102-көнүгүү. Бешинчи шыралганы да 98-көнүгүүнүн үлгүсүнө окшоштуруп иште."},{"t":"h3","h":"Жазып машыгуу"},{"t":"p","h":"103-кенугуу. 1-5-шыралгадагы «1» деген номердеги сөздөрдү &lt; – А кештеси боюнча жаз."},{"t":"p","h":"Улгу: Кыздар Тештукке минтип айтышат: «Ашка барбай апат бол, Тештук! Тойго барбай топот бол, Тештук». 104-кенугуу. 1-5-шыралгадагы «2» деген номердеги санжыргалуу сездерду «кештеси менен жаз."},{"t":"p","h":"105-кенугуу. 1-5-шыралгадагы «3» деген номердеги санжыргалуу сездерду кештеси боюнча жаз."},{"t":"p","h":"<span class=\"pg\" data-n=\"91\">91<\/span>106-кенугуу. 1-5-шыралгадагы «4» деген номердеги санжыргалуу сөздөрдү и С» = Им» кештеси боюнча жаз."},{"t":"p","h":"107-көнүгүү. 1-5-шыралгадагы «5» деген номердеги санжыргалуу сөздөрдү төмөнкү кештелер боюнча жаз."}],"sub":[{"title":"ШЫРАЛГАЛАР Биринчи шыралга","b":3},{"title":"Экинчи шыралга","b":9},{"title":"Бешинчи шыралга","b":25}],"section":"УП КЛАСС","pages":[88,91]},{"title":"КУТУЧАСЫ» ТОПТОМУ","blocks":[{"t":"h3","h":"КУТУЧАСЫ» ТОПТОМУ"},{"t":"p","h":"Тил маданиятынын байлыгы бүткүл турмуш тарыхы менен өмүрлөш. Э. Абдылдаев, Д. Исаев"},{"t":"p","h":"Акыл Карачачтын нускасы Куту – бул кичинекей сандык. Ал эми «кутуча» – андан да кичинекей, жарашыктуу, ичине аспиеттеп баалуу нерсе сала турган буюм. Сөздөн баалуу нерсе барбы? Ошондуктан төмөнкү жети кутучанын ар бирине жетиден сөз салдык. Кашаанын ичинде ошол сөздүн мааниси чечмеленген. М.: Астейдил (чын жүрөктөн, чын дили менен, чыныгы ниет менен) делип берилди. Максаты мындай: «Астейдил» деген өңдүү сөздөрдүн баары эми сенин тилиңе кириш керек."},{"t":"v","l":["Биринчи кутуча","ажайып (сонун, укмуштуу, таңгаларлык)","ажайыпкана (музей)"]},{"t":"p","h":"ажардан (сүйкүмдүү, көрктүү болуп көрүнүү, жадырап жайноо) ажат (муктаждык, зарылгандык, бир нерсеге кысылгандык) ажыкыздануу (орунсуз сөздөрдү айтып маңыздануу) азарман – азармандан безерман болуу (өзүнө жакын жуут"},{"t":"p","h":"поо, жанын сабоо) айкел (адамдын куюп алынган же таштан чегилген тулкусу)"},{"t":"h3","h":"<span class=\"pg\" data-n=\"92\">92<\/span>Экинчи кутуча"},{"t":"p","h":"азелил (шайтан, азыткы, азгырып туура жолдон тайдыруучу) азыноолак (бир аз, анча-мынча, аздыр-көптүр)"},{"t":"v","l":["айбардуу (каардуу, сүрдүү, айбаттуу)","айбык (ийменүү, жазгануу, тартынуу, уялуу)","айгай (катуу кыйкырык)","айгине (ачык, дааналап көрсөтүү)","айдарым (желаргы, жумшак жел)"]},{"t":"h3","h":"Үчүнчү кутуча"},{"t":"p","h":"айкөл (кең пейил) айныкей (убадага турбоочулук, айтканын тануучулук,"},{"t":"p","h":"көздөгөн оюнан баш тартуучулук) айчыктуу (жарым ай түспөлүндөгү оймо-чийме менен"},{"t":"p","h":"кооздолгон)"},{"t":"v","l":["айың (ушак сөз, имиш-имиш)","айырмач (жаш балдардын ээри)"]},{"t":"p","h":"акак (кооздоо, жасалгалоо үчүн колдонулуучу тунук таш) акактай (мөлтүрөгөн, тунук)"},{"t":"h3","h":"Төртүнчү кутуча"},{"t":"v","l":["акжуумал (агышынан келген)","аксым (албуут, ажаан, кыялы чатак)","акшам (күн батып, кеч кирген мезгил)"]},{"t":"p","h":"акыбет (сиңирген эмгектин, иштин акыры, натыйжасы) акылдуусунуу (өзүн акылдуу көрсөтүүгө аракет кылуу) алабарман (шашкалактаган, анча-мынчаны жана"},{"t":"p","h":"алды-артын көп байкабаган) алакчыла (тымызын оолактатуу, алыс болуу, тең көрбөө)"},{"t":"h3","h":"Бешинчи кутуча"},{"t":"p","h":"албуут (ачуулуу, кой-айды билбей чамына берген, долу, бейжай) алгоолошуу (өз ара жардамдашуу, көмөктөшүү)"},{"t":"v","l":["алешем (кургак эмес, ным, нымдуу)","алибеттүү (күчтүү, кубаттуу)"]},{"t":"p","h":"алмустак, алмустактан бери (эзелден бери, атам замандан бери) алоо (жалын, оттун жалыны) алпеште (эркелетүү, кадырлоо, урматтоо)"},{"t":"h3","h":"Алтынчы кутуча"},{"t":"p","h":"алпурушуу (кызуу иштөө, жан-дили менен аракет"},{"t":"p","h":"кылуу, күрөшүү, алышуу)"},{"t":"v","l":["<span class=\"pg\" data-n=\"93\">93<\/span>алтүндө (түн ичинде, түнкүсүн)","алымсак (сатып алуучу)","амалкөй (айлакер, илелүү, амалдуу)","анткор (өзү иштеп коюп билмексен болгон адам)","аңкоолон (аңкоо болгон, билбеген, түшүнбөгөн","сыяктанып калуу)","аңылдак (ичине сыр сактабаган, аркы-беркини","баамдабай сүйлөгөн, даалдак)","","Жетинчи кутуча"]},{"t":"p","h":"апапта (бала корккондо оозун ачтырып, сөөмөй менен"},{"t":"p","h":"таңдайын кичине-кичинеден көтөрүп коюу)"},{"t":"v","l":["апкааруу (корккондо, сүрдөгөндө, шашылганда эмне","кыларын билбей калуу, аптыгуу)","аралжы (арадагы себепчи, арачы)"]},{"t":"p","h":"арамзалык (жаман ойлуулук, кара ниеттүүлүк, ичи бузуктук) арампөөш (сасык ойлуу, кытмыр)"},{"t":"v","l":["алпейим (тынчтык, жайчылык)","астейдил (чын жүрөктөн, чын дили менен)"]},{"t":"p","h":"108-көнүгүү. Төмөнкү сүйлөмдөрдө жети кутучадагы сөздөрдөн кайсылар колдонулганын аныкта."},{"t":"p","h":"Алар Кызыл Армияны күтүп, жеңишке астейдил ишенишкен. Алпейим заман. Ал арампөөш качып кетиптир. Мамат ортого аралжы болду. Мансурдун шойкомдуу митаам көзү арамзалык менен күлүндөгөндөй болду. Бир топко чейин апкаарып барып сүйлөдү. Каныбектин оозуна сөөмөйүн салып апаптады. Ичине сыр сактай албаган аңылдакка кайдан жолдош боло калдың? Канчалык аңкоолонсоң да, чыныгы сырың бизге белгилүү. Анткор кемпирдин аты Айнагүл болчу. Айла тапчу амалкөй аксакал Кошой кары жок. Базарда алымсак аз, мал арзан болду. Алтүндө энең экөөңөр тээтиги ашууну ары ашасынар. Бир сааттай алпуруштук. Алсыз кезде алпештеди, жөлөдү. Ортосунда алоо күйүп чатырап, от жанынан оолак-оолак качырат. Бул жерге арпадан башка эчтекенин өнбөй тургандыгы алмустактан бери белгилүү. Нуркасым алибеттүү, салкын кандуу жигит экен го. Алешем отун тутанбады. Айдады алгоолошуп конок, таруу. Ызырынып камчы үйүрөт, кай бир албуут зорлору. Башка койлордон алакчылап өзүнчө жем берилген койлор жемди бурдуга сугунушту. Даалдап алабарман жүрө берчү. Муну карасаң деги акылдуусунуп калыптыр. Акыбетим кайтып, балдарымдын алды үйлүү-жайлуу болду. Кечки акшамда <span class=\"pg\" data-n=\"94\">94<\/span>жанды сергиткен жел сокту. Анча-мынча аксым сөз оозунан чыгып кетти дейт. Акжуумал келин дасторкон жайды. Көк шибердүү колотчонун ортосунан акактай тунук суу агат. Кыздар акырекке тагылган акак, седеп мончокторун жылтылдатышып, беш көкүлүн сылашат. Айырмач токуп, тай мингизген. Бул айың өрдөштөгүлөрдүн көбүнө угулат. Асаба, желек калкылдап, айчыктуу туулар жаркылдап. Анын айныкейи кармап калыптыр. Айкөл Манас кабылан. Айдарым желге эгин талаасы ыргалат. Алыстагы караан айгине көрүнөт. Ан сайын айгайын баспай үн салды. Ал чоочун үйгө басып кирүүдөн айбыга турган. Арстандай айбардуу баатыр бар. Чуру-чуу азыноолак тынчтана түштү. Оюнга азгырган азезилдериң келдиби? Бурма азарман-безерман болду. Манастын айкели мага жакты. Ата менен эненин ажатын ачтын. Ак жүзү ай нурундай ажарданат. Инисинин ажыкыздыгынан Султанмурат чыдай албай, көк желкеге коюп калды. Жамбылдын Атчабар деген жерине көчмө ажайыпкана орноп калган экен. Түндө жатып түш көрдүм, бир ажайып иш көрдүм. (Мисалдардын көпчүлүгү «Кыргыз тилинин түшүндүрмө сөздүгүнөн» алынды"},{"t":"h3","h":"Суйлеп машыгуу"},{"t":"v","l":["1. Биринчи кутуча боюнча.","2. Экинчи кутуча боюнча.","3. Учунчу кутуча боюнча.","4. Тертунчу кутуча боюнча.","5. Бешинчи кутуча боюнча.","6. Алтынчы кутуча боюнча.","7. Жетинчи кутуча боюнча."]},{"t":"h3","h":"Оозеки таймаш Иштин 1-түрү Бул эки топтун ортосунда болот. Мында биринчи топтун"},{"t":"p","h":"өкүлү өзү каалаган кутучадан бир сөздү (м.: айдарым) айтат, экинчи топтун өкүлү ошол сөздү катыштырып (м.: Айдарым жел беттен сылайт) тез сүйлөм түзөт. Ушул өндүү сүйлөм түзүүлөр удаалаш же алмак-салмак болушу мүмкүн. Ага топтун мүчөлөрү толук катышат. Сүйлөмдү кем түзгөн тарап утулат."},{"t":"h3","h":"<span class=\"pg\" data-n=\"95\">95<\/span>Иштин 2-түрү"},{"t":"p","h":"Доскага әки топтон тандалган эки окуучу чыгат. Аларга отургандар бата беришет. Анан бирөө кутучадан каалаган беш сөздү бирден айтат, экинчиси тездик менен оозеки сүйлөм түзөт. Ар бир беш сөздөн кийин топтун өкүлдөрү милдетин алмаштырат, суракчы сүйлөм түзүүчүгө, тетирисинче, сүйлөм түзүүчү суракчыга айланат."},{"t":"p","h":"Жазып машыгуу"},{"t":"h3","h":"Иштин 1-түрү"},{"t":"p","h":"Доска бор менен экиге ажыратылат. Таймашкан эки топ эки катарга тизилет. Ар бир топтон улам бирден окуучу чыгып, бирден гана сүйлөм жазат. Әгер ар бир топто он экиден окуучу болсо, анда он эки сүйлөмдү туура жана мурда жазып бүткөнү утат. Сүйлөмдүн саны топтун мүчөлөрүнүн санына жараша азайышы же көбөйүшү мүмкүн. Бирок, кутучадагы бир сөзгө бир эле сүйлөм түзүлөт. Эгер эки сүйлөм түзүлүп калган болсо, анда анын мурда түзүлгөнү эсепке алынат."},{"t":"h3","h":"Иштин 2-түрү"},{"t":"p","h":"Доскага эки топтон бирден окуучу чыгат. Өзү каалаган кутучадагы сөздөрдөн сүйлөм түзөт. Экөөнүн кимиси туура жана көп түзсө, ошол утат. Бул иштин түрү убакытка жараша 3—4 жолу кайталанышы мүмкүн."},{"t":"h3","h":"Иштин 3-туру"},{"t":"p","h":"Кутудагы сөздөр боюнча ар бир окуучу отурган ордунда өз алдынча сүйлөм жазат. Мында жалпы класс боюнча 1-—5- орундар белгиленет. Туура жана баарынан көп сүйлөм жазган окуучу биринчи орунду жеңип алат."},{"t":"h3","h":"Иштин 4-түрү"},{"t":"p","h":"Бул иште окуучунун сүйлөм түзүүдөгү чеберчилиги кароолго алынат. Маселен, таймашкан окуучунун бири бир сүйлөмгө кутучадан төрт сөздү, экинчиси үч сөздү катыштырып түзүшү мүмкүн. Мында бир сүйлөмгө кутучадагы сөздөрдөн ким көп катыштыра алса жана да түзгөн сүйлөмү маанилик жактан биримдикте болсо, ошол окуучу жеңип чыгат."}],"sub":[{"title":"Экинчи кутуча","b":6},{"title":"Үчүнчү кутуча","b":9},{"title":"Төртүнчү кутуча","b":15},{"title":"Бешинчи кутуча","b":19},{"title":"Алтынчы кутуча","b":23},{"title":"Оозеки таймаш Иштин 1-түрү Бул эки топтун ортосунда болот. Мында биринчи топтун","b":36},{"title":"Иштин 2-түрү","b":38},{"title":"Иштин 1-түрү","b":41},{"title":"Иштин 2-түрү","b":43},{"title":"Иштин 3-туру","b":45},{"title":"Иштин 4-түрү","b":47}],"section":"УП КЛАСС","pages":[92,95]},{"title":"§ 13. «ИЛХАМ КЕП» ТОПТОМУ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"96\">96<\/span>§ 13. «ИЛХАМ КЕП» ТОПТОМУ"},{"t":"p","h":"Илхам кеп – акындык эргүүдөн жаралган ыр саптары. Маселен, залкар акын Сүйүнбай Эралиев бир ырында: «Кырыңда кызгалдактар жабалактайт, калгандай кан чачырап туландарга. Жазгы суу чабалактайт, чабалактайт, буурадай башын уруп улам жарга», – дейт. Акын эргүү менен жазгы суунун буурадай башын улам жарга урган, ээ-жаа бербеген бейжайлыгын, жээгин жеп долулан- ›анын көз алдыбызга тартып койду. Балким, бул көрүнүштү художник тарта албас, чама-чаркы жетпес, композитор кармай албас, чабалдык кылар. Бирок ал сөз менен кармалды. «Жазгы суу долуланды» деп койсо да болмок. Бирок жазгы суунун чабалактап, буурадай башын улам жарга урганы – акындын акыны, сезгичтин сезгичи кармай ала турган жандуу кыймыл, жарк этип көрүнгөн таасын элес. Акындын илхамынан жаралган ыр – бул анын жаны, бирок ал жараткан эгесине гана таандык нерсе эмес. Ал акын көөдөнүнөн кайнар булактай оргуп атылды. Эми аны ким тыңдайт, ким пайдаланат? Албетте, андай кереметти сактоочу да, керектөөчү да – калайык-калк, көпчүлүк. Ошонун ичинде сен да барсың. Аларды эмитен үйрөн, жадыңда сактап, сөзүңдө колдон. Ошондо кебиң уккулуктуу, кулакка көнүмдүү болот, окуучум."},{"t":"h3","h":"Биринчи түрмөк"},{"t":"v","l":["1. Оргуштап чыккан мөл булак","Колоттон ылдый кулдурап,","Эзелтен агат чарчабай,","Бирдеме сүйлөп былдырап (А. Токомбаев)."]},{"t":"p","h":"Әскертүү. Ушул сыяктуу ыр саптары тестеленбей, кара сөз түрүндө жазылды."},{"t":"p","h":"2. Шибери белден жайкалат, төккөндөй жыпар абасы. Туландан ыргып чыга албайт эликтин эрке баласы (А. Токомбаев)."},{"t":"p","h":"3. Эртең менен шүүдүрүм сымаптай болуп көлкүлдөйт. Беш көкүл кыздын чачындай сарымсак, текей селкилдейт (А. Токомбаев)."},{"t":"p","h":"4. Өмүр – өзөн, тынбай агар, зымырар, эрдин күчү зор майданда сыналар (М. Элебаев)."},{"t":"p","h":"<span class=\"pg\" data-n=\"97\">97<\/span>5. Санап-санап эсептесем өмүрдү, өткөн өмүр балдан ширин көрүндү. Жел жетпеген желмаяндай мал минип, жетип кууп женер белем өлүмдү (Ж. Бөкөнбаев)."},{"t":"h3","h":"Әкинчи түрмөк"},{"t":"p","h":"1. Көк асман даңгыр жолго окшойт, сур булут чыккан чаңга окшойт, үңкүргө дайра киргендей уюлгуп шамал, жел боздойт (Ж. Бөкөнбаев)."},{"t":"p","h":"2.Жаман киши жакшылыкты унутуп, жамандыктын мыгын кагат таманга (Т. Үмөталиев)."},{"t":"p","h":"3. Көрүнгөнгө урунба да, таарынба, кишисиң сен ийнинде баш барында. Күн астынан өз жолунду издегин, калкыбастан белгисиздик шарында (Т. Үмөталиев)."},{"t":"p","h":"4. Сөз көп, иш аз болбосун, эрибейт сөзгө коргошун (Т. Уметалиев)."},{"t":"p","h":"5. Бул жакты карайм – тоо турат, ал жакты карайм – тоо турат. Асманга чейин тоо тоого учкашып жүрүп отурат (С. Эралиев)."},{"t":"h3","h":"Үчүнчү түрмөк"},{"t":"p","h":"1. А табият салтынан жок жаңылган, жумурткадан жаңы гана жарылган балапандай баш көтөрүп чыйпылдап, күн көрүндү тандын нары жагынан (С. Эралиев)."},{"t":"p","h":"2. Улам качкан көлөкөнү сугунуп, күн аңтарып кирди жердин коюнун (С. Эралиев)."},{"t":"p","h":"3. Жерде жалт-жалт, жаш күчүктүн көзүндөй, шуудурүмдөр – түн жоготкон берметтер (С. Эралиев)."},{"t":"p","h":"4. Бийик-бийик тоолордун чокусунда кары бар, тоолор окшоп бир дөңдө отурушат карылар (С. Эралиев)."},{"t":"p","h":"5. Тарасак таңга аз калып, чарчаган белем ай дагы, асканын мизин жазданып, үргүлөп калган назданып (С. Эралиев)."},{"t":"h3","h":"Жаттоо"},{"t":"p","h":"а) Түрмөк катары боюнча ыр саптарын үч кайталап, бир сыйра жекече, 2 сыйра хор менен көрктүү окугула."},{"t":"p","h":"б) Түрмөктөгү ар бир ыр сабын өзүнчө жаттагыла."},{"t":"p","h":"1. Биринчи түрмөк: 1,2,3,4,5."},{"t":"v","l":["2. Әкинчи түрмөк: 1,2,3,4,5.","3. Үчүнчү түрмөк: 1,2,3,4,5."]},{"t":"p","h":"в) Үч түрмөктөгү ыр саптарын хор менен жатка айткыла."},{"t":"p","h":"<span class=\"pg\" data-n=\"98\">98<\/span>Сүйлөп машыгуу 109-көнүгүү. Биринчи түрмөктөрдөгү ыр саптарын өз сөзүңө кошуп сүйлө."},{"t":"p","h":"Үл г ү: Мен Терек өзөнүндө болдум. Туш тарабымдын баары – көк кашка булак. Ушул көрүнүш Аалы Токомбаевдин «Оргуштап чыккан мөл булак колоттон ылдый кулдурап, эзелтен агат чарчабай, бирдеме сүйлөп былдырап» деген ыр саптарын эске түшүрдү."},{"t":"p","h":"110-көнүгүү. Әкинчи түрмөктөгү ыр саптарын да жогорку үлгүдөгүгө окшоштуруп, өз сөзүңө кошуп сүйлө."},{"t":"p","h":"111-көнүгүү. Үчүнчү түрмөктөгү ыр саптарын да жогорку үлгүгө окшоштуруп иште."},{"t":"p","h":"112-көнүгүү. Биринчи окуучу түрмөктөрдөгү өзү каалаган бир ыр сабын айтат, экинчи окуучу аны ез сөзүнө кошуп, илгиртпей улап кетет. Бул адегенде кол көтөргөндөр менен, анан калган окуучулар менен иштелет."},{"t":"p","h":"Жазып машыгуу 118-көнүгүү. Биринчи түрмөктөгү ыр саптарын төл жана бөтөн сөздүн 1-, 2-, 3-, 4-эрежелери боюнча төрт түрлүү жаз. Ар бир эрежеге ар башка мисал келтиресиң."},{"t":"p","h":"Улгу: 1. Аалы Токомбаев мындай деген: «Оргуштап чыккан мөл булак колоттон ылдый кулдурап, эзелтен агат чарчабай, бирдеме сүйлөп былдырап»."},{"t":"p","h":"114-көнүгүү. Экинчи түрмөктүн ыр саптары да 113-кенугуудегудей аткарылат."},{"t":"p","h":"115-кенугуу. Үчүнчү түрмөктүн ыр саптары да 113-кенугууге окшош иштелет."},{"t":"h3","h":"§ 14. ДИЛБАЯН Байытып баянда"},{"t":"v","l":["Тоолор ... кетик ай ... жылдыздар...","(Ыр кошуп жазсаң да болот).","","Катасы барбы? Оңдоп жаз.","1. Бүркөлгөн жамгыр шатырата төктү."]},{"t":"p","h":"2. Суу неметип, айдоо талаасын каптап кетиптир, андап <span class=\"pg\" data-n=\"99\">99<\/span>салбаса болду. Кетмен көтөрүп жүргөндөр арыкты неметип койгонду билбейт, ой тооба."},{"t":"v","l":["3. Нан бышырган отко-жамга түшүп азап эле го.","","Сөздөрдү өз ордуна кой"]},{"t":"p","h":"1. Муз сыныктарын – түртүп-жээкке-чыгарат-толкундар-көмөлөтө-кээде."},{"t":"p","h":"2. Ким экенин келген – үй ээсине – меймандардын – кабарлады."},{"t":"p","h":"3. Суусар тебетей – кемселине – кара кылкандуу – башындагы – түспөлдөш."},{"t":"h3","h":"Байланыштырып жана байытып чакан"},{"t":"p","h":"аңгеме жаз Кырда кызыл көз аяз ... Себелейт шыбыргак ... ышкырат... Улунуп-жулунуп ... Бурганак ... Сууда шыргалаң ... Мен атчанмын (муну ыр кылып жазып көрсөң да болот)."},{"t":"v","l":["Сүйлөм түз","1. Ар бири к менен башталган сөздүү сүйлөм түз."]},{"t":"p","h":"2. Ар бири б менен башталган үч сөздүү сүйлөм түз."},{"t":"p","h":"3. Ар бири а менен башталган беш сөздүү сүйлөм туз. Үл г ү: Кырда кызыл кызгалдак кылтыят."},{"t":"p","h":"Дилбаян жаза билүү – бул кызыктуу эмгек. Ал изденүүнү, шыктанып жазууну сүйөт. Анткени дилбаян жазуу көчүрүү эмес, чыгарма жазуу. Бирок аны кантип изденип, кантип шыктанып жазуу керек? Албетте, бул – колдон келерлик жана окуучулардын баары текши жаза аларлык оңой эле иш. Ал үчүн милдеттүү түрдө төмөнкү жети үлгүнү беш колдой билип алуу зарыл."},{"t":"p","h":"“з үлгүсү Үлгү кылынып жаткан нерсени бул али жазыла элек көкүрөктө турган ой, кагазга түшүрүлмөкчү болгон мазмун деп түшүнүү абзел. Әгер үлгүнү орхон-энесай жазуусундагы «су» деген (бизче «т») тамга менен белгилесек, анда ошол үлгүнүн ордуна каалаган нерсени коюп, дилнаама жаза берүүгө болот. Айталы «» үлгүсүнүн мисалы катары силерге толук тааныш, көкүрөгүңөрдө кыттай уюган «Карышкыр менен түлкү» жомогун коёлу да, ал жазыла элек, <span class=\"pg\" data-n=\"100\">100<\/span>бирок көкүрөгүңөрдө турат, силер аны жазууга ниет кылдыңар дейли (баса, ушуга окшош нерселер турмушта миң-сан эмеспи, андайлардын айрымдарын УП – [Х класстарда да жазууга туура келерин унутпа)."},{"t":"p","h":"С, үлгүсүнүн мисалы «Карышкыр менен түлкү» сага УЇ класстан эле тааныш. Ал бул окуу китебинде да атайы толукталып кайталанды, анткени ага утуру кайрылып туруу зарылдыгы бар."},{"t":"h3","h":"КАРЫШКЫР МЕНЕН ТҮЛКҮ"},{"t":"p","h":"Бир күнү түлкү куйругун булактатып, тилин саландатып, ээн жерде келе жатып, жалгыз аяк жолдун таманында жаткан койдун куйругун көргөндө кубанып кетти. Аны тегерене карап, салып койгон капканды көрдү да, шилекейин чуурутуп, эмне кыларын билбей туруп калды. Аңгыча желип-жортуп карышкыр келди. Түлкү жагалданып:"},{"t":"p","h":"– Каке, келиңиз, куйруктан көп жеп коюп, май кекирип турам. Алдагыны сизге сактап койдум, – деди."},{"t":"p","h":"«Астында капкан болбосун?» – деп шектенген карышкыр анчалык көңүлсүнбөй мыкчыя тигилди."},{"t":"p","h":"– Кээде ушинтип кекирейип каласыз... Жебесениз өзүм үйгө алып кетейин, – деп түлкү баягы май куйрукка тап бергенде, карышкыр түлкүдөн мурда озунуп сугунмак болду эле, тумшугу капканга чабылып калды. Куйрук четке ыргыды. Түлкү аны илип алды да:"},{"t":"p","h":"– Жат, бөрү аке, жабышып, капкан менен кабышып, эртең эрте ушерден ээси менен табышып, – деп шаттанып ырдап, желе-жорто жүрүп кетти."},{"t":"p","h":"Бул үлгү али жазыла элек, сенин дилиңде, көкүрөгүңдө уюп турат дейли. Әми аны кантип жазуу керек?"},{"t":"p","h":"1. Көкүрөгүндө тургандар кандай болсо, ошондой кылып чүргөй салууга болот."},{"t":"p","h":"2. Көкүрөк менен дилде турган нерселер кагазга кандайдыр бир түр-түспөл, жарашык жана тилдик бай каражат менен шөкөттөлүп жазылышы керек. Ошондо ал баарына жеткиликтүү жана кулакка конумдуу болот. Демек, даярдык көп нерсени чечет."},{"t":"h3","h":"<span class=\"pg\" data-n=\"101\">101<\/span>ЖАЗУУГА ДАЯРДЫК"},{"t":"p","h":"Керегиңе жараша пайдалан Көкжал, кынжыйган, канчык карышкыр, эки уурту саландаган дөбөт карышкыр, азуусу бычак тай карышкыр, ач көз карышкыр, куу түлкү, кырда ойногон кызыл манат түлкү, «Бөрү азыгы – белде, түлкү азыгы – чөлдө», «Бөрү менен дос болсоң, корооңо сак бол», «Бөрүнүкү тең орток, кузгундуку куу жыгачтын башында», «Бөрүнүн оозу жесе да кан, жебесе да кан», «Бөрү жок дебе бөрк астында», «Карт түлкү капканга түшпөс», «Аңдабаган жерден түлкү чыгар, абайсыз жерден күлкү чыгар», «Көбүк карда түлкү ойнойт, түлкү менен күлкү ойнойт» ж. б."},{"t":"p","h":"Албетте, жазууга даярдануунун чеги кенен. «Кеп куржундагы» (бул окуу китебиңде бар) «Макал», «Сөз берметтери», «Тил кутучасы», «Санат сөз», «Санжыргалуу казына» топтомдорунан (кайсы класска таандык болсо да) тиешелүү тил каражаттарын каалаганыңдай пайдалансаң болот."},{"t":"p","h":"Ошентип,» үлгүсүнүн негизинде дилбаян жазышың керек, тил каражаттары боюнча даярдыгың да бар дейли. Эмесе, дилбаян жазуунун төмөндөгү үлгүлөрүн үйрөн."},{"t":"h3","h":"ДИЛБАЯНДЫН 1-ТҮРҮ"},{"t":"p","h":"Бар экен, жок экен, ач экен, ток экен, илгери-илгери ушул эле чөлкөмдө көргөндүн көзүн кычыштырган бир кызыл манат түлкү жашаган экен. Көбүк карга каршы-терши из түшүрүп, өзүнүн куйругу менен өзү ойнойт. Аңгыча – жыт! Шилекейи чууруп кетти. Шимшилеп жетип барса, эт, болгондо да куйрук. Бирок темирдин жыты аны токтотту. Капкан! Чый-пыйы чыгып, куйрук жаткан жерде бир нече жолу тегеренди. «Карт түлкү капканга түшпөс» деп ойлонду. «Бөрү жок дебе бөрк астында», аттинай, бир ач көз карышкыр келип калса» деп ойлоду чуштуйган тумшугун жаланып. Аңгыча ... (Мындан аркысы да ушул өндүү улантылат)."},{"t":"p","h":"Талдоо. Бул дилбаян «\\» үлгүсүнүн өзүнө эле окшош, бирок «бар экен, жок экен», «көргөндүн көзүн кычыштырган бир манат түлкү», «көбүк кар» өңдүү сөздөр менен байытылып жазылган. «Карт түлкү капканга түшпөс» деген макал да орундуу пайдаланылган. «Чый-пыйы чыгып, куйрук жаткан жерди бир нече жолу тегеренди» деген сүйлөм ач түлкүнүн чыйпалактаганын көз алдыга элестетет. Аңгеме сыңары жазылган. Демек, дилбаянды өзөк окуянын эле негизинде тил каражаттары менен байытып, мазмундуу жана кызыктуу жа3 43 @ Д9: ИИ СЕКА СТИ №532 гГгришкек"},{"t":"h3","h":"<span class=\"pg\" data-n=\"102\">102<\/span>ДИЛБАЯНДЫН 2-ТҮРҮ"},{"t":"p","h":"Мен – кырда ойногон кызыл манат түлкүмүн. «Көбүк карда түлкү ойнойт, түлкү менен күлкү ойнойт» – деп коюшат. Калп! Тамак табуу – азап. Адатымча жумурума жук болор бирдеме издеп чыкканмын. Ачкамын. Башым айланып, ичим чурулдайт. Ошондо кайдан-жайдан экени белгисиз, майлуу эттин жыты жыттанды. Байкуш шамал, ачка түлкүнү бир тоюнтуп коёюн деп боору ооруса керек. Багытты жоготпой учуп баратам, шимшилеп баратам!.. (Калганы да ушул өңдүү улантылат)"},{"t":"p","h":"Талдоо. Бул дилбаяндын өзгөчөлүгү биринчи жак менен баяндалышында. Болгондо да түлкүнүн өзү сүйлөйт. Ырас, турмушта түлкү өзү сүйлөбөйт. Бирок дилбаянда кыялдануу басымдуулук кылган. Ошол себептен түлкүнүн сүйлөшү, анын адамга окшоп ой жүгүртүүсү кемчилик эмес, анткени жомоктордун өзүндө айбанаттардын сүйлөшү – кадыресе эле нерсе."},{"t":"h3","h":"ДИЛБАЯНДЫН 8-ТҮРҮ"},{"t":"p","h":"Мен – эки уурту саландаган дөбөт карышкырмын. Ач элем. «Бөрү азыгы – белде, түлкү азыгы – чөлдө» деп жортуп келаткам. Аңгыча кызыл манат түлкүнү көрдүм. «Бөрүнүкү – орток, кузгундуку – куу жыгачтын башында» – дейт, балким, түлкү бирдеменин шек-шыбаасын билип жүрбөсүн» деп ойлодум да, түлкүгө жетип бардым... (Калганы да ушундайча улантылат)."},{"t":"h3","h":"Талдоо. Бул дилбаян да 2-түр менен окшош. Ошол сыяктуу эле баа"},{"t":"p","h":"берүүгө болот. Болгону түлкүнүн ордуна карышкыр сүйлөйт. Бирок баяндалышы боюнча экинчи дил баяндын көчүрмөсү эмес. Пайдаланылган тил каражаттары (М.: «Бөрү азыгы – белде, түлкү азыгы – чөлдө», «Бөрүнүкү – орток, кузгундуку – куу жыгачтын башында» ж.б.) боюнча өзүнчө бир бүтүн чыгарма сыяктуу."},{"t":"h3","h":"ДИЛБАЯНДЫН 4-ТУРУ Пьеса-дилбаян"},{"t":"p","h":"Катышуучулар: түлкү, карышкыр."},{"t":"p","h":"Окуя бузулуп-талкаланган эски таш короонун жанында өтөт. Түлкү (жойпуланып). Каке, Каке! Өзүңүздү айбандардын пашаасы, азуулуунун арстаны катары сезем. Калп айтсам кара башыма, как чокума көрүнсүн. Сиздин баатыр элесиңизди <span class=\"pg\" data-n=\"103\">103<\/span>түшүмдө да көрөм. Менин пиримсиз, таянар тоомсуз. Бирок «жоктук жоомарт эрдин колун кесет» дейт, шарт келишпей, сизге бир сый көрсөтө албай, иттей уят болуп жүрчү элем. Оңдой берди болуп, сизге бир куйрук камдап отурдум эле, Каке. Ал оозго тийгенде эле эрийт."},{"t":"p","h":"Карышкыр. Кана?"},{"t":"p","h":"Түлкү. Тигине, тигине! Болгондо да, баглан козунун куйругу. Карышкыр. Әй, митайым, алдаган жоксуңбу?"},{"t":"p","h":"Түлкү. Каке, айтарын айттым. Жебесең кой, азыр өзүм жейм."},{"t":"p","h":"(Калп эле куйрукка тап берип коёт. Карышкырдын ач кездук сезими дүрт этип ойгонот да, түлкүдөн мурда басып калат. Капкан тумшуктан чабат. Ыргып кеткен куйрукту түлкү акең шып илип алып, сугунат да, жолго түшөт)."},{"t":"p","h":"Талдоо. Бул дилбаян пьесалаштырып жазылган. Түлкү карышкырды алдоо учун бал тилге салат. «Менин пиримсиз, таянар тоомсуз»,— дейт. Сый көрсөтө албай, уят болуп жүрүптүр. Эми оңтою чыгып отурбайбы. Ал аз келгенсип, карышкырды айбандардын пашаасына, азуулуунун арстанына теңейт. Бул – куулугуна салган кейпи, дилинде карышкырдын капканга түшүп калышын, жемтик эттин өз оозуна тийишин каалап турат."},{"t":"p","h":"Демек, пьеса-дилбаян айтылчу өзөк ойго басым кылгандыгы менен артыкчылык кылат."},{"t":"h3","h":"ДИЛБАЯНДЫН 5-ТУРУ"},{"t":"p","h":"Диалог-дилбаян – Сен мага «Карышкыр менен түлкү» деген жомокту айтып бере аласыңбы? – деди Айсулуу."},{"t":"p","h":"– Ананчы, айтып берем, бирок жакшылап кулак төшө. Артынан кайра сурайм, – деди Толкун. (Бул сүйлөшүү андан ары ушул өндүү улантылат)."},{"t":"p","h":"Талдоо. Бул дилбаян эки адамдын маектешүүсү катары жазылган. Бир жагынан пьеса-баянга окшош. Бирок жазылышы боюнча айырмаланат. Диалог-дилбаян да өзүнчө түр катары эсептөөгө болот. Анткени дилнаама окуучунун көп түрдүү аракет-ишмердигинин бирин толук чагылдыра алат."},{"t":"h3","h":"ДИЛБАЯНДЫН 6-ТҮРҮ"},{"t":"p","h":"Ой толгоо. Ошентип, түлкү түркүн аракетке салып, карышкырды алдады да, жемтикти жеп алды. Муну менен эмнени айтууга болот? Биринчиден, бул жерде эптеп оокатын <span class=\"pg\" data-n=\"104\">104<\/span>өткөргөн куу түлкү жөнүндө сөз болуп жаткан жок. Куу түлкү аркылуу түлкүдөй куу, ашкан митаам адамдар жөнүндө кеп болууда. Чынында эле андай кишилер өзүнүн максатын, ит кыялын, бирөөгө жабыр көрсөтүү аркылуу табуучу пайдасын аярлык менен жашырып-жаяптап, ичи-бооруна кирип, чыгышкан дос, кыйышпаган өз болуп көрүнөт да, анан капканга чаптырат. Анан так ушу кылган кыянат ишинен кадыресе ыракат алат, оболу кыңылдап ырдайт. Бул кылганым мыктылыгым деп эсептейт. Әкинчиден, карышкырдын алданышын анын аңкоолугу деп эсептешке болбойт. Ал шек санаган. Бирок ач көздүгү жеңип кетти да, капканга чабылды. Мында деле карышкыр аркылуу карышкырдай ач көз адам жөнүндө тамсилденип айтылып жатат. Алар ач көздүгү аркасында башкалардын мал-мүлкүн, буюм-тайымын улкупжулкуп алып коюшат. Күч колдонот, урушат, согушат. Бирок урунуп-беринип, зордукчулук кылып жүрүп капканга да түшүп калат. Үчүнчүдөн, бул экөө тең – келечек ээлерине сабак. Түлкүчө куулуктан, карышкырдай ач көздүктөн качууга үйрөтөт. Төртүнчүдөн, түлкү алсыздыгына карабай амал менен күчтүү карышкырды жеңип кетти. Бул – акылайла кара күчтөн артыкчылык кылат дегендик. Аны «арстандай күчүң болсо да, түлкүдөй куулукту үйрөн» деген макалда далилдеп турат."},{"t":"h3","h":"Талдоо. Бул ой толгоодо окуя сүрөттөлгөн жок. Көңүлгө тутулган"},{"t":"p","h":"башкы нерсе – окуянын натыйжасы. Так ушул бутага алынат да, «Эмне үчүн мындай?» «Аны менен эмнени айткысы келген?» деген өңдүү суроолор коюлуп, маани-маңыз талданат, иликтенет. Жеке өзү үчүн окурман тыянак-корутундуларды чыгарат. Демек, мындай дилбаянда аны жазган окуучунун акыл ишмердиги, иликтеп-изилдөө, баа берүү, сындоо жөндөмү өнүгөт."},{"t":"h3","h":"ДИЛБАЯНДЫН 7-ТҮРҮ Ыр түрүндөгү дилбаян"},{"t":"v","l":["1. Шимшилеп куурай түбүн түлкү келет,","","2. Карышкырды көргөндө, жым дей түштү,","","... ... ..."]},{"t":"p","h":"<span class=\"pg\" data-n=\"105\">105<\/span>3. Капкан чапты, жемтик эт ыргып кетти,"},{"t":"p","h":"... ... ... ... ..."},{"t":"p","h":"Иштеенун тартиби. 1. Уч чекит коюлган жерге ыр саптарын езун таап толтур. 2. 1-сапка 2, 4-сап уйкашат. М.: келетжелет-демек-себеп,тушту-кучтуу-тузду-кулку-тулку, кеттижетти-этти ж.б. 3. Ар бир ыр сабы 11 муундан турсун. 4. «Илхам кеп» топтомунан үлгү ал."},{"t":"p","h":"Сунуш. Дилнааманы ыр түрүндө жазса да болот. Ал кол жеткис нерсе эмес. Ырас, таланттуу ырды жаратуу бардык окуучунун колунан келе бербес. Бирок ыр жазуунун майда бурама-тетиктерин билүүгө неге болбосун. Арийне, болот. Ойлогон оюңду, кыялыңды уйкаштык менен шөкөттөп ыргакка келтирип, ыр кылып токуу – бул да адам мүмкүнчүлүгүнүн бир кыры. Аны билүү артыкбаштык кылбайт."},{"t":"p","h":"Үлгүнү жалпылоо Байыркы түрк тамгасы «ай» (бизче «т») менен үлгү белгиленип, «Карышкыр менен түлкү» жомогу анын төл башы мисалы болгону эсинерде. Анын жети түрдүү жазылышын да үйрөнүп алдыңар. Буйруса, жолду андан ары узартабыз. Әми «Карышкыр менен түлкү» жомогунун ордуна «Кыргыз адабияты» китебинердеги «Жараланган жүрөк» повестинен бир чакан үзүндүнү (мындай мисалды «Кожожаш», «Әр Табылды» эпосторунан, «Әрте келген турналар», «Атанын тагдыры», «Адам болгум келет», «Ыр сабындагы өмүр» деген ж. б. чыгармалардан да алса болот) келтирели. Темасы – «Бектурган карыя»."},{"t":"p","h":"Окуянын кыскача мазмуну Муну мурда окугансың, билесиң, ошентсе да үйрөнүү ишинин кызыкчылыгы үчүн кыскача мазмуну баяндалат. Бирок бул мазмунду сенин көөдөнүңдө турат деп эсептейли."},{"t":"p","h":"1917-жыл. Ачарчылык. Бектурган карыя Токмок шаарынын башындагы ачкадан өлгөн өлүктөр жаткан сай менен келаткан. Аңгыча бир карга өлүккө конгону келатып, кайра от менен ургандай чочуп, уча качты. Анткени өлүктүн боорунда көкүрөктү тырмалап, наристе бала жаткан. Бектургандын денеси дүр этти. Тааныды. Баягы аял. Аты Айша болучу. Ит капкан балтыры салбырайт. Колунда кир ороодо <span class=\"pg\" data-n=\"106\">106<\/span>бала. Бул кайырчы аял жардам сураган болучу. Бектурган да ошол Айша сыяктуу тилемчи эле. Ошентсе да беш-алты боорсок, бир тутамга жетпеген текей, алаканына талкан салып берген. Ошондо ал аял: «Аке, мен бул жерден козголо албайт окшоймун. Мага карабаңыз. Мен жер үстүнөн көрүнбөсөм, куран окуп, менин атыма атап коёр бекенсиз. Менин кымбатым бул шордуу бала артымда калып эмне болот? Ким багат? Ким алат?» – деген. Мына эми көкүрөгүн тырмалаган баласын да сезбей өлүп жатат. Бектурган карыя дароо баланы колуна алып, талканды суюк чайнап, тили менен ага сордурду. Анан суунун кемерин чукулап, ал жерге аялдын сөөгүн жашырды да, куран окуду. Андан соң баланы багып алуу үчүн көтөрүп кетти."},{"t":"p","h":"Сунуш. Жогоруда дилбаян жазуунун 7 түрү менен таанышкансың. Эми ошол мүмкүнчүлүктү пайдаланып, өз алдыңча дилбаян жазышың керек."},{"t":"p","h":"1. Кыялың менен «муну минтип, тигини антип» деп иштейсиң.Тагыраак айтканда, биринчиден жетинчиге чейин кандайча жазууну кыялыңдан өткөрөсүң."},{"t":"p","h":"2. Мында каалооңо жараша экинчи же үчүнчү үлгүнү тандап аласың да, татынакай дилбаян жазасың. Узун же кыска жазуу өзүңдүн ыктыярың. Кеп мазмундуулугунда. Биринде карыя болуп сүйлөсөң, экинчисинде карганы сүйлөтөсүң."},{"t":"p","h":"«Бектурган карыя» дилбаянын жазууда сага төмөндөгүдөй кызмат көрсөтүлөт."},{"t":"p","h":"1. «Санат сөз», «Макал», «Сөз бермети» топтомдорунан пайдалан."},{"t":"p","h":"2. Керегиңе жараша колдон: «Жоктун жону катуу», «Тулпар тогунда эмес, ачында сыналат», «Сыр аяктын сыры кетсе да, сыны кетпейт», «Жакшынын жакшылыгы тиер ар жерде, жамандын жамандыгы тиер тар жерде», «Балыкчыны балыкчы алыстан тааныйт», «Карысы бардын ырысы бар», «Бир буту жерде, бир буту көрдө», «Жаманчылыкты аманчылык жеңет», «Тең жегенди теңирим сүйүптүр»."},{"t":"p","h":"3. Залкар ойлор. «Таш боор адамдын өзүнөн башкага пайдасы тийбейт» (Публиций Сир-Рим акыны). «Кайрат тагдырдын соккусун жокко чыгарат» (Демокрит – грек «Жүрөктүн мээрими марттыктан жогору» (моңгол макалы.)."},{"t":"h3","h":"КОЖОЖАШ МЕРГЕН Ойго өбөлгө. Суречкини туткактап артынан сая түшкөн"},{"t":"p","h":"мерген жуп жетерде, коюу кара туман каптап калат. Эч нерсе көрүнбөйт. Анан туман суюлуп барып тарайт. Кожожаш <span class=\"pg\" data-n=\"107\">107<\/span>тегерегин караса, баары өзгөргөн, аска асман тирейт, аяк-башы керилип чалкаят. Өзү жалама зооканын боорунда тердиктей тектирде калган. Кылт этсең учасың, сөөгүң сөпөт болот. Төмөнтөн шаты, жогортон аркан жетпес аралык. Ылдый карасаң баш айланта аска шуулдайт. Әмне болуп кетти? Куугундун кызыгына түшкөн мерген ушундай жерге барганын билбей калдыбы? Ооба, мындай болушу да мүмкүн. Же тукумун курутуп, Алабаш текесин өлтүрүп, туягы ташка жешилип түгөнгүчө кууп, эсин оодаргандыгы үчүн Суречкинин кудайдан тилеген тилеги кабыл болуп, Кожожаш асканын боорунда калдыбы? Балким, бул зоо аска эмес, элдин анын таш боордугу үчүн ойлоп тапкан жазасы болушу да мүмкүн эмеспи. Ушул жаза менен кийинкилерди ойлонтуп, таалим-тарбия берейин деген ниет болуп жүрбөсүн? Анда Кожожаштын асканын боорунда калышы тозокко барабар жазадыр. Мергендин башына келген, атайы ага эл-журт ыйгарып берген акыр замандыр. Же кандай?"},{"t":"p","h":"Сунуш. 1. Бул дил баянды ой толгоо түрүндө жаз. 2. Же пьеса-дил баянга айландыр. Катышуучулар: Суречки, Адамзат, Кожожаш. Үчөө тең мергенчинин асканын боорунда камалышын өз ой-пикирлери менен түшүндүрүшөт. 3. Кайсы түрдү жазсаң да, мында «Сөз бермети» топтомунун УП, УШ, [Х класстардагы материалдарын пайдалан."},{"t":"v","l":["Дилбаян «Жакшылык кылуу»","Суроолор:","1. Жакшылыкты кандайча түшүнөсүн?"]},{"t":"p","h":"2. Башкаларга жакшылык кылуунун пайдасы барбы?"},{"t":"p","h":"8. Өзүң бирөөлөргө канча жолу жакшылык кылдын?"},{"t":"p","h":"4. «Жакшылыкка жакшылык ар кишинин иши, жамандыкка жакшылык эр кишинин иши» деген макалды чечмеле."},{"t":"p","h":"Сунуш. 1. Бул дилбаянды диалог түрүндө жаз. 2. «Макал», «Сөз бермети» топтомдорундагы тил каражаттар менен жазганыңды шөкөттө."},{"t":"h3","h":"Дилбаян «Аёо сезими»"},{"t":"p","h":"Суроолор:"},{"t":"p","h":"1. Аяй билүүнүн зарылдыгы барбы?"},{"t":"p","h":"2. Сен өзүң боор ооруп, аяй билүү сезимине канча жолу дуушар болдуң (жан-жаныбарды, чөп-чарды, адамды) !?"},{"t":"p","h":"Сунуш. 1. Дилбаянды 1-түр боюнча жаз. 2. «Сөз бермети» топтомун пайдалан."},{"t":"h3","h":"<span class=\"pg\" data-n=\"108\">108<\/span>Дилбаян «Ким күчтүү?»"},{"t":"p","h":"Катышуучулар: 1) Сом, 2) Ууру, 8) Арак, 4) Өнөр, 5) Мээнет, 6) Ыйман. Булардын ар бири өздөрүнүн күчтүүлүгүн далилдеп, талаш-тартышка чыгышат."},{"t":"p","h":"Сунуш. 1. Албетте, дилбаян пьеса түрүндө жазылат. 2. «Сөз бермети», «Санат сөз», «Макал» топтомдорунан тиешелүүлөрүн дилбаян жазууда пайдалан."},{"t":"p","h":"Дилбаян «Айлуу түндөгү эгин талаасы»"},{"t":"p","h":"Ырга көрөңгө. Төө өркөчтөнгөн адырдан төптөгөрөк ай көтөрүлдү. Сары багелек болгон буудай талаасы чайпалат, көөлгүйт. Бөдөнө бытпылдыктайт. Токой тараптан үзгүлтүксүз чардаган бакалардын үнү угулат. Аркандалган ат үргүлөйт..."},{"t":"p","h":"Сунуш. 1. Ыр жаз, уйкаштыр, уйкашпай калса да, аракет кылып көр. Ырдын көлөмүнө чек коюлбайт."},{"t":"v","l":["Адырдын кетигинен ай көрүндү,","","Жумшак желге дан талаасы чайпалат,","","2. «Илхам кеп» топтомун окуп таасирлен.","Дилбаян «Шаркыратма»"]},{"t":"p","h":"Ырга көрөңгө. Жайлоо. Шаркырап аккан, кулак тундурган кашка суу. Суу агымы бири-бирине кептелген жайпак таштардын үстүнөн, бир жарым кулач бийиктиктен кулап түшөт. Ошол – шаркыратма. Суу түшкөн жер – боз үйдүн ордундай көлчө. Ичи толгон чаар балык. Жел сокпой тымып калган маалда көрсөң, балыктар шаркыратманын шары менен өйдө жалт этип атылып чыгат да, жарым кулач бийиктен кайра чулп этип сууга түшөт. Бул – өзүнчө керемет кубулуш. Канча тиктесен да танбайсың. Бирөө эле эмес, бир нечеси удаама-удаа секиргенин айт."},{"t":"p","h":"Сунуш. Ушул керемет көрүнүштү кудуретиңдин жетишинче ырга айландыр."},{"t":"v","l":["кашка суу,","шашма суу.","<span class=\"pg\" data-n=\"109\">109<\/span>Секирсе да, мөңкүсө да кээ жерде,","Көлмө болуп көбүктөнүп калма суу.","Шаркыратма шары менен атылат,"]}],"sub":[{"title":"Биринчи түрмөк","b":2},{"title":"Үчүнчү түрмөк","b":15},{"title":"§ 14. ДИЛБАЯН Байытып баянда","b":36},{"title":"Байланыштырып жана байытып чакан","b":43},{"title":"КАРЫШКЫР МЕНЕН ТҮЛКҮ","b":51},{"title":"ЖАЗУУГА ДАЯРДЫК","b":60},{"title":"ДИЛБАЯНДЫН 1-ТҮРҮ","b":64},{"title":"ДИЛБАЯНДЫН 2-ТҮРҮ","b":67},{"title":"ДИЛБАЯНДЫН 8-ТҮРҮ","b":70},{"title":"Талдоо. Бул дилбаян да 2-түр менен окшош. Ошол сыяктуу эле баа","b":72},{"title":"ДИЛБАЯНДЫН 4-ТУРУ Пьеса-дилбаян","b":74},{"title":"ДИЛБАЯНДЫН 5-ТУРУ","b":83},{"title":"ДИЛБАЯНДЫН 6-ТҮРҮ","b":87},{"title":"Талдоо. Бул ой толгоодо окуя сүрөттөлгөн жок. Көңүлгө тутулган","b":89},{"title":"ДИЛБАЯНДЫН 7-ТҮРҮ Ыр түрүндөгү дилбаян","b":91},{"title":"КОЖОЖАШ МЕРГЕН Ойго өбөлгө. Суречкини туткактап артынан сая түшкөн","b":107},{"title":"Дилбаян «Аёо сезими»","b":115},{"title":"Дилбаян «Ким күчтүү?»","b":120}],"section":"УП КЛАСС","pages":[96,109]},{"title":"&amp; 15. ТАТААЛ СҮЙЛӨМ","blocks":[{"t":"h3","h":"&amp; 15. ТАТААЛ СҮЙЛӨМ"},{"t":"p","h":"Кандай кошмо сүйлөм болсо да, анын бөлүктөрү"},{"t":"p","h":"биригип, биримдик бүтүн ойду билдирет. К.К. Сартбаев .. тең байланыштагы татаал сүйлөмдөр татаал сүйлөмдүн адепки да, байыркы да түрү болушу мүмкүн. Ал эми багыныңкы байланыштагы татаал сүйлөмдөр соңку пайда болгон түрү болуп саналат. А. Жапаров Сөздүн жасалышынын материалы – тыбыш, жөнөкөй сүйлөмдүн материалы – сөз жана сөз менен сөздүн айкашы"},{"t":"p","h":"татаал сүйлөмдүн материалы – жөнөкөй сүйлөмдөр. А. Иманов Татаал сүйлөм – бул оозеки кепте да, жазмада да кен-кесири колдонулган тилдик каражат. Ал женекей суйлем сыяктуу эле ой-пикирди билдирет, бирок өз тутумуна бир нече сүйлөмдү бириктирип тургандыгы менен татаал. Ошентип, эки же андан ашык жөнөкөй сүйлөмдөр өз ара уюмдашып бир татаал сүйлөмдү түзөт."},{"t":"p","h":"М.: Көч шааниси коңгуроо шыңгырайт, көч арасында тайлагы адашып келаткан каймал боздойт, жай каалгый көч бейпил (Т. Касымбеков)."},{"t":"v","l":["Бул татаал сүйлөмдө үч жөнөкөй сүйлөм бар.","1. Көч шааниси коңгуроо шыңгырайт."]},{"t":"p","h":"2. Көч арасында тайлагы адашып келаткан каймал боздойт. З. Жай каалгый көч бейпил. Бул үч сүйлөм биригип, бир татаал сүйлөмгө айланды."},{"t":"p","h":"116-көнүгүү. Төмөнкү татаал сүйлөмдөрдүн тутумунда канчадан жөнөкөй сүйлөм бар, ажыратып айтып бер."},{"t":"p","h":"Жер деңиздин жүрүшүн тороп көшөрөт, деңиз болбой жерди омуроолоп сүрдүгөт. Таң атар маал таяп келди. Дагы бир түн карып, дагы бир күн жаралып келатты. Шоолаланган ала күүгүмдө <span class=\"pg\" data-n=\"110\">110<\/span>таноосунан буу бурулдаган бугунун шалпык эрдине окшоп, көбүк бүркүп күрпүлдөгөн жээк көрүнө баштады. Дениз менен жер тийишкен узак жээк туташ оргуштап кайнап, жер менен деңиз тийишкен узак жээк үстүндө муздаган буу туман болуп уюп, туман асты күркүрөп-шаркырап жатты. Деңиз көшөргөнүн койбой, толкун артынан толкун кубалап, тоңголок кумдуу жээкти жаба берет, кара күрөң былжыр таштарга шабыраган көбүк жабышат. Түн тарап, таң агарды. Жарык шоола жайылып, теребел айкындала берди. Жер сүрөтү таанылып, деңиздин кыяпаты ачылды (Ч.Айтматов)."},{"t":"p","h":"Үлг ү: Тун тарап, таң агарды. Бул татаал сүйлөмдө эки жөнөкөй сүйлөм бар. 1. Түн тарап. 2.'Таң агарды. Демек, эки ЖСтен бир ТС түзүлдү."},{"t":"p","h":"117-көнүгүү. «Макал» топтомун кара (ал ушул окуу китебинде бар). Оозеки аныкта. Канча макал ТС түрүндө түзүлгөн?"},{"t":"p","h":"118-көнүгүү. «Санат сөз» топтомун кара да, канчасы ТС экенин оозеки аныкта."},{"t":"p","h":"119-көнүгүү. «Мээр сөз» топтомун кара да, канчасы ТС экенин оозеки аныкта."},{"t":"p","h":"120-көнүгүү. «Чечендик жана сынчы сөз» топтомунан татаал сүйлөмдөрдү тап."},{"t":"h3","h":"ТАТААЛ СҮЙЛӨМДҮН БӨЛҮНҮШҮ"},{"t":"p","h":"ТСтин тутумундагы жөнөкөй сүйлөмдөр бири-бирине окшош болуу менен бирге, бири экинчисине окшобой турган да өзгөчөлүктөрү бар. М.: Жарык шоола жайылды, теребел айкындала берди. Мында эки сүйлөмдөгү «жайылды», «айкындала берди» деген баяндоочтор ойду так бүтүрө айтты. Так ушул касиети менен жогорку ТСтин тутумундагы эки сүйлөмдү бири-бири менен тең тайлаш, тең ата жана багынычсыз кылып койду. Демек, бул эки сүйлөм ТСтин тутумунан чыгып, интонациялык жактан аякталган өз алдынча сүйлөм болуп кетишке толук мүмкүнчүлүгү бар. М.: Жарык шоола жайылды. Теребел айкындала берди. Ошентип, ТСтин тутумундагы жөнөкөй сүйлөмдөрдүн байланышы бош, керек болсо алар маани-маңызы кемибей, өз алдынча сүйлөм болуп да ажырап кете

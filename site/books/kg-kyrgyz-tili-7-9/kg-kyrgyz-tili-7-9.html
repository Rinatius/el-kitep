<style>/* Mobile textbook reader. No external fonts or libraries: everything works offline. */

/* ---------- Reader ---------- */
.reader { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; user-select: text; }

.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }

","h":"ББК 81.2 Ки я721"},{"t":"v","l":["© Исаков Б., 2012","©КР ББИМ, 2012","КББИ, «Педагогика», 2003","© «Билим-компьютер», 2012"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"2\">2<\/span>БЕТ АЧАР"},{"t":"p","h":"Билим – бул келечекке көпүрө."},{"t":"p","h":"Үмөт Молдо"},{"t":"h3","h":"УРМАТТУУ ОКУУЧУМ!"},{"t":"p","h":"Бул окуу китеби сага ак көрпө жайыл кызмат көрсөтөт, билимине өбөк, жендемуне жөлөк болот жана төмөнкү төрт багытты туу тутат. Алар:"},{"t":"p","h":"1) кыргыз тилинин нечен кылымдап калыптан-"},{"t":"v","l":["ган байлыгын үйрөтүү;","2) тилдин грамматикасын мектептик көлөмдө","окутуу;"]},{"t":"p","h":"3) орфографиялык жана пунктуациялык сабат-"},{"t":"v","l":["туулукка текши жеткирүү;","4) дилбаян жазууга көнүктүрүү.","Бирок ошол төрт багыттын ар бири ич ара эки","бөлүктөн куралган. Маселен, тил байлыгы – аны","үйрөнүүдөн жана колдоно билүүдөн, сабаттуулук"]},{"t":"p","h":"эрежеден жана жат жазуудан, тил илими – урунттуу эрежелерден жана грамматикалык талдоолордон, дилбаян – чыгармачылык менен жазуудан жана талкуулоодон. Айталы, «Кеп куржунга» кирген «Санат сөз», «Йлхам кеп», «Сөз берметтери», «Макал» топтому», «Чечендик жана сын сөз» топтому, «Мээр сөз» эң оболу үйрөтүлөт, анан ал сүйлөп жана жазып машыгуу иштери менен милдеттүү түрдө коштолот. Ошентип, жогорку төрт багыт класстан класска көчкөндө да сени ээрчип жүрөт, топтоштурулат, кайталанат, колдонулат."}],"sub":[{"title":"Бишкек – 2012","b":3},{"title":"ББК 81.2 Ки я721","b":12},{"title":"БЕТ АЧАР","b":14},{"title":"УРМАТТУУ ОКУУЧУМ!","b":17}],"pages":[0,2]},{"title":"САНЖЫРГАЛУУ КӨРӨҢГӨ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"3\">3<\/span>УП КЛАСС"},{"t":"h3","h":"САНЖЫРГАЛУУ КӨРӨҢГӨ"},{"t":"h3","h":"&amp; 1. ФОНЕТИКАЛЫК ТАЛДОО"},{"t":"v","l":["Кебибиздеги тыбыштар бардык","башка тыбыштар сыяктуу","айланадагы абанын кыймылынын","дирилдөөсү болуп саналат.","Т. К. Акматов","","Акыл Карачач. Силер \\/ класста фонетиканы окугансыңар. Эми ошол"]},{"t":"p","h":"билим көрөңгөңөр эмне болду? Эсте түгөл сакталдыбы? Же таптаза уну-"},{"t":"v","l":["тулдубу? Келгиле, мындай кылалы. Төмөнкү көнүгүүлөрдү оозеки иштөө","менен өзүңдү өзүң текшер.","1-көнүгүү. Адегенде үндүү тыбыштарды, анан үнсүз тыбыштарды тап.","Алда кайдан кебез тартып келаткан","Кербенчинин төөлөрүндөй чубашып (Алыкул).","","2-көнүгүү. Кең жана кууш үндүүлөрдү тап.","Ала-Тоо, Ысык-Көлдүн сыры терен,","Тереңден термелсе күү угар белең (Жусуп).","","3-көнүгүү. Жоон жана ичке үндүүлөрдү тап.","Санап-санап, эсептесем өмүрдү,","Өткөн өмүр балдан ширин көрүндү (Жоомарт).","","4-көнүгүү. Ачык (эринсиз) жана эринчил үндүүлөрдү тап.","Туландан ыргып чыга албайт","Эликтин эрке баласы.","Кандай сонун,","Карачы, досум, карачы! (Аалы).","5-көнүгүү. Каткалан, жумшак жана уяң үнсүздөрдү ажыратып","айтып бер.","Өзгөрүлөр, далай заман алмашар,","Далай чыгып, далай кайра күн батар (М укай)."]},{"t":"p","h":"Чыпалак. Жогорудагы мисалдарды оозеки талдоодо өзүңдүн чамачаркыңды байкадың. Көрөңгөң канчалык экенин да билдиң. Бирок билгениң да, билбегениң да ичиңде болсун. Сыр ачпай коё тур."},{"t":"p","h":"<span class=\"pg\" data-n=\"4\">4<\/span>Көрөгөч Маамыт. Мен сага азыр фонетикалык талдоо боюнча багыт берем. Ушул окуу китебинин этегинде УИ – |Х класстын окуучуларына арналган «Серектин сыр сандыгы» деген бөлүм бар, ошонун ичинен «Тыбыш топтому» дегенди тапсаң, ал унутканыңды эсиңе түшүрүп, чала билгениңди бышыктайт. Ошондон соң талдоодо ташыркабайсың."},{"t":"v","l":["6-көнүгүү. Жумшак үнсүздөрдү тап.","Качан жүрөк кагышынан танганда,","Бир тартылып өтүп кетер элесиң (Мидин)."]},{"t":"p","h":"1-көнүгүү. Жарылма үнсүздөрдү, андан соң уччул үнсүздөрдү тап."},{"t":"p","h":"Жел ырын желге шыбырап,"},{"t":"v","l":["Желеде кулун тыбырап,","Кыянын баары кой-эчки","Куюлган кумдай шыгырап (Сүйүнбай)."]},{"t":"p","h":"8-көнүгүү. Я, Ю, Е, Е, Ь,Ъ, Щ, Ц тамгалары катышкан сөздөрдү талда."},{"t":"p","h":"Гимназия, юмор, юрист, боёк, ниет, люлька, съезд, М. С. Щепкин – орус актёру, лагерь, цинк, цирк."},{"t":"p","h":"9-кенугуу. Ундуу тыбыштар боюнча фонетикалык талдоо жургуз. Кен жана кууш, жоон жана ичке, эринчил жана ачык ундуулерду аныкта."},{"t":"p","h":"Теребелге кар оор тушкен. Эки кун мурда албууттанган табигаттын өрттөй алоолонгон борошосу уйгу-туйгу салып өтүп, Ысык-Көлдүн кыркаар бөксөсүн башынан-аягына күрткү уруп, үстүн сапырылган тозоң менен үйлөп салды (Ч. Айтматов)."},{"t":"p","h":"10-көнүгүү. Үнсүз тыбыштарды жасалуу орду боюнча оозеки талда. Кыргыз элинин маданияты – миңдеген жылдардан бери карай түптөнүп, калыптанып келе жаткан маданият. Ошон үчүн ал дүйнөгө «Манасты», Калыгулдай олуяны, Токтогулдай ырчыны, Карамолдодой комузчуну, Чыңгыздай залкар жазуучуну жаратты (А. Акаев)."},{"t":"p","h":"11-көнүгүү. Үнсүз тыбыштарды жасалуу ыгы боюнча оозеки талда. Сен эми билекти түрүнүп, өз турмушунда бурулуш жаса. Күндөлүк турмушундун бир калыпта кылдыраган көндүм агымын өзгөрт. Өзүңдүн жалкоолугуңа, кенебестигине, жандын тынчын жакшы көрүүчүлүгүңө, чечкинсиздигиңе каршы аёосуз түрдө күрөш ач. Өзүндү өзүң башкара билүүгө өжөрлүк менен талаптанып, алдыңа бир айдындуу максат коюп, аны ишке ашырууга шымаланып кириш (С. Байгазиев)."},{"t":"p","h":"<span class=\"pg\" data-n=\"5\">5<\/span>12-көнүгүү. Ар бир сөздө канча тыбыш, канча тамга бар экендигин аныкта."},{"t":"p","h":"Кыргоол, буудай, жайлоо, суусар, төөнө, күүгүм, чаарчык, ачуулуу, жылбырска, жылаажын, жуушан, сөөлжан, караандуу, тоолуу, куюн, даярдан, сыяктуу, январь, юбилей, тыюу, боёо, эңкеет, расписание, кыяктуу, ёлка, пьеса, рояль, адъютант, уюткулуу, Ньютон, кыргыек, жантаюу, плащ, щётка, центнер, офицер, абзац."},{"t":"p","h":"Үлгү: ёлка – 4 тамга, 5 тыбыш."},{"t":"p","h":"18-көнүгүү. Бир сөзүн да калтырбай текши фонетикалык талдоо жүргүз."},{"t":"p","h":"Кыштын кыска күнүндө тоонун күнгөй беттери аз убакка жылымта тартып, наристенин тыноосундай үлпүл мемирей түштү эле, көп узабай күн ырайы кайра бузулду, капилеттен өзгөрдү – мөңгүдөн ызгаар уруп, аюудай жылган эрте күүгүм кокту-колотту мелт-калт толтура жойлоп келатты, өзү менен кошо ал түндө түшөр көзгө көрүнбөгөн боз мунарык аязын ала келатты (Ч. Айтматов)."},{"t":"p","h":"Үл г ү: боз – 3 тамга, 3 тыбыш."},{"t":"p","h":"б – кош эринчил, жарылма, түгөйлүү, жумшак үнсүз тыбыш, о – кыска, кен, жоон, эринчил үндүү тыбыш, з- уччул, жылчыкчыл, сызылма, түгөйлүү үнсүз тыбыш."},{"t":"p","h":"14-көнүгүү. Удаалаш талдоо жүргүзгүлө. Парта боюнча. Мисалы, көп деген сөздөн биринчи окуучу к, экинчиси Ө, үчүнчүсү п тыбышын талдайт. Калганы да ушундайча уланып кете берет."},{"t":"v","l":["Көп сүйлөбө, а көрөкчө так сүйлө,","Түмөн сөздүн оң мааниси бир сөздө.","Өмүр кыска, туулган соң өлмөк бар,","Жакшы сөздөр түбөлүктүү, өлбөйт ал.","Адамзатты эки сапат багыттайт —","Чындык сөзү, ак эмгеги карытпайт.","","Билим ал, менден калар алтын, күмүш,","Аларды сөзгө болбойт тенештириш.","Күмүштү ишке салсаң бүтүп калат,","Сөзүмдү ишке салсаң күмүш табат.","Ж. Баласагын"]},{"t":"p","h":"<span class=\"pg\" data-n=\"6\">6<\/span>Көрөгөч Маамыт. Мен сага азыр фонетикалык талдоо боюнча багыт берем. Ушул окуу китебинин этегинде МП —1Х класстын окуучуларына арналган «Серектин сыр сандыгы» деген бөлүм бар, ошонун ичинен «Тыбыш топтому» дегенди тапсаң, ал унутканыңды эсиңе түшүрүп, чала билгениңди бышыктайт. Ошондон соң талдоодо ташыркабайсың."},{"t":"v","l":["6-көнүгүү. Жумшак үнсүздөрдү тап.","Качан жүрөк кагышынан танганда,","Бир тартылып өтүп кетер элесиң (Мидин)."]},{"t":"p","h":"1-көнүгүү. Жарылма үнсүздөрдү, андан соң уччул үнсүздөрдү тап."},{"t":"p","h":"Жел ырын желге шыбырап,"},{"t":"v","l":["Желеде кулун тыбырап,","Кыянын баары кой-эчки","Куюлган кумдай шыгырап (Сүйүнбай)."]},{"t":"p","h":"8-көнүгүү. Я, Ю, Ё, Е, Ь,Ъ, Щ, Ц тамгалары катышкан сөздөрдү талда."},{"t":"p","h":"Гимназия, юмор, юрист, боёк, ниет, люлька, съезд, М. С. Щепкин – орус актёру, лагерь, цинк, цирк."},{"t":"p","h":"9-көнүгүү. Үндүү тыбыштар боюнча фонетикалык талдоо жүргүз. Кең жана кууш, жоон жана ичке, эринчил жана ачык үндүүлөрдү аныкта."},{"t":"p","h":"Теребелге кар оо ","h":"б – кош эринчил, жарылма, түгөйлүү, жумшак үнсүз тыбыш, о – кыска, кең, жоон, эринчил үндүү тыбыш, з- уччул, жылчыкчыл, сызылма, түгөйлүү үнсүз тыбыш."},{"t":"p","h":"14-көнүгүү. Удаалаш талдоо жүргүзгүлө. Парта боюнча. Мисалы, көп деген сөздөн биринчи окуучу к, экинчиси е, үчүнчүсү п тыбышын талдайт. Калганы да ушундайча уланып кете берет."},{"t":"v","l":["Көп сүйлөбө, а көрөкчө так сүйлө,","Түмөн сөздүн оң мааниси бир сөздө.","Өмүр кыска, туулган соң өлмөк бар,","Жакшы сөздөр түбөлүктүү, өлбөйт ал.","Адамзатты эки сапат багыттайт —","Чындык сөзү, ак эмгеги карытпайт.","","Билим ал, менден калар алтын, күмүш,","Аларды сөзгө болбойт тенештириш.","Күмүштү ишке салсаң бүтүп калат,","Сөзүмдү ишке салсаң күмүш табат.","Ж. Баласагын","<span class=\"pg\" data-n=\"8\">8<\/span>15-кенугуу. Оозеки талда.","Беш мүчөдөн бөлөкчө баш да өзгөчө,","Кыйгач бүткөн чекеге каш да өзгөчө.","Кенчиликте дос да дос, касың да дос,","Тарчылыкта кайрылган дос да өзгөчө.","Абай"]}],"sub":[],"section":"УП КЛАСС","pages":[3,8]},{"title":"§ 2. МОРФОЛОГИЯЛЫК ТАЛДОО","blocks":[{"t":"h3","h":"§ 2. МОРФОЛОГИЯЛЫК ТАЛДОО"},{"t":"p","h":"Мүчө өзү жалганган уңгу сөздүн тыбыштык түзүлүшүнө карай фонетикалык жагынан өзгөрүп, бир канча варианттарга ээ болот. С. Кудайбергенов"},{"t":"h3","h":"1. жана мүчө боюнча талдоо"},{"t":"p","h":"16-көнүгүү. Көчүрүп жаз. Анан уңгу, мүчөлөрдүн аралыгын тик сызык менен ажырат."},{"t":"p","h":"Жыландар сойлоп жүрүүчүлөр түркүмүнө кирет. Жер шарында алардын 18 тукумунан тараган 2500гө жакын түрү бар. Кыргызстанда жыландардын 10 түрү кездешет. Алардын эң узуну 10 метр, эң кичинеси 8—10 см болот. Омурткаларынын саны 200гө жетет. Денеси кооз кабырчык менен капталган. Анын угуу органы таптакыр өөрчүбөгөндүктөн, жыт алуу жана сезүү органынын милдетин негизинен тили аткарат. Ал айлана-чөйрөнү чебердеп байкоо үчүн учу эки ача тилин тез-тез соймондотот. Катуу сүйлөшүү, ырдоо жыланга таасир этпейт, бирок акырын шилтенген буттун дабышы аны сактандырат. Себеби, ал денеси менен ар кандай толкундарды, термелүүлөрдү сезе билет. Жер титирөөнүн болушун алдын ала сезип, ийинден сыртка чыга баштоонун сыры да ушундан. Көпчүлүгү жумуртка тууйт, кээ бир түрү каканак сымал жумуртканы тууру менен, андан кичинекей баласы чыгат («Мугалимдер газетасы»)."},{"t":"p","h":"Үлг ү: жылан/дар, сойло/п, жүр/үү/чү/лөр, калганы да ушул сыяктуу."},{"t":"p","h":"17-көнүгүү. Адегенде уланды, анан куранды мүчөлөрдү тап. Жылан өзү түздөн-түз адамга же айбанга кол салбайт. Кимдир бирөө аны басып алганда же кыжырына тийгенде гана чагат. Жыландын уу чыгаруучу шилекей бездери түтүкчө аркылуу үстүнкү жаактагы тиштин жоон түбүнө бириккен. Ал чакканда, уу тиштин учундагы тешикче аркылуу <span class=\"pg\" data-n=\"9\">9<\/span>чыгат да, чактырган жаныбардын терисине куюлат жана андан канга өтөт. Чекир жылан (кобра) чакса, ал нерв системасын ууландырып, бүткүл денени кыймылдатпай шал кылат. Ал эми кара чаар жылан чакканда, кан тамырлар жарылып кетет да, кан уюп, жүрбөй токтоп калат («М угалимдер газетасы»)."},{"t":"p","h":"Акыл Карачач. «Серектин сыр сандыгындагы» «Мүчө топтомун» кара, ал \\/ – \\/! класста өтүлгөндөрдү эсиңе түшүрөт жана морфологиялык талдоону туура жүргүзүүгө жардам берет.."},{"t":"p","h":"18-көнүгүү. Оошмо мүчөлөрдү тап."},{"t":"p","h":"Азыркы кездеги жыландын уусунан жасалган дарылар кызыл жүгүрүктү, муун ооруларын, кептөөрдү айыктырууда пайдаланылат. Ал эми жыландын терисинен сумка, портфель, бут кийим ж.б. буюмдар жасалат. Кыргыз эли да жыланды ыйык деп, ага астейдил мамиле кылышкан. Жылан үйгө кирсе, ак чачып чыгарып коюшкан. Там-ташты, короо-сарайды байырлаган жыландарды ошол жердин ээси деп эч кимди тийгизбеген. Оболу, жыланды сактоого байланышкан укмуштай сонун жомокторду чыгарышкан. Ошонусу менен бала-бакырасына таалим-тарбия беришкен («Мугалимдер газетасы»)."},{"t":"p","h":"19-көнүгүү. Мүчөлөрдү өнүмдүү, аз өнүмдүү, сенек, ээрчиме, ээрчибес, туруктуу, оошмо, сыйлыгышма, сыйлыгыштырма түрлөрү боюнча талда."},{"t":"p","h":"Мал + чы + лар + га, камчы + ла + н + уу, кемир + чек, от + суз, кел + иш + ти, жуу + н, таш + ырка, жат + ырка п, алт + оо."},{"t":"p","h":"20-көнүгүү. Муну да 19-көнүгүүгө окшоштуруп талда."},{"t":"p","h":"Тиш + те+н+ди, сай + ма +л + оо + чу + лар, жибер + ил + ди, кулун + чак, кундуз + дай, кичи + рээк, жет + ее, кетмен + де + п."},{"t":"p","h":"21-көнүгүү. Уңгуга кандай мүчөлөр улангандыгын аныкта."},{"t":"p","h":"1. Кеште + ле, кеште + ле+н, кеште + т үү, кеште + лүү. 2. Жакшы + лык, жакшы + лык + туу, жакшы + – на, жакшы + на + кай, жакшы+р, жакшы трет, жакшы +р + т +уу, жакшы + 3. Тер + де, тер + де + т, тер + дик, тер + дик + чен, тер + д + өө, тер + чил."},{"t":"p","h":"22-кенугуу. Уңгуга кандай мүчөлөр уланганын аныкта."},{"t":"p","h":"1. Бир + ик, бир + дей, бир + дей + лик, бир + деме, бир + дик, бир + дик + түү + лүк, бир ер, бир + иг + иш, бир + иг+ иш + уу, бир + ик + тир, бир + ик + тир + үү, бир + ин + де т."},{"t":"p","h":"<span class=\"pg\" data-n=\"10\">10<\/span>д. Кооз + до, кооз + до + л, КООЗ + до + луу, кооз + до+н, кооз + д + 00, КООЗ + Д + от, кооз + + тур, кооз + до"},{"t":"p","h":"23-кенугуу. Ээрчиме мучелерду туру боюнча талда."},{"t":"p","h":"Топ + то + ш + кон + дор + го, уюм + да + ш + тыр + ыл + ган + дар + дан + сыз + дар + бы, мээнет + түү + нүн."},{"t":"p","h":"24-кенугуу. 23-кенугууге окшоштуруп иште."},{"t":"p","h":"Капа + лан + ба + са + ңыз + дар, уур + д + оо + чу +лук + ка, күдүк + те н+уш т Ту, ийил + чээк + тик + Тин, ИДирек + туу + лер + ден."},{"t":"p","h":"25-кенугуу. Удаалаш талдоо. Шарты: 1) оозеки талдоо; 2) бир сөздү бир гана окуучу талдайт; 3) партанын катары менен улам кийинки окуучу кийинки сөздү талдап кете берет."},{"t":"p","h":"1. Жип + тин. 2. Балык + ты. 8. Узун + дук. 4. Бүк + тө."},{"t":"p","h":"5. Түр + үп. 6. Туура + сы. 1. Бел + үү. 8. Тор + ду. 9. Бийик + тик. 10. Сап + тай. 11. Кырк + кан. 12. Жер + ге. 13. Сай + ыл."},{"t":"p","h":"14. Уч + у. 15. Байла + н. 16. Кез + дүү. 17. Кала + ган. 18. Арна + мак. 19. Кекилик + тер. 20. Тап + са. 21. Чап + ыш."},{"t":"p","h":"22. Кел + мейинче. 23. Студент + пиз. 24. Алма + ныкы. 25. Чыканак + тай. 26. Боз + омук. 27. Алыс + ыраак. 28. Карагай + луу. 29. Арча + лар. 80. Саят + чы."},{"t":"p","h":"Ул г у: -тин – уланды, ээрчиме, оошмо, жендеме муче."},{"t":"p","h":"7. Кер + ун+ ген. 8. Шилте т ген 9.Кал + 10. Үн + де + се. 11. Кез + ү + не. 12. Жул + ун + ду. 13. Жыг + ыл + мак. 14. Чурек + тер + у. 15. Туйгун + ум + ду. 16. Кон + дур + уп. 17. Кел + ген + де. 18. Шумкар + лар + ды. 19. Тунжур + уң + а. 20. Бүркүт + у + нөр. 21. Томого + су + нун. 22. Бат + Ууда + мын. 23. Кол + до + ту. 24. Шаш + тыр +а. 25. Уч + уш + мак. 26. Теб + иш + се. 27. Ат + чан + дар. 28. Же + дир + мекчи. 29. Шилте + се + низ. 30. Канат + туу + лар."}],"sub":[{"title":"1. жана мүчө боюнча талдоо","b":2}],"section":"УП КЛАСС","pages":[9,10]},{"title":"2. Сез туркуму боюнча талдоо","blocks":[{"t":"h3","h":"2. Сез туркуму боюнча талдоо"},{"t":"p","h":"Керегеч Маамыт. Бул талдоодо да «Серектин сыр сандыгындагы» «Сез туркумдеру» топтомун кара. Ал унутуп койгондорунду эсиңе салат."},{"t":"p","h":"<span class=\"pg\" data-n=\"11\">11<\/span>27-кенугуу. Төмөндөгү сөздөр кайсы сөз түркүмүнө кирерин аныкта. Жолой, аппак, он, кандай, энеси, уламдан-улам, жолукту, байбиче, эмне, кырк үч, бул, эски, келет, деди, келинибиз, ким, беш-бештен, түтүндүү, теменедей, жаңыча, силер, биздики, анын, терезелер, таң каракчысында, дайыма, колмо-кол, чакырып кел, келип кет, бара жатат, сонурка, мелт-калт, былч, кокуй, сонурка, жүдөңкү, бийигирээк, жээкке, асман, Кудай, аалам, миллион, баса, ботом, катыгүн, тра-тата, ме-ме, Ош, бырс, албетте, демек, бүдөмүк, ыйлап."},{"t":"p","h":"Үлгү: Жолой – зат атооч, энчилүү ат, суроосу – ким? атооч жөндөмөсүндө."},{"t":"p","h":"28-көнүгүү. Ар бир сөздү түркүмү боюнча топтоп жаз."},{"t":"p","h":"Чагым, көрдүң, айтмакчы, ким билет, бирок, же болбосо, гана, үчүн, соң, беш, суу, тамчы, жылуу, дарбаза, эч качан, биздики, сүйрөп, адам, келмек, эшик, жашыл, чымкый көк, таптаза, чөптүн, болду-болбоду, жетимиш, жазында, балача, кемпир-чал, ит-куш, отуз алты, ондон бир, муздак, жалгызсырады, күлмүндөп, жарк-журк, бытпылдык-бытпылдык, арийне, анткени, себеби, балким, таттуу, алмадай, каяша, күндөп-түндөп, дыйкан, сугаруу, фермер, кубулжумайынча, нак, өтө, ар кандай, табышмак, дары, аттин, тигил, өх, ошол, эй, кандай, быйыл, баары."},{"t":"p","h":"29-көнүгүү. Сөз тизмегиндеги сөздөрдү түркүмү боюнча аныкта. Күзгө чейин, бир чыны, жылуу суу, текчеге койду, эч ким билбейт, аттарды сугар, тез келгиле, өгүздөй кышылдап, ачууланган менен, так ошол, куду өзү, төркү үй, адам баласы, англисче сүйлөгөн, бүт чогулсун, алма менен өрүк, тамактан соң, китеп жөнүндө, Анаркан го, куду көпөлөктөй, миндей көчөт, кыркка жакын жигит, мен дагы, жол менен, ит менен мышык, барды өңдөнөт, утат шекилдүү, жарк этти, пай-пай-пай, шуу этти, жолуң болгур, как чокуга, өңчөй иштермандар, алтын жана күмүш, андан кийин, жакшы окуйт, жакшы уста."},{"t":"p","h":"30-кенугуу. Текши талда. Уңгу, мүчө жана сөз түркүмү боюнча. Көзүнө бүт жер бети өрт каптап келаткандай кыпкызыл болуп көрүндү, эрбейген чөптөр да, таштар да, өзүнүн кара түктүү, сөөктүү колдору да кыпкызыл болуп өрттөндү, окко чаап баратышкан атчандар кыпкызыл оттун ичинде кутулуп чыгар жолу жок чыңырып туйлап, эч аргасыз жалбырттап күйүп жүрүшкөндөй көрүндү. Анын көзүн кан чырмап баратты... (Т. Касымбеков)."},{"t":"v","l":["зат","Үл г ү: көз+ү+нө.","<span class=\"pg\" data-n=\"12\">12<\/span>31-көнүгүү. Текши талда.Унгу, мүчө жана сөз түркүмү боюнча.","Танкы Чолпон батканда,","Өзөндөн ак шамал жүрүп ыркырап,","Суудан кара буу чыгып буркурап,","Асмандан жылдызы качып дыркырап,","Токойдо гүлдөр гүл бурап,","Бутакта булбул ыр курап,","Шыбакта торгой чулдурап,","Жылгадан алты миң булак шылдырап,","Жарашкансын, аккан суу!..","Жеңижок","32-кенугуу. Текши талда.Уңгу, мүчө жана сөз түркүмү боюнча.","1. Эрте көктөмдөгү жаш шыбактын кыйгыл-кермек жыты"]},{"t":"p","h":"аралашкан илеп бу тараптан урганда, Әдигейдин жүрөгү түрсөтүрс каккан: көптөн сагынган кыйырсыз кайран казак талаасы! Туулган жер ай! 2. Караңгы түндө деңиз бети күңүрт жылт-жулт шоола бо-"},{"t":"v","l":["луп, шарпылдаган толкундардын доошу угулуп, Эдигейи менен","учурашкансып жатты. Тан алдындагы кетик ай сур булуттун","колтугунан булаңгыр көрүнүп төбөдө.","_ Амансыңбы, Аралым! – деп өзүнчө күбүрөдү Эдигей","(Ч.Айтматов)."]}],"sub":[],"section":"УП КЛАСС","pages":[11,12]},{"title":"§ 3. СИНТАКСИСТИК ТАЛДОО","blocks":[{"t":"h3","h":"§ 3. СИНТАКСИСТИК ТАЛДОО"},{"t":"p","h":"1. Сөз айкашы боюнча талдоо"},{"t":"h3","h":"Көрөгөч Маамыт эскертет. Окуу китебинин этегиндеги «Серектин"},{"t":"v","l":["сыр сандыгынан» «Сөз айкашы» топтомун окуп, өзүңдүн билимиңди","толукта.","","тып айтып бер."]},{"t":"p","h":"Жылдыздын жарыгы. Асманды тиктеди. Көк темир. Жыбыраган жылдыздар. Желбегей жамынып. Даана көрдү. Әшикке чыгып. Булуң-бурчун карады. Куш кармалган. Лакыйта тойгузду. Түнкүсүн акактап. Тоодактын эти. Чоң базар. Алуучусу көп. Сатуучусу да көп. Кардарлар жайнайт. Мал өтпөйт."},{"t":"p","h":"Ошол күнү. Үйдү көздөй жөнөдү. Талаага чейин барды."},{"t":"p","h":"ү: Жылдыздын – багыныңкы түгөй, жарыгы – багындыруучу түгөй."},{"t":"p","h":"<span class=\"pg\" data-n=\"13\">13<\/span>34-кенугуу. Этиштик жана атоочтук сөз айкаштарын ажыратып бер."},{"t":"p","h":"Жаш баатырлар. Жайык төр. Кыркалай көчтү. Курдаштары менен келди. Эшик ачылды. Муздак суу. Шытыраган жаан. Илимге арналат. Өлкөнү гүлдөтөбүз. Бийик тоолуу. Жүздөй киши. Бороон ышкырды. Өнөрлүү жигит. Саймачы кыз. Кар күрөдүк. Сенден шамдагай. Суудай таза. Адамдын ар бири. Эч бир коркпо. Бизден алыс. Жакшыга жалынсан. Аталаштан алтоо."},{"t":"p","h":"Үл г ү: Жаш баатырлар – атоочтук сөз айкашы."},{"t":"p","h":"35-көнүгүү. Сүйлөмдөн ээрчишүү, башкаруу, ыкташуу, таандык байланыштарды тап."},{"t":"p","h":"Карымшак Боомдун капчыгайында жалгыз келатат. Жалгыз жолоочуга жол арбымак өзүнчө бир балакет. Кеч күзгө чейин мөңгүсү эрибеген бийик тоолордун ала моюн кыл чокулары алыскы бийиктен бүлбүл көрүнөт (С. Рыскулов)."},{"t":"p","h":"Үл г ү: Карымшак Боомдун капчыгайында жалгыз келатат. Бул сүйлөмдө төрт сөз айкашы бар."},{"t":"v","l":["1. Карымшак келатат – ээрчишүү.","2. Боомдун капчыгайында – таандык байланыш.","3. Жалгыз келатат – ыкташуу.","4. Капчыгайында келатат – башкаруу."]},{"t":"p","h":"36-кенугуу. Көчүрүп жаз. Ээрчишуу, башкаруу, ыкташуу, таандык байланыштар боюнча талда."},{"t":"p","h":"Өзөндүн оң жаккы өйүзүндөгү калың токойдун арасынан чыккан бүркүттүн алсыз үнүн Карымшактын кулагы чалды. Улам токтой калып тыңшайт. Бат-бат шаңшыйт."},{"t":"p","h":"(С. Рыскулов). ыкт."},{"t":"img","src":"data:image/webp;base64,UklGRuAEAABXRUJQVlA4INQEAACQKgCdASqAAmwAPrVUpk0nKKQiqvIIeRAWiWkJDlZDqBfrCCCJX8QaIMLFjMdlU/cJmzTIvkY9AsXyMegWKwlgQSMPkY9AsXyMegWL5GPQLF8iqjIXAJQqM/GQWpJ+Nbe9SUllp/iSlBiUlrVOqvPH7B+6r6EpoWKRgp0dnRj2iijSQBZwUwfTs7cuZAh8NQ8nyx7ocGPnjkjwX9S/VG1JfjTDvJRzABhHlS7CwkhPBSbLPfTcPDNTkWI+zNbO5IACTPMj9q1Kgi4apMPRgi0VBhUFYyi1+6MKkHRS+gmJ/sCwjldfE0z22dZwXTv5FglKsiquHA3isQrIc7UyHMUc+YSwIxezH4i85mcGlApq6EdWtCRFvCOnNjN/AeVzNYBaY95TRQp+3TDy6uMUeLrn+MvYqGXqeXPjIuaTNKLxDgmKvJYmzqI74qFnJGlh+nU00tTGYADiwWBo4gQAAP74qxrvkaQ6mprEJSnV9qNjQbyoibpv6csKs9ISeiLpU0BeplyrTuw6v8FxxjGolIpDaUbqYBHPKhx1aO6QoRplTHs+LoGgPiL2FeDnepjFMbh0qOXaNCosEBGCteDyhnQyohdzlA/7YhZy9oaBvKLbUeaUFKGI/9UwPPG6W/txed0i16+UPshuL9lSS9z+ujI85q0GvNdyodE6rE6MFOH6wAD1z0uMYdcQTyANHps961Bd3PA/tZiLFOWVTreg4RkvpY7C1hAdqlsTVUJgAf/QXGp5KfT6DXHCJkYwtdIKkKjC+dPwxae6W0tCNRqV1uvWLXn72ObGnsXP4u28OB7WITc5iLB70dUGpZL6qH3F2hteKmnAiUaOEOPCe2M2CwSyGTob3LkipcmAeyj6VSM0BJ82yawLfFZrcXvJ7qq9lskeUuCDJ63mtiyV1Fajuu2e60/aYoUnf/5OwLUQKOVvmG3Jz/JgF1VlWmVnnKRBaibVTcBeYpBHZEmaBr4yUuGk22VIN4UhC9MtFAEyAREoc/na4yceY9m/rUSnkXOoc8P0ZJSPzxT7TRuZnYN5ZK7POJee+uYvO86VNPIDS+Wjr2JFezas02QlQdZKvmSYM9nvLkwWN25AcOOIaOPp9C7RK4ZY6DI/CLRYGK+8kG6EXDIUY2XG1FhCtXFwxD82PEBHsvXGAeMXSLGL9IA/jVDGGO8jKYI5GdBh9ne29MGraFypG1hSp4NPT7bbZY4tcKbUwEB9uYcmcQzWc7OH7+aq+Y/yqcvUCfCcRznJUmW+PMFzIl3Kx+cbKiQN/S9KkClUIw4e1G9it1deIHztnuy0u0q+MIzF ңет, ... (өзүң таап жаз)."},{"t":"p","h":"4. Таандык байланыш: анын себеби, ... (өзүң тап)."}],"sub":[{"title":"Көрөгөч Маамыт эскертет. Окуу китебинин этегиндеги «Серектин","b":2}],"section":"УП КЛАСС","pages":[13,14]},{"title":"2. Сүйлөм мүчөлөрү боюнча талдоо","blocks":[{"t":"h3","h":"2. Сүйлөм мүчөлөрү боюнча талдоо"},{"t":"p","h":"Акыл Карачач эскертет. Талдоо мезгилинде төмөнкү учурларды эске ал."},{"t":"p","h":"Г. Жөнөкөй сүйлөмдүн талданышы."},{"t":"p","h":"1. Асманда аппак булуттар _ каалгыйт (талданды)."},{"t":"p","h":"2.Түн (бир тутумдуу сүйлөм, сүйлөм мүчөлөрү боюнча талданбайт)."},{"t":"p","h":"3. Амантай менен Нурсултан шаардан келди (менен, жана, бирок, себеби, анткени, ал эми ж. б. байламталар талданбайт)."},{"t":"p","h":"1. Күн бүркөлгөндүктөн, жамгыр жаады (эки сүйлөм бар)."},{"t":"p","h":"2. Жылдызбек:"},{"t":"p","h":"– Силер биздин үйгө кайрыла кеткиле, – деди."},{"t":"p","h":"(«Жылдызбек деди» өзүнчө, «Силер биздин үйгө кайрыла кеткиле» өзүнчө талданат)."},{"t":"p","h":"Ш. Киринди, каратма, сырдык сөздөр сүйлөм мүчөсү эмес, бирок жөнөкөй жана татаал сүйлөмдүн экөөнө тең кошулуп айтыла берет. Ошол себептүү каратма сөздүү же киринди сөздүү, же сырдык сөздүү сүйлөм деп талданат."},{"t":"p","h":"М.: Бали, биз жеңип чыктык (бул – сырдык сөздүү сүйлөм)."},{"t":"p","h":"<span class=\"pg\" data-n=\"15\">15<\/span>39-көнүгүү. Төмөнкү сүйлөмдөрдү түрү боюнча талда."},{"t":"p","h":"Эртең менен батыштан катуу шамал болду. Чаң учту. Дарактар шуулдады. Анан дароо күн бүркөлдү. Күн күркүрөдү да, дыбырап жамгыр жаай баштады. Тоого жөнөдүм. Менимче, мындай учурда жаш балдарга жолго чыгууга болбойт. Өтмө катар суу болот. Бирок бир тайга учкаша минишкен эки бала өргө бет алып баратат. Жыланбаш. Көйнөкчөн. Жамгыр менен иши жок. Каткырып күлүшөт. Ырдап коюшат. Ысыксуукка көнгөн да. Мен аларга жете бардым."},{"t":"v","l":["– Саламатсызбы! – деди экөө жарыша.","– Саламатчылык, окшошуп кайда барасыңар?","– Чоң атамдыкына.","– Әмнеге?","– Короо-сарайын тазалашабыз."]},{"t":"p","h":"1..Жайылма сүйлөм, анткени баш жана айкындооч мүчөлөрдөн түзүлдү."},{"t":"p","h":"2. Әки тутумдуу сүйлөм, анткени ээ менен баяндооч катышты."},{"t":"p","h":"3. Жөнөкөй сүйлөм, анткени бир эле сүйлөмдөн турат."},{"t":"p","h":"4. Жай сүйлөм, анткени жайынча баяндоо иретинде айтылды."},{"t":"p","h":"40-көнүгүү. Баш мүчөлөрдү тап."},{"t":"h3","h":"КУМ-ТӨР АЛТЫН КЕНИ"},{"t":"p","h":"Кум-Төр алтын кени деңиз деңгээлинен 3900—4150 метр бийиктикте жайгашкан. Изилдөө иштери 1978-1989-жылдарга чейин жүргүзүлгөн. 1998-жылдын 1-сентябрында Өкмөт Кум- Төрдү иштетүү боюнча Кыргызстан менен канадалык «Камеко» компаниясынын ортосундагы генералдык келишимге кол койгон. 1996-жылы июлда Кум-Төрдөн алгачкы руда алынды."},{"t":"p","h":"Кум-Төр алтын запасы боюнча дүйнөдөгү алдыңкы он алтын кенинин катарына кирет. Геологиялык запасы – 514 тонна. Азыр жаңы ачылган фабрикада суткасына 150 тонна кесек кум иштетилет жана андан алтын бөлүнүп алынат. 19 жыл аралыгында Кыргызстан бул кенден 800 миллион доллар пайда табат."},{"t":"p","h":"«Ата журт» гезити Үлг ү: Әмне жайгашкан? Кум-Төр алтын кени – ээ. Кум-Төр алтын кени эмне болгон? Жайгашкан – баяндооч."},{"t":"p","h":"<span class=\"pg\" data-n=\"16\">16<\/span>41-көнүгүү. Көчүрүп жазып, ээнин асты тын эки сыз."}],"sub":[{"title":"КУМ-ТӨР АЛТЫН КЕНИ","b":20}],"section":"УП КЛАСС","pages":[15,16]},{"title":"КАЛЕНДАРЛАР","blocks":[{"t":"h3","h":"КАЛЕНДАРЛАР"},{"t":"p","h":"ейинки үч миң жылдын аралыгында Биздин доорго ч имдүү байыркы кытай к"},{"t":"v","l":["өзгөчө так жана ишен р да календарь","ралган. Байыркы түрктө 9500 жылда би","араб календары боюнча","айырма пайда болот."]},{"t":"p","h":"ыштар христиан дининдеги калк к й„ так жана ишенимдүү календарь бар. Дүйнөдөгү эң жөнөкөй, кайсы? Ал – биз ры. Бул календарды – календары бизге 1918- гана суткага айырмаланат."},{"t":"p","h":"жылдын февраль айында киргизилген."},{"t":"p","h":"элине өлбөс-өчпөс образдарды жаратуу менен, өзүн-өзү ачып, өзүнө-өзү эстелик тургузуп кетти. В. Шекспирдин «Ромео менен Жульетта», «Отелло» спектаклдеринде Жульетта ме- нен Дездемонанын, ч. Айтматовдун «Кызыл жоолук жал- жалым», «Жаныбарым Гүлсарысында» Асел менен Бүбүжан- дын, Ш. Садыбакасовдун «Ак боз атында» Эркеайымдын, К. Мамбетакуновдун «Омар Хайямдын махабатында» Әль- пинин, Ф. Гарсиа Лорканын «Бернард Альбанын үйү» дра- масында Омелиянын, М. Байжиевдин «Байыркы жомогун- да» Зулайканын образдарын жаратты. Анда адамды өзүнө йкырдуу күч бар болчу. Ал таланттын тазалыгы, улуулугу эле. Айрыкча анын аты аталганда, аны Ак Мөөр менен Уркуянын элесинде эстешет, кыргыздын бул белгилүү дай жаркын элес берген. кыздарына Таттыбүбү Афродита Мындай улуу адамдардын талантына таазим этип, ыйык тутуу – атуулдук парзыбыз. Б.Чотуров"},{"t":"h3","h":"<span class=\"pg\" data-n=\"17\">17<\/span>104 ЖАШТАГЫ МАТАЗИМ УУЛУ ОМАРБЕК КАРЫЯНЫН ЭСКЕРУУСУ"},{"t":"p","h":"Мен Курманжан датканы көргөмүн. Датка кара торураак, чапжаак, мурду пасыраак, өңү-түсү кунигирээк, маңдайы жарык, көздөрү оттой жанган, сүйкүмдүү, бою узун, алибеттүү, жүрүш-турушу да эркекче, акылдуу, мээримдүү, боорукер, кайрымдуу, меймандос, анан да токтоо, сабырдуу, эрктүү, чечкиндүү, кайраттуу, сүрдүү жана каардуу аял эле. Сүйлөп жатканда шашпай, үнүн көтөрбөй сүйлөөчү. Чоң атам Әлтойду Алымбек датка менен Кескен-Жарда жашап турганда таанышышкан экен. Чоң атам эки жолу чоң той бергенде да, Алымбек, Курманжан даткалар тойдун аягына чейин кызмат кылышкан экен. Чоң атам өлгөндөн кийин да, алар менен каттоо үзүлбөптүр. Курманжан датка менен үч-төрт жыл жайлоого бирге чыгып калдык. Датка чоң энем Бапик менен абдан ынак эле. Алар дөңсөө жерге – шиберге шырдак же көлдөлөң салып алышып, ар дайым сүйлөшүп отуруучу. Ары-бери бирге басышып, ойлорун жашырышпай тең бөлүшчү. Датка Каргаша айлында жашап турганда да, катташчыбыз. Ал айылга чоң энем менен мен да көп жолу барып, даткага учурашып, сүйлөшүп, сыйын көрүп келип жүрдүк."},{"t":"p","h":"– Балдарымдын көбү ар кайсы жерде даргага асылып кетти, өлтүрүлдү, камалды. Әми балдарым колдорундагы бийликти кармап кала алышпайт. Кедей-кембагалдарды, жетим-жесирлерди арачалап калыш керек эле. Антиш эми менин колуман келбейт. Аттиң ай, арман күн! Азыр 40-50 жаш курагым болсо, эл башкарышка жарайт элем. Мурункудан башкача башкарар элем, – деп Курманжан датканын айткан арманын уккамын. «Жаштык жарчысы» гезити 44-кенугуу. Талда. 1, П бөлүктөн баш мүчөлөрдү, П, Ш бөлүктөн аныктоочту, ГУ, У бөлүктөн толуктооч менен бышыктоочту тап."},{"t":"h3","h":"КЫМЫЗ КҮЧҮҢӨ КҮЧ КОШОТ"},{"t":"p","h":"т Кымызда адам баласынын организми учун бардык зарыл болгон аш болумдуу заттар бар. Анын курамында тирүү организмдин өсүшүнө зарыл болгон заттар, майлар, белоктор, углеводдор, минералдык заттар ж.б. арбын. Ал сүт майынын, белоктун жана башка минералдык заттардын сапаттуулугу жана адамга жагымдуулугу жагынан эненин сүтүнө жакындашып кетет. Кымызды Й ичкен адам карылыкка да оңой менен жендирбейт."},{"t":"img","src":"data:image/webp;base64,UklGRhJRAABXRUJQVlA4IAZRAAAQxgGdASqAAsEDPrVYpk8nJKQtInK5qaAWiWlubzV4l9v20XrVw/s70I29LnnQP1bPNJP7/7Pma+u/831IcKjJLiYsxqtqD9QwCnYD610Cfrf5TvPTaxfsHoq/9X7gPPOyT6/63DUFiN+6/QvU9/Rf+frcVy+Gf+2ZN+Wjno9XzdTb6eg75u8HvXg59Omv/ieG/9e/4PsH+UL/9eaX+H//Xref/0VAkg+vxbgWWKFuBVWKFuYACSFJugZ92H+fygf3DqBCAInUliP6md9+mZlA+E+8G0Q6F/Y0m3E7uU1f1UiQ6dKQyEFGP8UsuzFSyGxQsneQ9PNXmadyCZ6tARpqZ9Obq6kIxlKIn8GyLMWk/vtoNPEf8kxux9nZ/cXaoN9lW7Uw4l0dtRoiF2OfMI0KMGeL49AE5oXU8JIqPWxCg8boE+jqy2+s4ygopINL6HBdhSX1ztm0NMsWDwnBvO0todYoW1tmCS7oIKJAMvzfz8EhTSEwQ6DqKStuK5XmQCjA/Mz4iPRVXULLqoanG8exjUaC5IE0uEgiqiYimKbe/m69X6replRySKTKyQTLFDZvXqKqnoh8hatfsjpbvwBzLwT50NihYxL3zUG812WF7uLSxZaJRC5e/1v9ccRIaaMW514orcM3Z/y9VqEyEvu1HO3qIXMC4Y5oIj9J7fIw9EGCjiPhx9YDb/Geh/u4xzDTnHfdNP0UKDGi6wH6uTN6eyXFaBG5pNIpisAy5fU1ohuhfeVfg9GlF60JnfSRE9V7W5oPo9IaCmoM/tg3/JrgNBI58T1ClIUTmKsBsnxp2ThVw8QmwWGZ3HiwqJPJACbd5vX+NfqXsw1KLTeWgv/oF/7/VwGxaDH5dt/FCcfoQ2Q6YjEquNR5/S8QSFrUlW2D/shraIsuZ7rNE36ofFhkBDFv5uWeIUHUM6TncrE13ZrIo6pwV+rIlh6LcJIN21+UzktBiXma1NwesA7Lbli1oC3troVUeIFUWFUMG25I8F3H6+HPStqx9MkC4/+WxFRh3P0 елсе, анда андан мурда","да, кийин да утур коюлат.","М.: Ал, албетте, эртең","сүйлөм |, ‚ [сүйлөм келет.","","3. Эгер КРС сүйлөмдүн аягына келсе, анда киринди сөздөн","мурда үтүр коюлат.","[ сүйлөм ], М.: Сен бардын, ырас.","","5. Сырдык сөздүн (СС) жазылышы","«КЫЯЛ» кештеси"]},{"t":"p","h":"М.: Бах, бали, баракелде, кокуй, катыгүн, ка-"},{"t":"v","l":["пырай, ботом, ай, кап, апей, эй, өх, ой, аттиңай,","аттиң, чиркин, чиркинай, пай-пай-пай, төх, ойбой,","жолуң болгур, көп жашагыр, кудай ур, айланайын,","мурдунду урайын, ура, алло, кыруу-кыруу, кош, чү,","чып, пө-пө, бар болунуз ж. 6."]},{"t":"p","h":"<span class=\"pg\" data-n=\"26\">26<\/span>Сырдык сөздөр төрт түрлүү жазылат."},{"t":"raw","h":"<h4 class=\"mk\">1 (сд! 8. [сүйлөм ], (сд), 4.<\/h4>"},{"t":"v","l":["М.: Ура! Биз жендик.","","М.: Бали, ырдап жибер.","","М.: Сен, катыгүн, ушундай белен?","","М.: Ал эмнен, кокуй.","","6. Каратма сөздүн (КС) жазылышы","«СУУ» кештеси","Каратма сөздөр төрт түрлүү жазылат.","","ге 1 (КО)!","","Әл (ко),","","[сүйлөм], (КС),","","4."]},{"t":"p","h":"М.: Кымбаттуу Алтынбек! Майрамың кут болсун. Жолдоштор! Ийри олтуруп, түз кеңешели."},{"t":"p","h":"туулган кунун менен куттук- М.: Кымбаттуу Гулжайнар, тайм. Балдар, ашарга тез келе калгыла."},{"t":"p","h":"М.: Әртең, апа,чогулуш- ка бара аласызбы? М.: Нандан алыңыз, жээн."},{"t":"h3","h":"САЛЫШТЫР"},{"t":"p","h":"1. Өмүркан, атты сугарып кой."},{"t":"p","h":"2. Өмүркан атты сугарып койду."},{"t":"p","h":"Бул эки сүйлөм окшошпу? Әгер айырмасы болсо, өзгөчөлүгүн айтып бер. Салыштыруунун жол-жобосу:"},{"t":"p","h":"1. Жогорку эки сүйлөмдү мааниси боюнча салыштыр."},{"t":"p","h":"2. Эки мисалды сүйлөм мүчөлөрү боюнча талда."},{"t":"p","h":"3. «Сабат санжырасы» боюнча талда."},{"t":"h3","h":"<span class=\"pg\" data-n=\"27\">27<\/span>ЖАЛПЫЛОО"},{"t":"p","h":"1. Ата, койго чөп салайынбы?"},{"t":"p","h":"Бул сүйлөмдө ата – каратма сөз. Ал эми бул ата деген каратма сөздүн ордуна төмөндөгү сөздү коюуга болот жана ал сөздөр каратма сөздүн милдетин аткарат. Алар: апа, эже, бөлө, курбум, уулум, энеке, чоң ата, аке, байке, жезде, кудагый, кудача, апче, эжеке, агай, курдаштар, Эсентур, Райымкан, Үсөнбек, Жаңыбай, Саркыт, Тууганбай, Ширин, Кубатбек, Кундуз ж.б."},{"t":"p","h":"М.: Энеке, койго чөп салайынбы? Калганын да ушинтип өзгөртсө болот."},{"t":"v","l":["2. Койго, ата, чөп салайынбы?","3. Койго чөп салайынбы, ата?"]},{"t":"p","h":"Оозеки иште. Ушул 2—-8-мисалды 1-сүйлөмгө окшоштуруп өзгөрт."},{"t":"p","h":"М.: Койго, апа, чөп салайынбы? Койго чөп салайынбы, апа. Калганы да ушундайча."},{"t":"h3","h":"КРС, СС, КС – үчөөндөгү окшоштуктар"},{"t":"p","h":"жана айырмачылыктар"},{"t":"p","h":"Ырас, бул үчөө оозеки сүйлөшүүдө жана жазууда өтө көп колдонулат. Аларды туура жаза алуу үчүн үчөөндөгү окшоштуктарды жана өзгөчөлүктөрдү ажырата билүү керек."},{"t":"h3","h":"ОКШОШТУКТАР"},{"t":"p","h":"1. КРС, СС, КС – үчөө тең сүйлөмдүн тутумунда турат, бирок ошого карабастан алар сүйлөм мүчөлөрү болуп эсептелбейт, анткени ээ, баяндооч, аныктооч, толуктооч, бышыктооч катары сүйлөмдө мүчөлүк милдет аткарбайт."},{"t":"p","h":"2. Үчөө тен сүйлөм мүчөлөрүнөн обочолонуп, алардан тыныш белгилери менен ажырымдалып турат."},{"t":"p","h":"3. Үтүрдүн коюлушу боюнча үчөөнүн тең эрежелери окшош. Әгер каратма сөз сүйлөмдүн башына келсе, андан кийин үтүр коюлат. Әгер каратма сөз сүйлөмдүн ортосуна келсе, өзүнөн мурда да, кийин да үтүр коюлат. Әгер каратма сөз сүйлөмдүн аягына келсе, анда өзүнөн мурда үтүр коюлат. Ушул «каратма сөз» дегендин ордуна киринди сөздү, же сырдык сөздү коюп, эреже чыгарып алуу жаңылыштык болбойт."},{"t":"p","h":"<span class=\"pg\" data-n=\"28\">28<\/span>4. Демек, ушундай окшоштуктардын негизинде киринди сөз, сырдык сөз жана каратма сөз грамматикалык жактан сүйлөмгө мүчө боло албаган сөздөрдүн тобун түзөт."},{"t":"h3","h":"АЙЫРМАЧЫЛЫКТАР"},{"t":"p","h":"1. Каратма сөз менен сырдык сөздүн жазуу эрежелери боюнча айырмачылыгы жок, бирок бул экөөнөн киринди сөз айырмаланат. Мисалы, КС менен СС сүйлөмдүн башына келгенде, айрым учурларда алардан кийин илеп белгиси коюлат."},{"t":"p","h":"М.: Ура! Биз жеңдик. Ал эми КРС сүйлөмдүн башына келгенде, андан кийин илеп белгиси коюлбайт."},{"t":"p","h":"2. КС менен ССтен КРС сүйлөмдүн мүчөсүнө айланып кетүү мүмкүнчүлүгү менен айырмаланат."},{"t":"p","h":"Мүмкүн, мен жаңылып жаткандырмын. Мында мүмкүн – КРС."},{"t":"p","h":"2. Менин жаңылышым мүмкүн. Мында мүмкүн киринди сөздүн касиетин жоготуп жиберди да, сүйлөм мүчөсүнө – баяндоочко айланып калды."},{"t":"h3","h":"7. Тел жана бөтөн сөздүн жазылышы"},{"t":"p","h":"«КЕРЕГЕ КӨЗ ЖАНА ТУМАР – 1» кештеси"},{"t":"p","h":"Бакай мындай деген: «Белунгенду беру жейт»."},{"t":"p","h":"%"},{"t":"v","l":["1.4.",":","","-ГИН","«Бөлүнгөндү бөрү","жейт», – деген Бакай."]},{"t":"h3","h":"Бакай: «Бөлүнгөндү"},{"t":"v","l":["беру жейт», – деген.","","«Белунгенду, – деген","беру жейт».","Бакай, —","","1. Белунгенду беру жей"]},{"t":"p","h":"-ги женунде тургандыгын Бакай айткан. -ги тууралуу 2. Бакай белунгенду беру жей тургандыгы женунде айткан экен."},{"t":"p","h":"3. Белунгенду беру жей тургандыгы тууралуу Бакай айткан."},{"t":"p","h":"<span class=\"pg\" data-n=\"29\">29<\/span>1. «Белунгенду беру жейт» деген ошол.. «Бөлүнгөндү бөрү жейт» деген тура."},{"t":"p","h":"Б;. «Бөлүнгөндү бөрү жейт» деген эмеспи."},{"t":"p","h":"4. «Бөлүнгөндү бөрү жейт» деген чын экен да."},{"t":"p","h":"5. «Бөлүнгөндү бөрү жейт» болуптур ж.б."},{"t":"p","h":") Элди белуп-жарып, биримдикти жок кылса, анда «бөлүнгөндү бөрү жейт» (Бакай)."},{"t":"h3","h":"ЖАЛПЫЛОО"},{"t":"p","h":"Мында Бөлүнгөндү бөрү жейт – бөтөн сөз (ал кээде цитата, тике сөз деп да аталат). Бакай мындай деген – төл сөз. Бул экөөнүн ашташа келиши түрдүүчө жазуу эрежелерин жаратат. Тыныш белгилерине бай. Жогоруда (7.1— 7.7-кештелерде) алардын негизги түрлөрү берилип, ар бири үлгү-мисалдар менен чечмеленди."},{"t":"p","h":"1. Жогорудагы төл жана бөтөн сөздүн жазылышынын 7 түрүн эң сонун билип ал, анткени бул – баарын эске салып туруучу үлгү, ошол эле учурда сабаттуу жазуунун алтын ачкычы."},{"t":"p","h":"2. Әл ичинде накыл кептер, даанышман нускалар, курч, таамай, учкул ойлор арбын. Аларды колдонууга туура келип калган учурда, албетте, ушул кештенин (7.1 – 7.7) мумкунчүлүгүнөн пайдалан."},{"t":"p","h":"3. Ушул окуу китебинде «Макал», «Санат сөз» топтомдору бар. Алар – сага издеп табылгыс эң сонун мисал. Ошолорду туура жазууда ушул эрежелер сага тикеден-тике кызмат кылат."},{"t":"p","h":"4. Дилбаянды катасыз жазышына итабар кол кабыш кылат."},{"t":"p","h":"Өз алдыңча иште. Әреже түз"},{"t":"p","h":"Т7.1-кеште боюнча: «Эгерде төл сөз бөтөн сөздөн мурда келсе, анда төл сөздөн кийин кош чекит коюлуп, бөтөн сөз баш тамга менен башталат жана тырмакчага алынат»."},{"t":"p","h":"1.2, Т.3, Т.4-кештелердин ар бирине жогоркуга окшоштуруп өзүнчө эреже түз. «Эгерде ... ‚анда...»."},{"t":"h3","h":"<span class=\"pg\" data-n=\"30\">30<\/span>КОШУМЧА ТҮШҮНҮК"},{"t":"p","h":"7Т.5-кеште – кыйыр сөз. Бөлүнгөндү бөрү жей тургандыгын Бакай айткан. Эми бул сүйлөмдүн тутумунда «Бөлүнгөндү бөрү жейт» деген өзүнчө баш мүчөлөрү бар (бөрү – ээси, жейт – баяндоочу, бөлүнгөндү – толуктооч) бөтөн сөз жок, себеби ал өзүнчө сүйлөмдүк касиетин жоюп, бөлүнгөндү бөрү жей тургандыгын – толуктоочко айланып кетти. Демек, ал бүтүн сүйлөмдүн бир гана мүчөсүнүн милдетин аткарып калды. Әми ага тырмакча, үтүрлүү сызыкча өндүү белгилердин кереги жок. (8.5-кеште да 7Т.5-кештеге окшош)."},{"t":"p","h":"7.6, Т.7Т-кештелерде бөтөн сөз сырткы турпатын өзгөртпөй сактап калды, ошол себептүү ал тырмакчага алынууда. Бирок бөтөн сөз төл сөз менен камыр-жумур болуп биригип кеткен, ошого жараша алардын чегин ажыраткан үтүрлүү сызыкча өңдүү белгилерди коюунун зарылдыгы жок."}],"sub":[{"title":"КРС, СС, КС – үчөөндөгү окшоштуктар","b":29},{"title":"ОКШОШТУКТАР","b":32},{"title":"АЙЫРМАЧЫЛЫКТАР","b":37},{"title":"7. Тел жана бөтөн сөздүн жазылышы","b":43},{"title":"Бакай: «Бөлүнгөндү","b":48},{"title":"КОШУМЧА ТҮШҮНҮК","b":66}],"section":"УП КЛАСС","pages":[25,30]},{"titl uq9fzdGwDesy4F14Dc3i2qye+ZP2SeQfDz6+4vX7haZ2IOzP6Uk+7/4TCgAA=","w":640,"ht":624},{"t":"p","h":"Төл жана бөтөн сөз менен диалог сөздөрдүн"},{"t":"h3","h":"жазылышындагы жалпылыктар"},{"t":"v","l":["7.1. Бакай мындай деген: «Бөлүнгөндү бөрү жейт».","Ушул сүйлөмдү мындайча жазууга да болот.","Бакай мындай деди:","– Бөлүнгөндү бөрү жейт.","8.1. Асел мындай деди:","– Алманы тез үзүп алалы.","Ушул сүйлөмдү мындайча жазууга да болот.","Асел мындай деген: «Алманы тез үзүп алалы»."]},{"t":"h3","h":"<span class=\"pg\" data-n=\"32\">32<\/span>ТАПШЫРМА"},{"t":"p","h":"7.2 менен 8.2ни, 7.3 менен 8.3ту, 7.4 менен 8.4ту, Т.5 менен 8.5ти жогорку жалпылыкта белгиленген улгуге окшоштуруп иште."},{"t":"h3","h":"КОРУТУНДУ"},{"t":"p","h":"Демек, жогорку жалпылыктарга таянып, төл жана бөтөн сөз менен диалог сөздөрдүн жазылышында тырмакча, тиренин коюлушу, абзацтан баштоо сыяктуу өзгөчөлүктөрүнө карабастан, экөөнүн табияты окшош. Ошол себептен экөө тең «Кереге көз жана тумар» кештелери менен белгиленди."},{"t":"h3","h":"9. Бир өңчөй мүчөлөрдүн жазылышы «АК КУУ» кештеси"},{"t":"p","h":"Бир өңчөй мүчөлөр байламта жана үтүр менен байланышат."},{"t":"v","l":["менен","БМ","","Амантай менен Жылдыз Суусамырга кетти."]},{"t":"h3","h":"жана"},{"t":"v","l":["9.2%","Е","(байламта)","","(байламта)","с","","Ата-энени жана улууну урматтоо керек."]},{"t":"raw","h":"<h4 class=\"mk\"><span class=\"pg\" data-n=\"33\">33<\/span>9.3. 9.4.<\/h4>"},{"t":"p","h":"(үтүр)"},{"t":"p","h":"Ак бантикчен кыз бийледи, ырдады."},{"t":"p","h":"(байламта + да да”;"},{"t":"p","h":"үтүр, байламта)"},{"t":"p","h":"Султан да, Ширин да келди."},{"t":"p","h":"9.5. 2 Е бирок (утур + байламта) Үй эски, бирок таза."},{"t":"p","h":"9.6. ‚ ары (байламта, үтүр + байламта)"},{"t":"p","h":"Арал ары кооз, ары малга жайлуу жер экен."},{"t":"v","l":["‚ же (байламта,","үтүр + байламта)"]},{"t":"p","h":"Ордодо же биз, же силер утушунар керек, ит жыгылыш жок."},{"t":"p","h":"<span class=\"pg\" data-n=\"34\">34<\/span>9.8. р жана (үтүр, байламта)"},{"t":"p","h":"Муктарканга, Аскарбекке жана Алыбекке жолугуп кел."},{"t":"p","h":"Бир өңчөй мүчөлөр, У класста окуганыңардай, бирдей суроого жооп берип, бирдей милдет аткарган сөздөрдөн түзүлөт. М.: Түндө тоодон Жапар менен Абды. келди."},{"t":"p","h":"Мында бир өңчөй мүчөлөр: Жапар, Абды. Әкөө тең ким? деген суроого жооп берет, ээлик милдетти аткарат. Менен деген бириктиргич байламта байланыштыргандыктан, араларына үтүр коюлган жок. Түндө тоодон Абыл, Райымберди, Өмүркан, Жапар, Ракман – баары машина менен келди. Бул сүйлөмдө «ким?» деген суроого жооп берип, жалаң ээлик милдет аткарышкан беш бир өңчөй мүчө бар. Бир өңчөй мүчөлөр кээде байламталар менен байданышса, кээде үтүр менен ажыратылат. Ошого жараша төмөндөгүдөй жазылышка ээ."},{"t":"p","h":"1. Бир өңчөй мүчөлөрдү менен, жана деген байламталар байланыштырган учурда, алардын араларына үтүр коюлбайт. Анткени бул байламталар өзүнөн мурунку жана кийинки бир өңчөй мүчөнүн экөөнө тең таандык («Ак куу» кештесин кара:"},{"t":"p","h":"9.1, 9.2)."},{"t":"p","h":"2. Бир енчей мучелердун арасы жалан утур менен да ажыратыла берет (9.3ту кара)."},{"t":"p","h":"3.Да байламтасы өзү байланыштырып турган әки бир өңчөй мүчөнүн мурункусуна таандык, ошол сэбептуу үтүр андан кийин коюлат (9.4тү кара)."},{"t":"p","h":"4. Эки бир өңчөй мүчөнү байланыштырган бирок, ары, же байламталары өзүнөн кийинки сөзгө таандык, ошондуктан үтүр алардан мурда коюлат (9.5, 9.6, 9.7ни кара)."},{"t":"p","h":"5. Ал эми да, ары, же байламталары бир өңчөй мүчөлөрдү байланыштырууда эки же андан ашык жолу кайталанышы мүмкүн. Ошондой учурда үтүр эки бир өнчөй мүчөнүн ортосуна (да байламтасынан кийин, ары, же байламталарынан мурда) коюлат. Да, ары, же байламталары эгер бир өңчөй мүчөлөрдүн ортосуна келбей калса, анда үтүр коюлбайт."},{"t":"p","h":"<span class=\"pg\" data-n=\"35\">35<\/span>М.: Султан да, Ширин да келди. Мында биринчи да эки бир өңчөй мүчөнү – Султан менен Ширинди байланыштырды, үтүр туура коюлду. Экинчи да байламтасынан кийин бир өңчөй мүчө жок, ошол себептен андан соң үтүр коюлбады. Ал эми Арал ары кооз, ары малга жайлуу жер экен деген сүйлөмдө биринчи ары эки бир өңчөй мүчөнүн ортосуна келген жок, экинчи ары эки бир өнчөй мүчөнүн ортосунда турат, ошондуктан биринчи ары үтүрсүз, экинчи арыга үтүр коюлду. Же байламтасы да ушуга окшош (9.7-ни кара)."}],"sub":[{"title":"Асел:","b":4},{"title":"КОРУТУНДУ","b":18},{"title":"9. Бир өңчөй мүчөлөрдүн жазылышы «АК КУУ» кештеси","b":20}],"section":"УП КЛАСС","pages":[31,35]},{"title":"10. Жалпылагыч сөз","blocks":[{"t":"h3","h":"10. Жалпылагыч сөз"},{"t":"p","h":"«КУМАЙЫК ЖАНА АК КУУ» кештеси"},{"t":"p","h":"Аларды баары: атасы, бала-чакасы тосуп алды."},{"t":"img","src":"data:image/webp;base64,UklGRngdAABXRUJQVlA4IGwdAADQzwCdASpMAuIBPrVaqk4nJbGmJNZJCjAWiWdu3tGONIY+/ydb7Ee/rI47o6gSAiu////7+MvZ/4Tz3HmISL8xPkgfTOic///TF/tiyNZRSA39kAG+1efjtmdRtbRpsZjOpRw+DMUUgN/ZDJi6O6dlntIXirU8+j5a4VnwNUlvrpAETkC1YxdqzwvLPAZbqrFOs0WqcgA39otX4Vno9RTskppF8StaglP1/bMhFEXZWsG2s5LeIu5qZpBa8c49u+UdD7KKQG/sim1Rj9Y8kEC4dZCm6x19xV6ZElRnHgNLNHBakanTJe4VKFS74dm4QPsokGD1QS9fsCgMskwXBvTL8pCqllnv6QWLHFlRWquPnKgVrR1C1IluAXD+IO3MWH6eM07LKrTq6I9c+WzFiyl3w7Vs07GNY33LZueJkmfe+pef8vnDJUdqPthLKuPa2hUu9xE9EbfrufO6MgA39kCH5ZmRZOSG4iNGPgW/6ChNtQnpq88W2UVLsD1L1TrsYac69V1b+x+OqU0hAe6MbRPEvTVmpu4KaCEtpkSJL42ylAYrvJyav0cjjljs8IAOBtVSps2EktE5RgO0B7y0EqWttbUOUL3vkTYCnWPUgN1qObkUw5YhUpAb+x/63irx7+42QDnOBidZQHrJRej/z+Cg96BDkWRjHTkIy1kWW2piBVSyiW9Hdz+ecyqaOs+aJ6d0HJZSmYmkjRlBU7r5BQD4H6pb6AVk0bpLOIUWNv7GzDfzT9o/1llcDGVGQTaRqYbHk+65/xxia5dCYnlz0HjmobWReOyayyqllElKd8PZPya09EbR5YY7MqIl10wMMo2F2pXe1pcCmf5KDDuXkK3Zzifd8RO3GoShUu+HZZUghmX5nhjCt7gt36Hxj7NYealdx6NHesHkMVYHJTTV00izoAOSgZDj/2oi1Pdptc+Aeaubu4H6pd8K6H2AlfYrt1zD8/N5ZKgT3ohtmmoAvGYcpS2dJj0IsNQx78c36uKFQ1+PjcG3/jmrJmgyyPffyfTDvKO1XJ2Ar9TsahdLer/7TjA75cyuyobGy3m5FexdSHdhQpHytXEK7b3SkX+aVt9ExcnLyiSSvOx85KgxYi8EX1lgwG8SuykZRFPQyr7aG20TzJ4LFBiXVpyHp1htDBuTk7V8pWsWEQs3vz6y89Z1fyyZQ2TALYVVpxHLQjGvVY5jQpAnn+ook2WjuD560vx0g+6R74IhJQny2yKV5lfrNbYTnUm7WKdaVhhtMZZG ласан, итине сөөк сал»."},{"t":"p","h":"50-көнүгүү. «Кереге көз жана тумар-2» кештеси боюнча төмөндөгү тартипте мисал түз: 8.4, 8.2, 8.3, 8.1, 8.6."},{"t":"p","h":"51-көнүгүү. Төмөнкү мисалдар «Кереге көз жана тумар —2» кештесинин кайсы туруне кире тургандыгын ыраста."},{"t":"p","h":"– Кун көз ачырбай жаап туруп алды, – деди Бакбуркан, – чабылган чеп чирип кетпесе экен."},{"t":"p","h":"Темиркул мындай деп айтты:"},{"t":"p","h":"– Картешкеден мол туптум алуу учун, жеектун таманына малдын чириген кыгын чуурута тектум."},{"t":"p","h":"– Быйыл, – деди Мырзакекул, – чигит жылдагыдан бир жарым ай мурда себилди, буйруса, пахтадан мол түшүм алабыз."},{"t":"p","h":"– Кыргызстанда мындан ары таш буласы өндүрүлө баштайт, – деди шаардык жаш жигит."},{"t":"v","l":["– Кайдан уктунуз?","– «Кыргыз Туусу» гезитинен окудум.","– Завод курулуптурбу?","– Ооба."]},{"t":"p","h":"52-көнүгүү. Адегенде «Ак куу» кештеси кайсы жазуу эрежесин кучагына аларын аныкта. Анан анын төмөнкү түрлөрүнө сүйлөм түз."},{"t":"p","h":"(эки сүйлөм)"},{"t":"p","h":"(эки сүйлөм)"},{"t":"p","h":"<span class=\"pg\" data-n=\"52\">52<\/span>‚ бирок (эки сүйлөм)"},{"t":"raw","h":"<h4 class=\"mk\">9.6. ары 5 9... ж е 9.8.<\/h4>"},{"t":"p","h":"‚ ары (эки суйлем)"},{"t":"p","h":"же (эки сүйлөм)"},{"t":"p","h":"жана (эки сүйлөм)"},{"t":"p","h":"53-кенугуу. «Кумайык жана ак куу» кештесинин ар бирине (10.1, 10.2) төрттөн сүйлөм түз."},{"t":"p","h":"54-кенугуу. Татаал сүйлөмдүн жазылышын канчалык билесиң? Өзүндү өзүң текшер."},{"t":"h3","h":"«Боз үй» кештеси боюнча"},{"t":"h3","h":"<span class=\"pg\" data-n=\"53\">53<\/span>«Ай жана боз үй» кештеси боюнча"},{"t":"p","h":"55-кенугуу. Төмөнкү тен байланыштагы татаал сүйлөмдөрдүн кайсы жазуу эрежелерине кирерин «Боз үй» кештеси боюнча аныкта."},{"t":"p","h":"1. Адилет адам азаттыкты жалпыга каалайт, ал эми адилетсиз жалгыз өзүнө каалайт. 2. Дүйнөнү акыл башкарат, бирок акыл күчкө таянат. 3. Ааламдын көркүн көз ачат, адамдын көөнүн сөз ачат. 4. Көзүм жокто мени жамандаган адам – менден корккон адам, көзүмчө мени мактаган адам – мени жек көргөн адам. 5. Тил топто сайрайт, булбул бакта сайрайт. 6. Он отузга берди, отуз Жалманбетке берди, Жалманбет жардан алыс ыргытып жиберди. 7. Жалбарып отурган Токон түндө түш көрүүгө мүмкүн эмес эле, анткени ал таң атканча кирпик ирмеген эмес. 8. Эртең менен төрт буттап басат, түштө эки буттап басат, кечинде үч буттап басат. 9. Бөдөнөнүн жатагын көр да, этине таарынба. 10. Мас киши адам эмес, анткени акылынан ажырап калат, адамды айбандан айырмалап турган акыл да (А. Иманов, «Кыргыз тили» китебинен). 11. Бул сүрөттүн эч кандай ыксыз жайы деле жок, же болбосо ага «көз тийип кетет» дегендей ал ашкан сонун деле эмес (Ч.Айтматов). Тарсылдатып атылган мылтыктын үнү жардам бербеди, же караңгыда болжоп аткан мылтык огу эч кимге тийбеди (К. Жантөшев)."},{"t":"p","h":"Үл г ү: Адилет адам азаттыкты жалпыга каалайт, ал эми адилетсиз жалгыз өзүнө каалайт. Бул «Боз үй» кештесинин 11.3-эрежесине таандык."},{"t":"p","h":"56-көнүгүү. «Ай жана боз үй» кештеси боюнча төмөнкү багынынкы байланыштагы татаал сүйлөмдөрдүн жазылыш эрежелерин тап."},{"t":"p","h":"1. Бай канчалык байыган сайын, алар ошончолук битир болот деген чын тура. 2. Энелик сезим адамда кандай болсо, канаттууда да так ошондой. 3. Той-тамаша кайсы жерде болсо, Ыманбай Сараласы менен ошол жерде. 4. Ал кетер менен, Уркуя Бактыбаевди сөзгө алды. 5. Кыбырата желип өткөн желге эгин термелсе, тырс этип дан түшүп жатканы байкалат. 6. Калп эле сырты жымындаганы менен, түлкү ичинен аны жейин деп турду. 7. Мисирейген кара жер эч нерсени сезбегенсип, томсоргон бойдон кала берди. 8. Ак <span class=\"pg\" data-n=\"54\">54<\/span>жүзүндө бир тал кылы жок болгондуктан, бетиндеги бырыштар даана көрүндү. 9. Алар туюп калбасын деп, эч кимге айтпадык."},{"t":"p","h":"ү: Төө канча болсо, жүк ошончо. Мында Төө канча болсо деген өлчөмдү туюнткан багыныңкы сүйлөм катышты. Бул кештенин 11.15-эрежеси боюнча жазылды."},{"t":"h3","h":"СЫНАК"},{"t":"p","h":"1.Сынак белеттер аркылуу жүргүзүлөт."},{"t":"p","h":"2. Ар бир белет боюнча адегенде өзүңө өзүң, анан бириңе бириң сынак жүргүзө аласың."},{"t":"p","h":"3. Сынактын негизинде өзүңө өзүң жана бириңе бириң баа берсең болот."},{"t":"h3","h":"Биринчи белет"},{"t":"p","h":"«Шумкар» кештесин билесиңби? Анда канча эреже бар? Ар бирине кандай мисалдар келтирилген?"},{"t":"v","l":["ПУ,","12.6,"]},{"t":"h3","h":"Экинчи белет"},{"t":"p","h":"«Жагалмай жана чабалекей» кештеси боюнча эмне билесин?"},{"t":"p","h":"13.3"},{"t":"h3","h":"Үчүнчү белет"},{"t":"v","l":["«Төө» кештеси кандай бөлүктөрдөн турат?","УГ","15.82 5:92"]},{"t":"h3","h":"Тертунчу белет"},{"t":"p","h":"«Таш бака» кештеси эмнени билгизет?"},{"t":"h3","h":"Бешинчи белет"},{"t":"v","l":["«Кун» кештеси боюнча тапшырма.","17.1 боюнча 5 сүйлөм жаз.","17.2 боюнча 5 сүйлөм жаз."]},{"t":"h3","h":"Алтынчы белет"},{"t":"p","h":"«Кыргоол» кештеси боюнча 25 сөз жаз."},{"t":"h3","h":"<span class=\"pg\" data-n=\"55\">55<\/span>Жетинчи белет"},{"t":"p","h":"«Аркар мүйүз» кештесинин негизинде араб саны менен айкалышкан 10, рим саны менен айкалышкан 10 сөз жаз."},{"t":"h3","h":"Сегизинчи белет"},{"t":"p","h":"«Үлүл жана мончок» кештесине мисалдар түз."},{"t":"h3","h":"Тогузунчу белет"},{"t":"p","h":"«Көөкөр-1» кештеси боюнча сөздүк туз."},{"t":"p","h":"1.2-ге 5 сөз, 1.3-гө 5 сөз, 1.4-гө 5 сөз, 1.5-ге 5 сөз, 1.6-га 5 сөз, 1.7-ге 5 сөз."},{"t":"h3","h":"Онунчу белет"},{"t":"p","h":"«Көөкөр-2» (түп жагы гүлдү элестеткени) кештеси боюнча мисал келтир."},{"t":"p","h":"2.1-ге 5 мисал, 2.2-ге 5 мисал, 2.3-ге 5 мисал, 2.6-га 5 мисал, 2.7-ге 5 мисал."},{"t":"h3","h":"Он биринчи белет"},{"t":"p","h":"«Бүркүт» кештеси боюнча 25 сөз жаз."},{"t":"h3","h":"Он экинчи белет"},{"t":"p","h":"«Умай эне» кештесинин үч эрежесин айтып бер жана ар бир эрежеге үчтөн сүйлөм түз."},{"t":"h3","h":"Он үчүнчү белет"},{"t":"p","h":"«Кыял» кештесине мисал келтир."},{"t":"p","h":"2-эрежеге үч, 3-эрежеге үч, 4-эрежеге үч сүйлөм туз."},{"t":"h3","h":"Он төртүнчү белет"},{"t":"p","h":"«Суу» кештесине мисал келтир. 1-эрежеге үч, 2-эрежеге уч, 3-эрежеге үч, 4-эрежеге үч сүйлөм түз."},{"t":"h3","h":"Он бешинчи белет"},{"t":"p","h":"«Ак куу» кештеси боюнча төмөнкүлөрдү аныкта:"},{"t":"p","h":"1. Бир өңчөй мүчөлөрдүн арасына кандай учурда үтүр коюлбайт. Мисал менен далилде."},{"t":"p","h":"2. Бир өңчөй мүчөлөр кандай учурда жалан интонация (үтүр) менен байланышат? Мисал келтир."},{"t":"p","h":"<span class=\"pg\" data-n=\"56\">56<\/span>3. Бир өңчөй мүчөлөрдүн арасына кандай учурда байламта менен үтүр кабаттала келет? Мисал келтир."},{"t":"p","h":"4. Бир өңчөй мүчөлөрдү байланыштырган кайсы байламталардан кийин үтүр коюлат? Мисал келтир."},{"t":"p","h":"5. Бир өңчөй мүчөлөрдү байланыштырган кайсы байламталардан мурда үтүр коюлат? Мисал келтир."},{"t":"p","h":"6. Ары, да, же байламталары эки же андан ашык кайталанбаса, эмне үчүн үтүр коюлбайт?"}],"sub":[{"title":"«Боз үй» кештеси боюнча","b":23},{"title":"Биринчи белет","b":35},{"title":"Экинчи белет","b":38},{"title":"Үчүнчү белет","b":41},{"title":"Тертунчу белет","b":43},{"title":"Бешинчи белет","b":45},{"title":"Алтынчы белет","b":47},{"title":"Жетинчи белет","b":49},{"title":"Сегизинчи белет","b":51},{"title":"Тогузунчу белет","b":53},{"title":"Онунчу белет","b":56},{"title":"Он биринчи белет","b":59},{"title":"Он экинчи белет","b":61},{"title":"Он үчүнчү белет","b":63},{"title":"Он төртүнчү белет","b":66},{"title":"Он бешинчи белет","b":68}],"section":"УП КЛАСС","pages":[51,56]},{"title":"ТАЛДАП МАШЫГУУ","blocks":[{"t":"h3","h":"ТАЛДАП МАШЫГУУ"},{"t":"p","h":"Кандай гана текст болбосун, алардын тулкунда ондогон жазуу эрежелери кездешет. Албетте, биринде көп, экинчисинде аз. Окуучу үчүн аларды көрө билүү – милдет. Канчалык көрө билсең, ошончолук катасыз жазасың. Маселен, жатжазуу жазып жатканда, «тигил сөз тигиндей, бул сөз мындай эреже менен жазылат» деп билип турасың. Же болбосо сүйлөмдүн туура жазылышын купуя сезесиң. Сабаттуу жазасың. «Сабат санжырасы» топтомун толук билүү сени ушундай ишке тушуктурат. Талдап машыгуу сага тексттин турпатын көрө билүүгө, анын тулкундагы жазылыш эрежелерин баамдоого, катасыз жазууга жол көрсөтөт."},{"t":"p","h":"52-көнүгүү. Оозеки талдоонун үлгүсү боюнча карап чык."},{"t":"h3","h":"НОБЕЛЬ СЫЙЛЫГЫ"},{"t":"p","h":"Бул – жыл сайын берилүүчү эл аралык сыйлык. Ал 1888 – 1896-жылдардын аралыгында жашаган швед инженери, химик, ойлоп табуучу жана өнөр жай ээси Альфред Нобель тарабынан негизделген. Нобель сыйлыгы 1901-жылдан баштап физика, химия, физиология, медицина жана адабият жаатындагы мыкты эмгек авторлоруна, тынчтыкты чыңдоого зор салым кошкондорго берилет. Ал 1978-жылга чейин 840 адамга ыйгарылган. Нобель сыйлыгына татыктуу болгон адамга А. Нобелдин сүрөтү бар алтын медаль, диплом жана 30-70 мин доллар тапшырылат. Бул сыйлык өтө баалуу ийгилик жаратышкан М. Склодовская-Кюри (1903, 1911), Л. Полинг (1954, 1962) жана Ж. Бардинге (1956, 1972) эки мертебе берилген. Нобель сыйлыгынын лауреаттарынын арасында В. Рентген, А. Эйнштейн, И. Жолио-Кюри, И.П.Павлов, Р. Тагор, Б. Шоу, Э. Хемингуэй, П. Неруда, М. Шолохов ж. б. улуу адамдар бар."},{"t":"p","h":"«Кыргыз совет энциклопедиясы»"},{"t":"h3","h":"<span class=\"pg\" data-n=\"57\">57<\/span>Оозеки талдоонун үлгүсү. 1-сүйлөмдө бир созулма үндүү"},{"t":"p","h":"бар, 17.1-кештенин негизинде бул деген сөздөн кийин сызыкча коюлду. 2-сүйлөмдө бир энчилүү ат, төрт бир өңчөй мүчө, бир иреттик сан, ичкертүү белгиси катышкан эки сөз бар. 3-суйлемде бир энчилүү ат, бир иреттик сан, жети бир өңчөй мүчө, созулма үндүү катышкан эки, я тамгасы катышкан үч сөз бар. 4-сүйлөмдө бир иреттик сан, 5-суйлемде эки энчилүү ат, үч бир өңчөй мүчө, ичкертүү белгиси катышкан эки сөз, бир созулма үндүү, 6-сүйлөмдө эки созулма үндүү, үч энчилүү ат, бир я, бир ю тамгасы, 7-сүйлөмдө он энчилүү ат, тогуз бир өңчөй мүчө, бир созулма үндүү, бир ичкертүү белгиси, -тт катышкан бир сөз, бир ю тамгасы бар."},{"t":"v","l":["Жыйынтыктаганда:","1) бир өңчөй мүчөлөр – 28 (1-орунда)","2) аттар – 17 (2-орунда)","3) созулма үндүүлөр – 7 (8-орунда)","4) ичкертүү белгиси – 6 (4-орунда)","50 я, ю тамгалары – 6 (5-орунда)","6) иреттик сан – 8 (6-орунда)","7) -тт – 1 (7-орунда)"]},{"t":"p","h":"Демек, бул текстте 7 жазуу эрежесине ылайык келген 60тан ашык сөз бар, ошонун ичинде эң көбү – бир өңчөй мүчөлөр."},{"t":"p","h":"58-кенугуу. Оозеки талдоонун үлгүсүнө окшоштуруп иште."},{"t":"h3","h":"НИЯЗАЛЫ"},{"t":"p","h":"Ниязалы Борош уулу (1856—1941) – комузчу, жомокчу, ырчы. Ал Аксы аймагындагы Кичи-Ак-Жол кыштагында туулган. «Кара өзгөй», «Кер толгоо», «Сары барпы», «Короо күзөтүү», «Өттү, кетти балалык» ж.б. күүлөрдү чыгарган. Ниязалыдан Коргол, Шекербектер таалим алган."},{"t":"p","h":"«Кыргыз тарыхы» энциклопедиялык сөздүгү 59-кенугуу. Муну да жогоркудай иште."},{"t":"h3","h":"ЭШМАНБЕТ"},{"t":"p","h":"Эшманбет Байсеит уулу (1867-1926) – төкмө ырчы. Талас өрөөнүндөгү Кырк-Казык кыштагында туулган. Он беш жашынан ырдай баштаган. Ал Кетмен-Төбөгө барып, ал жерде көп жыл турган. Эшманбет – Токтогулдун эң жакшы шакирти. Анын «Токтогул менен Эшманбеттин эшен-калпаларга <span class=\"pg\" data-n=\"58\">58<\/span>карата ырдаганы», «Папы калпа», «Ак туяк» ж. б. алымсабак ырлары белгилүү. Эшманбеттин Жеңижок, Жаңыбай, Курман, Найманбай, Алтынай, Нурмолдо, Чонду, Барпы, Калык менен айтышкан ар кыл мазмундагы айтыштары бар."},{"t":"p","h":"«Кыргыз тарыхы» энциклопедиялык сөздүгү"},{"t":"p","h":"60-көнүгүү. Муну да мурунку көнүгүүлөргө окшоштуруп иште."}],"sub":[{"title":"НОБЕЛЬ СЫЙЛЫГЫ","b":3},{"title":"Оозеки талдоонун үлгүсү. 1-сүйлөмдө бир созулма үндүү","b":6},{"title":"НИЯЗАЛЫ","b":11},{"title":"ЭШМАНБЕТ","b":14}],"section":"УП КЛАСС","pages":[57,58]},{"title":"КӨЗҮМ ЖЕТПЕЙТ","blocks":[{"t":"h3","h":"КӨЗҮМ ЖЕТПЕЙТ"},{"t":"p","h":"Диогенден бирөө:"},{"t":"p","h":"– Сен жашаган дүйнө аңтарылып кетсе, эмне кылар элең? – деп сураганда, ал:"},{"t":"p","h":"– Дүйнөнүн менден мурда аңтарылып кетерине көзүм жетпейт, – деп жооп бериптир."},{"t":"h3","h":"КИМИСИ АКЫЛДУУ"},{"t":"p","h":"Бир философтон:"},{"t":"p","h":"– Кандай адам акылдуу? – деп сураганда, ал:"},{"t":"p","h":"– Колдон келген ишке умтулган адам акылдуу! – деп жооп бериптир."},{"t":"p","h":"«Залкар ойлор» китеби"},{"t":"p","h":"61-көнүгүү. Муну да жогоркуларга окшоштуруп иште."},{"t":"h3","h":"МАКАЛДАР"},{"t":"p","h":"«Жакшы, – деген нуска сөздүү карыя, – сөзү менен күлдүрөт, назы менен күйдүрөт, мээрими менен сүйдүрөт». «Жакшы кыз – жакадагы кундуз, жакшы жигит – көктөгү жылдыз», – деген энекем. Мугалим окуучуларына мындай насаат айткан: «Жакшылыкка жакшылык – ар кишинин иши, жамандыкка жамандык – кем кишинин иши, жакшылыкка жамандык – көр кишинин иши, жамандыкка жакшылык -— эр кишинин иши»."},{"t":"p","h":"62-көнүгүү. Бул да мурункулардай эле иштелет."},{"t":"h3","h":"ТЕРМЕ"},{"t":"v","l":["Канатынды кур күүлөп,","Камгакча желге учпагын.","Бүгүн берип карызга,","Әртең тап деп кыспагын.","<span class=\"pg\" data-n=\"59\">59<\/span>Өзгөгө барып сын такпай,","Өз жумушуң толукта.","Кадырлашкан кишиндин","Калп айтып көөнүн оорутпа.","Осмонкул","","68-көнүгүү. Бул да жогоркудай иштелет."]},{"t":"p","h":"Базыл терең ойго чөмүлө, түнөрө үңкүйүп, кандайдыр мен укпаган мундуу обонго салды. Комуздун көөдөнү боздогон каймалдын көмөкөйүндөй күнгүр чалып, чыйрак кыл баш бармактын уунда шыңгыр какты. Мукам ыр кандай кишини жолдо баратса, тык токтотуп, алда кайда белгисиз түпкүргө кыялын жетелеп, термелтип, башын төмөн ийдиргидей. Ырга, күйгөнгө караганда солуктаган ыйга ыкташ, чучук сыздаткан өкүнүчкө жакын. Бул кайрымдан баштатан кабардар болушса да, мындай так, мындай найын кыл ыргагын угушпаган көрүнөт, зайыбы да, балдары да, жада калса, Садыр да, токтогон суудай мелтиреп отуруп укту (Т. Касымбеков)."}],"sub":[{"title":"КИМИСИ АКЫЛДУУ","b":4},{"title":"МАКАЛДАР","b":10},{"title":"ТЕРМЕ","b":13}],"section":"УП КЛАСС","pages":[59,59]},{"title":"§ 6. ЖАТ ЖАЗУУ","blocks":[{"t":"h3","h":"§ 6. ЖАТ ЖАЗУУ"},{"t":"p","h":"Акыл Карачач. «Сабат санжырасы» топтомуна кирген жазуу эрежелеринен канчалык майнап чыкты, эмнени иш жүзүндө билесиң, баары жат жазуудан көрүнөт. Жат жазуу – сыналуу майданы. Төмөндөгү жат жазуулар Кемчонтойдуку. Ырас, Кемчонтой катасыз жазууга жан үрөп далалат кылды. Ошентсе да андан кеткен каталар арбын. Ошолорду түзөтүп, катадан арылтып жазуу сенин милдетиң."},{"t":"p","h":"Чыпалак. Эгер мен башымды оорутуп отурбай эле, башка бирөөнүн катадан арылтканын көчүрүп алсам, эмне болот?"},{"t":"p","h":"Акыл Карачач. Буюм, мал уурдалат – муну жакшы билесиң. Ал эми бирөөнүн катадан арылтып жазганын көчүрүп алганың да уурулук. Өзүң билесиң, уурулуктан көрө жалкоолук жакшы. Бирок мындай накыл эсиңдедир: «Кечмеликти кечпейлик, кечмеликти кечкен соң, кечеликпи, кечпейликпи дешпейлик». А сен кечмеликтин ортосундасың. Бир жагынан – таманыңдан таш өтсө, экинчи жагынан – күүлдөп-шаркыраган суу кулагыңды тундурат, чертилген тамчы жүзүңө чачырайт. Эмне, жүрөгү жоктук кылып, кайра артыңа тартасыңбы? Жок, чегинүүгө болбойт: «Тобокелчил тоо бузат, кыбыраган кыр ашат»."},{"t":"h3","h":"<span class=\"pg\" data-n=\"60\">60<\/span>Чыпалак. Болуптур, «билим ийне менен кудук казгандай» экени"},{"t":"p","h":"чындык. «Мээнет кылсаң, татканың таттуу болот». «Саргара жортсоң, кызара бөртөсүң». Айталы, Кемчонтойдун кол жазмаларында төмөндөгүдөй сөздөр жазылган, аны кантип оңдоо керек?"},{"t":"h3","h":"АКСАК ТЕМИР"},{"t":"p","h":"Аксак Темир (1336-1405) – темируйлер мамлекетин негиздөөчү барлас уруусунан чыккан кол башчы өзү негистеген мамлекеттин эмири. Ал 1889 жана 1391 жылдарда алтын ордонун ханы токтомушту талкалаган. 1393 жылы багдады Месопотамияны 1398—1399 жылдарда индиянын түндүк бөлүгүн 1401 жылы сириянын бир кыйла бөлүгүн элеген. Байтактысы самаркан шаарында болгон. Кытайга баратып, 1405- жылы 18-февралда отрар шарында каза болгон."},{"t":"p","h":"Акыл Карачач. Албетте, билсең, жарасы жеңил. Бирок мунун колдон келбей турган эч нерсеси жок. Мисалы, «темирди» «Темир» деп жазуунун кыйынчылыгы барбы?"},{"t":"p","h":"Жок! Темир – адамга энчиленип коюлган ат, ошол себептен ал баш тамга менен башталып жазылат ж.б. Эми тексттин катадан арылтылган түрүнө көз тигип көр. Так ушундай катасыз жазуу керек."},{"t":"h3","h":"АКСАК ТЕМИР"},{"t":"p","h":"Аксак Темир (1336-1405) – Темируйлер мамлекетин негиздөөчү, барлас уруусунан чыккан кол башчы, өзү негиздегең мамлекеттин эмири. Ал 1389- жана 1391-жылдарда Алтын Ордонун ханы Токтомушту талкалаган. 1398-жылы Багдадды, Месопотамияны, 1398—1399-жылдарда Индиянын түндүк бөлүгүн, 1401-жылы Сириянын бир кыйла бөлүгүн ээлеген. Байтактысы Самаркан шаарында болгон. Кытайга баратып, 1405-жылы 18-февралда Отрар шаарында каза болгон."},{"t":"h3","h":"Чыпалак. Туура, катаны көрө билүү жана андан арылтып көчүрүү —"},{"t":"p","h":"сабаттуулуктун белгиси. «Изденүү – ийгиликтин жолу», – деген бир акылман. Дагы бирөө: «Кетенчиктеп отуруп да, чокуга чыгууга болот», – дептир. Анысы кандай, алдыга умтулган пенде нечендеген чокуларга чыкпайбы."},{"t":"h3","h":"Акыл Карачач. Анда, калемиңди ал да, ишке кириш. Бет алдыңда"},{"t":"p","h":"Кемчонтойдун жат жазуулары турат."},{"t":"h3","h":"<span class=\"pg\" data-n=\"61\">61<\/span>Биринчи жат жазуу"},{"t":"p","h":"Мен жакында жайкы теятырдан спартак жеңилбеген жете тарзан селсаяк кинопилимдерин гөрдүм. Телепестибал болду, анда гүлнур сатылганова күтүү деген ырды ырдады, г.тойгонбаева милийсанын капитаны деген ырды эң сонун ырдады. Ыбырай тумановдун тулган күнүнө карата бос салкын жеңиш жаш тилек деген күлөрдү радиодон уктум. Китепканада Чынгыс Айтматовдун гүлсарат, кылым карытар бир күн деңиз бойлой жорткон Аладөбөт биринчи мугалим деген китептери бар экен. Шотанын жолборс терисин жамынган батыр поемасы мага жакты. Үйгө келип аалам сырдуу дүйнө асаба кыргыс руху гезиттерине көс жүгүртүм. Кечинде дырам теятырдан жаңыл мырзаны гөрдүк."},{"t":"p","h":"Экинчи жат жазуу Азармандан безерман, адабий тил, агайынтууган, азып тозуп, айран калуу, ак жаан, акыл эс, ала шалаа, албадалба, ак калпак, ак чөлмөк, ала бакан, базар учар, балабото, балтыр эт, балык жон, бетмебет, бир жарым, дамбыр таш, дүпө дүп жай жапсар, бир түп арча, жекжаат, илик жилик, ит оору, илкип калкып."},{"t":"p","h":"Үчүнчү жат жазуу Казан аштуу, казы карта, кайданжайдан, кадыр түн, күн сайын, камыржумур, келе жатат, кебете кепшир, кызыл көйнөк, килем килче, кийим кечек, кир самын, колаяк, короо жай, көркөм адабият, көйнөк көнчөк, кыргыз тили, куулук шумдук, күрүлдөп шарылдап, кээ бирөө, кетмен чабуу, кыл кыбыр, кырк чилтен, кыймыл аракет, кылоо кылоо."},{"t":"p","h":"Төртүнчү жат жазуу Сабака, стоматолого, пароходор, кантай, бараты, самолотор, мамысыз, келбесин, аптобусуз, Бишкеке, жээке, жалкан, талкан, чырака, укун, металлурга, йодуу, велосипеден, жатоо, кети, суюлту, космонавтар, автоматуу, хирурга, Санкт- Петербурга, Нью-Йорко, Ноокатан, шоколада, карагатуу, бир атык, оазисиз, кетпесин."},{"t":"p","h":"Бешинчи жат жазуу Суйумбе, таарымба, жуунган, күштүү, ушту, ишенгени, ойгонгондой, жуунган, Тургумбу, билимбейт, Дуйшембек, <span class=\"pg\" data-n=\"62\">62<\/span>Асамбек, баргаммын, болгоммун, жашыргаммын, качаңкы, түңкүсүн, муруңку, кешти, Тынштыкбек, кагассыз, комуссуз, туссуз, эссиз, сысса, уссун, кессин, даңга, жонго, сумбайт, ойломмоюнча."},{"t":"h3","h":"Алтынчы жат жазуу"},{"t":"p","h":"Тикирээт, мыёоологон, боёоо, жойойун, коейун, аеоо, тыюуу, айайлык, кичирээт, кекирейет, Бекейев, тийешелүү, чойоке, тийет, бойомо, жойулду, дайардык, кийет, Эвропа, сыйактанат, кыйанаттык, уйуктуу, уюулгуду, телпейет, чойоюун, жаюууда."},{"t":"h3","h":"Жетинчи жат жазуу КОЖОМКУЛДУН ТАШЫ"},{"t":"p","h":"Кыргыз элинин сыймыгы Каба уулу Кожомкул балбандын (1888—1955) 47 жаш курагындагы бою 1 метир 97 сантиметир салмагы 164 килого жеткен, 52 өлчөмдөгү өтүк кийген. Орустун балбандары И.Поддубный, И.Заикинден да зор болгон. Казак элинин атактуу балбаны Кажы Мукан Кожомкулдун көкүрөгүнөн келген. Кожомкул бабабыз 22 жашында сусамыр өрөнүндөгү арамза деген жердеги бийиктиги 1 метр 60 сантиметр, жондугу 1 метр 89 сантиметир келген ташты (салмагы 1 тоннага жакын) жүз кадам жерге көтөрүп барып жерге күч менен уруп киргизген. Эл аны Кожомкулдун ташы дешет. Мындай таштар бөйрөк, кеңсуу, жоожүрөк жайлоолорунда кетментөбөдө да бар. Чүйдөн сусамырга баратканда аты баспай калып аны төөашуудан өзү көтөрүп ашкан. Атасы Каба балбан киши болгон, ал эми энекеси Алмадай да эр сайышка түшкөн. Кожомкул күрөштө да, эңиште да өмүр бойу эч кимге алдырган эмес."},{"t":"p","h":"Бирок ушунча зор күчкө эгедер болгон бабабыз бир да жолу мактанган эмес экен."},{"t":"p","h":"«Кыргыз совет энциклопедиясы»"},{"t":"h3","h":"Сегизинчи жат жазуу КУЛАН ЧААР АРГЫМАК"},{"t":"p","h":"Домбу дайыма кол алдына ууру алып жүрчү. Бир түндө Сарыбайдын семирип турган тору кашка атын урдатып алган болчу. Кыл арканды айабай бороктотуп кайнатырып туруп ысык боюнча атын мойнунан соорусуна чейин чырматып жиберген. Аркан тийген жерлери кашкайып күйүп тору кашка <span class=\"pg\" data-n=\"63\">63<\/span>чыңырып кишенеп тизелеп жыгылып так түйүлүп туйлап өлө жаздап араң чыдайт да муздаган соң арканды алып таштап өзүн жиптей катырып суутуп кайра баканда күйгөн жерлери жыдып түшөт бир кезде ордуна көгүш ак жүн кайра чыгып ат көз көрүнөө тору кашка эмес, кулан чаар аргымак болуп чыга келет. Ошол бойдон Домбу бий бир жанга байкатпай, түнкүсүн гана сыйрытпаса күндүзү үстүнөн жеңип кымкап үздүрбөй бактырып суутуруп мына эми чоң мааракеге алып чыккан эле."},{"t":"p","h":"Чын эле те чете бир чабандес бала кымкап үртүк жабылган аты нары бери жай бастырып туруптур. Камыш кулагы үртүктүн көкүлдүгү ачыла түшсө мандайынан тумарча кашкасы жарк көрүнө калат. Куйругу карлыгачтын куйругундай болуп эки ача түйүлгөн. Күлүктүн көзү сүзүлүп үргүлөгөнсүп кетип кайра куш сыяктуу акырын селт этип ойгонуп жерге жукпай жепжеңил басып турду. Кандай ат болсо да куп табына келген кези окшоду."},{"t":"p","h":"Т. Касымбеков"},{"t":"p","h":"Тогузунчу жат жазуу"}],"sub":[{"title":"Чыпалак. Болуптур, «билим ийне менен кудук казгандай» экени","b":4},{"title":"АКСАК ТЕМИР","b":6},{"title":"АКСАК ТЕМИР","b":10},{"title":"Чыпалак. Туура, катаны көрө билүү жана андан арылтып көчүрүү —","b":12},{"title":"Акыл Карачач. Анда, калемиңди ал да, ишке кириш. Бет алдыңда","b":14},{"title":"Биринчи жат жазуу","b":16},{"title":"Алтынчы жат жазуу","b":22},{"title":"Жетинчи жат жазуу КОЖОМКУЛДУН ТАШЫ","b":24},{"title":"Сегизинчи жат жазуу КУЛАН ЧААР АРГЫМАК","b":28}],"section":"УП КЛАСС","pages":[60,63]},{"title":"ЭЛЕСТЕР ЖӨНҮНДӨГҮ ИЛИМ","blocks":[{"t":"h3","h":"ЭЛЕСТЕР ЖӨНҮНДӨГҮ ИЛИМ"},{"t":"p","h":"Биздин дордун өтө таңгаларлык ачылыштарынын бири голографияны XX кылымдын керемети деп эң тура эсептешет. Голография (грекчеден которгондо – толук жазуу) – бул жарык толкундарын нерселердин үстүнө кою жардамы менен алардын көлөмдүү түстүү сүрөтүн алуу ыкмасы. Голограммадагы нерсенин сүрөтү ушунчалык дана жана дал өсүндөй сүрөтөлгөндүктөн, бакочу аны материалдуу сезилип турган нерсе катары кабыл алат. Аргасыздан ага жакындагысы кармалап көргүсү келип кетет. Голографиялык сүрөтү дана көрүгө болот, бирок сезүгө болбойт. Голограммадан биз материалдуу нерсенин өзүн эмес анын «арбагын» көрөбүз. Ошондуктан голографияны кээде образду арбактар жөнүндөгү илим дешет. Дүйнө жүзүнүн эң мыкты музейлеринен кайталангыс искуство чыгармаларын азыркы адам өз үйүндө отуруп көрүгө мүмкүнчүлүктөрү бар. Бул азырынча жападан жалгыс мүмкүнчүлүктү бизге атактуу илимпоз Россия илимдер академиясынын мүчө-корреспонденти Лениндик сыймыктын ээси Юрий Денисюк ачкан ыкма менен атайын голографиялык пластинкаларга жазылган сүрөт голографиясы берет."},{"t":"p","h":"«Эркин тоо» гезити"},{"t":"h3","h":"<span class=\"pg\" data-n=\"64\">64<\/span>Онунчу жат жазуу ЛОБНОР ӘЛИ"},{"t":"p","h":"Лобнор – Жаңыл Мырса эпосунда айтылган жер. Ал кытайдагы Уйгур автоном районунда жайгашкан. «Лобнор» деген ат негизинен атактуу Лобнор көлүнүн аталышынан койулган. 1946 жылга дейре Көнчү ооданы деп аталган. Лобнор ооданы – Таклимакан кумундагы бир каухар. Мындагы жашаган эл көптөгөн көптөгөн уру жана уруктардан турат. Алардын арасында аз сандагы кыргыз тукуму да бар. Лобнор эли өтө эмгекчил батыр шамдагай жана мерген келишет. Лобнордун эркектери жакасыс чапан, айалдары тик жакалу көбөлү узун чапан кийишет. Айалдардын чапанынын алды жагына каңгүрө топчу ак седеп шуру сөлкөбөй жана мончок тагылат. Әркектери ак калпак кийишет. Лобнор элинин калпактарынын тарыхы өтө узак. 1981-жылы Лобнор ооданындагы байыркы көрүстөндөн бир мүрсө казылып текшерилген. Мүрсөгө кыздын сөгү койулган. Сөк шалчага оролуп башына кийис калпак кийгисилген. Баш жагына будай салынган бир себет койулган. Бул мүрсөгө 6412 жыл болгон деп жыйынтык чыгарылган. ‚«Әркин Тоо» гезити"},{"t":"h3","h":"Он биринчи жат жазуу ЧОКМОРОВДУН ҮЛҮЛҮ"},{"t":"p","h":"Чынында, Сүймөнкул абаны билбеген кыргыз барбы. Союзда Оскар – сыйлыгын беш жолу жеңип алган жападан жалгыз актер... Акындын сыртаны эмне жылдыздуу поэзиясын таберик калтырып жүрүп кеткен маркум Жолон Мамытов Сүкөмдүн портретин сөз менен ташка чегип койуптур. «Әлестелип дүйнөгө бүт таркады, кыргыз өңү Чокморовдун өңүндөй». Акындан ашырып айтыш кыйын го!"},{"t":"p","h":"..Иш бөлмөсүндө отурдук. Толгон сүрөт. Дубалда илингени канча. Көбү жерде биринин аркасынан бири шыкаалап, бизди карап турушат."},{"t":"p","h":"Кетеримде Сүкөм китеп текчесинде турган ташбаканын жону түспөл эки чоң үлүлдүн бирин мага сунду: Тыңшап көрчү». Кулагымдын түбүнөн деңиз шарпылдады. Деңиздин шоокуму! Үлүлдү кулагымдан албай сурадым. «Кайсыл деңиз». «Инди океаны. Жегинде жүрсөк, бир карыган балыкчы белек кылган эле. Мунусунан таза угулат». Алыста-алыста жердин аркы четинде мелмилдеген океанга чөгүп бараткан кызыл күндү элестетип а сүкөм жээк кыдырып көрүнгөнгө үлүл <span class=\"pg\" data-n=\"65\">65<\/span>таберик кылган балыкчысы өзүнчө... аны Хемингуэйдин өлөрман балыкчысына окшотуп колумдагы то текенин мүйүзүндөй үлүлдүн кайсыл бир жылдары океандын жашыл түбүндө сырдуу дүйнөдө түнөгөнүн тегерегинен супура боор араа тиш акулалар түркүн түс балыктарды кууп каршы терши сүзгөнүн анын касиеттүү үлүл кайсыл бир күнү толкундардын эркининен козголуп жек издеп күн жеген калак шилеп булчундары таштай каткан алиги балыкчыга кабылганын, ал табылгасын даңазалуу киноактерго тарту кылганын билди болду бекен..."},{"t":"p","h":"А. Матисаков Он экинчи жат жазуу"}],"sub":[{"title":"Онунчу жат жазуу ЛОБНОР ӘЛИ","b":3},{"title":"Он биринчи жат жазуу ЧОКМОРОВДУН ҮЛҮЛҮ","b":5}],"section":"УП КЛАСС","pages":[64,65]},{"title":"БҮРГӨ БААТЫРДЫН ТУУСУ","blocks":[{"t":"h3","h":"БҮРГӨ БААТЫРДЫН ТУУСУ"},{"t":"p","h":"Кыргыз санжыраларында Атаке Бердике Эсенгул Садыр Кубат бий Ажыбек даткалар менен катар айтылып жүргөн ХУШ – ХЇХ кылымдарда жашап өткөн кыргыздын элдик батыры чачылган уруларды бириктирген эл башчысы Бүргө батырдын Туусу бар. Аны бүгүнкү күнгө сактап жеткирген – Саты Чалыке уулу."},{"t":"p","h":"Бүктөсө бир учка толбогон жазып жиберсе кулач жетпеген далай жылдар атадан балага өтүп сакталып кылым карыткан касиеттүү Туу!"},{"t":"p","h":"Туунун өңү – жердиги кызыл, бетине сары ала оюулар салынган. Ортосунда төрт чарчы 0,45 сантиметир агы бар. Туунун узундугу 1,85 метир туурасы 1,35 метир. Учтарына үкүнүн канатары, көз мончоктор тагылган."},{"t":"p","h":"Ушул Тууну көкөлөтүп, «Каратал!» деп уран чакырып Бүргө батырлар жого каршы кирген. Солто менен Сарбагыштын чатагында бөдө кан төгүлөрдө, калыстыка Бүргө батыр аттанып барып, тирешкен эки урунун ортосуна ушул Тууну сайып отуруп алып, кыргынды токтоткон. Ушул Тууну көкөлөтүп көтөрүп Кокондон каптаган сарбаздарды сүргөн. Качан Кокон ордосунан атайын жиберилген тыңчыдан Бүргө батыр бөдө мерт болгондо жалпы кыргыз казак анын сөгүн коердо, ушул Туу ошондо бир ийилген."},{"t":"p","h":"«Талас турмушу» гезити Он үчүнчү жат жазуу"}],"sub":[],"section":"УП КЛАСС","pages":[65,65]},{"title":"1. АР КАЛААГА ҮЙ САЛ","blocks":[{"t":"h3","h":"1. АР КАЛААГА ҮЙ САЛ"},{"t":"p","h":"Мындай бир аңыз бар. Бир чал жарык дүйнө менен коштошуп жатып, баласына ар бир калага үй сал деп осуят калтырыптыр. <span class=\"pg\" data-n=\"66\">66<\/span>Атасы өлгөндөн кийин анын улу осуятын аткарууга киришет. Баардык байлыгын ар калага үй салуга жумшайт. Акырында жардыланып кайырчы болуп эл аралап калат. Ошентип жүргөндө бир акылман карыядан атам ушинти эле, анын айтканын аткарам деп минтип кайырчы болуп калдым. Бул эмнеси деп сурайт. Анда чал балам сен атандын осуятын туура эмес түшүнгөн экенсиң. Ар калага үй сал дегени – ар калада досуң болсун дегени. Досундун үйү сенин үйүң дейт."},{"t":"h3","h":"2. ЖАКШЫЛЫК КЫЛ"},{"t":"p","h":"Бала кезде асан деген досум бар эле. Күн сайын эң кеминде бир адамга жакшылык кылалык деп экөөбүз максат кылганбыз. Жакшылык кылу үчүн кеде атайылап адам издечүбүс. Көчөөгө чыгып адашып жүргөн адамдар болсо барчу жерине жеткирип койобуз. Базарга барып бирөөнүн жүктөрүн көтөрүшөбүз. Ошо жакшылыктын аркасында адам болдук. М. Шаханов"},{"t":"h3","h":"Он төртүнчү жат жазуу ЫРДА, САРЫ ЧЫМЧЫК"},{"t":"p","h":"Кичинекейимен ыр менен келатам. Жаныбызда зыйнат деген энем бар эле. Ал э-эй, сары чымчык, ырда-а. Ырдап кой, сарала чымчык дечү. Эшигинин алдында уй байланган бир жыгач коро бар эле. Ошол коронун үстүнө чыгып, ырдай берчүмүн."},{"t":"p","h":"Театр деген – театр: бир жагы кызык бир жагы жомок бир жагы турмуш бир жагы азап тозок. Бизде артистин бир көргөнүн хан, бир көргөнүн ит көрөт дешет. Операда бир партияны 1-2-жыл даярдайт. Көздөгөнүңө жетсең – сенден бактылу киши жок. Тарткан азап тозогундун бары унутулат. Болот Миңжылкиев сахнада Петр Їни аткарган күнү куду Петрдун өзү болчу. Мен Манаста өзүмү Канайым, Айчүрөк операсында Калыйман, Аршин мал аланда Гүлчахра, Бойдоктордо Ширин, Аста секин, колуктуда Зиядадай сезчимүн. Бирок кээ бирөлөр «театр, театр» деп өмүрүн берип, бир күн эле караса же үй же баласы ... жок. Әки бакыт бир келбейт экен да. Мен турмуш жолумду карап кудайга тобо келтирем. Турмушка эч кандай наразычылыгым жок."},{"t":"p","h":"Ролду так аткаруу – професионалдулук маданият. Жөнөкөй көрүчүлөргө жагуу же аны күлдүрүү үчүн текстке сөз кошуп бурмало – ролдун оюндун деңгелин ылдыйлатып жиберет. Мыкты артист жөнөкөй көрүчүнүн деңгелине түшпөй, кайра таланты аркылуу анын сезимин өстүрөт."},{"t":"p","h":"Д.Жалгасынова"},{"t":"p","h":"<span class=\"pg\" data-n=\"67\">67<\/span>Он бешинчи жат жазуу"}],"sub":[{"title":"2. ЖАКШЫЛЫК КЫЛ","b":2},{"title":"Он төртүнчү жат жазуу ЫРДА, САРЫ ЧЫМЧЫК","b":4}],"section":"УП КЛАСС","pages":[66,67]},{"title":"ШАБДАН БААТЫР","blocks":[{"t":"h3","h":"ШАБДАН БААТЫР"},{"t":"p","h":"Шабдан Жантай уулу – кыргыз элине атын кашкасындай танымал инсан, ал 1889-жылы туулуп 1912-жылы дүйнөдөн кайткан. Анын башка манаптардан айырмаланган өзгөчө сапатары болгон. Алсак ага кең пейилдүлүк меймандостук жөнөкөйлүк мүнөздүү. Кыйналып кысталгандарга аянбастан жардам берүдө, журт ичиндеги урулук кагылыштарды тыйууда Шабдан ишти өтө кылдатык менен адилет жүргүзө билген. Ошондой эле бамчыл көз карашы кең киши болгон. Шабданды жакшы билген орус мугалими В.П. Ровнягин 1912 жылы минтип жазган батырга күн сайын алыскы жана жакынкы жерлерден жүздөгөн кыргыздар түркүн иштер менен кеңеш сурап келишчү. Көп сандаган үй-бүлөлүк жана турмуштук чаташкан маселелерди батыр кыргыз адатына таяп тура чече билчү. Ал жолашкандар менен тарынышкандарды элдештирип тынчтыктын үрөнүн себе билгендиктен урмат сыйга жеткен: «Шабдан батырдын адамдарды бай кедей дебей кабыл алып меймандагандыгы колунан келгенин аябагандыгы берешендиги 1907-1908-жылдардагы басылмаларда мындайча белгиленген: ар жерден келген жүздөгөн кыргыздар ар качан батырдын багусунда. Анын сиңирген эмгегин балап тынымсыз келип турган түмөндөгөн жылкы кой жана башка белектердин баардыгы кайрадан элдин өзүнө жумшалган. Батырдын аркасы менен ондогон жакырлар чалдар менен кемпирлер жан сакташат. Андыктан кыргыз комчулугу же кандай кыргыз болбосун батырдын сөзүн эки кылышпайт»."},{"t":"p","h":"К.Үсөнбаев"},{"t":"p","h":"Он алтынчы жат жазуу"},{"t":"h3","h":"ЖЫЛКЫНЫН АСЫЛДЫГЫ"},{"t":"p","h":"Жылкы жашыл төрлөрдүн бетеге тулаңын гүлдүн бүрлөрүн оттогондуктан желинин тээп чыккан сүтү – дары. Ал дайыма чуркагандыктан жегенин ичкенин жакшы сиңирет организми таза болот. Сабага бишкектелип бышылган сүтү ышталган чаначтарда көкөрлөрдө көбүрүп жакшы ачыйт. Айрыкча, ак кодол туралып куйрук май бал кошулуп бышылган кымыз күчтүү. Такай кымыз ичкен жигит алибетүү москоол күчтүү келет."},{"t":"p","h":"Башка малдын денеси жараланса чымын чычып курттайт учурунда дарылабаса мал өлүп калат. Ал эми жылкынын эти куртаса ириң сорулгуча жеп таза этине жеткенде курт өлөт. Жылкынын тери жытанган жерге жылан жолобойт. <span class=\"pg\" data-n=\"68\">68<\/span>Талага конгон адам жылан жолобосун деп ээр-токумун тердигин желдигин ичмегин жанына жайып салат. Жылан чакан кишиге атын терин ичирип айыктырышат. Демек жылкынын эти сүтү күчү гана эмес тери да пайдалуу."},{"t":"p","h":"Жылкы ылай судан, чөөтөн ичпейт. Ал тоо сусунан көк кашка муздак булактан тандап ичет. Ал эми жылкынын майы чыкылдаган суукта да эрип турат. Жылкынын этин канчалык жесе ошончолук денеге бат сиңип адамды сергек алып жүрөт. Жылкы алдыңкы туягы менен чапчыганда күбүр карлар урап түшөт. Ураган карды чапчып ыргытып алдында уйпаланып жаткан туланды кар аралаш сугунат. Бээлер кар тээп эң мурда кулундарына чөп ачып берет алар кардыгып алган соң өздөрү оттоого киришет."},{"t":"p","h":"Э. Турсунов"},{"t":"h3","h":"Он жетинчи жат жазуу АК КАЛПАК"},{"t":"p","h":"Баш кийим улук болот дешет кыргыздар. Ошондон уламбы кийип журген баш кийимин биреге белеке бербейт жерге таштабайт отурган жерине эсинен чыгарып унутуп кетпейт эскиргенде айрык чупурек сапырака кошуп ыргытпайт. Кыргыздар ездеру женунде «Ала-тоону жердеген, ак калпак кыргыз эл деген. Атадан калган салты бар, ак калпак кыргыз калкы бар» деп ырдашат."},{"t":"p","h":"Ак калпактын алгачкы түрлөрүн «сак», «скиф» деген ат менен байыркы парсы, грек элдеринин тарыхый булактарына кирген огуз элдери кийишкен. «Кыргыз» деген этнонимдин ушул убака чейин чечиле элек бир варианты бар: хур (байыркы миф боюнча күндүн аты+гуз, өгүз), бул сөз «күн+өгүз» деген түшүнүктү берип турат. Кыргыз эли да ак калпагын ыйык тутуп, жерге таштабай жүргөнүн түшүнүү

":"h3","h":"§ 42. «ТИЛ КУТУЧАСЫ» ТОПТОМУ"},{"t":"p","h":"(1-Гкутучалар УП, 8-14-кутучалар УПШ класста өтүлгөн.)"},{"t":"p","h":"Он бешинчи кутуча"},{"t":"v","l":["жаран (достор, дос-туугандар, атуулдар)","жарашыктуу (келишимдүү, көрктүү, жарашыгы бар)"]},{"t":"p","h":"жарбанда (жөнү жок шайырлык, ыгы жок теңтуш болуу,"},{"t":"p","h":"коюн-кончуна кирүү) жаркын (жылуу, жайдары жүз, ачык-айрым мүнөз, сүйкүмдүү) жарнак (үлүш кошуп, биргелешип иштөө)"},{"t":"v","l":["жароокер (мүнөзү жагымдуу, илбериңки, жайдары)","жасалгала (кооздоо, көрккө келтирүү)","жөлөк (сүйөнүч, тирек, тирөөч, таяныч, таянчык)"]},{"t":"p","h":"жулук ууру (майда-чүйдө буюмдарды кымтып алуучу"},{"t":"p","h":"майда ууру)"},{"t":"p","h":"Он алтынчы кутуча жалоору (ыйламсыроо, көзүн жашылдантуу, көз жаш кылгыртуу) жашаялмет (жаш балдары бар, жаш балдары көп) жетелеме (өз алдынча эмес, бирөөнүн айтканы менен болуп,"},{"t":"p","h":"жетегинде жүргөн) жетик (акылман, даанышман) жойпулан (эки жуздуулук кылуу, жагынып, кошомат кылуу) жоогазын (мандалак)"},{"t":"v","l":["жоодура (мунайып, жалооруп кароо)","жооткот (алаксытуу, тайсалдатуу, туурасын айтпай,","башкага чалуу)"]},{"t":"p","h":"жорупта (сапырылып жаткан эгиндин чарын сыйпалата,"},{"t":"p","h":"үстүртөн шыпыруу)"},{"t":"v","l":["Он жетинчи кутуча","жүлжүй (көзүн бүтүйтүү, жүлжүгүй тарттыруу)"]},{"t":"p","h":"жүткүнүү (илгерилөө үчүн обдулуу, алга карай жутунуу) жыбылжы (акырын, жылжып агуу, акырын жай кыймылдоо) жылаажын (кушка тагылуучу кичинекей коңгуроо) <span class=\"pg\" data-n=\"249\">249<\/span>жылбырска (ара туулган козунун тармал боло элек териси) жылдыздуу (жылдыздардын жыбырап көрүнүшү, сүйкүмдүү,"},{"t":"p","h":"жайдары, жүзү жарык, таалайлуу) жылдырма (арамза, астыртан жамандык издеген, астыртан"},{"t":"p","h":"жылдырып какшыктаган неме) жылымчы (астыртан, жашырын, тымызын жүрүп жаман иш"},{"t":"p","h":"иштеген пенде) жыра (суу жеп кеткен жылга, кокту, коо)"},{"t":"h3","h":"Он сегизинчи кутуча"},{"t":"p","h":"жышаналуу (жакшылыктын белгиси бар, жакшыга үмүткөр"},{"t":"p","h":"кылган) жүрөкзаада болуу (зааркануу) зааркануу (дити барбоо, бүткөн бою дүркүрөп тартынуу) заңгел (абдан бийик аска, көк тиреген аска-зоо)"},{"t":"v","l":["зарурат (зарыл, абдан зарыл, абдан муктаж)","зеки (жекирүү, коркутуу, жемелөө)","зили (түбү, акыры)","зоболо (кадыр-барк, атак)","зоок (көңүл ачуу, оюн-тамаша)","","Он тогузунчу кутуча"]},{"t":"p","h":"зыкым (колунан эч нерсе чыкпаган саран, катуу баш) зыяпат (сый, меймандостук, мейман кылуу) зээн (акыл-эс жөндөмдүүлүгү, сезимдүүлүк, сергектик) зээни кейүү (кайгыруу, капалануу)"},{"t":"v","l":["идирек (жөндөм, зээн)","ийги (жакшы, түзүк)","ийкем (жөндөм, шык, эп, элпектик)","ийменчээк (тартынчаак, уялчаак, ырааттуу)","илбериңки (элпек, кыймылы жеңил, шар)"]},{"t":"h3","h":"Жыйырманчы кутуча"},{"t":"p","h":"илбээсин (эти желчү жана аңчылык кылына турган жапайы"},{"t":"p","h":"куштар)"},{"t":"v","l":["илкип-калкып (жай, эптеп-септеп, илен-салан)","илээнди (шалаакы, тыкан эмес)"]},{"t":"p","h":"интеллигент (окуган, маданияттуу киши, акыл эмгегинин адамы) иңир (күүгүм кирип, көз байланып калган мезгил) иренжи (жийиркене түшүү, көңүл калуу, жактырбоо, айнуу) ириде (эң мурда, алды менен, баарынан мурда) ` итабар (бир топ, бир далай, бир кыйла, көп)"},{"t":"h3","h":"<span class=\"pg\" data-n=\"250\">250<\/span>Жыйырма биринчи кутуча"},{"t":"p","h":"итапкан (бир топ, бир кыйла, далай, көп) итатайы тутулуу (кыжырлануу, жини келүү, кыжыры кайноо) итирей (илмейген, жүдөө) итиреңде (үтүрөңдөп кыжыры келүү) ичиркен (муздактан дененин дүүлүгүүсү, чыйрыгуусу) ишарат (белги берип жаңдоо) каалгы (үргүлөө, жарым уйкуда болуу, өтө жай кыймылдоо) кайгуул (чалгын, кароол)"},{"t":"v","l":["керимсел (ысык жел)","","Сүйлөп машыгуу",".Он бешинчи кутуча боюнча.",".Он алтынчы кутуча боюнча.",".Он жетинчи кутуча боюнча.",".Он сегизинчи кутуча боюнча.","л. Он тогузунчу кутуча боюнча.","‚ Жыйырманчы кутуча боюнча.","Жыйырма биринчи кутуча боюнча."]},{"t":"p","h":"Сүйлөп машыгуунун тартиби. 1. Сөзсүз, кутучадагы сөздөрдү катыштырып сүйлөм түзөсүң. М.: Мекенди коргоо – ар бир жарандын милдети. 2. Үн чыгарбай, сүйлөмдү ичиңен түз. 8. Бир сөздү да аттап кетүүгө болбойт."},{"t":"p","h":"Үлгү: Баланын зээни жакшы, укканын эгерим унутпайт."},{"t":"h3","h":"ООЗЕКИ ТАЙМАШ"},{"t":"p","h":"1-таймаш. Эки топко бөлүнгөн окуучулар 15-21-кутучадагы сөздөр боюнча атаандашып сүйлөм түзүшөт. Бир тарабынын өкүлү бир сөздү сунуш кылса, экинчиники ал сөздү катыштырып, дароо сүйлөм түзөт. Сүйлөм түзүшүү алмак-салмак болот. Бир сөзгө бир нече сүйлөм түзүлөт жана билбегенди билгени алмаштырып түзө берет."},{"t":"p","h":"2-таймаш. Әки топтон тандалган эки окуучу чыгат да, кутучалардагы сөздөрдү катыштырып, 12ге чейин сүйлөм түзөт. Ким көп жана туура түзсө ошол утат."},{"t":"p","h":"3-таймаш. Мында бир топтон бир эле окуучу чыгат, ага 2-топтун баары бирден сөз сунуштайт. Сүйлөм илгиртпей түзүлөт."},{"t":"p","h":"Жазып машыгуу"},{"t":"h3","h":"1. ТЕКШИ ЖАРЫШ"},{"t":"p","h":"15-21-кутучалардагы сөздөр катыштырылат. Доска экиге бөлүнөт. Эки топтон бирден окуучу чыгып, бирден сүйлөм <span class=\"pg\" data-n=\"251\">251<\/span>жазат жана бүткөнү отурат. Ордуна кийинкиси чыгат. Бүткөндүн ордуна улам жаңысы чыга берет. Ушул ишти эки баракка жаздыруу менен алмаштырса да болот."},{"t":"h3","h":"2. ЖЕКЕ ТАЙМАШ"},{"t":"p","h":"Мында эки топтон өкүл болуп чыккан эки окуучу доскада орун калбай калганга чейин жазышат. Бул ишти ченелген убакыт боюнча баракка жаздыруу менен алмаштырса да болот."},{"t":"h3","h":"3. АЛАМАН БАЙГЕ"},{"t":"p","h":"Мында таймашуучу топ түзүлбөйт. Ар бир окуучу өзү үчүн күрөшөт. Туура жана баарысынан көп сүйлөм түзгөн окуучу аламанда утуп чыгат."},{"t":"h3","h":"А. ЧЕБЕРЧИЛИК ТАЙМАШЫ"},{"t":"p","h":"15-21-кутучалардагы (кааласа 1-20-кутучалардагы сөздөрдү пайдаланса да болот) сөздөрдүн бир нечесин бир сүйлөмгө катыштырып түзүү чеберчилиги сыналат."},{"t":"h3","h":"ТЕКШЕРҮҮ ИШИ"},{"t":"p","h":"Биринчи тамгасы жазылып, анан көп чекит коюлган, же биринчи жана акыркы тамгасы жазылып, ортосу көп чекит менен белгиленген жерлерге 15-21-кутучадагы сөздөрдөн маанисине келтирип жаз."},{"t":"p","h":"т Август айында к... желге эгин талаасы жай чайпалат. Каба өзүнүн уулу баштаган алты жигитти к... га койду. К...п уктап отурат. «Ж...дын жаны – сен, жаратылган каны – сен». ТА суусар тебетей кийген жигит көч баштады. «Буралып турган ж... кыз булбулдун үнүн укпайбы?» Сен эмне жөнү жок ж...п калгансың. Кантсин, бүлөсү көп да, ж... болуп калды. «Саадаткан турду ж...п, кулпунган өңү бозоруп». «Ж... карап айылдан, жаш бозой жылкы кайырган». Ж... ташып үй салып алдык. Мектептин ж...сы жарашыктуу болуптур. Өз алдыңчалыгың жок, ж... болуп калдын, кантейин."},{"t":"p","h":"Пп Куш талпынганда, ж... шыңгырады. Дүйшөнкулдун ж... иреңи көзүмө элестеди. Козунун ж... терисин сурап келиптир. «Өйдө басса өбөк бол, ылдый түшсөк ж... бол». Жашынан ж... у... кылат. Анын акылы ж.... Мурдагы өзүнүн кылган иттигин унутуп койду десе керек, алдыман ж...ып чыкты. «Ж... терип шагылдан, жол турса кетип тескери». Капчыгайдын кире беришинде бийик з... бар. Талас шаарында з... ишим <span class=\"pg\" data-n=\"252\">252<\/span>чыгып калды, уруксат берсеңиз экен. «Капкара көздөрү ж...п, акылдуу тиктеген эстүү Мыскал бөтөнчө сүйкүмдүү»."},{"t":"p","h":"Ш И...туу окуучулар биздин класста көп. «Булар кадимки эле нур жүздүү, кыргыздын и... кыздары болуп чыкты». И... кыз саба бышты. Комуз черткен кишинин манжалары и...дүү болуш керек. «Үйрөнүшкөн жоо атышарга и...». «Тегерек» айылы бизден и... эле ыраак. «И...ген каракчы, дарыядан барып суу алып кел». Айдараалы Кулбашка ачуусу менен и...ди. Деги эле ж...уп бербей койдуң го, биздин колго да карга чычар. 3...н көтөрүлсүн, уулум. Кээ бирөөлөр битин сыгып, канын жалаган з.... Ал чийки май жегенсип, ж... з... болуп жүрөт. Балам ченде жок и..., чарбагына өскөн уйгакты жулуп коюуга да мойну жар бербейт."},{"t":"h3","h":"Кайталоо"},{"t":"p","h":"1. УП класс: $ 12. 1—7-кутучалар («Тил кутучасы» топтомунда)."},{"t":"p","h":"2. УШ класс: 8—14-кутучалар («Тил кутучасы» топтомун-"}],"sub":[{"title":"Он сегизинчи кутуча","b":19},{"title":"Жыйырманчы кутуча","b":25},{"title":"Жыйырма биринчи кутуча","b":30},{"title":"ООЗЕКИ ТАЙМАШ","b":35},{"title":"1. ТЕКШИ ЖАРЫШ","b":40},{"title":"2. ЖЕКЕ ТАЙМАШ","b":42},{"title":"3. АЛАМАН БАЙГЕ","b":44},{"title":"А. ЧЕБЕРЧИЛИК ТАЙМАШЫ","b":46}],"section":"ЇХ КЛАСС","pages":[249,252]},{"title":"§ 48. «ИЛХАМ КЕП» ТОПТОМУ","blocks":[{"t":"h3","h":"§ 48. «ИЛХАМ КЕП» ТОПТОМУ"},{"t":"p","h":"(1-3-турмек УП, 4—6-турмек У1П класста өтүлгөн)"},{"t":"h3","h":"Жетинчи турмек"},{"t":"p","h":"1. Жаш болуу бул – Күнгө жетер кулач болуп сунулуу!"},{"t":"p","h":"Әргүү, кеңүү, эркин нурдай элирүү."},{"t":"p","h":"Абага-сууга семирүү. Көк асмандай туруу дайым зыңгырап. Бул турмуштун булккан күчүн өз денеңден издеп табуу (Р. Рыскулов)."},{"t":"p","h":"2. Ким элем төрөлгөнчө жүргөм кайда? Миң жылдар өткөн кезде кайда болом? Туямбы тирүүлүктүн табын кайра, дагы качан кайталанам, пайда болом? (Ж. Мамытов)."},{"t":"p","h":"3. Же мезгилдин канатында аркырап, күндөрдүн бир кундөрүндө өмүргө келбестиктен келебизби кар сымак? (А. Өмурканов)"},{"t":"p","h":"4. Мобул тоолор арасында жылуу уядай жылуу алакан сылаган, балалыктын маанайы бар өчпөгөн (А. Темирова)."},{"t":"p","h":"5. Толгон айдын сыныктары калкыйт толкун бетинде (А. Темирова)."},{"t":"h3","h":"<span class=\"pg\" data-n=\"253\">253<\/span>Сегизинчи турмек"},{"t":"p","h":"1. Өзүң салган тамдан мурун кулайсын, өмүр кыска бычагындын сабынан (Т. Үмөталиев)."},{"t":"p","h":"2. Жыргалдын жаңгагынан көп тергин да, таштагын укум-тукум баштыгына (Т. Умөталиев)."},{"t":"p","h":"3. Турмуш – балбан! Иет сени ороктой, адамсыңбы, адам менен тең жүргүн, аз акылды чиренүүгө коротпой (Т. Умөталиев)."},{"t":"p","h":"4. Тун-чабандес кара бөрктүү, оттуу кылыч колунда. Булут кошуун сүрөп жүргөн, айкырыгы сонунда (А. Темирова)."},{"t":"p","h":"5. Тоолор жабат кызгылт нурдан парданы, жашыл кечти ороп көгүш мунарык (А. Темирова)."},{"t":"h3","h":"Тогузунчу түрмөк"},{"t":"p","h":"1. Жашоо – кумар, сырга толо, кубанычка, нурга толо. Сагынычка, сыйга толо. Кээ бир күнү кесепеттин сарсанаага, ыйга толо (Ж. Мамытов)."},{"t":"p","h":"2. Күүлөн, шамал, уч, жалбырак, ойно, куюн, сапырыл, чан, ур, борошо, бет алдыман, мен турмушка келатам (Ж. Мамытов)."},{"t":"p","h":"3. Желге желпинген жашыл арчадай айкөл дүйнөдө эрбеңдеп келемин. Жер сени батырып карекке алчадай, чеги жок кыйрыңа жылдыздар тамчылап, балдарды талпынтып алмадай ай чыгат (Т. Муканов)."},{"t":"p","h":"4.Шыбырап жалыныч наз кепти, асканын киймин жаз чечти. Буулугуп турган булуттан булактай туйлап жаш кетти (А. Өмурканов)."},{"t":"p","h":"5. Арылайм, сыйкыр күүлөрүн түшүнсөм бирин түшүнбөй, жашоого ушул келгеним чын эмес эле түшүмдөй (А. Өмүрканов). Жаттоо а) Китептен карап, жетинчи, сегизинчи, тогузунчу түрмөктөгү ыр саптарын катары менен адегенде бир сыйра, анын эки сыйра хор менен көрктүү окуу."},{"t":"v","l":["б) Үч түрмөктөгү ар бир ыр сабын өзүнчө жатта.","1. Жетинчи түрмөк: 1, 2, 8, 4, ©.","2. Сегизинчи түрмөк: 1, 2, 3, 4,5.","3. Тогузунчу түрмөк: 1, 2, $3, 4,5."]},{"t":"p","h":"в) Уч турмектегу ыр саптарын хор менен жатка айткыла."},{"t":"h3","h":"Сүйлөп машыгуу"},{"t":"p","h":"298-көнүгүү. Жетинчи түрмөктөгү ыр саптарын өз сөзүңө кошуп сүйлө."},{"t":"p","h":"Үл г ү: Бир карасаң, жаштык жөнүндө Рамис Рыскуловчо эч ким таамай айта албас, ал минтип ырдайт: «Жаш болуу <span class=\"pg\" data-n=\"254\">254<\/span>бул – Күнгө жетер кулач болуп сунулуу! Әргүү, кеңүү, эркин нурдай элирүү. Аба-сууга семирүү. Көк асмандай туруу дайым зыңгырап. Бул турмуштун булккан күчүн өз денеңден издеп табуу»."},{"t":"p","h":"299-көнүгүү. Сегизинчи түрмөктү жетинчи түрмөккө окшоштуруп сүйлө."},{"t":"p","h":"300-көнүгүү. Тогузунчу түрмөктү да жетинчи түрмөктүн үлгүсүндө аткар."},{"t":"p","h":"301-көнүгүү. Алым сабак сүйлөшүү. Биринчи окуучу ыр сабын айтат, экинчиси аны дароо өз сөзүнө кошуп сүйлөйт."},{"t":"p","h":"Биринчи түр. Алым сабак сүйлөшүү эки окуучунун гана ортосунда болот. Экөөнүн бирөө сөз таппай калганга чейин улантылат."},{"t":"p","h":"Экинчи түр. Алым сабак сүйлөшүүгө катышкан окуучулар утуру алмаштырылып турат."},{"t":"p","h":"Жазып машыгуу 302-көнүгүү. Жетинчи түрмөктөгү ыр саптарын төл жана бөтөн сөздүн өзүң каалаган эрежеси боюнча жаз."},{"t":"p","h":"308-көнүгүү. Сегизинчи жана тогузунчу түрмөктөрдөгү ыр саптарын төл жана бөтөн сөздүн өзүң каалаган эрежеси боюнча жаз."},{"t":"p","h":"304-кенугуу. Жетинчи түрмөктөн эки ыр сабын диалогдуу сүйлөмгө айландыр."},{"t":"p","h":"Үл г ү: – Толгон айдын сыныктары калкыйт толкун бетинде, – деди Алтынай Темирова."},{"t":"p","h":"Алтынай Темирова: – Толгон айдын сыныктары калкыйт толкун бетинде,— деп айтты."},{"t":"p","h":"305-кенугуу. Сегизинчи түрмөктөн өзүң каалаган эки ыр сабын диалогдуу сүйлөмгө айландырып жаз."},{"t":"p","h":"306-көнүгүү. Тогузунчу түрмөктөн да өзүң каалаган эки ыр сабын диалогдуу сүйлөмгө айландырып жаз."},{"t":"h3","h":"Кайталоо"},{"t":"p","h":"1. УП класс: 1 – 3-турмектер («Илхам кеп» топтомунда)."},{"t":"p","h":"2. ҮШ класс: 4 – 6-түрмөктөр («Илхам кеп» топтомунда)."}],"sub":[{"title":"Жетинчи турмек","b":2},{"title":"Сегизинчи турмек","b":10},{"title":"Тогузунчу түрмөк","b":16}],"section":"ЇХ КЛАСС","pages":[253,254]},{"title":"§ 44. «ЧЕЧЕНДИК ЖАНА СЫН СӨЗ» ТОПТОМУ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"255\">255<\/span>§ 44. «ЧЕЧЕНДИК ЖАНА СЫН СӨЗ» ТОПТОМУ"},{"t":"p","h":"Чечен сөз менен сынчылык – кыргыз элинин боор эт менен тен, түптөн учка уланып келаткан, оргуп кайнаган, ташыган байманасы."},{"t":"p","h":"Сынчы, чечендердин ичинен не бир мыктылары чыккан. Алар айтып оозун жыйганча, ачып көздү жумганча сөздүн не бир берметтерин төгүп жиберишчү экен. Ж. Мукамбаев"},{"t":"h3","h":"Г. ЧЕЧЕН СӨЗ"},{"t":"p","h":"Чечен – оюңдагы орчундуу сөздү таамай да, тайманбай да, куюлуштуруп да, кулак курчун кандырып да, муютуп да айткан адам. Чечендин сөзү атылган ок сыңары. Чагылгандай жарк этип айтылат да, каршысын сөзгө жыгат. Чечен сөздү Жээренче чечен, Көкөтөй, Куйручук, Тилекмат, Карачунак, Ырысбек, Токторбай, Айтыбар, Медет ж.б. ондогон адамдар колдонгон, бирок алар менен катар аны «чечен», «сөзгө уста» деп аталбаган карапайым калктын катмары да пайдаланган. Тиешелүү чечен сөздү маашырлана айтып, анан «анысы кандай» деп ага өз оюн кыноо менен кимдир бирөөнү ынандыруу, жүйөгө жыгуу салты күнү бүгүнкүдөй күчүндө."},{"t":"p","h":"Чечендер сөздү так айткан: ойду учкул, элестүү, көркөм сөздөр,"},{"t":"p","h":"менен туюнтушкан; тыбыш жутуу, кекечтенүү, узак сүйлөө, туттугуу болгон эмес; чаржайыт кеп урушпаган; жай, сабырдуу жана олуттуу сүйлөшкөн; эч качан жасалма кепке барышкан эмес; сөзгө чалынып калбас үчүн өтө кылдаттыкты пайдаланышкан. Ж. Мукамбаев Чечендик – сөз өнөрүнүн жеткен чеги. С. Закиров 1. Акыл Карачачтын жообу Жаныбек хан:"},{"t":"p","h":"– Тулпарды уйга сатса не болот? Атты эшекке сатса не болот? Туйгунду каргага сатса не болот? – деп сураган."},{"t":"p","h":"Акыл Карачач:"},{"t":"p","h":"– Тулпар тушунда, күлүк күнүндө. Күч бербеген тулпардан сүтүн берген уй жакшы. Чабал аттан чарчабаган эшек жакшы. Канаты жок туйгундан канаттуу карга жакшы. Карга конгон, кузгун тойгон каздын тарпынан үксүйүп үмүт кылган туйгун оңчубу, эртеги салтта, эски наркта мындай шумдуктуу жорук болчубу? – деп жооп берген экен."},{"t":"p","h":"(Кыргыз эл жомогу)"},{"t":"h3","h":"<span class=\"pg\" data-n=\"256\">256<\/span>2. Тилекматтын Калыгулга айтканы"},{"t":"p","h":"– Кереге ажыраса көктөлөр. Әэр ажыраса эптелер. Жер жарылса, сел менен толор. Әл жарылса эмне болот, касиеттүү карыя? (К.Осмоналиев, «Көчмөндөр кагылышы»)."},{"t":"p","h":"3. Ойлонбой сүйлөгөн жигит..."},{"t":"p","h":"Илгери көпкөлөң тарткан бир жигит жолоочулап келе жатып, бир үйгө келет. Үйдөн бир сулуу жаш келин чыгып, коноктун атын алып, эшик ачып, үйгө кийрет. Мырза жигит колундагы куржунду көрсөтүп:"},{"t":"p","h":"– Кайда илсем экен, келинчек, – дейт. Жигиттин теңсинбей турганын байкаган келин:"},{"t":"p","h":"– Эгер сексен баштуу үйдөн куржунунуз илине турган керегенин башы табылбай калса, анда мойнунузга илип алыңыз, – дейт (С. Закиров, «Кыргыз санжырасы»)."},{"t":"p","h":"4. Байзактын айтканы —- Жылынып жүрүп күндүн баркын билбейт экенбиз: «Чыгыштан чыкты, батышка батат», – деп. Жашап жүрүп жердин баркын билбейт экенбиз: «Тоосу таш, түзү топурак», – деп. Ичип жүрүп суунун баркын билбейт экенбиз: «Жутса муздак, кайнатса ысык», – деп (К. Осмоналиев, «Көчмөндөр кагылышы»"},{"t":"h3","h":"5. Чакарбай чечендин сезунен"},{"t":"p","h":"1. Турмуш – тутанган куурай, өткөн өмүр – өчкөн от, кыял-кармалбаган куш, айтылган сөз – атылган ок."},{"t":"p","h":"2. Бул дүйнөдөн аккан суудай, айкаштагы чуудай, тегүлгөн кумдай бардыгы өтөр. Бетеге кетет, бел калат. Бектер кетет, эл калат. Осмо кетет, каш калат. Оомат „кетет, баш калат. Учкан камгактай, уюлгуган куюндай агып жоголуп турат."},{"t":"p","h":"3. Жараткандан үчөө гана өлбөйт: калдайган кара жер өлбөйт; аскасы бийик тоо өлбөйт; агыны катуу суу өлбөйт. Калганы бүгүн бар да, эртең жок (С. Закиров, «Кыргыз санжырасы»)."},{"t":"p","h":"6. Токторбай чечендин айтканы 1. Уккан улама, көргөн көсөм. Сөздүн маңызына түшүнүп, нугун билбесе, акыл чечени кайдан чыгат. Сөзгө жараша сөз айтып, адамды таң калтырбаса, тил чечени кайдан чыгат."},{"t":"p","h":"2. Он беш жашта – жарга ойногон улактайсын. Жыйырма беште – оргуштаган булактайсың. Отузда – октос берген кабыландай, кыркыңда – кындан суурулган кылычтай. Әлүүде- <span class=\"pg\" data-n=\"257\">257<\/span>адырдан качкан аркардайсын, алтымыш жаш – аксатат, аркандалган аттай алыска кете албай каласың. Жетимиш – желенин башы, жердин ташы, карынын жашы, балээнин башы. Сексенде – сенек болдун, кимге керек болдуң. Токсон – тоголонгон жаш – өмүргө келген азап. Айткан сөздөн кем болдун, өлүү менен тең болдуң, өлбөгөндө не болдун."},{"t":"p","h":"3. Кара жердин өлгөнү – кар астында калганы. Алтын булак өлгөнү – аяктай муздун басканы. Аскар тоонун өлгөнү – ала булут чалганы."},{"t":"p","h":"4. Айтылган сөз – аткан ок, айтылган соң кайрылбас. Калган көңүл – качкан куш, кайгырган менен табылбас. Өткөн өмүр – өчкөн от, өкүнгөн менен жагылбас (С. Закиров, «Кыргыз санжырасы»)."},{"t":"p","h":"7. Токтосун Бойкон уулунун айтканы 1. Жакшы аял – атан төө. Кайнатасы сүйүнөт жүк көтөргөн нарым деп, кайненеси сүйүнөт бышып турган наным деп, алган жары сүйүнөт күндө таткан балым деп, жаратканга миң шүгүр, жакшы чыкты жарым деп. Жаман аял курусун, акыл айтсаң андайга, көрүнөсүң бузгандай, кейнегунун чалмасы керген адам кузгандай, кебетесин карасан, кап тешкен сокур чычкандай."},{"t":"p","h":"2. Кыздан айланайын, күйөө табат, канты менен чайын ала чабат. Кедей болсо да, бай болсо да, кур келбейт. Уулуң аман болсун, келин табат. Келин келет, отко окшогон жалын келет. Жакшы болсо, жолундагы ишти кыла келет, жаман болсо өз уулунду өзүндөн ажыраткан залым келет."},{"t":"p","h":"3. Бейжай болсо, аял – жоо, бейакыл болсо, уулун – жоо, беймаза болсо, келин – жоо, бейтартип болсо, кызың – жоо. Ушунча жоонун ичинде, кудай ай, сен кантип жүрөсүң эсен-соо."},{"t":"p","h":"4. деген киши айтчу экен: он бешинде жарда ойногон улаксың, жыйырма беште шаркырап аккан булаксын, отуз жаш – байлоодогу тайдайсын, кырк жаш – кынынан суурулган кылычсын, элүү жаш деген бел экен, алтымыш жайлоодон кайра тарткан эл экен, жетимиш жергесинен кем экен, сексен кара жер менен тен экен, токсон тонго сепкен бор экен, уулдун уулуна кор экен, уулдун уулуна кор болгуча, өлүп калмак оң экен."},{"t":"p","h":"8. Дастан Сарыгуловдун айтканы Жер көчүп жаткан айылдарды тоо этегинен көчүрүп кет- ‚ се болот, ал каптай турган кыштактардын сай-арыгын бульдозёр менен ондоп, бетон менен каласа болот? Бирок адамдардын <span class=\"pg\" data-n=\"258\">258<\/span>жүрөгүнөн жоголуп жаткан ыйманды бульдозёр менен кантип оңдойбуз? Бетон менен кантип тособуз? Ыйман деген чөйчөктөгү сууга окшош, кылт этсе төгүлөт."},{"t":"h3","h":"9. Айтыбар чечендин сөзү"},{"t":"p","h":"1. Кайрат деген кыраан бар, кайгыга тизгин бербеген, кайгы деген жылан бар, өзөктү чагып өрттөгөн."},{"t":"p","h":"2. Өмүр турганда, өлүмдү сүйлөгөндөн без, тирүүлүк турганда, көргө сүйрөгөндөн без (С. Закиров, «Кыргыз санжырасы»)."},{"t":"h3","h":"П. СЫНЧЫЛЫК"},{"t":"p","h":"Сынчылык – адам баласындагы теңдешсиз, салыштырылгыс, өзгөчө көрөгүчтүк, билгичтик. Бир көз чаптыруу менен эле сынчы беттеген, көңүл бурган адамынын буруш-турушун, мыктылыгын, өксүгүн, оболу келечегин да кашкайта айтып салган."},{"t":"p","h":"Сынчылар жылкынын күлүк же чобур болорун кулун жана тай кезинде сынап билген. Үйдө отуруп тыштагы аттын баскан дабышынан күлүк болорун билген. Учуп бараткан бүркүттүн кыраан же жаман экенин билген сынчылар болгон (Б.Солтоноев)."},{"t":"p","h":"«Манаста» Кошой баатыр Каныкейдин мандайы кайкы, таалайы тайкы экенин алдын ала билет. Толубай сынчы сыны үчүн көзүнүн оюлганына да кайыл. Санчы сынчы сынчылык өнөрү менен Болотко серпкенин алган темир текөөр бүркүттөй эрди, ат качырбас боз айгыр баатырды төрөчү зайыпты тандап берет. «Эр Табылды» дастанында Санчы сынчы Кудайназардын балдарын сынап, ачуу чындыкты айтат: «Айтсам сенден өлөрмүн, айтпасам сындан өлөрмүн, бычакка саптык уулуң жок»."},{"t":"h3","h":"1. Санчы сынчынын сөзү"},{"t":"p","h":"1. Түштүк аймагын минтип айтыптыр:"},{"t":"p","h":"– Кыздары кыя баспаган, келини жүзүн ачпаган, жыгачынан май аккан, жыбытынан суу аккан, карысы карап турбаган, жигити иште муңбаган, келсе баргыс, барса келгис жер экен."},{"t":"p","h":"2. Сары өзөн Чүйдү айтканы:"},{"t":"p","h":"– Күрөгү күмүш, кетмени алтын, дан чачкан пенде сүйүнгөн, кызылы кырдай үйүлгөн, ачынып келген тоюнган, арыктап келген семирген, бечара менен карыпка бейкуттук болчу жер экен (К. Осмоналиев, «Көчмөндөр кагылышы»)."},{"t":"h3","h":"<span class=\"pg\" data-n=\"259\">259<\/span>2. Баатыр сыны"},{"t":"p","h":"1.Октон-чоктон кайтпаган, жоонун аз-көбүнө карабай жалтанбай, тоодон кулаган таштай чимирилип жалгыз качырган, алды-артын ойлонбогон, аң-кемерди көзгө илбеген, жоону аралай чаап, быт-чытын чыгара салгылашкан эр. Мындай баатырларды «адам шери» деп атаган."},{"t":"p","h":"2. Жоодо жаралуу болуп калса да, маселен, колу сынса мойнуна асып коюп, буту сынса канжыгасына байлап алып, башынан аккан кан көзүн көрсөтпөй каптаса, шыпырып салып, суусаса атынын терин жалап коюп, душман менен салгылашкан эрди «кара көк», же «көкжал» дешкен."},{"t":"p","h":"3. Жоонун ыгына жараша согушат: калп качымыш болуп душмандын атын да, өзүн да чарчатып, бириндеп калган чакта сайып алат; жоонун аз-көбүн билмекке качырткы салат; жоо качырып, чарчатар жагын көздөйт; эгер жоодон чындап качып калса, аты чабал жолдошторун алдыга жиберип, тандамал жигиттерин артына коёт да, өзү алардын соңунан түшүп, жете келген жоону тосуп согушуп, илгери жибербейт. Мындай эрге жоокерлер көп пааналайт. Аларды «илекор баатыр» деген."},{"t":"p","h":"4. Жанына жолдош албайт. Алыс-жакынга өзү барып, жылкы алат. Жоосун жоолайт. Мындайларды «жеке баатыр» дейт."},{"t":"p","h":"5. Өзү жоодон коркуп качайын десе да, жолдошторунан уялып качпайт, ошентип жүрүп эрдик кылат. Мындайлар «ээрчиме баатыр» делет."},{"t":"p","h":"6. Анык баатырларды туурап жоо качырып, жоо саят да, «эрен» атагын алат (Б.Солтоноев)."},{"t":"h3","h":"3. Урумдун Каныбекке айтканы"},{"t":"p","h":"– Кандайча себеп менен мени кул дедиңиз, ата."},{"t":"p","h":"– Әтти кыя кеспей туура кестин, чоң кесип, аз чайнап жуттуң. Әт жеп жатканда, эки жакты караган жоксуң. Баятан берки малдашынды үч котордун. Кездигинди өтүгүңө аарчыдың. Мен сүйлөп жатканда, төмөн карап отурдуң. Ошондуктан чүйгүндөп эт кесип жебеген, малдаш урунуп көнбөгөн, бычагын майлыкка аарчып көрбөгөн, жакшы сөздү угууга жайбаракаттык болбой, жашынан кул болуп курсагы тойбой, көрүнгөндүн заардуу тили менен шумурай жемесин көп угуп, жер карамараак өсүп калган экен го, – деп гана айта салдым (К. Жантөшев, «Каныбек»)."},{"t":"h3","h":"<span class=\"pg\" data-n=\"260\">260<\/span>4. Сен дүйнө"},{"t":"p","h":"1. Сен, сен дүйнө, сен дүйнө ... бир бетине күн тийген, бир бетине түн кийген, алды кызык, арты өкүнүч, оомал-төкмөл кем дүйнө."},{"t":"p","h":"2.Сен, сен дүйнө, сен дүйнө, ким жеткен сенин түбүңө? Ууз сүтүн эмизген апам кайда, сен дүйнө? Актын атын үйрөткөн атам кайда, сен дүйнө! Кимге бапа кылгансың, кылайган шоола боз салкын, жарыктык, өзүң бир тартым, капилет түштөй жалгансың (Т. Касымбеков, «Сынган кылыч»)."},{"t":"p","h":"5. Күлүктүн сыны 1. Илбирстей ичи тартылган, бөрү кулак, кулжа моюн. Кашка тиши кадоодой, кара тили бүлөөдөй, каракушу калкандай. Жазы жаак, кең мандай, жото жилик жонгондой, жонуна жатып конгондой. Балык эти баладай, туяктары чарадай. Кар жилиги кадоодой, кыска бакай, тик далы."},{"t":"p","h":"туяк, элик баш. Кара саны түрүлгөн, эрди шалпык, бото көз, чымыр туяк. Бүткөн бою тарамыш, көмкөргөндөй карчыты, жупжумуру моюну түз. Энөө жерде эликтей, өргө чапса учкан куш. Уюл-уюл капкан бел, төө толорсук, тайган төш. Уй куймулчак, тик жамбаш. Чакмак эти түрүлгөн, кара эти жок кагелес. Кулун куйрук, тал-тал көкүл, сыйда жал."},{"t":"p","h":"3. Чолпондой көзү жайнап, ичке сагак, сүмбөдөй тулку бою. Оозун керип, көп эстеп, улутунуп, ойноктоп, жерди чапчып, асман карап. Муз бөйрөк, бели кыска, бирдей сүбөө, түпөктөй туу куйругу, бийик өркөч. Узун жамбаш, кең соору, алчак басык. Бөрү желиш. Тарамыш тула бою. Тайган төш, камыш кулак (Б.Солтоноев)."},{"t":"p","h":"6. Кыраан бүркүттүн сыны 1. Көзү чоң, жүндүү, өзү да чоң, ийиндүү: көкүрөгү кең, мойну сары, жүнүнө кыроо турбайт. Куйругу узун, жүнү шоодурак. Аркасында ак жүнү, жемсөөдө он чакты кызыл жүнү болот. Көзү кызгылтым, кабагы бийик, көзүнүн чарасы кен. Көзү кызыл, куму кайнап турат. Шыйрагы ичке, саны жоон, шыйрак жүнү кызыл, көзүнүн ичинен буу чыгып турат."},{"t":"p","h":"2. Кок тумшук, көк аяк, тумшугу узун, төш сөөгү миздүү жана кырдуу болот. Жемсөө чуңкур, беш сала батарлык жогдору болуп, жүнүнүн учу ичке болсо, карышкыр алуучу ушул. Кандай гана болбосун, жогдорлуу бүркүт кыраан болот."},{"t":"p","h":"3. Чөл бүркүт ачка болсо, жаш баланы эңип кетип жей берет. Бүркүт уядан алынып, андан шаңшычаак көп чыгат, <span class=\"pg\" data-n=\"261\">261<\/span>торго түшкөнү шаңшыбайт. Кол бала бүркүт ачка болгондо, ээсин да алып жейт. Жалтанбаган, коркпогон баатыр бүркүт көбүнчө уядан алынгандан (кол баладан) чыгат. Кара түлкүнү ошол алат, тор бүркүтү кайпактап, чыга берет (Б. Солтоноев)."},{"t":"p","h":"7. Алгыр тайгандын сыны 1. Кабагы тик, тумшугу ичке, узун болот. Көзү кыпкызыл. Сырты октой түз. Мойну жумуру. Оозу өтө чон. Бели кыска. Эки жамбаштын кошкону – эни төрт эли (кээде андан да кең). Толорсугу тик. Таманы кууш, кичине. Туу куйругунун түбү жоон."},{"t":"p","h":"2. Тайган каман, илбирс, бугу, марал, аркар-кулжа, эчкитеке, карышкырларды тобу менен алат. Андарды кайсынысы болсо да, бир тиштөө менен омурткасын былчыратат. Бир серпүү менен толорсугун сууруп таштаган. Алгыр тайганы бар айылга түн ичинде эч убакта карышкыр келбейт. Күчүк чагынан сөөк бербейт, чийки эт бербейт, итке талатпастан, эр жүрөк кылып асырайт. Кыргыз күлүк ат, бүркүт, шумкарды кандай көрсө, тайганды да ошондой ардактайт (Б. Солтоноев)"},{"t":"h3","h":"Угуу жана окуу"},{"t":"p","h":"Чечен жана сынчыл сөздөрдү кулакка үйүр алдырыш үчүн адегенде угуу керек. Мугалиминер окуп берет."},{"t":"p","h":"Т. Чечен сөздөр. 1. Акылкарачачтын жообу. 2. Тилекматтын Калыгулга айтканы. 8. Ойлонбой сүйлөгөн жигит."},{"t":"p","h":"4. Байзактын айтканы. 5. Чакарбай чечендин сөзүнөн: 11223."},{"t":"p","h":"6. Токторбай чечендин айтканынан: 1, 2, 3, 4. 7. Токтосун Бойкон уулунун айтканы: 1, 2, 3, 4. 8. Дастан Сарыгуловдун айтканы. 9. Айтыбар чечендин сөзү: 1,2."},{"t":"p","h":"П. Сынчылык. 1. Санчы сынчынын сөзүнөн. 2. Баатыр сыны: 1, 2, 3, 4, 5, 6. 3. Урумдун Каныбекке айтканы. 4. Сен дуйне: 1, 2. 5. Кулуктун сыны: 1, 2, 3. 6. Кыраан буркуттун сыны: 1, 2, 8. 7. Алгыр тайгандын сыны: 1, 2."},{"t":"p","h":"Чечен жана сынчыл сөздөрдү класстан, асыресе, үйдөн кайра-кайра окуу керек."},{"t":"p","h":"Жаттоо Чечен жана сынчыл сөздөрдү өз сөзүңө кошуп сүйлөө үчүн адегенде аларды жаттоо керек."},{"t":"p","h":"П. Сынчылык: 1, 2, 3, 4, 5, 6, Т."},{"t":"h3","h":"<span class=\"pg\" data-n=\"262\">262<\/span>Өз сөзүңө кошуп сүйлө"},{"t":"p","h":"Чечен сөздөрдүн бирин, айталы, Х менен белгилейли да, аны Өз сөзүбүзгө кошуп сүйлөөгө аракет кылалы. Кантип? Төмөнкү тартипте:"},{"t":"v","l":["2. [вә сөзүн] + (®","з. + +","","Сүйлөөнүн үлгүлөрү"]},{"t":"p","h":"1-улгу: Илгери Ормон хан өлтүрүлгөндөн кийин, Тилекмат чечен Калыгул олуяга атайы келип минтип айткан экен: «Кереге ажыраса көктөлөр. Әэр ажыраса эптелер. Жер жарылса, сел менен толор. Әл жарылса эмне болот, касиеттүү карыя». Анысы кандай, балабыз байкабастан машинасы менен бир уюңарды урдуруп кетиптир. Бул арадай ишти чарадай кылып ары-бери чойсок, жакадан алып, соттошуп жүрсөк, элчиликке жатабы. Андан көрө уюңарды төлөп берели, алдыңарга келдик, кечирип койгула, туугандар."},{"t":"p","h":"2-улгу: Ырас, кемчилик болду, кечирип койгула, айланайын туугандар. Балабыз мастыктанбы, жаштыктанбы, бир уюңарды машинасы менен урдуруп кетти. Мен атайы ортомчу болуп, бул ишти тыныштырайын деп келдим. Уйдун ордун төлөп берет. Бир өзөндөн суу ичкен, жамандыкжакшылыгыбызга күйүшкөн элбиз. Келечекти ойлоп, катуу кетишпейли. Илгери калктын камын ойлогон Тилекмат кадимки олуя акын Калыгулга келип, минтип айткан турбайбы: «Кереге ажыраса көктөлөр. Әэр ажыраса эптелер. Жер жарылса, сел мен толор. Эл жарылса эмне болот, касиеттүү карыя». Анысы кандай, бул жерде ак сакал-көк сакалдар олтурасыңар, ырбатпай чечип койгула. Ынтымакка келели."},{"t":"p","h":"З-үл?г ү: Баарыбызда эле бала бар. Алар чоңойгондон кийин, ата-эненин айтканы менен болбойт экен. Ошондо да ичтен чыккан ийри жылан эмеспи, түтпөйсүң. Алдыңарга кечирим сурап келип отурабыз. Илгери Тилекмат чечен Калыгул деген акылман кишиге келип: «Кереге ажыраса көктөлөр. Ээр ажыраса эптелер. Жер жарылса, сел менен толор. Әл жарылса эмне болот, касиеттүү карыя»,— деген экен. Албетте, жер, эл жарылгандын жүзүн нары кылсын дечи, бирок ажыраган керегени көктөп, ээрди эптеп койбойлубу. Наяты бир уй экен го. Төлөп берели. Ынтымакка келгиле, агайындар."},{"t":"p","h":"д"},{"t":"v","l":["<span class=\"pg\" data-n=\"263\">263<\/span>Сүйлөп машыгуулар","","2.","з. [ба сөзүн] + © + [вз сөзүн"]},{"t":"p","h":"Ушул тартипти төмөнкү оозеки машыгууларда кеңири колдон."},{"t":"p","h":"303-кенугуу. Акыл Карачачтын Жаныбек ханга берген жообун 1-үлгү боюнча сүйлө."},{"t":"p","h":"304-көнүгүү. «Ойлонбой сүйлөгөн жигитти» 2-үлгү боюнча сүйлө. 305-кенугуу. Байзактын чечен сөзүн 3-үлгү боюнча сүйлө. 306-кенугуу. Чакарбай чечендин уч сөзүн 1 – 3-улгулерге салып суйле."},{"t":"p","h":"307-кенугуу. Токторбай чечендин айткан сөздөрүнүн биринчисин 1-үлгү, үчүнчүсүн 2-үлгү, төртүнчүсүн 3-улгу боюнча сүйлө. Ал эми экинчи сөзүн жөн эле жатка айтып бер."},{"t":"p","h":"308-көнүгүү. Токтосун Бойкон уулунун айтканын 1— 8-үлгү боюнча сүйлөп бер."},{"t":"p","h":"309-көнүгүү. Д. Сарыгуловдун жана Айтыбар чечендин айткандарын 2-үлгү боюнча сүйлөп бер."},{"t":"p","h":"310-көнүгүү. Санчы сынчынын сөзүн катыштырып аңгеме кур. Үл г ү: Санчы сынчы көрөгөч, көзү ачык олуя киши экен го, анын ошол кезде эле Сары өзөн Чүйдү: «Күрөгү күмүш, кетмени алтын, дан чачкан пенде сүйүнгөн, кызылы кырдай үйүлгөн, ачынып келген тоюнган, арыктап келген семирген, бечара менен карыпка бейкуттук болчу жер экен» деп айтканында эмне кынтык бар, «күрөгү күмүш, кетмени алтын» дыйкандын, токчулуктун жери экени жалганбы. Муну бул күндө"},{"t":"h2","h":"турмуштун өзү ырастап отурат го. Ушул үлгүнү () + жана [ёз сөзүн] +(%)"},{"t":"p","h":"кештелери боюнча өзгөртүп жаз."},{"t":"p","h":"311-көнүгүү. Баатырлар боюнча суроолорго оозеки жооп бер."},{"t":"p","h":"1. Кандай баатыр «адам шери» деп аталат?"},{"t":"v","l":["2. Көкжал баатыр кандай болот?","3. Илекор баатырды айтып бер?","4. Жеке баатыр кандай болот?"]},{"t":"p","h":"5. Ээрчиме жана эрен баатырлар жөнүндө айтып бер?"},{"t":"p","h":"<span class=\"pg\" data-n=\"264\">264<\/span>312-көнүгүү. Урумдун Каныбекке айтканын 810-көнүгүүгө окшоштуруп иште."},{"t":"p","h":"318-көнүгүү. «Сен дүйнө» – бул Сарыбай мүнүшкөрдүн күүсүнүн аты. Ошол эле учурда сөз менен дүйнөгө – заманга сын берет. Муну да 310-кенугууге окшоштуруп иште."},{"t":"p","h":"314-көнүгүү. Күлүктүн сыны. Алар белгилери боюнча үч топко топтоштурулган. Алардын ар бирин жатка айтып бер."},{"t":"p","h":"315-кенугуу. Кыраан бүркүттүн сынындагы уч бөлүктүн ар бирин өзүнчө жатка айтып бер."},{"t":"p","h":"316-көнүгүү. Алгыр тайгандын сынын да жатка айтып бер."}],"sub":[{"title":"Г. ЧЕЧЕН СӨЗ","b":3},{"title":"2. Тилекматтын Калыгулга айтканы","b":11},{"title":"5. Чакарбай чечендин сезунен","b":18},{"title":"9. Айтыбар чечендин сөзү","b":31},{"title":"П. СЫНЧЫЛЫК","b":34},{"title":"1. Санчы сынчынын сөзү","b":38},{"title":"2. Баатыр сыны","b":43},{"title":"3. Урумдун Каныбекке айтканы","b":50},{"title":"4. Сен дүйнө","b":53},{"title":"Угуу жана окуу","b":64},{"title":"Өз сөзүңө кошуп сүйлө","b":73}],"section":"ЇХ КЛАСС","pages":[255,264]},{"title":"САНЖЫРГАЛУУ КӨРӨҢГӨ &amp; 45. ФОНЕТИКАЛЫК ТАЛДОО","blocks":[{"t":"h3","h":"САНЖЫРГАЛУУ КӨРӨҢГӨ &amp; 45. ФОНЕТИКАЛЫК ТАЛДОО"},{"t":"p","h":"317-көнүгүү. Мурунчул, капталчыл жана дирилдеме үнсүз тыбыштарды тап."},{"t":"p","h":"Тай ат болгуча, тайдын ээси ит болот (туркмен макалы)). Бир ата он баланы багат, он бала бир атаны талар (уйгур макалы). Итти күчүгүм десен, оозунду жалайт (казак макалы)."},{"t":"p","h":"318-көнүгүү. Кош эринчил, эрин-тишчил, түпчүл үнсүздөрдү тап. Досундун үйүндө тырмагынды алба, касындын үйүндө чачынды алдырба (түркмөн макалы). Жамандык ар кимдин колунан келет, жакшылык ар кимдин колунан келбейт (турк макалы). Философия, вагон, велосипед, волейбол."},{"t":"p","h":"319-көнүгүү. Тишчил, уччул, орточул үнсүз тыбыштарды тап. Эки таш беттешкен жерде – күкүм, эки адам эптешкен жерде – бүтүм (түрк макалы). Бычак өз сабын өзү кеспейт (өзбек макалы). Күн бар жерде баткак да жалтырайт (В. Гёте, немец акыны)."},{"t":"h3","h":"320-кенугуу. Кууш, ачык жана ичке ундуулер барбы? Бул аманат дуйнеде"},{"t":"v","l":["Бирее журет зор болуп,","Бирее журет кор болуп.","Бирее журет кер болуп.","Бирөөгө бирөө эс болуп,","Бирөө макоо-пас болуп (Молдо Нияз)."]},{"t":"p","h":"<span class=\"pg\" data-n=\"265\">265<\/span>321-кенугуу. Адегенде төмөндөгү бир боор өлкөң – Кыргыз мамлекети жөнүндөгү 13 мисалды окуп чык. Эсиңе тутуп ал. Анан бир мисалды танда да, толук талдоо жүргүз."},{"t":"p","h":"Буларды билесиңби? 1.Кыргыз журту жөнүндөгү алгачкы маалымат эң биринчи ирет биздин заманга чейинки 201- жылы болгону кытай тарыхында эскерилген. 2. Энесай кылаасында IV-V кылымдарда алгачкы Кыргыз мамлекети пайда болот. 3. VII кылымдын соңунда, VIII кылымдын башында Барсбек ажонун аракети менен Кыргыз мамлекети Борбордук Азияда таасирдүү саясий күчкө айланган. 4. 840-жылдагы зор жеңиштен кийин Борбордук Азияны негизинен кыргыздар сурап турган. Бул мезгилди академик В.В.Бартольд «Улуу кыргыз державасы доорон сүргөн доор» деп атаган."},{"t":"p","h":"5. Тилекке каршы, кыргыздын жылдызы көкөлөгөн ал доору көпкө созулган жок. Улуу Кыргыз державасы кыйраган. Ошондон тартып жүз жылдап элибиз өз мамлекеттигине жете албай келди. 6. 1917-жылы Россияда Октябрь революциясынын жеңиши менен жаңыча жашоо тарыхы башталды."},{"t":"p","h":"14-октябрда Түркстан АССРинин курамында Кара кыргыз автономиялуу облусу түзүлгөн. 8. 1926-жылдын 1-февралында ал облус Кыргыз АССРине айландырылган. 1986-жылдын 5-декабрында Кыргыз ССРи түзүлгөн."},{"t":"p","h":"9. 81-августу күнү Жогорку Кеңеш көз карандысыздык жөнүндө Декларация кабыл алып, ошондон тартып Кыргызстан көз карандысыз мамлекет болуп калды."},{"t":"p","h":"10. 1992-жылдын 2-мартында Кыргыз Республикасы Бириккен Улуттар Уюмуна мүчө болуп кирди. 11. 1992-жылдын 18-декабрында Кыргызстандын Мамлекеттик Гимни кабыл алынды. 12. 1998-жылдын 5-майында Кыргызстандын жаңы демократиялык Конституциясы кабыл алынып, ошол күндөн өлкөбүз Кыргыз Республикасы деп атала баштады. 13. 1995- жылдын августунда «Манастын» миң жылдык маараке тою өткөрүлдү («Эркин Тоо» гезити.)."},{"t":"h3","h":"СЫНАК"},{"t":"p","h":"Сынактын максаты – экөө: биринчиси – бардык белет боюнча окуучулар өзүн өзү текшерет (бул каалоого жараша); экинчиси – колуңа тийген белет боюнча жазуу түрүндө толук фонетикалык талдоо жүргүзүү (бул милдеттүү). Сынактын тексттери алдын ала даярдалат: ар бир текст номурланып белетке жазылат. Сынак берүүдөн талдоону толук жана эң мыкты өздөштүргөн окуучулар бошотулат жана алар сынак алууда, аткарылган ишти текшерүүдө мугалимге тикелей ` жардам беришет."},{"t":"v","l":["<span class=\"pg\" data-n=\"266\">266<\/span>Биринчи белет.","1. Фонетика деген эмне?","2. Боорунда буту жок,","Жылан байкуш кантти экен?"]},{"t":"p","h":"Асанкайгынын сөзүнөн, XIV кылымда жашаган"},{"t":"p","h":"Экинчи белет"},{"t":"v","l":["1. Тыбыш кандайча жаралат?","2. Асмандан булут сөгүлөт,","Аяктап мөндүр төгүлөт."]},{"t":"p","h":"Кетбука ырчыдан, X ШП кылымда өмүр сүргөн"},{"t":"p","h":"Үчүнчү белет"},{"t":"v","l":["1. Үндүү тыбыштардын эрежесин айт.","2. Алыска сапар алып,","Үн салып кербен кетет.","Тааныштай токтой калып,","Көк менен булут көчөт."]},{"t":"p","h":"Токтогул ырчыдан, ХГУ к. жашаган Төртүнчү белет 1. Жумшак үнсүздөр кайсылар? Алар кандайча жаралат?"},{"t":"p","h":"2. Өткөн өмүр – аккан суу,"},{"t":"p","h":"Калган көңүл – чыккан жан."},{"t":"p","h":"Толубай сынчыдан, ХГУ к. жашаган Бешинчи белет"},{"t":"v","l":["1. Уяң үнсүздөрдү ата. Алар кандайча жаралат?","2. Бул уулуң түзүк экен, Алдаш аты","«Ат качырбас боз айгыр» атак алып,","Көкөлөп көтөрүлөр мартабасы."]},{"t":"p","h":"Санчы сынчыдан, ал ХУГ-XVII кк. ортосунда жашаган"},{"t":"p","h":"Алтынчы белет 1. Каткалаң үнсүздөр кайсылар? Алар канд айча жаралат?"},{"t":"p","h":"2. Чарымды коюп этти айтам,"},{"t":"p","h":"Чеченден калган кепти айтам."},{"t":"p","h":"Чонду ырчыдан, 1 840-1888-жылдарда жашаган"},{"t":"p","h":"Жетинчи белет"},{"t":"v","l":["1. Жарылма үнсүздөр кайсылар?","2. Көз ачканда көргөн жер,","Айдаган малым өнгөн жер.","Толкунуң ай, шарың ай,","Токоюң ай, талың ай."]},{"t":"p","h":"Солтобай ырчыдан, 1838— 1918-жылдарда жашаган"},{"t":"h3","h":"<span class=\"pg\" data-n=\"267\">267<\/span>Сегизинчи белет"},{"t":"v","l":["1. Жылчыкчыл үнсүздөрдү ата.","2. Атадан жаман туулса,","Адашып калган көчкө окшош.","Көкүрөк туюк кээ адам","Сокур болгон көзгө окшош.","Нурдин Молдо"]},{"t":"h3","h":"Тогузунчу белет"},{"t":"v","l":["1. Кош эринчил үнсүздөрдү айтып бер.","2. Чаңсыз ак кар буркулдап,","Учурунда кыш жакшы.","Жумурай журтка береке,","Учурунда күз жакшы.","Айтыке ырчы"]},{"t":"h3","h":"Онунчу белет"},{"t":"v","l":["1. Әрин-тишчил үнсүздөрдү айтып бер.","2. Касиеттүү Ысык-Көл","Жылдыздап аккан булагы,","Ат боорунан буралат","Бетеге менен шыбагы.","Алдаш Молдо"]},{"t":"h3","h":"Он биринчи белет"},{"t":"v","l":["1. Тишчил үнсүздөрдү жана жоон үндүүлөрдү ата.","2. Уй пул болор,","Кул бий болор,","Тоо токол болор,","Талаа токой болор,","Аяк адам баш болор","Баш адам пас болор.","Калыгул"]},{"t":"h3","h":"Он экинчи белет"},{"t":"v","l":["1. Уччул үнсүздөрдү жана ичке үндүүлөрдү ата.","2. Журт намысын сактаган —","Көсөмдүктүн белгиси,","Жамандыкты кечирүү —","Айкөлдүктүн белгиси.","Арстанбек ырчы","<span class=\"pg\" data-n=\"268\">268<\/span>Канатын тарап каркылдап,","Көлдөгү жаткан куу карыйт.","Эшманбет ырчы"]},{"t":"h3","h":"Он төртүнчү белет"},{"t":"p","h":"1. Эринчил жана ачык үндүүлөрдү, түпчүл үнсүздөрдү ата. 2 Жакшы кийсең, жаш балдар,"},{"t":"v","l":["Көйрөндөнүп элирбе.","Жаш кезинде кызмат кыл,","Баркынды билген элине.","Токтогул"]},{"t":"h3","h":"Он бешинчи белет"},{"t":"p","h":"1. Созулма үндүүлөр кыска үндүүлөрдөн эмнеси менен"},{"t":"p","h":"Созулма үндүү бир тыбышпы,"},{"t":"v","l":["2. Кенештуу сөздүн баарысы","Элде болот турбайбы.","Бүт береке, тирчилик","Жерде болот турбайбы.","Барпы"]},{"t":"h3","h":"Он алтынчы белет"},{"t":"v","l":["1. Мурунчул жана шуулдама үнсүздөрдү ата.","2. Аркырап аккан кашка суу","Адырдан туйлап кулаган.","Түн уйкумда ошол жер","Түшкө кирсе кубанам.","Казыбек Мамбетемин уулу","Он жетинчи белет","1. Кайсы там галар эки тыбышты билдирет?","2. Кош сентябрь, кош ноябрь айлары,","Өткөн жылдын кооз июнь, майлары,","чебер келтирип,"]},{"t":"h3","h":"<span class=\"pg\" data-n=\"269\">269<\/span>Он сегизинчи белет"},{"t":"p","h":"1. Эки тамга менен белгиленип, бирок бир эле тыбышты туюндурган фонемалар кайсылар?"},{"t":"v","l":["2. Капчыгай сен бир туюк жаткан жүрөк,","Таранып далай туйгун кылат түнөк.","Тилдей жол, типтик тескей, эшилме кум,","Көк тоодон улар учат канат күүлөп.","Алымкул төкмө","Он тогузунчу белет"]},{"t":"p","h":"1. Үндүү тыбыштар менен үнсүз тыбыштар бири-биринен эмнеси менен айырмаланат?"},{"t":"v","l":["2. «Алты» – деп оозун ачканда,","Бөдөнө кетти кутулуп,","Түлкү калды жутунуп.","Тоголок Молдо"]},{"t":"h3","h":"Жыйырманчы белет"},{"t":"p","h":"1. Каткалаң үнсүздөр менен жумшак үнсүздөр бири-биринен эмнеси менен айырмаланат?"},{"t":"v","l":["2. Бүрдөгөн тал бүрү түшсө, бир чырпык,","Алып кетет керек деген эл кыркып.","Мункансан да булбул-сулбул болбоймун,","Аз күн сайрап, тили катчы бир чымчык.","Калык"]}],"sub":[{"title":"320-кенугуу. Кууш, ачык жана ичке ундуулер барбы? Бул аманат дуйнеде","b":5},{"title":"Сегизинчи белет","b":35},{"title":"Тогузунчу белет","b":37},{"title":"Онунчу белет","b":39},{"title":"Он биринчи белет","b":41},{"title":"Он экинчи белет","b":43},{"title":"Он төртүнчү белет","b":45},{"title":"Он бешинчи белет","b":48},{"title":"Он алтынчы белет","b":52},{"title":"Он сегизинчи белет","b":54},{"title":"Жыйырманчы белет","b":59}],"section":"ЇХ КЛАСС","pages":[265,269]},{"title":"§ 46. МОРФОЛОГИЯЛЫК ТАЛДОО","blocks":[{"t":"h3","h":"§ 46. МОРФОЛОГИЯЛЫК ТАЛДОО"},{"t":"p","h":"1. мүчөлөр боюнча талдоо 322-кенугуу. Көчүрүп жаз. Анан уңгу менен мүчөнү тик сызык менен ажырат."},{"t":"p","h":"Чандарды жутуп, абаны тазартууга көмөктөшүүчү кымбат нерселердин бири – өсүмдүктөр. Ал эми өсүмдүктөрдүн ичинен чанды көп соргону – дарактар. Илимпоздордун эсептөөсүнө караганда 50 чарчы метр жердеги токой 50 тонна чан жутат («Моенгу» гезити)."},{"t":"p","h":"323-кенугуу. Унгу менен туунду сездерду айырмалап айтып бер. Жылаажын, ачкыч, откор, керимсел, ак жуумал, көгөр, күлкүчү, кымыз, көөкөр, сүзмө, эжигей, карандыз, жайла-. та, санаарка, ачыркануу, сууса, ырда, көз айнек, кат, барак, <span class=\"pg\" data-n=\"270\">270<\/span>аюу, сүлөөсүн, урушчаак, алгыр, бермет, санжыра, шашкалак, тебенек, түпкүч, үймөк, миллион, жүгөн, сугатчы, миллиард, уранды."},{"t":"v","l":["Үл г ү: күз – уңгу, күзүндө – туунду сөз.","324-көнүгүү. Татаал сөздөрдү түрү боюнча айтып бер."]},{"t":"p","h":"Темир жол, Жогорку Кеңеш, КМШ, райадминистрация, кеп-кеңеш, очор-бачар, жардам бер, облкеңеш, арсак-терсек, келе жатат, оргу-баргы, ишеним кат, басма сөз, БУУ, сактык кассасы, эртели-кеч, эч качан, АКШ, бала-бакыра, чоң шашке, таңга жуук, келим-кетим, көз байланганда, алышбериш, профсоюз, таң каракчысы, бетме-бет, эл-журт, сойлоп жүрүүчүлөр, айыл-апа, ырыс кесер."},{"t":"p","h":"325-кенугуу. Морфемаларга ажырат."},{"t":"p","h":"Мен бирөөлөрдү көргөндө, ичимен өзүмө суроо беремин: «Бул адам кыргызга, элге эмне жакшылык кылды экен?» Жакшылык жасоо адамдын кудай, тирүүлүк, аалам алдындагы парзы, милдети эмеспи. Сезими, ою, ниети, ыйманы таза эмес адамдар эч качан жакшылык жасоону ойлошпойт. Алар өзүн, рухий дүйнөсүн, жүрөгүн тазартууну да унутушкан, акыл эшигин биротоло жаап алышкан. Ушул мезгилде, татаал заманда чыныгы атуул элди, улуттук намысты, кызыкчылыкты биринчи коюуга тийиш, эрөөлгө чыккан эрлердей гана даңк, мансап, көр дүйнө азгырыктарына алданбай, ак парзын таза аткарууга тийиш (К. Жусупов)."},{"t":"p","h":"Үл г ү: бирөөлөрдү – мында төрт морфема бар."},{"t":"p","h":"1) бир – уңгусу, 2) -өө – жамдама сан атоочтун мүчөсү;"},{"t":"p","h":"3) -лер – көптүк сандын мүчөсү, 4) -ду – табыш жөндөмөнүн мүчөсү."},{"t":"p","h":"326-көнүгүү. 325-көнүгүүдөн уланды мүчөлөрдү таап жаз жана алардын ээрчиме мүчөлөрдүн кайсы түрүнө кире тургандыгын аныкта."},{"t":"p","h":"Үлг ү: -лер – ээрчиме, анын ичинен оошмо мүчө. 327-кенугуу. 325-көнүгүүдөн куранды мүчөлөрдү таап көчүр жана алардын өнүмдүү, аз өнүмдүү жана сенек мүчөлөрдүн кайсынысына кире тургандыгын аныкта."},{"t":"p","h":"Үлгү: ойлошпойт, мында -ло – куранды мүчө, анын ичинде өнүмдүү мүчө."},{"t":"p","h":"Көрөгөч Маамыт. 1. Кээ бир сөздөргө мүчө уланганда, уңгунун турпаты өзгөрүп кетерин унутпа. Мисалы: уйку+ла=укта, жумуш+ а=жумша, бул+нын=мунун, эрин+ым=эрдим, бала+лар=балдар, <span class=\"pg\" data-n=\"271\">271<\/span>көм+ып=көөмп, сеп+ып=сээп ж.б. Мындай учурларды талдаганда «укта» деген сөздүн уңгусу уйку, ага -та (-ла) мүчөсү уланганда, сөздүн турпаты ук болуп өзгөрүп кетти деп айтуу керек."},{"t":"p","h":"2. Китептин этегиндеги «Серектин сыр сандыгы» кулагыңа күмүш сырга. Ал унутулгандарды эске салат."},{"t":"p","h":"328-кенугуу. Уланды мүчөлөрдү тап жана анын кайсы түргө кире турганын аныкта."},{"t":"p","h":"Ресторанга коён менен арстан кирип калышат."},{"t":"p","h":"– Мага сабиз менен капуста бериңиз, – дейт коён официантка."},{"t":"p","h":"– Сиздин шеригиңиз ачка эмеспи?"},{"t":"p","h":"– Ал ачка болсо, экөөбүз ушул жерге келет белек,-дептир бакыраң көз («Эркин Тоо» гезити)."},{"t":"h3","h":"Удаалаш талдоо"},{"t":"p","h":"1) бир окуучу бир сөздү гана талдайт; 2) талдоо парта боюнча жүргүзүлөт жана ага бардык окуучу катышат; 8) талдоо оозеки болот; 4) ар бир окуучу тез жана шартылдап сүйлөөгө тийиш; 5) талдай албагандар доскага чыгып, өзүнө тиешелүү сөздү жазат жана талдоого жардам берүүчү материалды ичинен окуйт, анан партадагы окуучулар бүткөн кезде гана талдоого кезек алат – бул анын айып тартканы."},{"t":"p","h":"329-кенугуу. Он сөз таап, оозеки удаалаш талдоо жүргүзгүлө. 330-кенугуу. Удаалаш талдоонун шарты менен иште."},{"t":"p","h":"1. Бар + ып. 2. Оку + ган. 3. Жарыя + ла. 4. Өлкө + лөр."},{"t":"p","h":"5. Жаз + уу. 6. Бол + ду. Т. Кел + иниздер. 8. Биз + дин."},{"t":"p","h":"9. Үй + дуку. 10. Санаа + сы. 11. Кун + ден. 12. Азыр + кы."},{"t":"p","h":"13. Араба + кеч. 14. Бий + ле. 15. Жаш + ар. 16. Мектеб + им."},{"t":"p","h":"331-кенугуу. Удаалаш талдоонун шарты менен иште."},{"t":"p","h":"1. Бар + ыш ты. 2. Оку + са к. 3. Наадан + дар + га."},{"t":"p","h":"4. Душман + ың + ды. 5. Азуу + су + нан. 6. Бий + лик + тин."},{"t":"p","h":"7. Жакшы + лык + ка. 8. Баары + быз + ды. 9. Кел + гин + – дер. 10. Эне + лер + и. 11. Жаз + а + быз. 12. Ал + дыр + т."},{"t":"p","h":"13. Кабар + ла + ш. 14. Ыр + да + са. 15. Кет е + т."},{"t":"p","h":"332-кенугуу. Удаалаш талдоонун шарты менен иште."},{"t":"p","h":"1. Абаз + кей + лук + түн. 2. Абай + ла + бай + сын + бы."},{"t":"p","h":"3. Агайын + чы + ла + п. 4. Адам + гер + чилик + сиз. Ө. Адаш + тыр + ды + нар. 6. Адис + теш + тир + ил уу. 7. Ажыра + ш + тыр + уу + га. 8. Оку + бай + сыңар. 9. Азык + тан + ды- <span class=\"pg\" data-n=\"272\">272<\/span>10. Айкын + да + л +ган. 11. Айнек + те + т + тир + – уу. 12. Айны + кей + лик + ке. 13. Айрек + те + ген. 14. Айыл + чы + ла+т+ тыр + уу. 15. Акмак + та + н + уу. 16. Акыл + ман + дуу + лук + ту. 17. Ал + сыз + да + н + дыр. 18. Алдей + ле + ш. 19. Албуут + та + н + уу. 20. Ант + таш + ты."},{"t":"h3","h":"Сөз түркүмү боюнча талдоо"},{"t":"p","h":"333-кенугуу. Төмөндөгү төрт топко бөлүнгөн сөздөр Өз ордундабы? Өз ордунда эместерин кайсы сөз түркүмүнө кийирүүгө болот?"},{"t":"p","h":"1. Зат атооч сөздөр: өнөр, каршы-терши, жаңыртат, ар бир, сабаттуу, бүт, кырк беш, капырай, күлдүрт-күлдүрт, шаркырады, боюнча, бах, го, сыягы, ошону, менен, жайында, даярдап."},{"t":"p","h":"2. Сын атооч сөздөр: үчүн, китеп, демек, күрөн, алтымыш, сырдуу, достор, толкун, кулпунат, тармал, эчактан, нак."},{"t":"p","h":"3. Тактооч сөздөр: гүлкайыр, ылдамыраак, тоодо, илбирс, багылат, жоогазындай, жөнүндө, миң, мунуку, алыстагы, баса, ыя."},{"t":"p","h":"4. Жандооч сөздөр: бирок, анткени, эле, соң, мүмкүн, буйруса, сага, жана да, эч качан, башкача айтканда, же болбосо, биздин оюбузча, өз, талп, бөжөң, чымкый."},{"t":"v","l":["334-кенугуу. Сөз түркүмдөрүн тап.","Булдурт, булдурт, булдурт деп,","Булактарга тил кирди.","Булаңгыр көк күчөтүп,","Булбулдарга үн кирди.","Буурул жорго мингизип","Булактаган дүнүйөң —","Бу жарыктын көйгөйү","Бүтпөстүгүн ким билди?","Хайт! Хайт! Хайт! Хайт! Хайт!","Алда үй! Алда үй! Алда үй! Алда үй!"]},{"t":"p","h":"О. Көчкөнов 335-кенугуу. Сөз түркүмү боюнча талда."},{"t":"p","h":"Түнкү саат эки болуп калган. Асмандагы жылдыздар бажырайып, ар бири өзүнчө балбылдайт. Ай да көтөрүлүп, жанагыдан жарыгыраак тартты, Сары-Өзөктүн эрме чөлүнө шоола чачып төбөдө турат. Жылдыздуу көктүн астында керилип кыйырсыз Сары-Өзөк жатат күүгүмдөй түнөрүп. Береги төөлөрдүн өркөчтүү караандары, арасында бороондуу Каранардын бараандуу карааны, андан эки тараптагы кыр-жондордун өйдө-ылдый күүгүм жээги байкалат. Башка эчтеме <span class=\"pg\" data-n=\"273\">273<\/span>көрүнбөйт, темир жолдун эки тарабы тең кыйырына чейин караңгы түндүн астында жатат. Шамал гана акырын ышкырып, жал шагылдын арасындагы таштанды кагаздарды дирилдете кубалап жүрөт (Ч.Айтматов)."},{"t":"v","l":["Сын. зат. сан этиш","Үлгү. Түнкү саат эки болуп калган.","336-кенугуу. Сөз түркүмү боюнча талда.","– Өзүңдүн ишин кандай?","– Әки тогуз чөйчөк, бир тогуз кара аяк кырдым.","Сарыбай Мадыл жакка бет бурду:","– И, анчаны эмне кыласын?..","– Кер оокатка аралжы болбойбу..."]},{"t":"p","h":"– Йе, – деп күрсүндү Сарыбай, жүзүнө кайгылуу жылмаюу чыгып,- көр оокат ошону менен бутелчу беле? Көрксүз, калпыс кылып үч тогузду жасагандан көрө, жакшылап, сырын, чийимин, кырын келиштирип, жеңил, урунган киши кубангыдай кылып, үчтү гана жасаса. Жакшы жасалса кымбат буюм, жаман жасалса кендебеде жатар итаяк..."},{"t":"p","h":"– Жакшы эле,-деди Мадыл чарчаңкы үшкүрүп."},{"t":"p","h":"– Сууга кайнаттынбы аябай шакылдатып? Канча кайнаса, ошончо бекем болот дечү эле Кулан акем, кийин жарылып кетпейт, өнөрүңө да, өзүңө да наалат калбайт дечү эле."},{"t":"p","h":"– Түзүк эле... (Т. Касымбеков)."},{"t":"v","l":["ат. зат. ат.","Үлгү. – Өзүндүн ишин кандай?"]},{"t":"p","h":"337-кенугуу. Оозеки (ар бир окуучу беш сөздөн) талда. Тез. Канчалык көп катарды талдасан, ошончолук билимиң артат."},{"t":"v","l":["1. Жигер. Ийилчээк. Кажылдады. Аттиңай. Кана.","2. Кажыбас. Уу-дуу. Жана. Бейм. Ошентип.","3. Мин. Быдылда. Супсак. Әй. Демек."]},{"t":"p","h":"4. Томого. Кыруу-кыруу. Сыяктанат. Он миң. Ошол."},{"t":"p","h":"5. Толорсук. Үстөмөн. Үстүртөн. Үтүктө. Үп."},{"t":"p","h":"6. Ырымчыл. Ырыскы. Ыракаттанды. Ырсак-ырсак. Ыркыра."},{"t":"p","h":"7. Эми. Эмчи. Әндекей. Эпилдеген. Эрбен-сербен."},{"t":"p","h":"8. Жогдор (теенун кежигесиндеги тутам жун, куштун желкесиндеги жуну). Жипкируу. Жооптуу. Жооткот. Жоромолдоп."},{"t":"p","h":"9. Жергем. Эжигейдей. Токсон. Жулк. Журдай."},{"t":"p","h":"10. Сон. Бек-бек. Чырк-чырк. Кудайга шүгүр. Керек."},{"t":"p","h":"11. Абзел. Бирок. Жараша. Гана. Ошондуктан."},{"t":"p","h":". 12. Белем. Тийиш. Кездей. Шексиз. Жуденку."},{"t":"p","h":"<span class=\"pg\" data-n=\"274\">274<\/span>18. Жыбылжы. Мышыкча. Бизчелик. Күзгүсүн. Бирпаста."},{"t":"p","h":"14. Илгери-кийин. Кыйкырып жиберди. Өх.Түт. Күп."},{"t":"v","l":["15. Дүп. Акылдуу. Дал. Гой. Ыктымал.","16. Жыйырма. Жыйналыш. Качан. Тез. Жыгылыштуу."]},{"t":"p","h":"17. Жылмала. Жылдыздуу. Жылаажын. Жылымчы. Жымжырт."},{"t":"v","l":["18. Жыпар. Заардуу. Мыйзам. Ардагер. Атуул.","19. Инсан. Зыкым. Зыр. Зырпылда. Зээн.","20. Идирек. Ийгиликтүү. Әй. Илгертеден. Иймекей."]},{"t":"p","h":"21. Илбериңки. Илбээсин. Илки. Интеллигент. Ириде."},{"t":"p","h":"22. Итиренде. Итапкан (бир топ). Итабар (бир кыйла). Ичиркенүү. Тетирисинче."},{"t":"p","h":"2З. Йод. Каадалуу. Кабелтең. Кагылайын. Кагынчык."},{"t":"p","h":"24. Бештен эки. Кажылдак. Кадимкидей. Кайдадыр. Каймана."},{"t":"p","h":"25. Бали. Кайсар. Кайсы. Кайпакта. Какшаал."},{"t":"p","h":"26. Калама. Калбык. Калбырла. Камбыл. Кандайча."},{"t":"p","h":"27. Канчанчы. Каңырыш. Капкайда. Капорто. Капыстан."},{"t":"p","h":"28. Дейре. Карагаттай. Карбаластап. Карс. Бейм."},{"t":"p","h":"29. Качанаак. Качантан. Турпат. Болжолу. Кезүүлөшүү."},{"t":"p","h":"30. Келегей. Кемшеңдеди. Кербез. Кечке маал. Кечээ."}],"sub":[{"title":"Удаалаш талдоо","b":21},{"title":"Сөз түркүмү боюнча талдоо","b":36}],"section":"ЇХ КЛАСС","pages":[270,274]},{"title":"§ 47. СИНТАКСИСТИК ТАЛДОО 1. Сөз айкашы боюнча талдоо","blocks":[{"t":"h3","h":"§ 47. СИНТАКСИСТИК ТАЛДОО 1. Сөз айкашы боюнча талдоо"},{"t":"p","h":"338-кенугуу. Төмөнкү тексттен атоочтук жана этиштик сөз айкаштарын өз-өзүнчө топ-топ кылып жаз."},{"t":"p","h":"Биринчи кат, өз алдыңча толгонуп, ойго чөмүп, кыялга батып, кыйынчылыктар жөнүндө эскертем, ошол жол, терип-тепчип сөз кыл, омоктуу нерселер, менин пикирлерим, байкендин далалаты, көздөгөнүңөн кайтпа, аруу максат, чоң мүдөө, мерчемди көздөйм, кыялкеч өспүрүм, альпинисттер жөнүндө окуйт, улуу тоо, жалама зоолор, шайы кетти, эшилген куюлмалар, муундары калчылдайт, асканы карады, олуттуураак ойлонсок, аппак боз үй, нөшөрлөгөн жамгыр, улуган карышкыр, гүлдөрдү гана көргүсү келген, уулуу тикенектер, сүрөтчүнүн чебердиги, ар түркүн кыйынчылыктар, татаал сыноолор, кыйынчылыктарга майышпа, тоскоолдуктардын өзөгү, шымаланып жолго чыгуу, алдуу-күчтүү азамат."},{"t":"p","h":"ү: Биринчи кат. Мында кат – багындыруучу, биринчи – багынынкы түгөй. Атоочтук сөз айкашы."},{"t":"p","h":"<span class=\"pg\" data-n=\"275\">275<\/span>339-кенугуу. Окуп чык. Анан сөз айкаштары боюнча көчүр."},{"t":"h3","h":"КОРГОЛ АҢГЕМЕСИНЕ КАЙРА ТҮШТҮ"},{"t":"p","h":"– Үч жатакчынын үйүнөн аттанып, жолдо бир үйгө түштүк. Эшиктен Током экөөбүз кирсек, бир колу менен куурай жагып, бир колу менен кууругучун кармап, буудай кууруп жаткан орто жашаган, балгыр сары тоголок аял бар экен. Бизди адегенде жактырмаксан болуп: «Келиңиздер», – деп, мурдун чүйрүп койду. Током төр жакка өтүп, комузун черте баштады эле, баягы аялдын кабак-башы оңоло түшүп, Токомду кыя карап калды. Током мен жакка көзүн кысканда, куурайды шыкап жага баштадым."},{"t":"v","l":["...Омур чиркин опосуз,","Өтөсүң да кетесиң.","Бул алдамчы дүйнөдөн","Түбүнө жетпей кетесин.","Калган көңүл, чыккан жан,","Кайтып келбейт экенсиң..."]},{"t":"p","h":"Ушинтип Током кара өзгөй кишинин пейли менен жоругун айтып жатканда, буудайдын жыты мурунду жарып жиберди. Аны баягы аял сезген жок. Током комузу менен: «Буудай күйдү, буудай күйдү, кара өзгөй» дегенсип сүйлөтүп чертти. Бир-эки жолкусунда бүдөмүк түшүнгөнсүп турат эле, үч-төрт жолу черткенде, казанын карап, капкара болуп күйүп калган буудайын көрө коюп, аял кыпкызыл болуп уялып кетти. эскерүүсүнөн Үлг ү: 1. Үйүнөн аттанып. 2. Жатакчынын үйүнөн. 3. Үч жатакынын... (калганын да ушул өндүү иште)."},{"t":"p","h":"340-көнүгүү. Текстти оку. Ээрчишууге, таандык байланышка тиешелүү сөз айкаштарын таап жаз."},{"t":"h3","h":"ЖЭЭНБАЙ МУКАМБАЕВ"},{"t":"p","h":"Жээнбай Мукамбаев 1929-жылы Ысык-Көлдүн Түп районундагы Күрмөнтү айылында туулган. 1950-жылдары Тажикстандын Жергетал районунда мугалим болуп иштеп барып, 1954-жылы «Кыргыз тилинин Жерге-Тал говору» деген темада кандидаттык диссертациясын жазган. Андан соң КМУда иштеп, кыргыз тилинин диалектологиялык сөздүгүн түзүп, «Эл ичи – өнөр кенчи», «Кыргыз тилинин диалектологиялык очерки», «Памирдик-каратегиндик кыргыздарда», «Кыргыз элинин табышмактары, жаңылмачтары, калптары», «Жомоктор», айтор, жалаң аталыштары эле эки-үч – баракты ээлеген илимий зор эмгектерди жараткан."},{"t":"p","h":"<span class=\"pg\" data-n=\"276\">276<\/span>– Бул кишини эч коркпостон эле азыркы күндүн Махмуд Кашкарысы десе болот, – дейт Абдулхай агай,— өзүнчө эле басып жүргөн энциклопедия эле. Агайды тилчи деп коюшка болбойт. Бул киши тарыхчы, этнограф, географ, философ, ойчул, өзгөчө таланттуу жазуучу, улуу педагог, керемет адам эле. С. Курманова"},{"t":"h3","h":"СӨЗДҮК"},{"t":"p","h":"говор – тилдин жергиликтүү диалектилик бөлүнүштөрүнүн эң кичине тарамы"},{"t":"p","h":"диссертация – окумуштуулук даража алуу үчүн жазылган илимий эмгек"},{"t":"p","h":"диалектология – тил илиминин диалектилерди изилдөөчү бөлүмү этнограф – этнография боюнча адис окумуштуу"},{"t":"p","h":"341-кенугуу. Адегенде оку, мазмунун эсинде сакта. Анан тексттеги башкарууну өзүнчө, ыкташууну өзүнчө тизмелеп жаз."},{"t":"h3","h":"ЧЫҢГЫЗ АЙТМАТОВДУН ЧЫГАРМАЛАРЫ"},{"t":"p","h":"Сүрөткердин көркөм дөөлөттөрү дүйнө жүзүнүн жүздөн ашуун тилинде 330 жолу басылып, нускасы 20 миллионду түздү. Ал эми орус жана мурдагы СССРде жашаган элдердин тилдеринде эки жүздөн ашык жолу 21 миллион нускада басылып чыкты. ЮНЕСКОнун 1974-жылкы эле эсеби боюнча чыгармаларынын дүйнө элдеринин тилдеринде көп басылышы жана нускасы жагынан Чыңгыз Айтматов жазуучулардын алдына чыккан. Әгер жазуучунун адабий картасын түзсөк, асмандагы жылдыздардай бажырап көз жоосун алмак. «Айтматовдук энциклопедия»"},{"t":"h3","h":"2. Сүйлөмдүн түрлөрү жана сүйлөм мүчөлөрү боюнча талдоо"},{"t":"p","h":"342-кенугуу. Сүйлөмдүн түрлөрү боюнча талда."},{"t":"p","h":"т Кара булут калындап, кун күркүрөп, чагылган чагылып, жамгыр төгө баштады. Ажар менен Каныбектин өтмө катарынан суу өттү. Көзгө сайса көрүнгүс караңгы, жол тайгак (К.Жантөшев)."},{"t":"v","l":["П","– Каныбек!","= Ыя?","– Уктуңбу?","– Әмнени?","2716"]},{"t":"p","h":"<span class=\"pg\" data-n=\"277\">277<\/span>– Карышкырдын унун!.."},{"t":"p","h":"– Жок!.. Тан атып келе жатат. Балким, тийбес."},{"t":"p","h":"Карышкырлардын улуганы жакындады. Ажардын коркунучу күч алды (К.Жантөшев)."},{"t":"p","h":"Ш «Атанын тагдыры». Төрт көшөгөлүү драма. Окуя Ысык- Көлдө өтөт. Биринчи көшөгө. 1946-жылдын жайы. Акылбектин үйү."},{"t":"v","l":["Зуура. Әмне кылам? Кетүүдөн башка арга жокпу?","Бурулдун үнү. Кыз! Кыз!.. Акылындан адашпа!"]},{"t":"p","h":"Акылбектин үнү. А бизди кантесин, Зуураш?.. Таштайсынбы?.. Өзүндү уул ордуна тутуп жүрбөдүк беле... (Б. Жакиев). ТУ Сага муздак сууну ичууге болбойт. Угуп жатасынбы? Эскертпей, айтпай коюуга мумкун эмес. Мен сенден ит кейнекту мурда жырткан улуумун."},{"t":"p","h":"Сага башканы укпай коюуга болор. Бирок мени угууга тийишсиң."},{"t":"h3","h":"Үлгү: Кара булут калыңдап, күн күркүрөп, чагылган"},{"t":"p","h":"чагылып, жамгыр төгө баштады. Айтылышы боюнча жай, түзүлүшү боюнча татаал сүйлөм. Тутумундагы 4 сүйлөмдүн биринчиси – жайылма, калган үчөө – жалаң сүйлөм. Төртөө тең эки тутумдуу сүйлөм."},{"t":"p","h":"348-көнүгүү. Адегенде текстти окуп чык, мазмунун көңүлүнө түй. Анан класстагы окуучулар үч тайпага бөлүнөт. Ар бир тайпа текстти (1, П, Ш белгилери боюнча) таяк кармашуу (же калыс кагаз) менен бөлүп алат. Тайпанын мүчөлөрү сүйлөм мүчөлөрүн талдоону топтошуп жүргүзөт. Кайсы тайпа туура жана толук талдаса, ошол жарыштын жеңүүчүсү болот."},{"t":"h3","h":"ДИНАРА АСАНОВА"},{"t":"p","h":"Ї Деги Динара Асанова деген ким эле? Мындай ысымды укканда, биздин элибиз эле эмес, бүткүл дүйнөдөгү кино сүйүүчүлөр кусалуу эскеришет. Анын бала чагын эскерүү да жүрөктү өйүтөт. Ал согуштун суук күндөрүндө дүйнөгө келген. Атасы согуштан кайтпай калган. Динара адегенде «Кыргызфильм» студиясында режиссердун ассистенти, монтаждоочу болуп иштеп жүрдү. Эки жылдан кийин ВГИКтин режиссёрлук факультетине өттү. ВГИКти бүткөн сон, «Ленфильмде» режиссер болуп иштеген. Ал «Рудольфио», «Тоңкулдактын <span class=\"pg\" data-n=\"278\">278<\/span>башы эмне үчүн оорубайт», «Боз балдар», «Жан дүйнөнүн ачкычы», «Таштанды», «Чыр-чатактын балдары», «Кайгы», «Сен эмнени тандап алат элең?» өңдүү көптөгөн кино тасмаларды жараткан. Ал 1985-жылы Мурманскиде «Бейтааныш» фильмин тартып жүрүп, өмүрүнүн гүлгүн 42 жаш курагында кайтыш болгон."},{"t":"p","h":"П Динара Асанова эн мыкты он керкем тасма тарткан. Анын жетинчи көркөм тасмасы – «Боз балдар». Бул – Динаранын чыгармачылыгынын туу чокусу. Ушул тасмасы ага укмуштай атак-даңк алып келди. Ага каттар туш-туштан жамгырдай жаады. 17 жаштагы К. Илясов деген бала катында минтип жазган: «Мен өмүрүмдө кинодо биринчи жолу ыйладым. Тим эле кино мен жөнүндө болуп жаткандай. Мен экранды карап отурдум, жаагымдан ылдый жаштар агат. Өз тагдырым жөнүндө ойлодум, кандай гана көптөгөн каталарды кетиргем. Узак жылдар мени менен милиционерлер убара болуп келген, мектепте да менин айымдан кыйналышчу. Баарына өзүм күнөөлүүмүн». Динаранын тасмалары жалаң балдар менен өспүрүмдөргө эле арналган эмес. Анын тасмалары адамгерчиликтин улуулугуна, жакшылыкты көздөөгө, назиктикке, асылдыкка чакырат."},{"t":"v","l":["Ш","Динаранын кунделугунде мындай саптар бар."]},{"t":"p","h":"1. Омур бою быкшып күйгөндөн көрө бир жолу дүрт этип күйгөн артык."},{"t":"p","h":"2. Менин оюмча, жүрөгү таза, ой-максаты тунук адамдар гана өзүндө болгон нерсени элге берүүгө акылуу."},{"t":"p","h":"3. Бардыгын угам, бирок өз билгенимди кылам."},{"t":"p","h":"4. Кәэде көрөмандар мага мындай суроо менен кайрылышат:"},{"t":"p","h":"«Әмне себептен сиз өзүңүздүн көркөм тасмаларыңызда ток этер бүтүм чыгарбайсыз?» А мен бүтүм чыгарбаймын. Себеби көрөмандар өздөрү ой жүгүртүп, өздөрү бүтүм чыгарышы керек..."},{"t":"p","h":"5. Мен өзүм дагы тынымсыз Өзгөрүп турам."},{"t":"p","h":"6. Кино – адамдарды жана өзүмдү аңдап түшүнүүнүн бирден-бир айкын жолу (Б. Чотурова)."},{"t":"h3","h":"344-кенугуу. Адегенде оку жана мазмунун бил. Текст 8 бөлүктөн"},{"t":"p","h":"турат. Ар бир бөлүк 2-3 окуучуга берилет. Алар сүйлөм мүчөлөрүн чогуу талдашат."},{"t":"h3","h":"<span class=\"pg\" data-n=\"279\">279<\/span>АЛЫМ АЖЫМАТОВДУН АЛПТЫГЫ"},{"t":"p","h":"Алым Ажыматовдун атагы кыргыз элине аттын кашкасындай маалым. Ал жөнүндө жазуучу Ә. Медербеков «Кичинекей алп» аттуу повесть, М. Абдукаримов «Күтүлбөгөн окуя» деген аңгеме, акын Совет Урманбетов «Турмуш сыноосун женген адам», «Өз эркин сынаган жигит» аттуу көлөмдүү очерктерди жазган."},{"t":"v","l":["п","к"]},{"t":"p","h":"Бала кезинде туш болгон тагдырдын тайкылыгы, туркун оорулар, күтүлбөгөн кырсык анын эркин сындырмак тургай, кайра чоюндай чыңалтып, шамшардай бүлөдү. А. Ажыматов кыргыздын улуттук, эркин, классикалык күрөштөр боюнча республикабыздын 80 жолку чемпиону болгон. Мындан тышкары профсоюз уюмунун 7 жолку чемпиону. Жыйырмадан ашык ирет бүткүл союздук ири мелдештерде жеңишке жетишкен. Бирок мунун баары 1977-жылга чейин болгон. Ш 1977-жылы Алым Америка Кошмо Штаттарына бара турган болуп калат. Белет алганы эски аэропортко келе жаткан. Автобуста эл жыкжыйма, бут коёрго жер жок. Ал 003 жакта эле. Аңгыча эшик шарт ачылып кетти. Ондогон кишинин массасы урганда, ал тең салмагын кармай албай калды. Кулап бара жаткан бирөө желкесинен силкип жибергендей болду. Жыгылып бара жатканын бир билет. Андан кийинкиси – түн..."},{"t":"p","h":"ТУ Ал азапты аябай чекти. Бала кезде башталган енекет гастрит, бронхоэктаз, кабыргасынын сыныгы жен эле колго кирген тикендей сезилип калды. Анан белин бир кездеги мертинтип алганы кырсыктын айынан кайра козголуп, колу-буту кыймылдабай, таптакыр шал болуп калуу, баш сөөгү сынып, түбөлүк акыл-эсин жоготуп коюу коркунучтары турду. Моюн омурткасы да сынып кеткен... Ооруканадан чыкканда, эки балдак менен бутуна араң турган тирүү арбак болуп калган эле."},{"t":"p","h":"У Алымдын чентегунде толгон-токой оорунун аты жазылган, эмгекке 96 процент жараксыз экенин кубелендурген 1- группадагы майыптын китепчеси бар эле. Дарыгерлер мурда <span class=\"pg\" data-n=\"280\">280<\/span>эле анын үй-бүлө күтүшүнө, басып жүрүшүнө, көп ойлонушуна катуу тыюу салышкан. Бирок Алым андай тыюу салуулар менен келишпеди. Анткени жашоо – бул Алым учун үзгүлтүксүз кыймыл. Әгер колу менен бутунун учтары кыймылдап турса, калган ооруну жеңип кетүүгө болоруна ал бекем ишенген. Анткени анын карамагында 4 процент эмгекке жарамдуулук бар эле. Алым тагдырдын кырсыгына баш ийип бергиси келбеди. Ошентип, чөнтөктөгү майыптык китепче менен көкүрөктөгү максаттын узакка созулган кармашы башталды. Бирок күчтөр тең эмес эле..."},{"t":"p","h":"УТ Алым чыгыш элдеринин дененин ар бир бөлүгүн башкара билүү көнүгүүлөрү менен машыга баштайт. Дене-бою зыркырап ооруп, колу-буту көгөрүп, тарамыштары шишип кеткенине да карабайт. Кай бир көнүгүүлөрдү өзү атайы татаалдантат. Мисалы, кирпичтин ордуна сайдын ташын колу менен уруп сындырат. Алгач колдору көгөрүп, жарылып да кетчү. Алым ан сайын күчөп урар эле. Ичинен: «Әчтеке эмес, турмуш мени мындан да катуу уруп келе жатат. Ме сага, ме сага!» – деп күбүрөй берүүчү. Алым канчалык өчөшкөн сайын, колдорунун ооруганы басылып, атүгүл жарылган жерлеринин каны катып калчу. Ошентип, тынымсыз машыгуунун, өжөрлүктүн айынан ал өз сезимин, денесинин ар бир мүчөсүн башкарууга жетише алган. Бул 1979-жылдын жазы эле."},{"t":"p","h":"УП Адам аракет кылса, колунан келбес нерсе жок. Алымдын кытка куйгандай келишимдүү мүчөсүн карап туруп, ушул жигиттин бир кезде шал жана жинди болуп калуу коркунучун башынан кечиргенине ишенүү мүмкүн эмес. Алым бутуна турары менен сүйүктүү күрөшүн кайра баштаган."},{"t":"p","h":"Ал 1979-жылы күзүндө күрөш боюнча Дүйшөмбү шаарында өткөн бүткүл союздук мелдешке катышып, жеңишке жетишкен. 1980-жылы улуттук күрөштүн үч түрү боюнча республиканын чемпиондугун жеңип алган."},{"t":"h3","h":"АЛЫМ АЖЫМАТОВДУН КӨКҮРӨГҮНӨ ТӨНГӨН ТЕРЕҢ ОЙ БАР"},{"t":"p","h":"«Кеңге кең дүйнө, тарга тар дүйнө». Жөн эле өлүп калуу менин максатыма жакпайт. Тагдырдын кырсыгына баш ийип бергим келбейт. Әгер дүйнөгө кең карасак, анда дүйнө сага кең карайт. Мен өзүмдү өзүм кыйнап, ушунун баарын тирүү калуу <span class=\"pg\" data-n=\"281\">281<\/span>үчүн жасаганым жок. Мен өлүмдөн коркпойм. Менин жашоомдун маңызы – адамдарга керек болуу. Мен колум менен сай таштарды сындырам. Алар бири-бирине такыр окшош эмес. Адам да ошондой. Ар биринин катылуу мүмкүнчүлүктөрү бар. Болгону аны табуу керек, – дейт ал."},{"t":"p","h":"«Ленинчил жаш» гезити"},{"t":"p","h":"345-көнүгүү. Төмөнкү текстти сүйлөм мүчөлөрү боюнча талда. Баарын эмес. Тепкичтер боюнча. Мисалы, 1-тепкич – бир сүйлөм, 7- тепкич —жети сүйлөм. Демек, тепкичтен тепкичке көтөрүлгөн сайын, бирден сүйлөм кошула берет. Ким кайсы тепкичке чейин талдай алат?"},{"t":"p","h":"1-тепкич Эки жагынан эки өрүм чачтай эки суу агып түшөт экен."},{"t":"h3","h":"2-тепкич"},{"t":"p","h":"Дал ушул жыл ажырашта Бакай келди. Бакайдын келиши менен шандуу той кайрадан жаңырды."},{"t":"p","h":"3-тепкич Кенешке чогулгандар Таластан келгендердин кабарын сурамжылап толук угушту. Анан акыл чайкап отурушту. Ушул учурда Анжыян тарапка кеткен кайгуул да келип жетти."},{"t":"h3","h":"4-тепкич"},{"t":"p","h":"Этеги кен жайылган батышка туз менен журе берди Манас, Бакай. Бул жайыкта бир кертим болуп турган Кара- Тоо. Таластын этегинен башына кабар берер кароол тоо ушул, чокусуна түнкүсүн улуу от жакса, же түтүн булатса, Таластын башындагы Бакайдын Кызыл-Ташына жазбай көрүнөт."},{"t":"h3","h":"5-тепкич"},{"t":"p","h":"Токойлуу бир тоодон миң бугу атышты. Ошол жер андан кийин Мин-Бугу аталып калды. Бир тоодон сансыз кулжа атышты. Ал жер ошондон улам Кара-Кулжа аталып калды. Ошентип, кыштын кыраан чилдеси кирип келди."},{"t":"p","h":"б-тепкич Бакайдын камкордугу менен кырк чоро куралып бутту. Кырктын башына Кыргылды коюшту. Ар ишке жарар Ажыбайды кырктын саясатчысы кылышты. Кырк чоронун ар бирине минден аскер курап беришти. Жоокерчилик камыл- ‚га жүрүп жатты. Убакыт суудай агып, кумдай куюла берди."},{"t":"h3","h":"<span class=\"pg\" data-n=\"282\">282<\/span>\"-тепкич"},{"t":"p","h":"Ушул керүүдөн Каркыраны көрүп ал: оң ныптаң- көз жеткен көк мунарыкта жалама аска жалгыз кара бешкек тоо көк тиреп турат; теке мандай түндүгүң – көз жеткен боз мунарыкта Үч-Капканын үч эмчек суусу жайылып агып жатат; сол ныптан – көз жеткен күүгүм мунарыкта Кызыл-Кыянын жошолуу жону, токойлуу бели көрүнөт, андан ары Ысык- Көл жатат байбиченин пейилиндей жайкалып. Керүү төргө кыргыздын көчү конду. Ортодогу кең жайык аштын шааншөкөтү өтчү майдан болду."},{"t":"p","h":"8-тепкич Кечээ чак түштө чапчышкан эки дөө дале жүрөт жөөлөшүп. Майдан үстү жумшак чым каман челгендей болуп казылыптыр. Үчүнчү күнү Кошой дөө Жолойго ээк сала өбөктөп, көзү илинип кетти. Кошойдун коңуругу кулагынын түбүнөн жаңырганын туйган Жолой аны колдойтуп жерден көтөрдү. Ошерде жону чыккан корум ташка Кошойду жанча чапмак болду. Манас айгай салып кыйкырды."},{"t":"p","h":"«Намыстанып кыйкырган бул Манасымдын үнү эмеспи», уйкулуу көзү умачтай ачылды. Күрөшкө түшүп жүргөнү дөө Кошойдун эсине ошондо келди."},{"t":"p","h":"9-тепкич Амалы куч Конурбай Алгаранын башын бура тартып качып берсе болорбу. Артынан Аккуланын оозун коё берди. Манастын жалын чыкты оозунан, чагылган чагылды кезунен. Астындагы ойроттон озгон Аккула арылдап арышын керди. Элик сындуу Алгара канат буткен немедей учуп качты. Энкейишке келгенде Алгаранын эликтей буту сайылат. Фр таяна бергенде Аккуланын жал-куйругу жайылат. Эшилме сындуу чалкак белге жеткенде Аккула бөрү кууган бүркүттөй шукшурулуп жетип барды. Шер Манас болот тили бир кулач Сырнайзаны сундурду (А.Жакыпбековдун «Теңири Манас» романынан 1-9-тепкичтердин мисалдары алынды)."},{"t":"p","h":"346-кенугуу. Текстти сүйлөм мүчөлөрү боюнча талдоо өз каалооңо жараша. Күчүндү сынап көр."},{"t":"h3","h":"ЭГЕР КИТЕП ОКУСАҢ..."},{"t":"p","h":"т Адамзаттын кенчине айланган китептер аркылуу байыркы фараондор менен аралашып, гладиаторлорду данктап, легиондорду жазалайсыңар. Пегаска минип, Парнас тоосуна <span class=\"pg\" data-n=\"283\">283<\/span>чыгасыңар. Китептер аркылуу гүлдөгөн Рим империясына жетип, Зулкарнайндын жоокери болуп, Дарийдин жеңилбес аскерин багынтасынар. Төгөрөктүн төрт бурчун айланып, акыркы деңизге жетесиңер. Чыңгыз хан, Батый хан, Жучу хан менен жүздөшүп, Субудай нойон, Жебэ нойон, Тохучар тайшылардын жортуулдарында жүрөсүңөр."},{"t":"p","h":"Жан дүйнөңөргө өбөлгө болгон китептер аркылуу тиги дүйнөгө да, бу дүйнөгө да саякат жасайсыңар. Колумб менен Американын ачып, байыркы инктердин дүркүрөп өскөн маданиятын көрөсүңөр. Цивилизация жетпеген, урбанизация болбогон ууздай Бутан өлкөсүндө, Африканын чер токойлорунда, Килиманжаро тоолорунда арстандарга, пилдерге, кериктерге аңчылык кыласынар."},{"t":"p","h":"П Китептердин жетегинде Кайра жаралуу дооруна аралашып, Леонардо да Винчи, Микеланжело, Рафаэль, Врубель, Ван Гогдордун чыгармаларына тан калып, Лувр, Эрмитаж, Дрезден музейлерин ачасынар. Колизейде сайышка тушуп, Ватиканда папа болуп, католик динин башкарасынар. Аристотель менен Гегелдин, Галилей менен Коперниктин, Ньютон менен Эйнштейндин шакирти болуп, жаңы теорияларды, жаңы галактикаларды ачасыңар. Дарвиндин лабораториясында адамдын маймылдан чыкканын далилдейсиңер. Бухара менен Самаркан мунарасынан кас душмандарынарды жерге ыргытасыңар. Монте Кристо аралыгындагы алтындарга жетип, Дантенин тозогуна түшөсүңөр. Бруно менен отко күйүп, Ыйса Христос менен айкаш жыгачка керилип, кайра тирилесинер."},{"t":"p","h":"шШ Китептер аркылуу Гёте, Шиллер, Бальзак, Стендаль, Гюго, Моппасан, Лу Синь, Тагор, Цвейг, Роллан, Лондон, Драйзер, Твен, Хемингуэй сыяктуу алптар менен кездешесиңер. Толстойдун, Достоевскийдин, Тургеневдин каармандары менен аралашасыңар. Пушкиндин Татьянасын, Лермонтовдун Бэласын, Карамзиндин Лизасын сүйөсүңөр. Арасында Шерлок Холмстун, Дон Кихоттун, шайдоот жоокер Швейктин жоруктарына канасыңар. Айрыкча поэзия корифейлери Хафиздин, Саадинин, Гейненин, Шиллердин, Беранженин, Церетелинин, Лонгфеллонун, Есениндин муза дүйнөсүнө киргенде эфир толкундарында канат байлап учасынар."},{"t":"p","h":"Адамзат байлыгы китептерде. Китеп – аалам. Китеп – ‚ алтын, хрусталь, алмаз, бриллиант, кварц, фарфор жана <span class=\"pg\" data-n=\"284\">284<\/span>башкалар. Китеп – нефть, энергия, уран. Китеп – динамит. Алар жарылса, дүйнө кыйрайт да калат. Э. Турсунов"}],"sub":[{"title":"КОРГОЛ АҢГЕМЕСИНЕ КАЙРА ТҮШТҮ","b":5},{"title":"ЖЭЭНБАЙ МУКАМБАЕВ","b":10},{"title":"ЧЫҢГЫЗ АЙТМАТОВДУН ЧЫГАРМАЛАРЫ","b":18},{"title":"2. Сүйлөмдүн түрлөрү жана сүйлөм мүчөлөрү боюнча талдоо","b":20},{"title":"Үлгү: Кара булут калыңдап, күн күркүрөп, чагылган","b":31},{"title":"ДИНАРА АСАНОВА","b":34},{"title":"344-кенугуу. Адегенде оку жана мазмунун бил. Текст 8 бөлүктөн","b":45},{"title":"АЛЫМ АЖЫМАТОВДУН АЛПТЫГЫ","b":47},{"title":"АЛЫМ АЖЫМАТОВДУН КӨКҮРӨГҮНӨ ТӨНГӨН ТЕРЕҢ ОЙ БАР","b":56},{"title":"2-тепкич","b":61},{"title":"4-тепкич","b":64},{"title":"5-тепкич","b":66},{"title":"\"-тепкич","b":69},{"title":"ЭГЕР КИТЕП ОКУСАҢ...","b":75}],"section":"ЇХ КЛАСС","pages":[275,284]},{"title":"§ 48. «САБАТ САНЖЫРАСЫ» ТОПТОМУ","blocks":[{"t":"h3","h":"§ 48. «САБАТ САНЖЫРАСЫ» ТОПТОМУ"},{"t":"p","h":"Теменку сени кайталоого тушуктуруучу 51 суроо женилжелпилиги менен айырмаланат. Ага чапкан аттай тездик менен жооп беруу керек. Онтоп, ойлонуп же китеп барактап туруп калууга болбойт. Бул тапшырманы аткаруунун жолу – экөө. Биринчи – ушул суроолорго алгач өзүң даярданып алышың зарыл. Экинчи – ушул суроолорду бири-бириңе берип, күч сынашсаң болот."},{"t":"h3","h":"ЭЛҮҮ БИР СУРОО"},{"t":"p","h":"№1. Ырахат, ыракат, рахат, ракат. Бул сөздөрдүн кайсынысынын жазылышы туура?"},{"t":"p","h":"№2. Ак төш – Актөш (иттин аты). Кайсынысы туура? №3. Бардык – баардык, баары – бары, баардыгы – бардыгы. Булардын кайсынысы туура?"},{"t":"p","h":"№4. Тебенек – тебээнек – тебен ээк. Кайсынысы туура? №5. Кичирек – кичирээк, унутчаак – унутчак. Кайсынысы туура?"},{"t":"p","h":"№6. Натуура – наатура, наразы – нааразы. Кайсынысы туура? №7. Кумтөр – Кум-Төр, жылажын-жылаажын. Туурасы кайсынысы?"},{"t":"p","h":"№8. Кошун – кошуун. Кайсынысы туура?"},{"t":"p","h":"№9. Ырахмат – ракмат – ыракмат – рахмат. Кайсынысынын жазылышы туура?"},{"t":"p","h":"№10. Алып бер – алпер- апер. Кайсынысы туура?"},{"t":"p","h":"№11. Алып бар – алпар- апар, алып кел – апкел. Кайсынысы туура?"},{"t":"p","h":"№12. Бирин бири – бирин-бири, өзүн-өзү – өзүн өзү. Кайсынысы туура?"},{"t":"v","l":["№13. Бири-бирин – бири бирин. Кайсынысы туура?","№14. «аа» катышкан 5 сөз таап жаз.","№15. «оо» катышкан 5 сөз таап жаз.","№16. «өө» катышкан 5 сөз таап жаз.","№17. «уу» катышкан 5 сөз таап жаз.","№18. «уу» катышкан 9 сөз таап жаз.","№19. «ээ» катышкан 5 сөз таап жаз.","№20. «пп» катышкан © сөз таап жаз.","№21. «кк» катышкан 5 сөз таап жаз.","№22. «гг» катышкан 5 сөз таап жаз.","№23. «тт» катышкан 65 сөз таап жаз.","№24. «дд» катышкан 5 сөз таап жаз.","<span class=\"pg\" data-n=\"285\">285<\/span>№25. «сс» катышкан 5 сөз таап жаз.","№26. «нн» катышкан 5 сөз таап жаз.","№27. «лл» катышкан 5 сөз таап жаз.","№28. «рр» катышкан 5 сөз таап жаз.","№29. «ь» катышкан 5 сөз таап жаз.","№30. «е» катышкан 5 сөз таап жаз.","№31. «я» катышкан 5 сөз таап жаз.","№32. «ю» катышкан 5 сөз таап жаз.","№33. «е» катышкан 5 сөз таап жаз.","№34. Кош сөздөн онду тез сана?"]},{"t":"p","h":"№35. 5 кинофильмдин атын ата? Жазылышы кандай? №36. 5 күүнүн атын ата? Жазылышы кандай?"},{"t":"v","l":["№37. 5 романдын атын ата? Жазылышы кандай?","№38. 5 эпостун атын ата? Жазылышы кандай?","№39. 5 драманын атын ата? Жазылышы кандай?","№40. 5 ырдын атын ата? Жазылышы кандай?","№41. 5 обондун атын ата? Жазылышы кандай?","№42. 5 гезиттин атын ата? Жазылышы кандай?","№43. 5 поэманын атын ата? Жазылышы кандай?","№44. 5 жомоктун атын ата? Жазылышы кандай?","№45. 3 операнын атын ата? Жазылышы кандай?","№46. 3 балеттин атын ата? Жазылышы кандай?"]},{"t":"p","h":"№47. 5 күлүк тулпардын атын ата? Жазылышы кандай? №48. 5 мультфильмдин атын ата? Жазылышы кандай? №49. 5 повесттин атын ата? Жазылышы кандай?"},{"t":"v","l":["№50. 5 сөздү тез ташымалда?","№51. Кошмок сезден онду тап."]},{"t":"h3","h":"ОЙЛОНДУРГАН, ИЗДЕНТКЕН СУРООЛОР"},{"t":"p","h":"(Жазуу түрүндө аткарылат)"},{"t":"h3","h":"№ 1. ЧЕКИТ КАНДАЙ УЧУРДА КОЮЛАТ?"},{"t":"p","h":"1. Чекиттин коюлуш учурларын көрсөт?"},{"t":"p","h":"2. Ар бир учурга мисал келтир."},{"t":"h3","h":"№2. ҮТҮР КАНДАЙ УЧУРДА КОЮЛАТ?"},{"t":"p","h":"1. Үтүрдүн коюлуш учурларын ата?"},{"t":"p","h":"2. Ар бир учурду мисал менен далилде?"},{"t":"h3","h":"№ 3. ТЫРМАКЧА КАНДАЙ УЧУРДА КОЮЛАТ?"},{"t":"p","h":"1. Тырмакчанын кайсыл учурда коюларын айтып бер жана атап көрсөт?"},{"t":"p","h":"2. Алардын ар бирин мисал менен далилде?"},{"t":"h3","h":"<span class=\"pg\" data-n=\"286\">286<\/span>№ 4. СЫЗЫКЧА КАНДАЙ УЧУРДА КОЮЛАТ?"},{"t":"p","h":"= ‚ Анын коюлуш учурларын аныкта?"},{"t":"p","h":"2. Алардын ар бирин мисал менен бекемде?"},{"t":"h3","h":"№ 5. КОШ ЧЕКИТ КАНДАЙ УЧУРЛАРДА КОЮЛАТ?"},{"t":"p","h":"1. Анын коюлуш учурларын ата?"},{"t":"p","h":"2. Алардын ар бирин мисал менен ыраста?"},{"t":"h3","h":"№ 6. ТӨЛ ЖАНА БӨТӨН СӨЗДҮН ЖАЗЫЛЫШЫНЫН КАНЧА ТҮРҮ БАР?"},{"t":"p","h":"1. Ар бир түрү боюнча кештени сызып көрсөт."},{"t":"p","h":"2. Ар бирин мисал менен бекемде."},{"t":"h3","h":"№ Т. БИР ӨҢЧӨЙ МҮЧӨЛӨРДҮН ЖАЗЫЛЫШ ӨЗГӨЧӨЛҮКТӨРҮН АНЫКТА"},{"t":"p","h":"1. Алардын ар бирине таандык кештени сыз."},{"t":"p","h":"2. Ар бирин мисал менен далилде."},{"t":"h3","h":"№8. ТЕҢ БАЙЛАНЫШТАГЫ ТАТААЛ СҮЙЛӨМДҮН ЖАЗЫЛЫШЫНДА КАНДАЙ ӨЗГӨЧӨЛҮКТӨР БАР?"},{"t":"p","h":"1. Аларды кештеси боюнча сыз."},{"t":"p","h":"2. Ар бирин мисал менен далилде."},{"t":"h3","h":"№9. БАГЫНЫҢКЫ БАЙЛАНЫШТАГЫ ТАТААЛ СҮЙЛӨМДҮН ЖАЗЫЛЫШЫНДА КАНДАЙ ӨЗГӨЧӨЛҮКТӨР БАР?"},{"t":"p","h":"1. Ар биринин кештесин сыз."},{"t":"p","h":"2. Ар бирин мисал менен бекемде."},{"t":"p","h":"1- үлг ү: Чекит кандай учурларда коюлат? Бул тапшырма төмөнкүчө иштелет."},{"t":"p","h":"1. Чекит сүйлөмдүн аягына коюлат. М.: Күн кечтеп баратат."},{"t":"p","h":"2. Чекит катар номерлөөдөн кийин коюлат. Буга ушул үлгүнүн өзү мисал боло алат."},{"t":"p","h":"3. Драмада каармандын атынан соң коюлат. М.: Шеркул. Кагылайын, эч кимге айтпа, нары карап тур (Шүкүрбеков)."},{"t":"p","h":"4. Айрым сөздөр кыскартылганда коюлат. М.: б. а., ж. 6. д.у.с., б.3.ч., ж., к., проф. Ал эми кг, ом, км, т, га, л, м деген ендуу кыскартылган чен бирдиктеринен кийин коюлбайт."},{"t":"p","h":"5. Адамдын кыскартылган аты-жөнүнөн кийин чекит коюлат. М.: Ч. Айтматов, С. Акматбекова, К. К. Юдахин, Р. Чокоева, Д. Жалгасынова ж.б."},{"t":"p","h":"2-үлг ү: «Чекит кандай учурда коюлат?» деген тапшырма кештелөө жолу менен аткарылат."},{"t":"p","h":"<span class=\"pg\" data-n=\"287\">287<\/span>Сүйлөмдүн аягына келет. М.: Жаз эрте келди. Катар номерлөөдө. М.: Китеп алгандар:"},{"t":"p","h":"1. Алтынбек. 2. Алымкул."},{"t":"p","h":"Чекит Драмада. М.: Искендер. Заманды бара көрөбүз да. Зулайка. Искендер! Искендер!"},{"t":"p","h":"Айрым кыскарган сөздөрдө. М.: ж. б., б. а., б. з. ч. Адамдын аты-жөнү кыскартылганда. М.: А. Осмонов, С. Әралиев, Р. Гамзатов. Ойлонткон, изденткен 8 тапшырма сени чакан иликтеп изилдөөгө тартат. Сен бул окуу китебинен тышкаркы материалдарды (гезит-журналдарды, көркөм чыгармаларды) да пайдалансаң болот. Мисалдарды оюндан чыгарып жана түз. Үчтөн."},{"t":"h3","h":"Сегизинчи жат жазуу"},{"t":"p","h":"(Максатың: жат жазууларды катасыз көчүрүү)"},{"t":"h3","h":"БЕКНАЗАР КУУДУЛ"},{"t":"p","h":"Бекназар өзүнүн турпатын үчкө бөлчү. Әки чети деп таз башы менен чийдей бутарын айтчу экен бала кезинде. Анан курсагын орто жерим деп койчу."},{"t":"p","h":"Жаман алында ошол орто жерим бир күнү каймак жегиси келип калса болобу. Ооба каймак! Же ал өңүмдө эмес түшүмдө жеп жүргөн тамак болсочу. Деги ошо орто жеримдин ары жок да-аа, ары жок! Әмне кылдым эми деп баштачу Бекең аңгемесин. Үй ичи толо эл тымып турчу. Босого тарапта отурган балдар демин ичине алышып күлкүдөн муйушуп кызыл-көз сары мышыктай укмуштуу адамдан көзүн албай отурушчу. Анан Бекендин каймак үчүн «чоң казаты» башталчу."},{"t":"p","h":"Бактыма жараша байбиче аялдарды жыйнап жүн тытырып сабатып кийиз жасатмак болуп калды. Керели кечке айыл аялдарынын колу бошободу. Бешим ченде алардын торпокторун бошотуп айдап тээ жогорку коктуга алпарып караган черге байлап койдум. Әнелерин издеп мөөрөгөн торпоктордун үндөрүн үйрөнүп жаттым..."},{"t":"p","h":"Иреше түшүп караңгы кирип баратты. Аялдар торпокторун жоктоп ызы чуу түшүп калыптыр. Көрүнгөнү көрүнгөн жака чуркап жүрүшөт. Мен узун чөптүн арасына бекинип алып улам бир торпоктун үнүн турап мөрөп коём. «Мө-өө» дейм, «мү – үү» дейм, «мо-оо» дейм. Апий кызыл уйдун торпогу экен тияка чурка дешет, мен андан башка жака чуркап барып башкача меерейм. Айланайын ана, ала уйдун музоосу экен..."},{"t":"p","h":"<span class=\"pg\" data-n=\"288\">288<\/span>дешип аяка чуркайт. Караңгыда мен аларды жазгырып ээн үйлөргө келип чоң арча челеке каймак толтуру алып торпоктор байланган коктуга барып аларды бошотуп жибердим."},{"t":"p","h":"Аялдар эртеси гана каймак чогулткан идиштерин бош калганын көрүп, кечекиден жаман чуру чууга түшүштү... Ошол кезде каймака ашыкча тойгон мен орто жерим онтотуп оруп көзүмдү кызартып коктуда жатым. «Өзүндүн кылганың. Каймак жегиси келет. Ары жок. Аш кылалбагандан кий

абазкөй көзү күлүп алатамак шуруга ойноп жылтылдап кыздын сулууча жүзүнө нур тартты. Кара чачтары беш көкүл. Мажүрүм талдын кырчынындай майда."},{"t":"p","h":"Т. Касымбеков"}],"sub":[{"title":"АКАДЕМИК АЛТЫМЫШОВДУН АДАПТОГЕНДЕРИ","b":2},{"title":"АЛГЕБРАНЫН ТЕГИ – «ЭЛ ЖЕБР»","b":11},{"title":"КҮЧТҮҮ ДАРЫЛАР","b":16},{"title":"Бешинчи жат жазуу КЫДЫР АКЕНИН ЧЕБЕРЧИЛИГИ","b":19},{"title":"Алтынчы жат жазуу","b":22}],"section":"УП КЛАСС","pages":[158,161]},{"title":"§ 24. СТИЛИСТИКА","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"162\">162<\/span>§ 24. СТИЛИСТИКА"},{"t":"p","h":"«Беш кол тен эмес». Бул – туура. Эч качан бармак, сөөмөй, ортон, аты жок, чыпалак, демек, беш манжа бирдей болбойт. Ошол сыңары байланыштуу кептин да беш салаасы бар. Төмөндөгү беш мисалды оку да, байкоо жүргүз. Кандай окшоштуктары жана өзгөчөлүктөрү бар?"},{"t":"p","h":"1 Ысык-Көл – дүйнөдөгү тоо көлдөрүнүн ирилеринин бири. Аянты 6286 чарчы километр, узундугу 178 км, эң жазы жери 60,1 км, эң терең жери 668 м, орточо терендиги 278,4 метр. Археологиялык изилдөөлөргө караганда Ысык-Көлдүн жээктерине адам төмөнкү палеолитте (байыркы таш доорунда) эле отурукташа баштаган. Бирок көл жөнүндөгү алгачкы тарыхый маалымат б.з.ч. 1-кылымда гана кезигет. Анда ал «Чалкыган көл», кийин «Тунук көл» деп аталган."},{"t":"p","h":"«Кыргыз совет энциклопедиясы» 2"},{"t":"v","l":["Ысык-Көл – кыргыз көлү кылкылдаган,","Кыз-келин кылаасында шыңкылдаган.","Кылымдар колдон түшкөн маржан! болуп,","Көрүнбөй тереңинде жылтылдаган.","","Ысык-Көл – кыргыз көлү шарпылдаган,","Көркүнө көктөн башка тартылбаган.","Замандар кербенчидей чубап өтүп,","Чарчаса саясында? салкындаган (А.Осмонов).","3"]},{"t":"p","h":"– Ой, мадыра баш, Ысык-Көлдөн качан келдиң?"},{"t":"p","h":"– Кечээ."},{"t":"v","l":["– Баса, эс алуучулар көппү?","– Иттей (автобустагы сүйлөшүүдөн.).","1"]},{"t":"p","h":"Албетте, Ысык-Көлдү жерге-сууга тийгизбей мактайбыз. Аны ырдабаган акын жок. Залкар акын Алыкул Осмонов: «Кымыздай чөйчөгүнөн сапырылып, жаштыктай күр-шар"},{"t":"p","h":"Маржан —шуру."},{"t":"p","h":"Саясында – көлөкөсүндө."},{"t":"p","h":"<span class=\"pg\" data-n=\"163\">163<\/span>этип көбүк чачып», «Көргүм келет, көргүм келет миң ирет, айткым келет, сүйөм көлүм, сүйөм деп, элесимде көл жатпаса шарпылдап, ырларымда анда кандай касиет», – деп жазса, Сүйүнбай Әралиев: «Күн батат көл бетинен тайып нары, эл тарап, ээн калып кайыктары. Сезилет жалаң сууда дирдир этип, жылаңач жылдыздардын кайыкканы» – дейт. Мындай укмуш ырларды мисал кылуу үчүн шурудай тизип жаза бергим келбейт. Мактоо, баа берүү, сыймыктануу жаман эмес дечи. Ошентсе да айтарым – бул. Нары кыска. Көлгө камкордукту качан кылабыз? Ысык-Көлдү айланта качан бак тигебиз? Дагы качанга чейин ойлонобуз? Чечкиндүү аракетке качан өтөбүз? (Дубал гезит)."},{"t":"p","h":"5 Кун тартибиндеги маселени угуп, талкуулап, айыл жамаатынын жалпы чогулушу токтом кылат:"},{"t":"p","h":"1. Кыштак чөлкөмүндө көлдү бойлото 10 чакырымга чейин үч катар мырза теректин көчөтү отургузулсун."},{"t":"p","h":"2. Бул ишке айылда жашаган бардык адам тартылсын жана ар бир жан жүздөн көчөт тиксин."},{"t":"p","h":"8. Айыл Өкмөтүнүн аймагында жашылдандыруунун бир айлыгы жарыялансын."},{"t":"p","h":"Каршы, калыс жок. Токтом бир добуштан кабыл алынды."},{"t":"p","h":"Чогулуш башчысы (колу)"},{"t":"v","l":["Катчысы (колу)","","1998-жыл, 2-апрель"]},{"t":"h3","h":"БАЙКОО ЖҮРГҮЗҮҮ"},{"t":"p","h":"Т. Салиев Р. Байтерекова"},{"t":"p","h":"Мына, бешөөн тең окуп чыктын, айрым окшоштуктарды жана бөтөнчөлүктөрдү байкадың дечи. Әми ошол байкагандарды тыянактарга жарыш коюп көрсөн."},{"t":"p","h":"1. Окшоштуктар 1. Бешөө тең кыргыз тилинде жазылган. Ой-пикирлер жөнөкөй жана татаал сүйлөмдөр менен туюнтулган."},{"t":"p","h":"2. Бешөө тең текст түрүндө берилген. Баса, текст жөнүндө ушул окуу китебиндеги «Серектин сыр сандыгын» кара. Анда тексттин эрежеси, анын өзгөчөлүктөрү, абзац, реферат, тезис, тема, конспект жөнүндө маалыматтар бар, ошолорду оку."},{"t":"p","h":"3. Бешөө тең байланыштуу кептин мүмкүнчүлүгү менен `жазылган, тагыраак айтканда, анда баяндоо, сүйлөшүү жана <span class=\"pg\" data-n=\"164\">164<\/span>ой жүгүртүү мүнөзүндөгү тексттер бар. Байланыштуу кеп тууралуу да «Серектин сыр сандыгынан» тиешелүү маалыматтарды аласың."},{"t":"p","h":"П. Өзгөчөлүктөр «Билек бир болгону менен, манжа башка» дегендей Ысык- Көл жөнүндөгү тексттер бири-биринен кескин айырмаланат."},{"t":"p","h":"Салыштырып көрөлү 1-текстте Ысык-Көл жөнүндөгү географиялык, тарыхый маалыматтар илимий негизде так жана ачык-айкын берилген. Так ушунусу менен ал башка тексттерден айырмаланат. Ал эми 2-текст да Ысык-Көл жөнүндө. Бирок көлдү 1-тексттен таптаза башкача мүнөздө сыпаттайт. «Кылкылдаган», «шарпылдаган», «көркүнө көктөн башка тартылбаган» деген сөздөр көлдүн сулуу элесин чагылдырса, кылаасында шынкылдаган кыз-келиндер Ысык-Көлдүн көркүнө көрк кошот, ал эми көлдүн жаралганы качан, нечен кылымдар шуру мисал колдон түшүп, көлдүн тереңинен жылтылдап турганын айт. Нечендеген замандарчы? Алар да кезегинде кербенчидей чубап өтүп, саясында салкындап өткөн. Ошондой эле жогорку көрк, сулуулук, жарашыктуу мазмун, куюлушкан уйкаштык (кылкылдаган-шыңкылдаган-жылтылдаган, шарпылдаган-тартылбаган-салкындаган) менен шөкөттөлүп, 3 муунактуу (Ысык-Кел+кыргыз келу+кылкылдаган=3 муунак) 11 муун ар бир сапта кездешип, алар ыргак жараткан. Демек, бул – адабий чыгарма, анын ичинен ыр. Ошентип, 2-текст элестүүлүгү, көрктүүлүгү менен башкалардан айырмалуу. 3-текст оозеки сүйлөшүүдөн куралды. Анда кемтик сүйлөм («-кечээ», «—иттей»), «ой» деген сырдык сөз, «мадыра баш» деген кемсинтүүчү, «иттей» деген оозеки маекке гана мүнөздүү сөздөр пайдаланылды. 4-текст —бул коомчулукка жана көпчүлүккө арналган гезиттик макала. Автор толгонуп: «Көлгө камкордукту качан кылабыз? Ысык-Көлдү айланта качан бак тигебиз? Чечкиндүү аракетке качан өтөбүз?» – деп маселени кабыргасынан коёт. Анын атуулдук мүдөөсүн чакырык, кайрылуу, үндөө коштойт. Ал өз оюна залкар акындардын ырларын жөлөк кылат. Ал эми 5-текст баяндалышы жана сүйлөмдөрдүн түзүлүшү боюнча жогорудагы 1-4-тексттердин бирине да окшобойт. Бул аткарылышы милдеттүү болгон, көпчүлүктүн катышуусу менен кабыл алынган документтин үзүндүсү. Анда номер менен белгиленген пункттарда «отургузулсун», «тиксин», «жарыялансын» деген өндүү тикелей буйрук жана уюштуруу мүнөзүндөгү бүтүмдөр бар."},{"t":"p","h":"<span class=\"pg\" data-n=\"165\">165<\/span>Байкоонун жыйынтыгы Жогорудагы 1—5-тексттерди өзгөчөлүктөрү боюнча териштиргенде, төмөнкүдөй жыйынтыкка келүүгө болот: 1) илимий стиль – ИС, буга 1-текст; 2) көркөм адабий стиль —КАС, буга 2-текст, 3) оозеки сүйлөшүү стили – ОСС, буга 8-текст; 4) публицистикалык стиль – ПС, буга 4-текст; 5) официалдууиштиктүү стиль – ОИС, буга 5-текст кирет."},{"t":"h3","h":"Әскертүү"},{"t":"p","h":"Стилистика жөнүндөгү маалыматтарды «Серектин сыр сандыгындагы» «Байланыштуу кеп» топтомунан кара. Анда стилистика, стиль жөнүндөгү аныктамалар, стилдин түрлөрү: ОСС, КАС, ИС, ПС, ОИС жөнүндөгү кыскача маалыматтар камтылган. Стилдин шарттуу түрдө оозеки жана жазма стиль болуп экиге бөлүнүшү менен да тааныша аласың. Ошол себептүү стиль боюнча сунуш кылынган көнүгүүлөрдүн арасына атайын эрежелер, кошумча түшүнүктөр берилбеди."},{"t":"h3","h":"ӨЗ АЛДЫНЧА ИШТӨӨ"},{"t":"p","h":"Биринчи тапшырма Төмөндө катар номер менен белгиленген 81 текст берилди. Бирок азырынча алардын кайсынысы кайсы стилге кирери белгисиз. Ал эми сенин милдетиң – дыкаттык менен байкоо жүргүз жана ар бир текст кайсы стилге (ИС, КАС, ОСС, ПС, ОИСтин бирине) кирерин аныкта."},{"t":"p","h":"Экинчи тапшырма Айталы, 81 тексттин ар бирин стили боюнча аныктадың, ошондо бир нече текст бир стилге кирерин байкадын. Эмки милдетиң – топтолгон текст боюнча талкуу өткөрүү. Суроолор:"},{"t":"p","h":"1. Беш түргө топтоштуруу кайсы белгилер боюнча жүргүзүлдү? (Оозеки баяндоо түрүндө жооп бер)."},{"t":"p","h":"2.Топтоштуруу боюнча бири-бириңерде айырмачылык барбы? (Мисал менен көрсөт)."},{"t":"p","h":"3. Стилдерди эмне үчүн билүү керек? Зарылдыгы барбы? (Мисалга таянып, зарылдыгын далилде)."},{"t":"p","h":"4. Кайсыларын сен колдонор элең? (Мисал менен сүйлө)."},{"t":"p","h":"Үчүнчү тапшырма Теменку тексттердин кайсынысында баяндоо, кайсынысында суреттее, кайсынысында суйлешуу басымдуу?"},{"t":"p","h":"<span class=\"pg\" data-n=\"166\">166<\/span>№1 Сен менин өз оюмда момундайсын:"},{"t":"p","h":"Асмандын көгүш бети жарык, ачык. Татынакай тазалыктын мөлтүр терең тунугуна батып, көзүңөн укмуштуу бир кыял таратып, турасың сен балаңды бийик көтөрүп, токойду көздөй кеткен, тумандарга ак нур сепкен жарык жолду каратып... Күн дагы таң атканда тартуу кылат, бу дүйнөгө өзүнүн тун нурун, жаңы күндүн кулунун. Дал ошондой эне дагы көтөрүп өз баласын – бүт жер шарын турат кармап."},{"t":"p","h":"Ушинтип,"},{"t":"v","l":["пайда болуп Рафаэлдин сүрөтүндө,","жерди, данды тең кармайсың – бузулбайсын,","сен менин өз оюмда ушундайсың (Ә. Межелайтис).","Ме 2"]},{"t":"p","h":"Чачпак. Аялдар чачына тагынчу кооз жасалганын аталышын туюнткан чачпак сөзү чач + пак бөлүктөрүнөн турат. Анын аягындагы -пак байыркы түркчө «баг» деген сөз. Ал азыркы кыргызча боо дегенге туура келет. «Чач боо» маанисиндеги сөз чачпак болуп калган (К. Сейдакматов)."},{"t":"p","h":"№3 5-статья 1. Кыргыз Республикасынын мамлекеттик тили – кыргыз тили."},{"t":"p","h":"82-статья 1. Кыргыз Республикасынын ар бир гражданы билим алууга укуктуу."},{"t":"p","h":"2. Негизги билим – милдеттүү жана акысыз, аны ар бир адам мамлекеттик окуу жайларынан алууга укуктуу."},{"t":"p","h":"Кыргыз Республикасынын Конституциясы"},{"t":"p","h":"Жалт-жулт ойноп, күнгө күмүш сыяктуу,"},{"t":"v","l":["Түркүм тилдүү, кыл комуздуу, кыяктуу;","Жардай эңсеп, көлдөн тосуп чөмүлүп,","Каз каркылдап, канат чапкан буга ак куу;","","Мөңгү жаткан түн салкынын жеткирип,","Бой чыйралткан кечки илеби бубак-буу;","Колот ылдый агып жаткан ийрилип,"]},{"t":"p","h":"Жылаажын үн, мөлтүр кашка тунук суу (С. Эралиев)."},{"t":"h3","h":"<span class=\"pg\" data-n=\"167\">167<\/span>ӨМҮР БАЯН"},{"t":"p","h":"Мен, Нышанов Наскул, 1982-жылы Ош облусуна караштуу Кадамжай районундагы Жошук айылында кызматчынын үй-бүлөсүндө туулганмын. Атам, Ирисов Нышан, мектепте директор болуп иштейт. Апам, Ирисова Айша, мектепте мугалим. Биз жети бир тууганбыз. 1989-жылы 1-класска киргем, азыр 9-класста окуп жатамын."},{"t":"p","h":"12-март, 1998-жыл (колу) Н. Нышанов"},{"t":"p","h":"№ 6 Байкал – Чыгыш Сибирдин түштүгүндөгү көл. Аянты 81,5 миң чарчы километр. Узундугу 686 км, орто жазылыгы 48 км. Суусу таза. Терендиги (1620) боюнча дүйнөдө 1-орунда. Байкалга 336 дарыя куят. Көлдөн Ангара дарыясы агып чыгат. Бул жерде өсүмдүктөрдүн жана жаныбарлардын 1800дөй түрү бар. Тоолуу кооз жээктери ийне жалбырактуу токой менен капталган. Балык кармалат. Кеме жүрөт («Географиялык энциклопедиялык сөздүк»)."},{"t":"p","h":"№7 Р.М. Учкемпирова женунде Кыргыз Республикасынын Президентинин"},{"t":"h3","h":"УКАЗЫ"},{"t":"p","h":"Учкемпирова Роза Мавлетовна ээлеген кызматынан бошотулуп, Кыргыз Республикасынын Социалдык фондунун терагасы-министри болуп дайындалсын."},{"t":"v","l":["Кыргыз Республикасынын Президенти","Бишкек ш., Өкмөт үйү","","№8","– Сонун экен ээ, – дедим.","– Ал меники, өзүм таптым.","– Тоо текелерби?","– Жок.","– Анан эмне сеники?","А. Акаев","1998-жыл. 3-февраль."]},{"t":"p","h":"– Айтпайм, – деди ал, анан – бир сокур, эки сокур... – деп мени далбастатып санай берди. – Жүз сокур!!! (Ж. Медетов)."},{"t":"p","h":"<span class=\"pg\" data-n=\"168\">168<\/span>№9 5-статья."},{"t":"p","h":"Эгер ойлоп табуу катары сунуш кылынган объект жаны, ойлоп табуучулук денгээлде болсо жана енер жайында колдонууга жараса, ал укуктук жактан коргоого алынат. 41-статья."},{"t":"p","h":"Кыргыз Республикасынын Патент мыйзамы жарыяланган учурдан баштап колдонууга киргизилсин (Патент мыйзамы). № 10 Институтта ата-энелердин 3-конференциясы болуп өттү. Ал Талас педагогикалык институтунун ачылышына арналды. Студенттер үчүн институттун экинчи корпусунда дагы бир китепкана иштей баштады («Талас турмушу» гезити)."},{"t":"p","h":"№ 11 Арал орто мектебинин директору Мырзакматов Камчыбекке УШ класстын окуучусу Нукешов Эсентурдан АРЫЗ Ата-энем Бишкек шаарына көчүп кеткендигине байланыштуу документтеримди берүүңүздү өтүнүп сураймын."},{"t":"p","h":"1998-жыл, 12-февраль. (колу) Э. Нукешов"},{"t":"p","h":"№ 12 Баш калаанын Ленин району устубуздегу жылы 1 млрд 42 млн сомдук өнөр жай товарларын чыгарып, эгемендүү жылдардын тарыхында өз рекордун койду. Бул бийиктикти багындырууда «Бишкек» ӘӘА баш болгон майда жана орто бизнес ишканаларынын салымы чоң. Район 557 млн сом чет элдик инвестицияларды пайдаланып, салыкчылар менен бажы кызматкерлери райондун казынасына 55 млн сом түшүрүштү («Кыргыз руху»"},{"t":"v","l":["№ 13","","Атка женил, тайга чак,","Уйкусу жок, жолго сак,","Чыканактап калбаган,","Чырм этип уйку албаган.","Кылычын кырга желеген,","Кызыккан кыйла жоо чыкса,","Кызыл канга белеген,","Теке жоомарт ат минген,","Темирден кепкек тон кийген,","Сырттаным Сыргак уялаш","«Манас» эпосу"]},{"t":"p","h":"<span class=\"pg\" data-n=\"169\">169<\/span>№ 14"},{"t":"h3","h":"ТИЛ КАТ"},{"t":"p","h":"Мен, Такенов Чогулуш, Чолпон-Ата шаарындагы кампачы Сыдыков Тынччылыктан Ысык-Келге эс алууга келишкен окуучулар учун 30 жаздык, 30 шейшеп, 30 жууркан, 10 кассетасы менен бир магнитофон алдым."},{"t":"p","h":"(колу) Ч.Такенов 1998-жыл, 3-июль № 15 Тогуз-Тородо калындыгы бир метрден ашык кар жаады. Базар-Коргондун айрым кыштактарында электр зымдары кардын салмагынан узулген. Чаткалдын Каныш-Кыя кыштагынан Ала-Букага кеткен жолдун он километрин кар көчкүсү басып калган. Мындай окуя Кара-Кулжа районунда да болгон. Бардык жерде жолдор тазаланып, зыян четтетилүүдө. Мал-жан аман («Кыргыз Туусу» гезити)."},{"t":"p","h":"№ 16 Аийдеш. Тик эмес, жантайыңкы келип, улам эңиштеп кеткен жерди айдөш дейт. Бул сөз «аюу төш» деген эки сөздүн биригишинен келип чыккан. Айнек. Арап тилинде «айн» сөзү көз маанисин берет. Ал сөзгө кичирейтүүчү -өк мүчөсүн кошуп, ирандыктар «айнек» деген сөздү жараткан. Кыргыз тилинде «айнек» сөзү «терезенин көзүнө салына турган шишеден жасалган зат» деген маани берип калган. Арак. Араб тилинде арак сөзү «тер», «буу» дегенди билдирет. Өтмө мааниде ичкиликти туюнтат. Анткени арак буулантуу жолу менен алынган. Арабдарда алгач пайда болуп, кийин коңшулаш элге тараган (К. Сейдакматов)."},{"t":"v","l":["№ 17","– Көрдүңбү?"]},{"t":"p","h":"– Акак-Кел! Атам айтчу эмес беле, «ак булут киринген Акак-Көл деген болот» деп. Ошол!!!"},{"t":"p","h":"– Бул көлдөн булуттар менен кайберендер гана суу ичет! – деп кумсан-кумсан этти Ондош."},{"t":"v","l":["– Мага бересиңби? – дедим.","– Аный. Өзүм мээнет кылып араң тапсам...","– Мен деле кечэә, бүгүн дагы көл бердим го...","– Бербейм."]},{"t":"p","h":"—Анда билесиңби, каймак сызгырганда чөбөгө, мыкчыл- ‚ ган талканымды өзүм жебей, сага берейин. Эжигейимди да. Көл сеники деп эле койсон?—деп жалдырадым (Ж. Медетов)."},{"t":"v","l":["<span class=\"pg\" data-n=\"170\">170<\/span>№ 18","Арбак. Айтканымды угуп болуп, еч алгын.","Гамлет. Эмне?","Арбак. Арбагымын сенин маркум атандын,","Жазалангам түндө тентип жүрүүгө,","Күндүз болсо тозок отто күйүүгө","Тирүүдөгү күнөөм күйүп бүткөнчө.","Сырын сага ача албаймын түрмөмдүн,","Анын сага четин гана айтканда,","Әстен танып, каның тоңуп муз болуп,","Чыгар эле эки көзүң чанактан...","Гамлет. О, жараткан!"]},{"t":"p","h":"Арбак. Аны өлтүргөн мыкаачыдан өч алгын (В. Шекспир). № 19 Сүрөттүн тээ ички тереңинде-күзгү асмандын ала бүркөк чет жакасы. Шамал бирин-серин булуттарды бир жакка бет алдырып, алыста кылтыйган чокуларга жандантып, кыялата айдап бара жатат. Андан бери көрүнүштө – бозоргон сары талаа, кең өзөн. Чет-четтен чийлер ыкташып, жаанчачындан кийин топурагы борпоң тоборсуп карайган жолдо катарлаш баскан эки жолоочунун изи тигинден бери чубайт (Ч. Айтматов)."},{"t":"p","h":"№ 20 Нарын облусунун Ак-Талаа районундагы Тоголок Молдо атындагы орто мектептин директору Кабылбек уулу Үрүстөмгө ошол мектептин УП классынын окуучусу Надырбек уулу Дастандан"},{"t":"h3","h":"ТҮШҮНҮК КАТ"},{"t":"p","h":"Менин түшүнүк кат жазуумдун себеби төмөнкүдөй. 1998- жылдын 12-ноябрында өзүбүздүн класстагы ортоңку терезенин алдыңкы көзүн кагаз менен сүрүп, тазалап жаткам. Бир убакта аркаман бирөөлөр мага катуу урунду. Бет алдымдагы айнек бычырап сынды. Карасам, эки окуучу карп-күрп күрөшө кетиптир. Ошолордун байкоосуздан мага урунушу айнектин сынышына себепкер болду. Бирок мен ал окуучуларды күнөөлөбөйм. Әртең сынган айнектин ордуна айнек алып келем."},{"t":"p","h":"(колу) Д. Надырбек уулу <span class=\"pg\" data-n=\"171\">171<\/span>№ 21"},{"t":"h3","h":"МААЛЫМДАМА"},{"t":"p","h":"Бул маалымдама Султанмурат кызы Чолпонго берилет, себеби анын 1998-1999-окуу жылынан баштап Талас районундагы Сейталиев атындагы орто мектептин 10-классында окуп жаткандыгы анык."},{"t":"p","h":"Маалымдама тиешелүү жерге көрсөтүү үчүн берилди. Мектеп директору (колу)"},{"t":"v","l":["Катчысы","(колу)","(Мектептин мөөрү)","Ме 22","А. Әрдешова","Р. Айдаралиева","12. 10. 98."]},{"t":"p","h":"Апа, апа! Мен өзүмдүн жарык дүйнөгө келгенимди түшүнгөндөн бери сенин колдоруң эсимде. Жай ичи колдоруң күнгө күйүп, тотугуп, колдоруңдун ошол тотугушу кышында да кетпей, ошол колдоруң эң эле назик, эң эле тегиз болуп, кол тамырларың гана азыраак кара көк тартып турар эле. Сенин колдорун, балким, катуудур, анткени сенин колдоруңа турмуштун далай түйшүгү түшкөн да, бирок мага сенин колдоруң ар качан жумшак көрүнчү... Муз чагып, кир чайкап, колдоруң кыпкызыл болуп кесилип, камтууга келбей кожоюп калганы да эсимде. Мен сенин таптаза, касиеттүү колдорунду өбөм, апа! (А. Фадеев)."},{"t":"p","h":"№ 23"},{"t":"h3","h":"ИШЕНИМ КАТ"},{"t":"p","h":"Мен, Отунчу уулу Бакыт, 1998-жылдын ноябрь айындагы мага тиешелуу 416 (терт жуз он алты) сом айлыгымды Аксы райондук элге билим беруу белумунун кассасынан алууну байкем Ботобаев Анарбекке ишенемин."},{"t":"v","l":["10. Б. Отунчу уулу","Отунчу уулу Бакыттын колун кубелендуремун."]},{"t":"p","h":"Айыл Өкмөтүнүн башчысы: (колу) К.Канаев (мөөрү) 10. ХТ. 1998-жыл."},{"t":"p","h":"Ме 24 Йод – Менделеевдин мезгилдик системасынын УП тобунда жайгашкан, галогендерге кирүүчү химиялык элемент, металлдык жалтырагы бар кара күрөң түстөгү кристалл. Йодду 1811-жылы француз химиги Б. Крутуа ачкан. Кадимки температурада эле кескин жыттуу кызгылт көк түстөгү бууга өтөт. Сууда начар эрийт. Йод жана анын бирикмелери медицинада, фотографияда колдонулат («Кыргыз Совет Энциклопедиясы»)."},{"t":"p","h":"<span class=\"pg\" data-n=\"172\">172<\/span>№ 25 Өзгөн районунда азыркы күндөрдө «Аракет», «Жакырчылыкты жоюу» программалары боюнча белгилей кетүүгө арзый турган жакшы иштер бар. 6 мектеп капиталдык, 91 мектеп жана 17 маданий мекеме кезектеги ремонттон чыгарылды. Куршабдагы оорукананын 30 орундуу, 22 бөлмөдөн турган терапия бөлүмүнүн бүткөрүлүшүнө 450 миң сом акча каражат чыгымдалды. Мырза-Арык айылында кубаттуулугу 25 миң киловатт подстанция жана 110 киловольттук электр станциясы курулду. Ал эми жергиликтүү бюджеттин эсебинен майыптарга, карыяларга 800 миң сомдук материалдык көмөк көрсөтүлдү («Кыргыз Туусу» гезити)."},{"t":"p","h":"№26"},{"t":"h3","h":"КУЛАКТАНДЫРУУ"},{"t":"p","h":"Чуй облусуна караштуу Жайыл районундагы Кум-Арык орто мектебинде Алыкул Осмоновдун туулган кунуне карата мектеп окуучуларынын кучу менен уюштурулган кече еткерулөт. Кече 12-декабрь күнү саат бирде болот."},{"t":"v","l":["Окуучулар жамааты","","№27"]},{"t":"p","h":"– Мен тээ тиги Кызыл көлүмдүн үйдөй арчасынын тубундөгү конушка ак чатыр тигип отурамын чоңойгондо, – дедим."},{"t":"p","h":"– Ооба, сага... – деп, мурчуң этти Оңдош."},{"t":"p","h":"– Тиги Күзгү көлгө келип, көрүнүп, чачымды тарайм."},{"t":"p","h":"– Кайсы чачыңды? Пыш-ш..."},{"t":"p","h":"– Чач койдурам да!- дедим."},{"t":"p","h":"– Пыш-ш... Чач койдургандай, эмне, сен өкмөт болмок белең?"},{"t":"p","h":"– Болом да! – деп салдым кебелбей туруп (Ж. Медетов)."},{"t":"p","h":"№ 28"},{"t":"h3","h":"ЖАРНАК"},{"t":"p","h":"«Тегене» дүкөнү чет өлкөдөн алынып келинген, эң сонун, көргөндүн көз жоосун алган татынакай, урунууга өтө ылайыктуу үй эмеректерин сатат. Телефону: 48—52—16."},{"t":"p","h":"<span class=\"pg\" data-n=\"173\">173<\/span>№29 Чарба. Иранча чар төрт жана па – бут сөздөрү биригип, чарба сөзү келип чыккан. Ал төрт бут дегенди туюнтат, кыргызча төрт түлүк мал дегенге барабар келет. Бирок анын мааниси кеңий берип, азыр бутка эч тиешеси жок түшүнүктөрдү да туюнтуп калган. Мисалы: дан чарбасы, токой чарбасы (К.Сейдакматов)."},{"t":"p","h":"№ 30"},{"t":"h3","h":"ТОКТОМ"},{"t":"p","h":"1998-жылы 1-март күнү УП класстын окуучуларынын чогулушу болуп, ага 27 окуучу катышты."},{"t":"p","h":"Чогулуш башчылары: Иманканов Туратбек, Урманбетов Токторбай, Асанов Камарбек, Дүйшөналиев Асем, Абдыразаков Матисак."},{"t":"p","h":"Күн тартибиндеги каралуучу маселе: Нооруз майрамына даярдануу."},{"t":"p","h":"1. Угулду: Аталган маселе боюнча «Сейтек» кошуунунун башчысы Урманбетов Токторбай Нооруз майрамынын тарыхына, анын байыркылыгына кен-кесири токтолду. Андан ары бул майрамды эң сонун шаан-шөкөт менен өткөрүү боюнча класстар аралык мелдеш болорун, жеңип чыгуу үчүн кандай иштерди жүргүзүү керектигин айрыкча белгиледи."},{"t":"p","h":"П. Чыгып сүйлөнгөндөр: 1. Т. Мааткеримова драмалык чыгармалардан айрым үзүндүлөрдү алып чыгуу керектигин айтты. 2. К.Акмолдоева майрамда дасторкон үстүн жайнатууну, өзгөчө олобо, эжигей, мыкчыма, кошкон май, жупка, көөлөнгөн талкан өндүү тамактарды даярдап келүү сунушун айтты. 8. М.Мамазаирова кол өнөрчүлүк буюмдары менен кошо класстын таланттуу окуучуларынын чыгармаларынан түзүлгөн дубал гезит чыгарууну сунуштады."},{"t":"p","h":"Ш. Чогулуш токтом кылат: 1. Нооруз майрамына колунан келген даярдык менен келүү жагы ар бир окуучуга милдеттендирилсин. 2. Кимдин эмне иш аткарып жаткандыгы жөнүндө күн сайын маалымат берип турулсун. 8. Бул иш-чаралардын жоопкерчилиги кошуун башчысы Т.Урманбетовго жүктөлсүн."},{"t":"p","h":"Каршы, калыс жок. Токтом бир добуштан кабыл алынды. Чогулуш башчысы:"},{"t":"v","l":["Катчысы:","(колу) Т.Урманбетов","(колу) М.Абдыразаков"]},{"t":"p","h":"<span class=\"pg\" data-n=\"174\">174<\/span>№ 81 Көк таш – ачык көк түстөгү кристалл. Сууда жакшы эрийт. Чирүүдөн сактоо максатында көк таш әритмеси жыгачка сиңирилет. Боёк алууда, үрөн дарылоодо, тери ийлөөдө, өсүмдүктүн илдеттерине жана зыянкечтерине каршы күрөшүүдө кеңири колдонулат («Кыргыз совет энциклопедиясы»)."},{"t":"h3","h":"Стилистика боюнча суроолор"},{"t":"p","h":"1.Стилистика деген эмне?"},{"t":"p","h":"2. Ал текст менен кандай байланышы бар?"},{"t":"p","h":"3. Байланыштуу кеп менен стилистиканын карым-катышы барбы?"},{"t":"v","l":["4. Стилистика канчага бөлүнөт?","о. «Йлхам кеп» топтому стилдин кайсы түрүнө кошулат?"]},{"t":"p","h":"6. «Серектин сыр сандыгындагы» материалдар кайсы стилге кирет?"},{"t":"p","h":"7. «Мээр сөз» топтомучу?"}],"sub":[{"title":"БАЙКОО ЖҮРГҮЗҮҮ","b":19},{"title":"ӨЗ АЛДЫНЧА ИШТӨӨ","b":30},{"title":"ӨМҮР БАЯН","b":50},{"title":"УКАЗЫ","b":55},{"title":"ТИЛ КАТ","b":67},{"title":"ТҮШҮНҮК КАТ","b":79},{"title":"МААЛЫМДАМА","b":82},{"title":"ИШЕНИМ КАТ","b":88},{"title":"КУЛАКТАНДЫРУУ","b":95},{"title":"ЖАРНАК","b":106},{"title":"ТОКТОМ","b":110},{"title":"Стилистика боюнча суроолор","b":120}],"section":"УП КЛАСС","pages":[162,174]},{"title":"КЕП КУРЖУН &amp; 25. «МАКАЛ» ТОПТОМУ","blocks":[{"t":"h3","h":"КЕП КУРЖУН &amp; 25. «МАКАЛ» ТОПТОМУ"},{"t":"p","h":"(1-6-тесте УП класста өтүлгөн)"},{"t":"h3","h":"Жетинчи тесте"},{"t":"p","h":". «Чөп ширеси мал семиртет, кеп ширеси жан семиртет». юго с. «Әстүүгө эки ооз сөз жетет». ‚ «Атка жаталак, адамга чычалак жарашпайт». ‚. «Адамдын адамгерчилиги ачуусу келгенде билинет». ‚ «Адамдын бири – тентек, бири – жөнтөк».. «Адеби жок жигит жүгөнү жок атка окшош».. «Адепсиз бала – таманга жабышкан чыла».. «Жылкы аласы сыртында, адам аласы ичинде»."},{"t":"p","h":". «Адам көркү – адеп»."},{"t":"h3","h":"Сегизинчи тесте"},{"t":"p","h":"1. «Азамат бир сырдуу, миң кырдуу»."},{"t":"p","h":"2. «Азамат жакшысы он бешке келсе, кичүүлүк жок, жүзгө чыкса, карылык жок»."},{"t":"v","l":["3. «Азга опа, көпкө жапаа».","4. «Айыбын жашырган алыска узабайт»."]},{"t":"p","h":"5. «Айдын жарыгында жүргөнчө, күндүн көлөкөсүндө жүр»."},{"t":"p","h":"6. «Айыпсыз аякка тикенек кирбейт»."},{"t":"p","h":"<span class=\"pg\" data-n=\"175\">175<\/span>Т. «Ак көңүлдүн аты арыбайт, тону тозбойт»."},{"t":"p","h":"8. «Чын жакшынын ачуусу бар, кеги жок»."},{"t":"p","h":"9. «Акма кулакка айтса болбойт, куйма кулакка куйса толбойт»."},{"t":"h3","h":"Тогузунчу тесте"},{"t":"p","h":"«Акмак иттен илгери, кишиден кийин»."},{"t":"p","h":"‚ «Акмакка да акыл азуу чыгат»."},{"t":"p","h":"со оо ль с. «Алы жетпеген акыретчил». «Алып алтоо, жеп жетөө болбойт». «Аксактын аягына кара». «Алтынды дат баспайт». «Ар бир башта миң кыял, миң кыялды ким тыяр»."},{"t":"p","h":"«Ала койду бөлө кырккан жүнгө жарыбайт»."},{"t":"p","h":"«Аларманга алтоо аз, берерманга бешөө көп»."},{"t":"h3","h":"Онунчу тесте"},{"t":"p","h":"1. «Арамдын түбү – бир тамыр, адалдын түбү – мин та-"},{"t":"p","h":"2. «Әр азамат белгиси – сыртта мырза, үйдө кул»."},{"t":"v","l":["3. «Аркы өйүздөгү чабышка бу өйүздөн жулунба».","4. «Ат сыноосу – бир, эр сыноосу – мин».","5. «Атына кызыкпа, затына кызык».","6. «Ачуулуунун астынан чыкпа».","Т. «Ачуусу чукул айыпка жыгылат».","8. «Баатыр бир өлөт, коркок мин елет»."]},{"t":"p","h":"9. «Жакшынын атын алыстан ук, жанына барсаң бир киши»."},{"t":"h3","h":"Он биринчи тесте"},{"t":"p","h":"1. «Бакылдаган текени суу кечкенде көрөбүз, такылдаган келинди үй чечкенде көрөбүз»."},{"t":"p","h":"2. «Берешенден бешиктеги бала да үмүт кылат»."},{"t":"p","h":"3. «Бир мыскал дөөлөттү көтөрүү учун, миң мыскал токтоолук керек»."},{"t":"v","l":["4. «Боор оорусаң боорго тебет».","5. «Бүркүт карыса, чычканчыл болот».","6. «Ит кутурса, ээсин кабат»."]},{"t":"p","h":"Т7. «Жакшы кыз – жакадагы кундуз, жакшы жигит – көктөгү жылдыз»."},{"t":"p","h":"8. «Жакшы санаа – жарым ырыс», 9. «Жакшылыкка жакшылык – ар кишинин иши, жамандыкка жакшылык – эр кишинин иши»."},{"t":"h3","h":"<span class=\"pg\" data-n=\"176\">176<\/span>Он экинчи тесте"},{"t":"p","h":". «Болор иш болду, боёсу канды»."},{"t":"p","h":". «Бирөөнүн аты – терчил, бирөөнүн кийими – кирчил».. «Бир чыбык менен мин кой айдалат»."},{"t":"v","l":["‚ «Бир үйдүн жарыгы бир үйгө тийбейт».",". «Бирөө өлүп жатса, бирөө күлүп жатат».",". «Бир ит көрүп үрөт, бир ит көрбөй үрөт».",". «Балыкчы балыкчыны алыстан тааныйт».",". «Балык башынан сасыйт».",". «Баканын өзү чөлдө болсо да, көзү көктө»."]},{"t":"h3","h":"МАКАЛ ЖАТТОО"},{"t":"v","l":["Ар бир тестени өзүнчө жатта.","",". Сегизинчи тесте: 1, 2, 8, 4, 5, 6, Т, 8, 9.",". Тогузунчу тесте: 1, 2, 8, 4, 5, 6, Т, 8, 9.","",". Он биринчи тесте: 1, 2, 3, 4, 5, 6, Т, 8, 9.",".Он экинчи тесте: 1, 2, 3, 4, 5, 6, Т, 8, 9."]},{"t":"h3","h":"МАКАЛ АЙТЫШУУ"},{"t":"p","h":"\"—9-тесте боюнча Шарты. Окуучулар эки топко бөлүнөт. Ар бир топ өзүнүн мыкты өкүлүн чыгарат. Анан алар кезеги менен улам макал айтышат. Бирөө токтоп калса, экинчиси күймөлбөй айта берсе болот. Бир макал эки кайталанбайт. Макалды көп билгени утуп чыгат."},{"t":"v","l":["10—12-тесте боюнча","Мунун шарты да 7—9-тестедегиге окшош.","1—12-тесте боюнча"]},{"t":"p","h":"Окуучулар топко бөлүнбөйт. Ар бир окуучу өзү үчүн күрөшөт. Доскага чыгар менен, билген макалдарын шатырата айтат. Мугалим санайт. Мында да бир макал экинчи кайталанбайт."},{"t":"p","h":"«Айдан, айдан ай көрөк» оюну Окуучулар эки топко бөлүнөт. Маселен: 1-топтогулар хор менен минтип ырдашат: «Айдан, айдан ай көрөк, Айдын башы төгөрөк, макалдан камчы чаптырбас, бизге тээтигил Алмаздын өзү керек». 2-топтон Алмаз чыгат. Албетте, 1- <span class=\"pg\" data-n=\"177\">177<\/span>топтогулар 2-топтун таймашка чыгуучу өкүлүнүн макалды мыкты билишине кызыкдар эмес. Ошондуктан алар макал билбеген атаандашын таймашка алып чыгууга аракет кылышат. Ал эми 2-топтогулар да 1-топтун окуучуларындай эле жол менен атаандашты доскага чакырып алышат. Ошентип, эки жактын өкүлү кезеги менен улам бирден макал айтат. Мында да бир макал эки жолу кайталанбайт. Бири токтоп калса, экинчиси удаама-удаа бир нече макалды шатырата айтып, макалдын санын арбыта алат. Ал эми өз өкүлүнө шыбырап-күбүрөп жардам кылынып калса, мындай ар бир жардам үчүн макалдын саны экиге кыскарат. Демек, эки макал күйүп кетет. Мында макалды көп билгени утуп чыгат."},{"t":"p","h":"Ушул тартип боюнча макал айтышуу оюну төмөнкүлөрдү камтыйт."},{"t":"p","h":"2. 10-12-тестелерди."},{"t":"p","h":"Зарылдыгына жараша бул эки топтогу тестелердин бири эки же андан ашык кайталанышы мумкун."},{"t":"p","h":"Суйлеп машыгуулар"},{"t":"p","h":"1. Жетинчи, сегизинчи тесте боюнча оозеки суйлем туз."},{"t":"p","h":"2. Тогузунчу, онунчу тесте боюнча оозеки сүйлөм туз."},{"t":"p","h":"3. Он биринчи жана он экинчи тесте боюнча оозеки сүйлөм түз."},{"t":"p","h":"Үл г ү: 1. «Базарда миң киши бар, ар ким сүйгөнүнө салам берет» деген ырас да («Базарда миң киши бар, ар ким сүйгөнүнө салам берет» дегенди кулагыңыз чалды беле. «Базарда миң киши бар, ар ким сүйгөнүнө салам берет» да, үйдөн даам сызып кетиңиз ж.б.)."},{"t":"p","h":"2. Жумабек минтип айткан: «Базарда миң киши бар, ар ким сүйгөнүнө салам берет» («Базарда миң киши бар, ар ким сүйгөнүнө салам берет», – деген Саадат. Сыйнат: «Базарда миң киши бар, ар ким сүйгөнүнө салам берет»,—деген. «Базарда,—деген Аксаамай,—миң киши бар, ар ким сүйгөнүнө салам берет». Базарда миң киши барын, ар ким сүйгөнүнө салам берерин Сакин айткан)."},{"t":"p","h":"Әскертүү: Үлгүдө бир макал боюнча 8 сүйлөм түзүлгөн. Бирок тестелер боюнча оозеки иштөөдө бир макалга эки гана сүйлөм түзүлөт, б.а. үлгүдөгү эки түргө бирден."},{"t":"p","h":"1717"},{"t":"h3","h":"<span class=\"pg\" data-n=\"178\">178<\/span>Жазып машыгуу"},{"t":"p","h":"203-кенугуу. Жетинчи жана сегизинчи тестедеги 18 макалдын ар бирин өзүнчө сүйлөмгө катыштыр жана тыныш белгилерин туура коюп жаз."},{"t":"p","h":"Үлг ү: 1. «Чөп ширеси мал семиртет, кеп ширеси жан семиртет», – деген карыянын куюлушкан нускасын тыңшап, ыракатка баттым. 2. Күлүйпа: «Чөп ширеси мал семиртет, кеп ширеси жан семиртет», – деп айткан кыздарына."},{"t":"p","h":"204-көнүгүү. Тогузунчу жана онунчу тестелер боюнча сүйлөм түз. 208-көнүгүүдөгү үлгүгө окшоштуруп жаз."},{"t":"p","h":"205-көнүгүү. Он биринчи жана он экинчи тестелер боюнча сүйлөм туз. 203-кенугуунун үлгүсүн окшоштуруп иште."},{"t":"h3","h":"СӨЗ» ТОПТОМУ"},{"t":"p","h":"(1-4-кайрыктар УП класста өтүлгөн)"},{"t":"h3","h":"Бешинчи кайрык"},{"t":"p","h":"1. Бар болбой малың чачылбайт, жок болбой жонуң ачылбайт."},{"t":"p","h":"2. Сөз кадырын биле албайт, өзүнөн акыл чыкпаган. Кеп маанисин биле албайт, башына акыл жукпаган. Жан кадырын биле албайт, айтса акылды укпаган."},{"t":"p","h":"3. Ашыкча доор келгенде, атылган жоого мылтыксын, алтындан мунар чырпыксың. Ашыкча доор кеткенде, ажалдуу болгон чымчыксың."},{"t":"p","h":"4. Күлүстөн доор келгенде, көгөргөн чалкар көлдөйсүң, кийиги көп төрдөйсүң. Күлүстөн доор кеткенде, көмүлгөн кара көрдөйсүң."},{"t":"p","h":"5. Алганды айтпай бергенди айт, жоону жеңип келгенди айт! (Жеңижок)."},{"t":"h3","h":"Алтынчы кайрык"},{"t":"p","h":"1. Көк болот ийне саптаган, көк тубар көрпө каптаган, кайчысы колго батпаган, каалаган иштен кайтпаган. Ак куштай боюн таптаган, ай алдынан өткөндөн, алтындан буйла чечкенден, сыр аякка куйгандан, сыланып кымыз сунгандан, белдемчи таккан белине, пейили жаккан элине, акын болсоң кемпирди айт!"},{"t":"p","h":"2. Үзүгүнүн жээгине үч эли кундуз койдурган, жабыгын ачык ойдурган, жабыгынын жээгине жалпы кундуз койдурган, <span class=\"pg\" data-n=\"179\">179<\/span>айдаса көчү жылдыздай, арс ичиги кундуздай, көчкөндө көчү жылдыздай, көрпө ичиги кундуздай, көөкөрүнө кут түшкөн, көк кашка кулун жуп түшкөн, сабаам бир кооз болсун деп, сары жибек менен тиктирген, кымыздык менен ыштаткан, кырмызы менен тыштаткан, сары атанга арттырган, салтанатын карк кылган, каз элечек бош таштап, катарлап төө көч баштап, торко элечек бош таштап, тогуздан төө көч баштап, келишкен кыргыз көчүн айт (Жеңижок)."},{"t":"h3","h":"Жетинчи кайрык"},{"t":"p","h":"1. Акыл менен санасак, адамзат болбойт бир кылка. Ар башка сүрөт өмүрдү адамдар ушул турмушта."},{"t":"p","h":"2. Жакшы болуп жүрүүгө жакшыдан тапкын жолдошту. Жолотпогун жаныңа жанын жеген оңбосту."},{"t":"p","h":"3. Жаманын билсең жолдоштун жанына барбай оолакта. Алты саның аманда эсендик тиле соо башка."},{"t":"p","h":"4. Суу сыйлаган зор болор, суу кордогон кор болор."},{"t":"p","h":"5. Күн артынан күн чубап, өтө берет турбайбы, өткөн күн менен өмүрүң кете берет турбайбы, каниет кылсан баарына, жете берет турбайбы (Жеңижок)."},{"t":"h3","h":"Сегизинчи кайрык"},{"t":"p","h":"1. Бек байлаган чечилбейт. Бакпай багың жетилбейт. Әстүү адам эсирбейт."},{"t":"p","h":"2. Аргымак белин жоорутпа, аманат назик жан деген, адамдын көөнүн оорутпа."},{"t":"p","h":"3. Ааламдын көркү күндө бар, адамдын көркү тилде бар, ай, жылдыз көркү түндө бар, жаз айдын көркү гүлдө бар."},{"t":"p","h":"4. Тоо сөөлөтү ташта бар, баканын көркү сазда бар. Саамайдын көркү кызда бар, сайманын көркү узда бар."},{"t":"p","h":"5. Бул дүйнөдө ким калат? Жарык берген күн калат. Жылдызы бар түн калат. Кийинкиге сөз калат. Акылмандан эс калат (Жеңижок)."},{"t":"v","l":["Жаттоо","","Ар бир кайрык өзүнчө жатталат.","1. Бешинчи кайрык: 1, 2, 8, 4, 5.","2. Алтынчы кайрык: 1, 2.","3. Жетинчи кайрык: 1, 2, 8, 4, 5.","4. Сегизинчи кайрык: 1, 2, 3, 4, 5."]},{"t":"h3","h":"<span class=\"pg\" data-n=\"180\">180<\/span>Сүйлөп машыгуу"},{"t":"p","h":"206-көнүгүү. Бешинчи кайрыктагы санаттарды өз сөзүңө кошуп сүйлө. Үл г ү: «Бар болбой малың чачылбайт, жок болбой жонуң ачылбайт» деген Жеңижоктун сөзү чын, анткени бар мал чачылат, ал эми жоктун жону ачылбаганда не болот."},{"t":"p","h":"207-көнүгүү. Алтынчы кайрыкта эки санат сөз бар. Әкөөнүн тең сөздөрү көп. Ошентсе да 206-көнүгүүдөгү үлгүгө окшоштуруп сүйлө. 208-көнүгүү. Жетинчи кайрыктагы санат сөздөрдү өз сөзүңөргө кошуп, диалог түрүндө сүйлөшкүлө."},{"t":"p","h":"209-көнүгүү. Сегизинчи кайрыктагы санат сөздөрдү пайдаланып, оозеки аңгеме түзгүлө."},{"t":"h3","h":"Жазып машыгуу"},{"t":"p","h":"210-көнүгүү. Бешинчи кайрыктагы санат сөздөрдү катыштырып, сүйлөм түз жана жаз. Мында төл жана бөтөн сөздүн ©» УХ турун колдон. 211-кенугуу. Жетинчи кайрыктагы санат сездерду тел жана бетен сездун х: &lt;&gt; түрү боюнча жаз."},{"t":"p","h":"212-көнүгүү. Сегизинчи кайрыктагы санат сөздөрдү төл жана бөтөн сөздүн А, туру боюнча жаз."}],"sub":[{"title":"Жетинчи тесте","b":2},{"title":"Сегизинчи тесте","b":5},{"title":"Тогузунчу тесте","b":14},{"title":"Онунчу тесте","b":20},{"title":"Он биринчи тесте","b":25},{"title":"Он экинчи тесте","b":32},{"title":"МАКАЛ АЙТЫШУУ","b":38},{"title":"СӨЗ» ТОПТОМУ","b":59},{"title":"Бешинчи кайрык","b":61},{"title":"Алтынчы кайрык","b":67},{"title":"Жетинчи кайрык","b":70},{"title":"Сегизинчи кайрык","b":76}],"section":"УП КЛАСС","pages":[175,180]},{"title":"§ 27. «СӨЗ БЕРМЕТИ» ТОПТОМУ","blocks":[{"t":"h3","h":"§ 27. «СӨЗ БЕРМЕТИ» ТОПТОМУ"},{"t":"p","h":"(1—5-тесте УП класста өтүлгөн.)"},{"t":"h3","h":"Алтынчы тесте"},{"t":"p","h":"1. Жетине албай калуу (кубануу, абдан ыраазы болуу, сүйүнүү)."},{"t":"p","h":"2. Жер-жеберине жетүү (абдан катуу тилдөө, жекирүү, майда-чүйдөсүнө чейин, эчтемесин калтырбай сөз кылуу)."},{"t":"p","h":"3. Жер каймактагандан бери (капкачан, алда качан эле, атам замандан бери, небактан эле)."},{"t":"p","h":"4. Жер менен жексен болуу (жоголуу, кыйроо, талкалануу, жок болуу)."},{"t":"p","h":"5. Жер чечегин безөө (өтө уккулуктуу доош, үн чыгаруу, сайроо, чечен сүйлөө, безилдеп көп сүйлөө)."},{"t":"p","h":"6. Жети өмүрү жерге кирүү (абдан катуу уят болуу, сынуу)."},{"t":"p","h":"<span class=\"pg\" data-n=\"181\">181<\/span>7. Жибин тартып көрүү (ой пикирин, сырын тартуу, астыртан байкап көрүү)."},{"t":"p","h":"8. Жигин билгизбөө (кандайдыр бир иш же бир нерсе жөнүндө шек алдырбоо, сыр алдырбоо, жашырып-жабууга аракет кылуу)."},{"t":"h3","h":"Жетинчи тесте"},{"t":"p","h":"1. Жилиги үзүлгөнчө (аябай катуу жүгүрүү, чуркоо деген мааниде колдонулат.) 2. Жолун кылуу (кимдир бирөөнүн көрсөткөн жакшылыгына, кандайдыр бир ишке жарап бергенине жана башкаларга карата сый кылып бир нерсе берүү, тартуулоо, сыйлоо)."},{"t":"p","h":"3. Жон терисин сыйруу (сазайын колуна берип, абдан катуу жазалоо)."},{"t":"p","h":"4. Жону жука (жарды, кедей, колунда жок, алсыз)."},{"t":"p","h":"5. Жонунан кайыш алуу (көргүлүктү көрсөтүү, абдан кыйноо, сазайын колуна берүү, катуу жазалоо)."},{"t":"p","h":"6. Жоон билек (кара күчүнө таянган балбан, алдуу-күчтүү, карылуу)."},{"t":"p","h":"7. Жоон моюн (тоотпогон, кенебеген, менменсинген)."},{"t":"p","h":"8. Жоон өпкө (менменсинген, ала көөдөн, мактанчаак)."},{"t":"p","h":"Сегизинчи тесте 1. Жөргөмүштүн торуна чалынуу (кутула алгыс азапка, ишке, кырсыкка, кордукка кириптер болуу, туш келүү)."},{"t":"p","h":"2. Жумурткадан кыр чыгаруу (жөнү жок, ыгы жок жерден кыйкым табуу, кемчилик, өөн табуу)."},{"t":"p","h":"3. Жумуруна жук болбоо (тамак абдан аз болуп, алымсынбай калуу, тойбой калуу)."},{"t":"p","h":"4. Жүзү жарык (ажарлуу, жайдары, элге уят болбогудай, эл алдында кызарбагандай абалда)."},{"t":"p","h":"5. Жүзүн ала качуу (уялганынан, айбыкканынан адамга тике карай албай жалтактоо)."},{"t":"p","h":"6. сайгандай (чочуткандай, ачууну келтиргендей, кыжырга тийгендей, так секирткендей)."},{"t":"p","h":"7. жарыла жаздоо (абдан катуу толкундоо, сүйүнүү)."},{"t":"p","h":"8. Жүргөн жерине чөп чыкпоо (жөн жүрө албай дайыма бузукулук иш жасоо, ушак-айың кеп чыгарып, ырк бузуу, бүлүнтүп жиберүү)."},{"t":"p","h":"Тогузунчу тесте 1. Жүрөгү курч (өтүмдүү, эч нерседен тайманбаган, жалтанбаган, өткүр)."},{"t":"p","h":"<span class=\"pg\" data-n=\"182\">182<\/span>2. Жүрөгүндө кара жок (тайманбас баатыр, эр жүрөк, өткүр, курч, ак ниет, ичинде арамдыгы жок, ак пейил)."},{"t":"p","h":"3. Жүрөгүндө оту жок (өтүмү жок, тартынчаак, жашык, жалтан)."},{"t":"p","h":"4. Жүрөгүнө барбоо (тамак ичүүгө табити тартпоо, ичкиси келбөө)."},{"t":"p","h":"5. Жүрөгүнүн сары суусун алуу (биротоло коркутуп алуу, кайратын качыруу, мизин кайтарып, дайыма коркуп, чочулап тургандай абалга келтирүү)."},{"t":"p","h":"6. Жүрөгү өлүү (абдан катуу коркуп, жалкып калуу, бир нерсени экинчи кайталагыс, баш көтөргүс болуу)."},{"t":"p","h":"7. Жүрөгү тоо (коркконду билбеген, кебелбеген, солк этпеген, жүрөктүү баатыр)."},{"t":"p","h":"8. Жүрөгү үшүү (коркуп, жалкып калуу, жүрөкзаада болуу)."},{"t":"h3","h":"Онунчу тесте"},{"t":"p","h":"1. Жүүнү бош (болбураган, жоош, чыйрак эмес, колунан эч нерсе келбеген)."},{"t":"p","h":"2. Жылдызы жарык (жаркылдаган, жайдары, сүйкүмдүү). З. Жылдызы түшүү (көңүлү чөгүү, капа болуу)."},{"t":"p","h":"4. Жылдызы ысык (сүйгүнчүлүктүү, жагымдуу, мээримдүү)."},{"t":"p","h":"5. Жылкы кыял (мүнөзү терс, чунаңдаган, чырт дей түшмө)."},{"t":"p","h":"6. Ийненин көзүндөй (эң эле кичинекей, абдан кичине)."},{"t":"p","h":"7. Оозунун жээги жок (сүйлөөк, оозуна алы келбеген, ылайыгы келсе, келбесе да тартынбай сүйлөгөн, туура эмес болсо да уялып кысынбаган)."},{"t":"p","h":"8. Жыты сиңишүү (бири-бирине абдан алынышып калуу, өтө жакын болуп кетүү)."},{"t":"p","h":"Сүйлөп машыгуу 213-кенугуу. Алтынчы тестедеги ар бир сөз берметин катыштырып бирден, кааласаң эки-үчтөн сүйлөм туз.."},{"t":"p","h":"Улгу: 1. Баласынын тай үйрөткөнүнө атасы жетине албай калды. 2. Уулунун аскерден келгенине жетине албай кубанган ата-энеси дароо той берди. 3. Жетине албаган суйунучунду кудай кут кылсын!"},{"t":"p","h":"214-көнүгүү. Жетинчи тестедеги ар бир сөз берметин катыштырып бирден, кааласан эки-үчтөн оозеки сүйлөм түз."},{"t":"p","h":"215-кенугуу. Сегизинчи тесте боюнча да 213-кенугууге окшоштуруп иште."},{"t":"p","h":"<span class=\"pg\" data-n=\"183\">183<\/span>216-көнүгүү. Тогузунчу тесте да 213-кенугуудей иштелет."},{"t":"p","h":"217-кенугуу. Онунчу тестедеги ар бир сөз берметин катыштырып бирден, кааласаң эки-үчтөн оозеки сүйлөм түз."},{"t":"p","h":"Жазып машыгуу 218-көнүгүү. Алтынчы тестедеги ар бир сез берметине бирден сүйлөм түз жана жаз."},{"t":"p","h":"Үлгү: Әлдин дүркүрөтө кол чапканына Гүлнур Сатылганова жетине албай калды."},{"t":"v","l":["219-көнүгүү. Жетинчи тестени да 218-көнүгүүдөй аткар.","220-көнүгүү. Сегизинчи тесте да 218-көнүгүүдөй иштелет.","221-көнүгүү. Тогузунчу тесте да 218-көнүгүүдөй аткарылат.","222-көнүгүү. Онунчу тестени да 218-көнүгүүдөй иште.","","Чеберчиликке машыгуу"]},{"t":"p","h":"228-көнүгүү. Мында 6-10-тестедеги сөз берметтерин толук пайдаланып, беш сүйлөмдүн ар бирине эки же андан ашык сөз берметин катыштырып жазасын."},{"t":"p","h":"Үлгү: Жер каймактагандан бери жер чечегин безеп сүйлөгөн чечендер эл арасынан үзүлбөгөн. Эки сөз бермети катышты."},{"t":"p","h":"224-көнүгүү. 6—10-тестедеги сөздөрдү пайдаланып, 6 сүйлөм жазасын, ар биринде эки же андан ашык сөз бермети болсун."},{"t":"p","h":"225-көнүгүү. Үч сүйлөмдүн ар бирине үчтөн сөз берметин катыштырып жазасын."},{"t":"p","h":"Үлгү: Иштин жигин билгизбей анын жибин тартып көрдү эле, айыпкер мойнуна алды да, жолун кылып кутулууга шашылды. Мында үч сөз бермети катышты."},{"t":"h3","h":"«КӨЧМӨ БАРАК» ОЮНУ"},{"t":"p","h":"Окуучулар партага жараша эки катар болсо төрт, үч катар болсо 6 топко бөлүнөт. Ар бир топко мугалим бирден актай барак берет. Ага топтун биринчи окуучусу сөз бермети катышкан бир сүйлөм жазып, аны арткы партадагыга, ал андан ары узатат. Учуна чыкканда алдыңкы партадагы окуучудан кайра башталат. Ошентип, «көчмө баракты» тез толтуруп узаткан топ жеңүүчү болот. Сүйлөмдүн мазмуну ‚ андан сон текшерилип, жыйынтыгы айтылат."},{"t":"h3","h":"<span class=\"pg\" data-n=\"184\">184<\/span>«КӨЧМӨ БАРАКТАГЫ» ЧЕБЕРЧИЛИК"},{"t":"p","h":"Бул да «Көчмө барак» оюнуна окшош. Бир аз айырмасы бар. 1. Буга окуучулар толук катышпайт. 5—6 окуучудан турган тандалган эки топ түзүлөт. 2. Ошол эки топтун ортосунда «көчмө баракка» эки же андан ашык сөз берметин бир сүйлөмгө сыйгызып түзүү боюнча таймаш болот."}],"sub":[{"title":"Алтынчы тесте","b":2},{"title":"Жетинчи тесте","b":11},{"title":"Онунчу тесте","b":35},{"title":"«КӨЧМӨ БАРАК» ОЮНУ","b":57},{"title":"«КӨЧМӨ БАРАКТАГЫ» ЧЕБЕРЧИЛИК","b":59}],"section":"УП КЛАСС","pages":[181,184]},{"title":"§ 28. «МЭЭР СӨЗ» ТОПТОМУНАН","blocks":[{"t":"h3","h":"§ 28. «МЭЭР СӨЗ» ТОПТОМУНАН"},{"t":"p","h":"(1-3-чачыла УП класста өтүлгөн)"},{"t":"p","h":"Тертунчу чачыла 1. Тупкурден дунгуреп, толкун учу алтын кумдуу жээкке жай келип, шарп-шурп уруп, кайра тымып, кайра оодарылат, термелет. Чырым булут токтогон боз асманда кайгып, кыйкылдап бир үйүр ак чардак учуп жүрөт (Т. Касымбеков)."},{"t":"p","h":"2. Жээктеги кыламыкка бой салып калкып жаткан кере кулач көк чаар балык шарп эткизе куйругу менен суу чаап, иримге сүңгүйт."},{"t":"p","h":"3. Даанышман айылына күмүш чамгарак, ичи көз кайкыткан, сырты каз жумурткасындай он эки канат үй көтөрттү."},{"t":"p","h":"4. Аяк-башы атка күндүк жол, үч минден ашык бийиктиктеги тоо үстүндөгү Соң-Көлгө акыл айран! Үстү толгон каз, өрдөк, ак куу, аңыр. Аймагы көз жеткис мейкин. Кытыр эткен ташы жок кочкул топурагына кыска, кызгылт бетеге чыгат. Ушул бетегесин оттогон төрт түлүк мал жарылгандай семирет. Әти ширин, кымызы чөбүнө түспөлдөш кызгылт келет (К. Осмоналиев)."},{"t":"p","h":"5. Ошол күнү Актаманды карап тургандардын көз кумары канды белем! Бүргөдөй сайылып жеткен алгыр тайган бөрүлөрдү бирине бирин кошпой жалгыздатып, арткы толорсукту кырча каап, силкип өтөт (К.Осмоналиев)."},{"t":"p","h":"Бешинчи чачыла 1. Акын курч, атылган окчо ташка тиет. Акын жалын, алоолоп алса, күйгүзөт да эритет. Акын назик, капыстан урган суук желге кызгалдактай жалбырагын жулдурат. Акын морт, орой сөзгө чорт сынат (К. Осмоналиев)."},{"t":"p","h":"2. Анан балага укмуш бир үн угулду, бешикке таккан жылаажын үнү кулактын кужурун кандырып алыстан чыкты. Жылаажындын үнү улам жакындап келатты, улам күчөп келатты. Тоо ашып, токой аралап, суу жээктеп Бугу-Әне келатты, мүйүзүндө жылаажындуу кайың бешик илип келатты (Ч. Айтматов)."},{"t":"p","h":"<span class=\"pg\" data-n=\"185\">185<\/span>3. Бирөө бугу экен, чамгарактай зор мүйүзү айры бутактанып заңгырайт. Жону буудай түстөнүп, ууз түс кең омуроо, чымыр денеси алибеттүү. Суудан башын көтөргөндө, кара кыйма агыш жээк кылкандуу калбык эрдинен суу тамчылап турду (Ч. Айтматов)."},{"t":"p","h":"4. Куду эле Мүйүздүү Бугу-Әненин өзү. Алагар көздөрү түндүктөн түшкөн куттай балбылдайт. Көздөрү нымдашып, тереңинен жылтылдайт. Таноолорунан жеңил буу бууланат (Ч. Айтматов)."},{"t":"p","h":"5. Анын жанында талдын жаш бутактарын жалмалап, токол кунажын марал турат. Соорусу жумурткадай томпоюп, чымыр денеси жок шыбыртка дирт-дирт этет, бирок турушу ойноок (Ч. Айтматов)."},{"t":"h3","h":"Алтынчы чачыла"},{"t":"p","h":"1. Желп-желп этип мелүүн керимсел жүргөндө, шимүүрдүн асел жыты, шыраалжын менен эрмендин кермек жытына аралашып, аңызга жайылып, буудай арасы шуудурап, кылкасына илинген ай жарыгы алтын көлдөй кубулуп чайкалып жатты (Ч.Айтматов)."},{"t":"p","h":"2. Жер, жан жараткан жер, бизди көтөрүп жаткан жер, сен бизге таалай бербесен, эмнеге жер болуп орнойсун да, биз эмнеге дүйнөгө жаралабыз! Биз сенин балдарыңбыз, жер, тилектеш болгун, ак тилегибизге жеткиргин (Ч. Айтматов)."},{"t":"p","h":"3. Бирде жээкке урунган эрке толкундай угулар-угулбас шапшынып, бирде тымтырс ойлоно калып, сагынычтуу санаага толгондой, алда эмнеге мундана үшкүрүп, жулкунган шамал булут айдап, жаан айдап, бутактарын кайрып тийгенде, теректер бой тиреше чыңалып, «бизди жыгалбайсың» дегендей, өжөрлөнө күүлөнүшөт (Ч. Айтматов)."},{"t":"p","h":"4. Жайы менен жайлоодо түтүнгө ышталган жылкычылардын үйлөрү азыр чоң сайдын буурул тарткан чабындысында тигинде-мында карайып, ак элечек, ак көйнөк кийгендей түтүндөр чамгарактан этек-женин чубалжытып, той тойлогон аялдардай айылма-айыл көйкөлүшөт (Ч.Айтматов)."},{"t":"p","h":"5. Акактап күйүккөн шамал талаадан жулунуп келип, саманды уйгу-туйгу сапырыштырып, кырмандын четинде кыңырыла түшкөн боз үйгө бир тийип, жол менен сабалап куюндады. Жашыл-ала көгүлтүр чагылгандар ийме-чийме сынып, жардын артына сууга түшүп жатты. Андан-мындан тийип, саманды чаба черткилеп, жаандын алгачкы тамчылары дыбырай баштады (Ч.Айтматов)."},{"t":"h3","h":"<span class=\"pg\" data-n=\"186\">186<\/span>Көрктүү окуу"},{"t":"p","h":"1. Адегенде чачыладагы мээр сөздөрдү ичиңен үч сыйра оку. Үндүн кыраатын болжолдо."},{"t":"p","h":"2. Анан чачыладагы мээр сөздөрдү удаалаш, андан соң алым сабак түрүндө көрктүү окугула."},{"t":"v","l":["Төртүнчү чачыла: 1, 2, 3, 4, 5.","Бешинчи чачыла: 1, 2, 3, 4,5.","Алтынчы чачыла: 1, 2, 3, 4,5."]},{"t":"h3","h":"Суйлеп машыгуу"},{"t":"p","h":"226-кенугуу. Төртүнчү чачыладагы мээр сөздөрдү өз сөзүңө кошуп сүйлө."},{"t":"p","h":"Үлгү: Жаратылыш көркүн Т. Касымбеков эң сонун сүрөттөйт, «Түпкүрдөн дүңгүрөп, толкун учу алтын кумдуу жээкке жай келип, шарп-шурп уруп, кайра тынат, кайра оодарылып, термелет. Чарым булут токтогон боз асманда кайкып, кыйкылдап бир үйүр ак чардак учуп жүрөт», – дегени эстен чыкпас."},{"t":"p","h":"227-кенугуу. Бешинчи чачыладагы мээр сөздөрдү 226-көнүгүүдөгү үлгүгө окшоштуруп иште."},{"t":"p","h":"228-көнүгүү. Алтынчы чачыладагы мээр сөздөр да 1-көнүгүүнүн үлгүсүнө окшоштуруп иштелет."},{"t":"h3","h":"Жазып машыгуу"},{"t":"p","h":"229-көнүгүү. Төртүнчү, бешинчи, алтынчы чачыладагы 1-номерде турган мээр сөздөрдү $: «^» деген кеште менен туюнтулган жазуу эрежеси боюнча жаз."},{"t":"p","h":"230-кенугуу. Төртүнчү, бешинчи, алтынчы чачыладагы 2-номерде турган мээр сөздөрдү «А ‚— к деген кеште менен туюнтулган жазуу эрежеси боюнча жаз."},{"t":"p","h":"231-кенугуу. Төртүнчү, бешинчи, алтынчы чачыладагы 3-номерде турган мээр сездерду О «^ деген кеште менен туюнтулган жазуу эрежеси боюнча жаз."},{"t":"h3","h":"232-кенугуу. Тертунчу, бешинчи, алтынчы чачыладагы 4-номер"},{"t":"p","h":"де турган мээр сездерду «А», – &lt; / А деген кеште менен туюнтулган жазуу эрежеси боюнча жаз."},{"t":"p","h":"<span class=\"pg\" data-n=\"187\">187<\/span>233-кенугуу. Төртүнчү, бешинчи, алтынчы чачыладагы 5-номерде турган мээр сөздөрдү төмөнкү кештелер менен туюнтулган жазуу эрежелери боюнча жаз. Бирөөнө эки, калганына бир сүйлөмдөн."},{"t":"p","h":"И /Х А"}],"sub":[{"title":"Алтынчы чачыла","b":12},{"title":"Көрктүү окуу","b":18},{"title":"232-кенугуу. Тертунчу, бешинчи, алтынчы чачыладагы 4-номер","b":31}],"section":"УП КЛАСС","pages":[185,187]},{"title":"§ 29. «САНЖЫРГАЛУУ КАЗЫНА» ТОПТОМУ","blocks":[{"t":"h3","h":"§ 29. «САНЖЫРГАЛУУ КАЗЫНА» ТОПТОМУ"},{"t":"p","h":"(1-5-шыралга УП класста өтүлгөн.)"},{"t":"h3","h":"Алтынчы шыралга"},{"t":"p","h":"1. Омуртка сөөгү оркойгон, кабырга сөөгү каркайган, каны калган бир кашык, эти калган көк жашык."},{"t":"p","h":"2. Чайнарына таш таппай, чабарына баш таппай."},{"t":"p","h":"3. Күлазык жайы мамындай: кургаган тандай сууланат, жай алып жаны кубанат, умачтай көзү ачылат, ооруган жерлер басылат."},{"t":"p","h":"4. Каптап кетер көп келет, кулак-мурун жеп келет."},{"t":"p","h":"5. Мууну кеткен былкылдап, көзү кеткен жылтылдап."},{"t":"h3","h":"Жетинчи шыралга"},{"t":"p","h":"1. Баскан жери быркырап, учуучудай дыркырап."},{"t":"p","h":"2. Айбалта менен салышып, сабы колдо калышып."},{"t":"p","h":"3. Капандын баарын кетирем, досум, самаган жерге жеткирем, досум."},{"t":"p","h":"4. Чың-чың үнү чың чыгат, чымырканып бек чыгат, кулак-мурун жеп чыгат."},{"t":"p","h":"5. Ичи – душман, сырты – эл, ааламдан чыкпайт мындай эр."},{"t":"h3","h":"Сегизинчи шыралга"},{"t":"p","h":"1.Сары изине чөп салып, саргара кууп алыптыр, куу изине чөп салып, кубара кууп алыптыр."},{"t":"p","h":"2. Бар-бар этип бар ыйлап, кулак-мурун жеп ыйлап."},{"t":"p","h":"3. Токсон тоонун урунуш, токсон дайра куюлуш."},{"t":"p","h":"4. Көзүнүн жашын арта албай, мурдунун суусун тарталбай."},{"t":"p","h":"5. Карчыгадай камынып, кайыптан акыл табылып."},{"t":"h3","h":"<span class=\"pg\" data-n=\"188\">188<\/span>Тогузунчу шыралга"},{"t":"v","l":["1. Нар өлтүрсө пул бербей, эр өлтүрсө кун бербей.","2. Кутургандай көзү бар, кубулжуган сөзү бар.","3. Абырдан шабыр ат токуп, ат токуса бат токуп."]},{"t":"p","h":"4. Сынчы болсоң сынынды айт, сөз жашырбай чынынды айт, сүйүнчүңө төө берем, сүйрү эмчектүү бээ берем."},{"t":"p","h":"5. Мени сынга бек тууган, эки көзүм жок тууган."},{"t":"h3","h":"Онунчу шыралга"},{"t":"p","h":"1. Айтсам сенден өлөрмүн, айтпасам сындан өлөрмүн."},{"t":"p","h":"2. Кабыргам жаман сөгүлдү, бычакка саптык уулуң жок, кайгырып жашым төгүлдү."},{"t":"p","h":"3. Тилинде балың бар экен, көзүңдө каарың бар экен, сөзүңдө заарың бар экен, бал тилинди салганда, таш да болсо эриткен таңдайда сөөлүң бар экен."},{"t":"p","h":"4. Жаагынан түк чыккан, жалындап көздөн от чыккан."},{"t":"p","h":"5. Алтымыш жаман бергиче, ашыктай жалгыз берсечи, токсон жаман бергиче, томуктай жалгыз берсечи."},{"t":"p","h":"Бул шыралгалар «Әр Төштүк» дастанынан алынды."},{"t":"h3","h":"Жаттоо"},{"t":"p","h":"1. 6-10-шыралгадагы санжыргалуу сөздөрдү катары боюнча үч сыйра хор менен көрктүү окугула."},{"t":"v","l":["2. Ар бир шыралганы өзүнчө жатта.","Алтынчы шыралга: 1, 2, 8, 4, ©.","Жетинчи шыралга: 1, 2, $3, 4, 5.","Сегизинчи шыралга: 1, 2, 8, 4, ©.","Тогузунчу шыралга: 1, 2, 8, 4, 5.","Онунчу шыралга: 1, 2, 3, 4,5."]},{"t":"h3","h":"Суйлеп машыгуу"},{"t":"p","h":"234-кенугуу. Алтынчы шыралгадагы санжыргалуу сездерду ез сезуне коптуп суйле. Санжыргалуу сездер сезундун баптына, ортосуна же аягына келе бериши мумкун. Каягына келтирсен да, ал ез эркин."},{"t":"p","h":"235-кенугуу. Жетинчи шыралганы алтынчы шыралгага окшотуп иште."},{"t":"p","h":"236-кенугуу. Сегизинчи, тогузунчу, онунчу птыралгадагы санжыргалуу сездерду да 234-кенугууге окшоштуруп иште."},{"t":"p","h":"237-кенугуу. Бир окуучу 6-10-шыралгадагы сөздөрдөн өзү каалаганын айтат, экинчи окуучу дароо ошол сезду ез кебине катыштырат. Мындай суйлешууде окуучулар утуру алмаштырылат."},{"t":"p","h":"<span class=\"pg\" data-n=\"189\">189<\/span>238-кенугуу. Парта катары боюнча кезеги келгенде ар бир окуучу санжыргалуу сөздөн бирди өз кебине аралаштырып сүйлөйт. Бул удаама-удаа жүргүзүлөт."},{"t":"p","h":"Жазып машыгуу"},{"t":"p","h":"239-кенугуу. 6-10-шыралгадагы 1-номер менен белгиленген санжыргалуу сөздөрдү у:» – $ кештеси боюнча жазгыла."},{"t":"p","h":"240-кенугуу. 6-10-шыралгадагы 2-номер менен белгиленген санжыргалуу сездерду Хх ‚— – УД, кештеси боюнча жазгыла."},{"t":"p","h":"241-көнүгүү. 6—-10-шыралгадагы 8-номер менен белгиленген санжыргалуу сөздөрдү “/х) = $ /А кештеси боюнча жазгыла."},{"t":"p","h":"242-көнүгүү. 6-10-шыралгадагы 4-номер менен белгиленген санжыргалуу сөздөрдү: КАА › же \\кештеси боюнча жазгыла."}],"sub":[{"title":"Алтынчы шыралга","b":2},{"title":"Жетинчи шыралга","b":8},{"title":"Сегизинчи шыралга","b":14},{"title":"Тогузунчу шыралга","b":20},{"title":"Онунчу шыралга","b":24}],"section":"УП КЛАСС","pages":[188,189]},{"title":"§ 30. «ТИЛ КУТУЧАСЫ» ТОПТОМУ","blocks":[{"t":"h3","h":"§ 30. «ТИЛ КУТУЧАСЫ» ТОПТОМУ"},{"t":"p","h":"(1—7-кутуча УП класста өтүлгөн.)"},{"t":"p","h":"Сегизинчи кутуча ашкеби (ичип-жегенди гана билген, колунан иш келбеген,"},{"t":"p","h":"иш кылбаган киши)"},{"t":"v","l":["багалчак (чымыр, жапалдаш бойлуу, кең далылуу)","багжанда (көнүлү көтөрүңкү болуу, көңүлдүү сүйлөө)","бажыракай (жайнаган көздүү)"]},{"t":"p","h":"бакалоор (алкым, кекиртектин үстүнкү жана ээктин астын-"},{"t":"p","h":"кы бөлүгү, суу жаныбарларынын дем алуу органы) баканооз (тыңчы, сөз ташуучу)"},{"t":"v","l":["башат (таштуу, кургак жердеги булак)","кайпакта (батынып киришпее, тайсалдоо)","Тогузунчу кутуча","бейкам (камсыз, жайбаракат)","бермет (кымбат баалуу асыл таш, мончок, шуру)"]},{"t":"p","h":"билги – (жөн билги, бир нерсени жакшы түшүнгөн, тез биле"},{"t":"p","h":"койгон, түшүнүгү бар)"},{"t":"v","l":["бойтоңдо (бойтоюу, татынакай көрүнүү)","болукшу (балкуу, магдыроо, көөлгүү)","боолголо (болжолдоо, бүдөмүк таануу, бүшүркөө)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"190\">190<\/span>бейпендее (бүжүрөп бирөөгө жагынуу, кошомат кылуу) кайрымдуу (боорукер, күйүмдүү, ырайымдуу, мээримдүү)"},{"t":"h3","h":"Онунчу кутуча"},{"t":"p","h":"бөйтөйгөн (томолок, бөйтөгөй тартып татынакай көрүнгөн) бөктөрүнчөк (ээрдин аркасына канжыга менен бөктөрүп"},{"t":"p","h":"алма буюм) бруцеллёз (кой, эчки, чочко, уйда болуучу, ошондой эле"},{"t":"p","h":"адамдарга да жугуучу оору)"},{"t":"v","l":["буйдал (кармануу, бир нерсеге алагды болуп калуу)","бушайман (убара болгондук, капалангандык, санаа","тарткандык)","бучкакта (жылдырбоо, бура бастырбоо)","кайсар (чалагайым, бир ишти бүтпөй жатып","экинчисине киришкен)"]},{"t":"h3","h":"Он биринчи кутуча"},{"t":"p","h":"буяма (оңтой, мүмкүнчүлүк) бырыксы (чандоо, бир болуу, топурап кетүү) гимн (мамлекеттик бирдиктин символу катары алынган"},{"t":"p","h":"салтанаттуу ыр)"},{"t":"v","l":["гүлзар (гүл айдалган аянт)","гүлстан (гүлдөп өскөн жыргалдуу өлкө, жер)","дарбы (ээлигүү, желигүү, ээлигип кошо дүрбөө)"]},{"t":"p","h":"калпыс (жаздым, таамай эмес, орунсуз, оңтойсуз, туруктуу"},{"t":"p","h":"эмес, ыксыз)"},{"t":"v","l":["Он экинчи кутуча","дөгүрсү (чоңсунуу, зөөкүрсүнүү)","дүйүм (ар кандай, ар түрлүү)"]},{"t":"p","h":"дүмүрөндө (баш көтөрбөй аракет кылуу, алагды болбой"},{"t":"p","h":"иштөө)"},{"t":"v","l":["дымак (көөдөн, чама)","дээр (акыл-эс, зээн)","жагдай (кийимди топчулабай, төшүн ачып коюу)"]},{"t":"p","h":"жазатайып (кокустан, күтпөгөн жерден, жаңылыштан) калтаары (батына албоо, апкааруу, коркуу, коркконунан"},{"t":"p","h":"эмне кыларын билбей калуу)"},{"t":"p","h":"Он үчүнчү кутуча жазганчаак (коркок, жалтак, жүрөгү жок, жалтанчаактык) жаздоо (жазгы жайыт) жайбаракат (акырын, шашпай, камырабай, капарсыз, бейкам) жалакай (чыдамсыз, туруксуз, жалкоо, тийип-качмай) <span class=\"pg\" data-n=\"191\">191<\/span>жалбарынкы (жалооруган, жалбарган) жалоондой (жалмандаган, шамдагай, албан-субандай) жалоору (жалдырап, телмирип кароо, боор ооругандай"},{"t":"p","h":"абалда болуу)"},{"t":"v","l":["камбыл (сарамжалдуу, жыйнактуу, эпчил)","","Он төртүнчү кутуча"]},{"t":"p","h":"жалпанда – жалпаланда (жалпан-жалпан этүү, кошомат"},{"t":"p","h":"кылып эпилдөө)"},{"t":"v","l":["жалтайла (жазгануу, чочулоо, коркуу, ийменүү)","жамажай (ооздун кычыктары)"]},{"t":"p","h":"жандими (көрүп-билип турса да, көргөн жокмун, билген жокмун деп жанын сабап тануучу)"},{"t":"v","l":["жансерек (араң жан, чала жан)","бир жаңсыл (аягына чыгарылган, бүтүрүлгөн","тындырылган, чечилген)"]},{"t":"p","h":"жапатырмак (жапырт, бардыгы бирге, бири да калбай) каңкуула (четин чыгарып, жандатып айтуу)"},{"t":"p","h":"Сүйлөп машыгуу 1-машыгуу. 8—9-кутучадагы сөздөрдүн ар бирин кунт куюп оку жана маанисин эсиңе тут. Анан алардын ар бирин катыштырып сүйлөм түз, бирок үнүндү чыгарба, ичиңен."},{"t":"p","h":"Үлг ү: Карыя кенже уулун опсуз эркелетип, анысы ичипжегенден башканы билбеген ашкеби болуп калганын байкабаптыр."},{"t":"p","h":"2-машыгуу. 10—11-кутуча. Буларды 1-машыгууга окшоштуруп иште."},{"t":"p","h":"3-машыгуу. 12-—14-кутуча боюнча да 1-машыгуудай иштелет."},{"t":"p","h":"Оозеки таймат"},{"t":"h3","h":"Биринчи таймаш"},{"t":"p","h":"Окуучулар эки топко бөлүнөт да, 8-14-кутучадагы сөздөр боюнча атаандашып оозеки сүйлөм түзүшөт. Маселен, 1-топтун өкүлү өзү каалаган кутучадагы бир сөздү (М.: бойтондо) айтса, 2-топтун өкүлү ошол сөздү дароо катыштырып сүйлөм түзөт (М.: Бойтондогон бала апасынын жанына келди). Сүйлөм түзүү алмак-салмак болот. Бирок сүйлөм түзгөн жуптар улам алмаштырылат."},{"t":"h3","h":"<span class=\"pg\" data-n=\"192\">192<\/span>Экинчи таймаш"},{"t":"p","h":"Мында эки топтун тандалган, камчы чаптырбаган зээндүү окуучулары беттешет. Алар адегенде өз таламдаштарынан кадимки турмуштагыдай эле бата алышат. Анан таймаш. Биринчиси кутучадан беш сөздү бирден айтат. Әкинчиси ар бир сөзгө тездик менен сүйлөм түзөт. Анан өкүлдөрү милдетин алмаштырышат, башкача айтканда суракчы сүйлөм түзүүчүгө, сүйлөм түзгүч суракчыга айланат. Жеке таймаштардын негизинде жалпы жыйынтык – уткандар жана утулгандар аныкталат."},{"t":"h3","h":"Үчүнчү таймаш"},{"t":"p","h":"Доскага бир топтун өкүлү чыгат. Әкинчи топтун мүчөлөрү канча болсо, алардын ар бири бирден сөз сунуш кылат. Бир эле окуучу ошонун баарына илгиртпей сүйлөм түзөт. Анан экинчи топтун өкүлүнө биринчи топтун мүчөлөрүнүн баары бирден сунуштайт. Бул топтун өкүлү да жогоркудай кылат. Акырында мугалим (же калыс) таймаштын жыйынтыгын чыгарат."},{"t":"h3","h":"Жазып машыгуу Иштин 1-түрү"},{"t":"p","h":"Доска бор менен экиге бөлүнөт да, таймашкан эки топтон бирден окуучу чыгып, бирден сүйлөм түзөт. Сүйлөмдү көп жана туура түзгөн өнөктөштөр утуп чыгат. Мында да кутучадагы бир сөзгө бир нече эмес, бир эле сүйлөм түзүлөт."},{"t":"h3","h":"Иштин 2-туру"},{"t":"p","h":"Эки топтон бирден окуучу чыгат да, кутучадагы сөздөрдү катыштырып, каалашынча доскада орун калбай калганга чейин жазышат. Экөөнүн кимиси көп жана туура сүйлөм жазса, ошонусу утат."},{"t":"h3","h":"Иштин 8-түрү"},{"t":"p","h":"Мында таймашуучу топ түзүлбөйт. Ар бир окуучу өз алдынча кутудагы сөздөрдү катыштырып сүйлөм түзөт. Туура жана баарынан көп сүйлөм жазган окуучу биринчи орунду жеңип алат. Андан ары экинчи, үчүнчү, төртүнчү, бешинчи орундар белгиленет. Ошондой эле артта калгандарга да орун бар. Алар артынан санаганда, биринчи, экинчи, үчүнчү орунду ээлегендиги кулактандырылат."},{"t":"h3","h":"<span class=\"pg\" data-n=\"193\">193<\/span>Иштин 4-түрү"},{"t":"p","h":"Бул да жалпы же топтордун ортосундагы таймаш түрүндө өткөрүлөт. Бирок 8-14-кутучадагы сөздөрдөн 8—4тү кааласа 5—бга чейин бир сүйлөмдүн тутумуна маанилик жактан байланыштырып жаза алуу чеберчилиги жеңип чыгуунун шарты катары алынат."}],"sub":[{"title":"Онунчу кутуча","b":12},{"title":"Он биринчи кутуча","b":17},{"title":"Биринчи таймаш","b":43},{"title":"Экинчи таймаш","b":45},{"title":"Үчүнчү таймаш","b":47},{"title":"Жазып машыгуу Иштин 1-түрү","b":49},{"title":"Иштин 2-туру","b":51},{"title":"Иштин 8-түрү","b":53},{"title":"Иштин 4-түрү","b":55}],"section":"УП КЛАСС","pages":[190,193]},{"title":"§ 31. «ИЛХАМ КЕП» ТОПТОМУ","blocks":[{"t":"h3","h":"§ 31. «ИЛХАМ КЕП» ТОПТОМУ"},{"t":"p","h":"(1-3-турмектер УП класста өтүлгөн.)"},{"t":"h3","h":"Төртүнчү түрмөк"},{"t":"p","h":"1. Чыгарда тик кароодон ийменердей, мелт этип асман жакты бир тиктеди. Жибекке уздар сайган ийнелердей, тепчилип калды күмүш кирпиктери (С. Эралиев)."},{"t":"p","h":"2. Миң көз менен, миң сөз менен, миң иш менен бул турмушту елчегун (Р. Рыскулов)."},{"t":"p","h":"3. Жылдыз менен нур алышкан ошол кезиң бир өмүргө билик болуп эсте калар (Ж. Мамытов)."},{"t":"p","h":"4. Чалкыган Ай чалкасынан жатып азга кыраңга, көөдөй түндү боёп кирди улам агыш ыранга (Ж. Мамытов)."},{"t":"p","h":"5. Мин жылдардын тарыхына жуурулуп, өнүп чыккан элдин руху-улуу рух (Ж. Мамытов)."},{"t":"h3","h":"Бешинчи түрмөк"},{"t":"p","h":"1. Жарыкты кууп тебелеп, жылдызды көккө себелеп, түн келди жумшак, жыпжылуу, көз кылып Айды төгөрөк (Т. Кожомбердиев)."},{"t":"p","h":"2. Ободон жылат Ай кайып, ороктой учу кайкайып (Ж. Мамытов)."},{"t":"p","h":"3. Ай – ааламга үзөнгү, аны тээп адамзат, жылдызга салат жүгөндү (Ж. Мамытов)."},{"t":"p","h":"4. О, ыйык жер, түндүгүнөн түндү сүрүп күн өткөн, о, ыйык жер, күздө алтын, кышта күмүш күрөткөн (Т. Муканов)."},{"t":"p","h":"5. Жашоо бул көзгө илешпей, турат ал сан түйүндөн, турат ал сан суроодон (О. Көчкөнов)."},{"t":"h3","h":"Алтынчы түрмөк"},{"t":"p","h":"1. Бир нерсе издеп курулай, тоо ашып кетти сулуу Ай, артында калды жылдыздар чачылып түшкөн шурудай `(Т. Муканов)."},{"t":"p","h":"<span class=\"pg\" data-n=\"194\">194<\/span>2. Асмандын жүзүн таң чайып, ажарын төктү кашкайып. Ойгонгон тоолор уйкудан карекке чөктү шаңкайып (Т. Муканов)."},{"t":"p","h":"3. Басканда каптал, кыяны, тийбей өт көрсөң уяны"},{"t":"p","h":"4. Ата-журт – алтын уя, жеңилин жерден алчу, оорун колдон алчу (О. Көчкөнов)."},{"t":"p","h":"5. Жолду курдай белибизге курчанып, биз каткырып дөңдөн ылдый чуркадык; күлкүбүзгө булбул үндүү булак да тыноо какпай тыңшап турду тынч алып (А. Өмүрканов)."},{"t":"p","h":"Жаттоо А. Төртүнчү, бешинчи, алтынчы түрмөктөгү ыр саптарын катары менен адегенде бир сыйра, анан эки сыйра хор менен көрктүү окуу (китептен карап)."},{"t":"v","l":["Б. Үч түрмөктөгү ар бир ыр сабын өзүнчө жатта:","1) Төртүнчү түрмөк: 1, 2, $, 4, 5.","2) Бешинчи турмек:1, 2, 8, 4, 5.","3) Алтынчы түрмөк: 1, 2, 8, 4, 5."]},{"t":"p","h":"В. Уч турмектегу ыр саптарын хор менен жатка айтуу."},{"t":"h3","h":"Суйлеп машыгуу"},{"t":"p","h":"243-кенугуу. Төртүнчү түрмөктөгү ыр саптарын өз сөзүңө кошуп сүйлө."},{"t":"h3","h":"ү: Капырай, акын эмес адам «Күн чыкты» деп эле"},{"t":"p","h":"коймок, а Сүйүнбай Әралиев: «Чыгарда тик кароодон ийменердей, мелт этип асман жакты бир тиктеди. Жибекке уздар сайган ийнелердей, тепчилип калды күмүш кирпиктери», – дейт."},{"t":"p","h":"244-кенугуу. Бешинчи түрмөктөгү ыр саптарын 243-кенугуудегу үлгүгө окшоштуруп иште."},{"t":"p","h":"245-көнүгүү. Алтынчы түрмөктөгү ыр саптарын да 248-көнүгүүнүн үлгүсү менен иште."},{"t":"p","h":"246-көнүгүү. Алым сабак сүйлөшүү. Биринчи окуучу өзү билген бир ыр сабын айтат, экинчи окуучу дароо аны өз сөзүнө кошуп сүйлөйт."},{"t":"h3","h":"Биринчи түр: Алым сабак сүйлөшүү эки окуучунун гана"},{"t":"p","h":"ортосунда болот."},{"t":"p","h":"Экинчи түр: Алым сабак сүйлөшүүгө катышкан окуучулар улам алмаштырылып турат."},{"t":"p","h":"<span class=\"pg\" data-n=\"195\">195<\/span>Жазып машыгуу 247-кенугуу. Төртүнчү түрмөктөгү ыр саптарын төл жана бөтөн сөздүн 1, 2, 3, 4-эрежеси боюнча ар бирине ар башка мисал келтирип жаз."},{"t":"p","h":"Үлгү: Җолон Мамытов: «Миң жылдардын тарыхына жуурулуп, өнүп чыккан элдин руху – улуу рух», – деген. 248-көнүгүү. Бешинчи түрмөктү да төртүнчү түрмөктөй кылып жаз. 249-көнүгүү. Алтынчы түрмөктү да төртүнчү түрмөктөй иште."},{"t":"h3","h":"§ 32. ДИЛБАЯН Байытып баянда"},{"t":"p","h":"Жөжөлөрүн коруган тоок."},{"t":"p","h":"Катасын ондоп жаз 1. Әгин сапырган күрөгү менен эпилдеп эгин сапырды."},{"t":"p","h":"2. Сууга суусап келип, чакадагы сууга тумшугумду малдым."},{"t":"p","h":"3. Зампарлап жааган карды боло турган болчу болсо, күрөк менен күрөп, жыйып салабыз."},{"t":"p","h":"Сөздөрдү өз ордуна кой 1. Башталган өмүр – деңизден – бүтмөк – деңизден – акыры – бир күнү."},{"t":"p","h":"2. Аттардын – оозун – беришти – бир – коё – жерден."},{"t":"p","h":"3. Таноолорунан буу бурулдаган – шоолаланган ала күүгүмдө – жээк көрүнө баштады – бугунун шалпык эрдине окшогон."},{"t":"p","h":"Байланыштырып жана байытып"},{"t":"h3","h":"чакан аңгеме жаз"},{"t":"p","h":"Коңгуроо добуш булак ... Жылаажын үн башат ... Мөлт эткен шүүдүрүм ... шорголоп... Саратан ... Кырда чоктой жоогазын ... Шуру, мончокчон тулаң... сайдагы шаркыраган суу ... Жапалак арча ... улар..."},{"t":"v","l":["(Муну ыр менен да жазып көрсөң болот).","","Сүйлөм түз"]},{"t":"p","h":"1. Ар бири «с» тамгасы менен башталган төрт сөздүү ‚сүйлөм жаз."},{"t":"p","h":"<span class=\"pg\" data-n=\"196\">196<\/span>2. Ар бири «м» менен башталган үч сөздүү сүйлөм жаз."},{"t":"p","h":"3. Ар бири «ш» менен башталган үч сөздүү сүйлөм туз. Үлг ү: 1. Кырда кызыл кызгалдак кылтыят."},{"t":"p","h":"2. Кыйырсыз кылымды кеземин кайдагы кайратсыз карыптай, каңгыймын капарсыз күүгүмдө көлдөгү калаксыз кайыктай (У. Кабылбеков)."},{"t":"h3","h":"«НАМЫС» ДИЛБАЯНДАР ТҮРМӨГҮ"},{"t":"p","h":"Жемсалды окуя. Жолой жер майыштырган калың кол менен кыргыз айылын беттейт. Аны көргөн Жакыптын жүрөгү түшөт, коркконунан сакал-чачы бириндеп, үнү дирилдеп кетет. Манаска минтип айтат:"},{"t":"p","h":"– Әй, балам, айтканына көнөлү, сан кара малды, тандап тогуз сулуу кыз тартуу кылып, курган жанды сактап калалы."},{"t":"p","h":"Ошондо Манас бул кепке безге сайган немедей секирип кетет да, атасына мындай дейт:"},{"t":"p","h":"– Кокуй, ата, не дейсиң. Найзалашып топ бузам, ажалым жетсе окко учам, бирок намысты бербейм. Калкым кыргыз, сен үчүн курман болуп кетейин."},{"t":"p","h":"Ошентип, согуш башталат. Акырында Жолой жеңилет."},{"t":"h3","h":".1-дилбаян"},{"t":"p","h":"Ойлон. 1. Жакып Жолойго тартуу-таралга берип, багынып бергиси келет. Балким, мындай багынып берүү элди бүлүндүрбөй кыргындан сактап калуунун татыктуу жолу болуп жүрбөсүн. 2. Манас багынып берүү жөнүндөгү атасынын тилин албай коёт. Улуунун тилин албаган Манас ыймансызбы? 8. Манас эмне үчүн жеке керт башынын кызыкчылыгын ойлобойт, кайра кыргыз калкы үчүн кара башын аябай тургандыгын айтып, жанын оозуна тиштеп, жоого бет алат. Әмне, Манас алаңгазарбы, энөө жанбы? Әмнеге жоого чабат? Балким, Манастын өзү билген дагы бир турмуш чындыгы бардыр, аныктап көрсөң."},{"t":"p","h":"Сунуш. 1. Бул дилбаянды ой толгоо түрүндө жаз. Эгер зарылчылыгы болсо, «Карышкыр менен түлкү» дилбаянынын 6-турун (бул МИ класста) эсиңе сал."},{"t":"p","h":"Пайдалан. 1. Жолой ачуулуу аюудай, көзү бакалуу көлдөй, кашы өрттөнгөн токойдой, эрди чокойдой. Төбө чачы сүксүйөт, жеп ийчүдөй үксүйөт. 2. «Манас, Манас» дегенде барбая түшөт экенсиң, суу толтурган чаначтай дардая түшөт экенсиң» (Жолойдун сөзү). 3. Манас бир карасаң – бир киши, бир карасаң – миң киши. 4. Үзөңгүдөн бут тайып, ээрден көчүк кылтайып. 5. Көрүнгөндөн көрүнүп, көк түтүн болуп бөлүнүп. 6. Боконо сөөгү болкулдап, боор ичеги солкулдап. Эки өңүрү <span class=\"pg\" data-n=\"197\">197<\/span>далбактап, эки көзү алактап. Эрбеңдеген эки кол өйдө болбой шал болду, челектей болгон кайран баш жарылып кара кан болду (Жолойдун ал-абалы). 2-дилбаян Сунуш. Жолой менен болгон согушту Жакыптын сөзү менен сүйлөп, көзү менен көрүп, ою менен ойлойсуң."},{"t":"h3","h":"3-дилбаян"},{"t":"p","h":"Сунуш. Манас менен болгон сунушту Жолойдун кезу менен керуп, сезу менен суйлеп, акылы менен баалайсын."},{"t":"h3","h":"4-дилбаян"},{"t":"p","h":"Ойлон. Мындан мурда Жолойдун Манастан женилиши боюнча уч дил баян жаздын. Сен Манастын эрдигине сыймыктанасын. Аны чамандын жетишинче мактайсың. Айкөлдү өзүңдүн ыйык тирегиң катары эсептейсиң. Мунун баары – туура жана талашсыз нерсе. Бирок сенин өзүндө бүдүрдөй болсо да намыс барбы? Ошону сезген учуруң болдубу? Же намыска караганда өзүңө пайдалуу ишке ооп турарсын. Анткени жан сактоо керек да. Кара курсактын камы не дедирбейт да, не жедирбейт. «Элин бөрү болсо, бөрү бол, түлкү болсо, түлкү бол» деген макал бөрүдөй ач көздүккө, түлкүдөй алдамчылыкка жол ачып турганы жалганбы? Же башкачадыр?"},{"t":"p","h":"Сунуш. Ушул дилбаянды жазууда, төмөнкү эки түрдүн бирин тандап ал. Бири – диалог менен жазылган дилбаян. Айталы, жогорку маселенин тегерегинде эки окуучу талашып-тартышат. Эгер, муну каалабасаң, экинчисин жаз. Ал пьеса-дилбаян. Анда да эки-үч адам намыс, пайда, жан сактоо жөнүндө акыл калчашат."},{"t":"h3","h":"«КҮЛЧОРОНУН КӨРГӨН КОРДУГУ» ДИЛБАЯНДАР ТҮРМӨГҮ"},{"t":"p","h":"Жем салды окуя. Күлчоро – эпостун «Семетей», «Сейтек» бөлүмүнүн экөөндө тең катышкан сүйгүнчүктүү каарман. Семетей жеңилип, кайып болуп кеткен сон, Күлчоро туткундалат. Адегенде далынын үстүнөн көнөктөй эт кесип алышат. Кыяз анан дал ортосун сойдуруп, чемирчекти ойдурат. Ошондон кийин кырк жылкычы, сексен кулга отунчу, суучу кылып беришет. Кончуна кызыл чок салып жиберип кордошот."},{"t":"p","h":"Әрте тургузуп, чылгый терини ийлетишет. Чорону талпактай сабашат. Карыган жылкы томугун жуткуруп, кыраан каткы күлүшөт. Анан уктатпай бийлетишет. Тогуз күнү кара сууну кыйнап ичиришет. Кементайы дал-дал айрылган. Далысынан кара кан агып турат. Ал аз келгенсип, чорону көкбөрү да кылып тартышат."},{"t":"h3","h":"<span class=\"pg\" data-n=\"198\">198<\/span>1-дилбаян"},{"t":"p","h":"Ой толгоо. 1. Мынчалык кордукка кабылгыдай Күлчоро кыргыз элине эмне жамандык кылды эле? 2. Таңкаларлык эмеспи, кыргыз баатырын кыргыздардын өздөрү кыйнап жатышкандыгы. Анда кыргыз кыргызга душманбы? Же кандай? 3. Өз түгүл душманды да мындайча кыйноого болбойт эмеспи. Же ушундай кыйноодон ыракат алууга болобу? Мисалы, кээде жөндөн-жөн эле жыланды көрсөң, таш менен уруп өлтүрөсүң. Ташың болжогон жерге таамай тийгенде, сүйүнөсүң. Мунуң Күлчорону кыйнап ыракатка батуудан айырмасы кайсы? Анда сенде да мындай кыйноодон ыракат алуу сезими бар турбайбы? Же башкачабы?"},{"t":"v","l":["Сунуш. 1. Дилбаянды ой толгоо түрүндө жаз.","2. бермети», «Макал» топтомдорун пайдалан."]},{"t":"h3","h":"2-дилбаян"},{"t":"p","h":"Сунуш. Окуяны Күлчоронун өз сөзү менен баянда."},{"t":"p","h":"Пайдалан. 1. Баатыр да элек, шер да элек, билекте кубат барында, балекет кайда дээр элек, биз да тайлак басып жээр элек. 2. Кара болот Зулпукор көөлөгөн эрдин өзү элек, тоодой-тоодой алптарды жөөлөгөн эрдин өзү элек. 3. Кыргызга кызыл туу элек, душманга ызы-чуу элек."},{"t":"p","h":"4. Акболот элем мокодум. 5. Чама чарчап кан кетти, мен байкуштан ал кетти."},{"t":"p","h":"6. Ала аска элем, жол болдум, артыкча жаман кор болдум. 7. Өлбөй-житпей, чок болуп, күйүп өлмөк экенмин."},{"t":"p","h":"«Манас» эпосу"},{"t":"h3","h":"3-дилбаян"},{"t":"p","h":"Сунуш. 1. Дилбаянды пьеса турунде жаз. 2. Арадан миндеген жылдар етсе да, кыялын менен Кулчорону кордогондорду соттойсун. Катышуучулар: 1) сот, 2) каралоочу, 3) актоочу, 4) Кулчоро, 5) Кыяз."},{"t":"h3","h":"«БУЗУКУ» ДИЛБАЯНДАР ТҮРМӨГҮ"},{"t":"p","h":"1-дилбаян Ой өбөлгөсү. Санат ырлардын устаты Молдо Нияз: «Эшигинен туташып, төрү күйсүн бузуктун. Түтүн чыгып өлгөндө, көрү күйсүн бузуктун», – дейт."},{"t":"p","h":"Ойлон. Молдо Нияздын санатында бузукка катуу каргыш айтылат. Мынчалык оор каргыш ууруга да, ач көзгө да, ичи тарга да, оболу, чыккынчыга да айтылбайт. Кыязы, бузукулук ошолордун баарынан жогору турган терс сапат болбосун. Балким, бузукулук да өтө таланттуулуктун белгисидир. <span class=\"pg\" data-n=\"199\">199<\/span>Мисалы, В.Шекспирдин «Отелло» трагедиясындагы Яго шайдоот жигит. Тили да ширин. Башкаларды өзүнө ишендире алат. Далили да таамай. Баарын алдын ала ойлойт, тактайт. Керек болсо, ак жүрөк, адилет. Бирок бекем, ууздай таза бир үй-бүлөнү бузуп талкалайт. Ягонун айткандарына ишенген Отелло өзүнүн сүйүктүү жары Дездемонаны муунтуп өлтүрөт. Ал эми А.Токомбаевдин «Өлбөстүн үрөнү» драмасында Барак эл менен элди, уруу менен урууну, баатыр менен баатырды араздаштырып, жигин билгизбей бузуп, чабыштырат, бирин бирине өлтүртөт ж.б."},{"t":"p","h":"Сунуш: Молдо Нияздын санатынын негизинде ой толгоо түрүндө дилбаян жаз."},{"t":"h3","h":"2-дилбаян"},{"t":"p","h":"Ой өбөлгөсү. Илгери бир Жоламан деген жоомарт жол боюна казан астырып, өткөн-кеткенге табак тартып, тамактандырып турчу экен. Күндөрдүн биринде ошол жол менен шукшундаган бирөө өтөт, алдынан ызаат менен этин булоолонтуп көтөрүп чыккан табакка карабайт. Ашыккан түрү бар. Жөнөй берет. Ошондо анын соо адам эместигин сезген Жоламан артынан кууп жетет да: «Неге шаштын, айт чынынды, болбосо, башыңды алам»,— дейт. Көрсө, ал бир айылды экинчи айылга жамандап, чагым чыгарып чабыштырууну көксөп бараткан экен. Ошого шашыптыр. Жоламан буга ого бетер ачуусу келет, кылыч менен башын шыпыра чабат. Анан каны шоргологон башты дарактын шагына илип коёт. Баарынан кызыгы – баш илинер замат, көгөрүп турган дарак дароо куурап калган экен (Улама)."},{"t":"p","h":"Ойлон. 1. Бузукунун башы илинер менен, дарак неге куурап калды? Мында кандай сыр бар? Ал эми азыр деле эл арасында чагымчыны «Сен жүргөн жерге чөп чыкпайт, каапыр» деп коюшат. Балким, ушул эки түшүнүктүн ортосунда бекем байланыш болуп жүрбөсүн? Эл ушундай уламаны ойлоп табуу менен, эмнени айткысы келген? Сага тиешеси барбы?"},{"t":"p","h":"2. Ырас, бузуку – адамды туура жолдон чыгаруучу азгыргыч, оң ишти тескери кылуучу куйту адам. Ал колунан келсе, ата менен баланы, аялы менен күйөөсүн, кыйышпас досторду, кошуналарды, агайын-туугандарды, эл менен элди бузат. Ошондой бузукулук кылгандан кийин гана андай кишинин көңүлү тынып, жаны жай алып, тынч уктайт дейт. Бирок ошол бузуку кайдан чыгат? Айкөлдүк, кайрымдуу жана боорукер сезимден ажырап, адамдын ниети карара баштаса, <span class=\"pg\" data-n=\"200\">200<\/span>бузукулук ошол жерден ойгонор. Же кандай? Балким, бирөөлөрдүн ийгилигине ичиң тарып, көргүң келбей, жүрөгүң зыр этип, өңүң бузулуп, танооң кыпчылып турса, бул ниеттин карарышы эмеспи?"},{"t":"p","h":"Сунуш. Бул дилбаянды диалог түрүндө жаз. Сүйлөшкөндөр жүйөлүү далилдер менен өз ара талашып-тартышса да болот."},{"t":"h3","h":"ЗАМАН ТАШ БООРБУ?"},{"t":"p","h":"Ойго таек. Айрым кишилер: «Бир тууган түгүл ата балага, бала атага карабаган заман болду» ,—дешет."},{"t":"p","h":"Ойлон. Өз уйунден тегерек-четиңе, айлана-чөйрөгө, айыл-апа, агайын-тууганга чейин байкап көрсөң. Чын эле баары таш боор болуп кеттиби? Ар бир жан керт башынын камы менен болуп, бири-бирине жардамдашпайбы? Мээр өчүп баратабы? Атасы баласын, баласы атасын карабай кеткен учурлар көппү? Анда ар бир жаңы төрөлгөн баланын тагдыры эмне болот? Улгайган адамдарды жапырт карыялар үйүнө тапшырып жатышабы? Же кандай?"},{"t":"p","h":"Сунуш. Өз оюңду жаз. Дилбаяндын түрүн тандап алуу өз эркиң. Тилге таек. Пейил кетип адамдан, береке качты замандан, нуска жорук жоголду жакшы менен жамандан (Молдо Кылыч). Бирөөгө кең, бирөөгө тар экенсиң, замана. Бирөөгө жок, бирөөгө бар экенсиң, замана (Жеңижок). Чаңдатып сан-миң жылдын эки арасын, турмуштун даңканга уруп майда ташын, өмүрдү салмоор кылып зырылдатып, тагдырдын сазга айлантып зоо-аскасын, адамдын эс-акылын камчыланып, замана, кайда зуулап баратасың?! (Алыкул). Замана шуру киет, бермет киет, кийгени көктөн туруп жерге тиет. Түк өчпөс күмүш издүү калемди алып, ак көңүл азаматтын атын чиет (Алыкул)."},{"t":"h3","h":"МӘӘР ТӨККӨН АДАМ"},{"t":"p","h":"Ойго таек. Кыргыз элинин мыкты кыздарынын бири мындайча кеп салат: «Мен балдар үйлөрүн көбүрөөк кыдыра баштадым. Ошондой сапарларымдын биринде Панфилов районундагы интернатка барганымда, чыпалактай кыз мага жабышып, колумду кармап алып: «Сени абдан сагындым. Мен сени зарыгып деп шыбырады. Ал мени өзүнүн апасы экен деп ойлоп жатканын түшүндүм. Ошондо менин кандай абалда калганымды Өзүңүз сезип турган чыгарсыз. Көзүмө айланган жашты араң токтоттум. Мындай балдардын турмушун өзгөртүү жөнүндө ошондо өзүмө сөз бергем». Ошентип, ушул ой анын оюн онго, санаасын санга бөлөт."},{"t":"p","h":"<span class=\"pg\" data-n=\"201\">201<\/span>Канткенде жетимдерди жана таштанды балдарды канаттууга кактырбай, тумшуктууга чокутпай багып чоңойтсо болот. Тапты. Мындан 50 жыл илгери австралиялык улуу гуманист Герман Гмайнер жетим жана таштанды балдар үчүн атайы балдар кыштагын түзүптүр. Анда жаш жеткинчектер эч нерседен өксү болбой, өз үй, өлөң төшөгүндөгүдөй чоңоюшкан, мыкты билим, таалим-тарбия алышкан. Азыркы күндө Герман Гмайнердин үлгүсү дүйнөнүн 128 өлкөсүндө колдонулуп жатыптыр. Әмне үчүн үлгүнү Кыргызстанда колдонууга болбойт. Майрам эми так ушундай ниет, аруу тилек менен күргүчтөгөн катуу аракетке өттү да, оюн ишке ашырды. Азыр Бишкек шаарынын четинде тиричиликке зарыл нерселердин баары бар, ары жөнөкөй, ары азем жасалгалуу, бөлмөлөрү жарык, заңгыраган эки кабаттуу 20 там бүткөрүлгөнү турат. Бул – кароосуз жана жетим балдарга арналган кыштакча. Сыркоо жетим балдардын саламаттыгын сактоочу Ысык-Көлдүн боюнда «Алтын балалык» деген үй комплексин куруу башталды. Андан башка балдар үчүн кылган камкордугунун чети оюлгус..."},{"t":"p","h":"Ойлон. Эмне, таш боордук өкүм сүрүп, ата балага карабай, баары битин сыгып, канын жалаган битирге, зыкымга айландыбы, же адамды сүйгөн, боорукер, камкор, кайрымдуу адамдардын тукуму соолдубу? Мисалга кайрылсан, Бириккен Улуттар Уюму, «505 – Киндердорф Интернационал», жапониялык «Чөп тамыры» сыяктуу эл аралык уюмдар колдоп, медициналык жабдууларды сатып алууга акчалай кошумчаларын берип жатышат. Өнөр жылдыздары: Алибек Днишев, Керим Турапов, Роза Амановалар «Алтын балалык» үчүн атайын кайрымдуулук концерттерин беришсе, швейцариялык бир адам 25 миң доллар кошумча кошкон. Санай берсе мындайлар көп. Анда оомал-төкмөл дүйнөдө мээримдүүлүккө да орун бар экен да. Мунун да учу узарып, канаты жайыла турган сапат экенине ишенүүгө болобу? Буга сенин жекече пикирин кандай?"},{"t":"p","h":"Сунуш. Бул дилбаянды өзүң каалаган түргө салып жаз."},{"t":"p","h":"Пайдалан. 1. Жетимге камчы көтөрбө, жетимдин отун өчүрбө, жесирге камчы көтөрбө, жесирдин отун өчүрбө (Арстанбек). 2. Гуманизм жана сүйүү – бул аң-сезимдин туу чокусу экенин түшүнүү айрым учурларда кишилерге оңой-олтоң эмес. Келечек үчүн бириккиле (Герман Гмайнер). 3. Бүгүн ким балдарга алпейимдүү болуп, жакшылык жасаса, ал телегейи тегиз келечек жаратат («Кыргыз Туусу»). 4. Илгери Атантай де- ‚ ген адам болгон экен. Ал бала күнүндө энесин эмбей чыркырап, кулакмээни жеп ыйлайт. Чарк көпөлөк айланган ата-эне баланы сооротуу үчүн <span class=\"pg\" data-n=\"202\">202<\/span>кылбаган аракети калбайт. Бирок бала басылбайт. Ошондо айылдан бир кароосуз калган жетим баланы таап келип, энесин эмизсе, ошондо Атантай сооронгон экен. Оболу жарпы жазылып күлүп, сүйүнгөн дейт. Ошондон Атантай жоомарт деп атыгып калыптыр (Улама)."},{"t":"h3","h":"Эс алуу үчүн"},{"t":"p","h":"Төмөндөгү сөздөрдү өз ордуна койсон, сенин келечек тилегиңе төп келген маани чыгат."},{"t":"p","h":"Адам болосуң – айкөл – барга топук, жокко сабыр кылган сен келечекте – алдамчылыгы жок – колу ачык – мандай тери менен жашаган."},{"t":"h3","h":"Дагы эс алуу үчүн"},{"t":"p","h":"Төмөнкү сүйлөмдүн дурусу кайсы, бурушу кайсы?"},{"t":"p","h":"Көп жазганга көнбөгөн, жеңилге желпинген жаным көлөмдүү көнүгүүгө көнө албай, көнүгө албай, көңүл чаппай, көөнүм үч көчкөн журттай болду эле, эми дил баянды жабыратып, сөз берметтерин жамыратып жазуудамын."},{"t":"p","h":"Әс алып, окуп кой Апендинин кеп баштыгынан. Алдаркөсөө эшиктен кирип:"},{"t":"p","h":"– Ассалоом алейкум, хан ордосу, – дейт. Жээренче чечен:"},{"t":"p","h":"– Алейкима ассалам, эл жоргосу – дейт. Жээренче чечен ишарат кылып, колу менен башын кагат. Алдаркөсөө колунун учу менен тилин кагат да, эшикке чыгып кетет."},{"t":"p","h":"– Мени эч ким жыга алчу эмес эле, ушул кирген Көсөө жыгып кетти, – дейт чечен. Анда Жаныбек кан:"},{"t":"p","h":"– Жээренче чечен, сени Көсөө кантип жыкты? – деди. Анда Чечен:"},{"t":"p","h":"– Көсөө эшиктен салам айтып, кирип отурганда, колум менен башымды кагып: «Балаа башка кайдан келет?» – деп сурадым. Көсөө колу менен тилин кагып: «Бала башка тилден келет», – деп жеңип кетти."},{"t":"h3","h":"КАЛМАТАЙ"},{"t":"p","h":"Ойго өбөлгө. А. Куттубаев менен К. Маликов экөө биргелешип жазган «Жаңыл» драмасында атайы көңүлгө ала турган мындай бир учур бар. Түлкү баш болгон баатырлар нойгутка барып кол салып, жылкы тийип келатканда, Жаңылдын жаасынан набыт болушат. Ошону уккан Калматай Жаңылдан өч алмакчы болот. Бирок кимге барат? Кыргыздын элин чаап, күлүн көккө сапырсам дегенге эки көзү төрт болуп отурган калмак каны Манжыга барып, ар-намысын <span class=\"pg\" d

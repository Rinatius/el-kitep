ин кайсы ырысыңа каймак жейсиң...» деп орто жеримди тилдейм. К. Жуманазаров"},{"t":"p","h":"Тогузунчу жат жазуу"},{"t":"h3","h":"«ТАЯНА ТУРГАН ЖАЙ ТААП БЕРСЕҢ, ЖЕР ШАРЫН АЛАСАЛДЫРЫП БЕРЕМ»"},{"t":"p","h":"Архимед – математика физика илимдеринин пионери механиканы илим катары негиздөөчүлөрдүн бири. Ал биздин заманга чейинки 287 жылы Сицилиядагы Сиракузы шарында төрөлгөн. Ал атасынын жардамы менен өз алдынча окуган. Кийин Александрия шарында математика жана механика боюнча көрүнүктүү окумуштуулар менен бирге иштешкен, Демокрит Евдокс Евклид сыяктуу грек математиктеринин эмгектери менен таанышкан."},{"t":"p","h":"Падыша Гисрон өзүнө алтын таажы жасаткан. Тажынын салмагы падыша устага берген алтындын салмагына барабар эле. Бирок тажы накта алтындан жасалдыбы, же уста ага арзан бадагы металл кошуп жибердиби деген шектенүү пайда болгон. Аны тактоо иши Архимедге тапшырылган. Бир күнү ал мончодо жунуп жатып суюктука матырылган нерсе ал буюм сүрүп чыгарган суюктуктун салмагына барабар болгон көтөрүү күчү менен жогору түртүлөрүн байкайт. Буга Архимед укмуштай кубангандыктан, мончодон «Эврика! Эврика!» («Таптым! Таптым!») деп кыйкырган боюнча кечеге чуркап чыгат. Бул ачылыш тажы жасалган металлдын составын аныктоого жардам берген. Ал эми алтынга башка металл кошуп жиберип, алтындан өзүнө артырып калган устанын айыбы ачылган."},{"t":"p","h":"Архимедин өмүр жолунда таң калтырарлык кызыктар көп. Ал бир жолу Гисронго төмөнкүдөй кат жазган: таяна турган жай таап берсең, жер шарын аласалдырып берем. Гисрон бул ырастоого аябай таң калган жана бул сөздүн туралыгын көргүсү келген. Анда Архимед үч мачталуу кемеге тажрыйба жасаган. Ал кемеге адамдарды жана жүктү толтуруп, кыймылдуу жана кыймылсыз бир канча блоктордон <span class=\"pg\" data-n=\"289\">289<\/span>турган жүк көтөргүч түзүлүштү колдонуп колу менен эле кемени аласалдырып жиберген. Гисрон ага ушул билимди пайдаланып мамлекети коргоо үчүн машина жана приборлорду жасого тапшырма берген. Ал тапшырма тез эле аткарылган. Биздин заманга чейинки 2138-жылы римдиктер Сиракузы шарын басып алуу үчүн согуш жарыялаган. Архимедин коргонуу үчүн жасалган куралдары шарды эки жылга чейин коргого мүмкүндүк берген."},{"t":"p","h":"Архимед биздин заманга чейинки 212-жылы туулуп-өскөн шарын Римдик баскынчылардан коргоп жатып курман болгон. Архимедин өлүмү жөнүндө тарыхчы Тцетцисс минтип жазган: Рим аскерлери кирип келип, ящикке салынган кумга геометриялык фигураларды тартып олтурган чалды көрөт. Менин чиймеме жакындаба деп Архимед кыйкырат. Аскер Архимедге кылыч шилтеп жиберет. Бул учурда Архимед 75 жашта болгон. Рим аскер башчысы Марцелл Архимеддин өлүмүнө катуу кайгырган. Аны өлтүргөн жокерди армиядан куп жиберген. Архимедин тугандарына өтө зор урмат көрсөтүлүп улуу окумуштуу ардак менен көмүлгөн."},{"t":"p","h":"Ы. Кадыров"},{"t":"h3","h":"ТЕҢИРЧИЛИК ДЕГЕН ЭМНЕ?"},{"t":"p","h":"(Ташымал белгиси менен көчүрүү) Эмесе, теңирчилик деген эмне? Булуттуу Көктүн жолу, муундуу Чөптүн жолу, экөөнүн арасын жалгаган Киши уулунун жолу үч жолду жууруган Кан жолдун ааламы. Ооба, байыркы көчмөн бабалар Көктүн, Жердин, Адамдын бири-бири менен макул табышкан идеалдуу жуурум байланышын ушинтип табышкан экен. Көчмөндөрдүн тээ эзелки таш бетинде калтырган сүрөттөрүнүн тарыхы ушуну айтат. Акыры барып «Манасы» да ушуну айтат."},{"t":"p","h":"«Асман менен Жериндин Тирөөсүндөй бүткөндөй». Бул – гипербола эмес, көз караш, тааныш. Ушул саптар Күлтегин бабамдын ташындагы жазууларга кандай гана дал түшөт десең: «Үстүндө Көк Теңири, астында Кара Жер жаралганда, эки арада киши уулу жаралган». Көрүнүп тургандай, эки текстте тең Көк Теңир, Жер-суу жана экөөнүн арасын жалгап, тирөөчтөй бойлоп киши уулу турат. Әлестеткендирсиз. Бу не деген ажайып аалам, улуу сыр. Адам уулу миң сөздүн төрүн жайып иле албас, акылга кармалбас, эске ирмелбес ааламдын символун бир чапчып алакан отуна илип алган рух кудуретин айтпайсызбы. Ал мынакей! Көрдүнүзбү? Канчалык жөнөкөй жана гениалдуу! Төбөсү ачык Көк турат, ` төшү түктүү Жер турат. Ортосунда Адам-жалган. «Башы <span class=\"pg\" data-n=\"290\">290<\/span>Көктө, буту Жерде, бул эмне?» деп кыргыз табышмактайт. «Киши» дейт кайра өзү, же космикалык дене. Аны башы Көк челип, аягы Түпкө шуңгуйт."},{"t":"p","h":"Ордосу Алтайда жаткан көчмөн бабалар акыл гөйүндө баамдаган түпсүз терең чындыктардын өзөгүн сыр белгилерге батырып салган. Ал сырды илимде бу күндө Сакраль белги, Астраль белги аташат. Байыркы баба тээ таш доорунан тартып коло дооруна созулган «неолит», «энеолит» аталган жолдо эле таш бетине калтырган, табышмакка тунган сүрөттөр. Теңир таанымдын удулун көчмөндөрдүн бабалары ошол белгилердин уңгусуна каткан. Сүлүк ташка чегилген сүрөт. Бул – Ї[Х-X кылымдагы энесайлык кыргыз эр. Сүрөттөгү куюшканга куткун илинген. (Куюшкандагы куткун белгисинде, демек, ал Көк Теңирди, Адамды, Жерди – үчөөнүн биримдигин туюндурат). Белгинин сансыз таштарда чачырап калган сан түрү, санжырасы – Азия бийиктигинен Европа жайыгына жеткен көчмөн жолдо уланып барган узак эволюциясы бар. Ч.Өмүралиев, «Теңирчилик»"},{"t":"p","h":"Үлг ү: Сү-рөт-тө-гү ку-юш-кан-га кут-кун илин-ген."},{"t":"h3","h":"Онунчу жат жазуу ТАРЫХТЫН ТАБЫШМАКТАРЫ"},{"t":"p","h":"Ар бир окуучу кош дөңгөлөктүү согуштук арабаны байыркы Египете жана Месопотамияда (Евфрат жана Тигр дарыя аралыгында жайгашкан өлкө) колдонулганын өлүктү бальзамдоо да байыркы египетиктерге тийешелүгүн жат билет. Бирок тарых мындай жат болгон түшүнүктөрдү төгүндөгөн фактыларга да бай."},{"t":"h3","h":"БИРИНЧИ ТАБЫШМАК"},{"t":"p","h":"Геродот байыркы Египетин жашоо турмушу салты согуштук мүмкүнчүлүгү ырым-жырымы айрыкча мумия жасоо тууралуу кеңири баяндайт. Египете өлгөн адамды өз калыбында түбөлүк сактоо үчүн анын иче кардын мээсин алып салып денесин тузга акиташка салып катырып кийин атайын саркофагга салышат. Ушул эле ыкма Египетен сырткары жалгыз Алтайдан табылып олтурат. Археолог С.Руденко аны минтип сүрөттөйт: «Ич этин алып салуу үчүн эркектин кардын бычак менен тилишкен. Тилик көкүрөктөн чатына дейре жүргүзүлгөн. Ичеги-карды алынып ташталгандан кийин тарамыш менен тигилген. Колдорунун колтугунан тартып манжасына чейин тилинип, булчуң этеринин <span class=\"pg\" data-n=\"291\">291<\/span>арасына али белгисиз зат куюлган. Ушундай эле зат жамбашына бутарына арка этерине куюлган. Бул дененин чирип кетпеши үчүн жасалган ыкма болуш керек. Баш сөөгүн каракуш тарабынан тешип мээсин чарайнасын оюп көзүн алган соң алардын ордуна жыпар жыт берүчү кургак өсүмдүк толтуруп, сыртынан кайрадан тигилип атайылап катырылгандан соң арчадан жасалган саркофагга жаткырышкан». Көрдүңүздөрбү, өлүктү көмүү иши дал египетиктердикиндей. Демек, биз жогоруда айтып жаткан салт Египет менен Алтайда бирдей жүргүзүлсө экөөнүн так ортосунда жайгашкан элде мындай көрүнүш жок. Бул неликтен? Гректин атактуу географы Страбон өзүнүн «География» деген эмгегинде «скифтер Жакынкы Чыгыш гана эмес Египетке чейин барышкан» десе Геродот көчмөндөрдүн Нил дайрасынын боюнда болгондугун сүрөттөйт."},{"t":"p","h":"Т. Урманбетов"},{"t":"h3","h":"Он биринчи жат жазуу ЭКИНЧИ ТАБЫШМАК"},{"t":"p","h":"Археолог С. Руденко жетектеген экспедиция Алтайдагы Пазырык коргонунан түбөлүк тондун астынан толугу менен сакталган согуштук арабаны тапкан. Дал ушул кош дөңгөлөктүү арабаны чагылдырган чиймени Алтайдан миндеген километр алыстыктагы Месопотамиядан таш бетинен көрүшкөн. Согуш арабасы алгач кайда пайда болгон? Алтайдабы же Месопотамиядабы? Кызыктырганы – эки жерде тең арабанын бирдей түзүлүштө жолукканы. Мына ушул факт байыркы түрктөр Вавилонияда Месопотамияда болушкан же качандыр бир кездерде алар Түштүк Сибирде жанаша балким аралаш жашашканбы деген ойго түртө берет."},{"t":"h3","h":"ҮЧҮНЧҮ ТАБЫШМАК"},{"t":"p","h":"Тарыхта жоокерди гана эмес атты да ар кандай формада найза кылыч жаанын огу өтпөгөндөй жабулашканы белгилүү. Илимде мындай ат жабууну алгач Египете Ассирияда кийин Римде колдонушкан деп эсептешет. Кытай тарыхчысы Сыма Цянь биздин доордон миндеген жыл мурун эле түндүк тарапта жашаган көчмөндөрдө согуштук ат жабуу колдонулганын айтып кетсе да аны окумуштуулар элес алышкан эмес. Тувадан Аржан көрүстөнү ачылып андагы падышанын жана аны менен коюлган адамдардын мүрзөлөрүнөн мурдатан эле калыптанып калган маданиятын үлгүлөрү табылган. Лабора- ` торияда текшерип көрүшкөндө көрүстөн биздин доордон мурунку <span class=\"pg\" data-n=\"292\">292<\/span>800-жылы курулганы аныкталган. Андан табылган ат жабдык курал кийимдердин жасалышындагы көркөмдүктүн калыптанышы андан нары дагы миң жылды чапчырында шек жок. Ошондон улам көрүнүктүү окумуштуу М. П. Грязнов мындай дейт: «Азия көчмөндөрүнүн искусоетвосу менен маданиятын иран-сарматтык маданиятын учкай таасири эпкини катары эсептөөнү түп тамырынан бери өзгөртө турган мезгил келип жети. Азия мейкиндигиндеги байыркы көчмөндөрдүн жасагандары жалпы скиф маданиятын калыптандырууда өзгөчө мааниге ээ экендиги талашсыз. Бирок М. П. Грязновдун табылгасы да айткан пикири да окумуштуулар тарабынан толук колдоого ээ болбой калды. Анткени ал теория байыртадан калыптанып калган индоевропалык нукту бузуп жиберет деп чочулашкан. Ошондон улам байыркы түрктөрдүн Египет Шумер, кала берсе, кийинки скифтерге болгон карым-катышын байланышын өз ара тасирин жоко чыгарып келишкен."},{"t":"p","h":"Т. Урманбетов"},{"t":"h3","h":"Он экинчи жат жазуу ‚ КУБАТБЕК БИЙ"},{"t":"p","h":"Кубатбек бий XVIII кылымдын экинчи жарымында кыргыздарды бийлеген кол башчы. Кушчу уруусунан чыккан. Ага Алай жана Фергананын батыш бөлүгүндөгү кыргыздар караган."},{"t":"p","h":"Кубатбек бий Жайыл, Атаке Әсенгул бийлерден жашы улуу болгон. Ойрот-жунгар баскынчылыгынын, Кокондун кысымы Букаранын опузасы тушунда бул адамдын аркы-теркини терең түшүнгөн токтоолугунан улам ал башкарган аймактагы иштерге кийлигишүлөр болгон эмес. Анжыянда турганда ал Абдурахимдин уулу Әрдененин Кокон тагына отуруусуна көмөк көрсөткөн. 1750 жылы Абдыкерим өлгөндөн кийин, Шахруктун балдары өз ара бийлик талаша баштаган. Ушул учурда ойрот-жунгарлар бир кезде өздөрү барымтага алып кеткен Бабабекти такка отургузууну көздөшкөн. Ал эми ойрот-жунгарлар дегенде көзүнүн чаары чыкан Кубатбек бий ордого өзүнүн салмагын салып Әрденени такка отургузган. Кийин Әрдене Кубатбек бийди Рахим ханга сатып ийгенден тартып, алардын ортосундагы мамиле үзүлөт."},{"t":"p","h":"1762 жылы адигине уруусунун башчысы Ажы бий Ошту башкарып турганда Әрдене Кокондун ээлигин кеңейтмекке бул аймакты басып алып кыргыз-кыпчактарга чоң кыргынды баштамакчы болот. Ажы бийдин чабарманы алып барган чакырыктан улам Кыргыз үчүн ат жалында конуп түнөгөн <span class=\"pg\" data-n=\"293\">293<\/span>Кубатбек бий Ошту Әрденеден ажыратып калган. Кыргыздардын атактуу аскер башчысы Кубатбектин карынан коркон Әрдене кылган кылмышы үчүн алдына алтын-күмүш тартып жатып араң кутулганы тарыхта да жазылган. Кадимки Кокондун аскер башчысы Нарбото бийдин өз инисине болгон жүзүкаралыгын ашкерелеген соң ал кайрадан Кашкарга сапар чыккан. Кийин Кубат бий киши колдуу болуп ууландырылып өлтүрүлгөндө Ажы бий Кокондон коргор Кубатым, эми ээн калды бир башым деп боздогон экен. Мына ушул окуядан көп өтпөй Коконго каршы көтөрүлгөн Ажы бийдин колу талкаланып, өзү ар кай жерде жашынып жүрүп кармалган соң Алим хан тарабынан дарга асылат. Анын эс тартып калган эки уулу Алим хандан качып Чаткалга келишет. Бул жерде алардын улуусу Улукбек өлүп, кичүүсү Шералы Таласка таякеси Алчыкенди издеп келип Ажыбек датка аркылуу Баркыдан тараган Жанболот баатырдын жылкысын кайтарып жашынып жүрүп кийин Нүсүп бий менен Сейдалы бектин көмөгү аркылуу Кокон тагына минген. Ошол Шералынын бутташып калган кыргыз тагдырында атасы Ажы бийди Кубатбек колдоп келсе, уулун коргоп такка мингизген анын күйөө баласы Ажыбек, кызы Аксуусар эмеспи. Кийин кыргыздын «Мал арыгын сактасан, оозу мурдуң май болот, киши арыгын сактасан, оозу мурдуң кан болот» дегендей Ажыбек датка уулу Нурак датка ошол Шералы жээни колдуу болушканы белгилүү эмеспи. Аттиң бири кем дүйнө..."},{"t":"p","h":"Кубатбек бий Кашкардын акими болуп турганда ал ойрот-жунгарларды талкалоо үчүн жортуула чыккан ага кытай императору чоң салтанат менен «санджи дачзи» деген княздык наам берип анын белдүү жигиттерине ар кандай майда чиндерди ыйгарган. Бирок Кубатбек бий кытайлыктардын аракетине карабай алардын карамагына өтүгө макул болбой койгон."},{"t":"p","h":"«Кыргыз тарыхы» энциклопедиялык сөздүгүнөн жана А. Кененсариевдин «Талас турмушу» гезитиндеги макаласынан"},{"t":"h3","h":"Он үчүнчү жат жазуу 1. КЫРГЫЗ ФИЛОСОФИЯСЫ: «ДҮЙНӨ ОПО БОЛБОЙТ»"},{"t":"p","h":"Таласта Мыкы болуш деген 16 жыл болуш болгон. Он эки баласы бар экен. Бир да малай жумшабаптыр. Өзү олуяатага жылына бир барып балдарына байбичесине токолуна таардан кийим алып келчү экен. Ээр-токумун төөнүн комун шона менен өзү тикчү экен. Ошондо аялы ой тиги кызыл <span class=\"pg\" data-n=\"294\">294<\/span>баш Кудайбергенди кара баш Кудайбергенди карачы. Казандарын эркектер кармайт. Сен болсо бизге таар кийгизесиң десе ой жаман арамдар, мен түбүн ойлоп жатпаймбы түбүндү ойлонсоң дечү экен. Кийин Совет бийлиги келгенде Мыкыга эч ким тийбептир. 12 баласына тең пособие берилет. Мыкы болуш айдалган жок. Сөөгү жеринде калды. Баягы жаш аялы кийин байбиче болгондо Мыкы болуш түбү деп ушуну айткан турбайбы дегенин мен энемен укам. Кудайбергендер опус болуп Сибирге айдалып Таластын этегинде эл менен коштошкондо айткан экен (Кудайбергендин 800 төөсү 12 миң жылкысы болгон): «Дүйнө опо болбойт» дечи эле, опо болгон жок. Мына, Мыкы, 16 жыл болуш болуп элге жамандык кылган эмес экенсиң. Сөөгүң элде калды. Биз дүнүйөдөн айрылып бөлөк жерге кетип баратабыз» – дептир. Мына, кыргыздын философиясы."},{"t":"h3","h":"2. Биздин душман"},{"t":"p","h":"Бизге душман сыртан тийген жок. Душман дегенибиз: бүгүнкү кыйынчылыктарды жараткан эскиче ой жүгүртүү эскиче мамиле кылуу шалакылык жоопкерсиздик жалкоолук жанбактылык кайдыгерлик бирөө келип бүтүрүп берет дегендик. Же болбосо демократия дегенди сыйкырчылыка теңеп бири-бирибизди шайласак эле экономикабыз өсүп кетет каалаганды сүйлөй берсек ошол демократия экен деген адашулар ушунун баары бүгүн душман. Тарыхыбызды изилдебегенибиз руханий байлыктарды сактабагандыгыбыз ыймандуулукту кеңири таратпагандыгыбыз ушунун баары биздин душманыбыз."},{"t":"h3","h":"З. ЫЙМАНДУУЛУК ДЕГЕН ӘМНЕ?"},{"t":"p","h":"Дин албете ыймандуулуктун чоң бутагы. Ал эми ыймандуулук динден да чоң кеңири түшүнүк. Биз мектепте балдарга билим беребиз бирок барынан мурун окуучуну адам кылып тарбиялоо зарыл. Биринчи ирет адам кылыш керек. Агрономду инженерди филологду ж.б. тарбиялоо бул экинчи кадам. Бала мектептин босогосун аттаганда ыймандуулук менен атташы керек да кайта бүтүп кеткенде ыймандуулук деген түшүнүк менен кетиши керек. ЖОЖдордо ыйман программасын иштеп чыгуу зарыл. Ар бир жамата ыйман жөнүндө түшүнүк менен жумушка келип жумуштан кетиши керек. Улутук идеология деген – ушул. Радиодо телекөрсөтүүлөрдө эртең мененки берүүлөрдү биринчи ыймандулуктан башташ абзел. Жетекчилерди акимдерди ыймандуулук жактан атайын <span class=\"pg\" data-n=\"295\">295<\/span>аңгемелешүүдөн өткөрүп туруу зарыл. Акимдерден министрлерден чиновниктерден нагыз элдик салтка ылайык ант алуу керек. Маселен момундай мазмунда: «Әгерде элиме улутума карасанап өз кызыкчылыгыма тартсам тукумум өспөсүн арбактар уруп кетсин. Жесем элдин каргышы урсун тескери бата алайын» деген сыяктуу."},{"t":"p","h":"Д.Сарыгулов"}],"sub":[{"title":"ЭЛҮҮ БИР СУРОО","b":2},{"title":"Сегизинчи жат жазуу","b":57},{"title":"БЕКНАЗАР КУУДУЛ","b":59},{"title":"«ТАЯНА ТУРГАН ЖАЙ ТААП БЕРСЕҢ, ЖЕР ШАРЫН АЛАСАЛДЫРЫП БЕРЕМ»","b":67},{"title":"ТЕҢИРЧИЛИК ДЕГЕН ЭМНЕ?","b":73},{"title":"Онунчу жат жазуу ТАРЫХТЫН ТАБЫШМАКТАРЫ","b":78},{"title":"БИРИНЧИ ТАБЫШМАК","b":80},{"title":"Он биринчи жат жазуу ЭКИНЧИ ТАБЫШМАК","b":83},{"title":"ҮЧҮНЧҮ ТАБЫШМАК","b":85},{"title":"Он экинчи жат жазуу ‚ КУБАТБЕК БИЙ","b":88},{"title":"Он үчүнчү жат жазуу 1. КЫРГЫЗ ФИЛОСОФИЯСЫ: «ДҮЙНӨ ОПО БОЛБОЙТ»","b":94},{"title":"2. Биздин душман","b":96},{"title":"З. ЫЙМАНДУУЛУК ДЕГЕН ӘМНЕ?","b":98}],"section":"ЇХ КЛАСС","pages":[285,295]},{"title":"§ 49. ДИЛБАЯН","blocks":[{"t":"h3","h":"§ 49. ДИЛБАЯН"},{"t":"h3","h":"Байытып баянда"},{"t":"p","h":"Кайнаган базар ... кызыл-тазыл ... дүр-дүнүйө ..."},{"t":"h3","h":"Катасын ондоп жаз"},{"t":"p","h":"1. Китеп окуган китепкөй неме окуган китебин башкалардан кызганды."},{"t":"p","h":"2. Кап көтөрүп, көтөргөн кабымды улам ондоп көтөрүп, өлдүм-талдым дегенде, эсим ооп, көтөргөн кабымды машинеге жеткирдим."},{"t":"p","h":"3. Жолдо келаткан автобус жолдо келатып, суу чачыратты."},{"t":"p","h":"Сөздөрдү өз ордуна кой 1. Чоң аяк – чарчап келген – кымыз – менен – сунулду – жигитке."},{"t":"p","h":"2. Айлананы-эртең мененден бери – туман – жөө каптап – турат."},{"t":"p","h":"3. Көрүнө түштү – булуттардын арасынан – жылдыздаржарк-журк эткен."},{"t":"p","h":"4. Күүлдөтөт – долуланган – токойду – шамал."},{"t":"h3","h":"Байытып чакан аңгеме жаз"},{"t":"p","h":"Жоностон соккон шамал... мырза теректер. Арыкта кужулдап аккан суу... жаагы ачылып, күлдүрт-күлдүрт... Муздак сыдырым... Бетке салкын... Чымчыктар чыркылдашат... Мор күүлдөйт... Акырга байланган уй... (Кааласан ыр менен жаз)."},{"t":"h3","h":"Сүйлөм түз"},{"t":"p","h":"1. Ар бири «ч», «к», «о» тамгасы менен башталган үч сөздүү сүйлөм жаз. 2. Ар бир «к» тамгасы менен башталган ‚беш сөздүү сүйлөм жаз. 3. Ар бир «о» тамгасы менен башталган төрт сөздүү сүйлөм жаз."},{"t":"p","h":"<span class=\"pg\" data-n=\"296\">296<\/span>Үл г ү: Астымда атым аргымак, адырды аштым аркалап. Арчалар арбын аягы, аргымак атым арыды (7. Кабылбеков)."},{"t":"h3","h":"АНТ КЫМБАТПЫ, САЛТ КЫМБАТПЫ? Дилбаян"},{"t":"p","h":"Ойго таек. Кыргыз жазма адабиятын түптөгөн жазуучулардын бири Сыдык Карачев 1928-жылы «Әрксиз күндөрдө» деген повестин жазат. Ошондо мындай окуя бар. Мамырбай деген – миңдеген төрт түлүгү, үч аялы бар, кадыр-барктуу 63 жаштагы манап. Ал өзүнө курбалдаш Кендирбай деген ажылыкка барып келген молдонун Жыпар деген кызына салт боюнча кудалашып, өзү үйлөнмөк болот. Буга Кендирбай жетине албай сүйүнөт. Бардар, дөөлөттүү адам менен кудалашуу оңойбу. Ошол арада Жүнүш деген мугалим жигит Жыпарды кыз оюндан көрүп, бирин бири жактырып калышат. Экөө бир бүлө болууга антташат. Аңгыча Мамырбай Жыпарды алмак болуп тойго камданат. Ошондо Жүнүш сүйгөн кызын ала качат, бирок колго түшөт. Жүнүштү каматып, баш аттап, эр чанганы үчүн Жыпарды Мамырбайдыкына күң катары кийрип берет. Ошол кезде үркүн болуп, эл Турпанга оойт. Калк башына кыйын күн түшүп турат. Түрмөдөн бошоп, эл менен кошо качкан Жүнүш акыры Жыпарды издеп таап, ага баш кошор ниетин айтат. Жыпар макул болот. Жолугушчу жерди болжошот. Бирок тагдыр экөөн кошпойт. Убада боюнча жолдо келатып, Жыпар ат-маты менен кокустан аскадан учуп кетет."},{"t":"p","h":"Ойлон. 1. Окуя түшүнүктүү. Аны кайталоонун зарылдыгы жок. Бирок ушул жерде ажытын ачып жазар бир чоң маселе турат. Ал – ант кымбатпы, салт кымбатпы? Чын эле кайсынысы кымбат? Мындайынан карасан, салт да, ант да керек. Мамырбай салттын жолу менен Жыпарга үйлөнмөк. Анттын жолу менен кызга Жүнүш баш кошмок. Жыпар ушул эки жол – эки күчтүн тирешүүсүнөн күң да болот, акыры өлүмгө дуушарланат."},{"t":"p","h":"2. Жашаган чөйрөңө, уккан, билген, көргөн окуяларга серп салып көрсөң. Баш кошкондордун баары эле арзуу сезими менен антташып, бүлө болуп жатышабы? Же кудалашуу жолу менен, же ала качуу менен үйлөнгөндөр көп эмеспи? Кандай дейсиң?"},{"t":"h3","h":"3. Ал эми сен үчүн кайсынысы кымбат, антпы, же салтпы?"},{"t":"p","h":"<span class=\"pg\" data-n=\"297\">297<\/span>Сунуш. 1. Бул дилбаянды пьеса түрүндө жаз. Эки-үч окуучуну жогорку көйгөй боюнча талаштырсаң болот. 2. «Сөз бермети», «Макал» топтомдорун кең-кесири пайдалан."},{"t":"h3","h":"«ЖЕР ӘНЕ» ДИЛБАЯН ТҮРМӨГҮ"},{"t":"p","h":"Ойдун өбөлгөсү. Чыңгыз Айтматовдун «Саманчы жолу» повестинде Толгонай эне жерге кайрылып: «Жер, жан жараткан жер, бизди көтөрүп жаткан жер, сен бизге таалай бербесең, эмнеге жер болуп орнойсун да, биз эмнеге дүйнөгө жаралабыз! Биз сенин балдарынбыз, жер, тилектеш болгун, ак тилегибизге жеткиргин!» – дейт."},{"t":"p","h":"Ойлон. Ооба, талашсыз чындык, жер баарыбызды багат. Ошон үчүн эне. Даанышман акын Калыгул ошон үчүн: «Таза болсоң, суудай бол, баарын жууп кетирген, балбан болсоң жердей бол, баарын чыдап көтөргөн», – дейт. Жер бүткүл адамзатты, анын ичинде сенин элинди, ата-бабанды, өзүндү багууда, келечектеги укум-тукумунду да багат. Эгин эгилип, аштык алынат. Кыскасы, эмне сепсен, ошону оросун. Чексиз март, жана да жер – адам баласынын түгөнгүс, соолбос, салыштырылгыс ырыскы, байлыгы. Бирок ырыскысын дайыма түрүлтүп берип турган жерди кастарлай алдыкпы? Аны кор тутуп жаткан жокпузбу? Мисалы, бир нече тентек 5—6 бетелкену бута кылып, «сенин кулачын туз», «жок, менин кулачым туз» деп таш менен уруп жатып, картөшкө айдаган талаанын чок ортосуна талкалап салышты. Дагы бирөөлөр талааны айдоого даярдоо үчүн өрттөшөт, кыртышты күйгүзүп салганы оюна бир келип койбойт. Айдоо талаасына заңкайтып үй куруп, завод тургузгандар бар. Ушул сыяктуу нерсенин баары сенин көз алдында болуп жатат. Балким, самандуу талааны өрттөп, бөтөлкө сындырып, жерге жабыр көрсөткөндөрдүн ичинде өзүн да болуп калышың мүмкүн. Анан «жер энебиз, ал бизди багып жатат» деп айтканыңан эмне опа. Сөз жүзүндө мактап, иш жүзүндө талкалап жатсан, же талкалап жаткандарга кайдыгер карап, тиешеси жок маңыроо катары басып жүрсөн, сени ким дешке болот? Чын эле сен кимсиң?"},{"t":"h3","h":"1-дилбаян"},{"t":"p","h":"Сунуш. Ой толгоо түрүндө дилбаян жаз."},{"t":"p","h":"Тилге таек. «Күлүп-жайнап, эр жигит, кулак байлап, жер жибит» (Ток- ‚ тогул). «Этектей кетмен бештетпей, белсенип чеке тердетпей, арпасы бышып коолабай, алты орокчу боолабай, буудайы бышып коолабай, беш <span class=\"pg\" data-n=\"298\">298<\/span>орокчу боолабай, оп майдалап бастырбай, кампанын оозун ачтырбай, кызыл бөйрөк буудайын кылым элге чачтырбай, дыйкансыган жигитке кампа толгон дан кайда?» (Жеңижок). «Эр эмгегин жер жебейт» (макал)."},{"t":"h3","h":"АМАНСЫҢБЫ, КУТТУУ ТАЛААМ? 2-дилбаян"},{"t":"p","h":"Сунуш. Сен өзүңдү Толгонай эненин ордуна кой, анан Жер эне менен чыныгы ниетиңден сүйлөшүп көр да, ошону диалогдуу дил баян кылып жаз."},{"t":"h3","h":"ТОЛГОНАЙДЫН ТАЛААСЫ 3-дилбаян"},{"t":"v","l":["Сунуш. Ыр менен жаз. Өзүң каалаган көлөмдө.","","Буудайдын кылканында күн ойногон","","Мен келдим талаасына Толгонайдын."]},{"t":"h3","h":"МАЙСАЛБЕКТИН КАТЫ Дилбаян"},{"t":"p","h":"Ойго өбөлгө. Калматай кыргыз жерин калмак баатыры Манжыга тартуулайт жана элибиздин баатыр кызы Жаңылды колго түшүрүп, ага үйлөнөт. Муну ал «кек» деп түшүнөт. Тейитбек уулу Курманбекти душмандын кызына үйлөнбөй койгону үчүн күнөөлөйт да, төбө чачты тик тургузган чыккынчылыкка барат. Душманды өзү чакырып, ал аз келгенсип, Телтору атты баласына бербей, кайра уулунун өлүмүн тилейт. Согушта жоонун жеңишин уюштурат. Ал эми «Саманчы жолу» повестиндеги Майсалбекчи? Ал катында бир сааттан кийин Мекен тапшырган ишке барып, кайра кайтпай турганын, душмандын талылуу жерин кыйратып, аны менен өзү да жок болорун жазат. Мекен үчүн, эл үчүн, жеңиш үчүн, дүйнөнүн бардык жакшылыгы үчүн... «Кулакка, балким, жат угулса да, бул жашоо үчүн болгон елум,- дейт Майсалбек,— мен өз ыктыярым менен ушуну туура таптым. <span class=\"pg\" data-n=\"299\">299<\/span>Мени жоктобо, апа. Менин артымда туягы калган жок дебе. Дүйнөдө мындан ары согуш болбосо, жаңыдан төрөлгөн баланын ыңаалаганы – ошол мен, бой жеткен кыздардын жоодураган көздөрү – ошол мен, бутакта көгөргөн жалбырак – ошол мен, талаада өнүп чыккан эгин – ошол мен, мугалимдин балдарга биринчи үйрөткөн «А» тамгасы – ошол мен, ошонун баары мен, ошонун баары мен, мен деп билип жүргүн, апа!»"},{"t":"p","h":"Ойлон. 1. Сен Калматай, Тейитбек, Майсалбек – үчөөн салыштырып көр да, өзүңө кимиси эмне үчүн жаккандыгын, кайсынысы кайсы себептен жакпай турганын байка."},{"t":"p","h":"2. «Әч ким, эч нерсе унутулбайт» дейт. Мезгил дегениң баарын эскиртип, эстен чыгарат, унуттурат. Ошондой жүз миңдеген Майсалбектерди ким эстеп жүрүптүр. Ар ким көр тирлиги менен алек да. Же башкачабы?"},{"t":"p","h":"3. Эл үчүн күрөшкөн эр азаматтар элдин эсинен чыкпайт дешет. Буга макул. Ал эми Тейитбекчи? Көпкө, өз бүлөсүнө карасанатайлык кылса да, ал унутулбай калбадыбы? Же жалганбы? «Атың чыкпаса, жер өрттө» деген бетпак жерди өрттөп жиберсе да, элге чыккынчылык кылса да, элдин эсинен чыкпай калганын кара. Буга эмне дейсин?"},{"t":"v","l":["Сунуш. Ой толгоо жаз.","","Әс алуу үчүн"]},{"t":"p","h":"Төмөнкү сөздөрдү өз ордуна койсон, сенин жеке оюңа бап, тилегиңе төп келген маани чыгат."},{"t":"p","h":"Бактылуу – келечекте – боломун – таза ыйман – заман жүгүн аркалап – тунук адеп менен – улууга урмат, кичүүгө ызаат кылып."},{"t":"v","l":["Дагы эс алуу үчүн","Сөздөрдү өз ордуна койсон, улуу драматург","В. Шекспирдин канаттуу сөзүнө туш болосуң."]},{"t":"p","h":"Сылыктык жерде күч алат – сууй баштаган – достук."},{"t":"p","h":"Эс алып, окуп кой Апендинин кеп баштыгынан. Келе жатып шайтан кой башындай алтын таап алды да:"},{"t":"v","l":["– Мен таптым, бөлүп алалы, – деди.","– Жалгыз мен алам, – деди Алдаркөсөө."]},{"t":"p","h":"<span class=\"pg\" data-n=\"300\">300<\/span>– Эми эмне кылалы?"},{"t":"p","h":"– Кимибиз жашыбыз улуу болсо, ошонубуз алалы. Кайсы убакта туулдуң эле?"},{"t":"p","h":"– Жер бүтө электе, ай аяктай, тоо томуктай, күн күрөктөй экенинде төрөлгөнмүн, – деди шайтан."},{"t":"v","l":["Аны укканда, Көсөө өңгүрөп ыйлап кирди.","– Әмнеге ыйлайсың?"]},{"t":"p","h":"– Так сен төрөлгөн убакта менин алты жашар балам өлүп калган, ошого ыйлап жатам, – деди Алдаркөсөө."},{"t":"p","h":"– Эмесе, сен улуу экенсин, – деп шайтан алтынды Көсөөгө берип, жөнөп кеткен экен."},{"t":"h3","h":"«ПЕЙИЛ» ДИЛБАЯНДАР ТҮРМӨГҮ"},{"t":"p","h":"Ойго таек. Кыргыз элинин коомдук ишмерлеринин бири Дастан Сарыгуловдун минтип айтканы бар: «Пейил оңолсо, адам оңолот». Демек, пейил оңолбой, адам оңолбойт."},{"t":"p","h":"Ойлон. Угуп эле жүргөндүрсүңөр, турмуш-тиричиликте «төрө пейил», «кичи пейил», «пейили чечилди», «пейилиңди курутпа», «агынан жарылган пейил», «пейили бузулуптур», «пейилим менен», «пейилинен тааптыр», «чын пейилден», «пейили тар» деген сөздөр, «пейил оңолбой, иш оңобойт» деген макал көп эле колдонулат. Түшүндүрмөлүү сөздүктө «пейил» – мүнөз, кулк-мүнөз, көңүл, көөн, ниет, ой деп чечмеленет экен. Эми кептин баары мында: пейилдин оңолушу менен адам кантип оңолуп кетет? Же адам пейилин кантип оңойт?"},{"t":"p","h":"Төмөндө үч кишинин үч түрлүү пикирин салыштырып көр. Айталы, Төрөкул минтип айтат: «Денең ач көздүктөн, уурулуктан, эки жүздүүлүктөн, алдамчылыктан, сугалактыктан, ичи тардыктан, көрө албастыктан тазаланганда пейил оңолот». Молдоысак деген карыя: «Барга каниет кылып, сабыр тутканда, пейил – дейт. Ал эми Надырбек: «Пейил деген ак эмгек, чеке төккөн тер менен жашаганда оңолот»,— дейт. Булардын айтканынын кайсынысы туура жана эмне үчүн туура?"},{"t":"h3","h":"ПЕЙИЛ КАНТИП ОҢОЛОТ? 1-дилбаян"},{"t":"p","h":"Ойго таек. Маалымбек деген аксакал сөз арасында минтип айткан эле: «Адам-акчанын, дүнүйөнүн кулу. Әгер ушундай кулдуктан кутулса, адамдын пейили оңолот»."},{"t":"p","h":"<span class=\"pg\" data-n=\"301\">301<\/span>Ойлон. Акча керекпи, керек. Дүнүйө да ошондой. Буларсыз киши таптакыр жакыр, бечара болуп калбайбы? Акчасыз жана дүнүйөсүз бардар, бакыбат жана бактылуу турмуш кантип түзүлөт? Же бардык жыргалчылыктан безүү, акчага да, дүнүйө-байлыкка да кол шилтөө бакытпы, ошону менен пейил оңолобу? Кул болуу кандай жаман? Балким, адам акчадан да, дүнүйө-мүлктөн да жогору турган өтө азиз, өтө ыйык жандыр?! Же тирлик менен алышкан көр пенде ошол азиздигин сезер, аны туу катары булгалап жүрөр дейсиңби?"},{"t":"p","h":"Сунуш. Дилбаянды ой толгоо түрүндө жаз. Аз болсо да, саз болсун. Аркандын узуну, сөздүн кыскасы жакшы."},{"t":"h3","h":"ЖИНДИ СУУ"},{"t":"p","h":"2-дилбаян Ойго таек. «Ит каппайт сени адам деп, кыз сүйбөйт сени жаман деп. Суу кечкен теке кейиптентип, плащчан коёт кышында. Батинкесиз, өтүксүз, эски галош бутунда», – дейт Райкан Шүкүрбеков. Бул – аракечтин кейпи."},{"t":"p","h":"Ойлон. 1. Баары эле аракты «жинди суу» деп жамандайт, бирок көпчүлүгү ага карабай ичип алат. Арактын күчү эмнеде?"},{"t":"p","h":"2. Киши өлтүрүү, уурдоо, ар кандай кырсыктар (авария) жана башкалар менен аракечтиктин байланышы барбы?"},{"t":"p","h":"3. «Элибизди тукум курут кыла турган нерсе согуш эмес, арак, ал ичтен жеген курттай, өзүндү жеп, анан укум-тукумуңа өтүп кетет»,—-деп жазышат гезиттер. Бирок аракечтикке эч кимдин күчү жетпейт окшойт, чынбы?"},{"t":"p","h":"4. Сен айтасын: «Чоңойгондо мен арак ичпейм», – деп. Балким, кийин чөйрө сенин оюнду өзгөртөр, же өзгөртпөс. Бирок эң башкысы – өзүндө аракечтикке каршы түптөлгөн бекем түшүнүк болуш керек, ошондой нерсе сенде барбы?"},{"t":"p","h":"5. Балким, аракты актайсын, анткени ансыз бир да той өтүлбөйт, мейман күтүлбөйт. Же жалганбы?"},{"t":"p","h":"6. Баса, пейилди да, ыйманды да көз көрүнө талкалап жаткан нерсе аракечтик эмеспи. Же башкачабы?"},{"t":"p","h":"Сунуш. Дилбаянды ой толгоо түрүндө жаз."},{"t":"h3","h":"Тилге таек. 1. «Иче электе коёнсуң, ууртап алсаң ноёнсуң. Көтөрө"},{"t":"p","h":"чуркап таякты, талкалап казан-аякты. Жумшактан үйдө күл калат, катуудан калат казаны» (Райкан). 2. «Арканы жок, жиби жок, байлап алат жинди суу. Жылаңайлак-жылаңбаш айдап алат жинди суу. Калтыратат колуңду, <span class=\"pg\" data-n=\"302\">302<\/span>ийри кылат жолуңду, жайдын күнү кийгизет, кышындагы тонуңду» (Райкан). З. Залкар ойлордон. «Мастык – кырсык үчүн ачыла турган эшик» (чыгыш элдеринен). «Арак адамды айбанга теңеп салат» (Ф. Достоевский). «Алкоголизм үч кырсыкты: ачарчылык, тумоо жана согушту бириктирип алганга караганда зыяндуу келет» (В. Гладстон). «Арак ак болгону менен адамды кызыл тумшук, кара бет кылат» (А. П. Чехов). «Мастык – ыктыярдуу түрдөгү жиндилик» (Сенскаримдик даанышман). «Айтпай жүрчү «жинди суу» деп аракты, арак качан жиндимин деп сага айтты. Кааласаң ич, катуу кетпей чек менен, куубайт сени кулап түшүп текчеден» (Б. Сарногоев). «Мас болуу – жиндиликке машыгуу» (Пифагор)."},{"t":"h3","h":"КОШУНАНЫН КҮРПҮ 3-дилбаян"},{"t":"p","h":"Ойго таек. Бакберген деген жигит айтат: «Каш карайып калган. Биздин дубалдын кырына бир курп тунеп калыптыр. Акырын кармап алдым. Килейген чоң, семиз күрп. «Кошунаныкы экен, түн ичинде бала-бакыра уурдап кетсе эмне болот», – дедим ичимен. Анан барып кошунанын дарбазасынан каккылап, ээлерине күрптү бердим»."},{"t":"p","h":"Ойлон. Бакберген ээсине күрптү берди. Мындан эмнени байкадың? «Кошуна деги бизден көрбөйт, кудай жалгасын» деп союп алса, эмне болмок? Ошондо ушул кылган тымызын уурулугу учун ал санаага батып, ичи кирдеп жүрөт беле? Же «атасынын көрү, боло берет да» деп кынык алып кетиши деле мүмкүн да. Ошондой эле пейилди сынаган жогоркудай кырдаал ар бир адамга ар дайым туш келип турары бышык. Әгер ошондой пейил сынагы келди дейли, анда эмне кыласын?"},{"t":"p","h":"Сунуш. Чакан көлөмдөгү дилбаян жаз."},{"t":"p","h":"Тилге таек. «Адам болуу аста-аста, айбан болуу бир паста», «Арамдын түбү – бир тамыр, адалдын түбү – миң тамыр», «Ак сөз арыбайт, ак жүргөн карыбайт», «Ак көңүлдүн аты арыбайт, тону тозбойт», «Адамча туулуп, айбанча жашаба» (макалдар)."},{"t":"h3","h":"КУДАЙ – БУЛ ПЕЙИЛ"},{"t":"p","h":"4-дилбаян Ойго таек. Абаскан карыянын сөзү: «Әэ, уулдарым, кудай деген – бул пейил. Кудайды ойлогон адам пейилин бузбайт, уурулук кылбайт, ушак айтпайт, арамдыкка барбайт. Пейили, ыйманы таза болот»."},{"t":"p","h":"Сунуш. Дилбаянды баян түрүндө жаз (1-түр)."},{"t":"p","h":"<span class=\"pg\" data-n=\"303\">303<\/span>Тилге таек. «Кудай күлкүңдү тыят, пендеге кайрымдуу кылат» («Ал- Бакара» сүрөсүнөн)."},{"t":"p","h":"«О пенделер, кесир кендирди кесет» («Жунус» сүрөсүнөн)."},{"t":"p","h":"«Жамандык кылганга – үстөгү менен жамандык. Караңгы түндөй түнөргөн кайгы басат. Алар түбөлүк тозок отунда. («Жунус» сүрөсүнөн). «Жаман сөз жаман дарак сыяктуу данеги жок, түбү чирик. Эпкин тийсе карс кулайт» («Ибрагим» сүрөсүнөн). «Ар ким бирөөгө ор казса, өзүнө тереңирээк казсын» («Нур» сүрөсүнөн)."},{"t":"p","h":"«Кудайдын өкүмү: колу туткак ууру менен ууру аялдын колун кескиле» («Насип» сүрөсүнөн)."},{"t":"h3","h":"Дилбаян"},{"t":"p","h":"Теманы өзүң кой Сунуш. Каалаганыңа жараша чакан сүрөттөмө же ыр кылып жаз. Пайдалан. Көк асман түнөрөт... Булут... Тырс этип бутак сынат. Боз үйдөн түтүн бурк этет... Каңтаргада байланган ат... Көң түбүндө тумшугун катып уктаган ит... Алыстан кулун-тай кишенейт..."},{"t":"h3","h":"АДАМ БОЙДОН КАЛАР БЕКЕНБИЗ Дилбаян"},{"t":"p","h":"Ойго өбөлгө. 1. И. Арабаев атындагы сыйлыктын лауреаты С. Байгазиев: «Турмуш көрсөтүп жатат го, билимдүүлүк, жогорку даражадагы адистик адамды адам катары мүнөздөөгө жетишсиздик кылат экен. «Вечерний Бишкек» менен «Дело М» гезиттеринен канчалаган билимдүү ууруларды, киши өлтүргүчтөрдү, акмакчылык иштерди жасаган дипломдууларды, айбандык жорук-жосунду иштеген адистерди окуп, күбө болуп жатабыз. Демек, билимдүү болуу, дипломго ээ болуу деген пенде бул автоматтык түрдө адам болуп калды деген сөз эмес», – деген."},{"t":"p","h":"2. Орустун улуу сынчысы В. Г. Белинский минтип айткан экен: «Шашпай тургула, бизде да чоюн жолдор болот, а түгүл аба почтасы да болор. Фабрикаларыбыз, мануфактуралар өркүндөп өсөр. Бирок бизде тунук адептүүлүк болор бекен? Ооба, уста болобуз, слесарь болобуз, фабрикант болобуз. А өзүбүз адам бойдон калар бекенбиз»."},{"t":"p","h":"Ойлон. Мына, эки окумуштуунун чыгарган тыянактарын окудуң. Билимдүү болуу пенде адам болуп калды деген түшүнүк эмес экен. «А өзүбүз адам бойдон калар бекенбиз», – деп арсарсыйт улуу сынчы. Анда билимдүүлүк менен адам болуунун асман-жердей айырмасы бар турбайбы? Әмесе, адам <span class=\"pg\" data-n=\"304\">304<\/span>болуу деген эмне? Аны кандайча түшүнөсүң? Өзүңдө адамдык сапаттар барбы?"},{"t":"p","h":"Сунуш. Дилбаянды ой толгоо түрүндө жаз."},{"t":"p","h":"Тилге таек. 1. «Окуу жайлары (анын ичинде мектеп да) билимдүүнү гана эмес, билимдүү адамды калыптандырып чыгарууга тийиш» (С. Байгазиев)."},{"t":"p","h":"2. «Бакыбат келечекти, жаңы коомду кура турган адам – бул:"},{"t":"p","h":"– руху улуттук жана дүйнөлүк маданияттын мөл булагына сугарылган;"},{"t":"p","h":"– гуманизмди, адамды сүйүүнү, ага жакшылык кылууну тумар кылып тутунган;"},{"t":"v","l":["– таза ыйманга, тунук адепке, адал пейил, ак ниетке эгедер,","– өзүң өзү аңдап түшүнүүсү бийик;","– жоопкерчилик жана ар-намыс сезими күчтүү;","– ар дайым ынтымакка, достукка умтулган;","– терең дарыядай тынч аккан, кечиримдүү, көтөрүмдүү;","– барга топук, жокко сабыр кылган;","– напсисин агытып жутунбаган;"]},{"t":"p","h":"– сокур каалоо-кумарлардын кулу болбой, өзүн өзү чектей, тизгиндей билген;"},{"t":"p","h":"– өмүрдүн маңызы жөнүндө тогуз толгонуп, тирлик кылуунун сапаты жөнүндө ойлонгон;"},{"t":"v","l":["– техниканын тилин мыкты түшүнгөн;","– өз кесибин ийне-жибине чейин билген мээнеткеч;","– үзүлгөндү улай билген, чачылганды жыйнай билген;","– экологиялык табити кылдат;","– эстетикалык табити кылдат;","– сылык-сыпаа;"]},{"t":"p","h":"– билгеним бир тогуз, биле элегим токсон тогуз деп дайыма чыгармачылык менен изденген, адамгерчиликтүү инсан (С. Байгазиев)."},{"t":"v","l":["3. Түбөлүк чечилбеген ушул талаш —","Канткенде адам уулу адам болот?","Адамзат качан чечет, качан коёт —","Канткенде адам уулу адам болот? (Ч. Айтматов)."]},{"t":"p","h":"4. «Адам болуу аста-аста, айбан болуу бир паста» дейбиз, ошол «бир пастасы» кыйын, ага ким кантип, кандайча бөгөт коет? – деп айтчу Мырзакмат аксакал."}],"sub":[{"title":"Катасын ондоп жаз","b":3},{"title":"Байытып чакан аңгеме жаз","b":11},{"title":"Сүйлөм түз","b":13},{"title":"АНТ КЫМБАТПЫ, САЛТ КЫМБАТПЫ? Дилбаян","b":16},{"title":"3. Ал эми сен үчүн кайсынысы кымбат, антпы, же салтпы?","b":20},{"title":"«ЖЕР ӘНЕ» ДИЛБАЯН ТҮРМӨГҮ","b":22},{"title":"1-дилбаян","b":25},{"title":"АМАНСЫҢБЫ, КУТТУУ ТАЛААМ? 2-дилбаян","b":28},{"title":"ТОЛГОНАЙДЫН ТАЛААСЫ 3-дилбаян","b":30},{"title":"МАЙСАЛБЕКТИН КАТЫ Дилбаян","b":32},{"title":"«ПЕЙИЛ» ДИЛБАЯНДАР ТҮРМӨГҮ","b":50},{"title":"ПЕЙИЛ КАНТИП ОҢОЛОТ? 1-дилбаян","b":54},{"title":"ЖИНДИ СУУ","b":58},{"title":"Тилге таек. 1. «Иче электе коёнсуң, ууртап алсаң ноёнсуң. Көтөрө","b":67},{"title":"КОШУНАНЫН КҮРПҮ 3-дилбаян","b":69},{"title":"КУДАЙ – БУЛ ПЕЙИЛ","b":74},{"title":"Дилбаян","b":81},{"title":"АДАМ БОЙДОН КАЛАР БЕКЕНБИЗ Дилбаян","b":83}],"section":"ЇХ КЛАСС","pages":[296,304]},{"title":"«СЕРЕКТИН СЫР САНДЫГЫ»","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"305\">305<\/span>«СЕРЕКТИН СЫР САНДЫГЫ»"},{"t":"p","h":"(ҮП-ГХ класстар үчүн)"},{"t":"p","h":"Окуучу. Мындай сандык мага эмне үчүн керек?"},{"t":"p","h":"Акыл Карачач: Билген нерсенин баары эле эсте болбойт, класстан класска көчкөндө көбү унутулуп калат. Ошондуктан мугалим тапшырма берсе да, бербесе да өз ыктыярың менен окуп, өз алдыңча билимиңди көтөрүп, керек учурунда кайталап, толуктап алууда бул сыр сандык колуңду узартат, сага ченемсиз жана үзгүлтүксүз кызмат кылат. «Серектин сыр сандыгында» 18 топтом бар. Ал тыбыштан тартып, байланыштуу кепке чейин камтыйт."},{"t":"p","h":"Көрөгөч Маамыт. Азыр тест аркылуу сыноодон кыя өтүп кете албайсың. Бул топтомдорду окуп-үйрөнүүнүн үзүрү ошол тест жүргүзүүдө көрүнөт. Сыноолорго да даяр болуп каласың."},{"t":"p","h":"Чыпалак. Ал эле эмес, бул топтомдор сага окуучулардын олимпиадаларына катышууга мүмкүндүк берет."},{"t":"p","h":"Апенди. Баары көктүгүңө, тырышчаак мээнетиңе байланыштуу. «Мойнунан байлаган ит ууга жарабайт». Билим дегениң, бул дарактын башына илинген чайнек болсо, анан аны аркан бою төмөнтөн үлпүлдөтө жагылган от менен кайнатам деш мага ылайык. Сагачы?.."},{"t":"p","h":"Серек. Биз жомоктун эле туткуну эмеспиз. Силер менен кошо жаңырып, силер менен кошо өмүр сүрүп, улам кайталанып турабыз – бизге эл-журт ушундайча тагдыр берген. Ошондуктан окуу китебине аралашып, жеңилди жерден, оорду колдон алган кызматыбызга таң калуунун деле кереги жок. Ар бир топтом – бул кыргыздын илим көчү тартып келген сыр сандык."},{"t":"p","h":"Акыл Карачач. Анда билим жана кут бар. Эмесе, сыр сандыктын капкагын ачып, силерге тартуулайбыз."}],"sub":[],"section":"ЇХ КЛАСС","pages":[305,305]},{"title":"1. «ТЫБЫШ» ТОПТОМУ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"306\">306<\/span>1. «ТЫБЫШ» ТОПТОМУ"},{"t":"img","src":"data:image/webp;base64,Uk     ['kyrgyz-adabiyat', /кыргыз адабият|кыргызская литература/, 'Кыргыз адабияты', 'Кыргызская литература'],
    ['russkiy-yazyk', /русский язык|орус тили/, 'Орус тили', 'Русский язык'],
    ['russkaya-literatura', /русская литература|литературное чтение|орус адабият/, 'Орус адабияты', 'Русская литература'],

    ['matematika', /математик|алгебр|геометр/, 'Математика', 'Математика'],
    ['fizika', /физик/, 'Физика', 'Физика'],
    ['himiya', /хими/, 'Химия', 'Химия'],
    ['biologiya', /биолог/, 'Биология', 'Биология'],
    ['geografiya', /географ/, 'География', 'География'],
    ['istoriya-kg', /кыргызстан\S* тарых|история кыргызстана/, 'Кыргызстандын тарыхы', 'История Кыргызстана'],

  function subjectOf(b) {
    var s = String(b.subject || b.title || '').toLowerCase();
    for (var i = 0; i < SUBJECTS.length; i++) {
      if (b.subject === SUBJECTS[i][0] || SUBJECTS[i][1].test(s)) return { key: SUBJECTS[i][0], order: i, name: SUBJECTS[i][S.ui === 'ky' ? 2 : 3] };
    }
    return { key: 'x:' + s, order: SUBJECTS.length, name: b.subject || b.title };

  // "My books": books the reader opened or added, stored on the phone. 1 = in the list,
  // 0 = removed by the reader. Books opened before this list existed count as added.
  function myState() { return lsGet('mybooks', null) || {}; }
  function inMy(id) { var s = myState()[id]; return s === 1 || (s !== 0 && !!lsGet('pos:' + id, null)); }
  function setMy(id, on) { var s = myState(); s[id] = on ? 1 : 0; lsSet('mybooks', s); }

  var libHash = '#/'; // where the reader's back button returns to

  function libShell(title, link, sub) {
    document.title = title;
    var school = S.school || (S.ui === 'ky' ? 'ky' : 'ru');
    app.innerHTML = '<div class="lib"><div class="lib-head"><h1>' + esc(title) + '</h1>' + link + '</div>' +
      (sub ? '<p class="sub">' + esc(t('appSub')) + '</p>' : '') +
      '<div class="school">' + SCHOOLS.map(function (o) {
        return '<button data-s="' + o[0] + '"' + (o[0] === school ? ' class="on"' : '') + '>' + esc(o[1]) + '</button>';
      }).join('') + '</div>' +
      '<div id="books"><div class="loading">' + esc(t('loading')) + '</div></div></div>';
    Array.prototype.forEach.call(app.querySelectorAll('.school button'), function (btn) {
      btn.onclick = function () {
        S.school = S.ui = btn.getAttribute('data-s'); applySettings();
        if (location.hash === '#/my') showMyBooks(); else location.hash = '#/';
      };
    });
    return school;
  }

  function loadList() {
    return fetchJSON('books/index.json').catch(function (e) {
      $('#books').innerHTML = '<div class="loading">' + esc(t('err')) + '</div>'; throw e;
    });
  }

  function showLibrary() {
    libHash = '#/';
    var school = libShell(t('appTitle'), '<a class="btn my-link" href="#/my">' + esc('★ ' + t('my')) + '</a>', true);
    loadList().then(function (list) {
      list = list.filter(function (b) { return !b.school || b.school === school; });
      var grades = [];
      list.forEach(function (b) { gradesOf(b).forEach(function (g) { if (grades.indexOf(g) < 0) grades.push(g); }); });
      grades.sort(function (a, b) { return a - b; });
      var open = lsGet('libOpen', {});
      var box = $('#books');
      box.innerHTML = grades.length ? '' : '<div class="loading">' + esc(t('noBooks')) + '</div>';
      grades.forEach(function (g) {
        var books = list.filter(function (b) { return gradesOf(b).indexOf(g) >= 0; });
        var sec = document.createElement('section'); sec.className = 'grade';
        sec.innerHTML = '<button class="grade-h"><span>' + esc(g + ' ' + t('grade')) + '</span><span class="n">' + books.length + '</span></button><div class="grade-b"></div>';
        var head = $('.grade-h', sec), body = $('.grade-b', sec);
        function setOpen(on) {
          sec.classList.toggle('open', on);
          body.innerHTML = '';
          if (on) bySubject(books, body, false);
        }
        head.onclick = function () {
          var on = !sec.classList.contains('open');
          Array.prototype.forEach.call(box.querySelectorAll('.grade.open'), function (s) { if (s !== sec) { s.classList.remove('open'); $('.grade-b', s).innerHTML = ''; } });
          setOpen(on);
          open[school] = on ? g : null; lsSet('libOpen', open);
          if (on && sec.scrollIntoView) sec.scrollIntoView({ block: 'start' });
        };
        box.appendChild(sec);
        if (open[school] === g) setOpen(true);
      });
    });
  }

  function showMyBooks() {
    libHash = '#/my';
    libShell(t('my'), '<a class="btn my-link" href="#/">' + esc('‹ ' + t('allBooks')) + '</a>', false);
    loadList().then(function (list) {
      var box = $('#books');
      var mine = list.filter(function (b) { return inMy(b.id); });
      box.innerHTML = '';
      if (!mine.length) { box.innerHTML = '<div class="loading">' + esc(t('myEmpty')) + '</div>'; return; }
      var grades = [];
      mine.forEach(function (b) { var g = gradesOf(b)[0]; if (grades.indexOf(g) < 0) grades.push(g); });
      grades.sort(function (a, b) { return (a == null ? 99 : a) - (b == null ? 99 : b); });
      grades.forEach(function (g) {
        var sec = document.createElement('section'); sec.className = 'grade open';
        sec.innerHTML = '<h2 class="grade-t">' + esc(g == null ? '' : g + ' ' + t('grade')) + '</h2><div class="grade-b"></div>';
        bySubject(mine.filter(function (b) { return gradesOf(b)[0] === g; }), $('.grade-b', sec), true);
        box.appendChild(sec);
      });
    });
  }

  // Books under subject headings; subjects without books are never shown.
  function bySubject(books, root, myView) {
    var groups = {}, keys = [];
    books.forEach(function (b) {
      var s = subjectOf(b);
      if (!groups[s.key]) { groups[s.key] = { s: s, books: [] }; keys.push(s.key); }
      groups[s.key].books.push(b);
    });
    keys.sort(function (a, b) { var x = groups[a].s, y = groups[b].s; return x.order - y.order || (x.name < y.name ? -1 : x.name > y.name ? 1 : 0); });
    keys.forEach(function (k) {
      var h = document.createElement('h3'); h.className = 'subj'; h.textContent = groups[k].s.name;
      root.appendChild(h);
      groups[k].books.forEach(function (b) { root.appendChild(bookRow(b, myView)); });
    });
  }

  // "7", 7, "7–9" or "10-11" -> [7], [7, 8, 9], [10, 11]
  function gradesOf(b) {
    var m = String(b.grade == null ? '' : b.grade).match(/(\d+)\s*[–-]\s*(\d+)|(\d+)/);
    if (!m) return [];
    if (m[3]) return [+m[3]];
    var out = []; for (var g = +m[1]; g <= +m[2]; g++) out.push(g); return out;
  }

  var LIB_ICONS = {
    star: '<svg viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>',
    dl: '<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/></svg>',
    done: '<svg viewBox="0 0 24 24"><path d="M5 20h14M7.5 11.5l3 3 6-6.5"/></svg>',
    share: IS_IOS
      ? '<svg viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M8.5 10H6.5a1.5 1.5 0 0 0-1.5 1.5v8A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-8a1.5 1.5 0 0 0-1.5-1.5h-2"/></svg>'
      : '<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.5M8.2 13.2l7.6 4.5"/></svg>'
  };

  function bookRow(b, myView) {
    var el = document.createElement('div'); el.className = 'bk';
    var hasPos = !!lsGet('pos:' + b.id, null);
    var mb = (b.size / 1048576).toFixed(1);
    var meta = [[b.author, b.year].filter(Boolean).join(', ')];
    if (gradesOf(b).length > 1) meta.push(b.grade + ' ' + t('grade'));
    if (myView && b.school) meta.push(b.school === 'ky' ? 'Кыргыз мектеби' : 'Русская школа');
    meta.push(mb + ' ' + t('mb'));
    el.innerHTML = '<div class="bk-h"><div class="bk-t">' + esc(b.title) + '</div>' +
      '<button class="icon star" aria-label="' + esc(t('my')) + '">' + LIB_ICONS.star + '</button></div>' +
      (b.subtitle ? '<div class="bk-s">' + esc(b.subtitle) + '</div>' : '') +
      '<div class="bk-m">' + esc(meta.filter(Boolean).join(' · ')) + '</div>' +
      '<div class="row"><a class="btn primary" href="#/read/' + esc(b.id) + '">' + esc(hasPos ? t('cont') : t('read')) + '</a>' +
      '<button class="icon dl"></button><button class="icon share" aria-label="' + esc(t('share')) + '">' + LIB_ICONS.share + '</button></div>' +
      '<div class="progress" hidden><i></i></div>';
    var btn = $('.dl', el), prog = $('.progress', el), bar = $('.progress i', el), star = $('.star', el);

    function setStar() { star.classList.toggle('on', inMy(b.id)); star.setAttribute('aria-pressed', inMy(b.id) ? 'true' : 'false'); }
    star.onclick = function () {
      var on = !inMy(b.id);
      setMy(b.id, on); toast(on ? t('myAdded') : t('myRemoved'));
      if (!on && myView) {
        var body = el.parentNode, sec = body.parentNode, h = el.previousElementSibling;
        body.removeChild(el);
        // drop a subject heading or grade that is now empty
        if (h && h.className === 'subj' && (!h.nextElementSibling || h.nextElementSibling.className === 'subj')) body.removeChild(h);
        if (!body.children.length) sec.parentNode.removeChild(sec);
        if (!$('.bk', app)) $('#books').innerHTML = '<div class="loading">' + esc(t('myEmpty')) + '</div>';
        return;
      }
      setStar();
    };
    setStar();

    $('.share', el).onclick = function () { shareSheet(b); };

    function setState(done) {
      btn.disabled = false;
      btn.innerHTML = done ? LIB_ICONS.done : LIB_ICONS.dl;
      btn.setAttribute('aria-label', done ? t('downloaded') : t('download'));
      btn.classList.toggle('on', done);
      btn.onclick = done ? function () { toast(t('downloaded')); if (window.confirm(t('removeAsk'))) remove(); } : download;
      prog.hidden = true;
    }
    function download() {
      if (!window.caches) { toast(t('noStorage')); return; }
      btn.disabled = true; prog.hidden = false; bar.style.width = '0'; toast(t('downloading'));
      downloadBook(b, function (f) { bar.style.width = Math.round(f * 100) + '%'; })
        .then(function () { setState(true); toast(t('dlDone')); })
        .catch(function () { setState(false); toast(navigator.onLine === false ? t('offline') : t('err')); });
    }
    function remove() {
      caches.keys().then(function (keys) {
        return Promise.all(keys.filter(function (k) { return k.indexOf('book-' + b.id + '-') === 0; }).map(function (k) { return caches.delete(k); }));
      }).then(function () { lsDel('dl:' + b.id); setState(false); toast(t('removed')); });
    }
    setState(false);
    if (window.caches) {
      caches.open(cacheName(b)).then(function (c) { return c.match('books/' + b.id + '/book.json'); })
        .then(function (r) { setState(!!r && lsGet('dl:' + b.id, null) === b.v); });
    }
    return el;
  }

  // Share a book: a link (opens the app at the book) or the single-file book, through the
  // phone's own share sheet. Without Web Share the link is copied and the file is saved.
  function shareSheet(b) {
    var name = b.title + (b.grade ? ', ' + b.grade + ' ' + t('grade') : '');
    var url = location.href.split('#')[0] + '#/read/' + b.id;
    var old = $('.sheet'); if (old) old.remove(); old = $('.sheet-bg'); if (old) old.remove();
    var bg = document.createElement('div'); bg.className = 'sheet-bg';
    var sh = document.createElement('div'); sh.className = 'sheet';
    sh.innerHTML = '<h3><span>' + esc(t('share')) + ': ' + esc(name) + '</span><button class="icon x" aria-label="' + esc(t('close')) + '">' + ICONS.close + '</button></h3>' +
      '<div class="share-opts"><button class="btn primary s-link">' + esc(t('shareLink')) + '</button>' +
      (b.standalone ? '<button class="btn s-file">' + esc(t('shareFile')) + '</button><div class="note">' + esc(t('shareFileNote')) + '</div>' : '') + '</div>';
    document.body.appendChild(bg); document.body.appendChild(sh);
    function close() { bg.remove(); sh.remove(); }
    bg.onclick = close; $('.x', sh).onclick = close;

    $('.s-link', sh).onclick = function () {
      if (navigator.share) {
        navigator.share({ title: name, text: name, url: url }).then(close, function () { /* cancelled */ });
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { toast(t('linkCopied')); close(); }, function () { window.prompt(t('shareLink'), url); });
      } else {
        window.prompt(t('shareLink'), url);
      }
    };
    var fbtn = $('.s-file', sh);
    if (!fbtn) return;
    var file = null;
    function save() {
      var a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove(); toast(t('fileSaved')); close();
    }
    function send() {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: name }).then(close, function (e) {
          // the tap "expired" while the file was loading: one more tap sends it
          if (e && e.name === 'NotAllowedError') { fbtn.disabled = false; fbtn.textContent = t('fileReady'); fbtn.classList.add('primary'); }
        });
      } else save();
    }
    fbtn.onclick = function () {
      if (file) return send();
      fbtn.disabled = true; fbtn.textContent = t('preparing');
      fetch('books/' + b.id + '/' + b.standalone).then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
        .then(function (blob) {
          file = new File([blob], b.standalone, { type: 'text/html' });
          fbtn.disabled = false; fbtn.textContent = t('shareFile');
          send();
        })
        .catch(function () { fbtn.disabled = false; fbtn.textContent = t('shareFile'); toast(navigator.onLine === false ? t('offline') : t('err')); });
    };
  }

  function downloadBook(b, onProgress) {
    var base = 'books/' + b.id + '/';
    var cache;
    return caches.open(cacheName(b)).then(function (c) {
      cache = c;
      return fetch(base + 'book.json');
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return cache.put(base + 'book.json', r.clone()).then(function () { return r.json(); });
    }).then(function (book) {
      // app shell too, in case the service worker has not finished installing yet
      var urls = ['./', 'index.html', 'app.js', 'style.css', 'books/index.json'].concat(book.images.map(function (i) { return base + i; }));
      var done = 0;
      // a few requests in parallel: fast on 3G, gentle on slow phones
      var queue = urls.slice();
      function worker() {
        var u = queue.shift();
        if (!u) return Promise.resolve();
        return cache.match(u).then(function (hit) {
          if (hit) return;
          return fetch(u).then(function (r) { if (!r.ok) throw new Error(u); return cache.put(u, r); });
        }).then(function () { done++; onProgress(done / urls.length); return worker(); });
      }
      return Promise.all([worker(), worker(), worker(), worker()]);
    }).then(function () {
      lsSet('dl:' + b.id, b.v);
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      return caches.keys().then(function (keys) { // drop older versions of this book
        return Promise.all(keys.filter(function (k) { return k.indexOf('book-' + b.id + '-') === 0 && k !== cacheName(b); }).map(function (k) { return caches.delete(k); }));
      });
    });
  }

  // ================================================================ READER
  var ICONS = {
    back: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
    toc: '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
    set: '<svg viewBox="0 0 24 24"><path d="M4 20l5-14h2l5 14M6.5 14h7"/><path d="M17 11l2.5-6L22 11M17.8 9h3.4"/></svg>',
    close: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };

  function openReader(id) {
    app.innerHTML = '<div class="loading">' + esc(t('loading')) + '</div>';
    if (!EMB) setMy(id, true);
    var p = EMB ? Promise.resolve(EMB) : fetchJSON('books/' + id + '/book.json');
    p.then(function (book) { startReader(book, EMB ? '' : 'books/' + id + '/'); })
      .catch(function () {
        app.innerHTML = '<div class="lib"><p class="loading">' + esc(navigator.onLine === false ? t('offline') : t('err')) +
          '</p><p style="text-align:center"><a class="btn" href="' + libHash + '">' + esc(t('back')) + '</a></p></div>';
      });
  }

  function startReader(book, base) {
    document.title = book.title;
    var chapters = book.chapters;
    var posKey = 'pos:' + book.id;

    app.innerHTML =
      '<div class="reader">' +
      '<div class="viewport"><div class="flow" lang="' + esc(book.lang) + '"></div></div>' +
      '<div class="foot"><span class="t"></span><span class="n"></span></div>' +
      '<div class="bar top">' + (EMB ? '' : '<a class="icon" href="' + libHash + '" aria-label="' + esc(t('back')) + '">' + ICONS.back + '</a>') +
      '<div class="title">' + esc(book.title) + '</div>' +
      '<button class="icon b-toc" aria-label="' + esc(t('contents')) + '">' + ICONS.toc + '</button>' +
      '<button class="icon b-set" aria-label="' + esc(t('settings')) + '">' + ICONS.set + '</button></div>' +
      '<div class="bar bottom"><div class="info"><span class="i1"></span><span class="i2"></span></div>' +
      '<input type="range" class="slider" min="0" max="1" step="1"></div>' +
      '</div>';

    var reader = $('.reader'), vp = $('.viewport'), flow = $('.flow'), footT = $('.foot .t'), footN = $('.foot .n');
    var slider = $('.slider'), i1 = $('.bar .i1'), i2 = $('.bar .i2');

    // original textbook page numbers -> chapter, for "go to page" and the slider
    var pgChapter = {}, pgList = [];
    chapters.forEach(function (c, ci) {
      c.blocks.forEach(function (b) {
        var html = b.h || (b.l ? b.l.join(' ') : '');
        var re = /data-n="(\d+)"/g, m;
        while ((m = re.exec(html))) { var n = +m[1]; if (!(n in pgChapter)) { pgChapter[n] = ci; pgList.push(n); } }
      });
    });
    pgList.sort(function (a, b) { return a - b; });
    if (pgList.length) { slider.min = 0; slider.max = pgList.length - 1; }

    var ch = -1, page = 0, pages = 1, step = 0, colW = 0, H = 0;
    var blockPage = [], pgMarks = []; // [{n, page}]

    function src(s) { return /^data:/.test(s) ? s : base + s; }

    function blockHTML(b, i) {
      var a = ' data-i="' + i + '"';
      switch (b.t) {
        case 'h1': case 'h2': case 'h3': return '<' + b.t + a + '>' + b.h + '</' + b.t + '>';
        case 'p': return '<p' + a + (b.ni ? ' class="ni"' : '') + '>' + b.h + '</p>';
        case 'box': return '<div class="box"' + a + '>' + b.h + '</div>';
        case 'raw': return b.h.replace(/^<(\w+)/, '<$1' + a).replace(/src="img\//g, 'src="' + base + 'img/');
        case 'v': return '<div class="verse"' + a + '>' + b.l.map(function (l) { return l === '' ? '<div class="gap"></div>' : '<div>' + l + '</div>'; }).join('') + '</div>';
        case 'img': return '<figure' + a + '><img data-w="' + b.w + '" data-h="' + b.ht + '"' + (b.dw ? ' style="width:' + b.dw + 'em"' : '') + ' src="' + esc(src(b.src)) + '" alt="' + esc(b.alt || '') + '">' +
          (b.cap ? '<figcaption>' + b.cap + '</figcaption>' : '') + '</figure>';
      }
      return '';
    }

    function renderChapter(ci) {
      ch = ci;
      var c = chapters[ci];
      var html = c.blocks.map(blockHTML).join('');
      if (ci === chapters.length - 1) html += '<div class="endnote">— ' + esc(t('end')) + ' —<br>' + esc(t('source')) + ': ' + esc(book.source && book.source.site || '') + '</div>';
      flow.innerHTML = html + '<div class="end"></div>';
      layout();
    }

    function layout() {
      var W = vp.clientWidth; H = vp.clientHeight;
      var pad = Math.max(18, Math.round((W - 680) / 2));
      colW = W - 2 * pad; step = W;
      flow.style.width = colW + 'px';
      flow.style.marginLeft = pad + 'px';
      flow.style.columnWidth = colW + 'px';
      flow.style.columnGap = (2 * pad) + 'px';
      // size images explicitly so pages do not shift when pictures load
      var maxH = H - 32 - 3 * S.fs;
      Array.prototype.forEach.call(flow.querySelectorAll('img[data-w]'), function (img) {
        var w = +img.getAttribute('data-w'), h = +img.getAttribute('data-h');
        var dw = Math.min(colW, maxH * w / h, w * 1.6);
        img.style.width = Math.round(dw) + 'px'; img.style.height = Math.round(dw * h / w) + 'px';
      });
      var fr = flow.getBoundingClientRect();
      var endEl = flow.lastChild;
      pages = Math.max(1, Math.floor((endEl.getBoundingClientRect().left - fr.left + 2) / step) + 1);
      blockPage = [];
      Array.prototype.forEach.call(flow.querySelectorAll('[data-i]'), function (el) {
        blockPage[+el.getAttribute('data-i')] = Math.floor((el.getBoundingClientRect().left - fr.left + 2) / step);
      });
      pgMarks = Array.prototype.map.call(flow.querySelectorAll('.pg'), function (el) {
        return { n: +el.getAttribute('data-n'), page: Math.floor((el.getBoundingClientRect().left - fr.left + 2) / step) };
      });
    }

    function curBlock() {
      var b = 0;
      for (var i = 0; i < blockPage.length; i++) { if (blockPage[i] != null && blockPage[i] <= page) b = i; else if (blockPage[i] > page) break; }
      return b;
    }
    function bookPage() { // textbook page shown at top of this screen
      var n = null;
      for (var i = 0; i < pgMarks.length; i++) { if (pgMarks[i].page <= page) n = pgMarks[i].n; else break; }
      if (n == null) { // before first marker of this chapter: previous chapter's last page
        for (var j = pgList.length - 1; j >= 0; j--) if (pgChapter[pgList[j]] < ch) { n = pgList[j]; break; }
      }
      return n == null ? (pgMarks[0] ? pgMarks[0].n : null) : n;
    }

    function show(p, anim) {
      page = Math.max(0, Math.min(pages - 1, p));
      flow.classList.toggle('anim', !!anim);
      flow.style.transform = 'translate3d(' + (-page * step) + 'px,0,0)';
      var bp = bookPage();
      footT.textContent = chapters[ch].title;
      footN.textContent = (bp != null ? t('page') + ' ' + bp + ' · ' : '') + (page + 1) + '/' + pages;
      i1.textContent = chapters[ch].title;
      i2.textContent = bp != null ? t('page') + ' ' + bp + ' / ' + pgList[pgList.length - 1] : '';
      if (bp != null && document.activeElement !== slider) slider.value = pgList.indexOf(bp);
      lsSet(posKey, { ch: ch, b: curBlock(), at: Date.now() });
    }

    function goBlock(ci, bi) {
      if (ci !== ch) renderChapter(ci);
      show(blockPage[bi] || 0, false);
    }
    function goBookPage(n) {
      if (!(n in pgChapter)) { toast(t('notFound')); return false; }
      if (pgChapter[n] !== ch) renderChapter(pgChapter[n]);
      for (var i = 0; i < pgMarks.length; i++) if (pgMarks[i].n === n) { show(pgMarks[i].page, false); return true; }
      show(0, false); return true;
    }
    function next() {
      if (page < pages - 1) show(page + 1, true);
      else if (ch < chapters.length - 1) { renderChapter(ch + 1); show(0, false); }
      else show(page, true);
    }
    function prev() {
      if (page > 0) show(page - 1, true);
      else if (ch > 0) { renderChapter(ch - 1); show(pages - 1, false); }
      else show(0, true);
    }
    function relayout() { var b = curBlock(); layout(); show(blockPage[b] || 0, false); }

    // ---- touch: swipe to turn pages
    var sx = 0, sy = 0, st = 0, dx = 0, horiz = null, touching = false;
    vp.addEventListener('touchstart', function (e) {
      if (e.touches.length > 1) { touching = false; return; }
      touching = true; horiz = null; dx = 0;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
      flow.classList.remove('anim');
    }, { passive: true });
    vp.addEventListener('touchmove', function (e) {
      if (!touching) return;
      var x = e.touches[0].clientX, y = e.touches[0].clientY;
      dx = x - sx;
      if (horiz === null && (Math.abs(dx) > 8 || Math.abs(y - sy) > 8)) horiz = Math.abs(dx) > Math.abs(y - sy);
      if (horiz) {
        e.preventDefault();
        var atEdge = (dx > 0 && page === 0 && ch === 0) || (dx < 0 && page === pages - 1 && ch === chapters.length - 1);
        flow.style.transform = 'translate3d(' + (-page * step + dx * (atEdge ? 0.25 : 1)) + 'px,0,0)';
      }
    }, { passive: false });
    vp.addEventListener('touchend', function () {
      if (!touching) return; touching = false;
      if (!horiz) return;
      var v = Math.abs(dx) / Math.max(1, Date.now() - st);
      if (dx < -60 || (dx < -20 && v > 0.3)) next();
      else if (dx > 60 || (dx > 20 && v > 0.3)) prev();
      else show(page, true);
    });

    // ---- taps: left third back, right third forward, middle shows menus
    vp.addEventListener('click', function (e) {
      var sel = window.getSelection && String(window.getSelection());
      if (sel) return;
      if (reader.classList.contains('ui')) { reader.classList.remove('ui'); return; }
      var x = e.clientX / vp.clientWidth;
      if (x < 0.3) prev(); else if (x > 0.7) next();
      else if (e.target.tagName === 'IMG' && e.target.closest('figure')) openZoom(e.target);
      else if (e.target.closest && e.target.closest('figure svg')) {
        var sv = e.target.closest('figure svg'), vb = (sv.getAttribute('viewBox') || '0 0 300 150').split(/\s+/);
        var im = document.createElement('img');
        im.setAttribute('data-w', Math.round(vb[2] * 4)); im.setAttribute('data-h', Math.round(vb[3] * 4));
        var xml = sv.outerHTML.indexOf('xmlns=') < 0 ? sv.outerHTML.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"') : sv.outerHTML;
        im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml.replace(/style="[^"]*"/, ''));
        openZoom(im);
      }
      else reader.classList.add('ui');
    });
    // ---- picture viewer: tap a picture to see it full screen; tap again to enlarge, scroll to move
    function openZoom(img) {
      var z = document.createElement('div'); z.className = 'zoom';
      var big = false;
      z.innerHTML = '<div class="zoom-in"><img alt=""></div><button class="icon zoom-x" aria-label="' + esc(t('close')) + '">' + ICONS.close + '</button>';
      var zi = $('img', z); zi.src = img.src;
      var fit = function () {
        var W = window.innerWidth, H = window.innerHeight, w = +img.getAttribute('data-w'), h = +img.getAttribute('data-h');
        var s = Math.min(W / w, H / h) * (big ? 2.5 : 1);
        zi.style.width = Math.round(w * s) + 'px'; zi.style.height = 'auto'; zi.style.maxWidth = 'none'; zi.style.maxHeight = 'none';
      };
      zi.onclick = function (e) {
        var inr = $('.zoom-in', z), r = zi.getBoundingClientRect();
        var fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
        big = !big; fit();
        if (big) { inr.scrollLeft = fx * zi.offsetWidth - window.innerWidth / 2; inr.scrollTop = fy * zi.offsetHeight - window.innerHeight / 2; }
      };
      $('.zoom-x', z).onclick = function () { z.remove(); document.removeEventListener('keydown', zkey); };
      var zkey = function (e) { if (e.key === 'Escape') { z.remove(); document.removeEventListener('keydown', zkey); } };
      document.addEventListener('keydown', zkey);
      document.body.appendChild(z); fit();
    }

    function onKey(e) {
      if ($('.zoom')) return;
      if ($('.sheet')) { if (e.key === 'Escape') closeSheet(); return; }
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    }
    document.addEventListener('keydown', onKey);
    var rt; function onResize() { clearTimeout(rt); rt = setTimeout(relayout, 150); }
    window.addEventListener('resize', onResize);
    // wheel on desktop
    var wheelLock = 0;
    vp.addEventListener('wheel', function (e) {
      var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(d) < 20 || Date.now() < wheelLock) return;
      wheelLock = Date.now() + 350; if (d > 0) next(); else prev();
    }, { passive: true });

    slider.addEventListener('input', function () { i2.textContent = t('page') + ' ' + pgList[+slider.value] + ' / ' + pgList[pgList.length - 1]; });
    slider.addEventListener('change', function () { goBookPage(pgList[+slider.value]); });

    // ---- sheets
    function closeSheet() { var a = $('.sheet'), b = $('.sheet-bg'); if (a) a.remove(); if (b) b.remove(); }
    function openSheet(html) {
      closeSheet();
      var bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.onclick = closeSheet;
      var sh = document.createElement('div'); sh.className = 'sheet'; sh.innerHTML = html;
      document.body.appendChild(bg); document.body.appendChild(sh);
      return sh;
    }

    $('.b-toc').onclick = function () {
      var html = '<h3>' + esc(t('contents')) + '</h3>' +
        '<div class="goto"><input type="number" inputmode="numeric" placeholder="' + esc(t('gotoPage')) + '"><button class="btn primary">' + esc(t('go')) + '</button></div><div class="toc">';
      var lastSec = null;
      chapters.forEach(function (c, ci) {
        if (c.section && c.section !== lastSec) html += '<div class="sec">' + esc(c.section) + '</div>';
        lastSec = c.section || lastSec;
        html += '<a href="#" data-c="' + ci + '" data-b="0"' + (ci === ch ? ' class="cur"' : '') + '>' + esc(c.title) +
          (c.pages ? '<span class="p">' + c.pages[0] + '</span>' : '') + '</a>';
        if (c.sub) {
          c.sub.forEach(function (s) {
            if (s.b != null) html += '<a href="#" class="sub" data-c="' + ci + '" data-b="' + s.b + '">' + esc(s.title) + '</a>';
          });
        } else {
          c.blocks.forEach(function (b, bi) {
            if (b.t === 'h2' && bi > 0) html += '<a href="#" class="sub" data-c="' + ci + '" data-b="' + bi + '">' + b.h.replace(/<[^>]+>/g, '') + '</a>';
          });
        }
      });
      var sh = openSheet(html + '</div>');
      var cur = $('.cur', sh); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'center' });
      sh.addEventListener('click', function (e) {
        var a = e.target.closest('a[data-c]'); if (!a) return;
        e.preventDefault(); closeSheet(); reader.classList.remove('ui');
        goBlock(+a.getAttribute('data-c'), +a.getAttribute('data-b'));
      });
      var inp = $('input', sh);
      function go() { if (goBookPage(parseInt(inp.value, 10))) { closeSheet(); reader.classList.remove('ui'); } }
      $('.goto button', sh).onclick = go;
      inp.onkeydown = function (e) { if (e.key === 'Enter') go(); };
    };

    $('.b-set').onclick = function () {
      function seg(key, opts) {
        return '<div class="seg" data-k="' + key + '">' + opts.map(function (o) {
          return '<button data-v="' + o[0] + '"' + (o[2] ? ' class="' + o[2] + (String(S[key]) === String(o[0]) ? ' on' : '') + '"' : (String(S[key]) === String(o[0]) ? ' class="on"' : '')) + '>' + o[1] + '</button>';
        }).join('') + '</div>';
      }
      var sh = openSheet(
        '<h3>' + esc(t('settings')) + '</h3>' +
        '<div class="set"><label>' + esc(t('fontSize')) + '</label><div class="seg"><button data-fs="-2" style="font-size:14px">A−</button><button class="fsv" disabled>' + S.fs + '</button><button data-fs="2" style="font-size:20px">A+</button></div></div>' +
        '<div class="set"><label>' + esc(t('theme')) + '</label>' + seg('theme', [['light', t('light'), 'swatch'], ['sepia', t('sepia'), 'swatch'], ['dark', t('dark'), 'swatch'], ['contrast', t('contrast'), 'swatch']]) + '</div>' +
        '<div class="set"><label>' + esc(t('font')) + '</label>' + seg('font', [['serif', '<span style="font-family:Georgia,serif">' + esc(t('serif')) + '</span>'], ['sans', '<span style="font-family:Roboto,Arial,sans-serif">' + esc(t('sans')) + '</span>']]) + '</div>' +
        '<div class="set"><label>' + esc(t('spacing')) + '</label>' + seg('lh', [[1.35, '1.35'], [1.55, '1.55'], [1.8, '1.8']]) + '</div>' +
        '<div class="set"><label>' + esc(t('lang')) + '</label>' + seg('ui', [['ru', 'Русский'], ['ky', 'Кыргызча']]) + '</div>');
      sh.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.hasAttribute('data-fs')) {
          S.fs = Math.max(13, Math.min(34, S.fs + +b.getAttribute('data-fs')));
          $('.fsv', sh).textContent = S.fs;
        } else {
          var k = b.parentNode.getAttribute('data-k'); if (!k) return;
          var v = b.getAttribute('data-v'); S[k] = k === 'lh' ? +v : v;
          Array.prototype.forEach.call(b.parentNode.children, function (x) { x.classList.toggle('on', x === b); });
          if (k === 'ui') { applySettings(); closeSheet(); route(); return; }
        }
        applySettings(); relayout();
      });
    };

    cleanup = function () {
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('resize', onResize);
      closeSheet();
    };

    var pos = lsGet(posKey, null);
    if (pos && chapters[pos.ch]) goBlock(pos.ch, pos.b || 0); else { renderChapter(0); show(0, false); }
    // fonts can change metrics after first paint
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  }

  // ---------------------------------------------------------------- boot
  applySettings();
  window.addEventListener('hashchange', route);
  route();
  if (!EMB && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline support unavailable */ });
  }
})();
</script>
</body>
</html>

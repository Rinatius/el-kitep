-Көл тууралуу айтканы», «Санат, насыят, терме ырлары» эл оозунан жыйналып алынган. Бул чыгармаларында акыр заман идеясы терең берилет, Ошондой эле санат, насыят, терме, адамдын адепсиз жүрүш-турушун сындаган, жаштарды адептүүлүккө чакырган саптары да арбын. Калыгулдун «шайыры болбой эл болбойт, пейили жакшы кем болбойт» деген санаты биз үчүн классикалык саптар болуп калды. «Өзөндүү сууга тал бүтөт, өлбөгөн кулга мал бүтөт» деген анын сөзү бизге ылакап болуп калды."},{"t":"p","h":"Калыгулдун 248 саптан турган насыят-санат ырларынан: Кызаргандын баарысы,"},{"t":"v","l":["Манат болот турбайбы.","Кылган иштин баарысы,","Адат болот турбайбы.","Ырдагандын баарысы,","Санат болот турбайбы.","","Түшүндүрмө сөздүк:","1. алым – тантык деген мааниде","2. аят – курандын бөлүмдөрү","Ы Акыр заман» казалынан:","Акыр заман адамы,","Алым болот деп айткан.","Аяттын сөзүн бек тутпай,","Залым болот деп айткан.","Аганын тилин ини албай,","Чагым болот деп айткан.","Биринин тилин бири албай,","Жайыл болот деп айткан.","","3. жайыл —- чачыранды","4. залым – ыймансыз"]}],"sub":[{"title":"КАЛЫГУЛ БАЙ УУЛУ","b":28}],"section":"ПТ ЧЕЙРЕК","pages":[123,124]},{"title":"[У ЧЕЙРЕК $ 7З. Сүйлөмдүн баш мүчөлөрүн кайталоо — Повторение главных членов предложения","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"125\">125<\/span>[У ЧЕЙРЕК $ 7З. Сүйлөмдүн баш мүчөлөрүн кайталоо — Повторение главных членов предложения"},{"t":"p","h":"Ь Эске тушургуле: – Вспомните:"},{"t":"p","h":"1. Баш мучелер деген эмне?"},{"t":"p","h":"2. Ээ, баяндооч кандай суроолорго жооп берет?"},{"t":"p","h":"З. Баш мүчөлөр түзүлүшү боюнча кандай бөлүнөт?"},{"t":"p","h":"4. Баш мүчөлөрдүн кызматын кайсы сөз түркүмдөрү аткарат?"},{"t":"p","h":"5. Кыргыз жана орус тилдеринде ээ менен баяндооч кандай ээрчишет?"},{"t":"p","h":"– Что такое главные члены предложения?"},{"t":"p","h":"– На какие вопросы отвечают подлежащее и сказуемое?"},{"t":"p","h":"– Как классифицируются главные члены по составу?"},{"t":"p","h":"– Чем выражаются гла  болгон?"},{"t":"v","l":["2. Эмне себептен ал Асан Кайгы атка конгон?","3. Ал кайсы кылымда жашаганы болжолдонот?","4. Асан Кайгынын максаты эмне эле?","5. Ал жашоонун кандай жолун издеген?","6. Анын замандаштары кимдер болгон?","7. Берилген үзүндүдө эмнелер жөнүндө айтылат?"]},{"t":"p","h":"253. Төмөнкү берилген сөздөрдүн синонимин тексттен тапкыла."},{"t":"p","h":"1. күйүт, сарсанаа, санаа —"},{"t":"v","l":["2. кеменгер, көсөм, даанышман, билгич, билерман","3. кайгы, убайым —","4. көздөн учуу —","5. камкор, камбыл, сактай билген —","6. ыңгайлуу, ылайыктуу, ыктуу —","Т. тынчтык, жайчылык -","8. курдаш, теңтуш, кесиптеш —"]},{"t":"p","h":"кеттин мазмунунан 1) ким? кимдер? эмне? эмнелер? 2) эмне мне кылган? эмне болот? – деген суроолорго жооп берүүчү сөздөрдү өз-өзүнчө топтоп жазып, алар сүйлөмдүн ээ, баяндоочу боло тургандыгын жана алардын кызматын кайсы сөз түркүмдөрү аткарып жаткандыгын аныктагыла."},{"t":"p","h":"Улгу: Ким? – Асан Кайгы (зат атооч)."},{"t":"p","h":"Эмне кылган? – муңдап, зарлап жүргөн (этиштик). г] 1. Асан Кайгынын сөзүнөн берилген үзүндүнү жаттап келгиле."},{"t":"p","h":"2. Асан Кайгынын жан-жаныбарларга болгон боорукердигин сүрөттөп бергиле,"}],"sub":[{"title":"АСАН КАЙГЫ","b":12}],"section":"ПТ ЧЕЙРЕК","pages":[125,126]},{"title":"§ 74. Баяндоочтун түрлөрү – Виды сказуемого","blocks":[{"t":"h3","h":"§ 74. Баяндоочтун түрлөрү – Виды сказуемого"},{"t":"p","h":"Баяндооч этиштик жана атоочтук баяндооч болуп бөлүнөт."},{"t":"p","h":"Сказуемое бывает глагольным и именным."},{"t":"v","l":["<span class=\"pg\" data-n=\"127\">127<\/span>Сүйлөмдө баяндооч этиш","сөздөрдөн болсо, ал этиштик","баяндооч деп аталат.","Если сказуемое выражено"]},{"t":"p","h":"глаголом, оно называется глагольным."},{"t":"p","h":"Мисалы: Биз мектепке кирдик. Айганыш кыргыз тилинен экзамен берди."},{"t":"p","h":"Сүйлөмдө баяндооч атооч сөздөрдөн (зат атооч, сын атооч ж.б.) болсо, атоочтук баяндооч деп аталат."},{"t":"p","h":"Если сказуемое выражено именем существительным, прилагательным и др., оно называется именным."},{"t":"p","h":"М исал ы: Өнөр алды – кызыл тил. Баяндоочу кызыл тилзат атооч."},{"t":"v","l":["Биздин өлкө тоолуу. Баяндоочу тоолуу-сын атооч.","255. Сүйлөмдөрдү көчүрүп жазып, баяндоочторду тапкыла,"]},{"t":"p","h":"1. Кыял апасына ар дайым жардам берет. 2. Кыргызстандагы чет элдик волонтёрлор кыргыз тилин окуп-үйрөнүп жатышат."},{"t":"p","h":"3. Толкуп жаткан Ысык-Көл. 4. Сабыр деген менмин. 5. Анын кыйырма бештерде. 6. Менин адабий китептерим кызыктуу."},{"t":"p","h":"Берилген сүйлөмдөрдү маанисине жакындаштырып өзгөртүп аяндоочтордун астын сызгыла, Ү лгү: Менин атам ий курат. Менин атам куруучу."},{"t":"p","h":"1. Апам кийим тигет. 2. Агам институтта окуйт. 3. Иним мектепте окуйт. 4. Эжем жалаң «бешке» окуйт. 5. Мен мектепте иштеймин."},{"t":"v","l":["Сүйлөшөбүз:-Поговорим:","Сен азыр кайда барасың?"]},{"t":"p","h":"Мен азыр китепканага ба-"},{"t":"v","l":["рамын.","Сен эртең кечинде кайда","барасың?","Эртең кечинде мен циркке","барамын.","Сен дем алыш күнү кайда","болосуң?","Дем алыш күнү мен көлгө","барамын."]},{"t":"p","h":"– Куда ты пойдешь сейчас?"},{"t":"p","h":"– Я сейчас пойду в библиотеку."},{"t":"p","h":"– Куда ты пойдешь завтра вечером?"},{"t":"p","h":"– Завтра вечером я пойду в цирк."},{"t":"p","h":"– Где ты будешь в выходной день?"},{"t":"p","h":"– В выходной день я поеду на озеро."},{"t":"p","h":"<span class=\"pg\" data-n=\"128\">128<\/span>257. Төмөнкү сүйлөмдөрдүн баяндоочун түрлөрүнө карай бөлүп жазгыла,"},{"t":"p","h":"1. Акыл – тозбочу тон, илим – түгөнбөгөн кен. 2. И. Арабаев атындагы илимий-коомдук сыйлык уюштурулган. 3. Акылдуунун сезу- кыска, айта салса – нуска. 4. Саякатчылар Түндүк уюлга жетүүгө аракет кылышкан. 5. Келе жаткандар – бешөө. 6. Кыргыздын ак карлуу Ала-Тоосу – ушул. 7. Бүгүнкү күндө туризм тездик менен өнүгүүдө. 8. Бруно Жордано көп жылдар бою Италия, Франция, Англия, Германияны кыдырган. 9, Жокко суу да жок. 10. Алты жерде алты – отуз алты."},{"t":"p","h":"а) этиштик баяндооч:"},{"t":"v","l":["уюштурулган,","б) атоочтук баяндооч:","тон, кен,","Баяндоочтун түрлөрүнө карай төрт сүйлөм түзүп келгиле."]}],"sub":[],"section":"ПТ ЧЕЙРЕК","pages":[127,128]},{"title":"§ 75. Этиштик баяндооч – Глагольное сказуемое","blocks":[{"t":"h3","h":"§ 75. Этиштик баяндооч – Глагольное сказуемое"},{"t":"p","h":"Кыргыз тилинде баяндооч демейде сүйлөмдүн аягында колдонулат жана көпчүлүк учурда анын милдетин этиш аткарат."},{"t":"p","h":"Эгерде сүйлөмдө ээнин милдетин 1-жактагы (мен, биз) же, 2-жактагы (сен силер, сиз, сиздер) жактама ат атоочтор аткарып турса, анда баяндоочко тиешелүү жак мүчөлөрү жалганат."},{"t":"p","h":"Сказуемое в кыргызском языке обычно стоит в конце предложения и выражается чаще всего глаголом,"},{"t":"p","h":"Если в предложении подлежащее-личное местоимение 1-го лица мен (я), биз (мы) или 2-го сен (ты), силер (Вы), сиздер (вы), то сказуемое соответственно принимает личное окончание глагола."},{"t":"p","h":"М исалы: Мен окуучумун. Биз окуучубуз. Сен окуучусуң. Силер окуучусуңар. Сиз мугалимсиз. Сиздер мугалимсиздер. Мен жазып жатамын. Сен окуп жатасың. Биз жазып жатабыз. Мен улуумун. Сен кичцисцн."},{"t":"p","h":"Этиштик баяндоочтун милдетин этиштин бардык жакталуучу формалары аткарат."},{"t":"p","h":"Глагольное сказуемое выражается всеми спрягаемыми формами глагола."},{"t":"p","h":"М исалы: 1. Мен жетинчи класста окуп жатамын."},{"t":"p","h":"2. Биз аларды кечээ көргөнбүз."},{"t":"p","h":"3. Мага кызыктуу жомок айтып бересиң."},{"t":"p","h":"4. Эмгекчил адамды эл баалайт."},{"t":"p","h":"5. Алардан көп окумуштуулар чыгышты."},{"t":"p","h":"<span class=\"pg\" data-n=\"129\">129<\/span>258. Төмөнкү этиштик баяндоочторду катыштырып, сүйлөм түзгүлө."},{"t":"p","h":"1. Даярданып жатышат, көрүштү, келип калышар, ырдап жатты, баалайт, тарбияланууда, окуйбуз, сүйлөй баштайт, иштеп жүрөт, жаздым."},{"t":"p","h":"259. Көп чекиттин ордуна тиешелүү баяндоочторду жазгыла, 1. Бөбөктөр үчүн жаңы жомоктор телеберүүдөн 2. Ибн Сина шакирттерин дарыгерлик өнөрг именное сказуемое, в отличие от русского, принимает личные окончания 1-го и 2-го лица."},{"t":"p","h":"М исалы: Мен чет тилдер факультетинин студентимин. Сен 7-класстын окуучусусун. Бишкек шаары – Кыргызстандын борбору. Биздин жерибиз өтө кооз. Чынгыз тартиптүү, сылык, Менин бөбөгүм жетиде. Токтогул деген акын – ошол."},{"t":"p","h":"261. Көп чекиттин ордуна тиешелүү мүчөлөрдү коюп, сүйлөмдөрдү көчүрүп жазгыла, 1, Мен спортсмен.... 2. Сиз сүйүктүү мугалим.... 3. Силер бир тууган.... 4. Биз ынтымактуу достор.... 5. Сен жыйырма беште...."},{"t":"p","h":"6. Мен Мөөржандан улуу...."},{"t":"p","h":"262. Берилген суроолорго жооп бергиле. Атоочтук баяндоочторду аныктагыла."},{"t":"v","l":["1. Силердин класс жетекчинер ким?","2. Окуу бөлмөңөр канчанчы?","3. Сиздин кесиптешиңизби ошол?","4. Анын атасы канчада?","5. Сенин атың ким?","6. Ысык-Көл – ушулбу?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"131\">131<\/span>263. Текстти окугула, анын мазмуну боюнча ой жүгүрткүлө."},{"t":"h3","h":"РАЙКАН ШҮКҮРБЕКОВ"},{"t":"img","src":"data:image/webp;base64,UklGRrwSAABXRUJQVlA4ILASAACw2ACdASpsAcABPrVSn0mnNa2or/RKcrAWiWktghP1L0AdAzv2NxK8nPCjIT8fv/ZFY3xQv/195f/j8d/kZH82l9+GUfmB//vUGn0ztEpHzsLTk3G0iTm5Esh+EEKVt0W5RM8T5L9f5ZK/yPX6zauZARavmhcghQWa06Tye65uGLOGxKL5jtwfnyCAOVaIkWYfhUG1vIoD9GcqeSitIpNKeDTRWP8VmQlnWRQtEiI5LnqHf642Evo1U0dqqIWQY2B41RraBQyUYtTOrjaH4okUR42m0om5lsuAQfq2jzt2PPbVdERLcAvDSNB0MEtZxr0oR4YmNq3ejaVa6s74mQvYkO1ocO88AswWp6uOdK63+ayj9xPa3ipTbkwTcY0RCx9ivnq05g4kuLdJZn94Sap9SBIeOLTFMzyOynPlameqyWXgSebpCQRNTcdIyrEZIf7QWhxXWujw5lNAl1ATV3XkOnfrtCBeD4A/0R3qP9PEZd4yWB+XIcckABDPn8C1uxiD8RpQB9MKEeGlKX+DzK8CK1huVAMnJ6Fzm0viM1p4bcDFtNqPOKTL7jLRSAscX+Eo9hP+3uK9Dl+Y1Mu4qPVQG9YfCdx9DMz+E8O5kXb1WUkemwTVhgVBqUhLh4U/pN+MFitHyXIKsimMAUOi30yqCABkymFyMgM+w6mJR3oVqZ6Bfu0reMVB5/MqqOKkknVZfjpD4Kgggc1eSsZuFrH6DtvDeuCSXpM8G6wDXTqqZ1iHLsKkgAU/Ie0GwAMSJanYP+SQhT6TSVsjn1j5YjH2hT09sqqMOtuQ0vk68uGp+iv1rIRXK1SGzi+qAq07FzAUW619vi1ri9sZpbu+pMCvJtF4JB7wY9h/pHSPZzcAg5zdPBt0BoKXXOM5Ae02PwWuZu4zEadDmNPQN0z3lv70Y балдарга айтаар жомогу көп эле. Жомокторун ыр түрүндө айтчу. Анын «Эки бөжөк» деген жомогу мындайча башталат:"},{"t":"v","l":["Адырлуу тоонун ары жагында,","Ала-Тоонун бери жагында,","Калың чийдин арасында,","Кең сары Чүйдүн талаасында,","Коён тууган экен баласын коён бойдон..."]},{"t":"p","h":"Эскертүү: Балдарга арнап жазган: «Иттин жомогу», «Аңгемелер», «Карга», «Түлкү менен Теке» деген китептерин да окуп чыккыла."},{"t":"p","h":"знаменитый төкмө акын – акын-импрови-"},{"t":"v","l":["затор","эстен чыккыс – незабываемый","калеми курч – у него острое","перо"]},{"t":"p","h":"накыл сөз – мудрое слово тамсил – басня чий-чий (высокая жёсткая степная трава, стебли которой идут на изготовление циновок) Жогорку сез жана сез айкаштары менен берилген суйлемдерду то ыла. Сүйлөмдөрдүн ээ, баяндоочторун тапкыла,"},{"t":"p","h":"1. Р. Шүкүрбеков балдар үчүн ... чыгармаларды жазып калтырган. 2. Ал... менен бирге жүргөн. 8. Райкан Шүкүрбеков замандаштарынын ... көп уккан. 4. Р. Шүкүрбеков ... жазуучу болгон. 5. Калың ... арасында узун кулак коён болгон. 6. ... акын түркүн жомокторду жазган. 7. Р. Шүкүрбековдун кызыктуу ... окуп чыгабыз."},{"t":"p","h":"<span class=\"pg\" data-n=\"132\">132<\/span>Түзүлгөн суроолорго жооп берүү менен жазуу түрүндө маек түзгүлө."},{"t":"p","h":"1. Райкан Шүкүрбеков кандай чыгармалары менен белгилүү болгон?"},{"t":"p","h":"2. Ал кимдердин накыл сөздөрүн, ырларын көп уккан?"},{"t":"p","h":"3. Калеми курч акын кандай жомокторду, тамсилдерди, драмаларды жараткан?"},{"t":"p","h":"4. Ыр түрүндөгү кандай жомокторун атап бере аласың?"},{"t":"p","h":"5. Сен анын кандай чыгармаларын окудуң?"}],"sub":[{"title":"РАЙКАН ШҮКҮРБЕКОВ","b":10}],"section":"ПТ ЧЕЙРЕК","pages":[131,132]},{"title":"§ 77. Сүйлөмдөгү сөздөрдүн орун тартиби — Порядок слов в предложении","blocks":[{"t":"h3","h":"§ 77. Сүйлөмдөгү сөздөрдүн орун тартиби — Порядок слов в предложении"},{"t":"p","h":"Сүйлөмдөгү сөздөрдүн орун тартиби алардын синтаксистик кызматына ылайык аныкталат:"},{"t":"p","h":"ээ менен баяндоочтун орду;"},{"t":"p","h":"аныктооч жана аныкталгычтын орду;"},{"t":"p","h":"толуктооч жана аны башкаруучу сөздүн орду;"},{"t":"p","h":"бышыктооч жана аны башкаруучу сөздүн орду."},{"t":"p","h":"Сүйлөмдө ээ мурда, баяндооч андан кийин келип, түз орун тартиби боюнча орун алат."},{"t":"p","h":"в Порядок слов предложении посинтаксическим функциям определяется:"},{"t":"p","h":"подлежащим и сказуемым;"},{"t":"p","h":"определением и местом определяемого;"},{"t":"p","h":"дополнением и местом управляющего слова;"},{"t":"p","h":"обстоятельством и местом обстоятельства."},{"t":"p","h":"Подлежащее имеет место перед сказуемым, а сказуемое после подлежащего, они образуют прямой порядок слов предложения,"},{"t":"p","h":"М исал ы: Кундуз Москвадан келди. Аныктооч аныкталгычтан мурда келет."},{"t":"p","h":"Определение ставится перед определяемым словом."},{"t":"p","h":"М исал ы: Нурбек чоң шаарда окуйт (аныктооч – чоң), Толуктооч менен бышыктооч өздөрүн башкарган сөздөн мурда келет."},{"t":"p","h":"Дополнение и обстоятельство должны быть перед управляющим ими словом,"},{"t":"p","h":"М исал ы: Окуучулар тапшырманы аткарышты (толуктооч- тапшырманы). Быйыл жаз эрте келди (бышыктооч – эрте)."},{"t":"p","h":"<span class=\"pg\" data-n=\"133\">133<\/span>Сүйлөм мүчөлөрүнүн ушундай тартипте орун алышы сөздөрдүн түз орун"},{"t":"p","h":"Такой порядок слов в пред-"},{"t":"v","l":["ложении называется прямым","порядком слов.","тартиби деп аталат."]},{"t":"p","h":"Бирок бул дайыма эле сакталбайт. Сүйлөмдүн маанисине, стилдик максатына ж. б. жараша сөздөрдүн орун тартиби өзгөрөт."},{"t":"p","h":"Сөздөрдүн түз орун тартибинин өзгөртүлүп колдонулушу алардын терс орун тартиби деп аталат."},{"t":"p","h":"Но это не всегда соблюдается. Порядок слов изменяется по смыслу предложения, стилистической цели и т.д."},{"t":"p","h":"Изменение прямого порядка слов называется отрицательным порядком слов."},{"t":"p","h":"М исалы: Даниярдын мүнөзүнө куле турганбыз биз. (Ч. А.) 265. Сүйлөмдөрдөгү сөздөрдүн орун тартибин салыштыргыла."},{"t":"p","h":"1. Ай сүттөй жарык. 2. 1837-жылды М. Лермонтов Кавказда өткөрдү. 3. «Манастын» көп варианттары жана аткаруучулары бар, 4, Сары аары мыкты аңчы болуп эсептелет. 5. Булбулдун үнү абдан мукам, адамды кубантат. 6. Токойдо өсүмдүктөр кабаткабат болуп өсөт, 8. Табияттын көптөгөн табышмактуу сырлары ачыла элек."},{"t":"p","h":"266. Сүйлөмдөрдөгү сөздөрдүн орун тартибин өз ара салыштыргыла, Кайсынысында ой түшүнүктүү болуп турат?"},{"t":"p","h":"1. Канатбектин ою акыры иш жүзүнө ашты. – Ою иш жүзүнө Канатбектин ашты акыры. 2. Бу баланын эки жомогу боло турган (Ч.А). – Эки жомогу турган болобу баланын. 3. Анын балдарга арнап жазган көп чыгармалары бар. – Көп чыгармалары анын арнап жазган балдарга бар. 4. Адамды байлык, бийлик көркүнө чыгара албайт. – Албайт чыгара көркүнө байлык, бийлик адамды. 5. Кожомкул – кыргыз элинин атактуу балбаны. – Балбаны атактуу Кожомкул – кыргыз элинин."},{"t":"p","h":"267. Берилген сүйлөмдөрдү маанисине, стилдик максатына жараша сөздөрдүн орун тартибин өзгөртүп тууралагыла."},{"t":"p","h":"1. Пайда болгон мындан миллиондогон жылдар мурун Жер шарында тоолор. 2. Эң керектүү адам баласына болуп калды буюм компьютер. 3. Атайбыз макал-ылакап деп биз учкул сөздөрдү."},{"t":"p","h":"4. Тундрада кездешет майда суулар жана саздар көп. 5. Байыркы <span class=\"pg\" data-n=\"134\">134<\/span>гректер чыгарышкан миф ырчы Орфей жөнүндө. 6. Маугли кошо чоңоёт бөлтүрөктөрү менен карышкырдын."},{"t":"p","h":"268. Төмөнкү сөздөрдү иретке келтирип, сүйлөм түзгүлө. Түзүлгөн сүйлөмдөрдүн мааниси жактан байланышын аныктагыла."},{"t":"p","h":"1. Бадминтон, оюнуна, окшош, теннис. 2. Ойнолот, бул, да, тегиз, түз аянтта. 3. Бул, оюн, сыяктуу, волейбол, оюну, созулат, алганга, чейин, 15 упай. 4. Талап, кылып, шамдагайлыкты, оюн, ойнолот, тез. 5. Бадминтонду, болот, ойноого, каалаган жерде, талаада, көк жайыкта, көл жээгинде."},{"t":"p","h":" 1 Жогорку мааниси жактан сүйлөмдөрдүн байланышынан түзүлгөн текстти уланткыла жана ага тема койгула."}],"sub":[],"section":"ПТ ЧЕЙРЕК","pages":[133,134]},{"title":"§ 78. Җалаң сүйлөмдөр —","blocks":[{"t":"h3","h":"§ 78. Җалаң сүйлөмдөр —"},{"t":"p","h":"Нераспространенное предложение Баш мүчөлөрдүн катышына карай эки тутумдуу жөнөкөй (айкындооч сүйлөм жалаң мүчө жок) жана жайылм а (айкындооч мүчөлөрү бар) болуп бөлүнөт."},{"t":"p","h":"Жалаң сүйлөмдүн курамында баш мүчөлөр гана турат."},{"t":"p","h":"По наличию (или отсуствию) второстепенного члена предложения простые предложения – двусоставные делятся на нераспространенные и распространенные простые предложения."},{"t":"p","h":"Нераспространенные простые предложения в своем составе имеют только главные члены. Мисалы: Коңгуроо кагылды. Сабак башталды. 269. Текстти окуп, орус тилине которгула. Җалаң сүйлөмдөрдү көрсөткүлө,"},{"t":"h3","h":"ЖАЗ МЕЗГИЛИ"},{"t":"img","src":"data:image/webp;base64,UklGRgIvAABXRUJQVlA4IPYuAABQwQGdASpxAvIBPrVQnkqnPbOrr1JqW7AWiWluUMs7ufb50RgWuFsTNHJgaopemv0Hg+9jOkl/qO+U7d/t/YH43tpupAf9NroAP//175w2j0vOeT7l88/xv/V6m2eVl3+Q7Ij/71F/9nau7fvNzeX//PilVjfUpzwOj//Xf+jVsOSXuUz8wiZ2+b0DzJL1ezciCZdrzmTfizMZwVDEDYOp8vpNVg7P7ldsEe6haPzJrGC1S5A91C0ffILt7NwSj40GdHMmnFxiQschxysRzEfWD9NPAMJPEVY4v6Mjv2NnjMjX3Z+iadaaPjxwUqr8Fuxha0u0psZIS3byrB83rJOuWD77YxAW/jb4LW/yDD4rmfdzhBEGZ5Z8MfCACyyKGBKE9Kb0bHYnOousraDHi4UTICsD8Nxm6v4ORbd1JiN0HN066KV1JfABNDF/xNt3jGtGkezDdnfMipVw3gVJgd63HiwrWTGYEVAFG3yk3iHPT+dbIB99SWnW3pKqLxrn/D6Qv9oVGA+YLx1Zh19RE7bX0V0Hcy+WOLAm6V4jMfWQ+oKLw7GkIefns99lmZSt6EZCdpXQOVQRMaMFukFZ9JnpqPq/RvFRu13xXYHJhmBq7mZybOkSttnON1ksJ+qr8EOB15+GIzjEIG2KiugaEQUKI02O7G482OgGwZ6NA5B3kwHOz4J6AxhmJyCXh5IdYdpBwHLz/aAT7KK+CRfpxZoXMhFlr2OayXx1z4iSI4h6eEbrlQY2xccVrpYvivwXxK0K5qHCnub1jPLxZaVpN6oqZrOp02NAyF1xXWWbtJI5K1lYT4qTCOIPsmWBqDajAuN5iQ2T4UB3d2GryZHAtMu+Z8CDggd2aW0O4hNSW1hlX7kkCY6I7LtBcRKHZePgqV5wOX69PextAfD8ZBes6izIvxrJGHr2+qyAE7gBdQgeybHSOljwD8QWjnftLJrsnsJzrKDCGsZoZ9nbadH81iUJ0FabxsGaT+6jPIZ3GWJoq5Ar+5q0AFrpUWgW48LAXTcxTpgsg0xtqlpZRCp7HB/pQKf/uitxkaPsAiPMQj45Kp3Xs/d0a2zP9VTHXG5C+bZ2AFzg дөрдү көчүрүп жазгыла. Аларды салыштыргыла, баш мүчөлөрүн аныктагыла,"},{"t":"p","h":"1. Кызгалдактар ачылды. 2. Рафаэль сүрөт өнөрү менен замандаштарын таң калтырган. 3. Күлүк тапталды. 4. Чоң тоту куштар жаңгак чагып жей алат. 5. Мелдеш күчөдү. 6. Шаркыратмалар дайыма эле бир калыпта тура бербейт. 7. Күн күркүрөдү. 8. Н. Н. Носов Незнайка жөнүндөгү жомокту жазган. 9. Таң атты."},{"t":"v","l":["272. Текстти окугула. Жалаң сүйлөмдөрдү тапкыла,","– Апаң кайда?"]},{"t":"p","h":"Бала үндөбөдү. Апасынын жайын айтуудан кыйналчу."},{"t":"p","h":"– Дайынын билгизбей кетти го апаң. Сен кайдан билмексиң."},{"t":"p","h":"– Билбейм."},{"t":"v","l":["– Атанчы? Атаңы да билбейсиңби?","Бала унчукпады."]},{"t":"p","h":"– Эчтеме билбегениңе жол болсун, жигит? – дүкөнчү саал жекире тамашалады. – Болуптур, эмесе... билбесең билбессиң. Келе чөнтөгүңдү тос,— деп конфет уучтап сунду."},{"t":"p","h":"<span class=\"pg\" data-n=\"136\">136<\/span>– Чоң жигит бол!"},{"t":"p","h":"Бала тартынды."},{"t":"p","h":"Ч. Айтматов, «Ак кеме» кю Жалаң сүйлөмдөрдү катыштырып, чакан текст түзгүлө."}],"sub":[{"title":"ЖАЗ МЕЗГИЛИ","b":5},{"title":"Китеп","b":9}],"section":"ПТ ЧЕЙРЕК","pages":[135,136]},{"title":"§ 79. Көнүгүү, машыгуу иштери — Упражнения для приобретения навыков","blocks":[{"t":"h3","h":"§ 79. Көнүгүү, машыгуу иштери — Упражнения для приобретения навыков"},{"t":"p","h":"273. Ээлик милдетин аткаруучу сөздөргө кашаанын ичиндеги сөздөрдүн маанилешин тууралап байланыштырып, жалаң сүйлөмгө айландыргыла."},{"t":"raw","h":"<h4 class=\"mk\">1. Бала... 2. Дарактар ... 3. Ландыш... 4. Ысык-Көл... 5. Жомок... 6. Айтыш...<\/h4>"},{"t":"v","l":["(аткарылды, жаады, ойгонду).","(кучеду, бурдеду, келди).","(ырдады, кулду, ачылды).","(толкуду, акты, жайнады).","(көрүндү, басылды, айтылды).","(күчөдү, гүлдөдү, көбөйдү)."]},{"t":"p","h":"274. Берилген суроолорго жооп бергиле да, сүйлөмдүн баш мүчөлөрүн тапкыла."},{"t":"v","l":["404","2. Булбул сай 1. Китеп кандай 7","З. Мектеп чоңбу","4. Жер-жемиш быштыбы?","АА","6. Жомок кеу 5. Чынгыз кел","7. Гүлдөр кандай?"]},{"t":"p","h":"275. Диалогду эки-экиден окугула да, жалаң сүйлөмдөрдү көрсөткүлө."},{"t":"h3","h":"ЖАЙ МЕЗГИЛИНДЕГИ ЖОЛУГУШУУ"},{"t":"p","h":"А й дай: – Алина кандайсың? Шаардан качан келдиң? Алина: – Жакшымын. Шаардан, бүгүн келдим."},{"t":"p","h":"А й дай: – Шаарда кун ысыдыбы?"},{"t":"p","h":"Алина: – Күн ысыды. Ысыкка чыдабай көлгө келдик. А й дай: – Абдан жакшы болду. Көлгө бирге түшөбүз. А л ин а: – Сен көлдө сүзө аласыңбы?"},{"t":"p","h":"А й д ай: – Ооба, мен сүзөмүн. А, сенчи?"},{"t":"p","h":"А лина:-—- Мен сүзгөндү жакшы билбеймин. Сен үйрөтөсүңбү? А й дай: – Анда эмесе, кеттик көлгө!"},{"t":"p","h":"Алина: – Жакшы болот, кеттик!"},{"t":"p","h":"216. Берилген сүйлөмдөрдү жалаң сүйлөмдөргө айландыргыла."},{"t":"p","h":"1. Мен кызыктуу китеп окудум. 2. Коңгуроо кагылып, сабак башталды. 3. Күн күркүрөп, жамгыр жаады. 4. Апам келип, биз <span class=\"pg\" data-n=\"137\">137<\/span>сүйүндүк. 5. Көлгө түшүп, чабак урдук. 6. Жаз келип, гүлдөр жайнады. 7. Таң атып, жарык кирди. 8. Кар эрип, байчечекейлер ачылды. Ү лгү: Мен окудум. Китеп кызыктуу."},{"t":"p","h":"[1 Жалаң сүйлөмдөрдү катыштырып, диалог түзүп келгиле."}],"sub":[{"title":"ЖАЙ МЕЗГИЛИНДЕГИ ЖОЛУГУШУУ","b":7}],"section":"ПТ ЧЕЙРЕК","pages":[137,137]},{"title":"§ 80. Сөз өстүрүү – Развитие речи","blocks":[{"t":"h3","h":"§ 80. Сөз өстүрүү – Развитие речи"},{"t":"p","h":"277. Төмөнкү ырды окуп, тилиңерди жатыктыргыла, Жалаң сүйлөмдөргө көңүл бургула,"},{"t":"h3","h":"көктөм"},{"t":"v","l":["Жаз келди, гүлдөр жайнап.","Алма бак бүчүр байлап.","Жел жүрөт, булут калкып.","Күн күлөт, нуру жаркып.","Аскалар шиштей учтуу.","Коо-колот жыпар жыттуу.","Жер жашыл, асман көпкөк.","Ар кайсыл гүлдөр: ак, көк..."]},{"t":"p","h":"&amp; көктөм – ранняя весна коо-колот – узкая горная долина 278. Жалан суйлемдердегу баяндоочтук милдетти аткаруучу сөздөрдүн синонимин тапкыла."},{"t":"v","l":["Улгу: Окуучу саламдашты – учурашты.","Эжем жарыялады —","Маселе далилденди —","Мугалим кубанды —","д.","ме","-","","Спортсмендер мелдешти – у","Сабактар аяктады- Жу, /","Атам сезди -"]},{"t":"p","h":"279. Көп чекиттин ордуна тиешелүү сөздөрдү коюп, сүйлөмдөрдү толуктагыла. Алардын баш мүчөлөрүн аныктагыла."},{"t":"p","h":"Ү лгү: Музыка угулду. (салынды, окуп жатат, угулду, чоңойду, түштү, акталды, чертилди, сугарылды, башталды, токтоду)"},{"t":"p","h":"Уулу..."},{"t":"v","l":["Мектеп...","п» ЕГ,","Студенттер...","Бакча...","Той ....","Чагылган ....","Комуз..."]},{"t":"p","h":"<span class=\"pg\" data-n=\"138\">138<\/span>280. Төмөндөгү баяндоочтор менен жалаң сүйлөм түзгүлө."},{"t":"p","h":"1... отурат. 2... учту. 8... сүйлөдү. .. 4... жазды."},{"t":"p","h":"5. ... түштү. 6. ... келди."},{"t":"p","h":"281. Теменку макалдардын маанисин тушундургуле."},{"t":"raw","h":"<h4 class=\"mk\">Ууру байыбайт. Озунган утат. Кыз – конок. Тааныбасты сыйлабас.<\/h4>"},{"t":"v","l":["– Вор не разбогатеет.","– Кто старается, тот добивается.","– Дочь-гость (в доме родителей)","– Кого не знают, того не уважают."]},{"t":"p","h":"1 Төмөндөгү кластердин жардамы менен жалаң сүйлөмдөрдү катыштырып текст түзгүлө."},{"t":"p","h":"т"}],"sub":[],"section":"ПТ ЧЕЙРЕК","pages":[138,138]},{"title":"§ 81. Жайылма сүйлөм – Распространённое предложение","blocks":[{"t":"h3","h":"§ 81. Жайылма сүйлөм – Распространённое предложение"},{"t":"p","h":"Жайылма сүйлөмд ү н курамында баш жана айкындооч мучелер турат."},{"t":"p","h":"Распространенные предложения в своем составе имеют главные и второстепенные члены."},{"t":"p","h":"М исал ы: Жылдыз англис, испан, кыргыз тилдеринде эркин сүйлөйт."},{"t":"p","h":"282. Сүйлөмдөрдүн баш жана айкындооч мүчөлөрүн аныктагыла. Жалаң жана жайылма сүйлөмдөрдү эрежеге ылайык салыштыргыла."},{"t":"p","h":"1. Таң атты. Эч жерде булут жок. Асман ачык. 2. Ысык-Көл мелтиреп турат. Күн ысык. Балдар чабак уруп жарышат, 3, Жаз келди. Жазгы жумуштар башталды. Адамдар талаада иштеп жатышат. Жумуш күчөдү. 4. Айлана жымжырт. Жамгыр төгө баштады. Суу болдук. Мен үшүдүм. Аңгыча үйгө да жетип калдык."},{"t":"p","h":"<span class=\"pg\" data-n=\"139\">139<\/span>283. Темендегу диалогду эки-экиден окугула. Жайылма жана жалан суйлемдерду аныктагыла."},{"t":"v","l":["Рысбек: – Сен эртен менен саат канчада турасын?","Нурбек: – Мен эртең менен саат 7?де турамын.","Р ы с бе к: – Мектепке канчада жөнөйсүң?","Н урбе к: – Сегизде.","Р ы к: – Сабактар кызыктуубу?","Н урбе к: – Ооба, кызыктуу.","Р ы с бе к: – Китепканага барып турасыңбы?","Н урбе к: – Барып турамын.","Р ы с бе к: – Бош убактыңда эмне кыласың?"]},{"t":"p","h":"Н урбе к: – Мен машыгамын. Компьютерде иштеймин. Үй тапшырмаларын аткарамын."},{"t":"p","h":"Р ы с бе к: – Ата-энеңерге ким жардам берет?"},{"t":"p","h":"Н урбе к: – Мен жардам беремин. Алар ыраазы болушат. Р ы с бе к: – Сен азыр бошойсуңбу? Киного бирге баралы. Н урбе к: – Мен бош элемин."},{"t":"p","h":"Р ы с бе к: – Анда эмесе, кеттик, киного."},{"t":"p","h":"284. Көп чекиттин ордуна баяндоочтук милдетти аткаруучу сөздөрдү жак мүчөлөрүнө карай тууралап жазгыла. Баш жана айкындооч мүчөлөрүн таап, астын сызгыла."},{"t":"p","h":"1. А. С. Пушкин жыйырма жашында «Руслан менен Людмила» поэмасын ... (жаратуу). 2. Окуу жылы Индияда июнь айында .. (башталуу). 3. Биз тынчтыкта жашоону ... (каалоо)."},{"t":"p","h":"4. Ал Жаңы Гвинеяда көп жыл ... (иштөө). 5. Мен симфониялык музыканы көңүл коюп ... (угуп жатуу). 6. Силер улуттук оюндар мелдешине ... (катышуу)."},{"t":"p","h":"285. Берилген жалаң сүйлөмдөрдү жайылма сүйлөмдөргө айландыргыла."},{"t":"v","l":["Жел жүрдү.-","Сырт капкараңгы.-","Таң атты.-","Жылдыздар тарады.-","Окуу аяктады."]},{"t":"p","h":"У л г ү: Эгин-тегин жыйналды. – Быйыл эгин-тегин эрте жыйналды."},{"t":"p","h":"0 Жалан жана жайылма суйлемдерду катыштырып маек тузуп кел- ү гиле."}],"sub":[],"section":"ПТ ЧЕЙРЕК","pages":[139,139]},{"title":"§ 82. Текст менен машыгуу иштери —","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"140\">140<\/span>§ 82. Текст менен машыгуу иштери —"},{"t":"p","h":"Работа н дү толуктагыла, Баш жана айкындооч мүчөлөрүн тапкыла,"},{"t":"h3","h":"БИШКЕК"},{"t":"p","h":"Эгемендуу Кыргызстандын борбору – ... шаары болуп эсептелет. Ал Чүй өрөөнүнүн борбордук бөлүгүндө ... ‚ Дениз денгээлинен ДЕП <span class=\"pg\" data-n=\"142\">142<\/span>700-900 метр бийиктикте .... Бишкек – Борбор Азиядагы ири шаарлардын бири катары.... Бишкек 1825-жылы чеп болуп.... 1878-жылы Бишкек уездинин укугун алган. 1924-жылы. Кыргыз автономиялуу облусунун борборуна .... 1926-жылдан баштап ...... деп аталган. 1991-жылы ага тарыхый өз аты....... Аянты 15,7 мин га, .,. 4 администрациялык аймакка.... Пайдаланылуучу сөздөр: кайтарылып берилген, жайгашкан, Фрунзе -шаары, шаар, бөлүнөт. негизделген, борборшаары, айланган, эсептелет, орун-аяган; Бишкек..."},{"t":"p","h":"288. 1. Суроолорго жооп бергиле. Баяндоочтук милдетти аткарган сөздөрдүн синонимин тапкыла."},{"t":"p","h":"1. Бишкек шаары кайсы жерде орун алган?"},{"t":"p","h":"2. Деңиз деңгээлинен канча метр бийиктикте жайгашкан? З. Бишкек кандай шаар катары эсептелет?"},{"t":"p","h":"4. Ал кандай администрациялык аймактарга бөлүнөт? Ү л гү: эсептелет – кабыл алынат – аталат."},{"t":"p","h":"289. Берилген сөздөрдү байланыштырып жалаң жана жайылма сүйлөмдөрдү түзгүлө."},{"t":"v","l":["1. Ак кайың","2. Бөбөгүм сүрөт өнөрү","3. Байчечекейлер","4. Биз келге тушуу","5. Экзамендер","6. Бишкек кунден-кунге","бүрдө","кызыгуу","жайна","баруу","бутуу","жакшыруу бара жатат."]},{"t":"p","h":"290. Белгиленген сездердун маанисин карама-каршы маанидеги сездердун жардамы менен аныктагыла жана аларды катыштырып жайылма суйлемдерду тузгуле."},{"t":"v","l":["тырышчаак – жалкоо","кубануу – өкүнүү","мээримдүү – таш боор","жумшак – катуу","боорукер – кайрымсыз"]},{"t":"p","h":"288-көнүгүүдөгү текстти «Бүгүнкү Бишкек» деген мазмунда улантып келгиле."},{"t":"raw","h":"<div class=\"gloss\"><p>ө <\/p><\/div>"}],"sub":[{"title":"БИШКЕК","b":2}],"section":"ПТ ЧЕЙРЕК","pages":[142,142]},{"title":"§ 84. Жылдык өтүлгөн материалдар боюнча алган","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"143\">143<\/span>§ 84. Жылдык өтүлгөн материалдар боюнча алган"},{"t":"p","h":"билимдерин жөнгө салуу – Систематизация знаний по"},{"t":"h3","h":"пройденным материалам за год"},{"t":"p","h":"291. Сүйлөмдөрдөгү көп чекиттин ордуна тиешелүү ат атоочторду коюп толуктагыла. Сүйлөмдөрдү сөз түркүмүнө карай талдагыла."},{"t":"p","h":"(алар, эч качан, биз, бул, ким, ал) Улгу: Бул мектеп жаңы салынган, Бул – мааниси боюнча шилтеме ат атооч, түзүлүшү боюнча жөнөкөй, жекелик санда, атооч жөндөмөсүндө турат,"},{"t":"v","l":["Мектеп —","мектеп жаңы салынган.","Москва шаарына окууга кетти.","апамды унутпаймын.","мелдеште биринчиликти алды?","экзаменди ийгиликтүү тапшырышты.","... англис тилин волонтёр менен үйрөнүп жатабыз."]},{"t":"p","h":"292. Сүйлөмдөрдөн табыш жана элес тууранды сөздөрдү аныктагыла."},{"t":"p","h":"1. Балдар шашылбай шылдыр-шылдыр аккан булакка келишти."},{"t":"p","h":"2. Асмандагы түнкү жылдыздар жылт-жулт этишет. 3. Корккондуктан анын жүрөгү шуу дей түштү. 4. Мен күүгүмдө серең эткен караанды байкадым. 5. Шарп-шарп жээкке урунган толкун күчөдү. 6. Асел мөлт-мөлт кеткен көз жашын токтото алган жок,"},{"t":"p","h":"293. Сүйлөмдөрдөгү кызматчы сөздөрдү тапкыла. Аларды маанисине карай бөлүп жазгыла."},{"t":"p","h":"1. Окуучулар мектепти көздөй чуркашты. 2. Ысык-Көлдүн кооздугу менен байлыгына суктанабыз. 3. Акылдуу адам абдан ак ниет жана өтө маданияттуу болот. 4. Бүтүрүү кечесине карата концерт уюштурдук. 5. Гүлзат тестирлөөдөн көп упай топтоду, себеби ал жакшы окуду. 6. Нарбек гана эч тартынбастан суроолорго жооп берип жатат."},{"t":"p","h":"1. жандоочтор: 2. байламталар: 3. бөлүкчөлөр: 294. Төмөнкү сүйлөмдөрдүн айтылыш максатына карай тыныш белгилерин коюп, дептериңерге көчүрүп жазгыла."},{"t":"p","h":"1. Бүтүрүү кечесине арналган салтанаттуу майрамыңар кут болсун... 2. Аймактык предметтер боюнча олимпиадага катышууга силер даярдандыңарбы... 3. Биз А. Осмоновдун поэзиялык чыгармаларын окуп жатабыз... 4. Улууларга урмат, кичүүлөргө <span class=\"pg\" data-n=\"144\">144<\/span>ызат көрсөткүлө... 5. Айлыңардагы жардамга муктаж адамдарды билдиңерби... 6. Жашасын бактылуу балалыктын таттуу күндөрү... ^1 Сүйлөмдүн баш жана айкындооч мүчөлөрүн кайталап келгиле,"}],"sub":[],"section":"ПТ ЧЕЙРЕК","pages":[143,144]},{"title":"§ 85. Өтүлгөн материалдар боюнча алган билимдерин","blocks":[{"t":"h3","h":"§ 85. Өтүлгөн материалдар боюнча алган билимдерин"},{"t":"p","h":"жөнгө салуу —"},{"t":"h3","h":"Систематизация знаний по пройденным материалам"},{"t":"p","h":"295. Төмөнкү сүйлөмдөрдөгү жөнөкөй жана тутумдаш ээ, баяндоочторду өз-өзүнчө бөлүп жазгыла."},{"t":"p","h":"1. Эр жигит эл четинде, жоо бетинде. 2. Алар чет өлкөгө саякатка даярданып жатышат. 3. Ак куулар кайтып келишти."},{"t":"p","h":"4. Калп – ырыс кесет. 5. Ата-энем жумушка кетет. 6. Мен тексттин мазмунун айтып берип жатамын. 7. Кыргыз тили мамлекеттик тил болуп саналат. 8. Кундуз өз ишин мыкты уюштурат. 9, Ата-бабаларыбыз тынчтыкта, ынтымактуу жашоону ыйык тутуп келишкен. 10. Менин курбум диссертациялык ишин ийгиликтүү жактады."},{"t":"v","l":["1. жөнөкөй ээ:","2. тутумдаш ээ:","З. жөнөкөй баяндооч:","4. тутумдаш баяндооч:"]},{"t":"p","h":"296. Сүйлөмдөрдөгү ээнин милдетин аткаруучу сөздөрдү тапкыла."},{"t":"p","h":"1. Биз терең билим алууга умтулабыз. 2. Сабак кызыктуу өтүлдү. 3. Үчөө бизге абдан чоң жардам көрсөтүштү. 4. Мен тарых сабагына кызыгамын. 5. Салтанат аспирантурада окуп жатат."},{"t":"p","h":"6. Көпкөгү тандалып алынды."},{"t":"p","h":"297. Сүйлөмдөрдүн баяндоочторун түрлөрүнө карай топтоп жазгыла."},{"t":"p","h":"1. Беш жерде беш – жыйырма беш, 2. Чойбек – прокурор."},{"t":"p","h":"3. Айдай мектепте окуп жатат. 4. Агам – бизнесмен. 5. Мен 8-класска көчөмүн. 6. Анын айылы – тоолуу. 7. Бөбөгүм бала-бакчага барат. 8. Ал – студент. 9. Алар бүгүн чогуу келип калышат."},{"t":"p","h":"10. Эрмек жоопкерчилик менен иштеп жатат."},{"t":"v","l":["1. атоочтук баяндоочтор:","2. этиштик баяндоочтор:"]},{"t":"p","h":"298 ана байыта алат. Акыл адам баласына табиятынан берилген касиет. Ойчул – акын акылды адептүүлүк жолун тутуунун бирден-бир зарыл шарты деп эсептеген. «Кут алчу билим» поэмасында адамдагы жөнөкөйлүк жана кичипейилдик касиеттерин жогору баалаган. Ошондой эле адамдын көтөрүмдүүлүк, сабырдуулук сыяктуу нарктуу касиеттердин артыкчылыгын да кеңири айткан. Жаш баладагы бул сапаттар алды менен үй-бүлөдө, ата-эненин таалимтарбиясы менен калыптана тургандыгын аныктайт.Үлгүлүү ата-энеден өрнөктүү тарбия көргөн балдар маданияттуу, акыл-эстүү жана бактылуу болорун жеткиликтүү түшүндүргөн. Балдары акылдуу болсун деген ата-эне аларга жаштайынан билим берүүсү зарыл экендигин чыгармада баса белгилейт."}],"sub":[{"title":"Систематизация знаний по пройденным материалам","b":2},{"title":"ЖУСУП БАЛАСАГЫН","b":24}],"section":"ПТ ЧЕЙРЕК","pages":[145,145]},{"title":"§ 86. Чейректик жазуу ишин жүргүзүү — Проведение письменной работы за четверть","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"146\">146<\/span>§ 86. Чейректик жазуу ишин жүргүзүү — Проведение письменной работы за четверть"},{"t":"p","h":"300. Сөз айкаштарынын маанилешин тексттен таап жазгыла, 2. белгилүү көсөмү – атактуу даанышманы –?"},{"t":"v","l":["3. өмүр баяны – жашоосу –?",". мазмундуу поэмасы – сапаттуу дастаны –?","акыл-эстуулерге – билимдүү-илимдүүлөргө –?","өрнөк кылуу – үйрөнүү —?","акылман акын – чыгарма жаратуучу —?",". тарбия-таалимдуулук —","ыйгарылган шык-жөндөм – жаралган талант –?","Улгу: 1. өркүндөгөн учурдагы – гулдөп турган"]},{"t":"p","h":"301. Суйлемдерду жогорку сез айкаштары менен маанисине ылайыктап, толуктап жазгыла."},{"t":"p","h":"1. Ж. Баласагындын ... ... «Кут алчу билим» деп аталат. 2. ... ...акылды о... тутуунун бирден-бир зарыл шарты деп эсептеген. Ж. Баласагын илим-билим, маданият ... ... орто кылымдын... .... 4. Анын...... ‚чыгармачылыгы жөнүндө маалыматтар аз, 5. Ж. Баласагындын ою боюнча адам өз өмүрүн окуу, ... ... менен гана байыта алат. 6. Акыл адам баласына табиятынан......."},{"t":"p","h":"7. Улуу ойчул өз чыгармасын ... ... гана арнаган."},{"t":"p","h":"302. Теменку суроолорго жазуу турунде жооп бергиле."},{"t":"p","h":"1. Ж. Баласагын кайсы кылымдын керунуктуу екулу?"},{"t":"p","h":"2. Ал кайсы жерде жана болжолу канчанчы жылдары туулган?"},{"t":"p","h":"3. Анын эн баалуу чыгармасынын аталышы кандай?"},{"t":"p","h":"4. Ж. Баласагын өз чыгармасын кандай баалаган жана аны кимдерге арнаган?"},{"t":"p","h":"5. «Кут алчу билим» чыгармасында адамдын кандай сапаттары бааланат?"},{"t":"p","h":"303. Тексттин негизги идеяларын далилдеп бергиле, 1. Ж. Баласагын маданият гүлдөп турган орто кылымдын атактуу даанышманы. 2. Анын ою боюнча адам өз өмүрүн билим алуу, үйрөнүү, үлгү алуу менен байыта алат. 3. Ойчул акын адамдын жөнөкөйлүк, кичипейилдик, көтөрүмдүүлүк, сабырдуулук сыяктуу касиеттерин жогору баалайт. 4. Үлгүлүү ата-энеден жакшы таалим-тарбия алган адептүү балдар гана акыл-эстүү, бактылуу болорун өзүнүн чыгармасында жеткиликтүү түшүндүрө <span class=\"pg\" data-n=\"147\">147<\/span>алган. 5. Ал балдары акыл-эстүү, адептүү болсун деген ата-энелер аларга кичинесинен билим берүүсү зарыл экендигин баса белгилеген. 6. Ж. Баласагындын «Кут алчу билим» чыгармасын билимдүүлөргө, акылдууларга гана арнаган."},{"t":"p","h":"304. Көчүрүп жазгыла, Сүйлөмдөрдүн баш жана айкындооч мүчөлөрүн аныктап, астын сызгыла."},{"t":"p","h":"1. Биз Ж. Баласагындын «Кут алчу билим» чыгармасын окуп-үйрөнөбүз. 2. Ж. Баласагын чыгармасын билимдүүлөргө гана арнаган. 3. Окурмандар чыгармадагы касиеттүү адамдык сапаттарды баалашат."},{"t":"p","h":" Ж. Баласагын жана анын чыгармасы жөнүндө кандай маалыматтарды билдиңер, кыскача айтып бергиле."}],"sub":[],"section":"ПТ ЧЕЙРЕК","pages":[146,147]},{"title":"§ 87. Жыйынтыктоочу сабак – Итоговый урок","blocks":[{"t":"h3","h":"§ 87. Жыйынтыктоочу сабак – Итоговый урок"},{"t":"p","h":"&gt; Өтүлгөндөрдү эске тушургуле: – Вспомните:"},{"t":"p","h":"1. Тууранды сездер кайсы сез туркумуне кирет?"},{"t":"p","h":"2. Тууранды сездер маанисине карай кандай болуп белунет?"},{"t":"p","h":"3. Табыш жана элес тууранды сездерге мисалдар келтиргиле."},{"t":"p","h":"4. Кыргыз тилинде кандай кызматчы сездер бар?"},{"t":"p","h":"5. Суйлем деген эмне? Айтылыш максатына карай кандай болуп белунет?"},{"t":"p","h":"6. Суйлемдун грамматикалык негизин эмнелер тузет? Т. Сүйлөмдүн ээси курамына карай кандай болуп бөлүнөт? Мисал келтиргиле."},{"t":"p","h":"8. Ээнин милдетин кайсы сөздөр аткарат?"},{"t":"p","h":"9. Сүйлөмдүн баяндоочу курамына карай кандай болуп бөлүнөт? Мисал келтиргиле."},{"t":"p","h":"10. Баяндоочтун кандай түрлөрү бар? Аларды мисал келтирүү менен түшүндүргүлө."},{"t":"p","h":"11. Сүйлөмдөр баш жана айкындооч мүчөлөрдүн катышына карай кандай болуп бөлүнөт?"},{"t":"p","h":"Мисал келтирүү менен түшүндүргүлө."},{"t":"p","h":"305. Биринчи катардагы сүйлөмдөрдү мааниси туура келүүчү экинчи жактагы сөздөр менен байланыштыргыла, Алар сүйлөмдө кандай милдет аткарат?"},{"t":"p","h":"1. ....... адамдык жакшы сапаттар жөнүндө терең ой жүгүрткөн. «Кут алчу билим»."},{"t":"p","h":"2. Анын «Кут алчу билим» аттуу поэмасы түрк тилинде.... боло алат,"},{"t":"raw","h":"<div class=\"gloss\"><p>кз<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"148\">148<\/span>3. «......» акыл-эстүү, адептүү адамды кут-бакытка карай жазылган."},{"t":"p","h":"4. Акылы тунук, билимдүү адам башкаларга өрнөктүү....... Ж. Баласагын."},{"t":"p","h":"306. «Кут алчу билим» чыгармасынан үзүндүнү көркөм окугула. Мазмунуна терең ой жүгүрткүлө да, аны жаттагыла."},{"t":"v","l":["Ушул китеп улуу күндөр жемиши,","Билимдүүгө – терең билим деңизи.","Чексиз баалуу билимдердин ширеси,","Аны окуп каниет табар ким өзү?","Жалаң акыл-насаат сөздөн түзүлгөн,","Шуру сымал жипке тизилген.","Бул китептин баркын билет окуган,","Билимсиздин эмне келет колунан!","","Билимсиздер кантип окуп түшүнөт?","А билимдүү окуйт, барктайт, күтүнөт.","Мындан артык мурун китеп бар беле?","Жаралабы кийин буга тең, тете?","Эгер чыкса андай белдүү азамат,","Даңктанганга мен       groups[s.key].books.push(b);

    keys.sort(function (a, b) { var x = groups[a].s, y = groups[b].s; return x.order - y.order || (x.name < y.name ? -1 : x.name > y.name ? 1 : 0); });
    keys.forEach(function (k) {

  // Share a book: a link (opens the app at the book) or the single-file book, through the
  // phone's own share sheet. Without Web Share the link is copied and the file is saved.
  function shareSheet(b) {
    var name = b.title + (b.grade ? ', ' + b.grade + ' ' + t('grade') : '');
    var url = location.href.split('#')[0] + '#/read/' + b.id;
    var old = $('.sheet'); if (old) old.remove(); old = $('.sheet-bg'); if (old) old.remove();
    var bg = document.createElement('div'); bg.className = 'sheet-bg';
    var sh = document.createElement('div'); sh.className = 'sheet';
    sh.innerHTML = '<h3><span>' + esc(t('share')) + ': ' + esc(name) + '</span><button class="icon x" aria-label="' + esc(t('close')) + '">' + ICONS.close + '</button></h3>' +
      '<div class="share-opts"><button class="btn primary s-link">' + esc(t('shareLink')) + '</button>' +
      (b.standalone ? '<button class="btn s-file">' + esc(t('shareFile')) + '</button><div class="note">' + esc(t('shareFileNote')) + '</div>' : '') + '</div>';
    document.body.appendChild(bg); document.body.appendChild(sh);
    function close() { bg.remove(); sh.remove(); }
    bg.onclick = close; $('.x', sh).onclick = close;

    $('.s-link', sh).onclick = function () {
      if (navigator.share) {
        navigator.share({ title: name, text: name, url: url }).then(close, function () { /* cancelled */ });
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { toast(t('linkCopied')); close(); }, function () { window.prompt(t('shareLink'), url); });
      } else {
        window.prompt(t('shareLink'), url);
      }
    };
    var fbtn = $('.s-file', sh);
    if (!fbtn) return;
    var file = null;
    function save() {
      var a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove(); toast(t('fileSaved')); close();
    }
    function send() {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: name }).then(close, function (e) {
          // the tap "expired" while the file was loading: one more tap sends it
          if (e && e.name === 'NotAllowedError') { fbtn.disabled = false; fbtn.textContent = t('fileReady'); fbtn.classList.add('primary'); }
        });
      } else save();
    }
    fbtn.onclick = function () {
      if (file) return send();
      fbtn.disabled = true; fbtn.textContent = t('preparing');
      fetch('books/' + b.id + '/' + b.standalone).then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
        .then(function (blob) {
          file = new File([blob], b.standalone, { type: 'text/html' });
          fbtn.disabled = false; fbtn.textContent = t('shareFile');
          send();
        })
        .catch(function () { fbtn.disabled = false; fbtn.textContent = t('shareFile'); toast(navigator.onLine === false ? t('offline') : t('err')); });
    };
  }

  function downloadBook(b, onProgress) {
    var base = 'books/' + b.id + '/';
    var cache;
    return caches.open(cacheName(b)).then(function (c) {
      cache = c;
      return fetch(base + 'book.json');
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return cache.put(base + 'book.json', r.clone()).then(function () { return r.json(); });
    }).then(function (book) {
      // app shell too, in case the service worker has not finished installing yet
      var urls = ['./', 'index.html', 'app.js', 'style.css', 'books/index.json'].concat(book.images.map(function (i) { return base + i; }));
      var done = 0;
      // a few requests in parallel: fast on 3G, gentle on slow phones
      var queue = urls.slice();
      function worker() {
        var u = queue.shift();
        if (!u) return Promise.resolve();
        return cache.match(u).then(function (hit) {
          if (hit) return;
          return fetch(u).then(function (r) { if (!r.ok) throw new Error(u); return cache.put(u, r); });
        }).then(function () { done++; onProgress(done / urls.length); return worker(); });
      }
      return Promise.all([worker(), worker(), worker(), worker()]);
    }).then(function () {
      lsSet('dl:' + b.id, b.v);
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
      return caches.keys().then(function (keys) { // drop older versions of this book
        return Promise.all(keys.filter(function (k) { return k.indexOf('book-' + b.id + '-') === 0 && k !== cacheName(b); }).map(function (k) { return caches.delete(k); }));
      });
    });
  }

  // ================================================================ READER
  var ICONS = {

  function startReader(book, base) {
    document.title = book.title;
    var chapters = book.chapters;
    var posKey = 'pos:' + book.id;

    app.innerHTML =
      '<div class="reader">' +
      '<div class="viewport"><div class="flow" lang="' + esc(book.lang) + '"></div></div>' +
      '<div class="foot"><span class="t"></span><span class="n"></span></div>' +
      '<div class="bar top">' + (EMB ? '' : '<a class="icon" href="' + libHash + '" aria-label="' + esc(t('back')) + '">' + ICONS.back + '</a>') +
      '<div class="title">' + esc(book.title) + '</div>' +
      '<button class="icon b-toc" aria-label="' + esc(t('contents')) + '">' + ICONS.toc + '</button>' +
      '<button class="icon b-set" aria-label="' + esc(t('settings')) + '">' + ICONS.set + '</button></div>' +
      '<div class="bar bottom"><div class="info"><span class="i1"></span><span class="i2"></span></div>' +
      '<input type="range" class="slider" min="0" max="1" step="1"></div>' +
      '</div>';

    var reader = $('.reader'), vp = $('.viewport'), flow = $('.flow'), footT = $('.foot .t'), footN = $('.foot .n');
    var slider = $('.slider'), i1 = $('.bar .i1'), i2 = $('.bar .i2');

    // original textbook page numbers -> chapter, for "go to page" and the slider
    var pgChapter = {}, pgList = [];
    chapters.forEach(function (c, ci) {
      c.blocks.forEach(function (b) {
        var html = b.h || (b.l ? b.l.join(' ') : '');
        var re = /data-n="(\d+)"/g, m;
        while ((m = re.exec(html))) { var n = +m[1]; if (!(n in pgChapter)) { pgChapter[n] = ci; pgList.push(n); } }
      });
    });
    pgList.sort(function (a, b) { return a - b; });
    if (pgList.length) { slider.min = 0; slider.max = pgList.length - 1; }

    var ch = -1, page = 0, pages = 1, step = 0, colW = 0, H = 0;
    var blockPage = [], pgMarks = []; // [{n, page}]

    function src(s) { return /^data:/.test(s) ? s : base + s; }

    function blockHTML(b, i) {
      var a = ' data-i="' + i + '"';
      switch (b.t) {
        case 'h1': case 'h2': case 'h3': return '<' + b.t + a + '>' + b.h + '</' + b.t + '>';
        case 'p': return '<p' + a + (b.ni ? ' class="ni"' : '') + '>' + b.h + '</p>';
        case 'box': return '<div class="box"' + a + '>' + b.h + '</div>';
        case 'raw': return b.h.replace(/^<(\w+)/, '<$1' + a).replace(/src="img\//g, 'src="' + base + 'img/');
        case 'v': return '<div class="verse"' + a + '>' + b.l.map(function (l) { return l === '' ? '<div class="gap"></div>' : '<div>' + l + '</div>'; }).join('') + '</div>';
        case 'img': return '<figure' + a + '><img data-w="' + b.w + '" data-h="' + b.ht + '"' + (b.dw ? ' style="width:' + b.dw + 'em"' : '') + ' src="' + esc(src(b.src)) + '" alt="' + esc(b.alt || '') + '">' +
          (b.cap ? '<figcaption>' + b.cap + '</figcaption>' : '') + '</figure>';
      }
      return '';
    }

    function renderChapter(ci) {
      ch = ci;
      var c = chapters[ci];
      var html = c.blocks.map(blockHTML).join('');
      if (ci === chapters.length - 1) html += '<div class="endnote">— ' + esc(t('end')) + ' —<br>' + esc(t('source')) + ': ' + esc(book.source && book.source.site || '') + '</div>';
      flow.innerHTML = html + '<div class="end"></div>';

    function layout() {
      var W = vp.clientWidth; H = vp.clientHeight;
      var pad = Math.max(18, Math.round((W - 680) / 2));
      colW = W - 2 * pad; step = W;
      flow.style.width = colW + 'px';
      flow.style.marginLeft = pad + 'px';
      flow.style.columnWidth = colW + 'px';
      flow.style.columnGap = (2 * pad) + 'px';

      var maxH = H - 32 - 3 * S.fs;
      Array.prototype.forEach.call(flow.querySelectorAll('img[data-w]'), function (img) {
        var w = +img.getAttribute('data-w'), h = +img.getAttribute('data-h');
        var dw = Math.min(colW, maxH * w / h, w * 1.6);
        img.style.width = Math.round(dw) + 'px'; img.style.height = Math.round(dw * h / w) + 'px';
      });

      blockPage = [];
      Array.prototype.forEach.call(flow.querySelectorAll('[data-i]'), function (el) {

      });

        return { n: +el.getAttribute('data-n'), page: Math.floor((el.getBoundingClientRect().left - fr.left + 2) / step) };
      });
    }

    function curBlock() {
      var b = 0;
      for (var i = 0; i < blockPage.length; i++) { if (blockPage[i] != null && blockPage[i] <= page) b = i; else if (blockPage[i] > page) break; }
      return b;
    }
    function bookPage() { // textbook page shown at top of this screen
      var n = null;
      for (var i = 0; i < pgMarks.length; i++) { if (pgMarks[i].page <= page) n = pgMarks[i].n; else break; }
      if (n == null) { // before first marker of this chapter: previous chapter's last page
        for (var j = pgList.length - 1; j >= 0; j--) if (pgChapter[pgList[j]] < ch) { n = pgList[j]; break; }
      }
      return n == null ? (pgMarks[0] ? pgMarks[0].n : null) : n;
    }

    function show(p, anim) {
      page = Math.max(0, Math.min(pages - 1, p));
      flow.classList.toggle('anim', !!anim);
      flow.style.transform = 'translate3d(' + (-page * step) + 'px,0,0)';
      var bp = bookPage();
      footT.textContent = chapters[ch].title;
      footN.textContent = (bp != null ? t('page') + ' ' + bp + ' · ' : '') + (page + 1) + '/' + pages;
      i1.textContent = chapters[ch].title;
      i2.textContent = bp != null ? t('page') + ' ' + bp + ' / ' + pgList[pgList.length - 1] : '';
      if (bp != null && document.activeElement !== slider) slider.value = pgList.indexOf(bp);
      lsSet(posKey, { ch: ch, b: curBlock(), at: Date.now() });
    }

    function goBlock(ci, bi) {
      if (ci !== ch) renderChapter(ci);
      show(blockPage[bi] || 0, false);
    }
    function goBookPage(n) {
      if (!(n in pgChapter)) { toast(t('notFound')); return false; }
      if (pgChapter[n] !== ch) renderChapter(pgChapter[n]);
      for (var i = 0; i < pgMarks.length; i++) if (pgMarks[i].n === n) { show(pgMarks[i].page, false); return true; }
      show(0, false); return true;
    }
    function next() {
      if (page < pages - 1) show(page + 1, true);
      else if (ch < chapters.length - 1) { renderChapter(ch + 1); show(0, false); }
      else show(page, true);
    }
    function prev() {
      if (page > 0) show(page - 1, true);
      else if (ch > 0) { renderChapter(ch - 1); show(pages - 1, false); }
      else show(0, true);
    }
    function relayout() { var b = curBlock(); layout(); show(blockPage[b] || 0, false); }

    // ---- touch: swipe to turn pages
    var sx = 0, sy = 0, st = 0, dx = 0, horiz = null, touching = false;
    vp.addEventListener('touchstart', function (e) {
      if (e.touches.length > 1) { touching = false; return; }
      touching = true; horiz = null; dx = 0;
      sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now();
      flow.classList.remove('anim');
    }, { passive: true });
    vp.addEventListener('touchmove', function (e) {
      if (!touching) return;
      var x = e.touches[0].clientX, y = e.touches[0].clientY;
      dx = x - sx;
      if (horiz === null && (Math.abs(dx) > 8 || Math.abs(y - sy) > 8)) horiz = Math.abs(dx) > Math.abs(y - sy);
      if (horiz) {
        e.preventDefault();
        var atEdge = (dx > 0 && page === 0 && ch === 0) || (dx < 0 && page === pages - 1 && ch === chapters.length - 1);
        flow.style.transform = 'translate3d(' + (-page * step + dx * (atEdge ? 0.25 : 1)) + 'px,0,0)';
      }
    }, { passive: false });
    vp.addEventListener('touchend', function () {
      if (!touching) return; touching = false;
      if (!horiz) return;
      var v = Math.abs(dx) / Math.max(1, Date.now() - st);
      if (dx < -60 || (dx < -20 && v > 0.3)) next();
      else if (dx > 60 || (dx > 20 && v > 0.3)) prev();
      else show(page, true);
    });

    // ---- taps: left third back, right third forward, middle shows menus
    vp.addEventListener('click', function (e) {
      var sel = window.getSelection && String(window.getSelection());
      if (sel) return;
      if (reader.classList.contains('ui')) { reader.classList.remove('ui'); return; }
      var x = e.clientX / vp.clientWidth;
      if (x < 0.3) prev(); else if (x > 0.7) next();
      else if (e.target.tagName === 'IMG' && e.target.closest('figure')) openZoom(e.target);
      else if (e.target.closest && e.target.closest('figure svg')) {
        var sv = e.target.closest('figure svg'), vb = (sv.getAttribute('viewBox') || '0 0 300 150').split(/\s+/);
        var im = document.createElement('img');
        im.setAttribute('data-w', Math.round(vb[2] * 4)); im.setAttribute('data-h', Math.round(vb[3] * 4));
        var xml = sv.outerHTML.indexOf('xmlns=') < 0 ? sv.outerHTML.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"') : sv.outerHTML;
        im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml.replace(/style="[^"]*"/, ''));
        openZoom(im);
      }
      else reader.classList.add('ui');
    });
    // ---- picture viewer: tap a picture to see it full screen; tap again to enlarge, scroll to move
    function openZoom(img) {
      var z = document.createElement('div'); z.className = 'zoom';
      var big = false;
      z.innerHTML = '<div class="zoom-in"><img alt=""></div><button class="icon zoom-x" aria-label="' + esc(t('close')) + '">' + ICONS.close + '</button>';
      var zi = $('img', z); zi.src = img.src;
      var fit = function () {
        var W = window.innerWidth, H = window.innerHeight, w = +img.getAttribute('data-w'), h = +img.getAttribute('data-h');
        var s = Math.min(W / w, H / h) * (big ? 2.5 : 1);
        zi.style.width = Math.round(w * s) + 'px'; zi.style.height = 'auto'; zi.style.maxWidth = 'none'; zi.style.maxHeight = 'none';
      };
      zi.onclick = function (e) {
        var inr = $('.zoom-in', z), r = zi.getBoundingClientRect();
        var fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
        big = !big; fit();
        if (big) { inr.scrollLeft = fx * zi.offsetWidth - window.innerWidth / 2; inr.scrollTop = fy * zi.offsetHeight - window.innerHeight / 2; }
      };
      $('.zoom-x', z).onclick = function () { z.remove(); document.removeEventListener('keydown', zkey); };
      var zkey = function (e) { if (e.key === 'Escape') { z.remove(); document.removeEventListener('keydown', zkey); } };
      document.addEventListener('keydown', zkey);
      document.body.appendChild(z); fit();
    }

    function onKey(e) {
      if ($('.zoom')) return;
      if ($('.sheet')) { if (e.key === 'Escape') closeSheet(); return; }
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    }
    document.addEventListener('keydown', onKey);
    var rt; function onResize() { clearTimeout(rt); rt = setTimeout(relayout, 150); }
    window.addEventListener('resize', onResize);
    // wheel on desktop
    var wheelLock = 0;
    vp.addEventListener('wheel', function (e) {
      var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(d) < 20 || Date.now() < wheelLock) return;
      wheelLock = Date.now() + 350; if (d > 0) next(); else prev();
    }, { passive: true });

    slider.addEventListener('input', function () { i2.textContent = t('page') + ' ' + pgList[+slider.value] + ' / ' + pgList[pgList.length - 1]; });
    slider.addEventListener('change', function () { goBookPage(pgList[+slider.value]); });

    // ---- sheets
    function closeSheet() { var a = $('.sheet'), b = $('.sheet-bg'); if (a) a.remove(); if (b) b.remove(); }
    function openSheet(html) {
      closeSheet();
      var bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.onclick = closeSheet;
      var sh = document.createElement('div'); sh.className = 'sheet'; sh.innerHTML = html;
      document.body.appendChild(bg); document.body.appendChild(sh);
      return sh;
    }

    $('.b-toc').onclick = function () {
      var html = '<h3>' + esc(t('contents')) + '</h3>' +
        '<div class="goto"><input type="number" inputmode="numeric" placeholder="' + esc(t('gotoPage')) + '"><button class="btn primary">' + esc(t('go')) + '</button></div><div class="toc">';
      var lastSec = null;
      chapters.forEach(function (c, ci) {
        if (c.section && c.section !== lastSec) html += '<div class="sec">' + esc(c.section) + '</div>';
        lastSec = c.section || lastSec;
        html += '<a href="#" data-c="' + ci + '" data-b="0"' + (ci === ch ? ' class="cur"' : '') + '>' + esc(c.title) +
          (c.pages ? '<span class="p">' + c.pages[0] + '</span>' : '') + '</a>';
        if (c.sub) {
          c.sub.forEach(function (s) {
            if (s.b != null) html += '<a href="#" class="sub" data-c="' + ci + '" data-b="' + s.b + '">' + esc(s.title) + '</a>';
          });
        } else {
          c.blocks.forEach(function (b, bi) {
            if (b.t === 'h2' && bi > 0) html += '<a href="#" class="sub" data-c="' + ci + '" data-b="' + bi + '">' + b.h.replace(/<[^>]+>/g, '') + '</a>';
          });
        }
      });
      var sh = openSheet(html + '</div>');
      var cur = $('.cur', sh); if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'center' });
      sh.addEventListener('click', function (e) {
        var a = e.target.closest('a[data-c]'); if (!a) return;
        e.preventDefault(); closeSheet(); reader.classList.remove('ui');
        goBlock(+a.getAttribute('data-c'), +a.getAttribute('data-b'));
      });
      var inp = $('input', sh);
      function go() { if (goBookPage(parseInt(inp.value, 10))) { closeSheet(); reader.classList.remove('ui'); } }
      $('.goto button', sh).onclick = go;
      inp.onkeydown = function (e) { if (e.key === 'Enter') go(); };
    };

    $('.b-set').onclick = function () {
      function seg(key, opts) {
        return '<div class="seg" data-k="' + key + '">' + opts.map(function (o) {
          return '<button data-v="' + o[0] + '"' + (o[2] ? ' class="' + o[2] + (String(S[key]) === String(o[0]) ? ' on' : '') + '"' : (String(S[key]) === String(o[0]) ? ' class="on"' : '')) + '>' + o[1] + '</button>';
        }).join('') + '</div>';
      }
      var sh = openSheet(
        '<h3>' + esc(t('settings')) + '</h3>' +
        '<div class="set"><label>' + esc(t('fontSize')) + '</label><div class="seg"><button data-fs="-2" style="font-size:14px">A−</button><button class="fsv" disabled>' + S.fs + '</button><button data-fs="2" style="font-size:20px">A+</button></div></div>' +
        '<div class="set"><label>' + esc(t('theme')) + '</label>' + seg('theme', [['light', t('light'), 'swatch'], ['sepia', t('sepia'), 'swatch'], ['dark', t('dark'), 'swatch'], ['contrast', t('contrast'), 'swatch']]) + '</div>' +
        '<div class="set"><label>' + esc(t('font')) + '</label>' + seg('font', [['serif', '<span style="font-family:Georgia,serif">' + esc(t('serif')) + '</span>'], ['sans', '<span style="font-family:Roboto,Arial,sans-serif">' + esc(t('sans')) + '</span>']]) + '</div>' +
        '<div class="set"><label>' + esc(t('spacing')) + '</label>' + seg('lh', [[1.35, '1.35'], [1.55, '1.55'], [1.8, '1.8']]) + '</div>' +
        '<div class="set"><label>' + esc(t('lang')) + '</label>' + seg('ui', [['ru', 'Русский'], ['ky', 'Кыргызча']]) + '</div>');
      sh.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.hasAttribute('data-fs')) {
          S.fs = Math.max(13, Math.min(34, S.fs + +b.getAttribute('data-fs')));
          $('.fsv', sh).textContent = S.fs;
        } else {
          var k = b.parentNode.getAttribute('data-k'); if (!k) return;
          var v = b.getAttribute('data-v'); S[k] = k === 'lh' ? +v : v;
          Array.prototype.forEach.call(b.parentNode.children, function (x) { x.classList.toggle('on', x === b); });
          if (k === 'ui') { applySettings(); closeSheet(); route(); return; }
        }
        applySettings(); relayout();
      });
    };

    cleanup = function () {
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('resize', onResize);
      closeSheet();
    };

    var pos = lsGet(posKey, null);
    if (pos && chapters[pos.ch]) goBlock(pos.ch, pos.b || 0); else { renderChapter(0); show(0, false); }
    // fonts can change metrics after first paint
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  }

  // ---------------------------------------------------------------- boot
  applySettings();
  window.addEventListener('hashchange', route);
  route();
  if (!EMB && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline support unavailable */ });
  }
})();
</script>
</body>
</html>

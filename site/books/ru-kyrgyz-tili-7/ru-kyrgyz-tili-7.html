<title>Кыргыз тили 7</title>
<style>/* Mobile textbook reader. No external fonts or libraries: everything works offline. */
:root {
  --bg: #ffffff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3;
  --panel: #f6f6f6; --accent: #1f6feb; --accent-fg: #ffffff;
  --fs: 19px; --lh: 1.55;
  --font: Georgia, "Noto Serif", "DejaVu Serif", "Times New Roman", serif;
  --bar-h: 48px; --foot-h: 28px;
}
[data-theme="sepia"] { --bg: #f5ecd9; --fg: #4a3b2a; --muted: #8a7458; --line: #e0d2b4; --panel: #ece0c6; --accent: #9a5b13; }
[data-theme="dark"]  { --bg: #111315; --fg: #d8d8d8; --muted: #8c8c8c; --line: #2a2d31; --panel: #1b1e21; --accent: #6ea8ff; --accent-fg: #0b0b0b; }
[data-theme="contrast"] { --bg: #000000; --fg: #ffffff; --muted: #c8c8c8; --line: #444; --panel: #151515; --accent: #ffd400; --accent-fg: #000; }
[data-font="sans"] { --font: Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 16px/1.4 Roboto, "Noto Sans", Arial, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- Library ---------- */
.lib { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lib h1 { font-size: 22px; margin: 8px 0 4px; }
.lib .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.lib-head { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
.lib-head h1 { flex: 1; margin: 0; }
.school { display: flex; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.school button { flex: 1; min-height: 44px; padding: 0 10px; font-size: 15px; background: var(--panel); }
.school button + button { border-left: 1px solid var(--line); }
.school button.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.my-link { flex: 0 0 auto; font-weight: 600; min-height: 40px; padding: 0 12px; font-size: 14px; }
.grade { margin-bottom: 10px; }
.grade-h { display: flex; width: 100%; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 18px; font-weight: 600; text-align: left; }
.grade-h::after { content: '›'; font-size: 24px; color: var(--muted); margin-left: 10px; transition: transform .15s; }
.grade.open .grade-h::after { transform: rotate(90deg); }
.grade-h .n { margin-left: auto; font-size: 14px; font-weight: 400; color: var(--muted); }
.grade-b { padding: 0 2px; }
.grade-t { font-size: 20px; margin: 18px 0 0; }
.subj { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.bk { border-bottom: 1px solid var(--line); padding: 4px 0 12px; }
.bk:last-child { border-bottom: 0; }
.bk-t { font-size: 17px; font-weight: 600; }
.bk-s { font-size: 14px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bk-m { color: var(--muted); font-size: 13px; margin: 3px 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: .5; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.bk-h { display: flex; align-items: flex-start; gap: 4px; }
.bk-h .bk-t { flex: 1; padding-top: 10px; }
.bk .row { gap: 4px; }
.bk .row .btn { min-height: 40px; padding: 0 18px; font-size: 14px; margin-right: 8px; }
.bk .icon { color: var(--muted); flex: 0 0 auto; }
.bk .icon[disabled] { opacity: .5; }
.bk .icon.on { color: var(--accent); }
.bk .star.on svg { fill: currentColor; }
.bk .star.on { color: #e3a008; }
.share-opts { display: flex; flex-direction: column; gap: 10px; }
.share-opts .note { margin-top: 0; }
.sheet h3 .icon { flex: 0 0 auto; }

/* ---------- Reader ---------- */
.reader { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; user-select: text; }
.viewport { position: absolute; left: 0; right: 0; top: 0; bottom: var(--foot-h); overflow: hidden; }
.flow {
  height: 100%; column-fill: auto; padding: 20px 0 12px;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  will-change: transform; transform: translate3d(0,0,0);
  hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
}
.flow.anim { transition: transform .25s ease-out; }
.flow p { margin: 0 0 .15em; text-indent: 1.4em; text-align: left; }
.flow p.ni { text-indent: 0; }
.flow h1, .flow h2, .flow h3 { font-family: Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.25; break-after: avoid; page-break-after: avoid; }
.flow h1 { font-size: 1.35em; margin: .2em 0 .8em; text-align: center; }
.flow h2 { font-size: 1.15em; margin: 1.1em 0 .5em; }
.flow h3 { font-size: 1.0em; margin: 1em 0 .4em; }
.flow .verse { margin: .6em 0 .8em 1em; break-inside: auto; }
.flow .verse div { text-indent: -1em; padding-left: 1em; text-align: left; }
.flow .verse .gap { height: .7em; }
.flow figure { margin: .8em 0; text-align: center; break-inside: avoid; page-break-inside: avoid; }
.flow figure img { max-width: 100%; height: auto; border-radius: 4px; background: var(--panel); }
.flow figcaption { font-size: .8em; color: var(--muted); margin-top: .3em; }
.flow .box { border-left: 3px solid var(--accent); padding: .1em 0 .1em .7em; margin: .7em 0; }
.flow .pg { font: 11px/1 Roboto, Arial, sans-serif; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 4px; margin: 0 3px; vertical-align: 2px; text-indent: 0; white-space: nowrap; user-select: none; }
.flow .end { height: 1px; }
.flow .endnote { text-align: center; color: var(--muted); font-size: .8em; margin-top: 2em; font-family: Roboto, Arial, sans-serif; }
[data-theme="dark"] .flow img, [data-theme="contrast"] .flow img { filter: brightness(.9); }

.foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot-h); display: flex; align-items: center;
  justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.foot .t { overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }

.bar { position: absolute; left: 0; right: 0; background: var(--panel); border-color: var(--line); z-index: 5;
  transition: transform .2s; display: flex; align-items: center; }
.bar.top { top: 0; height: var(--bar-h); border-bottom: 1px solid var(--line); transform: translateY(-100%); padding: 0 4px; }
.bar.bottom { bottom: 0; border-top: 1px solid var(--line); transform: translateY(100%); padding: 10px 16px 14px; flex-direction: column; align-items: stretch; gap: 6px; }
.reader.ui .bar { transform: none; }
.bar .title { flex: 1; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.bar .info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* ---------- Sheets (TOC, settings) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85%; overflow: auto; background: var(--bg);
  border-radius: 16px 16px 0 0; z-index: 11; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
.sheet h3 { margin: 10px 0 12px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.toc a { display: block; padding: 11px 4px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 15px; }
.toc a.sub { padding-left: 20px; font-size: 14px; color: var(--muted); }
.toc a.cur { color: var(--accent); font-weight: 600; }
.set { margin: 14px 0; }
.set label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; }
.seg button.on { border: 2px solid var(--accent); font-weight: 600; }
.swatch[data-v="light"] { background: #fff; color: #1b1b1b; }
.swatch[data-v="sepia"] { background: #f5ecd9; color: #4a3b2a; }
.swatch[data-v="dark"] { background: #111315; color: #d8d8d8; }
.swatch[data-v="contrast"] { background: #000; color: var(--accent-fg); }
.goto { display: flex; gap: 8px; }
.goto input { flex: 1; min-height: 44px; font-size: 16px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px;
  border-radius: 20px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Textbook elements produced by tools/convert_pdf.py ---------- */
.flow .tasks, .flow .gloss { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45;
  background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0; }
.flow .tasks p, .flow .gloss p { margin: 0 0 .35em; text-align: left; }
.flow .gloss { border-left: 3px solid var(--accent); }
.flow p.note { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; font-style: italic; text-indent: 0; margin: .6em 0; }
.flow p.attr { text-align: right; text-indent: 0; font-style: italic; color: var(--muted); margin: .1em 0 .8em; }
.flow p.sep { text-align: center; text-indent: 0; color: var(--muted); margin: .5em 0; letter-spacing: .3em; }
.flow h2 .pg, .flow h3 .pg { font-weight: normal; }
.toc .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 4px 2px; }
.toc a .p { float: right; color: var(--muted); font-size: 13px; margin-left: 8px; }

/* ---------- Elements produced by tools/convert_layout.py (typeset textbooks) ---------- */
.flow figure img { cursor: zoom-in; }
.flow h4.mk { font: 700 .78em/1.3 Roboto, "Noto Sans", Arial, sans-serif; letter-spacing: .05em; color: var(--accent);
  margin: 1em 0 .3em; break-after: avoid; page-break-after: avoid; }
.flow p.hl { color: var(--accent); text-indent: 0; }
.flow p.small { font-size: .82em; text-indent: 0; color: var(--muted); }
.flow sup, .flow sub { font-size: .7em; line-height: 0; }
.flow .kbox { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45; background: var(--panel);
  border-radius: 8px; padding: .45em .7em; margin: .5em 0; border-left: 3px solid var(--accent); }
.flow .kbox > b { display: block; }
.flow .frame { background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0;
  font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; line-height: 1.45; }
.flow .frame p { text-indent: 0; margin: 0 0 .35em; text-align: left; }
.flow .tbl { margin: .8em 0; font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .8em; line-height: 1.35; }
.flow .tbl .tt { font-weight: 600; text-indent: 0; text-align: center; margin-bottom: .3em; }
.flow .tbl table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.flow .tbl th, .flow .tbl td { border: 1px solid var(--line); padding: .3em .35em; vertical-align: top; text-align: left; overflow-wrap: anywhere; hyphens: auto; }
.flow .tbl th { background: var(--panel); }
.flow .tbl tr { break-inside: avoid; page-break-inside: avoid; }

.zoom { position: fixed; inset: 0; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; background: rgba(0,0,0,.92); z-index: 30; }
.zoom-in { position: absolute; inset: 0; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
.zoom-in img { margin: auto; flex: none; touch-action: pan-x pan-y; object-fit: contain; background: #fff; cursor: zoom-in; }
.zoom-x { position: absolute; top: 8px; right: 8px; color: #fff; background: rgba(0,0,0,.5); z-index: 31; }
.flow h4.sh { font: 700 .95em/1.3 Roboto, "Noto Sans", Arial, sans-serif; text-align: center; margin: .8em 0 .4em; break-after: avoid; page-break-after: avoid; }

/* maths books */
.flow h4.ex, .flow h4.try { font-family: Roboto, Arial, sans-serif; margin: 1.1em 0 .3em; font-size: 1em; }
.flow h4.ex { display: inline-block; background: #f7e400; color: #111; padding: .1em .6em; border-radius: 3px; }
.flow h4.try { color: var(--accent); }
.flow p.goal { font-size: .85em; text-indent: 0; background: var(--panel); border-radius: 8px; padding: .4em .7em; }
.flow b.bd { display: inline-block; text-indent: 0; padding: 0 .4em; border-radius: 1em; background: var(--fg); color: var(--bg);
  font: bold .8em/1.45 Roboto, Arial, sans-serif; margin-right: .2em; }
.flow b.nb { display: inline-block; text-indent: 0; min-width: 1.4em; border-radius: 4px; background: var(--accent); color: var(--accent-fg);
  text-align: center; font-size: .8em; margin-right: .3em; }
.flow .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.15; margin: 0 .1em; }
.flow .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .15em; }
.flow p.ml { text-indent: 0; padding-left: 1em; }
.flow p.side { font-size: .85em; }
.flow details.ans { margin: .3em 0 .8em; font-size: .9em; }
.flow details.ans summary { color: var(--accent); cursor: pointer; font-family: Roboto, Arial, sans-serif; }

/* wide tables become one card per row on phones */
@media (max-width: 560px) {
  .flow .tbl.cards table, .flow .tbl.cards tbody, .flow .tbl.cards tr, .flow .tbl.cards td { display: block; width: auto; }
  .flow .tbl.cards tr:first-child { display: none; }
  .flow .tbl.cards tr { border: 1px solid var(--line); border-radius: 8px; margin: .5em 0; padding: .3em .5em; }
  .flow .tbl.cards td { border: 0; padding: .15em 0; }
  .flow .tbl.cards td::before { content: attr(data-l); display: block; font: 600 .75em/1.3 Roboto, Arial, sans-serif; color: var(--muted); }
  .flow .tbl.cards td:first-child { font-weight: 600; }
}
.flow figure.vec svg { max-width: 100%; height: auto; display: inline-block; background: #fff; border-radius: 4px; cursor: zoom-in; }
[data-theme="dark"] .flow figure.vec svg, [data-theme="contrast"] .flow figure.vec svg { filter: brightness(.9); }
.flow .rt { border-top: 1px solid currentColor; padding-top: 1px; margin-left: 1px; }
.flow .it { display: inline-block; max-width: 100%; margin-right: .9em; text-indent: 0; }
</style>

 окуучуларга эмнени каалашат?","З. Билимдүү окуучу эмнеге жетишет?","4. Билим күнүндө кимдер 1-класска кабыл алынат?","2. Макалдарды орус тилине которгула жана жаттагыла.","Окуу – билим булагы,","Билим – өмүр чырагы.","Билим – элге, суу – жерге.","Билимдүүгө дүйнө жарык."]},{"t":"h3","h":"БИБЛИОТЕКА"},{"t":"p","h":"СОШ №3 Инв."}],"sub":[{"title":"БИЛИМ КҮНҮ","b":3},{"title":"БИБЛИОТЕКА","b":8}],"pages":[19,19]},{"title":"§ 2. 6-КЛАССТА ӨТҮЛГӨН МАТЕРИАЛДЫ КАЙТАЛОО ПОВТОРЕНИЕ ПРОЙДЕННОГО МАТЕРИАЛА 6-КЛАССА Ат атоочту кайталоо – Повторение местоимения","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"20\">20<\/span>§ 2. 6-КЛАССТА ӨТҮЛГӨН МАТЕРИАЛДЫ КАЙТАЛОО ПОВТОРЕНИЕ ПРОЙДЕННОГО МАТЕРИАЛА 6-КЛАССА Ат атоочту кайталоо – Повторение местоимения"},{"t":"p","h":"2. Ырды окугула, ат атоочторду тапкыла."},{"t":"h3","h":"ЭНЕ ТИЛИМ – ӨЗ ТИЛИМ"},{"t":"p","h":"Эне тилим – өз тилим, Эси жоктук иш кылат. Өзүнүн эне тилинде, Сүйлөбөсө сөздү ким."},{"t":"v","l":["Эне тилим – карегим,","Сенде менин дарегим.","Сен турганда мен бармын,","Биз турганда бар элим.","Т. Арыков","","Ь Эске тушургуле: – Вспомните:"]},{"t":"p","h":"1. Ат атооч деген эмне? – Что такое местоимение?"},{"t":"p","h":"2. Ат атоочтор мааниси бо- – На какие виды делятся местоюнча кандай турлерге белунет? имения по значению?"},{"t":"p","h":"3. Жактама ат атоочтор – Что такое личные местоимедеген эмне жана ага кайсы ат"},{"t":"v","l":["атоочтор кирет?","ния и какие местоимения","относятся к ним?"]},{"t":"p","h":"4. Шилтеме ат атооч деген – Что такое указательные местоэмне жана ага кайсы ат атоочтор"},{"t":"v","l":["кирет?","имения и какие местоимения","относятся к ним?"]},{"t":"p","h":"5. Сурама ат атооч деген – Что такое вопросительные эмне жана ага кайсы ат атоочтор кирет?"},{"t":"p","h":"местоимения и какие местоимения относятся к ним?"},{"t":"p","h":"3. Биринчи катардагы ат атоочторду экинчи катардагы суйлемдерге маанисине карай тууралап байланыштыргыла,"},{"t":"raw","h":"<h4 class=\"mk\">Мен Бул Биз Ким Бардыгы Эч качан<\/h4>"},{"t":"v","l":["салтанаттуу майрамга мектепке бара жатабыз.","ата-энеден белек алды?","кыргыз тилин окуп жатамын.","менин гүлдестем.","эшиктин коңгуроосун басты.","бүгүн сабакка толук келишти.","Кимдир бирөө| адамдын көңүлүн оорутпа,"]},{"t":"p","h":"<span class=\"pg\" data-n=\"21\">21<\/span>4. Текстти окугула, айрым сөздөрдү ат атоочко айландыргыла."},{"t":"h3","h":"ОКУУ ЖЫЛЫ БАШТАЛГАНДА"},{"t":"p","h":"Индияда окуу жылы июнь айында башталат. Бул күнү мугалимдер окуучуларга эң кызыктуу элдик легендалардан айтып беришет. Ата-энелер мугалимдерди жаңы окуу жылы менен куттукташат. Мугалимдердин моюндарына гүл гирляндаларын илишет."},{"t":"p","h":"Японияда апрель айында, алчалар гүлдөгөндө окуу башталат. Мектепке окуучулар эшик алдына бут кийимдерин чечип киришет. Ал эми Кытайда окуучулар окууга кыпкызыл бажырайган гүлдестелерди алып келишет. Окуу – дене тарбия сабагынан башталат. Германияда болсо бул күнү балдар түркүн таттуу салынган баштыкчаларды белекке алып, абдан кубанышат. Финляндияда окуучулар жыл аягына чейин мектеп эмеректерин булгабай, сындырбай таза сактоого сөз беришет. Эгерде ант аткарылбаса, айып төлөнөт."},{"t":"p","h":"? 1. Окуу жылы Индияда качан башталат?"},{"t":"p","h":"2. Мугалимдер окуучуларга эмнелерди айтып беришет? З. Ата-энелер мугалимдерди кантип куттукташат?"},{"t":"p","h":"4. Окуу кайсы өлкөдө алча гүлдөгөндө башталат экен?"},{"t":"p","h":"5. Германияда балдар белекке эмне алышат?"},{"t":"v","l":["6. Финляндияда окуучулар кандай ант беришет?","","© элдик жомоктор – народные","сказки","алча – вишня","гүлдөө – цветение"]},{"t":"p","h":"туркун таттуу – разные сла-"},{"t":"v","l":["дости","баштыкчалар – пакеты","эмеректер – мебель (парты,","стулья)","булгабоо – не испачкать","сындырбоо – не ломать","сөз берүү – обещать"]},{"t":"p","h":"ант – клятва, клятвенное обещание"},{"t":"p","h":"5. Төмөнкү сүйлөмдөргө суроо түзгүлө да, кыргызча сүйлөшкүлө,"},{"t":"p","h":"– Мен Долоноту айылындагы Т. Атаев атындагы орто мектепте окуймун."},{"t":"p","h":"– Мен 7-класста өзүмдүн курбуларым менен бирге окуймун."},{"t":"p","h":"– Бизге кыргыз тили сабагы абдан жагат."},{"t":"v","l":["– Кыргыз тили сабагынан бизди Айгүл эжей окутат.","– Биз сабакта кыргыз тилинде гана сүйлөшөбүз.","– Окуучулар кыргызча ырларды жатка айта алышат."]},{"t":"p","h":"<span class=\"pg\" data-n=\"22\">22<\/span>6. Төмөнкү макалдардын маанисин түшүндүргүлө жана ат атоочторду аныктагыла."},{"t":"v","l":["Бирөөгө ор казсаң, өзүң түшөсүң.","Өз жакшылыгыңды милдет кылба,","Бирөөнүн жакшылыгын эч качан унутпа.","Өзөктөн чыккан өрт жаман,","Өздөн чыккан жат жаман.","Жогорудагы макалдарды жаттагыла.","1) Ат атоочтун маанисин кайсы вариант билдирет?","а) заттын атын билдирет","б) заттын сын-сыпатын билдирет","в) кыймыл-аракетти билдирет","г) затты жалпылап көрсөтүүчү сөздөр"]},{"t":"p","h":"2) Эч ким, сиз, өзүм, ушул, бир нерсе, канча – бул сөздөр ат атоочтун кайсы түрлөрүнө тиешелүү, ар биринин тушуна тууралап жазгыла."},{"t":"p","h":"1. Жактама ат атооч —"},{"t":"v","l":["2. Шилтеме ат атооч —","3. Сурама ат атооч —","4. Тангыч ат атооч —","5. Аныктама ат атооч -","6. Белгисиз ат атооч —"]},{"t":"h3","h":"$ З. Ат атоочтун түрлөрүн кайталоо—"},{"t":"p","h":"Повторение видов местоимений Ь эске тушургуле: – Вспомните 7. Ким? Кимдер? Кайсы? суроолоруна жооп беруучу ат атоочторду жендегуле."},{"t":"v","l":["Улгу: Ким? – мен, сен, ал, биз","Атооч: мен","Илик: менин","Барыш: мага","Табыш: мени","Жатыш: менде","Чыгыш: менден"]},{"t":"p","h":"8. Кеп чекиттин ордуна ат атоочторго жендеме мучелерду улап, суйлемдерду кечуруп жазгыла."},{"t":"p","h":"1. Биз... мектеп Ысык-Кел аймагында жайгашкан. 2. Алар... чоң жаңылык күтүп жатат. 3. Жылдыз сен... канча жаш улуу?"},{"t":"p","h":"4. Мен... Ч. Айтматовдун жаңы китеби бар. 5. Рысбек тээ алыстан кимдир бирөө... байкады."},{"t":"p","h":"9. Кыргызча маек кургула. 1. Ат атоочторду тиешелүү жөндөмөгө коюп (кашааларды ачып) сүйлөшкүлө."},{"t":"p","h":"– (Сен) туулуп-өскөн жериң кайсы?"},{"t":"p","h":"<span class=\"pg\" data-n=\"23\">23<\/span>– (Мен) туулуп-өскөн жерим..."},{"t":"p","h":"– (Ал) көрүнүктүү эмнелери бар?"},{"t":"p","h":"– (Ал) көрүнүктүү жерлери .., жана башкалар аталат, – (Сен) жана (сен) досторуңа бул жайлар жагабы?"},{"t":"p","h":"– Албетте, (мен) жана (ал) абдан жагат."},{"t":"p","h":"2. Суроолорго жооп берүүдө ат атоочторду туура коюп сүйлөшкүлө, (бардыгы, алардын, аны, биздин, анын)"},{"t":"v","l":["– Мекенибиз – Кыргызстан кандай өлкө?","Кыргызстан эгемендүү, көп улуттуу елке.","– Ата-Журтубуз менен сыймыктанабызбы?","– Ооба, бардыгыбыз ... менен абдан сыймыктанабыз,","– Мамлекетибиздин кандай символикалары бар?"]},{"t":"p","h":"– ... мамлекеттик Туусу, Герби, Гимни, Конституциясы жана Тили бар."},{"t":"v","l":["– Өлкөдө элдин биримдиги кандай?","– „. биримдиги өтө бекем.","– Улуттар аралык ынтымагы кандай?","ынтымактуу жашашат."]},{"t":"p","h":"10. Жогорку диалогдун мазмунунан маанилеш сөздөрдү таап, сүйлөм түзгүлө."},{"t":"p","h":"Улгу: Мекен – Ата-Журт – туулуп-өскөн жер, Менин Мекеним – Кыргызстан. Биз Ата-Журтубуз менен абдан сыймыктанабыз. Силер туулуп-өскөн жериңерди баалай билгиле!"},{"t":"p","h":"11, Текстти окугула."}],"sub":[{"title":"ЭНЕ ТИЛИМ – ӨЗ ТИЛИМ","b":2},{"title":"ОКУУ ЖЫЛЫ БАШТАЛГАНДА","b":17},{"title":"$ З. Ат атоочтун түрлөрүн кайталоо—","b":39}],"pages":[20,23]},{"title":"КЫРГЫЗСТАН – МЕНИН МЕКЕНИМ","blocks":[{"t":"h3","h":"КЫРГЫЗСТАН – МЕНИН МЕКЕНИМ"},{"t":"p","h":"Биздин Мекенибиз – Кыргызстан. Анын жалпы аянты 198 чарчы чакырымга барабар. Азыркы маалымат боюнча өлкөбүздө 5 миллиондон ашуун калк жашайт. Бардыгы жети аймак бар. Алар Чүй, Ош, Жалал-Абад, Баткен, Ысык-Көл, Талас, Нарын деп аталат, Кыргызстандын борбору – Бишкек шаары. 1991-жылдын 31-августу Кыргызстандын көз карандысыздыгынын күнү, 1993- жылы эгемендүү Кыргыз Республикасынын биринчи Конституциясы кабыл алынган. Ушул эле жылы улуттук валютабыз – сомго ээ болгонбуз. Аны пайдалануу менен эсеп, соода-сатык иштерин эркин жүргүзөбүз. 1992-жылы 5-мартта мамлекеттик Туубуз (авторлору: С. Иптаров, Б. Жайчыбеков, Э. Айдарбеков, Ж. Матаев, М. Сыдыков) кабыл алынган. Андагы негизги белгилер Күн жана т <span class=\"pg\" data-n=\"24\">24<\/span>боз үйдүн түндүгү. Түндүк – элибиздин тарыхый жашоосунун чексиздиги, үзүлбөгөн өмүрдүн символу. Кун – түрлүү улуттарга нурун тегиз чачыратып турат. 1992-жылы 18-декабрда мамлекеттин салтанаттуу Гимни бекитилген. Гимндин сөзү Ж. Садыков менен Ш. Кулиевдики, музыкасы Н. Давлесов менен К. Молдобасановдуку. Аны бардыгы жатка билишет жана ырдашат. Ал эми 1994-жылы 14-январда мамлекеттик Герб кабыл алынган. Гербдин авторлору А. Абдраев, С. Думанаев. Анда касиеттүү Ысык-Көлгө, ыйык Ала-Тоого алтын нурун чачыраткан Күн жана канатын жайган айкөл Манастын Ак шумкары тартылган."},{"t":"p","h":"Биз мекенибиз менен сыймыктанабыз жана даңктанабыз! ® көз карандысыз – независимый тарыхый жашоо – историческая жизнь чексиз – беспредельный, без-"},{"t":"v","l":["граничный","сыймыктануу – гордиться","боз үйдүн түндүгү – верхний","деревянный круг юрты"]},{"t":"p","h":"ак шумкар – белый кречет осо-"},{"t":"v","l":["бый, самый быстролетный","среди птиц","үзүлбөгөн өмүр – бесперерывная","(долгая) жизнь","соода – торговля","ыйык – священный","улут – нация","мамлекет – государство","айкөл – великодушный","ГЭ 1. Тексттен алынган сөздөрдү жаттоо.","2. Монологду жатка айтып берүү.","З. Төмөнкү ырды обону менен ырдоону үйрөнгүлө."]},{"t":"h3","h":"МЕКЕНИМ"},{"t":"v","l":["Кымбатым өскөн жер мекеним,","Сен десем толгонуп кетемин.","Апамдай асырап өстүргөн,","Аныңды мен актаар бекемин."]},{"t":"p","h":"Тоолоруң, түздөрүң, белесиң, Көңүлгө жат болуп келесиң. Киндик кан тамызган Ата журт, Чаалыксам күч-кубат бересиң. Т. Кожомбердиев"}],"sub":[{"title":"МЕКЕНИМ","b":8}],"pages":[24,24]},{"title":"§ 4. Тууранды сөздөр – Подражательные слова","blocks":[{"t":"h3","h":"§ 4. Тууранды сөздөр – Подражательные слова"},{"t":"p","h":"Жандуу жана жансыз зат-"},{"t":"v","l":["тардан чыккан үндү, элести!","Подражательные","слова – это особая часть речи,"]},{"t":"p","h":"туурап көрсөткөн сөздөр т у у! которая обозначает образ или ранды сөздөр деп аталат. звуки, издаваемые живыми существами или производимые Тууранды сездерге: какими-либо предметами, К подражательным словам относятся:"},{"t":"p","h":"тарс, жарк, кобур-собур, шака-шак, маа, мөө, муу, жалп, жалбырт, зуу, арс, карч, шак-шак, лап-лап, кажы-кужу, ызы-чуу ж.б. сөздөр кирет."},{"t":"p","h":"<span class=\"pg\" data-n=\"25\">25<\/span>12. Тууранды сездерду тапкыла, 1. Кобур-собур ундер угулду. 2. Алыстан эрбен-сербен караандар көрүндү. 3. Салтанат эки жагын элтен-селтен каранат."},{"t":"p","h":"4. Момун карыяныкынан кажы-кужу үндөр чыкты. 5. Тарс-тарс атылган мылтыктын үнү жаңырды. 6. Бүгүн лап-лап жаап жаткан кар күчөдү."},{"t":"p","h":"13. Төмөнкү сүйлөмдөрдү көчүрүп жазып, тууранды сөздөрдүн астын сызгыла."},{"t":"p","h":"1. Таштак жолдо кетип бара жаткан ат арабанын дөңгөлөктөрү калдыр-күлдүр этет. 2. Жумабүбү эне уулун жал-жал карады. З.Ажардын мууну бошоп, көз жашы мөлт-мөлт тамчылады."},{"t":"p","h":"4. Чагылган жарк-журк этип, күн күркүрөдү. 5. Айдоо тараптан трактордун тытыр-тытыр үнү басылбады."},{"t":"p","h":"14, Тууранды сөздөрдү ажыраткыла."},{"t":"p","h":"Жарк-журк, тарсылдады, тып-тып, чакылдайт, арс, маа, мөө, элеңдеген, жылт-жылт, ызы-чуу, жалбырт."},{"t":"p","h":"15. Тууранды сөздөрдү сүйлөмдөрдөн ажыратып, дептериңерге көчүрүп жазгыла."},{"t":"p","h":"1. Чоң кеседеги кымыз мелт-калт этет. 2. Жамгыр тып басылып, күн чайыттай ачылды. 3. Арс этип асылган иттин үнүнөн Саткын чочуп кетти. 4. От тез эле жалп-жулп өчтү. 5. Көл толкуну шарп-шурп этип жээкке урунат."},{"t":"p","h":"16. Төмөнкү тууранды сөздөрдүн кайсынысы жандуу жана жансыз заттарга тиешелүү экенин тапкыла."},{"t":"p","h":"1. Маа-... ‚ 2. шак-шак- ... ‚ 3. чарт-чурт-... ‚4. элтең-селтең-..., 5. мелт-калт, 6. тытыр-тытыр, 7.арс-...‚ 8. тарс- ...."},{"t":"p","h":"1 1. _ч сөздөргө кандай сөздөр кирет жана 6 сүйлөм мисал келтирип, эрежесин айтып бергиле,"}],"sub":[],"pages":[25,25]},{"title":"§ 5. Тууранды сөздөрдүн маанисине карай бөлүнүшү —","blocks":[{"t":"h3","h":"§ 5. Тууранды сөздөрдүн маанисине карай бөлүнүшү —"},{"t":"p","h":"Виды подражательных слов Тууранды сөздөр маанисине карай табыш тууранды жана элес тууранды сөздөр болуп экиге бөлүнөт."},{"t":"p","h":"По значению подражательные слова делятсяна звукоподражательные и образно-подражательн ые слова."},{"t":"p","h":"<span class=\"pg\" data-n=\"26\">26<\/span>Табыш тууранды сөздөр:"},{"t":"p","h":"Жандуу жана жансыз заттардын үнүн, табышын тууроо иретинде айтылган сөздөр т а б ы ш тууранды сөздөр деп аталат."},{"t":"p","h":"Табыш тууранды сөздөргө төмөнкү сөздөр кирет:"},{"t":"v","l":["Звукоподражательные слова:","Звукоподражательными","словами называются слова,","имитирующие голоса и звуки,"]},{"t":"p","h":"издаваемые живыми и неживыми предметами."},{"t":"p","h":"К звукоподражательным словам относятся такие слова, как:"},{"t":"p","h":"тарс, карс, курс, шылдыр, калдыр, арс, маа, мөө, шуу-шуу. шаңк, шака-шука, 17. Төмөнкү сүйлөмдөрдү окуп, табыш тууранды сөздөрдү дептериңерге көчүрүп жазгыла."},{"t":"p","h":"1. Угулган чуру-чуу, күрү-гүү күчөдү. 2. Бөлмөнүн ичи тып-тынч, шырп дабыш чыкпайт. З. Чыр-чыр сайраган канаттуулар учуп конушат. 4. Шамал күчөп, толкундар шарп-шурп жээкке урунат."},{"t":"p","h":"18. Тууранды сөздөрдү катыштырып, сүйлөм түзгүлө."},{"t":"p","h":"Карс-курс, шылдыр-шылдыр, шылдырап, тарс-тарс, тып-тып, күбүр-шыбыр."},{"t":"p","h":"19. Сүйлөмдөрдү которгула. Тууранды сөздөргө көңүлүңөрдү бургула."},{"t":"p","h":"1. Тарс-тарс атылган мылтыктын үнү тынчтыкты бузду."},{"t":"p","h":"2.Арал шаркыратмасынын суусу шар-шар агып жатат. З. Кырдан эрбең-сербең караандар көрүндү. 4. От жалп өчүп, үй ичи муздай түштү. 5.Артына кылчак-кылчак карап, Данияр келе жатты."},{"t":"p","h":"6. Кичинекей кыз тып-тып басып, боз үйгө кирип келди."},{"t":"p","h":"20. Ырды көркөм окугула жана жаңы сөздөрдү орус тилине которгула."},{"t":"h3","h":"КЫРГЫЗ ЖЕРИ"},{"t":"v","l":["Сөзү Т. Байзаковдуку, обону А. Жайнаковдуку","Ала-Тоо ак калпагын кийген кезде,","Аскасы көк асманга тийген кезде.","Мен дагы жолго чыгам танды тосо,","Кучактайм ой-кырларын нурга кошо,","Улуусуң, кыргыз жери, нурдан бүткөн,","Сулуусуң, кыргыз жери, ырдан бүткөн.","<span class=\"pg\" data-n=\"27\">27<\/span>Ысык-Көл – жердин көзү, кырлар – кашы,","Адырлар – көкүрөгү, токой – чачы.","Дайралар – кан тамыры, чоку – таажы,","Седеби, топчулары – ар бир ташы.","Кең түздүү, гүл денелүү – кыргыз жери,","Күн жүздүү, берекелүү – кыргыз жери.","","Жылдыздар көк бетинен өчкөн кезде,","Көл чалкып, тоолор койнун ачкан кезде.","Дил чалкып, таң күлкүсүн чачкан кезде,","Көркүнө көрк кошулат кыргыз жери,","Сезилет ата мээри, эне мээри.","Сулуусуң Кыргыз жери ырдан бүткөн,","Улуусуң Кыргыз жери нурдан бүткөн."]},{"t":"raw","h":"<div class=\"gloss\"><p>10<\/p><\/div>"}],"sub":[{"title":"КЫРГЫЗ ЖЕРИ","b":18}],"pages":[26,27]},{"title":"§ 6. Элес тууранды сөздөр – Образно-подражательные слова","blocks":[{"t":"h3","h":"§ 6. Элес тууранды сөздөр – Образно-подражательные слова"},{"t":"p","h":"Кыймыл-аракеттин же заттын сырткы көрүнүшүн, кыймылын, элесин көрсөткөн сөздөр элес тууранды сөздөр деп аталат."},{"t":"p","h":"Алар экиге бөлүнөт:"},{"t":"p","h":"1. Кыймыл-аракеттин же элестин тездигин билдирет:"},{"t":"p","h":"Образно-подражательные слова обозначают внешний вид, движение, образ действия предметов."},{"t":"p","h":"Они делятся на две группы:"},{"t":"p","h":"1. Образные слова, обозначающие действие или скорость:"},{"t":"p","h":"Жал-жал, жалт-жулт, жарк-журк, лып, жылт, жалп, мөлт, селт, улп, шып,"},{"t":"p","h":"2. Заттардын сырткы көрүнүшү, кыймылы жөнүндөгү элести билдирет:"},{"t":"p","h":"2. Образные слова, обозначающие внешний вид и действие предметов:"},{"t":"p","h":"эрбең-сербең, жалт-жулт, кылт-кылт, калжаң-калжаң, калдаң-калдаң."},{"t":"p","h":"21. Окуп, элес тууранды сөздөрдү тапкыла. Кыймыл-аракеттин, заттардын эмнесин билдирип турганын түшүндүргүлө."},{"t":"p","h":"1. Элдин уу-дуусу күчөдү. 2. Жамийланын карааны алыстан эрбең-сербең көрүндү. 3. Сабак башталды, кечиккен окуучу шып-шып басып кирип келди. 4. Хан элди жалт карады эле, элдин арасын күлкү аралады. 5. Жазгүл шарт бурулду да, жолго түштү."},{"t":"p","h":"<span class=\"pg\" data-n=\"28\">28<\/span>22. Элес тууранды сөздөрдү көчүрүп жазгыла, кандай элести билдирип турганын аныктагыла."},{"t":"p","h":"1. Султанмурат Мырзагүлдү жал-жал карады да, акырын класстан чыгып кетти. 2. Кечке ейин жааган кар да, тып басылды."},{"t":"p","h":"3. Салтанаттын кийген көйнөгү күнгө жалт-жулт этет. 4. Алыстан Рыскүл эжейдин эрбең-сербең карааны көрүндү, 5. Жумаалы ата багжаң-багжаң бакылдап, төрдө олтурат. 6. Мүйүздүү маралдын башын көргөндө бала селт этип кетти. 7. Мергенчи жар башына чыгып, кылчак-кылчак артына карады."},{"t":"p","h":"23. Төмөнкү тууранды сөздөрдү маанисине карай бөлүп жазгыла. Жал-жал, шып-шып, жалт-жулт, жарк-журк, маа, чырр-чырр, шыбыр-шыбыр, мөлт, шуу, шып, селт, жалт, лып, калдаң-калдаң, шуудур, койкок-койкок, кылт, чап, зың-зың, каңк, арс, адыраңадыраң, чуру-чуу."},{"t":"v","l":["Улгу: 1. Табыш тууранды сөздөр: шып-шып","2. Элес тууранды сөздөр: жал-жал","24. Элес тууранды сөздөрдү катыштырып сүйлөшкүлө."]},{"t":"p","h":"25. Көп чекиттин ордуна тиешелүү элес тууранды сөздөрдү коюп, сүйлөмдөрдү көчүрүп жазгыла."},{"t":"p","h":"1. Шамал үйлөп, бүлбүл күйгөн чырак... өчтү. 2. Момун чал... дебей сууга кирди. 3. ... караандар айылга жакындай берди."},{"t":"p","h":"4. Капыстан чыккан ачуу үндөн улам байкем ... этти. 5. Канатбек басып, кирип келди, 6, Түнкү ачык асманда жылдыздар ... этет. (селт, калдаң-калдаң, жалп, жылт-жулт, эрбең-сербең, дың)"}],"sub":[],"pages":[28,28]},{"title":"§ 7. Тууранды сөздөрдүн жазылышы —","blocks":[{"t":"h3","h":"§ 7. Тууранды сөздөрдүн жазылышы —"},{"t":"p","h":"Правописание подражательных слов Аягы к, п тыбыштары менен бүткөн тууранды сөздөргө -ылда мучесу уланганда к, п тыбыштары жумшарбай жазылат."},{"t":"p","h":"В подражательных словах, оканчивающихся на звуки к, п при прибавлении аффикса -ылда звуки к, п не смягчаются. М исал ы: бак+ылда= бакылда күп+үлдө= күпүлдө"},{"t":"p","h":"2. Кош сөз түрүндө айтыл-"},{"t":"v","l":["так+ылда=такылда","кып+ылда=кыпылда","Подражательные слова в"]},{"t":"p","h":"ган тууранды сөздөрдүн ара-"},{"t":"v","l":["сына дефис (-) белгиси коюлуп","жазылат.","виде парных слов пишутся","через дефис (-)"]},{"t":"p","h":"<span class=\"pg\" data-n=\"29\">29<\/span>Табыш тууранды сөздөр – звукоподражательные слова: чырк-чырк, каак-каак, дың-дың, калдыр-күлдүр, зың-зың ж. б. Элес тууранды сөздөр – образноподражательные слова: жал-жал, жалт-жулт, эрбең-сербең, калдаң-калдаң, сороңсороң ж.б."},{"t":"p","h":"26. Төмөнкү сүйлөмдөрдү көчүрүп жазгыла, тууранды сөздөрдү таап, аларды тууралап жазгыла."},{"t":"p","h":"1. Көчө бойлоп, кыт кыт күлүп уч бала келе жатты. 2. Шамал айдаган толкун шарп шарп этип жээкке урунат. 3. Рыскүл алдыртан карап бырс бырс күлдү. 4. Боз үйдөн тыптып тамган тамчылар элдин тынчын алды. 5. Атчандар айылга кире бергенде арс арс үргөн иттер чуркап чыкты. 6. Эл катуу уйкуда, баланын күрс күрс жөтөлгөнү угулат."},{"t":"p","h":"27. Аягы к, п тыбыштары менен бүткөн тууранды сөздөргө ылда мүчөсү уланганда кандай жазылаарын түшүндүргүлө жана мисал келтиргиле."},{"t":"p","h":"28. Кош сөз түрүндө айтылган тууранды сөздөрдү катыштырып, сүйлөм ойлоп тапкыла. Эмне үчүн араларына дефис (-) коюларын түшүндүрүп, мисал келтиргиле, 29. Сүйлөмдөрдү которгула."},{"t":"p","h":"1. Күш-күш этип, поезд Балыкчыга жол тартты. 2. Каак-каак деп учкан каргалар, чыгышка сапар улашты. 3. Алыстан заңк-заңк чыккан үн ого бетер катуулады. 4. Мен апамдын айткандарын шак эстей калып, кыймылымды лып токтоттум. 5. Жамийла Даниярды жал-жал карады. 6. Чоң теректин жанына жеткенде, чырр-чырр эткен дабыш угулду. 7. Зарипанын көзүнөн мөлт-мөлт жаш сызылды. 8. Бала калдыр-күлдүр эткен дабыштан чочуп ойгонду."},{"t":"p","h":"9. Сааттын чык-чык эткени гана угулуп турду. 10. Мылтык тарс атылып, иттердин арс-арс үргөнү күчөдү."},{"t":"p","h":"30. Биринчи катардагы сүйлөмдөргө экинчи катардагы тууранды сөздөрдү маанисине карай тууралап байланыштыргыла."},{"t":"p","h":"1. Чагылган ... ... этти."},{"t":"v","l":["карадым.","2. Мен апамды ...","жааган кар басылбады.","3. ...","4. Мурат ... ... сүйлөп элди күлдүрүп","жатты.","5. ... „. аккан сууну бойлой бастык.","лып-лып","шылдыр-шылдыр","жарк-журк","жал-жал","","багжаң-багжаң"]}],"sub":[],"pages":[29,29]},{"title":"§ 8. Кызматчы сөздөр – Служебные слова","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"30\">30<\/span>§ 8. Кызматчы сөздөр – Служебные слова"},{"t":"p","h":"Сүйлөмдөгү сөз менен сөздү, бир өңчөй мүчөлөрдү жана татаал сүйлөмдүн тутумундагы жөнөкөй сүйлөмдөрдү байланыштырууда кызматчы сөзд ө р керек. Кызматчы сөздөргө:"},{"t":"p","h":"1. Жандоочтор – Послелоги"},{"t":"p","h":"Для связи слов, однородных членов предложения и простых предложений в сложных предложениях нужны такие служебные слова, как:"},{"t":"p","h":"карай, көздөй (в сторону), жөнүндө, тууралуу (о, про, о), менен(с), жанында (около, возле), үстүндө (вверху), чейин, дейре (до), боюнча (по, согласно чему-л), учун (из-за, по причине), сыяктуу(подобный), сон (затем, потом) ж. б."},{"t":"p","h":"2. Байламталар – Союзы жана, менен (и), бирок (но), эгер (если), анткени (потому что), ал эми (а), же, болбосо (или), ошентсе да (несмотря на это) ж. б."},{"t":"p","h":"З. Бөлүкчөлөр – Частицы гана, эле (только), го (ведь), эн, өтө, абдан, аябай (очень), как, так, нак (как раз, точный), кудум (точь-в-точь), эч (ни, ничего), да (и), дагы (и, ещё, также, опять), тцгүл (не) ж. б. кирет."},{"t":"p","h":"31. Төмөндөгү берилген кызматчы сөздөрдү маанисине карай уч топко бөлүп жазгыла,"},{"t":"p","h":"Аябай, менен, кийин, бирок, боюнча, абдан, анткени, карай, эле, эгер, көздөй, болбосо, эч, ал эми, карата, өтө, жана, мурун, жараша, ошондой болсо да, деле, ары, караганда, кадим."},{"t":"p","h":"Ү лгү: 1. Жандоочтор: карай,"},{"t":"v","l":["2. Байламталар: менен,","3. Бөлүкчөлөр: эле,","","32. Макалдарды окуп, орус тилине которгула.","","Жамгыр менен жер көгөрөт,","Эмгек менен эл көгөрөт.","Элге эр кымбат,","Эрге эл менен жер кымбат.","Аш – ээси менен,","Баш – мээси менен."]},{"t":"p","h":"<span class=\"pg\" data-n=\"31\">31<\/span>33. Текстти окугула, кызматчы сөздөрдү маанисине карай бөлүп жазгыла."},{"t":"h3","h":"МЕКЕН"},{"t":"p","h":"Бул сөз бардыгыбыз үчүн абдан кымбат. Мекен – бул ар кимдин киндик каны тамган жери гана эмес, ал ажайып керемет өлкөбүз – кыргыз жери. Биздин Мекен жөнүндө легенда, ырлар да өтө көп. Ата мекен тууралуу айта берсек сөз түгөнгүс. Ал эми улуу даанышман баатырлар дагы өз өмүрлөрүн Мекенге арнашкан. Биздин Мекен – Жусуп Баласагын менен Махмуд Кашгаринин мекени, Курманжан датканын мекени, Алыкул менен Чыңгыздын мекени, Мекенибиздин эркиндиги үчүн күрөшкөн улуу инсандарыбызды эч качан унутпайбыз."},{"t":"p","h":"Силер мектепте окуйсуңар, билимдүү болуу үчүн бардык шарттар түзүлгөн. Мунун баарын силерге Мекен тартуулаган. Ошондуктан силер да аны коргоого даяр болгула, өз Мекениңерди сүйө билгиле."}],"sub":[{"title":"МЕКЕН","b":12}],"pages":[30,31]},{"title":"§ 9. Жандоочтор – Послелоги","blocks":[{"t":"h3","h":"§ 9. Жандоочтор – Послелоги"},{"t":"p","h":"Сүйлөмдөгү сөздөрдү өз ара байланыштыруу үчүн кызмат жандоочкылган сөздөр т ор деп аталат."},{"t":"p","h":"Алар сүйлөмдөгү аткарган кызматы боюнча орус тилиндеги предлогдорго окшош."},{"t":"p","h":"Орус тилиндеги предлогдордон айырмасы жандоочтор өзү менен бирге келүүчү сөздөн мурда турбастан андан кийин келет."},{"t":"p","h":"Ар бир жандооч өзү менен бирге колдонулуучу сөздүн белгилүү жөндөмөдө турушун талап кылат."},{"t":"p","h":"Слова, которые служат для связи слов в предложении называются послелогами."},{"t":"p","h":"По своей роли в предложении они похожи на русские предлоги."},{"t":"p","h":"Однако, в отличие от русских предлогов, послелоги ставятся не перед словами, к которым относятся, а после них."},{"t":"p","h":"Каждый послелог требует слова, с которым он употребляется в определенном падеже."},{"t":"p","h":"Мисалы: Нурбек шаарды карай кетти. Шаар деген сөздүн табыш жөндөмөдө турушун аны менен колдонулган карай жандоочу талап кылып турат."},{"t":"p","h":"Творительный падеж слова шаар требует после себя послелог карай."},{"t":"p","h":"<span class=\"pg\" data-n=\"32\">32<\/span>М исал ы: Канатбек менен келдим. Менен жандоочу өзү менен бирге колдонулуучу Канатбек деген сөздүн атооч жөндөмөдө турушун талап кылат."},{"t":"p","h":"Послелог менен (с) требует, чтобы слово, с которым он употребляется, стояло в именительном падеже."},{"t":"p","h":"М исал ы: Жылдыз менен Рысбек. Менен жандоочу кызматы боюнча орус тилиндеги с предлогуна окшош."},{"t":"p","h":"Чейин жандооч деген барыш жөндөмөсүндө турган сөз менен колдонулат."},{"t":"p","h":"Послелог менен по своей роли в предложении похож на русский предлог с."},{"t":"p","h":"Послелог чейин (до) требует, чтобы слово, к которому он относится, стояло в дательном падеже."},{"t":"p","h":"М исал ы: Мен китепканага сабакка чейин барамын. З4. Өтүлгөн эрежелердеги жандоочторду (карай, менен, чейин) катыштырып, үч сүйлөм жазгыла. Жандоочтун эрежесин түшүндүргүлө."},{"t":"p","h":"35. Берилген сүйлөмдөрдү көчүрүп, жандоочтордун алдын сызгыла."},{"t":"p","h":"1. Кыргыз эли улуу жазуучу Чыңгыз Айтматов менен сыймыктанат. 2. Мен апама үй тапшырмаларын аткарганга чейин жардам бердим. 3. Эрмек менен Элдияр бүгүн алма теришет. 4. Мектепте майрамга карата чоң даярдык башталды. 5. Тамактан соң, ысык чай куюлду. 6. Бүгүн райондук олимпиаданын жыйынтыгы жөнүндө маалымат алдык."},{"t":"p","h":"36. Суроолорго жооп бергиле. Жоопторун жазып, жандоочторду аныктагыла."},{"t":"v","l":["1. Сен мектепке карай бара жатасыңбы?","2. Сабакка чейин канча убакыт калды?","З. Сен ким менен үй тапшырманы аткардың?","4. Атаң менен апаңа кандай жардам бердиң?"]},{"t":"p","h":"5. Өтүлгөн предметтик олимпиаданын жыйынтыгы жөнүндө кеп болдубу?"},{"t":"p","h":"6. Сенин классташтарың майрамга карата кандай даярдык көрүп жатышат?"},{"t":"p","h":"Жандоочторду катыштырып, диалог түзүп келгиле."},{"t":"raw","h":"<div class=\"gloss\"><p>16<\/p><\/div>"}],"sub":[],"pages":[32,32]},{"title":"§ 10. Жандоочтун түрлөрү – Виды послелогов","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"33\">33<\/span>§ 10. Жандоочтун түрлөрү – Виды послелогов"},{"t":"p","h":"1. Атооч жендемесундегу сездер менен айкашуучу жандоочтор:"},{"t":"p","h":"1. Послелоги в сочетании со словами именительного падежа:"},{"t":"p","h":"менен, тууралуу, жөнүндө, аркылуу, боюнча, сыяктуу, үчүн, бою, бойдон,"},{"t":"p","h":"2. Барыш жөндөмөсүндөгү сөздөр менен айкашуучу жан-"},{"t":"v","l":["доочтор:","2. Послелоги в сочетании","со словами дательного падежа:","","караганда, карай, карата, жараша, чейин, дейре."]},{"t":"p","h":"З. Табыш жөндөмөсүндөгү сөздөр менен айкашуучу жандоочтор:"},{"t":"p","h":"көздөй, карай, карата."},{"t":"p","h":"4. Чыгыш жөндөмөсүндөгү сөздөр менен айкашуучу жандоочтор:"},{"t":"p","h":"З. Послелоги в сочетании со словами винительного падежа:"},{"t":"p","h":"4. Послелоги в сочетании со словами исходного падежа:"},{"t":"p","h":"көрө, ары, бери, мурун, кийин, соң ж. б."},{"t":"p","h":"37. Сүйлөмдөрдөгү жандоочторду тапкыла. Жандоочтор менен бирге келген сөздөрдүн кайсы жөндөмөлөр менен айкашкандыгын далилдегиле."},{"t":"p","h":"1. Садыр аке жөнүндө айтылган тарыхый аңгеме өтө кызыктуу болду. 2. Айчүрөк атасы менен Таласка кетти. 3. Мен мектепке карай шашылдым. 4. Саат тушку он экиге чейин.эс алуучулар келип калышты. 5. Жылдыз үчүң бүгүнкү күн унутулгус. 6, Окуучулар сабактардан соң компьютер үйрөнүшөт. 7. Салтанат ошол күндөн бери сүрөт искусствосуна кызыгат. 8. Адылбек ата уулу Кудайберген менен бир аздан кийин жолго чыгышат. 9. Мугалим Айдайдын жообуна жараша билимин баалады."},{"t":"p","h":"38. Көп чекиттин ордуна тиешелүү жандоочторду коюп, көчүрүп жазгыла, Жандоочтун кайсы түрү экендигин аныктагыла."},{"t":"p","h":"1. Элдияр мөөнөтүнөн ... экзамендерин ийгиликтүү тапшырды."},{"t":"p","h":"2. Адамзат тынчтык ... күрөшөт. 3. Кар кун ... балпактап жаай берди. 4.Үмүтбек кечээтен ... шаардан уулун күтүүдө. 5. Окумуштуулар Кундуздун илимий иши ... ойлорун айтышты."},{"t":"img","src":"data:image/webp;base64,UklGRrYLAABXRUJQVlA4IKoLAACQSQCdASp0AVcAPq1Kn0mmJKMhMfVb6MAViWMA1bCdU2y1uVaSy36+ZcQusTv18l4r9pf81/OEbBBnVj8XeKi9SEBUME1nC4imGyHas/B1LOnEsLuoBmnfWuGYJScNdcK1nXXzzgw4OCjOZbb4YuqttvvLPBQ3k/RRUzSxEZFYD9x6NntU6vaVZ41zvjqT5GCvllvVIMbAn80wL5O4vNtGpP+tH6U0cbGhg8b/15FTzOC2RVsGVu2KFokbi0aj8WqkHgUS4xa5kEEfHTQqYFwgLNO4C9Ganl5DIvNtEOAiZmzVSDQYwLZC2cUm9v1W74gxlQ3OgcO5ausiWhUqJ1RDyvrahiq4S5gutEHdnnyyZ9JXFgMzllTHSP8j+H8+dk6ig2TQ83SFWlTPLjnAJREIMzW6tjFKqfur4GzGsEauowiXr7OhiqYb3vrvXCE8ITvkL+hu0hUDSS0T8NNIN1hqAwG6ohx1cf4okEwCyXp2KSZ/o9pM1iJtqgnp90q0M0Se1fkgkvBEQtxvNbYAPH0C0HPMgd2uCniEE+slm+kXBzQRrafJop1JsGfkkt15GTdi8X63Pwt7L8s7M1q7KPTTgh74fxuWvOAdudx3FrXCIR9uRy/Q4c3FcjyvrWQG5zkHCV+Ow1lOyfJW1BOZt1zbfmW5B3WPK3CK9s33UcYZ2nodku6qngGrevKHjNKiBLHj3yV952QETXfz4aWeO8b3uKRdRHZjqTfJ5ftji64IOBf8yBmrUbKXqsr2KXUfX8bc6NGTAMlOfqvMTDhWR1/0mG4gUpgA/vnu03WuGt3xENFg5atnIUkII/NMXRqZ42LRpxbRfSmJTwh2i8OEgVcvxT1iKFgmzbgnM7r8i93g3NG/dS+BewPSlviv7s5haT7e33Nz2G7pFBVYKIKkwQ/1MchC8lTmXK+99lhZSG3OyQcUoyN9toTv7MF52XmPHePsNxbQchxVylD/Up7dBzNca+n7ioXg59woE+j4mlEQihJnVcksqGJU5sU5Jbfo2NXFL50rQ8GG8zcYto845W0G9sv80kyonloE+CnGsioIT6u6FNu1NR7iinaRgUh2UXqp5EAt+lhjWMcnD3Jbf1lUh5vuPSU706ztF+5Gqfus2CS2uM0PxrDg55em/Ohzy+RTZ7fs2F/tJdGtBYRrWvL5GK6D+IB1zC/pSvjd4oAELpUgzo/FyZXeFgQnFLa7Edf6tElbgtSi2peVdUQVledglUqUqTIaD73vt+FfTO9i1+zH/0MYF+GkjvO8uOJzyx2BEYvbllOPSLsPKYA7YsjlzknM9WBY9E5C0Pl+cbFOF9eJjki2V4fJZrzmc5n/ec6iGfzhCi6avKo8pfcjNq/R3X/VnXRU/KnoqUqIorXdQHqwX7wcpk2MykOGh6R70fxc8LXwonhH+7axIqJ1H9ABCHWm44UkUUj6As2moLwUKSP5dRIn4pn1udHbxadBwUAVhyMgU8GP0DdkBaGh08xqfKy4r2H0zp1lbeHJuInUNr94s71DY6xkqHduhOYE4HNnRGzx0JyYPyXFeW82aKhlci3kkDNHFRxXKAx53I87w/3934wWVbb7XNQIjucKC208+Cy45Joc8gi8s5G7zASAEO2nDv7/w1HIwgY/SepvrBYu+4W6y4Wk0PaLtUxVW/hJbV6zOx9iXIVPCnMC0WurCynNwfabE0j0X5H+Ug3Ytt6Z3y9fzE+BVmgQf9p4jkSkkMK6Bo0C8HY9GBkLQYEGn9VyApyJ9

үйлөмдөрдү байланыштыруучу кызматчы сөз түркүмү байламталар деп аталат."},{"t":"p","h":"Ага:"},{"t":"p","h":"Союз- служебная часть речи, которая связывает однородные члены и простые предложения в составе сложного."},{"t":"p","h":"К нему относятся такие союзы, как:"},{"t":"p","h":"да, же, менен, бирок, демек, себеби, ошол, жана да, эгер, анткени менен, ошон учун, ошол себептцц, ошондой болсо да, ошондой болгону менен ж. б."},{"t":"p","h":"<span class=\"pg\" data-n=\"35\">35<\/span>Байламталар курамына карай жөнөкөй жана тат а а л болуп экиге бөлүнөт."},{"t":"p","h":"По составу союзы делятся на простые и составн ые."},{"t":"p","h":"41. Көчүрүп жазып, байламталардын астын сызгыла, 1. Алтынай Сулайманова чөйчөктүн четин оозуна тийгизди да, кайра ордуна койду. 2. Ар бир нерсенин жазы да, күзү да болот тура. 3. Момун чал баланын же өкүнгөнүн, же сүйүнгөнүн биле албады. 4. Айдай терең билим алууга аракеттенет, анткени ал келечекте окумуштуу болууну эңсейт. 5. Күн жылый баштады, бирок тоолордо кар эрий элек. 6. Силердин араңардан дарыгерлер, педагогдор, бизнесмендер жана дагы ар кандай кесип ээлери өсүп чыгат."},{"t":"p","h":"42. Төмөндөгү байламталар аркылуу байланышкан бир өңчөй сөздөрдү колдонуп, ар бирине бирден сүйлөм түзгүлө."},{"t":"p","h":"Же актёр, же мугалим, же архитектор, ата-энелер да, коомчулук да, балдар уюму да, ары эстүү, ары тартиптүү, ары кичи пейил, татаал, бирок кызыктуу; күн суук, анткени."},{"t":"p","h":"43. Төмөнкү ырды окуп, мазмунун талдап түшүнгүлө да, обонго салып ырдагыла."},{"t":"h3","h":"МЕКТЕБИМ"},{"t":"v","l":["Музыкасы М, Абдраевдики, сөзү Т. Тыныбековдуку","Жаш денемди чыңалтып,","Болоттой бек ширелткен.","Билим кени мектебим,","Алпештеген энем сен.","","Көрүнгөндө карааның,","Көлдөй толкуйт талабым.","Өмүрүмдүн азыгы,","Өзүң берген сабагың.","Күндө ачып барагын,","Китебимди карадым.","Акыл-сезим өркүндөп,","Алга кетип барамын.","","Айланаңдан кетпеймин,","Ар убакта эстеймин.","Тарбиялап өстүргөн,","Таалай үйү мектебим,"]},{"t":"p","h":"Макалдарды жаттагыла, жандоочторду жана байламталарды аныктагыла."},{"t":"v","l":["Жакшынын өзү өлсө да, иши өлбөйт.","Ай менен Кун – асмандын көркү.","Акылмандын өзү өлсө да, сөзү өлбөйт.","Адам – акылы менен адам.","Баш – акыл үчүн, акылман – эл үчүн."]},{"t":"p","h":"<span class=\"pg\" data-n=\"36\">36<\/span>Иштегениң ата-энең үчүн, үйрөнгөнүң өзүң үчүн."},{"t":"p","h":"Күн жаманга да, жакшыга да бирдей тиет."},{"t":"h3","h":"&amp; 12. Жөнөкөй жана татаал байламталар —"},{"t":"p","h":"Простые и составные союзы Байламталар курамына карай жөнөкөй жана тат а а л болуп экиге бөлүнөт."},{"t":"p","h":"Женекей байламталар бир сөздөн:"},{"t":"p","h":"По составу союзы делятся на простые и составные."},{"t":"p","h":"Союзы, состоящие из одного слова, – простые:"},{"t":"p","h":"жана, да, себеби, дагы, демек, бирок, же, эгерде, ошондуктан; татаал байламталар эки же"},{"t":"v","l":["андан көп сөздөрдөн түзүлөт:","а состоящие из двух и более","слов – составные:"]},{"t":"p","h":"ал эми, анткени менен, антсе да, ошол себептцуц, же болбосо, ошол учун, эмне үчүн десең ж. 6."},{"t":"p","h":"44. Төмөнкү байламталарды катыштырып, оозеки сүйлөм түзгүлө. Ал эми, себеби, бирок, же болбосо, ошол үчүн, эгерде, ошондуктан, же, дагы, менен."},{"t":"p","h":"45. Байламталар аркылуу жөнөкөй сүйлөмдөрдү байланыштырып, дептериңерге жазгыла. Алар курамына карай кандай байламталар экендигин далилдегиле."},{"t":"p","h":"1. Жаз келди. Жер бети көгөрө баштады. 2. Эрлан уюштургуч, алдыңкы окуучу. Класстын демилгечиси. 3. Китеп биздин байлыгыбыз. Ал бизге акыл-эс, билим берет. 4. Таза сууну коргоо- ар бирибиздин ыйык милдет. Ал ден соолуктун булагы. 5. Жазгы жамгыр күчөдү. Жер айдоочулар ишин уланта берди."},{"t":"p","h":"г, р Пайдаланылуучу байламталар: себеби, ошентсе да, анткени, ошфндуктан, ошол учин."},{"t":"p","h":"46. Көп чекиттин ордуна тиешелүү байламталарды коюп жазгыла."},{"t":"p","h":"1. Бүгүн чоң энемдикине Айдай .. Айчүрөк келип жардам беришет, 2. Класстагы гүлдөр жакшы өсүп жатат, ... бөлмөбүзгө күн жарык тиет. 3. Мен ооруп калдым, ... сабакка бардым. 4. Күн бүркөлдү, ... жаан жааган жок. 5. Ага татаал маселе берилди, ... жообун туура чыгарды. я"},{"t":"p","h":"Пайдаланылуучу байламталар: анткени менен, сёбеби, бир®к, ошентсе да, менен."},{"t":"p","h":"<span class=\"pg\" data-n=\"37\">37<\/span>47. Төмөнкү сүйлөмдөрдү көчүрүп жазгыла жана байламталарды аныктагыла."},{"t":"p","h":"1. Кыял энесин көрдү да, сүйүнүп кетти. 2. Ал ары акылдуу, ары жаш жана ыймандуу. 3. Бүгүн атам келет, же келбейт. 4, Досумдун мүнөзү жеңил, бирок эстүү. 5. Ысык-Көлдүн кооздугу менен байлыгына чек жок."},{"t":"p","h":"С 48. Берилген байламталардын жөнөкөй же татаал экендигин аныктап, эки топко бөлүп жазгыла."},{"t":"p","h":"Ошондой болгону менен, же, жана, андыктан, ошонун натыйжасында, болбосо, менен, да, канча-ошончо, ошондуктан, ошол себептүү, анткени, себеби, ары, дагы, канчалык, ошончолук, ошол себептүү, не, же болбосо, эгерде, эми."}],"sub":[{"title":"МЕКТЕБИМ","b":12},{"title":"&amp; 12. Жөнөкөй жана татаал байламталар —","b":18}],"pages":[35,37]},{"title":"§ 13. Багындырбас байламталар — Сочинительные союзы","blocks":[{"t":"h3","h":"§ 13. Багындырбас байламталар — Сочинительные союзы"},{"t":"p","h":"Багындырбас байл ам та л а р багынычсыз татаал сүйлөмдүн тутумундагы бир өңчөй мүчөлөрдү жана тең укуктуу жөнөкөй сүйлөмдөрдү байланыштырат."},{"t":"p","h":"Багындырбас байламталарга:"},{"t":"p","h":"Сочинительные союзы связывают однородные члены и равноправные по смыслу простые предложения в составе сложного."},{"t":"p","h":"К сочинительным союзам относятся такие слова, как: менен, жана да, ал экен, бирок, антсе да, ошентсе да, же, же болбосо, болбосо, а, ары ж. б. кирет."},{"t":"p","h":"49. Жөнөкөй сүйлөмдөрдү мааниси жактан туура келүүчү багындырбас байламталар менен байланыштырып, жазуу жүзүндө аткаргыла."},{"t":"p","h":"1. Данияр менен Жамийла чий аралап жөнөштү. Мен эмне кыларымды билбей артта калдым. 2. Жерге күүгүм түштү. Алар артына бир кылчайбай кете беришти. 3. Мен алардын артынан жүгүрдүм. Жаш балача шолоктоп ыйладым. 4. Дагы көпкө чейин ыйладым. Кымбаттуу, эң жакын көргөн адамдарым менен коштошуп жаттым. 5. Эмне үчүндүр мен аларды аядым. Ичим тыз этип куйкалана түштү. 6. Алар түштүккө карай кетишти го. Жаңы жерлерде, жаңы турмуш курууга аттанышкандыр!"},{"t":"p","h":"Ч. Айтматов. ›Жамийла» повестинен У „„Пайдаланылууч байламталар: ошентсе да, жана да, жеё’болбосо, а, ары."},{"t":"p","h":"<span class=\"pg\" data-n=\"38\">38<\/span>50, Төмөнкү багындырбас байламталарды пайдаланып, сүйлөм У тузгуле: бирск, ал эми, антсе да, же болбосо."},{"t":"p","h":"51. Төмөнкү текстти окугула, жөнөкөй сүйлөмдөр өз ара кандай жол менен байланышкандыгын аныктагыла, багындырбас байламталарды дептериңерге көчүрүп жазгыла."},{"t":"h3","h":"МЕНИН ҮЙ-БҮЛӨМ"},{"t":"p","h":"Биз чоң атам, чоң энем, атам, апам, агам, эжем, карындашым болуп бирге турабыз. Чоң атам 70 жашта, а чоң энем болсо 68 жашта. Алар пенсияда, антсе да үй-чарба жумуштарын аткарышат. Чоң энем сөзмөр адам, элдик жомок-уламыштарды жакшы билет. Биз чоң энемдин жомокторун кунт коюп угабыз. Атам дарыгер, ал эми апамдын кесиби мугалим. Алардын иштери оор, ошентсе да атам менен апам талыкпай эл үчүн кызмат кылышат. Агам, эжем жана мен мектепте окуйбуз, а_ карындашым болсо бала бакчага барат. Агам Эрбол 11-класста окуйт..Ал информатика сабагын эң жакшы өздөштүрөт жана да информатик-программист болууну каалайт. Эжем Салтанат 9-класстын үлгүлүү, алдыңкы окуучусу. „Ал_чет тилине абдан кызыгат. Салтанат чет өлкөдө билим алып, элчи болгусу келет. Менин атым Нурбол, 7-класста орусча окуймун, бирок кыргыз тилинде эркин, так сүйлөймүн. Мен бош убактымда спорт оюндары менен машыгамын, же болбосо чоң атама жардам Карындашым Айдай 6 жашта, антсе да ал тамга таанып, жомок окуй алат. Биздин үй-бүлө ынтымактуу жана бири-бирибизге ар дайым жардам беребиз."},{"t":"p","h":"52. Текст боюнча суроолорго багындырбас байламталарды пайдалануу менен жооп бергиле."},{"t":"v","l":["1. Нурболдун үй-бүлөсү кандай?","2. Ал кимдер менен бирге жашайт?","З. Анын чоң атасы канчада, а чоң энесичи?","4. Чоң ата менен чоң эне үйдө эмне кылышат?"]},{"t":"p","h":"5. Чоң эне кандай адам, жана да ал эмнелерди көп билет?"},{"t":"p","h":"6. Нурболдун атасы кандай кызматта иштейт, ал эми апасынын кесиби эмне?"},{"t":"p","h":"Т. Агасы Эрбол, эжеси Салтанат кайсы сабакты эң жакшы өздөштүрүшөт? Алар келечекте кайсы кесиптин ээси болгулары келет?"},{"t":"p","h":"8. Эмне үчүн Салтанат чет өлкөдө билим алууну каалайт?"},{"t":"p","h":"9. Нурбол кыргыз тилинде кандай сүйлөйт? Ал бош убактысында эмне кылат?"},{"t":"p","h":"<span class=\"pg\" data-n=\"39\">39<\/span>10. Карындашы Айдай 6 жаштабы, бирок ал жомок окуй алабы?"},{"t":"p","h":"1, Окулган тексттин негизинде байламталарды катыштырып, «Менин үй-бүлөм» деген темада чакан аңгеме түзгүлө."},{"t":"p","h":"2. Төмөнкү сөздөрдү которгула жана маанисин түшүндүргүлө: ® жомок-уламыш —"},{"t":"v","l":["кесип —","келечек —","өздөштүрүү —","чет өлкө —","элчи —"]}],"sub":[{"title":"МЕНИН ҮЙ-БҮЛӨМ","b":10}],"pages":[38,39]},{"title":"§ 14. Багындырбас байламталардын бөлүнүшү — Виды сочинительных союзов","blocks":[{"t":"h3","h":"§ 14. Багындырбас байламталардын бөлүнүшү — Виды сочинительных союзов"},{"t":"v","l":["Багындырбас байламталар","өз ара мааниси жагынан үч","топко бөлүнөт:"]},{"t":"p","h":"По значению сочинитель-"},{"t":"v","l":["ные союзы делятся на три","группы:","1. Байланыштыргыч – соединительные:","ары, жана, жана да, дагы, да, менен, дале;","2. Каршылагыч – противительные:"]},{"t":"p","h":"а, ал эми, бирок, антсе да, ошентсе да, ошондо да, анткени менен, ошондой болсо да;"},{"t":"v","l":["3. Ажыраткыч – разделительные:","же, же болбосо, не;"]},{"t":"p","h":"53. Берилген багындырбас байламталарды уч топко белуп жазгыла. Не, менен, бирок, ошондой болсо да, жана, же, да, анткени менен, ары, ал эми, же болбосо, жана да, антсе да."},{"t":"v","l":["1. Байланыштыргыч:","2. Каршылагыч:","3. Ажыраткыч:"]},{"t":"p","h":"54. Биринчи катардагы сүйлөмдөрдөгү көп чекиттин ордуна, экинчи катардагы байламталарды маанисине карата тууралап, көчүрүп жазгыла."},{"t":"p","h":"1. Айлананы боз туман каптады, ... болжогон жерге адашпай жеттик."},{"t":"p","h":"2. Адамды бийик акыл ... талбас эмгек гана даңкка бөлөйт."},{"t":"p","h":"3. Спорттук мелдеште Эрмек .. Нурлан жеңишке ээ болот."},{"t":"v","l":["да","","ошентсе да","","анткени менен"]},{"t":"p","h":"<span class=\"pg\" data-n=\"40\">40<\/span>ү 4. Коңгуроо кагылды .. ‚ сабактар башталды."},{"t":"p","h":"5. Күн жылый баштады, .. тоолордо кар эрий элек."},{"t":"v","l":["же болбосо","ү","менен"]},{"t":"p","h":"55. Төмөнкү түзүлгөн маекти окугула, байламталардын маанисине карай колдонулушун далилдегиле."},{"t":"h3","h":"ҮЙДӨ"},{"t":"p","h":"– Сен үйдө ата-энеңе кандай жардам бересиң?"},{"t":"p","h":"– Үйгө берилген тапшырмаларды аткарам да, короо жумуштарын жасайм."},{"t":"p","h":"– А, бир туугандарың дагы жардамдашабы?"},{"t":"p","h":"– Албетте, эжем үй ичин жыйнап тазалайт, тамак даярдайт. Ал эми байкем отун жарат, жыйнайт же болбосо суу ташыйт. “Үй жумуштары бүткөндөн кийин эмне кыласың?"},{"t":"p","h":"– Телевизор көрөмүн, же музыка угамын."},{"t":"p","h":"Кызыктуу китеп окуймун, же болбосо теннис ойноймун."},{"t":"p","h":"56. «Жардам берүү» деген сөз айкашынын маанилеш сөздөрүн тапкыла, -.. ез ‚ау з Балдар, силер да кандай үй жумуштарын аткарып, ата-энеңерге жардам бересиңер?"},{"t":"p","h":"57. Макалдарды жаттап, байламталарды аныктагыла жана которгула: Сөз доодон да куткарат, жоодон да куткарат."},{"t":"v","l":["Байлыгың болбосо да, баркың болсун.","Досуң миң болсо да, аздык кылат,","Душманың бирөө болсо да, көптүк кылат.","Жаш – күчү менен, кары – акылы менен.","Ой жеткен менен кол жетпейт.","Тилден бал да тамат, уу да тамат."]}],"sub":[{"title":"ҮЙДӨ","b":17}],"pages":[40,40]},{"title":"§ 15. Багындыргыч байламталар —","blocks":[{"t":"h3","h":"§ 15. Багындыргыч байламталар —"},{"t":"p","h":"Подчинительные союзы Багындыргыч байламталар Багынынкы татаал суйлемдун тутумундагы баш жана багынынкы суйлемдерду гана байланыштырат, Багындырма байламталар:"},{"t":"p","h":"Подчинительные союзы связывают главные сложноподчиненные предложения в составе сложного. К подчинительным союзам относятся такие слова, как?"},{"t":"p","h":"<span class=\"pg\" data-n=\"41\">41<\/span>себеби, анткени, эгер, эгерде, андыктан, ошондуктан, ошол учун, ошол себептиц, эмне учун, ошонун натыйжасында, канча, ошончо ж.б. кирет."},{"t":"p","h":"58. Төмөнкү сүйлөмдөрдү багындыргыч байламталардын жардамы менен (анткени, ошол себептүү, эгер, ошфндой, себеби, ошончо) байланыштырып, көчүрүп жазгыла."},{"t":"p","h":"1. Нурбек атасына кандай убада берсе, ал айтканын так аткарды. 2. Мындан ары сен окууну уланта албайсың, жакшы аракет кылбасаң. 3. Айдай бардык сабактарды абдан аракеттенип окуду, ал окуунун отличниги болду. 4. Биз таң эрте турдук, шаарга эжемдикине жөнөйбүз. 5. Апам мага ыраазы болду, мен ага үй жумуштарына чоң жардам кылдым. б. Канчалык көп окусаң, көп билесиң."},{"t":"p","h":"59. Төмөнкү багындыргыч байламталар менен сүйлөм түзгүлө. Канча, ошонун натыйжасында, ошол үчүн, эгерде, ошол себептүү, эмне үчүн."},{"t":"p","h":"60. Текстти окугула, байламталарды аныктагыла."},{"t":"h3","h":"ӨЗҮМ ЖӨНҮНДӨ"},{"t":"p","h":"Менин атым Кудайберген. Атам менен апам мени абдан жакшы көрүшөт, анткени мен үйдө эң кичүүсүмүн. Мен спорт менен машыгамын, ошондуктан мага машыгуу бөлмөсү даярдалган. Үйдө интернетке байланыш бар, ошонун натыйжасында дүйнөдөгү спорттук жана маданий жаңылыктар менен кабардар болуп турамын. Атам мага көп кызыктуу китептерди алып берет. Себеби китепти көп окуган, көптү билет. Атамдан үлгү аламын, анткени"},{"t":"raw","h":"<h4 class=\"mk\">ал эмгекчил адам. унга толуп турат<\/h4>"},{"t":"p","h":"жер айдап, эгин алат, андыктан кампабыз эми бош убактысында күлүк таптайт, себеби аны жарышка салат\\ Атам жана апам абдан мээнеткеч адамдар, ошондуктан мен алар менен сыймыктанамын."},{"t":"p","h":"@ аэ) төмөнкү сөздөрдү которуп, сөздүккө жазгыла:"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>машыгуу —<\/td><td>кабардар болуу —<\/td><td>байланыш —<\/td><\/tr><tr><td>үлгү алуу —<\/td><td>эмгекчил —<\/td><td>кампа —<\/td><\/tr><tr><td>күлүк таптоо —<\/td><td>жарышка салуу —<\/td><td>мээнеткеч —<\/td><\/tr><tr><td>сыймыктануу —<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"б) Текст боюнча суроолорго жооп берип, оюңарды ортого салгыла:"},{"t":"p","h":"<span class=\"pg\" data-n=\"42\">42<\/span>› 1. Текст ким жөнүндө маалымдайт?"},{"t":"p","h":"2. Эмне себептен ата-энеси Кудайбергенди абдан жакшы көрүшөт?"},{"t":"p","h":"З. Эмне үчүн ага машыгуу бөлмөсү жана интернет байланышын түзүп беришкен?"},{"t":"v","l":["4. Эмне себептен ал ата-энесин баалайт?","1 Өзүңөр жөнүндө аңгеме жазып, айтып бергиле,"]}],"sub":[{"title":"ӨЗҮМ ЖӨНҮНДӨ","b":9}],"pages":[41,42]},{"title":"§ 16. Багындыргыч байламталардын маанисине карай Виды подчинительных союзов по значению","blocks":[{"t":"h3","h":"§ 16. Багындыргыч байламталардын маанисине карай Виды подчинительных союзов по значению"},{"t":"p","h":"Багындыргыч байламталар мааниси жагынан өз ара төмөндөгүдөй болуп бөлүнөт:"},{"t":"p","h":"По значению подчинительные союзы бывают:"},{"t":"p","h":"1. Себеп – натыйжалагыч байламта – причинными:"},{"t":"p","h":"анткени, себеби, ошондуктан, ошол себептцц, ошонун натыйжасында;"},{"t":"v","l":["2. Шарттуу байламта – условными:","эгер, эгерде;","З. Салыштырма байламта – сравнительными:","кандай, канча, канчалык."]},{"t":"p","h":"61. Сүйлөмдөрдү көчүрүп, көп чекиттин ордуна тиешелүү байламталарды коюп жазгыла."},{"t":"p","h":"1. Эдил жалкоо, аракети абдан начар, ... окууну уланта алган жок. 2. Сен... тырышып жакшы иштесең, .. эмгегиңдин үзүрүн көрөсүң. 3. Ырыс Азимовна мугалимдик кесипте үзүрлүү эмгектенди, ... .. «Билим берүүнүн отличниги» төш белгиси менен сыйланды. 4. Илимпоз изилдөө ишин жүргүзүүдө, ... жыл аягында диссертациялык эмгегин коргойт. 5. Алтынай билим албайт эле, ... Дүйшөн агай окууга жөнөтпөсө."},{"t":"p","h":"Пайдаланыдуучу сөздөр: ошонун натыйжасында, эгерде, канчёлык, ошончолук, анткени, ошондуктан."},{"t":"p","h":"62. Төмөнкү багындырбас жана багындыргыч байламталарды маакени менен, канчалык, ж нисине карай бөлгүлө: не, канча, нч эф, Е) Ё лбосо, с и, дагы, анткени, ошентсе натыйжасында, антжайа, <span class=\"pg\" data-n=\"43\">43<\/span>2 да, эр, да, ошол себептүү,; дале, анткени ошондуктан, жана да, р; Ч менен, ары. ай, шой болсо 1. Байланыштыргыч- 2. Каршылагыч- 3. Ажыраткыч- 1. Себеп-натыйжалагыч- 2. Шарттуу- 3. Салыштырма- 63. Текстти окугула жана байламталарды таап, дептериңерге көчүрүп жазгыла."},{"t":"raw","h":"<div class=\"gloss\"><p>26<\/p><\/div>"},{"t":"h3","h":"МЕНИН ИШ КҮНҮМ"},{"t":"p","h":"Менин иш күнүм күн сайын таң эртеден 6-30да башталат. Сабак саат 8де башталат, ошондуктан мен таңкы 6-80да турушум керек. Тураарым менен көнүгүүлөрдү жасаймын. Сергек жүрүү үчүн муздак суу менен жуунамын. Андан соң тамактанамын да, сабакка кечикпей баруу үчүн үйдөн саат 7-380да чыгамын. Окуу аяктагандан кийин, үйдү көздөй жөнөймүн. Түшкү тамактануудан кийин эс алып, андан соң үй тапшырмаларды аткарамын. Математикадан маселе чыгаруу өтө оор, ошондой болсо да, өзүм чыгарамын. Англис тилинен берилген текстти которомун, сөздөрдү жаттаймын, ал эми кыргыз тилинен тапшырмаларды тез эле аткарамын. Тарых сабагынан тарыхый окуялар жана жаңы маалыматтар менен таанышамын. Тапшырмаларды аткаргандан кийин үй жумуштарын жасаймын, же болбосо чоң атама жардам беремин. Кечки тамактануудан кийин телевизор көрүп, музыка угамын, же көркөм адабий китеп окуймун. Түнкү уйкуга саат 22де жатамын."},{"t":"p","h":"Э_ 1. Анын иш күнү качан башталат экен? 2. Саат канчада сабак башталып, канчада аяктайт? 3. Кайсы сабактарды эң жакшы өздөштүрөт экен? 4. Ал качан үй жумуштарын жасайт, же болбосо качан чоң атасына жардам берет? 5, Кечки тамактануудан кийин эмне кылат?"},{"t":"p","h":"6. Саат канчада уктайт?"},{"t":"p","h":"Г] 64. Төмөнкү маекти улантып, сүйлөмдөрдү жандоочтор, байламталар менен байланыштыргыла."},{"t":"p","h":"1-о к у у ч у: Сен күн сайын эртең менен канчада ойгоносуң? 2-о к у у ч у: Мен күн сайын эртең менен саат ... ойгономун. Маекти уланткыла."}],"sub":[{"title":"МЕНИН ИШ КҮНҮМ","b":11}],"pages":[43,43]},{"title":"§17. Бөлүкчөлөр (гана, го) – Частицы","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"44\">44<\/span>§17. Бөлүкчөлөр (гана, го) – Частицы"},{"t":"p","h":"Кыргыз тилинде орус тилиндегидей эле айрым сөздөргө ар түрдүү кошумча маанини киргизүү үчүн колдонулган кызматчы сөздөр бөлүкчөл ө р деп аталат. "},{"t":"p","h":"Сүйлөшүүдө көпчүлүк учурда бардык сөз түркүмдөрү менен колдонулуучу төмөнкү бөлүкчөлөр кездешет."},{"t":"p","h":"Бөлүкчөлөр гана чектегич мааниде айтылат."},{"t":"p","h":"В кыргызском языке, как и в русском, имеются особые служебные слова-частиц ы, которые придают слову различные смысловые оттенки."},{"t":"p","h":"В разговорной речи наиболее часто встречаются следующие частицы, употребляющиеся со всеми частями речи."},{"t":"p","h":"Частица гана имеет значение ограничения (только). М исал ы: Окуу бөлмөсүндө бир гана студент отурат."},{"t":"p","h":"Элдияр гана эрте келди."},{"t":"p","h":"Бөлүкчө го божомолдогуч маанини билдирет."},{"t":"p","h":"Частицы го дает оттенок неопределенности и по – русски может быть переведена словами наверно, вероятно, возможно, кажется. М исалы: Үйдө Сайкал жок го."},{"t":"p","h":"Окуучулар эртең саякатка жөнөшөт го."},{"t":"p","h":"65. Сүйлөмдөрдү көчүрүп жазгыла. Бөлүкчөлөрдү аныктап, эрежесин түшүндүргүлө."},{"t":"p","h":"1. Т. Сатылганов акын гана болбостон залкар комузчу да болгон, 2, Жакында мектептер аралык спорттук мелдештер башталат го. З. Райондук олимпиадада биринчи орунду ээлеген окуучу гана сыйлык алды. 4. Сайкал жеңем түшкү тамагын даярдап бүттү го, 5.Тешкен тоо аркылуу Бишкек-Ош автомобиль жолу гана өтөт."},{"t":"p","h":"6.Компьютердик сабаттуулукка Жазгүл эжей гана ээ болду."},{"t":"p","h":"66. Көп чекиттин ордуна тиешелүү бөлүкчөлөрдү коюп жазгыла (гана, го)."},{"t":"p","h":"1. Нурбек ... сүрөттү эң жакшы тартат. 2. Биз бүгүн түшкү саат он экиде... жолугуша алабыз. З. Эжем менин туулган күнүмө белек алып келет ...‚ 4. Чыңгыз... жалгыз Туркияга учат..."},{"t":"p","h":"5. Мен кошумча сабакка катышууга үлгүрө албаймын ...."},{"t":"v","l":["67. Суроолорго жооп берүүдө бөлүкчөлөрдү пайдалангыла.","1. Сенин эң жакын досуң барбы? – (гана)","2. Экөөң кайсы тилде сүйлөшөсүңөр? – (гана)"]},{"t":"raw","h":"<div class=\"gloss\"><p>28<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"45\">45<\/span>3. Анын туулган күнү кайсы айда болот? – (го) 4. Сен досуң менен качан жолугушуп турасың? – (гана) 5. Убакытты кандай өткөрөсүңөр? —"},{"t":"v","l":["6. Бул дем алышта силер кайда барасыңар? – (го)","Т. Досуң кайсы сабакты жакшы өздөштүрөт? – (гана)","8. Силер спорт оюндарына катышасыңарбы? – (гана)"]},{"t":"p","h":"68. Макалдарды окуп, бөлүкчөнүн маанисине карай түшүндүрмө бергиле."},{"t":"v","l":["Адамды эмгек гана бактылуу кылат.","Акыл гана адамдын көркү.","Г 1) Жогорку макалдарды жатка билүү. р","Көп жашаган билбейт,","Көптү көргөн гана билет."]},{"t":"p","h":"2) Гана, эле, го бөлүкчөлөрү менен 4 сүйлөм түзүп, жазып келүү."}],"sub":[],"pages":[44,45]},{"title":"§ 18. Бөлүкчөлөр (экен, эле) – Частицы","blocks":[{"t":"h3","h":"§ 18. Бөлүкчөлөр (экен, эле) – Частицы"},{"t":"p","h":"Экен деген бөлүкчө айтылган сөздү аныктап, тактоо үчүн колдонулат"},{"t":"p","h":"Частица экен большей частью употребляется оказывается, уже, действительно, обязательно, т. е. для подтверждения какого-либо факта."},{"t":"p","h":"М исал ы: Ал адептцу кыз экен."},{"t":"p","h":"Бүгүн мектепте жыйналыш болот экен. Бөлүкчө эле бир затты, белгини же кыймылды башкалардан ажыратып бөлүп көрсөтүп, чектөө маанисин берет."},{"t":"p","h":"Частица эле в основном придает оттенок окончательности, категоричности и ограниченности."},{"t":"v","l":["М исалы: Бул имарат өткөн жылы курулган эле.","Автобекетке чейин жөө эле барабыз."]},{"t":"p","h":"69. Сүйлөмдөрдү окугула, бөлүкчөлөрдү далилдегиле жана сүйлөмдөрдү орус тилине которгула, 1. Нооруз майрамына үч эле күн калды. 2. Мектептин айланасына жаш көчөттөр отургузулат экен. 3. Кыргыз тилинен жазууга бир гана көнүгүү берилген. 4. Жакында көркөм сүрөт музейине барабыз го. 5. Айылда чоң атам менен чоң энем эле калышты."},{"t":"p","h":"<span class=\"pg\" data-n=\"46\">46<\/span>10. Көп чекиттин ордуна тиешелүү бөлүкчөлөрдү коюп, сүйлөмдөрдү көчүргүлө (экен, эле)."},{"t":"p","h":"1. Китепканада Салтанат өзү... калды. 2. Жапар таякем ... көлдө жакшы сүзөт .... 3. Чет элдик меймандарды «Кыргыз деңизи» санаторийинде сыйлашат ... ‚ 4. Ошко досум экөөбүз ... кетебиз."},{"t":"p","h":"5. Бүгүн театрда жаңы спектаклдин премьерасы ...."},{"t":"p","h":"71. 1) «Кош теректер» деген Алтынай менен Дүйшөн агайдын диалогун окугула. Диалогдон кызматчы сөздөрдү таап, аларды маанисине карай үч топко бөлгүлө."},{"t":"p","h":"Дүйшөн ага й: – Алтынай, мына бул теректерди мен сага ганё арнап алып келдим.., 4 2"},{"t":"p","h":"Алтынай: – А-ий, менин боюм менен тең болгон, жакшынакай жаш терекчелер экен! 4"},{"t":"p","h":"Дүйшөн ага й: – Ооба, ушулар жетилип өскөнгө чейин, сен да чоңоёосуң. Убакыт өткөн сайын, сен көктөп бүрдөйсүң. Анан чоң шаарды көздөй окууга жөнөйсүң."},{"t":"p","h":"Алтынай: – Окуп, келечекте билимдүү адам боломбу, агай? Дүйшөн ага й: – Менин оюм боюнча сен чоң окумуш болосуң. Анткейй, сенин дээринде бар, арй акылың тунук, ар зээндүү кызсың. 4"},{"t":"p","h":"Алтынай: – Дүйшөн агай, келечекке карай туура багыт алдым, Мен сизден гана алган башталгыч билимди сөзсүз улантамын."},{"t":"p","h":"Дүйшөн ага й: – Алтынай, ушул тилегине багыштап, бул терекчелерди өз колубуз менен тигип коёлу. Багың окуудан ачылсын!"},{"t":"p","h":"Алтынай: – Карасаңыз агай, тигилген ордуна жараша экөө жанашып калганын!"},{"t":"p","h":"Дүйшөн ага й: – Мына көрдүңбү, кандай экенин! – Эми тиги чон булактан арык чыгарып жобу. Көрөсүң, кийин кандай келишкен зор теректер болор экен; сун. Бул теректер менен бой тиреше мен р. эс тартармын! Алтынай: – Бардыгына чайыттай, кирсиз асман кубе бол-"},{"t":"p","h":"Дуйшен ага й: Биздин кош теректер дөбөдө туруп, бийиктеген сайын, келген-кеткендин баарына керунет. Анда заман да башка болот. Аман болсок, жакшылыктын – баары алдыда, Алтынай..."},{"t":"p","h":"Алтынай: Дүйшөн агай, мен сизге өмүр бою ыраазымын! Сиздин ишеничти актоого мен дилгирмин!"},{"t":"p","h":"Ч. Айтматов, «Биринчи мугалим» Ү лгү: 1. Жандоочтор: чейин,"},{"t":"v","l":["2. Байламталар: ары,","З. Бөлүкчөлөр: гана,"]},{"t":"p","h":"<span class=\"pg\" data-n=\"47\">47<\/span>э 1. Дүйшөн агайдын терекчелери кимге гана арналган?"},{"t":"p","h":"2. Дүйшөн агай менен Алтынайдын терекчелери эмнеге багышталып тигилген экен?"},{"t":"p","h":"3. Дүйшөн агайдын ою боюнча Алтынай келечекте ким болот?"},{"t":"p","h":"4. Эмне үчүн Алтынай өмүр бою Дүйшөн агайга ыраазы?"},{"t":"p","h":"5. Алтынай агайынын ишеничин актай алдыбы?"},{"t":"p","h":"6. Алтынай силер үчүн үлгүлүү каарманбы, оюңарды ортого салгыла."},{"t":"p","h":"ЁС Жогорудагы диалогду кырааты менен көркөм окуп келүү."}],"sub":[],"pages":[46,47]},{"title":"§ 19. Бөлүкчөлөр (эч, өтө, абдан) – Частицы","blocks":[{"t":"h3","h":"§ 19. Бөлүкчөлөр (эч, өтө, абдан) – Частицы"},{"t":"p","h":"Бөлүкчөлөр эң, өтө, абдан дайыма тиешелүү сөздөн мурун келип, анын маанисин күчөтүп көрсөтөт."},{"t":"p","h":"Күчөткүч бөлүкчө эң сын атоочтор менен, айрым тактоочтор менен, кээде алды, устц, арты деген жардамчы сөздөр менен бирге айтылат."},{"t":"p","h":"Частицы эң, абдан, өтө, всегда ставятся перед словом, к которому относятся и усиливают его значение."},{"t":"p","h":"Усилительная частица эн в основном употребляется с прилагательными и отдельными наречиями, а иногда вспомогательными словами, такими как: М и с ал ы: Тушоо кесүү жарышында Бекзуура жеңем эн алдыда келди (жардамчы сөз)."},{"t":"p","h":"Берилген тапшырманы Алтынай эң ылдам аткарды (тактооч). Мага эң оор маселе туш келди (сын атооч). Күчөткүч бөлүкчө өтө сын атооч, этиш, кээ бир тактоочтор менен бирге айтылат."},{"t":"p","h":"Усилительная частица өтө употребляется с прилагательными, глаголами и некоторыми наречиями."},{"t":"p","h":"М ы: Ал өтө жөнөкөй адам (сын атооч). Төлөгөн Акматовичти биз өтө барктайбыз (этиш). Менин курбум өтө жакшы окуйт (тактооч)."},{"t":"p","h":"Күчөткүч бөлүкчө абдан сын атооч, этиш жана айрым тактоочтор менен бирге айтылат."},{"t":"p","h":"Усилительная частица абдан употребляется с прилагательными, глаголами и отдельными наречиями."},{"t":"p","h":"М и сал ы: Дамира Эсеналиевнанын жылдын мыкты кызматкери болгонуна абдан суйундук (этиш)."},{"t":"v","l":["Эжейибиз абдан сүрдүү көрүнөт (сын атооч).","Айылга абдан кеч жетишти (тактооч)."]},{"t":"p","h":"<span class=\"pg\" data-n=\"48\">48<\/span>72. Бөлүкчөлөрдү маанисине карата туура жайгаштырып, дептериңерге жазгыла."},{"t":"v","l":["1. Гүлнур Сатылганованын үнү ... уккулуктуу.) го","2. Тарых музейинин имараты бийик...","З. Ак куу... сулуу көрүнөт.","эң","экен","4. Мен китебимди текченин ... үстүнө койдум. абдан","5. Үйдө чоң энем... калган....","6. Апам жумуштан азыр чыга","Т. Бөбөгүм жомокту ... кызыгып угат.","","73. 1) Текстти окугула."]},{"t":"h3","h":"МЕНИН ҮЙҮМ"},{"t":"v","l":["өтө","гана","эле, экен"]},{"t":"p","h":"Мен Чолпон-Ата шаарынын 2-кичирайонунда жашаймын. Биздин үй Абай атындагы көчөдө жайгашкан. Үй ичинде бардык шарттар бар. Бардык бөлмөлөр таза, жарык жана кенен. Менин бөлмөм өзүмө абдан жагат. Бөлмөдө турган пианинодо ойноймун, анан сабактарымды окуймун. Короодо бакча, абдан кооз гүлзар бар. Алма, алмурут, өрүк, шабдалы сыяктуу түрдүү жер-жемиштер отургузулган. Жыл сайын күзүндө жакшы түшүм берет, анткени биз бакчага көп көңүл бурабыз."},{"t":"p","h":"Гүлзардын жанындагы теннис аянтчасында бир туугандарым же досторум менен ойноймун. Биз жашаган турак-жайыбызды ар дайым таза кармап, ага камкордук көрөбүз."},{"t":"p","h":"а) Тексттен алынган төмөнкү кызматчы сөздөрдөн бөлүкчөлөрдү ажыраткыла:"},{"t":"p","h":"ошентсе да; да, өтө, жана, анткени, аябай, жана да, сайын, эң, анткени, соң, гана, эле, экен, же болбосо."},{"t":"v","l":["б) Төмөнкү сөздөрдү которуп, сөздүгүңөргө жазгыла:","@ электрдик жылытуу системасы —","конок бөлмө —","тиешелүү —","гүлзар —","чыдамдуу —","турак-жай —"]},{"t":"p","h":"в) Текст боюнча суроолорго бөлүкчөлөрдү пайдаланып жооп берүү менен эки-экиден маек түзгүлө."},{"t":"v","l":["– Анын жашаган үйү кайсы шаарда экен?","– Үй ичинде кандай шарттар түзүлгөн?","– Бөлмөлөрдүн тазалыгы кандай экен?"]},{"t":"p","h":"Кандай жер-жемиштери бар жана түшүмдүүлүгү кандай?"},{"t":"raw","h":"<div class=\"gloss\"><p>32<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"49\">49<\/span>– Жазында кандай жумуштарды аткарышат?"},{"t":"p","h":"– Гүл бакчанын жанында кандай аянтча бар жана спорттун кайсы түрү менен машыкса болот экен?"},{"t":"p","h":"– Турак-жайына кандай камкордук жүргүзүшөт экен?"},{"t":"p","h":"– Бул үй сага жактыбы?"},{"t":"p","h":"5 Монолог түрүндө «Менин үйүм» деген текст жазгыла жана айтып бергиле,"},{"t":"p","h":"ЧЕЙРЕК БОЮНЧА КАЙТАЛОО -"}],"sub":[{"title":"МЕНИН ҮЙҮМ","b":14}],"pages":[48,49]},{"title":"§ 20. ПОВТОРЕНИЕ ПРОЙДЕННОГО ЗА ЧЕТВЕРТЬ Тууранды сөздөрдү кайталоо","blocks":[{"t":"h3","h":"§ 20. ПОВТОРЕНИЕ ПРОЙДЕННОГО ЗА ЧЕТВЕРТЬ Тууранды сөздөрдү кайталоо"},{"t":"p","h":"74. Сүйлөмдөрдү маанисине карата тууранды сөздөр менен толуктагыла."},{"t":"v","l":["1. Түнкү асманда жыбыраган жылдыздар .. этишет,","а) жарк-журк","б) жылт-жулт","в) шыбыр-шыбыр","г) зың-зың"]},{"t":"p","h":"2. ... атылган мылтыктын үнүнөн капчыгай ичи жаңырды."},{"t":"p","h":"а) каңгыр-күңгүр"},{"t":"v","l":["б) дүп","в) тарс-тарс","г) карч","3. Чоң энем ... басып боз үйгө кирди.","а) тез-тез","б) багжаң-багжаң","в) күп","г) бөкчөң-бөкчөң","4. Күлсүн эженикинен балдардын ... үндөрү күчөдү.","а) ызы-чуу","б) чуру-чуу","в) кажы-кужу","г) күбүр-шыбыр","5. Таң эрте сааттын ... эткени уйкуну бузду.","а) тырс-тырс","б) шак-шак","в) чык-чык","г) кылдыр-кылдыр"]},{"t":"p","h":"75. Маанисине карай тууранды сөз кандай болуп бөлүнөт?"},{"t":"p","h":"а) Байламталар"},{"t":"v","l":["б) Жандоочтор","в) Табыш","г) Элес","1. Табыш тууранды сөздөрдү белгилегиле:"]},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>а) кыйкырды<\/td><td>а) калдаң-калдаң<\/td><td>а) калдыр-күлдүр<\/td><\/tr><tr><td>б) шарп-шарп<\/td><td>б) жалт-жулт<\/td><td>б) кымыңдаган<\/td><\/tr><tr><td>в) жылаажындай<\/td><td>в) лып<\/td><td>в) эрбең-сербең<\/td><\/tr><tr><td>г) жал-жал<\/td><td>г) зың-зың<\/td><td>г) мөлт-мөлт<\/td><\/tr><\/table><\/div>"},{"t":"raw","h":"<div class=\"gloss\"><p><\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"50\">50<\/span>2. Элес тууранды сөздөрдү белгилегиле;"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>а) бакылда<\/td><td>а) кылт-кылт<\/td><td>а) тарс<\/td><\/tr><tr><td>б) жылт<\/td><td>б) такылда<\/td><td>б) шака-шука<\/td><\/tr><tr><td>в) каак-каак<\/td><td>в) маа<\/td><td>в) үлп<\/td><\/tr><tr><td>г) ызы-чуу<\/td><td>г) шуу-шуу<\/td><td>г) арс-арс<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"76. Текстти окугула. Тууранды сөздөрдү таап, эрежеге ылайык эки топко (табыш жана элес тууранды сөздөр) бөлүп жазгыла."},{"t":"h3","h":"МЕНИН ТУУЛГАН ЖЕРИМ"},{"t":"p","h":"Мен төрөлгөн айыл Калкагар тоосунун этегинде жайгашкан. Чоң сайдан шылдыр-шылдыр аккан булак айыл ичин аралайт. Бул бадалдуу сайда табылгы, бөрү карагат, четин, тоо „карагат, чычырканак, шилби, шыралжын жана башкалар өсөт. Буларды уялаган тоо чымчыктары чыр-чыр сайрап, ары-бери учуп-конушат. Ал эми кооз карагайлар тоо бетине көрк берип, жайы-кышы жапжашыл.[Җел жүрсө, алар шуу-шуу этип үн сала күүлөнүшөт. Алардын шуулдаган үнүнө жарыша, айылдагы бак-дарактар да шамалга леп-леп желпилдейт! Жайкысын мөлт-мөлт аккан булактын муздак суусунан ичип, лып-лып учкан кооз көпөлөктөрдү кармайбыз. Кызыл-тазыл гүл терип, чуру-чуу чуркап, кубалашып ойнойбуз. Шурудай тизилген мөлтүр тоо карагаттарын терип, үйгө кайтабыз. |Жаз, жай мезгилдеринде бир заматта кун бүркөлүп, чагылган жарк-журк чартылдап, көз ачырбай жамгыр төгөт. Жамгырдан кийин көк шиберлүү талаа-түздөр жайкалып, айыл ичи жаңырат. Ошентип, туулган жеримдин топурагы алтын."},{"t":"p","h":"е бадалдуу сай – русло реки, по-"},{"t":"v","l":["росшее кустарником","бөрү карагат – барбарис","шилби – жимолость, волчья","ягода","табылгы – таволга, спирея","уяла – гнездиться"]},{"t":"p","h":"тоо карагат – дикая (горная) смо-"},{"t":"v","l":["родина","шыралжын – полынь, эстрагон","чычырканак – облепиха","көз ачырбай жамгыр төгөт -дождь","льет, глаз открыть не дает","четин – рябина"]},{"t":"p","h":"77. Сөздөрдү маанисине жараша байланыштырып, сөз айкаштарын түзгүлө:"},{"t":"v","l":["1) туулган","2) тоо","З) көрк","4) бийик","1) суу","2) төгүү","3) үн","4) көпөлөктөр","<span class=\"pg\" data-n=\"51\">51<\/span>5) бадалдуу","6) шуулдаган","Т) муздак","8) жамгыр","9) кооз","10) айыл","11) камкордук","12) мал","18) түркүн","5) багуу","6) адамдары","Т) канаттуулар","8) жер","9) сай","10) чымчыктары","11) берүү","12) тоолор","18) көрүү","","1. Жаңы сөздөрдү которуп, аларды жаттагыла."]},{"t":"p","h":"2..Туулган жердин топурагы алтын» дегенди кандай түшүнөсүңөр, мазмунун чечмелегиле."},{"t":"p","h":"3.«Менин туулган жерим» текстине план түзгүлө да, мазмунун айтып бергиле."}],"sub":[{"title":"МЕНИН ТУУЛГАН ЖЕРИМ","b":14}],"pages":[50,51]},{"title":"§ 21. Жандоочторду кайталоо – Повторение послелогов","blocks":[{"t":"h3","h":"§ 21. Жандоочторду кайталоо – Повторение послелогов"},{"t":"p","h":"78. Төмөнкү кызматчы сөздөрдүн ичинен жандоочторду бөлүп жазгыла."},{"t":"p","h":"демек, жараша, ал эми, үчүн, эгерде, ошондуктан, карата, же, ошол себептүү, дейре, антсе да, көздөй, кандай, чейин, гана, ары, эле."},{"t":"p","h":"79. Атооч жөндөмөсүндөгү сөздөр менен айкашуучу жандоочторду белгилегиле:"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>а) жана да<\/td><td>в) аркылуу<\/td><td>а) бери<\/td><td>в) же<\/td><\/tr><tr><td>б) эгерде<\/td><td>г) соң<\/td><td>б) ошол<\/td><td>г) боюнча<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"2. Барыш жөндөмөсүндөгү сөздөр менен айкашуучу жандоочторду белгилегиле:"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>а) экен<\/td><td>в) абдан<\/td><td>а) жараша<\/td><td>в) көрө<\/td><\/tr><tr><td>б) себеби<\/td><td>г) караганда<\/td><td>б) бирок<\/td><td>г) да<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"3. Табыш жендемесундегу сөздөр менен айкашуучу жандоочторду белгилегиле:"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>а) бойдон<\/td><td>в) менен<\/td><td>а) анткени<\/td><td>в) карата<\/td><\/tr><tr><td>б) карай<\/td><td>г) дейре<\/td><td>б) өтө<\/td><td>г) бою<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"4. Чыгыш жөндөмөсүндөгү сөздөр менен айкашуучу жандоочторду белгилегиле:"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>а) мурун<\/td><td>в) эгер<\/td><td>а) аркылуу<\/td><td>в) ал эми<\/td><\/tr><tr><td>б) ары<\/td><td>г) чейин<\/td><td>б) кийин<\/td><td>г) же болбосо<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"52\">52<\/span>80. Көп чекиттин ордуна тиешелүү жандоочторду коюп, сүйлөмдөрдү көчүрүп жазгыла."},{"t":"p","h":"1. Окуучулар улуттук китепканага класс жетекчиси ... бирге барышты. 2. Мен билимимди улантуу ... жогорку окуу жайына тапшырдым. 3. Улуу Жеңиш майрамына ... аз эле күн калды."},{"t":"p","h":"4.Бул макалада тил илими ... жазылган. 5. Конференциядан ... чет элдик студенттер менен жолугушууга барабыз."},{"t":"p","h":"1) чейин 2) кийин 3) жөнүндө 4) менен 5)үчүн 81. Бул маекти каармандаштырып, көркөм окугула, Жандоочторду бөлүп, эрежеге ылайык далилдегиле."},{"t":"p","h":"О ку уч у: – Агай, бул кимдин сүрөтү?"},{"t":"p","h":"М – Байтик Канай уулунун сүрөтү. Бул тарыхый адам тууралуу билесиңби?"},{"t":"p","h":"О к ууч у: – Жок, билбеймин."},{"t":"p","h":"М угалим: – Ал эл ичинде «баатыр» деген ардактуу атка конгон. 1862-жылы Байтик Канай уулу Чүй өрөөнүндө Кокон хандыгына каршы кыргыздардын көтөрүлүшүн жетектеген."},{"t":"p","h":"О к ууч у: – Демек, Байтик ата кыргыз элинен чыккан баатыр болгон экен да."},{"t":"p","h":"М уга л и м; – Ооба, орус аскерлери менен бирге Бишкек, Мерке, Олуя-Ата чептерине карай чабуул койгон. Андан соң алар алынган жана талкаланган. Байтик ата орус өкмөтүнүн Чоң алтын медалы жана Ш даражадагы ордени менен сыйланган."},{"t":"p","h":"О к у уч у: – Ал эми биз атаны эскере тургандай тарыхый нерселер барбы?"},{"t":"p","h":"Мугалим: – Бишкек шаарынын түштүгүндө күмбөз турат. Жуз жылдан бери ал жаан-чачынга, борошо-шамалга туруштук берип турат. Бул күмбөз – Байтик Канай уулунуку."},{"t":"p","h":"О Сизге ыраазымын. Биздин маек мага абдан пайдалуу болду. Мен каникулда сөзсүз ата-энем менен Байтик атанын күмбөзүн көрүп келемин."},{"t":"v","l":["_1 а) Төмөнкү сөздөрдү которуп, сөздүгүңөргө жазгыла:","1. эл ичинде —","З. эрдик —","4. чабуул —","5. ардактуу ат —","6. чеп —"]},{"t":"p","h":"Т. борошо-шамал – 8. туруштук берүү – 9. күмбөз – б) Маектешүүнүн жыйынтыгында биз эмне жөнүндө билдик?"},{"t":"p","h":"<span class=\"pg\" data-n=\"53\">53<\/span>1. Кокон хандыгы."},{"t":"p","h":"2. Кыргыздардын көтөрүлүшү."},{"t":"p","h":"3. Байтик Канай уулу."},{"t":"p","h":"4. Бишкек, Мерке, Олуя-"},{"t":"v","l":["Ата чеби.","5. Байтик атанын күмбөзү.","","в) Байтик Канай уулу жөнүндө чакан аңгеме түзүп келүү."]}],"sub":[],"pages":[52,53]},{"title":"§ 22. Байламталарды кайталоо","blocks":[{"t":"h3","h":"§ 22. Байламталарды кайталоо"},{"t":"p","h":"82. Тексттеги жөнөкөй сүйлөмдөрдү тиешелүү байламталар аркылуу байланыштырып окугула,"},{"t":"h3","h":"БИЗ ТАБИЯТ МЕНЕН ТАТТУУ МАМИЛЕДЕ БОЛОБУЗ"},{"t":"p","h":"1. Күн жылыды. Канаттуулар кайтып келишти. 2. Алар биздин кичинекей жардамчыларыбыз... талаа зыянкечтерин жок кылышат. 3. Канаттуу куштар пайдалуу... биз аларга камкордук көрүшүбүз керек. 4. Мектепте канаттуулар күнү белгиленет... бүгүн окуучулар үчүн кызыктуу ачык сабактар өтүлөт. 5. Кичинекей досторубуз үчүн кооз уяларды жасоого мелдеш уюштурулат. Жеңүүчүлөргө сыйлык берилет. 6. Аларга жагымдуу шарттар түзүлөт... канаттуулар эркин көбөйүшөт. 7. Жер үстүндө канча чабалекей көп болсо... чымын-чиркейлер жок болот. 8. Кара чыйырчыктар болбосо зыянкечтер тез көбөйөт... 9. Журтчу, жору, кузгун, каргалар талаада өлгөн жапайы жаныбарларды жеп жоготушат... айрым жугуштуу дарттар адамга коркунуч келтирбейт."},{"t":"p","h":"Пайдаланылуучу байламталар: ошонун натыйжасында, ошол себептцу, ошончо, анткени, себеби, эгерде, ошондуктан."},{"t":"p","h":"1) Сөздөрдү сөздүктүн жардамы менен которгула жана көчүрүп жазгыла."},{"t":"v","l":["зыянкечтер —","камкордук көрүү -","жеңүүчүлөргө сыйлык берилет —","жугуштуу дарттар —","журтчу -","жору —","кузгун —","карга","чабалекей -","коркунуч -","9 1. Эмне үчүн канаттуулар кайтып келишти?"]},{"t":"p","h":"2. Эмне себептен канаттуулар биздин кичинекей жардамчыларыбыз?"},{"t":"p","h":"3. Эмне үчүн биз аларга камкордук көрүшүбүз керек?"},{"t":"p","h":"4. Эмненин натыйжасында чымын-чиркейлер, зыянкечтер жана жугуштуу дарттар адамга коркунуч келтирбейт?"},{"t":"p","h":"<span class=\"pg\" data-n=\"54\">54<\/span>2) Канаттуу куштар жөнүндөгү тексттен маанилеш сөздөрдү тапкыла, 3) Тексттин негизги идеясы кайсы? Айтып бергиле."},{"t":"v","l":["а) Канаттуу куштарды көбөйтүү.","б) Кичинекей досторго камкордук көрүү.","в) Табигат менен таттуу мамиледе болуу.","г) Канаттуулар күнүн белгилөө,","8З. Берилген варианттардан байламталарды белгилегиле."]},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>2. а) жөнүндө<\/td><td>3, а) анткени 4. а)<\/td><\/tr><tr><td>ошол учун<\/td><td>б) кудум<\/td><td>б) түгүл<\/td><td>б) бирок<\/td><\/tr><tr><td>в) карай<\/td><td>в) же болбосо<\/td><td>в)чейин<\/td><td>в) үчүн<\/td><\/tr><tr><td>г) сыяктуу<\/td><td>г) абдан<\/td><td>г) ооба<\/td><td>г) эле<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"84. Байламталар курамына карай кандай болуп бөлүнөт, туура жообун белгилегиле,"},{"t":"v","l":["а) Багындырбас жана багындырма.","б) Каршылагыч жана ажыраткыч.","в) Жөнөкөй жана татаал.","г) Шарттуу жана салыштырма.","1) Багындырбас байламталарды белгилегиле.","а) Мезгил, орун, сыпат.","б) Себеп-натыйжалагыч, шарттуу, салыштырма.","в) М гилүү болгон эң биринчи кыргыздын аты. Барсбек ажо кыргыз башкаруучу династиясынан чык- ъз кан. Барсбек кичине кезинде эле жетим калган. Анын төрт бир Же тууганы болгон экен. Барсбек үй-бүлөдөгү балдардын эң улуусу эмес, бирок өзүнүн абдан жакшы сапаттары менен үйдө болгон. ' Барсбек ажонун башкаруусунда Кыргыз мамлекетинин эл аралык кадыр-баркы өскөн. Ал учурда Барсбек башында турган Кыргыз <span class=\"pg\" data-n=\"56\">56<\/span>каганаты өтө күчтүү болуп эсептелген. б Бирок алардын душманы Түрк каганаты Барсбекке каршы чыккан. Түрктөр кыргыздарга капыстан кол салышкан. Мында кыргыздардын эң негизги күчтөрү талкаланган, анткени түрктөрдүн саны көп болгон. Эрдик жана каармандык эки тараптан бирдей эле көрсөтүлгөн. Аскердик өнөрдү өтө мыкты өздөштүргөн түрктөр Кыргыз каганын өлтүргөн жана анын элин багындырган. Ошентип, Кыр- – гыз мамлекети Экинчи Түрк каганатына ал 744-жылы кулаганга чейин көз каранды болуп турган. 4?” Барсбектин эң мыкты сапаттары мындан 100 жыл мурда Енисейде табылган абдан бийик таш мамыда оюлуп жазылган. *"},{"t":"p","h":"«Кыргызстан» энциклопедиясынан © абдан мыкты сапаттары —"},{"t":"v","l":["самые высокие качества","эл аралык – международный","кадыр-барк – авторитет","эрдик – мужество","каармандык – геройство","өнөр – умение","таш мамы – каменный столб"]},{"t":"p","h":" 1. Берилген суроолор боюнча ой жүгүртүп, жообун дептериңерге а) Барсбектин эң мыкты сапаттарын атап бере аласыңарбы?"},{"t":"p","h":"б) Барсбек ажонун эл аралык кадыр-баркынын өсүшү эмнеге байланыштуу эле?"},{"t":"p","h":"в) Эмне себептен Кыргыз каганаты түрктөрдөн жеңилип калган?"},{"t":"p","h":"г) Аскердик өнөрдүн күчтүүлүгү кандай натыйжа берет?"},{"t":"p","h":"д) Биз үчүн таш мамыдагы жазуунун кандай тарыхый маа-"},{"t":"p","h":"2, «Үч энем» деген ырды жаттагыла."}],"sub":[{"title":"ҮЧ ЭНЕМ","b":2},{"title":"БАРСБЕК","b":13}],"pages":[55,56]},{"title":"§ 24. СӨЗ ӨСТҮРҮҮ САБАКТАРЫ, ТЕКСТ МЕНЕН ИШТӨӨ УРОКИ РАЗВИТИЯ РЕЧИ, РАБОТА С ТЕКСТАМИ Зат атоочту кайталоо —","blocks":[{"t":"h3","h":"§ 24. СӨЗ ӨСТҮРҮҮ САБАКТАРЫ, ТЕКСТ МЕНЕН ИШТӨӨ УРОКИ РАЗВИТИЯ РЕЧИ, РАБОТА С ТЕКСТАМИ Зат атоочту кайталоо —"},{"t":"v","l":["Повторение имени существительного","&gt; Эске түшүргүлө:","1. Зат атооч деген эмне?","2. Энчилүү аттарга кандай сөздөр кирет?"]},{"t":"raw","h":"<div class=\"gloss\"><p>жазып келгиле. ниси бар? 40<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"57\">57<\/span>3. Жалпы аттарга кандай сөздөр кирет?"},{"t":"p","h":"4. Зат атооч сан категориясына карай кандай болуп бөлүнөт?"},{"t":"p","h":"5. Зат атоочтор кандай мүчөлөр менен өзгөрөт?"},{"t":"p","h":"88. Текстти окугула, сүйлөмдөрдөгү зат атооч сөздөрдү таап ажыраткыла, алардын кайсы санда, жөндөмөдө турганын түшүндүргүлө."},{"t":"h3","h":"МЕНИН ДЕМ АЛЫШ КҮНҮМ"},{"t":"p","h":"Бир жумада алты күн катары менен мектепке барамын. Ал эми жекшемби менин эс алуу күнүм. Бул күн мага абдан жагат, Анткени убакытты өзүм каалагандай өткөрөмүн. Эртең менен шашылбай саат 9да турамын да, көнүгүү жасаймын. Жуунуп, андан соң тамактанамын. Ата-энеме жардам беремин. Апам жасаган абдан даамдуу түшкү тамакты ичип, телевизор көрөмүн, музыка угамын, көркөм адабий чыгармалардан окуймун. Досторум менен спорт оюндарын ойноп, машыгамын. Кечки тамактануудан кийин ата-энем, бир туугандарым болуп паркка сейилдегени чыгабыз. Же болбосо чоң ата, чоң энемдикине барабыз. Кээде көргөзмөлөргө, театрга, же концертке барып, маданияттуу эс алабыз. Мен дем алыш күнүмдү жагымдуу, кызыктуу өткөрөмүн. Ошентип жаңы күч-кубат, дем менен кийинки окуу күнүмдү баштаймын."},{"t":"p","h":"1. Тексттен алынган төмөнкү сөздөрдүн маанисин сүйлөмдүн контекстинде аныктап түшүндүргүлө."},{"t":"v","l":["көркөм адабий чыгарма","сейилдөөгө чыгуу","көрүшүү","маданияттуу","? Эмне үчүн ага дем алыш күн жагат?","көргөзмө","жагымдуу","күч-кубат","","Ал түшкө чейин убактысын кандай өткөрөт?"]},{"t":"p","h":"Түшкү тамактануудан кийин эс алуу убактысында эмне кылат? Кечинде кимдер менен сейилдейт?"},{"t":"p","h":"Ал кандай эс алат?"},{"t":"p","h":"Г] 1. Тексттин мазмунуна таянып, дем алыш күнүңөр жөнүндө айтып бергиле."},{"t":"h3","h":"&amp; 25. Сын атоочту кайталоо — Повторение имени прилагательного"},{"t":"p","h":"» Эске түшүргүлө:"},{"t":"p","h":"1. Кандай сөздөр сын атоочтор деп аталат?"},{"t":"p","h":"<span class=\"pg\" data-n=\"58\">58<\/span>2. Сын атооч грамматикалык айрым өзгөчөлүктөрүнө карай кандай болуп бөлүнөт?"},{"t":"p","h":"З. Сын атоочтун кандай даражалары бар?"},{"t":"p","h":"4. Женекей сын атооч канча сөздөн турат жана заттын кандай белгисин билдирет?"},{"t":"p","h":"5. Татаал сын атооч канча сөздөн туруп, заттын кандай белгисин көрсөтөт?"},{"t":"p","h":"89. Ырды кырааты менен окуп, тилиңерди жатыктыргыла."}],"sub":[{"title":"МЕНИН ДЕМ АЛЫШ КҮНҮМ","b":7},{"title":"&amp; 25. Сын атоочту кайталоо — Повторение имени прилагательного","b":15}],"pages":[57,58]},{"title":"УШУНДАЙ БОЛ","blocks":[{"t":"h3","h":"УШУНДАЙ БОЛ"},{"t":"p","h":"Таза болсоң – суудай бол, Аппак болсоң – куудай бол. Назик болсоң – гүлдөй бол, Бийик болсоң – күндөй бол."},{"t":"p","h":"Терең болсоң – көлдөй бол, Күчтүү болсоң – жердей бол. Өткүр болсоң – кылыч бол, Тууган элге ырыс бол."},{"t":"p","h":"А. Токтомушев 1. Ырсаптарынан сапаттык жана катыштык сын атоочторду тапкыла да, аныктагыла,"},{"t":"v","l":["Ү л гү: сапаттык сын атооч —","таза,","катыштык сын атооч —","суудай,"]},{"t":"p","h":"2. Жай даражадагы сын атоочтордун салыштырма җана күчөтмө даражаларын төмөнкү үлгүдө жазгыла;"},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>жай даража<\/td><td>салыштырма даража<\/td><td>күчөтмө даража<\/td><\/tr><tr><td>таза<\/td><td>тазараак<\/td><td>таптаза<\/td><\/tr><tr><td>ак<\/td><\/tr><tr><td>назик<\/td><\/tr><tr><td>де<\/td><\/tr><tr><td>бийик<\/td><\/tr><tr><td>терен<\/td><\/tr><tr><td>кучтуу<\/td><\/tr><tr><td>өткүр<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"90. Текстти окугула, жаңы сөздөрдү сөздүгүңөргө жазгыла. Сын атоочтордун астын сызгыла, алардын жөнөкөй жана татаал экендигин аныктагыла,"},{"t":"h3","h":"ШЕКЕР АЙЫЛЫ"},{"t":"p","h":"Биздин Шекер – эң чоң айыл. Үч жүздөн ашык түтүн бар. Каттаган сайын тигинден-мындан жаңы үйлөрдүн төбөсүн көрүп калам. Айылым өсүп барат, чоңоюп барат. Турган орду да малга-жанга жайлуу, суу башында. Таластын Жанарка тоосунун этегинде, эзелтен Манас делип аталган кош чокулуу тоонун так түбүндө."},{"t":"raw","h":"<div class=\"gloss\"><p>42<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"59\">59<\/span>Бул чокудан төгөрөктүн төрт бурчу көрүнөрү ырас, акыйкатта эпикалык масштаб. Ошондон ушул күнгө Манас-Тоонун мөңгүсүнөн тамчыга тамчы кошулуп куралып, биздин Шекерге ак көбүк, көк буурул суу агып келет. Ал – Күркүрөө. Бул аймакта жер бетинде кыбыраган жан-жаныбарга өмүр берген суу."},{"t":"p","h":"Ч. Айтматов @ түтүн – здесь: как отдельная семья"},{"t":"v","l":["каттаган сайын – каждый приезд","төгөрөктүн төрт бурчу – весь свет, весь мир","тоосунун этегинде – у подножья горы","Манас-Тоонун мөңгүсүнөн – из-под ледника Манас-Тоо","кош чокулуу – двухвершинный","ак көбүк, көк буурул суу – бурная, студёная вода","кыбыраган жан-жаныбарлар – все живые существа","малга-жанга жайлуу – удобный для всех","суу башында – у истока воды","эзелтен – издревле, с давних пор","өмүр берген – дающая жизнь","? Шекер кандай айыл?"]},{"t":"p","h":"Ал каттаган сайын кандай үйлөрдүн төбөсүн көрүп калат? Айылдын турган орду кандай?"},{"t":"v","l":["Айыл кандай тоонун түбүндө жайгашкан?","Шекер айылына кандай суу агып келет?"]},{"t":"p","h":"91. Берилген зат атоочторго ылайыктуу сын атоочторду кошкула, кыз, алма, тоо, кар, имарат, көл, түн, күн, үй, китеп, кийимдер, бөлмө, суу, билим, балдар, топ, гүлзар."},{"t":"p","h":"Ү лгү: адептуци кыз;"},{"t":"p","h":"Төмөнкү суроолорго жооп берүү менен айылда жашаган окуучулар «Менин айылым», ал эми шаарда жашагандар «Менин шаарым» аттуу чакан текст түзүп, айтып бергиле."},{"t":"p","h":"? 1. Сен кайсы шаарда (айылда) жашайсың?"},{"t":"p","h":"2. Ал кайсы аймакта жайгашкан жана анда бардыгы канча түтүн бар?"},{"t":"p","h":"3. Шаарындын (айылыңдын) көрүнүшү, жаратылышы кандай?"},{"t":"p","h":"4. Анын кандай көзгө көрүнүктүү, өзгөчө нерселери бар?"},{"t":"p","h":"5. Сенин шаарыңдан (айылыңдан) чыккан сыймыктуу инсандар барбы?"},{"t":"p","h":"6. Сен өзүңдүн шаарың (айылың) менен сыймыктанасыңбы?"}],"sub":[{"title":"ШЕКЕР АЙЫЛЫ","b":8}],"pages":[59,59]},{"title":"§ 26. Сан атоочту кайталоо — Повторение имени числительного","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"60\">60<\/span>§ 26. Сан атоочту кайталоо — Повторение имени числительного"},{"t":"p","h":"92. Туура жообун белгилегиле, сан атоочту кайталап, эске түшүргүлө."},{"t":"p","h":"1. Кандай сөз түркүмү сан атооч деп аталат?"},{"t":"v","l":["а) Сын-сыпатын, өңү-түсүн көрсөтүүчү","б) Заттын атын, кубулушун билдирүүчү","в) Кыймыл-аракетти билдирүүчү","г) Заттын санын, эсебин, иретин көрсөтүүчү","2. Түзүлүшүнө карай сан атооч кандай болуп бөлүнөт?","а) Кош жана кошмок сан атоочтор","б) Эсептик жана иреттик сан атоочтор","в) Жөнөкөй жана татаал сан атоочтор","г) Жамдама жана чамалама сан атоочтор","3. Маанисине карай сан атооч кандай болуп бөлүнөт?","а) Күчөтмө, салыштырма, жай","б) Жактама, шилтеме, сурама","в) Аныктама, белгисиз, таңгыч"]},{"t":"p","h":"г) Эсептик, иреттик, жамдама, чамалама, бөлчөк, топ сандар 4. Сан атоочтор кандай суроолорго жооп берет?"},{"t":"v","l":["а) Ким? Эмне?","б) Кандай? Кайсы?","в) Канча? Канчанчы? Канчадай? Канчоо?","г) Кимдер? Эмнелер?"]},{"t":"p","h":"9З. Берилген сан атооч сөздөрдү маанилерине карай бөлүп жазгыла, Жыйырма беш, беш-алтыдан, онунчу, бештен үч, жүзгө жакын, жетөө, кыркынчы, экиден бир, миллион, отуздан, ондой, сегизден үч, жыйырма-отуздан, жүзгө жакын, экөө, биринчи, беш жүз алтымыш."},{"t":"v","l":["Ү лг ү: Эсептик сан:","Иреттик сан:","Жамдама сан:","жыйырма беш","онунчу","жетөө","Чамалама сан; жүзгө жакын","Топ сан:","Бөлчөк сан:","беш-алтыдан","бештен цч"]},{"t":"p","h":"94. Берилген сүйлөмдөрдөн жөнөкөй жана татаал сан атоочторду аныктагыла, 1. ХІХ кылымдын биринчи жарымында Россияда белгилүү сүрөтчү В. А. Тропинин жашаган. 2. Пингвиндердин узундугу <span class=\"pg\" data-n=\"61\">61<\/span>80 сантиметрге жетет, салмагы 25-40 килограмм болот. 3. Өзгөн шаарында бир чоң мунара жана үч күмбөз турат. 4. Орто топ оюну узуну 10 метр, туурасы 5 метр келген аянтчада ойнолот."},{"t":"raw","h":"<div class=\"gloss\"><p>44<\/p><\/div>"},{"t":"p","h":"5. 1610-жылы, 7-январда италиялык астроном Галилео Галилей дүрбү менен асманга байкоо жүргүзгөн."},{"t":"p","h":"95. Берилген маекти окугула, сан атоочтордун жазылышын түшүндүргүлө,"},{"t":"p","h":"Чынгыз: – Саламатсынбы, Бермет? Качан Ысык-Келге барасын?"},{"t":"p","h":"Б ер ме т: – Бүгүн кечки саат алтыда жолго чыгамын. Сен Ысык-Көлгө барасыңбы?"},{"t":"p","h":"Чынгыз: – Ооба, мен эртең саат ондо байкем менен бирге жөнөймүн. А силер кайсы эс алуу жайында болосуңар?"},{"t":"v","l":["Берме т: – «Ала-Тоо» эс алуу жайында болобуз.","Чынгыз: – Анын жайгашкан жери кайсы?"]},{"t":"p","h":"Бермет: – Ал Чолпон-Ата шаарынын көл тарабында, шаардан 1 километр алыстыкта жайгашкан."},{"t":"p","h":"Чынгыз: – Абдан жакшы, биз дагы ушул эс алуу жайына эртең саат 14°®де келип калабыз. Эмесе, көрүшкөнчө саксаламатта бол!"},{"t":"p","h":"Бермет: – Көрүшкөнчө, жакшы кал!"},{"t":"p","h":"96. Текстти окугула, сан жана сын атоочторду тапкыла, Аларды түзүлүшү боюнча ажыраткыла, даражаларын аныктагыла,"},{"t":"h3","h":"МУЗ ДООРУ"},{"t":"p","h":"Байыркы заманда, мындан бир нече миллион жыл мурда азыркы биз жашаган жерлерде калың чытырман токой өскөн. Бул токойлордо жүздөгөн жаныбарлар жашаган. Көл менен суулардын жээгинде миңдеген чоң-кичине канаттуулардын үнү жаңырып турган. Аба ырайы ошол кезде өтө жылуу жана дайыма бир калыпта болгон. Кийинчерээк суук улам катуулап, кар узакка жаай баштады. Түндүктө жааган кар калың муз катмарына айланды. Байыркы муздуктар түштүктү көздөй жыла берди. Муз тоолордон суук шамал согуп турду. Ошентип, мындан 10 миң жыл мурда Европада, Азиянын түндүгүндө, Түндүк Америкада муз доору башталды."},{"t":"p","h":"Мектеп окуучулары учин энциклопедиядан {3 1. Тексттеги жаңы сөздөрдү которуп, сөздүгүңөргө жазгыла, тексттеги сан, сын атоочтор катышкан сүйлөмдөргө суроо түзгүлө."},{"t":"p","h":"2. Тексттен кандай жаңы маалыматты билдиңер?"}],"sub":[{"title":"МУЗ ДООРУ","b":20}],"pages":[60,61]},{"title":"§ 27. Сөз өстүрүүчү текст менен иштөө — Работа над текстом для развития речи","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"62\">62<\/span>§ 27. Сөз өстүрүүчү текст менен иштөө — Работа над текстом для развития речи"},{"t":"p","h":"97. Берилген текстти окугула, мазмунун талдап, баяндама жазгыла."},{"t":"h3","h":"РУН ЖАЗУУСУ"},{"t":"p","h":"VII кылымда түрк элдеринде өздөрүнүн жазуу системасы пайда болгон. Аны рун жазуусу деп атоо кабыл алынган. Аталышы скандинавия жазуусуна окшоштурулуп берилген. Мында гіп деген сөз «жашырын сыр» дегенди билдирет. Рун – жыгачка же ташка оюп жазылган бурчтуу жазуу. Ал биринчи жолу Ш кылымда Данияда пайда болгон, андан кийин бүткүл Европага тараган."},{"t":"p","h":"1889-жылы орус окумуштуусу Н. Ядринцев Орхон өзөнүнөн жазуусу бар чоң эки таш тапканын маалымдайт. Ошондон соң рун жазуусу деген сөз менен кошо алар «Орхон-Енисей жазма эстеликтери» деп атала баштаган, Ошентип, мындай жазуу эстеликтери"},{"t":"h3","h":"ТУКА 1 +ИТ ВУ ГА"},{"t":"p","h":"Таластан, Ысык-Көлдөн, Баткенден, Алайдан да табылган. Ушундан улам кыргыздардын V кылымдан баштап Орхон-Енисей жазмасын колдонгондугун байкоого болот, Кыргыздар түрк элдеринин ичинен алгачкы жолу жазууну жараткан эл экендигин да айтууга болот."},{"t":"p","h":"Кытайдагы кыргыз окумуштуусу Анвар Байтур: «Кыргыздар жаңы эранын V кылымынын башында 40 тамгалуу жазууну пайдаланган» деп белгилеген."},{"t":"p","h":"Орхон-Енисей эстеликтеринен Кыргыз мамлекетин башкарган каган Барсбекке арналган байыркы кыргыз жазуусун С. Г. Кляшторный окуган."},{"t":"p","h":"1898-жылы Дания окумуштуусу В. Л. Томсен Орхон-Енисей жазмалардагы бардык тамгаларды аныктайт. Ага удаа орус түркологу В. В. Радлов да бул эстеликтерди окуп чыгып,15ке жакын арипти далилдейт. Ал бардык эстеликтерди окуп, которуп чыгат. Бул жазмаларды азыркы жазуучулар өз заманынын учурунда айтылган дастан, кошок, поэма катары жыйынтыкташкан. Ошентип, Орхон-Енисей жазма эстеликтери түрк элдеринин, анын ичинде кыргыздардын да адабий көркөм мурасы катары эсептелинет."},{"t":"p","h":"«Кыргызстан» энциклопедиясынан <span class=\"pg\" data-n=\"63\">63<\/span>Ө жашырынсыр-скрытая тайна"},{"t":"p","h":"Орхон-Енисей эстеликтери"},{"t":"p","h":"– орхонско-енисейские памятники арип – буква кошок – плач, причитание"},{"t":"p","h":"(оплакивание в стихах умершего) көркөм мурас – художественное наследие маалымдоо – оповещать, извещать, заявлять жазма – написанный, письменный, рукописный заман – время, эпоха дастан – героическое сказание, эпопея 1. Тексттен зат атоочторду таап, төмөнкү таблица менен иштегиле."},{"t":"raw","h":"<h4 class=\"mk\">Географиялык аталыштар Орхон-Енисей<\/h4>"},{"t":"p","h":"Мезгил"},{"t":"v","l":["аталыштары аталыштары","кылым"]},{"t":"p","h":"2. Сүйлөмдөрдү тексттин мазмунуна карата толуктап жазгыла, Зат, сын, сан атоочтордун алдын сызгыла, кайсы жөндөмөдө турганын, маанисине карай бөлүнүшүн аныктагыла. Адам жана географиялык аттардын жазылыш эрежелерине көңүл бургула, 1) Рун жазуусу биринчи жолу Ш кылымда Данияда пайда болгон,..."},{"t":"p","h":"2) 1889-жылы орус окумуштуусу Н. Ядринцев Орхон өзөнүнөн жазуусу бар..."},{"t":"p","h":"3) Ошондон соң, рун жазуусу деген сөз менен кошо алар..."},{"t":"p","h":"4) Ошентип, мындай жазуу эстеликтери ..."},{"t":"p","h":"5) Орхон-Енисей жазма эстеликтери кыргыздардын да ... Төмөндөгү тексттин планына таянып, баяндама жазгыла."},{"t":"p","h":"1) Рун жазуусунун тарыхы."},{"t":"p","h":"2) Окумуштуулар тарабынан Орхон-Енисей жазмаларынын изилдениши."},{"t":"p","h":"3) Орхон-Енисей эстеликтериндеги байыркы жазууларынын В кыргыздарга тиешелуу экендигинин далилдери."},{"t":"p","h":"4) Орхон-Енисей жазууларынын кыргыздын адабий керкем мурасы катары баа tQq86lGKaRk/uT9VRy0CLdI3mrQwMSlkwDwbdDRdJm/IrcT4HZs7z2tMrWyBz7Bf9u0fLCNdmHi1ecECrhUdJlKf5rojKG88lgLUcAwhi7VDpMHdE/ZsJ1vEyXl/rMG+POZAo7GckGSChmn5BI8j+SB0mwZ/3lBp+RhwAAAAA=","w":524,"ht":514},{"t":"p","h":"Саймалы-Таш – дүйнөдөгү эң чоң сүрөт галереясынын бири. Саймалы-Ташты Нарындын Көгарт дарыясынын башында, Кетмен- Төбө өрөөнүндө жана Чолпон-Ата шаарынын аймагында гана көрүүгө болот. Бул Саймалы-Ташты белгилүү археолог А. Н. Бернштам изилдеген. Миңдеген жылдар бою адамдар таштарга сүрөт тартуу менен өздөрү жөнүндө маалымат калтырышкан. Таштардын бетине өздөрүнүн иш-аракеттери жана да ошол жерлерде жашагандыгы тууралуу издерин калтырышкан. Бардыгы, болжолу жүз миңден ашык сүрөт Саймалы-Таш аскаларына тартылган. |Сүрөттөр өтө ар түрдүү, анткени алар ар кандай учурларда тартылган экен. Сүрөттөрдүн эң байыркылары б. з. чейин П миңинчи кылымда тартылган деп эсептелет."},{"t":"p","h":"Таштардын бетинде топоз чегилген арабалар жана соколор, ошондой эле өзгөчө кийимчен, канаттан жасалган баш кийим адам сөлөкөттөрү тартылган. Топоздордун тулкулары эки үч бурчтуктан түзүлгөндөй көрүнөт, ал эми мүйүздөрү алдынкы чыгыштын байыркы кооз карапасына абдан окшош шариктер менен бүтөт."},{"t":"p","h":"1) Төмөнкү сүйлөмдөрдү тексттин мазмунуна карата толуктагыла."},{"t":"p","h":"а) Байыркы адамдар таштарга сүрөт тартуу менен ..."},{"t":"p","h":"б) Алар өздөрүнүн иш-аракеттери жана да..."},{"t":"raw","h":"<div class=\"gloss\"><p>48<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"65\">65<\/span>шыктуу? 6. Сенин досуң спорттун кайсы түрү менен машыгат? 7. Ал музыкалык аспапта ойной алабы? 8. Бош убактыңарды досуң экөөң кандай өткөрөсүңөр? 9. Китепканага, театрга бирге барасыңарбы? 10. Кыргыз тилинде жакшы сүйлөй алабы? 11. Анын компьютердик сабаттуулугу кандай? 12. Досуң чет тилдерине да кызыгабы? 13. Ата-энесине кандай жардам берет? 14. Ал келечекте кайсы кесипке ээ болгусу келет? 15. Сен досуңду сыйлайсыңбы?"},{"t":"p","h":"л130. Көп чеӊиттин ордуна тиещелуу суроолуу сөздөрдү коюп жазгыла: канча? ким? эМне? кандай? кан4анчы? киМдер? каерде?"},{"t":"v","l":["1... Интернет аркылуу байланышат?","2. Җээренче чечен .. кылымда жашаган?","3. Конго Республикасы ... жайгашкан?"]},{"t":"p","h":"4. ... кыргыздын улуттук оюндары жөнүндө айтып берет?"},{"t":"p","h":"5. Ысык-Көлдүн эң терең жери ... метр?"},{"t":"v","l":["6. Кедр- ... дарак?","7. „. Күндү жылына бир айланып чыгат?"]},{"t":"p","h":"131. -бы, чы, беле, го бөлүкчөлөрү аркылуу түзүлгөн суроолуу сүйлөмдөрдү которгула жана түшүндүргүлө."},{"t":"v","l":["1. Сиздер бүгүн жолго чыгасыздарбы? —","2. Наргиза сени менен бирге келет беле? —","3. Китеп өзүңдүн колуңда го? —","4. Студент бул сыноодон өтпөй калсачы? —","Досуң менен маектеш (диалог түзүп келүү)."]}],"sub":[{"title":"САЙМАЛЫ-ТАШ АСКА БЕТИНДЕГИ ГАЛЕРЕЯСЫ","b":4}],"pages":[65,65]},{"title":"§ 39. Көнүгүүлөр – Упражнения","blocks":[{"t":"h3","h":"§ 39. Көнүгүүлөр – Упражнения"},{"t":"p","h":"132. Теменку текстти тыныш белгилерине карай керкем окугула да, суроолуу суйлемдерду далилдегиле."},{"t":"p","h":"– Кана, эми эмне кылабыз? – деди Орган ал ортодо берки чондорго кайрылып, – Сузебузбу?"},{"t":"p","h":"Бир топко тунжурап отурушту. Ар кимиси айлана-тегерегин каранат."},{"t":"p","h":"– Сүзгөндө кайда барабыз? – деп Эмрайин оор күрсүндү."},{"t":"p","h":"– Кайда барабыз дегениң эмне? – деди Мылгун капыстан."},{"t":"p","h":"– Сүзө беребиз, тынч отуруп өлгөнчө сүзүп жүрүп өлгөнүбүз жакшы!"},{"t":"v","l":["– Сүзгөндө эмне, сүзбөгөндө эмне? – деди Эмрайин.","– Бу туманда дайынсыз сүзө бергенден не кажет."]},{"t":"p","h":"<span class=\"pg\" data-n=\"66\">66<\/span>– Тумандан коркобузбу? – деп Мылгун ого бетер опурулду.— Сүзө беребиз дейм!"},{"t":"p","h":"– Түшүндүңбү, Эмрайин чоң сакал, сүзө беребиз дейм! Түшүндүңбү?"},{"t":"p","h":"Кирискинин үрөйү учту."},{"t":"p","h":"Ч. Айтматов, «Деңиз бойлой жорткон Ала:Дөбөт» 133. Берилген сөздөрдү пайдаланып, суроолорго жооп бергиле."},{"t":"p","h":"1. Эмненин көпчүлүк бөлүгү азот менен кычкылтектен турат?"},{"t":"p","h":"2. Шамал эмнени тазартып турат?"},{"t":"p","h":"3. Эмне бизди курчап турган бардык нерселерди кысып турат?"},{"t":"p","h":"4. Биздин жер планетабыз кандай аба катмары менен курчалган?"},{"t":"p","h":"5. Кандай илим аба ырайын изилдейт?"},{"t":"p","h":"Пайдаланылуучу сөздөр: аба, жаман абаны, метеорология, тунук, абанын."},{"t":"p","h":"134, Диалогду интонация менен окугула жана суроолуу сүйлөмдөргө көңүлүңөрдү бургула. Ушул үлгүдө силер да маектешкиле."},{"t":"h3","h":"ТААНЫШУУ"},{"t":"v","l":["– Саламатсызбы, бийкеч?","– Саламатчылык!","– Сиз менен таанышууга мүмкүнбү?","","– Албетте, каршы эмесмин.","– Атыңыз ким?","– Гүлнар.","– Меники – Таалай.","– Абдан жакшы.","– Здравствуйте, девушка?","– Здравствуйте!"]},{"t":"p","h":"– Позвольте с Вами по-"},{"t":"v","l":["знакомиться?","– Конечно, я не возражаю.","– Как Вас зовут?","– Гульнар.","– А меня – Таалай.","– Очень приятно,","","135. Теменку жай суйлемдерге суроо бергиле,"]},{"t":"p","h":"Колибри – дүйнөдөгү эн кичинекей жана кооз чымчык. Анын салмагы бир жарым, эки грамм болот. Колибринин эң чоңу чабалекейдей бар. Аларды алп колибри деп аташат. Бул чымчыктардын өңү-түсү жарыктын тийишине жараша кубулуп көрүнөт. Колибри Борбордук жана Түштүк Америкада жашайт. Эл аралык уюмдар аны сактайт жана коргойт."},{"t":"p","h":"186. Суроолорго жооп берүү менен чакан текст түзгүлө."},{"t":"p","h":"Сен мектепти аяктагандан кийин кайсы окуу жайына тапшырасың?"},{"t":"raw","h":"<div class=\"gloss\"><p>66<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"67\">67<\/span>Кандай кесип ээси болгуң келет? Ата-энең кайсы кесипте эмгектенишет?"},{"t":"p","h":"Алардын жолун улантууну каалайсыңбы?"},{"t":"p","h":"Келечекте өзүңдүн Ата Мекениңе кандай салым кошкуң келет? Ал эми сенин досуңа кандай кесип жагат?"},{"t":"v","l":["Досуң бизнесмен боло алабы?","","«Мага жаккан кесип» – деген текст түзүп келүү."]}],"sub":[{"title":"ТААНЫШУУ","b":19}],"pages":[66,67]},{"title":"§ 40. Буйрук сүйлөм, анын интонациясы — Побудительное предложение и его интонация","blocks":[{"t":"h3","h":"§ 40. Буйрук сүйлөм, анын интонациясы — Побудительное предложение и его интонация"},{"t":"p","h":"137. Төмөнкү буйрук иретиндеги макалдарды чечмелегиле."},{"t":"p","h":"1. Улук болсоң, кичик бол."},{"t":"p","h":"2. Угар жерде сөз айт, сиңер жерге суу төк."},{"t":"p","h":"3. Өзүңдү эр ойлосоң, өзгөнү шер ойло,"},{"t":"p","h":"4. Абийирди жашындан сакта,"},{"t":"p","h":"5. Эр болсоң көк бол, айткан сөзгө бек бол."},{"t":"p","h":"– Если ты начальник, будь скромным."},{"t":"p","h":"– Говори там, где слушают, воду лей там, где впитывается."},{"t":"p","h":"– Если себя ты считаешь храбрецом, то другого считай львом."},{"t":"p","h":"– Береги честь смолоду."},{"t":"p","h":"– Если ты молодец, будь настойчив, в слове будь твёрд."},{"t":"p","h":"– Даражасы бийик адамга кандай кеңеш айтсак болот?"},{"t":"p","h":"– Сөз кимге айтылып, суу кайда төгүлөт?"},{"t":"v","l":["– Өзүн эр көрсө, өзгөнү кандай көрүш керек?","– Жашыңдан эмнени сакташың керек?","– Эр азамат кандай болуш керек экен?"]},{"t":"p","h":"138. Буйрук иретинде айтылган төмөнкү үлгүлөрдү эсиңерге туткула."},{"t":"raw","h":"<h4 class=\"mk\">– Азамат, китеп оку! – Салтанат, кат жаз! – Айдай, сут ич! – Кызым, алма ал! – Саламатта болуңуз! – Кош болуңуз!<\/h4>"},{"t":"v","l":["– Азамат, читай книгу!","– Салтанат, (на) пиши письмо!","– Айдай, пей молоко!","– Доченька, бери (возьми) яблоко!","– Будь здоровы!","– До свидания!"]},{"t":"p","h":"<span class=\"pg\" data-n=\"68\">68<\/span>139. Диалогду ролго бөлүп окугула. Буйрук сүйлөм менен жай сүйлөмдүн байланышына көңүл бургула."},{"t":"h3","h":"МЕДИЦИНАЛЫК ТЕЗ ЖАРДАМ"},{"t":"v","l":["– Мен ооруп калдым, дарыгерди чакырыңызчы.","– Ооба, мына тез жардам келип калды.","– Саламатсызбы, эмнеңиз ооруп жатат?","– Башым.","– Этиниз ысып турат. Суук тийиптир.","– Чыйрыгып да жатамын.","– Качантан бери ооруп жатасыз?","– Кечээ кечтен бери.","– Кана, оозуңузду ачыңыз. Тилиңизди көрсөтүңүз.","– Дарыланууга рецепт жазып бересизби?"]},{"t":"p","h":"– Албетте, мына бул рецепт менен дарыларды алып ичиңиз."},{"t":"p","h":"– Чоң ырахмат, Сизге абдан ыраазымын!"},{"t":"p","h":"[`1 Төмөнкү жай сүйлөмдөрдү буйрук сүйлөмдөргө айландыргыла."},{"t":"p","h":"1. Улуу кишилерге жол беребиз."},{"t":"p","h":"2. Толубайдай сынчы болобуз, Токтогулдай ырчы болобуз."},{"t":"p","h":"3. Кыргыз тилинде сабаттуу сүйлөйбүз."},{"t":"v","l":["4. Бүгүн бүтчү ишти эртеңкиге калтырбайбыз.","5. Алтын албайбыз, алкыш гана алабыз.","6. Сабакка кечикпей барабыз."]},{"t":"p","h":"Ү лгү: Улуу кишилерге жол беребиз. – Улуу кишилерге жол бергиле!"}],"sub":[{"title":"МЕДИЦИНАЛЫК ТЕЗ ЖАРДАМ","b":23}],"pages":[68,68]},{"title":"§ 41. Буйрук сүйлөмдүн жай сүйлөм менен байланышы —","blocks":[{"t":"h3","h":"§ 41. Буйрук сүйлөмдүн жай сүйлөм менен байланышы —"},{"t":"p","h":"Связь побудительного предложения"},{"t":"h3","h":"с повествовательным"},{"t":"v","l":["140. Ырды көркөм окугула жана жаттагыла.","","Эдил бол да, жайык бол,","Эч ким менен урушпа.","Мүнөзү жаман адамга,","Анан кайра кайрылба.","Жакшы көргөн кишиңден,","Жалган айтып айрылба.","Аргымакка миндим деп,","Арткы топтон адашпа.","Күнүндө өзүм болдум деп,","Менменсинип адашпа.","Артык үчүн айтышып,","Досторуң менен санашпа.","Асан Кайгынын санат-насыятынан"]},{"t":"p","h":"<span class=\"pg\" data-n=\"69\">69<\/span>141. Диалогду окуп, кыргызчага которгула жана аны мазмунуна жараша уланткыла. Сүйлөмдөрдү айтылыш максатына карай атап бергиле."},{"t":"h3","h":"В АПТЕКЕ"},{"t":"p","h":"– Дайте мне, пожалуйста, лекарство по этому рецепту."},{"t":"p","h":"– Это лекарство принимайте перед едой по одной таблетке."},{"t":"p","h":"– Это лекарство (мазь, микстуру, стрептомицин...) можно взять без рецепта?"},{"t":"p","h":"– Да, можно."},{"t":"p","h":"142. Теменку жай суйлемдерду буйрук суйлемдерге айландыргыла."},{"t":"p","h":"1. Жаштар айлуу түндө ак чөлмөк ойношот. 2. Ч. Айтматовдун чыгармаларын окуш керек. 3. Табигат менен таттуу мамиледе болобуз. 4. Мекенибиз – Кыргызстанды коргойбуз. 5. Акыйкат, чынчыл болуш керек. 6. Гимнастика менен ден соолугубузду чыңдайбыз."},{"t":"p","h":"Ү лгү: Жаштар айлуу түндө ак чөлмөк ойношот, – Жаштар, айлуу түндө ак чөлмөк ойногула!"},{"t":"p","h":"143. Төмөнкү текстти окугула, буйрук сүйлөмдүн эрежесин айтып, сүйлөмдөрдү түшүндүргүлө."},{"t":"h3","h":"СЕНИН МИЛДЕТИҢ"},{"t":"p","h":"Күн сайын эрте тур. Сабакка кечикпей, өз убагында келгин. Аракеттенип жакшы оку. Кыргыз тилин жакшы өздөштүрүүгө аракеттен. Кыргызча текст окуп, мазмунун кайра айтып бер. Сөз жаттап, алар менен сүйлөм түз. Ар дайым эрежелерди кайталап тур. Досуң менен кыргызча маектеш. Берилген үй тапшырмаларды учурунда туура аткар. Жакшы окуп, терең билим алууга умтул."},{"t":"p","h":"144. Берилген сөздөрдөн буйрук сүйлөм түзгүлө, Сабак, жөнө; Мектеп, кел; Дептер, жаз; Эшик, чыкпа; Көл, түш; Кооз, гүл, үз; Кызыктуу китеп, оку; Жомок, айтуу; Кыргызча, сүйлөө; Билим алуу;"},{"t":"v","l":["ч","`1 145, Диалогду окугула да, кыргызча сүйлөшкүлө."]},{"t":"h3","h":"ТЕЛЕФОНДО"},{"t":"v","l":["– Саламатсызбы?!","– Жакшы! Саламат!","Здравствуйте!","Здравствуйте!","<span class=\"pg\" data-n=\"70\">70<\/span>– Ден соолугуңуз кандай?","– Ден соолугум жакшы.","– Иштериңиз кандай?","– Жаман эмес.","– Ата-энеңиз кандай?","– Бардыгы аман-эсен.","– Кош болуңуз!","– Жакшы калыныз!","Как ваше здоровье?","Мое здоровье хорошее.","Как ваши дела? ","Неплохо.","Как ваши родители?","Все здоровы.","До свидания!","Счастливо вам оставаться!"]}],"sub":[{"title":"В АПТЕКЕ","b":5},{"title":"СЕНИН МИЛДЕТИҢ","b":14},{"title":"ТЕЛЕФОНДО","b":18}],"pages":[69,70]},{"title":"§ 42. Көнүгүү, машыгуу иштери — Упражнения для приобретения навыков","blocks":[{"t":"h3","h":"§ 42. Көнүгүү, машыгуу иштери — Упражнения для приобретения навыков"},{"t":"p","h":"146. Драмалык чыгармадан үзүндүнү окугула, буйрук иретинде айтылган суйлемдерду далилдегиле."},{"t":"p","h":"Жеңишбек чуркап кирет да, жашынып калат."},{"t":"p","h":"Сапай менен Борбук анын артынан киришет. Жеңишбекти издешет."},{"t":"p","h":"Б ор бу к: – Сапай!.. Сапай! Быякта экен, кармадым. Бери кел... Келе шапкемди!"},{"t":"p","h":"С ап ай: – Ай, барбаганың аз келгенсип, шапкесин эмне ала качасың, ыя? Бер азыр!"},{"t":"p","h":"Борбук: – Келе дейм шапкемди!"},{"t":"p","h":"Жеңишбек: – Ме!.. Кеткиле!.. Кеткиле дейм короомдон!.. Болбосо, бирди көрүп каласыңар!"},{"t":"p","h":"Б орбу к: – Эр болсоң тийип көрчү!"},{"t":"p","h":"Жеңишбек: – Коркот дейсиңби? Коркот дейсиңби?! Мына!.. (Борбук экөө кармаша кетет)."},{"t":"p","h":"С а п а й: – Борбук... Борбук... (Борбук жыгылып калат). Борбу к (жардамга чакырып). – Сапай!.. Сапай!.."},{"t":"p","h":"Жеңиш бе к: (Сапайга) – Жакындаба!.. Тур дейм ары! С апай: – Айт азыр ачыгыңды, барасыңбы?!"},{"t":"v","l":["Борбук: – Барасыңбы, жокпу?","Ж е ң и ш бе к: – Барбай эле койдум!"]},{"t":"p","h":"Б. Жакиев, «Атанын тагдыры»"},{"t":"p","h":"147. Берилген сөз айкаштарынан буйрук сүйлөмдөрүн түзгүлө."},{"t":"p","h":"1. Улуттук баш кийимдерин баалоо. 2. Сүрөттөр боюнча аңгемелешүү. 3. Ата-энени сыйлоо. 4. Накыл кептердин маанисин түшүнүү. 5. Оюңарды баяндап берүү. 6. Эмгекчилдикке тарбиялоо. 7. Жагымдуу жагдай түзүү. 8. Ата Мекениңе кызмат кылуу."},{"t":"p","h":"9. Экиден маектешүү. 10. Ата салтын улантуу."},{"t":"raw","h":"<div class=\"gloss\"><p>то<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"71\">71<\/span>У лгу: Улуттук баш кийимдерин баалоо – Улуттук баш кийимдерин баалагыла!"},{"t":"p","h":"148. Теменку буйрук суйлемдерду кечургуле."},{"t":"p","h":"1. Текстти окугула жана анын маанисин тушунгуле. 2. Учкул сездерду жаттагыла. 3. Себепсиз сабактан калбагыла. 4. Грамматикалык эрежени жаттагыла. 5. Ден соолугунарды спорт менен чыңдагыла. 6. Берилген сүрөт боюнча аңгемелешкиле. 7. Сезимтал, боорукер болгула. 8. Ата-эненин тилин алып, элпек болгула. 149. Төмөнкү жай сүйлөмдөрдөн буйрук сүйлөмдөрдү түзгүлө, 1. Улууларды ар дайым сыйлайбыз. 2. Ата наркын өчүрбөйбүз. 3.Асыл-ой, насааттарды баалайбыз. 4. Адептүү, өнөрлүү, билимдүү болобуз. 5. Көркөм адабий чыгармаларды көп окуйбуз."},{"t":"p","h":"6. Көрүнүктүү инсандардан үлгү алабыз. 7. Ата-эненин эмгегин актайбыз."},{"t":"p","h":"У л г ү: Улууларды ар дайым сыйлайбыз. – Улууларды ар дайым сыйлагыла."},{"t":"p","h":"150. Берилген илептүү сүйлөмдөрдөн буйрук сүйлөмдөрдү түзгүлө."},{"t":"p","h":"1. Ата-энелерге урмат жана сый! 2. Уул-кыздар ыймандуу болсун! 3. Ысык-Көлдү коргойбуз! 4. Тынчтыкты бекем сактайбыз! 5. Ыйык Ала-Тоону даңктайбыз!"},{"t":"p","h":"Ү лгү: Ата-энелерге урмат жана сый! – Ата-энелерди ур: маттагыла жана сыйлагыла."},{"t":"p","h":"Буйрук сүйлөмдөрдү катыштырып диалог түзүп келгиле."}],"sub":[],"pages":[71,71]},{"title":"§ 43. Илептүү сүйлөм, анын интонациясы —","blocks":[{"t":"h3","h":"§ 43. Илептүү сүйлөм, анын интонациясы —"},{"t":"p","h":"Восклицательное предложение и его интонация В восклицательных предлокандайдыр бир окуялар, көрүнүштөр, түшүнүктөр жөнүндө адамдын күчтүү сезиминен, эмоциясынан чыккан кабарды билдирүү максатында айтылат."},{"t":"p","h":"Айтылыш максатына карай ар бир жөнөкөй сүйлөм; жай илептүү, суроолуу илептүү, буйрук илептүү боло алат."},{"t":"p","h":"жениях сообщается о каком-либо событии, явлении, понятии, которые по цели высказывания выражают сильное чувство, эмоции человека."},{"t":"p","h":"По цели высказывания восклицательным может быть каждое простое предложение: повествовательные восклица- <span class=\"pg\" data-n=\"72\">72<\/span>Мындай учурда алар өзгөчө интонация, күчтүү сезим менен айтылат. Сүйлөмдүн аягына илеп белгиси (!) коюлат."},{"t":"p","h":"тельные, побудительные восклицательные. Произносятся они при этом с особой интонацией восклицания: в конце предложения ставится восклицательный знак (!)."},{"t":"p","h":"Мисалы: Жашасын, бактылуу балалык! Саламатсызбы, эжеке?! Айчүрөк, жакшы оку!"},{"t":"p","h":"151. Берилген сүйлөмдөрдү көчүрүп жазгыла, Сүйлөмдөрдүн айтылыш интонациясына көңүлүңөрдү бургула."},{"t":"p","h":"1. Туулган күнүң менен! 2. Дүйнөдө тынчтык болсун! 3. Нооруз майрамыңыз менен! 4. Жаңы жыл ырыс-ынтымак алып келсин!"},{"t":"p","h":"5. Ишиңиз ийгиликтүү болсун! 6. Ата-энелерге урмат жана сый!"},{"t":"p","h":"1. Жашасын элдердин бекем достугу! 8. Ар дайым күн болсун!"},{"t":"p","h":"9. Ден соолугуңуз чың болсун!"},{"t":"p","h":"152. Тыныш белгилерине карай берилген төмөнкү текстти көркөм окугула, Илептүү сүйлөмдөрдү аныктагыла."},{"t":"h3","h":"БААРЫНАН ЭМНЕ СУЛУУ?"},{"t":"p","h":"Ойлончу, дүйнөдө баарынан эмне сулуу? Менимче, баарынан кең дүйнөгө нурун тегиз чачкан күн сулуу! Анан да, күн нуруна нурданган гүл сулуу! Жузу гүлгө окшоп жадыраган бактылуу бөбөк сулуу! Анан да, жаш бөбөктү эмизип отурган бактылуу эне сулуу!"},{"t":"v","l":["® кун нуру – солнечные лучи","кең дүйнө – широкий мир","нурданган – лучезарный","жадыраган – жизнерадостный","бактылуу бөбөк – счастливый ребёнок"]},{"t":"p","h":"1538. Насаат сөздөрдү көркөм окуп, которгула жана жатка билгиле."},{"t":"p","h":"Билим алсаң урмат-сый алып келет,"},{"t":"v","l":["Билим сага – акыл-ой, кубат берет!","Билим деңиз – түбү да, чеги да жок,","Канча сузсаң азайбайт, толо берет!","Канча билсең, ошончо үйрөн, оку,","Билимдүү тилегине дайым жетет.","","Билимине мактанган билимсиздер,","Билгеним аз дегендер – көпкө жетет!"]},{"t":"p","h":"<span class=\"pg\" data-n=\"73\">73<\/span>Билимдүү түйшүктөнүп ойлоп жүрөт, Билимсиз – ой жүгүртпөй ойноп-күлөт, Ж. Баласагын, «Кут билим® ® урмат-сый – уважение, почет"},{"t":"v","l":["кубат – сила, мощь, энергия","кыл-ой – разум, ум","түйшүктөнүп ойлоп жүрөт – занят своими мыслями"]},{"t":"p","h":"билимдуу тилегине дайым жетет – образованный всегда достигает своей цели"},{"t":"v","l":["? Билим адамга эмне берет?","Билимдин чеги барбы, ал азаябы?","Билимдуу ойлогон максатына жете алабы?","Билимсиз адам кандай болот?","24 Жогорку насаат сөздөрдү жаттап келүү."]},{"t":"h3","h":"§ 44. Көнүгүү, машыгуу иштери — Упражнения для приобретения навыков"},{"t":"p","h":"154. Текстти окугула."},{"t":"h3","h":"КОМПЬЮТЕР"},{"t":"img","src":"data:image/webp;base64,UklGRjghAABXRUJQVlA4

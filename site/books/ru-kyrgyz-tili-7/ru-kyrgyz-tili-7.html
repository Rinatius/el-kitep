ыка, обондуу ырларды укса да болот. Мындай сабаттуулук менен дүйнөлүк билим мейкиндигине аралашабыз. ® эл аралык «Интернет» компьютердик маалымат системасы – международная компьютерная информационная система Интернет компьютердик сабаттуулук – компьютерная грамотность дүйнөлүк билим мейкиндиги – мировое научное пространство"},{"t":"p","h":"› 1. Компьютерлер кайда кеңири колдонулууда?"},{"t":"p","h":"2. Мектеп окуучулары менен студенттер билимдерин кантип тереңдетишет?"},{"t":"p","h":"З. Басма ишинде компьютер кандай пайдаланылат?"},{"t":"p","h":"4. Дүйнө элдери бири-бири менен кантип байланышат? 155. Берилген сөздөрдөн илептүү сүйлөмдөрдү түзгүлө."},{"t":"p","h":"1) билгиле, пайдалана, компьютерди;"},{"t":"p","h":"2) кандай сонун, интернет, саякатка, аркылуу, чыгуу; З) кылым, компьютердик, жашасын;"},{"t":"p","h":"4) байланышууну, үйрөнгүлө, аркылуу, интернет;"},{"t":"p","h":"5) жетишкендигине, сыймыктанабыз, илим менен техниканын, бүгүнкү;"},{"t":"p","h":"156. Текстти окугула, силер да компьютерге кызыгасыңарбы, өз оюңарды билдиргиле,"},{"t":"h3","h":"МЕН ПРОГРАММИСТ БОЛГУМ КЕЛЕТ"},{"t":"p","h":"Мен компьютерге абдан кызыгамын. Бул мен үчүн өзүнчө бир жаңы дүйнө! Компьютер адамга караганда миллион эсе тез эсептөө жүргүзө ала турган электрондук түзүлүш. Ал киргизилген маалыматтарды кабыл алып, аны пайдалануу үчүн түшүнүктүү кылып кайрадан иштеп чыгат. Менин эң жакшы көргөн сабактарым – математика, физика жана информатика. Үйүмдө компьютерим бар. Мен компьютерде көп иштеймин. Анда дилбаян жазуу ыңгайлуу, анткени оюң өзгөргөн сайын текстти оңдой берүү жеңил. Ошондой эле үй тапшырмаларды, конспект жана рефераттарды да компьютерде аткарамын. Интернет аркылуу саякатка чыгамын. Мени кызыктырган ар кандай маалыматтарды аламын. Керектүү тарыхый фактыларды тактаймын. Каалаган музыка, обондуу ырларды да угамын."},{"t":"p","h":"<span class=\"pg\" data-n=\"75\">75<\/span>Бүгүнкү күндө биз информациялык жаңылануу доордо жашап жатабыз. Ошондуктан билим алууда программисттик кесиптин көп мүмкүнчүлүктөрү бар деп ойлоймун. Мектепти аяктагандан кийин жогорку окуу жайына тапшырып, компьютердик сабаттуулугумду тереңдетемин."},{"t":"p","h":"1. Тексттеги негизги ойлорго таянып, айрым түшүнүктөр жөнүндө күчтүү сезим менен айтылган сүйлөмдөрдү түзгүлө."},{"t":"p","h":"2. Тексттин мазмунун кайра айтып бергиле,"}],"sub":[{"title":"БААРЫНАН ЭМНЕ СУЛУУ?","b":13},{"title":"§ 44. Көнүгүү, машыгуу иштери — Упражнения для приобретения навыков","b":23},{"title":"КОМПЬЮТЕР","b":25},{"title":"МЕН ПРОГРАММИСТ БОЛГУМ КЕЛЕТ","b":40}],"pages":[72,75]},{"title":"§ 45. Текст менен иштөө – Работа с текстом","blocks":[{"t":"h3","h":"§ 45. Текст менен иштөө – Работа с текстом"},{"t":"p","h":"157. Текстти көчүрүп жазып, сүйлөмдөрдүн аягына тиешелүү тыныш белгилерин койгула."},{"t":"h3","h":"ЭРТЕ КЕЛГЕН ТУРНАЛАР"},{"t":"p","h":"Чабдар ордунда калыптыр... Султанмурат үйдөн жүгүрүп чыгып, Чабдарга ыргып минди да, балдарга кыйкырды:"},{"t":"p","h":"– Анатай, айылга чап... Кармалбай тез жет... Элди чакыр... Мен ууруларды кууп жетип, алаксыта кармап турам... Тезирээк жете көр... Эркинбек, сен ушуерде бол, эч жакка кетпе... Уктуңбу... Анатай, айылга чап... Мен кеттим... жана дүбүрт кеткен тарапка Чабдардын оозун коё берди..."},{"t":"p","h":"– Алга, Чабдарым, алга, жан бирге жаныбарым... Кууп жет ууруларды... Мен жыгылбайм, мен өлбөйм, менден коркпо, өзүңө кубат берсин... – Чурка, жаныбарым... Ылдамыраак, ылдамыраак, Чабдар... Ушунча алыстап кетиштиби... Каерге жетишти экен... Алгала, Чабдарым, алгала... Эки көзүң экөөбүзгө шам болсун, жаныбарым..."},{"t":"p","h":"Ч, Айтматов з 1) Эмне үчүн Султанмурат Чабдарга ыргып минди?"},{"t":"v","l":[" 2) Ал балдарга кандай буйрук берди?","3) Султанмурат Чабдарын кантип сүрөдү?"]},{"t":"p","h":"1, Тексттен жай, суроолуу, илептүү жана буйрук сүйлөмдөрдү таап, алардын эрежесин айтып далилдегиле."},{"t":"p","h":"2. Султанмураттын эрдиги жөнүндө ар бириңер экиден маек түзүп келгиле."},{"t":"p","h":"Т5"}],"sub":[{"title":"ЭРТЕ КЕЛГЕН ТУРНАЛАР","b":2}],"pages":[75,75]},{"title":"§ 46. Сүйлөмдүн түрлөрү боюнча алган билимдерин жөнгө Систематизация знаний по видам предложений","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"76\">76<\/span>§ 46. Сүйлөмдүн түрлөрү боюнча алган билимдерин жөнгө Систематизация знаний по видам предложений"},{"t":"p","h":"158. Берилген ырды көркөм окугула жана жаттагыла."},{"t":"h3","h":"ЭНЕСАЙ"},{"t":"v","l":["Энесай, сендей жайкын өзөн барбы?","Энесай, сендей жаркын мекен барбы?","Энесай, сендей кыйын азап барбы?","Энесай, сендей ыйык азат барбы?","","Энесай, сендей жайкын өзөн болбос!","Энесай, сендей жаркын мекен болбос!","Энесай, сендей кыйын азап болбос!","Энесай, сендей ыйык азат болбос!","Ч. Айтматов","® жайкын – спокойно, тихо, мирно","өзөн – горная долина с речкой","жаркын – светлый, лучезарный","азат – свобода","азап – мука, мучение"]},{"t":"p","h":"ыйык – священный, приносящий счастье"},{"t":"p","h":"159, Төмөнкү сөз айкаштарын катыштырып, илептүү, буйрук сүйлөмдөрдү түзгүлө. Эрежеси менен аларды далилдегиле."},{"t":"p","h":"Тартиптүү болуу. Жакшы окуу. Кыргыз тилин үйрөнүү. Улууларды урматтоо. Компьютер үйрөнүү. Келечекке ишенүү. Мекенди коргоо."},{"t":"p","h":"160. Сүйлөмдөрдү кыргызчага которгула. Алар кандай сүйлөмдөр экендигин түшүндүргүлө."},{"t":"p","h":"1. Ребята, не опоздывайте на уроки. 2. Уважаемые учителя, после уроков зайдите в компьютерный кабинет. 3. Фермеры, хорошо подготовьтесь к весне. 4. С днём учителя! 5. С новым годом!"},{"t":"p","h":"6. Как прекрасно на Иссык-Куле! 7. Да здравствует мир!"},{"t":"p","h":"161. Көп чекиттин ордуна тиешелүү сөздөрдү коюп, сүйлөмдөрдү көчүрүп жазгыла."},{"t":"p","h":"1. „. илгери болсун! 2. Силердин бизге жиберген ... ыракмат!"},{"t":"p","h":"3. Биз ... тынчтык үчүн күрөшөбүз! 4. Кыргызстанда ... орносун!"},{"t":"p","h":"5.Ар дайым ... болсун! 6. Өркүндөп өссүн ...!"},{"t":"p","h":"Пайдаланылуучу сөздөр: тынчтык, кин, куттуктооңорго, Мекеним, иш, бейкут жашоо, <span class=\"pg\" data-n=\"77\">77<\/span>162. Суйлемдердун тыныш белгилерине карай текстти керкем окугула. Бул текст кайсы чыгармадан алынган жана анын автору ким экендигин тапкыла."},{"t":"p","h":"Турналар бийик учуп баратышат. Бирок асман андан бийик. Султанмурат чалкалап карап туруп кыйкырды."},{"t":"v","l":["– Жаша-аа! Турналар!","Түшкө кирбес укмуш көргөнсүп, үчөө тең кыйкырды:","– Турналар! Турналар! Турналар!"]},{"t":"p","h":"Турналардын эрте келгени жаз менен жайга жакшы жышаан деген карыялардын сөзүн эстеди Султанмурат."},{"t":"p","h":"– Эрте келген турналар жакшы жышаан! – деп кыйкырды ал Анатайга. – Түшүм болот! Түшүм мол болот."},{"t":"v","l":["– Эмне, эмне? – деп Анатай жакшы укпай жатты.","– Тушу-ум! Түшүм мол болот!","Анатай артына толгонуп, Эркинбекке кыйкырды:"]},{"t":"p","h":"– Түшүм мол болот! Түшүм! Эркинбек жооп кайтарды:"},{"t":"p","h":"– Уктум, укту-ум! Түшүм мол болот!"},{"t":"p","h":"ай Жогорку тексттеги сүйлөмдүн түрлөрүн таап, аларды эрежелерге таянып далилдегиле."}],"sub":[{"title":"ЭНЕСАЙ","b":2}],"pages":[76,77]},{"title":"§ 47. Чейрек боюнча кайталоо —","blocks":[{"t":"h3","h":"§ 47. Чейрек боюнча кайталоо —"},{"t":"p","h":"Повторение пройденного за четверть &gt; Эске тушургуле: – Вспомните:"},{"t":"p","h":"1. Жай суйлем деген эмне?"},{"t":"p","h":"2. Суроолуу суйлем деген эмне?"},{"t":"p","h":"3. Илептуу суйлем деген эмне?"},{"t":"p","h":"4. Буйрук суйлем деген эмне?"},{"t":"p","h":"– Что такое повествовательное предложение?"},{"t":"p","h":"– Что такое вопросительное предложение?"},{"t":"p","h":"– Что такое восклицательное предложение?"},{"t":"p","h":"– Что такое побудительное предложение?"},{"t":"p","h":"163. Текстти анын интонациясына, тыныш белгисине карай окугула."},{"t":"h3","h":"БИЗГЕ ТЫНЧТЫК КЕРЕК"},{"t":"p","h":"Тынчтык адам баласына бейкут жашоону тартуулайт. Тынчтык болсо кек асман ачык болот. Кун жаркырап тийип турат, Кызыл-тазыл гулдер гүлдөйт. Туркун куштар сайрайт. Балдар, кыздардын кенулдеру куунак. Алар мектепке барышат. Жакшы билим алууга умтулушат. Кичинекей бөбөктөр бала-бакчага бары- ТТ <span class=\"pg\" data-n=\"78\">78<\/span>шат. Алар ойношот, сүрөт тартышат жана ырдашат. Ата-энелер да талыкпай эмгектенишет. Жаштар өндүрүштө, илим-билим жана маданий чөйрөлөрдө кыймылдаткыч күч болушат. Бош убактыларында ден соолугуна кам көрүшөт. Саякатка чыгышат, алыскы өлкөлөргө барышат. Эс алуу жайларында болушат."},{"t":"p","h":"Дүйнө жүзүндөгү бардык адамдарга тынчтык керек. Адамзат бүткүл дүйнөдө тынчтыкты сактоо үчүн күрөшөт. Ар дайым Күн болсун! Жер үстүндө бактылуу балалык өкүм сүрсүн!"},{"t":"p","h":"тынчтык – мир"},{"t":"v","l":["бейкут жашоо – жить спокойно","кек асман – голубое небо","кенулдеру куунак – хорошее","настроение","билим алууга умтулушат —"]},{"t":"p","h":"талыкпай эмгектенишет – трудиться неустанно адамзат – человечество илим-билим, маданий чөйрөлөрдө – в области науки, знания и культуры бош убактыларында – в свободное время ден соолукка кам көрүү – заботиться о здоровье саякатка чыгышат – путешествие буткул дуйнеде тынчтыкты сактоо – сохранить мир во всем мире кыймылдаткыч куч – движущая сила"},{"t":"p","h":"164. Жогорку сөздөрдү катыштырып, сүйлөмдөрдү толуктагыла жана алардын маанисин сүйлөмдөрдүн контекстинде аныктагыла."},{"t":"p","h":"1. Адамзатка ... керек. 2. Адамдар ... ... каалашат."},{"t":"p","h":"3.Жаштар илим-билим жана маданий чөйрөлөрдө ... ... болушат. 4. Бейкутчулукта биз ..... кам көрөбүз. 5. ... окуучулар мектепке барышат. 6. Алар ... ... эс алышат. 7. Бардыгыбыз бүткүл дүйнөдө учун күрөшөбүз. 8. Ар кандай кесиптеги адамдар ...... 9...... жана .„... жаштар алдыга умтулушат."},{"t":"p","h":"10. Бейкут жашоодо адамдар көрүнүктүү жерлерге ......, 11. Бактылуу балалык үчүн камкордук көрүүдө."},{"t":"p","h":"165. Тексттин мазмуну боюнча түзүлгөн суроолорго жооп бергиле жана сүйлөмдүн түрлөрүнө карай аныктагыла."},{"t":"v","l":["1. Тынчтыкта жашоо кандай болот?","2. Балдар жана кичине бөбөктөр кайда барышат?","3. Алар эмнеге умтулушат?","4. Ата-энелер кандай эмгектенишет?"]},{"t":"p","h":"5. Бардык жерлерде жаштар кандай күч болушат? Эмне үчүн?"},{"t":"p","h":"6. Адамдар эмне үчүн күрөшөт?"},{"t":"p","h":"<span class=\"pg\" data-n=\"79\">79<\/span>166. Суйлемдерду түрлөрүнө карай аныктагыла жана тыныш белгилерин койгула."},{"t":"p","h":"1. Жаштар, терен билим алууга умтулгула... 2. Кичинекей бөбөктөр тынчтыкта бала-бакчага барышат... 3. Ар дайым кун болсун... 4. Бейкутчулукта балдардын, кыздардын көңүлдөрү куунак... 5. Кыргызстанда тынчтык бекем сакталсын... 6. Адамзат тынчтыкты коргой алабы... 7. Адамдар талыкпай эмгектенишет..."},{"t":"p","h":"8. Бейкут жашоодо биз ден соолугубуз үчүн кам көрөбүз... 9. Ата Мекениңерди коргогула... 10. Бош убактыларында адамдар кайда барышат... 11. Бактылуу балалык өкүм сүрсүн..."},{"t":"p","h":"167. Тексттен алынган төмөнкү сөздөрдүн синонимдерин жазгыла: тынчтык -"},{"t":"v","l":["адам баласы -","куунак —","билим алуу —","бөбөктөр —","эмгектенишет —","сактоо —","чөйрө —","Ата Мекен -—","умтулуу -"]},{"t":"p","h":"1. Жогорку сөздөр менен жай, суроолуу, илептүү жана буйрук иретинде айтылган сүйлөмдөрдүн ар кандай түрлөрүн түзгүлө."},{"t":"p","h":"2. «Бизге тынчтык керек» аттуу тексттин мазмунун кайра айтып бергиле."}],"sub":[{"title":"БИЗГЕ ТЫНЧТЫК КЕРЕК","b":11}],"pages":[78,79]},{"title":"§ 48. Сүйлөмдүн түрлөрү","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"80\">80<\/span>ПТ ЧЕЙРЕК"},{"t":"h3","h":"§ 48. Сүйлөмдүн түрлөрү"},{"t":"p","h":"(жай, суроолуу, илептүү) боюнча көнүгүүлөр —"},{"t":"p","h":"Упражнения по видам предложений (повествовательные, вопросительные, восклицательные)"},{"t":"p","h":"168. Текстти көркөм окугула, Сүйлөмдүн түрлөрүн таап, аларды эрежесине жараша далилдегиле."},{"t":"h3","h":"АК КЕМЕ"},{"t":"img","src":"data:image/webp;base64,UklGRkC3AABXRUJQVlA4IDS3AADw8gOdASo3AlYDPrFMoUmnJKOiLfTcgOAWCWdu3sqOAaxP/3iTvSWg7uH0y44fK2rP1/9TnyL+L/5/+W8ZfyX65/m/3/9+vgi/Tsl/r3+T5lfzz9Nf9fPnwV+fuov+ffu7gnew8yz6F/lf///qejFzn9tf2L/vfvf8HX7ecxd+A9CH/6eq1/0+kf84/8P7wemYitJI72SMY4bRDUTxa5HeyRjG2x6rp9+MYDuy94j45csO6owkyYC таенеси таң калып, жээкте карап турмак... 4. «Кайыр кош, Тоо-Ташым...»,- деп бала коштошмок... 5. Бирок, эч качан балык болуп сүзө албасыңды билдиң бекен..."},{"t":"p","h":"170. Көп чекиттин ордуна текст алдындагы сөздөрдү пайдаланып, маанисине карай тууралап жазгыла."},{"t":"p","h":"1. Мен өзүмдүн ... балык болуп заматта ... кетем. 2. Бала балык болуп, ...-... суудан көрүнүп турмак. 3. Ал ... түбүнөн сүзүп өтмөк."},{"t":"p","h":"4. Бала ... жерлерден ыргып чыгып, ... ... кыйкырмак. 5. Башы бала, денеси балык, мындай ... ким көрүптүр? 6. «Кошкула, мен Ысык-Көлгө ....!»"},{"t":"p","h":"С^ 1. Тексттин мазмуну боюнча маек түзүп, сөз айкаштарын таап талдагыла."}],"sub":[{"title":"АК КЕМЕ","b":5}],"section":"ПТ ЧЕЙРЕК","pages":[80,81]},{"title":"§ 49. Көнүгүүлөр – Упражнения","blocks":[{"t":"h3","h":"§ 49. Көнүгүүлөр – Упражнения"},{"t":"p","h":"171. Көркөм окугула, сүйлөмдөрдүн түрлөрүн тексттин тутумунда талдагыла,"},{"t":"p","h":"А к ы л бе к: – Болотбек, кулунум... Мени сагындыңбы?.. Мен да сени сагындым... куса болдум, кулунум... Болотбек, качан келип комузуңду колуңа аласың? Ушинтип эле илинип тура береби? Келсеңчи, келип ырдап берсеңчи... Ырыңды сагындым, күүңдү сагындым! Кыял-жоругуңду сагындым!"},{"t":"p","h":"Болотбек: – Урушка кеткен жеке эле мен белем, ата?! Мага <span class=\"pg\" data-n=\"82\">82<\/span>окшогондордун далайы кетпеди беле. Кана, алардын канчасы кайра айлына кайтып барды? Сен өңдөнүп уулун күткөн аталар аз эмес го..."},{"t":"p","h":"А к ы л бе к: – Болотбек! Болотбек!.. Баары бир сен келесиң! Келүүгө тийишсиң! Күтөм сени! Мен өлбөй сени күтүп жүрө беремин!"},{"t":"p","h":"Б. Жакиев, «Атанын тагдыры»"},{"t":"p","h":"1. Уулун күткөн Акылбек атанын ички сезимин сүрөттөп бергиле, 2. Болотбектин кайраттуулугун сүрөттөгүлө."},{"t":"p","h":"172. Сүйлөмдөрдүн аягына тыныш белгилерин тууралап койгула."},{"t":"p","h":"1. Акылбек ата урушка кеткен уулун абдан сагынды... 2. Уулум, качан келип комузуңду колуңа аласың... 3. Уулум, кыял-жоругуңду сагындым... 4. Аталар чыдамсыздык менен уулдарын күтүүдө..."},{"t":"p","h":"5. Урушка кеткен жеке эле мен белем, ата... 6. Алардын канчасы кайра айлына кайтып барды... 7. Мен сени өлбөй күтүп жүрө беремин... 8. Уулум, баары бир сен аман-эсен кайтып келесиң... 178. Суроолорго жооп бергиле жана сүйлөмдөрдү аныктагыла."},{"t":"p","h":"1. Акылбек ата кимди абдан сагынды?"},{"t":"v","l":["2. Акылбек атанын уулу Болотбек кайда эле?","З. Урушка жеке эле Акылбек атанын уулу кеткенби?"]},{"t":"p","h":"4, Акылбек ата уулунун уруштан аман-эсен кайтып келээрине ишенеби?"},{"t":"p","h":"174. Тынчтык жана жеңиш жөнүндө ураан жазгыла."},{"t":"p","h":"175. Төмөнкү сөздөрдүн синонимдерин таап, жай сүйлөм түзгүлө."},{"t":"p","h":"1. Уруш – 2. кыял-жорук – 3. күтүү – 4. уулу – Сүйлөмдөрдүн түрлөрүнө карай диалог түзүп келгиле."}],"sub":[],"section":"ПТ ЧЕЙРЕК","pages":[82,82]},{"title":"§ 50. Сүйлөмдүн баш жана айкындооч мүчөлөрү —","blocks":[{"t":"h3","h":"§ 50. Сүйлөмдүн баш жана айкындооч мүчөлөрү —"},{"t":"p","h":"Главные и второстепенные члены предложения Сүйлөм мүчөлөрү өз ара баш жана айкындооч өлөрдөн турат."},{"t":"p","h":" Баш мүчөлөр сүйлөмдүн негизин тузуп, башка суйлем мучелеруне кез каранды болбойт."},{"t":"p","h":"Члены предложения делятся на главные и второстепенные."},{"t":"p","h":"Главные члены составляют грамматическую основу предложения и не зависят от других членов предложения,"},{"t":"raw","h":"<div class=\"gloss\"><p>82<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"83\">83<\/span>'Суйлемдун баш мучелеру ээ менен баяндоочтон турат."},{"t":"p","h":"Главные члены предложения – подлежащее и сказуемое. Мисалы: Р. Киплинг «Маугли» жомогун жазган. Айкындооч мучелер баш мучелерду аныктап, тактап, толуктап турат. Алар толуктооч, аныктооч, бышыктооч болуп ажыратылат."},{"t":"p","h":"Второстепенные члены предложения служат для пояснения, уточнения, дополнения главных членов. Второстепенные члены предложения состоят из дополнения, определения, обстоятельства. 176. Текстти окугула да, тааныш эмес сөздөрдү которуп, сөздүккө жазгыла."},{"t":"h3","h":"МЕН ДАРЫГЕР БОЛГУМ КЕЛЕТ"},{"t":"p","h":"Бүгүнкү күндө ар кандай кызыктуу кесиптер көп. Алардын ичинен мага дарыгерлик кесип абдан жагат. Ал абдан керектүү кесип. Анткени дарыгер адамдын ден соолугу үчүн күрөшөт. Бул кесипке ээ болуш үчүн өтө көп окуу керек. Дарыгерлик кесип адам өмүрүн сактоодо чоң жоопкерчиликти талап кылат. Менин атам менен апам дарыгер болуп ооруканада иштешет. Атам хирург, апам болсо балдар догдуру. Бош күндөрүмдө атам иштеген бейтапканага келип турамын. Анын аткарган дарыгерлик иштерине байкоо жүргүзөмүн. Атамдын негизги милдети – оорукчандарга хирургиялык операция жасоо. Операциядан кийин аларды дарылайт. Оорулууларга жылуу мамиле жасап, алардын ден соолугуна өзгөчө камкордук көрөт. Ушундай дарылоодон соң, алар тез арада айыгып кетсе, атам өзүн өтө бактылуу сезет. Эгерде үй-бүлөдө бирөөбүз ооруп калсак, атам менен апам медициналык тез жардам көрсөтүшөт. Алар ар убакта биздин ден соолугубузга жакшы камкордук көрүп турушат. Атам менен апам өз кесибин ардактап сүйүшөт. Алар адам өмүрүн сактап калуу аракетинде кызмат кылышат. Мен да келечекте атам менен апамдай дарыгер боломун."},{"t":"p","h":"177. Тексттин мазмунундагы ким? эмие? деген суроолорго жооп берүүчү сөздөрдү өзүнчө катарга, эмие кылат? эмне кылып жатат? эмне болот? деген суроолорго жооп берүүчү сөздөрдү өзүнчө катарга жазгыла да, аларды сүйлөмдүн кандай мүчөлөрү экенин тексттин контекстинде далилдегиле."},{"t":"v","l":["Улгу: 1. Ким? – дарыгер, ..","2. Эмне? – кесип, ..."]},{"t":"p","h":"<span class=\"pg\" data-n=\"84\">84<\/span>3. Эмне кылат? – күрөшөт, 4. Эмне кылышат? – ооруканада иштешет, ..."},{"t":"p","h":"5. Эмне кылат? талап кылат, 6. Эмне кыламын? – келип турамын, ..."},{"t":"p","h":"178. Суроолорго жооп жазгыла жана сүйлөм мүчөлөрүн аныктагыла, 1. Кандай кесиптерди атай аласыңар?"},{"t":"v","l":["2. Ата-энеңердин кесиби барбы?","3. Атаңдын кесиби сени кызыктырабы?","4. Ал эми апаңдын кесибичи?"]},{"t":"p","h":"5. Кимдин атасы менен апасы дарыгер болуп иштейт?"},{"t":"p","h":"6. Адамдын ден соолугу, өмүрү үчүн ким күрөшөт?"},{"t":"p","h":"Т. Оорулууларга медициналык тез жардамды кимдер көрсөтөт?"},{"t":"p","h":"8. Оорулуулар кандай мамилеге муктаж?"},{"t":"p","h":"9. Ким дарыгерлик кесипти сүйөт?"},{"t":"p","h":"179. Төмөнкү медициналык терминдердин түшүндүрмөсүнө көңүлүңөрдү бургула жана аларды пайдаланып сүйлөм түзүп, дептериңерге жазгыла."},{"t":"p","h":"1) пациент – дарыгердин кабыл алуусуна ооруп келген адам;"},{"t":"p","h":"2) рецепт – оорукчандын диагнозуна жараша жазылып берилген дары-дармектин тизмеси, дозасы жана ичүү убактысы;"},{"t":"p","h":"3) диагноз – оорунун аталышы (мис., бронхит, гепатит ж. б.);"},{"t":"p","h":"4) градусник – дененин температурасын өлчөгүч;"},{"t":"v","l":["5) операция – дененин ооруган жерин союу;","6) хирургия – операция жасоочу оорукана бөлүмү;"]},{"t":"p","h":"Т) рентген – ички органдарды көрүүчү медициналык аппарат;"},{"t":"p","h":"8) артериялык давление – кан басымы;"},{"t":"p","h":"«Мен дарыгер болгум келет» – аттуу тексттин негизинде дарыгерлик кесип жөнүндө өз оюңарды айтып бергиле. Андагы сүйлөмдүн баш мүчөлөрүн тапкыла."}],"sub":[{"title":"МЕН ДАРЫГЕР БОЛГУМ КЕЛЕТ","b":10}],"section":"ПТ ЧЕЙРЕК","pages":[83,84]},{"title":"&amp; 51. Сүйлөмдүн ээси —","blocks":[{"t":"h3","h":"&amp; 51. Сүйлөмдүн ээси —"},{"t":"p","h":"Главный член предложения – подлежащее №» Эске түшүргүлө:-Вспомните:"},{"t":"p","h":"Ээ- сүйлөмдүн баш мүчөсү, мааниси жана грамматикалык жактан баяндооч менен байланышып турат."},{"t":"p","h":"Подлежащее – главный член предложения, который по смыслу и грамматически связан со сказуемым."},{"t":"raw","h":"<div class=\"gloss\"><p>84<\/p><\/div>"},{"t":"v","l":["<span class=\"pg\" data-n=\"85\">85<\/span>Ээ атооч жөндөмөсүнүн","ким? кимдер? эмне? эмнелер?","деген суроолоруна жооп берет.","Подлежащее отвечает на","вопрос именительного падежа","кто? что?"]},{"t":"p","h":"М исал ы: В, А. Моцарт симфония, серенада жана ыр ларды жазган. Ким симфония, серенада жана ырларды жазган? – В. А, Моцарт."},{"t":"v","l":["Самолёт учту.","Эмне учту? – Самолёт."]},{"t":"p","h":"180. Текстти окугула да, анын алдындагы берилген жаңы сөздөрдү сөздүккө көчүргүлө. Сүйлөм ээлерин тапкыла."},{"t":"h3","h":"«МАНАС» ЭПОСУ"},{"t":"img","src":"data:image/webp;base64,UklGRjA1AABXRUJQVlA4ICQ1AACwXAGdASqAAmMBPrVUo0unJSsspzQMQZAWiWltr50vI3T3yMTqvyiX2tXfLH87eaR6Wbb+G93/UfnnXrS4h8/NPxH8732z+I5dsTXvrx68Y/m/qQe4PPtjMOKfIvkJRoeWhw8XQm9p0VKw5iWCkstUR542pDaMe/4LuiOo+9siXIUzXs/laRDepsMdq+kUiBRTqPFpRw//qSuB5ZKLxXXUo3FdEE+gX5NoLbtST+quGelH4Sfa0JkFa0cOKv4nmnjETRaHtPe7blppwIwnwO573HcDefwWZ+PLAV1ByU/98GiPyxFz+rJWRyxCBray5hiLpM1d4g5R/LtRC2uogG6lZ1w0jfod8fCCOK2h9jaiI6imrHA/5HT3C88Q2sDeF66w6//A6KkIQQP4heuMZcWlWt9hVCykeKYgGhQl6ypQjNvJlITMarfq3FzYtMX4pG7a8yoWt5ChUE5SbbqfQH60azzuWyvVJs5p18lGUEFY6Jpqsa+pu+oSqwlIMEQhBja9pv711LikJrwQ7F7guKPJaoJOahXYrhvbhPa7Zw3oZz4oxw/n9Buh61+P44S1OZYKsld3K1BttVXpK433+uwuP+e44D+skRJ1C6C/lofq4kEaMvHThMGqf1OPVT0K6is3cdJ22dRL9Yad1oRrXoT5J8DnoAvGnz8rT64hP0RKWDXdOO5GshAnC8hjGBdghggtYXiIN2lBLukzB+PX2fj4nNEyYuQnnhYrnP8g3QFFB4y5uk9KB8z80JHN+kdSvcxRmR++JWQ5T1ujfUIHqiFyOC4yQm6orhFlAnlCfv6DaoamiE4w9crOSIsrjq759o9RHGNhUfA8dXMyS+iPfMuCvWFQYfVSWDsbJ3oaZormY3a6K1yC1OWIx+4oh7v8q0mvEiI98xtSBYEJIzVtUFZHxigr/swBhlsMaYwKuRNuGGoQKckdDM8f202TTxIchipzcIJGq1sy7twCOndRloFGwDjmuiaKWxXvgZTwzW0dbts1M2DasCBkr5E+8dk3LOwAsmeQz1e/Siw8UwYeT/EEXZQR5EsLBrW34Q4E8A1R6a5pXn4RR6ZEzo/N09v6rfYJ0geLxRUhAV2cg9uwMULjyWqCIEsZ2JIh28FNaX17+Md/ROcfCE+X1PJsMQYhusfyspUNrbbGxIcKVRYKw+wRa3UlVUhjyrW57vhAcCRZty40McFC3dQIZxitAx5yfzdwzYOz8e0zR+MT3hWvhESpPshNblmqdS7yEzGX/o/iDFwwklZnDsNulwvc45etGeuvfjj4zt9EQZ0thRTO8hOv838Wq2eOgCdaoP4mD/LNtAq6y3vqZw3ABy7yDZl9VfZROY7HrspU87/lCbPVbKXrY7gpKWC4xZIHB71eF33mXjap2rANrxYRYlpqF1wx3YqG44ypzco5V3uSFwOan9bGwLC6EnpcGmI6iFrOZS5Q0RrHmnfiXjbGNnBROQp5uyIW0QjHHvnUw9ooyqCR8S0MVPeMwnMTp+WPHvkM23jE8IuiIN/lf5CFRm5Qx4/B1us7MFGqFWEnvrNi3i+FUJaCA2FyycCjn1kG7DYI2ZIXjN5BxRXO1qrQufc2xtieX6OJiwSLzY/XIm6v0bM0relDcjoAbwhdgUbVuVSn дливый","канкор – жестокий","чыккынчы – предатель","кылымдар бою – на протяжении","веков","эркиндик учун – за свободу","","? 1) Кыргыз элинин баатырдык эпосу кандай аталат?","2) Бул дастанда ким жөнүндө баяндалат?","3) Улуу эпос кандай казына?","4) Эпос канча бөлүмдөн турат?"]},{"t":"p","h":"5) Эпос жөнүндө дагы кандай маалыматтарды билесиңер? 181. Төмөнкү сөздөрдү байланыштырып сүйлөмдөрдү түзүп, суроо берүү менен сүйлөмдүн ээсин тапкыла (жазуу түрүндө)."},{"t":"p","h":"1. Кыргыз эли, сыймыктанат, менен, «Манас» эпосу. 2. Манас ата, каарман, эпостогу, эң башкы, болуп эсептелет. 3. Биздин окуучулар, анын, жети осуятын, мазмунунан алынган, билишет. 4, Улуу манасчылар, өздөштүргөн, өнөрүн, «Манас» айтуу, абдан жакшы. 5. «Манас» эпосуна, кызыгышат, бардыгы, өтө."},{"t":"p","h":"182. Сүйлөмдөрдү маанисине карата толуктагыла жана сүйлөмдөрдүн ээсин суроо берүү аркылуу тапкыла,"},{"t":"v","l":["1... бүткүл өмүрүн Ата Мекенин коргоого арнаган.","а) баатыр","б) акылман","в) Манас ата","г) Жакып бай"]},{"t":"p","h":"2. Атактуу манасчы ... .. Ысык-Көл аймагындагы Ак-Өлөң айылында туулган."},{"t":"v","l":["<span class=\"pg\" data-n=\"87\">87<\/span>а) Сагымбай Орозбаков","б) Уркаш Мамбеталиев","в) Тыныбек Жапы уулу","г) Саякбай Каралаев"]},{"t":"p","h":"3. Белгилүү сүрөтчү ... «Манас» эпосу боюнча графикалык сүрөттөрдү тарткан."},{"t":"v","l":["а) Пикассо","б) Т. Т. Герцен","в) Г. Айтиев","г) Л. А. Ильина"]},{"t":"p","h":"4, «Манас» эпосунда баатырдык, калыстык жана патриоттук сыяктуу баалуу ... даңазаланат."},{"t":"p","h":"а) мамилелер"},{"t":"v","l":["б) мурастар","в) сапаттар","г) мүнөздөр"]},{"t":"p","h":"5. Катагандын хан ... балбандыгы менен ай-ааламга атагы чыккан."},{"t":"p","h":"а) Бакай ата"},{"t":"v","l":["б) Кошой","в) Акбалта","г) Алооке хан"]},{"t":"p","h":"Г] 1. Сабакта өтүлгөн жаңы сөздөр менен сүйлөм түзгүлө да, алардын баш мүчөлөрүн аныктагыла."},{"t":"p","h":"2. «Манас» эпосу боюнча текст түзүп, кыскача баяндап бергиле."},{"t":"p","h":"3. Грамматикалык эрежени жаттагыла,"}],"sub":[{"title":"«МАНАС» ЭПОСУ","b":9}],"section":"ПТ ЧЕЙРЕК","pages":[85,87]},{"title":"§ 52. Ээнин курамына карай бөлүнүшү — Классификация подлежащего по составу","blocks":[{"t":"h3","h":"§ 52. Ээнин курамына карай бөлүнүшү — Классификация подлежащего по составу"},{"t":"p","h":"&gt; Эске түшүргүлө:-Вспомните:"},{"t":"p","h":"Кыргыз тилинде ээ өзүнүн жөнөкөй курамына карай ээ жана тутумдаш ээ болуп бөлүнөт."},{"t":"p","h":"Женекей ээ аткарган кызматы боюнча башка сөздөр менен тутумдашпаган жөнөкөй же татаал сөздөрдөн турат."},{"t":"p","h":"Подлежащее в кыргызском языке делится по своему составу на простое и составное."},{"t":"p","h":"Простое подлежащее состоит из простых или сложных слов, не являющихся неразложимым по функции словосочетанием. Мисалы: Ибн Сина он жашында алгебра, геометрия жана философияны да өздөштүргөн."},{"t":"p","h":"Жылдыздар көлөмү боюнча бири-биринен абдан айырмаланышат."},{"t":"p","h":"Тутумдаш ээ аткарган кызматы боюнча эки же андан ашык сөздөрдүн ажырагыс тизмегинен турат."},{"t":"p","h":"Составное подлежащее состоит из неразложимых по функции сочетаний двух или более слов."},{"t":"p","h":"<span class=\"pg\" data-n=\"88\">88<\/span>М ы: Кыргыз тили биздин улуттук тилибиз болуп эсептелет."},{"t":"p","h":"Билим алуу ийне менен кудук казгандай."},{"t":"p","h":"183. Жөнөкөй жана тутумдаш ээлүү сүйлөмдөрдү өз-өзүнчө бөлүп, көчүрүп жазгыла."},{"t":"v","l":["1. Адам ойго тойбойт, бөрү","койго тойбойт.","2. Калп – ырыс кесет."]},{"t":"p","h":"3. Кыңыр иш – кырк жыл-"},{"t":"v","l":["дан кийин билинет.","4. Кылыч жарасы бүтөт,","тил жарасы бүтпөйт.","","5. Күн караган – суукка","тоңот, бай караган – ачтан","өлөт.","","6. Озунган утат."]},{"t":"p","h":"– Человек мыслью не насытится, а волк-овцами."},{"t":"p","h":"– Ложь счастье отсекает; Ложь к добру не приведёт."},{"t":"p","h":"– Дурное дело и через сорок лет обнаруживается."},{"t":"p","h":"– Рана, нанесённая мечом, заживает, рана, нанесённая языком, не заживает."},{"t":"p","h":"– Кто на солнце надеется, тот замёрзнет, кто на бая надеется, тот с голоду умрёт."},{"t":"p","h":"– Кто старается, тот добивается,"},{"t":"p","h":"184. Берилген сүйлөмдөрдү жөнөкөй жана тутумдаш ээлер менен толуктап дептериңерге жазгыла."},{"t":"p","h":"1. Жыл мезгилине жараша ... өзгөрүп турат. 2. ... асыл тукумдуу уйлары менен дүйнөгө атагы чыккан. 3. ... тазалыктын, назиктиктин символу катары даңазаланат. 4. ... «Илиада» жана «Одиссея» поэмасын чыгарган. 5. ... майдын алгачкы күндөрүндө, жаңгак менен талдан кийин гүлдөйт. 6. ... бардык эле элдерде 1-январдан башталбайт. Т. .. саатына 50 километрге чейинки ылдамдыкта сүзүшөт."},{"t":"p","h":"4 Пайдаланылуучу сөздөр: Ак кайың, дельфиндер, Гомер, Ак куу, аба ырайы, Австрия, Жаңы жыл,"},{"t":"p","h":"185. Диалогду эки-экиден окугула да, андагы сүйлөмдүн баш мүчөлөрүн тапкыла."},{"t":"h3","h":"МЕКТЕПТИН КИТЕПКАНАСЫНДА"},{"t":"p","h":"В ла ди к: – Саламатсыңбы, Каныкей?"},{"t":"p","h":"К ан ы ке й: – Саламатсыңбы? Сен экзамендерге кандай даярданып жатасың?"},{"t":"raw","h":"<div class=\"gloss\"><p>88 – —<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"89\">89<\/span>В л ади к: – Мен китепканага кыргыз тилинен экзамендик дилбаяндарды жазууга келдим."},{"t":"p","h":"К ан ы к ей: – Албетте, кыргыз тили жана адабияты мугалимибиз сабакта дилбаяндардын темаларын жаздырган."},{"t":"p","h":"Влади к: – Менин ишим оңунан чыкты. Сага жолукканыма кубанычтамын. Кана эмесе, ишке киришели!"},{"t":"p","h":"К ан ы кей: – Бизге керек адабияттардын бардыгы бул китепканада бар экен. Аларды бир сыйра карап чыгалы да, дилбаян жаза баштайлы."},{"t":"p","h":"Владик: – Мен макулмун!"},{"t":"p","h":"186. Текстти окугула, Тексттеги сүйлөмдүн баш мүчөлөрүн тапкыла."},{"t":"h3","h":"КЫРГЫЗ УЛУТТУК КИТЕПКАНАСЫ"},{"t":"p","h":"Бишкектеги эң чоң китепкана – Кыргыз улуттук китепканасы. Анын окуу залдары жарык, кенен жана таза. Китепканада керектүү илимий жана адабий окуу китептеринин бардыгы бар. Алар кыргыз, орус, англис, француз, немец, кытай жана башка тилдерде жазылган. Китептер абдан көп болгондуктан, алардын арасынан керектүүнү табыш керек. Бул учурда каталогдун жардамы менен изделет. |Кыргыз улуттук китепкана эч убакта бош болбойт. Ага илимий кызматкерлер, окумуштуулар, аспиранттар, студенттер, окуучулар келишет. Алар керектүү окуу китептеринен каалагандай даярданышат! Китепканада ар бир илимдин тармагы боюнча өзүнчө бөлүмдөр иштейт. Илимий, көркөм, тарыхый, чет элдик адабият жана искусство боюнча да атайы окуу залдары бар. Анда окуп, билимдерди тереңдетүүгө зарыл шарттар түзүлгөн. Мугалимдер жана окуучулар да бош убактыларында китепканага барып турушат. Алар китеп окуу жана гезит-журналдардын жаңы сандары менен таанышуу үчүн китепканага келишет. Бардыгыбыз Кыргыз улуттук китепканасы менен абдан сыймыктанабыз. @ керектүү – нужный илимий жана адабий китептер – научные и литературные книги илимий кызматкер – научный сотрудник"},{"t":"v","l":["окумуштуу – учёный","окуу материалдары – учебные материалы","ар бир тармагы – каждая отрасль"]},{"t":"p","h":"1. Жогорку сөздөрдү пайдаланып, сүйлөмдөрдү толуктагыла, баш мүчөлөрдүн астын сызгыла,"},{"t":"p","h":"1... диссертациялык эмгегин коргоого даярданып жатат."},{"t":"p","h":"2. Студенттер ... .. улуттук китепканадан алышат. 3. ... илимий <span class=\"pg\" data-n=\"90\">90<\/span>изилдөө жүргүзүп жатат. 4. Алар ... ... шаардык китепканадан табышат. 5. Аспиранттар ... илимий адабияттарды пайдаланышат."},{"t":"p","h":"6. Кыргыз улуттук китепканада илимдин ... ... боюнча бөлүмдөр бар."},{"t":"p","h":" 2. Эки-экиден маектешүүгө даярданып келгиле."}],"sub":[{"title":"МЕКТЕПТИН КИТЕПКАНАСЫНДА","b":25},{"title":"КЫРГЫЗ УЛУТТУК КИТЕПКАНАСЫ","b":35}],"section":"ПТ ЧЕЙРЕК","pages":[88,90]},{"title":"§ 53. Ээнин милдетин аткаруучу сөздөр — Способы выражения подлежащего","blocks":[{"t":"h3","h":"§ 53. Ээнин милдетин аткаруучу сөздөр — Способы выражения подлежащего"},{"t":"p","h":"Кыргыз тилинде ээнин милдетин төмөнкүлөр аткарат:"},{"t":"p","h":"а) жекелик жана көптүк сандагы атооч жөндөмөсүндөгү зат атоочтор:"},{"t":"p","h":"Подлежащее в кыргызском языке выражается:"},{"t":"p","h":"а) существительным в именительном падеже в единственном и множественном числе:"},{"t":"p","h":"М исал ы: Мугалим (ким?) класска кирди. Сабак (эмне?) башталды."},{"t":"p","h":"Окумуштуулар (кимдер?) бизди илимий жаңылыктар менен тааныштырышты. Ысык-Көлдүн жээгине көптөгөн эс алуу жайлары (эмнелер) жайгашкан."},{"t":"v","l":["б) жекелик жана көптүк","сандагы атооч жөндөмөсүндөгү","ат атоочтор:"]},{"t":"p","h":"б) местоимением в именительном падеже в единственном и множественном числе:"},{"t":"p","h":"Мисалы: Мен (ким?) дилбаян жазып жатамын. Биз (ким?) жетинчи класста окуйбуз."},{"t":"p","h":"Ал (эмне?) шаардын борборунда жайгашкан."},{"t":"p","h":"Алар (эмнелер) жылуу жактарга карай учуп кетишти. Бул (кайсы) – Т. Атаев атындагы орто мектеп."},{"t":"p","h":"в) жекелик жана көптүк сандагы атооч жөндөмөсүндөгү зат атооч маанисиндеги башка сөз түркүмдөрү:"},{"t":"p","h":"в) другими частями речи в значении существительного в именительном падеже в единственном и множественном числе:"},{"t":"p","h":"М исал ы: Билимдуу (ким?) эмгегине ишенет, билимсиз (ким?) түшүнө ишенет."},{"t":"p","h":"Экөө (канчоо) республикалык олимпиадага катышат. Карап тургандар (кимдер) балдарга жардамдаша башташты."},{"t":"p","h":"<span class=\"pg\" data-n=\"91\">91<\/span>187. Текстти окугула да, сүйлөмдөрдүн ээсин тапкыла,"},{"t":"h3","h":"МЕНИН СҮЙГӨН КИТЕБИМ"},{"t":"p","h":"Мен көркөм адабий китептерди окуганды абдан жакшы көрөм. Айрыкча Ч. Айтматовдун чыгармаларын кызыгып окуймун. Жазуучу роман, повесттеринде керемет легендаларды, уламыштарды, жомокторду жана мифтерди жараткан. Алардын философиялык мазмуну мени кызыктырат. «Ак кеме» повестиндеги «Мүйүздүү Бугу Эне» жөнүндөгү жомогунда Баланын ыйык ишеними мени ойлонтот. Кыргызды кыргындан сактап калган Сыйкырдуу Бугу Энеге кол салуу – өз энесине кол салуу менен барабар. Ыйык Бугу Энени сактап кала албаган Бала өзүнүн «Ак кемесин» издеп, балык болуп сүзүп кетет. Мен Баланын ички таза дүйнөсүндөгү өз идеалына карай багыт алгандыгын билдим."},{"t":"p","h":"Жазуучу өзүнүн балалыгы туш келген согуш күндөрүн «Эрте жаздагы турналар» повестинде чагылдырган. Анда «Аксай десанттары»: Султанмурат, Анатай, Эргеш жана башкалардын оор күндөрдөгү эмгектери баяндалган. Алардын балалык таттуу кыялдарына, Султанмурат менен Мырзагүлдүн аруу сезимдерине мен таасирлендим. «Деңиз бойлой жорткон Ала-Дөбөт» повести Охот деңизинин жээгиндеги нивх элинин турмушунан алынып жазылган."},{"t":"p","h":"Мен Ч. Айтматовдун чыгармаларын окууну уланта беремин. Менин китеп текчемде анын «Жамийла», «Кылым карытар бир күн», «Кыямат», «Гүлсарат», «Делбирим», «Тоолор кулаганда» аттуу китептери бар. Бул чыгармалар менин жан дүйнөмдү байытаарына көзүм жетет. Андагы окуялар бакыт жана кайгы, өмүр жана өлүм, жакшылык жана жамандык тууралуу ой жүгүртүүгө үйрөтөөрүн билемин."},{"t":"p","h":"1. Төмөнкү сөздүн тушуна орусчасын жазгыла,"},{"t":"raw","h":"<h4 class=\"mk\">керемет – ыйык ишеним – кыргындан сактоо – таза дүйнө – багыт алуу – таттуу кыялдар – аруу сезим – таасирленүү —<\/h4>"},{"t":"v","l":["камкордук көрүү —","«Деңиз бойлой жорткон Ала-Дөбөт» —","Улуу Туман —","Улуу Деңиз —","«Кыямат» —","«Кылым карытар бир күн» —","жан дүйнөнү байытуу —","«Тоолор кулаганда» —"]},{"t":"p","h":"<span class=\"pg\" data-n=\"92\">92<\/span>188. Сүйлөмдөрдү тексттин мазмунуна карата толуктагыла жана сүйлөмдөрдүн ээсин тапкыла."},{"t":"p","h":"1. .. чыгармаларында элдик легендаларды, жомокторду жана мифтерди пайдаланып жазган. 2. ... өзүнүн символу «Ак кемесине» карай сүзүп кетет. 3. ... «Эрте келген турналар» повестиндеги Султанмурат менен Мырзагүлдүн аруу сезимдерине таасирлендим. 4. ... ... .. өз өмүрүн Кирисктин аман калышына арнашкан. 5. Жазуучунун ... окурмандардын жан дүйнөсүн байытат. 6. Анын чыгармаларындагы ... адамдарды ар тараптуу ой жүгүртүүгө багыт берет."},{"t":"p","h":"189. Сүйлөмдөрдүн баш мүчөлөрүн таап, кайсы сөз түркүмү ээнин милдетин аткарып жаткандыгын эрежеге ылайык аныктагыла."},{"t":"p","h":"1. Мен Ч. Айтматовдун кызыктуу чыгармаларын окуп жатамын. 2. Ал бизге үлгү, акылман, эмгекчил каармандарды жараткан. 3. Биз чыгармалардын мазмуну аркылуу адам сапаттарын талдайбыз. 4. Чыгармалардагы каармандар дүйнөнү өзгөртсө, дүйнө каармандарды өзгөртөт. 5. Окурмандар идеалдуу каармандарды өз жашоосунда өрнөк кылышат. 6. Ч. Айтматов сөздүн керемет күчү менен окуя, көрүнүштөрдү баяндайт."},{"t":"v","l":["Текст түзүп, айтып берүү.","1. Сенин сүйгөн китебиң жөнүндө.","2. Чыгармадагы негизги ой, окуя жана көрүнүштөр."]},{"t":"p","h":"З. Сага үлгү, өрнөк болгон каармандардын сүрөттөлүшү."},{"t":"p","h":"4. Адамдык сапаттардын даңазаланышы."},{"t":"p","h":"5. Чыгарманын таалим-тарбиялык идеясы эмнеде?"}],"sub":[{"title":"МЕНИН СҮЙГӨН КИТЕБИМ","b":17}],"section":"ПТ ЧЕЙРЕК","pages":[91,92]},{"title":"§ 54. Көнүгүү, сөз өстүрүү — Упражнения и развитие речи","blocks":[{"t":"h3","h":"§ 54. Көнүгүү, сөз өстүрүү — Упражнения и развитие речи"},{"t":"p","h":"(1907 Теменку ыр саптарындагы Манас атанын сын-сыпатына, мүнөзүнө, касиетине карата берилген классикалык портретти кыргызча, орусча көркөм окуп салыштыргыла, тилиңерди жатыктыргыла."},{"t":"h3","h":"МАНАС АТАНЫН СҮРӨТТӨЛҮШҮ:"},{"t":"v","l":["Алтын менен күмүштүн,","Ширөөсүнөн бүткөндөй.","Асман менен жериңдин,","Тирөөсүнөн бүткөндөй.","Айың менен кунундун,","Словно из сплава,","золота и серебра он слит.","Словно сделан он","из опоры земли и неба.","Словно он сотворен","<span class=\"pg\" data-n=\"93\">93<\/span>Бир езунен бүткөндөй.","Алды калың кара жер,","Жерлигинен түткөндөй.","Ай алдында дайранын,","Толкунунан бүткөндөй.","Абадагы булуттун,","Салкынынан бүткөндөй.","Асмандагы ай, күндүн,","Жаркынынан бүткөндөй.","из солнца и луны.","Земля его держит потому,","что она плотная.","","Он словно сотворен из","прохлады небесных облаков.","Он словно создан","из лучей солнца и луны,","что на небесах.","","»› а) Манас атанын сын-сыпаты кандай сүрөттөлгөн?","б) Манас атанын мүнөзү кандай берилген?"]},{"t":"p","h":"в) Манас атанын сапат-касиети кандай көркөмдөлгөн?"},{"t":"p","h":"191. Сүйлөмдөрдөгү көп чекиттин ордуна маанисине жараша тиешелүү сөздөрдү жазгыла (мүнөзү, баатыр, Манас ата, сапат-касиети, күчү). Сүйлөмдүн баш мүчөлөрүн тапкыла."},{"t":"p","h":"1. ... кыргыздын Асман менен Жердин тирөөсүндөй баатыры болгон. 2. Манас атанын ... асмандагы Айдай, Күндөй жаркылдап турган. 3. Анын ... көктөгү Күндүн, Айдын нуруна салыштырылган. 4. Манас атанын баатырдык ... дайранын чоң толкунундай болгон. 5, Манас атабыз алтын менен күмүштүн ширөөсүнөн бүткөндөй ... болуп сүрөттөлөт."},{"t":"p","h":"192. Текстти окуп кыргызчага которгула."},{"t":"img","src":"data:image/webp;base64,UklGRtxdAABXRUJQVlA4INBdAABQpAKdASrXAfYCPrVOoUmnJKcorfN8aRAWiWlud+uke8sJKnO6BTPYB//9g+f9gPn+X0mY2X+sn9p7/c2v2fwU/GD/z/lcjOzvxyvS+NT/n8hz/P2E/T/VO/1Xpn6cH4L0K/RZ/9/Td+e//U7I6TAMd3UrMgPNhg0f+tI8MBr9+0AWp+qxKHS5/sOQtoYx6x3f9pt+TEfdHKsZFUQsBKsCMX7VtgvvAtALknzRlizmUEaOlRrqbxWsIKcj+9goFOJU8A4TLK5R7iFnrN3Qkr0ZofzXUz2RTG0aEJQZvLiEqrF9Vn9viykt7AXo1oGtbkBguUTqSyNF2VkhwyJ5XTeaLkqoOoQrl5HGjOU7BwkiiY54VhQsDsYMnKA+73/kuA3EbHg14pqzyBM+vzzvkpbncs+obGAZdrcsZzw/sv0Jn5RHGj7c5aFJzIBgu6zKy4XfYWxdkj4BNjO++8ybAP+8EdeeOs6Mi4nkgP1wXJ/SvES1TsAvolzPe7w7GcgEo7OvHldk1HLR4i9h73RFknyeei1uu4z4mkMltZnwEzr1hrZPvk7cW4mueVK3WOyXGM/G2tnzCTeqXc1pPtxs3OqeUsH+4w+ZCuVml93Om4wE7yHb+2P/oU1xMCNmFKk2xag7bM/pilogIGL5YiArTGjD9pMdJyhSPRrGzlCuWHazDCnAEvugPb3XCVBzo0hFUvMpZRUGmHJAvO6bY/xs+eLnHOwfDvpsvzc7bFyHTciD3HHvd+CiOECaLzscDe/YlLd6o7sGn0iGJJnH7xWKHKP7JriKXWLbGJffKP3Zu4iGS4UOQC1qbcJ0kaerC1RnW0twZjeNA1Hn5wl/uC5AgqCS4Y00n2SVcdWEDpP22tMfmC2K5v4QIX10VGsY+X5F365lKXHzvEqCHsDzlwjt4W+ISTG5mdo9hUSAl/CBgLS1HizwxPWm3Vq7JCG4fyMss2R692mQZzfUQlNzTCDrY/UTwagc5yHvYZXBD8lfDk0S1g0xYJJ4Zqth00mV9IjDmuJG6sNlkx2CfQ+8S9K6Q67XbyDXUez2slb/ZXRFKFM1Z/TRBXmt4vPOJ7htS5oPw8MdJzvvaviT3MitagZqgHxcKIPlTUP27SMK0Gdf9aO77JvubaSccQn4aHzNdNTWc8CbdZeL9JpVyfUu3Jb2OYgGou27PCpHZ6cCDVGGCJJpcW84llwhnRKKlMFY/tsRFsv0cjWz7rDBadiT4XGrq/NPA5q7V1Zf й эс аласың? 5. Жайында Ысык-Көлгө барып эс аласыңбы? 6. Жер-жемиштер, жашылчалар качан бышып жетилет? 7. Күз мезгилинде түшүм жыйноодо ата-энеңе жардам бересиңби? 8. Кыш мезгилинде жаратылыш кандай болуп өзгөрөт?"},{"t":"p","h":"9. Сен кайсы жыл мезгилин айрыкча жактырасың?"},{"t":"p","h":"1 Сага кайсы жыл мезгили жагат? Маек түзүп келгиле."}],"sub":[{"title":"МАНАС АТАНЫН СҮРӨТТӨЛҮШҮ:","b":2},{"title":"ВРЕМЕНА ГОДА И ПОГОДА","b":9}],"section":"ПТ ЧЕЙРЕК","pages":[93,94]},{"title":"§ 55. Көнүгүү, машыгуу иштери – Приобретение навыков","blocks":[{"t":"h3","h":"§ 55. Көнүгүү, машыгуу иштери – Приобретение навыков"},{"t":"p","h":"194. Текстти окуп, сөз айкаштарын тапкыла,"},{"t":"h3","h":"ГЛОБАЛДЫК ТОО САММИТИ"},{"t":"p","h":"Биздин республикада тоо чоң мааниге ээ. Тоолор – биздин өлкөнүн өнүгүү ресурстарынын бири болуп саналат. Учурда тоо аймагында жашоонун деңгээли төмөн. Тоо аймагынын жашоочулары үчүн тиешелүү шарттар жетишсиз. Мындай кырдаал адамзаттын өсүп-өнүгүү сферасында чоң жолтоо болот. Адамзаттын өнүгүү этабы анын ден соолугуна, билимине жана жашоосуна жараша болот. Ушуга байланыштуу «2002-Эл аралык Тоо жылы» деп жарыяланган. Бишкекте глоба дык тоо саммити өткөрүлгөн. Тоо саммитине {чет элдик өкүлдөрда катышкан. Бул сферадагы катаал маселелер каралган. Негизги үч муктаждык: чың ден соолук, билим алуу, жетиш кирешеге ээ болуу аныкталган. Булар татыктуу өмүр сүрүүгө абдан керек."},{"t":"p","h":"<span class=\"pg\" data-n=\"95\">95<\/span>® глобалдык тоо саммити – глобальный горный саммит тоодогу жашоонун деңгээли – уровень жизни в горах тоо жашоочулары үчүн тиешелүү шарттар жетишсиз – для жителей гор недоступны многие блага адамзаттын өсүп-өнүгүү сферасында – в сфере человеческого развития *«2002-Эл аралык Тоо жылы» – «2002-Международный год гор» чет элдик өкүлдөр – иностранные представители жетиштүү кирешеге ээ болуу – иметь доступ к ресурсам 195. Жогорку сөз айкаштарын пайдаланып, сүйлөмдөрдү толуктагыла жана сүйлөмдүн ээлерин тапкыла."},{"t":"p","h":"1. Бүгүнкү күндөгү ........ төмөн экендиги айкындалды."},{"t":"p","h":"2. Тоо жашоочулары үчүн тиещелуу 3."},{"t":"p","h":"жылы Бишкекте өткөрүлдү 1. 2. е... Да тоо саммитине катышты. 2 5. Негизги максат... .... ээ болуу. 6. Адамзаттын өсүп-өнүгүүй.. анын жашоо шарттарына жараша болот."},{"t":"p","h":"196. Сүйлөмдөрдү көчүрүп жазып, ээнин милдетин аткарган зат атоочторду жана ат атоочторду тапкыла."},{"t":"p","h":"1. Мен Ата Мекенимдин бактылуу адамымын. 2. Элдияр быйыл Бишкектеги Кыргыз-Славян университетин аяктады. 8. Глобалдык тоо саммити негизги маселелерди чечти. 4. Арча токою Кыргызстанда 316,7 миң гектар аянтты ээлейт. 5. Күмүш электр тогун абдан жакшы өткөрөт. 6. Алар дүйнөнүн «Жети керемети» жөнүндө мазмундуу маалымат алышты. 7. Биз атактуу атуулдарыбыз менен сыймыктанабыз."},{"t":"p","h":"197. Төмөнкү сөз айкаштарын сүйлөмдүн татаал ээси катары катыштырып, сүйлөм түзгүлө."},{"t":"p","h":"Ак шумкар, кимдир бирөө, окуу жайы, Ата Мекен, ар бири, көркөм искусство."},{"t":"p","h":"Кыргызстандын кандай тоолорун билесиң? Аңгеме түзүп, җазып келгиле."}],"sub":[{"title":"ГЛОБАЛДЫК ТОО САММИТИ","b":2}],"section":"ПТ ЧЕЙРЕК","pages":[95,95]},{"title":"§ 56. Көнүгүүлөр – Упражнения","blocks":[{"t":"h3","h":"§ 56. Көнүгүүлөр – Упражнения"},{"t":"p","h":"198. Диалогду экиден окугула, андагы маалыматтарды эсиңерге тутуп алгыла."},{"t":"p","h":"Б а к ы т: – Саламатсыңбы, Мирбек? Үйгө тоолор жөнүндө текст түзүп келүү тапшырылган. Сен Жер жүзүндөгү бийик тоолорду билесиңби?"},{"t":"raw","h":"<div class=\"gloss\"><p>в <\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"96\">96<\/span>М ир бе к: – Мен Гималай, Памир, Анд, Кавказ тоолорун билемин. Эң бийик тоо – Гималай болуп эсептелет. Анда дүйнөдөгү эң бийик чоку – Жомолунгма жайгашкан. Анын бийиктиги деңиз деңгээлинен 8848 метр. Бул бийик чокуга альпинисттер чыкканбы, сен билесиңби?"},{"t":"p","h":"Бак ыт: – 1953-жылы гана непалдык Тенцинг менен жаңы зеландиялык Хиллари биринчи жолу чыгышкан. Гималайда бийиктиги 8000 метрден ашкан дагы 10 чоку бар. Алардын көбүнө альпинисттер чыгышкан. Сен эң узун тоо тизмеги жөнүндө айтып бере аласыңбы?"},{"t":"p","h":"М и рес к: – Жер жүзүндөгү эң узун тоо тизмеги Түштүк Америкадагы Анд тоолору. Ал түндүктөн түштүктү карай 9000 километрге созулат. Кавказ тоолорунун эң бийик чокулары кайсы?"},{"t":"p","h":"Б а к ы т: – Эльбурс жана Казбек. Кыргызстан да тоолуу өлкөбү?"},{"t":"p","h":"М ир бе к: – Албетте, алар Кан-Теңир Тоо, Какшаал-Тоо, Теңир-Тоо, Кыргыз Ала-Тоосу, Күнгөй Ала-Тоо, Тескей Ала-Тоо, Сары-Жаз кырка тоосу жана башкалар. Сен биздин өлкөдөгү эң бийик чокуну атачы?"},{"t":"p","h":"Жаңылбасам, Теңир-Тоодогу Жеңиш чокусу. Анын бийиктиги деңиз деңгээлинен 7439 метр."},{"t":"p","h":"М ир бе к: – Ооба, туура айтасың, ал дүйнөдөгү эң бийик тоолордун катарына кирет. Эми бул маалыматтар боюнча биз мазмундуу текст түзөбүз."},{"t":"p","h":"199. Жогорудагы диалогдун мазмунунан ким? кимдер? эмне? эмнелер? – деген суроолорго жооп берүүчү зат жана ат атоочторду көчүрүп жазгыла. Алар сүйлөмдө кандай кызмат аткарып жаткандыгын түшүндүрүп бергиле."},{"t":"p","h":"200. Текстти окугула. Сүйлөмдөрдөгү баш мүчөлөрдү тапкыла."},{"t":"h3","h":"КОШОЙДУН КАРА-ТООСУ"},{"t":"p","h":"Кошойдун Кара-Тоосу Ала-Тоо түзүмүндөгү тоо. Нарын жана Ат-Башы өрөөнүнүн ортосунда, Нарын тоо тизмегине кирет. Узундугу 27 километр, орточо бийиктиги 3530 метр, эң бийик жери 4066 метр – Кошойдун чокусу деп аталат. Бул тоо «Манас» эпосундагы каарман Катагандын Кан Кошоюнун кароолу болгон. Кара-Тоонун чокусундагы Манастын ордосунда туруп Кошой баатырдын: «Балдар атка чөп салып койгула, малды сугаргыла, чыгаргыла» – дегени угулуп турчу экен."},{"t":"v","l":["? 1. Ала-Тоо түзүмүндөгү тоо кандай аталат?","2. Анын узундугу жана бийиктиги канча?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"97\">97<\/span>3. Эн бийик жери канча жана ал кимдин чокусу деп аталат?"},{"t":"p","h":"4. Катагандын Кан Кошою деген ким болгон?"},{"t":"p","h":"5. Кошой баатырдын буйругу кантип угулуп турчу экен? С) 1. Тек өрү куунак. Бардыгыбыз абанын тазалыгына, көлдүн кооздугуна, тунуктугуна суктанабыз. Күндүзү көлгө түшүп, күнгө күйөбүз. Балдар менен жарышып, көлдө чабак урабыз. Алар менен топ ойнойбуз, кайыкта сүзөбүз. Кечки тамактануудан кийин таза абага сейилге чыгабыз. Андан кийин машыктыруучу залга барып машыгабыз. Телевизор көрөмүн, кызыктуу китеп окуймун. Бир күнү саякатчылардын тобу менен Ысык-Көлдү айланып келдик. Көлдүн айланасындагы Каракол, Балыкчы, Чолпон-Ата шаарларын жана айылдарын басып өттүк. Тарыхый-археологиялык эстеликтер менен музейлерди көрдүк. «Жыргалаң», «Жети- Өгүз», «Тамга» сыяктуу курорт, санаторийлерди жана башка дем <span class=\"pg\" data-n=\"98\">98<\/span>алуу үйлөрдү, туристтик базаларды көрдүк. Көл жээгинде өскөн чычырканак, ит мурун, бөрү карагат, чие, чекенде бадалдарын да көрдүк. Мамлекеттик корукка алынган көл аймагында ак куу, өрдөк, боз каз жана башка куштар мекендейт экен. Ошондой эле жээгинде кыргоол, коён, ондатра жана башкалар көбөйгөн. Ал эми балыктын өстүрүлүп жаткан жыйырма эки түрүн: көк чаар, чабак, форель жана башкаларды билдик. Көл жээгине дарактар, жемиш бактары өстүрүлүп, жашылдандыруу башталганына биз кубандык. Ысык-Көлдүн табиятына, өсүмдүктөрү менен айбанаттар дүйнөсүнө суктанып кайттык."},{"t":"p","h":"Текстке тиешелүү жаңы сөздөрдү которуп, сөздүккө көчүрүп жазгыла."},{"t":"raw","h":"<h4 class=\"mk\">суктануу _вы тунук – сейилге чыгуу<\/h4>"},{"t":"p","h":"ых"},{"t":"v","l":["мамлекеттик корук","өсүмдүктөр дүйнөсү —","ка айбанаттар дүйнөсү —","1. Тексттин мазмунуна карата суроолорду түзгүлө.","2. Текст боюнча төмөнкүлөрдү атагыла:","1) Ысык-Көл аймагындагы шаарлар жана райондор;"]},{"t":"p","h":"2) Ысык-Көлдүн жээгиндеги курорт, санаторийлер, туристтик базалар, дем алуу үйлөрү;"},{"t":"p","h":"3) Ысык-Көлдүн жээгиндеги бадалдар, өсүмдүктөр;"},{"t":"p","h":"4) Мамлекеттик коруктагы куштар, жапайы айбанаттар; 202. Жогорудагы текст аркылуу сүйлөмдөрдү толуктагыла, 1. Кыргызстандын бермети – ... болуп саналат. 2. ... жагымдуу климаты менен курорттук зонага айланган. 3. ... Чолпон-Ата шаарындагы дем алуу үйүнө келип жеттик. 4. Пансионаттын ичи абдан кооз ... 5. Ысык-Көлдүн жээгинде ... ...... жана башкалар өсөт."},{"t":"p","h":"6. .. Ысык-Көлдүн кооз табиятына суктанышты. 7. ... Күнгөй, Тескей Ала-Тоосунун ортосунда чалкып жатат."},{"t":"p","h":"„Менин саякатым» – аттуу монолог түзүп келгиле."}],"sub":[{"title":"МЕНИН ЫСЫК-КӨЛГӨ САЯКАТЫМ","b":2}],"section":"ПТ ЧЕЙРЕК","pages":[98,98]},{"title":"§ 58. Өтүлгөн материалдарды жыйынтыктоо үчүн","blocks":[{"t":"h3","h":"§ 58. Өтүлгөн материалдарды жыйынтыктоо үчүн"},{"t":"p","h":"тесттик тапшырмалар – Тестовые задания для"},{"t":"h3","h":"подведения итогов пройденного материала"},{"t":"v","l":["1. Жөнөкөй ээнин милдетин аткаруучу сөздөрдү белгилегиле:","1. Билим – ийне менен кудук казгандай.","2. Жетөө күзгү сыноого калышты."]},{"t":"p","h":"3. Жаман – өз камын ойлойт, жакшы – эл камын ойлойт."},{"t":"p","h":"4. Мен Ысык-Көлгө саякатка барамын."},{"t":"raw","h":"<div class=\"gloss\"><p> г. 9<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"99\">99<\/span>И. Сүйлөмдөрдөгү тутумдаш ээлердин астын сызгыла:"},{"t":"p","h":"1. Мамыры гүлү апакай же саргыч түстө болот."},{"t":"p","h":"2. Абдылас Малдыбаев биринчи жолу «Манас» операсына музыка жазган."},{"t":"p","h":"3. Нерв системасы организмдин бардык бөлүктөрүн башкарат."},{"t":"p","h":"4. Тынч океан дүйнөлүк океандын дээрлик жарымын ээлейт."},{"t":"p","h":"5. Ормон хан кыргыздардын өз алдынчалыгы үчүн күрөшкөн."},{"t":"p","h":"6. Улуу Британия мамлекети Атлантика океанындагы аралдарда жайгашкан."},{"t":"v","l":["Ш. Туура вариантты белгилегиле:","1. Сүйлөмдүн баш мүчөлөрү кайсылар?","а) бышыктооч, аныктооч","б) толуктооч, кыймыл атооч","в) ээ, баяндооч","2. Сүйлөмдүн ээси кандай суроолорго жооп берет?","а) ким? эмне?","б) кандай? кайсы?","в) эмне кылды? эмне кылып жатат?","3. Ээ сүйлөмдүн кайсы мүчөсү менен байланышып турат?","а) толуктооч","б) баяндооч","в) бышыктооч","4. Ээ курамына карай кандай болуп бөлүнөт?","а) бир өңчөй","б) түгөйлүү","в) жөнөкөй, тутумдаш","5. Ээлик милдетти кандай сөздөр аткарат?","а) тууранды сөздөр","б) зат, ат, сан, сын, кыймыл атооч сөздөр","в) кызматчы сөздөр","6. Ысык-Көл кышында тоңбойт."]},{"t":"p","h":"Сүйлөмдөгү ээлик милдетти кайсы сөз түркүмү аткарып жатат?"},{"t":"v","l":["а) зат атооч","б) ат атооч","в) сан атооч","Т. Экөөбүз семинарга бирге бардык."]},{"t":"p","h":"Сүйлөмдөгү ээлик милдетти кайсы сөз түркүмү аткарып жатат?"},{"t":"p","h":"а) сын атооч"},{"t":"v","l":["<span class=\"pg\" data-n=\"100\">100<\/span>б) сан атооч","в) зат атооч","8. Кыпкызылы сатылып алынды."]},{"t":"p","h":"Сүйлөмдөгү ээлик милдетти кайсы сөз түркүмү аткарып жатат?"},{"t":"v","l":["а) ат атооч","б) зат атооч","в) сын атооч","9. Биз спорттук мелдеште биринчиликти алдык."]},{"t":"p","h":"Сүйлөмдөгү ээлик милдетти кайсы сөз түркүмү аткарып жатат?"},{"t":"v","l":["а) сан атооч","б) ат атооч","в) сын атооч","10. Жөнөкөй ээ катышкан сүйлөмдү белгилегиле:","а) Аба ырайы бузулду.","б) М. Ю. Лермонтов 1814-жылы Москвада туулган.","в) Дилбаян сабаттуу жазылган.","11, Тутумдаш ээ катышкан сүйлөмдү белгилегиле:","а) Мона Лиза пейзаждын фонунда тартылган.","б) Пилдер Африкада жашайт.","в) Жамгыр кечке төктү."]},{"t":"p","h":"12. Берилген жөнөкөй жана татаал ээлик милдетти аткаруучу сөздөрдү маанисине жараша коюп, сүйлөмдөрдү толуктагыла;"},{"t":"v","l":["1. ... 17 жашында аскердик ишин баштаган.","2. Касиеттүү ... адамдарды дарылап айыктырган."]},{"t":"p","h":"3. Жер астынан гана эмес, туздуу көлдөрдүн түбүнөн да ... алынат."},{"t":"p","h":"4. ... тамак сиңирүүнү жакшыртат."},{"t":"p","h":"5. ... айтылышы уйкаш, үндөш сөздөрдөн ыр сыяктанып куралат."},{"t":"p","h":"6. Улуу ... Кыргызстандын маанилүү бөлүгүн түзүп турган. Пайдаланылуучу сөз дө р: Жибек жолу, туз, жаңылмач, Александр Васильевич Суворов, кымыз, Умай Эне."}],"sub":[],"section":"ПТ ЧЕЙРЕК","pages":[99,100]},{"title":"§ 59. Сүйлөмдүн баяндоочу – Сказуемое","blocks":[{"t":"h3","h":"§ 59. Сүйлөмдүн баяндоочу – Сказуемое"},{"t":"p","h":"Ба яхн д о о ч – ээнин кыймыл-аракетин, абалын, билдирүүчү сүйлөмдүн баш мүчөсү."},{"t":"p","h":"3 100"},{"t":"p","h":"Сказуемое- главный член предложения, который называет действие, состояние или признак подлежащего."},{"t":"p","h":"<span class=\"pg\" data-n=\"101\">101<\/span>Баяндооч эмне кылды? эмне кылып жатат? эмне кылат? эмне болду? кантти? ким? эмне? канча? нече? кандай?"},{"t":"p","h":"М исал ы: Салижан Шарипов космос мейкиндигине учту (эмне кылды?)."},{"t":"p","h":"Орто топ оюнуна кыз-уландар да катышат (эмне кылат?). Келе жаткандар – бешөө (канча?)."},{"t":"v","l":["Акылдуунун сөзү – кыска (кандай?).","Эң улуубуз – Жылдыз (ким?)."]},{"t":"p","h":"Бутурицучулер экзаменге даярданып жатышат {эмне кылып жатышат?)."},{"t":"p","h":"203. Макалдарды окуп, маанисин чечмелегиле, эрежеге ылайык баяндоочторду тапкыла."},{"t":"p","h":"1. Ак ийилет, бирок сынбайт."},{"t":"p","h":"2. Сөз көркү – макал, эр көркү – сакал."},{"t":"p","h":"3. Шакылдаган жигитти жоо бетинде көрөрмүн."},{"t":"p","h":"– Правда гнется, кривда ломается."},{"t":"p","h":"– Краса речи – пословица, краса молодца – борода."},{"t":"p","h":"– На болтливого парня я посмотрю перед лицом врага, 204. Текстти окугула, жөнөкөй жана татаал баяндоочторду тапкыла."},{"t":"h3","h":"КОСМОНАВТИКА"},{"t":"img","src":"data:image/webp;base64,UklGRq4VAABXRUJQVlA4IKIVAABwwgCdASp1AmcBPrVWoUynKSOlq5UYeSAWiWluzPglKzRauVf7zK5q68GZXozH31tOt2KjN+SX6wvGlr18bOrH6HauOOmiqj5fkPuhqiPifHL0/yzGi645e5BwnurxfGSR10FwzwnurxjAeLkxkeJSmtMja8QAO+vADyQT9Fm9y1kC4Cg6bwaHTmyztg9818uTrJeTFuXV3qEzAFNsj/TdgkqQs/qALuPANX4r7btgpP+p2zgoQjaZOEcYGhHiUWsGr3Ls/PEVF68qpr7ZdNRUzraxm193u0gFqMd8I7x46KOVipIkBWdJ+jqIds1AUCrP36TvgECZg0gfSYOEOybTn5C7TlZe3ywIVxaW7jGfDh3VIzxMHI9m+nZqNWIlK2rfhuoFEMdXlqviapRkqBBpBYYsUV2EuOBBHtscje2BmtxLXL/Ra5Xue/5Pf+kghgkFuSRql9ntYJwC1nO0axiu1JxGgcdcv7B8n9BRq2xUmY7s62qpZD4T0EnBm4eWA3ef2PBy3mtIrtb6jk9arsu3G+1ly/tQsq9bY/xXea5bhLpwocgmY4sJ9DTq1lpE1SpdIbCTg1g2XepuOa1qs/poc5drgvHkJ96Be2 илдөөчү приборлору, эмгектери жогору баалангандыктан «Фобос» жана «Венера-Галилей» аттуу Эл аралык китепке киргизилген."},{"t":"p","h":"Ал эми кыргызстандык космонавт – Салижан Шарипов 1998- жылы 22-январда АКШнын «Шаттл» космостук кемеси менен космоско учкан. Ал 2-февраль күнү жерге аман-эсен кайтып келген. Биринчи кыргыз космонавты С. Шарипов «Ак шумкар» өзгөчө белгиси жана Кыргыз Республикасынын Баатыры деген наамы менен сыйланган."},{"t":"v","l":["® изилдөө – исследовать","биргелешип – совместно"]},{"t":"p","h":"космос сырлары – космиче-"},{"t":"v","l":["ские тайны","жердеш – земляк","баалануу – оцениваться","ачылыш – открытие","автордук укук – авторское право"]},{"t":"p","h":"«Эмгектеги артыкчылык меда-"},{"t":"v","l":["лы» – медаль +За трудовое","отличие»","Эл аралык – международный"]},{"t":"p","h":"205. Жогорку сөздөрдү пайдаланып, сүйлөмдөрдү толуктап жазып, баяндоочтордун астын сызгыла."},{"t":"p","h":"1. Космонавттар аалам мейкиндигинин ... чоң салымын кошуп жатышат. 2. Бүткүл дүйнөлүк окумуштуулар ... космоско ... жүргүзүшкөн. 3. ... ... бардык изилдөөчүлөрдү кызыктырган. 4. Биздин... Ж. А. Сургеев башкы конструктор болгон. 5. Ал ондогон „. жасап, ... ээ болгон. 6. Конструктордун космос жөнүндөгү ... жогору ... 7. Анын эмгектери... .„.китепке киргизилген."},{"t":"p","h":"8. Таланттуу конструктор ... ... ... менен сыйланган."},{"t":"v","l":["“хм","1. Текст боюнча маек түзүп келгиле.","2. Жаңы сөздөрдү жаттагыла жана пайдалангыла,","3. Тексттен кандай жаңы маалыматтарды ала алдыңар?"]}],"sub":[{"title":"КОСМОНАВТИКА","b":16}],"section":"ПТ ЧЕЙРЕК","pages":[101,102]},{"title":"§ 60. Баяндоочтун курамына карай бөлүнүшү —","blocks":[{"t":"h3","h":"§ 60. Баяндоочтун курамына карай бөлүнүшү —"},{"t":"v","l":["Классификация сказуемых по составу","Кыргыз тилинде баяндооч","да езунун курамына карай,","Сказуемое в кыргызском"]},{"t":"p","h":"языке как и подлежащее деээ <span class=\"pg\" data-n=\"103\">103<\/span>сыяктуу жөнөкөй лится по своему составу на жана тутумдаш баяндооч болуп бөлүнөт."},{"t":"p","h":"Жөнөкөй баяндооч бир сөздөн турат. Ал жөнөкөй сөз да, татаал сөз да болушу мүмкүн."},{"t":"p","h":"простое и составное."},{"t":"p","h":"Простое сказуемое состоит из одного слова, которое может быть как простым, так и сложным."},{"t":"p","h":"М исалы: Ак куу жазында түндүктү көздөй учту. Тутумдаш баян- Составное сказуед ооч аткарган кызматы боюнча эки же андан ашык сөздөрдүн ажырагыс тизмегинен турат."},{"t":"p","h":"мое состоит из неразложимых по функции словосочетаний двух или более слов."},{"t":"p","h":"М ы: Комузчулук өнөр күндөн күнгө гүлдөп өнүгүп жатат."},{"t":"p","h":"206. Экинчи катардагы кыймыл-аракетти билдирген сөздөрдү биринчи катардагы сүйлөмдөргө тууралап байланыштыргыла."},{"t":"p","h":"1. Биз А. С. Пушкиндин «Руслан менен 7 тартылууда Людмила» поэмасын ...."},{"t":"p","h":"2. Окумуштуулар табияттын маанилүү Л жазып жатат мыйзамдарын ...."},{"t":"p","h":"3. Майрам күндөрү ат чабыш оюну..."},{"t":"p","h":"4. «Кыргызфильм» киностудиясында кызыктуу мультфильмдер ..."},{"t":"p","h":"5. Студенттер дипломдук ишин...."},{"t":"p","h":"6. Илимий конференцияга чет элдик оку- у-"},{"t":"v","l":["катышты"," окуп жатабыз","","&amp; изилдешет","өткө] рулуп тура т"]},{"t":"p","h":"207. Тексттен төмөнкү сөздөргө маанилеш сөздөрдү таап, аларды катыштырып сүйлөм түзгүлө."},{"t":"v","l":["1. аалам мейкиндиги —","2. абдан жакшы окуу —","3. алгачкы учкуч -","4. спорт менен машыгуу —","5. көрүнүктүү -","6. баатырдык —","Т. даража берилген —","8. ой-тилегиң ишке ашсын —"]},{"t":"p","h":"208. Жөнөкөй жана тутумдаш баяндоочторду өз-өзүнчө топторго бөлүп жазгыла:"},{"t":"v","l":["","т","учуп жетуу, жазуу, бара","С","турушат, жылый баштады,"]},{"t":"p","h":"угушат, тыншадык кайтып келе жатат, ырдады, ту үп кетти, сүрөттөп берди, окўй?:"},{"t":"p","h":"<span class=\"pg\" data-n=\"104\">104<\/span>209. Суроолорго жооп бергиле да, сүйлөмдүн баяндоочун тапкыла."},{"t":"p","h":"1. Ким уккулуктуу ырдайт? – 2. Сен космос илимине кызыгасыңбы? – 3. Силердин класстын окуучулары эмне кылып жатышат? – 4. Космонавт кандай милдет аткарат?"},{"t":"v","l":["5. Дарыгер эмне менен алек болуп жатат?","6. Дем алышта эмне иш аткарасың?","—1 204-көнүгүүдөгү текст боюнча монолог түзүп келгиле."]}],"sub":[],"section":"ПТ ЧЕЙРЕК","pages":[103,104]},{"title":"§ 61. Көнүгүүлөр – Упражнения","blocks":[{"t":"h3","h":"§ 61. Көнүгүүлөр – Упражнения"},{"t":"p","h":"210. Төмөнкү сүйлөмдөрдү жазгыла да, жөнөкөй жана тутумдаш баяндоочторду тапкыла."},{"t":"p","h":"1. Элнура Түркияга саякатка кетти. 2. Мен досумду театрга барууга чакырдым. 8. Чоң энемдин сыйкырдуу жомогун унута албаймын. 4. Өзүңдөн кичүүлөрдү таарынтууга болбойт. 5. Көптү билүү үчүн, көп окуу керек. 6. Жайында көлгө түштүм, күнгө күйдүм. 7. Кечинде балдар спорттук аянтка чогулушту."},{"t":"p","h":"211. Текстти окугула, сөздүктүн жардамы менен түшүнүксүз сөздөрдү которгула."},{"t":"p","h":"– Элге эр кымбат. Эрге эли менен жер кымбат. Анын баарына туюлбаган өнөр кымбат. Мен үчүн сиздин күүңүз туюлбаган өнөр, чечилбеген суроо сыяктуу. Сиз мукактанып чертип жатасыз, тарыхы караңгы. Мүмкүн, эчен жылы ушинтип черткендирсиз? Бирок эч ким билбейт. Сизге кыянат болбосо, күүнүн сырын чечип берсеңиз? – дедим."},{"t":"p","h":"– Олда, балам-ай,- деди карыя,- эми болбостур. Сураганыңды ал,— деп оозумдан да чыгып кетти. Бул сыр жетимиш жети жылдан бери чечилген эмес эле. Бул күүнүн башталганы жетимиш жети жыл болду. Анда мен он алтыга араң чыккан элем."},{"t":"p","h":"А. Токомбаев, «Куунун сыры»"},{"t":"p","h":"1. Тексттеги сүйлөмдөрдүн баяндоочторун таап, аларды далилдегиле. 2, Тексттин мазмунундагы негизги ой эмне жөнүндө экендигин аныктагыла:"},{"t":"p","h":"1. Туюлбаган өнөрдүн, чечилбеген суроонун күүсү."},{"t":"p","h":"2. Элге эрдин, эрге эли менен жердин кымбат экендиги."},{"t":"p","h":"3. Жетимиш жылдан бери чечилбеген күүнүн сыры."},{"t":"p","h":"4. Он алтыга араң чыккан баланын сыры."},{"t":"raw","h":"<div class=\"gloss\"><p>—<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"105\">105<\/span>212. 1-катардагы сездердун маанисине жараша 2-катардагы баяндоочторду байланыштыргыла,"},{"t":"v","l":["1. Окумуштуулар ...","2. Майрамдык концерт ...","3. Турак-жайлар...","4. Окуу китептери ...","5. Куунун сыры ...","6. Кызыктуу баяндама ...","жазылган","учурулду","чечилди","жолугушту","башталды","салынган"]},{"t":"p","h":"Текстти окугула, түшүнүксүз сөздөрдү которгула, баяндоочторду көчүрүп жазып келгиле. Болгон окуя боюнча ой жүгүрткүлө. Кыздын колу өзүнүн башын кучактаган бойдон кыймылсыз жатканы көрүнө калды. Төө чала жан болуп, узун мойнун жерге ургулап, буттарын тыбыратып жатыптыр. Мен кызды кучактай жыгылдым."},{"t":"p","h":"– Мына, балам, бул муңканган күү ошондон бери жолдош болуп келе жатат. Бул күү өзүм менен бирге эс алат, Эми өзүм менен бирге жатат. Күүнүн сыры ушул, балам! – деди."},{"t":"p","h":"А. Токомбаев, «Кццнцун сыры»"}],"sub":[],"section":"ПТ ЧЕЙРЕК","pages":[105,105]},{"title":"§ 62. Текст менен иштөө – Работа над текстом","blocks":[{"t":"h3","h":"§ 62. Текст менен иштөө – Работа над текстом"},{"t":"p","h":"213. Текстти окугула, сүйлөмдөрдүн баш мүчөлөрүн тапкыла, берилген сөздөрдүн тушуна орусчасын жазгыла."},{"t":"h3","h":"КОЖОЖАШ"},{"t":"p","h":"Кожожаш – кыргыздын кытай уруусунан чыккан Карыпбай дегендин баласы болгон. Ал кичинесинен эле чырпыктан мыкты мерген болуп чы- гат. Жыйырма түтүн эл жаа, чийден ок жасап, мылтык менен алышып 16 жашынан тартып эле \"И М Г н Т чоңойгон. Кожожаш 15— /"},{"t":"img","src":"data:image/webp;base64,UklGRnYdAABXRUJQVlA4IGodAAAwGgGdASqnAWUBPqlKm0mmM6kmtRVLWnAVCWluGVAZX3PW6LbHxQeYzBby+ZNU9LRnLz0/jf+P1L/97+u3NvIzzF/+Hof+Of9utkb75RdefOmlzKnboyi1djpJd1FDNmULyzZntZDqHTrjZKIImjQj4tZYknMLOhzZlb9ANXNFL8+lq6g/vUNeeKfXoQRitUNXNr9I/FR9xIJVHaY1U34Dk6M+0qrXdzYLv456Le0a1UnXbzstkhtneaP5byynt/2ofEKhnh04U7wm0hOcJJOa/L4Po3RryRCaVr1s/bn1VmWE5EE/5/KdpQUaJr32I4RL73gw+GBqIk7a/4xg9IaNkVzHrGDuHuOBk8zaArUN2qZoRktdyMGP7Lq8vFAZuRi2Cc7FAPtiyLRDd5ypvDb/WrQXiXJD4uOYUKX9O2exan/jatwsJwpTQ7y2psUeWZhEjfD9GHhI н анын тукумун кырбай калтырууну суранат. Бирок мергенчи Сур эчкинин өтүнүчүн кабыл албайт. Анын тукумун кырып салат да, Сур эчкинин каргышына калат. Мергенчи аны тирүүлөй кармап алмакчы болот. Сур эчкинин артынан кууп жүрүп, акыры Кожожаш аскада камалып калат."},{"t":"raw","h":"<div class=\"tbl\"><table><tr><td>© уруу-<\/td><td>жан сактоо —<\/td><td>каргышка калуу —<\/td><\/tr><tr><td>чырпык —<\/td><td>мергенчи —<\/td><td>тирүүлөй калуу —<\/td><\/tr><tr><td>чий —<\/td><td>кайберен —<\/td><td>аскада камалуу —<\/td><\/tr><tr><td>аманчылыгын<\/td><td>үркүп качат —<\/td><td>тукумун кыруу -<\/td><\/tr><tr><td>тилеп —<\/td><td>мергенчилик —<\/td><\/tr><\/table><\/div>"},{"t":"p","h":"214. Тексттен алынган жөнөкөй жана тутумдаш баяндоочторду өз-өзүнчө топторго бөлгүлө:"},{"t":"p","h":"болгон, алышып чоңойгон, болуп чыгат, келип туруп калышкан, тилеп, жан сакташкан, баккан, калбай үркүп качат, калат, кырбай калтырууну суранат, кабыл албайт, кырып салат, калат, кармап алмакчы болот, кууп жүрүп, камалып калат."},{"t":"p","h":"215. Тексттин мазмуну боюнча төмөнкү суроолорго жооп берүү менен эки-экиден маектешкиле."},{"t":"v","l":["? 1. Кожожаш кимдин баласы болгон?","2. Ал кичинесинен эмне менен алек болгон?","3. Кожожаш кандай мерген болуп чыгат?"]},{"t":"p","h":"4. Эмне себептен жыйырма түтүн эл Кожожаш менен бирге жашап калган?"},{"t":"v","l":["5. Алар кайсы жерде тиричилик кылышкан?","6. Кожожаш элин эмне менен баккан?"]},{"t":"p","h":"Т. Эмне үчүн Кожожаш Сур эчкинин каргышына калган? 216. Тексттин мазмунуна туура келбеген сүйлөмдөрдү тапкыла, 1. Кожожаш – кыргыздын мыкты мергени болгон. 2. Анын атасы Карыпбай кытай элинин уруусунан чыккан. 3. Кожожаш кичинесинен мылтык кармап чоңойгон. 4. Атасы Кожожаш менен бирге мергенчилик кылган. 5. Мергенчи жыйырма түтүн элди кайберендин эти менен гана баккан. 6. Жыйырма түтүн эл Кожожашты колдобой, өз алдынча жашоого умтулган. 7. Кожожаш кайберендин тукумуна кол салган эмес. 8. Сур эчкинин тукуму өзүнөн-өзү кырылган. 9. Элин мергенчилик менен баккан Кожожаш Сур эчкинин каргышына калган."},{"t":"p","h":"<span class=\"pg\" data-n=\"107\">107<\/span>Г] «Кожожаш» эпосунан берилген үзүндүнү окуп, мазмуну боюнча ой жүгүрткүлө,"},{"t":"v","l":["Сур эчки зарлап ыйлады,","Көзүнүн жашын тыйбады:","«Балдарымдын бири жок,"]},{"t":"p","h":"Калган башым соо койбой, 'Өзүмдү кууп кыйнады."},{"t":"v","l":["Барбаган тоом калбады,","Эчкинин берсең тилегин,"]},{"t":"p","h":"Мергендин аскада калсын жандары!» Капаланган Эчкинин,"},{"t":"v","l":["* Кабыл болду тилеги.","Мергендин турган аскасы,","Мелтиреген зоо болуп,","Асманга жакын тирелди.","‚ Кожожаш тиктеп караса","– Асканын орто ченинде,","Каргадай болуп турабы.","Каршында турган Эчкиге,"]},{"t":"p","h":"Мергендин, кайгырып айткан бир жообу:"},{"t":"p","h":"* Акыры келип таштадың, * Күзгүдөй таштын бооруна, Антташып айткан кебиңе, Камалдым келип аскага."},{"t":"p","h":"Эчки, жеттиң го сен да кегиңе. ‚ Сур эчки анда кеп айтат:"},{"t":"v","l":["* Карапайым эмесмин,","Кайберендигим аныкмын."]},{"t":"p","h":"Айтканым укпай жүрчү элең, Эми, мерген кандайсың, Сага мен энелигим тааныттым."},{"t":"p","h":"* Мерген болбой куруп кал, Аскадан түшпөй туруп кал! Атаң менен энеңиз, Көзүнөн жашын тыйбасын Аскада туруп саргайып, ' Арманда өлсүн бир башың. Кайыр кош, мерген, эсен бол, * Кайгы тартып, кесел бол!"},{"t":"raw","h":"<div class=\"gloss\"><p>107<\/p><\/div>"}],"sub":[{"title":"КОЖОЖАШ","b":2}],"section":"ПТ ЧЕЙРЕК","pages":[106,107]},{"title":"§ 68. Көнүгүүлөр – Упражнения","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"108\">108<\/span>§ 68. Көнүгүүлөр – Упражнения"},{"t":"p","h":"217. Сүйлөмдөрдү маанисине ылайык кашаанын ичиндеги баяндоочтор менен толуктагыла (даңазаланат, биригишет, болуп эсептелет, өстүрүп, кеңейтет, изилдөө жүргүзгөн, негиздеген, сезилет, жарата баштаган)."},{"t":"p","h":"1. Исаак Ньютон химия боюнча да ... ‚ металлдардын касиеттерин .... 2. Мультфильм фантазия менен кыялды ..., ички дуйнебүздү ....3. В. А. Моцарт 5 жашынан музыкалык чыгармаларды 4. «Манас» эпосунда адамдык жакшы сапаттар .... 5. Химиялык реакция жургенде женекей заттардын атомдору молекулаларга .... 6. Бешик ырында эненин балага болгон мээрими, сүйүүсү күчтүү .... 7. Жыландын тили – анын сезүү органы .... 218. Варианттардын бирин тандап, сүйлөмдөрдү толуктап җазып, баяндоочтордун астын сызгыла."},{"t":"p","h":"1. Кыргыздар жашоо шартына ылайык боз үйдүн ... түрүн өнүктүргөн."},{"t":"p","h":"а) көтөрмө б) жүктөмө в) оймолонгон 2. Ал кезде Энесайдын боюнда ар кошкон ... эл жашаган."},{"t":"p","h":"а) улут б) кыргыз в) уруу 3. Ата-энеңди сыйласаң, өз ‚. сый көрөсүң."},{"t":"p","h":"а) бир тууганыңдан б) балаңдан в) досуңдан 4.«Ноорузду» ... катары чыдамсыздык менен күтөбүз."},{"t":"p","h":"а) май майрамы б) күз майрамы в) жаз майрамы 5. 1206-жылы ... бүт монгол элинин башчысы болуп калган."},{"t":"p","h":"а) Тимучин б) Македонский в) Манас 219. Макалдарды маанисине карата толуктагыла жана баяндоочторго суроо бергиле, 1. Жазгы суук (Весенний холод до костей про- ок болбойт низывает)."},{"t":"p","h":"2. Уугум, сага айтам, (Тебе унина моя, говорю, атың барда ты, сын мой, слушай). жер тааны 3. Өткөн ишке (Что было, то прошло и быльем жандан өтөт поросло)."},{"t":"p","h":"4. Мылтык болбой, (Без ружья нет пули (она уулум сен ук ни к чему)."},{"t":"p","h":"5. Атаң барда эл тааны, (Когда у тебя есть отец, өкүнбө. познай народ, пока у тебя есть конь, познавай землю) <span class=\"pg\" data-n=\"109\">109<\/span>220. Берилген сөз айкаштары менен җөнөкөй жана тутумдаш баядоочторду катыштырып сүйлөмдөрдү түзгүлө."},{"t":"p","h":"1. Алтын күз"},{"t":"v","l":["2. Тартиптүү окуучу","3. Жылдызы жарык","4. Табият сулуулугу","5. Биринчилик үчүн аракет","6. Илимий окумуштуу"]},{"t":"p","h":"1 219-көнүгүүдөгү макалдарды жаттап, маанисин түшүндүргүлө,"}],"sub":[],"section":"ПТ ЧЕЙРЕК","pages":[108,109]},{"title":"§ 64. Өтүлгөн материалдар боюнча алган билимдерин","blocks":[{"t":"h3","h":"§ 64. Өтүлгөн материалдар боюнча алган билимдерин"},{"t":"p","h":" анып чыккан мөөнөт жыл деп аталат. Жер өз огунун айланасында толук бир жолу айланганга кеткен убакыт сутка деп аталат. Бир жылда болжол менен 365 !/, сутка болот. Жер шары уюлдарында азыраак жалпайып турат. Күндүн нуру Жерди ар кандай жарык кылып турат. Ошондуктан Жерде жыл мезгилдери алмашып турат. Жаздан кийин жай, андан соң күз менен кыш келет. Жердин үстүнкү катуу катмары жер кыртышы деп аталат. Жер кыртышы – таштуу катмар деп аталат. Жер астындагы суулар – Жердин суу катмарын түзөт."},{"t":"p","h":"Жердин аба катмары атмосфера деп аталат. Ал азот жана кычкылтектен турат."},{"t":"p","h":"Адам жаратылыш байлыктарын акыл-эстүүлүк менен пайдаланышы керек. Бизди курчап турган чөйрөнү – аба, суу, топуракты булгануудан сактоо зарыл."},{"t":"p","h":"Мектеп окуучулары учун энциклопедиядан 227. Суроолорго жооп берүү аркылуу эки-экиден маектешкиле."},{"t":"p","h":"1. Жер кандай планета?"},{"t":"v","l":["2. Ал Күндү кандай айланып жүрөт?","3. Кандай мөөнөт жыл деп аталат?","4. Кандай убакыт сутка деп аталат?","5. Эмне себептен жыл мезгилдери алмашып турат?"]},{"t":"p","h":"<span class=\"pg\" data-n=\"112\">112<\/span>6. Жердин үстүнкү катмары эмне деп аталат?"},{"t":"p","h":"Т. Жердин аба катмары эмне деп аталат?"},{"t":"p","h":"8. Жаратылыш байлыктарына кандай мамиле кылышыбыз керек?"},{"t":"p","h":"228. Биринчи катардагы сүйлөмдөргө экинчи катардагы сөздөрдү маанисине жараша тууралап койгула."},{"t":"p","h":"1. Жер Күндү толук бир жолу айланып чык- убакыт-мөөнөт кан жыл деп аталат."},{"t":"p","h":"2. Жердин үстүнкү ... катмары жер кыртышы бекем-катуу деп аталат."},{"t":"p","h":"3. Жер шары уюлдарында азыраак ... турат. жантайыпжалпайып 4. Бир жылда болжол менен 365 4/1 ... болот. кун-тун- сутка. г Бизди курчап турган чөйрөнү булгануудан кантип сактайбыз, үйдөн аңгеме түзүп келгиле."},{"t":"h3","h":"§ 66. Көнүгүү, машыгуу иштери, сөз өстүрүү — Упражнение, приобретение навыков и развитие речи"},{"t":"p","h":"229. 1. Текстти окуп, сүйлөмдөрдүн баш мүчөлөрүн тапкыла."},{"t":"h3","h":"ДҮЙНӨ ЭЛДЕРИ"},{"t":"p","h":"Жер жүзүндө 5 миллиарддан ашуун адам жашайт. Алар ар түркүн элдерге бөлүнүшөт. Калкынын саны 100 миллиондон ашкан элдер да бар. Мисалы, ага кытай, орус, япон, бенгалдар кирет. Немец, француз, итальяндар ондогон миллионду түзөт. Өтө аз сандагы элдер да бар, Болжолу, алардын эң эле азы – Филиппиндеги тасадай уруусу. Алар бар болгону ЗОдай эле киши, тоо үңкүрлөрүндө жашап, аңчылык кылышат. Ошондой эле жапайы өсүмдүктөрдү терип жешет."},{"t":"p","h":"Дүйнө жүзүндө көп жана аз калктуу 2 миңдей эл жашайт. Алардын тилдери ар башка, үрп-адаттары да ар түрдүү. Алар бири-биринен сырткы көрүнүшү боюнча да айырмаланышат."},{"t":"p","h":"Элдердин көпчүлүгү өз эне тилинде сүйлөшөт. Бардык элдер биригип адамзатты түзөт. Адамдар тынчтыкты каалашат. Алар бакубат турмушта жашоого умтулушат, келечек муун үчүн кам көрүшөт."},{"t":"p","h":"Мектеп окуучулары учун энциклопедиядан © тасадай уруусу – род, племя тасадай, үңкүр – пещера"},{"t":"v","l":["<span class=\"pg\" data-n=\"113\">113<\/span>аңчылык кылуу – заниматься охотой","жапайы өсүмдүктөр – дикие растения","үрп-адаттар – обычаи","сырткы көрүнүш – внешний вид","айырмаланышат – отличаются, различаются","бакубат турмуш – мирная жизнь"]},{"t":"p","h":"230. Жогорку жаңы сөздөрдү пайдаланып, берилген сүйлөмдөрдү толуктап, алардын баяндоочун тапкыла, 1. Мергенчилер Сары-Жазга ...... кетишти. 2. Дүйнө элдери- НИН ... ... ар түрдүү. 3. Адамдар... ... боюнча да... 4. Филиппиндеги ... ... саны абдан аз. 5. Тоо ... жашаган адамдар да бар экендигин билдик. 6. Тынчтык элдери ...... жашашат."},{"t":"p","h":"231. Берилген суроолуу сүйлөмдөр аркылуу эки-экиден маектешкиле, 1. Жер жүзүндө канча адам жашайт?"},{"t":"v","l":["2. Өтө аз сандагы элдерге кайсы уруу кирет?","З. Ал уруудагы адамдар кайсы өлкөдө жашашат?","4. Алар кандай тиричилик менен күн көрүшөт?"]},{"t":"p","h":"5. Дүйнө элдери бири-биринен кандай айырмаланышат? 232. Кашаанын ичиндеги сөздөрдү туура формада пайдаланып, сүйлөмдөрдү толуктагыла."},{"t":"p","h":"1. Англичандар менен америкалыктар (англис) сүйлөшөт."},{"t":"p","h":"2. Дүйнө элдери тынчтыкта бакубат турмушта (жашоо) умтулушат."},{"t":"p","h":"3. Кун-Галактиканын (жылдыздар) бири. 4. Байыркы гректер эң маданияттуу (элдер) болушкан. 5. Күрөң аюу Европа, Азия жана (Түндүк Америка) мекендейт. 6. Бамбук нымдуу, ысык (өлкөлөр) өсүмдүгү."},{"t":"p","h":"1 Жаңы сөздөр менен сүйлөм түзүп келгиле,"}],"sub":[{"title":"ЖЕР","b":7},{"title":"§ 66. Көнүгүү, машыгуу иштери, сөз өстүрүү — Упражнение, приобретение навыков и развитие речи","b":23},{"title":"ДҮЙНӨ ЭЛДЕРИ","b":25}],"section":"ПТ ЧЕЙРЕК","pages":[111,113]},{"title":"§ 67. Ээ менен баяндоочтун ээрчишүүсү —","blocks":[{"t":"h3","h":"§ 67. Ээ менен баяндоочтун ээрчишүүсү —"},{"t":"p","h":"Согласование подлежащего со сказуемым Кыргыз тилинде баяндооч грамматикалык жактан ээге баш иет жана алар өз ара жак жана сан боюнча ээрчишет."},{"t":"p","h":"В кыргызском языке сказуемое грамматически подчиняется подлежащему и согласуется с ним в лице и числе. М и сал ы: Мен жетинчи класста окуймун. Сен он уч жаштасың. Ал сабакты жакшы билет. Биз жайында Ысык- Көлдө эс алганбыз. Силер ата-энеңерге жардам көрсөтөсүңөр. Алар майрамдык салтанатка келишет."},{"t":"raw","h":"<div class=\"gloss\"><p>ш)<\/p><\/div>"},{"t":"p","h":"<span class=\"pg\" data-n=\"114\">114<\/span>Орус тилинен айырмаланып, кыргыз тилинде ээ менен баяндоочтун ортосундагы сан боюнча ээрчишүү болбой калышы да мүмкүн."},{"t":"p","h":"В кыргызском языке, в отличие от русского, согласования подлежащего со сказуемым в числе может и не быть."},{"t":"p","h":"М исал ы: Дарактар көгөрдү. Жер-жемиштер бышты. Бул жерде дарактар, жер-жемиштер деген ээ көптүк санда, ал эми көгөрдү, бышты деген баяндоочтор жекелик санда турат."},{"t":"p","h":"Здесь подлежащие дарактар, жемиштер во множественном числе, а сказуемые көгөрдү, бышты в единственном числе, Салыштыргыла (сравните): Деревья позеленели, ягоды поспели."},{"t":"p","h":"Айрым учурда ээ менен баяндоочтун ортосундагы сан боюнча ээрчишуу факультативдүү мунезде болушу да мумкун."},{"t":"p","h":"Иногда согласование подлежащего со сказуемым в числе может носить факультативный характер."},{"t":"p","h":"Мисалы; Окуучулар келишти // Окуучулар келди."},{"t":"p","h":"Балдар ойношту Балдар ойноду."},{"t":"p","h":"233. Сүйлөмдөрдү көчүрүп жазып, орус тилине которгула, Ээ менен баяндоочтун астын сызгыла. Алардын жак жана санын аныктагыла."},{"t":"p","h":"1. Мугалим сабакка кирди. 2. Самат эртең айылга кетет. 3. Мен шаарга бардым. 4. Ал иштеп бүттү. 5. Мен быйыл сегизинчи класста окуймун. 6. Сен өз убагында келдиң. 7. Апам ооруканада иштейт. 8. Биз жазуучулар менен жолугуштук. 9. Элдер бул аңгемени кызыгуу менен угушту."},{"t":"p","h":"234. Маекти каармандаштырып окугула жана ээ менен баяндоочтун ээрчишүүсүн аныктагыла."},{"t":"p","h":"А й ган ы ш: – Сен сабактарыңды окуп бүттүңбү?"},{"t":"p","h":"К ы ял:- Үй тапшырмалар көбүрөөк берилиптир. Мен жетише албай жатамын."},{"t":"p","h":"А йган ы ш: – Сен тапшырмаларынды аткара бергин. Апам экөөбүз базарга барып келебиз."},{"t":"v","l":["К ы ял: – Атам үйдө калабы?","А йган ы ш: – Жок, ал чоң атамдыкына барат."]},{"t":"p","h":"К ы ял: – Кечинде филармонияга концертке барабызбы?"},{"t":"p","h":"<span class=\"pg\" data-n=\"115\">115<\/span>А йган ы ш: – Кайсы ырчынын концерти болот экен? Кыял: – Эстрада жылдызы Мирбек Атабековдун майрамдык концерти болот экен."},{"t":"p","h":"А йган ы ш: – Анын алгачкы ыры эмне деп аталат? К ы ял: – Ал, эң биринчи «Жүзүң» аттуу ырды сахнага алып чыккан."},{"t":"p","h":"Айган ы ш: – «Жылдын мыкты ыры» деген номинацияга кайсы ыры ээ болду эле?"},{"t":"p","h":"К ы я л: – Чон энесин эскерүүгө арналган «Алтын энем» деген ыр чоң ийгиликке жетишти. Бүгүн Мирбек Атабеков Кыргызстандын белгилүү, таланттуу аткаруучусу."},{"t":"p","h":"235. Текстти окугула, сүйлөмдөрдөгү ээ менен баяндоочтун ээрчишүүсүн түшүндүрүп бергиле."},{"t":"h3","h":"МУЗЫКАНЫН ТААСИРИ"},{"t":"p","h":"Музыка адамга чоң таасир тийгизет. Ал адамдын ички сезимине кубаныч алып келет. Адамды чарчоодон жана капалыктан арылтат. Өтө жагымдуу обон адамдын артериялык кан басымын калыбына келтирет. Ошондой эле жүрөктүн иштешин оңдоп, эмгекке жөндөмдүүлүгүн жакшыртат. Андыктан биз чарчапчаалыкканда жакшы ыр-күүгө кулак төшөйбүз. Назик чыккан музыканы берилип тыңшайбыз, көңүлүбүздү көтөрөбүз."},{"t":"p","h":"236. Берилген сүйлөмдөрдү ээлик милдетти аткаруучу тиешелүү сөздөр менен толуктап, ээ менен баяндоочтун ээрчишүүсүн далилдегиле."},{"t":"p","h":"1. IX кылымдын ортосунан тартып ... өз алдынча мамлекет болуп эсептелет. 2. Тропик өлкөлөрүндө ... ... жыл бою гүлдөп, уругу да быша берет. 3. ... Күнгө, жылдыздарга чейинки аралыкты өлчөй алышат, 4. ....... Атлантика океанындагы аралдарда жайгашкан. 5. Кыргызстандын ... улуттук колориттеги кийимдердин жаңы модаларын жаратып жатышат. 6. Миллиондогон ... дүйнөнүн төрт тарабына саякатка чыгышууда."},{"t":"p","h":"Пайдаланылуучу сөздөр: илимпоздор, модельерлери, туристтер, Франция, Улуу Британия мамлекети, чай бадалы. Г «Мен сүйгөн ырчы» аттуу монолог түзүп, айтып бергиле,"}],"sub":[{"title":"МУЗЫКАНЫН ТААСИРИ","b":25}],"section":"ПТ ЧЕЙРЕК","pages":[114,115]},{"title":"§ 68. Сөз өстүрүү – Развитие речи","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"116\">116<\/span>§ 68. Сөз өстүрүү – Развитие речи"},{"t":"p","h":"237. Берилген ырды кырааты менен окуп, тилиңерди жатыктыргыла."},{"t":"h3","h":"КИТЕПТИ СҮЙ"},{"t":"v","l":["Китепти сүй, баркын бил,","Китептин көп акылы.","Ким китепке дос болсо,","Ал – ошонун жакыны.","Сүттөй таза тилеги,","Деңиздей кең талабы.","Көктөй тунук, акыйкат,","Анын ар бир барагы.","","Ошондуктан баркын бил,","Кирдебесин бир чети.","Сыя төгүп булгабай,","Жакшы сакта китепти.","А. Осмонов","© баркын бил – цени","кирдебесин бир чети – не марай даже краешка","көктөй тунук – прозрачное, как небо"]},{"t":"p","h":"238. Ырдын мазмуну боюнча суроолорго жооп бергиле. Ээ менен баяндоочтун ээрчишүүсүн тушундургуле."},{"t":"v","l":["1. Силер китепти сүйүп окуйсуңарбы?","2. Ким китеп менен достошо алат?","3. Кандай адам китептин жакыны боло алат?","4. Китептин тилеги кандай?","5. Анын ар бир барагы кандай?","6. Силер китептин баркын билесиңерби?","Т. Китепти жакшы сактоону билесиңерби?","8. Адамга китептин кандай пайдасы бар?"]},{"t":"p","h":"239. Сүйлөмдөрдү кашаанын ичиндеги сөздөрдү туура формада коюп толуктагыла. Ээ, баяндоочторун тапкыла."},{"t":"p","h":"1. Билимдүүлөр акылдын булагы болгон китептердин. (баркын баалай бил) 2. Жакшы китептин ар бир барагы ... ... (көктөй тунук) жана акыйкат."},{"t":"p","h":"3. Силер урунуп жаткан китебиңердин бир четин да ... (кирдебесин) пайдаланышыңар керек."},{"t":"p","h":"4. Биз китепти кантип ... (сактоо) жакшы үйрөнгөнбүз."},{"t":"p","h":"5. Адамдар билим байлыгын китептен ... (алуу)"},{"t":"p","h":"<span class=\"pg\" data-n=\"117\">117<\/span>240. Текстти окугула, тааныш эмес сөздөрдү которгула. Сүйлөмдүн ээ, баяндоочторунун ээрчишүүсүн тапкыла."},{"t":"h3","h":"КИТЕП"},{"t":"p","h":"Жакшы китеп силерди чексиз космос мейкиндигине алып чыгат. Ар кандай маалыматтардын булагы болгон китеп билимиңерди тереңдетет. Китептин пайда болгонуна бир нече миң жыл болду. Бул мезгилдин ичинде анын түрү аябай өзгөрдү. Вавилондуктар жана башка байыркы элдер китепти ылайдан жасашкан. Ал эми Кытайда алгачкы китептер жука бамбук тактачалар түрүндө болгон. Биздин замандын П кылымынан тартып кагазга жаза башташкан."},{"t":"p","h":"Байыркы Египетте таш плиталарга чегип, китеп жазышкан. Кийинчерээк папирусту ойлоп табышты. Египет папирусу ошол кездеги эң мыкты жазуу материалы катары Байыркы Греция менен Римде да дээрлик 2 миң жыл пайдаланылган. XIII кылымдан тартып Европада кагаз негизги жазуу материалы болуп калды. Акыры XV кылымда китеп басуу ойлоп табылды."},{"t":"p","h":"Китеп менен дос болгула, ал силерге билимдин бардык кенчтерин ачат. Китеп – бул адам баласы жасаган кереметтердин эң баалуусу."},{"t":"p","h":"Жогорку текст боюнча оюңарды айтып бергиле."}],"sub":[{"title":"КИТЕПТИ СҮЙ","b":2},{"title":"КИТЕП","b":12}],"section":"ПТ ЧЕЙРЕК","pages":[116,117]},{"title":"§ 69. Көнүгүү, машыгуу иштери, сөз өстүрүү — Упражнение, приобретение навыков и развитие речи","blocks":[{"t":"h3","h":"§ 69. Көнүгүү, машыгуу иштери, сөз өстүрүү — Упражнение, приобретение навыков и развитие речи"},{"t":"p","h":"241 Төмөнкү сүйлөмдөрдөгү ээ менен баяндоочтун ортосундагы ээрчишүүнү (сан, жак, түр боюнча) ажыраткыла."},{"t":"p","h":"1. Ай дайым Жердин айланасында айланып турат. 2. Акулалар медуза жана майда балыктар менен азыктанат. 3. Мен комузчулук өнөрдү абдан жакшы өздөштүрүүдөмүн. 4. Алар мамлекеттик экзамендерин ийгиликтүү тапшырып жатышат. 5. Ата-бабаларыбыз көчмөн турмушта жашашкан. 6. Ал космос мейкиндиги жөнүндө кеңири маалымат берди. 6. Биз Ч. Айтматовдун чыгармаларын окуп жатабыз."},{"t":"p","h":"242. Берилген сүйлөмдөрдү ээлик милдетти аткаруучу сөздөр менен толуктагыла."},{"t":"p","h":"1. ... эмгек процессинде акырындап табиятты таанып-биле баштады."},{"t":"p","h":"а) коом б) эколог в) адам"},{"t":"p","h":"<span class=\"pg\" data-n=\"118\">118<\/span>2. ... сөз табар, куудул катары эл арасына таанылган."},{"t":"p","h":"а) клоун б) Куйручук в) күлдүргүч 3. ... космоско алгачкы жолду салган."},{"t":"v","l":["а) биз б) ал в) мен","4....- тиричиликтин булагы, ... – ырыскы дарагы.","а) тоо","б) жаратылыш","а) эмгек","б) окуу","в) иш-аракет"]},{"t":"p","h":"5. ... фантазия менен кыялды өстүрүп, ички дүйнөбүздү кеңейтет."},{"t":"p","h":"а) спектакль б) мультфильм в) драма 243. Көп чекиттин ордуна баяндоочтук милдетти аткаруучу жана мааниси жактан туура келүүчү сөздү койгула."},{"t":"p","h":"1. «Кыргызфильм киностудиясында кыркка жакын мультфильм..."},{"t":"p","h":"а) сүрөттөлгөн б) көрсөтүлгөн в) тартылган 2. 1980-жылы Москвада Олимпиадалык оюндар...."},{"t":"p","h":"а) өткөрүлгөн б) башталган в) таанылган 3. Телефон – бул грекче үндү алыска угузуу дегенди ..."},{"t":"p","h":"а) айтылат б) туюндурат в) түшүндүрөт 4. Маймылдар дарактын башында гана жеңил, шамдагай..."},{

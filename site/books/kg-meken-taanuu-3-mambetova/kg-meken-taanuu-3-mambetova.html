 Ырас, көптөгөн кылымдар бою суулар агып топтоло берип, мелмилдеген көлдү жараткан болушу ыктымал. Узундугу 178, туурасы 60 километр, эң терең жери 668 метрге жеткен Ысык-Көл пайда болгончо көп убакыт өткөнү шексиз. Ысык-Көлдүн пайда болушу жөнүндө көптөгөн легендалар да айтылып жүрөт. Алардын бири мындай:"},{"t":"p","h":"Илгери, илгери көлдүн ордунда чоң шаар бар экен. Ушул жерде ай десе айдай, күн десе күндөй сулуу, ашкан акылдуу кыз жашаптыр. Бул кызды Улан жана Санташ деген эки жигит жактырып калат. Экөө кызды талашып, жекеме-жеке чыгып <span class=\"pg\" data-n=\"63\">63<\/span>согушат. Урушта экөө тең өлөт. «Эки жигиттин убалына калдым», – деп сулуу кыз күндүр-түндүр ыйлай бериптир. Ошондо кыздын көз жашынан Ысык-Көл жаралыптыр. Ал эми Улан менен Санташ шамалга айланып, ушул күнгө чейин жоолашып жүрөт экен. Көлдүн суусу болсо кыздын көз жашындай мөлтүр тунук жана туздуу болуп калыптыр."},{"t":"p","h":"Чынында эле көлдө «Улан» жана «Санташ» деген шамал бар. Көлдүн батыш тарабынан соккон шамалды «Улан» деп, ал эми чыгыш тарабынан сокконун «Санташ» шамалы дешет. Бул эки шамалдын багыты бири-бирине карама-каршы келип, жоолашып жаткандай көрүнөт."},{"t":"h3","h":"Эсиңе тут!"},{"t":"p","h":"Көл жээгинде кечке чейин күнгө кактанба! Абайла, ооруп каласың."},{"t":"p","h":"Суроолор жана тапшырмалар."},{"t":"p","h":"1. Ысык-Көлдү картадан көрсөт. 2. Ысык-Көлдүн узундугу, туурасы, тереңдиги канча? 3. Ысык-Көл жөнүндө айтып бер. Суусу кандай, жээгинде эмнелер бар? Сүрөт тарт. 4. Ысык-Көл жөнүндөгү легенданы окуп, түшүнгөнүңдү айтып бер. 5. Ысык-Көл тууралуу дагы кандай жомокторду билесиң? Айтып бер."},{"t":"h3","h":"Кайталоо"},{"t":"p","h":"Суунун жашоодогу маанисин айтып бер. Суунун касиеттерин атап бер."},{"t":"p","h":"<span class=\"pg\" data-n=\"64\">64<\/span>Жаратылышта суунун айланышы тууралуу аңгеме түз."},{"t":"p","h":"Кыргызстандагы булактардын, дарыялардын, көлдөрдүн аталышын дептериңе жаз."}],"sub":[{"title":"Эсиңе тут!","b":4},{"title":"Кайталоо","b":8}],"pages":[63,64]},{"title":"СУУСУ ЖОК ЖЕР – ЧӨЛ","blocks":[{"t":"h3","h":"СУУСУ ЖОК ЖЕР – ЧӨЛ"},{"t":"p","h":"Сабакка карата суроо-тапшырма."},{"t":"p","h":"Чөлдү көрдүң беле? Аны кандай элестетесиң, айтып бер."},{"t":"p","h":"Жерди жашыл түскө келтирген, кызыл-тазыл гүлдөрдө өстүргөн – суу. Жерге, өсүмдүктөргө, жан-жаныбарларга, адамга өмүр берген да суу. Ал эми суусу жок аймакты кандай элестетүүгө болот? Суусу жок жер алыстан эле бозоруп, көрксүз көрүнөт. Суу жок жер чөлгө айланат."},{"t":"img","src":"data:image/webp;base64,UklGRvwsAABXRUJQVlA4IPAsAACwKwGdASqAAs8APq1InUmmJKMhMLRO+MAViWltM6mu9JLp1jvxx2smQxDGehJ9QDfjYzpx7XUtorv/98YeCEat32/329Aj/f1k+9nnv+vno0/7ehQ/9fTv+cJGsOzJzurFt77LrqUoRaRlpX9fEVf63kO2nfQ4NTFQ0ZA8NeBlO0cz52Di9SB7gPPBrzXaTFeXc8B/X1qh9mP/3i21aUH6nrVKLaieE/SRntUU4S0pEAfpIk+t5xesCI7VT08BJo1GitAL76NweD/R/VscPW4UAadFOdV8vTlAPmM//8/91k6mFagDclJB3ULodd13u8SZzmHQTypc6XRJttM/7aH7+xJCumUSLKcOUzjJ8OER4Ur9espzKkN1FqnppTLAJO1i2u65syyDTqt1aj5cNw9aXxbv8sPPOihgIhbK160mKjW8Xat8egkkiY+k8kSpowrkrSdf+rnRoaF8hvg22urvFJ/HTj+m9+UPwtkwq+MUD43f6n2UM7xQuaUSTZkTacKgdHd/WnM2ee/B1Z4c7tfoIGMg5cqVCw+Rl7h1qlIRYlrxxt2ZRpL3pPXzE8yRzqIxwCZ+X0ywGa3PrwltF41kTPrEm/va3TbtZbJC3D/VfCyMgMF1oUQB01KOr779rjm9angS/xEXoOlPABHAbUvdUle/3uYEUDamjU6MUcu7blrUpjTL4EJYXIAGYbISbGA7Iw/9mU4iWiHiXPUu7YQ9TenNlOT06dYa/IEZcfEl82LNrwVwPIUpnmSyeXfTPEW2aofS9wYNczunaBHexHLwrabxA2QL1JNAq8V9TOhHeotX3TDshhsBhoXaRTQqirmZ8H7WvBXteLfaTp+sWcHR7/HOtbTf+T3V0L54Gbt+/wXv3CX4oABo5v3EVWApjMmNFkPiQAOOaD+4B0/UrhpRh9rLEeqcWSNfcZBCovr74RxQNtZuAM15vm5udiA0QHYlVKk8rzLDQtcXg0bU94e2iFtxcRm+1PsZvSSerc2QEwFXYvDV7435Rx3tH0Qt/1Vl6/epxBB6aUyrMiQO9MkIDiri8hCce5OjxJ+qcpYvdBQ7ZrDwDPUAIkR9KJVgPMe5ood9dCaV1BdvfcrQlzHdYj9ZLFoK6iP3XFPr0dhRfctPZg4W7cFJzQVSkO+FarubOHmDVSNGBaby0j5fyYlTt82bXtRiFhiKKvA+IzuVOXdIjS5EIbOIuCjcWckRnIc9U1JGozKphzqFvp4Q7lEKl7dqGi2+KbbVrKSCneettxGyiW/labztov6LJnpCgQwTVwxu89fdBckn30HGeu4elm4MTWabKGduQr/VIKbM+JvISsjGf9A0L5uNYma3L14H37peiaYu5bzgzfdJ6/5hvAnCf/s4TDnyzfP2WQ/l2g2VPjODERVvm17NhcJHvfyZB2TpiZwnYr1sh818+DERRxxGjHrqDYmSjWzjaJC да жамгыр жаабай, күн куйкалагандай ысык тийген жерлер бар. Ал жердин топурагы биздин жердегидей кара же күрөң болбойт. Таманыңдын алдында саргыч тарткан боз кум жатат. Чөл деген – ушул. Бизге коңшулаш Түркмөнстанда эң чоң аймакты ээлеген Кара-Кум чөлү бар."},{"t":"p","h":"<span class=\"pg\" data-n=\"65\">65<\/span>Чөлдүн жаныбарлары ысыкка жана кургакчылыкка чыдамдуу. Алардын бири – төө. Төө бир нече күн суу ичпей, чөп жебей жүрө алат. Бирок тикенди оттосо деле тоюп калат."}],"pages":[65,65]},{"title":"КЫЗЫЛ-КУМ","blocks":[{"t":"h3","h":"КЫЗЫЛ-КУМ"},{"t":"p","h":"Орто Азиянын элдери – өзбектер, кара калпактар, түркмөндөр байыртадан эле чөлдө мал багышат. Кызыл-Кумдун жайыттарында жайы, кышы менен каракүл койлор багылат. Каракүл көрпөлүү койду өстүрүү кыйын иш. Тереңдиги 60-70 метр келген кудук казып, койлорду кудуктун суусу менен сугарышат. Каракүл койдун көрпөсү дүйнөгө таанымал жана абдан баалуу. Кара, бозомук, алтындай саргыч күрөң келген тармал терилер чөлдүн байлыгы болуп саналат."},{"t":"h3","h":"Суроолор жана тапшырмалар"},{"t":"p","h":"1. Чөл кандай жер? Сүрөттөп айтып бер. 2. Чөлдүн жаныбарлары жөнүндө эмне билесиң, айтып бер."},{"t":"p","h":"3. Чөлдү элестетип сүрөт тарт, чөл жөнүндө аңгемелешкиле."}],"sub":[{"title":"Суроолор жана тапшырмалар","b":2}],"pages":[65,65]},{"title":"КЕН БАЙЛЫКТАР","blocks":[{"t":"h3","h":"КЕН БАЙЛЫКТАР"},{"t":"p","h":"Ата Мекендин ак мөңгүлүү тоолору, токойлору, суулары, төрт түлүк малы, түшүмдүү талаалары – ушунун бардыгы жер байлыгы болуп эсептелет."},{"t":"p","h":"Жер Эненин алдында мындан башка да толуп жаткан байлыктар көп. Алар – тоо алдындагы, жер алдындагы байлыктар. Жер көп сандаган түрдүү заттардан турат. Алар тоо тектери деп аталат."},{"t":"p","h":"<span class=\"pg\" data-n=\"66\">66<\/span>Эгер жерди казып көрсөк, үстү жагынан топурак чыгат. Топуракка өсүмдүктөр өсөт. Андан ары карай тереңирээк казганда топурактын астында тоо тектери болот. Тоо тектери көбүнчө катмар-катмар болуп жайгашат (мисалы, кум менен чопо). Кээ бир жерлерде таш түрүндө кездешет. Жерден казылып алынган үчүн алар кен байлык деп аталат."},{"t":"p","h":"Күндөлүк турмушта жана техникада колдонулган көп буюмдарды билебиз. Алар ар кандай. Ошолордун бардыгын адам жасаган жана турмушта колдонушат. Мунун баарын адамдар кайдан алды? Дүкөндө сатылат же завод-фабрикаларда жасалган деп жооп беришиң, мүмкүн. Бирок алар эмнеден жасалды, кайдан табылды? Көрсө, ошолордун көбү кен байлыктардан жасалыптыр. Мисалы, кашык, бычак, ийне, кайчы – темирден, айнек буюмдар – кумдан, чыны, чайнектер – фарфордон, ал эми фарфор кадимки эле чоподон жасалган. Көңүл коюп карасаң, айлана-чөйрөдөгү буюмдардын көбү кен байлыктардан даярдалган."},{"t":"p","h":"Кен байлыктар жердин тереңинде, топурактын астында, аска-зоокалардын жаракаларында же жөн эле жер бетинде кездешет. Адамдар кен байлыкты таап, тазалап, эритип, анан өзүнө керектүү буюмдарды жасап алышат. Мындай жумуштар атайын заводдордо жана комбинаттарда жасалат."},{"t":"p","h":"Адам баласы кен байлыктарды илгерки замандардан бери эле колдонуп келе жатат. Алар адегенде кени бар таштарды башка таштардан айырмалап тааныганды үйрөнүшкөн. Андан кийин аларды отко эриткенди билип алышкан. Бара-бара таштан <span class=\"pg\" data-n=\"67\">67<\/span>таза затты бөлүп алуунун сырын билишкен. Андан идиш-аяк, курал-жарак жана башка түрдүү буюмдарды жасоого жетишкен."},{"t":"p","h":"Байыркы убакта Таластагы Күмүш-Тоодон күмүш алышчу экен. Нарындагы Жетим-Тоодон темир эритүүчү мештин урандысы табылган. Таштан кен ала турган мындай байыркы жасалгалар Кыргызстандын көп жерлеринен табылат."},{"t":"p","h":"Адамдын жашоосунда кен байлыктар зор мааниге ээ. Кум, таш, мрамор, гранит болбосо үйлөр, жолдор, көпүрөлөр курулбайт. Ракеталар, компьютерлер, машиналардын тетиктери, телевизор, телефон, муздаткыч, ошондой эле ар кандай техникалык татаал жабдуулар, так приборлор темир, жез, алюминий, калай, платинасыз жасалбайт. Нефть жок болсо, машиналар жүрбөйт, самолет учпайт. Көмүр жок болсо, кышкысын турак-жайлар жылыбайт. Кен байлыктар колдонулбаган бир да өнөр жайы жок. Кен байлык өлкөнүн байлыгын арттырат. Кыргыз жери ар кандай кендерге бай."},{"t":"p","h":"Суроолор жана тапшырмалар."},{"t":"p","h":"1. Кен байлык кайда болот? 2. Кен байлыктан жасалган буюмдарды атап бер. 3. Үйүңдөгү, класстагы кен байлыктан жасалган нерселердин аттарын дептериңе жаз. Эмнеден жасалганын ойлонуп көр. 4. Кен байлыктын жашоодогу зарылдыгы жөнүндө айтып бер."}],"pages":[66,67]},{"title":"КЕН БАЙЛЫКТЫН ТҮРЛӨРҮ","blocks":[{"t":"h3","h":"КЕН БАЙЛЫКТЫН ТҮРЛӨРҮ"},{"t":"p","h":"Ала-Тоонун булуң-бурчунда ар кандай кендер көп. Түштүгүндө таш көмүр, нефть, газ, сурьма, <span class=\"pg\" data-n=\"68\">68<\/span>сымап, мрамор кездешсе, түндүгүндө калай, коргошун, алтын, темир кендери бар. Ал эми курулуш материалы болгон кум, шагыл бардык жерден учурайт."},{"t":"p","h":"Кен байлыктар касиетине, колдонулушуна карата төмөндөгүдөй түрлөргө бөлүнөт:"},{"t":"v","l":["1. Металл кендери.","2. Металл эмес кендер.","3. Күйүүчү кен байлыктар.","4. Курулушка колдонулуучу кендер.","Суроолор."]},{"t":"p","h":"1. Кен байлыктардын кандай түрлөрү болот? Атап бер. 2. Сен жашаган аймакта кандай кен байлыктар бар? 3. Кен байлыктын түрлөрүн салыштырып көр."},{"t":"p","h":"Тапшырма."},{"t":"p","h":"Өзүң жашаган аймактагы кен чыккан жерге саякат жасап, ал кен кайсы түргө кирерин аныкта, эмнеге колдонуларын сурап бил."},{"t":"p","h":"Практикалык иштер."},{"t":"p","h":"1. Кен байлыктар менен таанышуу. Темир, коргошун, туз, акиташ, таш көмүр, чым көңдү карап чык, атын ата, металл жана металл эместерди, курулушка керектөөчүлөрдү өз-өзүнчө бөлүп кой. 2. Кен байлыктардын түзүлүшүн аныкта. Катуубу же жумшакпы, тунукпу же күңүртпү, түсү кандай? Күйөбү же күйбөйбү? Эмнеге колдонулат? 3. Курулуш материалдарын (чопо, гипс, акиташ, мрамор, гранит) карап көр, бири-бири менен салыштыр. Айырмасын белгиле. Кайда колдонуларын айтып бер. 4. Кум менен чопону салыштыр. Касиеттерине, өзгөчөлүктөрүнө көңүл бөл, чоподон идиш <span class=\"pg\" data-n=\"69\">69<\/span>жаса. 5. Чым көң менен таш көмүрдү салыштыр. Айырмачылыгын аныкта. 6. Бор, акиташ, мраморду карап көр. Окшоштугун жана айырмачылыктарын байка."}],"pages":[68,69]},{"title":"КУМ МЕНЕН ЧОПО КАНТИП ПАЙДА БОЛОТ?","blocks":[{"t":"h3","h":"КУМ МЕНЕН ЧОПО КАНТИП ПАЙДА БОЛОТ?"},{"t":"p","h":"Жаратылышта кездешүүчү гранит сыяктанган бек жана катуу таштар күндүн нурунан, жаан-чачындын, шамалдын, жаныбарлар менен өсүмдүктөрдүн таасиринен талкаланып майдаланат. Жаан-чачын эзип эритсе, шамал үйлөп сапырат. Күн ысыганда таштар да ысыйт, күн суукта муздайт. Ошентип, ташта көзгө көрүнбөгөн жаракалар пайда болот. Чаң, суу толуп, жаракалар ого бетер чоңоет. Ташка өскөн чөптүн тамырлары майда жаракаларды кеңейтет. Акырында таштар туруштук бере албай жарылып, талкаланат."},{"t":"p","h":"Сен көрүп жүргөн шагыл таштар ушинтип майдаланган. Аларды эч ким талкалап сындырган эмес. Таш андан ары майдалана берип, акыры кумга айланат."},{"t":"p","h":"Кум курулушка абдан керек. Ал кеңири тараган кен байлык. Цементке да кум кошулат. Кумдан айнек жасалат. Айнек заводдо айнек идиштер, үйдүн терезелери, күзгү даярдалат. Бишкек, Токмок шаарларында айнек заводу бар."},{"t":"p","h":"Кумду шар аккан суулар агызып, шамал учуруп, ого бетер майдалайт. Ал бара-бара упадай майдаланып, чопого айланат."},{"t":"p","h":"Чопо көбүнчө ак, агыш, боз, кызыл түстө болот. Кыргызстандын аймагында чопонун ар кандай түрлөрү көп кездешет."},{"t":"p","h":"<span class=\"pg\" data-n=\"70\">70<\/span>Чопону нымдаса камырга окшоп жуурулат, чойсо үзүлбөй чоюлат. Кум менен чопону адамдар эзелтен бери үй курууда жана башка курулуш иштеринде кеңири пайдаланып келе жатат."},{"t":"p","h":"Практикалык иш."},{"t":"p","h":"1. Ак кагазга кум себеле. Кумду карап көр. Андагы майда бөлүкчөлөр ар кандай түстө экенин байкадыңбы? 2. Кумду суу менен нымдап, тоголокто. Кум тоголоктошуп бириктиби? 3. Чопону майдалап, ак кагаздын бетине себеле. Чопонун майда бөлүкчөлөрүн кум менен салыштыр. Кумдан кандай айырмасы бар?"},{"t":"p","h":"Суроолор жана тапшырмалар."},{"t":"p","h":"1. Кум, чопо кантип пайда болот? 2. Таштар кандай күчтөрдүн таасиринен талкаланат? 3. Силер жакта шагыл, кум, чопо барбы? 4. Кум эмнеге колдонулат, кумдан эмне жасалат? 5. Чоподон эмне жасалат? 6. Кум менен чопонун түсүн байка, нымдап көр, салыштыр. Сүрөттөп айтып бер. 7. Үйүңдөгү, мектептеги кумдан, чоподон жасалган буюмдардын аттарын жаз. Сүрөттөп айтып бер."}],"pages":[70,70]},{"title":"ТАШ КӨМҮР","blocks":[{"t":"h3","h":"ТАШ КӨМҮР"},{"t":"p","h":"Таш көмүрдү карап көр. Ал кандай түстө? Сынабы? Таш көмүрдүн түсү кара, таштай катуу, бирок сынат. Эгерде жакшылап карасаң, андан жалбыракка, сабакка окшогон тактарды байкоого болот. Таш көмүр кени байыркы доорлордогу чытырман токойлордун топуракка көмүлүп калышынан пайда болгон."},{"t":"img","src":"data:image/webp;base64,UklGRugmAABXRUJQVlA4INwmAADwUgGdASoZAqsBPrVOnksnLC0qLvPbcaAWiWltTacE2YkNg5ZVUOh9tfzP+4cqzKe6X2Iu0vOq8xdodo4/8Hk8F4UIvDiNfBHjD+O/6n/7/5/aOf6v8P04daffzlV5if/30L/Ff+rXht/+JjXeZyYHtTSDlqKP6Tc7fn7dnnHaA3obWP7CXPXyNHU/tKPo8zTtT9fCI1rcdEaMfhQ8lzNM0ZTp8srvxTUga1uuSkdvVz1pztPOYaoMO38crTBRbQmUoWzXcihw8huDuNDYzQXIxsr6WwdpUdfxdme5TnIUl9Qi6NrplpYEwiaOpkCP3fI26fayshPXxrQsufVjcFcr67msXBae3CMHHLPlWdkFaPyyNuJVgQkSaCGxJC4r9erX7CdjiBDuCn1lcQmKR42qcsTmQIWnKvNAz3ShJGIH79cVZEXGA0Xrhdca73c0KdGGiDDddTKxUkQ4qtWp1YnpVS5K4gomhWCy184t8BnP/YHAOQcyPKbywX3K0pBls3GrpjOiABOPQqr8CUCVgtI+eRyPDdeVAvSHvCL8dHlQMdliVU9JptkrumNNQRERPrewQjsgr7OVECVz9BsFTYO8iVAnnyeZe/m93GrbILf7vEJXiuJzfcn9Kt+N4IBegt12cT6U2bqnvpGoSn2c1YCJb1q0iS+mlQcT5fzp1dRJF7fjGzHNe89OooPOURYx3uZ29yzRHKGu8dEv1+aWIn6dAVKxDlx0WeyU5e7uKfUrAlXBMS2HCCyPzZEvM6SdtkmI6uKvkCWj0+2b9xJTT0YYPmyBowBhuZrH94zf9eSrCSXiY7clUj2ylBpCkYW2KlBVfZI4RJ1d3nhtqEBzroU5QZ7PdkEWtRNuLiSTqsDQgn8jachgzBwNEn62e1yHTNqrG+VXHKiMlA+/UOzq4U4Lso3rtne7EK0XeuIL+eMEFBtdRoyPajBETC5qfv1KsTvMR4rJeGdXsDKML9vtMWUooEvuW/Q09zEICExYvxLhma4zeDYPpx6bbjysFwAWJ7JdfLGmLPHBdyr8hx895dz/ZUOA1Esn0QtJNwKv4HiJD4jjda8mKtfhldkf5LaTgrHTihpQY9disxV8qkFNIwtaO1ywYZzYRMfcncWHiRrX2D0nqK44 GtFTUceeoB9eXSsQX0b6QcPUpNXf/FMmriGMh8FBidK6yQZIggVkjVF3AQGf4Ax+rdjMtuxI6Trs2a0ACP1QFe9YAV0FVImWbCnA8GUmuAxlkVjrUngBtLWgUAAAAAA=","w":537,"ht":427},{"t":"p","h":"Таш көмүрдүн негизги касиети – анын отко күйгүчтүгү. Жыгач отунга, көңгө караганда таш көмүр <span class=\"pg\" data-n=\"71\">71<\/span>үйдү жакшы жылытат. Андан тышкары, таш көмүрдөн боек, дары, пластмасса жана башка ар кандай заттарды алууга болот."},{"t":"p","h":"Ата Мекенибиз таш көмүргө бай. Таш көмүрдүн кени Таш-Көмүрдө, Кызыл-Кыяда, Сүлүктүдө, Миң-Кушта, Кара-Кечеде, Көк-Жаңгакта жана башка да көп жерлерде бар. Бирок таш көмүр кендери абдан тереңдикте орун алгандыктан, казып алуу үчүн шахталарды курууга туура келет. Жердин алдында узун-туурасынан кеткен үңкүрлөрдү казышат. Бул шахта деп аталат. Ал эми көмүр казгандарды – шахтер дешет."},{"t":"p","h":"Шахталар электр менен жарык кылынат. Ар дайым таза аба жиберилип желдетилет. Оор иштердин көбү машина менен аткарылат. Көмүрдү кертип казып алып, вагонеткаларга жүктөп, жер бетине чыгарып турушат. Кыргызстанда Таш-Көмүр деп аталган шаар бар."},{"t":"p","h":"Суроолор жана тапшырмалар."},{"t":"p","h":"1. Таш көмүрдү сүрөттөп айтып бер. 2. Таш көмүрдү кантип казып алышат? 3. Кыргызстандагы таш көмүр чыккан жерлерди картадан көрсөт. Атап бер. Картадан Таш-Көмүр шаарын тап."},{"t":"p","h":"Сөз үйрөн. Шахта, шахтер."}],"pages":[71,71]},{"title":"НЕФТЬ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"72\">72<\/span>НЕФТЬ"},{"t":"p","h":"Жолдордо күн-түн тынбай автомашиналар жүрүп турат. Талаада тракторлор менен комбайндар иштейт. Асманда самолеттор учат, сууда кемелер сүзүп жүрөт. Ушулардын бардыгы бензинсиз, керосинсиз кыймылга келбейт. Ал эми бензин менен керосин нефтиден алынат."},{"t":"p","h":"Кыргызстандын аймагында нефть Майлы-Сайда, Майлуу-Сууда, Чаңгырташта бар."},{"t":"p","h":"Нефть жердин алдында, өтө тереңде болот. Нефтини алыш үчүн жерди казып, металл түтүк кагып киргизишет. Түтүктүн учу тереңдеги нефтиге жеткенде ал жогору көтөрүлүп чыгат. Кээде нефтини насос менен сордуруп алышат. Жер алдынан алынган нефть түтүк аркылуу нефть иштетүүчү заводдорго келет. Заводдо нефтиден бензин, керосин, мазут жана башка көп нерселер алынат."},{"t":"p","h":"Практикалык иш."},{"t":"p","h":"1. Пробиркага же бөтөлкөгө куюлган нефтини карап көр. Ал кара, күрөң, түстөгү суюктук. Жыттасаң, жыты өзгөчө. 2. Нефтини ак кагазга тамчылат. Эмне болот? Кагазда майланышкан так калат. Нефть – майлуу суюктук. 3. Нефтини стакандагы сууга куюп аралаштыр. Ал суунун үстүнө калкып чыгат. Демек, нефть суудан жеңил."},{"t":"p","h":"Суроолор жана тапшырмалар."},{"t":"p","h":"1. Нефть, бензин, керосинди сүрөттөп айтып бер. Нефть кайдан алынат? 2. Бензин менен керосин эмнеден алынат жана кайда колдонулат? 3. Нефть менен <span class=\"pg\" data-n=\"73\">73<\/span>сууну салыштырууга болобу? Кыргызстандагы нефть чыккан жерлерди атап бер жана картадан көрсөт."},{"t":"p","h":"4. Нефтинин биздин жашообуздагы зарылдыгы жөнүндө аңгеме түз."}],"pages":[72,73]},{"title":"МЕТАЛЛДАР","blocks":[{"t":"h3","h":"МЕТАЛЛДАР"},{"t":"p","h":"Үйүңдөн, мектептен, көчөдөн ар дайым металл буюмдарды көрөсүң."},{"t":"p","h":"Адамдын жашоосунда металл зор мааниге ээ. Айыл чарба машиналары (чөп чапкыч, пресстегич, трактор, комбайн) металлдан жасалган. Самолет, вертолет, ракета, спутник – мына ушулардын баары металлдан. Металлдын түрү көп. Алардын ичинен бизге таанышы – темир, жез, алюминий, алтын, күмүш, коргошун, калай, цинк. Алар ар түрдүү. Бирок окшош жагы бар. Металлдардын жалпы касиети менен таанышалы."},{"t":"p","h":"Практикалык иш."},{"t":"p","h":"1. Мыкты, алюминий кашыкты, жез зымды карап көр. Булардын бардыгы жалтырак. 2. Мыкты, кашыкты, таякты стакандагы ысык сууга салып кой. Бир аздан кийин алардын учун кармап көрсөң, мык менен кашык тез ысып, таяк көптө ысыганы байкалат. Демек, металл жылуулук өткөрөт. 3. Коргошунду зымдын учуна байлап отко кармасаң, бир аздан кийин ал жумшарып, эрийт. Ошентип, металлдын бардыгы эрийт. 4. Жогорудагы касиеттерден тышкары, металлдар магнитке тартылат."},{"t":"p","h":"Тапшырма."},{"t":"p","h":"Үйдөн металл буюмдарды карап көр. Алардын аталышын <span class=\"pg\" data-n=\"74\">74<\/span>дептериңе жаз. Металлдардын окшоштугун, айырмачылыктарын жаз."},{"t":"p","h":"Суроолор."},{"t":"p","h":"1. Адамдын жашоосунда металлдар кандай мааниге ээ? 2. Металлдар кандай касиетке ээ? Айтып бер."}],"pages":[74,74]},{"title":"ТЕМИР ЖАНА АЛЮМИНИЙ","blocks":[{"t":"h3","h":"ТЕМИР ЖАНА АЛЮМИНИЙ"},{"t":"p","h":"Күндөлүк турмушта биз темирди көп жерлерден кездештиребиз. Үйдөгү буюмдардын көбү: бычак, казан, кайчы, күрөк, балта, айры жана башка ушуга окшогон буюмдар темирден жасалган. Машиналардын, самолеттордун, ракеталардын тетиктери да темирден. Темир кени жер кыртышынын ар кандай тереңдигинде жатат. Нарын өрөөнүндөгү Жетим-Тоодо магниттүү темир кени бар. Таза темир алыш үчүн адегенде кенди жардырып талкалап, майдалоо керек. Анан машинага жүктөп заводго же комбинатка жеткирет. Ал жерден эритет, темир кенинен чоюн, чоюндан болот алынат."},{"t":"img","src":"data:image/webp;base64,UklGRoY2AABXRUJQVlA4IHo2AAAQWQGdASqAAj4BPrVQokonJSOiLTQLsOAWiWduunyGFjo9qR8mWxn6t82/mPjW6geQ/H9iZc9/QTwl/Pf6z0Hfc/n7yFuwkaf7++ddTQ92v8nsrfuh6993B6XvoldpgbXVjSJvWvy68yDbiV/oMTCv7sqVL8uze4ZGUXytJ9sWlyRQkPz9asFzcumkRXqIFeZE2sRw0WXK8KbgZWsU4DKUiFIpSvRbjZ4MA5BV/G3ZTgK6kY1j4WwO3uoflHqbwJk5barQgEeScKi/u/4CNhiRuTiifzFH+RE3o/dFYBzFrOqOi1SsceLDG24LOLFbop5dWMh20w+kRppD42Vi+EMB7KFhyaxji3f3DfeoYIwzT/LARItif53TH1xwvBsHuvmF6z4a8fckB53sswBCAAQvILnTrxzPHg7xoU2BSnKp3k6b4kpxakdMX1wbbw+Le3liEHawRStPvULjvT7PGcV54ZMit8Qf6OHIJyngnWD2RyjhpffBol9c5uyV01+lwZMvYcbDyr85tqdhnd/vy8q1NaxO2IjCTalZiIrEqGY5LFPmxPDxslypb9BlhhQ9VQ25LC1pSPNn9PvqGRnVlVbzbtM8J6fLKoLPr9uVTQzbsl7m9PqiChTW4mSQo/ZE8GMa+8Z5sHJff+3kfTSiDy22U4SpIQ6Pn5SedQJU6s81a661aqLDbXMZDS3LLN6+HSWSVcWZk2ZxQ+vujOboYT3NsDshthHAqC/elDtuNsoQQBKd4hagxfOV5hsxNdiI2lBFWSPvMRA8J3Ic2GP9n4AbDIYpmZBNpxBNoMKoTrXQpBxipMGNrF3QOitCMLP9IuJjcXuPoj/uWIHPObTSkCLFpv2SRiWNLq6Euu6dBnmzFKEe0cgR/satwN5AM0V6M4c/Z1P/ofPnNNVGTEqM8yJdMBM4jiU рди жасоодо керектелет."},{"t":"p","h":"Практикалык иш."},{"t":"p","h":"1. Темир, алюминий буюмдарын салыштырып, карап көр. 2. Алардын айырмасын жана окшош жактарын белгиле."},{"t":"p","h":"Суроолор жана тапшырма."},{"t":"p","h":"1. Темир менен алюминийден кандай буюмдар жасалат? Атап бер. 2. Кыргызстандын кайсы жеринде темир кени бар? Үйүңдөгү темир жана алюминий буюмдарды ата, аларды өз-өзүнчө бөлүп жаз. 3. Темир жана алюминий буюмдары бири-биринен кандай айырмаланат? 4. Темир буюмдарынын биздин турмушубуздагы мааниси жөнүндө аңгемелешкиле."},{"t":"h3","h":"Кызык экен, билип ал!"},{"t":"p","h":"Адамдын денесинде да темир болот. Эгер адамдын канында темир азайса, ал ооруп калат. Врачтар ага темири бар дарыны ичүүнү сунуш кылат. Темир жетишпесе, өсүмдүктөр да илдетке чалдыгып, солуй баштайт."},{"t":"p","h":"<span class=\"pg\" data-n=\"76\">76<\/span>Үйдөн оку."},{"t":"h3","h":"ТЕМИР КАНТИП ПАЙДА БОЛГОН? Жомок"},{"t":"p","h":"Илгери бир тууган жетимиш жети тоо болуптур. Ар бир тоонун аты болгон экен. Биринин аты Топурак-Тоо, анткени ал жалаң топурактан турган, экинчиси Кумдуу-Тоо, үчүнчүсү Таш-Тоо, төртүнчүсү Кайың-Тоо."},{"t":"p","h":"Ошентип, бардыгынын өз аты болгон. Ал тургай Туздуу-Тоо деген да бар экен."},{"t":"p","h":"Тоолордун арасындагы айылда жашаган бир кыз көйнөк тигип отуруп, ийнесин сындырып алат. Ал кезде ийнелер эң эле морт болгондуктан, бат эле сынып калчу экен. Анткени алар балыктын сөөгүнөн жасалчу. Кыз ийнесин сындырып алганына кайгырып, тоонун түбүнө барып ыйлап отурат."},{"t":"p","h":"Аты жок тоо кызга кайрылып мындай дейт:"},{"t":"p","h":"– Кой, ыйлаба, садага! Мен сага такыр сынбаган, ийилбеген ийне берем."},{"t":"p","h":"Тоо кызга кичинекей күрөң таш берет. «Муну отко ысытсаң, адегенде кызарып, анан агарат, андан кийин көлкүлдөп эрип, суудай болуп калат, эригенден кийин бир тамчысын атаңа бер. Ал сага ийне жасап берет», – деп түшүндүрөт."},{"t":"p","h":"Кыз тоонун айтканын жасап, атасына ташты алып барса, атасы абдан таң калды. Бул жөнөкөй ташка окшобойт, оорураак экен. Атасы ойлонуп отуруп, бул аты жок тоонун кишилерге берген белеги турбайбы деп түшүндү. Мындан ийне гана эмес курч балта, балка жасаса да болчудай."},{"t":"p","h":"<span class=\"pg\" data-n=\"77\">77<\/span>Бул ташты темир деп атап, аты жок тоону Темир-Тоо деп коюшту. Ошондон тартып ийнелер балыктын сөөгүнөн, балка, балталар таштан жасалбай калды. Эл жылдан жылга темирди көп пайдалана баштады."},{"t":"p","h":"Темирлер мурдагыдай отко ысытылбастан, чоң-чоң мештерде – домнада эритилет. Көлкүлдөп эриген темирден эмнени кааласаң, ошону жасап алууга болот. Темирден жасалган буюмдарга санат жетпейт."},{"t":"p","h":"Суроолор."},{"t":"p","h":"1. Жомокту окуп, ойлонуп көр. 2. Кыз тоонун жанына эмнеге барды? 3. Аты жок тоо кызга кандай таш берди? 4. Таштан эмне жасоого болот? 5. Адамдар ташты кантип темирге айландырышты? 6. Бул жомоктун чындыкка кандай окшоштугу бар? Ойлонуп көр."}],"sub":[{"title":"Кызык экен, билип ал!","b":8},{"title":"ТЕМИР КАНТИП ПАЙДА БОЛГОН? Жомок","b":11}],"pages":[75,77]},{"title":"АЛТЫН МЕНЕН КҮМҮШ","blocks":[{"t":"h3","h":"АЛТЫН МЕНЕН КҮМҮШ"},{"t":"p","h":"Алтын менен күмүш асыл металлдардын катарына кирет. Жалтырак, кубулуп турат, дат баспайт, чирибейт. Алтын, күмүштөн буюм жасаган адамды зергер дейт. Зергерлер алтын, күмүштү каалагандай түргө келтирип, ийип, чоюп, сөйкө, шакек, билерик, чач учтук жана башкаларды жасашат."},{"t":"p","h":"Биздин өлкө алтын кенине бай. Тогуз-Торонун Макмалында, Нарындын Солтон-Сарысында, Ысык-Көлдүн Кум-Төрүндө, Таластын Жер-Үйүндө, Чүйдүн Талды-Булагында алтын бар экени элге белгилүү. Тогуз-Тородо Макмал деген жерде алтын комбинаты иштейт. Алтыны бар чоң-чоң таштарды <span class=\"pg\" data-n=\"78\">78<\/span>талкалап, машиналар менен комбинатка ташып келишет. Таштарды кумдай майдалап, эритип, ар кандай химиялык жол менен алтынды бөлүп алышат. Ошондой эле Жети-Өгүздөгү Кум-Төрдө алтын казылып алынууда."},{"t":"img","src":"data:image/webp;base64,UklGRmQnAABXRUJQVlA4IFgnAABQ/wCdASqAAtoAPrV лтын менен күмүштү темир менен салыштыр, окшош жагы барбы?"}],"pages":[78,78]},{"title":"КЕНДЕРДИ ИЗИЛДӨӨ ЖАНА КАЗЫП АЛУУ","blocks":[{"t":"h3","h":"КЕНДЕРДИ ИЗИЛДӨӨ ЖАНА КАЗЫП АЛУУ"},{"t":"p","h":"Жер бетинен жана анын терең катмарынан кен табуу жана аны изилдөө – өтө татаал иш. Анткени <span class=\"pg\" data-n=\"79\">79<\/span>кайсы гана кен болбосун, жер бетинде көрүнөө жатпайт. Же «мен мындамын» деп үн катпайт. Кээде тебелеп-тепсеп жүрүп да аны байкабайсың. Атайын адистиги жок кишилерге тоо тектеринин бардыгы бирдей көрүнөт."},{"t":"p","h":"Жер катмарынан кен байлыктарды изилдөөчү адистер инженер-геолог же жөн эле геолог деп аталат. Геологдор жөө басып, ат минип, кээде самолет же вертолет менен жер кыдырып кен издешет. Алардын иши өтө татаал. Күнүнө ондогон километр жер басып, ашуу ашып, кыр-кырлап жер бетинин геологиялык түзүлүшүн атайын картага түшүрүшөт. Кен табылган аймакты узун-туурасынан казып текшеришет. Кендин санын, сапатын аныкташат. Эгерде кен мол болсо, дароо изилдөөгө киришет. Мында кен байлыктарды терең казып же бургулап, калыңдыгын, аянтын, алган ордун так эсептеп чыгышат. Металл же башка кен байлык казып алынарын далилдешет."},{"t":"p","h":"Кендерди жер катмарынан казып алуу – тоо инженеринин иши. Алар күчтүү техникалардын жардамы менен геологдор сунуш кылган жерди казып алууга киришет. Эгер кен байлыктар жердин үстүндө көрүнөө жатса, анда анын үстүндөгү тоо тектерин сыйрып алып таштап, ачык эле каза баштайт. Мындай учурда кен казылып жаткан аянт карьер деп аталат."},{"t":"p","h":"Көпчүлүк учурда кен байлыктар жердин терең катмарынан орун алат. Мындай кенди казып алуу бир топ кыйыныраак болот."},{"t":"p","h":"<span class=\"pg\" data-n=\"80\">80<\/span>Кенди казып алгандан кийин кен ылгоочу фабрикага жөнөтөт. Ал жерде кендин кесек бөлүктөрү кумдай майдаланат. Фабрикаларда химиялык заттардын жардамы менен керектүү заттар ылганып алынып, куму сыртка чыгарылат. Ылганган металлдар эритилет. Ар кандай кошулмалардан тазартылат. Акыры таза түрүндөгү кен алынат."},{"t":"h3","h":"Суроолор жана тапшырмалар"},{"t":"p","h":"1. Кен изилдөөчү адис жана кен казуучу адис эмне деп аталат? 3. Кенди кандай жолдор менен казып алышат? Атап бер. 4. Карьер менен шахтанын кандай айырмасы бар? 5. Кенди кандайча тазалашат? 6. Кен байлыктарды изилдөө боюнча аңгеме түз."},{"t":"v","l":["Сөз үйрөн.","Геолог, тоо инженери, карьер, шахта.","Кайталоо:"]},{"t":"p","h":"Кен байлыктарды атап бер Кен байлыктардын жашоодогу мааниси тууралуу айтып бер. Металл кендерин ата. Картадан көрсөт. Күйүүчү кен байлыктарды ата. Картадан көрсөт. Курулушка колдонулуучу кен байлыктарды ата. Картадан көрсөт. Кенди изилдөө жана казып алуу жөнүндө айтып бер."}],"sub":[{"title":"Суроолор жана тапшырмалар","b":6}],"pages":[79,80]},{"title":"ЖЕР ТААНЫ, ЭЛ ТААНЫ","blocks":[{"t":"h2","h":"ЖЕР ТААНЫ, ЭЛ ТААНЫ"},{"t":"p","h":"Сабакка карата суроолор жана тапшырмалар."}],"pages":[80,80]},{"title":"ЧҮЙ АЙМАГЫ","blocks":[{"t":"h3","h":"ЧҮЙ АЙМАГЫ"},{"t":"p","h":"1. Картадан Чүйдү тап. 2. Чүй сен жашаган жерден канчалык алыс турарын байка. 3. Чүйгө кантип барууга болот? 4. Чүй жөнүндө эмне билесиң?"},{"t":"p","h":"<span class=\"pg\" data-n=\"81\">81<\/span>Сары өзөн Чүй деп көп угабыз. Ал кандай жер болду экен? Картадан Чүйдү табыш үчүн адегенде Кыргызстандын борбор шаары Бишкекти издөө керек. Бишкек шаары Чүй өрөөнүндө жайгашкан."},{"t":"p","h":"Чүйдө Аламүдүн, Кемин, Ысык-Ата, Сокулук, Ак-Суу, Жайыл, Москва, Панфилов райондору орун алган. Токмок, Кант, Кара-Балта, Шопоков деген шаарлар бар. Өрөөндү аралап Чүй дарыясы агат."},{"t":"p","h":"Кышы мээлүүн, жайы ысык, жаратылышы кооз. Эгин, жашылча өстүрүүгө талаалары, мал бакканга жайлоолору ыңгайлуу."},{"t":"p","h":"Жазында Чүйдүн талааларында кызгалдак гүлдөп, кыпкызыл түскө келет. Чүй дарыясынын жээгинде мурда саз көп болгон экен. Сазда камыш өсчү. Азыркы күндө саздын көбү кургатылып, айдоо аянты болуп калган."},{"t":"p","h":"Чүй жери кант кызылчасын өстүрүүгө ыңгайлуу."},{"t":"p","h":"Кант кызылчасы 1930-жылдан бери өстүрүлөт. Бул жерде кант заводу курулуп, Кант деген шаарча пайда болгон."},{"t":"p","h":"Ысык-Атада, Ак-Сууда, Аламүдүндө жер алдынан дарылык касиети бар суулар чыгат."},{"t":"p","h":"Чүй аймагы адамдын жашоосуна абдан ыңгайлуу. Тоолору, токойлору, көк-кашка суулары ар бир адамды суктандырат. Жери түшүмдүү. Жашылча-жемиштердин түрүн өстүрүүгө болот. Ошондуктан бул аймак илгертен бери «Сары өзөн Чүй» деп даңкталып келе жатат."},{"t":"p","h":"<span class=\"pg\" data-n=\"82\">82<\/span>Чүйгө ар кандай улуттагы элдер көчүп келип жайгашып, жердеп калышкан."},{"t":"p","h":"Бул жерде ар улуттагы элдер – кыргыздар, орустар, казактар, уйгурлар, дунгандар, корейлер, өзбектер жашайт."},{"t":"p","h":"Азыркы күндө Республикабыздын туш тарабынан: Ош, Жалал-Абад, Нарын, Ысык-Көл, Таластан элдер көчүп келүүдө. Бул жерге дүйнө жүзүнөн элдер келип турат."},{"t":"p","h":"Суроолор."},{"t":"p","h":"1. Чүй жөнүндө эмне билдиң? Кыргызстандын борбор шаары кайсы өрөөндө? Картадан көрсөт. Чүйдүн жер шарты кандай, сүрөттөп айтып бер. 2. Чүйдө кайсы улуттагы элдер жашайт? 3. Кант заводу жана Кант шаары кайсы жерде? 4. Чүй аймагын сүрөттөп, аңгеме түз."},{"t":"h3","h":"Чүйдөгү окуучулар үчүн суроо-тапшырмалар"},{"t":"p","h":"1. Өз жериң жөнүндө эмне билесиң? 2. Башка жактагы досторуңа Чүй өрөөнүнүн жаратылышы, эли, атактуу адамдары жөнүндө кат жазып, кабарла."}],"sub":[{"title":"Чүйдөгү окуучулар үчүн суроо-тапшырмалар","b":15}],"pages":[81,82]},{"title":"ОШ АЙМАГЫ","blocks":[{"t":"h3","h":"ОШ АЙМАГЫ"},{"t":"p","h":"Сабакка карата суроолор жана тапшырмалар."},{"t":"p","h":"1. Картадан Ош аймагын тап. 2. Ош сен жашаган жерден канчалык алыс турганын байка. 3. Ош жөнүндө эмне билесиң?"},{"t":"p","h":"Картадан Ош шаарын таптың. Ага жакын жерлерде Кара-Суу, Ноокат, Өзгөн, Алай, Кара-Кулжа деген жерлер бар экенин билдиң. Булардын бардыгы <span class=\"pg\" data-n=\"83\">83<\/span>Ош аймагына караштуу, жалпысынан Ош областы деп аталат. Областтын борбору – Ош шаары."},{"t":"p","h":"Ошту «ак алтындуу» аймак деп сыймык менен өзгөчө белгилейбиз."},{"t":"p","h":"Базарларынан жер-жемиштердин, жашылчалардын түрлөрүн көрөсүң. Жүзүм, анар, алма, алча, мисте, жаңгак жана башка дүйүм жемиштер мол."},{"t":"p","h":"Оштун эли эмгекчил. Күндүн аптаптуу ысыгына карабай жайлата талааларда эмгектенип, мол түшүм алуунун сырын жакшы билишет."},{"t":"p","h":"Ош областында ар улуттагы элдер жашайт. Бул аймакта чөлгө окшогон адырлар көп, ошондой эле тоолор да бар. Мисалы, Кара-Суу районунда адырлар жана түздүктөр басымдуу келет. Жери чөлгө окшоп ысык."},{"t":"p","h":"Араван району да чөлдү элестеткен жер. Абдан ысык келет."},{"t":"p","h":"Өзгөн району тоолуу. Байбиче, Доңуз-Тоо, Зергер, Зындан, Торгой-Төбө аттуу тоолору бар. Жазы, Ийри-Суу, Куршаб суулары агат. Өзгөнгө күрүч жакшы өсөт. Кара-Шоро минералдык суусу менен жалпы кыргыз журтуна жакшы таанымал. Бул суунун дарылык касиети бар экени 1945-жылы аныкталган."},{"t":"p","h":"Алай, Алайкуу, Кара-Кулжа райондору тоолуу келет. Бул жердеги элдер мал багууга адистешкен."},{"t":"p","h":"Ош аймагында жаратылышы кооз жерлер көп. Кыргыз-Ата тоосу, Кара-Шоро, Салам-Алик, Абшыр-Сай капчыгайы, Абшыр-Сай шаркыратмасы, Ноокаттагы Ажыдар-Үңкүр жалпы кыргыз элинин сыймыгы болуп эсептелет."},{"t":"p","h":"<span class=\"pg\" data-n=\"84\">84<\/span>Ош шаарынан анчалык алыс эмес жердеги тоолордо Сүрөт-Таш деген бар. Сүрөт-Ташта байыркы заманда чегилип тартылган аттын сүрөттөрү даана байкалат. Ал эми Араван айылына жакын жердеги Чил-Устун үңкүрүнүн төбөсүндө байыркы сүрөттөр жана жазуулар бар."},{"t":"p","h":"Ош аймагы мына ушундай тарыхы терең, берекелүү жер. Тоосу да, чөлү да, токою да бар. Биз Ош жергеси менен сыймыктанабыз."}],"pages":[83,84]},{"title":"СУЛАЙМАН ТООСУ","blocks":[{"t":"h3","h":"СУЛАЙМАН ТООСУ"},{"t":"p","h":"Ош шаарынын борбордук бөлүгүндө жайгашкан Сулайман тоосу чынында эле өзгөчө табышмактуу тоо. Бул тоодо эл сыйына турган мазарлар, ыйык жерлер көп."},{"t":"p","h":"Тоодо бир нече үңкүрлөр бар. Таштарда чегилген байыркы сүрөттөр, жазуулар кездешет."},{"t":"p","h":"2000-жылы тоого тарыхый музей курулган. Тоодогу үңкүр музей болуп жасалгаланган."},{"t":"p","h":"Тоого чыгып карасаң, шаар эң сонун көрүнөт. Тасмадай кенен жолдору, азыркы күндүн талабына ылайык салынган бийик, кооз имараттары, гүлбактары, фонтандары шаарга өзгөчө көрк берип турат."},{"t":"p","h":"Сулайман тоосунда жайдыр-кыштыр эл көп болот. Туристтер тоодогу музейге кирип кыргыз элинин тарыхы менен таанышат, тоонун ажайып кооздугуна суктанышат."},{"t":"p","h":"Сулайман тоосу кыргыз жеринин сыймыгы жана көркү."},{"t":"p","h":"<span class=\"pg\" data-n=\"85\">85<\/span>Суроолор."},{"t":"p","h":"1. Ош жөнүндө эмне билдиң? 2. Оштун жер шарты кандай? Ошто эмне өстүрүлөт? 3. Ош аймагы республикабыздын кайсы тарабында? Картадан көрсөт. Ал жерде кайсы улуттагы элдер жашайт? 4. Ош областындагы райондорду ата. 5. Ош шаарындагы ыйык тоонун аты эмне? 6. Ош аймагы эмнеси менен өзгөчөлөнөт? 7. Ош аймагын, Ош шаарын сүрөттөп аңгеме түз, сүрөт тарт."},{"t":"h3","h":"Ош аймагында жашаган окуучулар үчүн суроолор жана тапшырмалар"},{"t":"p","h":"1. Оштун кайсы жеринен болосуң? 2. Өз жериңдин жаратылышы, тарыхы, эли, атактуу адамдары жөнүндө эмне билесиң? 3. Силер жакта кайсы улуттагы элдер жашайт? Алар жөнүндө эмне билесиң? 4. Башка жактагы досторуңа Ош аймагы жөнүндө кат жазып билдир."},{"t":"p","h":"Үйдөн оку"}],"sub":[{"title":"Ош аймагында жашаган окуучулар үчүн суроолор жана тапшырмалар","b":9}],"pages":[85,85]},{"title":"УЛУУ ЖИБЕК ЖОЛУ ЖӨНҮНДӨ БАЯН","blocks":[{"t":"h3","h":"УЛУУ ЖИБЕК ЖОЛУ ЖӨНҮНДӨ БАЯН"},{"t":"p","h":"1. Жибек деген эмне? 2. «Жибек жолу» дегенди уккансыңбы, аны кандай түшүнөсүң? 3. Эмне үчүн «Улуу жибек жолу» деп аталат?"},{"t":"p","h":"Жибек деген эмне? – деген суроого ал кыздын аты деп жооп беришиң мүмкүн. Анткени кыргыз менен казак элдеринде Жибек аттуу кыздар көп кездешет. Ал тургай «Кыз Жибек» деген кино бар. Жибектей созулган, адептүү, назик кыз болсун деп ата-энеси кызынын атын Жибек коюшат."},{"t":"img","src":"data:i iIsgXpzZWYJpIJTUVudRdqb9pW4c53HPTUDepAAAA","w":518,"ht":469},{"t":"p","h":"Чындыгында, жибек деген – кездеменин аты. Ал жибек жиптен токулат. Жибектен үлпүлдөгөн шифон, <span class=\"pg\" data-n=\"86\">86<\/span>крепдешин, крепжоржет, шайы, атлас жана башка кездемелер жасалат. Демек, сен жибекти көп эле көрүп жүрөсүң. Кыздар жибектин түрүнөн көйнөк кийишет. Жибек кездемелер – абдан кооз жана бышык."},{"t":"p","h":"Илгери кыргыз жери аркылуу «Улуу жибек жолу» өткөн. Муну кандай түшүнүүгө болот? Ал эмне жибек төшөлгөн жолбу? Эмне үчүн «Жибек жолу» деп аталат, эмне үчүн улуу?"},{"t":"p","h":"Көрсө, мунун өзүнчө чоң тарыхы бар экен. Байыркы заманда жибектен кездеме жасаганды кытайлыктар гана билишчү. Алар жибекчиликтин сырын башка элдерге билгизбей, жибек сатып байысак деп эңсешкен. Жибекке дүйнөнүн көп өлкөлөрү кызыгышып, алыскы Кытайга келип, төөлөргө жибек жүктөп кетишчү экен. Жибектин баасы абдан кымбат болгон. Кээде алтынга сатып алышчу."},{"t":"p","h":"Улуу жибек жолунун боюнда шаарлар курулган, соода өнүгүп, эл көбөйгөн. Кыргызстанда байыркы шаарлардын орду, урандылары калган. Алар бизге тарыхый эстелик катарында белгилүү. Мисалы, Ат-Башыдагы Таш-Рабат кербен сарайы, Ак-Талаадагы Шырдакбектин чеби, Алабукадагы чеп."},{"t":"p","h":"<span class=\"pg\" data-n=\"87\">87<\/span>Соодагерлер 1500 жыл бою Кытайдан башка жактарга Улуу жибек жолу аркылуу жибек ташышкан. Алар жибек алыш үчүн бардык кыйынчылыктарга чыдап, узак жол жүрүшкөн. Күндүн ысыгына, суугуна, шамалга туруштук беришип, бийик ашууларды ашып, суусу жок чөлдөрдү да басып өткөн. Кээде аларды жолдон каракчылар тоношкон. Мына ушул кыйын жол тарыхта «Улуу жибек жолу» деп аталып калыптыр. Кыргызстандын аймагында жибек жолдун үч тармагы бар. Бири – Ош, Алай, экинчиси – Ысык-Көл, үчүнчүсү – Нарын, Ат-Башы аркылуу өтөт. Бишкекте жана башка жерлерде «Жибек жолу» аттуу көчөлөр бар."}],"pages":[86,87]},{"title":"БИШКЕК – ОШ ЖОЛУ","blocks":[{"t":"h3","h":"БИШКЕК – ОШ ЖОЛУ"},{"t":"p","h":"Бишкек менен Оштун арасындагы жол алыс. Республикабыздын түндүгү менен түштүгүн бириктирүүчү жол 1965-жылы курулуп бүткөн. Ал Бишкек менен Ош шаарын бириктирет. Жолдун узундугу – 620 километр. Теңинен көбү капчыгай, ашуу, бөксө тоолор аркылуу өтөт. Төө-Ашуудагы узундугу эки жарым километр келген туннель Бишкек – Ош жолунда. Жолдун боюнда таш көмүр, нефть кендери бар."},{"t":"p","h":"Суроолор жана тапшырма."},{"t":"p","h":"1. Бишкек-Ош жолу качан курулган? 2. Бишкек-Ош жолунун узундугу канча километр? 3. Анда эмне деген туннель бар? Туннель эмне үчүн курулган?"},{"t":"p","h":"4. Бишкек – Ош жолунун кандай мааниси бар?"}],"pages":[87,87]},{"title":"ЖАЛАЛ-АБАД АЙМАГЫ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"88\">88<\/span>ЖАЛАЛ-АБАД АЙМАГЫ"},{"t":"p","h":"Сабакка карата суроолор жана тапшырмалар."},{"t":"p","h":"1. Картадан Жалал-Абадды көрсөт. 2. Жалал-Абадга кантип барууга болот? Айтып бер. 3. Ал сен жашаган жерден канчалык алыс турат? 4. Жалал-Абад жөнүндө эмне билесиң?"},{"t":"p","h":"Жалал-Абад тарапка бардың беле? Ал жер – гүлдөгөн сонун аймак. Кыргызстандагы эң кооз жерлер ошол жакта. Сузак, Базар-Коргон, Ноокен, Аксы, Ала-Бука, Чаткал, Тогуз-Торо, Токтогул, Үч-Терек райондору Жалал-Абад областында. Бул райондордун ар бири өзүнчө сөз кылууга арзыйт. Жалал-Абад аймагы Көк-Арт, Кербен, Чаткал, Ала-Бука, Кетмен-Төбө, Тогуз-Торо өрөөндөрүнөн турат. Бул өрөөндөрдү Чаткал, Ат-Ойнок, Такталык, Бабаш-Ата тоолору курчап жатат. Жалал-Абад аймагына барып калсаң, аска-зоокалуу бийик тоолорду, жаңгак жана ар түркүн мөмө-жемиш өскөн токойлорду, тоо сууларын, шаркыратмаларды көрөсүң. Тоо арасындагы өрөөндөрдө пахта, тамеки, жашылча-жемиштин көп түрү өстүрүлөт. Аркыт, Арстанбаб, Сары-Челек өңдүү жаратылышы кооз жерлер Жалал-Абад аймагында."},{"t":"p","h":"Нарын дарыясына курулган Үч-Коргон, Таш-Көмүр, Күрп-Сай, Токтогул, Шамалды-Сай ГЭСтери да Жалал-Абад аймагында."},{"t":"p","h":"Ошондой эле Жалал-Абад – кен байлыктардын да мекени. Көк-Жаңгак менен Таш-Көмүрдө таш көмүр кени, Чаңгыр-Таш менен Майлы-Сууда <span class=\"pg\" data-n=\"89\">89<\/span>нефть кени, Кетмен-Төбөдө Шамшыкал туз кени, Тогуз-Тородо Макмал алтын кени бар."},{"t":"v","l":["Сары-Челек, Кара-Көл деген көлдөр бар.","Суроолор жана тапшырмалар."]},{"t":"p","h":"1. Жалал-Абад жөнүндө эмне билдиң? Жалал-Абаддагы райондорду, тоолорду, сууларды, ГЭСтерди жана көлдөрдү ата. 2. Кыргызстандагы жаңгак токойлуу жерди картадан көрсөт. Ал жер кандай аталат? 3. Алтын кен комбинаты Жалал-Абад аймагынын кайсы өрөөнүндө? 4. Жалал-Абаддагы ГЭСтерди ата, алар кайсы дарыяга курулган. 5. Жалал-Абад аймагын башка аймактар менен салыштырып, өзгөчөлүгүн айтып бер. 6. «Жалал-Абад» деген темада аңгеме түз, сүрөт тарт."},{"t":"h3","h":"Жалал-Абад аймагында жашаган окуучулар үчүн суроолор жана тапшырма"},{"t":"p","h":"1. Жалал-Абаддын кайсы жеринен болосуң? 2. Өз жериң жөнүндө эмне билесиң? 3. Силер жакта кайсы шаарлар бар? 4. Жалал-Абад аймагынын жаратылышы, эли жөнүндө башка жактагы балдарга кат жазып, билдир."}],"sub":[{"title":"Жалал-Абад аймагында жашаган окуучулар үчүн суроолор жана тапшырма","b":8}],"pages":[88,89]},{"title":"ТАЛАС АЙМАГЫ","blocks":[{"t":"h3","h":"ТАЛАС АЙМАГЫ"},{"t":"p","h":"Сабакка карата суроолор жана тапшырмалар."},{"t":"p","h":"1. Картадан Таласты тап. Таласка кантип барууга болот? 2. Ал сен жашаган жерден канчалык алыс турганын байка. 3. Талас жөнүндө эмне билесиң?"},{"t":"p","h":"Картадан Таласты таап, жерин, сууларын бир сыйра карап көрдүң. Казакстан менен чектеш экенин байкадың."},{"t":"p","h":"<span class=\"pg\" data-n=\"90\">90<\/span>Суу бойлоп өскөн Талас токою, тоо башындагы мөңгүлөрдөн сызылып агып турган көк кашка тунук суулары Талас аймагынын байлыгы болуп эсептелет. Жалпы кыргыз журтунун сыймыгы болгон Манастын күмбөзү Талас шаарынан 12 километр аралыкта, Кең-Кол өрөөнүндө, Манас чокусунун тушунда жайгашкан. Андан тышкары, «Манастын ташы», «Манастын булагы», «Манастын мөңгүсү» дегендер бар, Манаска байланыштуу башка да жер аттары Таласта көп кездешет."},{"t":"p","h":"1995-жылы «Манас» эпосунун 1000 жылдыгы белгиленип, республикабызга дүйнөнүн туш тарабынан меймандар келишкен."},{"t":"p","h":"Талас аймагы Кыргыз Ала-Тоосу жана Талас Ала-Тоосу менен тегерете курчалган. Тоо арасында боз топурактуу, шыбак өскөн чөлгө окшош талаалар бар. Өрөөндү аралап, Талас дарыясы агат. Суу жээгинде токой көп. Терек, тал жана түркүн бадалдар өсүп, токой ушунчалык кооз. Таластагы жер аттары бизге көп нерселерди баяндайт. Мисалы, Эчкили-Тоо, Миң-Булак, Күмүштак деген жер аттарын алып көрөлүчү. Эмне үчүн Миң-Булак деп аталып калды экен? Мүмкүн мурда бул жерде оргуштап аккан булактар көп болсо керек. Ошон үчүн аны Миң-Булак деп атап коюшкандыр."},{"t":"p","h":"Ал эми Эчкили-Тоочу? Качандыр бир кезде бул тоолордо жапайы эчкилер таштан-ташка секирип жайылып жүрсө керек. Ошондуктан Эчкили-Тоо деп атап коюшкан чыгар."},{"t":"p","h":"Күмүштак болсо Күмүш-Тоо деген маанини билдирет. Мүмкүн ошол тоодон илгери күмүш эритип <span class=\"pg\" data-n=\"91\">91<\/span>алып, зергер усталар сонун-сонун сөйкө, билерик, шакек жасашкандыр, ат жабдыктарды кооздошкондур. Археологдор бул тоодон байыркылардын күмүш эритүүчү мештерин табышкан."},{"t":"img","src":"data:image/webp;base64,UklGRjYhAABXRUJQVlA4ICohAACQCQGdASpdAZABPqFIm0mmJKMhODe5MMAUCWlu3V/EKAXnwi83MdfYLMQwn2tfHv1Pd5uz9sePLK/8+In/17Lfk//99rrm4zqf/z6gPvw+OmEpATmvsYvCkvkuLNSDXaLHivsJr7GLwpUXu7gzWbf++/980xXFlMWZLl9sh0rP7m5+PTMZ9swQgbpA9CldCuff++9Ix6Iui8uPHLpBJpr4b1WQTlTqAwicJTNVRGqqlgk15k7mJNfYx1R260E2yBMZyopMdM0tAEvZLRz0zqdAcBvhilwq6JFM7XlMJS0bF7VhGLpnoxYMvhAHBA5qnW5ag+CAJdkPvBLpvkRXlDDM3jUDpmr8MMKnFY95WDCVzX+N0yvXKHPYjdlotnyDkSy+BPiSRxdC5WjOV/sjHuaAe1vVNbiQ1mjevEbpVM/JfjSu/hiT0ujQxOwHZNVynB9vhnYKAlVvh5slBMwJ5IttmCGBDyD7jds91M12m1zmvfmYxuu2QE5k05eRxpt3K5bJMCi6Ua+FQ76vQt/Ekn9vEh6TzmOARUGwjsavothsXgbDkTY9aR1UX0+ecBFWG7/e26epdE/hf8f78jirgM5xtdHX2MiFSV4d/cyHRgI0Sgj9IlQuhDUASg5sg3WwegJLNl2fWwI1Tdo1YrFztH6Z04sSGL+0ijjryVNIV/jElERoz/VHyuLvxVp4DQfJoD8f8aURfutp1WH8Wl9PCYEnpEeQkM7+UiEa2kHIn4XenkuZDLjo2ce7NAbRxrXXP7cn5gmUxIxE5U2 бакка карата суроолор жана тапшырмалар."},{"t":"p","h":"1. Картадан Ысык-Көл аймагын тап. 2. Ысык-Көлгө кантип барууга болот, ал сен жашаган жерден алыспы?"},{"t":"p","h":"3. Ысык-Көл аймагы жөнүндө эмне билесиң?"},{"t":"p","h":"Ысык-Көл жашоого, эс алууга ылайыктуу кутман жер. Ысык-Көл областында беш район бар. Алар: Ысык-Көл, Ак-Суу, Түп, Жети-Өгүз, Тоң. Областтын борбору – Каракол шаары. Көлдү тегерете курчап Күнгөй жана Тескей Ала-Тоо жатат. Учу-кыйырына көз жетпеген Ысык-Көл көк мелжиген мөңгүлөрдөн башталарын билесиңби? Көлдүн түштүгү менен түндүгүнөн курчаган Күнгөй жана Тескей Ала-Тоолору көлгө суу берет. Жаз, жай айларында муз, мөңгүлөр эрип, миң салаа суулар колот ылдый агып, бара-бара чоң дарыяларга айланат. Дарыя суулары Ысык-Көлгө келип кошулат."},{"t":"p","h":"Ысык-Көлдүн айланасында пансионаттар, курорттор, эс алуу үйлөрү көп. Жайында Кыргызстандын бардык жеринен, ал тургай коңшулаш Казакстандан, Өзбекстандан жана башка алыс жактардан эс алуучулар келишип, тоо бермети Ысык-Көлгө суктанып кайтышат. <span class=\"pg\" data-n=\"93\">93<\/span>Ысык-Көл минералдык булактарга, дары сууларга бай. Алсак, Жети-Өгүз, Жыргалаң минералдык суулары, Күрмөнтү, Тоң, Чолпон-Ата баткак кендери бар."},{"t":"p","h":"Ысык-Көл өрөөнүнүн батыш тарабы боз топурактуу чөл, чыгыш тарабы тоо. Тоосунда токой көп. Көлдүн тегерегинде жашаган элдер мал багып, жер айдап, жашылчанын, жемиштин түрүн өстүрүшөт."},{"t":"v","l":["","Суроолор жана тапшырмалар."]},{"t":"p","h":"1. Ысык-Көл жөнүндө эмне билесиң? 2. Ысык-Көл аймагындагы райондорду, шаарларды жана курортторду ата. 3. Эмне үчүн Ысык-Көл менен сыймыктанабыз?"},{"t":"p","h":"4. Ысык-Көл аймагын сүрөттөп айтып бер, сүрөт тарт."},{"t":"h3","h":"Ысык-Көлдө жашаган окуучулар үчүн суроолор жана тапшырмалар"},{"t":"p","h":"1. Ысык-Көлдүн кайсы жеринен болосуң? Өз жериң жөнүндө эмне билесиң? 2. Ысык-Көл аймагынын жаратылышы, эли, атактуу адамдары жөнүндө башка жактагы досторуңа кат жазып билдир. 3. Ысык-Көл жөнүндө ыр ырдап, жомок айт. Төмөндөгү табышмакты тап."},{"t":"v","l":["Күлкүсү көккө чачырап,","Күүлөнүп төмөн баш урат.","Токтобой тоодон чыккандан,","Жетүүгө көлгө ашыгат.","Көл боюнда шаар көп,","Бирок муну аныкта.","Ат коюлган кай жерге,","Байланыштуу балыкка.","А. Кыдыров"]}],"sub":[{"title":"Ысык-Көлдө жашаган окуучулар үчүн суроолор жана тапшырмалар","b":10}],"pages":[93,93]},{"title":"НАРЫН АЙМАГЫ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"94\">94<\/span>НАРЫН АЙМАГЫ"},{"t":"p","h":"Сабакка карата суроолор жана тапшырмалар."},{"t":"p","h":"1. Картадан Нарын аймагын тап. 2. Нарынга кантип барууга болот? Ал сен жашаган жерден канчалык алыс турат? 3. Нарын аймагы жөнүндө эмне билесиң?"},{"t":"p","h":"Сен картадан Нарын шаарын, Нарын дарыясын, Нарын аймагын таптың. Бул жакта Кочкор, Жумгал, Ат-Башы, Ак-Талаа деп аталган өрөөндөр бар. Ат-Башыда – Ат-Башы суусу, Жумгалда – Жумгал, Кочкордо – Кочкор суусу агат. Ар бир өрөөн ошол жердеги суунун аты менен аталып калгандай сезилет."},{"t":"p","h":"Нарын деген дарыя, өрөөн жана шаар бар. Нарын шаары эки тоонун ортосунда жайгашкан. Шаарды аралап, Нарын дарыясы агат."},{"t":"p","h":"Нарын аймагынын көбүн бийик тоолор ээлейт. Кай жерине барбагын бийик тоолорду көрөсүң."},{"t":"p","h":"Нарын жергесинде кыш узакка созулат, жайы салкын, айрыкча Ак-Сай, Арпа өрөөндөрүндө суук катуу болот. Кышкысын кээде суук 50 градуска да жетет."},{"t":"p","h":"Нарындын эли мал багуунун сырын жакшы билишет. Алар үчүн малчылык ата-бабадан калган кесип болуп эсептелет. Жайлоолору кенен, чөбү малга жагымдуу. Нарында багылган малдын этинин даамы ширелүү, бээнин кымызы күчтүү келет. Бул ошол жердеги чөптүн түрүнө, чөптү азыктандырган топурактагы заттарга байланыштуу."},{"t":"p","h":"Тоолорунда дары өсүмдүктөр көп кездешет. Нарын аймагындагы тарыхый эстеликтер байыркы заманда бул жерди көп эл мекендеп турганын <span class=\"pg\" data-n=\"95\">95<\/span>баяндайт. Алып айтсак, Ак-Талаадагы Шырдакбектин ордосу, Тайлак баатырдын күмбөзү, Ат-Башыдагы Кошой-Коргон, Таш-Рабат, Кочкордогу Кырк Чоронун күмбөзү. Мунун бардыгы бизге байыркылардан калган эстелик болуп эсептелет."},{"t":"p","h":"Ат-Башыдагы Кошой айылында Кошой-Коргон деген тарыхый эстелик бар. Илгери Кошой-Коргон чоң чеп экен."},{"t":"p","h":"Нарын аймагы мына ушундай жаратылышы кооз, тарыхы терең, касиеттүү жай. Жоокер, баатыр эл бийик тоолуу, шарты катаал жерди мекендеп жашап келген."}],"pages":[94,95]},{"title":"ТАШ РАБАТ","blocks":[{"t":"h3","h":"ТАШ РАБАТ"},{"t":"img","src":"data:image/webp;base64,UklGRqoVAABXRUJQVlA4IJ4VAAAwyQCdASoUAtsAPqlKmkmtL6KmtDZcGfAVCWdttorkhYKPJwgtnSoDXqAjUS0r+WMpnWW9hzW2ZL47/qdb9/t/wfbWrzf/nXO9w8wn/95z/hH/tr9M6xn2suzsnTlGZNu9lz91bVNGT7SDe2sdrsyZzVG+jjMYJS+kjE9xXOyDu//RIh8iYr2eSEU0IiSb6M8c7lG9HkyoSBrpqsWwHFcIm/0VAE63RC++hsRZmZQSN8tOMJgkm2xw56AwutRwkQtv7M5AqMMbrFjmnT7YixGZk4yvRz4J0qNXBtTcE2ojdl4aW79kVg1mOpEQH+nuSKRe9sO+fPKd6na+Exb4iPvDxDUB3CEBNhqGm3RTpx7SN7gjGPGmmOv/vuHlQtXUxOwEDsLMkc2koa6at+nza6BPfLghVFpAgpBd04tYZsWwft6aKEWV4TjRp0D+skIjcjJttATTcC1u81NWktiNrW9qJfaSUhb6yv0yV5B9K8/BtuyW7VwFIbYG510TNIFkA1BqUmF3ZjMTaKQKfhTkaOY3fF4jz3EaBrYxODLwhddFGO061zM1N24/7179oCfLrZJ/5dZmvIQpgoH4cum2LrHWD4FTW1TSm4qrUi1H33bFTaybe4kxcJjWKxwp9wl3GMqBenIWCCKC7s4QKv5clmhYigzOJ3CD1y8gd3/eCTKuZFnhRxP4x5rVEfEDLzh0wCnbhTm3TRm/obOOkL7AMdyO55RTgSNJbc4uz+wz3wEOeePC7fYctDysxaALEP6987U+CJuYEIZZHALgaZUZ4eRpZ181U+sW9PHtQmFEAJeQaGACKtH8P3vJOrXODcjgyWYEHdF93aqaCRHPZ9hhy7X6lzT2HWrC5CiHU+0HvYpJInsj0urUqKGn9ycUcwFk1ABIchTdN7mqeIQEgRcgkklrmSKslQB2gstJaCx5JtSK4gjgBcJMUU3oPB9Ii7X5MeJp457QTA+iKhp3/hgjogLoxPsqDQcj2STbrp7xnp4Atj2WBDmbf4iRrsPQr0DDyJm0bUg9NS4R8ZEjVuNaYNQsTkmOCikmT1um/E5moPVR1UH3yhERRXyn9EkC/OmwVACUjRbnoW4I0VzaXrLq5FogNP5LH1XetdZq649jBzQqx6cEqk3Ito+w/lMReIk2oxNv/+EDBWduuU9EGZKKKyJ+x1QLtwDEU/WfDbH7C2Y5QJWULuvCitXLFf6r0hLFFkYq3dfBTDWyQrvQMzLV7yKFCwLFSNNNFh+op5JcNAk7o/MNZdT56vojUCRt0qhhkAZPQD2pfcg+chp2sG0SjpjeC0xfGoQzV33gsDL1mRa9URZF6ZXFu98LPMtWL3Dw0iOErKmSmAPiAxkeGMVfk1raQ+oLV0AzuQdLoMz7AZny4facTlndDu7xo8f8jmANFAx4upVCCKqlJTFrdC7nGy934CgmiCY8I/Cl2bLCDi1JQHDWjzmQGYloZ0FpStkg оюн өрөөнүндө таштан салынган байыркы кербен сарай бар."},{"t":"p","h":"Таш Рабат Улуу жибек жолдун боюнда курулган. Бул соодагерлер түнөп, эс алып кетүүчү кербен сарай болгон. Таш Рабат жалаң таштан салынганы үчүн Таш Рабат деп аталып калган. Кербен сарай 31 бөлмөдөн турат, бийиктиги 21 метр."},{"t":"p","h":"Таш Рабаттын бөлмөлөрү ар кандай. Кире бериштеги чоң бөлмө, эл чогулуп, кеңеш кура турган жай, ал эми кичирээк бөлмөлөр эс алуучу жай болсо керек."},{"t":"p","h":"Таш Рабатта зындан да бар экен. Булардын бардыгы бизге табышмактуу жана байыркы тарыхтан кабар берет."},{"t":"p","h":"<span class=\"pg\" data-n=\"96\">96<\/span>Суроолор."},{"t":"p","h":"1. Нарын аймагы жөнүндө эмне билдиң? 2. Нарындын жер шарты, жаратылышы кандай? Сүрөттөп айтып бер. 3. Нарында кайсы өрөөндөр, эмне деген суулар бар? Кандай тарыхый эстеликтер бар? 4. Нарын аймагын башка областтар менен салыштыр, өзгөчөлүгүн белгиле."},{"t":"p","h":"Нарын аймагында жашаган окуучулар үчүн суроолор жана тапшырмалар."},{"t":"p","h":"1. Өз жериң жөнүндө эмне билесиң? 2. Өз жериңдин жаратылышы, эли, тарыхый инсандары жөнүндө башка жактагы окуучуларга кат жазып, кабарла."}],"pages":[96,96]},{"title":"БАТКЕН АЙМАГЫ","blocks":[{"t":"h3","h":"БАТКЕН АЙМАГЫ"},{"t":"p","h":"Сабакка карата суроолор жана тапшырмалар."},{"t":"p","h":"1. Баткен аймагын картадан тап. Баткенге кантип барууга болот? 2. Баткен сен жашаган жерден канчалык алыс турганын байка. 3. Баткен аймагы жөнүндө эмне билесиң?"},{"t":"p","h":"Картадан Баткенди тапсаң, ага жакын жерлерде Кадамжай, Лейлек деген райондор бар экенин билдиң. Баткен, Кадамжай, Лейлек райондору биригип, Баткен областын түзөт. Областтын борбору – Баткен шаары. Бул аймакта Сүлүктү, Кызыл-Кыя деген шаарлар бар."},{"t":"p","h":"Баткен аймагында бийик-бийик тоолор, ошондой эле адырлар көп. Алтын-Бешик тоосу, кызгалдактуу талаалар, өрүкзарлуу өрөөндөр Баткен аймагында. Тоо арасындагы өрөөндөр мал бакканга ыңгайлуу. Жайы ысык, кышы өтө суук эмес."},{"t":"p","h":"<span class=\"pg\" data-n=\"97\">97<\/span>Ошондуктан бул жактагы элдер жер-жемиштердин түрүн өстүрүүнүн сырын билишет. Баткендин өрүгү даамдуу жана өзгөчө ширин келет. Дарактар жыл сайын өрүк төгүп, арбын түшүм берет. Баткендин эли өрүктү кургатып, базарларга жөнөтүп турушат."},{"t":"p","h":"Баткен – фарс тилинен алынган сөз. Кыргыз тилине которгондо шамалдын жолу дегенди түшүндүрөт."},{"t":"p","h":"Баткен аймагы сейрек кездешкен кендери менен да даңктуу. Дүйнөгө белгилүү сурьма жана сымап кендери ушул аймактан чыгат. Кызыл-Кыяда көмүр кени бар."},{"t":"p","h":"Баткен аймагында түрдүү улуттагы элдер: кыргыз, өзбек, татар, тажиктер жашайт."},{"t":"p","h":"Кара алтынга, көмүргө бай Кызыл-Кыя жергеси, ак элечекчен энени элестеткен Алтын Бешик тоосу, килем төшөп койгонсуп, кызгалдактар жайнаган талаалар, өрүкзарлуу өрөөндөр Баткен аймагында. Мээ кайнаткан ысыгы пахта, тамеки, дан өсүмдүктөрүн өстүрүүгө ыңгайлуу."}],"pages":[97,97]},{"title":"АЙГҮЛ ТОО","blocks":[{"t":"h3","h":"АЙГҮЛ ТОО"},{"t":"p","h":"Баткенге кире бериште, Ош – Баткен жолунун сол тарабында анча бийик эмес тоо бар. Тоодо Айгүл деген сонун гүл өсөт. Мындай гүл Кыргызстан боюнча ушул гана тоодо кездешет. Ушундан улам Айгүл тоо деп аталат."},{"t":"p","h":"Бул гүлдүн өзгөчөлүгүн адамдар илгери эле байкашкан. Ал ай тийген учурда гана гүл ачат."},{"t":"p","h":"<span class=\"pg\" data-n=\"98\">98<\/span>Ошондуктан айдын гүлү Айгүл деген атка конгон. Көптөгөн адамдар бакыт издеп, табышмактуу гүлдү көрүш үчүн алыс жактардан атайын бул тоого келишет."},{"t":"p","h":"Баткендиктер Айгүл тоосу менен сыймыктанышат жана гүлдү коргошот. 1982-жылдан бери Айгүл тоо корукка алынган. Кара-Булак айылынын мектеп окуучулары Айгүл гүлүн кайтарыш үчүн «жашыл патруль» түзүшкөн. Алар кезектешип тоону кайтарып, эч кимге гүлдү үздүрүшпөйт. Гүл майрамында тоого келип, ырдап, бийлеп, жакшы каалолорду айтып, улуттук тамак-аштар менен бири-бирине сый көрсөтүшөт."},{"t":"h3","h":"Суроолор жана тапшырмалар"},{"t":"p","h":"1. Баткен республикабыздын кайсы тарабында?"},{"t":"p","h":"2. Картадан көрсөт. Баткендин жер шарты кандай? Сүрөттөп айтып бер. 3. Баткенде эмне өстүрүлөт? Баткен кайсы жемиши менен бааланат? Баткен аймагын башка аймактар менен салыштыр, өзгөчөлүктөрүн белгиле."},{"t":"p","h":"Баткен аймагында жашаган окуучулар үчүн суроолор жана тапшырма."},{"t":"p","h":"1. Баткендин, Кадамжайдын, Лейлектин кайсы жеринен болосуң? 2. Өз жериң, элиң жөнүндө эмне билесиң? 3. Башка жактагы досторуна өз жериң тууралуу кат жазып, билдир."},{"t":"p","h":"Кайталоо:"},{"t":"p","h":"Кыргызстандагы областтарды картадан көрсөт. Чүй аймагы жөнүндө айтып бер. Ош областы тууралуу айтып бер. Жалал-Абад областы тууралуу айтып бер."},{"t":"p","h":"<span class=\"pg\" data-n=\"99\">99<\/span>Ысык-Көл областынын артыкчылыгын белгиле. Нарын областы тууралуу айтып бер. Баткен областы тууралуу айтып бер. Ар бир областтын өзгөчөлүгүн белгиле. Жалпы Кыргызстанга тиешелүү баалуулуктарды белгиле."}],"sub":[{"title":"Суроолор жана тапшырмалар","b":5}],"pages":[98,99]},{"title":"МАЗМУНУ","blocks":[{"t":"h3","h":"МАЗМУНУ"},{"t":"p","h":"АТА МЕКЕНИМ – КЫРГЫЗСТАН ........ 3"},{"t":"p","h":"КЫРГЫЗСТАНДЫН ЭЛИ ........ 6"},{"t":"p","h":"МЕЙКИНДИКТИН ЖАКТАРЫ ........ 9"},{"t":"p","h":"АТА МЕКЕНИМДИН ЖАРАТЫЛЫШЫ ........ 17"},{"t":"p","h":"ТООЛОР ........ 17"},{"t":"p","h":"КЫРГЫЗ ТОКОЙЛОРУ ........ 36"},{"t":"p","h":"КЕН БАЙЛЫКТАР ........ 65"},{"t":"p","h":"ЖЕР ТААНЫ, ЭЛ ТААНЫ ........ 80"},{"t":"h3","h":"<span class=\"pg\" data-n=\"100\">100<\/span>ОКУУ КУРАЛЫ"},{"t":"p","h":"Мамбетова З. Ж."},{"t":"p","h":"Иманалиев Ч."},{"t":"h3","h":"МЕКЕН ТААНУУ"},{"t":"v","l":["Кыргыз жери – керемет","3-класс үчүн окуу китеби","3-басылышы","","Редактору: Г. Исмаилова","Корректору: К. Асылбекова","","Көлөмү 6,25 физ. басма табак.","Форматы 60х84 1/16.","","АОООТ «Эркин-Тоо»","720040, г. Бишкек, бул. Эркиндик, 45","","Заказ № 547"]}],"sub":[{"title":"ОКУУ КУРАЛЫ","b":9},{"title":"МЕКЕН ТААНУУ","b":12}],"pages":[100,100]}],"fixed":true,"quality":"proofread"};</sc   // ---------------------------------------------------------------- storage helpers
  function lsGet(k, def) { try { var v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode: ignore */ } }

  var toastTimer;

  function fetchJSON(url) {
    // revalidate with the server, so a corrected book or a new book list shows up on the next visit

  }

  var app = document.getElementById('app');

  // ================================================================ LIBRARY
  function cacheName(b) { return 'book-' + b.id + '-' + b.v; }

  // The library is organised by school (language of instruction), then grade, then subject.

  var SCHOOLS = [['ky', 'Кыргыз мектеби'], ['ru', 'Русская школа']];

  // Subjects in the order the ministry lists them. A book's subject comes from its "subject"
  // field when index.json has one, otherwise from its title; a title that matches nothing
  // becomes its own subject, so new books always show up.
  var SUBJECTS = [
    ['kyrgyz-tili', /кыргыз тили|кыргызский язык/, 'Кыргыз тили', 'Кыргызский язык'],
    ['kyrgyz-adabiyat', /кыргыз адабият|кыргызская литература/, 'Кыргыз адабияты', 'Кыргызская литература'],
    ['russkiy-yazyk', /русский язык|орус тили/, 'Орус тили', 'Русский язык'],
    ['russkaya-literatura', /русская литература|литературное чтение|орус адабият/, 'Орус адабияты', 'Русская литература'],
    ['adabiyat', /адабият|литератур/, 'Адабият', 'Литература'],
    ['matematika', /математик|алгебр|геометр/, 'Математика', 'Математика'],
    ['fizika', /физик/, 'Физика', 'Физика'],
    ['himiya', /хими/, 'Химия', 'Химия'],
    ['biologiya', /биолог/, 'Биология', 'Биология'],
    ['geografiya', /географ/, 'География', 'География'],
    ['istoriya-kg', /кыргызстан\S* тарых|история кыргызстана/, 'Кыргызстандын тарыхы', 'История Кыргызстана'],
    ['istoriya-mir', /дүйнө тарых|орто кылым|жаңы тарых|соңку тарых|байыркы|всемирная история|средних век|новая история|новейшая история|древн/, 'Дүйнө тарыхы', 'Всемирная история'],
    ['religii', /диндер|религи/, 'Диндердин тарыхы', 'История религий'],
    ['obshchestvo', /адам жана коом|человек и общество/, 'Адам жана коом', 'Человек и общество'],
    ['grazhdanstvennost', /гражданствен|жарандык/, 'Жарандык', 'Гражданственность'],

  function subjectOf(b) {
    var s = String(b.subject || b.title || '').toLowerCase();
    for (var i = 0; i < SUBJECTS.length; i++) {
      if (b.subject === SUBJECTS[i][0] || SUBJECTS[i][1].test(s)) return { key: SUBJECTS[i][0], order: i, name: SUBJECTS[i][S.ui === 'ky' ? 2 : 3] };
    }

  // "My books": books the reader opened or added, stored on the phone. 1 = in the list,

  function myState() { return lsGet('mybooks', null) || {}; }
  function inMy(id) { var s = myState()[id]; return s === 1 || (s !== 0 && !!lsGet('pos:' + id, null)); }
  function setMy(id, on) { var s = myState(); s[id] = on ? 1 : 0; lsSet('mybooks', s); }

  var libHash = '#/'; // where the reader's back button returns to

  function libShell(title, link, main) { // main: the library page (intro text and school switch)
    document.title = title;

    app.innerHTML = '<div class="lib"><div class="lib-head"><button class="icon burger" aria-label="' + esc(t('menu')) + '">' + ICONS.menu + '</button><h1>' + esc(title) + '</h1>' + link + '</div>' +
      (main ? '<p class="sub">' + esc(t('appSub')) + '</p><div class="school">' + SCHOOLS.map(function (o) {
        return '<button data-s="' + o[0] + '"' + (o[0] === school ? ' class="on"' : '') + '>' + esc(o[1]) + '</button>';
      }).join('') + '</div>' : '') +
      '<div id="books"><div class="loading">' + esc(t('loading')) + '</div></div></div>';
    $('.burger', app).onclick = openMenu;
    Array.prototype.forEach.call(app.querySelectorAll('.school button'), function (btn) {
      btn.onclick = function () {
        S.school = S.ui = btn.getAttribute('data-s'); applySettings();

  var LIST = null; // the last book list loaded, for the reader's quality badge
  function loadList() {
    return fetchJSON('books/index.json').then(function (list) { LIST = list; return list; }).catch(function (e) {
      $('#books').innerHTML = '<div class="loading">' + esc(t('err')) + '</div>'; throw e;

  function showLibrary() {
    libHash = '#/';
    var school = libShell(t('appTitle'), '<a class="btn my-link" href="#/my">' + esc('★ ' + t('my')) + '</a>', true);
    loadList().then(function (list) {
      list = list.filter(function (b) { return !b.school || b.school === school; });
      var grades = [];
      list.forEach(function (b) { gradesOf(b).forEach(function (g) { if (grades.indexOf(g) < 0) grades.push(g); }); });
      grades.sort(function (a, b) { return a - b; });
      var open = lsGet('libOpen', {});
      var box = $('#books');
      box.innerHTML = grades.length ? '' : '<div class="loading">' + esc(t('noBooks')) + '</div>';
      grades.forEach(function (g) {
        var books = list.filter(function (b) { return gradesOf(b).indexOf(g) >= 0; });
        var sec = document.createElement('section'); sec.className = 'grade';
        sec.innerHTML = '<button class="grade-h"><span>' + esc(g + ' ' + t('grade')) + '</span><span class="n">' + books.length + '</span></button><div class="grade-b"></div>';
        var head = $('.grade-h', sec), body = $('.grade-b', sec);
        function setOpen(on) {
          sec.classList.toggle('open', on);
          body.innerHTML = '';
          if (on) bySubject(books, body, false);
        }
        head.onclick = function () {
          var on = !sec.classList.contains('open');
          Array.prototype.forEach.call(box.querySelectorAll('.grade.open'), function (s) { if (s !== sec) { s.classList.remove('open'); $('.grade-b', s).innerHTML = ''; } });
          setOpen(on);
          open[school] = on ? g : null; lsSet('libOpen', open);
          if (on && sec.scrollIntoView) sec.scrollIntoView({ block: 'start' });
        };
        box.appendChild(sec);
        if (open[school] === g) setOpen(true);

  function showMyBooks() {
    libHash = '#/my';
    libShell(t('my'), '<a class="btn my-link" href="#/">' + esc('‹ ' + t('allBooks')) + '</a>', false);
    loadList().then(function (list) {
      var box = $('#books');
      var mine = list.filter(function (b) { return inMy(b.id); });
      box.innerHTML = '';
      if (!mine.length) { box.innerHTML = '<div class="loading">' + esc(t('myEmpty')) + '</div>'; return; }
      var grades = [];
      mine.forEach(function (b) { var g = gradesOf(b)[0]; if (grades.indexOf(g) < 0) grades.push(g); });
      grades.sort(function (a, b) { return (a == null ? 99 : a) - (b == null ? 99 : b); });
      grades.forEach(function (g) {
        var sec = document.createElement('section'); sec.className = 'grade open';
        sec.innerHTML = '<h2 class="grade-t">' + esc(g == null ? '' : g + ' ' + t('grade')) + '</h2><div class="grade-b"></div>';
        bySubject(mine.filter(function (b) { return gradesOf(b)[0] === g; }), $('.grade-b', sec), true);
        box.appendChild(sec);
      });
    });

  // The menu (☰ in the library header): the site's pages, as a panel sliding in from the left.
  function openMenu() {
    var bg = document.createElement('div'); bg.className = 'sheet-bg';
    var nav = document.createElement('nav'); nav.className = 'drawer';
    var cur = location.hash || '#/';
    var items = [['#/', t('allBooks')], ['#/my', '★ ' + t('my')], ['#/missing', t('missing')], ['#/news', t('news')]];
    nav.innerHTML = '<div class="drawer-h"><span>' + esc(t('appTitle')) + '</span><button class="icon x" aria-label="' + esc(t('close')) + '">' + ICONS.close + '</button></div>' +
      items.map(function (it) { return '<a href="' + it[0] + '"' + (it[0] === cur ? ' class="cur"' : '') + '>' + esc(it[1]) + '</a>'; }).join('') +
      (API ? '<p class="note">' + esc(t('reportHint')) + '</p>' : '');

  }

  var MONTHS = {
    ru: ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'],
    ky: ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь']
  };
  function fmtDate(d) { // "2026-09-29" -> "29 сентября 2026" / "29-сентябрь, 2026"
    var m = String(d).match(/^(\d{4})-(\d\d)-(\d\d)/); if (!m) return d;
    return S.ui === 'ky' ? +m[3] + '-' + MONTHS.ky[+m[2] - 1] + ', ' + m[1] : +m[3] + ' ' + MONTHS.ru[+m[2] - 1] + ' ' + m[1];
  }
  function bookLink(b) {
    return '<a href="#/read/' + esc(b.id) + '">' + esc(b.title + (b.grade ? ', ' + b.grade + ' ' + t('grade') : '')) + '</a>';
  }

  // "What's new": site/changelog.json, newest first. Each entry: {"date": "YYYY-MM-DD", "ru": "...", "ky": "...",
  // "books": [book ids, optional]}. Book-publishing threads add an entry at the top with every publish.
  function showNews() {
    libHash = '#/news';
    libShell(t('news'), '', false);
    Promise.all([fetchJSON('changelog.json'), LIST ? LIST : loadList().catch(function () { return []; })]).then(function (r) {
      var byId = {}; r[1].forEach(function (b) { byId[b.id] = b; });
      var log = r[0].slice().sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
      var html = '<p class="sub">' + esc(t('newsSub')) + '</p>', last = null;
      log.forEach(function (e) {
        if (e.date !== last) { html += '<h2 class="news-d">' + esc(fmtDate(e.date)) + '</h2>'; last = e.date; }
        var books = (e.books || []).map(function (id) { return byId[id]; }).filter(Boolean);
        html += '<div class="news"><p>' + esc(e[S.ui] || e.ru) + '</p>' + (books.length ?
          (books.length > 4 ? '<details><summary>' + esc(t('booksInEntry') + ' (' + books.length + ')') + '</summary>' : '<div>') +
          '<ul class="news-b">' + books.map(function (b) { return '<li>' + bookLink(b) + '</li>'; }).join('') + '</ul>' +
          (books.length > 4 ? '</details>' : '</div>') : '') + '</div>';
      });
      $('#books').innerHTML = html;
    }).catch(function () { $('#books').innerHTML = '<div class="loading">' + esc(navigator.onLine === false ? t('offline') : t('err')) + '</div>'; });
  }

  // Approved textbooks we could not find online: site/missing.json. Each entry: {"school": "ru"|"ky", "grade", "title",
  // "authors", "status": notfound|sample|closed|kyonly|edition, "note_ru", "note_ky", "live": id of a version in the library}.
  // A book that goes live is removed from that file.
  var MSTATUS = { notfound: 'mNotfound', sample: 'mSample', closed: 'mClosed', kyonly: 'mKyonly', edition: 'mEdition' };
  function showMissing() {
    libHash = '#/missing';
    libShell(t('missing'), '', false);
    Promise.all([fetchJSON('missing.json'), LIST ? LIST : loadList().catch(function () { return []; })]).then(function (r) {
      var byId = {}; r[1].forEach(function (b) { byId[b.id] = b; });
      var list = r[0], school = S.school || (S.ui === 'ky' ? 'ky' : 'ru');
      var html = '<p class="sub">' + esc(t('missingSub')) + '</p><p><button class="btn jump">' + esc(t('haveItJump') + ' ↓') + '</button></p>';
      SCHOOLS.filter(function (sc) { return sc[0] === school; }).concat(SCHOOLS.filter(function (sc) { return sc[0] !== school; })).forEach(function (sc) {
        var rows = list.filter(function (m) { return m.school === sc[0]; });
        if (!rows.length) return;

          if (m.grade !== lastG) { html += '<h3 class="subj">' + esc(m.grade + ' ' + t('grade')) + '</h3>'; lastG = m.grade; }
          var live = m.live && byId[m.live];
          html += '<div class="bk miss"><div class="bk-t">' + esc(m.title) + '</div><div class="bk-m">' + esc(m.authors || '') + '</div>' +
            '<div><span class="ms ms-' + esc(m.status) + '">' + esc(t(MSTATUS[m.status] || 'mNotfound')) + '</span></div>' +
            ((m['note_' + S.ui] || m.note_ru) ? '<div class="note">' + esc(m['note_' + S.ui] || m.note_ru) + '</div>' : '') +
            (live ? '<div class="note">' + esc(t('mKyLink')) + ': ' + bookLink(live) + '</div>' : '') + '</div>';
        });
      });
      html += '<div class="offer" id="offer"><h2>' + esc(t('haveIt')) + '</h2><p>' + esc(t('haveItText')) + '</p>' +
        (API ? '' : '<p class="note">' + esc(t('uploadSoon')) + '</p>') + '</div>';

  // ---- sending to the server (API): error reports and uploaded books
  function api(path, opts) {
    return fetch(API + path, opts).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function postJSON(path, data) {
    // text/plain keeps this a "simple" request (no CORS preflight), which is faster on slow phones
    return api(path, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(data) });
  }
  // Reports made offline wait on the phone and go out with the next one, or when the app opens online.
  function sendReports() {
    var q = lsGet('reports', []);
    if (!API || !q.length || navigator.onLine === false) return Promise.resolve(false);
    var r = q[0];
    return postJSON('/reports', r).then(function () {
      lsSet('reports', lsGet('reports', []).filter(function (x) { return x.at !== r.at; }));
      return sendReports().then(function () { return true; });
    }, function () { return false; });
  }
  function report(r) {
    r.at = Date.now();
    lsSet('reports', lsGet('reports', []).concat([r]));
    return sendReports();
  }

  var CHUNK = 8 * 1048576, MAX_FILE = 500 * 1048576;
  function uploadForm(box, list) {
    var f = document.createElement('form'); f.className = 'up';
    f.innerHTML = '<label>' + esc(t('upBook')) + '</label><select name="book">' + list.map(function (m, i) {
      return '<option value="' + i + '">' + esc(m.title + ', ' + m.grade + ' ' + t('grade') + ' (' + m.authors + ')') + '</option>';
    }).join('') + '<option value="-1">' + esc(t('upOther')) + '</option></select>' +
      '<label>' + esc(t('upFiles')) + '</label><input type="file" name="files" multiple accept="application/pdf,image/*">' +
      '<label>' + esc(t('upContact')) + '</label><input type="text" name="contact" maxlength="200" autocomplete="off">' +
      '<label>' + esc(t('upComment')) + '</label><textarea name="comment" rows="2" maxlength="2000"></textarea>' +
      '<button class="btn primary" type="submit">' + esc(t('upSend')) + '</button><div class="progress" hidden><i></i></div>';
    box.appendChild(f);
    var btn = $('button', f), prog = $('.progress', f), bar = $('.progress i', f);
    f.onsubmit = function (e) {
      e.preventDefault();
      var files = Array.prototype.slice.call(f.files.files);
      if (!files.length) { toast(t('upNoFiles')); return; }
      for (var i = 0; i < files.length; i++) if (files[i].size > MAX_FILE) { toast(t('upTooBig') + files[i].name); return; }
      var m = list[+f.book.value], total = files.reduce(function (a, x) { return a + x.size; }, 0) || 1, sent = 0;
      btn.disabled = true; btn.textContent = t('upSending'); prog.hidden = false; bar.style.width = '0';
      postJSON('/uploads', { book: m ? m.title + ', ' + m.grade + ' (' + m.school + '): ' + m.authors : 'other', contact: f.contact.value, comment: f.comment.value, lang: S.ui })
        .then(function (up) {
          // each file goes in pieces, so a big scan survives a slow mobile connection
          return files.reduce(function (p, file) {
            return p.then(function () {
              return postJSON('/uploads/' + up.id + '/files', { name: file.name, size: file.size, type: file.type }).then(function (fr) {
                var parts = [], n = 0;
                function next() {
                  var start = n * CHUNK; if (start >= file.size && n > 0) return Promise.resolve();
                  var piece = file.slice(start, start + CHUNK), num = ++n;
                  return api('/uploads/' + up.id + '/files/' + fr.file + '/' + num, { method: 'PUT', body: piece }).then(function (pr) {
                    parts.push({ n: num, etag: pr.etag }); sent += piece.size; bar.style.width = Math.round(sent / total * 100) + '%';
                    return next();

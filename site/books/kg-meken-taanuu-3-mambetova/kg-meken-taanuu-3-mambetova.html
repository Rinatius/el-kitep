<!doctype html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Мекен таануу 3</title>
<style>/* Mobile textbook reader. No external fonts or libraries: everything works offline. */
:root {
  --bg: #ffffff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3;
  --panel: #f6f6f6; --accent: #1f6feb; --accent-fg: #ffffff;
  --fs: 19px; --lh: 1.55;
  --font: Georgia, "Noto Serif", "DejaVu Serif", "Times New Roman", serif;
  --bar-h: 48px; --foot-h: 28px;
}
[data-theme="sepia"] { --bg: #f5ecd9; --fg: #4a3b2a; --muted: #8a7458; --line: #e0d2b4; --panel: #ece0c6; --accent: #9a5b13; }
[data-theme="dark"]  { --bg: #111315; --fg: #d8d8d8; --muted: #8c8c8c; --line: #2a2d31; --panel: #1b1e21; --accent: #6ea8ff; --accent-fg: #0b0b0b; }
[data-theme="contrast"] { --bg: #000000; --fg: #ffffff; --muted: #c8c8c8; --line: #444; --panel: #151515; --accent: #ffd400; --accent-fg: #000; }
[data-font="sans"] { --font: Roboto, "Noto Sans", "DejaVu Sans", Arial, sans-serif; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 16px/1.4 Roboto, "Noto Sans", Arial, sans-serif; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- Library ---------- */
.lib { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lib h1 { font-size: 22px; margin: 8px 0 4px; }
.lib .sub { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.lib-head { display: flex; align-items: center; gap: 10px; margin: 8px 0 4px; }
.lib-head h1 { flex: 1; margin: 0; }
.school { display: flex; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.school button { flex: 1; min-height: 44px; padding: 0 10px; font-size: 15px; background: var(--panel); }
.school button + button { border-left: 1px solid var(--line); }
.school button.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.my-link { flex: 0 0 auto; font-weight: 600; min-height: 40px; padding: 0 12px; font-size: 14px; }
.grade { margin-bottom: 10px; }
.grade-h { display: flex; width: 100%; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 18px; font-weight: 600; text-align: left; }
.grade-h::after { content: '›'; font-size: 24px; color: var(--muted); margin-left: 10px; transition: transform .15s; }
.grade.open .grade-h::after { transform: rotate(90deg); }
.grade-h .n { margin-left: auto; font-size: 14px; font-weight: 400; color: var(--muted); }
.grade-b { padding: 0 2px; }
.grade-t { font-size: 20px; margin: 18px 0 0; }
.subj { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
.bk { border-bottom: 1px solid var(--line); padding: 4px 0 12px; }
.bk:last-child { border-bottom: 0; }
.bk-t { font-size: 17px; font-weight: 600; }
.bk-s { font-size: 14px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bk-m { color: var(--muted); font-size: 13px; margin: 3px 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; text-decoration: none; color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.btn[disabled] { opacity: .5; }
.progress { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 10px; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.bk-h { display: flex; align-items: flex-start; gap: 4px; }
.bk-h .bk-t { flex: 1; padding-top: 10px; }
.bk .row { gap: 4px; }
.bk .row .btn { min-height: 40px; padding: 0 18px; font-size: 14px; margin-right: 8px; }
.bk .icon { color: var(--muted); flex: 0 0 auto; }
.bk .icon[disabled] { opacity: .5; }
.bk .icon.on { color: var(--accent); }
.bk .star.on svg { fill: currentColor; }
.bk .star.on { color: #e3a008; }
.share-opts { display: flex; flex-direction: column; gap: 10px; }
.share-opts .note { margin-top: 0; }
.sheet h3 .icon { flex: 0 0 auto; }

/* ---------- Reader ---------- */
.reader { position: fixed; inset: 0; overflow: hidden; touch-action: pan-y; user-select: text; }
.viewport { position: absolute; left: 0; right: 0; top: 0; bottom: var(--foot-h); overflow: hidden; }
.flow {
  height: 100%; column-fill: auto; padding: 20px 0 12px;
  font-family: var(--font); font-size: var(--fs); line-height: var(--lh);
  will-change: transform; transform: translate3d(0,0,0);
  hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word;
}
.flow.anim { transition: transform .25s ease-out; }
.flow p { margin: 0 0 .15em; text-indent: 1.4em; text-align: left; }
.flow p.ni { text-indent: 0; }
.flow h1, .flow h2, .flow h3 { font-family: Roboto, "Noto Sans", Arial, sans-serif; line-height: 1.25; break-after: avoid; page-break-after: avoid; }
.flow h1 { font-size: 1.35em; margin: .2em 0 .8em; text-align: center; }
.flow h2 { font-size: 1.15em; margin: 1.1em 0 .5em; }
.flow h3 { font-size: 1.0em; margin: 1em 0 .4em; }
.flow .verse { margin: .6em 0 .8em 1em; break-inside: auto; }
.flow .verse div { text-indent: -1em; padding-left: 1em; text-align: left; }
.flow .verse .gap { height: .7em; }
.flow figure { margin: .8em 0; text-align: center; break-inside: avoid; page-break-inside: avoid; }
.flow figure img { max-width: 100%; height: auto; border-radius: 4px; background: var(--panel); }
.flow figcaption { font-size: .8em; color: var(--muted); margin-top: .3em; }
.flow .box { border-left: 3px solid var(--accent); padding: .1em 0 .1em .7em; margin: .7em 0; }
.flow .pg { font: 11px/1 Roboto, Arial, sans-serif; color: var(--muted); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 4px; margin: 0 3px; vertical-align: 2px; text-indent: 0; white-space: nowrap; user-select: none; }
.flow .end { height: 1px; }
.flow .endnote { text-align: center; color: var(--muted); font-size: .8em; margin-top: 2em; font-family: Roboto, Arial, sans-serif; }
[data-theme="dark"] .flow img, [data-theme="contrast"] .flow img { filter: brightness(.9); }

.foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot-h); display: flex; align-items: center;
  justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.foot .t { overflow: hidden; text-overflow: ellipsis; margin-right: 12px; }

.bar { position: absolute; left: 0; right: 0; background: var(--panel); border-color: var(--line); z-index: 5;
  transition: transform .2s; display: flex; align-items: center; }
.bar.top { top: 0; height: var(--bar-h); border-bottom: 1px solid var(--line); transform: translateY(-100%); padding: 0 4px; }
.bar.bottom { bottom: 0; border-top: 1px solid var(--line); transform: translateY(100%); padding: 10px 16px 14px; flex-direction: column; align-items: stretch; gap: 6px; }
.reader.ui .bar { transform: none; }
.bar .title { flex: 1; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.icon { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 22px; }
.icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bar input[type=range] { width: 100%; accent-color: var(--accent); height: 28px; }
.bar .info { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }

/* ---------- Sheets (TOC, settings) ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 85%; overflow: auto; background: var(--bg);
  border-radius: 16px 16px 0 0; z-index: 11; padding: 8px 16px 24px; -webkit-overflow-scrolling: touch; }
.sheet h3 { margin: 10px 0 12px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; }
.toc a { display: block; padding: 11px 4px; border-bottom: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 15px; }
.toc a.sub { padding-left: 20px; font-size: 14px; color: var(--muted); }
.toc a.cur { color: var(--accent); font-weight: 600; }
.set { margin: 14px 0; }
.set label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); font-size: 15px; }
.seg button.on { border: 2px solid var(--accent); font-weight: 600; }
.swatch[data-v="light"] { background: #fff; color: #1b1b1b; }
.swatch[data-v="sepia"] { background: #f5ecd9; color: #4a3b2a; }
.swatch[data-v="dark"] { background: #111315; color: #d8d8d8; }
.swatch[data-v="contrast"] { background: #000; color: var(--accent-fg); }
.goto { display: flex; gap: 8px; }
.goto input { flex: 1; min-height: 44px; font-size: 16px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

.toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 16px;
  border-radius: 20px; font-size: 14px; z-index: 20; max-width: 90%; text-align: center; }
.loading { padding: 40px 16px; text-align: center; color: var(--muted); }

/* ---------- Textbook elements produced by tools/convert_pdf.py ---------- */
.flow .tasks, .flow .gloss { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45;
  background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0; }
.flow .tasks p, .flow .gloss p { margin: 0 0 .35em; text-align: left; }
.flow .gloss { border-left: 3px solid var(--accent); }
.flow p.note { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; font-style: italic; text-indent: 0; margin: .6em 0; }
.flow p.attr { text-align: right; text-indent: 0; font-style: italic; color: var(--muted); margin: .1em 0 .8em; }
.flow p.sep { text-align: center; text-indent: 0; color: var(--muted); margin: .5em 0; letter-spacing: .3em; }
.flow h2 .pg, .flow h3 .pg { font-weight: normal; }
.toc .sec { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 4px 2px; }
.toc a .p { float: right; color: var(--muted); font-size: 13px; margin-left: 8px; }

/* ---------- Elements produced by tools/convert_layout.py (typeset textbooks) ---------- */
.flow figure img { cursor: zoom-in; }
.flow h4.mk { font: 700 .78em/1.3 Roboto, "Noto Sans", Arial, sans-serif; letter-spacing: .05em; color: var(--accent);
  margin: 1em 0 .3em; break-after: avoid; page-break-after: avoid; }
.flow p.hl { color: var(--accent); text-indent: 0; }
.flow p.small { font-size: .82em; text-indent: 0; color: var(--muted); }
.flow sup, .flow sub { font-size: .7em; line-height: 0; }
.flow .kbox { font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .88em; line-height: 1.45; background: var(--panel);
  border-radius: 8px; padding: .45em .7em; margin: .5em 0; border-left: 3px solid var(--accent); }
.flow .kbox > b { display: block; }
.flow .frame { background: var(--panel); border-radius: 8px; padding: .5em .7em; margin: .8em 0;
  font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .9em; line-height: 1.45; }
.flow .frame p { text-indent: 0; margin: 0 0 .35em; text-align: left; }
.flow .tbl { margin: .8em 0; font-family: Roboto, "Noto Sans", Arial, sans-serif; font-size: .8em; line-height: 1.35; }
.flow .tbl .tt { font-weight: 600; text-indent: 0; text-align: center; margin-bottom: .3em; }
.flow .tbl table { border-collapse: collapse; width: 100%; table-layout: fixed; }
.flow .tbl th, .flow .tbl td { border: 1px solid var(--line); padding: .3em .35em; vertical-align: top; text-align: left; overflow-wrap: anywhere; hyphens: auto; }
.flow .tbl th { background: var(--panel); }
.flow .tbl tr { break-inside: avoid; page-break-inside: avoid; }

.zoom { position: fixed; inset: 0; touch-action: pan-x pan-y; -webkit-user-select: none; user-select: none; background: rgba(0,0,0,.92); z-index: 30; }
.zoom-in { position: absolute; inset: 0; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
.zoom-in img { margin: auto; flex: none; touch-action: pan-x pan-y; object-fit: contain; background: #fff; cursor: zoom-in; }
.zoom-x { position: absolute; top: 8px; right: 8px; color: #fff; background: rgba(0,0,0,.5); z-index: 31; }
.flow h4.sh { font: 700 .95em/1.3 Roboto, "Noto Sans", Arial, sans-serif; text-align: center; margin: .8em 0 .4em; break-after: avoid; page-break-after: avoid; }

/* maths books */
.flow h4.ex, .flow h4.try { font-family: Roboto, Arial, sans-serif; margin: 1.1em 0 .3em; font-size: 1em; }
.flow h4.ex { display: inline-block; background: #f7e400; color: #111; padding: .1em .6em; border-radius: 3px; }
.flow h4.try { color: var(--accent); }
.flow p.goal { font-size: .85em; text-indent: 0; background: var(--panel); border-radius: 8px; padding: .4em .7em; }
.flow b.bd { display: inline-block; text-indent: 0; padding: 0 .4em; border-radius: 1em; background: var(--fg); color: var(--bg);
  font: bold .8em/1.45 Roboto, Arial, sans-serif; margin-right: .2em; }
.flow b.nb { display: inline-block; text-indent: 0; min-width: 1.4em; border-radius: 4px; background: var(--accent); color: var(--accent-fg);
  text-align: center; font-size: .8em; margin-right: .3em; }
.flow .fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .85em; line-height: 1.15; margin: 0 .1em; }
.flow .fr > span:first-child { border-bottom: 1px solid currentColor; padding: 0 .15em; }
.flow p.ml { text-indent: 0; padding-left: 1em; }
.flow p.side { font-size: .85em; }
.flow details.ans { margin: .3em 0 .8em; font-size: .9em; }
.flow details.ans summary { color: var(--accent); cursor: pointer; font-family: Roboto, Arial, sans-serif; }

/* wide tables become one card per row on phones */
@media (max-width: 560px) {
  .flow .tbl.cards table, .flow .tbl.cards tbody, .flow .tbl.cards tr, .flow .tbl.cards td { display: block; width: auto; }
  .flow .tbl.cards tr:first-child { display: none; }
  .flow .tbl.cards tr { border: 1px solid var(--line); border-radius: 8px; margin: .5em 0; padding: .3em .5em; }
  .flow .tbl.cards td { border: 0; padding: .15em 0; }
  .flow .tbl.cards td::before { content: attr(data-l); display: block; font: 600 .75em/1.3 Roboto, Arial, sans-serif; color: var(--muted); }
  .flow .tbl.cards td:first-child { font-weight: 600; }
}
.flow figure.vec svg { max-width: 100%; height: auto; display: inline-block; background: #fff; border-radius: 4px; cursor: zoom-in; }
[data-theme="dark"] .flow figure.vec svg, [data-theme="contrast"] .flow figure.vec svg { filter: brightness(.9); }
.flow .rt { border-top: 1px solid currentColor; padding-top: 1px; margin-left: 1px; }
.flow .it { display: inline-block; max-width: 100%; margin-right: .9em; text-indent: 0; }

/* ---------- Text quality badge (library rows, first page of a book, reader top bar) ---------- */
.q { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 10px 2px 8px; margin: 0 8px 2px 0;
  border: 1px solid var(--line); border-radius: 13px; background: var(--panel); color: var(--fg);
  font: 12px/1.2 Roboto, "Noto Sans", Arial, sans-serif; vertical-align: middle; text-indent: 0; white-space: nowrap; }
.q i, .qdot i { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.q-exact i { background: #2da44e; }
.q-proofread i { background: #3b82f6; }
.q-ocr i { background: #e8900c; }
.qdot { display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 12px; }
.qdot i { width: 12px; height: 12px; }
.bk .row .q { margin: 0 0 0 auto; }
.flow .qline { margin: 0 0 1em; text-indent: 0; }
.flow .qline .q { font-size: 13px; cursor: pointer; }
.qsheet .q { font-size: 14px; min-height: 30px; margin: 0 0 4px; }
.qsheet p { font-size: 15px; line-height: 1.5; margin: 10px 0; }

/* ---------- Menu (☰), "What's new", missing books ---------- */
.lib-head .burger { flex: 0 0 auto; margin-left: -10px; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 85%); background: var(--bg); z-index: 11;
  padding: 8px 0 24px; overflow: auto; box-shadow: 2px 0 12px rgba(0,0,0,.2); }
.drawer-h { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 8px 16px; font-weight: 600; font-size: 17px; }
.drawer a { display: block; padding: 14px 16px; color: var(--fg); text-decoration: none; font-size: 16px; border-top: 1px solid var(--line); }
.drawer a.cur { color: var(--accent); font-weight: 600; }
.drawer .note { padding: 8px 16px 0; border-top: 1px solid var(--line); margin-top: 0; }
.news-d { font-size: 15px; color: var(--muted); font-weight: 600; margin: 20px 0 6px; }
.news { border-bottom: 1px solid var(--line); padding: 2px 0 10px; }
.news p { margin: 6px 0; font-size: 15px; line-height: 1.5; }
.news summary { color: var(--accent); cursor: pointer; font-size: 14px; min-height: 32px; line-height: 32px; }
.news-b { margin: 2px 0 4px; padding-left: 20px; font-size: 14px; line-height: 1.8; }
.bk.miss { padding: 8px 0 12px; }
.bk.miss .bk-m { margin-bottom: 6px; }
.ms { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.ms-kyonly, .ms-edition, .ms-sample { border-color: #e8900c; }
.bk.miss .note { margin-top: 6px; font-size: 14px; }
.offer { margin: 24px 0 0; padding: 14px 16px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
.offer h2 { font-size: 18px; margin: 0 0 6px; }
.offer p { margin: 6px 0; font-size: 15px; line-height: 1.5; }
.up label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
.up select, .up input[type=text], .up textarea { width: 100%; min-height: 44px; font-size: 16px; padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-family: inherit; }
.up input[type=file] { font-size: 15px; max-width: 100%; }
.up .btn { margin-top: 14px; width: 100%; }
.up .done { font-weight: 600; }

/* ---------- Report a text error (select text in a book) ---------- */
.rep { position: absolute; left: 50%; bottom: calc(var(--foot-h) + 14px); transform: translateX(-50%); z-index: 6;
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 22px;
  background: var(--accent); color: var(--accent-fg); font-size: 15px; font-weight: 600; box-shadow: 0 2px 10px rgba(0,0,0,.25);
  white-space: nowrap; -webkit-user-select: none; user-select: none; }
.rep[hidden] { display: none; }
.rep svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rq { margin: 0 0 6px; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--panel); border-radius: 6px;
  font-family: var(--font); font-size: 16px; line-height: 1.45; max-height: 30vh; overflow: auto; }
.sheet textarea { width: 100%; font-size: 16px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); font-family: inherit; }
.sheet .rsend { width: 100%; }
</style>
</head>

<script>window.EMBEDDED_BOOK = {"id":"kg-meken-taanuu-3-mambetova","title":"Мекен таануу","subtitle":"3-класс. Кыргыз тилинде окутулган мектептер үчүн","author":"З. Мамбетова","grade":"3","lang":"ky","langName":"Кыргызча","subject":"Мекен таануу","year":2007,"school":"Кыргыз тилинде окутулган мектептер","source":{"site":"mektep.o.kg","page":"https://mektep.o.kg/books/13/?grade=3","note":"Scanned PDF; text by tesseract OCR, AI-proofread."},"notes":"Текст китептин сканерленген нускасынан OCR менен алынып, ЖИ менен текшерилди (ЖИ текшерген). Саптын аягындагы которуу белгилери алынды, беттердин номерлери сакталды.","format":2,"images":[],"chapters":[{"title":"Китеп жөнүндө","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"1\">1<\/span>МАМБЕТОВА З. Ж."},{"t":"p","h":"ИМАНАЛИЕВ Ч."},{"t":"h2","h":"МЕКЕН ТААНУУ"},{"t":"h2","h":"3-КЛАСС үчүн ОКУУ КИТЕБИ"},{"t":"v","l":["Кыргыз Республикасынын","билим берүү жана илим","министрлиги бекиткен"]},{"t":"h3","h":"Бишкек – 2007"},{"t":"p","h":"<span class=\"pg\" data-n=\"2\">2<\/span>Мамбетова З. Ж., Иманалиев Ч."},{"t":"p","h":"М-22 Мекен таануу. Кыргыз жери – керемет: Орто мектептин 3-классы үчүн окуу китеби. – Бишкек, 2007. – 100 б."},{"t":"p","h":"© Мамбетова З. Ж., 2007"}],"sub":[{"title":"МАМБЕТОВА З. Ж.","b":0},{"title":"МЕКЕН ТААНУУ","b":2},{"title":"3-КЛАСС үчүн ОКУУ КИТЕБИ","b":3},{"title":"Бишкек – 2007","b":5}],"pages":[1,2]},{"title":"АТА МЕКЕНИМ – КЫРГЫЗСТАН","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"3\">3<\/span>АТА МЕКЕНИМ – КЫРГЫЗСТАН"},{"t":"p","h":"Кыргыз эли байыркы замандан бери мекендеп жашап келген жер кыргыз өлкөсү, Кыргызстан деп аталат. Ата Мекенибиз бийик тоолуу кооз өлкө. Кайда барбагын, ак мөңгүлүү тоолорду көрөсүң. Шибери жайкалган жайлоолордо, ажайып өрөөндөрдө, эл отурукташкан тоо койнунда болосуң. Шаркырап аккан көк кашка сууларга, карагай-черлүү токойлорго жолугасың. Элибиздин пейли кенен жана меймандос. Мына ушундай асыл жер – биздин Ата мекенибиз."},{"t":"p","h":"Дүйнөгө таанымал «Манас» эпосунда мындай деп айтылат:"},{"t":"v","l":["Кара чепкен, ак калпак,","Калкы сулуу кыргыздын.","Каз айланып кетпеген,","Көлү сонун кыргыздын.","Түрлүү эгин дан бүткөн,","Жери сонун кыргыздын.","Ала-Тоону жай кылган,","Эли сонун кыргыздын."]},{"t":"p","h":"Биз ары кооз, ары асыл Ата Мекенибиз менен ар дайым сыймыктана алабыз."},{"t":"p","h":"«Ар кимдин туулган жери өзүнө ыйык», – дейт элибиз. Ата Мекен сен үчүн атаң менен энеңдей ыйык. Ата-энең сага өмүр берип, жарык дүйнөгө алып келсе, Мекениңде өсүп, чоңоюп келе жатасың. Өз Ата Мекенине кызмат кылуу ар бир адамдын милдети."}],"pages":[3,3]},{"title":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК БЕЛГИЛЕРИ","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"4\">4<\/span>КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК БЕЛГИЛЕРИ"},{"t":"p","h":"Кыргызстан өз алдынча эркин өлкө. Анда кыргыздар жана башка түрдүү улуттагы элдер жашайт. Борбор шаарыбыз – Бишкек. Дүйнөдөгү ар бир мамлекеттин өзүнө таандык Туусу, Герби жана Гимни болот. Биздин өлкөбүздүн да Туусу, Герби жана Гимни бар."}],"pages":[4,4]},{"title":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК ТУУСУ","blocks":[{"t":"h3","h":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК ТУУСУ"},{"t":"p","h":"Биздин мамлекеттик Туубуз 1992-жылы кабыл алынган."},{"t":"p","h":"Туунун түсү эмне үчүн кызыл деп ойлодуң беле? Анын себеби мындай. Манас бабабыз ар дайым өзүнүн ата-бабаларынан калган кызыл тууну алып жүргөнү эпосто айтылат. Ошондуктан, улуттук туубузду кабыл алганда Манас бабабыздын туусунун түсү эске алынган."},{"t":"p","h":"Туудагы негизги белгилер – боз үйдүн түндүгү жана күн. Тууга түндүктүн сүрөтүн түшүрүүнүн себеби мындай: түндүк – адам жашоосунун, үй-бүлөнүн, ынтымактын, элибиздин көчмөндүү тарыхынын символу."},{"t":"p","h":"Туудагы экинчи бир белги – алтын нурун чачырыткан улуу Күн. Башка элдерге Кыргызстан Күнөстүү өлкө катары белгилүү эмеспи. Кыргыз оюмунун элесин берген кырк нур күндөй тегиз чачырап турат."},{"t":"p","h":"Ошентип, Тууда күн менен боз үйдүн түндүгү <span class=\"pg\" data-n=\"5\">5<\/span>айкалышып, алыстан нур чачкан күн-түндүктү элестетет."},{"t":"p","h":"Күн – тынчтыкты, түндүк – эл достугун билдирет."}],"pages":[5,5]},{"title":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК ГЕРБИ","blocks":[{"t":"h3","h":"КЫРГЫЗ РЕСПУБЛИКАСЫНЫН МАМЛЕКЕТТИК ГЕРБИ"},{"t":"p","h":"Кыргыз Республикасынын мамлекеттик Герби 1994-жылы 14-январда кабыл алынган. Гербди карасаң, анын көк түстүү тегерек алкагынан айланта жүргүзүлгөн ак сызыкты көрөсүң. Ортодо канатын жайган ак шумкар учуп келе жаткансыйт. Анын артында Ысык-Көлдүн, Ала-Тоонун жана чыгып келе жаткан алтын нурдуу күндүн сүрөтү тартылган. Эки капталында пахта менен буудайдын сүрөтү бар. Үстү жагында «Кыргыз», төмөн жагында «Республикасы» деп жазылган."},{"t":"p","h":"Ак шумкар Манас бабабыздын шумкары. Ал эми ак мөңгүлүү Ала-Тообуз, мончоктой Ысык-Көлүбүз дүйнө жүзүнө таанымал. Ошондуктан булар Гербге белги катарында кирген."},{"t":"p","h":"Гербдеги сүрөттөр мекенибиздин тоодой бийик, күндөй жарык, көлдөй тунуктугун билдирет. Шумкар – мекенди коргоону, пахта менен буудай жер байлыгын көрсөтөт."},{"t":"p","h":"Мамлекетибиздин Туусу, Герби жана Гимни өлкөбүздүн өзгөчөлүгүн даңазалап турат."},{"t":"p","h":"Суроолор жана тапшырмалар."},{"t":"p","h":"Гербдин сүрөтүн тарт, бое. Туунун сүрөтүн тарт, бое. Гербдеги, туудагы сүрөттөр эмнени билдирет, чечмелеп <span class=\"pg\" data-n=\"6\">6<\/span>айтып бер. Туу, герб кайсы жерлерде болот? Гимн кайсы учурда ырдалат?"},{"t":"p","h":"Кайталоо:"},{"t":"p","h":"«Ата мекеним-Кыргызстан» деген аңгеме түз."}],"pages":[6,6]},{"title":"КЫРГЫЗСТАНДЫН ЭЛИ","blocks":[{"t":"h3","h":"КЫРГЫЗСТАНДЫН ЭЛИ"},{"t":"p","h":"Кыргызстанда 5 миллиондон ашуун эл бар. Биздин өлкөдө азыр 80 ден ашуун ар түрдүү улуттагы – орус, өзбек, уйгур, украин, дунган, корей, татар, казак, азербайжан, авар, кытай жана башка элдер жашашат. Алар качандыр бир кезде көчүп келишкен."},{"t":"p","h":"Суроолор жана тапшырмалар."},{"t":"p","h":"1. Кыргызстанда кайсы улуттагы элдер жашайт? Атап бер. 2. Кайсы тилдерде сүйлөй аласың? Кайсы улуттун тилин түшүнөсүң? 3. Өзбекче, казакча ырдап же бийлей аласыңбы? 4. Кайсы элдердин музыкалык аспаптарын, артисттерин, ансамблдерин билесиң?"},{"t":"p","h":"5. Билген тамак-аштарыңдын кайсы улуттуку экенин бөлүп айтып бер. 6. Башка улуттан досуң барбы? Алардын кандай өзгөчөлүктөрүн билесиң? 7. Кыргызстандагы элдердин достугу жөнүндө аңгемелешкиле."}],"pages":[6,6]},{"title":"КЫРГЫЗ ЭЛИ","blocks":[{"t":"h3","h":"КЫРГЫЗ ЭЛИ"},{"t":"p","h":"Сенин улутуң кыргыз, кыргызча сүйлөй аласың, кыргызча ырдай аласың, жомокторду билесиң. Кыргыздын улуттук кийимдерин, буюмдарын тааныйсың."},{"t":"p","h":"Улууларды сыйлоо, тартиптүү болуу кыргыз баласынын ыйык милдети экенин эсиңден чыгарба."},{"t":"p","h":"<span class=\"pg\" data-n=\"7\">7<\/span>Өзүң да улууларды сыйлап, кичүүлөргө өрнөк бол."},{"t":"p","h":"Кыргыз эли байыртан Ала-Тоону мекендеп, акылман карылары, адептүү, намыстуу жигиттери, сулуу жана ишмер кыз-келиндери, менен сыймыктанып келген. Кыргыздын боз үйүн, шырдак, саймаларын жана башка буюмдарын карап көрсөң, кандай гана кооз! Оюулары тоонун, суунун, аркардын мүйүзүн, куштун канатын, жайлоонун гүлүн элестетип турбайбы."},{"t":"p","h":"Ат чабыш, кыз куумай, улак тартыш, эңиш, күрөш, эр оодарыш, тогуз коргоол сыяктуу оюндарды уккансыңбы? Булар – биздин ата-бабабыз ойногон кыргыздын улуттук оюндары."},{"t":"img","src":"data:image/webp;base64,UklGRkQiAABXRUJQVlA4IDgiAAAQIwGdASoVAikBPq1ImkmmK6imtLXL0XAViWdtmhuai1q5E5IpxJINnfjMK9TVL+I0ofN3/3VOdSLz83/+LT4//i//brpf8/9l6eF1ffJ+7PYR/99pP/m1zbfPiJ10mb3ry7P3gf4Kp9u5bZyKtxzlbrU5xAXPe8lehxDyJ1GnfHunKaAmQocYvDZyMvm3zrW+db899buEeUmU7xRAhlTNW2Zx8hd5ayEKf4hH4i9oerGU5HHXcCHjUqLuyniE62oYXF0Ba5AsCmw4eKwWsJiYFe/ELeuNxEYWNZZfXVRaHJyuwimyJXeI8MjNGiGPKhhgTv1ag0uVx3qU7tCZq/pHz3bqRX4oFieVf2DpvC2P9xPPgp9y3bfDfp5uYT3XyG88py/abhDqGJml06JyGp4ntS1DUJK2OPkrESyFElfDlFDusk//76Qi0cVzSKtYYBDly1asxHvInth7dkXke9BZ6RhDzEf2r+Hy7uP2XRePO7IEcpdOhBzLknafSsleHe5socZ8vTfrVuDM04r2hgmUSaMjeBNflcpBsZhkSHB/Cl0USpULO/hz0uXrAbmRcRzJBMEAg7t6p туу адамдар жөнүндө билесиңби?"},{"t":"p","h":"Мектепке, көчөгө, айылга кээде районго өзгөчөлөнгөн адамдардын ысмын ыйгарабыз. Мисалы, Токтогул району, Баетов айылы, Байтиктин Бас-Бөлтөгү аттуу жерлер бар. Курманжан датка көчөсү, К. Тыныстанов атындагы университет, Б. Бейшеналиева атындагы консерватория жана башкалар бар. Эмне үчүн эл бул адамдарды унутпайт? Анткени алар акылы, таланты, эмгеги, баатырдыгы менен элге кызмат кылган адамдар. Тайлак баатыр, Байтик баатыр, Шабдан баатыр, Курманжан датка деген адамдар жөнүндө уккандырсың. Булар эл башкарган, эл-жерин жоодон коргогон акылман адамдардан болушкан."},{"t":"p","h":"Кыргыздан мыкты окумуштуулар, жазуучулар, акындар. композиторлор, артисттер, киноактерлор, инженерлер, врачтар чыкты."},{"t":"p","h":"Дүйнө жүзүнө белгилүү жазуучу Чыңгыз агайыбыз менен баарыбыз сыймыктана алабыз. Ылайым, кыргыздын билимдүү, таланттуу уул-кыздары көбөйө берсин!"},{"t":"p","h":"Суроолор."},{"t":"p","h":"1. Сен жашаган жерде көчөгө, айылга, мектепке кимдин аты коюлган? Ошол адам жөнүндө эмне билесиң? <span class=\"pg\" data-n=\"9\">9<\/span>2. Эл кандай адамдарды унутпайт? 3. Келечекте элиңе кандай кызмат кылгың келет?"},{"t":"p","h":"Тапшырма."},{"t":"p","h":"Жогорудагы текстте берилген адамдар жөнүндө көбүрөөк билүүгө аракет кыл. «Унутулбас адамдар» деген темада аңгеме түз."},{"t":"h3","h":"Кайталоо"},{"t":"p","h":"Кыргызстанда кайсы улуттагы элдер жашайт? Кыргыз эли кандай өзгөчөлүктөрү менен даңкталат? Кыргызстандын өнүгүшү үчүн салым кошкон белгилүү адамдарды атап бер."}],"sub":[{"title":"Кайталоо","b":10}],"pages":[8,9]},{"title":"МЕЙКИНДИКТИН ЖАКТАРЫ","blocks":[{"t":"h3","h":"МЕЙКИНДИКТИН ЖАКТАРЫ"},{"t":"p","h":"Мейкиндиктин чыгыш, батыш, түндүк, түш-түк деген жактары бар."},{"t":"p","h":"Эртең менен күн чыгып келе жаткан тарап – Күн чыгыш же Чыгыш, ал эми күн баткан жак – Күн батыш же Батыш деп аталат. Ошентип, бул жактар байыркы замандардан бери күнгө байланыштуу аталып келе жатат."},{"t":"p","h":"Илгери, илгери бир хан: «Чыгыш менен Батыштын аралыгы канча?» – деп табышмактуу суроо берген экен. Ошондо эл арасынан бир акылман жигит туура жооп тааптыр. Анын жообу мындай: «Чыгыш менен Батыштын аралыгы бир күн, эртең менен күн чыгат да, кечинде батат. Ошентип күн өтөт.» Албетте, Чыгыш менен Батыштын аралыгы абдан алыс. Акылман жигит бул аралыкты күндүн өтүшү менен болжолдогон."},{"t":"p","h":"<span class=\"pg\" data-n=\"10\">10<\/span>Суроолор жана тапшырмалар."},{"t":"p","h":"1. Батыш, Чыгыш, Түндүк, Түштүк деген эмне? Эмне үчүн мындай аталып калган? 2. Оң-сол, өйдө-төмөн, жогору-ылдый жактарды көрсөт. 3. Мектептин батыш, чыгыш, түндүк, түштүк жактарын көрсөт. 4. Төмөндөгү сөздөрдү улап жаз: Түн..., түш... . 5. Батыш, Чыгыш, Түндүк жана Түштүктүн оң менен солдон кандай айырмасы бар?"},{"t":"v","l":["Сөз үйрөн.","Батыш, Чыгыш, Түштүк, Түндүк.","Төмөнкү ырды окуп, ыр боюнча текст түз."]}],"pages":[10,10]},{"title":"МЕЙКИНДИКТИН ЖАКТАРЫН ТАБУУ","blocks":[{"t":"h3","h":"МЕЙКИНДИКТИН ЖАКТАРЫН ТАБУУ"},{"t":"v","l":["Асман жердин чектери","Тийишкендей сезилген,","Мейкиндиктин сызыгы","ГОРИЗОНТ деп чечилген.","Күн боюнча аныктайт","Горизонттун жактарын.","Так көрсөткөн илимде","КОМПАС дешет аспабын","Чак түш ченде көлөкөң","Чагылса бет алдында.","ТҮНДҮК болуп маңдайың","ТҮШТҮК калат артыңда.","Козголбостон пайдалан","Бул мисалдын жардамын.","КҮН ЧЫГЫШЫҢ оң жакта,","КҮН БАТЫШЫҢ сол жагың.","А. Карымшаков"]}],"pages":[10,10]},{"title":"КҮН БОЮНЧА МЕЙКИНДИКТИ АНЫКТОО","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"11\">11<\/span>КҮН БОЮНЧА МЕЙКИНДИКТИ АНЫКТОО"},{"t":"p","h":"Силер шаардын же айылдын четине саякатка чыктыңар дейли. Мугалим окуучуларды 4 топко бөлдү. 1-топтогулар чыгышты, 2-топтогулар батышты, 3-топтогулар түштүктү, 4-топтогулар түндүктү карай жөнөшү керек. Силер мейкиндиктин жактарын, өз багытыңарды кантип аныктайсыңар? Мындай учурда багытты күнгө карай аныктоо оңой."},{"t":"p","h":"Чак түштө күн төбөдөн тиет. Ошол учурда көлөкө түндүк тарапка түшөт. Эгерде чак түштө өз көлөкөңөр түшкөн жакты карап турсаңар, алды жагың түндүк, арт жагың түштүк, оң жагың чыгыш, сол жагың батыш болот."},{"t":"p","h":"Суроолор."},{"t":"p","h":"1. Түндүктү, түштүктү көрсөт. Кайсы тарап түндүк, кайсы тарап түштүк? 2.Батышты, чыгышты көрсөт. Кайсы тарап батыш, кайсы тарап чыгыш?"}],"pages":[11,11]},{"title":"КОМПАС","blocks":[{"t":"h3","h":"КОМПАС"},{"t":"img","src":"data:image/webp;base64,UklGRq4LAABXRUJQVlA4IKILAAAQcQCdASoSAd4APqlMnUmmJKMhNhRpcMAVCWVu3VuE4mI5/lVmiZfD/ux75PM1/4dp3gCKYnLvjytJVNzFu4nZDVJ77+1TZoNE4MP1tEyYUlY8FFjqQSDMsCBZBIYbEwT3/nSQrTN9/hEDsccxRCjuz5xBPsucyvnjjJfdP2Eovvxdy1On9GpXI1FAXbi/WioeN3InZ3+LwQzLL4iiopf8xH2S/d68aBl5cJ9JsR8/vIg/CBp04XP76zKth2/FtG1G5GtHFdqhA/ARsm3Ahtt6g1aeYW++jc6ejyLN/sg1zkW987psthQhoAcT+/vj3N3Dy64eBq//WmB+FJ9rWt1KFZuBbDNQzRdxr/EpsJfFsR8UR/KCLuM3z1kNlG7doltAqzJaFk7HHfyTZLkNrw/WPROSqe9sQohAkzTjRbRN1H4kaTek437rlE1uAXiz5wBqrhL7GbdRxbhZkAqx1EbWl7hkAI7OzN8sJsHtoyzMLLv+oBwAfKZcPBcsD6vP2gT7UhkM7aHrFPUfKSKyVxOFpjqWICYV8BlgYxogG9YIxjKPkkQRB55BD1i12dMU/UWudUvlKIZ83nHjnFfkCzkIIi8Wi8XoHYNlnZTzAYJFtwW8m0V16fT+bZy3kcsVk0ZlABwDh2EleqyyTvbyoA4n5s5b45F1Kr2Y5Sud9RotmRAJn1F9fwMpUotke8KgKxcr+xEuC9ZY3REw+9XOKeRVIp4DWrc4IUejIlII9pksRyx5gbJiJy3egnOITBjjSv7u4RUpYAI17mb5GunxLJ1wkNvJU2VkqtW9enEPrtNQ9NDc47BmdZiLjoC+SXihz3wpPAvDcLdrEmCfrgz0Tm1QIZtfhs9O2RJBOhCWSxtTwxQn0m5Xt5fTEI7/AW7wFtXSQI7DhE788Gsu5o6ygvPflVgKGWyZJUMU/j3dfe254lfqsBE2WVsqKnKOKOsrQwQJt/Ff0u27QWG5PKA7SYFeIXdvQ+XoKZPB3nsrkPpBiJuUnCNavL4OZG9aaCgOWWshc1djYn3i5hm/U0lJUA6toY8v+v4KLwzf5/jG0FDVE59IncoOT75MKT1UQo4FVuqwxtthV9viF5bl4xEhejy97JfwUfSRDbo6nkUf82P/Dy6EwUukHqYFVCDiezBJjyUErxBkrUX9ipPLB6sboFeWNQYESOuv+gFNhsTBS4rOWYRikNWs63SMLF+T00AsS/CAAP76toCNLGQrPlPyHjsPK1X7H0xPvJ0WTch6wNaer+aJWed7RHgSoJotubNeL7cmuO2xljWHSVwjWVQourrw+px5KibCyoMncBy7L4gABt9UUb+RVHvrr2cZzFzghH9feK7tnkfprfNNsRkzUfmpfbdbpdcOGCqELAAHzisFk26LdE3m6OUGuovRezMzsllsy2QrwRJqV1deh/3BffS0tgoNME4CGZFJnjbsncsQwwl6uCdsf3/SwKs+LZN7/FjlaPqXbkaWOdHOAASkttRtDThsYJONZXIx7ssXzhT22+3MC2CKxr24gFU1SEYLDcpQypq30El1e6ehU2ujEcWnrmeCRLmIjkOD88bqe+z гын да бир барак кагазга эле чиймесин чийип алууга болот. Мындай чийме карта деп аталат."},{"t":"p","h":"Картага түздүктөр, тоолор, суулар, шаарлар түшөт. Чоң шаар кичинекей картага кантип батат деп таң калышың мүмкүн. Мисалы, Бишкек шаары картада жөн эле тегерекче менен берилген. Башка шаарлар да ошондой белгиленген. Демек, тегерекче шаарды билгизген белги турбайбы. Картада ар кандай белгилер көп, аларды шарттуу белги деп атайбыз."},{"t":"p","h":"Картаны окуй билүү кызык. Анда тоолор күрөң, талаа-түздөр жашыл, суулар көк түстө берилген. Демек, кайсы жер тоо, кайсы жер суу экенин картаны карап, дароо эле байкайсың."},{"t":"img","src":"data:image/webp;base64,UklGRtIcAABXRUJQVlA4IMYcAADw1gCdASosAjcBPrVUpEwnJSetK9UpMaAWiWdDJ9XoQBsjkLCWSE2Hgf8Dc9Zgv1jS/OenlHIBzMUT1+hq088AOZ7Dvdq13eLbUVIC/RZ8gIfn4jXN5a6EaViPoSxle4HLGQzXl2gpynVz3rQ7kgShC5L8epuZ1jyT8whFEDQ+jVFUvzwghWl/FvjNf1FMAE/9R/ofDEXvb4lfCXUGDoJ7VK/srjnmggNQsJ2dfiBai6c84DPsVYSIKIVlkZ+o1FR47Z5AGaVEyqEY2Iq0BJDNESCSc8nrAG8Mu+eI9nh4CyOJHxLCusXBLJgaINe9A5GfAHRc+qxmTpe0twQ9Am+6Xpeq9WrkAFzSmmjC9rENVi6lUtiYlV2rUpI5G0dzTSjImg4P6uv0o/C1Mxmu5A8JT6HWswnA+nZ1bwEXEk/XM7DovMEfJ+IDKyd7WDlQHZnJS1uSvPGOsMjj59rsKe8Hca05J+k9aGzRrNb3VV+yIbsm801hm3wkwA0WMNJEQZwDW28s1xtPuwPWplS/PCUQyI1a/v2FOyyyqTeVv3Z2vB3yqjpbyLYx4yZ3DdfTckjfviIIZh5euHHVvpY9VujV3o5mOmh2JbiFly0ENP6r7xCb1aRun4lMeQko7F46N4QGi1x2jaiYoqAsbdML7lcJpnabQkjbxnBpgHmaZxDM+EWVZ0S+mII6PLgXStC1Wi5FWFwMHj3AZ1fYbt0ZWS6KMyitolPJ87h/8vuFNEBsXasteRvnWqTN8qYTxDdH+KXT0ZqU5K9SlwXr50RxmravqNfT9ieI3tiTou24XpUGaebIfscUbS0JowPWz3lUNR2MnxsgzNDm9hMzN2B08+IZ28nRj1Q2HM1mZ7F+PTHfGBoMYEAvrqHkYON67ZBw8SuJukQc+XL3MWdNGaHIpCFA4Z48+Ar4JnldGsbPLKlUXaLRvczdeOQSM3bwuyKJcAWdWINcfCAKpo68yDzmymueCG/+LGAqoY8y4+Te5OGZK1UzfSBHnEMlSBi0+pFWgaN6qwjKEyPpmmblkftz0EN0N39+V49srNab8DDbBgkETKNY6UfaOP/pL25E6ShtHpPtjh7JQW/+1JioswQc/1JXqxi9MvApnyOdsdcZaYNxALWKWDcSzFcCqFgoIPhPz4cac77f2t5Z6ux1WsrziVnIlxzGh2FvfjO0hGIJWjn4zQWyNVQHpUAc7FlsBHWsHyFc4nqJ/iY9FTF/wAVFBe9IHg10K7l6eFUo6pPZIPP4CsAw0tOG7nNnDFUl3mI1Q7isB9NjMXYcVcsl9iNz1LsLWpVQOE го караштуу. Бир нече райондор бир областты түзөт. Кыргызстанда 7 область бар. Алар – Чүй, Талас, Ош, Жалал-Абад, Нарын, Ысык-Көл, Баткен."},{"t":"p","h":"Эмне үчүн биз жашаган жер картада кичине көрүнөт? Себеби картага бүт Кыргызстанды батыруу үчүн чоң мейкиндиктерди кичирейтип тартууга туура келет. Ошентип, чоң аймактар картада кичинекей эле чекит болуп калат."}],"pages":[16,16]},{"title":"ШААР ЖАНА АЙЫЛ","blocks":[{"t":"h3","h":"ШААР ЖАНА АЙЫЛ"},{"t":"p","h":"Сабакка карата суроолор."},{"t":"p","h":"Айылда жашайсыңбы же шаардабы? Өзүңдүн айылың же шаарың жөнүндө айтып бер. Айыл менен шаардын кандай айырмасы бар?"},{"t":"p","h":"Биздин өлкөнүн борбору – Бишкек шаары. Андан кийинки чоң шаарлар, Ош, Токмок, Жалал-Абад, Каракол, Нарын, Талас. Чакан, бирок өсүп келе жаткан дагы бир топ шаарларыбыз бар."},{"t":"p","h":"<span class=\"pg\" data-n=\"17\">17<\/span>Суроолор жана тапшырмалар."},{"t":"p","h":"1. Картадан Бишкек, Ош, Токмок, Жалал-Абад, Нарын, Талас шаарларын көрсөт. 2. Дагы кайсы шаарларды билесиң? 3. Шаар жөнүндө айтып бер. Шаар менен айыл турмушун салыштыр. 4. Кинодон кайсы шаарларды көргөнсүң? Шаарларды салыштыр, сага кайсы шаарлар жагат?"}],"pages":[17,17]},{"title":"АТА МЕКЕНИМДИН ЖАРАТЫЛЫШЫ","blocks":[{"t":"h2","h":"АТА МЕКЕНИМДИН ЖАРАТЫЛЫШЫ"},{"t":"p","h":"Силер тоолорду ар дайым көрүп жүрөсүңөр. Кыргыз жеринде тоо көп. Кайда барсаң тоону көрөсүң. Ал тургай шаардын ичинде да тоо болот. Мисалы, Ош шаарынын ичинде Сулайман тоосу бар. Ысык-Көлдү тегерете тоо курчап турат. Нарын болсо тоонун мекени. Биздин өлкө тоолору менен көрктүү жана кереметтүү. Ошондуктан Кыргызстандын картасы күрөң кызыл түстө. Себеби тоолуу жер картада ушундай түс менен белгиленет. Тоолор тээ алыстан эле заңкайып, чокусу ак мөңгүгө курчалып созулуп жатат. «Карааныңдан кагылайын Ала-Тоо», – деп ата-бабаларыбыз караан туткан тоолор – ушул."},{"t":"p","h":"Биздин ата-бабаларыбыз душмандардан коргонуу учун башка элдер сыяктуу чеп курушкан эмес. Тоолор чеп катары кызмат кылган. Илгерки i1okOzkKXd6MOmTCRsYAAAAA=","w":449,"ht":554},{"t":"p","h":"<span class=\"pg\" data-n=\"18\">18<\/span>Тоо арасы кооз, эс алуучу жерлер көп. Бул жерде төрт түлүк мал багылат. Башка жактан келгендер Ала-Тоонун көркүнө суктанып кайтышат. Кышкысын балдар лыжа, чана тээп ойношот."},{"t":"p","h":"Тоонун чокусундагы жайы-кышы эрибеген музду мөңгү деп аташат. Алыстан ак ала болуп көрүнгөн бул – мөңгү, Мөңгүнүн жанына барсаң, кыш мезгилиндегидей үшүйсүң. Мөңгү – кыргыз жеринин баа жеткис байлыгы. Күрпүлдөп аккан тоо суулары мөңгүнүн эришинен пайда болот."},{"t":"p","h":"Жапыз тоолорду бөксө тоо, адыр дешет. Андан жапыздары дөбө деп аталат."},{"t":"p","h":"Тоолор кыркалай тизмектешип керилип жатат. Муну тоо кыркасы деп коюшат. Ар бир тоо кыркасында бийик чокулар, аска-зоолор кездешет."},{"t":"p","h":"Тоо кыркаларынын арасында ойдуң жерлер, өрөөндөр орун алган. Кээ бир жерлерде мындай өрөөндөр кууш келет. Андай жерлерди капчыгай дешет. Тоо кыркасынын жапызыраак келген жери ашуу деп аталат."},{"t":"p","h":"Бийикке чыгыш кыйын. Бийик тоодо адамдын мурдунан кан агып, дем ала албай кыйналат. Муну түтөк деп коюшат."},{"t":"p","h":"Бирок бийик тоонун айрым ооруларды айыктыруучу касиети бар. Суусамырдагы Төө-Ашуу деген <span class=\"pg\" data-n=\"19\">19<\/span>бийик белде каны аздарды жана астма ооруларын айыктыруучу жай бар."},{"t":"p","h":"Кыргызстанда бийиктиги бир нече километрге жеткен чокулар бар. Эң бийик «Жениш» чокусу 7440 метрге жетет."},{"t":"p","h":"Тоого кыялай жол салбаса, машиналар жүрө албайт. Ошон учун тоодогу жолдор ийри-буйру келет."},{"t":"p","h":"Кээде жолду кыскартыш үчүн тоону тешип, туннель (тешкен тоо) казышат. Бишкек – Ош жолунда, Төө-Ашууда кыска жол менен өтүүгө мүмкүнчүлүк түзүлгөн. Бул жерде узундугу эки жарым километрге жеткен туннель бар."},{"t":"p","h":"Суроолор жана тапшырмалар."},{"t":"p","h":"1. Эмне деген тоолорду билесиң, атап бер. 2. Эмне үчүн Кыргызстандын картасы кызыл-күрөң түстө?"},{"t":"p","h":"3. Биздин тоолор эмне учун Ала-Тоо деп аталат көптү билип аласың. Кыргыз жери дары чөптөргө бай. Билип дарыланса, чөп ар кандай оорулардан айыктырат."},{"t":"p","h":"<span class=\"pg\" data-n=\"26\">26<\/span>Дары чөптөрдү пайдаланууну үйрөн."}],"pages":[26,26]},{"title":"БАКА ЖАЛБЫРАК","blocks":[{"t":"h3","h":"БАКА ЖАЛБЫРАК"},{"t":"img","src":"data:image/webp;base64,UklGRv4SAABXRUJQVlA4IPISAACQowCdASo5AZgBPrVUpEsnLSOhrLZpQaAWiWdu3V4tgXQozDG0mOfH1dD5mephpEt/fDp4glbdnhOkf/vrMfr5V6BInoDxuY08EcLc6rVUi/1ba96WoQlcLkjWOroZxnnSN3B1oYGAyJ5+xxBhIrhYx+hCRiLZg8TKQj7rLarYKLuMXxBtKvW7/kkquwRwoC1iSu0dlgVTklnyrVhtqVzJ8Wv3yrz/SLiu9Egr16rpn44T5a/YuuxJekkM2p3Rxc/JwHLG+a2LE4wqeZTKDNHk/Lt/BXLlPuzGopuhHUcscByxvXXcBVJhp6L5UZRNs2nNV6ggTu0Iao3CvCQ8PT9t8q9AkDx+1+e4V9qr84Mo1ZaqKRs0Z4n8pobfKvQJE8NQUXecznnD3MfE/o2b0LupVLK2dN5Soh1k4KUjD0fY4DljgOViz92pnYKVO33BN4eP7JkTyRJnPbeweCvkvMpnVInoEiegO1Q3OMUeGuu/ulpGwYSqllbCSF0tpaF3hWuAgl5Q1jLGjFvoqCvTHhuSggW5EjE4y80piLsRbFg/QJE9AkTz8nuKJpPYpxK+CZg+APeG/gG1m6zT5cdOIn4bkSyyxInoD+5VdObPV8dsrcCnj8/p36qaJE/4gsnyvzdU2U0EL+37zZx/npdQ9bJN3aSjv1gy7/iyxwHHVPD1o8Fmj3bT+F7PbnYOVXJsAl/0O+0fT78e/bIYjfnvdVZIwkyE6sBMQdzVbljUQbZmx3kkMbcvbL9TMNs5392N5yjgzS+BdatdWXEmGaduhPQCaoEEjCUxGqe9thPLmVa93Ro4oYClf4azi9GUhzf2WeUf867pSbHmM6OfBt6+XxEX9P23W+K5mxICMtF0bZq+W1UaIc7anFOaCJ3uGSX4I25kwuyEdjF5h6yzPygt65W9rJAmWc/VWaskMGzRE/JUzeRd5fs/ZlS+RfAxI3MggapWosRRmJ+BA7cG+Nb7+/Ex5UcIPXBUNZQwIuomm5+uGhNoBIB5tncv8lSIFjF8XbIcA0bqHCBQGqi+wjQa4QRfaZd5g7tKDsY87j7IAmnHrznKCVd9J4FX2QuaTPB+z5cOz+8B9g6NOe0uiv8+DGNVAXNmEdUff1fwHdGtmTTZNdwUQ8AYEf1oK21l46ezrzLUkrSWWB/9K9/NW+hIh0GJ52cX3/vgF6Hdby+NNe+t5mpg67xgwVgWu5g9IIAPewQcJs7dId2pHJvj6l9Tok7O9h42xv5Pg8iS0IfEoShr8AxIlfebitAeLjzORFWYfW9wMrPOjDsRqGNbi+yjl69LCLoATjWcmJl+HXWLJXR7pMdPWh0DFUINZ8F2LIZEZt6dIFVmbbNge+krrjEG2QVwqXDr1Unnns3DrxxjH9KuQerfOKmk7Ctt8hZByJQLgZqIc7gdZjlG2WkO1zh6s9OE8ZOn32CEX6QEGWIc32Oba+PkYChprQs5QiaTQm7PI7W0ywC8DKfngET+5Kea1GnghoqApuyOfxQKQHQWbxRSjCev+TUdEmvp3zxCI1E16m41ysmU7T/n3GjPc8WsLHKXy3V5ijy24f+N32rsvof6TAWNPF3zr/EWtGq1js2ZTfZ4B1tvZOQPfL1m6MyALxhjW42kykkBatBXPSsmwJJLMmCd9IY3 FbbaspKxS3jaMjR7RuhWyryYQAABwAhWrBfc4GnAAAA=","w":318,"ht":465},{"t":"p","h":"Эрмен менен шыбактын жыты буркурап турат. Алардын дарылык касиети да бар. Шыбакты кайнак сууга салып, ошол сууну өсүп келе жаткан жашылчаларга чачса, курт жолобойт. Илгери: котур оорусун шыбак, эрмендин суусу менен дарылашкан. Эрмен, шыбак жеген мал ичегисиндеги курттардан арылат."},{"t":"p","h":"Эрмендин кабыгы, жүгөрүнүн чачысы, алоэ, пияз, сарымсак жана башка көп өсүмдүктөрдүн адамга дарычылыгы бар."},{"t":"p","h":"Суроолор жана тапшырма."},{"t":"p","h":"1. Дары чөптөрдү ата. 2. Дары чөптөрдү кантип кургатат? 3. Өзүң жашаган жердеги дары чөптөр жөнүндө айтып бер, алардын сүрөтүн тарт."}],"pages":[28,28]},{"title":"ТОО ЖАНЫБАРЛАРЫ","blocks":[{"t":"h3","h":"ТОО ЖАНЫБАРЛАРЫ"},{"t":"p","h":"Кыргыз тоолорунда аркар, кулжа, тоо эчки, илбирс, суур, кашкулак, карышкыр, түлкү, чөө, сүүлөөсүн, аюу жана башка жаныбарлар жашайт."},{"t":"p","h":"Тоонун бийик жерине, аска-зоокаларга чыктың беле? Бийик зоодо кандай жаныбар жүрө алат? Тоо эчкилер, аркар-кулжалар мына ошондой бийик жерди мекендейт."},{"t":"p","h":"<span class=\"pg\" data-n=\"29\">29<\/span>Айрыкча тоо эчки бийикке көнгөн шамдагай жаныбар. Алар таштан ташка секирип, буту илинген жерге чыгып, чымын-куюн болуп чуркашат. Тоо эчкинин эркеги – теке, ургаачысы – эчки деп аталат. Жапайы койдун ургаачысын – аркар, эркегин – кулжа дейбиз. Тоо эчкилер жана аркар-кулжалар тоо-ташка түспөлдөш келип, алыстан оңойлук менен байкалбайт."},{"t":"p","h":"Жайылып оттоп жүргөндө, бирөө бийикке чыгып, эки жакты байкап турат. Алардын жыт алуу сезими күчтүү. Душман келе жатканын байкаса, дароо үн чыгарып белги берет. Оттоп жүргөндөрдүн баарысы дүргүп качып жөнөйт. Ошентип, душманынан качып кутулушат."},{"t":"img","src":"data:image/webp;base64,UklGRnYgAABXRUJQVlA4IGogAAAwMAGdASrCAZsBPqlKmUmmJ62ms3n82bAVCWltcJmwAaYJsP9OCIJdNnLPaH8DayzkXcHc/L/a8pAligv/+gF/0lsuzZ/f37mN+Of6v/56/L/P/hen/rr78MqfML/+ekP4R/4680AFpmM/d0j5c/JiDmYNQQx8/gRFU3Z5Iudb8C9jAwcde15ojf+SZU6LtJ6K+ "Илгери-илгери, байыркы заманда кыргыздар тоо-тоодо көчүп-конуп жашаган кезде Кожожаш деген көзгө атар мерген чыгыптыр. Ал аткан жаанын жебеси эзели сая кетпей, түз эле мээлеген жерине кадалчу экен. Кожожаш мерген күн сайын аң уулап, тоодон жаныбарларды атып келип, бир <span class=\"pg\" data-n=\"31\">31<\/span>айыл элди багып жүрүптүр. Бара-бара мергенчилигин улантып, тоо эчкилердин көбүн кырып жоготот."},{"t":"p","h":"«Балам, кайберендин тукумун көп кырбасаңчы?! Бизди каргап койбосун»,— деп акылман карыялар ага насаат айтышат. Кыргыздар жапайы кой-эчкилердин түпкү атасын кайберен деп аташчу. Кайберен бирде адамга айланып, бирде кой-эчки түспөлүнө келип кубулуп турат деп элестетишчү. Кайберен көзгө көрүнбөй жапайы кой-эчкилерди коргоп жүрөт деп ойлошчу."},{"t":"p","h":"Мергенчилер 999 жаныбар аткандан кийин курал-жарагын таштаган. Миңинчи окту аткан эмес. Миңинчи жаныбарды атса, ал өлөрдө башы менен жерге тикесинен сайылып оңко турат. Демек, эми атканды токтот деген белги бергени. Аңчылыкты дагы улантса, анда анын үйүнөн кырсык кетпейт, оору-сыркоо көбөйөт. Ошондуктан элдер ачкадан өлбөс үчүн гана, айла жок аңчылыкка чыгышчу."},{"t":"p","h":"Койду мууздарда: «Сенде жазык жок, менде азык жок»,— деп айтышкан экен. Кожожаш шартты бузуп, улуулардын тилин албай мергенчилигин уланта берет. Күндөрдүн биринде аң уулап жүрсө, алдынан Сур эчки чыгып адамча сүйлөйт:"},{"t":"p","h":"– Кожожаш! Биздин тукумду кырып түгөтмөй болдуң! Бул жарык дүйнөдө биз да жашайлы, эми мергендигиңди токтот, – дептир. Кожожаш ага болбойт, бир күнү Алабаш деген текени атып, жарадар кылат."},{"t":"p","h":"– Жан соога, мерген, жан соога! Алабашты мага бер, өлтүрбө! Айыктырып алайын, – деп Сур эчки <span class=\"pg\" data-n=\"32\">32<\/span>жалынат. Кожожаш Сур эчкинин сөзүн укпай, Алабаштын башын кесип алат. Ошондо эчки Кожожашты каргайт да: «Кой десем болбодуң, эми кыйын болсоң, мени кууп жетип ал», – дейт."},{"t":"p","h":"Кожожаш Сур эчкини бир нече күн кууп, жетпей коет. Улам жакындап келет, бирок жетпейт. Экөө тең аябай чарчайт."},{"t":"p","h":"Кожожаш эчкинин артынан сая түшүп, акыры бийик аскага чыгып кетет. Кайра төмөн түшө албай асканын чокусунда калат. Ошондо Сур эчки Кожожашты минтип каргаптыр:"},{"t":"v","l":["Арка жагың аска таш,","Айылыңды көрбө, Кожожаш.","Үстү жагың үйдөй таш,","Үйүңдү көрбө, Кожожаш.","Шаты койсо жетпесин,","Кожожаш качан өлөт деп,","Үстүңдөн жору айланып кетпесин."]},{"t":"p","h":"Ошентип, Кожожаш бийик аскадан түшө албай өлгөн дешет."},{"t":"p","h":"Суроолор."},{"t":"p","h":"1. Кожожаш мерген жөнүндө айтып бер. Эмне үчүн ал күндө мергенге чыккан? 2. Кайберен деген эмне?"},{"t":"p","h":"3. Карыялар ага кандай акыл-насаат айтышкан? Кожожаш эмне үчүн алардын сөзүн уккан жок? 4. Байыркы мергенчилер эмне үчүн миңинчи окту атышкан эмес? Сөз үйрөн «Мерген», «көзгө атар мерген», «жаа», «жебе», «кийик», «кайберен», «жан соога» деген сөздөрдү пайдаланып, текст түз."},{"t":"h3","h":"<span class=\"pg\" data-n=\"33\">33<\/span>Эсине тут!"},{"t":"p","h":"Күнөөсү жок айбанаттарды кырган адам ушинтип ар кандай кырсыктарга кабылат, биздин байыркы ата-бабаларыбыз жаратылышка кастык кылба деп үйрөтүшкөн. Алардын осуяттарын унутпа!"}],"sub":[{"title":"Эсине тут!","b":14}],"pages":[31,33]},{"title":"ЖАЙЛООДО","blocks":[{"t":"h3","h":"ЖАЙЛООДО"},{"t":"p","h":"Сабакка карата суроолор."},{"t":"p","h":"1. Жайлоодо болдуң беле? 2. Жайлоону кандай элестетесиң? 3. Эмне үчүн жайлоо деп аталат?"},{"t":"p","h":"Тоо арасы түркүн кызыктарга бай. Аска-зоокалары, кокту-колоттору, мөңгүлөрү, туптунук булактары, күрпүлдөп аккан суулары унутулгус элес калтырат. Тоо арасында чөбү жайкалган, абасы таза, суусу тунук, малга да, адамга да жагымдуу жерлер кездешет. Аны жайлоо деп аташат. Эл жайында ушундай жерлерге мал багышат. Жайлоонун чөбү күчтүү келип, мал бат семирет."},{"t":"img","src":"data:image/webp;base64,UklGRrIYAABXRUJQVlA4IKYYAADw1gCdASoUAucAPrVQn0unLK2qLZL7cbAWiWVsx++6T1jMFWnLFySMV1Sgz4g/l1dpu53Lu8tl9oDaOKOn+Z5P/2H/c2/aK8avIP1RLG0EPrsMS/7ti/X64BeM/2Tt8f+ \" data-n=\"37\">37<\/span>оңой, ал эми аны өстүрүш үчүн абдан көп убакыт кетет. Кыргыз жерине көрк берген токойлорубузду коргойлу."},{"t":"h3","h":"Эсине тут!"},{"t":"p","h":"Токойду кыйып түгөтсө ошол жерде кургакчылык болуп, тоодо көчкү жүрөт. Отун даярдоо үчүн карт дарактарды кыйып куураган бутактарды жыйноо керек."},{"t":"p","h":"Токойго мал жайба. Канаттуулардын уясын бузба."},{"t":"p","h":"Суроолор жана тапшырмалар. 1. Токойго бардың беле? Токой кандай болот? Токойдо эмне бар? 2. Токой кантип пайда болот? 3. Токой менен паркты салыштыр. Окшоштугу барбы? Айырмасы кандай? 4. Эмне үчүн токойду коргоо керек? 5. Эгер силер жакта токой бар болсо, ал жерден көргөндөрүңдү айтып бер."}],"sub":[{"title":"Эсине тут!","b":7}],"pages":[36,37]},{"title":"БУГУ ЭНЕ","blocks":[{"t":"h3","h":"БУГУ ЭНЕ"},{"t":"p","h":"Кыргыз эл жомогу"},{"t":"p","h":"Илгери, илгери кыргыздар Энесай деген жерде жашап турган кезде кыргыз айылын жоо чаап, бир да кишини калтырбай өлтүрүп, мал-мүлкүн талап, үй-жайын тыптыйпыл кылып өрттөшөт. Токойго бүлдүркөн тергени кеткен бир кыз менен бир бала гана аман калат. Душмандар бул экөөнү да жок кылып, кыргыздын атын биротоло өчүрмөк болушат. <span class=\"pg\" data-n=\"38\">38<\/span>Бул ишти Жез кемпирге дайындашат. Жез кемпир эки баланы сууга агызып өлтүрөрдө кайдан-жайдан бугу пайда болуп, адамча сүйлөйт:"},{"t":"img","src":"data:image/webp;base64,UklGRoYoAABXRUJQVlA4IHooAABQiQGdASrCAS0CPrFOnEmyrC8tMLU8wlAWCWdtk5CwMaZj0wGeCip5yrsf9EcqJJh10557us+w+oB+t/KBtIlHX/k8qgRJJNS/h4W0KHJ/Xdb8O/8vnt+Lf73///6HnD+T/zP/3/uentsv7/M+n/tzB//vqT+D//GvqzuFGsM+iYa0gkG3QbAvblEfal7kEAG7zrBXN3mFZpU5JeKKwd/ODD3WqQSh6bSBGMayAiRlO28fE1OoIcLmeqTPXu37Hg0BHhuJnYAzScdgk9FEblp/STiovU/yoyOieOpPP0WZdXmBsFMHFzJUo5TXr1UuGvPQ+GbY9H0ZprBA1bIzEa+JRc4cTCfb19o2edVhtGHI8VSu/uNSqChWsbi7OloEsQkS9nm66LVlrdfdNRWURM9x5XCCLU38YW59Nb8qw7GqwP7AdBzHuuSAuOy0n3KLfktHjICxtpYYWFWQwO8xHVrDHHGOIxi/KKKuE1GAk+FORyTsyB7bpcoDCVBoVQHbtmppZxKeENLKuvGTjI1iz4kVh9y0ST6tlGQfuSmD1dfGP6Pu7+8Xvf4GYvvVXlT5R/sYgyOjUTMyxv н кандай экенин али билбейт турбайсыңбы! – деп башын чайкады Майрык Чаар Жез кемпир. – Адамдар эч кимди аябайт. Кийин өз көзүң менен көрөрсүң, өз мойнуң менен тартарсың."},{"t":"p","h":"– Эч ким таппас алыс жакка алып кетем бу балдарды. <span class=\"pg\" data-n=\"39\">39<\/span>Аясаң, акылман чоң эне, кое берсең. Өз балдарымдан кем көрбөй асырайын, жетимдерге эне болоюн."},{"t":"p","h":"– Кантейин, болуптур, – деди ойлонуп туруп Майрык Чаар Жез кемпир. – Сурап калдың, ал, бирок тез кет бул жерден. Жетимдерди алыс жериңе аман жеткир. Жок, эгер аякка жетпей жолдо өлсө, же каракчылар жайласа, же өздөрү чоңоюп алып, ак сүтүңдү унутуп, адамдык арамдыгына кетсе, өзүңөн көр."},{"t":"p","h":"Бугу Эне Жез кемпирди алкап узатты да, анан балдарга кайрылды:"},{"t":"p","h":"– Балдарым, мен эми силердин энеңермин. Силерди ак карлуу Ала-Тоосу, күмүштөй Теңир-Тоосу, боорунда токой-чери, ортосунда мөлтүр Ысык-Көлү бар жерге алпарам. Экөөндү кыргыз тукумун уласын, ал жер силерге мекен болсун деп Теңирден сурап алдым, – дейт."},{"t":"p","h":"Ошентип, алар узак жол басып, далай кыйынчылыктарды көрүп, эки жыл өткөндө Ысык-Көлгө келишет. Анан Ысык-Көлдү мекендеп, жыргап-куунап жашап калышат. Кыз менен бала бойго жетип үйлөнүшүп, бала-бакыралуу, небере-чөбөрөлүү болушат. Тукуму көбөйүп, Бугу деген бир уруу эл жаралат. Токойдогу бугу-маралдар сан жетпей көбөйөт. Аларга эч ким тийбейт, эч ким үркүтпөйт. Алдынан бугу чыкса, элдер жол бошотуп, ар дайым Бугу Эненин тукумун урматташат. Бир күнү жылкысы сан, кою түмөн бир бай киши каза болот. Балдары жер дүңгүрөтө аш берет. «Атабыз мүйүздүү Бугу Эненин тукумунан болчу, эми ата тукумунун <span class=\"pg\" data-n=\"40\">40<\/span>даңкын чыгарабыз», – деп байдын балдары токойдон бугу аттырып, анын мүйүзүн атасынын күмбөзүнө орнотушат."},{"t":"p","h":"– Бугу Эненин тукумуна кантип кол көтөрдүңөр? – деп аксакалдар нааразы болушат."},{"t":"p","h":"– Атылган бугу биздин жердин бугусу. Өз жерибиздин макулугун эмне кылсак, өз ишибиз, – дешет байдын көпкөн балдары. Ошондон баштан элдер тоодогу бугуларды атып, мүйүзүн ала баштайт. Бугу-маралдар үйүр-үйүрү менен кырылат. Акыры көлдүн айланасында бугу-маралдар жоголот, токой ээн калат. Бугу Эне адамдардын арамдыгына нааразы болот. Калган маралдарын ээрчитип, Ысык-Көл аймагын таштап, башка тарапка ооп кеткен дешет. Көрдүңөрбү балдар, кайберендерге абдан этият мамиле кылуу зарыл. Антпесе алар башка жакка ооп кетип калат."},{"t":"p","h":"Чыңгыз Айтматовдуку боюнча"},{"t":"p","h":"Суроолор жана тапшырма."},{"t":"p","h":"1. Жомокту кезектешип окугула. 2. Бугу эне кыргыздын балдарына кантип жолукту? 3. Кыргыздын балдары Ысык-Көлгө кандайча келип калышты?"},{"t":"p","h":"4. «Бугу» деген уруу кантип пайда болду? 5. Адамдар бугуларга кандай мамиле жасады? 6. Бугулар эмне үчүн кетип калышты? Эмне үчүн азыр токойдо бугулар жок? 7. Ойлонуп көр. Өз алдыңча аңгеме түз."},{"t":"p","h":"Адамдардын бугуларга жасаган мамилеси туурабы?"},{"t":"p","h":"<span class=\"pg\" data-n=\"41\">41<\/span>Үйдөн оку"}],"pages":[38,41]},{"title":"ТОКОЙДОГУ ТИРИЧИЛИК","blocks":[{"t":"h3","h":"ТОКОЙДОГУ ТИРИЧИЛИК"},{"t":"p","h":"Суу жээгиндеги токойдо жашоону көз алдыбызга элестетеличи. Ат-Башы суусунун жээгиндеги бир көрүнүштү окумуштуу А. Кыдыралиев мындайча сүрөттөп жазган:"},{"t":"p","h":"«Бул токойдо көп сандаган таандар, кара чыйырчыктар балапан басып чыгарат. Чар каргалар чурулдап, адамдын сөзүн угузбайт. Айры-куйруктар, күйкөлөр чымын-чиркейлерди, чычкандарды жеп, токойго пайда келтиришет."},{"t":"p","h":"Токойдо кечкисин кызыктуу."},{"t":"img","src":"data:image/webp;base64,UklGRmYoAABXRUJQVlA4IFooAABQcAGdASqdAQECPrVOnUmnLCmzsrRqCnAWiWluQoeEMXx2GYugbtl8SvI7wtLN5UvmhtJ9oAv+j/P+rXzyLrcz/hXlD+O/4//38afbN/wg5eBH///2PYT/2+gv4l/p626GL7+eIJWxZ+jn3/6QxDnjbuX/8vQMxol5mh6E12//Qf8v/A6q6MujjhAY2Obvz9XeyTF3OjDAXkPfnwiGBMJjw7tpsDRskJWUMum6bcVh6Vqnxift3FenZ/p+IR36mn2LziOpiaRvx9N2QHDfBMLxg9K8h3vg4A5rEiUaknjE5z8CEWl4UXMUlRhtJCvbPhUcqyJ0fMeG9UXFiQo55zy0KZ0a+w+DsXJzvB7lw/KRetTr10NOvdB1axotx51iDU6/r/qb/DW9ljkc5g9  Арсланбабда, Кара-Алмада, Сары-Челекте, Ош аймагынан Өзгөндө мөмөлүү жапайы токойлор көп, Таш-Көмүр шаарынын чыгыш тарабында Нарын дарыясынын жээгинде Разан-Сай деген коктуда анар көп, ошондой эле инжир, жүзүм, тыт, бадам, мисте да өсөт. Бул жердеги жапайы жемиштердин чоңдугу, сапаты кадимки адам өстүргөн сорттордон кем калышпайт. Разан-Сайга жакын жердеги Күрп-Сай коктусу да ар кандай өсүмдүктөргө бай. Ал жерде айрыкча жапайы жүзүмдөр көп. Алар даракка жармашып бийик өсөт. Жапайы жүзүм Аксы жана Жаңы-Жол коктуларында да көп өсөт."},{"t":"p","h":"Жапайы өрүк Боом капчыгайында, Кеминде, Аркытта бар."},{"t":"img","src":"data:image/webp;base64,UklGRrY0AABXRUJQVlA4IKo0AADwZgGdASqAAvAAPqVEnUmmJCMkNZTOOMAUiU2og/eQDZkLd+Wv0rru68tvkvzM/k6PmBlzbnd+196X1K3G+FYJp9SfbS029CdOn/3/zPYx3w3fvpAb38Tv/72b/J//7ubh0P/67/ZQJBvzoMVbwk3EYJzybNhDVc45kSWQdOsph158NAwgCJn8U6nw+h2A4Qtti/B/tLme80whw0Q7qxZp2vFq0htLzfHNQeO2dZiHgVOoQA4pBPTPIw2sGoiBsaqKka5gVs0A3s4LEtTbR3AOHZ4L/inKYfmFa87lRYRqVvtlBisgAy9KRZsvkLwE0hgJ8U/KXUIVBEXlA4YdUIPkrSmnvsVW1m2+6k80k2UyIFye0YrW80jCVNnDnWVd8fb+dy65b1YlgpCg3lSlXR9GBGYiyYNp5GwWsdbWzp3Z1uWzMX8h7EH67QfNUhWVY3Q3TIjirXC8vbxDO0WqwGThdw/lqWVUJFmMsR8uTRL21Td1TIUqnhpbu6d792VitLVUOfVqrFGI2wHD9j4DvTfIUZnbCpXKjyYflP6ikMtlVta2VwmXKoxC55TqOckQ1ZYa/EYykGjI3CoROxMFlpgUapLAKCWojU8LQTG+VKGC9QxzmqdAsKH2rtD1SXBE2aMD+EWidQu6q1af5iWcutU1paHfFc3gDUteXbaYQr4KggQfqlkAjWRetWeZz6f7dw3J7QY8ndpLnmYiuXbBfhInsOp+EE7Wzwl3vNmRLJB+00//ERB34Y+s2HXJBm1cBiggqk43/Gp4f9hkjMRDXxfLK0TEwEaaknU7b5ZFKGfG4xRlzRx0QyC1Cm34hK13nRRLq+6Y7qm9sJ25l3ZPTGyfoTJGnSlhfzmA3x2z6gSWI7JlerjcHVTbMgmq75H5AjA8n8H0pG3wlvwwoa30mGzpelClHhjL+UnF75ebKQ9ILcLJX7Zn2CR2hzcy45ZIhWtrKhxQNldxJfvuzIjLHXD0gPrbH4AoFxDWajor1FgM7J0X6Z8/sITxlNom+wJupIh36JRhmdq2Dh21wdhg0hGGVAx/2glVy/LXKBbYN0oh4DI2N6WH8Q3jHgaKlfBtlr8+O5gShlSPbVeKQELRYs6BoydtzXI3ylg8KAlXdJ2fV7JOv53LIxZfeO+CwTZDilpmqrXKVQHU1Dxy5e8xfOfseCUc7ef1WIBOrEC2TlJI+moeM/fcEOPXQ6FO1F7tNSUzBPlGe8LK9/e06+VOgCUodQ3hDpQPSsab2XgKcsgQBeYQbYOKKif5zagfW+0+GIr38/5kPMIm8V8hPmRVkPdqThICGeGZqhou8FcNSYZDtn у, Алчалуу, Өрүктү, Жийделүү деген жер аттары эмнени билдирет? Мөмөлүү токойлордун сүрөтүн тарт. Аңгеме түз."}],"pages":[43,44]},{"title":"АЛП ДАРАК","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"45\">45<\/span>АЛП ДАРАК"},{"t":"p","h":"Жалбырактары жазы, сөңгөгү кучак жеткис жоон жана бийик жаңгак дарагын көргөнсүңбү, билесиңби? Жаңгак дарагы чынында эле зор дарак. Жакшы шартта өскөндө анын бийиктиги 30 метрге, жоондугу 2 метрге чейин жетет. Жаңгак – ошондой алп дарактын мөмөсү."},{"t":"p","h":"Жаңгактын мөмөсү даамдуу, майлуу жана витаминдүү келет. Адамга күч-кубат бергендиктен, байыркы заманда жаңгакты алптардын азыгы деп аташкан. Жаңгак түрдүү ооруларды айыктырып, дарылык касиетке да ээ. Жалбырагынан С витамини алынат. Кабыгынан боек жасалат. Ал эми жаңгак жыгачынан жасалган эмеректер – шкафтар, столдор, отургучтар кооз жана баалуу."},{"t":"img","src":"data:image/webp;base64,UklGRtI/AABXRUJQVlA4IMY/AACw0gGdASr1AdkBPqlKn0mmJKoiNJcqoUAVCWluu8ROUC4FOTHtxM86MYnyn7X9x37/cuT2XwO/EL/7w//Jn807f/j+8g7rv/75Yn/3xNv+vYn8M/+/t+807MR9D//17/JIUv41p2+nPXqEI86J2wbZsOSnNQL5tE8EP7v1kuJvtWyZPcDDbL0MCxRVy2dwsuMbLvE5ylktlyNw45wRBxxK5WaPC1XjI2zVRuHEquVzElWqDEAXx/9Vw6Cs9tPgWkGM4eiqYEd7VZAWmIyh4hRXwR2Xz6ku2s2Ty/b7GBhHXwQ0uI+LQpGNzPAcsABz9KZ6b9K1VK2FCrSUhiFyUqcwIOFvyCHvxmy0e3XPF8SztOWNck966TJkf62OsM1XNOzWe37veOBe0/UK+NGcA7F0/Wg3JPuYxiDSa8y7UjNqJttrSgH2Ggj7MyQDVW2IX7EauQjfHAxhGHuJ/Q39oyatws91mSMYS28v/fN5hDJhd4jF1natuR40hUTmWaXNKq+FZ0p9Yophd+nEdPRiHSeLZqmZMPABUEF7dUE6szvTJGfRCfVqXstI13ccwqc5k0Vs6JooBLmzgsVCvy7/vK+o6v8fgErAib4qFyajS+qRaNFn94UKbPGevd+I6m65EgV5CyBE7YNvXny4rvQ4Vp6Vx35XxiaW1Ew0q0lsnXF5CNwg1BeYIRavNUKgtI9wopYauEVa8uReyVZDJvS9/aSZ3V0kW270FARdVepsJghsvgBczbfHlPGZKSHn1gQaf3XB+fQM3I7ePePbczv+tdlQYNa0DaHuLXWNzqH+MWLi3pJ7MwRGJnVfRQ0Kson429f80EUuv8EDFTmxMo9djpYkktxovxU5gIFEMAfrsENsL7pkiJxpyeQovjiN76YirzYhitiOnhcHYIiC01/RpoVx7dS8bGTgx4O8CZTlC0COmNW+EFKYtLeIH/BZGN6L/sXdFl+ErD4g9Sj6V5axrAH22Mb2Uqy04JJqSt2/+IZ8lvzl2zQl0TcOPCxzQLzLZhCiUfIElEQC68ZxYpb3jmzesbzFnQHyAPhz5SERbbsPmPnuH+xx6 нүндө дагы кандай кызыктуу нерселерди билесиң? Билгендериңди дептериңе жаз, жаңгак тууралуу аңгеме түз."},{"t":"p","h":"Кызык экен, билип ал!"},{"t":"p","h":"Жаңгактын жалбырагын кургатып, үйгө койсо күбө курт болбойт."},{"t":"p","h":"Жалал-Абад шаарында жаңгактын жалбырагынан витамин өндүрүлөт."},{"t":"p","h":"Жаңгактын мөмөсүн быша элек көк кезинде чайнаса, тиштин бүйлөсү канабай калат. Жаңгактын быша элек мөмөсүнөн күрөң боек даярдаса болот."},{"t":"p","h":"<span class=\"pg\" data-n=\"47\">47<\/span>Төмөндөгү жомокту үйдөн өз алдыңча оку."}],"pages":[45,47]},{"title":"АРСТАНБАБ ТОКОЮНДА","blocks":[{"t":"h3","h":"АРСТАНБАБ ТОКОЮНДА"},{"t":"p","h":"Арстанбаб-токою Жалал-Абаддагы Базар-Коргон районунда. Бул жер – жаратылышынын өзгөчөлүгү жана кооздугу жагынан дүйнөдөгү эң сонун жерлердин бири."},{"t":"p","h":"Арстанбабдын башкы байлыгы – жаңгак. Ой да, кыр да дүпүйгөн жаңгак дарагы. Алар ушунчалык калың өскөндүктөн, токойдун айрым жерлерине такыр эле күн тийбейт. Токойдун ичи капкараңгы болуп турат."},{"t":"p","h":"Арстанбабда түркүн мөмө-жемиштер өсөт. Алманын эле бир нече түрү бар. Кызыл, сары, кара алчалар, алмурут, өрүк, бадам, карагат, чие эң эле көп."},{"t":"p","h":"Кайың, ыргай, мырза тал, ак терек, арча, четин, шилби, карагандар кооздук учун жаралгансып, жанаша чыгышкан. Не бир сонун гүлдөр, жыттуу чөптөр желге ыргалып турат. Ар кайсы жерден оргуп чыккан тунук булактардын шылдырап акканы, күнгө чагылышып жылтылдаганы токойдун көркүнө көрк кошконсуйт."},{"t":"p","h":"Арстанбабдын жаныбарлар дүйнөсүнө көңүл бурсаң, өзүнчө эле бир зоологиялык музейди аралагандай болосун. Каалгый баскан аюу менен жортуп жүргөн карышкыр да, азуусун ташка жанган каман жана айбандардын амалдуусу түлкү да бар. Кашкулак, суур, суусар, элик, коен, көлдөрүндө түркүн балыктар, ондатралар жашайт."},{"t":"p","h":"<span class=\"pg\" data-n=\"48\">48<\/span>Сагызган шакылыктап, адам келатканын алда кайдан жар салат. Улар, кыргоол, кара боор, кекилик, чил, түркүн куштар ушул токойду мекендешет. Жазында булбул, күкүк дагы толуп жаткан куштар сайрап, токой ичин шаңга бөлөйт. Арстанбаб ушундай жаратылышы кооз, теңдеши жок жай."},{"t":"p","h":"«Байчечекей» журналынан"},{"t":"p","h":"Суроолор жана тапшырмалар."},{"t":"p","h":"1. Арстанбаб токою кайсы жерде? Аны картадан көрсөт. 2. Арстанбаб токоюнда кайсы дарактар өсөт? 3. Арстанбабда кайсы жаныбарлар жашайт?"},{"t":"h3","h":"Кайталоо"},{"t":"p","h":"1. Токойдо жашаган канаттууларды, айбанаттарды ата. 2. Арстанбаб токоюн сүрөттөп айтып бер. Картадан көрсөт. 3. Дарактардын, токойлордун мааниси тууралуу айтып бер."}],"sub":[{"title":"Кайталоо","b":10}],"pages":[48,48]},{"title":"СУУ ЖАНА ЖАШОО","blocks":[{"t":"h3","h":"СУУ ЖАНА ЖАШОО"},{"t":"img","src":"data:image/webp;base64,UklGRioaAABXRUJQVlA4IB4aAABQ8ACdASoYAkgBPrFMnEmpLC8orvrMOeAWCWdtcK8QF7wSlJHAxpp53Pxs8q9pjwizlf7z3oZKWANUe/9fyfh40k07+F8t7W0+7zXT4d/5/O98X/4f/75T/kX9n/6/5nt9f/myf5r//8ff/qzB//3qP+J6m/P+tv0XzKakPoYWayPBkeD9gSv7MQWYOXd1QB1tEhM8vkB5HuBvLvu+lJmdq3m3Ri7nU9yNunuSG3GAYN3rQ1QpYAlZpCNSR2yi+fZcRZE0dEcz1K7U9BNk5GCCOOnsJZdt9Yoa0MaY9H0jXpHea+c0AVzJCGTUSCD61Sf4NLGUFwik6ovls3AA4+NC5AlzFPj6k+2OgMa+bKK4Bm4VI3ljeJ0Sjps7XbKDLsLqXWIjSohW/7XlT16/lWgQF8Tr6h98CWDBx7yAHFadNbTEYNGMqid1Uj4m/kgSd2z/0hzvfeAQWN61K1CA7F2PMl47LaT6L1telZQz6JPwwAQAcVfqeCTl86vKmlFymn5v7kC0LJCjxHXy4MwjnOVDyBswSsie6IWLko4gTIxVcVElQZuUTYHaREsSQAmjGUhfks0qvJqw8MYh2F8H0RXzXJscv2CP3f3/ZR8CRf2lyud4kB7b3hIwwMi807zZ3l2i6okO5HZjMFNAi324cI1SYwWMxuOMkd7x1Etx4F7/vF6Pdw8D3RXLKsoeitD1K6knFYLSbbBmX1S8im9Jf3WSDQb/Zw5D/0on+aHiXwOTZEAzVNxmBwv8V434y5Gojv0MgvVf9YHMJ/w6nFVH02lt/Le8fJQshgpcOBu7xL1fpoWR8ld42nzyHMbAw6Pha0sL6PHf8tvtpLkTqfo3rgPZp+l8A7SdyRQkJOtwF8wVF3BsEYGqpRInMHoyZuJ2hooSNUcUIlXP87vpq37umDZa9ljqvo3rGIZ/pblJR3Iuq84RSywjjTZ5Tm5WUR38GZPJZMXtZG3rLIEy8bI0/24Bk/vh3FsIJn8IFOnWHp3qpaYuvn9vCONJZftUVAqvjbDRe7nmFFASK9yO7704T08VTiGo4MOdj3kMnXbPT4GU9+xaIssFcnG+qCsS1acQngEr1k3A1skiL43yK2g2z7kgXkKfVMGYfbNeCwAlfh26CrGAVEkiJiWrenPyN24YthX2SIJHSHcmLqFr5KRynkhSGYukwJCfXuKUKj251BG31Dc5DG61bs+qsqy3siOQ/j1DKZrHp7WqloLzG \"pg\" data-n=\"49\">49<\/span>Сугарып койсо, жер жапжашыл болуп көркүнө келет. Жер сугаруунун ыгын билген адам сугатчы деп аталат."},{"t":"p","h":"Жан-жаныбарлардын бардыгы суу ичет. Кыбыраган кумурскадан тартып, зор пилге чейин бардык айбанаттар суусуз жашай албайт. Суу – жердеги табигый байлыктардын бири."},{"t":"p","h":"Суроо жана тапшырмалар."},{"t":"p","h":"1. Суунун жашоо-тиричиликтеги маанисин айтып бер. 2. Эмне үчүн сууну кайнатып ичүү керек? Кайсы учурда суу ден соолукка зыяндуу? 3. «Суу жана жашоо» деген темада аңгеме түз. 4. Макалдарды чечмеле: «Таза болсоң, суудай бол, баарын жууп кетирген», «Суу – тилсиз жоо», «Суу сыйлаган зор болор, суу кордогон- кор болор»."},{"t":"v","l":["Сөз үйрөн.","Сугатчы, шүүдүрүм."]}],"pages":[49,49]},{"title":"СУУНУН КАСИЕТТЕРИ","blocks":[{"t":"h3","h":"СУУНУН КАСИЕТТЕРИ"},{"t":"p","h":"Сабакка карата суроолор."},{"t":"p","h":"Суунун түсү, жыты барбы, көрүнүшү кандай? Суукта суу кандай абалга келет, кайнаткандачы? Суунун касиеттерин аныкташ үчүн төмөндөгүдөй тажрыйбаларды жасап көрөбүз."},{"t":"p","h":"1-тажрыйба. СУУ – ТҮССҮЗ. Боз, көк, сары, жашыл, ак, кызыл түстөгү кагаздарды даярда. Сууну кагаздардын түрлөрү менен салыштыр. Сууну кандай түстө деп айта аласың? Тажрыйбада суунун түсү жок экенин байкадың. Демек, суу – түссүз."},{"t":"p","h":"<span class=\"pg\" data-n=\"50\">50<\/span>2-тажрыйба. СУУ – ТУНУК. Кашыкты адегенде стакандагы сууга, анан сүткө салып көр. Суунун ичинен кашык көрүнөт. Ал эми сүткө салган кашык көрүнбөйт. Демек, суу – тунук."},{"t":"p","h":"3-тажрыйба. СУУНУН ДААМЫ ЖОК. Канттын, лимондун, пияздын даамы кандай? Кант таттуу, пияз ачуу, лимон кычкыл. Сен ар бир тамактын даамын билесиц. Ал эми суунукун билесиңби? Таза суунун даамы жөнүндө эч нерсе айта албайсың. Анткени таза суунун даамы болбойт. Жаратылышта шор суулар кездешет. Алар туз даамданат. Ысык-Көлдүн суусу туздуу."},{"t":"p","h":"4-тажрыйба. СУУ – ЭРИТКИЧ. Үч чыныга суу куйгун. Биринчисине кант, экинчисине туз, үчүнчүсүнө майдаланган бор сал. Чыныдагы сууларды аралаштыр. Кант, туз салынган суунун даамын татып көр. Бири таттуу, экинчиси ачуу болуп, кант менен туз көрүнбөй калды. Бор суунун түбүнө чөктү. Кант менен туз кайда кетти? Алар сууда эриди. Ошентип, суу кээ бир заттарды эрите алат. Суу – эриткич. Бор сууда эриген жок. Кээ бир заттар сууда эрибейт."},{"t":"p","h":"Муздаганда суу тоңот, 100 градуска чейин ысытканда суу кайнап, бууга айлана баштайт."},{"t":"p","h":"Суроолор."},{"t":"p","h":"1. Сууну сүрөттөп айтып бер? 2. Суунун түсүн, жытын, тунуктугун кантип аныктоого болот? 3. Суунун эриткич экенин кантип билдиң? 4. Шор суунун даамы кандай? Эмне учун шор суу деп аталат? 5. Суу менен сүттү салыштыр. Окшоштугун белгиле. 6. Суу жөнүндө аңгеме түз. Табышмак ойлоп тап."},{"t":"h3","h":"<span class=\"pg\" data-n=\"51\">51<\/span>Табышмакты тап"},{"t":"p","h":"Узун узун уз келет, Узун бойлуу кыз келет."}],"sub":[{"title":"Табышмакты тап","b":10}],"pages":[50,51]},{"title":"ЖААН КАЙДАН КЕЛЕТ?","blocks":[{"t":"h3","h":"ЖААН КАЙДАН КЕЛЕТ?"},{"t":"v","l":["Сабакка карата суроолор.","Жамгыр, мөндүр, кар кайдан келет?","Булут кантип пайда болот?"]},{"t":"p","h":"Асманды булут каптап жаан жаайт. Булут кантип пайда болот? Муну тажрыйба жасап, байкап көрсөк болот. Тажрыйба. Идиштеги сууну ысытабыз. Суунун үстүнө муз салынган табакты тособуз. (сүрөттү кара.) Бир аздан кийин муз салынган табактын түбүндө тамчылар пайда болот. Анын сууга таамп жатканын көрөбүз. Ошентип, суудан чыккан буу жогору көтөрүлүп, муз салынган табакка урунганда муздады. Муздаганда кайра сууга айланып, идишке тамчылады. Демек, суу ысыганда бууга, муздаганда кайра сууга айланат."},{"t":"img","src":"data:image/webp;base64,UklGRtw7AABXRUJQVlA4INA7AACQzQGdASoXAjcCPrVQo0unJKslKlKbuWAWiWVukhR8a+JWUgsAo4NtrCLrNCrzlj7jxD7tZXVQj+5uEDOe4Not9aqJl5Cy+PIvvr4z+y7+x/Te1f/yXRH/PkN/+f+j7G//Ptaf7msU389Jvz/4qlZn1fcrzrf/965JAlcuGgbXMa3acP2f+SuXDQP/Zv96Pt/K9f0xwZhSLUXu2GtjpoHFM21N1IrFBwPiEkB+Ec9sKvmOgHsr0Avy0aW0ApI9t0bCBA4txiLAi4vpKvL/8oFI7yscL2qMouPJpDF4XkujIhcJ LgmBycbwscHITadG4veEj24mjLCwCY0EfzqOzWM44GHNjfGSItxnxogx5sV9eXeDRKIMJJ6YIswXy9exW0iM0FwE2ONmZLQJlkcJJwljYCzlHAAAAAA=","w":535,"ht":567},{"t":"p","h":"Ушундай эле кубулуш жаратылышта да болот. Суу жер бетинен, дарыялардан, көлдөрдөн бууланып, асманга <span class=\"pg\" data-n=\"52\">52<\/span>көтөрүлүп чыгат. Бийик жакта суук болот. Ошондуктан тоолордун чокусундагы кар менен муздар оңой менен эрибейт. Суунун буусу бийикте муздап, адегенде тамчыларга айланат. Андан кийин тоңуп, карга өтөт. Суунун тамчылары жана кар бизге ак булут болуп көрүнөт."},{"t":"p","h":"Булут жеңил болгондуктан, аны шамал айдап туш келди таратат. Булут жер бетине жакындап, жаан болуп жаайт."},{"t":"p","h":"Суроолор жана тапшырмалар."},{"t":"p","h":"1. Буу эмнеден пайда болот? 2. Буу кайсы убакта тамчыга айланат? 3. Булут кантип пайда болот?"},{"t":"p","h":"4. Жаан-чачын, кар кайдан келди? 5. Жаратылышта суу кандайча айланып турат? 6. Идишке суу куюп, муздаткычка кой. Суу тоңуп, музга айланат. Музду жылуу жерге койсо эмне болот? 7. Муздан эриген сууну бир нече күн ачык коюп кой. Эмнени байкадың? Мындан суунун суюк, катуу, буу абалында болорун билдин."},{"t":"p","h":"Суюгу – суу, катуусу – муз, бууланганы – буу деп аталат."}],"pages":[52,52]},{"title":"АТА МЕКЕНИМДИН СУУЛАРЫ","blocks":[{"t":"h3","h":"АТА МЕКЕНИМДИН СУУЛАРЫ"},{"t":"p","h":"Жаратылышта суулар ар түрдүүчө аталат. Булак, өзөн, дарыя, көл, көлмө, деңиз, океан дегенди уккансыңбы, көргөнсүңбү?"},{"t":"p","h":"Жер алдынан сызылып агып чыккан суу булак болот. Тоо башындагы мөңгүлөр эрип, сууга айланып, ылдый карай агат. Туш-туштан агып келген суулар кошулуп отуруп, өзөн пайда болот, өзөндөр дарыяга, дарыя көлгө, деңизге, океанга куят. Ошентип, суу көбөйөт."},{"t":"p","h":"<span class=\"pg\" data-n=\"53\">53<\/span>Ала-Тоодогу ак мөңгүлөр суунун кенчи. Көк кашка мөлтүр суулар кыргыз жерин аралап агып турат. Өзөн, дарыя тынбай агып, агын суу деп аталат."},{"t":"p","h":"Агын суулар көлгө, деңизге, океанга барып кошулат жана талааларды сугарат. Чуңкур жерлерге суу толо берип, көлмөгө, көлгө айланат. Кичинекей көлмөнү өзүң да жасап аласың. Таштарды үйүп, агын сууну тоссоң, кичинекей көлмө пайда болот. Картада суу көк түс менен белгиленет. Дарыялар ийри-буйру болуп, көлдөр көк тамчыга окшоп турат."},{"t":"p","h":"Дүйнө жүзүнүн зор мейкиндигиндеги сууну көл деп атоого болобу? Албетте, болбойт. Булар – океандар. Океан ушунчалык терең жана чоң. Ага салыштырганда көл бир тамчы сууга окшоп көрүнөт. Көлдөн чоңураак келип, океан менен байланышып турган суулар деңиз деп аталат. Ошентип, жаратылыштагы суулар булак, өзөн, дарыя, көл, деңиз, океан деп бөлүнөт."},{"t":"p","h":"Суроолор жана тапшырмалар."},{"t":"p","h":"1. Булак, өзөн, дарыя, көл, деңиз, океанды кандай элестетесин? Сүрөттөп айтып бер. Салыштыр. 2. Дарыялар кайдан агып келет? 3. Көл чоңбу, океан чоңбу? 4. Кыргызстанда океан, деңиз барбы? 5. Төмөндөгү сөздөрдү оку: булак, өзөн, дарыя, көлмө, көл, деңиз, океан. Агын сууларды жана акпаган сууларды өз өзүнчө бөлүп жаз аңгеме түз."},{"t":"p","h":"Сөз үйрөн."},{"t":"p","h":"Булак, өзөн, дарыя, көлмө, көл, деңиз, океан."}],"pages":[53,53]},{"title":"БУЛАК","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"54\">54<\/span>БУЛАК"},{"t":"p","h":"Сабакка карата суроолор."},{"t":"p","h":"1. Булакты көргөнсүңбү? 2. Булак кандай болот? 3. Кандай булактарды билесиң?"},{"t":"p","h":"Айрым жерлерде жер алдынан тынымсыз суу агып чыгып турат. Туптунук, муздак жана таза суу. Бул суу жер алдынан качан чыкканы бизге белгисиз. Түбүнөн таштары көрүнөт. Муну элдер булак деп аташат. Кыргызстанда булактын аты коюлган жерлер көп. Мисалы, Миң-Булак, Тогуз-Булак, Кара-Булак, Шор-Булак, Сары-Булак, Алтын-Булак жана башкалар. Жер алдынан жылуу суу да чыгышы мүмкүн. Андай булактар дарылык касиетке ээ."},{"t":"p","h":"Суу чыгып турган жерди «булактын көзү» деп коюшат. Булакты булгоо жарабайт. Булактын көзү бүтөлүп, суу чыкпай, соолуп калышы мүмкүн."},{"t":"p","h":"Кээ бир булактарга эл сыйынат. Суусуна тыйын таштап, жанындагы даракка чүпүрөк байлап, бата кылып өтүшөт. Булак жанындагы даракта чүпүрөктөр байланып, желбиреп турганын көрдүң беле? Ал – мазар булак деп аталат."},{"t":"p","h":"Сен жашаган жерде да булактар бар чыгар. Алардын ар биринин өзүнчө аты жана тарыхы болууга тийиш. Кыргыздар булакты ыйык деп өзгөчө баалашат. Сен да ата-бабаларыңдын жолун жолдоп, булактын суусун булгаба! Булакка чөп-чар толсо, алып ташта."},{"t":"p","h":"<span class=\"pg\" data-n=\"55\">55<\/span>Суроолор жана тапшырмалар."},{"t":"p","h":"1. Булакты сүрөттөп айтып бер. Булактардын атын ата. 2. «Булактын көзү» деп эмнени айтабыз? «Булактын көзү» бүтөлсө эмне кылуу керек? 3. Мазар булак көргөн болсоң, сүрөттөп айтып бер. 4. Эмне үчүн элдер булакты ыйык деп баалашат? Булакты дарыя менен салыштыр, окшоштугу барбы? 5. Булакка байланышкан жердин аттарын ата жана дептериңе жаз. Булак жөнүндө аңгеме түз."}],"pages":[54,55]},{"title":"ДАРЫ СУУЛАР","blocks":[{"t":"h3","h":"ДАРЫ СУУЛАР"},{"t":"p","h":"Азык-түлүк дүкөндөрүндө бөтөлкөгө куюлган минералдык суулар сатылат. Сыртында «Ак-Суу», «Ысык-Ата», «Кара-Шоро», «Бар-Булак», «Гималай», «Жалал-Абад» деген жазуулар бар."},{"t":"p","h":"Минералдык суулар тунук жана жытсыз, кандайдыр бир даамы бар. Эл аны дарылыкка ичет, алар боор, ашказан, ичеги, бөйрөктүн ар кандай ооруларын айыктырууга жардам берет. Ошондуктан аларды дары суу деп аташат."},{"t":"p","h":"Дары суулар кайдан келет, аны адам жасайбы?"},{"t":"img","src":"data:image/webp;base64,UklGRvAtAABXRUJQVlA4IOQtAACwWwGdASqAAgEBPp1Gm0mlpCkkOHZbeSATiWluSPwq9rhtO5Bw6Jer1Lvbja50Y2XE5zfx847/zXt+7Hvywf9Xi2/7+u35P/9vaW8//WdOof+/qukA6TQt3VwSOPcPYHxxEOFtgYOR0MyomV7VvLJyfGsyAswl3PmK1GmTxEk5y3YDa1U63qEkHsasH34wXvr9U2lRYUX16Xk6GWU0zbfLsuhszE9j84w+tiAN/3BdNQQAymlN0b1CT2ty1pNDKpd54p5Vb+7naw8S7/OShLV9njUhMG+iB6ztysb7NdcHRjGkUKF9kGfp2NQpllx2s0dLhCigg4NL3IYQhVypVw9nz81SlwTkOVWA5H7JF/0JdOlgPCtiHss3RP+JXZ30v0X0f1b0Qxd6wpi6GWG/uZCAQGf83ARheOXGO8uor2mzj9mA//xXcgimfYOdhYUxpvU4XtcOXXtx9wJRzPsBRtnfME3hM1iKy+RRHgQfR7gxjB7UFKUcKZHO1ejQ5Xi7yvS3MWxT рсуң? Жер алдынан чыккан суулар топурактын тереңиндеги ар кандай туздарды, түрдүү заттарды эритет. Эриген туздун даамы суудан билинип турат. Ошондуктан дары суулардын даамы кадимки биз ичип жүргөн сууга окшобойт. Ар кайсы жердеги дары суулар ар башкача касиеттерге ээ, даамы да бири-биринен айырмаланып турат."},{"t":"p","h":"Эсине тут!"},{"t":"p","h":"Адамды айыктыруучу суу чыккан биздин жер кандай гана керемет! Ошондуктан жерибиздин суусун, топурагын көздүн карегиндей сактайлы. Эгерде акыр-чикир төгүп, жер семирткичтерди ыксыз чачып, топуракты уулантсак, булгасак, анда дары булак тургай, кадимки сууларыбыз да ичүүгө жараксыз болуп калат. Таза суу таппай калышыбыз мүмкүн. Булганыч суу адамдын ден соолугун бузат."},{"t":"p","h":"<span class=\"pg\" data-n=\"57\">57<\/span>Суроолор жана тапшырма."},{"t":"p","h":"1. Кыргызстанда кандай дары суулар бар? Атап бер."},{"t":"p","h":"2. Курорт кандай жерге салынат? Кайсы курортторду билесиң? Атап бер. 3. Дары суу кадимки суудан эмнеси менен айырмаланат? 4. Сен жашаган жерде дары суулар, ысык булактар барбы?"}],"pages":[56,57]},{"title":"ДАРЫЯ","blocks":[{"t":"h3","h":"ДАРЫЯ"},{"t":"p","h":"Сабакка карата суроолор."},{"t":"p","h":"Дарыяны көрдүң беле, ал кандай болот?"},{"t":"img","src":"data:image/webp;base64,UklGRiIWAABXRUJQVlA4IBYWAABQyACdASoXAhcBPrVSnkqnKLAnLTX8GgAWiWduH5GvCF3liDkVCAzq7pCOc5ZDhHb9cbJwAvCRy1HA//11nfbetMv8d/2//7/2/NX5pf9v733V8wf4P/75Af+xmD//+0J/06+w/To+XdLl1oaP6G3lsHxGNw0fj3H4/M7KqRZd7buoRVTLfJ86rYlgAXrvXbZVDLWzRaBo4luULb7Ymao8hhbU59KCzaNRt8g5zW7BkL6eskVUr/9PAEKL/T6FbrJQYKyUqlAADwudxD+h+VWhZQWfejuhM9xTLEBxwmDYJkYVIIinUTUbQ0RklrPcsyKCP0pHSSCWl2+zkPxzDqZ0KntdcHxEzsdLuCSXEUYKdbHkaoMoZA3wYxczOqF+IZgkndvDVyFt/2rKEHmCSuuhxfBUoBM65+e89QMW7e1pgCIuwZp6XPE/5r+LJKlxhR1AtG8j46JnxZotmkTLW216qKOaO4ZWhvkBzakyGgUTqh9/N5TAk89u+kNGFAqELTq6X5Rvs/hhtadmSKchepJhom3GLNKV7QOf+Ik0Xvnt8kQDzd4BVXxKLwO3aW65SabFsb6LRF9m3sqXJZ8OwqRO7k9MVATrjo+xnyMhrmdCIWGI92+nPNzhMhwbccoDb7gDIqsmYTaqL8cSkzWKbxB0XtDtFukqfHzYd5sWiBMN5g7cyZQB6Q+A62JD892PROw ир-бетон тосмо менен бөгөйт. Суу тосмонун тешиктеринен күч менен агып чыгат. Суунун жолуна турбина орнотулат. Турбинанын ичинде болот калактуу дөңгөлөк бар. Суу шарылдап күч менен агып келип, калакка урунганда дөңгөлөк айлана баштайт. Мына ушул жерде электр тогу пайда болот. ГЭСтен тартылган зымдар бизге электр тогун алып келет. Зымдар бийик мамыларга тартылат. Электр зымдары ар бир үйгө киргизилет."},{"t":"p","h":"Суроолор жана тапшырмалар."},{"t":"p","h":"1. Суунун күчүн байкадың беле? Аны эмнеге салыштырууга болот? Сүрөттөп айтып бер. 2. Адамдар суунун күчүн кандай пайдаланышат? 2. Электр тогу кантип пайда болот? 3. ГЭС деген эмне? Нарын дарыясында эмне деген ГЭСтер бар? 4. Электр тогу үй ичине кандайча киргизилген? 5. «Суунун күчү» деген темада аңгемелешкиле."}],"pages":[59,59]},{"title":"КӨЛДӨР","blocks":[{"t":"h3","h":"<span class=\"pg\" data-n=\"60\">60<\/span>КӨЛДӨР"},{"t":"p","h":"Сабакка карата суроолор."},{"t":"img","src":"data:image/webp;base64,UklGRugVAABXRUJQVlA4INwVAADwyQCdASoWAgcBPrFQnUmnLK+mr9dryfAWCWlt2YDEB5zpk3GekjOvLTnLKOX+55UQy6hP+emzunJ5eTJ2/x3/V//3Zbf//7r089i/w3/v4Ycwv/76M/hP/jr1s/62SuncbrkPocT78JzdQahCkpb+NjD2YOoQ3eblwnh9m0WqKaWt4F7D/GusXxsNc/zYIt5AcdnJfKWLl35x1hmdkKzfWklB0TCaXcwykSeCfncUn0W3Ut9HfjRsUQn4luQo06PfWkQwU0N7S3Xq2sFCYdy0L7UFbJxhnINPdivv2EV25XpPemn/vPkv+D4ZrQs+iHnCUYctR7UqugIca8L4AmvXMgGTVZ9h0AKcXzEiBaTaZOUg0CKeHwitZTxLF5QHlwXcMICFclzaNurCzVxtpSmw5VdSh2qfW6KcXd9qGnkbB4+QWmgy+C9krsfZO9PkgggFXAZs/JhECiHki8M/KKnsAzZf5A4MVfFMEbt9AuKMQx5U3ueIWIdsywwWFoLykoXz3BmYR6fT4L97vLrR93Ie7/O4lWEjaX8/VdO2erL+AmeD1G1BVwcJkc31Dh9xEHtXohg0ingjmFQ8zwEVvxerhXWOt0dQAOI5OuFdbX9riD3n/cz8MpsXeKRsoVTj63e3quWUS4Nsqw7j1tMDQPlmAN6759CnhFik38RY/po36jpDH6lAT8b40M71wdxXl11cBAe1q8bXrHut4F1xhD9a6sqKWhN14BFWNLB6+6IDQqtKbh2LKjLnu+yk40LdEOJtT/luMxFn9icOCn/UFb/Cnt6E/ehfXpTbgzicGvLsg3rYws1Vzir8x1g+SAcf33V8aqzhnN3yDS46UTYvh5Uj9w4g4v8iu2KPdAgobKGgwefYN6WkTZxSUkP6qLo5Rwn4hWpUb/drUw+NnQ00V9O9OeY4oNtRrGJGpA8bI1Mjw5TFaRSE0W1duHJOcQQ/qt6KRxm8rpe7A7u28RZm8yhpGdyN/0PVp86fyNxlpIQBx чты салыштыр. 6. Картадан көлдөрдү тап, көлдүн сүрөтүн тарт. «Көл жээгинде» деген темада аңгемелешкиле."}],"pages":[60,61]},{"title":"ЫСЫК-КӨЛ","blocks":[{"t":"h3","h":"ЫСЫК-КӨЛ"},{"t":"p","h":"Сабакка карата суроолор."},{"t":"img","src":"data:image/webp;base64,UklGRkweAABXRUJQVlA4IEAeAADw/ACdASoVAgQBPq1Km0mmK6Yms9V7iXAViWdtNBkKdOsMKhGGMu3UK+8sLZn6rU+/MDaHZ5vlXAzorqJ7wRc+tp9dq9ef3AHxk/Hv87qkJ0Fd9eB///UN1Kf9fXpN5+KzV7ZQTpBJfWe/NpTJCNCWpldJLKyhaEa/i/7siuYrlBG5dFYNdYesFRwbZTnI3LWd//TV0kjN8jFF0sPH/r3Dgi07SgsCNA5nm6syucinZL2HKMALRuf+0Ii/D5YQ5pikb1NsGxSac7Z2MYD+7EEAJ6ulC41JPx+JODZ79xTawMBgyKt9spqIMZN2I+NgYKAH0ctt2MTGEr8QU6eY/Iyu81xt42wxmI+7MCO1GVn0TXAVtl9pKUeFtfeMKkBp/BZ3HiYy8FG1Q1iIZz537O9wG8NJ/PI6xpPm878So9k2WgLF4jGt31K0vZEn7Aa/MoPTaaiBOz0HmlVYqEpLmN4Rz9mkUfgm7NpvdR7C3MZpCnFamgAWVpdu4uQuZFiFjSMUvu5DiunSy4XaAuyvwCSfW6peDAlK0DNHInkgOXxGBC/8vOIal0nKgRu6K0QJ2O1WVlv0+N6eUV3keCxAphd+5wqAN49MrwzfxES70WvC3FAZvSFLROeJlnHyoCOyyUDa1Q9hn28bapBn/A3QxZK4nI17agVqdR7shsuZEgpP1Q/qBaSDxvzf+ub7iNThy82LoJEaeOga8ecn8R04+1OkH0jIUdpJgYIBf1NAbjvI28RvU1cx3+ITdxGaC2SOz3/Rmw5pzYY9T0hIXDRWxaQU8iKp6A4/IWOZPM71dg1p20kcmz3/synirWXL+EAqeFiXCGCAfm7qPW+zQsUtZ9VgkKzHrxbwkYHHvB01LW+fvDkoRz8Jn0b6UYg8VftUSa8/WJZWGaLowu3sUz1jWkZCxlh3vBjmLAxUMzSaMXS2FV7n5EQK/LAOYf220/F6ywUwD0D9RH/R0Ap6P7uN4s5EZI0wOcg/7EoEQ3nK5JCIC52Ww8+ZnjBSHHeTQUSekv+1nNI1nG4QPLyDrTfcSO+gKsevOX37eO6e5XSDQB4QgafhCQWIrRa1vNv+Su35cbBGDXXLoNSNP15qbgJWVI+ra10w3QxLpzwiJbYzYap/dHft8xON9QOjHMmAnm1isXEz8zD/Q/7C5OLfB/I00dInmnE+aS0FpuOtoXTF+GfR+IJn9tXT64B7m+/MsNW0m7XyXFP+cJCQw+vSIwsTJUbjmhWAPFhapCezmJUqdwSSS2eR4LHYpywXr4vhRwgEPJx9g8jNbJXoo8chsn/0jJ6gc6Uatav6iZYUlSrg6Mt0yOUKzZ07PwA1X8DkmszdHRsqbu+Wa3Y+u0ehWC0WL8neaa1Zs7XNUhNGJWSmDe+z8NGkx2i95vUkW2vw8kC2kFDNZgZ395vl7MYT73pzV/3TDwgwC5wP9rdhghpauXetAhPMHQi7oHCaYeeU3jl1vo7bFN5WRbHCtDutc+siPV+BsZ/OYIm1otyfRId/lC87DSWcZ6NgfKr6L3UVGt6HjOO3QxwSwUMVXPCOM2ljvSSB3zyf4iH3S3chIoWIUliOKgttSCBK+ID/xT/8o6XZH3WaWpxsieTiF60CR7QhfZyTv9JF70+y5IFJSbkMhDv6GHWLYWdUbxdKHa8F9ZlH+lvpOgixclEr4DmFY9zP3pYbzTDLNLiD4TGA2af4JNk6a0pfZh
